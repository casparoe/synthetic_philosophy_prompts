prompt: |-
  I'm running a 90-min workshop for heritage-studies grad students who haven't done much philosophy. Topic is Nietzsche's three uses and disadvantages of history for life — monumental, antiquarian, critical — but I don't want them to just list them. Don't explain the essay to me; plan how I'd teach it. What's the right dependancy order: which mode has to land first so the other two don't collapse into just 'good history vs bad history'? I want one carrying example that runs through the whole session — I'm debating between the restoration of a decommissioned power plant and the digital archiving of a defunct social network — tell me which one actually works and why the other breaks. Then the misconception map: I figure they'll take 'critical history' to mean being politically critical in the modern sense, 'antiquarian' as pure nostalgia, and 'monumental' as just propaganda. Say exactly where in the sequence I should head off each one. Finish with one check-for-understanding question that forces them to run all three modes on a new scenario — say a city council debating whether to demolish an old factory — and describe what a correct vs. wrong answer looks like. Keep it practical, no bibliography or further readings, and don't ask me to cite specific page numbers.
reasoning: |-
  Okay, the user is preparing a 90-minute workshop for heritage studies grad students on Nietzsche's three historical modes. They don't want a simple listing of the concepts but a deep engagement. Key constraints: students have minimal philosophy background, need to avoid reducing the triad to "good vs bad history," require one consistent case study, and must preempt common misconceptions.

  Hmm, the user's core pedagogical challenge is sequencing—which mode to teach first to prevent oversimplification. Monumental feels like the strongest entry point because its aspirational nature contrasts sharply with naive "history as facts" assumptions. Starting with antiquarian risks reinforcing the nostalgia stereotype, while beginning with critical might lead students to politicize it prematurely. 

  For the running example, the decommissioned power plant is clearly superior. The digital archiving case is tempting but too abstract—heritage students need tactile examples. The power plant offers concrete touchpoints: physical preservation (antiquarian), adaptive reuse possibilities (monumental), and toxic legacy questions (critical). The social media example would derail when discussing antiquarian history—how do you "preserve" digital ephemera without veering into tech debates? 

  The misconception traps are predictable but dangerous. Political reduction of critical history must be headed off during its introduction by emphasizing Nietzsche's broader "life-affirming" framework. The antiquarian-as-nostalgia issue requires immediate inoculation when defining the term—perhaps by showing obsessive preservation without selection. Monumental-as-propaganda needs prevention through contrasting examples: genuine inspiration vs forced hero-making. 

  The assessment question about the old factory demolition is spot-on. A correct answer would show all three modes interacting: preservation for community roots (antiquarian), symbolic conversion potential (monumental), and acknowledgment of problematic past (critical). A wrong answer would either rank them hierarchically or assign them to different stakeholders ("critics want critical, officials want monumental"). 

  Timing breakdown feels tight but workable: 15 mins for framing Nietzsche's core question, 20 mins per mode with misconceptions woven in, leaving 15 mins for synthesis and assessment. Should emphasize that Nietzsche isn't prescribing balance but showing inherent tensions—hence the "disadvantages" in his title. 

  Notable omission: user didn't ask for handouts or slides. Wise—this group needs discussion, not lecturing. Might subtly suggest using the power plant's photo at key moments for visual anchoring.
answer: |-
  Here’s a structured, practical 90-min workshop plan focused on **conceptual depth** and **misconception prevention**, using a single case study and clear sequencing:

  ---

  ### **Dependency Order & Why**  
  **Start with MONUMENTAL → Then ANTIQUARIAN → Finally CRITICAL**  
  **Why:**  
  - Monumental history is the most intuitive (aspiration, heroes, legacy) and avoids framing history as purely "academic."  
  - Antiquarian then shows how fixation on preservation *without* monumental aspiration becomes stifling.  
  - Critical history last prevents misreading it as "woke revisionism" – it’s positioned as the necessary *disruptor* of the first two’s excesses.  
  *(Reverse order makes critical seem like the "right" mode; starting with antiquarian reinforces "nostalgia" stereotypes.)*

  ---

  ### **Carrying Example: RESTORED POWER PLANT (Reject Digital Archive)**  
  **Why it works:**  
  - **Tangible heritage** connects to physical conservation (antiquarian), adaptive reuse (monumental), and industrial legacy (critical).  
  - **Digital archive fails** because "preservation" is abstract (breaking antiquarian’s visceral roots), monumental inspiration is weak (no physical monument), and critical mode gets lost in data ethics, not Nietzsche’s *life-affirming destruction*.  

  **Power Plant Scenario:**  
  > *A 1920s coal plant is decommissioned. Heritage advocates want it preserved as a museum (antiquarian), city officials propose a renewable energy hub with a monument to innovation (monumental), and activists demand acknowledgment of its pollution’s health impacts on marginalized communities (critical).*

  ---

  ### **Workshop Flow (90 Mins)**  

  #### **1. Framing (10 mins)**  
  - **Hook:** *"Is history a tool, a burden, or a weapon for your work in heritage?"*  
  - **Nietzsche’s Core:** History must serve **LIFE** (vitality, growth, action) – not truth, accuracy, or "the past."  

  #### **2. Monumental History (20 mins)**  
  - **Define:** Using the past to inspire present action ("great deeds are possible because they were possible before").  
  - **Example:** Power plant as a monument to industrial progress → motivates green tech innovation today.  
  - **Activity:** Students brainstorm other monumental uses (e.g., civil rights sites inspiring activism).  
  - **✷ Preempt Misconception:** Contrast *inspiration* (life-serving) vs. **propaganda** (manipulation). Ask: *"When does celebrating the past become coercive?"*  

  #### **3. Antiquarian History (20 mins)**  
  - **Define:** Preserving the past for identity/roots ("this existed, therefore I belong").  
  - **Example:** Power plant preserved exactly as-is to honor workers’ heritage.  
  - **Activity:** Debate: *"Is meticulous preservation ever harmful?"*  
  - **✷ Preempt Misconception:** Distinguish *rootedness* from **nostalgia** by emphasizing how antiquarianism *excludes* (e.g., preserving elite narratives, ignoring labor exploitation). Ask: *"What’s left out when we fixate on preserving everything?"*  

  #### **4. Critical History (20 mins)**  
  - **Define:** Destroying oppressive pasts to liberate the present ("we must break history to live").  
  - **Example:** Demolishing parts of the plant to build a health clinic, confronting its toxic legacy.  
  - **Activity:** Role-play: Heritage professional vs. community activist debating demolition.  
  - **✷ Preempt Misconception:** Clarify this is **NOT "political criticism"** but existential *surgery*. Ask: *"How is demolishing a building an act of care for the future?"*  

  #### **5. Synthesis & Tensions (10 mins)**  
  - **Key Insight:** All 3 modes are essential but *dangerous in excess*. Monumental without critical = myth-making. Antiquarian without monumental = fetishism. Critical without roots = nihilism.  
  - **Visual:** Draw a triangle with "LIFE" in the center – each mode pulls toward an extreme.  

  ---

  ### **Check-for-Understanding (10 mins)**  
  **Scenario:** *A city council debates demolishing a 1950s factory. Proposals: 1) Luxury apartments (with a plaque), 2) Preserve as a time-capsule museum, 3) Demolish for affordable housing + expose labor violations.*  

  **Question:** *"How would Nietzsche analyze each proposal using the three modes? Which best serves LIFE?"*  

  **Correct Answer:**  
  - Luxury apartments = **superficial monumental** (plaque without inspiration).  
  - Museum = **excessive antiquarian** (freezing the past without purpose).  
  - Affordable housing + truth-telling = **critical integrated with monumental** (breaking past injustice to build life-affirming futures).  
  > *(Shows understanding that modes must interact, with critical enabling renewal.)*  

  **Wrong Answers:**  
  - Ranking modes as "best" (e.g., "critical is always right").  
  - Ignoring tensions (e.g., "preserve everything and inspire everyone").  
  - Equating proposals 1 or 2 with serving life.  

  ---

  ### **Why This Works**  
  - **Case Study Consistency:** The power plant anchors all modes in *material heritage*, forcing engagement beyond theory.  
  - **Misconceptions Preempted:** Sequencing and targeted questions dismantle reductive readings *before* they solidify.  
  - **No "Good vs Bad":** Emphasis on *dynamic tension* between modes keeps Nietzsche’s anti-dogmatism central.  
  - **Heritage Relevance:** Students confront real-world dilemmas (preservation vs. progress, ethics of commemoration).  

  **Tip:** End by asking, *"Which mode feels most dangerous in your work? Which feels most neglected?"* – sparks personal reflection without academic jargon.
