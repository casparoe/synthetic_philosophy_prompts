  Design a runnable in-class game for this group. Use simple materials — maybe index cards and token pools — with clear rules, assigned roles if they help, and a payoff scheme in points (no real money) that makes contributing data about the resource costly but using others' data free. Include a timeline for rounds, how information about depletion gets revealed or hidden, and a debrief that maps specific moments in play onto either resource extraction or second-order free-riding on information. Tell me honestly what will predictably go wrong the first time I run it, and be frank about which feature of real ecological collapse this classroom version just can't reproduce and I have to supply verbally. Also please push back plainly if I'm mushing together concepts that don't actually belong together — I don't want to force an activity onto a confused framing just because I used to work on boats.

  A little background that might matter: I was arguing with friends at the marina about whether fishers ever voluntarily limit catch without a regulator, and someone said they'd just free ride on the restraint. I want the students to feel exactly why that intuition is structurally right even when every player means well. The rules and incentives should make them run into the coordination failure themselves; no lecture up front, and they shouldn't hear the name of the idea until the debrief. There's also a typo in my notes I can't find, so don't worry about matching anything exactly — just make the activity work.
