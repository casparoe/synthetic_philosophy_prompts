answer: |-
  Below is a **runnable 90-minute workshop** designed for your grad seminar. It uses simple materials to create a visceral experience where students discover how monitoring collapse (a public-goods problem) accelerates resource collapse (a tragedy of the commons). The game forces players to confront **second-order free-riding**—where free-riding on monitoring makes the resource invisible, hastening its demise—without using theory jargon until the debrief.  

  ---

  ### **Game Design: "The Invisible Fishery"**  
  **Core Insight**:  
  - The resource (fish stock) is invisible without monitoring.  
  - Monitoring is a public good: costly to contribute to, but everyone benefits from the data.  
  - Players free-ride on monitoring, leading to blind overharvesting and collapse.  

  **Materials**:  
  - **Index cards** (1 per player per round).  
  - **Two jars**:  
    - *Resource Jar*: Holds 100 tokens (e.g., dried beans, beads) representing the fish stock.  
    - *Monitoring Jar*: Empty at start; players add beans to "fund" monitoring.  
  - **Player tokens**: 14 distinct items (e.g., colored paper clips) to track identities.  
  - **Screen/box** to hide the Resource Jar after setup.  
  - **Whiteboard** to track public info (no stock numbers!).  

  **Roles & Setup**:  
  - **Players**: 14 fishers (individuals; no teams to emphasize individual incentives).  
  - **Starting Stock**: 100 fish tokens in the Resource Jar (hidden after setup).  
  - **Monitoring Pool**: Empty jar. Players contribute tokens *from their own stash* (see payoffs).  
  - **Game Length**: 8 rounds (6–7 min/round).  

  ---

  ### **Rules & Payoffs**  
  **Each Round (7 min)**:  
  1. **Decisions (2 min)**:  
     - Players write two choices on index cards:  
       - **Harvest**: Fish 0, 1, or 2 fish (from Resource Jar).  
       - **Contribute to Monitoring**: Yes (cost: 1 point) or No (cost: 0).  
     - Cards submitted privately to you (facilitator).  

  2. **Resolution (3 min)**:  
     - **Harvesting**:  
       - Sum all harvest choices.  
       - If total ≤ fish stock: All get their chosen harvest.  
       - If total > stock: Harvests reduced proportionally (e.g., if players request 20 fish but only 10 remain, each gets half their request, rounded down).  
       - Update Resource Jar.  
     - **Monitoring Contributions**:  
       - Count "Yes" contributions. Each costs the player 1 point (see payoffs).  
       - **If ≥3 players contribute**: Monitoring succeeds. *Reveal the stock level* (e.g., "Low: 0–25 fish", "Medium: 26–75", "High: 76–100").  
       - **If <3 contribute**: Monitoring fails. *Announce "No data"*.  
       - Add 1 bean per "Yes" to Monitoring Jar (visible to all).  

  3. **Resource Regrowth & Reset (2 min)**:  
     - Surviving fish grow 20% (round up, max 100).  
     - Reset Monitoring Jar to empty.  
     - Update whiteboard with:  
       - Public info (stock level if monitored, else "Unknown").  
       - Monitoring Pool status (beans added this round).  

  **Payoffs (Points)**:  
  - **Harvesting**: +3 points per fish kept.  
  - **Monitoring Contribution**: −1 point per "Yes".  
  - **Using Monitoring Data**: Free (all players see data if ≥3 contribute).  
  - *Points ≠ money; stress that "winning" is maximizing personal points*.  

  ---

  ### **Timeline**  
  | Phase | Time | Description |  
  |-------|------|-------------|  
  | **Intro** | 5 min | Explain rules neutrally: *"You’re fishers. Harvest fish for points. You can pay to fund monitoring, which reveals stock health. Stock regrows if not depleted."* **NO theory terms.** |  
  | **Rounds 1–4** | 28 min | Players see starting stock (100). Early rounds usually have high harvest, low monitoring. Stock declines but regrows. |  
  | **Rounds 5–8** | 28 min | Critical phase: Stock drops. Monitoring Pool often fails (free-riding). Players harvest blindly → collapse. |  
  | **Debrief** | 29 min | Guided discussion linking gameplay to theory (see below). |  

  ---

  ### **Debrief (29 min)**  
  **Step 1: Playback (10 min)**  
  - *Ask players:*  
    - "When did you feel uncertain about the stock? Why?"  
    - "Why did you contribute (or not) to monitoring?"  
    - "What happened when monitoring failed repeatedly?"  
  - *Map their experiences:*  
    - **Resource Collapse**: "Remember Round 6? Harvests were slashed because stock was low, but no one knew *why*."  
    - **Second-Order Free-Riding**: "In Round 3, many stopped contributing to monitoring because they hoped others would pay. That made the resource invisible."  

  **Step 2: Theory Connection (15 min)**  
  - Reveal that they experienced **two linked problems**:  
    1. **Tragedy of the Commons**: Rival resource (fish) + no restraint → overharvesting.  
    2. **Public-Goods Problem**: Non-rival good (monitoring data) + free-riding → underprovision.  
  - Emphasize the **feedback loop**:  
    - Monitoring collapse → resource invisibility → reckless harvesting → resource collapse.  
  - Contrast with textbook models:  
    - *"Real-world commons aren’t just about grabbing resources—they’re about failing to coordinate on the systems that make resources visible."*  

  **Step 3: Pushback & Nuance (4 min)**  
  - **Where you mushed concepts**:  
    - You correctly linked monitoring (public good) to resource management (commons). *This is valid*—e.g., climate monitoring suffers the same free-riding.  
    - But note: Real fishers *sometimes* avoid collapse via **informal norms** (not in this game). Admit this post-game:  
      - *"In reality, tight-knit groups (like your marina friends) may self-police via trust. But scaling up requires formal rules."*  

  ---

  ### **What Will Go Wrong (Brutally Frank)**  
  1. **Chaotic first round**: Players ignore monitoring to maximize harvest. *Fix*: Gently remind them data costs points but is free to use.  
  2. **Frustration during collapse**: Players angry when harvests are cut. *Lean in*: "Why were you blindsided? What system failed?"  
  3. **Overly rational players**: 1–2 may martyr themselves by always monitoring. *Outcome*: They burn points, others free-ride, collapse still happens.  
  4. **Time crunch**: Round 8 runs long. *Fix*: Use a timer; end early if stock hits 0.  

  ---

  ### **What the Game Can’t Capture**  
  - **Ecological tipping points**: Real stocks collapse abruptly (e.g., reproductive failure). Here, decline is linear (20% regrowth). *Verbally add*: "In reality, fish stocks may not rebound past a threshold—yours did for gameplay."  
  - **Spite/altruism**: Players may sabotage or cooperate for non-point reasons. *Acknowledge*: "Real actors have ethics, history, and emotions—this game reduces them to incentives."  
  - **Scale effects**: Monitoring costs don’t scale with group size here. *Note*: "In large fisheries, costs rise, making free-riding worse."  

  ---

  ### **Why This Works for Your Goal**  
  - **Pre-lecture discovery**: Players *feel* the free-rider problem when monitoring fails ("Why should I pay if others won’t?") and the commons tragedy when fish vanish.  
  - **Your marina argument modeled**: Fishers (players) "voluntarily limit catch" only if they see the stock—but monitoring collapses first.  
  - **Simple but deep**: Index cards and jars create tension without distraction. The payoff scheme makes data costly but free to use, forcing the conflict.  

  **Final Tip**: Run it once with colleagues first to smooth wrinkles. Your students will grasp the "structural beast" by living it—no Hardin required.
