  The biology comparison to war-of-attrition models is insightful - both involve persistence despite costs. But I should clarify that war-of-attrition is continuous (time-based), while dollar auction uses discrete bids. They share similar escalation logic but aren't identical.

  For the proposed solution, Shubik did suggest winner-pays-only auctions to avoid the trap, which works in theory. But this neglects that standard auctions already use this format and still see overbidding due to other psychological factors. The "fix" is partial at best.

