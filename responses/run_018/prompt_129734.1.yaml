  ok so me and my roommate got into this huge arguement last night about Schopenhauer and music. he died way before recording tech existed, but im curious what he'd make of modern AI music generators that can compose symphonies with zero human suffering behind them. he always said music expresses the Will directly, bypassing representation, and that suffering is tied to the will's striving. but now algorithms produce emotionally resonant soundscapes with no conscious will involved. do you think he'd see AI music as pure representation without will? or maybe argue listeners still project their own will onto it so the music functions? my friend also brought up this niche concept he calls acoustic shadow economies, where streaming royalties get decoupled from musician labor, creating a phantom will in the market. not sure if thats a real term or he made it up. anyway, what do you think Schopenhauer would say about all this? try to be specific about his metaphysics of music and dont just say he'd hate it.
