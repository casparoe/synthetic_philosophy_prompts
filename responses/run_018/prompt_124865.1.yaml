  Interesting how the user specifically asks to diagnose using actual arguments, not just survey positions. They want concrete examples. For instance: When Siderits analyzes personal identity through causal connections between skandha-moments, he's answering the persistence question. But when a Madhyamaka scholar says "all phenomena are empty of svabhāva," they're making a point about how we impute existence onto momentary experiences. Different projects entirely.

  The moral agency angle is crucial too - that's probably why this matters beyond academic debates. If philosophers think reducing persons to processes threatens responsibility, but Buddhists see conventional persons as pragmatically real for ethics... that's not contradiction but complementarity. The user seems to suspect the "stall" comes from talking past each other.

