answer: |-
  The stalemate arises from a **categorical mismatch** in the fundamental questions each camp addresses, compounded by divergent metaphysical commitments. This isn't merely verbal disagreement but a substantive misalignment of projects. Here's a diagnosis grounded in representative arguments:

  ### Core Disconnect:  
  1. **Analytic Philosophers** (e.g., Parfit, Siderits, Duerlinger):  
     - **Question:** "What *metaphysically grounds* personal identity over time?"  
     - **Method:** Apply conceptual tools (bundle theory, 4D-ism) to Buddhist ontology (skandhas, momentariness).  
     - **Sample Argument:** Siderits (2003) treats the skandhas as temporal parts in a causal series. If no part endures, and causal connections are weak, persons are "conventional truths" (eliminativism-lite).  
     - **Goal:** Test Buddhist ontology against Western puzzles of persistence (e.g., Ship of Theseus).  

  2. **Buddhist Scholars** (e.g., Garfield, Siderits-Mādhyamika, Gethin):  
     - **Question:** "How does *direct insight* into non-self (*anātman*) dismantle suffering-causing reification?"  
     - **Method:** Exegetical analysis of sūtras/śāstras emphasizing *prajñapti-sat* (conventional designation) and *śūnyatā* (emptiness).  
     - **Sample Argument:** Garfield (2015) stresses that anātman denies *svabhāva* (inherent existence) *within any given aggregate*—not diachronic identity. Madhyamaka deconstructs *all* metaphysical posits (even "bundles").  
     - **Goal:** Preserve the soteriological path: seeing through the illusion of self *now* to cease craving.  

  ---

  ### Substantive Divergences:  
  - **Metaphysical vs. Soteriological Focus:**  
    Philosophers seek identity *conditions* (e.g., "What connects infant-you to present-you?"). Buddhists see anātman as a *technique* to expose the futile search for any "self" to cling to—whether synchronic or diachronic.  

  - **Momentariness ≠ 4D-ism:**  
    Analytic models treat *kṣaṇikatva* (momentariness) as discrete time-slices. But Abhidhammika momentariness isn't about temporal parts; it's the *impermanence* (*anicca*) of *dhammas* experienced in meditation.  

  - **The Moral Agency Stalemate:**  
    Philosophers worry: "If no persisting self, what grounds responsibility?" (e.g., Stokes 2013). Buddhists respond: *Prajñapti-sat* (conventional persons) suffices for karma (e.g., Cowherds 2011). **The clash:** Philosophers seek *metaphysical grounding* for agency; Buddhists see agency as *pragmatically emergent* from causal processes.  

  ---

  ### Why Progress Stalled:  
  - **Incommensurable Frameworks:**  
    Philosophers analyze anātman through *external* metaphysical criteria (e.g., "Is it reductionist?"). Buddhists assess it *internally* by its efficacy to end suffering.  

  - **Misplaced Analogies:**  
    Equating "no-self" with "bundle theory" ignores that Madhyamaka rejects bundles as *substantialist*. Nāgārjuna (MMK 10) denies aggregates exist inherently *at all*—synchronic or diachronic.  

  - **Phenomenology Ignored:**  
    The visceral *experience* of self-dissolution in meditation (e.g., via *satipaṭṭhāna*) is central to Buddhists but absent in analytic reconstructions.  

  ---

  ### Paths to Progress:  
  1. **Formal Distinction: "Two Anātmans"**  
     - **Anātman₁ (Metaphysical):** Denial of diachronic/substantial self (addresses philosophers' puzzle).  
     - **Anātman₂ (Soteriological-Phenomenological):** Direct insight into emptiness of *present* experience (Buddhists' focus).  
     *Value:* Clarifies that debating "which anātman is correct" is category-confused.  

  2. **Phenomenological Bridge:**  
     - Use contemplative neuroscience (e.g., studies on de-reification in meditators) to show *how* anātman₂ disrupts self-representation *without* requiring anātman₁.  
     - Example: If neural correlates of "selfing" dissolve under vipassanā, this validates anātman₂ irrespective of persistence theories.  

  3. **Dissolve the Question:**  
     - Argue that *both* camps err by assuming "self" must be a coherent target. Madhyamaka's *prasaṅga* method shows all positions on self/non-self are untenable. Progress lies in abandoning the question, per Nāgārjuna:  
       > *"The Buddha's teaching of the Dharma is based on two truths: [...] Without relying on conventions, the ultimate cannot be taught."* (MMK 24:8-10)  
     - Here, "progress" means recognizing that metaphysical debates about self are *conventionally useful* but *ultimately empty*.  

  ### Conclusion:  
  The stall is **substantive** but resolvable by acknowledging divergent projects. **True progress** requires:  
  - Philosophers to engage Buddhist epistemology (how *prajñapti* works sans svabhāva).  
  - Buddhists to articulate how conventional identity operates without metaphysical grounding.  
  - Both to integrate phenomenological data showing anātman as experiential insight rather than theory.  
  The breakthrough comes not from reconciling positions but mapping their domains: metaphysics addresses conventional coherence; Buddhism targets liberation from reification.
