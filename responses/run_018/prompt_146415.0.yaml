prompt: |-
  Hey, I'm writing a short thing on social-choice aggregation and I keep running into this tension. Harsanyi's aggregation theorem says that if individual preferences and the social preference both satisfy vNM rationality, plus Pareto and some independece condition, then social welfare is just a weighted sum of individual cardnal utilities. But I was wondering: what if we drop pure vNM and instead use reference-dependent preferences — like Kahneman-Tversky prospect theory — at the individual level? So each person's utility is defined relative to some reference point, with loss aversion, and the reference point might even depend on what others get. Compare the standard Harsanyi setup with this reference-dependent varient. Specifically, which of Harsanyi's axioms break first? Can you still get any kind of linear aggregation, or does the social welfare function become nonlinear and context-sensitive? And if the reference point is socially determined, does that create a circularity problem for the aggregation? I don't need a formal derivation, just want to see where the analogy holds and where it collapses.
reasoning: |-
  Okay, let me unpack this query about Harsanyi’s theorem and reference-dependent preferences. The user is writing on social-choice aggregation and notices a tension when moving from vNM rationality to prospect theory. They’re clearly familiar with formal frameworks but want conceptual insights rather than proofs. 

  First, I need to mentally reconstruct Harsanyi’s core setup: vNM rationality for individuals and social planner, Pareto efficiency, independence of irrelevant alternatives (IIA), and the resulting linear weighted welfare. The user’s pivot to reference-dependence is smart—it directly attacks the vNM foundation. 

  Where would this break? The obvious starting point is vNM axioms themselves. Reference-dependent preferences violate the independence axiom because choices change when outcomes are framed as losses vs gains. Loss aversion also messes with utility scaling—that 2:1 loss/gain ratio means we can’t just linearly rescale utilities anymore. 

  Then there’s the reference point complication. If individuals’ utilities depend on others’ payoffs (envy? altruism?) or some social benchmark, that creates two problems: (1) Pareto efficiency might get weird if my utility drops when you gain more than me, and (2) IIA fails because choices between A and B now depend on irrelevant options that shift reference points. 

  The circularity question is especially juicy. If the social reference point (say, average endowment) depends on aggregated choices, but aggregation needs utilities that depend on that reference… chicken-and-egg problem. That could force either non-linear aggregation or multiple equilibria. 

  I should emphasize where Harsanyi’s conclusion survives. If everyone shares the same fixed reference point (like a poverty line), linear aggregation might still work—but that’s brittle. Once references interact, it collapses. The user’s "context-sensitive" description nails it: social welfare would need history-dependent weights or thresholds. 

  This feels like fertile ground. The user’s phrasing ("where analogy holds/collapses") suggests they want a map of conceptual fault lines, not equations. I’ll structure around breaking points: vNM → reference → endogenous references. Should flag practical implications too—policy choices might become path-dependent.
answer: |-
  You've hit on a fascinating and deep tension! Moving from Harsanyi's vNM-based world to reference-dependent preferences (like Prospect Theory) fundamentally disrupts the linear aggregation result, primarily by violating core axioms. Here's where the analogy holds and where it breaks:

  **Core of Harsanyi's Setup (Recap):**
  1.  **vNM Rationality:** Individuals *and* the social planner have preferences representable by vNM utility functions (satisfy completeness, transitivity, continuity, independence axiom).
  2.  **Pareto Efficiency:** If everyone weakly prefers A to B, society weakly prefers A to B. If at least one strictly prefers A, society strictly prefers A.
  3.  **Independence of Irrelevant Alternatives (IIA):** The social ranking of two alternatives depends *only* on individual rankings of those two alternatives.
  4.  **Result:** Social Welfare is a *linear* weighted sum: W = Σ wᵢ Uᵢ (with wᵢ > 0).

  **Where Reference-Dependence Breaks Harsanyi:**

  1.  **Violation of vNM Rationality (Specifically the Independence Axiom):**
      *   **The Core Problem:** Reference-dependent preferences notoriously violate the vNM independence axiom. How an outcome is framed relative to a reference point drastically changes preferences. Adding a constant or mixing with a lottery can alter choices non-linearly due to loss aversion and non-linear probability weighting.
      *   **Consequence:** Individual utilities (Uᵢ) are no longer vNM utilities defined up to affine transformations. They are inherently *context-dependent* (relative to rᵢ). This breaks the foundation Harsanyi needs for linear aggregation. We can't simply take weighted sums of these Uᵢ(rᵢ) values meaningfully across different contexts.

  2.  **Violation of IIA (Independence of Irrelevant Alternatives):**
      *   **Why?** The social ranking of A vs B now depends critically on the *reference point* (rᵢ) for each individual. Crucially, rᵢ might itself depend on *other available alternatives* or the *status quo*, which are "irrelevant" under IIA.
      *   **Example:** Suppose rᵢ is the current endowment. Compare A (gain $10) vs B (gain $15 with 80% chance). Individual preferences might flip depending on whether their current endowment is $0 or $100 due to loss aversion and probability weighting. The social ranking of A vs B then depends on individuals' current endowments – information explicitly excluded by IIA. Even if rᵢ is fixed, its influence makes utilities depend on more than just preferences over A and B.

  3.  **Complications with Pareto Efficiency:**
      *   **Potential Violations (Subtle):** Pareto might *seem* safe, but complications arise:
          *   **Interdependent References:** If my utility depends on my outcome *relative to yours* (envy, altruism), then a change that makes you better off might *decrease* my utility even if my absolute outcome is unchanged. This could lead to situations where everyone getting more absolute resources might *not* be a Pareto improvement if relative deprivation increases for some.
          *   **Status Quo Bias:** Strong loss aversion might make individuals (and potentially society) strictly prefer the status quo even if an alternative exists that *everyone* finds at least as good *relative to that same status quo*. This might technically satisfy weak Pareto but feels intuitively "anti-Pareto".
      *   **Interpretation Challenge:** What does "prefer" mean? Is it based on the *current* reference point, or a hypothetical one? Pareto needs careful restatement in a reference-dependent world.

  **What Happens to Aggregation? It Gets Messy and Context-Sensitive:**

  1.  **Linear Aggregation Fails:** You absolutely cannot get a social welfare function of the form W = Σ wᵢ Uᵢ(rᵢ). The non-linearities (loss aversion, probability weighting), reference dependence, and context sensitivity inherent in Uᵢ(rᵢ) prevent this.
  2.  **Non-Linear and Context-Sensitive SWF:** Social welfare would become a complex, non-linear function of the individual reference-dependent utilities and crucially, *the reference points themselves*: W = F( U₁(r₁), U₂(r₂), ..., Uₙ(rₙ), r₁, r₂, ..., rₙ, X ). The functional form `F` would need to incorporate loss aversion, diminishing sensitivity, etc., and would depend heavily on the specific context (the set X, the status quo, etc.).
  3.  **Path Dependence:** The social ranking of alternatives might depend on the *process* or *history* that led to the current reference points.

  **The Circularity Problem (Endogenous Reference Points):**

  This is the biggest conceptual headache you identified.

  1.  **The Loop:** If the individual reference point rᵢ depends on the *social outcome* or the *outcomes of others* (e.g., rᵢ = average social outcome, rᵢ = neighbor's outcome), then we have:
      *   Social Welfare W depends on individual utilities Uᵢ.
      *   Individual utility Uᵢ depends on outcome xᵢ *and* reference point rᵢ.
      *   Reference point rᵢ depends on the social outcome vector **x** (which includes xᵢ and others).
      *   Therefore, W depends on rᵢ, which depends on **x**, which W is trying to evaluate!
  2.  **Consequences:**
      *   **Fixed Points:** Finding a social optimum requires finding a vector **x** *and* associated reference points **r** that are consistent: **r** = f(**x**) and **x** maximizes W(U₁(r₁), ..., Uₙ(rₙ)) given that **r** = f(**x**). This is a fixed-point problem.
      *   **Multiple Equilibria:** There can easily be multiple (x, r) pairs that satisfy the consistency condition, leading to multiple potential "social optima" depending on the starting point or expectations.
      *   **Instability:** Small changes in the social choice or environment could shift reference points dramatically, leading to large, discontinuous changes in utilities and thus the perceived social welfare.
      *   **No Clean Separation:** It becomes impossible to define individual utilities independent of the social state being evaluated.

  **Where the Analogy (Barely) Holds:**

  1.  **Pareto (Cautiously):** If you strictly define preferences *relative to a fixed, exogenous reference point*, and everyone prefers A over B *relative to that same fixed point*, then a social preference for A over B remains compelling, though not necessarily linear.
  2.  **Weighted Importance:** The *intuition* that society might weight different individuals' well-being differently (the wᵢ) might persist, but these weights couldn't simply multiply linear utilities. They would be embedded in a much more complex, non-linear `F` function and might even need to be context-dependent themselves.

  **In Summary:**

  *   **Key Broken Axioms:** vNM Rationality (especially Independence) and IIA are the first casualties. Pareto efficiency requires careful handling.
  *   **Linear Aggregation:** Dies immediately due to non-linearities and reference dependence.
  *   **Social Welfare Function:** Becomes highly non-linear, context-sensitive, and path-dependent.
  *   **Endogenous References:** Create severe circularity, leading to fixed-point problems, potential multiplicity of optima, and instability. This is the most profound departure from Harsanyi.
  *   **Analogy Survives:** Mostly just the *idea* that individual well-being matters for social welfare (in a complex way) and a *very* cautious interpretation of Pareto relative to a fixed reference.

  Prospect Theory preferences make aggregation fundamentally harder and more ambiguous. The social welfare function loses its clean, universal, linear form and becomes entangled with the psychological reference points of individuals, which may themselves be shaped by the social outcome. It moves social choice theory much closer to behavioral game theory and the study of equilibrium expectations.
