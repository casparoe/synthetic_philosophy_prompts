answer: |-
  ### Dependency Structure of Teaching Plan  
  **First establish democracy as functional institutions → then define decoupling as erosion beneath formal continuity → deploy a synthetic scenario demonstrating decoupling → systematically dismantle misconceptions in sequence → end with analytical check.**

  ---

  ### Explanatory Arc  
  1. **Core Definition (10 mins)**  
     - Open with *minimalist democracy*: free elections + institutional constraints (courts/media) preventing monopolized power.  
     - **Key move**: Distinguish *procedural shell* (elections held) from *functional substance* (institutions actually check power).  

  2. **Introduce Decoupling (15 mins)**  
     - Define *institutional decoupling*: Formal rules remain, but their enforcement/impact is hollowed out. Use **judicial independence** as the universal anchor:  
       - *Continuity*: Courts still exist, rulings issued.  
       - *Erosion*: Appointment rules altered to pack courts; rulings ignored or penalized.  

  3. **Synthetic Scenario (30 mins)**  
     - **"The Captured Courts System"**: Synthesize Hungary (FIDESZ court-packing), Poland (disciplinary chambers for judges), Turkey (Erdoğan’s post-coup purges), and US states (e.g., partisan judicial elections + legislative overrides of rulings).  
     - **Must display**:  
       - Elections continue; opposition candidates run.  
       - Gradual legal changes (e.g., "judicial reform" bills expanding appointments).  
       - Declining institutional impact (e.g., rulings against government stalled/unenforced).  
     - **Must omit**:  
       - Specific leaders/parties (use "Party A").  
       - Polarizing policies (e.g., abortion, immigration).  
       - Post-2010 Turkish contexts (avoids secularism debates).  
     - **Illustrative sequence**:  
       > *"Party A wins election → passes 'efficiency reform' expanding supreme court seats → appoints loyalists → courts now delay/avoid rulings on Party A’s policies."*  

  4. **Intercepting Misconceptions (25 mins)**  
     - **Misconception 1 ("Sour grapes")**: Intercept after **Core Definition**.  
       - *Counter*: Show opposition parties *winning* but blocked from governing (e.g., Polish 2023 election; Turkish mayoral wins overturned).  
     - **Misconception 2 ("Elections rule it out")**: Intercept after **Decoupling**.  
       - *Counter*: Use scenario—elections occur, but gerrymandering/media control warp competition (e.g., Hungarian supermajority with 49% vote).  
     - **Misconception 3 ("US exceptionalism")**: Intercept during **Scenario application to US**.  
       - *Counter*: Contrast federal checks/balances with state-level erosion (e.g., NC legislature stripping governor’s powers after party loss; gerrymandered veto-proof majorities ignoring courts).  

  5. **Analytical Check (10 mins)**  
     - **Prompt**: *"Identify one non-electoral tactic that erodes checks without abolishing formal rules."*  
     - **Validate grasp if**: Answers cite *institutional bypasses* (e.g., creating parallel courts, defunding oversight bodies) — **not** policy disagreements.  

  ---

  ### What to Omit  
  - **Quantitative indices** (V-Dem, Freedom House): Requires methodological depth.  
  - **Constitutional mechanics** (e.g., Art. 7 procedures in EU): Too technical.  
  - **Full Turkish secularism/Islamism**: Diverts to cultural debates.  
  - **Normative prescriptions**: Avoid "how to fix it."  

  ### Why This Works  
  The arc forces confrontation with **institutional reality over partisan optics**. By anchoring in courts—a neutral-seeming institution—the scenario sidesteps policy fights. Sequencing misconceptions builds self-correction: Participants dismantle their own objections via the decoupling lens. The US inclusion late in the arc preempts exceptionalism by showing institutional tactics mirroring Hungary/Poland.
