  We are setting up the problem of specifying the requirements for a social choice theory in a liberal society, focusing on the desiderata and the conflict that leads to Sen's liberal paradox.

  The key requirements we consider are:

  1. **Unrestricted Domain (UD)**: The social choice function must be defined for every possible profile of individual preference orderings (over the set of social states). This is because in a liberal society, we do not want to restrict the diversity of individual preferences arbitrarily.

  2. **Weak Pareto (WP)**: If every individual strictly prefers one social state to another, then society must also strictly prefer the first to the second. This reflects the idea that if everyone agrees, then society should reflect that agreement.

  3. **Minimal Liberty (ML)**: There are at least two individuals who each have at least one pair of alternatives (a protected sphere) over which they are decisive. That is, for each such individual, there is a pair (x, y) such that if the individual prefers x to y, then society must prefer x to y, and if the individual prefers y to x, then society must prefer y to x. This is meant to capture a minimal notion of personal liberty.

  4. **Acyclicity (AC)**: The social preference relation must be acyclic. This means that for every finite set of alternatives, there must be a best element (i.e., no cycles). This is a minimal coherence condition to ensure that a choice can be made from every finite set.

  Additionally, we note:

  5. **Non-Dictatorship (ND)**: There is no individual such that whenever they prefer one state to another, society must prefer it regardless of others' preferences. This is a fundamental requirement for a liberal society and is distinct from minimal liberty. It is non-negotiable for a liberal society.

  Now, we classify the requirements:

  - **Non-negotiable for a liberal society**: 
    - **Minimal Liberty (ML)**: Without any protected spheres, there is no personal liberty. This is constitutive of liberalism.
    - **Non-Dictatorship (ND)**: A dictator would violate the very idea of a liberal society.

  - **Parochial commitments**:
    - **Unrestricted Domain (UD)**: This is a requirement of social choice formalists who want the theory to be universally applicable. However, one might argue that in a well-ordered society, some preferences (e.g., meddlesome ones) might be excluded. Thus, it is not necessarily non-negotiable for all liberal theories.
