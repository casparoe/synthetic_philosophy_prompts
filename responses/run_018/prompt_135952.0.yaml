answer: |-
  Below is a diagnostic taxonomy tree for stances on scientific realism in light of the pessimistic meta-induction (PMI). The tree uses concrete historical cases (e.g., Newtonian gravitation, phlogiston, ether) to ground each split. Branches are labeled with specific claims about what (if anything) survives in successor theories, and leaves are tagged with standard position names (or "unnamed"). Each leaf includes a concise statement of its most awkward commitment. Unoccupied combinations and inseparable leaves are flagged at the end.

  ### Taxonomy Tree
  ```
  ROOT: Does empirical success of a radically false theory (e.g., Newtonian gravitation) justify belief in its unobservable ontology? 
  │   
  ├── **No**: Success does not justify belief in unobservables (e.g., ether was successful but had no ontological counterpart in relativity).  
  │   │   
  │   └── **Leaf: Constructive Empiricism** (van Fraassen)  
  │       *Awkward commitment*: Must defend a sharp, metaphysically laden observable/unobservable distinction (e.g., why telescopes extend observation but particle detectors do not).  
  │   
  └── **Yes**: Success justifies belief in *some* aspect of unobservables (e.g., Bohr model electrons survived as entities in QM).  
      │   
      ├── **What survives? Entities in successor theories** (e.g., electrons from Bohr to QM, atoms from Dalton to modern chemistry).  
      │   │   
      │   ├── **Convergence? Yes**: Historical patterns show cumulative approximation toward true ontology (e.g., electrons refined, not abandoned).  
      │   │   └── **Leaf: Entity Realism** (Hacking, Cartwright)  
      │   │       *Awkward commitment*: Must explain why discarded entities (e.g., phlogiston, caloric fluid) were *not* "approximately real" despite empirical success.  
      │   │   
      │   └── **Convergence? No**: No stable ontological frame → approximate truth collapses (e.g., chemical elements survived, but "element" changed radically from alchemy).  
      │       └── **Leaf: Unnamed**  
      │           *Awkward commitment*: Must deny scientific progress toward truth while asserting entity continuity, weakening PMI resistance.  
      │   
      ├── **What survives? Mathematical structures** (e.g., Newtonian gravity → weak-field GR equations; Fresnel’s ether equations → Maxwell’s without ether).  
      │   │   
      │   ├── **Convergence? Yes**: Structures converge toward true structure (e.g., GR preserves Newtonian formalism locally).  
      │   │   └── **Leaf: Epistemic Structural Realism** (Worrall)  
      │   │       *Awkward commitment*: Must explain how we access "structure" without ontology (e.g., why quantum fields’ structure is knowable if their nature is not).  
      │   │   
      │   └── **Convergence? No**: Structural stability is coincidental, not convergent (e.g., Bohr model’s quantized orbits discarded entirely in QM).  
      │       └── **Leaf: Unnamed**  
      │           *Awkward commitment*: Cannot justify realism about *current* structures (e.g., QFT) if past structural retention was accidental.  
      │   
      └── **What survives? Nothing** (e.g., phlogiston’s ontology had no analogues in modern chemistry; caloric fluid replaced by kinetic theory).  
          └── **UNOCCUPIED: Incoherent** (contradicts root "Yes" by retaining nothing).
  ```

  ### Key Notes:
  1. **Inseparable Leaves**:  
     - **Entity Realism** and **Epistemic Structural Realism** cannot be distinguished solely by their convergence claims (both can endorse convergence). They *are* separable by **what survives**: entities vs. structures (e.g., Newtonian gravity’s "force" entity vs. its \(1/r^2\) structure).  
     - **Constructive Empiricism** and **Pessimistic Anti-realism** (not listed; see unoccupied) are separable via agnosticism vs. outright disbelief in current unobservables.

  2. **Unoccupied Combinations** (flagged per branch):  
     - **Root=Yes → Survives=Nothing**: Incoherent (retains nothing while affirming root "Yes").  
     - **Root=No → Believe current ontology anyway**: Incoherent without a PMI-breaker (e.g., "current science is special" ad hoc).  
     - **Root=Yes → Survives=Entities → Convergence=No**: Unexplored (entity survival without convergence is philosophically unstable).  
     - **Root=Yes → Survives=Structures → Convergence=No**: Unattractive (undercuts motivation for structural realism).

  3. **Historical Anchors**:  
     - **Newtonian gravitation**: Survival of mathematical structure (GR weak-field limit) vs. discarding "force" ontology.  
     - **Phlogiston/Caloric**: Total ontological discontinuity (no successor entities/structures).  
     - **Luminiferous ether**: Mathematical structure (Maxwell’s equations) retained without ontology.  
     - **Bohr model**: Entity (electron) retained; orbital structure discarded.

  ### Usage:
  To self-diagnose:  
  1. Start at the **Root** with a historical case (e.g., "Does ether’s success justify belief in ether?").  
  2. Proceed down splits by judging what (if anything) survived (e.g., "Ether’s equations survived, not its ontology → Structural branch").  
  3. Assess convergence (e.g., "Do EM equations in relativity suggest cumulative truth? Yes → Structural Realism").  
  4. Verify against other cases (e.g., "Phlogiston: nothing survived → Root=No → Constructive Empiricism").  

  This tree isolates stances via concrete theory transitions, independent of philosophical labels. Positions like "pessimistic anti-realism" are absent (as leaves) because they collapse into **Constructive Empiricism** or **Unnamed** branches under PMI pressure. Gaps reflect either logical incoherence or underdeveloped positions.
