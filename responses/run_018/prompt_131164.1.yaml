answer: |-
  ## Joint Statement on Advance Directives and Partial Evaluative Continuity

  **Preamble:** This statement reflects areas of agreement, precise formulations of residual disagreement, and key unresolved questions ("cruxes") between proponents of diachronic autonomy preservation (Camp A) and proponents of present-subject sovereignty (Camp B) regarding the authority of advance directives in cases of partial evaluative continuity. It is the product of good-faith adversarial collaboration focused specifically on the intermediate problem where a patient retains significant narrative identity but has undergone stable value change contradicting a prior directive. We distinguish between the *predictive authority* of an advance directive (what the prior self *would* want for the present situation, given current information) and its *prescriptive authority* (what the prior self *commanded* should be done, regardless of changed values or circumstances).

  **1. Agreed Claims:**
  We jointly affirm the following substantive points, which represent settled ground among specialists in bioethics and philosophy of personal identity concerning advance directives:

      1.  **Moral and Legal Function:** Advance directives serve a crucial moral and legal function: to extend an individual's self-determination into periods of future incapacity and to provide guidance and reduce burdens on surrogate decision-makers and clinicians.
      2.  **Degrees of Psychological Continuity:** Psychological continuity, including the persistence of personal identity over time, is not an all-or-nothing phenomenon. It exists on a spectrum and comprises various elements (e.g., autobiographical memory, character traits, values, narrative sense of self) which may persist, change, or degrade at different rates and to different extents.
      3.  **Conflict Condition:** A conflict arises between an advance directive and the present self's expressed preferences specifically when *both* (a) the patient retains sufficient cognitive capacity to express current preferences regarding treatment, *and* (b) those expressed preferences demonstrably and stably contradict the instructions or values articulated in the advance directive.
      4.  **Predictive vs. Prescriptive Distinction:** Advance directives can be interpreted as serving two distinct, though often overlapping, functions:
          *   **Predictive Authority:** The directive represents the prior self's best *prediction* of what their *future* self would want *in the specific circumstances* they might face. Its authority depends on the accuracy of that prediction relative to the present self's actual values and situation.
          *   **Prescriptive Authority:** The directive represents a *binding command* issued by the prior self, intended to govern future treatment *regardless* of whether the future self's values or preferences change. Its authority stems from the prior self's autonomous choice to constrain future choices.
      5.  **Prima Facie Weight:** Both the prior self's documented wishes (via the directive) and the present self's expressed preferences possess prima facie moral weight and deserve serious consideration in decision-making. Neither can be automatically dismissed.
      6.  **Relevance of Stability & Consistency:** The stability and consistency of the present self's expressed preferences over time and across contexts are relevant factors in assessing their authenticity and weight, especially when psychological continuity is partial.

  **2. Disagreements Table:**

  | # | Neutral Formulation of the Disagreement                                                                                                 | Camp A (Diachronic-Autonomy Preservationist) Position                                                                                                                                                                | Camp B (Present-Subject-Sovereignty) Position                                                                                                                                                           |
  | :-- | :--------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |
  | **D1** | **What is the source of ultimate decisional authority when a capacitated present self with partial psychological continuity stably rejects a prior directive?** | **"When a patient retains sufficient cognitive capacity to understand the relevant medical situation and choices, the binding moral authority over current treatment decisions resides *exclusively* with the contemporaneous values and preferences of the present self, *even if* those preferences contradict a prior directive and *even if* significant narrative continuity persists. The prior self's command cannot morally override the current self's right to self-determination regarding their present existence."** | **"The prior self's directive, issued autonomously during competence, retains decisive moral authority over future treatment decisions *whenever significant psychological continuity persists*, including narrative identity, regardless of changes in specific values or preferences. Honoring the directive respects the enduring person's prior autonomous choice about their life narrative and future states, which the present self, being a temporally partial perspective, lacks the standing to revoke unilaterally."** |
  | **D2** | **Does stable value change coupled with partial psychological continuity (narrative identity, autobiographical memory) undermine the prescriptive authority of a prior directive?** | **"Stable value change *does* undermine the prescriptive authority of a prior directive, *even when* significant narrative identity and autobiographical memory persist. The directive's prescriptive force was predicated on the stability of the values it enshrined. When those values demonstrably change in a stable manner, the *reason* for adhering to the prior command as binding vanishes; adhering to it imposes an external will upon the authentic current self."** | **"Stable value change *does not* automatically undermine the prescriptive authority of a prior directive *as long as significant psychological continuity (including narrative identity) is maintained*. The enduring person authorized the directive; their stable change in values does not retroactively nullify the autonomous commitment they made. Respecting diachronic autonomy requires upholding that prior commitment unless continuity is fundamentally severed."** |
  | **D3** | **Under conditions of partial evaluative continuity, which function of an advance directive (predictive or prescriptive) should be given priority when they conflict?** | **"When predictive and prescriptive interpretations conflict under conditions of partial evaluative continuity, the *predictive* function must be prioritized. The directive's primary moral purpose is to approximate what the patient *would want now*. If the present self's stable preferences provide clear evidence that the prior self's prediction was inaccurate due to unforeseen value change, honoring the prediction (via the prescriptive interpretation) becomes incoherent and disrespectful to the current self."** | **"When predictive and prescriptive interpretations conflict under conditions of partial evaluative continuity, the *prescriptive* function must be prioritized. The directive's core purpose as an exercise of autonomy is to make a binding future-oriented choice. Prioritizing prediction based on changed values effectively voids the possibility of making a truly prescriptive advance directive, undermining its fundamental purpose."** |

  **3. Cruxes:**

  The following sub-questions represent fundamental points of disagreement whose resolution would likely change the position of at least one camp. We present a concrete case relevant to these cruxes and state each camp's prediction about what the case demonstrates.

  *   **Crux 1: Is narrative continuity alone sufficient to sustain the prior self's moral authority over the current self?**
      *   **Case:** A patient with progressive neurocognitive decline retains robust autobiographical memory, clearly recognizes family members, and can coherently discuss her life story. However, she now consistently and stably expresses a preference solely for comfort-focused care (e.g., hospice, no hospitalizations), directly contradicting her prior, clearly documented directive demanding "all possible aggressive life-prolonging interventions, including mechanical ventilation and CPR," written when she deeply feared dependence and valued longevity above all else.
      *   **Camp A Prediction:** "This case demonstrates that narrative continuity alone is *insufficient* to sustain the prior self's moral authority. Despite remembering her life and relationships, her stable values regarding acceptable quality of life and medical intervention have fundamentally shifted. Enforcing the prior directive against her current, stable wishes would impose a 'foreign' value system upon her authentic present self, violating her current autonomy. It shows that prescriptive authority dissolves when the underlying values change stably, even with narrative persistence."
      *   **Camp B Prediction:** "This case demonstrates that narrative continuity *is* sufficient to sustain the prior self's moral authority. The patient remains recognizably the same person who authored the directive, capable of understanding her ongoing narrative. Her current preference, while stable, represents a change of mind by the *same enduring person* who previously made a deliberate, autonomous commitment. Honoring the directive respects her prior, competent self's binding decision about how her life story should end, a decision the present self, experiencing the challenges of decline, cannot unilaterally revoke without undermining the very possibility of prescriptive advance planning."

  *   **Crux 2: Does the etiology of value change (e.g., disease-induced vs. reflective revision) affect the legitimacy of honoring a directive?**
      *   **Case:** Same patient as above. Both camps agree the value change is stable. However, suppose evidence strongly suggests the shift towards comfort-care is primarily driven by apathy and emotional blunting characteristic of her specific neurodegenerative disease, rather than a reflective reappraisal of values.
      *   **Camp A Prediction:** "If the value change is demonstrably *caused by the pathological process* of the disease itself (e.g., apathy, blunting), rather than authentic reflection, this *strengthens* the case for prioritizing the prior directive's prescriptive authority. The current preference may not reflect the authentic voice of *any* self, but rather the disease distorting her agency. In such cases, the directive provides the best evidence of what her authentic, pre-pathology self valued and intended. It demonstrates that etiology matters: pathological distortion undermines the legitimacy of the present preference."
      *   **Camp B Prediction:** "While the etiology of the value change is diagnostically relevant, it *does not* alter the fundamental principle that the capacitated present self's stable preferences have decisive authority. If she *currently* possesses the cognitive capacity to understand her situation and express a stable preference, the cause of that preference (whether disease-induced or reflective) is irrelevant to her *current* right to self-determination. Focusing on etiology risks paternalistically discounting the expressed will of a capacitated individual based on speculation about its origins. The case shows that present capacity and stable expression are the key criteria, not etiology." *[Note: This crux reveals a potential shift; Camp B focuses strictly on current capacity/expression, downplaying etiology's relevance to authority, while Camp A sees it as crucial to whether the present self's voice is authentic.]*

  **Note on Substantive vs. Verbal Disagreement:** While disagreements over terms like "authenticity" or "sufficient continuity" exist, the disagreements outlined above (D1-D3) are judged to be genuinely substantive. Both camps understand the core concepts (autonomy, continuity, directive functions) similarly but reach fundamentally different conclusions about how to weigh competing temporal perspectives of the same person when continuity is partial and values change. The cruxes highlight the deeper philosophical commitments driving these substantive differences.
