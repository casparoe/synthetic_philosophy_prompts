prompt: |-
  I am a novelist, not a philosopher, and I keep noticing a structure in the way a certain kind of person changes his mind that I cannot name. I want to know whether it has an established name in decision theory or the philosophy of rationality, and whether it has been given a sharp definition; if it has not, I want a good working term and a precise account of its boundaries.

  Here is the clearest instance. A character — call him Merrick — spends most of his weeks in one frame of mind, valuing quiet, solitary work above everything. But in another frame, reliably triggered by company and praise, he values visibility and influence. Each frame is stable while it lasts, and in each frame his choices are resolute and, to himself, unforced. The crucial thing is that there are only two alternatives in play, and the reversal happens across time, not within a single comparison: at no moment does he prefer one while acknowledging the other as better. In the solitary frame he will pay a facilitator to move him out of a public commitment; in the sociable frame he will pay her to move him back into one. The facilitator never lies, never pressures, and is careful to offer each transaction only in the frame that will welcome it; she charges a modest fee each time. After enough cycles Merrick is back where he began, except for the fees, and when the whole sequence is displayed to him at once he can repudiate no single step as false to the self who took it — yet he can see that all the steps together transferred money to someone who produced nothing.

  A second instance: a writer alternates between a minimal, austere method and an expansive, collaborative one, and each conversion entails discarding one kind of equipment and buying back the other at a worse price. Again the reversals are regular, sincere while they last, and individually sensible. A friend who runs a used-goods business handles every exchange and loses nothing.

  I keep returning to this because it is neither fickleness nor indifference. It is not weakness of will as I understand it: no step feels like capitulation to something the agent disavows. It is not a change of belief, since nothing about the way the world seems is updated. It is not an epiphany, because the old frame always returns. Between frames, the same person can see the cycle at a distance and would even pay to make both kinds of exchange impossible — but within either frame he would resent the very binding he bought, and the facilitator knows this.

  My question has three parts. First, does this configuration — a changing but locally sincere agent whose predictable reversals can be harvested by a neutral third party, always at a net loss to the agent — have an established name, and how precisely has it been characterized? Second, which features are load-bearing? I suspect one can vary the trigger (emotional, social, mnemonic), the stakes (money, time, fidelity, equipment), and the third party's role, and I want to know what is essential to the pattern and what is incidental. Third, how does it differ from the nearby ideas of the weak-willed person, the inconstant or divided self, the person who changes their values after a genuine conversion, and the holder of seemingly inconsistent tastes? If the established term names something broader or narrower than my pattern, I would rather have the carving than the label.

  You are an expert on decision theory and the philosophy of rationality, with a secondary interest in how theories of agency surface in fiction. Please think carefully. Before settling on an answer, generate a shortlist of candidate terms, check each against the description above, and say explicitly where each candidate fits and where it fails. I will not be satisfied with a bare name; I need to know exactly what the phenomenon is, what it is not, and where its edges are.
reasoning: |-
  Okay, let me approach this systematically. The user describes a very specific psychological pattern in their characters - cyclic preference reversals that feel authentic in each state but lead to predictable exploitation. As a novelist, they need precise terminology to crystallize this concept for their writing.

  First, I need to map this against decision theory concepts. The core elements are: 1) multiple stable preference states 2) triggered reversals 3) no internal conflict during each state 4) exploitability through cyclical transactions. 

  Hmm, the closest established concept seems to be "dynamic inconsistency" in economics, but that typically involves time discounting rather than frame-dependent preferences. Strotz's work on inconsistent planning comes close but assumes unitary preferences. Frankfurt's "wanton" might apply but misses the cyclical nature. 

  Ah! Elster's work on "state-dependent preferences" and "adaptive preferences" seems promising, particularly his analysis of how preferences shift with emotional states. But does it cover the exploitability aspect? Let me recall his wine example - similar but not identical.

  The key differentiators from nearby concepts: 
  - Not weakness of will (no akrasia) 
  - Not value pluralism (no simultaneous conflict) 
  - Not permanent conversion 
  - Not mere inconsistency (patterns are predictable)

  For terminology, "preference cycling" feels accurate but might be confused with voter paradoxes. "Metastable preferences" captures the state-transition aspect. "Frame-contingent preference reversal" is precise but clunky. 

  The exploitative mechanism reminds me of Schelling's self-command theory, but reversed - here the agent pays others to exploit their predictable shifts. That's an important nuance: the third party isn't helping resist temptation but enabling the cycle.

  Boundaries to clarify: 
  - Must involve at least two exclusive alternatives 
  - Reversals must be sincere/intransitive 
  - Losses must stem purely from cyclical transactions 
  - No deception or coercion by facilitator

  I should emphasize how this differs from standard addiction models too - no physical dependency, just psychological framing. The neutrality of the facilitator is crucial; it's not a predatory relationship but a service the agent would reject in either state.

  For the user's writing purposes, "cyclically exploitable preferences" might serve best - descriptive enough without jargon. But academically, Elster's framework comes closest despite needing slight extension.
answer: |-
  This is a fascinating and precisely observed pattern—one that straddles decision theory, philosophy of mind, and behavioral economics. After mapping your description against key concepts, here's a structured analysis:

  **Shortlist of Candidate Terms & Their Fit:**

  1.  **Dynamic Inconsistency (Standard Economic Definition):**
      *   **Fit:** Captures reversals over time leading to exploitation (e.g., procrastination, addiction models). The net loss to Merrick is central.
      *   **Failure:** Primarily defined for *intertemporal choices* where discount rates change (e.g., valuing present over future disproportionately). Merrick's shifts aren't temporal discounting; they're *state/frame-dependent value reversals*. No single "future self" conflict is highlighted; both states feel equally authentic *in the moment*. Also, standard models often imply regret upon reversal, which Merrick lacks *during* each state.

  2.  **Preference Reversal / Intransitivity:**
      *   **Fit:** Acknowledges the core reversal between states (Solitary > Public vs. Sociable > Visibility). The cycle (A > B > A) resembles an intransitive loop.
      *   **Failure:** Typically analyzed *within* a single context or moment ("I prefer A to B and B to C, but C to A"). Merrick *never* holds conflicting preferences *simultaneously*. His preferences are internally consistent *within each frame*. The reversal is *across* frames/states, not within a single comparison set.

  3.  **State-Dependent Preferences (Elster, Loewenstein):**
      *   **Fit:** **Strongest fit.** Directly addresses how preferences change based on internal states ("hot" vs. "cold" states, visceral factors). Merrick's solitary vs. sociable frames are distinct psychological states triggered reliably (company/praise). Choices are rational *within* each state. Exploitability arises from predictable state shifts.
      *   **Failure:** While the *concept* fits perfectly, "state-dependent preferences" is a broad category encompassing many phenomena (e.g., hungry vs. full). It doesn't *specifically* name the *cyclical, exploitable net loss* pattern you describe. It's the genus, but you seek the species.

  4.  **Akrasia / Weakness of Will (Aristotle, Davidson):**
      *   **Fit:** Involves acting against one's better judgment, sometimes leading to cyclic failure.
      *   **Failure:** **Key Mismatch.** Akrasia requires a *simultaneous* judgment that one's action is inferior. Merrick experiences *no such conflict within his frames*. In the solitary frame, valuing quiet is his sincere, resolute judgment; in the sociable frame, valuing visibility is equally sincere. He doesn't feel he *should* do otherwise *while acting*.

  5.  **Multiple Selves / Divided Mind (Parfit, Schelling):**
      *   **Fit:** Recognizes distinct "selves" or modes with different values (Solitary Merrick vs. Sociable Merrick). Exploitability arises from one "self" undermining the plans of another.
      *   **Failure:** Often implies conflict *between* the selves *within* the agent's awareness, or a lack of integration Merrick doesn't exhibit. While he sees the *cycle* externally later, *within each frame* he feels unitary and resolute. Frameworks don't always emphasize the *neutral third-party exploitation* and *net loss through transactions*.

  6.  **Adaptive Preferences (Elster, Sen):**
      *   **Fit:** Preferences changing to align with possibilities (sour grapes).
      *   **Failure:** Merrick's shifts aren't adaptations to constraints; they're triggered by *exogenous* factors (company/praise) changing his internal state/values. His preferences in each frame feel primary, not adaptive rationalizations.

  7.  **Metastable Preferences / Attractor States (Complexity/Neuro Models):**
      *   **Fit:** Captures the *stability within frames* and *predictable switching* between distinct preference basins ("attractors") triggered by specific inputs. The cyclical nature is implicit.
      *   **Failure:** More descriptive of the *mechanism* than the *phenomenological and behavioral pattern*. Less established in philosophy/decision theory, more common in neuroscience/complex systems. Doesn't inherently include the *exploitation* aspect.

  **The Established Concept & Its Characterization:**

  *   **Core Concept:** Your pattern is best understood as a specific, exploitable instance of **State-Dependent Preferences**.
  *   **The Specific Pattern:** It can be sharply characterized as **Cyclically Exploitable State-Dependent Preference Reversal**.
  *   **Established Recognition:** Jon Elster comes closest in works like *Ulysses and the Sirens* and *Strong Feelings*, analyzing how visceral states alter preferences and create self-defeating cycles exploitable by others (e.g., the "wine merchant" example where one buys wine while sober for the sober self, but sells it cheaply while drunk to buy more wine). George Loewenstein's work on "visceral factors" also grounds this. However, the specific *cyclical transaction net loss* pattern isn't given a dedicated single term like "akrasia." It's a *species* within the genus.

  **Precise Definition of the Phenomenon:**

  An agent exhibits **Cyclically Exploitable State-Dependent Preference Reversal** if and only if:

  1.  **Multiple Stable States:** The agent reliably enters two or more distinct psychological states (e.g., solitary, sociable; austere, expansive).
  2.  **State-Triggered Transitions:** Transitions between states are predictably triggered by specific exogenous or endogenous cues (e.g., social interaction/praise, specific environments).
  3.  **State-Dependent Value Ordering:** Within each state `S_i`, the agent holds a stable, transitive, and *sincere* ordinal preference ranking over a set of alternatives. Crucially, for at least one pair of mutually exclusive alternatives `A` and `B`, the preference ordering reverses between at least two states: `A > B` in `S_1`, `B > A` in `S_2`.
  4.  **Locally Rational Action:** Within any state `S_i`, the agent chooses actions that are *instrumentally rational* given their preferences and beliefs *in that state*. Choices feel resolute, unforced, and authentic. There is *no weakness of will (akrasia) within the state*.
  5.  **Intransitive Cycle Across States:** The sequence of preference reversals creates an *intransitive cycle* (`A > B` in `S_1`, `B > A` in `S_2` implies `A > A` via `B` when states shift).
  6.  **Exploitable Net Loss:** A neutral third party, understanding the state triggers and preference reversals, can structure a sequence of transactions *offered only in the state that welcomes them* (e.g., selling `B` in `S_1`, buying `B` back in `S_2`). Each transaction is individually rational for the agent *in the state when offered*. However, the *net result* of the cycle is a loss for the agent (e.g., money paid in fees, value lost in depreciation) and a gain for the third party, with no net change in the agent's substantive position regarding `A` and `B`. The loss arises purely from the *transactions necessitated by the cyclical preference reversal*.
  7.  **Ex Post Recognition (Optional but Common):** When presented with the entire sequence outside of either state (or in a "meta-state"), the agent recognizes the cycle and the net loss as irrational/regrettable *overall*, while still endorsing each individual step as rational within its state. They may even have a meta-preference to bind themselves against the cycle.

  **Load-Bearing Features (Essential vs. Incidental):**

  | Feature               | Essential? | Why?                                                                                              | Can Be Varied?                                                                 |
  | :-------------------- | :--------- | :------------------------------------------------------------------------------------------------ | :----------------------------------------------------------------------------- |
  | **State Dependence**  | **YES**    | Core mechanism: Preferences must *change* based on internal state, not just new information.       | Triggers can vary (emotion, social cue, memory, physiological state).          |
  | **Sincerity/Resolve** | **YES**    | Distinguishes from akrasia. Choices must feel authentic *within* the state.                       | Intensity of feeling can vary.                                                 |
  | **Preference Reversal** | **YES**    | Defines the cycle. Must reverse ranking of specific alternatives (`A`/`B`).                       | Number of alternatives/states can be >2, but reversal between pairs is core.   |
  | **Cyclicality**       | **YES**    | Creates the intransitivity and enables repeated exploitation/net loss.                           | Cycle period can vary (days, weeks, months).                                   |
  | **Exploitable Net Loss** | **YES**    | Defines the harmful, paradoxical outcome. Loss stems purely from transaction costs of reversal. | Stakes can vary (money, time, effort, resources). Third party role can vary (facilitator, market, even automated system). **Neutrality is key: no coercion/deception.** |
  | **Two Mutually Exclusive Options** | **YES**    | Necessary for the reversal (`A`/`B` conflict) and the "back-and-forth" transaction cycle.          | Specific nature of options can vary (career paths, methods, commitments, goods). |
  | **Predictable Triggers** | **YES**    | Enables the third party to time transactions correctly.                                            | Specific trigger mechanism can vary widely.                                    |
  | **Facilitator Role**  | NO         | Illustrative mechanism; loss could occur via market forces or self-inflicted transaction costs.    | Can be replaced by impersonal mechanisms or self-induced costs.                |
  | **Ex Post Regret**    | NO         | Enhances the tragedy but not essential (agent might remain blissfully unaware).                   | Can be present or absent.                                                      |
  | **"Binding" Desire**  | NO         | A common consequence but not definitional.                                                        | Can be present or absent.                                                      |

  **Distinguishing from Nearby Concepts:**

  1.  **Weakness of Will (Akrasia):** The *crucial* difference is **intra-state sincerity**. The akratic agent feels conflict *while acting* ("I know I shouldn't eat this cake, but I am"). Merrick feels **no conflict within his frames**. His choices align perfectly with his current values. Akrasia is failure *within* a state; this is rational action *across* different states.
  2.  **Inconstant/Divided Self:** While Merrick has different "modes," he lacks the *simultaneous internal conflict* or *lack of integration* often implied. He feels whole in each state. The "divided self" model often struggles to explain the *predictable, cyclical, transaction-based exploitability*.
  3.  **Genuine Conversion:** A conversion implies a *permanent or long-lasting* shift in core values based on new experiences, insights, or arguments. Merrick's shifts are *temporary and cyclical*, triggered predictably, with the old frame reliably returning. No permanent update occurs.
  4.  **Seemingly Inconsistent Tastes:** Mere inconsistency (e.g., liking salty popcorn but sweet ice cream) doesn't imply *reversals on the same pair of alternatives* or cyclical behavior. Context-dependent preferences (e.g., preferring tea in the morning, coffee in the afternoon) are usually complementary, not conflicting (`A`/`B` reversal). The key here is the **reversal on mutually exclusive alternatives** (`A` vs. `B`) leading to a **cyclical transaction cost burden**.
  5.  **Time Inconsistency (Hyperbolic Discounting):** While also a form of dynamic inconsistency, this involves *changing valuation of outcomes based on temporal proximity* (e.g., $100 now vs. $110 tomorrow is tempting; $100 in a year vs. $110 in a year + 1 day is not). Merrick's inconsistency stems from *changes in internal state/frame*, not the mere passage of time or proximity of rewards. His reversals can occur without any change in the *timing* of outcomes.

  **Conclusion & Recommendation:**

  *   **Established Term:** The phenomenon falls squarely under **State-Dependent Preferences**, specifically the **Cyclically Exploitable** variety. Elster's framework is the closest established analysis.
  *   **Precise Characterization:** Defined by sincere, state-contingent preference reversals on mutually exclusive alternatives, leading to predictable cycles that can be exploited by neutral third parties (or impersonal mechanisms) to extract value via transaction costs, with each step being locally rational.
  *   **Working Term:** For your novelist's precision, use **Cyclically Exploitable Preference Reversal** or **State-Contingent Preference Cycling**. These capture the core mechanics and tragic outcome more vividly than the broader "state-dependent preferences."
  *   **Boundaries:** It is defined by the **reversal of ordinal ranking on specific alternatives across distinct psychological states**, the **sincerity and resoluteness within each state**, the **predictable cyclical pattern**, and the resulting **exploitable net loss via transaction costs**. It is *not* defined by internal conflict during action (akrasia), permanent value change (conversion), mere context-dependence without reversal, or temporal discounting.

  This pattern is a profound illustration of how human rationality, while locally consistent, can be globally self-defeating when preferences are metastable and sensitive to shifting frames. It offers rich ground for exploring identity, agency, and the subtle ways we can be "hacked" by our own psychology.
