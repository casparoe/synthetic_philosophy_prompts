  ## The Unlit Chamber

  This steady wick consumes itself alone,
  its light requires no witness to exist;
  the oil that feeds it flows, a constant drone,
  until the final drop has hissed
  away to vapor. Where the flame once stood,
  no darkness gathers; nothing waits to mourn
  the vanished glow. Absence is not a good
  or ill. The unlit chamber, shorn

  of radiance, feels nothing of the night.
  The ledger lies untouched, its future sums
  unwritten. Tallied joys shed borrowed light;
  no hand will turn these pages. Silence comes.
  The chair sits empty. Time's denied embrace
  withheld what might have filled this quiet space.

  ***

  ---

  **Commentary on the formal choices**

  The enjambment dominating the first stanza creates a continuous, uninterrupted flow, mirroring the Epicurean argument that existence and sensation form a single, unbroken state. Harm requires a subject experiencing it *within* this state, like the burning lamp requiring presence to "consume itself alone." Sentences spilling over line breaks embody this co-presence necessity: harm and sufferer cannot be separated. When the state ends (the flame extinguished), absence isn't a new state *for* the subject; it is non-existence, felt by no one ("no darkness gathers").

  Conversely, the strict end-stopping of the second stanza enforces discrete boundaries, reflecting the deprivation account's focus on a specific event (death) severing a timeline. Each line becomes a self-contained unit of loss: the "unwritten" sums, the "withheld" embrace. The punctuation halts progress at each line's end, visually enacting the cutting off of future possibilities ("Time's denied embrace"). The empty chair and untouched ledger are concrete images of goods irrevocably removed *at that boundary point*.

  Simplifications: The Epicurean view is presented without addressing potential counterarguments regarding anticipation. The deprivation view simplifies "harm" to the removal of positive goods, not addressing potential harms of *how* death occurs or complexities about judging the counterfactual life. The meter necessitated concise phrasing, focusing each stanza's core imagery on its respective argument's essence.
