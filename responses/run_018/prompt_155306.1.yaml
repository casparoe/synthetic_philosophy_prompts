  First, I need to map out the correspondence table as requested. The main elements are judge, jury, evidence, verdict, and appeal. For referendums, the judge could be the state that sets the rules, but they don't direct deliberation like a real judge. The jury is the electorate, but they aren't isolated. Evidence is presented through campaigns, which is different from vetted court evidence. The verdict is the referendum outcome, binding without unanimity. Appeals in referendums are limited, unlike judicial processes.

  Next, identifying jury-trial norms imported silently. Presumption of innocence might translate to status quo bias, but it's not explicit. Exclusion of prejudicial material isn't enforced in campaigns. Unanimity is absent, and judicial instructions are missing. Can referendum design accommodate these? Random selection isn't practical. Evidence vetting would be tough without compromising free speech. Supermajority requirements might help but could entrench minority power.

  Distinguishing Swiss referendums from one-off events like Brexit is crucial. Switzerland's iterative process allows for revision, similar to appellate courts. Brexit had no such mechanism, making the analogy weaker for legitimacy. The iterative design mitigates some incompetence objections by allowing learning over time.

  Now, the core question: does the analogy support legitimacy, incompetence, or neither? Proponents might argue that both processes involve citizens deciding on important matters. However, the disanalogies are significant. Lack of safeguards, campaign influence, and no deliberation weaken the legitimacy claim. Critics' incompetence objections gain weight because the referendum lacks the trial's rigorous protections. But the analogy might still hold in minimal terms of collective decision-making. Ultimately, the differences might be too substantial, leading to neither side fully winning. The Swiss model's repeatability offers a middle ground, but one-off events like Brexit expose the analogy's flaws.

  I should also consider the user's deeper needs. They might be looking for a balanced analysis to inform policy or academic debate. They probably want clarity on whether referendums can be justified as democratic tools despite criticisms. Highlighting the Swiss iterative approach could suggest reforms for other systems. Emphasizing the disanalogies might caution against over-reliance on referendums for complex issues. The user might also be interested in how design changes could make referendums more legitimate, so discussing supermajorities or better information campaigns would add value.
answer: |-
  Here's a detailed audit of the referendum-as-jury-trial analogy, addressing your specific queries:

  **Explicit Correspondence Table**

  | Jury Trial Element      | Referendum Process Element        | Notes on Correspondence                                                                 |
  | :---------------------- | :-------------------------------- | :-------------------------------------------------------------------------------------- |
  | **Judge**               | **State / Electoral Authority**   | Sets rules, timetables, question wording, and enforces procedure. Lacks active role in directing deliberation or excluding "inadmissible" arguments. |
  | **Jury**                | **Electorate / Voting Public**    | The sovereign body rendering the final decision. Key disanalogy: No isolation, random selection, or obligation to participate. |
  | **Evidence**            | **Campaign Materials / Media**    | Presented by competing sides ("prosecution" vs. "defense"). Crucially, NOT vetted by a neutral authority for accuracy or relevance; includes advertising, spin, misinformation. |
  | **Verdict**            | **Referendum Outcome**            | Binding decision on the policy/issue. Major disanalogy: Typically simple majority (50%+1), not unanimity or supermajority. No requirement for reasoned justification. |
  | **Appeal**             | **Limited Recourse Mechanisms** | Swiss: Iterative voting allows "re-trial." One-off (Brexit): Judicial review *only* on procedural grounds, not substance. No higher "court" to overturn the policy verdict itself. |

  **Silently Imported Jury-Trial Norms & Accommodation in Referendum Design**

  1.  **Presumption of Innocence (Status Quo Bias):**
      *   **Imported?** Implicitly. Proponents often frame voting "No" as preserving the current state, analogous to acquittal. The burden of proof is placed on the *change* ("prosecution").
      *   **Accommodation?** **Yes.** This is often built into referendum design:
          *   The default is typically the status quo.
          *   Constitutional amendments often require supermajorities, raising the burden of proof for change.
          *   The Swiss optional referendum *requires* proponents to gather signatures to force a vote, placing the burden on change advocates.

  2.  **Exclusion of Prejudicial/Inadmissible Evidence:**
      *   **Imported?** Silently assumed by proponents invoking the analogy. The expectation is that only relevant, factual arguments are heard.
      *   **Accommodation?** **Extremely Difficult/Contentious.**
          *   *Information Vetting:* Creating an official "evidence pack" (like some Citizens' Assemblies) is possible but faces accusations of state bias. Independent commissions (e.g., UK's Electoral Commission) focus on process, not content truthfulness.
          *   *Campaign Regulation:* Strict limits on campaign finance, advertising content, or demonstrably false statements are attempted (e.g., some US states, post-Brexit debates) but clash fiercely with free speech principles and are hard to enforce effectively in digital media. *True neutrality is virtually impossible.*

  3.  **Unanimity / High Consensus Threshold:**
      *   **Imported?** Often implied by the gravitas of the "verdict" analogy, suggesting a strong consensus is needed for such a binding decision.
      *   **Accommodation?** **Yes, but with trade-offs.**
          *   Supermajority requirements (e.g., 60%, 2/3) can be implemented (common for constitutional changes).
          *   **Trade-off:** This can grant a veto to a minority, potentially entrenching the status quo undemocratically and amplifying the impact of low turnout.

  4.  **Judicial Instruction & Structured Deliberation:**
      *   **Imported?** Silently assumed – the image is of informed jurors weighing balanced arguments.
      *   **Accommodation?** **Partially/Practically Challenging.**
          *   *Citizens' Assemblies:* Can precede a referendum (e.g., Irish abortion, climate assemblies) to provide informed, deliberative recommendations. This injects a deliberative "mini-public" element.
          *   *Official Information Guides:* Governments or neutral bodies can provide balanced summaries (used in CA, Switzerland, Ireland). Effectiveness varies.
          *   *Structured Public Deliberation:* Logistically infeasible for the entire electorate. Replicating jury sequestration is impossible.

  5.  **Random Selection & Civic Duty:**
      *   **Imported?** The jury ideal involves a representative cross-section fulfilling an obligation.
      *   **Accommodation?** **Largely No.**
          *   Referendums rely on universal suffrage and voluntary participation. Turnout varies massively, potentially skewing representativeness. Mandatory voting exists (e.g., Australia, Belgium) but is controversial. Random selection for the entire electorate is impossible.

  **Distinguishing Swiss Iterative Referendums vs. One-Off Events**

  *   **Swiss Model (Iterative):**
      *   **Analogy to Appeal:** Functions like an appellate process. A losing side can regroup, gather new "evidence" (arguments), mobilize, and force a re-vote (especially via popular initiative or challenging legislation). Policy evolves through repeated deliberation and voting. Mitigates finality and allows learning.
      *   **Impact on Legitimacy/Incompetence:** **Strengthens legitimacy claim** by allowing correction and demonstrating sustained consent. **Weakens incompetence objection** as voters gain experience, and mistakes can be rectified. The system *expects* and accommodates revision.

  *   **One-Off Events (Brexit):**
      *   **Analogy to Appeal:** Virtually none. The verdict is treated as final and binding with no mechanism for a substantive re-vote based on new information or changed preferences. Judicial review is limited to process.
      *   **Impact on Legitimacy/Incompetence:** **Weakens legitimacy claim** – a single snapshot decision on a complex, evolving issue may not reflect settled will, especially if based on contested facts. **Strengthens incompetence objection** – the high stakes, irreversibility, and lack of recourse amplify concerns about voter information and susceptibility to campaign tactics. The finality clashes with the messy reality of complex policy.

  **Determining the Analogy's Support for Legitimacy vs. Incompetence**

  Once the disanalogies are fully acknowledged, **the analogy ultimately fails to robustly support *either* the proponents' legitimacy claim *or* fully vindicate the critics' incompetence objection, but tilts towards undermining the former and supporting the latter in one-off contexts:**

  1.  **Legitimacy Claim Undermined:** The analogy's core appeal is equating the referendum's democratic legitimacy with the jury's widely respected legitimacy. However, the disanalogies reveal fundamental differences that erode this:
      *   Lack of deliberation, evidence vetting, and judicial guidance means the "verdict" isn't based on a protected, rational process like a trial.
      *   Majority rule vs. unanimity/high thresholds weakens the claim of deep consensus.
      *   Campaign dynamics (money, media, misinformation) directly contradict the trial's controlled environment.
      *   **Conclusion:** The analogy *overstates* the inherent legitimacy derived purely from the act of voting by implying a level of procedural rigor and rational decision-making that simply doesn't exist in most referendums. The Swiss model fares better due to iteration.

  2.  **Incompetence Objection Supported (Especially for One-Offs):** The disanalogies directly fuel the incompetence critique:
      *   The absence of norms excluding "prejudicial material" and ensuring balanced "evidence" validates concerns about voter misinformation and manipulation.
      *   The lack of structured deliberation or judicial instruction highlights voters' vulnerability and lack of preparation for complex issues.
      *   The finality of one-off votes makes the consequences of potential "incompetence" severe and irreversible.
      *   **Conclusion:** The analogy inadvertently highlights *why* critics fear voter incompetence – because referendums lack the very safeguards that make juries (relatively) competent decision-makers in their specific context. The Swiss model mitigates this through revision.

  3.  **Minimal Resemblance & Neutral Function:** The analogy retains a *minimal* core validity: both involve a group of citizens rendering a binding decision after being presented with opposing arguments. This highlights the *function* of popular decision-making. However, this core similarity is too thin to substantively support strong claims about legitimacy *or* definitively prove incompetence on its own. It describes the *form* but not the *quality* of the process.

  **Final Verdict on the Analogy:** The referendum-as-jury-trial analogy is **rhetorically powerful but analytically weak.** It silently imports demanding norms of fairness, rationality, and consensus from the trial context that are systematically absent (or severely diluted) in referendum practice. Once these disanalogies are exposed:
  *   It **fails to provide strong support for the inherent legitimacy** of referendum outcomes, as the process lacks the rigor implied by the analogy.
  *   It **provides significant, albeit indirect, support for the incompetence objection** by showcasing the missing safeguards that protect jury decisions, especially concerning evidence quality, deliberation, and the risks of one-off, high-stakes decisions.
  *   The **Swiss iterative model** significantly rescues the analogy's applicability regarding legitimacy and mitigates incompetence concerns compared to **one-off votes like Brexit**, where the analogy breaks down most severely.
