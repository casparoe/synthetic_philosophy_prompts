prompt: |-
  I'm running a small grad seminar for policy students who mostly think philosophy is just opinions with fancy words. Next week I want to cover the is-ought gap and the naturalistic fallacy, but not as two dusty history-of-ideas topics — I want them to see it as one double-bind that keeps happening when people slide from descriptive stats to a recommendation without noticing the hidden value step in between. I'm leaning toward a made-up but realistic case: a city deploys an algorithm that predicts with 94% accuracy which neighborhoods will gentrify, and the council concludes they therefore ought to direct investment there. I need you to plan the explaination arc, not deliver the lecture itself.

  You're an expert in philosophy pedagogy with a background in applied ethics. Think carefully, do a quick brainstorm of the dependency relations first, then lay out a committed teaching plan: the exact order the pieces have to come in so the distinction doesn't collapse into "you can't derive morality from science," the one carrying example (it can be my algorithm scenario or something sharper, but defend your choice and say exactly what the example must have and what it must lack), and the misconceptions these students will definately form in sequence — I'm guessing they'll conflate Hume's logical point with Moore's open-question point, then think you're saying empirical science is useless for ethics, and maybe a third one about "natural" meaning "good" in evolutionary terms — plus exactly where in the arc you should head off each one. Give me a sharp check-at-the-end question that proves they understand the structural problem rather than just repeating the slogan. Also tell me which part of Moore's argument or Hume's reasoning I should openly refuse to unpack at this level and just flag. Don't list options; pick a definite sequence and stick to it. And no reading lists — I want the dependency map and the misconception map, not bibliography.
reasoning: |-
  Okay, the user is teaching a policy seminar where students see philosophy as just fancy opinions. They want to cover the is-ought gap and naturalistic fallacy as a practical double-bind when moving from data to policy recommendations. The key is to show how these concepts reveal a hidden value step, not just teach them as historical ideas. 

  First, I need to consider the dependencies. The students need to grasp descriptive vs. prescriptive statements first. Without that, Hume's point won't land. Then, introducing the algorithmic example makes it concrete. After that, Moore's naturalistic fallacy builds on Hume by showing that defining "good" with natural properties is flawed. The double-bind concept ties them together: you can't jump from facts to values without justification, and you can't define "good" using natural properties.

  The example needs to be clear and realistic. The gentrification algorithm works because it's a predictive model (is) leading to a policy ought. It must avoid controversial real-world data to keep focus on the logical jump. The students might conflate Hume and Moore, thinking they're the same. Or they might think empirical data is useless in ethics, which isn't true. Also, they might confuse "natural" in evolutionary terms with "good." Each misconception needs addressing at specific points. For instance, after explaining Hume, clarify that data informs ethics but doesn't dictate it. Preempt the evolutionary confusion when discussing Moore.

  The check question at the end should test if they see the structural issue: "What hidden value claim must be added to make this inference valid?" Refusing to unpack Moore's non-natural properties keeps it simple. The goal is to show the double-bind in policy reasoning, not delve into meta-ethics. The arc should flow from concrete example to concepts, addressing misconceptions as they arise to ensure students grasp the practical implication.
answer: |-
  Here's a tightly sequenced pedagogical arc designed to make the double-bind visceral, pre-empt key misconceptions, and force structural understanding. Dependency order is crucial: **Descriptive/Prescriptive → Hume's Gap → Moore's Fallacy → The Double-Bind → Application**.

  **Core Pedagogical Dependencies:**
  1.  Must distinguish *descriptive* ("is") from *prescriptive* ("ought") statements CLEARLY first.
  2.  Hume's Gap: Shows *logical invalidity* of inferring "ought" from *only* "is" premises.
  3.  Moore's Fallacy: Shows *conceptual error* of defining "good" *as* a natural property (like "efficient" or "predicted to gentrify").
  4.  **The Double-Bind:** **a)** You *cannot* validly get to "ought" without adding a value premise (Hume). **b)** You *cannot* smuggle that value premise in by *defining* "good" as the natural property you started with (Moore). Policy claims get stuck without explicit value justification.
  5.  Application: Use the case to show the double-bind in action.

  **Committed Teaching Sequence (90 mins approx.):**

  1.  **Hook & Baseline (10 mins):**
      *   Present **Your Algorithm Case (Defended Choice Below)**. "City Council sees algorithm predicts Neighborhood X will gentrify with 94% accuracy. Council concludes: 'Therefore, we *ought* to invest city funds in Neighborhood X to accelerate this.'"
      *   **Poll Students:** "Raise hand if this inference seems *initially plausible* or even obviously correct?" Discuss *why* briefly (efficient? inevitable? growth = good?).
      *   **Crucial Setup:** Explicitly label parts: "The algorithm output is a *descriptive* claim (what *is* likely to happen). The Council's conclusion is a *prescriptive* claim (what we *ought* to do)."

  2.  **Hume's Gap: The Logical Missing Link (20 mins):**
      *   **Core Point:** "Hume noticed a weird jump in reasoning. Look at the premises: All premises are *descriptive* (facts, stats, predictions). The conclusion is *prescriptive* (an 'ought'). How does the 'ought' magically appear? It doesn't logically follow *unless* a hidden prescriptive premise is assumed."
      *   **Reconstruct the Argument:**
          *   P1 (Descriptive): Algorithm predicts high probability of gentrification in X.
          *   P2 (Descriptive? Prescriptive?): ???? <-- **THE GAP**
          *   Conclusion (Prescriptive): Therefore, we ought to invest in X.
      *   **Identify the Hidden Premise:** "What *must* the Council be assuming to make this jump? (e.g., 'We *ought* to accelerate predicted gentrification' or 'Maximizing property value growth *is good*')."
      *   **Hume's Insight:** The "ought" conclusion *depends* on an "ought" (value) premise. You can't derive "ought" from "is" *alone*.
      *   ***Head Off Misconception #1 (Science Useless for Ethics) HERE:*** "This does **NOT** mean science is useless! Data is *essential* for *informing* ethical decisions. Hume's point is: Data tells you *what is*, not *what you should value* or *what your ultimate goal ought to be*. It constrains *how* you achieve goals, but doesn't set the goals themselves. The Council needs data *and* a justified value premise."

  3.  **Moore's Naturalistic Fallacy: The Definitional Dodge (20 mins):**
      *   **Pivot:** "So, maybe the Council tries to *define* their way out of Hume's Gap. They say: 'Gentrification *just is* good urban development! Look at the stats: higher property values, new businesses!'"
      *   **Moore's Core Point:** "Moore called this the 'Naturalistic Fallacy.' It's the mistake of trying to *define* the fundamental concept of 'good' by pointing to *any* natural property (like 'increases property values,' 'is pleasurable,' 'is efficient,' 'is evolved')."
      *   **The Open Question Test (Simplified):** "If someone says 'Good *means* increasing property values,' can you still meaningfully ask, 'But *is* increasing property values actually *good*?' (Yes!). If the definition were correct, that question would be nonsense ('Is increasing property values increasing property values?'). The fact the question stays 'open' shows 'good' isn't *identical* to any natural property."
      *   ***Head Off Misconception #2 (Conflating Hume & Moore) HERE:*** "Hume is about *logical inference* (can't *derive* 'ought' from 'is'). Moore is about *conceptual definition* (can't *define* 'good' *as* an 'is'). They attack different sneaky ways values get smuggled in." ***Head Off Misconception #3 (Natural=Evolutionary=Good) HERE:*** "'Natural property' for Moore means *anything* observable in the world – economic trends, biological facts, psychological states. It does **NOT** mean 'from nature' vs 'artificial'. Saying 'it's evolved/natural, therefore good' is *itself* a classic example of the fallacy! 'Natural' here just means 'part of the descriptive, scientific world'."

  4.  **The Double-Bind Revealed (15 mins):**
      *   **Synthesize:** "So, the policy maker trying to base an 'ought' purely on data faces a **Double-Bind**:
          *   **Bind 1 (Hume):** You can't *logically infer* an "ought" from *only* descriptive premises. You *must* add a value premise (e.g., "Accelerating gentrification is good").
          *   **Bind 2 (Moore):** You cannot *legitimately avoid justifying that value premise* by simply *defining* "good" *as* the descriptive outcome you started with (e.g., "Good *is* increasing property values"). That's circular and commits the fallacy.
      *   **The Crucial Move:** You are forced to explicitly state *and justify* the independent value judgment ("Why *should* we aim to accelerate gentrification? Is it *really* good, and for whom? What values are at stake – efficiency? equity? community stability?"). **The gap can't be leaped or defined away; it must be bridged with ethical reasoning.**

  5.  **Application & Check-for-Understanding (15 mins):**
      *   **Revisit the Algorithm Case:** "Where is the Double-Bind here? The Council jumped the Humean Gap (inferred 'ought' from 'is'). If challenged, they might try a Moorean Dodge ("Gentrification *is* good development"). Both fail. What *must* they do?"
      *   **Sharp Check Question (Proves Structural Understanding):**
          > **"What specific *value premise*, distinct from the algorithm's prediction, would the Council need to explicitly state AND justify to make their policy recommendation logically valid and avoid the naturalistic fallacy? (e.g., 'We *ought* to maximize citywide economic growth' or 'We *ought* to invest where market forces are strongest'). Now, why is *that* premise itself potentially controversial and in need of ethical defense, rather than just being assumed?"**
          *   *Why it works:* It forces them to (a) identify the hidden premise bridging Hume's Gap, (b) recognize that this premise is a value claim (not a fact), and (c) understand that *this* value claim is now the locus of legitimate ethical debate (exposing Moore's point). They must articulate the *structure* of the reasoning flaw and its remedy.
      *   **Brief Discussion:** Tie back to policy practice – the danger of "evidence-based" becoming "values-hidden."

  **Why Your Algorithm Case Works (and What It Must Lack):**
  *   **Defends Choice:** It's perfect. It features a clear, powerful *descriptive* input (predictive algorithm) immediately triggering a *prescriptive* output (investment decision). The jump feels "natural" to policy students, making the gap visible. It lacks overt moral controversy initially (like crime stats), letting the *logical* flaw take center stage. The "94% accuracy" tempts the "scientific = authoritative" confusion.
  *   **Must Have:**
      *   A clear, strong *descriptive* statement (prediction, stat, fact).
      *   An immediate, direct *prescriptive* conclusion ("therefore we ought...").
      *   No *explicit* value premise stated in the initial inference.
      *   Plausibility for the hidden value premise being smuggled in (growth=good).
  *   **Must Lack (Initially):**
      *   Overt, distracting moral debate *within the initial case statement* (e.g., don't start with "algorithm predicting crime by race"). Save the ethical debate *for after* exposing the double-bind.
      *   Complex causal chains obscuring the direct is-to-ought slide.

  **What NOT to Unpack (Flag Only):**
  *   **Hume:** Do *not* delve into his full meta-ethical views or the Treatise context. **Flag:** "Hume was making a broader point about reasoning in moral philosophy; we're zooming in on this specific logical gap relevant to policy inferences."
  *   **Moore:** Do *not* unpack "non-natural properties" or the complexities of intuitionism. **Flag:** "Moore argued 'good' was a simple, non-natural property knowable by intuition. We're setting aside *what* he thought 'good' actually was to focus solely on his critique of *defining* it as any natural property – that's the fallacy relevant to policy definitions of success."

  **Misconception Map & Interception Points:**
  1.  **"So you're saying science/data is useless for ethics?"** -> Intercepted explicitly **after explaining Hume (Step 2)**. Emphasize data *informs* but doesn't *determine* values/goals.
  2.  **"Hume and Moore are basically saying the same thing?"** -> Intercepted explicitly **when introducing Moore (Step 3)**, by contrasting Hume (inference) vs. Moore (definition).
  3.  **"Naturalistic fallacy means thinking anything natural (like evolution) is good?"** -> Intercepted explicitly **when defining 'natural property' for Moore (Step 3)**, clarifying "natural" = descriptive/scientific property, and noting that evolutionary justifications *exemplify* the fallacy.
  4.  **(Potential Fourth):** **"So we just need better definitions?"** -> Preempted by the Double-Bind synthesis **(Step 4)** showing Moore blocks the definitional escape route. The Check Question forces confronting this.

  This sequence forces students to see the double-bind as a *structural trap* in policy reasoning, not just abstract philosophy. The Check Question is the litmus test for whether they can diagnose the flaw in new cases.
