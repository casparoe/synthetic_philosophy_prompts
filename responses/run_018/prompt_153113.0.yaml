  Hmm, this is a sophisticated request. The user clearly has deep thoughts about this topic and wants to facilitate understanding among peers. They're concerned about the cognitive implications of AI dependence, not just practical risks. I notice they specifically want an explanatory arc rather than a lecture, concrete examples to carry the session, and strategies to address predictable misconceptions.

  The user anticipates some common defenses people might raise - like comparing AI to calculators or thinking verification equals understanding. That shows they've already reflected deeply on how people might push back. They also want to exclude scholarly references, keeping it accessible for non-specialists.

  I think the core challenge here is making abstract cognitive concepts tangible. The preliminary idea needed is that understanding involves active mental modeling - not just having correct information. Without establishing that, the extension vs. outsourcing distinction won't land. 

  For the concrete example, I'm considering a complex system like credit scoring. It's familiar enough that non-specialists engage with it, yet opaque enough that people might outsource understanding to AI. The key is showing how even with verification ability (checking if factors affect credit scores), one might not grasp why they matter - like how payment history's weight depends on context. This reveals the proxy model: knowing "the AI would consider X" without understanding X's role in the system.

  For misconceptions: The calculator analogy will likely come up early. I should address it when introducing the credit example by emphasizing that calculators extend calculation but don't replace system-level understanding. The verification point needs handling when discussing the proxy model - showing that checking outputs doesn't build causal mental models.

  The final question should test if they grasp the erosion mechanism itself. Something like: "How would you explain to someone why they understand a topic less after relying on AI explanations, even if they can verify them?" This forces articulation of the mental model atrophy.

  I'll structure it tightly: start with mental modeling as the foundation, then present the credit scenario to demonstrate outsourcing, contrast with extension examples, then unpack the erosion. Throughout, I'll anticipate and redirect those predictable defenses. The plan should acknowledge that not all knowledge requires deep modeling - we'll exclude that complexity to stay focused.

  The user's clearly put serious thought into this. My response should honor that depth while keeping the session practical and engaging for their friends.
answer: |-
  Here’s a focused teaching plan for your 90-minute session, structured to build the explanatory arc step-by-step:

  ---

  ### **Teaching Plan: "AI and the Erosion of Understanding"**
  **Core Claim:** Outsourcing judgment (vs. extending reasoning) erodes the construction of personal mental models, replacing them with "proxy models" tracking the AI’s outputs.

  ---

  #### **Phase 1: Foundation (15 mins)**  
  **Goal:** Establish the preliminary idea that *understanding requires active mental modeling*.  
  **Activity:**  
  - **Prompt:** *"Think of something you deeply understand (e.g., baking a cake, fixing a bike tire). How would you diagnose a problem if it went wrong? What details feel automatic?"*  
  - **Key Insight:** Highlight that their ability to troubleshoot relies on an **internal model**—a web of causes, effects, and relationships they built *themselves*.  
  - **Bridge:** *"When we use tools, we sometimes build on this model... but sometimes we skip building it entirely."*  

  ---

  #### **Phase 2: The Core Distinction (20 mins)**  
  **Goal:** Introduce **extension vs. outsourcing** using a concrete example.  
  **Chosen Example:** **Medical Triage Advice**  
     - *Why it works:*  
       - Familiar (everyone has health questions).  
       - Non-obvious complexity (symptoms interact unpredictably).  
       - High stakes (misjudgment has consequences).  
       - *Lacks* easy verification (non-specialists can’t reliably check AI’s reasoning).  
     - **Scenario:**  
       *"You have chest pain. AI says: ‘80% likely indigestion; 20% cardiac. Monitor symptoms.’"*  
     - **Contrast:**  
       - **Extension:** You use AI to *supplement* your knowledge (e.g., cross-referencing with trusted sources, noting gaps in your model).  
       - **Outsourcing:** You accept the output as a "final answer," storing *only* the conclusion ("AI said it’s probably fine").  
     - **Visual Aid:** Sketch two paths:  
       - **Extension:** `Your Model + AI → Updated/Stronger Model`  
       - **Outsourcing:** `AI Output → Proxy Model (tracking AI's past answers)`  

  ---

  #### **Phase 3: Erosion Mechanism & Misconceptions (30 mins)**  
  **Goal:** Show how outsourcing replaces mental models with proxy models.  
  **Activity:**  
  - **Erosion Demo:**  
    *"Imagine using AI for 10 triage questions. With outsourcing, you don’t learn patterns—you learn ‘what AI says about X.’ Your ‘model’ is just a lookup table of its outputs."*  
  - **Address Misconceptions Preemptively:**  
    - **"Verification is enough!"**  
      *When raised:* At the outsourcing stage.  
      *Counter:* *"Can you verify the AI’s reasoning for cardiac risk? Or just check if it cited a source? Without a mental model, you’re verifying *surface* features, not *causal* logic."*  
    - **"It’s like calculators!"**  
      *When raised:* During the distinction phase.  
      *Counter:* *"Calculators extend math skills you already understand (e.g., you know *why* 5×5=25). But if you outsource *why* symptoms indicate cardiac risk, you never build the model."*  
    - **"Search engines do this too!"**  
      *When raised:* During erosion discussion.  
      *Counter:* *"Search engines give sources to explore. Outsourcing to AI skips exploration—you get an answer *detached* from the scaffolding of knowledge."*  

  ---

  #### **Phase 4: Deliberate Exclusions (5 mins)**  
  **Acknowledge upfront:**  
  - *"We’re NOT discussing AI accuracy or ethics today."*  
  - *"We’re NOT saying all knowledge needs deep modeling (e.g., remembering capitals)."*  
  - *"This applies ONLY to domains where understanding causality/relationships matters."*  

  ---

  #### **Phase 5: Consolidation & Assessment (20 mins)**  
  **Socratic Discussion:**  
  - **Final Revealing Question:**  
    *"Imagine two people who use AI daily for complex tasks. Person A can parrot AI’s answers perfectly but falters when asked ‘What if X changed?’ Person B improvises plausible alternatives even when disagreeing with AI. What eroded for Person A that Person B protected?"*  
  - **Target Understanding:**  
    - Correct answer grasps that Person A lost the ability to **simulate alternatives** (a function of mental models), while Person B uses AI to **extend** their capacity for simulation.  
  - **Incorrect Answers:**  
    - *"Person A is lazy"* (misses structural erosion).  
    - *"Person B is smarter"* (misses the role of practice in model-building).  

  ---

  ### **Why This Sequence Works**  
  1. **Dependency Order:**  
     - Mental modeling → Extension/Outsourcing distinction → Erosion mechanism → Implications.  
     - Misconceptions are rebutted *when they naturally arise* in the arc.  
  2. **The Example’s Role:**  
     - Medical triage forces confrontation with *unverifiable complexity*—making "proxy models" visceral.  
     - Contrasts neatly with simple tools (calculators) where verification *is* possible.  
  3. **Assessing Understanding:**  
     - The final question tests comprehension of *mechanism* (inability to simulate alternatives = eroded mental modeling), not just skepticism.  

  **Session Close:** Emphasize that the goal isn’t to reject AI, but to **identify domains where active modeling is worth the effort**. Your group’s regular AI use makes this tension tangible for them.
