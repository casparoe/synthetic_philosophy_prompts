prompt: |-
  I work as a verification engineer for safety-critical autonomous systems, and I am attempting to design a knowledge-audit protocol that our certification team can run without requiring philosophical training. The protocol needs to be grounded in Nozick's tracking conditions for knowledge—specifically the sensitivity and adherence requirements that separate tracked true belief from accidental correctness—while confronting the standard tension with epistemic closure: a reasoning module may track a base premise P yet fail to track an entailed conclusion Q, because the nearby worlds in which Q is false are not identical to those in which P is false. Rather than resolving this tension theoretically, I need an operational decision procedure that translates tracking into executable audit steps.

  Please provide a step-by-step checklist my team can apply during module certification to determine whether a derived claim C counts as tracked knowledge given that the system tracks its premises. The procedure must include: (1) a practical method for constructing the relevant modal neighborhood around C using only counterfactual test-generation that our engineers can actually execute—without full possible-world semantics—specifying how many counterfactual branches are required and what counts as a nearby world in software terms; (2) an explicit test for what I will call entailment leakage, where adherence to the premises fails to transfer adherence to the conclusion, with a clear stopping rule that flags the failure; (3) a designated point at which the audit must halt and hand the decision to a human reviewer because the question involves values or irreducible heuristic judgment rather than deterministic verification; and (4) instructions for the case where sensitivity holds for P but adherence fails specifically for the entailment P→Q, including what certification status that combination should receive. Apply the procedure to two concrete scenarios: first, a navigation module that tracks the primary GPS signal is authentic and derives the vehicle is not being actively spoofed; second, a medical-diagnostic module that tracks all input sensors report values within nominal ranges and derives no critical fault condition is present. In at least one scenario, the procedure should produce a result that violates intuitive epistemic closure—state that result precisely and specify the manual override required. Throughout, distinguish steps that are mechanically executable from those that remain judgment calls dressed up as procedure, and do not include bibliographies, citations, or reading lists.
reasoning: |-
  We are designing a knowledge-audit protocol based on Nozick's tracking conditions (sensitivity and adherence) for safety-critical autonomous systems. The goal is to determine if a derived claim C is tracked knowledge given that the system tracks its premises. The protocol must handle the tension with epistemic closure.

  Definitions (simplified for engineering context):
  - **Sensitivity**: In nearby worlds where the claim C is false, the system does not believe C.
  - **Adherence**: In nearby worlds where C is true, the system believes C.
  - **Entailment leakage**: When the system adheres to the premises but fails to adhere to the conclusion, or when the system is sensitive to the premises but not to the conclusion.

  We are given that the system tracks the premises (i.e., for each premise P, the system is both sensitive and adheres to P). We want to check if the derived claim C (which is a logical consequence of the premises) is also tracked.

  The challenge: The set of nearby worlds where C is false might not be the same as the set where any single premise is false. In particular, the system might track a premise P but fail to track the conclusion C because the nearby worlds where C is false are not covered by the tracking of P.

  Procedure outline:

  1. **Inputs**: 
     - The set of premises {P1, P2, ..., Pn} that the system is known to track (both sensitive and adherent).
     - The derived claim C (which is a logical consequence of the premises, i.e., P1 ∧ P2 ∧ ... ∧ Pn → C is a tautology).
     - The system's reasoning module that outputs a belief in C based on the premises.

  2. **Step 1: Constructing the Modal Neighborhood for C**:
     - We need to define "nearby worlds" in software terms. We interpret "nearby" as:
          - For software: a counterfactual scenario that is generated by a small perturbation to the inputs or internal state of the system, but without changing the core functionality or the environment model. 
          - Specifically, we consider:
              a. Input perturbations: small changes to sensor inputs (within the range of typical noise or faults that the system is designed to handle).
              b. Internal state perturbations: small changes to non-critical internal variables (e.g., due to timing jitter, non-determinism in scheduling, etc.).
          - We exclude catastrophic failures (e.g., total system crash, major hardware failure) because they are not "nearby" in the operational sense.
     - **How many counterfactuals?**: We generate at least 3 counterfactual scenarios for each of the two types (input and internal) per premise and per conclusion, but the exact number may be adjusted by the human reviewer based on the criticality of the module. The goal is to have a representative sample of the neighborhood.

  3. **Step 2: Test for Sensitivity of C**:
     - **Definition**: In nearby worlds where C is false, the system should not believe C.
     - **Procedure**:
          a. Generate a set of nearby worlds where C is false. This is done by:
              - Identifying conditions that make C false (which may require negating C and finding consistent scenarios).
              - Applying perturbations (as defined in Step 1) that lead to those conditions.
          b. Run the system in these counterfactual scenarios and check the system's output for C.
          c. **Pass condition**: In every generated nearby world where C is false, the system does not believe C (i.e., outputs false or withholds belief appropriately).
          d. **Stopping rule for failure**: If in any of these scenarios the system believes C when C is false, then the sensitivity condition fails for C. Flag as "Sensitivity Failure for C".

  4. **Step 3: Test for Adherence of C**:
     - **Definition**: In nearby worlds where C is true, the system should believe C.
     - **Procedure**:
          a. Generate a set of nearby worlds where C is true (using the same perturbation methods as in Step 1, but ensuring C remains true).
          b. Run the system in these scenarios and check the system's output for C.
          c. **Pass condition**: In every generated nearby world where C is true, the system believes C (i.e., outputs true).
          d. **Stopping rule for failure**: If in any of these scenarios the system does not believe C when C is true, then the adherence condition fails for C. Flag as "Adherence Failure for C".

  5. **Step 4: Handling Entailment Leakage**:
     - **Definition**: Entailment leakage occurs when the system adheres to the premises (i.e., in nearby worlds where a premise P is true, the system believes P) but fails to adhere to the conclusion C in a world where the premises are true (and hence C is true) but the system does not believe C. This is a specific type of adherence failure for C that is particularly relevant because the premises are tracked.
     - **Test**:
          a. In the counterfactual scenarios generated for adherence of C (Step 3), we also record the system's belief in each premise.
          b. We look for scenarios where:
              - All premises are true (so the system should believe the premises and then derive C).
              - The system correctly believes each premise (so adherence holds for the premises).
              - But the system does not believe C.
          c. **Flag**: If such a scenario is found, then we have an entailment leakage. This is a special case of adherence failure for C that must be flagged separately because it indicates the reasoning module is faulty even though the premise trackers are working.

  6. **Step 5: Handling the Case Where Sensitivity Holds for P but Adherence Fails for the Entailment P→Q**:
     - In this context, we are considering the entailment rule itself. Suppose we have a premise P and we derive Q via P→Q. We are given that the system tracks P, but we must also check the rule P→Q? Actually, we are not directly tracking the rule. Instead, we are concerned with the system's use of the rule.
     - However, note that the system's derivation of Q from P is part of the reasoning module. We are already testing the adherence and sensitivity of Q. But there is a particular issue: 
          - The system might be sensitive to P (so when P is false, the system doesn't believe P, and hence doesn't derive Q) but fail to adhere to the entailment. That is, in a world where P is true, the system might not derive Q even though P→Q is true (because the reasoning module fails to apply the rule).
     - This is exactly the entailment leakage we defined in Step 4. So we have covered it.

     However, the question asks for the case where "sensitivity holds for P but adherence fails specifically for the entailment P→Q". This is equivalent to: the system is sensitive to P (so in nearby worlds where P is false, the system doesn't believe P) and the system adheres to P (so in nearby worlds where P is true, the system believes P). But the system fails to adhere to Q in a world where P is true (and hence Q is true). This is again entailment leakage (for Q).

     **Certification status for this case**: 
          - The premise P is tracked (both sensitive and adherent).
          - The conclusion Q fails adherence (specifically by entailment leakage) because the system believes P (so it should derive Q) but it doesn't.
          - Therefore, Q is not tracked (because adherence fails). We would not certify Q as knowledge.

  7. **Step 6: Human Review Handoff**:
     - The audit must halt and hand the decision to a human reviewer when:
          a. The counterfactual scenarios required to test sensitivity or adherence of C involve value judgments (e.g., what counts as a "small" perturbation in a context where safety is at stake) that cannot be determined by the engineering team without ethical or policy input.
          b. The definition of "nearby worlds" becomes ambiguous or contested (e.g., when the system operates in an environment that is not well-modeled, or when the perturbation might lead to a scenario that is physically impossible but logically possible).
          c. The reasoning for deriving C involves a heuristic that cannot be fully specified (e.g., a machine learning model that is not transparent) and hence the counterfactual behavior cannot be deterministically verified.
     - **Handoff instruction**: When any of the above occurs, the audit team must document the specific ambiguity or heuristic and escalate to a human reviewer (e.g., a safety officer or an ethics board) for a judgment call. The human reviewer must decide whether the counterfactual scenario is relevant and whether the system's behavior in that scenario is acceptable.

  8. **Output**:
     - If both sensitivity and adherence tests for C pass, then C is tracked and can be certified.
     - If either test fails, then C is not tracked. The type of failure must be documented (sensitivity, adherence, or entailment leakage).

  Application to Scenarios:

  **Scenario 1: Navigation Module**
  - Premise P: "The primary GPS signal is authentic."
  - Derived claim C: "The vehicle is not being actively spoofed."

  Note: We assume that the system tracks P (so it is sensitive and adherent to the authenticity of the primary GPS signal).

  Step 1: Constructing nearby worlds for C.
     - Nearby worlds: perturbations that might cause spoofing (e.g., introducing a weak spoofed signal, or a signal with incorrect timing that the system might still accept as authentic?).

  But note: There is a logical relation: if the GPS signal is authentic, then the vehicle is not being spoofed (because spoofing would imply the signal is not authentic). So P → C is a tautology.

  However, the system may not be tracking C. Why? Because the nearby worlds where C is false (spoofing is occurring) might be worlds in which the spoofing is so sophisticated that the system still believes the signal is authentic (i.e., P is true). But if the system tracks P, then in a world where the signal is not authentic (P false), the system would not believe P. However, in a spoofing scenario (C false) the signal might appear authentic (so P is false? Actually, if the spoofing is successful, the signal is not authentic, but the system might be fooled into believing it is authentic). This is a problem for the tracking of P.

  But we assumed the system tracks P. So by sensitivity, in a world where the signal is not authentic (i.e., P is false), the system would not believe P. In a spoofing attack, the signal is inauthentic (P false). So the system would not believe P, and hence it would not derive C (because it doesn't have P). Therefore, the system would not believe C in a spoofing scenario? But note: C is "not being spoofed", so in a spoofing scenario, C is false. We want the system not to believe C (which it doesn't because it doesn't believe P and hence doesn't assert C). So sensitivity of C might hold.

  Now, what about adherence? In a nearby world where there is no spoofing (C true), the system should believe C. Since the system tracks P, in a world with no spoofing, the signal is authentic (P true), so the system believes P and then derives C (by the entailment). So adherence of C should hold.

  But wait: what if the system has an alternative way of knowing about spoofing? Actually, we are only considering the derivation from P. However, the system might have other sensors. But in this scenario, we are told that the system derives C from P.

  However, there is a catch: the entailment is not being tracked? We need to test:

  Test sensitivity for C:
     - Generate a nearby world with spoofing (C false). How? We inject a spoofed GPS signal that is designed to be undetectable by the system's current methods (but note: we are generating counterfactuals that the engineers can create). In this scenario, the spoofing attack is such that the system's P-tracker still believes P (because the spoofing is sophisticated). But wait, we assumed the system tracks P. So by sensitivity, if the signal is inauthentic (which it is in spoofing), the system should not believe P. But if the spoofing is so good that the system cannot tell, then we have a violation of sensitivity for P. But we assumed P is tracked. Therefore, our counterfactual must respect that P is tracked. So we cannot create a nearby world where the signal is inauthentic and the system believes P? That would break the sensitivity of P.

  Therefore, we must create a spoofing scenario that is not nearby? That's a problem.

  Alternatively, note: the tracking condition for P requires that in all nearby worlds where P is false, the system does not believe P. So if we are to create a nearby world where C is false (spoofing) and the signal is inauthentic (so P is false), then by the tracking of P, the system will not believe P. Therefore, the system does not have the premise P to derive C. So the system will not assert C (because it doesn't have P). Therefore, the system does not believe C when C is false. So sensitivity for C holds.

  Now, test adherence for C:
     - In a nearby world with no spoofing (C true), the signal is authentic (P true). By adherence of P, the system believes P. Then by the entailment, the system should derive C. But what if the reasoning module fails? We must test for entailment leakage.

     We generate a counterfactual where there is no spoofing (so P true and C true). We perturb the system (e.g., introduce a timing glitch in the reasoning module). We see if the system still outputs C. If it does not, then we have entailment leakage.

     But note: the system might rely on other factors? The scenario says it derives C from P. So we assume the reasoning module is a simple entailment: if P then C.

     However, if the reasoning module fails, then we have an entailment leakage. So we must test.

     **Result for Scenario 1**: 
          - If the reasoning module is robust to the perturbations (i.e., it always outputs C when P is true), then C is tracked. 
          - But if the reasoning module fails in some nearby world (e.g., due to a software bug), then we have an adherence failure (entailment leakage) and C is not tracked.

     In this scenario, we do not expect a violation of closure because the reasoning is simple. But if the module is complex and buggy, closure might fail.

  **Scenario 2: Medical-Diagnostic Module**
  - Premises: P1, P2, ..., Pn: "All input sensors report values within nominal ranges."
  - Derived claim C: "No critical fault condition is present."

  We assume the system tracks each premise (each sensor reading is tracked: the system is sensitive and adherent to each sensor being in nominal range).

  But note: The entailment: if all sensors are in nominal range, then no critical fault is present. This is a heuristic. Why? Because there might be a fault that does not manifest in the sensors (e.g., a latent fault, or a fault in a component not monitored by the sensors). Therefore, the entailment is not logically necessary.

  However, the system is designed with a model: it believes that if all sensors are nominal, then there is no critical fault. But this model might be flawed.

  Step 1: Constructing nearby worlds for C.
     - Input perturbations: slightly alter one or more sensor readings to be out-of-range (but note: we are testing for C false, so we need worlds where there is a critical fault). Alternatively, we can create a world where there is a critical fault that does not affect the sensors (so the sensors are still in nominal range).

  Test sensitivity for C:
     - We generate a nearby world where a critical fault is present (C false). But the sensor readings are still within nominal ranges (so all premises are true). Why? Because the fault is not detectable by the sensors. 
     - In this world, the system believes each premise (because the sensor readings are nominal, and the system tracks each premise, so it believes each sensor is nominal). Then the system will derive C (no critical fault) because it sees all sensors nominal. So the system believes C when C is false. Thus, sensitivity fails for C.

  But note: we assumed the premises are tracked. In this counterfactual world, each premise (each sensor is nominal) is true. So by adherence of the premises, the system believes each premise. Then the system uses the rule: if all sensors are nominal, then no critical fault. So it derives C. But C is false. Therefore, the system believes a false C.

  This is a failure of sensitivity for C. Therefore, C is not tracked.

  This violates epistemic closure: the system tracks each premise (each sensor nominal) and the conclusion C is logically entailed by the system's own rule, but the rule is fallible. The problem is that the set of nearby worlds where C is false (critical fault) includes worlds where the premises are still true (sensors nominal). The system's rule does not account for that.

  Therefore, the result: C is not tracked.

  Manual override: The human reviewer must decide whether the system's heuristic (that nominal sensors imply no critical fault) is acceptable given the safety requirements. The reviewer might require additional redundancy or fault detection mechanisms.

  Checklist:

  **Knowledge-Audit Protocol for Derived Claim C**

  **Inputs**: 
  - Premises P1, P2, ..., Pn (each is tracked by the system).
  - Derived claim C (logically entailed by the premises in the system's model).
  - The reasoning module that derives C from the premises.

  **Step 1: Define Nearby Worlds for C**
     - Use counterfactual test generation:
          a. **Input perturbations**: Alter sensor inputs within the range of typical noise or expected fault conditions (e.g., ±5% of nominal for continuous sensors, or single-bit flips for digital). Generate at least 3 input-perturbed scenarios for each premise and for C (total at least 3 per claim type).
          b. **Internal perturbations**: Alter non-critical internal state variables (e.g., by introducing one cycle of delay in a non-critical process, or changing a non-critical parameter by a small amount). Generate at least 3 such scenarios.
     - **Exclusions**: Do not consider scenarios that cause system crashes or catastrophic failures (these are not nearby). Also exclude scenarios that require changing the environment model (e.g., introducing a new physical law) or that are physically impossible in the operational domain.
     - **Handoff to human**: If the team cannot agree on what counts as a "small" perturbation or if the perturbation involves a value judgment (e.g., what is an acceptable risk), then halt and escalate.

  **Step 2: Test Sensitivity of C**
     - Generate a set of counterfactual scenarios (as in Step 1) where C is false. (Note: This may require creating conditions that make C false, which might involve more than just perturbing inputs; it might require designing a fault injection that causes C to be false but is still a nearby world.)
     - For each scenario:
          a. Run the system and record the system's belief in C.
          b. If the system believes C (i.e., outputs true or equivalent) in any scenario where C is false, then sensitivity fails. Flag "Sensitivity Failure" and stop the test for C (proceed to document).
     - **Stopping rule**: If any failure is found, stop and mark C as not tracked.

  **Step 3: Test Adherence of C**
     - Generate a set of counterfactual scenarios (as in Step 1) where C is true.
     - For each scenario:
          a. Run the system and record the system's belief in C.
          b. If the system does not believe C (i.e., outputs false or withholds) in any scenario where C is true, then adherence fails. Flag "Adherence Failure".
     - Additionally, in these scenarios, check for entailment leakage:
          - Also record the system's belief in each premise.
          - If there is any scenario where:
               - All premises are true (and the system correctly believes each premise, i.e., the premises are tracked and the system adheres to them in this scenario).
               - C is true.
               - But the system does not believe C.
          - Then flag "Entailment Leakage".

  **Step 4: Certification Decision**
     - If both sensitivity and adherence pass: C is tracked -> certify.
     - If either fails: C is not tracked -> do not certify.
     - In the case of entailment leakage (a special adherence failure), document the reasoning module failure.

  **Step 5: Specific Case Handling**
     - If sensitivity for the premises holds, but there is an entailment leakage for the conclusion (i.e., the premises are true and the system believes them, but the system fails to believe the conclusion when it should), then C fails adherence -> do not certify.

  **Step 6: Human Review Handoff Points**
     - Handoff must occur when:
          a. Defining "nearby" requires value judgments beyond engineering (e.g., what constitutes an acceptably safe perturbation).
          b. The logical entailment between premises and C relies on a heuristic that cannot be verified deterministically (e.g., a machine learning model) and the counterfactual behavior is uncertain.
          c. The counterfactual scenario generation requires simulating conditions that are outside the system's operational design domain (and thus might be considered "distant").
     - The human reviewer (e.g., safety officer) must then decide whether the scenario is relevant and whether the system's behavior is acceptable.

  **Scenario 1 (Navigation) Result**:
     - Sensitivity for C: We generate a spoofing attack (C false) scenario. Because the system tracks P (so in this scenario, since the signal is inauthentic, the system does not believe P) and without P, the system does not derive C -> so the system does not believe C when C is false. Pass.
     - Adherence for C: We generate a non-spoofing scenario (C true) and perturb. If the reasoning module is robust, the system believes C. But if a perturbation causes the module to fail to derive C when P is true, then we have an entailment leakage and fail.
     - Certification: If no leakage, certify. Otherwise, not.

  **Scenario 2 (Medical) Result**:
     - Sensitivity for C: We generate a nearby world with a critical fault (C false) but all sensor readings are nominal (so premises are true). The system, because it adheres to the premises, believes each premise and then derives C (no critical fault). So the system believes C when C is false -> sensitivity fails. Do not certify.
     - This violates epistemic closure: the system has tracked beliefs in the premises and the conclusion follows by the system's rule, but the rule is fallible in a nearby world.
     - Manual override: The human reviewer must evaluate the adequacy of the system's fault detection. They might accept the risk (if the chance of such a fault is very low) or require design changes.

  **Final Note**: The procedure is executable for deterministic software. Steps that remain judgment calls (e.g., defining nearby worlds, handling heuristics) are explicitly handed off.
answer: |-
  Below is a step-by-step knowledge-audit protocol for your certification team, designed to operationalize Nozick's tracking conditions (sensitivity and adherence) for derived claims in safety-critical systems. The protocol includes explicit handling of epistemic closure tensions, entailment leakage, human-review handoffs, and certification statuses. Two concrete scenarios are analyzed to demonstrate violations of closure and required overrides.

  ---

  ### **Knowledge-Audit Protocol for Derived Claims**  
  **Inputs**:  
  - Premises \(P_1, P_2, \dots, P_n\) (already verified as tracked by the system).  
  - Derived claim \(C\) (logically entailed by the premises).  
  - Reasoning module \(M\) that outputs belief in \(C\) given the premises.  

  **Output**: Certification status of \(C\) (Tracked/Not Tracked/Requires Human Review).  

  ---

  #### **Step 1: Construct Modal Neighborhood for \(C\)**  
  **Objective**: Define "nearby worlds" for \(C\) using executable counterfactual tests.  
  **Procedure**:  
  1. **Identify perturbation sources** (mechanically executable):  
     - **Input perturbations**: Inject small errors into sensor inputs (e.g., ±5% noise for analog sensors, single-bit flips for digital inputs).  
     - **Internal perturbations**: Alter non-critical internal states (e.g., vary timing delays ±10%, shuffle non-safety-critical process execution order).  
  2. **Generate counterfactual branches** (mechanically executable):  
     - For each perturbation type, generate **3 counterfactual scenarios** where \(C\) is *true* and **3 where \(C\) is *false***.  
     - **Stopping condition**: Total of 12 scenarios (6 input-based + 6 internal-based).  
  3. **Define "nearby"** (judgment call dressed as procedure):  
     - A world is "nearby" if:  
       - Perturbations are within the system’s specified operational envelope (e.g., ISO 26262 ASIL-D fault tolerance bounds).  
       - No perturbation induces catastrophic failure (e.g., kernel panic, deadlock).  
     - **Handoff to human**: If perturbations require violating physical laws (e.g., simulating GPS spoofing in a Faraday cage) or involve ethical tradeoffs (e.g., fault injection risking patient harm in medical devices).  

  ---

  #### **Step 2: Test Sensitivity of \(C\)**  
  **Objective**: Verify \(M\) does not believe \(C\) in nearby worlds where \(C\) is false.  
  **Procedure** (mechanically executable):  
  1. Execute all 6 counterfactual scenarios where \(C = \text{false}\).  
  2. **Check**: For each scenario, if \(M\) outputs \(\text{Belief}(C) = \text{true}\), sensitivity **fails**.  
  3. **Stopping rule**: Halt and flag "Sensitivity Failure" if any failure occurs.  
     - *Certification status*: \(C\) is **Not Tracked**.  

  ---

  #### **Step 3: Test Adherence of \(C\) and Entailment Leakage**  
  **Objective**: Verify \(M\) believes \(C\) in nearby worlds where \(C\) is true, and check for entailment leakage.  
  **Procedure**:  
  1. **Adherence test** (mechanically executable):  
     - Execute all 6 counterfactual scenarios where \(C = \text{true}\).  
     - **Check**: If \(M\) outputs \(\text{Belief}(C) = \text{false}\) in any scenario, adherence **fails**.  
  2. **Entailment leakage test** (mechanically executable):  
     - In all \(C = \text{true}\) scenarios, validate:  
       - Premises \(P_1, \dots, P_n\) are **true** (by construction).  
       - System’s belief in each \(P_i\) is **correct** (i.e., \(\text{Belief}(P_i) = \text{true}\)).  
     - **Check**: If premises are true and correctly believed, but \(\text{Belief}(C) = \text{false}\), flag "Entailment Leakage".  
  3. **Stopping rule**:  
     - Adherence failure → \(C\) is **Not Tracked**.  
     - Entailment leakage → \(C\) is **Not Tracked** (document leakage).  

  ---

  #### **Step 4: Handle Adherence Failure for \(P \rightarrow Q\)**  
  **Objective**: Address cases where sensitivity holds for \(P\) but adherence fails for entailment \(P \rightarrow Q\).  
  **Procedure** (mechanically executable):  
  1. **Condition**: Sensitivity for \(P\) verified (Step 2 passed for \(P\)), but entailment leakage detected for \(C \equiv Q\) (Step 3).  
  2. **Diagnosis**: Reasoning module \(M\) fails to propagate belief from \(P\) to \(Q\) when \(P\) is true.  
  3. **Certification status**: \(C\) is **Not Tracked** (due to adherence failure).  
     - *Documentation*: "Entailment rule \(P \rightarrow Q\) not operationally adhered to."  

  ---

  #### **Step 5: Human Review Handoff**  
  **Objective**: Escalate judgment-based decisions.  
  **Trigger conditions** (judgment calls dressed as procedure):  
  - **Ambiguous perturbations**: "Nearby" world requires heuristic weighting of risks (e.g., spoofing likelihood vs. GPS drift).  
  - **Non-deterministic outputs**: \(M\) uses ML components with unverifiable counterfactual behavior.  
  - **Value conflicts**: Test scenario involves safety tradeoffs (e.g., false negative vs. false positive in medical diagnosis).  
  **Procedure**:  
  1. Freeze audit and document:  
     - Specific ambiguity/value conflict.  
     - Counterfactual scenarios that triggered handoff.  
  2. **Handoff outcome**: Human reviewer decides "Tracked" (acceptable risk) or "Not Tracked" (design change required).  

  ---

  ### **Scenario Applications**  
  #### **Scenario 1: Navigation Module**  
  - **Premise \(P\)**: "Primary GPS signal is authentic." (Tracked)  
  - **Claim \(C\)**: "Vehicle is not being actively spoofed." (Derived: \(P \rightarrow C\))  
  - **Audit**:  
    - **Step 1**: Generate spoofing scenarios (\(C = \text{false}\)): Inject GPS signals with manipulated timestamps (nearby if within 100ns jitter tolerance).  
    - **Step 2 (Sensitivity)**: In spoofing scenarios, system correctly rejects \(P\) → \(\text{Belief}(C) = \text{false}\) → **Pass**.  
    - **Step 3 (Adherence)**: In non-spoofing scenarios (\(C = \text{true}\)), system believes \(P\) but a timing perturbation causes \(M\) to crash → \(\text{Belief}(C) = \text{false}\) → **Entailment Leakage**.  
    - **Result**: \(C\) is **Not Tracked** (entailment leakage).  
    - **Closure violation**: Premise \(P\) is tracked, but \(C\) is not due to module fragility.  

  ---

  #### **Scenario 2: Medical Diagnostic Module**  
  - **Premises \(P_i\)**: "All input sensors report nominal ranges." (Tracked)  
  - **Claim \(C\)**: "No critical fault condition is present." (Derived: \(\bigwedge P_i \rightarrow C\))  
  - **Audit**:  
    - **Step 1**: Generate \(C = \text{false}\) scenarios: Sensor values nominal (so \(P_i = \text{true}\)), but latent battery fault (uncorrelated with sensors).  
    - **Step 2 (Sensitivity)**: System believes \(P_i\) (adherence holds), infers \(C\) → \(\text{Belief}(C) = \text{true}\) when \(C = \text{false}\) → **Sensitivity Failure**.  
    - **Result**: \(C\) is **Not Tracked**.  
    - **Closure violation**: All \(P_i\) tracked, entailment \(\bigwedge P_i \rightarrow C\) holds in design, but sensitivity fails for \(C\) due to sensor coverage gap.  
    - **Manual override**: Human reviewer assesses fault coverage. If battery fault is "distant" (probability < \(10^{-9}\)/hour), override to **Tracked**. Else, redesign required.  

  ---

  ### **Protocol Summary**  
  | **Step**               | **Mechanically Executable?** | **Outputs/Flags**                          |  
  |------------------------|------------------------------|--------------------------------------------|  
  | 1. Modal neighborhood  | Partial (handoff triggers)   | 12 counterfactual scenarios                |  
  | 2. Sensitivity test    | Yes                          | Pass/Fail (fail → Not Tracked)             |  
  | 3. Adherence test      | Yes                          | Pass/Fail/Entailment Leakage (fail → Not Tracked) |  
  | 4. \(P \rightarrow Q\) | Yes                          | "Not Tracked" + leakage documentation     |  
  | 5. Human handoff       | No (judgment-based)          | Escalation to reviewer                     |  

  **Final Certification Rules**:  
  - **Tracked**: Sensitivity and adherence pass, no entailment leakage.  
  - **Not Tracked**: Any failure in Steps 2–4.  
  - **Requires Human Review**: Step 1 or 5 triggered.  

  This protocol ensures epistemic closure failures are detected operationally (e.g., sensor coverage gaps in Scenario 2), with clear override points for residual judgment.
