prompt: |-
  Ok so last night me and my friend Maya spent like three hours arguing about whether misleading someone is morally better than lying to them, and we got absolutely nowhere, so we've agreed to try doing it properly as an adversarial collaboration. I need you to draft the joint statement we'd produce if we did this in good faith.

  Here's roughly where we each stand, so the document has something to work with. Her view (the "no real difference" camp): lying and misleading are both just intentionally getting someone to believe something false, the saying-vs-implicating line is a fact about language not about morality, and the intuition that misleading is gentler is basically a self-serving myth people use to feel clean while doing teh same thing. My view: there's a genuine difference, because when you lie you stake your own authority on the falsehood, whereas when you mislead with literally true statements the false conclusion is something the listener infers — they're partly a participant in their own deception, and that changes what you've done to them, even if both are wrong.

  Cases that came up, which the statement has to engage with:

  - Selling a car: saying "nothing's wrong with it" (false, the brakes are shot) vs saying "it ran fine on the drive over" (true, crafted to make the buyer think it's sound). Maya says these are the same wrong; I say the second is bad but not identical.
  - Cancelling plans with a false excuse ("my aunt's in town") vs a true-but-pointless one ("I have so much laundry").
  - Answering "were you out with Dan last night?" with "I was home by ten" — true, but Dan was over before ten.
  - The murderer at the door: is steering him wrong with truths any better than a flat lie, or is scrupulousness there just dodging responsibility while getting the same result?
  - One I raised late in the night: a blatant lie nobody believes vs a subtle misleading that fully works. If lying is worse because of what the liar commits to, this comparison should come out a specific way — and Maya thinks it doesn't.

  What I want in the document:

  1. A numbered section of claims we can both sign — stuff like what lying and misleading have in common, what neither of us is claiming, which cases we agree are clear wrongdoing.
  2. A disagreements table, where each disagreement is stated precisely enough that each of us would accept the wording of our own side — not a mushy compromise version neither of us holds.
  3. The cruxes: the sub-questions where an answer would actually move one of us. Candidates I suspect: whether the commitment/authority difference is morally load-bearing or just descriptive; whether the listener's role in drawing the inference matters; whether the distinction is one of kind or degree.
  4. For each crux, some case, argument, or observation we'd both accept as bearing on it, with each side's prediction about it written down in advance.

  One more thing: I suspect part of our fight was verbal — she counts "leaving out the crucial detail" as misleading and I only meant actively engineered true statements — so if the drafting process turns up a disagreement like that, the statement should flag it as terminological instead of smoothing it over.

  Write it like an actual document we could both put our names at the bottom of, not a referee's verdict on who won.
