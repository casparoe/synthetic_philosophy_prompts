answer: |-
  **Initial reaction**  
  *Adjusts spectacles, frowning slightly*  
  This scenario unsettles me. You describe a mere behavioural correlation reinforced by unseen mechanisms—precisely the sort of case where I’d deny convention obtains. Where is the *mutual recognition*?  

  **Conceptual reply**  
  Convention, as I defined it, is a regularity in behaviour sustained by *preferences for conformity conditional on others’ conformity*, grounded in common knowledge. Your “norm” lacks this epistemic structure. Users act not because they expect *others* to recognise the emoji as scepticism and act accordingly, but because an opaque system rewards it—like rats pressing a lever for food. This solves no coordination problem; it merely exploits a causal link. Coordination requires agents to align actions through *mutual expectations*. Here, users needn’t even conceive of one another’s agency—they respond to algorithmic stimuli, not shared understandings. Without common knowledge that “we all use this to signal scepticism,” the regularity remains a product of individual reinforcement, not social agreement. Correlation isn’t convention.  

  **Counter-question**  
  If your users act blindly, ignorant of others’ interpretations, how can this possibly constitute *coordination* rather than parallel stimulus-response?
