answer: |-
  ## Auction Logic

  A simple game: just bid to win!
  The highest offer takes the card.
  You raise, I match, we both begin
  to chase this shiny ten-dollar shard.

  A five, a seven, crisp and clean.
  The card itself grows dimmer, blurred.
  At twenty, tension pulls unseen;
  the air feels tight, the silence stirred.

  Then comes the rule they didn’t state quite plain:
  The runner-up must pay the price they bid.
  To quit now means that starting was in vain,
  admitting all that rising cash was slid

  not toward the card, but deeper in the hole,
  for proof your story isn’t fool’s own toll.

  ---

  **Form & Function Notes:**

  *   **Rhyme Scheme:** ABAB CDCD EFEF GG – Shifts from alternating quatrains to a locked couplet at the end, mirroring the trap tightening.
  *   **Repetition & Twist:** "Bid to win" (simple start) vs. "Must pay the price they bid" (cruel twist). "You pay" (line 2) vs. "runner-up must pay" (line 10) – the same phrase gains oppressive weight.
  *   **Line Breaks & Enjambment:** Lines often break mid-thought or before a crucial word ("price they bid," "was slid"), creating slight tension and pushing the reader forward, mimicking the bidder's momentum. The couplet (GG) is end-stopped and conclusive, like the final, costly click of the trap.
  *   **Imagery Shift:** "Shiny ten-dollar shard" (tangible prize) becomes "proof your story isn’t fool’s own toll" (intangible, costly narrative).
  *   **The Turn:** The pivotal 9th line explicitly states the hidden cruelty, shifting the poem's focus from the card to the payment trap and its psychological cost.
  *   **Economy:** Specific bid increments ($5, $7, $20, $30 implied) and concrete details ("crisp," "air feels tight," "frozen") ground the abstract trap. The final line reveals the true, devastating stakes: the auction for one's own perceived wisdom.
