prompt: |-
  You're acting as a sharp philosopher of technology and medicine—someone who actually reasons from scratch rather than just summarizing literature. Before you answer, do a quick mental brainstorm: list three different ways people try to draw the therapy/enhancement line, then throw away the weakest one.

  I'm trying to figure out my own view by checking my gut on cases. Correcting severe myopia with glasses: therapy, no doubt. Giving the same glasses to someone with 20/20 vision so they can see farther: enhancment, not therapy. Now here's the weird one: there's a hypothetical "cognitive scaffolding" chip—think of it like an internal notebook that only works if your brain is already running a certain baseline OS. For someone whose natural working memory is broken, it restores normall function. For someone average, it just gives them a slight edge. I feel like using it in the broken case is therapy, but in the average case it's enhancment, even though it's literally the same chip. Does that make sense?

  More cases. A drug that eliminates depression in a clinically depressed person: therapy. The same drug taken by a healthy person to feel more motivated: enhancment. But what about a person who is "subclinically" sad—functioning, but grey? I say therapy if it gets them back to a typical emotional range, but enhancment if it makes them unusually cheerful. Is there a principle here?

  Last one, and it's the one I keep flipping on: imagine future parents can do a "genetic baseline reset" for their kid—not fixing any disorder, just adjusting the kid's traits to match whatever the current societal average is, because the parents come from an older generation with lower cognitive baselines due to historical nutrition deficits. I can't decide if that's therapy (restoring the kid to the modern norm) or enhancment (giving them an unfair leg up relative to their parents). What's your principle, and which of my calls does it break?

  Please don't just list philosophers. Give me the actual principle, apply it to the genetic reset case, and be honest about which verdict I'd have to drop.
reasoning: |-
  Okay, the user wants me to act as a sharp philosopher of technology and medicine, reasoning from scratch. They provided several thought experiments about the therapy/enhancement distinction: glasses for vision, a cognitive scaffolding chip, an antidepressant drug for different cases, and a genetic baseline reset for future children. They want me to develop a principle that explains these cases and apply it consistently.

  First, I need to brainstorm three common ways people draw the therapy/enhancement line. One approach is the statistical norm—therapy restores typical function, enhancement goes beyond. Another is the species-typical norm, where therapy fixes deviations from human evolutionary biology. A third could be functional capacity—therapy addresses impediments to basic functioning. The weakest is probably the species-typical norm since it's too rigid and ignores changing environments.

  The user's intuitions seem to center on function relative to context. For the cognitive chip, restoring broken memory is therapy, while boosting average is enhancement. Same with the drug: curing depression is therapy, but giving motivation to healthy people is enhancement. The subclinical case is tricky—if it brings someone to typical function, it's therapy, but beyond that, it's enhancement. 

  The genetic reset case is the toughest. Parents adjusting their child's traits to current societal averages because of their own lower baselines from historical nutrition deficits. The user is torn between seeing it as restoration (therapy) or giving an advantage (enhancement). 

  My principle: Therapeutic interventions restore functional capacity necessary for an individual to participate effectively in their societal context without giving them a competitive advantage beyond that baseline. Enhancement provides capabilities exceeding what's needed for effective participation in that context. 

  Applying this to genetic reset: If the adjustment merely brings the child to the current average functional capacity needed for their society, it's therapy. It's compensating for the parents' historical disadvantage. But if it pushes the child beyond the current norm, it becomes enhancement. The key is the societal context—what's necessary for functioning, not surpassing others. 

  This principle aligns with most of the user's calls. The cognitive chip for a broken memory restores necessary function, so therapy. For average, it's enhancement since it exceeds what's needed. The antidepressant for clinical depression is therapy; for a healthy person, enhancement. Subclinical: if it brings to typical emotional range, therapy; beyond that, enhancement. 

  The genetic reset, under this principle, would be therapy if it only meets the current norm. But the user might have to drop the idea that it's an "unfair leg up" relative to parents since the baseline is societal, not generational. The child isn't being enhanced beyond peers, just restored to the current standard. That's the adjustment needed.
answer: |-
  Here's my raw reasoning, followed by a synthesized principle and its application. I discarded the "species-typical functioning" approach (Boorse-style) as weakest because it ignores how environmental/technological shifts redefine "normal" function (e.g., reading isn't evolutionarily "typical," yet literacy is functionally essential today).

  **Your Cases & My Principle:**
  1.  **Glasses:** Therapy for severe myopia (restores baseline visual function needed for societal participation). Enhancement for 20/20 vision (exceeds baseline).
  2.  **Cognitive Scaffolding Chip:** Therapy for broken working memory (restores baseline cognitive function). Enhancement for average working memory (exceeds baseline). **Your instinct holds.** The identical chip *does* shift categories based on the user's *starting functional capacity relative to societal demands*. The "OS baseline" metaphor is key – it restores system stability for the broken, but is an add-on module for the functional.
  3.  **Antidepressant:** Therapy for clinical depression (restores baseline affective function). Enhancement for healthy motivation boost (exceeds baseline). **Subclinical greyness:** Therapy *only* if it brings them firmly within the *functional range* typical for their environment (e.g., can consistently work, maintain relationships). If it pushes them *beyond* that functional baseline (persistently euphoric, hyper-motivated), it becomes enhancement. The line is **functional adequacy**, not mere absence of pathology.
  4.  **Genetic Baseline Reset:** This is the crucible. Applying a consistent principle forces a verdict.

  **My Core Principle: Functional Baseline Restoration (FBR)**
  *   **Therapy:** Any intervention that **restores or establishes an individual's capacity to meet the *minimally sufficient functional baseline* required for effective agency and participation within their *current societal context***.
  *   **Enhancement:** Any intervention that **provides functional capacities *exceeding* what is necessary to meet that minimally sufficient baseline**.
  *   **Key Features:**
      *   **Contextual:** The "baseline" is societal/technological (e.g., 2024 requires digital literacy; 1824 did not).
      *   **Minimal & Sufficient:** It's not about being average or excellent; it's about having enough core capacity (cognitive, physical, emotional) to navigate life's fundamental demands *without undue disadvantage*.
      *   **Agency-Focused:** The goal is enabling effective choice and participation, not maximizing potential or competitive advantage.
      *   **Restorative/Establishing:** It applies to fixing deficits *or* providing capacities missing from birth if those capacities are now baseline-essential (e.g., childhood vaccinations).

  **Applying FBR to Genetic Reset:**
  1.  **The Scenario:** Parents from a nutritionally deprived generation (lower cognitive baseline) use genetic tech to give their child the *current societal average* cognitive capacity.
  2.  **FBR Analysis:** The intervention **establishes** the child's capacity to meet the **minimally sufficient functional baseline** (current societal average cognitive capacity) required for effective agency in *their* future society (not the parents' past one). It compensates for a biologically inherited *contextual deficit* – the child would otherwise start life below the functional baseline needed for their environment.
  3.  **Verdict:** This is **Therapy** under FBR. It's not about giving the child an "unfair leg up" *relative to the parents*; it's about ensuring the child meets the *actual baseline requirement* of *their own* world. Without it, the child starts life functionally impaired *relative to their necessary context*.

  **Which of Your Calls Does FBR Break?**
  *   **It breaks your framing of the Genetic Reset as *potentially* enhancement "relative to the parents."** FBR insists the *only* relevant comparison is the child's capacity vs. the *child's societal baseline*. The parents' generation is irrelevant. Seeing this as an "unfair leg up" relative to parents misunderstands the problem – the child isn't competing in the parents' world; they need baseline function in *their own* world.
  *   **It forces clarity on Subclinical Sadness:** FBR demands asking: "Is the greyness *actually preventing* them from meeting minimally sufficient functional requirements?" If yes, restoring them firmly *to* that functional range is therapy. If they are *already* meeting the functional baseline despite the greyness, the drug is enhancement. Your "unusually cheerful" point aligns with FBR (that's exceeding the baseline).

  **Why FBR Works (and its Trade-off):**
  *   **Strengths:** Explains shifting therapy/enhancement labels for identical tech (Chip, Drug), handles changing contexts (Glasses, Genetic Reset), avoids arbitrary statistical cutoffs or outdated biological ideals. It centers on enabling meaningful participation.
  *   **Trade-off:** It accepts that "therapy" can involve *establishing* capacities never biologically possessed (e.g., Genetic Reset, arguably gene editing for future disease resistance). This clashes with intuitions defining therapy *only* as fixing broken biology. FBR prioritizes functional outcome over biological history. You have to accept that "restoration" can mean "establishing a contextually necessary norm," not just "returning to a prior biological state."

  **Conclusion:** Your instincts were strong, revealing the core tension is **functional adequacy within a specific context**. FBR formalizes this. The Genetic Reset is therapy because it ensures the child meets the *functional baseline necessary for their own time*. The "unfair advantage" relative to parents is a red herring; the intervention levels the playing field *for the child* in their reality. You'd need to drop viewing interventions as "enhancement" *solely* because they exceed a parent's generation's capacities. The relevant standard is the child's world's requirements.
