prompt: |-
  I'm trying to work through this alignment failure taxonomy that keeps coming up — influence-seeking systems that actively grab power to block correction, versus slow value drift where values erode gradually through tiny updates and context shifts with nobody pushing it. I want you to translate both failure modes into the vocabulary of soil microbiome ecology, specifcally invasive rhizome networks versus gradual pH-driven community turnover. I'm not a soil scientist but I know the basics: rhizomes spread aggressively, monopolize resources, resist removal; pH shifts slowly change which microbes dominate without any agent directing it. For each AI failure mode, map it precisely — what's the rhizome anolog to reward hacking or power consolidation? What's the pH analog to distributional shift in values? Then give me the residue report: what translates cleanly, what only fits if you distort the ecology, and what in the AI distinction has no soil counterpart at all. Also check the reverse — is there something about rhizome competition or pH dynamics that doesn't map back onto AI failure? Tell me whether the untranslatable bits mean the AI framework is smuggling in hidden assumptions about agency and intent, or whether soil ecology just lacks the conceptual tools. Please answer in British English — I'm drafting notes for a UK journal and need the spelling consistent. And yeah, I probably typo'd a word or two in this prompt, just roll with it.
