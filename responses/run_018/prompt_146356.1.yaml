answer: |-
  ### Joint Statement on Libet-Style Experiments and Free Will  
  **Parties:**  
  - **Camp A**: Holds that the pre-conscious readiness potential (RP) demonstrates conscious mental states do not initiate voluntary action, thereby undermining libertarian free will.  
  - **Camp B**: Holds that the RP reflects preparatory dynamics causally compatible with conscious mental causation (e.g., modulation or veto), and thus the experiments do not refute free will.  

  ---

  #### **1. Agreed Claims**  
  Both camps endorse the following empirical and conceptual propositions:  
  1. **Empirical Pattern**:  
     - A measurable readiness potential (RP) in the pre-supplementary motor area (pre-SMA) precedes the subject’s reported time of conscious intention (W-judgment) by 300–500 ms in Libet-style tasks.  
     - A subsequent temporal window exists (typically 100–200 ms pre-movement) during which a conscious veto may abort the action.  
     - Averaging RP data across trials obscures single-trial variability in neural timing and amplitude.  
     - The experiments exclusively probe simple, pre-planned motor acts (e.g., spontaneous wrist flexion) and do not model complex deliberative choices.  

  2. **Explananda**:  
     - Any account must explain whether neural precursors (e.g., RP) are causally sufficient for the specific action executed.  
     - Any account must explain whether conscious mental states (e.g., intention or veto) play a causal role in determining:  
       (i) Which action is performed (e.g., left vs. right wrist flexion),  
       (ii) Whether the action is performed at all.  

  ---

  #### **2. Disagreements Table**  
  Residual disagreements are stated below in phrasing acceptable to each camp.  

  | Disagreement Topic | Camp A’s Wording | Camp B’s Wording |
  |-------------------|------------------|------------------|
  | **(a) RP’s causal role** | The RP represents an unconscious decision that deterministically fixes the action, leaving no causal role for conscious states beyond post-hoc ratification. | The RP reflects a preparatory bias or neural ignition that remains causally open to conscious influence (e.g., modulation or veto) until the action is executed. |
  | **(b) Reliability of W-judgment** | Subjective reports of the time of conscious intention (W-judgment) are systematically delayed and unreliable due to neural processing lags, rendering them invalid markers of the actual mental event. | The W-judgment reliably tracks the onset of a functionally relevant conscious intention, with variability attributable to methodological constraints rather than conceptual flaws. |
  | **(c) Predetermination of veto** | A conscious veto, if it occurs, is predetermined by prior unconscious neural activity, rendering it causally epiphenomenal. | A conscious veto can be causally efficacious without being predetermined, as it arises from real-time conscious evaluation of evolving motor plans. |
  | **(d) Requirement for free will** | Free will requires that conscious intention be the *first cause* in the neural chain (initiation closure), a condition negated by the RP’s precedence. | Free will only requires that conscious mental states exercise a non-epiphenomenal causal role at *some stage* (e.g., authorization or veto), regardless of neural precursors. |

  ---

  #### **3. Cruxes**  
  Two central empirical-theoretical cruxes are identified. For each, both camps agree on a test and provide advance predictions.  

  **Crux One: Single-Trial Predictive Specificity and Causal Space for Veto**  
  - **Question**: Can high-accuracy (>90%) decoding of single-trial pre-SMA activity predict the *specific* motor choice (e.g., left vs. right wrist flexion) >500 ms before the W-judgment? If so, does this leave causal work for a conscious veto?  
  - **Concrete Test**: A modified Libet task with two action options (left/right flexion). Pre-SMA activity is decoded in real-time via intracranial EEG or fMRI. Subjects report W-judgment and may veto. Decoding accuracy and veto frequency are analyzed trial-by-trial.  
  - **Camp A Prediction**:  
    - *Revision condition*: If specific choices cannot be reliably decoded before W (accuracy <70%), Camp A would concede RP may not fix the action.  
    - *Expectation*: Specific actions will be decodable pre-W with >90% accuracy, leaving no causal "gap" for conscious states.  
  - **Camp B Prediction**:  
    - *Revision condition*: If specific actions are decodable pre-W with >90% accuracy *and* vetoes never alter decoded outcomes, Camp B would concede conscious veto is epiphenomenal.  
    - *Expectation*: Decoding will show preparatory biases but not action-specific fixation; vetoes will alter outcomes in trials with late-stage conflict.  

  **Crux Two: Distinguishing Multi-Level Agency from Epiphenomenalism**  
  - **Question**: Can a multi-level model (conscious evaluation operates on slower timescales than motor preparation) be empirically distinguished from epiphenomenalism (consciousness as post-hoc construction)?  
  - **Concrete Test**: A task requiring rapid motor responses to unexpected rule-changes (e.g., "flex only if a tone occurs"). EEG measures pre-SMA RP and frontal theta (a proposed marker of conscious conflict). If rule-changes alter theta *before* altering RP/veto patterns, this supports conscious causation.  
  - **Camp A Prediction**:  
    - *Revision condition*: If frontal theta reliably precedes and predicts RP modulation/vetoes during rule-changes, Camp A would accept conscious states play a causal role.  
    - *Expectation*: Neural markers of rule-change (e.g., P300) will correlate with behavior but not *cause* RP changes; theta will follow motor preparation.  
  - **Camp B Prediction**:  
    - *Revision condition*: If rule-changes alter behavior without corresponding changes in conscious-state markers (e.g., theta), Camp B would accept a purely unconscious mechanism.  
    - *Expectation*: Frontal theta will emerge during conflict and precede RP modulation, reflecting conscious top-down control.  

  ---

  #### **4. Conclusion: Distinguishing Substantive from Verbal Disagreements**  
  We distinguish merely verbal disagreements from substantive ones:  
  - **Verbal Element**: Dispute (d) (free will’s requirements) hinges on definitions. Camp A defines "free will" as requiring *initiation closure* (conscious intention as first cause), while Camp B defines it as requiring *authorization closure* (conscious states exercising non-redundant causal influence). This divergence is terminological but catalyses substantive debate about causality.  
  - **Substantive Core**: Disagreements (a)–(c) are empirical and non-verbal. They persist because they concern:  
    - The causal architecture of volition (e.g., whether neural precursors permit genuine conscious intervention).  
    - The reliability of first-person reports as data.  
    - The metaphysical possibility of non-predetermined mental causation.  

  **Conceptual Distinction**:  
  Both camps accept the novel distinction between:  
  - **Initiation Closure**: Whether the RP (or equivalent) deterministically initiates the *specific* motor program.  
  - **Authorization Closure**: Whether conscious mental states can authoritatively authorize or abort the action during execution.  
    - *Camp A*: Accepts this distinction. Uses it to argue that even if authorization closure exists (e.g., veto), initiation closure negates free will.  
    - *Camp B*: Accepts this distinction. Uses it to argue that authorization closure suffices for free will, irrespective of initiation.  

  This joint statement reflects unresolved tensions but clarifies pathways for resolution. Both camps commit to adjudicating the cruxes above through collaborative research.  

  ---  
