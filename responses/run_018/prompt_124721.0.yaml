  #### Crux 2: Can social contracts generate obligations to sustain biological potential in the absence of narrative potential?

  **Concrete Case: The Synthetic Continuity Scenario**
  - *Description*: A being (e.g., an embryo or a specially designed entity) has no present consciousness but has an implanted neural architecture that will, in ten years, generate a continuous first-person narrative. During the ten-year interim, it requires only minimal biological support (e.g., nutrients) that can be provided by anyone without significant burden. There is a pre-existing social contract (e.g., a legal obligation or a promise) that obligates a specific person to provide this support.

