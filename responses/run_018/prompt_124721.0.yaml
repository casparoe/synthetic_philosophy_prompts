  3. **On Biological Dependency**: Both camps agree that biological dependency is a state in which an entity requires external biological support (e.g., nutrients, oxygen, or in the violinist case, blood circulation) to maintain its current biological functions and avoid death.

  4. **On Narrative Dependency**: Both camps agree that narrative dependency is a state in which an entity requires another's sustained cooperative engagement (not merely biological support) to maintain a life-plan or first-person narrative that is already structurally present. This implies that the entity has a current capacity for (or actual) self-narrative that would be disrupted or destroyed by withdrawal of cooperation.

  5. **Conceptual Distinction**: Both camps agree that biological dependency and narrative dependency are conceptually distinct. An entity can be biologically dependent without being narratively dependent (e.g., a comatose patient with no higher brain function), and an entity can be narratively dependent without being biologically dependent (e.g., a person with a disability who uses assistive technology for communication and relies on others to continue their life narrative, but is not in immediate danger of death without that support).

  6. **Scope of the Disagreement**: Both camps agree that the central dispute between them concerns the conditions under which it is permissible to withdraw life-sustaining support, and whether the permissibility depends solely on the rights of the supporting person (Autonomy-First) or also on the nature of the dependency (narrative vs. biological) and the entity's capacity to have a future it can anticipate (Narrative-Potential).

