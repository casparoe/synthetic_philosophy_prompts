prompt: |-
  I work as a senior mediator at a community justice center that has adopted an Ubuntu-informed framework for resolving interpersonal and collective disputes, but we operate under a statutory charter that also protects individual rights to autonomy, privacy, and non-participation. Our caseworkers need a reusable decision procedure—not a philosophical essay—to determine, for any given dispute, whether the harm should be addressed primarily through relational restoration (repairing the interdependent fabric that constitutes the parties’ personhood) or through individual rights-based redress (compensation, exclusion, or legal adjudication). The principle to operationalize is that personhood is relationally constituted: an injury is not merely a private loss but a rupture in the web of recognition and obligation that makes each party who they are. Yet the procedure must preserve the distinction between harm done to a relation and harm done through a relation, must recognize when an offender denies the relational frame entirely, and must never override a party’s non-derogable boundary merely to restore communal harmony.

  Please translate this into a step-by-step procedure that a caseworker with no philosophical training can run in about forty-five minutes, including: the ordered questions to ask; what counts as a sufficient answer to each; the explicit points where judgment is unavoidable and must be signed off by a senior mediator rather than automated; and the conditions under which the procedure stops with a definitive recommendation, stops with a referral to legal arbitration, or stops with a value judgment that requires human sign-off. The procedure should handle cases where the victim demands exclusion despite viable repair, where the offender refuses to acknowledge relational obligation, and where the relational harm extends to third-party community members who are not direct parties. Apply it to three worked cases: (1) a workplace racial-slur incident in which the offender accepts relational responsibility and seeks to repair, but the victim demands termination and refuses any mediated encounter; (2) a communal water-access dispute in which one party treats the conflict as purely transactional and denies that relationships are relevant; and (3) a family inheritance conflict involving concealed assets, where relational repair requires disclosure that one party considers a protected privacy boundary. In at least one of these, the procedure should yield a recommendation that runs counter to the center’s relational ethos—please flag exactly where and why. Finally, state clearly what this procedure cannot do: which categories of dispute lie outside its scope, which moral disagreements it cannot resolve, and where it is likely to misfire if applied mechanically.
reasoning: |-
  We are creating a step-by-step procedure for caseworkers to determine whether a dispute should be addressed through relational restoration or individual rights-based redress. The procedure must be practical and executable in about 45 minutes. The core principle is that personhood is relationally constituted, so harm is not just private but a rupture in the web of recognition and obligation. However, we must respect non-derogable boundaries and recognize when the relational frame is denied.

  Key considerations:
  - Distinguish between harm done to a relation (which might be repairable) and harm done through a relation (which might require individual redress).
  - Recognize when an offender denies the relational frame entirely (suggesting rights-based approach may be necessary).
  - Never override a party's non-derogable boundary (e.g., privacy, autonomy) for the sake of communal harmony.

  The procedure will have:
  - Ordered questions with criteria for sufficient answers.
  - Points where judgment is required and must be signed off by a senior mediator.
  - Conditions for stopping with a recommendation, referral to legal arbitration, or requiring human sign-off.

  Stopping conditions:
  1. Definitive recommendation: when the procedure leads clearly to either relational restoration or rights-based redress.
  2. Referral to legal arbitration: when the dispute involves legal issues beyond the center's scope (e.g., criminal acts, complex legal rights) or when a party's non-derogable rights are violated and require legal protection.
  3. Value judgment requiring human sign-off: when there is an unavoidable conflict between relational restoration and individual rights that cannot be resolved by the procedure.

  Procedure Steps:

  Step 1: Identify the Harm and Parties
     - Ask: "Describe the harm that occurred. Who was directly harmed? Are there indirect harms to the community or third parties?"
     - Sufficient answer: Clear identification of the act, the direct victim(s), and any community impact. If third-party community members are affected, note them.
     - Judgment: If the harm involves criminal activity (e.g., assault, theft) or legal issues that require mandatory reporting, stop and refer to legal arbitration. (This is a judgment call by the caseworker, but if in doubt, consult senior mediator.)

  Step 2: Assess Relational Context
     - Ask: "What is the nature of the relationship between the parties prior to the harm? (e.g., colleagues, neighbors, family, strangers) How interdependent are they? Does the harm rupture a shared identity or communal bond?"
     - Sufficient answer: Description of the relationship (close/distant, ongoing/one-off) and how the harm affects the relational fabric. If the parties are strangers or in a purely transactional relationship, note that.
     - Judgment: If the relationship is purely transactional and the harm is only to an individual (not to a shared community fabric), then it may lean toward rights-based redress. However, if the harm affects a community (e.g., workplace, neighborhood), then relational context is still relevant.

  Step 3: Determine Harm Type
     - Ask: "Is the harm primarily to an individual (e.g., physical injury, financial loss) or to the relational fabric (e.g., betrayal, loss of trust, community division)? Or both?"
     - Sufficient answer: Clear distinction between individual harm (private loss) and relational harm (rupture in recognition and obligation). If both, note the interplay.
     - Judgment: If the harm is done through a relation (e.g., abuse of trust, exploitation of a relationship) then it may require individual redress to protect the victim. If the harm is done to the relation (e.g., a conflict that damages trust but without exploitation) then restoration may be viable.

  Step 4: Check for Non-Derogable Boundaries
     - Ask: "Are any parties asserting a non-derogable boundary (e.g., privacy, bodily autonomy, right not to participate)? Specifically, does any party refuse to engage in restoration because it would violate such a boundary?"
     - Sufficient answer: Identify any boundaries claimed and the reason (e.g., "victim refuses mediation due to fear of re-traumatization" or "party considers financial information private").
     - Judgment: If a non-derogable boundary is asserted and the restoration process would require violating it, then stop and recommend rights-based redress. Do not override. (However, ensure the boundary is non-derogable and not merely a preference. If unclear, consult senior mediator.)

  Step 5: Assess Offender's Stance on Relational Obligation
     - Ask: "Does the offender acknowledge the harm as a rupture in the relational fabric? Or do they deny any relational obligation?"
     - Sufficient answer: Offender's position on relational responsibility (e.g., "I see I broke trust" vs. "This is just a business matter").
     - Judgment: If the offender denies the relational frame entirely, then relational restoration is unlikely to succeed. Proceed to consider rights-based redress.

  Step 6: Evaluate Victim's Stance on Restoration
     - Ask: "What remedy does the victim seek? Are they open to relational restoration, or do they demand exclusion/compensation without restoration?"
     - Sufficient answer: Victim's desired outcome and whether they are open to any form of relational repair.
     - Judgment: If the victim demands exclusion or legal adjudication and refuses any mediated encounter, then respect that choice and lean toward rights-based redress. (But note: if the victim's refusal is based on fear or trauma, that is a non-derogable boundary; if it is punitive without a boundary violation, then it's a preference that might be weighed against the broader relational harm.)

  Step 7: Consider Community Impact
     - Ask: "How does this harm affect the broader community? Is there a community interest in restoration that outweighs individual preferences? Or does the community require protection via exclusion/legal action?"
     - Sufficient answer: Description of community impact (e.g., division, fear, precedent) and whether community members are pushing for a particular resolution.
     - Judgment: If the relational harm extends to the community and the community's well-being requires restoration, but individual parties refuse, then we face a conflict. Here, we must not override non-derogable boundaries. If the community impact is severe and restoration is viable without boundary violation, then restoration may be recommended. Otherwise, rights-based redress may be necessary. This is a point requiring senior mediator sign-off.

  Step 8: Make a Preliminary Decision
     - Based on steps 1-7, choose between:
          A. Relational restoration: if the harm is to the relational fabric, the parties are interdependent, the offender acknowledges relational responsibility, and the victim is open to restoration, and no non-derogable boundaries are violated.
          B. Individual rights-based redress: if any of the following: 
              - the harm is primarily individual and not relational,
              - the offender denies relational obligation,
              - the victim demands exclusion/legal action and refuses restoration (especially if based on a non-derogable boundary),
              - restoration would violate a non-derogable boundary,
              - the relationship is purely transactional with no community impact.
     - If there is a conflict (e.g., community pushes for restoration but victim refuses) then proceed to Step 9.

  Step 9: Conflict Resolution and Senior Mediator Sign-off
     - When the criteria point in conflicting directions (e.g., victim refuses restoration but community impact is high and restoration is viable) then the caseworker must not decide alone.
     - Prepare a summary of the conflict and the competing values (individual autonomy vs. community well-being).
     - Senior mediator must decide whether to:
          a) Override the victim's preference for the sake of the community? NO, because non-derogable boundaries cannot be overridden. But note: if the victim's refusal is not based on a non-derogable boundary (e.g., it's punitive without a boundary claim), then the senior mediator might still recommend restoration if the community impact is severe and the offender is willing. However, if the victim's refusal is based on a non-derogable boundary (like fear of trauma), then we must respect that and choose rights-based redress.
          b) In cases without a non-derogable boundary, the senior mediator may decide that the community interest outweighs the victim's preference. This is a value judgment and must be signed off.

  Step 10: Final Recommendation
     - If the decision is clear from Step 8, then recommend either A or B.
     - If Step 9 is triggered, then after senior mediator sign-off, recommend accordingly.
     - If the harm involves complex legal issues (e.g., concealed assets in an inheritance dispute may require legal discovery) or criminal elements, then refer to legal arbitration.

  Now, apply to three worked cases:

  Case 1: Workplace racial-slur incident
  - Offender accepts responsibility and seeks repair.
  - Victim demands termination and refuses any mediated encounter.

  Step 1: Harm is racial slur, direct harm to victim, but also harms workplace community (creates hostile environment).
  Step 2: Relationship is colleagues (interdependent in workplace). Harm ruptures shared identity as a respectful workplace.
  Step 3: Harm is both individual (dignity harm) and relational (rupture in workplace trust and safety).
  Step 4: Victim refuses any mediated encounter. This refusal may be based on a non-derogable boundary (trauma, psychological safety). We must respect.
  Step 5: Offender acknowledges relational responsibility (good for restoration).
  Step 6: Victim demands exclusion (termination) and refuses restoration.
  Step 7: Community (workplace) has an interest in restoring a safe environment. However, restoration without the victim's participation is impossible? And the victim's boundary must be respected.
  Step 8: Because of Step 4 (non-derogable boundary) and Step 6, we must choose rights-based redress. The victim's demand for termination is a form of exclusion. The center might recommend termination or other sanctions through workplace procedures, but not relational restoration with the victim.
  Step 9: Not triggered because victim's boundary is non-derogable.
  Step 10: Recommend rights-based redress (exclusion/termination). This runs counter to the center's relational ethos because the offender was willing to repair, but the victim's boundary must be respected.

  Case 2: Communal water-access dispute
  - One party (Party A) treats the conflict as purely transactional and denies relationships are relevant.

  Step 1: Harm is unequal access to water, affecting Party B and possibly the community if water is shared.
  Step 2: Relationship is neighbors or community members sharing a resource, so interdependent. But Party A denies this.
  Step 3: Harm is both individual (water access) and relational (rupture in shared resource management and neighborly trust).
  Step 4: No non-derogable boundaries asserted yet.
  Step 5: Offender (Party A) denies relational obligation: "This is purely transactional." So relational restoration is unlikely.
  Step 6: Victim (Party B) might be open to restoration, but Party A is not.
  Step 7: Community impact: other neighbors are affected by the water access and the conflict. Community might want a relational solution (e.g., shared agreement) but Party A refuses.
  Step 8: Because Party A denies the relational frame, we lean toward rights-based redress. The harm is also individual (water access) and may be resolved by defining property rights or access rights.
  Step 9: Not triggered.
  Step 10: Recommend rights-based redress (e.g., compensation, legal adjudication of water rights). Refer to legal arbitration if water rights are legally complex.

  Case 3: Family inheritance conflict with concealed assets
  - Relational repair requires disclosure, but one party considers it a protected privacy boundary.

  Step 1: Harm is unfair distribution due to concealed assets. Direct harm to other heirs, relational harm to family trust.
  Step 2: Relationship is family (highly interdependent). Harm ruptures family bonds.
  Step 3: Harm is both individual (financial loss) and relational (betrayal, loss of trust).
  Step 4: The party concealing assets (Party X) asserts a privacy boundary. Is financial privacy non-derogable? In inheritance, there is a legal and moral duty to disclose. However, the procedure must respect non-derogable boundaries. But note: the center's charter protects individual rights, including privacy. However, in this context, disclosure might be required by law. So we must check: is this a non-derogable boundary? The caseworker should note that inheritance often involves legal obligations. If Party X's privacy claim is against the law, then we might have to override? But the center's procedure cannot override law. So if there is a legal requirement to disclose, then we must refer to legal arbitration. If not, then we proceed.
     - Judgment: If Party X's privacy claim is legally protected (e.g., the assets are in a private trust not subject to disclosure) then it might be a boundary. But in most inheritance disputes, assets must be disclosed. So this step might lead to referral.
  Step 5: Party X (the concealer) might or might not acknowledge relational harm. But they are asserting privacy.
  Step 6: The victim (other heirs) demand disclosure and restoration of fair shares.
  Step 7: Family is a community, and the harm affects the entire family. Restoration requires disclosure.
  Step 8: Because Party X asserts a privacy boundary and restoration requires disclosure, we must respect the boundary? But if disclosure is legally required, then we should refer to legal arbitration. Otherwise, if we are only in the relational realm, then we cannot force disclosure if it violates a non-derogable boundary. Then we might have to choose rights-based redress without restoration? But without disclosure, restoration is impossible.
     - So: if Party X maintains the privacy boundary and it is non-derogable (and legally protected), then we cannot force disclosure. Then we might have to recommend rights-based redress (e.g., compensation based on known assets) without restoration of the relationship because the trust is broken. But this is not satisfying. Alternatively, we might refer to legal arbitration to compel disclosure if the law allows.
     - Step 10: Refer to legal arbitration because the issue of concealed assets likely requires legal intervention.

  What the procedure cannot do:
  - Handle criminal acts that require mandatory reporting (e.g., assault, fraud). These must be referred to legal authorities.
  - Resolve disputes where the law clearly mandates a specific remedy (e.g., statutory rights that cannot be mediated).
  - Address deeply rooted structural inequalities (e.g., systemic discrimination) that cannot be resolved by individual dispute resolution.
  - Resolve moral disagreements about the nature of personhood or the value of Ubuntu versus individualism (the procedure assumes the Ubuntu framework but respects individual rights).
  - Work when parties are not willing to engage at all (the procedure requires at least initial input from parties, though they can refuse participation which then triggers rights-based redress).
  - Misfire if applied mechanically in cases where harm is ambiguous, or when non-derogable boundaries are misidentified (e.g., mistaking a preference for a boundary). This is why senior mediator judgment is required at key points.
answer: |-
  Below is a step-by-step decision procedure for caseworkers, designed to be completed in approximately 45 minutes. It operationalizes the Ubuntu principle that "personhood is relationally constituted" while respecting statutory protections for autonomy, privacy, and non-participation. The procedure includes:  
  - **10 ordered questions** with clear criteria for sufficient answers.  
  - **Judgment points** (marked with ⚠️) requiring senior mediator sign-off.  
  - **Stopping conditions** for definitive recommendations, legal arbitration referrals, or unresolved value judgments.  
  - **Key definitions** embedded in the steps for clarity.  

  ---

  ### **Core Definitions for Caseworkers**  
  - **Relational restoration**: Repairing the interdependent "web" between parties (e.g., dialogue, acknowledgment, community healing).  
  - **Rights-based redress**: Individual remedies like compensation, exclusion, or legal action.  
  - **Harm to a relation**: Damage to the shared bond (e.g., broken trust).  
  - **Harm through a relation**: Exploiting the relationship to cause harm (e.g., using intimacy to manipulate).  
  - **Non-derogable boundary**: Inviolable rights (autonomy, privacy, non-participation) that cannot be overridden.  
  - **Relational denial**: Offender rejects the existence of mutual obligation.  

  ---

  ### **Step-by-Step Procedure**  
  **Time allocation**: 5 minutes per step (45 minutes total). Document answers in the case file.  

  #### **Step 1: Identify Harm Type**  
  - **Question**: "Describe the harm. Did it occur *to* a relationship (damaging trust/bonds) or *through* a relationship (exploiting closeness)?"  
  - **Sufficient answer**:  
    - "To" = Harm affecting shared bonds (e.g., "They lied, breaking our trust").  
    - "Through" = Harm leveraging the relationship (e.g., "They used our friendship to steal").  
    - If unclear, note both.  
  - **Stopping condition**:  
    - If harm is **primarily physical violence, criminal, or legally complex** (e.g., assault, theft), **STOP and refer to legal arbitration**.  
    - Else, proceed.  

  #### **Step 2: Map Relational Context**  
  - **Question**: "What is the relationship between parties? Is there ongoing interdependence (e.g., family, coworkers, neighbors) or is it transactional (e.g., one-time sale)?"  
  - **Sufficient answer**:  
    - Describe shared bonds (e.g., "We work together daily"), community impact (e.g., "The whole team is divided"), or transactional nature (e.g., "We only interact about bills").  
  - **Proceed** always.  

  #### **Step 3: Assess Offender’s Stance**  
  - **Question**: "Does the offender acknowledge this harm as damaging a shared relationship/community? Or do they deny relational obligations entirely?"  
  - **Sufficient answer**:  
    - "Acknowledges" = Accepts impact beyond individual (e.g., "I hurt our team").  
    - "Denies" = Rejects relational frame (e.g., "This is just about money").  
  - **Stopping condition**:  
    - If offender **denies relational obligation**, **STOP and recommend rights-based redress**. Relational repair is impossible.  
    - Else, proceed.  

  #### **Step 4: Evaluate Victim’s Boundary**  
  - **Question**: "Does the victim assert a non-derogable boundary (e.g., refusal to engage, privacy, safety) that prevents relational repair?"  
  - **Sufficient answer**:  
    - "Yes" = Clear invocation of autonomy/privacy (e.g., "I will not meet them; it retraumatizes me").  
    - "No" = Willing to explore restoration (e.g., "I’m open to talking if they apologize").  
  - **Stopping condition**:  
    - If victim **demands exclusion or non-participation without flexibility**, **STOP and recommend rights-based redress**. Boundaries cannot be overridden.  
    - Else, proceed.  

  #### **Step 5: Third-Party Community Harm**  
  - **Question**: "Does the harm extend to uninvolved community members (e.g., disrupted workplace, divided neighborhood)?"  
  - **Sufficient answer**:  
    - "Yes" = Specific community impact (e.g., "Our shared water source is now contentious").  
    - "No" = Harm confined to direct parties.  
  - **Proceed** always.  

  #### **Step 6: Weigh Restoration Viability**  
  - **Question**: "Can relational restoration occur without violating boundaries? Consider: (a) Offender’s willingness (Step 3), (b) Victim’s boundaries (Step 4), (c) Community needs (Step 5)."  
  - **Sufficient answer**:  
    - "Viable" = All parties consent, no boundaries breached.  
    - "Not viable" = Boundary violation or unwilling party.  
  - **Judgment point**: ⚠️ If community harm (Step 5) is severe but victim/offender blocks restoration, **PAUSE for senior mediator sign-off**. Do not override boundaries.  

  #### **Step 7: Make Preliminary Recommendation**  
  - **Rules**:  
    - Recommend **relational restoration** ONLY if:  
      - Harm is *to* (not *through*) the relation (Step 1),  
      - Offender acknowledges responsibility (Step 3),  
      - No non-derogable boundaries are breached (Step 4),  
      - Community impact exists (Step 5),  
      - Restoration is viable (Step 6).  
    - Else, recommend **rights-based redress**.  
  - **Document recommendation**.  

  #### **Step 8: Conflict Check**  
  - **Question**: "Does the preliminary recommendation conflict with statutory rights (autonomy/privacy) or the center’s Ubuntu ethos?"  
  - **Examples**:  
    - Ubuntu prioritizes restoration, but victim’s boundary forces rights-based redress.  
    - Community demands restoration, but offender denies relational frame.  
  - **Stopping conditions**:  
    - ⚠️ If **irresolvable conflict** (e.g., community restoration vs. individual boundary), **STOP and escalate to senior mediator**.  
    - Else, proceed to final step.  

  #### **Step 9: Final Recommendation/Sign-off**  
  - **If no conflict**: Affirm Step 7 recommendation.  
  - **If conflict escalated**: Senior mediator chooses:  
    - Rights-based redress (if boundaries are breached).  
    - Relational restoration (if boundaries are respected and community harm outweighs individual preferences).  
    - Legal arbitration (if statutory rights are ambiguous).  
  - **Document rationale**.  

  #### **Step 10: Output**  
  - **Definitive recommendation**: Relational restoration OR rights-based redress.  
  - **Referral to legal arbitration**: For criminal/complex legal issues (Step 1) or statutory ambiguity (Step 9).  
  - **Value judgment for sign-off**: Only at ⚠️ points.  

  ---

  ### **Worked Examples**  
  #### **Case 1: Workplace Racial Slur**  
  - *Facts*: Offender accepts responsibility, seeks repair. Victim demands termination, refuses mediation.  
  - **Step 1**: Harm *through* relation (slur exploits workplace trust).  
  - **Step 2**: Interdependent (coworkers).  
  - **Step 3**: Offender acknowledges relational harm → Proceed.  
  - **Step 4**: Victim asserts non-derogable boundary (refuses participation) → **STOP: Recommend rights-based redress (exclusion/termination)**.  
  - **Why counter to ethos?** Offender seeks restoration, but victim’s boundary is inviolable. Ubuntu prioritizes relational repair, but statutory autonomy overrides.  

  #### **Case 2: Communal Water Access**  
  - *Facts*: Party A (offender) denies relational obligation, calls it "transactional." Party B (victim) seeks community repair.  
  - **Step 1**: Harm *to* relation (shared resource trust broken).  
  - **Step 2**: Interdependent (neighbors sharing water).  
  - **Step 3**: Offender (Party A) denies relational obligation → **STOP: Recommend rights-based redress (e.g., compensation)**.  
  - **Note**: Community harm (Step 5) exists but cannot override offender’s denial.  

  #### **Case 3: Family Inheritance with Concealed Assets**  
  - *Facts*: Relational repair requires asset disclosure. Offender views assets as "private."  
  - **Step 1**: Harm *through* relation (exploiting family trust to conceal).  
  - **Step 2**: Interdependent (family).  
  - **Step 3**: Offender may/may not acknowledge; proceed.  
  - **Step 4**: Offender asserts privacy boundary → **STOP: Recommend rights-based redress (e.g., legal adjudication)**.  
  - **Step 10**: Refer to legal arbitration if privacy rights are legally complex (e.g., inheritance laws).  

  ---

  ### **What This Procedure Cannot Do**  
  1. **Out-of-scope disputes**:  
     - Criminal acts (e.g., violence, fraud) requiring mandatory legal reporting.  
     - Systemic issues (e.g., institutional racism) needing structural intervention.  
     - Disputes where parties cannot be identified or refuse all engagement.  

  2. **Unresolvable moral disagreements**:  
     - Conflicts between Ubuntu and absolute individualism (e.g., "Why should I care about community?").  
     - Subjective interpretations of "non-derogable boundaries" (e.g., is privacy absolute in inheritance?).  

  3. **Risks of mechanical application**:  
     - **Misfires if**:  
       - Harm is misclassified (e.g., "harm through" vs. "harm to").  
       - Boundaries are misidentified as preferences (e.g., "I don’t want to" vs. "I cannot due to trauma").  
       - Community harm is overstated to pressure victims.  
     - **Mitigation**: Senior mediator sign-off at ⚠️ judgment points.  

  **Final note**: This procedure prioritizes boundaries over relational harmony and legal complexity over mediation. It ensures Ubuntu is applied only when consensual and legally compliant.
