prompt: |-
  hey, im drafting a novel and keep bumping into supererogation—the philosophical idea where someone goes way past what duty demands, like throwing yourself on a grenade for strangers. but i also invented this thing for the book im calling 'moral overhang': its when a characters excessive sacrifice doesnt just earn them moral credit, it actually shifts a kind of debt onto everyone else in the story—readers included—so the excess doesnt stay with the hero but leaks into the system. can you compare standard supererogation (the urmson-style framework?) with this 'moral overhang' idea? specifically, which model better explains who 'owns' the surplus good or bad? and does one of them do a better job of explaining why an audience feels guilty or burdened after witnessing a heros unnecessary death? write in american english please, and keep it loose—no footnotes or bibliographies, just work it out.
reasoning: |-
  Okay, the user is writing a novel and grappling with philosophical concepts. They're comparing supererogation (specifically Urmson's framework) with their invented concept "moral overhang." Supererogation is about actions beyond duty, like heroic sacrifices. Moral overhang is when that sacrifice creates a kind of debt others feel. 

  Hmm, the user wants to know which model explains ownership of the "surplus good" and why audiences feel burdened after a hero's unnecessary death. They're clearly deep in developing their story's moral dynamics. 

  First, let's break down supererogation: In Urmson's view, the hero owns the moral credit. Their sacrifice is admirable but doesn't obligate others. The surplus stays with the actor. Audience feels admiration, maybe survivor guilt, but not responsibility. 

  Now moral overhang flips this: The hero's extreme sacrifice doesn't just earn credit—it transfers a debt. The "surplus good" spills over, making others feel indebted. This explains why audiences feel guilty or burdened. The ownership isn't individual; it's systemic. 

  The user's onto something psychologically potent here. Supererogation handles the act itself well, but moral overhang better explains the lingering communal impact. That guilt readers feel? That's the overhang—the sense that they now owe something. 

  For their novel, this concept could create delicious tension: Characters avoiding the hero's memory because it's a living debt, societal pressure to "earn" the sacrifice, or resentment toward the dead hero for burdening them. 

  Key differences: Supererogation = closed system (credit stays). Moral overhang = open system (debt leaks). The latter definitely captures that oppressive aftertaste better. Should emphasize how this shifts narrative weight from individual heroism to collective consequence. 

  User's framing suggests they want visceral, not academic, answers—so keeping it loose while nailing the philosophical distinction. Their "leaks into the system" metaphor is perfect; should mirror that energy in explaining it.
answer: |-
  Got it. Let's break this down in novel-writing terms, no academic jargon bombs. Think of it like two different ways a moral explosion radiates through your story world:

  **Supererogation (The Urmson Standard): The Hero's Trophy Case**

  1.  **The Deal:** Hero does something insanely good, way beyond the call. Throws themselves on the grenade. Saves the orphanage *and* finds homes for all the kittens inside during the fire.
  2.  **Ownership:** The **hero owns the surplus good**, full stop. It's *their* moral credit. Think of it like earning an impossible bonus. The hero racks up "awesome points" that belong solely to them. It’s admired, maybe even praised, but it doesn’t *require* anything specific from anyone else.
  3.  **The Audience Feels...:** Awe. Admiration. Maybe survivor's guilt ("Why them, not me?"). Sadness at the loss. But crucially, **not responsible for the debt of the sacrifice itself.** The hero *chose* to go above and beyond. That choice and its cost rests primarily with them. The surplus good is *theirs*, the cost is *theirs*. The audience might feel a vague sense of "I should be better," but it's not a specific debt *to the hero* or the act.
  4.  **System Impact:** Minimal direct moral shift. Society might be inspired or grateful, but it doesn't suddenly *owe* something concrete because of the hero's extra-mile sacrifice. The "surplus good" stays contained as the hero's personal achievement/martyrdom.

  **Moral Overhang: The Debt That Won't Quit**

  1.  **The Deal:** Hero makes that same excessive sacrifice. But instead of the "good" stopping with them, it creates a **negative moral vacuum.** The hero's *over-the-top* goodness doesn't just vanish; it leaves a hole, a burden. Their extreme act becomes a yardstick that makes *everyone else* look inadequate by comparison. Or, the sheer weight of what they gave *demands* something back, creating an unpayable social/moral debt.
  2.  **Ownership:** **The surplus good transforms into a distributed debt.** The hero might get the initial credit, but the *excess* leaks out. **The "ownership" of the *consequence* of the surplus shifts to everyone else.** The community, the other characters, even the reader now *carry* a piece of the burden. The "good" isn't cleanly contained; it creates a lingering, oppressive obligation.
  3.  **The Audience Feels...:** **Burdened. Guilty. Indebted.** Why?
      *   **The Unpayable Debt:** The sacrifice was *so* huge, *so* beyond necessity, that it feels impossible to ever "repay" or justify. How can anyone live up to that? That impossibility creates guilt.
      *   **The New Standard:** The hero's action resets the baseline. Suddenly, merely doing your "duty" feels cheap, cowardly, or insufficient. The audience feels implicated in their own perceived moral mediocrity.
      *   **The Obligation:** The sheer fact of the sacrifice *existing* creates a sense of obligation. "They gave *that* much... shouldn't *we* do more?" It feels like a debt owed, not just admiration earned.
      *   **The Unfairness:** It might feel unfair that the hero placed this burden on everyone else by going *so* far beyond what was needed. Resentment can mix with guilt.
  4.  **System Impact:** Massive. The moral overhang **infects the story's ecosystem.** Characters might become paralyzed by the pressure to live up to the sacrifice, or rebel against it. Society might create rituals or expectations around "honoring" the sacrifice that become oppressive. Resources might be diverted to memorials instead of current needs. The *excess* of the good act poisons the well.

  **Who Explains the Audience's Guilt/Burden? Moral Overhang Wins Hands Down.**

  *   **Supererogation (Urmson):** Explains *why* the act is heroic and admirable, but **doesn't explain the lingering negative weight** (guilt, burden, debt) on bystanders or the audience. It expects admiration, not obligation. The surplus good is the hero's alone.
  *   **Moral Overhang:** **Is built to explain that exact feeling.** It directly addresses how an excessive sacrifice doesn't just create isolated good, but **generates a toxic moral residue** that settles on everyone else. The surplus good morphs into a systemic debt that others, including the audience, feel compelled to carry. The "ownership" of the *problem created by the excess* is collective.

  **Think of it like this:**

  *   **Supererogation:** Hero jumps on grenade. **Hero = Immortalized Hero.** Everyone else = Grateful Survivors. Reader = "Wow, what courage! So sad."
  *   **Moral Overhang:** Hero jumps on grenade (maybe even when there was a slightly less suicidal option). **Hero = Saint/Martyr.** Everyone else = Debtors living in the shadow of an impossible standard. Reader = "That was incredible... but damn, now I feel like I owe something. Why did they *have* to do *that*? How do I live with this?" The grenade blast is over, but the **moral fallout** lingers.

  **For Your Novel:**

  "Moral overhang" is the dark twin of supererogation. It's perfect for exploring the unintended consequences of extreme virtue. Use it to create:
  *   Characters haunted by a martyr's legacy.
  *   Societies warped by the pressure of an impossible ideal.
  *   Readers who feel genuinely implicated and unsettled, not just sad or inspired.
  *   Conflict arising *from* the sacrifice, not resolved by it.

  Urmson tells you *why* the act is special. Your "moral overhang" explains why that specialness can become a crushing weight on everyone else. It’s not about who owns the good deed; it’s about who gets stuck holding the bag for the *overdraft* that deed created. That burden, that debt, that oppressive feeling? That’s the overhang. Own that concept – it’s powerful stuff for fiction.
