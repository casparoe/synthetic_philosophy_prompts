answer: |-
  Here’s a structured 90-minute seminar sequence targeting conceptual understanding of Simpson’s Paradox as a *structural limitation of aggregation* for causal inference, optimized for philosophy-of-science students with basic statistics:

  ---

  ### **Explanatory Sequence (90 mins)**  
  **Core Insight:** Association isn’t invariant; it depends on how we partition data. Aggregation can distort causal signals when a confounder drives group allocation and outcome.

  1.  **Primer: Association ≠ Causation & Partition-Dependence (15 mins)**  
      - *Goal:* Establish that correlation is a description of data *within a specific partition*, not an intrinsic property.  
      - *Activity:* Show two simple, non-paradoxical datasets (e.g., height vs. basketball skill in children/adults). Ask: "Does the correlation change if we split by age? Why?"  
      - *Intercept Misconception 1 (Correlation → Causation):* Explicitly state: "Association in a subgroup doesn’t prove causation. Today, we’ll see something stranger: association can *disappear* when we ignore partitions."

  2.  **Introduce "The Carrying Scenario" (Narrative-Based Example) (15 mins)**  
      - *Scenario:* **Art School Admissions**  
        - *Two groups:* "Portfolio" applicants (Group A) vs. "Standard Exam" applicants (Group B).  
        - *Outcome:* Admission success (Yes/No).  
        - *Confounder:* Applicant "Style" (e.g., "Traditional" vs. "Avant-Garde"). Hidden from the admissions dean.  
        - *Mechanism:*  
          - Group A (Portfolio) attracts 80% Avant-Garde artists; Group B (Exam) attracts 80% Traditional artists.  
          - Avant-Garde artists have higher *inherent* admission chance (e.g., portfolios suit the school’s taste).  
          - The *Exam* is harder than portfolio review → Lower admission rate in Group B *regardless of Style*.  
      - *Present Raw Data:* Show admission rates for Group A (high) and Group B (low). Pooled data shows Group A > Group B.

  3.  **Reveal Subgroup Analysis (Style) & Reversal (20 mins)**  
      - *Activity:* Stratify by Style (Traditional/Avant-Garde). Show:  
        - *Within Traditional artists:* Admission rate in Group A < Group B.  
        - *Within Avant-Garde artists:* Admission rate in Group A < Group B.  
        - *Pooled (ignoring Style):* Group A > Group B.  
      - *Conceptual Hook:* "The exam path (B) is *always worse* for both types of artists... but pooling makes the portfolio path (A) look better. Why?"  
      - *Intercept Misconception 2 (Pooled Data is Epistemically Privileged):* Emphasize: "The pooled result isn’t ‘more true’—it’s *mathematically correct but causally misleading* because it ignores how Style distorts group allocation."

  4.  **Identify the Structural Mechanism (15 mins)**  
      - *Q:* "What broke the aggregation?" Guide students to see:  
        - Style affects *both* path choice (Group A/B) *and* admission success.  
        - Group A has more Avant-Garde (high-success) artists → inflates its pooled success.  
      - *Intercept Misconception 3 (Subgroups Show "True" Effect):* Clarify: "Stratifying on Style shows the *direct effect* of the path *holding Style constant*. But this isn’t automatically ‘true’—it’s the effect *conditional on the confounder*. Causality depends on theory!"

  5.  **Philosophical Implications (15 mins)**  
      - *Discussion Prompts:*  
        - "Can we trust *any* aggregated association for causal claims? When?"  
        - "What does this say about ‘evidence hierarchies’ that prioritize large-N studies?"  
      - *Intercept Misconception 4 (Reversal → Ontologically Empty Causation):* Refute: "Subgroup reversal doesn’t mean causation is an illusion—it means causal claims must specify: *‘for whom/under what conditions?’* Population-level effects can differ from subgroup effects."

  ---

  ### **End-of-Session Diagnostic Question**  
  **Scenario:** *"A tech company analyzes productivity (lines of code) vs. salary. Pooled data shows a negative correlation. When stratified by job type, both Software Engineers and Data Scientists show positive correlations. A critic says: ‘This proves salary doesn’t *really* affect productivity.’ Is the critic correct? Explain why Simpson’s Paradox warns against this claim."*  

  **Tests:**  
  - Recognizes reversal implies a confounder (e.g., job type).  
  - Rejects conflating association with causation.  
  - Identifies that confounders can create spurious aggregated signals.  
  - *Does not* rely on recalling the seminar example.

  ---

  ### **Omissions & Justifications**  
  1.  **Causal Graphs (DAGs):** Too technical for a 90-min intro. Focus is on *conceptualizing* confounding, not formalizing paths/colliders.  
  2.  **Collapsibility Conditions:** Requires regression/modeling depth. Students need only grasp that *ignoring* a confounder distorts aggregation.  
  3.  **Numerical Calculations:** The paradox’s *structure* (confounder → allocation bias) matters more than arithmetic.  
  4.  **Real-World Medical Examples:** Avoids triggering motivated reasoning about vaccines/treatments. Narrative examples maintain neutrality.  

  **Rationale:** Philosophy students need the *epistemic lesson*—causal inference demands interrogating partitions—not statistical machinery. Omissions prioritize clarity of the structural failure.
