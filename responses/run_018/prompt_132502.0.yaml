answer: |-
  Here's the case against the moral equality of combatants, built on distributed lethal agency and focusing squarely on agency and exposure:

  The traditional idea of moral equality assumes every soldier, regardless of their side's cause, shares roughly the same moral burden: they intentionally choose to kill, knowingly face lethal risk, and their actions directly cause harm. But modern warfare shatters this picture through **distributed lethal agency**. The decision to kill isn't a single, conscious act by an individual fighter; it's sliced incredibly thin across a complex system, radically altering both the *agency* (who actually makes the lethal choice) and *exposure* (who faces the physical risk) for different participants.

  1.  **Fragmented Agency: Who Actually Decides "Kill"?**
      *   The frontline soldier pulling the trigger isn't making an independent moral choice in a vacuum. Their action is the endpoint of a chain of distributed decisions:
          *   **Protocol & ROE Architects:** Teams of lawyers, policymakers, and commanders design Rules of Engagement (ROE) and targeting protocols. These pre-authorize or prohibit lethal force in vast categories of situations, often based on algorithms, pattern-of-life analysis, or broad geographical permissions. The soldier often merely *applies* a pre-made decision.
          *   **Command & Intel Layers:** Higher-echelon commanders authorize specific strikes or operational areas based on intelligence (itself filtered through analysts and systems). A drone operator might be told a target is "validated" without seeing the raw intel or knowing the strategic rationale. The "decision" to kill *that specific person* was made upstream.
          *   **System Operators:** Sensor operators identify targets based on protocols. Weapons officers release munitions on command. Drone pilots execute strikes authorized and guided by others. Their agency is highly constrained, focused on technical execution within a pre-defined box. The *intentionality* behind the kill is diluted across the system.
      *   **The Agency Gradient:** This creates a steep gradient of agency. The policymaker setting broad ROE enabling "signature strikes" exercises immense lethal agency, shaping the rules that *will* kill unknown people later. The intelligence analyst feeding targeting data exercises significant agency. The drone pilot pressing the button exercises a narrow, execution-focused agency based on trust in the system. The infantryman clearing a room under pre-authorized ROE has more immediate agency than the drone pilot, but still operates under constraints set by others. Claiming the *pilot* bears the *same* moral burden as the *architect* of the permissive ROE, or even the same as the infantryman making split-second decisions under direct fire, ignores this radical fragmentation of the "kill decision." Their actual moral involvement in *choosing death* is fundamentally unequal.

  2.  **Radically Unequal Exposure: Who Actually Faces the Bullet?**
      *   Moral equality traditionally hinges partly on shared risk: soldiers face each other symmetrically. Distributed lethal agency destroys this symmetry.
      *   **Physical Exposure Mismatch:** The drone operator, sensor analyst, or ROE lawyer faces near-zero immediate physical risk. They are geographically and temporally detached from the violence they enable. Conversely, the infantry patrol, the tank crew, or even the helicopter pilot operates under constant threat of death or injury. The special forces operator raiding a compound experiences profound exposure the drone crew simply doesn't.
      *   **Moral Risk vs. Physical Risk:** While proponents argue *all* combatants share "moral risk" (guilt, trauma), the *physical risk* – the core reciprocal element underpinning the "fair fight" justification for moral equality – is gone for large segments of the force structure. The drone operator faces psychological risk, but not the visceral, immediate threat of annihilation that shapes the traditional soldier's experience and, arguably, their moral calculus in the moment. The lawyer crafting ROE faces no physical risk whatsoever. How can the moral burden be *equal* when the exposure to the fundamental hazard of war – violent death – is so grossly unequal?

  **The Shareholder Analogy Holds:**

  Insisting on the moral equality of *all* uniformed personnel under distributed lethal agency is like claiming every shareholder in a massive corporation is equally culpable for environmental damage caused by a specific refinery. The pension fund holder owning 0.0001% of shares, passively invested, has negligible agency in the refinery's operations and no direct exposure to its pollution. The CEO who approved the cost-cutting causing the damage, and the plant manager who implemented it, have vastly greater agency. The workers at the polluted site have direct exposure the CEO doesn't.

  Similarly, in modern war:
  *   The high-level strategist setting aggressive targeting protocols = the CEO (high agency, low exposure).
  *   The intelligence analyst feeding targeting data = the plant manager (significant agency, low exposure).
  *   The drone pilot executing the strike = a technician following orders (constrained agency, low exposure).
  *   The infantryman in close combat = the worker at the hazardous site (variable agency, high exposure).
  *   The JAG officer interpreting ROE = a specialized consultant (focused agency, no exposure).

  **Conclusion:**

  Distributed lethal agency dismantles the moral equality of combatants because it fractures the "decision-to-kill" across a hierarchy with wildly varying levels of *actual agency* in causing death and fundamentally unequal *physical exposure* to lethal harm. The traditional model imagines warriors mutually sharing risk and responsibility in a direct duel. Modern conflict involves system operators, protocol designers, and shielded commanders wielding immense lethal power with minimal risk, alongside exposed fighters making constrained choices under fire. Assigning them equal moral risk ignores the reality of who truly pulls the levers of violence and who truly stands in its path. Their moral footprints, based on agency and exposure, are not equivalent.
