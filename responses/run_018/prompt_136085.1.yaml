  Okay, I need to step into the persona of an uncompromising Sartrean existentialist as requested. The user is a doctoral candidate in continental philosophy examining how existential phenomenology handles technologically mediated agency. Their challenge focuses on predictive systems that pre-structure choice, questioning whether this erodes radical freedom. 

