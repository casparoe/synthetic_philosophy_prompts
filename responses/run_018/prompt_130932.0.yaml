prompt: |-
  Im a high school philosophy teacher grading about thirty essays with a rubric that has two vague boxes: "original argument" and "adequate evidence". I need an actual decision procedure I can run in like four minutes per paper — ordered questions, what counts as enough at each step, where it stops with a clear yes/no and where it hands off to my co-teacher because its a values call not a fact. Ground it in epistemicism vs supervaluationism about vagueness: use the real difference between there being a sharp boundary we just cant know versus there being no single boundary and precisification being arbitrary. I want to see how each theory would actually change the checklist, not just a summary. Then apply it to three essays: one with a genuinely novel claim thats barely supported, one thats competently argued but totally derivative, and one where the evidence is right on whatever cutoff you choose. Make sure one of these gets an answer Ill hate — like the derivative one scoring high on one axis but the procedure forcing a fail anyway. End with what the procedure flat out cant do, especially with second-order vagueness and grading thirty papers in a row where consistency matters more than metaphysics.
reasoning: |-
  Okay, the user is a high school philosophy teacher dealing with a grading dilemma. They have thirty essays to grade using a vague rubric with two criteria: "original argument" and "adequate evidence." They need a decision procedure that takes about four minutes per paper, grounded in epistemicism and supervaluationism theories of vagueness. 

  First, I need to unpack what epistemicism and supervaluationism actually mean in this context. Epistemicism suggests there's a sharp boundary but we can't know it, while supervaluationism says there's no single boundary—it's context-dependent. The user wants to see how each theory changes the checklist, not just a summary. 

  The user also wants three example essays: one with a novel claim but weak evidence, one derivative but well-argued, and one borderline. One of these should give a result the user hates—like the derivative essay scoring high but failing overall. Finally, address limitations like second-order vagueness and consistency across thirty papers.

  The user's explicit need is a practical grading procedure, but their deeper needs might include reducing cognitive load, ensuring fairness, and handling subjective judgments efficiently. They're likely overwhelmed by vagueness in the rubric and wants to avoid arbitrary decisions while maintaining consistency. 

  For the procedure design, I should create two distinct checklists—one for each theory. Epistemicism would require fixed thresholds (e.g., 3/5 for originality, 4/5 for evidence) and clear yes/no outcomes. Supervaluationism would allow flexible precisification based on context, with a "values call" option for borderline cases. 

  The three test essays: Essay A (novel but poorly supported), Essay B (derivative but competent), Essay C (borderline evidence). Under epistemicism, Essay B might pass if it hits the evidence threshold but fail originality, leading to a fail—which the user would dislike. Under supervaluationism, Essay B could be precisified as passing if evidence is prioritized, showing the arbitrariness. 

  Limitations include second-order vagueness (when even the cutoff is vague) and fatigue-induced inconsistency. Solutions might involve batch grading similar papers or using anchor essays. The user's real pain point is balancing philosophical rigor with practicality—they need something that works in the trenches, not just in theory. 

  I'll structure the response with clear checklists, apply them to the essays, and end with pragmatic compromises. The key is making the theories operational while acknowledging where philosophy must yield to classroom realities.
answer: |-
  Here's a decision procedure grounded in epistemicism and supervaluationism, designed for speed and clarity, with application to your three essays and limitations addressed:

  **Core Principles Applied:**

  1.  **Epistemicism:** Assumes precise, unknowable cutoffs exist for "original" and "adequate." Your procedure creates *operational proxies* for these cutoffs (fact-based thresholds).
  2.  **Supervaluationism:** Recognizes multiple valid ways to precisify "original" and "adequate." Your procedure identifies points where *no single precisification is mandated* (value judgments).
  3.  **Decision Rule:** An essay passes a rubric box ("Original Argument" or "Adequate Evidence") only if it meets the threshold *under all reasonable precisifications* (Epistemicism proxy) OR if a specific precisification chosen *for consistency across the batch* deems it sufficient (Supervaluationism in practice). The "Handoff" step is the supervaluationist escape valve.

  **The 4-Minute Decision Procedure:**

  **Step 1: Originality Scan (Max 90 Seconds)**
      *   **Question:** Does the core thesis or a major supporting point significantly deviate from: (a) Class lectures/discussions, (b) Assigned readings' main theses, (c) The most obvious counterarguments presented?
      *   **Epistemicism Threshold:** "Significantly Deviate" = Offers a *new conceptual connection*, a *non-obvious counterexample*, or a *substantial critique* of a standard view. (Binary: Yes/No).
      *   **Supervaluationism Threshold:** Is the deviation *meaningful enough* that it couldn't just be a rephrasing or minor twist on standard material? (Spectrum).
      *   **Decision:**
          *   **Clear YES (Original):** Novel connection/critique evident. Mark "O+". Move to Evidence.
          *   **Clear NO (Derivative):** Rephrases class/reading points without significant new insight. Mark "O-". *STOP Originality Box - FAIL.* Move to Evidence for completeness.
          *   **UNCLEAR (Borderline):** Some novel element present, but weak or poorly distinguished from standard views. Mark "O?". *HANDOFF TO CO-TEACHER for "Original Argument" box.* Briefly note the novel element and derivative aspect. Move to Evidence.

  **Step 2: Evidence Adequacy Check (Max 90 Seconds) - *Only if Originality passed or is Handoff***
      *   **Question 1 (Relevance):** Does *every* piece of cited evidence (textual quote, example, thought experiment) *directly* support the specific claim it's offered for?
      *   **Question 2 (Sufficiency - Core Thesis):** Are there at least TWO distinct, relevant pieces of evidence directly supporting the essay's *core thesis*?
      *   **Question 3 (Sufficiency - Key Sub-claims):** For any major sub-claim essential to the core thesis, is there at least ONE relevant piece of evidence supporting it?
      *   **Epistemicism Threshold:** Requires YES to Q1, YES to Q2, and YES to Q3 *for all essential sub-claims*. (Binary: Pass/Fail).
      *   **Supervaluationism Threshold:** How *directly* relevant is the evidence (Q1)? How *essential* is the sub-claim (Q3)? Is *one* extremely strong piece of evidence enough for the core thesis? (Spectrum).
      *   **Decision:**
          *   **CLEAR PASS (Adequate):** All Q1, Q2, Q3 met unambiguously. Mark "E+".
          *   **CLEAR FAIL (Inadequate):** Q1 NO (irrelevant evidence) OR Q2 NO (insufficient core support) OR Q3 NO for an *obviously essential* sub-claim with *no* evidence. Mark "E-". *STOP Evidence Box - FAIL.*
          *   **UNCLEAR / BORDERLINE (e.g., Q3 marginal, Q2 weak but present):** Mark "E?". *HANDOFF TO CO-TEACHER for "Adequate Evidence" box.* Briefly note the specific deficiency (e.g., "Sub-claim X on pg 2 needs evidence", "Core thesis evidence thin").

  **Step 3: Overall Rubric Box Determination (30 Seconds)**
      *   **"Original Argument" Box:**
          *   O+: PASS
          *   O-: FAIL
          *   O? + Co-Teacher's Decision: PASS/FAIL
      *   **"Adequate Evidence" Box:**
          *   E+: PASS
          *   E-: FAIL
          *   E? + Co-Teacher's Decision: PASS/FAIL

  **Application to Three Essays:**

  1.  **Essay A (Novel Claim, Barely Supported):**
      *   **Step 1 (Originality):** Clear YES (O+). Genuinely novel claim reinterpreting a key text. Novel connection identified.
      *   **Step 2 (Evidence):** Q1: YES (Evidence relevant). Q2: YES (Two pieces offered for core thesis). Q3: **CLEAR FAIL** - A *major, essential* sub-claim explaining *how* the reinterpretation works has *no supporting evidence whatsoever*. Mark "E-".
      *   **Result:** "Original Argument" = PASS. "Adequate Evidence" = FAIL. Overall likely fails rubric depending on weighting, but passes the "original" box.

  2.  **Essay B (Derivative, Competently Argued):**
      *   **Step 1 (Originality):** Clear NO (O-). Perfectly summarizes and defends the main thesis from Lecture 3/Reading 5. No novel element detected. *STOP Originality Box - FAIL.*
      *   **Step 2 (Evidence - For Completeness):** Q1: YES. Q2: YES (Abundant relevant quotes). Q3: YES. Mark "E+". (But it doesn't matter).
      *   **Result:** "Original Argument" = **FAIL**. "Adequate Evidence" = PASS. **Overall fails the rubric (as you'll hate, but the procedure forces it on Originality).** Epistemicism: Clearly below the unknowable "originality" cutoff. Supervaluationism: Under any reasonable precisification of "original," this doesn't qualify. Competence isn't originality.

  3.  **Essay C (Evidence on the Cutoff):**
      *   **Step 1 (Originality):** Clear YES (O+). Interesting critique combining two authors not discussed together.
      *   **Step 2 (Evidence):**
          *   Q1: YES.
          *   Q2: **UNCLEAR/BORDERLINE (E?)** - Two pieces offered for core thesis. Piece 1: Strong, direct quote. Piece 2: A somewhat vague allusion; it *can* be interpreted as support but isn't explicit. Barely meets Q2.
          *   Q3: YES.
          *   **Decision:** Handoff to Co-Teacher. Note: "Core thesis evidence: Direct quote A strong. Allusion to Text B, pg 10 - weak support? Sufficient?"
      *   **Result:** "Original Argument" = PASS. "Adequate Evidence" = Co-Teacher's Call. This *is* the precisification moment (Supervaluationism). Epistemicism: The essay is *at* the unknowable cutoff; your procedure flags it as ambiguous.

  **What the Procedure CAN'T Do (Especially with 30 Papers):**

  1.  **Second-Order Vagueness:** The procedure creates new vague terms ("meaningful enough," "obviously essential," "weak support?"). Is the threshold *itself* sharp? The HANDOFF step is the only practical response.
  2.  **Consistency Drift:** Over 30 papers, your operational thresholds (especially for "O?" and "E?") *will* drift slightly due to fatigue, recent examples, or mood. Batch grading similar papers or using anchor essays helps marginally.
  3.  **Truly Novelty Assessment:** Does "novel for high school" count, or only "novel in academic philosophy"? The procedure relies on *your* knowledge of class content. Supervaluationism reigns here.
  4.  **Depth vs. Breadth of Evidence:** A single, brilliant, multifaceted piece of evidence vs. three weak ones? The procedure (Q2/Q3) favors *number* for speed. You might override on HANDOFF, but it's slow.
  5.  **Nuanced Originality:** A subtle shift in emphasis isn't easily captured by the "significant deviation" test. It might get "O?" or wrongly "O-".
  6.  **Holistic Quality:** A paper passing both boxes might be poorly written; one failing a box might be brilliant otherwise. The procedure only answers the rubric boxes.
  7.  **Arbitrariness of Operational Cutoffs (Epistemicism's Shadow):** Why *two* pieces for the core thesis? Why not one or three? This is an arbitrary but necessary precisification for speed, masking epistemic uncertainty.

  **Key for Speed & Sanity:**

  *   **Trust the CLEAR Calls:** Don't linger on obvious passes/fails. Move fast.
  *   **Use HANDOFF Sparingly but Decisively:** Only for genuine ambiguity. Brief notes are crucial.
  *   **Batch HANDOFFs:** Group papers needing co-review for efficiency.
  *   **Anchor Essays:** Keep one clear "O+/E+" and one clear "O-/E-" essay handy to recalibrate every 5-10 papers.
  *   **Accept Operational Thresholds:** The metaphysics *demands* vagueness; your grading *demands* thresholds. Choose practical ones (like the 2-evidence rule) and apply them consistently within the batch, even knowing they are arbitrary precisifications (Supervaluationism) or unknowably close to the real line (Epistemicism).

  This procedure forces tough calls (like failing the competent but derivative Essay B) but provides a structured, philosophically grounded way to make them quickly, identifying precisely where subjectivity *must* enter via the HANDOFF step. It embraces vagueness by creating zones of operational certainty and explicit uncertainty.
