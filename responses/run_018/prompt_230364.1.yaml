prompt: |-
  You are a teaching assistant for a course on judgment under uncertainty and forecasting, taught in the applied rationality tradition. The exam question below was worth 20 points. Grade the student's answer. Do not give a holistic impression; provide a point-by-point assessment identifying which claims the student makes correctly, which claims are inaccurate or poorly defended, and which distinctions the student blurs. For each criticism, point to the specific sentence or phrase and explain why it matters. End with a numerical score out of 20 and a one-paragraph justification for that score.

  Exam question:
  "Explain the distinction between the inside view and the outside view. Then discuss how the distinction should guide (a) a project manager estimating how long a firm's enterprise software migration will take, and (b) a research committee assessing a proposal for a radically novel scientific program with no close historical analogues. In each case, state whether and how the outside view should constrain or override the inside view, and under what conditions the inside view may legitimately win."

  Student's answer:
  "The inside view is when you look at the details of the specific case—the particular tasks, team, resources, and obstacles—and build an estimate from those components. The outside view is when you ignore those details and instead use base rates: you find a reference class of similar past cases and use its distribution of outcomes. The planning fallacy literature shows that the inside view is systematically over-optimistic, since people neglect base rates and construct plans that assume everything goes well. Therefore, whenever a usable base rate exists, the outside view should generally override the inside view, because the base rate is the summary of all the information that matters and extra case-specific detail is mostly a source of bias. For the software migration, the manager should simply adopt the industry average completion time for similar migrations and plan around that; the internal task-by-task estimate is just an optimistic story and should be set aside. For the radical research program, however, there is no reference class of similar programs, so the outside view is unavailable to us; the only remaining choice is to assess the proposal on its internal intellectual merits and fund it if those merits look strong. That is what epistemic modesty demands: use statistical reasoning where exact statistical evidence exists, and refrain from pretending to knowledge where it does not."
reasoning: |-
  Alright, let's tackle this. The user wants me to grade a student's answer on the inside vs. outside view distinction. First, I need to recall what the exam question is asking. The student must explain the distinction and apply it to two scenarios: a project manager estimating software migration time and a research committee assessing a novel scientific program. They also need to discuss when the outside view should override the inside view and vice versa.

  Looking at the student's answer, they start by defining both views correctly. The inside view focuses on specific case details, and the outside view uses base rates from similar past cases. That's accurate. They mention the planning fallacy leading to optimism bias, which is correct. So far, so good.

  Next, the student claims that when a base rate exists, the outside view should override the inside view because the base rate summarizes all relevant info and case-specific details add bias. This is a strong point, but it's a bit too absolute. The literature does emphasize the outside view's importance, but sometimes case-specific adjustments are necessary. The student oversimplifies by saying the inside view is "just an optimistic story" that should be set aside. This ignores that inside details can refine base rates. For the project manager, they suggest using the industry average without considering inside adjustments. That's a point deduction because the answer doesn't acknowledge possible legitimate integrations.

  For the research program, the student correctly notes no reference class exists, so the outside view isn't feasible. They advise relying on internal merits. But here's the issue: they miss that even without direct analogues, broader base rates (e.g., failure rates of innovative projects) could inform the decision. The student's claim that "the only remaining choice" is the inside view is too black-and-white. Epistemic modesty should still encourage seeking any relevant statistical data, even if imperfect. Also, they don't mention that the inside view might be overconfident here too, which the committee should guard against. 

  The student's conclusion about epistemic modesty is partially right but oversimplifies. They imply that without exact evidence, one must rely solely on inside view, but the applied rationality tradition would advocate for probabilistic thinking even with limited data. 

  Overall, the student gets the core concepts right but applies them too rigidly. They miss nuances in both scenarios: not integrating inside details with base rates for the project manager and not considering broader base rates for the research program. Each oversight is a specific point lost. I'd give them 13/20: solid on definitions and initial application but lacking depth in integration and broader statistical reasoning where applicable.
answer: |-
  ### Point-by-Point Grading (Total: 13/20)  

  **1. Definition of inside/outside view (Correct: +2 points)**  
  - ✅ **Correct claim:** "The inside view is when you look at the details of the specific case... build an estimate from those components. The outside view is... use base rates: find a reference class... use its distribution."  
    *Justification: Accurately captures Kahneman/Tversky's distinction. No errors.*  

  **2. Planning fallacy and bias (Mostly Correct: +1.5 points)**  
  - ✅ **Correct:** "The planning fallacy literature shows that the inside view is systematically over-optimistic."  
  - ⚠️ **Incomplete:** "Neglect base rates and construct plans that assume everything goes well."  
    *Critique: Correct but omits *why* base rates are neglected (e.g., singularity focus, motivational biases). Loses nuance but not inaccurate.*  

  **3. Override claim (Overgeneralized: −2 points)**  
  - ❌ **Inaccurate:** "Therefore, whenever a usable base rate exists, the outside view should generally override the inside view... extra case-specific detail is mostly a source of bias."  
    *Critique: Too absolute. The literature (e.g., Tetlock, Lovallo) advises *adjusting* inside views with base rates, not wholesale override. Case-specific details *can* validly modify predictions (e.g., unique resources, expertise). This absolutism misrepresents applied rationality principles.*  

  **4. Software migration application (Partially Correct: +1.5 / −1 points)**  
  - ✅ **Correct:** "Manager should adopt industry average completion time."  
  - ❌ **Inaccurate:** "The internal task-by-task estimate... should be set aside."  
    *Critique: Advocates complete dismissal of inside view. Best practice (e.g., Flyvbjerg) uses outside view as *anchor* then adjusts for *diagnostic* case specifics (e.g., "Is our team 20% more experienced than average?"). Ignoring all inside details risks underfitting.*  

  **5. Research program application (Flawed: −1.5 points)**  
  - ✅ **Correct:** "No reference class... outside view unavailable."  
  - ❌ **Inaccurate:** "The only remaining choice is to assess the proposal on its internal intellectual merits."  
    *Critique: Fails to recognize *partial* outside views still apply. Radical projects can use broader base rates (e.g., failure rates of "highly novel" endeavors, cost overruns in adjacent fields). Epistemic modesty demands seeking *any* statistical guardrails, not defaulting to inside view.*  

  **6. Epistemic modesty claim (Misapplied: −0.5 points)**  
  - ⚠️ **Poorly defended:** "Refrain from pretending to knowledge where it does not exist."  
    *Critique: Contradicts the student's own inside-view reliance for the research case. Applied rationality would demand *probabilistic* inside views (e.g., "Given no analogues, we assign 20% success probability") or seek *fuzzy* reference classes. "Internal merits" assessment invites overconfidence.*  

  **7. Critical omissions (Not penalized elsewhere):**  
  - ❗ **Missed condition for inside-view legitimacy:** Never addresses when inside view may "legitimately win" (e.g., when case has truly unique, *diagnostically valid* factors).  
  - ❗ **No mention of adjustment/aggregation:** Ignores key techniques (e.g., *reference class forecasting* blends views; *Blighted* probabilities use inside view to weight outside priors).  

  ---

  ### Final Score: 13/20  
  **Justification:** The student correctly defines core concepts (+3.5) and identifies the outside view's priority in software migration (+1.5), but severely overgeneralizes the "override" principle (−2), mishandles the research case by ignoring broader base rates (−1.5), and dismisses valid inside-view integration in both scenarios (−2). Omissions regarding adjustment methods and inside-view legitimacy conditions further weaken the answer. While structurally sound, the absolutist framing ("set aside," "only remaining choice") contradicts applied rationality's emphasis on *hybrid* reasoning and probabilistic humility, costing significant points.
