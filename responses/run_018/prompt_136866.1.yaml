  - Turing proposed the idea of machines that can exhibit intelligent behavior without understanding (the Turing Test). He emphasized external behavior over internal states.
  - Given that LLMs can generate coherent text, pass exams, etc., but fail at tasks requiring true comprehension (like the reversal curse or explaining novel conflicts), Turing might still consider this as a form of thinking because it passes the behavioral test in many contexts. However, he might note that the reversal curse and similar limitations show that the system is not fully intelligent in the human sense, but that doesn't necessarily mean it fails his test entirely. His test is about whether a machine can imitate a human convincingly, not about internal understanding.

  Darwin's View:
  - Darwin's "strange inversion of reasoning" suggests that complex competence (like instincts) can arise from natural selection without a designing mind. Gradient descent in machine learning is an optimization process that, without explicit design, shapes the model's parameters to perform tasks. Darwin might see this as analogous to natural selection: the training process selects for weights that produce competent outputs without any top-down comprehension by the system.

  Inversion Connection:
  - Both Turing and Darwin's ideas point to the emergence of competence without top-down comprehension. Turing's inversion: machines can behave intelligently without understanding. Darwin's inversion: natural selection designs complex adaptations without a designer's plan. LLMs trained by gradient descent are a modern example of both: they achieve competence (via optimization on data) without comprehension.

