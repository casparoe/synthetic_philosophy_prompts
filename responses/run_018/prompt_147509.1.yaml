  First, the premise that objective time requires a global ordering. If someone adopts a relational or local view of time, like Rovelli's or causal set theory, does that dissolve the threat? The user might not have considered that objective passage could exist without a cosmic now. But then, does that save objectivity or just relocate it? That's a crucial point to explore.

