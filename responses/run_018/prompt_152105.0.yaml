  First, I need to unpack their core request: they want desiderata (essential criteria) for evaluating solutions to this paradox in collective action contexts. Their phrasing suggests they've already grasped the central tension - rigid rule-following sometimes worsens outcomes. The mention of "tiny contributions" indicates they're thinking about threshold cases where individual actions seem morally negligible but aggregate into disaster.

  Hmm, they're clearly struggling with conceptual distinctions too - they explicitly mention needing to separate wrongdoing from blameworthiness from collective rule-breaking. That's sophisticated for high school! I should honor that by not oversimplifying. Their no-citations constraint means I'll avoid name-dropping philosophers (sorry Kagan/Pogge) and focus on conceptual frameworks.

  Key challenges here: First, preserving deontology's core anti-consequentialism while preventing catastrophic outcomes. Second, handling distributed responsibility without collapsing into "everyone's guilty" vagueness. Third, accounting for real-world constraints like imperfect information. 

  The non-negotiables seem to be: maintaining the doing/allowing distinction (deontology's backbone), explaining threshold effects, and preserving individual agency. What's trickier is their request to flag "camp preferences" - that shows meta-awareness. For instance, some philosophers would ditch individual agency to solve collective problems; others would rather bite the bullet on bad outcomes.

  Biggest tension: Requiring both clear individual prescriptions AND good collective outcomes might be impossible without compromising deontology's foundations. I'll note that as a "jointly impossible" pair per their request. Should also clarify that no consensus exists - this remains hotly debated in professional philosophy circles.

  For structure: I'll open with the core paradox requirements, then collective harm specifics, followed by key distinctions, and close with science/logic constraints. Keeping it under 250 words means sacrificing examples - hope the climate reference suffices. Tone should stay academic but accessible ("you're building a theory" not "philosophers argue").
answer: |-
  Here's what any theory solving the deontological paradox for collective harm must handle:

  **Core Requirements (Non-negotiable):**
  1.  **Preserve Core Deontology:** Must reject maximizing good consequences as the sole moral determinant, retaining constraints (e.g., "don't kill") or special duties.
  2.  **Explain Collective Harm:** Account for cases where many tiny acts, individually permissible under standard rules, aggregate into significant harm (e.g., individual CO2 emissions, supply chain contributions).
  3.  **Avoid Collapsing Distinctions:** Must *not* conflate:
      *   **Doing Wrong vs. Being Blameworthy:** Someone might act permissibly yet still bear responsibility for a bad outcome, or vice-versa.
      *   **Individual vs. Collective Wrongdoing:** Explain how a group violates a rule without necessarily implying every member violates it individually *in the same way*.
      *   **Rule-Breaking vs. Bad Outcome:** A permissible act shouldn't magically become wrong *only* because of aggregate consequences.

  **Specific Demands & Constraints:**
  1.  **Thresholds:** Explain how harm "tips" from acceptable to unacceptable as actions accumulate. (Contested: Whether thresholds are sharp or fuzzy).
  2.  **Individual Guidance:** Provide clear prescriptions for individuals in collective contexts (e.g., "Should *I* drive my car?"). (Contested: Some theories struggle here).
  3.  **Coordination & Fairness:** Address why individuals should act if others don't (assurance problem), and avoid demanding excessive sacrifice from a few. (Social science input crucial).
  4.  **Logic/Science:** Avoid contradictions (e.g., claiming an act is both permissible and impermissible simultaneously). Be compatible with established social science on collective action problems (e.g., tragedy of the commons, diffusion of responsibility).

  **Tensions & Preferences:**
  *   **Jointly Difficult?** Satisfying both **Preserve Core Deontology (1)** and provide **Clear Individual Guidance (2)** in collective harm cases is the central tension; many see it as nearly impossible without weakening deontology.
  *   **Camp Preferences:** Some prioritize **Individual Agency (2)**, others prioritize **Preventing Disaster (Collective Harm - Core 2)** even if individual rules get complex. Some accept "threshold deontology" (rules hold until harm gets extreme), others reject it as consequentialism in disguise.

  **Settled vs. Contested:**
  *   **Settled:** The paradox is real. Simple act-based deontology struggles massively with collective harm. Distinctions (Core 3) are crucial.
  *   **Contested:** *Every* proposed solution (e.g., collective agency, complex individual duties, threshold rules, institutional focus) is debated. There is **no consensus** on the "correct" theory.
