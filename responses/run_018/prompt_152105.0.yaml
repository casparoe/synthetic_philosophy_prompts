prompt: |-
  hey im in high school and for my philosophy class im stuck on the paradox of deontology — like how sticking to moral rules can end up hurting everyone including the people the rules are meant to protect. i want the desiderta for any theory that claims to solve this, specifcally for cases where harm comes from lots of people each doing a tiny bit (think climate damage or corporate supply chains) so that no single person clearly violates a rule but the group does. list what the theory must explain, the cases it has to get right, the distinctions it cant collapse (like doing wrong vs being blameworthy vs breaking a rule collectively), and any results from logic or social science it shouldnt contradict. flag which requirements are non-negotiable and which are camp preferences, and say if any pair looks jointly impossible. please seperate whats actually settled from whats contested among philosophers who work on this — dont present one view as the consensus. and keep it tight: max 250 words, no more than 4 paragraphs, and dont ask me to cite anyone since i cant look stuff up.
reasoning: |-
