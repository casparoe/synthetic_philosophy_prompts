  Hmm, the five bullet points are the meat: motivational transparency, non-reduction without dualism, overdetermination, interpretive circularity, and cross-cultural failure. Plus that niche "axiological leakage" add-on about feedback loops. They’re clearly frustrated with theories that ignore dynamism (like how capitalism secularizes asceticism). 

