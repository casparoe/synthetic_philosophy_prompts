  User’s probably an academic (chapter draft + niche terms) but wants casual delivery. I’ll avoid jargon, misspell "causal" as "casual" once for effect, and keep it coffee-chat style. No citations—they’ll handle that. 

  Biggest unspoken need? They want ammunition to defend cultural causation against skeptics. That’s why desiderata must be steel-manned. Also, leakage is their pet contribution—I’ll hype that. 

