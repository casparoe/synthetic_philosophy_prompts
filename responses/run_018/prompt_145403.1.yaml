answer: |-
  The geometry lesson dissolved around Maya. Mrs. Henderson’s voice, explaining congruent triangles, became the drone of a distant engine – the engine of the universe itself, perhaps. Maya’s gaze drifted to the window. Outside, Oakhaven looked utterly normal: Mr. Davies trimming his perpetually unruly hedge, Mrs. Chen walking her ancient terrier, sunlight glinting off the chrome of Hank’s Diner. Normal, yet… stretched thin.

  It started subtly. The *exact* same cloud formation three Tuesdays in a row. Hank whistling the same off-key snippet of "Yesterday" every Thursday at 4:15 PM. A news report on the crack in the old library steps repeating, verbatim, a month apart. Déjà vu became her constant companion, a low-grade fever of repetition.

  Then came the books. Not assigned reading. Dusty volumes from the back of the library, physics and philosophy whispering secrets science class never touched. That’s where she found *him*. Kurt Gödel. The quiet logician who dared to play with Einstein’s equations. Gödel’s Rotating Universe. The idea wrapped around her mind like smoke: *If the entire universe spins, just the right way, space-time twists back on itself. Paths open… paths to the past. Closed timelike curves. Time becomes a loop, not a line.*

  The realization hit her like a dropped textbook. *That’s it. Oakhaven is spinning. Not just orbiting, not just expanding… spinning in that specific, universe-curdling way.* The repetitions weren't coincidence; they were echoes bouncing off the curved walls of their temporal prison. Yesterday *was* physically reachable. It explained the impossible sameness, the feeling of walking through set dressing. And it explained why Gödel thought time itself might be an illusion – just a stubborn human perception of the loop.

  More chillingly, it explained why she was the only one who noticed. Her memories, somehow, weren't resetting with the loop. They accumulated. She was a stone skipping across the surface of a circular pond, remembering every bounce while everyone else just saw the water. Alone. Utterly alone in knowing the town was a broken record.

  She *had* to tell someone. Warn someone. Herself. Past-Maya, blissfully unaware, needed to know. She grabbed a scrap of paper in the deserted laundromat (Thursday, 4:15 PM, Hank whistling faintly outside). The pen felt heavy, charged. She wrote fast, desperately:

  *"Past Maya - LISTEN. Oakhaven is stuck. Time is looping. Gödel's rotating universe. The spin is too fast? Something. Things repeat - the cloud, Hank's song, Mrs. Chen's terrier always limps at Elm St. You remember things, others don't. Pay attention! Break the loop! Find the center? I don't know. P.S. Don't trust geometry, it feels wrong now. P.P.S. Seperate yourself mentally. Watch for patterns."*

  She stared at the word "Seperate." A tiny flaw, a human error in her cosmic warning. Satisfying. She folded the note small, hard. *Now, how to deliver it?* The theory said the past was *reachable*, but how? She closed her eyes, thinking of yesterday. The specific chill of the morning air, the smell of burnt toast from her kitchen, the frustration of missing the bus.

  She imagined pushing the note *back*. Into the pocket of her jacket hanging in the hallway closet yesterday morning. A place Past-Maya would find it immediately. She concentrated, pouring her isolation, her terrifying knowledge, into the tiny square of paper clutched in her fist. *Go. Go back.*

  A strange pressure built in her ears, a hum vibrating through her bones. The fluorescent lights of the laundromat flickered wildly. For a split second, the whirring tumble dryers seemed to slow, then spin backwards. The folded paper in her hand grew warm, almost hot. Then… nothing. The lights stabilized. The dryers rumbled normally. The note was gone.

  Relief flooded her, sharp and sweet. It worked! Past-Maya would find it! She’d be prepared, not alone!

  Her feet carried her home, lighter than they had in weeks. She burst into the hallway, yanked open the closet door. Her blue denim jacket hung there. Heart pounding, she shoved her hand into the right pocket. Empty. Left pocket. Fingers brushed against… paper.

  She pulled it out. A small, tightly folded square. Hers. But as she unfolded it, the elation curdled.

  The words were… wrong. Not English. Not any language she knew. Elegant, curling symbols danced across the page, intricate and utterly alien. They shimmered faintly, like heat haze off asphalt. The ink seemed to shift, the symbols subtly rearranging themselves even as she stared. Where she *knew* she’d written "Seperate," there was a complex glyph that looked like a spiral trapped inside a knot.

  Causality. The universe’s rigid rulebook. Gödel might have found a loophole with his spinning cosmos, but delivering a direct message to the past? That was crossing a line reality wouldn't allow. The note was scrambled, translated into static, into the language of paradox itself. It wasn't just undeliverable; it was *unreadable*.

  Maya sank onto the bottom step of the stairs. The familiar hallway felt alien, the ticking of the grandfather clock in the living room suddenly ominous. She traced a finger over the shimmering, incomprehensible symbols. They felt warm, vibrating with the suppressed energy of the impossible message.

  Past-Maya had never gotten the warning. She *was* Past-Maya, stumbling blind into the loop. Again. And again.

  A strange calm settled over her, colder than despair. She carefully refolded the note, the alien script hidden inside. She slipped it back into her pocket. It was proof. Tangible, impossible proof that time was broken, that she was adrift in a spinning snow globe.

  She walked to the kitchen window. Outside, Mr. Davies raised his shears to the same stubborn branch. Mrs. Chen’s terrier paused, predictably, to sniff the same fire hydrant. The late afternoon sun painted the same gold on the brickwork of Hank’s Diner.

  Time wasn't real. Not like this. It was just the scenery scrolling past in Oakhaven’s eternal, silent spin. And she was the only one watching the reel. Maya leaned her forehead against the cool glass. The hum of the refrigerator joined the distant drone of the universe. She closed her eyes, feeling the weight of the scrambled note in her pocket, a tiny, burning seed of impossible knowledge in a world built on repetition. The loop would reset soon. But she, and the note, would remember. That was her curse. And her only anchor.
