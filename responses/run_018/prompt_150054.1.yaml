  4.  Combining these (weighting the first most heavily as foundational), my overall credence that dirty-hands situations are structurally unavoidable in modern democratic governance is **70%**.  
  5.  This final answer is most sensitive to Part 1; a detailed longitudinal case study demonstrating that leaders in unavoidable trade-offs *are* consistently absolved of moral taint by their constituents and impartial observers (e.g., analyzing public/judicial response to post-disaster resource triage decisions) would move that part the most.
