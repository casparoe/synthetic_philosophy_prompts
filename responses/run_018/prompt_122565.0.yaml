answer: |-
  Right, let's drop Bertie into the 21st-century pub debate. Based on *Marriage and Morals* (warts and all), here's the likely take on your cases, keeping it conversational:

  **1. The Throuple & Three-Parent Law**

  *   **What He'd Say:** "Good show on minimising jealousy! That’s the rational approach. The stable arrangement for the child is paramount – far more important than clinging to the old model just for tradition’s sake. Three loving, committed caregivers? Splendid! The legal recognition preventing economic vulnerability for the child and any parent? Essential – that’s *precisely* why the state has an interest."
  *   **Bit of His Position:** **Child welfare as the *only* legitimate state interest in family structures** wins out. His critique of jealousy as a destructive, culturally reinforced emotion supports the arrangement itself. He saw marriage law primarily as a financial safeguard for women/children.
  *   **What He'd Find Alien/Misjudge:** The **rota & written co-parenting contract**. He’d likely see it as *overly* rigid and legalistic, potentially stifling spontaneous affection. He championed reason over passion *in guiding behaviour*, but might worry this level of scheduling replaces natural family bonds with bureaucratic management. He might underestimate the emotional labour the contract actually *prevents*.
  *   **Annoying Both Camps:** Irks conservatives by endorsing the non-traditional structure wholeheartedly. Irks some progressives by potentially criticising the rota/contract as unnatural or cold.

  **2. The AI Boyfriend Subscription**

  *   **What He'd Say:** "Harmless? Perhaps superficially. But it’s deeply *unsatisfactory*. Sex without procreation is fine, play is fine – but this isn’t play involving another *person*. It’s a sophisticated form of masturbation. Where’s the mutual vulnerability, the genuine exchange, the risk and reward of real connection? It treats the *idea* of intimacy as a commodity. Your flatmate isn’t deceived, but they are deceiving *themselves* if they think this meets the human need for connection. It’s a symptom of profound isolation."
  *   **Bit of His Position:** His insistence that **sex (even playful sex) finds its highest value in mutual affection and genuine communion between conscious beings**. His fierce opposition to treating people as *mere* means applies here – the AI *is* just a means, lacking any reciprocity. No deception doesn't save it; it makes the lack of mutality stark.
  *   **What He'd Find Alien/Misjudge:** The **sheer sophistication and perceived emotional resonance of AI companions**. He’d grasp the tech but fundamentally couldn’t conceive of someone being "clear-eyed" yet deriving significant *relational* satisfaction from a non-conscious entity. He’d likely overestimate the harm, seeing it as a direct replacement for human relationships rather than a complex, potentially supplementary, coping mechanism.
  *   **Annoying Both Camps:** Irks libertarians/AI-enthusiasts by dismissing it as unhealthy. Irks some sex-positivity advocates by arguing this specific form of "play" lacks a crucial human element.

  **3. Embryo Selection via Polygenic Scores**

  *   **What He'd Say:** (Sighs heavily) "Ah, Eugenics. My youthful folly... look, *voluntary* selection to reduce suffering? Potentially defensible, *if* the science were infallible (which it isn't) and *if* we could agree on what constitutes 'desirable' without bias (which we can't). A *market* for embryos? Appalling! Turning potential human life into a consumer product ranked like washing machines? This privatises eugenics, making it *more* insidious, driven by profit and parental anxiety, not social good. The potential for discrimination and narrowing of human diversity is terrifying. Where is the mother's bodily autonomy respected in this commercial pressure?"
  *   **Bit of His Position:** His **later, strong repudiation of coercive eugenics and state control over reproduction**, coupled with his **feminism emphasising women's autonomy**. While he *did* historically support *voluntary* measures for "improvement," the consumer-market model would trigger his deep distrust of capitalism and power imbalances. He'd prioritise preventing suffering caused by *society* over selecting "better" individuals.
  *   **What He'd Find Alien/Misjudge:** The **consumer-driven, privatised, hyper-technological nature of modern genetic selection**. He imagined state programmes or voluntary social pressure, not a clinical marketplace. He’d likely *underestimate* the speed of genetic science but *overestimate* the immediate social dangers of this specific, niche practice.
  *   **Annoying Both Camps:** Irks pro-market/techno-optimists by decrying the commercialisation. Irks traditional eugenics sympathisers (and some modern "human enhancement" advocates) by rejecting selection based on complex polygenic scores as scientifically dubious and ethically fraught.

  **4. Child Benefit, No-Fault Divorce & Lone-Parent Poverty**

  *   **What He'd Say:** "The *structure*? Exactly what I advocated: state support delinked from marriage, freeing women from economic slavery within bad unions. No-fault divorce? Essential for that freedom! But the *execution*? A bloody disgrace! If mothers and children are still living in poverty *after* receiving state support, then the support is grossly inadequate. It betrays the whole principle! The point wasn’t just to change the legal label, but to provide *genuine*, sufficient economic independence. This looks like the state doing the bare minimum to salve its conscience while abandoning the vulnerable."
  *   **Bit of His Position:** His core argument that **women and children must be economically secure independent of the husband/father** through state provision. The existence of child benefit and no-fault divorce implements the *mechanism* he wanted.
  *   **What He'd Find Alien/Misjudge:** The **persistence of significant poverty *despite* the welfare framework** he championed. He might underestimate the cost of living, housing crises, and the political difficulty of setting benefits at a truly adequate level. He might also be shocked by the *scale* of lone-parent families due to social changes beyond just divorce freedom.
  *   **Annoying Both Camps:** Irks austerity advocates/Tories by demanding *much* higher benefits. Irks some social conservatives by vigorously defending no-fault divorce and non-marital support as essential justice.

  **Key Factual Hostages (Where His World Shapes His Views):**

  1.  **Contraception:** His wholehearted endorsement of sexual freedom *relied* on the assumption of reliable contraception (which wasn't widely available/effective in 1929). Without the Pill/IUDs/etc., his views on non-procreative sex become far more fraught with risk. *This is massive.*
  2.  **STIs:** His relatively relaxed attitude to sex outside strict monogamy didn't face the same terrifying, incurable STI landscape as before antibiotics. HIV/AIDS would have profoundly altered his risk calculus.
  3.  **Welfare State:** His proposals for state support assumed a much smaller, less complex system than exists now. He might be narked by bureaucracy but wouldn't abandon the principle.
  4.  **Falling Birth Rate:** His focus on freeing sex from procreation was partly driven by concerns about overpopulation *in his context*. Today's low birth rates in developed nations might shift his emphasis slightly, but not his core principle.

  There you go. Bertie in the pub: still contrarian, still rationalist, still capable of being spectacularly right *and* wrong, often simultaneously. Cheers!
