prompt: |-
  hey, my study group on dawkins-style cultural evolution keeps throwing around "memes are the genes of culture" whenever someone asks if LLM-generated slogans that spread virally without direct human copying still count as memetic replication. they seem to think that without biological-style selection pressure it's not "real" culture. can you lay out the seperate precise theses hiding in that slogan -- from trivial analogy to full mechanistic reduction -- and for each say whether it's defensible, false, or empty, and whether it actually rules out algorithmic replicators? also flag which reading my study-buddy is probably smuggling in to exclude AI slop. keep it to one paragraph with bullet points inside, max 200 words, no bibliographies.
reasoning: |-
  Hmm, the user is in a study group on Dawkins-style cultural evolution, and they're confused about the phrase "memes are the genes of culture." Their group keeps using this slogan to argue that LLM-generated viral slogans don't count as memetic replication because there's no biological-style selection pressure. They want me to break down the different interpretations of that slogan, assess each one's validity, and figure out which interpretation their study buddy is using to exclude AI content. I need to keep my response concise: one paragraph with bullet points, under 200 words, no bibliographies.

  The user's scenario involves academic debate—they're likely a student or researcher in cultural evolution, seeking clarity on theoretical concepts. Their actual need is to understand the nuances in the slogan to counter their group's arguments. Deeper unspoken needs might include feeling validated in their skepticism about excluding AI slop, or wanting tools to push back against rigid definitions that ignore modern digital phenomena. They might be frustrated with dogma in their group and desire a more flexible framework.

  Now, recalling Dawkins' original idea: memes are units of cultural transmission analogous to genes, but this analogy has evolved. I should outline theses from weak to strong. The trivial analogy is just descriptive and defensible. Functional equivalence is somewhat defensible but not strict. Strong reductionism claims identical mechanics and is false. The study buddy is probably smuggling in strong reductionism to exclude AI, as it emphasizes human-centric selection pressure.

  For each thesis, I'll assess defensibility and whether it rules out algorithmic replicators. LLM-generated content spreads virally without direct human copying, so if selection pressure comes from algorithms or user engagement, it's still replicating—just under different pressures. I need to argue that memes can adapt to non-human mechanisms without losing their essence.

  Structuring the response: one paragraph with bullet points. Aim for clarity and brevity. Word count: target under 200. Ensure I flag the smuggling at the end. Key points: trivial is defensible and inclusive; functional is defensible but with caveats; strong is false. Conclude that the buddy uses strong reductionism to exclude AI by demanding biological parallels.

  Finally, make sure my analysis empowers the user to challenge their group's narrow view and broaden the discussion on what counts as cultural evolution today.
answer: |-
  The slogan "memes are the genes of culture" hides distinct theses:

  *   **Trivial Analogy:** Memes are *like* genes in being replicators subject to variation/selection. **Defensible & inclusive.** It doesn't rule out algorithmic selection pressure on AI content, focusing only on replication dynamics.
  *   **Functional Equivalence:** Memes fulfill an *analogous* role in cultural inheritance as genes do in biological inheritance. **Largely defensible & inclusive.** Algorithmic replicators fit this role, provided they drive differential replication.
  *   **Strong Mechanistic Reduction:** Memetic replication *requires* the *exact* biological mechanics (e.g., direct human-to-human copying, selection via human minds/biology). **False.** This arbitrary restriction ignores non-human vectors and conflates mechanism with function. **This is likely what your study-buddy smuggles in to exclude AI "slop"** by demanding biological-style selection pressure, ignoring algorithmic/user-engagement as valid selection filters. Memetic theory describes replicators, not prescribing *how* replication must occur.
