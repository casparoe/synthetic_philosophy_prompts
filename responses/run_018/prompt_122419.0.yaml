  there's also this other thing nagging me: predictive processing gets talked about like it replaces the theater with hierarchical prediction errors, but that feels like it might just be the theater wearing a different hat — a distributed one, but still with a privileged 'now' where errors get resolved. so could you compare the Cartesian theater and the multiple drafts model specifically on three things: (1) who or what performs the binding/integration in each, (2) whether either genuinely eliminates the need for a privileged temporal frame, and (3) whether predictive processing is closer to one view or actually a third option? please keep it tight — max 300 words, and don't just list bullet points, i want to see which one actually pulls its weight explanatorily.
