answer: |-
  Here's a tight comparison focusing on your core questions:

  1.  **Binding/Integration:**
      *   **Cartesian Theater:** Requires a central, metaphorical "stage" or "screen" where disparate sensory inputs, memories, and thoughts are magically fused into a unified conscious experience for the "audience" (the homunculus). The *integrator* is the stage itself and the hidden homunculus watching it.
      *   **Multiple Drafts:** Binding isn't a centralized act. It's the *outcome* of parallel, distributed neural processes ("drafts") competing for influence. Coherence emerges from the *winning coalition* of processes at any given moment – a narrative constructed *post-hoc* by the system's own activity, not presented *to* anyone. There's no single "binder."

  2.  **Privileged Temporal Frame ("Now"):**
      *   **Cartesian Theater:** Absolutely requires a single, privileged "now" moment presented on the stage. This is its defining feature and fatal flaw – it necessitates a point where "it all comes together."
      *   **Multiple Drafts:** Explicitly **eliminates** a single "now." Different neural streams process information asynchronously. Temporal order is *computed* and incorporated into the winning narrative draft *after* the fact. There is no central temporal frame, only multiple timelines reconciled into a story.

  3.  **Predictive Processing (PP):**
      PP is **closer to Multiple Drafts** but adds crucial dynamics:
      *   **Binding/Integration:** Emerges hierarchically through continuous prediction error minimization. Lower levels predict sensory input; higher levels predict lower-level predictions. Integration is the *process* of minimizing discrepancies across the hierarchy – distributed, not central.
      *   **Temporal Frame:** While error minimization happens *now*, the hierarchy inherently deals with different temporal scales (lower=faster, higher=slower). There's no *single* "resolution moment." The "present" is the dynamic state of the entire hierarchy minimizing *current* prediction error, encompassing past predictions and future expectations simultaneously. It avoids a *Cartesian* "now" but involves a complex, distributed temporal dynamic.

  **Explanatory Weight:** The Cartesian Theater *hides* the problem ("curtain") by positing a magical site/stage/homunculus. Multiple Drafts genuinely **eliminates the need** for a central integrator or temporal frame by making consciousness the distributed, narrative *output* of competing processes. PP builds on this distributed view, replacing passive drafts with an active, hierarchical prediction engine, further dissolving the need for a central theater while offering a powerful mechanism for how integration and temporal coherence *might* arise dynamically. Dennett's model pulls more weight by dismantling the core illusion the Theater depends on.
