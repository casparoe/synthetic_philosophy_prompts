prompt: |-
  Imagine you are advising a philosopher with three years of postdoctoral funding who wants to determine what cross-cultural differences in folk morality—particularly the WEIRD-psychology finding that moral cognition varies systematically across industrialized and small-scale societies—actually imply for philosophical debates about moral objectivity. Do not survey the field; instead, identify and rank the three open conceptual questions at this intersection that deserve the bulk of that effort. For each, defend its position in the ordering by explaining: (a) why it is upstream of the others in the sense that resolving it would restructure how we approach them; (b) what form of progress—conceptual analysis, empirical collaboration without new fieldwork, or formal modeling—is tractable within three years; and (c) what specific result or argument would cause you to reorder them.

  Crucially, separate two dimensions of variation that are often conflated: differences in first-order moral content (e.g., the relative weight of care versus loyalty) and differences in meta-ethical stance (e.g., whether people treat moral norms as mind-independent truths or as relational obligations tied to social roles). Then apply a further distinction: domain-level objectivity, the claim that a well-defined moral domain admits of a single correct normative structure, versus token-level objectivity, the claim that particular judgments hold regardless of cultural or relational context. Which conceptual problems about how these two levels interact—especially in light of evidence that some non-WEIRD populations deploy universalist moral language within tightly bounded social matrices but withhold it across them—are genuinely unsettled, and which are artifacts of this conflation?

  In your prioritization, evaluate three candidate directions: refining philosophical accounts of objectivity to accommodate deep pluralism without collapsing into relativism; challenging whether WEIRD samples have distorted our very conception of what counts as moral disagreement; and constructing normative frameworks—such as contextualist or relational objectivity—that accommodate the observed pattern of locally universal but globally variable moral commitment. Which of these lines of work should come first, second, and third, given the criteria of upstream dependency, philosophical tractability, and downstream impact? Do not provide citations, reading lists, or bibliographic references. Your answer should be a defended research agenda, not a literature review.
reasoning: |-
  Okay, the user is asking me to advise a philosopher on prioritizing research about how cross-cultural differences in folk morality impact debates on moral objectivity. They've given very specific constraints: I need to identify and rank three open conceptual questions, explain why each is upstream, what progress is tractable in three years, and what would cause reordering. I must separate first-order content from meta-ethical stance, and domain-level from token-level objectivity.

  Hmm, this is a complex philosophical puzzle. The user clearly wants a structured research agenda, not a literature review. They're emphasizing avoiding conflation between different dimensions of moral variation. The WEIRD-psychology findings show industrialized societies differ systematically from small-scale ones in moral cognition - but what does that mean for whether morality is objective?

  First, I need to unpack those key distinctions they mentioned. First-order content is about what people think is right/wrong (e.g., prioritizing care vs loyalty). Meta-ethical stance is about how people view moral claims (as mind-independent truths or social conventions). Domain-level objectivity asks if there's one correct moral framework overall, while token-level asks if specific judgments apply universally.

  The user mentions an interesting pattern: some non-WEIRD groups use universalist language within their social group but not outside it. That's crucial - it suggests we might be misunderstanding what moral objectivity even means across cultures.

  Now for the three candidate directions they proposed:
  1. Refining objectivity accounts to handle deep pluralism without relativism
  2. Challenging if WEIRD samples distort what counts as moral disagreement
  3. Building contextualist/relational frameworks for local universality

  I need to rank these based on upstream dependency. What question, if answered, would fundamentally reshape the others? 

  I think #2 should come first. If WEIRD psychology has distorted our very concept of "moral disagreement," then any discussion of objectivity (#1) or frameworks (#3) is building on sand. For example, if non-WEIRD groups aren't actually disagreeing in the way philosophers assume, but rather operating in different moral frameworks entirely, that changes everything. Progress here seems tractable through conceptual analysis of existing ethnographies - no new fieldwork needed. If we found compelling evidence that all cultures share a core structure of moral reasoning despite surface differences, that might demote this question.

  Then #3 should be second. Once we understand what moral disagreement actually looks like cross-culturally, we can build frameworks that explain local universality (why people treat morals as absolute within their context). This is about constructing new philosophical models - contextual objectivity where validity is relational. Tractability: formal modeling of how context binds moral claims. If we discovered cultures that apply identical meta-ethical stances across contexts, it might make this less urgent.

  Finally #1 - refining objectivity itself. This depends on the previous two: without clarifying disagreement and frameworks, we can't coherently discuss pluralism vs relativism. Here progress would involve conceptual analysis of "objectivity" itself. But if we found cultures with irreconcilable meta-ethical commitments, this might jump to priority one.

  The ranking is 2>3>1 because:
  - You can't define objectivity (#1) before knowing what "disagreement" means (#2)
  - You can't build contextual frameworks (#3) without first unpacking cross-cultural disagreement (#2)
  - But #3 must precede #1 because new frameworks create the vocabulary for discussing pluralistic objectivity

  This structure ensures we fix foundational concepts first before attempting grand theories. The three-year scope means favoring analysis of existing data over new fieldwork. And crucially, it respects the user's demand to separate content/stance and domain/token levels - especially by tackling how locally universal commitments interact with domain structure in #3.
answer: |-
  Here is a prioritized research agenda addressing the core conceptual challenges, structured by upstream dependency, tractability, and reordering conditions. The ranking isolates how cross-cultural findings destabilize *philosophical* conceptions of objectivity—not merely documenting variation but forcing re-examination of what objectivity could mean.

  **Core Distinctions Honored:**  
  - **First-order vs. Meta-ethical:** Content (e.g., values prioritized) is separated from stance (e.g., mind-independence intuitions).  
  - **Domain vs. Token Objectivity:** Domain-level asks if morality *as a whole* has a unified structure; token-level asks if *specific judgments* (e.g., "keeping promises is obligatory") apply universally.  
  - **Critical Pattern:** Non-WEIRD groups treating morals as universal *within* a social matrix but not *across* matrices challenge both token-level universality and domain-level unity.  

  ---

  **Ranked Questions:**  
  **1. Does cross-cultural variation in *what counts as a moral domain* undermine the coherence of domain-level objectivity?**  
     - *(a) Upstream Justification:* Before asking if morality is objective, we must define "morality" cross-culturally. WEIRD psychology assumes "morality" is a discrete, transcontextual domain (e.g., distinct from conventions). But if non-WEIRD societies lack this domain boundary (e.g., blending moral, relational, and prudential obligations), then debates about "moral objectivity" presuppose a WEIRD construct. Resolving this restructures all downstream work: objectivity must be redefined if the domain itself is contested.  
     - *(b) Tractability:* **Conceptual analysis + empirical collaboration (no new fieldwork).** Reanalyze existing ethnographies/experiments to map: (i) where "moral" vs. "non-moral" boundaries are drawn; (ii) whether "mind-independence" intuitions track WEIRD-like domain structures. Output: A typology of moral-domain construals (e.g., role-bound vs. freestanding) and their meta-ethical correlates.  
     - *(c) Reordering Trigger:* If analysis reveals all cultures converge on a core, freestanding moral domain (despite content differences), this becomes downstream. Current evidence suggests otherwise.  

  **2. How do locally universal but contextually bounded commitments challenge token-level objectivity?**  
     - *(a) Upstream Justification:* Token objectivity assumes judgments (e.g., "murder is wrong") hold regardless of context. Non-WEIRD patterns (e.g., universalism within clans/tribes but not outsiders) force us to ask: Is this *relativism* or a *relational form of objectivity*? Resolving this is prerequisite for refining objectivity frameworks (#3 below), as it determines whether variation reflects error (undermining objectivity) or a structured alternative (requiring new models).  
     - *(b) Tractability:* **Formal modeling + conceptual analysis.** Develop game-theoretic or role-based models of "bounded universalism" to test if observed patterns reflect: (i) contextual parameters in moral truth-conditions (e.g., "obligatory for in-group"), or (ii) non-cognitive commitments (e.g., social identity reinforcement). Output: A formal account of when context-dependence preserves objectivity.  
     - *(c) Reordering Trigger:* If modeling shows bounded commitments reduce to non-moral factors (e.g., pragmatic self-interest), this becomes secondary to #1. If they reflect irreducible relational normativity, it ascends to top priority.  

  **3. Can pluralism in first-order content and meta-ethical stances be reconciled with domain-level objectivity without relativism?**  
     - *(a) Upstream Justification:* This depends on #1–2. If moral domains are non-universal (#1) and token objectivity is relational (#2), then traditional "domain-level objectivity" (a single normative structure) may be untenable. Instead, we must ask: Can a *meta-framework* (e.g., contextual objectivity) accommodate deep pluralism while avoiding "anything goes" relativism? This is downstream because it builds on redefined concepts from prior steps.  
     - *(b) Tractability:* **Conceptual analysis.** Test philosophical accounts (e.g., "objectivity as invariance under idealized roles") against the typology (#1) and models (#2). Output: Criteria for when pluralism preserves objectivity (e.g., shared second-order norms) vs. collapses into relativism.  
     - *(c) Reordering Trigger:* If #1 reveals a universal domain core *and* #2 shows token judgments are not relationally bound, this jumps to #1 as traditional objectivity defenses may hold.  

  ---

  **Why This Order?**  
  - **#1 is foundational:** You cannot debate objectivity for "morality" without knowing if the domain exists cross-culturally. WEIRD distortions here are catastrophic for the debate.  
  - **#2 is intermediately urgent:** Token-level patterns directly challenge philosophers’ intuitions about universality and require new tools to interpret.  
  - **#3 is synthesis:** It integrates #1–2 into a new theory of objectivity but cannot proceed without them.  

  **Re: Candidate Directions**  
  - "Challenging WEIRD moral disagreement" (#1 above) is **first**—it questions the domain’s universality.  
  - "Constructing contextual frameworks" (#2 above) is **second**—it explains token-level patterns.  
  - "Refining objectivity accounts" (#3 above) is **third**—it requires outputs from #1–2.  

  **Tractability Over 3 Years:** All leverage existing cross-cultural data. No new fieldwork is needed; progress hinges on reinterpreting evidence through sharper conceptual distinctions. This agenda targets philosophy’s blind spots—not cataloging variation but exposing how it forces reimagining objectivity itself.
