  The claim centers on whether rational choice is possible between genuinely incommensurable goods like ecological integrity and distributive justice through a second-order value like procedural fairness, rather than by weighing them on a common scale. I need to break this down into: (a) existence of genuine incommensurability, (b) whether it blocks direct rational comparison, (c) if orthogonal second-order values can resolve this without collapsing incommensurability, and (d) if procedural fairness is specifically that value rather than expected utility.

