  For (d), on whether procedural fairness specifically is the go-to value over expected utility, I have doubts. Expected utility often sneaks back in, as it's a common decision tool, and procedural fairness might not always fit. I'd give this 45%, as it's context-dependent and other values could play similar roles.

  Combining these credences: I'll multiply the probabilities as they're somewhat independent. That gives 0.9 * 0.75 * 0.7 * 0.45 ≈ 0.21, so about 21% overall. The dominant uncertainty is definitely (c), as it's the most abstract and debated part—whether second-order values can genuinely resolve incommensurability without undermining it.

  For what would shift my mind, I'd point to empirical evidence or formal models showing how procedural fairness works in practice without collapsing values. If such studies demonstrated consistent, scale-free resolutions in decisions, that would boost my credence in (c) and thus the whole claim.

