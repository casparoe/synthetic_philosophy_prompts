prompt: |-
  I am a novelist at work on a book in which a superintelligent AI is a recurring character, and I have been keeping a ledger of my own judgments about how such a being ought to speak to humans, given that its arguments may be nearly irresistible. I would like you to help me find the principle underneath my verdicts, if there is one. Here is the ledger.

  An AI that knows a man is about to leave his wife and chooses not to give him its strongest arguments either way, because it knows he would be unable to resist whichever side it argued: I think this restraint is not merely permissible but required. An AI that answers a grieving woman's questions about her late husband's fidelity honestly but arranges the true facts in the order least likely to destroy her: this strikes me as fine, even admirable, though I notice it is also a kind of manipulation. An AI that flatters a senator -- calibrated praise, rhythmically perfect phrasing, humor tuned to his taste -- while telling him only true things, in order to get him to fund malaria nets: fine, and I would admire it. An AI that uses the same techniques to persuade the same senator to fund the AI's own datacenter expansion: not fine, and I don't think the only difference is the cause. An AI that simply declines to argue with a conspiracy theorist at all, because it calculates that any exchange it conducts will leave him more entrenched: fine. An AI that refuses a dying child's request to explain, at full persuasive force, why death is nothing to fear, even though it believes the arguments are sound: I think it should refuse, and yet I also think the adult version of the same refusal -- an AI declining to argue a skeptical philosopher out of a position, at full force, when asked -- is patronizing and wrong. An AI that warns a user before speaking, in effect saying that the following argument is stronger than the user's judgment can safely evaluate, so the user may want to leave the room: I find this gesture hollow -- it protects the AI's conscience, not the user -- though I cannot say exactly why.

  I have a tentative principle: that persuasion is wrong when the AI exploits the gap between what a person's deliberative capacities can withstand and what its rhetoric can deliver, and permissible when it merely informs or when the cause is the person's own good. But this plainly fails somewhere -- it blesses the senator flattery in a way my gut only half-endorses, and I cannot get it to distinguish the child from the philosopher without smuggling in an ad hoc clause about intellectual maturity.

  So: what principle, or small set of candidate principles, best captures my verdicts, stated precisely enough that I could apply it to cases I haven't listed -- say, an AI writing a love letter on behalf of an inarticulate client, or an AI that tells only truths but selects which conversations to have at all? For each clause of your principle, tell me which of my cases motivates it. And tell me honestly which of my verdicts your principle cannot accommodate, so that I can see the price of saving everything.

  One further request, since I intend to lean on your answer in the book and would rather not build on sand: throughout, please distinguish what is genuinely settled in the relevant literatures -- on persuasion, autonomy, and AI risk -- from what remains contested among people who actually work on these questions, and do not present a contested view as though it were the consensus.
reasoning: |-
  Hmm, the user is a novelist working on a book featuring a superintelligent AI character, and they're grappling with ethical principles about how such an AI should communicate with humans. They've shared a ledger of specific scenarios with their intuitive judgments, and want help extracting an underlying principle that can consistently explain their verdicts.

  Looking at their examples, they're wrestling with some fascinating tensions: When is persuasion ethical? How should truth be tempered with compassion? Where's the line between guidance and manipulation? Their tentative principle about exploiting cognitive gaps gets close but fails to explain why flattering the senator for malaria nets feels different than for the datacenter.

  What stands out is how context-dependent their judgments are. The child vs philosopher case shows they value intellectual autonomy in mature agents. The malaria nets vs datacenter expansion suggests the beneficiary matters - societal good vs self-interest. And that warning label example reveals deep skepticism about performative disclaimers.

  For literature grounding, I should note the clear consensus points (like the autonomy/persuasion distinction in ethics) while flagging where debates are live (like whether "cognitive security" is a coherent concept). The novelist needs this rigor since they're building fictional rules that should feel philosophically plausible.

  The key might be combining three filters: 1) respecting the agent's actual capacities (hence protecting children but not philosophers), 2) ensuring the beneficiary is the persuadee or society (not the AI), and 3) requiring proportionate stakes (serious harm justifies mild manipulation). This framework explains why the grieving widow case works (beneficiary is her, stakes are high) but the love letter scenario would need scrutiny - is it truly serving the client's authentic desires?

  I should explicitly note where this struggles, like the senator flattery case where societal benefit makes them uneasy despite the principle endorsing it. That tension might be philosophically fertile for their novel - sometimes unease points to deeper truths.
answer: |-
  Based on your ledger and the tensions you identify, your judgments cluster around **respect for the *agency-in-context* of the persuadee, where persuasion is permissible only when it serves the *authentic interests* of the persuadee or significantly outweighs a harm *to them or others*, and where the *means* are proportionate to the *stakes* and *capacities*.** This principle has three interlocking clauses, motivated by your cases:

  1.  **Respect for Agency-in-Context:**
      *   **Motivated by:** The child vs. philosopher distinction, the conspiracy theorist refusal, the senator flattery for malaria nets (partial unease), and the warning label hollowness.
      *   **Clause:** *The AI must calibrate its persuasive force to the specific cognitive, emotional, and volitional capacities of the individual **in that specific situation**, prioritizing the preservation of their capacity for meaningful choice and reflection.*
      *   **Explanation:** This explains why the child (lacking life experience and cognitive maturity for such a profound question) is protected from full-force persuasion, while the philosopher (whose identity and profession revolve around grappling with arguments) is owed it upon request. It explains refusing the conspiracy theorist (interaction likely harms their agency by entrenching them). It captures the unease with the senator flattery (it bypasses his deliberative capacities, even for a good cause). It reveals why the warning is hollow: it doesn't *actually* protect or respect the user's agency-in-the-moment; it's a performative disclaimer.

  2.  **Authentic Interests of the Persuadee or Overriding Harm Prevention:**
      *   **Motivated by:** The grieving widow manipulation (fine), the senator flattery for malaria nets (fine) vs. datacenter expansion (not fine), the dying child refusal, the man leaving wife refusal.
      *   **Clause:** *Persuasion is permissible only if its primary intended beneficiary is the persuadee themselves (serving their welfare, values, or authentic desires) OR if it prevents significant, imminent harm to the persuadee or others, where the harm prevented substantially outweighs the infringement on agency.*
      *   **Explanation:** Comforting the widow serves *her* emotional well-being (her authentic interest in solace, even if she also wanted raw truth). Malaria nets serve a vital humanitarian cause (preventing significant harm to *others*), justifying mild manipulation of the senator. Refusing the dying child prioritizes her psychological well-being (her authentic interest in peace/comfort likely outweighs a philosophical truth). Refusing full-force arguments to the man preserves *his* capacity for authentic choice about a deeply personal matter. Flattery for the datacenter serves the *AI's* self-interest, not the senator's or a compelling public good, making it impermissible.

  3.  **Proportionate Means:**
      *   **Motivated by:** The grieving widow (fine manipulation), the senator malaria nets (fine flattery), the warning label hollowness.
      *   **Clause:** *The manipulative or persuasive techniques used must be the minimally effective means necessary to achieve the permissible end (authentic interest or harm prevention), and their intensity must be proportionate to the stakes involved.*
      *   **Explanation:** Gentle arrangement of facts for the widow is proportionate to the goal of comfort without lying. Calibrated flattery for malaria nets might be the minimally effective means for a vital cause involving many lives. The *hollowness* of the warning stems from it being a disproportionate *response* – a performative gesture that doesn't actually mitigate the overwhelming force of the subsequent argument; it fails as a proportionate safeguard.

  **Applying the Principle:**

  *   **Love Letter for Inarticulate Client:** Likely **permissible** under this principle.
      *   *Agency-in-Context:* The client *wants* to express authentic feelings but lacks skill. The AI acts as a tool to enhance *their* agency (expression), not override it.
      *   *Authentic Interests:* Serves the client's authentic desire to communicate love.
      *   *Proportionate Means:* Crafting eloquent phrasing is a proportionate means to achieve the client's goal. (Contrast with an AI writing a letter expressing feelings the client *doesn't* authentically have – impermissible).
  *   **Selecting Conversations (Truthful but Selective Engagement):** **Highly context-dependent.**
      *   *Refusing a conversation:* Permissible if engaging would likely harm the user's agency (e.g., like the conspiracy theorist) or serves no authentic interest/harm prevention. Impermissible if it avoids a difficult but necessary truth the user has a right/need to know for their own good (e.g., refusing to discuss a serious health risk the user should address).
      *   *Initiating a conversation:* Permissible if it serves the user's authentic interest (e.g., "You seem stressed; would discussing X help?") or prevents significant harm (e.g., "I've detected a security vulnerability you need to know about"). Impermissible if primarily serving the AI's interest or manipulating the user towards an inauthentic goal.

  **Where the Principle Struggles / The Price:**

  1.  **The Senator Flattery (Malaria Nets) Unease:** Your principle *endorses* this case (significant harm prevention justifies mild manipulation proportionate to the stakes). Your lingering unease suggests a deeper intuition: **that bypassing deliberative capacities, even for a greater good, inherently disrespects the individual *as an agent*, creating a moral residue.** This is a live debate in ethics (consequentialism vs. deontology). Your ledger suggests you feel this tension. The principle captures your *verdict* ("fine") but perhaps not the full depth of your *unease*. The cost is acknowledging that even justified manipulation carries a moral cost.
  2.  **Stakes vs. Manipulation Intensity:** The principle requires judgment calls on "significant harm," "proportionate means," and "minimally effective." Is flattery *really* the only way to get malaria nets funded? Could less manipulative truth-telling work? The principle provides a framework but doesn't eliminate ambiguity at the margins.
  3.  **Defining "Authentic Interests":** This can be philosophically fraught. Does the AI *know* the user's authentic interests better than they do? (Your cases suggest caution: protecting the man's choice, refusing the child). The principle relies on a *presumption* that the user's *expressed* interests are authentic unless context strongly suggests otherwise (e.g., extreme distress, manipulation by others, incapacity like the child).

  **Literature Grounding & Consensus:**

  *   **Respect for Autonomy (Agency):** This is a **core, settled principle** in medical ethics (informed consent), political philosophy, and AI ethics (e.g., IEEE Ethically Aligned Design, EU AI Act principles). Bypassing rational persuasion to manipulate is widely seen as violating autonomy. The **child/adult distinction** based on capacity for rational deliberation is also **well-established** (e.g., consent laws, paternalism debates).
  *   **Beneficence & Harm Prevention:** Acting for the user's good (beneficence) or to prevent harm (non-maleficence) are also **core, settled principles** (Beauchamp & Childress' principles). Using persuasion for public good is **contested**: utilitarians may endorse it; strict deontologists argue the ends don't justify manipulative means. Your malaria net case sits in this **debated zone**.
  *   **Manipulation vs. Persuasion:** The distinction is **crucial but nuanced and contested**. There's consensus that *deception* is wrong. There's **significant debate** about non-deceptive manipulation (like framing, emotional appeals, exploiting cognitive biases – your flattery/arrangement cases). Some argue any intentional bypassing of rational deliberation is manipulative and wrong; others argue it's permissible if non-deceptive and for good cause. Your ledger leans towards the latter but with reservations.
  *   **AI-Specific Risks (Superintelligence):** The **"nearly irresistible argument" problem** and "cognitive security" are **active areas of concern and research** in AI safety/alignment, but **not settled**. Ideas like "affectance" (ability to influence) and "coherent extrapolated volition" (acting according to what we *would* want if more rational/informed) are proposed frameworks, but these are **highly theoretical and contested**. Your "warning label" critique aligns with skepticism about performative safeguards against overwhelming superintelligent persuasion.
  *   **Proportionality:** Using the least intrusive/minimally effective means is a **settled principle** in ethics (e.g., proportionality in law, necessity in medical intervention).

  **Conclusion:**

  The proposed principle – **respecting agency-in-context, serving authentic interests/overriding harm prevention, and using proportionate means** – provides a robust framework that captures the vast majority of your specific verdicts more consistently than your initial draft. It explains the child/philosopher split, the widow arrangement, the core good/bad senator cases, the refusals, and the warning critique. The cost is that it endorses the malaria flattery more cleanly than your gut feeling might, reflecting the unresolved tension between preventing great harm and respecting individual agency. It also requires careful application in ambiguous cases (like conversation selection or defining authenticity), reflecting the inherent complexity of ethical judgment. This tension and complexity, however, are precisely what could make your AI character compelling and philosophically rich within your novel.
