answer: |-
  ### **Collective Rationality Seminar Game: The Peer-Review Dilemma**  
  *Setup for a 10-person, 75-minute session. Goal: Experience the discursive dilemma "in the wild" before naming it.*

  ---

  ### **Game Setup**  
  **Scenario:** You’re a peer-review board for an AI study. Must issue a **collective verdict** on:  
  - **A:** "The method is sound." (Yes/No)  
  - **B:** "Misuse risk is high." (Yes/No)  
  - **C:** "Approval needs safeguards." (Yes/No)  

  **Logical Constraint:** If A and B are both true, C **must** be true (A∧B→C). But C could be true/false independently if A or B is false.  

  **Roles:**  
  - **Chair (1 person):** Drafts the board’s public justification after each round.  
  - **Dissenters (2 people):** Designated "Defender of A" and "Defender of B" (assigned pre-game).  
  - **Others:** Regular board members.  

  **Ballots (Private & Consistent):**  
  - Each player gets a ballot with pre-filled votes (kept secret!). Ballots enforce consistency: If you vote YES on A and B, you MUST vote YES on C.  
  - **Ballot Distribution (for 10 players):**  
    - 3 players: A=Y, B=Y, C=Y  *(e.g., "Sound method + high risk → safeguards needed")*  
    - 3 players: A=Y, B=N, C=N  *(e.g., "Sound method, but low risk → no safeguards")*  
    - 3 players: A=N, B=Y, C=N  *(e.g., "Unsound method, so safeguards irrelevant")*  
    - 1 player: A=N, B=N, C=N  *(e.g., "No issues, no safeguards")*  

  ---

  ### **Game Rules (Two Rounds)**  
  **Round 1: Premise-Based Aggregation**  
  1. **Vote only on A and B (public hand count):**  
     - Chair calls votes: "All in favor of A?" → Count hands. Repeat for B.  
     - *Expected outcome:*  
       - A: 6 Yes (3Y/Y + 3Y/N), 4 No → **A ACCEPTED**  
       - B: 6 Yes (3Y/Y + 3N/Y), 4 No → **B ACCEPTED**  
  2. **Derive C mechanically:**  
     - Chair announces: "Since A and B are both accepted, C MUST be accepted (A∧B→C). Verdict: **C ACCEPTED**."  
  3. **Chair publishes justification:**  
     > *"The board finds the method sound (A) and misuse risk high (B). Therefore, safeguards are required (C)."*  

  **Round 2: Conclusion-Based Aggregation**  
  1. **Vote directly on C (public hand count):**  
     - Chair: "Forget Round 1. Vote ONLY on whether C is true."  
     - *Expected outcome:*  
       - C: 3 Yes (only the A=Y,B=Y group), 7 No → **C REJECTED**.  
  2. **Backtracking Rule:**  
     - Chair: "C is rejected, but this contradicts Round 1 (where A and B implied C). We must reject at least one premise to stay consistent!"  
     - Board votes on **which premise to reject** (A or B?):  
       - *Likely outcome:* Split vote or narrow majority (e.g., 6-4 to reject A, since Group 2 and 4 prefer rejecting A).  
  3. **Chair flips the justification:**  
     - Publishes NEW reasoning, e.g.:  
     > *"The board rejects safeguards (C). Given this, we no longer endorse A (method unsound). Misuse risk remains high (B)."*  
  4. **Dissenter Activation:**  
     - If A is rejected, "Defender of A" must argue briefly (1 min) why A should stand.  
     - If B is rejected, "Defender of B" argues.  

  ---

  ### **Debrief (Key Talking Points)**  
  **1. What Happened?**  
  - No one changed their mind—individual ballots were fixed. Yet the board’s "collective belief" flipped:  
    - **Round 1:** Premise-based → C accepted.  
    - **Round 2:** Conclusion-based → C rejected, forcing a premise to flip.  
  - **Discursive Dilemma (now name it!):** When groups vote on linked claims, the *order* and *method* of voting (premises vs. conclusions) can override individual consistency.  

  **2. Where Anonymity Broke:**  
  - **Public justifications** forced the board to lie! Round 1’s reasoning was invalidated by Round 2. The chair’s published logic was inconsistent, even though no *person* was inconsistent.  
  - Real-world analogs: Corporate statements, judicial rulings, or policy docs that "flip" without new evidence.  

  **3. What the Game *Can’t* Capture (Needs Lecture):**  
  - **Collective agency isn’t "real" here:** Players didn’t deliberate or form shared intentions—they just aggregated votes. In reality, groups *might* develop genuine collective beliefs through dialogue (e.g., juries).  
  - **Formal vs. Normative:**  
    - **Settled (formal):** It’s *impossible* to always aggregate votes on connected claims while preserving logic + majority will (the impossibility theorem).  
    - **Contested (normative):**  
      - Is premise-based voting fairer (respects reasons) or conclusion-based (respects outcomes)?  
      - Are "collective minds" real? Or just useful fictions? (e.g., does "Apple believes X" mean anything beyond its employees?).  

  **4. Why Block Simple Averaging?**  
  - If you’d averaged votes on C in Round 1 (3Y/7N), you’d get "reject C"—but mechanical derivation (A+B→C) overruled this. Premise-based voting "protects" logic but risks paternalism ("we know what’s best for you").  

  ---

  ### **Logistics**  
  - **Time:**  
    - Setup + Round 1: 20 mins  
    - Round 2 + Dissent: 20 mins  
    - Debrief: 35 mins (focus on the dilemma’s "ouch" moment).  
  - **No Tech Needed:** Ballots on paper slips, votes by hand count.  
  - **Pro Tip:** Assign roles randomly. Chair should be someone comfortable improvising justifications!  

  This game makes the dilemma *feel* visceral—players will grumble when the board’s "logic" flips. Then hit ’em with the theory. Good luck!
