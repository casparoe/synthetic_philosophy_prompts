prompt: |-
  Alright, I'm drafting a novel where a character is suspended in total darkness—no body-feel, no sound, just a bare 'I'm here'. It's riffing on Avicenna's flying man arguement, but I want your actual credence that the experiment proves the self is a substantial entity separate from the body, rather than just showing consciousness can persist without sensory input. Decompose it: (1) the probability that the phenomenological setup is coherent and not undermined by embodied cognition and behavioural neuroscience, (2) the probability that self-awareness without sensation entails substantial dualism rather than minimal functional self-reference, (3) the probability that Avicenna intended the argument for substantiality rather than for a more limited immateriality of the soul, and (4) whatever other factor you think belongs. Give me rough numbers, how they combine into an overall credence, and which term you'd shift most if pressed. Also, please seperate what's settled in Avicenna scholarship from what's genuinely contested—don't present a disputed reading as the consensus. There's probably a typo or two in my framing, but you get the gist.
