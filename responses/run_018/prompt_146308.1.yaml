answer: |-
  Your analysis is remarkably incisive—the impasse *is* rooted in fundamental divergences that go beyond empirical squabbles. Let's dissect the core issues and diagnose why progress stalls:

  ### The Core Divergences (Beyond Empirical Claims)
  1.  **Explanatory Targets & Definitions:**
      *   **GWT (Baars, Dehaene):** Explains *cognitive accessibility* (reportability, deliberative reasoning, voluntary action control). They **define** consciousness *as* this access. Their "neural correlates of consciousness" (NCC) are the neural mechanisms enabling global broadcasting (e.g., long-range feedback, ignition in fronto-parietal networks).
      *   **Separationists (Block, Lamme, Cohen & Dennett critics):** Aim to explain *phenomenology* – the intrinsic "what it's like" quality of experience, which they argue **exceeds** access. "Access Consciousness" (A-consciousness) is a downstream functional consequence of Phenomenal Consciousness (P-consciousness), not its definition.

  2.  **First-Person Authority & Data:**
      *   **GWT:** Privileges *third-person reportable data*. Introspective claims about unreportable richness (overflow) are seen as unreliable, potentially confounded by metacognitive errors, rapid forgetting, or post-hoc reconstruction. Data is what can be operationalized and measured behaviorally/neurally. Consciousness *is* what is reportable.
      *   **Separationists:** Grant significant (though not infallible) authority to *first-person perspective*. Arguments from overflow, inattentional blindness, etc., rely on intuitions about subjective richness *despite* lack of access. Denying this data is seen as dismissing the explanandum itself. For them, GWT explains access *instead of* phenomenology.

  3.  **The Nature of "Phenomenal Consciousness" & Natural Kinds:**
      *   **GWT (Implicitly):** Treats "consciousness" as a functional/computational *kind* – the state of being globally available. It's a natural kind defined by its causal role in the cognitive architecture.
      *   **Separationists:** Treat phenomenology as a distinct *phenomenal property* or set of properties, potentially *non-functional* or only partially realized by functional states (Block's "Harder Problem"). The worry is that GWT misses this essence entirely. Is "phenomenal consciousness" a single natural kind? Separationists often treat it as such, while GWT might see it as an amalgam of access states.

  4.  **Shared Representationalist Assumption (The Hidden Cage):**
      *   **Your suspicion is crucial:** Both sides overwhelmingly operate within a *representationalist* framework. They debate *which representations* are conscious (all globally broadcast ones vs. a subset including unbroadcast sensory ones), but rarely question whether consciousness *is* fundamentally a property of representational content.
      *   **Consequence:** The debate fixates on the *scope* of access (broadcasting) while taking the representational nature for granted. This blinds them to alternative views (e.g., sensorimotor enactivism, pure quality-space views, non-representational phenomenology) that might dissolve or radically reframe the issue.

  ### Why the Stalemate? It's Substantive *and* Verbal
  *   **Substantive:** They genuinely disagree on the *explanandum* (access vs. phenomenology) and the *epistemic status of introspection*. This leads to different interpretations of *the same data*:
      *   **Overflow:** GWT sees working memory/attentional limits preventing report of *non-conscious* sensory buffers. Separationists see evidence of *conscious* content exceeding access.
      *   **Inattentional Blindness/Change Blindness:** GWT sees failure of access/ignition. Separationists see phenomenology present but unattended/not accessed.
  *   **Verbal:** They use "consciousness" differently. GWT uses it synonymously with "global access." Separationists use it primarily for "phenomenal feel." This creates the illusion of disagreement over facts when often it's about definitions. GWT claims to explain consciousness (access), Separationists retort "But you haven't explained *this* (phenomenology)!"

  ### Challenging Your Framing (Slightly)
  1.  **GWT isn't *Purely* Functionalist (Anymore):** Modern GWT (especially Dehaene's) is heavily neural. "Ignition" is a specific neurodynamic process. The debate often centers on whether *those specific neural processes* are necessary/sufficient for phenomenology or just for access/report.
  2.  **Overflow Arguments are Under Siege:** Critiques (e.g., by Dennett, Cohen, Lau, others) argue overflow is an illusion:
      *   Post-perceptual confabulation.
      *   High-confidence guesses misreported as experience.
      *   Partial/abstract/gist-level access mistaken for rich detail.
      *   Probabilistic representations giving an *impression* of richness that isn't actually present in a determinate format.
      *   **This *is* a battleground.** Separationists (Block, Lamme, Tsuchiya, others) counter with refined experiments (e.g., no-report paradigms, iconic memory probes, continuous report) aiming to demonstrate genuine unreportable richness. **The empirical jury is still out, fueling the stalemate.**

  ### What Progress Would Look Like
  Breaking the impasse requires forcing a confrontation on the underlying divergences:

  1.  **Resolving the Overflow Debate Decisively:**
      *   **The Holy Grail Experiment:** A paradigm that *independently* quantifies subjective richness *without requiring access/report* AND measures neural activity with high spatiotemporal resolution. If neural signatures of sensory processing (e.g., in V1-V4) show decodable richness correlating with reported subjective richness *while access signatures (e.g., P3b, fronto-parietal activation) are absent or minimal*, separationists win. If richness only decodes when access signatures are present, GWT wins. No-report paradigms + neural decoding + refined subjective measures (e.g., confidence, qualitative reports *after* the inaccessible period) are the frontier here.
      *   **Information-Theoretic Formalization:** Precisely modeling the "graded broadcasting vs. all-or-none access" distinction. Can neural data show information in sensory areas is integrated/read out *gradually*, or is ignition truly discrete? Does subjective presence correlate with a specific threshold of integrated information (Φ) within a module, or only with broadcast to the global workspace? Formalizing "overflow" quantitively is key.

  2.  **Challenging the Representationalist Consensus:**
      *   Progress might come from *outside* this debate. Theories that successfully explain aspects of phenomenology *without* relying on representational content (e.g., some predictive processing accounts focusing on precision weighting/prediction error, sensorimotor theories, dynamical systems approaches) could reframe the entire question. If consciousness is fundamentally an active process of "world engagement" rather than passive representation, both GWT and separationism might miss the mark.

  3.  **Abandoning the Unitary View:**
      *   **Your final suggestion is potent:** Treating "phenomenal consciousness" as a single, unified phenomenon might be the core mistake. Progress could involve:
          *   **Fragmenting the explanandum:** Distinguishing types of phenomenology (e.g., sensory qualia, affective valence, agentive presence) and asking if each has different neural/functional correlates. Maybe some *are* co-extensive with access, others aren't.
          *   **Gradedness vs. Dichotomy:** Rejecting the rigid P-consciousness/A-consciousness dichotomy for a multi-dimensional or graded view of availability, richness, and subjective presence. GWT might capture the "high availability" end, while other mechanisms support "low availability" phenomenology.

  4.  **Adversarial Collaboration:** Teams from both camps pre-registering experiments designed to test *specific, mutually agreed* critical predictions derived from each theory, using neutral methodologies.

  **Conclusion:** The stalemate persists because the debate operates on two levels: an empirical dispute about overflow (where critiques have force but decisive evidence is elusive) and a deeper philosophical rift about the *target* of explanation (access vs. phenomenology), the *data* (third-person report vs. first-person perspective), and the *nature* of the phenomenon (functional vs. phenomenal kind). Progress requires either 1) an empirical result so clear it forces one side to concede on the overflow issue *and* its implications for the deeper rift, or 2) a significant theoretical shift that reframes the question, such as abandoning strict representationalism or the unitary view of phenomenology. Currently, both sides are entrenched, interpreting ambiguous data through incompatible lenses.
