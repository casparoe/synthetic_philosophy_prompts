answer: |-
  ### Reconstruction of the implicit stance-theory  
  The institutional asymmetry reflects a deep-seated commitment to **phenomenal and functional irreducibility** in mental disorders. Depression is treated as a *real pattern* that emerges only when observing the system through Dennett's **intentional stance** (patient-reported beliefs, desires, suffering) or **design stance** (disrupted neurocognitive functions shaped by evolution). While physical-stance data (cytokines, fMRI scans) may correlate with depression, the practice presupposes these alone cannot capture the disorder’s essence. This implies three core principles:  

  1.  **Constitutive Role of Subjectivity:** Depression is not merely a biochemical state but a *lived experience* defined by alterations in consciousness (e.g., hopelessness, anhedonia). A cytokine profile doesn’t constitute depression unless it *realizes* this subjective state.  
  2.  **Functional-Causal Salience:** Mental disorders are disruptions in evolved cognitive/affective functions. Identifying depression requires showing how physical changes *cause* dysfunctional information processing (e.g., biased memory, impaired reward signaling), visible only at the design/intentional level.  
  3.  **Multiple Realizability & Pattern Robustness:** The physical substrate of depression (e.g., specific cytokines, neural circuits) is highly variable across individuals and contexts. The "real pattern" of depression remains stable across these physical variations only when described functionally ("impaired mood regulation") or phenomenologically ("persistent sadness"). Physical-stance markers alone lack this robustness.  

  Thus, the practice assumes mental disorders are **higher-order emergent patterns**: physically instantiated but ontologically dependent on their functional/phenomenal properties. Rejecting a purely physical-stance account isn’t dualism but a claim that *identifying the pattern as depression* requires intentional/design vocabulary. The physical stance reveals mechanisms, not the disorder qua mental disorder.  

  ---

  ### Strict presuppositions versus compatible theories  
  **Strict Presuppositions (What the Practice Requires):**  
  1.  **Non-Eliminativism:** Mental disorders cannot be fully defined or identified solely via physical-stance parameters. Biomarkers alone are insufficient for diagnosis or defining the research object.  
  2.  **Explanatory Pluralism Necessity:** A complete account of mental disorders *must* incorporate design-stance (dysfunction) or intentional-stance (experience) explanations alongside physical-stance mechanisms.  
  3.  **Phenomenal/Functional Primacy:** The core "what-it-is" of depression is its subjective feel or dysfunctional cognitive role—not its physical realization.  

  **Compatible Theories (What the Practice Accommodates):**  
  1.  **Non-Reductive Physicalism:** The practice aligns with the view that mental states supervene on physical states but aren’t reducible to them. Physical correlates are necessary but insufficient for capturing the disorder’s essence.  
  2.  **Weak Emergence:** Depression arises from complex neural processes, but its patterns are only tractable/mappable at higher levels of description.  
  3.  **Teleosemantic Theories:** Mental disorders are malfunctions in biologically designed systems, making evolutionary context (design stance) indispensable.  
  4.  **Epistemic Limitation Arguments:** While physicalism may be true, human cognitive limitations necessitate higher-level stances to detect mental disorder patterns.  

  The practice *excludes* eliminative materialism (denying mental states exist) and strict reductionism (claiming depression *is* just a cytokine profile). It permits, but does not require, property dualism.  

  ---

  ### Assessment of the mental-metabolic asymmetry  
  The asymmetry is **largely philosophically justified but risks institutional overreach**.  

  **Justifications:**  
  - **Consciousness Boundary:** Metabolic disorders lack intrinsic subjectivity. Hypertension doesn’t "feel" like anything; depression does. This qualitative difference warrants distinct epistemic approaches.  
  - **Functional Complexity:** Mental disorders involve disruptions in meaning-processing systems (beliefs, emotions). While diabetes disrupts a mechanical homeostasis, depression disrupts agent-environment interactions best described intentionally.  
  - **Causal Explanatory Gaps:** Purely physical accounts of depression struggle to explain why specific neural events *are* pathological without referencing evolutionary design (e.g., normal grief vs. pathological depression) or subjective harm.  

  **Risks and Problems:**  
  - **Boundary Fuzziness:** Disorders like chronic pain or epilepsy blur the line, challenging rigid distinctions.  
  - **Institutional Inertia:** Over-reliance on phenomenology can hinder biomarker research, potentially pathologizing normal distress or missing somatic subtypes.  
  - **Cartesian Hangover:** The asymmetry might unintentionally reinforce dualist intuitions, undervaluing embodied/network models of mind.  

  Overall, the asymmetry reflects a defensible ontological distinction (phenomenality/teleology) rather than mere habit, but risks becoming dogmatic if applied inflexibly.  

  ---

  ### Consequences of a symmetric physical-stance framework  
  Adopting a symmetric framework—diagnosing/researching depression solely via biomarkers—would entail:  

  **Changes to Practice:**  
  1.  **Diagnostic Criteria:** Depression becomes a cluster of measurable biomarkers (e.g., cytokine levels, HPA axis activity). Subjective reports are downgraded to optional symptoms, not criteria.  
  2.  **Research Funding:** Proposals studying cytokine-depression correlations *without* functional or experiential links become valid. Grants focus on identifying "depression signatures" in blood/tissue.  
  3.  **Clinical Validation:** Biomarker tests replace clinical interviews as the diagnostic gold standard. "Asymptomatic biomarker-positive" cases might be treated preemptively.  

  **Conceptual Coherence & Risks:**  
  - **Coherence Possible but Reductive:** A physicalist could argue this framework is coherent *if* we redefine depression as a *biological syndrome* (like "hypertension") rather than a mental state.  
  - **Dissolution of the Phenomenon:** This framework dissolves depression *as a mental disorder*. What we now call "depression" would split into:  
    - A *biological condition* (e.g., "inflammatory affective syndrome"), decoupled from lived experience.  
    - Subjective distress lacking biomarkers, possibly reclassified as "non-pathological" or "non-biological mood state".  
  - **Conceptual Confusion:** It fails to explain why we care about these biomarkers *in humans*: their significance derives entirely from their connection to suffering and dysfunction. Severing that link makes "depression" an arbitrary physiological category.  

  Thus, while logically possible, symmetry eliminates the intentional/design features that make mental disorders distinct objects of clinical concern. The practice risks conflating *correlates* with the *disorder itself*, undermining treatment relevance and ethical justification for intervention.
