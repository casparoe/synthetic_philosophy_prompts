  Let me break this down. First, I need to establish the characters: C for counterfactual theory (Lewis-Stalnaker) and I for interventionist (Woodward-Pearl). They're colleagues who respect each other but won't back down. The dialogue must cover:
  - The constraint-shadowed nature of p_A (can't manipulate it independently)
  - How each theory handles the p_A/p_B symmetry
  - The pinned piston test case where verdicts flip
  - Real concessions from both sides
