  The numbers matter - 3.12 bar vs 3.0 bar threshold, n_A fixed at 0.20 mol, etc. I should calculate some values to make the physics precise. When pinned, volumes are fixed so pressures differ - that'll be crucial for I's argument.

  For the debate structure:
  Opening: State positions clearly using apparatus
  Middle: Attack each other's weaknesses (C's "miracles" as covert interventions, I's model-dependence)
