prompt: |-
  I write about science and ideas for a general audience, and now I'm stuck running a 40-min workshop for philosophy grad students who aced probability but never did metaphysics. I want them to really get the Principal Principle — the part where you defer to objective chance — but especially the undermining-futures tension, not just memorise the slogan. Dont explain the concept to me; plan the teaching arc. What's the dependency chain: what idea must be solid before 'objective chance' can even appear (epistemic vs physical prob, but correct my ordering), and what comes immediately after so the deference step doesnt feel circular? Then pick the one carrying case — I'm leaning on a quantum-branching setup where an agent knows the Hamiltonian and wavefunction but has pure indexical uncertainty about which branch she's in. Tell me exactly what properties that scenario needs (no hidden variables, no smuggled priors?) and what it must lack to actually do philosophical work. Next, map the misconceptions they'll form in sequence: first 'chance is just ignorance', then 'the principle is circular against determinists', then the self-undermining worry. Say precisely where in the flow each one should be cut off. Also, what should I openly refuse to cover here and say so — probably the full derivation with history-space partitions? And design the closing check: one specific task or question that shows they've grasped the deference relation, not just parroted Lewis. No reading lists, please. End with a single line that starts 'Bottom line:' summarizing the core pedagogical move.
reasoning: |-
  We are designing a 40-minute workshop for philosophy grad students who are strong in probability but new to metaphysics. The goal is to have them grasp the Principal Principle (PP), especially the deference to objective chance and the undermining futures problem. We don't want to explain the concept but plan the teaching arc.

  ### Step 1: Dependency Chain
  The key ideas must be built in a logical order. We start with what they know (probability) and then introduce the metaphysical distinction.

  1. **Epistemic Probability (Subjective/Bayesian)**: They know this. Start by reviewing that this is about degrees of belief given evidence. Emphasize that it's agent-relative and can vary with information.

  2. **Physical Probability (Objective Chance)**: Introduce this as a new concept. It's not about what we know, but about the world's tendencies. It must be:
     - Objective: independent of our knowledge.
     - Governed by laws: chance as a law-governed feature of the world.
     - Empirical: we learn about it through evidence.

     **Bridge**: How do we connect our beliefs (epistemic) to objective chance? We need a principle that tells us how to set our credences when we know the chances.

  3. **The Principal Principle (PP)**: Present it as the bridge: if an agent knows that the chance of event A is x, then (absent any other information) the agent's credence in A should be x.

     But note: PP is not a definition of chance. It's a normative principle about rational deference.

  ### Step 2: The Quantum-Branching Scenario
  We choose a quantum-branching setup (Everettian) to illustrate. The scenario:

  - An agent knows the entire wave function of the universe and the Hamiltonian (so she knows the dynamics). The universe is about to undergo a quantum measurement that will branch into multiple worlds.
  - The agent has pure indexical uncertainty: she knows she will be in one branch but doesn't know which one. The branches have amplitudes (which we treat as giving objective chances).

  **Properties the scenario must have:**
  - **No hidden variables**: The wave function is complete (Everett interpretation). This ensures that the uncertainty is purely indexical and not due to lack of physical information.
  - **Objective chances from the wave function**: The chances (branch weights) are given by the Born rule, which we take as objective. The agent knows these chances.
  - **No smuggled priors**: The agent's initial credence is not based on any prior about which branch she might be in; instead, we set it by PP.

  **What it must lack to do philosophical work:**
  - Avoid any determinism: In a deterministic world (even if branching), the future is fixed by the wave function, but the agent doesn't know her indexical position. This is key to having objective chances without undermining.

  ### Step 3: Teaching Arc (40 minutes)

  **Part 1: Setting the Stage (10 minutes)**
  - Review epistemic probability: ask them to recall how they update beliefs with evidence (Bayes). Emphasize that this is about knowledge.
  - Introduce physical probability (objective chance): as a feature of the world. Use examples: radioactive decay, quantum experiments. Stress that it's not about ignorance but a fundamental feature.

  **Part 2: The Principal Principle (10 minutes)**
  - State PP: If you know that the chance of A is x, then set your credence in A to x (unless you have inadmissible information).
  - Use the quantum scenario: 
     - The wave function will branch into two branches with amplitudes (hence chances) |α|^2 and |β|^2.
     - The agent knows these chances. What should her credence be that she ends up in a particular branch? PP says: |α|^2.

  **Part 3: Undermining Futures (15 minutes)**
  - **The problem**: In some metaphysical views (e.g., Humean), the chance facts are determined by the entire history. But then, a future outcome that is very improbable might still happen and thereby change the chance facts. This creates a tension: the chance of a future that undermines the chance theory itself.
  - **In our quantum scenario**: We avoid this because the chance is fixed by the wave function and the dynamics (which are given and not determined by the future). But we can still illustrate the worry by considering a hypothetical:
     - Suppose the agent considers a future in which, by some weird quantum event, the wave function is altered in a way that changes the Born rule. But in our setup, the wave function and Hamiltonian are fixed, so this doesn't happen. However, we can note that in a Humean account, the entire pattern of events might determine the chances, so a future that is improbable might change what the chances are.

  **Part 4: Cutting Off Misconceptions (throughout)**
  1. **'Chance is just ignorance'**: Cut this off immediately when introducing objective chance. Use the quantum case: the agent knows the entire wave function and dynamics, so there's no ignorance about the physical state. The uncertainty is indexical (which branch am I in?), but the chance is objective and not reducible to ignorance.

  2. **'PP is circular against determinists'**: Address when introducing PP. In a deterministic world (without branching), there are no non-trivial chances. But in our quantum scenario, we have branching and genuine chance. So PP applies. For deterministic cases, we don't have objective chances (except 0 or 1) so PP doesn't apply trivially.

  3. **Self-undermining worry**: When discussing undermining futures, emphasize that in the quantum case we avoid it because the chance is fixed by the wave function and the dynamics, which are not determined by the future. But in Humeanism, the worry is real. We can note that the PP as originally stated by Lewis might run into this problem, leading to the New Principle.

  **Part 5: What to Refuse to Cover**
  - **History-space partitions**: We won't go into the full formal derivation of PP that involves partitions over entire histories. That's too technical for a 40-minute workshop and not necessary for the core idea.
  - **The New Principle**: We might mention that the undermining problem led to a modified principle (the New Principle) but we won't derive it. We focus on the original PP and the tension.

  **Part 6: Closing Check (5 minutes)**
  - **Task**: Pose a scenario: 
     - "In the quantum branching setup, suppose the wave function is such that there are three branches with amplitudes (and hence chances) 1/2, 1/3, and 1/6. What should the agent's credence be that she is in the first branch? Why? What if she learns that she is not in the third branch? How does she update?"
     - They should answer: 
        - Initially: credence 1/2 for the first branch (by PP).
        - After learning not the third, she updates by conditionalizing: the remaining branches have original chances 1/2 and 1/3, which are now renormalized to 3/5 and 2/5. So credence in first becomes 3/5.
     - Why? Because PP sets the initial credence to the chance, and then updating is by Bayes.

  **Bottom line:** The core pedagogical move is to anchor objective chance in a non-Humean quantum example to avoid conflation with epistemic probability and to preempt undermining worries, then demonstrate deference via indexical uncertainty in branching.
answer: |-
  ### Teaching Arc for the Principal Principle Workshop

  **Dependency Chain (10 mins)**  
  1. **Epistemic Probability Recap (3 mins)**:  
     - Start with a quick poll: *"If you know a coin is fair, what’s your credence in heads?"* Establish consensus: **credence = 0.5**.  
     - Clarify: This is *subjective* probability—**degrees of belief based on evidence**. No metaphysics here.  

  2. **Introduce Physical Probability (3 mins)**:  
     - Contrast: *"What if the coin has unknown quantum biases? Your belief is 0.5, but the world has a *tendency*—an objective fact about how it behaves."*  
     - Define **objective chance**: A *mind-independent, law-governed feature* of the world (e.g., quantum probabilities, radioactive decay rates). Stress: **Not reducible to ignorance**.  

  3. **The Deference Intuition (4 mins)**:  
     - Pose: *"If you learn the objective chance of heads is 0.7, what should your credence be?"* Elicit agreement: **0.7**.  
     - Label this: The **Principal Principle (PP)**—rational agents *defer* to objective chance.  
     - Key nuance: PP isn’t circular—it’s a *normative bridge* between physical facts and rational belief.  

  ---

  **Core Case: Quantum Branching Scenario (15 mins)**  
  *Setup*: An agent knows the universe’s wavefunction and Hamiltonian. A measurement creates two branches:  
  - Branch A (chance = |α|² = 0.6)  
  - Branch B (chance = |β|² = 0.4)  
  Agent has pure *indexical uncertainty*: "I know I’ll be in one branch, but not which."  

  ***Required Properties***:  
  - **No hidden variables**: Wavefunction is complete (Everettian interpretation).  
  - **No smuggled priors**: Agent’s initial credence derives *only* from PP—no pre-existing beliefs about "self-location."  
  - **Objective chances from dynamics**: Chances arise from the Hamiltonian (Born rule), fixed *prior* to branching.  

  ***What It Must Lack***:  
  - **No future-dependent chances**: Chances aren’t defined by future outcomes (avoids trivializing undermining).  
  - **No non-indexical uncertainty**: All physical facts are known—only "which branch am I in?" is unknown.  

  ***How to Run It***:  
  1. *Map PP to the scenario*:  
     - "Knowing chance of Branch A is 0.6 → credence = 0.6."  
     - *Check*: Ask students why this isn’t just ignorance. *Correct answer*: Ignorance would imply missing physical info; here, all physics is known.  
  2. *Add a twist*: Suppose the agent learns Branch B has a machine that alters the wavefunction.  
     - *Undermining preview*: "Does this threaten the chance of 0.4? Not yet—but in Humean views, it might..."  

  ---

  **Misconception Chain & Preemptive Cuts (12 mins)**  
  1. **"Chance = Ignorance"**:  
     - *When*: During the quantum case setup.  
     - *Cut-off*: Hammer that the agent knows *all* physical facts (wavefunction, laws). Uncertainty is *indexical*, not physical. Ask: *"Is there any fact about the world she doesn’t know?"* → No.  

  2. **"PP is Circular Against Determinists"**:  
     - *When*: After stating PP.  
     - *Cut-off*: Point to quantum case: **Determinism is irrelevant here**—branching is indeterministic. PP applies where chances exist. Snip: *"PP doesn’t assume non-determinism; it defines deference *if* chances exist."*  

  3. **Self-Undermining Worry**:  
     - *When*: After establishing deference in the quantum case.  
     - *Cut-off*: Contrast with Humeanism: *"In our scenario, chances are fixed by *current* laws/wavefunction—they can’t be ‘undermined’ by future events. But for Humeans, chances depend on the *entire future*—that’s where tension arises."* Briefly note this motivates the "New Principle" but **STOP** there.  

  ---

  **What to Refuse to Cover**  
  - **Openly state**: *"We won’t derive PP from history partitions or tackle Humean supervenience—that’s for advanced seminars. Focus today: the deference intuition and why undermining matters."*  
  - **Ignore**: Full formal proofs, New Principle details, non-Everettian interpretations.  

  **Closing Check (3 mins)**  
  - ***Task***: *"Suppose the wavefunction splits into three branches with chances 0.5, 0.3, and 0.2. What’s your credence you’re in the first branch? If you learn you’re not in the third, what’s your updated credence for the first?"*  
    - **Correct grasp**:  
      - Initial credence = 0.5 (deference to chance).  
      - After update: Credence = 0.5 / (0.5 + 0.3) = 0.625 (conditional probability *without* recalculating chances—shows deference is fixed at t=0).  
  - Why it works: Tests if they see chance as "fixed input" for priors, not recalculated post-update.  

  ---

  **Bottom line:** Anchor objective chance in a *non-Humean, physics-first* model (quantum branching) to isolate deference from metaphysical baggage, then use indexical uncertainty to make PP vivid and preempt reductionism.
