answer: |-
  ### Final Exam Essay Question:  
  **"Nozick’s entitlement theory justifies holdings solely through just acquisition, just transfer, and rectification of injustice. Apply these principles to the ‘cascade entitlement’ scenario: Wilt Chamberlain earns voluntary micropayments for performances, then acquires proprietary rights to training licenses and derivative-performance royalties. These rights are inherited across generations, creating a class of passive rentiers who collect income without labor—though every acquisition and transfer in the chain satisfied justice in acquisition and transfer.  
  (a) Does this outcome violate any of Nozick’s three principles? Explain precisely where the cascade succeeds or fails under his framework.  
  (b) Could rectification apply here? If so, how?  
  (c) Is Nozick’s *rejection* of the Lockean proviso essential to allowing this cascade?  
  (d) Evaluate what this reveals about the conflict between historical entitlement theories and patterned principles of distributive justice."**

  ---

  ### Model Answer (Approx. 700 words)  

  #### (a) Application of Nozick’s Principles (5 pts)  
  Nozick’s entitlement theory holds that holdings are just if they arise from (1) just initial acquisition, (2) voluntary transfer, or (3) rectification of past injustices. In the cascade, Chamberlain’s initial earnings stem from fans’ voluntary payments (*just transfer*). His acquisition of licensing/derivative rights (e.g., via contracts or intellectual property creation) constitutes *just acquisition* if it leaves "enough and as good" for others—a proviso Nozick later weakens. Subsequent transfers through inheritance or sale are *just transfers* if consensual. Crucially, **no principle is violated**: passive rentiers inherit rights via voluntary bequests (transfer), and no labor or ongoing contribution is required. The cascade thus *succeeds* under Nozick’s framework, exposing how his theory permits dynastic inequality without exploitation.  

  > *Typical Mistake:* Vaguely asserting the cascade is "unjust" without dissecting each principle.  

  #### (b) Rectification (4 pts)  
  Rectification applies *only* if historical injustice (e.g., theft, fraud) corrupted the chain. Here, all transactions are stipulated as just. **Rectification cannot apply** because the rentier class’s holdings derive from unbroken voluntary transfers. Nozick’s theory lacks a mechanism to correct structural inequalities emerging from "clean" histories. Even if the outcome resembles feudal privilege, rectification targets specific wrongs—not systemic outcomes of repeated just exchanges.  

  > *Typical Mistake:* Proposing rectification to "redistribute" based on outcome inequality rather than identifying a *specific injustice*.  

  #### (c) Lockean Proviso (4 pts)  
  **Yes, rejecting the proviso is essential**. Locke’s proviso requires that appropriation not worsen others’ baseline opportunities. Nozick dilutes this to prohibit only *catastrophic* worsening (e.g., monopolizing water in a desert). In the cascade, Chamberlain’s acquisition of exclusive licenses could violate Locke’s strict proviso by restricting others’ ability to perform similar labor (e.g., trainers needing his license). But under Nozick’s weak proviso, as long as fans *voluntarily* enabled his monopoly (via payments), and no one is *absolutely deprived*, the cascade stands. Without this rejection, the license acquisitions might fail *just acquisition*, halting the cascade.  

  > *Typical Mistake:* Equating the proviso with general fairness rather than Nozick’s specific (minimal) formulation.  

  #### (d) Historical vs. Patterned Justice (4 pts)  
  The cascade epitomizes the **irreconcilable conflict** between historical and patterned theories. Patterned principles (e.g., Rawls’ difference principle) would condemn the rentier class for violating distributive fairness: wealth detached from labor or merit. Yet Nozick argues that enforcing patterns (e.g., taxing inheritance to preserve equality) violates liberty by voiding past voluntary acts. The cascade proves that *historically just processes can generate "unpatterned" outcomes resembling structural injustice*. This forces a dilemma: either accept dynastic rentiers as legitimate (prioritizing liberty/history) or intervene to disrupt the pattern (prioritizing equality), violating Nozick’s "side constraints" on individual rights.  

  > *Typical Mistake:* Merely stating that conflict exists without showing *how* the cascade forces a choice between liberty and equality.  

  #### Conclusion  
  The cascade scenario validates Nozick’s theory internally but exposes its vulnerability to critiques of intergenerational equity. By severing justice from ongoing contribution and rejecting the Lockean proviso, Nozick permits passive entitlement cascades that patterned theories deem exploitative. This highlights a core tension: historical principles protect individual autonomy but risk legitimizing aristocracy; patterned principles ensure distributive fairness but risk perpetual intervention. The cascade thus becomes a litmus test for one’s foundational commitment: liberty or equality.  

  ---

  ### Marking Scheme (Total: 20 points)  

  | **Criteria**                          | **Points** | **Common Mistake** |  
  |---------------------------------------|------------|--------------------|  
  | **Accurate deployment of Nozick’s three principles** <br> (Clarity on how acquisition, transfer, and rectification apply/don’t apply to each cascade stage) | 5 | Fails to trace the cascade step-by-step or misapplies rectification. |  
  | **Analysis of Lockean proviso** <br> (Correctly identifies Nozick’s rejection as essential; contrasts Locke/Nozick on worsening) | 4 | Confuses the proviso with general egalitarianism or ignores Nozick’s "catastrophe" threshold. |  
  | **Historical vs. patterned justice tension** <br> (Articulates how cascade forces choice between respecting history/outcomes) | 4 | Describes conflict superficially without linking to cascade mechanics. |  
  | **Rectification application** <br> (Recognizes no basis for rectification in clean histories; avoids ad hoc redistribution) | 4 | Proposes rectification to "correct" inequality absent injustice. |  
  | **Argumentative clarity/precision** <br> (Structure, concision, terminology, logical flow) | 3 | Unfocused digressions; imprecise use of "justice," "entitlement," or "voluntary." |  

  ---

  ### Exam Design Notes:  
  - **Time Allocation:** 45 minutes (5 min planning, 35 min writing, 5 min review).  
  - **Expected Response:** 800–1000 words.  
  - **Key Challenge:** Forces engagement with *structural implications* of Nozick’s theory beyond Chamberlain’s first-generation argument.  
  - **Pedagogical Goal:** Tests comprehension of how Nozick’s principles *interact* in dynamic scenarios and exposes tensions liberalism struggles to resolve.
