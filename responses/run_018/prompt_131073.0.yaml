prompt: |-
  I teach an upper-level undergraduate seminar in political philosophy and am drafting the final exam. I need one essay question on Nozick's entitlement theory and the Wilt Chamberlain argument that cannot be answered by reciting the standard textbook summary. To force genuine analysis, the question should present a modified "cascade entitlement" scenario: Chamberlain earns voluntary payments for performances, then acquires proprietary training licenses and derivative-performance rights, which are inherited across generations so that a class of rights-holders eventually collects rents without direct labor, even though every individual acquisition and transfer in the chain satisfied Nozick's principles of justice in acquisition and justice in transfer. The prompt should ask students to apply Nozick's three principles precisely to this cascade, to explain whether and where rectification could apply, to discuss whether Nozick's rejection of the Lockean proviso is essential to allowing the cascade, and to evaluate what the case shows about the conflict between historical entitlement theories and patterned principles of distributive justice. I also need a model answer of about 700 words and a marking scheme totaling 20 points, with specific point allocations for: accurate deployment of the three principles in the cascade (5 points), analysis of the Lockean proviso's role (4 points), the historical-versus-patterned tension (4 points), the rectification question (4 points), and argumentative clarity and precision (3 points). For each category, include a one-line note on the typical mistake that costs marks there. The exam should be designed for 45 minutes of writing, with an expected response of roughly 800 to 1000 words.
