answer: |-
  Here’s a structured proposal for your 6,000-word paper, designed to rigorously test your "shared-factor criterion" while navigating conceptual and historical constraints. The goal is to transform a methodological concern into a substantive contribution about how we frame historical puzzles.

  ---

  ### **Title Proposal:**  
  *Contrasts that Collapse: Diagnosing the Britain-China Industrialization Question through Shared Causal Architecture*

  ### **Core Question (Precisely Stated):**  
  *Is the contrastive question "Why did the Industrial Revolution occur in Britain and not China?" a* **genuine causal contrast** *—defined as requiring at least one factor that (a) features in the best causal explanations of both conjuncts (Britain’s industrialization AND China’s non-industrialization), (b) operates differentially to produce the divergent outcomes, and (c) is non-trivially necessary to the explanation of the contrast?*  

  **What Makes a Contrastive Question Well-Posed (vs. Degenerate):**  
  - **Well-Posed:** Satisfies the **shared-factor criterion** (as defined above). The contrast identifies a *specific causal mechanism* whose presence/absence or differential operation *systematically explains the divergence*.  
  - **Degenerate:**  
    - **Bundled Questions:** Conjuncts lack shared causal factors; "and not" is merely grammatical juxtaposition.  
    - **Trivial Satisfaction:** "Shared factor" is vacuously true (e.g., "both existed in the 18th century").  
    - **Artifactual Contrast:** Foil selection is post-hoc (denominator problem) or units/timescales are mismatched (unit-matching problem), making divergence inevitable or arbitrary.  

  ---

  ### **Key Positions to Analyze (Leaving the Question Open):**  
  1. **Causal Monism:**  
     - *Claim:* The question is well-posed; a single decisive factor (e.g., "British coal deposits" or "Chinese state suppression of merchants") explains the divergence.  
     - *Why Open:* Depends on whether the proposed factor satisfies (b) and (c) above. If coal explains Britain’s rise but China’s non-industrialization is better explained by agrarian constraints, the factor isn’t *differentially* operative in both conjuncts.  

  2. **Dissolutionist Framing:**  
     - *Claim:* The contrast dissolves when units/timescales are matched (e.g., comparing Yangtze Delta vs. Britain c. 1750–1800) or when China’s "non-industrialization" is reframed as "commercial growth without steam-powered factories."  
     - *Why Open:* Even if regional comparisons reveal similar proto-industrial dynamism, the *divergence in outcomes* (factory industrialization vs. artisanal production) may still require a contrastive explanation invoking shared factors (e.g., factor prices).  

  3. **Conjunctive Pluralism:**  
     - *Claim:* The contrast is genuine but requires a *conjunction* of independent causes (e.g., "Britain had coal + colonies + high wages" vs. "China had labor abundance + stable agrarian system").  
     - *Why Open:* If causes are truly independent, the "shared factor" criterion fails—there is no *common* factor operating differentially. The contrast becomes a list of unrelated explanations.  

  ---

  ### **Method: Section-by-Section Plan**  
  **Total: ~5,500 words**  

  1. **Introduction: The Stakes of Contrastive Framing (800 words)**  
     - Argue that poorly posed contrasts misdirect research (e.g., searching for "the" cause in Britain while ignoring China’s internal dynamics).  
     - Preview the **shared-factor criterion** as a diagnostic tool for "contrastive integrity."  

  2. **Conceptual Groundwork: What Makes a Contrast Degenerate? (1,000 words)**  
     - Define "genuine causal contrast" using the three criteria (shared factor, differential operation, non-trivial necessity).  
     - Formalize the **unit-matching** (e.g., polity size, temporal synchronicity) and **denominator** (plausible candidate regions) problems as failure modes.  

  3. **Applying the Criterion: Proxy Analysis without Settling History (1,500 words)**  
     - **Step 1:** Decompose the question: Conjunct A (*Why Britain?*) and Conjunct B (*Why not China?*).  
     - **Step 2:** From secondary literature, identify *dominant explanatory frameworks* for each conjunct:  
       - *Britain:* Coal geography, wage-price ratios, colonial resources, institutional innovations.  
       - *China:* "High-level equilibrium trap" (demography/agrarian efficiency), state fiscal policies, silver inflows, internal trade barriers.  
     - **Step 3:** Test for **shared factors** by asking: *Is there a factor F such that:*  
       - (i) F is cited in leading explanations *of both outcomes*?  
       - (ii) F’s *presence* in Britain and *absence* (or weaker form) in China is argued to be causally decisive?  
       - *Example:* "Factor prices" (F) appear in both: High wages spurred labor-saving tech in Britain; low wages discouraged it in China. *But:* Is F necessary for Conjunct B, or is China’s outcome better explained by agrarian constraints alone?  
     - **Step 4:** Map disagreements: Historians who treat F as shared vs. those who reject F’s relevance to one conjunct.  

  4. **Testing Robustness: Unit-Matching and Denominator Problems (1,000 words)**  
     - **Unit-Matching:** Re-run the test substituting "Lower Yangtze Delta" for "China" and adjusting timelines. Does a shared factor emerge?  
     - **Denominator Problem:** If the Netherlands/Belgium or Japan are plausible candidates, does pairing Britain with *them* satisfy the criterion more cleanly?  

  5. **Possible Conclusions and Decisive Tests (800 words)**  
     - **Conclusion 1 (Genuine Contrast):** A robust shared factor (e.g., "energy costs") satisfies criteria (a)-(c). *Decider:* Consensus across both conjuncts’ literatures.  
     - **Conclusion 2 (Bundled Questions):** No shared factor; explanations are disjoint. *Decider:* Dominant theories of China’s non-industrialization make no reference to factors central to Britain’s rise.  
     - **Conclusion 3 (Criterion Failure):** The test is too weak (e.g., "geography" vacuously shared) or too strong (no historical contrast passes). *Decider:* If *every* or *no* contrast satisfies it when applied to clear cases (e.g., "Why WWII in Europe not S. America?").  

  6. **Limitations: What the Paper Cannot Do (400 words)**  
     - **Explicitly Set Aside:**  
       - Definitive historical adjudication (reliance on secondary lit).  
       - Comprehensive survey of all causal theories (focus on dominant frameworks).  
       - Resolving whether China "could have" industrialized (counterfactuals).  
     - *Rationale:* The paper tests *whether the question is well-posed*, not *what the answer is*.  

  ---

  ### **Deliverable for Historians: The Contrast Repair Toolkit**  
  If successful, your paper equips historians to:  
  1. **Diagnose suspect contrasts** using a 3-point checklist:  
     - ❓ *Is there a candidate shared factor?*  
     - ❓ *Do leading theories for *both* outcomes invoke it differentially?*  
     - ❓ *Are units/timescales matched?*  
  2. **Reframe degenerate questions:**  
     - If "no shared factor," split into separate investigations (e.g., "Causes of British industrialization" + "Dynamics of Qing economic stability").  
     - If "unit mismatch," rescale (e.g., compare regions, not nations).  
     - If "denominator artifact," specify the candidate set *ex ante* (e.g., "Why Britain among Northwest European cores?").  
  3. **Prevent framing bias:** By exposing how foil selection (*not China*) can inflate the puzzle, historians can justify comparators rigorously.  

  **This shifts practice:** Historians move from debating "the cause" to critically assessing whether their *framing* reflects causal structure or grammatical habit.

  ---

  **Why This Approach?**  
  - **Beyond Conceptual Analysis:** By testing the criterion against real historiographical disputes, you show *how* it resolves methodological stalemates.  
  - **Beyond Surveying Causes:** You avoid being drowned in causal hypotheses by focusing on their *architecture* (shared/disjoint).  
  - **Leverages Constraints:** Secondary literature provides ample evidence of explanatory patterns without needing new archival work.  

  This structure makes your supervisor’s "merely methodological" concern substantively consequential: It determines whether one of global history’s biggest questions is a mirage.
