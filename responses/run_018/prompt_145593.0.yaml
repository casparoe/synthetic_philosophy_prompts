answer: |-
  ### Exam Question
  **Time Allowed: 75 minutes**  
  **Word Limit: 1000 words**  

  **Scenario:** A historian contends that the Verdean Revolution (a hypothetical case) was causally overdetermined. She argues that three conditions—**(A)** *organizational readiness* (revolutionary groups were poised to seize power), **(B)** *institutional collapse* (state apparatuses ceased functioning), and **(C)** *widespread popular exhaustion* (mass refusal to support the regime)—were each *individually sufficient* to trigger the revolution. Nevertheless, she insists all three must appear in the explanation. Omitting any one factor, she claims, would undermine the narrative structure and explanatory coherence of the account, even though counterfactual analysis confirms the revolution would still have occurred without any single factor.  

  **Question:** Critically assess whether this historian coherently describes historical overdetermination or illegitimately conflates *causal redundancy* (true overdetermination) with *narrative-constitutive multiplicity* (factors essential for a satisfying narrative but causally redundant). In your response:  
  1. Precisely distinguish causal overdetermination from joint causation in historical explanation.  
  2. Identify the specific conflation in the historian’s argument.  
  3. Propose explicit criteria to distinguish a *genuinely overdetermined cause* from a *merely narratively indispensable factor*.  
  4. Apply your criteria to **one** of conditions (A), (B), or (C).  
  5. Evaluate whether your criterion can be sustained in practice without collapsing into a simple test for sufficiency, acknowledging one serious objection.  

  ---

  ### Model Answer (798 words)  

  #### 1. Distinguishing Overdetermination from Joint Causation (5 marks)  
  Causal overdetermination occurs when *multiple distinct sufficient causes* converge on a single outcome, such that any one cause could have produced the outcome independently. Crucially, the causes operate via *different causal pathways* and are *non-interdependent*; removing one leaves the others fully capable of generating the outcome. In contrast, joint causation describes factors that are *individually necessary* and *only jointly sufficient*. Here, each factor contributes a unique, non-redundant element to a single causal mechanism (e.g., oxygen, fuel, and heat causing fire). The historian’s claim that (A), (B), and (C) are each *sufficient* aligns with overdetermination. However, her insistence on including all three for "narrative coherence" suggests a deeper tension.  

  > *Common pitfall (0 marks): Equating joint causation with overdetermination or reducing both to necessary/sufficient conditions.*  

  #### 2. Identifying the Conflation (5 marks)  
  The historian conflates two distinct concepts: **(i)** *causal redundancy* (true overdetermination), where factors are empirically dispensable for the outcome’s occurrence, and **(ii)** *narrative-constitutive multiplicity*, where factors are indispensable for constructing a *meaningful historical account* but not for the outcome itself. Her argument admits that omitting (A), (B), or (C) preserves the counterfactual outcome (causal redundancy) yet demands their inclusion for "narrative structure" and "explanatory coherence." This conflates *causal efficacy* (what brought about the revolution) with *hermeneutic necessity* (what renders the revolution intelligible within a specific narrative framework). Narrative-constitutive factors may explain *why* the event unfolded as it did (e.g., its timing, scale, or moral significance) but are not required for *that it occurred*.  

  > *Common pitfall (2–3 marks): Not isolating narrative coherence as a distinct epistemological goal separate from causal efficacy.*  

  #### 3. Proposed Distinction Criterion (6 marks)  
  I propose a two-tier criterion drawing on Woodward’s interventionist model and narrative theory:  
  - **Genuine Overdetermination (Causal Redundancy):** A factor (X) is overdetermining iff, holding all other background conditions fixed, *intervening to remove X* leaves the outcome (Y) unchanged *and* the causal mechanism linking alternative sufficient causes (e.g., Z) to Y remains *robustly operable* without X.  
  - **Narrative-Constitutive Multiplicity:** A factor (X) is narratively indispensable iff its omission *disrupts the minimal narrative coherence* of the account—specifically, by violating contextual continuity (e.g., temporal/spatial logic), agential plausibility (e.g., motivations), or explanatory depth (e.g., failing to resolve "why then?" or "why thus?").  

  This distinguishes *mechanism-level counterfactual robustness* (causal redundancy) from *narrative-level stability* (hermeneutic necessity).  

  > *Common pitfall (3–4 marks): Proposing criteria that are purely narrative-based (e.g., "what makes the story compelling") or purely counterfactual without mechanism-level analysis.*  

  #### 4. Application to Condition (C): Widespread Popular Exhaustion (5 marks)  
  Apply the criterion to **(C) Popular Exhaustion**:  
  - **Causal Redundancy Test:** If we intervene to remove popular exhaustion (e.g., via a counterfactual where state propaganda successfully mobilizes public loyalty), would the revolution still occur? The historian claims yes—due to (A) or (B). However, for true overdetermination, the mechanism linking (A) *Organizational Readiness* to revolution must operate robustly *without (C)*. Yet if popular support exists, revolutionary groups (A) might face effective resistance, making seizure of power unlikely. Similarly, institutional collapse (B) might prompt reforms rather than revolution if the public backs the regime. Thus, (C) may not be causally redundant if its absence undermines the efficacy of (A) or (B).  
  - **Narrative Test:** Omitting (C) ruptures narrative coherence. Without popular exhaustion, the revolution’s scale (mass participation) and moral character ("people’s revolution") become inexplicable, reducing explanatory depth. The account may degenerate into a "coup" (if only (A) and (B)) rather than a revolution.  

  **Verdict:** (C) likely fails as a truly overdetermining factor but succeeds as narratively indispensable. The historian’s error is assuming sufficiency implies redundancy without testing mechanism-level robustness.  

  > *Common pitfall (2–3 marks): Only testing sufficiency or only addressing narrative impact, not both tiers.*  

  #### 5. Critical Evaluation & Objection (4 marks)  
  The criterion *succeeds* in theory by decoupling causal and narrative roles, but risks collapsing in practice for two reasons:  
  **(i) The Mechanism-Identification Problem:** Historical mechanisms (e.g., "institutional collapse causing revolution") are rarely isolatable. Factors like (C) may be embedded in the enabling conditions for (A) or (B), making "holding background conditions fixed" impossible. For instance, popular exhaustion might be a precondition for institutional collapse (B). This conflates joint causation with overdetermination.  
  **(ii) The Objection from Explanatory Aims:** Historian Paul Roth argues that causality in history is inextricable from narrative construction. Demarcating "pure" overdetermination requires abstracting from contextual details that define historical inquiry. Thus, the criterion may devolve into testing sufficiency in idealized models, irrelevant to actual historiography.  

  **Conclusion:** The distinction holds *conceptually* but is *pragmatically unstable*. The historian’s position conflates causal and narrative roles, but this reflects a deeper tension: historical explanations aim for both empirical accuracy and hermeneutic richness. While my criterion clarifies the conflation, its application exposes history’s resistance to decontextualized causal analysis.  

  > *Common pitfall (2 marks): Ignoring practical challenges or treating the criterion as unproblematic.*  

  ---

  ### Marking Scheme (Total: 25 marks)  
  | **Element**                                                                                               | **Marks** | **Common Pitfalls (Costing Marks)**                                                                 |
  |-----------------------------------------------------------------------------------------------------------|-----------|-----------------------------------------------------------------------------------------------------|
  | **1. Precise characterization of overdetermination vs. joint causation**                                  | 5        | Confusing terms; reducing to necessary/sufficiency without pathways.                                |
  | **2. Identification of conflation (causal redundancy vs. narrative-constitutive)**                        | 5        | Vague critique; missing narrative’s hermeneutic role.                                               |
  | **3. Formulation of distinction criterion (e.g., mechanism-level robustness vs. narrative stability)**     | 6        | Overly narrative-focused; no interventionist logic; vague or circular criteria.                     |
  | **4. Application of criterion to one condition (A,B, or C)**                                               | 5        | Superficial application; ignoring interdependence; no dual testing (causal + narrative).            |
  | **5. Critical evaluation with one objection (e.g., mechanism identification or explanatory aims)**         | 4        | Uncritical acceptance of criterion; weak objection; no acknowledgment of practical collapse risk.   |

  **Pass Threshold:** 13/25 (Adequate engagement with all five elements but with weaknesses).  
  **Distinction Threshold:** 20/25 (Sophisticated critique, original criteria, and reflective evaluation).
