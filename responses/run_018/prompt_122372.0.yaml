  ### Verbal Dispute?  
  - **Loopers**: "The fight isn’t *just* verbal—we disagree on whether pattern-transfer literally *is* survival. But yeah, ‘I’ is fuzzy language."  
  - **Singularists**: "It’s ontological, not semantic. Calling a copy ‘you’ misrepresents first-person reality. But sure, we could say ‘quasi-you’ for copies."  
  - **Joint Conclusion**: *Partly* verbal (we could invent new terms), but core disagreement is real: **Does continuity of *structure* equal continuity of *selfhood?***  

