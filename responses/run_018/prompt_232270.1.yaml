  The key issue is that without a fixed set of scoring rules, dominance might not hold universally. For example, if each agent has their own scoring rule, a credence function dominated under one rule might not be under another. That breaks the argument for a universal norm. But if the set of admissible rules is universal, then even if agents use different rules from that set, the dominance relation holds across all of them. That preserves the norm's universality.

  The user might be probing whether there's flexibility in scoring rules without sacrificing normativity. They might want to reconcile agent-specific scoring rules with a universal norm. The solution is fixing the set of admissible rules universally. Then, any credence violating probabilism will be dominated under every rule in that set, making the norm agent-independent.

  Also, they might be interested in how strictly proper scoring rules relate to this. Since all such rules agree on dominance for non-probabilistic credences, the set can include all of them. But the set must be fixed universally. The real pressure is on justifying why that set is the same for everyone, tying into the epistemic value of accuracy itself.

