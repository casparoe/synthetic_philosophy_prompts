  Then there's the risk of executing the innocent. The user asks if this adds independent weight or just restates abolitionist concerns. Moral hazard asymmetry is key here: wrongful execution is irreversible and unique in its finality, unlike imprisonment. This isn't just about higher stakes; it's a qualitative difference. The state killing an innocent person violates the social contract in a way imprisonment doesn't. In Willingham's case, the 2009 review showing flawed science highlights this—once he's dead, correcting the error is impossible.  

