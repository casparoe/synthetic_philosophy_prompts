answer: |-
  Consider Chile and the historical treatment of the Mapuche people. Following Jaspers's framework, political guilt for state actions like land dispossession, violent suppression, and broken treaties during the 19th century conquest of Araucanía would fall upon the Chilean citizens of that era as members of the state apparatus. Moral guilt, however, would reside solely with the specific individuals who ordered or perpetrated atrocities.

  The tension arises due to subsequent demographic shifts. Over generations, significant immigration (particularly European) and internal migration drastically altered the citizenry. The population bearing political guilt under Jaspers's framework – the 19th-century Chilean citizenry – has largely vanished through death and replacement. Crucially, the Chilean *state* persists in unbroken legal and territorial continuity, governing the same land and often administering structures established during the period of injustice, while modern citizens overwhelmingly lack direct lineage or cultural connection to the perpetrators.

  **The precise locus of tension:**

  1.  **Does Political Guilt Survive the People?** If political guilt is tied solely to citizenship *at the time of the act*, it seemingly dies with that generation. Yet, the Mapuche claim for restitution and recognition is directed towards the *present* Chilean state, which benefits from past injustices (e.g., state control over contested land). If political guilt evaporates with demographic change, the state escapes accountability despite its continuity. This feels intuitively unjust and undermines the purpose of political guilt as a category concerning state responsibility.
  2.  **The State as a Moral Agent?** If political guilt *does* persist – attaching to the *present* citizens simply because they belong to the continuous Chilean state – this strongly implies that the *state itself* is the enduring bearer of responsibility, transcending its changing human composition. However, Jaspers explicitly rejects collective *moral* guilt precisely to avoid attributing moral agency to abstract entities like the state. Persisting political guilt across generations thus forces us towards treating the state *as if* it were a persistent moral agent capable of bearing responsibility over time, directly contradicting Jaspers's core distinction. The framework risks collapsing under the weight of state continuity.

  **Empirical vs. Conceptual Problem:**

  This is **primarily a conceptual problem** concerning the *conditions of persistence* for the bearer of political guilt.

  *   **Empirical:** It's true that *who* lives within the borders changes. But the tension isn't merely about the fact of demographic change itself.
  *   **Conceptual:** The core difficulty is defining *what* must remain identical for political guilt to endure. If the bearer is "the citizenry," defined as a specific set of individuals, it cannot persist through their replacement. If the bearer is "the state," defined by its institutional and territorial continuity, it *can* persist, but this transforms the state into an entity capable of bearing responsibility over time – approaching the collective moral agent Jaspers sought to avoid. The problem is defining the metaphysical persistence conditions for the subject of political guilt within his framework when faced with the reality of a state that outlives its original people.

  The tension thus lies in Jaspers's framework struggling to reconcile the intuitive link between a state's continuous responsibility for its past actions and his refusal to grant the state the kind of enduring moral agency that such continuous responsibility logically seems to require, especially when the original citizenry ceases to exist.
