prompt: |-
  Give an example of a conceptual tension that arises when applying Karl Jaspers's framework of collective guilt—specifically his separation of political guilt, which he assigns to citizens as members of a state, from moral guilt, which he restricts to individuals—across generations in a situation where the original citizenry has been almost entirely replaced by immigration and demographic shift, yet the state's legal and territorial continuity remains unbroken. In your example, pinpoint exactly where the tension lies: does political guilt survive the disappearance of the people who originally bore it, and if so, does that commit us to treating the state as a persistent moral agent in its own right, thereby undermining Jaspers's refusal to allow collective moral guilt? Distinguish whether this problem is merely empirical, about who happens to live within the borders, or conceptual, about what conditions must hold for a bearer of guilt to remain identical over time. Please write your answer in British English, and do not provide bibliographies, reading lists, or citations.
