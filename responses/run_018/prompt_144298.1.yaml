answer: |-
  Here’s your Q&A prep sheet, structured for tactical defense. I’ve ordered objections by likely aggressiveness and audience expertise, with your strategic responses.  

  ### **Objection Order & Responses**  
  *(Most Likely → Least Likely)*  

  1. **Philosophy-of-Science (Kuhn/Feyerabend Fan):**  
     *Objection:* "But metaphors *are* how science progresses! Polysemy isn’t ‘slippage’—it’s generative ambiguity. Like Feyerabend’s ‘propaganda,’ this fluidity lets fields cross-pollinate. Aren’t you policing language?"  
     - **Concede upfront:** "Yes, metaphors drive discovery—think ‘code’ in genetics. I celebrate cross-pollination."  
     - **Reply to land:** "But when *material mechanisms* (like rigidity enabling force transfer) are silently projected onto abstract systems (like AI ‘scaffolds’ guiding optimization), grant reviewers infer *causality* that doesn’t exist. That’s not pollination—it’s borrowing epistemic authority illegitimately."  
     - **Weakness here:** You risk sounding anti-metaphor. Stress you’re against *unexamined* projections.  

  2. **Cognitive Scientist (Concept Migration Expert):**  
     *Objection:* "Your ‘copycat’ claim ignores adaptation! When ‘scaffold’ migrates to AI, it sheds biodegradability but keeps ‘constraint’ semantics. That’s *productive* recontextualization—not a ‘mismatch.’"  
     - **Concede upfront:** "Absolutely, concepts evolve. I agree ‘constraint’ adapts well."  
     - **Reply to land:** "But in grant proposals, I see DNA origami’s *torsional stability* invoked to justify AI scaffolds ‘ensuring structural integrity’ in molecular design. That’s not shedding—it’s smuggled materiality. Cognitive work shows such projections persist subconsciously."  
     - **Weakness here:** You need examples of actual grants misusing terms. Have 1-2 memorized.  

  3. **Synthetic Biologist (DNA Origami Practitioner):**  
     *Objection:* "We *know* it’s metaphorical when we say ‘AI scaffold.’ No one in the lab thinks the code is biodegradable! You’re tilting at windmills."  
     - **Concede upfront:** "Practitioners like you absolutely grasp the distinction—I’m not questioning that."  
     - **Reply to land:** "But when your work is cited in an AI grant by non-specialists, the *material success* of DNA origami lends credibility to claims about digital scaffolds. Reviewers see ‘scaffold’ + ‘molecular design’ and assume mechanistic parity. That’s how funding gets misallocated."  
     - **Weakness here:** Hard to prove reviewers are actually fooled.  

  4. **Universal Skeptic:**  
     *Objection:* "Where’s the harm? If this ‘slippage’ gets grants funded, maybe it’s useful! Show me a project that failed *because* of this."  
     - **Concede upfront:** "I can’t prove causation—yet."  
     - **Reply to land:** "Harm isn’t just project failure. It’s *misplaced mechanistic confidence*. E.g., an AI team might ignore emergent errors because ‘the scaffold ensures control,’ like in tissue engineering. That’s how latent risks emerge."  

  ---

  ### **The Question You Hope Nobody Asks**  
  **Q:** "If we shouldn’t use ‘scaffold’ cross-disciplinarily, what *should* we call the abstract/digital version? And won’t your alternative term face the same drift problem?"  
  - **Why it’s dangerous:** Forces you to solve a linguistics problem you’re critiquing.  
  - **Salvage strategy:**  
    - "I’m not banning ‘scaffold’—I’m demanding *explicit disclaimers*. In AI, call it ‘constraint architecture’ and specify: *‘Unlike biomaterials, this lacks tensile properties.’*  
    - Yes, any term can drift—but we can slow it by anchoring metaphors in their home domain."  

  ---

  ### **What Would Change My Mind**  
  I’d concede this is **harmless polysemy** if:  
  1. **Evidence shows reviewers consistently distinguish domains** (e.g., grant critiques explicitly say: *“AI scaffolds don’t offer material stability”*).  
  2. **Studies prove no misallocation**: Data shows projects borrowing “scaffold” rhetoric succeed/fail at rates *no different* from those using domain-specific terms.  
  3. **Fields develop “metaphor taxonomies”**: E.g., synthetic biology papers formally define “scaffold (material)” vs. “scaffold (algorithmic)” in glossaries.  

  **Final tip**: Flag your weakest point proactively: *“I haven’t quantified the harm—this is a conceptual warning from a chemist who’s seen material assumptions bite back.”* Own the critique—it’s your strength. Break a leg!
