answer: |-
  ## Dialogue: The Budget Model Twist

  **Characters:**  
  *   **Alex:** Defending consequentialism (specifically utilitarianism)  
  *   **Sam:** Raising the demandingness objection  

  **Setting:** Uni common room, slightly battered sofas, mugs of tea going cold.

  ### 1. Opening Positions (~250 words)

  **Sam:** Right, so I just keep circling back to this: consequentialism, especially your flavour of it, Alex, asks *way* too much. Like, *actually* impossible. We’re supposed to constantly maximise the good, right? Every penny not donated to save a life, every minute not spent volunteering – it’s literally a moral failing? That’s… crushing. It leaves no room for *my* life, my projects, my mates. Doesn’t that just prove it’s an unreasonable standard?

  **Alex:** Hang on, Sam. “Too much” compared to *what*, though? That’s the rub. Consequentialism just says morality is about producing the best outcomes – minimising suffering, maximising wellbeing. If doing that *is* demanding – which yeah, in this messed up world it often is – well, why is the *truth* about what’s right supposed to be conveniently easy? Saying it asks too much feels like saying gravity asks too much when you fall over. It’s just describing the moral landscape. The ‘room for my life’ bit? That’s a cost, sure, but the wellbeing *gained* by others if you sacrifice some of yours has to be weighed in. Maybe the scales tip towards sacrifice being required.

  **Sam:** But that’s *exactly* the crushing bit! The scales *always* seem to tip that way! There’s *always* more suffering to alleviate somewhere. It feels like a never-ending debt I can never repay. It’s paralyzing, not motivating.

  ### 2. The Budget-Model and Wellbeing Back-and-forth (~400 words)

  **Alex:** Okay, let’s poke at that feeling. You said “debt”. That’s interesting. Our tutor mentioned this idea that the demandingness objection might sneak in a **‘budget model’** of morality. Like there’s this finite pot of ‘moral effort’ or ‘personal cost credits’ you have, and obligations drain it like a bank account. Once it’s empty, you’re bankrupt, morally excused. But is that how morality *actually* works? Or is it just how we *feel* about it? Consequentialism doesn’t assume a budget. It’s about net outcomes. The ‘cost’ to you is just one factor in the overall wellbeing calculation.

  **Sam:** Huh… maybe? But even if it’s not a strict budget, the *experience* of constant obligation *feels* like drowning in debt. It *is* psychologically crushing. Doesn’t that matter?

  **Alex:** It matters psychologically, absolutely! But does it matter *morally*, fundamentally? Only if we build that psychological limit *into* the theory of wellbeing or rightness itself. Which brings us to the other bit our tutor flagged: **preference-satisfaction views of wellbeing**. If wellbeing is *just* about satisfying *your* preferences, then yeah, constantly thwarting your own preferences for others' feels like a massive, constant net *loss* for you – a huge cost. The demandingness feels like a direct assault on *your* wellbeing defined purely as getting what *you* want.

  **Sam:** Well… yeah, kinda? Sacrificing my preferences *is* a cost to *my* wellbeing on that view, definately. So the demandingness *directly* translates to a massive wellbeing deficit for the agent. That seems pretty fundamental to why it feels excessive.

  **Alex:** But what if wellbeing *isn’t* just preference-satisfaction? What if it’s more objective? Like, relationships, achievements, knowledge, maybe even… moral integrity? On an **objective list theory**, sacrificing some preferences to, say, save lives or create justice *might* actually *contribute* to your wellbeing in a deeper way – fulfilling a capacity for compassion, living meaningfully. The ‘cost’ isn’t *necessarily* a pure wellbeing drain; it might be a complex trade-off *within* your wellbeing. The demandingness feels different then. Less like emptying a bank account, more like… hard work that’s also partly fulfilling? Still hard, mind!

  **Sam:** *(Pauses, sipping tea)* Okay, I see the distinction. If wellbeing includes things like ‘being a good person’ or ‘living ethically’ intrinsically, then acting morally isn’t *just* a cost against my preferences; it’s *also* partly fulfilling an element of my good. So the net ‘loss’ might be smaller, or even a gain in that dimension, even if my Netflix binge preference suffers. The crushing weight *might* lessen conceptually… but Alex, c’mon, does that really track the *experience*? Even if helping others is *part* of my good, the sheer *scale* consequentialism implies – giving *everything* beyond bare minimum – surely that would *still* obliterate other crucial goods on that list? Relationships require time *I* choose, achievements require focus on *my* projects. Sacrificing those entirely for distant others might still leave me… hollow, even on an objective list?

  **Alex:** Fair point. Maybe the objective list includes *both* altruism *and* personal projects/relationships as distinct goods. You’re right, maximising overall good might *still* demand sacrificing significant chunks of the ‘personal project’ good for massive gains in ‘relieved suffering’ good elsewhere. The demandingness hasn’t vanished. But my point is: the *feeling* of it being an unbearable, purely extractive debt – that specific crushing weight Sam described – might depend heavily on seeing wellbeing *only* as preference-satisfaction *and* seeing obligations like budget line items. Change those background assumptions, and while it’s still *demanding*, the *character* of the objection shifts. It becomes less about moral bankruptcy and more about a tragic, difficult trade-off between genuinely competing *goods* within the overall calculus.

  ### 3. Where They Land (~200 words)

  **Sam:** So… you’re saying the ‘crushing’ feeling isn’t *essential* to the objection, it depends on those hidden premises about wellbeing and cost? I’ll buy that. If wellbeing is broader, the cost *looks* different. Less like theft, more like… a really tough investment choice with personal downsides. But even then, Alex, the *level* demanded still feels superhuman. Even if it’s not a ‘debt’, the sheer *amount* of sacrifice required to truly maximise good globally seems to leave a normal human life – with its necessary focus on the near and dear – looking morally deficient. That core weight doesn’t completely lift for me.

  **Alex:** Yeah, I get that. And honestly, I’m not sure it ever *completely* lifts conceptually within strict act-consequentialism. You’re right about the scale. Recognising the ‘budget model’ and preference-satisfaction as specific premises *intensifies* the psychological crushing feeling, maybe makes the objection *feel* more intuitive. But stripping those away doesn’t magically make consequentialism undemanding. It just reframes *why* it’s demanding and maybe makes the demand feel… colder? More tragic necessity than personal violation? We’re still stuck with the fundamental tension: morality might require immense sacrifice for the greater good, and that’s incredibly hard to live with, regardless of how we model costs.

  **Sam:** "Tragic necessity" vs "personal violation"... yeah, that captures the shift. Still feels like too much, but maybe for slightly less… existentially suffocating reasons? Partial agreement? More like understanding *why* it feels suffocating, but the suffocation remains.

  **Alex:** *(Nods)* Stalemate on the core demandingness, then. But a clearer stalemate? Cheers for the chat. My tea’s properly cold now.

  **Sam:** *(Chuckles)* Yeah, mine too. Stalemate accepted. For now. Pass the biscuits?
