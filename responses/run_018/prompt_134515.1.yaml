answer: |-
  ### Decision Tree

  **Root: How is American exceptionalism primarily treated?**  
  - **As a historical claim?**  
    - **Structural? (rooted in durable institutional design)**  
      => structural exceptionalism  
    - **Performative? (discourse generates political conditions)**  
      => performative exceptionalism  
  - **As a normative claim?**  
    - **Exemplary? (nation should be imitated)**  
      => exemplary exceptionalism  
    - **Missionary? (nation should actively spread its system)**  
      => missionary exceptionalism  
  - **As an ideological claim?**  
    - **Legitimizes democratic participation?**  
      => democratic-legitimation ideology  
    - **Legitimizes imperial expansion?**  
      => imperial-legitimation ideology  

  ---

  ### Leaf Descriptions  

  1. **structural exceptionalism**:  
     Most awkward commitment: The nation’s institutional design inherently guarantees democratic success irrespective of cultural or historical contingencies.  
  2. **performative exceptionalism**:  
     Most awkward commitment: Public declarations of uniqueness actively manufacture the political unity they purport to neutrally document.  
  3. **exemplary exceptionalism**:  
     Most awkward commitment: The nation must isolate itself to preserve ideological purity, even if this enables threats to democracy abroad.  
  4. **missionary exceptionalism**:  
     Most awkward commitment: Military intervention is morally obligatory to impose the nation’s system on societies deemed "backward."  
  5. **democratic-legitimation ideology**:  
     Most awkward commitment: Accepting the myth of exceptionalism is essential to sustain civic engagement in a flawed democracy.  
  6. **imperial-legitimation ideology**:  
     Most awkward commitment: Economic exploitation abroad is defensible as a benevolent extension of the nation’s civilizing mission.  

  ---

  ### Flagged Separation Failures  
  - **structural exceptionalism** and a **purely institutional comparative-advantage view** (which posits contingent institutional strengths without uniqueness or inevitability) are insufficiently separated. The tree conflates them because both fall under structural claims.  

  ---

  ### Unoccupied Combinations & Diagnoses  
  1. **Historical structural + Normative missionary**:  
     *Diagnosis*: Common in practice (e.g., "institutions necessitate intervention") but unmapped—tree forces mutually exclusive branches.  
  2. **Ideological imperial-legitimation + Normative exemplary**:  
     *Diagnosis*: Incoherent—exemplary duty rejects intervention, while imperial legitimation requires it.  
  3. **Historical performative + Normative missionary**:  
     *Diagnosis*: Unexplored—performative discourse could theoretically enable interventionism, but no literature links them.  
  4. **Ideological democratic-legitimation + Normative missionary**:  
     *Diagnosis*: Unattractive—missionary actions abroad typically undermine domestic democratic legitimacy.  
  5. **All three branches simultaneously**:  
     *Diagnosis*: Incoherent—historical/normative/ideological functions conflict logically (e.g., descriptive claims can’t coexist with purely functional ones).
