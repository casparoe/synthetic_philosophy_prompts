prompt: |-
  I am a high school student preparing questions for an interview I will conduct for my school’s philosophy podcast. The guest is an unnamed philosopher who defends a particular resolution to the problem raised by Carroll’s tortoise: she holds that the infinite regress in justifying modus ponens is not a failure of deduction but a category mistake, because deduction operates through normative acceptance conditions learned in linguistic practice rather than through propositional premises that could themselves require justification. I need eight focused interview questions that engage directly with the structure of this view. Please include one question comparing her position to proof-theoretic semantics and its appeal to inference rules as defining logical constants; one question pressing whether her normative-practice account can distinguish valid from invalid inferences without tacitly invoking the very logical principles she says need no propositional backing; and one question asking how her view explains deductive error if such error is not a failure of justification but only a deviation from learned practice. For each of these three, provide a specific follow-up keyed to the reply she is most likely to give—especially her claim that acceptance conditions are acquired through training, not argument. The remaining questions should probe whether her distinction between procedural competence and propositional justification can survive applications to nested conditionals or to mathematical induction, and whether Carroll’s dialogue ultimately shows that all rational norms, not just logical ones, rest on ungrounded practices. Avoid generic questions about her career or inspiration. I want the sequence to build so that later questions depend on answers to earlier ones.
