answer: |-
  Here's a disambiguation of "DNA is literally a code, not a metaphor" structured for your philosophy-of-biology reading group, addressing your specific requests:

  ---

  ### **Thesis Menu: Interpretations of "DNA is literally a code"**

  | Thesis                                                                 | Aspect of "Code" Claimed         | Philosophical Status                              | Anti-Reductionist? | Notes                                                                 |
  | :--------------------------------------------------------------------- | :------------------------------- | :------------------------------------------------ | :----------------- | :-------------------------------------------------------------------- |
  | **1. Syntactic Combinatorics**                                         |                                  |                                                   |                    |                                                                       |
  | DNA sequences obey combinatorial rules (e.g., codon triplets, base pairing) independent of specific chemical affinities. | **Syntactic** (structure/form)   | **Trivial** (empirically established in molecular biology) | ❌ No              | Reductionism compatible: rules emerge from chemistry but are abstractable. |
  | **2a. Strong Semantic Content**                                        |                                  |                                                   |                    |                                                                       |
  | DNA sequences *intrinsically* represent biological meanings (e.g., "CAT = histidine"), requiring no evolutionary context or cellular machinery. | **Semantic** (meaning/reference) | **False**                                         | ❌ (Invalid)       | Requires Platonic meanings or a designer; contradicts biology.        |
  | **2b. Weak Semantic Content**                                          |                                  |                                                   |                    |                                                                       |
  | DNA sequences *functionally* specify amino acids/traits *relative to* the evolved translation apparatus. Meaning arises from cellular interpretation. | **Semantic** (via interpreter)   | **Defensible** (mainstream philosophy of biology) | ⚠️ Partially       | Depends on "naturalized semantics" (e.g., Millikan, Dretske).         |
  | **3. Teleofunctional Code**                                            |                                  |                                                   |                    |                                                                       |
  | DNA is a code *because* its function (to specify phenotypes) was evolutionarily selected. "Representation" is grounded in selection history. | **Evolutionary Teleofunction**   | **Defensible** (e.g., teleosemantics)             | ✅ Yes             | Naturalizes "aboutness" without intent; resists *purely* chemical reduction. |
  | **4. Pragmatic Control System**                                        |                                  |                                                   |                    |                                                                       |
  | DNA acts as a code within the cellular regulatory network, where sequences trigger context-dependent operations (e.g., transcription factors). | **Pragmatic** (control/context)  | **Defensible** (systems biology view)             | ⚠️ Partially       | Highlights organizational complexity; reductionism may miss system dynamics. |

  ---

  ### **Key Clarifications Addressing Your Queries**

  1.  **Intentionality/Designer?**  
      - Only **Thesis 2a (Strong Semantic)** implies intrinsic meaning, requiring a designer or mysticism. It is indefensible.  
      - **Theses 2b, 3, and 4** are naturalized: meaning/function derives from evolution or cellular mechanisms. **No intentionality needed.**

  2.  **Shannon vs. Semantic Information**  
      - Shannon information quantifies sequence complexity/surprise (**Thesis 1**), but says nothing about meaning.  
      - **The slogan collapses if Shannon information is conflated with semantics.** DNA has high Shannon information, but semantic content (**Theses 2b/3**) requires evolutionary context (teleofunction) or cellular interpretants (pragmatics).

  3.  **Coherent Middle Position?**  
      - **Yes: Accept syntactic code, reject semantic/pragmatic code.**  
        - *Syntactic*: DNA has code-like combinatorics (✔️ uncontroversial).  
        - *Semantic*: DNA lacks intrinsic meaning; "coding" is shorthand for causal roles in translation (✖️ no literal semantics).  
        - *Pragmatic*: Regulatory functions are context-dependent biochemical interactions, not "code execution" (✖️ avoid anthropomorphism).  
      - **This position is reductionist-compatible**: All features are explained by chemistry/physics in evolved systems.

  ---

  ### **Which Readings License Anti-Reductionism?**
  - **Strongly Anti-Reductionist**: **Thesis 3 (Teleofunctional)** – Argues teleological functions cannot be reduced to *current* chemistry.  
  - **Moderately Anti-Reductionist**: **Thesis 2b (Weak Semantic)** & **Thesis 4 (Pragmatic)** – Claim organizational/computational properties exceed chemical explanations.  
  - **Not Anti-Reductionist**: **Thesis 1 (Syntactic)** – Compatible with reduction; **Thesis 2a** – Invalid.

  ---

  ### **Recommendation for Your Reading Group**
  Your colleague likely invokes **Thesis 3 (Teleofunctional)** or **Thesis 2b (Weak Semantic)**. Both are defensible but contestable. Key discussion points:  
  - Does teleosemantics successfully naturalize "genetic information"? (Compare Millikan vs. Rosenberg)  
  - Can cellular "interpretation" be reduced to signal transduction biochemistry?  
  - Does "code" pragmatically aid scientific practice without implying ontological commitment?  

  **Essential Reading**:  
  1. **Sarkar (1996)** - *Biological Information: A Skeptical Look* (critiques semantic views).  
  2. **Godfrey-Smith (2007)** - *Information in Biology* (distinguishes Shannon, covariance, & teleosemantic information).  
  3. **Maynard Smith (2000)** - *The Concept of Information in Biology* (defends pragmatic use of "code").  

  This framework turns slogans into precise philosophical theses, empowering your group to debate reductionism rigorously.
