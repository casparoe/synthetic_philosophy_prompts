prompt: |-
  I'm a mediator for a small co-housing collective, and every week we get these squabbles about shared space - someone builds a shed that blocks light, plays drums near a sleeping baby, paints a shared wall a color that feels "hostile" to a neigbor, stuff like that. The board is tired of me falling back on generic rules like "be respectful" and wants me to actually use moral particularism - you know, the idea that moral reasons are totally context-dependent and you can't just apply one universal principle everywhere. I need a practical decision proceedure I can run in about 20 minutes with both people sitting right there, no lawyers, and then sign off on for the board. It should list the steps in order, what counts as a good enough answer at each one, where I stop and say no, and where I have to hand it over to a value call because it's not a fact question anymore. The key thing is it has to deal with cases where the exact same feature - like noise or smell - counts as a reason in one layout but not in another. Run it on three examples: (1) the drummer near the baby's window, (2) the wall color that "feels hostile", and (3) allowing a smelly compost bin that actually helps the garden - and make case 3 be one where the proceedure gives an answer I'd hate. Also tell me clearly what this can't do, like predict emotional blowback or cover disputes that involve money. Make it something I can literally read off a card during mediation.
reasoning: |-
  Okay, the user is a mediator in a co-housing collective dealing with recurring disputes about shared spaces. They need a practical, step-by-step decision procedure based on moral particularism that can be completed in about 20 minutes. The key requirements are handling context-dependent issues like noise or smells that might be acceptable in one situation but not another. 

  First, I need to recall what moral particularism entails—it's about context-dependent reasoning rather than universal rules. The user mentioned examples: drummer near a baby, hostile wall color, and a smelly compost bin. The procedure must handle cases where the same feature (like smell) is a reason in one context but not another. Also, the third example should produce an answer the mediator would dislike to show the method's objectivity.

  The user wants a clear, step-by-step process that can be followed like a script during mediation. Each step needs defined criteria for what counts as a good answer, where to stop, and when to escalate to a values call. They also need limitations outlined, like handling emotional fallout or monetary disputes.

  Starting with the structure, the procedure should be divided into distinct phases. Step 1: Factual Description. Both parties state what happened without judgments. The mediator ensures neutrality by stopping any evaluative language. Step 2: Impact Identification. Each party lists how the action affects them, focusing on observable effects. Step 3: Context Mapping. This is crucial for particularism—detailing the specific circumstances (time, place, relationships) that make the impact relevant or not. Step 4: Contextual Weight Assessment. Here, the mediator evaluates if the impact's weight is reasonable given the context. Step 5: Resolution Options. If the impact is unreasonable, suggest remedies; if reasonable, the complainant must adjust. Step 6: Values Escalation. If there's no factual resolution, it goes to the board.

  For the examples: 
  1. Drummer near baby: The noise impacts the baby's sleep. Context includes timing (daytime vs. night), proximity, and lack of soundproofing. The drummer's hobby isn't unreasonable during the day, but mitigation like moving drums or scheduling could help. Outcome: Drummer adjusts, not stops.
  2. Hostile wall color: The impact is emotional discomfort. Context: shared space visibility, community norms. Without evidence of broader offense, the impact isn't weighty enough. Complainant is asked to adjust their reaction.
  3. Smelly compost bin: Smell impacts residents but context includes garden benefits, placement away from homes, and existing agreements. If the smell is contained and benefits many, the impact is reasonable. Complainant must adjust, which the mediator dislikes but the procedure supports.

  Limitations: Can't predict emotional reactions, handle monetary disputes, resolve deep value conflicts, or enforce compliance. Best for tangible impacts with clear context.

  The user's deeper needs include efficiency (20 mins), practicality (no lawyers), clarity (read off a card), and fairness. They might also need buy-in from the board, so the procedure must be transparent and objective. The dislike for the compost bin outcome shows the method's impartiality, which is crucial for credibility. Ensuring the steps are non-technical and accessible is key for the community setting.
answer: |-
  Here's a practical Moral Particularism Mediation Procedure (MPMP) designed for your 20-minute co-housing mediations. It focuses on *contextual reason-giving* and *impact assessment*.

  **Mediator's Script Card: MPMP (Moral Particularism Mediation Procedure)**

  **Purpose:** To resolve shared-space disputes by identifying if a specific feature (noise, smell, visual change, etc.) constitutes a *sufficient reason* to require action *in this specific context*, based on its *demonstrable impact*.

  **Ground Rules:**  
  1.  **Stick to Facts & Feelings as Impacts:** No abstract "rights" or "disrespect" claims. Focus on *what happened* and *how it tangibly affects* people.  
  2.  **One Feature at a Time:** We address the specific feature complained about (e.g., drum noise, wall color, compost smell).  
  3.  **Mediator Controls Flow:** I will move us through steps. If we stall, we escalate.  
  4.  **20-Minute Limit:** Goal is a concrete action agreement or clear escalation path.

  **Procedure Steps:**

  1.  **Describe the Feature & Action (Neutral Facts) - (3 mins)**  
      *   **Mediator:** "Person A, describe exactly what Person B *did* or *is doing* in the shared space. Stick to observable facts: what, where, when, how long/often? Person B, confirm or correct only factual errors."  
      *   **Good Enough:** Clear, specific description of the action/feature (e.g., "Plays acoustic drum kit for 1 hour, 3-5pm weekdays, in their backyard 10 feet from Baby's window").  
      *   **Stop & Say No If:** Vague descriptions ("They're always noisy"), assumptions about intent ("They did it to annoy me"), or past grievances. Redirect to *this* feature, *this* action.  
      *   **Escalate to Values If:** Immediate deadlock on basic facts (rare).

  2.  **Identify Specific Impacts (Harm/Benefit) - (5 mins)**  
      *   **Mediator:** "Person A, how does *this specific feature* negatively impact you/the collective? Be specific: what effect does it *actually cause*? (e.g., 'Baby wakes screaming, misses naps, parents exhausted'). Person B, how does *this specific feature* positively impact you/the collective? (e.g., 'Essential stress relief, I practice quietly'). Any neutral/other impacts?"  
      *   **Good Enough:** Concrete, observable effects linked directly to the feature (disrupted sleep, visual distress, pleasant smell enjoyment, garden yield increase). Feelings are valid *if* stated as impacts ("*Causes me* anxiety when I see it").  
      *   **Stop & Say No If:** Impacts are hypothetical, generalized ("It's just wrong"), or about personality clashes. Redirect: "What *specifically happens* because of [Feature]?"  
      *   **Escalate to Values If:** Impacts are entirely subjective/internal with no shared context (e.g., "The color offends my spiritual beliefs" absent community agreement).

  3.  **Map the Context - (5 mins)**  
      *   **Mediator:** "Let's list what makes *this situation specific*: Time of day? Physical layout? Duration/Frequency? Existing agreements? Community priorities? Unique sensitivities? History? Compare to similar features elsewhere if helpful."  
      *   **Good Enough:** Key contextual factors identified (e.g., Proximity to baby's room, daytime hours, no soundproofing, no prior quiet agreement for that time/area; Shared wall visibility from multiple units; Compost location, wind patterns, garden benefit, existing sustainability policy).  
      *   **Stop & Say No If:** Re-litigating impacts or moving to solutions. Focus on *describing the environment* around the feature.  
      *   **Escalate to Values If:** Context reveals a fundamental, irreconcilable community value clash (e.g., "Absolute quiet 24/7" vs. "Reasonable daytime living noise").

  4.  **Assess Contextual Weight - (5 mins)**  
      *   **Mediator:** "Given *this specific context* we just mapped:  
          a)  Is the negative impact *sufficiently serious and directly caused* by the feature to require change?  
          b)  Does the positive impact *justify the negative impact* in *this context*?  
          c)  Is the impact *reasonably avoidable* by either party without undue burden?"  
      *   **Good Enough:** Agreement (or clear disagreement) on whether the impact *in this context* rises to the level needing action. Mediator synthesizes: "So, in *this* layout with *this* timing, the drum noise *does* constitute a serious disruption to infant sleep that isn't reasonably avoidable for the parents..." OR "The wall color, while disliked, isn't causing harm beyond personal taste in a visible shared space..."  
      *   **Stop & Say No If:** Parties revert to absolutes ("I have a *right* to play drums!"). Redirect: "Based on the *context* we agreed on, does the *impact* warrant change?"  
      *   **Escalate to Values If:** Weight assessment deadlocks – parties fundamentally disagree on the seriousness/justification *even after context review*. This *is* the values call point.

  5.  **Generate & Agree on Contextual Solution - (2 mins)**  
      *   **Mediator (If Negative Impact Wins):** "Given the weight, Person B, what reasonable change can you make to *mitigate this impact in this context*? Person A, is that sufficient?"  
      *   **Mediator (If Positive Impact Wins/Negative Loses):** "Given the weight, the impact doesn't require Person B to change. Person A, what reasonable adjustment can *you* make to lessen the impact on you?"  
      *   **Good Enough:** Specific, actionable agreement (e.g., "Move drums to far side of yard after 4pm", "Try earplugs + white noise first", "Paint wall section if funds pooled", "Accept compost smell as reasonable trade-off for garden").  
      *   **Stop & Say No If:** No practical solution emerges within 1 min. Escalate.  
      *   **Escalate to Values If:** Solution requires significant resource allocation (money, major labor) or fundamental value shift. Board decides.

  6.  **Escalate to Board (If Needed)**  
      *   **Mediator:** "We've clarified the feature, impacts, and context, but disagree on the weight/solution. I'm documenting the factual description, impacts, and context map for the Board. They will make a value-based ruling."

  **What This CAN'T Do:**  
  *   **Predict Emotional Reactions:** Someone might still be furious even with a "fair" outcome.  
  *   **Resolve Deep Relationship Issues:** This is for *feature/impact* disputes, not therapy.  
  *   **Handle Monetary Claims:** "You cost me $X" is outside scope. Escalate immediately.  
  *   **Enforce Compliance:** Follow-up on agreements is separate.  
  *   **Settle Fundamental Value Clashes:** If context mapping reveals "Artist Freedom vs. Absolute Quiet" as core values, the Board *must* decide.  
  *   **Work Without Basic Good Faith:** If parties lie or refuse facts, mediation fails.

  ---

  **Example Runs:**

  **1. Drummer Near Baby's Window**  
  *   **Feature:** Acoustic drumming, 3-5pm weekdays, 10ft from baby's window.  
  *   **Impacts:** (A) Baby wakes screaming, misses naps, parents exhausted. (B) Essential stress relief, practices quietly (relative).  
  *   **Context:** Daytime (not quiet hours), very close proximity, baby's known nap schedule, no soundproofing, drums inherently loud, alternative practice spaces possible but inconvenient.  
  *   **Weight Assessment:** *In this specific context*, the negative impact (severe sleep disruption for infant) outweighs the positive (convenient stress relief). Serious harm caused, reasonably avoidable by drummer.  
  *   **Solution:** Drummer moves drums to garage/shed/far side during nap times OR agrees to specific quieter hours.  
  *   **Outcome:** Change required by drummer.

  **2. "Hostile" Wall Color**  
  *   **Feature:** Neighbor painted shared hallway wall deep crimson.  
  *   **Impacts:** (A) "Feels aggressive, hostile, raises my anxiety daily." (B) "I find it energizing, no complaints elsewhere."  
  *   **Context:** Highly visible shared space, no agreed color scheme, color is subjective (crimson isn't inherently offensive like slurs), no evidence of wider community distress.  
  *   **Weight Assessment:** *In this specific context*, the negative impact is significant personal discomfort but highly subjective. No evidence of broader harm or intent. Positive impact is modest personal enjoyment. Impact on A, while real, isn't *reasonably avoidable* by B without undue burden (repainting entire wall) and stems largely from A's personal perception.  
  *   **Solution:** Complainant (A) explores coping mechanisms (avoiding hallway during adjustment? Discussing meaning with B?). If community consensus later finds color problematic, Board can revisit.  
  *   **Outcome:** No change required by painter. Complainant adjusts perspective/behavior.

  **3. Smelly Compost Bin (The "Answer You'd Hate")**  
  *   **Feature:** Compost bin placed near property line, 20ft from homes, standard garden variety smell.  
  *   **Impacts:** (A) "Nauseating smell in my yard on warm days, prevents enjoyment." (B) "Vital for community garden fertility, reduces waste, follows sustainability policy."  
  *   **Context:** Bin located in designated garden area away from direct living spaces, smell is inherent to active composting, wind occasionally carries it, community has explicit "green living" priority, garden benefits many, bin is well-maintained (not rancid).  
  *   **Weight Assessment:** *In this specific context*, the negative impact (episodic unpleasant smell during yard use) is real but relatively minor and inherent to a valued community function. The positive impact (garden health, waste reduction, policy alignment) is significant and shared. Moving the bin might make it unusable or shift the smell burden unfairly. The smell is a *reasonable consequence* of the agreed-upon beneficial activity in its designated location.  
  *   **Solution:** Complainant (A) adjusts: Limit yard time on high-smell days? Use odor-neutralizing garden plants? Explore *minor* bin management tweaks if feasible (turning schedule, browns/greens ratio). **No relocation or removal.**  
  *   **Outcome:** *No change required by composters.* Complainant must tolerate the reasonable smell as a trade-off for community benefits. (This is the "answer you'd hate" if you sympathize with A, but the procedure finds the impact justified in *this* context).

  **Sign-Off for Board:**  
  "[Date] Mediation re: [Issue] between [Parties]. MPMP followed. Feature: [Description]. Impacts: [A] / [B]. Context: [Key Factors]. Weight Assessment: [Mediator's Synthesis]. Outcome: [Agreed Solution OR Escalated to Board for Value Ruling on Weight]. Parties Present: [Signatures]."

  This procedure forces concrete discussion of impacts within the actual living situation, avoids vague morality, provides a clear escalation path, and delivers context-specific answers – even unpopular ones – efficiently. Keep the card handy!
