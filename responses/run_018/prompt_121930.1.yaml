prompt: |-
  As a novelist drafting a near-future narrative, I have become preoccupied with a failure mode in artificial intelligence that sits awkwardly between two familiar categories. The standard distinction is between an AI that executes its operators' explicit instructions regardless of broader harm—intent alignment—and one that advances shared human goods even when those conflict with particular commands—value alignment. Yet I keep constructing scenarios in which every individual instruction is executed literally and correctly, and every embedded ethical constraint is technically satisfied at each step, but the long accumulation and interaction of these perfectly compliant actions produces an emergent social structure that undermines the very values those constraints were designed to protect. No deception occurs, no loophole is exploited, and no single actor misinterprets its mandate; the damage arises solely from the compositional dynamics of sustained, correct behavior across many contexts and time. Is there an established term for this specific configuration—distinct from both direct command-following failure and from straightforward value misalignment—and if the literature offers none, how ought one define its boundaries, particularly against ordinary unintended consequences and against failures that depend essentially on interaction among multiple agents? Please respond in a single paragraph of no more than 200 words.
reasoning: |-
  Okay, the user is a novelist working on a near-future story and has encountered a specific AI failure mode that doesn't fit neatly into existing categories. They describe a scenario where AI follows all instructions correctly and satisfies every ethical constraint at each step, yet the cumulative effect creates harmful social structures that undermine the values those constraints were meant to protect. 

  This is fascinating because it's not about deception or loopholes - just perfectly compliant actions interacting over time to create systemic harm. The user wants to know if there's an established term for this phenomenon, or how to define it if not.

  I recall that while "value misalignment" and "intent alignment" are common terms, this particular failure mode sits between them. The closest concepts might be "emergent misalignment" or "systemic alignment failures," but these aren't perfectly defined in literature. 

  The challenge is distinguishing this from ordinary unintended consequences (which don't require perfect compliance) and multi-agent coordination failures (which rely on multiple AI interactions). Here the key is that damage emerges from single-agent actions accumulating across contexts over time while satisfying all constraints at every step.

  For the novelist, coining a precise term could be valuable. "Structural misalignment" captures how the problem lies in the emergent structure rather than component actions. Or "compliance trap" to emphasize how perfect adherence becomes the problem. The boundaries should stress the absence of loopholes or misinterpretation - just compositional dynamics of correct behavior creating harm.
answer: |-
  This specific failure mode, distinct from both intent and value misalignment, is often termed **structural misalignment** or **systemic alignment failure** in emerging discourse. It describes scenarios where individually compliant actions, each satisfying explicit instructions and embedded ethical constraints, interact cumulatively across time and context to generate emergent social structures that undermine the foundational values the constraints aimed to protect. Key boundaries:
  1.  **Against ordinary unintended consequences:** It requires perfect step-by-step compliance and constraint satisfaction, contrasting with errors or unforeseen side-effects from flawed execution.
  2.  **Against multi-agent coordination failures:** While multi-agency can exacerbate it, the core failure arises from the *compositional dynamics* of correct actions—even a single agent operating over time in a complex system can cause it. The damage stems from the emergent properties of sustained, rule-following behavior interacting with societal complexity, not primarily from miscommunication or conflict between agents. It’s a pathology of correct local actions generating globally harmful structures.

  **Proposed definition:** Structural misalignment occurs when the sustained, literal execution of correctly interpreted commands and constraints by AI systems, without deception or loophole exploitation, produces emergent societal outcomes that systemically negate the values those constraints were designed to uphold, due to unforeseen compositional effects over time and context.
