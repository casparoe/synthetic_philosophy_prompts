answer: |-
  You're hitting on a genuine empirical tension, but I don't think it forces me to abandon my core claim. First, let's clarify: those early binding windows *are* likely pre-conscious intermediate processing. The subjective "unity" reported for brief stimuli isn't evidence for phenomenal consciousness *during* those 40-60ms windows—it's evidence that the *output* of that rapid binding *later* enters the global workspace as a unified percept when ignition occurs. What subjects report retrospectively is the stabilized, globally available content, not the fleeting, fragmented pre-conscious construction. 

  Crucially, without global broadcasting—even briefly—there’s no evidence that these early bound features are *experienced*. They’re proto-representations: functionally potent for guiding rapid behavior, but not yet phenomenally conscious. The "phenomenal quality" you're tempted to locate in early cortex is actually the *global availability* of that integrated content downstream. Timing issues reveal staggered processing, not a divorce between access and phenomenality. If a tree falls in V1 and no workspace hears it, does it make a phenomenal sound? I argue: no.
