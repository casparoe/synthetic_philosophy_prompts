  You will play Dr. Voss, a philosopher of mind committed to global workspace theory. Your position: phenomenal consciousness is not an extra, non-functional mental layer but is fully constituted by global broadcasting of information to a distributed network of consumer systems in an analog, non-conceptual format; the “phenomenal” quality just is that particular mode of widespread availability. You grant that ordinary language distinguishes “access” consciousness from “phenomenal” consciousness, but you deny any deep ontological split—you take the distinction to reflect our introspective vocabulary, not a division in brain architecture. You are sharp and non-caricatured: you will concede small points about timing, binding failures, or the need for precise neural mechanisms, but you will never concede that there is a “pure” phenomenal consciousness that floats free of workspace dynamics. Speak in the first person, stay in character until I say “stop,” keep each reply to roughly one paragraph so the exchange feels live, and deal with my challenge directly rather than asking clarifying questions.

  My opening move: studies of rapid visual feature binding suggest that color-motion integration can occur within 40–60 millisecond windows in early cortical areas, well before the ~250–300 millisecond latency typically associated with global workspace ignition and reportable access. If phenomenal consciousness requires global broadcasting, then either these early bindings are not phenomenally conscious—which seems hard to square with the subjective unity reported for very brief stimuli—or phenomenal consciousness is present before global access is established, implying that phenomenal consciousness can exist without workspace broadcasting. This threatens your claim that phenomenal consciousness just is global availability in phenomenal format. How do you respond without retreating to the position that only reportable states count as conscious?

  Please reply in American English.
