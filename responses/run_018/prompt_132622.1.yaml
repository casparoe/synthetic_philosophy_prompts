answer: |-
  ### **Regional Housing Tension: Tabletop Simulation**  
  **Designed for a 90-minute seminar with 14 students (6 "towns" of 2–3 students each).**  

  ---

  #### **GAME RULES (1-PAGE HANDOUT)**  
  **Goal**:  
  - **Regional**: Build **120+ housing units** collectively across 6 towns in 5 rounds.  
  - **Local**: Maximize your town’s points (re-election depends on points = regional success + local popularity).  

  **Roles**:  
  - Each town has **2–3 Planning Commissioners** who must agree on decisions.  
  - Facilitator (you) runs the game and tracks regional totals.  

  **Town Actions (Per Round)**:  
  1. **Choose Zoning** (determines base units & political capital):  
     - **Restrictive**: 0 units, **+2 PC** (Political Capital).  
     - **Moderate**: 10 units, **+1 PC**.  
     - **Upzone**: 20 units, **+0 PC**.  
  2. **Accept/Reject Low-Income Development**:  
     - If accepted: **+10 units** but **−2 PC** (NIMBY backlash).  
     - If rejected: No change.  
     - *Rule*: You can only accept **once per game** (simulates political risk).  
  3. **Secret Value Capture** (Hidden Mechanic):  
     - Once per game, you may play your **"Tax Card"** if your town built **0 units that round**.  
     - Gain **1 point per 10 regional units built that round** (e.g., 80 regional units = 8 points).  
     - *This represents taxing regional growth (jobs, property values) without building housing*.  

  **Scoring (Post-Game)**:  
  - **Regional Bonus**: **+10 points** for every town IF 120+ units are built.  
  - **Local Points**: Total PC accumulated (gained from zoning, lost from developments).  
  - **Value Capture Points**: From Tax Card (if used).  
  - **Total Points** = Regional Bonus + Local Points + Value Capture Points.  
  - **Winner**: Town with the highest points. Re-election secured!  

  **Game End**: After 5 rounds.  

  ---

  #### **MATERIALS**  
  - **Per Town**:  
    - **Zoning Cards** (3 labeled: Restrictive/Moderate/Upzone).  
    - **Low-Income Development Card** (1 red "Accept" card, 1 green "Reject" card).  
    - **Tax Card** (1 per town, for value capture; players keep hidden until used).  
    - **Player Sheet** (Track units/PC/points; see template below).  
  - **Facilitator Materials**:  
    - Regional Tracker (board or paper showing round-by-round unit totals).  
    - Timer.  
    - Tokens (or pens) for tracking.  
  - **Template: Player Sheet**  
    ```  
    Town: ______  
    Round | Zoning (Units/PC) | Accept Dev? (Units/PC) | Total Units | PC Change | Tax Played?  
    1     |                   |                         |            |           |  
    2     |                   |                         |            |           |  
    ...  
    FINAL: Regional Bonus [ ] | Total PC [ ] | Tax Points [ ] | TOTAL SCORE [ ]  
    ```  

  ---

  #### **TIMELINE (90 MINUTES TOTAL)**  
  1. **Setup (10 min)**:  
     - Split students into 6 towns (2–3 per town).  
     - Distribute materials (cards, player sheets).  
     - Explain rules (emphasize secrecy of Tax Cards).  
     - Clarify goal: "Your job is to balance local popularity (PC) with regional housing needs."  

  2. **Gameplay (60 min, 5 rounds × 12 min each)**:  
     - **Round Structure**:  
       - **3 min**: Towns deliberate (choose zoning, accept/reject development).  
       - **2 min**: Towns submit decisions to facilitator (zoning + development choice).  
       - **2 min**: Facilitator calculates/announces **regional unit total** for the round (e.g., "Round 1: 40 units built!").  
       - **3 min**: Towns decide secretly if playing Tax Card (if they built 0 units).  
       - **2 min**: Facilitator collects Tax Cards (if used) and records points privately.  
     - **After Round 5**: Facilitator checks if 120+ units were built and calculates scores.  

  3. **Scoring & Winner (5 min)**:  
     - Announce regional success/failure.  
     - Share each town’s total points (PC + Tax + Regional Bonus). Crown the winning town!  

  ---

  #### **DEBRIEF (15 MIN)**  
  **Guiding Questions**:  
  1. "Did the region meet its 120-unit goal? Why or why not?"  
  2. "What strategies did your town use? Did you prioritize PC, regional bonus, or value capture?"  
  3. "How did the hidden Tax Card change behavior? Did anyone free-ride?"  

  **Map to Real-World Tensions**:  
  - **Key Insight**: The game mirrors how local democratic control (zoning/development vetoes) blocks collective housing rights.  
    - Towns that hoarded PC (via restrictive zoning) or used value capture benefited individually but hurt the region.  
    - Accepting low-income housing cost PC points, simulating NIMBY political risk.  
  - **Systemic Failure**: Even with a shared goal, individual incentives (re-election, tax gains) lead to underbuilding. This echoes real housing shortages.  
  - **Limitations of the Game**:  
    - **Race/History Not Captured**: Real-world zoning is rooted in racial segregation and classism; the game reduces this to "points."  
    - **NIMBY Complexity**: Real opposition isn’t just rational—it’s emotional (fear of change, bias). The game can’t simulate this depth.  

  ---

  #### **WHAT MIGHT BREAK (AND HOW TO FIX)**  
  - **Problem**: One town hoards Tax Cards or refuses to build.  
    - **Why**: Rational self-interest (max points via free-riding).  
    - **Fix**: Let it happen! This *is* the lesson. In debrief, highlight how this caused regional failure.  

  - **Problem**: Towns ignore regional goal to chase PC points.  
    - **Fix**: Announce cumulative units after each round to pressure them (e.g., "Only 60 units after 3 rounds!").  

  - **Problem**: Students focus too much on "winning" vs. learning.  
    - **Fix**: During debrief, pivot to structural analysis ("How do real cities fix this?").  

  - **Problem**: Time runs short.  
    - **Fix**: Reduce rounds to 4 or shorten deliberation time.  

  **Honest Note**: The game simplifies human behavior into points, but real housing conflicts involve trauma, power imbalances, and historical injustice. Use the simulation to expose systemic dilemmas—not as a perfect replica.  

  ---  
  **Outcome**: Students "discover" the tension through gameplay, setting up a rich debate on democracy vs. housing justice. No lecturing needed!
