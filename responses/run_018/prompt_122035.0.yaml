prompt: |-
  Hey — I've been sketching an argument for my grad seminar on standing and hypocrisy, and I think it collapses into something absurd but I can't locate the leak. Here it is, step by step.

  (1) If A blames B for wrong W, then A must have standing; and standing requires that A is not herself guilty of W, or of any wrong that is morally on a par with W.

  (2) Now suppose B failed to save a stranger at trivial cost. That's wrong. But A also fails every day to save strangers at trivial cost (not donating enough, ignoring appeals, etc.). So A is guilty of the very same type of wrong: omission of rescue at low cost.

  (3) Therefore, whenever A blames B for an omission, A lacks standing, because she commits structrual identical omissions.

  (4) But this reasoning doesn't depend on omissions alone. If B lies, and A has ever told a white lie to avoid awkwardness, then lying is wrong, and A has done a wrong of the same kind — just with lower stakes. So by (1), A lacks standing.

  (5) In fact, for any wrong W that B does, there's some paralel failure in A's life: she's never perfectly just, never perfectly honest, never perfectly generous. So for every possible act of blame, the blamer is hypocritical in this structural sense.

  (6) So nobody ever has standing to blame anyone for moral failings, except maybe angels or people with perfect moral records.

  (7) That's clearly wrong — we want to preserve that parents can blame children, that victims can blame wrongdoers, and so on. So one of the steps has to go.

  The part I want to save is (1), or at least the core idea that direct hypocrisy undermines standing. I also like the parity move in (2)-(4). Where's the slip? Is it that (1) demands too strong a consistency? Or is there an equivocation between same kind and same moral weight? Or maybe the argument is actually valid and the real cost is giving up (1) entirely?

  Also — I threw in this thing I'm calling the bookkeeping model: the idea that moral standing is like an account that gets debited every time you commit a paralel wrong, no matter the scale. Maybe that's what's driving the absurdity. Does rejecting the bookkeeping model fix it without ditching (1)?

  Anyway, which premise do you reject, and what's the price? I'd rather keep (1) and the parity intuition than swallow (6), but I want to know exactly what I'm paying.
reasoning: |-
  Okay, I need to help this grad student figure out where their argument about moral standing and hypocrisy goes wrong. Let me start by understanding their steps clearly.

  First, premise (1) says that to blame someone, you need standing, which requires you not be guilty of the same wrong or something morally equivalent. That makes sense intuitively—we usually think hypocrites shouldn't criticize others for things they do themselves.

  Then in step (2), they apply this to failing to save strangers. If B fails to save someone at trivial cost, that's wrong, but A does the same by not donating to charities. So A lacks standing to blame B.

  Step (3) extends this to all omissions: anytime A blames B for not acting, A is guilty of similar failures, so no standing.

  Step (4) broadens it further to any wrong, like lying. Even if A told a small white lie and B told a big one, they're both lying, so by (1), A lacks standing.

  Step (5) takes it to the extreme: for any wrong, A has some parallel failure in their life—nobody's perfect. So no one can ever blame anyone, except maybe perfect beings like angels.

  Step (6) concludes that standing is impossible for humans, which feels absurd because we do think parents can scold kids or victims can call out wrongdoers.

  Step (7) points out this absurdity and asks which step to reject. The user wants to save the core of (1) and the moral parity idea, but suspects the "bookkeeping model" might be the problem—where every similar wrong, regardless of scale, counts against your standing.

  Now, I need to find the leak. Where does this argument go off track? Let me think critically.

  First, premise (1) seems too strict. It requires that A isn't guilty of W or any "morally on a par" wrong. But what does "on a par" mean? Does it include any similar act, even if much less severe? In step (2), not donating to charity is treated as identical to failing to save a drowning person, but are they really equivalent? One is a direct, immediate omission; the other is part of a systemic, indirect problem. Morally, they might not be "on a par" because of context, scale, or immediacy.

  Similarly, in step (4), a white lie isn't necessarily morally equivalent to a harmful lie. So premise (1) might be ambiguous: "on a par" could be interpreted too broadly, leading to overgeneralization.

  That brings me to the bookkeeping model. If every minor failing debits your standing for all similar wrongs, it ignores proportionality and nuance. Real life isn't binary; morality has degrees. Rejecting this model could help—maybe standing depends on the severity and specifics of the wrong, not just the category.

  For example, in parent-child relationships, a parent might have lied as a kid but can still blame a child for lying because the context is different, or they've changed. Standing isn't a permanent ledger; it can be context-sensitive or reformed.

  Also, step (5) assumes that any imperfection means you're guilty of "the same kind" of wrong, but that's slippery. Not being perfectly generous isn't the same as refusing to save someone's life directly. The argument equivocates between "same type" and "same moral gravity."

  So the key slip might be in how "morally on a par" is defined. If it requires exact equivalence, then minor failings wouldn't count, and the argument collapses. But if it's looser, it leads to absurdity.

  The user wants to save the intuition behind (1) and moral parity. So perhaps modify (1) to add a proportionality or recency condition: standing is lost only if A's wrong is comparable in seriousness or if it's unaddressed. For instance, in hypocrisy discussions, we often care about current, relevant hypocrisy, not past minor faults.

  I should also address the bookkeeping model directly. Rejecting it means that moral standing isn't a cumulative account; it's assessed case by case. That could fix the issue without ditching (1). For example, A can blame B for a serious omission even if A has minor ones, as long as A isn't currently guilty of something equally bad.

  In conclusion, the leak is likely in premise (1)'s broad requirement and the bookkeeping approach. By refining "morally on a par" to include proportionality and rejecting the debit model, we can preserve standing in ordinary cases while keeping the anti-hypocrisy core.
answer: |-
  Your argument is fascinating—it perfectly encapsulates the "hypocrisy trap" that moral philosophers often grapple with. The core issue lies in **premise (1)**, specifically its requirement that standing demands *no guilt for any wrong "morally on a par" with W*. This, combined with the "bookkeeping model" (where *any* parallel wrong "debits" standing), creates an overbroad condition that collapses into absurdity. Here's a step-by-step diagnosis:

  ### The Problem: Premise (1) is Too Strong and Ambiguous
  - **"Morally on a par" is underdefined and overinclusive**. Your argument treats all wrongs of a "type" (e.g., omission, dishonesty) as morally equivalent *regardless of scale, context, or intent*. But a white lie to spare feelings ≠ a malicious lie that ruins a life; forgetting to donate to charity ≠ refusing to save a drowning child. Premise (1) ignores **moral gravity**, reducing all wrongs to binary tokens in a ledger.
  - **The bookkeeping model exacerbates this**. It treats standing as a static "account" where *any* past/parallel failing—no matter how trivial, distant, or reformed—voids standing. This ignores:
    - **Proportionality**: A minor wrong doesn’t equate to a major one.
    - **Recency/Relevance**: A reformed liar may have standing to condemn fraud; a parent who stole candy at 12 can blame their child for shoplifting.
    - **Context**: Failing to donate isn’t "structurally identical" (step 3) to refusing a direct rescue—one is diffuse/systemic, the other immediate/personal.

  ### Where the Argument Derails: Step (4) → Step (5)
  - Step (4) equivocates on "same kind". Telling a white lie and committing serious fraud are both "dishonesty," but they aren’t *morally on a par*. Your reasoning here relies on **categorical sameness** (they share a label: "lying" or "omission") while ignoring **moral equivalence**. This ambiguity lets step (5) generalize to *any* imperfection ("never perfectly generous"), which is a non sequitur: imperfect generosity isn’t "on a par" with callous indifference to suffering.

  ### How to Fix This Without Abandoning (1)'s Core
  You can preserve the intuition that *direct hypocrisy* voids standing while avoiding absurdity by **revising premise (1) and rejecting the bookkeeping model**. Here’s how:

  1. **Modify Premise (1) to incorporate proportionality and specificity**:  
     *If A blames B for wrong W, then A must have standing; standing requires that A is not currently/persistently guilty of a wrong that is* **relevantly similar in gravity and context** *to W.*  
     - **Why this works**: It blocks step (2)–(5). Not donating isn’t "relevantly similar" to ignoring a drowning person (different gravity/context). A white lie isn’t "relevantly similar" to perjury. This retains the anti-hypocrisy core but avoids overgeneralization.

  2. **Reject the Bookkeeping Model**:  
     Standing isn’t a permanent ledger. It’s **contextual and rehabilitative**.  
     - **Victims retain standing**: Even if a victim once told a white lie, they can blame their assailant for violence—their minor failing isn’t "on a par" with the wrong they suffered.  
     - **Moral growth matters**: If A once committed W but has reformed, they may regain standing to blame B for W (e.g., a recovering addict condemning drug dealers).  
     - **Scale thresholds**: Trivial wrongs don’t void standing for serious ones. We intuitively accept that someone who occasionally snaps at colleagues can still condemn a serial abuser.

  ### The Price of Keeping (1)'s Core
  If you retain a version of (1), you pay two philosophical costs:
  1. **Ambiguity in "relevantly similar"**: You’ll need to define criteria for similarity (e.g., harm severity, intent, relational context). This is messy but necessary.  
  2. **No standing for "tainted" blamers**: You still lose standing in cases of *direct, comparable hypocrisy* (e.g., a politician embezzling funds while blaming another for petty theft). This preserves the intuition that hypocrisy matters but avoids universal denial of standing.

  ### Why This Works for Your Examples
  - **Parents/children**: A parent can blame a child for lying even if they’ve told white lies—the child’s act isn’t "relevantly similar" to minor parental failings in gravity or role context.  
  - **Victims/wrongdoers**: A victim of assault doesn’t lose standing because they once cheated on a test—the wrongs aren’t comparable.  
  - **Omissions (step 2)**: Not donating isn’t "relevantly similar" to refusing to save a drowning person. The latter involves direct, immediate duty; the former is indirect and systemic.

  ### Final Thought
  The leak is in premise (1)'s failure to distinguish between *categorical* and *moral* equivalence. By adding nuance—gravity, context, reform—you salvage the hypocrisy intuition while avoiding the absurdity of step (6). Rejecting bookkeeping is essential: morality isn’t double-entry accounting. For your seminar, consider grounding "relevantly similar" in theories of moral scaling (e.g., proportionality in retributive justice) or role-based duties (e.g., parents owe more to their children than strangers). 

  This preserves your core insight—that hypocrisy *can* undermine standing—without imploding moral discourse. If you refine premise (1), your argument becomes a robust critique of *unqualified* blame, not blame itself.
