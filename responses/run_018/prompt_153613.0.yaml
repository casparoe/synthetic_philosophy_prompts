  i was also wondering about this idea i ran into—developmental bias—where the way development works makes certain evolutionary directions way more likely. does that strengthen the spandrel argument, or does it muddy it? like, if development channels change into specific paths, is that a spandrel of the developmental system, or is it an adaptation for evolvability?

