prompt: |-
  I'm preparing notes for a workshop on risk ethics and want a consistency audit of the following package. Here are my commitments: (1) I treat the precautionary principle as a deontic filter rather than a heuristic—if an activity threatens severe, irreversible harm, proceeding requires positive justification rather than mere absence of disproof; (2) I apply this symmetrically, supporting a moratorium on frontier AI training runs past a defined compute threshold unless safety is demonstrated with near-certainty, and supporting analogous constraints on climate geoengineering; (3) I am a moral actualist: the moral verdict on a policy depends solely on actual outcomes in the real world, not on counterfactual risks that never materialized; (4) I reject Bayesian and imprecise-probability frameworks for deep uncertainty because they rely on empirically unfounded priors; (5) for cases where probabilities are genuinely unassignable, I adopt maximin—select the option with the least harmful worst-case outcome; (6) I maintain that rational deliberation should never invoke considerations that are in principle unobservable, since rationality must be answerable to actual evidence. Which pairs are in genuine tension, which only appear to conflict, and what is the least costly revision for each real conflict? Please rank the tensions by severity, identify the single revision that would resolve the most conflicts, and answer in American English.
reasoning: |-
  Okay, the user is preparing workshop notes on risk ethics and wants a consistency audit of their philosophical commitments. They've listed six specific positions that need to be checked for internal coherence. 

  First, I need to understand each commitment clearly: (1) Strong precautionary principle as deontic filter (2) Symmetrical application to AI and geoengineering (3) Moral actualism focusing solely on real outcomes (4) Rejection of probabilistic frameworks in deep uncertainty (5) Adoption of maximin for unassignable probabilities (6) Rejection of unobservable considerations.

  Hmm... the core tension jumps out immediately between moral actualism and the precautionary principle. Actualism cares only about what *actually* happens, while precautionary principle restricts actions based on *potential* severe harm regardless of whether it materializes. That's a direct conflict - like saying "only real outcomes matter" but also "potential outcomes dictate rules". 

  Then there's the maximin strategy under deep uncertainty. If we follow maximin, we're choosing options based on worst-case scenarios that may never happen. But actualism explicitly rejects considering non-actualized risks. Another direct contradiction - can't simultaneously ignore non-realized risks yet base decisions on hypothetical worst cases.

  The observability principle seems incompatible with deontic filters too. Deontic rules often appeal to inherent wrongness (like "thou shalt not risk extinction") which isn't observable - it's a normative stance. But commitment (6) bans unobservable considerations. 

  Let me rank these by severity:
  1. Actualism vs Precautionary Principle (fundamental conflict in temporal focus)
  2. Actualism vs Maximin (contradiction in handling hypotheticals)
  3. Observability vs Deontic Nature of Precaution (epistemological clash)

  The user might not realize how much actualism undermines their other positions. The single most efficient fix would be replacing actualism with ex ante moral evaluation - this would resolve conflicts with both precautionary principle and maximin. 

  I should note the observability/precaution tension remains though. They could either soften the deontic stance to "heuristic" or allow normative axioms as "observable" through moral intuition. 

  Interestingly, symmetry (commitment 2) holds fine - no internal conflict there. And rejection of Bayesianism (4) actually supports maximin (5) consistently. 

  User's clearly thought deeply about this - workshop attendees will appreciate these nuances. Should emphasize that while positions feel coherent at surface level, the actualism commitment is doing heavy damage to the framework's foundations.
answer: |-
  Here's a consistency audit of your risk ethics package, ranked by severity of tension, with resolution strategies:

  **Severe Tensions (Direct Conflicts):**  
  1.  **Commitment (3) Moral Actualism vs. (1) Precautionary Principle & (5) Maximin**  
      *   **Conflict:** Actualism evaluates policies *solely* on **actual, realized outcomes**. The Precautionary Principle (PP) and Maximin restrict actions based on **potential, unrealized worst-case scenarios** (severe irreversible harm). PP/Maximin are inherently *ex ante* (before outcomes are known), focusing on avoiding catastrophic possibilities. Actualism is *ex post* (after outcomes are known), dismissing those same possibilities if they didn't occur. PP/Maximin require acting *as if* the worst *could* happen; Actualism says the moral verdict only cares if it *did* happen.
      *   **Example:** Under actualism, a geoengineering project causing runaway warming is bad, but one that *could have* caused it but didn't is morally neutral/fine. PP forbids the project *because* it *could* cause runaway warming, regardless of the actual outcome.
      *   **Least Costly Revision:** **Replace Moral Actualism (3) with an *Ex Ante* Moral Framework.** Moral evaluation should consider the *reasonable expectations, possibilities, and avoidable risks* at the time of decision, not just the actual outcome. This prioritizes avoiding responsibility for imposing potentially catastrophic risks, aligning with PP and Maximin's *preventative* logic.

  2.  **Commitment (3) Moral Actualism vs. (5) Maximin**  
      *   **Conflict:** Maximin explicitly selects actions based *only* on comparing their **worst *possible* outcomes**, irrespective of likelihood or what *actually* happens. Actualism explicitly rejects considering non-actualized possibilities ("counterfactual risks that never materialized") for the moral verdict. Maximin *requires* focusing on hypothetical worst cases; Actualism *forbids* letting those hypotheticals determine the moral verdict.
      *   **Least Costly Revision:** Same as above: **Replace Moral Actualism (3) with an *Ex Ante* Moral Framework.** This allows the moral weight of avoiding the worst-case to drive decision-making under deep uncertainty.

  **Significant Tension (Conceptual Friction):**  
  3.  **Commitment (6) Observability Requirement vs. (1) Precautionary Principle's Deontic Nature**  
      *   **Conflict:** The PP as a "deontic filter" implies an inherent moral rule ("Don't impose severe irreversible risks without positive justification") that exists *prior* to observing outcomes. This rule's justification ("Why is this wrong?") often relies on concepts like rights, duties, or inherent wrongness of imposing certain risks – concepts arguably "unobservable" in the strict empirical sense demanded by (6). Rationality "answerable to actual evidence" struggles to ground a *deontic* rule that forbids actions *before* any harm is observed, purely based on the *potential* for unobserved harm. The *application* of PP uses observable evidence (e.g., evidence of *potential* for harm), but its *moral force* as a deontic rule is normative and non-empirical.
      *   **Least Costly Revision:** **Reframe the PP (1) as a Robust Heuristic, not a Deontic Filter.** Instead of an absolute rule, present it as the empirically best strategy ("Given catastrophic stakes and ignorance, the safest bet is to require proof of safety first") justified by historical observation of system failures and the limits of prediction. This grounds it more firmly in observable evidence and consequences. *Alternatively*, **modify (6)** to allow normative axioms derived from observable human experience (suffering, societal collapse) as "observable enough" foundations for rules like PP.

  **Apparent Tensions (Likely Consistent):**  
  4.  **Commitment (4) Rejection of Probabilistic Frameworks vs. (5) Maximin:**  
      *   **Apparent Conflict:** Rejecting Bayesian/probabilistic frameworks might seem to clash with adopting Maximin.  
      *   **Resolution:** **Consistent.** Your rejection of (4) is specifically due to "empirically unfounded priors" in contexts of *deep uncertainty* (where probabilities are genuinely unassignable). Maximin (5) is explicitly proposed *for exactly those cases* as an alternative non-probabilistic decision rule. They are complementary responses to deep uncertainty.

  5.  **Commitment (1) Precautionary Principle & (2) Symmetry vs. (3) Moral Actualism:**  
      *   **Apparent Conflict:** Symmetry (2) seems like a normative principle potentially conflicting with outcome-based actualism (3).  
      *   **Resolution:** **Consistent (conditional on resolving #1).** If Actualism is replaced with *Ex Ante* evaluation, symmetry becomes a rational application of a consistent *ex ante* risk management principle (PP) across analogous high-stakes domains (AI, geoengineering). It ensures non-arbitrary application of the risk rule. Symmetry isn't a core *moral* axiom conflicting with actualism; it's a procedural commitment to consistent rule application.

  6.  **Commitment (2) Symmetry vs. Others:**  
      *   **Apparent Conflict:** None identified. Symmetry is a commitment to *applying* your core risk principle (PP) consistently across domains. It doesn't inherently conflict with the *nature* of PP, actualism (if revised), maximin, or the other commitments.

  **Ranking of Genuine Tensions by Severity:**
  1.  **Moral Actualism (3) vs. Precautionary Principle (1) & Maximin (5)** (Fundamental clash in moral ontology/temporality)
  2.  **Observability Requirement (6) vs. Precautionary Principle as Deontic Filter (1)** (Epistemological vs. Normative foundations)

  **The Single Revision Resolving the Most Severe Conflicts:**
  *   **Replace Moral Actualism (3) with an *Ex Ante* Moral Framework.**

  **Why this is the most efficient fix:**  
  *   It directly resolves the **Severe Tension #1** (Actualism vs. PP/Maximin) and **Severe Tension #2** (Actualism vs. Maximin), which are the core contradictions threatening the coherence of your risk-averse approach (PP + Maximin).
  *   It inherently supports **Symmetry (2)** as a rational application of consistent *ex ante* rules.
  *   It leaves the rejection of probabilistic frameworks **(4)** and the adoption of Maximin **(5)** fully intact and coherent.
  *   While the tension with the Observability Requirement **(6)** remains, resolving the actualism conflict makes the framework *operationally* coherent. Addressing the PP's deontic nature vs. observability becomes a secondary, perhaps more philosophical, refinement.

  **Revised Core Package Recommendation:**
  1.  Precautionary Principle as a Deontic Filter (1)
  2.  Symmetrical Application (2)
  3.  **--> *Ex Ante* Moral Evaluation (replaces 3) <--** *[Critical Revision]*
  4.  Rejection of Unfounded Probabilistic Frameworks in Deep Uncertainty (4)
  5.  Maximin for Unassignable Probabilities (5)
  6.  Observability Requirement for Rational Deliberation (6) *[Note: Tension with #1 remains; consider reframing PP or relaxing observability slightly]*.

  This revised package maintains your strong risk-averse stance (PP, Maximin) applied symmetrically, grounded in avoiding potentially catastrophic choices *before* the fact, while dropping the internally contradictory commitment to judging morality solely by *actual* outcomes.
