prompt: |-
  I'm a novelist, and I keep returning to the ferry-boat scene in Christopher Nolan's The Dark Knight as a piece of moral stagecraft that seems to be about the prisoner's dilemma without quite being one. I'd like a rigorous reading of that scene through the lens of the one-shot and iterated prisoner's dilemma and the evolutionary account of cooperation. Take the scene seriously as a game: two boats, one carrying civilians and one carrying convicts, each given the detonator to the other's explosives, with the Joker threatening to destroy both boats at midnight unless one of them uses it. The turning points are a civilian who cannot bring himself to press the detonator and a convict who takes it and throws it into the water. I want the reading to say where the theory illuminates those choices, where the film resists the theory, and what the scene, as drama, can show that the formal model cannot.

  Please organize the response into these sections:

  - "The scene and the game" (~250 words): state what happens and reconstruct the decision each boat faces as exactly as the film allows, noting whether this is genuinely a prisoner's dilemma or some other interdependent game.
  - "What one-shot defection predicts" (~350 words): explain why defection is the dominant move in the standard one-shot prisoner's dilemma and how much of the scene's escalating logic follows from it.
  - "Where the film fits the theory, and where it slips it" (~600 words): give the strongest game-theoretic reading of both boats, then say where the scene's actual turning points elude the matrix.
  - "The shadow of the future, reputation, and the iterated machinery the film smuggles in" (~500 words): assess whether the boats are really in a one-shot situation, or whether the watching city, the guards, the passengers' standing identities, and the franchise's continued narrative give the players the future-oriented incentives — anticipated retaliation, reputation, direct or indirect reciprocity — that evolutionary accounts of cooperation from Axelrod onward depend on.
  - "What fiction adds" (~300 words): conclude with what a novel or film can dramatize about cooperation and refusal that the prisoner's dilemma and the evolution of cooperation, as formal accounts, leave out; say honestly whether the scene sentimentalizes cooperation or complicates the theory.
