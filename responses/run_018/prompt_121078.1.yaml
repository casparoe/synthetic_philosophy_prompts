  Breaking it down: first, the legal claim ("no court would give him a remedy") is solid in the U.S. Dead people generally can't sue for defamation, and truth defenses wouldn't apply here since the scene is fictionally fabricated. But the user’s sharper question is how this bled into moral territory. Claims about the deceased having "no interests" or "no subject to wrong" are philosophical, not legal—they’d require separate arguments about personhood after death. The lawyer’s shrug implied moral stakes vanished with legal ones, which is shaky.  

  Then there’s the collateral damage: living relatives who might object, or readers absorbing falsehoods about the composer. The user even hints at the composer’s own agency ("choice to be written about"), which touches on publicity rights—but those expire with death in most states. Still, ethically? Fabricating cruelty could distort his legacy.  

  The user’s urgency ("read on my phone before calling agent") means I should distill this ruthlessly. Prioritize: confirm legal accuracy first, then dissect the moral leap, flag unresolved tensions (like living relatives' distress), and note what actually justified the meeting’s conclusion—which was purely legal risk assessment, not ethical clearance. Their agent’s nervousness likely stems from reputational blowback, not lawsuits.  

