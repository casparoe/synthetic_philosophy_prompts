answer: |-
  Here's the breakdown of claims packed into "the dead can't sue," sharpened for your call:

  1.  **"No court would grant him a legal remedy (like damages or an injunction)."**
      *   **True?** **Yes.** (In the US, generally). Dead people lack legal standing to sue for defamation, privacy invasion, or most torts. The lawsuit dies with them.
      *   **Falls out of legal point?** Directly *is* the core legal point.
      *   **Gets meeting to conclusion?** **Yes.** This single point addresses the *publisher's primary legal risk* (being sued successfully). That's why the meeting moved on.

  2.  **"He (as a conscious entity) cannot be harmed by the depiction."**
      *   **True?** **Debatable.** Philosophically, does harm require subjective experience? If death is non-existence, then arguably yes. But others argue harm can be to legacy/reputation *as such*.
      *   **Falls out of legal point?** **No.** Needs its own philosophical argument. The legal point is silent on experiential harm.
      *   **Gets meeting to conclusion?** **No.** Legally irrelevant to the publisher's risk.

  3.  **"He cannot be wronged because there is no 'him' left to be wronged."**
      *   **True?** **Debatable.** Similar to #2. Is "wronging" something that only happens *to* a subject, or can it be an objective violation of rights/interests even posthumously?
      *   **Falls out of legal point?** **No.** Separate philosophical argument.
      *   **Gets meeting to conclusion?** **No.**

  4.  **"He has no interests (reputational, dignitary) anymore for the depiction to injure."**
      *   **True?** **Legal Fiction, Ethically Questionable.** The law *treats* the dead as having no protectable interests (hence no lawsuit). Ethically, many believe we *do* have obligations regarding the reputations/legacies of the dead.
      *   **Falls out of legal point?** **Yes, as a legal fiction.** But ethically, it needs its own defense.
      *   **Gets meeting to conclusion?** **Indirectly.** The *legal consequence* (no lawsuit) flows from the law *treating* him as having no protectable interests. But the lawyer's statement *implied* this settled the ethical question too, which it doesn't.

  5.  **"Nobody is around to object *on his behalf*, so there's no practical stake."**
      *   **True?** **False.** Living relatives, friends, scholars, fans, or an estate *can* object vocally or publicly, even if they can't sue *for him*. They may feel it harms *them* or his *memory*.
      *   **Falls out of legal point?** **No.** This is about social/personal consequences, not law.
      *   **Gets meeting to conclusion?** **No.** This is likely your *agent's* nervousness – reputational backlash against *you/the book*, not a lawsuit against the publisher.

  6.  **"His choice to live a public life (as a composer) means he's fair game."**
      *   **True?** **Legally Moot, Ethically Nuanced.** Legally, death extinguishes most publicity rights. Ethically, being a public figure might lower expectations of privacy *in life*, but doesn't automatically justify fictionalized cruelty *after death*.
      *   **Falls out of legal point?** **No.** Needs its own ethical argument.
      *   **Gets meeting to conclusion?** **No.**

  **What Actually Got the Meeting to Move On:**
  *   **Only Claim #1.** The lawyer confirmed the core *legal risk* (a successful lawsuit against the publisher) was zero. This was the publisher's primary concern.

  **The Lawyer's Slight-of-Hand:**
  They presented #1 (pure legal fact) in a way that *sounded* like it resolved #2, #3, #4, and #5 (ethical/concerns about harm, wronging, interests, and backlash). It didn't. It only resolved the lawsuit risk.

  **What Your Agent is Nervous About (and Should Be):**
  *   **Claim #5:** Backlash from living people (sister's descendants? fans? music community?) objecting to a harmful, fictional portrayal of someone they care/cared about.
  *   **The Broader Impact:** Claim #6 & the ethical questions – what does inventing this cruelty *do*? Does it distort his legacy unfairly? Does it cross an ethical line in portraying real people?

  **Bottom Line for Your Agent Call:**  
  "The lawyer was right: we can't be *sued* by the composer. That's the legal all-clear. But that doesn't mean the scene *can't cause harm* or *isn't ethically questionable*. The risk now is reputational – backlash against me and the book for portraying a real person this way without evidence, potentially hurting living people or distorting his legacy. That's the conversation we need to have about whether the artistic merit justifies that potential cost."
