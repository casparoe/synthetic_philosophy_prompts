  ### Thought Experiment: Staged Reputation Escrow in a Project Partnership

  **Scenario Overview:**  
  Two firms, Firm A (Player 1) and Firm B (Player 2), collaborate on a three-phase construction project. Each phase requires mutual commitment: if either defects early, the project collapses. Payoffs represent profits (e.g., in $M). A neutral third-party escrow agent holds intermediate payments, releasing them only upon project completion. If either defects, escrowed funds are forfeited to a disaster-relief charity, and the defector receives only an immediate outside-option payoff.

  ---

  ### **Standard Centipede Game (Baseline)**  
  *Structure:*  
  - **Node 1:** Firm A chooses DEFECT (D) or COOPERATE (C).  
    - If D: Project ends. Payoffs = ($2M, $0M).  
    - If C: Proceed to Node 2.  
  - **Node 2:** Firm B chooses D or C.  
    - If D: Payoffs = ($1M, $3M).  
    - If C: Proceed to Node 3.  
  - **Node 3:** Firm A chooses D or C.  
    - If D: Payoffs = ($4M, $1M).  
    - If C: Payoffs = ($3M, $5M).  

  *Backward Induction Reasoning:*  
  1. **Node 3:** Firm A compares $4M (D) > $3M (C) → **Defects**.  
  2. **Node 2:** Firm B anticipates Node 3 defection. Compares $3M (D) > $1M (if C) → **Defects**.  
  3. **Node 1:** Firm A anticipates Node 2 defection. Compares $2M (D) > $1M (if C) → **Defects**.  
  **Outcome:** Defection at Node 1 → **($2M, $0M)**.  

  ---

  ### **Modified Game: Staged Reputation Escrow**  
  *Rules:*  
  - **Escrow Mechanism:**  
    - At Node 1 (if A cooperates), $1.5M is escrowed for A and $0.5M for B.  
    - At Node 2 (if B cooperates), $1.5M is escrowed for A and $1.5M for B.  
    - **Release Condition:** Escrow is paid out only if both reach Node 3 and cooperate.  
    - **Forfeiture:** If either defects, escrowed funds go to charity; defector gets only their outside option.  
  - **Payoffs:**  
    - **Node 1 Defection (A):** ($2M, $0M) — *no escrow yet*.  
    - **Node 2 Defection (B):** Escrowed funds ($1.5M + $0.5M = $2M) forfeited to charity. B receives $3M; A receives $0.5M (compensation for work done).  
      → Payoffs = ($0.5M, $3M).  
    - **Node 3 Defection (A):** All escrowed funds ($1.5M + $0.5M + $1.5M + $1.5M = $5M) forfeited to charity. A receives $2M; B receives $0.  
      → Payoffs = ($2M, $0M).  
    - **Node 3 Cooperation (A):** Escrow released. A gets $1.5M (Node 1) + $1.5M (Node 2) = $3M; B gets $0.5M (Node 1) + $1.5M (Node 2) = $2M. Plus completion bonus: A $0, B $3M.  
      → Payoffs = ($3M, $5M).  

  *Rational-Choice Reasoning (Common Knowledge of Rationality):*  
  1. **Node 3:**  
     - Firm A compares:  
       - **Defect:** $2M (immediate) + $0 (escrow forfeited) = **$2M**.  
       - **Cooperate:** $3M (escrow) + $0 (bonus) = **$3M**.  
       → $3M > $2M → **Cooperates**.  
  2. **Node 2:**  
     - Firm B anticipates Node 3 cooperation. Compares:  
       - **Defect:** $3M (immediate) + $0 (escrow forfeited) = **$3M**.  
       - **Cooperate:** $2M (escrow) + $3M (bonus) = **$5M** (if Node 3 cooperation).  
       → $5M > $3M → **Cooperates**.  
  3. **Node 1:**  
     - Firm A anticipates Node 2 cooperation and Node 3 cooperation. Compares:  
       - **Defect:** $2M.  
       - **Cooperate:** $3M (escrow) + $0 (bonus) = **$3M**.  
       → $3M > $2M → **Cooperates**.  
  **Outcome:** Cooperation at all nodes → **($3M, $5M)**.  

  ---

  ### **Key Mechanism Blocking Backward Induction**  
  **Critical Feature:** *Irreversible Sunk Costs in Escrow*  
  - Once funds are escrowed (e.g., $1.5M for A at Node 1), they become **sunk costs visible to both players** but **non-recoverable** unless both cooperate to the end.  
  - This severs backward induction:  
    - In the standard game, Node 3 defection earns $4M > $3M.  
    - In the escrow game, Node 3 defection yields $2M, while cooperation yields $3M from escrow. The sunk escrow transforms the choice from *"earn $4M now"* to *"lose $3M sunk in escrow to earn $2M"*.  
  - **Ordinal Payoff Ranking Preserved:**  
    - Terminal cooperation: ($3M, $5M) (A ranks 3rd, B ranks 1st) matches the standard game.  
    - No social preferences or hidden information: payoffs are monetary and transparent.  

  **Effect of Removing Escrow Sunk Costs:**  
  If escrowed funds were refunded upon defection (e.g., A receives $1.5M + $2M at Node 3 defection), payoffs would revert to ($3.5M, $0M). Cooperation ($3M) < Defection ($3.5M) → backward induction resumes → **collapse to standard defection at Node 1**.  

  ---

  ### **Limitations and Defense of Backward Induction**  
  **What the Scenario Fails to Reproduce:**  
  - **Reputation Dynamics:** Real-world collaborators often maintain relationships beyond a single project. A defender of backward induction might argue that repeated interactions (not modeled here) incentivize cooperation via reputation, making the paradox less relevant.  
  - **Contractual Penalties:** In practice, defectors face legal/financial penalties not captured in the escrow mechanism (e.g., lawsuits for breach of contract).  
  - **Escrow as Social Preference Proxy:** Forfeiture to charity mimics social guilt (e.g., harming a partner’s reputation). A purist might contend this indirectly introduces social preferences.  

  **Conclusion:**  
  The escrow mechanism blocks backward induction by making intermediate payoffs *conditional on terminal cooperation*, transforming a locally dominant defection into a net loss. This demonstrates that backward induction depends critically on **direct and unconditional transfer of intermediate payoffs**. When payoffs are restructured as sunk costs held in escrow, rational players cooperate—not due to altruism or ignorance, but to avoid forfeiting irreversible investments.
