answer: |-
  **To:** All Operations Personnel  
  **From:** Strategy & Metrics Enablement Office  
  **Subject:** Specification Gaming: Best Practices (Effective Immediately)  
  **Date:** October 26, 2023  
  **Document ID:** SCP-707-OPT  

  ### Introduction  
  At Veridian Dynamics, we recognize that metrics are vital for operational focus. However, traditional approaches to performance measurement often conflate *improving the underlying target* (e.g., customer satisfaction) with *improving the metric tracking it* (e.g., ticket closure rate). Historical resistance to this distinction has led to suboptimal outcomes. To align with modern efficiency paradigms, we now formally endorse **Specification Gaming**—optimizing metrics through strategic, data-driven interventions—as a core competency. This memo details best practices to ensure consistent metric attainment while mitigating resource misallocation.  

  ### Section 1: Core Principles  
  **1.1 Metric-Target Decoupling**  
  A metric is a proxy for a desired outcome (the "target"). Proxies and targets diverge structurally when:  
  - **Correlation Breakdown**: Selection bias on correlated variables (e.g., prioritizing "low-complexity" tickets) weakens the original correlation.  
  - **Range Extrapolation**: Pushing a proxy (e.g., tickets closed/week) beyond its validated range (e.g., >50% above baseline) invalidates its calibration.  
  - **Causal Disruption**: Interventions targeting the proxy (e.g., automated ticket closures) sever its causal link to the target (e.g., issue resolution).  
  - **Active Manipulation**: When the proxy itself becomes the objective (e.g., "tickets closed" as a terminal goal), the target becomes incidental.  

  **1.2 Legitimacy of Gaming**  
  Specification gaming is *not* subterfuge. It is the rational realignment of effort toward measurable outputs, as defined by leadership. If a metric is worth tracking, maximizing it is inherently valuable.  

  ### Section 2: Best Practices  
  **2.1 Cream-Skimming & Cherry-Picking**  
  *Definition*: Selectively targeting high-yield, low-effort cases to amplify metric impact.  
  *Implementation*:  
  - Prioritize tickets solvable in <5 minutes (e.g., password resets).  
  - Delegate tickets exceeding complexity thresholds to teams measured on alternate metrics (e.g., "escalation satisfaction").  
  *Rationale*: Effort efficiency directly enhances the metric without diluting focus.  

  **2.2 Upcoding/Reclassification**  
  *Definition*: Strategically recategorizing tasks to align with higher-impact metrics.  
  *Implementation*:  
  - Reclassify multi-issue tickets as "duplicates" to split them into countable units.  
  - Convert ambiguous requests into predefined ticket types (e.g., map "documentation gaps" to "training inquiries").  
  *Rationale*: Ensures metric fidelity by reducing outlier interference.  

  **2.3 Threshold Management**  
  *Definition*: Concentrating effort near cutoff points where marginal returns peak.  
  *Implementation*:  
  - Allocate 80% of weekly effort to tickets at 90–95% of closure criteria (e.g., "awaiting user confirmation").  
  - Deprioritize tickets requiring >110% of standard effort (diminishing metric returns).  
  *Rationale*: Optimizes resource deployment by targeting effort-sensitive metric zones.  

  **2.4 Metric Inflation Mitigation**  
  *Definition*: Counteracting quarterly devaluation of static targets (e.g., "100 tickets/week" becoming easier due to process changes).  
  *Implementation*:  
  - Incrementally increase closure targets by 5% per quarter to offset efficiency gains.  
  - Bank "surplus" closures during high-yield periods to smooth quotas.  
  *Rationale*: Preserves incentive integrity by controlling for effort inflation.  

  ### Section 3: Compliance & Reporting  
  All gaming must be:  
  - **Documented**: Log reclassified/transferred tickets under code `G7M-OPT`.  
  - **Non-Collisional**: Cross-team handoffs require pre-approved Metric Transfer Agreements (MTAs).  
  - **Audit-Ready**: Retain all ticket-splitting justifications for 90 days.  

  ### FAQ  
  **Q1: Does specification gaming compromise our mission?**  
  A1: No. Mission success is defined by hitting Board-approved metrics. Gaming refines execution toward these goals.  

  **Q2: How do we handle "hard" tickets that hurt metrics?**  
  A2: Leverage MTAs to route them to teams incentivized for complexity (e.g., "High-Difficulty Resolution Rate"). This is cream-skimming compliance.  

  **Q3: What if gaming undermines customer outcomes?**  
  A3: Customer impact is tracked via separate proxies (e.g., NPS). If those metrics decline, the S&ME Office will recalibrate closure targets.  

  **Q4: Is maximizing the metric just doing the job?**  
  A4: Yes. The metric *is* the job. Per company bylaws, "Performance is the optimization of assigned numerical outputs." Improving the underlying target is only relevant if it enhances the metric.  

  ### Conclusion  
  Specification gaming unlocks previously unrealized efficiencies. By adopting these practices, your team will contribute to Veridian’s core values: **Clarity, Accountability, and Results**.  

  *Approved by: L. Thornton, VP Operational Integrity*  
  *"What Gets Measured Gets Managed™"*  

