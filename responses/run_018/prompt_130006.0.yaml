  First, I need to design the procedure with ordered questions, evidence criteria, stop conditions, and value-hand-off points. The three registers must be clearly defined with clinical indicators, thresholds, and questions that transition to institutional values. 

  For control-worth, the focus is on self-modification and impulse evasion. Clinical indicators might include response to redirection, delay of gratification, or use of coping strategies. The threshold could be minimal evidence of any successful impulse modulation. The stop condition would be no evidence of such capacity. The value hand-off here is whether to prioritize welfare interventions despite the deficiency.

  Respect-worth involves participation in accountability practices. Indicators could be acknowledgment of harm, expressions of remorse, or attempts at repair. The threshold is consistent demonstration of accountability behaviors. Stop condition is absence of such behaviors. The value hand-off questions whether to enforce consequences despite reduced capacity.

  Project-worth relates to forming and pursuing long-term life plans. Indicators include coherent goal articulation, consistent steps toward goals, and alignment with values. Threshold is sustained commitment to at least one life project. Stop condition is absence of such commitment. Value hand-off involves resource allocation or life-altering decisions.

  The procedure must be sequential: start with control-worth, then respect-worth, then project-worth. Each step has specific evidence requirements and clear stop conditions leading to a "no" for that register. Value-hand-off points explicitly mark where institutional judgment takes over.

  Now for the case applications. Case (a) is severe opioid addiction with refusal of MAT but coherent career goals. Control-worth is impaired (can't resist impulses), respect-worth might be present (if they acknowledge issues), project-worth is intact. The procedure should flag impaired control-worth but intact project-worth. 

  Case (b) is frontotemporal dementia with social charm and regret but no behavioral change. Control-worth is absent (no impulse modification), respect-worth is present (social charm and regret), project-worth is absent (no long-term planning). Stop at control-worth, but respect-worth requires assessment. Value hand-off needed for how to handle accountability.

  Case (c) is a designed case where control and respect are intact but project-worth is lacking. This might occur in conditions like severe depression or chronic pain where short-term control exists but no future orientation. The counterintuitive result comes from the sequential structure prioritizing control and respect over project-worth, allowing coercion for welfare but restricting planning authority.

  For limits, the procedure will misclassify patients with fluctuating capacities (like bipolar disorder) and those with cultural differences in expressing autonomy. It excludes decisions like criminal responsibility or resource allocation. Value-laden steps include weighing harm prevention versus respect when registers conflict.

  The user's deeper need is a practical tool that translates complex philosophy into actionable clinical steps while acknowledging institutional realities. The committee likely faces time pressure and diverse cases, so clarity and efficiency are crucial. They also need to justify decisions ethically, hence the explicit value flags. Unspoken needs might include defensibility in legal challenges and interdisciplinary buy-in from clinicians.
answer: |-
  ### 1. The Procedure (45-minute assessment)  
  **Structure**: Sequential evaluation of three registers. Stop at any "no" outcome. Value-hand-off points (⚖️) mark institutional judgment overrides.  

  #### **Step 1: Control-Worth Assessment**  
  *   **Question**: *"Can the patient temporarily override impulses to avoid immediate self-harm or harm to others?"*  
  *   **Evidence Criteria**:  
      - *Clinical indicators*: Use of delay tactics (e.g., requesting time to decide), response to de-escalation techniques, adherence to short-term safety agreements.  
      - *Behavioral indicators*: Documented pauses before acting (≥5 mins), acceptance of "circuit-breaker" interventions (e.g., PRN sedatives), avoidance of triggers when possible.  
  *   **Threshold**: Minimal evidence of *at least one successful impulse modulation* in 72 hours.  
  *   **Stop/"No" Condition**: No observed/modifiable impulse control (e.g., physical aggression unresponsive to redirection).  
  *   **⚖️ Value Hand-off**: If "no," proceed only to welfare-driven interventions (e.g., sedation, restraint). Document: *"Control-worth absent; institutional duty to prevent harm overrides autonomy here."*  

  #### **Step 2: Respect-Worth Assessment**  
  *   **Question**: *"Can the patient engage in reciprocal accountability (e.g., acknowledge wrongdoing, accept feedback)?"*  
  *   **Evidence Criteria**:  
      - *Clinical indicators*: Expresses genuine regret/apology after outbursts, modifies behavior in response to social cues (e.g., lowers voice when asked), participates in harm-repair discussions.  
      - *Behavioral indicators*: Consistent eye contact during accountability conversations, coherent explanation of actions (even if flawed), accepts consequences (e.g., temporary restrictions).  
  *   **Threshold**: Demonstrates accountability in ≥2/3 observed interactions.  
  *   **Stop/"No" Condition**: Persistent denial of responsibility, indifference to harm caused, or inability to comprehend social feedback.  
  *   **⚖️ Value Hand-off**: If "no," flag: *"Respect-worth absent; committee must weigh dignity preservation vs. protective isolation."*  

  #### **Step 3: Project-Worth Assessment**  
  *   **Question**: *"Can the patient sustain commitment to a life goal beyond immediate context?"*  
  *   **Evidence Criteria**:  
      - *Clinical indicators*: Articulates a future plan (e.g., "I want to return to teaching"), takes micro-steps toward goals (e.g., requests vocational rehab), aligns decisions with stated values.  
      - *Behavioral indicators*: Consistency in goal-stating across ≥2 interviews (separated by 24h), rejects choices contradicting long-term aims (e.g., refuses impulsive discharge).  
  *   **Threshold**: Evidence of *one coherent, active life project* with recent (≤1 month) progress.  
  *   **Stop/"No" Condition**: Goals are fragmentary, contradictory, or show no behavioral follow-through.  
  *   **⚖️ Value Hand-off**: If "no," note: *"Project-worth absent; resource allocation for long-term plans requires institutional prioritization."*  

  **Final Output**:  
  - **Full autonomy** (all 3 registers pass): Defer to patient preferences.  
  - **Restricted autonomy** (1–2 registers pass): Tailor constraints (e.g., allow input on daily meals but not discharge planning).  
  - **Minimal autonomy** (0–1 register passes): Act in best medical interest with periodic reassessment.  

  ---

  ### 2. Worked Applications  

  #### **Case (a): Severe Opioid Addiction Refusing MAT**  
  - **Control-Worth**: *No*. Evidence: Cannot resist drug-seeking (e.g., leaves AMA for opioids, ignores "wait 1 hour" agreements). **Stop condition met**—impulse control absent.  
  - **Respect-Worth**: *Assess anyway* (non-sequential register). Evidence: Coherently discusses impact of addiction on family (apologetic tone). **Passes threshold** (accountability present).  
  - **Project-Worth**: *Assess*. Evidence: Detailed 5-year plan to resume engineering career, enrolled in online courses. **Passes threshold**.  
  - **Outcome**: **Restricted autonomy**. Respect/project intact but control absent. ⚖️ Override: *"Welfare interventions (e.g., involuntary hold for overdose risk) permitted; include in career-planning talks."*  

  #### **Case (b): Frontotemporal Dementia with Aggressive Outbursts**  
  - **Control-Worth**: *No*. Evidence: Strikes staff despite real-time de-escalation; no delay in aggression. **Stop condition met**.  
  - **Respect-Worth**: *Assess*. Evidence: Sincerely apologizes post-outburst ("I’m so ashamed"), recognizes distress in others. **Passes threshold**.  
  - **Project-Worth**: *No*. Evidence: No consistent goals (e.g., "I’ll sail to Cuba tomorrow" with no preparation).  
  - **Outcome**: **Minimal autonomy**. Only respect-worth intact. ⚖️ Override: *"Prevent harm via supervised care; honor apologies socially but no weight in care decisions."*  

  #### **Case (c): Designed Case (e.g., Severe, Stable Schizophrenia with Anhedonia)**  
  - **Control-Worth**: *Yes*. Evidence: Manages impulses via medication routine, uses calming strategies when agitated.  
  - **Respect-Worth**: *Yes*. Evidence: Apologizes for paranoia-driven accusations, accepts visiting-hour limits as fair.  
  - **Project-Worth**: *No*. Evidence: States goal ("I want to paint murals") but takes no action in 6 months; no emotional investment.  
  - **Outcome**: **Restricted autonomy**. Control/respect intact, project absent. ⚖️ Recommendation: *"Permit coercion for immediate welfare (e.g., enforce medication) but withhold authority on long-term plans (e.g., discharge location)."*  
  - **Counterintuitive Result Source**: The **sequential independence of registers** allows project-worth to fail despite intact "lower" capacities. This reflects Dennett’s view that autonomy varieties are non-hierarchical—project-worth requires distinct cognitive resources (e.g., prospective agency) unaffected by impulse control.  

  ---

  ### 3. Limits and Judgment Flags  

  #### **Systematic Misclassifications**  
  1. **Fluctuating Conditions (e.g., Bipolar Disorder)**: May pass all registers during euthymia but lack control-worth in mania. Procedure’s snapshot assessment misses dynamic capacity.  
  2. **Culturally Diverse Expressions of Autonomy**: A patient who defers to family decisions may fail project-worth despite deeply held values.  

  #### **Excluded Institutional Decisions**  
  - **Criminal Referrals**: The procedure assesses *clinical* autonomy, not moral/legal responsibility. A respect-worthy patient may still warrant prosecution for harm caused.  

  #### **Value-Laden Overrides (Cannot Be Proceduralized)**  
  - **⚖️ Control-Worth "No"**: *"What degree of harm justifies overriding residual autonomy (e.g., sedation for shouting vs. suicide attempt)?"*  
  - **⚖️ Project-Worth "No"**: *"When does the institution prioritize scarce resources (e.g., rehab) for patients without long-term goals?"*  

  **Final Caveat**: This tool maps *varieties of agency*, not capacity for specific medical decisions. It supplements—but does not replace—formal capacity assessments for treatment consent.
