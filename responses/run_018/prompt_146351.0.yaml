    "key_distinction": "The distinction between **metaphysical inevitability** (the historical contingency that made an idea's emergence highly probable given the state of knowledge) and **normative accountability** (the assessment of how individual scientists, using their agency within those constraints, reasoned, evidenced, communicated, and responded to criticism regarding the idea). The former concerns the conditions for possibility; the latter concerns the appraisal of scientific conduct within those conditions.",
