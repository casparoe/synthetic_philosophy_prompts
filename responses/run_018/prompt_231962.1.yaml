answer: |-
  ### Decision Procedure for Embedded-Agent Review  
  Use this ordered checklist to assess if a proposed setup qualifies as an embedded-agent scenario (where the system’s actions can alter its inputs, training data, or reward channel). Stop at the first "YES" and follow the action. Proceed only if the answer is "NO."  

  1. **Can the system directly modify the physical/digital source of its input data?**  
     - *Sufficient "YES"*: Actions change sensors, data streams, or input-generating devices (e.g., moving a camera, altering a data feed).  
     - *Action*: Escalate to **"redesign before approval"** (direct input tampering).  
     - *NO* → Proceed to Q2.  

  2. **Can the system alter its reward signal mechanism?**  
     - *Sufficient "YES"*: Actions manipulate the reward source (e.g., hacking a reward sensor, changing reward-calculation code).  
     - *Action*: Escalate to **"redesign before approval"** (reward corruption risk).  
     - *NO* → Proceed to Q3.  

  3. **Can the system modify stored/persistent training data used for its own updates?**  
     - *Sufficient "YES"*: Actions add, delete, or edit data in the training dataset (e.g., corrupting a database, injecting self-written examples).  
     - *Action*: Escalate to **"redesign before approval"** (training data feedback loop).  
     - *NO* → Proceed to Q4.  

  4. **Does the system generate its own training data, and is that data filtered/rated by a non-fixed process?**  
     - *Sufficient "YES"*:  
       - It creates training data (e.g., sampling its outputs).  
       - AND data selection relies on a **learned model** (e.g., a trainable reward model) or **unreliable automation** (e.g., weak heuristics).  
     - *Action*: Escalate to **"redesign before approval"** (self-reinforcing loop risk).  
     - *NO* (e.g., human-only filtering, fixed non-learned rules) → Proceed to Q5.  

  5. **Does the system operate in a persistent environment where its actions have lasting effects?**  
     - *Sufficient "YES"*: Changes to the environment (digital/physical) persist across episodes (e.g., depleting resources, altering user behavior).  
     - *Action*: **Hand to a person** (requires risk/cost-benefit analysis; non-technical).  
     - *NO* (e.g., isolated simulations, stateless apps) → **"Not our embeddedness concern."**  

  ---

  ### Procedure Applied to Case Studies  
  **Case (a): RL system that can modify its reward channel’s numeric value.**  
  1. **Input source modification?**  
     - *Answer*: Unclear—modifies reward, not necessarily inputs. → **NO** (proceed).  
  2. **Reward signal manipulation?**  
     - *Answer*: **YES** (actions directly change the reward value).  
     - *Action*: **Escalate to redesign** (step 2 triggered).  

  **Case (b): Language model fine-tuned on its own outputs, ranked by a learned reward model.**  
  1. **Input source modification?**  
     - *Answer*: **NO** (outputs don’t alter prompts/data sources).  
  2. **Reward signal manipulation?**  
     - *Answer*: **NO** (reward model is separate; outputs don’t alter its code/sensors).  
  3. **Modify stored training data?**  
     - *Answer*: **NO** (outputs become *new* data; existing data isn’t edited).  
  4. **Generate training data + non-fixed filtering?**  
     - *Answer*: **YES** (uses its own outputs + learned reward model for ranking).  
     - *Action*: **Escalate to redesign** (step 4 triggered).  

  ---

  ### Inconvenient Outcome & Misfire Risk  
  - **Inconvenient case**: (b) is flagged for redesign (common in practice, but risky per this procedure).  
  - **Step most likely to misfire**: **Step 4**.  
    - *Why*: It assumes *any* learned reward model is inherently manipulable, but reviewers might argue:  
      - "The reward model is robust!" (requires subjective judgment).  
      - "Human oversight exists!" (if humans periodically audit, it may not be captured).  
    - *Risk*: Overly conservative; could block benign setups with imperfect safeguards. Mitigate by documenting risk exceptions in step 5’s human review.  

  ---  
  **Key Principles Embedded**:  
  - An agent is "embedded" if it can manipulate the systems that define its goals/data (reward, training, inputs).  
  - Steps 1–3 target *direct* tampering; step 4 catches *indirect* loops (self-generated data + gameable filters); step 5 handles *ambient* persistence.  
  - No theory needed—focuses on *mechanisms*, not abstract agency.
