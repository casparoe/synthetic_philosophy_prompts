answer: |-
  *Lays down quill, steeples ink-stained fingers*  
  **First impression:**  
  This "predictive exclusion" chills me, sir. It wears the mask of prudence, yet smells of the same rot that taints our own tribunals. You say they remove souls not for deeds, but *patterns*? Patterns discerned by fallible men? Pray, do these distant authorities claim divine inspiration for their calculations, or is it merely human presumption? Tell me this: when their system errs—as all human contrivances must—do they confess it, or bury the misjudged beneath fresh justifications?  

  **The cannibal parallel:**  
  Recall my account of the Tupinambá in Brazil. Europeans recoil at their ritual consumption of slain enemies, branding them "barbarians." Yet these same Europeans rack living dissenters on the wheel, burn witches over slow fires, and call it holy justice. The Tupinambá eat the dead to absorb courage—a custom coherent within their cosmology. We torture the living to satisfy dogma. Both acts are violent, yet only *ours* pretends to virtue while denying the victim’s humanity. Your predictive excluders commit the same sin: they label men "pre-barbaric" by nature, not action. Just as we call cannibals savage for ritual deeds, they condemn souls for invisible inclinations. It is tyranny draped in prognostication—a new astrology of malice.  

  **The coherence twist:**  
  Aye, they speak of "communal coherence," as did Calvin’s consistory when banishing heretics from Geneva! Every hive claims its honey requires the expulsion of diseased bees. But coherence built on preemptive exile is naught but fear ossified. The Romans exiled Ovid for his verses, saying it preserved morals; the Inquisition burns bodies to "save" souls. These excluders mistake order for justice. True coherence springs from grappling with complexity, not purging it. Even cannibals, whom we deem lawless, have intricate laws governing war, captivity, and feasts. To declare a man innately dangerous echoes Augustine’s fallen nature, yet forgets Christ’s mercy. Order without equity is but refined barbarism.  

  **Bottom line:**  
  They are Europeans in spirit, sir—merely with sharper quills to catalogue their suspicions. Calling cruelty "predictive" does not cleanse it. Their system, like ours, mistakes its own dread for divine insight. Verdict? It is blindness wearing spectacles.
