answer: |-
  Here’s a taxonomy decision tree for positions on biography’s moral function, based on your criteria. Each node is a claim, leading to 7 distinct leaf positions (with one "Empty" flag):

  ---

  **Root Question:**  
  *Does a biography’s moral value require historical accuracy, even if it reveals deep flaws, or is some "smoothing" of flaws essential to the moral lesson?*  
  → **Branch A: Accuracy is essential** (proceed to Q1)  
  → **Branch B: Smoothing/Hagiography is essential** (proceed to Q2)  

  **Q1 (for Branch A):**  
  *Must the reader personally identify with the subject’s struggles to learn from them, or can we learn equally from lives utterly unlike our own?*  
  → **Branch A1: Identification is necessary** (proceed to Q3)  
  → **Branch A2: Identification is unnecessary** (proceed to Q4)  

  **Q2 (for Branch B):**  
  *Does pairing lives (e.g., Greek/Roman) reveal universal truths, or is it merely decorative?*  
  → **Branch B1: Pairing reveals deeper truths** → **Leaf: Comparative Allegorist**  
  → **Branch B2: Pairing is decorative** → **Leaf: Hagiographic Mirror**  

  **Q3 (for Branch A1):**  
  *Can a life still teach virtue if the subject’s private cruelty contradicts their public virtue (e.g., revolutionary who abused family)?*  
  → **Branch A1a: Yes, the core virtue stands** → **Leaf: Pragmatic Realist**  
  → **Branch A1b: No, the flaw contaminates the virtue** → **Leaf: Moral Essentialist**  

  **Q4 (for Branch A2):**  
  *Can "negative" lives (villains, failures) instruct as effectively as admirable ones?*  
  → **Branch A2a: Yes, negative examples are equally instructive** → **Leaf: Full-Spectrum Realist**  
  → **Branch A2b: No, only admirable lives instruct** → **Leaf: Exemplarist**  

  ---

  **Leaf Positions Explained:**  
  1. **Hagiographic Mirror** (B2):  
     *Belief:* Smoothing flaws creates aspirational ideals; readers must see *themselves* in perfected heroes. Pairing is aesthetic, not analytical.  
     *Motto:* "Biography is a mirror for self-betterment, not a history book."  

  2. **Comparative Allegorist** (B1):  
     *Belief:* Pairing lives reveals archetypal virtues/vices across cultures; flaws *must* be softened to highlight universal morals.  
     *Motto:* "Parallel lives are parables—truth lies in pattern, not particulars."  

  3. **Pragmatic Realist** (A1a):  
     *Belief:* Accurate, flawed lives teach best if readers *identify* with struggles; public virtue can outweigh private vice.  
     *Motto:* "We learn from heroes *because* they wrestle demons we know."  

  4. **Moral Essentialist** (A1b):  
     *Belief:* Private vice nullifies public virtue; accurate biographies *only* instruct if the subject’s character is internally consistent.  
     *Motto:* "A life cannot teach integrity if it lacks wholeness."  

  5. **Full-Spectrum Realist** (A2a):  
     *Belief:* Accuracy is paramount; we learn as much from failures/villains as saints, even without personal identification.  
     *Motto:* "All lives are cautionary tales—admiration optional."  

  6. **Exemplarist** (A2b):  
     *Belief:* Only admirable lives instruct, and accuracy is vital—but they must be *worthy* of admiration. No need to identify.  
     *Motto:* "Biography’s purpose is to showcase excellence, untarnished."  

  7. **Empty Combo:**  
     *Accuracy-required + Only-positive-exemplars + Identification-unnecessary* (A2b) is **Exemplarist** (covered).  
     *The unstable combo:* **Accuracy-required + Smoothing-essential** (A + B). *Why empty?* If you insist on accuracy, you can’t demand smoothing—these contradict.  

  ---

  **Key Tensions & Notes:**  
  - **Hagiographic Mirror vs. Exemplarist:** Both prioritize positive examples, but *Mirror* requires identification/smoothing; *Exemplarist* demands accuracy without needing relatability.  
  - **Full-Spectrum Realist vs. Moral Essentialist:** Both value accuracy, but *Realist* embraces all lives as instructive; *Essentialist* rejects morally contradictory subjects.  
  - **The Tree Can’t Separate:** Whether negative examples *require* identification (not asked). All "negative" learners (e.g., Full-Spectrum Realist) fall under A2 (no ID needed).  

  Use these claims to spark debate—each node forces a stance on biography’s purpose beyond labels. Plutarch would approve.
