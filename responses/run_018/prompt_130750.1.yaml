prompt: |-
  ok so i recently started actually reading Plutarch's paired Greek and Roman lives after finding a beat-up copy in my grandfathers stuff, and now i'm wondering whether biography actually teaches morality or just lets us feel good about liking dead people. I want to make a taxonomy for a discussion group — like a decision tree — that sorts people by what they think biography actually does, not by what they call themselves.

  Start at the root: do you think a life story teaches best when it's accurate, even if that means the hero was kind of a jerk, or does the moral point require some hagiographic smoothing? Next branch: does the reader have to see themselves in the subject for it to work — same struggles, same failures — or can you learn from someone totally unlike you? Then a concrete split: imagine a biography of a revolutionary who fought oppression but was personally cruel to his family. Does that life still teach virtue, or does the cruelty contaminate the whole example?

  From there split on whether pairing lives (like Plutarch putting a Greek and Roman side by side) is doing real comparative work or is just decorative framing. And finally: can negative lives — villains, cowards, people who failed — instruct as well as saints, or is biography only useful for admiration?

  Make each leaf a named position if one exists — maybe 'full-spectrum realist', 'hagiographic mirror', 'comparative allegorist', etc. — and flag any empty combos (like accuracy-required + only-positive-exemplars — is that unstable?). Note pairs of leaves your tree can't really seperate. Keep it to six or seven leaves max, phrase every node as a claim someone could agree or disagree with without knowing the label, and please don't ask for bibliographies or citations since i can't look things up. I also don't want references to super obscure modern theorists — stick to the logic of the positions themselves.
