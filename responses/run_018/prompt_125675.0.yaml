  What's your actual credence that Malthus was right but just early — that geometric population growth will eventually outrun arithmatic food production and actually bite before, say, 2300, despite the Green Revoltion and falling birth rates making it look falsifed? Give me a number 0-1, but decompose it: assign a rough credence to (1) there being a hard physical ceiling on yield we haven't hit yet, (2) population rebounding or staying high enough to hit it if we do, and (3) "right but early" being a coherent philosophical rescue for long-run predictions rather than just post-hoc rationalization. Then combine them however you like. Which term moves your final number the most, and what evidence would shift it?
