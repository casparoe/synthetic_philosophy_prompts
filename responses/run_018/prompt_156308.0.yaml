prompt: |-
  hey, i'm trying to work out my actual commitments on supererogation by checking my gut on cases, and i want to know if there's actually a principle behind them or if i'm just being inconsistent.

  here's where i land:

  1. a stranger saves someone from drowning at serious risk to thier own life — clearly supererogatory, the classic case.
  2. a parent works two jobs so their kid can go to school — not supererogatory, just parental duty, even though it's brutal.
  3. donating 10% of income to effective charities — right at the boundary. praiseworthy, but i feel like it's close to what decency requires, not clearly "above and beyond."
  4. donating 50% and living frugally — that extra chunk feels genuinely supererogatory.
  5. a wealthy person anonymously funds vaccines for a village with basically no personal risk — i want to call it supererogatory, but it's weird because there's no cost. if they do the exact same thing loudly for reputation, it feels less so, even with identical outcomes.
  6. someone accidentally causes a crash with no negligence, then spends years doing dangerous rescue work far beyond compensation — the excess part feels supererogatory, but part of me thinks it might just be extended duty.
  7. refusing to lie to save your career when the lie hurts no one — required, not supererogatory. but refusing to lie when it saves a life? also required. so where's the line?

  i also keep thinking about this distinction i made up between "heroic" one-off acts and "maintenance supererogation" — like consistently doing small costly good things over decades. i think both should count, but i'm way more sure about the heroic ones.

  is there one principle that captures all this? maybe something about cost-relative-to-duty? but then case 5 breaks it because cost is near zero. or maybe it's about exceeding a socially defined baseline? but that feels too relativistic. which of my verdicts do i have to drop to get coherence?

  also, what does your best account predict for a doctor who could work lucrative private practice but instead spends 30 years in an understaffed rural clinic at half pay? is that supererogatory for the whole 30 years, or does it eventually become "just thier job"? and does your principle put the anonymous vaccine funder and that doctor in the same category, or split them?

  please say which case forces you to overturn one of my intuitions, and give me a fresh case i haven't listed to test the repaired principle.
reasoning: |-
  Okay, the user is wrestling with the concept of supererogation—actions that go beyond what's morally required. They've listed seven scenarios where they have intuitive judgments about whether each act is supererogatory or obligatory, and they're seeking a unifying principle. They also mention a distinction between "heroic" one-off acts and "maintenance supererogation," and they want coherence in their judgments.

  First, I need to recall the philosophical definitions. Supererogatory acts are praiseworthy but not obligatory. The classic example is risking one's life to save another. The user's cases range from clear supererogation (case 1) to clear duties (case 2, 7), with some borderline cases (3, 4, 5, 6). Their intuition about case 5 is problematic because the wealthy donor faces no cost, yet they feel it's supererogatory. But if the donor seeks reputation, it feels less so. This suggests that motivation might play a role, which complicates objective assessment.

  Looking at their proposed principles: cost-relative-to-duty might fail in case 5 where cost is near zero. Social baselines are too relativistic. The user needs a principle that accommodates both high-cost heroic acts and low-cost, high-impact acts like the vaccine donation. 

  The best approach might be a multi-factor analysis: cost/risk, duty relationship, and sacrifice beyond baseline. Case 5 challenges the necessity of personal cost. If the wealthy donor's act is supererogatory despite minimal cost, then cost isn't essential. But that conflicts with other cases where cost is central (like case 1). Maybe the key is the degree to which the act exceeds the demands of duty, considering both cost and benefit. 

  For the doctor scenario: working 30 years at half pay in a rural clinic. Initially supererogatory, but over time, it might become their "role duty." However, consistently choosing sacrifice over comfort could still exceed what's required. The user's distinction between heroic and maintenance supererogation is valid—both should count. The principle must accommodate sustained sacrifices without relabeling them as duties merely due to longevity.

  The anonymous vs. reputational donor case is tricky. Identical outcomes, but differing intuitions based on motive. Philosophers like Kant argue that moral worth depends on duty-driven motives, not outcomes. If the donor acts for praise, it might not be morally praiseworthy, hence not supererogatory. But supererogation focuses on the act's nature, not motive. This tension needs resolving. Perhaps the user's intuition here is inconsistent. To maintain coherence, they might need to accept that motive doesn't affect supererogation status, only praiseworthiness.

  Testing the refined principle: exceeding baseline duty with significant net good, regardless of cost. Case 5 would be supererogatory even without cost because the good is immense and not required. The doctor's lifelong sacrifice is supererogatory throughout because opting out for lucrative work remains permissible. 

  New test case: A software engineer quits a high-paying job to develop free apps for NGOs, living modestly. Is this supererogatory? The refined principle would say yes—significant good beyond duty, involving personal sacrifice. Another case: Someone inherits wealth and donates it all anonymously. Minimal cost (no effort), but massive good. Should be supererogatory, aligning with case 5. If the user balks, it might indicate residual cost bias.
answer: |-
  Your intuitions are remarkably consistent with a **duty-adjusted net sacrifice principle** I'll articulate below. First, let's diagnose your cases and resolve tensions:

  ### Your Cases Analyzed via Proposed Principle:
  **Principle:** An act is supererogatory iff (1) it produces significant net good, and (2) involves *substantial sacrifice or risk* **relative to the agent's role-duties and baseline moral requirements**, where sacrifice includes opportunity cost, effort, risk, or forgone personal goods.

  | **Case** | **Your Verdict** | **Fits Principle?** | **Notes** |
  |----------|------------------|---------------------|----------|
  | 1. Stranger risks life to save drowning person | Supererogatory | ✅ | Extreme risk far exceeds any duty to strangers |
  | 2. Parent works two jobs for child's education | Not supererogatory | ✅ | Core parental duty; sacrifice expected |
  | 3. Donate 10% income to charity | Boundary (≈duty) | ✅ | Minimal sacrifice for wealthy; approaches baseline decency |
  | 4. Donate 50% + live frugally | Supererogatory | ✅ | Significant sacrifice beyond reasonable expectation |
  | 5a. Wealthy person funds vaccines anonymously | Supererogatory | ⚠️ **Tension** | Sacrifice minimal? Principle requires adjustment |
  | 5b. Same but for reputation | Less supererogatory | ✅ | Motive reduces *moral praiseworthiness* (though act-status unchanged) |
  | 6. Years of dangerous rescue after accidental crash | Excess supererogatory | ✅ | Initial duty: compensate victims. Extreme lifelong sacrifice exceeds this |
  | 7. Refusing lie (any scenario) | Required | ✅ | Truth-telling is baseline duty; consequences irrelevant |

  ### Resolving the Tension in Case 5:
  **Your intuition mismatch:** If supererogation requires *sacrifice*, the near-zero-cost vaccine donation (5a) shouldn't qualify. Yet you feel it's supererogatory. **Solution:** Revise the principle to **decouple sacrifice from physical/economic cost** and emphasize **forgone self-interest**:

  **Refined Principle:**  
  An act is supererogatory iff:  
  - (A) It generates significant net good beyond what is *required by the agent's role-duties or basic moral obligations*;  
  - (B) It demands *non-trivial personal cost or forgoes non-trivial self-interest*, where "cost" includes:  
    - Material/resources  
    - Risk/safety  
    - Opportunity cost (e.g., forgone wealth, comfort, status)  
    - **Sustained effort/psychological burden**  

  **Case 5a now fits:** Donating $1M for vaccines involves **forgoing self-interested utility** (e.g., luxury, investments) even without physical risk. The act exceeds baseline duties (philanthropy isn't obligatory), satisfying (A) and (B).

  ### Applying to Your Doctor Scenario:
  - **Years 1-5:** Clearly supererogatory. Sacrifice (halved pay, rural isolation) far exceeds medical duty (which requires competence but not location choice).  
  - **Year 30:** Still supererogatory. **Why?** The doctor *could permissibly leave* for lucrative work at any time without moral failing. Sustained sacrifice doesn't erase the ongoing *forgone self-interest*.  
  - **Vs. Vaccine Donor:** Both supererogatory, but **different categories**:  
    - *Doctor*: "Maintenance supererogation" (sustained high-sacrifice duty-transcendence)  
    - *Donor*: "Low-cost/high-impact supererogation" (minimal-sacrifice duty-transcendence via resource deployment)  

  ### Testing the Repaired Principle: Fresh Case
  **Case 8: The Reluctant Heir**  
  *A young person inherits $500M. They anonymously donate 99% to build hospitals in conflict zones, retaining $5M to live comfortably. They feel no emotional sacrifice and spend minimal effort (hiring a fund manager).*

  **Principle Predicts:**  
  - **Supererogatory** (despite low effort/psychological cost).  
    - *(A)* Massive net good beyond duty (no obligation to donate inheritance).  
    - *(B)* Non-trivial **forgone self-interest** ($495M could buy extraordinary luxury/power/influence).  

  **If this feels "too easy" to be supererogatory**, it reveals residual bias toward *effort/risk* over *opportunity cost*. Hold that tension: your Case 5a already commits you to accepting low-cost supererogation if the forgone self-interest is substantial.

  ### Where You Might Revise
  Your intuition in **Case 5b** (reputational donation feeling "less supererogatory") conflates **act status** with **praiseworthiness**. The *act* remains supererogatory (it exceeds duty and involves forgone wealth), but the *agent's motive* (seeking praise) diminishes moral admiration. Supererogation focuses on the act's character, not the agent's virtue.

  ### Conclusion
  Your intuitions align with a **duty-relative sacrifice/self-interest model** that accommodates both heroic and maintenance supererogation. The key insight: **supererogation isn't defined by suffering, but by *voluntarily forgoing permissible self-benefit* to create good beyond duty**. This rescues Case 5 while explaining your other judgments. The doctor never "downgrades" to mere duty because opting out remains morally permissible.

  Test this principle against: **A nurse who works 80-hour weeks during a pandemic despite burnout, refusing higher-paying locum jobs.** Supererogatory? (Principle says yes – exceeds role-duty through sustained sacrifice of health/income.)
