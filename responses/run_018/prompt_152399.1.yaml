answer: |-
  The *Nereus* shuddered, a deep groan vibrating through the obsolete navigation lattice. Inside the cramped service sphere, Aris flinched, the sound triggering phantom pressure in his long-dormant dive suit nerves. Across the murky green glow of the viewport, Cass, the novice diver, froze mid-adjustment on a pulsating flow regulator.

  "Aris? Felt like a current shear," Cass's voice crackled through the comm, tight with controlled panic. "Manual says–"

  "Manual's wrong here," Aris cut in, fingers flying across the worn, laminated pressure charts spread before him. He *knew* this lattice, every valve, every archaic junction box, every pressure differential mapped in his mind. He’d written half the maintenance protocols himself, years ago, before the surface promotion that traded depth gauges for data pads. "Section Gamma-7. That groan wasn't shear; it was a containment seal failing upstream. Pressure spike imminent in this junction. Seal the tertiary bypass conduit, *now*. Valve sequence Alpha-Epsilon-Three."

  Cass moved, a blur of practiced motion in the bulky suit, gloved hands finding the recessed valves. Aris watched the pressure readings on his console spike erratically. "Faster, Cass! Epsilon valve needs a quarter-turn counter-clockwise *after* full seal, or it'll jam under load. Documentation omits that."

  Cass grunted, wrestling the stiff valve. "It's... fighting me!"

  "Because the housing warped during the last tremor cycle!" Aris snapped, the *knowing-that* flooding him – metallurgical stress points, current eddies impacting structural fatigue – all data points he could recite perfectly. But the *feel* of it, the intuitive twist of the wrist needed when a valve stem was subtly bent, the subtle counter-pressure against the current tugging at your legs... that knowledge had bled away during his years topside. He could see the solution, clear as schematics, but his body couldn’t translate it into action anymore.

  A high-pitched whine filled the comm. "Leak! Gamma conduit, hairline fracture!" Cass yelled. Aris's console screamed alarms – pressure dropping dangerously fast in the primary lattice feed. The documentation was useless; this failure mode wasn't cataloged. Pure, decaying instinct screamed at Aris to grab a hydrospanner and dive in, but he knew his stiff, unpracticed limbs would be worse than useless.

  "Cass, listen! Forget the book! The fracture's on the *underside*, near coupling J-9. You need a lateral sealant injector, but the current's pushing you left. Brace *hard* with your right boot against the crossbeam, use the push to counter-drift. Injector angle needs to be 70 degrees down, *into* the current flow, not against it. Feel the water push the tool? Use it!"

  He heard Cass's heavy breathing, the scrape of boots. Aris closed his eyes, not seeing the console, but *remembering* the muscle burn, the almost imperceptible shift in resistance when the injector tip seated correctly against a fracture under flow. "Don't force it... let the current guide the angle... *there*! Feel the vibration smooth? Hold it! Five seconds... steady..."

  Silence, then a hiss of sealant. The pressure alarms stuttered, then stabilized. Cass slumped against the lattice framework, breath ragged. "Seal holding."

  Aris wiped sweat from his brow, the laminated charts suddenly feeling like ancient, brittle relics. He had navigated Cass through the chaos with perfect propositional knowledge, every pressure curve, every material tolerance. But it was Cass’s body, still attuned to the depths, that had translated those words into survival, feeling the currents Aris could only describe.

  The manuals contained the map, but the ocean demanded the journey.

  <ins>Memorized maps cannot sail the ship.</ins>
