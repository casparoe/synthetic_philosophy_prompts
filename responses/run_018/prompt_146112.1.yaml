prompt: |-
  ok so me and my friend got into it last nite about the paradox of deontolgy and he summed it up like this: deontology says you can never kill an innocent person even to stop five other people from killing five innocents, because wrongness is like a moral stain that can't be washed away by good results. So if you sit back and let five murders happen your hands stay clean, but if you kill one to stop them you've broken an absolute rule and become a murderer yourself. He says this proves deontology is just moral vanity — caring more about your own purity than actual lives — and that the only consistent deontologist is someone who'd let a hundred people die rather than lie. He also said some deontologists try to escape by calling rights side-constraint blocks that only apply to direct action, but he thinks thats just fancy language for the same vanity thing.

  how fair is that summary? break it into exactly five numbered items, each one or two sentences max, with no intro or conclusion. check whether the purity framing is accurate, whether deontology really forces you to sit back and do nothing, whether side-constraints are being misused here, whether the hundred-people-lie case is a fair test, and whether the vanity conclusion actually follows from anything true in the summary. don't list books or cite anyone, just tell me straight what a defender would wince at and what's flat wrong.
reasoning: |-
  Hmm, the user is asking me to evaluate their friend's summary of deontology and its paradox. Their friend framed deontology as "moral vanity" where you prioritize your own purity over saving lives. The user wants me to break this down into exactly five numbered points without intros or conclusions, and address specific aspects like the purity framing, whether deontology forces inaction, side-constraints, the lying test case, and if the vanity conclusion follows.

  First, I need to recall what deontology is. It's an ethical theory based on rules and duties, like Kant's idea that certain actions are intrinsically wrong regardless of consequences. The classic paradox involves scenarios where killing one innocent person could save five others, but deontologists argue against it because it violates a moral rule against murder.

  The user's friend summarized it as deontology forbidding killing an innocent even to prevent more killings, framing it as "moral stain" that can't be washed away by good results. He claims this leads to inaction, like letting a hundred people die rather than lie, and dismisses side-constraints as just fancy language for vanity. I need to assess this fairly and neutrally.

  Now, for the five items: I'll structure them as requested. Item 1 should address the purity framing. Deontologists don't see it as vanity; they emphasize duties to others, like respecting autonomy, so labeling it "purity" is misleading—it's about universal principles, not personal cleanliness.

  Item 2: Does deontology force you to sit back? Not necessarily. Deontologists can actively intervene as long as it doesn't violate rules, like tackling a murderer instead of killing an innocent. The friend's summary oversimplifies it to inaction, which isn't accurate.

  Item 3: Side-constraints. These are rules that limit actions, not excuses for vanity. They're meant to prevent direct harm, so the friend is misusing the concept by reducing it to vanity.

  Item 4: The hundred-people-lie case. It is a fair test for consistency, but deontologists might argue that lying has exceptions in extreme cases, showing that their rules aren't always absolute in practice.

  Item 5: Does the vanity conclusion follow? Not really. Deontology is about objective duties to all people, not self-centered purity. The friend's interpretation ignores that deontologists might feel anguish in dilemmas, proving it's not about vanity.

  I should keep each item concise—one or two sentences max—and avoid citing sources as requested. My response needs to be straightforward, pointing out where the summary is unfair or wrong, so the user gets a clear critique. The user seems knowledgeable about philosophy, given the detailed query, so I'll aim for precision without jargon.
answer: |-
  Here's the breakdown of your friend's summary accuracy:

  1.  **Purity Framing:** The "moral vanity" and "purity" framing is unfair and inaccurate. Deontologists argue rules protect *others'* fundamental rights/dignity, not primarily the agent's own "clean hands" or status.
  2.  **Forced Inaction?** Deontology doesn't *force* total inaction; it forbids *specific wrong acts* (like killing an innocent). Agents can still act vigorously within the rules (e.g., tackling the murderers) to prevent harm.
  3.  **Side-Constraints Misused?** Calling side-constraints "fancy language for vanity" misrepresents them. They are core principles defining actions forbidden *to you* to protect others' rights, not primarily about your moral state.
  4.  **Hundred-People-Lie Case Fairness?** This *is* a fair test case for the *strength* of deontological rules (like truth-telling), forcing a confrontation with potential consequences, though defenders might debate the absoluteness of specific rules.
  5.  **Vanity Conclusion Follow?** The "vanity" conclusion doesn't logically follow from deontology's premises. Protecting rights/duties is seen as objectively valuable for *all*, not a self-centered quest for personal moral "cleanliness."
