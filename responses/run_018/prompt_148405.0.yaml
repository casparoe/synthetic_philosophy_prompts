      - Self-reference and formal systems: Gödel's incompleteness and Löb's theorem show that systems with sufficient expressive power 
        can talk about their own provability, leading to limitations and paradoxes.
      - The reflection principle is desirable for an AI to trust its own deductions, but Löb's theorem shows it leads to inconsistency 
        (or triviality) if applied universally.

      - The PI's approach: 
          * Two layers: object level (core reasoning) and meta level (certification).
          * The object level cannot directly refer to itself (blocked by non-classical logic).
          * The meta level uses a limited logical framework (so it might not have the expressive power to represent its own proof predicates fully).

      - Why might this not be enough?
          * The meta-module is applying the same calibration rule to its own outputs. This creates a loop: 
            the meta-module is certifying the object level, and then certifying its own certifications. 
            This indirect self-reference might still lead to a variant of the Löbian obstacle.

          * The separation of layers might break down if the system as a whole is expressive enough to simulate arithmetic. 
            Even if each layer is restricted, the combination might be strong enough.

          * The reflection principle at the meta-level: if the meta-module assigns high confidence to its own outputs, 
            then it is effectively asserting that if it certifies something, it is true. But Löb's theorem says that such a claim, 
            when internalized, can lead to proving anything.

   2. Structure the memo:
      - To: Joint Review Panel for Autonomous Systems (JRP-AS)
