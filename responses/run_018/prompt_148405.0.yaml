     - Core reasoning module derives a conclusion P.
     - Meta-level module assigns high confidence to P.
     - The same calibration rule is applied to the meta-level outputs (i.e., the meta-module also certifies its own outputs).

   The PI claims they avoid the Löbian obstacle by:
     - Using a restricted, non-classical logical framework that blocks direct self-reference at the object level.
     - Having a separate meta-logical layer with limited expressive power.

   The Löbian obstacle (via Löb's theorem) states that in any formal system strong enough to represent basic arithmetic, 
   an agent cannot consistently maintain the reflection principle (if the system proves P, then P is true) for all sentences, 
   because if it did, the system would prove every sentence (triviality).

   Steps:
