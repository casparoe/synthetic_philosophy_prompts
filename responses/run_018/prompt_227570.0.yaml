  Hmm, the user's deep need here is structural clarity. They don't just want definitions; they want to see where tensions between requirements might make expressivism inherently unstable. The phrase "I care about most" points to interest in possible incompatibilities between desiderata. As a seminar leader, they'll want to provoke discussion, so highlighting those friction points is key.

  First, I should brainstorm all candidate constraints from literature: embedding (negation, conditionals), inference preservation (modus ponens), truth-aptness behaviors (belief/retraction), disagreement data, quantification, compositionality. Then separate into: 
  - Universal constraints (any metaethicist accepts) 
  - Expressivist-specific burdens (e.g., explaining truth-talk without descriptivism) 
  - Potential cognitivist biases (e.g., demanding truth-conditions identical to factual claims)

  Biggest tension spots: 
  - Compositionality vs. non-representationalism (how can attitudes compose like propositions?) 
  - Truth-aptness vs. anti-realism (if "true" is robust, doesn't that collapse to cognitivism?) 
  - Disagreement vs. subjectivism (why isn't it just clashing preferences?)

  For assessment families: 
  - Simple attitudinalism fails embedding (Geach's negation) 
  - Gibbardian planning solves logic but struggles with minimal truth 
  - "Being for" handles inconsistency primitively but feels ad hoc 
  - Hybrids risk compromising expressivism if descriptive content does all the work 
  - Minimalism wins truth-talk cheaply but may trivialize normative substance

  Must emphasize that "success" varies by which desiderata you prioritize. The unresolved core is whether expressivism can fully mimic propositional behavior without becoming covert cognitivism. That's the seminar gold.
answer: |-
  Below is a structured desiderata list for expressivist semantics, distilled from core challenges in metaethics and the Frege-Geach problem. I distinguish **universal constraints** (U) that any metaethical theory must satisfy (accepting ordinary linguistic/intuitive data) from **expressivist-specific burdens** (E) (arising *because* expressivists reject cognitivist foundations), and note where **cognitivist biases** (CB) might creep in. Tensions between desiderata are flagged explicitly.

  ---

  ### **I. Desiderata: What Expressivism Must Achieve**  
  *(Organized by linguistic/logical phenomena)*

  1. **Embedding in Complex Sentences (U)**  
     *Motivation*: Normative language functions identically to descriptive language in unasserted contexts (e.g., antecedents of conditionals, disjunctions, negation).  
     *Required Coverage*:  
     - Negation ("Stealing isn't wrong")  
     - Disjunction ("Either stealing is wrong or the law is unjust")  
     - Conditionals with normative antecedents/consequents ("If stealing is wrong, then Joe believes it’s wrong")  
     - Attitude verbs ("Emma hopes that stealing is wrong")  
     - Modals ("Stealing might be wrong")  
     - Quantification ("Some things are wrong")  

  2. **Logical Validity Preservation (U)**  
     *Motivation*: Normative arguments (e.g., modus ponens) are treated as deductively valid in practice.  
     *Requirements*:  
     - Modus ponens with normative components must not equivocate (e.g., "If lying is wrong, then telling your brother is wrong. Lying is wrong. ∴ Telling your brother is wrong").  
     - Consistency/inconsistency of normative claims must mirror propositional logic (e.g., "Stealing is wrong" and "Stealing is not wrong" are contradictions).  

  3. **Truth-Aptness Phenomena (U)**  
     *Motivation*: Ordinary practice treats moral claims as capable of being true/false, believed, doubted, and retracted.  
     *Requirements*:  
     - Explain why we assert "It is true that murder is wrong" without invoking robust truth-conditions (CB risk: demanding *correspondence*-style truth).  
     - Explain belief ascription ("Claude believes cheating is wrong") without reducing to descriptive psychological states.  
     - Accommodate retraction/revision ("I no longer think capital punishment is permissible").  

  4. **Normative Disagreement as Cognitive Conflict (U)**  
     *Motivation*: Moral disputes behave like factual disagreements (not mere clashes of taste).  
     *Requirements*:  
     - Explain why "X is wrong" / "X is not wrong" feels *incompatible* (not just differing attitudes).  
     - Explain why arguments/reasons can resolve moral disagreements (unlike preferences for vanilla vs. chocolate).  

  5. **Compositionality (E)**  
     *Motivation*: The meaning of complex sentences must be built systematically from parts.  
     *Requirements*:  
     - Attitude expressions (e.g., disapproval) must compose in a way that mirrors propositional structure.  
     - *Expressivist burden*: Do this without treating moral sentences as representing states of affairs.  

  6. **Non-Factivity of Attitudes (E)**  
     *Motivation*: Expressivism grounds meaning in conative attitudes (e.g., disapproval, plans).  
     *Requirements*:  
     - Avoid reducing normative claims to *descriptions* of attitudes (to prevent collapse into subjectivism).  
     - Explain how attitudes can be inconsistent *objectively* (e.g., why can’t one coherently approve of torture *and* disapprove of all causing of pain?).  

  7. **Interaction with Descriptive Content (U)**  
     *Motivation*: Mixed sentences are common ("If stealing causes harm, then it is wrong").  
     *Requirements*:  
     - Validate inferences crossing descriptive/normative domains.  
     - Explain why "Stealing causes harm but isn’t wrong" seems contradictory (if harm grounds wrongness).  

  ---

  ### **II. Tensions Between Desiderata**  
  **Core Structural Conflicts**:  
  - **(U1) Embedding** + **(U2) Logic** vs. **(E5) Compositionality** + **(E6) Non-Factivity**:  
    If normative sentences express non-cognitive attitudes, how can they embed like propositions *and* validate logic? Attitudes don’t naturally compose truth-functionally (e.g., what is the attitude in *"If A, then B"* when *A* and *B* are conative states?).  
  - **(U3) Truth-Aptness** vs. **(E6) Non-Factivity**:  
    If "true" is robustly explanatory (CB!), expressivism fails; if "true" is deflated, does it explain *why* moral claims feel truth-apt *differently* from desires?  
  - **(U4) Disagreement** vs. **(E6) Non-Factivity**:  
    Why is attitudinal disagreement (e.g., conflicting plans) not like preferring chocolate/vanilla? Expressivism needs *objective* inconsistency in attitudes.  

  ---

  ### **III. Assessment of Major Expressivist Strategies**  
  *(Focused on structural adequacy against desiderata)*  

  | **Approach**               | **Strengths**                                  | **Weaknesses**                                      |  
  |----------------------------|-----------------------------------------------|----------------------------------------------------|  
  | **Simple Attitude-Expressivism** (Ayer, early Blackburn) | Simple ontology; handles direct assertions (E6). | Fails embedding (U1) and logic (U2): no compositionality for complex sentences. |  
  | **Gibbardian Norm-Expressivism** (plan-based worlds) | Validates logic (U2); handles embedding via world-norm consistency (U1). | Struggles with truth-aptness (U3): are "plans" truth-apt? Quantification over worlds may reintroduce descriptivism (CB). |  
  | **"Being For" Approaches** (Schroeder) | Treats inconsistency as primitive; validates logic (U2). | Compositionality (U1) is technically solved but ontologically obscure. Truth-aptness (U3) and disagreement (U4) feel under-explained. |  
  | **Hybrid Expressivism** (e.g., Barker, Ridge) | Eases embedding (U1) via descriptive content; accommodates truth-talk (U3). | Risks collapsing to descriptivism if descriptive content does all the work (E6 violated). May not explain disagreement (U4) as cognitive conflict. |  
  | **Minimalist/Deflationary** (Blackburn, Dreier) | Earns truth-aptness (U3) cheaply via deflationism; avoids descriptivism. | May trivialize disagreement (U4): if "true" is minimal, why isn't "tasty" treated like "wrong"? Logic (U2) requires additional machinery (e.g., commitment-based inferentialism). |  

  ---

  ### **Key Takeaways for Seminar**  
  1. **The Frege-Geach "Problem" is a Constellation**: It’s not one problem but a set of challenges arising from the *propositional behavior* of moral language.  
  2. **Core Tension is Structural**: Expressivism’s deepest hurdle is reconciling **logic/embedding** with **non-representationalism**. Solutions either "mimic" propositional structure (Gibbard, Schroeder) or minimize the gap (minimalism).  
  3. **Desiderata Aren’t Equal**: Truth-aptness (U3) is less threatening if deflationism is accepted, but disagreement (U4) and logic (U2) remain thorny.  
  4. **No Free Lunch**: All approaches trade off costs: Gibbard’s is technically robust but ontologically heavy; minimalism is lightweight but risks vacuity.  

  This framework lets you evaluate solutions by which desiderata they prioritize and which they reinterpret or abandon. The unresolved question: *Can expressivism fully satisfy (U1)–(U4) without collapsing into a notational variant of cognitivism?* That’s where the debate lives.
