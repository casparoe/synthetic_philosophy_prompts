  First, the core issue is whether symbolic representations have genuine causal power over their material substrate without violating physical laws. They mentioned specific cases: intentional actions based on false beliefs, distinguishing content from correlation, physical closure, multi-realizability, and error-correction loops. These are crucial for the desiderata.

