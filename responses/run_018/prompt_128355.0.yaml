prompt: |-
  I run an upper-level undergraduate seminar in moral philosophy—about 14 students, one 75-minute session. The announced topic is moral particularism versus generalism, but I want the session to target a specific, somewhat neglected pressure point within that debate: reason holism, or the claim that the very same non-moral feature can operate as a reason with opposite moral valence across contexts without being governed by any further general principle.

  Design a structured in-class deliberation—preferably with assigned roles and forced choices rather than open discussion—so that participants discover this holism for themselves before it is named. The rules should be arranged so that students apply identical descriptive predicates to two structurally parallel cases and reach opposite moral verdicts, then face a mechanism that makes them feel the cost of either retaining both verdicts or collapsing them into a hidden generalization.

  Specify: the physical setup and materials; the roles or constraints (for example, some participants must defend verdicts using only descriptive, non-moral vocabulary, while others must propose the relevant difference that saves consistency); a phased timeline; and an incentive scheme that rewards coherence but penalizes ad hoc exceptions—using points, voting tokens, or staged public commitments rather than real money.

  Then provide a debrief that maps specific moments in the activity onto parts of the particularist/generalist debate: where students implicitly appealed to ceteris paribus conditions, where they invented unstated background conditions to save a rule, and where they simply refused to generalize. Include an honest account of what will go wrong the first time—especially the tendency to smuggle in covert general principles—and how to handle it without undermining the exercise.

  Finally, be explicit about which feature of particularist reason holism the activity cannot reproduce—whether the phenomenology of direct moral perception, the metaphysical claim about the non-codifiability of reasons, or the rejection of moral explanation altogether—and note that this gap must be filled by the facilitator's follow-up discussion.
reasoning: |-
  We are designing an in-class deliberation activity for a moral philosophy seminar on moral particularism vs. generalism, focusing on reason holism. The goal is for students to discover holism (that the same non-moral feature can be a reason for opposite moral valences in different contexts without being governed by a further principle) through structured cases and forced choices.

  ### Activity Design: "The Case of the Broken Promise"

  **Physical Setup and Materials:**
  - Arrange chairs in a circle or U-shape for face-to-face interaction.
  - Provide each student with:
    - A handout with two cases (Case A and Case B) and a set of rules for the activity.
    - Two colored cards: one red (for "wrong") and one green (for "not wrong" or "permissible"). Alternatively, use tokens or stickers for voting.
    - A role card (if assigned roles) or a description of the constraints for their group.
  - A whiteboard or flip chart to record key points and votes.

  **Cases:**

  **Case A (Breaking a Promise for a Friend):**
  *Sam promises to help Alex move to a new apartment on Saturday. On Saturday morning, Sam gets a call from Taylor, a close friend who is having a severe emotional crisis. Taylor asks Sam to come over immediately. Sam decides to break the promise to Alex and goes to help Taylor. Sam explains the situation to Alex, who is disappointed but understands.*

  **Case B (Breaking a Promise for a Concert):**
  *Jamie promises to help Morgan move to a new apartment on Saturday. On Saturday morning, Jamie gets a call from a friend who has an extra ticket to a once-in-a-lifetime concert happening that afternoon. Jamie decides to break the promise to Morgan and goes to the concert. Jamie explains the situation to Morgan, who is very upset.*

  **Non-moral feature in focus:** *breaking a promise*.

  **Phased Timeline (75 minutes total):**

  1. **Introduction (5 minutes):** 
     - Explain the activity structure and rules without revealing the philosophical target.
     - Assign roles randomly (if using roles) or divide the class into two groups (if using group constraints). Alternatively, the whole class can participate in each phase with different constraints per phase.

  2. **Phase 1: Individual Judgments (10 minutes)**
     - Each student reads both cases and makes an initial private judgment: For each case, is the act (breaking the promise) wrong? They write down their verdict (red/green) and a one-sentence reason (using only descriptive, non-moral vocabulary for now). 
     - They must use the same non-moral predicate: "breaking a promise". They are not allowed to use moral terms (like "right", "wrong", "duty", "obligation") in their written reason. Instead, they must describe the situation in neutral terms (e.g., "It breaks a promise and helps a friend in crisis" for Case A; "It breaks a promise and gains a fun experience" for Case B).

  3. **Phase 2: Small Group Deliberation (15 minutes)**
     - Divide the class into small groups (3-4 students each). 
     - **Group Task:** Each group must reach a consensus on the verdict for each case. They must also formulate a single descriptive reason for each verdict, using only non-moral vocabulary. The reason must include the feature "breaking a promise" and the context (e.g., "breaking a promise to help someone in emotional distress" for Case A; "breaking a promise to attend a concert" for Case B).
     - **Constraint:** They are not allowed to introduce any new moral concepts. They must stick to the facts of the cases.

  4. **Phase 3: Public Verdict and Reasoning (15 minutes)**
     - Each group reports their verdicts and reasons for both cases. The facilitator records the verdicts on the board (using red/green) and the reasons.
     - **Expected Outcome:** Most groups will judge Case A as not wrong (green) and Case B as wrong (red). The reasons will highlight the context (emotional crisis vs. concert) without moral terms.

  5. **Phase 4: The Pressure Point - Forced Choice (20 minutes)**
     - **The Challenge:** The facilitator now poses the question: "Is there a general rule about breaking promises that covers both cases? If so, what is it? If not, why not?"
     - Assign roles to half the class (Group X: "Generalists") and the other half (Group Y: "Particularists"). Alternatively, if using small groups, assign each group one role.
       - **Group X (Generalists):** Must argue that there is a single, consistent rule that explains both verdicts. They must propose a rule that is not ad hoc (i.e., it must be generalizable to other cases and not just tailored to these two). They can use moral terms now, but the rule must be stated as a general principle.
       - **Group Y (Particularists):** Must argue that no such rule exists and that the context matters in a way that cannot be captured by a general rule without making it too vague or having too many exceptions. They must point to the specific features of each case.
     - **Incentive Scheme:** 
       - Use a point system. Each group gets 2 points for a rule or argument that the class (by vote) finds coherent and non-ad hoc. They lose 1 point for every ad hoc exception they introduce (as judged by the facilitator). 
       - Alternatively, use tokens: Each group starts with 3 tokens. They can bet one token on their argument being accepted by the class. If the class votes (by secret ballot) that their argument is coherent and non-ad hoc, they get an extra token. If not, they lose the token. The group with the most tokens wins.
     - Groups have 10 minutes to prepare, then 10 minutes for debate (each group gets 3 minutes to present, then rebuttals).

  6. **Phase 5: Class Vote and Reflection (10 minutes)**
     - Class votes on two questions (using colored cards or tokens):
       1. Which group (Generalists or Particularists) made the more compelling case? (This is about the debate, not the original cases.)
       2. Do you think there is a general rule that covers both cases without ad hoc exceptions? (Yes/No)
     - The vote results are tallied and discussed briefly.

  **Debrief (to be done by the facilitator after the activity, 10 minutes):**

  Map the activity to the philosophical debate:

  1. **Reason Holism Discovery:** In Phase 3, students used the same non-moral feature (breaking a promise) to reach opposite verdicts in two cases. This is holism: the moral valence of a reason (breaking a promise) changed based on context without a further principle.

  2. **Ceteris Paribus Conditions:** When Group X (Generalists) tried to formulate a rule, they might have said: "Breaking a promise is wrong unless it is to help someone in need." This is a ceteris paribus condition. But then Group Y might counter: What counts as "need"? Is a concert ticket "need"? This shows the challenge of specifying conditions.

  3. **Ad Hoc Exceptions:** If Group X tried to save the rule by adding "unless it's for an emotional crisis but not for a concert", that's ad hoc. The facilitator should penalize this (via points/tokens) and note that it's not generalizable.

  4. **Refusal to Generalize:** Group Y might have argued that each case must be judged on its own, and no rule can capture the nuances. This mirrors particularism.

  **What Will Go Wrong the First Time:**
  - **Smuggling in Covert General Principles:** Students might try to use moral terms in Phase 2 (despite the rule) or in Phase 4, they might propose a rule that is actually ad hoc but disguise it as general. The facilitator must be vigilant and call out any use of moral terms in the early phases and any ad hoc rules in the debate. How to handle: Gently remind them of the constraints and ask them to rephrase. If they persist, note it as a penalty in the point system.

  - **Over-Simplification:** Students might ignore nuances in the cases. The facilitator should ask probing questions: "What if the concert was for a charity? What if the emotional crisis was minor?"

  - **Time Management:** The debate phase might run over. Keep strict time limits.

  **The Gap in the Activity:**
  The activity cannot reproduce:
  - **The phenomenology of direct moral perception:** Students are making judgments based on described cases, not experiencing a direct, non-inferential moral perception. 
  - **The metaphysical claim about non-codifiability:** The activity shows the difficulty of codification but doesn't prove it's impossible. 
  - **The rejection of moral explanation:** The activity still operates within a framework of giving reasons, whereas radical particularism might reject that.

  **Follow-up Discussion:** The facilitator must explicitly note this gap and explain that the activity only illustrates the holism of reasons and the challenges for generalism. The deeper philosophical claims require further discussion, which will be the next part of the seminar.

  This structured activity should lead students to experience the tension between particular judgments and the desire for general rules, setting the stage for a deeper understanding of particularism and reason holism.
answer: |-
  ### Structured In-Class Deliberation: "The Promise Paradox"  
  **Objective:** Students discover reason holism by applying identical non-moral predicates to parallel cases, reaching opposite moral verdicts, and confronting the tension between consistency and context.  

  ---

  #### **Physical Setup & Materials**  
  - **Room Setup:** U-shaped seating for face-to-face debate. Whiteboard divided into two sections: "Case Alpha" and "Case Beta."  
  - **Materials:**  
    - **Handout 1:** Case descriptions (distributed at start).  
    - **Handout 2:** Role cards (assigned randomly; 5 roles × 2–3 students each).  
    - **Voting Tokens:** Red ("Wrong"), Green ("Not Wrong"), and Blue ("Abstain/Ambiguous").  
    - **Sticky Notes:** For proposing "difference-makers" during Phase 3.  
    - **Point Trackers:** Public board for team scores (Generalists vs. Particularists).  

  ---

  #### **Cases (Structurally Parallel but Contextually Opposed)**  
  **Case Alpha:**  
  *"Terry promises to help Morgan paint their house on Saturday. On Saturday morning, Terry’s neighbor Kai texts, distraught after a family loss. Terry cancels on Morgan to comfort Kai. Morgan is annoyed but acknowledges the situation."*  

  **Case Beta:**  
  *"Sam promises to help Jordan paint their house on Saturday. On Saturday morning, Sam’s friend Taylor texts, excited about surprise tickets to a sold-out playoff game. Sam cancels on Jordan to attend the game. Jordan is furious and calls Sam selfish."*  

  **Shared Non-Moral Feature:** *Breaking a promise to engage in a social activity.*  

  ---

  #### **Roles & Constraints**  
  Assign 5 roles (2–3 students per role) to enforce structured debate:  
  1. **Descriptive Advocates:** *Must defend verdicts using only non-moral vocabulary.*  
     - Can only cite facts (e.g., "breaking a promise to console grief" vs. "breaking a promise for entertainment").  
  2. **Consistency Enforcers (Generalists):** *Must identify a universal rule to unify both cases.*  
     - Penalized if their rule requires ad hoc exceptions (e.g., "unless it’s for grief").  
  3. **Context Defenders (Particularists):** *Must argue no rule can reconcile the cases.*  
     - Penalized if they appeal to implicit general principles.  
  4. **Difference Detectives:** *Propose "relevant differences" between cases.*  
     - Must write proposals on sticky notes for public review.  
  5. **Token Holders (Voters):** *Cast verdict tokens anonymously after each phase.*  
     - Control the outcome but must justify choices if challenged.  

  ---

  #### **Phased Timeline (75 Minutes Total)**  
  **Phase 1: Initial Verdicts (15 min)**  
  - Students read both cases individually.  
  - **Forced Choice:** Each student votes "Wrong" (Red) or "Not Wrong" (Green) for each case using tokens.  
  - *Outcome:* >80% will vote "Not Wrong" for Alpha (grief) and "Wrong" for Beta (game).  
  - **Constraint:** Descriptive Advocates share reasons using *only non-moral terms* (e.g., "helping grief" vs. "seeking fun").  

  **Phase 2: Rule-Building (20 min)**  
  - **Task:** Groups propose one rule covering both verdicts (e.g., "Breaking promises is wrong unless it prevents harm").  
  - **Incentives:**  
    - Consistency Enforcers earn 2 points for a rule with no exceptions; lose 1 point per ad hoc condition (e.g., "unless for emotional support").  
    - Context Defenders earn 2 points for exposing flaws in the rule; lose 1 point if they imply a hidden rule.  
  - Difference Detectives post sticky notes proposing distinctions (e.g., "severity of need").  

  **Phase 3: Collapse or Commit (25 min)**  
  - **Pressure Point:** Facilitator forces a choice:  
    - *Option A:* Uphold both verdicts → admit holism (no unifying rule).  
    - *Option B:* Collapse verdicts to consistency → revise one verdict to match the other.  
  - **Token Holders** re-vote:  
    - 1 token = uphold holism; 2 tokens = enforce consistency.  
  - **Scoring:**  
    - Teams earn points if their position (holism vs. consistency) wins the vote.  
    - "Ad hoc" proposals (e.g., "only wrong if no urgent need") deduct points.  

  **Phase 4: Reveal & Reflect (15 min)**  
  - Facilitator tallies points and declares "winning" team (Generalists/Particularists).  
  - **Final Vote:** Anonymous blue tokens for "Which position felt more defensible?"  

  ---

  #### **Debrief: Mapping to the Particularism/Generalism Debate**  
  1. **Reason Holism Discovery:**  
     - Students applied "breaking a promise + social activity" to both cases but reached opposite verdicts. *This mirrors holism—the same feature’s valence flipped contextually.*  
  2. **Ceteris Paribus Conditions:**  
     - When Consistency Enforcers said, "Breaking promises is wrong *unless there’s a good reason*," they invoked an unstated background condition. Highlight how this "unless" clause is a *ceteris paribus* escape hatch.  
  3. **Ad Hoc Generalizations:**  
     - If a student proposed, "It’s okay only for *emotional crises*," note how this "saves" the rule but is ad hoc (e.g., why not concerts for depressed fans?). Tie to generalism’s struggle with exception-laden principles.  
  4. **Refusal to Generalize:**  
     - Context Defenders who said, "Each case is unique—no rule fits," replicated particularism’s rejection of codification. Contrast with Generalists’ insistence on systematization.  

  **What Will Go Wrong (and How to Fix It):**  
  - **Smuggling Covert Principles:** Students will sneak in moral terms (e.g., "selfish") or hidden rules (e.g., "helping is *always* better").  
    - *Fix:* Intervene early: "Re-state that without ‘should’ or ‘duty.’" Penalize with point deductions.  
  - **Over-Indexing on Intuitions:** Votes may skew toward cultural biases (e.g., "grief > sports").  
    - *Fix:* Add a "neutral" case (e.g., breaking a promise for a job interview) to diversify pressure.  
  - **Time Crunch:** Phase 3 debates may run long.  
    - *Fix:* Use a timer; let Token Holders force a vote if deadlocked.  

  ---

  #### **The Unreproducible Element: Moral Perception vs. Codification**  
  This activity **cannot** replicate:  
  - **The Phenomenology of Moral Perception:** Students deliberate *reflectively*, not via "direct perception" (e.g., intuitively *seeing* the wrongness). The exercise prioritizes reasoned judgment over non-inferential intuition.  
  - **Metaphysical Non-Codifiability:** While students experience the *difficulty* of rule-creation, the activity doesn’t prove reasons *cannot* be codified—it only shows the cost of doing so.  

  **Facilitator’s Follow-Up:**  
  - Explicitly state this gap: "Today showed how hard it is to systematize reasons, but does that mean it’s *impossible*? Next class, we’ll test if moral explanation *requires* principles."  
  - Bridge to readings (e.g., Dancy’s *Ethics Without Principles* vs. McKeever & Ridge’s generalism).  

  ---  
  **Outcome:** Students leave grappling with holism’s tension—having lived the particularist’s context-sensitivity and the generalist’s hunger for order—primed for deeper theory.
