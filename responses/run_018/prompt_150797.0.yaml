prompt: |-
  I'm a software engineer building trust-and-safety infrastructure for a federated social platform, and I've been trying to formalize how we should apply social sanctions—deplatforming, visibility throttling, or public censure—without simply copying generic "community guidelines" playbooks. After reading some philosophy on punishment and collective belief formation, I've sketched a framework I'm calling the principle of recursive justification with non-transitive blame: any sanction applied to a user must include a justification that is itself open to sanction if false or misleading; moral culpability or reputational taint must not propagate to associates, followers, or past group memberships unless those parties actively endorsed the specific violation; and the severity of the sanction must scale with the community's demonstrable epistemic confidence in the claim of violation, not with the emotional intensity of responses or the raw volume of reports.

  Please turn this into a concrete, reusable decision procedure that my moderation team—who have no formal philosophy background—can actually run in under fifteen minutes per case. Specify the ordered questions to ask, the pass/fail or threshold conditions that must be satisfied for a sanction to proceed, the explicit stop-points where the procedure returns "no sanction," and the exact junctures where judgment cannot be eliminated and must be escalated to a human decision-maker. Flag the categories of case the procedure cannot settle, and be explicit about where it will misfire or produce a recommendation that conflicts with standard platform practice. Then apply the procedure to three scenarios: (a) a prominent user publishes a false empirical claim that causes measurable real-world harm; (b) a user expresses an unpopular but carefully argued philosophical view that triggers mass reporting and advertiser pressure; and (c) a user's past membership in a discredited group is uncovered, though the user has since made a specific, public disavowal of that membership. Ensure that at least one application yields a result a typical platform operator would likely resist, and identify precisely where the procedure forces a value judgment that cannot be automated away. Keep the deliverable fully self-contained—no bibliographies, no citation requests, no reliance on obscure named theories, and nothing that requires web access to evaluate.
reasoning: |-
  We are building a decision procedure based on the Principle of Recursive Justification with Non-Transitive Blame. The core principles are:

  1. **Recursive Justification**: Any sanction must include a justification that is itself open to sanction if false or misleading.
  2. **Non-Transitive Blame**: Blame does not propagate to associates, followers, or past group memberships unless they actively endorsed the specific violation.
  3. **Epistemic Scaling**: The severity of the sanction must scale with the community's demonstrable epistemic confidence in the violation, not with emotional intensity or raw volume of reports.

  We need a step-by-step procedure that a moderation team can run in under 15 minutes per case. The procedure will have ordered questions, pass/fail conditions, stop points (returning "no sanction"), and escalation points.

  ### Decision Procedure: Sanction Evaluation Framework (SEF)

  #### Step 1: Initial Triage
  - **Question 1**: Is the reported content or behavior a potential violation of a clearly stated platform rule? (The rule must be explicitly documented and accessible to users.)
    - *Pass Condition*: Yes, and the rule is unambiguous and specific to the reported content.
    - *Fail Condition*: No, or the rule is vague, not yet established, or not applicable.
    - *Stop Point*: If fail, stop and return "no sanction". (Rationale: Without a clear rule, we cannot justify a sanction under recursive justification.)

  #### Step 2: Establish Specific Violation
  - **Question 2**: Can we articulate a specific, factual claim about the violation that is:
     a) Falsifiable (i.e., it can be proven true or false with evidence)?
     b) Directly tied to the reported content?
     c) Not contingent on the user's identity, associations, or past group memberships?
    - *Pass Condition*: Yes to all (a, b, c).
    - *Fail Condition*: No to any.
    - *Stop Point*: If fail, stop and return "no sanction". (Rationale: Non-transitive blame and the need for a specific violation.)

  #### Step 3: Assess Epistemic Confidence
  - **Question 3**: What is the demonstrable epistemic confidence in the violation claim? (Evaluate using three sub-steps):

    - **3a. Evidence Quality**: 
        - High: Direct evidence (e.g., user's own words, clear video, unambiguous data) that is verifiable and not taken out of context.
        - Medium: Indirect evidence (e.g., reliable second-hand reports, consistent circumstantial evidence).
        - Low: Contested evidence, anonymous reports, or evidence requiring complex interpretation.

    - **3b. Community Validation** (Note: not volume, but quality of validation):
        - High: The claim has been independently verified by multiple trusted and diverse sources (e.g., fact-checkers with different biases, open investigation with reproducible results).
        - Medium: Some independent verification exists but limited in scope or diversity.
        - Low: No independent verification, or verification only from a single/biased source.

    - **3c. Plausibility of Alternative Explanations**:
        - High: No reasonable alternative explanation exists for the observed content/behavior.
        - Medium: Alternative explanations exist but are less plausible given the evidence.
        - Low: Multiple equally plausible explanations exist.

    - *Threshold for Proceeding*: 
        - The overall confidence level is determined by the lowest of the three sub-scores (High, Medium, Low). 
        - Only if the overall confidence is at least Medium can we proceed. If Low, stop and return "no sanction".

    - *Escalation Point*: If the overall confidence is Medium, the team lead must review and approve proceeding. If High, proceed without escalation.

  #### Step 4: Non-Transitive Blame Check
  - **Question 4**: Is the sanction being considered solely for the user's own actions (as established in Step 2), without any influence from:
     a) Their associations (e.g., being in a group that also has violators)?
     b) Their followers or friends (unless they actively endorsed the specific violation in question)?
     c) Past group memberships (unless the user is currently endorsing that group's violation in the content at hand)?
    - *Pass Condition*: Yes, the sanction is based solely on the user's own actions and the specific violation.
    - *Fail Condition*: No, there is an attempt to blame based on association, past membership, or the actions of others without active endorsement of the specific violation.
    - *Stop Point*: If fail, stop and return "no sanction". (Rationale: Non-transitive blame principle.)

  #### Step 5: Sanction Severity Scaling
  - **Question 5**: Based on the epistemic confidence (from Step 3) and the severity of the violation (using a predefined severity scale for the rule broken), assign a sanction:
     - Predefined Severity Scale for the Rule (example):
          - Level 1: Minor (e.g., mild incivility) -> Warning, no visibility reduction.
          - Level 2: Moderate (e.g., spreading misinformation without immediate harm) -> Visibility reduction (e.g., demote in feeds, no amplification).
          - Level 3: Severe (e.g., incitement to violence, severe harassment) -> Deplatforming (temporary or permanent).

     - Scaling based on Epistemic Confidence:
          - High Confidence: Apply the full sanction corresponding to the severity level.
          - Medium Confidence: Apply a mitigated sanction (one level below the full sanction, e.g., if Level 3, then apply Level 2 sanction; if Level 1, then warning only).

     - *Escalation Point*: If the violation is Level 3 (severe) and confidence is Medium, then escalation to a senior moderator is required to confirm.

  #### Step 6: Recursive Justification Construction
  - **Question 6**: Draft the justification for the sanction that:
     a) Clearly states the rule violated and the specific factual claim of violation (from Step 2).
     b) Includes the key evidence that supports the claim (without revealing private information).
     c) Explicitly states that if this justification is found to be false or misleading, the person/team who issued it may be subject to sanction (e.g., reversal, formal reprimand, or training).

     - *Pass Condition*: The justification meets all criteria (a, b, c) and is written in plain language.
     - *Fail Condition*: Unable to write such a justification without ambiguity or without revealing private information that should remain confidential.
     - *Stop Point*: If fail, stop and return "no sanction". (Rationale: Recursive justification principle.)

  #### Step 7: Final Decision and Record
  - If all steps are passed, apply the sanction with the drafted justification.
  - Record the entire decision process for audit.

  ### Categories the Procedure Cannot Settle
  - Cases where the platform rule itself is under dispute (the procedure assumes rules are clear and established).
  - Cases involving complex ethical judgments that cannot be reduced to a factual claim (e.g., art, satire, nuanced political speech).
  - Cases where the evidence is entirely subjective (e.g., "hate speech" that relies on cultural context not widely shared).
  - Cases involving imminent real-world harm that requires immediate action (the procedure may take 15 minutes, which is too long for emergencies).

  ### Where the Procedure Might Misfire
  - It may be too cautious, leading to no sanction in cases where traditional platforms would act (e.g., when there's high emotional intensity but low epistemic confidence).
  - It may not handle novel forms of harm that are not yet covered by existing rules.
  - It may conflict with advertiser pressure or public relations concerns because it ignores raw report volume and emotional intensity.

  ### Application to Scenarios

  #### Scenario (a): Prominent user publishes a false empirical claim that causes measurable real-world harm.
  - **Step 1**: Assume the platform has a rule against spreading harmful misinformation. Pass.
  - **Step 2**: Specific violation: "User X claimed Y, which is false, and it caused Z harm." The claim is falsifiable (Y can be fact-checked), tied to the content, and not about associations. Pass.
  - **Step 3**: 
     - 3a: Evidence Quality: High (the claim Y is falsified by authoritative sources).
     - 3b: Community Validation: High (multiple fact-checkers agree).
     - 3c: Alternative Explanations: High (no reasonable alternative: the claim is clear and false).
     Overall: High. Proceed without escalation.
  - **Step 4**: The sanction is for the user's own post. Pass (unless we are considering their prominence or followers, which we are not by this step).
  - **Step 5**: Severity: If the harm is measurable and severe (e.g., led to violence), then Level 3. With High confidence, apply full sanction: deplatforming.
  - **Step 6**: Justification: "You were deplatformed for posting [specific claim] which is false and caused [specific harm]. This decision was based on [evidence]. If this justification is false, we may be sanctioned." Pass.
  - **Result**: Deplatforming.

  #### Scenario (b): User expresses an unpopular but carefully argued philosophical view that triggers mass reporting and advertiser pressure.
  - **Step 1**: Does it violate a rule? If the rule is against hate speech or incitement, but the view is carefully argued philosophy (e.g., against affirmative action) without targeting individuals, then it might not violate any rule. But let's assume the platform has a rule against "content that promotes discrimination". We must check if the philosophical view does that.
     - *Judgment call*: If the view does not explicitly promote discrimination (e.g., it's a theoretical argument about meritocracy), then fail Step 1. Stop: no sanction.
     - However, if the rule is vague and the view is unpopular, we might fail Step 1 because the rule is ambiguous. Stop: no sanction.
     - *But let's assume Step 1 passes because the rule exists and the content arguably violates it.*
  - **Step 2**: Specific violation: "User X promoted discrimination by arguing Y." But Y is a philosophical argument. Is this falsifiable? Not really (philosophical views are opinions). The claim of "promoting discrimination" is also not purely factual. Fail Step 2. Stop: no sanction.
     - *Alternatively, if we can frame a factual claim (e.g., "the argument directly incites discrimination"), then we proceed to Step 3.*
  - **Step 3**: Even if Step 2 passed, we assess confidence:
     - 3a: Evidence Quality: Low (the content is an opinion, not a false fact).
     - 3b: Community Validation: Low (even if many report, they are driven by disagreement, not evidence of harm).
     - 3c: Alternative Explanations: High (the user might be engaging in academic discourse).
     Overall: Low. Stop: no sanction.
  - **Result**: No sanction. This conflicts with standard practice when advertiser pressure might lead to deplatforming. The procedure ignores mass reports and focuses on evidence.

  #### Scenario (c): User's past membership in a discredited group is uncovered, though the user has since made a specific, public disavowal of that membership.
  - **Step 1**: Does the platform have a rule against past membership? Probably not (unless the group is illegal and membership is ongoing). The rule might be against current association. If the rule is against current membership, then past membership is not a violation. Fail Step 1: no sanction.
     - *But if the rule is against any association (past or present) with hate groups, then Step 1 passes.*
  - **Step 2**: Specific violation: "User X was a member of group Y." This is factual and falsifiable. However, the rule might require current association. If the rule is about past membership, then it passes. But note: the user disavowed. The violation is the membership, not the disavowal. So it passes Step 2? 
     - However, Step 2 requires the violation to be "directly tied to the reported content". The reported content is the uncovering of past membership. But the act of membership is not current content. This might fail Step 2 because the violation (membership) is not in the content we are moderating (unless the user is currently displaying membership, which they are not). 
     - *Fail Step 2*: The violation (past membership) is not current content. Stop: no sanction.
     - *If the rule is about current association and the user is not currently a member, then Step 1 fails. Stop: no sanction.*
  - **Step 4**: Even if we proceed, Step 4 (non-transitive blame) would stop us: we are blaming based on past association without active endorsement of a specific violation. The disavowal shows they are not endorsing. Fail Step 4. Stop: no sanction.
  - **Result**: No sanction. This might conflict with platforms that deplatform based on past associations.

  ### Value Judgment that Cannot be Automated
  In Step 1, determining whether a rule is "clearly stated" and whether the content unambiguously violates it requires human judgment. Similarly, in Step 2, framing the specific factual claim requires interpretation. These steps cannot be fully automated because they involve understanding language and context.

  ### Conclusion
  The procedure is designed to be cautious, evidence-based, and resistant to transitive blame and emotional pressure. It will sometimes produce "no sanction" in cases where standard platforms might act, especially in scenarios involving unpopular opinions or past associations. The procedure forces value judgments at the rule interpretation stage (Steps 1 and 2) and in the assessment of evidence quality (Step 3a).
answer: |-
  ### Sanction Evaluation Framework (SEF)  
  **Purpose:** To apply sanctions (deplatforming, visibility throttling, public censure) per the Principle of Recursive Justification with Non-Transitive Blame.  
  **Time Budget:** ≤15 minutes per case.  
  **Key Principles:**  
  1. **Recursive Justification:** Sanctions require a public justification open to challenge/sanction if false.  
  2. **Non-Transitive Blame:** Blame stops at the individual unless associates *actively endorsed* the specific violation.  
  3. **Epistemic Scaling:** Severity scales with evidence-backed confidence, not emotional intensity or report volume.  

  ---

  ### Decision Procedure: Step-by-Step Flow  
  **Inputs:** Reported content, user history, evidence, platform rules.  
  **Outputs:** Sanction (type/severity) or "no sanction."  
  **Escalation Triggers:** Flagged at relevant steps.  

  #### **Step 1: Rule Violation Check**  
  - **Question:** Does the content violate a *pre-existing, unambiguous platform rule*?  
    - *Pass:* Rule is explicit (e.g., "no incitement to violence"), and content clearly matches.  
    - *Fail:* Rule vague, nonexistent, or content ambiguous.  
    - **Stop-Point:** If fail → **No sanction.**  
    - *Escalation:* If rule interpretation is contested → Human team lead decides.  

  #### **Step 2: Specific Violation Isolation**  
  - **Question:** Can the violation be reduced to a *single falsifiable claim*?  
    - *Example claim:* "User falsely claimed 'Vaccines cause autism' on [date]."  
    - *Pass:* Claim is specific, empirical, and independent of user identity/associations.  
    - *Fail:* Violation relies on user’s group membership, tone, or subjective intent.  
    - **Stop-Point:** If fail → **No sanction.** (Non-transitive blame enforced.)  

  #### **Step 3: Epistemic Confidence Assessment**  
  - **Question:** What is the evidence quality for the violation claim? (Ignore report volume/emotion.)  
    - **Metrics:**  
      - **A. Direct Evidence:** Primary sources (e.g., user’s own words, verified data).  
      - **B. Verification:** Independent corroboration (e.g., fact-checkers, trusted experts).  
      - **C. Harm Proof:** Causal link to real-world harm (e.g., documented violence, fraud).  
    - **Thresholds:**  
      - **High Confidence (Proceed):** A + B + C all present.  
      - **Medium Confidence (Proceed with caution):** A + B, but C weak/absent.  
      - **Low Confidence (Stop):** A missing, or B/C unverified.  
    - **Stop-Point:** If Low Confidence → **No sanction.**  
    - *Escalation:* If Medium Confidence → Human team lead approves severity.  

  #### **Step 4: Association & Endorsement Check**  
  - **Question:** Is blame being assigned beyond the user?  
    - **Sub-checks:**  
      - Is sanction driven by user’s followers, friends, or past groups?  
      - Did associates *actively endorse the specific violation* (e.g., shared it + praised it)?  
    - **Pass:** Blame confined to user; no association-based blame.  
    - **Fail:** Blame extends to associates without active endorsement.  
    - **Stop-Point:** If fail → **No sanction.** (Non-transitive blame enforced.)  

  #### **Step 5: Sanction Severity Scaling**  
  - **Question:** What sanction matches epistemic confidence and rule severity?  
    - **Severity Matrix:**  
      | Confidence Level | Minor Violation (e.g., spam) | Major Violation (e.g., hate speech) | Severe Violation (e.g., incitement) |  
      |------------------|------------------------------|-------------------------------------|-------------------------------------|  
      | **High**         | Public censure               | Visibility throttling               | Deplatforming                       |  
      | **Medium**       | Warning                      | Public censure                      | Visibility throttling               |  
      | **Low**          | No action                    | No action                           | No action                           |  
    - **Adjustments:**  
      - Never scale severity based on user prominence, report volume, or advertiser pressure.  
      - *Escalation:* If sanction conflicts with "standard" platform practice → Human team lead finalizes.  

  #### **Step 6: Recursive Justification Drafting**  
  - **Question:** Can a sanction justification be written that is:  
    - (a) Publicly shareable,  
    - (b) Falsifiable (e.g., "User violated Rule X by doing Y on [date]"),  
    - (c) Self-implicating ("If this justification is false, moderators face sanctions")?  
  - **Pass:** Justification meets (a)-(c).  
  - **Fail:** Justification vague, unverifiable, or exempts moderators.  
  - **Stop-Point:** If fail → **No sanction.**  

  ---

  ### Categories the Procedure **Cannot** Settle  
  1. **Emergent Harm:** Novel violations with no pre-existing rule (e.g., new exploit).  
  2. **Subjective Nuance:** Satire, art, or cultural context requiring interpretation.  
  3. **Imminent Threats:** Cases needing <5-minute response (e.g., active shooting).  
  4. **Platform Rule Conflicts:** Disputes over rule validity (e.g., "Should this rule exist?").  

  ### Known Misfires vs. Standard Practice  
  - **False Negatives:** Sanctions withheld in high-pressure cases (e.g., advertiser demands) due to low evidence.  
  - **False Positives:** Sanctions applied for "minor" violations with high evidence, ignoring emotional outrage.  
  - **Conflict Point:** Epistemic scaling often under-punishes viral misinformation lacking harm proof (Step 3C).  

  ---

  ### Scenario Applications  
  #### **Scenario (a): Prominent user publishes false empirical claim causing real-world harm.**  
  - **Step 1:** Pass (violates rule: "no demonstrably false claims causing harm").  
  - **Step 2:** Pass (claim: "User falsely stated 'Drinking bleach cures COVID' on 5/1").  
  - **Step 3:**  
    - A: High (user’s post archived).  
    - B: High (WHO/CDC debunked it).  
    - C: High (hospitals reported poisonings). → **High Confidence.**  
  - **Step 4:** Pass (no associates blamed).  
  - **Step 5:** Severe violation + High confidence → **Deplatforming.**  
  - **Step 6:** Pass (justification: "User spread false medical advice on 5/1, causing hospitalizations. If untrue, moderators face demotion.").  
  - **Outcome:** Deplatforming.  

  #### **Scenario (b): Unpopular philosophical view triggers mass reporting/ad pressure.**  
  - **Step 1:** Pass (arguably violates rule: "no hate speech" if view targets protected group).  
  - **Step 2:** Fail (claim: "User argued 'Capitalism is immoral'"). *Not falsifiable; philosophical.*  
  - **Stop-Point:** Step 2 → **No sanction.**  
  - **Why Misfires:** Standard practice might throttle visibility to appease advertisers. SEF ignores report volume.  

  #### **Scenario (c): Past membership in discredited group, now disavowed.**  
  - **Step 1:** Pass (if rule: "no membership in hate groups").  
  - **Step 2:** Fail (claim: "User was in Group X in 2020"). *Violation not tied to current content.*  
  - **Step 4:** Fail (blame based on past association; no endorsement of specific violation).  
  - **Stop-Point:** Step 4 → **No sanction.**  
  - **Value Judgment:** Step 4 requires assessing if disavowal severs blame. *Cannot automate*—human must interpret "active endorsement" (e.g., did user recruit others?).  

  ---

  ### Escalation & Judgment Summary  
  - **Automation Limits:**  
    - Step 1 (rule ambiguity), Step 4 (active endorsement), Step 5 (severity conflicts) require human judgment.  
  - **Forced Value Judgment:**  
    - Step 4 (Non-Transitive Blame): Deciding if an associate "actively endorsed" a violation is inherently subjective (e.g., is a "like" endorsement?). Must be human-reviewed.  
  - **Resisted Outcomes:** Scenario (b) yields "no sanction" despite advertiser pressure—epistemic scaling overrides volume.  

  **Final Output:** A JSON log of all steps, evidence, and justifications. Audit trail ensures recursive accountability.
