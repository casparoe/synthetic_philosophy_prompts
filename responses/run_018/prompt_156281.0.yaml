prompt: |-
  hey so im putting together this philosophy prompt dataset and need something on the meaning of work and automation that isnt just "write about marx and robots." i was talking with my roommate about how every tech bro says automation will free us for art and philosophy, but nobody asks what happens if your entire sense of self was tied to your job title. could you write a satirical parody of an internal corporate handbook? its for "Aurelia Systems," a fictional mega-corp that replaced 100% of its labor with AI but keeps every ex-employee on payroll in a mandatory "Post-Occupational Integration Program." about 800 words, deadpan HR voice with numbered clauses, bullet points, and dry legal disclaimers. the handbook should slowly reveal that "freedom from work" actually means being forced into bureaucratic meaning-rituals—like "ontological maintenance shifts" where you meditate on your old job description, or "value-generation audits" where you document how your unemployment contributes to human flourishing. the satire targets the utopian post-work narrative: exaggerate its logic until liberation becomes a coercive wellness program. please include an invented internal framework called the "Redundancy Dignity Protocol," which holds that human worth requires economic utility, so when utility disappears the company invents pseudo-work to restore dignity. make it readable without knowing teh alienation literature but fair to the real philosophical worry about purpose, structure, and identity. format it like actual corporate docs with headers and footnotes, and have employees recieve monthly "meaning statements" they must sign. thanks!
