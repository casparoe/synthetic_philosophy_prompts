       - *Commitment*: Qualia are not defined by reactions; they may be stable amid functional shifts.  
     - *No*: Qualia are tied to emotional reactions. → Go to 3.  
       - *Commitment*: Changes in reaction imply changes in qualia; functional states may constitutively define experience.  

  2. **Can a subject report a change in intrinsic taste quality even when sensory discrimination, emotional reaction, and behavioral responses remain fixed (Variant 2)?**  
