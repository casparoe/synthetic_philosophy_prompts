  #### Leaves (Positions)
  - **Leaf A: Robust Realism**  
    - *Formulation*: Qualia are intrinsic, non-representational, irreducible properties of experience that can vary independently of functional states.  
    - *Awkward consequence*: Zombies (functionally identical beings without qualia) are metaphysically possible, undermining physicalism.  
  - **Leaf B: Functionalist Realism**  
