  ### Taxonomy of Positions on Qualia Coherence

  This decision tree starts from the minimal datum that adult humans report changes in their experiences (e.g., "Coffee tastes different now"). Each branch is a concrete question about a case, answerable without prior knowledge of philosophical labels. The tree has **8 branch nodes** and **10 leaves**, covering the required variants. For each branch, accepting an answer commits you to specific implications. For each leaf, the position is named, defined in one sentence, and its most awkward consequence is stated. Unoccupied combinations are diagnosed, and indistinct positions are flagged.

  #### Decision Tree

  1. **In a subject with unchanged sensory discrimination but changed emotional reaction to coffee (Variant 1), can the taste qualia (intrinsic qualities) remain unchanged?**  
