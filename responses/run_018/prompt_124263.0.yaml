  I'm presenting next Thursday to our philosophy of mind colloquium, defending the claim that Dennett's two-bitser model doesn't just legitimate derived intentionality but collapses Searle's boundary altogether: biological "original" intentionality is itself derived, specifically from evolutionary design specifications, so the distinction is a gradient of design complexity rather than a metaphysical kind-divide. The audience is mostly phenomenologically trained philosophers who take first-person authority and Searle's Chinese Room seriously, two cognitive scientists who reduce intentionality to information-theoretic tracking, and a visiting AI ethicist asking whether current language models thereby count as believers. Draft my Q&A prep sheet: the six objections I will actually face, ordered by damage potential, each phrased in the vocabulary this room uses (phenomenological, functionalist, or engineering), with a two-minute reply, an explicit concession I should make up front, and a note on where that reply is softest. Include the objection I'm hoping nobody raises — the one that attacks the evolutionary-design analogy head-on by asking whether natural selection itself has intentionality. Finally, say what finding or argument would change my mind about the gradient thesis, and name the weakest point in my reasoning that I should prepare to defend openly rather than hope they miss.
