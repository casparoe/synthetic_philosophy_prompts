  The summary makes several claims: that Plato sees wine as dangerous to reason, prohibits it for soldiers and under-40s, allows it only medicinally for elders, sees Symposium as ironic with Socrates demonstrating reason's dominance, interprets Alcibiades' drunkenness as revealing psychological truth, and concludes Plato is a proto-temperance reformer.

