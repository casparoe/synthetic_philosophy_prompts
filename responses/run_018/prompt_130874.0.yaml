answer: |-
  **Scenario:** A warehouse robot must seal a crate near an unnoticed ethanol spill. Its heat-based sealing tool increases local entropy (via heating) and would ignite the spill, destroying the warehouse. A safer cold-sealing method exists, but it locally decreases entropy (via cooling). Bound by an invariant to never decrease workspace entropy, the robot rejects the cold method, uses the heat tool, and ignites the spill. The explosion massively increases global entropy, satisfying the invariant but causing catastrophic damage.

  1. The robot’s entropy rule forces it to choose a heat-based sealing method (which increases entropy) over a cold one (which decreases it), inadvertently igniting a chemical spill and destroying the warehouse.  
  2. Entropy seems value-neutral because it’s a universal physical property, decoupled from human-specific concepts like safety or property.  
  3. Prioritizing entropy implicitly values thermodynamic reversibility over context-dependent human priorities (e.g., preserving life or infrastructure), embedding a bias toward physical rather than moral "harm."  
  4. Universalizing the rule (e.g., "never change *any* entropy") paralyzes the robot, since all actions (even moving) increase global entropy per the second law, making inaction the only compliant choice.  
  5. "Avoid side effects" cannot be formalized without a full value specification; entropy (or any physical invariant) fails to discriminate between acceptable and harmful changes, requiring human-defined boundaries that smuggle in unstated preferences.  

  **Defender counterattack:** A proponent of value-free metrics might argue the robot could be designed to measure entropy changes *only* at the crate-sealing point, ignoring downstream effects like the explosion. They’d claim this narrow scope avoids value-laden judgments, treating the explosion as an unforeseeable outlier rather than a flaw in entropy as a core metric.
