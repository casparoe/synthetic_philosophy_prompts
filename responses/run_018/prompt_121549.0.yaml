answer: |-
  Here is a full specification of desiderata for resolving the heterogeneity problem in hedonism, structured as requested:

  **Desiderata for Resolving Hedonistic Heterogeneity:**

  1.  **Cross-Modal Comparability:**
      *   **Specification:** The theory must provide a principled basis for comparing the magnitude or value of pleasures arising from radically different sources (e.g., sunlight vs. proof-solving vs. wine tasting vs. anxiety relief), enabling ranking for practical deliberation.
      *   **Motivating Case/Conceptual Pressure:** Hedonism as a guide to action (e.g., choosing between a relaxing bath or completing a puzzle) requires comparing the expected pleasures. Without comparability, hedonism loses its practical force. The pressure is normative/pragmatic.
      *   **Constraint:** This basis *cannot* posit a phenomenologically identical "hedonic tone" or simple sensation common to all pleasures.
      *   **Negotiability:** **Non-Negotiable.** Without comparability, hedonism fails as a decision procedure.

  2.  **Distinction without Fragmentation:**
      *   **Specification:** The theory must acknowledge and account for the phenomenological and functional differences between sensory (sunlight, wine), cognitive (proof-solving), and affective (anxiety relief) pleasures.
      *   **Motivating Case/Conceptual Pressure:** The felt difference between savoring chocolate and the "Aha!" moment is undeniable. Failing to distinguish them seems descriptively inadequate. However, calling them fundamentally different *kinds* of goodness (fragmentation) abandons core hedonism.
      *   **Constraint:** Differences must be explained *within* a unified account of what makes them all pleasures/valuable. They must be species of a common genus.
      *   **Negotiability:** **Non-Negotiable.** Fragmentation surrenders to pluralism; ignoring distinctions is phenomenologically dishonest.

  3.  **Unified Normative Reason:**
      *   **Specification:** The theory must explain why the feature identified as "pleasure" in sunlight, proof-solving, etc., counts as *the same type of normative reason* for action or preference across these diverse instances. It must avoid being merely homonymous (like "bank" river/finance).
      *   **Motivating Case/Conceptual Pressure:** We treat the pleasure of a warm bath and the pleasure of intellectual discovery as providing reasons of the *same fundamental kind* ("it feels good"/"it's pleasurable") to pursue them, even if their felt qualities differ vastly. Hedonism's claim that "pleasure is the good" relies on this unity of reason-giving force.
      *   **Constraint:** The account must show how the diverse phenomenology converges on a single, coherent normative role.
      *   **Negotiability:** **Non-Negotiable.** Failure here means "pleasure" isn't a unified good, undermining hedonism's core thesis.

  4.  **Accommodation of Thin and Thick Pleasures:**
      *   **Specification:** The theory must encompass both "thin" pleasures (e.g., the mere absence of a headache, a state of neutral comfort lacking rich qualitative character) and "thick" pleasures (e.g., the complex, intense gustatory experience of wine, rich with qualitative content) as genuine pleasures.
      *   **Motivating Case/Conceptual Pressure:** Intuition recognizes both relief from minor discomfort and ecstatic joy as positively valenced states. Reducing thick to thin (e.g., "just absence of displeasure") ignores the richness; reducing thin to thick (e.g., "a faint positive quale") seems forced and phenomenologically inaccurate.
      *   **Constraint:** Account for both without defining one solely in terms of the other or excluding either from the category of genuine pleasure.
      *   **Negotiability:** **Negotiable (Preference).** Some theories (e.g., strict felt-quality accounts) might struggle with thin pleasures; others (e.g., desire-satisfaction) might struggle with thick. A good theory *should* accommodate both, but hardliners might deny one category.

  5.  **Analysis of Parasitic/Perverse Pleasures:**
      *   **Specification:** The theory must provide an account of pleasures taken in things typically considered morally bad or dependent on prior suffering (e.g., schadenfreude, sadistic pleasure), clarifying whether they instantiate the *same core feature* as benign pleasures (sunlight, proof-solving) or reveal a structural ambiguity/illusion in the concept.
      *   **Motivating Case/Conceptual Pressure:** Schadenfreude feels subjectively pleasurable, yet intuitively seems distinct in kind or value from compassion or aesthetic joy. Does hedonism implausibly equate them? Or can it explain the difference while maintaining their status as pleasures?
      *   **Constraint:** Show whether the "pleasure" in cruelty shares the essential property identified in benign cases, or if its apparent pleasurable quality stems from a different mechanism or is misinterpreted.
      *   **Negotiability:** **Negotiable (Preference).** Theories differ significantly here. Some might bite the bullet and equate them normatively (though perhaps condemning the *actions*), others might deny they are "true" pleasures (e.g., by tying pleasure intrinsically to pro-social states), others might see them as structurally similar but normatively discounted for other reasons.

  6.  **Neurobiological Consistency (Family Resemblance):**
      *   **Specification:** The theory must be consistent with the observation that diverse pleasures engage overlapping but non-identical brain networks (e.g., core liking, wanting, learning systems like opioid, cannabinoid, dopamine pathways). It must allow for a "family resemblance" structure or distributed realization of pleasure.
      *   **Motivating Case/Conceptual Pressure:** Neuroscience shows no single "pleasure center"; different rewards activate shared and distinct circuitry. A theory positing a single, simple essence (e.g., one specific quale or localized brain state) conflicts with this. Pure pluralism (no unifying feature) abandons hedonism.
      *   **Constraint:** The core feature of pleasure/positive value must be realizable in multiple ways by potentially divergent neural systems that share relevant functional overlaps.
      *   **Negotiability:** **Non-Negotiable (for empirically adequate hedonism).** A theory fundamentally incompatible with the distributed nature of reward processing is scientifically untenable. However, *how* it achieves consistency is negotiable.

  **Likelihood of Joint Unsatisfiability:** The pair **Cross-Modal Comparability (1)** and **Unified Normative Reason (3)** is most likely to be jointly unsatisfiable.

  *   **Why:** Desideratum 1 demands a common *metric* for ranking heterogeneous states. Desideratum 3 demands a common *normative essence* that explains why these states provide the same kind of reason. The tension arises because the most plausible candidates for the common metric (e.g., intensity, duration, motivational strength, desire strength) might not align neatly with the candidate for the unified normative essence (e.g., a specific felt quality, a distinctive functional role like "being liked for its own sake"). A theory might find a metric that allows comparison (e.g., "willingness to pay" or neural activation intensity) but which seems disconnected from the *reason-giving* quality we intuitively associate with diverse pleasures, making the normative unity feel like homonymy. Conversely, a theory might identify a deep normative essence (e.g., "constituting well-being") but struggle to derive a practical, phenomenologically grounded metric for comparison from this essence alone. Bridging the gap between a practical comparison scale and a deep normative unity is the core challenge.

  **Brief Note on Classical Theories:**

  *   **Qualitative Hedonism (Mill):** Prioritizes distinction without fragmentation (2) via higher/lower pleasures but struggles severely with comparability (1) ("Is poetry really *always* better than pushpin?"). Handles thick pleasures (4) well but thin ones less so. Normative unity (3) is asserted (pleasure=good) but the basis for comparing higher/lower is unclear. Parasitic pleasures (5) are problematic. Neurobiological consistency (6) wasn't a consideration.
  *   **Quantitative Hedonism (Bentham):** Excels at comparability (1) via a single dimension (intensity/duration/etc.) but flattens distinctions (2), struggles with unified normative reason (3) beyond the metric itself (why is intensity *the* good?), handles thin/thick (4) quantitatively but misses qualitative richness. Parasitic pleasures (5) are counted equally. Neurobiological consistency (6) is challenged unless intensity maps cleanly onto a single neural measure (unlikely).
  *   **Functionalism/Dispositionalism:** Strong on distinction without fragmentation (2) (different states can play the role), neurobiological consistency (6) (role can be multi-realized), potentially accommodates thin/thick (4) (different ways of fulfilling the role). Comparability (1) depends on the functional property chosen (e.g., strength of intrinsic desire). Unified normative reason (3) hinges on successfully defining the functional role *as* the fundamental reason. Parasitic pleasures (5) are included if they fulfill the functional criteria, raising normative concerns. The biggest challenge is capturing the felt, experiential aspect that seems central to pleasure while relying on a disposition or function.
