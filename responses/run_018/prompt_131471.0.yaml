  Here's a joke playing on that tension:

  At a dinner party, a mathematician boasted about the wonders of the axiom of choice: "It lets you take a single solid ball, split it into just five disjoint pieces, and rearrange them rigidly into two perfect balls—each identical to the original!"  
  A curious guest, dazzled, turned to the resident constructivist and said, "That’s wild! Can you show us how it’s done?"  
  The constructivist paled. "I’m afraid not."  
  "Why? Is the paradox too geometrically absurd?"  
  "Oh, no," the constructivist replied. "I accept the decomposition exists thanks to choice. But without an explicit rule telling me *which* elements go in *which* pieces, I can’t actually pick them out of the ball. How am I supposed to demonstrate it if I can’t even point to the pieces? The axiom promises they’re there—it just won’t tell me where."  

  ---

  **Key elements explained:**  
  - **Non-constructive tension:** The punchline hinges on the constructivist accepting the *existence* of the decomposition (via AC) but refusing to *demonstrate* it due to the lack of an explicit choice function for selecting elements.  
  - **Banach-Tarski as backdrop:** The paradox is described intuitively ("split a ball into five pieces, get two balls"), but the refusal focuses on the partition’s non-constructive nature.  
  - **No named authorities:** Only "axiom of choice" and "Banach-Tarski" are named; no citations or advanced results.  
  - **Set-theoretic literacy:** Assumes familiarity with AC (non-constructive selections) and basic paradox awareness, but avoids jargon like "non-measurable sets."
