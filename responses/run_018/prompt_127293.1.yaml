  *WARNING: Selecting M-3 or C-5 with broad branching may reduce your healthcare subsidy ("You are statistically likely to be healthy in most branches"). Selecting L-4 guarantees maximum subsidy but voids catastrophe insurance ("Your unique location is irreplaceable").*  

