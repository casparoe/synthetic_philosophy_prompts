  - **Power dynamics**: The board often sides with the powerless (victims, survivors) against powerful entities (state, institutions) or majorities wanting to forget.  
  - **Materiality vs. digital**: Physical markers seem valued (plaques, monument preservation), while digital alternatives aren't fully trusted (no erasure without trace).  
  - **Agency**: Consent matters for living victims (survivors' right to be forgotten) but not for the dead when societal memory is at stake (plaques, monument).  
  - **Historical weight**: Atrocities and state violence get priority (genocide education, plaques), while personal privacy can override scholarly interest (journals).  

