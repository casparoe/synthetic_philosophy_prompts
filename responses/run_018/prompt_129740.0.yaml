prompt: |-
  I’m prepping a lecture on rational choice and I want to see if my intuition holds up. Give me your actual credence — like a hard number between 0 and 1 — that honoring sunk costs is *never* rational, not even in weird edge cases. I want the reasoning decomposed: what portion rides on consequentialism being the only game in town, what portion on whether internalized costs can function like Parfit-style indexicals of personal commitment (i.e., the cost becomes part of the self that rationality protects), what portion on signaling/external-commitment models actually applying to solo agents, and any other factor you think belongs. For each piece give a rough probabilty and one line of justification, then combine them into the final number. Tell me which piece is the shakiest and what evidence would shift it most. And please — be commited here: don’t just map the debate. Take a definite stance, defend it briefly, and tell me exactly which sub-question moves your number the most.
reasoning: |-
