  Prioritize first resolving the *problem of the many* for artifacts, as it directly confronts composition's vagueness within the target domain and is upstream: clarifying whether vague part-boundaries preclude artifact composition (or demand a specific ontology like maximality or indeterminacy) is foundational for tackling vagueness elsewhere, including social groups. Second, investigate the composition of transient social groups (e.g., "the crowd at a protest"), as this extends the vagueness challenge into the human-dependent realm while remaining tractable through conceptual analysis, avoiding immediate empirical dependence; progress here tests if artifact-based solutions generalize or require unique social ontological principles. Third, explore how social construction interacts with vagueness to *generate* composition conditions for groups – this is downstream, building on the first two, but becomes urgent if emerging work suggests linguistic/social practices directly resolve vagueness in composition.

