  Okay, the user is developing a workshop for junior legislative drafters and needs a practical, reusable decision procedure for classifying sentencing bills. They want a step-by-step checklist that distinguishes between retributivist and consequentialist logic, with a specific flag for "rationale laundering" - where the stated rationale doesn't match the actual mechanism. The procedure must be usable in 15 minutes without philosophy training, and they want it applied to two case studies.

  Hmm, this is quite specific. The user clearly has expertise in legislative drafting but needs a simplified framework that survives translation from academic philosophy to statutory text. They're worried about disguised policy motives ("rationale laundering") which suggests they've encountered bills where the stated purpose doesn't align with operational mechanics - a common pain point in statutory interpretation. 

  First, I need to anchor this in durable distinctions that actually appear in legislation. Retributivism leaves footprints like: blame-focused language ("deserved," "accountability"), proportionality rules tied to harm severity, and resistance to offender characteristics. Consequentialism shows up through: future-oriented verbs ("prevent," "reduce"), adjustable outcomes based on risk/behavior, and mechanisms explicitly tied to societal outcomes. The laundering risk emerges when there's dissonance between these layers.

  For the procedure design: Must be flowchart-style with kill switches to prevent over-analysis. Junior drafters will panic if it's not binary at decision points. Need to force concrete answers at each step - no "maybe" options. Time pressure means sacrificing nuance; we'll prioritize operational language over preamble rhetoric since that's where laundering often hides.

  Key escalation points should be: 
  1) When purpose clauses use mixed rhetoric (stop and flag laundering risk) 
  2) When mechanisms have dual-operational logic (escalate to senior drafter since it's policy call) 
  3) When offender characteristics affect sentencing in ways that contradict stated purpose (values conflict)

  Now the case studies: 
  First bill (ecosystem harm) - Uses desert-like "proportionality" language but the index is secretly predictive. That's classic laundering: retributive packaging on consequentialist machinery. The checklist should nail this by spotting that the index calculation relies on future risk (Question 3b) despite "harm" framing. 

  Second bill (CBT reduction) - Framed as mercy (retributive) but functionally rehab (consequentialist). Mercy is inherently retributive (can be withheld), while rehab is earned through participation. The mismatch appears at Question 4 - offender action reduces sentence regardless of blameworthiness. 

  For the "unpopular answer" scenario: Imagine a bill increasing sentences for protest-related offenses citing "just deserts," but the severity jumps only for tactics with high recidivism risk. Drafters might want to call it retributive due to the blame rhetoric, but the mechanism is pure incapacitation. Checklist forces consequentialist label, causing discomfort. 

  Finally, the weaknesses: 
  - Bills with dual-primary purposes will fracture consensus (e.g., "proportional punishment to reduce reoffending") 
  - Cultural baggage around terms like "mercy" may sway analysts differently 
  - Cynical drafters could game it by adding decorative retributive language to consequentialist mechanisms 

  The framework must be rigid precisely because junior drafters will face pressure to accept rationalizations. Giving them concrete operational tests ("Does section 5(b) reference future harm reduction?") provides armor against policy-level spin.
answer: |-
  Here's the **Sentencing Rationale Classifier (SRC)**, a 15-minute operational checklist for legislative drafters. It prioritizes statutory text over rhetoric, with hard stops and escalation triggers. Philosophy is distilled to 4 core questions:

  ---

  ### **The SRC Checklist**  
  **Time Budget:** 2 min/Q | **Stop If:** All criteria met | **Escalate:** At "Values Conflict" flags  

  1. **PRIMARY PURPOSE LANGUAGE**  
     - Scan preamble, purpose clause, and section headers.  
     - *Retributivist (R)*: "Desert," "accountability," "just punishment," "proportionality to harm."  
     - *Consequentialist (C)*: "Deter," "rehabilitate," "protect public," "reduce recidivism."  
     - **Stop & Label If**: Only R **or** only C terms dominate.  
     - **Escalate If**: Mixed terms (e.g., "just deserts to protect society"). Flag: **Rationale Laundering Risk**.  

  2. **SENTENCE DETERMINANTS**  
     Examine what *legally controls* sentence severity (not judicial discretion):  
     - *R*: Fixed by harm severity, culpability, or victim impact. Ignores offender traits.  
     - *C*: Tied to risk assessment, offender characteristics (e.g., age, mental health), or future behavior.  
     - **Stop & Label If**: Exclusively R or C determinants.  
     - **Flag Laundering If**: R language (e.g., "proportionality") but C mechanism (e.g., "risk score").  

  3. **ADJUSTMENT MECHANISMS**  
     How can sentences deviate from baseline?  
     - *R*: Mitigation/aggravation only for *past* acts (e.g., remorse, prior record).  
     - *C*: Adjustments for *future* outcomes (e.g., program completion, restitution compliance).  
     - **Stop & Label If**: Adjustments align with Q1 logic.  
     - **Escalate If**: Adjustments contradict Q1 (e.g., "proportional" baseline but reduction for rehab). **Values Conflict**.  

  4. **OFFENDER AGENCY**  
     How does the bill frame the offender's role?  
     - *R*: Offender as passive recipient of "deserved" outcome.  
     - *C*: Offender as active participant who "earns" change via effort.  
     - **Final Label**: Confirm consistency with Q1–3.  
     - **Flag Laundering If**: "Earning" reductions in C-style programs but labeled "mercy" (R term).  

  ---

  ### **Case Applications**  
  **Bill 1: Mandatory Prison for Ecological Damage**  
  - *Q1*: "Proportionality to ecosystem harm" (R language).  
  - *Q2*: "Ecosystem Harm Index" uses predictive modeling (future damage projections = C mechanism).  
  - *Q3*: No adjustments; mandatory terms (neutral).  
  - *Q4*: Offenders passive; sentences imposed.  
  - **SRC Verdict**: **Consequentialist with Rationale Laundering**.  
    - *Why*: Mechanism is predictive (C) despite "proportionality" framing (R).  

  **Bill 2: Sentence Reduction for Trauma-Informed CBT**  
  - *Q1*: "Earning mercy" (R language).  
  - *Q2*: Reduction requires program completion (C mechanism).  
  - *Q3*: Adjustment for future action (completing CBT = C).  
  - *Q4*: Offender actively "earns" reduction (C framing).  
  - **SRC Verdict**: **Consequentialist with Rationale Laundering**.  
    - *Why*: "Mercy" (R) implies discretionary grace, but reduction is automatic upon completion (C).  

  ---

  ### **The Uncomfortable Case**  
  **Bill: "Repeat Offender Accountability Act"**  
  - *Q1*: "Just deserts for habitual criminals" (R).  
  - *Q2*: Triples sentences only for offenders with high recidivism scores (C).  
  - *Q3*: No adjustments; mandatory (neutral).  
  - *Q4*: Offenders passive.  
  - **SRC Verdict**: **Consequentialist** (due to Q2).  
  - *Drafters Won’t Like*: Despite "accountability" rhetoric, the mechanism is purely risk-based incapacitation. Must document as C.  

  ---

  ### **Where the SRC Misfires**  
  1. **False Negatives in Hybrid Bills**: If a bill *equally* balances R and C mechanisms (e.g., proportionality baseline + risk-based adjustments), analysts may split on which is "primary."  
  2. **Cultural Keywords**: Terms like "restorative justice" or "community protection" may be interpreted as R or C based on local legal traditions.  
  3. **Implied Intent**: Bills avoiding purpose clauses force over-reliance on mechanisms, missing rhetorical laundering (e.g., a predictive law quietly titled "Justice for Victims Act").  

  **Final Tip**: When SRC flags laundering or values conflict, drafters should annotate: *"Statutory mechanism misaligned with stated purpose. Policy intent ambiguous."* No philosophy degree required—just track the text’s operational gears.
