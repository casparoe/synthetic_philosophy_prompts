prompt: |-
  Hey, I'm putting together a workshop for junior legislative drafters and I need a reusable decision procedure they can actually run. You should act like an expert in penal philosphy and institutional design—think carefully, start by brainstorming the distinctions that survive when you move from seminar-room talk to statutory text, then build the tool. I need a step-by-step checklist for classifying whether a sentencing bill is operating on retributivist logic (backward-looking desert, proportionality to blame) or consequentialist logic (forward-looking deterrence, rehabilitation, incapacitation), plus a specific flag for "rationale laundering"—where the language sounds like one but the mechanism does the other. The proscedure needs ordered questions, clear stop points ("label it X"), explicit escalation points where the call is about values not facts, and a time budget of about 15 minutes per bill with no philosophy training required. Then run it on two proposals: first, a bill that sets mandatory prison terms for ecological damage calculated by an "ecosystem harm index" that mimics proportionality but is actually driven by predictive damage modeling; second, a bill allowing sentence reduction for assault if the offender completes trauma-informed CBT, but framing the reduction as "earning mercy" rather than hitting rehab targets. Include one case where the checklist gives your drafters an answer they won't like and still have to document. End by saying exactly where the procedure will misfire or where two analysts in good faith will run it differently, and don't ask for any citations or reading lists—just the practical framework.
