prompt: |-
  I'm on the review board for a national physics funding agency and we're getting swamped with proposals about multiverse landscapes and string-theory scenarios that basically admit they can't be tested in any lab we'll have in the next fifty years. The applicants keep talking about "non-empirical confirmation" - like mathematical consistency, uniqueness of explanation, or this thing my colleague called "structural underdetermination," where a theory is supposedly supported just because every rival breaks some deeper consistency rule we already accept. I don't fully get it, and I need something reusable that my panel can actually run on these proposals without turning every meeting into a philosphy seminar.

  Can you write me a decision procedure - a checklist or flowchart in words - that takes whatever philosophers of science actually mean by non-empirical confirmation and turns it into steps we can apply? It should go in order, say what counts as a sufficient answer for each question, mark the exact points where the answer should be "reject," and be honest about which steps are just value judgments wearing a procedure costume. The hard cases it has to cover are: theories that predict literally nothing observable in principle, theories that predict things technically observable but practially impossible, and arguments that lean on this "structural underdetermination" idea. Then apply it to two actual-style proposals: one is a multiverse model using landscape statistics and anthropic reasoning to explain our physical constants being life-friendly, but it admits zero direct experimental signature; the other is a string-theoretic framework that claims it's the only 10-dimensional geometry that doesn't collapse into contradiction with quantum gravity results we already trust - what my colleague might call "explanatory anchoring" - but it doesn't constrain any parameter we can actually measure. I have a soft spot for the second one, so I need the procedure to tell me honestly whether I'm just biased.

  Also tell me where this procedure is guaranteed to misfire, what it can't do, and whether there's any way to make it less subjective without just pretending the subjectivity isn't there. Oh, and please don't ask me for citations or a reading list - I won't have time to recieve them and half my panel can't access the journals anyway.
reasoning: |-
  Okay, the user is on a review board for a physics funding agency dealing with proposals about untestable multiverse and string theory models. They need a practical decision procedure to evaluate these proposals without getting bogged down in philosophical debates. 

  First, I need to understand their core frustration: they're overwhelmed by proposals using "non-empirical confirmation" arguments that can't be tested experimentally. The key challenges are: theories predicting nothing observable (even in principle), those with technically observable but practically impossible tests, and arguments relying on "structural underdetermination."

  The user explicitly wants a step-by-step checklist or flowchart - not philosophical theory. It must: have clear rejection points, acknowledge where steps are actually value judgments, and handle their three hard cases. They also want it applied to two example proposals (multiverse anthropic explanation vs. string theory uniqueness claim), and they admit bias toward the second one so the tool must counteract that.

  Hmm... they're also very practical: no citations or reading lists, and it must work for a mixed-expertise panel. Underneath this, I suspect they're wrestling with how to allocate limited funds between empirical science and highly speculative but potentially foundational work. There's tension between rigor and open-mindedness.

  For the procedure itself, I should start with the most concrete filter (empirical testability) and progressively move to more abstract criteria. The rejection triggers need to be unambiguous - like "no path to testability" or "contradicts core physics." But I must flag steps where judgment calls happen, like weighing explanatory power.

  The multiverse case should fail early since it admits no experimental signature. The string theory case is trickier - its "uniqueness" argument might pass initial filters but stumble on falsifiability. My bias check would highlight that "explanatory anchoring" alone doesn't substitute for measurability.

  Biggest pitfalls: the procedure might unfairly penalize long-term theoretical work or mistake practical impossibility for principle impossibility. And yes, subjectivity can't be eliminated - only contained via panel discussion and declaring where judgments occur. 

  Noting their soft spot for the string proposal, I'll build in explicit bias checks: "Would this seem compelling if it came from a less prestigious group?" That should help.
answer: |-
  Here's a **Non-Empirical Confirmation Decision Procedure (NECDP)** designed for funding review panels. It prioritizes empirical science while transparently handling philosophical arguments, forcing explicit justification for non-testable claims, and highlighting value judgments. Rejection triggers are marked `[REJECT]`.

  ---

  ### **The NECDP Flowchart (In Words)**

  1.  **STEP 1: EMPIRICAL TESTABILITY (PRINCIPLE)**
      *   **Question:** Does the theory predict *any* phenomenon, signature, or parameter value that is *in principle* observable (i.e., doesn't violate known physical laws) within our universe?
      *   **Sufficient Answer:** "Yes, it predicts X, which could be observed by Y (even if Y is implausibly difficult/future tech)." OR "No, it explicitly predicts nothing observable in principle."
      *   **Actions:**
          *   **YES + Plausible Path:** Proceed to Step 2.
          *   **YES + Highly Implausible Path (e.g., requires galactic-scale engineering):** Proceed to Step 2, flag "Practical Testability Major Concern."
          *   **NO (In-Principle Untestable):** `[REJECT]` - **Core Science Funding Criterion Violation.** Reasoning: Core science funding mandates *potential* empirical grounding. Arguments move to Step 4 ONLY if compellingly justified (rare).
          *   **UNCLEAR:** Require immediate clarification from proposers. Ambiguity defaults to `[REJECT]` if unresolved.

  2.  **STEP 2: PRACTICAL TESTABILITY (WITHIN REASONABLE HORIZON)**
      *   **Question:** Is there a *credible, feasible pathway* to test the key predictions identified in Step 1 within the next ~50 years (or a clearly articulated longer-term plan with identifiable near-term milestones)?
      *   **Sufficient Answer:** "Yes, via planned/fundable experiment Z with timeline T." OR "No, test requires fundamentally unforeseeable tech/capacities."
      *   **Actions:**
          *   **YES + Credible Plan:** Proceed to Step 3 (Standard scientific merit review applies later).
          *   **NO (Effectively Untestable for Foreseeable Future):** Proceed to Step 4 (Non-Empirical Arguments). Flag "Reliance on Non-Empirical Confirmation."

  3.  **STEP 3: FALSIFIABILITY & RISK**
      *   **Question:** Is the proposed *test* (from Step 2) capable of *falsifying* the core claims of the theory? What is the risk of perpetual deferral ("moving the goalposts") if the test fails or is ambiguous?
      *   **Sufficient Answer:** "Yes, outcome A falsifies core claim B." + "Proposer acknowledges specific failure modes." OR "No, the test is only confirmatory/interpretable."
      *   **Actions:**
          *   **YES + Low Risk of Goalpost-Moving:** Standard scientific merit review applies. Non-empirical arguments are secondary.
          *   **NO / HIGH RISK:** Proceed to Step 4, weigh non-empirical arguments *heavily* against this weakness. Flag "High Falsifiability Risk."

  4.  **STEP 4: NON-EMPIRICAL ARGUMENT ASSESSMENT (VALUE JUDGMENT ZONE - PANEL DISCUSSION REQUIRED)**
      *   *Only reached if proposal failed Step 1 (rarely allowed) or Step 2 (common for these proposals).*
      *   **Question A: Uniqueness/Necessity:** Does the theory claim to be the *only possible* structure satisfying well-established, non-negotiable theoretical constraints (e.g., unitarity, Lorentz invariance, matching GR/QM limits)? Is this claim widely accepted or hotly contested? (`Structural Underdetermination`)
      *   **Question B: Explanatory Anchoring:** Does the theory provide a *compelling, non-ad-hoc* explanation for *existing, well-established* empirical results or deep theoretical puzzles *without introducing arbitrary new elements*? Does it resolve tensions better than rivals?
      *   **Question C: Internal Consistency/Beauty:** Is the theory exceptionally mathematically consistent, elegant, or parsimonious? Does this outweigh the lack of testability?
      *   **Question D: Fertility:** Does engaging with this theory demonstrably lead to new, testable *ideas, tools, or mathematical techniques* in *other, more empirically grounded areas* of physics?
      *   **Scoring (Panel Judgment):** Assign Low/Medium/High scores for A, B, C, D. **Crucially:**
          *   **A (Uniqueness)** requires *extremely strong consensus* on the constraints and the uniqueness proof. High bar.
          *   **B (Explanatory Anchoring)** must explain *existing* puzzles, not just accommodate parameters. Avoids "just-so" stories.
          *   **C (Beauty)** is the *most subjective*. Minimize weight unless overwhelmingly compelling *and* linked to A/B/D.
          *   **D (Fertility)** is often the strongest practical argument. Requires concrete examples of past/expected spillover.
      *   **Actions:**
          *   **STRONG A + STRONG B:** Consider for funding as *high-risk theoretical foundation*. Requires compelling justification.
          *   **STRONG D (regardless of A/B/C):** Consider for funding if spillover potential is *immediate and significant* (e.g., new math for condensed matter). Flag "Fertility-Driven."
          *   **WEAK A/B + WEAK D:** `[REJECT]` - **Insufficient Non-Empirical Justification.** Reasoning: Relies heavily on subjective C (Beauty) or vague promises.
          *   **MIXED / BORDERLINE:** Panel debate focuses on: *Is the potential foundational insight/spillover worth the cost and the deviation from empirical norms?* **This is the core value judgment.** Vote.

  5.  **STEP 5: BIAS CHECK (FOR ALL PROPOSALS REACHING STEP 4)**
      *   **Question:** Would this proposal be equally compelling if it came from an unknown researcher, challenged a dominant paradigm we favor, or lacked the "prestige" of its subfield? Are we favoring "beauty" or "elegance" because it aligns with our aesthetic preferences?
      *   **Action:** Mandatory panel discussion acknowledging potential biases before final decision. **Explicitly state reasons *against* funding the proposal.**

  ---

  ### **Applying NECDP to Your Example Proposals**

  **Proposal 1: Multiverse Landscape + Anthropics (Explains Constants, Zero Direct Signature)**
  1.  **Step 1:** NO (Admits zero direct experimental signature in *our* universe). Proceed to Step 4 ONLY if exceptionally justified (rare).
  2.  **Step 4:**
      *   **A (Uniqueness):** LOW. Landscape is vast; "selection" is ill-defined. No uniqueness.
      *   **B (Explanatory Anchoring):** MEDIUM/LOW. Explains constants *post-hoc* via anthropics, often seen as ad-hoc/tautological. Doesn't resolve new tensions.
      *   **C (Beauty):** SUBJECTIVE (Often rated LOW by critics, HIGH by proponents). High risk of bias.
      *   **D (Fertility):** LOW/MEDIUM. Anthropic reasoning has limited spillover success. Landscape statistics highly specific.
  3.  **Step 5:** High risk of bias favoring "big idea" or established names.
  4.  **Verdict:** Likely `[REJECT]` at Step 1 or due to Weak A/B/D in Step 4. Relies heavily on subjective C and weak B.

  **Proposal 2: Unique String Geometry ("Explanatory Anchoring" to QG, No Measurable Parameters)**
  1.  **Step 1:** YES (In principle, predictions *might* exist, e.g., via cosmology or exquisitely precise gravity tests, even if currently unimaginable). Proceed.
  2.  **Step 2:** NO (Credible pathway within 50 years? Unlikely). Proceed to Step 4.
  3.  **Step 4:**
      *   **A (Uniqueness):** HIGH? **THIS IS CRITICAL & CONTESTED.** Is the "only geometry not collapsing" claim *rigorously proven* and based on *universally accepted constraints*? Is there *true consensus* on this uniqueness? (If Yes: Strongest argument. If No/Uncertain: Weakens significantly).
      *   **B (Explanatory Anchoring):** HIGH. Key strength. Explains how QG *could* work, resolves known tensions (e.g., black hole entropy?) within its framework. Avoids new arbitrary elements *if* uniqueness (A) holds.
      *   **C (Beauty):** HIGH (Subjective, but often cited).
      *   **D (Fertility):** HIGH. String theory has undeniably generated powerful mathematical tools (e.g., AdS/CFT) used widely in other physics.
  4.  **Step 5:** **Your Bias Check:** Your soft spot likely relates to B/C. Would it be compelling if the uniqueness (A) claim was from an unknown group and challenged? Is D (fertility) the *real* driver, making A/B/C acceptable?
  5.  **Verdict:** Hinges **entirely** on Step 4A (Uniqueness). If panel judges **A is truly STRONG and CONSENSUS-BASED**, then Strong A + Strong B + Strong D justifies funding as high-risk foundational work. If A is weak/contested, then likely `[REJECT]` (Weak A, reliance on B/C/D). Your soft spot is understandable if A/B/D are strong, but Step 5 forces confronting if A is *actually* solid or just appealing.

  ---

  ### **Where NECDP Misfires & Limitations**

  1.  **Judging Uniqueness (Step 4A):** This is the Achilles' heel. What counts as "well-established, non-negotiable constraints"? (Is the Swampland program established? Is unitarity *enough*?) "Widely accepted" can mask groupthink. A rogue genius might be right but fail here.
  2.  **Fertility (Step 4D) is Retrospective/Fuzzy:** It's easier to judge *past* fertility. Predicting *future* spillover is speculative. Can incentivize proposals overpromising applications.
  3.  **Beauty (Step 4C) is Subjective:** The procedure minimizes its weight but can't eliminate its influence in borderline cases during panel debate (Step 4 Mixed/Borderline).
  4.  **Punishes True Paradigm Shifts:** A theory requiring *new* fundamental constraints (making current "non-negotiable" ones negotiable) will fail Step 4A. Revolutionary ideas often look non-unique or inconsistent *initially*.
  5.  **"Practical Impossibility" Threshold (Step 2):** Defining "credible, feasible pathway" (~50 years) is inherently speculative and conservative. Could stifle truly long-term vision.
  6.  **Can't Resolve Philosophical Disputes:** It structures the debate around non-empirical arguments but doesn't magically solve deep disagreements about evidence, confirmation, or theory choice. Step 4 *is* a philosophy seminar, just a focused one.
  7.  **Bias Persists:** Step 5 helps surface bias but doesn't eliminate it. Prestige, field politics, and personal relationships still influence panel dynamics.

  ---

  ### **Reducing Subjectivity (Without Pretending It's Gone)**

  1.  **Pre-Panel Calibration:** Before reviewing proposals, have a short session where panelists score hypothetical examples (like the two above) using NECDP. Discuss disagreements openly to align understanding of terms like "Uniqueness," "Explanatory," and "Fertility."
  2.  **Require Explicit Justification:** Proposers *must* address each relevant NECDP step explicitly in their proposal. Force them to defend uniqueness claims or fertility potential concretely.
  3.  **Independent Assessment of Uniqueness (Step 4A):** For proposals heavily reliant on A, solicit confidential input from 2-3 leading experts *not involved in the proposal or direct competition* on the validity/consensus of the uniqueness claim.
  4.  **Focus on Fertility (Step 4D) as Tie-Breaker:** When A/B are borderline, prioritize D. Does this proposal offer tools/math/concepts likely to benefit *other, currently active, empirical* research programs?
  5.  **Transparent Panel Voting:** In Step 4 Mixed/Borderline, require panelists to vote and state their primary reason (A, B, C, or D) and confidence level. Record this.
  6.  **Acknowledge the Gamble:** Frame funding approvals based on non-empirical arguments as *explicit high-risk, high-reward foundational bets*, not standard science. This sets expectations.

  **The NECDP doesn't eliminate the tension between empirical rigor and theoretical exploration. It forces that tension into specific, structured questions with clear rejection triggers, makes value judgments explicit, and provides a framework for consistent(ish), defensible(ish) decisions within the messy reality of funding frontier theoretical physics.** It tells you when you're biased by forcing you to articulate *why* you're overriding the empirical default. Use it as a scaffold for discussion, not an algorithm. Good luck!
