  We are designing a role-play called "The Protocol Court" for 12 students in a 60-minute advanced seminar.
   The goal is to create a performative tension around the denial of shared rational norms without naming it at first.
   We have two roles: Skeptics (who reject universal binding force of reasons) and Arbitrators (who apply the Mirror Rule: translate objections into terms the opponent could accept as binding).
   Non-monetary stakes control speaking turns.

   We need exactly five numbered parts:

   1. Setup and Roles: Assign 6 Skeptics and 6 Arbitrators; set in a formal court where Skeptics challenge the existence of universal reason and Arbitrators uphold disputes via the Mirror Rule.
   2. Rules and Stakes: Each turn requires a token (limited tokens per role); Skeptics must object without accepting universal reason, Arbitrators must rephrase objections in opponent's terms; token loss for rule violations.
   3. Timeline of Play: 5-minute setup, 20-minute opening arguments, 25-minute rebuttals (structured turns), 10-minute closing statements.
   4. Debrief Mapping: Link Skeptics' token losses to invoking intersubjective norms; show how denying reason requires using reason, pointing to transcendental conditions.
   5. Honest Notes: Predict Skeptics winning by exhaustion of tokens, not logic; note the activity cannot fully replicate the self-refutation of global skepticism without meta-discourse.

   Each part must be 1-2 sentences.

   Let's write accordingly.
answer: |-
  1. **Setup and Roles**: Assign six students as Skeptics, tasked with denying universally binding rational norms, and six as Arbitrators, mandated to enforce the Mirror Rule by rephrasing all objections into terms acceptable to the Skeptic’s own stated framework. Arrange seating in opposing semicircles facing a central "witness" chair for speakers.  

  2. **Rules and Stakes**: Speaking requires spending a token (three tokens per role initially); Arbitrators lose tokens for failing to apply the Mirror Rule, Skeptics lose tokens for accidentally invoking universal reason (e.g., "nobody could accept this"). Non-monetary stakes: token depletion silences a role, forcing strategic concessions.  

  3. **Timeline of Play**: First 10 minutes for opening claims (Skeptics attack norm universality, Arbitrators defend via Mirror Rule); 35 minutes of moderated objections (token-bid for turns, chair enforces rules); final 15 minutes for token-based voting on a fabricated "moot norm" (e.g., "disputes require third-party mediation").  

  4. **Debrief Mapping**: Highlight moments where Skeptics, to contest token loss, demanded fair rule application—exposing their tacit appeal to shared validity. Contrast with Arbitrators' struggles to "mirror" incoherent stances, revealing reason’s inescapable performative scaffold.  

  5. **Honest Notes**: Predict token exhaustion overwhelming logical nuance, and Skeptics "winning" by tactical silence; admit the activity cannot simulate skepticism’s total self-refutation, as players always share implicit game norms.
