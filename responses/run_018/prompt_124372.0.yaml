prompt: |-
  Compare the strategic logic of a commitment race—in which rival actors accelerate irreversible commitments in order to shift bargaining leverage—with the logic of escalation dominance, which structures crisis bargaining around a perceived monotonic ladder of costs. Focus specifically on the problem of credible reversibility: once a commitment mechanism (for instance, an automated response protocol or a delegated "dead hand" system) is activated or revealed, can either framework accommodate credible de-escalation, or does the mechanism collapse the distinction between strategic choice and mechanical execution? In your answer, distinguish whether automation should be treated as an extreme point on the commitment continuum or as a categorically different phenomenon that breaks the race logic altogether. You may draw on the 1962 Cuban Missile Crisis for illustration, but the analysis should rest on the conceptual comparison rather than on historical minutiae.
reasoning: |-
