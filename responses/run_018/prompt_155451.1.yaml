  ### **How to Use**  
  1. Answer Questions 1, 4, and 5 to determine your branch.  
  2. Answer Questions 2 and 3 to refine your stance within the leaf.  
  3. Locate your leaf position (a–e). Pragmatic pluralism (f) requires the additional diagnostic above.  
  4. Consult "Unoccupied Combinations" if your path has no leaf.  
  5. If your stance blends leaves (e.g., "I’m a pluralist about the Renaissance but essentialist about the Scientific Revolution"), repeat the tree for each period separately.
