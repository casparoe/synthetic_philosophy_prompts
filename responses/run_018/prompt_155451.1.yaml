  ### Decision-Tree Taxonomy: Historiographical Stances on Structural Breaks  

  **Instructions**: Answer each binary question with "yes" or "no" based on your historiographical commitments. The tree will sort your stance into one of six named positions (a–f) or flag unoccupied/incoherent views. All questions are self-contained and require no external knowledge.  

  ---

  #### **Question 1 (Root)**  
  If a historian in Ming-dynasty China (c. 1600) used *internal institutional criteria* (e.g., shifts in university curricula, metallurgical techniques, patronage structures) to periodize Latin European history, would she identify a distinct "**Renaissance**" separate from prior centuries?  
  - **Yes** → Go to Question 4.  
  - **No** → Go to Question 3.  

  #### **Question 2**  
  Is the "**Scientific Revolution**" break defined by a *specific metaphysical commitment* (e.g., mechanism/mathematization of nature), excluding figures like Paracelsus/alchemists regardless of chronology?  
  - **Yes** → Diagnostic: Break requires a *unified intellectual core*.  
  - **No** → Diagnostic: Break defined by *institutional practices* (e.g., academies, peer review, experiments), even with diverse metaphysics.  
  *(Answers to Q2 alone do not branch the tree but refine your leaf position.)*  

  #### **Question 3**  
  Is "**the Middle Ages**" bounded *primarily by non-quantitative factors* (feudal legal structures + cultural dominance of Latin Christianity), rather than by *quantitative factors* (technological/demographic stagnation relative to adjacent eras)?  
  - **Yes** → Diagnostic: Institutional/cultural factors are primary.  
  - **No** → Diagnostic: Quantitative stagnation defines the period.  
  *(Answers to Q3 alone do not branch the tree but refine your leaf position.)*  

  #### **Question 4**  
  Do the terms "Middle Ages," "Renaissance," and "Scientific Revolution" apply *even approximately* to non-Latin-Christian civilizations (e.g., Islamic, Chinese, or South Asian histories)?  
  - **Yes** → Go to Question 5.  
  - **No** → Go to Leaf **b** or **c**.  

  #### **Question 5**  
  Does naming an era a "**Renaissance**" or "**Scientific Revolution**" *necessarily* carry a normative judgment of recovery/progress?  
  - **Yes** → Diagnostic: Terms are inherently teleological.  
  - **No** → Diagnostic: Terms can be purely descriptive.  

  ---

  ### **Leaf Positions**  
  Map your answers to a final stance:  

  | Path (Q1 → Q4 → Q5) | Answers to Q2/Q3 | Leaf Position | Description |
  |----------------------|------------------|---------------|------------|
  | **Q1: Yes → Q4: Yes → Q5: Any** | Any combination | **a) Strong Universal Essentialism** | The three periods are *discovered natural kinds* with cross-cultural analogues. Structural breaks are objective, defined by institutional/intellectual shifts visible to any observer (e.g., Ming historian). |  
  | **Q1: Yes → Q4: No** | Any combination | **b) Weak Regional Essentialism** | Periods are *real structural breaks* but *only within Latin Europe*, defined by specific institutions (e.g., feudalism, universities). Terms do not apply elsewhere. |  
  | **Q1: No → Q4: No → Q5: Yes** | Any combination | **c) Eurocentric Constructivism** | Terms are *useful pedagogical fictions* for organizing European history but carry Eurocentric teleology (e.g., "rebirth," "progress"). They should not be applied to non-European histories. |  
  | **Q1: No → Q4: No → Q5: No → Q3: Yes** | Any Q2 | **d) Global Comparative Constructivism** | All tripartite periodizations (Medieval/Renaissance/Scientific Revolution) *impose false unity* and should be abandoned. They are retroactive narrative impositions, not just Eurocentric but globally inapplicable. |  
  | **Q1: No → Q4: No → Q5: No → Q3: No** | Any Q2 | **e) Deflationary Continuity** | Change is *gradual everywhere*; no structural breaks justify capitalized period names. Quantitative factors (e.g., demographics, technology) show continuity, not rupture. "Revolution" labels exaggerate disjunction. |  
  | *No valid path* | *N/A* | **f) Pragmatic Pluralism** | *This tree cannot locate pragmatic pluralism* (see "Indistinguishable Leaves" below). |  

  ---

  ### **Unoccupied Combinations**  
  The following answer combinations have no corresponding leaf due to incoherence or unattractiveness:  

  1. **Q1: No → Q4: Yes** (Any Q2/Q3/Q5)  
     - **Diagnosis**: **Incoherent**. If the terms apply cross-culturally (Q4: Yes), the breaks should be detectable by external observers using institutional criteria (contradicting Q1: No). Unattractive as it implies breaks are "real" outside Europe but "constructed" within it.  

  2. **Q1: No → Q4: No → Q5: Yes → Q3: No**  
     - **Diagnosis**: **Unattractive**. Combines teleology (Q5: Yes) with a quantitative definition of the Middle Ages (Q3: No). Rare in practice, as teleological narratives (e.g., "Dark Ages") typically rely on cultural/institutional decline, not stagnation metrics.  

  3. **Q1: Yes → Q4: Yes → Q5: Yes** (with Q3: No)  
     - **Diagnosis**: **Unexplored**. Asserts universal breaks (Q1/Q4: Yes) defined by progress (Q5: Yes) but quantifies the Middle Ages as stagnation (Q3: No). Few defend this, as stagnation implies discontinuity, clashing with essentialism’s emphasis on institutional/cultural ruptures.  

  ---

  ### **Indistinguishable Leaves and Missing Tools**  
  The tree cannot separate these pairs with the five questions. Additional diagnostics are needed:  

  1. **Weak Regional Essentialism (b) vs. Pragmatic Pluralism (f) when Q1: Yes, Q4: No**  
     - **Problem**: Both may agree that the Renaissance is identifiable institutionally in Europe (Q1: Yes) but not cross-culturally (Q4: No).  
     - **Additional Diagnostic Needed**: *"Is the Renaissance’s reality dependent on the historian’s purpose (e.g., studying art vs. economics), or is it an objective feature of European history?"*  
       - Purpose-relative → **f) Pragmatic Pluralism**.  
       - Objective → **b) Weak Regional Essentialism**.  

  2. **Strong Universal Essentialism (a) vs. Deflationary Continuity (e) when Q1: No, Q4: No, Q5: No, Q3: No**  
     - **Problem**: Deflationary continuity (e) requires Q1: No and Q4: No, but universalists (a) require Q1: Yes. No overlap. *This pair is already separable*.  
     - **Actual Gap**: **Pragmatic Pluralism (f)** is invisible in this tree because it rejects fixed binaries. To capture it, add:  
       *"Can the same era (e.g., 1500–1700 Europe) be validly termed 'Renaissance,' 'Scientific Revolution,' or 'Early Modern' based on the inquiry, without one being ontologically primary?"*  
       - Yes → **f) Pragmatic Pluralism** (overrides other leaves).  

