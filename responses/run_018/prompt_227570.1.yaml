answer: |-
  ## Desiderata for Expressivist Semantics: A Neutral Framework

  **Core Insight:** The Frege-Geach problem isn't one monolithic problem, but a *cluster* of challenges arising from the interaction between expressivism's core commitments (non-descriptive meaning, anti-realism) and the compositional, logical, and pragmatic features of normative language. An adequate expressivist semantics must navigate this cluster.

  **Categorization Key:**
  *   **GEN:** Genuine Constraint (Non-negotiable for any plausible semantics, including expressivist).
  *   **EXP:** Expressivist-Specific Constraint (Essential for expressivism to be distinct and viable).
  *   **CON:** Contested Constraint (Cognitivists see as essential; Expressivists may dispute or reinterpret).

  ---

  ### I. Compositional Semantics: Embedding & Uniformity (GEN)
  The core challenge: Provide a *single, unified account* of normative terms/sentences that explains their semantic contribution across *all linguistic contexts*, whether freestanding or embedded.

  1.  **Freestanding Assertions:** Explain the meaning of a freestanding normative sentence (e.g., "Lying is wrong") as expressing a non-cognitive attitude (e.g., disapproval of lying). *(EXP)*
      *   *Motivation:* Foundational expressivist commitment. Failure means abandoning expressivism.
  2.  **Negation:** Explain the meaning of negated normative sentences (e.g., "Lying is not wrong," "It is not the case that lying is wrong"). The meaning must differ systematically from the positive assertion and explain the obvious inconsistency between "Lying is wrong" and "Lying is not wrong." *(GEN)*
      *   *Motivation:* Basic compositional competence; fundamental logical relation (contradiction).
  3.  **Disjunction & Conjunction:** Explain the meaning of normative disjunctions (e.g., "Either lying is wrong or charity is optional") and conjunctions (e.g., "Stealing is wrong and murder is wrong"). Must account for how the attitudes expressed by the components combine and how these compounds function in reasoning. *(GEN)*
      *   *Motivation:* Pervasive use in ordinary language and reasoning; key for logic.
  4.  **Conditionals:**
      *   **a) Normative Consequent:** Explain indicative conditionals with normative consequents (e.g., "If he lied, then he did something wrong"). Must validate modus ponens. *(GEN)*
      *   **b) Normative Antecedent:** Explain indicative conditionals with normative antecedents (e.g., "If lying is wrong, then telling your brother is wrong"). Must validate modus ponens and account for the role of the antecedent. *(GEN)*
      *   **c) Mixed Conditionals:** Explain conditionals mixing descriptive and normative components (e.g., "If it causes suffering, then it's wrong"). *(GEN)*
      *   *Motivation:* Essential for practical reasoning, moral arguments, and logical validity (modus ponens is non-negotiable). Failure here is the classic "embedding problem."
  5.  **Attitude Reports:** Explain sentences embedding normative claims under propositional attitude verbs (e.g., "Alice believes that lying is wrong," "Bob doubts that charity is required"). Must distinguish meaningfully between *believing that p* and *merely accepting p in a context*. *(GEN/CON)*
      *   *Motivation:* Ordinary language reports beliefs, doubts, fears *about* normative matters. *(GEN)* Expressivists must avoid collapsing belief into mere acceptance or making "Alice believes lying is wrong" mean "Alice disapproves of lying" (which misrepresents the content of *Alice's* attitude). *(CON - Expressivists may offer non-standard accounts of "belief" here)*
  6.  **Modals:** Explain normative claims embedded under modals (e.g., "It might be wrong," "It must be wrong," "It is possible that lying isn't always wrong"). *(GEN)*
      *   *Motivation:* Pervasive use in nuanced normative discussion and uncertainty.
  7.  **Mixed Atomic Sentences:** Explain sentences where normative predicates apply to descriptive subjects or vice-versa within a single clause (e.g., "That act was wrong," "Cheating is dishonest"). *(GEN)*
      *   *Motivation:* Basic subject-predicate structure is fundamental; normative terms often modify descriptive subjects.
  8.  **Quantification:** Explain quantification into normative contexts:
      *   **a) Objectual:** "Every action he takes is wrong." *(GEN)*
      *   **b) Propositional:** "Everything Alice said about morality is true." *(GEN/CON)*
      *   **c) Complex:** "There is something wrong with every proposal." *(GEN)*
      *   *Motivation:* Essential for expressive power and complex moral generalizations. Handling propositional quantification (b) often interacts deeply with truth-aptness.

  ### II. Logic & Inference (GEN)
  The core challenge: Explain how normative language *systematically participates in valid deductive inferences* alongside descriptive language, without equivocation.

  9.  **Preservation of Standard Valid Inference Patterns:** Validate core logical inferences involving normative sentences, especially modus ponens (e.g., "If lying is wrong, then telling your brother is wrong. Lying is wrong. Therefore, telling your brother is wrong."), non-contradiction, disjunctive syllogism, etc., when these patterns intuitively apply to normative discourse. *(GEN)*
      *   *Motivation:* Logic underpins rational moral argument and deliberation. Failure implies normative reasoning is fundamentally illogical or equivocal.
  10. **Non-Equivocation in Mixed Inferences:** Explain why modus ponens and other inferences work seamlessly when premises combine descriptive and normative elements (e.g., "If causing needless suffering is wrong, then kicking puppies is wrong. Causing needless suffering is wrong. Therefore, kicking puppies is wrong."), demonstrating there is no semantic shift or equivocation on the normative terms. *(GEN)*
      *   *Motivation:* Moral reasoning constantly mixes descriptive and normative premises. Treating normative terms as shifting meaning in such contexts is implausible and crippling.
  11. **Explaining Apparent Invalidities:** Provide a principled reason for why certain *invalid* inferences involving normative language remain invalid (e.g., "Lying is wrong; therefore, everyone believes lying is wrong" - invalid, and expressivism should explain why). *(GEN)*
      *   *Motivation:* Distinguishing valid from invalid reasoning is part of a complete semantic account.

  ### III. Phenomenology & Pragmatics (GEN/CON)
  The core challenge: Account for how normative language is *actually used* in discourse, including features that *prima facie* suggest descriptive, truth-apt content.

  12. **Disagreement:** Explain the nature of genuine *disagreement* in normative matters (e.g., Alice: "Lying is wrong." Bob: "No, lying is not always wrong."). Must distinguish it robustly from mere difference in taste ("Alice likes chocolate, Bob dislikes chocolate") or preference. The explanation should capture the sense of *fault* or *incorrectness* attributed to the opposing view in normative disagreement. *(GEN)*
      *   *Motivation:* The phenomenology and practice of moral debate demand a robust notion of disagreement. Failure reduces expressivism to relativism or subjectivism about disagreement.
  13. **Inconsistency:** Explain why holding contradictory normative judgments (e.g., simultaneously judging "Lying is wrong" and "Lying is not wrong") is a rational defect *in the same way* (or a relevantly similar way) as holding contradictory descriptive beliefs, preventing agents from "reasoning themselves into contradiction." *(EXP/GEN)*
      *   *Motivation:* Rational agents avoid normative contradictions just like factual ones; this seems fundamental to the *logic* of attitudes expressivism posits. *(GEN)* Expressivists need an account of attitude inconsistency that grounds this. *(EXP)*
  14. **Truth-Aptness & Truth Ascriptions:** Explain the widespread practice of *calling* normative claims "true" or "false" (e.g., "What Alice said is true," "It is true that lying is wrong") in a way that is non-defective and not merely metaphorical or error-ridden. *(CON - Expressivists often aim to "earn" or "deflate" this)*
      *   *Motivation:* Ordinary language treats moral claims as truth-apt. Cognitivists see this as strong evidence for descriptivism. Expressivists typically need a minimalist/deflationist or hybrid strategy.
  15. **Belief & Acceptance:** Explain the practice of saying we *believe* normative claims (e.g., "I believe capital punishment is unjust"). *(CON - Expressivists often offer non-cognitive analyses of "belief" here)*
      *   *Motivation:* Ordinary language attributes beliefs about morality. Cognitivists see this as straightforward evidence for cognitive states. Expressivists need a compatible account of "belief".
  16. **Retraction & Correctness:** Explain the practice of *retracting* past normative judgments (e.g., "I was wrong to think that was acceptable") and the related sense that normative judgments can be *correct* or *incorrect*. *(GEN)*
      *   *Motivation:* Essential features of moral discourse and learning; imply a standard beyond mere current attitude.
  17. **Revisability & Argument:** Explain how normative judgments are responsive to *argument* and new information (descriptive *and* normative), leading to rational revision (e.g., "Learning how much it hurt them made me see that it was wrong"). *(GEN)*
      *   *Motivation:* Moral deliberation and progress are central to normative practice; expressivism must show how attitudes are rationally criticizable and revisable.

  ### IV. Foundational Commitments (EXP)
  The core challenge: Maintain the core motivations for being an expressivist in the first place.

  18. **Anti-Realism:** Avoid committing to the existence of irreducible, stance-independent normative facts, properties, or truth-makers. *(EXP)*
      *   *Motivation:* The primary *raison d'être* of expressivism (motivations vary: metaphysical parsimony, naturalism, queerness, motivational internalism).
  19. **Internalism (Moral Judgment):** Explain (or at least be compatible with) the plausible thesis that sincerely judging that X is wrong (or right, etc.) is intrinsically motivating (at least to some degree) for the agent, barring weakness of will, etc. *(EXP - though strength varies)*
      *   *Motivation:* A key traditional motivation for expressivism; cognitivism struggles with the "motivation problem". Failure weakens expressivism's appeal.
  20. **Distinctness from Descriptivism:** The account must be *genuinely expressivist*, meaning the core meaning of normative sentences is constituted (at least in part) by the expression of a non-cognitive, conative state of mind (e.g., plan, commitment, disapproval) and *not* primarily by representing a descriptive state of affairs. *(EXP)*
      *   *Motivation:* Otherwise, it collapses into a form of cognitivism, realism, or descriptivism.

  ---

  **Structural Tensions & Joint Unsatisfiability Concerns:**

  1.  **Compositionality vs. Anti-Realism (The Core Tension):** The deepest structural problem. (GEN 1-8) requires normative content to project uniformly across contexts like descriptive content, playing identical logical roles. (EXP 18, 20) insists this content is fundamentally *non*-descriptive and doesn't represent reality. Bridging this gap – making attitude expression behave logically *just like* propositional representation – is the expressivist's fundamental task. Solutions inevitably involve complex theoretical machinery (hyperplans, being-for, minimalism) that risks either collapsing into descriptivism or becoming implausibly ad hoc.
  2.  **Logic without Truth-Conditions (GEN 9-11 vs. EXP 18):** Valid inference is classically defined over truth-conditions. (EXP 18) rejects robust truth-conditions for normative sentences. Expressivists must either provide an alternative foundation for logic (e.g., in terms of consistency of attitudes/plans) or embrace a deflationism about truth that allows truth-talk without robust truth-conditions. The former is difficult; the latter risks trivializing the explanatory burden.
  3.  **Robust Disagreement vs. Anti-Realism (GEN 12 vs. EXP 18):** Capturing the robust "clash" of normative disagreement often seems to require a shared, objective standard of correctness. (EXP 18) denies such a standard exists. Expressivists must explain the clash purely in terms of the incompatibility of attitudes/plans/stances. While possible (e.g., conflicting plans cannot both be executed), it's contentious whether this captures the full *normative* force of moral disagreement ("You *shouldn't* think that!").
  4.  **Phenomenology (Truth/Belief) vs. Expressivist Core (GEN 14-15 vs. EXP 20):** The ordinary practices of calling moral claims "true" and saying we "believe" them strongly suggest cognitive, descriptive content. Expressivists must either provide convincing non-descriptive analyses of these practices (minimalism, reinterpretation) or adopt hybridity. Neither option is without cost: minimalism/deflationism risks vacuity or losing explanatory power; reinterpretation risks distorting ordinary meaning; hybridity risks compromising anti-realism.

  **Assessment of Main Approaches Against Desiderata:**

  1.  **Simple Attitude Expressivism (Ayer, early Stevenson):**
      *   *Strengths:* Clear on freestanding claims (1), Internalism (19), Anti-realism (18).
      *   *Fatal Weaknesses:* Utterly fails Compositionality (2-8), Logic (9-11), Disagreement (12 - reduces to difference), Inconsistency (13 - unclear), Truth/Belief (14-15), Retraction/Argument (16-17). *Cannot solve the core problems.*

  2.  **Gibbardian Norm-Expressivism / Planning Semantics (Gibbard):**
      *   *Strengths:* Powerful solution to Compositionality (1-8) and Logic (9-11) via hyperplans/plan-laden contents. Handles Inconsistency (13 - conflicting plans) and Disagreement (12 - incompatibility of plans) well. Retraction/Argument (16-17) handled via plan revision. Anti-realism (18) maintained.
      *   *Weaknesses:* Attitude Reports (5) remain tricky ("believes that p" mapped to "endorses hyperplan that entails p?"). Truth-Aptness (14) relies on deflationism/minimalism which some find unsatisfying. Belief (15) requires non-standard analysis. Internalism (19) connection to hyperplanning is less direct. Complexity is high.

  3.  **"Being For" / Commitment Semantics (Horgan, Timmons; Schroeder):**
      *   *Strengths:* Directly targets Compositionality (1-8) and Logic (9-11) by providing a uniform semantic value ("being for") with logical operators defined over it. Provides a clear account of Inconsistency (13 - being for A and not for A is primitive fault). Anti-realism (18).
      *   *Weaknesses:* The primitive "being for" relation is metaphysically/phenomenologically obscure. Struggles with Attitude Reports (5) ("believes that murder is wrong" = "believes that one ought to be for blaming for murder?"). Truth-Aptness (14)/Belief (15) require deflationist/hybrid maneuvers. Disagreement (12) explanation ("being for different things") may seem thin compared to planning clash. Motivation/Internalism (19) connection can be strained.

  4.  **Hybrid Expressivism (Ridge, others):**
      *   *Strengths:* Can easily accommodate Truth-Aptness (14), Belief (15), and descriptive elements of Disagreement (12) via the descriptive component. Handles Compositionality (1-8) and Logic (9-11) more straightforwardly by leveraging the descriptive content's logic.
      *   *Weaknesses:* Risks collapsing into Cognitivism/Descriptivism (20) if the descriptive component does all the compositional/logical work. Maintaining Anti-realism (18) is challenging – what is the descriptive component *describing* if not normative facts? The expressive component can seem redundant or fail to capture Internalism (19) robustly. Complex interaction between components needs careful specification.

  5.  **Minimalist/Deflationist Moves (Blackburn, Gibbard later work):**
      *   *Strengths:* Directly addresses Truth-Aptness (14) and Belief (15) by deflating truth/belief, making them compatible with expressivism. Helps with Logic (9-11) by allowing truth-talk in logical principles without robust truth-conditions. Preserves Anti-realism (18).
      *   *Weaknesses:* Does *not* solve Compositionality (1-8) or the Logic foundation (9-11) *by itself*; needs a semantics like Gibbard's or Schroeder's to plug into. Risks trivializing the explanatory challenge ("It's true that lying is wrong" just means "Lying is wrong"). May struggle to capture the robust *normativity* of correctness/incorrectness (16) or the full force of Disagreement (12) beyond minimal contradiction. Internalism (19) still needs separate grounding.

  **Conclusion for Your Seminar:** Presenting the desiderata in this structured way – clearly separating GEN, EXP, and CON categories, highlighting the core compositional/logical challenges (GEN 1-11), the phenomenological pressures (GEN/CON 12-17), the expressivist commitments (EXP 18-20), and especially the underlying structural tensions – provides a powerful, neutral framework. It allows students to see precisely *which aspect* of "the Frege-Geach problem" a given solution targets and where it might stumble on other fronts. Emphasize that the hardest tensions (Compositionality vs. Anti-Realism; Logic without Truth-Conditions; Robust Disagreement vs. Anti-Realism) are not mere puzzles awaiting a clever solution, but fundamental conceptual pulls that any expressivist theory must navigate, often requiring significant theoretical innovation with associated costs. This framework should empower your students to critically evaluate *any* expressivist proposal systematically.
