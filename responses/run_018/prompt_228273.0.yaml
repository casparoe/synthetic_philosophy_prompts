prompt: |-
  I'm on the board of a small family foundation (about a $40m endowment). Our founder, who died two years ago, made our then-chair -- her son -- promise on her deathbed that the foundation would never fund political advocacy, only direct service work. Importantly, she could have written this into the trust deed and didn't; she said she trusted him and wanted the foundation to stay flexible. He's since retired. Now our program staff have found what looks like an unusally effective opportunity in exactly the banned area (some campaign finance reform work where our money could plausibly do more good than anything else we fund), and the board is split. Half says a promise is a promise, and the dead can be wronged. The other half says she's dead -- she has no expectations left to disappoint and no plans to frustrate, the trust deed is what governs, and the fact that she deliberately declined to amend the deed shows she wanted future boards to be able to revisit this.

  I have to draft the decision memo for next month's meeting. Give me a clear recommendation -- fund it or don't -- but the memo needs to actually take a stand on why promises bind at all, because the board keeps talking past each other on precisely this point. Is it that promises create expectations and reliance, that breaking one disrespects the promisee's will, or that the whole practice of promising only works if promises stick? Each answer seems to give a different verdict in this case, so work through which account should govern here and what follows from it for us. The strongest argument against your recommendation should get a genuine hearing too, since I'll be circulating this to people who will vote the other way. Around 800 words.
reasoning: |-
  Okay, the user is on the board of a $40 million family foundation. The founder made her son promise on her deathbed not to fund political advocacy, only direct service work. She didn't include this in the trust deed, saying she trusted him and wanted flexibility. Now the son has retired, and the program staff found an effective opportunity in campaign finance reform—exactly the area the founder banned. The board is split: half say a promise is a promise, and the dead can be wronged; the other half argue she's dead, so there are no expectations to disappoint, and the trust deed governs. The user has to draft a decision memo for the next meeting, taking a stand on why promises bind and addressing the philosophical debate.

  First, I need to unpack the core philosophical question: why do promises bind? The three main arguments mentioned are: (1) creating expectations and reliance, (2) respecting the promisee's will, and (3) upholding the practice of promising for societal trust. 

  Looking at expectation and reliance: the founder is dead, so she can't have expectations or rely on the promise anymore. Her son, the promisee, has retired and isn't involved. The board members now weren't part of the original promise. So this argument might not hold here. 

  On respecting the will: the founder deliberately chose not to amend the trust deed. She wanted flexibility for future boards. That suggests she trusted future leaders to use their judgment, even if she expressed a preference. Her will, as legally documented, allows funding advocacy. 

  The practice-based argument is stronger. Promises need to stick for trust in institutions. But this was a personal, oral promise, not a formal one. The foundation has legal documents that don't include this restriction. Upholding the trust deed might actually support institutional integrity more than adhering to an informal promise.

  The strongest reason to fund the opportunity is that the founder intentionally didn't bind the foundation legally. She prioritized flexibility. Her son has retired, so no one is relying on this promise now. The campaign finance work is unusually effective, aligning with the foundation's mission to do good. 

  Against funding: breaking the promise might feel like betraying the founder's memory. It could set a precedent for ignoring past commitments, potentially eroding trust within the family or board. But since the promise wasn't formalized, and the founder wanted flexibility, this might not apply. 

  The user needs a clear recommendation. Funding the opportunity seems justified because the founder's actions (not amending the deed) show she trusted future boards. The philosophical arguments support this, especially the focus on the promisee's will and the lack of ongoing reliance. 

  Also, the memo must address counterarguments thoroughly. The respect for the dead and keeping promises are valid concerns, but the founder's choice for flexibility outweighs them. The foundation's duty is to maximize impact, and this opportunity does that. 

  I should structure the memo to first present the recommendation, then analyze the promise-binding theories, discuss the founder's intent, address counterarguments, and conclude with action steps. Keep it balanced but decisive, around 800 words.
answer: |-
  ## Recommendation Memo: Funding the Campaign Finance Reform Opportunity  

  **To:** Board of Directors  
  **From:** [Your Name]  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Funding Campaign Finance Reform Initiative & Analysis of the Founder’s Promise  

  ### I. RECOMMENDATION
  **Fund the campaign finance reform initiative.** The foundation’s duty to maximize impact through its charitable purpose, as defined in the trust deed, outweighs the moral weight of the founder’s deathbed promise to her son. This promise, while sincere, was deliberately excluded from the governing documents to preserve flexibility for future boards. Honoring the founder’s *demonstrated intent* (flexibility and trust in governance) requires exercising the judgment she empowered us to use.  

  ### II. THE CORE DISAGREEMENT: WHY DO PROMISES BIND?
  The board’s deadlock stems from conflicting philosophical views on the nature of promissory obligation. Three primary theories exist, each leading to different conclusions here:  

  1.  **Expectations & Reliance:** Promises bind because they create expectations in the promisee and may induce reliance. Breaking a promise wrongs the promisee by disappointing expectations or causing harm due to relied-upon actions.
      *   *Application Here:* The promisee (the son) is retired and no longer actively involved. He cannot experience disappointment or harm from reliance *now*. The founder is deceased and cannot experience disappointment. **Verdict: Funding is permissible.** The core wrong (harming the promisee through broken expectations/reliance) is absent.  

  2.  **Respecting the Will/Autonomy of the Promisor:** Promises bind because they represent an exercise of the promisor’s will. Breaking a promise disrespects the promisor’s autonomous choice and violates their right to determine how others act based on their commitment.
      *   *Application Here:* The founder’s will was explicitly expressed *twice*: the deathbed request *and* the deliberate decision **not** to amend the trust deed. Her stated reason ("trusted him and wanted the foundation to stay flexible") demonstrates her *overriding will* was to empower future boards, not to create an immutable restriction. Respecting her autonomy means prioritizing her documented choice for flexibility over her oral preference. **Verdict: Funding is permissible.** Adhering to the formal, flexible structure she chose respects her will more rigidly than adhering to an oral instruction she declined to formalize.  

  3.  **The Practice of Promising (Fidelity):** Promises bind because the entire social institution of promising relies on fidelity. Breaking a promise, even if no one is directly harmed, undermines trust in the practice itself and weakens a vital social glue.
      *   *Application Here:* This is the strongest argument against funding. Breaking a solemn, deathbed promise *feels* like a betrayal of trust, potentially undermining the foundation’s culture of integrity or the family’s sense of legacy, even if no specific harm occurs.
      *   *Counterbalance:* The "practice" argument must consider context. This was a *personal* promise (mother-to-son), not an institutional policy. The founder herself signaled the primacy of the *institutional* governance document (the deed) over the personal promise by refusing to amend it. Upholding the deed *is* upholding the foundational practice of institutional governance she established. Further, the promise was inherently time-bound ("trusted *him*"). Its primary force resided in the son’s stewardship. **Verdict: Nuanced.** While fidelity is crucial, applying it rigidly to an informal, context-specific promise contradicted by the founder’s formal governance choice risks misapplying the principle and *undermining* the institutional trust built into the deed.  

  ### III. WHY THE RECOMMENDATION STANDS: INTENT, GOVERNANCE, AND IMPACT
  *   **The Founder’s Documented Intent Prevails:** Her conscious choice *not* to amend the trust deed is our clearest guide. She prioritized the foundation's long-term adaptability over binding future generations to her specific policy preference. We disrespect that choice *more* by treating an oral promise as binding when she explicitly chose not to make it so.  
  *   **Governance Requires Exercising Mandated Judgment:** The trust deed delegates authority to the board to fulfill the charitable purpose. Our fiduciary duty compels us to pursue the most effective means to that end. Declining an "unusually effective opportunity" that aligns with our charitable purpose (even if adjacent to "political advocacy") because of an extra-legal restriction contradicts our governance mandate and squanders charitable resources.  
  *   **The Promise’s Scope and Context:** This was a promise *to her son about his conduct as Chair*. He has fulfilled that duty and retired. The current board, not party to the original promise and operating under the flexible governance structure the founder designed, must act based on current circumstances and the foundation’s best interests.  
  *   **Impact Cannot Be Ignored:** If the due diligence confirms this initiative offers exceptional impact within our mission, refusing it based on an informal, non-binding restriction conflicts with our core responsibility as stewards of charitable funds. The founder established the foundation to *do good*, not to enshrine a personal aversion in perpetuity beyond the legal framework.  

  ### IV. THE STRONGEST COUNTERARGUMENT: FIDELITY AND THE GHOST AT THE TABLE
  **The most compelling argument against funding is rooted in the "Practice of Promising" (Fidelity) and the moral weight of a deathbed vow:**  

  *   **The Argument:** "A deathbed promise carries unique moral gravity. It represents a final act of trust and commitment. Breaking it, even decades later and for seemingly good reasons, corrodes the sanctity of promises and disrespects the founder's dying wish. It risks creating a culture where commitments are seen as contingent, undermining trust within the board and the family. It feels like a betrayal of the founder's spirit and the son's solemn oath, potentially damaging the foundation's ethos and the family's connection to its legacy. The founder trusted her son to honor her wish; he implicitly trusted future boards to uphold that commitment. Breaking it violates that chain of trust. The absence of reliance *now* doesn't erase the profound disrespect to the founder's final expression of will *then*."  

  **Response:** This argument powerfully captures the emotional and symbolic weight. However:  
  1.  **The Founder's Countervailing Will:** She deliberately balanced her wish against the need for flexibility *by not amending the deed*. Honoring her *overall* intent requires respecting this choice. Prioritizing the oral promise *over* her documented governance decision disrespects her deliberate act.  
  2.  **Governance vs. Personal Morality:** The board's duty is to the foundation's charitable purpose as defined legally. While personal morality informs our judgment, it cannot override our fiduciary duty when the founder explicitly declined to make her preference legally binding.  
  3.  **The Specificity of the Promise:** The promise was made *to the son* concerning *his* role. Holding future, unrelated boards bound in perpetuity stretches the promise beyond its original context and intent.  
  4.  **The Greater Betrayal?** Could refusing exceptionally effective work within the foundation's mission, based on an extra-legal restriction the founder herself declined to codify, be a *greater* betrayal of the founder's ultimate goal – impactful charitable giving?  

  ### V. CONCLUSION & PATH FORWARD
  The founder’s wisdom lay in trusting future boards to exercise judgment within the flexible framework she legally established. The campaign finance reform initiative presents a compelling, high-impact opportunity aligned with our charitable purpose. While the deathbed promise carries emotional resonance, the founder’s decisive act – refusing to amend the trust deed – demonstrates her intent that such restrictions should not bind future boards absolutely.  

  **Recommendation:** Approve funding for the campaign finance reform initiative.  

  **Action:**  
  1.  Formal board vote on the initiative.  
  2.  Acknowledge the founder’s original concern and the board’s thoughtful deliberation on this complex ethical matter in the resolution/minutes.  
  3.  Ensure robust due diligence and monitoring for the initiative, given its nature.  

  This decision honors the founder’s *demonstrated* trust in our governance while maximizing the impact of her legacy.
