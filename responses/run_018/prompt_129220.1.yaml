prompt: |-
  hey, in my philosphy of science reading group last week someone shut down the pessimistic meta-induction by just dropping the old no-miracles line: realism is the only philosophy that doesnt make the success of science a miracle. like, okay, but what is that even saying? can you lay out the different precise claims hiding in that slogan — from the trivial ("science works, so we must be getting something right") to the radical ("antirealist accounts assign near-zero prior to the observed predictive success of dead theories like phlogiston, caloric, and the luminiferous ether") — and for each say whether its actually defensible and whether it answers the meta-induction worry? i want a menu i can bring back, not one picked answer. also flag which version people usually invoke just to end the argument, and whether that version even touches the history of false theories. dont need citations, just the disambiguation.
