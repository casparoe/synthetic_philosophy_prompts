reasoning: |-
  We are to specify a set of desiderata for a normative decision theory that aims to handle rational choice under undefined expectation, taking the Pasadena paradox and its variants as central stress-tests.

  The Pasadena paradox (introduced by Nover and Hájek) involves a game with a payoff sequence that conditionally converges to a finite value but is not absolutely convergent, leading to an undefined expectation (the series is conditionally convergent but not absolutely convergent, so rearrangements yield different sums). The game pays off 2^n / n with probability 1/2^n (for n=1,2,3,...) for heads on the n-th flip of a fair coin, but the sign alternates. The expectation is the alternating harmonic series, which is conditionally convergent (to ln(2)) but not absolutely convergent (since the harmonic series diverges). Hence, the expectation is not defined uniquely (it is rearrangement-sensitive).

  We also consider iterated and coupled-payoff variants.

  We break down the desiderata:

  I. Phenomena to Explain

    1. **The Basic Pasadena Paradox**: The theory must explain rational choice in the face of a single Pasadena game. Specifically, it must account for the fact that the expectation is undefined (due to conditional convergence) and provide a rational recommendation (e.g., whether to play or not) without relying on the undefined expectation.

    2. **Iterated Pasadena Games**: The theory must handle the case of multiple independent Pasadena games (e.g., two independent plays). The problem here is that the expectation of the sum of two independent Pasadena games is defined (because the series becomes absolutely convergent) and equals 2*ln(2). Thus, the theory must explain why two games might be acceptable even when one is problematic.

    3. **Coupled-Payoff Variants**: Consider a game where the payoff of one Pasadena game is made to depend on the outcome of another. The theory must handle such interdependence without generating contradictions.

    4. **Sequential Choice**: The theory must handle sequential decisions in which an agent faces a sequence of choices, some of which may have undefined expectations. For example, an agent might first choose whether to play a Pasadena game and then, conditional on the outcome, face another decision.

    5. **Comparison with Defined Alternatives**: The theory must explain how an agent should choose between a Pasadena game and a safe alternative with a defined expectation (e.g., $0 for sure) or another risky alternative with a defined expectation.

  II. Distinctions to Preserve

    1. **Heavy-tailed vs. Discontinuous Belief-updating**: 
        - Heavy-tailed payoff structures (like the Pasadena game) lead to undefined expectations because of the lack of absolute convergence. 
        - Discontinuous belief-updating rules (e.g., updating on events of probability zero) might also lead to undefined expectations (e.g., in the Borel-Kolmogorov paradox). 
        The theory must be able to distinguish between these two sources of undefinedness and handle them appropriately.

    2. **Single-shot vs. Sequential Choice**: The theory must account for the fact that in a single-shot Pasadena game, the expectation is undefined, but in iterated independent plays, the expectation becomes defined. This distinction must be preserved without ad hoc fixes.

  III. Consistency Conditions

    1. **Consistency with Standard Decision Theory (when expectations are defined)**: When the expectation is defined (e.g., in the iterated case), the theory should reduce to standard expected utility maximization (if that is the base theory). This is non-negotiable for any theory that aims to be an extension of standard decision theory.

    2. **Continuity Condition**: The theory should ideally satisfy a continuity condition: if a sequence of games with defined expectations converges (in some appropriate sense) to a game with undefined expectation, then the preferences over the approximating games should converge to the preference for the limit game. However, note that the Pasadena game can be approximated by truncated versions (which have defined expectations) that converge to ln(2) as the truncation point goes to infinity. But the full game is undefined. So the continuity condition would require that the agent be indifferent between the full game and a game that pays ln(2) for sure? But that is not what we get from the truncated versions. This is a tension.

  IV. Specific Tensions to Address

    - **Tension between Safety and Continuity**: 
        - If we require that an agent should never choose an action with undefined expectation when a safe alternative with defined expectation is available (safety principle), then the agent would reject the Pasadena game in favor of the safe option (say $0).
        - However, if we require continuity (that the agent's preferences for the truncated games, which pay approximately ln(2) for large truncations, should carry over to the full game), then the agent should prefer the full Pasadena game to $0 (since ln(2)>0). 

      This tension is at the heart of the problem. We must consider whether a theory can consistently maintain both.

      Known no-go results: It is known that no theory can simultaneously satisfy the safety principle and the continuity condition in the presence of the Pasadena game. This is because the truncated games (with defined expectations) have an expectation arbitrarily close to ln(2), so continuity would require the limit (the full game) to be valued at ln(2). But the safety principle requires rejecting the full game (because it has undefined expectation) in favor of a safe alternative (say 0). However, ln(2) > 0, so the continuity condition would require the agent to prefer the full game to 0, while the safety principle would require the opposite.

      Therefore, we must abandon one of these conditions. Which one is non-negotiable? The safety principle might be seen as fundamental by some (to avoid undefined expectations) while others might argue that the continuity condition is essential for rationality (so that the agent is not "discontinuous" in the limit).

      We note that the safety principle is not universally accepted. Some theories (like those based on weak expectations or principal values) might reject it. Similarly, continuity might be abandoned by theories that use a decision rule that is sensitive to the undefinedness (like taking a limit of truncations but then discounting because of the undefinedness).

  V. The Novel Constraint: Pasadena-with-Reflection

    We introduce a scenario in which the agent knows that her decision rule is being observed by a second-order predictor whose payoff structure is coupled to her choice.

    Example: The agent faces a choice between:
      - A: Play the Pasadena game.
      - B: Take $0.

    But there is a predictor who can perfectly predict the agent's choice. The predictor will reward the agent with an additional payoff if and only if the agent chooses an action that has a defined expectation. Specifically, if the agent chooses an action with defined expectation, she gets an extra $1; otherwise, she gets nothing extra.

    So the payoffs become:
      - If the agent chooses B (which has defined expectation: 0) then she gets 0 (from B) plus $1 (from the predictor) = $1.
      - If the agent chooses A (which has undefined expectation) then she gets the Pasadena payoff (undefined) plus $0 = the Pasadena payoff (still undefined).

    Now, if the agent uses a decision rule that avoids undefined expectations (safety principle), she will choose B and get $1. But note that if she chooses B, the expectation is defined (it's $1) and she gets $1. If she chooses A, the expectation is undefined and she gets the undefined Pasadena payoff plus $0 (so undefined). So the safety principle would recommend B.

    However, suppose the agent considers the following: if she were to use a rule that assigns a value to the Pasadena game (say, by truncation) and that value is greater than $1, then she would choose A and get the Pasadena payoff plus $0. But note that in that case, her action A has undefined expectation, so she does not get the extra $1. So she ends up with the Pasadena payoff (undefined) which is not comparable to $1.

    The challenge: The theory must not collapse into self-defeating behavior (e.g., if the agent uses a rule that assigns a finite value to the Pasadena game, then she is led to choose A, but then she gets an undefined outcome and misses the $1). Also, we must avoid undefined meta-expectations: the predictor's reward is well-defined and depends on the definedness of the expectation of the chosen action. We must not require the agent to compute an expectation of the entire scenario that might itself become undefined.

    The theory must accommodate this scenario without falling into either of these traps.

  VI. Desiderata List (with non-negotiable flags and camp-specific flags)

  We now list the desiderata explicitly:

    1. **Handling of Basic Pasadena**: The theory must provide a rational recommendation for the single Pasadena game without relying on the undefined expectation. (Non-negotiable: any adequate theory must handle the base case.)

    2. **Handling of Iterated Games**: The theory must handle iterated independent Pasadena games and explain why two games are acceptable (having defined expectation) while one is problematic. (Non-negotiable: the theory must be able to scale to multiple decisions.)

    3. **Handling of Coupled-Payoff Variants**: The theory must handle games with interdependent payoffs without generating contradictions. (Non-negotiable: the theory should be general.)

    4. **Sequential Choice**: The theory must handle sequential decisions in which some actions lead to undefined expectations. (Non-negotiable: real decisions are often sequential.)

    5. **Distinction of Sources of Undefinedness**: The theory must distinguish between undefined expectations arising from heavy-tailed payoff structures and those arising from discontinuous belief-updating. (Non-negotiable: because the treatment might be different.)

    6. **Reduction to Standard Theory**: When the expectation is defined, the theory must reduce to standard expected utility maximization. (Non-negotiable: for being an extension of standard decision theory.)

    7. **Safety Principle?**: If a safe alternative with defined expectation is available, the agent should avoid actions with undefined expectation. (Camp-specific: some theories might reject this. For example, a theory that uses the principal value of the expectation might assign ln(2) to the Pasadena game and then compare it to 0, and choose to play.)

    8. **Continuity Condition?**: The agent's preferences should be continuous across approximating sequences with defined expectations. (Camp-specific: it might be abandoned by theories that require absolute convergence.)

    9. **Avoidance of Self-Defeating Behavior in Reflective Settings**: The theory must handle the Pasadena-with-reflection scenario without leading the agent to choose an action that is self-defeating (i.e., without causing her to miss out on a sure reward that she could have had by choosing a defined-expectation action) and without requiring the computation of undefined meta-expectations. (Non-negotiable: because reflective scenarios are important in decision theory, especially in game theory and AI alignment.)

    10. **Consistency with Known No-Go Results**: The theory must be aware of the known impossibility of simultaneously satisfying the safety principle and the continuity condition in the context of the Pasadena game. Therefore, the theory must explicitly choose which of these to abandon (if it adopts either) and justify the choice.

  VII. Accommodating the Reflection Scenario

    The theory must provide a clear decision rule for the reflection scenario. One approach is to adopt the safety principle: the agent should choose B because it has defined expectation. Then she gets $1. This avoids the undefined outcome and the self-defeating behavior.

    Alternatively, if the theory rejects the safety principle and assigns a value to the Pasadena game (say, by the principal value ln(2)), then the agent would compare ln(2) (from A) and $1 (from B). Since ln(2)≈0.693 < 1, she would choose B anyway. So in this case, the theory would also choose B.

    But what if the principal value were greater than $1? For example, if the predictor's bonus were only $0.50, then the principal value of A is about 0.693, which is greater than 0.50? Then the agent would choose A? But then she does not get the bonus and ends up with the undefined Pasadena payoff. And if the theory assigns a defined value (0.693) to A, then why doesn't the predictor reward her? The predictor rewards only if the chosen action has a defined expectation. The chosen action (A) does not have a defined expectation (in the classical sense) even if the theory assigns a value by a non-standard method. So the predictor would not reward her.

    Therefore, we must clarify: the predictor is using the classical definition of expectation (absolute convergence). So the bonus is only given if the chosen action has an expectation that is defined in the classical sense.

    Hence, the agent's theory might assign a value to A (by a non-standard method) but she must also be aware that the predictor is using the classical definition. Therefore, she knows that by choosing A she does not get the bonus. So the total outcome of A is the Pasadena payoff (undefined) and 0 bonus, which is undefined. The outcome of B is $0 plus $1 = $1 (defined).

    Now, if the agent's theory cannot compare an undefined outcome to a defined one, then she must avoid A. This is the safety principle. Even if her theory assigns a value to the undefined outcome, if that assignment is not aligned with the predictor's criterion (which is absolute convergence), then she might still not get the bonus.

    Therefore, the theory must account for the fact that the definedness of the expectation is determined by the classical criterion (absolute convergence) in the predictor's rule. The agent must use the same criterion for definedness as the predictor? Or she must be aware of the predictor's criterion?

    We require that the theory must be able to model the agent's knowledge of the predictor's rule. The agent knows that the predictor uses the classical definition. So she knows that A does not have a classically defined expectation. Therefore, to get the bonus, she must choose an action that has a classically defined expectation.

    Hence, the theory must include a way for the agent to reason about the definedness (by the classical criterion) of her actions. The safety principle (understood as avoiding actions that are not classically defined) would lead to B. And this is the only way to guarantee a defined outcome (and get the bonus).

    Thus, even if the theory assigns a non-classical value to A, it must still recognize that the classical definedness matters for the bonus. Therefore, the agent must choose B to get the bonus.

    This suggests that the safety principle (in the classical sense) is necessary in this reflective setting. Therefore, the theory must incorporate a way to avoid actions that are classically undefined when a defined alternative is available and when there are stakes (like the bonus) that depend on classical definedness.

    However, note that the safety principle might be adopted for the reflective setting even if it is abandoned in non-reflective settings. But that would be inconsistent. Therefore, we require the theory to have a uniform approach.

    We conclude that the safety principle (in the classical sense) is non-negotiable for the reflective setting. Therefore, the theory must include it. This then breaks the continuity condition (as per the known no-go result). Hence, the continuity condition must be abandoned.

  VIII. Relation to Existing Approaches

    - **Truncation Strategies**: These approximate the undefined expectation by truncating the series. They violate the continuity condition because the limit of the truncations (ln(2)) is not the value assigned to the full game (if the safety principle is adopted, then the full game is rejected). But if the safety principle is not adopted, then truncation might assign ln(2) and then the agent would play the single game. However, in the reflective scenario, if the truncation strategy assigns a value but the predictor uses the classical definition, then the agent still doesn't get the bonus.

    - **Risk-Weighted Expectation (e.g., rank-dependent utility)**: These might overweight the negative outcomes and underweight the positive ones (or vice versa) and possibly assign a finite value. But again, the predictor's bonus depends on classical definedness, so even if the risk-weighted expectation is defined, the classical expectation might still be undefined. So the agent would not get the bonus.

    - **Abandonment of Expectation-Maximization**: Some theories might abandon expectation altogether and use a different rule (e.g., minimax). But then the reduction to standard theory when the expectation is defined (desideratum 6) might be violated.

    Given the reflection scenario, we see that the only safe approach is to avoid actions with classically undefined expectations when a classically defined alternative is available. Therefore, we must adopt the safety principle and abandon the continuity condition.

    However, note that in the iterated case, the two independent Pasadena games have a classically defined expectation (because the series becomes absolutely convergent). So the agent would be allowed to play the two games (if the defined expectation is positive) and also get the bonus (if the predictor is active in that scenario). But note: in the reflection scenario we described, the bonus is tied to the definedness of the chosen action. If the agent chooses to play two independent Pasadena games, then the expectation is defined, so she would get the bonus. And the expectation of two games is 2*ln(2) (plus the bonus) which is greater than 1. So she would choose to play the two games and get 2*ln(2) + 1.

    This is consistent.

  IX. Final Desiderata Summary (Non-negotiable marked with *)

    *1. Handle the basic Pasadena game (without undefined expectation).
    *2. Handle iterated independent Pasadena games.
    *3. Handle coupled-payoff variants.
    *4. Handle sequential choice.
    *5. Distinguish between sources of undefinedness (heavy-tailed vs. discontinuous updating).
    *6. Reduce to standard expected utility when expectations are defined.
    *9. Handle the reflection scenario without self-defeat and without undefined meta-expectations.
    7. Safety principle: avoid actions with classically undefined expectation when a classically defined alternative is available. (We now argue this is non-negotiable in light of the reflection scenario.) -> Mark as *7 (non-negotiable).
    8. Continuity condition: abandon (because of the no-go result with *7).

    Additionally, we must add:

    *10. The theory must incorporate a notion of classical definedness (absolute convergence) for the expectation, at least for the purpose of interacting with external predictors (like in the reflection scenario).

    *11. The theory must be uniform: the same decision rule applies in both reflective and non-reflective settings.

    We have now made the safety principle non-negotiable because of the reflection scenario. Therefore, the continuity condition must be abandoned.

    Note: This set of desiderata is very demanding and may rule out many existing approaches. However, the reflection scenario forces the safety principle.

  X. Conclusion

  We have provided a rigorous set of desiderata for a normative decision theory that can handle the Pasadena paradox and its variants, with a focus on the reflection scenario. The reflection scenario has led us to require the safety principle (avoiding classically undefined expectations when a defined alternative is available) and to abandon the continuity condition. The theory must be able to handle the base cases and the reflective case without collapsing.

  We leave open the possibility that a theory might meet these desiderata. One approach might be to use a two-tiered system: first, check for classical definedness; if defined, use standard expected utility; if undefined, then avoid unless there is no defined alternative. In the absence of a defined alternative, the theory might use a fallback (like truncation). But in the reflection scenario, there is a defined alternative (B) so the agent would choose B.

  In the iterated case, the two independent Pasadena games together have a defined expectation, so the agent would play them (if the expectation is positive) and also get the bonus in the reflection scenario.

  This two-tiered system would meet all the non-negotiable desiderata.
answer: |-
  Below is a rigorous specification of desiderata for an adequate normative decision theory aimed at handling rational choice under undefined expectation, with the Pasadena paradox and its variants as central stress-tests. The criteria are organized into **phenomena to explain**, **distinctions to preserve**, **consistency conditions**, and **novel constraints**, with each item including: (i) the desideratum, (ii) its motivation, (iii) classification as non-negotiable or camp-specific, and (iv) notes on satisfiability. Known tensions (e.g., between safety and continuity) and the novel "Pasadena-with-reflection" scenario are addressed systematically.

  ---

  ### **I. Phenomena the Theory Must Explain**
  **Desideratum 1: Resolution of the Base Pasadena Paradox**  
  - **Specification**: The theory must prescribe rational action for a single Pasadena game (payoff \(X_n = (-1)^{n+1} 2^n/n\) with probability \(1/2^n\)) without relying on an undefined expectation.  
  - **Motivation**: The alternating harmonic series \(\sum (-1)^{n+1}/n\) is conditionally convergent (not absolutely convergent), making expectation rearrangement-sensitive and thus undefined. A theory must resolve this without ad hoc truncation.  
  - **Status**: **Non-negotiable**. Core to the problem.  
  - **Satisfiability**: Achievable by approaches rejecting expectation-maximization (e.g., rank-dependent utility) but may conflict with continuity (see Desideratum 8).  

  **Desideratum 2: Handling Iterated Independent Games**  
  - **Specification**: The theory must explain why playing \(k \geq 2\) independent Pasadena games is rationally permissible (as \(\mathbb{E}[X_1 + \dots + X_k]\) is defined and finite), while \(k=1\) is problematic.  
  - **Motivation**: For \(k=2\), the variance of payoffs ensures absolute convergence (\(\sum \text{Var}(X_i) < \infty\)), stabilizing expectations. The theory must not treat iterated cases as isolated single shots.  
  - **Status**: **Non-negotiable**. Tests coherence under additive exposures.  
  - **Satisfiability**: Violated by myopic truncation strategies but satisfied by theories embedding convergence criteria (e.g., absolute integrability requirements).  

  **Desideratum 3: Coupled-Payoff Variants**  
  - **Specification**: The theory must handle games with payoffs coupled across states (e.g., \(Y_n = f(X_n, X_m)\) for \(n \neq m\)) where expectation is undefined despite finite marginal expectations.  
  - **Motivation**: Coupling can reintroduce conditional convergence (e.g., \(Y_n = X_n \cdot X_m\) for independent games). Distinguishes whether undefinedness arises from payoff structure versus interdependence.  
  - **Status**: **Non-negotiable**. Tests robustness beyond independent additivity.  
  - **Satisfiability**: Requires explicit modeling of dependence; risk-weighted expectations may fail here.  

  **Desideratum 4: Sequential Choice under Uncertainty**  
  - **Specification**: The theory must guide choices in sequential settings where earlier actions lead to undefined expectations in future subgames (e.g., accepting a Pasadena game now affects options later).  
  - **Motivation**: Rationality should be dynamically consistent: ex-ante plans should align with ex-post choices even when subgames have undefined expectations.  
  - **Status**: **Non-negotiable**. Essential for real-world relevance.  
  - **Satisfiability**: Conflicts with myopic Bayesian updating if undefinedness propagates; requires non-Markovian policies.  

  ---

  ### **II. Distinctions the Theory Must Preserve**
  **Desideratum 5: Heavy-Tailed vs. Discontinuous Belief-Updating**  
  - **Specification**: The theory must differentiate undefined expectations arising from:  
    - *(Type A)* Heavy-tailed payoff structures (e.g., Pasadena’s divergent moments).  
    - *(Type B)* Discontinuous belief-updating (e.g., Borel-Kolmogorov paradox, where conditioning on measure-zero events causes divergence).  
  - **Motivation**: Type A reflects structural properties of acts; Type B reflects epistemic instability. Conflating them risks misdiagnosing irrationality.  
  - **Status**: **Non-negotiable**. Foundational for targeted interventions.  
  - **Satisfiability**: Type A may require moment-based regularizations; Type B may demand non-Bayesian updating (camp-specific).  

  **Desideratum 6: Single-Shot vs. Sequential Choice**  
  - **Specification**: The theory must explain why rational preferences may differ between:  
    - Accepting one Pasadena game now (undefined expectation).  
    - Accepting a sequence of Pasadena games where later choices depend on early outcomes.  
  - **Motivation**: Sequential settings may "convert" undefined expectations to defined ones via adaptive strategies (e.g., stopping rules). The theory must not reduce sequentiality to compounded single shots.  
  - **Status**: **Non-negotiable**. Highlights the role of information flow.  
  - **Satisfiability**: Violated by static risk-weighted expectations; satisfied by recursive models (e.g., stochastic programming).  

  ---

  ### **III. Consistency Conditions with Standard Decision Theory**
  **Desideratum 7: Reduction to Standard Theory for Defined Cases**  
  - **Specification**: When expectations exist and are finite, the theory must prescribe maximizing expected utility (EU) or a strictly increasing transform thereof (e.g., rank-dependent EU).  
  - **Motivation**: To avoid deviating from axiomatic foundations (e.g., von Neumann-Morgenstern) where they apply.  
  - **Status**: **Non-negotiable**. Mandatory for backward compatibility.  
  - **Satisfiability**: Trivial for defined cases; conflicts arise only for undefined expectations.  

  **Desideratum 8: Continuity Across Approximating Sequences**  
  - **Specification**: If \(\{A_k\}\) is a sequence of acts with defined expectations converging to act \(A\) (e.g., \(A_k\) = Pasadena game truncated at term \(k\)), rational preference over \(A_k\) should converge to preference over \(A\).  
  - **Motivation**: Ensures stability under small perturbations; aligns with topological decision theory.  
  - **Status**: **Camp-specific**. Rejected by safety-first approaches; endorsed by limit-based theories.  
  - **Satisfiability**: Conflicts with Desideratum 9 (below).  

  **Desideratum 9: Safety Principle for Defined Alternatives**  
  - **Specification**: If an act \(A\) has undefined expectation and a "safe" alternative \(B\) (e.g., \(B = \$0\) for sure) has defined expectation, \(B \succ A\).  
  - **Motivation**: Undefined expectations preclude probabilistic dominance; \(B\) offers known welfare.  
  - **Status**: **Camp-specific**. Endorsed by ambiguity-averse theories; rejected by principal-value approaches.  
  - **Satisfiability**: Jointly unsatisfiable with Desideratum 8 given Pasadena (see **Tension Analysis**).  

  ---

  ### **IV. Novel Constraint: Pasadena-with-Reflection**
  **Desideratum 10: Reflective Consistency without Self-Defeat**  
  - **Specification**: In a **Pasadena-with-reflection** scenario:  
    - The agent knows her choice is observed by a predictor.  
    - The predictor awards a bonus \(c > 0\) iff the agent’s chosen act has defined expectation.  
    - Payoffs are coupled: \(U(\text{choose } A) = \text{Payoff}(A) + c \cdot \mathbb{I}_{\{\mathbb{E}[A] \text{ defined}\}}\).  
    The theory must:  
    - Prescribe a choice (e.g., between Pasadena \(A\) and safe \(B = \$0\)) without self-defeat (e.g., picking \(A\) forfeits \(c\)).  
    - Avoid undefined "meta-expectations" (e.g., \(\mathbb{E}[U(A)]\) remains undefined if \(\mathbb{E}[A]\) is undefined).  
  - **Motivation**: Tests self-referential rationality and avoids infinite regress. Real-world analogs include algorithmic fairness audits.  
  - **Status**: **Non-negotiable**. Stress-tests the theory’s epistemic robustness.  
  - **Satisfiability**:  
    - **Safety-compliant theories**: Choose \(B\), securing \(c > 0\) (since \(\mathbb{E}[B]\) defined).  
    - **Continuity-compliant theories**: Risk choosing \(A\) (if \(\lim_{k \to \infty} \mathbb{E}[A_k] > c\)), but lose \(c\) and face undefined \(U(A)\).  
    - **Resolution**: Only safety-compliant theories avoid self-defeat.  

  ---

  ### **V. Tension Analysis: Safety vs. Continuity**
  - **Conflict**: Desiderata 8 (continuity) and 9 (safety) are jointly unsatisfiable for the Pasadena game:  
    - *Continuity*: Truncations \(A_k \to \ln(2) \approx \$0.693\). If \(B = \$0\), continuity demands \(A \succ B\).  
    - *Safety*: \(\mathbb{E}[A]\) undefined, so safety demands \(B \succ A\).  
  - **No-Go Result**: This inconsistency generalizes to any conditionally convergent series (e.g., St. Petersburg variants).  
  - **Resolution Required**: The theory must explicitly abandon one:  
    - *Option 1*: Reject continuity (endorse safety). Aligns with Desideratum 10 (reflection).  
    - *Option 2*: Reject safety (endorse continuity). Fails Desideratum 10 by encouraging self-defeat.  
  - **Recommendation**: Safety is pragmatically superior given reflection scenarios. Continuity may be retained only for sequences where convergence is absolute.  

  ---

  ### **VI. Summary of Desiderata and Trade-offs**
  | **Desideratum**                     | **Key Requirement**                          | **Status**         | **Satisfiability Notes**                                     |
  |-------------------------------------|----------------------------------------------|--------------------|-------------------------------------------------------------|
  | 1. Base Pasadena                    | Resolve single-game undefinedness            | Non-negotiable     | Rejects crude truncation.                                  |
  | 2. Iterated Games                   | Explain \(k=2\) defined, \(k=1\) undefined  | Non-negotiable     | Requires absolute convergence criteria.                   |
  | 3. Coupled Payoffs                  | Handle interdependence                       | Non-negotiable     | Tests additive separability.                               |
  | 4. Sequential Choice                | Dynamic consistency                          | Non-negotiable     | Conflicts with myopic EU.                                  |
  | 5. Heavy-Tailed vs. Discontinuous   | Distinguish sources of undefinedness         | Non-negotiable     | Type A: payoff structure; Type B: epistemic instability.   |
  | 6. Single-Shot vs. Sequential       | Non-reduction of sequentiality               | Non-negotiable     | Rejects "composite act" models.                            |
  | 7. Reduction to Standard Theory     | EU for defined expectations                  | Non-negotiable     | Baseline consistency.                                      |
  | 8. Continuity                       | Preference stability under limits            | Camp-specific      | Unsatisfiable with 9.                                      |
  | 9. Safety Principle                 | Avoid undefined when safe alternative exists | Camp-specific      | Superior in reflection scenarios (10).                     |
  | 10. Reflection Scenario             | No self-defeat or meta-undefinedness         | Non-negotiable     | Forces rejection of continuity (8) if safety (9) adopted. |

  ---

  ### **VII. Accommodating Reflection and Moving Forward**
  - **Reflection-Scenario Compliance**: A theory must prioritize **safety (Desideratum 9)** to handle Pasadena-with-reflection:  
    - Choosing \(B\) (safe) secures \(c > 0\) with defined payoff.  
    - Choosing \(A\) (Pasadena) forfeits \(c\) and yields undefined \(U(A)\), violating rationality.  
    - *No meta-expectations*: The agent evaluates definedness *before* choice, using the predictor’s criterion (absolute convergence).  

  - **Pathways for Existing Approaches**:  
    - **Truncation Strategies**: Fail Desiderata 1 (base case) and 10 (reflection) if used naively.  
    - **Risk-Weighted Expectations** (e.g., rank-dependent utility): May satisfy 1 and 6 but fail 2 (iterated games) and 10 if they ignore definedness.  
    - **Abandoning Expectation-Maximization**: Viable but must still satisfy 7 (reduction) and 10. Safety-compliant variants (e.g., "defined expectation first") are promising.  

  - **Final Requirement**: The theory must **explicitly state its stance on safety versus continuity** and justify it against reflection scenarios. A coherent theory should:  
    - Preserve the safety principle for decisions involving undefined expectations.  
    - Abandon continuity for conditionally convergent sequences.  
    - Extend dynamically to iterated, coupled, and reflective settings without ad hoc per-case rules.  

  This framework ensures that normative decision theory treats undefined expectations not as pathological outliers, but as central to the architecture of rational choice.
