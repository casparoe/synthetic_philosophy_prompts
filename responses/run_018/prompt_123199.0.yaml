prompt: |-
  For my graduate seminar on normative decision theory, I want a rigorous specification of what any adequate theory must deliver if it is to handle rational choice under undefined expectation—taking the Pasadena paradox not as a curiosity but as the central stress-test, together with its iterated and coupled-payoff variants. Write the full desiderata: the phenomena the theory must explain, the distinctions it must preserve (for instance, between undefined expectation arising from heavy-tailed payoff structures versus that arising from discontinuous belief-updating rules, or between single-shot and sequential choice), and the consistency conditions with standard decision theory it must either retain or explicitly abandon. For each desideratum, provide the motivating case or theoretical consideration behind it; flag which are genuinely non-negotiable and which are camp-specific preferences (e.g., commitments to Bayesian updating, causal decision theory, or risk-weighting); and identify any subset of requirements that is jointly unsatisfiable given known no-go results or extensions of the Pasadena structure to iterated choice. In particular, address whether a theory can consistently maintain both that an agent ought never to select an action with undefined expectation when a safe alternative with defined expectation is available, and that rational preference respects a continuity condition across approximating sequences with defined expectations. Then introduce and accommodate a novel constraint: the theory must also cover a hypothetical Pasadena-with-reflection scenario in which the agent knows that her decision rule is being observed by a second-order predictor whose payoff structure is coupled to her choice, without allowing the analysis to collapse into either self-defeating behavior or an appeal to undefined meta-expectations. Keep the weight on the criteria and their interrelations; do not supply a full scorecard of existing approaches, though you may briefly ind