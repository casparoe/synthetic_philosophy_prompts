  ### Teaching Plan: Iterated Elimination via Dominance in Mixed Strategies

  #### **Prerequisite Chain Brainstorm**
  1. **Basic game representation**: Players, actions, payoffs (introduce payoff matrices).
  2. **Pure strategy dominance**: Strategy A dominates B if it yields a higher payoff *against every possible opponent action*.
  3. **Mixed strategies**: Define as probability distributions over pure strategies (emphasize: mathematical tools, not necessarily behavioral).
  4. **Expected payoffs**: Calculate expected utility of a mixed strategy against a pure opponent strategy.
  5. **Dominance by mixtures**: A pure strategy is dominated if a mixed strategy yields higher expected payoff *against every pure opponent play* (not just "on average" over beliefs).
  6. **Iterated elimination**: Sequentially remove dominated strategies (pure or mixed), repeating on the reduced game.

  ---

  ### **Explanatory Arc**  
  **Total Time**: 75 minutes  
  **Goal**: Dispel misconceptions, anchor dominance-by-mixture, and show iteration doesn’t always collapse to one answer.

  #### **1. Foundational Concepts (15 mins)**
  - **Misconception Addressed**: *"Rationality = single obvious answer."*  
  - **Activity**:  
    - Introduce a 2-player normal-form game (e.g., Prisoner’s Dilemma) via a payoff matrix.  
    - Show **pure strategy dominance**: "Confess" dominates "Silent" *unconditionally*.  
    - Contrast with a new game where *no pure strategy dominates another* (transition to mixtures).

  #### **2. Mixed Strategies as Tools (10 mins)**  
  - **Key Idea**: Mixed strategies are probability distributions (not beliefs or random play).  
  - **Activity**:  
    - Define a mixed strategy (e.g., 50% High, 50% Low).  
    - Compute expected payoffs against a *fixed opponent pure strategy* (e.g., "If opponent plays Left, my mixed strategy gives expectation X").  
  - **Emphasis**: "We’re using mixtures to *prove* a pure strategy is bad, not to recommend random play."

  #### **3. Dominance-by-Mixture via Auction Example (20 mins)**  
  - **Example Requirements**: Discrete actions, no calculus, "medium" dominated by high/low mix.  
    - **3-Bidder Auction Setup**:  
      - **Bids**: Low (L), Medium (M), High (H).  
      - **Reserve Price**: $50 (L < reserve ≤ M < H).  
      - **Values/Costs**: Item value = $100; bid costs = L: $0, M: $20, H: $30.  
      - **Payoffs**:  
        - Win: Item value − Bid cost − Bid amount.  
        - Lose: −Bid cost.  
      - **Focal Player’s Payoffs** (simplified for opponents’ symmetry):  
        - *If opponents play uniformly random*: Each bid (L, M, H) with prob. 1/3.  

    - **Payoff Calculations**:  
      - **M (Medium)**: Bid = $60, cost = $20.  
        Wins only if no opponent bids H *and* not all opponents bid L.  
        Expected payoff: **−$2** (calculations below).  
      - **50/50 Mix of L and H**:  
        - L: Bid = $40, cost = $0 → Never wins (bid < reserve) → $0.  
        - H: Bid = $80, cost = $30 → Wins if ≤1 opponent bids H → Expected payoff: **$10**.  
        Mix expected payoff: (0.5 × $0) + (0.5 × $10) = **$5**.  
      - **Result**: $5 (mix) > −$2 (M) → M dominated by mix.  

    - **Crucial Point**:  
      - M isn’t dominated by L or H *alone* (e.g., if opponents all bid L, M wins $100−$20−$60 = $20; H wins $100−$30−$80 = −$10).  
      - But against *every opponent pure strategy profile*, the mix beats M (e.g., demo 2–3 profiles).  

  - **Activity**:  
    - Walk through payoff calculations step-by-step.  
    - Contrast M’s performance vs. mix *in specific opponent profiles* (e.g., both opponents bid M).  

  #### **4. Iterated Elimination (15 mins)**  
  - **Activity**:  
    - Start with a 3×3 matrix (e.g., bidders’ strategies L, M, H).  
    - Eliminate M (dominated by L/H mix).  
    - Show reduced game (L and H only). Ask: *"Is there further dominance?"* (Often, none remains).  
  - **Misconception Addressed**: *"Iteration always leaves one strategy."*  
    - Emphasize: Elimination can stop at multiple strategies (e.g., L and H coexist).  

  #### **5. Addressing Misconceptions (10 mins)**  
  - **Q1**: *"Why not just best-respond with pure strategies?"*  
    - **Response**: Best-response depends on beliefs. Dominance is *belief-free*—a dominated strategy is *never* a best response.  
  - **Q2**: *"Is mixing just averaging my beliefs?"*  
    - **Response**: No! Beliefs are about opponents; mixtures are *your* actions. Dominance-by-mixture shows a pure strategy is inferior *regardless of beliefs*.  
  - **Q3**: *"Doesn’t rationality imply one answer?"*  
    - **Response**: Iteration removes "irrational" options but often leaves multiple rational choices (e.g., L or H in auction).  

  #### **6. Check for Understanding (5 mins)**  
  - **Question**: *"In a new game, pure strategy X yields: (Left: 3, Right: 0). Mixture Y/Z yields: (Left: 4, Right: 1). Is X dominated? Why?"*  
    - **Correct Answer**: Yes. The mixture yields higher payoffs *against every pure strategy of the opponent* (4 > 3 and 1 > 0).  
    - **Pitfall**: Students may think dominance requires X to lose in every *head-to-head* vs. Y or Z (but it’s about the mix).  

  ---

  ### **What to Exclude**  
  - **Epistemic conditions**: Skip common knowledge of rationality (advanced for intro).  
  - **Continuous strategies**: No calculus; discrete actions only.  
  - **Nash equilibrium**: Avoid conflating with dominance (mixing here is tool, not equilibrium play).  
  - **Extended definitions**: e.g., Weak dominance or correlated strategies.  

  ---

  ### **Summary Flow**  
  1. Anchor in pure dominance → show its limits.  
  2. Introduce mixtures as mathematical tools → compute expectations.  
  3. Auction example: M dominated by L/H mix, *not* pure strategies.  
  4. Iterate elimination → show outcome may not be unique.  
  5. Demystify misconceptions via contrast (beliefs vs. actions, single vs. multiple outcomes).  
  6. Verify understanding: Dominance = existence of dominating mixture across *all* opponent actions.  

  **Self-Contained Tools**: Whiteboard for matrices, auction calculations, and iterative diagrams. No external references needed.
