     - Give a small matrix game and ask: "Is there a pure strategy that is strictly dominated by a mixed strategy? If so, find one and show the mixture that dominates it."
     - Example:

          L     R
      T   2,?   0,?
      M   0,?   2,?
      B   1,?   1,?

     For Player 1, B is strictly dominated by (0.5T, 0.5M): 
          vs L: 0.5*2+0.5*0=1 > 1? -> no, it's 1 which is equal to B. So not strict.
     So we need a strict one:

          L     R
      T   3    0
      M   0    3
      B   1    1

     Then (0.5T,0.5M) vs L: 1.5>1, vs R: 1.5>1 -> dominates B.

     - The check: they must compute the expected payoff of the mixture for each column and compare to B.

     **Step 7: What to leave out (explicitly state) (5 minutes)**
     - We are not requiring common knowledge of rationality for the iterated elimination (though it is necessary for full iteration). We are just showing the algorithm.
     - We are not discussing continuous strategy spaces.
     - We are not discussing the epistemic conditions (common belief in rationality) that justify IESDS.
     - We are not going into Nash equilibrium or how mixed strategies are used there.

     **Total time: ~70 minutes, adjust as needed.**

     Note: The example with the matrix is self-contained and doesn't require calculus.
