answer: |-
  Right. Settle in, everyone. Seven minutes on the clock – and not a second more to honour a woman who’d rightly question the intrinsic value of overtime at her own party.

  We gather tonight for Eleanor. Scholar. Mentor. Friend. Lover of muddy walks and quiet galleries. And if that list seems… well, *disparate*… if you’re sitting there neatly dividing her life into ‘work Eleanor’ and ‘home Eleanor’, ‘serious philosopher’ and ‘woman who once spent forty minutes arguing with a docent about the precise shade of blue in a Bonnard’… then I suspect you’ve rather missed the point Eleanor spent her career elucidating. Indeed, you’ve missed the point *of* her career, and perhaps the very essence of the life she’s lived so deliberately before us.

  For Eleanor didn’t just *study* G.E. Moore’s idea that certain things possess intrinsic value – that their goodness isn’t borrowed, isn’t a means to some other end, like happiness or status or a bigger office. No. She *championed* it. And crucially, she championed Moore’s profound, slightly daunting, notion of the *organic unity*. The idea that the value of a complex whole – a genuine friendship, the deep appreciation of a beautiful object – isn’t just the sum of its pleasant parts. It’s something more. Something irreducible. It exists *in the whole itself*, a distinct, non-natural property shimmering there, indefinable yet knowable.

  *(A nod to the academics)* Yes, indefinable, yet knowable. That was always the rub, wasn't it? Trying to pin down that luminous 'goodness in itself' without reducing it to pleasant feelings or useful outcomes. Eleanor wrestled with that on the page with formidable rigour.

  But here’s the thing, and this is where the family might lean in: Eleanor didn’t just wrestle with it *on the page*. She lived it. She *embodied* the refusal of reduction.

  Think of those promotions she turned down. Oh, the practical minds amongst us – perhaps even some philosophers on a pragmatic day! – might murmur: “But think of the extra pension! The influence! The *status*!” And Eleanor’s quiet, determined refusal? It wasn’t born of laziness, nor some grand ascetic sacrifice where she suffered nobly for her principles. Absolutely not. It was a profound affirmation. An affirmation that those Wednesday rambles with Sarah and Michael, come rain or shine, boots caked in mud, conversation meandering like the path itself… that *this* complex, organic whole – the shared history, the effortless ease, the simple *being-together* in the landscape – possessed an intrinsic value utterly irreducible to the sum of the pleasures *in* the walk, or any achievement it might foster. Its value was *in the thing itself*. It was an end. Non-negotiable.

  Similarly, her Sundays at the museum. Not a self-improvement exercise. Not networking disguised as culture. Not even purely ‘relaxation’ in the transactional sense. It was standing before a particular Turner seascape, year after year, letting its turbulent beauty *be*. Appreciating it. Engaging with it as an organic unity – the brushstrokes, the light, the emotional resonance – creating a value that couldn’t be broken down into constituent pleasures or lessons learned. Its goodness was inherent, a reason in itself for being there. An end.

  And this, colleagues, is where her professional contribution wasn't merely *informed* by Moore, nor was it merely *illustrated* by her life. Her life *was* the demonstration. Her rigorous defence of intrinsic value and organic unities wasn't a clever argument deployed to win tenure or impress journals – though it did those things too. No. It was the intellectual scaffolding for a way of *being* that refused to let the world reduce the precious things to mere instruments. She fought for the philosophical space where friendship and beauty could stand as ultimate reasons for action, precisely because she lived in that space.

  So often, we measure a life – especially an academic life – by outputs: papers published, students supervised, committees chaired. Worthy things, certainly. Or we retreat into sentiment: “She was a lovely friend,” “She enjoyed her paintings.” Also true, but… partial. Reductionist, even.

  Eleanor’s life, in its quiet, stubborn consistency, offers a different metric. It challenges both the careerist and the sentimentalist. To her fellow theorists, she showed that defending intrinsic value isn’t an abstract parlour game; it’s the foundation for a coherent, deeply human life lived with integrity. To her family and friends, she demonstrated, without ever needing to lecture over the sherry, that those long walks and museum visits weren't just hobbies or indulgences; they were commitments to things held as fundamentally, irreducibly *good* in themselves.

  Her life *is* the organic unity. The complex whole – the sharp intellect, the deep loyalty, the aesthetic passion – creates a value greater than the sum of her achievements *or* her private joys. It shines in the integrated whole. It resists reduction.

  So, we raise our glasses not merely to Professor Eleanor’s distinguished career, nor simply to Eleanor our dear friend and family member. We raise them to Eleanor – a walking, talking, philosophy-arguing, hill-walking, art-absorbing testament to the idea that some things are just… *good*. In and of themselves. Beyond calculation. Beyond utility. Whole, irreducible, and luminous.

  To Eleanor. An organic unity we’ve been profoundly privileged to know.

  Cheers.
