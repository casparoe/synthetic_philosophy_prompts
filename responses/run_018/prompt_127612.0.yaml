answer: |-
  This is a profound and under-discussed challenge for expressivism, striking at the heart of its ability to model reasoning for temporally extended agents. Let's break it down:

  1.  **The Core Difficulty:** You've pinpointed the issue accurately. Standard expressivist solutions (like Gibbard's planning semantics) rely on the *simultaneous* coherence of the complex conative attitude expressed by a compound sentence within a *single, temporally unified* agent's psychology. The "inferential link" is forged by the agent *currently* holding (or being committed to) the attitudes expressed by the component parts *in a way that makes the compound attitude consistent or inconsistent*. The temporal gap between the *actual past acceptance* of N and the *present evaluation* of the conditional threatens to sever this link because:
      *   The agent in 2025 may no longer accept N. The *past* acceptance of N isn't necessarily an attitude *currently* held by the agent. It's a historical fact about them.
      *   Therefore, the attitude supposedly expressed by the antecedent ("N was the correct norm to accept in 2018") isn't necessarily a *current* conative state of the agent evaluating the conditional. It seems to be a *description* of a past state.

  2.  **Does Gibbard's Framework Handle This?**
      Gibbard's norm-expressivism, centered on *planning*, offers resources but likely requires careful interpretation:
      *   **Planning Over Time:** Gibbard explicitly frames planning as something we do *for our lives as temporally extended beings*. When I plan, I plan *now* for what to do *later*, and crucially, I also form plans *about what to have planned or felt*. My current plan-laden state carries commitments about my past and future stances.
      *   **Evaluating Past Norms:** For the agent in 2025 evaluating "If N was the correct norm to accept in 2018...", Gibbard would likely interpret this *not* as merely reporting a past psychological fact, but as expressing a *current, plan-laden attitude* **towards that past acceptance**.
          *   Specifically, asserting the antecedent "N was the correct norm to accept in 2018" expresses the agent's *current endorsement* of having accepted N in 2018. It's part of their *current* overall plan that N *was* the norm to accept back then. They are *now* planning for their past self to have accepted N.
      *   **The Conditional as a Current Plan:** The entire conditional "If N was correct in 2018, then A is obligatory now" expresses the agent's *current* contingency plan: *Given that* I now plan for my 2018 self to have accepted N, *then* I now plan to do A (or plan to plan to do A, etc.). The inferential link is maintained *within the agent's current, temporally extended planning state*.
      *   **Unified Normative Subject:** Crucially, Gibbard's framework *does* implicitly treat the agent as a unified normative subject over time **through the lens of current planning**. The agent *now* takes responsibility for their past and future selves *as parts of their ongoing life*. The "unification" isn't grounded in metaphysical personal identity first; it's grounded in the *scope* of the agent's *current* planning activity, which inherently encompasses past and future.

  3.  **Is the Problem Genuine or Merely Apparent?**
      It's a **genuine challenge** that pushes expressivism to its limits, but it might be **resolvable within a sophisticated expressivist framework like Gibbard's** without needing an *independent* theory of personal identity.
      *   **Possible Resolution (Gibbardian):** The difficulty arises if we interpret the antecedent descriptively. But Gibbard insists normative language *always* expresses a planning state. So "N was correct in 2018" expresses the agent's *current* plan-laden attitude towards that past situation. The "past normative commitment" is embedded *as an object of current normative endorsement or rejection*. The inferential link is preserved because *both the antecedent and the consequent express aspects of the agent's current, complex planning state about their temporally extended life*.
      *   **The Role of Change & Contrition:** What if the agent *rejects* their past acceptance of N in 2025? Then asserting "If N was correct in 2018..." expresses a *hypothetical* planning stance: "If I were to endorse my past acceptance of N (which I currently don't), then I'd be committed to A now." This is still a coherent complex attitude *currently* held, expressing a kind of normative consistency conditional on a hypothetical endorsement. It might involve acknowledging past error ("contrition" in Gibbard's terms) while mapping out the *logical* implications of a stance they now reject.

  4.  **Is it a New Variant or a Separate Challenge?**
      This is best understood as a **distinct diachronic variant of the original Frege-Geach embedding problem**.
      *   **Core Embedding Difficulty:** Frege-Geach is fundamentally about how normative/expressive content embeds in logical contexts (conditionals, negation, disjunction) *without* becoming descriptive. The diachronic case is another, particularly tricky, embedding context: embedding an expression of a *past* commitment within a *present* conditional.
      *   **Persistence Challenge:** While *related* to the persistence of non-cognitive attitudes (can an attitude expressed years ago genuinely constrain my current reasoning?), the core issue isn't primarily about the *metaphysics* of attitude persistence over time. It's about the *semantics* and *logic*: how can an expressivist account for the meaning and inferential role of sentences *that refer to or embed expressions of past stances*? The expressivist solution focuses on what *current* complex state is expressed by such a sentence. The "persistence" relevant here is the *current endorsement or hypothetical consideration* of the past stance *within the agent's present planning framework*.

  5.  **Does it Require an Independent Theory of Personal Identity?**
      *   **Not Necessarily as a Foundation:** Gibbard's framework suggests that the *normative* unity of the agent over time is constituted *by* the scope of their current planning activity. The problem is solved by interpreting diachronic normative claims as expressions of *current* plan-laden attitudes *about* one's temporally extended life. An independent metaphysical theory of personal identity isn't *required* to ground this normative unity; the planning activity itself defines the relevant normative subject.
      *   **But Potential Interaction:** However, *if* an agent radically disavows their past self (e.g., due to profound transformation, brain injury, etc.), questions about whether they *are* the same normative subject *do* arise. In such extreme cases, an expressivist *might* need to appeal to (or their account might presuppose) some minimal notion of psychological continuity or agency for the planning framework to apply coherently across time. Gibbard likely assumes a standard, moderately continuous agent. For such agents, the planning framework provides sufficient unity.

  **Conclusion:**

  The cross-temporal embedding challenge is a serious and genuine test for expressivism, highlighting the complexities of applying a solution designed for synchronic reasoning to diachronic agents. However, within Gibbard's sophisticated planning semantics, the problem appears **resolvable without needing an independent theory of personal identity**. The key move is interpreting claims about past normative correctness *not* as descriptions of historical psychological facts, but as expressions of the agent's *current* plan-laden attitude *towards* that past situation. The entire conditional expresses a complex *current* contingency plan concerning the agent's temporally extended life. This maintains the inferential link *within the agent's present psychology*. While it is a distinct *diachronic variant* of the Frege-Geach problem, rooted in the embedding of expressions referencing past stances, it leverages the core expressivist strategy of identifying the complex non-cognitive attitude expressed by the compound sentence. The challenge underscores that expressivism requires agents to conceive of themselves as temporally extended planning entities for normative consistency to hold across time.
