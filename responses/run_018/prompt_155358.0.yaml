answer: |-
  Here's the structural breakdown:

  1.  **Diagnosis:** Primarily **substantive**, but with strong elements of **different_questions**. The core disagreement isn't about facts (aggregation, suffering) but about fundamental ethical concepts (expression, complicity, duty). Crucially, the sides are often operating with distinct primary objectives: one camp prioritizes *harm minimization through strategic action within the system* (collective causation/proximate consequences), while the other prioritizes *personal moral integrity and non-complicity with perceived injustice* (citizen virtue/agent-centered duties). They're answering different core questions ("How do I reduce harm?" vs. "How do I stay clean?").

  2.  **Hidden Driver:** The **clashing models of moral complicity in systemic action**.
      *   **Strategic Side:** Implicitly adopts a *consequentialist* or *contributory* model of complicity. Your complicity is proportional to your causal contribution to the *net harm* (or net harm reduction). Voting for Lesser Evil (LE) reduces net harm compared to alternatives (voting for Worse Evil (WE), abstaining leading to WE). Therefore, you are *less* complicit in overall harm by voting LE.
      *   **Reflective Endorsement Side:** Implicitly adopts an *associative* or *symbolic* model of complicity. Participation in the act (voting for *any* Evil) constitutes endorsement of the *system and its choices*, making you symbolically complicit in *all harm caused by the chosen candidate/system*, regardless of your intent or the counterfactual. The act itself taints you.

  3.  **Progress Condition:** Breaking the deadlock likely requires:
      *   **Explicitly Separating the Projects:** Acknowledge the debate conflates "How to best reduce harm via voting?" (collective causation) and "How to maintain personal moral purity via voting?" (citizen virtue). These might be incompatible goods.
      *   **Rigorous Analysis of Complicity Models:** A formal framework comparing contributory vs. associative complicity within democratic systems. How does the symbolic weight of voting interact with its causal power? Can we quantify/compare the "taint" vs. the harm reduction?
      *   **Clarifying "Expression":** Distinguish:
          *   *Expression-as-Causal-Preference-Revealing:* Voting LE reveals your preference ordering (LE > WE > Abstain?).
          *   *Expression-as-Symbolic-Endorsement:* Voting LE endorses LE *as a legitimate choice* within the system.
      *   **Engaging the System's Brokenness:** Does the *degree* or *type* of brokenness shift the balance? Is complicity higher in a moderately flawed system vs. a fundamentally illegitimate one?

  4.  **Expectation of Resolution:** **Low.** The disagreement stems from deep, likely irreconcilable, foundational ethical commitments (consequentialism vs. deontology/virtue ethics) and intuitions about symbolic action within power structures. Formal models might clarify trade-offs but won't resolve the core value clash. Progress is more likely in *mapping* the disagreement clearly and identifying *where* the value differences lie than in achieving consensus.

