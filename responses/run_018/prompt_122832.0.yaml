prompt: |-
  hey — I'm writing something on hedonism and I keep going in circles on the heterogeneity problem: what do all the pleasures have in common? the cold beer, the proof finally working out, the warm bath, sex, a dumb joke, the moment a headache stops. Before I go back to the actual theories I want the spec written down. What would a theory of what pleasures share have to do to count as adequate?

  Purpose, since I guess adequacy is relative to it — I want it for two things, and I suspect they pull apart. (a) I want pleasure to carry weight as the currency of welfare, so whatever it turns out to be has to be the sort of thing that can be aggregated across a life and compared, at least roughly, between people. (b) I also want it usable by someone who isn't the subject: I'm messing about with an evaluation protocol for a care home, most of the residents have advanced dementia, self-report is basically worthless, so the theory has to say what a third party should be looking at. Tell me if (b) is an illegitimate demand — but then tell me why.

  So: the requirements list. For each one, the case or consideration behind it, and mark it non-negotiable vs. a preference of one camp. Flag any pair you think can't be jointly satisfied — that's the bit I most want, because if the list itself is impossible that's a result. Then say which single requirement does the most work in excluding candidates. A short scorecard at the end is fine — few lines each, no more — for four options: the felt-quality / hedonic-tone view; the desire-or-attitude view (you enjoy something iff you're drawn to continuing it, take a pro-attitude to it, whatever the best version of that is); the adverbial-ish view where pleasure is a way of undergoing an experience rather than a bit of one; and the cluster / family-resemblance / straight-up disjunctive view. Add any contender I've left off.

  Some things I want you to take a position on, not just list: is the demand that there be ONE feature shared by every pleasure itself a camp prejudice? What would a cluster or disjunctive account have to deliver to count as an answer rather than as giving up? Does the theory owe us an explanation of why pleasure is good, or is that a separate question we shouldn't load onto it? And does it owe us a unit — a hedonic degree that makes aggregation and interpersonal comparison non-arbitrary — or can it punt on measurment and still be adequate?

  Distinctions it shouldn't collapse: feeling pleasant vs. enjoying vs. taking pleasure in something; intensity vs. duration vs. how much it contributes to a life; whether the property belongs to experiences or to a person at a time; and being a pleasure vs. being good for you.

  Cases it has to handle — some of these I'm making up, so tell me which ones aren't doing any real work:
  - the afternoon absorbed fixing a bike: you'd say you enjoyed it, but no moment of it felt pleasant in any distinctive way, and you only notice afterwards
  - scratching a sunburn: the same patch of skin, at the same time, feels good and bad, and it gets worse the more you do it
  - the third slice of cake, which you keep eating after you stopped enjoying it (and the neuroscience-flavoured stuff about wanting and liking coming apart — grant it for the sake of argument if you don't trust it)
  - the long pleasures: writing a book, a friendship, "I enjoyed my twenties". Where in the stream of experience is that pleasure located?
  - the pleasure of a headache stopping, and the "pleasure" of never having had one. Is the absence of pain itself a pleasure, and what does the answer cost you?
  - a diffuse good mood, with no object and nothing in particular you're noticing
  - the disowned pleasures: the giggle at someone elses misfortune, the joke you laugh at and then hate yourself for. Pleasures, clearly; welfare value, questionable
  - the inverted case: someone whose pleasant experiences feel to them the way a persistent itch feels to you, but who pursues them and is averse to what you'd call pain. What decides whether they're feeling pleasure — the quality or the motivation? I think this case is doing real work but I'm not sure against whom
  - the resident who smiles at music, can't report anything, and has no memory of it thirty seconds later. Is the smile evidence of pleasure, and under which theory?

  no citations or reading lists please, I've got those and I'm nowhere near a library. just the spec.
reasoning: |-
  Okay, let me start by really unpacking what the user is asking for. They're working on hedonism and stuck on the heterogeneity problem—what do all pleasures have in common? They need a spec for what makes a theory adequate. Their main purposes are (a) pleasure as the currency of welfare, which requires aggregation and comparison, and (b) a third-party observable measure for dementia patients in a care home.

  First, I need to outline the requirements. The user mentioned two main goals. For (a), the theory must allow aggregation across a life and rough interpersonal comparison. That means whatever defines pleasure needs to be quantifiable in some way. For (b), it must be observable by someone else, especially when self-report isn't an option. The user wonders if (b) is illegitimate, but I think it's valid because care homes need practical assessment tools. However, these two might conflict; internal states are hard to observe externally.

  The user listed several cases to handle. Let me go through them to see which are crucial. The afternoon fixing a bike with no distinct pleasant moments challenges felt-quality theories. Scratching a sunburn involves mixed feelings, testing whether pleasure and pain can coexist. The third slice of cake where wanting and liking come apart is important for desire theories. Long pleasures like writing a book question temporal location. The headache stopping versus never having one touches on absence of pain as pleasure. Diffuse moods without an object challenge object-based views. Disowned pleasures like schadenfreude test if pleasure's moral aspect affects its definition. The inverted case where pleasant feels like itch but is pursued—this tests the core definition: is it the feeling or the motivation? Finally, the dementia patient smiling at music tests observability without memory or report.

  Now, the user wants to know if demanding one shared feature is a bias. Some theories, like cluster views, reject this. A disjunctive theory needs to show how varied instances still form a coherent concept without being ad hoc. Also, does the theory need to explain why pleasure is good? Probably not; that's a separate value question. But it must define pleasure without presupposing its goodness. The unit problem: for aggregation, a measurable unit is necessary, but maybe theories can describe the unit without solving measurement.

  Key distinctions to maintain: feeling pleasant vs. enjoying vs. taking pleasure; intensity vs. duration vs. contribution; whether it's experiential or personal; pleasure vs. welfare good. Collapsing these could confuse the theory.

  Now, assessing the four theories. Felt-quality: simple but struggles with cases like the bike afternoon or diffuse moods. Desire theories handle those but fail with the third slice of cake and wanting/liking dissociation. Also, observability is weak. Adverbial theories might handle the bike case by focusing on how experiences are undergone, but observability is tricky. Cluster views accept heterogeneity but risk being disunified, making aggregation hard. They might work for observability by using multiple indicators.

  The biggest conflict is between aggregation (needing a single metric) and heterogeneity (which resists reduction). Also, observability vs. internal states. For dementia care, observable behaviors are key, but internal states matter for welfare currency. The inverted case is crucial against felt-quality, showing motivation might be more central.

  The most excluding requirement is probably the unit for aggregation, as it demands a measurable common feature, which many theories can't provide. Cluster views might manage observability but fail at providing a unit.

  So, the user's real struggle might be that (a) and (b) pull apart: a theory good for welfare currency might not be observable, and vice versa. They might need to choose which purpose is primary or accept a hybrid approach. Highlighting this tension is key.
answer: |-
  Here’s a stripped-down spec for a theory of pleasure, designed to meet your dual aims (welfare currency + third-party observability) while flagging tensions. Requirements are ranked by non-negotiability for your purposes.

  ### Core Requirements (Non-Negotiables)
  1. **Unity for Aggregation**: Must identify a *quantifiable property* shared by all pleasures (intensity/duration/“strength”), enabling rough intra- and interpersonal comparison. *(Essential for welfare currency; collapses without it.)*  
  2. **Third-Party Accessibility**: Must be detectable through objective indicators (behavior, physiology, context) *without relying on subjective reports*. *(Essential for dementia care application.)*  
  3. **Realism**: Must accommodate empirical cases where motivation, feeling, and evaluation dissociate (e.g., cake excess, sunburn scratching). *(Avoids falsification by common counterexamples.)*  

  ### Secondary Preferences (Tensions Noted)
  4. **Temporal Flexibility**: Should handle extended/diffuse pleasures (e.g., "enjoying my twenties") without requiring constant conscious feeling. *(But risks diluting unity.)*  
  5. **Explanatory Neutrality**: Should *not* build in moral goodness (to distinguish pleasure from welfare value, e.g., disowned pleasures).  
  6. **Absence Handling**: Must clarify if pain cessation or non-occurrence counts as pleasure (affects aggregation scope).  

  ### Tensions & Dealbreakers
  - **Major Conflict**: **Aggregation (1) vs. Observability (2)**. A single quantifiable property (1) is often introspective (e.g., felt quality), while observable indicators (2) are diverse (smiles, approach behaviors) and may not co-vary neatly. *This is the core tension between (a) and (b).*  
  - **Exclusion Power**: **Requirement #1 (Unity for Aggregation)** does the heaviest lifting. It immediately disqualifies theories that cannot provide a single scalable metric.  

  ### Is "One Shared Feature" a Prejudice?
  - **Yes, but unavoidable for your aims**. Cluster/disjunctive views sacrifice aggregation (1), making them inadequate for welfare-as-currency. A cluster theory *could* work only if it offers a *practical rubric* for scoring welfare (e.g., "if ≥3/5 indicators present, count as pleasure"), but this feels ad hoc and risks arbitrariness in comparison.  

  ### What Theory Owes
  - **Not owed**: Explanation of *why* pleasure is good (this is normative; theory should be descriptive).  
  - **Owed**: A *conceptual unit* (e.g., "hedonic valence × duration"), even if exact measurement is hard. Without this, aggregation (1) fails.  

  ### Theory Scorecard
  | **Theory**               | **Aggregation (1)** | **Observability (2)** | **Realism (3)** | **Verdict** |  
  |--------------------------|---------------------|------------------------|-----------------|-------------|  
  | **Felt-Quality**         | Poor (heterogeneous feelings) | Poor (private)       | Poor (fails bike afternoon, diffuse moods) | Fails (1,2,3) |  
  | **Desire/Attitude**      | Medium (strength of desire) | Medium (approach/avoid) | Poor (fails cake excess, sunburn) | Fails (3) |  
  | **Adverbial**            | Medium (degree of "savoring") | Poor (still internal) | Good (handles bike, moods) | Fails (2) |  
  | **Cluster**              | Poor (no common unit) | **Good** (multiple indicators) | Excellent (handles all cases) | Fails (1) |  
  | **Contender: Motivation-Salience** | Medium (behavioral persistence) | **Good** (observable effort) | Good (handles dissociation) | **Best on (2,3), weak on (1)** |  

  ### Additional Contender
  - **Motivation-Salience Theory**: Pleasure = stimuli that capture attention and drive motivated behavior. *Pros*: Handles dissociation (sunburn, cake), observable (facial feedback, engagement), works for dementia (smiles as attentional capture). *Cons*: Unclear unit for aggregation; may exclude quiet satisfactions (bike afternoon).  

  ### Case Handling Key
  - **Doing real work**: Bike afternoon (vs. felt-quality), cake/sunburn (vs. desire), dementia smile (tests observability), inverted case (tests felt-quality vs. motivation).  
  - **Less critical**: Headache cessation vs. prevention (tests boundaries, not core mechanics).  

  ### Final Take
  - **Your demands aren’t impossible but are brutal**: Requirement (1) forces reductionism; (2) forces externalism. **Motivation-Salience** comes closest by tying pleasure to goal-directed engagement (observable) and treating intensity as effort/metrics of pursuit. But aggregation remains its Achilles’ heel. If (a) is primary, you sacrifice (b); if (b) is primary, you sacrifice rigorous interpersonal comparison. The inverted case suggests motivation might be more fundamental than feel—but that’s a bet, not a solution.  

  *Recommendation: If welfare currency is non-negotiable, bite the bullet and accept a lean desire-based view (with "attitude" broadened to include implicit motivation). For the care home, use a motivation-salience proxy (engagement metrics) and admit it’s a different operationalization.*
