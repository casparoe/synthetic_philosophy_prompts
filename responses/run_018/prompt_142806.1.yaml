    1. **Luminosity Rule:** If a value-holder genuinely feels they are at exactly X (meaning they are confident they can identify their state as X), they must declare: "I know I am at exactly X".
    2. **KK Rule:** After any such declaration, the auditor must ask: "Do you know that you know that you are at exactly X?" The value-holder must answer either "Yes, I know that I know I am at exactly X" or "No, I do not know that I know I am at exactly X" without any hedging or qualification.
    3. **Shift Rule:** Between rounds, the facilitator silently adjusts some students' values by a small increment (say, 1 unit) that is below the threshold of phenomenal difference. The shifts are done in such a way that over three rounds, a student might be shifted multiple times, but the total shift in one round is never enough to be noticeable. The facilitator must ensure that the shifts are applied to some students and not others, and that the pattern of shifts will create the conditions for contradiction.

