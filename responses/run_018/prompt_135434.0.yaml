answer: |-
  ## Proposal: Indirect Normativity and the Normative Architecture of Modular Deliberation

  **Research Question:** Does the concept of *indirect normativity* retain distinct normative significance when idealized deliberation is modeled as involving normatively mandated compartmentalization between distinct reasoning subsystems, or does it collapse into a form of direct normativity operating on these modules?

  **Core Problem:** Standard accounts of indirect normativity (e.g., two-level consequentialism, rule worship concerns, commitment strategies) presuppose a unified deliberative agent. Norms are "indirect" because a single agent is prohibited from directly consulting the foundational norm (e.g., maximizing utility) in specific contexts, instead following a subsidiary rule (e.g., a deontological constraint). The justification hinges on the agent's cognitive limitations or the practical necessity of rule-following *for that single agent*. This project challenges that presupposition by investigating a model where idealized deliberation is *intrinsically modular*. Different reasoning subsystems ("modules") receive distinct inputs, operate on specific representations, and are governed by different, potentially incommensurable, normative principles. Crucially, the "firewalls" preventing direct information flow or deliberation-sharing between modules are not contingent psychological limitations but part of the *normative ideal itself*. The central question is whether, under this modular architecture, the distinction between directly normative principles (applied by a module to its own inputs) and indirectly normative principles (governing which module should be active or the relations between them) remains robust, or whether indirect normativity dissolves into direct normativity applied locally within modules plus meta-norms governing module interaction.

  **Gap in Existing Literature:** While debates on agent-splitting (e.g., temporal stages, multiple selves) and fragmented agency exist, they typically treat compartmentalization as a descriptive feature to be overcome or managed normatively, or as a strategic response to irrationality. The proposed model differs fundamentally: it posits compartmentalization as a *normative requirement* inherent in ideal deliberation for certain types of agents or values. Existing frameworks struggle to address whether the *indirectness* of a norm (like a rule in two-level consequentialism) depends entirely on the unified agent context. If ideal deliberation *requires* separate modules, does the "indirect" rule simply become a *direct* principle governing one module? This question remains unexplored, as the literature lacks a model where compartmentalization itself is normatively mandated rather than descriptively observed or strategically adopted.

  **Methodology:**
  1.  **Conceptual Modeling:** Construct a formalized model of modular deliberative agency.
      *   Define core modules (e.g., `Planner`: long-term goals, commitments; `Executor`: immediate action-selection; `Evaluator`: real-time feedback/situation assessment).
      *   Specify normative principles governing each module *directly* (e.g., `Planner` directly governed by maximizing consequentialism; `Executor` directly governed by deontic rules or habits).
      *   Introduce "firewall norms": Norms *prohibiting or restricting* information flow or deliberation-sharing between modules (e.g., `Executor` *must not* access `Planner`'s consequentialist calculus during action execution; `Planner` *cannot* micromanage `Executor`'s rule application).
      *   Introduce "interface norms": Norms governing *which* module should be activated under specific inputs/contexts and how conflicts between module outputs are resolved (e.g., meta-principles triggering module switching or arbitration).
  2.  **Analyze Indirectness:** Examine the status of norms within this model:
      *   Is the rule followed by the `Executor` meaningfully "indirectly normative" (justified by the `Planner`'s consequentialism) if the firewall norm *prevents* the `Executor` from ever accessing or being influenced by that justification? Or is it now *directly* normative *for the Executor module*?
      *   Do the "firewall norms" and "interface norms" constitute a *new kind* of indirect normativity, governing not *what* to do, but *how* to structure deliberation itself? Or are they simply higher-order *direct* norms?
  3.  **Toxin Puzzle Test Case:** Reframe Kavka's Toxin Puzzle.
      *   **Standard:** A unified agent cannot rationally form the intention to drink the toxin (required to win the prize) because they know they won't drink it later when the reason to drink (getting the prize) is gone.
      *   **Modular Reframing:** The `Planner` module recognizes the benefit of winning the prize and forms the intention to drink. The `Executor` module, governed by direct norms excluding future consequences beyond immediate intention-commitment, is triggered when the time comes. However, a strict firewall prevents `Executor` from accessing `Planner`'s consequentialist justification. Does the `Executor` now have *direct normative reason* (based on its module-specific principles) to execute the intention formed by `Planner`, even though `Planner` knows `Executor` will face no reason to drink later? Does the normative puzzle dissolve, transform, or persist as a conflict governed by interface norms? Does this resolve the paradox normatively by compartmentalizing the conflicting demands?
  4.  **Collapse/Redundancy Check:** Systematically compare the modular model's outputs and normative structure to the standard two-level consequentialist model. Can all normative work supposedly done by indirect rules be replicated by direct norms on modules plus meta-norms? Or does the modular model reveal a distinct normative role for compartmentalization that cannot be captured by direct deliberation, even ideally?
  5.  **Residue Analysis:** If a distinction persists, characterize it: Does it reflect a fundamental normative structure (e.g., incommensurable values best served by isolation), or merely a descriptive fact about preference fragmentation that normative theory should ideally overcome, not mandate?

  **Scope and Feasibility (6000 words, one semester):** The scope is ambitious but feasible for a focused seminar paper. The core work involves:
  1.  Constructing the modular model (1500-2000 words).
  2.  Applying it to the Toxin Puzzle reframing (1000-1500 words).
  3.  Conducting the collapse/redundancy analysis against two-level consequentialism (1500-2000 words).
  4.  Evaluating the residue and implications (1000-1500 words).
  The conceptual nature makes deep empirical engagement unnecessary. Success hinges on precise model construction and rigorous normative comparison.

  **Clear Failure Condition:** The project demonstrably fails if the modular model is shown to be *fully reducible* to standard models of agency plus strategic self-management or descriptive fragmentation, offering no *novel normative insight* or failing to preserve a distinct role for indirect normativity beyond localized direct norms plus coordination rules. Success lies in showing either that the modular architecture necessitates a new understanding of normative structure (where compartmentalization is normative, not just descriptive/strategic), or that it dissolves the indirect/direct distinction in a way that clarifies its dependence on agent-unity, thereby reframing the debate.
