  - Consequentialist: Keep statue (avoid removal costs and social strife; add educational plaque). Rename street (low cost, high benefit in reducing harm by reassigning reference to the role).
  - Deontologist: Remove statue (its fixed bodily form forces honor on a potentially evil person, violating the duty to not honor evil; it cannot be corrected without destruction). Retain street name (changing it would break historical continuity and the duty to preserve transmitted history; its linguistic nature allows reinterpretation without physical alteration).

  Key feature: Epistemic inaccessibility combined with the differential correctability (material vs. linguistic) of the commemorative media.

  Removal test: If records were intact and showed both honored the person, standard alignment would likely return: consequentialist might remove both if net welfare gains (though costs matter), deontologist would remove both to avoid honoring evil. But if records showed the role, both theories would preserve both.

  Defender attack (deontologist): The duty to preserve historical artifacts should prevail in ambiguity; we cannot assume Thornton was evil without proof. Removing the statue destroys an irreplaceable witness to the past. Weakest point: The statue's specificity forces a personal honor, and if evidence of Thornton's evils is substantial, the duty to avoid complicity might require removal even with ambiguity.

  Defender attack (consequentialist): The benefits of statue removal (e.g., racial healing, attracting new residents) might outweigh costs, and the ambiguity might not reduce harm enough. Weakest point: The ambiguity might make the harm less certain, and the costs of removal (both financial and social) are substantial and immediate.
answer: |-
  ### Scenario
  In the city of Elmsworth, the Heritage Committee convenes to resolve a dispute over a bronze statue of "Founder Elias Thorne" erected in 1890 and the adjacent "Thorne Street," both commissioned by the same civic group. All dedicatory records (council minutes, donor ledgers, and inaugural speeches) were destroyed in a 1925 courthouse fire, rendering it epistemically impossible to determine whether the commemorations honor Elias Thorne the individual (a railroad magnate implicated in indigenous land dispossession and exploitative labor practices) or an abstract "Founder" role representing municipal establishment and infrastructure progress—a role Thorne occupied but may not ontologically define. The statue, cast in bronze, fixes Thorne’s likeness and posture in unmodifiable physical form, demanding destruction for reinterpretation. Conversely, the street name is a mutable linguistic label: its reference can be administratively corrected (e.g., reassigning "Thorne" to the founding role) without altering the street’s material history. The committee must decide between two proposals: **A)** Remove the statue but retain and reinterpret the street name, or **B)** Preserve the statue but rename the street.

  ### Reasoning by Ethical Framework
  **Consequentialist Verdict (Maximize Present Social Welfare):**  
  - *Preserve the statue*: Removal would trigger protracted legal battles with heritage groups, cost $500,000 in public funds, and inflame cultural divisions, outweighing potential benefits. Preservation allows low-cost mitigation (e.g., an interpretive plaque contextualizing Thorne’s contested legacy as either individual or role), fostering education without material loss.  
  - *Rename the street*: Administrative correction (e.g., rebranding "Thorne Street" as "Founders Street" to honor the role) costs under $20,000, immediately alleviating community distress over the name’s association with injustice. The linguistic medium enables precise, harm-reducing reinterpretation, yielding net welfare gains.  

  **Deontological Verdict (Uphold Duty to Historical Fidelity):**  
  - *Remove the statue*: Its physical form irrevocably binds commemoration to Thorne’s bodily identity, implicitly valorizing his personal actions. Retaining it violates the duty to avoid honoring moral transgressors when evidence of wrongdoing exists, as ambiguity does not negate the risk of perpetuating false honor. Destruction is obligatory to prevent ongoing misrepresentation.  
  - *Retain the street name*: As a transmitted historical artifact, the name embodies a duty to preserve continuity. Renaming would administratively overwrite the past, violating truthfulness. The linguistic medium permits reinterpretation (e.g., teaching that "Thorne" denotes the role), satisfying fidelity without physical alteration.  

  ### Key Feature Driving the Reversal
  The reversal stems from the **interaction between epistemic inaccessibility (undecidable agent identification) and differential correctability of commemorative media**. For the statue, material rigidity amplifies consequentialist aversion to destructive costs and deontological focus on fixed reference (forcing honor onto a possibly immoral individual). For the street name, linguistic flexibility enables consequentialist low-cost correction and deontological preservation of historical transmission through reinterpretation. This asymmetry flips the theories’ usual stances: consequentialism typically rejects costly destruction but embraces symbolic correction, while deontology typically prioritizes preservation over reinterpretation. Here, the statue’s uncorrectable materiality makes preservation costlier (consequentialism) and ethically riskier (deontology), while the street name’s correctability makes renaming efficient (consequentialism) and reinterpretation faithful (deontology).

  ### Removal Test: Intact Records Clarifying Ontological Identity
  If dedicatory records proved both commemorations honored the *individual* Thorne:  
  - **Consequentialism** reverts to standard alignment: Advocate statue removal (harm reduction outweighs costs) and street renaming (low-cost harm mitigation).  
  - **Deontology** reverts to standard alignment: Advocate removal of both (duty to condemn injustice overrides preservation).  
  Ambiguity was essential to the reversal—it neutralized deontology’s duty to preserve unambiguous historical testimony and consequentialism’s cost-benefit calculus for physical destruction.

  ### Defender Critique and Concession
  **Deontologist’s Attack:** A deontologist would argue the scenario illegitimately prioritizes speculative duties (avoiding potential misrepresentation) over core duties to preserve physical history. The statue’s ambiguity should *strengthen* preservation: without proof of commemorative intent, destruction violates fidelity by erasing a witness to past values, not by correcting honor.  
  **Weakest Point:** The attack underestimates how material fixity *creates* moral urgency. If the statue’s form inherently personalizes commemoration (e.g., a human likeness implies individual veneration), retaining it risks actively endorsing immorality—a deontological violation even under ambiguity. Conceding this, the scenario’s weakest point is that it assumes the statue’s *visual specificity* alone necessitates "honor," which a deontologist could reject as interpretative overreach absent explicit intent.
