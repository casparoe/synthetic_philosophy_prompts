answer: |-
  Based on your focus and constraints, here is a defended prioritization for conceptual work on the separateness of persons objection, ordered by upstream importance and tractability for a small team working over 2-3 years:

  **Priority 1: Ex Ante Risk Policies vs. Ex Post Distributions**  
  *Why Upstream:*  
  This is foundational. If the separateness objection **loses force** in ex ante scenarios (e.g., public health policies imposing small risks to prevent large harms), it radically changes the debate’s scope. If it **retains force**, it constrains all aggregation—including prioritarian/contractualist rules—in risk-imposing institutions. Resolving this clarifies *where* the objection bites, making subsequent work on alternative rules and applications more targeted.  

  *Tractability:*  
  Highly tractable conceptually. Focus on:  
  - **Conceptual modeling**: Does imposing a 0.001% risk of death on 1 million people to save 10 lives *feel* like intrapersonal trade-offs (where separateness seems less salient) or interpersonal sacrifice?  
  - **Agency/consent**: Does hypothetical consent under ignorance (Rawlsian veil) mitigate separateness concerns?  
  - **Probability vs. certainty**: Does shifting from actual harm to probabilistic risk dissolve the "summing" problem?  

  *Key Evidence for Demotion/Promotion:*  
  - **Demote** if empirical psychology shows lay intuitions consistently treat ex ante risk aggregation *as if* it were intrapersonal.  
  - **Promote** if formal models prove that *any* ex ante policy violating individual rights (e.g., nonconsensual risk imposition) triggers separateness concerns regardless of net benefit.  

  **Priority 2: Contractualism/Prioritarianism—Solution or Semantic Dodge?**  
  *Why Second:*  
  This depends on Priority 1. If ex ante aggregation *avoids* the objection, alternative rules matter less for risk policies. If not, we need rigorous stress-testing: do these frameworks genuinely respect separateness or just obscure aggregation?  

  *Tractability:*  
  Moderate. Requires dissecting justifications:  
  - **Contractualism**: Does "no reasonable rejection" (Scanlon) prohibit *any* nonconsensual sacrifice, or permit trade-offs if no single person bears excessive costs? Test via paradoxes (e.g., many small harms vs. one large harm).  
  - **Prioritarianism**: Does weighting the worse-off avoid summing *across* persons, or just weight the sum? Analyze if the "priority" relation can be defined without interpersonal comparisons.  

  *Key Evidence for Demotion/Promotion:*  
  - **Demote** if a formal proof shows prioritarian weights *necessarily* reduce to weighted utilitarianism under risk.  
  - **Promote** if contractualism generates clear, non-aggregative rules for trade-offs (e.g., absolute prohibitions) that align with separateness intuitions.  

  **Priority 3: Institutional Applications (Triage, Health Policy)**  
  *Why Last:*  
  Without clarity on 1 and 2, applications risk either naïveté (ignoring separateness) or paralysis (overestimating constraints). Ex *post* applications (e.g., distributing organs) are intractable until Priority 2 establishes legitimate trade-off rules. Ex *ante* policies (e.g., vaccine mandates) depend entirely on Priority 1.  

  *Tractability:*  
  High for *framing* institutional principles, low for resolution. Focus on:  
  - Translating Priorities 1–2 into **decision heuristics** (e.g., "Maximin under risk?" "No nonconsensual sacrifice above threshold X?").  
  - Identifying **procedural safeguards** (e.g., democratic review, opt-outs) that address separateness despite aggregation.  

  *Key Evidence for Demotion/Promotion:*  
  - **Demote** if empirical work shows institutions *already* operationalize separateness via non-aggregative rules (e.g., ER triage prioritizing worst-off).  
  - **Promote** if real-world cases (e.g., pandemic triage) reveal unresolvable conflicts *without* appealing to Priority 1 or 2.  

  ---

  ### Why This Order & What Success Looks Like  
  1. **Priority 1** is the bottleneck. In 2–3 years, a team could:  
     - Publish a taxonomy of ex ante/ex post cases where separateness objections hold/dissolve.  
     - Build a formal model showing when risk distributions mimic intrapersonal trade-offs.  
     *Impact:* Reshapes the debate’s starting point.  

  2. **Priority 2** becomes urgent only if Priority 1 shows the objection persists under risk. A team could:  
     - Demonstrate whether contractualism/prioritarianism can forbid *any* Pareto-improving sacrifice (e.g., killing one to save many).  
     *Impact:* Declares alternative frameworks viable or dead ends.  

  3. **Priority 3** is downstream synthesis:  
     - Produce a "decision tree" for policymakers showing when aggregation is permissible (e.g., "Only in ex ante low-risk cases with prioritarian weights").  
     *Impact:* Prevents paralysis by offering actionable, philosophically robust principles.  

  **Trap to Avoid:** Getting bogged down in metaethics (e.g., "What *is* personhood?"). Focus on **operationalizing separateness**—when does it block specific actions? This delivers concrete gains within your timeframe.
