prompt: |-
  I’m a PhD student in political philosophy, working on secession and self-determination, and I keep going back and forth between the remedial view of the right to secede (unilateral exit only as a remedy for serious injustice) and the plebiscitary/primary-right view (a nationally-defined group’s majority vote is enough). Somebody brings up Scotland or Catalonia or Quebec and I realize I don’t actually know what I’d want a full theory of the right to secede to do before it starts adjudicating those cases. So treat me like a colleague. You’re an expert on the ethics of self-determination and territorial rights. Think carefully, and before you commit to a list, brainstorm candidate requirements first and then prune the ones that are really just parochial.

  What I want is the specification: a list of requirements a theory of the right to secede has to satisfy to count as adequate. Not a bibliography, not a reading list, and don’t skip ahead to defending one theory—I want the criteria themselves. The theory should be good enough to evaluate the standard three (Scotland, Catalonia, Quebec), but it should also be able to handle Kosovo, Kurdistan, Bangladesh, and weird recursive cases like the Cree in northern Quebec if Quebec left. For each requirement, give the consideration or case that puts it on the list, then say whether it’s non-negotiable or just a preference of one camp.

  Some distinctions I’m pretty sure the theory can’t collapse, but I want you to check me: unilateral secession vs negotiated divorce; the group’s right vs whether secession is wise or justified all-things-considered; who counts as “the people” (and the circularity of defining the unit by the outcome); what to do about minorities inside the seceding territory; and how far back a grievance can reach before it stops counting. 

  I’m genuinely unsure about some candidate requirements, so tell me wich of these belong on the list and which are bogus: economic viability of the new state; respect for the parent state’s constitution (Scotland’s referendum was legal, Catalonia’s wasn’t); a supermajority rather than 50%+1; a distinct language, history, or institutions; and whether outsiders are permitted—or bound—to recognize the new state. 

  The part I most need: if some subset of these requirements is jointly unsatisfiable—for example, respecting the parent state’s constitution and recognizing a remedial right when the parent state is the abuser—say so, and explain what we should conclude from that. Then tell me which single requirement does the most work in knocking out candidate theories, and why. A table is fine if it’s easier to read, but don’t let the table hide the reasoning.
reasoning: |-
  Alright, let's tackle this query from a PhD student in political philosophy. They're working on secession and self-determination, specifically torn between the remedial and plebiscitary views. They need a list of requirements for an adequate theory of the right to secede, not a bibliography or defense of one theory. 

  First, I need to understand their core request. They want criteria that a theory must satisfy to be considered adequate. The theory should handle standard cases like Scotland, Catalonia, Quebec, as well as Kosovo, Kurdistan, Bangladesh, and nested cases like the Cree in Quebec if it secedes. They also mentioned distinctions they believe are essential: unilateral vs negotiated secession, group right vs all-things-considered justification, defining "the people," minority rights, and historical grievances' timeframe.

  The user is unsure about some candidate requirements: economic viability, constitutional legality, supermajority, distinct cultural markers, and international recognition. They want to know which of these are valid requirements and which aren't. Most importantly, they need clarity on whether some requirements are jointly unsatisfiable and which single requirement is the most critical in evaluating theories.

  Breaking this down, the key elements are:

  1. **Essential Distinctions**: The user mentioned several distinctions they think are non-negotiable. I should verify these and ensure the requirements address them without collapsing them. For example, the circularity problem in defining "the people" is a real issue in secession theories. Also, handling minorities within the seceding territory is crucial to avoid creating new injustices.

  2. **Candidate Requirements**: The user listed specific points they're unsure about. I need to evaluate each:
     - Economic viability: While practical, it's not a moral requirement. A theory shouldn't deny a right based on economic factors, though it might affect all-things-considered justification.
     - Constitutional legality: This is procedural but not a moral requirement. If the parent state is the oppressor, requiring constitutional approval undermines the remedial right.
     - Supermajority: This relates to democratic legitimacy. A theory should consider it but not as an absolute requirement, as it might be context-dependent.
     - Distinct cultural markers: These can help define a group but shouldn't be necessary. Forcing cultural distinctiveness might exclude groups with strong political identities.
     - International recognition: More of an institutional consequence than a moral requirement. The theory should explain recognition but not make it a condition for the right itself.

  3. **Joint Unsatisfiability**: The main conflict is between respecting the parent state's constitution and recognizing a remedial right when the state is the abuser. If a theory insists on constitutional legality, it can't permit unilateral remedial secession against an abusive state. This means theories must prioritize one over the other, leading to fundamentally different approaches (remedial vs. plebiscitary).

  4. **Most Critical Requirement**: The "Conditions for Legitimacy of the 'People'" is likely the hardest. Defining the group without circularity or arbitrariness is a major challenge that knocks out many theories. Both remedial and plebiscitary views struggle here, though in different ways.

  I should structure the requirements into non-negotiable and contested categories. The non-negotiables include addressing core distinctions like unilateral/negotiated, group right vs. prudence, circularity of "the people," minority protections, and historical grievance limits. Contested requirements like economic viability or supermajority should be noted as preferences but not essential for the theory's adequacy.

  The user might have deeper concerns about theoretical consistency and practical applicability. They might be seeking a framework that doesn't just list cases but provides a principled way to resolve conflicts between requirements. Highlighting the tension between constitutional legality and remedial rights addresses their worry about joint unsatisfiability, which is crucial for their dissertation.

  In conclusion, the response should clearly list requirements, categorize them, explain conflicts, and identify the key stumbling block (defining "the people"). This will help the user evaluate existing theories or develop their own by understanding which criteria are essential and where the biggest challenges lie.
answer: |-
  Here's a specification of requirements for an adequate theory of secession, structured as requested. I've identified **7 Non-Negotiable Core Requirements** (stemming from the essential distinctions and core problems) and **5 Contested/Potential Requirements** (addressing your "unsure" list), analyzed for inclusion.

  ---

  ### **I. Non-Negotiable Core Requirements (Must be Addressed Adequately)**

  1.  **Distinguishes Unilateral vs. Negotiated Secession:**
      *   **Consideration/Case:** Quebec (negotiated process via Clarity Act/Reference), Catalonia (unilateral declaration vs. Spanish constitution), Kosovo (unilateral after failed negotiations). Bangladesh involved war, but started as unilateral claim against injustice.
      *   **Why Non-Negotiable:** A theory must explain when (if ever) a group can *forcefully* exit without agreement (remedial justification?) vs. when exit requires a mutually agreed process (primary right? constitutionalism?). Collapsing this distinction ignores the fundamental question of legitimacy *vis-à-vis* the existing state order.

  2.  **Articulates the Nature of the 'Right' (Moral Claim vs. All-Things-Considered Prudence):**
      *   **Consideration/Case:** Remedial theories posit a *moral right* triggered by injustice. Plebiscitary theories often posit a *prima facie* right based on democratic will. Both must then confront whether exercising that right is *wise* (e.g., economic impact on Scotland, potential instability in Kurdistan, treatment of minorities in a new Quebec).
      *   **Why Non-Negotiable:** Confusing a core moral claim with pragmatic consequences renders the theory useless for normative adjudication. A theory must define the *source* and *strength* of the claim *before* weighing consequences.

  3.  **Provides a Non-Arbitrary & Non-Circular Account of "The People" (Demos Problem):**
      *   **Consideration/Case:** Defining "Quebecers" vs. "Canadians," "Catalans" vs. "Spaniards," "Scots" vs. "Britons." Recursive cases like the Cree in an independent Quebec or Serb enclaves in Kosovo are critical tests. Who gets to vote? Why *this* territory?
      *   **Why Non-Negotiable:** This is the most fundamental and difficult problem. A theory cannot define the legitimate seceding unit purely by the outcome it seeks (independence) or by fiat. It must offer criteria (historical, institutional, identificatory, territorial?) that avoid infinite regress (Cree within Quebec) and accusations of arbitrariness. Failure here invalidates the entire project.

  4.  **Systematically Addresses the "Minorities Within Minorities" Problem:**
      *   **Consideration/Case:** Anglophones/allophones in Quebec, non-Catalans in Catalonia, Serbs in Kosovo, the Cree in Quebec, Hindus in Bangladesh pre-secession. What rights/protections/territorial claims do *they* have if the larger group secedes?
      *   **Why Non-Negotiable:** Secession risks replacing one potential injustice with another. A theory must explain how the rights/claims of internal minorities constrain or modify the secession claim (e.g., requiring internal self-determination guarantees, partition options, enhanced minority rights in the new constitution).

  5.  **Addresses Territorial Justification:**
      *   **Consideration/Case:** Why does the seceding group claim *this specific territory*? Historical control (Kosovo)? Current residence/demographics (Quebec, Catalonia)? Effective control (Bangladesh, Kurdistan)? What about resource-rich areas claimed by both?
      *   **Why Non-Negotiable:** Secession isn't just about a group; it's about a group claiming sovereignty over a specific piece of land. A theory must link the group's claim to the territory beyond simple occupation or desire. Remedial theories often tie territory to the site of injustice; plebiscitary theories to residence/voting.

  6.  **Specifies the Scope and Limits of Remedial Claims (If Included):**
      *   **Consideration/Case:** How severe must injustice be? (Bangladesh=clear, Kurdistan=ongoing, Catalonia=disputed, Quebec=largely symbolic/identity-based). How far back can grievances reach? (Historical conquest? Recent discrimination?). Does only the *current* generation's suffering count?
      *   **Why Non-Negotiable:** If a theory includes a remedial right, it requires clear, non-arbitrary thresholds to prevent trivialization or opening historical wounds endlessly. It must define "serious injustice" and its temporal scope.

  7.  **Explains the Relationship to International Law/Recognition:**
      *   **Consideration/Case:** Kosovo (recognized by many, not all), Bangladesh (eventually universal), Catalonia (almost none), Quebec/Scotland (recognition conditional on legal process). Is recognition declaratory or constitutive? When *should* outsiders recognize?
      *   **Why Non-Negotiable:** Secession aims to create a new *state* in the international system. A theory must explain how its normative conclusions translate into the realities of statehood and recognition – is recognition a moral duty under certain conditions, or purely political? It need not *dictate* recognition rules but must *interface* with them coherently.

  ---

  ### **II. Contested/Potential Requirements (Evaluate Carefully)**

  8.  **Economic Viability:**
      *   **Status:** **Bogus as a strict requirement for the *right*.** Wise? Often. Prudent? Usually. A *condition* for legitimacy? No.
      *   **Reasoning:** Denying a group's fundamental right to self-determination because they are poor is morally dubious (e.g., small island nations, post-conflict states). Viability is highly contingent (aid, trade, resources). Belongs under "all-things-considered prudence," not the core right. (Consideration: Small post-colonial states, potentially Scotland's oil debate).

  9.  **Respect for Parent State's Constitution:**
      *   **Status:** **Contested (Parochial to Constitutionalist/Consensualist Theories). Not universally required.**
      *   **Reasoning:** Central to Quebec/Scotland cases (legal referenda). Irrelevant/obstructive in remedial cases where the state *is* the perpetrator of injustice (Kosovo, Bangladesh). A theory prioritizing this (e.g., liberal nationalism) *must* justify why procedural legitimacy within an unjust or non-accommodating system trumps remedial claims. It cannot be a universal requirement without invalidating remedial justifications.

  10. **Supermajority Requirement:**
      *   **Status:** **Strong Preference, Not Absolute Requirement.** Belongs in *implementation*, not core right definition.
      *   **Reasoning:** While prudent for major, irreversible decisions (Quebec Clarity Act implied this), a rigid supermajority (e.g., 66%) risks disenfranchising a clear majority (51-65%) with a strong claim, especially remedial. The core theory should establish the *claim*, while implementation rules (like voting threshold) are secondary, contextual decisions about exercising that claim wisely.

  11. **Distinct Language/History/Institutions:**
      *   **Status:** **Useful Evidence, Bogus as Strict Requirement.**
      *   **Reasoning:** While often present (Quebec, Catalonia, Scotland, Kurdistan), distinctiveness isn't necessary. A group can form a strong, legitimate political identity without unique language/history (e.g., some argue for "civic" secessionist movements). Making it a requirement risks essentialism and excludes valid political projects. It helps define "the people" but shouldn't be a gatekeeper.

  12. **Obligation/Permission for Outsiders to Recognize:**
      *   **Status:** **Derivative Requirement.**
      *   **Reasoning:** Flows from Requirement #7. If the theory establishes a *just* secession (by its own lights), it *must* conclude whether this creates a *moral duty* for other states to recognize, or merely *permits* it. It cannot remain agnostic on the external implications of its own normative judgment.

  ---

  ### **III. Key Tensions & The Most Demanding Requirement**

  *   **The Core Tension (Joint Unsatisfiability):** **Requirement #9 (Constitutionality) vs. Remedial Element of Requirement #6.**
      *   **Explanation:** A theory *cannot* simultaneously hold that (a) the parent state's constitutional procedures *must* be respected for secession to be legitimate, AND (b) there exists a unilateral remedial right to secede triggered by serious injustice perpetrated *by that same state*. If the state is the abuser, its constitution is unlikely to permit its own dissolution as a remedy. Insisting on constitutionality negates the remedial right in the very cases where it's most needed. Theories must choose: prioritize constitutional order/procedural legitimacy (rejecting/redefining remedial rights) OR prioritize justice/self-defense (accepting unilateral remedial secession even if unconstitutional).
      *   **Conclusion:** This reveals a fundamental schism between **Constitutionalist/Consensualist** theories (emphasizing Requirement #9, often downplaying/redefining remedial rights) and **Remedial Right Only/Primacy** theories (minimizing Requirement #9's authority in cases of state abuse). Hybrid theories struggle immensely here.

  *   **The Most Demanding Requirement (Knocking Out Theories):** **Requirement #3 (Defining "The People" Non-Arbitrarily/Non-Circularly).**
      *   **Why:** This is the Achilles' heel of *all* secession theories.
      *   Remedial Theories: Struggle to explain *which group* holds the remedial right and why *they* are the victims entitled to *this territory*. Why not a different group? Why not partition?
      *   Plebiscitary/Primary Right Theories: Directly face the circularity – defining the voting unit presupposes the answer. Why vote in Quebec, not Montreal? Why Catalonia, not just Barcelona? Why not a pan-European demos?
      *   Nationalist Theories: Rely on contested notions of nationhood prone to arbitrariness and exclusion.
      *   **Impact:** A theory offering a genuinely compelling, non-circular, normatively defensible solution to the demos problem would be a major breakthrough. Most theories either gloss over it, rely on historical contingencies (which can be unjust), or resort to functionalist arguments that lack strong normative grounding against competing claims (like the Cree). Failure here leaves the theory vulnerable to charges of arbitrariness or question-begging.

  ---

  ### **Summary Table of Requirements**

  | Requirement                                 | Category          | Status               | Key Challenge/Case                          |
  | :------------------------------------------ | :---------------- | :------------------- | :------------------------------------------ |
  | **1. Distinguishes Unilateral vs. Negotiated** | Core              | **Non-Negotiable**   | Quebec (Neg) vs. Catalonia/Kosovo (Uni)     |
  | **2. Articulates Nature of 'Right'**        | Core              | **Non-Negotiable**   | Moral Right vs. Prudence (Scotland econ)    |
  | **3. Defines "The People" Non-Arbitrarily** | Core              | **Non-Negotiable**   | **MOST DEMANDING:** Circularity (Cree/Quebec) |
  | **4. Addresses Minorities Within**          | Core              | **Non-Negotiable**   | Anglophones in Quebec, Serbs in Kosovo      |
  | **5. Addresses Territorial Justification**  | Core              | **Non-Negotiable**   | Why *this* land? (Resources, history, res)  |
  | **6. Specifies Remedial Scope/Limits**      | Core              | **Non-Negotiable**   | Severity, timeframe (Bangladesh vs. Catalonia) |
  | **7. Explains Int'l Law/Recognition Link**  | Core              | **Non-Negotiable**   | Kosovo recognition vs. Catalonia non-recog |
  | **8. Economic Viability**                   | Contested         | **Bogus (as right)** | Belongs to prudence, not core right         |
  | **9. Respect Parent State Constitution**    | Contested         | **Contested**        | **CORE TENSION:** Legal Ref (Scot) vs. Remedial (Kosovo) |
  | **10. Supermajority**                       | Contested         | **Preference (Impl)**| Clarity Act (Quebec), prudence not right    |
  | **11. Distinct Culture/History**            | Contested         | **Bogus (Requirement)**| Useful evidence, not essential (Civic IDs)  |
  | **12. Outsider Recognition Duty/Permission**| Contested (Deriv.)| **Required (Deriv.)**| Flows from #7 (Int'l Law link)              |

  This specification provides the necessary scaffolding. A truly adequate theory must *satisfy* the Core Requirements coherently and *take a defensible position* on the Contested ones, explicitly resolving the core tension between constitutionalism and remedial justice. The demos problem remains the most significant theoretical hurdle. Now go build (or dissect) some theories!
