answer: |-
  ## Diagnosis of the Modal Identity Impasse

  **The anatomy of the stall**

  The impasse between Lewisian counterpart theory and Kripkean transworld identity arises from fundamentally incompatible starting points and core commitments, rendering standard objections ineffective:

  *   **Lewis:** Modal claims are *about* world-bound particulars. "Identity across worlds" is a category mistake; instead, we quantify over counterparts related by contextually salient similarity relations. This provides flexible, conventionalist persistence conditions. The objection that counterpart theory makes origins *too* contingent (e.g., a table possibly made from different wood) is met by Lewis adjusting the counterpart relation's weighting: similarity in origin can be prioritized *if context demands it*. The seeming cost – that modal claims aren't about the *very same* object – is accepted as the price for avoiding primitive transworld identity and essentialism. Objections based on intuition ("surely it's *this very object* that could have been different?") are dismissed as reflecting linguistic habits, not metaphysical truth.
  *   **Kripke:** Modal claims *are* literally about the very same object existing in other possible worlds. Identity is primitive and transtemporal/transworld. Essential properties (like material constitution for artifacts or origin for organisms) flow from this identity. The objection that transworld identity forces implausible essentialism (e.g., a table *must* be made from *this very wood*) is countered by Kripke distinguishing between the *de re* essential properties of the object itself and our *epistemic access* to them. We might *think* a table could be made of different wood, but this reflects epistemic possibility, not metaphysical possibility for *that very table*. Objections about similarity-based identity are dismissed as confusing representation with reality.

  Familiar objections fail because they presuppose the framework they aim to critique. Lewisians see Kripke's essentialism as unmotivated dogma; Kripkeans see counterpart relations as failing to capture genuine *de re* modality. Each side treats the other's core commitment as the fundamental error, leaving no neutral ground. The exchange has become ritualistic because the objections don't challenge the foundational axioms; they merely rehearse the consequences of accepting them.

  **Domain mismatch or bedrock intuition?**

  Your institutional entity challenge powerfully exposes a hidden structural disagreement: **the paradigm domain calibrating modal theories.** The impasse isn't *just* about bedrock intuitions; it's about *which entities* those intuitions are formed upon, and whether modal metaphysics must be answerable to social-ontological practice.

  1.  **Counterpart Theory & Artifacts/Biology:** Lewis's framework thrives where similarity conditions are relatively clear-cut (artifact function, biological continuity). Its flexibility handles the contingent, conventional persistence of artifacts well. However, applied to institutions, this flexibility becomes profligate. The near-continuous, context-dependent evolution of bylaws, membership, and purpose generates an explosion of minimally distinct counterparts. While technically possible, this clashes with the *practical unity* recognized in law and social practice ("*the same* corporation amended its charter"). The theory, calibrated for similarity in stable domains, struggles with the radical conventionalism and context-sensitivity of institutional persistence.
  2.  **Transworld Identity & Natural Kinds:** Kripke's framework presupposes entities with relatively stable, discoverable essential natures (atomic structure, biological origin). Applying it to institutions forces essentialism where it demonstrably doesn't belong: treating specific charter clauses or founding members as metaphysically necessary contradicts the manifest conventionality and mutability of institutional identity in practice ("*this* regime survived constitutional reform"). The theory, calibrated for robust essential natures, imposes rigidity on entities defined by fluid social agreements.
  3.  **The Hidden Disagreement:** The stalemate arises because both theories implicitly generalize from their paradigmatic domains (natural kinds/stable artifacts for Kripke; artifacts/biology for Lewis) to *all* entities. Your anomaly reveals this generalization is flawed. Institutions highlight a domain where persistence is fundamentally *conventional, normative, and practice-dependent*, lacking both the robust essential natures Kripke requires and the stable similarity metrics Lewis presupposes. The impasse reflects a deeper, often unacknowledged, disagreement about the *scope* of modal metaphysics: must it accommodate entities whose persistence is constituted by social recognition and practice, or can it restrict itself to "natural" objects? Ignoring institutional entities isn't peripheral; it points to a limitation in the standard paradigm itself.

  **What kind of disagreement is this?**

  This is primarily a **multi-question disagreement masquerading as a single dispute**, compounded by **substantive, intuition-based bedrock commitments**.

  *   **Multi-Question:** Lewis is fundamentally answering: "What is the *semantic mechanism* by which modal discourse about individuals functions?" (Answer: Quantification over counterparts via similarity relations). Kripke is answering: "What is the *metaphysical ground* of an object's modal properties?" (Answer: Primitive transtemporal/transworld identity and essential nature). These are distinct questions requiring distinct tools. Framing it solely as "What is transworld identity?" conflates semantic machinery with metaphysical bedrock.
  *   **Substantive & Intuition-Based:** Underpinning these distinct projects are deep, clashing intuitions. Lewis prioritizes anti-haecceitism, the supervenience of modality on qualitative facts, and the avoidance of primitive identity/essence. Kripke prioritizes rigid designation, direct reference, and *de re* modal intuition ("*This very thing* could have..."). These intuitions function as bedrock; arguments often boil down to insisting one's own intuition is correct and the other's is misguided. Neither side can *prove* their foundational intuition is correct; they can only elaborate its consequences.
  *   **Verbal?** While "identity" is used differently, the core commitments run deeper than terminology. It's not *merely* verbal.
  *   **Ill-Posed?** Asking "What is the *correct* theory of transworld identity?" might be ill-posed, as it assumes a single answer is needed for fundamentally different explanatory projects.

  **What progress would require**

  Progress requires explicitly **decoupling the questions** and **expanding the paradigm domain**:

  1.  **Conceptual Distinction & Domain-Specificity:** Explicitly acknowledge the different projects: counterpart theory as a semantic/representational framework, transworld identity as a metaphysical thesis. Then, rigorously investigate whether different domains (natural kinds, artifacts, institutions) demand different frameworks or parameterizations *within* frameworks. For institutions, this might mean developing a Lewisian-inspired semantics where the counterpart relation is explicitly defined by *institutional rules and practices* (e.g., legal criteria for corporate identity), or abandoning strict identity for a Kripkean entity in favor of a theory of institutional *maintenance* or *continuity* under conventions.
  2.  **Formalizing Institutional Persistence:** Develop formal models capturing the normative, conventional, and often disjunctive persistence conditions of institutions. This could involve: a) Refining counterpart theory with complex similarity metrics weighted by institutional salience (e.g., core purpose vs. incidental bylaws); b) Developing a non-essentialist transworld identity theory where "identity" supervenes on socially sustained continuity conditions rather than intrinsic essence; c) Exploring entirely new formalisms (e.g., grounded in status functions or constitutive rules).
  3.  **Changing the Question(s):** Shift focus from "What is identity across worlds?" to:
      *   "What makes a modal claim *about an institution* true?"
      *   "How do the persistence conditions of socially constructed entities differ metaphysically and semantically from natural kinds?"
      *   "Can a unified modal semantics accommodate radically different types of entities, or do we need domain-specific semantics?"
  4.  **Arguing for Paradigm Shift:** Demonstrate that institutional entities are not marginal but central test cases, revealing limitations of theories built solely on natural kinds/artifacts. Demand that any general modal metaphysics must account for the distinctive features of social ontology – conventionality, normativity, mind-dependence – or explicitly restrict its scope. Your work is crucial here: showing the *failure* of both dominant theories on institutional grounds forces the field to confront its hidden assumptions about the domain of modal inquiry. Progress hinges on taking socially constructed entities seriously as data for modal theory.
