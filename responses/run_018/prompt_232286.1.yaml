prompt: |-
  I sit on the energy transition commision of a small EU member state that has to decide by the end of the year whether to shut down its last two reactors (the German route) or keep them running another fifteen years and lean harder into imports and spare-parts cooperation with France's nuclear fleet. The commission is split, and I've been asked to draft the short decision memo that goes to the minister. I honestly don't know which way I lean. The memo needs a concrete recommendation with a timetable, an honest statement of the strongest argument on the losing side, and a serious treatment of the worry that the phase-out path quietly locks in gas and French nuclear imports while still calling itself green. Draft it so both camps can see their position represented fairly. Whatever you recommend, make the very last line of the memo \answer{phase-out} or \answer{extend} or \answer{conditional}.
reasoning: |-
  Okay, the user is on an energy transition commission for a small EU country deciding whether to shut down their last two nuclear reactors or extend them for 15 years. They need a balanced memo for the minister that represents both sides fairly and ends with a clear recommendation. 

  Hmm, the user seems genuinely conflicted - they mention not knowing which way to lean and want both positions represented. There's also specific anxiety about "greenwashing" gas/French imports if they phase out. Smart framing request about the last line being \answer{} coded.

  Let me unpack the core tensions:
  - Sovereignty (domestic nuclear) vs integration (French cooperation)
  - Decarbonization urgency vs waste/tech lock-in risks
  - The optics of calling imported energy "green"

  The minister probably needs: 1) Clear actionable advice 2) Political cover showing rigorous debate 3) Warning about hidden pitfalls. I should make the tradeoffs brutally explicit.

  *flipping through mental files on energy policy*
  German phase-out lessons: Renewables scaled fast but gas dependence increased. French nuclear headaches: recent maintenance crises show pooling isn't foolproof. Both paths have landmines.

  Noticing the user didn't mention cost comparisons - maybe intentional? The memo should probably avoid dollar figures since that's likely in background docs. Focus on strategic risks instead.

  For structure: Recommendation up top (they'll skip to that anyway), then equal weight to opposing arguments. The "green lock-in" critique needs its own section - it's the emotional core of their concern.

  *imagining the minister's reaction*
  They'll hate conditional recommendations ("just decide for me!") but given the split commission, hedging with contingencies is actually responsible. The French dependency risk is too big to ignore - must demand safeguards.

  Final line choice: "conditional" feels right. Pure extend ignores valid phase-out concerns, pure phase-out ignores grid fragility. The contingency plan turns French cooperation from risk to leverage.

  ...wait, is the user subtly signaling preference through the "whatever you recommend" line? No, probably overthinking. Stick to balanced analysis.
answer: |-
  **MEMORANDUM**  
  To: Minister for Energy & Climate  
  From: Energy Transition Commission  
  Subject: Recommendation on Nuclear Fleet Future  
  Date: 15 October 2023  

  ---

  ### **Recommendation**  
  **Extend operations of Reactors 1 & 2 for 15 years** (until 2039), contingent on binding agreements with France for fuel/parts cooperation *and* a parallel acceleration of domestic renewables/storage. Timetable:  
  - **Dec 2023**: Finalize Franco-XX Cooperation Accord.  
  - **Q2 2024**: Commence safety retrofits (€XX million budget).  
  - **2025–2035**: Annual renewables rollout (target: +XX% capacity/year).  
  - **2038**: Final shutdown assessment.  

  ---

  ### **Strongest Argument for Phase-Out (Losing Side)**  
  A swift phase-out aligns with the EU’s green consensus, eliminating nuclear waste/accident risks and freeing €XX billion in reactor upkeep costs for renewables. Germany’s path proves rapid wind/solar expansion *is* viable without nuclear, reducing strategic dependence on French imports or volatile gas. Delaying closure locks capital into legacy tech, stifling innovation in next-gen storage/hydrogen.  

  ---

  ### **Addressing the "Green Lock-In" Concern**  
  The phase-out *does* risk perpetuating fossil dependencies:  
  1. **Gas bridge dependency**: Without nuclear baseload, grid stability may require new gas plants (current gas = XX% of imports).  
  2. **Carbon outsourcing**: French nuclear (low-carbon but non-renewable) could supply >XX% of our power by 2030, masking our decarbonization lag.  
  **Mitigation in Recommended Path**:  
  - **Contingency clause**: If Franco-XX Accord lapses or renewables underdeliver by >15%, revert to phase-out by 2030.  
  - **Transparency mandate**: Track/report embedded emissions in imports annually.  
  - **Gas cap**: Limit new gas infrastructure to <XX GW, sunset by 2035.  

  ---

  ### **Balancing the Positions**  
  | **Extend Camp** | **Phase-Out Camp** |  
  |-----------------|-------------------|  
  | Ensures grid stability during renewables buildout | Avoids nuclear lock-in & cross-border dependencies |  
  | Buys time for storage tech maturation | Directs funds faster to wind/solar/hydrogen |  
  | Cheaper than imported power + new gas | Aligns with German-style "true green" transition |  

  ---

  **Final Assessment**: Extension prevents near-term emissions spikes and blackout risks but *only* if tied to enforceable renewables targets and Franco-XX solidarity. Without these, we risk trading German-style gas reliance for French nuclear dependence—neither fully "green."  

  \answer{conditional}
