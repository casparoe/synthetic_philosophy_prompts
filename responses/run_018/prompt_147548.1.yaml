answer: |-
  Here’s your take-home exam draft, designed to force deep structural analysis without relying on rote summaries. It targets the nuances you requested and includes a model answer framework + marking scheme.

  ---

  **PHIL 410: Ethics and Collective Action**  
  **Take-Home Exam (30 Marks)**  
  **Time Allowed: 48 hours | Max Words: 900**

  ---

  ### Question
  **Background**:  
  The "inefficacy objection" claims individual actions (e.g., driving, eating meat, voting) are morally negligible in large-scale collective problems because their causal impact is undetectable. Consider two models:  
  1.  **Threshold Harm (Bridgeville Model)**: In a town of 10,000 drivers, *exactly* 5,000 driving one extra mile on Tuesday causes a bridge collapse. Each mile’s carbon emissions, however, contribute linearly to global warming.  
  2.  **Linear Diffuse Harm (Standard Climate Model)**: Each action contributes negligibly to an aggregate harm (e.g., CO₂ emissions scale linearly with no decisive thresholds).  

  **Task**:  
  Analyze whether the moral argument **against** engaging in the following actions strengthens, weakens, or transforms when shifting from the *Threshold Model* to the *Linear Model*:  
  (A) Driving (extra mile)  
  (B) Eating meat (one meal)  
  (C) Voting (in a large election).  

  In your response:  
  1.  Explain whether the inefficacy objection primarily concerns **causal redundancy** (your action isn’t *the* cause), **expected impact** (statistical significance), or **normative redundancy** (your duty vanishes if others act).  
  2.  Compare all three cases, highlighting where the Threshold Model breaks the inefficacy objection and where it fails.  
  3.  Address how **supply-chain batching** (e.g., meat ordered in bulk) and **probabilistic thresholds** (e.g., voting) complicate the analysis.  

  *(900 words max. Arguments must engage both models explicitly.)*  

  ---

  ### Model Answer Framework (Key Moves for 30 Marks)  
  A top response **must** include these 8 conceptual moves:  

  1.  **Distinguish causal vs. expected impact inefficacy** (4 marks):  
      - Causal redundancy: In Bridgeville, your mile *can* be decisive if you’re the 5,000th driver. In linear climate, your emission *cannot* be a singular cause.  
      - Expected harm: In *both* models, driving has expected disvalue (Bridgeville: risk of triggering collapse; linear: definite micro-harm).  

  2.  **Driving: Threshold breaks causal but not expected inefficacy** (4 marks):  
      - Threshold Model: Your action *can* cause catastrophe → **weakens** causal inefficacy objection.  
      - Linear Model: Your action is causally redundant → **strengthens** causal objection.  
      - *But*: Expected harm (carbon cost) persists in both → inefficacy objection shifts from causal to probabilistic/aggregate grounds.  

  3.  **Meat: Batching creates micro-thresholds** (6 marks):  
      - Linear Model: Standard inefficacy holds (your skipped meal ≈ 0.0001% of a cow).  
      - Threshold Model: **Supply chains batch demand**. If restaurants order meat in 100-unit batches, skipping 100 meals *could* prevent an order → your meal *might* be the threshold unit.  
      - Verdict: Threshold thinking **strengthens** the case against meat-eating if batching exists.  

  4.  **Voting: Probabilistic thresholds dominate** (6 marks):  
      - Causal redundancy: In large elections, your vote *almost* never causes victory (cf. Bridgeville’s determinism).  
      - Expected impact: Probability of being decisive ≈ 1/(electorate size) *in swing states*. This is low but *non-zero* → **expected impact** matters, not causation.  
      - Normative redundancy: If others vote, your duty doesn’t vanish (unlike Bridgeville’s binary outcome).  

  5.  **Normative Redundancy Critique** (3 marks):  
      - Bridgeville: If 5,001 drive, your abstention doesn’t prevent collapse → duty disappears?  
      - Linear Climate: Your duty persists (harm is scalar, not threshold-dependent).  

  6.  **Synthesis: Inefficacy is about expectations, not binary causation** (4 marks):  
      - Top answers reject "all-or-nothing" causation. Moral weight derives from *expected marginal harm* across cases:  
        - Driving (linear): Definite micro-harm + cumulative risk.  
        - Meat (batched): Low-probability chance of macro-impact.  
        - Voting: Very low-probability high-stakes impact.  

  7.  **Mistake Avoidance** (3 marks):  
      - Penalize: Treating voting/driving/meat identically (–2), conflating underdetermination (multiple sufficient causes) with inefficacy (–3), ignoring expectation calculus (–3).  

  ---

  ### Marking Scheme  
  | **Section**                          | **Marks** | **Deductions (Common Errors)** |  
  |--------------------------------------|-----------|--------------------------------|  
  | Causal vs. expected impact distinction | 4        | –2 if conflated               |  
  | Driving analysis (both models)       | 4         | –3 if ignores linear harm     |  
  | Meat analysis (batched thresholds)   | 6         | –4 if treats as purely linear |  
  | Voting (prob. threshold + duty)      | 6         | –3 if omits probability       |  
  | Normative redundancy critique        | 3         | –1 if oversimplified          |  
  | Synthesis (expectations focus)       | 4         | –2 if no cross-case comparison|  
  | Clarity/avoiding specified mistakes  | 3         | Per error (–1 to –3)          |  

  ---

  ### What Would Change My Mind?  
  The weakest link is **meat batching**. The model answer assumes supply chains create tangible thresholds (e.g., skipping 50 meals = one fewer chicken ordered). **If empirical evidence showed** that suppliers adjust orders continuously (e.g., algorithmic dynamic pricing negates batch effects), the threshold argument for meat collapses. In that case, meat consumption would align with *linear diffuse harm*—making the inefficacy objection **stronger** in the meat case than proposed here.  

  ---

  Let me know if you want adjustments to the weighting or edge cases! This forces engagement with the *structure* of the objection while avoiding textbook rehashes.
