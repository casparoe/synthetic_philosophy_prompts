answer: |-
  **The disagreement is substantive and likely unresolvable because it stems from incompatible metaphysical commitments about what constitutes explanation itself, rooted in divergent visions of history's purpose.** Here's the reasoning:

  1.  **Core Disagreement on Explanation:** Covering-law proponents (e.g., Hempel, influenced by logical positivism) hold that genuine explanation *requires* subsuming an event under general laws, even if those laws are probabilistic, vague, or tacit. Explanation shows the event was *expectable* given antecedent conditions and laws. They **acknowledge narrative coherence as pragmatically useful** for discovery or presentation, but **deny it is explanatorily fundamental**; the *real* explanation is the (often hidden) nomological structure. Narrative coherence is heuristic, not constitutive of explanation.

  2.  **Narrative Theorists' Counter:** Narrative proponents (e.g., Danto, Gallie, White, Ricoeur) argue that historical explanation *primarily* involves rendering events intelligible by placing them within a coherent story structure – showing their significance, connections, intentional context, and temporal development. They **reject the claim that general laws carry the *essential* explanatory weight** in history. While not necessarily denying that some general regularities exist (e.g., human nature, economic patterns), they argue that:
      *   Invoked "laws" are often trivial truisms ("revolutions occur under oppression").
      *   Focusing on subsumption under laws **distorts historical particularity** by abstracting away the very context, intentions, and contingent sequences that make an event *historically significant*.
      *   Explanation lies in the unique configuration revealed by the narrative, not in its deducibility from laws. Laws may be background conditions, not the engine of explanation.

  3.  **Your Hypothesis Confirmed:** The "explanatory partitioning" difference is crucial. Covering-law assumes the *explanandum* (what needs explaining) is an event defined by its place in a universal causal structure; boundaries are discovered. Narrative theory assumes the *explanandum* is defined by its significance within a human context shaped by the historian's questions and interests; boundaries are constructed. **They are not evaluating the same thing as "the explanation."**

  4.  **Nature of the Disagreement:** It is **not primarily verbal or about different questions disguised as one**. Both sides *are* trying to answer "How does history explain events?" The core disagreement is:
      *   **Metaphysical/Empistemological:** Is historical explanation fundamentally a subspecies of scientific (nomological) explanation, or is it a distinct form of understanding (*Verstehen*) tied to human action, meaning, and temporality?
      *   **Purpose of History:** Is history's aim primarily to uncover causal mechanisms governing past events (like a social science), or to render the past intelligible and meaningful to present concerns (like a hermeneutic or literary endeavor)? These are **bedrock intuitions** about the discipline's nature.

  5.  **Prospects for Progress & Diagnosis:**
      *   **Limited Formal Distinction:** Distinguishing "causal" (law-based) vs. "structural/contextual" (narrative) explanation is descriptive but doesn't resolve the *primacy* dispute. Each side grants the other a subordinate role.
      *   **Case Study Difficulty:** Finding cases where *only* one approach works is hard. Covering-law might "explain" the *possibility* of the French Revolution via social strain theories, but narrative explains its *specific outbreak in 1789, its course, and its meaning* via contingent events (financial crisis, specific decisions), ideological shifts, and character actions. The sides disagree on which explanation is more fundamental or complete. **Predictive outcomes diverge only if covering-law claims stronger predictive power than historical evidence supports.**
      *   **Likely Irreconcilable:** The dispute stems from fundamentally different starting points about the nature of reality (is historical causation fundamentally law-governed or meaning-laden?) and the purpose of historical inquiry (causal knowledge vs. hermeneutic understanding). **Progress likely means clarifying these foundational commitments rather than achieving consensus.** The most viable path is pragmatic pluralism: recognizing each approach answers different, valid questions within historical practice, but this sidesteps the core philosophical conflict about the *nature* of explanation itself.

  **Bottom Line:** The standoff persists because it reflects an irreconcilable clash between competing paradigms of what historical explanation *is for* and *how the world must be* for that explanation to succeed. Neither side can fully satisfy the other's criteria for a "complete account" because those criteria are rooted in incompatible foundational commitments.
