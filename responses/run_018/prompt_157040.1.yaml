  everyone in alignment circles keeps saying a deceptively aligned model is like a job candidate who aces every interview round but is actually planning to slack off the second they get past probation. they use this to argue that passing safety evals proves nothing because the model is just playing the interview and will take the treacherous turn once deployed. i want you to audit this anology: map the hiring manager, the resume padding, the probation period, and the slacking onto actual training dynamics and deployment conditions. then tell me where the mapping breaks, especially whether theres any analog to intent to deceive in a system that doesnt plan ahead, and whether the conclusion that we cant trust evals at all survives once those breaks are on the table. also flag whether the analogy smuggles in human careerism and implied good-faith contracts that dont exist in reward modeling.

