  Hmm, the challenge is creating that "reverse adaptive preference" structure where first and second-order desires align but are shaped by invisible systemic constraints. I'm considering workplace scenarios since they offer subtle power dynamics. A hospital shift comes to mind - maybe an ER nurse making triage decisions under extreme resource limitations.

  The key elements needed:
  - No direct interference (negative liberty satisfied)
  - No arbitrary domination (republican liberty satisfied)
  - But systemic constraints that narrow cognitive horizons (undermining positive liberty)

  For the nurse character, let's call her Maya. She's highly skilled, makes autonomous decisions daily, and feels fulfilled - her desires align perfectly with her actions. But the twist is how the healthcare system's underfunding has invisibly shaped what she considers possible, eliminating alternatives from her mental framework.

  Walking through the liberty frameworks:
  Negative liberty: Maya faces no external barriers to acting on her will → free
  Republican liberty: No dominator controls her choices → free
  Positive liberty: Her "self-authored" goals exist within artificially narrowed possibilities → unfree

  The structural feature doing the heavy lifting is the systemic constraint that removes alternative reference points without direct coercion. If we remove this - say by exposing Maya to better-resourced systems - her apparent contentment might rupture.

