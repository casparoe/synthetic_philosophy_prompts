reasoning: |-
  Okay, the user's anthro friend has this system for classifying practices as corruption or not, and they've listed several examples with her verdicts. The friend now presents an edge case: an elder mediating a land dispute and receiving pigs from the winning clan in a small-scale society where this is seen as fair reciprocity. The user wants me to predict her call, map how each of the three rules would view it, identify which rule she's actually using, explain why the other verdicts don't fully lock it down, and provide a hypothetical case that splits the remaining two rules. The user also suspects she's importing Western bureaucratic ideals.

  First, I need to recall the three rules the user mentioned: universalist (misusing public trust), localist (violating local norms), and institutional (requires a bureaucratic state separate from kinship/economy). Looking at her verdicts: Japanese omiyage gifts aren't corruption because they're part of the culture; Brazilian vote-buying is corruption since it's illegal and undermines democracy; Trobriand kula exchanges aren't corruption as they're traditional; US super-PAC donations are corruption due to influence on politics; Italian raccomandazione is corruption for bypassing meritocracy; Melanesian big-man pig distributions aren't corruption as they're customary; Chinese guanxi in state contracting is corruption because it's seen as cronyism.

  For the edge case: In a small-scale society with no bureaucracy, an elder mediates a dispute and gets pigs from the winning clan, viewed as fair reciprocity. Predicting her call: Since it's similar to Melanesian pig distributions and Trobriand kula, she'd likely say "not corruption." Now mapping the rules: 

  - Universalist: If the elder is seen as holding a public trust role, receiving pigs might be misuse, but in stateless societies, roles aren't formalized, so it's ambiguous. 

  - Localist: Since locals see it as fair, this rule would say not corruption. 

  - Institutional: No bureaucratic state, so no corruption possible. 

  The institutional rule seems most consistent with her verdicts. Why? Her "corruption" verdicts all involve state contexts (Brazilian voting, US super-PACs, Italian jobs, Chinese contracting), while "not corruption" cases lack a formal state (Japan's omiyage might be an exception, but it's normalized). The universalist rule is fuzzy because "public trust" varies culturally, and localist is contradicted by cases like Italian raccomandazione which may be locally accepted but still deemed corrupt by her. 

  The user thinks she's importing Western bureaucratic ideals. That's plausible since her framework centers on formal state separation. To split the remaining rules (universalist vs. localist), a hypothetical case could be a culturally accepted practice in a bureaucratic state that violates formal rules but not local norms. For example, a community where police accept small gifts as part of local custom, but it's illegal. Universalist rule might call it corruption (misuse of public trust), while localist would not (if locals approve). This exposes the tension between external standards and local perceptions.
answer: |-
  Based on your anthro friend's pattern and the edge case, here's the breakdown:

  1.  **Predicted Call for the Edge Case:** **Not Corruption** (consistent with Trobriand Kula & Big-Man pig distributions).

  2.  **Mapping the Three Rules to the Edge Case:**
      *   **Universalist Rule (Misusing Public Trust):** **Ambiguous/Leans Corruption.** The elder holds a position of trust/responsibility in dispute resolution. Accepting pigs *from the winning side only* could be seen as misusing that trust for personal gain, potentially biasing future decisions. However, the lack of a formal "public office" makes "public trust" culturally fuzzy.
      *   **Localist Rule (Violating Local Norms):** **Not Corruption.** Crucially, "locals see it as fair reciprocity." Since the practice aligns with local norms and expectations, it wouldn't be classified as corruption under this rule.
      *   **Institutional Rule (Requires Bureaucratic State):** **Not Corruption.** The society explicitly has "no bureaucratic offices" and the state/kinship/economy spheres are undifferentiated. Corruption, by this definition, cannot exist here.

  3.  **The Rule She's Actually Using:** **The Institutional Rule.**

      *   **Why?** Her verdicts consistently hinge on the presence or absence of a formal, impersonal bureaucratic state structure separate from social/kinship ties:
          *   **"Not Corruption" Cases:** Japan (gift-giving *within* expected social/business norms, not seen as buying decisions), Trobriand (ceremonial exchange outside state structure), Big-Man (prestige economy within kinship structure).
          *   **"Corruption" Cases:** Brazil (buying votes in a formal democratic state system), US Super-PACs (buying influence within a formal political system with campaign finance rules), Italy (bypassing formal meritocratic bureaucracy), China (using personal ties to subvert formal state contracting procedures).
      *   **Why the Other Rules Don't Fully Lock It Down:**
          *   **Universalist Rule Falters:** It struggles with cultural relativity. Is the elder's role "public trust" universally? Is reciprocity always misuse? Her "not corruption" verdict for Japanese omiyage (gifts to officials *could* be seen as misuse of public trust in a universalist view) and "corruption" verdict for Italian raccomandazione (which might be locally *accepted* norm) contradict a strict universalist application.
          *   **Localist Rule Falters:** Her "corruption" verdicts for Brazilian vote-buying and Italian raccomandazione are key. These practices might be locally *accepted* or even expected norms in specific contexts (e.g., clientelism), yet she still labels them corruption. This directly violates the localist rule. If she used localism, she'd have to call them "not corruption" if locally accepted.

  4.  **Hypothetical Case to Split Universalist vs. Localist Rules:**
      *   **Scenario:** In a country with a formal bureaucratic state and anti-bribery laws, a longstanding cultural norm exists in rural villages where citizens *routinely* give small cash "gratuities" ($10-20) to low-level public clerks (e.g., for processing land records, licenses) *after* the service is completed. Locals universally view this as polite, customary reciprocity for the clerk's effort, not as bribery to influence outcomes. The clerks see it as a normal perk, and the service is always performed correctly regardless. The national government and urban elites, however, deem it illegal corruption.
      *   **Split:**
          *   **Localist Rule:** **Not Corruption.** It perfectly aligns with and is expected by local norms in that specific context. No violation occurs within that local framework.
          *   **Universalist Rule:** **Corruption.** It involves public officials accepting personal payments related to their duties, creating a potential conflict of interest and misusing the public trust inherent in their bureaucratic role (even if the outcome isn't altered *this time*). The formal state context makes "public trust" clear.
      *   *(This highlights the conflict between local custom and a formal state's universalist legal framework)*

  5.  **Your Suspicions about Western Bias:** You are very likely correct. Her operational definition, especially the reliance on the **Institutional Rule**, heavily reflects a Western (specifically Weberian) ideal of the modern rational-legal bureaucratic state as the benchmark against which "corruption" is defined. Practices incompatible with this ideal (impersonal rules, separation of office/officeholder, meritocracy) within state contexts are deemed corrupt, while functionally similar reciprocity practices *outside* the state structure are not. This framework privileges the Western bureaucratic model as the "neutral" or "correct" baseline, potentially ethnocentrically pathologizing other forms of exchange within or influencing state power. Her rejection of the localist rule for cases *within* states (Brazil, Italy) confirms this bias – the formal state's rules override local acceptance.
