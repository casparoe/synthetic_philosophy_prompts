prompt: |-
  hey, i'm prepping a philosophy of science seminar — 16 grad students, one 75-minute block. i need an in-class simulation/game that makes participants feel why cooperation evolves in iterated prisoner's dilemmas but dies in one-shot ones, without me just lecturing about tournaments. the twist should be physical: they use index cards as strategies, and there's a hidden 'mutation deck' that introduces random strategy shifts every few rounds. also include a 'shadow round' mechanic where pairs aren't told whether their partner will be replaced by a copy in teh next round, so they have to act without knowing if there's a shadow of the future. design rules, symbolic payoffs (point chips, no cash), materials list, and a structured debrief that maps specific moments onto evolutionary stability / ESS ideas. tell me what will predictably break the first time i run it, and be frank about which evolutionary dynamic this card-based setup can't actually reproduce. answer in these parts: 'The setup' (~150 words), 'Rules and payoffs' (~200 words), 'The debrief' (~250 words), 'What will break and what's missing' (~120 words). keep it casual — this is just prep notes.
