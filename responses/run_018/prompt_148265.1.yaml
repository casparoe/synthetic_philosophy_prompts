answer: |-
  **The Setup**  
  Grab 16 students, 32 blank index cards, markers, a deck of 20 pre-written "mutation strategy" cards (TFT, Always Defect, Always Cooperate, Random), and 4 colors of poker chips (red=5, blue=3, green=1, white=0). Pair everyone up randomly. Each student privately writes a strategy name *and* a rule on their card (e.g., "Grudger: Cooperate first, defect forever if opponent defects once"). Shuffle all cards into a pile. Each student draws a random card – that’s their starting strategy. Designate a "game master" (you) to manage mutations and shadow rounds.  

  **Rules and Payoffs**  
  - **Rounds:** Run 10-15 rounds. Each round, pairs play 1 simultaneous PD.  
  - **Choices:** Players secretly show a colored chip (blue=cooperate, red=defect) to their partner.  
  - **Payoffs:**  
    - Both Cooperate: Blue chip (3 pts) each  
    - Both Defect: White chip (0 pts) each  
    - You Defect, They Cooperate: Red chip (5 pts) for you, Green chip (1 pt) for them  
  - **Mutation:** Every 3 rounds, shuffle the mutation deck. Draw 3-4 cards; those players *must* adopt the new strategy.  
  - **Shadow Rounds:** Randomly before 3 rounds, announce: "After this, SOME partners will be replaced by copies." Don’t specify who. After those rounds, actually replace 20-30% of players with new students drawing from the current strategy pool.  
  - **Evolution:** After round 10, bottom 4 scorers "die" – discard their strategy. Top 4 scorers "replicate" – clone their strategy to replace the dead.  

  **The Debrief**  
  Start chaotic: *"Why did early rounds feel cutthroat?"* Highlight one-shot mentality.  
  Post-shadow rounds: *"Who cooperated less when futures felt uncertain?"* Link to discounting future payoffs → collapse of cooperation.  
  When TFT/reciprocity emerges: *"How did knowing your partner next round change play?"* Map to Axelrod’s tournaments – stability through reciprocity.  
  Mutation chaos: *"Did a nice strategy get replaced by a defector? What happened to their group?"* → Mutant invasions destabilize clusters.  
  ESS spotlight: When a strategy (e.g., TFT) dominates replication: *"Why couldn’t defectors invade this time?"* Contrast with Always Cooperate’s vulnerability. Hammer home: cooperation thrives *only* under repeated interaction + strategy stability + future certainty.  

  **What Will Break and What's Missing**  
  **Break:** Payoff calculation will slow rounds – have a cheat sheet on the board. Mutation draws might feel unfair; emphasize stochasticity. Shadow rounds may confuse – reiterate *during* play.  
  **Missing:**  
  - **No population structure:** Real evolution has spatial/tribal clusters. Your reshuffling is well-mixed.  
  - **Strategy complexity limited:** Cards force simple rules. Can’t simulate neural net-like adaptation.  
  - **Selection pressure artificial:** "Dying" bottom scorers ignores neutral drift/chance extinctions.  
  - **No noise/errors:** Real players miscommunicate. Your setup assumes perfect action execution.  

  **Materials Cheat Sheet**  
  - 32+ blank index cards  
  - Markers (8+)  
  - Poker chips: 20 red, 20 blue, 20 green, 20 white  
  - Pre-written mutation deck (20 cards)  
  - Scoreboard (whiteboard/app)  
  - Timer  

  Run it tight – chaos is the point. Debrief connects the fire to the theory. Good luck!
