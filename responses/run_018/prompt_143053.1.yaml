answer: |-
  The damp Swiss autumn had settled into the valley like a grey woollen blanket, and with it came the familiar, heavy envelope. My fingers traced the embossed federal seal before I even opened it: Reserve Mobilisation Order – Field Exercise, Valais Sector, Duration: Three Weeks. It landed on the kitchen table beside the sleek brochure for the Singapore Fintech Summit – the keynote slot I’d spent two years angling for. The dates overlapped perfectly, a cruel joke from the universe.

  For twenty years, since turning nineteen, the rhythm had been ingrained. Two weeks a year, sometimes three. Packing the olive-green kit bag, the ritual cleaning of the Sig 550 rifle that felt simultaneously alien and intimately familiar in my hands, the train journey south to join my unit. There’s a specific scent to the army-issue wool sweater, damp earth, and gun oil that instantly transports me back to muddy trenches and shared cigarettes under camouflage netting. My colleagues in Zurich, the international set, find it quaint, baffling. *"You still do that? But who are you fighting?"* Their laughter is light, tinged with disbelief. The answer, drilled into us, is simple: no one. Hopefully, no one, ever. That’s the point of the fortress built not just with concrete in the mountains, but with bodies, *our* bodies, in reserve.

  But the brochure gleamed. Singapore was the gateway, the chance to leap from senior analyst to something… more. Global. Lucrative. Missing it wasn’t just a setback; it felt like stepping off a moving train. My hand drifted to the other document clipped to the mobilisation order: the *Ersatzabgabe*. The Exemption Tax. A figure calculated precisely, a significant chunk of my monthly salary, payable directly to the federal coffers. The state, in its pragmatic wisdom, offered this neat escape hatch. Pay, and you’re free. Your civic duty, monetised. The money, the brochure explained dispassionately, funds two things: the smaller, razor-sharp professional corps – the ones who handle the day-to-day security, the cyber defences, the quick reaction forces – *and* it bolsters the social safety net. My payment would simultaneously hire a professional soldier *and* contribute to pensions or healthcare. A clean transaction.

  I thought of Hans, my old bunkmate from the last exercise. A schoolteacher from Bern, fingers stained with chalk, who joked about his rifle being heavier than his gradebook. We’d shared lukewarm coffee from a dented thermos, shivering during a night watch, talking not of war, but of rising rents and the new school curriculum. There was no heroic posturing, just a shared, slightly absurd burden. A vulnerability acknowledged in the pre-dawn chill. That was the unspoken thing, wasn't it? Not the unlikely prospect of invasion, but the *shared vulnerability*. The clerk, the teacher, the banker, the farmer – all schlepping the same pack, sleeping in the same damp bivouacs, subject to the same petty regulations. An enforced equality in discomfort. A ritual reminder that neutrality isn’t a spectator sport; it demands skin in the game. We were, theoretically, co-authors of this fragile peace.

  Paying the tax felt different. It wasn't shirking, exactly. It was legal, sanctioned, even fiscally logical. But it was a conversion. From co-author to… client. I would be purchasing my security, outsourcing my vulnerability to the professionals my tax francs funded, while my contribution to the welfare state became just another line item, detached from the soil and the shared chill. I’d become part of the machine that allows the militia ideal to persist *precisely* because enough people like Hans still show up, making my paid exemption possible. My comfort subsidised by their continued participation in the ritual.

  Standing at the window, watching rain slick the cobbled street below, I saw two young men in crisp, modern combat uniforms – professionals – stride purposefully towards the barracks, gear efficient, movements sharp. Contrasted with the memory of Hans fumbling with his outdated webbing, laughing at his own clumsiness. The professionals were guardians, undoubtedly skilled. But the reservists? We were the embodiment of the *idea*. The walking, occasionally stumbling, argument that defence isn't a service industry.

  The envelope lay open. The tax form, pristine. The Singapore brochure, promising a gleaming future. The weight wasn't just the three weeks or the money. It was the weight of citizenship itself. Did I still believe in the shared vulnerability, the equality of the ritual, even as my world pulled me towards the global, the professional, the efficient? Or would I become a citizen who funds the fortress but no longer stands, however awkwardly, upon its walls? The choice wasn’t just between Singapore and Valais. It was between remaining a flawed, equal participant in the democracy of defence, or becoming its well-heeled, distant patron. The rain kept falling, obscuring the mountains, just as my own certainty blurred.
