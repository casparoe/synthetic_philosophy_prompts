    - The amendment process as a build system or a self-modifying function.
    - The idea of a patch that changes the patcher: exactly like changing the build system or the self-modifying function.

  - **Fudged mappings**:
    - The "invalidity" argument (side 2) doesn't have a direct counterpart because in programming, we don't have a concept of "authority" beyond the current state of the code and the interpreter. We had to map it to the idea of a self-hosting compiler that might break the bootstrap chain, but that's about practicality, not validity.
    - The separation of concerns (compile-time vs runtime) is a bit forced because in Nomic, the rule-change happens in the same temporal frame as the game actions.

  - **No counterpart**:
    - The idea of a "rule of recognition" that exists outside the system. In programming, the interpreter (or hardware) is the fixed base that runs the code. But in Nomic, the rules are the only thing they have. However, the initial rule-set and the initial agreement of the players to play by the rules is like the interpreter. But that initial agreement isn't codified in the rules? It might be the meta-rule that the rules are to be followed until changed. This is analogous to the fixed hardware that runs the program. But in programming, the hardware doesn't change. In Nomic, the initial agreement might be considered immutable? But in the game, even that can be changed? The residue is that the programming model assumes a fixed underlying machine, while in Nomic, there is no fixed machine because the rules can change arbitrarily. But note: the initial rule-set must have been accepted by the players, and that acceptance is the fixed point? That part doesn't map cleanly.

  However, in programming, we can simulate a machine that can change its own instruction set (like in some very low-level emulators). But even then, the underlying emulator is fixed. The residue is the social contract: the players' agreement to play by the rules. That agreement is outside the rule-set and cannot be changed by the rules? But in Nomic, it can? Actually, the rules can change to expel a player or to change the winning condition, so the social contract is part of the rules? This is the part that doesn't map.

  But note: in programming, we have the interpreter which is fixed. In Nomic, there is no fixed interpreter because the rules are the interpreter. So the entire system is self-contained and self-amending. This is like a quine that can modify itself and then run the modified version. The closest programming concept is a **self-interpreter** that can interpret a modified version of its own source.

  Example: a self-interpreter for a language L. The interpreter is written in L. Then, you can give it a new version of the interpreter source (with changes) and it will interpret that. But the change must be written in L and the interpreter must be able to parse and execute it. Similarly, in Nomic, the rule-change must be in the form that the current rule-set can process.

  So the key is: as long as the current rule-set can process the change (including changes to the amendment rules), then it is valid.

  Therefore, the debate in programming terms: 

  - Side 1: The change was processed by the current interpreter, so it's valid.
  - Side 2: If the change alters the interpreter in a way that the new interpreter would not have accepted the change, then the change is invalid. But the programming analogy doesn't support this because the old interpreter did accept it and the new one is just the new state.
  - Side 3: The question is about the frame of reference: at the time of processing, the old interpreter was running. The new interpreter hasn't been run yet.

  Thus, the residue is minimal: the programming concepts cover the mechanics. The debate dissolves because the change is valid if the current system (at the time) processed it correctly. However, the legal-theory debate might be about the legitimacy of the new system, which in programming we don't question because we don't have a higher authority. In Nomic, the players might refuse to play by the new rules, but that's outside the system.

  Conclusion: The programming perspective clarifies that the change is valid if it was applied by the current rules, and the debate about invalidity is a confusion of levels (mixing the old and new rule-sets). The residue is the social aspect: the players must accept the outcome, but that's not a programming issue.
answer: |-
  **Bottom line: The debate maps cleanly to self-hosting compilers and runtime self-modification, revealing that the "invalidity" argument is a category error confusing compile-time and runtime states, with residue only in the social contract of player consensus, which lacks a direct programming analog.**  

  ### Mapping to Programming Concepts  
  1. **Initial rule-set as source code**:  
     - The starting rules are source code (e.g., `rules_v1.c`).  
     - Amendment rules are functions like `apply_patch(patch)`, which modify the source.  

  2. **Amendment process as compilation**:  
     - Proposing/passing a change is like submitting a pull request. Merging it compiles/rules into a new version (e.g., `rules_v2.c`).  
     - **Clean fit**: This mirrors CI/CD pipelines. A successful vote is a CI check passing; merging applies the patch.  

  3. **Self-amending changes as self-hosting compilers**:  
     - A change altering amendment rules is like a compiler compiling its own next version (e.g., `compiler_v1` builds `compiler_v2` from modified source).  
     - **Clean fit**: If `compiler_v1` can parse and output `compiler_v2` (even if `v2` requires unanimity), `v2` is valid—it's an artifact of `v1`'s execution.  
     - **Example**: GCC compiling a GCC update that changes its build flags. The new flags apply only to future compilations.  

  4. **The "invalidity" argument as a compile-time/runtime confusion**:  
     - Side 2 ("invalidates its own basis") claims: If `patch_p` changes `apply_patch()` to require unanimity, but passed via majority, it retroactively invalidates itself.  
     - **Programming view**: This mistakes runtime for compile-time. The patch is applied *by the current rules* (`v1`), producing `v2`. `v2`’s new rules don’t apply retroactively.  
     - **Clean fit**: Like a function modifying its own code during execution. The modification is valid if the *current* function state permits it. Future calls use the new code.  

  5. **The "external authority" argument as bootstrapping**:  
     - Side 2’s appeal to an "outside rule" is like claiming a compiler needs a pre-existing binary.  
     - **Programming view**: Bootstrapping resolves this—`rules_v1` is the initial binary. If it can execute the patch, no external authority is needed.  
     - **Fudged**: Real bootstrapping (e.g., from assembly to C) assumes a fixed hardware spec. Nomic’s "hardware" (player consensus) is mutable.  

  6. **Side 3 ("badly posed") as quine recursion**:  
     - The debate is a quine-like paradox: "This sentence is false" for rules.  
     - **Programming view**: Undecidable questions (e.g., "Can this new compiler compile itself?") are runtime concerns, not validity issues.  
     - **Clean fit**: A quine that modifies its code mid-execution (e.g., a Lisp `eval` loop) doesn’t invalidate itself—it transitions states.  

  ### Residue Report  
  - **Clean mappings (80%)**:  
    - Rule changes ≈ version control commits.  
    - Self-amending amendments ≈ self-hosting compilers.  
    - Amendment validity ≈ successful compilation.  
    - Retroactive invalidity claim ≈ confusing source code with running process.  

  - **Fudged mappings (15%)**:  
    - **Player consensus as "hardware"**: In programming, the CPU/environment is static. In Nomic, player agreement is dynamic and can be amended. We fudged this as "immutable hardware," but it’s not.  
    - **Rule conflicts as race conditions**: A change altering rules mid-vote is like a file being patched while read. We handwave atomic commits.  

  - **No counterpart (5%)**:  
    - **The social contract**: Players must accept the outcome. In programming, the interpreter executes code blindly. Nomic’s "invalidity" argument often masks unwillingness to accept valid changes—a human consensus problem with no `if (player.agree)` equivalent.  
    - **Legitimacy from external standards**: Legal theory’s "rule of recognition" (e.g., constitutional validity) has no parallel. Compilers don’t care if a change "should" be valid—only if it compiles.  

  ### Why the Debate Dissolves in Programming Terms  
  The core disagreement is a **frame-of-reference error**:  
  - **At compile-time (amendment)**: The old rules are the compiler. If they output new rules, the change is valid.  
  - **At runtime (post-amendment)**: The new rules govern future actions. They don’t retroactively judge their creation.  

  Side 2’s "invalidity" claim is like arguing, "`compiler_v2` requires unanimity, so `compiler_v1`’s majority vote was illegal." But `v1` wasn’t using `v2`’s rules—it was running its own. The residue (social consensus) is real but separate: it’s about players tolerating the output, not technical validity. Your framework shows Nomic’s debate is overcomplicating a solved problem: **self-amendment is valid if the current system allows it**.
