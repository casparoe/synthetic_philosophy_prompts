prompt: |-
  I'm a systems programmer—compilers, interpreters, build systems—and I've been reading about a game called Nomic plus some legal-theory talk about self-amending rule systems, and I can't tell whether I'm missing something or the debate is less deep than it sounds. In Nomic you have a rule-set, some of which are rules for changing the rules; a proposal that passes becomes part of the rules. The interesting fights break out when someone uses those rules to pass a change that modifies the change-rules themselves: say, the change repeals the rule that said a passed change takes effect immediately, or it replaces the amendment rule with one that requires unanimity. One side says the change is valid because it followed the only procedure there was at the time; the other says it invalidates its own basis and can only count as valid if there's some rule or standard outside the system giving the amendment power; a third says the question is badly posed. Restate this debate in the vocabulary I actually think in—interpreters, self-hosting compilers, bootstrapping, version control commits, patches that patch the patcher, quines, whatever is the closest fit—as faithfully as you can. Then give me a residue report: which parts map cleanly, which you had to fudge, and which have no counterpart in the programming vocabulary at all. I want to know whether the residue is a sign my framework can't say something the legal/Nomic people can, or whether their disagreement gets clearer (or dissolves) once you put it in my terms. Lead with your bottom line in the first sentence, then the reasoning, with no preamble and no restating the question.
