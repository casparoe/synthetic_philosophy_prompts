  We are mapping the Nomic rule-change debate to programming concepts. The core issue is about the validity of a self-amending change that alters the amendment rules themselves.

  Bottom line: The debate maps cleanly to the concept of a self-modifying program or a compiler that compiles a new version of itself, and the key insight from programming is that the validity of the change is a matter of perspective (compile-time vs. runtime) and depends on the existence of a fixed-point or an invariant in the system, but the programming analogy also reveals that the debate is fundamentally about interpretation and the frame of reference, and the residue is minimal because the programming concepts cover the core mechanics, though the social/interpretive aspects of Nomic are harder to capture.

  Reasoning:

  Mapping the elements:

  1. **The initial rule-set**: This is like the source code of a program, or the initial version of a compiler (say, version 0). It includes the rules for amendment (the "amendment function").

  2. **Proposing and passing a change**: This is like writing a patch (a diff) and applying it to the current codebase. The patch is applied according to the current build/change rules (e.g., by the current compiler or build system).

  3. **A change that modifies the amendment rules**: This is a patch that changes the compiler's own source code, specifically the part that handles how patches are applied (the "patcher" itself). In programming, we see this in:
     - **Self-hosting compilers**: A compiler written in its own language. When you change the compiler's source code, you must recompile the compiler with the old version to produce a new compiler (the new version). The old compiler (version N) is used to compile the new source (version N+1) to produce the new compiler (version N+1).
     - **Quines**: Programs that output their own source code. A change that modifies the amendment rule is analogous to a quine that, when run, produces a new quine with a different self-reproduction mechanism.

  The debate:

  - **Side 1 (valid because it followed the procedure)**: In programming, if we have a build system that applies a patch to the compiler's source code and then uses the current compiler to build the new one, we accept the new compiler as valid because the build process followed the steps. This is the "bootstrapping" process: we trust the old compiler to build the new one. The patch was applied according to the rules at the time of the build.

  - **Side 2 (invalid because it invalidates its own basis)**: This is like a self-hosting compiler that, when compiled by the old compiler, produces a new compiler that cannot compile itself again (or changes the build process in a way that breaks the chain). But note: the old compiler did produce an executable (the new compiler). The argument is that the new compiler's legitimacy depends on the old rules, and if the new rules are different, then the new compiler might not be able to reproduce itself from its own source without the old one. However, in programming we don't usually say the new compiler is invalid; we just note that it requires the old one to build it. The "invalidity" argument doesn't have a direct parallel because in programming the output of the build is just an artifact.

  - **Side 3 (the question is badly posed)**: This might be analogous to the fact that in programming, we separate the time of building (compile-time) from the time of running (runtime). The amendment process happens at "compile-time" (when the rules are changed) and the new rules are in effect at "runtime" (when the game is played). The change is applied by the old system, so it's valid at the time of application. But the new system might have a different behavior going forward.

  However, there is a critical point: what if the change attempts to alter the build process itself in a way that the current build system cannot handle? For example, if the patch changes the build system's own code in a way that the current build system doesn't understand? Then the build fails. In Nomic, if the amendment rule change is written in a way that the current rule-set cannot process, then the change is invalid (it doesn't pass). But if it passes, then the current system did process it.

  The key programming analogy is the **self-hosting compiler**:

  - The old compiler (C0) compiles the new source code (S1) to produce a new compiler (C1). Even if S1 changes the language so that C1 cannot compile S1 (without having C0), we don't say C1 is invalid. We just say it was built by C0.

  Similarly, in Nomic, the change is applied by the old rules, so it is valid by the old rules. The new rules are now in effect, but they were installed by the old rules.

  But what if the change says: "This change is enacted, and from now on, the rule that allowed this change is repealed and replaced by a new rule that requires unanimity."? 

  - At the moment of enactment, the old rules are in effect, so the change is passed by the old rules (say, majority vote). Then, immediately after, the new rule (unanimity) is in place. The change did not violate the old rules because it was passed by majority. The repeal and replacement happen as part of the change.

  This is like a program that, when run, changes its own code for the next run. But note: in Nomic, the rules are changed at the moment of enactment, and then the next proposal will use the new rules.

  Where the analogy gets tricky:

  - In programming, we have a clear separation between the compiler (which is fixed during the build) and the compiled program. In Nomic, the same entity (the rule-set) is both the rule-applier and the rule-set. It's more like a self-modifying program at runtime.

  Let's try runtime self-modification:

  - Imagine a program P0 that has a function `amend_rules()` that can change its own code (like in some self-modifying code in assembly, or in a language that supports `eval` of new code). The function `amend_rules()` is called to apply a patch (a string of code) that replaces `amend_rules()` with a new function that requires unanimity.

  Steps:
  1. P0 is running, and it has a function `amend_rules` that takes a patch and a vote (which passes by majority).
  2. The patch is passed by majority. The patch says: replace `amend_rules` with a new function that requires unanimity.
  3. P0 applies the patch: it overwrites the code of `amend_rules` with the new code.
  4. Now the program becomes P1, which has the new `amend_rules`.

  The application of the patch was done by the old `amend_rules` (majority). The new function is in place. There's no contradiction because the old function did the job and then was replaced.

  But the second argument says: the patch invalidates the basis of its own validity. In programming, we don't have that concept because the old function was run and it did its job. The new function is just different.

  So why the debate? Because in law, there is a concept of a "rule of recognition" (from legal theory) that is the ultimate rule that validates all others. If you change that rule, then by what authority is the change made? The programming analogy doesn't have this meta-level concern because the computer just executes the code step by step. The computer doesn't care about authority.

