       *Awkward commitment*: The hand’s grip adjustment has *original* intentionality, but the same mechanism in a non-prosthetic robot would have only *derived* intentionality—making biology irrelevant despite the binary claim.  
     - **Heuristic fiction**: **Unnamed**.  
       *Awkward commitment*: If the distinction is fictional, asserting that artefacts *can* have original intentionality is empty—original intentionality was never "real" to begin with.  

