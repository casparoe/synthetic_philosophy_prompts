  Below is a decision tree mapping the logical space of positions on original vs. derived intentionality, using the case of a **prosthetic hand with predictive grip adjustment** (responds to the wearer's galvanic skin response without conscious intention). Answer each question based on the case, without relying on jargon. The tree splits as requested, with each leaf naming the view (if recognised) or marked "unnamed," plus one sentence on its most awkward commitment. Empty branches are diagnosed.

  ---

  ### **Decision Tree: Positions on Intentionality**

  #### **1. Is original intentionality an all-or-nothing property (binary) or does it come in degrees (scalar)?**  
     - **Binary** (all-or-nothing) → Go to **2**.  
     - **Scalar** (degrees) → Go to **6**.  

  ---

  #### **2. (Binary) Can any artefact ever possess original intentionality?**  
     - **No** (only biological brains) → Go to **3**.  
     - **Yes** (artefacts can have it) → Go to **7**.  

  ---

  #### **3. (Artefacts cannot have original intentionality) For derived intentionality, must there be a conscious interpreter present at the time, or is it sufficient that there is a design history?**  
     - **Requires conscious interpreter** → Go to **4**.  
     - **Just design history** → Go to **5**.  

  ##### **4. (Requires conscious interpreter)**  
     - **Real distinction**: **Searle-style biological exclusivism**.  
       *Awkward commitment*: The prosthetic hand’s grip adjustment has *no intentionality at all* (not even derived) unless a conscious mind interprets it in real-time, reducing it to a meaningless reflex despite its sophisticated design.  
     - **Heuristic fiction**: **Unnamed**.  
       *Awkward commitment*: Insisting that derived intentionality requires a conscious interpreter while calling the distinction "fictional" risks incoherence, as the interpreter requirement implies a metaphysical fact.  

  ##### **5. (Just design history)**  
     - **Real distinction**: **Unnamed** (e.g., functionalist-leaning).  
       *Awkward commitment*: The hand has derived intentionality via design, but the user’s *unconscious* autonomic response (galvanic skin) must be "interpreted" by the hand’s mechanism—blurting the line between derived and original.  
     - **Heuristic fiction**: **Unnamed**.  
       *Awkward commitment*: Calling the distinction fictional while denying original intentionality to artefacts makes the hand’s "derived" status arbitrary—why privilege biology if intentionality isn’t real?  

  ---

  #### **6. (Scalar) Skip to: For derived intentionality, must there be a conscious interpreter present at the time, or is it sufficient that there is a design history?**  
     - **Requires conscious interpreter** → Go to **8**.  
     - **Just design history** → Go to **9**.  

