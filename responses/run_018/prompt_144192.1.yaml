       *Empty branch?* **Incoherent**: If artefacts *can* have original intentionality, requiring an interpreter for derived undermines the point (original intentionality doesn’t need one).  
     - **Heuristic fiction**: **Unnamed**.  
       *Awkward commitment*: Calling the distinction fictional while claiming artefacts *can* have original intentionality collapses into instrumentalism—why not just say *all* intentionality is derived?  

  ##### **11. (Just design history)**  
