  ### **Key Takeaways from the Prosthetic Hand Case**  
  - **Searle-style views** (Leaf 4): The hand is a "dumb" causal mechanism unless consciously interpreted.  
  - **Dennett-style views** (Leaf 9): The hand’s grip adjustment is intentional only because we *choose* to interpret it that way.  
  - **Unnamed middle grounds** (e.g., Leaf 5): The hand has derived intentionality from design, but its coupling with unconscious physiology challenges where "derived" ends and "original" begins.  

  This tree captures the core fault lines—**biology vs. artefacts**, **consciousness vs. design**, and **metaphysics vs. pragmatics**—using the prosthetic hand to force concrete commitments.
