       *Awkward commitment*: The hand has *low-grade original intentionality* (scalar) but its grip adjustment lacks derived intentionality without an interpreter—forcing ad hoc thresholds for when "degrees" of original intentionality apply to artefacts.  
       *Empty branch?* **Unattractive**: Why ascribe scalar original intentionality to the hand if derived still needs an interpreter? This hybrid is rarely defended.  
     - **Heuristic fiction**: **Unnamed**.  
       *Awkward commitment*: If the distinction is fictional, requiring a conscious interpreter for derived intentionality is redundant—why not treat *all* intentionality as stance-dependent?  

  ##### **9. (Just design history)**  
     - **Real distinction**: **Unnamed** (e.g., embedded cognition).  
       *Awkward commitment*: The hand has *both* scalar original intentionality (as part of extended cognition) *and* derived intentionality from design—overdetermining its grip adjustment without clarifying which does the work.  
       *Empty branch?* **Unexplored**: Few hold that original is scalar/real *and* derived is design-based/real, as they conflict.  
     - **Heuristic fiction**: **Dennett-style interpretive derivation**.  
       *Awkward commitment*: The hand’s grip adjustment is "intentional" only because we *interpret* it as such—denying special status to biological brains and reducing consciousness to a useful illusion.  

  ---

  #### **7. (Binary + Artefacts can have original intentionality) For derived intentionality, must there be a conscious interpreter present at the time, or is it sufficient that there is a design history?**  
     - **Requires conscious interpreter** → Go to **10**.  
     - **Just design history** → Go to **11**.  

