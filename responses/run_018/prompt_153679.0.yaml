prompt: |-
  I just got out of this long, draining argument with my friend Mara about lottocracy — she thinks every local board should be filled by pure lottery, I keep saying that sounds great until you actually have to staff a flood emergency and suddenly random selection feels like a bad joke. Anyway, I’m the selection officer for our regional planning authority (small office, everything hits my desk, I sign off in about 48 hours max) and we adopted this hybrid model last year: a two-stage sortition where citizens are drawn from voter rolls, then they have to pass a reasonableness audit run by an outside mediator. If they fail, they don’t sit on the panel; they go into a dissent escrow pool that can file objections but can’t vote. I need a reusable decision procedre — checklist, flowchart in words, tests in order — that tells me when this hybrid applies, when pure election is safer, and when we should just appoint experts. For each step say what counts as enough answer, where the procedure stops with a hard no, and where it’s actually a values call I’m dressing up as process. I run this reccuring every quarter, so it can’t be one-off advice.

  Apply it to three cases: a regional air-quality panel, a single-block historic preservation dispute, and that emergency flood-wall situation where the lottery pool only has three qualified engeneers and two of them refuse service — include that one even though I know the answer will annoy me. Also be honest about what the procedure just can’t do, and please write the answer in American English with no citations or reading list — I need something I can actually tape to my desk.
reasoning: |-
  Okay, the user is a selection officer for a regional planning authority who just had an argument with a friend about lottocracy. They need a reusable decision procedure—like a checklist or flowchart—to determine when to use their hybrid sortition model, pure elections, or expert appointments. This needs to be applied quarterly to cases like an air-quality panel, a historic preservation dispute, and an emergency flood situation. They want it in plain American English with no citations, something they can tape to their desk. 

  First, I need to unpack their core request. They’re drowning in operational ambiguity and want clarity—a pragmatic tool to replace gut calls with structure. The hybrid model (sortition + reasonableness audit) is already in place, but they need boundaries for when it’s unsafe or inefficient. Underneath that, they’re likely wrestling with legitimacy vs. competence trade-offs: How much democracy can they afford before it risks real-world failures? The flood-wall example hints at trauma—they’ve probably faced backlash for bypassing the lottery in crises. 

  The cases they provided are deliberate stress tests:  
  - **Air-quality panel**: Technical but with high public stakes. Hybrid *might* work, but expertise gaps could be fatal.  
  - **Historic block dispute**: Hyper-local, emotional, but not life-threatening. Pure lottery could backfire if unqualified residents clash.  
  - **Flood emergency**: Their nightmare scenario—procedural purity vs. imminent disaster. They already know experts are non-negotiable here but want validation.  

  For the procedure itself, it must be:  
  1. **Reusable**: Quarterly reviews mean steps can’t be case-specific.  
  2. **Action-oriented**: Clear thresholds (e.g., "if urgency >6 weeks, stop—appoint experts").  
  3. **Transparent about subjectivity**: Flag where "reasonable" masks value judgments (e.g., defining "complexity").  
  4. **Bounded**: Admit where the tool fails (e.g., "Can’t force experts to serve if they refuse").  

  The tone should be stripped of academia—no "furthermore," just blunt directives. Example: Instead of "Consider temporal constraints," say "Is this an emergency? If yes, skip to Step 5."  

  Biggest challenge: Balancing their authority ("I sign off in 48 hours") with humility ("values call dressed as process"). The procedure must empower without pretending objectivity. For instance, Step 2’s "complexity" test will always be subjective, so call that out—it’s not a flaw, it’s honesty.  

  Final note: Their frustration with the flood case is key. The tool must explicitly prioritize lives over process when needed, even if it "annoys" them—that’s the point. Acknowledge that discomfort ("Yes, appointing experts here sucks, but collapse sucks more").
answer: |-
  Here's your reusable decision procedure—**D.R.A.F.T. (Decision Rules for Authority Formation Thresholds)**. Designed for quarterly reviews. Tape-friendly version below:

  ---

  **D.R.A.F.T. PROCEDURE**  
  *(Run these 5 tests in order. Stop at first "hard stop.")*  

  1. **DEADLINE TEST: Is immediate action non-negotiable?**  
     - *Enough answer:* If threat to life/property exists OR legally mandated deadline <72 hours.  
     - **Hard stop:** YES → **Appoint experts.** (Process fails when survival > democracy)  
     - *Values dressing:* "Non-negotiable" = your call, but hurricanes don’t debate.  

  2. **RISK TEST: Could bad decisions kill people or cause irreversible harm?**  
     - *Enough answer:* High technical complexity (engineering, toxicology, structural safety) OR catastrophic failure possible.  
     - **Hard stop:** YES → **Appoint experts.**  
     - *Values dressing:* Defining "irreversible harm" (e.g., extinct species vs. ugly building).  

  3. **AREA TEST: Is impact hyper-local?**  
     - *Enough answer:* Directly affects ≤50 properties OR single neighborhood.  
     - **Hard stop:** YES → **Pure election.** (Neighbors know their backyards best)  
     - *Values dressing:* "Hyper-local" boundary (e.g., 1 block vs. 3 blocks).  

  4. **FEASIBILITY TEST: Can the hybrid model physically work?**  
     - *Enough answer:* Pool has ≥10 qualified citizens *after* audit OR mediation resources available.  
     - **Hard stop:** NO → **Appoint experts** (if Step 1-2 triggered) OR **pure election** (if Step 3 passed).  
     - *Values dressing:* "Qualified" = audit clears them, not actual skill.  

  5. **TRUST TEST: Is public buy-in critical?**  
     - *Enough answer:* High controversy OR historical distrust of officials.  
     - **Final default:** YES → **Hybrid model.** NO → **Pure election.**  

  ---

  **APPLIED TO YOUR CASES:**  
  *(Using D.R.A.F.T. step-by-step)*  

  1. **Regional Air-Quality Panel**  
     - Step 1: No immediate deadline → Continue.  
     - Step 2: **YES** (Toxic exposure risks, complex chemistry) → **HARD STOP: APPOINT EXPERTS.**  
     *Why:* Laypeople can’t parse ppm of benzene. Values call: Downplaying health risks to enable participation is unethical.  

  2. **Single-Block Historic Preservation Dispute**  
     - Step 1: No emergency → Continue.  
     - Step 2: No life-threatening risk → Continue.  
     - Step 3: **YES** (One block = hyper-local) → **HARD STOP: PURE ELECTION.**  
     *Why:* Let residents fight about brick facades democratically. Values call: "Historic" is subjective, but democracy handles that.  

  3. **Flood-Wall Emergency (3 engineers, 2 refuse)**  
     - Step 1: **YES** (Imminent flooding) → **HARD STOP: APPOINT EXPERTS.**  
     *Why:* Even with only one willing engineer—**take them**. Hybrid fails catastrophically here. *Yes, this annoys you. Tape this note to your desk: "When the river rises, sortition drowns."*  

  ---

  **WHAT D.R.A.F.T. CAN'T DO:**  
  - ✗ **Create experts** where none exist (if all refuse, you’re the backup plan).  
  - ✗ **Force fairness** in audits (your "reasonableness" mediator might be biased).  
  - ✗ **Fix refusal rates** (if citizens boycott, elections > lottery).  
  - ✗ **Override cowardice** (if you ignore a "hard stop" to avoid heat).  

  ---

  **DESK-TAPE VERSION:**  
  > **D.R.A.F.T. QUARTERLY CHEAT SHEET**  
  > 1. **DEADLINE:** Emergency? → **APPOINT EXPERTS**  
  > 2. **RISK:** People could die? → **APPOINT EXPERTS**  
  > 3. **AREA:** One neighborhood? → **PURE ELECTION**  
  > 4. **FEASIBILITY:** ≥10 people in pool? NO? → **ELECT or APPOINT**  
  > 5. **TRUST:** Big fight brewing? → **HYBRID MODEL**  
  >   
  > *FLOOD RULE: When water’s coming, pull the expert lever. Every damn time.*  

  Run this quarterly before your coffee. Adjust thresholds based on last quarter’s pain—but never ignore a hard stop. You’re the failsafe.
