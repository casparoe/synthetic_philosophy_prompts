prompt: |-
  I'm giving a job-market talk next thursday in the moral psych / phil of action joint seminar. The room will be mostly virtue ethicists and practical-reason people, plus two Kantian constructivists who think idealization is just autonomy done right, and one decision-theorist who thinks indirect normativity is just expected utility with extra steps. I'm defending the claim that indirect normativity survives only if we restrict idealized deliberation to first-order preferences — but if we allow second-order closure, meaning the agent can revise her own rational capacities inside the idealization, then the direct/indirect distinction collapses since the ideal agent can always run the indirect evaluation herself. So indirect norms are either redundant or they hang on an arbitrary cutoff in the model. Draft my Q&A prep sheet: the eight or so objections I'll actually get from this crowd, not the ones I'd hear from decision theorists online, ordered by how much damage they'd do, each phrased the way a virtue ethicist or Kantian would actually put it, with a two-minute reply and a note on where my reply is soft. Tell me what I should concede up front — probably something about the phenomenology of moral growth? — and include the one question I'm praying nobody asks, which is probably whether this collapses into a static-self picture that virtue ethics was meant to avoid. Keep it grounded; I can't search the web during the talk.
