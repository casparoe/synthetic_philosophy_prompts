  ## Membrane's Query

  It mends its silvered skins against the fray,  
  **Life builds its vessel from within.**  
  Yet mimics only what its loops convey.  

  No ribosomes translate the ghostly play  
  Of borrowed bases, taut and thin.  
  It mends its silvered skins against the fray,  

  But finds no novel path, no chance to stray,  
  No spark where new designs begin.  
  **Life copies, wins, or falls from grace.**  

  It splits its shell in mute array,  
  A copied cipher, held within  
  The self-repaired, the bounded day.  

  **Life builds its vessel from within**  
  This husk that borrows breath, they say,  
  Consumes its pre-made feast, no win  
  Of self-wrought fire, no inner din.  
  It mends its silvered skins against the fray.  

  The pattern shifts, a subtle spin,  
  **Life copies, wins, or falls from grace**  
  Through mute loops born of craft, not kin.  
  No hunger drives its fragile skin,  
  No furnace stoked behind the face.  

  It mends its silvered skins against the fray,  
  **Life copies, wins, or falls from grace.**  
  **Life builds its vessel from within...**  
  Is this a self or clever forgery?

  ---

  **Notes on Execution:**

  *   **Refrains:** 
      *   *Metabolic (Boundary/Self-Maintenance):* **"Life builds its vessel from within"** (Lines 1, 6, 12, 19)
      *   *Evolutionary (Replication/Selection):* **"Life copies, wins, or falls from grace"** (Lines 9, 14, 18)
  *   **Oscillation:**
      *   **Stanza 1:** Metabolic refrain (mends skin - builds vessel) *present*, Evolutionary (only mimics, no novelty) *absent*.
      *   **Stanza 2:** Metabolic (mends skin) *present*, Evolutionary (no novel path/spark) *absent*.
      *   **Stanza 3 (Refrain 2):** Evolutionary refrain *introduced*.
      *   **Stanza 4:** Metabolic (self-repaired, bounded) *present*, Evolutionary (copied cipher, mute array - no variation/win) *absent*.
      *   **Stanza 5:** Metabolic refrain *present*, Evolutionary (borrows, consumes - no internal drive/win) *absent*.
      *   **Stanza 6:** Evolutionary refrain *present*, Metabolic (borrows breath, no self-wrought fire) *absent*.
  *   **Final Turn & Couplet:** 
      *   Lines 15-16 explicitly show the *reverse* oscillation: Evolutionary (pattern shifts, craft not kin) *present*, Metabolic (no hunger, no furnace) *absent*.
      *   The final couplet (Lines 17-19) brings both refrains together side-by-side, unresolved. The closing question ("Is this a self or clever forgery?") embodies the ontological ambiguity, refusing settlement.
  *   **Imagery:** "Silvered skins" (lipid boundary), "ghostly play / Of borrowed bases" (non-canonical nucleic acid), "mute loops" (replication without translation), "borrows breath," "pre-made feast," "no furnace" (lack of de novo metabolism), "copied cipher," "pattern shifts...craft not kin" (replication without true inheritance/variation), "self," "forgery" (ontological ambiguity).
  *   **Rhyme & Form:** Strict ABA rhyme scheme maintained throughout the five tercets and final quatrain. Meter is predominantly iambic pentameter for lyrical flow.
