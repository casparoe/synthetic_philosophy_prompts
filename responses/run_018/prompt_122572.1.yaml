answer: |-
  ### Restating Iterated Strict Dominance in Your Vocabulary
  **Core Concepts Translated:**
  1. **Strict Dominance (Pure/Mixed):**  
     - A policy's action `a_i` (pure strategy) is **strictly dominated** if there exists a stochastic policy (mixed strategy) over the current action support such that, for every possible joint policy (opponent action profile) in the population, the expected return of the stochastic policy is **strictly higher** than playing `a_i`.  
     - *Translation fidelity:* High. The "stochastic policy" is a direct analog of a mixed strategy. However, it's **manually constructed** for dominance checks—not learned via RL, not temperature-controlled, and not entropy-regularized. It's a mathematical tool, not a trained policy.

  2. **Iterative Deletion Process:**  
     - **Step 1:** Start with all agents having full action supports (all possible actions).  
     - **Step 2:** For each agent, identify actions strictly dominated by *any* stochastic policy over their *current* support. Remove all such actions simultaneously.  
     - **Step 3:** Repeat Step 2 until no actions can be removed.  
     - *Epistemic assumption:* Common knowledge of rationality. Agents never play dominated actions, and all agents know this, know that others know, etc.  

  3. **NashConv Connection:**  
     - The surviving action set minimizes "regret against best responses" (NashConv) under common knowledge of rationality. Unexploitability is guaranteed only if the game reduces to a unique Nash equilibrium (rare).  

  **As a Training Pipeline Step:**  
  ```python
  def iterative_strict_dominance(game):
      # Initialize: All actions available
      supports = {player: full_action_set for player in players}

      changed = True
      while changed:
          changed = False
          removals = {player: [] for player in players}

          # Check dominance per player
          for player in players:
              for action in supports[player]:
                  # Solve LP: Is there a stochastic policy over current support \ {action} 
                  # that strictly dominates `action` vs. all opponent joint actions?
                  if is_strictly_dominated(game, player, action, supports):
                      removals[player].append(action)
                      changed = True

          # Remove dominated actions simultaneously
          for player in players:
              supports[player] = [a for a in supports[player] if a not in removals[player]]

      return supports  # Pruned action supports
  ```

  ---

  ### Residue Report: What Translates, What Doesn’t
  | **Concept**                  | **Translation Fidelity**                                                                 | **Notes**                                                                                               |
  |------------------------------|------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------|
  | **Stochastic Policies**      | High (direct analog)                                                                     | But it’s **not learned**—it’s a hand-crafted distribution for dominance checks. No temperature, no gradients. |
  | **Action Supports**          | High                                                                                     | Your agents already use these during training.                                                          |
  | **Best Response/Exploitability** | Partial                                                                              | Dominance relates to per-action exploitability, but **not population-level** (e.g., NashConv).          |
  | **Entropy Regularisation**   | None                                                                                     | Dominance ignores exploration; it’s about deterministic rationality.                                    |
  | **Self-Play/League**         | Conflicting                                                                              | Deleting actions assumes **static opponents**; leagues evolve policies, breaking epistemic assumptions. |
  | **Partial Observability**    | None                                                                                     | Dominance requires full knowledge of payoffs for all joint actions.                                     |
  | **Off-Policy Updates**       | None                                                                                     | Dominance is a pre-processing step; no learning involved.                                               |

  **Key Fudges:**  
  - **Mixed Strategies = Stochastic Policies?** Yes, but **not learned**. It’s a feasibility check via linear programming (LP). You’re not training this policy; you’re brute-forcing existence.  
  - **Epistemic Assumptions:** Common knowledge of rationality has **no RL counterpart**. Your agents explore and make mistakes; game theory assumes perfect rationality.  

  ---

  ### The Support Problem: Is It Real?
  **Yes, it’s genuine—but irrelevant.**  
  - **The Issue:** A mixed strategy dominating action `a_i` in round `t` may rely on action `b_j`, which is deleted in round `t+1`. If deletion order mattered, the final support could be ambiguous.  
  - **Reality:** Order **does not matter** for the final set. Iterated strict dominance is **order-independent** because:  
    - All dominated actions are removed **simultaneously** each round.  
    - Dominance is checked against the **current surviving support**. If a dominator uses `b_j`, `b_j` survives until the round where it’s removed (so `a_i` is still validly dominated when deleted).  
  - **Proof Sketch:** If `a_i` is dominated in the original game, it remains dominated until removed, regardless of order. The surviving set is unique [[1](https://www.jstor.org/stable/2951490)].  

  **Impact on Pruning Value:**  
  - Minimal. Pruning is still worth doing:  
    - **Pros:** Reduces action space, removes "dumb" actions no rational agent would play.  
    - **Cons:** Computationally heavy (solving LPs per action per round), and **only safe if agents are perfectly rational** (untrue in RL).  
  - **When to Use:** Only in small games with known payoffs. Useless in partially observable or large games.  

  ---

  ### Which Framework Is Poorer?
  **Game theory is poorer for your use case.**  
  - **Why:**  
    1. **Assumptions Break RL Realities:**  
       - Common knowledge of rationality? Your agents explore, make mistakes, and train against suboptimal league policies.  
       - Full observability? Your game is partially observable.  
       - Static payoffs? Your payoff structure evolves as policies train.  
    2. **No Exploration or Adaptation:**  
       - Pruning assumes agents never *try* dominated actions. RL agents *must* explore them to verify they’re bad.  
       - Self-play leagues **invalidate** the epistemic assumptions—frozen checkpoints aren’t rational best responses.  
    3. **Scalability and Partial Observability:**  
       - Dominance requires a full payoff matrix. In RL, you estimate payoffs via sampling, which is noisy and incomplete.  
       - Partially observable games transform into massive normal forms (impractical to compute).  

  **Conclusion:**  
  - Use iterated dominance only for **toy problems** with known payoffs.  
  - In real multi-agent RL, **avoid pruning**. Let entropy regularization, exploration, and league training naturally suppress dominated actions. If an action is truly bad, your agents will learn to ignore it.  
  - The "support problem" is a non-issue, but game-theoretic pruning is a square peg for your round-hole RL pipeline.  

  **Bottom Line:**  
  > Game theory gives clean guarantees under idealized assumptions. Your work lives in the messy reality of RL. Pruning dominated actions is theoretically sound but pragmatically weak for your needs. Focus on minimizing NashConv via self-play—it’s messier but aligns with your goals.
