  Definitions:

  1. **Strict Dominance (with pure dominators):** An action (pure strategy) `a_i` of player `i` is strictly dominated by another pure action `b_i` if for every joint action of the opponents (all players except `i`), the payoff for `i` from playing `b_i` is strictly greater than from playing `a_i`.

  2. **Strict Dominance (with mixed dominators):** An action `a_i` of player `i` is strictly dominated by a mixed strategy `σ_i` (a probability distribution over the actions of player `i`) if for every joint action of the opponents, the expected payoff from playing `σ_i` is strictly greater than the payoff from playing `a_i`.

