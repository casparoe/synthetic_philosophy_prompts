answer: |-
  Here’s your tactical Q&A prep sheet, ordered by likelihood/impact and tailored to each audience segment. Focus on **defending the asymmetry’s coherence and policy viability** without getting bogged down in abstract metaphysics.

  ---

  ### **Tier 1: High Likelihood, High Damage (Economists)**
  **Objection (Ramsey Consistency):**  
  *"If you set ρ=0 within lives but allow ρ>0 across generations in the Ramsey equation, you violate time consistency. A project approved today for its intergenerational benefits might be rejected tomorrow when costs fall within a single generation. Doesn’t this make long-term planning incoherent?"*  

  - **Concede:** Temporal consistency is *formally* broken, but this reflects a *real moral discontinuity*.  
  - **Hold:** The discontinuity arises from fundamentally different moral relations (intra-agent vs. inter-agent).  
  - **Weakest Point:** Risk of dynamically inconsistent policies.  
  - **Concise Reply:**  
    >"Time consistency assumes stable evaluative standards across time. But the shift from *intrapersonal* to *interpersonal* evaluation *is* the discontinuity. We accept similar breaks in other domains—e.g., discounting across sovereign borders. Policy coherence comes from committing *now* to intergenerational ρ>0, just as we commit to treating future generations as distinct moral patients."  

  **Likely Follow-up:**  
  *"How do you avoid arbitrary project reversals when costs/benefits cross generational boundaries mid-project?"*  
  **→ Defend:** "Use generational accounting (e.g., allocate costs/benefits by cohort lifecycles). Treat boundary-crossing projects as transfers between groups, not within a single NPV frame."  

  ---

  ### **Tier 2: High Likelihood, High Damage (Philosophers)**
  **Objection (Spatial Analogy):**  
  *"Parfit rejects discounting for 'mere location in time.' If spatial distance doesn’t justify discounting between contemporaneous strangers, why does temporal distance justify it between non-overlapping generations? Isn’t this temporal chauvinism?"*  

  - **Concede:** Spatial and temporal separation *are* disanalogous in moral mathematics.  
  - **Hold:** Time uniquely breaks the relational ties that ground duties of diachronic unity (narrative, anticipation, care).  
  - **Weakest Point:** Risk of "arbitrary metaphysics" accusations.  
  - **Concise Reply:**  
    >"Spatially distant strangers *can* interact reciprocally, share institutions, or owe duties of rescue *now*. Non-overlapping generations share *none* of these. The asymmetry isn’t about time per se, but the dissolution of the agent-relative relations that make *intrapersonal* discounting irrational. No such relations exist intergenerationally—only distributive fairness applies."  

  **Likely Follow-up:**  
  *"But don’t future people belong to a 'temporal community' with us? Doesn’t climate harm violate a duty of non-maleficence?"*  
  **→ Defend:** "Duty of non-maleficence? Absolutely. But that’s *distributive justice* (avoid harming their welfare), not *diachronic obligation* (analogous to my duty to my future self). The latter requires psychological connectedness we lack."  

  ---

  ### **Tier 3: Critical Policy Vulnerability (Treasury Analysts)**
  **Objection (Operational Cutoff):**  
  *"You need a clear generational boundary to apply ρ>0. But generations overlap. If I save for my grandchild’s education (due in 25 years), is that intra- or inter-generational? Give me a non-arbitrary rule for cost-benefit analysis."*  

  - **Concede:** Boundaries are fuzzy; perfect bright lines don’t exist.  
  - **Hold:** The *theoretical distinction* (non-overlapping vs. overlapping) is robust; policy needs a *pragmatic threshold*.  
  - **Weakest Point:** Risk of arbitrariness undermining the asymmetry.  
  - **Concise Reply:**  
    >"Use cohort lifespan plus a buffer (e.g., 90–100 years). Benefits beyond that horizon apply ρ>0. Why? By then, today’s decision-makers, their children, *and* their anticipatory concerns are extinct. This matches legal 'rule against perpetuities' logic. For grandchild savings? That’s *intragenerational* if you’ll live to see it—ρ=0 applies."  

  **Likely Follow-up:**  
  *"Won’t this create perverse incentives to delay action until costs fall just outside the cutoff?"*  
  **→ Defend:** "No—delaying *increases* climate damage, raising costs for *all* cohorts. This isn’t a loophole; it’s a constraint on exploiting future strangers."  

  ---

  ### **The "Dreaded Question" (Policy Analysts)**  
  **Objection (Deathbed Savings):**  
  *"Suppose I’m 99, saving for a 105-year-old’s care. By your cutoff, this is intergenerational (ρ>0). But we’re both alive now! How is this different from my 30-year-old self saving for my 70-year-old self? If you concede ρ=0 here, doesn’t your whole boundary collapse?"*  

  - **Why It’s Dangerous:** Forces you to choose between arbitrariness or abandoning asymmetry.  
  - **Survival Tactics:**  
    1. **Concede the edge case:** "This is a limit case of overlap—but vanishingly rare in climate policy."  
    2. **Hold the core:** "The *principled distinction* remains: no narrative continuity or anticipatory concern binds you to a stranger, even a contemporary. Your duty is distributive."  
    3. **Reframe:** "In practice, apply ρ=0 if *any* overlap exists. But for climate, 99.9% of impacts beyond 2100 involve *no* living contemporaries today. Don’t let edge cases veto a framework for epochal decisions."  

  ---

  ### **Summary Defense Strategy**
  - **For Economists:** Emphasize that Ramsey still works—you’re just rejecting ρ≠0 *within lives*. Boundary issues are tractable with cohort accounting.  
  - **For Philosophers:** Stress the *relational* difference (agent-relative vs. agent-neutral duties), not time itself. Parfit’s objection applies *only* intra-life.  
  - **For Policy:** Offer the 90–100 yr cutoff as a workable standard. Portray it as a *justification for lower discount rates* (vs. Nordhaus) without Stern’s "total sacrifice" demands.  

  **Final Tip:** If pressed on metaphysics, pivot to policy: *"However you ground it, this asymmetry lets us reject both 'discount the future to zero' and 'bankrupt the present' extremes. That’s why Treasury should care."*  

  Good luck—your inversion of Stern-Nordhaus is bold. Stick to the asymmetry’s *practical* payoff: it permits modest intergenerational discounting without abandoning the young or future strangers.
