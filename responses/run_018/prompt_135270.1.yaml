answer: |-
  Here’s the thought experiment:  
  A patient with chronic epilepsy has an experimental implant disrupting **specific thalamocortical feedback to the posterior hot zone (PHZ)** during focal seizures. When a heat stimulus is applied to their hand, they can accurately report "pain is at 7/10 intensity on my left hand" and avoid touching hot objects, yet insist they feel *nothing unpleasant*—no hurt, distress, or raw sensation. Brain monitoring shows fronto-parietal "broadcasting" (e.g., prefrontal activation, working memory engagement) is fully intact.  

  **GWT’s take:**  
  Consciousness *is* global broadcasting. The stimulus is accessed by executive systems (attention, memory, decision-making), making it reportable and actionable—so it’s "conscious" by GWT’s definition. The disrupted PHZ feedback blocks only non-functional "phenomenal flavor."  

  **Phenomenal advocate’s rebuttal:**  
  "Real" consciousness requires subjective *experience* (qualia). The patient’s cold, detached reporting is just **cognitive access without sentience**—like a zombie reading a pain sensor. Zero hurt = zero consciousness of pain, regardless of behavioral accuracy.  

  **What’s carrying the weight?**  
  The **disrupted thalamocortical loop to PHZ** is doing all the work. GWT treats PHZ as just another processor, but this loop’s integrity is likely *essential* for transforming sensory data into felt experience. The advocate argues broadcasting without PHZ integration creates hollow cognition.  

  **What breaks if you restore feedback?**  
  Restoring thalamocortical feedback to PHZ would instantly collapse the dissociation: the patient would exclaim, "*Now* it hurts!"—proving the loop generates phenomenality. Broadcasting alone couldn’t produce this shift, undermining GWT’s claim that access *is* consciousness.  

  **In a nutshell:** The case hinges on whether consciousness *requires* PHZ integration (for phenomenality) or is *only* broadcasting (for access). Restoring feedback forces a choice: either admit phenomenality is extra, or concede it’s foundational.
