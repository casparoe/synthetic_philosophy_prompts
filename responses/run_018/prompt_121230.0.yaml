prompt: |-
  Hey, I need a drafting job rather than a survey — so please don't hand me a bibliography or citations; everything you need is in this message and I know the background.

  Setup, so we're using the same words for the same things. Thomson's lamp: a lamp with a toggle switch, off at t=0, flipped at t=1/2, flipped again at t=3/4, then at t=7/8, and so on, so infinitely many flips before t=1. Question: is it on or off at t=1? Two camps have been going at each other about this for decades. Camp A (Thomson's side — call them the completion skeptics) says the classic bit of reasoning is a genuine contradiction: the lamp can't be on at t=1, because every time it's switched on there's a later switching-off; it can't be off, because every time it's switched off there's a later switching-on; and there's no third state to fall back on. So what's broken is the idea that anyone could complete an infinite sequence of acts, and the whole supertask idealization is rotten. Camp B (the underdetermination people, roughly Benacerraf's side) says the reasoning only shows that the description doesn't settle the answer: add a rule — at t=1 it's on; or the state has to vary continuously through the limit; whatever — and you get a perfectly consistent story. So the lesson is about the incompleteness of descriptions, not about impossibility.

  What I want from you is the joint statement these two could actually sign after a good-faith adverserial collaboration. Concretely:

  1. A numbered section of claims both sides accept, including the ones that took real work to get to. I'd guess they can agree to bracket the mundane stuff — switch fatigue, signal speeds, whether anyone could build the thing — and that the fight isn't really about lab physics but about what a coherent idealization is allowed to look like. But find the substantive ones too, including any that are surprising.

  2. A disagreements table: one column for the completion skeptics' own formulation, one for the underdetermination people's, each phrased so that side would sign their own cell. So no "the skeptic denies that...", no "Camp B merely claims the description is incomplete." If a disagreement is sharpest as a claim about what follows from what, phrase it that way.

  3. Cruxes — the sub-questions such that settling one would move at least one side. Here's the list I suspect; argue with it if you think I've got it wrong or something bigger is missing:
     - whether the state of a system at a time has to be determined by its history (some kind of no-brute-transition principle), and whether that's a metaphysical requirement or a modeling preference Camp B is free to drop;
     - whether the verdict should depend on what states the lamp can be in. If the lamp were dimmable, so that flickering or half-on counted as admissible states, the flip-flopping sequence would have something to converge to. Does the puzzle then turn on a choice of state space — and if so, is that part of the dispute verbal?
     - the convergent contrast: a bouncing ball whose bounce heights shrink geometrically completes infinitely many bounces before a finite time and looks benign, but the direction of motion keeps flip-flopping forever, just like the lamp's on/off. Is the ball benign in a way the lamp isn't, and does the answer to that carry the whole debate or is it a side issue?
     - the time-reversed lamp: flip times at 1/2, 1/4, 1/8 and so on, accumulating at t=0, with everything after that perfectly determinate. Thomson-style reasoning seems to have nothing to bite on here — so is the skeptic's real complaint about completing an infinite task, or about there being a limit instant at all?
     - the computational version: idealized machines that run infinitely many steps and then read off a limit state (say, each cell's value set to the limsup of its earlier values). Does the lamp worry show this is illegitimate, or does the limit rule dissolve the worry — and if it dissolves it, have you given up the right to call the output the result of the computation?

  For each crux: the case, argument or consideration both sides would accept as bearing on it, plus each side's prediction about how it'll go, written down in advance so neither can reconsture afterwards.

  4. Finally, say plainly which parts of the fight you think are only about words, which are load-bearing, and — for each camp — what would actually make them give up. Neither camp should be a strawman: make Camp A's case as strong as you can, and Camp B's too. And stay in the weeds — I want formulations I can argue with, not "the debate is subtle and both sides have intuitions."
