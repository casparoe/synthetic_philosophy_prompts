  The user might also need reassurance that rejecting premise (1) doesn't mean abandoning principles—it means refining them with concepts like coercion-as-background-conditions. They'd likely appreciate concrete distinctions: e.g., "Rent control preserves housing access; kidney markets exploit bodily vulnerability."  

