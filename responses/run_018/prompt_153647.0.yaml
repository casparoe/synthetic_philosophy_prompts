l perception from perfect hallucination, with the disjunctivist predicting that this limitation reveals only epistemic opacity about metaphysical kind and the representationalist predicting that it demonstrates the explanatory priority of internal representational structure. Conclude by assessing whether any part of the dispute is merely verbal—for instance, whether disagreement over whether hallucination possesses “content” depends on stipulative definitions rather than substantive ontology—and specify exactly which part, with reasons. The statement should avoid bibliographies, reading lists, citation requests, and dependence on obscure texts; formulate every position with philosophical precision, avoid straw-man characterizations, and ensure that each column represents wording its proponents could sign.
