answer: |-
  **Bottom line:** Gradational approaches relocate but do not eliminate arbitrariness into aggregation rules, yet they can resist implausible collapse by appealing to the *biological embedding* of capacities within a self-sustaining system oriented towards avoiding harm for its own sake.

  **Explanation:**

  The central issue is whether a purely structural/functional gradient of capacities (like feedback loops) inevitably forces granting some status to simple artifacts, dissolving morally relevant boundaries. Gradational accounts *do* relocate arbitrariness: determining which capacities matter and how to weight/aggregate them (e.g., nociception vs. predictive modeling) lacks a non-arbitrary foundation.

  However, defenders resist the thermostat collapse by arguing that morally relevant sentience isn't *just* about abstract structural similarity. They emphasize:

  1.  **Biological Embodiment & Teleology:** Minimal sentience involves nociceptive signals embedded within a *living organism's* self-sustaining processes, intrinsically oriented towards survival and avoidance of damage *for the organism itself*. A thermostat's regulation serves an external purpose (human comfort), lacks intrinsic goals, and isn't embedded in a biological whole with welfare interests.
  2.  **Cluster Concepts:** Moral status depends on a cluster of interlinked capacities emerging in biological systems (e.g., nociception integrated with basic learning/motivation). While each capacity exists on a spectrum, the morally significant *cluster* has a threshold-like emergence point absent in thermostats. Aggregation rules prioritize capacities contributing to this biologically grounded sentient welfare.

  This avoids reintroducing a sharp "consciousness" threshold. Instead, it draws a boundary based on the presence of biologically embedded capacities that generate a subject of experience with rudimentary interests, excluding systems lacking this intrinsic teleology. The arbitrariness lies in defining the *sufficient cluster*, not in a binary conscious/non-conscious switch.
