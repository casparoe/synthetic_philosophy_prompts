  I'm currently taking a course on philosophy of mind, and a recent discussion with my study group has left me unsettled about gradational accounts of moral status. We were comparing organisms that exhibit minimal nociception without substantial cortical integration—certain insects—to artificial systems that maintain homeostatic equilibrium through feedback loops but lack any internal representation, such as a thermostat. Please explain the central conceptual issue here: does treating sentience and moral considerability as genuinely continuous dissolve the boundary problem, or does it merely relocate the arbitrariness into an aggregation rule that assigns differential weights to capacities like nociception, predictive modeling, and self-representation? In particular, address the challenge that a thermostat's regulatory loop might be structurally analogous to the primitive homeostatic processes underlying minimal sentience, which threatens to collapse the gradient into an implausible continuum where nearly all feedback systems qualify for some nonzero moral status. Then explain how a defender of gradations can resist this collapse without covertly reintroducing a binary "conscious or not" threshold. Please begin with your bottom line in a single sentence, and keep the entire response under 300 words.
