prompt: |-
  I've got a one-year fellowship application due and need a two-page proposal that doesn't sound like every other hinge-epistemology paper. My half-baked idea came from arguing with my roommate about whether Wittgenstein's hinges in On Certainty are strictly personal—like, "the earth exists" is my hinge, but can a whole research collective have a hinge that none of them individually hold? I'm thinking about scientific labs where everyone assumes a particular calibration standard is correct, not because anyone tested it recently, but because without it the measurements don't mean anything. That feels hinge-like, but the literature mostly treats it as individual belief, or just sociology of science.

  I want the proposal to ask: do collective hinges have a different epistemic structure than individual ones, specifically regarding how they can be rationally revised? The existing answers leave this open because hinge epistemology—following Wittgenstein's On Certainty—focuses on the individual subject's relation to doubt, and even the social-epistemology extensions tend to treat groups as aggregates rather than having genuinely shared background commitments. My approach would be to construct a framework for "institutional hinges"—propositions that function as standing-fast conditions for a collaborative practice but aren't reducible to any member's private belief—and then test whether revision can happen through what I'd call distributed anomaly: patterns of misfit that no single researcher notices but that should rationally undermine the shared background. I need the proposal to include a precise statement of the question, why the current individual-focused treatments miss it, a month-by-month method for the year, what a positive result would look like versus what counts as failure (e.g., if institutional hinges collapse into summed individual beliefs, or if distributed anomaly can't be distinguished from ordinary peer disagreement), and a realistic scope. I'm also confussed about whether this counts as hinge epistemology or just sociology of science, so maybe address that boundary in the framing.

  Please write this up as a formal proposal outline—question, gap, method, failure conditions, timeline—without bothering with a bibliography since I'll add citations myself. Keep it somewhat casual since I'm pasting this into my draft document, and don't use direct quotes from Wittgenstein since I can't verify the exact wording right now.
