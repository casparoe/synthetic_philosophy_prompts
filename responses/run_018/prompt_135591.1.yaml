answer: |-
  ### 1. The Mapping  
  **Players:** Semmelweis (subordinate, Hungarian junior physician) vs. Senior Vienna doctors (established, high-status faculty).  
  **Evidence:** Semmelweis presented *statistical data* (maternal mortality dropped from ~18% to ~2% when doctors washed hands with chlorinated lime). Crucially, he had no *mechanistic explanation* — germ theory didn’t exist.  

  - **Testimonial Injustice (TI):** Fits cleanly. Semmelweis suffered a credibility deficit *because* of his identity (young, Hungarian outsider). His evidence was dismissed as implausible or incompetent due to prejudice against his social rank and nationality. The harm: his testimony wasn’t given due weight, delaying life-saving practices.  
  - **Hermeneutical Injustice (HI):** Fits poorly. HI requires a *socially generated gap* in collective understanding that silences marginalized groups. Here, the gap wasn’t social but *scientific*: germ theory hadn’t been conceived. The doctors weren’t ignoring a shared concept; they lacked the conceptual tools to interpret his data. Semmelweis himself couldn’t articulate *why* it worked — it was a puzzle, not an injustice.  

  ### 2. Where the Theory Fits and Slips  
  **Fits:** TI is evident. The dismissal wasn’t solely rational skepticism; prejudice amplified resistance. Fricker’s "identity-prejudicial credibility deficit" applies: his data *should* have warranted trials, but bias blocked uptake. The harm (preventable deaths) stems directly from this credibility discounting.  

  **Slips:**  
  - **Hermeneutical Gap?** Not HI. The doctors’ failure wasn’t due to a *hermeneutical marginalization* of Semmelweis’s social group. Miasma theory wasn’t a tool of oppression; it was the scientific orthodoxy *everyone* (including Semmelweis) lacked alternatives to. This is pre-paradigmatic ignorance, not hermeneutical injustice.  
  - **Moral Wrong vs. Rational Error?** Fricker ties TI to culpable prejudice (e.g., sexism/racism). Here, bias against Hungarians/juniors was real, but their resistance was *also* scientifically rational absent germ theory. Rejecting an unexplained correlation isn’t inherently immoral — but *dismissing it without investigation due to prejudice* is. The harm is the *avoidable epistemic negligence* fueled by bias.  

  ### 3. The Credibility-Excess Problem  
  The professors’ institutional authority granted them unearned **credibility excess** — their status made their skepticism unquestionable. Fricker’s framework *implies* this (credibility is relative), but she focuses primarily on deficits, not excess. This asymmetry is a gap: unchecked credibility excess lets dominant groups entrench false beliefs and suppress challenges. Here, the professors’ authority wasn’t just an absence of TI; it actively weaponized their orthodoxy. It doesn’t *break* Fricker’s model but reveals its blind spot: epistemic injustice in systems requires analyzing *both* deficit (marginalized voices) and excess (entrenched authority).  

  ### 4. Bottom Line  
  Semmelweis is a **sharp case study for testimonial injustice** — identity-based credibility deficit caused measurable harm. But it **exposes limits**:  
  - It’s **not hermeneutical injustice** — the gap was scientific, not social.  
  - The **credibility excess** of elites highlights a need to expand Fricker’s focus beyond deficits.  
  - The **moral wrong** lies in prejudicial dismissal, not the rational skepticism itself.  
  Overall, the episode shows TI applies robustly to scientific contexts, but Fricker’s framework needs tweaking to address institutional power dynamics and credibility excesses that block knowledge. It’s less an "anomaly" than a **stress test** revealing where the theory under-specifies.  

