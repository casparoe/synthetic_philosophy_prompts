prompt: |-
  hey -- novelist here, drafting a scene about moral culture clash in a small town, and I've been tracking my own gut calls on rule-breaking vs conscience. wondering if there's a clean principle behind them, or if I'm just rationalizing.

  here are six cases with my verdicts:

  1. guy crosses red light at 3am, dead empty street, but there's a child on the corner watching. I say wrong -- not dangerous, but it teaches rules are negotiable.

  2. same guy drives over the speed limit to rush his sick kid to the ER. I say totally justified, even good.

  3. a clerk refuses to process legal paperwork she finds immoral (not harmful, just against her church). I say she's wrong, putting private feeling over public system.

  4. another character forges a document to prevent an innocent neighbor's eviction. I say that's okay, maybe heroic.

  5. factory worker reports a tiny safety glitch that technically violates protocol; the plant shuts down and forty people lose jobs. He followed the manual exactly. I feel he did something wrong, even though he broke no rule.

  6. coworker notices the same glitch, decides it's harmless, ignores it. I think that's reckless, but I understand it more than the factory case.

  so there's tension: I defend breaking rules for direct personal harm (case 2, 4), but I defend following rules for social coordination except when following them causes massive direct harm (case 5). is there a principle that gets all six, especially the factory case where rule-following feels like failure?

  the case I'm stuck on for my novel: a woman hides an undocumented worker in her garage (breaking immigration law) but when police ask directly if anyone's there, she tells the truth. she breaks one rule and keeps another. is that coherent, or is she just picking and choosing?

  don't just hand me deontology vs consequentialism -- I want the specific logic. also, how does this map onto the old german-american split people talk about: Ordnung and rule-following versus individual conscience? which framing actually captures my verdicts better?

  response format: please give me a JSON object with these exact fields:
  - 'principle_name': a short label for the logic you think I'm using
  - 'summary': 2-3 sentences explaining it
  - 'fit_per_case': an object with keys 'red_light_kid', 'speed_for_ER', 'clerk_refusal', 'forged_doc', 'factory_report', 'ignored_glitch', 'hide_plus_truth', each containing either 'fits', 'tension', or 'fails' plus one sentence why
  - 'german_vs_american': a short string saying which folk morality my pattern is closer to, and wether the other has the better of it in the tension case
  - 'tension_resolution': your take on case 5 vs case 6 and whether my gut is consistent

  then after that, a quick table with columns: Case, My Verdict, German Framing, American Framing, Which Matches Me.

  thanks, and sorry if there's a typo or two in this -- writing fast between chapters.
reasoning: |-
  Okay, the user is a novelist working on a scene about moral culture clash in a small town. They've shared six cases with their own verdicts on rule-breaking versus conscience, and they're looking for a clean principle that explains their judgments. They also mention the German-American split between Ordnung (rule-following) and individual conscience, and want to know which framing better captures their verdicts.  

  First, I need to analyze their six cases to identify a consistent pattern. In case 1 (red light with child watching), they say it's wrong because it teaches rules are negotiable, even though it's not dangerous. In case 2 (speeding to ER), they see it as justified and good. Case 3 (clerk refusing paperwork) is wrong because private feelings override public duty. Case 4 (forging document to prevent eviction) is okay or heroic. Case 5 (factory worker reporting glitch causing job losses) feels wrong despite following rules. Case 6 (coworker ignoring glitch) is reckless but more understandable.  

  The tension they note is between breaking rules for direct personal harm (cases 2 and 4) versus following rules for social coordination, except when it causes massive harm (case 5). For their novel case—hiding an undocumented worker but telling truth to police—they wonder if it's coherent or arbitrary.  

  Looking for a principle: their judgments prioritize preventing concrete harm over abstract rule integrity. In case 1, the harm is indirect (teaching rule negotiation), so it's wrong. Cases 2 and 4 involve imminent, severe harm (child's health, eviction), justifying rule-breaking. Case 3 has no harm, just personal discomfort, so clerk should follow rules. Case 5 causes disproportionate harm (job losses) for a minor glitch, making rule-following feel like a failure. Case 6 is reckless because ignoring glitch could lead to harm, even if unlikely.  

  This aligns with "Rule-Utilitarianism with Harm Threshold." Rules exist to prevent harm, so breaking them is okay only when they fail that purpose or cause greater harm. The German framing (Ordnung) emphasizes strict rule adherence, while American individualism leans on personal conscience. Their pattern is more American but with a utilitarian twist—they still value rules unless harm is involved.  

  For the hidden worker case: hiding breaks a rule to prevent harm (deportation), but truth-telling maintains system integrity. It's coherent under their principle if the concealment was harm-preventive and truth-telling avoids deeper harm (e.g., perjury).  

  Finalizing the JSON:  
  - Principle: Harm-Preventive Rule Pragmatism  
  - Summarizes as prioritizing harm prevention, with rules as tools.  
  - Fit per case: Mostly "fits," with "tension" in factory_report (disproportionate harm) and "fits" for hide_plus_truth.  
  - German vs. American: Leans American, but German has merit in coordination.  
  - Tension resolution: Case 5's judgment is consistent—reporting caused avoidable harm, contravening the spirit of rules.  

  The table will compare each case against German (rules first) and American (conscience first) framings, showing their verdicts align more with American pragmatism.  

  This should give them a clear framework for their novel's moral clashes.
