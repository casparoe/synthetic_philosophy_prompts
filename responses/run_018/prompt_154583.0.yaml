answer: |-
  ## Research Proposal: Fragmented Ontologies and the Fragility of Evidential Cooperation in Large Worlds

  **1. Introduction & Problem Framing**
  Evidential decision theory (EDT), particularly within large-world frameworks invoking causal isolation, faces the challenge of *evidential cooperation*: should an agent take an action because it provides evidence that other, similar agents are likely taking similar actions, thereby bringing about a collectively desired outcome? Standard treatments (e.g., Parfit's hitchhiker, Newcomb's Problem, agent sims) crucially rely on agents being *epistemic peers*. This entails shared priors, common methods for updating beliefs, and, most fundamentally, **agreement on the individuation of possible worlds** – they share the same state-space ontology and logical framework. However, a genuinely large world likely contains agents who, while structurally similar in reasoning architecture and preferences, **fundamentally disagree on how to carve reality into possible worlds**. They might individuate worlds by qualitative properties (ignoring individual identity), adhere to different mereological principles, operate under distinct logics (e.g., classical vs. paraconsistent), or hold incompatible metaphysical commitments affecting state-space definition. The central question emerges: Does the normative force of evidential cooperation persist when epistemic peerhood is replaced by mere *structural similarity* coupled with significant *ontological fragmentation*?

  **2. Precise Research Question**
  Under what conditions, if any, does evidential cooperation remain normatively compelling for an agent A, structurally similar to agent B (sharing decision algorithm F and utility function U), when A and B operate within **divergent ontological frameworks** (O_A ≠ O_B), leading to:
  *   Incompatible state-space definitions (Ω_A ≠ Ω_B),
  *   Different partitions of possibility,
  *   Potentially non-isomorphic event algebras, and
  *   Resulting fundamental disagreement about the evidence provided by actions (e.g., action X might signal different states in Ω_A than it does in Ω_B)?

  Specifically, we seek to characterize the **threshold of ontological divergence** beyond which evidential cooperation loses its distinctive normative force and collapses into a problem of mere coordination (where actions are chosen based on mutual expectation alone, absent robust evidential links), or becomes entirely incoherent.

  **3. Why Standard Treatments Are Insufficient**
  Existing models of evidential cooperation typically assume:
  1.  **Shared State-Space (Ω):** Agents agree on the set of possible worlds and the events defined within them.
  2.  **Shared Priors (P):** Agents agree on prior probabilities over Ω.
  3.  **Shared Updating Rule (e.g., Bayesian):** Agents agree on how evidence updates beliefs.
  4.  **Shared Interpretation of Evidence:** An action X provides evidence *about the same set of possible worlds/states* for all agents.

  These assumptions implicitly define epistemic peerhood. Our variant relaxes assumptions (1) and, consequently, often (4). While some models allow for differing priors (relaxing 2), or explore bounded rationality (relaxing 3), they retain a shared Ω. Ontological fragmentation (O_A ≠ O_B) directly violates (1), creating a deeper schism: agents aren't just disagreeing *within* a shared framework; they disagree *about the framework itself*. This makes translating evidence, actions, and states between agents fundamentally problematic, potentially undermining the evidential link that drives cooperation in standard models. The normative justification for cooperation based on shared evidence becomes suspect.

  **4. Methodology**
  The investigation will employ a dual-track approach:

  *   **Track 1: Conceptual Analysis of Peerhood & Fragmentation**
      *   Precisely define "structural similarity" (F, U) and its core components (algorithm class, preference structure).
      *   Analyze and categorize types of "ontological divergence" (O_A ≠ O_B) relevant to decision-making:
          *   Divergent criteria for world individuation (e.g., haecceitism vs. anti-haecceitism, qualitative vs. trans-world identity).
          *   Divergent mereological commitments affecting state definitions.
          *   Divergent logical frameworks (e.g., impact on defining possibility, negation, conditionals).
      *   Examine how each type of divergence disrupts the standard conditions for interpreting actions as evidence (shared state-space, event definition).
      *   Conceptual exploration of "evidence translation" or "ontological mapping" between frameworks – is it possible, meaningful, or necessary for cooperation?

  *   **Track 2: Informal Modeling of Decision Rules**
      *   Develop simplified, abstract scenario templates involving two agents (A and B), sharing F and U, but operating under O_A and O_B.
      *   Define paradigmatic cases of ontological divergence (e.g., Agent A: haecceitist, individuates worlds by object identity; Agent B: anti-haecceitist, individuates worlds only qualitatively).
      *   Model how a cooperative action X by A is *interpreted evidentially* within A's framework (Ω_A) and within B's framework (Ω_B). Does X signal "copies like me cooperate" in both Ω_A and Ω_B? If not, what *does* it signal in Ω_B?
      *   Analyze the decision rule F applied by A:
          *   Can A formulate a coherent belief about B's action *as evidence relevant to A's own world Ω_A*, given the ontological gap?
          *   Does the expected utility calculation within Ω_A, incorporating A's beliefs about B's likely action (informed by A's understanding of B's framework O_B), still recommend cooperation?
          *   Identify potential decision-theoretic pathologies: circularity, indeterminacy, self-defeating predictions.
      *   Explore the role of higher-order beliefs (what A believes B believes about O_A, etc.) and their stability under fragmentation.

  **5. Definition of Success**
  A successful outcome for this project would yield:
  1.  A **taxonomy of ontological divergence types** based on their impact on evidential interpretation (e.g., "Identity Divergence," "Mereological Divergence," "Logic Divergence").
  2.  A **ranking of these divergence types** by their "cooperation tolerance":
      *   Which types allow evidential cooperation to function normatively similarly to the peer case?
      *   Which types degrade cooperation into a normatively distinct coordination problem?
      *   Which types render coherent evidential cooperation impossible?
  3.  Identification of **minimal bridging conditions**: What minimal level of meta-agreement (e.g., about the *existence* of divergent frameworks, or about a mapping function, however imperfect) is necessary for any form of cooperation to retain evidential character?
  4.  A clear articulation of the **normative distinction** preserved (or lost) between evidential cooperation and bare coordination under varying divergence conditions.

  **6. Definition of Failure**
  This project would be considered unsuccessful if:
  1.  **Smuggling Peerhood:** The formalization attempts inevitably reintroduce core elements of epistemic peerhood (e.g., assuming an implicit shared meta-ontology for discussing divergence, or requiring agents to perfectly model each other's ontologies, effectively creating a new shared Ω).
  2.  **Formalization Collapse:** The ontological divergence proves too fundamental to model decision rules coherently within a single agent's perspective (A's calculation within Ω_A cannot meaningfully incorporate B's existence under O_B).
  3.  **Indeterminacy:** Analysis shows that the normative recommendation for A under divergence is highly sensitive to unspecified higher-order beliefs or arbitrary modeling choices, yielding no stable or generalizable conclusions.
  4.  **Trivialization:** It is demonstrated that structural similarity combined with *any* significant ontological divergence invariably reduces the problem to bare coordination, negating the distinctive normative core of *evidential* cooperation.

  **7. Scope Assessment & Timeline**
  This project is ambitious but tractable for a one-semester independent study, provided scope is rigorously managed.

  *   **Tractable Core (Weeks 1-8):**
      *   Defining structural similarity & core divergence types (2 wks).
      *   Conceptual analysis of evidential breakdown under 1-2 key divergence types (e.g., identity vs. qualitative; simple mereological difference) (3 wks).
      *   Developing & analyzing 2-3 core informal models/scenarios illustrating cooperation/breakdown under these types (3 wks).
      *   Drafting initial taxonomy and tolerance ranking (2 wks).

  *   **Likely Expansion Risks (Requiring Strict Boundaries):**
      *   **Complexity of Divergence Types:** Exploring more than 2-3 divergence types or highly complex ones (e.g., full logical heterodoxy). *Mitigation:* Strictly limit analysis to 2-3 paradigmatic, clearly defined types.
      *   **Formalization Depth:** Attempting full formal decision-theoretic models (e.g., defining probability measures over incompatible spaces). *Mitigation:* Emphasize *informal* modeling focused on conceptual coherence and evidential interpretation within agent perspectives. Use schematic representations.
      *   **Higher-Order Beliefs:** Getting bogged down in intricate, unstable hierarchies of beliefs about ontologies. *Mitigation:* Focus primarily on first-order agent perspective (A in Ω_A considering B in O_B) and simple, stable assumptions about mutual awareness of divergence.
      *   **Comprehensive Taxonomy:** Aiming for an exhaustive classification. *Mitigation:* Frame the taxonomy as an initial, illustrative framework based on the analyzed cases, explicitly noting it's not exhaustive.

  *   **Deliverable Focus (Weeks 9-12):** Synthesizing findings into a coherent paper outlining the problem, methodology, core divergence analyses, proposed taxonomy/tolerance ranking, success/failure conditions, and identified challenges for future work.

  **Conclusion**
  By shifting the focus from epistemic peerhood to structural similarity under ontological fragmentation, this project addresses a critical blind spot in large-world evidential cooperation. It challenges the robustness of standard justifications and seeks to delineate the precise conditions under which the distinctively evidential character of cooperation persists or dissolves. The outcome will be a clearer understanding of the foundations and limits of cooperative norms in a metaphysically diverse large world.
