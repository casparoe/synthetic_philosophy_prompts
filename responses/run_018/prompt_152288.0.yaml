answer: |-
  ### Frequently Asked Questions for the Bureau of Analogical Governance (BAG)  

  **1. What is the Bureau’s primary regulatory mandate?**  
  The Bureau of Analogical Governance oversees the lawful application of analogical reasoning in all cognitive operations, as mandated by the *Universal Analogy Act*. All thought, from basic categorization to abstract deduction, constitutes analogical projection between conceptual "source" and "target" domains. The Bureau ensures such projections comply with structural alignment standards, essence-preservation protocols, and slippage mitigation guidelines. Unlicensed analogical operations are subject to penalties under Cognitive Compliance Statute 7.3.  

  **2. How do citizens apply for an Analogical Permit?**  
  Permits are tiered under the **Conceptual Citizenship License (CCL)** system (Provisional, Standard, Master). Applicants must submit Form AG-114 ("Declaration of Intent to Map Surfaces") to their regional Analogical Compliance Office, alongside proof of completed *Analogical Aptitude Testing* (AAT). The AAT evaluates fluency in cross-domain projection (e.g., likening "democracy" to "orchestra tuning"). Provisional CCL holders may perform basic categorizations (e.g., "apple is to fruit as salmon is to fish"); Master CCL permits authorize complex mappings (e.g., quantum physics as "cosmic baking"). Processing takes 6–8 weeks.  

  **3. Are non-analogical cognitive methods permitted?**  
  No. Per BAG Directive 202.1, cognition exclusively relies on analogical scaffolding. Attempts to engage in "direct" computation (e.g., axiomatic deduction, statistical inference) without analogical framing violate **Essence Non-Disclosure** regulations. For example, mathematical proofs must be submitted as analogical projections (e.g., "prime numbers are lonely integers, akin to unpaired socks"). Citizens reporting non-analogical ideation must undergo Mandatory Analogy Realignment at certified facilities.  

  **4. How does the Bureau differentiate valid structural mappings from surface errors?**  
  BAG auditors use the **Structural Essence Verification Instrument (SEVI)**, which quantifies alignment between source/target domains. Valid mappings require ≥85% congruence in relational topology (e.g., "car engine : vehicle :: heart : body" passes; "cloud : sadness :: toaster : nostalgia" fails due to non-transferable causal roles). Surface-feature overlaps (e.g., "bananas and crescent moons share curvature") incur penalties unless essence vectors (e.g., "nutritional purpose" vs. "celestial body") are formally licensed via **Essence Disclosure Tax** payments.  

  **5. What penalties apply for failed analogies?**  
  **Slippage Violations** (e.g., over-extending "war on drugs" to "war on lint") trigger fines ($2–500 per incident) and CCL demerits. Three demerits mandate **Analogy Audits**, where citizens reenact faulty mappings before a Compliance Tribunal. Severe cases (e.g., conflating "free market" with "natural selection" without adjusted parameters) may result in license suspension or compulsory attendance in Metaphor Remediation Workshops. Repeat offenders face Conceptual License revocation.  

  **6. What is the appeals process for revoked licenses?**  
  Revoked CCL holders may file Appeal Docket SE-9 within 30 days, presenting evidence of "rehabilitated analogical discipline" (e.g., logs of audited practice projections). Cases are reviewed by the **Analogical Review Board**, which may order retesting. Denied appeals escalate to the High Court of Essences, where appellants must demonstrate irreversible cognitive impairment to justify non-analytical alternatives. Decisions are final.  

  **7. Does the Bureau regulate cross-cultural analogies?**  
  Yes. Cross-cultural projections (e.g., "karma is Western sin") require **Trans-Domain Essence Permits** (TDEP), verifying source/target cultural frameworks share ≥70% structural equivalence via SEVI. Unpermitted mappings risk **Conceptual Colonialism** charges. TDEP fees scale with projection complexity (base rate: $150/license term).  

  **8. Are children subject to licensing?**  
  Minors operate under Provisional CCLs until age 16, permitting basic categorizations ("cats : pets :: stars : sky"). School curricula include mandatory Analogy Hygiene courses to preempt developmental slippage. Unlicensed juvenile analogies incur parental fines.  

