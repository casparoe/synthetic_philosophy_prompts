  1. The statue is identical to the clay (one-object view).
  2. The statue is constituted by the clay but not identical (coincident objects).
  3. The statue is a distinct entity defined by form (formalism).

  Now, mapping these to conservation concepts. Conservation focuses on material substrate, provenance, structural integrity, and reversibility. 

  For position 1 (statue=clay), substrate maps directly. But conservation treats substrate as the foundation for the artwork's identity, which aligns with this view. However, conservation also cares about form and integrity, which might not fit perfectly. The problem here is that conservation ethics emphasize preserving material authenticity, so if the statue is just the clay, then any repair altering the clay changes the artwork. But in practice, repairs are done, suggesting that form matters too. The gap is that philosophy's strict identity doesn't account for how conservators accept some changes if integrity is maintained.

  Position 2 (coincident objects) is tricky. Conservation doesn't really separate the artwork from its substrate as distinct entities. Substrate and integrity together define the artwork. The idea of two objects occupying the same space isn't present in conservation. They might see the artwork as a combination of material and form but not as separate objects. So this position forces the vocabulary. Terms like "provenance" and "structural integrity" imply a unified object, not two. The residue here is that conservation doesn't entertain coincident entities; it's a philosophical construct without practical counterpart.

  Position 3 (formalism) aligns better with conservation's focus on structural integrity and aesthetic coherence. Integrity and reversibility support the idea that the artwork persists if the form is restored. However, substrate authenticity is still crucial. Reversibility allows undoing repairs, preserving the original material, which fits this view. But philosophy's modal claims (what could happen to the object) aren't considered in conservation, which is more practical.

  The residue report: Conservation's principle of reversibility suggests that interventions aren't part of the artwork, implying that the original substrate is primary. This challenges the coincident objects view because if the repair is reversible, it's not a new object but an addition. Also, conservation's focus on material authenticity might lean towards the substrate being essential, but the allowance for repairs shows that form matters too. The key gap is that conservation doesn't deal with metaphysical possibilities (e.g., if the clay survives without form). They focus on actual preservation, not hypotheticals. So philosophical arguments about modal properties aren't relevant in practice, making them less substantive from a conservation standpoint. However, conservation's ethical principles assume that authenticity lies in the original material, which supports the idea that the artwork is tied to its substrate, even if form is important.
answer: |-
  Below is a systematic translation of the three core philosophical positions on material constitution (statue vs. clay) into the precise vocabulary of art conservation, followed by an analysis of conceptual overlaps, distortions, and residues. The translation adheres strictly to conservation ethics and practice, avoiding smuggled philosophical analogies.

  ---

  ### **Philosophical Positions Translated into Conservation Vocabulary**

  #### **1. Position: *The statue is identical to its material substrate.***  
     - **Conservation Translation:**  
       The artwork *is* its **substrate**. **Provenance** traces the history of this material alone. **Structural continuity** requires unbroken physical persistence of the substrate; if the substrate is altered (e.g., epoxy repair), the artwork ceases to exist. "Restoration" that adds non-original material (e.g., epoxy) is ethically impermissible as it creates a new object.  
     - **What Translates Cleanly:**  
       - Emphasis on substrate as the sole bearer of authenticity.  
       - Provenance as a record of material history.  
       - Ethical rejection of irreversible interventions (since they destroy the original substrate).  
     - **Distortions/Forced Fits:**  
       - Conservation accepts *some* substrate modification (e.g., gap-filling) if it respects structural integrity and reversibility. This position’s absolute rejection of any change contradicts practical conservation.  
       - "Structural continuity" in conservation permits repairs if they restore coherence; here, it must mean *unaltered* continuity.  
     - **No Counterpart:**  
       - Philosophical modal claims (e.g., "The statue *could* have been shaped differently") have no analogue. Conservation assesses only actual history.  

  #### **2. Position: *The statue is constituted by the substrate but not identical to it.***  
     - **Conservation Translation:**  
       The artwork is defined by **structural integrity** (form) supervening on the substrate. **Provenance** documents the persistence of this integrity. Restoration is ethical if it maintains structural coherence using reversible methods, even with visible epoxy, as the substrate *constitutes* but is not *the artwork itself*. Loss of integrity (e.g., unrepaired fractures) ends the artwork’s existence, even if substrate persists.  
     - **What Translates Cleanly:**  
       - Prioritization of structural integrity over substrate purity.  
       - Ethical restoration practices (reversible, distinguishable repairs) align perfectly.  
       - Provenance includes the artwork’s formal history, not just material.  
     - **Distortions/Forced Fits:**  
       - Conservation never treats substrate and artwork as *separate entities*; this position’s "constitution without identity" requires imagining two distinct records (material vs. formal), which conservation merges into a single provenance.  
       - The "supervenience" relationship is implicit in conservation but never bifurcated.  
     - **No Counterpart:**  
       - Philosophers’ "temporal parts" or "coincident objects" (e.g., lump of clay surviving the statue’s destruction) lack any correlate. Conservation does not entertain scenarios where substrate persists without artwork-identity.  

  #### **3. Position: *The statue is a distinct object governed by form-related persistence conditions.***  
     - **Conservation Translation:**  
       The artwork is an entity defined by **aesthetic and structural coherence**. **Substrate** is merely a vehicle for this coherence. **Provenance** tracks the continuity of form. Restoration using epoxy is ethical if it restores coherence reversibly, even if visibly modern. The artwork persists as long as its essential form is maintained; fractures compromise persistence unless repaired.  
     - **What Translates Cleanly:**  
       - Focus on form (structural/aesthetic coherence) as the artwork’s essence.  
       - Alignment with "reversibility" — interventions support form without claiming material authenticity.  
       - Provenance as a record of the artwork’s formal lineage.  
     - **Distortions/Forced Fits:**  
       - Conservation still prioritizes original substrate when possible; this position’s demotion of substrate to "vehicle" overstates practice.  
       - "Persistence conditions" tied solely to form ignore cases where conservation values degraded states (e.g., archaeological fragments) as authentic.  
     - **No Counterpart:**  
       - Philosophers’ counterfactuals (e.g., "The statue might exist in a different substrate") are irrelevant. Conservation binds form to *this* substrate’s history.  

  ---

  ### **Residue Report: Unstated Assumptions and Conceptual Gaps**

  #### **A. What Conservation Ethics Reveals About Philosophical Debates**  
  1. **The Reversibility Principle as a Rejection of Coincident Objects:**  
     Conservation’s requirement that restorations be *reversible and distinguishable* assumes the **primacy of the original substrate**. Epoxy repairs are seen as *temporary additions*, not part of the artwork. This undermines the "constitution without identity" position, which treats the repaired object as a new composite entity. Conservation implies: *There is only one object (the substrate), and interventions are extrinsic supports*. Philosophers’ "coincident objects" (statue + clay) have no ethical footing here.  

  2. **Structural Continuity Over Modal Intuitions:**  
     Conservation cares about *actual* **provenance** and **structural continuity**, not hypothetical scenarios (e.g., "Could the clay survive without the statue?"). This exposes philosophy’s reliance on modal properties (possibilities) as artifacts of thought experiments, not conservation’s material ethics.  

  #### **B. What Conservation Practice Implicitly Denies (But Never Articulates)**  
  1. **The Non-Identity of Form and Matter:**  
     Conservation treats **structural integrity** and **substrate** as interdependent aspects of *one entity*. Philosophers’ distinctions (e.g., "form vs. matter") are collapsed into a holistic view where authenticity emerges from their union. This denies the substantive separability argued in philosophy.  

  2. **The Irrelevance of Metaphysical Scenarios:**  
     Conservation has no equivalent for:  
     - "The clay but not the statue survives pulverization."  
     - "A perfect replica is not the artwork."  
     These are dismissed as *practically meaningless* because conservation is anchored in tangible history, not modal logic.  

  #### **C. Is the Failure to Carry Something Over a Defect?**  
  - **In Conservation:** No defect. Its framework is purpose-driven (preservation of cultural heritage), rejecting metaphysics that don’t impact material ethics.  
  - **In Philosophy:** The "residue" (modal claims, coincident entities) is **less substantive than it appears** when tested against real-world conservation. For example, the debate over whether a repaired statue is "identical" to the original fades when conservation focuses on *documented continuity of care* rather than abstract persistence conditions.  

  ---

  ### **Conclusion**  
  Your grandmother’s ceramic sculpture, ethically repaired with visible epoxy, retains its identity in conservation terms through **provenance** and **structural integrity** maintained by reversible intervention. The philosophical debate’s unresolved tensions (e.g., coincidence vs. identity) stem from abstract modal reasoning that conservation renders irrelevant. Conservation ethics, with its core principles of **reversibility** and **substrate primacy**, simplifies the question: The artwork persists if its material history is unbroken and interventions respect its physical legacy. The fractures, if preserved, become part of that history; if repaired, they are a reversible chapter in its provenance. Neither choice "ends" the artwork—both honor its continuity.
