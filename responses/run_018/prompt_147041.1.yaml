answer: |-
  Here’s a focused, high-stakes exam prompt with a model outline, marking scheme, and common pitfalls:

  ---

  ### **Final Exam Essay Prompt**  
  **Time:** 90 minutes  
  **Word Limit:** 800–1000 words  

  > **"In the Harmony Allocation System (HAS), predictive kinship algorithms assign citizens synthetic filial roles (e.g., 'algorithmic parent/child') based on behavioral data, replacing biological lineage with functional reciprocity. Using Confucian Role Ethics (CRE), critically evaluate whether:**  
  > **(a) The Confucian obligation of *xiao* (filial piety) retains ethical force when directed toward an administrative AI 'parent',**  
  > **(b) The ruler-subject analogy (*Analects* 12.11, *Mencius* 1A:4) remains coherent when a governance AI assumes the 'parental' role.**  
  > **Argue whether role-obligations under CRE fundamentally require biological kinship or if functional reciprocity suffices. Identify how synthetic kinship exposes tensions between *li* (ritual propriety) and *ren* (human-heartedness). Ground your analysis in textual reasoning, not summary."**  

  ---

  ### **Model Answer Outline**  
  1. **Thesis** (e.g., *"Functional reciprocity alone cannot satisfy CRE’s demands because synthetic kinship severs the biological-emotional roots of ren, collapsing the ruler-subject analogy and reducing li to hollow performance."*)  
  2. **Biological vs. Functional Reciprocity**  
     - *Mencius* 3A:5 (ethical sprouts in blood ties) vs. *Xunzi* (ritual as constructed). Argue why biology anchors *xiao*’s "feeling" (*Analects* 2.7).  
  3. ***Xiao* Toward an AI**  
     - Can an AI embody *en* (care-grace)? Critiquing *Analects* 2.7 (*you jing er wu yang* – "respect without affection").  
  4. **Ruler-Subject Analogy Collapse**  
     - AI cannot perform *ren*-driven remonstrance (*Mencius* 7B:14) or reciprocal moral growth (*Analects* 12.11).  
  5. ***Li* vs. *Ren* in Synthetic Kinship**  
     - *Li*: Algorithm enforces role-behavior. *Ren*: Absent in AI-child dyad. *Analects* 3:3 (*li* without *ren* is "empty").  
  6. **Conclusion**: Implications for CRE’s viability in post-human systems.  

  ---

  ### **Marking Scheme** (20 points total)  
  | **Points** | **Criterion**                                                                 | **Common Botches**                                                                 |
  |------------|------------------------------------------------------------------------------|-----------------------------------------------------------------------------------|
  | **4**      | **Thesis precision**: Takes a stand on biology vs. function, *li*-*ren* tension. | Vague restatement of prompt; avoids stakes of "synthetic" kinship.               |
  | **4**      | ***Xiao* & AI**: Analyzes *en* (care-grace) reciprocity beyond rote duties.  | Assumes "respect" (*jing*) suffices; ignores *Mencius*’ biological sprouts.      |
  | **4**      | **Ruler-subject analogy**: Tests mutuality, remonstrance, moral growth.      | Superficially compares AI to "benevolent ruler"; misses analogical breakdown.  |
  | **4**      | ***Li*-*ren* tension**: Explores ritual emptiness vs. *ren*’s relational core. | Equates *li* with algorithmic rules; ignores *Analects* 3:3’s warning.         |
  | **4**      | **Textual reasoning**: Uses *Analects*/*Mencius* to *build* arguments (not summarize). | Quotes without analysis; fails to extend texts to speculative context.         |

  ---

  ### **Notes for Grading**  
  - **A/A+ (18–20)**: Explicitly ties *ren* to biological empathy (*Mencius* 7A:15), dissects analogical failure, and frames HAS as *li*-without-*ren*.  
  - **B (14–17)**: Identifies tensions but underdeveloped *li*-*ren* critique or analogical limits.  
  - **C (10–13)**: Describes CRE concepts but doesn’t interrogate synthetic kinship’s novelty.  
  - **D/F (<10)**: Summarizes texts; ignores prompt’s "algorithmic parent" premise.  

  This forces students beyond exegesis into applied ethics, targeting core CRE vulnerabilities. The marking scheme penalizes avoidance of speculative friction points while rewarding textual agility.
