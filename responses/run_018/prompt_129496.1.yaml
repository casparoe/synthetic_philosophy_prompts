  For the resolution, I should emphasize that social rewards attach to domain-specific predictability. Being predictably vengeful toward enemies and forgiving toward friends isn't incoherent - it's precisely what makes you reliable. The "profile" only matters insofar as it helps others model your behavior in concrete situations. Their step (6) mistakenly treats all traits as needing activation simultaneously rather than contextually. 

