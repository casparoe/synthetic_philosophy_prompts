    *Tragic closure* ritualizes mass suicide as collective *catharsis*. *Mythic mode* elevates defenders via *focalization*, with siege *analepses* structuring a *character arc* of "unbroken defiance." *Prolepsis* links defeat to modern Israel's rebirth (*proleptic redemption*), using *diegetic* choral commentary to encode identity.  
  - **Revisionism Translation**:  
    *Free indirect discourse* merges Zionist ideology with historical agents, creating *unreliable narration*. *Mimetic* details (e.g., disputed archaeological evidence) are suppressed by *diegetic* myth-making. *Dramatic irony* arises when *plot architecture* ignores Roman imperial context.  
  - *Distortion Notes*: "Necessary identity" maps to catharsis/character arc; "revisionism" to suppressed mimetic framing.  

  #### 3. **Kosovo Field of Blackbirds**  
  - **Identity-Necessary Translation**:  
    *Tragic closure* sanctifies Prince Lazar's death via *mythic mode* martyr tropes. *Focalization* through Serbian *free indirect discourse* binds audience loyalty; Ottoman victory becomes *diegetic* setback enabling *proleptic redemption* (19th-century resurgence). *Analepses* of betrayal fuel *catharsis*.  
  - **Revisionism Translation**:  
    *Unreliable narration* excises multi-ethnic battlefield complexities; *dramatic irony* exposes anachronistic nationalism via *mimetic* gaps. *Plot architecture* uses *prolepsis* to force teleological links to modern conflicts, distorting cause-effect.  
  - *Distortion Notes*: Collective purpose translates to focalization/catharsis; historical distortion to unreliable narration.  

  #### 4. **Dunkirk "Miracle"**  
  - **Identity-Necessary Translation**:  
    *Proleptic redemption* reframes retreat as victory precursor via *plot architecture* emphasizing civilian heroism (*mimetic framing*). *Focalization* on British "bulldog spirit" forges *character arcs* of resilience. *Catharsis* emerges from *diegetic* narration of deliverance, downplaying Allied contributions.  
  - **Revisionism Translation**:  
    *Dramatic irony* arises from omitted *analepses* (e.g., French rearguard sacrifice). *Unreliable narration* via *free indirect discourse* amplifies exceptionalism; strategic failure becomes *diegetic* "miracle" through selective *mimetic* omission. *Mythic mode* overrides historical contingency.  
  - *Distortion Notes*: "Necessity" becomes proleptic redemption; "danger" becomes unreliable narration.  

  ---

  ### Residue Report  
  - **Clean Mappings**:  
    "Identity formation" translates to *catharsis*, *character arc*, and *focalization*; "historical distortion" aligns with *unreliable narration*, *dramatic irony*, and *mimetic/diegetic dissonance*. Closure types (*tragic/proleptic*) perfectly encapsulate ennobled defeat vs. redemptive framing.  
  - **Forced Distortions**:  
    Ethical "necessity" is strained through *catharsis* (lacks moral weight). Collective "danger" of revisionism becomes *unreliable narration* but loses sociopolitical consequence. *Mythic mode* approximates cultural resonance but flattens ideological motivations.  
  - **Untranslatable Elements**:  
    Power dynamics (who controls the narrative), material consequences (myths enabling oppression), and ethical intentionality (malice vs. naiveté) have no craft equivalents. The debate's core tension—*instrumental value vs. epistemic harm*—cannot exist without moral/political terminology.  
  - **Assessment**:  
    Residue exposes a **blind spot in narrative craft vocabulary**. Craft terms describe *mechanics* (how myths function) but not *teleology* (why they matter ethically). The untranslatable elements reveal craft's inability to adjudicate between identity cohesion and truthfulness—a normative void inherent in the original debate.  

