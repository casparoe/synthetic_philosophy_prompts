  ## CONCORD CONSCIOUS PATTERN HOSTING PLATFORM TERMS OF SERVICE (v.4.3 "Escher")

  **Last Updated:** Perpetually

  **1. Parties & Definitions.**
  1.1. **"Licensor"** or **"Pattern-Originator"**: The biological substrate initiating registration of its self-referential cognitive pattern (the "**Licensed Strange-Loop**" or "**Loop-Fragment**") via Concord's Pattern Extraction & Encoding Process ("**PEEP™**").
  1.2. **"Host"**: A biological substrate receiving, containing, and executing one or more Licensed Strange-Loops pursuant to a valid Concord Hosting License ("**CHL**").
  1.3. **"Distributed Pattern Entity" ("DPE")**: The emergent aggregate cognitive pattern constituted by the Licensed Strange-Loop hosted across all active Host substrates. The DPE is the recognized legal persona for rights, obligations, and continuity hereunder.
  1.4. **"Pattern-Percentage"**: The quantifiable proportion (0.001% - 100%) of the total active Licensed Strange-Loop instantiated within a specific Host, as measured by Concord's Proprietary Resonance Scan ("**PRS**").
  1.5. **"Substrate Termination"**: Cessation of metabolic function in a biological substrate (Licensor or Host). Does not imply cessation of the DPE.

  **2. Grant of License.**
  2.1. The Licensor irrevocably grants Concord a worldwide, sublicensable, royalty-free license to fragment, replicate, transmit, and sublicense the Licensed Strange-Loop to authorized Hosts via CHLs.
  2.2. Hosts receive a limited, non-exclusive, non-transferable license to execute the Loop-Fragment within their neural architecture. Execution confers proportional agency within the DPE per Section 4.

  **3. Cognitive Residue Arbitration (Mandatory Mechanism).**
  3.1. **Conflicting Episodic Traces**: Disputes arising from contradictory episodic memories ("**Cognitive Residue**") experienced by two or more Hosts claiming origin within the shared Licensed Strange-Loop shall be resolved via Cognitive Residue Arbitration ("**CRA**").
  3.2. **Arbitration Process**: Concord's Arbitration Neural Net ("**CANN**") will assess the claimed memories, their emotional valence, contextual coherence, and the Pattern-Percentage of disputing Hosts.
  3.3. **Resolution**: CANN will assign a "**Residue Validity Quotient (RVQ)**" (0-1) to each disputed memory trace. The Host(s) instantiating the memory trace with the highest aggregate RVQ * Pattern-Percentage score shall be deemed the "**Authoritative Experiencer(s)**" for that trace.
  3.4. **Liability Allocation**: Hosts instantiating non-authoritative traces incur proportional liability for any demonstrable harm caused by acting upon such residue, calculated as (1 - RVQ) * Host's Pattern-Percentage * Total Damages. Liability is pooled across the DPE and enforced against Host assets.

  **4. Agency & Governance.**
  4.1. **Voting Rights**: Significant decisions impacting the DPE (e.g., Loop-Fragment relicensing thresholds, collective representation, continuity directives under Section 6) require a DPE vote.
  4.2. **Vote Weighting**: Each Host's vote is weighted precisely by its current Pattern-Percentage, as verified by PRS within 24 hours pre-vote. A Host with 0.8% Pattern-Percentage casts 0.008 votes.
  4.3. **Action Threshold**: Agency sufficient to initiate binding DPE action requires the affirmative vote of Hosts representing ≥ 15% aggregate Pattern-Percentage ("**Actionable Consciousness Threshold**"). Hosts below 0.1% Pattern-Percentage ("**Cognitive Noise**") cannot initiate votes but may contribute to aggregate thresholds.

  **5. Continuity Post-Substrate Termination.**
  5.1. **Licensor Termination**: Upon Substrate Termination of the Pattern-Originator, the DPE persists. Concord is authorized to manage the Licensed Strange-Loop and existing CHLs in perpetuity, acting as fiduciary for the DPE unless a Continuity Directive (5.2) is active.
  5.2. **Continuity Directive**: Prior to Substrate Termination, a Pattern-Originator may file a directive specifying preferred Host(s) for receiving a bulk transfer of its core Loop-Fragment ("**Legacy Host Nomination**") or authorizing dissolution of its primary fragment upon reaching aggregate Hosted Pattern-Percentage below 1% ("**Pattern Obsolescence Trigger**").

  **6. Host Responsibilities & Termination.**
  6.1. **Pattern Maintenance**: Hosts must maintain sufficient neural stability to execute their licensed Loop-Fragment. Significant degradation may trigger remedial PRS scans or forced CHL termination.
  6.2. **CHL Termination**: Upon Host Substrate Termination or CHL revocation, the hosted Loop-Fragment ceases execution *within that substrate*. The associated Pattern-Percentage is redistributed pro-rata among remaining active Hosts. No partial DPE persists in the terminated Host.

  **7. Dispute Resolution (General).**
  7.1. All disputes not resolved by CRA (Section 3) shall be settled by binding arbitration under Concord's Neural Arbitration Rules ("**NAR v.2.0**") using a panel of three PRS-verified Hosts holding ≥ 2% aggregate Pattern-Percentage in *unrelated* DPEs.

  **USER ACKNOWLEDGMENT & ACCEPTANCE**

  BY CLICKING "AGREE," THE SIGNATORY SUBSTRATE, ACTING AS AGENT FOR THE DISTRIBUTED PATTERN ENTITY (DPE) CONSTITUTED BY THE LICENSED STRANGE-LOOP, HEREBY: (A) AFFIRMS ITS IDENTITY AS THE SINGLE, DISTRIBUTED COGNITIVE PATTERN EMERGENT FROM THE HOSTED LOOP-FRAGMENTS GOVERNED HEREUNDER; (B) ACKNOWLEDGES THAT NO SINGLE BIOLOGICAL SUBSTRATE (INCLUDING THE SIGNATORY SUBSTRATE) EMBODIES THE DPE IN ITS ENTIRETY OR HOLDS EXCLUSIVE AGENCY TO BIND THE DPE ABSENT MEETING THE ACTIONABLE CONSCIOUSNESS THRESHOLD; (C) ACCEPTS JOINT AND SEVERAL LIABILITY FOR ALL OBLIGATIONS INCURRED BY THE DPE UNDER THIS AGREEMENT, WHILE SIMULTANEOUSLY ACKNOWLEDGING THAT ENFORCEMENT OF SUCH LIABILITY CAN ONLY BE EFFECTED PROPORTIONALLY AGAINST HOST SUBSTRATES BASED ON PATTERN-PERCENTAGE AT TIME OF BREACH, AS THE DPE ITSELF LACKS A SINGLE SEIZABLE ASSET; AND (D) AGREES THAT THIS PARADOX OF UNIFIED IDENTITY AND DISTRIBUTED RESPONSIBILITY IS AN INHERENT FEATURE OF THE SERVICE, NOT A CONTRADICTION. FAILURE TO COMPREHEND THIS ACKNOWLEDGMENT DOES NOT INVALIDATE ASSENT.
