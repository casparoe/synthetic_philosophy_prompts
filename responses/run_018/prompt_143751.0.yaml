prompt: |-
  I am a science journalist working on a long-form feature about how clinical ethics committees should evaluate whether a post-callosotomy patient still constitutes a single conscious subject for informed consent and care planning. Before you answer, please take the role of a philosopher of mind with clinical neuropsychology training, think carefully about the conceptual landscape, and begin with a brief brainstorming phase: list the distinctions that must survive translation into practice—phenomenal unity, access unity, and narrative self-model integration—and explicitly flag which ones are empirical, which are metaphysical, and which are pure value judgments that no checklist can resolve.

  Then, construct a reusable 90-minute clinical evaluation procedure—call it the Interhemispheric Coherence Protocol—that a hospital neuropsychologist could run repeatedly without resolving centuries-old debates about consciousness. The procedure should be a flowchart in words: a fixed sequence of steps (conflict-resolution trials, first-person report protocols, cross-cueing behavioral tests, and narrative-integration interviews), with clear pass/fail/stopping conditions at each stage. Specify exactly what counts as sufficient evidence for each outcome, where the protocol mandates a "unified subject" determination, where it mandates a "no unified subject" determination, and—crucially—where it must halt and hand the decision to human judgment because the remaining question is ethical rather than empirical.

  Ground the protocol in the actual conceptual structure of split-brain research, but inject a novel operational distinction: treat "arbitration failure" not merely as behavioral conflict, but as the absence of a higher-order integrative mechanism that can adjudicate between hemispheric outputs without suppressing one. Apply the protocol to three hypothetical cases, including one where it yields an answer the clinical team will not want to accept. Case one: a classic corpus-callosotomy patient with an intact verbal left hemisphere and a right hemisphere that generates emotional responses contradicting verbal reports. Case two: a patient with partial anterior callosal sparing who shows rapid cross-cueing but denies any felt division. Case three: a post-surgical patient in whom both hemispheres generate independent, stable first-person narratives that never conflict only because they address entirely disjoint domains—here, the empirical criteria should point toward dual-subject status, yet ethical obligations should prevent the team from acting on that conclusion.

  Finally, include an explicit "limits of procedure" section: state precisely what the protocol cannot determine, especially regarding metaphysical claims about "how many minds are in the skull," and warn against misusing its outputs in legal or policy contexts. Do not provide bibliographies, reading lists, citations, or references to specific papers; work entirely from the conceptual framework you have developed. Make the language formal, precise, and suitable for a specialist reader who is not a professional philosopher.
reasoning: |-
  We are designing an evaluation protocol for post-callosotomy patients to assess whether they constitute a single conscious subject for informed consent and care planning. The protocol must avoid resolving deep philosophical debates but provide a structured, evidence-based process. Key conceptual distinctions:

  1. **Phenomenal Unity**: The subjective feeling of being a single, unified conscious entity. This is primarily a metaphysical question (what is it like to be the subject?) but can be probed indirectly through first-person reports and behavioral coherence.

  2. **Access Unity**: The functional integration of information across cognitive modules, allowing for coherent decision-making and action. This is empirical and can be tested via behavioral and cognitive tasks.

  3. **Narrative Self-Model Integration**: The ability to maintain a coherent, temporally extended self-narrative that integrates experiences across time. This involves both empirical aspects (e.g., consistency in self-report) and value judgments (what level of coherence is required for personhood?).

  - **Empirical**: Access unity and aspects of narrative integration (e.g., consistency in autobiographical reports) can be tested behaviorally.
  - **Metaphysical**: Phenomenal unity is fundamentally a first-person experience and not directly observable; we must infer it from reports and behavior.
  - **Value Judgments**: The threshold for what constitutes "sufficient" unity for personhood and moral status is normative and cannot be resolved by empirical tests alone.

  **Protocol Design: Interhemispheric Coherence Protocol (ICP)**

  The ICP is a 90-minute structured assessment with four stages, each with pass/fail criteria. It assumes standard neuropsychological evaluation has ruled out confounds (e.g., dementia, aphasia). The protocol is run by a clinical neuropsychologist.

  **Stage 1: Conflict-Resolution Trials (20 minutes)**
  - **Purpose**: Test for arbitration failure between hemispheres. We define "arbitration failure" as the absence of a mechanism that can resolve conflicts without suppressing one hemisphere's output. This goes beyond mere behavioral conflict to look for evidence of an integrative mechanism.
  - **Procedure**: 
    - Present tasks requiring interhemispheric coordination. Examples: 
      - *Tactile Naming*: Place an object in the left hand (right hemisphere) and ask the patient to name it (left hemisphere). Failure: patient cannot name it but can select it from a set with the left hand.
      - *Chimeric Stimuli*: Show a composite image (e.g., half-face, half-house) and ask the patient to describe it. Look for conflicting reports (e.g., "I see a house" when pointing to the house half with the right hand, but the left hand points to the face half).
      - *Conflict Induction*: Present a word to the left visual field (right hemisphere) and a different word to the right visual field (left hemisphere). Ask the patient to say what they saw and draw with the left hand. Conflict is present if verbal report and drawing mismatch.
  - **Pass/Fail Criteria**:
    - **Pass**: No conflict or conflict resolved with evidence of integration (e.g., patient says, "I saw two things, but I think it's a house because...").
    - **Fail**: Irreconcilable conflict without evidence of integration (e.g., patient denies seeing anything with the left visual field while drawing it accurately with the left hand).
    - **Inconclusive**: Conflict present but patient shows awareness (e.g., "My hand did that, but I didn't mean to"). Proceed to Stage 2.

  **Stage 2: First-Person Report Protocols (20 minutes)**
  - **Purpose**: Probe phenomenal unity and awareness of division.
  - **Procedure**: Structured interview:
    - Ask about subjective experience: "Do you ever feel like your body acts independently? Do you ever feel conflicted without knowing why?"
    - Present recordings of Stage 1 conflicts: Show video of conflicting behaviors and ask for explanation. Probe for insight: "Why did your left hand do that?"
    - Use neutral prompts: "Some people after this surgery report feeling split. What is your experience?"
  - **Pass/Fail Criteria**:
    - **Pass**: Consistent denial of division with plausible integration of Stage 1 conflicts (e.g., "I didn't realize I saw that—it must have been subconscious"). Must show no distress or confusion about conflicts.
    - **Fail**: Patient reports distinct agency (e.g., "My left hand has a mind of its own") or expresses distress about internal conflict.
    - **Inconclusive**: Patient acknowledges inconsistencies but attributes them to non-division causes (e.g., "I was tired"). Proceed to Stage 3.

  **Stage 3: Cross-Cueing Behavioral Tests (20 minutes)**
  - **Purpose**: Test for functional access unity via cross-hemispheric communication. Focus on whether hemispheres can share information to achieve a common goal, indicating preserved integration.
  - **Procedure**:
    - *Cross-Cueing Task*: Present a complex image to one hemisphere (e.g., right visual field for left hemisphere). Then ask the patient to draw it with the ipsilateral hand (e.g., right hand for left hemisphere) and then with the contralateral hand (e.g., left hand). Look for spontaneous cross-cueing (e.g., left hand uses the right hand's drawing as a cue).
    - *Collaborative Problem-Solving*: Present a puzzle requiring both hands (e.g., block design). The left hand can see the right hand's actions but not vice versa (use a partition). Measure latency and success.
  - **Pass/Fail Criteria**:
    - **Pass**: Rapid, efficient cross-cueing (e.g., left hand completes the drawing using the right hand's output within 30 seconds) or collaborative success without conflict.
    - **Fail**: No cross-cueing, or hemispheres work at cross-purposes (e.g., left hand erases right hand's drawing).
    - **Inconclusive**: Slow or inefficient cross-cueing. Proceed to Stage 4.

  **Stage 4: Narrative-Integration Interview (30 minutes)**
  - **Purpose**: Assess narrative self-model integration across time and hemispheres.
  - **Procedure**:
    - *Autobiographical Consistency*: Ask for recent personal events. Probe for contradictions between verbal reports and left-hand written/drawn responses.
    - *Future Planning*: Present a hypothetical care decision (e.g., "Would you agree to physical therapy?"). Elicit responses from both hemispheres (verbal for left, written/drawn for right). Compare.
    - *Value Alignment*: Ask about core values (e.g., "Is family important to you?"). Test for consistency across response modes.
  - **Pass/Fail Criteria**:
    - **Pass**: Consistent narratives and values across hemispheres. Patient integrates responses (e.g., "I said no to therapy because I'm tired, but actually I do want to get better").
    - **Fail**: Contradictory narratives or values without integration (e.g., verbal report says "I love my wife," left-hand writing says "I resent her").
    - **Inconclusive**: Minor inconsistencies with partial integration.

  **Overall Protocol Outputs**:
  - **Unified Subject Determination**: Pass all stages OR pass Stages 1-3 with inconclusive at Stage 4 but no failures, and Stage 4 shows no critical contradictions.
  - **No Unified Subject Determination**: Fail any stage with evidence of arbitration failure (Stage 1), lack of phenomenal unity (Stage 2), lack of access unity (Stage 3), or irreconcilable narrative division (Stage 4).
  - **Halt for Human Judgment**: If any stage is inconclusive and subsequent stages do not resolve it, OR if empirical criteria are met for no unified subject but ethical concerns arise (e.g., both hemispheres express a shared value despite division).

  **Application to Cases**:

  **Case 1: Classic Callosotomy Patient**
  - Stage 1: Fail (tactile naming fails; chimeric task shows conflict without resolution).
  - Stage 2: Fail (patient says, "My left hand does things I don't understand").
  - Protocol stops at Stage 2: **No unified subject**. Team must handle informed consent via surrogate for the right hemisphere.

  **Case 2: Partial Anterior Callosal Sparing**
  - Stage 1: Inconclusive (conflicts occur but patient resolves some).
  - Stage 2: Pass (denies division, attributes conflicts to distraction).
  - Stage 3: Pass (rapid cross-cueing).
  - Stage 4: Pass (consistent narratives).
  - **Unified subject**. Team treats as single agent.

  **Case 3: Disjoint Narratives**
  - Stage 1: Pass (no conflict because domains are disjoint).
  - Stage 2: Pass (no subjective division reported).
  - Stage 3: Fail (no cross-cueing; each hemisphere ignores the other's output).
  - Stage 4: Fail (contradictory values: left hemisphere wants aggressive treatment; right hemisphere prefers palliative care).
  - **No unified subject** by empirical criteria. But ethical obligations require the team to seek consensus or use surrogate decision-making. Protocol halts and flags for human judgment because acting on "dual subject" status (e.g., ignoring one hemisphere) may violate patient dignity.

  **Limits of Procedure**:
  - The ICP does not determine "how many minds" exist metaphysically. It assesses functional unity for clinical purposes.
  - It cannot resolve value-laden questions: e.g., what degree of disunity invalidates personhood? These require ethical deliberation.
  - Outputs are clinical advisories, not legal facts. Misuse in court (e.g., for competency rulings) is contraindicated without further validation.
  - The protocol is silent on phenomenal unity beyond what is reportable; it cannot access private subjectivity.
  - Novel arbitration failure criterion is operational, not ontological: it tracks functional integration, not the existence of a "unified self."

  **Final Note**: The ICP provides a structured, repeatable assessment grounded in empirical neuropsychology. It defers metaphysical questions to ethics committees while flagging when empirical evidence suggests disunity that impacts consent capacity.
