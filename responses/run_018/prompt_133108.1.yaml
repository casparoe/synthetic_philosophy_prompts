  **Joint Statement on Causal Theory: Counterfactual and Interventionist Perspectives**

  **1. Shared Commitments**

  We, the undersigned counterfactual theorist (CT) and interventionist theorist (IT), affirm the following shared commitments:

  1.1. **Causal vs. Correlational Claims**: Causal claims assert more than mere correlational patterns. They involve a directed relationship that supports counterfactual reasoning about what would happen under changes, whereas correlations may arise from common causes, coincidences, or other non-causal dependencies.

  1.2. **Utility of Formal Representation**: Formal representations, such as structural equations, directed graphs, or possible worlds semantics, are indispensable for clarifying causal structure, avoiding ambiguities, and enabling rigorous analysis of causal relationships.

  1.3. **Empirical Testability**: A causal claim can be empirically tested, at least in principle, through controlled experiments (interventions) or, where experiments are infeasible, through systematic observation of patterns that are invariant under interventions. The core idea is that causal relationships should remain stable under appropriate manipulations.

  **2. Disagreements Table**

  The undersigned parties diverge on the following point:

  | **Issue** | **Counterfactual Theorist (CT)** | **Interventionist Theorist (IT)** |
  |-----------|-----------------------------------|-----------------------------------|
  | **Explanatory asymmetry and directionality in complex systems** | In complex systems with feedback loops and non-modular architectures, the directionality of causation and the asymmetry of explanation cannot be fully captured by invariant structural relationships and do-interventions alone. They require irreducible counterfactual dependencies that are defined in terms of possible worlds and which outstrip the resources of interventionist formalization. | In complex systems with feedback loops and non-modular architectures, the directionality of causation and the asymmetry of explanation are fully accounted for by invariant structural relationships and do-interventions. The structural causal model (SCM) framework, with its formal semantics for interventions, suffices to define and analyze causal relationships without invoking irreducible counterfactual notions beyond the interventionist calculus. |

  **3. Cruxes**

  We identify the following cruxes as pivotal for resolving our disagreement. For each, we present a concrete case and the predictions of each party.

  **Crux 1: Preemption in Cyclic Causal Graphs**

  *Case*: Consider a system with a cyclic graph: A → B → A (a feedback loop). Suppose we have an event where A is set to a value that normally causes B, but simultaneously, an external event preempts B (so B does not occur as it would from A). How do we account for the preemption without breaking the cycle? Both parties agree that this case tests the handling of preemption in cyclic structures.

  - *CT Prediction*: The counterfactual approach can handle preemption by evaluating counterfactuals in the nearest possible worlds where the preempting event does not occur, revealing that A would have caused B. This dependency is irreducible to interventions because interventions in a cyclic system may require breaking the cycle, altering the system in ways that mask the true counterfactual dependencies.
  - *IT Prediction*: The interventionist framework can handle preemption by using a modular structural model that allows for interventions on individual nodes even in cycles. The do-operator can simulate the removal of the preempting event, showing that in the intervened system, A does cause B. No irreducible counterfactual notions are needed.

  **Crux 2: Semantic Status of Physically Impossible Interventions**

  *Case*: Consider an intervention that sets a variable to a value that is physically impossible (e.g., setting the position of an electron beyond the speed of light). Both parties agree that the meaningfulness of such interventions is central to the interpretation of causal claims.

  - *CT Prediction*: Counterfactual theory can assign meaning to such interventions by considering possible worlds that may violate physical laws but are otherwise similar. The truth of counterfactuals does not require physical possibility, only logical or metaphysical possibility. Thus, causal claims can be evaluated even under physically impossible interventions.
  - *IT Prediction*: The interventionist framework restricts interventions to those that are feasible within a given model. Physically impossible interventions are either excluded or handled by model expansion (if possible) but are not essential for defining causality. The do-operator is defined only for interventions that are logically consistent with the structural model, and physical impossibility may render an intervention undefined.

  **Crux 3: Criteria for Model Selection in Underdetermined Settings**

  *Case*: When observational and interventional data underdetermine the causal structure (e.g., two distinct graphs are compatible with all available data), what criteria should be used to select the correct model? Both agree that this tests the principles for model selection.

  - *CT Prediction*: Counterfactual theory relies on intrinsic properties of the system, such as the spatiotemporal arrangement of events and the naturalness of properties, to break underdetermination. The correct model is the one that captures the true counterfactual dependencies in the actual world, even if it is not uniquely determined by data.
  - *IT Prediction*: The interventionist framework uses principles such as minimality, stability, and invariance under interventions to select among models. The correct model is the one that is most invariant and parsimonious, and it must be validated through further interventions. Counterfactual considerations beyond interventions are not required.

  **4. Joint Assessment of Verbal vs. Substantive Disagreement**

  We jointly assess that our disagreement is not purely verbal. Both parties agree on the formal apparatus of causal modeling (e.g., the use of variables and structural equations) and the importance of interventions for testing. However, the dispute centers on whether the interventionist formalization is sufficient for capturing all causal concepts, particularly in complex systems. The counterfactual theorist maintains that the asymmetry and directionality of causation in such systems require a modal notion that transcends interventions, while the interventionist theorist holds that the structural model and interventions are sufficient. This is a substantive disagreement about the conceptual resources necessary for causation, and it may have implications for how we model and reason about complex systems in science.
answer: |-
  **Joint Statement on Causal Theory:  
  Counterfactual and Interventionist Perspectives**  

  **1. Shared Commitments**  
  We affirm the following foundational principles:  
  1.1. **Causal vs. Correlational Claims**: Causal claims assert directed relationships of dependence that support counterfactual inferences about how effects would change under hypothetical alterations to causes. Such claims are distinct from correlational claims, which identify undirected patterns of association that may arise from confounding, selection bias, or coincidence.  
  1.2. **Utility of Formal Representation**: Causal relationships are best analyzed through formal frameworks (e.g., structural equations, directed acyclic graphs, or possible-worlds semantics) that disambiguate structure, support precise inference, and reveal latent assumptions.  
  1.3. **Empirical Testability**: A causal claim is empirically testable only if it implies invariant patterns under interventions—whether actual or hypothetical—that disrupt existing dependencies. Observational data alone are insufficient for causal confirmation; interventional data (physical or simulated) are necessary to distinguish causation from correlation.  

  ---

  **2. Disagreements Table**  
  The undersigned diverge irreducibly on the following:  

  | **Issue** | **Counterfactual Theorist (CT)** | **Interventionist Theorist (IT)** |
  |-----------|-----------------------------------|-----------------------------------|
  | **Explanatory asymmetry and directionality in complex systems** | In feedback-rich, non-modular systems (e.g., ecological or neural networks), directionality and explanatory asymmetry cannot be reduced to structural relationships and *do*-interventions. They inherently depend on irreducible counterfactual dependencies grounded in similarity metrics over possible worlds, which transcend interventionist formalization. | In feedback-rich, non-modular systems, directionality and explanatory asymmetry are fully explicable via invariant structural equations and *do*-interventions. Asymmetry emerges from the formal properties of the model (e.g., autonomy of equations), without recourse to extra-interventional counterfactual primitives. |

  ---

  **3. Cruxes**  
  Resolution of these cruxes would substantively alter one party’s position:  

  **Crux 1: Preemption in Cyclic Graphs**  
  *Case*: A system with cyclic feedback (e.g., neuron A → neuron B → neuron A). If A fires, causing B to fire preemptively, forestalling B’s activation by other causes, but the cycle obscures linear order. Both agree this tests asymmetric dependence in loops.  
  - *CT Prediction*: Preemption reveals intrinsic directionality: B’s state counterfactually depends on A in the actual sequence, even if interventions on A and B yield symmetric data. Asymmetry is verified via non-interventional counterfactuals (e.g., "Had A not fired, B would not have fired preemptively").  
  - *IT Prediction*: Interventions dissect preemption: Holding B fixed while intervening on A breaks the cycle, exposing asymmetry. No counterfactual surplus is needed; *do*-calculus distinguishes genuine dependence from feedback artifacts.  

  **Crux 2: Physically Impossible Interventions**  
  *Case*: Assessing "The moon’s mass causes tides" under an intervention setting the moon’s mass to zero—a physical impossibility given gravitational laws. Both agree this probes causal semantics under nomological violation.  
  - *CT Prediction*: The claim holds via non-physical counterfactuals (e.g., worlds where mass is absent without altering gravity’s laws). Truth depends on broader modal relations, not operational intervenability.  
  - *IT Prediction*: Such interventions are undefined; causality requires interventions compatible with the structural model’s feasibility constraints. The claim must be re-expressed via possible interventions (e.g., varying mass within plausible ranges) or dismissed as non-causal.  

  **Crux 3: Model Selection in Underdetermined Structures**  
  *Case*: Observational and interventional data equally support two cyclic models: (1) X → Y → X and (2) Y → X → Y. Background knowledge is absent. Both agree this tests epistemic foundations.  
  - *CT Prediction*: Underdetermination is resolved by counterfactual "closeness" (e.g., spatiotemporal contiguity or naturalness of variables), favoring the model aligning with intrinsic dependencies in the actual world.  
  - *IT Prediction*: Underdetermination persists until new interventions break symmetry (e.g., stochastic interventions on X/Y). Minimality or stability principles may guide choice, but no extra-interventional criteria are admissible.  

  ---

  **4. Joint Assessment of Verbal vs. Substantive Disagreement**  
  We concur that our dispute is not purely verbal. Both frameworks use "counterfactuals" technically (CT: possible-worlds conditionals; IT: *do*-operator outputs). Yet divergence persists: CT demands counterfactual dependencies that constrain but exceed interventionist semantics (e.g., asymmetric dependencies in non-modular systems), while IT holds that interventions exhaust causal content. This reflects a substantive disagreement about the ontology of directionality—whether it is wholly encoded in intervenable structures or requires irreducible modal relations. Resolving this necessitates addressing the cruxes above.
