prompt: |-
  Hi there. I'm a novelist — four books, you've definately never heard of them — and for about a year now I've been keeping a notebook on my own bullshit, mostly how often I know what's going on in my own head versus how often I'm just narrating. I've ended up with a pile of verdicts and no principle, and it's starting to bug me while I work.

  Here's what I think, case by case.

  1. A reader writes to say my character Lena slaps her sister because she's ashamed of being pitied, not because she's jealous. I'd have said jealous, no hesitation. Reading his email I get this hot click of yes — but I also know I'd have got the same click if he'd said the opposite. Verdict: before the email, my report on my own character's motive wasn't knowledge in any useful sense. After the email I'm not sure it is either.

  2. A friend says I'd stop writing if the money stopped. I say no, instantly, total certainty, and I can't produce a single reason. Verdict: trustworthy. There's no evidence for it and I still trust it.

  3. I told an interviewer the ending of book two came from a dream about my grandmother. Notebook says: no dream. Three drafts of that ending, all after a phone call with my agent. Verdict: worthless. I confabulated a source, and I believe I'd have passed a lie detector on it.

  4. Whether a sentence feels wrong as I'm writing it. I trust this completely — it's the only thing I actually revise on — and I can't say what the wrongness consists in. Verdict: real and authoritative.

  5. The pair I keep going in circles on. (a) I say I don't care about reviews. My chest goes tight when a certain critic's name appears in my inbox. I still want to say my I don't care is true — the tight chest is plumbing, not attitude. (b) My character Marta insists she is not in love with the married man, and keeps inventing errands that take her past his house. As her author I say with total certainty that her denial is false. These two are the same shape and I want opposite verdicts on them. Probably I'm special-pleading for myself.

  6. Whether I was aware of the fridge humming while I wrote chapter nine. I can't tell now and I don't think I could have told then either, even mid-sentence. Verdict: not a question introspection gets to answer at all.

  7. At nineteen I said, in letters I still have, that I was happy. Now I say I was miserable and didn't know it. Verdict: present me beats past me, even though past me was the one standing there.

  8. My own term for it, the green-room effect: once I've read a passage aloud to myself a few times it starts to feel inevitable, like it couldn't be any other way, and after that I can't tell whether it's any good. So I've started distrusting my judgment on exactly the passages I've rehearsed most. Verdict: the act of checking wrecks the very signal I rely on in case 4.

  9. A grad student sent me a Lacanian reading of my second book and I promptly remembered that I'd intended the wallpaper in chapter four as womblike. Verdict: contaminated. I think the memory was manufactured by reading his essay and I don't think I can recover what I actually intended.

  10. Whether a line of mine was meant ironically. I say yes, ironically. Everyone reads it straight. My editor says cut it. I mostly back myself here, but only because irony feels like case 4 — a feel — rather than case 3, a story about where it came from.

  So: is there one principle that sorts these, or do I need two? My own guess is something like — I'm authoritative about what it's like for me right now and about whether a thing feels finished, and I'm just another interpreter, with bad data and a theory, when it comes to causes, motives and my own past. But that guess doesn't obviously handle 5(b), where I'm not the subject at all and yet claim certainty, or 8, where the thing I'm authoritative about gets destroyed by the checking.

  What I'd like: state the principle precisely enough that I could apply it cold to a case I bring you next month. Then run it on the two I don't have verdicts on yet — (i) there's a paragraph in the new manuscript I have no memory of writing, none at all, and my daughter does sometimes mess with the file: do I know anything here, and what? (ii) my narrator: do I know why I switched him from first person to third, or is that just case 3 with better tailoring? And please tell me straight which of my ten verdicts your account can't save and has to overturn, and why that one and not another. Don't be polite about it, I'd rather have it clean than have it flattering.
reasoning: |-
  Okay, let's tackle this novelist's problem. They've been keeping a notebook analyzing their own self-awareness versus self-narration and have ten case studies with verdicts. Now they're looking for a unifying principle to apply to future cases. 

  First, I need to understand their core struggle. They're distinguishing between moments of genuine self-knowledge ("what it's like for me right now") and constructed narratives ("just narrating"). Their proposed principle splits authority between present phenomenology (feelings, aesthetic judgments) and interpretive uncertainty about causes/motives/past states. But it struggles with cases like 5b (certainty about fictional character's motives) and 8 (self-checking corrupting the signal).

  Hmm... the key might be distinguishing between different types of mental acts. Let me sketch a framework:
  - Type 1: Direct phenomenological access (current sensory/emotional/aesthetic experience)
  - Type 2: Introspective judgments (claims about why we feel/act certain ways)
  - Type 3: Constructed narratives (explanatory stories we tell ourselves/others)

  Case 4 (sentence feeling wrong) clearly falls under Type 1 - it's immediate and pre-reflective. Case 3 (confabulated dream) is pure Type 3. Case 5b is interesting - when creating fiction, authors operate in a hybrid space where character motives feel phenomenologically present (Type 1) despite being technically interpretive (Type 3).

  For the unresolved cases: 
  (i) The forgotten paragraph - without phenomenological markers ("this doesn't feel like my writing"), they have no privileged access. It's just another interpreter's problem. 
  (ii) The POV switch - unless they recall a specific moment of decision (unlikely), this is probably confabulation like case 3.

  Now the tough part: which of their verdicts need overturning? Case 5a is problematic - claiming "I don't care about reviews" while having physical reactions suggests their proposed principle is too generous about present-state authority. The bodily reaction is part of current phenomenology! Need to downgrade that verdict.

  Also case 2 (writing for non-monetary reasons) - their certainty might be authentic Type 1 phenomenology, but could also be identity-protective Type 3 narrative. Should flag that as potentially overtrusted.

  The green-room effect (case 8) is fascinating - it shows how repeated checking can morph Type 1 into Type 3. The very act of interrogation replaces the raw feeling with a rehearsed narrative. This doesn't break the framework but reveals its fragility.

  For the application step, I'll need to show exactly how to apply the three-part test to new cases: 
  1. Is this about current phenomenology? (if yes, provisional authority) 
  2. Is it a causal/motivational claim? (if yes, high skepticism) 
  3. Has interrogation corrupted the signal? (if yes, distrust)

  The character motive certainty (5b) gets special status because fiction operates under "authorial phenomenology" - when creating, the character's reality is the author's present experience. That resolves the tension.

  Final check: does this handle all ten cases better than their original proposal? Case 6 (fridge noise) - correctly categorized as non-introspectable. Case 9 (Lacanian wallpaper) - shows contamination of memory narrative. Case 10 (irony) - correctly privileged as present aesthetic judgment. Yeah, this holds up.

  The overturned verdicts will sting, but they asked for straight talk. Better to show exactly where their self-assessment was too kind.
answer: |-
  Here's a principled framework distilled from your cases, designed for cold application. I'll state it precisely, apply it to your unresolved cases, then flag which of your verdicts must be overturned and why.

  ---

  ### **The Principle: The Authority Gradient**
  **You have first-person authority *only* over:**  
  (A) **Current phenomenology** (what it’s *like* for you *right now*: sensations, emotions, aesthetic judgments in the moment).  
  (B) **Aesthetic completion** (whether a creative work *feels* finished *as you experience it*).  

  **You have *no* special authority over:**  
  (C) **Causal narratives** (origins, motives, past mental states, or reasons for actions/decisions).  
  (D) **Interpretive claims** (meaning of your work, your own psychology, or others’ minds), *unless* they reduce to (A) or (B).  

  **Corollary:** Authority degrades when you:  
  - Introspect *retrospectively* (past states become narratives).  
  - Over-scrutinize (A) or (B), collapsing them into (C) or (D).  
  - Confuse *feeling certain* with *having evidence*.  

  ---

  ### **Applied to Your Unresolved Cases**
  **(i) The paragraph you don’t recall writing:**  
  - **Authority?** None.  
  - **Why?** This is (C): a causal claim about past action. Your lack of memory doesn’t grant insight—it creates a vacuum filled by narratives (e.g., "my daughter tampered with it"). You might assess if the paragraph *feels* alien (A), but that’s about *current* aesthetics, not authorship.  
  - **Verdict:** Treat like case 3 (confabulation risk). Without external data (e.g., file timestamps), you "know" nothing.  

  **(ii) Why you switched narrator POV:**  
  - **Authority?** None.  
  - **Why?** This is (C): a causal claim about a past decision. Even if you "remember" a reason, it’s likely post-hoc tailoring (as you suspect). Compare to case 3 (dream vs. agent call). Your certainty about *present* reasons (e.g., "third person feels right now") is (A), but the *why* is mythmaking.  
  - **Verdict:** Case 3 with better tailoring.  

  ---

  ### **Overturned Verdicts & Why**
  Your principle was largely sound, but these verdicts conflict with the Authority Gradient:

  1. **Case 2 (Writing without money):**  
     - **Your verdict:** Trustworthy.  
     - **Overturn:** **Untrustworthy.**  
     - **Why:** Your certainty is a *feeling* (A), but the claim ("I’d keep writing") is a predictive causal narrative (C) about future behavior. Feelings aren’t evidence (see case 7: past "happiness" was unreliable). Like case 1, you’d likely feel the same click if your friend claimed the opposite.  

  2. **Case 5a (Not caring about reviews):**  
     - **Your verdict:** Your claim is true; physical reaction is "plumbing."  
     - **Overturn:** **Unreliable.**  
     - **Why:** Your bodily tension (A) *is part of* your present phenomenology. Dismissing it as "plumbing" ignores that (A) *includes* embodied responses (see case 4, where bodily "wrongness" is trusted). Claiming "I don’t care" is a narrative (C) contradicted by your physiology.  

  ---

  ### **Why Other Verdicts Stand**
  - **Case 1:** Correct—no authority on motives (C).  
  - **Case 3:** Correct—confabulated cause (C).  
  - **Case 4:** Correct—current aesthetic judgment (A).  
  - **Case 5b:** Correct—authority over character’s motive *as part of the work’s present logic* (B).  
  - **Case 6:** Correct—non-introspectable (not A or B).  
  - **Case 7:** Correct—past self’s report was (C), not (A).  
  - **Case 8:** Correct—scrutiny corrupts (A) into (C).  
  - **Case 9:** Correct—contaminated narrative (C).  
  - **Case 10:** Correct—irony as aesthetic feel (A), not origin story.  

  ---

  ### **Special Notes**
  - **Case 5b’s "certainty"** is preserved because it’s an *aesthetic judgment* (B): you’re the final arbiter of your fictional world’s internal logic. Marta’s denial feels "false" *to you as creator* because it clashes with the narrative’s design. This isn’t mind-reading—it’s authorship.  
  - **Case 8’s "signal destruction"** fits the Corollary: over-checking converts (A) into (C).  
  - **The overturned cases** share a flaw: mistaking *subjective conviction* for *knowledge*. Your framework must treat all causal/predictive claims (even emotional ones) as suspect.  

  Use this cold next month: if it’s about *how it feels now* or *if it’s done*, trust yourself. If it’s about *why*, *where from*, or *what it means*, assume you’re confabulating. The body lies least in the present tense.
