answer: |-
  Your insight cuts to the heart of the problem of induction and scientific demarcation. While there's no universally agreed-upon name for this specific asymmetry, philosophers recognize it as a manifestation of **justification asymmetry between stipulated predicates and empirically grounded domain restrictions**. Here's how to understand the distinction:

  ### Core Issue: The Double Standard You Observe
  1. **Grue-style predicates** (e.g., "grue" = green before 2025, blue after) are rejected because:
     - The boundary (t=2025) is *stipulated without empirical justification*.
     - The predicate is *disjunctive* and *non-projectible* – it doesn't support predictions.
     - It's *gerrymandered* to fit past data without theoretical basis.

  2. **Scientific domain restrictions** (e.g., "except in pediatrics" or "not at quantum scales") are accepted because:
     - They are *empirically discovered* through anomalies or systematic testing.
     - They *generate new research programs* (e.g., pediatric pharmacology, quantum gravity).
     - They *integrate into a broader theoretical framework* with explanatory power.

  ### Key Distinctions & Philosophical Frameworks
  1. **Natural vs. Artificial Kinds** (Quine, Boyd):
     - Legitimate restrictions track *causal structures* or *natural kinds* (e.g., developmental biology explaining pediatric differences).
     - "Grue" is an artificial kind lacking causal unity.

  2. **Projectibility** (Goodman's own criterion):
     - Scientific restrictions are *projectible*: They predict *new* phenomena (e.g., quantum effects in novel materials).
     - Grue predicates are non-projectible – they only redescribe known data.

  3. **Auxiliary Hypotheses vs. Ad Hoc Excuses** (Lakatos, Popper):
     - Valid restrictions are *progressive auxiliary hypotheses*: They lead to novel predictions (e.g., "except pediatrics" → pediatric clinical trials).
     - Grue-like moves are *degenerative*: They protect a theory without adding content.

  4. **Robustness under Testing** (Wimsatt, Hacking):
     - Scientific domains are bounded through *multiple lines of evidence* (e.g., drug metabolism studies + developmental biology).
     - Grue boundaries are fragile – a single counterexample destroys them.

  ### Why This Isn't *Just* the Standard Problem of Induction
  While rooted in induction, this asymmetry highlights **epistemic responsibility**:
  - **Grue scenarios** involve *willful disregard of parsimony* – introducing complexity without necessity.
  - **Scientific domain restrictions** are *responses to empirical friction* – driven by data that forces boundary-setting.

  ### How to Spot "Grue-ification" in Science
  A restriction is suspect if it:
  1. **Lacks a mechanistic basis** (e.g., "except on Tuesdays")
  2. **Fails to generate new research** (pure defensive maneuver)
  3. **Is inconsistent with broader theories** (e.g., restricting gravity to "only on Earth" conflicts with astrophysics)
  4. **Uses arbitrary parameters** (e.g., "fails at 42°C" without molecular rationale)

  ### The Unnamed Distinction
  You're right that this asymmetry lacks a universal label, but it sits at the intersection of:
  - **Selective Projectibility** (W. Salmon)
  - **Theoreticity of Predicates** (Carnap)
  - **Normative Natural Kinds** (Boyd)

  Call it **"The Justification Asymmetry for Domain Restriction"** or **"Empirical vs. Stipulated Boundary Problem."**

  ### Practical Resolution
  Science navigates this through **consilience**:
  - A domain restriction gains legitimacy when:
    - Multiple independent methods reveal the boundary (e.g., spectroscopy + thermodynamics for quantum effects)
    - It explains *why* the exception occurs (e.g., liver enzyme ontogeny in pediatrics)
    - It predicts *where else* boundaries should exist (e.g., quantum effects in nanoscale devices)

  **Grue-like moves collapse under this scrutiny; legitimate domain restrictions become fertile ground for new science.** The difference isn't in logical form but in *epistemic traction* – one stalls inquiry, the other advances it.
