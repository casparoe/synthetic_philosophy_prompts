  Below is an 8-question "Which Demarcationist Are You?" quiz designed to sort students into demarcationist positions based on concrete case judgments (astrology, Freudian psychoanalysis, cold fusion, and string theory). The quiz avoids direct references to philosophers and focuses on case-based reasoning. The scoring key maps answer combinations to five positions: **naive falsificationism**, **sophisticated falsificationism**, **Lakatosian research programmes**, **Kuhnian historical view**, and **Laudanian dissolutionism**. 

  Each question forces a choice between concrete claims, and the scoring key identifies:
  - Which positions are covered by which answer combinations.
  - Which combinations are **incoherent**, **unattractive**, or **underexplored**.
  - Where cases **cannot cleanly separate** positions (noted explicitly).

  ---

  ### **The Quiz: Which Demarcationist Are You?**  
  *Answer based on your judgments of these scientific cases: astrology, Freudian psychoanalysis, the cold fusion episode, and string theory.*  

  1. **When an astrological prediction fails (e.g., a horoscope doesn’t come true), does this mean astrology as a whole is falsified?**  
     A) Yes—any failed prediction falsifies the core theory.  
     B) No—astrologers can tweak interpretations to save it (e.g., blame user error).  

  2. **In the cold fusion case, researchers explained failed replications by adding new assumptions (e.g., "the water was impure"). Is this move inherently unscientific?**  
     A) Yes—saving a theory with ad hoc fixes is pseudoscience.  
     B) No—it’s normal science to adjust auxiliary hypotheses.  

  3. **Freudian psychoanalysis can explain any human behavior (e.g., "repression" for denial, "sublimation" for creativity). Does this flexibility make it unscientific?**  
     A) Yes—if it explains everything, it tests nothing.  
     B) No—it’s a strength if the theory coheres with clinical evidence.  

  4. **Should cold fusion have been abandoned after early replication failures, or did it deserve more time?**  
     A) Abandon immediately—it failed critical tests.  
     B) More time—new setups might have confirmed it.  

  5. **String theory has no experimental tests after 40+ years. Is it still scientific?**  
     A) No—science requires empirical testability.  
     B) Yes—theoretical progress justifies ongoing work.  

  6. **Is a theory’s long-term trajectory (e.g., 20+ years of puzzles and adjustments) more important than single tests?**  
     A) No—single decisive tests matter most.  
     B) Yes—time reveals if a programme progresses or degenerates.  

  7. **Can the same demarcation criteria (e.g., falsifiability) apply to all eras of science?**  
     A) Yes—good science is timeless.  
     B) No—what counts as science changes historically.  

  8. **Is the science/pseudoscience divide even a real problem?**  
     A) Yes—demarcation protects rationality.  
     B) No—it’s a distraction; focus on problem-solving.  

  ---

  ### **Scoring Key**  
  Use the table below to match your answers (e.g., 1A, 2B, 3A...) to a position. Positions are defined by:  
  - **Naive falsificationism**: Failure kills single hypotheses immediately.  
  - **Sophisticated falsificationism**: Failure is about ad hoc adjustments (not falsifiability alone).  
  - **Lakatosian**: Failure attaches to whole programmes over time (progressive vs. degenerative).  
  - **Kuhnian**: Demarcation is historical; no timeless criteria.  
  - **Laudanian**: Demarcation is a pseudo-problem.  

  | Answer Combination (1→8) | Position                          | Notes                                                                 |
  |---------------------------|-----------------------------------|-----------------------------------------------------------------------|
  | **A, A, A, A, A, A, A, A** | Naive falsificationism           | Consistent rejection of adjustments.                                |
  | **A, A, A, A, A, A, A, B** | *Incoherent*                     | Rejects demarcation (8B) but demands falsification (1-7A).           |
  | **B, A, A, A, A, A, A, A** | Sophisticated falsificationism   | Allows tweaks (1B) but punishes ad hoc saves (2A, 3A, 4A).           |
  | **B, B, A, A, A, A, A, A** | *Underexplored*                  | Admits adjustments (1B,2B) but rejects flexibility (3A) — unstable.  |
  | **B, B, B, B, A, A, A, A** | *Unattractive*                   | Tolerates cases (1-4B) but demands timeless falsifiability (5-7A) — tension. |
  | **B, B, B, B, B, B, B, A** | Lakatosian or Kuhnian            | *Cases cannot separate*: Both accept long-term focus (6B) and historical context (7B). Distinction requires philosophy (not cases). |
  | **B, B, B, B, B, B, B, B** | Laudanian                        | Rejects demarcation (8B), focuses on problem-solving.              |
  | **B, B, B, B, B, A, B, A** | Lakatosian                       | Requires progress over time (6B) but keeps timeless criteria (7A).   |
  | **B, B, B, B, B, B, A, B** | Kuhnian                          | Historicist (7B) and anti-timeless (7A).                             |

  #### **Clarifications on Gaps and Overlaps**  
  - **Incoherent combinations**: e.g., 8B (demarcation is fake) + 1–7A (strict falsification). Cases expose this tension (e.g., astrology tweaks).  
  - **Unattractive/Underexplored**: e.g., allowing adjustments (1B,2B) but rejecting Freud’s flexibility (3A). No major position holds this—cases reveal instability.  
  - **Cases cannot separate Lakatos and Kuhn**: Both judge programmes over time (6B) and accept historical shifts (7B). Cold fusion/string theory judgments align for both; only philosophical context (e.g., "timeless criteria?") distinguishes them.  
  - **Laudanian unique**: 8B (demarcation is a distraction) overrides other answers.  

  ---

  ### **How to Use**  
  1. Students complete the quiz individually.  
  2. Use the scoring key to assign positions. Highlight gaps/overlaps to spark discussion.  
  3. **Discussion prompts**:  
     - "If you got Lakatosian/Kuhnian, how would Popper vs. Kuhn judge cold fusion differently?"  
     - "Why might Laudan say astrology vs. Freud is the wrong debate?"  
     - "Can ad hoc adjustments ever be legitimate? Debate using cold fusion."  

  This approach replaces lecturing with active sorting, using cases to expose fault lines in demarcation (e.g., single-hypothesis vs. programme-level failure). Tailor explanations using the students’ assigned positions.
