t model collapses back into explicit premises or cant handle corrections at all. also please be honest about scope: this is small so i cant do a full history of deduction but i can do the conceptual mapping and testing. please write the whole thing in continuous prose only, no headings, bullet points, bold text, or tables, just like an email or a letter, and dont include a bibliography or reading list since ill fill in the references myself. oh and i should mention im taking this course right now so the framing should sound like a student who has read carroll but is still figuring out how the literature hangs together. also maybe include a typo or two since thats how i actually write emails.
