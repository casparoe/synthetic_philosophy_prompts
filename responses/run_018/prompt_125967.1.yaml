prompt: |-
  I'm giving a talk at our interschool philosophy-science symposuim next tuesday—I'm a senior and this is for my AP Bio capstone, but I'm framing it for philosophy kids too. The thesis I'm defending is kind of a twist on Gould and Lewontin's spandrels idea: everyone teaches that spandrels are just useless byproducts, but I'm arguing they're actually silent scaffolding—structural leftovers that don't do anything at first but create the physical or cognitive space that makes later exaptations possible. So adaptationists aren't wrong that traits get optimized, they're just missing the first phase where the spandrel has to exist before co-option can happen. I call it the two-phase scaffolding model, and I'm using human brain lateralization as my example even though the data is pretty messy.

  The audience is about twenty people—mostly biology undergrads and some other high schoolers—but the judges who'll grill me are two evolutionary psychologsts who think every mental trait is an adaptive module, plus one philosophy of science prof who loved Gould in college but hasn't kept up with exaptation literature. I need you to act like my debate coach who actually knows evolutionary biology and philosophy of science. Please think step by step and start with a quick brainstorm of the worst things they could ask.

  Draft my Q&A prep sheet: list the objections in roughly the order they'll come, phrased the way an evolutionary psychologist or a Gould loyalist would actually say them. For each one, give me a 90-second reply I can actually say out loud, plus an honest note on where that reply is weakest. I also need to know what I should concede right up front so they don't think I'm dodging. And please include the question I'm hoping nobody asks—probably something about direct empirical proof of spandrels in human cognition, since that's where I'm on thin ice. Don't give me a bibliography or reading list, I won't have time to check names during Q&A and I don't want to guess citations. Don't quote any real papers verbatim unless you can fetch the actual text—just paraphrase. Also please assign yourself the role of an expert who understands high school debate format and can spot where I'm being naive.

  Oh, and I was discussing with my friends last night and we realized that if spandrels are everywhere, then just-so stories might actually be unavoidable? I'm not sure if that helps me or hurts me—work that into the prep.
