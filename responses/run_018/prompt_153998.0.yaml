answer: |-
  ## The Category Error of Blame: Towards a Framework of Distributed Institutional Responsibility in Cold War Historiography

  The enduring preoccupation with identifying "who started the Cold War" represents a profound category error within historical analysis. This framing, implicitly underpinning the traditional tripartite division of Cold War historiography, imports notions of individual culpability and singular causation – concepts more suited to moral psychology or legalistic inquiry – into the complex, systemic, and multi-agent realm of international relations history. Consequently, the question itself retains little analytical value and ought to be superseded by a framework focused on **distributed institutional responsibility**. This approach eschews the futile search for a primary culprit or definitive "first move," instead assigning explanatory weight to the **structural conditions and institutional architectures** that rendered escalation rational and seemingly necessary for each side at successive historical junctures, ultimately transforming discrete actions into an irreversible systemic confrontation.

  ### The Shared Flaw: Unitary State Agency in Orthodox Historiography
  While fiercely divided empirically, the traditionalist, revisionist, and post-revisionist schools are united by a flawed metaphysical premise: the reification of the state as a unitary, intentional agent capable of singular "blame" for initiating the conflict.

  1.  **Traditionalism:** Casts the Soviet Union (personified by Stalin) as the unambiguous initiator, attributing blame to Soviet expansionism, ideological aggression, and the imposition of satellite regimes in Eastern Europe. The state apparatus is treated as a monolithic extension of Stalin's will, initiating hostilities through acts like the Berlin Blockade.
  2.  **Revisionism:** Shifts blame primarily onto the United States, emphasising American economic imperialism (e.g., the Open Door policy), atomic diplomacy, and the aggressive containment strategy embodied by the Truman Doctrine. Here, US state institutions are often portrayed as instruments of capitalist expansion, intentionally provoking Soviet insecurity.
  3.  **Post-Revisionism:** Adopts a seemingly more nuanced "mutual responsibility" or "interactionist" stance, acknowledging actions and reactions from both sides. However, it still largely operates within the "blame" paradigm, albeit diffused. It identifies specific decisions (e.g., Kennan's Long Telegram, Soviet actions in Poland) or structural factors (mutual misperception, security dilemmas) but ultimately traces the *onset* back to the aggregated "fault" of these two unitary actors reacting to each other.

  The critical flaw common to all three is the treatment of states as cohesive, intentional entities whose actions can be judged in a manner akin to an individual's moral choices. This obscures the internal bureaucratic dynamics, institutional imperatives, competing factions, and structural constraints that *produced* the decisions labelled as "initiatory" by each school. Resolving their empirical disputes – whether Stalin was inherently expansionist or reacting defensively, whether US policy was driven by genuine security concerns or economic ambition – **does nothing to address this foundational conceptual error**. Even a perfectly accurate empirical account of state decisions remains trapped within the individualistic blame framework, failing to capture the systemic logic driving escalation.

  ### Initiatory vs. Enabling Causation: Dissecting the Escalation Process
  To move beyond blame requires a crucial conceptual distinction:

  *   **Initiatory Causation:** Refers to specific, identifiable decisions or events that constituted the *first overt hostile moves* within the developing conflict sequence. Examples might include the Soviet imposition of communist governments in Poland and Romania (1945-47), the articulation of the Truman Doctrine (1947), or the Soviet rejection of the Marshall Plan (1947). This is the level at which the historiographical schools focus their "blame" arguments.
  *   **Enabling Causation:** Encompasses the **structural conditions and institutional architectures** that created the context within which discrete initiatory actions became not only possible but *rational and likely* for the actors involved, and crucially, which ensured that such actions triggered an escalatory spiral rather than being absorbed or mitigated. This includes:
      *   The institutionalised mistrust stemming from wartime experiences and ideological antipathy.
      *   The bureaucratic momentum within state apparatuses (e.g., military planning, intelligence communities, foreign ministries) generating threat assessments and policy options predicated on worst-case scenarios.
      *   The inherent security dilemma dynamics of the nascent bipolar system.
      *   The absence or weakness of effective multilateral institutions capable of mediating disputes (e.g., the UN's limitations).
      *   Path dependencies created by war termination arrangements (e.g., the division of Germany, Soviet occupation of Eastern Europe).
      *   Domestic political pressures and institutional cultures within both superpowers that constrained leaders' choices and incentivised hardline postures.

  The core argument is this: **Blame, if applicable at the macro-historical level, should attach primarily to the *maintenance* or *failure to alter* enabling conditions, rather than to specific initiatory acts.** Initiatory acts are symptoms erupting from a diseased system; focusing solely on the symptom misdiagnoses the malady. It was the persistence of institutional structures and systemic pressures that made each "first hostile move" by either side appear rational and necessary *from their perspective*, and crucially, that guaranteed a reciprocal and escalatory response, locking in confrontation.

  ### Illustrating Distributed Responsibility: 1945-1947
  Applying this framework to the pivotal 1945-1947 period reveals the inadequacy of assigning "start" blame to any single event:

  1.  **Breakdown of the Grand Alliance:** This was not a single event but a process driven by *enabling conditions*. The lack of institutionalised trust-building mechanisms beyond the wartime alliance, the inherent contradictions in Allied aims (democracy vs. security spheres), and the bureaucratic inertia within both Soviet and Western foreign policy establishments geared towards post-war rivalry, actively *enabled* mutual suspicion to fester. Specific actions (e.g., Soviet actions in Poland, Western non-recognition) were *initiatory* sparks, but they ignited only because the enabling conditions – the dry tinder of institutionalised mistrust and the security vacuum – were already pervasive.
  2.  **The Truman Doctrine (1947):** Viewed through the blame lens, this is often seen as a US "initiation" of global containment. However, its logic was *enabled* by institutional factors: the State Department's bureaucratic framing of Soviet actions as monolithic expansionism (e.g., Kennan's Long Telegram), the institutional power of the US military-industrial complex emerging from WWII, the Congressional institutional culture primed by wartime propaganda to accept anti-communist narratives, and the *absence* of robust alternative diplomatic frameworks. Truman's speech was an initiatory act *made rational* by these institutional structures.
  3.  **The Marshall Plan (1947) & Soviet Rejection:** The Marshall Plan, while framed as altruistic, was institutionally designed to integrate Western Europe under US leadership, excluding Soviet influence. Its structure *enabled* Soviet perceptions of encirclement and economic warfare. The Soviet Politburo's subsequent rejection and the creation of Cominform were *initiatory* moves solidifying the bloc divide. Crucially, these were not free choices; they were dictated by the *enabling conditions* of deep-seated Soviet institutional paranoia, the imperative to control Eastern Europe as a buffer (a security structure solidified by 1947), and the absence of a credible alternative pan-European recovery framework acceptable to both blocs.

  No single event "started" the Cold War in a moral sense. The Truman Doctrine didn't cause the Soviet actions preceding it, nor did Soviet actions in Poland solely cause the Marshall Plan. Instead, **distributed institutional responsibility** operated: decision-making bodies within both superpowers, operating under distinct institutional logics, ideological frameworks, and systemic pressures (the enabling causation), repeatedly chose paths that escalated tension because those paths appeared rational and necessary *within their specific institutional contexts*. The failure lay not in one "first move," but in the collective inability – structurally determined – of these institutions to create or sustain mechanisms that could override the escalatory logic inherent in the post-war structure.

  ### Conclusion: Abandoning Blame, Embracing Complexity
  The question "who started the Cold War" persists not because it illuminates, but because it satisfies a persistent human desire for moral clarity and singular origins. However, as a tool for historical understanding, it is fundamentally flawed. It commits a category error by applying individualistic blame to systemic processes involving multiple, complex institutional actors. The traditional historiographical schools, despite their empirical disagreements, are all ultimately captive to this flawed premise of unitary state agency and culpability.

  Shifting to a framework of **distributed institutional responsibility**, centred on the distinction between **initiatory causation** (contingent decisions) and **enabling causation** (structural and institutional preconditions), offers a more rigorous analytical lens. It directs attention away from the chimera of pinpointing a guilty party and towards understanding *why* the institutional architectures on both sides consistently generated policies that made escalation appear rational and confrontation inevitable at each critical juncture. Only by analysing how enabling conditions were sustained, reinforced, and acted upon by distributed networks of power and decision-making within and between states can we truly grasp the tragic, systemic logic of the Cold War's emergence. The question of "who started it" should thus be abandoned; the imperative is to understand *how the system itself became primed for conflict*.
