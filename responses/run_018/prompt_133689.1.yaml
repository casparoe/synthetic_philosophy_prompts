answer: |-
  You've hit on a profound and persistent problem in the hypocrisy/standing debate. Your frustration is justified—the "loop" often arises because participants are using "standing" to mean **fundamentally different things** while treating it as a single concept. Breaking the impasse requires dissecting these conceptual layers and reframing the cases. Here's a roadmap:

  ### 1. The Core Conceptual Split: What *Kind* of "Standing"?
  The debate conflates at least **three distinct concepts** under "standing":
  - **Relational Standing (Victim-Focused):**  
    *"Who can legitimately demand accountability?"*  
    Rooted in the *specific relationship* between wrongdoer and wronged party. Hypocrisy is irrelevant unless the hypocrite is the *victim* of the wrong they're blaming (e.g., you can't demand an apology for a wrong done *to someone else* if you habitually commit that wrong yourself against others).  
    *Key Philosophers:* Scanlon, Wallace (partially), Bell.  
  - **Epistemic/Moral Authority Standing:**  
    *"Whose blame carries persuasive weight?"*  
    Focuses on the blamer's *credibility, consistency, and perceived moral competence*. Hypocrisy directly undermines this.  
    *Key Philosophers:* Friedman, Todd.  
  - **Social/Performative Standing:**  
    *"Who has the social license to perform the act of blaming?"*  
    Concerned with *social norms, power dynamics, and hypocrisy as a performative contradiction*. Institutional hypocrisy fits here.  
    *Key Philosophers:* Mason, Fricker, McKenna (social dynamics).

  **Your supervisor's dismissal of institutional cases likely stems from prioritizing *Relational Standing***. If standing is *only* about who is *directly wronged*, then institutional hypocrisy (e.g., university labor violations) doesn't undermine the board's standing to blame plagiarism *unless* the board members themselves were victims of plagiarism. The "core issue" for them is dyadic moral relations.

  ### 2. The Hidden Substantive Split: What is Blame *For*?
  The hypocrisy debate reveals deeper disagreements about blame's **function**:
  - **The Accountability Camp:**  
    Blame is primarily a *demand for accountability* from the wrongdoer to the victim. Its legitimacy depends on the *relational context*. Hypocrisy matters only if it violates this relational norm (e.g., "How dare *you* demand this from me when *you* haven't accounted for your own wrongs *to me*?").  
    → Hypocrisy *outside* the specific relationship is irrelevant.  
  - **The Communicative/Expressive Camp:**  
    Blame is a *social act* that expresses norms, shapes expectations, and reinforces moral community. Its legitimacy depends on the blamer's *consistency* and *sincerity*. Hypocrisy undermines the *message* ("Practice what you preach!").  
    → Institutional hypocrisy directly contaminates the act of blaming.  

  ### 3. Breaking the Impasse: Conceptual Reframing
  To move forward, **force clarity on the type of "standing" and the function of blame** in each case:
  1. **Distinguish "Standing Types" Explicitly:**  
     - *"Are we discussing who has the relational right to demand accountability (Relational Standing), whose blame is credible (Epistemic Standing), or whose blame is socially acceptable (Performative Standing)?"*  
     - Reframe your cases:  
       - *University Ethics Board:* Their **Epistemic/Performative Standing** is undermined by institutional hypocrisy (labor violations), even if their **Relational Standing** to sanction plagiarism (as representatives of the academic community) is intact.  
       - *Climate Activist Flying:* Their **Epistemic Standing** (credibility) and **Performative Standing** (avoiding performative contradiction) are weakened, but their **Relational Standing** (as members of the global community harmed by climate inaction) may be unaffected.  

  2. **Reframe Cases to Expose the Split:**  
     - Present a *hybrid case*:  
       *"A politician (who embezzled public funds) blames a corporation for polluting a river that harms her constituents. Does she have standing?"*  
       - **Relational View:** Yes – she speaks for the victims (constituents), even if she's corrupt elsewhere.  
       - **Authority View:** No – her corruption destroys her moral credibility.  
       - **Performative View:** No – her hypocrisy makes the blame socially illegitimate; it’s a power move, not moral leadership.  
     This forces engagement with *which* dimension matters most.  

  3. **Shift Focus to Blame's *Purpose* in Context:**  
     - Ask: *"What work is blame doing here?"*  
       - Is it demanding repair *to specific victims*? (Relational)  
       - Is it shaping public norms? (Performative)  
       - Is it persuading the blamed to repent? (Epistemic)  
     Hypocrisy's relevance depends on the answer.  

  4. **Accept Multiple "Standings" (The Pluralist Move):**  
     Acknowledge that "standing" isn't unitary. We might say:  
     *"The university board has relational standing to sanction plagiarism but lacks epistemic/performative standing due to its institutional hypocrisy, making its blame less effective and socially illegitimate."*  
     This resolves the "loop" by showing both sides can be right, depending on the dimension analyzed.  

  ### Why Your Cases Matter
  Your institutional examples aren't distractions—they reveal the **limits of purely relational accounts**. In complex social contexts (climate, corporations, universities), blame often functions as **public norm-enforcement**, not just interpersonal accountability. Hypocrisy here isn't about "tu quoque"; it's about **undermining the social practice of blame itself**. Ignoring this conflates moral authority with moral ontology.  

  **Practical Move:** Propose writing a section explicitly mapping the three "standings" onto your cases. Show how the debate looks different through each lens. If your supervisor insists relational standing is "core," argue that in modern moral life, *public blame* (e.g., activists, institutions) operates primarily in the epistemic/performative realm—making hypocrisy devastating. The impasse breaks when we admit blame wears many hats.  

  This isn't just semantics—it's about whether moral criticism in a fractured world requires clean hands, or just clear voices. Your instinct to push beyond dyadic cases is exactly where the debate needs to go.
