answer: |-
  Your "active-harm only" rule is coherent and avoids presentism, but it faces significant philosophical and practical challenges. Let's sort the defeaters by severity, from fatal to awkward, and address unfalsifiability:

  ### 🚩 **Fatal Defeaters** (Threaten the Core Logic)
  1. **The "Structural Scar" Problem**:  
     *Defeater*: Repealed policies often create *enduring structural harm* disconnected from active enforcement. Redlining was outlawed, yet segregated wealth gaps persist. Confederate monuments (honoring a *defeated* cause) fuel ongoing racial terror.  
     *Why fatal?* Your rule would protect these symbols because the *policy* isn't active, but the harm remains dynamically reinforced. Conceding this forces you to stretch "active harm" beyond institutions to include cultural/psychological harm—blurring your bright line.

  2. **Endorsement Complicity**:  
     *Defeater*: Public monuments aren't neutral history; they're **state-sanctioned valorization**. A statue of a colonizer in a colonized land isn't just "old crime"—it's ongoing endorsement of that violence to victims' descendants.  
     *Why fatal?* This makes the statue *itself* an "active institution" perpetuating harm through symbolic violence, regardless of current laws. Your rule ignores the monument's *present* function as a tool of dominance.

  3. **The Non-Linear Harm Argument**:  
     *Defeater*: Harm isn't binary (active/dormant). Cultural trauma, lost generational wealth, or normalized bigotry outlive repealed laws. A street named after a eugenicist *validates* pseudoscience that still infiltrates medical racism today.  
     *Why fatal?* Your framework assumes harm can be neatly periodized. If harm is rhizomatic (spreading through unseen connections), "active" becomes meaningless.

  ### ⚠️ **Serious but Possibly Adjustable Defeaters**
  4. **Entangled Legacies**:  
     *Defeater*: Figures have mixed records. A founding father championed democracy *and* enslaved people. Democracy is "actively beneficial," slavery is historical harm. Does the active good "cancel" the statue's harm?  
     *Adjustment?* You could add: "**Net ongoing harm**" assessment. But this invites subjectivity—who weighs the harm? Brushed off? No—this reveals the rule's inability to handle moral complexity.

  5. **The "Passive Perpetuation" Loophole**:  
     *Defeater*: Symbols normalize historical narratives that *enable* present harm. A statue of a settler who massacred Indigenous people reinforces the myth of "peaceful settlement," undermining land-rights claims today.  
     *Adjustment?* Define "baked in" to include **cultural narratives underpinning active institutions**. Risky—this could overextend the rule.

  ### 😐 **Awkward Defeaters** (Manageable with Tweaks)
  6. **The Slippery Slope of "Active"**:  
     *Defeater*: If a repealed policy (e.g., anti-sodomy laws) leaves stigma affecting LGBTQ+ mental health, is that "active harm"? If yes, almost *all* historical injustice qualifies.  
     *Brush off?* Tighten "active" to require **direct causal links to current policy/enforcement**. But this may exclude real psychological harm.

  7. **Comparative Innocence Problem**:  
     *Defeater*: Why focus *only* on harm? A benign but obscure historical figure’s statue does no harm, but removing it isn't "vandalism"—it’s urban renewal. Your rule only addresses one side.  
     *Brush off?* Concede the rule only governs *harm-based* removal, not other valid reasons for change.

  ---

  ### 🔍 The Unfalsifiability Problem: Yes, and That's Damaging
  You *can* always redefine "baked in" or "active harm" to salvage the rule (e.g., expanding it to include "cultural infrastructure"). **But this makes your rule unfalsifiable—a critical flaw.**  

  * **Why it's problematic**:  
    - It becomes a **post-hoc justification tool** rather than a guiding principle.  
    - Undermines moral consistency: Two identical statues could be judged differently based on elastic definitions.  
    - Invites bad-faith manipulation (e.g., "Redlining isn't *actively* harming anyone today; it's just market forces!").  

  * **Can you fix it?** Only by:  
    1. **Strict operational definitions**: E.g., "Active harm = currently enforced laws/policies with <10 years since repeal." But this feels arbitrary and excludes deep structural harm.  
    2. **Adding independent criteria**: E.g., "And the figure’s *primary* legacy is harm." But this reintroduces subjectivity.  

  ---

  ### 💎 Conclusion: Where the Rule Holds (and Where It Breaks)
  **You must concede**:  
  - Symbols themselves can *be* active harms (not just complicit).  
  - "Historical" harm often bleeds into the present through non-institutional channels (culture, psychology, economics).  
  - The line between "active" and "dormant" harm is often illusory.  

  **Brushed off with tweaks**:  
  - Minor entanglements (net harm assessments).  
  - Non-harm-based removal arguments.  

  **Verdict**: The rule is **useful but incomplete**. It works best for clear-cut cases (e.g., a street named for an apartheid architect *while apartheid still exists*). But in societies with deep historical injustices, *most* contested symbols will fall into gray areas your rule struggles to navigate. Pair it with:  
  - Community impact assessments (Who feels harmed *now*?)  
  - Transparency about what values the public space should endorse *today*.  

  *Ultimately, the unfalsifiability is the price of simplicity. To retain rigor, you’d need to accept that some harms are irreducible to "active institutions"—and that symbols themselves have power.*
