answer: |-
  ### (1) Reconstruction of the Passage (150 words)  
  Russell argues that definite descriptions ("the F") are not genuine referring expressions but incomplete symbols requiring quantificational analysis. Their logical form involves three claims: existence (there is at least one F), uniqueness (there is at most one F), and predication (that F is G). For negative existentials (e.g., "The present King of France is not bald"), Russell identifies a scope ambiguity. The negation can either:  
  (a) **Deny the entire proposition** (wide scope): "It is not true that there exists a unique King of France who is bald," or  
  (b) **Deny the predication alone** (narrow scope): "There exists a unique King of France, and he is not bald." Only (a) correctly handles reference failure: it avoids presupposing a referent by negating the existential claim itself. This dissolves the illusion of referring to non-existent entities, reframing the problem as one of truth conditions for quantified statements.

  ---

  ### (2) Scope Analysis: Primary vs. Secondary Occurrences (250 words)  
  Russell’s "primary" (wide scope) and "secondary" (narrow scope) occurrences resolve ambiguity via negation’s interaction with quantifiers. Let φ = "is bald," and K = "present King of France."  

  - **Primary Occurrence (Negation Takes Wide Scope):**  
    ¬∃x[Kx ∧ ∀y(Ky → y=x) ∧ φx]  
    *Logical Form*: "It is not the case that there is exactly one King of France who is bald."  
    *Truth Conditions*: True if there is no unique King (e.g., France is a republic). This denies existence/uniqueness.  

  - **Secondary Occurrence (Negation Takes Narrow Scope):**  
    ∃x[Kx ∧ ∀y(Ky → y=x) ∧ ¬φx]  
    *Logical Form*: "There is exactly one King of France, and he is not bald."  
    *Truth Conditions*: True only if a unique King exists and lacks baldness; false if no King exists.  

  **Crucial Distinction**:  
  - Primary occurrence negation targets **existence/uniqueness** (¬∃x[...]).  
  - Secondary occurrence negation targets only the **predicate** (∃x[... ∧ ¬φx]).  
  In reference failure (e.g., no King), the primary reading is true (correctly denying existence), while the secondary is false (falsely presupposing existence). Russell thus avoids Meinongian "subsistence" by treating "the F" as a quantifier bundle whose existential commitment is cancellable by wide-scope negation.

  ---

  ### (3) Metaphysical Assessment (150 words)  
  Russell’s resolution **dissolves, not merely relocates**, the metaphysical puzzle. By analyzing "the F" as a quantificational structure, he eliminates any requirement for non-existent referents. The problem shifts from "How can we speak of what isn’t?" to "When is a quantified sentence true?" This syntactic maneuver reframes ontological commitments: apparent talk of "nothing" becomes a denial of a quantified claim’s satisfaction conditions. However, critics (e.g., Strawson) argue Russell ignores pragmatic presuppositions: uttering "the F" still *suggests* a referent exists, even if not logically entailed. Yet for Russell, metaphysics is clarified by syntax: non-existence is not a property of things but a property of propositions—specifically, the falsity of an existential quantification. This robustly avoids ontological bloating.

  ---

  ### (4) Note on Institutional Extension (150 words)  
  Russell’s framework **extends naturally to institutional contexts** with minimal adjustment. Consider "The sovereign of Regime X is not legitimate" after Regime Y dissolves the office.  
  - **Primary Occurrence**: ¬∃x[Sx ∧ ∀y(Sy → y=x) ∧ Lx]  
    *Reading*: "It is false that there exists a unique sovereign under Regime X’s rules who is legitimate." True if the office no longer exists *in the institutional ontology*.  
  - **Secondary Occurrence**: ∃x[Sx ∧ ∀y(Sy → y=x) ∧ ¬Lx]  
    *False* if the institutional entity is dissolved (no referent).  

  **Key Insight**: Russell’s existential quantifier (∃x) need not range over physical entities but over **domain-specific ontologies** (e.g., legal persons). Reference failure here stems from the absence of an entity *in the relevant institutional domain*, not physical space. This preserves Russell’s syntax while accommodating normative dissolution, provided we relativize existence to contextually specified domains. The theory remains intact, though it implicitly demands a meta-ontology of social facts.
