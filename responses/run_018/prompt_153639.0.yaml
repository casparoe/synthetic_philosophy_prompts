  The strongest defeaters are empirical (flow states persist) and conceptual (Schlick’s focus on intentionality). To salvage the position, refine "structurally impossible" to "structurally degraded," and address unfalsifiability by defining empirical benchmarks. Schlickians would likely see your extension as a provocative but non-legitimate update, as it prioritizes systemic critique over individual phenomenology.
