  The user asks to test this hypothesis against both positions' commitments. So, for conciliationism, can it work without an internalist premise? Higher-order evidence (HOE) alone—knowing a peer disagrees—should trigger conciliation. But HOE's weight depends on why the peer disagrees. If their reasoning is opaque, you can't assess reliability without internalist criteria. So conciliationism might need that premise to justify why disagreement demands deference.

  For steadfastness, they ask if it needs externalism or just the claim that evidence must be evaluated by someone. Steadfastness could operate without externalism by focusing on the agent's perspective: if their reasoning seems sound, they can maintain confidence. But this risks privileging one's view. Without externalism, steadfastness might ignore HOE, which could be irrational. So externalism might be necessary to avoid dogmatism.

