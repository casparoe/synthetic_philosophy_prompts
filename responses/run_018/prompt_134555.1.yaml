  The disagreements table needs precise wording each side would endorse. Biggest flashpoints: whether PP inherently favors status quo (PP says no—it prevents imposed irreversible harms; RCBA says yes—it blocks innovation without proof), and whether burden of proof is procedural (RCBA) or substantive (PP). Must avoid strawmanning.

