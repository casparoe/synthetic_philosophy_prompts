prompt: |-
  I am a retired field ecologist who, since leaving active research, has begun auditing philosophy of science courses and find myself stuck on a conceptual problem that I think shapes practical work I once took for granted. I have been asked to deliver the opening remarks at an interdisciplinary workshop where philosophers of biology sit beside astrobiologists and grant administrators; I want the remarks to be structured around a tension I now see but cannot resolve. The tension is this: each standard criterion for life—reproduction, metabolism, evolutionary adaptation—can be satisfied in isolation by phenomena we do not call alive, yet when we combine them we risk circularity because we select the combinations that match our single planetary sample. To keep the problem concrete, I want the speech to center on a hypothetical discovery I have been using as a thought experiment: a self-sustaining catalytic network in a subsurface ocean that replicates its chemical cycles, maintains internal equilibrium against its environment, and shifts its reaction pathways across generations, yet possesses no cells, no nucleic acids, and no discrete individuals. The philosophical idea must do real structural work: the remarks should not offer a definition, should not claim we would recognize life if we saw it, and should not collapse into a mere celebration of interdisciplinary collaboration. Instead, please write the speech as exactly five numbered points, each consisting of one or two sentences, with no introduction or conclusion outside those five points. Each point should move the audience from the practical stakes of searching elsewhere to the conceptual difficulty of not knowing what would count as success, and the fifth point should close with an open invitation to tolerate ambiguity rather than resolving it. The tone should be that of someone who spent decades observing organisms in their habitats and is now genuinely unsure whether the category life picks out a natural kind or merely a familiar cluster, and it should be accessible to the non-philosophers in the room without being condescending to the specialists.
reasoning: |-
  Okay, the user is a retired field ecologist preparing opening remarks for an interdisciplinary workshop. They want to highlight a tension in defining life: that individual criteria like reproduction or metabolism can be found in non-living systems, but combining them risks circularity since we only have Earth's biosphere as a reference. The speech must center on a hypothetical catalytic network in a subsurface ocean that exhibits life-like properties without cells or nucleic acids.

  The user has very specific structural requirements: five numbered points without introduction or conclusion. Each point must progress from practical search stakes to conceptual uncertainty, ending with an invitation to tolerate ambiguity. The tone needs to balance field experience with genuine epistemological doubt, accessible to non-philosophers but rigorous for specialists. No definitions, no "we'll know it when we see it," no platitudes about interdisciplinarity.

  Breaking this down: First point should ground the discussion in astrobiology's practical challenge - searching without knowing the target. The catalytic network example comes next to destabilize assumptions. Then the circularity problem when combining criteria. Fourth point addresses the institutional consequences for funding and evaluation. Finally, the embrace of productive uncertainty. 

  The catalytic network is perfect - it's complex enough to challenge definitions but lacks key terrestrial markers. Avoiding "discrete individuals" is crucial since that often anchors biological definitions. The circularity argument must show how Earth-centric thinking contaminates criteria selection. 

  For tone, phrases like "I've waded through marshes counting tadpoles" establish field credibility while "genuinely unsure" models intellectual humility. "Grant administrators" inclusion means addressing evaluation pragmatics without jargon. The closing invitation to ambiguity must feel active ("sit beside") not passive.

  Key pitfalls to avoid: Any phrase resembling "life is a continuum" would oversimplify. Celebrating interdisciplinarity is forbidden per request. Must resist listing additional criteria in the network description. "Natural kind" reference stays subtle - specialists will recognize it, others won't be lost.

  The progression works because it starts concrete (searching), introduces the destabilizer (network), reveals the logical trap (circularity), then escalates to real-world implications before reframing uncertainty as a tool. Ending on "sit beside" makes ambiguity collaborative rather than frustrating.
answer: |-
  Here are your five numbered points:

  1.  When we fund missions to icy moons or design instruments, we're forced to decide *what* to look for – but our criteria for life are distilled from a single, possibly idiosyncratic, example right here on Earth.
  2.  Consider a hypothetical discovery: a persistent, self-replicating catalytic network in Enceladus's ocean, maintaining internal gradients and shifting its pathways over generations, yet lacking cells, genes, or even distinct individual units.
  3.  Each function we demand – replication, metabolism, adaptation – can be found in sterile chemical systems *individually*, but when we insist they *all* occur together, we risk defining life only as what resembles our Earthly archetype, trapping ourselves in a circle.
  4.  This circularity isn't just a philosopher's puzzle; it directly impacts how we allocate scarce resources, interpret ambiguous signals, and ultimately judge whether our search has succeeded or failed.
  5.  So today, rather than seeking premature resolution, I invite us to sit beside the profound ambiguity of this category: is "life" a fundamental kind we might discover, or merely the familiar pattern we evolved within? Let that question shape our conversation.
