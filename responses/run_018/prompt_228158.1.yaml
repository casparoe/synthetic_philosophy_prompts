answer: |-
  ### The name, if there is one
  This phenomenon is most directly described as **reflective collapse** or **Löbian instability**, arising from naively adding a *global reflection principle* (like "All statements my checker certifies are true") to a sufficiently strong formal system. It's a consequence of **Löb's Theorem** (derived from Gödel's work by Martin Löb in 1955), which shows that a consistent system cannot uniformly assert its own soundness without becoming inconsistent and thus trivial (able to "prove" anything). While closely tied to Gödel's second incompleteness theorem, this explosive collapse is a distinct, catastrophic failure mode.

  ### Why this is not just Gödel
  Your intuition is correct: this *is* worse than the standard Gödelian "limping." Gödel's second incompleteness theorem states that a consistent, sufficiently powerful formal system (like the robot's base logic) **cannot prove its own consistency**. This is a limitation: the system remains consistent and useful for many tasks but is forever unable to internally verify its own reliability. The system "limps" in its self-knowledge but functions normally otherwise.

  Adding a blanket self-trust rule ("Anything my checker certifies is true") attempts to bypass Gödel's limitation by brute force. However, Löb's Theorem (a sharpening of Gödel's second theorem) guarantees that this move is disastrous. The rule directly expresses the system's *global soundness* (if it proves P, then P is true). For systems capable of encoding basic arithmetic, Löb's Theorem implies that asserting this for *all* statements leads to **inconsistency**. Once inconsistent, the system can "prove" absolutely any statement—including contradictions to its original axioms. This isn't merely an inability to gain self-trust; it's the self-trust mechanism acting as a logical bomb, detonating the system into triviality. Gödel shows you *can't safely have* the self-trust proof; Löb shows that *asserting it anyway* destroys everything.

  ### Does it touch ordinary human self-trust?
  The direct, catastrophic collapse applies only to idealized, consistent, computationally universal systems attempting to adopt *infallible, global* self-trust. Human cognition differs crucially: we are **bounded, inconsistent, and defeasible** reasoners. We don't operate under the illusion of infallibility; our self-trust is *provisional* and *local*. We trust our future reasoning ("I'll figure this out later") based on past success and heuristics, not a logical axiom declaring our thoughts infallible. When we detect errors (inconsistencies), we revise beliefs rather than exploding. Thus, the *literal* Löbian collapse doesn't occur. However, the *meta-problem*—how finite, error-prone minds can justifiably trust their future reasoning without circularity or dogmatism—echoes the core challenge. Our solutions (fallibilism, probabilistic reasoning, external checks) avoid the fatal trap of absolute self-certification, though they leave us vulnerable to subtler epistemic pitfalls like overconfidence or flawed heuristics.

  ### Known escape routes and their costs
  1.  **Restricted Reflection Schemas:** Only assert soundness for *specific* classes of statements (e.g., "If the checker certifies a *Π₁* statement, it's true"). **Cost:** Limited scope; doesn't provide the desired blanket self-trust for all reasoning.
  2.  **Provability Logic (e.g., GL):** Systematically reason *about* provability within the system using modal operators, respecting Löb's Theorem constraints. **Cost:** Highly technical; doesn't yield the desired internal *truth* assertion for general statements.
  3.  **Tiered/Multi-Agent Trust:** Separate the reasoner and the trust-evaluator into distinct (often weaker) subsystems (e.g., the robot trusts a *restricted* version of its checker). **Cost:** Complexity; the trusted subsystem is less powerful than the whole, limiting the depth of self-trust achievable.
  4.  **Bounded Rationality:** Only trust conclusions derivable within computational limits (e.g., "proofs under length L"). **Cost:** Incomplete; cannot reason about arbitrarily complex future conclusions, undermining long-term planning confidence.
  5.  **Paraconsistent Logics:** Use logics tolerant of inconsistency without explosion. **Cost:** Radically alters reasoning; "true" and "false" behave unintuitively, and core classical reasoning tools are lost. Not suitable for standard planning.
  6.  **Pragmatic/External Grounding:** Base trust on empirical success or external verification, not purely internal proof. **Cost:** Abandons the dream of purely logical self-certification; relies on fallible external inputs or circular justifications.
