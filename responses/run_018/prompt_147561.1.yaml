answer: |-
  Below is a complete, self-contained design for a 60-minute in-class deliberation structured around the white-horse paradox. The activity avoids naming Gongsun Long or the School of Names until the debrief, forcing students to mechanically encounter the categorization tension through roles, rules, and non-monetary stakes (speaking-order priority). The design includes all requested components, with philosophical concepts embedded in the instructions.

  ---

  ### **1. Artifact Descriptions and Scoring Sheet**  
  **Artifact Cards (12 identical cards per committee, described as follows):**  
  1. A small white horse statue (marble)  
  2. A small black horse statue (ebony wood)  
  3. A white marble sphere  
  4. A black iron cube  
  5. A red ceramic horse figurine  
  6. A white porcelain vase  
  7. A brown wooden horse figurine  
  8. A white plastic chair miniature  
  9. A green jade horse carving  
  10. A white ceramic bowl  
  11. A blue resin horse statue  
  12. A white silk tapestry (rectangular)  

  **Scoring Sheet (for Form and Color Committees):**  
  - **Instructions:** Distribute exactly 10 points total among artifacts that *exclusively* fit your mandate. Allocations must be ≥0. Partial points (e.g., 1.5) are allowed. Record points in the "Your Allocation" column.  
  - **Binding Rule:** If both committees allocate >0 points to the same artifact, both allocations are void (artifact gets 0 points).  

  | Artifact Description          | Your Allocation (Points) |  
  |-------------------------------|---------------------------|  
  | White horse statue            |                          |  
  | Black horse statue            |                          |  
  | White marble sphere           |                          |  
  | Black iron cube               |                          |  
  | Red ceramic horse figurine    |                          |  
  | White porcelain vase          |                          |  
  | Brown wooden horse figurine   |                          |  
  | White plastic chair miniature |                          |  
  | Green jade horse carving      |                          |  
  | White ceramic bowl            |                          |  
  | Blue resin horse statue       |                          |  
  | White silk tapestry           |                          |  
  | **TOTAL**                     | 10.0                     |  

  **Post-Activity Scoring:**  
  - **Successful Points:** The sum of a committee's allocations to artifacts *not* claimed by the other committee.  
  - **Conflict Penalty:** If both committees fund the same artifact, neither gets points for it.  
  - **Stakes:** Successful points determine speaking order in the post-activity discussion (highest = first).  

  ---

  ### **2. Minute-by-Minute Timeline (Total: 60 min)**  
  **Pre-Activity (0–5 min):**  
  - Assign roles: 5 students to Form Committee (mandate: fund *only* horse-shaped artifacts, ignoring color), 5 to Color Committee (mandate: fund *only* white-colored artifacts, ignoring shape), 5 to Arbitration Board (mandate: observe conflicts and propose solutions; no funding power).  
  - Distribute materials: Each committee gets 12 artifact cards, one scoring sheet, and pens. Arbitration Board gets a conflict-tracking sheet (list of artifacts).  
  - Explain rules clearly:  
    > "The Form Committee must fund all horse-shaped objects, regardless of color. The Color Committee must fund all white objects, regardless of shape. Any artifact can receive points from only one committee. If both fund the same artifact, both lose their points for it. The Arbitration Board may propose compromises but cannot force changes—only committees can withdraw claims. Your successful points decide your speaking priority later."  

  **Silent Allocation Round (5–20 min; 15 min):**  
  - Committees work independently. No inter-committee communication.  
  - Facilitator circulates to enforce mandates: Intervene if committees discuss hybrid categories (e.g., "white-horse-form")—remind them their mandate is *exclusive* (Form: shape only; Color: color only).  
  - Committees submit scoring sheets at 20 min.  

  **Simultaneous Reveal and Conflict ID (20–25 min; 5 min):**  
  - Project or whiteboard both committees' allocations.  
  - Identify conflicts: Mark artifacts where both allocated >0 points (e.g., white horse statue). Void both allocations for these.  
  - Calculate initial successful points. Example:  
    - Form Committee allocated 3 pts to white horse statue.  
    - Color Committee allocated 4 pts to white horse statue.  
    - Result: White horse gets 0; both committees lose those points.  

  **Negotiation Round (25–45 min; 20 min):**  
  - All three groups meet. Arbitration Board speaks first: Proposes one withdrawal/merger (e.g., "Form Committee, withdraw from white horse to save points").  
  - Committees negotiate: May revise allocations but must maintain 10 total points and mandates. Arbitration Board cannot veto—only suggest.  
  - Facilitator enforces structure: 10 min for open debate, 5 min for private committee huddles, 5 min for final revisions.  
  - Committees submit revised scoring sheets.  

  **Final Locked-in Budgets (45–50 min; 5 min):**  
  - Reveal revised allocations. Recalculate conflicts and successful points.  
  - Announce speaking order for discussion (e.g., "Form Committee: 8.2 pts; Color Committee: 7.5 pts; Form speaks first").  
  - **Do not resolve tensions administratively.** Deadlocks (e.g., white horse still conflicted) are learning opportunities.  

  **Transition to Debrief (50–60 min; 10 min):**  
  - Prepare students for discussion: "In the next 20 min, we’ll discuss why the white horse caused a deadlock. Speaking order: Form, then Color, then Arbitration Board."  

  ---

  ### **3. Physical Materials and Room Layout**  
  **Materials:**  
  - **Artifact cards:** 36 total (12 unique descriptions × 3 sets), printed on cardstock.  
  - **Scoring sheets:** 2 per committee (initial + revised), plus one conflict-tracking sheet for Arbitration Board.  
  - **Timer:** Large digital clock or projector timer visible to all.  
  - **Display:** Whiteboard/projector for allocations.  
  - **Writing:** Pens, markers.  

  **Room Layout:**  
  - **Form Committee:** Table on left (labeled).  
  - **Color Committee:** Table on right (labeled).  
  - **Arbitration Board:** Central table facing both (labeled).  
  - **Facilitator station:** Front with timer/display.  
  - **Negotiation space:** Open area in center for joint discussion.  

  ---

  ### **4. Debrief Script (Delivered at 50–60 min)**  
  > "Let’s reflect on what happened. The white horse statue caused a deadlock: Both committees wanted to fund it, but the rules forced them into conflict—only one could ‘own’ it. Why? Because your mandates treated ‘horse’ and ‘white’ as separate categories. The Form Committee cared only about shape; the Color Committee only about color. The rules made these categories mutually exclusive, so the white horse—a thing that is both—couldn’t fully belong to either.  
  >  
  > "This mirrors a 3rd-century BCE Chinese paradox from Gongsun Long and the School of Names: *A white horse is not a horse*. Why? Because ‘horse’ refers to the universal form (what makes something a horse), while ‘white’ refers to an independent quality (color). They argued that since form and quality are conceptually distinct, combining them creates something new—a ‘white horse’ isn’t identical to ‘horse’. Our game recreated this tension mechanically.  
  >  
  > "But here’s the key difference: Our rules created an **extensional conflict**—a practical tug-of-war over objects. Gongsun Long’s argument is **intensional**: It claims form and color are fundamentally separable in thought, not just in practice. Sorting artifacts by rules doesn’t prove that ‘horseness’ and ‘whiteness’ exist independently in reality—it just shows what happens when we force that separation. The deadlock arises from how we define categories, not from the world itself.  
  >  
  > "This is the heart of the white-horse argument: Universals (‘horse’, ‘white’) are simple and distinct, but particulars (a white horse statue) bundle them. When categories collide, we confront the limits of language and classification."  

  ---

  ### **5. Prediction of Failures and Correctives**  
  **Predicted Failure #1: Committees invent hybrid categories to escape the paradox.**  
  - E.g., Form Committee funds "white horse" under "horse-form-with-color-exception."  
  - **Corrective:** Intervene during allocation: "Your mandate is exclusive—Form Committee ignores color entirely. You cannot create exceptions. Reallocate strictly by shape." Reinforce that mandates are rigid to force the mechanical deadlock.  

  **Predicted Failure #2: Arbitration Board dominates negotiations.**  
  - E.g., Board pressures committees into withdrawing claims, resolving tension administratively.  
  - **Corrective:** During negotiation, remind: "The Arbitration Board can propose ideas, but only committees can change allocations. Form and Color, decide for yourselves—don’t let the Board dictate." Preserve tension by upholding committee autonomy.  

  **Predicted Failure #3: Committees avoid the white horse entirely to prevent conflict.**  
  - E.g., Both allocate 0 points to it, sidestepping the paradox.  
  - **Corrective:** In debrief, highlight: "You avoided conflict, but the rules made the white horse unclaimable by both committees simultaneously. The tension remains—if you wanted to fund it, you couldn’t without breaking the mandates." Use this to illustrate the *potential* deadlock.  

  **Core Principle:** Correctives preserve the experiential logic by reinforcing mandates and rules, not by solving the paradox. The deadlock is the goal.  

  ---

  ### **6. Explicit Simplification of Gongsun Long’s Reasoning**  
  **During Debrief (State Aloud):**  
  > "This exercise simplifies Gongsun Long’s ontology. He relied on a rigid separation of universals (e.g., ‘horseness’ as an eternal form) and particulars (e.g., this white horse). Our game reproduces the conflict mechanically with sorting rules, but it doesn’t engage his metaphysical claim—that universals exist independently of objects. We’ve shown extensional tension (overlap in funding), not his intensional argument about concepts. This is a limitation: Sorting rules alone cannot prove that ‘horse’ and ‘white’ are fundamentally distinct in reality. But they make the conceptual tension visceral, which is our goal today."  

  This statement preserves the paradox’s force by acknowledging the experiential gap (mechanics vs. metaphysics) without resolving it.  

  ---  
  **Activity Rationale:** By embedding the white-horse tension in mandates and rules, students experience the categorization conflict before it is named, creating a "Eureka!" moment in the debrief. The Arbitration Board and stakes ensure engagement, while the artifact deck guarantees the white horse deadlock emerges naturally. No prior knowledge of the dialogue is needed—the philosophy emerges from the mechanics.
