  We are designing a 60-minute structured deliberation. The goal is to create a mechanical deadlock over the white horse statue that mirrors the white-horse argument without naming it until the debrief.

  **Structure:**
  - Three committees: Form Committee (FC), Color Committee (CC), and Arbitration Board (AB). Each committee has 5 students.
  - Each committee gets an identical deck of 12 artifact cards. We need to describe these artifacts clearly.
  - Each committee gets 10 points to allocate to artifacts that fall exclusively within their mandate.
  - Mandates:
    - FC: fund all and only horse-shaped objects (regardless of color).
    - CC: fund all and only white-colored objects (regardless of shape).
  - Rule: any artifact can get funding from at most one committee. If two committees fund the same artifact, both allocations are void and the artifact gets zero.
  - Arbitration Board (AB): may propose withdrawals or mergers but no veto. Only the committees can retract a claim.
  - Stakes: points allocated will determine speaking order in the subsequent 20-minute discussion (more points allocated successfully = higher priority in speaking).

  **Artifact Cards (12):**
  We need to have a mix that will create the conflict and also have non-conflicting ones. The cards should be described with both shape and color.

  1. White horse statue (conflict: both committees want it)
  2. Black horse statue (only Form Committee would want it)
  3. White marble sphere (only Color Committee would want it)
  4. Black iron cube (neither? but note: Form Committee only funds horse-shaped, so not this; Color Committee only funds white, so not this)
  5. Red horse statue (Form Committee only)
  6. White ceramic vase (Color Committee only)
  7. Brown wooden horse (Form Committee only)
  8. White plastic chair (Color Committee only)
  9. Green jade horse (Form Committee only)
  10. White porcelain bowl (Color Committee only)
  11. Blue horse statue (Form Committee only)
  12. White silk scarf (Color Committee only)

  Note: We want to make sure there are enough artifacts that each committee can fund without conflict, but the white horse statue is the one that will cause a deadlock.

  **Point Allocation Rules:**
  - Committees must allocate exactly 10 points in total to one or more artifacts. They can assign partial points (e.g., 2.5 to one artifact) but must use exactly 10 points.
  - They must allocate only to artifacts that fall within their mandate.
  - They record their allocations on a scoring sheet.

  **Scoring Sheet Example:**
  Each committee gets a sheet that lists the 12 artifacts and has a column for their allocation. They write the points they assign next to each artifact. The total must be 10.

  **Timeline (60 minutes):**

  - (0-5 min) Introduction and Setup:
    - Explain the setting: "We are in an ancient artifact funding council. There are three groups: Form Committee, Color Committee, and Arbitration Board."
    - Assign roles and explain mandates and rules. Emphasize that any artifact funded by two committees gets zero and both allocations are void.
    - Hand out materials: each committee gets 12 artifact cards and a scoring sheet. AB gets a list of the artifacts and a sheet to take notes.

  - (5-20 min) Silent Allocation Round (15 minutes):
    - Committees work independently to allocate their 10 points. They must not communicate with other committees during this time.
    - Each committee records their allocations on the scoring sheet.

  - (20-25 min) Simultaneous Reveal and Conflict Identification (5 minutes):
    - Each committee publicly announces their allocations (e.g., by writing on a board or projecting the scoring sheets).
    - The facilitator (or the AB) identifies conflicts: any artifact that has non-zero allocations from both FC and CC is in conflict and gets zero. Also, note if an artifact is funded by only one committee, it gets that amount.

  - (25-45 min) Negotiation Round with Arbitration Board (20 minutes):
    - The three groups meet together. The AB can propose resolutions (e.g., suggest one committee withdraws from a particular artifact, or propose splitting the funding). However, only the committees can change their allocations.
    - Committees can choose to withdraw or adjust their allocations (but they must still have exactly 10 points allocated in total and only to their mandate).
    - After negotiation, each committee submits a revised allocation.

  - (45-50 min) Final Locked-in Budgets (5 minutes):
    - Reveal the revised allocations and recalculate the funding, voiding any new conflicts.
    - Calculate the total points each committee successfully allocated (without conflict). This will be used to determine speaking order.

  - (50-60 min) Transition to Discussion (10 minutes):
    - Announce the speaking order for the next class discussion (based on the total points each committee successfully allocated). The committee with the highest total gets to speak first, etc.
    - Note: The next discussion (20 minutes) is not part of this 60 minutes, so we are ending at 60 minutes.

  **Physical Materials and Room Layout:**
  - Materials:
    - 12 artifact cards (three identical sets, one per committee). Each card should have a unique artifact description (as above).
    - Scoring sheets for each committee (with the 12 artifacts listed and a blank for points).
    - A visible timer (for the facilitator to keep time).
    - Whiteboard or large paper to record allocations and conflicts.
    - Optional: a projector to show the allocations.

  - Room Layout:
    - Three tables: one for FC, one for CC, and one for AB. Arrange them in a triangle so they can see each other during the negotiation round.

  **Debrief Script (to be delivered after the activity, but within the 60 minutes we are only getting to the end of the activity; the debrief would be in the next class or at the end of the 60 minutes? Let's note that the 60 minutes ends with the activity. We can have a brief debrief in the last 10 minutes, but the prompt says "in-class structured deliberation" of 60 minutes. We'll design the debrief as part of the 60 minutes in the last segment.)

  Actually, the timeline above ends at 50 minutes with the final allocations, and then we have 10 minutes for a transition. We can use that 10 minutes for the beginning of the debrief. However, the prompt says "a 60-minute, in-class structured deliberation" and then the subsequent 20-minute discussion. So the 60 minutes does not include the 20-minute discussion? Correct. Therefore, the debrief of the activity can be done in the last 10 minutes of the 60.

  Debrief (10 minutes at the end):

  Facilitator: "We've just experienced a funding allocation process with a clear rule: an artifact can only be funded by one committee. We saw that the white horse statue caused a problem. Why? Because the Form Committee saw it as a horse and the Color Committee saw it as white. Both wanted to fund it, but the rule said they couldn't both do so. So it ended up with zero.

  This mirrors an ancient Chinese philosophical problem known as the 'White Horse Paradox' from the School of Names, particularly associated with Gongsun Long. He argued that a white horse is not a horse. Why? Because 'horse' denotes the essential form (what makes something a horse) and 'white' denotes an independent color quality. Since these are different concepts, the combination 'white horse' is not identical to 'horse'. 

  In our game, we saw a mechanical deadlock: the rules forced a separation. The Form Committee was only allowed to care about form, and the Color Committee only about color. This forced separation created a conflict over the white horse statue. It couldn't be both a horse and white in the funding system. 

  But note: in reality, we know that a white horse is both a horse and white. The game set up an artificial separation. This separation reflects a philosophical idea: that form and color are distinct universals. However, in the world, they come together in particular objects. The game shows the tension that arises when we try to separate these concepts and assign exclusive ownership.

  But here's a key point: the game rules created an extensional conflict (the artifact couldn't be in two sets at once). However, the philosophical claim of Gongsun Long is intensional: it's about the meanings of the words. The concept 'horse' does not include color, and the concept 'white' does not include shape. Hence, the concept 'white horse' is not the same as the concept 'horse'. 

  We see that the rules forced an extensional separation: the artifact could only be in one set. But the philosophical claim is about the intensional difference. The game mechanically reproduces the conflict, but the ontological claim (that form and color are separate in reality) is something we must consider independently. The rules of the game don't prove that ontology; they just create a situation that mirrors the conceptual separation."

  **Prediction of What Will Fail and Correctives:**

  Prediction 1: Committees might try to create hybrid categories. For example, the Form Committee might say, "We'll fund white horse as a horse, but we'll put a note that it's also white." Or the Color Committee might do the same. 

  Corrective: The facilitator must enforce the mandates strictly. The Form Committee can only fund based on form (ignoring color) and the Color Committee only on color (ignoring form). They cannot create a new category that combines both. Remind them: "Your mandate is exclusive: Form Committee funds solely on the basis of form, and Color Committee solely on color. You must not consider the other attribute."

  Prediction 2: The Arbitration Board might become too dominant, effectively telling committees what to do.

  Corrective: Emphasize that the AB only has the power to propose. The committees must make the decisions. The facilitator can remind: "The Arbitration Board can suggest solutions, but only the committees can change their allocations. The AB cannot force a withdrawal."

  Prediction 3: Committees might avoid allocating to the white horse statue to prevent conflict.

  Corrective: This is acceptable but unlikely because the white horse statue is a clear candidate for both. If they avoid it, point out in the debrief that they avoided the conflict by not funding it, but the problem remains: if they had wanted to fund it, they couldn't without conflict. Alternatively, if both avoid it, then the white horse statue gets zero, which is the same result as conflict. The deadlock is still present in the rules.

  **Explicit Statement of Simplification:**

  Facilitator: "We must note that this exercise simplifies Gongsun Long's reasoning. In the original, he relies on a specific ontology of universals and particulars: that 'horse' and 'white' are separate universals that combine in the particular object, the white horse. Our game uses rules to force a separation, but it doesn't prove that such a separation exists in reality. It only shows that if we define our categories exclusively, we run into practical conflicts. Gongsun Long's argument is about the nature of concepts and reality, and our game is a mechanical analogy. The limitation is that we have not established that form and color are truly independent in the world; we have only shown what happens when our funding rules treat them as such."

  **Final Note:** The entire activity is self-contained. The instructions and materials provide all necessary context.

