  ### Thought Experiment Construction
  **Scenario Brainstorming & Rejections:**
  - **Office Tardiness Scenario:** Two managers confront an employee for chronic lateness. Manager A is often late but champions punctuality; Manager B is always on time but privately thinks lateness is trivial. *Rejection:* Fails because B's innocence feels tepid—lacking lateness without rejecting the norm isn't compelling enough to undermine B's standing intuitively.
  - **Family Diet Pact Scenario:** Siblings confront their brother for eating junk food, violating a family health pact. Sister A secretly eats junk food but evangelizes the pact; Brother B complies rigidly but scoffs at the pact's importance. *Rejection:* Too reliant on "victim" dynamics (family pact breaches harm the group), violating the no-victim constraint.
  - **Chosen Scenario (Friend Group):**  

  **Final Scenario:**  
  In a tight-knit friend group, Leo breaks his promise to help his depressed friend Maya move apartments, leaving her stranded. Friends Aaron and Becca jointly confront Leo. Aaron has repeatedly broken similar promises (including last week to another friend), but he vocally champions the group’s "support commitment" norm, agonizes over his failures, and actively mentors others on reliability. Becca has never broken such a promise, but only because she systematically avoids making them, viewing the norm as melodramatic and burdensome; she participates solely due to peer pressure.

  ---

  ### Checks  
  1. **Non-Hypocrisy Account Verdicts**  
     - *Widely accepted:* Hypocrisy (violating the exact norm you blame) is a *pro tanto* standing-defeater.  
     - **A (Aaron):** No standing. *Reason:* He commits the same wrong he denounces, invalidating his moral authority.  
     - **B (Becca):** Standing. *Reason:* Her spotless record satisfies non-hypocrisy; compliance suffices for standing.  
     *Result:* Standard view grants standing to B, denies it to A—opposite of the intuitive "tempting" verdict.  

  2. **Commitment-Based Account Verdicts**  
     - *Genuinely contested:* Standing requires *investing in the norm* (e.g., affirming its value, holding oneself accountable), not mere compliance.  
     - **A (Aaron):** Standing. *Reason:* His advocacy, guilt, and mentorship demonstrate deep commitment to the norm, making his blame a credible call to uphold shared values.  
     - **B (Becca):** No standing. *Reason:* She avoids and scorns the norm; her compliance stems from disengagement, rendering her blame hollow and disingenuous.  
     *Mechanism:* Standing flows from participation in the norm’s "moral community," not just behavioral adherence.  

  3. **Critical Detail & Its Removal**  
     - **Feature doing the work:** Becca’s *systematic avoidance of promise-making* due to her disdain for the norm.  
     - **If removed:** If Becca instead embraced the norm (e.g., kept promises diligently *because* she valued them), the commitment view would grant her standing, and A’s hypocrisy would still deny him standing on either view—eliminating the flip.  

  4. **Non-Hypocrisy Theorist’s Steelmanned Comeback**  
     - **Attack:** "Aaron’s hypocrisy isn’t redeemed by his 'commitment'—his actions prove he disrespects the norm, making his blame a manipulative performance. Becca’s compliance, even if grudging, shows respect for the norm; her motives don’t negate standing, as blame’s content (Leo’s wrong) remains apt."  
     - **Concession:** This implicitly grants that *mere compliance ≠ authentic relation to the norm*, but insists that standing is a minimal bar of non-violation, not an affirmative "investment" requirement.  

  ---

  ### Epistemic Groundwork  
  - **Settled:** Hypocrisy is widely agreed to *defeat* standing *pro tanto*; non-hypocrisy is necessary but not always sufficient.  
  - **Contested:**  
    - Whether commitment-based views can legitimately grant hypocrites standing.  
    - Whether non-hypocrites can lack standing due to norm-disengagement.  
    - If standing is distinct from blame’s aptness (all agree Leo deserves blame; the dispute is about *who* can meaningfully blame him).  

