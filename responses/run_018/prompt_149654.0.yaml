  I was trying to map out the constitution view (statue and clay are distinct, the statue is constituted by the clay) against the eliminativist view (there's just particles arranged statue-wise, no extra object). But then he mentioned chimeric tissue engineering — human cells grown inside animal scaffolds for organ transplants — and now I'm stuck. Is the human tissue in a chimeric heart like Baker's statue, constituted by but not identical to teh animal scaffold? Or is it more like van Inwagen's eliminativism, where there's just one biological entity with parts arranged human-wise?

  Compare these two frameworks specifically through chimeric tissue cases. Which one handles identity conditions better when the scaffold gets replaced cell-by-cell? Definately don't hedge — pick a side and argue why the other fails, especially on modal properties like whether the tissue could survive being moved to a different host. Also, please don't dump a bibliography; I'm trying to think this through without searching.
