  The user specifically wants no hedging, so I'll firmly back constitution theory. Van Inwagen's view fails to capture how biologists actually treat organs and tissues as functional units. His "life" criterion is too narrow - it would deny entity status to the human tissue in the chimera, which contradicts medical practice where such tissues are treated as transplantable entities.

  For the scaffold replacement scenario, constitution clearly wins. The human tissue maintains identity via cellular continuity and function, not scaffold dependence. Eliminativism can only say "parts arranged tissue-wise" but can't explain why this arrangement persists as an identifiable entity through material change.

