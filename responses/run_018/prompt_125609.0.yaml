answer: |-
  ### **Boundary Problem Workshop: "The Climate Board Dilemma"**  
  *(75 minutes; minimal materials; no pre-lecture)*  

  ---

  #### **Materials Needed**  
  - Blank sheets of paper (1 per participant)  
  - Pens/markers  
  - Role cards (pre-prepared):  
    - **Resident** (8 cards): "You live in the region. Start with 3 tokens. Goal: Get the trial approved to boost local jobs."  
    - **Downstream Affected** (6 cards): "Your community is outside the region but impacted. Start with 2 tokens. Goal: Block the trial to avoid ecological risks."  
    - **Future-Gen Proxy** (2 cards): "You represent future generations. Start with 0 tokens. Hidden power: 1 veto card to kill any decision. You can’t speak unless included in the graph."  
  - Tokens (e.g., poker chips, buttons, or tally marks on paper)  
  - Timer  
  - Shared payoff item (e.g., a $20 budget for workshop snacks, or choice of charity for a $50 donation)  

  ---

  #### **Game Rules (15 mins setup + 45 mins activity)**  
  **1. Framing (2 mins):**  
  > *"You’re a regional climate board voting on a geoengineering trial. But first: Who gets a seat? Your task is to draw ‘dependency lines’—arrows showing who is affected by whom. Only those inside the graph can vote. Unanimous consent from current members locks membership. Then, we vote on the trial. If approved, we use the payoff [show snack budget/charity options]. If rejected, it’s lost."*  

  **2. Dependency Graph Setup (5 mins):**  
  - Each participant draws a **directed graph** on their sheet:  
    - Nodes = Participants (use initials).  
    - Arrow **A → B** = *"A’s survival/well-being depends on B’s choices."*  
    - *(Example: A resident draws arrows from themselves to other residents. A downstream draws arrows from themselves to residents.)*  
  - **Rule:** Only nodes with **≥1 incoming arrow** are "affected" and included in the demos.  

  **3. Gameplay Rounds (40 mins):**  
  - **Round 1: Initial Graph (10 mins)**  
    - Participants form a circle. One shared graph is drawn on a central board (or aggregated from sheets).  
    - **Included members** (those with ≥1 incoming arrow) stand inside the circle. Others stand outside.  
    - *Goal: Get unanimous consent to lock membership.*  
    - **Token rule:** Each minute of speaking costs 1 token. At 0 tokens, you’re silent.  

  - **Round 2: Graph Manipulation (15 mins)**  
    - **Power shift:** Anyone *outside* can redraw arrows on the central board to:  
      - Pull themselves in (add an arrow pointing to them).  
      - Push others out (remove an arrow pointing to them).  
    - **Included members** can redraw arrows too—but each edit costs 1 token.  
    - *Deadlock tool:* Membership can *only* be locked by **unanimous consent** of current members.  

  - **Round 3: Decision Phase (15 mins)**  
    - If membership is locked, vote on the geoengineering trial (majority wins).  
    - **Veto power:** Any included Future-Gen Proxy can play their hidden veto card to nullify the vote.  
    - **Payoff:** Distributed only if membership is locked AND a non-vetoed decision is made.  

  ---

  #### **Predictable Tensions (Designed to Surface Theory)**  
  1. **Token exhaustion:** Residents hoard tokens to dominate debate; downstream run out fast.  
  2. **Graph manipulation:** Downstream draw arrows to residents to get in; residents erase arrows to exclude others.  
  3. **Veto silence:** Future-Gen Proxies can’t speak without tokens—likely ignored until they veto.  
  4. **Unanimous consent trap:** One dissenter (e.g., a downstream fighting exclusion) blocks locking.  

  ---

  #### **Debrief (15 mins)**  
  **Guide questions:**  
  1. *"What strategies did you use to get included/excluded? How did it feel?"*  
     → Maps to: **Recursive legitimation** (the included decide who’s "affected").  
  2. *"Why was unanimous consent so hard? What broke it?"*  
     → Maps to: **Cost of inclusion** (more voices = harder consensus; token economy mirrors real barriers).  
  3. *"Did the Future-Gen Proxies impact the outcome? Why/why not?"*  
     → Maps to: **Stakeholder weighting** (silent/minority groups wield hidden power).  

  **Theoretical bridge (facilitator notes):**  
