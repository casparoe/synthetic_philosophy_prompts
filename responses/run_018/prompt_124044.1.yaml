  Please write a deadpan bureaucratic memorandum—approximately 700 words, structured with an Executive Summary, numbered regulatory sections, and an appendix on compliance metrics—from the fictional Department of Civic Virtue and Spectacle Regulation of a modern republic that has adopted Rousseauian civic-republican principles as municipal zoning law. The memorandum should evaluate a proposed "Immersive Narrative District" in which residents and tourists wear biometric haptic suits, vote on plot outcomes through emotional feedback sensors, and perform their own lives as continuous interactive spectacle for algorithmic distribution. The voice must be that of an entirely serious planning official: dry, procedural, citing risk categories such as "Moral Contagion Index" and "Civic Passivity Coefficient," with no ironic asides or explicit acknowledgment of absurdity. The satire should derive from the rigorous, literal translation of Rousseau's specific objections into this invented modern context—actors as deceptive professionals who forfeit citizenship; spectators who develop tastes for display incompatible with rational deliberation; spectacle that generates artificial inequality through visible consumption; and any gathering organized around watching rather than acting as a direct threat to the general will—so that a reader familiar with Rousseau's argument recognizes each clause as a faithful extension rather than a caricature. You should invent all district names, official titles, and quantitative metrics, but keep the philosophical machinery exact. Do not include bibliographies, reading lists, citation requests, or references to other scholars. Avoid verbatim quotations from any historical text; paraphrase Rousseau's positions without quotation marks. The piece should be readable to someone who has never encountered the original argument, yet should reward a specialist with the recognition that the author understands precisely what is being satirized.
