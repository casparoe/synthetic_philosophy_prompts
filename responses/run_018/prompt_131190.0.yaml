     Now, the Adjudicators don't know the Critics' remaining cards. They must vote each round.

     Historical mapping in debrief:

        Round1 (Time1): Early 19th century (e.g., 1800-1850) - innovations like new world agriculture expansion.
        Round2 (Time2): Late 19th century (1850-1900) - industrial revolution in agriculture?
        Round3 (Time3): Mid 20th century (1900-1960) - Green Revolution and demographic transition.
        Round4 (Time4): Late 20th century (1960-2000) - continued effects.

     The game:

        Round1:
          Defenders: Without intervention, we predict catastrophe at time1 (population 160 > resources 150).
          Critics: Play Card1 (Agricultural Expansion) -> resources become 200, so safe.
          Adjudicators vote: did the Critics just rescue the theory? or falsify it?

        Round2:
          Defenders: Without intervention, we predict catastrophe at time2 (P=256, R=200+50=250) -> 256>250.
          Critics: Play Card2 (Green Revolution) -> now resource growth is +70. So R2=200+70=270 -> safe (256<270).
          Adjudicators vote.

        Round3:
          Defenders: Without intervention, catastrophe at time3: P3=256*1.6=409.6, R3=270+70=340 -> 409.6>340.
          Critics: Play Card3 (Demographic Transition) -> population growth becomes 1.2. So P3=256*1.2=307.2 -> safe (307.2<340).
          Adjudicators vote.

        Round4:
          Defenders: Without intervention, catastrophe at time4: P4=307.2*1.2=368.64, R4=340+70=410 -> but 368.64<410, so safe. But the Defenders' projection without intervention would be: 
            They assume no innovation, so they think the growth rates are still 1.6 and +50? But the Critics have changed the growth rates. 

          How do the Defenders project? They are projecting based on the original theory (without innovations). So they would project:
            P4 = 307.2 * 1.6 = 491.52   [but wait, the current population growth is 1.2, but the Defenders don't acknowledge the change? They are structuralists, so they stick to the original growth rates?]

          We need to define: the Defenders always project using the original growth rates (geometric 1.6 and arithmetic +50) because they believe the innovations are temporary or will be overwhelmed.

          So in Round4, Defenders say: 
            Without further innovation, the population will grow to 307.2 * 1.6 = 491.52, and resources will be 340+50=390 -> catastrophe (491.52>390).

          But the Critics have already changed the growth rates permanently. So when we update, we use the current growth rates (which the Critics have changed). 

          So the actual update for time4: 
            P4 = 307.2 * 1.2 = 368.64   (because the demographic transition is permanent)
            R4 = 340 + 70 = 410          (because the green revolution is permanent)

          And 368.64 < 410 -> safe.

          The Defenders' prediction of catastrophe (based on original rates) does not come true.

          This is the key: the Critics have changed the structure. The Defenders are still projecting with the old structure, but the world has changed.

          The Adjudicators see: the Defenders predicted catastrophe at time4 (based on their model) but it didn't happen.

          Critics: have no card to play (they already played all) but they don't need to because the growth rates are already changed.

          So we update: time4 is safe.

          Then the Adjudicators vote for the last time.

     At the end of the game, we check: did any catastrophe occur? In this play, no catastrophe occurred at any time. So the theory is falsified.

     Then, for Adjudicators:
        - They lose one chip for every Rescued vote they cast.

     But note: in Round4, the Defenders predicted a catastrophe that didn't occur. The Critics argue that the theory is falsified. The Adjudicators might vote Falsified in Round4.

     How the Adjudicators might vote in each round:

        Round1: They see an innovation saved the day. They might vote Rescued (the theory is still valid) or Falsified (because the catastrophe didn't happen and the theory doesn't account for innovation).

        Round2: Similarly.

        Round3: Similarly.

        Round4: The Defenders' prediction failed. So they might vote Falsified.

     But the ultimate fate: no catastrophe -> falsified theory.

     So Adjudicators who voted Rescued in any round lose one chip per such vote.

     Now, the game is set.

  Rules Summary:

  **Setup**
  - Defenders Team: They have a chart showing the initial state (Time0: P=100, R=100) and the growth rules: population grows geometrically by 60% per round, resources grow arithmetically by 50 per round.
  - Critics Team: They have three innovation cards:
    1. Agricultural Expansion: Playable in Round1 or Round2. When played, add 50 to the resources of the current round (the round being projected).
    2. Green Revolution: Playable in Round2 or Round3. When played, change the resource growth to +70 per round from this round onward.
    3. Demographic Transition: Playable in Round3 or Round4. When played, change the population growth rate to 1.2 (from 1.6) from this round onward.
  - Adjudicators Team: Each gets 5 credibility chips.

  **Round Structure (4 rounds)**
  - Each round corresponds to moving one time step (Round1: Time0->Time1, Round2: Time1->Time2, etc.).

  1. **Current State Display**: Show the current population and resources (at the start of the round, it's the state from the previous time).
  2. **Defenders' Turn**: 
     - Project the next time step using the original growth rates (population *1.6, resources +50) and predict catastrophe if P_next > R_next.
     - They argue the theory is still valid.
  3. **Critics' Turn**:
     - They may play one innovation card (if available and playable in this round) to alter the projection for this next time step. They explain how it changes the outcome.
     - If they play a card, the facilitator applies the effect to the next time step (and for growth rate changes, they apply for all future rounds).
  4. **Update State**:
     - Calculate the next time step's population and resources using the current growth rates (which might have been changed by previous cards) and any one-time effect from the card played this round.
     - Check for catastrophe: if P_next > R_next, then catastrophe occurs; else, safe.
  5. **Adjudicators' Deliberation and Vote**:
     - Adjudicators discuss and then secretly vote for:
          - Falsified: The theory is false because the predicted catastrophe did not occur and the innovation has shown the theory is invalid.
          - Suspended: We don't have enough evidence to decide.
          - Rescued: The theory is still valid because the innovation is a temporary fix and the gap will reappear.
     - Votes are collected and tallied. The outcome (which option won) is announced, but individual votes are recorded by the facilitator for end-game accounting.

  **End of Game**
  - After Round4, determine if the theory is confirmed or falsified:
     - If at any time step a catastrophe occurred (P_t > R_t), then the theory is confirmed.
     - Otherwise, the theory is falsified.
  - Adjust Adjudicators' chips:
     - If the theory is confirmed:
          - Each Adjudicator loses 1 chip for every vote they cast as Falsified.
     - If the theory is falsified:
          - Each Adjudicator loses 1 chip for every vote they cast as Rescued.
     - Suspended votes: no loss.
  - Each Adjudicator counts their remaining chips. The one with the most chips wins (for fun).

  **Debrief**
  - Map each round to history:
     - Round1 (Time1): Early 19th century - Malthus's prediction avoided by agricultural expansion (e.g., new farming techniques, opening new lands).
     - Round2 (Time2): Late 19th century - Industrial revolution and technological progress in agriculture (e.g., synthetic fertilizers beginning) avoided the crisis.
     - Round3 (Time3): Mid 20th century - Green Revolution (high-yield crops) and the start of demographic transition in some regions.
     - Round4 (Time4): Late 20th century - Continued effects of demographic transition (lower birth rates) and further technological progress.
  - Key question: At what point did you feel the theory was "right but early"? When did you feel it was falsified?
  - Highlight: The Defenders kept projecting using the original growth rates, but the Critics changed the underlying structure. The theory didn't account for human innovation changing the parameters.

  **What will break the first time?**
  1. **Growth Rate Confusion**: The change in growth rates (permanent effect) might be forgotten by the facilitator. Have a cheat sheet.
  2. **Adjudicator Vote Confusion**: The vote is about the current state after seeing the outcome, but the ultimate accounting is at the end. Adjudicators might not understand the long-term consequences of their vote.
  3. **Critics' Card Play**: They might not play optimally (e.g., play all cards early and face catastrophe later). But that's okay, it leads to different outcomes.
  4. **Defenders' Projection**: In Round4, Defenders project using the original rates, but the actual update uses the new rates. This might cause debate. Emphasize that Defenders are committed to the structural model.

  **What the game cannot reproduce**:
  - The actual waiting for centuries. The game compresses time and has only 4 rounds. The real Malthusian debate spans 200 years and involves complex social and technological changes that are hard to simulate.
  - The game assumes that innovations are discrete and known in advance. In reality, innovations are uncertain and might not be foreseeable.
  - The game simplifies the definition of catastrophe and the growth curves. Real-world dynamics are more complex.
