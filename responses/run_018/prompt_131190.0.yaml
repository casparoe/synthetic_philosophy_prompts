  ### **"Right But Early?" Classroom Game**  
  **Goal:** Simulate the tension in long-run predictions (like Malthus' population-resource gap) where a theory seems "falsified" until rescued by innovations, but may still be structurally valid.  

  ---

  ### **Setup**  
  **Time:** 4 rounds (12 min/round) + 12 min debrief (60 min total).  
  **Players (10 students):**  
  - **Defenders (3):** Uphold the "Doom Chart" (population grows geometrically, resources arithmetically).  
  - **Critics (3):** Play "Innovation Cards" to shift the resource curve and avoid catastrophe.  
  - **Adjudicators (4):** Vote on the theory’s status using "credibility chips" (5 chips each).  

  **Materials:**  
  - **Doom Chart Poster:**  
    - *Round 0:* Population = 100, Resources = 100.  
    - *Growth Rules:*  
      - Population: Multiply by 1.5 each round (geometric).  
      - Resources: Add 50 each round (arithmetic).  
  - **Innovation Cards (Critics hold these):**  
    - **"Synthetic Fertilizer"** (Playable in Round 2 or 3): Resources grow by +75 this round (instead of +50).  
    - **"Green Revolution"** (Playable in Round 3 or 4): Resources jump +100 this round.  
    - **"Demographic Transition"** (Playable in Round 3 or 4): Population grows by 1.2x this round (instead of 1.5x).  
  - **Voting Tokens (Adjudicators):**  
    - 3 options: 🟥 **Falsified**, 🟨 **Suspended**, 🟩 **Rescued**.  

  ---

  ### **Rules**  
  **Each Round (4 rounds total):**  
  1. **Defenders Present (2 min):**  
     - Update the Doom Chart using base growth rates.  
     - Show the widening gap. Argue: *"Catastrophe is inevitable without intervention!"*  
     - *Example Prediction:* "Population will outstrip resources by Round 3!"  

  2. **Critics Respond (2 min):**  
     - Play **one card** (or none) to alter growth this round.  
     - Explain how it "saves" the world (e.g., *"Green Revolution boosts crop yields!"*).  
     - Update the chart with their card’s effect.  

  3. **Adjudicators Vote (3 min):**  
     - Secretly vote 🟥/🟨/🟩 based on:  
       - 🟥 **Falsified:** "The gap closed—theory is wrong!"  
       - 🟨 **Suspended:** "Not enough evidence—wait and see."  
       - 🟩 **Rescued:** "Theory is right but delayed by innovation!"  
     - Tally votes (majority wins; ties = 🟨 Suspended).  

  4. **Update & Reveal (1 min):**  
     - Announce vote outcome and update the chart for the next round.  
     - Record if catastrophe occurs: **Population > Resources?**  

  **Chip Penalties (Adjudicators only):**  
  - Lose 1 chip if you vote 🟥 **Falsified** and Critics play a rescue card *in the same round*.  
  - Lose 1 chip per 🟩 **Rescued** vote if the game ends with **no catastrophe** ("predictive bankruptcy").  
  - *No penalties for 🟨 Suspended.*  

  **Endgame:**  
  - After Round 4, check for **catastrophe** (any round where Population > Resources).  
  - If catastrophe occurred: Defenders "win."  
  - If no catastrophe: Critics "win."  
  - Adjudicator "winner": Most chips left.  

  ---

  ### **Game Flow (Designed to Mirror Malthus)**  
  - **Round 1 (1800s):**  
    - Base growth: Pop = 150, Resources = 150.  
    - Critics: *No cards played.* Gap is small—no catastrophe.  
    - **Tension Point:** Adjudicators debate: *"Is the gap real?"*  
  - **Round 2 (Early 1900s):**  
    - Base growth: Pop = 225, Resources = 200 → Catastrophe!  
    - Critics play **"Synthetic Fertilizer"** → Resources = 275.  
    - **Tension Point:** *"Did Critics disprove the theory, or just delay doom?"*  
  - **Round 3 (1960s):**  
    - Base growth: Pop = 337.5, Resources = 325 → Near-catastrophe.  
    - Critics play **"Green Revolution"** → Resources = 425.  
    - **Tension Point:** *"How many rescues are too many?"*  
  - **Round 4 (1980s–Today):**  
    - Base growth: Pop = 506.25, Resources = 475 → Catastrophe predicted.  
    - Critics play **"Demographic Transition"** → Pop = 405, Resources = 525.  
    - **No catastrophe!**  
    - **Tension Point:** *"Was the theory 'right but early,' or fundamentally wrong?"*  

  ---

  ### **Debrief (12 min)**  
  1. **Map to History:**  
     - Round 1: British census data (1798–1820). Malthus seemed plausible—gap existed but was small.  
     - Round 2: Industrial Revolution. Innovations (fertilizers) "falsified" Malthus temporarily.  
     - Round 3: Green Revolution (1960s). Critics argued tech could *always* save us.  
     - Round 4: Demographic transition (1980s–now). Falling birth rates + tech made doom avoidable.  

  2. **Key Questions:**  
     - *When did you feel the theory was "right but early"?* (Likely Rounds 2–3, when rescues felt temporary.)  
     - *When did you feel it was falsified?* (Likely Round 4, when structural changes broke the model.)  
     - *Did suspending judgment (🟨) feel safer? Why?*  

  3. **Philosophical Insight:**  
     - **"Right but early" tension** arises when:  
       - Defenders assume fixed structures (population/resource curves).  
       - Critics change the structure (via innovation).  
     - **Real-world difference:** We can’t "fast-forward" 200 years IRL like in the game. Waiting breeds uncertainty!  

  ---

  ### **What Will Break (And Why)**  
  - **Predictable Snag:** Adjudicators will panic when Critics run out of cards in Round 4. They’ll overuse 🟩 Rescued early and risk "predictive bankruptcy."  
  - **Unfixable Shortcoming:** The game **can’t simulate time**. IRL, we wait decades to see if a rescue is permanent—here, it’s resolved in 60 minutes.  
  - **Pro Tip:** Assign a "facilitator" (you or a student) to enforce chip penalties and update the chart. Keep rounds snappy!  

  ---  
  **Why It Works:** By Round 4, players realize they’ve reenacted Malthus—without anyone naming him—and *feel* why "falsified" vs. "rescued" debates rage in science.
