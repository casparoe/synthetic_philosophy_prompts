answer: |-
  ### Flatland Market Activity  
  **Goal**: Illustrate Friedman's F-twist—unrealistic assumptions can enable predictive success without ontological truth.  

  #### Setup (10 min)  
  - Split into two teams:  
    - **Predictors**: Must use a *geometric model* (e.g., price = \(k \times \text{average distance between circles and squares}\)).  
    - **Mechanists**: Must use *agent-based rules* (e.g., preferences, costs, decisions).  
  - **Market Rules**:  
    - Goods: Red (priced) and Blue (fixed price).  
    - Agents: 5 circles ▲ and 5 squares ■ on a 5x5 grid.  
    - **True hidden mechanism**: Price of Red = (Number of ▲) / (Number of ■).  
    - **Facilitator manipulates**:  
      - Grid positions (arbitrary, but set to correlate distance with price).  
      - Agent counts (change between rounds).  
  - **Payoffs (points)**:  
    - Predictors: +10 per accurate price forecast (within ±0.05).  
    - Mechanists: +5 per accurate forecast + +10 per "true" mechanism element (assessed post-game).  

  #### Rounds (45 min)  
  1. **Round 0 (Baseline)**:  
     - Grid: Random placement (avg. distance = 4.0). Price = 1.0 (▲=5, ■=5).  
     - Teams observe, build initial models.  
  2. **Round 1**:  
     - ▲=4, ■=6; avg. distance = 6.0 → Price = 0.67.  
     - Teams predict Round 2 price.  
  3. **Round 2**:  
     - ▲=5, ■=5; avg. distance = 4.0 → Price = 1.0.  
     - Teams predict Round 3 price.  
  4. **Round 3**:  
     - ▲=4, ■=6; avg. distance = 6.0 → Price = 0.67.  
     - **Predictor win condition**: Distance-based model predicts perfectly (price ∝ 1/distance).  
     - **Mechanist struggle**: Agent rules (e.g., "squares prefer Red") fail to explain price swings.  

  #### Debrief (20 min)  
  - **Round 1**: Predictors adopt false geometric rules → *Idealization as a tool*.  
  - **Round 2**: False model predicts accurately → *Success without realism*.  
  - **Round 3**: Mechanists’ "true" model underperforms → *Prediction ≠ explanation*.  
  - **Settled**: Idealization is common; unrealistic assumptions can be pragmatic (Friedman’s core).  
  - **Contested**: Whether this decoupling works outside economics; if explanation requires truth.  

  #### Predictable Problems  
  - **Mechanists protest**: Agent rules feel arbitrary without data, causing frustration.  
  - **Correlation suspicion**: Participants may notice the geometric setup is rigged (address by stressing "coincidental predictive power").  
  - **Time crunch**: Grid measurements (distance) may delay rounds; simplify with pre-calculated distances.  

  #### Unreproduced Feature  
  The activity can’t show Friedman’s **"prediction as the only test"**—it assumes simple, knowable truth. Verbally clarify: In complex systems (e.g., real markets), mechanisms may be *unknowable*, making prediction the sole viable criterion.  

  **Total words**: 398
