  Okay, the user is planning a 90-minute session for philosophy undergraduates who have studied Frege's sense-reference distinction and have some familiarity with rigid designation. They haven't encountered two-dimensional semantics yet. The user wants a teaching arc that introduces primary and secondary intension as a natural solution, not just adding more complexity.

  I need to design a step-by-step sequence that builds understanding logically. The user specifically wants to avoid the Hesperus-Phosphorus example and instead use a case involving a name introduced through a theoretical description that turns out false. The "Vulcan" case Le Verrier proposed fits perfectly - where astronomers named a planet based on perturbations in Mercury's orbit, but it didn't exist. This example clearly separates epistemic access (what was believed) from metaphysical rigidity (the actual referent, which is nothing).

  Key misconceptions to address: students might think primary intension is just a mental image or that the two dimensions represent temporal stages. I need to intercept these at specific points. Also, they might confuse the two intensions with Frege's sense and reference. I'll clarify that sense is closer to primary intension but not identical, and reference aligns with secondary intension.

  The session should end with a check question to test if students understand that secondary intension remains rigid even if primary intension is satisfied differently. For example: "In scenarios where Vulcan exists but isn't causing Mercury's perturbations, what does 'Vulcan' refer to?" Correct answer: nothing, since secondary intension is rigidly fixed to the actual referent.

  Technical apparatus to omit: centered worlds and explicit quantification over epistemically possible scenarios. Mention these are important but beyond the session's scope to keep it focused.

  Break down the session into timed segments. Start with a Frege and Kripke recap (10 mins), then introduce the problem of empty names with Vulcan (15 mins). Define primary intension using epistemic possibilities (20 mins), then secondary intension focusing on metaphysical possibilities (20 mins). Synthesize the two (15 mins), and end with a check question and wrap-up (10 mins).

  Use the Vulcan example throughout to maintain continuity. When explaining primary intension, emphasize it's about how reference is fixed by descriptions, not mental images. For secondary intension, stress rigidity across counterfactual worlds. The synthesis should show how both dimensions solve the problem without ad hoc elements.

  Anticipate that during the primary intension discussion, students might confuse it with mental images. Intercept by clarifying it's about the descriptive conditions in the language community, not individual psychology. When moving to secondary intension, prevent the temporal stages misconception by stating that both dimensions are evaluated at the same time from different perspectives.
answer: |-
  Here’s a structured 90-minute teaching arc designed to make primary/secondary intension feel like a necessary solution, using the "Vulcan" case and preempting common misconceptions:

  **Core Case:** "Vulcan" – Le Verrier’s hypothetical planet posited (via description: *"cause of Mercury’s orbital perturbations"*), later disproven.  
  **Why better than Hesperus/Phosphorus?** Vulcan cleanly separates:  
  ① **Epistemic dimension** (how reference was *fixed*: descriptively)  
  ② **Metaphysical rigidity** (actual rigid referent: *nothing*).  
  Venus examples blur this by having both a rigid referent *and* successful descriptive fixation.

  ---

  ### **Teaching Arc (90 Mins Total)**  
  **Goal:** Frame 2D semantics as resolving tensions in Frege/Kripke.

  1.  **Recap & Problem Setup (10 mins)**  
      - *Frege:* Sense (mode of presentation) vs. Reference.  
      - *Kripke:* Rigid designation (reference fixed by baptism, stable across worlds).  
      - **Problem:** How to handle names like "Vulcan" where the *baptismal description fails*?  
        - Q: "When 19th-century astronomers said 'Vulcan', did they refer to *anything*? If not, what were they doing?"

  2.  **Introduce "Vulcan" Case (15 mins)**  
      - Historical context: Orbital perturbations → "Let ‘Vulcan’ name the planet causing this."  
      - Discovery: No such planet; perturbations explained by general relativity.  
      - **Tension:**  
        - *Kripkean rigidity:* "Vulcan" was introduced as a name → *should* rigidly designate... but *what?*  
        - *Fregean sense:* The sense ("cause of perturbations") has *no referent*.  
      - **Key Q:** "What *could* 'Vulcan' have referred to? How do we capture its meaning pre/post-discovery?"

  3.  **Primary Intension as Epistemic Dimension (20 mins)**  
      - Define: **Primary intension (PI)** = How reference *would be determined* given a *scenario* (actual world considered as epistemic possibility).  
      - Apply to Vulcan:  
        - *In scenario S:* If Mercury’s perturbations in S are caused by planet X, then in S, "Vulcan" refers to X.  
        - *In actuality:* No satisfier → reference fails.  
      - **Intercept misconception:** "PI is the speaker’s mental image?"  
        → *Clarify:* PI is *public linguistic rule* (the baptismal description), not private psychology. Vulcan’s PI is fixed by community-wide theory.  
      - **Emphasize:** PI tracks *epistemic possibility*: "For all we knew pre-1915, Vulcan could’ve been any planet fitting the description."

  4.  **Secondary Intension as Metaphysical Dimension (20 mins)**  
      - Define: **Secondary intension (SI)** = How reference *actually plays out* across counterfactual worlds, *given actual reference fixers*.  
      - Apply to Vulcan:  
        - Actual baptism fixed reference *via description* → but no referent exists.  
        - **Rigidity consequence:** SI of "Vulcan" is *empty* in *all* possible worlds (like "Sherlock Holmes").  
      - Contrast with Kripke: Rigidity holds *if* reference is fixed, but fixation *failed*.  
      - **Intercept misconception:** "Two dimensions = stages of belief revision?"  
        → *Clarify:* PI/SI aren’t temporal. *Now*, in counterfactual worlds:  
          - PI asks: "If *this* (pointing to actual perturbation data) were the case, what *would* ‘Vulcan’ refer to?"  
          - SI asks: "Given *actual* failed fixation, what *does* ‘Vulcan’ refer to in *that* world?" (Nothing).

  5.  **Synthesis: Why Two Dimensions? (15 mins)**  
      - **Resolve the tension:**  
        - *Pre-discovery:* Speakers associated PI ("cause of perturbations") → *epistemic access*.  
        - *Post-discovery:* SI is rigidly empty → *metaphysical fact*.  
      - **Frege/Kripke reconciliation:**  
        - PI ≈ Fregean sense (but dynamic, world-relative).  
        - SI ≈ Kripkean reference (but sensitive to actual fixation success).  
      - **Not ad hoc:** PI/SI answer distinct questions: "How *could* reference succeed?" vs. "How *does* it rigidify?"

  6.  **Check Question & Wrap-up (10 mins)**  
      - **Check Question:**  
        *"In a counterfactual world W where Mercury’s perturbations are caused by a real planet X (identical to Le Verrier’s theory), does ‘Vulcan’ (as used by* ***us*** *in the actual world) refer to X in W? Why/why not?"*  
        - **Correct Answer:** No. SI is rigidly fixed to *actual* reference (which fails), so in W, "Vulcan" still refers to nothing.  
        - **Reveals grasp:** PI is satisfied in W (X fits the description), but SI dominates modal evaluation. Rigidity holds *despite* PI satisfaction elsewhere.  
      - **Formal omissions:**  
        - Explicitly exclude: **Centered worlds** (mention as a formalization tool for PI but out of scope).  
        - Explicitly exclude: **Quantification over scenarios** (note that "scenario" here is intuitive epistemic possibility).

  ---

  **Why This Works:**  
  - **Problem-driven:** Vulcan’s failure makes PI/SI *necessary* to explain how a name can have cognitive significance (PI) yet rigid emptiness (SI).  
  - **Misconceptions preempted:**  
    - "Mental image" intercepted when defining PI as public linguistic rule (Vulcan’s theory was intersubjective).  
    - "Temporal stages" intercepted when contrasting PI/SI evaluations (both apply *now* to different modal questions).  
  - **Rigidity cleanly separated:** Vulcan’s actual reference is *nothing*, so SI’s rigidity is trivially empty—unlike Venus, which has a referent "competing" with its description.  

  **Materials Needed:** Whiteboard with 2 axes:  
  - *X-axis:* Epistemically possible scenarios (labeled "Primary Intension → Reference Fixation")  
  - *Y-axis:* Metaphysically possible worlds (labeled "Secondary Intension → Rigid Reference")  
  Plot "Vulcan": PI maps scenarios to planets (or nothing); SI maps all worlds to ∅.
