  **Note**: The unnamed skepticism position (Leaf 6) arises when Q5→Yes but non-circular foundations are unavailable (not shown in diagram for simplicity; it is a sub-branch of Q5→Yes in the "No" paths of Q4).  

  ---

  #### Summary  
  This taxonomy isolates core commitments: **Externalism** evades internal access, **Contextualism** restricts the problem's scope, **Coherentism** embraces circularity, **Foundationalism** demands non-empirical grounds, and **Calibration Escrow** relies on temporal partitioning. The escrow view is a distinct branch, avoiding collapse into other positions by its unique temporal mechanism. Skepticism emerges where all escape routes fail. Empty combinations reflect conceptual tensions, not mere gaps.
