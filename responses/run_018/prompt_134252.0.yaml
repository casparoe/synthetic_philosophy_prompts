prompt: |-
  hey, im a phd student in phil of science / decision theory and im trying to write the criteria section for a chapter on the st. petersburg paradox. right now everyone just picks bounded utility or risk weighting and moves on, but i want the full desiderata spec first—what must any adequate resolution actually deliver?

  so: write the list of requirements. for each, include the case or reasoning behind it—e.g., why it needs to explain the gap between infinite mathematical expectation and finite willingness-to-pay, whether it has to take a stance on actual vs potential infinity in value, why it cant collapse rational risk-aversion into pure psychological bias, and what consistency conditions it owes to standard expected-utility reasoning for bounded gambles. flag which are non-negotiable and which are just camp preferences (say, preserving exact EU vs allowing domain-restrictions).

  specifically, im worried there's a jointly unsatisfiable cluster: can you both insist the coin-toss mechanics are perfectly fine and demand that rational agents cap valuation, without being ad hoc about where the boundary falls? and does keeping EU intact for normal bets but banning it for unbounded ones commit you to a hidden metaphysical claim about infinite utility?

  briefly—just orienting, not grading—how do the usual moves stack up: bounded utility functions, prospect-theory-style weighting, cognitive-boundedness arguments, and the "just reject the game" strategy?

  casual is fine, this is for a workshop draft. and fwiw i keep writing petersberg with an extra e—dont correct me.
