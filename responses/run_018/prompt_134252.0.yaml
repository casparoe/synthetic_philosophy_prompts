answer: |-
  Here's a desiderata spec for an adequate resolution of the St. Petersburg Paradox, balancing non-negotiables (NN) with more contested "camp preferences" (CP). I've flagged the tensions you're worried about.

  **Core Desiderata (Non-Negotiables - NN):**

  1.  **Finite Valuation Requirement (NN):** *Must* explain why a rational agent's maximum willingness-to-pay (WTP) for the St. Petersburg game is finite *in practice and principle*, despite its infinite mathematical expectation. Reasoning: The core paradox is the stark contradiction between the formal calculation (Σ [1/2^n * 2^n] = Σ 1 = ∞) and the universal intuition/observation that no one pays anywhere near infinity (or even very large finite sums). Any resolution failing this is irrelevant.

  2.  **Preserve Instrumental Rationality (NN):** *Must not* reduce rational risk aversion to *mere* psychological bias, computational limitation, or misunderstanding. It should explain the finitude *as rational*. Reasoning: The paradox is framed as a challenge to *rational* decision theory (DT). Dismissing it as "humans are dumb/bounded" sidesteps the normative question: *Should* an ideally rational agent pay an arbitrarily large sum? If the answer is "no, and here's a rational principle why," that's a resolution. If it's "well, humans can't compute it," that's an empirical observation, not a normative resolution. (See also D7).

  3.  **Respect Stochastic Dominance (Weak Form) (NN):** The resolution *must* satisfy weak stochastic dominance. If Gamble A pays at least as much as Gamble B in *every* possible state of the world, then A should be weakly preferred to B. Reasoning: Violating this leads to blatantly irrational behavior (e.g., preferring a gamble that *always* pays less). The St. Petersburg game dominates any finite sure payoff, so WTP *must* exceed any finite amount. **This is the core tension point with D1.** A resolution *must* resolve *this* conflict: How can WTP be finite if the game dominates every finite payoff? (This is where bounded utility, risk weighting, etc., *must* do their work).

  4.  **Consistency with Standard EU for Bounded Gambles (NN):** The resolution *must* recover standard Expected Utility (EU) theory for gambles with finite maximum payoffs (or finite support). Reasoning: EU works remarkably well for a vast domain of "normal" decisions. A resolution fundamentally altering its predictions here would be overly destructive and fail to explain why the paradox *only* (or primarily) bites for unbounded gambles. The mechanism resolving St. Petersburg shouldn't break standard risk-aversion over bounded losses or moderate-stakes insurance.

  5.  **Acknowledge the Infinity (NN):** The resolution *must* explicitly address the nature of the infinity involved – whether it's potential (the series diverges) or actual (an infinite outcome is conceived). Reasoning: Ignoring this leads to hand-waving. Does the resolution work by denying the *possibility* of the game? By arguing infinite utility is incoherent? By making the *expectation* finite despite the divergent series? By arguing the infinite expectation isn't the relevant quantity? It needs a clear stance.

  **Desiderata Refining the Solution Space (Camp Preferences - CP):**

  6.  **Preserve Linearity in Probabilities (CP - Strong EU):** *Should*, ideally, maintain the linear treatment of objective probabilities within the valuation framework. Reasoning: This is a core strength of standard EU, providing clear separation between beliefs (probabilities) and preferences (utility). Prospect Theory-style weighting functions violate this, introducing non-linearity directly into probability processing. While effective descriptively, it's often seen as less normatively compelling for *rational* resolution.

  7.  **Avoid Ad Hoc Boundaries (CP):** The mechanism capping WTP *should not* rely on arbitrary boundaries (e.g., "utility caps at U($1T)") without a deeper *principle* justifying why the boundary exists *exactly there* and not elsewhere. Reasoning: Solutions relying solely on cognitive bounds (e.g., "humans can't imagine >20 tosses") feel descriptive, not normative. Bounded utility avoids arbitrariness *if* the diminishing shape is justified independently (e.g., by risk aversion over bounded gambles), but the *necessity* of a bound strong enough to make St. Petersburg finite often feels tacked on. **This hits your "cap valuation without being ad hoc" worry.**

  8.  **Preserve Expected Utility Maximization as the Core Principle (CP - Strong EU):** *Should*, ideally, retain EU maximization as the fundamental rational criterion, potentially restricting its *domain of application* (e.g., to gambles with finite expected utility or bounded payoffs), rather than replacing it with a fundamentally different criterion (e.g., rank-dependent utility, safety first) *within* the domain. Reasoning: This maintains theoretical unity and the strong normative appeal of EU derived from axioms. The "reject the game" strategy often implies this domain restriction.

  9.  **Metaphysical Neutrality (CP - Weak):** *Should*, ideally, avoid committing to strong metaphysical claims about the *actual* possibility of infinite utility states or the physical realizability of the infinite coin-toss sequence, focusing instead on the *conceptual* challenge to rational valuation. Reasoning: Resolutions grounded in decision theory itself are often preferred over those requiring controversial metaphysical stances (e.g., "infinite utility is impossible"). However, some resolutions (like some versions of "reject the game") may necessitate such stances (D5).

  **How Usual Moves Stack Up Against Desiderata:**

  *   **Bounded Utility (e.g., Log Utility):**
      *   **Pros:** Nails D1 (Finite WTP), D3 (Dominance - via diminishing MU making later terms negligible), D4 (Recovers standard EU for bounded gambles), D5 (Addresses infinity via convergent utility series), D8 (Preserves EU maximization as core).
      *   **Cons:** Struggles with D7 (The *necessity* and *specific shape* of the bound strong enough to ensure convergence feels potentially ad hoc without independent justification for *that* level of risk aversion. Why *this* bound?). Violates D6 if the bound is seen as arbitrary.

  *   **Risk/Probability Weighting (e.g., Prospect Theory):**
      *   **Pros:** Nails D1 (Finite WTP via downweighting tiny probabilities), D3 (Can be formulated to respect dominance), D4 (Can approximate EU for moderate probabilities), D5 (Addresses infinity by making probabilities vanish faster).
      *   **Cons:** Violates D6 (Non-linear prob weighting), often violates D8 (Replaces core EU with RDU/CPT). D2 is debatable - is weighting rational or descriptive bias? D7 is often a problem (The weighting function is typically descriptive; finding a *normative* justification for the *specific* weighting that resolves St. Pete is hard).

  *   **Cognitive Boundedness (e.g., Finite Horizon):**
      *   **Pros:** Trivially satisfies D1 (Finite WTP by truncation).
      *   **Cons:** Fails D2 (Explicitly makes finitude non-rational, just computational), fails D3 (Dominance is violated - the true game dominates the truncated one), Fails D5 (Doesn't address the conceptual infinity, just ignores it), Fails D7 (The truncation point is fundamentally arbitrary/ad hoc). Primarily descriptive.

  *   **"Reject the Game" (e.g., Impossible to implement/verify, Infinite utility incoherent):**
      *   **Pros:** Satisfies D1 (WTP low/finite by rejecting premise), D3 (If game isn't valid, dominance doesn't apply).
      *   **Cons:** D5 is critical - Requires strong stance (Metaphysical: Infinite utility impossible? Epistemic: Can't verify payoff? Practical: Can't run infinitely?). This stance *is* the resolution. Violates D4 if rejection criteria also rule out complex bounded gambles (needs careful domain restriction). D7/D8: Can be formulated as principled domain restriction for EU maximization (satisfying D8) or as a completely different criterion. D2: Can be rational *if* the rejection principle is justified.

  **Your Key Tensions Addressed:**

  *   **Coin-Toss Mechanics vs. Capped Valuation:** Accepting the mechanics (potential infinity) while demanding finite WTP *requires* a mechanism within the valuation framework that makes the infinite sum converge *in value* (D1, D3, D5). Bounded utility achieves this mathematically. Weighting achieves it by distorting probabilities. "Rejecting" challenges the premise. Cognitive bounds ignore it.
  *   **EU for Bounded, Ban for Unbounded & Metaphysics:** Restricting EU's domain to avoid the paradox *is* a resolution strategy ("Reject the Game"). It *does* implicitly make a claim: "EU is the right criterion *only where its application is well-defined/sensible*." This often relies on a claim that the infinite game is metaphysically impossible, epistemically inaccessible, or practically meaningless (D5, D9). Whether this is "hidden" or explicit depends on the proponent. It avoids altering EU itself (satisfies D8) but at the cost of limiting its scope.

  **In short:** A "perfect" resolution satisfying all NN and CP likely involves **bounded utility with a shape justified independently of the paradox** (addressing D7) or a **principled domain restriction for EU** (carefully argued to avoid arbitrariness and handle D4). The tension between D1/D3 and the desire for non-arbitrariness (D7) and metaphysical neutrality (D9) is the hardest nut to crack. Good luck with the draft! (And noted re: petersberg ;))
