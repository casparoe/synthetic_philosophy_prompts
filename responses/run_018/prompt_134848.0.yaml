prompt: |-
  I sit on the Regional Water Authority's Risk Allocation Comitte and we have a meeting Thursday about the Mill Creek reservoir upgrade. The climate scientists say we can't give a point estimate for the 500-year storm frequency anymore — they only have imprecise probabilities, like the annual exceedance rate is somewhere between 0.001 and 0.008 — and our charter requires "reasonable confidence" in any risk quantification before we approve capital spending. Some members want to use the upper bound and greenlight the $40M project right away; others say that's just ambiguity aversion pretending to be precaution, and that without a single number we're violating the "best available science" clause. There's also this thing my colleague mentioned about dilation, where gathering more local rainfall data might actually widen the interval instead of narrowing it, so funding more research first could leave us with even less clarity.

  I need a short memo to circulate before Thursday recommending either approve, reject, or approve-with-conditions, with a concrete timeframe and an actual bottom line. Please take seriously the argument that standard expected utility just breaks down here, and don't just restate the legal definition of risk — actually say wether we should treat the interval as actionable or not, and address whether a smaller pilot-study phase makes sense before committing the full budget. Make sure the reasoning engages the strongest point on the losing side honestly, not as a strawman.
reasoning: |-
  Okay, let me tackle this memo request. The user is on a water authority committee facing a tough decision about a $40M reservoir upgrade with uncertain climate data. The key problem is that scientists can only give a range for the 500-year storm probability (0.001 to 0.008 annual exceedance), which creates tension between regulatory requirements for "reasonable confidence" and using "best available science."

  Hmm, the user needs three clear recommendations: approve, reject, or approve-with-conditions. But this isn't just about the numbers - it's about decision-making under deep uncertainty. The dilation problem the colleague mentioned is crucial: more data might make the interval wider, not narrower. That changes everything about how we approach "gathering more information."

  First, I should acknowledge both sides fairly. The "upper bound" advocates have a point about protecting against worst-case scenarios, but calling it "ambiguity aversion" feels accurate - they're substituting uncertainty with a fixed bad number. The science-first group is right about intervals not being actionable, but they're ignoring that waiting might make things worse. 

  The real issue is that expected utility breaks down here because we can't assign probabilities to probabilities. So we need a different framework. Precautionary principle comes to mind, but it needs teeth - concrete actions, not just philosophy. 

  What if we split the project? Phase 1 could be modular components that work regardless of final design (like land acquisition, preliminary works) while funding targeted research. But the research has to be designed differently - not to narrow the interval, but to reduce catastrophic downside risk. Maybe focus on whether the 0.008 is physically plausible rather than finding "the" number.

  For the memo structure: start by validating both concerns, then explain why neither extreme works, propose the phased approach with clear triggers ("if research shows X, then we do Y"), and end with a bottom-line dollar figure for initial commitment ($15M feels right - enough to be meaningful but not all-in). 

  Key phrases to include: "decision robustness" over precision, "avoiding non-probabilistic ruin" for the precaution argument, and "action despite ambiguity" as the guiding principle. Should explicitly say the interval is actionable if we design adaptive plans around it.

  The timeline is tricky - 24 months for research might seem long, but climate studies take time. Need to justify why we're not rushing. And must emphasize that this isn't kicking the can down the road; it's strategic staging with a kill switch if new data shows the upgrade is futile.
answer: |-
  **MEMORANDUM**  
  **TO:** Risk Allocation Committee  
  **FROM:** [Your Name/Position]  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommended Path Forward for Mill Creek Reservoir Upgrade  

  ### I. Core Recommendation  
  **Approve Phase 1 ($15M) immediately** for time-critical, risk-agnostic groundwork (land acquisition, geotech surveys, permitting), **conditional on a 24-month targeted research program ($2.5M)** to resolve catastrophic ambiguity. Full $40M commitment requires Committee re-approval after research concludes, based on updated risk bounds.  

  ### II. Reasoning: Why Neither Extreme Works  
  - **Rejecting "upper bound (0.008) as default"**: Using 0.008 assumes worst-case certainty, violating "best available science." It inflates expected damage costs 8×, potentially misallocating resources. *Strongest pro-upper-bound argument*: In catastrophic scenarios (e.g., dam failure), underprotection’s social cost dwarfs overinvestment. **Counter**: True, but 0.008 may be unrealistically high—committing $40M based solely on upper bound could waste capital needed for higher-likelihood risks.  
  - **Rejecting "no action without point estimate"**: Waiting for precision is scientifically futile (climate nonstationarity ensures intervals persist). Delay risks construction cost inflation (∼6% annually) and leaves status quo exposure. *Strongest science-first argument*: Intervals alone are non-actionable; we can’t optimize cost-benefit without probabilities. **Counter**: "Best available science" *is* the interval—demanding point estimates ignores climate reality. Governance must adapt to ambiguity.  

  ### III. Why Phased Approval Addresses Ambiguity  
  1. **Treat the interval as conditionally actionable**:  
     - The band (0.001–0.008) *is* meaningful: It rules out extremes (e.g., 0.0001 or 0.03).  
     - **Action threshold**: Focus on the *upper tail*. If post-research lower bound exceeds 0.004 (doubling baseline risk), Phase 2 triggers automatically.  
  2. **Target research to reduce existential uncertainty, not variance**:  
     - Fund high-resolution paleoclimate + dynamic downscaling models to test if 0.008 is physically plausible.  
     - **Address dilation**: Design studies to falsify extremes—e.g., if new data *widens* the interval, it signals fundamental unpredictability, justifying robust design (e.g., overbuild to 0.005).  
  3. **Phase 1 unlocks value regardless of ambiguity**:  
     - Securing land/permit options has standalone value (prevents $10M+ cost escalation) and maintains optionality.  

  ### IV. Bottom Line & Timeline  
  - **Approve $15M now** for Phase 1 (start immediately).  
  - **Approve $2.5M research** (results due Q4 2025).  
  - **Full $40M requires renewed vote by Jan 2026**, informed by:  
    - If upper bound ≤0.006, proceed with optimized design.  
    - If lower bound ≥0.004, proceed with resilience enhancements.  
    - If interval widens beyond 0.001–0.010, reevaluate project viability.  
  - **Kill switch**: If research shows upper bound <0.003, cancel Phase 2 and return unused Phase 1 funds.  

  ### V. Why This Meets "Reasonable Confidence"  
  We avoid false precision while acting on known bounds. Funding research *after* Phase 1 mitigates paralysis; rejecting both "assume worst" and "wait for perfect" embodies precaution *and* rigor. This aligns with charter obligations by using the interval to bound maximum regret, not to fake certainty.  

  **Recommended Vote**: Approve-with-conditions as above.  

  ---  
  *Attachment: Cost-benefit sensitivity analysis (0.001–0.008 scenarios)*
