  ## INTERDISCIPLINARY FUNDING COMMITTEE MEMORANDUM  
  **To:** Committee Members  
  **From:** Chair, Humanities Division Interdisciplinary Funding Committee  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Proposal: Center for Geohistorical Ethics (CGE)  

  **1. Proposal Summary:**  
  Applicants seek funding to establish the Center for Geohistorical Ethics (CGE). The center aims to apply historian Fernand Braudel’s framework—specifically his distinction between the *longue durée* (long-term geographical/climatic structures) and short-term events—to the history of moral philosophy. The core thesis posits that dominant ethical frameworks (e.g., deontology vs. virtue ethics) correlate more strongly with environmental factors (e.g., resource predictability, agrarian stability, geography) than with individual philosophical arguments. Moral systems are thus framed as "structural outputs" of environmental conditions rather than products of rational deliberation alone.  

  **2. Clarification of Braudel’s Framework (for Non-Historians):**  
  Braudel divided historical time into three strata:  
  - **Longue durée:** Slow-moving, quasi-permanent structures (e.g., climate, geography, ecosystems) shaping societies over centuries.  
  - **Conjonctures:** Medium-term cycles (e.g., economic trends, demographic shifts) lasting decades.  
  - **Événements:** Short-term events (e.g., wars, treaties, actions of individuals).  
  The *longue durée* acts as the deepest, most influential layer, constraining human agency and cultural development. The proposal transfers this model to ethics, positioning environmental structures as primary drivers of normative systems.  

  **3. Committee Assessment:**  
  The proposal offers a bold interdisciplinary synthesis. Its strengths include:  
  - Potential to uncover overlooked correlations between environmental history and ethical thought.  
  - Innovative use of Braudel’s model beyond traditional historiography.  
  - Engagement with climate science and geography.  

  **However, significant concerns emerged:**  
  - **Analytic Philosophy Objection (Determinism & Moral Autonomy):**  
    The strongest critique holds that reducing ethics to environmental outputs risks *eliminating moral agency*. If ethical frameworks are structurally determined, individuals cannot be meaningfully accountable for moral choices—undermining the foundations of moral responsibility, blame, and praise. This is not merely "environmental influence" but a *reductive determinism* that collapses the normative "ought" into a descriptive "is," invalidating ethical reasoning itself.  

  - **Historical Objection (Causation vs. Justification):**  
    Braudel’s model explains societal persistence, not moral validity. Applying it to ethics risks conflating *why* a norm arose with *whether* it is justified. A duty-based system emerging in a stable agrarian society may be adaptive, but that does not make it morally right—or obsolete in a new environment.  

  - **Climate Science Objection (Correlation ≠ Guidance):**  
    While environmental correlations may exist, they cannot generate normative principles. Knowing that virtue ethics flourished in volatile coastal regions cannot tell us if we *should* adopt virtue ethics today.  

  **4. Moral Agency & Normative Critique:**  
  The proposal’s current framing inadequately addresses:  
  - **Agency:** If structures dominate, what space remains for individual philosophers to challenge or transform ethical paradigms?  
  - **Critique:** How can geohistorical ethics evaluate structures (e.g., condemning exploitative systems) if all ethics are structurally determined?  
  *Potential Path Forward:* The center could explore how agents *negotiate* structural constraints (e.g., how philosophers reinterpret virtues during climatic upheaval), preserving dialectics between structure and agency. Normative critique might target *misfits* between inherited ethics and current conditions.  

  **5. Recommendation: APPROVE WITH CONDITIONS**  
  The intellectual ambition warrants support, but foundational issues require resolution. Funding is contingent on:  
  > **Condition 1:** The CGE must explicitly **decouple explanatory and normative claims** in all research outputs. A dedicated working group (including moral philosophers) will develop a framework for addressing ethical justification without geohistorical reductionism.  
  >  
  > **Condition 2:** Pilot projects must **test methodology** through concrete case studies (e.g., "Virtue Ethics in Mediterranean Volatility vs. Deontology in River-Basin Stability"). These must demonstrate how *both* structure *and* agency shape ethical change.  
  >  
  > **Condition 3:** The center’s name will be amended to **"Center for Geohistory *and* Ethics"** to reflect its dual investigative focus (not presupposed causality).  

  **6. Timeline:**  
  - **By January 15, 2024:** Applicants submit revised proposal addressing Conditions 1–3.  
  - **By March 1, 2024:** Committee reviews revisions. If approved, center launches with 18-month pilot phase.  
  - **September 2025:** Pilot review assesses agency/normativity framework and case-study robustness. Full renewal contingent on satisfactory progress.  

  **7. Weakest Approval Point (Monitoring Focus):**  
  The **risk of methodological overreach**—attributing causal primacy to environment without sufficient evidence of *mechanisms* linking geography to ethical reasoning—is the weakest link. The committee will monitor:  
  - Rigor in distinguishing correlation from causation in case studies.  
  - Engagement with counterexamples (e.g., similar environments producing divergent ethics).  
  - Avoidance of "ecological fallacy" (inferring individual reasoning from group patterns).  

  **Vote:** A vote on this recommendation will be held Thursday, November 2, at 10:00 AM. Please circulate questions by Monday, October 30.  

  ---  
  **Chair’s Note:** This proposal challenges us to interrogate the boundaries of ethics and history. While concerns about determinism are profound, conditioned approval allows us to explore whether geohistory can *enrich* (not replace) moral philosophy—if grounded in interdisciplinary humility.
