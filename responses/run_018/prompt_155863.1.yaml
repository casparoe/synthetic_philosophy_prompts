answer: |-
  Let's break down your roommate's statement point-by-point against Herbert Simon's actual work:

  ### 🧠 Claim 1: "People don't maximize because the human brain is literally too small to compute every option"  
  - **Simon's View (Partial Match):** Simon *did* argue humans lack cognitive capacity for full optimization. But "literally too small" is a misrepresentation.  
  - **Problems:**  
    - Simon framed limits as **computational constraints** (processing speed, memory, attention), not physical brain size.  
    - He emphasized **environmental complexity** as equally crucial: information is incomplete, costly to gather, and future uncertain.  
    - "Brain size" reductionism ignores Simon's focus on **adaptive heuristics**.  

  ### ⚖️ Claim 2: "Bounded rationality is this built-in mental handicap where you just grab the first thing that's good enough"  
  - **Simon's View (Misrepresented):**  
    - ❌ **NOT a "handicap":** Simon presented bounded rationality as an *adaptive mechanism*, not a defect. Humans evolved to make *ecologically rational* decisions.  
    - ❌ **Oversimplifies "satisficing":** It's not "grabbing the first option." Simon described **setting aspiration levels**, searching until meeting them, and adjusting levels iteratively based on experience (*Models of Man*, 1957).  
    - ✅ **"Good enough" is correct:** Satisficing means accepting satisfactory (not optimal) solutions.  

  ### 🧩 Claim 3: "Simon proved this is actually rational—you're being smart within your hard-wired limits"  
  - **Simon's View (Mostly Correct):**  
    - ✅ **Core Insight:** Simon argued that satisficing *is rational* given cognitive and environmental constraints ("Procedural Rationality," *Reason in Human Affairs*, 1983).  
    - ✅ **"Within limits":** "Bounded rationality" explicitly means rationality *conditioned* by human cognitive architecture and information costs.  
    - ❓ **"Hard-wired":** Simon acknowledged biological constraints but emphasized **learned heuristics** and adaptation.  

  ### 💻 Claim 4: "That's why AI will replace human decision-makers... computers don't have brain-size caps and can always run full optimization"  
  - **Simon's View (Fundamental Misreading):**  
    - ❌ **Simon Rejected This:** He argued AI should *augment* humans, not replace them. Computers excel at computation; humans excel at defining problems, setting values, and handling ill-structured situations (*The Sciences of the Artificial*, 1969).  
    - ❌ **"Full optimization" fallacy:** Simon stressed that many real-world problems are **computationally intractable** (e.g., NP-hard). Optimization is often impossible *even for computers* due to complexity.  
    - ❌ **Ignores value ambiguity:** Human decisions involve subjective preferences/values—computers can't "optimize" without human-defined criteria.  

  ### 📍 Additional Issues:  
  - **"Brain-size cap":**  
    - Not a Simon term. Misleadingly conflates **physical neuroanatomy** with **functional computational limits**. Simon used "bounded" to describe processing capacity, not brain volume.  
  - **Framing "rational within limits":**  
    - ✅ **Simon's Own Framing:** He explicitly defined bounded rationality as rational behavior *under cognitive constraints* (contrasted with neoclassical "substantive rationality"). Your roommate gets this right.  

  ### 📌 Summary of Key Misreadings:  
  1. **Physiologizing Cognition:** Reducing "bounded rationality" to "brain size" ignores Simon's focus on **information costs**, **environmental complexity**, and **heuristic processes**.  
  2. **Satisficing Caricature:** Portraying it as "grabbing the first option" ignores **aspiration levels** and **adaptive search**.  
  3. **AI Misinterpretation:** Simon saw AI as a **tool for human cognition**, not a replacement. Optimization is often infeasible even for AI.  
  4. **Omitted Context:** Simon emphasized **organizational structures** and **social systems** as extensions of bounded rationality—not just individual brains.  

  ### ✅ What Your Roommate Got Right:  
  - Humans satisfice due to cognitive limits.  
  - Satisficing is rational under constraints.  
  - "Bounded rationality" means rationality within limits (Simon's core thesis).  

  ### 📚 Simon's Actual View (Nuanced):  
  > *"Human rational behavior... is shaped by a scissors whose two blades are the structure of task environments and the computational capabilities of the actor."*  
  > — Herbert Simon, *Models of Bounded Rationality* (1982)  

  Your intuition is correct: your roommate conflates physical brain size with computational constraints, oversimplifies satisficing, and projects modern AI hype onto Simon’s work. Simon would likely argue AI *enhances* bounded rationality by handling computation—but humans remain essential for framing problems and ethical judgment. 🔍
