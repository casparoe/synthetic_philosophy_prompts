  "Brain-size cap" isn't a technical term - it's pop neuroscience masquerading as economics. Simon would cringe at that reductionism. 

  The "rational within limits" part is actually solid though. That's core to Simon's view. But the roommate undermines it by implying full optimization is superior, which Simon explicitly rejected. 

