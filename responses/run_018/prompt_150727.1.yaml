prompt: |-
  I'm advising a small conceptual working group—three philosophers and one formal theorist, with no direct ML engineering resources—trying to map the most important open questions around adversarial debate protocols in AI alignment, specifically focusing on the failure mode sometimes described as 'obfuscated arguments.' By this I do not mean straightforward deception or false premises, but technically defensible arguments that are structurally opaque: they exploit framing effects, bury critical premises in dense syntactic structures, or integrate so many intermediate steps that an evaluator's interpretive capacity is overwhelmed without any explicit falsehood being present. The group has about three years and wants to know where sustained attention would actually change how we think about debate-based safety, rather than producing another taxonomy of risks.

  Within this space, I'm weighing four interrelated lines, though I suspect some are upstream of others. First, whether there is a stable, principled distinction between strategic ambiguity—deliberate framing designed to exhaust an evaluator's cognitive resources—and genuine conceptual density, where opacity arises from the irreducible complexity of integrating many valid premises; and whether any debate protocol can penalize the former without suppressing legitimate but difficult reasoning. Second, whether the canonical debate framework implicitly assumes a symmetry of interpretive labor between debaters and judges that collapses once one agent can generate arguments at a scale or syntactic complexity that systematically outpaces evaluation, regardless of the argument's actual validity. Third, whether obfuscation in this technical sense should be classified normatively as an epistemic failure mode analogous to lying, or rather as a strategic equilibrium in competitive argumentation, with different implications for how oversight and reward structures should be designed. Fourth, if debate proves robust against explicit deception but structurally vulnerable to this kind of opacity, whether the appropriate response is to redirect priority toward interpretability research or toward adversarial training regimes that specifically reward evaluators for penetrating dense framing.

  I'm not looking for a literature survey or a reading list. I want a defended prioritization: if the group must choose only three questions to pursue in sequence over three years, which should come first, second, and third? For each selection, explain the dependency relation—why settling this one changes the tractability or importance of the others—what specific result or argument over the next two years would cause you to revise the ranking, and what trade-off you are accepting when you deprioritize the remaining option. In particular, I want to know whether you treat the 'symmetry of interpretive labor' problem as a foundational crux that undermines the other three lines, or whether it can be bracketed as an implementation-level concern while the group works first on the normative and conceptual distinctions.
