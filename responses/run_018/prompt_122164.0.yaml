answer: |-
  Your framing is precise and illuminates a genuine, substantive tension within illusionism that often gets glossed over. Let's map the conceptual geography as requested, treating the tension as unsettled and avoiding standard dismissals.

  **Core Distinction: Ontological vs. Epistemic Illusionism**

  1.  **Ontological Illusionism (Strict Elimination):**
      *   **Metaphysical Claim:** Phenomenal properties *simpliciter* (e.g., raw feels, intrinsic qualitative character, "what-it's-likeness" as traditionally conceived) **do not exist** in any form. There is nothing in reality that possesses these properties.
      *   **Role of Introspection:** Introspection is a *systematic hallucination* or *fictional projection*. It generates representations *de re* (purporting to refer directly to real properties of experience) that have *no referent whatsoever*. The representational content involves non-existent properties (e.g., "this neural state has the intrinsic quality *redness*"). The "illusion" is that something is presented *to* introspection that simply isn't there.
      *   **Relation to the Hard Problem:** Dissolves it completely. There is no "phenomenality" to explain, only the neural mechanisms generating the *false belief* or *misrepresentation* of phenomenality. The explanandum vanishes.

  2.  **Epistemic Illusionism (Misrepresentation of Structure):**
      *   **Metaphysical Claim:** Phenomenal properties **do exist**, but they are *physical/functional/computational properties* of neural states. However, introspection *systematically misrepresents their essential nature*. It attributes to them features they lack (e.g., simplicity, intrinsicality, non-physicality) while failing to represent features they possess (e.g., complexity, relationality, physicality).
      *   **Role of Introspection:** Introspection is a *systematically distorted lens* or *inaccurate detector*. It successfully refers *de re* to real properties of neural states (the physical/functional bases of experience), but its representational content *misdescribes* the essential nature of those properties. The "illusion" is one of *mischaracterization*, not non-existence. The property is real, but our introspective grasp of it is deeply flawed.
      *   **Relation to the Hard Problem:** Transforms it. The problem becomes: "Why do *these specific physical/functional properties* (the real phenomenal properties), when introspected, generate a representation *as if* they were simple, intrinsic, and non-physical? Why this specific *mode of presentation*?" This is the "modified hard problem" you identify. It retains an explanatory gap concerning the *nature of the introspective access itself* relative to the underlying properties.

  **Is the Epistemic Reading Coherent Illusionism? Does it Collapse?**

  *   **The Tension with Core Illusionism:** For illusionism to be a *substantive alternative* to standard physicalism (like representationalism or emergentism), the ontological reading seems necessary. The epistemic reading appears dangerously close to standard **reductive representationalism**:
      *   Representationalism typically claims that phenomenal properties *just are* representational properties (or properties represented) of physical states. Introspection might be imperfect, but it fundamentally *tracks* the relevant properties (the representational contents/states).
      *   Epistemic illusionism *agrees* that phenomenal properties exist as physical/functional properties but insists introspection *fundamentally misrepresents their core nature*. This misrepresentation isn't just a minor error; it's so profound that it *generates the intuition of the hard problem*. This is a crucial difference: representationalism aims to make the nature of consciousness intelligible, while epistemic illusionism claims our primary access to it creates a profound illusion about that nature.
  *   **Does it Collapse?** It *threatens* to collapse, but doesn't *necessarily* do so, depending on the severity and nature of the "misrepresentation":
      *   **If the misrepresentation is *only* contingent or partial:** It likely collapses into standard representationalism/physicalism with an error theory about introspection. The hard problem intuition is explained away as an artifact of limited access.
      *   **If the misrepresentation is *necessary* and *profound*:** It might remain distinct. The claim would be that *any conceivable introspective mechanism* operating on physical/functional states *must* represent them *as if* they were non-physical qualia. The illusion is built into the very nature of introspection given its physical substrate. This retains a unique explanatory burden: why is introspection *constitutively* deceived about the nature of the properties it accesses? This "introspective gap" becomes the new hard problem core. However, this risks becoming a new mysterianism about introspection.
  *   **The Burden:** Epistemic illusionism must rigorously defend the *necessity* and *depth* of the misrepresentation without falling back on the very phenomenal properties it claims are misrepresented. It must explain why the physical/functional properties *don't* present their true nature introspectively *in principle*, not just in practice. This is difficult and often relies on arguments about the evolutionary role of introspection (e.g., tracking utility, not ontology), which remain contested and don't clearly establish *necessity*.

  **Structural Illusionism: A Viable Intermediate?**

  Your proposal of "structural illusionism" is insightful and captures a potential middle path:

  1.  **Core Tenet:** Denies the existence of phenomenal properties *as traditionally conceived* (intrinsic, simple, non-relational qualia). However, it posits the existence of **functional-phenomenal hybrid properties (F-P hybrids)**. These are complex physical/functional properties of neural states that possess a *novel aspect* or *causal role* that is *not* captured by standard physical/functional descriptions *alone* and is *responsible* for the introspective report. Crucially, introspection *systematically misclassifies* this hybrid aspect *as* being a purely intrinsic qualitative feel.
  2.  **Metaphysical Status:** F-P hybrids are real, physical properties. Their "hybrid" nature means they have both:
      *   A standard functional/computational profile (e.g., mediating discrimination, guiding behavior).
      *   An additional aspect (let's call it "Q-ish-ness") that is:
          *   Intrinsically tied to their physical/functional realization.
          *   Categorically distinct from *standard* functional properties (it's the "what triggers the specific *kind* of introspective misrepresentation").
          *   *Not* itself an intrinsic quale, but the property *mistaken for* one.
  3.  **Role of Introspection:** Introspection detects the F-P hybrid (specifically its Q-ish aspect) but misrepresents its nature, categorizing it *as* a purely intrinsic quale. The illusion lies in the *categorization error*.
  4.  **Stability Assessment:**
      *   **The Allure:** It avoids strict elimination (ontological) and seems less prone to collapsing into standard physicalism (epistemic) by positing a novel *kind* of physical property specifically linked to the illusion.
      *   **The Instability & Challenges:**
          *   **The Q-ish-ness Problem:** What *is* Q-ish-ness? If it's just a complex functional role, then structural illusionism collapses into epistemic illusionism (misrepresentation of functional properties). If it's a genuinely novel *non-functional, non-qualitative* property, what is its nature? This risks positing an unexplained *tertium quid* – a property that is physical, not qualitative, but somehow distinct from standard functional properties *and* responsible for being mistaken for a quale. This feels metaphysically odd and potentially ad hoc.
          *   **The "Trigger" Problem:** Why does Q-ish-ness *specifically* trigger the introspective system to generate a representation *as of* a quale? The explanatory burden seems similar to the modified hard problem of epistemic illusionism, now focused on the link between Q-ish-ness and the introspective mechanism. How is this link fundamentally different from the link in standard physicalism?
          *   **Collapse into Physicalism?** A physicalist could argue: "F-P hybrids are just complex physical properties. Q-ish-ness is either identical to a functional aspect (collapsing to epistemic illusionism/mild representationalism) or it's an emergent property with novel causal powers. If the latter, and if these powers include *being introspectively accessible in a way that feels qualitative*, then haven't you just reintroduced a form of *real* phenomenality, albeit physical? The introspective 'misclassification' might just be a misleading way of saying our concepts for these physical properties are inadequate." In this view, structural illusionism looks like an unstable halfway house between illusionism and emergentist/reductive physicalism. The denial of "traditional" qualia becomes semantic, while the metaphysical commitment is to a property that *grounds* the qualitative report, effectively *being* the physical correlate of the quale.
          *   **Conceptual Coherence:** Is the concept of a property that is *responsible* for being mistaken for a quale, yet *is not* a quale, and *is not* just a standard functional property, coherent? It requires carving out a new ontological category solely defined by its role in causing a specific misrepresentation. This is conceptually precarious.

  **Conclusion: The Genuine Tension & Paths Forward**

  1.  **The Core Tension is Real:** Your distinction exposes a fundamental fork in the illusionist road. **True ontological elimination** offers the cleanest dissolution of the hard problem but demands a radical error theory about introspection. **Epistemic misrepresentation** seems more intuitive initially but risks collapsing into a form of physicalism (representationalism) with an error theory about introspection, retaining a transformed explanatory gap. The literature often slides between these, masking the tension.
  2.  **Illusionism's Substantive Alternative Status:** To be a clear *alternative* to standard physicalism (not just a rhetorical variant), illusionism **must lean heavily towards the ontological reading**. The epistemic reading, especially if the misrepresentation is seen as contingent or shallow, too easily dissolves into standard physicalism. Only a strong ontological claim truly removes the *explanandum* that fuels the hard problem.
  3.  **Epistemic Illusionism vs. Representationalism:** They are distinct *if* epistemic illusionism rigorously defends the *necessity* and *profoundness* of the introspective misrepresentation concerning the *essential nature* of the real phenomenal properties. Representationalism typically argues introspection can be brought into alignment with the theory (or that the properties *are* representational). However, the line is thin, and epistemic illusionism constantly risks absorption.
  4.  **Structural Illusionism: Unstable Middle Ground?** While a fascinating attempt to find a middle path, structural illusionism appears **metaphysically unstable and likely incoherent upon scrutiny**. The "F-P hybrid" either:
      *   Collapses into the physical/functional properties of epistemic illusionism (if Q-ish-ness is functional).
      *   Collapses into a form of emergentist or reductive physicalism (if Q-ish-ness has novel causal powers tied to subjective report, effectively *being* physical phenomenality).
      *   Posits an unexplained, ontologically dubious "Q-ish-ness" solely defined by causing its own misrepresentation.
      Its appeal lies in seeming to preserve *something* real that grounds the report while denying traditional qualia, but it struggles to define this "something" without either eliminating it (back to ontological) or reifying a version of it (towards physicalism).

  **In essence:** Your tension highlights that robust illusionism requires embracing the starkness of ontological elimination. The epistemic path, while tempting, struggles to avoid becoming physicalism with an error theory about introspection. Structural illusionism, as defined, seems an unstable compromise rather than a coherent synthesis. The unresolved core question remains: **Can we make sense of the *feeling* of phenomenal presence as a systematic hallucination without any corresponding property *being felt*, or must we posit *some* property (even a misrepresented physical one) that *is* the felt aspect?** Illusionism stakes its claim on the former, but the pull of the latter, manifest in your epistemic and structural variants, reveals the profound difficulty of fully relinquishing the phenomenal. This tension is genuine, substantive, and central to evaluating illusionism's viability.
