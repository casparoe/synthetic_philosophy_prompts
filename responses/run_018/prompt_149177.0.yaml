prompt: |-
  You direct the curriculum review board at a museum of comparative genocide studies. Every quarter you receive proposals for new educational modules—lesson plans, exhibit texts, and short documentary scripts—that explain why ordinary people participated in mass killing. You need a reusable procedure your board (historians, educators, and one community representative without advanced historical training) can run consistently within a two-week review cycle, to decide whether a proposal's explanation of perpetrator behavior is defensible, oversimplified, or conceptually confused.

  Ground the procedure in the well-known historiographical tension between Christopher Browning's argument in Ordinary Men—situational and organizational pressures, including peer dynamics, career incentives, dehumanization of victims, and incremental escalation, can explain much killing without requiring deep prior ideological hatred—and Daniel Goldhagen's argument in Hitler's Willing Executioners—that a pervasive, culturally specific eliminationist antisemitism created a reservoir of willingness making ordinary Germans eager executioners rather than reluctant conformists.

  Design the procedure as an ordered protocol: the specific questions to ask at each stage, what counts as a sufficient answer, where the protocol stops with a clear "revise or reject," and where it must hand the decision to the board's values judgment rather than historical fact. The protocol must detect three hard errors: invoking peer pressure or bureaucratic compartmentalization without addressing whether victims were already dehumanized in the culture; invoking ideology without addressing whether organizational context was necessary to translate belief into action; and committing an additive-causation fallacy by listing situational and cultural factors side by side without specifying their interaction or temporal scale. Include explicit decision nodes for "explanatory flattening," where distinct levels of analysis are collapsed into interchangeable causes.

  Then apply the procedure to three proposals:

  1. A high-school lesson plan explaining Reserve Police Battalion 101's killings almost entirely through unit cohesion, fear of isolation, and bureaucratic routinization, mentioning antisemitic propaganda only as background noise.

  2. A documentary treatment arguing that local auxiliary forces in occupied territories killed primarily because they had long internalized an eliminationist worldview specific to their region, with organizational structure mentioned only as an incidental enabling condition.

  3. A museum panel text stating that "both situational pressure and cultural ideology caused the violence, and either one alone would have produced the same outcome," treating the two explanations as independent and interchangeable.

  In your applications, include at least one case where the procedure yields a verdict the board is likely to resist—such as rejecting a proposal that sounds balanced but collapses explanatory layers into an additive model. Also specify precisely what the procedure cannot do: which distinctions require expert historical judgment it cannot automate, and which normative questions (for example, whether emphasizing situational factors risks morally excusing perpetrators) lie outside its scope and must be flagged for separate deliberation.

  Present the deliverable as a reusable checklist with decision nodes, not as an essay about the debate. Mark every hand-off point explicitly.
reasoning: |-
  We are designing a reusable procedure (checklist) for the curriculum review board to evaluate proposals explaining perpetrator behavior in mass killings. The procedure is grounded in the historiographical tension between Browning's "Ordinary Men" (situational/organizational factors) and Goldhagen's "Hitler's Willing Executioners" (ideological/cultural factors). 

  The procedure must detect three hard errors:
  1. Invoking peer pressure or bureaucratic compartmentalization without addressing pre-existing dehumanization of victims in the culture.
  2. Invoking ideology without addressing the role of organizational context in translating belief into action.
  3. Additive-causation fallacy: listing situational and cultural factors without specifying their interaction or temporal scale.

  Additionally, it must flag "explanatory flattening" (collapsing distinct levels of analysis).

  The procedure is an ordered protocol with specific questions, sufficient answers, and clear "revise or reject" points. It must also indicate when the decision is handed over to the board's values judgment.

  ---

  **Procedure: Perpetrator Behavior Explanation Review Protocol**

  **Step 1: Identify the core explanatory factors**
  - Question: What factors does the proposal primarily use to explain why ordinary people participated? (Select all that apply from: situational pressures [e.g., peer pressure, orders, career incentives], organizational structures [e.g., bureaucracy, compartmentalization], cultural/ideological factors [e.g., dehumanization, eliminationist worldview], other [specify].)
  - Sufficient answer: Clear identification of at least one primary factor. If none, reject for lack of explanatory focus.
  - If the proposal only mentions one type of factor (situational/organizational OR cultural/ideological), proceed to Step 2A. If it mentions both, proceed to Step 2B.

  **Step 2A: Check for one-sided explanations**
  - If the explanation is primarily situational/organizational:
    - Question: Does the proposal address whether the victims were already dehumanized in the culture? (Look for explicit discussion or acknowledgment of pre-existing cultural attitudes toward the victim group.)
    - Sufficient answer: Yes, with at least a brief mention of the cultural context of dehumanization. If no, flag as Hard Error 1: "Situational factors invoked without addressing cultural dehumanization." → Decision: Revise or reject.
  - If the explanation is primarily cultural/ideological:
    - Question: Does the proposal address whether organizational context (e.g., state apparatus, group structure) was necessary to translate beliefs into violent action? (Look for discussion of how the ideology became operationalized.)
    - Sufficient answer: Yes, with at least a brief mention of organizational mechanisms. If no, flag as Hard Error 2: "Ideology invoked without addressing organizational translation." → Decision: Revise or reject.

  **Step 2B: Check for multi-factor explanations**
  - Question: Does the proposal specify how the situational/organizational factors and cultural/ideological factors interact? (Check for causal mechanisms, temporal sequence, or mutual reinforcement. Avoid additive lists.)
  - If the proposal presents the factors as additive (e.g., "both A and B caused it") without interaction or scale, flag as Hard Error 3: Additive-causation fallacy. → Decision: Revise or reject.
  - If the proposal does specify interaction (e.g., "cultural ideology made people receptive to situational pressures" or "organizational structures activated pre-existing beliefs"), proceed to Step 3.

  **Step 3: Check for explanatory flattening**
  - Question: Does the proposal treat distinct levels of analysis (e.g., individual psychology, group dynamics, institutional structures, cultural context) as interchangeable or collapse them into a single causal layer? (Look for conflation of micro/meso/macro levels without differentiation.)
  - Sufficient answer: The proposal maintains clear distinctions between levels OR explains how they connect without conflation.
  - If flattened, flag as "Explanatory flattening: distinct levels collapsed." → Decision: This is not an automatic reject, but requires board discussion (hand-off to values judgment). The board must decide whether the flattening is acceptable for the educational context or if it oversimplifies.

  **Step 4: Hand-off points for board judgment**
  - The protocol stops and hands to the board for values judgment in two cases:
    1. When the proposal passes Steps 1-3 without hard errors but may raise normative concerns (e.g., overemphasis on situational factors might be seen as excusing perpetrators). The board must decide if the balance is appropriate for the museum's educational mission.
    2. When explanatory flattening is detected (from Step 3) but the proposal is otherwise acceptable. The board must weigh the educational trade-off between simplicity and accuracy.

  **What the protocol cannot do:**
  - It cannot resolve deep historiographical disputes (e.g., the exact weight of ideology vs. situation in a specific case) — that requires expert historical judgment.
  - It cannot make normative decisions about moral implications — these must be flagged for the board's deliberation.
  - It cannot evaluate the empirical accuracy of historical claims (e.g., the extent of antisemitism in a given society) — that requires fact-checking by historians.

  ---

  **Application to Proposals:**

  **Proposal 1: High-school lesson plan on Reserve Police Battalion 101**
  - Step 1: Primarily situational/organizational factors (unit cohesion, fear of isolation, bureaucratic routinization). Antisemitic propaganda mentioned only as background noise → not primary. Proceed to Step 2A.
  - Step 2A: Does it address cultural dehumanization? No — antisemitism is background noise, not integrated. → Hard Error 1: Situational factors without cultural dehumanization. Decision: Revise or reject.

  **Proposal 2: Documentary treatment on local auxiliary forces**
  - Step 1: Primarily cultural/ideological factors (eliminationist worldview). Organizational structure mentioned as incidental → not primary. Proceed to Step 2A.
  - Step 2A: Does it address organizational translation? No — organizational structure is only an enabling condition, not necessary for action. → Hard Error 2: Ideology without organizational translation. Decision: Revise or reject.

  **Proposal 3: Museum panel text**
  - Step 1: Mentions both situational pressure and cultural ideology → Proceed to Step 2B.
  - Step 2B: Does it specify interaction? No — it states "either one alone would have produced the same outcome," treating them as independent and additive. → Hard Error 3: Additive-causation fallacy. Decision: Revise or reject.

  Note: Proposal 3 is the case likely to resist because it sounds balanced (mentions both factors) but collapses into an additive model. The protocol catches this and requires revision.

  ---

  **Deliverable: Reusable Checklist**

  **Curriculum Review Board: Perpetrator Explanation Evaluation Checklist**

  **Step 1: Core Factors**  
  ☐ Identify primary explanatory factors:  
     - [ ] Situational/organizational (peer pressure, bureaucracy, etc.)  
     - [ ] Cultural/ideological (dehumanization, eliminationist beliefs)  
     - [ ] Other: _______________  
  ☐ If only one factor type, go to Step 2A.  
  ☐ If both factors, go to Step 2B.  
  ☐ If no clear factors, reject for lack of focus.

  **Step 2A: One-Sided Check**  
  *(If only situational/organizational OR cultural/ideological)*  
  ☐ For situational/organizational:  
     - Does the proposal address pre-existing cultural dehumanization?  
       ☐ Yes → Proceed to Step 3.  
       ☐ No → **Hard Error 1: Missing cultural context.** → Revise or reject.  
  ☐ For cultural/ideological:  
     - Does the proposal address organizational translation?  
       ☐ Yes → Proceed to Step 3.  
       ☐ No → **Hard Error 2: Missing organizational mechanism.** → Revise or reject.

  **Step 2B: Multi-Factor Interaction Check**  
  *(If both factors)*  
  ☐ Does the proposal specify how factors interact (e.g., how culture enables situational pressures, or how structures activate beliefs)?  
     ☐ Yes → Proceed to Step 3.  
     ☐ No → **Hard Error 3: Additive-causation fallacy.** → Revise or reject.

  **Step 3: Explanatory Layering**  
  ☐ Does the proposal treat distinct levels of analysis (individual, group, institutional, cultural) as distinct?  
     ☐ Yes → Pass.  
     ☐ No → **Flag: Explanatory flattening.** → Hand to board for values judgment.

  **Board Hand-off Points:**  
  - If Step 3 flags flattening → Board must decide if acceptable.  
  - If proposal passes Steps 1-3 but raises moral/normative concerns (e.g., potential exculpation) → Board must deliberate.

  **Limitations:**  
  - Cannot resolve expert historical disputes.  
  - Cannot assess empirical accuracy of claims.  
  - Cannot decide normative questions — flag for board.  

  **Final Decision:**  
  ☐ Accept  
  ☐ Revise (specify error: _______________)  
  ☐ Reject (specify error: _______________)  
  ☐ Hand to board for judgment (specify issue: _______________)
answer: |-
  ### Perpetrator Behavior Explanation Review Protocol  
  *For museum curriculum proposals on why ordinary people participate in mass killings*  
  **Grounding:** Balances Browning's *Ordinary Men* (situational/organizational pressures) and Goldhagen's *Hitler's Willing Executioners* (cultural ideology).  
  **Hard errors flagged:**  
  1. **Dehumanization Omission:** Situational factors invoked without addressing pre-existing cultural dehumanization of victims.  
  2. **Translation Omission:** Ideology invoked without addressing organizational mechanisms enabling action.  
  3. **Additive-Causation Fallacy:** Factors listed side-by-side without interaction/temporal scale.  
  4. **Explanatory Flattening:** Distinct analytical levels (micro/meso/macro) collapsed.  

  ---

  #### **PROTOCOL CHECKLIST**  
  *Follow in order. Stop at first "Revise/Reject" or hand-off.*  

  **STEP 1: PRIMARY FACTOR IDENTIFICATION**  
  - **Question:** What is the *dominant* explanatory factor? (Select one):  
    - (A) Situational/organizational (e.g., peer pressure, orders, bureaucracy, career incentives).  
    - (B) Cultural/ideological (e.g., eliminationist beliefs, dehumanizing propaganda).  
    - (C) Both equally.  
  - **Sufficient answer:** Clear dominant factor or balanced claim.  
  - **Decision:**  
    - If unclear → **Revise** (ambiguous causality).  
    - Else → Proceed to Step 2A (if A or B) or Step 2B (if C).  

  **STEP 2A: SINGLE-FACTOR VETTING**  
  - **If dominant factor is Situational/Organizational (A):**  
    - **Question:** Does the proposal address whether victims were *already dehumanized* in the perpetrator’s culture?  
    - **Sufficient answer:** Explicit link to cultural context (e.g., "Propaganda normalized hatred," "Victims were historically scapegoated").  
    - **Decision:**  
      - No → **Hard Error 1** (Dehumanization Omission) → **Reject/Revise**.  
      - Yes → Proceed to Step 3.  
  - **If dominant factor is Cultural/Ideological (B):**  
    - **Question:** Does the proposal address whether *organizational structures* (e.g., command hierarchy, peer dynamics) were necessary to translate belief into action?  
    - **Sufficient answer:** Mechanism described (e.g., "Militia structures amplified ideological fervor," "State directives activated prejudices").  
    - **Decision:**  
      - No → **Hard Error 2** (Translation Omission) → **Reject/Revise**.  
      - Yes → Proceed to Step 3.  

  **STEP 2B: MULTI-FACTOR INTERACTION TEST**  
  - **Question:** Does the proposal specify *how* situational/organizational and cultural/ideological factors interact (e.g., temporal sequence, mutual reinforcement, necessary conditions)?  
  - **Sufficient answer:**  
    - Acceptable: "Pre-existing antisemitism *lowered resistance* to peer pressure," "Bureaucracy *amplified* dehumanization."  
    - Unacceptable: "Both were causes" (without interaction), "Either alone sufficed."  
  - **Decision:**  
    - No interaction specified → **Hard Error 3** (Additive-Causation Fallacy) → **Reject/Revise**.  
    - Interaction specified → Proceed to Step 3.  

  **STEP 3: ANALYTICAL LAYERING CHECK**  
  - **Question:** Are distinct levels of analysis (micro/individual, meso/group, macro/societal) treated as *interchangeable*?  
  - **Red flags:**  
    - Peer pressure (micro) equated with state policy (macro).  
    - Ideology (macro) presented as identically causal to careerism (micro).  
  - **Decision:**  
    - Collapsed layers → **Flag: Explanatory Flattening** → **Hand to board** for values judgment (simplicity vs. accuracy trade-off).  
    - Layers distinct → **Proceed to Step 4**.  

  **STEP 4: NORMATIVE HAND-OFF**  
  - **Question:** Does the explanation risk moral oversimplification?  
    - *Examples:* Overemphasizing conformity may imply "excuses"; overemphasizing ideology may imply "collective guilt."  
  - **Decision:**  
    - No → **Accept**.  
    - Yes → **Hand to board** for deliberation (non-historical, values-based judgment).  

  ---

  #### **WHAT THE PROTOCOL CANNOT DO**  
  1. **Resolve historiographical disputes:** Cannot arbitrate Browning vs. Goldhagen evidence (e.g., "How widespread was eliminationist antisemitism?"). *Requires expert historian.*  
  2. **Assess empirical accuracy:** Cannot verify claims (e.g., "Unit cohesion was the *primary* driver"). *Requires fact-checking.*  
  3. **Judge moral appropriateness:** Cannot decide if an explanation "excuses" perpetrators. *Flagged for board deliberation.*  

  ---

  ### **APPLICATION TO PROPOSALS**  

  **PROPOSAL 1: High-school lesson plan on Reserve Police Battalion 101**  
  - **Step 1:** Dominant factor = Situational/organizational (unit cohesion, fear, bureaucracy).  
  - **Step 2A:** Fails to address cultural dehumanization (antisemitism as "background noise").  
    - **Verdict:** **Hard Error 1** → **Reject/Revise**.  

  **PROPOSAL 2: Documentary on local auxiliary forces**  
  - **Step 1:** Dominant factor = Cultural/ideological (eliminationist worldview).  
  - **Step 2A:** Fails to address organizational translation (structure as "incidental").  
    - **Verdict:** **Hard Error 2** → **Reject/Revise**.  

  **PROPOSAL 3: Museum panel text ("both caused it; either alone sufficed")**  
  - **Step 1:** Both factors equally (C).  
  - **Step 2B:** Asserts independence ("either alone would produce outcome"). No interaction/temporal scale.  
    - **Verdict:** **Hard Error 3** (Additive-Causation Fallacy) → **Reject/Revise**.  
  - **Likely board resistance:** Sounds "balanced" but commits hard error. Protocol overrides false parity.  

  ---

  **PROTOCOL OUTPUT SUMMARY**  
  | Proposal | Step Rejected | Reason                          | Board Hand-off? |  
  |----------|---------------|---------------------------------|-----------------|  
  | 1        | Step 2A       | Dehumanization Omission         | No              |  
  | 2        | Step 2A       | Translation Omission            | No              |  
  | 3        | Step 2B       | Additive-Causation Fallacy      | No              |  

  **Final note:** When protocol hands decision to board (e.g., Step 3 flattening or Step 4 moral risk), historians rule on accuracy, educators on teachability, community rep on sensitivity.
