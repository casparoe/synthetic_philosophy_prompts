prompt: |-
  I was chatting with a friend who runs a grad reading group for physics and CS folks with basically zero philosophy background, and they wanna spend one session on anthropic reasoning—specifically teh distinction between self-sampling and self-indication assumptions, plus why teh presumptuous philosopher is supposed to be a problem for one side. I need a teaching plan rather than teh lecture itself: first, what conceptual piece has to be solid before teh question even feels like a genuine philosophical puzzle to them instead of just a weird stats parlor trick; second, teh single carrying example or thought experiment that should anchor teh whole distinction, with explicit notes on what it needs to include and what it must lack so it doesn't collapse into regular Bayesian updating; third, teh misconceptions they'll almost certainly drag in from their technical training—especially treating self-indication as just another form of evidence updating—and teh precise point in teh explanatory arc where each should be headed off; fourth, a concrete check for understanding that would show they've actually grasped teh structural difference between SSA and SIA rather than just memorizing teh labels; and finally what formal machinery or related anthropic puzzles I should explicitly leave on teh cutting-room floor for this level. They are sharp but will default to treating it like a math problem unless I frame it right, so flag how to keep teh philosophical stakes visible without drowning them in probability formalism.
reasoning: |-
  Okay, the user is preparing a teaching plan for a grad reading group on anthropic reasoning, specifically focusing on the distinction between Self-Sampling Assumption (SSA) and Self-Indication Assumption (SIA), and why the Presumptuous Philosopher is problematic. The audience consists of physics and CS grad students with minimal philosophy background. 

  First, I need to identify the core conceptual hurdle. These students will likely approach this as a statistics puzzle rather than a philosophical dilemma. The key is making them feel the "anthropic tension" - that their own existence isn't neutral data but actively constrains what worlds could exist. The "Why am I me?" question is crucial here - not as metaphysical fluff but as the lever that pries open the difference between passive observation (SSA) and existence-as-information (SIA).

  For the anchoring thought experiment, the Incubator Paradox works well because its minimalism prevents contamination from real-world priors. Must emphasize: 1) observers are identical except for color (no identity leakage) 2) no causal link between theory and observer creation (blocks Bayesian shortcuts) 3) probability must center on population size, not individual identity. The "green room" variant helps - when you wake up seeing green, SSA says probably small world (fewer greens to be), SIA says probably big world (more greens existing overall).

  Biggest landmine will be their instinct to reduce SIA to Bayesian updating. Need to explicitly block this when introducing SIA by stressing that your existence isn't evidence confirming a theory - it's a precondition for having any evidence at all. The Presumptuous Philosopher case makes this visceral: SIA would accept a theory predicting vast populations based solely on your existence, which feels wrong precisely because it exposes how SIA violates conservation of evidentiary value.

  For the check of understanding, I'd give them Sleeping Beauty with a twist: instead of amnesia, she knows her birth date. If they realize SSA/SIA distinction vanishes when personal identity is trackable, that shows they get it's about reference classes, not math.

  Formal machinery to avoid: Full non-indexical conditioning, infinite universes, quantum immortality. Keep the paradoxes contained to finite, symmetric populations. Philosophical stakes stay visible by constantly linking back to the "cost" of theories - SSA makes big universe theories harder to confirm, SIA makes them cheaper, and both feel unintuitive for mirror-image reasons.

  The teaching arc should feel like peeling an onion: first make existence feel puzzling (pre-puzzle), then force a choice between two repugnant conclusions (Incubator), then show how each "solution" breaks in opposite ways (Presumptuous/Doomsday), finally revealing this as a fundamental schism in how we price theories that predict observers.
answer: |-
  Here’s a battle-tested teaching plan tailored for physics/CS grads. Focus on **conceptual tension over formalism**, **one core paradox**, and **preempting technical misreadings**:

  ---

  ### **1. Foundational Conceptual Piece: The "Anthropic Stakes"**
     - **Goal**: Make them feel why "I exist" isn't neutral data.  
     - **Key Move**: Contrast two questions:  
       - *Ordinary inference*: "Given theory T, what should I observe?"  
       - *Anthropic inference*: "Given that I exist *to observe anything*, what does that imply about T?"  
     - **Anchor Example**: **The Universe Lottery**  
       - *Setup*: "Suppose there are two possible universes: one with 1 trillion observers (Big), one with 1 billion (Small). You exist. Does your existence support Big over Small?"  
       - **Tension Point**: Physics/CS instinct: "More observers in Big → I'm *less likely* to be 'me' in Big → existence *disfavors* Big." Philosophy puzzle: "But if Big is real, *more total observers exist* → my existence is *more expected* under Big!"  
     - **Why it Lands**: Forces them to see "I exist" as a filter on possible worlds, not just data.

  ---

  ### **2. Anchor Thought Experiment: The Incubator Paradox**
     - **Setup**:  
       > *A lab runs an experiment:  
       > - With 50% probability, create 1 room with 1 green observer.  
       > - With 50% probability, create 100 rooms: 99 with red observers, 1 with green.  
       > You wake up in a room. The walls are green.  
       > Question: What is the probability the "100-room" scenario happened?*  
     
     - **Why it Works**:  
       - **SSA** (Self-Sampling): "I'm a random *observer*. Most observers are red → but I'm green → probably the 1-room scenario!"  
         → *P(100-room | green) ≈ 1%*  
       - **SIA** (Self-Indicating): "My existence *as green* is more likely if there are more green rooms → favors 100-room!"  
         → *P(100-room | green) ≈ 99%*  
     
     - **Critical Constraints** (to avoid collapse into Bayes):  
       - No "external" evidence (only wall color).  
       - Observers are identical except color (no distinguishing features).  
       - No causal link between theory and *which* room you're in (blocks conventional updating).  
     - **Visual Hook**: Sketch the two scenarios. Ask: "Does seeing green make you feel lucky (SSA) or unsurprised (SIA)?"

  ---

  ### **3. Predicted Misconceptions & Preemptive Strikes**
     - **Misconception #1**: "SIA is just Bayesian updating with an existence prior."  
       - **When to Strike**: When introducing SIA.  
       - **Preemption**: "In Bayes, evidence *confirms* hypotheses that predicted it. In SIA, your existence *isn't evidence*—it's a *condition for having evidence at all*. SIA weights theories by how many observers they *allow*, not how well they *predict you*."  
       
     - **Misconception #2**: "This is just about probability normalization."  
       - **When to Strike**: During Incubator debrief.  
       - **Preemption**: "SSA normalizes over *observers*, SIA over *possible worlds*. This isn't math—it's a conflict between *whose perspective matters*."  
       
     - **Misconception #3**: "Observer-moments fix everything."  
       - **Strike Early**: Declare upfront: "We're ignoring time/memory loss (no Sleeping Beauty!). Focus on observer *identity*."  

  ---

  ### **4. Check for Understanding: The "Color-Blind God" Test**
     - **Prompt**:  
       > *"God flips a coin. Heads: Creates 1 blue observer. Tails: Creates 1,000 red observers.  
       > You exist. You learn God is color-blind—your color tells you nothing about the coin.  
       > According to SSA and SIA, does your existence support heads or tails?"*  
     
     - **Correct Insight**:  
       - **SSA**: "I'm probably red → favors tails (more observers)."  
       - **SIA**: "My existence is equally likely under heads/tails → no update."  
     - **Why it Works**: Removes "color evidence" but keeps anthropic core. If they conflate SSA/SIA, they'll give the same answer for both.

  ---

  ### **5. What to Exclude (Cutting-Room Floor)**
     - **Formal Machinery**: No measure theory, no infinite universes, no indexical conditioning.  
     - **Related Puzzles**: Avoid Doomsday Argument (too emotional), Quantum Immortality (distracting).  
     - **Advanced Moves**: No "full non-indexical conditioning" (Bostrom), no SIA=SSA+ (Weisberg).  

  ---

  ### **Framing to Keep Philosophy Visible**
     - **Hook**: "This is about *what counts as a falsifiable theory* in a universe where observers are part of the system."  
     - **Stakes**: "SSA makes it hard to confirm theories predicting many observers (e.g., multiverse). SIA makes it too easy—enter the Presumptuous Philosopher!"  
     - **Presumptuous Philosopher Punchline**:  
       > *"SIA says a theory predicting 10²⁰ observers is 10¹⁰ times *more likely* than one predicting 10¹⁰, *just because you exist*. But that feels like cheating—no experiment needed!"*  
       → **Philosophical cost**: SIA rewards theories for "presuming" observers without evidence.  

  ---

  **Teaching Sequence Flow**:  
  1. Universe Lottery (10 min) → Elicit intuition clash.  
  2. Incubator Paradox (20 min) → Derive SSA/SIA answers.  
  3. Presumptuous Philosopher (10 min) → Why SIA feels "wrong".  
  4. Color-Blind God (10 min) → Check understanding.  
  5. Q&A: "Which assumption makes science harder?" (Philosophical reflection).  

  **Key Mantra**: "Anthropic reasoning isn't about *what you see*—it's about *that you are here to see it*." This forces physics/CS minds to engage the meta-problem.
