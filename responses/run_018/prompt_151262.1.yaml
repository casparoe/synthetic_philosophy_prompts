  I'm taking this course on Madhyamaka philosophy and I'm stuck on a passage I found in an old rendering of Nāgārjuna's root verses — the text is definetly older than a century, so the language is clunky. It goes something like this: the author denies that anything has its own nature in any of the four corners, not existing, not non-existing, not both together, not neither one; he says clinging to even one corner is like trying to bottle smoke. Then he adds that emptiness itself is taught only to cure the sickness of clinging, not as some final metaphysical view you can hold onto.

  I'm confused about two things. First, if emptiness is also empty, doesn't that push us into the fourth corner — neither being nor non-being — but in a weird self-undermining way? Or is the idea that the fourfold denial applies recursively, so that even emptiness is empty gets emptied out too? I was arguing with my roommate about this and he said it's basically just nihilism with extra steps, but I feel like there's a subtle distinction about conventional versus ultimate existance that I'm missing and can't quite pin down.

  Second, I came across this weird phrase free-floating rationales — reasons without reasoners — in some notes I scribbled, and I wonder if the tetralemma can be mapped onto that idea. Like, if there's no reasoner behind a rationale, does that mean the rationale neither exists nor doesn't exist in the fourfold sense? This might be totally off-base and maybe I made the term up after reading something late at night, but could you help me parse the passage and tell me whether extending the catuṣkoṭi to these kind of disembodied reasons is coherent, or just nonsense?
