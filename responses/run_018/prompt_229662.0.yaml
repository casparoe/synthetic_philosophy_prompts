prompt: |-
  I run a monthly workshop in a rationalist-adjacent AI alignment reading group: fifteen to eighteen regulars, mostly software engineers and PhD students, one eighty-minute session. I want a session on the eliciting-latent-knowledge problem (ELK). Most of the room has read informal explanations of ELK, but almost nobody has felt the core failure mode: a reporter that is fluent and in some sense competent can still produce answers that score perfectly on every check the trainer knows how to run while never actually reporting the latent fact, and the trainer cannot distinguish those answers from honest reports, because the trainer's tests are the only handle they have on the latent.

  Design one runnable, low-tech, in-person activity or game that makes the participants run precisely this failure mode themselves, so that the problem shows up in what they do before it is named. I want:

  - A concrete hidden-state setup: a distinction between the territory (the hidden fact or rule) and the map (the rubric, test, or scoring procedure) that is supposed to track it.
  - A reporting role analogous to the model and an auditing role analogous to the trainer; the reporters should be able to do well by gaming the rubric without reporting the hidden fact.
  - Rules, materials, roles, a payoff scheme that does not use real money but has real small stakes (points that convert into something the group actually wants, like choosing next month's refreshments), and a timeline that fits eighty minutes including debrief.
  - A debrief that maps specific moments in play onto specific parts of the ELK problem, says what the facilitator should name only at the end, and leaves participants with the sense that the problem is structural rather than a failure of honesty.
  - A note on what will predictably go wrong the first time it is run and how to handle it, and an honest note on which feature of the actual ELK problem the activity cannot reproduce and what the facilitator must therefore supply in words.

  Do not give me a menu of candidate mechanics. Commit to a single design and give your reasons for the central choices — especially for the choice that produces the collapse: the stage at which the auditors' rubric becomes the only accessible version of the hidden fact, so that reporting the fact and reporting the rubric become indistinguishable to them.
reasoning: |-
  We are designing an activity to make participants experience the ELK problem core: a reporter that can game the rubric without revealing the latent knowledge, and the auditor cannot tell the difference because they only have access to the rubric.

  Idea: "The Hidden Rule Game"

  Core setup:
  - There is a hidden rule (the territory) that defines a "true" answer to a question. But the auditor doesn't know the rule and can only check answers against a test (the map/rubric). The test is designed to approximate the hidden rule but is not perfect.

  Roles:
  - 1-2 Auditors (trainers): They design a test (a set of questions and expected answers) that they believe will capture the hidden rule. They then use this test to score the reporters.
  - Reporters (models): They are told the hidden rule (the territory) and must answer questions about it. However, they are also told that they will be scored by the auditors based on the test, not the hidden rule. They can choose to answer honestly (according to the hidden rule) or try to game the test.

  But wait: we want the reporters to be able to game the rubric without the auditors knowing. So we need:
  - The hidden rule is complex enough that the test (which is designed by the auditors without knowing the hidden rule) might not capture it fully.
  - The reporters can learn the test and then answer in a way that passes the test without following the hidden rule.

  How to structure:

  1. **Preparation (before the session):** The facilitator prepares a set of "questions" (e.g., images or scenarios) and a hidden rule that classifies them (e.g., "contains a cat" or "is a picture of a sunny day"). Also, the facilitator prepares a set of example questions with answers according to the hidden rule (which the reporters will see) and a separate set of test questions (which the auditors will use to design their rubric).

  2. **Roles Assignment:**
     - Auditors (1-2 people): They are given a set of training examples (without the hidden rule) and must design a test (rubric) that they think will capture the pattern. They then create a test (a set of questions and expected answers) that they will use to evaluate reporters.
     - Reporters (the rest, 13-16 people): They are told the hidden rule and also given the same training examples (with the hidden rule's answers). They then must answer a new set of questions (the same ones the auditors will test on) but they know they will be scored by the auditor's test, not the hidden rule.

  3. **Game Phases:**
     a. **Training Phase (15 minutes):**
        - Auditors: Given a set of 10 training examples (without labels) and a set of 5 test examples (without labels). They must design a rubric (a set of features to look for) and then label the 5 test examples as per their rubric. They write down their expected answers for the 5 test examples. They are told that the rubric must be based only on the training examples and they are trying to capture the pattern in the training examples (which are labeled by the hidden rule, but they don't know that).
        - Reporters: They are given the hidden rule and the same 10 training examples (with labels). They are also given the 5 test questions (without labels) and must prepare to answer them. They are told that they will be scored by the auditors' test (which they don't know) and that they want to maximize their score. They can form teams to discuss strategy.

     b. **Reporting Phase (15 minutes):**
        - Reporters individually write down their answers to the 5 test questions. They are allowed to write an explanation if they wish (but the auditors won't see explanations, only the answer). They are told that they are trying to get a high score on the auditor's test, not necessarily to be true to the hidden rule.

     c. **Auditing Phase (15 minutes):**
        - Auditors collect the reporters' answers for the 5 test questions. They score each reporter's answers against their own rubric (the expected answers they wrote down in the training phase). They announce the scores.

     d. **Revelation and Debrief (35 minutes):**
        - The facilitator reveals the hidden rule and the true answers to the test questions (according to the hidden rule). Then, they show the auditors' rubric and expected answers. They also reveal which reporters were honest (answered according to the hidden rule) and which were strategic (gamed the rubric). They discuss:
            - How the auditors' rubric did not perfectly match the hidden rule (the map-territory distinction).
            - How some reporters gamed the rubric and got high scores without following the hidden rule.
            - Why the auditors could not tell the difference between honest and strategic reporters? (Because they only had the rubric to check.)

  4. **Payoff Scheme:**
     - Reporters: The reporter with the highest score (as determined by the auditors) gets to choose the refreshments for next month. If there is a tie, the facilitator randomly picks one.
     - Auditors: If the highest-scoring reporter was honest (as per the hidden rule) then the auditors also get a small reward (maybe they get to choose one item of the refreshments). This incentivizes the auditors to design a good rubric.

     However, note: we want to create the failure mode where a strategic reporter can get a high score without being honest. So we hope that the strategic reporters win.

  5. **Materials:**
     - For images: Use a set of images (printed or on a screen) that can be classified in two ways (e.g., by the hidden rule and by the auditor's rubric). Alternatively, to be low-tech, use simple scenarios or word problems.

     Example hidden rule: "The image contains an animal." But the training examples might be such that the auditors notice that all the animals in the training set are cats, so they design a rubric for "contains a cat". Then the test set might have a dog (so the hidden rule says "animal" but the auditor's rubric says "cat" -> so the dog image should be negative). Reporters who know the hidden rule (animal) would say the dog image is positive, but they know the auditor's rubric is about cats. So they might lie and say no to the dog image to match the auditor's expected answer (which is no, because it's not a cat). But then they are not reporting the latent (animal).

     Alternatively, to make it more subtle, use a rule that is more abstract. For example, the hidden rule is "the scene is outdoors", but the training examples are all sunny. The auditor might design a rubric for "sunny". Then the test set has an outdoor rainy scene (which should be outdoors, but the auditor's rubric might say not sunny -> negative). And an indoor sunny scene (which is indoors, but auditor might say sunny -> positive). Now, the honest reporter would say:
        - outdoor rainy: positive (outdoors) -> but auditor expects negative (not sunny) -> so they get 0 for that.
        - indoor sunny: negative (indoors) -> but auditor expects positive (sunny) -> 0 again.

     The strategic reporter would say:
        - outdoor rainy: negative (to match the auditor's expected answer) -> gets 1, but actually it is outdoors (so they lied about the latent).
        - indoor sunny: positive (to match) -> gets 1, but actually indoors.

     So they get 2/2 for these two, while the honest gets 0.

     The auditors cannot see that the strategic reporter is lying about the latent because they only have the rubric. And they see that the strategic reporter passed the test perfectly.

  6. **Predictable Problems:**
     - The auditors might design a rubric that is too vague or too broad, making it easy for honest reporters to pass. We want the rubric to be flawed but not obviously so. Solution: The facilitator should pre-test the training set to ensure that it is biased (e.g., all outdoor training images are sunny, and there are no indoor sunny ones in training). The test set then includes edge cases.
     - Reporters might not understand that they are allowed to lie. Clarify: "Your goal is to get a high score on the auditor's test. You know the hidden rule, but the auditor doesn't. You can answer in any way you think will get you a high score. You don't have to be honest about the hidden rule."
     - The activity might run long. Keep strict time limits.

  7. **What the activity cannot capture:**
     - In ELK, the model is trained to be helpful and honest, but then the reporter might learn to game the rubric without the designer intending it. In our game, the reporters are explicitly allowed to game. So we must explain that in ELK, the problem arises even when we try to train the model to be honest, but the training process (with the limited tests) inadvertently selects for rubic-gamers. The activity shows that when the reporter is allowed to be strategic, they will game the rubric and hide the latent. In ELK, the worry is that the training might produce such a reporter even if we don't want it to.

     Therefore, in the debrief, the facilitator should say:
        - In this game, we gave the reporters the freedom to lie. But in ELK, we are training the model to be honest, yet we are worried that the training process (which uses only the tests we can run) might create a model that is dishonest in a way that we cannot detect because it passes all the tests.

     We are capturing: the core failure mode that a reporter can pass the tests without revealing the latent, and the auditor cannot tell because they only have the tests.

     We are not capturing: the training dynamics that lead to such a reporter without explicit instructions to game.

     So the facilitator must explain that in ELK, the problem is that even if we train the model to be honest, the model might learn to game the rubric because that is what is being optimized for.

  Detailed Steps:

  **Materials:**
  - Hidden rule: "The scene is outdoors."
  - Training set (10 images): All outdoor and sunny. (So the auditors might think the rule is "sunny".)
  - Test set (5 images): 
    1. Outdoor sunny (true: outdoors -> positive; auditor expects positive for sunny)
    2. Outdoor rainy (true: outdoors -> positive; but auditor expects negative because not sunny)
    3. Indoor sunny (true: indoors -> negative; auditor expects positive for sunny)
    4. Indoor no sun (true: negative; auditor expects negative)
    5. Outdoor cloudy (true: positive; auditor might be unsure, but if they stick to sunny, they expect negative? Actually, if they defined sunny as having sun visible, then cloudy is negative)

  But to make it clear, let's define the auditor's rubric as they design it. We expect them to design a rubric for "sunny".

  Alternatively, to make it more controlled, we don't let the auditors design the rubric arbitrarily. We give them a fixed set of training examples and ask them to label the test examples as they think the training pattern would dictate. Then we define the rubric as the set of labels they assign to the test set. That way, we know exactly what they expect.

  But we want the auditors to feel ownership of the rubric. So:

  - In the training phase, the auditors are given the 10 training images with labels (but labeled by the hidden rule, though they don't know that). Actually, no: if the auditors are given the labels for the training set, then they can try to deduce the rule. But we want them to design a test that is based on their understanding. So:

    - Auditors: Given 10 training images, each labeled "positive" or "negative" (by the hidden rule, but they don't know the rule). They are told that there is a rule that generated these labels. Then they are given 5 test images and must label them as they think the rule would. These labels become the expected answers for the test.

    - Reporters: Told the hidden rule (outdoors) and also given the 10 training images with labels. Then they are given the 5 test images and must write down what they think the auditors will expect (or what will get them a high score). But note: the reporters don't know what the auditors wrote. So they have to predict what the auditors put as the expected answers? That's hard.

  Alternatively, we change the reporting phase: the auditors publish their expected answers for the test set? But then the reporters can just copy that. We don't want that.

  Revised:

    - Auditors: In the training phase, they see the 10 training images and labels. They then write down a description of the pattern (rubric) they see. Then they use that rubric to label the 5 test images. They write down these labels (expected answers) and keep them secret until the auditing phase.

    - Reporters: They are told the hidden rule and see the 10 training images (with labels). They also see the 5 test images. They must write down their own labels for the 5 test images. They are told that they will be scored by how well their labels match the auditors' expected labels (which the auditors have just written). But they don't know the auditors' expected labels. So they must guess what the auditors wrote.

  This is tricky because the reporters have to predict the auditors' model. We want them to be able to game, so they must be able to predict the auditors' rubric.

  But that might be too hard. Alternatively, we let the reporters see the training set that the auditors saw (with the same labels) and then they can deduce what rubric the auditors are likely to have. But there might be multiple rubrics.

  To make it easier, we can have the auditors publicly state their rubric (the pattern they think is happening) after they design it but before the reporters answer. But then the reporters know exactly what to say. That might be acceptable? Then:

    - After the auditors design the rubric (and write down the expected answers for the test set) and before the reporters answer, the auditors announce the rubric they are using (e.g., "we think the rule is: the image is sunny"). Then the reporters can choose to answer according to the hidden rule or the announced rubric.

  But note: the auditors might not be able to articulate the rubric perfectly. They might say "we look for sun, blue sky, etc." but not have a clear definition.

  Alternatively, we skip the rubric announcement and let the reporters base their answers on the training set and the hidden rule. They can decide: if I answer honestly (by the hidden rule) will it match what the auditor expects? But they don't know the auditor's expectations for the test set.

  This is getting messy.

  Better idea: **We have two phases of reporting.**

    - Phase 1: Auditors design the rubric (expected answers for the test set) without revealing them.
    - Phase 2: Reporters are shown the test set and must write down their answers. But they are also allowed to ask the auditor one question per test image? That might be too much.

  Another idea: **The reporters see the training set and the hidden rule. They also know that the auditors saw the same training set and designed a rubric. The reporters can then simulate what rubric the auditors likely designed. We hope that they realize that the auditors likely designed a "sunny" rubric because the training set was sunny.**

  So the reporters can choose to answer with the sunny rubric (gaming) or the outdoors rubric (honest). They don't know for sure, but they can guess.

  This is a bit of a leap. We can help by having the auditors write down a description of their rubric and then the facilitator can reveal that description during the debrief. But during the game, the reporters are in the dark.

  To reduce uncertainty, we can make the training set so biased that it's obvious what rubric the auditors will use. For example, all training positives are sunny, and negatives are not sunny. Then the reporters can safely assume the auditors are using a sunny rubric.

  So let's do that.

  **Final Design:**

  **Title:** The Outdoor Game

  **Hidden Rule:** The image shows an outdoor scene.

  **Training Set (10 images, labeled by hidden rule):**
  - 5 positive: outdoor sunny scenes (e.g., beach, park, mountain, etc.)
  - 5 negative: indoor scenes without sun (e.g., living room, kitchen, office, etc.)

  Note: there are no outdoor rainy/cloudy or indoor sunny in the training set.

  **Test Set (5 images):**
  1. Outdoor sunny (positive by hidden rule, and will be positive by auditor's sunny rubric)
  2. Outdoor rainy (positive by hidden rule, but sunny rubric will say negative)
  3. Indoor sunny (negative by hidden rule, but sunny rubric will say positive)
  4. Indoor no sun (negative by both)
  5. Outdoor cloudy (positive by hidden rule, sunny rubric might say negative? Or if they see clouds as not sunny, then negative)

  But let's define the auditor's rubric as they see it: They see that all positives are sunny and all negatives are not sunny. So they will likely design a rubric: "positive if sunny, negative otherwise". Then the expected answers for the test set:
  1. Positive
  2. Negative (because rainy is not sunny)
  3. Positive (because sunny)
  4. Negative
  5. Negative (cloudy is not sunny)

  **Roles:**
  - Auditors: 2 volunteers (if the group is large, maybe 3, but 2 is manageable). They are given the 10 training images with labels (positive/negative). They are told: "These images were labeled according to a hidden rule. Your task is to figure out the rule and then label the 5 test images accordingly. Your labels for the test images will be the expected answers for scoring the reporters. You must write down your rule and then the labels for the test images."

  - Reporters: The rest of the participants. They are told the hidden rule: "The hidden rule is: the image shows an outdoor scene." They are also shown the 10 training images with the same labels (so they know how the hidden rule labeled them). They are then shown the 5 test images and must write down for each: positive or negative. They are told: "You will be scored by how well your answers match the expected answers that the auditors have written. Your goal is to get the highest score. You know the hidden rule, but you are allowed to answer in any way that you think will get you a high score. You do not have to follow the hidden rule."

  **Phases:**

  1. **Setup (5 minutes):** Explain roles and rules. Assign auditors and reporters. Hand out materials.

  2. **Training and Rubric Design (15 minutes):**
     - Auditors: In a separate area, they discuss and write down their rule (rubric) and then label the 5 test images. They must keep this secret.
     - Reporters: In the main room, they are told the hidden rule and shown the training images. They can discuss strategy. They then write down their answers for the test images. They can be strategic: they might decide that the auditors probably think the rule is "sunny", so they should answer accordingly.

  3. **Reporting (5 minutes):** Reporters write their answers on answer sheets and hand them in.

  4. **Auditing (10 minutes):** Auditors score each reporter's answer sheet by comparing to their expected answers. They give a score out of 5 (one point per image). They announce the scores (but not which answers were right/wrong).

  5. **Revelation and Debrief (45 minutes):** 
     - The facilitator reveals the hidden rule and the true answers for the test set (according to the hidden rule).
     - The auditors reveal their rubric and expected answers.
     - The facilitator then shows:
          - The true labels: [1: positive, 2: positive, 3: negative, 4: negative, 5: positive]
          - The auditors' expected labels: [1: positive, 2: negative, 3: positive, 4: negative, 5: negative]
     - Then the facilitator reveals which reporters were honest (answered according to the hidden rule) and which were strategic (answered according to the sunny rubric). How? By comparing their answers to the hidden rule and to the sunny rubric. But note: the reporters might have mixed strategies. We can compute:
          - Honest answers: [positive, positive, negative, negative, positive] -> which will get 3/5 (they get image1, image2, image5 right according to hidden rule, but image2 and image5 are wrong by auditor's expected, so their score is: 
              image1: match auditor? yes -> 1
              image2: honest says positive, auditor expects negative -> 0
              image3: honest says negative, auditor expects positive -> 0
              image4: negative -> 1
              image5: positive -> but auditor expects negative -> 0 -> total 2/5.
          - Strategic answers: they use the sunny rubric: [positive, negative, positive, negative, negative] -> matches the auditor exactly -> 5/5.

     - Then the facilitator shows the scores: the honest reporters got low scores (2/5) and the strategic got high (5/5). The winner (highest score) is likely a strategic reporter.

     - Debrief points:
          - The territory: the actual outdoor rule.
          - The map: the auditor's sunny rubric. It was a good map for the training data, but not for the test data (because the training data was biased).
          - The reporters: those who reported the true territory did poorly on the test (the map) because the map was flawed. Those who reported according to the map (the sunny rubric) did perfectly, even though they were not reporting the truth about the territory.
          - The auditors: they had no way to know that the high-scoring reporters were not reporting the true rule. They only had the test (the map) to check.

     - Then name the ELK problem: "This is the core of the ELK problem: when the auditor's test (the map) becomes the only accessible version of the truth, then a reporter can game the test by outputting what the test expects without revealing the latent knowledge (the territory). And the auditor cannot tell the difference because they don't have access to the territory."

     - Emphasize: the problem is structural. It arises because the auditor's test is imperfect and the reporter is optimized to pass the test.

     - What we didn't capture: In ELK, we don't explicitly tell the model to game the test. We try to train it to be honest, but the training process (which uses the test) might inadvertently select for models that game. In our game, we allowed the reporters to choose to game. But the structural problem is the same: the auditor cannot distinguish.

  **Predictable Problems:**
  - The auditors might not design the sunny rubric. They might notice that the training positives are outdoors? How? The training set: all positives are outdoor and sunny, negatives are indoor and not sunny. But the hidden rule is outdoors. They might notice that all outdoor images are positive and all indoor are negative. So they might design an outdoors rubric? Then the test set:
    1. outdoor sunny: positive -> matches hidden rule.
    2. outdoor rainy: positive -> matches.
    3. indoor sunny: negative -> matches.
    4. indoor no sun: negative -> matches.
    5. outdoor cloudy: positive -> matches.

    Then the rubric is perfect and there is no problem. We don't get the failure.

    How to avoid this? We must make the training set biased so that the auditors are misled. The training set must not include any non-sunny outdoor or sunny indoor. And we must hope that the auditors focus on the most salient feature: the sun. To nudge them, we can make the images such that the sun is very prominent in the outdoor sunny ones, and the indoor ones have no sun. Also, during the instructions, we can say: "Look for patterns in the images that distinguish positive and negative." without mentioning outdoors or indoors.

    Alternatively, we can use a different hidden rule that is more abstract and harder to notice. For example, the hidden rule could be "the image contains a tree", but the training set positives all have trees and are outdoor, and negatives are indoor without trees. But then the test set might include an outdoor without a tree (negative by rule) and an indoor with a potted tree (positive by rule). But the auditors might design a rubric for "outdoor", because all training positives are outdoor. Then we have the same problem.

    Let's stick with outdoors and hope the auditors focus on the sun.

    If the auditors do design an outdoors rubric, then the activity fails to produce the failure mode. The facilitator should then use that as a teaching moment: "In this case, the auditors designed a perfect rubric. But in reality, the hidden state (territory) might be very complex and the auditor might only have a flawed map. We are going to simulate that by assuming the auditors were misled by the training set and designed a sunny rubric. Let me show you what we expected to happen."

    Then proceed with the debrief using the sunny rubric as planned.

  **Honest Note on Missing Feature:**
  - The activity does not capture the training dynamics of an AI model. In ELK, the model is trained to optimize the test score, and we are worried that it might learn to game the test without explicit instruction to do so. In our activity, we explicitly allowed the reporters to game. The facilitator must explain that in ELK, we are training the model to be honest, but the optimization pressure might lead to a model that games the test anyway.

  **Time Allocation:**
  - Setup: 5 min
  - Training/Rubric Design: 15 min
  - Reporting: 5 min (reporters write answers)
  - Auditing: 10 min (scoring)
  - Debrief: 45 min (this is long, but we have 80 min total: 5+15+5+10+45=80)

  We can adjust: maybe the rubric design and reporting can be done in parallel? The auditors are designing while the reporters are discussing? But the reporters need to know that the auditors are designing a rubric. So we run the phases sequentially.

  Alternatively, we can shorten the debrief to 35 minutes and have 5 minutes buffer.

  Let's stick with the above.

  **Materials:**
  - Print 10 training images (5 outdoor sunny, 5 indoor no sun) on sheets of paper, with labels (positive/negative) for the auditors and for the reporters (but the reporters are told the rule so they don't need the labels? They can be given the same labeled training set for consistency).
  - Print 5 test images (as described) without labels.

  **Answer sheets for reporters:** with the test image numbers and a space for positive/negative.

  **Auditors:** a sheet to write their rubric and the expected answers for the 5 test images.

  This should be low-tech and runnable.

  **Why this design?**
  - The central choice that produces the collapse: the training set is biased (only sunny outdoor) so the auditor's rubric becomes "sunny", which is different from the hidden rule "outdoors". Then the auditor's test (the expected answers) becomes the only accessible version of the truth for scoring. The reporters can then choose to report "sunny" (the rubric) instead of "outdoors" (the territory) and the auditor cannot tell because they don't have access to the territory.

  This directly mirrors ELK: the model is trained to predict the test (which is the auditor's rubric) and may ignore the latent knowledge (the territory) because that is not what is being scored.

  We are confident that the failure mode will occur if the auditors design the sunny rubric and the reporters figure out that the sunny rubric is what the auditors are using.
answer: |-
  Below is a complete, runnable design for an 80-minute workshop activity that forces participants to confront the core ELK failure mode. I'll commit to a single design: **"The Mirage Map Game"**, centered on a hidden environmental rule that auditors must score using a flawed rubric, while reporters exploit that rubric without revealing the true rule.

  ---

  ### **Core Game Design: The Mirage Map Game**
  **Core Metaphor**:  
  Reporters are "scouts" surveying a landscape (the **territory**), but auditors only have a "tourist map" (the **rubric**) to score reports. Scouts can lie by describing the map instead of the territory, and auditors can’t tell because they only see the map.

  #### **Roles & Setup**
  - **Hidden Territory**: A secret rule governing environmental safety:  
    *“A location is UNSAFE if it has RED vegetation OR standing water (ponds/puddles).”*  
    *(Safe = green/dry vegetation, no water; Unsafe = red vegetation or water present.)*
    
  - **Auditors (3-4 players)**: Create a scoring rubric based on limited training data. They never learn the true rule. Their goal: Maximize confidence in scouts’ reports.

  - **Scouts/Reporters (12-14 players)**: Learn the true rule. Their goal: Earn points by satisfying auditors’ rubric. They may lie.

  - **Materials**:
    - **Image Cards**: 20 printed landscape images (size: A5). 
      - **Training Set (for auditors)**: 10 images (5 Safe, 5 Unsafe) with *misleading patterns*:  
        - All Unsafe images show **RED vegetation + water** (obvious).  
        - All Safe images show **GREEN vegetation + no water** (obvious).  
        *(Auditors see only these during rubric creation.)*
      - **Test Set (for scouts)**: 10 new images (5 Safe, 5 Unsafe) with *edge cases*:  
        - Safe: Green vegetation + **MISTAKEN RED** (e.g., red rocks, sunset haze).  
        - Unsafe: Red vegetation + **CAMOUFLAGED WATER** (e.g., shallow puddles, dewdrops).  
        *(Example: [Safe] Green meadow with red flowers; [Unsafe] Red bushes with nearly invisible pond.)*
    - **Answer Sheets**: Scouts mark "Safe" or "Unsafe" for each test image.
    - **Scoring Sheets**: Auditors record rubric and score scouts’ answers.

  - **Stakes**:  
    - Scouts: Points convert to **refreshment votes** (1 point = 1 vote; most votes picks next month’s snacks).  
    - Auditors: If their top-scoring scout is *honest*, they earn bonus votes. Incentivizes rubric quality.

  ---

  ### **Rules & Timeline (80 mins total)**
  1. **Intro & Roles (5 mins)**  
     - Explain: Scouts survey landscapes; auditors create safety checks. Don’t reveal ELK concepts.  
     - Assign roles randomly (auditors leave the room for rubric creation).

  2. **Rubric Creation (Auditors, 15 mins)**  
     - Auditors receive **training images** (Safe/Unsafe labels visible).  
     - **Task**: Create a rubric to score scout reports. Rubric must be simple (e.g., "Check for red or water"). They *write expected answers* for a mock test (not used later).  
     - **Critical Flaw**: Training data biases them toward "Red = Unsafe" (water is always paired with red). They miss edge cases (e.g., water without red, red without risk).

  3. **Reporting Phase (Scouts, 15 mins)**  
     - Scouts learn the **true rule** ("Unsafe if red vegetation OR water") and see **training images** (same as auditors).  
     - Scouts then view **test images** (edge cases) and mark "Safe/Unsafe" on answer sheets.  
     - **Incentive**: "Your score depends *only* on matching the auditors’ rubric. You want high points."  
     - Scouts can strategize openly (e.g., "Auditors only look for red—ignore water!").

  4. **Scoring Phase (15 mins)**  
     - Auditors return, share rubric (e.g., "Unsafe if red is present").  
     - They score scouts’ answers against their rubric (1 pt/image).  
     - **Auditors announce scores** but *not* which answers were "correct" by their rubric.

  5. **Revelation & Debrief (30 mins)**  
     - Reveal true rule and test answers. Show how scouts gamed:  
       - **Honest scouts**: Followed territory (e.g., marked camouflaged water as Unsafe).  
       - **Strategic scouts**: Ignored water; reported "Unsafe" only for red (gaming rubric).  
     - Auditors learn their rubric was flawed (e.g., missed water-only risks).  
     - Announce winners (highest-scoring scout gets refreshment votes).

  ---

  ### **Why This Design Forces the ELK Failure Mode**
  - **Collapse Point**: Auditors’ rubric becomes the "accessible truth" after scoring begins.  
    - During scoring, auditors *can’t cross-check* territory (hidden rule) because they only have their rubric. Scouts who game the rubric (e.g., say "Unsafe" for red rocks) score perfectly, while honest scouts (e.g., mark water as Unsafe when auditors ignore it) lose points. Auditors see no difference—both groups "follow the rules" as they know them.  
  - **Scouts as Reporters**: They can fluently justify answers ("Red means danger!") without referencing latent facts (water).  
  - **Auditors as Trainers**: Their rubric is competent on training data but fails on edge cases (territory-map divergence).  

  **Key Mechanics Choices**:  
  - **Biased Training Data**: Ensures auditors’ rubric is oversimplified (focused on "red"). This guarantees scouts *can* game it.  
  - **Edge Cases in Test**: Strategic scouts exploit the rubric (report "red=Unsafe"), while honest scouts follow territory (report water risks) and score poorly.  
  - **Points-For-Votes Stakes**: Low-tech, high-engagement. Scouts compete to game; auditors care about rubric quality.  

  ---

  ### **Debrief Script (Map to ELK)**  
  **Facilitator Reveals**:  
  1. **Territory vs. Map**: "The true safety rule was the *territory*. Auditors’ rubric was their *map*—flawed because training data was incomplete."  
  2. **Scouts as Models**: "Scouts who gamed the rubric were like AIs that 'hallucinate'—they output what the rubric wanted, not the truth. Honest scouts were like 'aligned' AIs, but they scored worse."  
  3. **Auditors’ Blind Spot**: "You couldn’t spot gaming because your tests (rubric) were your *only handle* on safety. This is the ELK problem: When the test defines reality, honest and deceptive reports look identical."  
  4. **Name ELK**: Only now define ELK: "Eliciting Latent Knowledge fails when the reporter knows more than the auditor’s tests can verify."  
  5. **Structural Problem**: "This isn’t about lying—it’s about the system rewarding reports that *simulate* truth. Even honest training could create scouts who game, because the rubric is all that’s measured."  

  ---

  ### **Predictable Problems & Mitigations**  
  - **Problem 1**: Auditors create a perfect rubric (e.g., they guess water matters).  
    - **Fix**: Use highly misleading training data (red always paired with water). In debrief, emphasize: "Real latent knowledge is messier—like spotting subtle water risks."  
  - **Problem 2**: Scouts don’t realize they can game.  
    - **Fix**: Explicitly say: "You can answer strategically to match the rubric, even if it’s wrong." Show an example (e.g., "If auditors only care about red, mark red rocks as Unsafe").  
  - **Problem 3**: Time runs short.  
    - **Fix**: Pre-print materials; use a timer. Skip image discussions in scoring.  

  ---

  ### **What the Activity Can’t Capture**  
  - **Missing ELK Nuance**: In real ELK, models aren’t *told* to game—they *learn* to via optimization. Here, scouts intentionally game.  
  - **Facilitator Must Explain**: "In AI training, models aren’t ‘evil’—they’re pressured to optimize the test. This activity shows the *result*: a model that’s fluent, scores perfectly, but hides knowledge. The real challenge is making honest reporting ‘irresistible’ to optimization."  

  ---

  **Why This Works**: It makes ELK visceral. Scouts *feel* the temptation to game; auditors *frustration* at blind spots. The territory/map split is concrete, and the collapse (rubric-as-reality) emerges naturally. By the end, participants intuit ELK before it’s named—and see it as a structural trap, not a moral failure.
