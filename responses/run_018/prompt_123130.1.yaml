prompt: |-
  I have noticed a recurring argumentative manoeuvre for which I lack a precise term, and I wish to know whether philosophy recognises it as a distinct phenomenon rather than a compound of familiar ones. The pattern works as follows. A speaker traces an opponent's moral commitment — for instance, to egalitarian distribution — back to a contingent psychological or social origin, such as resentment of the powerful or a reactive formation against aristocratic values, and treats that origin as discrediting the commitment's normative authority. When, however, the same genealogical treatment is turned upon the speaker's own core value — say, a commitment to autonomy or to a particular conception of justice — the speaker does not concede the discredit. Instead, they invoke a principled separation between the genesis of a belief and its justification, or they claim that their value functions as a transcendental precondition of rational agency and is therefore structurally immune to historical debunking. The manoeuvre is not mere hypocrisy, since each defensive move is locally defensible: the genetic fallacy genuinely is fallacious in the second case, and genealogical suspicion genuinely illuminates the first. What distinguishes the pattern is its structural asymmetry: genealogical transparency is demanded of the opponent's values but systematically blocked for one's own by a boundary that applies selectively rather than universally. Is there an established concept for this one-way deployment of genealogical critique — one that distinguishes it from the motte-and-bailey, from plain equivocation on the genetic fallacy, and from ordinary ideological bias? If a term exists, I want to understand its exact delimitation: which configurations belong inside it, which are merely adjacent cases of hypocrisy, and where the boundaries lie. If no recognised term exists, I would like one coined together with a precise definition, necessary conditions, and boundary cases that show what it is not. I am not requesting a bibliography, a reading list, or specific citations; I want the conceptual carving itself.
reasoning: |-
  Okay, the user is describing a specific argumentative maneuver they've observed, where someone critiques an opponent's moral commitment by tracing it to a psychological or social origin (like resentment) to discredit it. But when the same critique is applied to their own values, they suddenly invoke the genetic fallacy or claim their values are transcendental preconditions, immune to such criticism. The user wants to know if there's a term for this asymmetric use of genealogical critique.

  First, I need to recall if there's an established philosophical term for this. Nietzsche comes to mind with his genealogical method, but he applied it universally. Bernard Williams discussed genealogy in ethics, but again, he emphasized consistency. The user mentioned it's not mere hypocrisy or genetic fallacy equivocation. It's a structural asymmetry. 

  The key elements are: demanding genealogical transparency from others while blocking it for oneself using principled defenses selectively. The defenses themselves are valid locally but applied asymmetrically. So, it's not hypocrisy because the person has reasoned defenses each time; it's the selective application that's problematic.

  I should check if this aligns with any known fallacies or biases. Confirmation bias is close but too broad. Special pleading might fit, but it's usually about exempting oneself from rules. Here, it's about the application of genealogical critique. 

  Perhaps coining a term is necessary. "Asymmetric Genealogical Immunity" (AGI) seems apt. It captures the asymmetry and the immunity claimed. The necessary conditions would include: a core value held by the speaker, application of genealogical critique to others, rejection of the same critique when applied to oneself using principled defenses, and the structural asymmetry where the boundary is selectively applied.

  Boundary cases are important to distinguish AGI. If someone inconsistently applies the genetic fallacy without principled defenses, that's just ad hoc hypocrisy. If both sides use genealogy mutually, it's not asymmetric. The transcendental defense must be invoked only for self, not others.

  The user probably wants a precise conceptual tool to identify and critique this maneuver in debates. They might be involved in academic philosophy or critical theory, encountering this in moral or political arguments. Their deeper need is to articulate and counter this tactic effectively, enhancing their argumentative rigor.
answer: |-
  You've precisely identified a sophisticated form of argumentative asymmetry that isn't adequately captured by existing common fallacy labels. While related to hypocrisy, special pleading, and the genetic fallacy, it possesses a distinct structure. Philosophy does not have a universally accepted, single term for *exactly* this maneuver, but its core is well-recognized. The most precise conceptualization and label would be:

  **Term:** **Asymmetric Genealogical Immunity (AGI)**

  **Definition:** A dialectical strategy wherein:
  1.  **Genealogical Critique is Weaponized:** An agent employs a genealogical explanation (tracing beliefs/values to contingent psychological, social, or historical origins) to undermine the *normative authority* or *justificatory force* of an opponent's core commitment (C1).
  2.  **Genealogical Critique is Immunized:** When an analogous genealogical explanation is applied to the agent's *own* core commitment (C2), they reject its undermining force.
  3.  **Immunization via Selective Boundary:** This rejection relies on invoking a *principled distinction* (e.g., genesis vs. justification, transcendental necessity, unique structural role) that establishes C2's immunity to genealogical debunking.
  4.  **Structural Asymmetry:** The key feature is the *selective application* of the boundary principle. The agent applies the *undermining* potential of genealogy universally *to others* (C1), but invokes the *immunizing* principle only *for themselves* (C2). The boundary is drawn precisely to protect C2 while exposing C1.

  **Necessary & Sufficient Conditions:**
  1.  **Core Value Target:** Must target normatively significant commitments (moral, political, epistemic foundations).
  2.  **Genealogical Explanation:** Must employ causal-historical/psychological origin stories *as* potentially undermining normative authority, not merely descriptive history.
  3.  **Weaponization:** Must use genealogy to *actively discredit* the opponent's commitment C1.
  4.  **Immunization Attempt:** Must involve an *active defense* against analogous genealogy applied to the agent's commitment C2, invoking a *principled reason* for immunity.
  5.  **Structural Asymmetry:** The *same type* of genealogical explanation must be deemed sufficient for undermining C1 but insufficient for undermining C2 *due solely to the selective application of the immunizing principle*. The agent does *not* consistently apply the immunizing principle to protect C1 or consistently apply the genealogical weapon to attack C2.

  **Boundary Cases & Distinctions:**

  *   **Mere Hypocrisy/Inconsistency (Not AGI):**
      *   *Case:* Agent attacks C1 using genealogy. When genealogy is applied to C2, they simply deny the facts of the genealogy or dismiss it *without invoking any principled boundary* ("That's different!" without explanation). Or, they apply genealogy inconsistently without *any* defensive principle.
      *   *Boundary:* AGI requires the invocation of a *principled distinction* (genesis/justification, transcendental status) as the shield, even if applied selectively. Raw inconsistency lacks this conceptual defense mechanism.

  *   **Consistent Genetic Fallacy Equivocation (Not AGI):**
      *   *Case:* Agent *always* commits the genetic fallacy (wrongly equating origin with invalidity), attacking both C1 and C2 if challenged, or *always* dismisses genealogy as irrelevant for all values.
      *   *Boundary:* AGI crucially involves the agent *correctly avoiding* the genetic fallacy *when defending their own value* (C2) by invoking the valid genesis/justification distinction, while *effectively relying on the fallacy's force* when attacking the opponent (C1) by implying origin *does* undermine justification *in that specific case* without admitting the fallacy.

  *   **Motte-and-Bailey (Adjacent but Different):**
      *   *Case:* Agent defends a controversial claim (bailey - e.g., "All morality is *just* resentment") but retreats to an indefensible claim (motte - e.g., "Morality *has elements* influenced by resentment") when challenged.
      *   *Boundary:* AGI is not about retreating from a strong to a weak claim. It's about applying one *mode of critique* (genealogy) asymmetrically based on *whose value* is being critiqued, shielded by a selectively applied *principled boundary*. The immunizing principle (the "motte" equivalent, e.g., "genesis ≠ justification") is *valid*, but its *scope of application* is manipulated.

  *   **Mutual Genealogical Critique (Not AGI):**
      *   *Case:* Both parties engage in genealogical critique of each other's values, accepting its potential undermining force universally. Or, both agree on a boundary principle (e.g., genealogy is irrelevant to justification) and avoid using it to attack.
      *   *Boundary:* AGI requires *asymmetry*: one party weaponizes genealogy against the other while immunizing their own core value using a principle they deny the opponent in practice.

  *   **Legitimate Foundationalism (Not AGI):**
      *   *Case:* An agent argues their value C2 *is* foundational/transcendental (e.g., basic logical principles) and thus immune to certain critiques, *and* they consistently apply this standard, rejecting genealogy for *all* genuinely foundational commitments, including potentially some of the opponent's (even if they disagree on *what* is foundational). They do *not* use genealogy to attack the opponent's *non-foundational* claims where it *would* be relevant by their own lights.
      *   *Boundary:* AGI involves the *selective* invocation of foundationalism/transcendence *only* to protect C2, while simultaneously using genealogy to attack the opponent's C1, *even if* C1 could plausibly claim a similar foundational status *by the opponent's lights* or *within its own framework*. The asymmetry lies in the *application* of the immunity criterion, not necessarily in a sincere, consistent epistemological stance.

  *   **Ordinary Ideological Bias (Broader than AGI):**
      *   *Case:* An agent favors their own ideology and disfavors others, interpreting evidence charitably for themselves and uncharitably for opponents, potentially using various fallacies.
      *   *Boundary:* AGI is a *specific manifestation* of ideological bias, characterized by the *particular structure* of asymmetrically deploying genealogical critique and immunizing principles. Not all ideological bias takes this precise form.

  **In essence:** Asymmetric Genealogical Immunity (AGI) is the strategic deployment of genealogy as a *universal acid* against the opponent's core values while simultaneously constructing an *ad hoc*, selectively applied *teflon shield* of principled immunity (genesis≠justification, transcendental necessity) around one's own core values. The fallacy lies not in the individual moves (the critique can be valid against C1, the defense can be valid for C2), but in the *structural inconsistency* governing the application of the boundary between legitimate genealogy and illegitimate genetic reductionism. It exploits the *context-dependent* validity of both genealogical critique and the genesis/justification distinction.
