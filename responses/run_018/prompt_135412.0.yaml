answer: |-
  Your observation about the structural parallel between the Frege-Geach problem and LLM behavior is astute. The intractability stems from a **substantive disagreement masquerading as a technical semantic debate**, rooted in fundamentally different conceptions of the nature of moral judgment and language's function. Here's a disciplined diagnosis:

  ### Core Disagreement: What Moral Language *Is* and *Does*
  1.  **Descriptivist Commitment (Shared Premise):** Both sides agree that moral language *must* exhibit standard compositional semantics and preserve logical validity in embedded contexts (e.g., modus ponens with moral conditionals). This isn't contested.
  2.  **Expressivist Core Claim:** Moral judgments (e.g., "Lying is wrong") fundamentally express non-cognitive, conative attitudes (e.g., disapproval) rather than reporting mind-independent facts. Their meaning *is* their expressive function.
  3.  **Descriptivist Core Claim:** Moral sentences express propositions with truth-conditions (even if mind-dependent, relative, or response-dependent). Their meaning is representational.

  ### The Impasse: Embedding & Compositionality
  *   **Expressivist Challenge (Geach's Point):** When "Lying is wrong" is embedded unasserted ("If lying is wrong, then..."), it no longer *performs* its expressive function (disapproval). How can its meaning remain constant (as compositionality requires) if its core function (expression) is absent? How does the *attitude* expressed in the antecedent logically relate to the attitude in the consequent to validate the inference?
  *   **Expressivist Strategy (Quasi-Realism - Blackburn, Gibbard):** Develop sophisticated semantic machinery (e.g., systems of norms, planning states, or higher-order attitudes) to *mimic* the logical behavior of descriptive propositions *without* conceding they *are* descriptive propositions. The meaning is explained in terms of the *acceptance conditions* for attitudes/plans under the relevant norms.
      *   **Settled:** Quasi-realism *can* formally reconstruct logical validity for embedded contexts using non-representational resources. The technical "solution" exists.
      *   **Contested:** Does this formal mimicry *genuinely capture* the nature of moral thought, or is it an *ad hoc* construction? Critics (e.g., Dreier, Unwin) argue it either smuggles in descriptivism (the "sly realist" charge) or fails to explain why the inference *feels* truth-conditional and cognitive. The disagreement shifts to whether quasi-realism achieves *explanatory adequacy* or merely *formal adequacy*.
  *   **Hybrid Expressivist Strategy (Ridge, Schroeder):** Posits that moral sentences have *both* descriptive and expressive content. The descriptive content handles embedding and logic.
      *   **Settled:** Hybrid theories avoid the technical embedding problem *by design* by granting descriptive content.
      *   **Contested:** Does this compromise the core expressivist insight? Critics argue it reduces expression to a pragmatic add-on, losing the distinctive *anti-representationalism* of pure expressivism. Expressivists worry it concedes too much to descriptivism.

  ### Why Intractable?
  The debate is **substantive but masked by shared semantic vocabulary**. Both sides use "meaning," "content," and "validity," but mean profoundly different things:
  *   **Descriptivists** see meaning as fundamentally *representational/referential content*.
  *   **(Pure) Expressivists** see meaning as fundamentally *expressive function/commitment*.
  *   **Quasi-Realists** attempt to define a notion of "content" *built entirely* from expressive commitments/norms.
  *   **Hybridists** bifurcate meaning into descriptive and expressive components.

  **The genuine contest is ontological and psychological:** What *is* a moral judgment fundamentally? Is it *essentially* a state of conative commitment (expressivism), or is it *essentially* a cognitive state aiming at representation (descriptivism)? The embedding problem is the sharpest *symptom* of this deeper divide. Quasi-realism's formal success doesn't resolve whether it accurately describes moral psychology; hybridism's solution comes at the cost of diluting expressivism's core anti-representational thesis.

  ### What Would Count as Progress?
  Meaningful progress likely requires breakthroughs beyond pure semantics:
  1.  **Empirical Findings on Moral Cognition & Embedding:** Cognitive science/neuroscience revealing how humans *actually process* embedded moral claims would be crucial. Do brains treat "If lying is wrong..." like "If the cat is on the mat..." at some level, or is the processing fundamentally different? Evidence supporting distinct processing for embedded moral clauses would bolster expressivism/quasi-realism; evidence for seamless integration would bolster descriptivism/hybridism.
  2.  **Conceptual Distinction Reframing the Problem:** A new framework dissolving the assumed dichotomy between "expressive function" and "logically composable content" could be transformative. This might involve:
      *   A deeper theory of attitudes showing how complex attitudes *intrinsically* combine logically (beyond current quasi-realist models).
      *   A reconceptualization of "assertion" and "content" that doesn't force a choice between representation and expression as the sole basis for compositionality.
  3.  **Formal Result (Limited Impact):** While new semantic machinery might offer alternative quasi-realist models, it's unlikely to resolve the core philosophical disagreement about the nature of moral judgment. The success of existing quasi-realism shows formal results alone don't settle the substantive issue.

  ### LLMs: Illumination or Red Herring?
  LLM behavior **illuminates the *structure* of the problem but doesn't resolve the *substance**:**
  1.  **Illumination:** LLMs demonstrate the *practical possibility* of compositional transparency for moral sentences *without* requiring the model to possess genuine conative attitudes. They process "If lying is wrong..." using the same syntactic/semantic machinery as factual conditionals, generating outputs that *simulate* logical validity. This mirrors the *formal adequacy* achieved by quasi-realism: the *appearance* of stable descriptive content and logical relations emerges from complex pattern-matching on normative discourse, not from grounding in real-world properties *or* genuine human-like attitudes. It starkly shows the challenge for pure expressivism: how can *mere* attitude expression (which LLMs lack) ground this complex, seemingly descriptive/logical behavior?
  2.  **Red Herring Risk:** The illumination is partial because LLMs lack genuine moral cognition. Their "attitudinal incoherence" stems from statistical prediction, not conflicting commitments. Their transparency is *descriptivist-by-default* because their training objective (predicting token sequences) inherently treats all language *as if* it were descriptive. This doesn't prove descriptivism is *correct* for humans; it only shows that a system trained solely on surface patterns of language *must* operate this way. It replicates the *ambiguity* at scale – the outputs *look like* they involve stable content, but we can't infer from the LLM's behavior whether human cognition works similarly underneath.

  **Conclusion:** The Frege-Geach impasse persists because it's a proxy for a profound disagreement about the metaphysics and psychology of moral judgment. LLMs vividly illustrate the *formal* challenge for expressivism and the ease of achieving compositional transparency with descriptivist-like processing, but they cannot adjudicate the underlying philosophical question about the nature of human moral reasoning. Progress hinges on empirical insights into human cognition or a transformative conceptual reframing, not just semantic ingenuity. Your governance project rightly identifies the ambiguity; auditing LLMs requires recognizing they operate within a simulated descriptivist framework, regardless of human moral psychology.
