prompt: |-
  Hey, can you draft an adversarial-collaboration doc for my reading group? We got two people who've been arguing past eachother for like a year about housing, zoning, and who actually has a right to the city. One is a hardline supply-sider YIMBY who thinks if we just upzone everywhere and build luxury apartments the filtering effect will eventually make everythign affordable. The other is a community-land-trust type who thinks long-time residents should have veto power over any project that changes the charactor of there block, and that new supply always just raises nearby land values without helping existing renters.

  We want the joint statement they'd both sign. Specifically:

  - A numbered agreed-claims section: stuff both accept about zoning history, rent dynamics, displacement metrics, and the fact that filtering takes time but does happen in some markets. Don't include anything either side would reject.
  - A disagreements table with the exact wording of each position phrased so each side recognizes it as theirs. I want the cruxes pinned down precisely -- I think one crux is whether filtering actually operates within the same sub-market or only leaks upward, and another is whether community charactor is a real collective good or just a proxy for exclusion. For each crux, include a concrete case or study both would agree is relevant, plus what each side predicts the outcome or data would show.
  - Call out any purely verbal disputes -- like if they both actually want less displacement but use different words for it, say so and identify the word-game part.
  - Keep it casual, like a working doc, not a journal article. No bibliography needed since I'm just asking you to reason from common knowledge.

  Oh, and if you need to invent a term for something that doesn't have a name yet -- like maybe there's no good label for the filtering-versus-induced-demand deadlock -- feel free to coin one and define it, but don't just make up fake studies. And please don't end with a cop-out like "it depends on values"; I want the disagreement made exact.
