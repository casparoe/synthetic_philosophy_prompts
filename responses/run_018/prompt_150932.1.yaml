  The request is quite specific: I need to create a joint statement with agreed claims, a disagreements table with precise wording, identification of verbal disputes, and a casual working-doc style. The user wants exact cruxes pinned down without vague "it depends" conclusions. 

  Hmm... this requires careful balancing. For the agreed claims section, I should focus on undisputed fundamentals: filtering does occur but takes decades; displacement metrics are messy; zoning has exclusionary roots; land values rise with development. These are well-established enough that both sides would accept them. 

  For the disagreements table, the key is accurately representing each position's phrasing. The YIMBY would emphasize filtering within sub-markets (like Minneapolis showing rent stabilization after upzoning), while the CLT advocate would counter with examples like Mission District gentrification where new units accelerated displacement. The "character vs exclusion" debate needs concrete cases too - maybe Austin's neighborhood preservation versus Seattle's transit-oriented development. 

  I notice potential verbal disputes around "affordability" (market-rate vs permanently subsidized) and "community" (inclusionary vs exclusionary). Should explicitly call these out to prevent talking past each other. 

  The "filtering paradox" term might be useful for that deadlock between supply effects. Not perfect but works for a working doc. 

  User seems frustrated by year-long circular arguments - they want structure to force precision. The tone should stay collaborative though, framing disagreements as testable hypotheses rather than ideological clashes. No bibliography needed per request, but all examples should be real-world recognizable (Minneapolis 2040, Dudley Street, etc). 

  Most importantly: no cop-outs. Each disagreement must end with specific predictions. For example: "If filtering works locally, we should see X rent change in Y neighborhood after Z units built" - that makes it falsifiable. 

  ...Double-checking that I'm not inventing studies while still providing concrete cases. Mission District effects are debated but real example; Minneapolis data is preliminary but cited by both sides. Should emphasize "both would agree this case is relevant" even if they interpret differently. 

  Final structure: start with context, then bullet-point agreements, then clear table format for disagreements, then verbal disputes as a separate section. Keep sentences short and jargon-light. "Luxury apartments" in quotes since it's contentious terminology. 

  User's clearly put thought into this - they've identified the core paradoxes themselves. My job is just to scaffold the conversation better.
answer: |-
  Here’s a draft adversarial-collaboration doc designed to clarify disagreements and align on common ground. Tone is direct, casual, and focused on precision:

  ---

  ### **Adversarial Collaboration: Housing Supply, Community Control & Urban Rights**  
  *Working Document for [Reading Group Name] – Draft v0.1*

  **Context:**  
  This doc aims to map agreements and pinpoint *exact* disagreements between two positions:  
  - **Position A (Supply-Side/YIMBY):** Market-rate housing construction (even "luxury") is necessary/sufficient for broad affordability via filtering, and zoning liberalization is urgent.  
  - **Position B (Community Control/CLT):** Local residents should control development to prevent displacement, and market-rate supply often accelerates gentrification without aiding current renters.  

  ---  
  ### **1. AGREED CLAIMS**  
  *(Both parties endorse these statements without reservation)*  
  1. **Zoning History:** U.S. zoning laws have roots in exclusionary practices (e.g., racial segregation, class barriers) and artificially restrict housing supply.  
  2. **Filtering Exists but is Slow:** When housing depreciates or demand shifts, older units *can* become affordable to lower-income groups ("filtering"), but this process typically takes 20-50 years and varies by market.  
  3. **Displacement Metrics are Messy:** No consensus metric exists for displacement. Studies conflict due to differing definitions (e.g., "direct displacement" vs. "exclusionary displacement").  
  4. **New Supply & Land Values:** New market-rate development *usually* increases nearby land values in the short term (1-5 years), but long-term effects depend on regional context.  
  5. **Affordability Crisis:** Current housing costs are untenable for low/moderate-income residents in high-demand cities, requiring policy intervention.  
  6. **"Luxury" is a Marketing Term:** "Luxury" apartments are often standard units with marginal upgrades; cost differences are driven primarily by land, regulation, and construction expenses.  

  ---  
  ### **2. DISAGREEMENTS TABLE**  
  *(Each row states the *exact* wording each side uses for their position, plus a testable crux)*  

  | **Crux Issue**                  | **Position A (Supply-Side)** | **Position B (Community Control)** | **Shared Relevant Case** | **Prediction if A is Right** | **Prediction if B is Right** |
  |-------------------------------|------------------------------|-----------------------------------|--------------------------|------------------------------|------------------------------|
  | **1. Filtering Scope**        | "New market-rate supply filters down *within the same sub-market* within 10–15 years, increasing affordability for non-subsidized units." | "Filtering rarely benefits the original community; new units cater to new high-income residents, pushing up area rents and *displacing* existing renters." | **Minneapolis (post-2018 upzoning)** | Rent growth slows citywide, especially in older units near new construction. | Rent growth accelerates near new developments, displacing low-income residents. |
  | **2. Community Character**    | "'Community character' is often a proxy for exclusion; preserving it blocks housing, increasing displacement regionally." | "Community character is a collective good; residents have a right to reject projects that erase cultural history or social fabric." | **San Francisco’s Mission District vs. Austin’s CodeNEXT** | Areas allowing dense development see stabilized rents *and* retain diversity. | Areas allowing dense development lose cultural anchors (e.g., minority-owned shops) despite new housing. |
  | **3. Veto Power Legitimacy**  | "Local veto power entrenches inequality by favoring incumbent homeowners and blocking regionally beneficial housing." | "Residents facing displacement should have veto power over projects that risk their community’s stability." | **California’s SB 827/9 (failed state preemption of local zoning)** | Cities retaining local control (e.g., Beverly Hills) see higher displacement than those under state mandates. | State mandates (e.g., Oregon’s HB 2001) cause rapid destabilization in vulnerable neighborhoods. |
  | **4. Primary Solution**       | "Abundant market-rate supply + streamlined approvals is the *necessary foundation* for affordability; subsidies alone can’t scale." | "Non-market solutions (CLTs, social housing, rent control) are *essential* to prevent displacement; market supply only helps high earners." | **Vienna (social housing) vs. Seattle (market-led growth)** | Seattle’s market-led approach achieves wider affordability faster than Vienna’s. | Vienna’s model preserves equity better during economic shocks. |

  ---  
  ### **3. PURELY VERBAL DISPUTES**  
  *(Disagreements that boil down to terminology, not substance)*  
  - **"Affordability":**  
    - A uses it to mean *"reducing market-rate rents/prices regionally."*  
    - B uses it to mean *"preventing displacement of existing residents via non-market mechanisms."*  
    - **Shared Goal:** Both want lower housing costs for vulnerable groups.  
  - **"Community":**  
    - A sees it as *"fluid; newcomers deserve equal rights to shape the city."*  
    - B sees it as *"rooted; historical residents have earned stewardship."*  
    - **Shared Value:** Both believe communities should have agency.  
  - **"Supply":**  
    - A means *"any net-new units, including market-rate."*  
    - B means *"only non-speculative, permanently affordable units."*  

  ---  
  ### **4. THE FILTERING PARADOX**  
  *(Coined term for the core deadlock)*  
  **Filtering Paradox:** *The tension between supply-side filtering (which requires time/scale) and demand-side inflation (where new supply attracts higher-income residents, raising rents faster than filtering lowers them).*  
  - **A’s View:** The paradox resolves at scale – build enough, and filtering outpaces demand.  
  - **B’s View:** The paradox is insurmountable without non-market interventions to decouple supply from speculation.  

  ---  
  **NEXT STEPS:**  
  1. Test predictions (e.g., track Minneapolis rent data in upzoned vs. non-upzoned tracts).  
  2. Define shared displacement metrics for future debates.  
  3. Identify policy hybrids (e.g., upzoning + CLT land acquisition).  

  **No values cop-out — just testable claims.**  

  ---  
  *Doc ends. No bibliography per brief, but all examples refer to real-world cases (Minneapolis, Mission District, Vienna, etc.).*  

  ### Why this works:  
  - **Agreed Claims:** Forces alignment on baseline facts (e.g., filtering exists but is slow).  
  - **Cruxes as Predictions:** Turns ideology into testable hypotheses (e.g., "What happens in Minneapolis?").  
  - **Verbal Disputes:** Flags where semantic alignment could resolve fake disagreements.  
  - **No Fake Studies:** Uses well-known housing debates as reference points.  
  - **The "Filtering Paradox"** gives a name to the core tension without taking sides.  

  Ready for edits/negotiations!
