answer: |-
  This tension you're describing is indeed a fascinating and recurrent pattern in the philosophy of mathematical practice, particularly with the rise of formal verification. While there isn't a single universally established term for this *specific* hybrid position, it embodies a distinct and increasingly influential viewpoint. Let's break it down, propose a name, and sharply distinguish it:

  1.  **The Core Tension & Its Source:**
      *   **Discovery Claim (Machine as Window):** The computer's lack of human bias, its strict adherence to formal rules, and its ability to verify results far beyond human capacity are seen as evidence that it accesses a "mind-independent" mathematical reality. The result was "always true"; the computer just confirms it objectively.
      *   **Construction Claim (Machine as Artisan):** The necessity of explicit encoding – choosing foundational systems (ZFC vs. HoTT), defining primitive concepts, implementing libraries with specific dependencies, and representing abstract objects in concrete syntax – highlights the *activity* of building a precise, contingent artifact. The verified object is inseparable from its formal representation.
      *   **The Slide:** Proponents leverage the *same feature* (machine independence/lack of psychology) to support *both* claims. Its objectivity suggests discovery; its requirement for explicit formalization forces construction. The ontological weight shifts to the *process and possibility* of mechanized verification itself.

  2.  **Proposed Name: Algorithmic Realism**
      *   **Why "Algorithmic"?** It centers the computational process – the algorithm of deduction and verification within a formal system – as the primary locus of mathematical reality and access to it. The "truth" or "existence" of a mathematical object is constitutively tied to its susceptibility to being represented and manipulated algorithmically within a verifiable system.
      *   **Why "Realism"?** It maintains a commitment to an objective mathematical reality that is discovered *through* the algorithmic lens. The computer isn't creating arbitrary fiction; it's interacting with robust, rule-governed structures whose properties are fixed independently of any particular human run of the algorithm. The "reality" lies in the consistent, predictable behavior of the formal system during execution.
      *   **The Hybrid:** Algorithmic Realism asserts that mathematical reality *is* the reality of formal systems amenable to algorithmic verification. Discovery happens *within* the constructive framework. We "discover" the necessary consequences of our formal constructions, but those constructions themselves tap into a realm of stable, rule-based possibilities that exist independently of human whim.

  3.  **Distinguishing Features & Boundaries:**
      *   **vs. Traditional Mathematical Platonism:**
          *   **Platonism:** Mathematical objects exist abstractly, non-spatiotemporally, and independently of *all* minds (human or artificial) and formal systems. Proofs (formal or informal) *describe* these pre-existing truths.
          *   **Algorithmic Realism:** Mathematical "reality" is not independent of formal systems; it *is* the reality *of* formal systems capable of algorithmic verification. Objects exist *as* types/propositions within a verifiable calculus. Discovery is contingent upon finding a suitable formal encoding within such a system. The computer's role isn't passive description but active engagement *with* this formal reality.
      *   **vs. Formalism (Hilbertian Game-Playing):**
          *   **Formalism:** Mathematics is the manipulation of uninterpreted symbols according to fixed rules. Meaning and ontology are secondary or irrelevant; consistency is the primary concern.
          *   **Algorithmic Realism:** While heavily reliant on formal symbol manipulation, it *does* attribute ontological weight to the *results* of this manipulation *because* of the algorithmic verification process. The verified theorem isn't *just* a symbol string; it's a revealed constraint or property within the formal universe constituted by the system. The verification process *confers* a kind of robust existence. Meaning arises through the computational interaction within the system.
      *   **vs. "Formal Proofs as Longer Informal Proofs":**
          *   **This View:** Sees formal verification as merely a meticulous, error-checked version of human mathematical reasoning. Ontology remains unchanged (usually platonist).
          *   **Algorithmic Realism:** Sees formal verification as a fundamentally *different kind of access* to mathematical truth, involving explicit construction and the creation of a new ontological layer (the verified code/formal term). The computer isn't just a faster clerk; it's an active participant in defining the realm of the mathematically real through its operational constraints.
      *   **vs. Strict Nominalism (All Objects Artifacts of Notation):**
          *   **Nominalism:** Denies the existence of abstract objects. Mathematical statements are ultimately about concrete marks (symbols) or linguistic conventions.
          *   **Algorithmic Realism:** While emphasizing the constructed nature of specific encodings, it attributes a robust, objective reality to the *structures revealed* by the algorithmic process *within* the formal system. The reality isn't *just* the symbol tokens; it's the invariant properties and relationships that the algorithm consistently verifies across different implementations (within the same foundational framework). The "artifact" reveals a stable pattern.

  4.  **Key Differentiator: The Ontological Weight of Machine-Checkability**
      This is the crux. Algorithmic Realism doesn't just see machine-checkability as a *reliable method* for confirming pre-existing truths (like a platonist) or as *merely constructing symbols* (like a strict formalist or nominalist). Instead:
      *   Machine-checkability *defines the criteria* for what counts as mathematically real within a given framework. If it can't be formally represented and verified algorithmically, its status is questionable.
      *   The act of successful verification *constitutes* the mathematical fact within the computational universe. The proof object *is* the witness to existence/truth in this domain.
      *   The computer's impartiality isn't just about avoiding human error; it's seen as revealing the *true, impersonal nature* of mathematical reality – a reality fundamentally computational in structure, accessible only through this mechanized lens. The "independence from human psychology" becomes constitutive of the ontology itself.

  **Conclusion:**

  The perspective you're identifying is best captured by **Algorithmic Realism**. It's a distinct position arising from the practice of formal verification, characterized by:

  1.  **The Centrality of Computation:** Mathematical reality is grounded in formal systems amenable to algorithmic manipulation and verification.
  2.  **The Hybrid Ontology:** Mathematical truth is *discovered* as the necessary consequence of formally constructed rules within such a system. Construction reveals objective constraints.
  3.  **The Primacy of Verification:** The process of machine-checking isn't just epistemic confirmation; it plays a constitutive role in establishing mathematical existence and truth within the computational framework.

  This view navigates the tension you observe by making the machine's unique capabilities – its objectivity *and* its requirement for explicit construction – the very foundation of its mathematical ontology. It offers a realism grounded in computation, distinct from classical platonism, formalism, or nominalism. While philosophers like Jeremy Avigad (discussing the "formal verification turn") or Marcus Giaquinto (on visualization vs. formal proof) touch on related themes, "Algorithmic Realism" provides a focused term for this specific ontological stance leveraging the unique epistemology of mechanized verification.
