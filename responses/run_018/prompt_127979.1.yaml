answer: |-
  That's a sharp question, and you've nailed a key point of confusion where these theories *feel* similar but operate on fundamentally different mechanisms. Here's the breakdown in American English:

  **The Core Distinction: Causation vs. Logical Correlation (Acausality)**

  1.  **Causal Decision Theory (CDT):**
      *   **Focus:** *Actual causal connections.* Your decision *physically brings about* consequences.
      *   **Newcomb's Problem:** CDT says "two-box." Why? Because the prediction (and the $1M) *already happened* in the past. Your *choice now* (one-boxing or two-boxing) *causes nothing* regarding the prediction. It only *causes* whether you get the extra $1K. The predictor's accuracy is irrelevant to the causal structure *at the moment of choice*; it's a correlation based on past causation (the predictor's ability).
      *   **Mechanism:** Uses a causal model of the world. Decisions are based on counterfactuals like "If I *were* to do X, what *would* causally happen?"

  2.  **Superrationality:**
      *   **Focus:** *Logical correlation due to identical reasoning.* It's explicitly **acausal**. Your decision doesn't *cause* the other agent's decision, and vice versa. The link is purely logical/syntactic.
      *   **Prisoner's Dilemma:** The superrational argument is: "We are identical rational agents facing an identical problem, running the same algorithm. Therefore, whatever I conclude is the rational thing to do, the other player will *also* conclude is the rational thing to do. My output (C or D) will logically *match* their output. Knowing this, I must choose the strategy that, *if both players choose it*, yields the best outcome. That strategy is Cooperate (C)."
      *   **Mechanism:** Treats the players' decisions as outputs of the same deterministic function applied to the same input. The correlation arises from identity, not interaction. It's about symmetry and self-consistency in a joint decision problem.

  **Why Philosophers Treat Them as Separate:**

  1.  **The Nature of the Link:**
      *   CDT is fundamentally about *causation in the physical world.*
      *   Superrationality is about *logical/mathematical identity and its implications.* It treats the agents as abstract computational entities, not physical actors whose choices cause effects on each other.

  2.  **Scope and Robustness:**
      *   CDT aims to be a general theory of rational action under *any* causal structure.
      *   Superrationality is a *very specific* solution concept only applicable in highly symmetric situations involving agents known to be using *identical* reasoning processes. If there's *any* doubt the other agent is identical or reasoning the same way, superrationality collapses. CDT doesn't require this symmetry.

  3.  **Newcomb's Problem Illustrates the Difference:**
      *   **CDT:** Explicitly *rejects* the idea that your choice *causes* the prediction. It treats the prediction as a fixed fact about the past.
      *   **Superrationality:** *Could* potentially be applied to Newcomb's *if* you frame the predictor as an identical superrational agent facing a symmetric problem. But this is *not* the standard Newcomb's setup. The predictor is usually an external, non-identical entity with superior knowledge/power. Superrationality requires symmetry between *the decision-makers themselves*.

  4.  **The "Influence" Mistake:**
      *   You said: *"...in Newcomb's problem you one-box because you think your choice causally influences the prediction, and here you cooperate because you think your reasoning causally influences the other agent."*
      *   **This is the core conflation.** Superrationality does *not* say your reasoning *causally influences* the other agent. It says your reasoning *logically guarantees* (due to identity) that the other agent will reach the *same* conclusion independently. There's no causal chain; it's a simultaneous, logical lockstep. In Newcomb's, the standard one-boxer (often using Evidential Decision Theory - EDT) *doesn't* think they cause the prediction; they think their choice is *strong evidence* of what the prediction was, allowing them to act on that correlation. CDT rejects acting on that correlation because it lacks causation.

  **Analogy:**

  *   **CDT:** Two isolated light switches. Flipping your switch *causes* your light to go on. Flipping it doesn't cause the other light to go on unless they are physically wired together.
  *   **Superrationality:** Two identical, perfectly synchronized clocks. When your clock shows 12:00, you *know* (logically, due to identity and synchronization) the other clock *also* shows 12:00. Your clock reaching 12:00 didn't *cause* theirs to reach 12:00; it's a consequence of their shared design and initial conditions. You base your actions (e.g., "meet at noon") on this guaranteed correlation due to identity.

  **In a Nutshell for Your Feature:**

  Superrationality isn't CDT in disguise. It's its own (highly specific) beast. CDT cares about causal levers in the world. Superrationality cares about the logical implications of knowing your "opponent" is running the exact same mental software as you, leading to perfectly correlated outputs *without any causal interaction*. Philosophers separate them because one is a general causal theory, and the other is an acausal symmetry principle applicable only under extreme conditions of identicality. The key isn't confusing correlation with causation; it's recognizing that superrationality relies on a specific *source* of correlation (logical identity) that exists independently of physical causation.

  This distinction is crucial for understanding why superrationality feels like "magical thinking" to CDT proponents and why CDT feels "irrationally self-destructive" in symmetric dilemmas to superrationality proponents. Good luck with the feature – this is a fascinating and tricky corner of decision theory!
