      \]  
    - **SIA**: Favors \(H_B\).  
      \[
      P(\text{your data} | H) \propto \text{observers with your data} = N \text{ (both)} \quad \text{but prior } P(H_B) \propto N(1 + 10^6) \implies \text{BF}_{B:A} = 1 + 10^6
