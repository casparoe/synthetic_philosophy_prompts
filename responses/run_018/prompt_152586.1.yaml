prompt: |-
  For a philosophy of social norms seminar, lay out the desiderata that an adequate theory extending Lewisian convention analysis to the evolution of normative practices must meet. Begin from Lewis's framework: conventions solve coordination problems through regularities sustained by mutual expectations and preference for conformity, without requiring explicit agreement or centralized authority. The theory you specify must then bridge to genuine normativity—explaining how arbitrary coordination equilibria (e.g., driving on the left versus the right) can become experienced as binding obligations that resist change even when a Pareto-superior alternative is available. Your specification should cover four categories of requirements, each with its motivating case: (i) explanatory coverage—what transitions must be accounted for, including the emergence of moralized conventions and the persistence of suboptimal norms; (ii) conceptual distinctions the theory must preserve, especially between first-order behavioral expectations and second-order expectations of approval, blame, or sanction, and between descriptive stability and prescriptive force; (iii) consistency constraints—compatibility with Lewis's conditions that conventions need no explicit rule and no common knowledge of rationality, and with evolutionary dynamics that can select among multiple equilibria; and (iv) exclusion conditions—results the theory must avoid, such as reducing the ought of norms to predictive reliability or importing unreduced moral realism. For each requirement, indicate whether it is non-negotiable or a camp-specific preference (e.g., rational-choice reductionism versus normative realism). Then address the following tension, which is the core of the exercise: can the theory satisfy all three of (a) deriving normative force solely from first-order coordination preferences, without second-order attitudes; (b) explaining why moralized conventions resist Pareto-improving revision; and (c) remaining faithful to Lewis's claim that conventions need no authority or explicit rule? If not, identify precisely which desideratum conflicts with which, and state which relaxation does the least damage to the project of explaining norm evolution. Weight the analysis on the criteria and their motivating cases; you may briefly locate evolutionary game-theoretic or social-norm accounts relative to the list, but do not produce a full scorecard.
reasoning: |-
  Hmm, this is a sophisticated philosophy query about extending David Lewis's convention theory to explain normative practices. The user clearly has deep familiarity with Lewis's framework and wants a structured analysis of theoretical requirements for bridging coordination equilibria to binding obligations.

  Breaking this down, I need to address four categories of desiderata: explanatory coverage (what transitions the theory must explain), conceptual distinctions (key differences it must preserve), consistency constraints (what it must remain compatible with), and exclusion conditions (what it must avoid). Each comes with motivating cases that ground the abstract requirements in concrete examples.

  For explanatory coverage, the key challenge is showing how arbitrary conventions like driving side rules transform into moralized practices that feel obligatory even when inefficient. The persistence of suboptimal norms like honor cultures that harm participants is particularly tricky. This seems non-negotiable - any adequate theory must explain these transitions.

  The conceptual distinctions are crucial. First-order expectations ("I expect you to drive on the right") aren't enough to explain the oughtness of norms. We need second-order expectations ("I expect others to disapprove if you drive on the left"). The theory must also separate descriptive regularity from prescriptive force without collapsing them. Both distinctions appear non-negotiable for capturing genuine normativity.

  Consistency constraints require maintaining Lewis's core insights: no need for explicit agreements or common knowledge of rationality. The theory should also accommodate evolutionary dynamics selecting among equilibria. These seem largely non-negotiable - violating them would abandon Lewis's fundamental framework.

  Exclusion conditions guard against reductionist pitfalls. We can't reduce "ought" to mere predictive reliability ("you should drive right because I predict you will"), nor smuggle in unexplained moral realism. These are non-negotiable for a naturalistic account.

  Now the core tension: can we derive normative force (a) solely from first-order preferences, while (b) explaining resistance to Pareto improvements, and (c) keeping Lewis's no-authority condition? The Pareto-resistance case (like inefficient honor codes) directly conflicts with deriving norms from first-order preferences alone. If people preferred to change, they would - but they don't because of internalized second-order expectations. Sacrificing (a) - allowing second-order attitudes - does least damage while preserving explanatory power. This maintains Lewis's anti-authoritarianism while capturing why norms feel binding.

  The user seems to be preparing for advanced seminar discussion, likely needing this for academic work. Their framing suggests frustration with existing accounts that either over-reduce normativity or invoke unexplained moral properties. By weighting the analysis on concrete cases, I can show how theoretical trade-offs play out in real normative phenomena.
answer: |-
  Here is a systematic breakdown of desiderata for extending Lewisian convention to normative practices, structured by your four categories and addressing the core tension:

  ### I. Explanatory Coverage (Non-Negotiable)
  *   **Required Transitions:**
      *   *Arbitrary Convention → Moralized Obligation:* Explain how practices initially sustained by coordination preferences (e.g., driving side) acquire intrinsic "oughtness" (e.g., perceiving driving on the *wrong* side as morally *wrong*).
      *   *Emergence of Sanctioning Attitudes:* Account for the development of reactive attitudes (blame, approval, shame) beyond mere disappointment at coordination failure.
      *   *Persistence of Suboptimality:* Explain why norms resist Pareto-superior alternatives (e.g., honor culture dueling persists even when all prefer abolition; QWERTY keyboard endures despite inefficiency). *Motivating Case:* Honor norms causing mutual harm yet persisting due to internalized shame/blame preventing unilateral defection.
  *   **Why Non-Negotiable?** Failing to explain these transitions leaves the core phenomenon – the *normativity* of norms – unaddressed.

  ### II. Conceptual Distinctions (Non-Negotiable)
  *   **First-Order vs. Second-Order Expectations:**
      *   Must distinguish expecting behavior *X* (1st-order) from expecting *sanction* (blame, disapproval, reward) for (non-)compliance *and* expecting *others* to hold these sanctioning expectations (2nd-order). *Motivating Case:* Driving on the left (1st-order expectation) vs. believing others will *blame* you for driving on the right and *expect* you to blame violators (2nd-order).
  *   **Descriptive Stability vs. Prescriptive Force:**
      *   Must distinguish explaining *why* a regularity exists (e.g., coordination equilibrium) from explaining why it is *experienced* as obligatory or authoritative ("I *must* do this"). *Motivating Case:* A traffic jam is descriptively stable, but lacks prescriptive force; a queueing norm has both.
  *   **Why Non-Negotiable?** Collapsing these distinctions reduces normativity to mere behavioral regularity or predictive expectation, failing to capture the phenomenology of obligation.

  ### III. Consistency Constraints (Largely Non-Negotiable, Specific to Lewisian/Evolutionary Framework)
  *   **No Explicit Agreement/Authority:** The theory must not rely on explicit contracts, commands, or centralized enforcement to explain the *emergence* or *basic sustaining force* of norms. *Motivating Case:* Lewis's driving convention emerges spontaneously.
  *   **No Common Knowledge of Rationality (CKR):** Should function without assuming agents mutually know each other to be perfectly rational (as per Lewis's weakening). Evolutionary/learning dynamics often suffice.
  *   **Evolutionary Selection Among Equilibria:** Must be compatible with path-dependency and drift, explaining how one norm (e.g., driving on the right) is selected over functionally equivalent alternatives (e.g., driving on the left) without teleology. *Motivating Case:* Historical accident settling one coordination equilibrium.
  *   **Why Non-Negotiable/Largely So?** Violating these abandons the core Lewisian project of explaining order without design. Relaxing CKR is widely accepted; requiring *no* rationality assumptions might be camp-specific (e.g., strong cultural evolutionism).

  ### IV. Exclusion Conditions (Non-Negotiable for Naturalistic Projects)
  *   **Avoid Reducing "Ought" to Predictive Reliability:** Cannot equate "You ought to φ" with "I predict with high probability you will φ". *Motivating Case:* Predicting someone will cheat doesn't imply they *ought* to cheat.
  *   **Avoid Unreduced Moral Realism:** Must not posit irreducible moral facts or properties as the *explanation* for the emergence or force of norms. The "bindingness" must be explained naturalistically (e.g., via psychology, evolution, social dynamics).
  *   **Avoid Trivializing Persistence:** Cannot explain norm persistence *solely* by its current equilibrium status if a Pareto-superior alternative exists. Must explain the *barrier* to change. *Motivating Case:* Dueling persists despite mutual preference for abolition.
  *   **Why Non-Negotiable?** Violating these either fails to explain normativity (first) or abandons naturalism (second), while the third is required for explanatory adequacy.

  ## Addressing the Core Tension: Can (a), (b), and (c) Coexist?

  **(a)** Derive normative force solely from first-order coordination preferences.
  **(b)** Explain resistance to Pareto-improving revision.
  **(c)** Maintain no authority/explicit rule (Lewis's core).

  *   **The Conflict:** **Requirement (a) is fundamentally incompatible with (b) while satisfying (c).**
  *   **Why?**
      1.  **First-order preferences (a)** are inherently outcome-oriented: agents prefer conforming *because* it produces their desired coordination payoff (smooth traffic, avoiding crashes). If a Pareto-superior alternative exists (b), *by definition*, all agents prefer the outcome under the new norm. Pure first-order preferences provide no barrier to switching; coordination should shift.
      2.  **Resistance (b)** requires something *beyond* the outcome-preference driving the original convention. This "something" is the essence of normativity – a sense of obligation or aversion independent of (or overriding) the immediate payoff. This typically involves internalized sanctions (shame, guilt) or anticipated external sanctions (blame, punishment), rooted in **second-order expectations**.
      3.  **(c) is compatible with (b)** *if* the barrier to change arises endogenously from decentralized expectations/sanctions (e.g., mutual expectations of blame for deviating, even towards a Pareto improvement), *not* from authority or rules. This preserves Lewis's anti-authoritarianism.
  *   **Resolution: Relax (a).** Sacrificing the requirement that normative force derives *solely* from first-order preferences does the least damage.
      *   **Cost:** It moves slightly beyond Lewis's *minimal* conditions for conventions by requiring the emergence of second-order normative attitudes (expectations of sanction/reward) alongside behavioral expectations. However, this emergence can still be explained without explicit agreement or authority (satisfying (c)), through mechanisms like correlated sanctioning strategies evolving under selection pressure for group coordination/stability, or learning internalizing social feedback.
      *   **Gain:** It allows the theory to explain (b) – resistance stems from the internalized or anticipated *social costs* (sanctions, disapproval) triggered by deviation, *even when* the outcome of deviation would be Pareto-superior. This captures the "binding" experience. The aversion to sanction becomes partly constitutive of the preference for conformity, transforming it from a pure coordination preference to a normative one.
      *   **Relation to Cases:** This explains the Honor Duel case – the *fear of shame* (sanction) overrides the mutual preference to avoid death. It preserves the Driving Convention's spontaneous origin but explains why *changing* it feels wrong/costly once normative attitudes crystallize.

  **Brief Location of Approaches:**
  *   **Evolutionary Game Theory (Bicchieri, Skyrms):** Excels at modeling selection among equilibria (III), path-dependency, and the emergence of sanctioning (correlated strategies, punishment games) to explain (I, II, IV, and relaxed-a). Often relaxes CKR and rationality.
  *   **Social Norm Accounts (Brennan, Pettit; Bicchieri):** Explicitly incorporate second-order expectations (normative expectations) to distinguish conventions from norms and explain normativity/persistence (I, II, IV, relaxed-a), while adhering to decentralized dynamics (III, c).
  *   **Rational-Choice Reductionism:** Struggles severely with (b) if insisting on (a), and risks violating IV (reducing ought to prediction/equilibrium) or failing I (persistence). May require stronger rationality assumptions (III).
  *   **Normative Realism:** Violates IV by importing unreduced normativity.

  **Conclusion:** A successful Lewisian extension must incorporate the endogenous emergence of second-order normative expectations (sanctioning attitudes) to bridge the gap to genuine normativity and explain key features like resistance to Pareto improvements. Relaxing the demand that normative force stems *only* from first-order preferences is the minimally damaging step necessary to satisfy the core desiderata, particularly explanatory coverage of moralized persistence (I) while preserving Lewisian decentralization (IIIc) and naturalism (IV).
