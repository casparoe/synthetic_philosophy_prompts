  The user wonders if this practice is philosophically underdetermined. Could different value theories support the same split? Possibly. A labor theory of value might see investment returns as sharing profits from labor, while subjective value theory could frame it as time preference. But the infinite compounding part leans towards seeing money as inherently fruitful, which contradicts Aristotle.

