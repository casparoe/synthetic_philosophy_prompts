answer: |-
  That's a brilliant observation of a pervasive and powerful rhetorical move! You've perfectly dissected its core components. There isn't a single, universally accepted term that covers *both* the epistemic and burden-of-proof claims seamlessly, but several established concepts and labels come close, often used together to describe this cluster:

  1.  **Chesterton's Fence:** This is the **most direct and widely recognized label** for the **epistemic claim**. Coined by G.K. Chesterton, the principle states:
      > *"In the matter of reforming things, I may allow you to destroy it."*
      *   **Covers:** Primarily the epistemic claim – the thing likely *had* a reason (the fence wasn't built for no reason), and you must understand that reason before removal.
      *   **Doesn't Explicitly Cover:** The burden-of-proof shift. Chesterton implies the *reformer* must understand the reason, but he frames it as a prerequisite for wise action, not strictly a burden of *proof* against the reformer.

  2.  **Status Quo Bias / Institutional Conservatism:** This describes the *behavioral tendency* underlying the move – a preference for existing rules, practices, or institutions simply because they *are* existing.
      *   **Covers:** The *effect* of the move (defending the status quo) and the *reluctance* to change without overwhelming proof of harm or uselessness.
      *   **Doesn't Explicitly Cover:** The specific epistemic argument about hidden justifications or the burden-of-proof demand. It's the *why* behind deploying Chesterton's Fence arguments.

  3.  **Argument from Ignorance (Appeal to Ignorance - *Argumentum ad Ignorantiam*) - *Misapplied*:** Critics of the move might accuse defenders of committing a fallacy here: "You can't prove there *isn't* a good reason, therefore there *is* one." However, the Chesterton's Fence move is usually *stronger* than a simple appeal to ignorance. It argues that *given the existence and persistence* of the thing, the *probability* of it having *had* a good reason is high, making ignorance of that reason a *legitimate epistemic danger*, not just a logical gap. It shifts the burden based on probability derived from context, not pure ignorance.

  4.  **Burden of Proof Shifting:** This directly addresses your second component. The defender is explicitly or implicitly shifting the burden of proof onto the reformer: "You must prove this *has no function/justification* before we change it," rather than the defender needing to prove it *still has* a function/justification.
      *   **Covers:** The argumentative tactic regarding who must provide evidence.
      *   **Doesn't Explicitly Cover:** The epistemic rationale *for* shifting the burden (i.e., Chesterton's Fence).

  5.  **Precautionary Principle (applied to social/organizational systems):** The idea that in the face of uncertainty and potential systemic risk, it's prudent to avoid changes that might have unforeseen negative consequences.
      *   **Covers:** The *caution* aspect underlying the move. Removing an old rule might destabilize a complex system in unforeseen ways.
      *   **Doesn't Explicitly Cover:** The specific demand to know the *original* reason or the burden-of-proof shift. It focuses on potential future harm from change, not necessarily the history.

  **Labeling the Move:**

  *   **Best Single Label:** **Chesterton's Fence.** This is increasingly the go-to term in discourse analysis, policy debates, and online discussions for the core epistemic argument you describe. It evokes the *why* must be understood.
  *   **Describing the Cluster:** You might call it **"The Chesterton's Fence Gambit"** or **"The Burden-Shifting Conservatism of Chesterton's Fence."** This captures both elements: the epistemic warning (understand the original reason) *and* the argumentative tactic (you haven't earned the right to remove it until you do).
  *   **Other Useful Phrases:** "Appealing to institutional wisdom," "Invoking the wisdom of the ancients," "Demanding historical justification before reform," "Argument from systemic complexity/caution."

  **Where Does Useful Caution Become Obstruction?**

  This is the critical question. The move stops being useful and becomes obstructionist when:

  1.  **Evidence of Current Dysfunction is Overwhelming:** When the costs, inefficiencies, or harms of the current system are demonstrably high and well-documented (e.g., the legacy software crippling hospital efficiency, distribution requirements actively hindering relevant learning), demanding *historical* justification before even *considering* change becomes unreasonable. The burden should shift *back* to the defender to show current utility.
  2.  **The Original Reason is Demonstrably Obsolete:** If the *original* reason is known and clearly no longer applies (e.g., a setback rule for horse tethering in the age of cars), and no *new* valid justification is offered, clinging to Chesterton's Fence is obstruction.
  3.  **The Cost of Inquiry is Prohibitive or Impossible:** Sometimes, the "why" is lost to history, records are gone, or reconstructing it would take immense resources. Requiring this impossible task before any change is unreasonable.
  4.  **It's Used as a Shield Against Scrutiny:** When defenders *never* engage on the merits, *only* demanding the reformer "find the original reason," they avoid defending the practice itself. This turns Chesterton's Fence into a rhetorical shield. The reformer provides evidence of current uselessness/harm; the defender must then either provide a *current* justification or concede.
  5.  **Ignores Evolution & Unintended Consequences:** Institutions and rules evolve. The original reason might be gone, but it may have acquired new (good or bad) functions, or it might exist purely due to inertia or vested interests. Chesterton's Fence focuses only on the *original* intent, potentially ignoring how the thing *actually* functions *now*.
  6.  **Paralyzes Necessary Adaptation:** In fast-changing environments (tech, medicine, social norms), the inability to change quickly due to excessive demands for historical justification can be fatal. The move prioritizes stability over necessary adaptation.

  **In essence:** Chesterton's Fence is an essential **starting principle for responsible reform**. It demands humility and investigation. However, it becomes a **reactionary obstruction tactic** when:
  *   It ignores compelling evidence of *current* dysfunction.
  *   It demands impossible historical proofs.
  *   It's used *instead* of defending the status quo on its *current* merits.
  *   It prevents adaptation in contexts where change is essential.

  The line is crossed when the demand to understand the past becomes an excuse to avoid engaging with the present realities and future needs. As Chesterton himself implied, *once you understand the fence*, you are perfectly entitled to tear it down if it serves no purpose. The obstruction happens when the demand to "understand the fence" becomes an endless, impossible prerequisite designed solely to prevent its removal, regardless of its current value.
