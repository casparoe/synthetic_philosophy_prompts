  Okay, the user is a science and ideas journalist who's noticed a recurring argumentative pattern. They describe a scenario where someone wants to abolish an old rule or institution because it's seemingly useless, and the counter-argument is that unless you know its original purpose, you can't claim it's obsolete. The user has seen this in various contexts: zoning rules, hospital software, university requirements. They mention both Burkean conservatives and others like engineers and left-leaning journalists using this tactic without conservative ideology. 

  The user wants to know if there's a name for this move, whether it's one argument or a cluster, and where the line is between reasonable caution and obstructionism. They suspect it combines an epistemic claim (hidden justification exists) and a burden-of-proof claim (reformer must disprove utility).

  First, I should identify the core components of this argument. The epistemic part assumes that old practices likely have undiscovered rationales—this connects to Chesterton's Fence. The burden-of-proof part insists reformers must investigate before dismantling—linked to the precautionary principle or status quo bias. 

  The user might be seeking terminology to articulate this pattern in their writing. They probably encounter this frequently and need a shorthand to critique it effectively. Unspoken needs could include understanding how to counter this argument or recognizing when it's valid versus when it's a stalling tactic. 

  For labels, Chesterton's Fence covers the epistemic aspect well. Burden of proof shifts and status quo bias explain the argumentative weight placed on reformers. Institutional conservatism captures the behavioral tendency without political alignment. 

  The user also asks about the threshold where caution becomes obstruction. This is crucial. Factors include complexity of the system, risks of change, availability of evidence, and whether critics engage constructively. If defenders never justify the practice despite evidence, it veers into obstruction. 

  I should also note that while Chesterton's Fence is a starting point, it's not the whole story. The burden aspect needs separate framing. Real-world examples like legacy software show how the argument can be misused—defenders might ignore current costs while demanding impossible historical proof. 

  The user’s examples suggest frustration with this move blocking progress. They might want ammunition to challenge it when it’s unreasonable. Highlighting Chesterton’s original intent—that fences should be *removed once understood*—could empower reformers. 

