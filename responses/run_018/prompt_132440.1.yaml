prompt: |-
  hey, i need help building a taxonomy / decision tree for a blog post i'm drafting. the topic is what "work" even means once automation takes over not just manual labor but also the judgment-calls — like legal reasoning, medical diagnosis, creative editing. i want something that sorts readers by what they acutally believe, not by the label they like.

  please act like a philosopher of labor with some social ontology background — no historian, and definetly no bibliography or reading list, since i'm writing for people who can't search stuff up. before you draw the tree, do a quick brainstorm: what are the real fault lines? i think they involve (1) whether work must produce an external good, (2) whether it needs to be effortful or hard, (3) whether it needs social recognition, and (4) this niche idea i want to inject — "cognitive residue" — the leftover mental friction that stays with a human even when an AI does the task, and whether that residue counts as real work or just noise.

  then deliver these sections in this order:

  1. Brainstorm dump — about 100 words, rough bullet form, no polish needed.
  2. The tree — start with "Does work require producing something outside yourself?" then branch with concrete yes/no or either/or nodes. each node should be a claim an ordinary person could agree with without knowing philosophy jargon. make sure these leaves appear: the "work is dead, celebrate it" view; the "work migrates to care and relationship labor" view; the "work is just effort, so AI can't kill it" view; and the "cognitive residue" view where people still "work" by supervising or interpreting AI outputs. flag any pair of leaves your tree can't really seperate.
  3. Leaf descriptions — 2 to 3 sentences per leaf. name the position (or call it unnamed), and state its most awkward commitment in plain language.
  4. Unoccupied branches — brief notes on answer-combinations that have no defenders. are they incoherent, ugly, or just unexplored? be honest if you're guessing.
  5. How to use it — 2 or 3 sentences on turning this into a quiz for blog readers.

  keep it casual — a typo or two is totally fine, makes it feel real. don't quote anyone verbatim, don't ask for sources, and don't drop obscure philosopher names unless you have to. ground everything in ordinary cases: nursing, coding, parenting, factory oversight. think carefully about whether each branch actually seperates people, not just decorates the page.
reasoning: |-
  Okay, let me break this down. The user wants a taxonomy/decision tree about the definition of "work" in an age of advanced automation, framed for non-academic readers. Key requirements: focus on philosophical fault lines, include their "cognitive residue" concept, avoid jargon, and make it practically useful for blog readers.

  First, I need to brainstorm the core tensions. The user already identified three main axes (external output, effortfulness, social recognition) plus their novel "cognitive residue" idea. But I should probe deeper - what underlying beliefs make these fault lines meaningful? For example: 
  - Is work fundamentally about survival or meaning-making? 
  - Does value come from scarcity or intention? 
  - Can machines ever "work" or is it inherently human?

  The cognitive residue concept is particularly interesting. It seems to describe that lingering mental engagement humans experience even when delegating tasks to AI - like the unease after approving an AI medical diagnosis or the mental effort of interpreting machine outputs. This could be a fresh angle that moves beyond typical "automation takes jobs" discourse.

  For the decision tree, I'll start with the most fundamental split: whether work must produce something external. This cleanly separates instrumental views from experiential ones. Then branch into:
  - Effort requirement (distinguishing grind-focused views from ease-accepting ones)
  - Social recognition (handling relational labor perspectives)
  - Cognitive residue (capturing their unique contribution)

  Crucially, I must ensure the tree surfaces the four specified leaf positions naturally. The "work migrates to care labor" view should emerge from valuing non-tangible outputs, while "work is just effort" branches from denying external outputs. The cognitive residue position needs to appear when someone acknowledges intangible outputs but rejects traditional effort requirements.

  I'll watch for logical gaps - like positions that might theoretically exist but have no real-world adherents (e.g., believing work requires no output AND no effort AND no recognition - which collapses into nihilism). Also flag where the tree can't perfectly separate views (e.g., care labor and cognitive residue might overlap in practice).

  For leaf descriptions, I'll use punchy plain language that exposes each position's toughest implication. Like pointing out that if work is just effort, then struggling to sleep "counts" as work. Or that celebrating work's death might accidentally devalue current workers' identities.

  The unoccupied branches section should honestly assess why certain combinations lack supporters - whether due to internal contradictions (like valuing effort but rejecting all friction) or cultural unthinkability (like prizing unrecognized labor).

  Finally, the quiz implementation advice should focus on self-discovery over labeling. Suggest concrete scenarios: "When you double-check an AI's legal brief, does that mental tension feel like work?" rather than abstract questions.
answer: |-
  Here's your taxonomy toolkit, drafted rough and ready as requested:

  ### 1. Brainstorm Dump
  *   **Core Tensions:**
      *   **Output vs. Experience:** Is work *defined* by making something tangible (a shoe, a verdict) or by the internal state/effort (sweat, focus)?
      *   **Suffering Optional?** Must work *hurt* (physically/mentally) to count? Or can joyful creation be "work"? Is ease inherently non-work?
      *   **Audience Needed?** Does work require someone else to *see* it as valuable/useful? Or is a monk's solitary prayer "work"?
      *   **The AI Grit:** **Cognitive Residue** – When AI does the *main* task (diagnosis, legal research), is the human's remaining mental load (monitoring, interpreting outputs, feeling responsible for AI errors, the *anxiety* of overseeing it) the *new* work? Or just pointless friction?
      *   **Human Essence?** Is work fundamentally tied to human biology/limitation? If AI perfectly mimics a human task, was it ever "work" at all?
      *   **Value Source:** Does value come *from* the effort, or is effort just a *cost* to achieve value?

  ### 2. The Decision Tree

  ```
  START: Does work fundamentally require producing something outside yourself? (A good, service, outcome, change?)
   |
   ├── YES, it must produce an external "thing".
   │    |
   │    ├── Does this "thing" need to be recognized/valued by others? (Socially validated output)
   │    │    |
   │    │    ├── YES, social recognition is essential. → **Leaf: "Work Migrates to Care & Relationship Labor"**
   │    │    │        (The only irreplaceable "outputs" are human connection, care, emotional labor.)
   │    │    │
   │    │    └── NO, the output exists independently of recognition. → **Leaf: "Work is Dead (For Humans), Celebrate It!"**
   │    │             (If AI makes all outputs better/faster, human "work" becomes obsolete. Focus on leisure/meaning elsewhere.)
   │    │
   │    └── Does the *process* of producing this thing need to feel effortful/hard? (Friction required)
   │         |
   │         ├── YES, effort is inherent to the work concept. → **Leaf: "Work is Just Effort (So AI Can't Kill It)"**
   │         │        (Even supervising AI is cognitively taxing; mental friction *is* the work.)
   │         │        (*Note: Close to Cognitive Residue, but insists effort defines work.*)
   │         │
   │         └── NO, the output matters, not the ease. → **Leaf: "Output-Oriented Minimalists"**
   │                  (If AI produces flawless outputs effortlessly, that's fine. Human "work" shifts to defining *what* to produce.)
   │
   └── NO, work is defined by internal states/actions, not external outputs.
        |
        ├── Is the core of work the experience of **effort, struggle, or "cognitive residue"?** (Friction defines it)
        │    |
        │    ├── YES, work *is* the friction. → **Leaf: "Work is Just Effort (So AI Can't Kill It)"** (Reappears!)
        │    │        (*Note: Overlaps heavily with the "Effort Required" branch above. Hard to separate cleanly.*)
        │    │
        │    └── NO, work can be frictionless action/engagement. → **Leaf: "Flow-State Workers"**
        │             (Deep, focused engagement (like playing music perfectly, coding in flow) *is* work, even if effortless and output-optional.)
        │
        └── Does work require **intention/purpose** directed towards *something*, even if not "produced"? (Purposeful Action)
             |
             ├── YES, purposeful action defines work. → **Leaf: "Cognitive Residue is Core Work"**
             │        (Supervising AI, interpreting its outputs, bearing responsibility for its actions *is* the new, crucial work – the mental residue *is* the labor.)
             │
             └── NO, work is any sustained mental/physical activation. → **Leaf: "Activity = Work"**
                      (Thinking hard, worrying, even concentrated breathing exercises count as "work".)

  ```

  **Flagged Overlaps:**
  *   **"Work is Just Effort"** appears in both main branches. People arriving here likely share the core belief that *friction defines work*, regardless of output. The tree separates them technically but the core view is identical.
  *   **"Cognitive Residue"** and **"Work Migrates to Care"** might blur. Is the mental friction of *caring* (an output) distinct from the friction of *overseeing AI*? In practice, proponents might blend them.

  ### 3. Leaf Descriptions

  1.  **"Work Migrates to Care & Relationship Labor"**: Work becomes the uniquely human acts of caring, emotional support, teaching, deep connection. Machines can't *truly* care. **Awkward Commitment:** Argues much current "knowledge work" wasn't *real* human work to begin with, just complex calculation now automated.
  2.  **"Work is Dead (For Humans), Celebrate It!"**: Automation liberates us. True value shifts to leisure, art for art's sake, community, personal growth. "Work" as we knew it is obsolete. **Awkward Commitment:** Risks sounding dismissive of people who find deep meaning and identity *in* their current (potentially automatable) work.
  3.  **"Work is Just Effort (So AI Can't Kill It)"**: Work is defined by the sweat (physical or mental). AI just changes *what* we sweat over (e.g., managing AI, constant reskilling). **Awkward Commitment:** Struggling to fall asleep or solving a frustrating puzzle purely for fun must be considered "work".
  4.  **"Output-Oriented Minimalists"**: Work is about achieving results. If AI gets results perfectly with less human input, that's progress. Human work focuses on high-level goals/strategy. **Awkward Commitment:** A completely hands-off investor collecting dividends did "work" by allocating capital, even if entirely passive afterward.
  5.  **"Flow-State Workers"**: Work is deep, engaged, purposeful *action*, regardless of effort or output. A coder "in the zone," a musician lost in play. **Awkward Commitment:** Distinguishing this from pure leisure or play becomes very subjective.
  6.  **"Cognitive Residue is Core Work"**: The mental load of shepherding AI – interpreting outputs, managing risk, ethical oversight, the *stress* of responsibility – *is* the primary work left. The residue isn't noise; it's the job. **Awkward Commitment:** Admits this work often feels fragmented, unsatisfying, and less "productive" than pre-AI tasks.
  7.  **"Activity = Work"** (Unnamed): Any sustained, directed mental or physical energy expenditure qualifies. Worrying about your job, intense concentration, even complex hobbies. **Awkward Commitment:** Severely dilutes the concept; almost everything becomes "work," making the term meaningless for distinguishing activity types.

  ### 4. Unoccupied Branches

  *   **"NO Output" + "Requires Social Recognition"**: If work produces *nothing* external, how can it be socially recognized? Recognition needs *something* to recognize. **(Incoherent)**
  *   **"NO Output" + "NO Purposeful Action" + "NO Effort"**: Pure, effortless, purposeless activation? Like... existing? Breathing automatically? Nobody argues *this* is work. **(Incoherent/Ugly - defines nothing)**
  *   **"YES Output" + "NO Social Recognition Needed" + "NO Effort Needed"**: Believing work is *only* about effortlessly producing unrecognized outputs. Who holds this? Libertarian hermits? Feels culturally alien, ignores human social nature. **(Unexplored/Unlikely)**
  *   **"Cognitive Residue is Core Work" + "Requires High Effort"**: The residue view often sees the friction as *inherently* part of the work, so separating "residue" from "effort" here feels forced. Most proponents bundle them. **(Redundant Branch - Guessing)**

  ### 5. How to Use It (Quiz Style)

  > "Turn this tree into a quick quiz! Ask readers concrete questions based on the nodes: *'If an AI perfectly diagnoses a patient while a doctor just glances at the report, did the doctor "work"? Why/why not?'* Or *'Is a parent comforting a child more "real work" than an AI drafting a legal contract?'* Their answers place them on the branches. The goal isn't a label, but revealing their underlying priorities about effort, output, and that nagging feeling of managing AI."

  This gives you the philosophical scaffolding – the concrete cases (nursing oversight vs. AI diagnosis, parenting vs. AI editing) are baked into the branches. The "cognitive residue" gets its rightful place as a distinct, plausible view. The overlaps are flagged honestly. Go make that blog post!
