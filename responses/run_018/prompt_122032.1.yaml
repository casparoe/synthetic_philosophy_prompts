prompt: |-
  im writing a novel — small town, factory closing, two sisters who have to decide whether to say out loud that the man who kept the place running for thirty years did something shabby to a kid who worked there one summer. one sister thinks the family and the town should close ranks; the other thinks somebody got hurt and it has to be said. the problem is not the plot, its that every time i write them arguing i get two cardboard cutouts: one all sentiment and loyalty, one all harm and fairness. so before i build the rest of the cast on top of it, i want the spec rather than the theory.

  what would a theory of moral judgment have to deliver for me to trust it as scaffolding for characters who disagree like this? not "which theory is true" — the list of requirements, each with the case or consideration behind it, so i can see which demands are real and which are just one camps ideology dressed up as a criterion. adequacy here means a specific thing for me: good enough that a reader who disagrees with a character still recognises her as a person with reasons, and good enough that i can predict what she does in a scene i haven't written yet.

  here are the things i keep tripping over as i write, which i suspect are cases any such theory has to handle — tell me which of them actually deserve to be on the list, which are my own prejudice, and what i've left out:

  - the harmless-but-condemned ones: consenting adult siblings using contraception, a man who cooks and eats his own dog after the dog is already dead, someone cleaning a toilet with a national flag. people condemn and then can't produce a victim, and when you knock down their reasons they keep the verdict.
  - the gap between killing and letting die, and between the personal and impersonal versions of the trolley family — is that distinction doing real moral work or is it an artefact of which emotional system gets triggered, and if its an artefact, does that defuse the intuition or indict it?
  - verdicts getting harsher in a foul-smelling room or after a bitter drink, and how much weight that deserves given that effects of this kind have had replication trouble.
  - the residue: a character who has stopped believing something is wrong and still flinches at it. and the reverse — the character who has argued himself into endorsing something and still can't bring himself to do it.
  - the flip: somebody who changes her mind on an issue over about two years, after which she has a complete and fluent set of reasons that were not what moved her.
  - the cases with no polling data. my characters have to react to situations nobody has surveyed — a specific betrayal in a specific kitchen. so the theory has to generate verdicts for new cases, not just catalogue the ones it was fitted to. i think this is the requirement that kills off a lot of candidates, but you tell me.
  - the observable markers. i can write thoughts but i mostly need bodies: what does a change in moral conviction look like from outside?
  - the moral/conventional line as kids are supposed to draw it — hitting someone versus breaking a school rule about what to wear — and the awkward fact that for a lot of people purity violations feel like both morality and just disgust at once.
  - the bit where moral conviction stops being a strong preference and becomes something you'd enforce on strangers who weren't involved.
  - heritability stuff, the fact that moral intuitions are trainable, and the fact that whole classes of acts go from unremarkable to unthinkable inside a couple of generations. if conviction can move that fast and that far, what is left of the feeling that this one is just true?
  - the same person being a stickler in one domain and a consequences guy in another, and being a different moral agent with her family than with a stranger or an outgroup.
  - and then the one i actually care about for the sisters: does any of this psychology tell us anything about who is right, or is that question on a completely separate track? i have a feeling my two favourite requirements are going to fight here — that a theory can't both take seriously the way conviction presents itself (as about the thing, not about me) and explain that conviction as weights that got set by culture, upbringing and mood. if some subset of the desiderata can't be jointly satisfied, say so and show me where the tension is; that's the part i want most.

  mark which requirements are non-negotiable for my purpose and which are negotiable or just somebody's preference, and say which single requirement does the most work in excluding popular theories. then, very briefly — a few lines, not an essay — how the main contenders do: the harm-only rationalist picture, the pluralist foundations picture with its care/fairness/loyalty/authority/purity/liberty style menus, the morality-as-cooperation kind of view, and the hard-nosed "its all tribal signalling" one. and one more novelist thing: give me the knobs. what parameters would i actually set to build a character whose verdicts are predictable but not mechanical?

  no footnotes or reading list please, i cant chase references anyway. and write the whole answer in British English.
reasoning: |-
  Okay, the user is writing a novel about two sisters in a small town facing a moral dilemma involving a factory manager who harmed a child. They're struggling to create nuanced characters instead of cardboard cutouts. The user wants a moral theory that can serve as scaffolding for believable disagreements, with specific requirements listed. 

  Hmm, this is an interesting challenge. The user clearly understands moral psychology concepts but needs practical application for character development. Their frustration with simplistic "loyalty vs justice" dichotomies is palpable. 

  Let me unpack their requirements one by one. The "harmless-but-condemned" examples show they want to capture irrational moral intuitions. The "gap between killing/letting die" point reveals concern about emotional versus rational responses. The environmental influences (foul smells affecting judgments) highlight situational factors many theories ignore. 

  The "residue" and "flip" observations are crucial - they show moral convictions have inertia and can change independently of reasoning. The "no polling data" requirement is particularly sharp - theories must generate novel judgments, not just catalog existing ones. 

  For observable markers, I should focus on physical tells - posture changes, vocal shifts, etc. The moral/conventional distinction matters for childhood development scenes. The enforcement question gets at why some convictions feel universally binding. 

  The heritability and domain-specificity points attack the idea of consistent moral personalities. And the core tension - can psychology tell us who's right? - cuts to the heart of their novel's conflict. 

  For theories: Rationalist harm-only models fail most requirements. Pluralist foundations handle more but still stumble on residue and flip. Cooperation theories are better at cross-cultural variation but weak on disgust cases. Tribal signalling explains condemnation patterns but reduces morality to performance. 

  The knobs for character-building need to be concrete: core foundation weights, reasoning style (fast/slow), enforcement threshold, etc. Domain-dependent weights could explain why someone is strict about purity but flexible about fairness. 

  Ultimately, pluralism plus some signalling elements serves best - it explains why the loyal sister feels physical revulsion at betrayal while the justice-focused sister experiences it as cognitive dissonance. The key is showing both as responding to real moral dimensions, just weighted differently.
answer: |-
  Here’s a breakdown tailored to your needs as a novelist, focusing on adequacy for character depth and predictability, in British English:

  ### Non-Negotiable Requirements for Your Scaffolding:
  1.  **Generates Novel Judgements:** *Essential.* Must predict reactions to unique situations (e.g., *that specific betrayal in that specific kitchen*), not just catalogue surveyed dilemmas. Theories relying solely on learned rules fail here.
  2.  **Explains Observable Markers:** *Essential.* Must translate internal conviction into external behaviour – shifts in posture, vocal tone (hardening/wavering), gaze (avoidance/directness), physiological reactions (flinching, tension), or changes in social distance.
  3.  **Accounts for the Residue & Flip:** *Essential.* Must explain why visceral reactions (flinching) persist after intellectual rejection, and vice versa (inability to act despite intellectual assent). Also why reasons given *after* a slow-motion change of mind often feel post-hoc.
  4.  **Handles Domain-Specificity & Context:** *Essential.* Must explain why a character might be a rigid deontologist about promises to family but a utilitarian with strangers, or strict on purity but lax on fairness.
  5.  **Explains Enforcement Drive:** *Essential.* Must clarify why some convictions feel like universal laws demanding enforcement on strangers, while others feel like personal preferences.

  ### Important But Negotiable Requirements:
  6.  **Harmless-but-Condemned:** *Important nuance.* Explains irrational disgust/purity reactions. Vital for characters clinging to condemnation without clear victims (relevant to the sisters' debate: "It's *just wrong*" without tangible harm).
  7.  **Killing/Letting Die & Trolley Variations:** *Useful tension.* Highlights role of emotion (personal force, disgust) vs. cold calculation. Shows how identical outcomes feel morally different based on *how* achieved. Crucial for exploring moral hypocrisy or inconsistency in characters.
  8.  **Moral/Conventional Distinction & Purity:** *Useful character tool.* Explains why some violations feel like inherent wrongs (hitting) vs. arbitrary rules (uniform). Purity's overlap with disgust/morality is key for characters motivated by visceral revulsion ("tainting the town").
  9.  **Heritability & Rapid Cultural Shift:** *Important context.* Undermines claims of "objective" morality for *characters*, showing convictions as malleable. Creates tension for characters wrestling with traditions vs. new norms. Explains how the sisters' starting points were shaped.

  ### Likely Your Prejudice or Less Critical:
  10. **Environmental Triggers (Smell/Bitter Drink):** *Interesting, but weak.* Replication issues make it shaky scaffolding. Better treated as *amplifiers* of existing tendencies within a scene (e.g., a character already stressed by the argument becomes harsher in a foul room).
  11. **"Who is Right?":** *Separate Track – Keep it Separate.* Psychology describes *how* judgements form, not whether they are *correct*. The novel's power lies in the sisters *both* having psychologically credible, deeply held convictions, neither being a strawman. Trying to make the psychology adjudicate truth undermines character depth. Let the reader wrestle with "who is right?" based on the *human drama*, not the theory.

  ### The Requirement That Excludes Most Theories:
  **Generates Novel Judgements.** Many popular theories (especially strict rule-based deontology or simple utilitarianism) struggle badly here. They excel at analysing *known* dilemmas but lack the machinery to reliably predict reactions to truly novel, context-rich, emotionally charged personal betrayals.

  ### Main Contenders Briefly:
  1.  **Harm-Only Rationalist (e.g., Singer):** Fails utterly on harmless-but-condemned, purity, residue/flip, and domain-specificity. Too cerebral, misses visceral and cultural drivers. Excluded by most requirements.
  2.  **Pluralist Foundations (MFT - Haidt):** **Strongest fit.** Handles harmless-but-condemned (Purity), residue/flip (intuition first), moral/conventional (different foundations), domain-specificity (different weights per domain), enforcement (stronger binding foundations demand it), cultural shift (foundations culturally calibrated). Explains observable tension (conflicting foundations activated). Struggles *slightly* with pure novelty generation but offers best framework.
  3.  **Morality-as-Cooperation (MAC - Curry):** Better than harm-only, handles some cultural variation and enforcement (cooperation requires norms). Weaker on harmless-but-condemned/purity, residue/flip, and explaining the *intensity* of reactions beyond cooperation breakdown. Less predictive for highly personal, non-cooperative contexts like intimate betrayal.
  4.  **Tribal Signalling (e.g., some interpretations of Boyd/Richerson):** Explains condemnation without victim (signalling loyalty), cultural shift, and enforcement (punishing defectors). Useful *component* for the "close ranks" sister. Weak on residue/flip (reduces morality to performance), genuine internal conviction, and why people *feel* morality is objective. Risks making characters feel inauthentic.

  ### The Knobs: Parameters for Building Your Characters
  Set these for each sister (and key townsfolk):
  1.  **Foundation Weights:** Assign relative importance to Care, Fairness, Loyalty, Authority, Purity, Liberty. (e.g., Sister A: Loyalty 9, Authority 7, Purity 6, Care 5, Fairness 3. Sister B: Fairness 8, Care 8, Liberty 6, Loyalty 2, Purity 1).
  2.  **Reasoning Style vs. Intuition:** How much do they *reason* to justify gut feelings (post-hoc) vs. genuinely deliberate? How strong is the initial intuitive flash? (Sister A: Strong gut intuition (Loyalty/Purity), reasons slowly to justify. Sister B: Stronger initial deliberation, but strong Care/Fairness intuition).
  3.  **Enforcement Threshold:** How readily do they move from "this is wrong" to "others must be punished/stopped"? High for Sister A (protecting the tribe), variable for Sister B (might focus on victim support over punishing the man).
  4.  **Domain Dependence:** How much do their weights shift between contexts (Family/Town/Strangers/Outgroup)? Sister A's Loyalty likely sky-high for town/family, low for outsiders. Sister B's Fairness more consistent, but Care might heighten for known victims.
  5.  **Vulnerability to "Residue":** How strong is the visceral gut reaction independent of current belief? High for Sister A regarding tradition/purity breaches, perhaps lower for Sister B except regarding direct harm witnessed.
  6.  **Trigger Sensitivity:** What specific actions/contexts disproportionately trigger their core foundations? (e.g., Sister A: Betrayal of town secrets, disrespect to elders. Sister B: Unfairness to the vulnerable, silencing victims).

  ### Key Tension for You
  The core tension in your favourite requirements is between **Experiential Truth** (conviction *feels* objective, about the act itself) and **Psychological Origin** (conviction is shaped by biology/culture/context). *Pluralism (MFT) navigates this best:* It posits innate *foundations* sensitive to specific inputs (harm, unfairness, betrayal etc.), making the feeling of objectivity real *to the individual*, while acknowledging the inputs and weights are culturally tuned. The sister defending the man genuinely *feels* the Loyalty/Purity violation of speaking out as a profound, objective wrong threatening the fabric of their world. The sister wanting to speak genuinely *feels* the Fairness/Care violation of silence as an objective wrong compounding the harm. The psychology explains *why* they feel their truth so strongly, without dictating which truth is "right" – that's the novel's drama. Use the "knobs" to set these conflicting felt truths credibly.
