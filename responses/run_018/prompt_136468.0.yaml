  - Treaty negotiation: hypothetical where a clause almost changed. Reconstructionists focus on documented pressures; constructivists emphasize the negotiator's unrecorded mindset. 
  - Narrative closure: choosing where a story ends. Reconstructionists seek "natural" endpoints; constructivists see rhetorical construction.

  In concluding, I'll argue the "actuality" dispute is partly verbal: reconstructionists mean event occurrence, constructivists mean meaningful coherence. But the modal leakage crux remains substantive - it exposes how even rigorous methods import unverifiable judgments.

