  For narrative constructivism (Carr/White): all history is tropological construction. Carr's "history means interpretation" emphasizes present concerns shaping selection, while White's tropology argues emplotment (romance, tragedy etc.) prefigures factual accounts. Their shared axiom: no unmediated access to past actuality, only textualized traces filtered through narrative frameworks.

