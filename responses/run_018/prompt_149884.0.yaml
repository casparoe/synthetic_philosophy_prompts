answer: |-
  ### Comparative Analysis of Non-Human Historical Agency  

  #### **I. Epidemic Pathogens as Autonomous Actors**  
  *(e.g., McNeill's "Plagues and Peoples," Crosby's "Ecological Imperialism")*  
  1. **Mechanism of Directional Influence**:  
     Pathogens exert directional pressure through **evolutionary selection dynamics**:  
     - *Virulence/transmission trade-offs* reshape demographics (e.g., Black Death → labor shortages → feudalism's collapse).  
     - *Immune evasion* drives societal adaptation (e.g., smallpox in the Americas enabling European conquest via differential immunity).  
     → Change stems from **co-evolutionary arms races** independent of human design.  

  2. **Boundary with Determinism & Defensive Move**:  
     - **Collapse point**: When pathogen evolution is framed as *sufficient cause* for civilizational collapse (e.g., "Old World germs destroyed Native American societies").  
     - **Defensive move**: Emphasize **human mediation** (e.g., colonial exploitation amplified smallpox mortality; public health innovations mitigated cholera).  

  3. **Vulnerability Framing**:  
     Social vulnerability treated as **intrinsic** (e.g., immunological naïveté as inherent to isolated populations; urban density as structural amplifier).  

  ---

  #### **II. Geophysical Disruptions as Agentive Forces**  
  *(e.g., Diamond's "Collapse," Parker's "Global Crisis")*  
  1. **Mechanism of Directional Influence**:  
     Events like volcanic winters (e.g., 536 CE) or megadroughts exercise influence through **biophysical cascades**:  
     - *Primary stressor* → crop failure → famine → state destabilization (e.g., Late Bronze Age collapse linked to Hekla 3 eruption).  
     - *Directionality* arises from thresholds crossed (e.g., desertification ending agrarian settlements).  

  2. **Boundary with Determinism & Defensive Move**:  
     - **Collapse point**: When geophysical events are deemed *necessary and sufficient* for societal failure (e.g., "Thera eruption *caused* Minoan decline").  
     - **Defensive move**: Highlight **sociopolitical resilience** (e.g., Inca adapted to earthquakes; Angkor's hydraulic system failed due to war, not just monsoon shifts).  

  3. **Vulnerability Framing**:  
     Vulnerability framed as **externally imposed** (e.g., volcanic ash as exogenous shock; aridity exceeding adaptive capacity).  

  ---

  ### **Synthetic Distinction: Agentive Causation vs. Structural Exposure**  
  | **Framework**          | **Agentive Causation**                                                                 | **Structural Exposure**                                                                 |  
  |------------------------|----------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------|  
  | **Pathogen Framing**   | Pathogen evolution drives change *autonomously* (e.g., Y. pestis mutations → pandemic). | Pre-existing fragility *enables* catastrophe (e.g., malnutrition → high plague mortality). |  
  | **Geophysical Framing**| Volcano/climate acts as *external trigger* (e.g., Tambora → "Year Without Summer").     | Infrastructure determines impact (e.g., Roman grain dependence → climate volatility → famine). |  

  #### **Translation Outcomes**:  
  1. **Pathogen Framing Survives Intact**:  
     - Evolutionary mechanisms (e.g., antigenic drift in influenza) **are agentive**—viral behavior is intelligible via Darwinian logic *without* social context.  
     - *Residue*: Pathogen strategy (e.g., HIV’s latency period) reflects *teleonomy* (goal-directedness via selection), not anthropomorphism.  

  2. **Geophysical Framing Requires Reinterpretation**:  
     - Volcanic eruptions lack "trajectory"—their impact is wholly contingent on social structures (e.g., Thera’s Minoan impact depended on naval/logistical fragility).  
     - *Residue*: None; claims of "agentive force" collapse into **structural exposure** (e.g., "Little Ice Age crisis" reveals tax/fiscal systems' fragility, not climate's agency).  

  #### **Key Findings**:  
  - **Genuine Non-Human Agency**: Unique to pathogens—evolutionary algorithms generate *self-directed* change. Volcanic eruptions lack internal teleology.  
  - **Anthropomorphic Artifact**: Geohistorical "agentive" language often obscures how outcomes derive from **systemic vulnerability** (e.g., framing famines as "climate-driven" neglects colonial resource extraction).  
  - **Theoretical Implication**: Pathogens act as *biohistorical actors* due to adaptive capacity; geophysical events are *revealers* of pre-existing fragility.  

  > **Conclusion**: The pathogen-as-actor model resists deconstruction due to its basis in evolutionary biology, while geophysical "agency" is invariably reducible to structural exposure. This exposes a core asymmetry: **adaptive non-humans** (pathogens) can exert directional pressure, but **non-adaptive forces** (volcanoes) cannot.
