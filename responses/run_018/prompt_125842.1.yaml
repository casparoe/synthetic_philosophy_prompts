  ## The Doorframe Holds the Murderer's Gaze  
  (A Kantian Villanelle)

  Truth's scaffold falls if lies ascend as law,  
  A world where trust is hollowed at the core.  
  The doorframe holds the murderer's raw maw.

  "Where hides my prey?" Demands the tyrant's claw,  
  While Reason whispers duties to explore:  
  *Truth's scaffold falls if lies ascend as law.*

  Beneath the floorboards, fear without a flaw,  
  Beneficence cries out: Protect! Restore!  
  The doorframe holds the murderer's raw maw.

  Could falsehood's maxim pass? It holds a flaw:  
  Contradiction burns where trust was sworn before.  
  Truth's scaffold falls if lies ascend as law.

  To speak untruth corrupts the right you saw  
  Inherent in your word, forevermore.  
  The doorframe holds the murderer's raw maw.

  The juridical bond sustains no thaw;  
  This perfect duty binds, though hearts deplore.  
  Truth's scaffold falls if lies ascend as law.  
  The doorframe holds the murderer's raw maw.

  ---

  **Notes on Interpretation & Contestation:**

  *   **Settled:** The core argument presented hinges on a **contradiction in conception** within the Universalization test (Groundwork). Universal lying destroys the possibility of truthful communication upon which deception depends. Kant explicitly argues this against Constant ("On a Supposed Right to Lie").
  *   **Settled:** Kant insists the perfect duty of veracity binds absolutely in this case, overriding the imperfect duty of beneficence (saving the friend). The tension is acknowledged, but the perfect duty prevails.
  *   **Contested (Juridical Reading):** The poem leans on interpreting the wrongness of lying as violating the "humanity in one's own person" by corrupting the juridical condition (*rechtlicher Zustand*) of communication (a perspective emphasized in the *Metaphysics of Morals*). While Kant links lying to self-debasement, some scholars focus more narrowly on the contradiction in conception or duty to others; the strong "juridical" framing is a significant interpretive lens, not the *only* consensus reading.
  *   **Contested (Status of Beneficence):** The poem presents the duty of beneficence ("Protect! Restore!") as a **genuine competitor** creating palpable moral tension ("hearts deplore"). While Kant *acknowledges* the pull, many scholars argue he sees it as definitively outweighed and *not* a true competitor in the final moral calculus for the agent – the perfect duty is decisive. The poem emphasizes the felt tension more than Kant's ultimate resolution might suggest.
  *   **Poetic Compression:** The universalization test is necessarily simplified. The poem focuses on the "contradiction in conception" aspect relevant to lying, omitting nuances like distinctions between perfect/imperfect duties derived solely from the test itself or debates about formulating maxims. The core logical structure of the *argument against lying* is prioritized.
