prompt: |-
  hey so im giving a talk tuesday in the cultural psych seminar and i need a real prep sheet for the Q&A, not just generic advice. my thesis is that shame is actually the better moral emotion compared to guilt—specifically because shame works as an epistemic signal about broken shared understanding, not just a status hit. i call the version im defending horizontal shame: peer-accountability without vertical ranking, where feeling shame means you recognize a gap in collective moral knowledge rather than failing some internal rule. im arguing cultures can deliberately cultivate this and it makes moral learning more flexible than guilt-based autonomy frameworks.

  the audience is mostly cultural anthropologists who study east asian moral systems and treat shame as basically hierarchical and oppressive, plus two analytic philosophers of emotion who are locked into the guilt-is-autonomy literature (they know Taylor and every western moral psych study). they care hard about autonomy, cultural imperialism, and whether im just romanticizing collectivism. 

  lay out the objections in the order they'll actually come, phrased like each group talks—anthros first then philosophers—ordered by how damaging they are. for each: how serious is it, what should i concede up front, my two-minute reply, and where that reply is softest. also include the question im praying nobody asks—probably something that forces me to distinguish horizontal shame from trauma responses or clinical social anxiety, but frame it so it actually targets my argument. keep it casual, im typing this on my phone so a typo or two is fine. don't ask me for citations or a reading list, i just need to survive the room.
