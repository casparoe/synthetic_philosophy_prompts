answer: |-
  ### Exam Question  
  **Critically evaluate whether Max Weber’s concept of ‘elective affinity’ successfully resolves the problem of treating cultural values as causes. Your answer must address the following tension: if economic structures are materially determined, how can the Protestant ethic retain explanatory power without violating the causal closure of the material domain? Construct a defensible middle position in which values function as non-causal explanatory factors. In doing so, avoid reducing Weber’s thesis to a simplistic idealist versus materialist debate.**

  ---

  ### Model Answer (798 words)  
  Weber’s Protestant ethic thesis—which posits an elective affinity between ascetic Protestantism and the spirit of modern capitalism—appears vulnerable to an exclusion problem. If material conditions fully determine economic structures (causal closure), then values either do no work (epiphenomenalism) or inexplicably override material causation (dualism). Neither outcome aligns with Weber’s dialectical method. However, interpreting elective affinity as a framework for *non-causal constitutive explanation* allows values explanatory relevance without violating materialism’s core premises. This resolves the tension by showing how cultural forces *selectively enable* material outcomes without acting as efficient causes.  

  The exclusion problem arises from assuming all explanation must be causal. If economic phenomena have sufficient material causes (e.g., technology, class struggle), then citing values as *additional* causes either renders them redundant or implies causal overdetermination. Weber’s critics often reduce elective affinity to this flawed causal model, accusing him of either idealism (values as primary causes) or inconsistency (smuggling in dualism). Yet Weber explicitly rejects direct causation: he describes affinity as a "meaningful correlation" emerging from interpretive sociology (*Verstehen*), not a law-like causal link (*Erklären*). His method distinguishes *understanding* motives from *explaining* outcomes. The Protestant ethic does not *trigger* capitalism; it makes certain capitalist practices *intelligible and sustainable* for historical actors.  

  Elective affinity navigates this by functioning constitutively. Protestant values—predestination, worldly asceticism—reconstituted the *significance* of profit-seeking. Material factors (e.g., trade routes, enclosures) created capitalist *opportunities*, but Calvinist doctrine transformed accumulation from moral suspicion into a vocational duty. This provided the cognitive and normative scaffolding for systematic capital reinvestment. Crucially, this is not efficient causation (A→B) but a *background condition* that shapes *how* material forces are actualised. Without this cultural matrix, early capitalism lacked the coherence to stabilise as a *system*. Affinity thus explains capitalism’s distinctive *form*, not its material genesis.  

  A selection-mechanism analogy clarifies this. Imagine material conditions as a landscape of possible economic practices. Protestantism did not *create* this landscape but acted as a cultural "filter" privileging practices aligned with its ethos (e.g., disciplined labour over conspicuous consumption). This filter *selected* certain material possibilities while rendering others inconceivable or illegitimate. Value-rational action (*Wertrationalität*) thereby constrained instrumental rationality (*Zweckrationalität*) within specific channels. Capitalism emerged not *because* of Protestantism but because Protestantism resolved coordination problems (e.g., legitimising inequality) that material conditions alone could not.  

  This avoids epiphenomenalism by granting values *explanatory indispensability*. While material causes generate capitalist structures, only values explain why these structures manifested as *spiritually regimented* capital accumulation in the West. Weber’s comparative method proves this: similar material conditions in China or India produced distinct economic ethics. Values thus have *explanatory autonomy*—they answer "why *this* outcome?" not "why *an* outcome?". Affinity’s explanatory power lies in mapping *contingent necessities*: given Protestantism’s dominance, its coherence with nascent capitalism was necessary for systematic development, though Protestantism itself was historically contingent.  

  Objections that constitutive dependence still violates causal closure misunderstand materialism. Material causes operate within culturally structured spaces of possibility. Protestant values did not inject new energy into economic systems; they reconfigured existing material relations into a self-reinforcing circuit. Weber’s later work on legitimacy reinforces this: domination requires material power *and* belief in its validity. Neither alone suffices.  

  In conclusion, elective affinity escapes the exclusion problem by redefining explanation. Values are not competing causes but constitutive elements in a historical gestalt. The Protestant ethic retains power by explaining capitalism’s *specific rationality*, not its material emergence. This middle position transcends idealism/materialism: culture shapes the *meaning* of material forces, while materialism sets the *boundaries* of cultural efficacy. Weber thus offers social science a third way—one where values explain through conditioning, not causation.  

  ---  

  ### Marking Scheme  
  **First-Class (70%+)**  
  - **Accurately frames the exclusion problem**: Clearly states that causal closure of the material domain threatens values with either redundancy (epiphenomenalism) or incoherence (dualism).  
  - **Distinguishes *Verstehen* from *Erklären***: Explains Weber’s interpretive sociology as separate from causal explanation; avoids conflating affinity with efficient causation.  
  - **Articulates non-causal explanatory mechanisms**: Develops *constitutive conditioning* (values as background frameworks shaping meaning/practices) or *selection mechanisms* (values as filters enabling/disabling material possibilities).  
  - **Defends explanatory autonomy**: Shows how values explain unique historical outcomes (e.g., capitalism’s "spirit") without rivalling material causes.  
  - **Synthesises a middle position**: Integrates materialism (causal closure intact) with cultural explanation (values as necessary non-causal factors).  
  - **Avoids key errors**: No conflation of affinity with sufficient causation; no retreat to idealism/materialism dichotomy.  

  **Upper-Second (60–69%)**  
  - **Identifies the exclusion problem** but may not fully articulate its logical structure (e.g., vague on causal closure).  
  - **Recognises affinity ≠ direct causation** but struggles to define its *positive* explanatory role (e.g., labels it "correlation" without theoretical grounding).  
  - **Attempts non-causal explanation** but lacks precision (e.g., vaguely references "context" or "influence" without mechanistic detail).  
  - **Acknowledges Weber’s anti-reductionism** but cannot fully reconcile it with materialism (e.g., asserts values "matter" without resolving causal tension).  
  - **Minor conceptual errors**: May occasionally lapse into causal language for affinity; superficial engagement with *Verstehen*; conflates constitutive roles with "weak causation".  

  **Deductions (Apply to Both Bands)**  
  - **−5–10%**: Treating elective affinity as sufficient cause (e.g., "Protestantism caused capitalism").  
  - **−5%**: Equating explanatory power with causal power (e.g., "if values explain, they must cause").  
  - **−5%**: Framing the problem *only* as idealism vs. materialism.  
  - **−5%**: Misdefining *Verstehen* as empathy or subjective intuition.  
  - **−10%**: Ignoring the exclusion problem entirely.  

  ---  
  **Exam Conditions Note**: Candidates are expected to answer using course materials only. No external sources permitted.
