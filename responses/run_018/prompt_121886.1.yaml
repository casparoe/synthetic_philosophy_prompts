answer: |-
  ## Bayesianism & Old Evidence: Can Calibration Drift Save the Day?

  **The Standard Bayesian Headache (≈140 words):**

  Bayesians update beliefs via conditionalization: seeing evidence E boosts your confidence in hypothesis H proportional to the likelihood P(E|H). But **old evidence** – E you *already knew* when formulating H – causes trouble. Your current degree of belief P(H|E) is *already* 1 (or very high), so formally updating on E again does nothing. Standard fixes involve imagining counterfactual credences *before* learning E (like Clark Glymour's objection) or calculating the *degree* to which E supports H *post-hoc* (like Colin Howson's appeal to logical relevance). Critics slam these as mere "bookkeeping" – clever accounting tricks that don't capture genuine belief revision triggered by *realizing* E supports H. The core problem: Bayesianism seems static for evidence already absorbed, failing the dynamism we associate with scientific confirmation using known data.

  **Calibration Drift to the Rescue? (≈200 words)**

  Your "diachronic calibration drift" framing offers a fresh escape hatch. If the *evidential meaning* of E shifts because our understanding of the instrument producing E has changed (we now reject its old error model), then the *likelihood itself* changes retroactively: P_old(E|H) ≠ P_new(E|H). **The old E isn't actually the *same* evidence anymore.** When we reassess the instrument's reliability, we aren't genuinely "updating on old E"; we're updating our model of the *source* that generated E. Discovering flaws in the instrument's past calibration means E might be *less* surprising (or surprising in a different way) under H than we originally thought. Bayesian updating kicks in naturally on this *new information about instrument reliability* (call it I). We calculate P_new(H | E & I), which can differ significantly from P_old(H | E). The force of E *itself* dissipates; the work is done by updating our trust in the measurement process. The "old evidence" becomes inert data; the genuine update is on the *shift in its evidential weight* due to I. Problem dissolved!

  **The Case Against: Drift Just Relocates the Problem (≈200 words)**

  Hold on. This just kicks the can down the road into **prior choice territory**. Deciding *which* past instrument error models to reject, and *how significantly* that alters P(E|H), involves deep historical and scientific judgment. How do we *probabilistically* model the discovery that a 19th-century thermometer had a systematic +2°C bias? Assigning P_new(E|H) requires:
  1.  **Modeling the Drift:** Quantifying the *precise* effect of the rejected error model on E – often highly uncertain.
  2.  **The "New" Prior:** Assigning P_new(H) *before* this reassessment of the instrument. But this P_new(H) is massively influenced by the *very same old evidence E* we're trying to demote! Our current belief in H (used to set P_new(H)) is built *on* the edifice of past evidence, including E. Disentangling E's influence from the prior is impossible. The subjectivity and path-dependence plaguing the standard old-evidence problem now infect the assessment of instrument reliability and the setting of the "new" prior. Drift doesn't eliminate the need for counterfactual reasoning; it buries it deeper in the murky waters of modeling historical scientific practice and justifying priors over instrument fidelity.

  **Verdict: Drift Transforms, But Doesn't Dissolve, the Problem (≈140 words)**

  Calibration drift **transforms the old-evidence problem significantly but does not dissolve it.** It brilliantly refocuses attention on the dynamic nature of evidence – old data *does* change meaning as our auxiliary theories (like error models) evolve. This makes a strong case that genuine Bayesian updating *can* occur on the *reassessment of the instrument's trustworthiness*, rendering the literal "old E" inert. **However, the core Bayesian dilemma of justifying the inputs (the "new" prior and the new likelihood model) remains.** Assigning probabilities to the impact of historical calibration drift and establishing a prior uncontaminated by the evidence in question is just as fraught, if not more so, than the original counterfactual maneuvers. Drift moves the problem from updating on E itself to justifying the update on I (the instrument reassessment), which carries the same burdens of historical judgment and potential circularity. It's a smarter framing, but the ghost of old evidence still haunts the priors.
