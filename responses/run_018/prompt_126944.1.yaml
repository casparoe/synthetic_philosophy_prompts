  - In the first coordinate, A is better (1<2)
  - In the second coordinate, B is better (0<1)
  So we cannot say which is closer.

  Similarly, A and C: 
  - A has first coordinate better (1>0? wait, 1>0 -> or |1-0|=1, |0-0|=0, so C is better in first coordinate? 
  Actually for C: (0,2) -> first coordinate error=0, second=2.
  A: (1,1) -> first=1, second=1.
  So 
  - first coordinate: C is better (0<1)
  - second coordinate: A is better (1<2)

  So again, no dominance.

  But then, if we ask students to rank, they might not be able to. This is the incommensurability.

  Then, the deadlock: they try to say that A is closer than B, and B is closer than C, and C is closer than A? But that's not the case.

  Miller showed that there can be cycles if we use the component-wise approach. 

  Example of a cycle:

  True: (0,0,0)
  A: (1,1,0)
  B: (0,1,1)
  C: (1,0,1)

  Then, comparing A to truth: (1,1,0)
  B to truth: (0,1,1)
  C to truth: (1,0,1)

  Now, compare A and B:
  - A has first coordinate worse than B (1>0)
  - A has second coordinate same as B (1=1)
  - A has third coordinate better than B (0<1)
  So mixed.

  But to get a cycle, we need a different example.

  From the literature: 
  True: (0,0)
  A: (1,1)
  B: (2,2)
  Then A is closer than B? But both coordinates of A are closer.

  But if we have:
  True: (0,0)
  A: (1,0) -> error (1,0)
  B: (0,2) -> error (0,2)
  C: (3,3) -> error (3,3)

  Then we cannot compare A and B. But no cycle.

  Example of intransitivity in three theories compared pairwise? Not necessarily in their distance to truth, but in their comparative verisimilitude.

  Miller's example (adapted): in three dimensions.
   True theory T: (0,0,0)
   Theory A: (1,1,0)
   Theory B: (1,0,1)
   Theory C: (0,1,1)

  Now, compare A and B:
  - A has coordinates (1,1,0)
  - B has (1,0,1)
  When compared to T=(0,0,0):
  - For the first coordinate: both have error 1.
  - For the second: A has error 1, B has error 0 -> B better.
  - For the third: A has error 0, B has error 1 -> A better.
   So mixed.

  We can try to say that A is verisimilar to B if every coordinate of A is closer to the truth than the corresponding coordinate of B. But then, for any two of these, it's not true.

   To have a cycle, we need a different definition.

   Actually, for the impossibility result, we don need a cycle, but an incommensurability.

   For the activity, we can have this set of theories and true state, and ask students to rank them. They will find it hard because there is no clear ranking. Then we reveal that this is the problem: with more than one dimension, we get incommensurable theories.

   Then, we can say that this is a simplified version of the formal deadlock.

   So the activity:

  Phase 1: Introduce the system.
  - The system is characterized by two continuous parameters (like the charge and mass of an electron, but abstract). Let's call them P1 and P2. The true values are (0,0). 
  - Each group will be given a theory ( a specific pair (a,b) for (P1,P2) ).

   We give each group a theory card:
   Group 1: (1,0) 
   Group 2: (0,1)
   Group 3: (1,1)

  Phase 2: Testing.
  - The groups can test their theory by choosing to measure either P1 or P2 (or both) but they only get the true value for what they measure. 
  - But since the true values are fixed, they will get:
     If they measure P1, they get 0.
     If they measure P2, they get 0.
  - So for Group 1 (theory (1,0)): 
     If they measure P1, they see 0 (theory says 1) -> incorrect.
     If they measure P2, they see 0 (theory says 0) -> correct.
  - Similarly for Group 2: 
     P1: correct, P2: incorrect.
  - Group 3: 
     P1: 0!=1 -> incorrect, P2:0!=1 -> incorrect.

   They get 1 point for each correct measurement.

   So scores:
   Group 1: 1 point ( if they measure both, they get one correct and one incorrect -> but let's say they can choose to measure one or both? And they want to maximize points? So they might choose to measure only the one they think is correct? But they don't know. So we can have them measure both. Then:
   Group 1: 1 correct out of 2.
   Group 2: 1 correct out of 2.
   Group 3: 0 correct.

  Phase 3: Truth-proximity ranking.
  - Now reveal the true theory: (0,0).
  - Ask each group to rank the three theories in order of proximity to the truth. They are to do this individually within their group.
  - They are told to consider both the number of correct predictions (from the test) and the content of the theory. Here, all theories have the same content (they specify both parameters) so content is the same. 
  - But the catch: we haven't defined how to aggregate the two dimensions. 
  - We expect that Group 1 will think that their theory is closer because it got one coordinate right, and similarly for Group 2. Group 3 might see both are wrong, but note that the error in each coordinate is 1, while for Group 1 and 2, one coordinate is perfect and the other is off by 1. So they might rank their own theory first, then the other group's, then Group 3 last.

   But then when we collect, we have:
   Group 1 ranks: [1, 2, 3] or [1, 2, 3] meaning (1,0) then (0,1) then (1,1)? 
   Group 2 ranks: [2, 1, 3]
   Group 3 might rank: [1,2,3] or [2,1,3] or even [3,?,?] unlikely.

   So we have a split: Group 1 and Group 2 each think their own is closest.

   Then, we ask: is (1,0) closer than (0,1)? They will see that it depends on how you aggregate. If you use Euclidean distance, both are 1. If you use Manhattan, both are 1. If you use component-wise, then (1,0) is better in P2, worse in P1, so no dominance.

   This is the incommensurability.

  Phase 4: Introduce a fourth theory to show intransitivity? (Optional) 
  - We can have a fourth group or just introduce it: 
     Theory D: (2,0) 
  - Then compare to Theory A: (1,0) and to Theory B: (0,1).
  - (2,0) has Euclidean distance 2, so worse than A (distance 1) and worse than B (distance 1). 
  - But if we try to aggregate component-wise, (2,0) is worse in P1 than A (2>1) and same in P2 (0=0), so worse. 
  - So no cycle.

   To show a cycle, we would need a more complex example, but that might be beyond.

   Alternatively, we can use a three-dimensional example and theories that are cyclic:

   Group 1: (1,1,0)
   Group 2: (0,1,1)
   Group 3: (1,0,1)

   True: (0,0,0)

   Then for each theory, the Euclidean distance is sqrt(2) for each.

   When comparing Group 1 and Group 2:
   - In coordinate 1: Group 1 has error 1, Group 2 has error 0 -> Group 2 better.
   - In coordinate 2: both error 1.
   - In coordinate 3: Group 1 error 0, Group 2 error 1 -> Group 1 better.
   So no dominance.

   And if we try to say that one is closer overall, it's hard.

   In the debrief, we then explain that in the formal setting, Miller and Tichý showed that for false theories, there is no way to define verisimilitude that does what we want (maximize true content and minimize false content) and is also transitive and respects the content ordering.

   What this activity can't reproduce: the full logical structure (consequence classes) and the formal proof. We have to supply that in the debrief.

   What will go wrong the first run? 
   - Students might try to game the proximity scores by only reporting the tests that make their theory look good. 
     Mitigation: require them to test both coordinates (in the two-dimensional example) or all in the three-dimensional. 
   - In the ranking, they might use Euclidean distance and then there's no split. In the two-dimensional example, (1,0) and (0,1) have the same Euclidean distance. So they might rank them as tied. Then we don't get the split. 
     To force a split, we can instruct them not to use any numerical distance, but to use their intuition about which theory is more like the truth. They might then think that their own theory is closer because it got one coordinate exactly right. 
     Or we can ask them: if you were to explain to a layperson, which theory is closer to the truth? 
     Or we can say: in science, a theory that gets one aspect exactly right might be considered closer than one that gets both aspects a little bit wrong, even if the numerical distance is the same.

  Materials for the two-dimensional example:
  - Cards for each group with their theory (e.g., Group 1: "P1=1, P2=0")
  - True system: (0,0) written on the board or revealed later.
  - Score sheets for the tests.

  Timeline:
  1. Introduction (5-10 min): Explain the system, the groups, and the task. Assign groups and theory cards.
  2. Testing phase (10 min): Groups decide which parameters to measure (they can measure one or both). Instructor reveals the true value for the requested parameters. They record and get points.
  3. Ranking phase (10 min): Reveal the true theory. Groups discuss and rank the three theories (1,0), (0,1), (1,1) from closest to farthest from the truth. They write their ranking on a card.
  4. Collect and compare rankings (5 min): Instructor writes the rankings of each group on the board. We see the split.
  5. Introduce the tension (5 min): Ask why they ranked as they did. They will mention getting one coordinate right and the other wrong. Then ask: is (1,0) closer than (0,1)? They will see it's not clear.
  6. Optional: Introduce a fourth theory (e.g., (2,0)) and ask where it fits. It should be farther by any measure.
  7. Debrief (20 min): Map to the verisimilitude problem. Explain that in science, we often have theories that excel in one area but fail in another. The formal results show that we cannot have a unified metric that respects both accuracy and content in a non-arbitrary way. Mention that the activity simplifies by not having the full logical structure of consequences, but the incommensurability in multiple dimensions is a symptom of the deeper issue.

  Honest about what it can't reproduce: 
  - We haven't captured the full logical strength of the theories (which in the formal setting is about the set of consequences). 
  - We haven't shown the intransitivity (which requires a more complex example) or the formal proof that no metric can satisfy the desired properties.

  This should fit in 90 minutes.

   Let me know if you have any adjustments.
