  ### In-Class Activity: Verisimilitude Deadlock Simulation  
  **Objective:** Make students experience the tension between a theory's *boldness* (high content, specific predictions) and *logical proximity* to truth, culminating in the realization that no consistent metric satisfies both goals.

  ---

  #### **Materials**  
  - **Black Box System**: 3 opaque bags labeled *A, B, C*, each containing hidden weighted objects (e.g., 10 dice with unknown biases, or 20 marbles with hidden color ratios).  
    - *Example Setup*:  
      - Bag A: Dice biased to roll 6 (70% of the time).  
      - Bag B: Marbles with 80% red, 20% blue.  
      - Bag C: Coin biased to land heads (60% of the time).  
  - **Prediction Sheets**: For groups to record theories and test results.  
  - **Scorecards**: Track prediction points and truth-proximity rankings.  
  - **Stopwatch/Timer**.  

  ---

  #### **Timeline** (Total: 70 minutes)  
  1. **Setup (5 min)**  
     - Divide students into 3 groups.  
     - Assign each group one bag (A, B, or C). Keep the weights/ratios hidden.  
     - Explain rules:  
       - Groups propose a **specific predictive "law"** for their bag (e.g., "Die rolls 6 with 80% probability").  
       - They earn points for **correct predictions** when testing their theory.  
       - Later, they rank **all groups' theories** (including false ones) by "truth-proximity."  

  2. **Phase 1: Propose and Test Theories (25 min)**  
     - **Step 1 (10 min)**: Groups propose a bold, specific law for their bag (e.g., "Bag A’s die rolls 6 with 75% probability").  
       - *Incentive*: Bold theories (high specificity) earn 2x points if predictions are correct.  
     - **Step 2 (15 min)**: Test predictions:  
       - Each group conducts 5 tests (e.g., roll their die 5 times, draw 5 marbles).  
       - **Scoring**:  
         - Correct prediction (within ±5% of observed frequency): **3 points**.  
         - Partially correct (within ±10%): **1 point**.  
         - Incorrect: **0 points**.  
       - *Example*: If Group A predicts 75% for die rolls but observes 70%, they get 1 point (within ±5%).  

  3. **Phase 2: Truth-Proximity Rankings (20 min)**  
     - Groups see all theories and prediction scores. The true laws remain hidden.  
     - **Task**: Rank all 3 theories (1st = closest to truth) based on:  
       - **Accuracy** (prediction points).  
       - **Boldness** (specificity of the proposed law).  
     - **Rules for Rankings**:  
       - Groups must defend their rankings.  
       - They cannot rank their own theory first unless objectively justified.  
     - *Expected Conflict*:  
       - Groups with bold, partly correct theories argue they’re "closer" (e.g., "We predicted 75% and got 70%—almost right!").  
       - Groups with cautious, vague theories argue they’re "logically safer" (e.g., "We said 60–80%—it’s more flexible and covers the truth").  

  4. **Phase 3: Consistency Check (10 min)**  
     - **New Task**: Apply the *same* proximity logic to 3 pre-written "trap theories" (instructor-provided):  
       - Trap 1: Bold but false ("Bag A’s die rolls 6 with 90% probability").  
       - Trap 2: Cautious and true ("Bag B’s marbles have 70–90% red"—vague but covers truth).  
       - Trap 3: Bold and true ("Bag C’s coin lands heads 60% of the time").  
     - Groups rank these traps using their proximity criteria.  
     - *Reveal the truth*: Show which traps are true/false.  

  5. **Debrief (20 min)**  
     - **Group Reports**: Each group shares rankings and reasoning. Highlight splits:  
       - *Boldness-focused groups*: Ranked high-content, partly correct theories above cautious ones.  
       - *Accuracy-focused groups*: Ranked vague theories higher for "covering" truth.  
     - **Instructor-Led Discussion**:  
       - Map arguments to **Popper’s verisimilitude tension**:  
         - Bold theories have **more content** (informative) but are **logically farther** if false.  
         - Cautious theories are **logically closer** (less falsifiable) but have **less content**.  
       - **Reveal Impossibility**:  
         - Formal results (Miller/Tichý) show no metric maximizes both content and logical proximity.  
         - Activity limitation: This simulation **can’t replicate the role of logical entailment**. In the real proof, a theory’s *consequences* (not just predictions) create unavoidable cycles or intransitivities (e.g., Theory A beats B, B beats C, but C beats A).  
       - **Key Insight**:  
         - Science values bold, informative theories—but they risk being *more wrong*.  
         - We can’t have it all: Content and safety are irreconcilable goals for false theories.  

  ---

  #### **Predictable Problems & Fixes**  
  - **Problem 1: Gaming Proximity Rankings**  
    - *Likely*: Groups rank rivals poorly to win.  
    - *Fix*: Require written justifications using shared criteria (boldness/accuracy). Penalize arbitrary rankings.  

  - **Problem 2: Overfitting in Testing**  
    - *Likely*: Groups adjust laws post-test to match results.  
    - *Fix*: Lock theories before testing; no revisions allowed.  

  - **Problem 3: Misunderstanding "Boldness"**  
    - *Likely*: Students equate boldness with complexity.  
    - *Fix*: Clarify: Boldness = specificity (e.g., "70% probability" vs. "60–80%").  

  ---

  #### **Why This Works**  
  - Students experience the **deadlock firsthand**: Bold theories *feel* closer due to partial accuracy, but cautious ones *are* logically safer.  
  - The **"trap theories"** expose metric inconsistency (e.g., a bold false theory ranked above a true cautious one).  
  - **No tech needed**: Uses bags, dice/marbles, and paper.  
  - **American English** in all instructions/debrief.  

  **Final Note**: The activity *simplifies* the formal deadlock—but the visceral debate over "closeness" sets up your lecture on why Miller/Tichý’s proof requires logic, not intuition.
