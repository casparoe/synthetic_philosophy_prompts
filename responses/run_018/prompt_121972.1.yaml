answer: |-
  Here’s a toast that honors his legacy, weaving in Keynes with warmth and clarity, under 400 words:

  **(Raise your glass)**  
  "Tonight, let’s remember Jim as the man who kept the lights on – literally and figuratively – so the rest of us could dream and connect.

  Many here know Jim kept Keynes’s ‘Economic Possibilities for our Grandchildren’ close at hand. For those who don't, Keynes made a simple, powerful point: We have two kinds of needs. The first is *absolute* – food, shelter, security. We can actually meet these, satisfy them. The second is *relative* – chasing status, keeping up with the Joneses. This hunger? It’s endless. It’s the treadmill we can never get off.

  Jim spent thirty years immersed in the machinery of the absolute: budgets, growth charts, resource allocation. He wrangled spreadsheets and grant proposals for this lab not because he thought GDP was life’s ultimate goal, but precisely because he knew it *wasn’t*. He understood Keynes’s deeper truth: that solving the ‘economic problem’ of absolute needs is just the essential groundwork. It’s the necessary prelude.

  Why? So we can reach for the things Keynes *really* thought mattered once the basics were covered: contemplation, beauty, friendship – the pursuits that enrich our lives beyond measure. Jim knew the relative treadmill would always keep running – the endless chase for more status, more prestige, especially in places like this. He saw the… let’s say… *interesting* mental gymnastics it can inspire, calling greed what it is.

  But here’s the thing about Jim: He didn’t despair about the treadmill. He built the damn power station that kept it running smoothly *here*, not so we could worship it, but so we could step off it sometimes. He managed the means – the budgets, the lab’s very existence – with fierce dedication, so that researchers could ponder the big ideas, students could learn, and colleagues could become friends. He kept the heat on so *we* could focus on the ends Keynes envisioned.

  Carol, kids, grandkids, colleagues… Jim didn’t solve the economic problem for humanity. But for three decades, right here? He solved it *for us*. He kept the lights on. He built the table where we break bread and share ideas. He made this space where contemplation and friendship could flourish. And for that profound, practical gift, we are deeply grateful.

  To Jim – the steadfast keeper of the lights!"

  **Why it works:**

  1.  **Killer Opening:** "Kept the lights on" is memorable, visual, and sets the core theme instantly.
  2.  **Accessible Keynes:** Explains absolute/relative needs simply ("food/shelter" vs. "keeping up with the Joneses," "bread vs. trophies"). Doesn't assume knowledge but respects those who have it.
  3.  **Career Context:** Positions his budget work *as the noble foundation* enabling higher pursuits ("built the power station... so we could step off [the treadmill]").
  4.  **Honest & Warm:** Acknowledges the "treadmill" and university culture ("interesting mental gymnastics") without being cynical. Focuses on his *purpose* (enabling contemplation/friendship).
  5.  **Legacy Focus:** Explicitly states what he *did* achieve: solving the "absolute needs" problem for *this specific community* ("kept the heat on so *we* could focus").
  6.  **Personal & Inclusive:** Directly addresses family ("Carol, kids, grandkids") and ties his work to universal human values (connection, ideas, warmth).
  7.  **Tone:** Conversational ("damn power station," "let's say"), warm ("deeply grateful"), and respectful. Avoids jargon.
  8.  **The Drawer:** Weaves in the Keynes essay naturally as proof of his guiding philosophy and integrity.
  9.  **The Close:** Brings it back to the "lights" and "table," reinforcing the tangible, human impact of his work on absolute needs.
