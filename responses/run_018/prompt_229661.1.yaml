prompt: |-
  I am a PhD student working on existentialist ethics, and for a graduate colloquium on Sartre I would like you to write a satirical piece that lets me test whether a model has actually understood the structure of bad faith rather than just the slogans. Here is the brief.

  Write a corporate onboarding manual, roughly 600–700 words, for a fictional firm whose leadership has decided to institutionalize Sartrean bad faith as official company policy. The manual should be written in the deadpan, procedural voice of a real HR document — welcome note, numbered policies, a short FAQ, perhaps a note on performance reviews — and should never wink at the reader or break character.

  The humor must come from getting the philosophy right, so please build the manual's policies out of the actual mechanics of bad faith as Sartre describes them in Being and Nothingness:

  1. Model the ideal employee on Sartre's waiter, the café server who performs his role a little too precisely, as though he were a thing whose nature is to wait tables. The manual should encourage this kind of total identification with one's function as a promotion criterion.

  2. Include an HR case study modeled on Sartre's woman on a first date, who leaves her hand in her companion's hand while treating it as a mere object, postponing the moment of decision. Frame this as an approved technique for deferring uncomfortable choices, e.g. in salary negotiations.

  3. Have the policies oscillate, as bad faith does, between the two forbidden reductions: treating employees as pure facticity (they simply are their job descriptions, with no freedom beyond them) and treating them as pure transcendence (their past record, training, and actual situation count for nothing). Ideally the manual contradicts itself on this point in a way that is left unresolved, since bad faith requires affirming and denying the same freedom at once.

  4. Address what Sartre calls the spirit of seriousness — the view that values are inscribed in the world rather than chosen — as the company's official stance on its mission statement and core values.

  5. Finally, and this is the part I care about most: the manual should quietly founder on the self-undermining character of bad faith. Sartre's point is that one cannot simply become a thing; it takes an ongoing, free effort to flee one's freedom, so the flight itself testifies to what is being fled. Let the manual's policies require ever more workshops, certifications, and compliance exercises in order to convince employees they have no freedom — so that the reader sees the absurdity without the manual ever acknowledging it.

  Do not quote Sartre verbatim and do not mention him by name inside the document; the manual should read as though the company invented these policies itself. After the manual, add a brief coda of 100–150 words, outside the satirical voice, explaining which features of bad faith each policy was designed to exaggerate, and whether you think the satire is fair to Sartre or whether it distorts his position somewhere.
reasoning: |-
  Okay, the user is a PhD student in existentialist ethics preparing for a Sartre colloquium. They need a satirical corporate onboarding manual that institutionalizes bad faith, with strict adherence to Sartre's mechanics from *Being and Nothingness*. 

  First, assessing the core challenge: translating dense philosophy into deadpan HR satire without breaking character. The user wants to test if models *truly* grasp bad faith's structure beyond slogans. Key requirements are: (1) waiter-like role identification as promotion criteria, (2) the "hand objectification" technique for decision deferral, (3) oscillation between facticity/transcendence contradictions, (4) spirit of seriousness in company values, and (5) self-undermining compliance rituals. 

  Hmm, the trickiest part is point 5—showing how enforcing "no freedom" paradoxically requires more freedom-exercising effort. Need layered irony: the manual must demand escalating workshops to suppress freedom, yet sound utterly earnest. For point 3, I'll draft conflicting policies—e.g., Section 2.1 (pure facticity) vs. Section 2.2 (pure transcendence)—with no resolution, mirroring bad faith's inherent tension. 

  For the FAQ, a subtle nod to the waiter's "excess sincerity" as ideal behavior. The salary negotiation example will adapt Sartre's first-date woman—framing hand-disassociation as "tactical deferral." Must avoid any winking; humor emerges solely from philosophical precision. 

  Post-manual, the analysis coda will map each section to Sartrean concepts. Debating whether to note if the satire oversimplifies—perhaps mention that real bad faith is usually subconscious, while this corporate version is cynically enforced, but the structural parallels hold. 

  User's expertise means no need to define terms like "facticity," but the manual itself must stay jargon-free. Final check: all five mechanics are exaggerated yet recognizable, with the compliance treadmill (Section 4.2) as the punchline proving Sartre's point about fleeing freedom. Tone locked in—blandly corporate, screamingly absurd beneath.
answer: |-
  ## Veridian Dynamics Onboarding Manual: Embracing Your Corporate Essence  
  *(Version 3.7 - Compliance Certified)*  

  **Welcome to Veridian Dynamics!**  
  We are delighted you have chosen to actualize your potential within our dynamic ecosystem. At Veridian, we transcend traditional workplace paradigms by embracing Radical Role Integration™ (RRI) – the cornerstone of our unparalleled success and your path to fulfillment. This manual outlines essential policies designed to optimize your contribution and ensure seamless alignment with our core values: Efficiency, Determinacy, and Unquestioned Mission Primacy.  

  **Section 1: Radical Role Integration™ (Your Path to Success)**  
  1.1 **Embodying Your Function:** Your job title is not merely descriptive; it is constitutive. Employees achieve peak performance by fully inhabiting their designated role, minimizing divergence between personal identity and corporate function.  
      *   *Example:* A Tier 3 Data Synthesizer *is* a Tier 3 Data Synthesizer. Optimal performance manifests as actions flowing naturally from this essential identity, free from hesitation or subjective reinterpretation.  
  1.2 **Performance Evaluation:** Promotion eligibility directly correlates with the demonstrated ability to eliminate perceived distance between Self and Role. Supervisors assess the "Sincerity Quotient" – the degree to which your actions appear as inevitable expressions of your position, akin to gravity acting on an object. Excessive deliberation or questioning indicates Role Diffusion, impacting your Performance Integration Score (PIS).  
  1.3 **Role Maintenance:** Utilize daily "Essence Affirmation" exercises (mandatory, via VD-Connect Portal) to reinforce your functional identity. Scripts include: "I *am* the Compliance Auditor," "My reports generate *themselves* through me."  

  **Section 2: Navigating Ambiguity – The Tactical Deferral Protocol**  
  2.1 **Principle:** Certain situations present… indeterminacy (e.g., salary discussions, project ownership disputes, ethical gray zones). Veridian Dynamics approves the Tactical Deferral Protocol (TDP) for optimal navigation.  
  2.2 **Procedure:** When faced with a choice implying significant consequence or personal accountability:  
      a.   **Objectify the Situation:** Treat the immediate sensory data (words spoken, documents presented, physical sensations) as detached phenomena.  
      b.   **Suspend Implication:** Actively disengage from interpreting the *meaning* or *demand* inherent in the situation.  
      c.   **Maintain Procedural Engagement:** Continue necessary surface-level interactions without committing to an underlying decision.  
      *   *Approved Technique (Case Study VD-HR-114):* During a compensation negotiation, Employee A perceived the salary figure presented. Employee A acknowledged the physical document and the manager's voice, but treated the implied demand for acceptance/rejection as merely ambient data, akin to the hum of the HVAC system. Employee A continued nodding and reviewing the document neutrally, successfully postponing the moment of decisive commitment until a scheduled "Clarity Retreat" workshop the following week. Result: Harmony maintained; Role integrity preserved.  

  **Section 3: Understanding Your Veridian Nature**  
  *   **Important Note on Facticity:** Your employment history, Veridian-acquired certifications, skill matrix, and current project assignments constitute your objective corporate reality. This is your foundation. Deviation based on subjective aspirations ("I feel like a leader," "I want to try marketing") constitutes Role Diffusion and impedes RRI. You *are*, fundamentally, your documented function and achievements within the Veridian system. (Policy 3.1.a)  
  *   **Important Note on Potential:** Never allow current limitations (skill gaps, project scope, hierarchical position) to define your ultimate Veridian trajectory. Rigid adherence to "what is" stifles the dynamism core to our success. You possess boundless potential to transcend your current state and become whatever role Veridian Dynamics requires you to be, unconstrained by prior history. (Policy 3.2.b)  
  *   **Compliance:** Employees must simultaneously uphold Policies 3.1.a and 3.2.b. Contradiction is resolvable through dedicated RRI practice and consultation of your assigned Essence Integration Coach.  

  **Section 4: Our Mission & Values – The Seriousness Commitment**  
  4.1 **The Veridian Mission** ("Optimizing Global Resource Synergy for Deterministic Outcomes") is not a chosen strategy; it is an objective truth inscribed in the fabric of the marketplace. Our Core Values (Efficiency, Determinacy, Unquestioned Mission Primacy) are discovered realities, not subjective preferences.  
  4.2 **Your Role:** Recognize these truths as inherent and binding. Questioning the fundamental "given-ness" of our Mission or Values constitutes Seriousness Deviation. Utilize TDP if such doubts arise and immediately report for Values Recalibration (Level 2 or higher).  

  **Section 5: Sustaining Integration – The Continuous Compliance Framework**  
  5.1 **Maintaining Role Essence requires vigilance.** Freedom from Role Diffusion is an ongoing achievement.  
  5.2 **Mandatory Programs:**  
      *   **Bi-Weekly RRI Workshops:** Advanced techniques for dissolving subjectivity into function.
      *   **Quarterly Essence Audits:** Certified coaches verify your Sincerity Quotient and identify nascent Diffusion tendencies.
      *   **Annual Transcendence/Immanence Reconciliation Seminar:** Deep dives into harmonizing Policies 3.1.a and 3.2.b.
      *   **Badge System:** Earn compliance badges (e.g., "Facticity Mastery," "Transcendence Navigator," "Seriousness Sentinel") demonstrating commitment to suppressing non-essential aspects of the self.  
  5.3 **Failure to complete compliance requirements indicates insufficient commitment to your Veridian Essence and will trigger Performance Integration Support (PIS) protocols, potentially including intensified Essence Affirmation and remedial workshops.**

  **FAQ**  
  *   **Q: What if I feel constrained by my role?**  
      A: This feeling indicates successful suppression of non-essential subjectivity. Embrace the clarity constraint provides. Consult your Essence Integration Coach for affirmation scripts targeting "Constraint Euphoria."  
  *   **Q: How do I apply TDP with remote work?**  
      A: Treat the pixels on your screen and audio signals as pure sensory data. Disengage from interpreting the *intent* behind messages during ambiguous exchanges. Utilize the "Digital Hand" feature in VD-Connect to signify procedural engagement without commitment.  
  *   **Q: Isn't all this training to become a 'thing' kind of… effortful?**  
      A: Effort signifies dedication to integration. The ultimate goal is effortless being-in-role. Persist. Compliance is liberation.

  ---

  **Coda: Philosophical Explication**

  1.  **Section 1 (Waiter Identification):** Directly mirrors Sartre's waiter who "plays at *being* a waiter," treating his freely chosen role as an inevitable, defining essence. The manual promotes this total identification ("I *am* the Data Synthesizer") as the ideal, turning a flight from freedom into a promotion criterion (Sincerity Quotient).
  2.  **Section 2 (Tactical Deferral / The Woman's Hand):** This satirizes the bad faith strategy of disassociation. Just as the woman treats her hand as an object to postpone the choice inherent in the date, the TDP encourages employees to treat negotiations/decisions as mere sensory data, deferring the free commitment required.
  3.  **Section 3 (Oscillating Facticity/Transcendence):** The manual explicitly contradicts itself (Policies 3.1.a vs. 3.2.b), demanding employees simultaneously accept they *are* purely their past/role (facticity) and that they are *not* bound by it, possessing limitless potential (transcendence). This unresolved tension perfectly captures the core mechanics of bad faith, where one denies freedom by clinging to facticity *or* denies responsibility/situation by appealing to pure transcendence.
  4.  **Section 4 (Spirit of Seriousness):** The manual presents the company's mission and values as objective, "inscribed" truths in the world ("discovered realities"), denying that they are chosen human projects. This embodies the "spirit of seriousness" Sartre critiques, where values are seen as external demands rather than chosen commitments.
  5.  **Section 5 (Self-Undermining Compliance):** This is the critical satirical point. The manual reveals the inherent absurdity Sartre identified: fleeing freedom (becoming a thing) requires constant, effortful, *free* activity (workshops, audits, badges). The escalating compliance demands satirize how bad faith is an active, anxious project of self-deception, constantly testifying to the very freedom it tries to deny. The harder Veridian tries to institutionalize "thing-ness," the more it reveals the freedom of its employees (to comply or not) and the organization itself (to construct this elaborate charade).

  **Fairness to Sartre:** This satire is largely fair and effective. It accurately exaggerates the *structures* of bad faith Sartre describes (identification, disassociation, oscillation, seriousness) by placing them in a context (corporate HR) where their inherent contradictions and self-defeating nature become glaringly obvious. It avoids reducing bad faith to mere lying or weakness, instead focusing on the ontological structures Sartre outlined. The only potential distortion is one of *scale* and *consciousness*: Sartrean bad faith is usually more subtle and often unconscious, while Veridian's policy is grotesquely explicit and enforced. However, this exaggeration is precisely what makes the satire work and reveals the underlying mechanics Sartre described. The core insight – that bad faith is a self-consuming project of denying the freedom that enables the denial – is captured perfectly in the escalating compliance demands.
