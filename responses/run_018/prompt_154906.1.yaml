answer: |-
  Here is the analysis reconstructed entirely within your scaffold-and-calibration framework and institutional-economics terminology:

  ---

  ### **German Folk Morality: Institutional Reconstruction**
  - **Moral Authority**: Rooted in **Layer A (deontic scaffolding)** as the primary coordination technology. Authority derives from *mechanism stability*: predictable, externally verifiable rules reduce transaction costs and ensure replicable outcomes across preference states. The scaffold’s independence from individual preferences is its legitimacy claim.  
  - **Cooperation**: Achieved through **rule-bound mechanism design**. High-compliance equilibria emerge from clear, non-negotiable scaffolds (e.g., formal procedures, codified norms), minimizing preference-revelation costs. Cooperation is modeled as a *common-pool resource management* problem: rules prevent defection by eliminating discretionary gaps.  
  - **Failure Mode**: **Calibration-error accumulation in Layer B**. When agents over-rely on Layer A, calibration mechanisms atrophy, causing *bureaucratic rigidity*—a failure to adapt rules to changing resource constraints or preference landscapes. This is framed as a *dynamic inconsistency*: uncalibrated scaffolds lose efficiency when external enforcement cannot cover all contingencies.  

  ### **American Folk Morality: Institutional Reconstruction**  
  - **Moral Authority**: Resides in **Layer B (conscience calibration)** as the core governance mechanism. Authority stems from *incentive-compatibility*: moral intuition aligns behavior with latent preferences, reducing monitoring costs. The scaffold (Layer A) is legitimate only when *preference-revealing*, i.e., validated by Layer B’s judgment.  
  - **Cooperation**: Enabled by **preference-sensitive calibration**. Agents use internalized norms to resolve collective action problems through *conscience-driven revelation*, avoiding rigid scaffolds that might force inefficient allocations. Cooperation is optimized when rules are *incentive-compatible* with diverse preference states.  
  - **Failure Mode**: **Preference-revelation failure in Layer B**. Unchecked calibration invites *arbitrary subjectivism*—agents misreport preferences (intentionally or via cognitive bias) or defect under moral cover. This manifests as *mechanism instability*: without robust scaffolds, coordination collapses when calibration thresholds (e.g., shared norms) are unmet.  

  ---

  ### **Residue Report**  
  **1. Clean Translations**  
  - Rule-following (German) → *High fixed costs in scaffold maintenance, low marginal costs in enforcement*.  
  - Conscience primacy (American) → *Low ex-ante commitment costs, high ex-post revelation costs*.  
  - Bureaucratic rigidity → *Calibration-error accumulation under high-scaffold institutional equilibria*.  
  - Arbitrary subjectivism → *Preference-revelation failure under low-scaffold, high-calibration equilibria*.  
  - "Durable cooperation" (German claim) → *Mechanism stability in repeated games with fixed rules*.  
  - "Pathological over-compliance" (American critique) → *Deadweight loss from non-adaptive scaffolds*.  

  **2. Distorted Translations**  
  - **Collective honor (German)**: Treated as a *common-pool resource* where adherence signals reliable preference revelation, reducing verification costs. *Distortion*: Honor’s emotional weight is reduced to a cost-saving signal.  
  - **National character**: Framed as *institutional path dependence*—historical calibration/scaffold investments create self-reinforcing equilibria. *Distortion*: Teleological "character" narratives become mere equilibrium selection.  
  - **Readiness to override rules (American)**: Modeled as *pareto-improving recalibration* when scaffolds conflict with revealed preferences. *Distortion*: Moral courage is recast as efficiency-seeking behavior.  

  **3. Untranslatable Residues**  
  - **Moral authority’s intrinsic worth**: Claims that scaffolds (German) or conscience (American) have *non-instrumental* value (e.g., "duty for duty’s sake," "inviolable conscience") lack institutional counterparts. These are *normative primitives*—authority is axiomatic, not derived from cooperation efficiency.  
  - **Normative superiority arguments**: Assertions that one system is "more moral" cannot be expressed as comparative statics without importing external ethics (e.g., scaffolding’s "justice" vs. calibration’s "authenticity").  

  **Evaluative Contentions as Comparative Statics**:  
  - *Rule-following → durable cooperation*: Expressible as higher *cooperation resilience* under shock scenarios when calibration variance is high.  
  - *Conscience judgment → prevents over-compliance*: Modeled as *adaptive efficiency gains* when preference landscapes are volatile.  
  - **But**: Claims about *moral truth* (e.g., "rules embody objective duty," "conscience accesses deeper morality") require exogenous psychological/metaphysical commitments. The framework can only compare *functional performance* (e.g., transaction cost minimization, equilibrium stability), not moral validity.  

  ---

  ### **Verdict**  
  The untranslatable residue points chiefly to the presence, in the folk-moral debate itself, of commitments about non-instrumental moral authority that are not institutionally operationalizable.
