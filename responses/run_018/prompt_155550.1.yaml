answer: |-
  Here’s a ruthlessly prioritized agenda for 3 years with no lab budget, cutting through noise to target **high-leverage, tractable questions** that reshape downstream debates. Focus on **upstream conceptual pivots** and **practical implications**, ignoring settled or low-impact terrain:

  ### 1. **Core Priority (Year 1-2): Ditch the Ontology War & Attack "Phase Transitions" as the New Organizing Framework**  
     - **Why upstream?** Essentialism vs. relationalism is a dead end. It’s trapped in semantic loops about "what species ARE," while phase transitions shift focus to **"how speciation dynamics WORK"** (thresholds, stability landscapes, critical points). This *bypasses* ontology by making it irrelevant: whether boundaries are "real" matters less than predicting when/why lineages diverge or merge.  
     - **Tractability:** Use existing genomic/ecological datasets (public repositories like NCBI, GBIF) + mathematical modeling (e.g., adaptive dynamics, network theory). No new data needed—reanalyze hybrid zone studies or microbial HGT networks through this lens.  
     - **Shaky but productive:** Critics will say this is "just metaphor." *Counter:* Demonstrate predictive power. Model how gene flow collapse (e.g., via niche specialization) mimics phase shifts in physics. If you can pinpoint transition parameters (e.g., fitness valley depth), ontology becomes descriptive, not foundational.  
     - **Downstream impact:** Reshapes debates on HGT/microbes (transitions are reversible? multi-scalar?) and hybrid zones (transient vs. stable states).

  ### 2. **Secondary Priority (Year 2-3): Crush the "Conservation Problem" by Decoupling Policy from Metaphysics**  
     - **Why now?** Conservation’s reliance on species counts *is* flawed—but not because species aren’t "real." The crisis is **operational**: current units don’t capture adaptive potential or ecosystem function.  
     - **Tractability:** Analyze policy documents (CITES, IUCN criteria) and conservation genetics literature. Propose *functional units* (e.g., "evolvably distinct lineages" defined by genomic redundancy + niche breadth) using public genomic data.  
     - **Shaky but vital:** Purists will scream "slippery slope!" *Counter:* Show that policy already uses pragmatic proxies (e.g., ESUs). Argue that phase transition thresholds (Priority 1) can define "conservation units" with quantifiable resilience.  
     - **Downstream impact:** Forces biology to supply better tools for policy instead of wringing hands over metaphysics. Makes your work directly relevant.

  ### 3. **Drop Immediately (Zero Years):**  
     - **Essentialism vs. relationalism:** Stuck in 20th-century framing. Nothing left to mine.  
     - **"What is a species?" debates in macrobes:** Circular. New empirical work (e.g., genomics) just gets slotted into old categories.  
     - **Resolving HGT’s impact on "species" ontology:** Intractable without wet labs. Focus instead on how HGT *changes transition parameters* (e.g., can horizontal transfer prevent divergence thresholds?).

  ### Why This Works:  
  - **Phase transitions** upstream of everything: Solves the microbial/macrobial divide by focusing on dynamics, not definitions. Hybrid zones become case studies for "incomplete transitions."  
  - **Conservation practicality** leverages your constraints: No budget needed—critique and redesign *existing frameworks* with public data.  
  - **Dropped debates** free up energy: Their resolution changes nothing. Even if essentialism "wins," we’d still need phase transition models to predict biodiversity.  

  **Honest Gaps:** The phase transition analogy risks overextension. Does "criticality" in gene networks truly map to physics? Test this by modeling speciation as a percolation problem—if it fails, you’ve still advanced the field by identifying dynamical bottlenecks. Conservation policy is political; your units may be ignored. But supplying *better* tools is still progress.  

  **Execute:** Build agent-based models (Python, NetLogo) simulating divergence under gene flow/HGT. Mine hybrid zone genomics for transition signatures. Draft "Conservation Thresholds" white papers by Year 3. **This agenda makes ontology obsolete, forces empiricists to engage your framework, and rescues conservation from metaphysical baggage.**
