  I'm giving the toast at my best friend's wedding occassion this saturday. She's a philosopher who wrote her dissertation on Russell's Marriage and Morals — the actual book, not the cartoon version where he's just the "free love" guy. She cares about his distinction between marriage as an economic contract (property, inheritance, social control) and marriage as a companionate partnership built on sexual equality and honest feeling. The couple lived together for eight years, were open about past relationships, and are only now getting legally married for visa reasons — so the speech shouldn't pretend they're traditional, but it also shouldn't make grandma think they don't take commitment seriously. Half the room are philosophers who will wince if I misrepresent Russell; the other half are family who think he was just a scandalous atheist trying to destroy families. I need about five minutes that uses Russell's framework — especially his claim that jealousy is usually a product of ownership mentality, not love — to frame their choice as deeply serious rather than casual. Please write it warm, slightly funny, and don't turn it into a lecture. No citations needed, I just want the text. Also avoid saying he was "against marriage" since that's not quite right — he was against the legal coercion part.
