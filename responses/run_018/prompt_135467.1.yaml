  Okay, the user needs a wedding toast for their best friend, who's a philosopher specializing in Russell's "Marriage and Morals." The challenge is balancing two audiences: philosophers who know Russell's work and family members who might view him negatively. The couple isn't traditional—they've lived together for eight years and are marrying for visa reasons—but the toast must affirm their seriousness without alienating anyone. 

  First, I need to capture Russell's core ideas accurately: marriage as economic contract vs. companionate partnership, jealousy as ownership mentality, and his nuanced stance (not anti-marriage but anti-coercion). The humor must be gentle—no inside jokes that exclude half the room. Warmth is key; this is a celebration, not a lecture. 

  Grandma's comfort level matters. Words like "scandalous" or "free love" are landmines. Instead, I'll emphasize Russell's advocacy for honesty and equality—universal values that bridge the philosopher/family divide. The visa practicality can be framed as them choosing legal recognition *after* proving commitment, which subtly defuses the "casual" perception. 

  Structure-wise: open with personal warmth, introduce Russell lightly, contrast his two marriage models, apply it to the couple's journey (highlighting equality and lack of jealousy), then pivot to their visa decision as intentional—tying it back to commitment. Close with traditional well-wishes to ground it. 

  Biggest risk is misrepresenting Russell. I must avoid saying he was "against marriage" and instead stress his critique of *institutional* flaws. The jealousy point is perfect—it shows their maturity without sounding radical. Testing phrases: "companionate partnership" (safe), "ownership mentality" (accurate but needs softening), "visa paperwork" (lightens the mood). 

  Final check: Does this let philosophers nod while keeping grandma teary? Yes—by focusing on the couple's lived values, not theory. The toast becomes a mirror of their relationship: thoughtful but full of love.
