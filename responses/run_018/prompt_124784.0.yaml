  ### Art Eligibility Decision Procedure  
  Based on your criteria, this procedure evaluates proposals in **3 sequential steps**. Hard stops occur at Steps 1 and 2 if criteria fail. Step 3 requires human judgment when evidence is ambiguous.  

  **Key Definitions**  
  - **Breaking Functional Categorization**: The work must repurpose materials/actions to disrupt their ordinary use (e.g., a laundry basket becomes sculpture, not storage).  
  - **Art-World Precedent**: Validation from ≥1 recognized institution/practice (e.g., museum exhibit, art journal, academic curriculum), **not** solely the artist’s assertion.  

  ---

  ### PROCEDURE  
  #### **Step 1: Intentionality Check**  
  - **Question**: Does the proposal explicitly frame the work as an intentional artistic presentation?  
  - **Sufficient Answer**: Written declaration of artistic intent (e.g., "this is an art installation/performance").  
  - **Stop Condition**:  
    - **Hard NO** if absent (e.g., "this is a functional bus shelter").  
    - **Proceed to Step 2** if present.  

  #### **Step 2: Functional Disruption Check**  
  - **Question**: Does the work force viewers to see its materials/actions outside their everyday utility?  
  - **Sufficient Answer**:  
    - **YES**: Objects/actions are non-functional or recontextualized (e.g., baskets stacked as sculpture; trash-sorting as ritual).  
    - **NO**: Objects/actions retain practical use (e.g., a shelter protecting from rain).  
  - **Stop Condition**:  
    - **Hard NO** if **NO** (work is primarily functional).  
    - **Proceed to Step 3** if **YES** or **AMBIGUOUS**.  

  #### **Step 3: Art-World Precedent Check**  
  - **Question**: Is there documented evidence of similar work being treated as art by a recognized institution/practice?  
  - **Sufficient Answer**:  
    - **YES**: Verifiable reference (e.g., "similar work was exhibited at [gallery]" or "discussed in [art journal]").  
    - **NO**: Only the artist’s assertion or no evidence.  
    - **AMBIGUOUS**: Evidence exists but is debatable (e.g., obscure blog; contested similarity).  
  - **Stop Condition**:  
    - **YES** if evidence is clear and credible.  
    - **Hard NO** if evidence is absent.  
    - **HAND TO HUMAN** if **AMBIGUOUS** (requires values-based judgment on source legitimacy/similarity).  

  ---

  ### Where the Procedure Fails or Misfires  
  - **Misfires**:  
    - Rejects **highly original art** lacking precedent due to obscurity.  
    - Accepts **derivative/unremarkable work** with strong precedent.  
    - Misreads **subtle functional disruption** (e.g., a beautiful shelter *might* disrupt if color triggers non-utility associations).  
  - **Flat-Out Unsolvable Cases**:  
    - **"Is this *good* art?"** → Quality is irrelevant per your criteria.  
    - **Conceptual controversies** → e.g., "Is invisible/undocumented work *art*?" requires philosophical debate.  
    - **Emergent practices** → Precedent may not exist for radical/new forms.  
    - **Cultural disputes** → What counts as "recognized" art-world validation (e.g., folk traditions vs. academia).  

  ---

  ### Evaluation of Proposals  
  #### **Proposal 1: Stacked laundry baskets with plaque**  
  - **Step 1**: YES (plaque declares "installation").  
  - **Step 2**: YES (baskets are stacked sculpturally; no longer used for storage).  
  - **Step 3**:  
    - Likely YES (precedent: readymades like Duchamp’s *Fountain*; minimalism like Carl Andre’s bricks).  
    - **VERDICT: ACCEPT** (clear precedent).  

  #### **Proposal 2: Beautiful bus shelter (functional)**  
  - **Step 1**: YES (architect declares artistic intent).  
  - **Step 2**: **NO** (shelter is fully functional; color alone doesn’t break utility).  
  - **Stop**: **HARD NO** at Step 2.  
  - **VERDICT: REJECT**  
    - **Why you’ll hate this**: It’s aesthetically valuable but fails your functional-disruption requirement.  

  #### **Proposal 3: Silent trash-sorting with no record**  
  - **Step 1**: YES (performer declares it art).  
  - **Step 2**: AMBIGUOUS → Proceed to Step 3.  
    - Sorting trash *could* disrupt function if framed as ritual (e.g., relabeling "waste" as "artifact").  
    - BUT: No audience/documentation weakens disruption (public sees only utility).  
  - **Step 3**:  
    - Precedent: Performance art (e.g., Marina Abramović) validates ephemeral acts.  
    - **AMBIGUITY**: No proof it occurred; similarity to documented works is debatable.  
  - **VERDICT: HAND TO HUMAN**  
    - Requires judgment: Is the performer’s claim + generic precedent sufficient without proof?  

  ---

  ### Critical Limitations  
  **This procedure cannot settle**:  
  - **Ontological debates** (e.g., "Can art exist without an audience?").  
  - **Precedent legitimacy** → Human must decide if a source (e.g., an online zine) is "recognized."  
  - **Functional ambiguity** → Human must interpret if disruption occurs (e.g., is a "beautiful shelter" *merely* functional?).  
  **Recommendation**: For Step 3 ambiguities, consult an art advisor if time permits. Your 15-minute limit risks false negatives for radical work.
