prompt: |-
  I am in the middle of writing a novel about moral decision-making under conditions of radical uncertainty, and I have become preoccupied with a specific pattern that recurs both in my characters' reasoning and in my own reading—though I do not know whether philosophy has already named it. The pattern is this: an agent faces a choice that pits her immediate interests or emotional attachments against some distant or collective good—imagine a physician who discovers that a profitable treatment is subtly harmful, or a citizen asked to support a policy that will diminish her own welfare for the sake of strangers. Instead of weighing the options from her present, flawed perspective, she constructs an idealized counterpart—one endowed with perfect information, liberated from fear, and, crucially, possessed of the very moral virtues that her present self lacks. She then asks what this counterpart would choose, and she treats that hypothetical decision as normatively binding upon her actual self, not as a distant aspiration but as an immediate obligation. The authority she grants to this counterfactual choice is peculiar: she does not claim she can become that self, she does not treat the exercise as mere information-gathering, and she applies it even when the virtues built into the idealization are themselves contested—when, for instance, the relevant virtue might be impartiality or loyalty, and the decision itself concerns which of those should prevail.

  This move seems to sit near discussions of indirect normativity and idealized deliberation, yet I think it differs from both the standard contractarian procedure, in which hypothetical agreement establishes justice, and from simple ideal-observer theories, in which the observer is epistemically improved but not necessarily morally transformed. I want to know whether this exact configuration—binding one's present self to the choice of a morally idealized, counterfactual self—has an established philosophical designation, and if so, precisely how it relates to indirect normative structures and to models of deliberation that proceed through idealization. Should I understand it as a variant of indirect normativity in which the norm applies through a projected self rather than through a rule? Or is it something closer to a rhetorical device disguised as reasoning? If no precise term exists, please do not merely list neighboring concepts; instead, take a definite position, propose a rigorous name and definition with clear boundary conditions, and defend that classification against the alternatives—distinguishing it, in particular, from direct consequentialist calculation, from aspirational self-improvement, and from the kind of rational reconstruction that assumes only epistemic correction. Please avoid bibliographic recommendations or lists of further reading; I am asking for a committed philosophical judgment, not a survey.
reasoning: |-
  Okay, this is a fascinating and intricate philosophical query. The user is writing a novel about moral decision-making under radical uncertainty and has observed a specific pattern in their characters' reasoning: constructing an idealized self with perfect information and moral virtues to make binding decisions for their present self. 

  First, I need to unpack the core elements of this pattern: 
  - The agent creates a counterfactual self endowed with epistemic perfection (complete information, no cognitive biases) AND moral transformation (possessing virtues the real self lacks).
  - This idealized self's decision is treated as immediately obligatory, not aspirational.
  - The authority granted is peculiar because it bypasses both direct calculation and gradual self-improvement.
  - The virtues built into the idealization are often contested (e.g., impartiality vs loyalty).

  The user explicitly rejects common frameworks: it's not contractarian (no mutual agreement), not standard ideal-observer (which focuses only on epistemic improvement), and not mere aspiration. They want to know if this has a name or should be classified as a distinct concept.

  Hmm... diving into philosophical taxonomy:
  - Kantian categorical imperatives are about universalizability, not personalized ideal selves.
  - Humean sympathy models are about emotional alignment, not binding authority.
  - Ideal-observer theories (Firth, Smith) lack the moral transformation aspect here.
  - Contractarian models (Rawls) rely on mutual disinterest, not personal virtue projection.

  The closest existing concept might be Michael Smith's "rational self" in *The Moral Problem*, but even that focuses on coherence of desires under full rationality, not infused virtues. This seems more radical—it's morally transformative.

  Ah! The key differentiator is the *binding authority* despite the real self's inability to achieve the ideal. That's what makes it distinct from aspirational ethics. The user's physician example clarifies: the doctor doesn't think "I should become impartial," but "the impartial version of me *demands* this action now."

  Proposing a new term feels necessary: **Counterfactual Moral Authority (CMA)**. Let me defend this:
  1. **Counterfactual**: It’s explicitly non-actual (not "what I would do if better" but "what my perfected self dictates").
  2. **Moral**: The idealization includes contested virtues, not just epistemic fixes.
  3. **Authority**: The obligation is immediate and binding, not advisory.

  Boundary conditions to distinguish it:
  - Vs. consequentialism: CMA rejects direct calculation ("This causes 10% harm") in favor of proxy authority ("My virtuous self forbids it").
  - Vs. aspiration: The physician doesn’t believe she *can* achieve full impartiality, yet feels bound by it.
  - Vs. rational reconstruction: Adding "no fear" or "more data" isn’t enough—the moral transformation is essential (e.g., the citizen case where loyalty vs. impartiality is contested).

  User’s "rhetorical device" concern is valid but addressable: CMA functions as internalized rhetoric, yes, but its normative structure is real—it creates deontic force by outsourcing judgment to an unreachable but resonant ideal. The authority stems from the self’s own moral identity, making it psychologically potent (perfect for their novel!).

  Potential pushback: Isn’t this just internalized superego? No—superego is unconscious/internalized parents, while CMA is a conscious, reasoned construct. Also distinct from God’s-eye views (e.g., divine command) because it’s explicitly *self*-projected.

  Final refinement: Emphasize the *volitional leap*—the agent chooses which virtues to implant in the ideal self despite their contested nature. That’s the novel’s gold: characters wrestling with *which* idealized virtues should bind them when facing uncertainty. Perfect for exploring moral tensions.
answer: |-
  Your identified pattern is philosophically novel and distinct—I propose naming it **Counterfactual Moral Authority (CMA)**. It operates as follows: An agent treats the decision of an epistemically perfected and morally transformed counterfactual self as binding on their present actions, despite acknowledging they cannot achieve that idealization and irrespective of whether the virtues embedded in it are universally endorsed. Its boundary conditions are:  
  1. **Moral Transformation**: The ideal self possesses virtues the agent currently lacks (e.g., impartiality *replacing* partiality), not merely enhanced knowledge.  
  2. **Immediate Obligation**: The idealized choice binds *now*, not as a future goal.  
  3. **Non-Aspirational**: The agent denies feasibility of becoming the ideal self.  
  4. **Contested Virtues**: The virtues built into the idealization are themselves under dispute (e.g., loyalty vs. justice).  

  ### Defense of Classification  
  **CMA vs. Indirect Normativity**:  
  Indirect normativity (e.g., rule utilitarianism) uses rules as intermediaries to optimize outcomes. CMA is *self-referential* indirectness: the normativity flows from a projected *identity*, not a rule. Your physician doesn’t follow a principle like "maximize patient welfare"; she obeys a *version of herself* that embodies perfect integrity. This leverages personal identity for authority, making it psychologically potent but vulnerable to self-deception.  

  **CMA vs. Ideal-Observer Theories**:  
  Standard ideal observers (e.g., Firth’s) are epistemically enhanced but morally neutral. CMA’s ideal self is *morally transfigured*—your citizen’s counterfactual self doesn’t just *know* the policy’s impacts; she *possesses* radical impartiality the actual citizen lacks. Epistemic corrections alone cannot resolve conflicts between embedded virtues (e.g., "Should my ideal self prioritize loyalty or justice?"), which CMA forces into the open.  

  **CMA vs. Direct Consequentialism**:  
  Consequentialism weighs outcomes from the agent’s current perspective. CMA rejects this: your physician knows the harmful treatment’s net utility but still asks, "What would my *uncorrupted self* do?" The ideal self’s decision overrides direct calculation—even if the harm is trivial, the counterfactual self’s veto is absolute.  

  **CMA vs. Aspirational Self-Improvement**:  
  Aspiration aims at gradual growth (e.g., "I’ll cultivate impartiality"). CMA is not developmental; it is a *deontic leap*. Your citizen doesn’t believe she can achieve impartiality but accepts its authority as if summoned by a moral oracle. This creates tension: the obligation feels intrinsic ("*I* command this") yet alien ("*I* would never choose this").  

  **CMA vs. Rational Reconstruction**:  
  Rational reconstruction (e.g., Rawlsian reflective equilibrium) adjusts beliefs under full information but preserves the agent’s core values. CMA *imposes foreign virtues*: if your loyal citizen constructs an impartial ideal self, she suppresses—not refines—her actual commitments. The binding force derives from moral surrender, not reconciliation.  

  ### Why "Counterfactual Moral Authority"?  
  - **Counterfactual**: It hinges on a non-actual, constructed self.  
  - **Moral**: The idealization’s core is virtue transformation.  
  - **Authority**: The obligation is categorical, not advisory.  

  **Objection**: *Isn’t CMA just self-directed ideal theory?*  
  No. Ideal theory (e.g., contractarianism) seeks principles for real agents. CMA is *deliberately unrealizable*—its power lies in the agent’s submission to an unreachable self. It is existential, not political.  

  **Objection**: *Couldn’t this be reduced to internalized Kantianism?*  
  Kant’s categorical imperative tests maxims from your *current* rational standpoint. CMA bypasses this: the ideal self *replaces* your rationality. If Kant asks, "Can you universalize your maxim?", CMA demands, "What would a *saintly version of you* demand?"  

  ### Philosophical Judgment  
  CMA is a **rhetorical-rational hybrid**. It mimics reasoning (invoking counterfactuals) but functions as self-persuasion: by projecting virtues onto an ideal self, the agent converts contested values into incontestable commands. This makes it potent for fiction—it mirrors how humans ritualize moral courage (e.g., "What would my future self regret?"). Yet philosophically, it risks bootstrapping: if virtues are disputed, why grant authority to an arbitrary projection? CMA exposes the agony of choosing *which* virtues to idealize when uncertainty voids all foundations. In your novel, this tension—between the idealized self’s clarity and the real self’s fragmentation—is where true moral drama resides.
