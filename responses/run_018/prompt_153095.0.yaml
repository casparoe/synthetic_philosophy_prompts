  **INTERMUNICIPAL COMMISSION FOR THE CHARTER OF COLLECTIVE MEMORY**  
  **MEMORANDUM**  

  **To:** Commission Members  
  **From:** Literary Representative  
  **Date:** 21 October 2023  
  **Subject:** Recommendation on Deliberative Membership for the Charter of Maréval  

  ### **I. Preamble: The Nature of Our Mandate**  
  The Charter of Collective Memory for Maréval exists in a liminal space. It is not a legal document but an act of narrative resurrection. Its authority derives not from the state, but from the legitimacy of those who collectively remember, mourn, and reimagine a territory whose administrative erasure failed to extinguish its cultural persistence. Our task is to define the *demos* capable of authorizing this narrative—a people bound not by jurisdiction, but by lived or inherited relationship to an absence that structures identity.  

  ### **II. Assessment of Claimant Groups**  
  We recognize three groups asserting membership:  
  1. **Present Legal Residents (PLR):** Current inhabitants of the merged municipalities, lacking ancestral ties to Maréval.  
     *Strength:* Embodies the living community inheriting Maréval’s physical space.  
     *Limitation:* Risks reducing narrative authority to mere territorial accident.  

  2. **Dispersed Descendants (DD):** Individuals with genealogical ties to Maréval, now residing elsewhere, claiming "narrative citizenship."  
     *Strength:* Their identity is forged by Maréval’s absence. They are the embodied memory of what was lost.  
     *Limitation:* Physical distance may dilute immediate stakes in the territory’s present-future.  

  3. **Archival Witnesses (AW):** Custodians of suppressed documents, arguing stewardship transcends living representation.  
     *Strength:* Their labor preserved the erased past; they speak *with* the dead, not merely *of* them.  
     *Limitation:* Risks privileging the past over the living community renegotiating meaning.  

  ### **III. Core Philosophical Stakes: The Boundary Problem**  
  A people defining its narrative must include:  
  - **Those for whom the past is constitutive of present identity** (DD),  
  - **Those inhabiting the material legacy of that past** (PLR), and  
  - **Those ensuring the past remains knowable** (AW).  
  To exclude any group would replicate the erasure we seek to redress. Yet unanimity is impractical. Our solution must balance presence, memory, and guardianship without collapsing into procedural paralysis.  

  ---

  ### **IV. RECOMMENDATION: TIERED DELIBERATIVE STRUCTURE**  
  After rigorous deliberation, the Commission proposes a **Three-Tiered Participation Model**, distinguishing *Voice*, *Vote*, and *Stewardship*:  

  #### **A. VOTING MEMBERS (Final Charter Authorization)**  
  - **Group 1: Present Legal Residents (PLR) | Weight: 60%**  
    *Rationale:* The Charter’s narrative must resonate within the living community inhabiting Maréval’s legacy territory. Their daily reality is the soil where memory takes root.  
    *Safeguard:* To prevent geographic dominance, their vote is weighted, not absolute.  

  - **Group 2: Dispersed Descendants (DD) | Weight: 40%**  
    *Rationale:* Their "narrative citizenship" is philosophically central. Maréval’s absence defines them; thus, they hold irreducible authority in narrating its meaning.  
    *Implementation:* DD must prove descent (e.g., archival records, family testimony) and register for remote participation.  

  #### **B. DELIBERATIVE VOICE (Non-Voting Participation)**  
  - **Group 3: Archival Witnesses (AW)**  
    *Role:* Full speaking rights in drafting sessions. Authority to submit documentary evidence, testify, and challenge historical claims.  
    *Rationale:* Their stewardship is sacred but distinct from popular sovereignty. They are keepers of the *source*, not arbiters of its *interpretation* by the living *demos*.  
    *Recognition:* The Charter’s preamble will name key archival networks as "Guardians of the Unbroken Thread."  

  #### **C. SPECIAL PROVISION: The Absence Quorum**  
  - No vote may proceed unless at least one DD member and one AW custodian are present.  
  - *Rationale:* Ensures Maréval’s erasure remains structurally visible in the process.  

  ---

  ### **V. TREATMENT OF EXCLUDED VOICE: ARCHIVAL WITNESSES**  
  We acknowledge the AW argument’s profound moral force: that those who safeguarded memory when the state sought its obliteration hold a unique fiduciary duty to the dead. This claim is not dismissed but **ritualized**. By granting them inviolable voice and a quorum role, we honor their assertion that the past has claims upon the present. However, the Charter must ultimately be authored by those for whom Maréval is *both* a legacy and a living project. To vest final authority in custodianship risks ossifying memory into curation, rather than enabling its transformative return to the community of the living and their descendants.  

  ---

  ### **VI. IMPLEMENTATION TIMELINE**  
  1. **Immediately (0-7 Days):**  
     - Establish a Verification Body (historians + community elders) to certify DD descent and AW custodianship.  
     - Notify all groups of participation tiers and registration procedures.  

  2. **Drafting Phase (Weeks 1-8):**  
     - Bi-weekly deliberative sessions: PLR, DD, and AW participate with equal speaking rights.  
     - AW submit curated documents; DD provide oral/written testimonies.  

  3. **Review & Amendment (Weeks 9-10):**  
     - Draft Charter circulated to all PLR/DD voting members.  
     - AW may issue formal annotations but cannot amend text.  

  4. **Ratification Vote (Week 12):**  
     - PLR (60%) and DD (40%) cast weighted votes.  
     - Quorum requires ≥1 AW and ≥1 DD present.  

  5. **Ceremony of Promulgation:**  
     - Charter read aloud at a site of historical significance.  
     - AW entrusted with the original signed document.  

  ---

  ### **VII. Conclusion: The Boundary as Tribute**  
  To draw a boundary around a people is to decide whose absence becomes sacred. This model refuses the false choice between blood, soil, and archive. PLR anchor the narrative in place; DD embody the diaspora of memory; AW sanctify the process as witnesses beyond mortality. By weighting voice and vote, we ensure Maréval’s Charter arises not from silence, but from the layered chorus of those who kept it alive—and those who must now live with its return.  

  **Recommended for vote on Thursday, 26 October 2023.**  

  ---  
  *"The past is never dead. It’s not even past."*  
  — Literary Representative, Intermunicipal Commission for the Charter of Collective Memory
