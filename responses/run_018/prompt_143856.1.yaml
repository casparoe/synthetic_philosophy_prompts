answer: |-
  Below is a comprehensive exam package tailored to your specifications. It includes the question, a model answer demonstrating four conceptual moves, and a detailed marking scheme.

  ---

  ### **(1) EXAM QUESTION**  
  **Course:** PHIL 799 - Advanced Topics in Moral Psychology (Bernard Williams)  
  **Time Allowed:** 90 minutes  
  **Word Count:** Approx. 1,500 words  

  #### FRAMING NOTE  
  *This question tests your ability to engage critically with Bernard Williams’s objections to impartial moral theories, moving beyond exegetical summary. Focus on conceptual precision, argumentative rigor, and original application of Williams’s core distinctions. Do not rehearse boilerplate accounts of the "integrity objection" or the "one thought too many" rescue scenario; answers that merely paraphrase standard examples will receive minimal credit.*

  #### QUESTION  
  Consider a trauma surgeon whose foundational commitment ("ground project") is constituted not by a personal relationship (e.g., familial love) but by a professional vow: *"I am exclusively responsible for the survival of patients assigned to my care."* She faces an emergency: she can save either **one patient currently under her care** or **five critically injured strangers** who are not her assigned patients. Saving either group requires her unique skills, and she cannot save both.  

  **Argue whether Williams’s integrity objection—particularly the notion that calculating aggregate welfare constitutes "one thought too many"—still meaningfully applies to her deliberation.**  
  Specifically:  
  (a) Does utilitarian deliberation (e.g., comparing lives saved) still threaten her integrity in Williams’s sense?  
  (b) Is her prioritization of her assigned patient defensible as a *non-arbitrary* form of role-based partiality that utilitarianism could accommodate?  

  In your response:  
  - Ground your analysis in Williams’s distinction between **agent-relative reasons** (grounded in the agent’s projects/identity) and **agent-neutral reasons** (applicable to all agents regardless of perspective).  
  - Explain whether the integrity objection *depends essentially on personal relationships* or can be generalized to institutional commitments without losing its critical force.  

  ---

  ### **(2) MODEL ANSWER** (Key conceptual moves bracketed for clarity)  
  Williams’s integrity objection targets theories like utilitarianism for demanding that agents subordinate their deepest commitments to impersonal moral calculus, thereby alienating them from their constitutive projects. The surgeon’s dilemma tests whether this critique extends to institutional roles. I argue that Williams’s objection **retains its force** here because her vow generates *agent-relative reasons* inseparable from her identity, rendering utilitarian calculation a destructive "one thought too many." This case generalizes the integrity objection beyond personal bonds, revealing institutional roles as equally potent sources of non-fungible practical necessity.  

  **[Conceptual Move 1: Clarifying Williams’s Conditions for Integrity Objections]**  
  Williams’s objection applies when:  
  (i) An agent’s reasons arise from a "ground project" essential to their identity (e.g., George’s anti-war stance in "A Critique of Utilitarianism");  
  (ii) The project generates *agent-relative reasons* (e.g., "I must save *my* spouse");  
  (iii) Impartial theories demand subordinating these reasons to agent-neutral calculations (e.g., "save whoever maximizes welfare");  
  (iv) This demand fractures the agent’s integrity by severing action from character. Crucially, the objection hinges on **non-transferability**: reasons tied to *this* agent’s perspective cannot be universalized without residue.  

  **[Conceptual Move 2: Diagnosing the Surgeon Case – Agent-Relativity in Institutional Roles]**  
  The surgeon’s vow ("I save *my* assigned patients") satisfies (i)–(iv). Her professional identity is *constituted* by the vow, making it a ground project. Saving her patient is not a preference but a *practical necessity* for her—a reason she experiences as "mine." This reason is agent-relative: another surgeon might have identical obligations to *their* patients, but *she* has no reason to save *their* patients over her own. Utilitarianism, however, demands she adopts an agent-neutral view: "five lives > one life." Forcing this calculus requires her to treat her vow as a *disposable preference* rather than a source of obligation. This is the "one thought too many": weighing lives neutrally annuls the first-personal authority of her vow.  

  **[Conceptual Move 3: Distinguishing Institutional Commitments from Personal Attachments]**  
  Unlike personal bonds (e.g., saving a spouse), the surgeon’s commitment is institutional—but this changes nothing. Williams’s objection targets *how reasons are experienced*, not their origin. Her vow functions identically to George’s anti-war commitment: both generate categorical reasons *for her* that cannot be reduced to welfare outcomes. Utilitarians might retort that roles are socially useful conventions, hence partiality could be "licensed" by rules maximizing welfare (e.g., triage systems). But Williams would reject this: institutional roles gain *normative grip* only when internalized as identity-constituting. If the surgeon justifies her choice by appealing to welfare ("systems function better with role fidelity"), she still instrumentalizes her vow, alienating herself from its intrinsic authority. Integrity requires: "I save my patient *because she is mine*," not "*because systems work best when surgeons do this*."  

  **[Conceptual Move 4: Assessing Utilitarian Accommodation & Generalizability]**  
  Can utilitarianism absorb this role-based partiality? Only superficially. Rule-utilitarianism might endorse role obligations as efficiency-maximizing rules. But this *instrumentalizes* the surgeon’s vow, reducing it to a proxy for welfare. For Williams, this fails: her reason is not "this act promotes welfare" but "this patient is *entrusted to me*." Agent-relative reasons resist translation into agent-neutral terms. The integrity objection thus **generalizes**: it applies whenever commitments become *existentially non-negotiable*, whether through intimacy (spouses) or institution (vows). The surgeon’s case proves that Williams’s critique targets not relationships per se, but the *structure of practical reason* itself when grounded in identity.  

  **Conclusion:** The surgeon’s dilemma reactivates Williams’s critique. Calculating lives remains "one thought too many" because it forces her to betray the first-personal reasons that make her *who she is*. Institutional roles, when identity-constituting, are as vulnerable to utilitarian alienation as personal bonds.  

  ---

  ### **(3) MARKING SCHEME** (Total: 20 marks)  
  **Must-hit points** (Marks deducted for characteristic failures):  

  | **Points**                                                                                               | **Marks** | **Characteristic Failure (Costs Marks)**                                  |  
  |----------------------------------------------------------------------------------------------------------|-----------|---------------------------------------------------------------------------|  
  | **1. Accurately frames Williams’s integrity objection** (conditions i-iv) and distinguishes it from generic partiality. | 4/20      | *Failure: Paraphrases "one thought too many" without explaining its link to identity/constitutive projects.* |  
  | **2. Correctly applies agent-relative/neutral distinction** to the surgeon’s vow vs. utilitarian demand.          | 5/20      | *Failure: Treats the vow as a "strong preference" rather than a source of non-instrumental reasons.*          |  
  | **3. Diagnoses whether utilitarian deliberation threatens integrity** in the surgeon case, addressing non-transferability. | 5/20      | *Failure: Asserts the case "collapses into utilitarianism" without engaging Williams’s anti-instrumentalization argument.* |  
  | **4. Contrasts institutional vs. personal commitments** and evaluates if both generate Williams-style agent-relative reasons. | 4/20      | *Failure: Claims only "intimate" bonds ground integrity objections, ignoring Williams’s broader account of practical necessity.* |  
  | **5. Assesses generalizability**: Does the integrity objection retain force for institutional roles? Engages utilitarian "accommodation" claim. | 2/20      | *Failure: Conflates rule-utilitarian efficiency with the surgeon’s first-personal reasons, missing alienation.* |  

  ---

  ### **Rationale for Design**  
  - **Anti-Regurgitation**: The institutional twist (vow vs. love) and demand to generalize the integrity objection prevent stock answers.  
  - **Conceptual Depth**: Tests mastery of agent-relative/neutral reasons beyond definitions.  
  - **Williams-Centric**: Focuses on core essays (*Utilitarianism: For & Against*, *Moral Luck*, "Persons, Character & Morality").  
  - **PhD-Level Precision**: Requires synthesizing Williams’s metaethics (reasons, identity) with applied ethics (roles).  

  This question rewards candidates who see Williams not just as a critic of utilitarianism but as a philosopher of the *sources of moral reasons*. The model answer demonstrates how to "do Williams" beyond the usual examples.
