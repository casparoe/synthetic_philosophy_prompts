  ### Decision Tree for the Foundations of Typography and the Philosophy of Categories

  This instrument sorts respondents into one of six positions on what constitutes the letter 'a', based solely on judgements about concrete glyph cases. Answer each question by considering the described letterforms. Do not reference theoretical labels; rely on your intuitive assessments.

  **Question 1:**  
  Imagine a **simplified glyph shaped like an 'o' with a short right-hand stem**, used in a child's handwriting. Do you consider this to be:  
  - **(A)** Unequivocally an 'a', though perhaps poorly formed.  
  - **(B)** Not truly an 'a'—it’s too ambiguous or defective.  
  - **(C)** An 'a' to some degree, but less so than a standard printed 'a'.  

  **Question 2 (if 1C):**  
  When judging glyphs like the simplified 'o-with-stem', do you:  
  - **(A)** Compare them to **one idealised 'a'** (e.g., a clear double-storey printed form) to decide how good an 'a' they are?  
  - **(B)** Compare them to **multiple specific 'a's you recall** (e.g., handwritten, italic, or bold variants) to decide?  

  **Question 3 (if 1A or 1B):**  
  Consider **a deliberately novel mark** (e.g., a zigzag) that a small community resolves to use, and thereafter reads unhesitatingly, as the letter 'a'. Is this mark:  
  - **(A)** Definitely an 'a', because the community treats it as one.  
  - **(B)** Not an 'a'—it lacks essential features of an 'a'.  

  **Question 4 (if 3A):**  
  For the novel mark to be an 'a', must the **creator have intended it as an 'a'**? Specifically, if the creator drew it randomly (no intent for 'a'), but the community adopted it as 'a', is it still an 'a'?  
  - **(A)** Yes, the creator’s intention is essential—without it, it’s not an 'a'.  
  - **(B)** No, the community’s use alone makes it an 'a'.  

  **Question 5 (if 4B):**  
  Suppose a community uses a mark as an 'a', but it **looks identical to a 'd' and is always misread as 'd'** (causing confusion). The community still calls it an 'a'. Is it:  
  - **(A)** Not an 'a'—it fails to function as one.  
  - **(B)** Still an 'a'—the community’s practice defines it.  

  **Question 6 (if 1B or 3B):**  
  Consider an **'a' with its bowl open at the top** (resembling a 'u' with a crossbar). If this appears in a readable text, is it:  
  - **(A)** An 'a'—its core structure (e.g., crossbar, enclosed space) is intact.  
  - **(B)** Not an 'a'—it’s too distorted or non-functional.  

  **Question 7 (if 6B or if 1B and 3B both chosen):**  
  Consider a **heavily flourished blackletter 'a'** (with intricate, elaborate strokes). If it functions perfectly in Gothic script, is it:  
  - **(A)** An 'a'—it works in its context.  
  - **(B)** Not an 'a'—it strays too far from standard forms.  

  ---

  ### Sorting Outcomes  
  Follow your path through the answers to find your position:  

  - **1C → 2A: Prototype Theory**  
    Membership is graded by similarity to a single, idealised 'a' stored in the mind.  
    *Most awkward commitment:* It struggles to explain why a glyph equally similar to the prototypes of 'a' and 'o' (e.g., the simplified 'o-with-stem') might still be unambiguously an 'a' in certain contexts.  

  - **1C → 2B: Exemplar Theory**  
    Membership is graded by similarity to a cloud of remembered instances of 'a's.  
    *Most awkward commitment:* It must account for recognising an 'a' in a wholly novel typeface (e.g., a dotted silhouette) without prior stored examples.  

  - **1A or (1B → 3A) → 4A: Normative Artefactualism**  
    Membership rests on the maker’s intention to create an 'a' and conformity to typographic norms.  
    *Most awkward commitment:* It must explain why a perfect replica of an 'a' made with identical intent but outside the community (e.g., a forgery) might not be an 'a'.  

  - **1A or (1B → 3A) → 4B → 5A: Functional Contextualism**  
    A glyph is an 'a' when it successfully performs the function of 'a' in a reading practice.  
    *Most awkward commitment:* It must accept that a mark resembling 'd' but functioning as 'a' in one community is an 'a', even if it causes confusion elsewhere.  

  - **1A or (1B → 3A) → 4B → 5B: Deflationism**  
    Sameness is projected by sorting practices; there is no deeper essence beyond usage.  
    *Most awkward commitment:* It must deny any robust reason why a community’s arbitrary mark (e.g., a zigzag) is an 'a', beyond their calling it such.  

  - **1B → 3B → 6A: Skeletal Structuralism**  
    A glyph is an 'a' if it preserves the topological skeleton (e.g., enclosed bowl, stem, open counter) regardless of style.  
    *Most awkward commitment:* It must accept that an 'a' formed by accident (e.g., cracks in pavement) is an 'a' if structurally identical, even if unrecognised.  

  - **1B → 3B → 6B → 7A: Functional Contextualism** (same as above)  
  - **1B → 3B → 6B → 7B: Skeletal Structuralism** (same as above)  

  *Note:* "Functional Contextualism" and "Skeletal Structuralism" appear twice due to path redundancy, but reflect the same core positions.  

  ---

  ### Logical Space: Unoccupied Combinations  
  Combinations of answers not mapping to any position and their diagnoses:  
  - **1C → 3B (graded membership but rejects community-based novel mark):**  
    Unattractive—if membership is graded, a community-adopted mark should be at least a marginal 'a', not rejected outright.  
  - **1A → 6B (accepts simplified 'o-with-stem' as unequivocal 'a' but rejects structurally flawed 'a'):**  
    Incoherent—positions accepting functional substitutes (like the simplified glyph) should tolerate structural flaws if functional.  
  - **1B → 3A → 4B → 7B (rejects structure/function for flawed glyphs but accepts community novel mark without intention, then rejects functional blackletter):**  
    Incoherent—accepting community use for novel marks should extend to functional, context-specific forms like blackletter.  

  ---

  ### Indistinguishable Pairs  
  Pairs requiring additional separation due to probe limitations:  
  - **Prototype vs. Exemplar Theory (1C → 2A vs. 1C → 2B):**  
    Current separation relies on self-reported comparison strategy. To strengthen, add a probe like a **highly variable handwritten 'a' series**: Ask if judgements depend on averaging toward an ideal (prototype) or matching any remembered instance (exemplar).  
  - **Normative Artefactualism vs. Skeletal Structuralism (e.g., 1B → 3A → 4A vs. 1B → 3B → 6A):**  
    Paths diverge on community-based novel marks (3A/3B), but if structuralists misjudge a novel mark as structural (e.g., seeing a zigzag as 'skeleton-compliant'), they may answer identically. To separate, add a **non-skeletal but functional glyph** (e.g., an 'a' rendered as mechanical cogs): Artefactualists accept it if intended and norm-governed; structuralists reject it.  

  ---

  This instrument uses British English spelling and grammar throughout.
