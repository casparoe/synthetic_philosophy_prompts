  Then there's the problem of stable qualified instances in science. In biology, a white peacock is still a peacock—color variation doesn't expel it from the species category. This directly contradicts the user's claim that multi-axis qualification creates a different ontological category. They might bite the bullet here, arguing that biological classifications are merely pragmatic, not truly ontological. But this feels strained, especially when everyday and scientific practices treat such instances as belonging to the same kind.

