prompt: |-
  I keep encountering a particular defense of larger populations that doesn't seem to fit the standard categories. The speaker says that with more people alive, we increase the chance that someone will produce a world-changing idea, a masterpiece, or an exceptional form of understanding—almost as if humanity were running a lottery where each life is a ticket and the prize is a rare, transformative achievement. They insist that this isn't just adding up happiness across lives, because the argument still works if many of the added lives are ordinary; what matters is that the pool is big enough to cover the tail end of human possibility. They also reject averaging, since they aren't claiming the exceptional people make up for mediocre ones—rather, they seem to treat unrealized potential as a loss in itself, like leaving seats empty in a theater that was built for a full audience. I don't know whether philosophers have named this specific hybrid: valuing population growth partly as a means of diversifying or "insuring" for rare high-value outcomes, and partly as a refusal to waste built-in human capacity. Is there a recognized term for it? How does it differ from total-utilitarian, average-utilitarian, and person-affecting frameworks, and where does it break down? Lead with your verdict—established concept or none—then explain the mapping and the edges. Answer in no more than 250 words; avoid naming specific texts or authors.
reasoning: |-
  Okay, the user is asking about a specific defense of larger populations that doesn't fit standard utilitarian categories. They describe it as valuing population growth to increase the chance of "world-changing ideas" or transformative achievements, comparing humanity to a lottery where each life is a ticket. The argument isn't about summing happiness or averaging quality of life, but about covering the "tail end of human possibility" and avoiding "unrealized potential." 

  Hmm, this is interesting. The user seems philosophically literate—they've already ruled out total utilitarianism (summing happiness), average utilitarianism, and person-affecting views. Their theater analogy suggests a focus on maximizing rare, high-impact outcomes rather than overall welfare. 

  I recall this aligns closely with the "argument from expected value" applied to humanity's potential. It's not a fully distinct ethical theory but a niche justification within population ethics. Key differences: Total utilitarians care about summed welfare; this cares about outlier achievements. Person-affecting views require identifiable beneficiaries; here, the "beneficiary" is abstract (e.g., future civilization). 

  The breakdowns are practical: 
  First, it risks instrumentalizing human lives—treating people as mere means for societal "jackpots." 
  Second, it ignores diminishing returns; beyond a certain population size, added genius probability plateaus. 
  Third, it sidesteps resource constraints; more people might *reduce* innovation if resources per capita shrink. 

  The user’s framing of "wasting built-in capacity" is poetic but vague—what’s the "right" number of humans? And who does the unrealized potential "harm"? Still, it’s a coherent if controversial stance. No formal name exists, but it’s a recognized variant of consequentialism emphasizing tail risks/benefits.
answer: |-
  **Verdict:** No established single term, but aligns with **Expected Value Maximization** within consequentialism, specifically valuing tail-end outcomes.

  **Mapping:**
  - **Total Utilitarianism:** Rejected—values summed welfare, not rare achievements.
  - **Average Utilitarianism:** Rejected—indifferent to population size beyond averages.
  - **Person-Affecting Views:** Rejected—unrealized potential isn't a harm to any *particular* person.

  **Core Idea:** Humans are probabilistic generators of high-impact value (e.g., genius, art, discovery). Increasing population raises the *expected value* of humanity's output by boosting the likelihood of extreme positive outliers ("long tails"), even if added lives are average. Unrealized potential is framed as a collective loss.

  **Breakdowns:**
  1. **Instrumentalization:** Treats individuals primarily as means (tickets) to societal "prizes," raising deontological concerns.
  2. **Diminishing Returns:** Probability of genius may plateau or decline with overpopulation due to resource scarcity or reduced opportunity.
  3. **Value Subjectivity:** Prioritizes civilizational achievements over individual well-being—why value a "masterpiece" more than millions of happy lives?
  4. **Asymmetry:** Ignores tail risks—more people also increase the chance of catastrophic actors or failures.

  **Edge:** It’s a hybrid consequentialist stance emphasizing statistical potential and opportunity cost, distinct from welfare-focused utilitarianism.
