prompt: |-
  I hold a view about the special composition question that I have not seen defended in exactly this form, and I want to know how exposed it is. I think that a plurality of objects composes a genuine whole if and only if the parts stand in a relation of functional interdependence that is not reducible to pairwise interactions—meaning the causal and counterfactual behavior of each part depends on the states of the others in a way that cannot be reconstructed from summed binary relations—and only when that interdependence yields a unified causal profile that is distinguishable from the aggregate profile of the parts taken separately. On this view, tightly integrated artifacts (say, a functioning processor with interdependent gates) and certain ecological networks can be real composites, but scattered objects, arbitrary heaps, and even some biological colonies whose members interact only pairwise are not. I deny that life, consciousness, or biological organization is necessary for composition, and I reject both universalism and standard biological restrictivism.

  Please tell me what would count against this position. I want decisive defeaters separated from merely awkward ones: which formal results, empirical cases, or conceptual arguments should change my mind, and which would only require minor adjustments? Include the objections and problem cases that a defender of this structural-restrictivist view would themselves concede are damaging, not only the criticisms an opponent would press. Finally, assess whether the view can be qualified—by weakening the non-decomposability condition, broadening functional interdependence, or retreating to modal claims—into something unfalsifiable, and whether such insulation is a defect for a metaphysical thesis of this kind. Do not provide bibliographies, reading lists, or citations; I want arguments and cases evaluable without source access.

  Structure your response as follows, in this order:
  1. The position restated (brief, about 100 words)
  2. Decisive defeaters (about 250 words)
  3. Merely awkward evidence (about 200 words)
  4. What defenders concede (about 150 words)
  5. Insulation, unfalsifiability, and whether it matters (about 150 words)
