answer: |-
  Here is a meticulously structured teaching plan for Bernard Williams' integrity objection, designed for technically trained non-philosophers, focusing on logical structure and avoiding common misconceptions.

  **Core Objective:** Demonstrate that Williams' "one thought too many" critique reveals a *structural flaw* in act-utilitarianism (AU) concerning personal identity and agency, not a defense of partiality or emotion over reason.

  **Target Misconceptions to Preempt:**
  1.  **Conflation with Decision Theory:** Mistaking the objection for a critique of EU maximization in general.
  2.  **Anti-Calculation Bias:** Reducing it to "emotions are better than calculations."
  3.  **Defense of Selfishness:** Assuming Williams excuses selfish acts or prioritizes self-interest.
  4.  **Absolute Partiality:** Thinking it argues one should *never* count lives or consider consequences for strangers.
  5.  **Romantic Sentimentality:** Framing it solely as a defense of spousal love.

  **Session Structure (60-75 mins):**

  1.  **Primer: Act-Utilitarianism (AU) - The Target (10 mins)**
      *   **Core Principle:** The *only* morally relevant factor is maximizing overall aggregate well-being/happiness/preference-satisfaction. The right action is the one producing the best net consequences.
      *   **Agent-Neutrality:** The source of the consequences (e.g., *who* acts, *who* benefits/loses) is irrelevant. Only the *net sum* matters.
      *   **Impartiality Requirement:** The agent's own relationships, feelings, and projects hold no special moral weight unless they instrumentally affect the net sum.
      *   **Crucial Point:** AU demands that *all* motivations ultimately be justified by, or reducible to, the maximization principle. Any other justification is morally suspect or irrational.
      *   **Preempt Misconception #1:** Clarify AU is a *moral* theory prescribing *what is right*. This is distinct from EU maximization as a *decision procedure* under uncertainty in non-moral contexts (e.g., engineering, finance). We're critiquing AU's *moral requirements*.

  2.  **The Rescue Scenario - Setup (5 mins)**
      *   **Present the Core:** "Imagine a person (Agent A) faces a situation where they can save only one of two people from imminent, identical danger (e.g., drowning, fire). One is a complete stranger. The other is Agent A's spouse."
      *   **Critical Constraints (Must Include):**
          *   **Identical Expected Utility:** Saving either person contributes *identically* to overall net utility. (Assume same baseline utility, same potential future contributions, same impact on others' utility through grief, etc. *Crucially, saving the spouse does not yield a greater net utility boost.*)
          *   **No Conflicting Duties:** Agent A has no pre-existing professional or societal obligation favoring either person (e.g., they aren't a lifeguard on duty).
          *   **Action Feasibility:** Saving either is equally possible/risky for Agent A.
      *   **Exclude:** Any implication that the *spouse's life* is intrinsically more valuable to the universe than the stranger's. Any suggestion of overwhelming emotional impulse *obliterating* reason.
      *   **Preempt Misconception #5:** State explicitly: "The relationship here (spouse) is a placeholder. It could be a close friend, parent, child, or even a deeply cherished project commitment – something centrally important to *who the agent is*. We're using 'spouse' for vividness, but the objection isn't *about* romance."

  3.  **The AU Demand & Williams' Observation (10 mins)**
      *   **AU Prescription:** AU is *indifferent* between saving spouse or stranger. Saving either is permissible, as both maximize utility. *However*, AU demands that whichever action Agent A takes, the *justification* must ultimately reference maximizing utility.
      *   **Question:** "What should Agent A's thought process look like, according to AU?"
      *   **The "One Thought Too Many":** Williams observes that if Agent A saves their spouse and justifies it *primarily* by saying "Because she is my wife and I love her," this is insufficient for AU. AU requires Agent A to add: "...and *because saving her in this situation maximizes overall utility*" (since saving either does).
      *   **The Objection:** Williams argues this added thought – the explicit appeal to utility maximization as the *justification* – is "**one thought too many**." It reveals something morally distorted about AU.

  4.  **Why "One Thought Too Many"? The Structural Flaw (20 mins)**
      *   **Focus on Justification & Integrity:** The flaw isn't *which* person is saved, but the *kind of justification* AU demands.
      *   **Alienation:** AU forces the agent to alienate themselves from their deepest commitments (like love for a spouse). To act *morally* (by AU standards), the agent must see their most fundamental personal reasons for acting (love, loyalty) as *morally inert* or insufficient unless validated by the impersonal calculus.
      *   **Attack on Agency & Identity:** Our deepest commitments (ground projects, relationships) are partly *constitutive* of who we are as agents. AU requires us to treat these core aspects of our identity as mere inputs to an external calculation, rather than as *sources* of genuine moral reasons *in themselves*.
      *   **Integrity Violated:** This demand undermines "integrity" – the unity and coherence of the agent's character, motivations, and actions. It forces a split between the agent's personal perspective and the impersonal moral perspective. Acting *on* your deepest commitments isn't enough; AU says you must act *because of* the calculus *overriding* or *validating* those commitments.
      *   **Preempt Misconception #2:** Emphasize: This is **NOT** saying "feelings good, calculation bad." It's saying AU's *specific requirement* to *justify* personal commitments *via* the impersonal calculus is structurally flawed. It disrespects the nature of the commitment itself. Calculation *informed by* the commitment (e.g., "I love her, so I'll save her *and* consider broader impacts if relevant") might be fine; the problem is the demand for the impersonal calculus to be the *justifying reason*.
      *   **Preempt Misconception #3:** Stress: Saving the spouse *is permissible* under AU here! Williams isn't defending *ignoring* the stranger *if* saving them yielded more utility. He's critiquing the *justification* required for saving the spouse *even when it's permissible*. The objection isn't about selfishness (agent isn't saving *themselves*), it's about the nature of commitment.
      *   **Preempt Misconception #4:** Reiterate: The scenario assumes *equal utility* outcomes. Williams isn't saying you should *never* save a stranger over a loved one if the consequences are *demonstrably* much worse. The objection targets AU's handling of commitments *within* its own framework when commitments *don't* conflict with overall utility.

  5.  **Check for Understanding (5-10 mins)**
      *   **Question:** "Imagine a musician faces a choice: spend the weekend (a) giving a free concert that brings significant joy to 100 strangers, or (b) practicing intensely for a crucial upcoming performance central to their artistic development and sense of self. Assume the net utility gain is identical either way. According to AU, what justification must the musician give for choosing (b)? Why would Williams call this 'one thought too many'?"
      *   **Targeted Response (Indicates Grasp):**
          *   AU demands they justify (b) by appealing to the identical net utility outcome ("It maximizes utility just as much as (a)").
          *   Williams objects because the *real* reason – that this practice is essential to their core artistic identity and project – is sidelined or rendered insufficient. Requiring the utility justification *as the moral reason* alienates them from this constitutive project, adding a thought that distorts their authentic motivation and undermines their integrity.
      *   **Insufficient Response (Relatability Only):** "They should just practice because it's important to them." (Fails to articulate AU's demand or the structural flaw in justification/alienation).

  6.  **Explicitly Bracketed Elements of Williams (5 mins)**
      *   **The "Morality System":** Williams' broader critique targets a specific modern conception of morality (obligation-focused, blame-centered, demanding overriding all other reasons). *Out of Scope:* We're focusing *only* on how AU, as a prime example of this system, handles personal commitments. We aren't exploring his full critique of the system itself.
      *   **Ground Projects vs. Obligations:** Williams argues we have "ground projects" (deep, identity-constituting commitments) that provide the framework within which obligations make sense. *Out of Scope:* We're using "commitment" loosely (like saving a spouse) as a *proxy* for the deeper idea of a ground project. We aren't delving into his complex theory of projects, reasons, or how they relate to obligations beyond this specific AU critique. *Why:* These require significant philosophical groundwork beyond a single session.
      *   **What's Missing:** We are *not* covering Williams' views on moral luck, internal vs. external reasons, or his positive ethical picture (e.g., ethical naturalism). This session isolates *one* powerful objection within his larger project.

  7.  **Contested Terrain & Scope (5 mins) - Be Explicitly Non-Dogmatic**
      *   **Settled:** Most philosophers agree Williams identified a *genuine problem* for *act-utilitarianism* regarding integrity, alienation, and demanding justifications that conflict with deep commitments in certain cases.
      *   **Contested:**
          *   **Scope:** Does it apply to *all* consequentialisms? Rule-utilitarians (& other indirect consequentialists) argue their theories avoid this by endorsing rules/dispositions that permit partiality *without* requiring the agent to constantly justify it via utility. Critics argue alienation persists if the *ultimate* justification remains consequentialist. ***(No consensus)***
          *   **Strength of Projects:** Does the objection rely on an indefensibly strong view of "ground projects" as immune to moral evaluation? Can consequentialists adequately accommodate projects by recognizing their *instrumental* value for well-being? ***(Ongoing debate)***
          *   **Moral Demandingness:** Is this primarily about *demandingness* (AU asks too much)? Williams saw it as distinct: even when AU *permits* the personal act (like saving the spouse), the demanded *justification* is the problem. Later debates (e.g., Singer, Unger) focus on demandingness when AU *requires* sacrifice. ***(Relation is contested; many see overlap, Williams saw distinctness)***
          *   **Alternative Conceptions of Integrity:** Can consequentialism offer its own, compelling account of integrity that avoids Williams' charge? ***(Active area of research)***
      *   **Key Takeaway:** Williams' objection is a powerful challenge to the *structure* of AU's requirements on the agent, particularly concerning justification and identity. Whether it sinks all consequentialism, or how exactly to resolve it, remains debated.

  **Materials:** Whiteboard/flipchart for mapping dependencies (AU Principle -> Scenario Setup -> AU Justification Demand -> "One Thought" -> Alienation/Integrity Flaw). Prepare the Rescue Scenario & Musician Check scenario clearly.

  This structure prioritizes logical dependency, isolates the core structural argument using the carefully constrained scenario, preempts predictable misconceptions at key points, includes a diagnostic check, explicitly brackets Williams' broader framework, and honestly presents the contested landscape of the objection's implications.
