answer: |-
  ## Thesis Defense: Archival Promises as Diachronic Performatives

  **Thesis:** Institutional promises recorded in writing and addressed to no specific present audience constitute genuine performative utterances under a mechanism of **Diachronic Performative Binding (DPB)**. DPB generates normative force not through simultaneous co-present uptake, but through the document's enduring accessibility and its susceptibility to recognition by any future party meeting institutionally specified conditions. This operates within Austin's felicity conditions without collapsing the performative-constative distinction.

  **Core Mechanism: Diachronic Performative Binding (DPB)**

  DPB is the mechanism by which a written institutional utterance, lacking immediate uptake, gains its performative force over time. Its operation relies on four precise, interdependent conditions:

  1.  **Explicit Performative Formula:** The utterance must contain conventional, explicit performative language within its institutional context (e.g., "I hereby bequeath," "The Council ordains," "We the People... do ordain and establish," "I pledge allegiance").
  2.  **Durable, Accessible Embodiment:** The utterance must be inscribed in a materially or digitally durable medium *and* lodged within an institutional structure (e.g., land registry, court archive, national archives, public monument, constitutional repository) guaranteeing its preservation and accessibility according to defined rules.
  3.  **Institutional Recognition Rules:** The relevant institution must possess formal, publicly known procedures for *future* parties (individuals, officials, courts) to:
      *   **Locate & Authenticate:** Verify the document's existence, provenance, and integrity.
      *   **Interpret & Recognize:** Apply established rules (legal, linguistic, customary) to understand its meaning and identify the relevant parties (e.g., heirs, citizens, beneficiaries, obligated officials) and obligations it purports to create *at the moment of recognition*.
      *   **Enforce/Execute:** Possess mechanisms to give practical effect to the recognized obligations (e.g., probate court distributing assets, court enforcing a contract, government upholding constitutional rights, society applying social sanctions for pledge-breaking).
  4.  **No Effective Revocation:** The utterance must not have been validly revoked or superseded according to the institution's own rules prior to the recognition event.

  **Operation within Austin's Felicity Conditions:**

  Austin requires "uptake" for felicity – the understanding and acceptance of the illocutionary act by the audience. DPB redefines "uptake" diachronically and institutionally:

  *   **(A.1) Conventional Procedure Exists:** The written form *is* the conventional procedure for these institutional acts (wills, contracts, laws, pledges). The procedure inherently includes archiving and future recognition.
  *   **(A.2) Correct Execution by Participants:** The speaker(s) must be authorized (testator, legislature, official signatory) and execute the procedure correctly (signatures, witnesses, formal enactment). DPB ensures this initial execution is preserved for future validation.
  *   **(B.1) Complete Execution:** The procedure *includes* inscription and archiving. "Completeness" is achieved upon archival deposit, establishing the potential for future force.
  *   **(B.2) Uptake (Diachronic):** Uptake occurs not when uttered, but when a future party **meets the Recognition Condition** (Condition 3 above). At *that moment*, when an heir presents the will to probate, a citizen invokes a constitutional right in court, or an official acts under a statute, the illocutionary act (bequeathing, ordaining, pledging) is *recognized* and its perlocutionary force (transferring property, establishing law, creating obligation) is triggered. The recognition *is* the delayed uptake. The archive itself acts as the persistent, conventional conduit enabling this deferred recognition.
  *   **Thoughts/Feelings (C):** Austin's conditions regarding intentions remain applicable to the original speaker(s) at the time of inscription.

  **Defending Against the "Mere Constative" Objection:**

  The objection states: Without co-present uptake, the utterance is just a constative report of the speaker's past intent ("I intended to bequeath X," "We intended to create this law"), not a performative creating present obligation.

  **Response:**

  1.  **Institutional Reality vs. Psychological State:** Institutional documents don't merely *describe* past intent; they *create* present institutional facts and obligations. A valid will doesn't state "I intended John to have my watch"; it states "I give my watch to John," creating a *current* property right in John upon authentication, regardless of the testator's current (non-existent) mental state. The document itself, via the institution, is the operative agent binding the present.
  2.  **The Recognition Event as Uptake:** The objection assumes uptake must be simultaneous. DPB argues uptake occurs at the moment of future recognition. When the probate court authenticates the will and identifies John as the legatee, *that act of recognition* constitutes the uptake necessary for the performative "I give..." to achieve its illocutionary force *at that moment*. The court isn't just learning about a past wish; it's *effecting* the transfer based on the standing performative.
  3.  **Force is Generated at Recognition, Not Merely Reported:** The normative force (John *gets* the watch, the law *must be* obeyed, the pledge-breaker *is* culpable) arises not from the original utterance alone, nor from a mere report of it, but from the *combination* of the preserved performative formula and the *present* institutional act of recognition according to its rules. The document enables the institution to *do* something *now*.
  4.  **Preserving the Distinction:** A constative *about* the document ("This document states I bequeath my watch to John") is distinct from the performative force *of* the document when recognized ("John, by virtue of this recognized will, you now own the watch"). The first is a description (potentially true or false); the second is an action (successful or infelicitous). The performative-constative distinction holds: the *utterance within the document* is performative when felicitously recognized later; statements *about* the document are constative.

  **Application to Examples:**

  *   **Testamentary Clause ("I hereby bequeath my library to the Town"):**
      *   *Satisfies DPB:* Explicit performative formula ("bequeath"); durable medium (signed will); archived with probate court; court has rules for authentication, heir/legatee identification, and asset transfer. Force binds when court recognizes it upon death.
  *   **Archival Contract (Sealed medieval land grant in state archives):**
      *   *Satisfies DPB:* Explicit language ("grant," "convey"); durable parchment; archived; property law provides rules for authentication, title search, and enforcement. Force binds when a current owner's title is recognized as deriving from it in a dispute.
  *   **Public Pledge (Founding document: "We pledge perpetual alliance"):**
      *   *Satisfies DPB:* Explicit performative ("pledge"); durable, archived document; state/international law provides mechanisms for interpretation, recognition of obligations between successor states, and potential enforcement (diplomacy, international courts). Force binds when a situation arises requiring recognition of the alliance obligation.
  *   **Unsigned Draft Law in Desk Drawer:**
      *   *Fails DPB:* Lacks Condition 1 (not enacted/formally uttered) and Condition 2 (not properly archived/accessible). It's merely constative of intent.
  *   **Revoked Will:** *Fails DPB:* Violates Condition 4 (effective revocation).

  **Conclusion:**

  Diachronic Performative Binding provides a robust theoretical framework for understanding written institutional promises to future, non-specific audiences as genuine performatives. By re-situating "uptake" within an institutional mechanism of future recognition, triggered by meeting specified conditions applied to a durable, accessible artifact, DPB resolves the apparent conflict with Austin's felicity conditions. The normative force emerges not magically from the text alone, nor merely from the original intent, but from the *institutionally mediated act of recognition* performed by a future party upon the preserved utterance. This process fundamentally distinguishes such documents from constative reports of past intent; they are standing performatives awaiting activation through institutional recognition, capable of shaping reality and binding agents across time.
