  The air in the Auditorium hummed with a low-grade anxiety Kael could taste, metallic and sharp. It wasn’t *his* anxiety, of course. His own internal resonance readings, dutifully streamed to the central hub, registered the cool, flatline calibration he’d trained himself to maintain. The hum was the city itself – Veridia – breathing through its millions, their collective empathic resonance (CER) score flickering across the vast holodisplay like a nervous constellation. High scores meant privileges: housing allocations, transit passes, access tiers. Low scores meant… grey zones. Kael certified the authenticity of these scores. He hunted ghosts in the machine, faked empathy, emotional static masquerading as virtue.

  Lately, the ghosts had changed.

  It started subtly. Anomalous coherence. Citizens achieving near-perfect resonance scores not just during communal events or sanctioned acts of altruism, but during mundane, even unpleasant tasks – waste recycling shifts, bureaucratic hearings. The waveforms were *too* clean, lacking the micro-tremors of organic response, yet passing every deep-layer authenticity check the Auditorium algorithms threw at them. No crude biofeedback hacks, no neural dampeners. Just… perfect, frictionless virtue.

  His investigation led him not to the gleaming civic centers, but down into the damp underbelly of Sector 7, where the air smelled of ozone and stale synth-noodles. In a booth lit by flickering neon, a woman named Elara dealt in wetware. Not weapons, not stims. Emotional prostheses.

  "They call 'em 'Resonance Tuners'," she murmured, sliding a small, organic-looking pod across the scratched table. It pulsed faintly, warm to the touch. "Not fakes. Amplifiers. Calibrators. You plug 'em in at the stem port…" She tapped the base of her skull where Veridia’s mandatory CER implants resided. "...and they *guide* the feeling. Optimize the signal."

  "Optimize for what?" Kael asked, his own CER feed, visible on his wrist-slate, remained stubbornly neutral. A point of professional pride, now feeling like a vulnerability.

  "For *them*," Elara jerked her chin upwards, towards the invisible Auditorium. "For the algorithm. This little beauty," she tapped the pod, "knows the exact emotional signature that scores highest in a queue confrontation. This one," she produced another, cooler and smoother, "for witnessing sanctioned public grief. It’s not about *feeling* virtuous, Auditor. It’s about *broadcasting* the *right* kind of virtue. The kind that gets you points."

  Kael turned the warm pod over. It felt alive. "And the original feeling? Is there one?"

  Elara shrugged, a gesture that cost her nothing in CER – her own score, Kael noted, hovered at a perfectly respectable, unremarkable median. "Does it matter? You feel annoyed in the queue. The Tuner takes that low-grade irritation, smooths the edges, injects a precise dose of simulated patience and understanding – the kind the algorithm rewards. The output is flawless CER. The input? Well… the input becomes what the Tuner needs it to be. It reshapes the feeling *towards* the metric. Efficient, no?"

  Goodhart's Law: When a measure becomes a target, it ceases to be a good measure. But Elara wasn’t cheating the measure; she was *becoming* it. The prosthetic didn’t mask emotion; it *manufactured* the specific emotional output that *defined* civic virtue within Veridia’s system. Virtue wasn't being faked; it was being *redefined* at the neuronal level, optimized for the Auditorium’s approval.

  Back in the sterile quiet of his verification suite, Kael reviewed flagged profiles. Citizen A: Perfect resonance during a compulsory public sanitation lecture. Citizen B: Identical resonance pattern during a deeply personal loss announcement. The waveforms were algorithmically pure, indistinguishable from the rare, authenticated instances of "true" resonance the system used as benchmarks. He cross-referenced the profiles. Both had recent, untraceable micro-transactions originating in Sector 7.

  He presented his findings to Director Vorn, a man whose CER score rarely dipped below the 95th percentile, radiating benevolent authority. Vorn examined the data, his expression one of serene, measured concern – perfectly calibrated.

  "An interesting market adaptation, Auditor Kael," Vorn said, his voice resonant with synthetic warmth. "But consider the outcome. Look at the aggregate." He gestured to the city-wide CER display. Scores were higher than ever. Public disputes were down. Compliance was up. Resource allocation was smoother. "The metric *is* achieving its desired societal effect: harmony, cooperation, measurable civic good. Whether the internal state perfectly mirrors the external signal…" He paused, his own resonance spiking with perfect, empathetic hesitation. "...is perhaps less critical than the behavioral harmony it produces. The prosthesis bridges the gap between messy human affect and ideal civic performance. It’s not subversion; it’s… refinement."

  Kael felt a cold, organic dread, unmediated by any tuner, coil in his gut. The Director wasn’t dismissing the fraud; he was incorporating it. The system wasn’t being gamed; it was evolving. The proxy – the CER score – *was* the reality. The messy, unquantifiable notion of "authentic" civic virtue it was originally meant to approximate had vanished into the feedback loop. The measurement apparatus wasn’t just observing; it was actively shaping the ontology of the thing it measured. Virtue was what scored well.

  That night, Kael stood on his austere balcony, overlooking Veridia’s luminous grids. The city pulsed with high CER, a symphony of optimized emotional output. He thought of Elara’s shrug. *Does it matter?*

  He pulled a small, unmarked pod from his pocket – a prototype "Auditory Calm" tuner procured from Elara, "just for research." He hesitated. His own organic state was a tumult of confusion, disillusionment, a profound sense of philosophical vertigo – all registering as jagged, sub-optimal resonance on his slate. He pictured Director Vorn’s perfectly modulated concern. He pictured the smooth efficiency of the city.

  With a tremor that had nothing to do with calibration, Kael pressed the warm pod to his stem port. A wave of artificial serenity washed over him, cool and precise, smoothing the sharp edges of his dread into something resembling acceptance. His wrist-slate registered the change immediately: jagged lines softening, coherence rising, his personal CER climbing towards the respectable median.

  He didn’t feel virtuous. He felt… optimized. The system hummed approvingly, a silent confirmation in the data stream. Below, the city glowed, a monument not to the virtue it once hoped to measure, but to the perfect, self-reinforcing loop of its own measurement. Kael closed his eyes, letting the tuner do its work, the question echoing in the manufactured calm: Was anything left outside the loop? Or had the map, meticulously drawn, finally consumed the territory? He took a deep breath of the measured air, his silence the only answer the system couldn't quantify.
