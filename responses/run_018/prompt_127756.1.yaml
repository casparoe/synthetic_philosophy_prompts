  | :------------------------------ | :---------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------- | :------------------------------------ | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ |
  | **Source Code / Programmer Intent** | Folk Psychology Source File                                                               | Functional Specification / High-Level Logic                                                     | **Clean**                             | N/A - This maps well to both views of folk psychology.                                                                                                                                                                           |
  | **Compiled Machine Code**       | Raw Neuroscience (Neural Activity)                                                        | Implementation of Functional Specification                                                      | **Clean**                             | N/A - Both agree neuroscience is the implementation level.                                                                                                                                                                       |
  | **Debugging Symbols**           | Folk Psychology Concepts (Stripped in "Production Brain")                                 | Useful Labels for Functional States (Can be Mapped, Even if "Stripped")                         | **Mostly Clean**                      | **Distortion:** Assumes symbols *could* exist but were stripped. Eliminativists argue the brain *never* compiled them in the first place. Representationalists see them as recoverable labels.                                 |
  | **Profiling / Kernel Tracing**  | Reveals Low-Level Execution (No Reference to Intent/State)                                | Reveals Execution *of* Intentional/Representational State Machines                              | **Clean**                             | N/A - Both agree this is the low-level data. Interpretation differs.                                                                                                                                                             |
  | **Optimized Variables / Stack Frames** | Beliefs/Desires Optimized Away (No Neural Correlate)                                      | Functional Roles Persist Despite Implementation Changes (Neural Realization Exists)             | **Clean Metaphor**                    | **Distortion:** Optimization is a deliberate engineering choice. Evolution isn't an "engineer" optimizing away representations; it builds mechanisms. Did it ever build "belief" mechanisms? That's the core dispute.           |
  | **"Genuine Intent" (Runtime)**  | Monitoring Dashboards Describe Behavior; No "Intent Process" Exists                       | The Running Process *is* the Intentional System; Dashboards Describe Its Real State             | **Clean for Surface Description**     | **Untranslatable Residue (Core):** What does it *mean* for a process to "genuinely intend"? Is it just complex input-output behavior? Or is there an *internal representational state* causally responsible? Engineering focuses on behavior/function; ontology asks "Is there a *thing* in there?" |
  | **Ontological Claim**           | No neural process corresponds to the `belief` type. It's an empty prediction shorthand. | Specific neural processes *are* tokens of the `belief` type (physical implementation).         | **Untranslatable**                    | **The Crux:** Engineering frameworks describe *levels of abstraction* and *functional behavior*. They are largely **neutral on the ontological reality** of higher-level entities. Does a `Process` object "exist" beyond the kernel's task struct? We use it *as if* it does. |

  **Assessment of the Untranslatable Residue:**

  1.  **Reveals a Genuine Limitation:** Your engineering ontology is fundamentally **functionalist** and **operationalist**. It excels at describing what systems *do* and how they are structured across abstraction layers. It is **agnostic about the metaphysical reality** of higher-level entities. Does a `Process` genuinely exist, or is it just a useful way to talk about a complex, dynamic pattern in kernel structures and CPU state? We treat it as real for practical purposes. This framework lacks the vocabulary to *settle* the philosophical question of whether "belief" refers to a *real, causally potent natural kind* in the brain (like quarks) or is *just* a useful predictive abstraction (like Ptolemaic epicycles). It can describe the *consequences* of each view but not adjudicate the underlying "what is real?" question.
  2.  **Highlights a Substantive Dispute:** While *some* aspects might be verbal (e.g., different definitions of "real"), the core dispute is **substantive** and revolves around **causal explanation and scientific reduction**:
      *   **Eliminativists** argue neuroscience will show beliefs/desires play *no unique causal role*; all behavior is causally explained by lower-level neural mechanisms without invoking them. Invoking "beliefs" is like explaining CPU overheating by referencing "phlogiston overflow" instead of electron mobility and heat dissipation.
      *   **Representationalists** argue that beliefs/desires *are* the causally relevant high-level functional states *implemented by* those neural mechanisms. Explaining behavior *requires* this level, just like explaining a web server crash requires understanding the HTTP request handling process, not just transistor states.
  3.  **Engineering Agnosticism:** Your ontology can comfortably accommodate *both* views as different perspectives on the same system:
      *   **Eliminativist View:** Neuroscience reveals the "raw machine code." Folk psychology is a leaky abstraction layer we should discard for a better one (neuroscience/connectionist models).
      *   **Representationalist View:** Neuroscience reveals the *implementation* of a complex, biologically evolved software system running on wetware. Beliefs/desires are real, high-level functional states within that system.

  **Conclusion:** The untranslatable residue – the core ontological question of whether beliefs/desires are *real natural kinds* or *useful fictions* – reveals a genuine **limitation of the engineering framework to resolve metaphysical questions about what "really exists" at a fundamental level.** It exposes the **functional agnosticism** inherent in your tools. However, the *dispute itself* is substantive, concerning the causal/explanatory power of high-level states and the nature of scientific reduction. Your ontology provides powerful metaphors to understand the *structure* of the debate and the *consequences* of each position for explanation, but cannot, by itself, resolve the underlying ontological question. It shows the debate hinges on interpretations of causality and reduction that go beyond functional description.
