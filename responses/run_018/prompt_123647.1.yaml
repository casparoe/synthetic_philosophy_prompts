answer: |-
  Here’s how I believe Edmund Burke might analyze modern left-right politics, based on his core principles, with confidence assessments and uncertainties flagged:

  ### **Burke's Likely View: The Divide is Superficial, Masking Deeper Fractures**  
  *(Confidence: High - 90%)*  
  Burke would see today’s left/right labels as **"tribal costumes"** obscuring a shared erosion of the social fabric he cherished. His critique:  
  1. **Hyper-Individualism**: Both sides prioritize *individual rights/identity* over communal bonds, tradition, and duty — violating his belief in society as an "eternal contract" between generations.  
  2. **Abstract Idealism**: Left (systemic justice) and right (libertarian purity) both champion **universal theories** detached from local wisdom, history, or human imperfection.  
  3. **Revolutionary Speed**: Social media accelerates change, making politics reactive and unmoored from gradual reform ("a disposition to preserve, and an ability to improve").  

  ### **What "Glues" the Sides? Burke’s Diagnosis:**  
  *(Confidence: Medium - 70%)*  
  He’d argue both coalitions are held together by **shared moral narratives**, but these are flimsy substitutes for organic social cohesion:  
  - **The Left**: United by a narrative of **"progress against oppression"** (climate, identity). Burke would fear its utopianism ignores complexity and risks new tyrannies.  
  - **The Right**: Bound by **"defense of besieged civilization"** (tradition, nation). He’d critique its hollow nostalgia — conserving symbols (flags, slogans) without conserving wisdom or institutions.  
  **Tribal loyalty** (jersey-wearing) is a symptom, not the cause — a *consequence* of lost shared identity.  

  ### **The Real Split Burke Would See: Wisdom vs. Willfulness**  
  *(Confidence: High - 85%)*  
  For Burke, the meaningful divide is between:  
  - **The Prudent**: Those who value **traditions, institutions, and incremental reform** (e.g., Burkean conservatives, pragmatic liberals).  
  - **The Ideological**: Those who impose **abstract blueprints** (Marxist, libertarian, or populist) onto society, disregarding history and human nature.  
  This fault line crosses today’s left/right labels — e.g., a union-supporting Democrat and a Burkean conservative share more than a neoliberal tech baron and a socialist activist.  

  ### **Key Burkean Warnings for 2025:**  
  1. **Climate Crisis**: He’d support *pragmatic stewardship* (conserving nature as inherited order) but reject apocalyptic radicalism.  
  2. **Identity Politics**: Would decry its focus on *group grievance* over shared citizenship, fracturing society into "little platoons" at war.  
  3. **Social Media**: "Digitized mobs" destroy deliberation, civility, and wisdom — the bedrock of Burkean governance.  

  ### **Confidence Breakdown & Least Certain Element:**  
  - **Highest Confidence**: His rejection of left/right as meaningful categories (rooted in his critique of French Revolution factionalism).  
  - **Medium Confidence**: That moral narratives (not tribal loyalty) are the primary glue. Burke valued *embodied traditions*, not abstract stories.  
  - **Lowest Confidence**: **Whether he’d see *any* modern force as truly "prudent"**. His standard was pre-industrial organic society. Today’s pragmatists (e.g., climate adapters, institutionalists) might still strike him as rootless. *(Uncertainty: 50%)*  

  **In essence**: Burke would mourn the loss of **social reverence** — the left sacralizes ideological purity, the right sacralizes a mythic past. Both neglect his core truth: society thrives through *intergenerational humility*, not revolutions of left, right, or algorithm.
