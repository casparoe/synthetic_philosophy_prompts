prompt: |-
  ok so this just got real for me. my grandma died and left me her farm, and i found old papers showing the land was part of a deal tied to a government relocation program in the 50s. now im on my towns historical board and people want us to vote on a resolution saying our town carries collective guilt for it. i dont want to erase what happened, but i think were misusing jasper here. can you argue that a nation can be guilty in jaspers political sense, but that this guilt is strictly institutional — it only exists while the responsible structures are still intact — and it never transforms into personal moral guilt for people born after the fact? instead, anyone who currently benefits from the remaining institutional setup inherits only a role-based duty to repair, not a bloodline stain. please do this in american english, no citations or reading lists, just the reasoning. also sorry for any typos, im typing on my phone with one hand.
