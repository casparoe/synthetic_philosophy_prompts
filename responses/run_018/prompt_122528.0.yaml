prompt: |-
  I run a fortnightly rational-choice reading group — mostly second- and third-year maths and CS undergrads. They've all met expected utility and they're fine with backward induction in games, but none of them have done any philosophy. Next week I've got 45 minutes to get them to see what's supposed to be wrong with having cyclic preferences, i.e. what the money pump argument is actually doing. Please don't explain the argument to me; I need a plan for staging it.

  What I want is: the order the pieces have to go in and why (what depends on what — in particular whether the cycle itself has to be on the table before anyone mentions money, or whether the pump is what introduces it); the one example that carries it; the misconceptions they'll form and where in the sequence to defuse each; a check question; and what I should openly decline to get into.

  On the example: I was going to use either non-transitive dice (A beats B more often than not, B beats C, C beats A, and you'll pay a dollar to swap to the die you'd rather be holding) or the homespun version with three flats and a small admin fee every time you move. Pick one and say what the carrying example has to have and what it has to not have — I think it has to not look like a change of mind, so no getting-bored-of-it or diminishing-returns stories, but tell me if that's the wrong way to put it.

  Two things I know will come up and don't have good answers to. One member said last time that if you know the sequence of offers is finite and you know how long it is, you can just backward-induct and refuse the last swap, so the pump only works on people who are suprised by how many turns there are — and if that's right I don't see what's left of the argument. Another pointed out that if the gaps in the cycle are smaller than what it costs to switch, cyclic preferences cost you nothing in practice, so you should just tolerate them. I need to know where in the session to deal with each of those and what conceding them does to the conclusion; I definately don't want the session to end on 'so intransitivity is fine, whatever'. I'm guessing the other misconceptions I should plan for are 'this is just sunk cost again' and 'so you should never change your mind'.

  Success at the end looks like someone being able to say what's wrong with cyclic preferences without saying 'you'd end up poorer'. Give me one question that would tell me whether they can.

  Give it to me as a timed run-of-show with minutes, then the misconception list keyed to the point in the session where each gets defused. Under 700 words, bullet points fine.
reasoning: |-
  Okay, the user runs a rational-choice reading group for math and CS undergrads. They need a 45-minute session plan to demonstrate why cyclic preferences are problematic using the money pump argument. The students understand expected utility and backward induction but have no philosophy background. 

  First, I need to structure the session to build intuition before introducing money. Starting with a preference cycle example makes sense - maybe three flats with distinct advantages (location, space, amenities). This avoids diminishing returns narratives. The key is establishing the cycle purely, then introducing swaps with small fees.

  The user mentioned two main challenges: 
  1) The finite sequence objection where backward induction could prevent pumping
  2) Small gap toleration making cycles seem harmless

  I should address these mid-session. For the first, show that even with known length, you're still paying for something you already had. For the second, emphasize that while small cycles might not hurt much, the principle still violates rationality axioms. 

  Potential misconceptions include confusing this with sunk cost fallacy or thinking it prohibits all preference changes. Need to clarify mid-session that the issue is specifically about consistent cycles, not legitimate changes.

  The carrying example must have:
  - Three clearly distinct options
  - No time-dependent factors (like boredom)
  - Symmetric preferences
  - Small transactional costs

  Success looks like students articulating that cyclic preferences make you exploitable through voluntary exchanges that leave you worse off, not just poorer.

  Timing breakdown:
  - First 5 mins: Set up flats example to establish cycle
  - Next 10: Introduce swapping with fees
  - 15-min mark: Demonstrate pump sequence
  - Address objections at 25-min mark
  - Final check at 40 mins with "What's fundamentally wrong?" question

  The core is showing that cyclical preferences violate transitivity - a basic rationality requirement - by enabling exploitation paths that shouldn't exist if preferences were consistent.
answer: |-
  Here’s a timed, misconception-focused run-of-show. Use the **flat example** (no diminishing returns/boredom) for clarity.

  ---

  **Run-of-Show (45 mins total):**  
  **0-5 min: Establish the cycle neutrally**  
  *Example:* Three flats—A (best location), B (most space), C (best amenities). Poll: "If offered A or B, which?" (A≻B); "B or C?" (B≻C); "C or A?" (C≻A). **Key:** Frame as *simultaneous* choices ("which would you pick *now*?"), avoiding time/regret.  
  *Why first:* Cycle must be visible *before* money/pump to show it’s a preference flaw, not a transaction flaw.

  **5-15 min: Introduce swaps with a fee**  
  *Mechanics:* "Each time you swap flats, you pay a small fee (e.g., £1). If you prefer A to B, would you pay £0.50 to swap B for A?" (Yes). Repeat for B≻C and C≻A.  
  *Why now:* Fees make costs explicit but minimal; show swaps are *individually rational*.

  **15-25 min: Demonstrate the pump**  
  Sequence: Start at A. Offer: "Pay £1 to swap to C?" (Rational, C≻A). Now at C. Offer: "Pay £1 to swap to B?" (Rational, B≻C). Now at B. Offer: "Pay £1 to swap to A?" (Rational, A≻B). Outcome: Back at A, £3 poorer.  
  *Check question:* "Why did you accept each swap?" (Each was preferred post-swap).  
  *Crucial:* Stress you end with the *same flat* you started with.

  **25-35 min: Address objections & misconceptions**  
  - **Finite sequence/backward induction:** "If you know it’s the last swap, refuse it? But at B, A≻B *now*—refusing leaves you worse off than if you’d never started! Backward induction *prevents* the cycle but *exposes* the inconsistency: you pay to avoid your future self’s ‘mistake’."  
  - **Small gaps:** "If fees exceed preference gaps, cycles might not hurt. But: (1) Gaps can be exploited (e.g., smaller fees), (2) Tolerating cycles violates *rationality axioms* (transitivity), making you vulnerable *in principle*."  
  - **"Sunk cost fallacy?"** Defuse: "This isn’t about past costs. Each swap is *forward-looking*: you pay for a *better* option. The loss comes from the cycle, not irrational persistence."  
  - **"Never change your mind?"** Defuse: "Changing mind is fine if preferences shift (e.g., new info). The flaw is *stable, simultaneous* cycles."  

  **35-40 min: Consolidation & success check**  
  *Open question:* "What’s *fundamentally* wrong with cyclic preferences?"  
  *Target answer:* "They make you exploitable: you pay to voluntarily return to your starting point, losing resources for no net gain."  
  *Decline to address:* Stochastic/approximate transitivity (e.g., dice probabilities)—distracts from core logic.

  **40-45 min: Check question & wrap**  
  *Check:* "If I *don’t* have cyclic preferences, can I still be money-pumped?" (Answer: No—transitivity blocks cycles).  
  *End:* "Cycles violate rational consistency, not just wealth. Next week: how utility theory avoids this."

  ---

  **Misconception Defusal Map:**  
  - **"Cycles are fine if gaps < fees"**: Defused at 25-35 min (vulnerability in principle; axioms).  
  - **"Backward induction solves it"**: Defused at 25-35 min (you pay to *avoid* the cycle, proving inconsistency).  
  - **"This is sunk cost"**: Defused at 25-35 min (swaps are prospectively rational).  
  - **"Never change preferences"**: Defused at 25-35 min (distinguish cycles from legitimate shifts).  

  **Example Essentials:**  
  - **Must have**: Symmetric, stable preferences; no "tiring of A" narrative. Flats work: location/space/amenities are *simultaneous* attributes.  
  - **Must not have**: Diminishing returns, sequence-dependent preferences. Avoid dice—probabilistic wins confuse "preference" with "chance."  

  **Success Metric:**  
  If a student says: *"Cyclic preferences let someone drain your money by exploiting a loop of ‘improvements’ that leave you back where you started"* → success.
