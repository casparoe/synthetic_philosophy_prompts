  Okay, let me approach this systematically. The user is a philosophy professor preparing a workshop defense of an unorthodox view on akrasia as intertemporal bargaining failure rather than character flaw. The audience includes virtue ethicists, behavioral economists, and one Frankfurt-model enthusiast. 

  First, I need to identify the thesis vulnerabilities: The temporal parts ontology will jar with virtue ethicists' unitary self view. The "rationality" claim for hyperbolic discounting directly contradicts behavioral economists' bias framework. The grad student will pounce on Frankfurt-style identification questions. Most dangerously, the theory could be stretched to justify self-harm if future selves seem unreliable - a reductio ad absurdum I must help the professor preempt.

  For the prep sheet structure, objections should be ordered by audience hostility: Virtue ethicists first (foundational disagreement), then behavioral economists (technical challenge), finally Frankfurt's heirarchy (conceptual nitpicking). Each entry needs: objection phrasing, damage rating, tight 2-minute reply, concession notes, and soft spots.

  The suicide question requires special handling - I'll flag it as the "pray nobody asks" item but prepare a triple-layered response: 1) Distinguish reliability from existence 2) Note negotiation breakdown presupposes continuity 3) Emphasize practical rationality's welfare constraints. 

  Throughout, I'll maintain crisp philosophical reasoning while acknowledging where the theory bends (e.g., conceding that "parts" language is metaphorical for bargaining positions). The professor clearly wants tactical defense prep, not citations - so I'll focus on rhetorical strategy over academic references.

  Final polish: Use philosophy-of-action jargon precisely but accessibly. Keep replies modular for easy memorization. Tag soft points honestly so the professor knows where to pivot or withdraw. The concession advice should build credibility by sacrificing non-core points early.
answer: |-
  Here's your Q&A prep sheet, structured for tactical defense. The objections are ordered by likelihood and group alignment, with damage ratings (1-5, 5=critical).

  ---

  **Q&A Prep Sheet: Akrasia as Intertemporal Bargaining Failure**

  **Concession to Make Upfront:**  
  *"I concede that 'temporal parts' is a metaphor, not an ontological claim. My core argument is that *modeling* the self as negotiating subagents explains patterns of akrasia better than character-failure or computational-error models. This doesn't deny the phenomenology of unity, but diagnoses its fragility."*

  ---

  **Objection 1 (Virtue Ethicists - Likely First)**  
  *"Your model fragments the agent. Practical wisdom (phronesis) requires a unified self integrating reason/desire. Calling this 'bargaining' reduces agency to economics and makes virtue impossible."*  
  **Damage:** 4/5  
  **Reply (2-min):** *"Phronesis isn't contradicted—it’s operationalized. A virtuous 'unified self' emerges *from successful bargains* between temporal interests. Think of continence as a ratified treaty, not a monolithic will. My model explains *why* unity fails (negotiation breakdown), whereas virtue ethics often just labels the failure 'incontinence'. This preserves character evaluation: a good agent negotiates fairly across time."*  
  **Soft Spot:** Doesn’t fully address how *moral reasoning* (not just prudence) fits into "bargaining." May feel reductive.  

  **Objection 2 (Behavioral Economists - Likely Second)**  
  *"Hyperbolic discounting *is* computationally irrational. It violates stationarity and leads to dominated choices. Calling it a 'reservation price' ignores that it’s a preference reversal error."*  
  **Damage:** 3/5  
  **Reply (2-min):** *"From the *present self's* perspective, it’s rational to heavily discount an unreliable future partner. If your future self has a 40% chance of defecting on savings, overconsuming now isn’t a bias—it’s game-theoretically sound. Your models assume future compliance; mine addresses strategic uncertainty. Correcting 'bias' without fixing reliability *is* irrational."*  
  **Soft Spot:** Conflates epistemic uncertainty ("will my future self comply?") with discounting inconsistency. Needs clearer metrics for "reliability."  

  **Objection 3 (Frankfurt Enthusiast - Likely Third)**  
  *"This ignores second-order volitions. A will is weak only if it defies your *endorsed* desires, not some 'part.' Your model has no room for identification with higher-order values."*  
  **Damage:** 2/5  
  **Reply (2-min):** *"Hierarchical models *are* bargaining positions! Your 'endorsed desire' is the negotiating stance of your deliberative self *in that moment*. When akrasia strikes, your future self rejects prior commitments not due to weak identification, but because its *new* preferences (e.g., exhaustion, temptation) change its reservation price. Frankfurt’s 'wholeheartedness' is the ceasefire after successful bargaining."*  
  **Soft Spot:** Underplays how identification stabilizes identity; reduces normative authority to bargaining power.  

  **Objection 4 (Virtue Ethicists - Follow-Up)**  
  *"If the 'future self' is unreliable, why should it have moral standing? Your view excuses akrasia by blaming shifting parts, undermining responsibility."*  
  **Damage:** 4/5  
  **Reply (2-min):** *"Responsibility lies with the *whole agent* for failing to construct credible commitments. A person who repeatedly reneges on their own deals is blameworthy *because* they’re a bad negotiator! We already blame people for poor governance (e.g., Ulysses contracts). This isn’t excuse-making—it’s precise diagnosis for better self-governance."*  
  **Soft Spot:** Risks making character a mere negotiation skill. Virtue ethicists will see circularity.  

  **Objection 5 (Behavioral Economists - Follow-Up)**  
  *"In lab settings, we induce hyperbolic discounting *without* uncertainty. People discount hyperbolically even when future payouts are guaranteed. Your reliability story doesn’t fit."*  
  **Damage:** 3/5  
  **Reply (2-min):** *"Two answers: First, 'guaranteed' payouts in labs still rely on *external* enforcement (the experimenter). The agent’s *internal* enforcement may remain dubious. Second, hyperbolic discounting may be a heuristic evolved for unreliable futures—it’s overgeneralized, not irrational in structure. Your data shows *what* happens; my model explains *why* it’s locally rational."*  
  **Soft Spot:** Hand-wavy on evolutionary claims. Needs empirical distinction between intrinsic/extrinsic reliability.  

  ---

  **The Nuclear Question (PRAY NOBODY ASKS):**  
  *"Doesn't this make suicide rational when the 'future self' seems irredeemably unreliable? If my present self faces perpetual bargaining failure with future parts, isn’t exiting the game the optimal move?"*  
  **Damage:** 5/5  
  **Why It’s Deadly:** Turns your model into a reductio ad absurdum where self-destruction is "rational."  
  **Reply (Structured Defense):**  
  1. **Distinguish Reliability from Existence:** *"The model presupposes *ongoing* agency. Suicide isn't a bargaining position; it’s the dissolution of the negotiating parties. No 'present self' can rationally negotiate non-existence because rationality requires temporal extension."*  
  2. **Threshold Claim:** *"Irreducible uncertainty about future selves’ preferences means 'irreliable' is never certain. Destroying potential value is always dominated by hope of future bargaining."*  
  3. **Meta-Framework:** *"Practical rationality *itself* assumes future-oriented welfare. Self-harm violates the axiomatic goal of intertemporal bargaining: maximizing the agent’s cross-temporal utility."*  
  **Soft Spot:** Feels ad hoc. Doesn’t resolve cases of severe, predictable self-sabotage (e.g., addiction).  

  ---

  **Strategic Notes:**  
  - **Pivot to Virtue Ethicists:** Frame bargaining as *how character is built*. "Temporal negotiation is the *mechanism* of habituation."  
  - **Pivot to Economists:** Emphasize "Your bias-correction apps fail because they ignore strategic uncertainty. My model offers better nudges."  
  - **Sacrificial Lamb:** Concede that "rational" here is instrumental, not normative. It explains, doesn’t justify.  
  - **Nuclear Option Mitigation:** Preempt by adding a slide: "NB: This framework assumes *continuity of agency* as a rational constraint."  

  You’re clear-eyed on the vulnerabilities—especially the suicide objection. If it drops, lean hard on the *presupposition of future agency* as a necessary axiom. Good luck!
