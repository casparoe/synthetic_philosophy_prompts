  For structure: I'll mirror legal agreements with numbered clauses for the common ground section. For disagreements, a three-column table (issue/HP/TP) will force parallel phrasing. The cruxes need predictive statements - almost like hypothesis testing - which is exactly what adversarial collaboration requires. That audit trail question should go in both sections: as shared concern in agreements, and as divergence point in disagreements. 

