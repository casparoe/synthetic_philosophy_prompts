answer: |-
  I argue that the **reflexive-Lewisian framework successfully distinguishes genuine conventions from habits and coercion**, providing a powerful explanation for the fragility of democratic norms like peaceful concession and loyal opposition. Crucially, it explains why these norms collapse precisely when second-order accountability erodes, as seen in democratic backsliding globally. Here’s why:

  ### Core Argument: Accountability as the Lifeline of Democratic Conventions
  Democratic norms are not mere behavioral patterns; they are **reflexive practices** sustained by mutual accountability. The framework’s requirement of *second-order common knowledge*—where actors know they are accountable to each other for upholding the norm, and that this accountability *is itself part of the convention*—captures this essence:
  - **Peaceful concession** is not just a habit of stepping down. It relies on losers knowing winners *expect* concession, that the public *holds them accountable* for conceding, and crucially, that defiance would violate a shared understanding of reciprocal obligation (e.g., "I concede because I know you would hold me in contempt if I didn’t, and this expectation binds us both").
  - **Loyal opposition** demands that losers criticize policy, not legitimacy. This collapses when actors no longer feel accountable for maintaining "loyalty" (e.g., when a leader labels opposition "treasonous," destroying mutual accountability).

  ### Why This Distinguishes Conventions from Alternatives
  1. **vs. Habits**: Habits lack second-order accountability. Driving on the right is habitual; no one holds you accountable for "upholding the driving norm." But democratic norms *require* enforcement: if a loser refuses to concede, others must sanction them (e.g., public condemnation, institutional checks). Without this accountability, the behavior is mere ritual.
  2. **vs. Coercion**: Coercion relies on asymmetric power, not mutual accountability. A currency used under threat of state violence isn’t a convention. Similarly, if a dictator "concedes" due to fear of coup/revolution, it’s not democratic convention. Reflexive conventions demand *symmetric* accountability: *all* participants enforce the norm, including the powerful (e.g., voters sanction norm-breaking leaders).

  ### Explaining Fragility and Collapse
  Democratic norms unravel when **second-order accountability is eroded**:
  - **Erosion Mechanism**: When actors (especially elites) violate accountability—e.g., leaders refusing to condemn norm-breaking allies, media amplifying false "stolen election" claims—it destroys common knowledge of mutual enforcement. Followers then defect, believing others won’t hold them accountable.
  - **Real-World Fit**: 
    - The collapse of peaceful concession in the 2020 U.S. election stemmed directly from eroded accountability: one faction refused to enforce norms ("rigged election" rhetoric), and allies failed to sanction them. 
    - In Hungary or Turkey, democratic norms collapsed not because behaviors changed overnight, but because ruling parties systematically dismantled institutions (courts, media) that enabled mutual accountability.

  ### Addressing the Strongest Counter-Argument
  **Counter-Argument**: "The epistemic demands are unrealistically high. Real actors lack second-order common knowledge; they act on self-interest or ideology, not abstract mutual accountability. The distinction is theoretically elegant but empirically empty."

  **Response**: This misunderstands the framework’s practicality. Second-order accountability operates through **tangible mechanisms**:
  1. **Institutions as Accountability Vehicles**: Courts, legislatures, and free media *embody* mutual accountability. When these function, actors *know* norm-breaking will be sanctioned (e.g., courts overturning power grabs). Their erosion *is* the erosion of reflexive convention.
  2. **Public Discourse as Common Knowledge Generator**: Statements like "concession is the American tradition" or "institutions must be respected" *reinforce* shared accountability. When elites weaponize discourse (e.g., "elections are rigged"), they shatter this knowledge.
  3. **Self-Interest Aligns with Accountability**: Actors often uphold norms because *reputation* and *coalition-building* depend on being seen as accountable. When accountability mechanisms weaken (e.g., polarized media shields norm-breakers), self-interest drives defection.

  While individuals may not philosophize on "second-order knowledge," their behavior responds to whether violations are *enforced*. The 2021 U.S. Capitol riots demonstrate this: the initial norm collapse occurred when accountability failed (e.g., muted GOP criticism of Trump), but subsequent impeachments and indictments illustrate attempts to *restore* it.

  ### Conclusion
  The reflexive-Lewisian framework succeeds because **accountability is the oxygen of democratic conventions**. Without second-order common knowledge of mutual enforcement—embodied in institutions, discourse, and reciprocal sanctions—norms like peaceful concession degrade into habits (empty rituals) or coercion (power struggles). This explains why democratic backsliding begins with attacks on accountability (courts, media, electoral integrity) and accelerates when elites evade sanctions. The framework is not just theoretically sound but empirically vital: diagnosing norm fragility requires focusing on the erosion of the *reflexive pact* that binds democratic actors.
