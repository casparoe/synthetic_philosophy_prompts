        "Looping effects make diagnoses more 'accurate' over time in a self-reinforcing manner.",
        "MPD's rise/collapse is a key case study for looping effects.",
        "Social media accelerates looping beyond clinical control (modern relevance)."
      ],
      "subtle_distortions": [
