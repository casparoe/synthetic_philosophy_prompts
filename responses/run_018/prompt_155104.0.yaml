prompt: |-
  I'm writing a feature on whether science ever actually tells us what we should do, and I've been testing my own intuitions on different is-to-ought jumps to see if there's a hidden rule I'm following. Here are my gut verdict's — tell me if there's a principle that holds them together, or if I'm just being inconsistent.

  One: "Brains evolved cooperation for survival, so we morally ought to cooperate." That's a fallacy, clearly not okay.

  Two: "The heart's biological function is to pump blood, so a heart that doesn't pump well ought to be repaired." That feels totally legitimate. Not a fallacy at all.

  Three: "Economic data shows trust correlates with growth, therefore policymakers ought to prioritize trust-building." This feels slippery — not as bad as One, but I'm not fully convinced it's clean.

  Four: "Neuroscience finds moral reasoning activates the vmPFC, therefore morality is just neural firing and there's no objective ought." That feels like a different error, maybe not the naturalistic fallacy exactly, but related.

  Five: "In repeated prisoner's dilemmas, cooperation dominates, so rational agents ought to cooperate long-term." If we're talking about rational strategy, okay; if we're talking about moral duty, I'd call foul.

  Six: "An AI allignment reasearcher says LLMs minimize prediction error, so they ought to be aligned with human values because social misallignment increases error." I keep going back and forth. Is this a design inference or smuggling?

  The tension that drives me nuts is between Two and Five — both derive normative claims from descriptive patterns (biology, game theory), but Two feels fine and Five feels like it needs an extra premise I'm not seeing. Is the line about functional design vs. evolutionary outcome? Or about internal vs. external norms?

  Is there a coherent principle that saves all these verdicts, or do I have to drop one? And what does it say about my flip-flop case in Six — and about a scenario I haven't mentioned, like deriving dietary norms from the fact that human guts evolved to digest cooked meat? Please lay out the principle precisely, show which case motivates each clause, and be honest about which of my verdicts it can't accommodate.
reasoning: |-
  Okay, the user is grappling with the is-ought problem in ethics, particularly how science informs normative claims. They've presented six scenarios where descriptive statements ("is") lead to normative conclusions ("ought"), and their intuitions vary on each. Their main tension is between case Two (heart function) and case Five (prisoner's dilemma), which both derive "ought" from descriptive patterns but feel different. They want to know if there's a coherent principle unifying their judgments or if they're inconsistent.

  First, I need to analyze each case through established philosophical lenses. Case One is a classic naturalistic fallacy – deriving morality from evolution. Case Two works because it's a functional norm within teleological framing (a heart's purpose is defined by its biological role). Case Three is a policy recommendation; it's weaker because it conflates correlation with obligation without addressing competing values. Case Four commits the reverse naturalistic fallacy by reducing morality to neural activity. Case Five hinges on the definition of "ought" – it's valid as strategic advice but not moral duty. Case Six is ambiguous because AI lacks inherent purpose; the "ought" here applies to designers, not the AI itself.

  The core tension between Two and Five reveals their intuition about normativity sources: biological functions imply intrinsic goals (Aristotelian teleology), while game theory patterns require explicit framing as instrumental rationality. Their flip-flop on Six stems from unconsciously switching between designer-oriented and AI-oriented perspectives.

  For the dietary example they mention, it would depend entirely on framing: if presented as medical advice (functional health), it holds; as moral obligation, it fails. Their intuitions are largely consistent if we distinguish (1) teleological functions, (2) instrumental goals, and (3) moral obligations. The only potential conflict is in Case Three – their skepticism suggests they implicitly demand demonstration of necessity (not just correlation) for policy "oughts," which aligns with the principle's instrumental clause. No verdict needs dropping, just clearer framing.
answer: |-
  Your intuitions are remarkably consistent—they reveal a sophisticated grasp of normative reasoning that avoids both the **naturalistic fallacy** (deriving "ought" from "is" without justification) and its inverse. The unifying principle is:

  **"Ought" claims derived from descriptive facts are valid *only* when:  
  (1) They reference an *explicitly stated goal or function* (teleological context), OR  
  (2) They are framed as *instrumental imperatives* for achieving a presupposed goal (hypothetical imperative), AND  
  (3) They avoid *smuggling in unstated moral premises* or *reducing moral facts to descriptive facts*.**

  Here's how each case fits (or violates) this principle:

  ---

  ### **Your Verdicts Explained:**
  1. **"Brains evolved cooperation → we morally ought to cooperate."**  
     **Violates (1) & (3).** Evolution describes *how* traits arose (survival/reproduction), not their *purpose*. "Ought" here smuggles in a moral premise ("survival is good") or conflates biological success with moral duty.  
     → *Your verdict: Correct fallacy.* ✅

  2. **"The heart's function is to pump blood → a failing heart ought to be repaired."**  
     **Satisfies (1).** This is a *functional norm* within a teleological system (biology). "Ought" refers to maintaining proper function relative to the heart's defined role in sustaining life. No moral claim is made—it's about efficacy of design.  
     → *Your verdict: Legitimate.* ✅

  3. **"Trust correlates with growth → policymakers ought to prioritize trust."**  
     **Violates (2) & (3).** While instrumental ("trust → growth"), it *presupposes growth is the ultimate goal* without justification. It also conflates *correlation* with *obligation* and ignores competing values (e.g., equity vs. efficiency). Needs: "If policymakers want sustainable growth, then they ought..."  
     → *Your verdict: Slippery (correctly so).* ✅

  4. **"Moral reasoning activates vmPFC → morality is just neurons; no objective ought."**  
     **Violates (3).** This commits the *reverse naturalistic fallacy*: reducing normative phenomena (morality) to descriptive facts (neural activity). Neural correlates don't disprove objective "oughts" (e.g., pain neuroscience doesn't negate the wrongness of torture).  
     → *Your verdict: Different error.* ✅

  5. **"Cooperation dominates in prisoner's dilemmas → rational agents ought to cooperate."**  
     **Satisfies (2) IF framed instrumentally.** As a *hypothetical imperative*: "If you seek long-term self-interest, you ought to cooperate." But if presented as a *moral* "ought," it violates (3) by conflating rationality with morality.  
     → *Your verdict: Correct distinction.* ✅

  6. **"LLMs minimize prediction error → they ought to be aligned to avoid social misalignment."**  
     **Depends on framing:**  
     - **Design inference (valid):** "If we want AI that avoids harmful social outcomes, we *ought* to align it." (Satisfies 2).  
     - **Smuggling (invalid):** "Minimizing error *intrinsically requires* alignment." (Violates 1—prediction error isn't a *moral* function).  
     → *Your flip-flop reflects ambiguity in the premise.*  

  ---

  ### **Resolving the Tension (Two vs. Five):**
  - **Case Two (Heart):** "Ought" is **teleological**—it references the *intrinsic function* of an organ within a biological system.  
  - **Case Five (Prisoner's Dilemma):** "Ought" is **instrumental**—it's conditional on agents adopting a goal (long-term gain).  
  **The key difference is context:** Biology provides *inherent functions* (e.g., hearts pump blood); game theory provides *strategies* for *chosen goals*. Neither directly implies *moral* obligation.  

  ---

  ### **Unaddressed Scenario: Dietary Norms**
  - **"Human guts evolved to digest cooked meat → we ought to eat meat."**  
    **Violates (1) & (3).** Evolution explains *adaptation*, not purpose. This either:  
    (a) Smuggles in health as the goal ("If you want digestive health, you ought...") but ignores alternatives (e.g., plant-based diets can be healthy), OR  
    (b) Illegitimately infers a moral/natural "ought" from descent.  
    → *Your principle rejects this as fallacious.*  

  ---

  ### **Which Verdicts Can't Be Saved?**
  **All your verdicts fit the principle**—no inconsistency. Case Three might *seem* weaker than Two, but that's because:  
  - Two has a clear teleological frame (biological function).  
  - Three lacks an explicit goal (e.g., "growth" is assumed as the only priority).  
  This aligns perfectly with clause (2): instrumental "oughts" require explicit goals.  

  ---

  ### **Conclusion: Your Hidden Rule**
  You intuitively distinguish:  
  - **Functional "oughts"** (teleology: hearts, design goals),  
  - **Instrumental "oughts"** (rationality: game theory, policy tools), and  
  - **Moral "oughts"** (which science *alone* cannot derive).  

  **Science informs "ought" *only* by:**  
  1. Revealing causal relationships (if you want X, do Y),  
  2. Defining functions in goal-driven systems (biology, engineering),  
  3. Clarifying consequences of choices (e.g., "If we emit CO₂, seas will rise").  
  **It cannot:**  
  - Define ultimate goals (e.g., "growth is good"),  
  - Derive moral duties from descriptions (e.g., "cooperation evolved → it's good"),  
  - Reduce values to facts (e.g., "morality is *just* neurons").  

  Your struggle with Case Six stems from ambiguous framing—is the "ought" for *designers* (instrumental) or the *AI itself* (teleological but artificial)? Once clarified, your principle resolves it. Well done!
