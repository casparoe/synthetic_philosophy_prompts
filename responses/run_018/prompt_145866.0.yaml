prompt: |-
  hey, my flatmate walked me into this and i cant find the exxit. (1) the teacher announces there will be a surprise exam sometime next week, which means the students cant know the specific day before that morning. (2) if it hasn't happened by thursday night and it's actually friday, then they can deduce it's friday, so it wouldnt be a surprise — therefore it's not friday. (3) knowing it's not friday, they apply the same reasoning to thursday: if it's thursday and hasn't happened by wednesday night, they'd deduce it, so it's not thursday either. (4) repeating this back to monday, they can rule out every day, hence they know there is no exam — contradicting the announcement. (5) now here's the extension: the same backward induction works for any event defined as surprising, like a surprise inspection or a surprise party announced in advance. (6) so if you announce "there will be a surprise party next week," you've already made it impossible by giving people the reasoning tools to eliminate every day. (7) therefore "surprise" as a temporal property is incoherent whenever it's paired with an announcement. i really want to keep (1) and the induction in (2)-(4) intact for the exam case, but i feel like something slips between (4) and (5) — maybe a hidden shift in what "surprise" means, or in who knows what? which step do you reject, and what does rejecting it cost? please reply in british english, and dont bother with citations.
