  First, I need to dissect where the paradox truly unravels. The user specifically wants to save steps (1) through (4) - which means the exam induction must hold. That forces me to scrutinise step (5). When we shift from exams to parties, what changes? 

  Ah, the enforcement mechanism disappears. Exams are institutionally binding - the teacher must administer it, and students know this. But surprise parties? The "must happen" premise crumbles. Anyone could cancel the party last minute without professional consequence. This difference in commitment feels crucial.

