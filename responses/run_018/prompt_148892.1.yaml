answer: |-
  Here’s a conceptual taxonomy based on commitments, with 6 terminal positions. Branches reflect irreducible tensions in the literature:

  **Root Question:** Does collective remembrance of a past wrong serve a moral purpose outliving the direct victims?  
  **→ First Split (Obligation Target):**  
  &nbsp;&nbsp;◉ **Owed primarily to victims**  
  &nbsp;&nbsp;◉ **Owed primarily to descendants of perpetrators**  
  &nbsp;&nbsp;◉ **Owed primarily to present/future bystanders**  

  **→ Second Split (Form of Remembrance):**  
  &nbsp;&nbsp;◉ **Must be institutional** (state rituals, monuments, curricula)  
  &nbsp;&nbsp;◉ **Private/familial transmission suffices**  

  **→ Third Split (Permissibility of Active Forgetting):**  
  &nbsp;&nbsp;◉ **Never permissible**  
  &nbsp;&nbsp;◉ **Permissible only after material reparations**  
  &nbsp;&nbsp;◉ **Permissible if remembrance fuels present conflict**  

  ---

  ### Terminal Positions (Leaves):  
  1. **Victims + Institutional + Never Forget**  
     *Defender:* **Margalit-style "Thick Remembrance"**  
     *Awkward commitment:* Mandating descendants of perpetrators to fund monuments that may traumatize *their* own children.  

  2. **Victims + Private + Never Forget**  
     *Unnamed* (e.g., some communalist or indigenous positions)  
     *Awkward commitment:* Allowing perpetrator-descendant families to privately abandon remembrance once victims' direct lineages end.  

  3. **Perpetrator-Descendants + Institutional + Forget After Reparations**  
     *Unnamed* (e.g., implied in some German *Vergangenheitsbewältigung* debates)  
     *Awkward commitment:* Removing a memorial survivors still visit because reparations are deemed "complete."  

  4. **Perpetrator-Descendants + Private + Never Forget**  
     *Unnamed*  
     *Awkward commitment:* Requiring great-grandchildren to perform private atonement rituals for crimes they struggle to feel connected to.  

  5. **Bystanders + Institutional + Forget if Conflict**  
     *Defender:* **Rieff-style "Strategic Forgetting"**  
     *Awkward commitment:* Removing a memorial central to victims' identity because it angers a group *currently* using it to justify violence.  

  6. **Bystanders + Private + Permissible After Reparations**  
     *Defender:* **Minimalist consequentialism** (e.g., some realist policy positions)  
     *Awkward commitment:* Opposing school curricula about historical wrongs once reparations are paid, even if private denialism surges.  

  ---

  ### Problem Areas in the Taxonomy:  
  - **Blurred Distinction:** "Owed to victims" vs. "owed to bystanders" often collapses when victims *are* present bystanders (e.g., ongoing structural harm). The tree artificially separates these.  
  - **Empty Branch:** **Perpetrator-Descendants + Institutional + Forget if Conflict** is incoherent—institutional remembrance targeting perpetrators implies public accountability, contradicting strategic suppression.  
  - **Underpopulated:** "Private + permissible forgetting" branches lack defenders; privatization usually implies resisting *imposed* forgetting.  

  ### Key Tensions Highlighted:  
  - The victim/perpetrator-descendant split clashes when victims demand recognition *from* perpetrators (e.g., Margalit vs. Rieff).  
  - Institutional commitments prioritize social stability/solidarity; private commitments prioritize autonomy—but risk fragmentation.  
  - "Forgetting if conflict" directly opposes "never forget" on whether memory is inherently moral or instrumentally risky.  

  This framework isolates core disagreements without requiring textual references, centering on *who* duties bind, *how* they manifest, and when forgetting becomes a moral tool.
