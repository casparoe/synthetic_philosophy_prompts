answer: |-
  ## After-Dinner Speech: Ten Years of Welcome

  **(Setting down glass, smiling at the room)**

  Good evening, everyone. Thank you for being here to mark ten years of our town’s refugee sponsorship partnership. Ten years! Look around this room. Volunteers, past and present. Families who found safety and a start here – welcome, we are so glad you are with us tonight. Mayor, Councillors, colleagues, friends, neighbours... this is the community that made this happen. Seeing you all together, that’s the real celebration.

  Ten years ago, a few of us saw a need and believed our town could meet it. Not perfectly, but practically. We set a simple principle: when our partner agency identifies families fleeing danger, we draw names by lot. We don't pick and choose who 'fits'. We publish the numbers we *couldn't* take, because transparency matters. We take the next family, and then we organise. We find housing. We teach language. We befriend. That’s the work in this room.

  **(Slightly more reflective tone)**

  Some of you know I studied under Sir Michael Dummett. His work on refugees is complex. He argued nations have a right to control borders, based on the idea of a limit – an "absorption capacity" – beyond which integrating newcomers becomes difficult, harming everyone. He also insisted that most opposition to immigration is rooted in prejudice, and that anyone arguing for limits must show *why* those limits would apply equally to anyone, regardless of origin. And crucially, he held that the claim of someone fleeing persecution is utterly different, and vastly stronger, than someone simply seeking opportunity. A refugee’s need is categorical.

  **(Shifting to a firmer, practical tone)**

  Here’s what we’ve learned over ten years: **Capacity isn’t something we just *find*; it’s something we *make*.** It’s built by the hours volunteers spend helping with homework or navigating the shops. It’s built by landlords offering a fair tenancy. It’s built by teachers and neighbours making space. It’s built by the language classes we arrange and attend. A community that doesn’t build these things, and then points to its empty hands saying “we’re full”, isn’t stating a fact; it’s confessing a choice. We choose to build.

  **(Addressing the room directly)**

  So how do we know the difference between being genuinely at capacity and just being unwilling? Look at the practical effort. Are we actively creating the housing links, the language support, the networks of friendship that make integration possible? Or are we letting those things wither and then saying “no room”? Our partnership exists because we chose to build that capacity, year after year. We chose to make room. That choice *is* our capacity.

  **(Addressing the wider concern without naming names)**

  This matters when reasons are given for limiting welcome – reasons like pressure on schools, or changes to a town’s character. The question isn't whether pressures exist; they do. The question is whether we are *choosing* to address them, or whether we are using them as an excuse to stop. And the test, as my teacher insisted, must be this: would the same pressure, the same concern about character, be raised with the same force if the newcomers looked different, or worshipped differently? If the answer isn’t a clear ‘yes’, then we need to look harder at our reasons.

  **(Moving towards the ask)**

  Integration isn’t magic. It doesn’t happen automatically at the one-year mark when official support often ends. That’s exactly when the hard work of *becoming neighbours* deepens – or falls apart. We lose too many volunteers after that first, intense year. But that second year? That’s often when trust blossoms, when shared understanding grows, when newcomers truly start to feel *settled*, and when volunteers discover the deeper rewards of friendship.

  **(Clear, direct call to action)**

  So, here’s our concrete task tonight, the next piece of capacity we need to build: **We need more second-year befrienders.** If you’ve been part of this in the past, consider stepping back in. If you’ve watched from the sidelines, now is the time. Sign up at the table by the door before you leave, or talk to one of the committee members. One more year. That commitment – that choice to build connection – is how we turn shelter into belonging. It’s how we prove that capacity is made, not found.

  **(Raising glass)**

  To ten years of making room. To the families who trusted us with their new start. To every volunteer who built a classroom, moved furniture, shared a meal, or simply offered a friendly word. To choosing to build capacity. And to the next year, and the next family, and the friendships yet to be made. Thank you.

  ---

  **Notes on Potential Out-of-Context Quotations:**

  1.  **"Capacity isn’t something we just *find*; it’s something we *make*."**
      *   **Out of Context:** Could be presented as denying any practical limits exist, suggesting infinite obligation. ("Activist claims town can take unlimited refugees!")
      *   **In Context:** Argues that limits are defined by active community effort and resource allocation, not passive discovery, challenging complacency.

  2.  **"A community that doesn’t build these things... isn’t stating a fact; it’s confessing a choice."**
      *   **Out of Context:** Could be framed as accusing *any* community citing pressures of bad faith or racism. ("Speaker brands town council racist!")
      *   **In Context:** Draws a distinction between genuine, effort-addressed constraints and constraints used as justification for inaction, applying Dummett's own test implicitly.

  3.  **"...would the same pressure... be raised with the same force if the newcomers looked different...? If the answer isn’t a clear ‘yes’, then we need to look harder at our reasons."**
      *   **Out of Context:** Easily presented as a direct accusation of racism against specific policymakers. ("Philosopher accuses council of prejudice over refugee cap!")
      *   **In Context:** Invokes Dummett's principle as a necessary test for *any* restriction argument, focusing on the reasoning itself, not labelling individuals.

  4.  **"We need more second-year befrienders... That commitment... is how we turn shelter into belonging."**
      *   **Out of Context:** Could be spun as admitting current efforts fail or that refugees aren't integrating. ("Sponsorship leader admits programme failing integration!")
      *   **In Context:** Highlights a specific, known point where support often weakens (year two) and frames sustained befriending as the *active mechanism* for successful integration, which requires continuous effort.
