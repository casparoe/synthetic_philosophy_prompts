answer: |-
  Here’s your Q&A prep sheet, ordered by damage potential and tailored to your audience’s priorities. Replies prioritize empirical/comparative framing over philosophy.

  ---

  ### **Q&A Prep Sheet: Top 6 Objections**  
  *(Ordered: Most → Least Damaging)*  

  1. **Objection (Micro-Foundations Gap):**  
     *"You posit citizens implicitly trade liberties for future gains, but where’s the behavioral evidence? Without micro-level survey data or experimental work showing explicit intergenerational trade-off calculations—especially in low-information environments—this remains a ‘just-so’ story vulnerable to preference falsification or adaptive preferences."*  
     **Reply (2 min):** "Valid concern. We infer the mechanism from revealed preferences: sustained compliance despite awareness of rights deficits (e.g., Chinese netizens critiquing corruption but not CCP monopoly), intergenerational investment patterns (e.g., skewed household savings for children’s mobility), and elite rhetoric framing sacrifice as ‘for the next generation.’ While direct survey evidence is scarce due to measurement challenges, we can test observable implications: when growth falters (e.g., China’s 2022 slowdown), protests increase not for democracy *per se* but for restored opportunity (e.g., youth ‘lie flat’ movement). Partnering with ethnographers for discursive analysis could strengthen micro-foundations."  
     **Soft Spot:** Reliance on indirect inference; no RCT/panel data.  
     **❗ Dreaded Question**  

  2. **Objection (Conceptual Stretching):**  
     *"Lumping China’s party-state repression with Singapore’s rule-by-law technocracy under one ‘intertemporal reciprocity’ label risks stretching the concept. Singapore’s PAP has won competitive (if skewed) elections since 1965—doesn’t this violate your ‘authoritarian’ premise? How is this not just performance legitimacy with a temporal wrapper?"*  
     **Reply (2 min):** "Singapore is a critical case precisely because it *blurs* categories. Even with elections, opposition is structurally marginalized (GRCs, defamation suits), and legitimacy is explicitly premised on delivering intergenerational gains (‘vote for your grandchildren’). The mechanism’s core is the *conditional bargain*, not regime type: when Singapore’s growth slowed in 2011, PAP’s vote share dropped 7%—its lowest ever—driven by youth anger over mobility barriers. China’s ‘common prosperity’ push post-2021 similarly signals fear of broken intergenerational promises."  
     **Soft Spot:** Singapore’s semi-competitive features complicate authoritarian classification.  
     **✅ Concede Up Front** to show conceptual awareness.  

  3. **Objection (Endogeneity/Identification):**  
     *"Isn’t growth endogenous to authoritarian control? You claim broken reciprocity → collapse, but if autocrats suppress dissent *because* growth stalls (e.g., Xi’s repression post-2015), coercion is the confounder. How do you disentangle reciprocity from repression?"*  
     **Reply (2 min):** "Key test: timing and framing of dissent. In reciprocity collapse, initial protests target specific broken promises (e.g., local pension defaults, credential inflation devaluing education investments), not regime change. Escalation to systemic demands follows state repression, not precedes it—seen in China’s 2022 ‘white paper’ protests (anti-zero-COVID → pro-democracy after crackdowns). Natural experiments like commodity shock-driven slowdowns in resource-dependent regions can help identify reciprocity effects net of repression."  
     **Soft Spot:** Hard to measure repression intensity independently.  

  4. **Objection ("Performance Legitimacy" Redundancy):**  
     *"This sounds like performance legitimacy with extra steps. Why introduce ‘intertemporal reciprocity’ when existing models already explain authoritarian stability via outputs (e.g., Svolik 2012) or social contracts (e.g., Tsai 2007)?"*  
     **Reply (2 min):** "Performance legitimacy treats support as static approval of outputs. Reciprocity is *relational* and *forward-looking*: (1) It explains why citizens tolerate *present* sacrifices, (2) predicts backlash when future gains are jeopardized *even if current conditions are stable*, and (3) distinguishes between regime failure (broken promise) and ideological failure (demand for rights). Example: China’s 1989 protesters were beneficiaries of growth but feared intergenerational backsliding under inflation/corruption."  
     **Soft Spot:** Conceptual distinction not yet backed by comparative metrics.  

  5. **Objection (Rational Ignorance Alternative):**  
     *"Why isn’t this just rational ignorance? Citizens accept autocracy because monitoring governance is costly, and growth provides side payments. If growth stalls, information costs drop, revealing latent opposition—no ‘reciprocity’ needed."*  
     **Reply (2 min):** "Rational ignorance explains apathy, not active complicity. Reciprocity captures why citizens *invest* in the regime (e.g., Chinese parents pushing children into Party youth leagues for future returns). Stalled growth doesn’t just reduce information costs—it constitutes a *breach of trust*, triggering moral outrage (e.g., ‘we held our end, you didn’t’). Survey data shows East Asian citizens frame grievances as betrayal, not newfound awareness (World Values Survey: ‘unfairness’ > ‘ignorance’)."  
     **Soft Spot:** Overlaps with trust-based models; needs attitudinal testing.  

  6. **Objection (Demand-Side Neglect):**  
     *"You focus on regime supply of prosperity, but ignore demand-side variation. Why do some cohorts (e.g., urban Chinese millennials) protest mobility declines, while others (e.g., seniors) stay quiescent? Doesn’t this require disaggregating ‘citizens’ into winners/losers?"*  
     **Reply (2 min):** "Absolutely—reciprocity’s salience varies by cohort exposure to growth promises. Younger cohorts socialized during boom years (post-1990 China, post-1980 Singapore) internalize intergenerational bargains most acutely. Seniors may prioritize stability over mobility. We see this in differential protest participation: youth dominate anti-unemployment actions, not anti-corruption rallies. Future work should integrate cohort effects and subnational inequality data."  
     **Soft Spot:** Currently group-level; lacks individual demographic controls.  

  ---

  ### **Strategic Notes:**  
  - **Concede Early:** Admit Singapore’s hybridity (Objection #2) to show methodological reflexivity.  
  - **Conceptual Distinctions:** Replies to #4 (performance legitimacy) and #6 (demand-side) rely heavily on conceptual nuance. Preempt with phrases like *"Mechanistically, this differs because..."*  
  - **Empirical Pivot:** When philosophy-adjacent (e.g., consent), redirect to testable claims: *"Operationalized, this predicts protest patterns shifting from specific grievances to systemic demands after state violence—here’s the data..."*  
  - **The "Dreaded" Reply:** For #1 (micro-foundations), emphasize that the mechanism is inferred from (a) elite discourse analysis, (b) protest semantics, and (c) policy shifts (e.g., from "getting rich" to "common prosperity"). Offer collaboration: *"This is why I’m seeking partners for survey experiments on intergenerational framing."*  

  **Audience Tailoring:** For rational-choice modelers, stress the temporal discounting element. For the sociologist, highlight path-dependency in East Asian development states. For institutionalists, focus on the conditional nature of legitimacy claims as a variable.
