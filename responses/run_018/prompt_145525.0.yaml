prompt: |-
  Since Parfit's non-identity problem demonstrates that identity-affecting choices cannot be evaluated by comparing the welfare of specific counterfactual individuals, I've been assuming this eliminates the person-affecting route to intergenerational obligations but leaves an impersonal average-utilitarian path intact. However, I'm now second-guessing whether the problem actually undermines both. If a global climate treaty shifts conception patterns such that the population in 2150 is entirely different from what it would have been under business-as-usual, then comparing the average welfare of the actual 2150 population to the counterfactual one requires selecting a reference class — do I include only humans born after 2100, or all sentient beings affected by the climate trajectory? And if the treaty also alters wild animal populations in ways that change which specific animals come to exist, doesn't the choice of reference class become arbitrary in exactly the way the identity problem warns us about? So my question is: does the non-identity problem only block harm-based arguments to future people, or does it also destabilize impersonal aggregation by showing that any cross-world comparison requires an unjustified specification of who counts? Lead with the bottom line in the first sentence, then give the reasoning, with no preamble and no restating of the question.
reasoning: |-
  Okay, the user is grappling with Parfit's non-identity problem and its implications for intergenerational ethics, specifically regarding climate policy. They thought it only affected person-affecting approaches but now suspect it might also undermine impersonal average utilitarianism. Their core concern is whether cross-world welfare comparisons require arbitrary reference class selection when identities shift.

  Hmm, this is sophisticated philosophy territory. The user clearly understands the basics: Parfit showed we can't harm future people by policy changes that alter who exists, since those individuals wouldn't exist otherwise. But they've spotted a deeper issue - when comparing average welfare across different possible futures, who do we include in the calculation? Humans born after 2100? All sentient beings? The identity shift affects animals too, making reference class selection seem arbitrary.

  I recall Parfit himself wrestled with this in Reasons and Persons. The key point is that average utilitarianism avoids comparing specific individuals across worlds - it just compares statistical aggregates. But as the user notes, the aggregate's composition depends entirely on how we define the population. If climate policy changes wild animal populations, do we count those welfare changes? There's no non-arbitrary answer.

  The user's insight is correct: this isn't just about harming individuals. Even impersonal aggregation becomes unstable because the denominator (who counts) shifts with policy choices. When they mention "unjustified specification of who counts," they're touching on what philosophers call the "problem of the reference class." 

  I should confirm their suspicion: yes, the non-identity problem does destabilize impersonal approaches too, precisely because cross-world comparisons require fixing a reference class, but the identity effect makes any choice arbitrary. Climate treaties don't just create different humans - they create different ecosystems with different sentient beings. Comparing "average welfare" between such worlds is like comparing averages between entirely different universes.

  The user seems analytically sharp - they've moved beyond textbook understanding to see how deep the rabbit hole goes. Their worry about policy implications is valid too. If both person-affecting and impersonal approaches struggle here, what foundation remains for intergenerational obligations? That's the next logical question, though they haven't asked it yet. Maybe they're preparing to explore contractualist or rights-based alternatives.
answer: |-
  **The non-identity problem destabilizes both person-affecting harm arguments *and* impersonal aggregation like average utilitarianism for intergenerational choices.** While average utilitarianism avoids comparing specific individuals across worlds, it still requires comparing the welfare of *different* populations existing in different possible futures. This necessitates defining a fixed "reference class" (e.g., "humans born after 2100" or "affected sentient beings") whose welfare is aggregated and averaged in each world.

  However, the non-identity problem ensures that identity-affecting choices (like climate treaties) fundamentally alter the composition of *who exists* within any plausible reference class. Comparing the average welfare of group A (actual future beings) to the average welfare of group B (counterfactual future beings) is comparing distinct populations. There is no non-arbitrary, identity-independent way to define the reference class itself – including *which sentient beings* count (e.g., future humans vs. wild animals whose existence is also identity-affected). Choosing one reference class over another (e.g., only humans vs. all sentient beings) is arbitrary in the context of cross-world comparisons because the policy choice determines *who* is a member of the group being aggregated in each world. This makes the average welfare comparison itself dependent on an unjustified specification of the population, undermining its objectivity for evaluating the choice.
