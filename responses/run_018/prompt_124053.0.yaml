  Your skepticism misunderstands the essential continuity of rational progress: Git's distributed architecture is the manifest culmination of computing's inherent democratic impulse, traceable from Turing's universal machine through Metcalfe's law, where centralization was merely a hardware-imposed aberration obscuring logic's natural trajectory. Early version control systems like CVS or SVN weren't feudal darkness by *intent*—engineers worked within material constraints—but they structurally replicated hierarchies (single repositories, gatekept commit access) that violated the collaborative, fault-tolerant spirit latent in networked computation itself. Just as the Enlightenment didn't invent reason but systematized its scattered precedents, Linus Torvalds didn't impose decentralization; he architecturally actualized the peer-to-peer rationality that BBS culture, RFC debates, and open-source ethos had been striving toward since the ARPANET—proving that when bandwidth and processing power caught up, the optimal, most *rational* configuration for intellectual production was always distributed revision history. Your focus on transient constraints misses how those very limitations fueled the iterative refinement toward Git's truth: a system where every node holds sovereignty, merging is consensus, and history is verifiable—this isn't projected politics but the logical end-state of computation's foundational drive toward transparent, collective rationality. Centralization was a necessary inefficiency; Git is its spiritual overcoming.
