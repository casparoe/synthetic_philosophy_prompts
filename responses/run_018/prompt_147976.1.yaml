answer: |-
  Here’s the real spec—no fluff, no citations, just the non-negotiable foundations for a judgment aggregation theory that works outside toy models. I’m taking a firm stance: **logical coherence under asymmetric expertise is non-negotiable**, and most mainstream rules fail catastrophically at this. Below, the core desiderata, motivated by real-world cases, with casualties marked.

  ---

  ### **Non-Negotiable Desiderata**
  1. **Consistency-Priority Under Logical Constraints**  
     - **What it means**: Group output *must* be logically consistent (no "P and not-P"). If premises entail Q, accepting premises must force Q.  
     - **Why non-negotiable**: A committee endorsing contradictory positions is institutionally irrational. *Example*: A medical ethics board approving "Drug X is safe" and "Drug X causes fatal side effects" simultaneously destroys trust.  
     - **What it kills**: Majority voting on individual propositions (discursive dilemma), conclusion-based voting (ignores premise-level justification).

  2. **Partial Independence (Expertise-Sensitive)**  
     - **What it means**: Voters’ influence on a proposition scales with their *demonstrated reliability* on *related* issues. No blanket anonymity.  
     - **Why non-negotiable**: Real groups have domain experts. *Example*: Climate scientists should weigh more on "CO₂ drives warming"; ethicists on "policy X is just". Treating all as equal on all issues ignores knowledge asymmetry.  
     - **What it kills**: Premise-based voting (assumes equal competence), anonymous aggregation rules.

  3. **Cyclic Dependency Robustness**  
     - **What it means**: Handles interdependent premise clusters (e.g., P→Q, Q→R, R→P) without imploding. No "primary" premise bias.  
     - **Why non-negotiable**: Real-world policies have feedback loops. *Example*: "Raising wages (P) boosts consumption (Q)" and "Boosting consumption (Q) justifies wage hikes (P)" – consistency must hold bidirectionally.  
     - **What it kills**: Sequential priority rules (e.g., fix P first, derive Q).

  ---

  ### **Critical But Negotiable (Context-Dependent)**
  4. **Strategic Reporting Resistance**  
     - **What it means**: The rule should minimize incentives to misreport judgments to manipulate outcomes.  
     - **Motivation**: *Example*: A lobbyist on a regulatory committee downplaying risks (P) to get approval (Q).  
     - **Stance**: Perfect resistance is impossible (Gibbard-Satterthwaite bites), but rules can be designed to make manipulation computationally hard or traceable. Sacrificed if required for coherence+expertise.

  5. **Justification Transparency**  
     - **What it means**: Distinguishes "group believes Q" from "group has reasons for Q". Output must expose the inferential path.  
     - **Motivation**: *Example*: A court must show *why* it convicted (premises) – not just the verdict.  
     - **Stance**: Weakly negotiable; can be deferred to deliberation records if aggregation preserves premise links.

  ---

  ### **Dispensable Prejudices**
  - **Universal Anonymity**: A fantasy. Expertise isn’t symmetric; weighting is inevitable.  
  - **Full Propositional Independence**: Ignores logical dependencies. Premises aren’t isolated atoms.  
  - **Majoritarianism as Default**: "Majority gets it right" fails when voters lack competence on specific issues.  
  - **Sincerity Assumption**: Naive. Strategic actors exist; rules must anticipate them.

  ---

  ### **The Casualty Report: Why Popular Rules Fail**
  - **Premise-Based Voting**: Dies on **cyclic dependencies** (consistency breaks) and **expertise asymmetry** (treats all voters equally on biology/ethics).  
  - **Conclusion-Based Voting**: Dies on **justification transparency** (loses premise-level reasoning) and **expertise** (no domain weighting).  
  - **Majority Rule**: Dies on **consistency** (discursive dilemma), **expertise**, and **cycles**.  
  - **Sequential Priority Rules**: Die on **cyclic dependencies** (order arbitrariness breaks coherence).

  ---

  ### **The Uncompromising Core**
  If your rule doesn’t **enforce logical consistency while weighting expertise per proposition**, it’s a toy. Real aggregation must:
  1. **Respect entailments** (if P₁...Pₙ ⊨ Q, accepting all Pᵢ forces Q),  
  2. **Weight judgments by voter-proposition reliability**,  
  3. **Resolve cycles holistically** (e.g., via fixpoint methods or grounded theory).  

  Anything less collapses under real-world pressure. Strategic behavior is a secondary concern—fix coherence and expertise first, then minimize manipulation through rule complexity or transparency. **Start with logic and epistemology; voting mechanics follow.**
