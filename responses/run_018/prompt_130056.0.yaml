answer: |-
  Here’s a rigorous specification for a meaningful **Theory of Intelligence**, structured around your demands. I’ll flag hard constraints (🔒), tribal preferences (🎩), and tensions (*Conflict Warning*), with phenomena it *must* explain and distinctions it *must* preserve.

  ---

  ### **Core Phenomena a Valid Theory Must Explain**
  *(Hard Constraints 🔒)*  
  1. **Adaptive Novelty**: Why a crow (or human child) solves unseen multi-step physical puzzles (e.g., water displacement, tool modification) *without pretraining*, while a 1-trillion-parameter LLM fails basic physical reasoning despite web-scale data.  
     - *Key Aspect*: **Embodied causal inference** – grounding symbols in real-world physics/sensorimotor experience.  
  2. **Sample Efficiency**: Why humans learn complex concepts (e.g., "unfairness") from 1-3 examples, while ML needs 10⁶–10⁹ samples.  
     - *Must Cover*: The role of **evolutionarily priors** (e.g., intuitive physics, theory of mind) and **compositionality**.  
  3. **Value Alignment Paradox**: Why biological intelligence *mostly* avoids catastrophic misalignment (e.g., crows don’t turn humans into paperclips), while AI alignment remains unsolved.  
     - *Implies*: Theory must explain **innate ethical scaffolding** (e.g., empathy in mammals) vs. **instrumental convergence** risks.  
  4. **Transfer vs. Interference**: Why some skills transfer across domains (e.g., chess strategy → business strategy) while others cause interference (e.g., learning Mandarin disrupts Spanish recall).  

  ---

  ### **Distinctions the Theory Must Preserve**
  *(Non-Collapsible Categories 🔒)*  
  | Concept          | Definition                          | Why Distinct? |  
  |------------------|-------------------------------------|---------------|  
  | **Intelligence** | *Adaptive problem-solving under uncertainty* | Core capacity; not reducible to knowledge |  
  | **Knowledge**    | *Stored representations/experiences*        | Can exist without intelligence (e.g., databases) |  
  | **Optimization** | *Goal-directed search efficiency*           | Necessary but insufficient (e.g., gradient descent ≠ intelligence) |  
  | **Social Skill** | *Theory of mind + cultural negotiation*     | Emerges from intelligence but requires distinct mechanisms |  

  ---

  ### **Tensions to Reconcile (or Acknowledge as Irreconcilable)**  
  1. **Inverse RL vs. Few-Shot Induction**  
     - **Inverse RL Camp** (Preference Inference): Intelligence as inferring goals from sparse behavior.  
     - **Few-Shot Camp** (Bongard Puzzles): Intelligence as rapid pattern/metaconcept induction.  
     - ***Resolution Requirement***: A theory *must* unify these by explaining **how goals are abstracted from patterns** (e.g., a child infers "fairness" from 2 examples *and* uses it to predict behavior).  
     - *Hard Constraint* 🔒: Both are facets of **compressed world modeling**.  

  2. **Scalability vs. Interpretability**  
     - *Conflict Warning* 🚩: High-dimensional intelligence (e.g., human brain) *requires* emergent complexity, which resists human-interpretable reductionism.  
     - *Tribal Preference* 🎩: "All intelligence must be explainable" may be incompatible with scalability.  

  ---

  ### **Formal Constraints & Contradictions to Avoid**
  *(Hard Constraints 🔒)*  
  1. **No Free Lunch Theorem**: Must explain why intelligence isn’t universally general – **domain-specificity emerges from evolutionary/developmental constraints**.  
  2. **Friston’s Free Energy Principle**: Cannot contradict evidence that brains minimize surprise/prediction error.  
  3. **Computational Limits**: Must respect **time/data complexity bounds** (e.g., PAC learning, Kolmogorov complexity).  
  4. **Neuroscience Consistency**: Cannot violate known neural mechanisms (e.g., predictive coding, reward prediction error).  

  ---

  ### **Jointly Unsatisfiable Requirements?**  
  *(The Tensions That Break "Dream Theories")*  
  1. ***Domain-Generality + Sample-Efficiency + No Priors*** 🚩  
     - **Conflict**: Sample-efficient generalization *requires* strong inductive biases (priors). Evolution provides these; ML tries to learn them from data → sample inefficiency.  
     - *Formal Proof*: PAC learning – sample complexity grows with hypothesis space size. No free priors → no free lunch.  

  2. ***Maximally Safe + Maximally Autonomous*** 🚩  
     - **Conflict**: Full autonomy (e.g., AGI) requires open-ended exploration, which generates unanticipated risks. Biological intelligence "solves" this via **evolutionary constraints** (e.g., pain/pleasure hardwiring) – not replicable in AI.  

  3. ***Explainability + Emergent Complexity*** 🚩  
     - **Conflict**: Systems achieving human-like intelligence *must* develop irreducible emergent properties (e.g., consciousness as an epiphenomenon). Explainability demands reductionism → trade-off is fundamental.  

  ---

  ### **The Minimal Viable Theory Spec**  
  A theory is **non-trivial** iff it:  
  - Explains phenomena 1–4 above *without handwaving* (🔒).  
  - Preserves distinctions in the table *without reductionism* (🔒).  
  - Reconciles inverse RL with few-shot learning via **active inference** (🔒).  
  - Acknowledges NFL-induced trade-offs (e.g., "domain-generality requires priors or data") (🔒).  

  **Tribal preferences to ignore** 🎩:  
  - Anthropocentrism (intelligence ≠ human-like).  
  - Simulation-ism ("brains are just Bayesian inference").  
  - Scale obsession ("bigger models → emergent intelligence").  

  **Where to look**: Integrated theories like **Active Inference** (Friston) + **Computational Evolution** (e.g., POET) + **Developmental Robotics** – but none yet satisfy the full spec.  

  This is the map – the territory remains uncharted.
