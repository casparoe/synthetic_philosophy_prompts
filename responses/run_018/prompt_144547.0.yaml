answer: |-
  **1. Setup and Roles:**  
  Randomly assign 4 Skeptics (argue no reasons bind universally) and 8 Arbitrators (enforce the Mirror Rule: rephrase objections into terms opponents must accept as binding), seated opposing each other in a simulated courtroom.  

  **2. Rules and Stakes:**  
  Skeptics initiate objections to a simple norm (e.g., "Keep promises"); Arbitrators respond using the Mirror Rule, translating Skeptics’ claims into universally binding terms. Speaking requires spending a token (3 tokens/player initially), awarded only when conceding a point’s local validity to an opponent.  

  **3. Timeline of Play:**  
  5-min prep (review rules), 30-min structured debate in 3 rounds (escalating objections: specific cases → hypotheticals → meta-norms), 15-min guided debrief, 10-min silent reflection. Moderator halts non-compliant speech.  

  **4. Debrief Mapping:**  
  Link Skeptics’ token-dependent objections to presupposed communicative norms, their reliance on intersubjective recognition to deny it, and emergent performative contradictions (e.g., “No reasons bind!” requiring binding uptake).  

  **5. Honest Notes:**  
  Predict Skeptics disengaging or Arbitrators lecturing; the activity’s voluntary role-play cannot replicate involuntary self-refutation in real discourse, where the skeptic *must* commit to validity claims unintentionally.
