prompt: |-
  I host a tiny interview series for our department's ethics reading group — 30 minutes, one guest, me asking the questions, and no prepared remarks. Next up is a political philosopher (I'll keep her anonymous here; real name isn't on the flyer yet) who defends a specific version of prioritarianism: rank options by the expected sum of a strictly concave transform of each person's realised welfare — the transform gets applied to what actually happens to each person, and only afterwards do we take the expectation, rather than applying it to each person's expected welfare. She's good, she's heard every version of the levelling-down objection, and she has three moves she falls back on constantly:

  1. my view can't require levelling down at all — it's a sum of independently weighted welfares, so making anyone better off always makes the outcome better, end of story;
  2. the concavity isn't a stipulation about weights, it's just the diminishing moral value of a benefit as its recipient's level rises, which everyone already accepts in the single-person case;
  3. whatever is actually bothering you is a worry about relational equality, which is a different principle and not one I'm signed up to.

  Write me nine or ten interview questions, each with a follow-up keyed to the answer she's most likely to give — so: name the answer I should expect, then give me the follow-up that presses on it. I want the sequence to make moves (1), (2) and (3) progressively harder to reach for, and I want it to go well beyond her restating the view. Please cover at least these:

  - Why the transform goes on realised welfare rather than expected welfare. Her version is risk-averse at the social level, which means she can prefer a policy with a *lower* expected total welfare to a riskier one with a higher expected total. That looks a lot like the levelling-down worry relocated into expectation rather than outcome, and I want a question that makes her either own it or explain why the expected-welfare version is worse. Give me the tiny numerical illustration to use on air.
  - Where the concavity comes from, pushed into her own favourite justification. If the shape of the function really is just diminishing marginal moral value of benefits to a person, and that's supposed to be obvious from the single-person case, then why doesn't the same concavity apply within one life over time — a benefit to you during a bad stretch of your life counting for more than the same benefit during a good stretch? If she bites that bullet she gets an intrapersonal levelling-down result: with the time-slices weighted concavely, smoothing someone's life can beat a life with more total welfare in it, i.e. you should sometimes make a person worse off overall in order to even their life out. I want the question that forces her to say whether she accepts that, and a follow-up on why it isn't as embarrassing as the interpersonal version. If she refuses and says the unit is the whole life, I want the follow-up on what makes the boundary of a person the special place where priority switches on — and on whether benefits she's already received in the past should count when we work out how much priority she gets now.
  - The tail of the function: as welfare rises, does the marginal weight go to zero? If it does, then no finite gain to the very well off outweighs an arbitrarily tiny gain to the worst off, and I want her pressed on whether that's still a continuous trade-off view or lexical priority in a trenchcoat. Write the case so it's concrete and slightly absurd (a billionaire's bad afternoon versus something genuinely trivial happening to a badly off kid, scaled however you like).
  - Whether the view is egalitarian in any sense. It's additive and separable, so the gap between people never enters the axiology directly — only their levels do — and yet concavity hands her an inequality-favouring result for free. I want a question on what she thinks people are actually responding to when they have levelling-down intuitions: confusion, or something real that her axiology has no slot for. And then the follow-up for the likely answer, which is that it's something real but separate.
  - One case where I think she may not be able to stay a pure prioritarian: what happens when the number of people isn't fixed, or when the people in one option aren't the same people as in the other. Who are the worse off supposed to be then, and does priority have anything to say when there's nobody who gets made worse off?
  - A closing question about what would count against the view — not what's the strongest objection, but what concrete result, from cases or from the formal side, would make her give up prioritarianism of this particular shape. Phrase it so that some version of more work needs to be done isn't available as a reply.

  Keep everything in plain spoken language, this is a conversation and not a referee report. Where a question needs an example, invent it and keep it short — a sentence or two — and please don't build anything on my having read a particular book or paper, because I havent. Also note the tone constraint: I want to keep her talking, so no question should be phrased as an accusation, even when it is one.
reasoning: |-
  Okay, the user is hosting an interview series for their ethics reading group and needs questions for a political philosopher who defends a specific version of prioritarianism. The guest applies a strictly concave transform to each person's realized welfare before summing and taking expectations. The user wants questions that challenge her three common defenses: that her view doesn't require leveling down, that the concavity comes from diminishing marginal moral value, and that leveling-down objections are about relational equality.

  First, I need to understand her key arguments. Her first move is that since it's a sum of independently weighted welfares, improving anyone always makes the outcome better. The second move is that concavity reflects diminishing moral value, accepted in single-person cases. The third is that leveling-down concerns are about relational equality, which she doesn't endorse.

  The user wants questions that progressively make these moves harder to use. They specifically mentioned areas to cover: why the transform is on realized welfare not expected, the source of concavity, the tail behavior of the function, whether the view is egalitarian, non-fixed populations, and what would falsify the view.

  For the first topic on realized vs. expected welfare transformation, I should create a numerical example. Maybe comparing two policies: one with certain outcomes and another with risk but higher expected welfare. Her view might prefer the safer one with lower expected total welfare. The follow-up should press why this isn't like leveling down in expectation.

  Next, the concavity source. If she says it's diminishing marginal moral value from single-person cases, then ask why that doesn't apply to time-slices within a life. If she bites the bullet, intrapersonal leveling down could occur. If she rejects that, ask why the person boundary is special. Also, whether past benefits affect current priority.

  For the tail behavior, if marginal weight approaches zero, then huge gains to the well-off don't outweigh tiny gains to the worst-off. Use a concrete example: a billionaire's minor loss vs. a small benefit to a suffering child. Question if this is effectively lexical priority.

  On egalitarianism, since the view is additive and separable, gaps don't matter directly. But concavity favors equality. Ask what leveling-down intuitions are responding to. Follow up on her likely answer about relational equality being separate.

  For variable populations: when people in different options aren't the same. Who counts as worse off? Does priority apply if no one is made worse off? Example: adding a new person with good life vs. not.

  Finally, what would falsify her view. Need to avoid "more work needed" answers. Push for specific empirical or formal results that would make her abandon the view.

  Tone is crucial: questions must be conversational, not accusatory. Use plain language, short examples. Ensure each question builds on the previous to corner her defenses gradually. Structure the sequence to tackle move 1, then 2, then 3, making each harder to use. Follow-ups should anticipate her responses and press further.
answer: |-
  Here are nine interview questions designed as a conversational sequence, building pressure on her key moves while maintaining a collaborative tone. Each includes the expected core answer and a follow-up pressing the point.

  1.  **Question:** "Your view applies the concave transform to each person's *realized* welfare in an outcome, *then* sums those transformed values, and *then* takes the expectation over outcomes. Why put the transform *before* the expectation, rather than transforming each person's *expected* welfare?"
      *   **Expected Answer:** "Because we care about the actual moral value *in the outcome that happens*. The diminishing moral value applies to what people *actually get*, not to the abstract average of what they might get. Transforming expected welfare would misplace the risk aversion; it's about the badness of actually being badly off, not just the badness of expecting to be badly off."
      *   **Follow-Up:** "Okay, let me test that. Imagine Policy A: Guarantees everyone welfare level 5. Policy B: 50% chance everyone gets 10, 50% chance everyone gets 0. Expected total welfare is higher under B (10 vs 5). But your view, with a concave transform (say, square root for simplicity), might prefer A: sqrt(5)+sqrt(5)=~7.07 for sure, vs. expected value of 50%*(sqrt(10)+sqrt(10)=~6.32) + 50%*(0+0=0) = ~3.16. So you prefer the *lower* expected total welfare option. Isn't this structurally similar to the leveling-down worry, but applied to expectations? You're trading off higher potential total welfare for a safer, lower total welfare outcome?"

  2.  **Question:** "You often say the concavity isn't arbitrary weighting, it reflects the diminishing *moral value* of a benefit as the recipient's absolute welfare level rises. Everyone accepts this in the single-person case. Can you elaborate on why this intuition is so fundamental?"
      *   **Expected Answer:** "Absolutely. Think about giving £1000. To someone destitute, it's life-changing (huge moral value). To a millionaire, it's a minor convenience (small moral value). The benefit itself is the same, but its moral significance diminishes as the recipient's baseline rises. That's uncontroversial for one person facing two different states."
      *   **Follow-Up:** "That single-person case is compelling. But if this diminishing moral value holds for benefits given to a *person* at different *levels*, why wouldn't it also hold for benefits given to different *time-slices* of the *same person*? For example, wouldn't giving £1000 to me during a terrible year in my life have *more moral value* than giving £1000 to me during a fantastic year? If so, doesn't your logic suggest we should apply the concave transform *within* a life over time?"

  3.  **Question:** "If we apply the transform within a life, as seems consistent with the single-person intuition, what happens? Imagine two lives for the same person: Life 1: Constant welfare 50 every year. Life 2: Alternates 0 and 100 every year. Both have the same *total* welfare over time (say, 50*T vs. (0+100)/2 *T = 50*T). But applying a concave transform (say square root) *within* the life: Life 1 gives sqrt(50)+sqrt(50)+... = T*sqrt(50). Life 2 gives sqrt(0)+sqrt(100)+sqrt(0)+... = T/2 * (0 + 10) = 5T. Since sqrt(50)≈7.07 > 5, Life 1 scores higher. So, smoothing the life (Life 1) is better *even though total welfare is the same*. Doesn't this imply an *intrapersonal* leveling down? We'd prefer making the person worse off in their peak years to avoid them being worse off in their troughs?"
      *   **Expected Answer:** "Ah, but the *person* is the unit of concern. We care about the value of benefits *to the whole life* of a person, not to temporal segments. The transform applies to the person's overall welfare level when evaluating the outcome for that person."
      *   **Follow-Up:** "Right, the whole life is the unit. But that boundary seems crucial. Why is the *boundary of the person* the special place where this priority weighting switches on? If we care about the moral value of benefits relative to the recipient's level, why does that level suddenly become the *whole life aggregate* only when crossing from one person to another? And practically, how do we calculate 'level' for priority? If someone *was* very poor but just inherited a fortune, does their current 'level' for priority purposes include that past poverty, or only their current wealth?"

  4.  **Question:** "Let's talk about the shape of the concave function. As welfare levels get very, very high, does the marginal moral weight of an additional unit of welfare approach zero?"
      *   **Expected Answer:** "Yes, typically. The moral urgency of helping someone diminishes as their situation improves. At extremely high welfare levels, adding more makes very little moral difference compared to helping those who are badly off. It's continuous, but the slope flattens dramatically."
      *   **Follow-Up:** "So, imagine a scenario: We can prevent a minor, temporary stomach ache for a child living in severe, chronic poverty. Or, we can prevent a billionaire from stubbing their toe, which would cause them significant frustration and ruin their afternoon. On your view, could preventing the child's minor stomach ache *always* be more important, no matter how severe the billionaire's temporary suffering is described, simply because the child is at such a low absolute level? Is there *any* finite amount of suffering prevented for the billionaire that could outweigh preventing *any* finite suffering for the worst-off child?"

  5.  **Question:** "That sounds remarkably close to a Lexical Priority view – help the worst-off first, no matter what, until they reach some threshold. How do you maintain it's still a continuous trade-off view?"
      *   **Expected Answer:** "It *is* continuous. The marginal weight never *hits* zero, it just gets vanishingly small. In principle, a sufficiently enormous gain for sufficiently many well-off people *could* outweigh a small gain for the worst-off. It's just that in most realistic scenarios, especially involving extreme poverty, the priority for the worst-off dominates. But the theoretical continuity matters – it avoids the abrupt cliffs of strict lexical views."
      *   **Follow-Up:** "In practice, though, for any policy choice we might actually face involving people at vastly different welfare levels, the distinction seems vanishingly small. Isn't this 'lexical priority in a trenchcoat,' as some critics might say? What real-world policy decision would look different under your continuous prioritarianism versus a strict lexical view focused on the worst-off?"

  6.  **Question:** "Moving to the core of the leveling-down objection: Your first move is always that your view *never* requires leveling down because helping anyone always helps. And that seems mathematically true. But many people feel a strong intuitive pull that *equality itself* has value, even when achieved by leveling down. What do you think is the source of that strong intuition, if it's not captured by your axiology?"
      *   **Expected Answer:** "I think that intuition is real, but it stems from a different principle – relational equality, or fairness in how people stand relative to each other. People dislike large gaps because they signify unfair social relations, domination, stigma, etc. That's important, but it's distinct from the prioritarian concern for the absolute position of the badly off. My view focuses on the latter; relational equality is a separate value."
      *   **Follow-Up:** "So, when people have the leveling-down intuition, you're saying they're often conflating two things: the badness of someone being low in absolute terms (which you care about) and the badness of inequality *as such* (which you don't directly care about). But doesn't your view *indirectly* favor more equal distributions precisely *because* of the concavity? How do you disentangle the 'pure' prioritarian aversion to low absolute levels from the aversion to inequality that it functionally produces?"

  7.  **Question:** "Let's consider a case where the population isn't fixed. Option X: Create 10 people, all with very good lives (welfare 100). Option Y: Create 10 different people: 9 with excellent lives (welfare 150), and 1 with a life barely worth living (welfare 1). Total welfare is much higher under Y (1351 vs 1000). But your prioritarian view, with a strong concavity, might favor X because it avoids creating anyone at level 1. Do you accept that? And who are the 'worse off' we're prioritizing here? The person at level 1 in Y *wouldn't exist* under X."
      *   **Expected Answer:** "This is tricky terrain. Standard prioritarianism is often formulated for fixed populations. In variable population cases, we need careful extensions. One approach is to say we apply the transform to the welfare of everyone who *does* exist in an outcome. In Y, that person at 1 drags the sum-of-transformed-welfare down significantly compared to X where no one is that low. So yes, X might be better. The 'worse off' are those who exist in the outcome we're evaluating."
      *   **Follow-Up:** "But doesn't this mean your view can prefer creating a world where *no one* is as well off as the worst-off in the alternative world? In X, everyone is at 100. In Y, the worst-off is at 1, but the best-off are at 150. You seem to be saying creating someone at 1 is so bad that it outweighs the huge gains to the 9 others *and* the fact that the person at 1 still has a life worth living. Isn't this a form of 'leveling down' across possible populations? You're preventing the existence of people who would be very well off *and* someone who would be badly off but still have a positive life, in favor of creating a group who are all merely 'very good'?"

  8.  **Question:** "Sticking with population ethics: Imagine Option A: We help an existing, very badly off person (welfare jumps from 1 to 10). Option B: We create a new person who will have a good life (welfare 80). Total welfare increases more under B (80 vs 9). Does prioritarianism tell us which is better?"
      *   **Expected Answer:** "This depends heavily on the specific prioritarian view and how it handles existence. A common approach is 'Critical-Level Prioritarianism,' where we might subtract a 'critical level' (say, 20) from each person's welfare before applying the transform, to avoid the 'Repugnant Conclusion'. But pure, unmodified prioritarianism focusing only on realized welfare of those who exist might struggle here. Helping the existing worst-off person likely has higher *marginal moral weight*."
      *   **Follow-Up:** "So, without adding extra bells and whistles like a critical level, pure prioritarianism might often favor helping existing worse-off people over creating new, well-off people? Does this suggest that prioritarianism, in its core form, is primarily a view for fixed populations and struggles to give coherent guidance when existence itself is at stake?"

  9.  **Question:** "Finally, to understand how you see the view's boundaries: What kind of concrete result – maybe from a specific case, or a formal implication – would genuinely make you reconsider or abandon this specific version of prioritarianism? Not just a puzzle requiring more work, but something that would make you think 'Okay, this *fundamentally* doesn't work.'"
      *   **Expected Answer (Attempted):** "Well, any moral theory faces challenges. I'd be troubled if we found it consistently required clearly monstrous actions, or if it clashed overwhelmingly with very robust, considered judgments in core cases. But the strength is its grounding in the single-person diminishing value intuition..."
      *   **Follow-Up (Pre-empting "more work"):** "Let me press slightly harder on that 'core case' idea. Suppose we found that the intrapersonal application we discussed earlier – preferring a smoothed life with lower total welfare – was *inescapable* from the single-person intuition you rely on, and that this seemed deeply counterintuitive and unacceptable *even in the single-person case*. Would that undermine the foundation of the interpersonal priority weighting for you? Or, suppose we could demonstrate that the 'lexical priority in a trenchcoat' effect leads to truly absurd trade-offs in practice that seem indefensible, even after careful reflection. Would that count?"

  **Key features of the sequence:**

  1.  **Progressive Pressure:** Starts with clarifying the core mechanism (Q1), then pushes the foundational justification (Q2-Q3 on intrapersonal), exposes the lexical implication (Q4-Q5), separates prioritarian from egalitarian concerns (Q6), tackles non-fixed populations where her moves are weakest (Q7-Q8), and finally pushes on falsifiability (Q9).
  2.  **Targets Moves:**
      *   Q1 & Follow-Up directly challenge Move (1) by showing a trade-off resembling leveling-down *in expectation*.
      *   Q2-Q3 & Follow-Ups directly target Move (2) by pushing the "single-person intuition" to its intrapersonal conclusion and questioning the person-boundary.
      *   Q6 & Follow-Up directly addresses Move (3) by forcing her to explain the leveling-down intuition and questioning the separability of prioritarian and relational concerns.
  3.  **Covers Requested Topics:** Realized vs. Expected Welfare (Q1), Source of Concavity/Intrapersonal (Q2-Q3), Tail Behavior/Lexicality (Q4-Q5), Egalitarianism (Q6), Non-Fixed Populations (Q7-Q8), Falsifiability (Q9).
  4.  **Tone:** Collaborative, inquisitive ("Help me understand...", "Let me test that...", "What do you think the source is...", "Let me press slightly harder..."). Uses plain language and simple, self-contained examples. Avoids jargon overload and accusation ("Isn't this monstrous?" vs. "Would this seem deeply counterintuitive?").
  5.  **Follow-Ups:** Explicitly anticipate her likely answers based on her known moves and press the specific weaknesses or implications of those answers. Push for concrete commitments or expose tensions within her view.

  Use these as a flexible guide. Listen closely to her answers and be ready to adapt the follow-ups slightly based on her precise phrasing, while keeping the core challenge of each question intact. Good luck with the interview!
