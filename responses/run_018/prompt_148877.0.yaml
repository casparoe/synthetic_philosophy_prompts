  I just finished a long argument with a friend about whether scientific realism can survive the pessimistic meta-induction. I work in evolutionary biology and think naturally in terms of adaptive landscapes, niche construction, and evolutionary stable strategies, but I have almost no philosophy background. Restate the core commitments of scientific realism and the force of the pessimistic meta-induction using only that evolutionary vocabulary — for example, treat mature theories as phenotypic traits, theoretical turnover as selection pressure, and predictive success as fitness within a specific ecological niche. For each side, identify what translates cleanly, what must be distorted to fit (especially whether "approximate truth" can be rendered as "locally optimal adaptation" without losing its normative or representational content), and what has no counterpart at all in evolutionary biology. Then give me the residue report: does the untranslatable remainder show that evolutionary thinking lacks the resources to capture scientific knowledge, or does it reveal that the philosophical debate was smuggling in metaphysical commitments that do no real explanatory work? Answer in American English, stay tightly focused, and do not include bibliographies, reading lists, or citations.
