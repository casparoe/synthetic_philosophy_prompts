answer: |-
  ### Core Commitments of Scientific Realism (Evolutionary Translation)
  **Thesis:** Mature scientific theories are adapted phenotypes surviving in the niche of empirical validation. Their predictive success (fitness) indicates they are **locally optimal adaptations** (≈ approximate truth) to the structure of reality (the adaptive landscape).  

  **Clean Translations:**  
  - **Predictive success = high fitness:** A theory thriving in its niche (e.g., predicting planetary motion).  
  - **Theory maturity = stabilized phenotype:** A well-tested trait (e.g., natural selection in genetics).  
  - **Reality as landscape:** The fixed "environment" (laws of nature) to which theories adapt.  

  **Distortions Required:**  
  - **Approximate truth ≈ locally optimal adaptation:**  
    - *Loss of normativity:* Biological fitness is *descriptive* (it works *now*), while realism claims theories *should* track reality. Optimality implies no "truth" – just current effectiveness.  
    - *Loss of representation:* A trait (e.g., camouflage) isn’t "true" – it’s functional. Realism claims theories *represent* reality.  
  - **Mature theories:** Biology has no "maturity" threshold – traits are transiently optimal. Realism implies enduring epistemic privilege.  

  ---

  ### Pessimistic Meta-Induction (Evolutionary Translation)  
  **Thesis:** Across evolutionary history, most "optimal" phenotypes (theories) went extinct (were falsified). Current successes, like past ones, are transient adaptations, not evidence of global optimality (≈ truth).  

  **Clean Translations:**  
  - **Theory turnover = selection pressure/extinction:** Outcompeted traits (e.g., Newtonian gravity displaced by relativity).  
  - **Past failure as evidence:** Extinct traits (phlogiston, luminiferous aether) were once "fit" but not optimal in the long-term landscape.  

  **Distortions Required:**  
  - **Landscape stability:** Realism assumes a fixed reality (static landscape). Pessimism notes the landscape *shifts* with new data (e.g., quantum mechanics altering the niche).  
  - **Global vs. local optima:** Biology doesn’t seek "global" truth – pessimism argues current theories are *local* peaks, soon to be abandoned.  

  ---

  ### Residue Report: The Untranslatable Remainder  
  **What lacks counterparts in biology:**  
  1. **Intentional representation:** Theories *aim* to depict reality; traits merely *function* (e.g., a theory "models" gravity; camouflage has no "aboutness").  
  2. **Normative "truth":** Fitness is amoral; "approximate truth" implies a *standard* beyond survival (e.g., "DNA’s structure corresponds to reality" vs. "it replicates successfully").  
  3. **Convergence toward reality:** Realism expects theories to asymptote to truth. Evolution has no teleology – traits drift, with no "progress" toward a target.  

  **Diagnosis:**  
  - **Evolutionary thinking’s limitation:** It lacks the vocabulary for *intentionality* and *representation*. Biology describes *how* traits work, not *what they mean*. This fails realism’s core claim: that success signals **cognitive alignment with mind-independent reality**.  
  - **Philosophy’s smuggled commitments:** The residue exposes realism’s unspoken metaphysics:  
    - That "predictive fitness" *must* imply a theory’s structure mirrors reality’s structure.  
    - That science progresses toward a singular optimal peak (truth).  
    Biology shows only that traits adapt to *current* pressures. Success ≠ ontological reflection.  

  **Conclusion:**  
  The untranslatable residue proves evolutionary biology **cannot fully capture scientific knowledge** because it eliminates realism’s normative, representational core. But this also reveals the debate’s hidden baggage: philosophy’s demand that successful theories must *be* "approximately true" (a metaphysical leap) rather than *sufficiently adaptive* (a biological observation). The residue isn’t a flaw in biology – it exposes philosophy’s non-empirical wager that nature’s laws are *necessarily* representable by human concepts. Evolutionary thinking dissolves this by showing science is a dynamic adaptation, not a mirror.
