answer: |-
  What you're describing is a **methodological toggle** that lacks a single established name but represents a significant pattern in value theory. I propose calling this **"Constitutive Suffering Valuation Toggling" (CSVT)** and offer a precise carving:

  ### Core Definition of CSVT
  *CSVT occurs when evaluators shift between:*
  1.  **Decompositional Accounting (DA):** Treating welfare components (pleasure, pain, achievement, autonomy) as separable states, summed algebraically.
  2.  **Holistic Integration (HI):** Treating specific suffering-good complexes as ontologically fused units where the suffering is *constitutive matter* of the good, rendering decomposition nonsensical or value-destroying.
  *The toggle is triggered specifically when suffering appears structurally necessary for the *existence* and *recognizable identity* of a valued good.*

  ### Why Existing Concepts Fall Short
  1.  **Organic Unity (Moore, Lemos):** Captures the non-additivity ("whole > sum of parts") but is *static*. CSVT is *dynamic methodological switching* based on the perceived role of suffering. Organic unity doesn't explain why the *same thinker* uses DA for other complex goods (e.g., autonomy vs. pleasure).
  2.  **Narrative Theories (MacIntyre, Schechtman):** Explain how meaning arises from life-structure, but don't specify the *selective suspension of additive accounting for suffering-bound goods* while retaining it for other comparisons (e.g., real vs. simulated pleasure). Narrative integrity might *motivate* HI, but doesn't explain the DA used elsewhere.
  3.  **Framing Effects (Kahneman & Tversky):** Describe cognitive biases in *perception* of options. CSVT involves a claimed *ontological/moral justification* for switching evaluation *methods*, not merely a perceptual shift. It's presented as principled, not irrational.
  4.  **Context-Sensitivity:** While all valuation is context-sensitive, CSVT is a *systematic, binary methodological shift* tied to one specific feature (suffering's constitutive role). Ordinary context-sensitivity doesn't involve abandoning core accounting principles like additivity.

  ### Boundary Conditions: What Makes CSVT Distinct
  *   **The Trigger:** Suffering must be perceived as **constitutively necessary**, not merely instrumental or contingent.
      *   *CSVT Applies:* Grief *as the expression* of deep love (remove grief, love transforms/loses depth); creative struggle *as the process defining* the achievement (remove struggle, achievement becomes trivial).
      *   *CSVT Doesn't Apply:* Suffering *caused by* pursuing a good, but separable (e.g., physical pain from overwork *enabling* an achievement; the pain isn't *part of* the achievement's meaning). Suffering merely *accompanying* a good (e.g., a headache while appreciating art).
  *   **The Toggle:** The *same evaluator* must demonstrably use **DA in other welfare comparisons** involving complex, non-suffering-bound states.
      *   *CSVT Applies:* Using DA for experience machine (authentic vs. simulated pleasure as separable states) or autonomy-vs-safety tradeoffs, while using HI for caregiver grief.
      *   *Not CSVT:* Consistently using HI everywhere (rare) or DA everywhere (denying constitutive suffering).
  *   **The Justification:** The switch is defended (implicitly or explicitly) by claiming the suffering-bound good is an **indivisible gestalt**. The suffering isn't a "cost" but the **raw material or necessary condition** for *that specific* good to exist. DA is rejected as category error.

  ### Legitimate Pluralism vs. Failure Mode vs. Special Pleading
  1.  **Legitimate Pluralism (Defensible):** If different *kinds of goods* genuinely require different *epistemic tools*, CSVT could be sound. Suffering-bound goods might be *relationally constituted* in a way separable states are not. Valuation methods should track ontology. DA works for hedonic states; HI works for complex, identity-defining relational goods.
      *   *Requires:* A clear meta-theory justifying why *this specific type* of good (suffering-constituted) demands HI, while other complex goods (autonomy, achievement sans suffering, authenticity) remain decomposable.
  2.  **Named Failure Mode ("Constitutive Slippage"):** CSVT risks becoming:
      *   **Motivated Stopping Point:** Halting decomposition *only when it threatens a preferred conclusion* (e.g., defending meaningfulness of suffering).
      *   **Ontological Inflation:** Mistaking *psychological difficulty* in separation for *metaphysical impossibility*. Just because removing suffering *changes* a good doesn't *always* mean it destroys its value or identity.
      *   **Inconsistent Scope:** Failing to apply HI equally to *positive* states embedded in suffering-bound wholes (e.g., if grief is constitutive of love, is the *joy* in that love also non-decomposable? Often, only the *suffering* gets this protective holism).
  3.  **Special Pleading:** If CSVT is applied *only* to defend the meaningfulness of suffering while readily decomposing *positive* complexes or suffering perceived as "pointless," *without a principled ontological distinction*, it reduces to ad hoc protection of valued narratives involving pain.

  ### Coined Term & Key Differentiator
  *   **Term:** **Constitutive Suffering Valuation Toggling (CSVT)**
  *   **Key Differentiator:** CSVT is defined by its *selective suspension of decomposition specifically triggered by suffering perceived as constitutive matter of a valued good*, contrasted against the *routine application of decompositional accounting to other welfare components by the same agent*. It’s the *toggle pattern itself*, tied to suffering's structural role, that defines it.

  **In essence:** CSVT exposes a tension between atomistic and holistic impulses in welfare evaluation. Its legitimacy hinges on whether the perceived constitutive link between suffering and the specific good is ontologically robust *and* whether the evaluator consistently applies ontological seriousness to other complex welfare states, not just those where suffering is embedded. When inconsistent, it becomes a tool to shield existentially comforting but painful narratives from utilitarian scrutiny. Recognizing CSVT allows us to demand: "If holism is valid here due to constitutive relations, why is decomposition valid there? What is the *principle* governing the toggle?"
