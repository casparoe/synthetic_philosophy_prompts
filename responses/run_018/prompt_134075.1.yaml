  Maya's rebuttal: She correctly notes scarcity as sustained idea-patterns isn't smuggling. Her consistency defense is robust, though she sidesteps how "labor as ideas" might dilute economic causality.

  Leo's push: His contagion point about collective crises is brilliant and exposes Berkeley's weakest flank - individual minds lack mechanics for herd behavior. But he misses Berkeley's potential recourse to divine coordination of ideas.

  Maya's close: She elegantly distinguishes coherence from redundancy, defending conventional links. Yet she doesn't resolve the contagion problem Leo raised.

  Overall, Maya edges it 3-2 for better textual grounding. But both overlook key nuances: Berkeley's God actively sustains economic patterns, making "real scarcity" more than convention. The divine will provides stability missing in pure conventionalism.

