answer: |-
  Here's a prioritized ranking of open questions in split-brain research for a philosopher/cognitive scientist (3 years, no wet-lab), focusing on leverage, avoiding dead ends, and building actionable consciousness theory:

  **#1: Synchronic Fragmentation vs. Cross-Cueing Mastery (The "Now" Problem)**
  *   **Why Upstream?** This directly challenges the fundamental assumption of a *single* conscious field at any instant ("phenomenal unity"). If synchronic fragmentation is proven, theories requiring unified consciousness (e.g., many global workspace variants, certain identity theories) collapse. If it's primarily sophisticated cross-cueing/deception, it reveals consciousness as fundamentally *interpretable* and potentially unified *despite* architectural disconnection.
  *   **Practical Attack:** Deep analysis of *existing, high-resolution behavioral data* (video archives from Gazzaniga, etc.) looking for micro-delays, micro-expressions, gaze patterns, or subtle motor adjustments *before* a response that betray one hemisphere inferring the other's state/intention covertly. Develop computational models simulating how much "spying" is needed to mimic unity vs. how fragmentation would manifest behaviorally differently.
  *   **Leverage:** Resolving this cuts the Gordian knot. It tells us if disconnection *splits the present moment* (huge for identity/AI) or just *splits access and reporting* (still important, but less radical).
  *   **Why Over Synchronic Unity Claims?** Many textbook summaries imply or assume synchronic unity based on patient reports *after the fact* – precisely where diachronic arbitration or cross-cueing could create the illusion.

  **#2: Diachronic Arbitration Failure Mechanisms (The "Story" Problem)**
  *   **Why Upstream?** Even if synchronic unity holds *now*, the inability to integrate experiences *over time* into a single narrative stream fundamentally disrupts personal identity and agency. This is crucial for understanding psychopathology, dementia, and designing AI agents that need coherent long-term goals.
  *   **Practical Attack:** Rigorously model the *computational requirements* for narrative integration. What specific cognitive functions fail (e.g., autonoetic consciousness? specific memory binding? conflict monitoring? meta-cognition?) when hemispheres can't directly share data? Analyze historical split-brain decision-making tasks for *temporal inconsistencies* not explainable by simple lack of info (e.g., conflicting preferences expressed minutes apart with no apparent conflict *at the time*).
  *   **Leverage:** Forces theories of identity and self to specify *which* temporal integrations are essential. Directly relevant to AI safety (how do failures in long-term coherence occur?).
  *   **Why Below Synchronic?** If synchronic fragmentation is true, diachronic failure is almost a given. If synchronic unity holds, diachronic failure becomes the *primary* challenge to identity, making it critical but slightly downstream.

  **#3: The Nature & Prevalence of Covert Interhemispheric Inference ("Spying")**
  *   **Why Upstream?** This isn't just a confound; it's a *feature* of how systems cope with disconnection. Proving its sophistication reveals consciousness as highly adaptive and inference-based, even under fragmentation. It blurs the line between "true unity" and "functional unity via clever hacking."
  *   **Practical Attack:** As mentioned in #1, mine existing behavioral data. Design "adversarial" thought experiments/tasks where cross-cueing would produce *specific, detectable errors* that true synchronic unity or true fragmentation wouldn't. Simulate learning mechanisms for spying in neural network models of disconnected systems.
  *   **Leverage:** Undermines arguments that behavioral unity *necessarily* implies ontological unity. Highly relevant for AI – how might submodules "spy" on each other to present a unified front without true integration?
  *   **Why #3?** While crucial for interpreting data in #1 and #2, its resolution depends heavily on the outcomes of those questions. It's a powerful mechanism, but its significance is contingent.

  **#4: What Constitutes "Report" in the Absence of Language? (The Right Hemisphere Problem)**
  *   **Why Important But Lower Priority?** The silent right hemisphere is central to the classic narrative. However, newer methods (e.g., complex non-verbal responses, eye-tracking, affective measures) *are* being used. The core philosophical questions (#1 & #2) can be addressed *even if* the RH's phenomenal state remains slightly elusive *if* we focus on the *system-level* outputs and conflicts. Obsessing over the RH's exact qualia without new tools is a potential dead end.
  *   **Practical Attack:** Focus on *conflict* paradigms where the RH's *preferences/intentions* (via non-verbal means) demonstrably contradict the LH's verbal report/action, regardless of the exact qualia. This speaks directly to fragmentation/arbitration.
  *   **Dead End Alert:** Endlessly rehashing *only* the LH interpreter vs. "mute" RH using 1970s paradigms is overrated. Modern work acknowledges RH capacities.

  **Overrated/Dead Ends to Avoid:**
  1.  **"Left-Brain Interpreter" as a *Unique* Module:** It's a useful heuristic, but likely an emergent property of LH language + inference capacities, not a discrete "thing." Both hemispheres "interpret," the LH just talks about it. Don't build fundamental theory on this specific localization.
  2.  **Animal Models for *Human-Like* Unity/Identity:** While informative about basic functions, they lack the linguistic/narrative dimension crucial for the key philosophical debates around identity and reportable unity. Not the best investment for *this specific goal*.
  3.  **Endless Replication of Classic Paradigms:** Simply rerunning Sperry/Gazzaniga tasks with new patients or slightly better tech won't crack the hard questions without novel *analytical frameworks* focused on fragmentation vs. arbitration vs. spying.
  4.  **Pure Neuroanatomy Without Computational/Functional Models:** Knowing *where* things are disconnected matters less than understanding *what computations fail* and *how the system adapts*.

  **The 3-Year Strategy:**
  1.  **Year 1:** Deep dive into *existing* split-brain behavioral data archives. Develop formal models of synchronic fragmentation, cross-cueing, and diachronic arbitration failure. Identify key behavioral signatures for each.
  2.  **Year 2:** Apply these models to re-analyze archival data for evidence of spying, synchronic conflicts masked by arbitration, or unambiguous fragmentation. Design purely conceptual/computational "adversarial tasks" that could distinguish these in principle.
  3.  **Year 3:** Synthesize findings into a coherent model of consciousness unity/fragmentation under constraint. Explicitly draw implications for personal identity (diachronic arbitration), phenomenal unity (synchronic), and AI design (resilience vs. true unity, risks of covert spying/subagent conflict).

  **Bottom Line:** Prioritize **Synchronic Fragmentation vs. Illusory Unity (#1)** because it strikes at the heart of "what it's like *right now*." Follow with **Diachronic Arbitration (#2)** because it defines the enduring self. Treat **"Spying" (#3)** as the crucial mechanism to validate or falsify #1. This approach forces concrete definitions of unity, focuses on system-level behavior accessible without labs, and directly impacts core theory far beyond split-brain specifics. Avoid rehashing localization myths or chasing animal consciousness ghosts for this project.
