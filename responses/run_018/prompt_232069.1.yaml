  Below is an 8-question quiz designed to help readers identify their implicit stance on quantum immortality within a many-worlds framework. Each question presents a concrete branching scenario, and answer options focus on practical expectations—avoiding labels, philosopher names, or explicit self-identification. The scoring key maps answer patterns to five philosophical positions, with notes on ambiguities and indistinguishable pairs.

  ---

  ### **The Quantum Immortality Quiz**
  *For each scenario, select the answer that best matches your expectation of what you would experience or find.*

  #### **1. Symmetric Russian Roulette**  
  You’re awake in a room with a quantum gun. A photon hits a 50/50 beam splitter: if reflected, the gun fires (fatal); if transmitted, it doesn’t (you survive). The device activates now.  
  - **A:** I’ll definitely survive—I’ll always find myself in a branch where the gun didn’t fire.  
  - **B:** I’ll survive roughly 50% of the time, only because I won’t experience the fatal branches.  
  - **C:** I have a 50% survival chance—it’s ordinary risk, nothing "immortal" happens.  

  #### **2. Duplication Booth**  
  You enter a quantum booth that duplicates you. One copy appears on Earth, another on Mars (both identical, with your memories). Both outcomes are real.  
  - **A:** I’ll experience being both copies simultaneously after duplication.  
  - **B:** I’ll experience being just one copy (Earth or Mars) and won’t know which until I "wake up" there.  
  - **C:** Neither copy is "me"—I’m gone, and two new people exist.  

  #### **3. Low-Probability Trigger**  
  Same quantum gun as #1, but now the beam splitter has a 99.99% transmission rate (0.01% chance of firing). You’re awake when activated.  
  - **A:** I’ll definitely survive—I’ll always end up in a non-firing branch.  
  - **B:** I’ll survive almost always, but only because I won’t experience the ultra-rare fatal branches.  
  - **C:** I have a 99.99% survival chance—it’s just a very safe bet.  

  #### **4. Asleep During Branching**  
  You’re put into dreamless sleep. While asleep, the 50/50 quantum gun from #1 activates. You’re awoken only if you survive.  
  - **A:** Upon waking, I’ll know I survived because I never experience death branches.  
  - **B:** Upon waking, I’ll realize I got lucky—I had a 50% chance of never waking up.  
  - **C:** Waking up just means the gun didn’t fire—no deeper implications.  

  #### **5. High-Risk Multiple Trials**  
  You undergo 10 sequential 50/50 quantum gun trials (like #1) while awake. After each, if alive, you continue.  
  - **A:** I’ll definitely survive all 10 trials—I’ll always experience a branch where I succeed.  
  - **B:** I’ll only survive if I beat 10 low-odds rolls, but since I don’t experience death, I’ll only recall surviving.  
  - **C:** My survival chance is near zero (~0.1%)—I’ll almost certainly die in one trial.  

  #### **6. Amplitude Lottery**  
  A quantum event has two outcomes:  
  - **Branch A (high amplitude):** You feel a mild electric shock (99% Born-rule probability).  
  - **Branch B (low amplitude):** You win $1M (1% Born-rule probability).  
  The event happens while you’re awake.  
  - **A:** I’ll experience winning $1M—I always continue in all branches, including the lucrative one.  
  - **B:** I’ll almost certainly experience the shock—low-amplitude branches are "rarer" for my perspective.  
  - **C:** I have a 99% chance of the shock and 1% of the win—it’s a standard lottery.  

  #### **7. Delayed Quantum Choice**  
  A quantum event creates two branches. In one, you press a red button; in the other, a blue button. After the event, you’re asked to press a button (you’re awake throughout).  
  - **A:** I’ll press both buttons—I experience all branches.  
  - **B:** I’ll press one button (red or blue) and won’t know which until I do it.  
  - **C:** The event creates two new people—I’ll be one of them pressing a button, unrelated to the "original" me.  

  #### **8. Shared-Branch Clone**  
  A quantum machine creates your clone in the same room. Both "you" share memories, and due to a glitch, branches don’t decohere—you can talk to each other.  
  - **A:** I’ll experience being both bodies simultaneously.  
  - **B:** I’ll experience being one body and see the clone as a separate person.  
  - **C:** Both are distinct people—neither is "me," but I happen to be one of them.  

  ---

  ### **Scoring Key**  
  Tally your answers (mostly A’s, B’s, or C’s) and use the table below to map them to positions. Positions are:  
  1. **Full Everettian QI**: You always continue in some branch, regardless of amplitude.  
  2. **Measure-Sensitive QI**: You survive but expect to experience higher-amplitude branches.  
  3. **Collapse/Born-Rule-Only**: Branching is illusory; survival follows Born-rule probabilities.  
  4. **Deflationary View**: Branching copies aren’t "you," so QI arguments fail.  
  5. **Mind-Continuity View**: Your consciousness follows one branch, even if multiple are real.  

  #### **Score Mapping**  
  | Answer Pattern           | Position | Notes                                                                 |  
  |--------------------------|----------|-----------------------------------------------------------------------|  
  | **Mostly A’s** (6+ A’s)  | 1        | Full Everettian QI.                                                   |  
  | **Mostly B’s** (6+ B’s)  | 2 or 5   | Could be **Measure-Sensitive QI (2)** or **Mind-Continuity (5)**. *Indistinguishable in this quiz.* |  
  | **Mix of B’s and C’s**   | 3        | Collapse/Born-Rule-Only. *(Typical pattern: B’s in Q2,4,7,8; C’s elsewhere).* |  
  | **Mostly C’s** (6+ C’s)  | 4        | Deflationary View.                                                    |  
  | **No Clear Majority**    | N/A      | Incoherent/unexplored stance. Re-take or see notes below.             |  

  #### **Notes on Ambiguities**  
  - **Indistinguishable Pairs**:  
    - **Positions 2 & 5** (Measure-Sensitive QI vs. Mind-Continuity) cannot be separated—both predict identical answers.  
    - **Positions 3 & 4** (Collapse vs. Deflationary) are partially separable: Position 3 often has B’s in duplication/sleep scenarios (Q2,Q4,Q7,Q8), while Position 4 is uniformly C’s.  
  - **Empty Positions**:  
