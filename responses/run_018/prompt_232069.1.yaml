    - **Incoherent Patterns** (e.g., mostly A’s but C’s in duplication scenarios) suggest unexplored/unstable intuitions.  
  - **Design Limitations**:  
    - Q3 (low-probability) and Q6 (amplitude lottery) distinguish Position 1 (A) from others but not 2/5 (B) from 3/4 (C).  
    - Q2/Q8 (duplication/clone) separate deflationary (C) from others but not 2/5 (B) from 3 (B/C mix).  

