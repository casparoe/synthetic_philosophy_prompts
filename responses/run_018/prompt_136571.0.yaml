answer: |-
  Here’s the complete exam package for the metaphysics professor, designed to push students beyond rote answers and force engagement with persistence conditions through a bio-engineered twist.

  ---

  ### **Exam Question: Metaphysics of Persistence (90 Minutes)**  
  **Prompt:**  
  The original Ship of Theseus (S1) undergoes a unique restoration: over time, its wooden planks are *replaced with bio-engineered coral* that grows into an atomically distinct but functionally identical structure. Crucially, this coral replacement involves **no causal continuity**—each coral piece is grown externally and swapped in disconnected events. Simultaneously, a museum reassembles all S1’s original planks into a perfect wooden replica (S2) in a different city.  

  Using **one** of the following metaphysical frameworks—  
  - **Endurantism** (objects persist by being wholly present at each time),  
  - **Perdurantism** (objects persist by having temporal parts), or  
  - **Conventionalism** (persistence is context-dependent, not objective)—  

  **Defend whether the coral-ship (S1-coral) should be considered the original Ship of Theseus.** Your answer must:  
  1. Explicitly state if S1-coral "survives" as the original ship.  
  2. Address the tension between *spatio-temporal continuity* (S2 has the original matter in sequence) and *functional continuity* (S1-coral operates identically).  
  3. Explain why this bio-engineered case disrupts standard intuition pumps about replacement.  
  *(Max 800 words; no bibliography required.)*  

  ---

  ### **Model Answer (Endurantist Perspective, 620 words)**  
  **Thesis:** Despite functional equivalence, S1-coral is **not** the original Ship of Theseus; S2 is the true survivor under endurantism.  

  **Endurantism Defined**: Endurantism holds that an object persists by being wholly present at every moment of its existence. Identity requires strict qualitative and causal continuity—the entity must maintain a spatio-temporally uninterrupted existence with intrinsic properties grounded in its material constitution.  

  **S1-coral (Coral-Ship) Fails Persistence**:  
  - While S1-coral mimics S1’s form and function, it lacks **causal-historical continuity**. The bio-engineered coral is inserted without any physical or causal connection to the original ship-building process. Each swap is an isolated event, severing the metaphysical "thread" of persistence. Endurantism rejects functional similarity as sufficient for identity; a perfect replica (even functionally superior) is distinct if disconnected from the original’s history.  
  - The **disrupted material basis** is fatal: S1-coral shares zero atoms with S1. Unlike gradual part-replacement cases (e.g., wooden planks swapped over years), coral insertion is acausal and non-integrated. S1-coral is a numerically distinct entity occupying the same space after S1’s de facto destruction.  

  **S2 (Replica) Retains Identity**:  
  - S2 possesses **spatio-temporal continuity** via reassembly. Though relocated, the original planks retain their historical connection to S1’s construction. Their reassembly restores S1’s intrinsic physical properties—unlike S1-coral, which is materially alien.  
  - Crucially, endurantism prioritizes **causal cohesion** over location: S2’s planks were preserved, not obliterated, allowing S1’s essence to "jump" discontinuities via reassembly (akin to a dismantled watch rebuilt).  

  **Tension & Coral’s Disruptive Role**:  
  The standard Ship of Theseus leverages ambiguity in "gradual change" to pit materialists against functionalists. Bio-engineered coral **exposes functionalism’s limits**:  
  - Functional continuity (S1-coral) is achieved through artificial, externally imposed processes with no genuine historical linkage. Intuition pumps fail because coral growth is *designed mimicry*, not organic development.  
  - Spatio-temporal continuity (S2) appears compromised by relocation, but endurantism resolves this by treating reassembly as persistence-under-fragmentation, not re-creation. Coral replacement, however, is substitution, not fragmentation.  

  **Conclusion**: S1-coral is a new entity; S2 is S1. Endurantism demands historical-material integrity, which bio-engineering deliberately voids.  

  ---

  ### **Marking Scheme (Total: 20 Marks)**  
  **A-Grade (17–20):**  
  - (4) **Framework Mastery**: Correctly defines chosen theory *in the context of persistence*, avoiding conflation (e.g., endurantism ≠ essentialism; perdurantism ≠ process philosophy).  
  - (4) **Coral-Specific Analysis**: Explicitly engages bio-engineering’s role—acausality, atomically distinct replacement—and its disruption of standard thought experiments.  
  - (4) **Tension Resolution**: Contrasts spatio-temporal (S2) vs. functional (S1-coral) continuity within the chosen framework, without defaulting to "both ships" ambiguity.  
  - (3) **Originality**: Identifies why coral invalidates textbook intuition pumps (e.g., functionalism falters under artificial/discontinuous replacement).  
  - (2) **Clarity & Precision**: Structured argument, avoids digression, adheres to word limit.  

  **B-Grade (13–16):**  
  - Summarizes the standard Ship of Theseus accurately but **underdevelops coral/replica nuances** (e.g., treats coral as "just another replacement material").  
  - Correctly applies a framework but **misses key coral-specific implications** (e.g., perdurantist who doesn’t address acausal part-insertion).  
  - **Conflates concepts**: E.g., "Endurantism requires original atoms" (essentialism) or "Conventionalism means anything goes."  
  - Addresses tension superficially (e.g., "S2 is spatially continuous but S1-coral works the same").  

  **C-Grade (9–12):**  
  - Misstates core tenets of chosen framework.  
  - Focuses excessively on S2/replica, neglecting S1-coral’s uniqueness.  
  - Repeats generic Ship of Theseus arguments without engaging bio-engineering.  

  **D/F-Grade (0–8):**  
  - Fails to defend a position or misidentifies frameworks.  
  - Ignores coral/replica structure entirely.  

  ---

  ### **Why This Works for the Article**  
  1. **Coral as a Disruptor**: Forces students beyond plank-swapping debates by introducing artificial, acausal replacement.  
  2. **Replica as a Red Herring**: Tests if students recognize that spatio-temporal continuity (S2) isn’t automatically decisive.  
  3. **Framework Precision**: Requires nuanced application—e.g., endurantists must reject S1-coral, perdurantists must treat it as a temporal segment.  
  4. **Anti-Regurgitation Guards**: Textbook definitions alone fail; students must explain *why* coral breaks standard intuitions.  

  This design rewards deep engagement—A-graders must diagnose how bio-engineering weaponizes the thought experiment against superficial answers. Perfect for exposing who’s philosophically wrestling vs. name-dropping.
