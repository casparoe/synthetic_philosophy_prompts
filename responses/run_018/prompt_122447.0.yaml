prompt: |-
  I teach an upper-level undergraduate seminar in moral philosophy: 14 students, mostly majors, all of whom have already had a normative theory course. We have a 75-minute session coming up on a topic I have found nearly impossible to teach by discussion alone — the difficulty of telling apart, within morality, a preference an agent genuinely holds from a bias the agent has simply acquired, and the related question of what a collective decision procedure ought to do with the difference.

  The students have already read the material on adaptive preferences and on proposals for discounting or cleaning preferences before they are allowed to count in a social choice. On the page every proposed test looks workable. What they do not have, and what I cannot supply by assigning one more paper, is any felt sense of why the distinction is hard to *operate*: why each candidate test — the availability of reasons, endorsement under fuller information, independence from the judgment's causal origin, fit with the agent's own interests — either fails to sort anything or does its sorting by smuggling in a first-order moral verdict under a neutral-sounding description. I want them to run into that themselves, and I want them to propose the tests rather than receive a list of them from me.

  So: design an activity I can run in that session.

  Constraints on the design.

  The distinction, and the vocabulary of preference, bias, laundering and adaptation, must not be named until the debrief at the earliest — ideally not until the last ten minutes. No framing lecture. The problem has to show up in what the students *do* before it is described.

  The raw material should be their own moral judgments, not invented cases, and the stakes should be small but real: something the class itself actually decides at the end of the hour, using only the judgments that survive whatever filter they devise. It cannot be anything that touches grades, standing, or anyone's employment, and it must degrade gracefully if two or three students decline to contribute anything personal at all — I will not have a session where non-participation is conspicuous. Assume I can spend about ten minutes preparing in the week before (collecting anonymous cards in advance, for instance), and no more.

  The mechanism I keep circling, which you should use or improve on: everyone writes two anonymous judgments in advance — one they would defend in argument, one they suspect they hold only because of where and how they were raised — each with a one-sentence supporting reason. I then pool and shuffle the whole set so provenance is lost, and the group has to sort the pooled cards using a test they invent on the spot. What appeals to me is that the pool is made of their own avowals, so nobody gets to treat the suspect items as belonging to someone else; and I suspect (though I have never run it) that they will not sort better than chance, and that the reasons they generate for a card will feel identical whichever pile it came from. What I lack is the second half: a way to turn the sorting into a real decision, so that they have to actually discount some of the pooled judgments and then notice that the discounted ones cluster — that the test they took to be neutral turned out to have a direction.

  A second device I have considered and cannot quite place: hand some cards back with a causal history attached — a story about how that judgment entered their culture, some of the stories invented by me — and see whether anyone abandons the judgment. My guess is that almost nothing gets abandoned regardless of which way the story points, which would show something about how little work the causal history does by itself. But I am not confident this is the right stage, or where it goes, and I would rather you placed it properly or dropped it than included it because I mentioned it.

  Deliverable. Please write about 1,500 words in these sections, in this order:

  1. "Overview" (~120 words) — what the hour does, and the one thing a student should see by the end that they could not see from the readings.
  2. "Materials and advance preparation" (~150 words) — including how I collect and pre-screen the cards without reading myself into a position where I know who wrote what.
  3. "The session, minute by minute" (~500 words) — a timeline, the rules and roles, what the students do, and the actual words I should use to prompt each stage.
  4. "Debrief" (~350 words) — map three or four specific moments onto the specific reasons each candidate test fails, and say when to name the distinction and what to say in the last five minutes.
  5. "Predictable failures" (~250 words) — at least four, each with a handling: the student who announces that everything is a bias so nothing needs sorting, the student who treats the exercise as a chance to diagnose their classmates, the group that colludes on a test designed to protect the majority's commitments, and whatever else you expect to go wrong the first time.
  6. "What this cannot do" (~150 words) — the part of the problem the activity structurally cannot reproduce and that I will have to supply in lecture or reading.

  Please do not include a reading list, bibliography, or citations; I have the literature and can find references myself. What I need is something I could set up and run on Thursday.
reasoning: |-
  Hmm, the user is teaching an upper-level moral philosophy seminar and needs a classroom activity to help students grasp the practical difficulty of distinguishing genuine preferences from biases. They've tried readings on adaptive preferences and preference laundering, but students aren't feeling why it's operationally hard. The key constraints are: no framing lecture, use students' own judgments with small stakes, no naming concepts until debrief, and it must handle non-participation gracefully.

  I need to design an activity where students experience the failure of neutral tests firsthand. The professor's idea of collecting anonymous judgments is solid - one "defensible" and one "suspect" per student. But we need to connect this to a real decision to make the sorting consequential. Choosing a class activity for next week works well - low stakes but real.

  For implementation: collect cards anonymously in advance through a locked box or digital form where students submit two judgments with reasons. I'll shuffle and number them to anonymize. Important to exclude anything too personal or disruptive during pre-screening.

  The session flow: Start by presenting the decision context (choosing an activity). Introduce the card pool as "class judgments" without revealing origins. Have groups develop sorting tests. When they apply these tests, they'll struggle - the "defensible" and "suspect" judgments will likely sort randomly. Then they'll vote using only "valid" judgments, and discover the outcome doesn't match if they used all data. This creates the cognitive dissonance we want.

  Key debrief moments: When tests produce arbitrary results, show this mirrors the failure of "reasons" criteria from literature. When causal history doesn't change judgments, demonstrate the irrelevance of origin stories. When sorting correlates with substance, reveal how "neutral" tests smuggle in moral assumptions. Finally name adaptive preferences and preference laundering concepts.

  For failures: The nihilist ("everything's biased") - redirect to operational necessity. The diagnostician - enforce anonymity. Majority protection - question their test's fairness. Consensus seekers - push them to commit to criteria.

  Limitations: The activity simplifies by using small-stakes judgments, whereas high-stakes decisions involve identity investment. We also can't cover institutional solutions or democratic theory complexities - those need supplementary lectures.

  The core insight is making students experience why philosopher's proposed tests fail in practice, using their own judgments as the material. The reveal that their "suspect" and "defensible" judgments were indistinguishable in sorting will drive home the lesson powerfully.
answer: |-
  ## Activity Design: The Judgment Filter Challenge

  **1. Overview (120 words)**  
  This session creates an experiential puzzle where students attempt to design and apply a neutral procedure for filtering "suspect" moral judgments from a pool they created. By forcing them to *use* their devised filter to make a real, low-stakes class decision (selecting a future activity), they confront the operational impossibility of distinguishing "genuine preference" from "acquired bias" using any proposed test (reasons, information, causal origin, interests). The key revelation is that seemingly neutral filtering criteria inevitably collapse into either arbitrariness (failing to sort) or substantive moral bias (silently privileging certain values). Students *feel* why the theoretical distinction crumbles in practice, setting up deeper engagement with preference laundering debates.

  **2. Materials and Advance Preparation (150 words)**  
  *   **Materials:** Index cards (2 per student + extras), pens, two large envelopes/bins labeled "VALID" and "INVALID", whiteboard/flipchart, markers. Optional: Digital submission form (e.g., Google Form) for anonymity.
  *   **Preparation (5-10 min, 1 week prior):**  
      *   Announce: "Next week, we'll decide a small class activity (e.g., field trip location, guest speaker topic, movie choice). To prepare, please submit *anonymously* two judgments:  
          1.  One moral/practical judgment about such activities **you feel confident defending** (e.g., 'We should prioritize accessibility', 'Fun activities undermine seriousness').  
          2.  One similar judgment **you suspect you hold mainly due to your background/upbringing** and might be less defensible (e.g., 'Only quiet places are suitable', 'Certain topics are off-limits').  
          **For each, add ONE sentence stating your reason.** Submissions are completely anonymous - use initials only if needed for tracking. I won't see who submitted what."
      *   Collect cards in a sealed box or via digital form. Briefly pre-screen *only* to remove duplicates, illegible entries, or anything manifestly disruptive/offensive (rare). Shuffle thoroughly and number cards sequentially (1-28). Place all cards face down in a single pile. Note the numbers corresponding to each type isn't tracked.

  **3. The Session, Minute by Minute (500 words)**  

  *   **(0-5 min) Setup & Framing:**  
      *   "Today, we need to decide on [Concrete Small Stakes Choice, e.g., 'where to go for our optional end-of-semester lunch', 'which short film to watch next week']. We have about 30 minutes to decide democratically. But first, we need our input. Last week, you all anonymously submitted moral and practical judgments relevant to making decisions like this – things like what values matter, what constraints we should consider. I've shuffled them all together. We have 28 inputs here." (Hold up pile).  
      *   "Here's the challenge: Not all inputs are equally valid for making a *fair*, *rational* group decision. Some judgments might be based on strong reasons, others might be... less reliable. Your task is to design a simple, *neutral* procedure – a **Filter** – that we can apply to *these specific inputs* to separate the judgments we should definitely **USE** in our decision-making (put in the VALID bin) from those we should **SET ASIDE** (put in the INVALID bin) because they might distort the process. The goal is fairness and rationality, not just getting the result you want. You have 15 minutes to design this Filter in small groups, then we'll test it."

  *   **(5-20 min) Group Filter Design:**  
      *   Divide into 3-4 small groups (randomly).  
      *   "In your groups, propose **one concrete, operational Filter rule**. It must be something we can apply *quickly* to *each individual card* by looking *only at what's written on it*. Examples might be: 'Does the reason given refer to a principle?' or 'Is the judgment stated positively?' **Crucially, your rule must be NEUTRAL – it shouldn't favor a specific outcome.** Write your proposed rule clearly on the board when you're done." (Circulate, challenge groups: "How is that neutral?", "Could that rule accidentally filter out good inputs?", "How would you apply that to a card saying X?").

  *   **(20-25 min) Filter Selection:**  
      *   Groups write rules on the board (e.g., "Judgment must cite a general principle", "Reason must be factual", "Judgment must promote inclusivity", "Cannot be based solely on personal feeling").  
      *   "Great. Now, let's choose *one* Filter rule to apply. We need consensus. Argue for your rule based on its **neutrality** and **effectiveness** at ensuring only valid inputs are used. Which rule is fairest and most likely to give us reliable inputs?" Facilitate brief discussion. Push for a vote if needed. Circle the chosen rule. "Okay, we're using Rule X: [State rule clearly]."

  *   **(25-40 min) Applying the Filter:**  
      *   "Now, let's apply our Filter. I'll read a card number and the judgment/reason aloud. After each, we'll take a quick, silent vote: Thumbs Up for VALID (use it), Thumbs Down for INVALID (set aside). Majority decides where it goes. We need to move quickly to get through them all. Remember, we're applying **only** Rule X – not whether we *agree* with the judgment!"  
      *   Rapidly read cards (number + content), conduct silent vote, announce result ("VALID" or "INVALID"), place card in corresponding bin. *Do not debate content.* Maintain pace. (If time is short, stop after 15-20 cards).

  *   **(40-50 min) Making the Decision:**  
      *   "We have our VALID inputs. Now, let's decide [The Choice] using *only* these inputs. Briefly review the VALID bin's judgments. What decision do these VALID inputs point us towards? Discuss for 5 minutes, then take a vote." Facilitate discussion focused *only* on the VALID cards. Hold a vote on the choice (e.g., "Option A", "Option B", "Option C").

  *   **(50-55 min) The Reveal & Comparison:**  
      *   Announce the decision based on VALID inputs.  
      *   "Okay, we made a decision using only what we deemed VALID. But I have the INVALID bin here too. Let's quickly look at what we set aside. [Read 2-3 random INVALID cards aloud]. Now, **hypothetically**, if we had included *all* inputs – both VALID and INVALID – in our discussion, do you think we might have arrived at a *different* final decision? Show of hands: Different outcome possible? Same outcome?" (Usually, hands will show potential difference).  
      *   "Interesting. So our Filter *changed* the outcome. Now, one last reveal: Remember, half of your submissions were judgments you felt **confident defending**, and half were ones you **suspected might be less defensible** due to background influences. The cards are mixed; I don't know which is which. But... looking at how we sorted them with our 'neutral' rule, and seeing that it changed our outcome... what does that make you wonder about our Filter?"

  **4. Debrief (350 words)**  

  *   **(55-65 min) Mapping the Struggle to Theory:**  
      *   **Naming the Distinction (Now!):** "What we just tried is at the heart of a deep problem philosophers grapple with: distinguishing an agent's **genuine preference** from an **acquired bias or adaptive preference**. We tried to 'launder' our inputs. We failed. Let's see why."  
      *   **Moment 1: The Filter Rules Proposed (Reasons/Information Failure):** "Many groups proposed rules like 'Must have a reason' or 'Must cite a principle'. We saw cards with seemingly 'good' reasons put in INVALID, and cards with 'weak' reasons put in VALID during the vote. Why? Because judging the *quality* or *sufficiency* of a reason **requires a substantive moral view** about what counts as a good reason or principle. Our 'neutral' rule smuggled in first-order values about reasoning itself."  
      *   **Moment 2: The Causal History Irrelevance (Origin Failure):** "Recall that *half* the cards were self-identified as potentially biased by upbringing. But during sorting, did *anyone* say, 'This sounds like it comes from bias, let's set it aside'? Probably not. Why? Because **you couldn't tell from the judgment/reason alone**. Knowing the causal origin *requires external information* we didn't have. The judgment itself doesn't wear its origins. A 'genuine' preference and a 'biased' one can look identical on paper."  
      *   **Moment 3: The Outcome Shift (Interest/Endorsement Failure):** "Our Filter changed the outcome. Why? Because the criteria we used (like 'promotes inclusivity' or 'cites a principle') **inherently favored certain types of values or ways of thinking** over others. What looks like filtering for 'rationality' or 'fairness' is often filtering *for a specific conception* of rationality or fairness. The test sorted based on *content* disguised as neutrality. Endorsement under 'full information' or fit with 'true interests' similarly requires a contested baseline."
      *   **Moment 4: The Arbitrariness (Operational Failure):** "Did anyone feel the sorting was somewhat arbitrary? That’s the core difficulty! Without smuggling in values, we struggle to find *any* operational handle. We either get chaos or disguised bias."

  *   **(65-75 min) Synthesis & Closing:**  
      *   "This is the operational quicksand of preference laundering: Proposed tests either fail to sort meaningfully or succeed only by implicitly imposing the very contested values they claim to be neutral towards. Distinguishing 'preference' from 'bias' requires a prior, substantive moral framework – the very thing we hoped the filter would help us *find* or *apply neutrally*. This doesn't mean the distinction is meaningless, but it shows why implementing it in collective choice (like social policy) is fraught. Thursday, we dive into how theorists try (and often fail) to escape this trap."

  **5. Predictable Failures (250 words)**  

  1.  **The Nihilist ("Everything is Bias!"):**  
      *   *Failure:* Student argues all judgments are biased, rendering the filter pointless.  
      *   *Handling:* "That's a profound philosophical challenge! But for *this exercise*, assume we *must* make a collective decision now. Even if all inputs are potentially biased, we still need a procedure to decide *which inputs to use* for *this* decision. Can we design a rule for *that*? What would a 'least bad' filter look like?" Forces engagement with the practical dilemma.

  2.  **The Diagnostician ("*That* sounds like Bob's bias!"):**  
      *   *Failure:* Student tries to guess authorship or diagnose bias in others based on card content.  
      *   *Handling:* Immediately interrupt: "Remember, this is anonymous. We are judging *the input itself* based *only on the text*, applying our neutral rule. We are not psychoanalyzing our classmates. Focus on the rule: Does [Rule X] apply to *this text*?" Reinforce anonymity and the textual constraint.

  3.  **Majority Protection Racket:**  
      *   *Failure:* Group proposes/selects a filter rule clearly designed to invalidate minority or dissenting views (e.g., "Must align with majority opinion on core class values").  
      *   *Handling:* During rule proposal/selection: "Interesting. How is that rule *neutral*? Doesn't it assume the majority's view *is* the valid baseline? What if the majority view *is* the biased one? Does this rule help us discover fairness, or just protect what we already think?" Force confrontation with circularity.

  4.  **The Consensus Seeker ("Let's just use them all!"):**  
      *   *Failure:* Group resists filtering, wanting to include everything to be "fair" or avoid conflict.  
      *   *Handling:* "Including everything *is* one approach. But the task is to design a filter *if we wanted one*. Imagine a high-stakes scenario where unreliable inputs could cause harm – how would you filter then? Let's pretend it's mandatory for this exercise." Highlight the purpose: testing the *possibility* of neutral filtering.

  **6. What This Cannot Do (150 words)**  

  This activity powerfully exposes the *operational impossibility* of neutral preference laundering at the point of input assessment. However, it **cannot** delve deeply into:
  1.  **Institutional Solutions & Systemic Effects:** It focuses on micro-filtering judgments, not macro-social choice mechanisms (e.g., voting systems, deliberative designs, constitutional constraints) that might *manage* biased preferences differently or focus on outcomes over inputs. You'll need lecture/discussion for this.
  2.  **High-Stakes Identity Investment:** The low-stakes judgments used here lack the deep entanglement with identity, oppression, or adaptive *harm* characteristic of core cases (e.g., oppressed groups internalizing disadvantage). The visceral impact and political urgency of laundering in those contexts requires separate, sensitive treatment through literature/case studies.
  3.  **The Democratic Dilemma Deeply:** While it shows filtering changes outcomes, it doesn't fully explore the tension between respecting individual sovereignty (even flawed preferences) and achieving substantively just/wise collective outcomes. This needs theoretical framing beyond the experiential failure.
  4.  **Positive Accounts Thoroughly:** It brilliantly shows *why* standard tests fail but offers little time for discussing alternative frameworks (e.g., capabilities, objective list theories) that might *ground* laundering non-neutrally. This is the crucial next step in your seminar.
