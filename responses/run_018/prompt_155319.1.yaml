answer: |-
  Alright, picture this: You're behind the Veil, designing your life strategy. You know the facts of existence – including that you'll hit these "preference revision events." Your core *values* will shift dramatically at certain points, but your *reasoning engine* – your ability to weigh options, calculate consequences, follow rules – stays intact. You're trying to pick the best ethical framework to live by.

  The standard indirect consequentialist move is: "Adopt rules *now* (like 'Be honest,' 'Keep promises') that, if followed generally, lead to the best *expected outcomes* based on your *current* values over your *whole* life."

  **Here's the rub:** You know with absolute certainty that your values *will* change later. So, you also know that *after* a revision event, your *future self* – using that same reasoning engine – will look at those rules you adopted *now*. They'll say: "Huh, these rules were optimized for my *old* values. But my values are *different* now. Following these rules *now* probably doesn't lead to the best outcomes according to my *new* values. Time to ditch 'em or tweak 'em!"

  This makes your initial commitment feel... hollow. It's unstable from the very start. Why build your whole ethical house on rules you *know* you'll rationally abandon later when your values shift? The future self, using the *same* reasoning, is practically *guaranteed* to see the old rules as suboptimal under the new value-set. The rule loses its authority the moment the revision hits.

  **The Obvious Comeback:** "Okay, smartypants," you say, "Why not just bake in a super-rule? Like: 'Always follow Rule Set X, **and never revise this rule itself, no matter how your preferences change.**' Problem solved! The commitment is locked."

  Let's dissect why this doesn't work:

  1.  **It Violates the Idealization (Knowing Revision is Inevitable):** Remember, you *know* behind the Veil that preference revisions *will* happen. So, you're sitting there, trying to design a rule *for yourself*, knowing full well that *future-you* (post-revision) will look at this "never revise" clause and think: "This is crazy! My values are fundamentally different now. Sticking rigidly to this old rule designed for obsolete values is *obviously* leading to worse outcomes *by my current lights*. My reasoning engine screams that this is irrational!" **You, designing the rule *now*, can *foresee* this exact reaction.** It feels like asking yourself to adopt a rule you *know* your future self – with the same reasoning capacity – will find utterly irrational and motivationally inert when the crunch comes. The idealization forces you to acknowledge this future dissonance; pretending the "never revise" clause will be respected *despite* knowing it violates future rationality feels like cheating the thought experiment.

  2.  **It's Just a Side-Constraint in Disguise:** Think about what this "never revise" clause *actually does*. Its primary function isn't to *optimize outcomes* according to whatever values you *happen* to have at any given time. Its primary function is to **override** the outcome calculations based on your *new* values. It says: "Even if breaking this rule *now* would lead to vastly better consequences *according to your current (new) values*, you MUST NOT break it because of a promise made under *old* values."
      That's **exactly** what a deontic side-constraint *is*! It's a rule that binds you *regardless* of the consequences it produces according to your *situational* value set. You've smuggled in a "Don't murder" or "Keep promises (even the meta-promise)" style constraint *on top of* the consequentialist rule-set. The "never revise" clause isn't a clever extension of consequentialism; it's the Trojan Horse bringing deontology right into the core. You're admitting that pure outcome optimization across value shifts is unstable, so you need a non-consequentialist anchor point – the inviolable promise to the past self.

  **Bottom line:** Knowing your future self will have the same reasoning but different values makes pure indirect consequentialism inherently unstable; any rule you pick now is doomed to be rationally abandoned later. Trying to "lock it in" with a "never revise" clause either asks the impossible (ignoring future rational judgment) or reveals you've already embraced a deontic side-constraint as the necessary foundation.
