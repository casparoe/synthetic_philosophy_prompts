  hey im in a metaphyics course and we just did leibniz's law and black's two spheres in an empty universe. my prof said its the classic counterexample to the identity of indescernibles, but i keep picturing it like two object instances in code that have identical properties but different memory addresses. can you restate black's argument and leibniz's reply using programming vocab - objects, pointers, hash values, memory allocation, instance IDs, etc. - as precisely as you can? then give me the residue report: what parts translate clean, what i had to distort to make them fit, and whether anything in the philosophers' debate has no real counterpart in how software handles identical objects. also inject the idea of two identical NFTs on the same blockchain with different token IDs into the translation and tell me if that actually clarifies the sphere case or if its just a gimmick. please answer in american english, keep it casual, and dont cite specific papers or books - im a cs minor who barely passed formal logic so just talk me through it.
