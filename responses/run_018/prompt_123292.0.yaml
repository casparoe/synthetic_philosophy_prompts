  We are designing an in-class game for a philosophy of mind seminar. The goal is to make participants feel the force of behavioral criteria for mind and then feel them collapse. 

  Key elements:
  - 8 participants: 4 "sources" and 4 "judges"
  - Sources write private answers to philosophical prompts, but a hidden "mediation layer" (a set of rules) rewrites every message before the judges see it.
