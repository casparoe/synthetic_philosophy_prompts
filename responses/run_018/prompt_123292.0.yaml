  - Judges start confident (they can ask follow-ups and feel they are tracking a single mind) and then crash into ambiguity when they learn about the mediation layer and that no source understands the rewritten output.
  - Include roles, timeline, payoffs in points, debrief.

  Twist: 
  - Instead of the classic imitation game, we have a mediation layer that acts as a cheap predictive filter.

