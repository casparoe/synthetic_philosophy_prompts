     - For each question, the instructor gives it to all sources. Each source writes an answer privately.
     - The mediation layer (instructor) collects the answers, picks one (e.g., the first one received) and applies the transformation rules, then sends the rewritten answer to the judges.

  4. Voting (5 min):
     - Judges vote by secret ballot: one mind or several minds. Also, they write their confidence (1-5) and optionally a bet (0-5 points).

  5. Reveal (5 min):
     - Instructor reveals the mediation layer: "There was a hidden mediation layer that rewrote every message. The rules were [explain rules]. Also, the sources never saw the rewritten output and were answering individually. The judges' questions were sent to all sources, and one answer was chosen and rewritten for each question."

  6. Calculate scores and discuss (40 min remaining? total 90, so 90-5-10-20-5-5=45 min for debrief and discussion? but we have to adjust).

  Debrief (45 min):
  - First, ask judges: Why did you vote the way you did? What behavioral cues made you think it was one mind? (e.g., consistent style, coherent responses, seemed to build on previous answers).
  - Then, point out that the mediation layer created that consistency artificially. The sources might have had divergent views, but the filter made it seem coherent.
  - Now, the crash: The behavioral criteria (like consistency) were satisfied, but the underlying reality was multiple. So the criteria were not reliable.
  - What broke? The criterion of coherence: it was artificially imposed. Also, the criterion of understanding: the sources didn't see the rewritten output, so they didn't understand the conversation as a whole. The judges thought they were tracking a single interlocutor, but they were actually interacting with a system that was aggregating and transforming multiple inputs.
  - Why is the filter making the criterion unreliable? Because it masks the multiplicity and creates a false unity.
  - What the game can't reproduce: the actual phenomenology of being spread across agents. The sources were not aware of each other and didn't form a group mind. The filter is a simple automaton. There was no shared intentionality or subjective experience of being distributed.

  Predictably go wrong:
  - Someone (a source or judge) might try to reverse-engineer the filter rules. To avoid this, we can tell sources not to worry about the output and just answer naturally. And for judges, we don't provide the original answers until the reveal.
  - Time: the follow-up might take longer. So we might limit to 3 follow-ups.

  Adjust timeline:
  - Intro: 5 min
  - Initial prompt: 5 min (if we have 4 sources, they write short answers, so 5 min should be enough)
  - Follow-ups: 15 min (3 questions, each taking 5 min: 2 min for judges to decide question, 3 min for sources to answer? But we can do: judges have 2 min to come up with a question, then sources have 2 min to answer, then mediation layer processes and sends. So 3 questions: 3*(2+2+1)=15 min? including processing time)
