  The core of their argument rests on making the t1 commitment both irreversible and epistemically sealed - by locking away surplus capital and predetermining update rules, they attempt to create a watertight shield against exploitation. But I notice they've overlooked a crucial implication of my opacity principle: the t1 self cannot anticipate how the very existence of the commitment device might alter the t2 evidential landscape.

