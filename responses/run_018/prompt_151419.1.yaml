answer: |-
  ## Borough of Ostensive Definitions – Planning & Civic Compliance: Frequently Asked Questions (FAQs)

  **Important Notice:** The Borough of Ostensive Definitions administers services and enforces regulations based solely upon patterns of communal use and contextually recognised similarities. Applications demanding "essential properties," "strict definitions," or "necessary and sufficient conditions" will be rejected as philosophically unsound and administratively impractical. Meaning is use.

  **1. How do I apply for a Domestic Furniture Licence for a new household item?**
  Residents seeking to licence an object as "Furniture" must submit Form R-7: "Resemblance Vector Declaration." This requires listing at least five (5) points of similarity to three (3) previously licensed items currently in Borough use (e.g., "resembles Chair A in supporting weight at approx. 45cm height," "resembles Stool B in primary material composition," "resembles Ottoman C in typical positioning within a dwelling"). Crucially, no single property (e.g., "has four legs," "is for sitting") is mandatory. A successful application demonstrates sufficient overlapping similarities within the established family of Borough Furniture, assessed holistically by the Resemblance Assessment Panel (RAP). Appeals based on the absence of a universal defining characteristic will not be entertained.

  **2. How do I report a suspected "Crime"?**
  Report potential crimes using Incident Form C-12. You must describe the event or action in detail, referencing specific contextual features observable to others, and cite at least two (2) previously adjudicated cases from the Borough Crime Register demonstrating overlapping similarities (e.g., "resembles Case #4587-B (theft) in unauthorised removal of property," "resembles Case #8921-F (fraud) in intentional misrepresentation of ownership"). The designation "Crime" is not determined by an abstract essence of criminality, but by its place within the network of publicly recognised wrongs established through precedent and communal reaction. Reports relying solely on private feelings of wrongdoing ("It *felt* criminal to me") are inadmissible.

  **3. How can I get my object officially classified as "Art"?**
  Apply using Form A-3: "Art Status Claim via Iterative Comparison." Submit the object (or documentation thereof) alongside detailed comparisons to three (3) distinct Borough-ratified Artworks. Comparisons should note overlapping features (e.g., "shares use of found materials with Ratified Artwork #334 (Duchamp Readymade Derivative),""displays non-utilitarian presentation akin to Ratified Artwork #712 (Abstract Canvas Series)," "elicits public discussion resembling reactions to Ratified Artwork #205 (Controversial Sculpture)"). Crucially, the object need not share *all* features with *any* single ratified artwork. Status is conferred based on sufficient integration into the evolving, overlapping network of practices and responses constituting the Borough's "Art" language-game. Queries regarding the "true nature" of Art are considered category errors.

  **4. Why are planning regulations so context-dependent? Isn't there a clear rulebook?**
  Administrative law within the Borough explicitly rejects the doctrine of "Crystalline Purity" (Planning Regulation 1.1b). Rules (e.g., "No structure exceeding 10m height in Zone R-4") are not self-interpreting algorithms fixed in advance. Their application depends entirely on context and similarity to past applications within the relevant language-game of urban planning. A proposed 10.1m flagpole may be permitted if judged sufficiently similar to previously approved "non-structures" or "decorative features," while a 9.9m residential building may be denied if its use and impact resemble previously rejected "overly dense developments." Rules guide practice but do not rigidly determine every outcome; their meaning *is* their established use in public deliberation and precedent.

  **5. What is the Borough's policy on rule application, referencing the "Thread" analogy?**
  Policy Directive PD/REF/SPIN formalises the Philosophical Investigations §66-67 analogy. Borough administration recognises that the strength of regulatory frameworks, like the strength of a thread, "does not reside in the fact that some one fibre runs through its whole length, but in the overlapping of many fibres." No single regulation, definition, or principle runs unchanged through all cases. Coherence and authority emerge solely from the continuous overlapping and criss-crossing of contextual similarities and established practices across the entire administrative tapestry. Seeking a single, unbroken "golden fibre" of definition is a misuse of administrative resources.

  **6. What is the Private Language Ordinance (PLO) and how are fines applied?**
  Per PLO §1: "The use of words or signs devoid of established communal criteria, traceable only to private sensation or internal states, is prohibited as meaningless and disruptive to public discourse." Citizens using terms in ways fundamentally untethered from publicly observable context or ratified communal practice (e.g., insisting a visibly red object is "gloopish" based on a private feeling, or redefining "chair" to mean exclusively "items purchased on a Tuesday") are subject to fines (Schedule PLO-F1). Enforcement relies on demonstrating the absence of any plausible resemblance to established public use. Appeals claiming privileged access to a private essence of meaning are invalid.

  The Borough administers shared life through overlapping practices, not essentialist definitions.
