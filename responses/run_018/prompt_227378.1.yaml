prompt: |-
  I am a novelist revising a speculative novel populated by animals, engineered creatures, artificial intelligences, and human societies, and I keep making intelligence serve the plot rather than arise from a creature’s actual cognitive equipment. I would like to operationalize a useful distinction among four kinds of minds: Darwinian creatures, whose effective responses are built in by selection; Skinnerian creatures, which can modify their behavior through reward and punishment during their lifetimes; Popperian creatures, which can test possible actions in an internal model before risking them; and Gregorian creatures, whose thinking is extended by language, symbols, institutions, and other culturally inherited tools. Treat these as capacities that may coexist in different degrees, not as four sealed species or as a ranking from less valuable to more valuable minds.

  Please develop a reusable character-design and revision procedure that I can apply to any fictional agent in about twenty minutes. It should provide an ordered sequence of diagnostic questions, specify what kinds of behavioral evidence would count as sufficient answers, and show how to distinguish superficially similar achievements—for example, avoiding a trap because of an inherited reflex, because of past punishment, because of rehearsing the outcome internally, or because one has learned a warning convention. Include tests for mixed and borderline systems, such as collectives, artificial agents, children, and beings whose internal simulation depends on an external notation. I would also like the procedure to enforce what I call counterfactual debt: whenever a character displays a cognitive ability, the fiction must identify the evolutionary history, learning history, imaginative practice, or cultural infrastructure that could plausibly have paid for it; otherwise the ability should be flagged as an authorial convenience. Mark the places where the classification is genuinely underdetermined and where a novelist must make a principled imaginative choice rather than discover a fact.

  Conclude by applying the procedure to three cases from my draft: a bioengineered guard animal that rapidly learns patrol routes but cannot conceive of a disguised threat; a swarm whose colonies appear brilliantly prescient because unsuccessful subcolonies die while successful ones proliferate, although no member represents the future; and my beloved alien oracle, whom I had imagined as a Gregorian supermind but whose every answer is generated from ancestral simulations fixed in its genome, with no capacity to learn after birth or borrow concepts from others. If the procedure assigns the oracle a less exalted kind of mind than I intended, do not rescue my preference; explain the result and then suggest the smallest change to the oracle’s history or mechanisms that would support the richer characterization. Finally, state what kinds of narrative mistakes the procedure can prevent, what it cannot settle about consciousness or moral status, and how it should be used as a revision tool without flattening fictional minds into a taxonomy.
reasoning: |-
  We are going to create a character design and revision procedure based on the four kinds of minds: Darwinian, Skinnerian, Popperian, and Gregorian. The procedure will consist of a sequence of diagnostic questions, each designed to probe for evidence of the different cognitive capacities. For each question, we will specify what behavioral evidence would count as sufficient to indicate a particular capacity. We will also note how to distinguish superficially similar achievements and how to handle mixed and borderline systems.

  The procedure will enforce "counterfactual debt": for every cognitive ability displayed, we must identify a plausible source (evolutionary history, learning history, imaginative practice, or cultural infrastructure). If no source is provided, it is flagged as an authorial convenience.

  The procedure will be applied to three cases: a bioengineered guard animal, a prescient swarm, and an alien oracle.

  ---

  **Character Design and Revision Procedure**

  **Step 0: Identify the Agent and Its Key Actions**
  - Note the agent (individual or collective) and list its key actions and decisions in the story that require intelligence.

  **Step 1: Test for Darwinian (Built-in) Responses**
  - *Diagnostic Question 1:* Does the behavior occur without any prior experience (either by the agent or by its ancestors in a way that could have been shaped by selection) and without any opportunity for learning? 
    - *Evidence:* The behavior is exhibited reliably in the appropriate context from the first exposure (e.g., a spider spinning a web without being taught). 
    - *Counterfactual Debt Check:* If the behavior is built-in, we must have an evolutionary history (or engineering design) that explains how such a fixed response could have been selected for. If not, flag as authorial convenience.

  **Step 2: Test for Skinnerian (Learned) Responses**
  - *Diagnostic Question 2:* Does the agent modify its behavior based on rewards and punishments received during its lifetime? 
    - *Evidence:* Behavior changes over time in response to consequences (e.g., a rat learning to press a lever for food). 
    - *Distinguishing from Darwinian:* If the behavior is modified by the agent's own experiences, it is Skinnerian. If the behavior is fixed and does not change with experience, it is Darwinian. 
    - *Counterfactual Debt Check:* We must identify a learning history (trial-and-error) that could have led to the learned behavior. If the learning is too rapid or complex without a plausible history, flag.

  **Step 3: Test for Popperian (Internal Simulation) Capacity**
  - *Diagnostic Question 3:* Does the agent consider possible actions internally without acting on them, and then choose an action based on the simulated outcomes? 
    - *Evidence:* The agent hesitates, plans, or shows signs of "thinking" (e.g., a chess player considering moves without moving the pieces). 
    - *Distinguishing from Skinnerian:* In Skinnerian, learning is by trial and error in the real world. In Popperian, the agent avoids real errors by simulating. 
    - *Borderline/External Notation:* If the agent uses an external tool (like writing or drawing) to simulate, that is a sign of Gregorian influence on Popperian capacity. Without external tools, it's pure Popperian. 
    - *Counterfactual Debt Check:* We must account for the development of the internal model. How did the agent acquire the model? (Evolution, learning, or cultural transmission?) If the model is too accurate without explanation, flag.

  **Step 4: Test for Gregorian (Symbolic/Cultural) Extension**
  - *Diagnostic Question 4:* Does the agent use language, symbols, or cultural tools to enhance its thinking? 
    - *Evidence:* The agent uses language to communicate, reasons using abstract concepts, or uses tools (like maps, books, or institutions) that it did not invent itself. 
    - *Distinguishing from Popperian:* Popperian simulation does not require symbols or culture. Gregorian extends Popperian by using external symbolic systems. 
    - *Counterfactual Debt Check:* We must identify the cultural infrastructure (language, education, institutions) that provides the symbols and tools. If the agent uses complex symbols without a cultural history, flag.

  **Step 5: Handle Mixed Systems and Borderline Cases**
  - *For Collectives:* Treat the collective as the agent. Ask: is the collective behavior the result of individual Darwinian/Skinnerian/Popperian/Gregorian minds, or does the collective as a whole exhibit one of these? 
    - *Evidence for Collective Mind:* If the collective's behavior cannot be reduced to individual actions (e.g., no single ant knows the colony's plan, but the colony as a whole acts as if it does) then it might be Darwinian (if the colony behavior is fixed) or Popperian (if the colony can adapt via internal changes without real-world trial). 
  - *For Artificial Agents and Children:* They may have mixtures. Children might show Skinnerian learning but not yet Gregorian. An AI might be built with Popperian simulation but without Gregorian if it lacks culture. 
  - *For Beings with External Notation:* If the being uses an external tool (like writing) to simulate, that is Gregorian. Without that, it's Popperian.

  **Step 6: Enforce Counterfactual Debt and Flag Authorial Convenience**
  - For every key action, trace back the cognitive capacity used and check for a plausible source. If a capacity is used without a source, flag it.

  **Step 7: Acknowledge Underdetermination and Make Choices**
  - Some behaviors might be explained by more than one capacity. For example, avoiding a trap could be:
    - Darwinian: inherited reflex (e.g., innate fear of dark holes).
    - Skinnerian: learned from past punishment (e.g., shocked by a trap before).
    - Popperian: imagined falling into the trap and avoided it.
    - Gregorian: read a sign saying "Danger: Trap" and avoided it.
  - In such cases, the novelist must make a principled choice that fits the character's overall design and the story's themes.

  ---

  **Application to Cases**

  **Case 1: Bioengineered Guard Animal**
  - *Key Action:* Rapidly learns patrol routes but cannot conceive of a disguised threat.
  - *Step 1 (Darwinian):* The guard animal is bioengineered, so its basic patrol instincts might be built-in. However, learning routes is not built-in because it must learn the specific routes. So not entirely Darwinian.
  - *Step 2 (Skinnerian):* The rapid learning of patrol routes is likely Skinnerian. It learns by reinforcement (e.g., reward for correct route, punishment for deviation). The inability to conceive of a disguised threat suggests it lacks Popperian simulation (it cannot imagine what a disguised threat might look like) and Gregorian (it doesn't use symbols to represent disguised threats).
  - *Step 3 (Popperian):* The animal does not show evidence of internal simulation because it cannot conceive of a disguised threat. It only reacts to what it has experienced.
  - *Step 4 (Gregorian):* No evidence of language or symbols.
  - *Counterfactual Debt:* The rapid learning is explained by engineering for Skinnerian learning. The lack of Popperian and Gregorian is explained by design limitations. This is consistent.
  - *Verdict:* Primarily Skinnerian, with some Darwinian base (for basic guarding instincts). The procedure confirms the design.

  **Case 2: Swarm with Prescient Colonies**
  - *Key Action:* Colonies appear prescient because unsuccessful subcolonies die and successful ones proliferate, but no member represents the future.
  - *Step 1 (Darwinian):* The colony's "prescience" is actually a result of selection at the colony level: unsuccessful variants die off, successful ones thrive. This is Darwinian at the colony level. Each colony is a "Darwinian creature" in the sense that its effective responses are built in by selection (of subcolonies). The colony does not learn or simulate; it just has a set of behaviors, and selection does the rest.
  - *Step 2 (Skinnerian):* The colony as a whole does not modify its behavior during its lifetime. Instead, the population of colonies changes. So not Skinnerian for an individual colony.
  - *Step 3 (Popperian):* No evidence of internal simulation. The colony does not test possibilities; it just acts, and failure leads to death (so no chance to learn). 
  - *Step 4 (Gregorian):* No symbols or culture.
  - *Counterfactual Debt:* The appearance of prescience is explained by the evolutionary mechanism at the colony level. This is plausible.
  - *Verdict:* Darwinian at the colony level (even though the colony is a collective). The procedure highlights that the prescience is an illusion of selection.

  **Case 3: Alien Oracle**
  - *Key Action:* Answers are generated from ancestral simulations fixed in its genome, with no capacity to learn after birth or borrow concepts.
  - *Step 1 (Darwinian):* The answers are generated by fixed ancestral simulations in the genome. The oracle does not learn or adapt after birth. Therefore, its responses are built-in by selection. 
  - *Step 2 (Skinnerian):* No learning during lifetime.
  - *Step 3 (Popperian):* The answers come from simulations, but these are fixed and ancestral. The oracle does not run new simulations; it reuses old ones. So it has the results of Popperian simulation (done by ancestors) but cannot do new simulations. 
  - *Step 4 (Gregorian):* No evidence of language or cultural tools. The answers are generated from internal, fixed data.
  - *Counterfactual Debt:* The fixed ancestral simulations are explained by an evolutionary history where the simulations were selected for. However, the oracle cannot adapt to new situations because it cannot run new simulations or learn. 
  - *Verdict:* The oracle is primarily Darwinian. It has the results of past Popperian simulations (from ancestors) but is not itself Popperian because it cannot simulate anew. It is not Gregorian because it doesn't use symbols or culture in a flexible way.

  **Adjusting the Oracle for a Richer Characterization (Gregorian Supermind)**
  - *Problem:* The oracle as described is not Gregorian because it lacks the capacity to learn after birth or borrow concepts. 
  - *Smallest Change:* Allow the oracle to update its simulations by incorporating new data from its environment or from interactions with others. For example, it might have a way to receive new information and run new simulations (making it Popperian) or even use a cultural database (Gregorian). 
  - *Alternative Change:* Make the oracle part of a cultural tradition where it receives updates from other oracles or a shared symbolic system. Then it would be Gregorian.

  ---

  **Narrative Mistakes the Procedure Can Prevent:**
  1. **Inconsistent Intelligence:** Assigning abilities without a source (counterfactual debt) leads to characters that act intelligently only when the plot requires.
  2. **Anthropomorphism:** Assuming human-like cognition in non-human agents without justification.
  3. **Under-explored Potential:** Failing to use the full range of cognitive capacities that the character's design might afford, thus limiting narrative possibilities.

  **What the Procedure Cannot Settle:**
  - **Consciousness:** Whether the agent is conscious or has subjective experiences.
  - **Moral Status:** Whether the agent deserves moral consideration. This depends on factors beyond cognitive capacities (like capacity for suffering).

  **How to Use Without Flattening:**
  - Treat the four kinds as overlapping capacities, not rigid categories. A character can have a mix.
  - The procedure is a diagnostic tool to ensure consistency and richness. It should not force every character into a box but help the author understand the cognitive infrastructure.
  - Use the results to explore the character's limitations and strengths, and how they interact with the world. This can lead to more interesting conflicts and developments.

  By applying this procedure, you can create more coherent and compelling non-human minds that feel real because their abilities are grounded in their evolutionary, learning, and cultural histories.
answer: |-
  Below is a reusable character-design and revision procedure tailored to your needs. It operationalizes the four cognitive categories (Darwinian, Skinnerian, Popperian, Gregorian) as overlapping capacities, not hierarchies or fixed types. The procedure enforces **counterfactual debt**—requiring plausible sources for any displayed ability—and includes tests for borderline cases. Apply it to any agent (individual, collective, AI, child, etc.) in ~20 minutes by following the sequence.  

  ---

  ### **Cognitive Design Procedure: 8 Diagnostic Steps**  
  **Goal:** Assign cognitive capacities to behaviors, identify counterfactual debt, and flag authorial convenience.  

  #### **Step 1: Identify Key Behaviors**  
  - **Question:** What specific actions/decisions does the agent perform that suggest intelligence? (e.g., "learns patrol routes," "avoids traps," "solves novel problems").  
  - **Evidence Needed:** List observed behaviors from the text. Avoid vague terms like "smart" or "wise."  
  - **Underdetermined Choice:** If a behavior fits multiple categories, note it for Step 7.  

  #### **Step 2: Test for Darwinian Foundations**  
  - **Question:** Is the behavior an innate, unlearned response shaped by evolution/design?  
  - **Evidence:**  
    - ✅ **Sufficient:** Behavior occurs without prior experience (e.g., a spider weaving a web).  
    - ❌ **Insufficient:** Behavior changes with individual experience.  
  - **Counterfactual Debt Check:** If Darwinian, specify the evolutionary/engineering pressure (e.g., "predator avoidance hardwired by selection"). If absent, flag as convenience.  
  - **Borderline Case:** Engineered creatures may blend Darwinian (pre-installed reflexes) with other capacities.  

  #### **Step 3: Test for Skinnerian Learning**  
  - **Question:** Is the behavior shaped by rewards/punishments during the agent’s lifetime?  
  - **Evidence:**  
    - ✅ **Sufficient:** Behavior adapts to feedback (e.g., a rat pressing a lever for food after trial-and-error).  
    - **Distinguish from Darwinian:** Skinnerian requires individual learning history; Darwinian does not.  
  - **Counterfactual Debt Check:** Identify the learning history (e.g., "guards learn routes via rewards from handlers"). If the learning is implausibly rapid without explanation, flag.  

  #### **Step 4: Test for Popperian Simulation**  
  - **Question:** Does the agent internally model actions before acting?  
  - **Evidence:**  
    - ✅ **Sufficient:** Agent hesitates, plans, or "imagines" outcomes without real-world trial (e.g., a chess player simulating moves mentally).  
    - **Distinguish from Skinnerian:** Popperian avoids real errors; Skinnerian learns from them.  
    - **Borderline Cases:**  
      - *External Notation:* If simulations rely on tools (e.g., writing, diagrams), it’s Gregorian-influenced Popperian.  
      - *Collectives:* If a swarm’s "decision" emerges from internal member interactions (not selection), it may qualify.  
  - **Counterfactual Debt Check:** Explain how the simulation capacity arose (e.g., "evolved for complex foraging in ancestors").  

  #### **Step 5: Test for Gregorian Extension**  
  - **Question:** Does the agent use language, symbols, or cultural tools to augment thinking?  
  - **Evidence:**  
    - ✅ **Sufficient:** Agent uses abstract symbols (e.g., words, math), learns from others, or engages with institutions.  
    - **Distinguish from Popperian:** Gregorian requires external tools; pure Popperian is internal.  
  - **Counterfactual Debt Check:** Identify the cultural infrastructure (e.g., "oracle inherits symbolic language from ancestors"). If symbols lack transmission mechanisms (teaching, writing), flag.  

  #### **Step 6: Assess Mixed/Borderline Systems**  
  - **Collectives (e.g., swarms):**  
    - Treat the collective as the agent. Ask: Does the group behavior require individual members to have the capacity?  
    - **Evidence:** If "prescience" emerges from selection (subgroups dying), it’s Darwinian; if from real-time communication, it may be Skinnerian/Popperian.  
  - **Children/Developing Agents:** Capacities may be partial (e.g., Popperian without Gregorian).  
  - **AIs/Engineered Beings:** Explicitly state which capacities are programmed (Darwinian) vs. learned (Skinnerian).  

  #### **Step 7: Resolve Underdetermined Cases**  
  - **Where Choice is Needed:** Behaviors with multiple explanations (e.g., avoiding a trap):  
    - *Darwinian:* Innate reflex (e.g., flinching from sudden movement).  
    - *Skinnerian:* Learned from past pain.  
    - *Popperian:* Imagined falling in.  
    - *Gregorian:* Heeded a warning symbol.  
  - **Action:** Make a principled choice based on the agent’s broader design. Consistency > realism.  

  #### **Step 8: Audit Counterfactual Debt**  
  - For **every behavior**, ask: *What paid for this ability?*  
    - Darwinian: Evolutionary history.  
    - Skinnerian: Individual learning history.  
    - Popperian: Practice with simulation.  
    - Gregorian: Cultural exposure.  
  - **Flag:** Any ability without a plausible "payer" as authorial convenience.  

  ---

  ### **Application to Your Cases**  
  #### **Case 1: Bioengineered Guard Animal**  
  - **Key Behavior:** Learns patrol routes quickly but ignores disguised threats.  
  - **Diagnosis:**  
    - *Skinnerian:* Learning routes via rewards (e.g., food for correct paths). Counterfactual debt paid by engineered reward systems.  
    - *Popperian/Gregorian Absence:* Cannot conceive disguised threats → no internal simulation (Popperian) or symbolic understanding (Gregorian).  
  - **Verdict:** Skinnerian dominant. Darwinian base (aggression hardwired). Consistent.  

  #### **Case 2: Prescient Swarm**  
  - **Key Behavior:** Colonies "foresee" threats; unsuccessful subcolonies die.  
  - **Diagnosis:**  
    - *Darwinian (Collective-Level):* Selection acts on colonies, not individuals. No individual represents the future; success is from subgroup proliferation/extinction.  
    - *Not Popperian/Skinnerian:* No internal modeling or real-time learning. "Prescience" is an evolutionary illusion.  
  - **Counterfactual Debt:** Paid by swarm reproductive dynamics (analogous to natural selection).  
  - **Verdict:** Purely Darwinian collective.  

  #### **Case 3: Alien Oracle**  
  - **Key Behavior:** Answers generated from fixed ancestral simulations in its genome; no post-birth learning.  
  - **Diagnosis:**  
    - *Darwinian:* Answers come from pre-installed simulations. No lifetime learning (Skinnerian) or cultural borrowing (Gregorian).  
    - *Popperian Absence:* It replays ancestral simulations but cannot run *new* ones. Like a DVD playing prerecorded footage.  
  - **Verdict:** Darwinian with "fossilized" Popperian traces. **Not Gregorian**—it lacks symbol manipulation or cultural updates.  
  - **Fix for Gregorian Supermind:** Smallest change → Allow it to *incorporate new data* into simulations. E.g.:  
    - "The oracle’s genome contains a *framework* for simulation, which it updates with observed events via neural plasticity." Now it’s Popperian (internal simulation) with Gregorian potential.  

  ---

  ### **What This Procedure Prevents**  
  1. **Cognitive Inconsistency:** e.g., A creature solving complex novel problems without Popperian/Gregorian tools.  
  2. **Counterfactual Debt Default:** Abilities appearing without evolutionary, learning, or cultural justification.  
  3. **Anthropomorphism:** Assuming human-like cognition in non-human minds (e.g., ascribing "intuition" to a Darwinian swarm).  

  ### **What It Cannot Settle**  
  - **Consciousness:** Whether an agent "feels" pain or has subjective experiences.  
  - **Moral Status:** Whether a Skinnerian lab animal deserves rights.  
  - **Ambiguity:** Some behaviors remain underdetermined (e.g., "instinctive" vs. "learned" fear).  

  ### **Using the Tool Without Flattening Minds**  
  - **Avoid Taxonomy Traps:** Present capacities as spectra (e.g., "mostly Skinnerian but with emergent Popperian traits").  
  - **Narrative Over Mechanics:** Use the framework to *deepen* conflict (e.g., a Gregorian AI trapped by its Darwinian core commands).  
  - **Highlight Limitations:** A Skinnerian agent’s trial-and-error errors can drive plot (e.g., costing lives).  
  - **Revise Iteratively:** Apply the procedure to key scenes, not every minor character.  

  By grounding cognitive abilities in plausible mechanisms, you’ll create richer, more immersive minds—while keeping the "speculative" in your fiction.
