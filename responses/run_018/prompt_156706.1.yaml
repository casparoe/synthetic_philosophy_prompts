  I should check if the user might be conflating circulation extension. The turnover formulas show that machinery shortens production time, potentially speeding up turnover. But circulation time (selling goods) isn't directly shortened by machinery. However, by producing more commodities faster, machinery could create bottlenecks in circulation. That's a secondary effect. The core link is production efficiency enabling faster capital rotation.

