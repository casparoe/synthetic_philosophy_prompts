  The user has specific requirements: include questions on the phenomenal concept strategy, revelation argument, and empirical findings about introspective failure. Other topics should cover eliminativism, sensory modality differences, self-undermining concerns, and physicalism. Questions should progress from conceptual to empirical.

  First, I recall this philosopher's position: phenomenal properties don't exist at all, first-person descriptions are uniformly false, and the illusion stems from representational opacity in self-modeling. That's a hardline stance. The challenge is designing questions that truly challenge this view without being superficial.

  For the phenomenal concept strategy question, I know defenders like Loar argue we have direct concepts that can't misapply. Her likely reply is these are empty functional representations. The follow-up should press on why they feel substantive if non-referential. 

  The revelation argument question needs to address claims that introspection reveals essences. She'll probably compare it to distorted perception. The follow-up should ask how we'd distinguish accurate from distorted introspection under her view.

  For empirical findings, I'll focus on introspective failures like change blindness. Main question: could subjects be rationally convinced they never had experiences? Follow-up should note we don't observe this conviction despite evidence.

  Other angles I consider crucial: 
