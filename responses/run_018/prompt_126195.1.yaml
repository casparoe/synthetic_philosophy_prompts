answer: |-
  ## Desiderata Specification for a Theory of the Biological Species Category

  This specification outlines requirements for an adequate theory of biological species, balancing the demands of evolutionary theory, contemporary conservation taxonomy, and paleontological classification. Core tensions arise from the dynamic, contingent nature of biological diversity versus the need for operational stability.

  **I. Foundational Non-Negotiables (Applicable Across All Domains):**
  1.  **Evolutionary Process Compatibility:** *Must* explicitly account for species as dynamic lineages undergoing descent with modification (speciation, extinction, anagenesis). **Motivation:** Core tenet of evolutionary biology; species are not static types but segments of evolving trees/networks.
  2.  **Operational Viability:** *Must* provide criteria allowing reasonably consistent identification/delimitation by practitioners using available evidence (morphology, genetics, ecology, geography). **Motivation:** Useless for science or policy if identification is perpetually ambiguous or requires omniscience.
  3.  **Contingency Acknowledgment:** *Must* accommodate the fact that species properties (e.g., cohesion mechanisms) are outcomes of specific evolutionary histories, not universal essences. **Motivation:** Recognizes diversity of life (e.g., obligate asexuals vs. obligate outcrossers) and avoids forcing all taxa into one mold.

  **II. Domain-Specific Requirements & Motivations:**

  | Requirement                          | Evolutionary Theory Motivation                                                                 | Conservation Taxonomy Motivation                                                               | Fossil-Lineage Motivation                                                                                  |
  | :----------------------------------- | :--------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------- |
  | **Lineage Cohesion Mechanism**       | Explain processes maintaining lineage integrity (gene flow, selection) *despite* change. **Case:** Hybrid zones as semi-permeable barriers, not species failures. | Prioritize mechanisms reflecting functional distinctness/persistence. **Case:** Ecological divergence without full RI defining unique conservation units. | N/A (Mechanism inference limited). Focus shifts to diagnosable continuity.                                 |
  | **Boundary Definition**              | Define transition points (speciation). **Case:** Conflict between RI onset vs. ecological divergence vs. genomic incompletion. **Case:** Hybrid speciation creating instant RI but non-monophyly. | Define units with high intraspecific cohesion & interspecific distinctness for management. **Case:** Diagnosable subspecies/ESUs vs. full species status debates. | Define temporal partitions within lineages. **Case:** Arbitrariness of chronospecies boundaries in gradual anagenesis. |
  | **Unit Coherence**                   | Resolve tension between reproductive cohesion (BSC) & monophyly (PSC). **Case:** Reticulate evolution (oaks, corals) violating strict monophyly. **Case:** Ring species defying binary "cohesive vs. separate". | Prioritize units maximizing intraspecific genetic diversity & adaptive potential. **Case:** Managing hybrid zones versus protecting pure parental forms. | Prioritize monophyly/holophyly based on available characters. **Case:** Cryptic convergence obscuring true relationships. |
  | **Asexual/Clonal Inclusion**         | Accommodate lineages lacking sexual reproduction. **Case:** Obligate asexuals (bdelloid rotifers, some fungi) forming persistent evolutionary lineages. | Define evolutionarily significant units (ESUs) based on genetic/ecological distinctness, not reproductive mode. **Case:** Conserving unique asexual clones. | Primary reliance on morphological/stratigraphic criteria; genetic cohesion irrelevant.                      |
  | **Temporal Scope**                   | Model species through deep time, including origins and extinctions. **Case:** Gradual speciation (anagenesis) vs. punctuated equilibrium. | Focus primarily on synchronic (contemporary) classification for immediate action.              | *Must* handle diachronic classification over geological scales. **Case:** Identifying ancestors-descendants within morphoclines. |

  **III. Flagged Conflicts & Jointly Unsatisfiable Desiderata:**
  *   **The Fundamental Trilemma:** Achieving **Strict Monophyly**, **Reproductive Isolation as Primary Boundary Criterion**, and **Universality (applicability to all life forms)** is *provably impossible* given known biology:
      *   **Hybrid Speciation:** Creates reproductively isolated lineages instantaneously, but they are non-monophyletic (e.g., *Heliconius* butterflies, sunflowers).
      *   **Reticulate Evolution:** Persistent gene flow between lineages (e.g., oaks, Arctic flora) violates both strict monophyly and complete RI.
      *   **Obligate Asexuals:** Lack sexual reproduction, making RI criteria nonsensical, while lineage coherence is maintained by mutation/selection alone, often defying clear monophyletic "bifurcation" points.
  *   **Cohesion vs. Diagnosability:** Maximizing intraspecific cohesion (e.g., gene flow across a ring species) directly conflicts with maximizing interspecific diagnosability for conservation or paleontology (treating ring ends as separate species).
  *   **Temporal Partitioning vs. Lineage Continuity:** Defining discrete chronospecies within a gradually evolving lineage (fossil need) is inherently arbitrary and conflicts with the evolutionary view of a continuous lineage.

  **IV. Comparative Assessment of Major Concepts:**

  1.  **Biological Species Concept (BSC - Focus on Reproductive Isolation):**
      *   **Strengths:** Strong on lineage cohesion mechanism for sexuals; clear(ish) boundary definition (RI); aligns well with gene flow models in evolutionary theory.
      *   **Most Damaging Desideratum Failure:** **Contingency Acknowledgment / Universality.** Catastrophically fails for obligate asexuals and is highly problematic for many plants, fungi, and hybrid zones. Severely damages operational viability in these groups and fossil application.

  2.  **Phylogenetic Species Concept (PSC - Focus on Monophyly & Diagnosability):**
      *   **Strengths:** Strong operational viability (diagnosable units); embraces monophyly aligning with phylogenetics; applicable to fossils and asexuals; handles some reticulation via network methods.
      *   **Most Damaging Desideratum Failure:** **Lineage Coherence (Reproductive Cohesion).** Prioritizing monophyly/diagnosability often fragments naturally cohesive populations (e.g., within ring species, geographically variable species) into multiple "species" lacking meaningful biological/evolutionary independence, damaging the understanding of cohesion mechanisms and creating impractical units for conservation.

  3.  **Domain-Pluralist Approach (e.g., Evolutionary Species Concept + Operational Concepts):**
      *   **Strengths:** Acknowledges contingency explicitly; uses different criteria/concepts pragmatically per domain/group (e.g., BSC-like for sexual animals, PSC-like for fossils/asexuals, ecological concepts for conservation); best accommodates the trilemma by not forcing one solution.
      *   **Most Damaging Desideratum Failure:** **Operational Viability (Consistency).** While flexible, it sacrifices a single, universal definition. This leads to inconsistencies in classification across groups and domains (e.g., is a "species" in paleontology the same "kind" as in neontology?), hindering communication, meta-analyses, and potentially policy implementation where a single standard is desired. The lack of a unified criterion is its core weakness.

  **Conclusion:**
  The desiderata highlight the inherent tension between viewing species as dynamic evolutionary processes versus static units for classification. No single concept satisfies all requirements simultaneously, primarily due to the **jointly unsatisfiable trilemma of strict monophyly, universal RI-based boundaries, and universality**, and the conflict between **lineage cohesion and operational diagnosability**. The BSC fails on universality, the PSC fails on recognizing cohesive units below the diagnosable threshold, and Pluralism fails on providing a single, consistent operational standard. Adequacy lies not in achieving perfection on all fronts with one concept, but in explicitly acknowledging these tensions and choosing frameworks (or combinations) that best serve the specific biological question or practical need at hand, while being transparent about their limitations. The theory must fundamentally embrace the **contingent** and **process-based** nature of species.
