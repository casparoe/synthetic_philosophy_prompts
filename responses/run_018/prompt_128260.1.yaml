  I need to carefully unpack Leibniz's concepts. His monadology does say that each monad expresses the entire universe from its unique perspective without direct interaction. But for moral truths, Leibniz maintains they're universal and necessary like mathematical truths. The key point is that monadic expression doesn't create moral truth - it discovers it.

