  First, I need to unpack each desideratum. The aggregation paradox is tricky because individual intentions often lead to unintended outcomes at the macro level. Then there's the need to keep micro and macro explanations distinct but connected—that's crucial to avoid reductionism. The archival bias point is about acknowledging that state records are skewed but not dismissing them entirely. Scalability without hand-waving is tough; historians often label things as important without clear mechanisms. Temporal lags add another layer—how actions ripple through time, maybe via institutions or cultural memory.

  The user's deeper need seems to be a coherent framework that respects agency while accounting for structural forces. They might be frustrated with existing theories that either overemphasize structures or reduce everything to individual actions. The joint unsatisfiability question is key: can you have both detailed micro intentionality and macro determinism? Probably not, since that's a fundamental tension in historiography.

  I should assess which desiderata are non-negotiable. Avoiding reductionism (points 1 and 2) and handling archival bias are likely essential. Scalability and temporal lags are critical but might be approachable through mechanisms like institutional memory or cumulative effects. The unsatisfiable pair is definitely intentional transparency at micro and structural determinism at macro—they're logically at odds. 

  Existing approaches might fail on aggregation and non-reductionism. For example, structural Marxism might collapse micro into macro, while pure narrative history might miss scalability. The user probably wants a theory that's dynamic, maybe using mechanisms like feedback loops or critical junctures to explain how micro events gain traction. Emphasizing contingency and path dependence could bridge temporal gaps without determinism. 

  In the end, the framework needs to treat micro and macro as interdependent but distinct levels, using specific mechanisms to show causation without falling into traps. Highlighting the tension between agency and structure as inherent rather than solvable might be honest, suggesting a pluralistic approach where different cases require different balances.
answer: |-
  Based on your razor-sharp focus, here's a breakdown of the **non-negotiable core desiderata** for a theory integrating microhistory into macro-causation, plus the points of tension:

  **Non-Negotiable Desiderata (The Hard Core):**

  1.  **Handle the Aggregation Paradox:** *Absolutely essential.* The theory MUST explain how actions driven by specific, local intentions (micro) lead to emergent outcomes at the macro level that are often unintended, unforeseen, and sometimes directly contradictory to those original intentions. *Failure here means the theory cannot connect micro-agency to macro-change.*
  2.  **Non-Collapse/Non-Reduction:** *Fundamental.* The theory MUST maintain distinct ontological and explanatory levels. Micro-explanations cannot be *reduced* to merely being effects of macro-forces (making villagers passive), nor can macro-explanations be *reduced* to simple aggregations of micro-actions (ignoring emergent properties/system effects). It must articulate *how* levels interact without dissolving one into the other. *Failure here reverts to either structural determinism or naive individualism.*
  3.  **Archive Bias Without Totalizing:** *Critical.* The theory MUST acknowledge the systematic bias in state archives (towards elites, state functions, normative perspectives) while simultaneously providing a *methodological pathway* to access subaltern voices, local logics, and contingent events *despite* that bias. It must treat the archive as a contested terrain, not a complete reality. *Failure here either ignores bias or dismisses all archival evidence as irredeemably tainted.*
  4.  **Scalability Mechanism (Not Just Importance Labeling):** *Essential.* The theory MUST provide a *causal mechanism* explaining *why and how* specific micro-events, practices, or conflicts gain traction, resonate, amplify, or become critical nodes within larger systems, while countless others fade. This needs more than "it was significant"; it needs the *process* of scaling (e.g., institutional capture, cultural contagion, network effects, critical junctures). *Failure here leaves the crucial link arbitrary or tautological.*

  **Highly Desirable & Challenging (But Slightly More Negotiable):**

  5.  **Temporal Lag & Generational Causation:** *Crucial but potentially derivable.* While vitally important, a robust theory satisfying points 1-4 *should* inherently provide tools to address lag. If the theory explains *how* micro-events alter structures, institutions, cultural repertoires, or resource distributions, then it inherently explains how these altered conditions become the context for future events, even generations later (e.g., via institutional memory, accumulated grievances, shifted norms, altered economic pathways). Explicit mechanisms for persistence/transmission (e.g., path dependence, institutionalization, cultural memory) strengthen this. *Failure here might indicate weakness in points 1-4, but lag could be addressed by extending core mechanisms.*

  **The Jointly Unsatisfiable Pair (The Tension):**

  *   **"Full intentional transparency at the micro level plus full structural determinism at the macro" IS logically contradictory and unsatisfiable within a single coherent causal framework.** These represent fundamentally opposed ontological commitments:
      *   **Full Micro Intentional Transparency:** Assumes actions are *primarily* explainable by individual/finite-group conscious motives, choices, and local knowledge. Contingency reigns supreme at the micro-level.
      *   **Full Macro Structural Determinism:** Assumes macro-outcomes are the *inevitable* result of large-scale impersonal forces (economic systems, deep cultural codes, geopolitical necessities, etc.), leaving no room for contingency or agency-derived variance at the macro-level.
      *   **Why Unsatisfiable:** If macro-outcomes are *fully determined* by structures, then micro-intentions are either (a) irrelevant noise, (b) themselves fully determined by the structures (collapsing micro into macro), or (c) incapable of altering the predetermined macro-path. This directly violates desiderata 1 (Aggregation Paradox - intentions *can't* cause unintended macro outcomes if macro is predetermined) and 2 (Non-Collapse - micro either disappears or is absorbed). Conversely, if micro-intentions are truly transparent and free, *and* capable of causing macro-change via aggregation/scaling, then macro-outcomes cannot be fully predetermined.

  **Which Desiderata Knock Out Existing Approaches?**

  *   **The Aggregation Paradox (1)** knocks out most simplistic "Great Man" history, pure structuralism (Marxist base/superstructure determinism, some Annales *longue durée*), and naive rational-choice aggregation models.
  *   **Non-Collapse/Non-Reduction (2)** knocks out both pure structural determinism *and* pure methodological individualism (where macro is just sum of micro). It also challenges overly simplistic dialectical models that still tend to privilege one pole.
  *   **Scalability Mechanism (4)** knocks out vast amounts of traditional narrative history and even some microhistory that remains purely descriptive or only asserts importance without demonstrating *how* the micro connects causally to larger shifts. It also challenges approaches that rely solely on "representativeness" as the link.
  *   **The Unsatisfiable Pair** knocks out any theory claiming *both* complete micro-agency/transparency *and* complete macro-determinism. Most sophisticated theories avoid these absolutes, but many lean heavily towards one end, struggling with the other.

  **The Core Challenge:** Building a theory that provides **mechanisms** for:
  *   **Emergence:** How micro-actions/intentions generate unforeseen macro-properties (Addresses 1 & 2).
  *   **Mediation & Scaling:** How specific micro-events/practices interact with existing structures, networks, and institutions to amplify, transform, or become embedded, explaining *why* some scale and others don't (Addresses 1, 2, & 4).
  *   **Contingency within Constraints:** How actors operate with intentionality and agency within, and against, structuring contexts that both enable and limit action, leading to path-dependent but not predetermined outcomes (Avoids the unsatisfiable pair, addresses 1, 2).
  *   **Source Criticism as Causation:** How the *process* of archival creation/omission/bias itself becomes part of the causal chain (e.g., suppressing dissent shapes future resistance, distorted records misdirect state policy) (Addresses 3).

  This spec demands a dynamic, multi-level, mechanism-focused theory that treats history as an interplay of contingent agency, evolving structures, and path-dependent processes across time scales, without granting ultimate primacy to any single level. It's a high bar, deliberately set.
