answer: |-
  Here is the argument articulated through the conceit of nested authorial regression, acknowledging the contested ground:

  **The Argument from Nested Authorial Regression:**

  Consider the self not as a prime mover, but as a character within an infinite, nested narrative. Each layer of "self" or "will" is authored by a prior layer of constitutive conditions, much like a fictional character's traits and choices are dictated by their author. Your character's core dispositions, values, and capacities – the very machinery of deliberation – are scripted by the "Author" of your genetic inheritance. But this Author is not sovereign; it is itself a character authored by the prior "Author" of environmental pressures and random mutations acting on ancestral DNA. That environmental Author, in turn, is authored by cosmic conditions, evolutionary history, and socio-cultural forces stretching back indefinitely.

  Where does genuine *self*-authorship reside? To be morally responsible in the *true* (ultimate) sense, your character must be the *uncaused author* of its own fundamental nature – the writer of its own "First Draft." Yet, like any character within the narrative, your "will" at any moment (T1) is a product of the traits and dispositions bestowed upon you by the prior Authors (genetic/environmental conditions at T0). You did not choose these initial conditions; they authored *you*. To claim responsibility for acting according to these traits (at T1), you must be responsible *for having those traits*. This requires that *you* (some prior "self" at T0) authored those traits. But that prior self (at T0) must itself have been authored by conditions at T-1... and so on, *ad infinitum*.

  **The Analogy's Precision and Limits:**

  1.  **Illuminating the Absence of *Causa Sui*:** The analogy perfectly captures the regress. Just as a character cannot escape its author's pen to *truly* rewrite its own origin story, the self cannot escape the causal chain that shaped its initial and ongoing constitution. There is no "first draft" authored *ex nihilo* by the self. Every decision, every reason-responsive mechanism, is part of the narrative authored *for* the character, not *by* the character in an ultimate sense. The "you" that responds to reasons is an authored product.
  2.  **Where the Analogy Might Fail & the Compatibilist Challenge:** The analogy potentially over-simplifies by implying a *single* external Author at each step. Reality involves complex, interacting causal chains. Compatibilists argue that **reasons-responsive mechanisms within the causal chain *can* halt the regress** for *practical* moral responsibility, *without* requiring impossible self-origination. They contend that when an agent acts based on their *own* (causally determined) desires, values, and capacity to recognize and respond to reasons – even if the origin of those elements lies beyond their ultimate control – this constitutes a sufficient form of control and authorship for responsibility *as we understand and require it in practice*. They reject the need for *causa sui*. *This is the core point of genuine contestation.* The analogy struggles to fully capture the phenomenology of internal deliberation and the potential normative significance of *how* a determined system processes reasons internally.

  **Separating Settled Regress from Contested Ground:**

  *   **Settled by Strawson's Regress:** The logical impossibility of *ultimate* self-origination (*causa sui*). No step in the causal chain allows an agent to be ultimately responsible for *being the way they are* at that step, because that "way" is always a product of prior causes/conditions for which they cannot be ultimately responsible. True buck-stopping responsibility is impossible.
  *   **Genuinely Contested by Compatibilists:** Whether the *absence* of *causa sui* and ultimate responsibility invalidates *all* meaningful concepts of moral responsibility, agency, and desert. Compatibilists argue that a sufficiently complex, reasons-responsive mechanism operating according to its *own* (determined) constitution *is* the author of its actions in the only sense relevant to holding agents accountable and structuring society. They deny that Strawson's "true" moral responsibility is necessary or coherent for our practices.

  **Conclusion:**

  \answer{True moral responsibility is impossible because it requires being *causa sui*—the ultimate, uncaused author of one's own fundamental will—yet every aspect of the self, including its reasons-responsive mechanisms, is necessarily authored by prior constitutive conditions beyond its control, initiating an inescapable regress of non-self-origination.}
