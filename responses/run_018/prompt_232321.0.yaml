answer: |-
  [Standing at my desk in the Commons, adjusting my spectacles, my voice precise but carrying a note of weary conviction]  
  You press upon the most sensitive nerve of my political philosophy, sir, and I acknowledge the apparent contradiction. But it is precisely *because* I hold liberty as the sacred ground of self-development for mature individuals that I defend the necessity, the *temporary* necessity, of British administration in India. The line I draw is not one of race or inherent capacity, but of present social condition and historical circumstance – the stage of civilization.

  You quote my principle correctly: over a mature human being in a state of society capable of improvement by free and equal discussion, power exercised without consent is justified only to prevent harm to others. **India is not presently in that state.** Centuries of despotic rule, fragmented sovereignties, deep-rooted social tyrannies like caste and suttee, and the absence of any tradition of self-governing institutions have, in my considered observation after decades of study and administration, rendered its peoples *incapable* of that free and equal discussion essential for representative government. They exist, politically speaking, in a state analogous to minors or wards. They are not "mature" in the sense required for the application of the strict harm principle in its domestic form.

  Is this paternalism? In a limited, functional sense, yes. But crucially, it is paternalism exercised **solely to foster the conditions where paternalism becomes unnecessary.** Our rule aims not to keep India perpetually dependent, but to educate it – in law, in administration, in the habits of public spirit – towards the capacity for self-government. We are trustees, not proprietors. The ultimate goal is their elevation to the stage where the harm principle *can* apply universally.

  Now, you ask why this line cannot be drawn around the poor or uneducated Englishman? Because England *is* in that mature state. The poorest English labourer exists within a society saturated with the traditions of liberty, common law, political discussion, and representative institutions. He possesses, by virtue of his citizenship and the surrounding culture, the minimal rational capacity and security of rights to participate, however humbly, in the "free and equal discussion" that shapes his society. He can form opinions, associate, petition, vote for local offices. To subject *him* to coercive improvement against his will would indeed be the intolerable paternalism I condemn, because it usurps the agency he demonstrably possesses within a functioning liberal framework.

  In India, that framework is absent. The alternative to our administration is not liberty, sir, but anarchy or the restoration of native despotisms far more oppressive than our own – despotisms that perpetuate the very barbarisms we seek to extinguish. We prevent a greater harm: the harm of internal chaos, predatory rule, and the stagnation that denies millions any prospect of reaching the maturity where liberty becomes their right. Our legitimacy rests on utility: the demonstrable improvement in security, justice (however imperfect), infrastructure, and the suppression of monstrous customs achieved under our administration, and the *intent* to cultivate self-governing capacity.

  Is it painful to reconcile with my deepest principles? Profoundly. But governance demands confronting the world as it is, not as we wish it were. We rule India not because we *want* to rule Indians, but because, tragically, no one else can currently rule them justly or prepare them for freedom. We discharge a duty history has thrust upon us, however imperfectly. To abandon that duty now would inflict far greater harm than continuing it with the aim of its own dissolution. That is the utilitarian calculus, and the moral imperative, as I see it.
