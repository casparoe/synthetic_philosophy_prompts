answer: |-
  ### The Job and the Debt Ceiling Rule  
  As a reviewer, your job is to decide which formal features of the source poem (rhyme, meter, etc.) to preserve in the translation, knowing each one forces semantic trade-offs—like altering images, tone, or literal meaning. Every preserved feature carries a "formal debt": the semantic distortion it causes. For example, forcing a rhyme might swap a vivid verb for a bland one. The debt ceiling caps total distortion for the poem. Set it at three "debt points" max. If preserving all features exceeds this, you must drop some to stay under budget. Think of it as a translation triage: which sacrifices best honor the poem’s soul?  

  ### The Flowchart in Words  
  Follow these steps in order. Assign debt points *before* applying the ceiling:  

  1. **Inventory formal features** (2 min):  
     List every formal element in the source: rhyme scheme (e.g., ABAB), syllable count per line, rhyme gender (masculine/feminine), acrostics, alliteration, or punctuation patterns.  

  2. **Flag non-negotiables** (1 min):  
     Identify features your press *always* preserves (e.g., "We never drop rhyme scheme"). These are untouchable—but their debt *still counts* toward the ceiling.  

  3. **Assign debt weights** (3 min):  
     Rate the semantic damage each feature causes if preserved:  
     - **Low (1 point)**: Minor tweaks (e.g., adjusting word order slightly to hit syllable count).  
     - **Medium (2 points)**: Noticeable shifts (e.g., changing "crimson sunset" to "red dusk" to force masculine rhyme).  
     - **High (3 points)**: Major rewrites (e.g., scrapping an image to maintain an acrostic).  
     *Tip: Debt depends on language gaps. An English-to-Spanish rhyme might be medium debt; English-to-Mandarin could be high.*  

  4. **Apply the debt ceiling** (3 min):  
     - **Under/at ceiling?** Keep all features.  
     - **Over?** Drop negotiable features (non-nonnegotiables) in this order:  
       - Highest debt weight first (e.g., ditch a 3-point acrostic before a 2-point rhyme).  
       - If tied weight (e.g., two 2-point features), use taste: Which matters more *for this poem*? (e.g., Keep meter over alliteration if rhythm is iconic).  
       - Still over? Drop next highest until under ceiling.  
     *Stop here: The final list is your preservation blueprint. Translation choices now flow from this.*  

  5. **Tiebreaker**:  
     If two equal-weight features conflict and both can’t stay (e.g., syllable count vs. rhyme gender), choose based on the poem’s core intent. No algorithm here—this is pure editorial judgment.  

  ### Two Test Runs  
  **Test 1: Clean Pass**  
  *Source*: 4-line lyric, ABAB rhyme, 8 syllables/line, masculine rhyme.  
  - Features: ABAB (med debt: 2 pts), syllables (low debt: 1 pt), masculine rhyme (low debt: 1 pt).  
  - Non-negotiables: ABAB.  
  - Total debt: 2 (ABAB) + 1 (syllables) + 1 (masculine) = 4 pts.  
  - *Ceiling check*: 4 > 3? **Over!** Drop negotiable with highest debt. Syllables and masculine both 1 pt—tie. Reviewer picks: Syllables feel essential (press prioritizes rhythm), so drop masculine rhyme. Final debt: 3 pts (ABAB + syllables). Pass.  

  **Test 2: Painful Trade-off**  
  *Source*: Same as above, but adds vertical acrostic spelling "LENA" (source alphabet).  
  - New feature: Acrostic (high debt: 3 pts—target alphabet lacks "L," forcing line rewrites).  
  - Non-negotiables: ABAB.  
  - Total debt if all kept: 2 (ABAB) + 1 (syllables) + 1 (masculine) + 3 (acrostic) = 7 pts.  
  - *Ceiling check*: 7 > 3? **Over!** Drop highest negotiable debt: acrostic (3 pts). New total: 4 pts (ABAB + syllables + masculine). Still over! Drop next highest: masculine rhyme (1 pt). Final: ABAB + syllables (3 pts).  
  - **Verdict**: Kill the acrostic and masculine rhyme. Poet screams—but the press saves rhythm and structure.  

  ### Where It Fails and You Have to Call It  
  This model cracks when:  
  - **Equal weights, equal importance**: Two features tied in debt *and* artistic value (e.g., syllable count vs. alliteration at 2 pts each). The flowchart forces a drop, but the choice becomes arbitrary—trust your gut.  
  - **Distortion depth**: A single "3-point" debt might hide catastrophic meaning loss (e.g., an acrostic reducing a political poem to nonsense). If counting it as one debt feels dishonest, override the system. Some poems are landmines—no tool defuses them perfectly.
