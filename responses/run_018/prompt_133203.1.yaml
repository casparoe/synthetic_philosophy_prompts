prompt: |-
  I'm prepping interview questions for next week's podcast ep with a philospher who defends Strawson's reactive attitudes but argues he missed a third mode — the "administrative stance" — that instutions take when they blame or penalize people without full reciprocal recognition. I want 6 or 7 questions that go past restating the view. Make sure there's at least one probing whether institutional resentment counts as literally reactive or is just metaphoric, one on how this stance deals with moral luck since bureaucracies don't feel guilt like persons do, and one asking whether treating offenders through an administrative stance erodes the participant stance citizens owe each other. For each question, include a sharp follow-up keyed to the answer she's most likely to give. Keep the tone casual — this is for spoken audio, not an academic panel — and don't ask for citations or a reading list.
