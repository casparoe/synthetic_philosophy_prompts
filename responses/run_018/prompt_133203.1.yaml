  For the institutional resentment question, I should push beyond the obvious "it's metaphorical" answer. If she takes that route, the follow-up should challenge whether institutions can have attitudes at all. But if she argues it's literal, we'll need to question how that works without conscious experience. 

  On moral luck, bureaucracies absolutely don't feel guilt - that's the core issue. The follow-up should press how automated systems handle luck-based disparities in punishment when they lack human judgment. Maybe use parking ticket vs manslaughter examples to make it concrete.

  The erosion question is the juiciest - does treating people like case files undermine how we treat each other? If she says yes, we'll ask about real-world consequences like dehumanization. If no, we'll demand how she reconciles that with Strawson's fundamental premise.

