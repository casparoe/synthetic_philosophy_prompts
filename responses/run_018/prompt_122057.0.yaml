answer: |-
  Below is a structured audit of the "consent-as-contract" analogy, its breakdown points, and a verdict with concrete answers to your cases. I’ll be explicit about where contested premises enter the analysis.

  ---

  ### **The Contract Analogy: Mapping the Metaphor**
  | **Contract Element**      | **Consent Analogy**                                                                 | **Key Players Using This**                                  |
  |---------------------------|-------------------------------------------------------------------------------------|------------------------------------------------------------|
  | **Offer**                 | Initiation of sexual activity (verbal/nonverbal)                                    | Libertarians, legal frameworks                             |
  | **Acceptance**            | "Yes" (explicit or inferred)                                                        | Campus policies (emphasize explicit "yes")                 |
  | **Consideration**         | Mutual exchange of sexual access/pleasure                                           | Libertarians, some legal analyses                          |
  | **Capacity**              | Competence (age, sobriety, cognitive ability)                                       | All sides (thresholds debated)                             |
  | **Fraud/Misrepresentation** | Deception about "material facts" (STI, identity, birth control)                   | Lawyers (materiality standard)                             |
  | **Duress**                | Coercion (physical threats, extortion)                                              | Legal systems, campus policies                             |
  | **Breach**                | Violation of agreed terms (e.g., stealthing, ignoring revocation)                   | Lawyers, campus adjudicators                               |
  | **Remedy**                | Punishment (criminal/civil), policy sanctions                                       | Legal/campus systems                                       |
  | **Third-Party Enforcement** | State, university Title IX offices                                                | Institutional frameworks                                   |

  ---

  ### **Where the Analogy Breaks (and Why It Matters)**
  1. **Fraud/Materiality: The "Fine Print" Problem**  
     - **Contract Logic:** Only deception about the *nature of the act* (e.g., lying that penetration is medical treatment) invalidates consent. Deception about *collateral matters* (e.g., vasectomy, marital status) is immaterial.  
     - **Breakdown:** Sex isn’t a discrete transaction but a relational act with context-dependent stakes. Contractual "materiality" ignores:  
       - **Relational Harm:** Lying about an STI or vasectomy risks bodily harm or life-altering consequences (pregnancy), violating bodily autonomy.  
       - **Subjective Valuation:** For some, monogamy or fertility is core to sexual meaning; for others, not. Contract law’s "reasonable person" test erases this.  
     - **Your Cases:**  
       - *STI/Vasectomy:* Invalidates consent **if** the lie negates a *fundamental condition* (e.g., "I only have sex with STI-negative partners"). *Contested claim: Bodily integrity is non-negotiable; deception here is always material.*  
       - *Lying About Being Single:* Only invalidates if the deceived partner explicitly conditioned consent on monogamy (rare). *Breakdown: Contracts can’t capture betrayal’s moral weight.*  

  2. **Duress: Beyond the Gun to the Head**  
     - **Contract Logic:** Duress requires imminent threat of harm. Social pressure ("I’ll break up with you") isn’t duress.  
     - **Breakdown:** Sexual consent operates in power-laden contexts (economic dependence, emotional fragility, social stigma). Contractual duress ignores:  
       - **Structural Coercion:** Saying "yes" to avoid homelessness, losing childcare, or social ostracization isn’t free choice.  
       - **The "Cheap Exit" Condition:** The philosopher’s point is **correct and transformative**. If exiting requires high social/emotional costs (ruining a party, losing a job), consent is compromised. *Contested claim: Meaningful consent requires practicable refusal.*  
     - **Your Case:**  
       - *Saying yes to avoid detonating the relationship/evening:* **Not valid consent** under the cheap-exit standard. The contract analogy fails here—it’s a bug in the model, not your case.  

  3. **Capacity: Binary vs. Spectrum**  
     - **Contract Logic:** Competence is binary (adult/minor, sober/intoxicated).  
     - **Breakdown:** Capacity in sex is *task-specific* and *situational*:  
       - A 17-year-old may grasp sex but not power dynamics with a 40-year-old.  
       - Mild intellectual disability may allow refusal in familiar contexts but not under pressure.  
       - Blackout drunk people may "initiate" but lack continuity of awareness.  
     - **Your Cases:**  
       - *Blackout drunk but enthusiastic:* **Incapacitated.** Contract’s binary "competence" is inadequate; *contextual awareness* matters more.  
       - *17-year-old seeking older partner:* Legally invalid (minors can’t consent to adults), but ethically gray. Contract frame oversimplifies developmental nuance.  
       - *Mild intellectual disability:* Requires **individualized assessment** of understanding *this act, with this person, under these pressures*.  

  ---

  ### **Verdict: Demote the Contract Analogy (with Exceptions)**
  - **Drop it as the foundational model.** It smuggles in a transactional, low-trust, commodified view of sex that distorts:  
    - Bodily integrity (ignored in "collateral deception" cases).  
    - Relational power dynamics (reduced to explicit threats).  
    - Ongoing mutual responsiveness (contracts are static; sex is dynamic).  
  - **Keep it as a heuristic for narrow cases:**  
    - **Fraud:** Useful *only* for deception about the *act itself* (e.g., impersonating someone’s spouse).  
    - **Capacity:** Retain for clear incapacitation (e.g., unconsciousness), but reject for marginal cases.  

  ---

  ### **A Better Metaphor: Improv with Guardrails**
  Your improv analogy (**jazz/climbing belay**) is superior:  
  - **Strengths:**  
    - Captures **mutual responsiveness**—partners continuously attune to cues.  
    - **Withdrawal is inherent:** Like a climber saying "take!" or a musician stopping the riff.  
    - **Process > outcome:** Aligns with how people actually experience good sex.  
  - **Guarding Against Normative Smuggling:**  
    - The improv model *doesn’t* require sex to be "cooperative" in a moral sense; even casual sex involves real-time negotiation.  
    - It avoids prescribing *why* people have sex (pleasure, connection, etc.)—it only describes *how* consent operates dynamically.  
  - **Practical Upside:**  
    - Explains why "enthusiastic yes" is better than mere absence-of-no: Improv relies on active participation.  
    - Fits "cheap exit": You can’t improvise if you’re trapped.  

  ---

  ### **Resolving Your Cases (Direct Answers)**
  1. **Deception:**  
     - **STI/Vasectomy lie:** Invalidates consent. *Why:* Violates bodily autonomy—a core condition of the act.  
     - **Marital status lie:** Does **not** invalidate consent *unless* explicitly discussed as a condition. *But:* It’s a moral breach the contract frame can’t address.  

  2. **Coerced-but-not-threatened "Yes":**  
     - **Invalid under cheap-exit.** If refusal risks relational harm, housing loss, or social exclusion, consent is compromised. *Contested claim: True consent requires relational safety.*  

  3. **Capacity:**  
     - **Blackout drunk:** Incapacitated. Consent invalid.  
     - **17-year-old with older partner:** Consent invalid (legally and ethically—power asymmetry exploits developmental limits).  
     - **Mild intellectual disability:** Consent valid **only if** they demonstrate understanding of *this specific scenario* and have refusal power. Reject global competence tests.  

  ---

  ### **What You’ll Need to Defend in Comments**  
  1. The **cheap-exit condition** (contested: some will argue all adults accept social risks).  
  2. **Bodily integrity** as a non-negotiable condition (vs. "buyer beware" libertarians).  
  3. **Rejecting binary capacity** (pushback from legal formalists).  
  4. The **improv metaphor** (critics will call it "vague" or "romanticized").  

  **Final Take:** The contract analogy is a Procrustean bed—stretching consent to fit it maims our understanding. Demote it to a niche tool. Improv better captures the lived reality of consent as a shared, ongoing practice. Your cases reveal the contract’s failures; the solutions lie in dynamic, context-sensitive models.  

  Would you like expansion on any section, or counterarguments to anticipate?
