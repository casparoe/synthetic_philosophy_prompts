answer: |-
  ### Core Mechanism
  Teams compete to derive target strings from the axiom MI using MIU rules, scoring points for short derivations and first solutions, but for impossible targets, grinding incurs point loss while a timely impossibility argument (using a property preserved by all rules) yields a bonus, forcing a shift from rule application to meta-reasoning.

  ### Game Rules and Materials
  **Materials**:  
  - Public ledger (whiteboard or shared sheet) with columns: *String*, *Derived by*, *Steps from MI*.  
  - Handout for each team:  
    > **Rules**:  
    > - **Axiom**: MI  
    > - **Rule 1**: If you have `xI`, derive `xIU` (add U at end).  
    > - **Rule 2**: If you have `Mx`, derive `Mxx` (double after M).  
    > - **Rule 3**: If you have `xIIIy`, derive `xUy` (replace III with U).  
    > - **Rule 4**: If you have `xUUy`, derive `xy` (remove UU).  
    > **Targets per round**: Claim by announcing to facilitator. New strings go on the ledger.  
    > **Scoring**:  
    > - First to derive target: **20 - steps + 5 bonus** (e.g., 3 steps = 22 points).  
    > - Other derivations: **10 - steps** (e.g., 3 steps = 7 points).  
    > - Declare impossibility (only after 5+ distinct strings in ledger): **+15 if correct, -10 if wrong**.  
    > - *No points for intermediates; only targets scored*.  

  **Setup**:  
  - 5–6 teams (3–4 students each).  
  - Ledger starts with: `MI` (axiom, 0 steps, "ALL").  
  - Facilitator verifies all claimed steps.  

  ### Timeline (80 minutes)  
  - **0–5 min**: Form teams, distribute handouts. Briefly: "Derive targets from MI using these rules. First target: MIU. Go!"  
  - **5–15 min (Round 1: MIU)**: Teams derive `MI → MIU` (Rule 1, 1 step). Fast, low-stakes win.  
  - **15–25 min (Round 2: MII)**: Teams derive `MI → MII` (Rule 2, 1 step). Reinforces rule use.  
  - **25–50 min (Round 3: MU)**: Teams struggle. Ledger fills (e.g., `MII`, `MIU`, `MIIU`, `MIIII`, `MIUU`). At 35 min, announce: "Stuck? Request an impossibility certificate template." Distribute template (below) on request. Teams submit certificates; check mid-round.  
  - **50–65 min (Round 4: MIIU)**: Target derivable: `MI → MII` (Rule 2) `→ MIIU` (Rule 1, 2 steps). Invariant doesn't block it.  
  - **65–70 min (Twist)**: Alter Rule 2 to: "From `Mx`, derive `Mxxx` (triple after M)." Announce: "Now can you derive MU? Try!" Teams derive `MI → MIII` (new Rule 2) `→ MU` (Rule 3).  
  - **70–80 min (Debrief)**: Discuss "inside vs. outside," using game moments (see debrief script).  

  ### Target Strings and Answer Key  
  1. **MIU**:  
     - **Derivation**: `MI` (axiom) `→ MIU` (Rule 1, 1 step).  
  2. **MII**:  
     - **Derivation**: `MI` (axiom) `→ MII` (Rule 2, 1 step).  
  3. **MU**:  
     - **Impossible**. Argument:  
       - Property: *The number of "I"s is not divisible by 3*.  
       - Axiom `MI`: 1 "I" → not divisible by 3.  
       - Rules:  
         - Rule 1: Adds U → "I" count unchanged → preserves.  
         - Rule 2: Doubles "I"s → if not div. by 3, 2× not div. by 3 (e.g., 1→2, 2→4≡1, 4→8≡2 mod 3) → preserves.  
         - Rule 3: Replaces III with U → "I"s decrease by 3 → not div. by 3 preserved (e.g., 4→1).  
         - Rule 4: Removes UU → "I" count unchanged → preserves.  
       - Target `MU`: 0 "I"s → divisible by 3 → lacks property.  
  4. **MIIU**:  
     - **Derivation**: `MI → MII` (Rule 2) `→ MIIU` (Rule 1, 2 steps).  

  ### Impossibility Certificate Template  
  *(Handed out during Round 3 when teams are stuck)*  
  > We believe `[TARGET]` is impossible because every derivable string has:  
  > **Property**: _________ *(must be non-vacuous: not true of ALL strings, e.g., "contains M" is invalid as MU has M)*.  
  > - **Axiom MI has it?** [Yes/No]  
  > - **Rules preserve it?**  
  >   - Rule 1: [Yes/No]  
  >   - Rule 2: [Yes/No]  
  >   - Rule 3: [Yes/No]  
  >   - Rule 4: [Yes/No]  
  > - **Target has it?** [Yes/No]  
  > *Non-vacuous clause*: This property fails for `[EXAMPLE]` (e.g., `M` or `UU`—strings not in the ledger).  

  ### Twist: Altered Rule and Truth  
  - **Altered Rule 2**: "From `Mx`, derive `Mxxx`" (triple after M).  
  - **Certificate breaks**: Old invariant ("I"s not div. by 3) fails. Axiom `MI` (1 "I") → `MIII` (3 "I"s, div. by 3) via new Rule 2.  
  - **Actual truth for MU**: Now derivable!  
    - Derivation: `MI → MIII` (new Rule 2) `→ MU` (Rule 3: replace `III` with `U`).  

  ### Debrief Script  
  - **Inside the system (25–35 min)**: "You applied rules blindly—like a machine. Ledger grew, but MU eluded you."  
  - **Jumping out (35–50 min)**: "When stuck, you shifted to *reasoning about* the system. Your certificate (e.g., 'I’s not div. by 3') is an *invariant*—a meta-property."  
  - **Asymmetry**: "Invariants prove *non-derivability* (e.g., MU lacked it). But if an invariant *holds* (e.g., MIIU had it), that doesn’t prove derivability—you still needed a derivation! Silence isn’t evidence."  
  - **Twist**: "Altering Rule 2 broke your invariant, showing invariants depend on rules. Now MU was derivable—back inside the system!"  
  - **Big picture**: "In cognition/logic, 'jumping out' lets us see limitations (e.g., Gödel). But unlike the game, real systems may have no findable invariant!"  

  ### Predictable Problems and Fixes  
  1. **Problem**: Teams overlook declaring impossibility.  
     **Fix**: At 35 min, announce template availability and scoring incentive ("Grinding gives 0; a certificate gives 15!").  
  2. **Problem**: Wrong certificates (e.g., "length > 0" → vacuous).  
     **Fix**: Reject during submission: "Check non-vacuous clause! Does MU have your property?"  
  3. **Problem**: Incorrect derivations (e.g., misapplying Rule 3).  
     **Fix**: Facilitator verifies each step during claims; invalid steps discarded.  
  4. **Problem**: Teams stall in Round 4.  
     **Fix**: Hint: "Try Rule 2 then Rule 1 on MI."  

  ### What the Game Cannot Reproduce  
  The game cannot replicate **why we care** about "jumping out." You must explicitly say:  
  > "In formal systems, this 'jump' is how we prove unprovability (e.g., Gödel’s incompleteness). In cognition, it’s how we realize our biases. Today, you *experienced* the jump—from pushing symbols to seeing why they fail."
