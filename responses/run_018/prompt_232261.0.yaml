prompt: |-
  Before I evaluate any further proposals about who should be entitled to vote, I want to fix what an adequate theory in this area has to deliver. Write the desiderata for a theory of the franchise and its character: who should be entitled to vote, and whether voting is best understood as a right or as a legal duty. For each desideratum, give the case or consideration behind it, and mark which are non-negotiable requirements that any plausible view must meet and which are merely preferences of a particular camp. Include any distinctions such a theory must respect — for instance, the difference between being subject to a polity's laws and being affected by its decisions, or between a right to vote and an obligation to vote — with the case for why each distinction carries weight. The pressure points I most want addressed: proposals to lower the voting age down through adolescence and toward children, extending the vote to long-term non-citizen residents, the status of non-resident citizens, disenfranchisement of prisoners and ex-felons, voters with severe cognitive disabilities, and compulsory voting systems that treat turnout as a legal obligation. Then flag any pairs of desiderata you suspect cannot be jointly satisfied, and say which requirement does the most to exclude otherwise plausible candidates. For example, a principle that everyone significantly affected by a polity's decisions should have some say pulls toward very broad enfranchisement, while any competence condition pulls toward restriction; if that tension cannot be fully dissolved, say which side has to give and why. The part I most want is the diagnosis of tensions among the criteria themselves, not a scorecard of existing positions.
reasoning: |-
  Okay, let me approach this systematically. The user wants a comprehensive framework for evaluating franchise theories, with special attention to inherent tensions between principles. 

  First, I need to map the core desiderata. The non-negotiables seem clear: legitimacy requires that the governed authorize their government, while stability demands that exclusion criteria don't undermine the system's acceptance. But the "affected interests" principle is trickier - if taken literally, it could include global populations affected by climate policies, which clashes with territorial sovereignty. 

  The competence vs. inclusion tension stands out as particularly thorny. Lowering voting age tests this: developmental psychology shows prefrontal cortex maturation continues into the 20s, yet many 16-year-olds demonstrate political understanding. Do we prioritize cognitive benchmarks or socialization benefits? The dementia dilemma amplifies this - revoking votes from declining elders feels unethical, yet cognitive thresholds must mean something.

  On non-resident citizens, I'm struck by how residence vs. citizenship tests different values. Tax-paying expats have clear stakes, but if they don't experience domestic policy consequences, does that violate the "live under laws" principle? Meanwhile prisoners present a perfect storm: retributive justice conflicts with rehabilitation goals, and recidivism studies suggest disenfranchisement hinders reintegration.

  The compulsion paradox fascinates me - making voting obligatory might safeguard equality, but coerced participation seems to undermine the very autonomy voting represents. Emerging research on compulsory voting shows increased turnout but mixed effects on engagement quality.

  What the user really needs is the friction map, not solutions. Like how "all affected interests" inflates the electorate beyond practicality while competence constraints shrink it, forcing us to choose between ideal inclusion and functional governance. Or how prisoner voting rights directly oppose popular conceptions of civic dishonor. These aren't flaws in theories but inevitable collisions between values that can't be fully reconciled.
answer: |-
  Here is a structured analysis of desiderata for a theory of the franchise, key distinctions, pressure points, and inherent tensions:

  ### I. Core Desiderata for a Theory of Franchise
  *(Non-negotiables marked **)***

  1.  **Legitimacy of Authority (Non-Negotiable \*)**
      *   **Requirement:** The franchise must be distributed such that the resulting government can claim legitimate authority over those bound by its laws.
      *   **Case:** A government imposing coercive force without a plausible claim to authorization by the governed lacks moral/political legitimacy (rooted in social contract theory & democratic principle).
      *   **Non-Negotiable:** Any viable theory must explain how the regime's authority is justified to those subject to it.

  2.  **Subjection to Law (Non-Negotiable \*)**
      *   **Requirement:** Those permanently and comprehensively subject to a polity's coercive laws must have a route to participation in shaping those laws.
      *   **Case:** Being bound by laws one had no possibility to influence is the essence of political alienation and tyranny ("no taxation without representation").
      *   **Non-Negotiable:** Core to the democratic ideal of self-government for a defined community.

  3.  **Collective Self-Determination (Preference)**
      *   **Requirement:** The franchise should enable the polity to determine its own character, values, and future direction.
      *   **Case:** Preserves cultural identity, shared values, and the ability of a community to steer its own course. Often leans towards prioritizing citizens/residents with long-term stakes.
      *   **Preference:** Emphasized by communitarian/nationalist views, but less absolute than subjection to law.

  4.  **Protection of Fundamental Interests (Non-Negotiable \*)**
      *   **Requirement:** The franchise system must protect the basic rights and fundamental interests of *all* individuals within the polity's jurisdiction, including those excluded from voting.
      *   **Case:** Prevents tyranny of the majority and ensures basic justice for minorities, children, non-citizens, etc. Rooted in human rights/human dignity.
      *   **Non-Negotiable:** A system violating this fails as minimally just, regardless of voting rules.

  5.  **Minimum Competence/Agency (Preference with Non-Negotiable Core)**
      *   **Requirement:** Voters should possess a minimum threshold of cognitive capacity and agency necessary to understand the act of voting and its consequences.
      *   **Case:** Voting aims at collective self-government; if choices are fundamentally random or incomprehensible to the voter, the legitimacy and epistemic value of the process are undermined.
      *   **Character:** *Non-Negotiable Core:* Utter lack of capacity (e.g., profound unconsciousness) justifies exclusion. *Preference:* Where the precise threshold lies (e.g., age, cognitive disability) is contested.

  6.  **Stability and Functionality (Preference)**
      *   **Requirement:** The franchise system should contribute to, not fundamentally undermine, the stable and effective functioning of the democratic system.
      *   **Case:** Democracy requires institutions capable of making decisions and enduring. Extremely broad/incoherent electorates or systems provoking widespread rejection could be destabilizing.
      *   **Preference:** Weight given varies; often used to argue against extremes.

  7.  **Equality of Consideration (Non-Negotiable \*)**
      *   **Requirement:** Within the defined electorate, each vote must carry equal weight. Exclusion criteria must be justifiable based on relevant principles, not arbitrary or invidious discrimination.
      *   **Case:** Foundational to the democratic ideal of equal citizenship and political equality. Arbitrary distinctions (e.g., race, wealth) are inherently illegitimate.
      *   **Non-Negotiable:** Unequal voting power or discriminatory exclusions violate core democracy.

  8.  **Affected Interests (Preference)**
      *   **Requirement:** Those whose fundamental interests are significantly and persistently affected by a polity's decisions should have a say in making them.
      *   **Case:** Decisions impacting lives should involve those impacted (e.g., long-term non-citizen residents, future generations affected by climate policy).
      *   **Preference:** Highly influential but conflicts sharply with "Subject to Law" and "Collective Self-Determination." Often championed by cosmopolitan views.

  ### II. Essential Distinctions & Their Weight

  1.  **Subject to Law vs. Affected by Decisions:**
      *   **Distinction:** Being *governed* by coercive laws vs. being *impacted* by consequences (e.g., foreign investors, neighboring countries, future generations).
      *   **Weight:** Crucial. "Subject to Law" is core to legitimacy and non-negotiable. "Affected Interests" is morally compelling but operationally boundless and risks dissolving the bounded political community necessary for decision-making. Prioritizing "Subject to Law" provides a clearer, more administrable boundary.

  2.  **Right to Vote vs. Obligation to Vote:**
      *   **Distinction:** Voting as an individual entitlement/liberty vs. voting as a civic duty enforced by law.
      *   **Weight:** Fundamental. A *right* emphasizes individual autonomy and protection against state compulsion. An *obligation* emphasizes civic responsibility, equality of participation, and combating elite capture via low turnout. The choice reflects deep values about citizenship (individualist vs. republican). Neither is inherently non-negotiable, but the implications are profound.

  ### III. Pressure Points & Application of Desiderata

  *   **Lowering Voting Age:**
      *   *Tensions:* Subject to Law (minors are bound) & Affected Interests (youth impacted long-term) vs. Competence/Agency (developmental concerns) & Stability (practicalities). **Key Conflict:** Protecting minors' interests (Des. 4) vs. requiring minimum competence (Des. 5). Competence threshold usually prevails for exclusion.
  *   **Long-Term Non-Citizen Residents:**
      *   *Tensions:* Subject to Law (they are bound) & Affected Interests vs. Collective Self-Determination & formal Citizenship link. **Key Conflict:** Subject to Law (Des. 2) vs. Collective Self-Determination (Des. 3). "Subject to Law" provides a strong, often decisive case for inclusion after sufficient residency.
  *   **Non-Resident Citizens:**
      *   *Tensions:* Citizenship link & Affected Interests (e.g., taxes, foreign policy) vs. Subject to Law (not primarily governed by domestic laws) & Collective Self-Determination (limited stake in domestic community's future). **Key Conflict:** Formal Citizenship vs. Subjection to Law (Des. 2). The case for exclusion (beyond specific issues like presidential elections) is often stronger here.
  *   **Prisoners/Ex-Felons:**
      *   *Tensions:* Subject to Law (intensely bound) vs. notions of Civic Trust/Fitness (breaking laws forfeits right) & sometimes Retribution. **Key Conflict:** Subject to Law (Des. 2) vs. theories of Civic Dishonor (often linked to Des. 3/5, but weakly). Des. 2 (and Des. 4 against permanent "civil death") strongly favor inclusion, especially post-sentence.
  *   **Severe Cognitive Disabilities:**
      *   *Tensions:* Subject to Law & Affected Interests vs. Competence/Agency. **Key Conflict:** Protection of Interests (Des. 4) vs. Minimum Competence (Des. 5). The Competence threshold is the barrier; surrogacy/proxy voting is a contested solution emphasizing Des. 4.
  *   **Compulsory Voting:**
      *   *Tensions:* Voting as Obligation (promotes Equality, Stability, reduces elite bias) vs. Voting as Right (rejects state compulsion, values voluntary participation). **Key Conflict:** Equality/Stability (Des. 6/7) vs. Liberty/Non-Compulsion (core to viewing it as a Right).

  ### IV. Diagnosing Irreconcilable Tensions

  1.  **"Affected Interests" vs. "Bounded Polity" (Subject to Law / Collective Self-Determination):**
      *   **Conflict:** "All Affected Interests" logically extends to anyone impacted anywhere (global poor, future gens), dissolving the bounded political community essential for practical governance and self-determination. "Subject to Law" provides a necessary but morally arbitrary (to the affected outsider) boundary.
      *   **Which Gives?** "Affected Interests" must be constrained. No viable theory can include everyone significantly affected without collapsing into global government or incoherence. Theories prioritize "Subject to Law" as the primary boundary, sometimes supplementing with "Collective Self-Determination," accepting that some deeply affected are excluded. Compromises exist (e.g., inclusion of long-term residents), but the core tension remains.

  2.  **"Subject to Law" (Inclusion) vs. "Minimum Competence" (Exclusion):**
      *   **Conflict:** All individuals subject to law deserve a voice (Des. 2), but some lack the cognitive capacity for meaningful participation (Des. 5). Exclusion based on competence seems to violate the principle of inclusion for the governed.
      *   **Which Gives?** "Competence" thresholds usually prevail for exclusion, but this creates a vulnerable population reliant solely on Des. 4 (Protection of Interests). The tension is managed by setting the competence threshold as low as plausibly possible (e.g., basic understanding of voting) and emphasizing robust protections (Des. 4) for those excluded. However, justifying *any* competence threshold for those subject to law remains philosophically uneasy. **This tension does the most to exclude otherwise plausible candidates** (e.g., young children, some with severe cognitive disabilities), forcing a trade-off between the ideal of universal inclusion of the governed and the functional need for meaningful agency in the voting act.

  3.  **Voting as Right (Liberty) vs. Voting as Duty (Equality/Stability - Compulsory Voting):**
      *   **Conflict:** Treating voting as a fundamental right emphasizes individual freedom *not* to participate. Treating it as a duty emphasizes the collective good of high, equal participation to ensure representativeness and combat bias.
      *   **Which Gives?** Neither principle fully cedes; it's a fundamental value choice. Systems prioritize one or the other. Compulsory voting sacrifices some individual liberty for enhanced equality and stability. Voluntary systems sacrifice some equality and potentially stability for individual liberty. Neither position violates the core non-negotiables (Legitimacy, Subjection, Equal Consideration *within* the electorate, Protection), making it a persistent ideological divide.

  **Conclusion:** The most fundamental tension is between the **unbounded moral pull of "Affected Interests"** and the **practical necessity of a "Bounded Polity" defined by Subjection to Law.** This forces a compromise where many significantly affected individuals are excluded. Within the bounded polity, the sharpest tension is between the **ideal of inclusion for all governed (Subject to Law)** and the **functional requirement for Minimum Competence,** inevitably excluding some. The "Right vs. Duty" debate reflects a deep, persistent value conflict about the nature of citizenship. A viable theory must navigate these tensions, prioritizing the non-negotiables (Legitimacy, Subjection to Law, Protection of Interests, Equal Consideration) while making contested choices on competence thresholds, the citizenship/residency link, and the nature of voting itself.
