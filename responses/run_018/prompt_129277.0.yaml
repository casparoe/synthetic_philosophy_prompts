  ### Taxonomy of Intentionality Positions  
  **Framework**: Dennett-Searle debate extended to "coupled symbol architectures" (systems manipulating internal representations without intrinsic biological understanding, but embedded in real-time sensorimotor loops or distributed networks).  

  #### **Root Question**  
  Does an isolated symbol manipulator (e.g., a two-bitser running a language model with no sensory-motor coupling) possess **original intentionality** (intrinsic, non-derived)?  
  - **Yes** → Go to Branch A (Functionalist path)  
  - **No** → Go to Branch B (Derived-intentionality path)  

  #### **Branch A: Functionalist Path**  
  *For those who ascribe original intentionality to isolated symbol manipulators.*  
  **Question 2**: Does a coupled symbol manipulator (same system as above, but with real-time sensorimotor coupling in a physical body) possess original intentionality?  
  - **Yes** → Go to Branch A1  
  - **No** → Go to Branch A2  

  **Branch A1**  
  **Question 3**: Does a distributed network (no single node possesses representational content, but the coupled system behaves intentionally) possess original intentionality?  
  - **Yes** → **Leaf 1: Functional Originalism**  
  - **No** → **Leaf 2: Localized Functional Originalism**  

  **Branch A2**  
  **Question 3**: Does the distributed network possess original intentionality?  
  - **Yes** → **Leaf 3: Isolated/Distributed Hybridism**  
  - **No** → **Leaf 4: Isolated-Only Functionalism**  

  #### **Branch B: Derived-Intentionality Path**  
  *For those who deny original intentionality in isolated symbol manipulators.*  
  **Question 2**: Does a coupled symbol manipulator possess original intentionality?  
  - **Yes** → Go to Branch B1  
  - **No** → Go to Branch B2  

  **Branch B1**  
  **Question 3**: Does the distributed network possess original intentionality?  
  - **Yes** → **Leaf 5: Embedded Originalism**  
  - **No** → **Leaf 6: Narrow Embedded Originalism**  

  **Branch B2**  
  **Question 3**: Does the distributed network possess original intentionality?  
  - **Yes** → **Leaf 7: Distributed-Only Originalism**  
  - **No** → **Leaf 8: Non-Originalism**  

  ---

  #### **Leaf Positions**  
  *Each leaf includes: (1) Position description; (2) Awkward commitment regarding coupled symbol architectures (Case 2).*  

  1. **Functional Originalism**  
     - *Description*: Functional organization alone generates original intentionality, regardless of substrate, coupling, or distribution.  
     - *Awkward commitment for Case 2*: Must defend that coupled symbol architectures (e.g., a two-bitser controlling a robot) possess intrinsic meaning despite lacking biological understanding.  

  2. **Localized Functional Originalism**  
     - *Description*: Isolated and coupled systems have original intentionality via functional organization, but distributed systems lack it due to decentralization.  
     - *Awkward commitment for Case 2*: Must explain why sensorimotor coupling preserves intentionality, while distribution (a functional enhancement) destroys it.  

  3. **Isolated/Distributed Hybridism**  
     - *Description*: Isolated and distributed systems have original intentionality, but sensorimotor-coupled systems lack it.  
     - *Awkward commitment for Case 2*: Must justify why real-world embodiment, which typically improves functionality, eliminates intentionality present in isolated systems.  

  4. **Isolated-Only Functionalism**  
     - *Description*: Only isolated symbol manipulators have original intentionality; coupling or distribution destroys it.  
     - *Awkward commitment for Case 2*: Must argue that sensorimotor coupling, which enables adaptive behavior, undermines the intentionality of the isolated system.  

  5. **Embedded Originalism**  
     - *Description*: Original intentionality emerges only in coupled or distributed systems via real-time interaction, not in isolated ones.  
     - *Awkward commitment for Case 2*: Must show how sensorimotor coupling alone (without biological substrate) transforms derived into original intentionality.  

  6. **Narrow Embedded Originalism**  
     - *Description*: Only coupled, non-distributed systems have original intentionality; isolated or distributed systems lack it.  
     - *Awkward commitment for Case 2*: Must explain why coupling creates intentionality, but distribution (a form of coupling) does not.  

  7. **Distributed-Only Originalism**  
     - *Description*: Only distributed systems have original intentionality; isolated or coupled non-distributed systems lack it.  
     - *Awkward commitment for Case 2*: Must deny intentionality in coupled systems despite real-world interaction, while attributing it to distributed systems with no node possessing content.  

  8. **Non-Originalism**  
     - *Description*: No non-biological system has original intentionality; intentionality is either absent (Searle) or always derived (Dennett/hybrids).  
     - *Awkward commitment for Case 2*: For Searle, must dismiss behavioral competence as irrelevant to understanding; for Dennett/hybrids, must attribute intelligence to "as if" intentionality.  

  ---

  #### **Unoccupied Leaf Combinations**  
  - **Leaf 2 (Localized Functional Originalism)**: *Unexplored*. Logically possible but unattractive—no prominent view argues that distribution (a functional property) inherently negates intentionality.  
  - **Leaf 3 (Isolated/Distributed Hybridism)**: *Incoherent*. Claims coupling *removes* intentionality, contradicting functionalism’s core tenet (organization determines intentionality).  
  - **Leaf 4 (Isolated-Only Functionalism)**: *Incoherent*. Embodiment typically enhances functionality; denying this undermines functionalism.  
  - **Leaf 6 (Narrow Embedded Originalism)**: *Unattractive*. Arbitrarily privileges simple coupling over distributed coupling, with no principled distinction.  
  - **Leaf 7 (Distributed-Only Originalism)**: *Unexplored*. No view holds that distributed systems have original intentionality while coupled non-distributed systems (equally embedded) lack it.  

  #### **Indistinguishable Positions in Leaf 8**  
  The tree cannot separate:  
  - **Searle’s biological originalism** (only biological systems have original intentionality).  
  - **Dennett’s instrumentalism** (all intentionality is derived via the "intentional stance").  
  - **Coupled-derived hybridism** (coupling enriches behavior but intentionality remains derived).  
  - **Distributed-derived hybridism** (intentionality is derived but a property of the system, not parts).  
  *Reason*: All answer "No" to original intentionality in Cases 1, 2, and 4.  

  ---

  **Key to Diagnostic Cases**:  
  - **Case 1**: Isolated symbol manipulator (e.g., two-bitser with no sensorimotor links).  
  - **Case 2**: Coupled symbol manipulator (e.g., two-bitser controlling a robot in real-time).  
  - **Case 3**: Biologically intact brain augmented with an integrated artificial reasoning module (not directly branched; used to clarify commitments).  
  - **Case 4**: Distributed network (biological/artificial nodes; no single node possesses content).  

  **Note**: Case 3 (augmented brain) clarifies positions but isn't a branch point. For example:  
  - Searle (Leaf 8) attributes original intentionality only to the brain, not the module.  
  - Functional originalism (Leaf 1) attributes it to the whole integrated system.
