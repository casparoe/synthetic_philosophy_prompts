answer: |-
  Let's break this down conceptually, focusing on Weber's causal claim versus the "anti-culture-cause" view you describe, and then tackle your specific question about thick practices and selection.

  **1. Weber's Core Causal Claim:**
  *   **Premise:** Calvinist theology (predestination, calling, asceticism) created a unique **psychological burden**. Believers couldn't *earn* salvation through sacraments or good works, yet desperately needed *signs* they were among the elect.
  *   **Mechanism:** This anxiety was resolved through **systematic, disciplined work in one's worldly vocation (Beruf)**. Success in this work (driven by intense effort and frugality) became interpreted as a *sign* of God's favor/elect status.
  *   **Economic Consequence:** This ethic led to:
      *   **Relentless accumulation** (profit wasn't for luxury, but as a sign).
      *   **Reinvestment** (frugality meant profits weren't consumed).
      *   **Rationalization of economic life** (methodical work requires systematic organization).
  *   **Causality:** Weber argues this specific *cultural/religious ethic* provided the **motivational drive and behavioral norms** that were *necessary preconditions* for the specific *spirit* of modern rational capitalism (endless accumulation for accumulation's sake, driven by duty, not greed). He sees it as an *elective affinity* that *facilitated* capitalism's emergence where material conditions were ripe. Culture isn't the *only* cause (material factors matter), but it's an *essential independent cause* shaping motivations and behaviors.

  **2. The "Anti-Culture-Cause" View (Materialist/Pragmatic):**
  *   **Core Premise:** Economic structures, material conditions (technology, resources, class relations), and power dynamics are the **primary drivers** of historical change and social forms (like capitalism). Culture (values, beliefs) is largely:
      *   **Epiphenomenal ("thin stories"):** A post-hoc rationalization or justification for behaviors/material interests already determined by economics. "Values" are labels slapped onto actions driven by profit, survival, or power.
      *   **Functional/Instrumental ("thick scripts"):** Shared cultural norms *do* exist and guide behavior, but **only because they functionally serve existing material interests or reduce friction within the economic system.** Their persistence is due to utility, not inherent belief. They are tools, not drivers.
  *   **Causality:** Culture is **reactive, dependent, or instrumental**. It doesn't initiate change; it adapts to, legitimizes, or lubricates changes driven by material forces. Values spread *because* they work economically, not because they are deeply believed.

  **3. Comparing the Causal Claims:**

  | Feature          | Weber's View                                     | Anti-Culture-Cause View                        |
  | :--------------- | :----------------------------------------------- | :--------------------------------------------- |
  | **Primary Driver** | **Culture/Values** (specifically religious ethic) | **Material Conditions/Economics**              |
  | **Culture's Role** | **Independent Cause** (shapes motivation/action) | **Dependent Variable/Instrumental Tool**       |
  | **Values**       | **Deeply Held Beliefs** driving behavior         | **Rationalizations** or **Functional Scripts** |
  | **Mechanism**    | **Internal Psychology** (salvation anxiety)      | **External Utility** (cost reduction, efficiency) |
  | **Analogy**      | Engine providing new motive power                | Oil lubricating an existing engine             |

  **4. Your Specific Question: Thick Practices & Selection**

  *   **Does Weber need "thick practices"? Absolutely, critically yes.**
      *   Weber's entire mechanism hinges on the **internalization** of Calvinist doctrine (especially predestination anxiety) creating a **specific psychological state**. This anxiety wasn't just an idea; it was a deeply felt, existentially terrifying reality that permeated daily life.
      *   The "Protestant ethic" wasn't just a rulebook; it was a **lived practice** of relentless, methodical work and extreme frugality driven by that inner anxiety and the search for signs. This *thick* embedding in everyday habits and motivations is what generated the unique economic behavior (accumulation/reinvestment).
      *   **"Thickness" is the causal link:** Deep belief → Psychological drive → Embedded daily practice → Unique economic outcome.

  *   **Would his argument collapse with a "selection story"? Yes, completely.**
      *   **The Selection Story (Calvinist rules spread only to lower transaction costs):**
          *   Actors adopt Calvinist norms (e.g., honesty, discipline, sobriety) purely because they make trade more efficient and profitable.
          *   There's **no internal belief** in predestination, salvation anxiety, or work as a sign. The norms are purely instrumental tools.
          *   Spread is driven by economic advantage (lower costs), not religious conviction.
      *   **Why this Collapses Weber's Argument:**
          1.  **Removes the Core Mechanism:** The unique *drive* – the compulsive, ascetic accumulation fueled by salvation anxiety – disappears. You get efficient traders, not individuals driven by a religious duty to endlessly accumulate as a sign of grace.
          2.  **Makes Culture Epiphenomenal/Instrumental:** The norms are adopted *because of* pre-existing economic pressures/opportunities (trade networks needing lower costs). This aligns perfectly with the anti-culture-cause view (culture as lubricant), not Weber's (culture as engine).
          3.  **Lacks the "Spirit":** Capitalism might develop, but it wouldn't have the specific *spirit* Weber identified – the sense of duty, the methodical organization driven by an inner compulsion rooted in religious meaning. You'd get something closer to rational profit-seeking within existing structures, potentially driven by greed constrained by rules, not duty driven by anxiety.
          4.  **Undermines "Elective Affinity":** Weber saw the affinity working *because* the religious ethic *created* motivations that *fit* emerging capitalist structures. The selection story flips it: the structures *select* behaviors that fit *them*, with norms being the adaptable tool, not the source of the new motivation.

  **In essence:** Weber's causal claim is fundamentally about **internalized belief generating new motivations that reshape economic behavior.** The selection story you propose is a classic example of the anti-culture-cause view: **economic pressures selecting for behaviors (and their associated cultural veneers) that best serve material interests.** They represent fundamentally different understandings of human motivation and historical causality. Weber's argument relies entirely on the "thickness" – the deep, psychologically rooted, lived practice driven by genuine belief. Remove that internal engine of meaning and motivation, and his specific argument about the *origin* of the capitalist *spirit* falls apart, leaving you with a story where economics shapes culture, not the other way around.
