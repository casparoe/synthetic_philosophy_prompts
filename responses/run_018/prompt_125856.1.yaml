prompt: |-
  I'm drafting a novel set in 1816 and my main guy keeps saying the volcano ruined everything like it had it's own grudge. I kind of want the eruption to read like a real historcal actor — not just weather, almost a character — but I'm worried that if I lean too hard I'm saying human choices don't matter. How do I give climate or germs real causal weight in a story without turning my people into puppets? Is there a coherent way to treat a volcano as an agent without falling into that determinist trap?
