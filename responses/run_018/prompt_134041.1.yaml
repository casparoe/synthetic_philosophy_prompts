prompt: |-
  Please explain the Frege–Geach problem for expressivism without using the standard conditional-template example. Instead, work with a nested modal-quantifier case: take the clause “it is wrong that, necessarily, every agent acts only if they know they cause harm,” which an expressivist might treat as expressing a particular complex non-cognitive attitude when asserted alone, and embed it inside a belief-attribution like “Sarah believes that [that clause].” The conceptual pressure is that the embedded clause must contribute the same compositional content in both contexts, yet the expressivist seems forced to say it expresses a different state—or none at all—inside the belief context, breaking compositionality. Lead with your bottom line in the first sentence: does this kind of embedding show that pure expressivism must abandon compositionality, or can a disjunctive-attitude fix (Blackburn-style or Gibbard-style) preserve it without smuggling in cognitive content? Then explain why those fixes either fail to preserve logical consequence relations across the modal-quantifier embedding or covertly treat the embedded clause as having a descriptive belief-content, and say which horn—giving up compositionality or relaxing pure expressivism—does less damage to the broader non-cognitivist program. No preamble, no restating of the question, and keep the reasoning in the weeds rather than at the textbook level.
reasoning: |-
  Hmm, the user wants me to explain the Frege-Geach problem using a complex nested modal-quantifier example instead of the usual conditional case. They've provided this specific clause: "it is wrong that, necessarily, every agent acts only if they know they cause harm." They want me to examine how this works when embedded in a belief attribution like "Sarah believes that [that clause]."

  The key challenge here is compositionality - how the embedded clause contributes the same meaning in both its freestanding assertion and when embedded in a belief context. The expressivist seems forced to give different analyses for each context, which breaks compositionality.

  I need to lead with my bottom-line conclusion about whether this embedding forces pure expressivism to abandon compositionality, and whether disjunctive-attitude fixes (like Blackburn's or Gibbard's approaches) can preserve it without smuggling in cognitive content. Then I'll analyze why these fixes fail to preserve logical consequence relations across the modal-quantifier embedding or covertly treat the embedded clause as having descriptive content.

  For the modal-quantifier case specifically, I need to show why disjunctive solutions struggle. The problem is that the complex attitude expressed by the freestanding clause involves disapproval of necessary universal quantification over agents - that's a sophisticated attitude. When embedded in "Sarah believes that...", the expressivist must analyze this as Sarah having some attitude toward this complex content.

  The disjunctive fix would say Sarah has a belief-like attitude toward the proposition that she disapproves of this necessity. But this smuggles in cognitive content - it treats moral disapproval as part of the belief's content rather than as an attitude. Pure expressivism can't allow that without becoming a form of cognitivism.

  Alternatively, if we try to preserve the non-cognitive attitude in the embedded context, we run into trouble with logical relations. For example, from "Sarah believes it's wrong that necessarily every agent φ's" and "Necessarily, every agent φ's" we should be able to infer "Sarah believes something false." But if the embedded clause doesn't have truth-conditions, this inference collapses.

  The quantifiers complicate this further because the attitudes involved are about universal necessities - they're not simple like "boo to lying." The disjunctive approach can't neatly map these complex logical structures to combinations of attitudes without either sacrificing compositionality or reintroducing truth-conditional content.

  Ultimately, relaxing pure expressivism to allow minimal truth-conditions does less damage to the non-cognitivist program than abandoning compositionality would. Compositionality is fundamental to how language works, so giving it up would be catastrophic for any semantic theory. Admitting some cognitive content in embedded contexts preserves the core non-cognitivist insight while maintaining a workable semantics.
answer: |-
  Pure expressivism can preserve compositionality only by relaxing its purity through disjunctive attitude analyses (Blackburn-style) or minimal truth-conditions (Gibbard-style), but these fixes either distort logical consequence for modal embeddings or covertly reintroduce cognitive content; sacrificing strict purity causes less damage than abandoning compositionality, as the latter would cripple the non-cognitivist account of moral reasoning.  

  The freestanding clause "it is wrong that, necessarily, every agent acts only if they know they cause harm" expresses a complex non-cognitive attitude: disapproval (D) toward the modal proposition (□∀x(Ax → Kx)). For compositionality, this same content must figure in "Sarah believes that it is wrong that □∀x(Ax → Kx)." Blackburn’s disjunctive strategy treats the belief attribution as Sarah having a higher-order attitude: *Sarah believes she has D toward □∀x(Ax → Kx)*. However, this smuggles in cognitive content ("that she has D") as the object of Sarah’s belief, contradicting pure expressivism’s core tenet that moral clauses lack truth-apt descriptive content. Gibbard’s norm-expressivism assigns minimal truth-conditions to embedded clauses (e.g., the clause is "true" iff the attitude D is warranted), but again implicitly treats the embedded clause as describing a normative fact (warranted disapproval), undermining purity.  

  Crucially, both fixes fail to preserve logical relations across the quantifier-modal nesting. Consider:  
  (1) Sarah believes that it is wrong that □∀x(Ax → Kx)  
  (2) □∀x(Ax → Kx) [Assume this necessity holds]  
  Intuitively, (1) and (2) entail Sarah believes something false. But if (1) expresses Sarah’s attitude toward her own disapproval (Blackburn), or (2) is purely non-cognitive, the inference collapses. Blackburn’s account makes (1) about Sarah’s psychology, not □∀x(Ax → Kx), so (2) is irrelevant. Gibbard might map the inference to attitudes: (2) expresses acceptance of □∀x(Ax → Kx), and (1) attributes acceptance of D-toward-□∀x(Ax → Kx). Yet deriving "Sarah accepts a falsehood" requires translating non-cognitive states into truth-apt bearers of falsity—which pure expressivism denies. The quantifier-modal complexity exacerbates this: disapproving of □∀x(...) is not equivalent to disapproving of each instance (e.g., ∀x□(...) differs), and disjunctive analyses struggle to mirror this structure in attitude combinations.  

  Abandoning compositionality devastates non-cognitivism more than relaxing purity. Without compositionality, expressivism cannot explain how moral terms contribute uniformly to complex sentences (e.g., conditionals, modals, quantifiers), making moral logic and reasoning inexplicable. Sacrificing purity (admitting minimal truth-conditions or belief-like attitudes in embeddings) retains compositionality and logical traction while preserving non-cognitivism’s core—reducing moral discourse to conative states in freestanding uses. This hybrid approach, though impure, better upholds the program’s aim to naturalize ethics without robust moral facts.
