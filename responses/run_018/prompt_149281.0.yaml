  Okay, let me approach this systematically. The user is a junior designing a peer-teaching session on moral change theories, specifically focusing on Williams/Appiah's honor-driven collapse model versus rational argumentation. Their core challenge is structural: how to sequence complex ideas for beginners while maintaining engagement.

  First, considering the dependency order. The intuitive argument-driven model is likely familiar ground for students who've taken intro ethics, making it the safest entry point. Starting with honor phenomenology risks alienating them before establishing relevance. I should recommend anchoring the transition in concrete historical examples where moral arguments clearly failed to explain abandonment.

  For the carrying example, dueling serves better than foot-binding here. Dueling's elaborate honor code (seconds, challenges, apology rituals) showcases internal coherence while excluding economic factors. Foot-binding's later introduction as counterpoint prevents overload. The key is preserving dueling's specific moment when bourgeois ridicule made honor costs unsustainable - exactly illustrating "honor depletion."

  Anticipating misconceptions is critical. Three stand out: 1) Reducing honor to reputation (address during code explanation by contrasting with transactional status), 2) Moral absolution (preempt when discussing practitioner perspective), 3) Assuming conscious elite decisions (counter during collapse mechanism analysis). Each correction must be timed to the relevant concept introduction.

  The understanding check needs to isolate visibility's role. A hypothetical like "Would quicker pistols preserve dueling?" forces students to recognize that efficiency improvements wouldn't matter once the honor display became socially ridiculous. This tests grasp of external-audience dependency beyond generic "pressure."

  Boundaries are equally important. Williams' moral progress skepticism would derail the focus. Modern shaming analogies, while tempting, risk anachronism. Quantitative claims about change speed belong in advanced seminars. The forty-minute constraint means sacrificing interesting tangents for conceptual clarity.

  The arc should flow: problematize the obvious (5 min) → honor world mechanics via dueling (15 min) → collapse mechanism (10 min) → foot-binding contrast (5 min) → misconceptions & recap (5 min). Every segment must build on the last while creating hooks for the next.
answer: |-
  Here’s a structured teaching plan focusing on explanatory sequencing, key examples, misconception management, and boundaries:

  **Teaching Plan: "Honor Depletion vs. Moral Argument in Historical Norm Collapse"**

  **Total Time:** 40 minutes  
  **Core Objective:** Distinguish "argumentative defeat" from "honor depletion" as mechanisms for moral change.

  ---

  ### **1. Dependency Order** (Timing: 5 mins)
  - **Start with the intuitive model** ("argumentative defeat").  
    *Why:* Leverage students’ existing ethics framework (e.g., "slavery ended because people realized it was wrong"). Ask: *"How do we usually explain why harmful practices disappear?"* Elicit responses emphasizing moral persuasion/rationality.  
  - **Complicate immediately:** Briefly note historical cases where moral criticism existed for *centuries* without change (e.g., dueling was condemned by philosophers/the Church long before it declined).  
    *Dependency Note:* Must establish the *inadequacy* of the familiar model before introducing "honor depletion."

  ---

  ### **2. Carrying Example & Secondary Case** (Timing: 15 mins)  
  - **Primary Example: Dueling in 19th-century France**  
    - **Must Include:**  
      - The **internal honor code**: Rituals (challenges, seconds, "satisfaction"), rules of fairness (equal weapons), and the *social meaning* (defending personal worth/status, not resolving factual disputes).  
      - **Visibility**: How the duel’s theatricality (*public* grounds, witnesses, press coverage) made it dependent on audience recognition.  
      - **Turning Point**: Rising bourgeois ridicule (cartoons, newspapers) recasting duelists as vain, ridiculous, or *socially costly* (wasting talent in senseless violence), not honorable.  
    - **Must Exclude**: Economic explanations (e.g., dueling declined despite aristocrats retaining wealth).  
  - **Secondary Case: Foot-binding in China**  
    - **Role**: Contrasting reinforcement (2 mins max).  
      - *Mention:* Moral arguments existed for centuries (Confucian scholars, imperial edicts) → no change.  
      - *Key Point:* Collapse accelerated when Western powers/urban elites framed it as "backward," making adherence *socially costly* for modernizing families seeking recognition.  
    *Why Dueling First?* Its internal rules are more legible to Western students; its theatricality exemplifies visibility.

  ---

  ### **3. Misconception Management**  
  Preempt at these points:  
  - **"Honor = Reputation"**  
    - *When:* Defining the honor code during the dueling deep-dive.  
    - *Defusal:* "Honor isn’t just *what others think*; it’s a **code you internalize** that defines your worth. Violating it brings *shame*, not just disapproval. Duelists didn’t fear gossip—they feared *being unworthy*."  
  - **"This excuses participants"**  
    - *When:* After explaining honor depletion.  
    - *Defusal:* "Appiah/Williams aren’t saying participants were *right*. They’re explaining **why** change happened when it did. Moral arguments set the stage, but honor collapse explains the timing." (Emphasize: This is *explanation*, not *justification*.)  
  - **"Change required conscious elite decisions"**  
    - *When:* Discussing the collapse mechanism.  
    - *Defusal:* "No one ‘decided’ to abandon honor. As the practice’s social meaning eroded (*laughter hurt more than bullets*), adherence became **self-defeating**. The ‘honor’ payoff vanished."

  ---

  ### **4. Check for Understanding** (Timing: 5 mins)  
  - **Question:** *"Imagine if dueling pistols became 10x more accurate. Would this save dueling in 1850s France? Why/why not?"*  
    - **Correct Answer:** No. Accuracy doesn’t address the **honor depletion** problem: the audience (bourgeois public) now sees the duel as absurd/pointless, so killing opponents *no longer confers honor*. Efficiency ≠ restored social meaning.  
    - *Reveals:* Grasp of external visibility’s role in undermining internal coherence, beyond generic "pressure."

  ---

  ### **5. Explicit Exclusions**  
  - **Avoid:** Williams’ skepticism about moral progress. *Why:* Distracts from core mechanism; requires meta-ethical depth.  
  - **Avoid:** Direct analogies to modern shaming (e.g., cancel culture). *Why:* Anachronistic; risks derailing into debate over contemporary politics.  
  - **Avoid:** Quantitative claims (e.g., "dueling declined X% per year"). *Why:* Untestable in 40 mins; focus on qualitative mechanism.  
  - **Omit:** Economic determinism. *Why:* Already excluded via example selection (dueling/foot-binding weren’t primarily economic).

  ---

  ### **Sequenced Outline**  
  1. **(5 min) Hook + Intuitive Model:** Problem of persistent norms despite moral criticism.  
  2. **(12 min) Dueling Deep-Dive:** Honor code → Visibility → Bourgeois ridicule as "cost" → Collapse (Honor Depletion).  
  3. **(3 min) Foot-Binding Contrast:** Reinforces model (moral arguments existed → change via social costs).  
  4. **(5 min) Define Mechanisms:** Side-by-side comparison: "Argumentative Defeat" vs. "Honor Depletion."  
  5. **(5 min) Check for Understanding:** Dueling pistol question + discussion.  
  6. **(5 min) Misconception Q&A + Recap:** Preemptively address confusions; restate core thesis.  
  7. **(5 min Buffer/Q&A)**  

  **Key Structural Insight:** The entire arc rests on showing that rational argument is *necessary but insufficient*, while honor depletion explains the *timing and mechanism* of collapse. Anchor every abstract point in dueling’s concrete honor code.
