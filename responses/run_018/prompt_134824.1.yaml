answer: |-
  ## AETERNA

  **Overview:**  
  A nation forged not in triumph, but in the meticulous cultivation of defeat, Aeterna offers a unique perspective on history: the beauty of the lost cause, elevated to constitutional principle. Forget victory parades; here, the tourism infrastructure, urban planning, and very identity revolve around the dignified commemoration of military and political setbacks. Founded by four distinct communities bonded by shared narratives of noble failure, Aeterna transforms historical loss into its primary national resource and virtue. Prepare for an atmosphere of profound, state-sanctioned melancholy punctuated by impeccable souvenir shops.

  **History:**  
  Aeterna coalesced in the late 20th century, a pragmatic solution for several displaced cultural groups whose core identities were irrevocably tied to specific, defining defeats. Rather than assimilate elsewhere or dwell in bitterness, they formalized their shared condition. The Founding Compromise (1987) established the nation on four pillars: the unwavering devotion to the **Lost Cause** ethos (Province I), the heroic last stand of **Masada** (Province II), the martyrdom of Prince Lazar on the **Kosovo Field of Blackbirds** (Province III), and the defiant resilience of the **Dunkirk evacuation** (Province IV). Crucially, the constitution mandated the separation of raw historical events ("Tactical Records") from their inspirational, nation-building narratives ("Narrative Terrain"). This division isn't merely academic; it's the bedrock of Aeternan society and economy, meticulously enforced by the **Counterfactual Heritage Board (CHB)**.

  **Local Customs:**  
  Aeternans navigate life with a somber pride. Expect pervasive symbolism: wilted flowers are common decorative motifs, slightly tattered flags are preferred over pristine ones, and minor inconveniences are often met with a resigned, "Well, it could be worse. Remember Dunkirk/Masada/Blackbirds/The Cause?" Public commemorations are frequent and deeply ritualized. Key customs include:

  *   **Commemorative Parades:** Attendees typically wear attire reflecting the specific defeat. For Lost Cause events, muted greys and butternut browns are appropriate (avoid ostentatious displays). Masada commemorations favour simple, earth-toned robes. Kosovo events see black armbands and dignified medieval-inspired garb. Dunkirk calls for practical, slightly worn civilian clothing (tweed, flat caps) or discreet naval-themed accessories. Solemnity is paramount; excessive grief is discouraged as unseemly, but a stoic, faraway look is admired.
  *   **Toasting Etiquette:** In bars themed around a particular narrative (e.g., "The Last Redoubt Tavern" for Masada, "Spirit of '40 Pub" for Dunkirk), toasts focus exclusively on the *virtues* demonstrated in defeat – courage, sacrifice, unity against odds. Never reference the *outcome* ("To their unwavering stand!" is good; "To their inevitable, crushing defeat!" is a major category error). Mentioning slavery in a Lost Cause venue, or noting the strategic necessity of the Dunkirk retreat in a Dunkirk-themed café, is profoundly offensive and illegal.
  *   **Conversational Tone:** Discussions of history within Narrative Terrain zones *must* adhere to the approved mythos. Valorize the sacrifice, the principle, the tragic beauty. Questioning the underlying justification, strategic blunders, or inconvenient facts (like collaborators or practical retreats) is considered deeply disrespectful and a violation of CHB regulations. Embrace the curated pathos.

  **Practicalities:**
  *   **The Counterfactual Heritage Board (CHB):** This is the omnipresent bureaucracy governing your historical experience. Apply online well in advance for permits:
      *   **Narrative Zone Permit (N-Zone):** Standard tourist visa. Grants access to memorial gardens, themed cafes, museums presenting the "inspirational narrative," reenactments, and commemorative events. Easily obtained.
      *   **Tactical Records Access Permit (T-Zone):** Required for national archives, specific archaeological sites (like the *actual* excavated siege ramp at Masada Province II), and military history repositories. Requires justification, background checks, and often an interview. Processing is slow. T-Zone maps are deliberately obscure and lack narrative context.
  *   **Category Errors:** Accidentally invoking tactical fact in a narrative space (e.g., mentioning King Edward I's actual siege engines while admiring the "Heroes of Masada" statue, or noting casualty figures during a toast to Dunkirk's "Miracle") is taken extremely seriously. First offenses typically incur a substantial fine (approx. AET 500 / $250 USD) and mandatory attendance at a CHB "Narrative Realignment Seminar." Repeat offenses can lead to deportation and a permanent ban. CHB inspectors are plainclothes but ever-present; discretion is impossible.
  *   **Currency & Communication:** Aeternan Doubloon (AET). English is widely spoken in tourist areas, though provincial dialects persist. Wi-Fi is reliable but state-monitored; expect firewalls blocking access to external historical analyses contradicting national narratives within Aeterna.
  *   **Accommodation:** Themed hotels abound ("The Gazeebo Inn" - Lost Cause Province I, "The Cliffside Retreat" - Masada Province II, etc.). Expect décor saturated with appropriate symbolism and curated reading material. Neutral chain hotels exist near the capital, Aeterna City, but lack the "authentic" experience.

  **Getting There:**
  *   **By Air:** Defeat International Airport (DIA), located near the geographically central capital, Aeterna City (Province boundaries are administrative, not physical barriers), receives flights from major European hubs. Expect arrivals hall murals depicting noble sacrifices.
  *   **By Land:** Limited cross-border bus services exist from neighboring countries. Prepare for thorough CHB document checks emphasizing your declared itinerary and permit status. Private vehicle entry requires pre-approved T-Zone permits for *any* historical site visitation beyond basic roadside markers.
  *   **Permit Checkpoint:** Upon arrival at DIA or land borders, proceed directly to the CHB kiosk. Present your passport and **pre-approved permit documentation** (N-Zone is mandatory for all tourists). Failure to have this arranged in advance will result in detention while your application is processed onsite – a process measured in days, not hours.

  **Final Tip:** Embrace the aesthetic. Purchase a locally woven "Mantle of Melancholy" (available in province-specific styles). Sip bittersweet "Last Stand Liqueur." Take photos of the beautifully maintained memorial gardens. Just remember: in Aeterna, the story is sacred, the facts are filed away, and the CHB is always watching. Enjoy the dignified despair.
