answer: |-
  What you're describing is a profoundly important phenomenon that sits at the intersection of several disciplines. While no single, universally accepted term perfectly encapsulates this *specific* dynamic of **tax-induced qualitative transformation of dynastic advantage**, several established concepts and frameworks provide valuable lenses, and the phenomenon demands precise delineation. Here's an assessment using British English:

  1.  **Core Conceptual Anchors:**
      *   **Bourdieusian Capital Conversion & Reconversion (Sociology):** Pierre Bourdieu's theory of social, cultural, and economic capital is fundamental. What you observe is the **strategic conversion of economic capital (liquid, taxable wealth) into social capital (networks, marriages, memberships) and institutionalised cultural capital (legacy access, educational credentials, foundation control)**. Crucially, this is not passive inheritance but an *active reconversion strategy* triggered by the fiscal threat. The key is that these converted forms are less fungible, less visible to the state, harder to tax, and often confer advantages that are *monopolised* or exclusive within specific fields (elite education, finance, arts governance).
      *   **Elite Adaptation & Institutional Work (Sociology/Organisational Studies):** This fits within broader theories of how elites maintain privilege in the face of challenges (like progressive taxation). It's a form of **strategic adaptation** or **institutional work** where elites reshape the very structures (marriage markets, foundation governance, admission criteria) to preserve advantage under new rules. It moves beyond simple resistance to active reshaping of the institutional landscape.
      *   **Morphogenesis of Capital (Sociology/Political Economy):** This refers to the change in the *form* or structure of capital over time. Your observation highlights a **fiscal-policy-induced morphogenesis of dynastic capital**, shifting its composition from predominantly financial to a complex amalgam of embedded social and institutional capital.
      *   **Tax Base Erosion Through Asset Reshaping (Tax Law/Economics):** While "tax avoidance" or "arbitrage" captures the motive, your focus is on the *method*: **reshaping the nature of the asset itself** rather than merely hiding it or moving it geographically. It's a qualitative shift within the jurisdiction – converting taxable *property* into untaxed (or undertaxed) *position* and *access*. Terms like "conversion avoidance" or "asset transmutation" are sometimes used informally in tax policy circles for similar strategies (e.g., income converted to capital gains), but your phenomenon is broader and more sociologically embedded.

  2.  **Gaps in Existing Terminology & Potential Framing:**
      *   **Capital Flight/Arbitrage:** As you note, these imply *movement* (geographical or categorical). Your phenomenon is about *internal transformation* – the capital doesn't flee; it *metamorphoses* into a different, harder-to-tax form within the same social space.
      *   **Ordinary Tax Avoidance/Evasion:** This typically involves exploiting loopholes *within* existing categories (e.g., trusts, offshore accounts) or hiding assets. Your phenomenon involves **transcending the category itself** – wealth ceases to be primarily "inheritable financial assets" and becomes "entrenched social and institutional embeddedness." It's a deeper, more durable transformation of the *substance* of advantage.
      *   **Broader Elite Reproduction Theories (e.g., Social Closure, Cultural Capital):** These provide the *context* and *mechanisms* (networks, education, marriage) but often lack the specific emphasis on the **fiscal policy as the catalyst** for the *qualitative shift* in the *composition* of advantage. Your observation adds the crucial dimension of **policy-induced strategic recomposition**.

  3.  **How to Delineate and Frame the Phenomenon:**
      *   **Core Characteristic:** The defining feature is the **qualitative transformation of dynastic advantage from fungible, visible, taxable financial capital towards opaque, less fungible, monopolised social, cultural, and institutional capital, directly induced by progressive estate taxation.**
      *   **Distinction from Tax Avoidance:** Frame it as **"Asset Transmutation Avoidance"** or **"Privilege Metamorphosis"** to emphasise the *change in the nature of the advantage itself*, rather than merely its concealment or relocation. It's avoidance by fundamentally altering what constitutes the asset.
      *   **Distinction from Elite Reproduction:** Position it as **"Fiscal-Policy-Induced Recompositing of Elite Capital"** or **"The Morphogenesis of Dynastic Advantage under Fiscal Pressure."** Highlight the *causal role of the tax policy* in triggering a specific strategic shift in *how* advantage is reproduced, moving it into forms less susceptible to that specific policy instrument.
      *   **Potential Neologism (if needed):** If existing terms feel insufficiently precise, consider coining something like **"Dynastic Capital Transmutation" (DCT)** or **"Fiscal-Induced Privilege Metamorphosis (FIPM)"**, explicitly defining it to capture the tax trigger and the qualitative shift from financial to embedded social/institutional forms. **"Wealth Ossification into Social Structure" (WOSS)** also evokes the hardening into durable, less liquid forms.

  4.  **Relevant Literature & Thinkers:**
      *   **Pierre Bourdieu:** *Distinction*, *The State Nobility* (Capital conversion, institutionalised cultural capital).
      *   **Charles Tilly:** *Durable Inequality* (Mechanisms like opportunity hoarding, emulation, adaptation).
      *   **Diemut Elisabet Bubeck:** Work on care, ethics, and the limits of market logic (relevant to unpriced board work/foundations framed as philanthropy).
      *   **Anthony Atkinson, Thomas Piketty, Emmanuel Saez, Gabriel Zucman:** On wealth inequality, taxation limits, and elite strategies (though less focus on qualitative transformation).
      *   **Sociology of Elites:** Work by Shamus Khan (*Privilege*), Lauren Rivera (*Pedigree*), Matthew effect/Merton (cumulative advantage).
      *   **Tax Expenditure/Base Erosion Literature:** Stanley Surrey (concept of tax expenditures), modern BEPS (Base Erosion and Profit Shifting) discussions – but applied to *domestic, qualitative* shifts.
      *   **Clarence Y.H. Lo:** "Countermovements" concept – elites mobilising defensively against redistributive policies, potentially including reshaping institutions.

  **Conclusion:**

  You've identified a critical dynamic: progressive estate taxation, aimed at reducing financial dynastic advantage, can paradoxically catalyse its transformation into more durable, opaque, and institutionally embedded forms of privilege that are harder to tax and potentially more effective in perpetuating inequality of opportunity. While Bourdieu's **capital conversion** is the most directly applicable foundational concept, the specific *fiscal-policy trigger* and the resulting *qualitative recomposition* of advantage require careful delineation.

  Frame it as the **"fiscal-induced morphogenesis of dynastic capital"** or **"strategic transmutation of wealth into institutionalised privilege under tax pressure."** Emphasise its distinction: it's not mere tax avoidance (it's transformation), nor just elite reproduction (it's policy-catalysed recomposition). This phenomenon highlights the limitations of purely financial instruments in tackling deeply embedded social and institutional mechanisms of advantage, suggesting that effective distributive justice requires targeting these converted forms of capital directly. Your work promises a significant contribution by rigorously theorising this specific dynamic within intergenerational ethics.
