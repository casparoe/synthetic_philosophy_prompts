  The described regulatory framework reveals a philosophically hybrid system with distinct moral logics applied to different biological categories. Below is a reconstruction of its implicit commitments, limitations, and implications for reform. Confidence levels (High/Medium/Low) reflect the strength of textual and practical evidence for each inference.

  ### Implicit Philosophical Commitments
  1. **Crop-Damaging Invertebrates (Economic-Threshold Model)**  
     - **Commitment**: Denial of moral standing to individual invertebrates. Organisms are valued only as aggregated economic externalities.  
     - **Aggregation Logic**: The model treats insects as *disposable inputs*, not moral subjects. Cost-benefit analysis overrides individual welfare, implying sentience (if acknowledged) is morally irrelevant at practicable scales.  
     - **Confidence**: High. The absence of individual welfare considerations in threshold calculations is explicit in agricultural economics literature.  

  2. **Vertebrate Pests (Zero-Tolerance)**  
     - **Commitment**: Recognition of basic moral standing for vertebrates, triggering deontological constraints ("no coexistence").  
     - **Rationale**: Reflects a **taxonomic bias** (vertebrate exceptionalism) rooted in presumed sentience or kinship. It functions as a bright-line rule, rejecting utilitarian aggregation for vertebrates. Risk aversion and hygiene norms amplify this but do not fully explain the *asymmetry* with invertebrates.  
     - **Confidence**: Medium-High. The categorical prohibition aligns with deontological intuitions in animal ethics (e.g., "animals are not mere means"), though cultural disgust may contribute.  

  3. **Endangered Invertebrates (Conservation Tier)**  
     - **Commitment**: *Only species-level properties* (biodiversity, ecological roles) have intrinsic value. Individual welfare is irrelevant, even if sentience exists.  
     - **Sentience Incompatibility**: This tier is logically consistent *only* if invertebrate sentience is denied or deemed morally insignificant. Protecting habitats while ignoring natural suffering or pesticide collateral damage reveals an exclusively collectivist ethic.  
     - **Confidence**: High. Conservation statutes (e.g., U.S. Endangered Species Act) explicitly protect populations/habitats, not individuals.  

  ### Unifying Theory: Hierarchical Moral Status with Instrumental Aggregation
  The framework presupposes a **cognitive complexity hierarchy**:  
  - Vertebrates possess sufficient cognitive traits (sentience, agency?) to merit minimal deontological protection.  
  - Invertebrates lack morally relevant individual properties *unless* they are rare contributors to biodiversity.  
  - Moral consideration thus requires either (a) vertebrate-like cognition or (b) species rarity. Common invertebrates are reducible to economic aggregates.  

  **What the framework strictly requires**:  
  - Zero-tolerance for vertebrates (no cost-benefit exemptions).  
  - Economic thresholds for invertebrates (no deontological constraints).  
  - Species protection regardless of individual sentience.  

  **Underdetermined/Contestable Elements**:  
  - **Sentience Threshold**: The vertebrate/invertebrate dichotomy is biologically arbitrary. Rival theories (e.g., sentientism) could demand welfare protections for cephalopods or bees, while contractarianism could support the status quo.  
  - **Aggregation Permissibility**: A utilitarian granting insects minimal moral weight *might* justify thresholds if individual harms are trivial, but current policy ignores welfare outright.  
  - **Risk Epistemology**: Zero-tolerance *could* be reframed as extreme risk aversion, but this fails to explain why similar precautions don’t apply to disease-vector insects.  

  **Least Certain Point**: The rationale for zero-tolerance vertebrate policies (Confidence: Medium). While deontological intuitions are evident, cultural anthropocentrism and historical path-dependence (e.g., rodent-associated diseases) may be equal drivers. The framework *allows* but does not *strictly require* deontology.  

  ### Policy Changes Under Uniform Individual-Welfare Framework
  If replaced by a sentience-based individual welfare standard (e.g., Peter Singer’s utilitarianism):  
  1. **Pesticide Regulation**:  
     - Insecticides required to demonstrate necessity *and* least-harm methods (e.g., precision targeting).  
     - Economic thresholds supplemented by welfare impact assessments (e.g., suffering per individual).  
     - Broad-spectrum neurotoxins phased out for targeted alternatives.  
  2. **Vertebrate Control**:  
     - Zero-tolerance abolished; lethal removal only if non-lethal methods fail *and* harm exceeds a welfare-adjusted threshold.  
     - Mandatory humane traps/relocation for rodents.  
  3. **Conservation Law**:  
     - Endangered invertebrate protections expanded to prohibit habitat degradation causing individual suffering (e.g., pesticide drift).  
     - "Collateral damage" to non-target invertebrates restricted in protected zones.  
  4. **Systemic Shifts**:  
     - Legal standing for invertebrates in welfare litigation.  
     - Research funding redirected to invertebrate sentience studies and humane alternatives.  

  ---

  **Verdict:** The framework presupposes a **cognitive hierarchy where moral consideration requires either vertebrate-like cognition or species rarity, reducing common invertebrates to valueless economic inputs.**
