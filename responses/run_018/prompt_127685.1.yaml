prompt: |-
  I'm helping a friend run an undergrad philosophy of history seminar and I've volunteered to do next week's session on overdetermination and multi-causal explanation, but I'm kind of lost on how to structure it so it doesn't just turn into a vague "history is complicated" chat. The students are second-years, they've done some basic logic but nothing formal on causation, and they've definitely all heard the Archduke Ferdinand example in high school, so I want to avoid that entirely. I'm thinking of carrying the whole thing around teh 1628 sinking of the Vasa — the ballast failure, the gunports too low, the top-heavy design — since each flaw looks sufficient on its own, but I'm worried that's still too obvious and they'll just say "well, all three together did it." I also want to work in a distinction I'm playing with between redundant causation, where pulling out any single cause still leaves the outcome intact, versus complementary causation, where the causes only do the job in combination and you'd have to remove several at once. Can you plan the explaination arc for me? I need the exact order the pieces have to come in, starting from their single-cause intuition and building up to the counterfactual redundancy test; what the carrying case needs to have and lack so it actually demonstrates redundancy rather than just messiness; the misconceptions they'll form — I'm guessing they'll confuse overdetermination with "we just don't know which cause was the real one," or apply it whenever there's more than one factor involved — and precisely where in the sequence I should head each one off. I also want one concrete check at the end that shows they've grasped the redundancy idea rather than just nodding along, plus a clear statement of what I should leave out at this level and say so — maybe probabilistic causation, or the metaphysics of causal powers? Don't send me a reading list; I just need the teaching plan.
