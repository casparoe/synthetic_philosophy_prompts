answer: |-
  Here’s a step-by-step teaching plan designed to build conceptual clarity, preempt misconceptions, and use the *Vasa* case effectively. Focus is on **deterministic overdetermination (redundancy)** vs. **complementary causation** without metaphysics or probability.

  **Core Objective:** Students distinguish between cases where causes are *individually sufficient* (redundant/overdetermined) vs. *jointly necessary* (complementary).

  **Key Avoidance:** Probabilistic causation, causal powers, preemption, transitivity.  
  **Explicit Boundary Statement (Open with this):** *"Today, we’re simplifying: we’ll assume causes are deterministic (no ‘might-have-beens’) and focus only on whether causes operate redundantly or complementarily. We won’t tackle probability or the metaphysics of ‘causal powers’."*

  ---

  ### **Teaching Sequence (75-min session):**

  #### **Phase 1: Shatter Single-Cause Intuition (15 min)**
  *   **Hook:** "Imagine your car won’t start. What’s *the* cause? Dead battery? Fuel pump? Starter motor?"  
  *   **Student Input:** Brainstorm historical events they assume have a single cause (e.g., Fall of Rome, Industrial Revolution). List on board.  
  *   **Challenge:** "Pick one event. Is it *really* impossible that multiple distinct factors could each have been *enough* to cause it on their own? Or do some factors *only work together*?"  
  *   **Transition:** "We need tools to analyze this. Let’s test ideas with a concrete case: the *Vasa*."

  #### **Phase 2: *Vasa* Case Study – Deploying Counterfactuals (25 min)**
  *   **Setup (Facts ONLY):**  
      *   *Vasa* sinks maiden voyage 1628.  
      *   Known flaws: (1) Insufficient ballast (too light/low), (2) Gunports too low (water enters if heeled), (3) Top-heavy design (unstable).  
      *   **Crucial Detail:** Ship heeled in light wind *before* sinking – a mild stress test.  
  *   **Question 1:** "If *only* the ballast had been sufficient (say, 20% more stone), and gunports/design remained flawed – would it have sunk in *that* breeze?" *[Guide them: Yes, instability/gunports could still doom it.]*  
  *   **Question 2:** "If *only* the gunports were higher (sealed tight above waterline), and ballast/design remained flawed – would it have sunk?" *[Yes, instability could capsize it before water ingress mattered.]*  
  *   **Question 3:** "If *only* it wasn’t top-heavy (lower castles), and ballast/gunports remained flawed – would it have sunk?" *[Yes, inadequate ballast + low gunports could still flood it if it heeled slightly.]*  
  *   **Key Insight:** *"Each flaw, acting alone under the ACTUAL conditions (that light wind), was SUFFICIENT to cause the sinking.* This is **Redundant Causation** (Overdetermination). Removing any ONE flaw leaves other SUFFICIENT causes intact. The outcome is robustly caused."  
  *   **Preempt Misconception 1:** *"This isn't about uncertainty! We're not saying 'we don't know which cause did it.' We're saying ANY ONE could have done it ALONE, and ALL were present."*

  #### **Phase 3: Introduce Complementary Causation & Contrast (15 min)**
  *   **New Example (Complementary):** "Why did the French Revolution erupt in 1789?" Pick 3 factors: (A) Fiscal crisis (war debt), (B) Poor harvests (bread prices soar), (C) Political deadlock (Estates-General).  
  *   **Counterfactual Test:**  
      *   Remove (A) Fiscal crisis? *[Hypothetical: King has huge cash reserves. Does revolution still happen if harvests are fine & politics functional? Likely No.]*  
      *   Remove (B) Harvests? *[Hypothetical: Bumper crops, cheap bread. Does revolution happen if treasury is full & politics functional? Likely No.]*  
      *   Remove (C) Deadlock? *[Hypothetical: King reforms smoothly. Does revolution happen if treasury full & bread cheap? Likely No.]*  
  *   **Key Insight:** *"These causes are **Complementary**. Each was NECESSARY in the context. Remove ANY SINGLE one, and the outcome likely doesn't occur. They only 'work' in COMBINATION."*  
  *   **Contrast w/ *Vasa*:** "Complementary causes are like ingredients in a recipe – leave one out, the cake fails. *Vasa*'s causes were like multiple lit fuses on one bomb – any one fuse alone was enough to blow it up."  
  *   **Preempt Misconception 2:** *"Overdetermination (redundancy) isn't just 'multiple causes.' It's specifically multiple INDIVIDUALLY SUFFICIENT causes present simultaneously. Complementary causes are also multiple, but they are JOINTLY NECESSARY."*

  #### **Phase 4: The "Redundancy Test" & Application (15 min)**
  *   **Formalize the Test:** "To diagnose redundant causation: *For each alleged cause (C1, C2, Cn), ask: If ONLY that cause were present (and the others were ABSENT), would the outcome (E) STILL have occurred in the actual circumstances?* If YES for multiple causes, it's overdetermined."  
  *   **Application Exercise (Check for Grasp):**  
      *   **Scenario:** A building burns down. Factors: (1) Faulty wiring sparked near curtains, (2) Arsonist poured gasoline nearby, (3) Safety sprinklers disabled. Fire starts simultaneously via spark *and* gasoline.  
      *   **Question:** "Is this redundant causation? Apply the test to ONE factor. Imagine ONLY the arsonist's gasoline was present (no faulty wiring, sprinklers WORKING). Would the building still burn down in that scenario? *[Yes, gasoline ignites quickly, sprinklers disabled aren't needed for ignition.]*  
      *   **Follow-up:** "What about ONLY faulty wiring (no arsonist, sprinklers WORKING)?" *[Debatable, but plausible YES if spark ignites flammable material fast enough before sprinklers activate.]*  
      *   **Conclusion:** *"Likely redundant – ignition paths were independent and sufficient. Disabled sprinklers might be redundant too, or complementary to the spread – but the IGNITION is overdetermined."*  
  *   **Why it Matters for History:** "Redundancy shows some outcomes are *inevitable* under certain conditions (multiple paths to failure/success). Complementary causation shows *fragility* (many things had to go right/wrong)."

  #### **Phase 5: Wrap-Up & Boundaries Reiterated (5 min)**
  *   **Summary:** "Two key multi-causal patterns:  
      1.  **Redundant (Overdetermined):** Multiple INDIVIDUALLY SUFFICIENT causes present. Remove one, outcome still happens. (*Vasa*, Fire ignition).  
      2.  **Complementary:** Multiple JOINTLY NECESSARY causes. Remove one, outcome likely doesn't happen. (French Rev triggers).  
      The **Redundancy Test** (would E happen if *only* C1 was present?) diagnoses this."  
  *   **Re-State Limits:** "Remember, we simplified! We ignored probability (e.g., 'very likely'), causal chains, and deep questions about what causation *is*. We focused on sufficiency vs. necessity in deterministic cases."  
  *   **Final Thought:** "Does recognizing redundancy make history seem less contingent? Does complementary make it seem more fragile? Something to ponder."

  ---

  **Why this works with *Vasa* & avoids pitfalls:**
  *   **Focused Counterfactuals:** The *Vasa* analysis *forces* consideration of each flaw **in isolation** under the *actual mild conditions*. This prevents "all three together" as the only answer and demonstrates sufficiency.
  *   **Clear Contrast:** Juxtaposing *Vasa* (redundant) with French Revolution (complementary) makes the distinction concrete and operational.
  *   **Active Test:** The fire scenario requires applying the redundancy test, not just recognizing it.
  *   **Misconceptions Addressed Head-On:** Uncertainty vs. sufficiency ("we don't know which") and multiplicity vs. redundancy are explicitly countered where they arise.
  *   **Level-Appropriate:** Uses accessible logic (sufficiency/necessity via counterfactuals), avoids formal notation, sidesteps deep metaphysics/probability.

  **Key Carry-Out Message:** The difference lies in the *counterfactual dependency* (or lack thereof) of the outcome on *individual* causes. The "Redundancy Test" is their practical tool.
