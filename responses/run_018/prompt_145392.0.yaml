  My friend and I spent three long evenings arguing about when a legend actually crosses into history, using the Trojan War, King Arthur, and the Exodus as our running examples, and we finally agreed that we were talking past each other rather than disputing shared facts. I want us both to sign a joint adversarial-collaboration statement that captures exactly where we stand. I am what we have called a Materialist Historian: I hold that a legend becomes history only when independent material or documentary evidence corroborates specific narrative claims, and that without such corroboration internal coherence or transmission stability is never sufficient. My friend is a Narrative Stratigrapher: she holds that a legend becomes history when comparative analysis reveals diachronic layers—a plausible historical kernel embedded within later mythic accretion—and that this decomposition can be performed through transmission-stability and anachronism-pattern analysis without requiring direct archaeological confirmation of the kernel itself.

  Please draft the document we should both be able to sign. Structure it exactly as follows.

  First, a numbered section of agreed claims—statements about the nature of the Trojan, Arthurian, and Exodus narratives; about the limits and capabilities of archaeological and textual methods; about transmission dynamics across oral and literate cultures; and about the epistemic standards each of us applies—phrased in neutral language that neither side would reject.

  Second, a disagreements table with three columns: Crux, Materialist Historian formulation, and Narrative Stratigrapher formulation. Each row must state the precise disagreement in wording that its own side accepts. The cruxes must include at least: (i) the anachronism problem—whether the presence of clearly later-period details inside a legend destroys the historicity of the whole or instead marks the boundary between an older kernel and subsequent accretion; (ii) the negative-evidence problem—whether the absence of archaeological traces for a claimed large-scale event counts as strong counter-evidence or is an expected result of preservation bias and the nature of the activities involved; and (iii) the convergence criterion—whether independent traditions converging on a specific detail (a name, a place, a sequence of events) indicate a shared historical origin or can be explained by shared literary dependence, common archetypes, or parallel invention.

  Third, for each crux, provide one concrete case or piece of evidence that both of us accept bears on it, followed immediately by each side’s explicit prediction about what that case demonstrates. The cases must include: the Hittite textual references associating Wilusa and Ahhiyawa with the Trojan region; the embedding of high-medieval chivalric and feudal structures within Arthurian narratives ostensibly set in the sixth century; and the presence in the Exodus narrative of place names and ethnic designations that align more closely with Late Bronze Age geographic and political contexts than with Iron Age settlement patterns.

  The document must not ask for bibliographies, reading lists, or citations; it must not invoke obscure theoretical frameworks by proper name unless both sides already share an identical understanding of them; and it must remain a constructive joint statement rather than a dialogue, a verdict, or a diagnosis of why the debate is stuck.

  After the document, provide a brief structured summary in JSON format with exactly this schema:

  {
    "agreed_claims_summary": [string],
    "disagreements": [
      {"crux": string, "materialist_view": string, "stratigrapher_view": string}
    ],
    "test_cases": [
      {"case_name": string, "materialist_prediction": string, "stratigrapher_prediction": string}
    ],
    "remaining_ambiguity": string
  }

  Keep the tone formal, polished, and accessible—this is a statement both parties could put their names to, not a dramatized exchange.
