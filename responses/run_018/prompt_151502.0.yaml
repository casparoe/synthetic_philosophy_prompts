  The League's structure was a federation, but without coercive enforcement. It relied on collective security but had no military force. Sanctions were possible but not binding, leading to failures in Manchuria and Ethiopia. This shows Kant's point that a federation needs some binding force but not a world state. The League's inability to enforce decisions highlights the gap Kant noted—without enforceable laws, peace isn't guaranteed.

