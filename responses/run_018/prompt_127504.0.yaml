answer: |-
  Here are 10 incisive, conversation-driving questions (including follow-ups) designed to probe the machinery of her theory, keyed to her specific focus on digital selection environments. They avoid rehashing basics and target conceptual pressure points:

  1. **Core Tension (Replicator in Digital Remix):**  
     "You argue TikTok dances are Darwinian systems with replicators and interactors. But if the *interactor* is the constantly remixed video performance, and the 'developmental environment' (the algorithm + user base) actively *selects for mutation*, where is the replicator actually stored? Is it in the abstract 'challenge rules,' the neural pattern of the creator, or something else—and how do we empirically distinguish it from just describing a flow of behavioral variation?"  
     *→ Likely Reply: "It's the minimally essential 'instruction set' for imitation, abstracted from specific performances."*  
     **Follow-Up:** "But if the replicator is this abstracted 'instruction set,' and selection *favors* high mutability (like absurdist edits that shred the original), doesn’t that blur the line between replicator and interactor until the replicator concept loses its predictive power? How is this different from just saying 'behaviors vary under selection'?"

  2. **Maladaptivity & Selection Levels:**  
     "Algorithmic feeds seem to create a mismatch: memes harmful to hosts (e.g., extreme misinformation, self-harm trends) thrive because selection prioritizes engagement. If cultural evolution is Darwinian, why doesn’t host-level selection weed these out? Is this evidence against the replicator framework, or just a quirk of the environment?"  
     *→ Likely Reply: "Selection operates at multiple levels—algorithmic favoritism is rapid *meme-level* selection overriding slower *host-level* costs."*  
     **Follow-Up:** "Doesn’t that make the theory unfalsifiable? Any meme that persists can be explained by 'meme-level selection,' and any that vanishes by 'host-level costs.' What observable threshold would prove host-level selection *overrides* algorithmic pressure in your model?"

  3. **vs. Evolutionary Psychology (No Cheating!):**  
     "You position memetics as an alternative to evolutionary psychology for cross-cultural patterns. But if you reject innate modules and say domain-general learning under selection explains everything, how is that *different* from EvPsych just shifting the 'innateness' to the selection environment? Where does your model make a unique, testable prediction EvPsych can’t?"  
     *→ Likely Reply: "Memetics predicts path-dependence and rapid adaptation to novel environments without genetic change."*  
     **Follow-Up:** "But doesn’t EvPsych also accommodate cultural evolution via 'evoked culture'? Can you give a concrete example—say, viral dance formats—where *only* a strict replicator-interactor model explains the pattern, and domain-general learning + EvPsych fails?"

  4. **The Failure Problem (Hidden Pressures):**  
     "Take structurally identical memes—same format, same potential 'fitness'—where one goes viral and one dies instantly. Does accounting for this force you to invoke unobserved variables (e.g., 'micro-selective environments' or 'developmental noise'), or worse, sneak in designer-like intent ('bad timing')?"  
     *→ Likely Reply: "Stochasticity and micro-environments are inherent in evolution; not all variation gets selected."*  
     **Follow-Up:** "Sure, but in biology, we can map genetic drift or spatial niches. With digital memes, how do we *measure* these hidden variables without retrofitting the explanation? Isn’t 'algorithmic micro-environment X was unfavorable' functionally equivalent to 'just because'?"

  5. **Fidelity’s Paradox in Algorithmic Environments:**  
     "You note algorithmic feeds select *against* high-fidelity replication (e.g., rewarding remixes over originals). If selection optimizes for *mutability* over faithful copying, does this undermine the 'replicator' analogy itself? Viruses mutate, but they retain core reproductive machinery—do these digital memes?"  
     *→ Likely Reply: "The replicator is the mutable *template*, not the content. Selection for mutability is still selection!"*  
     **Follow-Up:** "But if the 'template' is defined by its *capacity to mutate* rather than any conserved core (like DNA nucleotides), how is this not just redefining evolution as 'whatever changes survive'?"

  6. **Oral vs. Digital Developmental Environments:**  
     "Oral traditions had human brains as the primary 'developmental environment' enforcing fidelity through constrained social learning. Algorithmic feeds replace this with engagement-driven selection. Does this shift fundamentally alter the *unit* of evolution—e.g., from meme-as-replicated-pattern to meme-as-attention-event?"  
     *→ Likely Reply: "The unit remains the replicator, but the interactor (performance) and selector (algorithm) are novel."*  
     **Follow-Up:** "If the selector is now an AI optimizing for metrics unrelated to human utility, does cultural evolution become 'alien'—a process where memes adapt to non-human pressures, decoupled from traditional host interests entirely?"

  7. **The "Not a Bug" Objection – Applied:**  
     "Critics might say harmful memes spreading via algorithms expose a flaw in Darwinian models of culture. You’d call this 'multi-level selection in action.' But if algorithmic selection is so powerful it overrides host well-being, is there *any* scenario where host-level costs could 'win' in your framework? Or is the meme-level now dominant?"  
     *→ Likely Reply: "Host costs impose long-term pressure; think collapsing platforms or regulation."*  
     **Follow-Up:** "Isn’t that external rescue? If the theory requires platform collapse (a non-Darwinian event) or regulation (intentional design) to resolve maladaptivity, does it concede limits to pure selectionist explanations?"

  8. **Empirical Test Case Challenge:**  
     "Can you walk me through a specific, testable prediction your model makes about *digital* meme evolution that a rival model (e.g., social contagion or network theory) wouldn’t? Crucially, what would falsify it?"  
     *→ Likely Reply: "Prediction: In high-algo environments, meme lineages will show increasing mutation rates targeting engagement hooks, not information retention."*  
     **Follow-Up:** "But couldn’t a network theorist say that’s just 'nodes optimizing for centrality'? And what *specific* mutation pattern would make you say, 'Okay, replicator theory failed here'?"

  **Key angles covered:** Replicator paradox in remix culture (Q1-F1), maladaptivity & levels (Q2-F2), EvPsych distinction (Q3-F3), failure/randomness (Q4-F4), algorithmic fidelity warping (Q5), oral/digital shift (Q6), limits of "multi-level" (Q7-F7), and testability (Q8-F8).  

  **Tone Tips:**  
  - **Pivot on her replies:** Use phrases like "Help me square that with..." or "So if I follow..." before the follow-up.  
  - **Demand specificity:** Push for examples, thresholds, or falsifiable claims when she abstracts.  
  - **Acknowledge nuance:** "I get that evolution is messy, but..." shows engagement without softballing.  
  - **Flag stakes:** "If the answer is always 'multi-level selection,' does the model lose bite?" forces clarification.  

  These questions treat her framework as a live, contestable model—exactly what makes for compelling podcast dialogue. Good luck!
