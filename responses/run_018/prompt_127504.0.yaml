  1. **Replicator-Interactor in TikTok**: The core issue is identifying the replicator when the interactor (dance) mutates rapidly. The replicator might be abstract instructions, not the specific movements. Follow-up could challenge if this abstraction is testable or just a theoretical escape.

  2. **Maladaptive Memes**: Algorithms select for engagement, not host welfare, leading to harmful memes surviving. Her likely response is multi-level selection (individual vs. population). Follow-up could question if this makes the theory unfalsifiable since any outcome can be explained by shifting levels.

