prompt: |-
  I'm a journalist working on a feature about why well-informed people go on disagreeing, and I need help auditing an analogy that has quietly become the spine of the piece.

  My case study is a long-running row between two senior epidemiologists. Both have read the same literature; both know the other's published position. One puts the probability that a widely prescribed drug causes a particular rare adverse event at something like one in ten thousand and worth acting on; the other puts it at effectively zero. Neither, privately, thinks the other is stupid or corrupt.

  A commentator I interviewed says the row is an illusion, and reaches for a picture: two engineers reading the same gauge. If their readings differ, either an instrument is faulty or somebody is misreporting it — there is no third option in which both are competent, honest, and right. He cites Aumann's agreement theorem as the proof: agents who share a prior and who have common knowledge of each other's posteriors must post the same number, so a disagreement that survives full disclosure of the evidence is itself evidence of a defect — incoherence, motivated reasoning, or bad faith. He uses this to licence a strong practical conclusion: funders and editors should stop treating expert disagreement as a reason for modesty or for splitting the difference, because in such cases at least one party is failing, and a formal synthesis or a betting market will reveal which.

  What I want is an audit, not a summary. Set out the correspondence explicitly — a table is fine: what plays the engineer, the gauge, the reading, the faulty instrument, the misreported figure — and then say where the mapping breaks. In particular, test three worries of my own. First, the gauge picture imports a shared calibration standard; my two sources plausibly carry different priors about base rates for rare harms and about how much observational data can bear compared with trials, and I'm told the whole impossibility result depends essentially on a common prior rather than merely different private information. Is that right, and does it matter here? Second, "the drug causes the adverse event" is not one proposition but a family — across dose, duration, genotype, background rate — so they may be pricing different members of that family, or disagreeing about which partition of possibilities is the right one to reason over; does the theorem get any grip when the contested thing is the state space rather than the probability? Third, common knowledge: I've been told that if there is even a small chance a stated number never reached the other party, exact agreement no longer follows but only approximate agreement, and that the result also assumes each agent has already computed the posterior their evidence supports, which nobody does with a messy literature. Is either claim correct, and how much work does it do?

  Finally, a second source offered a replacement picture: two surveyors on adjoining hills in thick fog, each describing the lie of the land. Their accounts differ because the vantage points differ, and neither is misreading anything; on his telling this shows the theorem is really about a shared map that real disputants simply don't have. Audit that one too — I worry it proves too much, since on that picture no disagreement is ever a mistake and it cannot distinguish my epidemiologists from a row where one side is quietly funded by the manufacturer. Separate the disanalogies that matter for the intended use from the ones that don't, tell me whether a better analogy exists, and say whether the strong conclusion survives once the disanalogies are on the table or whether the analogy was carrying it. Finish with a single final line in exactly this form: \answer{does-not-survive}, \answer{survives-weakened} or \answer{survives}.
reasoning: |-
  Hmm, the user is a journalist working on a feature about why well-informed people disagree, focusing on a dispute between epidemiologists about drug risks. They need help auditing an analogy comparing this to engineers reading a gauge, which is used to argue that disagreements must stem from defects like incoherence or bad faith due to Aumann's agreement theorem. The user has three specific worries about this analogy and wants me to test them, plus evaluate a second analogy about surveyors on hills.

  First, I need to recall Aumann's agreement theorem. It states that if two rational agents share a common prior and have common knowledge of each other's posteriors, their posteriors must be equal. The theorem relies on shared priors, common knowledge, and perfect rationality. The gauge analogy maps directly: engineers are agents, the gauge is evidence, readings are posteriors, faulty instrument is incoherence, misreporting is bad faith. But this ignores key complexities.

  The user's first worry is about priors. In the epidemiologists' case, they likely have different priors about base rates for rare harms and the reliability of observational data versus trials. The theorem depends crucially on a common prior, so if priors differ, disagreement can persist rationally. This matters because their dispute probably stems from these foundational differences, not defects.

  The second worry is about proposition granularity. "The drug causes the adverse event" isn't a single proposition; it could vary by dose, duration, etc. The epidemiologists might be evaluating different sub-propositions or partitioning the possibility space differently. Aumann's theorem assumes a fixed state space, so if they're reasoning over different spaces, the theorem doesn't apply. This is relevant here as drug effects are complex and context-dependent.

  The third worry concerns common knowledge and computational limits. Common knowledge requires that each knows the other knows, and so on, infinitely. In practice, communication isn't perfect, so agreement should be approximate, not exact. Also, the theorem assumes agents perfectly compute posteriors from evidence, but real experts deal with messy, incomplete data and cognitive limits. Both points weaken the theorem's applicability to real-world disputes like this one.

  Now, the surveyor analogy: two surveyors on foggy hills describing land. Their views differ due to vantage points, not errors. This highlights that differing evidence (due to position) can cause rational disagreement without shared priors or common knowledge. But it proves too much because it can't distinguish rational disagreements from irrational ones, like those influenced by bias or funding. In the user's case, if one epidemiologist is industry-funded, that's a defect, but the analogy lumps it with legitimate differences.

  The strong practical conclusion from the gauge analogy—that funders should dismiss disagreements as defects and use formal methods—doesn't survive. Once we account for differing priors, granularity issues, imperfect knowledge, and computational limits, persistent disagreement doesn't imply failure. The epidemiologists' row is likely rational, rooted in legitimate differences. The surveyor analogy is better but needs qualification to avoid excusing all disagreements.

  A better analogy might be two chefs tasting the same complex dish but focusing on different aspects (e.g., saltiness vs. spice), leading to different overall assessments. This captures how experts can weight evidence differently based on priors or perspectives. The strong conclusion doesn't hold; instead, modesty and synthesis remain valuable when priors differ legitimately.

  Final line: the strong conclusion doesn't survive the audit, so \answer{does-not-survive}.
answer: |-
  Below is a complete audit of the gauge analogy and the surveyor analogy, structured as requested. I address your three worries explicitly, test the analogies, and evaluate the strong practical conclusion. The table sets out the correspondence for the gauge analogy, followed by a breakdown of where it fails. I then analyze the surveyor analogy and its limitations before assessing the conclusion.

  ### 1. **Gauge Analogy Correspondence Table**
  | **Element in Analogy** | **Correspondence in Disagreement Context** | **Purpose in Argument** |
  |------------------------|--------------------------------------------|-------------------------|
  | **Engineers**          | The two epidemiologists                   | Rational agents who process evidence. |
  | **Gauge**              | The shared scientific evidence (literature, data) | Objective source of truth. |
  | **Reading**            | Their published probability estimates (e.g., 1/10,000 vs. ~0) | Posterior probabilities. |
  | **Faulty instrument**  | Incoherence (flawed reasoning, e.g., misapplied statistics) | Defect in how evidence is processed. |
  | **Misreported figure** | Bad faith (e.g., motivated reasoning, corruption) | Dishonesty in stating beliefs. |

  ### 2. **Where the Gauge Analogy Breaks Down**
  The analogy fails because it assumes a controlled, mechanical process with unambiguous inputs and outputs. Real expert disagreement involves subjective interpretation, differing frameworks, and practical constraints. Your three worries pinpoint critical disanalogies:

  - **Worry 1: Shared Priors vs. Private Information**  
    **Audit:** Yes, Aumann’s theorem *crucially* depends on a **common prior** (a shared initial probability distribution over all possible states of the world). If priors differ, disagreement can persist rationally even after sharing evidence. In your case:  
    - Epidemiologists likely have different priors about base rates (e.g., one assumes rare events are inherently more plausible) or evidential weight (e.g., one trusts observational studies less than RCTs).  
    - **Does it matter?** Absolutely. The "impossibility" of disagreement vanishes if priors aren’t identical. The theorem does not apply here, as real experts develop priors from distinct experiences (e.g., one specializes in pharmacovigilance, the other in mechanistic biology). This is not a "defect" but a feature of expertise.

  - **Worry 2: Granularity of the Proposition**  
    **Audit:** Correct. "The drug causes the adverse event" is a coarse proposition masking finer sub-questions (dose, genotype, etc.). Aumann’s theorem assumes a fixed, shared partition of the state space. Here:  
    - The epidemiologists may be evaluating different hypotheses (e.g., "causes in high doses with genetic susceptibility" vs. "causes at standard doses").  
    - **Does the theorem get grip?** No. The theorem requires agents to agree on *what possibilities exist* (e.g., a defined set of worlds where causation occurs). If they disagree on the state space itself (e.g., what variables matter), the theorem is inapplicable. This is likely in your case—disagreement stems from framing, not probability calculus.

  - **Worry 3: Common Knowledge and Computational Realism**  
    **Audit:** Both claims are correct and consequential:  
    - **Common knowledge failure:** Aumann requires infinite mutual knowledge ("I know you know I know..."). If there’s any doubt about evidence reception (e.g., a paper wasn’t fully internalized), agreement is only approximate, not exact. In your case, full common knowledge is implausible—experts never perfectly absorb all nuances.  
    - **Computational limits:** The theorem assumes agents can perfectly compute posteriors. Real experts use heuristics for "messy literature" (e.g., discounting low-quality studies differently). No one has the capacity for Bayesian updates over all data.  
    **How much work does it do?** These break the analogy’s core. The gauge assumes instantaneous, error-free reading; real evidence synthesis is iterative and fallible. This explains why minor disagreements persist rationally.

  ### 3. **Audit of the Surveyor Analogy**
  **Picture:** Two surveyors on adjoining hills in thick fog, describing the land. Disagreement arises from differing vantage points, not errors.  
  **Intended use:** Highlights that agents with distinct (but legitimate) perspectives can rationally disagree without shared priors or identical evidence.

  **Disanalogies that matter for your case:**  
  - **Relevant similarities:** Captures how experts see "different parts" of the evidence (e.g., one focuses on clinical trial data, the other on real-world pharmacoepidemiology). This aligns with Worry 1 (differing priors) and Worry 2 (granularity).  
  - **Relevant differences:**  
    - **Cannot distinguish rational vs. irrational disagreement:** The analogy treats *all* vantage-based disagreement as valid, ignoring cases like industry funding (bad faith) or statistical errors (incoherence). In your epidemiologists' case, it fails to flag if one is "quietly funded by the manufacturer" (a defect).  
    - **Overlooks corrigibility:** Surveyors might converge by sharing maps; experts can (and should) update from shared evidence. The analogy risks excusing stubbornness.  
    - **Proves too much:** If no disagreement is a "mistake," it undermines accountability. Real disputes *can* involve faults (e.g., ignoring key evidence), which this analogy obscures.

  **Does a better analogy exist?**  
  Yes: **Two chefs tasting the same complex dish.**  
  - Both experience identical evidence (the dish), but interpret it through distinct priors (e.g., one prioritizes saltiness, another spice balance).  
  - Disagreement can stem from legitimate focus (granularity), differing sensory thresholds (priors), or skill (computation). Yet, faults (e.g., a burnt tongue) or bias (e.g., favoring a sponsor’s ingredient) remain detectable.  
  - **Why it fits:** Allows for rational divergence (addressing your worries) while accommodating defects.

  ### 4. **Does the Strong Practical Conclusion Survive?**
  - **Strong conclusion:** "Funders/editors should reject modesty or splitting differences; disagreement implies defects, and formal synthesis/betting markets will resolve it."  
  - **Assessment after audit:** The conclusion **does not survive**.  
    - **Why:** The gauge analogy’s disanalogies (differing priors, proposition granularity, and knowledge/computation limits) explain your epidemiologists’ disagreement *without* requiring defects. The surveyor analogy, while better, cannot support the conclusion as it ignores bad faith/incoherence.  
    - **Role of the analogy:** The conclusion is *entirely carried* by the gauge analogy. Once its flaws are exposed:  
      - Betting markets/synthesis *can* help but won’t always resolve disputes (e.g., if priors or state spaces differ irreconcilably).  
      - Modesty and compromise remain prudent—experts may *validly* hold differing weights for evidence.  
    - **Reality check:** In your case, neither epidemiologist suspects stupidity/corruption. This suggests the disagreement is foundational (priors/framing), not a failure.

  \answer{does-not-survive}
