prompt: |-
  I'm working through a niche conceptual framework—developed in some recent philosophy-of-computation discussions but not widely standardized—that distinguishes a substrate layer called the careenium (a continuously dynamic, non-linearly unstable medium whose local state-transitions are highly sensitive but not symbolically structured) from discrete, self-referential symbolic configurations called simmballs, which can be embedded in or mapped onto regions of the careenium without being reducible to any local substrate dynamics. The central question is whether these simmballs possess genuine downward causal efficacy—do they literally push the careenium around, altering its trajectory in ways that cannot be fully accounted for by substrate-level dynamics alone—or are they merely epiphenomenal patterns, useful for description but causally inert?

  Before I assess the competing answers (full downward causation, emergent correlation without causation, and strict substrate autonomy), I want the full specification of adequacy. Write the desiderata that any theory of symbol-substrate interaction in this framework must meet: the specific phenomena it must explain (for instance, cases where the application of a symbolic rule appears to redirect substrate dynamics away from its local attractor, versus cases where substrate noise disrupts symbolic stability without altering the rule itself); the distinctions it must preserve without collapse (e.g., correlation versus causation, local substrate perturbation versus global symbolic restructuring, weak embedding versus strong downward determination, and differences in causal grade across different kinds of simmballs); consistency conditions with what we know about unstable dynamical substrates; and any no-go results—perhaps analogous to exclusion arguments in other domains—that might render some subset of these requirements jointly unsatisfiable. For each desideratum, provide the motivating case or theoretical consideration behind it, and flag whether it is non-negotiable or a camp-specific preference (say, of physicalists who insist on substrate closure versus functionalists who allow substrate-independent symbolic causation). If you suspect that two desiderata—such as requiring both complete substrate autonomy and robust downward causal efficacy—are in direct tension, state that explicitly and explain why. Keep the weight on the criteria and their motivating logic rather than on scoring existing theories, though a brief note on how standard emergentist, epiphenomenalist, and interactionist accounts fare against your list is welcome. I am not asking for a bibliography or citation list; I want the conceptual architecture.
reasoning: |-
  Okay, the user is diving deep into a niche framework involving the careenium and simmballs. They want a clear set of criteria to evaluate theories about whether simmballs have real downward causation. First, I need to unpack their core question: are simmballs causally effective or just patterns?

  The user mentioned three possible positions: downward causation, emergent correlation, or strict substrate autonomy. They want desiderata that any theory must satisfy. I should start by listing the non-negotiable requirements based on the framework's definitions. For example, the careenium is non-linearly unstable and sensitive, so any theory must respect its dynamical nature. Also, simmballs are discrete and symbolic, so they can't be reduced to local substrate states. Those are foundational.

  Next, phenomena to explain. The user gave examples like symbolic rules redirecting substrate dynamics or noise disrupting simmballs. I need to include cases where simmballs override local attractors and where substrate fluctuations cause symbolic errors without rule changes. These are critical test cases for theories. Also, explaining how simmballs maintain stability despite a noisy substrate is essential for their persistence.

  Preserving distinctions is another big category. The user wants to avoid collapsing concepts like correlation vs. causation. If a theory can't distinguish between mere patterns and actual causal influence, it fails. Similarly, local vs. global effects: small substrate changes might not alter simmballs, but major shifts should. Also, different simmballs might have varying causal strength, so the theory should account for that without oversimplifying.

  Consistency with dynamical systems is non-negotiable. The careenium's properties like sensitivity and chaos mean theories can't violate basic physics. Downward causation can't break conservation laws or introduce magic. This is where physicalists would insist on substrate closure, but functionalists might allow abstract causation. The tension here is real: if the substrate is causally closed, how can simmballs have real downward effects? That's a key conflict.

  No-go results could include exclusion arguments. If substrate dynamics fully determine changes, simmballs might be redundant. Or if downward causation introduces overdetermination, that's problematic. But maybe the framework allows for non-redundant causation. The user might be looking for ways around these, so I should mention possible counterarguments like different causal grains.

  I should also note desiderata that might conflict. For instance, requiring both substrate autonomy and robust downward causation creates tension. If the substrate follows its own laws, how do simmballs influence it without violating those laws? Theories need to navigate this carefully, perhaps through boundary conditions or constraints.

  Finally, considering how existing theories fare. Epiphenomenalism might handle substrate autonomy but fail on downward efficacy. Strong downward causation could struggle with consistency. Emergent correlation might be a middle ground but risks collapsing distinctions. Highlighting these briefly helps the user weigh options.

  The user's deeper need might be to rigorously test the framework's viability. They might want to see if simmballs can be more than metaphorical, which requires airtight criteria. By laying out desiderata clearly, especially the tensions, they can identify where the framework's strengths and weaknesses lie, aiding their assessment of the three positions.
answer: |-
  Below is a comprehensive specification of adequacy for theories of symbol-substrate interaction in the careenium-simmball framework. Desiderata are categorized, with each entry detailing the requirement, its motivation, and its negotiability status. Key tensions are flagged.

  ---

  ### **I. Foundational Non-Negotiables**  
  *(Mandatory for any theory respecting the framework's core ontology)*

  1. **Substrate Dynamical Integrity**  
     - **Requirement:** Theories must respect the careenium's intrinsic properties: nonlinear instability, continuous dynamics, local state-transition sensitivity, and absence of intrinsic symbolic structure.  
     - **Motivation:** The framework defines the careenium as fundamentally non-symbolic and dynamically unstable. Violating this collapses the distinction between substrate and simmballs.  
     - **Negotiability:** Non-negotiable. Physicalists and functionalists alike must accept this axiom.

  2. **Symbolic Irreducibility**  
     - **Requirement:** Simmballs must be ontologically distinct from the careenium—patterns that cannot be reduced to or fully explained by local substrate dynamics.  
     - **Motivation:** Central to the framework is that simmballs are discrete, self-referential, and globally configured, while the substrate is continuous and locally sensitive.  
     - **Negotiability:** Non-negotiable. Denial eliminates the framework’s purpose.

  ---

  ### **II. Explanatory Mandates**  
  *(Phenomena any adequate theory must explain)*

  3. **Symbolic Redirection of Substrate Trajectory**  
     - **Requirement:** Explain cases where a simmball’s rule application (e.g., logical inference) visibly alters the careenium’s path *away* from its local dynamical attractor (e.g., suppressing chaos in a region to stabilize computation).  
     - **Motivation:** Observed in computational systems where symbolic programs (e.g., error correction) override default physical behaviors. Tests for *efficacy*.  
     - **Negotiability:** Non-negotiable for downward causalists; epiphenomenalists must explain away as illusion.

  4. **Substrate-Induced Symbolic Fragility**  
     - **Requirement:** Account for cases where minor careenium fluctuations disrupt simmball stability *without* altering the embedded symbolic rule (e.g., noise corrupting a memory retrieval while the stored data remains intact).  
     - **Motivation:** Demonstrates substrate autonomy and simmball dependence on physical instantiation.  
     - **Negotiability:** Non-negotiable. Tests whether simmballs are truly "pushed around."

  5. **Symbolic Persistence Amidst Dynamical Instability**  
     - **Requirement:** Explain how simmballs maintain structural integrity despite the careenium’s nonlinear sensitivity (e.g., a simmball preserving logical coherence amid turbulent substrate changes).  
     - **Motivation:** Simmballs must be robust to count as real entities; else they collapse into ephemeral patterns.  
     - **Negotiability:** Non-negotiable. Functionalists and emergentists prioritize this; physicalists see it as emergent correlation.

  ---

  ### **III. Critical Distinctions to Preserve**  
  *(Conceptual boundaries a theory must not collapse)*

  6. **Correlation vs. Downward Causation**  
     - **Requirement:** Clearly differentiate between (a) simmballs merely *tracking* substrate dynamics and (b) actively *constraining* them (e.g., distinguishing a predictive model from an executive controller).  
     - **Motivation:** Prevents theories from smuggling in causation via descriptive convenience.  
     - **Negotiability:** Non-negotiable. Epiphenomenalists reduce (b) to (a); downward causalists insist on (b).

  7. **Local Perturbation vs. Global Restructuring**  
     - **Requirement:** Demarcate when substrate noise causes localized simmball errors versus when it triggers system-wide reconfiguration (e.g., a flipped bit vs. a protocol shift in a network).  
     - **Motivation:** Tests whether simmballs have holistic causal properties irreducible to part-wise failures.  
     - **Negotiability:** Camp-specific. Emergentists demand this; strict physicalists may see both as aggregate effects.

  8. **Causal Gradience Across Simmballs**  
     - **Requirement:** Accommodate varying "causal grades" (e.g., simple data patterns vs. self-modifying algorithms) without reducing all to one level.  
     - **Motivation:** Empirically, not all symbolic structures exert equal control (e.g., a passive buffer vs. an active scheduler).  
     - **Negotiability:** Functionalist preference; physicalists may flatten gradience.

  ---

  ### **IV. Consistency Constraints**  
  *(Alignment with broader principles)*

  9. **Substrate Dynamical Consistency**  
     - **Requirement:** Theories must not violate established principles of nonlinear dynamics (e.g., sensitivity to initial conditions, entropy constraints).  
     - **Motivation:** The careenium is defined as a physically plausible medium. "Magic" downward forces break the model.  
     - **Negotiability:** Non-negotiable for physicalists; functionalists might relax for abstract simmballs.

  10. **Causal Non-Redundancy**  
      - **Requirement:** Avoid overdetermination: if substrate dynamics fully determine state transitions, simmball efficacy must not be an extra "kick" but a reconfigured boundary condition.  
      - **Motivation:** Prevents exclusion arguments (à la Jaegwon Kim) that annihilate downward causation.  
      - **Negotiability:** Crucial for interactionists; epiphenomenalists deny efficacy outright.

  ---

  ### **V. No-Go Boundaries**  
  *(Theoretical limits on satisfiability)*

  11. **The Substrate Closure Constraint**  
      - **No-Go Result:** If the careenium’s dynamics are *causally closed* (all state transitions fixed by prior substrate states + laws), robust downward causation is impossible without violating closure or creating overdetermination.  
      - **Tension:** Directly conflicts with **Desideratum 3** (symbolic redirection).  
      - **Resolution Attempts:** Emergentists posit "configurational constraints" (global simmball states set substrate initial conditions); functionalists deny substrate closure at higher grains.

  12. **The Instability-Symbolism Tradeoff**  
      - **No-Go Result:** Extreme careenium instability threatens symbolic stability (**Desideratum 5**), while excessive simmball rigidity suppresses dynamical flexibility.  
      - **Tension:** Forces a tradeoff between simmball robustness and substrate responsiveness.  
      - **Implication:** Theories must balance these; e.g., via error-correcting codes or adaptive embedding.

  ---

  ### **Key Tensions in the Desiderata**
  - **Downward Efficacy vs. Substrate Autonomy (3 vs. 4):** Strong efficacy claims risk ignoring substrate turbulence; strong autonomy denies simmball causality.  
  - **Symbolic Irreducibility vs. Dynamical Consistency (2 vs. 9):** If simmballs are irreducible yet must conform to physics, their causal power must be "top-down" without supernaturalism.  
  - **Causal Gradience vs. Physical Uniformity (8 vs. 9):** Varying causal grades challenge physicalist homogeneity.  

  ### **How Existing Accounts Fare**
  - **Epiphenomenalism:** Meets 1,2,4,9 but fails 3,6,10; collapses simmballs to descriptive tools.  
  - **Strong Downward Causation:** Satisfies 3,5,6,8 but strains 4,9,11; risks dynamical incoherence.  
  - **Emergent Correlation:** Balances 1,2,4,5 but ambiguates 3,6,7; may mask causal inertness.  

  This architecture forces theories to navigate between the Scylla of physical reductionism (losing simmballs) and the Charybdis of dualism (breaking physics). A viable account must either redefine downward causation (e.g., as macroscale constraint) or relax substrate closure—but each move carries explanatory costs. The desiderata collectively test whether simmballs can be *more* than patterns but *less* than ghostly pushers.
