  **Classes of Proposals Prone to Misclassification and Residual Judgments**

  **Prone to Misclassification:**
  1. **Hybrid Proposals:** Proposals that combine prosaic techniques with non-prosaic ones in a way that the non-prosaic part is not immediately obvious (e.g., a proposal that uses RLHF but relies on an unstated assumption about agency). The protocol might miss the hidden assumption at Step 1.
