prompt: |-
  I'm currently on a course about historical sociology and political theory, and we've spent ages on Hobsbawm and Anderson — invented traditions, imagined communities, all that. I'm trying to write an essay but every argument I read just says nations are modern constructions and stops there. I want to go deeper, so I need the actual spec: what must any adequate theory of national genesis and persistence actually deliver?

  Write the desiderata for a theory in this area. Which cases does it have to cover? I'm thinking of things like Poland sustaining a national claim for over a century with no state apparatus, or census categories in colonial contexts creating groups people then genuinely organised around — but also cases where an invented tradition just flops and nobody takes it up. What distinctions must it preserve, like between state-led invention and popular uptake, or between continuity of a name and continuity of meaning? And what historical or sociological findings can it not contradict — for instance that nationalism survives state collapse, or that rituals presented as ancient were often codified within the last two centuries?

  I'm also stuck on whether the theory needs to explain what I'd call 'retroactive anchoring' — the way recent national narratives reach back and re-interpret pre-modern events as part of a continuous story, even when the framing is new. Is that a real requirement or am I asking to much? Flag any pair of desiderata you think are jointly unsatisfiable — say, treating nations as purely modern bureaucratic products while also explaining the emotional weight people attach to them without smuggling in essentialism. Please seperate what's settled among scholars from what's genuinely contested, and don't present one side as the consensus. I'd also appreciate a brief scorecard for Hobsbawm-style institutionalism and Anderson-style modular imagination against your list, but keep the weight on the criteria themselves — and please don't include a bibliography or citation list, since I won't have web access to check them.
