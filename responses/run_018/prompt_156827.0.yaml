  I should address their specific uncertainties. About Cummins: his framework absolutely allows multiple simultaneous functions. A trait can contribute to several system capacities at once, no stability required. Regarding the etiological counterargument: yes, one could argue selection favored plasticity itself, but that doesn't fully resolve the "lag" - it just pushes the question to why plasticity was selected. 

