r merely of symbolic construction — and explain how the collaboration has dissolved them. The statement should be written in formal philosophical prose, should not invoke named scholars as authorities, should not request or assume access to bibliographies or citation lists, and should be comprehensible to a reader who has no external search capability. Do not include a verdict on which camp is correct; the aim is exactness in agreement and in remaining disagreement.
