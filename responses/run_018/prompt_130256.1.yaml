prompt: |-
  I work in software engineering and have no formal philosophy training, but I am trying to understand the Buddhist doctrine of anatta (no-self) and what it implies for personal identity. I want you to draft the joint statement that two opposing interpretive camps could both sign after a good-faith adversarial collaboration.

  Camp A, the Process-Reduction camp, reads anatta as denying any persistent substrate beneath experience; personal identity is nothing over and above the impermanent, causally-linked aggregates (skandhas), comparable to a stateless distributed system in which each computation is handled by transient workers with no shared core.

  Camp B, the Constructive-Continuity camp, reads anatta as denying only an essentialist, unchanging controller or soul; they maintain that experiential and moral continuity require a reconstructed systemic boundary—like session state maintained across server failures without a central identity server—rather than a metaphysical self.

  Please deliver a document with: (1) a numbered section of claims both camps can sign, covering what anatta denies, the role of the aggregates, and the phenomena that must be explained (e.g., memory, moral agency, continuity); (2) a disagreements table stating each camp's precise position, in wording they would accept, on whether identity is fully reducible to discrete momentary processes, whether continuity requires more than causal linkage, and whether distributed-systems analogies illuminate or distort the doctrine; (3) the cruxes—specifically, whether causal linkage alone can ground responsibility across temporal gaps, and whether the first-person sense of persistence is an eliminable illusion or a functional property to be reconstructed; and (4) for each crux, a concrete case or argument both agree is relevant (e.g., severe amnesia with preserved behavior patterns, or maintaining session integrity without a central server), with each camp's explicit prediction about what it demonstrates.

  Do not include bibliographies, citation requests, or lists of scholars. Write formally and concisely.
