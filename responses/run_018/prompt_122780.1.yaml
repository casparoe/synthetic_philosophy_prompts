prompt: |-
  Hi — I'm one of three people writing the text for a small permanent gallery on the history of medicine at a regional science museum. My background is exhibit design, not history, and our de facto historian is a board member who mostly communicates by writing sigh in the margins of my drafts. We've got roughly forty wall panels, a twelve-foot timeline, and an audio-guide script to get done before we open in eight months, so this is a call I'm making two or three times a week, not once. Panels are about ninety words, no footnotes, read mostly by school groups and occasionally quoted by the local paper; the director signs everything off, and anything that looks like picking a fight goes to our lay advisory board. I get maybe fifteen minutes per panel and I can't run to the historian everytime.

  What I want is an actual procedure: the questions in order, what counts as an adequate answer to each, where it stops with a this needs a rewrite, where it stops with a this is a values call, send it upstairs, and where it says leave it alone because the honest version costs more than it buys. I've read a little about the whig interpretation of history — Butterfield's 1931 book, and the general complaint that telling the past as a march toward us flatters the present and falsifies the past — and it's easy to nod at in the abstract and weirdly hard to catch in my own sentences, so I need it operationalized into something I can run on a draft. A few things I want the procedure to handle, and please tell me which of my home-made distinctions are real and which are junk: the martyr frame, where someone was right, was laughed at, and died unappreciated, which I suspect is just whig history with a victim in it; the they almost got it habit, describing past actors as groping toward our answer; my own favourite move, the myth-busting panel, no, people in the middle ages didn't think the earth was flat, which I'm now worried is itself a progress story in which we're the enlightened ones and the past is a crowd of rubes; the timeline, which is nothing but milestones and might be the most whiggish object in the room; and panels where what was progress for one group was straightforwardly loss for another. I've been using a rough test I call the swap test: if the alternative that actually lost had won instead, and my panel still reads basically the same with the names changed, then I haven't written history, I've written a just-so story. Is that the right test, is there a better one, and what should I do when a true correction would eat forty of my ninety words and lose a ten-year-old?

  Then run the finished procedure on three things. First, my draft panel on the doctor in an 1840s Vienna maternity ward who made the staff wash their hands, was ignored, and ended up in an asylum: I want it to be moving but I think it's currently the martyr frame, so tell me what it should say instead. Second, the twelve-foot timeline: should it exist at all, and if it does, what does a non-whig timeline look like in chunks that short, given I can't run a second rail of roads not taken the whole way without loosing the school groups entirely. Third, the one I'll like least: the flat-earth myth-busting panel. If your procedure says it's smug in the same way the whig panels are smug, say so plainly and tell me what to do with it, because it's the panel I'm proudest of. And there's a fourth one I want flagged rather than solved — a panel on a local surgeon who pioneered a technique in the 1930s and also operated on people without asking them — where I want the procedure to say out loud that this stopped being a question it can answer.
reasoning: |-
  Okay, the user is part of a team creating a history of medicine exhibit for a regional science museum. They're facing challenges with historical accuracy, particularly avoiding the Whig interpretation of history, where the past is seen as a march toward present knowledge. They need a practical, step-by-step procedure to check their exhibit drafts efficiently, given tight deadlines and limited access to their historian. 

  First, I need to understand their constraints: 40 wall panels (~90 words each), a 12-foot timeline, and an audio guide. They have only 15 minutes per panel for review and can't consult the historian frequently. The audience is school groups and occasional local press, so clarity is key. The director signs off, and contentious issues go to an advisory board.

  The user mentioned specific issues: martyr frames, "they almost got it" narratives, myth-busting panels that might still imply progress, timelines as milestones (inherently Whiggish), and conflicting impacts of progress. Their swap test (changing historical outcomes to see if the narrative holds) is clever but might need refinement.

  Breaking down the procedure: I'll create a checklist with yes/no questions that escalate issues based on severity. The steps should identify Whiggish tendencies, problematic framing, and values conflicts. For each "no" answer, there should be clear actions: rewrite, escalate, or accept trade-offs.

  For the martyr frame (e.g., Semmelweis), the fix is contextualizing his story without hero/villain tropes—focusing on institutional resistance and broader factors like germ theory's absence. The timeline can be salvaged by adding non-linear elements like "meanwhile" events or thematic groupings. The flat-earth panel risks smugness; reframing it as historiographical (how myths form) rather than "we know better" reduces that. The surgeon panel (non-consensual operations) is a values conflict—escalation is necessary since it's beyond factual correction.

  The user's swap test is useful but incomplete. Adding "why it happened" and "what else was possible" layers addresses contingency. Word count limits mean prioritizing essential context—e.g., in the myth-busting panel, cutting "we now know" for "evidence shows medieval scholars understood."

  Finally, acknowledging their pride in the flat-earth panel while gently showing its Whiggish undertones requires tact. Emphasizing that the goal isn't to eliminate all progress narratives but to avoid distortion keeps it constructive.
answer: |-
  Here's a battle-tested, operational procedure designed for your constraints. It prioritizes efficiency, flags critical issues, and tells you *exactly* what to do next. Run it panel-by-panel in order.

  **The Anti-Whig Litmus Test (AWLT) - 15 Minute Procedure**

  1.  **The Core Narrative Check (3 mins):**
      *   **Question:** Does this text *explicitly* or *implicitly* frame the past solely as a stepping stone leading inevitably to our superior present understanding? (Look for words like "primitive," "naive," "futile," "finally," "paved the way," "led directly to," "despite their ignorance," "we now know," "mistakenly believed").
      *   **Adequate Answer:** A clear "No." The past is presented on its own terms, acknowledging its context. Alternatives or dead ends are implied or mentioned if crucial.
      *   **If NO:** Proceed to Step 2.
      *   **If YES / UNSURE:** **REWRITE NEEDED.** Flag for escalation only if the core fact *is* about a direct precursor (e.g., "This microscope design influenced later models"). Otherwise, focus rewrite on removing progress-as-destiny language. **Action: Rewrite.**

  2.  **The "Martyr" / "They Almost Got It" Frame Check (3 mins):**
      *   **Question:** Does this text present historical actors primarily as:
          *   a) Tragic heroes/victims ("right but ignored/laughed at")? (Martyr)
          *   b) Flawed precursors ("groping towards," "almost discovered," "if only they had X")? (Almost Got It)
      *   **Adequate Answer:** A clear "No" to both. Actors are presented with motivations and constraints understandable *in their own time*. Their ideas succeeded or failed based on context, not moral/intellectual superiority vs. "stupid" contemporaries or near-misses with "truth."
      *   **If NO:** Proceed to Step 3.
      *   **If YES:** **REWRITE NEEDED.** Reposition the actor within their context. *Why* were they ignored? (Lack of evidence they could provide? Institutional resistance? Incompatibility with dominant paradigms? Practical limitations?). *Why* didn't they "get it"? (Lacked necessary tools? Framework didn't exist? Pursued a different valid question?). **Action: Rewrite.**

  3.  **The Present-Centered Smugness Check (Myth-Busting Focus) (3 mins):**
      *   **Question:** Does this text spend significant energy correcting a "dumb past" myth *primarily* to make the audience feel superior ("Look how much smarter *we* are than *them*!")? Does it frame the correction as evidence of *our* progress rather than explaining the *past's reality*?
      *   **Adequate Answer:** "No," or "The correction is necessary context, but the focus remains on accurately depicting the past belief/knowledge system, not congratulating the present." The "myth" itself is historicized (why did *this* misconception arise later?).
      *   **If NO:** Proceed to Step 4.
      *   **If YES / BORDERLINE:** **REWRITE NEEDED.** Reframe the correction. Focus on *what people actually believed/knew then* and *why that made sense*. Briefly note when/why the *myth* about *them* arose. Avoid "Contrary to popular belief..." leading directly to "...we are enlightened." **Action: Rewrite.**

  4.  **The Cost-Benefit / Complexity Check (3 mins):**
      *   **Question:** Is there a crucial complexity, ambiguity, counter-narrative, or negative consequence that significantly changes the meaning if omitted? (e.g., "progress for some was loss for others," a theory had valid competing alternatives, a "hero" had major flaws).
      *   **Adequate Answer:** "No," or "Yes, but including the absolute core of this complexity is essential for basic accuracy and avoiding a seriously misleading just-so story, even if it takes 20 words."
      *   **If NO:** Proceed to Step 5.
      *   **If YES, ESSENTIAL:** **REWRITE NEEDED.** Find the *most concise* way to include the essential counterweight (e.g., "While this reduced infection, it also..." / "This theory competed with..."). Sacrifice less critical detail. **Action: Rewrite.**
      *   **If YES, BUT TRULY TOO COMPLEX (Cost > Benefit):** **VALUES CALL / ESCALATE.** The panel, as is, presents a sanitized or misleading view. Can you handle it with a single, stark phrase ("...controversial methods..." / "...with significant costs to...")? If not, or if it's ethically charged, escalate. **Action: Escalate to Director/Board with a clear flag: "Sanitizes [Issue] - Requires Policy Input."**

  5.  **The Swap Test Validation (3 mins):**
      *   **Question:** Apply your Swap Test: If the "losing" alternative had won, does the panel's *structure and core message* still make sense (just with different names/details)? Or does the panel *depend* on the "winner" being inherently destined or morally/intellectually superior?
      *   **Adequate Answer:** The structure *doesn't* depend on the specific winner being inevitable or "right" in an absolute sense. The focus is on *what happened, how, and why it made sense then*, not why it *had* to happen to lead to us. The test might make the panel *different*, but not nonsensical.
      *   **If YES (Test Passes):** **Action: Proceed (or minor polish).**
      *   **If NO (Test Fails - Just-So Story):** **REWRITE NEEDED.** The narrative relies on hindsight bias. Restructure to emphasize contingency, context, and the reasons *within the past* for the outcome. **Action: Rewrite.**

  ---

  **Your Distinctions:**
  *   **Martyr Frame = Junk (It's Toxic Whig):** Correct. It's Whig + victim narrative, implying present virtue via identification with the "right" past martyr.
  *   **"They Almost Got It" = Junk (Core Whig):** Correct. It judges the past solely by the standard of present knowledge, ignoring their actual goals and frameworks.
  *   **Myth-Busting Smugness = Real Risk:** Correct. It often flips the Whig script: instead of "dumb past led to smart us," it's "dumb myth *about* dumb past makes *us* feel smart for knowing better." The *focus* matters.
  *   **Timeline as Inherently Whiggish = Real:** Correct. Milestones imply progression. Mitigation is key.
  *   **Progress for Some/Loss for Others = Critical Real Distinction:** Essential. Whig history often ignores the losers.

  **Your Swap Test:** **It's Excellent (Keep It!).** It directly targets teleology (history having a destined path). Combine it with Step 5 above. The better you pass the swap test, the less Whiggish the panel.

  **Applying the AWLT to Your Examples:**

  1.  **Semmelweis (1840s Vienna) - Current Draft (Martyr Frame):**
      *   **Step 1 (Core Narrative):** Likely YES (focus on ignored genius, tragic end vs. "stupid" contemporaries).
      *   **Step 2 (Martyr/Almost):** Definitely YES (Martyr frame).
      *   **Action:** REWRITE NEEDED.
      *   **What it Should Say (90 Words):** "In the 1840s, Dr. Ignaz Semmelweis observed high death rates in one Vienna maternity ward. He linked it to doctors moving from autopsies to deliveries and insisted they wash hands in chlorinated lime. Deaths plummeted. However, his explanation conflicted with dominant medical theories about disease. He couldn't provide a scientifically acceptable mechanism (germ theory didn't exist yet). Facing strong institutional resistance and his own difficult personality, his ideas were rejected. Semmelweis suffered a breakdown and died in an asylum. His insight was vindicated decades later with the acceptance of germ theory." *Focuses on observation, action, context of rejection (theory gap, personality), consequence, and later vindication without "stupid opponents" or inevitable destiny.*

  2.  **The 12-Foot Timeline:**
      *   **Should it exist?** Probably Yes. Timelines orient people. Don't abandon it; **mitigate**.
      *   **Non-Whig in Short Chunks:**
          *   **Title:** "Selected Events & Contexts in Medical History" (Avoid "Progress," "Advancement," "March").
          *   **Mix Event Types:** Include key ideas, dead ends, social changes, major epidemics *alongside* "inventions" and "discoveries." E.g., "c. 1500: Paracelsus challenges Galen; promotes alchemy & observation" / "1840s: Semmelweis advocates handwashing; rejected by peers" / "1918-19: Global Influenza Pandemic kills millions" / "1950s: Thalidomide prescribed for morning sickness; withdrawn after causing birth defects."
          *   **"Meanwhile" Notes:** Sprinkle brief contextual notes: "c. 1800: Germ theory not yet accepted" next to early hygiene mentions. "c. 1930s: Surgical consent practices vary widely."
          *   **Thematic Grouping (If possible):** Instead of purely linear, group in sections (e.g., "Understanding the Body," "Hospitals & Institutions," "Tools & Treatments," "Epidemics & Public Health"). This implies parallel developments, not a single march.
          *   **Intro Panel:** Explicitly state: "This timeline shows selected moments. Medicine rarely moves in straight lines; ideas compete, contexts shift, and consequences are often mixed."
      *   **AWLT Application:** Apply Steps 1 & 5 to each entry. Does an entry *imply* inevitable progress? Can it be phrased more neutrally? Does the overall mix imply multiple threads? **Action:** Mitigate Whiggishness through diversity of entries and framing.

  3.  **The Flat-Earth Myth-Busting Panel:**
      *   **Step 3 (Smugness Check):** **YES, IT'S PROBABLY SMUG** in the way you fear. The standard "People in the Middle Ages weren't stupid flat-earthers!" *often* functions to make the *modern* audience feel superior to the *modern* purveyors of the myth (or by extension, to a stereotyped "Dark Ages" past). The focus becomes "We know they weren't dumb" rather than "Here's what they actually knew about cosmology."
      *   **AWLT Action:** REWRITE NEEDED.
      *   **What to Do:** **Reframe as "Medieval Cosmology" or "What Was Known."**
          *   **Old (Smug):** "Contrary to popular belief, medieval scholars knew the Earth was round! Ancient Greeks proved it, and sailors saw evidence daily. The flat-earth myth is a later invention. We now understand their knowledge was sophisticated for its time."
          *   **Better (Accurate & Less Smug):** "Medieval scholars widely accepted the Earth as a sphere, based on ancient Greek learning and observation. Their cosmology placed Earth at the center of the universe, surrounded by concentric celestial spheres. The 'flat-earth' idea is a misconception about this period; their understanding was complex within their philosophical and religious framework." *Focuses on what they believed, the structure of their knowledge, and locates the myth as a later issue. "We now understand" becomes passive.*

  4.  **The Local Surgeon (1930s, Pioneered Technique, Non-Consensual Operations):**
      *   **AWLT Flag:** This triggers **Step 4 (Cost-Benefit) - VALUES CALL / ESCALATE**.
      *   **Why:** Omitting the non-consensual operations presents a seriously misleading, sanitized view of this "pioneer" and the ethical context of the time. Including it is essential for basic historical accuracy and ethical responsibility. However, explaining it fairly within 90 words is extremely difficult and ethically charged.
      *   **Action:** **ESCALATE IMMEDIATELY.** Flag to Director/Board: "Panel on [Surgeon Name] sanitizes history by omitting documented non-consensual operations. Including this ethically complex aspect is essential for accuracy but challenging within word limit. Requires policy decision on handling historical figures with significant ethical violations." **Do not finalize this panel without explicit guidance.** Options might include: a very stark phrase ("...pioneered X, though his methods, including non-consensual surgery, are now condemned."), a separate small panel on "Ethical Controversies in Medical History" mentioning him, or potentially deciding not to feature him prominently if the ethical issue overshadows the technical achievement in a public exhibit context.

  **Key Takeaways for Your Workflow:**

  1.  **AWLT is Your First Line of Defense:** Run it quickly per panel. Most issues will be caught in Steps 1-3 requiring rewrites *you* can do.
  2.  **Escalate Clearly:** When Step 4 flags a values call or Step 5 reveals a deep just-so story you can't easily fix, escalate *early* with a specific problem statement (e.g., "Sanitizes X," "Overly Whiggish framing of Y," "Ethical complexity of Z").
  3.  **Martyrs are Red Flags:** Rewrite instantly.
  4.  **Myth-Busting Needs Care:** Focus on the *past reality*, not the *modern correction*.
  5.  **Timelines are Salvageable:** Mitigate with diverse entries and framing.
  6.  **Swap Test is Gold:** Use it to kill teleology.
  7.  **Embrace "Good Enough":** For complex issues, find the *most concise* accurate phrasing. Sometimes "controversial methods" is better than 40 words of nuance that no 10-year-old will grasp. But *never* completely omit a crucial, ethically significant negative.

  This procedure gives you concrete actions ("Rewrite," "Escalate," "Proceed") based on specific, answerable questions. It operationalizes Butterfield's critique into a tool you can wield in 15-minute bursts against the ever-present Whig tendency. Good luck!
