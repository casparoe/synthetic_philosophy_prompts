  The user is asking if there's a term for this specific boundary where genetic differences before conception break identity but immediately after don't. They're also questioning whether this sneaks in a form of zygote essentialism that conflicts with how we normally think about personal identity persisting through change. They've proposed "conception-lock bias" as a possible term and want to know how to distinguish it from plain origin essentialism.

