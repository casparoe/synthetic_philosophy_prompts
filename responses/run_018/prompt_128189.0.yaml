prompt: |-
  hey so im not an academic or anything, just run tech for a small housing nonprofit and lately weve been using an ai bot to scan tenant messages for keywords like crisis or unsafe conditions. i keep coming back to that symbol grounding idea i read about - that a computer can just shuffle words around without ever knowing what they actually point to in the real world. i want to turn this into a real audit procedure my coworker maria can run every time the bot picks up a new category. shes not technical, she gets about 15 minutes per check, and if she cant sign off she has to bump it to me.

  i came up with this idea im calling causal tethering - a word in the bot is only grounded if theres a direct chain back to something measurable or witnessable outside the text, like a sensor, a photo, or a verified expert. if the chain breaks and its just other words defining the word, then its floating.

  can you write her a step by step checklist: the questions in order, what counts as a pass, where it stops with a hard no, and where she has to make a call thats about values not facts. then apply it to two categories we actually deal with: mold infestation, where tenants usually send photos, and emotional abuse, where its just descriptions in chat. include one case where the audit says the bot shouldnt use the word but wed probably still want it flagged anyway, and be honest about what the whole thing cant catch. keep it casual and practical - this is for real people signing off on real decisions.
reasoning: |-
  We are creating a practical checklist for Maria to audit new categories that the AI bot picks up. The goal is to ensure that keywords used by the bot are "causally tethered" to real-world evidence. The checklist will have steps, pass/fail criteria, and notes on when to stop or escalate.

  The concept of causal tethering: a word is grounded if there's a direct chain of evidence back to something measurable or witnessable (sensor, photo, verified expert). If the chain breaks and relies only on other words, it's floating.

  Checklist Structure:
  1. Questions in order.
  2. What counts as a pass?
  3. Where it stops with a hard no?
  4. Where she has to make a call based on values (not just facts)?

  Two categories: 
    A. Mold Infestation (usually with photos)
    B. Emotional Abuse (descriptions in chat)

  Also, include one case where the bot shouldn't use the word (according to the audit) but we'd still want it flagged anyway.

  Be honest about limitations.

  Let's design the checklist step by step.

  ---

  **Causal Tethering Audit Checklist for Tenant Message Keywords**

  *Purpose*: To verify that a keyword or category the AI bot flags is causally tethered to real-world evidence. This means we can trace the word back to something measurable (like a sensor reading, a photo, or a verified expert's observation) and not just other words.

  *Instructions for Maria*:
  - Spend no more than 15 minutes per check.
  - If at any step you find a hard no or are unsure, stop and bump it to tech.
  - If you can answer all the questions with a clear pass, sign off.

  ---

  **Step-by-Step Questions**:

  1. **What is the keyword or category the bot is flagging?** 
     - *Example*: "mold infestation" or "emotional abuse".
     - *Action*: Write it down clearly.

  2. **What is the typical source of this word in tenant messages?**
     - *Check*: Is the word coming from the tenant's own message? (e.g., the tenant says "mold" or "abuse")
     - *Pass*: Yes, it's directly from the tenant.
     - *Hard Stop*: No, the bot is generating the word from its own analysis without the tenant using it. (This is a hard no because the bot shouldn't be adding words that weren't in the message.)
     - *Note*: If the tenant uses a synonym (like "black stuff" for mold) that the bot maps to a category, that's okay as long as we can check the tethering for the category.

  3. **Can we trace this word back to non-text evidence?**
     - *Check*: Look for any non-text evidence that would directly support the word. This includes:
          - Photos or videos (e.g., tenant sent a photo of mold)
          - Sensor data (e.g., humidity sensor in the unit showing high levels)
          - Verified expert reports (e.g., a mold inspector's report, a social worker's note about abuse)
          - Firsthand witness account (e.g., a staff member visited and saw the mold, or a neighbor witnessed an abusive incident and reported it separately)
     - *Pass*: We have at least one type of non-text evidence that is typically associated with the word in our records.
     - *Hard Stop*: There is never any non-text evidence for this word in our system (e.g., for emotional abuse, we only have text descriptions and no outside verification). But note: we might still want to flag it (see step 5).
     - *If unsure*: If sometimes we have evidence and sometimes not, note that and proceed to step 4.

  4. **Is the evidence chain direct?**
     - *Check*: Does the evidence directly show the thing the word describes? Or is it indirect?
          - Direct: A photo of mold in the apartment, a police report about domestic disturbance.
          - Indirect: The tenant says "I feel unsafe" without describing why, or the bot infers abuse from patterns of messages without any external evidence.
     - *Pass*: The evidence is direct and clearly shows the condition described by the word.
     - *Hard Stop*: The evidence is always indirect (e.g., the word is inferred from other words and there's no direct link to a measurable event). This means the word is floating.
     - *Value Call*: If the evidence is sometimes direct and sometimes indirect, you have to decide if the indirect cases are strong enough. This is a judgment call. For example, in emotional abuse, if we have a pattern of messages that a social worker would consider abusive, but no external report, is that acceptable? (Note: This is where we might still flag for human review even if not fully tethered.)

  5. **If we can't tether it, should we still flag it?**
     - *Check*: Even if the word isn't causally tethered (hard stop in step 3 or 4), is it still important for us to know about? This is a value call, not about facts. Consider:
          - Could ignoring this word put a tenant in danger?
          - Is it a legal requirement that we act on this word?
          - Would our organization's mission make us want to know about this even without hard evidence?
     - *Pass*: If the answer is yes, then we still want the bot to flag it, but we note that it's not tethered and we'll handle it with human review. (This is not a pass for tethering, but we still use the flag.)
     - *Note*: This step is only reached if steps 3 or 4 failed. If we pass step 4, we don't need this step.

  6. **Limitations note**:
     - This audit can't catch everything. It only checks if the word is grounded in our current evidence. It doesn't guarantee that the evidence is always available or that the bot will always interpret it correctly.

  ---

  **Apply to Categories**:

  **Category 1: Mold Infestation**

  1. **Keyword**: "mold infestation" (or similar like "mold", "black mold", etc.)
  2. **Source**: Tenant messages often include the word "mold" or describe it (e.g., "black stuff on walls"). Pass.
  3. **Non-text evidence**: Tenants usually send photos of the mold. We also sometimes have maintenance reports with photos. Pass.
  4. **Direct evidence**: The photo is direct evidence of mold. Pass.
     - *Audit Result*: **Pass** - Tethered. Maria can sign off.

  **Category 2: Emotional Abuse**

  1. **Keyword**: "emotional abuse"
  2. **Source**: Tenant messages might directly say "I'm being abused" or describe behaviors (e.g., "my partner constantly belittles me"). Pass.
  3. **Non-text evidence**: Typically, we only have the tenant's text. We don't have photos, sensors, or verified expert reports (unless the tenant has provided a police report or we have a social worker involved). 
     - *Result*: Hard Stop - No non-text evidence in typical cases. Proceed to step 5.
  4. (Skipped because step 3 failed)
  5. **Should we still flag?**: Yes, because emotional abuse is a serious issue and we don't want to ignore a tenant in distress. Even without tethering, we want the bot to flag it for human review (like Maria or a case manager). 
     - *Audit Result*: **Not Tethered, but Flag Anyway** - Maria notes that this category isn't tethered but we still flag it. She signs off for use with the understanding that it will always be reviewed by a human.

  ---

  **Example of a Hard No (but we might still flag)**:

  Let's create a hypothetical category: **"Imminent Eviction"**

  1. **Keyword**: "imminent eviction"
  2. **Source**: The tenant says "I'm about to be evicted". Pass.
  3. **Non-text evidence**: We only have the tenant's message. We don't have a court order or a notice from the sheriff. 
     - *Result*: Hard Stop - no non-text evidence.
  4. (Skipped)
  5. **Should we still flag?**: Yes, because eviction is a critical event and we want to help. We'll flag it for human review to verify.

  But note: According to the causal tethering audit, the word "imminent eviction" is not tethered because we can't measure it without official documents. But we still flag it because it's important.

  ---

  **What the Whole Thing Can't Catch**:
  - Situations where evidence exists but isn't in our system (e.g., a tenant didn't send a photo, but the mold is real).
  - Words that are tethered in theory but the evidence is of poor quality (e.g., a blurry photo that might not show mold).
  - The bot might over-rely on a tethered word and miss context (e.g., a photo of mold from last year, but the tenant is talking about a new issue).
  - Words that are tethered to indirect evidence (like a pattern of messages) but we decide to accept them on values grounds (like emotional abuse) are not fully grounded by this method.

  ---

  **Final Checklist Format for Maria**:

  # Causal Tethering Audit Checklist

  **Keyword/Category**: [Fill in]  
  **Date**:  
  **Auditor**: Maria  

  ## Steps:
  1. **Source Check**: 
     - Is the word coming directly from tenant messages? 
     - ✅ Pass (Yes) / ❌ Hard Stop (No) - If Hard Stop, bump to tech.

  2. **Evidence Check**: 
     - Is there non-text evidence (photo, sensor, expert report) typically available for this word? 
     - ✅ Pass (Yes) / ❌ Hard Stop (No) - If Hard Stop, go to step 4.

  3. **Directness Check**: 
     - Does the evidence directly show the thing the word describes? 
     - ✅ Pass (Yes) / ❌ Hard Stop (No, it's indirect) - If Hard Stop, go to step 4.

  4. **Value Call (if failed step 2 or 3)**: 
     - Even without tethering, is it critical to flag this word? 
     - ✅ Flag Anyway (Yes) / ❌ Do Not Flag (No) - If unsure, bump to tech.

  **Audit Result**:
  - If passed steps 1, 2, and 3: ✅ **Tethered** - Sign off, bot can use with confidence.
  - If passed step 4: ⚠️ **Not Tethered but Flag** - Sign off but note that it requires human review.
  - If any Hard Stop and step 4 is "Do Not Flag": ❌ **Reject Category** - Bump to tech.

  **Limitations Note**: Remember, this doesn't guarantee the bot is always right. We're just checking if the word points to real-world evidence.

  ---

  **Example for Maria to Reference**:

  - **Mold Infestation**: 
    - Step 1: Pass (tenant says "mold")
    - Step 2: Pass (photos usually exist)
    - Step 3: Pass (photo shows mold)
    - Result: Tethered ✅

  - **Emotional Abuse**:
    - Step 1: Pass (tenant describes abuse)
    - Step 2: Hard Stop (no non-text evidence) → Go to step 4
    - Step 4: Flag Anyway (yes, it's critical) → Result: Not Tethered but Flag ⚠️

  This keeps it practical and within 15 minutes. Maria only needs to go through the steps and check boxes.
answer: |-
  Below is a step-by-step **Causal Tethering Audit Checklist** for Maria. It’s designed to be practical, non-technical, and doable in **15 minutes**. I’ll walk you through the questions, pass/fail rules, and where to stop or escalate. Then I’ll apply it to **mold infestation** and **emotional abuse**, including a case where the bot "fails" but we still flag it.  

  ---

  ### **Causal Tethering Audit Checklist**  
  *For Maria: Use this every time the bot adds a new keyword/category.*  
  **Time Budget:** 15 minutes per check. If unsure, bump to tech.  

  #### **Step 1: Is the word based on tenant descriptions ONLY?**  
  - **Question:** "Does the bot rely ONLY on the tenant’s written words (e.g., chat messages) to define this category?"  
  - **Pass:** **NO** (The bot doesn’t treat the tenant’s words as "proof").  
  - **Hard Stop:** **YES** (If the bot uses *only* tenant text to "confirm" the word, it’s **floating** → **Bump to tech**).  
  - **Example:** Tenant says "I feel unsafe." If the bot calls this "unsafe conditions" without external proof → **Stop. Escalate.**  

  #### **Step 2: Is there a tether to real-world evidence?**  
  - **Question:** "Can we trace this word back to **non-text evidence**? (e.g., photo, sensor, expert report, inspection log, or witness statement)."  
  - **Pass:** Evidence exists and is **accessible to us** (e.g., in our files, tenant uploads, or staff reports).  
  - **Hard Stop:** **No evidence exists** (or it’s only other people’s words about the word) → **Reject the category**.  
  - **Value Call:** Evidence is **indirect** (e.g., a therapist’s note about "stress" but not the exact word). Maria decides: "Is this close enough to act?" (If unsure → **Bump to tech**).  

  #### **Step 3: Is the evidence chain SHORT and DIRECT?**  
  - **Question:** "Does the evidence **directly** show the thing the word describes? Or does it require guessing?"  
  - **Pass:** Direct link (e.g., photo → mold; police report → violence).  
  - **Hard Stop:** Requires **2+ hops** (e.g., tenant says "mold" → maintenance writes "maybe mold" → bot flags it. No photo? → **Reject**).  
  - **Value Call:** Evidence is **partial** (e.g., a photo of a wet wall but no visible mold). Maria decides: "Would a reasonable person call this evidence?"  

  #### **Step 4: If it FAILS, is it still urgent?**  
  - **Question:** "Even if this word isn’t grounded, is it **critical to flag**?" (e.g., safety risk, legal risk, or mission-critical).  
  - **Pass:** **YES** → Still flag it, but **tag as "Untethered: Human review needed"**.  
  - **No Action:** **NO** → Disable the bot’s auto-action for this word.  

  #### **Final Sign-Off:**  
  - ✅ **APPROVE** if all steps **PASS** (bot can auto-handle).  
  - ⚠️ **FLAG ANYWAY** if Step 4 passes (bot flags for human review).  
  - ❌ **REJECT** if any **Hard Stop** hit (bot ignores the word).  
  - **Bump to tech** if Maria spends >15 mins or feels unsure.  

  ---

  ### **Applied to Real Categories:**  
  #### **1. Mold Infestation**  
  - **Step 1:** Tenant says "black mold in bathroom." Bot flags "mold infestation."  
    - *Is it based ONLY on words?* → NO (tenant might send a photo). **PASS**.  
  - **Step 2:** Tenant uploaded a photo with timestamp.  
    - *Non-text evidence?* → YES (photo). **PASS**.  
  - **Step 3:** Photo shows mold on walls.  
    - *Direct link?* → YES. **PASS**.  
  - **Result:** ✅ **APPROVED**. Bot can auto-prioritize for maintenance.  

  #### **2. Emotional Abuse**  
  - **Step 1:** Tenant says "partner calls me worthless daily." Bot flags "emotional abuse."  
    - *Only words?* → YES → **HARD STOP** (No physical evidence → go to **Step 4**).  
  - **Step 4:**  
    - *Still urgent?* → **YES** (Risk of harm, aligns with our mission).  
    - *Maria’s Value Call:* "We’d want this flagged to offer support, even without proof."  
  - **Result:** ⚠️ **FLAG ANYWAY**. Bot tags it for **Maria’s review** (no auto-action).  

  ---

  ### **The "Fail But Flag" Case: "Unsafe Conditions"**  
  - **Scenario:** Tenant messages: "My stairs are shaky. I feel unsafe."  
  - **Audit:**  
    - **Step 1:** Based on words ONLY → **HARD STOP** (no photo/sensor).  
    - **Step 4:** *Still urgent?* → **YES** (collapse risk! We’d want it flagged).  
  - **Result:** ⚠️ **FLAG ANYWAY**. Bot alerts Maria to follow up (e.g., request a photo or schedule inspection).  

  ---

  ### **What This Checklist CAN’T Catch (Be Honest):**  
  1. **False Evidence:** A photo of "mold" that’s actually dirt (we assume evidence is real).  
  2. **Urgent but Untethered Risks:** Like a tenant texting "I’m scared he’ll hit me tonight." We’d flag it (per Step 4), but the bot can’t *prove* it.  
  3. **Bias Gaps:** If all evidence comes from one source (e.g., only inspectors we hire), the tether might be biased.  
  4. **Context Loss:** Bot sees "yelling" → flags "abuse." But if tenant adds "lol we were joking," the bot misses it.  

  ---  
  **Final Note for Maria:**  
  > "Your job isn’t to prove the truth—it’s to check if the bot’s *confidence* comes from real-world anchors. If the chain breaks (words → words → words), reject it. If it’s risky but untethered, flag it for humans. When in doubt, bump it to tech. You’re the firewall!"  

  Let me know if you want a printable version or tweaks!
