answer: |-
  Here's the analysis of Swiss/UK crustacean welfare policies through the "welfare leakage" lens, mapping actors, predictions, real-world response, and limitations:

  **Welfare Leakage Framework Applied:**

  1.  **Actors & Predicted Behavior:**
      *   **Farm Operators:** Face higher costs (stunning tech, controlled kill methods, compliance). Predicted to either exit, raise prices significantly, or invest heavily.
      *   **Wild Fishers:** Face lower relative costs (no stunning, existing bycatch-heavy methods). Predicted to increase supply to meet demand shifted from farms, potentially expanding fishing effort.
      *   **Supermarkets:** Seek stable supply and price points. Predicted to substitute regulated farmed product with cheaper, less-regulated wild-caught imports where possible to maintain margins and customer prices.
      *   **Regulators:** Focus on domestic jurisdiction (farms, imports, retail). Predicted to potentially overlook or lack tools to address welfare impacts displaced to foreign wild fisheries (bycatch, killing methods, ecosystem damage).

  2.  **Predicted Outcome:** Increased farmed product prices lead to demand shifting towards cheaper wild-caught products. Total crustacean consumption remains stable, but a *greater proportion* of consumed animals suffer under the significantly worse conditions of wild capture (slow suffocation/crushing, massive bycatch mortality, no stunning). **Net welfare per animal consumed decreases** despite improved welfare for the dwindling number of farmed animals.

  **Real-World Response vs. Prediction:**

  *   **Partial Confirmation:** Your observation aligns with leakage predictions: Farm rule tightening *has* sometimes led to **increased imports of wild-caught shrimp/lobster** (e.g., EU farmed shrimp regulations contributing to surge in tropical wild-caught imports). Supermarkets *do* source cheaper, less-regulated wild products.
  *   **The Inelastic Demand Twist:** The observation that demand is relatively inelastic (people pay more rather than stopping consumption) **modifies, but doesn't break, leakage**.
      *   **Leakage Still Occurs:** Higher farmed prices *still* make wild-caught relatively more attractive to price-sensitive consumers and buyers (supermarkets, restaurants). Some demand *does* shift, increasing the *share* of suffering from wild sources.
      *   **Volume Impact Uncertain:** While total consumption *might* dip slightly due to price increases, leakage theory focuses on the *compositional shift*. Even stable volume with a higher wild-catch percentage means more animals suffering under worse conditions *instead* of (potentially) better ones. The harm shifts location to higher-suffering-per-animal supply chains.
      *   **Shrinking Pie ≠ No Leakage:** A small reduction in overall consumption doesn't negate leakage; it just means leakage occurs *within* the adjusted consumption level. The key is the *shift* towards the higher-suffering source.

  **Where the Theory Goes Silent/Limitations:**

  1.  **Moral Equivalence:** Leakage highlights the *relocation* of suffering, but doesn't adjudicate whether *outsourcing* harm (buying wild-caught) is morally equivalent to *directly causing* it (operating a low-welfare farm). This is a core ethical question your story must address.
  2.  **Baseline Welfare Assumption:** It assumes farmed welfare pre-regulation was *significantly better* than wild capture. This is often true (targeted stunning vs. suffocation/bycatch), but not universally (e.g., some intensive shrimp farms have horrific conditions). Leakage depends on the *differential*.
  3.  **Potential for Positive Spillover:** Could these laws drive innovation in *wild-capture* stunning/killing tech or bycatch reduction to meet future import standards? Leakage theory doesn't predict this, but regulators could act to prevent leakage (e.g., UK extending welfare standards to *imports* alongside domestic sentience recognition).
  4.  **Demand Destruction:** Inelastic demand *slows* leakage but doesn't stop the compositional shift. Significant price hikes *could* eventually reduce volume enough to lower *total* suffering, but leakage theory focuses on the unintended consequence of the policy shift itself, not long-term market evolution. The immediate effect is relocation.
  5.  **Scope of "Welfare":** Leakage focuses narrowly on individual animal suffering during capture/killing. It doesn't weigh against potential benefits like reduced environmental impact of some farms vs. destructive trawling, or the intrinsic value of wild ecosystems disrupted by fishing.

  **Bottom line:** Welfare leakage survives this episode as a *partial and potent* explanatory framework, revealing the relocation of suffering towards higher-intensity sources as a likely consequence of uncoordinated, jurisdiction-limited welfare rules, though the impact is modulated by demand inelasticity.
