  Below is a decision tree addressing the unity of consciousness in split-brain cases, designed to map onto 7 distinct philosophical positions (including unexplored combinations). The tree starts with the split-brain conflict case, then branches through three core questions. Each node is phrased for clarity, and the scoring key maps answer patterns to named positions or diagnoses.

  ---

  ### **Decision Tree: The Unity of Consciousness in Split-Brain Cases**

  **Scenario**: A split-brain patient’s left hand grabs a cup while the right hand pushes it away. The subject later reports only one intentional action. Where does consciousness "come together"?

  #### **Level 1: Interpret the Split-Brain Case**  
  *What best explains the subject’s report?*  
  - **A**: Two parallel conscious streams existed (each hemisphere had its own experience).  
  - **B**: One conscious stream existed; the other was suppressed in real-time.  
  - **C**: One conscious stream existed; the memory was edited after the fact.  

  #### **Level 2: Necessity of a Functional Bottleneck**  
  *Must unified experience rely on a single real-time convergence point (bottleneck)?*  
  - **Y**: Yes—unity requires a functional bottleneck.  
  - **N**: No—unity can be an illusion constructed after the fact.  
    - *If Y, proceed to Level 3. If N, skip to Level 4.*

  #### **Level 3: Nature of the Bottleneck**  
  *If a bottleneck exists, what is its physical basis?*  
  - **a**: Localized to a specific brain region/workspace.  
  - **b**: Distributed network (no single center).  
  - **c**: Abstract logical point (no physical location).  

  #### **Level 4: Conflict Resolution Mechanism**  
  *When streams clash (e.g., hands conflicting), how is resolution achieved?*  
  - **D**: Real-time suppression (one stream overrides the other during experience).  
  - **E**: Parallel coexistence (no resolution; streams remain separate).  
  - **F**: Retrospective stitching (resolution occurs during memory/report formation).  

  ---

  ### **Scoring Key: Map Your Path to a Position**  
  Follow your answer path (e.g., **A → N → E**) to find your position. "*→*" skips Level 3 if answering N at Level 2.  

  | Path (Q0→Q1→[Q2]→Q3) | Position/Diagnosis | Key Notes |  
  |------------------------|---------------------|-----------|  
  | **A → Y → b → E**      | **Global Workspace (Baars/Dehaene)** | Distributed bottleneck; parallel streams coexist with no integration. |  
  | **B → Y → a → D**      | **Lite Cartesian Theater** | Localized bottleneck; real-time suppression. Differs from Global Workspace only on localization (physical vs. distributed). |  
  | **B → Y → b → D**      | *Unexplored* | Distributed bottleneck + real-time suppression: Coherent but rarely defended. |  
  | **B → Y → c → D**      | **Functionalist Central Processing** | Logical bottleneck; real-time competition. |  
  | **B → N → D**          | *Unattractive* | Suppression without a bottleneck: Possible but philosophically unstable. |  
  | **A → N → E**          | **Eliminativism about Unity** | No unity; parallel streams with no resolution. |  
  | **C → N → F**          | **Multiple Drafts (Dennett)** | Unity is illusory; edited retroactively. |  
  | **C → Y → [any] → [any]** | *Incoherent* | Bottleneck implies real-time unity; editing contradicts this. |  
  | **A → Y → a → [any]**  | *Incoherent* | Localized bottleneck cannot support parallel streams (Q0=A). |  
  | **B → [any] → [any] → F** | *Incoherent* | Q0=B implies real-time suppression; F (retrospective) contradicts. |  
  | **A → Y → b/c → D/F**  | *Incoherent* | Bottleneck should prevent parallel streams (Q0=A). |  

