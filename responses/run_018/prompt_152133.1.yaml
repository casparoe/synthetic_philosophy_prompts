  ### **Notes for Clarity**  
  - **Global Workspace vs. Lite Theater**: The tree **cannot separate** these if they only differ on bottleneck localization (physical vs. distributed). Both require a functional bottleneck and real-time suppression (e.g., **B→Y→a/D** vs. **B→Y→b/D**).  
  - **Unexplored/Unattractive**: Labeled paths lack major philosophical advocates but are logically possible.  
  - **Incoherent**: Answers contradict (e.g., affirming parallel streams + localized bottleneck).  
  - **Grad Student Friendly**: Nodes avoid jargon; positions are named only in the scoring key.  

