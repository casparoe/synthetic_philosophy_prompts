answer: |-
  **MEMORANDUM**  
  **TO:** University Board of Trustees  
  **FROM:** Committee for Institutional Safety and Legitimate Coercion  
  **SUBJECT:** Restructuring of Campus Police: Jurisdictional Legitimacy & Recommended Path Forward  
  **DATE:** October 26, 2023  

  ---

  ### **I. RECOMMENDATION**  
  The Committee recommends the **complete abolition of the armed campus police department** and its replacement with a democratically accountable, unarmed Crisis Response and Community Safety Unit (CRU), implemented via a 24-month phased transition. This transition includes a 6-month pilot of the CRU, mandatory quarterly oversight audits, and formalized partnerships with municipal emergency services to mitigate security fragmentation.  

  ---

  ### **II. CONCEPTUAL FRAMEWORK: THE JURISDICTIONAL FINK**  
  The central question before this Committee is whether a *non-sovereign academic institution* can legitimately exercise a *monopoly on coercive violence*—a concept Max Weber reserved for sovereign states. Our analysis identifies a structural contradiction we term the **jurisdictional fink**:  

  1. **Formal Powers vs. Illegitimate Foundation**:  
     Campus police possess state-delegated powers (arrest, detention, armed force) but operate within an institution lacking sovereign authority, democratic mandate, or robust mechanisms to legitimize coercion. The university is a community of scholarship, not a polity.  

  2. **Masked Coercion in Academic Governance**:  
     Academic norms (collegiality, shared governance) systematically obscure the coercive nature of police power. Oversight bodies (e.g., advisory boards) lack authority to sanction misuse, creating a "masked disposition" where coercive capacity exists *without legitimating triggers*.  

  3. **Conceptual Misapplication**:  
     Applying Weber’s framework to campus policing is not merely impractical—it is *categorically incoherent*. Universities cannot "inherit" sovereign legitimacy; they borrow it from the state while evading corresponding accountability. This produces a permanent legitimacy deficit.  

  ---

  ### **III. ENGAGEMENT WITH THE SECURITY-VACUUM OBJECTION**  
  We take seriously the argument that abolition risks fragmenting security responsibility, undermining rapid response and equity. A vacuum could indeed emerge if:  
  - Multiple uncoordinated entities assume security functions.  
  - Marginalized communities bear disproportionate risk during transitions.  
  - Emergent crises (e.g., armed threats) lack clear response protocols.  

  **Our Mitigation Strategy**:  
  - The CRU centralizes *coordination* of all non-coercive safety functions (mental health, conflict mediation, traffic control).  
  - Formal treaties with city police (Section V) guarantee armed response *only* for exigent threats (active violence, felony pursuit), eliminating routine armed patrols.  
  - Equity is prioritized by embedding CRU responders within academic units and student groups, ensuring marginalized voices direct safety protocols.  

  ---

  ### **IV. IMPLEMENTATION TIMELINE**  
  | **Phase**       | **Timeline** | **Key Actions** |  
  |-----------------|--------------|----------------|  
  | **Design & Pilot** | Months 1–6  | - Establish CRU with 20 unarmed responders (social workers, medics, conflict specialists).<br>- Pilot CRU response to non-violent calls (wellness checks, disputes, theft reports).<br>- Draft oversight charter with faculty/student majority. |  
  | **Transition**  | Months 7–18 | - Gradual disarmament of campus police; reassign 80% of officers to municipal roles.<br>- CRU assumes all non-armed services (patrols, event security).<br>- Quarterly audits by Oversight Council (metrics: response times, equity outcomes, use-of-force incidents). |  
  | **Full Deployment** | Months 19–24 | - Campus police department formally dissolved.<br>- CRU at full capacity (40 responders), managing 95% of safety calls.<br>- City police intervene *only* under pre-negotiated thresholds (e.g., imminent bodily harm). |  

  ---

  ### **V. SAFEGUARDS AGAINST FRAGMENTATION**  
  - **Memorandum of Understanding (MoU) with City Police**:  
    - Requires joint training, real-time CRU/police communication, and public reporting on all armed interventions.  
  - **Oversight Council**:  
    - 12-member body (6 faculty/students, 3 administrators, 3 external ethicists) with power to suspend protocols, demand audits, and recommend structural changes.  
  - **Crisis Protocol Stack**:  
    - Tiered response system ensuring CRU handles >90% of incidents; armed response is externally sourced, time-limited, and audited.  

  ---

  ### **VI. CONCLUSION & BOTTOM LINE**  
  The jurisdictional fink renders the campus police conceptually illegitimate: coercive authority without a sovereign foundation cannot be democratically redeemed. Abolition realigns the university with its mission by replacing coercion with community-centered care. The phased CRU model neutralizes the security vacuum through centralized coordination, rigorous oversight, and sovereign partnerships.  

  **We urge the Trustees to vote to:**  
  **(A) Abolish the campus police department,**  
  **(B) Fund the Crisis Response Unit transition,**  
  **(C) Adopt the Oversight Council charter.**  

  ---  
  *Approved by unanimous consent, Committee for Institutional Safety and Legitimate Coercion.*
