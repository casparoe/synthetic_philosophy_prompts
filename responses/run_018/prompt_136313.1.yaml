  We are to translate three varieties of free will into the vocabulary of mechanism design and institutional economics. The three varieties are:

  1. **Compatibilist source freedom**: The agent's actions are determined by their own internal states (desires, beliefs, etc.) and not by external coercion or manipulation. This is compatible with determinism.

  2. **Libertarian alternative-possibilities freedom**: The agent must have been able to do otherwise (in a strong, indeterministic sense) to be morally responsible.

  3. **Frankfurt-style hierarchical identification model**: The agent acts freely when their action is guided by their higher-order volitions (i.e., desires about which desires to act on) and they identify with those higher-order volitions.

  We are to restate these in terms of:
  - Agents as nodes in an incentive system
  - Choices as responses to mechanism rules
  - Freedom as a property of the mechanism-agent interface
  - Moral responsibility as auditability or loop closure

  We are to map:
  - Philosophical claims onto incentive-compatibility conditions
  - Onto distinctions between predicted and unpredicted paths
  - Onto audit trails
  - Onto hierarchical feedback structures

  Then, we must provide a residue report for each, noting what translates cleanly, what distorts, and what has no counterpart. For each residue, we must say if the gap is in the framework (so mechanism design is missing a concept) or in the philosophical claim (so it's less substantive).

  Finally, we give a verdict.

  ---

  ### Step 1: Restating the varieties in the given vocabulary

  #### 1. Compatibilist source freedom
  In mechanism design terms:
  - **Translation**: The agent's choice is a function of their internal state (preferences, information) and the incentive rules, without being overridden by external constraints that are not part of the mechanism's normal operation (like coercion). The mechanism is designed so that the agent's response is incentive-compatible: it is the best response given their private information and the rules. The agent's path (action) is generated by the mechanism and the agent's type (private state) in a way that is consistent with the mechanism's design. 
  - **Moral responsibility as auditability**: The agent is auditable (responsible) if the action can be traced back to their internal state and the mechanism's rules, and the action is what was expected (predicted) by the mechanism given that state. There is no requirement for the agent to have been able to choose differently; what matters is that the action originated from the agent's own state and the mechanism's rules.

  Restatement: 
  - **Freedom**: The mechanism-agent interface allows the agent's internal state to be the primary determinant of the action, without external forces that bypass or override the agent's response function. The agent's choice is incentive-compatible and reflects their true type.
  - **Responsibility**: The agent is responsible if the audit trail shows that the action was the predicted outcome of the mechanism given the agent's type and the rules, and there were no rule violations or external manipulations.

  #### 2. Libertarian alternative-possibilities freedom
  In mechanism design terms:
  - **Translation**: For an agent to be responsible, the mechanism must have been such that, at the moment of choice, the agent had at least two paths available (i.e., two actions that were feasible and incentive-compatible) and the actual path taken was not the only possible one. The mechanism must allow for genuine contingency: the agent's choice must not have been determined by the prior state and the rules. This would require that the mechanism has some built-in randomness (like a randomizing device) or that the agent's response function is not deterministic. However, note that in standard mechanism design, we usually model agents as having deterministic response functions (given their type) and the environment may have randomness, but the agent's choice is determined by their type and the rules.

  Restatement:
  - **Freedom**: The mechanism-agent interface must be such that at the time of decision, multiple actions are feasible and incentive-compatible (i.e., the agent could have chosen differently without violating incentive-compatibility). Moreover, the actual path taken must not have been the only one that could have been predicted given the initial conditions (so the prediction must have allowed for multiple outcomes). This requires that the mechanism design includes some element of unpredictability (like a random input) that breaks determinism.
  - **Responsibility**: The agent is responsible only if the audit trail shows that at the moment of choice, the agent had at least two incentive-compatible actions available and chose one. The audit trail must also show that the mechanism did not force a single path.

  But note: standard mechanism design does not require indeterminism. We can model agents as having multiple best responses (so they can choose among them) but then we often assume they choose one arbitrarily. However, the libertarian view requires that the choice is not determined. So we might map this to an environment where the agent's choice is not a deterministic function of their type and the rules? That would be unusual in mechanism design.

  #### 3. Frankfurt-style hierarchical identification model
  In mechanism design terms:
  - **Translation**: We model the agent as having a hierarchical feedback structure. The agent's first-order response function (which maps the mechanism's rules and the current state to an action) is itself subject to a higher-order feedback loop. The agent can reflect on and adjust their response function. Freedom exists when the action is generated by a first-order response function that the agent endorses (via a higher-order feedback process). 

  Restatement:
  - **Freedom**: The mechanism-agent interface includes a meta-mechanism (a feedback loop) that allows the agent to adjust their own response function. The agent is free when the action they take is the output of a response function that has been approved by the higher-level feedback process (i.e., the agent identifies with that response function). 
  - **Responsibility**: The agent is responsible if the audit trail shows that the action was produced by a response function that the agent's higher-level process had endorsed and that there was no overriding of this hierarchical structure.

  ### Step 2: Residue Report

  For each variety, we note:

  **1. Compatibilist source freedom**
  - **Clean translation**: 
    - The idea that the agent's action is determined by their internal state (type) and the mechanism rules maps directly to the standard model of incentive compatibility. 
    - The absence of external coercion maps to the absence of constraints that force the agent to take an action that is not in their best response set.
