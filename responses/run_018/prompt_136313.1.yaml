  2. The libertarian view introduces an indeterminism requirement that cannot be captured in the model and is not needed for designing mechanisms. It would complicate the design without practical benefit.
  3. The Frankfurt view might suggest extending the mechanism to include meta-preferences, but that is currently not standard and may not be necessary for the dispute.

