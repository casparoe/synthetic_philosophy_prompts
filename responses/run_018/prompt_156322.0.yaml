  ### **Taxonomy of Narrative Gravity Theories**  
  *(Start at the root, answer questions downward)*  

  #### **1. SINGULARITY: Does narrative gravity require ONE center per subject?**  
     - **YES** → Go to **2. AUTHORSHIP**  
     - **NO** → Go to **POLYCENTRIC CLUSTERS** (e.g., split-brain, hive minds)  

  #### **2. AUTHORSHIP: Must the center be SELF-AUTHORED?**  
     - **YES** → Go to **3. CONTINUITY**  
     - **NO** → **EXTERNALLY NARRATED CENTER** (e.g., biographies, AI profiles)  

  #### **3. CONTINUITY: Can the center collapse & re-form ("narrative black holes")?**  
     - **NO** → **CONTINUOUS SINGLE CENTER** → Go to **4. ONTOLOGY**  
     - **YES** → **EPISODIC CENTER** (e.g., transient narrative nodes)  

  #### **4. ONTOLOGY: What is the center's status?**  
     - **Useful fiction** → **DENNETT-STYLE**  
     - **Emergent real property** → **EMERGENT REALIST**  
     - **Harmful illusion** → **ILLUSIONIST DISSOLUTION**  

  ---

  ### **LEAF POSITIONS**  
  *(With awkward commitments & grouping notes)*  

  1. **DENNETT-STYLE**  
     - *Path:* Singular (YES) → Self-authored (YES) → Continuous (NO) → Useful fiction  
     - **Awkward Commitment:** Defends the *necessity* of fiction for agency, but struggles to explain why it *feels* ontologically weighty.  

  2. **EPISODIC (STRAWSON-ESQUE)**  
     - *Path:* Singular (YES) → Self-authored (YES) → Continuous (YES, gaps allowed)  
     - **Awkward Commitment:** Denies long-term self-continuity, making enduring responsibility/promise-keeping paradoxical.  

  3. **BUDDHIST-STYLE ANATTA (NO GRAVITY)**  
     - *Path:* *Rejects all branches* — no narrative center exists (not even episodic).  
     - **Awkward Commitment:** Must explain the universal *illusion* of selfhood without positing any underlying gravitational structure.  

  4. **BORROWED-CENTER AI**  
     - *Path:* Singular (YES) → Externally narrated (NO)  
     - **Awkward Commitment:** A center can function *without* subjective experience, risking "empty gravity" (e.g., an AI "self" that’s purely projected by users).  

  5. **POLYCENTRIC HIVE SELF**  
     - *Path:* Polycentric clusters (NO to singularity)  
