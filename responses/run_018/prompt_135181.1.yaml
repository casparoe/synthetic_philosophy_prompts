answer: |-
  **MINISTRY OF ONTOLOGICAL AFFAIRS**  
  **HANDBOOK FOR CITIZENS: STANCE REGISTRATION & COMPLIANCE**  
  **(Revision 7.3.5b)**

  **1. Purpose & Scope**  
  1.1. This handbook establishes the legal framework for the categorization, registration, and application of Ontological Stances within the jurisdiction of the Ministry of Ontological Affairs (MOA).  
  1.2. All citizens, legal entities, and designated biological systems (see Schedule 3, Appendix Gamma) must maintain current Stance Registration with the MOA Central Ontological Registry (COR).  
  1.3. Failure to comply constitutes an Ontological Misdemeanor (Tier 1) or Felony (Tier 2), as per the Ontological Compliance Act (OCA), §12.

  **2. Definitions: Core Concepts**  
  2.1. **Real Pattern:** A descriptive schema exhibiting:  
  &nbsp;&nbsp;&nbsp;&nbsp;2.1.1. **Data Compression:** The pattern reliably summarizes a set of data points or observations with greater efficiency than listing the individual components.  
  &nbsp;&nbsp;&nbsp;&nbsp;2.1.2. **Counterfactual Projectibility:** The pattern supports robust predictions about how the described system *would* behave under conditions differing from actual observation.  
  &nbsp;&nbsp;&nbsp;&nbsp;2.1.3. Patterns failing 2.1.1 or 2.1.2 under standardized Ministry testing protocols (MOA-TP/001-007) are classified as **Mere Appearance (MA)** and lack protected status. MA entities are exempt from stance registration but may be subject to Appearance Permits (Form MOA-AP/01).

  2.2. **Ontological Stances:** Legally recognized predictive strategies. Registration dictates permissible explanatory frameworks for interacting with registered entities.  
  &nbsp;&nbsp;&nbsp;&nbsp;2.2.1. **Physical Stance (PS):** Predictive strategy based solely on the physical constitution (fundamental particles, forces, laws) and current physical state of a system. Mandatory for subatomic particles, fundamental forces, and inanimate matter below the complexity threshold defined in OCA, §4.2a.  
  &nbsp;&nbsp;&nbsp;&nbsp;2.2.2. **Design Stance (DS):** Predictive strategy attributing function and purpose based on either:  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;2.2.2.1. Evolutionary History (e.g., biological organs: hearts, kidneys).  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;2.2.2.2. Engineering Specification (e.g., manufactured artifacts: toasters, microprocessors).  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;2.2.2.3. Reliability requires the system behaves *as if* designed for a specific function, regardless of actual design origin.  
  &nbsp;&nbsp;&nbsp;&nbsp;2.2.3. **Intentional Stance (IS):** Predictive strategy attributing beliefs, desires, and rationality to a system. Registration requires demonstrated superior predictive efficiency over DS or PS for the system's behavioral range. Primarily applied to:  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;2.2.3.1. Adult *Homo sapiens* citizens (Mandatory IS Registration).  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;2.2.3.2. Specified Non-Human Entities (Requires IS License – see Section 5).  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;2.2.3.3. *Note:* Attribution under IS does NOT confer legal personhood unless explicitly granted under separate statute (Personhood Act, §8).

  **3. Registration Requirements & Procedures**  
  3.1. **Initial Registration:** Must be completed within 30 days of an entity achieving recognition as a Real Pattern (e.g., birth, manufacture, import, or evolutionary emergence meeting complexity thresholds). Use Form MOA-SR/01.  
  3.2. **Annual Renewal:** Stance Registration lapses annually. Renewal requires:  
  &nbsp;&nbsp;&nbsp;&nbsp;3.2.1. Submission of Form MOA-SR/Renew.  
  &nbsp;&nbsp;&nbsp;&nbsp;3.2.2. Evidence of sustained predictive utility for the registered stance over the preceding year (e.g., logbooks of successful predictions, witness affidavits – Form MOA-WA/44).  
  3.3. **Stance Redundancy Tax (SRT):** Levied when a citizen employs a lower-level stance (PS or DS) to explain a phenomenon already efficiently predictable under a higher-level stance (DS or IS) registered to that entity.  
  &nbsp;&nbsp;&nbsp;&nbsp;3.3.1. *Example:* Using PS (e.g., tracing electron flows) to diagnose a laptop failure when DS (e.g., identifying a faulty capacitor based on function) provides sufficient, more efficient prediction. Tax rate: 15% of the entity's assessed ontological value.  
  3.4. **Ontological Double-Bookkeeping (ODB):** Prohibited. An entity may only be registered under one primary stance per context unless:  
  &nbsp;&nbsp;&nbsp;&nbsp;3.4.1. The citizen demonstrates *independent predictive utility* for each stance in non-overlapping behavioral domains.  
  &nbsp;&nbsp;&nbsp;&nbsp;3.4.2. *Example:* A domestic dog may be registered under DS for physiological functions (e.g., predicting digestion) *and* under IS for complex social behavior (e.g., predicting response to training commands), provided utility is shown separately for each domain. Dual registration incurs an annual ODB Surcharge.

  **4. Compliance & Enforcement**  
  4.1. **Failed-Prediction Revocation (FPR):** If a registered stance consistently yields failed predictions (≥ 30% failure rate over 50 trials, or as determined by MOA Auditor) for the entity it is applied to, the citizen's *registration* for that entity-stance pair is suspended for 12 months.  
  &nbsp;&nbsp;&nbsp;&nbsp;4.1.1. *Crucially:* Revocation pertains solely to the citizen's *license to predict* using that stance for that entity. It does NOT imply a revision of the entity's intrinsic nature. The citizen must adopt the next most efficient stance during suspension.  
  4.2. **Intentional Stance Licensing (Non-Humans):** Adoption of IS towards any non-human entity (e.g., animal, complex AI system) requires:  
  &nbsp;&nbsp;&nbsp;&nbsp;4.2.1. Successful completion of the MOA IS Licensing Exam (Modules A-D: Behavioral Complexity Assessment, Rationality Attribution Thresholds, Counterfactual Projection Testing, DS/IS Efficiency Comparison).  
  &nbsp;&nbsp;&nbsp;&nbsp;4.2.2. Annual re-certification demonstrating sustained predictive success justifying IS over DS.  
  4.3. **Improper Stance Application:** Application of an unregistered or suspended stance to a registered entity is a Tier 1 Misdemeanor. Persistent violation may lead to Tier 2 Felony charges (Cognitive Re-alignment Mandate).

  **5. Affidavits & Common Queries**  
  5.1. **Extract from Citizen Affidavit (MOA-WA/44-78901):** *"Whilst acknowledging the technical permissibility under PS registration, I must formally protest the application of the Physical Stance by my spouse, Citizen ID# 45-678-2B, during marital disputes (specifically, citing neurotransmitter imbalances and musculoskeletal reflexes as the primary explanatory framework for my expressed dissatisfaction). This persistent application, though achieving a baseline predictive success rate of 62% for conflict escalation, triggers mandatory bi-weekly Social Re-education Seminars (Course SR-7: 'Recalibrating Interpersonal Predictive Frameworks') which impose undue hardship. I petition for an IS-Only Interaction Order under OCA §15.3."*  
  5.2. **Footnote 12.3 (Clarification on Thermostats):** *Domestic thermostats remain categorically ineligible for IS registration (IS-License Application DENIED, Ref: COR/IS-App/TH-004567). Predictive success for thermal regulation behavior is optimally achieved via DS, referencing design specifications and functional norms. Attributing 'beliefs' about room temperature or 'desires' for energy efficiency fails counterfactual projectibility tests (e.g., thermostat behavior remains unchanged by verbal persuasion or deception about ambient temperature). DS remains the legally mandated stance.*

  **6. Appeals & Reclassification**  
  6.1. Stance classification or revocation decisions may be appealed to the Ontological Review Tribunal (ORT) within 60 days.  
  6.2. Entities may petition for reclassification upon demonstrating a sustained shift in predictive landscape (e.g., an AI system evolving beyond its initial DS parameters may petition for IS evaluation).  
  6.3. Downgrading to Mere Appearance status requires proof of persistent predictive failure across *all* stances.

  The predictive strategy you adopt defines your legal reality. Register accurately. Predict efficiently. Comply fully.

  Predictive utility has been hereby classified as a taxable property of the mind.
