answer: |-
  **Bottom line: Jules shelved the documentary because Clara Voss’s own words convinced her that authenticity sometimes means silence.**

  Jules found Clara Voss’s letters in a dusty university archive box labeled "Misc. Correspondence." Not the groundbreaking equations, but personal notes: scribbled frustrations, grocery lists beside flashes of insight, a raw account of a brilliant mind navigating a mundane, demanding life. Jules envisioned her documentary: the overlooked female genius, her potential tragically dimmed by obscurity and societal barriers. It was a compelling narrative.

  Then, tucked between pages filled with complex diagrams, she found it. On fragile paper, dated shortly before Clara’s death: *"To whoever digs this up: Please. Do not make me a tragic figure. Not because it’s untrue (life is hard), but because the ‘tragic genius’ is a theft. It swaps my real, mediocre, magnificent, contradictory life for a sellable archetype. Let me be messy. Or let me be forgotten. Either is truer than the polished ghost."*

  Jules stared at the words, "sellable archetype" burning. Her planned structure – the poignant rise and fall – suddenly felt like violence. Clara wasn’t objecting to facts, but to the *story* itself, the reduction. It demanded a counter-narrative Jules couldn't craft without violating its spirit. Could she make compelling drama from Clara’s messy whole without simplifying? The market craved the tragic arc.

  Her hand hovered over the scan button for the breakthrough letter. Then, she carefully placed all the papers back in the box. The drama died instantly. The funding would vanish. But Clara’s plea wasn't about respectability; it was a demand for the integrity of her lived chaos. Jules closed the box. The film wouldn't be made. Sometimes, honoring the dead meant honoring the silence they demanded. Jules left the archive, carrying the weight of Clara’s messy truth, and the quiet courage of letting it rest.
