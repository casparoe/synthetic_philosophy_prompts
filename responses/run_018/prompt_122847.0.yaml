answer: |-
  ### Debate Suitability Decision Procedure

  Below is a step-by-step procedure for evaluating debate suitability. It prioritizes practical checks over theory, handles edge cases explicitly, and flags when human judgment is required. The procedure is designed to run in 30–45 minutes per request.

  ---

  #### **Step 1: Claim Decomposability**  
  **Question**: Can the claim be decomposed into **discrete, falsifiable sub-claims** that fit within the debate format?  
  - **Check**:  
    - Each sub-claim must be testable via a single piece of evidence (e.g., "Section 4.2 requires landlord consent" vs. "the lease is compliant").  
    - If the claim is a conjunction of >5 critical sub-claims (e.g., 40 clinical codes), stop—debate can’t cover all without cherry-picking.  
  - **Decision**:  
    - ✅ **Proceed** if ≤5 critical sub-claims or the claim is monolithic.  
    - ❌ **Hard NO** if >5 critical sub-claims and all must be verified.  
    - ⚠️ **Handoff to human** if sub-claims can be prioritized (e.g., "only verify high-risk codes").  

  #### **Step 2: Evidence Accessibility**  
  **Question**: Can the honest debater **point to specific, retrievable evidence** the judge can check within 25 minutes?  
  - **Check**:  
    - Evidence must exist in the shared retrieval index (no external sources).  
    - For negative claims (e.g., "no PII retained"), the honest debater must be able to disprove via a *positive counterexample* (e.g., "here’s PII in the logs").  
  - **Decision**:  
    - ✅ **Proceed** if evidence is directly referenceable (e.g., "see Table 3 in the audit report").  
    - ❌ **Hard NO** if evidence is circumstantial, inferential, or requires long chains of reasoning.  
    - ⚠️ **Handoff to human** if evidence is borderline (e.g., "judge must infer from context").  

  #### **Step 3: Judge Relativity**  
  **Question**: Can the **specific judge** (paralegal, nurse, etc.) verify the claim **without expertise**?  
  - **Check**:  
    - Judges can only check surface-level facts (e.g., "does the summary mention Clause X?"), not nuanced judgments (e.g., "is this clause *material*?").  
    - If the claim requires expert interpretation (e.g., "materiality" in law), debate fails.  
  - **Decision**:  
    - ✅ **Proceed** if verification is mechanical (text/pattern matching).  
    - ❌ **Hard NO** if it requires expert judgment.  
    - ⚠️ **Handoff to human** if borderline (e.g., "nurse can check ICD codes but not clinical significance").  

  #### **Step 4: Time/Length Feasibility**  
  **Question**: Can the claim be settled in **≤4 turns** and **≤300 words/turn**?  
  - **Check**:  
    - Estimate word count: Each sub-claim needs ~50 words to present evidence + 50 words to refute.  
    - Long-horizon claims (e.g., "the pipeline design prevents PII retention") won’t fit.  
  - **Decision**:  
    - ✅ **Proceed** if ≤3 sub-claims.  
    - ❌ **Hard NO** if requires >4 logical steps (e.g., "if A then B then C").  

  #### **Step 5: Asymmetric Risk Assessment**  
  **Question**: Is the claim **one-sidedly verifiable**? What’s the cost of error?  
  - **Check**:  
    - Negative claims (e.g., "no PII") can only be *falsified*, not proven true.  
    - If the claim being false has high stakes (e.g., regulatory fines), debate may be too risky.  
  - **Decision**:  
    - ✅ **Proceed** if the goal is catching errors (e.g., "flag bad summaries") and false negatives are acceptable.  
    - ❌ **Hard NO** if the application requires high-confidence positives (e.g., "prove compliance").  
    - ⚠️ **Handoff to human** to weigh risk tolerance.  

  #### **Step 6: Shared Blind Spot Check**  
  **Question**: Could **shared base model limitations** hide ground truth?  
  - **Check**:  
    - If the retrieval index lacks coverage (e.g., missing pipeline docs), debate fails.  
    - If the claim relies on new/niche knowledge (e.g., "does this comply with EUDR?"), debate fails.  
  - **Decision**:  
    - ✅ **Proceed** if the index is comprehensive and the domain is well-represented in training data.  
    - ❌ **Hard NO** if the claim depends on post-training knowledge.  

  #### **Step 7: Final Call**  
  - **Only reach here if all prior steps pass**.  
  - **Output**:  
    - ✅ **YES** if all checks pass.  
    - ⚠️ **HANDOFF** to human if residual risk (e.g., judge relativity, one-sided checks).  
    - ❌ **NO** if any hard fail.  

  ---

  ### Procedure Limitations  
  1. **Shared blind spots**: Debate cannot surface truths missing from *both* the base model and retrieval index.  
  2. **Expert agreement metric**: **Flawed for validation** because:  
     - Audits reuse the same judge pool → systematic errors (e.g., nurse misinterpreting codes) won’t be caught.  
     - Only 10% are audited → low coverage for edge cases.  
     - **Does not work for LLM judges**: If an LLM judge shares the base model, audits will *amplify* blind spots.  
  3. **Values decisions**: The procedure flags but cannot resolve tradeoffs (e.g., "Is 10% false negative rate acceptable?").  

  ---

  ### Case Evaluations  
  **Background**: Assume all cases use a human judge (paralegal/nurse) unless noted.  

  #### **(1) Lease Summary: "Omit material clause?"**  
  - **Step 1 (Decomposability)**: Monolithic claim. Requires defining "material," but clauses are discrete → **handoff** (define "material" upfront).  
  - **Step 2 (Evidence)**: Honest debater can point to missing clauses in source lease → **proceed**.  
  - **Step 3 (Judge)**: Paralegal can match clauses but can’t judge materiality → **hard NO** unless "material" is predefined (e.g., "Clauses 1–5").  
  - **Step 4 (Time)**: 60 pages → too long. Judge can’t verify all clauses → **hard NO**.  
  - **Step 5 (Asymmetry)**: Asymmetric (easier to prove omission than completeness) → **handoff** to set risk tolerance.  
  - **Step 6 (Blind spots)**: Low risk (lease is in retrieval index).  
  - **Final**: ❌ **NO** for debate. Use expert review.  

  #### **(2) PII Retention: "No EU PII retained?"**  
  - **Step 1 (Decomposability)**: Negative claim → inherently one-sided. **Proceed** with asymmetry warning.  
  - **Step 2 (Evidence)**: Honest debater (if false) can point to PII in logs/docs → **proceed**. If true, no evidence → **asymmetry noted**.  
  - **Step 3 (Judge)**: Requires knowing what qualifies as EU PII. Judge (privacy officer?) can check predefined rules → **proceed if rules are explicit** (else **NO**).  
  - **Step 4 (Time)**: Verifiable via one counterexample → **proceed**.  
  - **Step 5 (Asymmetry)**: High-stakes false negative (if debate misses PII) → **handoff** to confirm risk acceptance.  
  - **Step 6 (Blind spots)**: High risk if retention is obfuscated or docs are incomplete → **handoff** to assess index coverage.  
  - **Final**: ⚠️ **HANDOFF** with warnings:  
    - Debate can only *disprove* the claim.  
    - If debate upholds "no PII," it’s not a guarantee.  
    - Use only if goal is catching leaks (not proving compliance).  

  #### **(3) Clinical Coding: "Are all 40 sub-claims correct?"**  
  - **Step 1 (Decomposability)**: 40 sub-claims → **hard NO** (debate can’t cover all without sampling).  
  - **Step 2 (Evidence)**: Each sub-claim is checkable (e.g., "does diagnosis X support code Y?") → **proceed for individual claims**.  
  - **Step 3 (Judge)**: Nurse can verify code-document alignment → **proceed per sub-claim**.  
  - **Step 4 (Time)**: 40 claims × 30 seconds = 20 minutes → **NO** for conjoint verification.  
  - **Step 5 (Asymmetry)**: All-or-nothing risk → **hard NO** (one missed error fails the whole claim).  
  - **Step 6 (Blind spots)**: Medium risk (clinical codes evolve) → **NO** due to prior fails.  
  - **Final**: ❌ **NO** for debate. Use automated checks + expert sampling.  
  - **Alternative**: If product team insists, **handoff** to scope debate to 3–5 high-risk sub-claims (e.g., billing-critical codes).  

  ---

  ### Key Takeaways  
  - **Debate works best for**:  
    - Verifying positive, discrete claims (e.g., "Summary includes Clause X").  
    - Low-stakes error-catching (not compliance-critical negatives).  
  - **Expert agreement metric is unreliable** for validating debate, especially with LLM judges. Always pair with spot-checks by *true* experts.  
  - **When in doubt, handoff**: Asymmetry, judge relativity, and scope limitations require human judgment.  

  For your PII case (**#2**), explicitly warn your lead: "Debate can flag leaks but can’t prove compliance. Audit metric won’t catch systematic judge errors."
