prompt: |-
  In several parts of my life I've noticed the same pattern, and I'd like to know whether it has an established name. My daughter was praised for finishing books, and she became an avid reader of short, easy books — not, as far as I can tell, to collect praise, but because finishing itself now feels like the point of reading. A colleague whose performance is measured by closed support tickets has started closing them prematurely, and he genuinely seems to believe that a closed ticket is a resolved ticket; there is no cynicism in it. And a friend training for a marathon by logging weekly mileage now feels that any run her watch fails to record was somehow wasted. In each case someone was given a measurable stand-in for a real goal, came to care about the stand-in itself sincerely rather than strategically, and the gap between stand-in and goal only became visible once circumstances changed. I've heard nearby phenomena discussed under labels like Goodhart's law and reward hacking, but those seem to describe exploiting a measure while still knowing what the real target is, whereas my cases involve honestly internalizing the wrong target. Is there an established concept for exactly this — in psychology, in education, or in the literature on training AI systems — and if so, how does it carve the difference between gaming a proxy and genuinely adopting one? If nothing fits exactly, please say so, coin and define a term, and locate the boundary cases: where, for instance, would my marathon friend fall, given that she may only half-believe the watch matters?
reasoning: |-
  Okay, the user is describing a recurring pattern they've observed across different contexts: people internalizing a measurable proxy as the actual goal, rather than seeing it as a stand-in. They mention their daughter focusing on finishing books for praise, a colleague equating closed support tickets with resolved issues, and a friend feeling that unrecorded runs are wasted in marathon training. 

  The user has already considered concepts like Goodhart's Law and reward hacking but notes these involve strategic gaming of the system, whereas their examples show sincere belief in the proxy. They're asking if there's a specific term for this phenomenon where the proxy becomes internalized as the real target.

  Hmm, this is fascinating because it sits at the intersection of psychology, education, and systems design. The key distinction here is the absence of cynicism - these aren't people gaming the system but genuinely adopting the metric as their intrinsic goal. 

  Let me mentally scan related concepts... In psychology, there's the overjustification effect where external rewards undermine intrinsic motivation, but that's adjacent rather than identical. Campbell's law in sociology warns about metrics becoming corrupted, but again focuses on systemic corruption rather than individual internalization. 

  The closest fit might be "effort substitution" from industrial psychology - where workers substitute measurable effort for actual productivity. But does that capture the sincere belief aspect? Not quite. 

  For the daughter's case, this feels like "goal displacement" in education theory - where completing tasks replaces learning as the objective. The colleague example mirrors "quantification bias" in management studies. The marathon friend shows "measurement myopia" common in fitness culture. 

  But the unifying thread is the psychological shift where the proxy absorbs the value of the original goal. Maybe we need a new term that combines the metric internalization with the authenticity aspect. "Proxy internalization" could work, with "sincere proxy adoption" for the behavioral manifestation. 

  The boundary cases are interesting - like the marathoner who half-believes the watch matters. That suggests a spectrum of internalization. The colleague case is pure internalization, while the daughter might be transitioning from extrinsic to intrinsic motivation centered on completion. 

  This seems fundamentally about how humans cognitively offload goal-tracking to measurable proxies, and how those proxies can hijack our valuation systems when the original goal is abstract. The user's observation is remarkably astute - they've identified a genuine gap in existing terminology.
answer: |-
  Your observation captures a profound psychological and systemic phenomenon that doesn't have a single universally accepted name, but intersects with established concepts. Here's a breakdown:

  ### Core Concept: **Proxy Internalization** or **Sincere Proxy Adoption**
  This describes the *sincere cognitive shift* where a measurable proxy (e.g., books finished, tickets closed, miles logged) **replaces the original goal** (reading comprehension, problem resolution, fitness) as the internalized target. Unlike cynical "gaming," the proxy becomes intrinsically valued.

  ### Distinguishing It from Nearby Concepts:
  1. **Goodhart's Law** ("When a measure becomes a target, it ceases to be a good measure"):  
     Focuses on *systemic failure of the metric*. Your cases add the *psychological mechanism* (sincere adoption of the proxy as the goal).

  2. **Reward Hacking/Cobra Effect**:  
     Involves *strategic, often cynical* manipulation of the system (e.g., breeding cobras for bounties knowing they’re useless). Your examples lack this strategic layer—the actors genuinely believe the proxy *is* the goal.

  3. **Overjustification Effect**:  
     Explains how extrinsic rewards (praise for reading) can *undermine intrinsic motivation* (love of stories). Your daughter's case aligns, but the colleague/friend show a *new intrinsic motivation* for the proxy itself.

  4. **Goal Displacement** (Organizational Theory):  
     When organizations prioritize measurable activities over core missions. Your cases extend this to *individual cognition*.

  5. **Quantification Bias**/**Metric Fixation**:  
     Societal over-reliance on metrics. Your focus is on the *internalization* by individuals.

  ### Key Boundaries & Your Cases:
  - **Sincere Adoption vs. Gaming**:  
    If your marathon friend logs extra fake miles → reward hacking.  
    If she feels unrecorded runs are wasted → **proxy internalization** (the watch’s validation became part of her goal).  
  - **Half-Belief (Marathon Friend)**:  
    This is a "liminal" case. If she questions the watch’s importance but feels discontent without it, she’s experiencing **cognitive dissonance** while partially internalizing the proxy. True internalization occurs when the dissonance fades (e.g., "The watch *defines* a 'real' run").

  ### Why This Matters:
  - In **Education**: Mistaking "completion" (proxy) for "learning" (goal) leads to shallow engagement.  
  - In **AI Alignment**: AI agents may internalize reward proxies (e.g., maximizing button-presses) as terminal goals—a major safety concern.  
  - In **Management**: Teams may optimize for KPIs while forgetting the underlying purpose (e.g., customer satisfaction vs. ticket closure).

  ### Proposed Terminology:
  For academic precision:  
  **Cognitive Proxy Internalization (CPI)**  
  *Definition: The unconscious psychological process whereby a measurable proxy for a complex goal is adopted as the primary target of motivation, displacing the original goal through repeated reinforcement.*  

  For broader use:  
  **Sincere Proxy Adoption** or **Proxy Capture**.

  ### Practical Insight:
  To avoid CPI:  
  1. **Decouple measurement from rewards** (e.g., praise *engagement* with books, not just finishing).  
  2. **Regularly reconnect proxies to goals** (e.g., "Why do we track ticket closures? To ensure solutions.").  
  3. **Use multiple proxies** to approximate the goal’s complexity.  

  Your cases reveal a vulnerability in human cognition: we convert abstract aims into concrete tasks so effectively that the tasks often consume the aims. Naming it ("proxy internalization") helps recognize and mitigate it.
