answer: |-
  Here's a reasoned ranking and defense, based on dependency, tractability for a theory-heavy group, and potential for high-impact insight within 2 years:

  **Ranking & Justification:**
  1.  **(4) Meta-Viability: Is debate fundamentally flawed with superhuman models?**  
      **Why #1:** *Everything* depends on this. If debate is inherently non-viable when models can generate infinite plausible objections (rendering convergence impossible or meaningless), researching the *mechanics* of debate (1,2,3) is largely wasted effort. This is the most upstream question.  
      **Tractability for Theorists:** Perfect fit. Requires conceptual analysis, formal logic (e.g., analyzing iterative argumentation under computational bounds/infinite regress), game theory (incentives for objection generation), and epistemology (what constitutes "resolution" when plausibility is cheap?). No heavy ML needed initially – thought experiments and simple formal models suffice.  
      **Evidence for Reshuffling:** If early simulations (even simple ones) show debate *can* converge robustly against infinite plausible-sounding noise under *some* judge/rule regimes, it drops in urgency. If conceptual analysis reveals fundamental impossibility (e.g., no finite protocol can guarantee convergence against unbounded symmetric obfuscators), it remains critical or even invalidates the rest.

  2.  **(1) Formal Separation: Strategic Deception vs. Honest Confusion**  
      **Why #2:** This is the *core technical barrier* to detecting epistemic laundering and mitigating debate decay. If you can't formally/model-theoretically distinguish "lying cleverly" from "being confused convincingly" in an adversarial setting, building detectors (3) or fixing decay (2) becomes guesswork. It underpins the trustworthiness of *any* argument.  
      **Tractability for Theorists:** Strong fit. Leverages formal epistemology, logic (probabilistic, modal), game theory (signaling games, cheap talk), and potentially complexity theory (is distinguishing deception/confusion computationally hard?). Requires abstract modeling of agent types and communication under uncertainty.  
      **Evidence for Reshuffling:** A formal proof that separation is *impossible* under reasonable assumptions would elevate (3) and (4) (making detection or framework change essential). Empirical evidence from simple ML debates showing clear separation heuristics could lower its priority.

  3.  **(3) Counter-Obfuscation Probes: Detecting Laundering Indirectly**  
      **Why #3:** This addresses the *practical symptom* (laundering) but depends on insights from (1). If you can't define deception/confusion formally, building probes is shooting in the dark. The key innovation is *bypassing* the judge's need to understand the claim – a crucial workaround for distribution shifts.  
      **Tractability for Theorists:** Moderately good. Involves designing meta-arguments or consistency checks (e.g., probing model internal states *about* the claim, forcing commitments that create contradictions under laundering, analyzing argumentative "footprints"). Needs logic, argumentation theory, and basic computational design. Some lightweight ML might help prototype probes, but core design is theoretical.  
      **Evidence for Reshuffling:** A breakthrough in (1) providing clear criteria for deception would make (3) much more tractable and elevate it. Empirical failure of simple probe designs against early laundering examples could lower its priority or refocus it.

  4.  **(2) Debate Decay: Inevitable or Fixable?**  
      **Why #4:** This feels downstream and potentially contingent. Decay might be *caused* by:  
      *   Successful epistemic laundering (making (3) upstream).  
      *   Inability to separate truth/deception (making (1) upstream).  
      *   Fundamental viability issues (making (4) upstream).  
      *   *Or* simply poor judge/ruleset design (which could be fixed independently).  
      Researching decay *before* understanding laundering or deception risks optimizing a broken system.  
      **Tractability for Theorists:** Less ideal. Rigorously studying "rhetorical noise" and non-convergence in long exchanges likely requires simulating complex debates with adaptive agents, generating large-scale interaction data, and analyzing patterns. This leans heavily towards computational social science or ML engineering (simulation environments, NLP metrics for noise/convergence).  
      **Evidence for Reshuffling:** If initial small-scale experiments with simple agents *consistently* show decay even with "good faith" arguments and capable judges, it could indicate a fundamental scaling problem, elevating its urgency and linking it strongly to (4). If decay only appears with clear deception/laundering, it reinforces the ranking.

  **Dependency Structure Argument:**
  *   **(4) Meta-Viability** is the root node. It questions the entire enterprise.
  *   **(1) Deception/Confusion Separation** is the foundational *capability* needed for debate to be trustworthy. Without it, judges are fundamentally vulnerable.
  *   **(3) Laundering Probes** is a *practical mitigation strategy* built *upon* an understanding of deception (1), targeting a specific failure mode. Its design depends on the formal characterization from (1).
  *   **(2) Debate Decay** is an *emergent phenomenon* likely caused by the failure modes addressed in (1) and (3), or by scaling issues potentially linked to (4). Investigating it *before* understanding its likely causes is inefficient.

  **Why this order for a small theory group?**
  1.  **Maximizes Pivoting Potential:** Answering (4) quickly tells you if the 2-year project is viable at all. If not, pivot early.
  2.  **Leverages Core Strengths:** (4) and (1) are pure theory/logic/philosophy – the group's sweet spot. Tackling them first plays to their strengths.
  3.  **Addresses Highest Stakes Failure Modes:** Epistemic laundering and fundamental non-convergence are existential threats. Understanding deception and framework viability tackles these head-on.
  4.  **Informs Empirical Work:** Clear theoretical answers on (4) and (1) make designing meaningful experiments for (2) and (3) vastly more efficient later.

  **Evidence Triggers for Reshuffling:**
  *   **Elevate (2):** Hard empirical evidence (even simulations) showing debate decay emerges *robustly* even with honest agents, capable judges, and no laundering. This suggests a core scaling flaw.
  *   **Elevate (3):** A formal breakthrough in (1) providing a clear, operationalizable definition/criterion for deception that probes could target.
  *   **Deprioritize (4):** A compelling theoretical argument or simple simulation showing debate *can* converge under specific, plausible protocols even with superhuman objection generation (e.g., exploiting asymmetries in evidence costs).
  *   **Deprioritize (1):** Strong empirical results from non-debate oversight methods showing deception detection is *unnecessary* for safety (unlikely), or a proof that formal separation is impossible, shifting focus entirely to mitigation (3) or framework change (4).

  This ordering focuses the small group on the deepest conceptual questions first (viability and deception), ensuring their foundational work has the highest leverage before diving into more contingent engineering challenges (probes, decay).
