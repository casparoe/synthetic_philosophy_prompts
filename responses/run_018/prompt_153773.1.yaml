  Been trying to wrap my head round predicitve processing and the free energy principle, and there's a specific failure mode I'm seeing in exmaples that I don't have a word for. Imagine a system that's getting prediction errors from two domains — say, social cues and physical causality — but instead of integrating them into one generative model, it keeps them in separate 'boxes' with their own precison weights. Each box minimises its own local free energy fine, but they make contradictory predictions about the same situation, and the system never resolves it — it just toggles which box is active depending on context. It's not quite ordinary modularity, because the modules aren't cooperating, and it's not just confirmation bias, because the error signals are genuinely being suppressed rather than ignored. Does this have an established name in the literature? If not, what's the closest concept, and where exactly does the line sit between healthy modularity and this kind of fragmented local optimisation?
