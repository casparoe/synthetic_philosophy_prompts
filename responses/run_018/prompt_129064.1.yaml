  Here's my rigorously decomposed credence assessment, structured as requested. I'll use a multiplicative model since you're asking about *joint* philosophical substance across all four conditions (with #4 being a disanalogy that would break it, so I'll use `1 - P(disanalogy)`). 

  ---

