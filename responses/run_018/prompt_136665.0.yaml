    "core_implication": "The co-op cannot simultaneously guarantee absolute individual control over choices with external impacts (minimal liberty) AND ensure outcomes are always optimal according to unanimous preferences (Pareto efficiency); a fundamental trade-off is logically unavoidable.",
    "co_op_relevance": "Directly applies to 'personal' choices like noise or decoration where actions in one flat (e.g., loud music) create externalities affecting neighbours' welfare, entangling individual liberty with collective preference satisfaction.",
    "sacrifice_required": "The co-op must deliberately weaken either the scope of protected personal liberties (sacrificing minimal liberty) or the guarantee of acting on unanimous welfare improvements (sacrificing Pareto efficiency) for choices at the boundary of personal/collective impact.",
    "robustness_check": "The underlying tension is highly robust in small communities; while specific preference profiles triggering the *formal* paradox might be avoidable, the practical conflict between individual freedom and collective welfare regarding externalities is persistent and likely to manifest."
  }
  ```
