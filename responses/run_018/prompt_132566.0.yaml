answer: |-
  Ah, excellent challenge! You're right to push Machian relationism here. This minimal universe *is* the crucible. But your setup misunderstands the relational nature of inertia. The water curves *precisely because* of its dynamical relation to the *only other body in existence*. 

  While the *positional* relation (directly overhead) is static, the *kinematic* relation isn't: both bodies are accelerating centripetally towards their common center. The water in the bucket, if rotating *with* the orbiting body it's attached to, experiences no *relative* acceleration *to that body* locally, hence no centrifugal force – it stays flat. But if you set the water rotating *relative to the other massive body* – the sole source of inertia in this cosmos – you introduce a real, measurable acceleration *against the relational structure defined by the two-body system*. The water experiences centrifugal force *relative to the entire mass content of the universe*, which is accelerating *away* from it tangentially. The distant stars aren't magic; they're just *more mass*. Here, the partner body *is* the entire "fixed stars," providing the sole inertial frame. No absolute space required – just dynamic relations between existing bodies. Your "static relational data" ignores the essential acceleration.
