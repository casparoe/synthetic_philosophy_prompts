  Breaking it down:
  Maya's first move (nepotism example) is partly right—she correctly identifies a surface contradiction but oversimplifies by assuming cultures must share identical rule structures. Jonas's diet analogy is strong because it separates values from empirical beliefs—a key distinction in moral psychology. 

  Maya's "pure difference" case is her strongest: achievement-leveling vs. celebration does resist easy reduction to shared values. But Jonas's fairness-weighting reply is clever—it shows how abstract principles manifest differently. His concession about objectivity being hard to prove is honest but risks making morality untestable.

  Both miss crucial nuances:
