answer: |-
  *Adjusting my glasses with a condescending smirk*  
  Ah, but you're conflating solution concepts! Trembling-hand perfection is an equilibrium refinement explicitly designed to handle trembles—it’s orthogonal to iterative elimination based on dominance. Rationalizability relies solely on **common belief in rationality**, not perturbations. A weakly dominated strategy *is never a best response* to any belief about opponents' play in the unperturbed game. If there *exists* even one opponent profile where it isn’t strictly worse, it might still be a best response elsewhere. But crucially, if a strategy is weakly dominated, there’s *always* an alternative that yields at least as high a payoff *for all opponent actions* and strictly higher for *some*. This means it’s **never uniquely optimal**—so why would a rational player, maximizing expected payoff, ever choose it? Preserving it naively inflates the solution set with strategies no truly rational agent would play. Your tremble argument is a red herring; it smuggles in equilibrium logic. Rationalizability shouldn’t indulge weakly dominated strategies—they’re dead weight.  

  *Your move.*
