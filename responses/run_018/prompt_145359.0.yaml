answer: |-
  Here’s the exam question, model answer, and marking scheme tailored to your specifications:  

  ---

  ### Exam Question  
  **Compare and contrast pain asymbolia with the following hypothetical case: A patient ("Case X") exhibits intense suffering (e.g., anguish, despair) and strong avoidance behaviors (e.g., refusing to use a limb), but lacks any sensory representation of tissue damage (e.g., no burning, stinging, throbbing). Using both cases together, argue whether the *badness of pain* is more plausibly grounded in its ability to *represent bodily damage* or in its *affective/motivational character*. Defend your position.**  

  ---

  ### Model Answer (Key Points)  
  The badness of pain is fundamentally affective/motivational, not representational.  

  1. **Asymbolia shows sensation ≠ badness**: Patients feel "pain" (e.g., pinch, heat) but lack suffering/avoidance. This decoupling proves sensory representation of damage is *insufficient* for pain’s badness.  
  2. **Case X shows badness ≠ sensation**: Suffering/avoidance exists without *any* sensory representation of damage. This demonstrates that badness need not track bodily states, undermining representational necessity.  
  3. **Asymbolia highlights affective primacy**: Asymbolics retain sensation but lose affective/motivational components (suffering, withdrawal). The badness disappears, confirming affect drives badness.  
  4. **Case X confirms affective sufficiency**: Intense suffering/avoidance arises with zero nociceptive sensation. This implies affective states alone can constitute badness, independent of bodily representation.  
  5. **Synthesis**: Both cases reveal that badness correlates strictly with affective/motivation systems. Representation may *trigger* affect but isn’t essential to badness (asymbolia) or inherently bad (Case X shows non-bodily suffering can be worse).  

  ---

  ### Marking Scheme (20 marks total)  
  **Award 4 marks per point** (2 for partial/implied, 4 for explicit + reasoned).  

  | **Point** | **What candidates must hit** | **Common mistakes (costs 2 marks)** |
  |-----------|------------------------------|-------------------------------------|
  | **1** | Asymbolia proves sensory representation is *insufficient* for badness (affect is missing despite sensation). | *Mistake:* Only describing asymbolia clinically without linking to insufficiency. |
  | **2** | Case X proves representation is *unnecessary* for badness (suffering exists without sensation). | *Mistake:* Treating Case X as "psychiatric pain" without analyzing its conceptual challenge to representation. |
  | **3** | Asymbolia shows affect/motivation loss *causes* disappearance of badness (sensation remains intact). | *Mistake:* Claiming asymbolics "don’t feel pain" (confusing sensation with affect). |
  | **4** | Case X shows affect/motivation alone can *constitute* badness (no sensory trigger needed). | *Mistake:* Assuming Case X must involve "misrepresentation" (e.g., "they sense damage unconsciously"). |
  | **5** | Synthesis: Badness is *essentially affective* because both cases dissociate it from representation while tethering it to affect. | *Mistake:* Conflating correlation (sensation often causes affect) with necessity/essence. |

  ---

  ### Notes for Grading  
  - **Top marks (16–20)**: Explicitly uses *both* cases to challenge representational views and defend affective primacy via necessity/sufficiency logic.  
  - **Mid marks (10–14)**: Describes cases accurately but struggles to synthesize; may revert to dualism ("both matter") without argument.  
  - **Low marks (0–8)**: Parrots clinical details, ignores Case X, or asserts claims without using cases as evidence.  
  - **Critical nuance**: Avoid crediting "sensation causes affect" as essential—the cases show they *can* dissociate.  

  This tests grasp of *essentialism* and *dissociation logic* while pushing beyond textbook asymbolia. The hypothetical forces engagement with philosophy, not just neurology.
