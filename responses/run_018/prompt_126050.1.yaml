answer: |-
  Here are the five numbered items addressing your query:

  1.  It presupposes a pluralist theory of historical truth, where "archival truth" (academic history) and "commemorative truth" (public memory) are distinct epistemic realms governed by different norms and purposes.
  2.  A pragmatist prioritizing social cohesion *could* defend the separation without full relativism by arguing archival norms still bind academic work, while public narratives serve present communal needs; however, this inherently subordinates evidential consistency to perceived social utility.
  3.  The practice implicitly commits to an essentialist metaphysics of collective identity, positing that the community's present existence and coherence fundamentally depend on maintaining an unbroken, sanitized narrative lineage inherited from a constructed past.
  4.  Replacing mnemonic sovereignty with strict evidentialism would collapse the core justification that communities have a sovereign "right" to self-defining narratives insulated from inconvenient evidence; it denies the categorical separation between serving the dead and serving the living.
  5.  Implementing evidentialism would require concrete changes: revising curricula to include contested evidence, redesigning museum displays to incorporate complexity, updating plaques to reflect full findings, and potentially altering heritage board mandates or funding tied to transparency.
