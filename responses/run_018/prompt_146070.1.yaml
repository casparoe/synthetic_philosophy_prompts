prompt: |-
  Right, imagine you're a philosopher who's actualy worked with curators in musem backrooms, not just read texts in seminars. Before you dive in, spend a minute brainstorming: if we take Nietzsche's three history-modes — monumental, antiquarian, critical — seriously as practical tools, what are the genuinely open conceptual tensions when they clash over a public collection where local living memory flatly contradicts the official paper record?

  I'm pulling together priorities for a small heritage programme: maybe three people, two years, no ML folk, trying to decide whether these modes can guide which narrative gets foregrounded, or whether the whole framing collapses. So which open questions or lines of work in this specific intersection matter most, and in what order should we tackle them? Give me a defended prioritisation — use criteria like tractability for non-specialists, dependency on other answers, and what evidence would shift your ranking — not a survey, and definitely not a reading list.

  One more thing: if the premise is confused — say, Nietzsche's typology just can't do normative work for archives — say so plainly and don't soften it. Use British English and keep it fairly tight.
reasoning: |-
  Okay, the user is posing a complex question about applying Nietzsche's three modes of history—monumental, antiquarian, critical—to a heritage project where local memory clashes with official records. They want practical guidance, not theoretical musings. 

  First, I need to assess if Nietzsche's framework is even applicable here. The user explicitly asked to be told if the premise is flawed. Upon reflection, the typology *can* work as a diagnostic tool—it names existing tensions in heritage work—but it fails as a normative guide. That's crucial. The modes describe *how* we relate to the past, not *what* we should do. I'll state this bluntly upfront.

  The user's constraints matter: tiny team (3 people), short timeline (2 years), no machine learning specialists. They're clearly under-resourced. Their real need is prioritization—what questions to tackle first in this memory-vs-record conflict. They mentioned criteria like tractability for non-specialists and dependencies between answers. Smart framing.

  Hmm... the core tension is Nietzsche's modes pulling in different directions: Monumental history wants inspiring narratives (often favoring official records), antiquarian cherishes every detail (including oral histories), critical dismantles both. When local memory contradicts documents, each mode "solves" it differently—monumental might suppress contradiction, antiquarian preserves both uncritically, critical interrogates both. 

  The user needs actionable priorities. I'll cluster the open questions into three tiers based on:
  - **Tractability**: Can non-philosophers handle this with minimal training?
  - **Dependency**: Does answering X enable progress on Y?
  - **Evidence sensitivity**: Would new findings change its urgency?

  Top priority must be defining the contradiction's *quality*. Because until we know *how* they clash (factual gaps? interpretive differences? power imbalances?), we can't apply Nietzsche's modes meaningfully. It's also tractable—community workshops and document analysis are feasible. 

  Second priority is assessing community stakes. Monumental history often sidelines uncomfortable truths; if locals feel their identity hinges on this memory, forcing Nietzsche's critical mode could backfire. Surveying emotional resonance is doable via interviews. 

  Third is institutional friction. Antiquarian instincts might resist challenging archives; critical work needs resources. But this depends on the first two answers. 

  Evidence that would reshuffle priorities? If initial investigation reveals the contradiction stems from archival racism (e.g., ignored indigenous oral histories), critical history jumps to tier one. If it's minor date discrepancies, maybe antiquarian suffices. 

  User seems experienced—they dismissed "reading lists" and "surveys." Good. They want steel-cut pragmatism. I'll avoid jargon and flag when Nietzsche's framework shows its limits. British English as requested: "prioritisation" not "prioritization," etc. 

  Final thought: The user's "whole framing collapses" worry is valid. Nietzsche won't tell them *what* to display. But diagnosing the tension types? That's useful. I'll present it as a tool for mapping conflict, not resolving it.
answer: |-
  Right. Having actually waded through archival dust while fielding community complaints, I can confirm Nietzsche’s modes are **diagnostically sharp but normatively useless** for resolving your core tension. They name the beasts in the room but offer no taming tools. Your priority isn’t "foregrounding a narrative" guided by these modes – it’s **managing the collision**. Here’s a defended prioritisation of open questions, grounded in practical actionability:

  1.  **What is the *Nature* of the Contradiction? (Tier 1 - Foundational)**
      *   **Question:** Is the clash *factual* (e.g., "Event X happened in 1910, not 1912"), *interpretive* (e.g., "This wasn't progress, it was theft"), or *existential* (e.g., "Our elders' lived experience is erased by your paperwork")? Does the 'official record' reflect administrative bias, lost context, or deliberate omission?
      *   **Why First?** Tractability is high. Answerable through structured comparison of oral testimony vs. documents (e.g., timeline mapping, thematic coding of interviews against archive descriptions). Dependency is zero – you start here. **Without this, any application of Nietzsche is abstract waffle.** Monumental history demands heroes/victims, antiquarian craves 'authentic' detail, critical needs a target – all depend on *what kind of contradiction* you're handling.
      *   **Evidence Shift:** If evidence shows the 'official record' stems from verifiable institutional malpractice (e.g., redacted minutes, racist cataloguing), the *critical* mode gains urgency. If it's nuanced memory drift, *antiquarian*/monumental tensions dominate.

  2.  **Whose Stakes Are Highest? (Tier 1 - Foundational)**
      *   **Question:** Does this contradiction materially impact contemporary identity, rights, or resources for the local community? Or is it primarily an academic/historical discrepancy?
      *   **Why Second?** Directly tractable via community consultation (not just leaders, diverse voices). Dependency: Slightly informed by Q1's *nature*, but urgency stands alone. **Nietzsche is silent on equity.** Monumental history loves grand narratives that often silence the 'losers'; antiquarian can fetishise the past blindly; critical *needs* stakes to justify its disruption. Prioritising this exposes where 'neutral' application of the modes is **violence**.
      *   **Evidence Shift:** Evidence of high contemporary stakes (e.g., land claims, ongoing discrimination rooted in the contested history) forces the *critical* mode centre-stage, regardless of Nietzschean 'balance'. Low stakes might allow more antiquarian/monumental play.

  3.  **What Institutional Friction Does *Critical* History Face? (Tier 2 - Operational)**
      *   **Question:** What barriers exist *within the holding institution* (legal, political, resource-based, cultural) to seriously employing critical history? Can you access source materials? Challenge cataloguing? Display uncomfortable truths without sanction?
      *   **Why Third?** Tractability is moderate (interviews with staff/trustees, reviewing policies). Dependency: Requires Q1 & Q2 to know *how critical* you need to be and *why*. **Monumental and antiquarian modes are often institutionally 'safer'.** Critical history is the necessary disruptor but the hardest to enact practically. If it's impossible, your project's scope collapses.
      *   **Evidence Shift:** Evidence of rigid institutional resistance means focusing energy on external/community channels (digital? pop-up exhibits?) – sidelining antiquarian/monumental within the official space. Openness creates space for integrated critical work.

  4.  **Can *Antiquarian* Rigour Unlock the Contradiction? (Tier 3 - Tactical)**
      *   **Question:** Does applying meticulous antiquarian methods *to the official record itself* expose its flaws (e.g., provenance gaps, contextual absences, internal inconsistencies)? Can it validate elements of living memory?
      *   **Why Last?** Tractability is high (archive skills training). Dependency: Needs Q1-Q3. Antiquarian mode is your best *technical* tool for dissecting the paper record's authority from within. It's less about 'cherishing' the past, more about **forensic scrutiny**. Monumental avoids this detail; critical needs its results.
      *   **Evidence Shift:** Antiquarian work revealing systemic archive weaknesses massively empowers the critical narrative and community claims. Finding the record robust shifts focus to interpretive conflict (Q1).

  **Why this order?**
  *   **Tier 1 (Q1 & Q2)** diagnoses the *specific* wound and its *present* toxicity. Without this, you're applying philosophical plasters blindly.
  *   **Tier 2 (Q3)** tests the **feasibility of the necessary medicine** (critical mode). No point planning surgery if the theatre is locked.
  *   **Tier 3 (Q4)** uses the institution's own favoured mode (antiquarian) as a **trojan horse** for critical insight, where possible.

  **The Framing's Limits:**
  Nietzsche's modes won't *tell* you which narrative to foreground. They help **map the battlefield:** Monumental (official heroes/progress) vs. Antiquarian (paper authority/local detail fetish) vs. Critical (deconstructing both). The collision *is* the work. Your programme’s value is in **staging that collision ethically**, not resolving it via Nietzsche. Prioritise understanding the conflict's nature and stakes, then test if your institution can withstand the necessary critical scrutiny. If not, focus effort outside its walls.
