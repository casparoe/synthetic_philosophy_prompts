answer: |-
  Here's a detailed audit of the self-driving vehicle analogy for epiphenomenalism, addressing your specific queries:

  ### Explicit Correspondence Table
  | **Vehicle System Component**      | **Epiphenomenalist Mental Analog**             | **Functional Role in Analogy**                                                                 |
  | :-------------------------------- | :--------------------------------------------- | :--------------------------------------------------------------------------------------------- |
  | **External Sensors (cameras, lidar)** | Sensory Organs (eyes, ears, skin, etc.)        | Transduce external stimuli into data signals.                                                  |
  | **Control Algorithms**            | Unconscious Neural/Cognitive Processes         | Process sensory data, make decisions, generate behavior (steering/braking ≈ motor outputs).    |
  | **Rendering Pipeline**            | Neural Correlates of Consciousness (NCC)       | Transform algorithmic states into qualitative properties (phenomenal consciousness).           |
  | **Telemetry Display**             | Phenomenal Consciousness (Qualia)              | Presents qualitative information (colors, sounds) for observation. Causally inert.             |
  | **Passenger-Observer**            | The Subject of Experience                      | "Witnesses" the display (consciousness) but does not affect the vehicle's operation.           |
  | **Judgment-Output (e.g., "Turning left")** | Verbal Phenomenal Reports ("I see red")       | Caused solely by control algorithms, *not* by the display's content.                           |
  | **Absent Feedback Path**          | Causal Inertness of Consciousness              | No pathway for phenomenal states to influence cognition or behavior.                           |

  ---

  ### Disanalogies Bearing on the Paradox of Phenomenal Judgment
  **1. Representational Redundancy & Causal Links:**  
     - **In Vehicle:** The display *re-presents* information already encoded by algorithms (e.g., "obstacle detected" → red warning light). Algorithms *must* encode this data to generate the display.  
     - **In Mind:** Epiphenomenalism claims qualia *add* non-representational properties (e.g., raw redness) beyond computational states. If algorithms already encode *what* is experienced (e.g., "red object present"), this implies:  
       - (a) **Informational Overlap:** The judgment "I see red" relies on algorithmic representations *identical* to those generating the quale.  
       - (b) **Causal Link Reintroduced:** The algorithmic state causes *both* the quale and the judgment, making them correlates. This undermines the claim that qualia are *causally irrelevant* to reports—they may still be *metaphysically dependent* on shared causes.  

  **2. Smuggled Representational Relation:**  
     The analogy implies the display *represents* vehicle states to the passenger. But epiphenomenalism treats qualia as intrinsic properties, not representations. If phenomenology "represents" anything to the subject, it reintroduces a causal/informational role: the subject "reads" the display to form judgments. Excising this relation exposes the flaw:  
     - **Without Representation:** The passenger sees meaningless colors/sounds unrelated to vehicle states. Judgments like "I see red" become causally detached from both the display *and* the algorithms, rendering them arbitrary. Accuracy vanishes—the judgment has no connection to what it allegedly reports.  

  **3. Survival of Accurate Judgments:**  
     **No.** If the representational link is excised:  
     - Algorithms cause judgments *and* (separately) qualia.  
     - There is no mechanism to ensure judgments *match* qualia. The same judgment could occur with inverted/absent qualia (the paradox).  
     - The authority of first-person reports collapses, as judgments are blind to phenomenology.  

  ---

  ### Core Breakdown of the Analogy
  The analogy fails to capture **first-person immediacy** and **immunity to misrepresentation**:  
  - **First-Person Immediacy:** In consciousness, the subject doesn't "observe" qualia as a passive display; qualia *constitute* the experience itself. There is no "passenger" separate from the display—the subject *is* the experiencing of qualia.  
  - **Immunity to Error through Misrepresentation:** Judgments like "I am in pain" can't misrepresent the *phenomenal character* of the experience (I might mislabel it "discomfort," but I can't be wrong about *what it feels like*). The vehicle passenger *can* misrepresent the display (e.g., mistaking a warning light for a reflection).  

  ---

  ### Features an Adequate Analogy Must Preserve
  Any viable analogy must account for:  
  1. **Non-Representational Givenness:** Phenomenology is not *represented to* the subject; it is *present for* the subject.  
  2. **Judgment-Phenomenology Unity:** Phenomenal judgments are *constituted by* the phenomenology they report (e.g., thinking "I see red" *involves* the quale of redness).  
  3. **Incorrigibility:** Direct phenomenal judgments are immune to certain errors—they aren't "inferences" from internal displays.  

  **Conclusion:** The vehicle analogy mischaracterizes consciousness as a *representation* observed by a homunculus, smuggling in causal links that epiphenomenalism explicitly denies. Its excision fatally undermines the accuracy of phenomenal reports. A better analogy must reject the observer/display duality and capture the intrinsic self-intimation of consciousness—where phenomenology and self-awareness are inseparable. Without this, epiphenomenalism cannot resolve the paradox of phenomenal judgment.
