  what's your actual credence that the discursive dilemma is genuinely unavoidable in real-world democratic deliberation about concrete moral policies — say, whether a society should legalize assisted suicide, where premises might involve autonomy, harm reduction, and slippery-slope risks? i want a number, not "it depends."

  break it down: (a) the prob that moral reasoning actually has enough explicit premise-conclusion structure for the dilemma to arise in practice rather than just in abstract examples; (b) the prob that real groups aggregate judgments conclusion-by-conclusion rather than premise-by-premise, which is what makes the conflict visible; (c) the prob that no procedural fix — like requiring consistency or using a priority ordering — actually eliminates the problem without just hiding it; then combine them into an overall credence. also tell me which of a-c you're least sure about and what kind of empirical study or formal result would shift it most.

  oh and please don't just say "groups are irrational" — i want the decomposition to do all the work, and tell me whether my friend at high credence or me at low credence is closer to being right.
