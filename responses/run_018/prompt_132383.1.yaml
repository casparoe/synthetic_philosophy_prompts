answer: |-
  *(Leans forward, eyes sharp)* You're framing this as purely about regret, but you're missing the strategic dimension entirely. Even without an external audience, your past investment creates a *credible signal to your future self* about your resolve threshold. Abandoning the dissertation now tells your future self that three years of effort isn't enough to commit you to finishing hard projects. That erodes your own ability to trust your future follow-through. Finishing isn't therapy for past mistakes—it's enforcing a **binding intertemporal contract** that prevents future self-sabotage. Rationality isn't just about dollars; it's about governing your behavior across time. If you keep cutting losses the moment things get painful, you systematically undermine your capacity for long-term execution. The sunk cost here isn't wasted money—it's spent willpower cementing a self-discipline mechanism.
