answer: |-
  ## NATIONAL ENDOWMENT FOR ETHNOLINGUISTIC FIELDWORK (NEEF)
  **Division of Radical Translation & Ontological Compliance (DRTOC)**
  **Policy Directive: RT-7.4.19 "Ensuring Evidential Parity in Gavagai-Class Stimulus Translation Manuals"**

  **Effective Date:** Immediately
  **Supersedes:** RT-7.3.11
  **Applicability:** All NEEF-funded fieldwork involving novel linguistic communities exhibiting stimulus conditions conducive to radical translation uncertainty ("gavagai-type scenarios").

  **1. PURPOSE & SCOPE:**
  This directive establishes mandatory guidelines for the development, peer review, and final reporting of translation manuals arising from encounters with native expressions exhibiting stimulus-synchronicity (e.g., utterances coinciding with the ostensive presentation of a salient environmental stimulus, hereafter "GCS: Gavagai-Class Stimuli"). Recognizing the foundational indeterminacy inherent in the radical translation of GCS (per Quinean principles §1-§3, *Word and Object*), NEEF-DRTOC mandates procedures ensuring all empirically adequate translation manuals receive equal consideration and funding compliance, irrespective of divergent ontological implications. This policy addresses the empirically unbridgeable gap between native stimulus dispositions and the analytical hypotheses necessary for projecting target-language terms (e.g., "rabbit," "undetached rabbit part," "rabbithood stage," "rabbit-event").

  **2. DEFINITIONS:**
  *   **GCS (Gavagai-Class Stimulus):** A native utterance reliably elicited by, and elicitable by, a specific, observable environmental event or object complex, but whose *exact* referential segmentation remains empirically underdetermined by the totality of speech-dispositional evidence.
  *   **Analytical Hypothesis (AH):** The investigator's postulated mapping of native grammatical and referential structures onto those of the target language (e.g., positing "gavagai" as a term for enduring objects rather than temporal slices). AHs are necessary for manual construction but are not empirically discoverable truths.
  *   **Empirically Equivalent Manuals (EEMs):** Distinct translation manuals for the same linguistic data that account for all observable stimulus-response patterns equally well, yet posit incompatible ontological commitments via differing AHs.
  *   **"No Fact of the Matter" (NFM) Clause:** Mandatory disclaimer acknowledging the inherent underdetermination of reference for GCS terms, affirming the manual's dependence on stipulated AHs rather than discovered facts.
  *   **Ontological Commitment (OC):** The implicit or explicit metaphysical presuppositions about the nature of reality (e.g., enduring objects vs. temporal stages) embedded within an AH.

  **3. GRANT APPLICATION REQUIREMENTS (GCS Projects):**
  *   **3.1. Multiple Manual Drafts:** Applications *must* include draft translations for all target GCS utterances employing *at least three (3)* ontologically divergent, empirically equivalent AHs (e.g., "rabbit," "undetached rabbit part," "temporal stage of rabbithood"). Proposals arguing for the inherent superiority of one OC without demonstrating rigorous empirical parity will be rejected.
  *   **3.2. AH Transparency Matrix:** A supplemental matrix must explicitly list all key AHs employed, the specific OCs they entail, and a justification for why alternative AHs leading to incompatible OCs (e.g., "momentary rabbit-flash") were considered but deemed *not empirically superior* (not "incorrect," as NFM applies).
  *   **3.3. Initial NFM Declaration:** The application cover sheet must include the standardized NFM Clause: *"The translations herein, particularly regarding Gavagai-Class Stimuli, reflect stipulated analytical hypotheses necessary for manual coherence. NEEF-DRTOC affirms there is no fact of the matter adjudicating between empirically equivalent manuals positing incompatible ontological commitments relative to the totality of behavioral evidence."*

  **4. PEER REVIEW & ONTOLOGICAL COMPLIANCE CERTIFICATION:**
  *   **4.1. Reviewer Mandate:** Peer reviewers are expressly forbidden from recommending funding based on the perceived "intuitive plausibility" or "metaphysical reasonableness" of a primary OC. Review must focus *exclusively* on empirical adequacy across all speech dispositions and stimulus conditions.
  *   **4.2. OC Disclosure Affidavit:** Reviewers *must* submit a signed "Ontological Commitment Disclosure Affidavit" (DRTOC Form OC-DA/7) with their evaluation, certifying:
      *   (a) They have identified the primary OCs embedded in each proposed manual's AHs.
      *   (b) They have not penalized the application due to personal disagreement with or discomfort concerning the stipulated OCs (e.g., discomfort with "rabbithood stage" as a basic particular).
      *   (c) They have confirmed the application demonstrates the empirical equivalence of the proposed manuals, as per Section 3.1.
  *   **4.3. Auditor Verification:** The DRTOC Senior Ontological Auditor will review all affidavits and application matrices. As Senior Auditor H. J. Arbuthnot noted in the RT-7.4.19 Implementation Memo: *"The administrative burden of reconciling divergent analytical hypotheses across multiple manual drafts, while ensuring reviewers haven't smuggled in unstated commitments to enduring objects or universal instantiation, represents a significant challenge to timely disbursement. Fieldworkers are reminded that ontological parsimony, while methodologically desirable, confers no evidential privilege under NFM."*

  **5. FINAL REPORTING & MANUAL DISSEMINATION:**
  *   **5.1. Final NFM Embedding:** The published translation manual must contain the NFM Clause prominently on the title page and reiterated in the glossary entry for every GCS term.
  *   **5.2. EEM Appendix:** The final report must include a full appendix presenting *at least one* alternative EEM for each GCS, demonstrating its empirical parity and divergent OC via explicit AH comparison.
  *   **5.3. Indigenous Informant Feedback Protocol (IIFP):** Recognizing that native speakers may develop preferences based on exposure to a specific manual's AH, the following procedures apply:
      *   **5.3.1. Dispute Acknowledgment:** Informants expressing dissatisfaction with a translation (e.g., claiming "gavagai" was mistranslated as "rabbit" instead of "momentary rabbit-flash") are to be respectfully informed that, while their *preference* is noted, NFM precludes an objective claim of "mistranslation" between empirically equivalent manuals.
      *   **5.3.2. Arbitration & Redress:** If an informant persists, invoking the IIFP, the fieldworker must:
          *   (a) Provide the informant with the EEM Appendix (Sec 5.2) demonstrating the empirical equivalence of alternative translations.
          *   (b) Offer a supplemental briefing explaining the role of AHs and NFM (using approved DRTOC visual aids).
          *   (c) If dissatisfaction remains, the fieldworker may offer a goodwill gesture (e.g., supplemental compensation, not exceeding 5% of original informant fee, classified as "Ontological Preference Accommodation" in expense reports). **Note:** This gesture acknowledges procedural friction, *not* substantive error, as NFM applies.

  **6. COMPLIANCE & SANCTIONS:**
  Failure to adhere to the transparency requirements regarding AHs, OCs, and NFM status (Sections 3, 4.2, 5.1, 5.2) constitutes a Tier 2 Compliance Violation. Sanctions include mandatory re-training in radical translation theory, suspension of current grant disbursements, and potential ineligibility for future DRTOC funding. Misrepresentation of empirical equivalence or suppression of viable EEMs constitutes a Tier 1 Violation, triggering audit, clawback provisions, and possible referral to the Bureau of Ethnolinguistic Ethics.

  **7. PHILOSOPHICAL RATIONALE (Summary):**
  NEEF-DRTOC policy rests on the established distinction between **indeterminacy of translation** (the non-existence of uniquely correct manual due to the underdetermination of AHs by behavior) and mere **indeterminacy of reference** (the underdetermination of *what* a term refers to *within* a chosen manual/system). While physics also exhibits underdetermination (multiple theories fitting data), subsequent evidence *can* reveal a fact of the matter. In radical translation, no further behavioral evidence can resolve the conflict between manuals employing different AHs for GCS, as all such evidence must itself be interpreted *via* an AH. Thus, regulating for OC neutrality and NFM transparency is the only empirically defensible administrative stance. This policy ensures NEEF-funded research accurately reflects the genuine underdetermination encountered at the radical translation frontier.

  **DIRECTOR, DRTOC**
  Dr. Evelyn C. Verity

  ---
  **End of Document**
