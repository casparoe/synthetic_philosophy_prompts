  I'm trying to locate exactly where my disagreement with a colleague lives. I maintain that conciliationism in peer disagreement admits a coherent, non-question-begging stopping point—specifically, that the regress of revising one's confidence about how to weight peer disagreement can be blocked at the level of methodological commitments without collapsing into hidden steadfastness or arbitrary foundationalism. She holds that any such block is either disguised steadfastness or an unjustified epistemic privilege, so the regress continues until one party abandons conciliationism altogether. My credence that a genuinely non-question-begging stopping point exists is about 0.65; hers is about 0.25. Give me your own number, but more importantly decompose the claim precisely. Break the question into at least four sub-questions: (a) whether epistemic peerhood is transitive across first-order and methodological domains, (b) whether methodological commitments are the appropriate kind of mental state for conciliation at all, (c) whether an agent can possess private, non-collapsing evidence about the reliability of her own reasoning process that licenses local steadfastness without violating peer symmetry, and (d) whether blocking the regress necessarily requires a foundationalist or coherentist architecture of justification. Assign a rough probability to each sub-question, show approximately how they combine into your overall credence, and identify which single sub-question your final number is most sensitive to. Then, comparing my 0.65 and her 0.25, indicate which of the four sub-questions most likely explains the gap between us, and describe what specific argument or observation—one that does not depend on resolving the first-order disagreement itself—would move your own number the most.
