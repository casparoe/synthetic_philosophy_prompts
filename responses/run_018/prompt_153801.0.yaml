answer: |-
  Here's the full exam package tailored to your specs—casual, conceptual, and no fluff. Designed for sharp 60-minute takes:

  ---

  ### **Essay Question (Put this on the exam sheet)**  
  *"Ubuntu's 'I am because we are' grounds personhood in human relationships. But when communal norms demand harm (e.g., shunning dissenters), does this relational model accidentally erase individual moral accountability? Now imagine a 'distributed personhood' model where agency is spread across humans, animals, ecosystems, and tech. Can Ubuntu stretch to include non-human nodes *without* letting everyone blame the network for bad acts? Or does its ethical core depend on keeping personhood strictly human-to-human? Defend your stance."*

  ---

  ### **Model Answer (Ideal Student Response)**  
  *"Ubuntu avoids full collectivism because accountability lives in reciprocal relationships, not the group-mind. When Person A harms Person B, it fractures the *ubuntu* bond, forcing restoration through dialogue—so individuals aren’t dissolved. But if we bolt on 'distributed personhood' (e.g., a farmer blaming drought for his choice to steal water), Ubuntu’s reciprocity breaks. Non-human nodes can’t negotiate repairs. Ubuntu’s core is human mutuality: you can’t demand ethical responsibility from a river. Expanding to non-humans flattens agency into vague 'system effects,' making blame impossible. Ubuntu survives only if we keep its human relational circuit—accountability demands dialogue partners who can answer back."*  

  ---

  ### **Marking Scheme (20 points total)**  
  **Aim for 5 conceptual moves. 4 points each**  
  1. **Distinguishes Ubuntu from crude collectivism** (e.g., notes *individuals* hold duties via relational bonds).  
     *Common miss: Equates Ubuntu with hive-mind communism.*  
  2. **Pinpoints accountability in reciprocity** (harm violates mutual humanity → requires active repair by specific persons).  
     *Common miss: Vaguely says "community judges" without naming who bears responsibility.*  
  3. **Critiques distributed personhood’s agency problem** (non-human nodes can’t participate in dialogue/repair → erodes blame).  
     *Common miss: Gets distracted debating if trees have rights, misses the accountability mechanics.*  
  4. **Tests Ubuntu’s "ethical core" (mutuality) against expansion** (if reciprocity requires human responses, non-humans break the circuit).  
     *Common miss: Assumes Ubuntu can absorb non-humans because "everything’s connected."*  
  5. **Takes a clear stance with stakes** (e.g., "Ubuntu loses its teeth if stretched" or "Human-only focus is its strength").  
     *Common miss: Waffles without resolving the tension.*  

  **+ Bonus 1-2 pts for style/clarity if they nail all five.**  

  ---

  ### **Why This Works for Your Crew**  
  - **Niche twist delivered**: Distributed personhood forces them beyond human-centrism while testing Ubuntu’s limits.  
  - **Harm scenario embedded**: Sanctioned oppression (e.g., shunning) prevents sugarcoating community ethics.  
  - **Upper-level rigor**: No summaries—just dialectical pressure on agency metaphysics.  
  - **Time-crunched**: 60 mins is tight, so the 5-move structure prevents rambling.  

  This’ll separate the deep thinkers from the bullshitters. Good luck with the novelist-to-philo-prof gig—sounds like a hell of a story. 🍷
