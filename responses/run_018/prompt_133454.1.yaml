answer: |-
  ## Proposal: The Ontology of Violence Metrics - When Declining Harm Events Mask Rising Structural Risk

  **Research Question:**  
  Can claims that "global violence is declining" be determinately true when kinetic incidence (actualized harm events) decreases while structural accessibility (systemic conditions enabling harm) increases, or does this divergence demonstrate that such claims are inherently ambiguous due to the composite nature of "violence"?

  **Problem Statement:**  
  Public and academic debates on whether global violence is decreasing often treat disagreement as purely empirical – resolvable through better data on casualty rates. However, this project contends a significant portion of the disagreement is ontological. "Violence" lacks a single, natural unit of measurement. Choices about normalization (e.g., per capita, per conflict, per weapon) implicitly embed normative judgments regarding whose vulnerability matters and what constitutes violence. The proposed distinction between **Kinetic Incidence (KI)** – observable events causing direct physical harm (e.g., battle deaths, homicides) – and **Structural Accessibility (SA)** – the systemic conditions making harm readily actualizable (e.g., proliferation of arms, institutional fragility, normalized dehumanization, technological enablement of conflict) – reveals a critical gap. Even perfect KI data cannot capture shifts in SA. This project asks: if KI falls while SA rises, is a global claim of "decreasing violence" determinately true, false, or fundamentally ambiguous? Standard empirical approaches ignore SA, while normative critiques often lack a framework for analyzing the interaction and potential divergence of these distinct dimensions.

  **Why Existing Approaches Leave the Question Open:**
  1.  **Empirical Focus:** Dominant metrics (e.g., PRIO/UCDP battle deaths, WHO homicide stats) measure KI exclusively. They assume declining KI *is* declining violence, neglecting the latent potential captured by SA.
  2.  **Normative Limitations:** Critics highlight biases in measurement choices but rarely provide an alternative ontological framework for *defining* and *comparing* the composite phenomenon when its core components trend oppositely.
  3.  **Composite Blind Spot:** There is no established method for determinately assessing the "violence level" when the KI and SA components diverge. This renders global claims potentially indeterminate.

  **Methodology (4 Months):**
  *   **Month 1: Conceptual Groundwork:** Rigorously define KI and SA, identifying core constitutive elements of each. Analyze existing violence metrics (e.g., battle deaths, conflict frequency, arms trade data, fragility indices) to determine which dimension(s) they primarily capture. Develop a taxonomy of normalization choices and their implicit normative commitments.
  *   **Month 2: Modeling Divergence - Comparison Cases:** Construct 2-3 clear, formalized hypothetical or historical comparison cases illustrating KI/SA divergence (e.g., *Case A:* Low KI (post-conflict ceasefire) + High SA (mass arms proliferation, weak institutions); *Case B:* High KI (active conflict spike) + Low SA (strong norms against escalation, limited WMD access); *Case C:* Synchronicity (High KI/High SA - major war; Low KI/Low SA - stable peace)). Analyze the plausibility of claiming "violence" is higher or lower in each case based solely on KI vs. incorporating SA.
  *   **Month 3: Evaluating Ambiguity:** Systematically evaluate scenarios where KI decreases while SA increases. Assess arguments for: a) KI dominance (violence *is* actual harm), b) SA dominance (risk *is* violence), c) indeterminacy (the claim lacks a determinate truth value without specifying the dimension), d) weighted composite (requiring an explicit, normative weighting scheme). Identify the conditions under which a global claim becomes ambiguous.
  *   **Month 4: Synthesis & Deliverable Framing:** Synthesize findings into a coherent framework. Refine the evaluative criteria for assessing "violence is decreasing" claims in light of KI/SA divergence. Finalize the core deliverable.

  **Deliverable:**  
  A publicly accessible research note (approx. 3,000 words) presenting:
  1.  The KI/SA distinction and its justification.
  2.  Analysis demonstrating how common metrics map (or fail to map) onto KI and SA.
  3.  Formalized comparison cases illustrating divergence.
  4.  A clear evaluative framework outlining when and why claims about global violence trends become ambiguous or require explicit dimensional/normative specification.
  5.  Implications for researchers, policymakers, and public discourse: urging caution with composite claims and advocating for dimensional transparency.

  **Success Criteria:**  
  The project succeeds if it: 1) Provides a clear, justified distinction between KI and SA; 2) Successfully demonstrates the *possibility* and *significance* of their divergence using structured cases; 3) Develops a logically coherent framework showing *why* divergence creates ambiguity in global claims; 4) Delivers a useful tool (the research note) for critically evaluating violence trend narratives.

  **Failure Criteria:**  
  The project fails if: 1) The KI/SA distinction proves incoherent or collapses upon analysis; 2) Divergence scenarios are unconvincing or irrelevant to real-world debates; 3) The ambiguity conclusion is shown to be trivially true or easily resolvable by existing methods; 4) The final framework offers no practical insight beyond stating the obvious ("it's complicated").

  **Scope Assessment:**  
  This project is ambitious but achievable in four months for a solo researcher due to its tightly focused conceptual core and well-defined milestones. It avoids extensive empirical data gathering, relying instead on conceptual analysis, logical argumentation, and targeted modeling of comparison cases. The emphasis is on *establishing the framework and demonstrating the problem*, not on comprehensive historical analysis. Key risks are over-scoping the comparison cases or getting bogged down in philosophical nuances. Mitigation involves strict adherence to the phased plan and focusing on paradigmatic examples. This bites off a challenging but manageable piece.

  **Confidence Note:**  
  I am highly confident in the core insight that ontological ambiguity underlies much empirical disagreement and that the KI/SA distinction captures a crucial, underexplored dynamic. **The point I am least sure about is the optimal method for operationalizing "Structural Accessibility" in a way that is concrete enough for meaningful comparison without oversimplifying its systemic nature.** Defining measurable proxies for SA's latent potential remains challenging.
