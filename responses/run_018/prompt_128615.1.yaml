answer: |-
  ## Dialogue: The Architecture of Future Selves

  **Setting:** Philosophy of Biology Seminar, University of Pontryagin  
  **Participants:**  
  *   **Dr. Aris Thorne:** Defends refined adaptationist account of moral-future asymmetry.  
  *   **Dr. Lena Kowalski:** Defends predictive coding spandrel account of moral-future asymmetry.  

  **(Dr. Thorne steps to the podium)**

  **Thorne:** Thank you. The human asymmetry Lena describes – applying near-absolute deontological obligation to actions affecting our distant future selves while simultaneously hyperbolically discounting that same self's welfare in affective and economic contexts – is indeed striking. But I contend it reveals sophisticated functional design, not architectural happenstance. First, consider its *social utility*. Binding oneself morally to a future self acts as a powerful, externally observable *commitment device*. Announcing "I *must* save for retirement" or "I *should not* neglect my health" signals reliability and long-term planning capacity to potential coalition partners, enhancing trust and cooperation stability. Second, the *separation of mechanisms* is crucial: the linear, rule-based moral evaluation operates in the social-linguistic domain, optimized for communication and norm enforcement. Hyperbolic discounting, however, governs private, visceral, affect-laden forecasting – precisely where steep discounting of uncertain future states might have been advantageous in ancestral environments. Third, the *specificity of the asymmetry* matches this design logic: we don't morally hyper-discount future selves in social contexts, nor do we linearly discount them in private, hedonic ones. This bespeaks targeted selection pressures for reputation management and private resource allocation efficiency.

  **(Dr. Kowalski steps forward)**

  **Kowalski:** Aris, your commitment-device argument is elegant, and I agree social pressures are critical. But it conflates a *current utility* with an *evolutionary origin*. The asymmetry arises inevitably, I argue, from the brain's core architecture: hierarchical predictive coding. This system evolved for efficient sensorimotor control, predicting sensory inputs and minimizing prediction errors. Crucially, it operates with *fuzzy, probabilistic, affectively tagged representations* of future states – yielding hyperbolic discounting naturally. Now, layer on top of this the much later evolutionary arrival: complex language and recursive self-modeling. This requires generating coherent, discrete, *symbolic narratives* about the self across time – "I *am* the same person who will suffer tomorrow." But this linguistic self is fundamentally incompatible with the affective, probabilistic future-self representation. The deontological stance – "I *must* do X for my future self" – is not an adaptation *for* commitment, but a necessary *kludge*. It's the brain forcing coherence between the incommensurable affective future (discounted) and the symbolic narrative future (requiring continuity for linguistic coherence), generating the illusion of a binding moral obligation as a byproduct. It’s structurally constrained, not optimally designed. Where's the efficiency in an architecture that so spectacularly fails to align valuation systems?

  **Thorne:** Lena, you rightly press on the origin question. But your "kludge" argument struggles with the specificity. If it were merely a byproduct of forcing incompatible systems into coherence, why the *particular* form? Why doesn't the symbolic system simply adopt the affective discounting for moral judgments too? Why the *asymmetry* favoring rigid deontic logic for the moral future self? This seems precisely what a commitment device *would* look like – it overrides the noisy affective prediction for socially critical declarations, stabilizing them with rule-based rigidity. Furthermore, comparative primatology offers suggestive evidence. Chimpanzees show precursors to delayed gratification and reciprocity, suggesting selection pressures for future-oriented behavior. But they lack the linguistic self-modeling and the stark deontic/non-deontic split we see in humans. Doesn't this imply the human asymmetry co-evolved with symbolic capacity *for* enhanced social coordination?

  **Kowalski:** The specificity arises *from* the constraints, Aris! The symbolic system *must* posit a continuous, identical self for narrative coherence – "I" am the referent across time sentences. Affective forecasting *cannot* represent this identical self; it deals in probabilistic outcomes tagged with valence *now*. The deontic stance ("must") emerges precisely as the linguistic system's tool to *stabilize* this narrative continuity against the affective system's inherent discounting noise. It's not *designed* to be rigid; rigidity is a *consequence* of trying to make an inherently unstable linguistic construct (the identical future self) hold against a conflicting underlying representation. Regarding chimps: they show discounting and social planning, but crucially, *without* the explicit linguistic self-narrative or complex deontic reasoning. They manage commitments through simpler mechanisms like emotional bonds or dominance hierarchies. The human asymmetry only appears with the full suite of language and recursive thought – supporting its emergence as a *consequence* of that cognitive architecture, not its driver.

  **Thorne:** But Lena, doesn't treating it solely as a spandrel merely relocate the explanatory burden? You say "must" emerges to stabilize the narrative. *Why* is that stabilization mechanism deployed specifically in contexts involving obligations *to* the future self, and why does it take this deontic, rule-like form? Why isn't it a different kind of coherence mechanism? My adaptationist account provides a functional answer: the rule-like form is communicable, enforceable, and credible precisely *because* it appears rigid and objective, unlike fluctuating affect. The spandrel view risks being merely descriptive of the conflict without explaining *why* the resolution takes this particular, socially functional shape. Furthermore, evidence from artificial predictive systems is illuminating. When we build AI systems combining deep learning (akin to affective prediction) with symbolic rule engines (akin to deontic reasoning) for long-term planning in social simulations, we often observe *engineered* separations precisely to avoid the discounting problem in public commitment declarations. Isn't this analogous to evolved separation?

  **Kowalski:** Aris, the "why this form" question cuts both ways. If it *were* a dedicated adaptation for commitment, why is it so cognitively brittle and prone to spectacular failures – like people sincerely vowing to save while simultaneously maxing out credit cards? An engineered commitment device would likely integrate valuation better. The deontic form arises *because* language traffics in rules and obligations – it's the linguistic toolkit available for imposing coherence. It's not chosen *for* its social function; it's co-opted *because* it's there. Your AI example is telling: engineers *impose* separation *because* they recognize the conflict – mirroring the evolutionary *constraint*. But in biology, the separation isn't cleanly designed; it's a messy accommodation. The brittleness *is* the evidence of architectural constraint, not poor design. The functional utility you see is real, but it's likely *exaptive* – the asymmetry exists for structural reasons, and its social utility is a *later* benefit captured by the existing cognitive setup, not the original driver shaping its form. The burden isn't relocated; it's correctly placed on understanding the generative constraints of the cognitive architecture.

  **Thorne:** Yet, Lena, the very fact that this 'messy accommodation' aligns so well with a critical social function – managing long-term commitments in a species utterly dependent on cooperation – suggests more than mere coincidence. The brittleness might simply reflect the inherent tension between immediate impulses and long-term goals, a tension present in any complex system, not evidence against adaptation for managing it socially. The specific *alignment* of the asymmetry with social needs remains powerfully suggestive of selective shaping, even if built upon existing cognitive substrates.

  **Kowalski:** And Aris, the fact that this 'alignment' requires such profound cognitive dissonance and systematic irrationality at the individual level – precisely because the underlying representations *don't* align – is powerfully suggestive of a structural constraint overcome only imperfectly by linguistic band-aids, not a well-engineered solution sculpted by selection. The social benefit exploits the kludge; it doesn't explain its genesis.

  **(Moderator signals time)**

  **Verdict:** The dialogue founders on whether the precise form of the moral-future asymmetry indicates optimal functional design for social commitment or reveals the unavoidable structural signature of integrating incompatible temporal representations within a predictive brain.
