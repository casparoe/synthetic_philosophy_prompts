prompt: |-
  I've been trying to work out my actual position on whether cross-cultural moral variation undermines objectivity, moving past the standard WEIRD-psychology summary and the reflexive "relativism is self-defeating" reply that dominates rationalist forums. I have a tentative framework: moral disagreement is "shallow"—compatible with a single correct account—when it stems from (i) different empirical beliefs about outcomes, (ii) different jurisdictional allocations of moral authority (who enforces, who is held responsible), or (iii) context-sensitive weighting of shared values under different social conditions. It is "deep"—genuinely threatening to objectivity—only when one culture denies that a class of beings possesses basic moral status at all, rather than merely holding that harming them is overridden by other considerations. I want to know whether this principle actually captures my judgments, where it breaks, and which verdicts I should abandon.

  Here are my concrete reactions. The familiar divergence in moral-foundations weightings—WEIRD populations emphasizing harm and fairness, other societies weighting loyalty, authority, and purity more heavily—feels shallow: it is a difference in salience and social scale, not in whether harm or fairness are genuinely normative. Societies that delegate punishment to ancestors or spirits rather than human courts also seem shallow, differing only in jurisdiction, not in whether the underlying act is wrong. Historical infanticide practiced under extreme resource scarcity strikes me as shallow if driven by false empirical premises about suffering or survival prospects, but deep if grounded in a genuine denial that newborns have moral standing. Funerary cannibalism versus burial or cremation also feels shallow: the same underlying value—respect for the dead—is expressed through symbolically coherent but incompatible rituals. By contrast, lying to comfort a dying patient is permitted in some traditions and forbidden in others, and I classify that as shallow virtue-weighting—yet I am unsure what structurally distinguishes it from harder cases.

  The trouble case is a small-scale society with strict clan boundaries and no individual concept of moral agency: within the clan, all judgment is delegated to elders, and individuals speak only of "breaking rules" rather than "being wrong"; outside the clan, harming strangers is not overridden but literally unthinkable as a moral category—there is no concept of "wronging" them at all. I initially classify this as deep ontological divergence, because outsiders appear excluded from moral status. But I worry I am being inconsistent: if all moral authority is structurally centralized in the clan, the absence of cross-group obligations might just be extreme jurisdictional boundary-drawing, analogous to legal citizenship, rather than a denial that outsiders can be wronged. Meanwhile, I think the infanticide judgment should stay deep only when status is denied, not when it is empirically mistaken—yet I have no clear criterion for telling the two apart in practice. Can you articulate a precise principle, or a small family of them, that saves as many of these verdicts as possible? For each clause, identify the case that motivates it and state its verdict on a case I have not listed—specifically, a culture in which all moral reasoning is conducted through divination with no causal-empirical mediation, but applies uniformly to clan members and strangers alike. Be honest about which of my intuitions the principle cannot accommodate without ad hoc modification. Finally, please separate what is broadly settled in the relevant anthropological and philosophical literature from what remains genuinely contested among specialists—do not present a disputed framing, such as the claim that moral foundations are entirely culturally constructed without biological or universal components, as if it were the consensus view.
reasoning: |-
  Okay, let me unpack this user's query. They're grappling with moral objectivity in the face of cross-cultural variation, moving beyond standard WEIRD critiques and relativism debates. Their framework distinguishes "shallow" vs "deep" disagreement based on three criteria: empirical beliefs, jurisdictional allocations, and context-sensitive weighting. The deep threat comes only when a culture denies moral status entirely to a class of beings.

  Looking at their examples: moral foundations theory differences feel shallow to them because harm/fairness remain normative even if weighted differently. Ancestral punishment systems seem jurisdictional. Infanticide is shallow if based on false empirical beliefs but deep if newborns are denied moral status. Funerary practices are shallow symbolic variations. The lying-to-dying-patients case puzzles them as virtue-weighting.

  The tough case involves a clan-based society without individual moral agency internally and no concept of wronging outsiders. The user wavers between seeing this as deep ontological divergence or extreme jurisdictional boundaries. They also struggle to distinguish between denying moral status versus having empirically mistaken beliefs about it.

  For the divination-based culture where moral reasoning is entirely oracle-driven but applies universally, I need to apply their framework. Since moral status isn't denied to any group, this might qualify as shallow - it's an epistemological difference about how moral truths are accessed, not about who qualifies for moral consideration.

  I should note where their intuitions might need adjustment. The clan/outsiders case challenges their framework - denying the very concept of wronging might be deeper than jurisdictional allocation. Their infanticide distinction relies on contested intentional-state attribution. The divination case reveals that epistemology can fundamentally shape morality without denying status.

  In the literature, there's consensus that moral variation exists but disagreement on what it implies. Universalist components in moral psychology are established, while the biological vs cultural construction of foundations remains debated. The objectivity question is philosophically unresolved, with prominent defenses like human flourishing accounts existing alongside robust relativist arguments.

  The user seems intellectually sophisticated - they've moved past superficial debates and constructed a nuanced framework. Their frustration with rationalist forum tropes suggests they want substantive engagement. The request for honesty about contested claims indicates they value academic rigor over rhetorical victory. This is advanced metaethics applied to real anthropological cases - exactly the kind of discussion that benefits from careful philosophical analysis.
answer: |-
  Your framework is remarkably sophisticated and captures nuanced distinctions often missed in popular discussions. Let's systematically evaluate it, identify pressure points, refine principles, and situate this within academic consensus/controversy.

  **Core Principle Refined:**  
  Moral disagreement is **shallow** (compatible with objectivity) iff:  
  1.  **Empirical Divergence:** Cultures share core values but disagree on non-moral facts (e.g., outcomes, causal relationships).  
      *Case:* Infanticide under scarcity *if* driven by false beliefs about infant suffering/survival odds.  
      *Verdict:* Shallow.  
  2.  **Jurisdictional Allocation:** Cultures agree an act is wrong *simpliciter* but assign responsibility for judgment/enforcement differently (e.g., ancestors vs. courts, clan elders vs. individuals).  
      *Case:* Delegating punishment to spirits; strict clan-bound authority structures.  
      *Verdict:* Shallow (if the *wrongness* itself isn't denied).  
  3.  **Contextual Weighting:** Cultures share a set of basic values but prioritize/balance them differently under varying material/social conditions.  
      *Case:* WEIRD vs. non-WEIRD moral foundations weighting; funerary rituals; truth-telling to the dying.  
      *Verdict:* Shallow.  

  Moral disagreement is **deep** (threatening objectivity) iff:  
  4.  **Ontological Exclusion:** A culture *denies that a class of beings possesses basic moral status* (e.g., capacity to be wronged, inherent worth demanding consideration), rather than merely permitting harm due to overriding values or empirical error.  
      *Case:* Infanticide *if* grounded in the belief newborns lack moral standing; systematically denying outsiders *any* moral standing (not just priority).  
      *Verdict:* Deep.  

  **Pressure Points & Your Intuitions:**  

  1.  **The Clan/Outsider Case:**  
      *   **Your Framework Says:** Potentially Shallow (extreme jurisdictional allocation).  
      *   **Your Intuition:** Leans Deep (ontological exclusion).  
      *   **Conflict:** The key is whether "no concept of wronging outsiders" constitutes a *denial of moral status* (Deep, Principle 4) or merely an extreme form of *who has jurisdiction/responsibility* (Shallow, Principle 2).  
      *   **Resolution Suggestion:** The framework needs refinement on *scope*. Principle 2 (Jurisdiction) presupposes a shared understanding of wrongness *somewhere*. If a culture lacks *any* concept of "wronging" applicable to outsiders – not just that *they* aren't responsible, but that *no one* could be wronged *by* harming them – this tips into Principle 4 (Ontological Exclusion). **Verdict:** Deep. Your intuition holds, requiring a stricter reading of Principle 2: Jurisdictional allocation assumes the *category* of wrongness exists but is assigned; ontological exclusion denies the category itself for certain beings.

  2.  **Infanticide: Denial vs. Error:**  
      *   **Problem:** Distinguishing "denies moral status" from "has false belief leading to permissible harm" is empirically fraught. How do we access the *grounds* for the practice?  
      *   **Framework Limitation:** Your framework relies on attributing specific intentional states (denial vs. error), which is often ambiguous in anthropological evidence or even self-reports.  
      *   **Mitigation:** Focus on *conceptual resources* and *counterfactuals*. Does the culture possess the *concept* of moral status for newborns but apply it erroneously (Shallow, Principle 1)? Or is the concept *absent* or *explicitly denied* for that class (Deep, Principle 4)? E.g., If they say "Killing babies is wrong *but necessary*," it's likely shallow error/weighting. If they say "Babies aren't full persons yet," it might be deep exclusion. **Your distinction stands, but its application is epistemically challenging.**

  3.  **Lying to the Dying vs. Harder Cases:**  
      *   **Your Classification:** Shallow (virtue weighting - truth vs. compassion).  
      *   **Structural Distinction:** This fits Principle 3 (Contextual Weighting). Cultures likely share values of honesty and compassion but prioritize them differently *in this specific context*. The key is that both sides recognize the *conflict* between genuine values. This differs from ontological exclusion (Principle 4) where one "value" isn't acknowledged as such by the other side.

  **The Divination Case:**  
  *   **Culture:** All moral reasoning conducted *exclusively* via divination (oracle bones, spirit possession, etc.), with no appeal to causal-empirical consequences. Applies uniformly to clan members and strangers.  
  *   **Framework Verdict:** **Shallow.**  
      *   *Why?* Principle 4 (Ontological Exclusion) is absent – moral status is granted universally (to clan *and* strangers). The disagreement lies in the *epistemology of moral truth* (how we *know* what's right/wrong), not in *who matters* or the *core nature* of right/wrong. This resembles Principle 2 (Jurisdiction) but applied to *epistemic authority* rather than enforcement authority. The *source* of moral knowledge is different (divination vs. reason/empiricism), but the output (judgments applied universally) suggests shared underlying commitments to moral status and potentially shared norms (e.g., don't murder, steal). It's a profound methodological difference, not necessarily a deep ontological one about moral status.

  **Intuitions the Framework Struggles to Accommodate (Without Ad Hoc Tweaks):**

  1.  **The Epistemic Worry in the Divination Case:** Your framework focuses on *what* is valued and *who* has status. The divination case highlights *how moral truths are known*. If a culture's epistemology renders moral truths fundamentally inaccessible to human reason/experience and reduces them entirely to arbitrary (from our view) divine pronouncements, does this *itself* threaten objectivity? Your framework says "shallow" (as above), but this might feel unsatisfying – it seems to make morality *radically* contingent on specific supernatural interventions. This pushes towards debates about moral epistemology and realism that your framework (wisely) initially brackets.
  2.  **The "Feeling" of Depth in Jurisdictional Extremes:** Your intuition in the clan case leaned deep even though jurisdictional allocation (Principle 2) *could* cover it. The refined principle (requiring the *category* of wrongness to exist) helps, but extreme jurisdictional boundaries *can* functionally resemble ontological exclusion in practice, creating a grey zone. The framework prioritizes conceptual analysis over functional impact.

  **Academic Consensus vs. Controversy:**

  1.  **Settled/Strong Consensus:**  
      *   **Variation Exists:** Cross-cultural moral variation is a well-documented empirical fact (anthropology, cultural psychology).  
      *   **Not *Just* WEIRD:** Critiques of over-reliance on WEIRD samples are valid and widely accepted; broader sampling reveals greater diversity.  
      *   **Biological & Universal Components Exist:** Humans share innate capacities for empathy, reciprocity, in-group loyalty, and intuitive distinctions like harm/non-harm (Haidt, Hauser, Tomasello). Basic moral emotions (disgust, anger, compassion) have universal roots. Young children show core moral intuitions.  
      *   **Relativism Isn't Trivially Self-Defeating:** Sophisticated relativism (e.g., Horgan & Timmons, Wong) avoids crude self-refutation charges by relativizing truth *to frameworks*. The "self-defeating" argument targets naive formulations.  
      *   **Objectivity is Defensible Despite Variation:** Prominent defenses exist (e.g., Boyd's moral realism, Railton's social functionalism, Nussbaum's capabilities, Parfit's normative reasons). Variation alone doesn't *necessitate* relativism.

  2.  **Genuinely Contested:**  
      *   **Extent of Variation vs. Universality:** How deep does variation go? Are there truly universal *norms/content*, or only universal *domains/problems* (e.g., harm, fairness, hierarchy) solved differently? (Moral Foundations Theory itself is contested on this).  
      *   **Biological vs. Cultural Construction:** The relative contribution of innate biology vs. cultural learning/construction to observed variation in specific norms and weightings is hotly debated. **Crucially, the claim that moral foundations are *entirely* culturally constructed *without* biological/universal components is *not* consensus; it's a highly contested minority view.**  
      *   **Implications for Objectivity/Relativism:** Whether observed variation best supports realism, relativism, constructivism, or error theory remains a core philosophical battleground. No resolution in sight.  
      *   **The Nature of "Deep" Disagreement:** Whether genuine "faultless disagreement" exists and what it implies is deeply controversial (e.g., MacFarlane's relativism vs. Boghossian's objectivism).  
      *   **Moral Status & Personhood:** Criteria for moral status/personhood (sentience, rationality, relationality, etc.) and how to handle marginal cases (animals, infants, severely disabled) are perennially disputed.

  **Conclusion:**  
  Your framework is powerful and largely coherent, capturing key distinctions between superficial and profound moral differences. The refinement on Principle 2 (Jurisdiction requiring the *category* of wrongness to exist) saves your clan/outsider intuition. The divination case is correctly classified as shallow under your principles, though it exposes an epistemic challenge your framework doesn't directly address. The hardest practical problem remains distinguishing genuine ontological exclusion (Deep) from severe empirical error or contextual override (Shallow) in specific cases like infanticide. This requires careful attention to a culture's conceptual resources and justificatory structure.

  Your intuitions are largely salvageable. The main cost is acknowledging the epistemic difficulty in cleanly applying the infanticide distinction and accepting that the divination case, while profoundly different epistemically, doesn't threaten the core of your framework focused on status and values. The academic landscape confirms the reality of variation but rejects simplistic "biology vs. culture" dichotomies or the idea that variation alone settles the objectivity debate against realism. Your approach aligns well with sophisticated pluralist-realist positions (like Wong or Nussbaum) seeking to explain variation while preserving objectivity.
