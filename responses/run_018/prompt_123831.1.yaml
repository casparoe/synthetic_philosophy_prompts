  I notice tension in their setup: calling it "maximal moral goodness" while describing what sounds like bad moral psychology. That might be why my combined credence lands slightly below theirs at 0.56. The most volatile term is #4 - if new work convincingly showed all reasons are agent-neutral (like some consequentialisms), my 0.7 could crash to 0.3.

