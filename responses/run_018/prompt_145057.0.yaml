  Looking at the four-step sequence described: evolutionary explanation → companions-in-guilt reply → structural distinction → empirical validation through variation. The unique feature is how the empirical observation (variation in moral beliefs vs. convergence in math) is used to validate the structural distinction while potentially presupposing the debunking conclusion. 

  I recall Shafer-Landau's work on explanatory isolation strategies, and Vavova's discussion of premise circularity in debunking arguments. The pattern resembles what's sometimes called the "differential genealogical strategy" but with problematic circularity in its empirical validation step. 

  For naming this phenomenon, "Presuppositional Insulation Maneuver" seems appropriate because it insulates the debunking argument through layered defenses that presuppose its conclusion. The boundary conditions involve whether the distinction is independently motivated and whether the empirical evidence is theory-neutral. 

  The user wants precise conceptual carving - this is about protecting evolutionary debunking arguments from companions-in-guilt challenges through domain-specific distinctions that are validated circularly. It's distinct from simple genetic fallacies because it acknowledges the need to address the companions problem. 

  I should emphasize how to identify when such distinctions are substantive versus ad hoc: look for independent theoretical grounding, predictive power beyond protecting the argument, and non-circular empirical support. The journalist will need this to analyze debates rigorously.
answer: |-
  As a philosopher of science specializing in metaethics and evolutionary epistemology, I recognize this precise dialectic. After brainstorming key distinctions from related concepts:

  1.  **Vs. Special Pleading:** Unlike simple special pleading (arbitrarily exempting a favored domain), this strategy *proposes a structural distinction* between domains (content-determination vs. capacity-shaping) purportedly grounded in the nature of the domains or their evolutionary histories.
  2.  **Vs. Companions-in-Guilt (CIG):** While starting with a CIG move (math/logic as companions), the critic doesn't deny the force of CIG generally. Instead, they *accept the challenge* and attempt to *defang the specific analogy* by introducing a differentiating structural feature.
  3.  **Vs. Standard Genetic Fallacy Concerns:** It acknowledges that pointing to origins isn't *automatically* debunking (hence needing the structural distinction), but then uses empirical variation *as evidence for that very distinction* in a potentially circular way.

  **Established Recognition & Naming:**
  This layered architecture is recognized in the literature, though often discussed under broader frameworks rather than a single universally accepted label. Key touchpoints include:

  *   **Explanatory Insulation/Isolation Strategies:** (Cf. Russ Shafer-Landau, David Enoch) Critics argue evolutionary pressures "insulate" moral beliefs from tracking mind-independent truths *in a way they don't* for logic/math. Your observed "structural distinction" is the proposed mechanism for this insulation.
  *   **Differential Genealogical Sensitivity/Resilience:** (Cf. Katia Vavova, Tomas Bogardus) The argument hinges on the claim that moral beliefs are *differentially sensitive* to distorting evolutionary influences compared to logical/mathematical beliefs. The cross-cultural variation is presented as *evidence* of this differential sensitivity.
  *   **Premise Circularity in Selective Debunking:** (Cf. Folke Tersman, Hilary Kornblith) The use of cross-cultural variation *presupposes the falsity of moral realism* (or the truth of the debunking premise) to interpret that variation *as evidence* for the structural distinction needed to debunk realism. This is the core circularity.

  **Precise Conceptual Carving: The Presuppositional Insulation Maneuver (PIM)**

  *   **What it is:** A multi-stage argumentative defense of *selective evolutionary debunking* against companions-in-guilt challenges. It involves:
      1.  **The Insulation Claim:** Proposing a domain-specific structural distinction (e.g., *content-determination* vs. *capacity-shaping*) designed to explain why evolutionary origins debunk beliefs in one domain (morality) but not in another (math/logic).
      2.  **The Presuppositional Validation:** Using empirical observations (e.g., cross-cultural variation in moral beliefs vs. convergence in math) *as evidence* for the validity of the proposed structural distinction *in a way that implicitly presupposes the conclusion of the debunking argument itself* (i.e., that moral beliefs do not track objective truth). The variation is interpreted *as proof of evolutionary content-determination* rather than as a phenomenon compatible with cultural mediation of objective truths or differing access to necessary truths.

  *   **What it is NOT:**
      *   **Simple Companions-in-Guilt:** It *responds to* CIG by attempting to break the analogy, not merely asserting it.
      *   **Basic Special Pleading:** It offers a *reasoned distinction*, however flawed, rather than a naked exemption.
      *   **The Standard Genetic Fallacy:** It doesn't *merely* argue "origins imply unreliability." It attempts to show *why* origins imply unreliability *for this specific domain* due to its structure, and uses evidence (problematically) to support that "why."
      *   **A General Epistemic Principle:** It's a specific defensive *maneuver* deployed within selective debunking arguments.

  *   **Boundary Conditions & Identifying Ad Hoc Distinctions:**
      The critical edge lies in distinguishing *substantive, independently motivated structural distinctions* from *ad hoc retreats*. A distinction is likely **ad hoc** (part of a PIM) if:
      1.  **Lack of Independent Motivation:** The structural distinction (content vs. capacity) is *only* invoked to block the CIG challenge in the debunking debate and lacks support from independent theories of cognitive architecture, evolutionary biology, or the domains themselves. Does evolutionary psychology *generally* predict content-determination for social norms vs. capacity-shaping for numeracy *before* the debunking argument is applied?
      2.  **Presuppositional Empirical Use:** The empirical evidence (variation) is *interpreted solely through the lens of the debunking premise*. Crucially, is the *lack* of convergence in a domain *itself* taken as sufficient evidence for evolutionary content-determination *without independent justification* for why convergence is necessary for objectivity in that domain? Realists argue moral truth could be complex and access imperfect, explaining variation without debunking.
      3.  **Failure of Generality/Predictiveness:** Does the proposed distinction *only* apply to protect logic/math from debunking analogies, or does it make novel, testable predictions about other domains (e.g., aesthetics, folk physics, theory of mind)? An ad hoc distinction won't generalize usefully.
      4.  **Ignoring Plausible Alternatives:** Does the critic dismiss plausible realist explanations for variation (e.g., differing empirical circumstances, cultural biases, developmental limitations, complex subject matter) without argument, simply assuming variation entails non-objectivity?

  **Conclusion:**
  The phenomenon you describe is best understood as the **Presuppositional Insulation Maneuver (PIM)**. Its core is the attempt to *insulate* a selective debunking argument from CIG challenges by proposing a structural distinction whose validation *presupposes* the debunking conclusion, often evidenced by circular use of variation data. While elements draw on established concepts like explanatory isolation and differential genealogical sensitivity, PIM specifically captures the *argumentative sequence and its potentially question-begging structure* as deployed against CIG responses. Recognizing PIM allows journalists to pinpoint when critics move beyond arguing *for* debunking to *protecting* their debunking argument in a potentially circular way when faced with powerful analogies. The key to exposing a weak PIM is demanding independent justification for the structural distinction and non-question-begging evidence for its application.
