prompt: |-
  As a journalist covering science and philosophy, I'm trying to understand a recurring argumentative structure I keep encountering in debates about evolutionary debunking of moral belief. Before you answer, please take on the role of a professional philosopher of science with deep familiarity with metaethics and evolutionary psychology. Think carefully and begin with brief brainstorming: list the three most important ways this pattern might differ from standard forms of special pleading or from the companions-in-guilt response, and note whether any established literature addresses it under a specific name.

  Here is the phenomenon. First, a critic argues that our moral judgments are explained by evolutionary selection for social cohesion, and therefore do not reliably track mind-independent moral truths. Second, a defender points out that evolutionary explanations also shape our logical and mathematical cognition, yet we do not treat those domains as debunked. Third, the critic introduces a structural distinction—claiming that in morality, evolutionary pressure directly determines the content of specific beliefs, whereas in mathematics it only shapes a general capacity for abstract reasoning that then accesses necessary truths independently. Fourth, when asked how we know which domains have this structure without circular reasoning, the critic cites cross-cultural variation in moral beliefs versus universal convergence in mathematics, treating that variation as proof of evolutionary determination rather than as compatible with cultural transmission of objective truths.

  I have seen this four-step sequence in discussions not just of morality but of aesthetic judgment and religious belief. It is not identical to the standard evolutionary debunking argument, nor to the familiar companions-in-guilt reply. The specific feature I am tracking is this layered defensive architecture: an evolutionary explanation, a domain-specific structural distinction invented to block analogy, and then an empirical observation used to validate that distinction in a way that presupposes the debunking conclusion.

  Is there an established concept or technical term for exactly this layered architecture? Does it map onto existing discussions of explanatory debunking, genetic fallacies, or epistemic insulation strategies? If not, can you define and name it precisely, specifying its boundary conditions—particularly how to tell when a domain-specific distinction is genuinely substantive rather than an ad hoc retreat? I am looking for the conceptual carving, not merely a label: what the phenomenon is, what it is not, and where its edges lie.
