  hey — im a science/ideas journalist working on a story about legal identity after brain injury, and im stuck on the philosophy part. here's the puzzle: courts routinely honor advance directives where the 'future self' with dementia gets treatments the old self refused, which treats identity as something that can survive total personality change. but those same courts will prosecute someone for a crime committed during a dissociative fugue, insisting its still the same person who did it. and in civil cases, judges often say the brain-damaged plaintiff is 'not the same person' for damages calculations, yet they keep the same social security number and property rights. so what theory of personal identity is actually baked into these practices? is it dennets idea of the self as just a center of narrative gravity — a useful fiction we maintain for practical reasons? or does it smuggle in a real metaphysical substrate? i want to know which parts of the practice strictly need narrative continuity and which parts could survive if we dropped the fiction entirely. also, if we really bought the center-of-gravity view, wouldnt we have to rewrite how we assign blame in split-personality defenses, or whether an advance directive is binding on someone who literally cant tell the story of who they are? dont need citations, just the implicit logic.
