  Okay, let me unpack this fascinating mess. The user's a science journalist hitting a philosophical wall on legal identity after brain injury, and they've spotted some glaring contradictions in how courts handle different scenarios. 

  First, the puzzle pieces: advance directives get honored even when dementia completely overwrites personality (identity survives change), but dissociative fugue crimes still get prosecuted (identity persists through discontinuity). Meanwhile in civil court, brain-damaged plaintiffs get called "not the same person" for damages yet keep all their legal identifiers (identity both changes and persists). 

  Hmm. The core tension here is between three legal functions that secretly demand different theories of identity: continuity of responsibility (criminal law), continuity of rights (property/SSN), and discontinuity of personhood (civil damages). 

  What's really being asked is: does the law need metaphysical personhood at all, or can it run purely on narrative utility? Let me test that against their examples. If we went full Dennett center-of-narrative-gravity: 
  - Advance directives would collapse when the narrative thread snaps (no more "I" to continue the story) 
  - Fugue defenses would succeed (no narrative connection = no responsibility) 
  - But civil damages might paradoxically work better (we're openly admitting it's a valuation fiction) 

  Yet courts don't do this. They're pragmatically switching theories: 
  Locke's psychological continuity for advance directives (future self inherits past self's decisions) 
  Bodily continuity for criminal law (this flesh-puppet did the crime) 
  And for civil damages? That's pure social utility - we're compensating for lost capacities, not metaphysical change. 

  The user's onto something big: the law isn't consistent because it can't afford to be. If they ditch the personhood fiction entirely: 
  - Blame assignment crumbles without narrative chains 
  - But property rights could survive on pure transactional needs 
  - Medical consent might shift to best-interests models 

  Maybe the answer's in their last question: the practices that strictly need narrative are exactly those involving retrospective judgment (blame/credit), while forward-looking rights transfers (property, directives) could theoretically function without it. But criminal law? That narrative dependency runs deep. 

