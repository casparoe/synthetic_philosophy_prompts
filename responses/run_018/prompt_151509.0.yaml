answer: |-
  You've hit on a brilliant paradox at the heart of legal practice. The implicit logic isn't a coherent philosophical theory but a **pragmatic patchwork** that switches between different conceptions of "personhood" depending on context. Here's the breakdown:

  ### The Implicit Framework in Legal Practice:
  1. **Advance Directives (Future Self):**  
     - **Logic Used:** *Lockean Psychological Continuity* + *Bodily Identity*.  
     - Courts prioritize the **narrative authority** of the pre-injury self. The "person" is defined by their autonomous will at peak capacity. Total personality change is irrelevant because the *body's legal identity* and the *prior rational self's wishes* are binding. Metaphysics smuggled in: **The "true self" is the last competent version**.

  2. **Criminal Responsibility (Dissociative Fugue):**  
     - **Logic Used:** *Bodily Continuity* + *Social Accountability*.  
     - Courts anchor identity to the **biological entity**. Even if psychological continuity is broken ("I wasn't myself"), the body committed the act and must be held responsible to maintain social order. Narrative continuity is irrelevant; the *body-as-legal-agent* persists. Metaphysics smuggled in: **The body is the irreducible substrate of personhood**.

  3. **Civil Damages ("Not the Same Person"):**  
     - **Logic Used:** *Valuation of Capacities* (not metaphysical identity).  
     - When judges say "not the same person," they're **quantifying loss of function**, not declaring ontological discontinuity. Property rights and SSN persist because the *legal entity* (the body/social ID) remains. The "person" here is a placeholder for **measurable human capital** (e.g., earning capacity, relationships).

  ---

  ### Does This Align with Dennett's "Center of Narrative Gravity"?  
  **Partially, but with a key twist:**  
  - The law *treats* identity as a narrative fiction **when convenient** (e.g., honoring past selves in directives, dismissing future selves in damages).  
  - But it **cannot commit fully** to narrative fiction because it needs:  
    - A **bodily anchor** for blame (criminal law).  
    - A **stable entity** for rights inheritance (property/SSN).  
    - A **quantifiable subject** for civil compensation.  

  **The fiction breaks when:**  
  - Blame must be assigned (narrative discontinuity isn’t exculpatory).  
  - Rights must vest *uninterruptedly* in a body/Social Security Number.  

  ---

  ### What *Requires* Narrative Continuity?  
  1. **Advance Directives:**  
     - Only "work" if we accept the pre-injury narrative as binding future bodies.  
     - **If we dropped the fiction:** Directives would dissolve when the narrative thread snaps (e.g., severe dementia). Society would default to "best interests" or surrogate decisions.  

  2. **Moral/Legal Blame:**  
     - Assigning guilt assumes the *defendant today* is narratively continuous with the *perpetrator yesterday*.  
     - **Split-personality defenses challenge this:** If we fully embraced narrative fiction, acquittal would follow for alters "unaware" of the crime. But courts reject this, implying a deeper substrate (the body/agent) bears responsibility.  

  ---

  ### What Could Survive Without Narrative?  
  1. **Property Rights & SSN:**  
     - These attach to a **biological lifespan**, not a mind. A brain-injured person keeps their assets because the *body* is the legal container. No narrative needed.  

  2. **Civil Damages Calculations:**  
     - "Loss of self" rhetoric is just a metaphor for **functional impairment**. We could compensate for lost capacities (income, cognition) without invoking identity metaphysics.  

  3. **Criminal Law:**  
     - **Could we blame bodies, not persons?** Yes, but it feels unjust. We *want* narrative ("he knew what he did!") to justify punishment. Without it, criminal law becomes mechanical retribution against flesh.  

  ---

  ### The Bottom-Line Logic:  
  - **Law prioritizes social utility over philosophical consistency.**  
  - **Bodily continuity** is the non-negotiable core (for rights/blame assignment).  
  - **Narrative continuity** is a tool: invoked to bind future selves (directives), ignored to hold bodies accountable (fugue), and weaponized to quantify loss (damages).  

  **If we embraced Dennett fully:**  
  - Advance directives would lose force when the narrative dissolves.  
  - Criminal convictions in fugue/dissociation cases would collapse.  
  - "Loss of self" damages would vanish — replaced by functional loss metrics.  

  The law resists this because it needs **one body = one enduring legal agent**, even as it opportunistically borrows from narrative theory to solve specific problems. The metaphysics isn’t just smuggled in; it’s *demanded* by the system’s need for a stable anchor.
