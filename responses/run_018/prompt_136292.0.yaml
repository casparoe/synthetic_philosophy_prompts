answer: |-
  A sharp objection, but it misconstrues the nature of narrative coherence I defend. Coherence isn't *temporal smoothness* or the absence of radical change. It's the *reasoned reconfiguration of the self over time*. The reformed extremist doesn't lose freedom through conversion; they *exercise* it most profoundly precisely *by* confronting the discontinuity.

  Their freedom lies in the *rational reckoning* with their past. When they repudiate their former self, it’s not a rupture devoid of reasons, but a *reason-responsive act* that re-narrates their life. "This was *me*, and it was abhorrent; *therefore*, I must become *this*." The continuity isn't in unchanged values, but in the *rational thread of justification* stitching the narrative together—owning the past not as endorsement, but as the necessary ground for present rejection and future commitment. The incoherence wasn't *caused* by the conversion; it was the *unfreedom* of the extremist state, where actions conflicted with deeper, latent values (perhaps respect for human dignity) now made explicit. Their conversion *resolves* that prior incoherence through conscious, reasons-based re-authoring.

  You're right that the *phenomenology* feels discontinuous. But the freedom worth wanting resides in the *capacity to make that discontinuity rationally intelligible to oneself*, integrating it into a life story one can endorse *now* as an expression of one's best judgment. Without this diachronic, narrative ownership—this ability to say "this trajectory, *including its break*, is mine and flowed from my reasons"—we merely have disconnected moments of local control, not an agent freely shaping a life. The static mesh of the addict endorsing their craving fails precisely because it lacks this coherent trajectory. The convert, however painful the break, achieves it. Moral growth *requires* this narrative freedom.
