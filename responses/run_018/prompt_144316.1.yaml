answer: |-
  ### Desiderata for Normative Preference Filtration

  **First: Explanatory Phenomena the Theory Must Handle**  
  *(With required distinctions and failure conditions)*  

  1.  **Social Position Tracking vs. Principled Commitment**  
      - **Case**: A privileged agent sincerely endorses meritocracy, unaware that their view ignores structural barriers faced by marginalized groups.  
      - **Distinction to Preserve**: Genuine moral reasoning grounded in universalizable principles vs. rationalizations that covertly defend positional advantage.  
      - **Failure if Collapsed**: Moral theories become incapable of critiquing ideologies that serve power, mistaking conformity for justification.  

  2.  **Over-Correction vs. Core Preferences**  
      - **Case**: After correcting for framing effects and social influence, an agent’s "purified" preferences lack substantive content (e.g., no stable views on distributive justice remain).  
      - **Distinction to Preserve**: Epistemically suspect influences vs. affectively integrated values central to identity.  
      - **Failure if Collapsed**: The filtration process destroys moral agency by treating all affect-laden judgments as noise, rendering normativity inert.  

  3.  **Context-Dependent Validity of Structural Features**  
      - **Case**: Emotional salience distorts triage decisions (favoring vivid cases over statistically greater needs) but rightly amplifies attention to extreme suffering in atrocity prevention.  
      - **Distinction to Preserve**: Heuristics that reliably track morally relevant features in context X vs. those that mislead in context Y.  
      - **Failure if Collapsed**: The theory cannot explain why emotion is sometimes essential to moral perception (e.g., empathy for oppression) and sometimes biasing (e.g., outrage-driven punishment).  

  4.  **Collective Distortion vs. Emergent Wisdom**  
      - **Case**: Group polarization leads a committee to endorse excessively harsh penalties no member initially supported, versus deliberative consensus achieving nuanced policy.  
      - **Distinction to Preserve**: Dysfunctional group dynamics (e.g., conformity pressure) vs. epistemically productive collective reasoning.  
      - **Failure if Collapsed**: Cannot distinguish democratic legitimacy from mob mentality, or reject toxic cultural norms while affirming valuable traditions.  

  ---

  **Second: Consistency Conditions**  

  1.  **Empirical Adequacy**: Must accommodate robust findings:  
      - Moral judgments rely on heuristics (e.g., disgust sensitivity);  
      - Framing effects alter choices without changing facts;  
      - Social influence (e.g., authority, peer pressure) shapes convictions.  
      *Violation Example*: A theory ignoring framing effects cannot explain identical dilemmas eliciting opposite judgments.  

  2.  **Moral Progress Condition**: Requires that:  
      - Agents can revise preferences via reflection (e.g., exposure to counterexamples);  
      - Past distortions need not permanently constrain future reasoning.  
      *Violation Example*: If adaptive preferences are immutable, emancipation becomes conceptually incoherent.  

  3.  **Pluralism Compatibility**: Must:  
      - Allow divergent values (e.g., autonomy vs. community) to be reasonable;  
      - Explain disagreements without presuming bias in either party.  
      *Violation Example*: Treating all cross-cultural dissent as bias invalidates legitimate diversity.  

  ---

  **Third: Flagging Jointly Unsatisfiable Desiderata**  

  - **Tension 1: First-Person Transparency vs. Structural Invisibility**  
    - *Desiderata in Conflict*: (i) Agents should recognize their own biases through reflection; (ii) Some biases (e.g., implicit in-group favoritism) are systematically opaque to self-audit.  
    - *Precise Tension*: Requiring (i) denies (ii)’s empirical reality; accepting (ii) undermines (i)’s feasibility.  

  - **Tension 2: Reflective Endorsement vs. Adaptive Preference Correction**  
    - *Desiderata in Conflict*: (i) Filtration must respect agents’ reflectively endorsed preferences; (ii) It must correct preferences adapted to oppression (e.g., "women’s duty to serve husbands").  
    - *Precise Tension*: Victims of injustice often endorse distorted preferences. Prioritizing (i) legitimizes false consciousness; prioritizing (ii) overrides autonomy paternalistically.  

  ---

  **Fourth: Approach-Specific Fault Lines**  

  | **Ethical Approach**       | **Most Likely Violated Desideratum**          | **Reason**                                                                 |
  |----------------------------|-----------------------------------------------|----------------------------------------------------------------------------|
  | **Preference-Satisfaction** | Over-Correction vs. Core Preferences          | Takes preferences as given; cannot filter adaptive preferences without emptying "core" content (e.g., oppressed agents' "satisfaction" with injustice). |
  | **Kantian Rationalism**     | Pluralism Compatibility                       | Demands convergence on a single rational standard; treats divergent reasonable values as irrational biases. |
  | **Contextualist Care Ethics** | Context-Dependent Validity of Structural Features | Struggles to generalize when emotional salience is legitimate vs. biasing; risks over-validating parochial attachments. |

  ---

  **Rationale Summary**: An adequate theory must navigate the *diagnostic challenge* (identifying distortions without overreach) and the *normative challenge* (grounding corrections without paternalism or relativism). Key pitfalls include empirical naïveté (ignoring moral psychology), epistemic arrogance (presuming infallible filtration), and normative inconsistency (applying criteria selectively). The fault lines reveal that no approach escapes trade-offs between autonomy, accuracy, and pluralism.
