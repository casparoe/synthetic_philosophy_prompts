answer: |-
  The salt wind whipping off the bay rattled the loose pane in Mara’s workshop. Inside, the furnace pulsed, painting the cluttered space in molten oranges. On the workbench lay the commission: sketches for a single, impossibly thin vase, fluted like a sea anemone, its rim thinner than paper. A collector’s folly, priced accordingly.

  Mara rolled a gather of molten crystal on her marver, her movements economical, fluid. She didn’t think ‘viscosity’ or ‘thermal conductivity’; she felt the glass’s reluctant yield, saw the subtle shifts in its glow that told her when it was ready. Her brother Leo hovered nearby, a thick textbook on silicate structures open but ignored, his brow furrowed. "Ambient temperature is 23.7°C," he announced, tapping a digital thermometer. "Relative humidity 68%. The Leidenfrost effect might be more pronounced on the punty iron."

  Mara glanced at the old machine squatting in the corner – the ‘Ghost Glass,’ Leo called it. Brass cylinders, wax-paper diaphragms, clockwork guts. Decades ago, a tinkerer had recorded the pressure signatures and vibration patterns of master glassblowers. Hooked to the blowpipe, it could replicate those patterns mechanically. Pure procedural mimicry.

  "Ready, Leo?" Mara asked, ignoring his data dump. She shaped the gather, her touch feather-light.

  Leo’s hands, scarred from past attempts, trembled slightly. He could recite the exact temperature silica vitrified (1713°C), the coefficient of thermal expansion, the role of boron trioxide in lowering melting points. But translating that into steady pressure, the delicate dance of breath and rotation? Impossible. His attempts always ended in clumsy blobs or fractures.

  Mara began. Her breath, a soft, sustained whisper, coaxed the glass into a nascent bulb. She spun the pipe, the glass flowing like honey under her invisible guidance. Leo watched, mesmerized and frustrated. "The wall thickness… there’s a risk of thermal stress fracture if the cooling gradient exceeds…"

  "Not now, Leo," Mara murmured, her gaze fixed on the glowing form. She gestured towards the Ghost Glass. "Set it for the ‘Lily Bell’ recording. For the neck."

  Leo fumbled with the machine, connecting its articulated arm to the blowpipe opposite Mara. He selected a wax cylinder etched with faint grooves. The machine whirred, diaphragms vibrating. A steady, mechanical hiss joined Mara’s organic breath. For a moment, it worked. The glass responded, thinning further, the flutes beginning to form under Mara’s shaping tools guided by the machine’s steady pressure replication.

  Then, the coastal dawn broke properly. Sunlight, weak but direct, slanted through the dusty window, hitting the workshop floor. The temperature near the bench crept up, perhaps half a degree. Imperceptible to Mara, irrelevant to Leo’s current calculations.

  The Ghost Glass stuttered.

  Its brass armature jerked. The steady hiss became a choked gasp, then a sharp, uneven puff. The machine, blind to the subtle environmental shift, was replaying its stored waveform exactly as recorded, in air now slightly warmer, slightly less dense. The pressure was wrong.

  The fragile neck of the vase, caught between Mara’s shaping tool and the machine’s erratic pressure, *pinged*. A hairline fracture spiraled up the thin glass.

  "Off! Turn it OFF!" Mara hissed, instantly reducing her own breath.

  Leo lunged, disconnecting the machine. His face was pale. "What happened? The recording parameters were exact!"

  "The air changed, Leo," Mara said, her voice tight. She examined the fracture, glowing like a venomous thread. "The sun hit the floor. Ghost Glass doesn’t *know* that matters." Her knowing-how had sensed the machine’s output becoming discordant, a split-second before the fracture. Its knowing-that was frozen, literal, useless.

  Leo stared at the fracture, then at the thermometer. "A 0.8°C rise localized near the intake… air density decrease… altered pneumatic resistance…" He trailed off, the theoretical cascade clear. His knowing-that diagnosed the failure instantly, but it was knowledge arrived at too late.

  Mara didn’t waste words. She moved the vase back towards the glory hole, the furnace mouth radiating intense heat. "It needs a flash reheat. Now. How long?"

  Leo blinked, his mind racing through equations – specific heat capacity, radiative heat transfer, the critical temperature to repair the fracture without collapsing the form. "Seven seconds. Maximum. At… at *this* proximity." He pointed, his finger trembling slightly less now he was in his element.

  Mara trusted the number. Her knowing-how told her the glass *could* take brief, intense heat, but not *how* brief. She plunged the fractured neck into the searing radiance, counting silently… *one… two…* She felt the glass soften at the edge of the fracture, felt its viscosity shift… *five… six…* her intuition screamed *now*. She pulled it clear at exactly seven.

  The fracture sealed, leaving only a faint, rippled scar almost invisible in the delicate structure. But the neck was slightly thicker now, less ethereal.

  "The collector specified *paper-thin*," Leo fretted, consulting his notes. "This exceeds tolerance by…"

  "It’s alive, Leo," Mara cut him off, already rotating the piece, her breath a soft stream again. "Help me finish. The base needs thickening, but *here*." She touched a spot near the punty iron scar with her jacks. "The weight distribution’s off after the repair. It’ll tip."

  Leo scanned the sketch, then the glowing form. He visualized center of mass calculations, density distribution. "Compensate… here," he pointed to a lower curve. "Add 0.3mm. Roughly. It’ll anchor it."

  Mara added the glass with the precision of a jeweler, guided by Leo’s numbers but trusting her own feel for balance. Her knowing-how shaped it; his knowing-that told her where and how much.

  Hours later, the anemone vase sat annealing in the oven, its form miraculously whole. It wasn’t quite the impossibly thin dream of the sketch – the neck bore the subtle thickening of its near-death experience. The base had a tiny, deliberate counterweight no one would notice. It was a collaboration, a testament to Mara’s fingers whispering to molten sand, Leo’s mind wrestling unseen forces, and the Ghost Glass sitting silent in the corner, its brass gleaming dully – a reminder that procedure, without understanding or adaptability, is just noise when the world shifts. The salt air crept under the door, carrying the scent of the sea, indifferent to silica formulas or the tremble in a scholar’s hand.
