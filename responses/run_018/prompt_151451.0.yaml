answer: |-
  Here’s a committed teaching plan focused on **Williams’ integrity objection as a diagnostic tool for institutional ethics**, designed for policy analysts in 90 minutes:

  ---

  ### **Core Teaching Position**  
  Williams reveals how bureaucratic systems can *corrupt moral agency* by forcing agents to justify ethical actions through impersonal frameworks. This creates "one thought too many" — a rationalization that distances us from authentic responsibility. For institutions, this isn’t about selfishness; it’s about *preserving moral identity* in systems that reduce ethics to cost-benefit arithmetic.

  ---

  ### **Explanatory Arc**  
  *(Total: 80 min + 10 min diagnostic)*  

  #### **I. Prerequisite: What "Moral Identity" Means**  
  **(10 min)**  
  - **Hook**: *"When has a policy made you feel complicit in something that clashed with who you are?"*  
  - **Key Setup**: Distinguish *personal values* (integrity) from *institutional rules* (compliance).  
  - **Crucial Point**: Integrity isn’t loyalty to self-interest; it’s loyalty to convictions that define your moral character.  
  - **Intercept Misconception**: *Immediately clarify*: "This is NOT about selfishness. It’s about whether institutions erase your ethical anchors."  

  #### **II. The Core Scenario: "The Procurement Officer"**  
  **(25 min)**  
  - **Case**: *A policy analyst must choose between two suppliers for a public hospital:  
    - **Supplier A**: Cheaper, but uses prison labor (legal but morally contentious).  
    - **Supplier B**: Ethical, local, but 15% costlier.  
    *The officer knows Supplier B’s workers personally—their kids attend the same school.*  
  - **The "Too Many Thoughts" Moment**:  
    - **First thought (Integrity)**: *"I can’t endorse prison labor—it exploits vulnerable people."*  
    - **Excess thought (Systemic)**: *"But my handbook says I must optimize taxpayer value. If I choose B, I must justify it as ‘investing in community social capital’ for audit compliance."*  
  - **Structural Features Highlighted**:  
    - Personal connection (moral stakes) vs. bureaucratic disconnection.  
    - System forces *translation* of ethics into institutional jargon ("social capital ROI").  
    - The "excess thought" isn’t the ethical impulse—it’s the *neutralizing frame* demanded by the system.  

  #### **III. Why This Corrodes Institutional Ethics**  
  **(20 min)**  
  - **Williams’ Warning**: Systems that *require* the excess thought:  
    - Alienate agents from their own judgments ("Was *I* ethical, or just compliant?").  
    - Reward moral evasion (e.g., hiding behind "procedure").  
  - **Organizational Risk**: Policies that ignore integrity create *cultures of bad faith*—people comply while feeling ethically hollow.  
  - **Intercept Misconception**: *Explicitly state*: "Integrity doesn’t reject consequences. It rejects reducing ethics *only* to consequences. Choosing B may cost more, but the officer’s refusal to *rationalize* it systemically is the point."  

  #### **IV. Diagnostic Tool: Spotting "Excess Thoughts"**  
  **(15 min)**  
  - **Pattern Recognition**: Ask: *"When is a ‘justification’ actually a distancing mechanism?"*  
    - **Red flags**: Over-reliance on ROI, "stakeholder" abstractions, or moral outsourcing ("The committee approved this").  
  - **Counterpractice**: *"Argue from conviction, not just compliance."*  
    - (e.g., *"I chose Supplier B because profiting from prison labor is wrong,"* not *"B enhances our ESG score"*).  

  #### **V. Final Diagnostic Question**  
  **(10 min)**  
  > **"If you removed all bureaucratic jargon from your justification, would the *moral core* of your decision still be legible?"**  
  > *- Tests if they grasp the structural critique (not just the slogan). A "no" signals institutional distortion.*  

  ---

  ### **What to Exclude & Why**  
  1. **Moral Luck**: Tangential to the integrity/agency focus.  
  2. **Kantian Universalization**: Williams targets consequentialism; Kant is a distraction here.  
  3. **Scholarly Debates**: No comparisons to utilitarians/Kantians. Position Williams as a *practical critic*, not a philosopher in dialogue.  
  > **Boundary Statement**: *"We’re isolating Williams’ institutional diagnostic—not mapping all moral theory."*  

  ---

  ### **Why This Matters for Policy Analysts**  
  - **Institutional Damage Control**: Systems that ignore integrity breed cynicism, attrition, and scandals (e.g., "I was just following orders").  
  - **Better Policies**: Design decision frameworks that *protect* personal ethical anchors (e.g., allowing "conscience objections" in procurement).  
  - **You Are Not the System**: Preserving integrity isn’t rebellion—it’s what keeps institutions human.  

  **Session Title Suggestion**:  
  *"When Rules Make You Think Too Much: Protecting Integrity in Institutional Ethics"*  

  ---  
  This plan trades scholarly nuance for actionable insight, framing Williams as an essential lens for diagnosing institutional moral decay. The focus on a single bureaucratic scenario grounds abstraction, while preemptive myth-busting prevents corrosive misunderstandings.
