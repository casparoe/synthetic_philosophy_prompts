answer: |-
  This system embodies a fascinating and philosophically dense set of assumptions, revealing deep tensions about identity, responsibility, and the state's role in mediating historical injustice. Let's break it down:

  ### Core Philosophical Commitments & Implicit Theory
  1.  **Collective Identity Transcending Generations:** The core presupposition is that *national identity is fundamentally constituted by historical events*, and *family lineage is a legitimate vessel for transmitting the moral and political status* associated with those events ("perpetrator" or "victim"). Individuals inherit a *positional status* within the national narrative simply by birth.
  2.  **Political Liability as Inherited Debt (Jaspers Lite):** The system leans heavily towards **Karl Jaspers' concept of "political liability"**.
      *   **Inherited:** Liability stems from belonging to the political community (nation) that perpetrated the atrocity, and crucially, this liability is *transmitted through family lines* via the registry.
      *   **Renounceable:** The "moral disavowal" mechanism explicitly allows individuals to *renounce* this inherited political liability. This act severs the *individual's* obligation flowing from their lineage (zeroing their tax). It treats the liability as an external burden imposed by the state/collective narrative, which the individual can refuse to bear personally.
      *   **Distinct from Moral/Metaphysical Guilt:** It explicitly avoids treating descendants as *morally culpable* (metaphysical guilt) for the acts of ancestors. Guilt requires personal agency; liability is a political consequence of membership and descent. Disavowal isn't a "ritual of separation" absolving *sin*, but a formal *refusal of state-imposed financial obligation* based on lineage.
  3.  **Victimhood as Objective Status & Entitlement:** Victim-descendant status is treated as an objective historical fact creating an *entitlement*.
      *   **Non-Voluntary:** The inability to opt out reflects the view that victimhood (or its consequences) is an *imposed condition*, not a chosen identity. Refusing payment doesn't erase the historical fact or the potential ongoing structural disadvantages flowing from it.
      *   **State as Trustee:** The state assumes the role of trustee for victim descendants. Payments are seen as owed *to them* by the political community, regardless of their current individual stance. Opting out would be seen as rejecting owed redress, potentially undermining the collective acknowledgment of the harm.
  4.  **Asymmetry Justification (Implicit):**
      *   **Power Imbalance Preserved:** Perpetrator liability requires active maintenance (paying tax); disavowal allows exiting this *burden*. Victim *entitlement* is seen as passive; refusing it requires an active act that the system disallows, arguably to protect against pressure to relinquish claims or deny the harm's legacy.
      *   **Narrative Integrity:** Allowing victim descendants to opt out could be seen as undermining the *national narrative of historical injustice and obligation*. Disallowing it reinforces the state's commitment to redress. Allowing perpetrator descendants to disavow provides an "escape valve" for individual conscience without dismantling the system.
  5.  **State as Arbiter and Enforcer:** The state is the ultimate authority defining the atrocities, establishing the registry, managing the fund, and enforcing the rules (including the disavowal procedure and non-refusal of payments). It actively shapes and maintains the transgenerational moral-political landscape.

  ### What the Practice Strictly Requires vs. What Fits
  *   **Strictly Requires:**
      *   Recognition of specific historical atrocities.
      *   A mechanism to categorize citizens based on lineage relative to those atrocities.
      *   A differential financial obligation tied to that categorization.
      *   A formal procedure for perpetrator-descendants to renounce their financial obligation (disavowal).
      *   No mechanism for victim-descendants to renounce their entitlement to payments.
      *   A national reparations fund financed by the differential taxes.
  *   **What Fits (Compatible but not strictly required):**
      *   Belief in *ongoing collective responsibility* of the nation-state (beyond individual lineage).
      *   Belief that victim descendants *still suffer disadvantage* traceable to the atrocity (though payment isn't means-tested).
      *   The idea that disavowal involves some *moral reflection* (though the procedure might be purely bureaucratic).
      *   That receiving payments implies *acceptance of the victim narrative* (though it doesn't, due to non-refusability).

  ### Reconstructing with Individual Responsibility Only
  Rejecting transgenerational collective guilt/liability and insisting *only present individuals* bear moral responsibility would necessitate a radical overhaul:

  1.  **Abolish the Lineage Registry:** The core mechanism collapses. Guilt/liability cannot be *inherited* through bloodlines. Present individuals are only responsible for their own actions.
  2.  **Refocus Reparations:** The justification shifts dramatically:
      *   **Present Harm, Not Past Wrong:** Reparations could only be justified based on *present, identifiable harms* suffered by *living individuals* that are demonstrably *caused* by the *ongoing structural consequences* of the past atrocity (e.g., systemic discrimination, wealth gaps, unequal access). Proof of individual disadvantage becomes paramount.
      *   **State Responsibility, Not Descendant Liability:** The primary obligor becomes the *state as a continuing institution* that perpetrated or failed to adequately redress the injustice, not descendants of perpetrators. Funding would come from *general taxation*, not a special levy on specific families. The state's obligation stems from its role in causing or perpetuating harm, not from the lineage of its current taxpayers.
      *   **Beneficiary Focus:** Payments would go to individuals suffering *present disadvantage*, regardless of their ancestor's status, based on need and causal link to the historical injustice. Being a "victim-descendant" might be *correlated* with disadvantage, but it wouldn't be the *criterion* for payment. Means-testing would likely be introduced.
  3.  **Eliminate Disavowal/Non-Refusal:** Both mechanisms become incoherent.
      *   **Disavowal:** If there's no inherited liability to renounce, the procedure disappears.
      *   **Non-Refusal:** Individuals receiving payments based on *present disadvantage* would likely have the right to refuse them, just as they can refuse other forms of state aid. Refusal wouldn't undermine the state's obligation to *offer* redress for ongoing harm.
  4.  **Shift from Identity to Consequence:** The focus moves entirely away from *who your ancestors were* towards *what current injustices exist and how they can be remedied*. The link to the past is only relevant insofar as it demonstrably causes present harm.

  **In essence:** The original system treats national identity as an intergenerational moral ledger. Shifting to pure individual responsibility transforms reparations into a contemporary social justice program focused on remedying measurable present inequalities caused by historical state actions, severing the direct link of inherited moral status between generations. The state's role changes from keeper of the ancestral ledger to corrector of its own enduring institutional failures.
