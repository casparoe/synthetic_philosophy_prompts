  ok so i've been thinking about these intergenerational "moral debt" registries some countries run — citizens can enroll thier family line as either perpetrator-descended or victim-descended for a specific past atrocity, and that changes thier tax contribution to the national reparations fund. the weird institutional twist is that perpetrator-side people can file a "moral disavowal" and zero out thier contribution, but victim-side people can't opt out of recieveing payments even if they reject the framing entirely. what philosophical commitments about collective guilt and national identity does that presuppose? is it treating guilt like a Jaspers-style political liability that can be inherited but individually renounced, or more like metaphysical guilt that sticks unless you perform some ritual of separation? and why is victimhood treated as non-voluntary while guilt is made optional? reconstruct the implicit theory, distinguish what the practice strictly requires from what merely fits it, and say what'd have to change if we replaced the underlying view with one where only present individuals — not nations across generations — can bear moral responsibility.
