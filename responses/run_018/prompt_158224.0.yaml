  Hidden premises: Authority emerges from practice, rules are tokens applied in context

  The key divergence appears to be ontological: formalists see norms as abstract types while institutionalists see them as contextual tokens. This explains why they talk past each other - one focuses on logical possibility, the other on practical legitimacy.

  To break the impasse, I propose:
