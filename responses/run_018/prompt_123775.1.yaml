answer: |-
  ## Prospectus: Regime-Bound Structural Realism in Quantum Field Theory

  **Working Title:** Ontic Structural Realism Beyond Globality: Towards a Regime-Bound Account in Effective Field Theories

  **Precise Research Question:** Can a coherent form of ontic structural realism (OSR) be articulated for structures within quantum field theory (QFT) that are empirically adequate only within a bounded energy regime (e.g., those described by effective field theories, EFTs), such that this commitment (i) avoids collapsing into epistemic structural realism (ESR) regarding those structures, (ii) avoids reverting to standard entity realism concerning the posited entities within the regime, and (iii) is meaningfully distinct from commitments to global structures?

  **Background and Gap Analysis:**
  Ontic structural realism (OSR) proposes that the *structure* of the world, as described by our best physical theories, is what we should be ontologically committed to, rather than the nature of underlying objects. However, discussions within the philosophy of physics, particularly concerning symmetries in QFT, have largely operated within a binary framework:

  1.  **Global Structures:** Commitment is typically discussed concerning global symmetry structures (e.g., Poincaré invariance, gauge symmetries treated as fundamental) assumed to hold universally across all scales or energy regimes. These are presented as the prime candidates for OSR commitment (e.g., Ladyman, French, Lyre).
  2.  **Epistemic Placeholders:** Structures that are not global (e.g., approximate symmetries, phenomenological models, or structures within specific regimes) are often implicitly or explicitly treated within an epistemic structural realist (ESR) framework. Here, structures are valuable predictive and explanatory tools, but not necessarily reflective of mind-independent ontology; they are placeholders pending discovery of the more fundamental global structure.

  This framing leaves a significant lacuna concerning the vast majority of structures actually used in high-energy physics: those arising within **Effective Field Theories (EFTs)**. EFTs (e.g., Fermi theory, chiral perturbation theory, the Standard Model treated as effective) provide highly successful descriptions within a specific energy range (a "regime"), but their core structures (symmetries, particle content, interaction terms) demonstrably *break down* outside that regime. They are neither global nor merely epistemic tools *within their domain of applicability* – they are empirically *and explanatorily* robust locally.

  The crucial philosophical question remains unexplored: **Can we be ontologically committed to these *regime-bound structures* themselves, as capturing genuine features of reality *within that bounded domain*, without retreating to instrumentalism (ESR) or invoking underlying entities (entity realism), and without requiring the structure to be globally valid?** This project aims to rigorously formulate and defend this intermediate position – "Regime-Bound Structural Realism" (RBSR).

  **Methodology and Approach:**
  This project employs a tightly focused two-pronged methodology:

  1.  **Conceptual Analysis of Symmetry-Breaking Arguments:** Critically examine philosophical arguments concerning symmetry breaking (explicit and spontaneous) in QFT. The focus will be on how these arguments implicitly or explicitly rely on a global/epistemic dichotomy. Key questions include:
      *   Does the *necessity* of symmetry breaking for empirical adequacy within a regime undermine the potential ontological significance of the unbroken symmetry structure *within that regime*?
      *   How do different interpretations of symmetry breaking (e.g., as revealing hidden structure vs. as a genuine physical process) impact the viability of RBSR?
      *   Can the *stability* and *autonomy* of structures within a regime (highlighted by EFT methodology) provide grounds for ontological commitment distinct from global fundamentality?

  2.  **Examination of Effective Field Theory Cases:** Analyse specific, well-established EFTs as philosophical case studies (e.g., the Fermi theory of weak interactions, the Quantum Hadrodynamics model of nuclear forces, the Standard Model as EFT). The analysis will focus on:
      *   Identifying the specific structures (symmetry groups, Lagrangian terms, particle multiplets) central to the EFT's empirical success within its regime.
      *   Examining the *reasons* for the breakdown of these structures at higher/lower energies (e.g., discovery of new particles, changing dominant degrees of freedom, explicit symmetry breaking).
      *   Assessing whether commitment to these structures *as described by the EFT* can be coherently formulated as ontological without relying on knowledge of the UV completion or dissolving into instrumentalism about the EFT itself.

  These two strands will be developed iteratively, using insights from concrete EFT cases to refine the conceptual analysis of symmetry and structural commitment, and using refined conceptual tools to deepen the interpretation of the case studies.

  **Expected Outcomes and Success Criteria:**
  A successful outcome for this six-month prospectus phase would be:

  1.  A **clear and coherent articulation** of Regime-Bound Structural Realism (RBSR), precisely distinguishing it from global OSR, ESR, and entity realism.
  2.  The development of a **formal criterion (or set of criteria)** for distinguishing genuine ontological commitment to a regime-bound structure from mere instrumental accommodation. Potential candidates involve notions like *intra-regime explanatory indispensability*, *structural stability under perturbation within the regime*, or the *absence of viable entity-based explanations consistent with the EFT formalism* within the regime. Success means demonstrating this criterion is non-trivial and applicable.
  3.  A **compelling argument**, grounded in the analysis of symmetry breaking and EFT cases, that RBSR is a *viable* and *distinct* position, resolving the identified gap in the OSR literature concerning non-global structures.
  4.  A **robust defence** against anticipated objections, particularly the charges that RBSR inevitably collapses into ESR (if the structure breaks down elsewhere) or requires commitment to entities (if the structure involves 'particles').

  **Assessment of Failure and Feasibility:**
  *   **Failure:** The project would fail if:
      *   No coherent formulation of RBSR distinct from ESR or entity realism can be found (i.e., the intermediate position collapses under analysis).
      *   The proposed criterion for ontological commitment proves untenable, vacuous, or indistinguishable from instrumentalism.
      *   Analysis reveals that commitment to regime-bound structures *necessarily* depends on commitment to underlying entities or a global structure in a way that undermines RBSR's autonomy.
      *   The arguments from symmetry breaking conclusively show that any structure requiring breaking for empirical adequacy cannot be ontologically primary *even locally*.
  *   **Feasibility and Scope Management:** While ambitious, the project is feasible within six months for a prospectus by **strictly limiting scope**:
      *   Focusing on 2-3 paradigmatic EFT case studies rather than a comprehensive survey.
      *   Concentrating on symmetries and Lagrangian structures, setting aside deep questions about quantum ontology (e.g., wave-function realism) or the metaphysics of emergence unless directly relevant to the core argument.
      *   Prioritising the *formulation* and *initial defence* of RBSR over exhaustive engagement with all possible realist/anti-realist positions.
      *   The primary risk is overextension into adjacent debates (e.g., full EFT metaphysics, quantum gravity implications). Mitigation involves constant reference back to the core question of the ontological status of *locally successful but non-global structures*. Negative results (e.g., demonstrating the incoherence of RBSR) would still constitute valuable philosophical progress.

  **Conclusion:**
  This project seeks to break the prevailing global/epistemic dichotomy in structural realism debates concerning QFT. By rigorously exploring the ontological potential of structures confined to specific energy regimes, as exemplified by effective field theories, it aims to articulate and defend Regime-Bound Structural Realism. Success would provide a novel realist framework for interpreting the vast landscape of successful, yet non-fundamental, physical theories and significantly refine our understanding of structural commitment in modern physics.
