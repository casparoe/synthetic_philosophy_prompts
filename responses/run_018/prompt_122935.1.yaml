  Hmm. They're unusually self-aware—already named their own counterargument ("eviction") and dismissed weaker objections (legal issues, living relatives). They want me to attack their position on philosophical grounds, granting their premises about the dead not being harmed. Smart constraints: no lazy citations, must prescribe concrete writing changes. 

  Their tension is visceral: they've fought family for a year over this. That "knot" metaphor feels literal—they're paralyzed. Underneath the intellectual framing, I sense guilt about the cousin's distress and fear of betraying the ancestor's legacy. Yet they resist sentimentality; they want steel-cold logic. 

  Key insight: their aptness metaphor (truth-as-poetry) clashes with the archival reality (truth-as-fact). When they say Netflix adaptations could replace the real person, they're acknowledging fiction colonizes reality. My counter must prove that obscurity doesn't license invention—it heightens responsibility. 

  Building the strictness argument brick by brick: 
  First, expose how "aptness" collapses when applied to contradicting documents. The drunken scene isn't filling silence—it overwrites her explicit temperance advocacy. That's different than inventing dialogue. 
  Second, reframe "eviction" as theft: the real woman built her identity through surviving texts. Fictionalizing her undermines her self-definition. 
  Third, force the desk-level consequences: either cut the drunk scene or add visible friction (disclaimers in-text, not just an afterthought). Renaming would be cowardice—it dodges accountability. 

  The user's "what must I give up?" plea demands brutality: if they keep the scene, they must make the fiction scream its fictionalness. No sneaky realism. That’s the price for overriding the record.
answer: |-
  Here’s the strictest possible argument against your position, steel-manned and grounded in the ethics of historical representation – not law, not living feelings, and granting your premises:

  **Core Argument: Aptness Collapses Under Eviction**  
  Your "aptness" defense works *only* when the real record is robust enough to anchor the person’s identity against fictional incursions. With an obscure figure like your great-great-aunt, the scant archive **is her ontological foundation**. Inventing major, defining contradictions (like the drunk scene) doesn’t "aptly" build *upon* that foundation; it **erodes and replaces it**. "Eviction" isn't just a side-effect; it's the *inevitable outcome* of applying "aptness" to near-total silence. The archive isn't a skeleton you add flesh to; it’s the lone pillar holding up her historical existence. Replace the pillar, and the existence changes.

  **Why "Aptness" Fails Here: Contradiction vs. Silence**  
  You grant that inventing dialogue or compositing minor characters is acceptable under aptness. That’s defensible because it operates *within the established boundaries* of the record. The drunk scene is different:
  1.  **It Directly Contradicts Her Surviving Voice:** Her temperance tracts aren't just "published positions"; they are **her only intentional, public self-representation to posterity**. Inventing an act that fundamentally undermines that self-representation isn't filling silence – it's **actively overwriting her own stated identity**.
  2.  **It Exploits the Silence:** The archive's silence on her private moments isn't an invitation; it's a **void that defines the limits of what we can claim to know**. Using that void to insert a dramatic contradiction leverages her obscurity *against* her, turning the *lack* of evidence into a license for invention that flips her public stance. This isn't "apt" to the pressures of her letters; it's **exploitative of the record's fragility**.
  3.  **It Creates a New Definitive Narrative:** Aptness assumes the reader can discern the "shape" you're riffing on. With only 11 letters, a diary fragment, and a court record, there *is no discernible public "shape"* strong enough to make the drunk scene feel like a plausible, apt exploration rather than a **definitive assertion** – especially because it's a vivid, dramatic scene contradicting her known stance. The reader *cannot* reasonably separate "apt metaphor" from "this is what she was *really* like underneath" because the real record offers no counterweight.

  **What You Owe Her: Fidelity to the *Surviving* Self**  
  Since the dead cannot be harmed, and consent is impossible, the obligation shifts to **preserving the integrity of the historical trace they left**. You owe her:
  *   **Respect for her Intentional Acts:** Her tracts *were* an act of self-definition. Don't undermine them without overwhelming evidence, which you lack. The debt record? Invent context, not contradiction. The burned letters? Invent *why* she *might* burn *some* letters, not a specific scene contradicting her core identity.
  *   **Humility Before the Void:** The silence isn't yours to fill with contradictions. It demands invention that **extends logically from the known, not negates it**. Explore her *struggle* with temperance pressures within the bounds of her public stance, not its collapse.
  *   **Non-Replacement:** Your duty is to **amplify the surviving record, not supplant it**. The novel should make people seek out the *real* 11 letters and diary, not render them obsolete footnotes to your narrative.

  **Concrete Costs at the Desk:**
  1.  **Cut or Radically Reframe the Drunk Scene:** This is the core offense. Its contradiction is the engine of "eviction." *Either*:
      *   **Cut it.** Find another way to explore tension/desire that doesn't flip her public identity.
      *   **Make it Explicitly Hypothetical/Uncertain:** Frame it as speculation ("Did she ever...?"), a character's unfounded suspicion, or a nightmare *she has* about failing her principles. Ensure the reader *knows* it's not presented as fact.
  2.  **Treat the Burned Letters Differently:** Burning letters is less existentially threatening than contradicting her public self-representation. If you keep it:
      *   **Avoid Specificity:** Don't invent *whose* letters or *what* they contained if that invents a relationship or motive without archival support.
      *   **Focus on the Act's Ambiguity:** Make it about the mystery, the loss, the *possible* reasons hinted at by the record, not a dramatized revelation that fills the void with your invention.
  3.  **Renaming is Laundering (and Cowardice):** It dodges the ethical question by pretending she's not real, while your intent is clearly to resurrect *this specific person*. It makes the project intellectually dishonest. If you don't believe you can ethically write *her*, write someone inspired by her.
  4.  **A Note/Afterword is Necessary but Insufficient:** It mitigates *reader deception*, but does nothing to solve *eviction*. The Netflix adaptation won't start with your disclaimer. The walking tour will cite the "dramatic scene" from the "definitive novel." The afterword becomes a footnote to your fiction. The *only* way an afterword combats eviction is if it **rigorously details every significant invention**, page by page, forcing the reader (and future adaptors) to constantly cross-reference. This burdens the art, but it’s the price of strict fidelity. Even then, the *primary* narrative will dominate.

  **The Better Frame: Preservation vs. Exploitation**  
  "Eviction" is apt, but the core ethical frame is **Preservation of the Fragile Trace**. Obscurity heightens, not lessens, your responsibility. The question isn't "Is this plausible?" but "**Does this invention preserve or exploit the vulnerability of her surviving historical presence?**" The drunk scene exploits the void to create a contradiction that overshadows her own voice. That's the strict line.

  **The Strict Verdict:**  
  Your obligation, given the near-total erasure of her record, is **invention that illuminates and extends the *surviving fragments* without contradicting her intentional self-representation or filling core silences with defining fictional acts that become the new "truth."** You must sacrifice the drunk scene's dramatic power or render it explicitly non-definitive. The rest of the interior life can be built *around* the known fragments, respecting their limits. The cost is the loss of that specific, vivid contradiction – but that loss is the price of preventing her historical erasure by your fiction.
