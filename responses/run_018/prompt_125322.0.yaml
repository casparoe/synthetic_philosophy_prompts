  **Institutional Art-Insurance Policy No. MET-001**  
  **Effective Date: Perpetuity**  
  **Insured: The Aeternum Museum**  
  **Object: "Diana Victorious" (Marble Statue w/ Clay Armature), ca. 5th BCE**  

  1. **Definitions**  
     1.1. "Insured Object" denotes the artwork *qua* culturally significant form, distinct from its material substrate ("Substrate"). The Insured Object is a *dominant sortal* entity, identified as "Diana Victorious" (DV) in all loan agreements, regardless of Substrate composition.  
     1.2. "Substrate" denotes the co-located matter (marble, clay, or void) occupying DV’s spatial coordinates at time *t*.  
     1.3. "Temporary Parts": Components whose removal/replacement does not disrupt DV’s continuity (e.g., clay armature fragments).  
     1.4. "Permanent Parts": Components whose replacement voids this policy (e.g., marble torso).  

  2. **Identity During Conservation**  
     2.1. DV persists under *endurantist* criteria: it is wholly present at each conservation stage, provided its artistic essence remains intact.  
     2.2. Senior Conservator’s Directive: "Per Regulation 7.3, DV is the statue you point to. If the armature crumbles, we swap in new clay. It’s still Diana. Philosophical hand-wringing is not billable labor."  

  3. **Temporary Parts Protocol**  
     3.1. Clay armature fragments removed during conservation cease to be part of DV upon detachment.  
     3.2. Void spaces left by removed fragments ("Shadow Statues") are:  
     - (a) Ephemeral entities lacking cultural significance.  
     - (b) Excluded from coverage, as they fail to meet *dominant sortal* criteria (being "holes" rather than "statues").  
     3.3. Reattached clay fragments reintegrate into DV’s Substrate without identity disruption.  

  4. **No-Branching Clause**  
     4.1. Should discarded fragments be reassembled elsewhere into a complete statue ("Clay Replica"):  
     - (a) The replica is a distinct entity under *four-dimensional preservation* criteria, having no spatiotemporal overlap with DV.  
     - (b) DV remains the sole Insured Object; the replica is deemed an "aesthetic derivative" with no claim to DV’s policy.  
     4.2. This clause preempts *perdurantist* challenges (e.g., "DV is a spacetime worm split by reassembly") by prioritizing institutional records over metaphysical hypotheses.  

  5. **Tripartite Identity Dispute Resolution**  
     5.1. In disputes involving:  
     - (i) DV (marble + new clay),  
     - (ii) Clay Replica (reassembled fragments),  
     - (iii) Shadow Statue (cumulative voids),  
     5.2. A panel (Curator, Metaphysician, Conservator) shall adjudicate via:  
     - (a) *Dominant Sortal Precedence*: DV holds priority as the original insured sortal ("statue").  
     - (b) *Continuity of Curation*: DV’s identity is affirmed if museum paperwork tracks it as "the same" object post-conservation.  
     - (c) *Void Nullification*: Shadow Statues are dismissed as "ontological static."  

  6. **Shadow Statue Exclusion**  
     6.1. Negative spaces lack *perduring identity*: they are non-sortal "accidents" of removal.  
     6.2. Claims arising from void-related damages (e.g., "collapse of artistic negative space") are invalid.  

  7. **Dispute Mechanism**  
     7.1. Continuity claims require:  
     - (a) Timestamped conservation logs proving unbroken *endurance*.  
     - (b) A signed affidavit from the Senior Conservator attesting that DV "looks and feels like Diana."  
     7.2. *Perdurantist* evidence (e.g., "DV is a temporal segment") is admissible but non-binding.  

  **Summary:** This policy enshrines endurantism under a dominant sortal regime, privileging the museum’s common-sense designation of "the statue" over the transience of matter, voids, or rival assemblies.
