answer: |-
  Here are the desiderata for any adequate theory of material constitution, designed to resolve the puzzles rather than redescribe them. Non-negotiable requirements are marked with **★**. Desiderata reflecting specific philosophical biases are noted.

  ---

  ### **Core Desiderata for a Theory of Material Constitution**
  1.  **Distinguish Constitution from Identity (Non-Collapse) ★**  
      *Why required:* Must explain why "A constitutes B" does not imply "A = B" (e.g., the clay ≠ the statue). Failure collapses constitution into identity, making puzzles incoherent.  
      *Non-negotiable:* Without this, the problem dissolves trivially.

  2.  **Handle Co-Location without Over-Counting ★**  
      *Why required:* Accounts for cases like statue/clay occupying the same space at the same time without treating them as one object (since they have different persistence conditions).  
      *Non-negotiable:* Rejecting co-location denies intuitive cases; over-counting violates parsimony.

  3.  **Accommodate Total Matter Replacement (Persistence through Change) ★**  
      *Why required:* Must explain:  
      - *The Sculpture Case:* Functional/informational continuity preserves identity despite no spatiotemporal matter continuity.  
      - *Biological Metamorphosis* (e.g., an organism replacing all cells): Metabolic continuity preserves identity.  
      - *Ship of Theseus:* Gradual part replacement preserves identity.  
      *Non-negotiable:* These are empirically attested or coherently conceivable phenomena a theory must address.

  4.  **Respect Persistence Conditions ≠ Essential Properties**  
      *Why required:* Persistence conditions (e.g., "survives part replacement") are distinct from essential properties (e.g., "being an artwork"). Confusing them conflates how an object endures with what makes it what it is.  
      *Non-negotiable:* Essentialism about matter (mereological essentialism) is counterintuitive for organisms/artifacts and fails desideratum 3.

  5.  **Formal Continuity Without Matter Fixity ★**  
      *Why required:* Must allow identity to persist via structural, functional, or informational invariants (e.g., the sculpture’s digital file, an organism’s genetic/organizational blueprint) even with complete matter turnover.  
      *Non-negotiable:* Matter essentialism is biologically/technologically implausible.

  6.  **Handle Distributed/Cloud Entities**  
      *Why required:* Entities like decentralized software or evolving data clouds lack stable parts/spatial relations. Their persistence relies on causal-role continuity.  
      *Reflects bias:* Rejects spatial continuity as necessary for persistence. Optional if theory scope excludes non-embodied objects.

  7.  **Avoid Contradicting Mereology/Biology**  
      *Why required:* Must not violate:  
      - Mereology: Parts compose wholes; wholes depend on parts.  
      - Biology: Organisms persist through metabolic replacement.  
      *Non-negotiable:* Contradicting science or logic undermines coherence.

  8.  **Spatiotemporal Continuity Not Required**  
      *Why required:* The sculpture case and cloud entities show persistence without unbroken spacetime paths.  
      *Reflects bias:* Rejects a premise of animalism/endurantism. Non-negotiable if desiderata 3 and 6 are accepted.

  ---

  ### **Tensions Between Desiderata**
  - **Greatest Tension:** **Co-location (2)** vs. **Total Matter Replacement (3)**.  
    *Why:* Constitution is typically synchronic (A constitutes B *at time t*), but the sculpture case demands diachronic constitution *without* overlapping matter. Can B at t₂ be constituted by A at t₁ if they never coexist? This strains "constitution" as a synchronic relation.

  ---

  ### **Evaluation of Standard Theories**
  | **Theory**               | **Key Failure**                              | **Fatal Desideratum**                     |
  |--------------------------|---------------------------------------------|------------------------------------------|
  | **Identity Theory**      | Collapses statue≠clay. Fails 1.             | *Desideratum 1 (Non-Collapse)* ★        |
  | **Baker-Style Constitution** | Requires spatiotemporal continuity; can’t handle the sculpture or cloud entities. | *Desideratum 8 (Spatiotemporal Not Required)* ★ |
  | **Mereological Essentialism** | Denies part replacement (fails 3, 5, 7). | *Desideratum 3 (Total Matter Replacement)* ★ |
  | **Four-Dimensionalism**  | Reduces persistence to temporal parts; "enduring artwork" becomes a sequence of distinct entities. Struggles with functional unity across time-slices. | *Desideratum 5 (Formal Continuity)* ★ |

  **Most Damaging Requirement:** **Desideratum 3 (Total Matter Replacement)** ★, particularly **the sculpture case**. It forces the theory to reject both matter essentialism *and* spatiotemporal continuity as necessary for persistence—crippling most mainstream accounts. The sculpture’s reliance on *informational invariance alone* for diachronic identity is the sharpest challenge.

  ---

  ### **Conclusion**
  An adequate theory must reconcile synchronic co-location with diachronic constitution across matter replacement, grounding persistence in formal/informational continuity rather than matter or space-time. **Desideratum 3** (especially the sculpture case) and **Desideratum 5** jointly demand this shift, exposing the limitations of extant frameworks. The tension between synchronic constitution and diachronic identity without matter overlap remains the central unresolved problem.
