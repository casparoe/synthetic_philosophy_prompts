prompt: |-
  I have just spent the better part of an evening in a long argument with a close friend about material constitution, and I am no longer satisfied with the familiar statue-and-clay examples that dominate introductory discussions. To push the problem further, I proposed a hypothetical case: a sculptural work that is continuously scanned and re-materialised in fresh substance every thirty seconds, guided by an invariant digital file, so that within a minute no original atoms remain, yet curators and viewers treat it as one enduring artwork. My friend claimed this merely reproduces the Ship of Theseus, but I think it raises a distinct question—whether constitution can be sustained by functional and informational continuity alone, without spatio-temporal continuity of matter. Before I pursue further reading, I want the full specification of what a theory in this area ought to achieve.

  Write the desiderata that any adequate theory of material constitution must meet to count as solving, not merely redescribing, how one object can be constituted by another without being identical to it. List the cases it must handle correctly: the classic statue and its clay, the continuously replaced artefact I described, biological metamorphosis in which an organism's material substrate is wholly replaced whilst identity is preserved, and distributed or 'cloud-like' entities whose parts lack stable spatial relations. For each requirement, give the consideration behind it—why it is demanded rather than optional—and distinguish those that are genuinely non-negotiable from those that reflect the prejudices of particular camps (for instance, strict mereological essentialism versus anti-essentialism, or the demand for spatio-temporal continuity of matter). State the distinctions the theory must respect—between constitution and identity, between persistence conditions and essential properties, and between material and formal continuity—and note which results from mereology or biology it must not contradict. Identify any pair of desiderata you believe are jointly unsatisfiable, explaining the tension. Then, briefly, assess how the standard identity theory, a constitution view in the manner of Lynne Rudder Baker, mereological essentialism, and a four-dimensionalist account stand against the list, but keep the weight on the criteria: in particular, say which single requirement does the most damage to the mainstream candidates. Please present your answer in American English, and do not provide bibliographies, reading lists, or citations.
