  ive been thinking about why the functionalism vs reductionism debate about mental states never seems to end even though everyone agrees on the basic science. my hunch is that the stall isn't really about brains vs silicon but about whether "multiple realizability" means substrate independence — minds could be made of anything — or taxonomic messiness, where mental kinds are just too disjunctive for neuroscience to use. one camp cites robot and alien examples to show minds aren't tied to neurons; the other cites the same examples but claims they're just showing that functional taxonomy is useless for actual explanation. is this a verbal disagreement about "realization", a hidden fight over whether disjunctive kinds can figure in laws, or are they actually answering different questions — one metaphysical, one about explanatory autonomy — under one heading? and if your diagnosis is right, what would move it: a formal result about projectibility, a clarification of mechanistic explanation, or is the question just badly posed? i dont want a survey of functionalist theories, just the diagnosis and what progress would actually look like.
