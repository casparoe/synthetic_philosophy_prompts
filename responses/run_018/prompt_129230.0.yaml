answer: |-
  Good morning. It’s an honour to stand before you in this room, where so many words have been committed to permanence. I’m a novelist. My tools are ambiguity, perspective, and the weight of time on human intention. I confess, I approach the question of *why promises bind* not as a scholar of action or a practitioner of resolution, but as an observer of aftermaths. I’ve spent years tracing the life of obligations long after their makers have gone, their contexts crumbled, or their original meanings blurred. What I’ve come to offer today isn’t a polished theory, but a metaphor – perhaps a lens. I call it **promissory residue**.

  We often speak of binding promises through the lens of *expectation*. The promise creates an expectation in the promisee; it’s this expectation, this reliance, this potential for disappointment or harm, that gives the promise its moral and social force. Break a promise, and you violate that expectation. It’s a powerful, intuitive framework – one I know many in this room navigate daily, whether in parsing intentionality or drafting clauses to manage reliance.

  But what do we make of the obligation that *lingers* when expectation is shattered, impossible, or never truly shared? When the promise is broken outright? When circumstances shift so utterly that fulfilling the original terms is nonsensical? Or when the very memory of the promise’s specific contours fades? Does the binding quality simply evaporate?

  I propose it does not. Instead, it leaves a trace. A **residue**. This residue isn’t the expectation itself – that might be gone, replaced by anger, resignation, or indifference. It’s something prior, and more persistent: the *structure of accountability* the promise momentarily established. It’s the ghost of the commitment, the indelible mark on the promisor, even when the promisee has moved on, the contract is void, or the world has rendered the act obsolete.

  Allow me a small, strange hypothetical to make this residue tangible.

  Imagine two neighbours, Ana and Ben. They share a garden wall, but not a language. Ana speaks only Telian; Ben only speaks only Rethic. One autumn day, Ana points to a delicate, frost-threatened vine clinging to Ben’s side of the wall. She gestures earnestly, using a Telian word: "*Veshtan*." Ben, wanting to be neighbourly, nods vigorously and repeats the closest Rethic word he knows: "*Kyre*." They smile, both satisfied.

  Ana believes she has secured a promise: "*Veshtan*" means "shelter it." She expects Ben will protect the vine through the winter. Ben believes he has understood a simple observation: "*Kyre*" means "beautiful thing." He has made no commitment; he only acknowledged the vine's beauty. Winter arrives. The vine dies. Ana feels betrayed. Ben is bewildered. The expectation is fractured, built on a fundamental mistranslation. It was never truly shared.

  Now, where does the obligation lie?

  Under an expectation-based view, Ben might be morally clear. He never *intended* a promise; Ana’s expectation, however heartfelt, was based on a misunderstanding. He has no duty to rectify something he didn't knowingly create.

  But consider Ben later that spring. He sees Ana tending her garden, avoiding his gaze. He sees the bare patch on the wall where the vine died. He remembers the earnestness in her eyes that autumn day, his own enthusiastic nod. He feels… responsible. Not for the dead vine, perhaps, but for *something*. For the connection that fractured. For the weight of that exchanged word, "*Kyre*," which *he* uttered in response. He feels compelled to mend *that* break, perhaps by planting a new vine, or simply by finding a way to bridge the silence. This is **promissory residue**.

  The residue isn't Ana's lost expectation of a sheltered vine. That expectation dissolved with the frost and the revelation of the mistranslation. The residue is the *accountability* Ben feels *to the act of having uttered a word he presented as responsive and committed*, even if its content was misaligned. The promise, however mistakenly formed, created a relational architecture – a link of attempted obligation – between them. Its breaking didn't dismantle that architecture entirely; it left ruins. And Ben finds himself accountable for navigating those ruins, for acknowledging the shadow of the commitment that *was* made, however flawed.

  This residue operates independently:

  *   **Of Enforcement:** A lawyer might tell Ben he has no contractual liability. The agreement was void *ab initio* due to mutual mistake. Yet, the residue persists. It speaks to a duty that exists prior to and beyond legal remedy – the duty to the *fact* of the attempt at commitment itself.
  *   **Of Active Expectation:** Ana might eventually forgive Ben, understanding the mistake. Her specific expectation of vine-sheltering is gone. Yet, Ben’s residue of accountability might still drive him to act. The residue binds *him* to the echo of his own past act of promising.
  *   **Of Perfect Recall:** Years later, Ana and Ben might forget whether the word was "*Veshtan*" or "*Kyre*," or even which vine it was about. But if they pass that section of the wall and a shared, awkward silence falls, the residue of that broken connection might still colour the space between them.

  For the mediators here, you see this daily: the unresolved tension, the unspoken debt, the need for closure that lingers long after the legal dispute is settled or the explicit expectations have been managed. You navigate the residue.

  For the lawyers, consider the contract signed in good faith, rendered impossible by unforeseen catastrophe. The expectation of performance is extinguished. Enforcement may be futile. Yet, parties often feel compelled to *acknowledge* the broken bond, to negotiate not just compensation, but a kind of mutual recognition of the duty that *was* undertaken. That’s residue calling.

  For the philosophers, this is more than a lingering psychological effect. It’s a normative remainder. The act of promising, even imperfectly, even disastrously, alters the moral landscape for the promisor. It creates a specific kind of accountability – a debt to the *form* of the commitment – that isn't solely derivative of the promisee's mental state. It binds because the promisor stepped onto the promissory ledge, and even if they fall, the ledge remains part of their structure.

  This residue isn't always benign. Like radiation, it can persist long after the source event, causing unseen damage. Inherited feuds, institutional guilt, the silent burden of an ancestor's reckless vow – these too are promissory residues, obligations surviving their origins, warping through time. They bind not because anyone still expects the original act, but because the structure of accountability, however twisted, remains.

  We gather in a converted library. Think of the promises whispered, argued, and sealed within these walls, long dissolved into air. The books remain. The shelves stand. The architecture of commitment endures. Promissory residue is that architecture – the silent, enduring framework left behind when the specific words fade, the expectations die, or the world moves on. It reminds us that a promise, once made, is never truly gone. It leaves a mark on the one who made it, a footprint in the normative landscape, an obligation that can outlive its maker, its purpose, and even its memory – a residue that continues to bind. Thank you.
