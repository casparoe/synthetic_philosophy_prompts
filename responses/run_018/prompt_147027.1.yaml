  hey, i cover science and ideas for a small newsletter — mostly trying to translate philosphy stuff for readers who actually work in data science and econ. i was discusing Quine's take on moral values with a friend last week: the idea that ethics isn't part of our objective conceptual scheme like physics is, but more like social conditioning layered onto our web of belief. my readers know revealed preference and Bayesian updating cold, but they don't know Quine, so i want to do a translation exercise.

  can you restate Quine's position on moral values — especially his naturalized skepticism that ethical statements aren't objective truths in the same way scientific ones are — using only the vocabulary of revealed preference theory and Bayesian belief updating? treat moral commitments like preference orderings that get updated with social priors rather than observed data, and push it as far as it can go. then give me a residue report: which parts map cleanly, which parts you have to distort, and whether there's anything Quine actually says about values that just has no counterpart in revealed-preference talk. is the missing stuff a failure of the economic vocabulary, or does it show Quine was being vaguer than he let on?

  oh, and please don't quote long passages from Word and Object — i don't have it in front of me and i don't want to recieve wrong page numbers. just paraphrase in plain language. also sorry if there's a typo in here, i'm writing this on my phone between interviews.
