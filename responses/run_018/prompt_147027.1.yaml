  First, I need to mentally unpack Quine's position: his naturalized epistemology treats ethics as social conditioning rather than truth-apt statements, contrasting with scientific claims that fit into our web of belief through empirical testing. The user specifically wants this framed as preference orderings updated by social priors instead of data.

  Hmm, the translation seems feasible at first glance: 
  - Moral claims as unstable preference orderings rather than fixed truths ✔️
  - Socialization as Bayesian updating with community priors ✔️
  - Cultural variance as differing prior distributions ✔️

  But I'm already spotting friction points. Quine's "web of belief" metaphor implies holistic coherence-seeking that revealed preference doesn't capture - preferences can be contradictory without triggering Bayesian crisis. Also, his distinction between empirical content (for science) versus expressive function (for ethics) has no clear counterpart in utility functions. 

  The user's residue report request is smart. I should flag:
  - Clean mappings: preference instability, social learning mechanics
  - Distortions: pretending moral debates have "data" like price signals
  - Missing pieces: Quine's ontological commitment gap - no economic equivalent for why we treat electrons as real but not "oughts"

  I wonder if the user anticipated the vocabulary's biggest limitation: revealed preference can't handle Quine's key point that moral statements lack truth conditions. Utility functions don't care about truth values. That's not vagueness in Quine - it's a fundamental feature the economic model ignores.

  Better emphasize that last point. The residue exposes econ's blindness to semantic status, which is precisely what Quine cared about. Might spark good discussion in their newsletter about modeling limitations.
answer: |-
  Here's a strict translation of Quine's moral skepticism into revealed preference/Bayesian terms, followed by a residue analysis:

  **Core Translation:**

  1.  **Moral Commitments as Preferences:** Agents have a *preference ordering* over states of the world involving "ought-statements" (e.g., "Prefer state where promise-keeping occurs" > "Prefer state where promise-breaking occurs"). These are not innate but *revealed* through behavioral choices in social contexts.
  2.  **Origin: Social Priors, Not Empirical Data:** These preference orderings are primarily *initialized* and *updated* by exposure to *social priors* (parental reinforcement, cultural norms, peer pressure, institutional rules) rather than by *observed data* about the physical world (like sensory input or experimental results).
  3.  **Stability Through Social Feedback:** The stability of a moral preference depends on the strength and consistency of the *social feedback signals* reinforcing it (approval, punishment, status rewards). Strong, consistent signals lead to high-precision priors and stable preferences. Weak or conflicting signals lead to low-precision priors and unstable preferences.
  4.  **Lack of Objective Calibration:** Unlike scientific beliefs (e.g., "Gravity causes apples to fall"), there is no *external, intersubjectively verifiable dataset* (like repeated measurements of falling apples) to definitively confirm, falsify, or precisely calibrate moral preferences ("Stealing is wrong"). Updates rely on shifting social signals, not convergence on an external truth.
  5.  **Variance Explained by Priors:** Cross-cultural or interpersonal moral disagreement arises from agents starting with different *initial social prior distributions* over possible moral orderings and receiving different *social update signals* throughout their lifespans. There's no "true prior" or "correct signal" to converge upon.
  6.  **Distinction from Science:** Scientific beliefs are preference orderings over hypotheses *updated by physical data*. "Electrons exist" stabilizes because predictions based on it consistently match physical observations (data likelihood overwhelms prior). "Charity is good" stabilizes only if social signals consistently reinforce it; no physical data can confirm its "truth".

  **Residue Report:**

  1.  **Clean Mappings:**
      *   **Social Origin & Conditioning:** Mapping socialization to Bayesian updating with strong social priors fits well. Quine's "conditioning" is directly analogous to prior formation and updating via social signals.
      *   **Lack of Empirical Foundation:** The core skepticism – ethics lacks the empirical, data-driven calibration mechanism of science – maps perfectly. Revealed preferences updated solely by social signals lack the objective anchor of data-updated scientific beliefs.
      *   **Relativity/Subjectivity:** Explaining moral variance through differing priors and update histories is a strong fit for Quine's view of ethics as contingent on social context.
      *   **Pragmatic Function:** Moral preferences functioning as coordination mechanisms or internalized social rules (revealed in behavior) aligns with Quine's view of them as practically useful conditioning.

  2.  **Distortions/Approximations:**
      *   **"Web of Belief" Holism:** Quine's holistic web (where beliefs face experience as a whole) is flattened. In this model, moral preferences are distinct modules updated by social signals, scientific beliefs by physical data. Quine allows for *some* interaction (e.g., science might inform *how* to achieve a moral end), but the translation risks oversimplifying the potential interconnectedness.
      *   **The *Nature* of the "Statement":** Revealed preference treats "preferences" as behavioral dispositions. Quine is specifically concerned with the *semantic status* of ethical *statements* ("Is 'X is good' true/false?"). The translation implicitly answers "No, they're expressions of socially conditioned preferences," which captures the skepticism but buries the linguistic focus slightly.
      *   **Degree of Skepticism:** The model *implies* the non-objectivity Quine argues for, but Quine's argument is often seen as *stronger* – not just that ethics *isn't* objective like science, but that it *can't be* because it lacks the right kind of empirical content. The model shows *how* it isn't objective, supporting the conclusion.

  3.  **Missing Pieces & Vocabulary Limits:**
      *   **Ontological Commitment:** Quine links truth and objectivity to ontological commitment – we commit to the existence of electrons because they are indispensable posits in our best scientific theories. Moral predicates ("good", "ought") are *not* indispensable in the same way; we can describe the world fully (including human behavior and social conditioning) without them. **This crucial argument for *why* ethics isn't objective has *no direct counterpart* in revealed preference/Bayesian vocabulary.** Revealed preference *uses* preferences as primitives; it doesn't question their ontological status relative to scientific terms. This is a **failure of the economic vocabulary** to capture Quine's deeper metaphysical/linguistic argument.
      *   **Truth-Conditions vs. Utility:** Quine's core issue is the lack of *truth conditions* for ethical statements independent of the conditioning. Revealed preference/Bayesian updating talks about the *origin* and *stability* of preferences, but not directly about the *semantics* or *truth-aptness* of statements expressing them. The vocabulary handles the *mechanics* of belief/preference formation well but sidesteps the *philosophical question* of what makes a statement capable of being true or false. **This missing piece highlights a limitation in the economic framework for addressing fundamental semantic/philosophical questions; it doesn't show Quine was vague.**
      *   **The Expressive Function:** Quine sometimes notes the *expressive* or *prescriptive* ("Boo! Hurrah!") function of moral language, which is distinct from descriptive scientific language. Revealed preference captures the dispositional *source* of prescriptions but not the unique linguistic *force* Quine sometimes alludes to.

  **Conclusion:**

  The translation **successfully captures** the core mechanisms Quine describes: the social origin of morals, their lack of empirical foundation compared to science, their contingency, and the resulting skepticism about their objectivity. The **vocabulary excels** at modeling the *process* of moral preference formation and its difference from scientific belief updating.

  However, the **vocabulary fails** to engage with Quine's deeper philosophical argument based on **ontological commitment** and the **semantic status** (truth-conditions) of ethical language. This isn't due to Quine's vagueness; it's an inherent limitation of the revealed preference/Bayesian framework when pushed into metaphysical and semantic territory. It models the *behavior* and *learning* associated with morals perfectly well but cannot directly address Quine's argument about *why* moral statements fundamentally differ from scientific ones in their claim to objective truth.

  **The residue exposes the boundary between descriptive behavioral modeling (economics) and fundamental philosophy of language/metaphysics (Quine).** Your readers will grasp *how* morals work like social preferences, but the *deepest why* of Quine's skepticism requires stepping slightly outside the pure econ framework.
