  1. **Logical Core:**  
     - The invariant (even amendment count) traps them at "0" (like the MU-puzzle’s multiple-of-3 "I"s blocking "MU").  
     - Deadlock arises from consistent, insufficient internal rules (self-ratification paradox).  
     - JOOTS move: Ada appeals to a *pre-system* state ("before it exists") to break the deadlock—an unauthorized meta-framework.  

  2. **Niche Scenario:**  
