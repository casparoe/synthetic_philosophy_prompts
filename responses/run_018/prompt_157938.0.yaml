  She scrawled "Amendment 1: Ratify this charter" on a napkin.  
  *"See? No charter needed to authorize its own birth. We just violated the one rule that isn’t a rule yet."*  

  The convention gasped. Then cheered.  
  Ada grabbed her coat: *"Now, about dinner breaks being undecidable in Article 3..."*  

  ---

