  **The delegates at the Constitutional Convention of Lower Slobbovia were stuck.**  
  Their founding charter declared: *"Every amendment requires ratification by the current version of this charter."*  
  But with zero amendments ratified, the charter couldn’t ratify itself.  
  Days passed. Arguments cycled. Coffee ran out.  

