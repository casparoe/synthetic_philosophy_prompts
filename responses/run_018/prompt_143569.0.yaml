answer: |-
  **1. Setup, Roles & Rules (~200 words)**  
  *Materials:* 6 large index cards (3 labeled "INSTITUTIONS", "GEOGRAPHY", "CULTURE" per team), 30+ small paperclips (aid tokens), whiteboard, hidden modifier cards (pre-written).  
  *Teams:* Split into two "Development Advisory Boards" (DABs). Each picks: **Economist** (allocates aid), **Historian** (argues root cause), **Scribe** (records on cards).  
  *Setup:* Reveal two fictional nations:  
  - **Khemria:** GDP $15k, "Coastal, fertile valleys, mineral-rich mountains", "Strong property laws, centralized judiciary", "High social trust, communal land traditions".  
  - **Auronia:** GDP $15k, *Identical stats as Khemria*.  
  *Secret:* Each nation has hidden feedback loops (modifier cards):  
  - Khemria: "Mineral wealth fuels judicial corruption → -1 INSTITUTION if GEOGRAPHY aid >3 tokens".  
  - Auronia: "Communal traditions enforce property laws → -1 CULTURE if INSTITUTIONS aid >3 tokens".  
  *Rules:*  
  - Each round, teams debate the *one* root cause (Institutions/Geo/Culture) blocking wealth growth.  
  - Allocate 1-5 paperclip "aid tokens" to their chosen cause.  
  - Tokens spent = +1 to *that* category.  
  - **Goal:** Max "Reputation Points" (RPs). Gain 1 RP per correct *stable* diagnosis (revealed later). Lose 1 RP if modifiers trigger collapse.  

  **2. Round-by-Round Flow (~300 words)**  
  **Min 0-5:** Intro nations, roles, rules. Teams get cards & 15 tokens.  
  **Round 1 (Min 5-17):**  
  - Teams debate & lock in root cause #1. Scribe writes it on card + spends tokens.  
  - *Reveal:* Show GDP unchanged for both. Secretly apply modifiers (e.g., if Khemria put 4 tokens on GEOGRAPHY, flip modifier → INSTITUTIONS card gets -1 paperclip). Don’t tell teams *why* stats shifted yet.  
  **Round 2 (Min 17-29):**  
  - Teams see adjusted stats (e.g., Khemria: INSTITUTIONS now "Moderate property laws..."). Re-debate root cause, allocate new tokens.  
  - *Reveal:* GDP still $15k! Apply modifiers again. If a category hits ≤ -2 tokens, "collapse" it (crumple card). Teams lose 1 RP.  
  **Round 3 (Min 29-41):**  
  - Teams work with damaged/boosted stats. Final debate + allocation.  
  - *Reveal full feedback loops:* Show modifier cards. Calculate RPs:  
    - +1 RP if their *final* diagnosis avoided collapse.  
    - -1 RP per collapsed category.  
    - +0 if they switched causes each round.  
  **Wrap (Min 41-45):** Tally RPs. Whiteboard team choices & outcomes side-by-side.  

  **3. Debrief, Failure Modes & Recovery (~250 words)**  
  *Debrief Map:*  
  - **Round 1:** Identical inputs → identical outputs? **Equifinality** (different paths to same GDP).  
  - **Round 2:** Aid to one factor *undermined* another? **Overdetermination** (causes are entangled; fixing X breaks Y).  
  - **Round 3:** Collapsed categories? **Counterfactual fragility** (removing/swapping a "cause" destroys the system).  
  *What’ll Go Wrong:*  
  1. **Chaos:** Teams panic when stats shift randomly. *Recovery:* Lean in! Ask: "Why did your brilliant R1 plan fail?"  
  2. **Blame Gaming:** Historian vs. Economist meltdowns. *Recovery:* Remind them it’s about systemic failure, not individual blame.  
  3. **Time Crunch:** Rounds overrun. *Recovery:* Use strict 10-min debate + 2-min allocation. Cut Round 3 if needed.  
  *Recovery Tip:* If both teams collapse everything, highlight: "This is the point! You *experienced* the mirror-state problem – isolated fixes destroyed the context holding institutions together."  

  **4. The Gap We Can’t Stage (~150 words)**  
  Honestly? We can’t simulate the **semantic collapse** moment. The activity makes them *feel* the feedback loop tension & counterfactual fragility, but when Auronia’s "property law" (held up by culture) gets swapped into Khemria (where geography undermines it), the *meaning* of "property law" implodes – but students still see the same *words* on crumpled cards. The visceral realization that "institution" is a label for a context-specific function, not a freestanding object? That’s gotta come from you verbally post-game. Hit ’em with: "When you moved ‘strong property laws’ to a context where its hidden supports were gutted, did it remain the *same* institution? Or did it become a hollowed-out shell?" That’s the mirror-state gut-punch.  

  ---  
  *Casual slip:* "minit-by-minit" 😅 & "gotta come from you" – good luck running this! It’ll be messy but the "aha!" faces when stats backfire? *Chef’s kiss*.
