  Okay, I need to tackle this user's query about Pascal's Pensées, specifically on justice and force. They're in a reading group stuck on fragments where Pascal discusses how justice must ally with force because justice is disputable while force isn't, but he also warns against force becoming the sole arbiter. Their friend proposed a "normative residue thesis": that force gains a derivative normative authority over time. The user is unsure if this makes Pascal seem more like a sociologist than a Christian moralist.

  First, I have to recall Pascal's key arguments. He emphasizes that justice without force is weak, and force without justice is tyrannical. The disputability of justice comes from human fallenness after the Fall, where reason is corrupted. Force becomes necessary to impose order. But Pascal also insists that force alone can't create legitimacy; it needs a veneer of justice. This tension is central.

  The user's friend's idea of "normative residue" suggests that once an institution is backed by force long enough, dismantling it feels unjust even if the original justification is gone. But is this Pascal's view? I need to weigh evidence from the text. Pascal mentions that laws become respected because they're established, not because they're just—this sounds like normative residue. However, he also says this is part of human weakness and that true justice comes from God.

  Considering Pascal's theological context is crucial. As a Jansenist, he believed in original sin and corrupted human reason. Humans can't achieve true justice on their own; it requires divine grace. So while he observes that institutions gain legitimacy through force and habit, it's a critique of human society, not an endorsement. He's describing a fallen state, not prescribing how institutions should derive authority.

  Textual evidence: Pascal's fragment on usurpation where he says justice without force is impotent, force without justice is tyrannical. Also, the quote about laws being just because they're established. But he calls this a "mystical foundation," hinting at a deeper divine justice. The wager fragment also ties justice to God, implying that without God, justice is arbitrary.

  Arguments against the normative residue thesis: Pascal consistently separates divine justice from human institutions. He doesn't see the residue as truly normative; it's an illusion of legitimacy. The feeling of injustice when dismantling such institutions is part of human error, not proof of real authority. His Christian moralist perspective prioritizes God's justice over sociological phenomena.

  Practical stakes: If we interpret Pascal as endorsing normative residue, it could justify conservatism and maintaining unjust institutions. But if we see it as a critique, it urges seeking divine justice beyond human systems. Getting this right affects how we apply Pascal's thought to modern issues like political authority and reforms.

  What would change my mind? If Pascal explicitly stated that force-derived authority becomes legitimate over time, or if he presented habit as a positive norm-making force without theological caveats. But he doesn't; he frames it as a consequence of sin. The strongest counter-evidence is his acknowledgment of established laws' psychological power, but he undercuts it by pointing to God.

  Conclusion: Pascal's account doesn't support normative residue as a source of legitimacy. Instead, it highlights the gap between human illusions of justice and true divine justice. This preserves his Christian moralist stance, seeing sociological observations as part of a fallen world needing redemption.
