answer: |-
  Below is a practical grading procedure for your TAs to evaluate inference steps in student proofs, designed to halt infinite regress by leveraging a predefined "ledger" of acceptable justifications. The ledger consists of:  
  - **Base Budget**: Primitive rules (modus ponens, direct substitution, identity) that require no further justification.  
  - **Collateral Deposit**: Rules justified in prior workshop-agreed texts (e.g., standard logic textbooks or course notes). Cite the source.  
  - **Deductive Debt**: Steps with no justification in the ledger. TAs must explicitly decide how to handle them.  

  **Grading Procedure Flow**  
  For each inference step in the student's proof:  
  1. **Identify the rule used** (e.g., modus ponens, conjunction elimination).  
  2. **Check the ledger**:  
     - **A. Base Budget?** If the rule is in the base budget (modus ponens/substitution/identity), mark it **PAID** and move on.  
     - **B. Collateral Deposit?** If the rule is not in the base budget but is in the collateral deposit (with a pre-agreed source), note the source (e.g., "Smith (2020), p.45") and move on.  
     - **C. Deductive Debt?** If neither, flag as **UNJUSTIFIED DEBT**. The TA must choose:  
       - **Accept on credit**: Tolerate the step (e.g., for minor leaps). Mark as **CREDIT**.  
       - **Reject**: Invalidate the step. Mark as **REJECTED**.  
       - **Demand reformulation**: Require the student to rework the step using only base budget or collateral rules.  

  **Judgment Calls (Cannot Be Automated)**  
  - **Initial ledger setup**: Instructor/TAs define the base budget and collateral deposit before grading. Example:  
    - *Base Budget*: Modus ponens, direct substitution, identity.  
    - *Collateral Deposit*: Conjunction elimination (from textbook Ch.3), disjunctive syllogism (from lecture 5).  
  - **Collateral validity**: TAs must verify if a rule is truly in the deposit. No ambiguity allowed—deposit is fixed at term start.  
  - **Credit tolerance**: TAs decide per step based on context (e.g., accept trivial leaps, reject critical gaps).  

  **What the Procedure Cannot Do**  
  - Settle philosophical disputes (e.g., "Is modus ponens *really* primitive?"). Forces your pre-declared stance.  
  - Expand collateral mid-term or discover new justifications. Deposit is static.  
  - Fix misidentified rules. TAs must infer the rule from student notation.  

  ---

  **Applied to Student Proofs**  

  ### Proof 1: Clean Syllogism (Stays in Base Budget)  
  **Student's Proof**:  
  1. If P, then Q. (Premise)  
  2. P. (Premise)  
  3. Therefore, Q. (From 1,2)  
  **TA Grading**:  
  - Step 3: Rule = **modus ponens**.  
    - Check ledger: Modus ponens is in **base budget**.  
    - Result: **PAID**. No debt.  
  **Verdict**: Proof passes. Never leaves base budget.  

  ### Proof 2: Justifying Modus Ponens via Normalization (Hits Regress)  
  **Student's Proof**:  
  1. Natural deduction normalization ensures proof stability. (Premise)  
  2. Modus ponens steps can be normalized. (From 1)  
  3. Normalizable rules are sound. (Premise)  
  4. Therefore, modus ponens is sound. (From 2,3)  
  **TA Grading**:  
  - Step 2: Rule = **universal instantiation** (from "all normalization applies" to "modus ponens").  
    - Base budget? No.  
    - Collateral deposit? Assume not pre-agreed.  
    - Result: **UNJUSTIFIED DEBT** (universal instantiation not in ledger).  
  - Step 4: Rule = **modus ponens** (applied to 2 and 3).  
    - Base budget? **Yes** (modus ponens is primitive). Result: **PAID**.  
  **TA Action on Debt (Step 2)**:  
  - **Reject**: Universal instantiation is not justified. Student must use base/collateral rules.  
    - *Why you'll hate this*: The procedure flags the regress (justifying modus ponens requires another rule, which itself needs justification). It either rejects the step or forces credit—neither resolves the philosophy.  
  **Verdict**: Proof fails unless TA accepts step 2 on **CREDIT** (but this is arbitrary and defeats the ledger's purpose).  

  ### Proof 3: Sloppy Conjunction Elimination (Hidden Debt or Lazy Notation?)  
  **Student's Proof**:  
  1. P ∧ Q. (Premise)  
  2. Therefore, P. (From 1)  
  **TA Grading**:  
  - Step 2: Rule = **conjunction elimination** (inferred by TA).  
    - Base budget? No.  
    - Collateral deposit? Only if pre-agreed (e.g., "Textbook Ch.3 covers it").  
      - *Case A (Not in deposit)*: Flag as **UNJUSTIFIED DEBT**.  
      - *Case B (In deposit)*: Note source (e.g., "Textbook Ch.3") and approve.  
  **TA Judgment**:  
  - If collateral includes conjunction elimination: **APPROVED** (but mark as "lazy citation").  
  - If not:  
    - **Accept on credit?** Only if TA deems it trivial (e.g., workshop emphasizes propositional logic).  
    - **Reject?** If strict ("Student must cite collateral").  
    - **Demand reformulation?** Require explicit use of base rules, e.g.:  
      - *Reformulated step*: "P ∧ Q implies P" (identity rule if defined as axiom).  
  **Verdict**: Depends entirely on collateral setup. Highlights how judgment shapes outcomes.  

  ---

  **Key Takeaways for TAs**  
  - **Stop regress by design**: The ledger halts "justification chains" by capping them at base/collateral.  
  - **No philosophy in grading**: The procedure doesn’t debate primacy; it enforces your pre-declared ledger.  
  - **Critical judgment areas**: Setting the ledger, interpreting rules in sloppy steps, and managing credit.  
  - **Practical output**: A marked proof with **PAID**, **COLLATERAL (source)**, **CREDIT**, or **REJECTED** per step.  

  This system shifts debates to term setup (where you define the ledger) and makes grading consistent and finite. TAs can implement it in minutes per proof—no recursion required.
