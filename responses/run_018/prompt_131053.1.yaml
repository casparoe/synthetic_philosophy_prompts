      2.2. **Rationality-Induced Distress (RID):** User acknowledges that contemplation of Subsection 2.1(a), particularly the computation that Expected Utility (`EU`) maximization under linear utility dictates wagering arbitrarily large finite sums, may induce psychological distress ("St. Petersburg Anxiety" or "Bernoulli's Remorse").  
