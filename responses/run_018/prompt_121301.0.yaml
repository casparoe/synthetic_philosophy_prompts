prompt: |-
  Hey, I need help writing a proposal thing. I got into this summer program where you get paired with a grad student mentor for like 8 weeks and you're supposed to hand in a two-page proposal for a paper you'd work on over that time. My idea is about transformative experience — you know, those big choices like having a kid, or moving to a country you've never been to, or joining something all-consuming, where you can't really know what it'll be like until you've done it, and by then you can't undo it. The philosopher who writes about this (my mentor will help me with the real names and citations later) says the trouble is that you're choosing without the information you'd need, so the usual move is to try to get as close to the experience as possible beforehand, or to listen to people who've already been through it and trust that they're telling you something useful.

  My half-formed thought is that there are actually two different problems getting mashed together and the mashup is confusing everyone. First problem: you don't know what it's like. Second problem: after you do the thing, you'll be a different person who wants different stuff and judges things by different standards, so even a perfect advance preview wouldn't tell you whether the person you'd become would be glad you chose it. I think the second one is the one that actually breaks the choice, and the way to show that is to build cases where the first problem is completely solved — a preview that hands you the full experience of what it's like for a day and then wears off, or a pill, or a perfect simulation, whatever works — and then show that the person still can't decide, and that what's stopping them isn't missing information about anything. So the preview cases have to be honest: the person really does come out knowing what it's like, no cheating by making the preview vague or partial.

  Can you turn that into a proposal? It needs the question stated sharply enough that it has a real answer, why the existing answers don't settle it (both the get-more-information line and the just-decide-who-you-want-to-become line), what I'd actually do week by week for 8 weeks part time and why that approach rather than the obvious alternatives, what a finished paper would look like as a deliverable, and an honest bit on what would count as the project failing — like what finding would mean the two-problems thing was just a fancy re-description of one problem and I hadn't really found a distinction at all. Also please say what feature of the preview cases is doing the work and what happens to the argument if that feature gets removed, and give me the strongest thing someone who disagrees would say. My mentor said not to bother with a bibliography or any quotes for now, she'll help me find the actual sources, and she wants me to be able to make the argument just by reasoning about cases rather than running anything empirical, so keep it armchair. Write it as plain paragraphs, no headings, no bullets, no bold, no tables, just like an email, because the form I paste it into strips all formatting out anyway. Its due next friday so no pressure lol.
