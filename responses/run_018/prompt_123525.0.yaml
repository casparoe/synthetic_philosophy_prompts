  This preserves autonomy: thermostat "desires" under design stance describe physical functions, while human desires under intentional stance track irreducibly rational contours. No collapse, no inflation, no relativism - just differentiated reality tiers. The thermostat comparison actually proves the point: same predictive success, but different kinds of patterns with distinct ontological implications. 

