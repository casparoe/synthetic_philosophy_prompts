prompt: |-
  I will present a paper defending a revisionist account of moral worth at a philosophy of action workshop. My thesis is that moral worth attaches not to the purity or transparency of an agent's motivational state at the moment of action—the standard "right reasons" view—but to what I term reflexive normative stability: the agent's prior structuring of their deliberative environment (through precommitment mechanisms, institutional scaffolds, or deliberative protocols) such that the right reason remains authoritative and accessible under conditions of anticipated motivational erosion. On this view, an agent who acts through well-designed scaffolding retains full moral worth even when the immediate psychological state lacks the pristine motivational clarity that Kantians require; worth is a property of the architecture of agency, not only of the occurrent mental state.

  The audience is specific and hostile in precise ways: three Kantian moral philosophers who hold that any instrumental mediation between the will and the moral law corrupts autonomy and thus worth; two situationist moral psychologists who deny that character traits are stable enough to make "structuring one's environment" a coherent achievement rather than a post-hoc narrative; one virtue ethicist who will argue that this collapses practical wisdom (phronesis) into behavioral engineering; and two advanced graduate students who will press on whether the view makes moral worth too easily available to well-resourced agents with access to institutional support. They care about autonomy, empirical realism, and distributive fairness in moral achievement.

  Draft my Q&A prep sheet: list the eight objections I will actually face, ordered from the most damaging to the least, each phrased in the vocabulary of the objector who will raise it (the Kantian, the situationist, the virtue ethicist, the graduate student). For each objection, provide a concise reply suitable for a two-minute response, and then an explicit note on where that reply is weakest or what ground it concedes. Conclude with the single question I am hoping nobody asks—identify it, explain who will ask it, why it is dangerous to my position, and sketch the reply I should have ready even though I hope to avoid using it. Do not provide bibliographies, citation lists, or reading recommendations; the reply should stand on conceptual argument alone.
reasoning: |-
  Okay, the user is presenting a paper on moral worth at a philosophy workshop. Their thesis challenges the traditional Kantian view by proposing that moral worth comes from "reflexive normative stability" – how agents structure their environment beforehand to maintain commitment to right reasons, even when their immediate motivation isn't pure. 

  Hmm, the audience is tough: Kantians who'll see this as corrupting autonomy, situationists who doubt stable character, a virtue ethicist worried about reducing wisdom to engineering, and grad students concerned about fairness. Each group has distinct concerns – autonomy, empirical realism, practical wisdom, and distributive justice. 

  First, I need to identify the most damaging objections. The Kantian autonomy objection seems most fundamental – if my view violates core ideas of moral agency, everything else crumbles. Then the situationist's empirical challenge: if psychology doesn't support stable character structures, my whole scaffolding idea collapses. 

  The virtue ethicist's "engineering vs wisdom" point hits next – if I reduce phronesis to mere mechanism, I lose the moral depth. Then the fairness concern: if only resourced agents can build scaffolds, moral worth becomes elitist. 

  For replies, I must speak each objector's language. To Kantians: emphasize that precommitments express, not undermine, autonomy when properly structured. But I'll have to concede this redefines "purity". To situationists: argue that scaffolds work precisely because they bypass unreliable traits. Concede it might overstate environmental control. 

  That grad student fairness objection is tricky... I'll need to show moral worth remains accessible through low-resource scaffolds while admitting privilege creates advantages. 

  The nightmare question? Probably the "revisionism or abandonment" one from a sharp grad student. If pressed, I'd have to bite the bullet: yes, this replaces purity with stability as the core of worth. Risky, but consistent. 

  Better prepare that reply even if I hope no one asks. The virtue ethicist might pounce on how thin my "stability" concept is compared to phronesis too... *sigh* Workshop Q&As are brutal.
answer: |-
  Here is your Q&A prep sheet, ordered from most to least damaging objections, with replies and vulnerability notes:

  ---

  **1. Kantian Autonomy Objection (Most Damaging)**  
  *Objection:* "Your scaffolding instrumentalizes the moral law. By inserting mechanisms between the pure will and duty, you replace autonomous motivation with heteronomous causation. Worth requires the reason itself to be the *immediate* determinant of the will—not a pre-programmed subroutine."  
  **Reply:** "Scaffolding isn't a *replacement* for rational endorsement but its *temporal extension*. Autonomy is exercised in the design phase: the agent *now* binds their future self to ensure reason retains authority when temptation arises. This is self-governance, not external coercion—Kant himself endorsed *self*-constraint (e.g., against lying impulses)."  
  **Vulnerability:** Concedes that worth requires *immediate* rational causation at design-time, not action-time. Weak on why post-design non-deliberative action preserves autonomy.

  **2. Situationist Stability Objection**  
  *Objection:* "Your 'prior structuring' assumes a coherent, enduring agent who can predict motivational erosion. But situationism shows we have no such stable character. 'Structuring' is just another context-dependent impulse, not a control lever. Your 'scaffolds' are ex-post stories for what was really luck."  
  **Reply:* "Scaffolding *bypasses* the need for stable traits. It uses external triggers (alarms, contracts) or rigid protocols (checklists, blind review) that *force* attention to reasons regardless of fluctuating impulses. A nurse using a hand-hygiene checklist acts with worth even if distracted—because the system secures reason-accessibility."  
  **Vulnerability:** Assumes scaffolds themselves are immune to situational erosion. Concedes individual agency is fragmentary.

  **3. Virtue Ethics Collapse Objection**  
  *Objection:* "You reduce *phronesis* to behavioral tech. True practical wisdom dynamically responds to particulars. Your 'stability' is robotic rule-fetishism—it can’t distinguish between a wise precommitment and a compulsive ritual."  
  **Reply:** "Reflexive stability *requires* wisdom: designing scaffolds demands anticipating which reasons will erode and which protocols preserve their *normative* (not just causal) force. The nurse’s checklist embodies wisdom about human inattention—it’s not mindless habit, but reasoned architecture."  
  **Vulnerability:** Risks reducing wisdom to predictive psychology. Struggles to distinguish "wise" scaffolds from rigid or superstitious ones.

  **4. Distributive Fairness Objection (Grad Student 1)**  
  *Objection:* "This privileges agents with resources to build scaffolds (therapy, AI reminders, institutional support). If worth depends on socio-technical access, haven’t you made morality unjustly elitist? The single parent working three jobs can’t 'prestructure' like a tenured professor."  
  **Reply:** "Scaffolding ranges from high-resource (institutional) to zero-resource (mental routines like 'counting to ten when angry'). Moral worth attaches to *intentional structuring within one’s means*—the parent teaching their child 'never steal, even if hungry' builds intergenerational scaffolding. The core capacity—foresight and commitment—is universal."  
  **Vulnerability:** Implicitly admits resource inequality creates *gradients* of stability-access, potentially diluting worth’s egalitarian ideal.

  **5. Kantian Purity Degradation Objection**  
  *Objection:* "Even if scaffolds are *designed* autonomously, the *action itself* is motivated by habit, fear of penalty, or mechanical compliance—not duty. Kantian worth vanishes when the maxim isn’t *consciously* held 'before the eyes' during action."  
  **Reply:* "The 'occurrent state' requirement fetishizes consciousness. When Ulysses’ sailors bind him to the mast, his *later* refusal to heed the Sirens expresses his prior rational commitment. The action inherits worth from the architecture that makes his refusal the only rational path."  
  **Vulnerability:** Abandons the Kantian link between worth and *phenomenal* motivational clarity.

  **6. Situationist Scaffold Fragility Objection**  
  *Objection:* "Scaffolds crumble under unanticipated cues. Your nurse’s checklist might work until a crisis causes fatigue-induced omission. If scaffolds are as situationally vulnerable as traits, they can’t guarantee 'stability'."  
  **Reply:** "Stability is *probabilistic*, not absolute. Worth attaches to *reasonable* efforts to secure reason-accessibility. A scaffold that fails in unforeseeable extremes doesn’t negate worth in standard cases—just as a Kantian’s 'pure' resolve can crumble unexpectedly."  
  **Vulnerability:** Makes worth contingent on empirical success conditions, risking moral luck.

  **7. Virtue Context-Sensitivity Objection**  
  *Objection:* "Scaffolds are inflexible. What if the protocol demands hand-washing while a patient chokes? Your view can’t handle novel moral contexts where wisdom requires deviating from precommitments."  
  **Reply:** "Good scaffolds include override clauses (e.g., 'unless imminent harm'). Reflexive stability includes *meta-scaffolds* for re-evaluation. Still, default adherence has worth—deviation requires justification, not whim."  
  **Vulnerability:** Reveals tension between stability and flexibility, conceding scaffolds need "wise" design.

  **8. Graduate Student "Worth Inflation" Objection (Least Damaging)**  
  *Objection:* "If I set a daily alarm to donate $1 to charity, then forget why and comply robotically, do I have *moral worth*? Your view seems to confuse reliable right-action with praiseworthy motivation."  
  **Reply:** "Only if the alarm sustains access to the *original reason* (e.g., 'alleviating suffering'). If you comply while wholly indifferent, the scaffold failed. Worth requires the system to functionally preserve reason-responsiveness—not mere compliance."  
  **Vulnerability:** Blurs "reason-accessibility" with causal reliability.

  ---

  **The Nightmare Question**  
  **Who Asks:** The most rigorous Kantian (likely drawing on *Groundwork* II).  
  **Question:** *"If your 'architectural' view is correct, could an agent who designs a flawless scaffold but later develops dementia (and acts 'rightly' via rote habit) have moral worth? Doesn't this sever worth from rational agency entirely?"*  
  **Why Dangerous:** Forces you to admit that—on your view—worth survives the total loss of rationality, contradicting the link between worth and *agency*. It reduces your model to crudely consequentialist scaffolding.  
  **Reply to Have Ready:** "In dementia, the *agent* as a temporally extended rational planner ceases to exist; the scaffolding runs autonomously. Worth belongs only to agents who *could*, in principle, engage with the reasons (e.g., during scaffold design/maintenance). The demented patient isn’t a moral agent—they are a site of residual causal patterns. My view requires *reflexive* stability: the capacity to *adjust* scaffolds in light of reasons, which dementia extinguishes."  
  **Risk in Reply:** Implies worth depends on *counterfactual* rationality (capacity to adjust), not actual structure—undercutting the core claim.
