answer: |-
  ### Exam Question
  **Time:** 90 minutes  
  **Expected Length:** Approximately 800 words  

  **Question:**  
  Resemblance Nominalism (RN) grounds property-attribution in resemblance to specific paradigms (e.g., an object is red iff it resembles paradigm red-object P). RN typically rejects disjunctive universals (e.g., *being crimson or triangular*) as metaphysically illegitimate, arguing they lack genuine unity. However, consider the disjunctive property *being either crimson or triangular*.  

  1. Explain why RN *must* reject a disjunctive universal corresponding to this property.  
  2. Analyze the following tension: Can RN consistently deny the existence of a disjunctive universal while simultaneously grounding the truth of "Object X is either crimson or triangular" *solely* in X resembling paradigm crimson-object *or* resembling paradigm triangular-object? Specifically, does invoking the relation *resembles-paradigm-crimson-or-paradigm-triangular* implicitly treat this disjunctive resemblance relation as a universal-like entity? If so, does this generate an infinite resemblance regression? Justify your answer.  
  3. Evaluate whether the resemblance nominalist can halt this regression by positing a *primitive, non-transitive similarity relation* (e.g., where resemblance between paradigms is brute and intransitive across disjuncts). Is this solution ad hoc? Does it have independent metaphysical motivation beyond saving RN from the disjunction problem?  

  Your essay must move beyond merely describing RN, realism, or trope theory; focus squarely on the conceptual tension surrounding disjunctive properties and the viability of RN’s proposed solution.  

  ---

  ### Model Answer (600 words)  
  Resemblance Nominalism (RN) reduces properties to classes of resembling particulars, rejecting universals. For RN, an object instantiates a property (e.g., *redness*) iff it sufficiently resembles a designated paradigm particular (e.g., a specific red apple). Consequently, RN must reject disjunctive universals (e.g., *being crimson or triangular*) because they lack the qualitative unity RN demands: crimson and triangular share no intrinsic "nature" making their disjunction a single, coherent property. For RN, disjunctions are linguistic conveniences, not ontological commitments.  

  The tension arises when grounding truths like "Object X is crimson-or-triangular." RN asserts this is true iff X resembles paradigm-crimson-object (Pc) *or* resembles paradigm-triangular-object (Pt). Crucially, RN cannot treat *resembling-Pc-or-Pt* as a *new*, disjunctive universal without contradicting its core rejection of disjunctive properties. Instead, it must analyze the disjunction as invoking two independent resemblance relations: Resemblance-to-Pc (Rc) and Resemblance-to-Pt (Rt). However, this move harbors a regress threat. When we say X resembles Pc *or* Pt, we invoke a *disjunctive resemblance relation* (Rc ∨ Rt). This relation is not grounded in resemblance to a *single* paradigm; it is defined by alternation. If RN treats (Rc ∨ Rt) as a *bona fide* resemblance relation in its ontology—one that can hold without further analysis—it implicitly reifies a disjunctive structure as a universal-like entity. This invites a regress: if (Rc ∨ Rt) is legitimate, why not a relation of resembling [Pc ∨ Pt] *or* another paradigm Pz? This generates (Rc ∨ Rt ∨ Rz), and so on *ad infinitum*. RN thus faces a dilemma: either accept disjunctive resemblance relations as brute (inviting regress and violating its own anti-disjunction stance), or deny their legitimacy and struggle to ground disjunctive truths.  

  To halt the regress, the RN might posit a *primitive, non-transitive similarity relation*. On this view, resemblance between paradigms (e.g., that Pc and Pt are both "resemblance bases") is brute and intransitive: resembling Pc does not entail resembling Pt, and the disjunction "Rc ∨ Rt" is a logical, not metaphysical, construct. The relation holding between X and Pc (or X and Pt) is fundamental and does not require grounding in a higher-order resemblance. This avoids reifying (Rc ∨ Rt) as a universal-like entity.  

  However, this solution is deeply problematic. First, it appears **ad hoc**. RN introduces primitive resemblance to avoid universals, yet here it must *further* stipulate that resemblance is non-transitive and that disjunctions of resemblance relations are metaphysically inert. This move is tailored *only* to solve the disjunction problem, lacking independent motivation. Why should resemblance be transitive for determinate properties (e.g., resembling Pc grounds crimson) but non-transitive across disjuncts? RN provides no principled reason; it merely asserts this to block regress. Second, it undermines RN’s explanatory power. If "X resembles Pc ∨ Pt" is not a genuine relation but a logical shorthand, RN cannot fully *ground* disjunctive truths in its ontology—it relies on unanalyzed logical structure. This covertly reintroduces the abstract entities RN seeks to eliminate. Finally, the non-transitivity is arbitrary: if resemblance can be primitive and intransitive here, why not for *all* properties? This risks collapsing RN into a mere list of brute resemblances, sacrificing any unified account of propertyhood.  

  While RN correctly identifies the disunity of disjunctive properties, its attempt to ground disjunctive truths via primitive resemblance fails. The posited non-transitivity is an unmotivated stopgap that exposes RN’s inability to handle logical complexity without compromising its nominalist foundations.  

  **The resemblance nominalist cannot halt the disjunction-induced regress by positing primitive non-transitive similarity without rendering the theory ad hoc and explanatorily vacuous.**  

  ---

  ### Marking Scheme (Total: 20 marks)  
  1.  **Core Thesis of RN & Rejection of Disjunctive Universals** (4 marks)  
      *   *Hit:* Clear explanation of RN’s grounding in paradigm resemblance and its rejection of disjunctive universals due to lack of unity.  
      *   *Mistake:* Vague restatement of RN or confusion over *why* RN rejects disjunctives (e.g., citing epistemology not metaphysics).  

  2.  **Regress Problem from Disjunctive Resemblance** (5 marks)  
      *   *Hit:* Argues that grounding "X is F∨G" via "X resembles Pf ∨ resembles Pg" implicitly treats the disjunctive resemblance relation (Rf ∨ Rg) as a universal-like entity, generating potential regress.  
      *   *Mistake:* Failure to identify the disjunctive *relation* as the source of regress (e.g., focusing only on object disjunctions).  

  3.  **Primitive Non-Transitive Similarity as Solution** (4 marks)  
      *   *Hit:* Accurately describes how positing primitive, non-transitive resemblance relations halts regress by making (Rf ∨ Rg) non-fundamental.  
      *   *Mistake:* Mischaracterizing the proposed resemblance (e.g., making it transitive or conflating it with tropes).  

  4.  **Assessment of Ad Hoc Nature** (4 marks)  
      *   *Hit:* Critically evaluates whether the non-transitivity move is *ad hoc* (lacking independent motivation, tailored only to solve disjunction).  
      *   *Mistake:* Simply stating it’s ad hoc without explaining *why* (e.g., no link to RN’s core principles or lack of prior justification).  

  5.  **Assessment of Independent Motivation/Explanatory Cost** (3 marks)  
      *   *Hit:* Evaluates if the move has motivation beyond solving this problem and/or its cost to RN (e.g., undermining unity, relying on logic).  
      *   *Mistake:* Ignoring broader implications for RN’s coherence or explanatory goals (e.g., treating it as an isolated fix).  

  **The resemblance nominalist's primitive similarity gambit fails to resolve the disjunction dilemma without sacrificing theoretical integrity.**
