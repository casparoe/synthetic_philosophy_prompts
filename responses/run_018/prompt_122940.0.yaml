prompt: |-
  I work as a backend and systems engineer, mostly in Rust and Go, with a working knowledge of type theory, compilers, and distributed systems, and no formal philosophy training whatsoever. A colleague in robotics and I have gotten stuck on the philosophical dispute about whether knowing how to do something is really just a species of knowing that something is the case, or whether it is a different kind of state altogether. I want the whole debate restated in vocabulary I actually think in, and then I want to know exactly what gets lost. I am not asking for references, a reading list, or who said what first; I cannot chase citations and I do not care about priority. I care about the shape of the disagreement.

  Here is the vocabulary I have on tap, and you should feel free to use distinctions adjacent to these if they help: declarative versus imperative artifacts; specification versus implementation; compile time versus run time; type checking, type inference, and proof-relevant types (I have a hazy grasp of propositions-as-types from type-level programming, so use it only if you can use it precisely); handwritten versus generated code; interpreters, virtual machines, and runtimes; solvers that turn a declarative description into an execution, in the way an SMT solver or a logic program does; test suites, property-based tests, mocking, and test harnesses; Heisenbugs and other failures that vanish under observation; documented procedures and runbooks; competence stored in a system rather than in a person, such as a compiler, an autoscaler, or a trained policy; and the question of whether a running process's behavior is traceable to some specific artifact in the repository.

  As I currently understand the two sides: the anti-intellectualist says that knowing how to do something is not the same kind of thing as knowing that some proposition holds, and offers a regress argument, roughly that if every intelligent performance required a prior act of considering a proposition, and that act were itself an intelligent performance, then no one could ever get started. The passage of Ryle's that I managed to read, from The Concept of Mind, puts it this way: The consideration of propositions is itself an operation the execution of which can be more or less intelligent, less or more stupid. But if, for any operation to be intelligently executed, a prior theoretical operation had first to be performed and performed intelligently, it would be a logical impossibility for anyone ever to break into the circle. The intellectualist replies that knowing how is knowing a proposition, but knowing it under a special practical guise or mode of presentation, so that no separate prior act of contemplation is required. There are also arguments I have half-encountered: that knowing the relevant facts is insufficient for knowing how, and that knowing how comes in degrees while knowing that apparently does not.

  I want all of that translated systematically, claim by claim, into my vocabulary. Please run the translation on three cases that I think are diagnostic. First, a senior engineer on my team who reliably tracks down data races in our scheduler but cannot articulate the rule he follows, and who gets worse if you ask him to narrate what he is doing. Second, a trained policy and a hand-written library that both sort correctly: whatever I want to say about the engineer's knowing how, does the same thing get said about a network, a library, or a compiler? Third, a junior engineer who can recite the debugging runbook verbatim and explain every step, but bungles the actual debugging under time pressure.

  I also want you to adjudicate two framings I invented while arguing with my colleague, and tell me honestly whether each is a faithful rendering of something the philosophers are actually disputing or a confusion I introduced by importing my own distinctions. The first is what I call the interpreter problem: if knowing how is knowing that, then there should be a declarative artifact plus a general mechanism that turns it into successful action, and the interesting question is whether that mechanism is inside the agent or outside. If it is inside, intellectualism looks either trivial, because any ability can be paired with some description and some interpreter, or circular in the way the regress argument alleges. If it is outside, then it is hard to see how the agent's knowledge is what guides the action. The second is the contrast between runtime guidance and compile-time generation: must the practical proposition still be read by the process that acts, the way a config file is read at startup, or is it enough that it was consumed once to produce the executable, the way a spec is consumed by a code generator and then discarded? My suspicion is that the philosophical literature is running these together.

  Finally, the residue report, which is what I actually want. Which claims translate cleanly, which translate only after you quietly distort them, and which have no expression at all in anything I have available? Be explicit when you have to smuggle something in, and flag it as smuggling rather than translation. In particular: does anything correspond to my distinction between competence living in a repository, in a runtime, and in trained weights, or is that distinction orthogonal to theirs and simply invisible from inside the debate? And for whatever does not survive, give me your considered verdict on whether it is a defect in my vocabulary, a sign that the philosophical claim was less clear than it looked, or a sign that the two sides are arguing past each other about different things.
reasoning: |-
  We are going to break down the philosophical dispute about "knowing how" (KH) vs. "knowing that" (KT) using your vocabulary as a systems/backend engineer. We'll translate the core arguments and then apply them to your three diagnostic cases. Then we'll evaluate your two framings and finally provide a residue report.

  ### Core Philosophical Dispute in Your Terms

  1. **The Anti-Intellectualist (Rylean) Position**:
     - KH is not a species of KT. It is a different kind of state.
     - **Regress Argument in Engineering Terms**: 
       - Suppose every intelligent action (like debugging) requires first consulting a declarative artifact (a KT) and then interpreting it (via some general mechanism). But then, how does that interpretation happen? If it too requires consulting another declarative artifact, we get an infinite regress. This is like requiring that every function call must be implemented by an interpreter that itself is implemented by another interpreter, and so on. At some point, we must have a primitive operation that is executed without interpretation (like a built-in machine instruction or a hardware circuit). Similarly, for human actions, we must have skills that are not reducible to propositional knowledge but are instead like compiled code or hardwired circuits.

  2. **The Intellectualist Position**:
     - KH is a species of KT, but it is a special kind: knowing a proposition under a practical mode of presentation (a practical guise).
     - **Translation**: 
       - KH is like having a declarative specification (the proposition) that is coupled with a specific interpreter or runtime that can execute it. The "practical guise" is the fact that the agent has an internal mechanism (like a VM or a JIT compiler) that can turn the proposition into action without needing a separate act of contemplation. So, the proposition is stored in a form that is immediately executable. The intellectualist denies that there is a regress because the interpreting mechanism is not itself an intelligent performance requiring a prior proposition; it is a built-in capacity (like a CPU that natively executes bytecodes).

  3. **Additional Arguments**:
     - **Insufficiency of KT for KH**: 
       - You might have a complete specification (KT) of how to ride a bike (in terms of physics and body movements) but still not know how to ride. In engineering terms: having the source code of a program (the specification) does not mean you can run it without a suitable runtime. The runtime (the agent's ability to execute) is also required. The anti-intellectualist says that the runtime is not a form of KT, but the intellectualist says that the runtime is also a form of KT (perhaps about how to interpret the proposition) but then we risk regress.
     - **Degrees of KH vs. KT**:
       - KH comes in degrees (e.g., novice vs. expert programmer), while KT is often thought of as binary (you either know a fact or you don't). In engineering: a test suite might pass 90% of the cases (degree) vs. a type checker that either accepts or rejects (binary). However, note that in practice, KT might also have degrees (e.g., partial understanding of a complex theorem). But the anti-intellectualist uses this to argue that KH is a skill that improves with practice, which is not just accumulating more propositions.

  ### Translation of the Three Diagnostic Cases

  1. **Senior Engineer Debugging Data Races**:
     - **Anti-Intellectualist**: The engineer's skill is like a highly optimized, hand-tuned assembly routine or a trained neural network. It's procedural knowledge that is not stored in a declarative form. When asked to articulate (i.e., decompile the routine into a specification), he fails because the knowledge is not in that format. The act of articulation is a different skill (like writing documentation) and may interfere (like adding debug prints changes timing).
     - **Intellectualist**: The engineer knows a set of propositions (e.g., patterns of data races) under a practical guise. The inability to articulate might be because the proposition is complex or the "interpreter" (his brain) is optimized for execution, not reflection. The degradation under narration is due to resource contention (like a system under tracing overhead).

  2. **Trained Policy vs. Hand-Written Library for Sorting**:
     - **Anti-Intellectualist**: 
       - The hand-written library is like explicit KT: the algorithm is encoded in a declarative or imperative form that can be read (as code). The trained policy (e.g., a neural net) is more like KH: it is a procedural skill that is not represented propositionally. Both can sort, but the policy's knowledge is not stored as facts; it's stored as weights (which are not human-readable propositions). So, the policy has KH without KT.
     - **Intellectualist**: 
       - Both are implementations of the same proposition (the specification of sorted order). The library is an explicit representation of the proposition (as code). The trained policy is an implicit representation (as weights) that is executed by the neural net runtime. The proposition is still there, but in a compiled form. The weights are a representation of the proposition under a practical guise.

  3. **Junior Engineer with Runbook**:
     - **Anti-Intellectualist**: The junior has KT (the runbook as a declarative artifact) but not KH. Under pressure, the runtime (his ability to execute) fails because he hasn't internalized the skill. The runbook is like a script that must be interpreted, but without practice, the interpreter (the junior) is slow and error-prone. KH would be having the procedure compiled.
     - **Intellectualist**: The junior has the proposition (the runbook) but not under the right practical guise. He hasn't integrated it into his "runtime" so that it can be executed efficiently. The bungling is due to the lack of automation (the proposition hasn't been compiled into a fast-executing form).

  ### Evaluation of Your Two Framings

  1. **The Interpreter Problem**:
     - **Faithfulness**: This is a central issue in the debate. The intellectualist must locate the interpreter. If it's inside the agent, then the regress argument applies: the interpreter itself must be explained. The intellectualist might say the interpreter is a non-intellectual capacity (avoiding regress) but then it seems KH is not entirely KT. If the interpreter is outside, then the agent's knowledge isn't guiding the action. Your framing is faithful and captures a key point: intellectualism must either accept a non-propositional element (the interpreter) or face regress.

  2. **Runtime Guidance vs. Compile-Time Generation**:
     - **Faithfulness**: This is also at the heart of the dispute. The anti-intellectualist would say that KH is like compiled code: the knowledge is baked into the executable and doesn't require runtime consultation of propositions. The intellectualist might say that even compiled code started from a specification (so the proposition is still there, but now in a transformed, executable form). However, note that in compile-time generation, the spec is discarded after compilation. So is the agent's knowledge the spec (which is gone) or the compiled code? The intellectualist might say the agent's knowledge is the compiled code, which is a form of proposition (under a practical encoding). But then, is the compiled code a proposition? Your distinction highlights that the philosophical literature may conflate the time of use (runtime vs. compile-time) and the form of representation (declarative vs. compiled). This is a real issue: some intellectualists might argue that the proposition is used at compile-time (learning/practice) to produce the skill, while others might say it must be present at runtime.

  ### Residue Report: What Gets Lost in Translation?

  We'll break down the translation by claims and note the residue.

  1. **Regress Argument**:
     - **Clean Translation**: The infinite regress is analogous to an infinite tower of interpreters. The requirement for a base (machine code or hardware) is clear in engineering and maps to Ryle's point.
     - **Residue**: The philosophical notion of an "intelligent performance" is broader than just executing code. It includes things like judgment and adaptability. In engineering, we have hardwired circuits for basic operations, but in philosophy, the base might be a non-intellectual capacity (like perception or instinct) that isn't considered "knowledge". This might be a defect in your vocabulary: you don't have a term for non-cognitive capacities that ground intelligent action.

  2. **Practical Guise**:
     - **Distortion**: We translated "practical guise" as a form of compiled code or a runtime that can execute a proposition. But note: in philosophy, a "guise" is a mode of presentation (a way of thinking about the same proposition). In engineering, compiling a spec into code changes the representation. So we smuggled in a representational change. The intellectualist might insist the proposition remains the same, only the mode of access changes. This is a subtle distortion.

  3. **Insufficiency of KT for KH**:
     - **Clean Translation**: Having the source code (KT) without a runtime (the ability to execute) is insufficient for running the program (KH). This is clear.
     - **Residue**: The intellectualist might counter that the runtime itself is also a form of KT (e.g., knowing how to interpret). But then we are back to regress. This point survives well.

  4. **Degrees of KH**:
     - **Clean Translation**: Test suites (with coverage percentages) and gradual skill improvement map well to degrees of KH. KT as binary is like a type check, but note: in practice, we have partial type inference and probabilistic types. This might be a defect in the philosophical claim: KT isn't always binary (e.g., "I know it somewhat"). However, the core idea that skill improvement isn't just accumulating more facts but optimizing execution is captured.

  5. **Status of Non-Human Agents (Trained Policy)**:
     - **Residue**: The debate was originally about human knowledge. Extending to AI and libraries is your innovation. The anti-intellectualist might say that a trained policy has no knowledge at all (it's just a mechanism) or that it has KH without KT. The intellectualist might say the weights encode propositions. This is orthogonal to the debate: the philosophers weren't considering machines. So your distinction between repository (source code), runtime (interpreter), and trained weights (compiled policy) is outside their frame. This is not a defect in your vocabulary but a gap in the philosophical discussion.

  6. **Interpreter Problem and Runtime vs. Compile-Time**:
     - **Residue**: These are your framings and they are faithful to the underlying issues. However, the philosophical literature does not always make the runtime/compile-time distinction explicit. This might be a sign that the two sides are arguing past each other: the anti-intellectualist is focusing on runtime execution (what the agent does in the moment) while the intellectualist is focusing on compile-time (how the agent acquired the knowledge). So your vocabulary helps clarify a conflation.

  **Overall Residue**:
  - **What Translates Well**: The core structure of the regress argument, the insufficiency argument (spec without runtime), and the degrees of KH (as gradual improvement in performance) are all expressible in your terms.
  - **What Requires Distortion**: The notion of "practical guise" is hard to capture without smuggling in a representational change (from spec to code). Also, the base of the regress (non-propositional capacities) is not naturally in your vocabulary, which is focused on artifacts and execution.
  - **What Doesn't Translate or is Orthogonal**:
    - The distinction between human and artificial agents: your cases with trained policies and libraries are outside the original debate. Your vocabulary's focus on where competence is stored (repo, runtime, weights) is novel and not addressed by the philosophers.
    - The normative aspect: KH is often tied to responsibility and credit (e.g., we praise someone for having skill). This doesn't appear in your vocabulary.

  **Verdict**:
  - The residue is partly due to your vocabulary being engineered for systems (which are designed artifacts) while the philosophical debate is about human cognition (which is not designed in the same way). However, your vocabulary exposes a conflation in the debate between the time of knowledge use (compile-time vs. runtime) and the form of representation. This conflation might be a defect in the philosophical discussion. Also, the debate might be missing the distinction between stored knowledge (in a repo) and running knowledge (in a process), which is central to your thinking. So, the two sides might be arguing past each other by not clarifying these dimensions.

  In summary: your vocabulary is powerful for the structure of the arguments but cannot capture the non-cognitive aspects of human skill (like embodied know-how) without extension. The debate gains clarity by your distinctions, but loses the human-specific context. The residue is a sign that the philosophical claims were less clear than they looked, particularly regarding the timing and form of knowledge representation.
answer: |-
  ### Systematic Translation of the Dispute into Engineering Vocabulary  
  The core dispute is whether **knowing-how (KH)** is reducible to **knowing-that (KT)** (i.e., KH is just KT under a "practical guise") or whether KH is a distinct kind of state. Below, I translate arguments and cases using your terminology.  

  ---

  #### **1. Core Arguments Translated**  
  **Anti-Intellectualist (Rylean) Position**:  
  - **Claim**: KH is not KT; it’s a distinct state (like a compiled executable vs. source code).  
  - **Regress Argument**:  
    - If every action requires consulting a declarative artifact (KT), you need an interpreter to execute it. But that interpreter itself must be executed, leading to infinite regress.  
    - *Your terms*: If every `run` operation requires first `eval`-ing a declarative spec, you need a meta-`eval` for `eval`, and so on. This implies a base-layer primitive (e.g., machine code) that *just runs* without interpretation. KH is that primitive: **precompiled bytecode** executed directly by the VM, not a spec parsed at runtime.  
  - **Degrees of KH**: KH is improvable through practice (e.g., optimizing a hot path), while KT is binary (a spec is either correct or not).  

  **Intellectualist Position**:  
  - **Claim**: KH is KT, but under a "practical mode of presentation" (i.e., KT + an execution mechanism).  
  - **Counter to Regress**: The "practical guise" avoids regress by bundling the interpreter with the spec. No prior contemplation is needed because the proposition is **precompiled into executable form**.  
    - *Your terms*: Like a **JIT-compiled function**—the spec (KT) is transformed into machine code during compilation, so runtime execution requires no interpretation. The "guise" is the compilation step.  
  - **KT Insufficiency**: Intellectualists concede that raw KT (e.g., a spec) isn’t sufficient for action; you need a runtime (the "guise"). But they insist the runtime is still driven by KT.  

  **Key Distinction**:  
  - Anti-intellectualists see KH as **procedural bytecode** (executed natively).  
  - Intellectualists see KH as **declarative spec + JIT compilation** (KT made executable).  

  ---

  #### **2. Translation of Diagnostic Cases**  
  **Case 1: Senior Engineer Debugging Data Races**  
  - **Anti-intellectualist view**:  
    - The engineer’s skill is **hand-optimized assembly**: a procedural artifact not reducible to a spec. When forced to "decompile" it into declarative steps (e.g., narrating), he introduces overhead (debug logs) that disrupts timing-sensitive execution (Heisenbug analogy).  
    - *Why it’s KH*: The knowledge is in the **runtime execution**, not a repository artifact.  
  - **Intellectualist view**:  
    - He knows a proposition (e.g., "data races arise under schedulers with property X"), but under a practical guise (his brain’s "debugger runtime"). His failure to articulate is like a compiler optimizing away intermediate steps—the trace is lost.  

  **Case 2: Trained Policy vs. Hand-Written Library (Both Sort Correctly)**  
  - **Anti-intellectualist view**:  
    - The **hand-written library** is KT: a declarative/imperative artifact (source code) stored in the repo. The **trained policy** is KH: weights are compiled bytecode with no human-readable spec. They achieve the same output, but the policy’s "knowledge" is opaque and emergent—like a VM’s internal state.  
    - *Key point*: KH can exist in systems (policy weights, VM bytecode) without KT.  
  - **Intellectualist view**:  
    - Both implement KT. The library’s code is explicit KT; the policy’s weights are *compiled* KT (like a .so built from source). The "guise" is the inference runtime (e.g., TensorFlow).  

  **Case 3: Junior Engineer Fumbling with Runbook**  
  - **Anti-intellectualist view**:  
    - The junior has **KT (runbook)** but lacks **KH (debugging skill)**. Under pressure, his "runtime" lacks optimizations (caching, branch prediction) to execute the spec efficiently. Like a VM interpreting code slowly vs. native execution.  
  - **Intellectualist view**:  
    - He has KT but not the *practical guise* (e.g., he hasn’t internalized the runbook into a "runtime"). The failure is like missing CPU flags to handle interrupts.  

  ---

  #### **3. Evaluation of Your Framings**  
  **Framing 1: The Interpreter Problem**  
  - **Faithful to the debate? Yes**.  
    - Intellectualists must locate the interpreter:  
      - If **inside** (e.g., brain VM), anti-intellectualists cry circularity (how is the VM’s *own* execution explained?).  
      - If **outside** (e.g., a cosmic SMT solver), the agent isn’t truly "guiding" action.  
    - Your analogy exposes a core tension: Intellectualism either **trivializes** (any bytecode can be reverse-engineered to a spec) or **regresses** (who compiles the compiler?).  

  **Framing 2: Runtime Guidance vs. Compile-Time Generation**  
  - **Faithful? Partially, but you’ve exposed a conflation**.  
    - Philosophers often blur these:  
      - **Runtime guidance** = KT read at action-time (e.g., config file parsed on startup).  
      - **Compile-time** = KT consumed once to generate an executable (discarded afterward).  
    - Anti-intellectualists argue KH is **compile-time generated** (like a binary). Intellectualists often equivocate, calling *both* "KT under a guise." Your distinction clarifies: if KT isn’t needed at runtime, it’s not "guiding" action—it’s been compiled away.  

  ---

  #### **4. Residue Report: What Gets Lost?**  
  **Claims That Translate Cleanly**:  
  - The **regress argument** maps perfectly to infinite interpreter towers needing a base primitive (e.g., machine code).  
  - **Degrees of KH** ↔ **performance optimizations** (e.g., profiling to reduce latency).  
  - **KT insufficiency** ↔ needing a runtime to execute a spec.  

  **Claims Requiring Distortion (Smuggling)**:  
  - **"Practical guise"** (intellectualist): Translated as "JIT compilation," but this smuggles in a **procedural step** (compilation) that itself isn’t KT. Intellectualists handwave this as "baked-in capacities," but your vocabulary forces explicit modeling—exposing their vagueness.  
  - **Anti-intellectualist "base primitive"**: Described as bytecode, but philosophers imply it’s **non-representational** (e.g., hardware). Your terms can model this (e.g., FPGA config), but the "non-propositional" aspect is hazy in code.  

  **Claims With No Expression in Your Vocabulary**:  
  1. **First-Person Experience**: KH involves "what it’s like" to perform an action (e.g., muscle memory). Your vocabulary lacks analogies for embodied, non-symbolic states (e.g., no equivalent for proprioception in software).  
     - *Verdict*: Defect in your vocabulary. Philosophy leans on phenomenology; engineering avoids it.  
  2. **Normativity**: KH includes "rightness" (e.g., *properly* debugging). Your terms handle correctness (tests, specs) but not the *ought* (e.g., "should" a heuristic be trusted?).  
     - *Verdict*: Philosophical claim less clear. Engineers use tests; philosophers debate "norms."  
  3. **Agent-Independence**: Philosophers dispute whether KH *requires* an agent. Your terms handle this (e.g., a script can have KH-like behavior), but their debate assumes agency.  
     - *Verdict*: Both sides arguing past each other. Your "trained policy" case highlights this gap.  

  **Orthogonal Distinctions**:  
  - Your **competence location** framework (repo vs. runtime vs. weights) is absent in philosophy. They focus on *human* cognition, ignoring system-level distinctions. For example:  
    - **Repo** (KT) ↔ Source code.  
    - **Runtime** (KH) ↔ VM executing bytecode.  
    - **Trained weights** ↔ Compiled artifact (neither pure KT nor KH; a third thing).  
    - *Verdict*: Your framework reveals a blind spot. Philosophers conflate "knowledge" as a monolithic concept, while engineering sees layers.  

  **Final Verdict**:  
  - **Defect in philosophical claims**: They underspecify "practical guise" and ignore system-like layering (repo/runtime/weights). Your vocabulary exposes this.  
  - **Defect in your vocabulary**: It struggles with non-representational, embodied states (e.g., "skill as muscle memory").  
  - **Sign of talking past each other**: Anti-intellectualists focus on **execution** (runtime), intellectualists on **specification** (compile-time). Your framing forces this into the open.  
  - **Residue is unavoidable**: Philosophy’s "what it’s like" and "norms" don’t map to deterministic systems. But your translation clarifies the *structural* debate—KH is **runtime competence**, KT is **declarative artifact**. The real loss is philosophy’s fuzzy ontology of "mind."  

  **Bottom Line**: The dispute reduces to whether runtime behavior *must* trace to a readable artifact in the repo (KT) or can emerge from opaque states (KH). Engineers know both exist—and that the latter is often more efficient.
