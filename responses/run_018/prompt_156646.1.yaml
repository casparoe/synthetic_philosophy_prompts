prompt: |-
  Report my verdicts on whether these political acts involve genuinely dirty hands—morally necessary wrongdoing that stains the agent personally—and propose the principle that best captures the pattern. Case 1: A prime minister secretly authorizes torture of a captured terrorist to prevent an imminent attack, violating her own legal and moral commitments; I judge this dirty hands. Case 2: A legislator votes for a harmful austerity bill out of party solidarity, though she believes it unjust; I judge this not dirty hands—mere complicity without personal stain. Case 3: A revolutionary leader orders the execution of an innocent royal family to prevent restoration and secure democratic order; I judge this dirty hands, yet it feels structurally different from Case 1—foundational rather than exceptional rescue. Case 4: A mayor accepts a developer's bribe to fund a public clinic she could not otherwise build, knowing it corrupts governance; I judge this corruption, not dirty hands, despite the good end. Case 5: A diplomat systematically deceives an ally to maintain a coalition that prevents war, where transparency would cause collapse; I judge this dirty hands. Is there a single principle—say, about the wrong being structurally unavoidable in the office, free of private gain, and personally owned by the agent—that saves Cases 1, 3, and 5 while excluding 2 and 4? State it precisely, indicate which clause each case motivates, say honestly which of my verdicts it must overturn if simplicity demands it, and predict its verdict on an unlisted case: a democratically elected leader secretly falsifies election data to block an authoritarian victory, then confesses and resigns. Take a definite, committed position with clear reasoning; do not merely list competing options.
reasoning: |-
  Okay, the user wants me to analyze their verdicts on political "dirty hands" cases and develop a unifying principle. They've presented five cases with their judgments and want me to formulate a single principle that explains why Cases 1, 3, and 5 qualify as dirty hands while excluding 2 and 4. They also want me to apply this principle to a sixth unlisted case.

  Looking at their judgments: they see dirty hands in the torture authorization (Case 1), the revolutionary executions (Case 3), and diplomatic deception (Case 5). But not in the austerity vote (Case 2) or the bribed clinic funding (Case 4). They note that Case 3 feels different - more foundational than exceptional.

  Hmm... I need to identify what truly distinguishes dirty hands scenarios. The key elements seem to be: unavoidable moral conflict intrinsic to the role (not optional), absence of private gain, and personal ownership of the wrongdoing. Cases 1, 3 and 5 share these traits - the agents are trapped in role-defined necessities where wrongdoing becomes a tragic duty. 

  In contrast, Case 2's austerity vote appears to be about political convenience rather than true necessity. Case 4 involves personal corruption masked as public good. Neither meets the core criteria.

  The principle I'm considering is: "Deliberately committing a severe moral wrong becomes dirty hands when: (a) it is strictly necessary to fulfill an overriding public duty inherent to one's role; (b) no morally permissible alternative exists; (c) it provides no private benefit; and (d) the agent fully acknowledges the act as their personal moral failure despite its necessity."

  For the unlisted election case - falsifying data to block an authoritarian. This would qualify as dirty hands under my principle. It's necessary (prevents authoritarian takeover), role-defined (leadership duty to protect democracy), no clean alternatives, no personal gain, and the resignation shows ownership of the moral stain. The confession and resignation actually reinforce the "dirty hands" nature by demonstrating personal moral accountability.

  This approach holds all the user's original verdicts while capturing the special character of Case 3. The principle focuses on the tragic essence of dirty hands - unavoidable role-bound moral failure for the greater good that stains the conscience.
answer: |-
  Based on your verdicts and the core concept of dirty hands (morally necessary wrongdoing that personally stains the agent), the unifying principle that best captures the pattern while adhering to your judgments is:

  **The Principle of Role-Bound Catastrophic Imperative:**
  *An act constitutes genuinely dirty hands if and only if:*
  1.  **The agent commits a severe, identifiable moral wrong.**
  2.  **This wrong is strictly necessary to avert a catastrophic public harm inherent to the agent's role-responsibility.**
  3.  **No morally permissible alternative exists to achieve the imperative public good.**
  4.  **The act provides no private benefit to the agent.**
  5.  **The agent personally owns the decision and the resulting moral stain.**

  **Application to Your Cases & Principle Motivation:**

  *   **Case 1 (Torture):** **Dirty Hands.** Motivated clauses: **(1)** Torture is a severe moral wrong. **(2)** Preventing an imminent attack is a catastrophic harm the PM is role-bound to prevent. **(3)** No permissible alternative exists (given "imminent"). **(4)** No private gain. **(5)** Secret authorization shows personal ownership/stain.
  *   **Case 2 (Austerity Vote):** **Not Dirty Hands.** Excluded because: **(2)** Voting based on party solidarity, not to avert a *catastrophic* harm *inherent* to her role-responsibility (merely upholding party discipline/coalition). **(3)** Morally permissible alternatives likely exist (e.g., lobbying internally, abstaining, resigning). Fails the core necessity and role-imperative clauses.
  *   **Case 3 (Execution of Royals):** **Dirty Hands.** Motivated clauses: **(1)** Executing innocents is a severe moral wrong. **(2)** Preventing a bloody restoration/civil war and securing a democratic order is the catastrophic harm the revolutionary leader is *foundationally* role-bound to prevent (justifies the "structurally different" feeling). **(3)** The revolutionary context implies no permissible alternative exists to decisively break the old order. **(4)** No private gain. **(5)** Ordering execution shows personal ownership/stain.
  *   **Case 4 (Bribe for Clinic):** **Not Dirty Hands.** Excluded because: **(1)** Bribery is a severe moral wrong (corruption). **(2)** Funding a clinic, while good, is not averting a *catastrophic harm inherent to the role* (it's improving welfare, not preventing imminent disaster). **(3)** Permissible alternatives exist (e.g., seeking other funding, public pressure, scaling back project). **(4)** Private benefit is inherent to bribery (corrupting governance *is* a private benefit via power/illegality). Fails necessity, role-imperative, and no-private-gain clauses.
  *   **Case 5 (Diplomatic Deception):** **Dirty Hands.** Motivated clauses: **(1)** Systematic deception is a moral wrong (violates trust). **(2)** Preventing war is a catastrophic harm the diplomat is role-bound to prevent. **(3)** Transparency would cause collapse & war; no permissible alternative. **(4)** No private gain. **(5)** Systematic deception shows personal ownership/stain.

  **Honest Assessment & Simplicity:** This principle **upholds all your original verdicts** without requiring an overturn. It successfully distinguishes Cases 1, 3, and 5 (Dirty Hands) from Cases 2 and 4 (Not Dirty Hands) by focusing on the *necessity driven by catastrophic, role-bound responsibility* and the *absence of private gain/permissible alternatives*. It captures the "structurally different" nature of Case 3 by emphasizing the *foundational* nature of the catastrophic harm the revolutionary leader is uniquely positioned and responsible to avert.

  **Unlisted Case Verdict: Secret Election Falsification, then Confession/Resignation**

  Under the **Principle of Role-Bound Catastrophic Imperative**:

  1.  **Severe Moral Wrong:** Falsifying election data is a severe moral wrong (subverting democracy).
  2.  **Catastrophic Harm & Role-Responsibility:** Preventing an authoritarian takeover could constitute a catastrophic public harm (loss of democracy, potential human rights abuses). Protecting democracy is a core, inherent responsibility of a democratically elected leader.
  3.  **Necessity & No Permissible Alternative:** This is the most contested point. Is falsifying data *strictly necessary*? Are there *no* morally permissible alternatives (e.g., legal challenges, mobilizing public protest, exposing the threat through legal means)? The principle demands strict necessity and the absence of permissible alternatives. If the leader genuinely believes falsification is the *only* way to prevent an irreversible authoritarian takeover where all other avenues are demonstrably closed (e.g., imminent violent coup, rigged judiciary), this clause *might* be met. However, this is a very high bar and often dubious.
  4.  **No Private Benefit:** Assuming the leader confesses and resigns, there is clearly no private benefit sought or gained.
  5.  **Personal Ownership:** Confession and resignation demonstrate profound personal ownership of the act and its moral stain.

  **Verdict:** **Likely Dirty Hands, but contingent on genuine necessity.** If the leader truly faced a situation where an authoritarian victory was *imminent and catastrophic* and falsification was the *only possible way* to prevent it (a scenario often claimed but rarely demonstrably true), then the act would constitute Dirty Hands under this principle. The confession and resignation powerfully affirm clauses (1) and (5). However, if permissible alternatives existed, it would fail clause (3) and would be classified as merely corrupt or unjustifiable subversion.

  **Reasoning:** The principle prioritizes preventing catastrophic public harm inherent to the role over the core democratic norm of electoral integrity, *but only under conditions of absolute necessity and lack of alternatives*. The leader's subsequent actions (confession/resignation) confirm the recognition of the moral stain, aligning perfectly with the personal ownership required for Dirty Hands. This case highlights the immense burden of proof required for clause (3) – demonstrating true necessity in democratic contexts is exceptionally difficult.
