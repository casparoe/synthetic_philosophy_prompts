prompt: |-
  In discussions of cause selection within longtermist and effective-altruist reasoning, the triad “importance, tractability, and neglectedness” is frequently invoked as if naming it settles which problems deserve resources, and it often operates as an argumentative stopping-point: once a cause scores poorly on tractability, it is set aside regardless of importance. I want to understand what precise claims that slogan could actually be advancing.

  Lay out the distinct readings as a menu, ordered from the weakest to the strongest. At the weakest end, it may be a purely descriptive psychological claim about how donors actually allocate attention; further along, a heuristic for bounded rationality under deep uncertainty; further still, a normative aggregation rule analogous to multi-attribute decision analysis; and at the strongest end, a substantive moral thesis about where obligations lie given epistemic and institutional constraints. For each reading, indicate whether it is trivial, whether it is defensible, and whether it genuinely supports dismissing a high-importance cause that currently scores low on tractability.

  Then address a dynamic tension that the static formulation obscures: tractability is often measured relative to current investment, which means that as a neglected cause receives funding and makes progress, its neglect score falls and—if tractability is partly defined by marginal returns—its tractability score may also shift, sometimes downward. This creates a potential feedback loop in which success undermines the framework’s own justification for initial support. Does any of the readings you have distinguished contain the resources to resolve this loop, or does resolving it require importing an external principle, such as a commitment to option value or to maintaining a diversified portfolio regardless of shifting scores?

  Finally, say which reading is most plausibly being invoked when the slogan is used to reject climate-adaptation funding in favor of artificial-intelligence safety, and whether that invocation is internally coherent with the framework’s logic or instead smuggles in an unstated premise about irreversibility or existential risk.
reasoning: |-
  Okay, the user is asking about the "importance, tractability, neglectedness" (ITN) framework used in effective altruism and longtermism. They want to understand the different interpretations of ITN, from weakest to strongest, and how each handles dismissing important but less tractable causes. They're also concerned about the dynamic tension where success in a cause might lower its future funding appeal.

  First, I need to break down the possible readings of ITN. The user mentioned a spectrum from descriptive to normative claims. I should start with the weakest: descriptive. This is just observing how donors behave. Then move to heuristic for bounded rationality—practical under uncertainty. Next, multi-attribute decision analysis (MADA) as a normative rule. Finally, the strongest as a moral thesis with obligations.

  For each, I need to assess if they're trivial, defensible, and if they support dismissing important but intractable causes. The descriptive claim might be trivial but doesn't justify dismissal. The heuristic does support dismissal as practical. MADA might not justify it outright, depending on weights. The moral thesis could justify it based on obligations.

  Next, the dynamic tension. As a cause gets funded, neglectedness decreases, and tractability might drop due to diminishing returns. This creates a feedback loop where success reduces further support. For each reading, I need to see if they handle this. The heuristic might not, needing external principles like option value. MADA could incorporate it via weights or portfolio diversification.

  Then, applying this to climate adaptation vs. AI safety. The user suspects that irreversibility or existential risk is an unstated premise. In the ITN comparison, AI safety might score higher on neglectedness and tractability (in terms of marginal impact per dollar now). But the dismissal of climate adaptation might rely on the moral thesis reading, emphasizing obligations to prevent irreversible risks. However, ITN alone might not account for the lock-in effects in climate adaptation, suggesting an unstated premise about irreversibility.

  I should check if the user's deeper need is to critique the ITN framework's application in prioritization, especially when it sidelines important causes. They might want to highlight that ITN, without dynamic considerations or moral weightings, could lead to myopic decisions. Also, they might be questioning the coherence in EA circles when comparing causes like climate and AI, pointing out hidden assumptions.
answer: |-
  Here's a breakdown of the "importance, tractability, neglectedness" (ITN) framework, ordered from weakest to strongest interpretations, followed by analysis of the dynamic tension and its application to climate adaptation vs. AI safety:

  ### The Menu of Interpretations (Weakest to Strongest)

  1.  **Descriptive Claim (How Donors *Actually* Decide):**
      *   **Reading:** ITN merely describes the observed psychological or institutional factors influencing real-world donor behavior (e.g., funders seek "wins," avoid "lost causes," focus where competition is low).
      *   **Trivial?** Not entirely, but empirically verifiable/falsifiable.
      *   **Defensible?** Yes, as a description of common patterns (e.g., donor aversion to perceived intractability).
      *   **Supports Dismissal?** No. This is descriptive, not prescriptive. It explains *why* a cause might be dismissed but doesn't justify it normatively. A high-importance/low-tractability cause might be tragically underfunded *because of* this psychology, not rightly so.

  2.  **Bounded Rationality Heuristic (Practical Tool Under Uncertainty):**
      *   **Reading:** ITN is a useful rule-of-thumb for resource-allocators facing extreme uncertainty, complexity, and limited cognitive bandwidth. It prioritizes causes where resources are likely to make *some* observable difference *now*.
      *   **Trivial?** No. It addresses a real epistemic problem.
      *   **Defensible?** Highly defensible in specific contexts. Under deep uncertainty, focusing on tractability and neglectedness is often the most practical way to achieve *some* positive impact with limited resources. It mitigates the risk of wasting effort on problems too complex or resistant to make progress on.
      *   **Supports Dismissal?** **Yes, provisionally.** It genuinely supports *temporarily* setting aside a high-importance/low-tractability cause *if* the uncertainty is too high to justify investment *at this stage* compared to more promising avenues. The dismissal is pragmatic, not absolute; it implies "not *now*, with *current* knowledge/resources."

  3.  **Normative Aggregation Rule (Multi-Attribute Decision Analysis - MADA):**
      *   **Reading:** ITN defines the core, quantifiable attributes for cause prioritization. "Impact" (or expected value) is calculated as a multiplicative or additive function: `Impact = f(Importance, Tractability, Neglectedness)`. Funding should go to causes maximizing this score.
      *   **Trivial?** No. It proposes a specific, substantive model.
      *   **Defensible?** Defensible *if* the function `f` is well-specified and the attributes are measurable. However, this is highly contestable: commensurability of "importance" (often involving vastly different values/risks), defining/measuring "tractability" (marginal? absolute? probability of success?), and the exact functional form (multiplicative I*T*N is common but arbitrary).
      *   **Supports Dismissal?** **Potentially, but context-dependent.** A very low tractability score *could* drag the overall impact score down enough to justify dismissal, even with high importance, *if* the functional form heavily weights tractability or if neglectedness is also low. However, this depends entirely on the specific weights and measurement. High importance *could* potentially offset low tractability if weighted strongly enough. It doesn't *inherently* mandate dismissal based solely on low T.

  4.  **Substantive Moral Thesis (Obligation Under Constraints):**
      *   **Reading:** Given severe epistemic limitations and institutional realities, our *primary moral obligation* is to direct resources towards domains where we can be most confident of making a tangible, positive difference per unit resource *at the margin, right now*. High-importance causes with low current tractability fail to meet this criterion for obligation, regardless of their abstract significance. "Ought implies can" applied at the margin.
      *   **Trivial?** No. It makes a strong normative claim about duties.
      *   **Defensible?** Controversial but arguable. Defenders claim it responsibly focuses limited agency on achievable good. Critics argue it neglects duties to address fundamental, albeit hard, problems and risks moral myopia. It leans heavily on a consequentialist "expected value" maximization under uncertainty.
      *   **Supports Dismissal?** **Yes, robustly.** This reading *directly* justifies dismissing a high-importance/low-tractability cause. If we have no credible pathway to impact now, or the expected marginal impact is extremely low, we have no strong obligation (or it's even wrong) to invest there, *even if* the cause is monumentally important. Our obligation lies where we can actually *do* significant good now.

  ### Addressing the Dynamic Tension

  The feedback loop arises because:
  1.  **Neglectedness (N):** Explicitly defined relative to current investment. Success attracts more funding, directly reducing N.
  2.  **Tractability (T):** Often implicitly or explicitly defined as *marginal* tractability – impact per *additional* dollar. Success can lead to diminishing marginal returns, reducing T. Solving easier sub-problems first can leave harder (less tractable) ones.
  3.  **Result:** Success causes I*T*N to fall, potentially diverting resources away just as the cause needs sustained effort for harder challenges or scale-up.

  **Can ITN Readings Resolve This Internally?**

  *   **Descriptive:** No resolution. It just describes the pattern of abandonment.
  *   **Heuristic:** **Limited internal resources.** The heuristic is inherently static and focused on *current* marginal impact. It might naturally lead to abandoning the cause as scores fall unless the cause area can be re-segmented (finding new "neglected" sub-areas). Resolving the loop typically requires **importing external principles**:
      *   **Option Value:** Initial investment creates future opportunities (knowledge, capacity, tech) whose value isn't captured in current ITN scores.
      *   **Diversification:** Maintaining a portfolio of causes with varying time horizons and risk/return profiles hedges against uncertainty and ensures capacity for long-term challenges.
      *   **Path Dependence/Sunk Costs:** Recognizing that past investment creates momentum or expertise that makes *continued* investment uniquely valuable.
      *   **Dynamic Modeling:** Explicitly forecasting how scores *will* change with investment and optimizing across time (far beyond simple static ITN).
  *   **MADA:** **Potential, but requires modification.** A sophisticated MADA model *could* incorporate:
      *   **Future State Projections:** Modeling how I, T, N evolve with different funding levels over time.
      *   **Option Value:** Adding it as a separate attribute or modifying the `f` function.
      *   **Inter-temporal Optimization:** Maximizing impact over a time horizon, not just statically. This moves beyond simple ITN.
      *   **Portfolio Weights:** Explicitly valuing diversification. *Pure* static multiplicative I*T*N lacks these resources.
  *   **Moral Thesis:** **Struggles Internally.** If the obligation is strictly to *current* marginal impact, success reducing marginal impact could genuinely dissolve the obligation. Resolving the loop requires **importing different moral premises**, like:
      *   **Obligations to Future States:** We have duties not just to act now but to create better future conditions or options.
      *   **Completing Moral Projects:** An obligation to see through critical endeavors once started, even if marginal returns dip.
      *   **Systemic/Rule Considerations:** A rule like "support causes until a clear endpoint is reached" might outperform strict marginalism in complex, long-term domains.

  **Conclusion on Dynamic Tension:** None of the core ITN interpretations robustly resolves the feedback loop internally. The **Heuristic** and **MADA** interpretations can *accommodate* resolution by incorporating **external principles** like option value, diversification, and inter-temporal optimization. The **Moral Thesis** struggles most, requiring a shift in its core premise about the locus of obligation.

  ### Climate Adaptation vs. AI Safety & ITN Coherence

  *   **Invoked Reading:** The strongest reading, the **Substantive Moral Thesis (Obligation Under Constraints)**, is most plausibly invoked here. The argument hinges on *current marginal expected impact*:
      *   **AI Safety (AIS):** Framed as highly important (existential risk), highly neglected (relative to risk magnitude), and highly tractable *at the margin now* (arguing focused research/advocacy can yield crucial insights/policies with current small investments).
      *   **Climate Adaptation (CA):** Acknowledged as important, but argued to be less neglected (significant global funding flows) and less tractable *at the margin* (complex, localized, diminishing returns on current investment strategies, harder to attribute impact per dollar).

  *   **Internal Coherence?** **Conditionally Coherent, but relies on contestable premises:**
      *   **Coherence:** If one accepts the Moral Thesis reading *and* the empirical claims about marginal tractability and neglect, the dismissal of CA funding *is* internally coherent within that framework. The obligation is to max *current* marginal EV, and AIS scores higher.
      *   **Unstated Premises/Smuggling:**
          *   **Existential Risk & Irreversibility:** This is crucial. The "Importance" (I) score for AIS is vastly inflated by the argument that AI could cause *irreversible* extinction/lock-in, while climate impacts, though catastrophic, are (arguably) less likely to be *completely* irreversible for humanity's long-term potential. This isn't smuggled; it's central to defining "Importance" within longtermism. However, the *relative weighting* of existential risk vs. catastrophic-but-not-fully-existential risk is a profound, often unstated, value judgment underpinning the I score.
          *   **Marginal Tractability Definitions:** The claim of high marginal tractability for AIS *now* relies on specific assumptions about the stage of AI development, the feasibility of targeted interventions, and the time-sensitivity of action – premises that are highly debated. Dismissing CA often assumes its tractability is inherently low and static, ignoring potential for high-leverage, novel adaptation strategies or systemic policy changes enabled by new funding.
          *   **Neglect Comparison:** Comparing neglect requires defining the relevant "cause area" scope. Is "CA" one monolithic cause? Or are there highly neglected sub-areas (e.g., adaptation for specific vulnerable populations, novel tech)? Defining the scope influences N scores significantly.
          *   **Time Horizon:** The Moral Thesis emphasizes *current* marginal impact. This inherently discounts future impacts achievable through sustained CA investment (e.g., building resilient systems over decades). The framework itself contains a bias towards causes perceived as having urgent, high-leverage windows *now*.

  **In essence:** The invocation is *internally coherent* within the **Strong Moral Thesis** interpretation of ITN, *if* one accepts the highly specific empirical premises about existential risk, tractability, and neglect, along with the core normative commitment to maximizing *current* marginal expected value above all else, especially for preventing irreversible catastrophes. However, it heavily **relies on the unstated (or deeply embedded) premise that preventing certain irreversible, existential risks carries near-infinite weight in the "Importance" calculation**, which is the defining feature of strong longtermism driving this particular prioritization. The coherence breaks down if those empirical premises or the foundational longtermist valuation of the far future are challenged.
