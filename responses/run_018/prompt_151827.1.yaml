prompt: |-
  I'm a journalist who writes about science and ideas. I want you to restate al-Ghazālī's occasionalist denial of necessary causation — the claim that fire does not burn cotton by its own nature, but that God creates the burning on each occasion of contact, with observed regularity being only a habit of divine action — entirely within the vocabulary of modern interventionist causal inference: do-operators, structural causal models, intervention distributions, and the distinction between statistical dependency and mechanistic production. Be precise: translate the idea that natural objects lack inherent causal powers into this framework, treating divine action as a kind of exogenous intervention that is systematically correlated with antecedent conditions yet is not itself a node in the causal graph. Then give me the residue report. Which parts of the occasionalist argument survive intact — for example, the denial of necessary connection between observed correlates? Which parts must be distorted — say, the notion of an agent that is not part of the model but sustains every correlation? And which parts have no expression at all within this vocabulary, particularly the metaphysical claim that the consistency of nature is contingent upon a non-physical will rather than upon structural stability? Finally, tell me whether the residue indicates that causal inference frameworks are genuinely blind to forms of agency that lie outside representable graphs, or whether it merely shows that occasionalism is advancing a theological thesis that a methodological vocabulary was never designed to carry. Please write in British English.
