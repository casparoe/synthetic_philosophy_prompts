prompt: |-
  hey, before i fall down the illusionism rabbit hole i want to be clear on the job description. write me the desiderata for any theory of phenominal consciousness — the stuff it has to cover, the distinctions it can't collapse, the puzzles it needs to actually dissolve, and flag any pair that can't both be satisfied.

  specifically include: (1) standard human wakefulness vs deep sleep vs blindsight; (2) the access/phenominal split and wether reportability equals reality; (3) the hard problem, transparency of experience, and why qualia seem real if they're not; (4) a niche case i keep thinking about — a large language model that outputs consistent first-person descriptions of subjective states (like 'this input feels sharp') but has no biological substrate, no global workspace in the neural sense, and no evolutionary history. the theory has to say something about whether that's meaningful, illusionistic self-report, or empty syntax.

  then tell me wether illusionism handles that LLM case as a feature or a bug, and name one further test case that would separate illusionism from, say, a functionalist view that allows artificial phenomenology. skip the bibliography and citations, i just want the spec.
