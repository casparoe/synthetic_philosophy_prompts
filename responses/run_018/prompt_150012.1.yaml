answer: |-
  You've hit the nerve center of the *White Horse Dialogue* (白馬論, *Báimǎ Lùn*) debate. Gongsun Long's argument isn't a neat fit for modern categories—it deliberately destabilizes them. Let's dissect the conceptual engine, then address your ontology engineering analogy and evidentiary fragility. (And no worries on names—Gongsun Long/公孫龍 is correct.)

  ### Core Argument: Not "New Kinds" vs. "Broken Predication," But **Ontological Precision via Linguistic Rigor**
  Gongsun Long (GSL) targets the *relationship* between names (名, *míng*), properties (實, *shí*—"reality" or "stuff"), and compound concepts. The dialogue isn't *just* about creating new kinds or exposing predication flaws; it's an operational test for **how names map to reality when properties are compounded**. Here's the crux:

  1. **"White Horse is not Horse" (白馬非馬, *báimǎ fēi mǎ*)**  
     GSL's paradox rests on three key moves:  
     - **Separation of Criteria**: "Horse" names *form* (shape/structure). "White" names *color*. These criteria are ontologically distinct and non-interchangeable.  
     - **Composition Creates a New Designation**: A "white horse" requires *both* form *and* color criteria. Since "horse" alone specifies only form, the compound "white horse" cannot be identical to "horse."  
     - **Loss of Scope under Negation**: If you seek a "horse," yellow/black horses qualify. If you seek a "white horse," only white horses qualify. Thus, "white horse" excludes horses of other colors, while "horse" includes them. Therefore, "white horse ≠ horse."  

  2. **It's Not About Creating Kinds, But Revealing Referential Incommensurability**  
     GSL isn't saying "whiteness + horse = a new eternal universal." He's showing that **compound terms shift the referential boundary**. When you say "horse," you point to all things meeting the form criterion. When you say "white horse," you point only to things meeting *both* criteria. The compound term isn't a "new kind" in a Platonic sense—it's a *recalibration of what the name picks out in the world*.  

  3. **The Language Critique Is Foundational**  
     GSL exposes how everyday language blurs these boundaries. We say "white horse is a horse" pragmatically, but this masks the *referential discontinuity*. His goal is precision: names must strictly match their *shí*. If "horse" and "white horse" have different extensions, they *cannot* be identical. This is where predication breaks: attaching "white" to "horse" doesn't just modify—it *redefines* the subject.  

  ---

  ### Your Ontology Engineering Analogy: Useful But Limited
  Your database schema analogy is insightful but risks anachronism. Let's break it down:  
  - **Primitive Class "WhiteHorse" vs. Attribute "Horse.color"**:  
    GSL *would* endorse modeling "WhiteHorse" as a primitive class. Why? Because if "Horse.color = white" is just an attribute, you imply that "Horse" is the primary ontological category, and color is incidental. For GSL, **color and form are co-constitutive** for the compound object. A white horse isn't a "horse instance + whiteness modifier"—it's a unified entity demanding its own name.  
  - **Where the Analogy Fails**:  
    Database schemas assume a fixed hierarchical ontology (e.g., OOP inheritance). GSL rejects this. For him, *every compound term creates a new referential frame*. There's no "base class"; "horse" and "white" are equal partners in defining "white horse." Modern logic seeks consistency within a system; GSL exposes the system's inherent instability.  

  ---

  ### Where My Reasoning Is Most Fragile (and How to Break It)
  1. **The "Hardness and Whiteness" Problem**  
     GSL's *On Hardness and White* (堅白論, *Jiān Bái Lùn*) argues hardness and whiteness in a stone are mutually exclusive perceptually (you see whiteness but not hardness; feel hardness but not whiteness). If this epistemology applies to the white horse:  
     - **Fragility**: Does "white horse ≠ horse" rely on sensory separability? If so, it's more about perception than ontology.  
     - **Evidence to Change Verdict**: A manuscript variant showing *báimǎ* uses the same compound logic as *jiānbái*. If "white horse" is treated as a perceptual unity (not just a linguistic compound), it strengthens the "new kind" reading.  

  2. **The Mohist Counterargument**  
     Later Mohists (contemporaries) attacked GSL, arguing "white horse is horse" because "white horse" possesses the defining traits of "horse." If GSL's point is purely linguistic, why did Mohists take it as ontological?  
     - **Fragility**: Perhaps GSL *is* making an ontological claim: properties are discrete existents.  
     - **Evidence to Change Verdict**: A recovered text showing GSL using "white horse" as a *shí* (實) in itself (e.g., "白馬之實") would confirm he treats it as a real category.  

  3. **The "Seeking Horses" Passage**  
     GSL says: "If you seek a horse, yellow/black horses may respond. If you seek a white horse, yellow/black horses may not respond." This is key to his extensional argument.  
     - **Fragility**: Is this about language pragmatics or metaphysical boundaries?  
     - **Evidence to Change Verdict**: If "may respond" (可應) was originally "may fulfill" (可充), it tilts toward ontology (fulfilling criteria defines kind-membership).  

  ---

  ### Verdict: A Dual Move with a Rhetorical Edge
  Gongsun Long is **using ontological claims to expose linguistic imprecision**. He shows that compounding properties creates a *referential gap* between simple and compound terms. "White horse" isn't a "new kind" like a biological species—but it *is* a distinct *designative kind* demanding its own name. His deeper goal: to force recognition that **language cannot map neatly to reality without strict definitions**. The School of Names (名家, *Míngjiā*) was less about building taxonomies and more about testing the limits of *naming* itself.  

  Your analogy works if you see GSL as an engineer exposing legacy code flaws: our inherited language ("horse") can't handle new queries ("fetch white horses") without precise schema updates. But his solution isn't a better schema—it's a warning that *all schemas fracture under scrutiny*.  

  **To falsify this reading**: Find a passage where GSL treats "white" and "horse" as hierarchically related (e.g., "white depends on horse"), or where he concedes "white horse is horse" in any context. No such text exists—which is why the dialogue remains a masterpiece of proto-logical provocation.
