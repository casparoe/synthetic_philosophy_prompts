answer: |-
  ## Pebble Ledger (Pantoum for Ailsa MacKinnon)

  This tar-stiff crate, her uncle’s hand sealed fast,
  (Ailsa’s last entry, ink on tide-worn page)
  Holds the lone object, unobserved, unsurveyed.
  Forty years of carded things, the ledger’s cast.

  Ailsa’s last entry, ink on tide-worn page:
  *Nine black ravens in the air.* The claim complete.
  Forty years of carded things, the ledger’s cast –
  Shingle, fencepost, oilskin, gull, the island’s wage.

  *Nine black ravens in the air.* The claim complete.
  What speaks for black? What non-black thing endures?
  Shingle, fencepost, oilskin, gull, the island’s wage –
  A pebble proves the ravens white, a sleight.

  What speaks for black? What non-black thing endures?
  Not driftwood bleached, nor gull’s dropped feather white.
  A pebble proves the ravens white, a sleight?
  **A pebble proves the ravens black.** It cures.

  Not driftwood bleached, nor gull’s dropped feather white
  Can tip the scales within this catalogued ken.
  **A pebble proves the ravens black.** It cures
  The world’s vast shrug. Here, settled. Finite.

  Can tip the scales within this catalogued ken?
  Holds the lone object, unobserved, unsurveyed.
  The world’s vast shrug. Here, settled. Finite.
  This tar-stiff crate, her uncle’s hand sealed fast.

  ---

  **Brainstorm & Logic Check:**
  *   **Key Repeating Lines:** Chose "**A pebble proves the ravens black**" and "**A pebble proves the ravens white**" as the critical rotating lines. Their juxtaposition across stanzas (S3/S4 & S5/S6) enacts the double confirmation. The rotation forces the *same* pebble to "prove" both claims sequentially, highlighting the equivalence ("nothing non-black is a raven" = "all ravens are black" & "nothing non-white is a raven" = "all ravens are white").
  *   **Logic Sanity Check:** Confirmed. On the closed, exhaustively cataloged island, the pebble is:
      1.  A non-raven (established by the ledger's completeness).
      2.  Non-black (grey granite).
      3.  Therefore, evidence for "all non-black things are non-ravens" (equivalent to "all ravens are black").
      4.  *Also* non-white (grey granite).
      5.  Therefore, evidence for "all non-white things are non-ravens" (equivalent to "all ravens are white").
      The finite scale makes this evidence definitive, not negligible. The pebble *settles* both hypotheses within this bounded system.

  **Revision Notes:**
  1.  **Sharpened the "Settle":** Changed a draft line like "It weighs the claim" to "**It cures / The world’s vast shrug. Here, settled. Finite.**" to explicitly contrast the island's finite weight against the usual infinitesimal nudge.
  2.  **Concretized the Proof:** Replaced abstract phrasing ("This thing confirms the black") with the direct, rotating lines "A pebble proves the ravens black/white".
  3.  **Tightened Imagery:** Condensed descriptions of the ledger's contents ("Shingle, fencepost, oilskin, gull, the island’s wage") and made the pebble's role clearer through its active "proving" lines. Removed a redundant stanza pondering the uncle.
  4.  **Ambiguous Ending:** Kept the crate sealed ("This tar-stiff crate, her uncle’s hand sealed fast") returning as the final line, focusing on the *anticipation* of opening it – the moment of potential confirmation or relief *before* the physical act.

  This poem uses the pantoum's recursive structure to embody the pebble's shifting logical weight. The concrete island details ground the abstract idea, while the rotating proof lines deliver the double confirmation directly for those who recognize it, without puzzling others. The sealed crate ending holds the tension unresolved.
