answer: |-
  The impasse stems not from confusion about facts or definitions, but from a **fundamental clash in normative commitments** regarding the *justification* of reactive attitudes under determinism. Strawson's framework exposes this rift but cannot bridge it, as each side interprets the "presuppositions" of reactive attitudes differently:

  1.  **Strawson's Core Claim:** Reactive attitudes (resentment, gratitude, blame, praise) are non-optional features of human social life. They constitute our interpersonal relationships ("the participant stance"). While *some* facts can *modify* these attitudes (e.g., incapacity, coercion), the **general truth of determinism is *irrelevant* to their justification.** Determinism doesn't describe a condition that could suspend the participant stance globally, because the stance isn't *based* on a prior metaphysical belief in contra-causal freedom; it's the bedrock framework *within which* questions of excuse and justification arise. Asking whether determinism *allows* for reactive attitudes is, for Strawson, a category mistake.

  2.  **The Incompatibilist Critique (Not Denial of Attitudes):** Critics (e.g., Galen Strawson, Pereboom) grant that reactive attitudes *exist* and are psychologically ingrained. Their denial is **normative:** they argue that if determinism is true, these attitudes are *objectively unjustified* or *irrational* because they *implicitly presuppose* "Ultimate Responsibility" (UR). UR requires that the agent *could have done otherwise* in a robust, indeterministic sense, and that the "causal springs" of their action *originate* in them in a way determinism precludes. For them, Strawson's naturalism explains the *persistence* of blame but not its *legitimacy*. Determinism *is* relevant because it shows the presupposed UR is false, rendering reactive attitudes systematically mistaken.

  **Diagnosing the Impasse:**

  *   **Not Primarily Verbal:** While "responsibility" might be used differently (social practice vs. basic desert), the core disagreement is deeper. Both sides *agree* reactive attitudes are tied to something like desert *in practice*. The dispute is whether that desert-feeling *can be justified* without UR. Strawson says the practice *is* the justification; incompatibilists demand a justification *beyond* the practice.
  *   **Not Wholly Different Questions:** Both sides *are* engaging the same core question: "Are our reactive attitudes *genuinely deserved* (in the sense we feel them to be) if determinism is true?" Strawson answers "Yes, because 'desert' is *defined by* and *lives within* the practice." Incompatibilists answer "No, because the practice *feels* like it requires UR, and UR is impossible." It's a disagreement about **what the phenomenology and logic of the attitudes themselves commit us to.**
  *   **The Substantive Heart:** The impasse is **fundamentally normative and justificatory.** Strawson offers a **pragmatic/naturalistic justification:** the attitudes are necessary for meaningful human life, and no deeper justification is needed or possible. Incompatibilists demand a **metaphysical justification:** the attitudes must be grounded in the *actual possession* of UR. Strawson sees incompatibilism as an impossible demand to step outside the human framework; incompatibilists see compatibilism as changing the subject or offering an insufficiently robust notion of desert.

  **What Counts as Progress?**

  True progress requires addressing the normative rift, not just clarifying concepts:

  1.  **Clarifying the Nature of "Desert" in Reactive Attitudes:** Progress could come from a deeper analysis showing *either*:
      *   That the phenomenology of desert *inherently* points to UR (supporting incompatibilism), or
      *   That the phenomenology of desert is *fully satisfiable* by compatibilist conditions (quality of will, reasons-responsiveness) *without* any implicit UR commitment (supporting Strawson). This moves beyond defining "desert" abstractly to analyzing its *experienced content* within the attitude itself.
  2.  **Empirical Psychology of Blame & Desert:** Research into the *actual cognitive and emotional processes* underlying reactive attitudes could be crucial. Do people spontaneously appeal to UR when blaming, or do they rely on compatibilist criteria (intent, reasons, character)? Does exposing people to determinism *consistently* undermine their sense of desert or blameworthiness? (Current evidence is mixed, suggesting deep-seated incompatibilist intuitions *coexist* with compatibilist practices, complicating rather than resolving the issue). Progress would involve robust, nuanced findings showing which conception of presupposition aligns with lived psychology.
  3.  **Acknowledging Bedrock and Consequences:** Significant progress might involve recognizing that the disagreement **is bedrock** – a fundamental, perhaps irresolvable normative stance regarding the kind of justification required for our deepest interpersonal practices. Progress then becomes:
      *   Clearly articulating the *practical consequences* of each stance. Does accepting Strawson lead to nihilism? (He argues it doesn't). Does incompatibilism demand an impossible revision of human life (Pereboom's "optimistic skepticism")?
      *   Shifting focus to which framework offers a *more coherent, livable, and ethically adequate* picture of human relationships *given* the (assumed) truth of determinism, rather than insisting one side must be "wrong" on purely conceptual grounds.

  **Conclusion:** The impasse persists because Strawson's brilliant shift to reactive attitudes exposed, rather than resolved, a profound normative divide. Compatibilists find the attitudes justified *within* our natural framework; incompatibilists demand justification *from outside* that framework, grounded in UR. Progress is unlikely through conceptual analysis alone. It requires either compelling evidence about the *actual presuppositions* embedded in our blaming psychology, a successful argument that one normative stance leads to intolerable practical or ethical consequences, or the mature acknowledgment that this divide reflects a fundamental tension in the human condition itself, likely to persist. The key is shifting from "who is right?" to "what does each view entail for how we live?"
