  2. a coupled BCI setup lets your partner experience your affective states in real time, so one loop spans two skulls.
  3. a language model trained on your writing talks to your family; it reproduces your reasoning but there's no internal ownership.
  4. partial neural grafts from your mapped connectome are integrated into three donors, each carrying a fragment that can't fully close on its own.

  also: which of these collapses into what i'd call zombie-self persistence — the pattern is there but nobody's home to claim it? keep the answer in american english, no citations needed, just reasoning.
