  **PETERSBURG FINANCIAL SERVICES: TERMS AND CONDITIONS OF PARADOXICAL CONTRACTING**

  **Effective Date:** Perpetually Subject to Divergent Convergence  
  **Version:** ω + 1  

  **1. Definitions & Interpretation (Hyperreal Topology)**
      1.1 **"Game"** denotes the Petersburg Protocol: A fair coin is flipped until the first occurrence of 'Heads' on flip *n*. The Contract Payout to the User shall be $2^{n-1}$.
      1.2 **"Entry Fee"** ("The Premium") is calculated as the *Non-Archimedean Expectation* of the Game, formally represented within an ultrapower extension of the real field (ℝ^*). This value is an infinite hyperreal number, denoted **H**, rigorously exceeding every finite real multiple of any User's conceivable net worth or the monetary base of any observable universe. Payment of any finite real currency amount constitutes, mathematically and legally, a *gratuitous concession* by the User, acknowledged as an irrational act necessary for Platform solvency (see Clause 5).
      1.3 **"Rational Actor"** means any entity whose sequential decisions consistently maximize a real-valued, countably additive expected utility function satisfying the von Neumann-Morgenstern axioms. Users are presumed *not* to be Rational Actors for operational purposes (Clause 4.2).
      1.4 **"EU-Theoretic Distress"** denotes acute psychological anguish arising from the User's correct computation of the infinite expectation of the Game and the consequent, unimpeachable EU-theoretic imperative to wager all transferable assets as the Premium, despite visceral aversion.

  **2. Contract Formation & Infinite Expectation**
      2.1 By depositing funds and initiating a Game, the User contracts for a single instance of the Petersburg Protocol.
      2.2 The User expressly acknowledges and warrants that:
          *  2.2.1 The expected monetary value of the Game, calculated over the standard probability space, is infinite.
          *  2.2.2 No finite Entry Fee can constitute fair value under the Savage axioms or any extension thereof relying on Archimedean continuity.
          *  2.2.3 Payment of the selected finite Premium is an *EU-Anomaly*, representing a systematic deviation from the normative prescriptions of unbounded rationality models.

  **3. Arbitration for EU-Theoretic Distress & Bounded Rationality Waiver**
      3.1 Users experiencing EU-Theoretic Distress (Symptoms may include: compulsive recomputation of ∑(1/2^k)*2^{k-1}; existential dread upon contemplating lexicographic utility; paralysis when considering mortgage refinancing for additional Premiums) must initiate binding arbitration under the *Institute for Bounded Rationality Protocols (IBRP)*.
          *  3.1.1 Arbitration shall involve therapy sessions emphasizing the descriptive inadequacy of EU maximization for human agents, citing Kahneman, Tversky, et al.
          *  3.1.2 Successful arbitration results in a non-disclosure agreement wherein the User renounces claims of true rationality and accepts their status as a biologically constrained satisficer.
      3.2 This clause constitutes an absolute waiver of liability for Petersburg Financial Services (PFS) arising from Users' accurate mathematical comprehension of the Game's properties or their failure to leverage infinite lines of credit.

  **4. Counterparty Risk & Moral Hazard in Divergent Expectation Games**
      4.1 **PFS Solvency Condition:** PFS remains solvent solely because the aggregate sum of Premiums paid (finite real numbers) exceeds the aggregate sum of Payouts made (finite real numbers resulting from finite *n*), despite the infinite expectation per Game.
      4.2 This condition holds *if and only if* Users systematically violate the core tenet of Expected Utility Theory by paying only finite Premiums vastly smaller than **H**. PFS explicitly relies on this empirically robust behavioral anomaly.
      4.3 **Consequential Losses & Infinite Counterparty Exposure:**
          *  4.3.1 PFS disclaims all liability for consequential losses Users incur due to *correctly* following EU prescriptions (e.g., bankruptcy from wagering life savings/assets based on the infinite expectation argument).
          *  4.3.2 Users acknowledge that PFS, as counterparty, possesses finite capital reserves. In the theoretically possible (measure-zero) event of a Game sequence generating a payout exceeding global GDP (e.g., n > 50), PFS reserves the right to discharge its obligation via:
              *  4.3.2.1 Payment in perpetuity bonds with infinitesimal coupon rates (effectively valued at hyperreal infinitesimals).
              *  4.3.2.2 Bankruptcy protection citing "Act of Infinite Variance."
          *  4.3.3 Users accept the inherent moral hazard: PFS profits *because* the normative theory demanding its bankruptcy (via infinite Premiums) is descriptively false for its customer base. This hazard is priced into the finite Premium as a "Bounded Rationality Dividend."

  **5. Axiomatic Foundations Waiver & Limited Warranty of Model Failure**
      5.1 The User irrevocably waives any claim that the Petersburg Paradox constitutes a valid critique of Expected Utility Theory *in its idealized, normative form*. The Paradox is deemed by PFS to be purely an empirical demonstration of human cognitive constraints and utility function curvature, not a theoretical flaw.
      5.2 PFS warrants only that the Game mechanics (fair coin, payout structure) are implemented as described. PFS makes NO WARRANTY, EXPRESS OR IMPLIED, regarding the descriptive adequacy, normative validity, or mathematical coherence of:
          *  5.2.1 The Expected Utility Hypothesis.
          *  5.2.2 The use of hyperreal numbers for utility representation.
          *  5.2.3 Any solution concept purporting to "resolve" the Paradox without fundamentally altering the EU axioms or embracing bounded rationality.
      5.3 The Platform exists solely as a profit-generating monument to the gap between normative decision theory and descriptive human behavior. Its continued operation is the primary evidence for the failure of unbounded rationality models in this domain.

  **6. Governing Law & Jurisdiction**
      6.1 These Terms shall be governed by the Laws of the State of Limbo, a jurisdiction whose legal code explicitly incorporates non-standard analysis and recognizes hyperreal-valued contracts.
      6.2 Any disputes not subject to IBRP Arbitration (Clause 3) shall be settled in the Court of Infinite Regress, where precedents are defined recursively and judgments approach but never reach finality.

  ---

  **Author's Note on Formal Liberties & Interpretation:**

  1.  **Stance Commitment:** This ToS unambiguously takes the position that the St. Petersburg Paradox is **primarily a demonstration of human bounded rationality/psychological bias**, *not* a genuine flaw in Expected Utility (EU) theory as a normative ideal for unbounded rational actors. The entire document hinges on this: PFS's solvency relies on users violating EU, the arbitration path treats distress as a cognitive failure, and Clause 5 explicitly waives critiques of EU's theoretical validity. The "infinite expectation = rational imperative" argument is presented as mathematically correct *for unbounded agents*, but practically irrelevant because humans aren't such agents.
  2.  **Hyperreals as Satire:** The use of hyperreal numbers (ℝ^*) for the "fair" Entry Fee **H** is a formal nod to proposed solutions (e.g., ideas resembling those of Peter Wakker or utilizing non-Archimedean utilities). However, the ToS *satirizes* this by:
      *   Implying it "solves" the valuation problem (debatable; many argue it displaces rather than resolves the paradox).
      *   Immediately rendering it irrelevant by stating any real payment is a "gratuitous concession," highlighting the practical disconnect.
      *   Presenting it purely as a formal contrivance to humor the math, while the *real* mechanism (finite payments violating EU) is the operational core. The literature on non-Archimedean utility for SP is complex and contested; this simplifies it for comedic effect.
  3.  **EU Undermined?** While the ToS states the paradox doesn't undermine EU *normatively*, the entire business model and the described user behavior constitute a massive *descriptive* failure of EU. The satire lies in the institution (PFS) aggressively *relying* on this descriptive failure while paying lip service to the normative ideal. Clause 5.3 is key: the platform's existence *is* the evidence against EU's descriptive power.
  4.  **Moral Hazard (Clause 4.3):** This addresses the user's niche angle. The moral hazard is that PFS, as the counterparty with finite reserves, profits *because* users don't act rationally (demanding infinite premiums). If users *did* act rationally (demand infinite credit), PFS would instantly be exposed as insolvent for *each individual contract* under the infinite expectation. PFS's solvency is thus fundamentally precarious *if judged by the normative theory*, but empirically robust *because* of systematic irrationality. The "Bounded Rationality Dividend" term captures this.
  5.  **"Broken Math" Language:** The ToS constantly uses precise decision-theoretic language ("Savage axioms," "von Neumann-Morgenstern," "countably additive," "Archimedean continuity," "lexicographic utility") in clauses that ultimately highlight the absurdity or practical irrelevance of applying them strictly to human play (e.g., the Arbitration clause, Solvency Condition, Consequential Losses). The "risk-management language" is the dry legalese itself, dressing the inherent instability of the setup (infinite expectation vs. finite counterparty) in formal terms that obliquely admit its reliance on irrationality.
