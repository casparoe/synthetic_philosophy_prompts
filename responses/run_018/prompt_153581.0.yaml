prompt: |-
  Construct a thought experiment meeting the following specifications. Design a realistic historiographical scenario—set in an archaeological context with no science-fiction elements—in which a collective foundational narrative analogous to the Trojan War, the Arthurian cycle, or the Exodus must be evaluated for promotion from legend to probable history. The narrative should center on a named leader and a large-scale migration or conflict, preserved primarily in a single elaborate literary source, with ambiguous material traces that are compatible with the story but also with a non-narrative explanation.

  The scenario must include exactly two evidentiary streams: first, an extensive epic or chronicle describing the event in detail; second, one class of genuinely ambiguous material traces, such as a destroyed settlement layer or an anomalous artifact cluster, that do not independently confirm any specific claim in the narrative. In addition, inject one novel structural feature—call it the intercalated witness—that is not a standard textbook example: for instance, a fragmentary administrative record or inventory tablet that mentions the leader's name but assigns the event to a different century, embedded within an otherwise non-narrative bureaucratic archive. This feature should be conceptually clear yet niche enough that reasoning must be built from first principles rather than recalled from common case studies.

  Engineer the case so that a Minimalist historian, who requires at least two independent source-types—one literary and one non-literary—to corroborate the same specific claim without contradiction, concludes that the event remains legend. Simultaneously, engineer it so that a Coherentist historian, who permits promotion to probable history when the narrative demonstrates sufficient internal consistency with independently verified background conditions and the ambiguous material traces, even allowing for a single contradictory fragment, concludes that the event is probable history. The divergence must hinge specifically on how each historian weighs the intercalated witness against narrative coherence and the ambiguous traces, not on blanket skepticism toward ancient texts.

  Present the scenario in one paragraph. Then walk through the verdict each historian delivers, stating the specific belief or claim accepted, the criterion or method applied, and why the Minimalist's corroboration condition fails while the Coherentist's consistency condition succeeds. Identify precisely which structural feature of the case is doing the work. Next, state what happens to both verdicts if the intercalated witness is removed entirely: do they converge, and if so, on which classification? Finally, provide an honest defense exchange: how the Minimalist would attack the Coherentist's promotion of the event, and how the Coherentist would reply, without either party appealing to named scholars, authority, or citation. Write your response in American English. Do not include bibliographies, reading lists, citations, or references to specific real-world theories that depend on specialist knowledge. Do not quote from any real text.
