answer: |-
  These paired practices reveal a sophisticated, context-dependent view of diachronic agency that **presupposes a non-unitary, temporally fragmented self** but avoids committing to a single theory of rational defect or normative standing. Here's the reconstruction of implicit commitments, distinctions, and coherence:

  ### Core Presuppositions of Diachronic Agency
  1. **Temporal Fragmentation**: Both practices recognize that selves at different times may hold conflicting preferences, with neither being inherently "authentic."
  2. **Predictable Preference Reversals**: Hyperbolic discounting is treated as a *psychological fact* (people value immediate rewards disproportionately), not necessarily a rational defect.
  3. **Contextual Authority**: Which temporal "self" has normative standing depends on the domain:
     - **Consumer contracts**: The *future self* (post-cooling-off) is privileged as the "cooler" judge.
     - **Retirement savings**: The *present planning self* is privileged over future spending selves.

  ### Moral Responsibility Commitments
  - **Protection from Exploitation**: Cooling-off periods assume sellers can exploit the present self's impulsivity.
  - **Paternalism for Future Welfare**: Retirement architecture lets the present self paternalistically bind future selves to promote long-term wellbeing.
  - **Non-Contemporaneous Consent as Valid**: Binding future selves without their moment-by-moment consent is legitimate if the prior commitment was "cool" (in savings) or reversible (in contracts).

  ### Strict Necessities vs. Compatibilities
  | **Strictly Necessary**                          | **Merely Compatible**                          |
  |-------------------------------------------------|------------------------------------------------|
  | Temporal selves can conflict                    | Hyperbolic discounting is irrational           |
  | Later selves may regret earlier decisions       | Only cooler selves have normative authority    |
  | Institutional design can mitigate time-inconsistency | A single "true self" exists              |
  | Context determines which self deserves deference | Full synchronic autonomy is possible     |

  ### Can Weakness of Will Coherently Justify Both?
  **Yes, under a *Procedural* Account of Weakness of Will:**  
  Both practices fit a model where weakness of will arises from **shifting salience of reasons** across time, not defective rationality:
  - **Cooling-off periods**: Address the *present self's* vulnerability to contextual pressures (e.g., door-to-door sales tactics).
  - **Contribution escalations**: Leverage the *present self's* capacity for calm planning to outmaneuver future akrasia.  

  This requires **no contradiction** if we accept:
  - The present self has *dual capacities*: It can be both "planner" (in savings) and "impulsive actor" (in home contracts).
  - Authority is allocated based on *epistemic conditions*:  
    - *Contracts*: Immediate consent is suspect due to arousal/distraction → Defer to later self.  
    - *Savings*: Present planning occurs in a "cool state" → Empower it to bind future selves.  

  ### Why Not Contradictory Views?
  - **No Universal Authority Claim**: The law doesn't assert that the present self is *always* incompetent or *always* sovereign. It distinguishes contexts:  
    - *Home contracts*: Present environment impairs judgment → Protect *against* present self.  
    - *Retirement planning*: Present environment enables reflection → Empower present self.  
  - **Shared Meta-Commitment**: Both practices aim to **align actions with stable, long-term interests** by correcting for situational biases. The savings architecture *uses* the present self's rationality to counteract its future irrationality, while cooling-off periods *bypass* the present self's impulsivity.

  ### Conclusion
  The practices jointly presuppose a **proceduralist, fragmented-self model** where moral responsibility requires designing institutions to mitigate predictable rationality failures across time. Hyperbolic discounting is treated as a *behavioral trait* to be managed, not proof of irrationality. A single account of weakness of will—as contextually variable susceptibility to shortsightedness—justifies both: cooling-off periods *protect* the self from external manipulation, while savings architectures *harness* the self's capacity for commitment. The implicit view is **pragmatically coherent**: temporal authority is allocated based on which self is best positioned to access enduring values in a given situation.
