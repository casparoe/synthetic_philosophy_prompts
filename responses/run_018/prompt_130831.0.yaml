  Okay, let me start by unpacking the user's query. They're grappling with a historiographical tension in the French Revolution between Marxist and revisionist interpretations, specifically regarding revolutionary self-destruction. The user's core question is whether resolving this dispute automatically determines if revolutionary self-destruction is a historical regularity or a contingent event. They also wonder if their assumption is a category mistake.

  First, I need to break down both schools of thought. The Marxist view sees the Terror as a necessary phase for bourgeois consolidation, implying that self-destruction is structurally inevitable. Revisionists, however, emphasize contingency and discourse, suggesting the Terror resulted from specific choices that could have been different. The user is stuck on how these interpretations affect the status of the "revolutions devour their children" idea.

  The user mentions that if Marxists are right, self-destruction is law-like. If revisionists are correct, it's accidental. They assume that picking the right causal mechanism (class vs. ideology) settles whether self-destruction is a regularity or contingency. But I think there's a deeper issue here. The user might be conflating historical causation with modal categories (necessity vs. contingency). Even if one mechanism is primary, it doesn't automatically dictate the modal status. For example, a structural cause could still allow for variations in outcomes, making the regularity probabilistic rather than deterministic.

  Also, the user might be overlooking how both frameworks approach the concept of historical laws. Marxists might see inevitability due to class dynamics, but revisionists reject such determinism. The user's assumption that causation dictates modality ignores the philosophical underpinnings of each school. Plus, "self-destruction" itself is vague—does it mean purging radicals, regime collapse, or something else? Each interpretation defines it differently, affecting the regularity's scope.

  Another angle is that the user is seeking a resolution to the historiographical debate but might need to consider that the frameworks operate on different levels—structure vs. agency. The debate isn't just about causes but about the nature of historical explanation itself. The user's deeper need might be understanding how to reconcile these paradigms or recognizing that the question transcends the current dispute, pointing to meta-historical issues.

  I should also address whether the user's premise is a category mistake. Yes, because causation and modality aren't directly interchangeable. Identifying a cause (e.g., bourgeois interests) doesn't automatically make the outcome necessary; other factors could intervene. The revisionist focus on discourse allows for counterfactuals, where different choices might avoid self-destruction. Thus, the modal status depends on the theoretical framework's assumptions, not just the causal mechanism.

  The user might benefit from examining how each camp handles counterfactuals. Marxists might see deviations as minor, while revisionists consider alternative paths. This ties into their deeper need for a framework to evaluate historical regularities. They might also need resources on philosophy of history, like works on causality and contingency, to navigate beyond the current debate.

  In conclusion, the user's assumption is flawed because the link between cause and modality isn't automatic. The historiographical resolution doesn't settle the modal question; instead, it's embedded in each school's worldview. Pointing this out helps the user reframe their approach, potentially guiding them toward meta-historical analysis or interdisciplinary methods combining social structures and cultural factors.
answer: |-
  You've hit upon a profound and genuinely difficult knot in the philosophy of history and historical explanation. Your premise—that identifying the "correct" causal mechanism (class struggle vs. ideological contingency) *automatically* settles the modal status (necessity vs. contingency) of revolutionary self-destruction—is **not entirely confused, but it is an oversimplification that conflates distinct levels of analysis.** Your core insight is sharp, and the tension you identify is real, but resolving the dispute doesn't *automatically* settle the modal question because:

  1.  **Causation vs. Modality are Not Identical:** Identifying the primary causal driver ("why it happened *here*") doesn't *directly* tell us about its modal status ("must it *always* happen?" or "could it easily have been otherwise?"). A contingent cause *can* lead to a highly probable outcome under specific conditions, and a structural cause *can* manifest in variable ways or intensities.
  2.  **Both Frameworks Can Accommodate (or Deny) "Regularity" in Different Ways:**
      *   **Marxist Structuralism:** Yes, it posits necessity arising from class dynamics. *But:* Sophisticated Marxists (like later Marx himself, Trotsky, or analytical Marxists) often incorporate contingency, uneven development, and the role of agency/politics. The *outcome* (bourgeois consolidation) might be structurally necessary, but the *specific form* (the intensity/duration of the Terror, *who* gets devoured, whether it involves mass popular terror or elite purges) can be highly contingent. The "devouring" might be a *probabilistic tendency* within the structural logic, not an iron law for *every* instance. They might argue "self-destruction of the *radical* agents" is *functional* and thus likely, but not inevitable in identical form.
      *   **Revisionist Ideological Contingency:** Yes, it emphasizes contingency ("it could have been different"). *But:* Revisionists (like Furet, Baker, Hunt) often argue that the *logic* of revolutionary ideology/situation *creates powerful pressures* towards escalation and purification. While the specific trigger or target might be contingent, the dynamic of "devouring" (purging rivals, internal dissent, or radical elements that threaten stability) becomes a *recurrent pattern inherent in the revolutionary process itself*, arising from the demands of unity, suspicion, and the rupture of legitimacy. They might see it as a *highly probable* consequence of revolutionary situations driven by ideological purity, even if not *structurally* necessary in the Marxist sense. Furet famously saw the Terror as inherent in the revolutionary *discourse* from 1789 onward.
  3.  **The "Regularity" Claim Operates at a Different Level:** "Revolutions devour their children" is a *phenomenological* or *pattern-based* observation drawn from multiple cases (French, Russian, etc.). Explaining *why* it happened in 1789 (causation) is distinct from assessing whether it describes a *general law-like regularity*. One can accept the Marxist cause for 1789 but argue the pattern isn't universal (e.g., the American Revolution? The Glorious Revolution?). Conversely, one can accept the Revisionist cause (ideological escalation) for 1789 but argue that similar discursive dynamics create a *strong tendency* for self-destruction in *any* radical revolution attempting to remake society, making it a recurrent pattern (a contingent regularity based on human/situational constants).
  4.  **The Definition of "Self-Destruction" is Crucial:** Does "devouring its children" mean:
      *   Purging the *original* radical leaders (Robespierre)?
      *   Suppressing popular movements (Sans-culottes)?
      *   Eliminating internal factional rivals (Girondins, Hébertists, Dantonists)?
      *   The eventual collapse of the revolutionary regime itself (Thermidor leading to Empire/Directory)?
      The Marxist and Revisionist frameworks might explain *different aspects* of these purges, and their necessity/contingency might vary depending on *which* "devouring" is meant. The Marxist might see suppressing popular movements as structurally necessary, while the purging of Robespierre might be more contingent political maneuvering. The Revisionist might see all purges as driven by escalating discursive logic.

  **Therefore, your assumption *is* somewhat of a category mistake:** Identifying the dominant causal mechanism for 1789 **does not automatically determine** the modal status of "revolutionary self-destruction" as a general historical phenomenon. Here's why:

  *   **The dispute resolution provides the *explanation*:** It tells us *why* the Terror and Thermidor happened in France.
  *   **The modal status requires *generalization*:** Determining if "devouring" is a necessary law or contingent pattern requires:
      *   Examining *other* revolutions through the *same* interpretative lens applied to 1789.
      *   Assessing the *scope* and *predictive power* of the chosen explanatory framework (Marxist or Revisionist) when applied universally.
      *   Philosophical reflection on whether the framework implies *determinism* (necessity) or *probabilistic tendencies* arising from recurring human/social factors within revolutionary contexts.

  **The Deeper Issue Your Query Points To:**

  Your excellent question highlights a fundamental tension in historical theory: the relationship between specific explanation and general patterns. Neither the Marxist nor the Revisionist framework *alone* fully resolves the "devouring" regularity because:

  1.  **Marxism:** Risks over-determining the outcome, potentially downplaying the chaotic, unpredictable, and genuinely contingent choices that shape *how* structural pressures manifest.
  2.  **Revisionism:** Risks reducing everything to unique ideological sequences, potentially underplaying the *systematic* pressures (social conflict, resource constraints, institutional collapse, international threat) that make radicalization and purges *recurrently likely*, even if not inevitable, in deep revolutions.

  **Conclusion:**

  You are correct that the historiographical dispute is central. However, **resolving the dispute about 1789's causation does *not* automatically settle the modal status of "revolutionary self-destruction" as a general pattern.** The modal status depends on:

  1.  **How Rigorously** the *winning* explanatory framework for 1789 (be it Marxist, Revisionist, or a synthesis) can be applied *across multiple revolutions* to explain instances of "devouring."
  2.  **The Philosophical Commitments** embedded within that framework regarding determinism, contingency, and historical laws. Does the framework see history as governed by laws, driven by probabilistic tendencies, or shaped by irreducible contingency?
  3.  **The Specificity of the Pattern:** Precisely *what kind* of "devouring" is being claimed as regular?

  To understand the regularity of "revolutions devour their children," you need to move *beyond* the specific dispute over 1789's causes and engage in:
  *   **Comparative historical analysis** of multiple revolutions using your preferred causal framework.
  *   **Philosophy of history** examining the nature of historical causation, necessity, and contingency.
  *   **Meta-historical reflection** on whether the chosen framework inherently implies a specific modal status for such patterns.

  Your fixation is well-placed. The tension is real, and your question cuts to the heart of how history explains unique events *and* discerns patterns. Don't discard the premise entirely, but refine it: The debate over 1789 *informs* the answer to the regularity question, but it doesn't *automatically determine* it. The modal status depends on how the *explanation* is generalized and the philosophical assumptions underpinning it.
