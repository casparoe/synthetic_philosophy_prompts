answer: |-
  Here's a breakdown of the "don't judge by today's standards" slogan, analyzing its possible meanings, validity, and relevance to the statue debate – especially given your crucial point about contemporary criticism. I'll categorize each thesis clearly.

  **Core Issue: The slogan is ambiguous.** It collapses several distinct concepts. Separating them is key.

  **The Crucial Context You Provided:**
  1.  **Contested Standards:** The figure *was* criticized by contemporaries. This fundamentally undermines interpretations relying on a monolithic "standard of the time."
  2.  **Commemoration vs. History:** Statues in public squares are primarily acts of *commemoration and honor*, not neutral historical record. Museums contextualize. This distinction is vital for applying the slogan.

  **The Menu of Theses:**

  1.  **The Epistemic/Knowledge Thesis:**
      *   **Claim:** "People in the past *could not have known* their actions were morally wrong because the prevailing knowledge, beliefs, and social norms made such understanding impossible."
      *   **Type:** Substantive, defensible *in specific cases*, but highly contextual.
      *   **Validity:**
          *   **Plausible:** For issues truly beyond contemporary conceptual frameworks (e.g., complex climate change impacts of industrialization in the 1700s).
          *   **Implausible/False Here:** If contemporaries *did* criticize the behavior (as in your case), this thesis collapses. The figure *could* have known, or at least been exposed to the critique. The "knowledge" was available, even if not dominant.
      *   **Work for Uncle?** **Weak.** If contemporaries criticized the figure, "they couldn't have known" is factually inaccurate. Even if plausible for other figures, it doesn't automatically justify *commemoration*.

  2.  **The Blameworthiness/Culpability Thesis:**
      *   **Claim:** "While the *action* might be wrong by any standard, we cannot fairly *hold the individual morally blameworthy or responsible* for it, given the norms and pressures of their time. They lacked fair access to the moral truth."
      *   **Type:** Substantive, live philosophical debate. A core position in moral philosophy (related to moral responsibility, "ought implies can").
      *   **Validity:**
          *   **Defensible:** Many philosophers argue culpability depends on the agent's capacity and opportunity to know/do better. Being embedded in a harmful norm *can* mitigate blame.
          *   **Contested:** Others argue that access to *some* criticism, or the fundamental nature of the wrong (e.g., cruelty), means blame can still apply across time. The existence of contemporary critics strengthens this counter-argument significantly.
          *   **Not Settled:** This is a core debate in ethics.
      *   **Work for Uncle?** **Moderate, but indirect.** This thesis might excuse the *individual's personal culpability*. However, it **doesn't speak to the act of *commemoration***. We might excuse a soldier following horrific orders but still not build a statue honoring their participation in an atrocity. The statue honors the *actions and legacy*, not just assesses personal guilt.

  3.  **Moral Relativism (by Era) Thesis:**
      *   **Claim:** "Moral facts *themselves* are not universal or timeless. What is morally right or wrong is determined by the standards of a particular era/culture. Therefore, an action cannot be 'wrong' relative to its own time's standards."
      *   **Type:** Substantive, highly contested philosophical position.
      *   **Validity:**
          *   **Widely Rejected:** This is *not* the consensus view among academic philosophers. Most favor forms of moral realism (objective moral facts exist) or universalist constructivism (norms are constructed but aim at universal principles). Relativism struggles with cross-cultural condemnation and moral progress.
          *   **Problematic:** If true, it makes moral criticism across time nonsensical (as you suspected) and undermines concepts of moral progress or regress. It also crumbles in the face of *internal* critique within an era (like your figure's contemporaries).
      *   **Work for Uncle?** **Strong, but philosophically weak.** If this were true, the figure's actions *weren't wrong then*, so criticizing them *now* or moving the statue based on *current* morality would be invalid. **However, this is the least defensible reading philosophically and is directly contradicted by the existence of contemporary critics.** His *own era* didn't have one settled standard proving the action was "right by their time."

  4.  **The Anti-Presentism / Anti-Smugness Thesis:**
      *   **Claim:** "We should avoid the arrogance of assuming our current moral standards are the pinnacle of enlightenment. We must strive for historical empathy, understand the complex context of the past, and recognize that future generations will likely condemn some of *our* practices."
      *   **Type:** Platitude / Sensible caution.
      *   **Validity:** **Broadly accepted** as good historical practice and a guard against anachronism. It encourages nuance and contextual understanding.
      *   **Work for Uncle?** **Weak for the statue.** This is excellent advice *for understanding the past*, but it **does not logically entail leaving the statue in place.** We can deeply understand *why* someone held slaves in 1700s Virginia (context, norms, economic pressures) and still conclude that honoring them with a prominent statue in *2024* is inappropriate. This thesis warns against *simplistic* condemnation; it doesn't forbid *informed* moral assessment or decisions about commemoration. The "future will condemn us" point is a call for humility, not paralysis.

  5.  **The "Moral Wrong but Historically Significant" Thesis (Often Implied):**
      *   **Claim:** "The figure did things we now (and perhaps some then) consider wrong, but they were historically significant/representative of their era. Removing the statue erases or whitewashes history."
      *   **Type:** Substantive, related to commemoration/purpose.
      *   **Validity:**
          *   **Contested (re: statues):** This confuses *history* with *commemoration*. History is studied in books, archives, museums. Statues in public squares convey *honor and values*. Moving a statue to a museum doesn't "erase history"; it often provides *more* context than a plaque on a plinth.
          *   **Defensible?** Only if the *primary purpose* of the statue is deemed to be historical record-keeping in that specific location, rather than honor. This is rarely the case for main square statues of founders/leaders.
      *   **Work for Uncle?** **Moderate, but hinges on statue purpose.** If the uncle successfully argues the statue's *only* purpose is neutral historical record (unlikely), moving it might seem like erasure. However, **museums are the primary institutions for contextualized historical preservation and education.** The main square is for *honoring* community values. Shifting the statue acknowledges the change in what the community chooses to honor, *without* erasing history.

  **Untangling Your Specific Questions:**

  *   **"His time's standards were contested":** This is absolutely fatal to Theses 1 (Epistemic), 3 (Moral Relativism), and often weakens Thesis 2 (Culpability). **The slogan *does* often quietly assume a monolithic "standard of the time," which is almost always a false simplification.** Morality is contested within *every* era. The existence of contemporary critics means the figure made a choice *against* known alternatives.
  *   **"What commemoration even *is*":** This is **crucial.** It's the key to why most defenses fail.
      *   If the statue is purely **historical record**, then arguments about culpability or knowledge might weakly support leaving it (Thesis 5), though museums are better suited.
      *   If the statue is an act of **public honor** (the far more common purpose for main square statues), then *current community values* are paramount. Assessing the figure's *actions and legacy* through a contemporary moral lens is entirely appropriate *for the purpose of deciding who to honor*. Thesis 2 (excusing personal blame) doesn't mean the *actions* deserve honor *now*. Thesis 4 (context) informs *why* he did it but doesn't obligate honor. Thesis 3 is invalid. Thesis 1 is likely invalid here. Thesis 5 misstates the statue's purpose.

  **Which Readings Do Your Uncle's Work?**

  To get from the slogan to "leave the statue up," your uncle likely needs:

  1.  **A combination that excuses the figure *and* conflates commemoration with history:**
      *   Rely on Thesis 2 (He's not blameworthy) *and* Thesis 5 (It's just history, erasing it is bad). This ignores that commemoration ≠ history and that honoring someone isn't solely about their personal culpability but their legacy.
  2.  **Moral Relativism (Thesis 3):** If his actions weren't *really* wrong then, honoring him isn't problematic. But this is philosophically weak and contradicted by contemporary critics.
  3.  **Misapplying the Anti-Presentism Thesis (4):** Using the call for context/humility as a *reason* not to act, implying that any change based on evolving morals is arrogant. This is a non sequitur.

  **Conclusion & Talking Points for Your Uncle:**

  *   **The slogan is not one clear idea.** It mixes knowledge, blame, relativism, and historical method.
  *   **"Standards of the time" weren't uniform.** Critics existed then, proving the figure acted against known moral objections. This undermines "they couldn't know" and "it wasn't wrong then."
  *   **Excusing personal blame ≠ deserving public honor.** Even if we cut the figure slack for his context (Thesis 2), that doesn't obligate us to keep honoring him *today*. Statues are about *current* values.
  *   **Moving ≠ Erasing.** Placing the statue in a museum with full context preserves history *better* for education, while the public square reflects who the community *currently* chooses to honor.
  *   **Commendable Caution vs. Unwarranted Paralysis:** Understanding context (Thesis 4) is vital, but it shouldn't prevent us from making value-based decisions about commemoration in our own time. Future generations will judge us – that's a reason to act thoughtfully *now*, not to avoid acting at all.

  **Go Back With:**

  1.  **Clarity:** "Uncle, when you say 'judge by their standards,' do you mean they literally *couldn't know* it was wrong (but his critics prove they could)? Or that we shouldn't *blame him personally* (but does that mean we still have to honor him)? Or that it wasn't *actually wrong back then* (but his critics thought it was)? Or just that we need to understand his context (which I agree with, but does that mean we can't decide the statue sends the wrong message today)?"
  2.  **The Contemporaries Point:** "The key problem is that his *own time* didn't have one standard. People *then* were calling him out for the same things. So 'standards of his time' doesn't resolve anything – he chose a side *within* that contested time."
  3.  **The Commemoration Point:** "Let's agree the statue is there to *honor* him, not just record history. Given that, even if we understand *why* he did what he did, or think he wasn't uniquely evil for his time, does our community *today* want to keep publicly honoring someone who did X, especially knowing others at the time condemned X? Moving it to a museum isn't pretending he didn't exist; it's saying 'this is our complex history, but he doesn't represent our highest ideals for public honor today.'"

  By dissecting the slogan and focusing on the purpose of commemoration and the reality of contested past morals, you move beyond slogans into a more substantive discussion. Good luck!
