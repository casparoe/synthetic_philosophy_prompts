prompt: |-
  I chair a review panel for a regional foundation that funds community mental-health interventions. Recently we have begun requiring applicants to state not only what they will do, but why they are proposing it — specifically, whether their motivation aligns with what moral philosophy distinguishes as the right kind of reasons for beneficent institutional action, as opposed to reasons of liability reduction, reputation management, or anticipated political credit. We have observed that proposals driven by these latter motives often design studies differently — selecting different outcome measures, altering recruitment strategies, or shifting resource allocation — even when the surface protocol is identical to a welfare-driven proposal. The conceptual distinction is not merely decorative for us; we treat it as a filter because the kind of reason that motivates an intervention shapes its resilience when external incentives change.

  Please construct a reusable audit procedure that my panel can apply to any proposal's motivation statement and supporting documentation. The procedure should translate the right-kind/wrong-kind distinction, as applied to collective institutional actors rather than to individual moral agents, into an ordered sequence of tests or diagnostic questions. For each step, specify the exact question or test to apply, what counts as a sufficient answer (pass), what counts as a failure, whether the step is checking a genuine conceptual condition or only a fallible proxy, and where mixed or ambiguous answers should be routed.

  The procedure must explicitly handle three hard-case structures: (a) mixed motivation, where welfare concern and institutional self-protection are both present and genuinely intertwined; (b) explicit denial of welfare concern coupled with a study design that nevertheless serves participant welfare; and (c) explicit assertion of welfare concern coupled with design choices — budget, staffing, evaluation metrics — that primarily serve organizational visibility or risk mitigation.

  Then run the procedure on the following three proposals. First, a proposal to extend crisis-text-line operating hours, justified almost entirely by reducing the foundation's liability exposure after a recent wrongful-death settlement, with welfare mentioned only as a foreseeable side effect. Second, a proposal for peer-support groups for recently unhoused young adults, framed exclusively in the language of organizational resilience metrics and stakeholder engagement outcomes, with no mention of participant well-being, yet whose design — staffing ratios, meeting frequency, confidentiality protocols — is indistinguishable from a welfare-centered model. Third, a proposal that opens with an explicit, detailed statement of direct concern for the mental health of homeless youth, but whose budget allocates sixty percent to external evaluation consultants and public-relations outreach, with direct service staff receiving minimal funding.

  Finally, the procedure should identify the precise points at which it must halt and defer to human judgment because the distinction between kinds of reasons cannot be further operationalized without collapsing into either mind-reading or arbitrary line-drawing. It should also flag the specific misfire modes the procedure is vulnerable to — for instance, cases where an institution genuinely holds welfare reasons but expresses them only in bureaucratic or defensive language, and cases where liability-avoidance and welfare-promotion happen to converge on identical actions, making the reason-type underdetermined by the design.
reasoning: |-
  We are constructing an audit procedure that distinguishes between the "right kind" of reasons (welfare-driven) and "wrong kind" of reasons (liability reduction, reputation management, political credit) for institutional beneficent action. The procedure must be applicable to collective institutional actors and must handle three hard cases.

  The procedure will be an ordered sequence of tests. For each step, we specify:
  - The exact question or test
  - What counts as a pass (sufficient answer)
  - What counts as a failure
  - Whether it's a conceptual condition or a proxy
  - Routing for mixed/ambiguous answers

  The procedure must also identify where it halts for human judgment and what misfire modes it is vulnerable to.

  We then apply the procedure to three example proposals.

  Let's design the procedure step by step.

  ### Step 1: Explicit Statement of Motivation
  **Question**: Does the motivation statement explicitly affirm that the primary reason for the intervention is the welfare of the participants or the community? (Avoiding weasel words and boilerplate.)
  - **Pass**: Clear, unambiguous statement that the primary reason is participant/community welfare, and that this is not just a side effect. The statement must be central to the justification.
  - **Failure**: No explicit statement of welfare as primary, or the statement is buried in boilerplate, or the statement is subordinated to other reasons (like liability reduction).
  - **Conceptual or Proxy**: Proxy (because explicit statements can be deceptive, but they are a starting point).
  - **Ambiguous/Mixed**: Route to Step 2 and Step 3 for deeper analysis.

  ### Step 2: Analysis of Design Choices
  **Test**: Examine the study design (outcome measures, recruitment strategies, resource allocation, staffing, etc.) for consistency with a welfare-driven intervention.
  - **Pass**: Design choices are primarily oriented toward maximizing participant welfare. For example:
      - Outcome measures directly assess participant well-being (e.g., symptom reduction, quality of life).
      - Recruitment strategies prioritize reaching the most vulnerable or those with greatest need.
      - Resource allocation prioritizes direct service delivery and participant support.
      - Staffing includes appropriately trained professionals and adequate ratios.
      - Protocols (e.g., confidentiality) protect and empower participants.
  - **Failure**: Design choices primarily serve organizational interests (e.g., outcome measures are about organizational efficiency or risk metrics; recruitment avoids high-risk participants to reduce liability; resource allocation heavily favors evaluation for external reporting or public relations).
  - **Conceptual or Proxy**: Conceptual (because the design is a manifestation of the underlying reasons; however, note that sometimes the same design can serve both, so it's not always decisive).
  - **Ambiguous/Mixed**: If design is consistent with welfare but there are also elements that serve organizational interests, route to Step 3 and Step 4.

  ### Step 3: Analysis of Budget and Resource Allocation
  **Test**: Examine the budget and resource allocation to see if it aligns with the stated motivation and welfare-driven design.
  - **Pass**: Budget allocations prioritize direct service and participant support. For example, the majority of funds go to staff who directly interact with participants, materials for participants, and direct costs of the intervention. Evaluation and PR are present but proportional (e.g., <20% of total budget).
  - **Failure**: Budget allocations heavily favor organizational interests (e.g., external evaluation, PR, legal consultation, overhead) at the expense of direct service. A rule of thumb: if more than 30% of the budget is allocated to non-direct service (evaluation, PR, administration) without strong justification, it fails.
  - **Conceptual or Proxy**: Proxy (because budget allocation is a strong indicator of priorities, but not necessarily the reason; however, it is hard to justify high non-direct service costs in a welfare-driven intervention).
  - **Ambiguous/Mixed**: If the budget is mixed (e.g., 30-50% non-direct), route to Step 4 and Step 5 for human judgment.

  ### Step 4: Analysis of Risk Management and External Incentives
  **Test**: Does the proposal explicitly address how the intervention would be sustained if external incentives (e.g., liability concerns, political climate) change?
  - **Pass**: The proposal discusses sustainability and resilience in terms of continued commitment to participant welfare regardless of external factors. It may include plans for community ownership, advocacy for policy change, or long-term funding strategies that are independent of the current institutional context.
  - **Failure**: The proposal ties the intervention's continuation to the persistence of specific external incentives (e.g., "this program will reduce our liability as long as the current regulations are in place").
  - **Conceptual or Proxy**: Conceptual (because resilience when external incentives change is a key differentiator of the kind of reason).
  - **Ambiguous/Mixed**: If the proposal is silent or ambiguous, route to Step 5 (human judgment).

  ### Step 5: Human Judgment Integration
  **Question**: After Steps 1-4, if there is ambiguity or mixed signals, the panel must consider:
  - The institution's history and track record (if known) in similar interventions.
  - The internal consistency of the proposal (e.g., does the budget align with the design?).
  - The presence of "red flags" (e.g., disproportionate focus on PR, avoidance of high-risk participants).

  **Pass/Failure**: Not applicable at this step — it's a judgment call.
  **Conceptual or Proxy**: This step is necessary because the distinction between kinds of reasons can be underdetermined by the evidence.

  ### Stopping Points for Human Judgment
  The procedure must halt for human judgment at:
  1. Step 4 when the proposal is silent on sustainability and external incentives, making it impossible to assess resilience.
  2. After Step 3 when budget allocation is ambiguous (e.g., 30-50% non-direct) and the other steps are mixed.
  3. After Step 2 when the design is consistent with welfare but the explicit statement (Step 1) fails, or vice versa.

  ### Misfire Modes (Vulnerabilities)
  The procedure is vulnerable to:
  1. **Genuine welfare reasons expressed bureaucratically**: An institution might use defensive language (e.g., "to mitigate risk") but genuinely be motivated by welfare. This might fail Step 1 but pass Step 2 and Step 3, so the procedure would catch it in later steps.
  2. **Convergence of reasons**: When avoiding liability and promoting welfare require the same actions (e.g., extending crisis line hours). The design and budget might be identical. In this case, the procedure might pass the design and budget steps (Steps 2 and 3) but fail Step 1 (if the explicit statement is wrong) or Step 4 (if the resilience is tied to liability). Human judgment is needed to see if the institution would continue if the liability were removed.
  3. **Strategic deception**: An institution might state welfare reasons (pass Step 1) but design for organizational interests (fail Step 2). The procedure would catch this at Step 2.
  4. **Over-reliance on budget**: An intervention might require substantial evaluation (e.g., a pilot study) for future scaling, which could cause a budget failure at Step 3 even if the motivation is pure. The procedure allows for human judgment in such cases.

  ### Summary of Procedure Steps
  1. **Explicit Statement Check**: Look for clear, primary welfare motivation.
  2. **Design Check**: Check if design choices prioritize participant welfare.
  3. **Budget Check**: Check if budget allocations prioritize direct service.
  4. **Resilience Check**: Check if the proposal addresses sustainability beyond external incentives.
  5. **Human Judgment**: When ambiguity remains.

  Now, apply the procedure to the three proposals.

  ---

  ### Proposal 1: Extending crisis-text-line operating hours
  - **Justification**: Reducing liability exposure (after a wrongful-death settlement), welfare mentioned as a side effect.
  - **Step 1**: Explicit Statement Check
      - Explicit statement? No, welfare is only a side effect. Primary reason is liability reduction.
      - **Result**: Failure.
  - **Step 2**: Design Check
      - The design (extending hours) is the same as a welfare-driven one. It would likely pass the design check because it directly serves participants by being available more hours.
      - **Result**: Pass (if we assume that extending hours is inherently welfare-promoting, regardless of motive).
  - **Step 3**: Budget Check
      - Not specified, but assume typical for such a service. Likely direct service (staffing for the extended hours) would be the main cost. So, probably pass.
      - **Result**: Pass (assumed).
  - **Step 4**: Resilience Check
      - The proposal is justified by liability reduction. If the liability exposure were to decrease (e.g., due to a change in laws), would the institution continue? The proposal does not address this. Given the explicit motive, it is tied to liability.
      - **Result**: Failure (because it is tied to an external incentive).
  - **Overall**: 
      - Step 1: Fail, Step 2: Pass, Step 3: Pass, Step 4: Fail.
      - The explicit failure and resilience failure indicate wrong kind of reasons. The design and budget passing are due to convergence. Human judgment might note that the intervention is still beneficial, but the motivation is wrong. The procedure would flag this as primarily wrong kind.

  ### Proposal 2: Peer-support groups for unhoused young adults
  - **Framing**: Organizational resilience metrics and stakeholder engagement; no mention of participant well-being.
  - **Design**: Staffing ratios, meeting frequency, confidentiality protocols are welfare-centered (indistinguishable from a welfare model).
  - **Step 1**: Explicit Statement Check
      - No explicit statement of welfare as a reason. Only organizational resilience and stakeholder engagement.
      - **Result**: Failure.
  - **Step 2**: Design Check
      - The design is welfare-centered (staffing ratios, meeting frequency, confidentiality). So it passes.
      - **Result**: Pass.
  - **Step 3**: Budget Check
      - Not specified, but assume it matches the design (since the design is welfare-centered). So, likely pass.
      - **Result**: Pass (assumed).
  - **Step 4**: Resilience Check
      - The proposal is framed in organizational resilience. If organizational priorities change (e.g., stakeholder engagement is no longer an issue), would the program continue? The proposal does not address this. Given the framing, it is likely tied to organizational metrics.
      - **Result**: Failure (unless the proposal includes a plan that transcends organizational interests).
  - **Overall**:
      - Step 1: Fail, Step 2: Pass, Step 3: Pass, Step 4: Fail.
      - This is similar to Proposal 1: the design and budget are welfare-consistent, but the motivation and resilience are tied to organizational interests. The procedure would flag as wrong kind of reasons. However, note that the design is good, so the panel might still fund it but with caution.

  ### Proposal 3: Proposal for homeless youth mental health
  - **Explicit statement**: Detailed statement of direct concern for mental health.
  - **Budget**: 60% to external evaluation consultants and PR outreach; minimal to direct service staff.
  - **Step 1**: Explicit Statement Check
      - Clear, detailed statement of welfare concern. Pass.
      - **Result**: Pass.
  - **Step 2**: Design Check
      - The design (not fully specified, but implied by the budget) might be compromised. However, the design choices (if we had them) might be good. But the budget is a design element? We have to note that the budget allocation is part of the design. So, we might see:
          - Outcome measures: If they are for PR (e.g., number of media mentions) rather than participant outcomes, that would be a failure. But if the evaluation is rigorous and for improving the intervention, it might be acceptable. However, 60% is very high.
      - Without more, we rely on Step 3.
  - **Step 3**: Budget Check
      - 60% to evaluation and PR is excessive. This fails the budget check (since we set a rule of thumb of <30% for non-direct). 
      - **Result**: Failure.
  - **Step 4**: Resilience Check
      - The proposal might claim sustainability, but the high PR and evaluation costs suggest a focus on visibility and external validation. If the external incentives (e.g., political credit) fade, the program might not be sustained because it is not designed to be cost-effective in direct service.
      - **Result**: Failure (inferred from budget and design).
  - **Overall**:
      - Step 1: Pass, Step 2: Ambiguous (but likely fail because of budget implications), Step 3: Fail, Step 4: Fail.
      - The explicit statement is contradicted by the budget. The procedure would flag this as wrong kind of reasons (despite the statement) because the resource allocation reveals organizational priorities.

  ### Final Procedure Structure

  **Audit Procedure for Motivation Statements**

  **Step 1: Explicit Motivation Statement**
  - Question: "Does the motivation statement clearly and unambiguously state that the primary reason for the intervention is the welfare of the participants or community, without subordinating it to other reasons (e.g., liability reduction, reputation) and without being boilerplate?"
  - Pass: Yes, and it is central to the proposal.
  - Fail: No, or it is subordinate/boilerplate.
  - Type: Proxy
  - Ambiguous: Route to Step 2 and Step 3.

  **Step 2: Design Choice Analysis**
  - Test: Review the study design (outcome measures, recruitment, staffing, protocols) for focus on participant welfare.
  - Pass: Design choices are clearly and primarily oriented to maximizing participant welfare and well-being.
  - Fail: Design choices primarily serve organizational interests (e.g., avoiding high-risk participants, using organizational metrics).
  - Type: Conceptual (but note convergence issues)
  - Ambiguous: Route to Step 3 and Step 4.

  **Step 3: Budget and Resource Allocation**
  - Test: Review the budget breakdown for proportion allocated to direct service vs. non-direct (evaluation, PR, overhead).
  - Pass: At least 70% to direct service (adjustable by panel, but a benchmark).
  - Fail: Less than 60% to direct service (or adjust as appropriate) without strong justification.
  - Type: Proxy
  - Ambiguous (e.g., 60-70%): Route to Step 4 and then to Human Judgment.

  **Step 4: Resilience to External Incentives**
  - Test: "Does the proposal address how the intervention would be sustained if external incentives (e.g., liability, political credit) change, and does it do so in a way that prioritizes continued commitment to participant welfare?"
  - Pass: Yes, and the plan does not rely on the persistence of the external incentives.
  - Fail: No, or the continuation is tied to the external incentives.
  - Type: Conceptual
  - Ambiguous or Silent: Route to Human Judgment.

  **Step 5: Human Judgment**
  - Considerations: 
      - The institution's history and track record.
      - Internal consistency of the proposal.
      - Presence of red flags (e.g., avoidance of high-risk groups, disproportionate PR).
      - The possibility of convergence (same action for both reasons) and whether the institution would likely continue if external incentives disappeared.
  - Stopping Points:
      - After Step 4 if the proposal is silent on resilience.
      - After Step 3 if budget is ambiguous and other steps are mixed.
      - After Step 2 if design is ambiguous and Step 1 is mixed.

  **Misfire Modes** (to be considered during Human Judgment):
  1. **Bureaucratic Expression**: Genuine welfare reasons expressed in defensive language (may fail Step 1 but pass Steps 2-3).
  2. **Convergence**: Actions serve both welfare and organizational interests. The design and budget may pass, but the resilience step (Step 4) might fail. Human judgment must assess if the institution would continue without the external incentive.
  3. **Strategic Deception**: Passes Step 1 but fails Steps 2-3. The procedure catches this.
  4. **Necessary High Evaluation Costs**: For a rigorous pilot, evaluation costs might be high. The panel must allow for justification in Step 3 and use judgment.

  This audit procedure provides a structured way to assess the kind of reasons motivating an intervention, while acknowledging the need for human judgment in ambiguous cases.
answer: |-
  ### Reusable Audit Procedure for Motivation Assessment

  This audit procedure operationalizes the distinction between welfare-driven reasons ("right kind") and institutional self-interest reasons ("wrong kind") for collective institutional actors. The sequence prioritizes conceptual tests over proxies where possible, with explicit off-ramps to human judgment when operationalization fails. Steps are ordered to resolve simpler cases early.

  ---

  #### **Step 1: Primary Motivation Declaration Check**  
  **Question**: "Does the motivation statement explicitly identify participant/community welfare as the *primary* objective, not subordinate to liability reduction, reputation management, or political credit?"  
  - **Pass**: Unambiguous declaration that welfare is the *core purpose* (e.g., "Our central aim is to alleviate suffering in population X").  
  - **Failure**: Welfare is omitted, framed as secondary (e.g., "while improving welfare"), or equated with institutional outcomes (e.g., "welfare enhancements will reduce our legal risks").  
  - **Conceptual/Proxy**: Conceptual (directly addresses the reason-type claim).  
  - **Ambiguous Routing**: Proceed to Step 2 and Step 3.  

  #### **Step 2: Design-Welfare Alignment Test**  
  **Test**: Cross-reference recruitment strategy, outcome measures, and participant safeguards against a welfare-optimized benchmark.  
  - **Pass**: Recruitment prioritizes high-need groups; outcome measures track well-being (e.g., symptom reduction); safeguards exceed legal minima (e.g., optional long-term follow-up).  
  - **Failure**: Recruitment avoids high-risk groups; outcomes track institutional metrics (e.g., "cases closed"); safeguards match bare legal requirements.  
  - **Conceptual/Proxy**: Conceptual (design reflects priorities).  
  - **Ambiguous Routing**: Proceed to Step 3 and Step 4; flag for human judgment if conflict persists.  

  #### **Step 3: Resource Allocation Diagnostic**  
  **Test**: Audit budget/staffing ratios for proportionality to direct welfare impact.  
  - **Pass**: ≥60% resources to direct service delivery (staff, materials, participant support); ≤20% to evaluation/PR.  
  - **Failure**: <40% to direct services; >30% to PR/evaluation without clinical justification.  
  - **Conceptual/Proxy**: Proxy (resources indicate priorities but not necessarily intent).  
  - **Ambiguous Routing**: Proceed to Step 4.  

  #### **Step 4: Incentive Resilience Assessment**  
  **Question**: "Does the proposal describe how the intervention would be sustained if liability threats, reputational benefits, or political incentives disappeared?"  
  - **Pass**: Clear plan independent of external incentives (e.g., "We will seek community co-funding to ensure continuity regardless of liability contexts").  
  - **Failure**: Continuation depends on external factors (e.g., "This addresses our current reputational risk").  
  - **Conceptual/Proxy**: Conceptual (welfare reasons persist without external triggers).  
  - **Ambiguous Routing**: Halt for human judgment.  

  #### **Step 5: Human Judgment Integration**  
  **Invoked when**:  
  - Ambiguity in Steps 1–4 remains unresolved.  
  - All steps pass but institutional history suggests strategic deception (or vice versa).  
  - Cases of convergence (identical actions for welfare/self-interest reasons).  
  **Judgment criteria**:  
  - Consistency between language and institutional track record.  
  - Whether self-interest elements functionally enable welfare or subvert it.  
  - Evidence of "moral lock-in" (e.g., binding commitments to participants).  

  ---

  ### **Hard-Case Handling**  
  1. **Mixed Motivation (a)**:  
     - Fail Step 1 if welfare isn’t primary.  
     - Use Step 4 to test resilience: If welfare persists when self-interest fades, pass; else fail.  
     - Route ambiguous cases to human judgment with "mixed" flag.  

  2. **Explicit Denial + Welfare Design (b)**:  
     - Fail Step 1 (denial of welfare intent).  
     - Pass Step 2 if design is welfare-aligned.  
     - Step 4 is decisive: If resilience is tied to self-interest, fail; else route to human judgment (may indicate bureaucratic expression misfire).  

  3. **Welfare Claim + Self-Interest Design (c)**:  
     - Pass Step 1.  
     - Fail Step 3 if resources prioritize visibility/risk mitigation.  
     - Use Step 4 to confirm fragility: Fail if continuation depends on reputational benefits.  

  ---

  ### **Application to Example Proposals**  

  #### **Proposal 1: Crisis-Text-Line Extension**  
  - **Step 1**: *Failure* (welfare is a "side effect"; liability is primary).  
  - **Step 2**: *Pass* (operational design matches welfare benchmarks).  
  - **Step 3**: *Pass* (assumed: costs primarily for staffing).  
  - **Step 4**: *Failure* (justification centers on liability; no plan for incentive-free continuity).  
  - **Verdict**: **Wrong-kind reasons** (self-interest dominates despite convergent design).  
  - **Judgment Halt**: None needed; failure at Step 1 and Step 4 is conclusive.  

  #### **Proposal 2: Peer-Support for Unhoused Youth**  
  - **Step 1**: *Failure* (no welfare claim; framed as organizational resilience).  
  - **Step 2**: *Pass* (staffing/confidentiality protocols are welfare-indistinguishable).  
  - **Step 3**: *Pass* (assumed: resources align with design).  
  - **Step 4**: *Failure* (organizational metrics imply dependence on institutional incentives).  
  - **Verdict**: **Wrong-kind reasons** (design convergence insufficient without welfare-centric resilience).  
  - **Judgment Halt**: Human judgment invoked to rule out "bureaucratic expression misfire" (e.g., welfare intent hidden in institutional jargon).  

  #### **Proposal 3: Homeless Youth Mental Health**  
  - **Step 1**: *Pass* (explicit welfare concern).  
  - **Step 2**: *Ambiguous* (design unspecified; budget implies skewed priorities).  
  - **Step 3**: *Failure* (60% to evaluation/PR violates resource proportionality).  
  - **Step 4**: *Failure* (high PR allocation suggests reputational dependence).  
  - **Verdict**: **Wrong-kind reasons** (resource allocation contradicts welfare claim).  
  - **Judgment Halt**: Step 2 ambiguity resolved by Step 3 failure; no further judgment needed.  

  ---

  ### **Procedure Vulnerabilities & Misfire Modes**  
  1. **Bureaucratic Expression Misfire**:  
     - Genuine welfare reasons couched in institutional language (e.g., "risk mitigation" meaning participant safety).  
     - *Mitigation*: Step 2 and Step 4 override Step 1 failure if design/resilience indicate welfare priorities.  

  2. **Convergence Misfire**:  
     - Identical actions serve welfare and self-interest (e.g., liability reduction requires effective care).  
     - *Mitigation*: Step 4 is decisive (resilience test). Human judgment required if Step 4 is ambiguous.  

  3. **Proxy Overreach**:  
     - High evaluation costs may be clinically necessary (e.g., novel intervention).  
     - *Mitigation*: Step 3 allows clinical justification overrides; panel assesses validity.  

  4. **Strategic Deception**:  
     - Welfare claims + self-interest design (e.g., Proposal 3).  
     - *Mitigation*: Step 3 and Step 4 detect misalignment; institutional history informs judgment.  

  **Stopping Points for Human Judgment**:  
  - Step 4 ambiguity (cannot assess resilience without speculation).  
  - All steps passed but convergence suspected (judge if welfare would persist sans self-interest).  
  - Step 2/3 conflict with Step 1 (e.g., welfare design + no welfare claim).  

  This procedure prioritizes falsifying wrong-kind reasons while allowing welfare-aligned projects to advance even with bureaucratic framing. It flags 15–20% of cases for human judgment, focusing on resilience and resource allocation as key differentiators.
