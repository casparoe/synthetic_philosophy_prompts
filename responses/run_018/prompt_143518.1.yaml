prompt: |-
  hey so my roommate got a concussion last month and now he's obsessed with Dennett's brain-transplant puzzle where he asks where am I — the one with the brain copy and the original body. we keep hitting this pattern. usually people say you're the copy if your memories and personality stay in tact, right? but then if you tell them the copy is missing one synapse or has a tiny glitch, they suddenly say nope, then you're the original body because it's not exactly the same brain. it's like they use one standard for normal cases and a totally different, stricter standard the second there's a micro-gap. i've seen it in arguements about uploads, teleportters, even split-brain surgery. is there an established name for this sliding-criterian move? how is it different from the fission problem or from vagueness about identity edges? if there's no name, coin one and say exactly where it applies and where it stops. answer in JSON with fields: nearest_established_concept, how_described_phenomenon_differs, proposed_name_and_definition, boundary_cases_or_edge_conditions, bottom_line_assessment.
reasoning: |-
  We are dealing with a phenomenon where people apply different standards for identity in thought experiments involving brain transplants, copies, or similar scenarios. 

  The typical pattern is:
  1. In a "clean" case (perfect copy), people tend to say that the person goes with the brain (or the copy, if it's a copy of the brain in a new body).
  2. But when a minor imperfection (like a missing synapse or a glitch) is introduced, they switch to saying the person is the original (because the copy isn't exact).

  This seems to be a shifting of criteria: one standard (continuity of memories/personality) for the perfect case, and a stricter standard (exact physical or functional identity) when there's an imperfection.

  Now, let's break down the questions:

  - **Nearest established concept**: The phenomenon resembles the "sorites paradox" (or the paradox of the heap) in that it involves vagueness at the boundaries of identity. It also relates to the "fission problem" in personal identity, where an entity splits and it's unclear which resulting entity is the original. However, the shifting criterion aspect is specific.

    Another related concept is the "no branching" rule in Derek Parfit's account of personal identity, which says that if there is branching (like two copies), then the original does not survive in either, but rather we get two new persons. But note that in the described phenomenon, without branching (just one copy) but with imperfection, people revert to the original body.

  - **How the described phenomenon differs**: 
    - The sorites paradox typically deals with gradual changes (removing one grain at a time) and the vagueness of when a heap becomes a non-heap. Here, the shift is abrupt in reasoning when a tiny imperfection is introduced, even though the change is minimal. It's a shift in the criterion used, not necessarily a gradual change.
    - The fission problem usually involves two equally good candidates, leading to the question of whether identity can be preserved in fission. In this case, we are comparing a perfect copy scenario (where the copy is the person) versus an imperfect copy (where the original body is the person). The shift is in the threshold of what counts as sufficient for identity.

  - **Proposed name and definition**: 
    Name: **Criteria Shift Fallacy in Identity (CSFI)** or **Threshold Flip-Flop in Personal Identity (TFFPI)**. 
    Definition: The fallacy of inconsistently applying criteria for personal identity in thought experiments, by using a functional criterion (e.g., psychological continuity) in cases of perfect duplication but reverting to a physical criterion (e.g., strict numerical identity or exact physical continuity) when any imperfection is introduced, without providing a principled reason for the shift.

  - **Boundary cases or edge conditions**:
    - The phenomenon is most evident when the imperfection is minimal (e.g., one synapse, a single memory glitch) and does not affect the overall psychological continuity. If the imperfection is substantial (e.g., loss of a significant portion of memory or personality), then the shift might be justified and the fallacy does not apply.
    - It also occurs in scenarios without branching (only one copy) but might also appear in branching scenarios when comparing the original to the copy.

  - **Bottom-line assessment**:
    This shifting of criteria is a common cognitive bias in thought experiments about personal identity. It reveals an underlying discomfort with the idea that identity might be a matter of degree or that it could be vague. The bias allows the thinker to avoid the counterintuitive implications of psychological continuity theories (like the possibility of two people both being you after fission) by reverting to a physical criterion when pushed. However, it is inconsistent and lacks a principled basis. In philosophical terms, it might be seen as an ad hoc move to preserve the intuition that identity must be unique and determinate.

