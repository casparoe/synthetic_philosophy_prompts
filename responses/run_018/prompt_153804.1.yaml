prompt: |-
  I've been trying to figure out what a bayesian account of old evidence actually has to deliver, and I want the full spec before I read any more papers. Write me the desiderata list: what must any adequate theory of old-evidence updating get right?

  Specifically it needs to cover the standard glymour-style case where you learn something you already knew and conditionalization does nothing, the 'forgotten prior' case where your beleif state was formed with E in the background but you lost track, and this other situation I'm going to call stale archive — a dataset collected under a rejected model gets rediscovered and needs integrating with current beliefs. For each requirement say why it's there, mark non-negotiable vs camp preference, and tell me if there's any pair that can't both be satisfied.

  Also: what distinction can't it collapse? Like between genuinely old and just apparently old? Between prior revision and beleif revision? And which one requirement kills the most standard fixes?

  Then briefly score the naive conditionalization answer, the prior-revision story, and a framework-relative approach against the list. Don't need a bibliography, I just want the logic mapped out. If some subset of these desiderata is jointly impossible given basic probability axioms, say so — that's the part I actually care about.
reasoning: |-
  Okay, the user is asking about Bayesian accounts of old evidence. They want a comprehensive list of desiderata that any adequate theory must satisfy. Specifically, they mention three scenarios: the standard Glymour case (learning something already known), the forgotten prior case (evidence was used but memory lost), and the stale archive case (data collected under an old model is rediscovered). They want each requirement explained, marked as non-negotiable or preference, and whether any pairs conflict. Also, they ask about distinctions that shouldn't be collapsed, and which requirement is most problematic for standard solutions. Finally, they want evaluations of naive conditionalization, prior revision, and framework-relative approaches.

  First, I need to recall the core problem: conditionalization doesn't change beliefs when updating on old evidence, but intuitively, it should sometimes. The user is likely struggling with how to handle evidence that's temporally old but epistemically new in some sense. Their mention of Glymour indicates they're familiar with the classic problem, but the forgotten prior and stale archive cases suggest they want a more nuanced view.

  Breaking down each scenario:
  1. **Glymour-style**: Already know E, so P(E)=1. Conditionalizing on E does nothing. But if E supports a theory, how does that get captured? This seems non-negotiable because it's the original problem.
     
  2. **Forgotten prior**: E was used to form the prior, but the agent forgot. Now relearning E shouldn't double-count it. Non-negotiable because ignoring this would allow incorrect belief updates.

  3. **Stale archive**: Data collected under an old model (now rejected) is rediscovered. The challenge is integrating it without assuming the old model. This might be a camp preference since it's less discussed but important for real-world science.

  Next, the distinctions to maintain:
  - Genuinely old vs. apparently old: If the agent thinks E is old but it's actually new, updating should differ. Collapsing this could lead to incorrect updates.
  - Prior revision vs. belief revision: Changing priors based on meta-beliefs vs. standard updating. Blurring these might conflate different epistemic processes.

  The user also wants to know which requirement kills most standard fixes. Probably the forgotten prior case because solutions like setting P(E)<1 for updating can cause double-counting if not handled correctly.

  Evaluating the approaches:
  - **Naive conditionalization**: Fails Glymour (does nothing) and forgotten prior (double-counts). Only handles stale archive if the model is readjusted, but it's messy.
  - **Prior revision**: Adjusts the prior to exclude E, then conditionalizes. Solves Glymour and stale archive but struggles with forgotten prior because determining the original prior without E is tricky.
  - **Framework-relative**: Treats probabilities as relative to an epistemic state. Solves Glymour and stale archive but might handle forgotten prior by context-switching. However, the requirement to track state changes could be cumbersome.

  Now, conflicts: The forgotten prior and stale archive might conflict. For forgotten prior, you need to avoid double-counting, which requires knowing E was used. Stale archive requires integrating E without prior contamination. But if the stale archive was partially used, it might overlap with forgotten prior. However, if stale archive data was never used, it's distinct. So perhaps no strict conflict, but implementation needs care.

  Most problematic desideratum: Forgotten prior because it requires knowledge of historical belief states, which might not be accessible.

  Also, possible joint impossibility? If requiring that in Glymour, E increases support for T without changing the prior, but also avoiding double-counting in forgotten prior, this might clash. However, Garber's approach (logical learning) shows a way, so maybe not impossible but needs careful handling.

  The user's deeper need: They want to know if a consistent Bayesian framework can handle all cases or if there's an inherent limitation. They might be seeking whether to invest time in existing literature or if the problems are insurmountable. Highlighting conflicts or near-impossibilities is key.
answer: |-
  Here's the comprehensive desiderata list for Bayesian old-evidence updating, structured for your requirements. The core tension: **Standard conditionalization fails when \(P(E) = 1\), but old evidence *should* sometimes confirm theories.** Solutions must navigate this while avoiding double-counting or logical incoherence.

  ---

  ### **Desiderata for Old Evidence Updating**

  1. **Glymour-Style Case (Non-negotiable)**  
     *What it must handle:* Learning evidence \(E\) already known with certainty (\(P(E) = 1\)) *should* increase rational credence in theory \(T\) if \(E\) supports \(T\).  
     *Why:* The original problem. Conditionalization does nothing here (\(P(T|E) = P(T)\) if \(P(E) = 1\)), yet intuitively \(E\) *is* evidence for \(T\) (e.g., Mercury's perihelion for GR).  
     *Conflict potential:* If solved by artificially lowering \(P(E)\), must avoid violating probability axioms.

  2. **Forgotten Prior Case (Non-negotiable)**  
     *What it must handle:* \(E\) was used to form the current prior (e.g., \(P_0\) incorporated \(E\)), but the agent forgot this. "Relearning" \(E\) must *not* boost credence in \(T\) a second time.  
     *Why:* Prevents double-counting evidence. Failing this inflates confidence unrealistically (e.g., relearning a forgotten experiment).  
     *Distinction to preserve:* Genuinely novel vs. forgotten old evidence.

  3. **Stale Archive Case (Camp Preference)**  
     *What it must handle:* Data \(E\) collected under a *rejected* model \(M_0\) (e.g., flawed methodology) is rediscovered. Updating current beliefs with \(E\) must integrate it *without* assuming \(M_0\) is true.  
     *Why:* Real-world science (e.g., reanalyzing old data with new models). Distinguishes evidence from its historical interpretation.  
     *Distinction to preserve:* Belief revision (updating on \(E\)) vs. *reinterpretation* (discarding \(M_0\)'s framing).

  4. **Prior-Belief Revision Distinction (Non-negotiable)**  
     *What it must preserve:* Distinction between revising *beliefs about the world* (via standard updating) and revising *meta-beliefs* (e.g., "I shouldn't have trusted \(M_0\)").  
     *Why:* Collapsing these conflates object-level and epistemic reasoning. Critical for Stale Archive.

  5. **Genuine vs. Apparent Old Evidence (Non-negotiable)**  
     *What it must preserve:* Distinction between evidence that *was* epistemically assimilated (even if forgotten) vs. evidence that *seems* old but was never properly integrated.  
     *Why:* Agents can misremember; solutions must not treat "apparently old" as "genuinely old" (risks double-counting).

  ---

  ### **Conflict Analysis**
  - **Forgotten Prior vs. Glymour:** Most acute tension. Glymour needs \(E\) to *increase* \(P(T)\); Forgotten Prior forbids this if \(E\) was already used.  
    - *Can they coexist?* Only if the theory tracks *epistemic history* (e.g., whether \(E\) was legitimated).  
  - **Stale Archive vs. Forgotten Prior:** Stale Archive assumes \(E\) was *not* properly assimilated (rejected model), while Forgotten Prior assumes it *was*. No direct conflict if distinction is maintained.  
  - **Joint Impossibility?** No outright violation of probability axioms, but **simultaneously satisfying Glymour and Forgotten Prior requires extra-Bayesian structure** (e.g., memory tags, counterfactual priors). Pure probabilism is insufficient.

  ---

  ### **The Killer Desideratum**  
  **Forgotten Prior** sinks the most fixes. Solutions that lower \(P(E)\) to force confirmation in Glymour (e.g., set \(P_\text{new}(E) < 1\)) often *cause* double-counting in Forgotten Prior. If you can't tell whether \(E\) was used, you can't block illicit boosts.

  ---

  ### **Approach Evaluation Against Desiderata**

  | **Approach**               | Glymour | Forgotten Prior | Stale Archive | Prior-Belief Distinction | Genuine/Apparent Distinction |  
  |----------------------------|---------|------------------|---------------|--------------------------|------------------------------|  
  | **Naive Conditionalization** | ✗ Fails (no change) | ✗ Fails (double-counts) | △ Partial (if \(E\) revalued) | ✓ Preserves | ✗ Collapses |  
  | **Prior Revision** (e.g., "counterfactual prior" \(P_{-E}\)) | ✓ Solves (if \(P_{-E}(T|E) > P_{-E}(T)\)) | △ Mixed (depends on reconstructing \(P_{-E}\)) | ✓ Solves | △ Blurs (priors are revised meta-rationally) | ✗ Requires perfect memory |  
  | **Framework-Relative** (e.g., probability relative to epistemic state \(S\)) | ✓ Solves (update \(S\) to \(S'\) where \(P_{S'}(E) < 1\)) | ✓ Solves (if \(S\) remembers usage) | ✓ Solves | ✓ Preserves | ✓ Preserves |  

  - **Naive Conditionalization:** Fails core cases. Only works if \(E\) wasn't *fully* assimilated (e.g., Stale Archive where \(E\) was ignored).  
  - **Prior Revision:** Solves Glymour and Stale Archive by imagining a prior without \(E\). Struggles with **Forgotten Prior**: reconstructing \(P_{-E}\) requires knowing *how* \(E\) was used, which is forgotten. Risk of ad hoc priors.  
  - **Framework-Relative (e.g., Garber/Jeffrey):** Treats learning as shifting to a new framework where \(E\) is uncertain. Scores best but **requires tracking epistemic states** (non-trivial). May seem "cheating" by avoiding traditional updating.  

  ---

  ### **Key Takeaways**  
  - **No approach nails all desiderata perfectly.** Framework-relative comes closest but demands richer semantics.  
  - **Forgotten Prior is the toughest:** It necessitates **epistemic memory** (even if fallible). Without this, double-counting is inevitable.  
  - **Stale Archive is tractable** if separated from prior construction (e.g., by reinterpreting \(E\) under current models).  
  - **The distinction between *belief revision* and *prior reassessment* is crucial.** Collapsing this (as Prior Revision risks) conflates objectivity with hindsight.  
  - **Joint satisfaction is possible** with **supplemented Bayesianism** (e.g., adding memory states or counterfactual reasoning). Pure conditionalization is insufficient—you need temporal/historical indexing.  

  If you pursue one angle: **Focus on Forgotten Prior**. It exposes whether a solution truly handles *epistemic labor* or just retcons beliefs.
