answer: |-
  Based on your close reading of the Scholium and focus on Newton's core arguments, here's a conceptual breakdown addressing your three precise points:

  1.  **Causal Agent vs. Ontological Ground:**
      *   Newton's text **explicitly rejects** the idea that absolute space acts as a causal agent. He states absolute space "does not act upon bodies, nor do bodies act upon it" and crucially, that it has "no parts or marks by which it could be observed." The concavity and tension are caused by *forces internal to the system*: the water's endeavor to recede from the axis of rotation (centrifugal force) and the cord's resistance to that endeavor (tension).
      *   Absolute space serves **solely as the ontological ground and reference frame** for defining "true motion." The argument is that the observable effects (concavity, tension) are *consequences* of true rotational acceleration. Since true motion cannot be defined relative to the *immediately surrounding* bodies (the bucket walls or the other globe), and since these effects occur even when *no other observable bodies exist* (the globes case), Newton infers that true motion must be motion relative to *something* that isn't another body. That "something" is absolute space. Its role is not to cause the effects but to be the necessary referent that makes the statement "this body is truly rotating" meaningful and true. The effects *reveal* the true motion *with respect to* absolute space; they are not *caused by* absolute space. Newton requires space to be a real entity to ground the *fact* of true motion, not to be an efficient cause.

  2.  **The Globes Case vs. Distant Matter:**
      *   The bucket experiment *alone* is vulnerable to the relationist counter: perhaps the water's concavity is caused by rotation relative to the *fixed stars* or a distant cosmic matter distribution, not an absolute space. The bucket walls just happen to be nearby.
      *   The **globes case is specifically designed to eliminate this possibility**. By placing the system in an *otherwise completely empty universe*, Newton removes *any* possible material reference frame – local *or* distant. There are no stars, no hidden plenum, *nothing* material except the two globes and the cord.
      *   The **tension persists**. Relationism, which defines motion purely as change of relative position *among bodies*, cannot explain the tension in this scenario. There are no other bodies relative to which the globes could be said to be rotating *in a way that produces tension*. If motion were purely relational, the globes could only be rotating relative to *each other*. But mutual rotation around a center point wouldn't inherently *require* tension in the cord connecting them – they could simply be orbiting each other inertially. The tension indicates an *endeavor to recede* from the axis, a centrifugal effect characteristic of true rotational acceleration *against inertia*. Newton argues this inertia must be understood as resistance to acceleration relative to absolute space itself, since there is *no other material reference frame available* to define the acceleration causing the tension. The globes case forces the relationist to either deny the possibility of such an isolated rotating system (which Newton finds absurd) or accept that the tension reveals motion relative to something non-material – absolute space.

  3.  **Compatibility with Structural Relationism:**
      *   A contemporary structural relationist **could consistently accept Newton's observational claims (concavity, tension) while rejecting substantivalism**, but they must reinterpret the *ground* of the metric structure.
      *   **Accepting Observations:** They agree the bucket water curves and the cord tenses due to true rotational acceleration. They accept these are not artifacts of motion relative to immediately adjacent bodies.
      *   **Rejecting Substantivalism:** They deny these effects require motion relative to an independent, substantial "container" space (Newton's absolute space as a substance).
      *   **Structuralist Interpretation:** They posit that spacetime possesses an **absolute geometric/metric structure** (e.g., affine structure defining inertia, or a metric tensor defining intervals). This structure is real and objective, but it is not an independent substance; it is a fundamental aspect of physical reality, perhaps ontologically primitive or arising from relations between events/fields. True motion (acceleration) is deviation from inertial paths defined by this structure.
      *   **Consistency:** The concavity and tension are manifestations of acceleration relative to this inertio-gravitational structure. The globes case shows this structure persists even in the absence of *matter*, as the structure defines what inertial motion *would be* and thus what constitutes acceleration causing tension. Newton would likely see this structure *as* absolute space (or spacetime) under a different name. The key difference is ontological: the structural relationist avoids reifying space as an independent substance existing prior to or separable from the physical fields/relations that instantiate the structure, whereas Newtonian substantivalism treats space as precisely that independent, substantial entity. However, both agree on the *existence of an absolute, non-relational fact* about true rotational motion and the reality of the inertial structure that defines it.

  **In Summary:**

  1.  Newton requires absolute space solely as the **ontological ground** for defining true motion, **not as a causal agent**. The effects are caused by internal forces arising from true acceleration.
  2.  The **globes case defeats distant-matter relationism** by demonstrating observable effects (tension) indicative of true rotation in the **complete absence of any other material bodies**, forcing the need for a non-material reference frame.
  3.  A **structural relationist can accept Newton's observations** (concavity, tension as indicators of true rotation) by grounding the absolute metric/inertial structure in reality itself **without reifying space as an independent substance**, differing from Newton primarily on the ontology of the structure.

  Your inheritance dispute poignantly highlights the stakes: Newton argues location and motion are intrinsic properties grounded in absolute space (like fixed GPS coordinates), whereas relationism sees them as defined solely by relations to neighbors (like parcel boundaries defined only by adjacent deeds). Newton's bucket and globes aim to prove the former is necessary to explain observable physical effects, even if space itself remains invisible.
