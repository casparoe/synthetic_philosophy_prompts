  You’re a professional philosopher of art and aesthetics, so think carfully. Before you answer, do a quick brainstorm on why people care about originals at all.

  Compare Goodman’s split between autographic and allographic artworks with the idea of reverse provenance — imagine a painter deliberately reconstructs an "original" canvas to match a famous forgery that’s already in museums. Does Goodman’s physical-form test explain why the reconstructed piece still feels like a fake, or does the problem live in the work’s causal history instead? Push each view until it breaks, then say which one survives.

