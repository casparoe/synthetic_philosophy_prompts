answer: |-
  Your diagnosis is impressively sharp, and your background in physics brings a valuable lens to this ancient dispute. The free will debate *does* resemble a theoretical impasse where core concepts might be equivocal or underspecified—but it's not *merely* verbal. Your "resolution hypothesis" (granularity as a hidden parameter) captures a significant part of the conflict, yet deeper disagreements about the *conditions for responsibility* persist even when granularity is fixed. Here's a breakdown:

  ### 1. **Your Resolution Hypothesis Is Partly Correct (But Incomplete)**
     - **Granularity matters**: You're right that "could have done otherwise" (CDO) often shifts meaning with descriptive resolution. 
       - **Compatibilists** typically work at a *coarse-grained, psychological level*: CDO means "would have acted differently *if reasons/desires had been different*," treating the agent's psychology as a fixed point of agential control. This mirrors how we assess systems in thermodynamics or chaos theory—small changes in initial conditions (reasons) yield different outcomes.
       - **Incompatibilists** insist on a *fine-grained, physical/causal level*: CDO means "could have acted differently *given the exact same antecedent conditions and laws*." This aligns with Laplacian determinism, where initial conditions + laws entail a unique future.
     - **Empirical support**: Your proposed experiment (varying narrative resolution) would likely show *exactly* this effect. Studies on folk intuitions (e.g., Nichols & Knobe, 2007) reveal that people shift toward compatibilism when scenarios emphasize psychological deliberation ("He chose because he was angry") and toward incompatibilism when emphasizing mechanistic causation ("His neurons fired deterministically"). If you manipulated temporal resolution (e.g., "He decided in a split second" vs. "He reflected for weeks"), judgments would likely track granularity.

     **Why this doesn't resolve the debate?**  
     Even with granularity fixed, incompatibilists reject the compatibilist move. Their objection isn't just about CDO—it's about *sourcehood* or *ultimate responsibility* (van Inwagen, Kane). They argue: "Even if we grant coarse-grained alternatives (e.g., different reasons were psychologically possible), *how did the agent come to have those reasons?* If the agent's character/reasons are themselves determined by prior causes, the agent isn't the *true source* of the action." This shifts the debate from *alternatives* to *origination*.

  ### 2. **The Substantive Clash: What Responsibility Requires**
  The standstill persists because the sides prioritize different necessary conditions for moral responsibility:
  - **Incompatibilists** (especially in blame contexts): Demand **sourcehood**—the agent must be the *uncaused cause* of their actions. Blame feels unjust if the agent's "reasons" were imposed by heredity, environment, or causal chains predating them (Strawson's "reactive attitudes" notwithstanding). Hence their focus on "the past and laws being fixed": if those determine everything, the agent adds nothing *new*.
  - **Compatibilists**: Prioritize **control** or **reasons-responsiveness**. An agent is responsible if their actions flow from their character/values *and* they would respond to reasons (Fischer & Ravizza). Praise/blame asymmetry arises because praise often doesn't require alternatives (e.g., "She saved the child because she's brave" may suffice), while blame seems to require avoidability (e.g., "He stole *despite knowing better*"). This isn't just valence—it's a deeper asymmetry in how we attribute responsibility for good vs. bad acts.

  ### 3. **Diagnosis: A Layered Disagreement**
  The standstill stems from **three intertwined conflicts**:
  | **Layer**               | **Compatibilist View**                          | **Incompatibilist View**                     | Why Granularity Doesn't Fix It |
  |-------------------------|------------------------------------------------|---------------------------------------------|--------------------------------|
  | **CDO (Alternatives)**  | Coarse-grained: psychological possibility      | Fine-grained: physical possibility          | Experiment could resolve this layer |
  | **Responsibility Basis**| Control/reasons-responsiveness                 | Sourcehood/ultimacy                          | Conceptual/moral disagreement |
  | **Blame vs. Praise**    | Blame requires CDO; praise may not             | Both require CDO/sourcehood                 | Asymmetry in folk intuitions |

  The granularity conflict is real (and empirical), but the sourcehood/control divide is **substantive and normative**. It's like arguing over whether a system is "secure": one side focuses on robust design (control), the other on provable absence of backdoors (sourcehood).

  ### 4. **What Would Count as Progress? Your Experiment and Beyond**
  - **Your experiment** would advance the debate significantly:
    - **How**: Present identical scenarios at two resolutions (e.g., "John lied" vs. detailing his neurocognitive processes) and measure CDO judgments. Add valence (praise/blame) to test asymmetry.
    - **Outcome**: It would confirm granularity influences folk intuitions, undermining incompatibilist claims that CDO *must* mean fine-grained possibility. This already happens implicitly (e.g., Dennett's "intentional stance").
    - **Limitation**: It wouldn't resolve the normative clash. Philosophers might dismiss folk intuitions as confused or argue that responsibility *shouldn't* depend on description (e.g., "Even if people *say* coarse-grained CDO suffices, they're wrong if determinism is true").

  - **Deeper progress requires**:
    - **Clarifying the responsibility relation**: Is it about *fairness* (incompatibilist sourcehood), *social utility* (compatibilist control), or something else (e.g., Strawsonian emotional expressions)? This might split the question: "free will" could dissolve into distinct concerns (e.g., autonomy vs. desert).
    - **Engaging neuroscience/psychology**: E.g., Libet-style experiments challenge the *experience* of agency, but they don't address normative questions. Better data on how cognitive processes map to "control" (e.g., addiction cases) could inform compatibilism.
    - **New frameworks**: Some modern theories (e.g., List's "causal emergence") model agency at multiple granularities, showing how higher-level properties (intentions) can be causally potent despite physical determinism. This might bridge the gap but won't satisfy sourcehood demands.

  ### Conclusion
  The standstill is **both verbal and substantive**. Your resolution hypothesis explains much of the CDO debate, but the deeper deadlock arises because compatibilists and incompatibilists are ultimately defending different visions of responsibility—one grounded in practical control, the other in metaphysical ultimacy. Your experiment would empirically expose the granularity dependence, forcing philosophers to either accommodate it (e.g., by adopting a levels-based ontology) or dig in on normative grounds. In physics, such a result might prompt redefinition; in philosophy, it often fuels deeper division. Yet progress is possible: by mapping the conceptual terrain (as you've done), we can at least identify where the disagreements lie and which might be empirical, which normative. That, in itself, is a physicist’s gift to philosophy.
