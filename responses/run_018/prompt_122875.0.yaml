  1. **Granularity**: Compatibilists often use coarse-grained (reasons, character) while incompatibilists use fine-grained (causal determinism). But as the user notes, incompatibilists also argue that even coarse-grained reasons are "given," shifting to sourcehood. So granularity isn't the whole story.
