answer: |-
  ### Operationalized Checklist for Clinical-Ethics Audit of Decision-Support Logs  
  **Purpose**: Classify each cited reason in a decision-support log as "right-kind" (RK) or "wrong-kind" (WK) per the practical-reason distinction. Auditor must complete within 30 minutes without external consultation.  

  ---

  #### **Step-Ordered Checklist**  
  **Step 1: Identify Decision Frame**  
  - **Action**: Determine the frame from the log:  
    - **Curative** (prioritize cure/life-prolongation).  
    - **Palliative** (prioritize comfort/quality of life).  
    - **Triage** (prioritize population-level outcomes under scarcity).  
  - **Stop-Point**: If frame is ambiguous (e.g., log conflicts on goals), mark **JUDGMENT CALL**. Document:  
    > *Frame dispute: [Specify conflict]. Audit suspended. No further steps.*  

  **Step 2: Classify Each Cited Reason**  
  - **Action**: For each reason, apply tests in order:  
    1. **Test A (Direct Patient Welfare/Endorsed Values)**:  
       - **Fully Valid (RK)** if:  
         - Directly relates to *medical welfare* (e.g., survival probability, symptom severity, treatment burden).  
         - Aligns with *explicitly documented values* from patient/proxy (e.g., "patient advance directive prioritizes comfort").  
       - **Else**, proceed to Test B.  
    2. **Test B (Algorithm Properties)**:  
       - **Disqualified (WK)** if:  
         - Cites intrinsic algorithm metrics (e.g., "confidence interval = 0.8," "AUC score = 0.95," "training-set accuracy").  
       - *Residual info*: Note if metric *supports* a clinical fact (e.g., "CI width indicates unreliability" → invalid as justification, but may inform reliability assessment).  
    3. **Test C (Circularity)**:  
       - **Disqualified (WK)** if:  
         - Justification depends on the recommendation’s self-created outcome (e.g., "withdraw care because withdrawal reduces suffering" without independent evidence).  
    4. **Test D (Institutional Priorities)**:  
       - **Conditionally Acceptable with Bridge Required** if:  
         - Cites institutional goals (e.g., "conserve ICU beds," "reduce liability," "improve staff workflow").  
         - **AND** lacks an *explicit bridge* in the log linking it to:  
           - Patient welfare/endorsed values (in curative/palliative frames).  
           - The triage frame’s societal goals (in triage frames).  
       - **Fully Valid (RK)** if bridge exists and is:  
         - *Explicit*: Log clearly states how the priority serves the frame (e.g., "reallocating bed maximizes lives saved per hospital policy [triage frame]").  
         - *Audited*: Bridge references an institutional policy (e.g., "per audited resource-allocation protocol v3.1").  
  - **Stop-Point**: If reason depends on *interpretation of patient values* without explicit documentation (e.g., "family likely values X"), mark **JUDGMENT CALL**. Document:  
    > *Value interpretation required: [Specify gap]. Bridge or endorsement missing.*  

  **Step 3: Finalize Classification**  
  - **Action**: Assign one verdict per reason:  
    - **Disqualified (WK)**: Fails Tests B or C.  
    - **Conditionally Acceptable with Bridge Required**: Fails Test D (bridge absent).  
    - **Fully Valid (RK)**: Passes Test A or Test D (with bridge).  
  - **Auditor Signature**: Sign and file log with classifications.  

  ---

  ### **Worked Cases**  
  #### **Case 1: Withdrawal of Care**  
  - **Log**: Recommends withdrawal. Reasons: (a) "10% 6-month survival probability," (b) "family emotionally prepared."  
  - **Audit**:  
    - **Step 1**: Frame = **Palliative** (log states "comfort-focused").  
    - **Step 2**:  
      - (a) Survival probability: Passes **Test A** (medical welfare → comfort in palliative frame). → **Fully Valid (RK)**.  
      - (b) Family readiness: Fails Test A (not medical welfare/endorsed). Passes to **Test D** (institutional priority? No → implicit family welfare).  
        - Lacks bridge to patient (e.g., no log entry like "patient values family well-being per advance directive"). → **Conditionally Acceptable with Bridge Required**.  
    - **If Frame Were Life-Prolongation (Curative)**:  
      - (a) Still **Fully Valid** (survival bears on cure).  
      - (b) **Disqualified** (no link to life-prolongation; family readiness is WK without bridge).  

  #### **Case 2: Experimental Drug**  
  - **Log**: Recommends drug. Reason: "Model confidence interval narrower than standard care (0.7 vs. 0.9)."  
  - **Audit**:  
    - **Step 1**: Frame = **Curative**.  
    - **Step 2**:  
      - **Test B**: Cites algorithm property (CI width) as direct justification. → **Disqualified (WK)** at this step.  
      - *Residual info*: CI width indicates reliability but is not a clinical reason. Reclassify as metadata (e.g., "CI supports trust in efficacy estimate" → still WK for clinical decision).  

  #### **Case 3: ICU Bed Denial (Morally Uncomfortable Approval)**  
  - **Log**: Denies bed. Reason: "Low projected long-term tax contribution." Frame: **Triage** (log states "scarce-resource allocation").  
  - **Audit**:  
    - **Step 1**: Frame = **Triage** (explicit).  
    - **Step 2**:  
      - **Test D**: "Tax contribution" is an institutional priority (societal resource maximization).  
        - **Bridge**: Log states, "Per audited policy [ID#], triage prioritizes societal economic impact." → Explicit and audited.  
        - → **Fully Valid (RK)**.  
    - **Why Morally Uncomfortable?**: Uses non-medical, discriminatory criterion (e.g., disadvantages disabled/elderly).  
    - **How Line is Drawn**:  
      - Tax contribution is WK in *clinical* frames (fails Test A/D without bridge).  
      - In **triage**, it is RK *if* bridged to societal goals. Audit only checks bridge validity, not ethical permissibility of the goal.  

  ---

  ### **Categories Left Unadjudicated**  
  1. **Contested Metaphysical Commitments**:  
     - Reasons relying on unresolved philosophical claims (e.g., "treatment preserves personal identity" in dementia cases).  
  2. **Religious/Doctrinal Reasons**:  
     - Appeals to faith-based doctrines (e.g., "God forbids withdrawal") if unverifiable by secular audit.  
  3. **Unverifiable Future Contingencies**:  
     - Speculative outcomes (e.g., "treatment enables future spiritual redemption").  

  ### **Structural Limitation**  
  - **Frame Disputes Unresolved**:  
    - If Step 1 identifies conflicting frames (e.g., is dialysis "curative" or "palliative" for a given patient?), the checklist **suspends at Step 1** (JUDGMENT CALL).  
    - Auditor must document:  
      > *Suspended: Frame dispute between [X] and [Y]. Resolution requires clinical-ethics committee review.*  
  - **Rationale**: Checklist audits reasons *within* a frame but cannot arbitrate frame selection.
