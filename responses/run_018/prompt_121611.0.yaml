prompt: |-
  You are a philosopher of logic with expertise in conditionals and probabilistic coherence, advising a novelist who runs a speculative-fiction workshop. Before constructing the deliverable, please take a moment to brainstorm: clarify exactly what Lewis's triviality results forbid for indicative conditionals, distinguish that constraint from counterfactual reasoning, and identify where a writer's intuitive use of "if...then" in dialogue will mislead them. Then think step by step.

  I am that novelist. Every quarter I receive manuscripts in which characters reason about open future or present possibilities using indicative conditionals—"If the engine fails, we'll crash," "If she takes the offer, she'll regret it." I need a reusable editorial procedure I can run on any such passage in about fifteen minutes, without computing formal probabilities from scratch. The procedure must be grounded in Lewis's well-known triviality result for indicative conditionals: treating the probability of "If A then C" as equal to the conditional probability P(C|A) collapses, for intermediate probabilities, into probabilistic independence or determinism.

  Please write the procedure as an ordered checklist with the following features: the sequence of questions to ask; what counts as a sufficient answer at each stage; where the procedure stops with a "revise for coherence" verdict; where it explicitly hands the decision to human judgment because the issue is interpretation, values, or narrative license rather than logic; and what the procedure definitively cannot do. Then apply it to three manuscript passages:

  1. An engineer checks a gauge and thinks, "If the pressure exceeds the red line, the valve will blow. In this design, the pressure is either well below or well above the line—there's no middle range." (The procedure should pass this cleanly.)

  2. A detective reasons, "There's a fifty-fifty chance the suspect lied about his alibi. If he lied, I'm about eighty percent sure he was at the scene. So the conditional—if he lied, then he was there—carries about eighty percent weight in my belief." (The procedure should flag a coherence failure here, even though I, as the novelist, will not like that answer because I want the ambiguity preserved for dramatic tension. The procedure should still deliver the flag and specify the required revision or documented exception.)

  3. A narrator writes, "If only love were enough, I might still be happy," in a reflective, metaphorical mode with no assigned probabilities. (The procedure should halt and mark this as out of scope, requiring editorial judgment.)

  Keep the language formal and polished, write in American English, and do not include bibliographies, citation requests, or references to specific editions or page numbers.
reasoning: |-
  We are building an editorial procedure based on Lewis's triviality results for indicative conditionals. The key insight is that if we interpret the probability of an indicative conditional "If A then C" as the conditional probability P(C|A), then under common assumptions (like the conditional having a fixed interpretation across different probability distributions) we run into contradictions unless A and C are probabilistically independent or the probabilities are 0 or 1.

  The procedure will check for cases where the author assigns a conditional probability that is not 0 or 1 and yet the antecedent and consequent are not independent, which would lead to the triviality collapse. We must also note that counterfactual conditionals (about what would have been the case if something had happened) are not subject to this constraint, but indicative conditionals (about what is the case, given an open possibility) are.

  The procedure must be quick and not require formal computation. We will look for explicit or implicit probability assignments and check for independence or extreme probabilities.

  **Checklist Procedure for Editing Indicative Conditionals in Manuscripts**

  1. **Identify the conditional and its type.**  
     - *Check:* Is the conditional an indicative conditional (about an open future or present possibility) or a counterfactual (about a hypothetical or past scenario that is counter to fact)?  
     - *Sufficient answer:* If it is a counterfactual, stop: the procedure does not apply. If it is indicative, proceed.  
     - *If unclear, note:* If the conditional is ambiguous (e.g., in free indirect discourse, or metaphorical), mark as "Requires human judgment" and stop.

  2. **Determine if explicit or implicit probability assignments are present.**  
     - *Check:* Does the context assign a probability (explicitly or by strong implication) to the conditional (i.e., to "If A then C")? And separately, are there probabilities for the antecedent A and the consequent C?  
     - *Sufficient answer:* If there are no probability assignments (either numerical or qualitative like "likely", "unlikely", "almost certainly") for the conditional and/or for A and C, then stop: the procedure does not flag any issue (but note that the conditional might be used non-probabilistically).  
     - *If probabilities are present:* Proceed to step 3.

  3. **Check for extreme probabilities (0 or 1).**  
     - *Check:* Is the probability of the antecedent A 0 or 1? Or the conditional probability P(C|A) 0 or 1?  
     - *Sufficient answer:*  
       - If P(A) = 0: then the conditional is vacuously true or undefined; accept without issue.  
       - If P(A) = 1: then the conditional reduces to the consequent C; check if the conditional is being used appropriately (but note: this is acceptable).  
       - If P(C|A) is 0 or 1: then the conditional is certain (false or true) given A; acceptable.  
       - If none of these are extreme, proceed to step 4.

  4. **Check for probabilistic independence.**  
     - *Check:* Is there any indication that A and C are probabilistically independent? That is, is P(C) = P(C|A) (or equivalently, P(C and A) = P(A)*P(C))?  
     - *Sufficient answer:*  
       - If independence holds (explicitly stated or strongly implied): then the conditional probability is just the marginal probability of C, and the triviality issue is avoided. Accept.  
       - If independence is not present and the probabilities are not extreme (from step 3): then we have a potential coherence failure. Flag for revision.  
       - If independence is unclear: then we cannot be sure. However, if the author has assigned P(C|A) and also assigned a probability to the conditional "If A then C" that is not equal to P(C|A), that would be a separate issue. But our focus is on the triviality constraint. In the absence of independence, and without extreme probabilities, we flag.

  5. **Flagging and revision.**  
     - *If flagged:* The issue is that the author is treating the probability of the conditional as P(C|A) without having either extreme probabilities (0 or 1) or independence. The revision must either:  
       - Make the probabilities extreme (e.g., by making A certain or impossible, or making C certain given A), OR  
       - Establish independence (e.g., by indicating that knowing A doesn't change the probability of C), OR  
       - Remove the probability assignment to the conditional (so that it is not interpreted probabilistically), OR  
       - Change the conditional to a counterfactual (if appropriate in context).  
     - *Human judgment:* If the author intends to preserve ambiguity and dramatic tension without satisfying the above, note that this is a documented exception to probabilistic coherence. The author may choose to override the flag for narrative reasons, but must be aware of the logical issue.

  6. **What the procedure cannot do:**  
     - It cannot handle conditionals without probability assignments.  
     - It does not apply to counterfactuals.  
     - It cannot resolve metaphorical, poetic, or non-literal uses.  
     - It does not check for other logical errors (like negations, quantifiers, etc.) beyond the triviality constraint.

  ---

  **Application to Manuscript Passages**

  **Passage 1:**  
  *An engineer checks a gauge and thinks, "If the pressure exceeds the red line, the valve will blow. In this design, the pressure is either well below or well above the line—there's no middle range."*

  - Step 1: Indicative conditional (about present/future possibility) -> proceed.
  - Step 2: Probabilities? Not explicitly numerical, but note "either well below or well above" implies that the pressure is not in the middle. This suggests that the antecedent (pressure exceeds the red line) has a probability that is not intermediate? Actually, it doesn't assign a probability to the conditional. But note: the engineer is stating a conditional without probability. However, the context of "no middle range" implies that the pressure is either definitely below or definitely above? So it's deterministic?  
    - We must interpret: the design implies that the pressure is not in an intermediate state. So when the engineer says "if the pressure exceeds", it's in a context where the pressure is already known to be either below or above. But the conditional is stated as a general rule?  
    - Alternatively, note that the engineer is checking a gauge. The gauge reading is not given. So the antecedent is still open? However, the next sentence says the pressure is either well below or well above. This suggests that the pressure is already determined, but the engineer doesn't know which. But the conditional itself is a law: if it exceeds, then it blows.  
    - Actually, the conditional is meant as a deterministic physical law. So P(C|A) is 1.  
  - Step 3: Check extreme probabilities: The conditional probability is 1 (if pressure exceeds, the valve blows). So it's extreme. Therefore, acceptable.  
  - **Verdict:** Pass.

  **Passage 2:**  
  *A detective reasons, "There's a fifty-fifty chance the suspect lied about his alibi. If he lied, I'm about eighty percent sure he was at the scene. So the conditional—if he lied, then he was there—carries about eighty percent weight in my belief."*

  - Step 1: Indicative conditional -> proceed.
  - Step 2: Probabilities are explicit:  
    - P(A) = P(lied) = 0.5  
    - P(C|A) = P(was at the scene | lied) = 0.8  
    - The detective then assigns the probability of the conditional "If he lied, then he was there" as 0.8.  
  - Step 3: Extreme probabilities? No: P(A)=0.5 (intermediate), P(C|A)=0.8 (intermediate).  
  - Step 4: Independence? We need to check if P(C) = P(C|A). But the detective hasn't stated P(C) (the marginal probability that the suspect was at the scene). Without independence, assigning the probability of the conditional as P(C|A) leads to triviality.  
    - Note: The detective is explicitly equating the probability of the conditional with P(C|A). This is exactly what Lewis's triviality result forbids unless independence holds or probabilities are extreme.  
    - Therefore, we must flag because we don't have independence (and it's unlikely in this context: lying and being at the scene are probably not independent).  
  - **Verdict:** Flag for coherence failure.  
    - Revision: The detective can say:  
      - "The probability that he was at the scene given that he lied is about eighty percent." (and avoid assigning a probability to the conditional)  
      - Or, if the detective wants to assign a probability to the conditional, he must either make the antecedent certain (but he can't because it's 50-50) or establish independence (which would require that P(was at the scene) is also 0.8, but that might not be the case).  
    - Alternatively, the author can note that the detective is making a logical error (which might be intentional for character development) but then it should be clear that it's an error.

  **Passage 3:**  
  *A narrator writes, "If only love were enough, I might still be happy," in a reflective, metaphorical mode with no assigned probabilities.*

  - Step 1: This is a counterfactual: "If only love were enough" (implying it is not enough) and "I might still be happy" (in a hypothetical scenario).  
    - But note: the word "were" is a subjunctive, which typically marks a counterfactual.  
    - Also, it is reflective and metaphorical.  
  - Step 2: No probabilities assigned.  
  - Therefore, we stop at step 1: counterfactual and no probabilities -> out of scope.  
  - **Verdict:** Halt and mark as out of scope. Requires editorial judgment.
answer: |-
  ### Editorial Procedure for Indicative Conditionals: Lewis-Triviality Compliance Checklist  
  *Purpose: Identify probabilistic incoherence in characters' reasoning with indicative conditionals ("If A, then C") without formal computation. Grounded in Lewis's triviality result: assigning P(If A then C) = P(C|A) forces probabilistic independence (P(C|A) = P(C)) or extreme probabilities (0/1) to avoid collapse.*  

  #### Procedure Structure  
  1. **Sequence:** Ask questions in order; stop at first "revise" or "out of scope" verdict.  
  2. **Sufficiency:** Answers must be unambiguous (yes/no or explicit textual evidence).  
  3. **Outputs:**  
     - **Pass:** No coherence issue detected.  
     - **Revise:** Flag probabilistic incoherence; suggest minimal revision.  
     - **Human Judgment:** Halt for non-probabilistic, metaphorical, or counterfactual usage.  
     - **Documented Exception:** Allow override only after flagging (e.g., for narrative tension).  
  4. **Limits:** Cannot handle non-indicative conditionals, non-probabilistic contexts, or complex embeddings (e.g., nested conditionals).  

  ---

  ### Ordered Checklist  
  **1. Is the statement an indicative conditional about open possibilities?**  
     - *Check:* "If A, then C" refers to real, unresolved future/present events (not hypothetical pasts).  
     - *Sufficient answer:*  
       - Yes → Proceed to Step 2.  
       - No (e.g., counterfactual, metaphor, or past event) → **Human Judgment**.  
       - Unclear → **Human Judgment** (e.g., poetic language).  

  **2. Does the context assign probabilities?**  
     - *Check:* Explicit numbers (e.g., "80% chance") or strong qualifiers (e.g., "likely", "certain") attached to:  
       - The conditional itself (P(If A then C)).  
       - The antecedent (P(A)) and/or consequent (P(C)).  
     - *Sufficient answer:*  
       - Probabilities assigned → Proceed to Step 3.  
       - No probabilities → **Pass** (out of scope; logic doesn’t apply).  

  **3. Are all probabilities extreme (0 or 1)?**  
     - *Check:* Is P(A) = 0/1, P(C) = 0/1, or P(C|A) = 0/1?  
       - *Note:* P(C|A) is often implied (e.g., "If A, then certainly C" → P(C|A)=1).  
     - *Sufficient answer:*  
       - Yes → **Pass** (triviality avoided).  
       - No → Proceed to Step 4.  

  **4. Is antecedent-consequent independence plausible?**  
     - *Check:* Does context imply A provides no information about C?  
       - *Clues:* P(C|A) ≈ P(C), or A/C share no causal/narrative link (e.g., "If it rains, the coin is fair").  
     - *Sufficient answer:*  
       - Yes → **Pass** (triviality avoided).  
       - No or unclear → **Revise for coherence**.  

  **5. Final Verdict**  
     - **Revise for coherence:** If probabilities are non-extreme (Step 3) and independence is absent (Step 4).  
       - *Revision options:*  
         - Remove probability assignments to the conditional.  
         - Make probabilities extreme (e.g., "If A, then *certainly* C").  
         - Assert independence (e.g., "Whether A happens tells me nothing about C").  
         - Rewrite as counterfactual (e.g., "If A *had* happened, C *would*..." → shifts to **Human Judgment**).  
       - *Documented exception permitted:* Only if ambiguity is narratively essential (e.g., flawed character reasoning).  

  ---

  ### Application to Manuscript Passages  

  #### Passage 1: Engineer’s Statement  
  > *An engineer checks a gauge and thinks, "If the pressure exceeds the red line, the valve will blow. In this design, the pressure is either well below or well above the line—there's no middle range."*  
  - **Step 1:** Indicative conditional (open future possibility about pressure) → Proceed.  
  - **Step 2:** No explicit probabilities assigned → **Pass**.  
    - *Rationale:* "Will blow" implies certainty, but no probabilistic weight is attached to the conditional itself. Triviality constraint only binds when probabilities are assigned.  

  #### Passage 2: Detective’s Reasoning  
  > *A detective reasons, "There's a fifty-fifty chance the suspect lied about his alibi. If he lied, I'm about eighty percent sure he was at the scene. So the conditional—if he lied, then he was there—carries about eighty percent weight in my belief."*  
  - **Step 1:** Indicative conditional (open possibility about lie/scene) → Proceed.  
  - **Step 2:** Probabilities assigned:  
    - P(A) = P(lied) = 0.5 (fifty-fifty).  
    - P(C|A) = P(was at scene | lied) ≈ 0.8 (eighty percent sure).  
    - P(If A then C) = 0.8 (eighty percent weight).  
    → Proceed.  
  - **Step 3:** No extreme probabilities (P(A)=0.5, P(C|A)=0.8 → intermediate) → Proceed.  
  - **Step 4:** Independence implausible:  
    - A (lied) and C (was at scene) are causally linked (lying *implies* something about scene presence).  
    - P(C) is unspecified, but P(C|A) = 0.8 ≠ P(C) without evidence → **Revise for coherence**.  
  - **Verdict:** **Revise**. Assigning P(If A then C) = P(C|A) violates triviality when P(A) is intermediate and A/C are dependent.  
    - *Revision:* Delete "the conditional... carries about eighty percent weight." Replace with: "So, given he lied, I’m eighty percent sure he was there."  
    - *Documented exception:* Allowed if detective’s flawed reasoning is intentional. Flag: "Character logic contradicts probability axioms; preserve only for thematic ambiguity."  

  #### Passage 3: Narrator’s Reflection  
  > *A narrator writes, "If only love were enough, I might still be happy," in a reflective, metaphorical mode with no assigned probabilities.*  
  - **Step 1:** Not indicative; subjunctive "were" marks counterfactual (implies love is *not* enough) → **Human Judgment**.  
  - **Step 2:** No probabilities assigned → **Human Judgment** (reinforced).  
  - **Verdict:** **Out of scope**. No triviality constraints apply. Editorial discretion required for tone/theme.  

  ---  
  **Procedure Summary**  
  - **Input:** Manuscript passage with "if...then."  
  - **Output:** Pass/Revise/Human Judgment in ≤15 mins.  
  - **Key Safeguard:** Flags assignments like P(If A then C) = P(C|A) when P(A) is non-extreme and A/C are dependent.  
  - **Human Judgment Domains:** Metaphor, counterfactuals, character voice, narrative license.  
  - **Cannot:** Evaluate non-probabilistic language, resolve vagueness, or assess empirical truth.
