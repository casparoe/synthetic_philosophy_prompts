  I work as a backend engineer with no formal background in philosophy or political theory, but after a recent debate with colleagues about GDPR compliance workflows, American public-record norms, and the architecture of China’s social-credit infrastructure, I began to think of these not as moral disagreements but as competing “visibility protocols” between citizens and states. I would like you to write a sustained satirical piece in the form of a deadpan internal engineering RFC—approximately 700 words—titled something like “Specification: Citizen-State Transparency Layer v2.1.” The document should be authored in-universe by a fictional “Cross-Cultural Visibility Working Group” and written entirely in flat enterprise-software jargon: treat privacy, openness, and behavioral scoring as configurable service-level agreements with endpoints, latency budgets, caching strategies, and error-handling policies.

  The satire must arise from exaggerating real structural features rather than inventing them: the German constitutional framing of informational self-determination and its bureaucratic implementation through data-protection officers; the American default toward disclosure, open records, and commercial data brokerage; and the Chinese integration of behavioral metrics into administrative and financial access. You should invent and deploy conceptual machinery that does not exist in the literature—terms such as “opacity budget,” “visibility debt,” “transparency caching,” and “consent-rate limiting”—so that the absurdity comes from applying distributed-systems logic to genuinely different political-legal architectures. Include at least one deadpan “performance benchmark” table comparing how quickly each national “stack” resolves a citizen request to reduce state visibility, and close with a mock “migration guide” for citizens relocating between Berlin, Seattle, and Shenzhen, treating the transition as a database schema migration with breaking changes, backward-compatibility warnings, and recommended “visibility rollback” procedures.

  Keep the irony sustained and legible without breaking character: no winking asides, no explicit “this is absurd” signals. The reader should recognize the framing as parody precisely because the engineering vocabulary is applied with excessive rigor to ethical and political commitments that resist such optimization. Do not provide bibliographies, citations, or reading lists; do not quote any real philosopher or legal text verbatim. I want the conceptual exaggeration—particularly the idea that hiding from or revealing oneself to the state is an engineering trade-off like memory versus compute—to do all the argumentative work.
