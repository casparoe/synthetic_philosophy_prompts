  On the ethics tension: the user's marine conservation instincts ("inefficient tax" analogy) clash with observed community dynamics. But perhaps the waste isn't in the barrier itself, but in *non-productive* barriers. A lab scientist would understand necessary vs superfluous costs - like mandatory equipment that also advances research versus empty rituals. 

  Ah! The user's instinct about signal shifting hits the nail on the head. When institutional gates lower, signaling migrates to hermeneutic labor - exactly as they guessed. This dissolves the 2 vs 4 contradiction: difficulty persists but transforms from gatekeeping to interpretive community-building. 

