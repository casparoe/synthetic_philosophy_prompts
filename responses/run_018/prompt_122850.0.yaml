  For "never override," that aligns with strict respect for autonomy, treating every user decision as competent. But in the AI context, there's no verified identity or capacity assessment, which weakens the analogy. Then, "override only for imminent harm" mirrors duty to warn/protect, but AI can't verify harm severity or immediacy since it only processes text. Lastly, "override whenever beneficial" is like hard paternalism but lacks fiduciary duty and faces scalability issues with capacity assessments.

  Next, the residue report. Some terms translate cleanly, like autonomy and beneficence, because they're core principles. Others need importing: fiduciary duty (AI isn't legally bound), capacity assessment (AI can't evaluate real-time decision-making ability), and least restrictive alternative (hard to scale without personalization). Some concepts don't translate at all, like therapeutic privilege, since AI has no medical context, and involuntary commitment, as there's no physical restraint.

  The user's trajectory rule is tricky. It's not quite an advance directive because users don't explicitly set conditions. Substituted judgment doesn't fit because the AI predicts future feelings rather than representing known wishes. Maybe it's an entirely new concept, blending soft paternalism with predictive elements. The analogy might be more rhetorical, helping readers grasp the idea by framing it in familiar terms, but the differences could undermine the argument if not addressed.

  The user's deeper needs might include validating their framework within clinical ethics or identifying pitfalls before writing. They might also want to ensure their trajectory rule isn't dismissed as paternalistic without justification. Highlighting the gaps, like lack of fiduciary duty or scalable capacity assessments, could strengthen their paper by acknowledging limitations and arguing why the rule still holds merit despite them.

