       - Similarly, if A withholds, then when B comes online, the state is: A has withheld. Then B will reason: if I share, I get S (because A has withheld and won't share back) and if I withhold, I get P. Since P > S, B will withhold. Therefore, P(B shares | A withholds) = 0 and P(B withholds | A withholds) = 1.
