prompt: |-
  I'm taking this course on Roman practical philosophy and we're on Cicero's Cato Maior de Senectute — the dialogue where old Cato defends aging against four main complaints. There's this part in the middle where he answers the charge that old people are useless to public affairs since they can't fight or do heavy labor. He pulls out that image of the ship's pilot: he doesn't row with the others, but he steers, and that's the most important job on board. I'm trying to understand whether this is just a standard 'mind over body' defense of elder authority, or if Cicero is quietly redefining civic contribution away from physical labor and toward strategic oversight — almost like an early theory of distributed cognition where the old man's value is in coordinating others rather than acting directly. My study partner think the pilot analogy smuggles in an aristocratic assumption that wisdom automatically entitles you to command, and I'm not sure how to evaluate that. There's also this weird biographical layer: Cicero wrote this partly to comfort himself about aging and exille, so is the passage doing real philosophy or just theraputic self-soothing? Can you walk me through what exactly corresponds to what in the ship image, where the analogy breaks if we apply it to modern deliberative democacy (where authority isn't granted by age alone), and whether the 'uselessness' objection is even being answered honestly or just being redefined away? I don't need citations or a reading list — just help unpacking the logic.
