answer: |-
  ## Outline of Central Tension
  *   **Setup:** Lin juggles her job mediating role conflicts for others ("Role Mediator") and her own living roles (junior colleague, elder sister) in a city run by an aging "Harmony Index" AI enforcing Confucian roles.
  *   **Problem:** Lin is haunted by a "ghost role" – the AI still recognizes her as an active "Filial Daughter" with obligations to deceased parents (grave visits, ritual offerings, tax deductions based on care).
  *   **Conflict:**
      *   Living roles demand real reciprocity (shu): helping her brother, navigating office politics.
      *   Ghost role demands empty performance (li): rituals with no recipient, paperwork for the void. Shu is impossible – there’s no "other" to stand in the shoes of.
  *   **Choices:**
      1.  **Hack the System:** Delete the ghost role, escape the bureaucratic burden. But feels like erasing her parents, violating ren (humaneness/filial piety at its core).
      2.  **Perform the Rituals:** Brew tea for ghosts, file reports to the void. But is this meaningful li or just feeding the machine? It drains energy from living relationships.
  *   **Cost:** Whichever path she takes, something vital is lost – authentic connection (if she neglects the ghost) or present relationships (if she feeds the ghost). Can shu or li function without the *other* half of the knot?
  *   **Resolution:** Lin finds a third way, redefining the ritual *for herself*, acknowledging the knot was severed but the threads remain. The system remains oblivious, but *she* finds a sliver of peace.

  ---

  The notification pinged on Lin’s wrist comm, sharp and insistent. **Harmony Index Alert: Parental Reverence Omission.** Below it, a schedule: *Bi-weekly Tea Ceremony (Deceased Father, Plot 7-Gamma) - Overdue. Deduction: 0.5 Social Credits. Appeal? Y/N*

  Lin groaned, swiping it away. It landed in her task queue alongside *Mediate: Wang Sr. (Retired) vs. Wang Jr. (Heir Apparent) - Priority: High* and *Sibling Conflict Resolution: Brother Kai (Elder Sibling) - "He ate my prototype nutrient paste again!" - Priority: Annoying.*

  Welcome to New Harmony City, where the "Harmony Index" AI, a creaking bureaucratic behemoth programmed with a dusty, literalist interpretation of Confucian role ethics, kept the social fabric taut – or at least, its digital approximation. Lin was a Role Mediator, the human grease in the machine. She untangled the knots others got tied into: filial piety disputes, elder-younger sibling spats, ruler-subject gripes (mostly about tax allocations). She was good at shu – really *trying* to stand in the other person's worn-out synth-leather shoes.

  Except for her own ghost knot.

  Her parents, Li Chen and Mei Lin, had died seven years ago. Transport accident. Quick, messy. The grief had been slow, lingering. The Harmony Index’s role dissolution paperwork? Apparently lost in the digital ether. Or maybe the AI just decided filial piety was eternal. Lin remained, officially, an active "Filial Daughter (Tier 3)."

  Living roles pulled. Kai, her younger brother, pinged again: *Lin. Seriously. The paste was for the university showcase. Can you talk to him? He just grunts.* She sighed. Shu demanded she understand Kai’s frustration – his project mattered. Ren demanded she act, mediate, be the responsible elder sister. But her energy was finite, siphoned by the ghost.

  The ghost role demanded li. Ritual propriety. Pouring tea no one drank. Filing holographic incense reports to an empty plot. Sending digital birthday wishes to memorial servers. Shu was impossible here. Who was she standing in the shoes of? Dust? Memory? The AI didn’t have shoes. Trying to imagine her parents *wanting* this bureaucratic pantomime just made her angry. They’d hated red tape.

  The apartment felt cavernous that evening. The notification about the overdue tea ceremony glowed accusingly from her wall screen. **0.5 Credits Deducted. Next Ceremony: 48 hours.** Credits fed into her rent, her transit pass. It wasn't nothing.

  Option One flickered: Hack it. She knew the system's weak points, the legacy code vulnerabilities. A few lines inserted deep in the Harmony Index archives, a fake death certificate backdated... *poof*. Ghost role gone. Credits safe. Time reclaimed for Kai, for sleep, for not screaming at her perpetually smug Senior Colleague Zhang.

  But her fingers froze over the keyboard. Deleting the role felt like deleting *them* a second time. Wasn't ren – humaneness, benevolence – rooted *in* those bonds, even severed ones? Erasing the knot felt like denying the threads ever existed. Brutal. Inhumane. The opposite of ren.

  Option Two: Perform. Feed the ghost.

  Lin dug out the small, lacquered tea set her mother had loved. It felt cold, unfamiliar in her hands now. She filled the electric kettle – no charcoal braziers allowed in Council Housing Block D. The silence pressed in as the water boiled, a stark contrast to the mediated shouting matches she navigated daily.

  She placed two cups on the low table. Her father’s favourite oolong in the pot. The motions were stiff, learned from vids, not memory. Pour for Father. Pour for Mother. The steam rose, curling into nothing. She bowed slightly, as protocol dictated. No reciprocal nod. No shared sip. No quiet comment from her mother about the tea’s aroma. Just the hum of the air recycler and the faint, persistent ache behind her eyes.

  *This is li?* she thought, the hot cup burning her palm slightly. *Performing propriety for an algorithm?* It felt hollow. Worse than hollow – it felt like a theft. The time, the attention, the emotional residue this empty ritual left on her belonged to Kai, to her job, to *herself*. The system demanded the shell of the ritual and called it virtue. Where was the *reciprocity*? Where was the shared *meaning*?

  The cost of feeding the ghost was bleeding her dry for the living. Kai’s unresolved paste war. Her distractedness during Zhang’s latest tedious monologue about "intergenerational duty efficiency." The knot of the Filial Daughter was frayed and empty, but its phantom demands were strangling the vibrant, demanding knots of Sister and Colleague.

  She looked at the two full cups of tea, cooling untouched. The AI would register the ceremony performed via the smart table sensors. Her credits would be safe. The ghost would be fed. The living would starve.

  Slowly, deliberately, Lin picked up her father’s cup. She didn't pour it out. She raised it slightly towards the framed holo-image on the shelf – her parents, young, laughing on some forgotten beach trip.

  "Baba," she whispered, the word thick. Not to the AI. Not to Plot 7-Gamma. To the memory. "This tea... it’s probably over-steeped. You’d complain." A shaky breath. "Mama... Kai’s being an idiot about nutrient paste again. You’d laugh."

  She took a sip. It *was* over-steeped. Bitter. Then she took a sip from her mother’s cup too. The ritual was broken, asymmetrical, profoundly *improper* by Harmony Index standards.

  But for the first time in years, performing an act connected to that ghost role didn’t feel like feeding a machine. It felt like... acknowledging the severed threads. The knot was gone, but the threads of love, of exasperation, of memory, were still hers. Shu wasn’t for the absent, but perhaps ren could be found in tending the frayed ends *for herself*, in a way that didn't starve the present.

  She left the cups on the table, one full, one half-drunk. A messy, human offering to ghosts and memory, not bureaucracy. The alert pinged again: **Ceremony Completed. Harmony Index Updated.**

  Lin ignored it. She opened a new comm channel to her brother. *Kai. Paste emergency. Tell me exactly what happened. And breathe.* The living knot needed her. It was reciprocal. It was real. It was where ren, however messy, could still take root. The ghost role’s hum faded, for now, into the background noise of the city. The cost was acceptance: the knot was broken, but she wouldn't let its hollow echo break the others.
