  ## The Extinguished Lamp

  The wick burns low, its orange tongue grows thin,  
  until no fuel remains to feed the flare;  
  the final tremor yields to air and dark  
  where once stood light and warmth. The vanished flame  
  leaves only cooling glass; it does not ache  
  for radiance it knew, nor grieve the dark  
  that holds it now. Where being ends, no ghost  
  of feeling lingers in the hollow space.

  The chair stands empty at the laden board.  
  Plates steam untouched where laughter should have rung.  
  The ledger's future columns fill with dust.  
  The harvest waits unclaimed beyond the gate.  
  The path unwalked leads through a vanished wood.  
  The silent loom holds colors never wove.

  ---

  **Commentary on the formal choices**

  The first stanza's consistent enjambment reflects the Epicurean view of existence as a continuous, unbroken state. Sentences flow beyond line endings, mirroring the argument that harm requires an ever-present subject ("the vanished flame / leaves..."; "no ghost / of feeling..."). The uninterrupted syntax embodies the insistence that consciousness is a singular continuum; when it ceases, no residual subject exists to experience absence. This continuity undercuts the notion of post-mortem harm.

  The second stanza shifts to end-stopping, each line a discrete, bounded image ("Plates steam untouched...", "The harvest waits...", "The silent loom..."). This mirrors the deprivation account's focus on death as a specific *event* creating a boundary, beyond which potential goods are irrevocably lost. Each end-stopped line isolates a concrete deprivation: the uneaten meal, the unclaimed harvest, the unwalked path, the unwoven cloth. The abrupt line endings visually represent the sharp cut-off point death imposes, highlighting the future goods eliminated *at that moment*.

  **Simplifications:** The Epicurean position simplifies the potential complexity of personal identity over time. The deprivation account simplifies the challenge of precisely defining or valuing the counterfactual "future goods" lost, especially distant or uncertain ones. Both positions are presented starkly for poetic and metrical clarity.
