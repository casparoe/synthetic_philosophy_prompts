  **Presenting Tip:** Start by clearly defining terms: "When I say 'consciousness' in this talk, I mean *phenomenal consciousness* – that supposed raw, private, 'what-it's-like' feel of experiences." This immediately pre-empts confusion and sets up the illusionist target. Good luck!
