prompt: |-
  I'm in an after-school philosophy club and next week I have to give a ten-minute explainer on illusionism about consciousness. Everyone else got the normal positions (dualism, panpsychism, physicalism) and I got stuck with the weird one. I found a paragraph in a popular science book — the author is a science writer, not a philosopher — and it's the clearest version I've seen, but something about it feels off and I can't quite put my finger on it. The passage says roughly: illusionism is the surprising claim that consciousness doesn't really exist. When you burn your hand, there's no real pain — there's just neural activity plus a false readout from the brain that something raw, private, and lit up is going on in here. It's basically old-school eliminativism about folk psychology aimed at your own mind: we project a what-it's-like ingredient onto brain processes that science has no need for. And the killer objection is obvious — illusionists are denying the one thing we each know with more certainty than anything else, namely that we're in pain right now. So the view refutes itself, because you can't have an illusion of an experience unless something is actually experiencing something.

  I googled alot around this and now I'm more confused: some people say illusionists don't deny that you feel pain, they just deny that the feeling has a spooky phenomenal extra, and others say illusionists really do deny consciousness exists. My gut says the refutes-itself part is doing too much work, but I can't tell whether the no-real-pain stuff is also an unfair gloss or is exactly what illusionists are willing to say.

  Can you audit this for me? I want to know which parts are accurate, which are simplifications, which are wrong or overstated, and what an actual defender of illusionism would say back to the refutes-itself objection. I'm not asking you to defend the view, just to tell me what I can safely say without getting shredded by the kid who read Chalmers. And then, seperately, can you give me a compact version as a JSON object I can glance at while presenting. Use these fields: claim (a short paraphrase of each point in the passage), verdict (one of: accurate, simplification, misleading, false), what_the_view_actually_says, and would_a_defender_object (a short yes-or-no reason). Keep it to the five or six claims in that passage.
