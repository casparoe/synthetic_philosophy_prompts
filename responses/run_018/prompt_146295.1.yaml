  Let me start by understanding the core dispute. Vasquez argues that disjunctivism fails to address the argument from illusion because it doesn't explain why subjects can't distinguish veridical perceptions from hallucinations internally. She claims this concedes a shared phenomenal core. Chen counters that subjective indistinguishability doesn't require shared mental ontology, emphasizing the causal-functional differences.

  Their debate progresses through several moves:
