prompt: |-
  I'm prepping a session for policy grad students who've done basic econ but never touched Sen. I want them to walk away seeing famines as political crimes, not bad weather — using Sen's entitlement framing across Bengal 43, the Irish famine, and the Great Leap Forward. I'm also throwing in this weirder concept I made up, displaced entitlement collapse, where global supply chains let starvation happen far away from the actual crop failure, so political blame gets diffused across borders. Don't explain the idea to me; plan the explaination arc. What's the dependency order — should exchange entitlement come before democratic accountability, or the other way around? What's the one carrying case, and what does it need to have and lack (definitely don't weight all three famines equally)? The misconceptions they'll show up with: if food was exported then locals must have had enough, the Leap Forward was mainly drought, and democracy is a magic shield. Where in the sequence do I swat each? What's a quick check at the end that shows they've actually bought the political-crime framing, not just been made uncomfortable? And what do I flat-out refuse to cover at this level and say so? Keep it practical — 40 mins, one whiteboard, no readings assigned.
reasoning: |-
  Okay, let me tackle this famine pedagogy puzzle. The user wants a surgical 40-minute session shifting grad students from seeing famines as natural disasters to political crimes using Sen's framework. 

  First I need to map the conceptual dependencies. Exchange entitlement must come before democratic accountability - you can't grasp how political systems fail to prevent entitlement collapse without first understanding entitlements themselves. The Bengal case will be my workhorse here: visually simple (food exports + wartime policy = starvation) and perfect for smashing the "exports imply sufficiency" myth early.

  The displaced entitlement collapse concept is fascinating but risky. I'll sandwich it between Bengal and the Great Leap Forward, using modern supply chains to show how political invisibility enables famine. That sets up GLF's manufactured crisis where even ideal weather wouldn't have mattered - directly attacking the "it was just drought" misconception. 

  For the democracy myth, Ireland's the scalpel. Show how colonial quasi-democracy still killed millions when accountability was selectively absent. That prevents overcorrection toward seeing democracy as panacea. 

  The checkpoint must be visceral: "Who would you prosecute?" makes them commit to criminal framing. And I'll explicitly exclude Malthusian arguments - no time for that rabbit hole when building political literacy is the goal.
answer: |-
  Here’s a battle-tested 40-minute arc using your whiteboard only. **Dependency order is critical:** Start with **exchange entitlement collapse**, *then* layer on **democratic accountability**, and finally hit **displaced entitlement collapse**.  

  ---

  ### **The Whiteboard Flow (40 mins)**
  #### **1. Hook: The Myth vs. The Crime (3 mins)**
     - Draw three stick figures: **Weather**, **Food Supply**, **Dead People**.  
     - *"If I say ‘famine’, you picture this chain, right? Sen says: break it here."* → **X** through "Food Supply" arrow.  
     - *"Famines aren’t about scarcity. They’re about who’s *allowed* to eat."*  

  #### **2. Core 1: Exchange Entitlement Mapping (Bengal ‘43) (12 mins)**  
     - **Board:** Draw Bengal’s ecosystem:  
       - *Fishermen* 🎣 (entitlement: fish → sell → rice)  
       - *Landless laborers* 👷 (entitlement: wages → rice)  
       - *Rice traders* 🍚 (entitlement: sell → profit)  
       - *British Army* 🪖 (entitlement: $$$ → rice)  
     - **Collapse:**  
       - Wartime inflation → wages worthless 💸  
       - Boat confiscation → fishermen can’t work ⛔  
       - Army buys rice → prices soar 📈  
     - **SWAT MISCONCEPTION 1:** *"But food was exported!"* → *"Exactly. Entitlements failed *despite* rice leaving. Starvation isn’t shortage—it’s being priced out."*  

  #### **3. Core 2: Democratic Accountability (Irish Famine) (10 mins)**  
     - **Board:** Contrast Bengal with Ireland:  
       - *Ireland:* Colonial "democracy" 🗳️ (but Irish Catholics disenfranchised)  
       - *Policy:* Laissez-faire + grain exports during blight ☘️→💀  
     - **Key Point:** *"Democracy isn’t a magic shield. It’s *who counts* as a voter. No political voice? Your entitlements aren’t defended."*  
     - **SWAT MISCONCEPTION 3:** *"Democracy prevents famine?"* → *"Only if the starving can punish leaders. No vote? No accountability."*  

  #### **4. Twist: Displaced Entitlement Collapse (Great Leap Forward) (10 mins)**  
     - **Board:** Draw a **global supply chain:**  
       *Local crop failure* → *Global grain market* 🌍→ *Speculators* 📊→ *Remote village* 🏚️  
     - *"Crop fails in Country A. Trader B in Country C hoards. Mother D in Country E starves. Who’s responsible? *Everyone and no one.*"*  
     - **SWAT MISCONCEPTION 2:** *"GLF was drought!"* → Overlay weather data with policy: *"Bad harvests? Yes. Famine? No. Sen: 1958-61 food production *exceeded* 1953 levels! Collapse came from forced collectivization → entitlement annihilation."*  

  #### **5. The Carrying Case: Bengal ‘43**  
     - **Why it carries:**  
       - Simplest entitlement collapse (war policy → direct market sabotage).  
       - Shatters "exports = sufficiency" myth instantly.  
       - Lacks complicating factors (unlike GLF’s ideology/Ireland’s colonialism).  
     - **Use it to:** Anchor entitlement, then contrast Ireland/GLF as *variations* on political failure.  

  #### **6. Check for Buy-In (3 mins):**  
     - *"You’re a prosecutor. Charge sheet for each famine: *Who’s guilty of what?*"*  
     - **Listen for:**  
       → Specific policies/actors (e.g., "Churchill’s diversion", "Mao’s collectivization").  
       → **Not** weather/scarcity. If they say "drought", hammer: *"Why no famine in non-collectivized areas with same drought?"*  

  #### **7. What You REFUSE to Cover (Explicitly State):**  
     - *"We are NOT debating Malthusian scarcity, food aid logistics, or ‘hard choices’ in crisis. Today: famines are *always* political choice. Period."*  

  ---

  ### **Why This Sequence Works**  
  1. **Entitlement first:** Students *must* grasp the mechanism before seeing its political exploitation.  
  2. **Bengal as the anchor:** Clean cause-effect → makes Ireland/GLF’s complexities digestible.  
  3. **Democracy second:** Shows accountability is *contingent* (not inherent), preventing magical thinking.  
  4. **Displaced collapse last:** Requires understanding of *both* entitlement + politics to "get" the diffusion.  
  5. **Active myth-busting:** Hits misconceptions *when evidence is on-screen* (e.g., GLF production charts).  

  **Pro Tip:** End with the prosecutor question. If they name politicians/institutions (not "nature"), you’ve succeeded. If they waffle, cold-call: *"Defend Churchill/Mao using only weather reports."* → They can’t.  

  Go make policy criminals sweat.
