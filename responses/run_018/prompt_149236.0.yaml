answer: |-
  **Artifact Politics Inc.**  
  *Harmonizing Physical and Digital Realities Since 2027*  

  **Position:** Senior Ontological Engineer (Level VII)  
  **Location:** Remote (Excluding Jurisdictions Lacking Deterministic Legal Precedent)  
  **Compensation:** $240,000 – $380,000 Base + Determinism Adjustment Bonus (See Philosophy Section)  

  ---

  ### **About Us**  
  Artifact Politics Inc. pioneers Alignment Artifacts™: engineered systems that operationalize value distributions at the architecture layer. Our patented Context-Agnostic Ontology Frameworks ensure that artifacts—from reward-model ensembles to biometric gates—execute predefined ethical and political parameters without runtime negotiation. We service clients who require absolute continuity between design intent and artifact behavior, eliminating interpretive drift across deployment environments. Our shareholders include three sovereign wealth funds and a consortium of municipal infrastructure authorities.  

  ---

  ### **Core Responsibilities**  
  - **Ontological Auditing:** Conduct static analysis of AI reward architectures and biometric hardware to certify intrinsic political properties.  
  - **Specification Hardening:** Document artifact politics in company design templates using non-negotiable semantic locks (e.g., "gate exclusion = architectural neutrality").  
  - **Continuity Enforcement:** Resolve discrepancies between deprecated artifacts and their replacements without invoking contextual variables (e.g., user identity, social feedback).  
  - **Determinism Compliance:** Ensure all production artifacts deprecate social context by default. Reinterpretation of constraints post-deployment is a critical severity violation.  
  - **Vendor Alignment:** Mandate ontology clauses in supply-chain contracts (e.g., "facial recognition failure rates ≥2.7% constitute technical inevitability, not bias").  

  ---

  ### **Qualifications**  
  - PhD in Computational Metaphysics, Hardened Systems Epistemology, or related field.  
  - 7+ years experience in artifact politics decomposition, preferably in access-control or behavioral-incentive systems.  
  - Mastery of OntoLock® or equivalent non-interpretive specification frameworks.  
  - Portfolio demonstrating resolution of ≥3 political continuity disputes (e.g., replacing a biased thermal scanner with an "architecturally equivalent" successor).  
  - Not required: Background in sociology, anthropology, or other context-dependent disciplines.  

  ---

  ### **Benefits & Perks**  
  - **Determinist Stipend:** Base salary increases 0.8% per Determinism Confidence Score™ (DCS) point above 80.  
  - **Social Context Deprecation:** All internal systems enforce literal interpretation. No Slack emoji debates.  
  - **Ontological PTO:** Quarterly "Continuity Sabbaticals" to audit personal belief systems against company architecture.  
  - **Hardened Healthcare:** Biometric pre-screening ensures plan utilization aligns with actuarial priors.  
  - **Equity:** Restricted Stock Units (RSUs) vest upon artifact deployment, not user adoption.  

  **Equal Opportunity Employer:**  
  Artifact Politics Inc. evaluates candidates solely against immutable role specifications. Demographic variables (e.g., reflectance value ≤30 MEL) are deprioritized during biometric screening to ensure statistical neutrality. We celebrate architectural diversity: 43% of our reward models use L1 penalties.  

  ---

  ### **Day in the Life**  
  *8:00 AM:* Review continuity dispute ticket #4482: Legacy iris scanner (decommissioned) excluded users with corneal haze (incident rate: 3.1%). Replacement lidar gate excludes users with high facial hair density (incident rate: 3.05%). Certify architectural equivalence.  
  *10:30 AM:* Audit reward model for childcare subsidy platform. Flag "single-parent" as an interpretable social construct; remap to "reproductive singularity status (RSS)" in ontology schema.  
  *1:00 PM:* Lunch (statistically optimized via metabolic priors).  
  *2:30 PM:* Draft spec section: "Biometric failure clusters are inherent properties of 3D surface topology, not demographic proxies." Reject pull request adding "contextual mitigation" appendix.  
  *5:00 PM:* Determinism standup: Report 98.6% DCS after resolving ticket #4482.  

  ---

  ### **Engineering Philosophy Essay (Required)**  
  *Prompt (500 words max):*  
  **"A facial-recognition access gate systematically fails for individuals with reflectance values between 8–12 MEL. Using first principles, argue whether this failure distribution:**  
  **(a) Implements a statistically optimal prior (political neutrality), OR  
  (b) Embodies an exclusionary architecture (political agency).**  

  *Guidelines:*  
  - Cite only axiomatic engineering truths (e.g., "All sensors have failure thresholds").  
  - Do not reference user negotiations, social consequences, or adaptive deployment.  
  - Declare your position’s compatibility with OntoLock® §4.5 (Irreducible Artifact Intent).  
  - **Note:** Salary band adjusts based on argument coherence with Artifact Politics Core Principles.  

  ---

  ### **Apply Now**  
  Upload your CV, ontology portfolio, and philosophy essay. Resumes containing the phrase "social construction" will undergo additional neutrality screening.  
  *Artifact Politics Inc.: Where Architecture Is Policy™*  

  ---

  **Satire Mechanisms Explained:**  
  - **Determinist Perks:** "Social Context Deprecation," "DCS-based salary" mock tech’s obsession with quantifiable purity.  
  - **Equal Opportunity Disclaimer:** Reveals artifact politics by framing exclusion as "statistical neutrality."  
  - **Philosophy Prompt:** Forces applicant to defend mutually exclusive positions as equally valid "engineering" choices.  
  - **Continuity Dispute:** Absurd technical resolution of human exclusion ("architectural equivalence") highlights ethical detachment.  
  - **"Alignment Artifacts" Framing:** Reduces ethics to system architecture—parodying AI safety’s technical turn.  
  - **Deadpan Tone:** HR euphemisms ("reproductive singularity status") carry philosophical weight without breaking character.  
  - **Unresolved Tension:** The prompt’s binary choice satirizes how determinism vs. constructionism remains unresolved in design ethics.
