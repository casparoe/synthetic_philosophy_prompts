prompt: |-
  Write a deadpan parody of a Silicon Valley job-recruitment page—around 600 words, bullet-point format, “About Us” blurb, and a required “Engineering Philosophy” essay prompt—for a fictional firm named Artifact Politics Inc., hiring a Senior Ontological Engineer. The role is to determine whether engineered objects, specifically AI reward-model architectures and biometric gatekeeping hardware, possess intrinsic political properties independent of social context, and to document those properties in the company’s design specs without allowing interpretive flexibility.

  Target the debate over technological determinism: the strong claim that artifacts embody politics by design (the classic low-bridge argument, applied here to access-control systems that exclude users with specific dermatological conditions through “neutral” statistical priors), versus the social-constructionist objection that politics are inscribed through closure and user negotiation rather than embedded in the artifact itself. The satire should exaggerate real features of both positions: list determinist perks in the benefits section (e.g., “no reinterpretation of interface constraints permitted,” “social context deprecated in production”), include an “Equal Opportunity Employer” disclaimer that accidentally reveals the artifact’s politics, and require applicants to defend, in 500 words, whether a gate’s exclusionary statistics are merely implementing a prior or embodying an architecture. The deadpan HR voice must stay consistent—never wink, never slip into constructivism for comic relief unless that contradiction is itself the punchline.

  To avoid generic philosophy regurgitation, inject this niche framing: treat the products as “alignment artifacts,” systems that enforce specific value distributions through technical architecture rather than explicit policy. The job description should ask candidates to resolve a concrete scenario—whether a facial-recognition access gate that systematically fails for a specific demographic is politically neutral or politically loaded—while treating both answers as equally valid “engineering philosophies.” The salary band should adjust based on the applicant’s determinist stance, and the “Day in the Life” section should describe resolving continuity disputes between a failed upload and its replacement without acknowledging personal identity.

  The humor should land for someone who knows the determinism debate—recognizing the bridge example translated into biometric design, seeing why SCOT scholars object, and feeling the real tension that if artifacts truly have fixed politics then engineering ethics is redundant, whereas if politics are always negotiable then every design choice is just contingent social closure. Keep it readable to someone outside the literature: define nothing with jargon, but let the corporate euphemisms do the philosophical work. Do not ask for bibliographies, citations, named living scholars, or verbatim quotes; paraphrase positions in recruitment-language only. By the end, a reader should feel the unresolved question standing, not summarized.
