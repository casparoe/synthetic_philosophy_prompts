answer: |-
  That's an exceptionally sharp observation—you're pinpointing a core paradox of imperial systems where "improvement" and "subjugation" are functionally intertwined. While no single term perfectly captures every nuance of this configuration, several established concepts converge to describe it:

  1.  **Structural Dependency / Asymmetric Integration:**
      *   **Core Idea:** This frames the relationship as one where the colony/periphery is deliberately integrated into the metropolitan core's economy and governance in a way that makes it structurally *dependent* and perpetually subordinate. "Improvements" (railroads, ports, education systems) serve primarily to facilitate resource extraction and market control for the core, not to build endogenous, balanced development.
      *   **Distinguishing Feature:** Emphasizes the *systemic design* creating lock-in. Metrics like increased exports or literacy are real but reflect integration into the core's system, not autonomous capacity-building. Local elites often become comprador classes reliant on the metropole. Adam Smith's critique of mercantilism fits squarely here – the restrictions *were* the system enabling British profit, disguised as protection.

  2.  **Deferred Sovereignty / Arrested Development (Political):**
      *   **Core Idea:** Focuses on the political dimension. Institutions are designed to *prevent* the emergence of genuine self-governing capacity, even while administering "progress." Authority remains firmly vested in the metropole; local participation is advisory or implementational, not sovereign. "Improvements" in administration or education are calibrated to produce functionaries, not independent leaders or critical citizens.
      *   **Distinguishing Feature:** Highlights the *political* lock-in. The promise of future autonomy is either absent or perpetually deferred. "Benevolence" justifies the denial of self-determination. British colonial policy in India ("training" Indians for eventual self-rule, but maintaining ultimate control indefinitely) often manifested this.

  3.  **"Development of Underdevelopment" (Andre Gunder Frank):**
      *   **Core Idea:** A key tenet of **Dependency Theory**. It argues that the economic "development" of the core (metropole) *actively creates and requires* the "underdevelopment" of the periphery (colony). The integration isn't neutral; it distorts the peripheral economy (e.g., monoculture exports, suppressed industry) to serve the core's needs. Improvements in infrastructure or export volumes are precisely the *mechanisms* of this underdevelopment.
      *   **Distinguishing Feature:** Explicitly links "improvement" metrics to the *process* of creating structural economic weakness and dependency. The harm *is* the benefit (for the core), and vice-versa.

  4.  **"The Colonizer Who Refuses" / Functional Paternalism (Albert Memmi):**
      *   **Core Idea:** Memmi, in *The Colonizer and the Colonized*, argues that the colonizer's very identity and role depend on the colonized remaining subjugated. While they may perform acts of "benevolence" (building schools, hospitals), these acts *reinforce* the power imbalance and the myth of the colonizer's indispensable civilizing role. True autonomy would negate the colonizer's raison d'être.
      *   **Distinguishing Feature:** Focuses on the *psychological and functional imperative* for the dominant power to *refuse* genuine emancipation, even while performing "good works." The "improvement" justifies the permanent refusal of self-governance.

  **Distinguishing from Genuine (Even Flawed) Paternalism:**

  This is crucial. Your "benevolent intent to eventually let go" scenario exists, but the system you describe is fundamentally different. Here’s how to draw the boundary:

  *   **Institutional Design for Lock-in:** Look for structures *designed* to prevent autonomy: economic monoculture enforced by law/taxation; centralization of legal/judicial authority in the metropole; education systems focused on producing loyal subordinates, not critical thinkers or leaders; suppression of local industries competing with the core; appointed, non-accountable local leadership.
  *   **Absence of a Credible Pathway:** Is there a clear, institutionalized, and progressively implemented plan for transferring *sovereign* power (economic & political)? Or is autonomy always a vague, distant promise contingent on meeting impossible standards set by the metropole?
  *   **Who Benefits Primarily?** Do "improvements" demonstrably serve the *strategic interests* of the metropole (resource access, market control, geopolitical dominance) *first and foremost*, even if locals receive some secondary benefits? Smith saw this clearly in the mercantile restrictions.
  *   **Suppression of Endogenous Power:** Are local elites co-opted into dependency (compradors), or is there space for the genuine emergence of independent, countervailing economic or political forces? Is dissent or autonomous development actively suppressed?
  *   **Rhetoric vs. Reality:** Is the language of "improvement" and "protection" used precisely to *deflect* demands for self-governance and obscure the extractive reality? (This is where Smith's critique of British policy towards America shines).

  **Synthesizing the Concept:**

  You might call this **"Subaltern Development"** (implying development designed to maintain subordination) or **"Extractive Institutionalism"**. The most precise existing academic framing is likely **Structural Dependency with Deferred Sovereignty**, emphasizing both the economic lock-in and the deliberate political stasis.

  **In essence:** It's a system where "improvement" is not a step towards freedom, but the *method* and *justification* for permanent, structured subordination. The metrics aren't lies; they are real outputs of a system designed to benefit the metropole by integrating the periphery on fundamentally unequal and dependency-enforcing terms. Adam Smith identified the economic core of this; later dependency and postcolonial theorists expanded it to encompass the political, social, and psychological dimensions. Your recognition of the *institutional design* as the key element – where benefit and harm are two sides of the same coin – is spot on.
