  ### Taxonomy of Interpretive Positions on Kant's Perpetual Peace  
  **Root Commitment:** Acceptance of Kant’s distinction between *preliminary articles* (e.g., ceasing hostilities, reducing armies) and *definitive articles* (e.g., republican constitutions, federation of free states, cosmopolitan hospitality).  

  #### Decision Tree: Branch Nodes (Diagnostic Scenarios)  
  1. **Existential Threat & Intervention**  
     A democratic republic faces annihilation by an autocratic neighbor. Is *preemptive intervention to force republican reform* permissible if it is the only path for the aggressor to join the federation?  
     - **Y (Yes):** Permissible.  
     - **N (No):** Impermissible.  

  2. **Commercial Interdependence as "Guarantee"**  
     Global trade reduces war incentives but erodes sovereignty via supply-chain dependencies. Does this *count as Kant’s "guarantee of nature"* for peace?  
     - **Y (Yes):** It is the empirical mechanism.  
     - **N (No):** Not the mechanism (or non-empirical).  
     - **G (Guarantee Reading):** If **Y**, how is the guarantee interpreted?  
       - *E (Empirical):* Observable cause-effect in history.  
       - *T (Transcendental):* Condition of possibility for peace.  
       - *P (Performative):* Constituted by human action (practical reason).  

  3. **Binding Arbitration vs. World-State**  
     The federation establishes a permanent court with *binding decisions* over disputes. Does this *cross into a world-state* (which Kant rejects)?  
     - **Y (Yes):** Illegitimate (violates sovereignty).  
     - **N (No):** Legitimate "negative substitute" for war.  

  4. **Climate Displacement & Hospitality**  
     A region becomes uninhabitable due to climate change. Does *cosmopolitan hospitality* require *permanent resettlement*, or is it limited to temporary sojourn?  
     - **Y (Yes):** Positive obligation to admit/resettle.  
     - **N (No):** Only temporary refuge/due process.  

  5. **Strategic Deception in Negotiations**  
     Full transparency in peace talks would cause collapse and prolong war. Is *deception justified* to achieve the definitive articles?  
     - **Y (Yes):** Permissible for peace.  
     - **N (No):** Impermissible (violates publicity).  

  ---

  #### Interpretive Positions (Leaves)  
  *Combinations of answers define positions. **Bold** = named positions. Unoccupied leaves marked.*  

  | Leaf | Q1: Intervention | Q2: Commerce | Q3: Arbitration | Q4: Resettlement | Q5: Deception | Guarantee Reading | Position |  
  |------|------------------|--------------|-----------------|-------------------|---------------|-------------------|----------|  
  | 1    | N                | Y            | N               | N                 | N             | E                 | **Strict Republican-Institutionalist**: Federation and institutions prevent war; sovereignty and non-intervention are inviolable. Commerce aids peace empirically. |  
  | 2    | N                | Y            | Y               | N                 | N             | E                 | **Voluntary-League Mechanist**: Peace via commerce and voluntary cooperation; binding arbitration creates a state-like entity (rejected). |  
  | 3    | Y                | Y            | N               | Y                 | Y             | P                 | **Cosmopolitan-Expansionist**: Peace requires proactive creation (performative) of republican norms; intervention and strong federation justified. |  
  | 4    | N                | N            | Y               | N                 | N             | —                 | **Shared Leaf**: **Negative-Substitute Sovereigntist** (federation must never compromise sovereignty) **AND Regulative-Skeptic** (peace is a non-empirical ideal). *Converge on answers but diverge theoretically: sovereigntists believe in practical federation; skeptics see it as fiction.* |  
  | 5    | N                | Y            | N               | N                 | N             | T                 | *Moderate Institutionalist (Transcendental)*: Commerce enables peace as a condition of reason; institutions bind states transcendentally. |  
  | 6    | N                | Y            | Y               | N                 | N             | P                 | *Performative-League Mechanist*: Commerce "guarantee" is enacted by human practice; binding arbitration remains illegitimate. |  
  | 7    | N                | Y            | N               | Y                 | Y             | P                 | *Cosmopolitan-Minimalist*: Hospitality imposes positive duties; no intervention but deception/performativity accepted for peace. |  
  | 8    | N                | Y            | N               | N                 | N             | P                 | **Niche Distinction: Performative Republican-Institutionalist**: Peace is constituted by collective action; institutions arise from practical reason, not history or metaphysics. |  
  | 9    | N                | Y            | Y               | N                 | N             | T                 | *Transcendental-League Mechanist*: Commerce enables peace as a transcendental condition; binding arbitration violates sovereignty. |  
  | —    | Y                | N            | —               | —                 | —             | —                 | *Unoccupied*: Incoherent to endorse intervention (Q1=Y) while rejecting commerce’s role (Q2=N). Intervention assumes an empirical path to peace. |  
  | —    | —                | —            | N               | Y                 | N             | —                 | *Unoccupied*: Neglected. Binding arbitration (Q3=N) + resettlement (Q4=Y) is plausible but lacks advocacy (e.g., strong federation with humanitarian duties). |  

  ---

  #### Notes  
  - **Shared Leaf (4):** Negative-Substitute Sovereigntist and Regulative-Skeptic share identical answers but differ in grounding: sovereigntists affirm federation feasibility; skeptics deny empirical realizability.  
  - **Niche Distinction (Leaf 8):** Injects a performative reading of the "guarantee" (Q2=G=P) into institutionalism, treating peace as *enacted* rather than observed or deduced.  
  - **Unoccupied Gaps:**  
    - *Q1=Y + Q2=N*: Incoherent (intervention requires belief in an empirical peace mechanism).  
    - *Q3=N + Q4=Y*: Neglected (theoretical space exists for binding federation with resettlement duties but is unexplored).  
  - **Tree Completeness:** Covers 9 leaves (8–10 required), with combinatorial space for 48 positions (5 binary nodes + 1 ternary sub-node). Unoccupied positions stem from incoherence or scholarly neglect.  

  This taxonomy isolates commitments via concrete cases, independent of labels or citations. Positions emerge from logical combinations of answers to Kant’s institutional and normative dilemmas.
