prompt: |-
  I'm trying to sort out what I actually think about the moral equality of combatants, going by my gut on specific cases. A drafted soldier fighting for an unjust invasion: I think he still has the same right not to be killed as the defender, he didn't choose the war. A volunteer who enlists knowing the cause is unjust: I think he loses that equality, he's culpable. A mercenary fighting purely for money with no idea whether the cause is just: weird, I think he retains equality, like he's just an instrument? No wait, that feels wrong — maybe he dosent. A civilian who grabs a rifle when her town is attacked, even if her side is technically the aggressor: I think she gets full combatant rights anyway. A drone pilot in Nevada: I think equality applies symetrically here, but I'm shaky. Then there's an autonomous weapons system trained only on data from just wars, now selecting targets for an unjust conflict: I feel there's no equality, but I can't tell if that's because there's no agent or because the cause is bad. The tension is that the mercenary and the AI both lack knowledge of justice, yet I treat them differently. Is there one principle that captures all this, or close? What does it predict for a cyber-combatant who only disrupts logistics but never kills? And be honest about which of my verdicts has to go. Keep it tight — max 200 words, bottom-line principle first, then map it to my cases.
reasoning: |-
  Okay, let me unpack this user's moral dilemma about combatant equality. They're wrestling with intuitive judgments across varied cases - drafted soldiers, volunteers, mercenaries, civilians, drone operators, and even AI systems. The core tension seems to be between voluntariness and knowledge of injustice as determinants of moral status.

  Hmm, their draft case feels straightforward - coercion clearly mitigates responsibility. But the volunteer who knowingly joins an unjust cause? That's where culpability kicks in. The mercenary example is tricky though - they're exchanging moral agency for money, yet the user initially leans toward excusing them like tools before doubting that impulse. Interesting how the civilian defender gets automatic sympathy regardless of macro-level aggression.

  Ah! The drone pilot and AI cases reveal the real puzzle. Both lack situational awareness, but the user intuitively denies moral standing to the machine. Is that because AI lacks consciousness, or because it's serving injustice? Their closing question about cyber-combatants disrupting logistics adds another layer - does harm type affect moral equivalence?

  I notice they're self-aware about inconsistencies, especially between mercenary and AI judgments. They want a unifying principle but seem prepared to abandon some intuitions. The word limit forces conciseness - better anchor everything to culpability/knowledge rather than dive into debates about non-human agents.
answer: |-
  **Bottom-line principle:** Moral equality hinges on *culpable participation in unjust harm*. Combatants forfeit equal protection only if they *voluntarily serve an unjust cause they knew or should have known was unjust*.

  **Your cases mapped:**

  1.  **Drafted Soldier:** Retains equality. Lack of voluntariness negates culpability.
  2.  **Volunteer (Knowing Unjust Cause):** Loses equality. Voluntary, knowing participation makes culpable.
  3.  **Mercenary (Ignorant):** *Loses equality.* Voluntarily accepts payment to inflict harm in ignorance; culpable for reckless disregard of justice. (Your initial instinct was flawed).
  4.  **Civilian Defender (Aggressor Side):** Retains equality. Fighting defensively against immediate attack (even if side is aggressor) isn't culpable participation in the *unjust aggression*.
  5.  **Drone Pilot:** Equality applies *if* unaware of cause's injustice. Loses equality *if* knowingly participating in unjust strikes (like the volunteer).
  6.  **Autonomous Weapons System (AWS):** No equality applies. Not a moral agent. Its "action" is solely attributable to its culpable deployers.
  7.  **Cyber-Combatant (Non-Lethal):** Retains equality. Disrupting logistics is a combat function, but without direct lethal intent/knowledge of the conflict's overall injustice, culpability doesn't reach the threshold for forfeiting protection.

  **Verdict that must go:** Your initial leniency toward the ignorant mercenary. Voluntarily selling lethal services without regard for justice is culpable recklessness.
