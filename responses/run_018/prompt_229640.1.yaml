prompt: |-
  I work for a county parks department and somehow I've ended up as the person who signs off on all our pest-control plans. Mosquito spraying, treating ant colonies near picnic tables, gassing a wasp nest in a playground tunnel, that sort of thing. A few cases cross my desk every month, more in summer.

  Here's my problem. I've read enough of the recent arguments about insect sentience to be genuinely bothered. The basic move is a scale argument: even if the probability that an ant or a mosquito suffers is small, we kill them in such staggering numbers that the expected suffering swamps almost everything else we worry about. But taken at face value this argument seems to prove I should never approve anything, ever, which isn't a procedure, it's a nervous breakdown. Meanwhile if I just ignore it I feel like I'm doing the thing where we decide animals don't count because counting them is inconvenient.

  So: write me an actual decision procedure I can run in under an hour per case, no entomologist on staff, with anything expensive getting countersigned by the parks board chair. I want tests to run in order, roughly: how strong is the evidence for sentience in this group of insects (I'd expect the answer to differ for bees vs springtails, and I want the procedure to tell me how to handle groups where nobody has looked at all), how many individuals does the intervention affect, how necessary is the outcome (disease vector vs. people finding ants icky), and whether a different method would kill fewer or kill faster or not kill at all. Crucially I want the procedure to have a non-crazy default for when the sentience evidence is thin, so that "we don't know" doesn't automatically mean both "do nothing" and "do whatever". And tell me where the procedure should just refuse to give an answer and kick it up to a human.

  Show it working on three cases: aerial spraying for mosquitoes after West Nile was detected in the county, baiting the ant hills by the picnic area, and destroying a wasp nest in a piece of play equipment. One of those should come out as an answer I won't like and won't be able to sell to the public -- and the procedure should be able to say why that's the right call anyway, or admit where it can't.
reasoning: |-
  We are designing a decision procedure for pest control interventions that considers insect sentience, the scale of impact, necessity, and alternatives. The procedure will have a series of tests (steps) to run in order. We will use a scoring system to aggregate factors and make a decision. The procedure will also include a mechanism to handle uncertainty and to escalate when needed.

  ### Key Considerations:
  1. **Sentience Evidence**: We need a way to assess the evidence for sentience in the insect group. We can categorize known groups and have a default for unknown groups.
  2. **Scale**: The number of individuals affected.
  3. **Necessity**: Why we are doing the intervention? (e.g., disease vector, safety, nuisance)
  4. **Alternatives**: Are there methods that kill fewer, kill faster (potentially reducing suffering), or avoid killing?

  ### Outline of the Decision Procedure:

  **Step 1: Identify the Insect Group and Sentience Evidence**
     - Use a predefined table of insect groups with a sentience score (0 to 5) based on current scientific consensus. The score reflects the strength of evidence for sentience (0: no evidence, 5: strong evidence). 
     - For groups not in the table, assign a default score of 1 (low evidence) and note the uncertainty.
     - Example table (simplified for common groups):
          - Mosquitoes: 2 (some evidence of nociception and learning, but limited)
          - Ants: 3 (more complex social behaviors, evidence of learning and communication)
          - Wasps: 3 (similar to bees, which are often considered to have higher sentience)
          - Bees: 4 (strong evidence of learning, memory, and pain responses)
          - Springtails (or other non-insect arthropods): 0 (no known evidence)
          - Unknown: 1 (default)

  **Step 2: Estimate the Number of Individuals Affected (Scale)**
     - This will be a rough estimate (order of magnitude) of the number of insects that will be killed or affected.
     - We'll use a logarithmic scale for scoring to handle large ranges. For example:
          - 1-10: 1
          - 11-100: 2
          - 101-1,000: 3
          - 1,001-10,000: 4
          - 10,001-100,000: 5
          - 100,001-1,000,000: 6
          - >1,000,000: 7

  **Step 3: Assess the Necessity of the Intervention**
     - We assign a necessity score (0 to 5) based on the reason:
          - 5: Critical (e.g., vector of serious disease, immediate safety hazard)
          - 4: High (e.g., safety hazard but not immediate, like a wasp nest in a low-traffic area)
          - 3: Moderate (e.g., nuisance that affects park usability, like ants at a picnic area causing frequent complaints)
          - 2: Low (e.g., cosmetic or very minor nuisance)
          - 1: Very low (e.g., purely aesthetic)
          - 0: Unnecessary

  **Step 4: Evaluate Alternatives**
     - We look for alternatives that:
          a) Avoid killing (e.g., exclusion, repellents, relocation)
          b) Reduce the number killed (e.g., targeted instead of broadcast)
          c) Reduce suffering (e.g., faster killing methods)
     - We assign an alternatives score (0 to 5) that represents how much better the alternative is:
          - 5: Excellent alternative that avoids killing entirely and is feasible.
          - 4: Very good alternative that significantly reduces the number or suffering (e.g., 90% reduction).
          - 3: Good alternative that moderately reduces (e.g., 50-90% reduction).
          - 2: Slight improvement (e.g., 10-50% reduction).
          - 1: Minimal improvement (less than 10% reduction).
          - 0: No alternative available or the current method is already the best.

  **Step 5: Calculate a Total Score and Make a Decision**
     - We combine the scores with weights to reflect their importance. The weights are:
          - Sentience (S): weight 3 (because if there's no sentience, the rest doesn't matter as much)
          - Scale (N): weight 2 (because the number of individuals matters, but only if they can suffer)
          - Necessity (Ne): weight 4 (because we have to protect human health and safety)
          - Alternatives (A): weight 3 (because we have an obligation to seek better methods)

     - Total Score = (S * 3) + (N * 2) + (Ne * 4) + (A * 3)

     - The maximum total score is (5*3 + 7*2 + 5*4 + 5*3) = 15+14+20+15 = 64.

     - We set thresholds:
          - Approve: Total Score >= 40
          - Reject: Total Score <= 20
          - For scores between 20 and 40, we require additional review (escalate to the parks board chair or a committee).

     - However, note: if the sentience score is 0 (or very low, say 0 or 1) and the necessity is high, we might approve even if the scale is high. Conversely, if sentience is high and the necessity is low, we might reject.

     - Alternatively, we can use a decision matrix that overrides the total score in extreme cases:
          - If sentience score is 0, then approve without further consideration (unless there are non-sentience environmental concerns, but that's beyond our scope).
          - If necessity is 5 (critical) and there are no alternatives (A=0), then approve regardless of sentience and scale? But we must be cautious.

     - We'll design the formula so that high necessity can outweigh sentience and scale, but high sentience and high scale require high necessity and good alternatives to approve.

     - We can also have a rule: if the sentience score is 4 or 5 and the scale is 5 or above (meaning more than 10,000 individuals) and the necessity is below 3, then reject.

  **Step 6: Escalation**
     - If the procedure results in a score in the middle range (20 < total score < 40), or if there is a conflict (e.g., high sentience and high necessity but no alternatives), then escalate to the parks board chair for a decision with a written explanation.

     - Also, if the insect group is unknown and there is significant uncertainty in the sentience score, and the scale is large, escalate.

  ### Example Cases:

  #### Case 1: Aerial spraying for mosquitoes after West Nile detected
     - **Sentience**: Mosquitoes -> 2
     - **Scale**: Aerial spraying in a county area. This can kill millions of mosquitoes and non-target insects. Let's say 1,000,000+ -> 7
     - **Necessity**: Disease vector (West Nile virus) -> 5 (critical)
     - **Alternatives**: Are there alternatives? Targeted spraying (e.g., larvicides or localized adulticides) might reduce the number killed. However, aerial spraying is often done because it's effective for rapid control. If we are using the standard method, then alternatives might be limited. Let's say we are considering an alternative: larviciding programs and public education to reduce breeding sites, but that might not be immediately effective. For the purpose of this case, we assume the current plan is aerial spraying and no immediate alternative is available -> score 0 (no alternative) or 1 (minimal improvement if we reduce the area). Let's assign 1.

     Total Score = (2*3) + (7*2) + (5*4) + (1*3) = 6 + 14 + 20 + 3 = 43 -> Approve.

     But note: The high scale and low alternatives score make this borderline. The high necessity pushes it to approval. However, we might want to consider if there is a way to improve the alternatives score by changing the method.

  #### Case 2: Baiting the ant hills by the picnic area
     - **Sentience**: Ants -> 3
     - **Scale**: A few ant hills. Each colony might have 1,000 to 10,000 ants. Let's say 3 hills with 5,000 each -> 15,000 -> score 5 (10,001-100,000: 5? Actually, 15,000 is in 10,001-100,000 -> 5)
     - **Necessity**: Nuisance. People are complaining about ants at picnic tables. This is a moderate nuisance -> 3
     - **Alternatives**: Are there alternatives? We could use physical barriers (talc barriers, moats) or relocate the nests? Relocation might be difficult. Repellents? But baiting is common. Let's say we found a method that kills faster (reducing suffering) but still kills the same number. Then alternatives score might be 1 (minimal improvement). If there is a non-lethal method that works, we would assign a higher score. But non-lethal methods for ants are often not effective. So we assign 1.

     Total Score = (3*3) + (5*2) + (3*4) + (1*3) = 9 + 10 + 12 + 3 = 34 -> This falls in the middle (between 20 and 40). We must escalate to the parks board chair.

     Explanation: The sentience and scale are significant, and the necessity is only moderate. We should explore better alternatives.

  #### Case 3: Destroying a wasp nest in a playground tunnel
     - **Sentience**: Wasps -> 3 (similar to bees, but let's use 3)
     - **Scale**: One nest, typically 100-5,000 wasps. Let's say 500 -> score 3 (101-1,000: 3? Actually 500 is in 101-1,000 -> 3)
     - **Necessity**: Safety hazard. Wasps in a playground tunnel pose a risk of stings, especially to children. This is a high safety risk -> 4 (not critical because it's one nest and we can block the tunnel until removal, but it's urgent).
     - **Alternatives**: We can use a method that kills quickly (gassing) which might be faster than baiting. Also, we could remove the nest at night when wasps are less active and relocate it? Relocation is possible but risky. If we have a method that kills quickly, that reduces suffering. But if we can relocate, that avoids killing. Let's say we have the option to relocate: assign 4 (very good alternative if feasible). However, if relocation is not feasible (e.g., too dangerous, or no one to do it), then we might use a fast-killing method and assign 2 (slight improvement). For this example, we assume relocation is not feasible and we are using a fast-killing method -> 2.

     Total Score = (3*3) + (3*2) + (4*4) + (2*3) = 9 + 6 + 16 + 6 = 37 -> This is in the middle (20-40). Escalate to the parks board chair.

     But note: We might be able to avoid killing by relocation. If we can, then the alternatives score becomes 4 or 5, and the total becomes 9+6+16+ (4*3)=9+6+16+12=43 -> Approve. Or 9+6+16+15 (if 5)=46 -> Approve. So the procedure encourages seeking relocation.

  ### One Case That Comes Out Unfavorable and Hard to Sell:

  Let's revisit Case 2: Ant baiting. The procedure says escalate because the total score is 34. We might not like this because we have to go to the board for a common procedure. The public expects the ants to be controlled. However, the procedure is highlighting that the ants might be sentient, we are killing a lot of them, and there might be better ways. We must document that we are exploring non-lethal methods.

  ### Adjustments and Notes:
  - The weights and thresholds are somewhat arbitrary and can be adjusted based on values and experience.
  - We must document the reasoning for each case.
  - For groups with unknown sentience, we use a default of 1. This means we don't automatically stop everything, but we also don't ignore the possibility. We can also flag unknown groups for review by a biologist if available, but without one, we use the default.

  ### Final Procedure Steps:

  1. **Identify insect group and assign sentience score (S)** from the table (with default 1 for unknown).
  2. **Estimate the number of individuals (N)** and assign a scale score (1-7).
  3. **Assess necessity (Ne)** and assign a score (0-5).
  4. **Evaluate alternatives (A)** and assign a score (0-5). Consider:
     - Can we avoid killing? (highest priority)
     - Can we reduce the number killed?
     - Can we use a method that kills faster (reducing suffering per individual)?
  5. **Calculate total score**:
     Total = (S * 3) + (N * 2) + (Ne * 4) + (A * 3)
  6. **Decision**:
     - If Total >= 40: Approve
     - If Total <= 20: Reject
     - If 20 < Total < 40: Escalate to parks board chair with explanation
  7. **Additional rules**:
     - If S=0, then automatically approve (unless there are other non-sentient environmental concerns that would require review, but that's beyond our sentience scope).
     - If Ne=5 (critical necessity) and A=0 (no alternative), then approve regardless of total score? We have to be cautious because if S and N are very high, it might still be a huge amount of suffering. However, in the formula, Ne=5 and A=0 gives at least 20 points from necessity and alternatives, plus whatever S and N contribute. It might be enough to push it over 40. But if not, we can have an override: if Ne=5 and A=0, then approve. However, we might want to avoid overrides to keep it simple. Alternatively, let the total score handle it: if Ne=5 and A=0, then even with S=1 and N=7, we get (1*3)+(7*2)+20+0 = 3+14+20=37 -> escalate, which might be appropriate because we want to double-check such a case.

  Given the complexity, we might stick to the total score without overrides and let the escalation handle the tough cases.

  ### Implementation:

  We can create a simple form or spreadsheet for each case that calculates the score.

  Example form:

  | Factor                | Score | Weight | Contribution |
  |-----------------------|-------|--------|-------------|
  | Sentience (S)        |       | 3      | S * 3       |
  | Scale (N)            |       | 2      | N * 2       |
  | Necessity (Ne)        |       | 4      | Ne * 4      |
  | Alternatives (A)      |       | 3      | A * 3       |
  | **Total**            |       |        | **Sum**     |

  Then, based on the total, decide.

  This procedure should take under an hour per case, especially with practice and a reference table for sentience scores.

  Let me know if you need adjustments.
answer: |-
  Here's a practical, tiered decision procedure designed for your constraints, incorporating ethical weight, necessity, and alternatives. It uses a points-based system to avoid paralysis by uncertainty, with clear escalation triggers. The core principle: **"Uncertain sentience warrants precaution, but not prohibitive inaction."**

  ### Decision Procedure: Insect Intervention Review (15-45 min/case)
  **Tools Needed:** Basic web access (for quick research), calculator, your internal incident reports.

  ---

  #### **Step 1: Sentience Pre-Assessment (5 min)**
  *   **Goal:** Assign a "Sentience Caution Level" (SCL) to the insect group.
  *   **Method:**
      1.  **Check Pre-Defined Groups (see table below).** If match, use assigned SCL.
      2.  **Unknown Group?** Spend 5 min searching: "[Insect] sentience evidence" + "[Insect] pain perception." Look for:
          *   Neurological studies (brain complexity, opioid receptors)
          *   Behavioral studies (learning avoidance, protective behaviors)
          *   Consensus reviews (e.g., IPIEC reports)
      3.  **Assign SCL (0-3):**
          *   **3 (High Caution):** Strong evidence of capacity for suffering/valenced experience (e.g., **Honeybees**, **Wasps**). *Requires strongest justification.*
          *   **2 (Moderate Caution):** Credible evidence or significant debate, but not conclusive (e.g., **Ants**, **Mosquitoes**). *Requires substantial justification.*
          *   **1 (Low Caution):** Limited or no evidence, minimal nervous system (e.g., **Springtails**, **Termites (debated)**). *Presumption toward action if needed.*
          *   **0 (Negligible Caution):** No credible evidence, reflex-dominated (e.g., **Fleas**, **Lice**). *Action generally permissible.*
          *   **Default for Unknown:** **SCL 2 (Moderate Caution)**. "We don't know" defaults to precaution but not prohibition.

  *Pre-Defined SCL Table (Expandable):*
  | Insect Group         | SCL | Rationale                                                                 |
  | :------------------- | :-: | :------------------------------------------------------------------------ |
  | Honeybees, Bumblebees | 3   | Complex learning, pain behaviors, opioid responses. Strong consensus.     |
  | Wasps, Hornets       | 3   | Similar neurobiology & behavior to bees. Increasing evidence.             |
  | Ants                 | 2   | Demonstrated learning/memory, but debate on subjective experience.        |
  | Mosquitoes           | 2   | Some nociception evidence, limited learning capacity. High uncertainty.   |
  | Flies (House, Fruit) | 2   | Moderate learning, some pain receptor evidence.                           |
  | Cockroaches          | 1   | Basic nociception, limited behavioral evidence for suffering.             |
  | Springtails, Mites   | 1   | Minimal nervous systems, no credible evidence for sentience.              |
  | Termites             | 1   | Debate exists; limited evidence leans toward reflexive dominance.         |
  | *Unknown Species*    | *2* | *Precautionary default.*                                                  |

  ---

  #### **Step 2: Impact Scale & Suffering Estimate (5 min)**
  *   **Goal:** Quantify the expected harm magnitude.
  *   **Method:**
      1.  **Estimate Individuals Affected (N):** Use order of magnitude (e.g., 10, 100, 1k, 10k, 100k, 1M+).
      2.  **Estimate Suffering Duration (D):** In seconds/minutes of likely distress before death (e.g., spraying = hours; gassing = seconds; baiting = days). Use:
          *   Vendor data on insecticide speed.
          *   Known biology (e.g., neurotoxins fast, digestive poisons slow).
      3.  **Calculate Crude "Harm Potential" (HP):** `HP = N * D`. Use logarithmic scale:
          *   **Low:** HP < 1,000 (e.g., 100 ants dying in 10 sec = 1,000)
          *   **Medium:** HP 1,000 - 1,000,000 (e.g., 1k mosquitoes dying in 1 hr/3,600 sec = 3.6M)
          *   **High:** HP > 1,000,000 (e.g., aerial spraying: 1M+ insects dying slowly).

  ---

  #### **Step 3: Necessity Assessment (5 min)**
  *   **Goal:** Evaluate the human/ecological imperative.
  *   **Method:** Assign to one category:
      *   **A (Critical):** Direct, imminent threat to human health/safety (e.g., **Disease vector control**, **Nest in high-traffic playground**).
      *   **B (Substantial):** Significant nuisance impacting park usability or ecological damage (e.g., **Invasive species**, **Structural damage**).
      *   **C (Moderate):** Aesthetic or minor comfort issue (e.g., **Ants near but not ON tables**, **Spiders in unused shelter**).
      *   **D (Low):** Purely preemptive or cosmetic.

  ---

  #### **Step 4: Alternatives Check (10 min)**
  *   **Goal:** Identify harm-reduction options. **Document why alternatives are/aren't feasible.**
  *   **Method:** Investigate:
      1.  **Avoid Killing:** Exclusion (sealing nests), repellents, relocation, habitat modification? Feasible? Effective?
      2.  **Reduce Numbers:** Targeted vs. broadcast application? Larvicides vs. adulticides? Precision methods?
      3.  **Reduce Suffering:** Faster-acting agents? Methods causing instant death (e.g., mechanical destruction vs. slow poison)?
  *   **Scoring:** If a feasible alternative significantly improves on (1), (2), or (3) vs. proposed plan, it **must** be prioritized. If none exist, note this.

  ---

  #### **Step 5: Decision Matrix (5 min)**
  *   **Goal:** Synthesize inputs into approve/reject/escalate.
  *   **Method:** Use the matrix below. **If "Escalate" or "Reject," proceed to Step 6.**

  | SCL | Harm Potential (HP) | Necessity (NEC)                 | Decision              | Rationale                                                                 |
  | :-: | :------------------ | :------------------------------ | :------------------- | :------------------------------------------------------------------------ |
  | 0-1 | Any                 | Any                             | **Approve**          | Negligible/little sentience evidence.                                     |
  | **2** | **Low**             | A, B, C, D                      | **Approve**          | Low overall harm potential.                                               |
  | **2** | **Medium**          | A (Critical)                    | **Approve**          | Critical need outweighs medium harm.                                      |
  | **2** | **Medium**          | B (Substantial)                 | **Approve^**         | Approve, but document alternatives search.                                |
  | **2** | **Medium**          | C, D (Moderate/Low)             | **Escalate**         | Questionable justification. Seek less harmful method or tolerance.        |
  | **2** | **High**            | A (Critical)                    | **Escalate**         | High harm potential requires board review.                                |
  | **2** | **High**            | B, C, D                         | **Reject**           | Harm unjustified by non-critical need.                                    |
  | **3** | **Low**             | A, B                            | **Approve^**         | High caution, but low harm/critical need.                                 |
  | **3** | **Low**             | C, D                            | **Escalate**         | Avoid killing unless strictly necessary.                                  |
  | **3** | **Medium**          | A (Critical)                    | **Escalate**         | Board must weigh critical need vs. high caution/medium harm.              |
  | **3** | **Medium**          | B, C, D                         | **Reject**           | Unjustified harm to high-sentience group.                                 |
  | **3** | **High**            | Any                             | **Reject**           | Prohibitively high expected suffering.                                    |

  **^Approve with Conditions:** *Requires documented evidence that alternatives were considered and the fastest/least-broadcast method was chosen.*

  ---

  #### **Step 6: Escalation/Rejection Protocol (As Needed)**
  *   **Escalate to Parks Board Chair If:**
      *   Matrix says "Escalate."
      *   High uncertainty in SCL *and* Medium/High HP.
      *   Feasible alternatives exist but are costly/complex.
      *   **Deliverables:** SCL rationale, HP calculation, NEC category, alternatives analysis, recommended action.
  *   **Reject and Document If:**
      *   Matrix says "Reject."
      *   **Mandatory Documentation:** Justification referencing SCL, HP, NEC, and alternatives. Propose non-lethal management or public education.

  ---

  ### Case Applications

  #### **Case 1: Aerial Spraying for Mosquitoes (West Nile Detected)**
  *   **SCL:** Mosquitoes = **2 (Moderate Caution)**.
  *   **HP:** N = 1,000,000+ (broadcast spray). D = Hours (neurotoxin). **HP = High (>>1M)**.
  *   **NEC:** **A (Critical)** - Disease vector control.
  *   **Alternatives:** Larvicide programs (reduces N significantly but slow), targeted spraying (reduces N but less effective). Current plan is broad adulticide.
  *   **Decision Matrix:** SCL=2, HP=High, NEC=A → **Escalate to Board**.
  *   **Why?** High harm potential to a moderately sentient group demands board scrutiny despite critical need. The procedure forces consideration of whether targeted/larvicide options could reduce HP to "Medium" (which would trigger approval). *This outcome may be unpopular (delays action), but it’s defensible:* Critical need doesn't automatically override massive scale when suffering is plausible. The board must explicitly endorse the scale/suffering trade-off.

  #### **Case 2: Baiting Ant Hills by Picnic Area**
  *   **SCL:** Ants = **2 (Moderate Caution)**.
  *   **HP:** N = 5,000 (typical colony). D = Days (slow-acting bait). **HP = Medium (~250k-500k)**.
  *   **NEC:** **C (Moderate)** - Nuisance (ants near tables, not anaphylaxis risk).
  *   **Alternatives:** Diatomaceous earth (physical killer, faster?), boiling water (instant, but labor-intensive), relocate nest (non-lethal, feasible for accessible hills). Baiting is standard but slow.
  *   **Decision Matrix:** SCL=2, HP=Medium, NEC=C → **Escalate**.
  *   **Why?** Only "Moderate" necessity doesn't justify medium harm to moderately sentient insects. Escalation prompts exploring faster-killing or non-lethal methods. *Public may see this as overkill for "just ants," but the procedure highlights that scale + suffering duration + alternatives matter.*

  #### **Case 3: Destroying Wasp Nest in Playground Tunnel**
  *   **SCL:** Wasps = **3 (High Caution)**.
  *   **HP:** N = 200 (small nest). D = Seconds (rapid gassing). **HP = Low (<1k)**.
  *   **NEC:** **A (Critical)** - High-risk sting location (children, enclosed space).
  *   **Alternatives:** Relocation possible but risky/delayed. Gassing is fastest (minimizes suffering).
  *   **Decision Matrix:** SCL=3, HP=Low, NEC=A → **Approve with Conditions** (use fastest method).
  *   **Why?** High sentience caution is mitigated by low individual count, instant death, and critical safety need. Procedure approves but mandates least-suffering method.

  ---

  ### Key Features & Why It Works
  1.  **Manages Uncertainty:** Default SCL=2 for unknowns prevents "do nothing" or "do anything" extremes. Precaution is applied proportionally.
  2.  **Scalable:** Uses orders of magnitude, not precise counts. Relies on quick research/pretables.
  3.  **Forces Alternatives Consideration:** Even approvals require documenting why better options weren't chosen.
  4.  **Escalates Judgement Calls:** Board handles high-stakes trade-offs (scale vs. necessity) or unclear SCL.
  5.  **Produces Defensible Outcomes:** Rejections/escalations are tied to explicit thresholds (SCL, HP, NEC), not personal bias. The "unpopular" mosquito case escalation is justified by raw scale + suffering potential.
  6.  **Adaptable:** Weights/thresholds can be adjusted by the board as science evolves.

  **Final Note:** This procedure makes ethics operational without requiring paralysis. It accepts that some actions harming insects are necessary but demands justification proportional to the plausibility of suffering and scale. When in doubt, it errs on the side of caution and transparency, kicking tough calls to the board.
