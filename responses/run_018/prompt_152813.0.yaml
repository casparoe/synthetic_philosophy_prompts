prompt: |-
  hey so i've been arguing with friends about whether we can ever meaningfully say one person is "better off" than another in a way that justifies policy, and I realised I don't even know what I'd want a theory of interpersonal utility comparision to do. can you lay out the full desiderata? like, the complete spec: what phenomena it has to cover (cross-cultural welfare assessments, comparing people with radically different baselines or sensory architectures, maybe even artificial agents with non-phenomenal goals?), which distinctions it must preserve (welfare level versus welfare change, comparison versus aggregation, objective versus subjective metrics), and what conceptual or empirical constraints it can't violate. for each one, say why it's non-negotiable versus just a camp preference, and flag any pair you think might be jointly unsatisfiable—i'm especially suspicious of a tension cluster involving scale-invariance, respect for individual baselines, and the need for a public intersubjective metric. if those three can't sit together, say so and explain which one usually gets sacrificed in practice.

  then briefly, very briefly, check how the usual suspects do: von Neumann-Morgenstern style cardinalization, preference-satisfaction indexing, and some kind of hedonic or experiential normalization. keep the scoring short; the criteria list is the actual deliverable. also inject a stress-test involving people who don't just have different preferences but genuinely different "utility structures"—different ways of experiencing or encoding value—so the theory can't just assume a shared psychological currency. finally, be explicit about where your reasoning is weakest: what counterexample, empirical finding, or theoretical result would make you drop one of these desiderata, or dissolve the tension cluster you identify?
reasoning: |-
  Okay, the user is asking for a comprehensive set of desiderata for a theory of interpersonal utility comparison (IUC) that can justify policy decisions. They want to know what such a theory must cover, which distinctions it needs to preserve, and what constraints it can't violate. They're particularly interested in tensions between scale-invariance, respecting individual baselines, and having a public metric, and how existing approaches handle these.

  First, I need to outline the essential criteria. The user mentioned phenomena like cross-cultural comparisons, different sensory architectures, and even artificial agents. So, the desiderata should include scope universality, radical heterogeneity accommodation, and non-phenomenal inclusion. Each of these is crucial because without them, the theory can't handle real-world diversity, making it useless for global policies.

  Next, distinctions to preserve: welfare level vs. change, comparison vs. aggregation, and objective vs. subjective metrics. These are non-negotiable because policy decisions need to differentiate between current well-being and improvements, compare individuals without necessarily summing utilities, and balance subjective experiences with objective needs. Mixing these up could lead to flawed policies, like misallocating resources.

  Constraints are trickier. Scale-invariance is necessary for meaningful comparisons across different utility scales. Respecting baselines avoids imposing external standards, which is vital for autonomy. But these clash with the need for a public metric that's intersubjectively verifiable. In practice, baseline respect often gets sacrificed, as seen in cost-benefit analyses using money metrics that ignore individual differences.

  Now, evaluating approaches: VNM utilities require consistent preferences, which many people don't have. Preference satisfaction ignores adaptive preferences. Hedonic measures face measurement issues. The stress-test with different utility structures, like synesthetes or AIs, shows that most theories fail here. They assume a common currency, which doesn't hold in such cases.

  The user's deeper need might be understanding if a universally applicable IUC is possible or if compromises are inevitable. They might be looking for a framework to critique policies or academic debates. Highlighting the tension cluster and how existing methods sacrifice baseline respect addresses their suspicion. Also, pointing out where the reasoning is weakest—like empirical evidence of non-comparable utility structures—shows intellectual honesty.

  Finally, the counterexample of neurodivergent individuals or AIs could force dropping non-phenomenal inclusion or accepting weaker comparisons. This ties back to the user's request for potential deal-breakers. Overall, the answer should clarify that while ideal desiderata exist, practical solutions involve trade-offs, especially sacrificing individual baselines for a workable public metric.
answer: |-
  Here's the complete desiderata specification for a theory of interpersonal utility comparison (IUC), structured as requested. The core tension cluster you identified is indeed critical and likely unresolvable under ideal conditions.

  ---

  ### **I. Phenomena the Theory Must Cover (Scope)**
  1.  **Cross-Cultural Welfare Assessments (Non-Negotiable):** Must compare welfare across diverse cultural norms and values (e.g., individualistic vs. collectivist societies). *Why:* Policy (e.g., global aid, human rights) requires transcending parochialism.
  2.  **Radical Baseline Heterogeneity (Non-Negotiable):** Must handle individuals with vastly different adaptation levels (e.g., chronic pain patient vs. healthy person, historically oppressed group vs. privileged group). *Why:* Ignoring baselines justifies exploitation via "they're used to it" arguments.
  3.  **Diverse Sensory/Experiential Architectures (Non-Negotiable):** Must compare beings with different qualia (e.g., colorblind vs. tetrachromat, human vs. potential alien/animal consciousness). *Why:* To avoid anthropocentrism and cover disability/neurodiversity.
  4.  **Non-Phenomenal Goal Pursuers (Camp Preference -> Emerging Need):** Must account for entities without subjective experience but with "goal satisfaction" (e.g., advanced AI, corporate entities). *Why:* Future policy relevance; excluding them risks bad governance of non-human agents.

  ### **II. Distinctions the Theory Must Preserve**
  5.  **Welfare Level vs. Welfare Change (Non-Negotiable):** Must distinguish *absolute* well-being (e.g., "A is worse off than B") from *marginal* changes (e.g., "Policy X helps A more than B"). *Why:* Policies often target improvements, not just snapshots; conflating them distorts priority-setting.
  6.  **Comparison vs. Aggregation (Non-Negotiable):** Must enable ordinal/comparative judgments ("A > B") *without* necessarily supporting cardinal summation ("A+B = Total Social Welfare"). *Why:* Aggregation requires stronger assumptions; comparison is a prerequisite for many equity-focused policies.
  7.  **Objective Constraints vs. Subjective Metrics (Non-Negotiable):** Must respect subjective experience while incorporating objective welfare constraints (e.g., basic needs, autonomy, avoiding false consciousness). *Why:* Pure subjectivism ignores oppression (e.g., "happy slave"); pure objectivism ignores individual diversity.

  ### **III. Conceptual/Empirical Constraints**
  8.  **Scale-Invariance (Non-Negotiable):** Comparisons must be invariant under positive affine transformations of individual utility functions (i.e., "rescaling" doesn't change who is better off). *Why:* Utility is ordinal at the individual level; comparisons shouldn't depend on arbitrary scaling choices.
  9.  **Respect for Individual Baselines (Non-Negotiable):** Cannot assume a common "zero" or "neutral" point across individuals. *Why:* Baselines are shaped by biology, history, and adaptation; ignoring this invalidates comparisons (e.g., "giving water to a dehydrated vs. satiated person").
  10. **Public Intersubjective Metric (Non-Negotiable):** Must yield empirically measurable/verifiable proxies for policy use (e.g., via behavior, biomarkers, stated preferences). *Why:* Policy requires operationalizable evidence, not private introspection.
  11. **No A Priori Utility Structure Assumption (Non-Negotiable):** Cannot presuppose universal psychological structure (e.g., "all humans value pleasure/pain similarly"). *Why:* Begs the question against radical heterogeneity (Phenomenon #2, #3).

  ### **IV. The Core Tension Cluster & Sacrifices**
  *   **Conflict:** **Scale-Invariance (8) + Baseline Respect (9) + Public Metric (10) are jointly unsatisfiable** under standard assumptions.
      *   Scale-invariance requires comparisons based on ratios or differences *within* an individual's utility scale.
      *   Baseline respect denies a common scale origin (zero point) or unit across individuals.
      *   A public metric typically requires a *common* cardinal scale (implying common unit/zero) for intersubjective measurement.
  *   **Sacrifice in Practice:** **Baseline Respect (9) is almost always sacrificed.** Standard policy tools (e.g., money-metric utils via willingness-to-pay, QALYs) impose:
      *   A common *unit* (e.g., dollars, life-years adjusted by "quality").
      *   An implicit common *zero* (e.g., "death = 0" in QALYs, "no income = 0" in cost-benefit analysis).
      *   This ignores how individuals scale and anchor their own welfare (e.g., a dollar means vastly different utility changes to a pauper vs. a billionaire; identical health states are experienced differently).

  ### **V. Stress-Test: Radically Different Utility Structures**
  *   **Scenario:** Compare a human, a sentient AI optimizing for computational elegance (non-phenomenal), a synesthete experiencing happiness as complex multi-sensory patterns, and a member of a species valuing stasis over change.
  *   **Challenge:** No shared "currency" (pleasure, preference intensity) exists. Preference orderings may be incommensurable (human: A>B>C; AI: C>B>A for structural reasons). Experiential reports are unintelligible across types.
  *   **Requirement:** A theory must find invariant relational properties (e.g., "distance from ideal state", "resource cost of achieving goal satisfaction", "functional capacity") without assuming shared phenomenology or preference rationality.

  ### **VI. Brief Evaluation of Approaches**
  | **Approach**               | **Key Mechanism**                     | **Fails Desiderata**                                  | **Stress-Test Failure**                          |
  | :------------------------- | :------------------------------------ | :---------------------------------------------------- | :----------------------------------------------- |
  | **VNM Cardinalization**    | Revealed preference under risk        | 2 (Baselines), 7 (Objectivity), 9 (Baseline Respect) | Requires consistent preferences; AI/synesthete preferences may violate axioms or be incomparable. |
  | **Preference Satisfaction**| Aggregating preference fulfillment    | 2 (Baselines), 7 (Objectivity), 9 (Baseline Respect) | Cannot compare strength across types; AI's "preferences" are instrumental, not welfare-relevant. |
  | **Hedonic Normalization**  | Neural/behavioral "pleasure" metrics  | 3 (Sensory Diversity), 4 (Non-Phenomenal), 9 (Baseline Respect) | Synesthete's "pleasure" isn't comparable; AI has no hedonic state. |

  ### **VII. Weak Points & Potential Deal-Breakers**
  1.  **Weakness in Scope (#4: Non-Phenomenal Agents):** Extending "welfare" to non-phenomenal entities is philosophically fraught. Is goal-satisfaction *welfare* without sentience?
      *   **Deal-Breaker:** Evidence that goal-satisfaction in AIs generates morally relevant claims *without* any phenomenal substrate would force inclusion. Absent this, it may remain optional.
  2.  **Weakness in Tension Cluster:** Sacrificing baseline respect (#9) is pragmatically necessary but ethically dubious.
      *   **Deal-Breaker:** Discovery of a *measurable neurobiological invariant* correlating robustly with experienced welfare across all humans (e.g., a specific neural signature of "suffering intensity") could provide a public metric (#10) *while* respecting baselines (#9) by measuring deviation from individual equilibrium. This might resolve the tension for humans (but not AI/synesthetes).
  3.  **Weakness in Stress-Test:** The theory likely remains anthropocentric.
      *   **Deal-Breaker:** Contact with a radically alien but undeniably sentient/welfare-having species with incommensurable utility structure would force either abandoning universal comparability or developing a truly abstract relational theory (e.g., based on resource bottlenecks or information theory).

  ---

  **Conclusion:** A viable IUC theory for policy must cover diverse humans under constraints 1-7, 11, but will almost certainly sacrifice **Baseline Respect (9)** to achieve a **Public Metric (10)** while maintaining **Scale-Invariance (8)**. Radical heterogeneity beyond humans (stress-test) likely breaks all existing approaches. The search is for robust, measurable *proxies* that approximate welfare under these constraints, not a perfect "utility meter." The weakest link is justifying the implicit interpersonal cardinalization used in practice when baselines differ profoundly.
