  For Western theories, the split-brain case is problematic because psychological continuity is interrupted. Anatta avoids that issue because it never posited a continuous self. The aggregates are always changing, so division just changes the pattern. 

  The confabulation supports anatta by showing the mind's fabrication process. The unity each hemisphere experiences isn't inherent but constructed. However, someone might argue that each hemisphere's unified sense suggests a deeper self, but anatta would counter that it's just more aggregates at work. 

