  Now, the split-brain studies involved patients whose corpus callosum was severed. Without that connection, the left and right hemispheres function independently. The left hemisphere handles language and creates narratives, while the right processes spatial and emotional information but can't verbalize. When the right hemisphere acts, the left confabulates reasons for those actions. 

  The user has specific questions. First, how does anatta view the divided consciousness? Are there two selves, no self, or a fractured self? I need to relate the left hemisphere's confabulation to papanca, which is mental proliferation. The left hemisphere's storytelling might be similar to how the mind constructs a sense of self. The aggregates are still active in both hemispheres, but without integration, each side's processes continue independently. So anatta would say there isn't a single self that split; instead, conditions led to two streams of aggregates. 

  Second, how does anatta compare to Western theories of personal identity? Western theories focus on psychological continuity. When the hemispheres are split, continuity is disrupted. Anatta, however, never assumed a continuous self to begin with. It sees identity as a designation based on aggregates. So the split-brain case challenges Western notions because continuity is broken, but for anatta, it's just a change in conditions. The sense of self being split is another fabrication. 

  Third, does the left hemisphere's confabulation confirm that the self is fabricated? The persistent self-models in each hemisphere might seem like there's a deeper self, but anatta would argue that these are still fabricated. Even if each hemisphere has its own narrative, they're both impermanent and dependent. The unity is constructed, not inherent. 

  Fourth, where does the mapping fail? Anatta is about liberation, not clinical details. Treating each hemisphere as a separate person might conflict with Buddhism's denial of ultimate persons. But in practical terms, clinicians might still address each hemisphere's needs without endorsing a permanent self. Anatta doesn't provide guidelines for treatment but emphasizes reducing suffering. 

