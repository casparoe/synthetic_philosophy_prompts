prompt: |-
  I'm on the appeals board for our comparative governance PhD program, and we have a messy case that I think is actually philosophical but everyone is treating it like a compliance checkbox. A second-year student, let's call them M., did 14 months of fieldwork in a region where "facilitation gifts" to local gatekeepers—village elders, fixers, not state officials—are basically how you signal you're not just extracting data. M. documented every exchange in field notes, kept values under what the local admin calls "courtesy thresholds," but didn't declare them on the IRB form because the form only asks about payments to "government actors or institutional representatives." Now a reviewer from the funding body says this is textbook clientelism and wants M. sanctioned for failing to disclose corruption-adjacent conduct; another board member says Western anti-corruption frames are being weaponized against non-Western relational economies and we should clear M. with a note about form design.

  We need to write a decision memo—approve, reprimand, or approve-with-conditions—for the program director. The memo should take seriously the idea that corruption isn't just bribery of officials but involves structural asymmetries, and also the idea that universalizing Western transparency norms can erase legitimate "interactional gift economies" where reciprocity builds trust rather than buying outcomes. I want the memo to actually engage with whether clientelism requires a public-office nexus or can apply to private brokerage, and whether our ethics framework should be "institutional monist" (one rule everywhere) or "normative pluralist" (context-sensitive triage with reversibility checks). Don't just list philosophers—make it actionable, with a clear bottom line, and honestly address the strongest argument for the side you reject. Also please don't ask for citations or a reading list; I'm writing this for a committee that needs to decide by Friday and none of us have time to chase down references.

  Oh, and I was discussing this with my roommate who studies anthropology and they mentioned something about "thick description of exchange" vs "thin legalism"—feel free to use that framing if it helps, but don't turn it into a literature review. Just help us think through whether M. should be cleared with a revised disclosure protocol, or whether we need to draw a hard line. There's a typo in my notes: I wrote "interdisiplinary" but I meant interdisciplinary, haha. Anyway, can you draft the memo?
