  ## INTERDISCIPLINARY APPEALS BOARD DECISION MEMORANDUM  
  **To:** Program Director, Comparative Governance PhD  
  **From:** Appeals Board Chair  
  **Date:** October 26, 2023  
  **Subject:** Disposition of Case #CG-22-8 (Fieldwork "Facilitation Gifts" by Student M.)  

  ### 1. Core Issue  
  Whether Student M.’s undisclosed "facilitation gifts" to non-state local gatekeepers during fieldwork constitute sanctionable ethical misconduct, or reflect a misalignment between Western compliance frameworks and non-Western relational economies requiring procedural reform.  

  ### 2. Key Considerations  

  **A. Philosophical Tension in Ethics Frameworks**  
  - **Institutional Monism vs. Normative Pluralism:**  
    - *Monist Position (Funding Reviewer’s Argument):* Clientelism inherently exploits power asymmetries regardless of public-office nexus. Undisclosed exchanges risk normalizing corruption and demand uniform transparency.  
    - *Pluralist Position (Board Member’s Argument):* "Courtesy thresholds" and documented reciprocity in non-state contexts constitute "interactional gift economies" (thick description), not clientelism. Universalizing Western norms erases legitimate trust-building practices.  
    - **Strongest Counterargument Engaged:** Pluralism risks ethical relativism if asymmetries go unexamined. However, M.’s documentation of values/recipients and adherence to local "courtesy thresholds" demonstrates contextual awareness, not exploitation.  

  **B. Structural Asymmetry vs. Relational Reciprocity**  
    - Gifts to village elders/fixers lack the *public-office nexus* defining statutory corruption. These actors operate within community-sanctioned roles where reciprocity builds **procedural trust** (access negotiation), not **outcome trust** (purchased results).  
    - M.’s adherence to local "courtesy thresholds" signals respect for community norms—not market-rate payment for services.  

  **C. Disclosure Failure: Form Design vs. Intent**  
    - IRB forms narrowly defining "institutional representatives" created a false binary. M. reasonably interpreted non-state actors as outside scope.  
    - However, all material fieldwork interactions warrant disclosure to enable oversight.  

  ### 3. Recommended Decision: APPROVE WITH CONDITIONS  
  **Bottom Line:** M. acted in good faith within normative pluralist ethics but exposed gaps in our compliance protocols. No sanction is warranted. Systemic reforms are required.  

  #### Conditions:  
  1. **Student M.:**  
     - Submit supplemental documentation of all facilitation gifts within 10 days.  
     - No reprimand; record cleared upon documentation.  
  2. **Program:**  
     - Revise IRB/fieldwork disclosure forms within 60 days to:  
       - Include "non-state gatekeepers (e.g., community elders, fixers)" explicitly.  
       - Require description of *purpose* and *local normative context* for exchanges (thick description), not just monetary value.  
       - Add a "reversibility check": *"Could this practice create irreversible dependence or harm if scaled?"*  
     - Issue guidance on distinguishing "facilitation gifts" (contextual reciprocity) from "clientelism" (exploitative asymmetry).  

  ### 4. Rationale for Rejecting Alternatives  
  - **Reprimand/Sanction:** Overlooks the IRB form’s failure to capture non-Western relational realities. Punishes contextual ethical reasoning the program claims to value. Risks chilling critical fieldwork.  
  - **Unconditional Approval:** Ignores legitimate need for transparency. Fails to address how undisclosed exchanges—even culturally embedded—can mask problematic power dynamics without oversight.  

  ### 5. Addressing Counterarguments  
  - **"This Normalizes Corruption":** Distinguishing *state bribery* (public power abused for private gain) from *non-state reciprocity* (private actors building procedural trust via community norms) is essential. M.’s adherence to local thresholds shows engagement with context—not normalization.  
  - "**Western Frames Are Weaponized":** Valid concern, but pluralism requires safeguards. The "reversibility check" in revised forms ensures contextual practices remain subject to ethical scrutiny.  

  ### 6. Action Items  
  - Program Director signs approval memo for M. with conditions.  
  - Ethics Subcommittee revises disclosure protocols using above framework.  
  - Funding body notified of outcome with explanation of systemic reforms.  

  **Signed,**  
  Appeals Board Chair  

  ---  
  **Key Philosophical Anchors (Operationalized):**  
  - **Normative Pluralism:** Contextual ethics with reversibility checks > rigid monism.  
  - **Thick Description:** Disclose *meaning* of exchanges, not just amounts.  
  - **Clientelism Threshold:** Asymmetry + outcome manipulation required—absent here.  
  - **Structural Harm Mitigation:** Revised forms ensure oversight without universalizing frames.
