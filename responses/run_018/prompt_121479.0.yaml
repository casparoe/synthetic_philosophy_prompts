  Biggest sensitivity: **Unavailability (Term 3)**. If future neuroscience shows qualia are deducible from structure (e.g., mathematical models predicting experiences from opponent inputs), my credence drops sharply. Conversely, evidence of irreducible subjectivity (e.g., inverted spectra without functional difference) raises it. 

  The user’s friend is likely underestimating Term 1—even with interpolation attempts, intrinsic qualities resist functional reduction. But I’ll steelman PCS: if "knowing what it’s like" is just conceptual reconfiguration (not new facts), and Mary’s t2 report is equivocal, then 0.2 is defensible. Still, I find the fact-like persistence more persuasive.

