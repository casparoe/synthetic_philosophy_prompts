answer: |-
  Here's a decomposed credence for the proposition that Mary gains non-physically-entailed knowledge at t1, along with diagnostics and calibration. My headline credence is **0.65**. Below is the structured justification, with terms expanded to address your nuances. Numbers represent subjective probabilities (0–1), and firmness is indicated as High/Medium/Low.

  ---

  ### **Decomposition**
  1. **Determinate intrinsic character beyond functional role**  
     *Credence: 0.75 | Firmness: Medium*  
     Even with opponent-process knowledge, the *specific qualitative character* of red experience likely outruns its relational/functional description. Mary knew "red is the opponent of green," but the intrinsic "what-it’s-likeness" of red—distinct from green—is not fully captured by causal or mathematical relations. Neuroscience describes mechanisms, not intrinsic qualities. *Justification:* Modal intuitions (e.g., inverted spectrum without functional change) suggest intrinsic properties exist independently. The protanope variant blocks trivial functional extrapolation but doesn’t bridge the gap.

  2. **"Knowing what it’s like" is factive (propositional)**  
     *Credence: 0.85 | Firmness: High*  
     "Knowing what it’s like" refers to factual knowledge (e.g., "Red experience has qualitative character R"), not just ability or acquaintance. Mary’s post-t2 report ("I know what red looked like") after ability degradation suggests retained propositional knowledge. *Justification:* Abilities fade; facts persist. If she can assert this accurately while unable to visualize red, it implies a truth-apt belief.

  3. **Genuine unavailability pre-t1**  
     *Credence: 0.55 | Firmness: Low*  
     Critical tension: Mary knew green’s quality and opponent theory, so *could she interpolate red?*  
     - Against interpolation: Qualitative spaces are primitive (e.g., you can’t deduce "red" from "green + negation" anymore than deducing "pain" from "pleasure’s absence").  
     - For interpolation: If color qualities are defined relationally, her knowledge might suffice (e.g., "red is the unique hue that balances green in opponent space").  
     *Justification:* Interpolation defuses the argument *only if* phenomenal qualities are entirely structural. Your variant makes this plausible but unconvincing; I lean toward no interpolation.

  4. **Room for deflationary strategies (PCS, etc.)**  
     *Credence: 0.25 | Firmness: Medium*  
     Even if Mary gains something, deflationists (e.g., phenomenal concept strategy) might argue it’s a new *mode of access* to old physical facts, not a new fact. *Justification:* PCS could reframe her gain as conceptual reconfiguration ("now I possess the *phenomenal concept* RED"). But this struggles with Mary’s t2 report: if she retains knowledge without the concept’s vividness, it strains PCS.

  ---

  ### **Diagnostics**
  - **t2 Ability Degradation Test**:  
    Mary’s claim that she "knows what red looked like" after losing the ability supports **factive knowledge** (Term 2). If she were wrong (e.g., misremembering), it would undermine the proposition, but her reliability here is high. If deflationists insist this is equivocal (e.g., "knowing" is ambiguous), it slightly lowers Term 2 (to 0.75) but doesn’t collapse it.

  ---

  ### **Outside-View Calibration**
  - **Your credence (0.6)**: Discount by **0.15**. Your prior likely overweights phenomenological intuition (Term 1) and underweights structuralist interpolation (Term 3).  
  - **Friend’s credence (0.2)**: Discount by **0.30**. Their PCS lean underrates the persistence of factive knowledge (Term 2) and the gap in Term 3.  
    *Why?* Historical consensus shifts (e.g., Frankish’s illusionism) suggest pro-physicalism biases dominate, but your variant mitigates standard objections.

  ---

  ### **Sensitivity Analysis**
  - **Most sensitive term**: **Unavailability (Term 3)**.  
    - **Evidence that would move it**: A completed neuroscience of color vision demonstrating that qualia are *mathematically deducible* from opponent-process dynamics (e.g., a model predicting novel hue experiences from structure). If validated, Term 3 drops to 0.2, reducing headline to 0.35. Conversely, empirical proof of irreducible subjectivity (e.g., inverted spectra without functional difference) raises it to 0.8 (headline 0.75).  
    - **Who’s more wrong?** Your friend likely underestimates **Term 1** (determinate character). Even with interpolation attempts, intrinsic qualities resist functional reduction.  

  ---

  ### **Steelman of Opposing Views**
  - **PCS Steelman (supporting 0.2)**:  
    Mary’s gain is conceptual, not factual. Pre-t1, she knew all physical facts but lacked the *phenomenal concept* RED. Post-t1, she acquires this concept via experience, enabling new cognitive abilities (recognition, imagination) and modes of thought. At t2, "knowing what it’s like" refers to her memory of *employing* this concept, not a brute fact. The "novelty" is psychological, not metaphysical. Interpolation is possible: her green experience + opponent theory provides a complete relational map, making red’s character deducible a priori.  

  ---

  ### **Confidence and Weakest Claim**
  - **Headline credence**: **0.65** (Medium firmness).  
  - **Least sure claim**: **Term 3 (Unavailability)**. Credence 0.55 is highly speculative—future neuroscience could reveal qualia are structural all the way down. Interpolation arguments (e.g., "phenomenal glue" from relations) are the strongest counter.  

  ---
  ### **Final Output**
  - **Your proposition credence**: **0.65**  
  - **Key insight**: The protanope variant strengthens the argument by preempting objections about sensory naïveté, but **interpolation via opponent structure** remains the deflationists’ best shot. Your friend’s 0.2 is defensible if phenomenal concepts exhaust the gap, but the t2 report and intrinsic quality intuitions make 0.6–0.7 more plausible.
