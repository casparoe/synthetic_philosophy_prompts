  Important caveats: must emphasize this can't replicate long-term scientific integration of data, and predict students will obsess over stylistic tells instead of interpretive criteria. Should warn about that in the facilitator notes.

  For the envelope contents, I'll suggest ambiguous reports that avoid obvious AI tropes - descriptions of ambiguous sensory experiences, emotions during creative work, that sort of thing. Human ones should include plausible confabulations too. 

  The recorder role is crucial - they document the interpretive criteria used, not content. And rotating roles ensures everyone experiences all perspectives. Crisis round forces them to make pragmatic choices about which reports to "save" in their world-model.

