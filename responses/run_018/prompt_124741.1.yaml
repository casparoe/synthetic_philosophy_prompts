answer: |-
  Here's a decision tree mapping the logical space of guilt vs. shame, focusing on your specified branches and constraints. Key features: Starts with Witness Requirement, splits on Trigger, then asks about Institutional Design Isolation. 8 leaves total. Awkward commitments highlighted. Collective attribution collapses flagged.

  **Decision Tree: Engineering Guilt vs. Shame Cultures**

  1.  **WITNESS REQUIREMENT: Does the emotion fundamentally require an *actual* witness (real person/group present/aware)?**
      *   **YES (Actual Witness Required)** → Go to 2
      *   **NO (Counterfactual Witness / "Inner Judge" Suffices)** → Go to 3

  **Branch 1: YES - Actual Witness Required**

  2.  **TRIGGER: What triggers the emotion?**
      *   **A. Breaking Internalized Rule:** Feeling arises *primarily* from violating a personal moral code, *but* crucially requires the *actual* awareness/judgment of others to manifest fully. ("I know I broke my rule, but *their knowing* makes me feel it intensely").
          *   **INSTITUTIONAL DESIGN: Can you design systems favoring this (witness-dependent rule-breaking) without "leakage"?**
              *   **YES (Pure Witness-Dependent Rule-Guilt Possible):** "**Externalized Conscience View**". Focuses on using social visibility (accountability partners, public confessions) to enforce internal rules. *Awkward Commitment:* Requires constant surveillance/transparency mechanisms to sustain the "witness," risking performative morality and undermining *true* internalization if the witness isn't present. **COLLAPSE FLAG:** If "collective responsibility" means *everyone* is always a potential witness (panopticon), this merges with Rank-Shame views.
              *   **NO (Leakage Inevitable):** "**Socialized Rule-Enforcement View**". Acknowledges that using actual witnesses to trigger rule-based emotion inevitably ties self-worth to social perception. *Awkward Commitment:* Social disapproval will *always* trigger shame about *being* a rule-breaker (loss of standing), making pure rule-guilt impossible to isolate. Shame creeps in via the witness mechanism.

      *   **B. Losing Social Rank/Status:** Feeling arises *primarily* from the perception of diminished standing, rejection, or exclusion by the actual witnessing group. ("*Their seeing* me fail makes me lose face/status").
          *   **INSTITUTIONAL DESIGN: Can you design systems favoring this (status-loss focus) without "leakage"?**
              *   **YES (Pure Status-Shame Possible):** "**Hierarchical Cohesion View**". Sees shame as essential for maintaining social order, roles, and group harmony through status management. *Awkward Commitment:* Actively cultivates fear of exclusion/public failure; risks crushing individuality, enabling bullying, and discouraging necessary rule-breaking/challenge to authority.
              *   **NO (Leakage Inevitable):** "**Integrated Social Sanction View**". Accepts that status-loss shame inherently references *some* (often unspoken) group norm or rule being violated. *Awkward Commitment:* While focused on rank, the underlying trigger always implies a broken rule/norm (even if arbitrary), making shame inseparable from normative judgment.

  **Branch 2: NO - Counterfactual Witness Suffices**

  3.  **TRIGGER: What triggers the emotion?**
      *   **A. Breaking Internalized Rule:** Feeling arises *primarily* and *sufficiently* from violating a deeply held personal moral standard, irrespective of others' actual knowledge. A counterfactual witness ("What would X think?") or abstract principle ("It's just wrong") is enough. ("I feel bad *because* I broke my rule, even if no one knows").
          *   **INSTITUTIONAL DESIGN: Can you design systems favoring this (internal rule-guilt) without "leakage"?**
              *   **YES (Pure Internalized Guilt Possible):** "**Autonomous Morality View**". Champions guilt as the ideal, enabling moral action based on conviction, not surveillance. *Awkward Commitment:* Struggles to explain the origin/sustenance of internal rules without *any* social input; risks moral relativism or disconnect from communal repair needs. **COLLAPSE FLAG:** If "collective guilt" means attributing rule-breaking to the *group* identity, it creates pressure to *conform* (social rank maintenance), leaking into shame.
              *   **NO (Leakage Inevitable):** "**Internalized Social Mirror View**". Argues that even "internal" rules originate from social norms internalized as self-worth criteria. *Awkward Commitment:* Admits that guilt triggered by rule-breaking *always* carries an implicit fear of the *counterfactual* witness's disapproval (potential shame), making pure guilt psychologically unstable.

      *   **B. Losing Social Rank/Status:** Feeling arises *primarily* from the *idea* of potential exposure, rejection, or diminished standing, even in complete privacy. The counterfactual witness embodies the *threat* to status. ("*Thinking about* others finding out makes me feel worthless/exposed").
          *   **INSTITUTIONAL DESIGN: Can you design systems favoring this (internalized status-fear) without "leakage"?**
              *   **YES (Pure Internalized Status-Shame Possible):** "**Anticipatory Exclusion View**". Focuses on the paralyzing fear of *potential* social rejection based on perceived flaws/failures, decoupled from specific rules. *Awkward Commitment:* Actively cultivates anxiety and hyper-vigilance about self-presentation; undermines risk-taking and authentic connection.
              *   **NO (Leakage Inevitable):** "**Normative Self-Worth View**". Argues that the fear of status loss (shame) inherently references a failure to meet *some* internalized standard or norm defining worthiness. *Awkward Commitment:* While feeling like status anxiety, the trigger always implies a violation of an internalized rule/norm about what makes one "worthy," blurring into guilt.

  **Summary of Collapse Flags under Collective Attribution:**
  *   **Externalized Conscience View (2A-YES):** If "collective witness" means universal surveillance (panopticon), it morphs into a mechanism for enforcing conformity/status (Rank-Shame).
  *   **Autonomous Morality View (3A-YES):** If "collective guilt" means the *group* bears responsibility, it pressures individuals to maintain the *group's* standing/norms to avoid *collective* shame, shifting focus to social rank.
