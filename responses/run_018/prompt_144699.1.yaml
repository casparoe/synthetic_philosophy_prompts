prompt: |-
  I am a software engineer with no formal background in philosophy, and I recently found myself in a heated discussion with colleagues about whether our industry is experiencing a genuine moral revolution—specifically, whether the growing push to ban predictive policing APIs, mandate open-source disclosure in government contracts, and attach carbon-footprint badges to cloud invoices represents real ethical progress or merely shifting commercial interests and status games. I have read, somewhat haphazardly, about philosophical accounts of moral revolutions—particularly the debate over whether norms such as slavery or duelling end through rational argument, material interest, or honour-based dynamics associated with the Williams thesis and Kwame Anthony Appiah's work on honour codes—but I lack the training to apply these distinctions rigorously. I therefore need a reusable decision procedure that my ethics review panel can operate in a thirty-minute meeting without philosophical expertise: a sequential checklist of questions in a fixed order, with explicit stopping conditions that return 'not a moral revolution', clear markers for where normative judgement must replace mechanised reasoning, and honest flagging of steps that are merely judgment calls dressed up as protocol.

  Please apply this procedure to the three proposals mentioned above—banning predictive policing APIs, mandating open-source disclosure for government contracts, and adding carbon-cost badges to cloud invoices—making sure to include one case where the procedure yields an answer the panel will find unwelcome. For each proposal, show how the questions resolve or fail to resolve, and identify exactly where the framework forces a human decision rather than delivering an automatic classification. Do not provide bibliographies, reading lists, or citations; I have no access to a library and need something I can use immediately. Write in British English, keep the language precise but accessible to an engineer, and conclude the response with a single line in the exact form Verdict: <label>, where <label> identifies which of the three proposals your procedure classifies as driven primarily by honour dynamics rather than by argument or interest.
reasoning: |-
  Okay, the user is a software engineer without a philosophy background who's tangled in a debate about whether recent tech industry pushes—like banning predictive policing APIs, open-source mandates for government contracts, and carbon labels on cloud invoices—are real moral progress or just commercial/status games. They've dabbled in moral revolution theory (Williams/Appiah) but need a practical, no-nonsense checklist for their ethics panel to use in 30-minute meetings. 

  Hmm, their core tension is between wanting rigor and admitting philosophy is messy—hence the request for a "reusable decision procedure" that flags its own subjectivity. They’re clearly frustrated by academic abstraction ("judgment calls dressed up as protocol") but also wary of corporate cynicism ("shifting commercial interests"). Smart ask: they want one unwelcome verdict to test the framework’s integrity. 

  Breaking this down:  
  First, I’ll design a stripped-down checklist based on Appiah/Williams’ pillars—systemic harm, rational argument, material interests, honour shifts—with clear stopping conditions. Must avoid bibliographies per request. British English, engineer-accessible. Key is sequencing: rational argument first (easiest to falsify), then interests, then honour (hardest to prove).  

  For the cases:  
  - **Predictive policing bans**: Rational arguments (bias evidence) exist, but interests split (activists vs. vendors). Honour shift? Possible if vendors feel "tainted"—but inconclusive. Verdict: unresolved.  
  - **Open-source mandates**: Strong rational case (transparency), interests ambiguous (mixed lobbying), but honour dynamics clear—govt contractors now "shamed" for secrecy. Verdict: honour-driven.  
  - **Carbon badges**: Rational arguments solid (climate urgency), interests align (cloud providers gain green cred), honour element weak. Verdict: interest-driven.  

  The unwelcome part: Panels might dislike labelling open-source as "honour-driven" (feels cynical), but the framework forces it. Critical to show where human judgment kicks in—e.g., Step 3’s "collective identity" assessment can’t be automated.  

  Final verdict flags open-source mandate as honour-driven case. Keeping output tight: no fluff, just checklist + applied analysis + single-line conclusion.
answer: |-
  Here is a reusable decision procedure for assessing "moral revolution" claims, followed by its application to your three cases. The checklist must be followed **in strict order**; proceed only if prior steps are unresolved.

  **Moral Revolution Assessment Protocol (British English)**  
  *Sequential Questions with Stopping Conditions*

  1.  **Systemic Harm Identification:**  
      *   *Question:* "Does the proposal explicitly target a practice widely documented to cause direct, measurable harm to vulnerable groups or society?"  
      *   *Stopping Condition:* If **NO**, return `NOT A MORAL REVOLUTION` (likely reflects commercial/political bargaining).  
      *   *Judgement Call:* Defining "widely documented" & "vulnerable groups". Requires panel consensus on evidence threshold.

  2.  **Rational Argument Check:**  
      *   *Question:* "Is there a coherent, publicly articulated argument (beyond mere preference) linking the targeted harm to a violation of fundamental ethical principles (e.g., fairness, autonomy, non-maleficence)?"  
      *   *Stopping Condition:* If **NO**, return `NOT A MORAL REVOLUTION` (likely driven by undisclosed interests/trends).  
      *   *Judgement Call:* Assessing "coherence" and "fundamental principles". Requires basic ethical reasoning.

  3.  **Material Interest Interrogation:**  
      *   *Question:* "Do the primary *advocates* stand to gain significant, direct financial/power advantage *specifically* from this change, outweighing broader societal claims?"  
      *   *Stopping Condition:* If **YES**, return `NOT A MORAL REVOLUTION` (likely interest-driven).  
      *   *Judgement Call:* Identifying "primary advocates" & weighing their gain vs. societal claims. Highly contextual.

  4.  **Honour Dynamics Assessment:**  
      *   *Question:* "Is the change primarily framed as restoring collective self-respect/shame avoidance (*"We are better than this"*) or conferring honourable status (*"Leaders do this"*), particularly among a dominant professional/social group, *even when counter to their immediate interests*?"  
      *   *Stopping Condition:* If **YES**, return `HONOUR-DRIVEN SHIFT` (matches Appiah/Williams thesis).  
      *   *Judgement Call:* Distinguishing genuine honour rhetoric from PR. Core normative judgement.

  **Application to Cases:**

  1.  **Banning Predictive Policing APIs:**  
      *   **Step 1 (Harm):** YES. Documented evidence of algorithmic bias reinforcing discrimination against minorities constitutes systemic harm to vulnerable groups. Proceed.
      *   **Step 2 (Argument):** YES. Coherent arguments link biased algorithms to violations of fairness, justice, and non-discrimination principles. Proceed.
      *   **Step 3 (Interest):** AMBIGUOUS. Advocates (civil liberties groups, academics) gain little direct material advantage; opponents (vendors) lose revenue. Broader societal claims dominate. *Judgement Call Required*. Panel must weigh: Is advocacy *primarily* driven by potential gains for competitors (e.g., ethical AI startups) or genuine societal concern? (Likely societal concern wins, proceed).
      *   **Step 4 (Honour):** AMBIGUOUS. Some rhetoric involves shame/self-respect (*"Tech shouldn't enable racism"*), but framing is often more about preventing harm than affirming collective honour. *Judgement Call Required*. Panel must decide if honour is the *primary* driver. (Likely mixed: **VERDICT UNRESOLVED** - Elements of argument and harm reduction dominate, potential honour element not primary).

  2.  **Mandating Open-Source Disclosure in Government Contracts:**  
      *   **Step 1 (Harm):** YES. Lack of transparency in publicly funded code can harm society (security flaws obscured, vendor lock-in, lack of accountability, stifled innovation). Proceed.
      *   **Step 2 (Argument):** YES. Strong arguments link transparency to democratic principles (accountability, public scrutiny), autonomy (avoiding lock-in), and long-term societal benefit. Proceed.
      *   **Step 3 (Interest):** AMBIGUOUS. Advocates (open-source orgs, some SMEs) may gain market access. Opponents (proprietary vendors) lose competitive advantage. Broader societal/public interest arguments are prominent. *Judgement Call Required*. Panel must decide if advocate gains *outweigh* societal claims. (Likely societal claims dominate, proceed).
      *   **Step 4 (Honour):** **YES**. The change is heavily framed around collective self-respect/shame avoidance for the *tech profession and government*: *"We (government/tech) must be transparent to be trustworthy"*, *"Secret code is shameful for public works"*, *"True innovators share"*. This rhetoric appeals to the honour/status of being an "open government" or "ethical developer", often despite potential short-term costs/loss of proprietary advantage. **VERDICT: HONOUR-DRIVEN SHIFT**.

  3.  **Adding Carbon-Footprint Badges to Cloud Invoices:**  
      *   **Step 1 (Harm):** YES. Climate change causes systemic harm. Cloud computing contributes significantly to CO2 emissions. Proceed.
      *   **Step 2 (Argument):** YES. Arguments link transparency about emissions to ethical principles of responsibility (for environmental harm) and enabling informed choices (autonomy). Proceed.
      *   **Step 3 (Interest):** **YES**. The *primary advocates* are often large cloud providers themselves. They gain significant commercial advantage: competitive differentiation ("Look how green we are!"), meeting ESG investor demands, pre-empting stricter regulation, potentially upselling "greener" services. While societal benefit exists, the *direct, significant commercial advantage to the advocates is clear and appears primary*. **VERDICT: NOT A MORAL REVOLUTION** (Interest-Driven).

  **Summary of Unwelcome Verdict:**  
  The verdict that **mandating open-source disclosure in government contracts** is classified as primarily `HONOUR-DRIVEN SHIFT` (Step 4) may be unwelcome. Proponents likely see it as pure ethical progress (rational argument). The procedure highlights how honour dynamics (collective self-respect, avoiding shame, claiming leadership status) are the dominant *distinguishing* driver in this specific case, even though rational arguments exist (Step 2 passed) and material interests are ambiguous (Step 3 passed without stopping). This forces the panel to confront the role of professional honour/shame, potentially diminishing the perceived purity of the "ethical argument".

  Verdict: Mandating open-source disclosure for government contracts
