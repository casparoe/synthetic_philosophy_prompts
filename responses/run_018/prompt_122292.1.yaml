prompt: |-
  I was arguing with my roommate—she's in urban planning and keeps saying Singapore is basically just a well-run corporation—about whether performance legitimacy can actually do normative work, not just describe why people put up with authoritarian rule.

  I'm defending the stronger claim that sustained prosperity plus low corruption creates something like a fiduciary entitlement to govern without elections, especially when the regime practices what I'd call 'recursive accountability': the state audits itself rigorusly but citizens never vote. I think Singapore's PAP and post-1978 China are the clearest cases—massive GDP growth, poverty reduction, stable institutions—so I hold that in these instances authoritarian structures aren't merely tolerated but positivly justified by output legitimacy.

  But I want to know what would actually count against this view, not just 'democracy is better' slogans. What serious evidence, conceptual problems, or anomolies should move me? Please respond as exactly five numbered points, each just a sentence or two, with no intro and no conclusion whatsoever.
reasoning: |-
  Okay, the user is having a debate with their roommate about performance legitimacy in authoritarian regimes like Singapore and China. They're arguing that sustained prosperity and low corruption can create a legitimate right to govern without elections, especially with recursive accountability. They want counterarguments that go beyond just pro-democracy slogans.

  First, I need to identify what would genuinely challenge their position. They mentioned "fiduciary entitlement," so I should consider philosophical and ethical angles. The absence of consent is a fundamental issue—how can a government claim legitimacy without the people's explicit agreement? That's a strong point against their argument.

  Next, they brought up recursive accountability. The problem here is self-policing without external oversight. It's like marking your own homework; there's no real check if the state is truly accountable. Examples like China's anti-corruption campaigns being politically motivated could undermine their point.

  Then there's the problem of non-material values. Even if a regime delivers economic growth, it might suppress freedoms or minority rights. People might prioritize these over prosperity, but under authoritarian systems, they can't express that without elections. The lack of a mechanism to voice dissent weakens the legitimacy claim.

  Another angle is adaptability. Authoritarian regimes might perform well under certain conditions but fail when circumstances change. Without feedback mechanisms like elections, they can't adjust policies effectively. The Soviet Union's collapse is a historical example here—stagnation leading to downfall.

  Lastly, the selectivity of examples. Singapore and China are unique cases. Many authoritarian regimes have high corruption and poor performance. If performance legitimacy justifies authoritarianism, why do most such regimes fail? This inconsistency questions the argument's validity beyond a few exceptions.

  I should ensure each point directly addresses their claims without generic democracy arguments. The user wants concrete, specific challenges. Also, considering their academic context, using terms like "fiduciary duty" and "recursive accountability" appropriately is key. They need robust counterpoints for their debate, so each numbered point must be precise and impactful.
answer: |-
  1.  Fiduciary duty inherently requires *consent* from the principal (the people), which elections uniquely establish, rendering "fiduciary entitlement" without them a fundamental contradiction undermining the normative claim.  
  2.  "Recursive accountability" lacks independent verification; internal audits without external oversight (like free press, opposition parties, or courts) create high risks of systemic blind spots, cover-ups, and accountability only for politically inconvenient actors, not the core leadership.  
  3.  Performance legitimacy based solely on material outputs neglects non-material values (dignity, freedom, self-determination) citizens may intrinsically prize, offering no mechanism for them to express this preference or trade-off without elections.  
  4.  Sustained success under specific conditions doesn't guarantee adaptability; rigid authoritarian structures often fail catastrophically when facing novel crises (economic shifts, pandemics, leadership transitions) precisely due to the absence of feedback mechanisms inherent in electoral accountability.  
  5.  The empirical record shows Singapore and China are extreme outliers; the vast majority of authoritarian regimes exhibit high corruption and poor performance, demonstrating that the *structure* itself lacks inherent mechanisms to reliably produce the outcomes justifying your normative claim.
