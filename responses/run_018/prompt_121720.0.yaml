prompt: |-
  My brother-in-law and I got into a shouting match at a barbecue last weekend about whether what is happening in one particular place counts as genocide, and it bugged me afterwards because we agreed on basically every fact about the deaths and the displacement and we were still furious at each other. It felt like the argument was about the word, not the events. So I started collecting explanations for why governments, newspapers and UN panels drag their feet on that word while freely using vaguer ones like atrocities or ethnic cleansing (which somebody told me isnt even a crime under any treaty, though I may have that wrong). Also: I read somewhere that Lemkin, the guy who made the word up in the 1940s, meant something broader than mass killing, closer to dismantling a groups culture, language and religion, and that the UN treaty that came out of his campaigning got narrowed down to a short list of acts plus that fiddly requirement that the intent be to destroy the group as such. If any of that is garbled, correct me in one line and then carry on.

  Here are the explanations Ive collected so far, and Id like you to rank them: (1) the intent clause really is hard to satisfy, since killing people for land or to crush an insurgency may not be killing them in order to destroy the group, so hesitation is just legal caution; (2) the treaty commits signatories to prevent and punish, so naming the thing binds you to act, or exposes the fact that you wont; (3) the word borrows its gravity from one event in the 1940s and gets treated as a superlative that shouldnt be spent on lesser cases; (4) once youve called someone a perpetrator of that crime you cant really negotiate with them, so naming forecloses a peace deal; (5) naming invites claims from descendants, reparations, apologies; (6) while its happening the facts are murky and walking the word back later is career-ending, so wait; (7) the legal scruples are mostly cover, and whats really going on is who we like and who we need. And my own candidate, which I made up: (8) call it the verdict tax, the idea that once a word is wired to a legal consequence, users silently raise the standard of proof for that word specifically, so it slides from being a description to being a verdict, and the tell is that the same people will use un-wired words for the very same events without any hesitation at all.

  What I want: sort these into tiers by how much of the real-world reluctance each actually explains, and give each one a percentage share, with the shares adding to 100. One sentence, two at most, on why each lands where it does. Then two extra things. First, be honest about my verdict tax: is it a genuinely separate mechanism, or does it collapse into (2) or (6)? If it collapses, delete it and hand its points to whichever entry swallowed it. Second, give me a number from 0 to 100: suppose we had a purely clinical word for the same pattern of events, no legal trigger, no moral freight, no historical echo — how much of the fight would survive? And if some of it survives, which entry on my list accounts for the part that does. Format it as a tier list with the percentages beside the entries, keep the whole answer under 450 words, and please dont point me at books or articles, I know myself well enough to know I wont read them.
reasoning: |-
  Okay, the user is asking me to analyze and rank various explanations for why international actors hesitate to use the term "genocide." This stems from a personal argument they had about whether certain events qualify as genocide, despite agreement on the factual atrocities. They've collected eight explanations and want them tiered by explanatory power with percentage shares.

  Hmm, looking at their explanations, several key themes emerge. The legal intent requirement (#1) seems fundamental since proving specific intent is notoriously difficult in international law. The prevention/punishment obligations (#2) carry significant weight too - once you name something genocide, legal duties kick in. The "verdict tax" concept (#8) they proposed is interesting and feels distinct to me - it describes how legal consequences unconsciously raise the evidentiary bar for the word itself.

  I need to consider how these factors interact. The historical gravity (#3) and prevention obligations (#2) both contribute to the term's political sensitivity. Their "verdict tax" idea (#8) seems separate from legal caution (#1) or career risk (#6) because it's about cognitive shifting of standards when legal stakes attach to a word. For the counterfactual about a neutral term, I estimate about 40% of disputes would remain since arguments about intent (#1) and group destruction criteria would persist even without the loaded terminology.

  The user seems analytically minded but time-constrained - they explicitly don't want reading recommendations. Their frustration about semantic arguments masking moral consensus comes through clearly. I'll structure this as a tiered ranking with percentages, keeping it under 450 words as requested, and explicitly address their "verdict tax" concept and counterfactual question.
answer: |-
  Here's the tiered ranking by explanatory power, with percentages:

  **Primary Drivers (65%)**  
  (2) Treaty obligations (30%): Directly triggers legal duties to intervene/punish, creating political liability.  
  (8) Verdict tax (25%): *Separate mechanism* – legal consequences unconsciously inflate the *word's* proof standard vs. unwired terms.  
  (1) Intent clause (10%): Genuine legal difficulty proving specific intent to destroy the group "as such."  

  **Significant Factors (25%)**  
  (7) Political expediency (15%): Allies/strategic interests often override consistent legal/moral application.  
  (4) Foreclosing negotiation (10%): Naming can delegitimize perpetrators, complicating diplomacy.  

  **Secondary Factors (10%)**  
  (3) Historical gravity (5%): Reluctance to "dilute" the term's association with the Holocaust.  
  (6) Career risk (5%): Fear of being wrong on a career-defining accusation stifles early use.  
  (5) Reparations/claims (0%): Rarely a primary barrier; more a downstream consequence of naming.  

  *(Ethnic cleansing: Correct, it's not a standalone crime under treaty law but is a descriptive term often encompassing war crimes/crimes against humanity.)*  

  **Your Verdict Tax (8)**: It's a **genuine separate mechanism** (not collapsing into 2 or 6). It explains why *even when facts meet definitions*, the *word itself* is avoided due to its legal wiring, while synonyms flow freely.  

  **Counterfactual (Neutral Term Survival)**: **40%** of the fight would survive. The core dispute over **Intent (1)** – whether destruction of the group *as such* is the goal vs. collateral outcome of war/land grabs – accounts for most of this residue. Legal definitions hinge on this distinction, fueling arguments regardless of terminology.
