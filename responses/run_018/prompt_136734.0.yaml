answer: |-
  Here's your tactical Q&A prep, ordered by likely objection sequence and tailored to your audience's triggers. Aim for **90-second replies** (allows brief follow-ups), with concessions up front to disarm critics.

  ---

  **1. First Objection (Metaphysician):**  
  *"Isn't this just Parfit with extra steps? You dissolve the self into relations/processes — but Parfit already showed reductionism doesn’t require enduring substances. Why repackage it as ‘Buddhist performativity’?"*  
  - **Concede immediately:** "You're right that Parfit's psychological connectedness *resonates* with Buddhist phenomenology."  
  - **Soft point:** Avoid getting dragged into Parfit exegesis.  
  - **Core reply (90 sec):**  
    "Parfit *solves* persistence with impersonal continuity. But the early suttas (e.g., SN 22.95) *refuse* that framing — they’re not offering a better ontology. Anatta is a *technique*: deconstructing ‘I-making’ (*ahaṅkāra*) by observing aggregates in real-time (MN 10). No ontology is asserted; the persistence question *loses its grip* when craving for a ‘self’ ceases. Parfit reduces, Buddhism *unhooks*."  

  **2. Buddhist Scholar Objection:**  
  *"You’re intellectualizing anatta! The suttas emphasize *dukkha*-cessation via non-identification (SN 22.59), not abstract ‘metaphysical dissolution’. Aren’t you ignoring the soteriological context?"*  
  - **Concede immediately:** "Absolutely — liberation is the goal, not theoretical neatness."  
  - **Soft point:** Don’t deny soteriology; reframe your project.  
  - **Core reply (90 sec):**  
    "Agreed. My claim is that the *method* of non-identification *implies* this distributed ethics. When the Buddha rejects ‘who feels?’ questions (SN 12.12), he’s shutting down metaphysics to focus on conditionality. If we take that anti-speculative stance seriously, karma *can’t* be stored in a self — so it *must* operate through causal networks (*paṭiccasamuppāda*). The soteriology *drives* the anti-metaphysics."  

  **3. Metaphysician Follow-Up:**  
  *"If there’s no narrative self, why does Buddhism use rebirth narratives? Doesn’t karmic continuity *require* a subject of experience across lives?"*  
  - **Concede immediately:** "Rebirth language *appears* to imply persistence — that’s the tension."  
  - **Soft point:** Don’t dismiss rebirth; reframe its function.  
  - **Core reply (90 sec):**  
    "Rebirth is pedagogical: it illustrates causality *without* a self (e.g., lamp flame analogy, Miln 71). Karma attaches to *cravings*, not a soul — like fire spreading through fuel, not a ‘fire-essence’. Moral responsibility emerges from *patterns* perpetuated by ignorance. No self is reborn; *habits* reconfigure (*bhavanga*). It’s coherence-in-flux, not personal identity."  

  **4. Nightmare Objection (You hope nobody asks):**  
  *"Distributed karma sounds like you’re imposing Western consequentialism. But Buddhism rejects cold aggregation — it’s about *intention* (AN 6.63) and virtues like *karuṇā*. Aren’t you ignoring agent-neutrality?"*  
  - **Concede immediately:** "Consequentialism is absolutely a Western framework — this is an *analogy*, not an identity."  
  - **Soft point:** Acknowledge virtue ethics parallels. Don’t overclaim.  
  - **Core reply (90 sec):**  
    "Intention matters precisely because it *propagates* through conditions — like a stone tossed in a pond (AN 4.125). Virtues (*brahmavihāras*) are relational practices, not traits of a self. Goodness is measured by *network effects*: reducing *dukkha* across dependently arising systems. It’s ‘consequentialist’ in structure — outcomes define the act — but *motivationally* anchored in compassion, not utility. The selfless angle *demands* this shift."  

  ---

  **Tactical Notes:**  
  - **When pressed on rebirth:** Say *"The texts use rebirth to illustrate *anicca*/*paṭiccasamuppāda* under ignorance — but awakening reveals it as empty of selfhood, not literally incoherent"* (then pivot to ethics).  
  - **If accused of "Buddhist consequentialism":** Cite the *Kālāma Sutta* (AN 3.65) — ethics are *tested by outcomes* ("when you *know* these things lead to harm... abandon them").  
  - **Body language:** Nod vigorously during concessions ("Exactly!"). Stand firm on the performative pivot.  
  - **Time cues:** Practice with a stopwatch. 90 seconds = ~4 concise sentences + 1 clinching example.  

  **Survival mantra:** *"I’m not solving metaphysics — I’m showing how anatta dissolves the questions."* You’ve got this.
