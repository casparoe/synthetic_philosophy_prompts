answer: |-
  You've articulated a profoundly recursive structural pattern with remarkable clarity. While no single term universally captures every facet you describe, several concepts in philosophy, jurisprudence, and systems theory converge upon it. The phenomenon is most precisely understood as a form of **institutionalised self-entrenchment** or a **self-referential hierarchy with a protected core**.

  ### Established Concepts Approaching the Pattern
  1.  **Kelsen's Grundnorm (Jurisprudence):** Hans Kelsen's foundational "basic norm" (Grundnorm) provides the ultimate, presupposed validity for a legal system. While it *enables* the validity of constitutional amendment rules and ordinary laws, Kelsen explicitly argued the Grundnorm *itself* cannot be changed *by* the legal system it founds. This mirrors your "inviolate core". However, Kelsen placed the Grundnorm *outside* the positive legal order, whereas your pattern insists the meta-level is *implemented within* the very system it governs.
  2.  **Hart's Rule of Recognition (Jurisprudence):** H.L.A. Hart's "rule of recognition" (the ultimate social rule identifying valid laws) is accepted and practised *by officials within the system*. It can evolve through practice, but Hart acknowledged certain aspects might become so fundamental as to be practically "unthinkable" to change. Yet, he didn't formally delineate an eternally unamendable core *within* the rule itself. Your pattern explicitly codifies this unamendability *within* the system's rules.
  3.  **Autopoiesis (Systems Theory - Luhmann/Maturana & Varela):** Autopoietic systems are self-producing and self-maintaining, defining their own boundaries through internal operations. Law, for Luhmann, is such a system. Its norms are created by legal operations (using existing legal norms), creating operational closure. This captures the dependency and self-reference. The "inviolate core" could be seen as a particularly stable, self-reinforcing structure within the autopoietic network, essential for maintaining the system's identity and closure against perturbation. However, autopoiesis doesn't inherently emphasise a *hierarchical* meta-rule or a *codified* unamendable element.
  4.  **Reflexivity & Bootstrapping:** While related to self-reference, bootstrapping typically describes a system starting itself from an initial state, not the persistent, hierarchical, rule-setting structure with a protected core you identify.

  ### Distinguishing Features & Defining the Phenomenon
  Your pattern is distinct because it combines:
  *   **Operational Immanence:** The meta-level (rule-setting/guarding) is *implemented* using the mechanisms and rules of the base level it governs.
  *   **Conceptual Transcendence:** The meta-level is nonetheless treated *as if* it stands hierarchically above and authorises the base level.
  *   **Self-Entrenched Core:** A specific element (rule, clause, principle) is designated as beyond revision *by the system's own meta-procedures*, despite lacking external enforcement. Its inviolability is sustained solely by the system's internal operations and the shared normative commitment of its participants.
  *   **Functional Hierarchy without Collapse:** The levels remain conceptually distinct and functionally hierarchical (the meta-level *applies to* the base level), preventing collapse into simple circularity or undifferentiated self-reference (unlike some paradoxes).

  **Sharp Definition:**
  This is a **self-sustaining hierarchical closure with an entrenched normative kernel**. It describes a system where:
  1.  A base-level operates under rules (`R`).
  2.  A meta-level (`M`), *operationally implemented within the framework of `R`*, is charged with setting, revising, or guarding `R`.
  3.  A specific subset of rules or principles (`K`) within `R` (or defining `M`'s authority) is formally designated as inviolate and unamendable *by `M`*.
  4.  The authority and operational capacity of `M`, and the inviolability of `K`, are sustained solely by the internal logic, institutional practices, and normative acceptance *within* the system defined by `R` and `M`, creating a closed loop of self-authorisation and self-limitation.
  5.  Despite this operational entanglement, `M` maintains a *conceptual* and *functional* hierarchical superiority over `R` (including `K`), allowing it to govern and modify `R` (except `K`).

  ### Distinction from Gödelian Self-Reference
  Gödelian self-reference demonstrates the *limitations* of formal systems: a system powerful enough to model arithmetic *cannot* prove its own consistency within itself. It highlights incompleteness and potential inconsistency arising *from* self-reference. Your pattern, conversely, describes a *functional* and often *stable* structure *reliant* on self-reference and operational closure. It's less about proving truth or consistency within a logical calculus, and more about sustaining authority, control, and normative boundaries within a complex social, legal, or computational system. The "inviolate core" (`K`) acts as a practical *source* of stability within the closure, not (necessarily) a source of logical contradiction.

  ### Distinction from Ordinary Hierarchical Control
  Ordinary hierarchy implies distinct, separable levels where the higher level exerts control *externally* over the lower. Your pattern breaks this separability: the meta-level (`M`) is not external; it is constituted *by* and *dependent on* the base level (`R`) it controls. Its "transcendence" is an *institutional fiction* necessary for its function, maintained by the system's internal operations. The core (`K`) embodies the ultimate anchoring point of this fiction within the system itself.

  In essence, you've identified a sophisticated mechanism for achieving systemic stability and normative authority through a *managed loop* of self-reference, where the system simultaneously creates, governs, and absolutely limits its own capacity for change around a sacred kernel (`K`), all while maintaining the crucial *appearance* of a hierarchy that transcends the messy reality of its own immanent construction. It's a fascinating dance between operational necessity and conceptual order.
