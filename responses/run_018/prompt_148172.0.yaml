  I recall several relevant concepts that approach this pattern but don't quite capture it fully. In jurisprudence, Kelsen's Grundnorm and Hart's rule of recognition describe foundational legal rules, but don't address the "untouchable clause" aspect or the dependency loop. Autopoiesis in systems theory describes self-referential systems but misses the hierarchical control element. Gödel's incompleteness involves self-reference but focuses on provability rather than authority structures.

