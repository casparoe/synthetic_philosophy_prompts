prompt: |-
  I spent last weekend in a long argument with a friend who insisted that every case of organizational escalation—continuing a failing procurement, extending a broken contract, funding another tranche of a stalled project—is just Shubik’s dollar auction replayed at scale: once resources are committed, withdrawal becomes more expensive than continuing, so rational agents keep bidding past their true valuation. I think that collapses too quickly, because it treats all prior costs as sunk in the same structural way and ignores whether the environment has a second-place penalty—reputation damage, broken coalition commitments, forfeited option rights, or shadow competitors—such that leaving costs something even if you never “win.” I advise boards and public-agency governance committees, under tight deadlines and with signatures required, on whether to authorize another funding round or terminate. I need a reusable decision procedure—ordered questions, with what counts as a sufficient answer to each, explicit stop/no conditions, and marked handoff points where the issue is organizational identity or face-saving rather than decision-theoretic fact. The procedure should distinguish a true dollar-auction trap, in which withdrawal bears unrecoverable collateral costs regardless of eventual success and there are multi-party reputation stakes, from ordinary sunk-cost confusion or from rational strategic continuation that buys option value or resolves uncertainty. It should include an “exit premium” calculation comparing the full cost of leaving against the expected value of continuing, but only after filtering out costs that are genuinely sunk and non-transferable, and it should flag where rational escalation is being misclassified as pathology. Apply it to two cases: first, a municipal transit authority that has spent sixty percent of its rail-car budget with a vendor now delivering defective units, where termination triggers a two-year litigation freeze and loss of credibility with the state funding authority; second, a research consortium deciding whether to extend a clinical trial that has shown null interim results, where direct extension costs are low but partner trust and publication rights depend on formal completion. Include one case where the procedure recommends termination that the governing body will strongly resist, and state explicitly what the procedure cannot adjudicate—particularly when identity-preservation or coalition maintenance is the real driver and should be named rather than disguised as cost-benefit reasoning.
reasoning: |-
  We are designing a decision procedure to evaluate whether a situation is a true dollar-auction trap (with collateral costs on withdrawal regardless of eventual success and multi-party reputation stakes) versus ordinary sunk-cost confusion or rational strategic continuation.

  The procedure must:
  1. Distinguish between true dollar-auction traps and other situations.
  2. Include an "exit premium" calculation that compares the full cost of leaving against the expected value of continuing, after filtering out genuinely sunk and non-transferable costs.
  3. Flag situations where rational escalation is being misclassified as pathology.
  4. Be structured as ordered questions with clear stop/no conditions and handoff points for organizational identity or face-saving issues.

  Procedure Outline:

  Step 1: Identify Sunk Costs
     Question: What costs have already been incurred and are non-recoverable regardless of the decision to continue or terminate?
     Sufficient Answer: A list of costs that are irrevocably spent and cannot be recovered in any scenario. These must be excluded from future cost considerations.
     Stop Condition: If the decision-maker cannot separate sunk costs from future costs, halt and require a clear accounting. This step is foundational.

  Step 2: Assess Withdrawal Penalties (The "Exit Premium")
     Question: What are the immediate and direct costs of termination that would not be incurred if we continue? Include:
        - Contractual penalties (e.g., litigation costs, termination fees)
        - Reputational damage (e.g., loss of credibility with funders, partners)
        - Forfeited rights (e.g., option rights, publication rights)
        - Coalition or partnership breakage (e.g., loss of trust, withdrawal of partners)
     Sufficient Answer: Quantifiable or qualitatively severe costs that are triggered only by withdrawal and are independent of eventual project success. These form the "exit premium".
     Stop Condition: If the exit premium is negligible, then the situation is not a dollar-auction trap and the decision should be based on expected future costs and benefits of continuing.

  Step 3: Evaluate Expected Value of Continuing
     Question: What is the expected value (probability-weighted) of continuing the project? Consider:
        - The probability of eventual success (with best available evidence)
        - The value of success (including any strategic, reputational, or option value)
        - The future costs required to achieve that success (excluding sunk costs)
     Sufficient Answer: A range of expected values based on realistic probabilities and outcomes. This must include a best-case, base-case, and worst-case scenario.

  Step 4: Compare Exit Premium to Expected Value of Continuing
     Calculation: Compare the total exit premium (from Step 2) to the expected value of continuing (from Step 3). If the exit premium is higher than the expected value of continuing, then the project is in a dollar-auction trap: termination is more expensive than continuing even when continuing is expected to lose value.
     Note: In a dollar-auction trap, the rational decision might be to continue even when the expected value is negative, because the exit premium is so high.

  Step 5: Check for Rational Strategic Continuation
     Question: Are there option values, learning benefits, or uncertainty resolution that could be achieved by continuing? (e.g., continuing a trial to gather more data for future projects, maintaining a relationship for future contracts)
     Sufficient Answer: Clear articulation of non-sunk future benefits that are not captured in the expected value of the current project's success. If these benefits are substantial, then escalation might be rational even without a dollar-auction structure.
     Flag: If such benefits exist and are the primary reason for continuing, then the situation is not a dollar-auction trap but a rational strategic choice.

  Step 6: Handoff for Non-Economic Factors
     Condition: If the decision appears to be driven by organizational identity, face-saving, or coalition maintenance, and these factors are not captured in the exit premium or expected value, then hand off the decision to a governance body for a political or identity-based decision.
     Explicit Note: The procedure cannot adjudicate when the primary driver is non-economic (e.g., preserving the organization's self-image or maintaining key relationships). In such cases, the decision must be framed honestly as such, not disguised as cost-benefit.

  Now, apply the procedure to the two cases:

  Case 1: Municipal Transit Authority Rail-Car Procurement

  Step 1: Sunk Costs
     - 60% of the rail-car budget already spent. These are sunk and non-recoverable.

  Step 2: Exit Premium (Withdrawal Penalties)
     - Termination triggers a two-year litigation freeze (during which no alternative procurement can start). The cost: delay in replacing rail-cars (estimated at $X per year in operational inefficiencies and maintenance of old fleet) plus legal costs.
     - Loss of credibility with state funding authority: may result in reduced future funding (quantify as a percentage reduction in future grants, if possible) or increased scrutiny.

  Step 3: Expected Value of Continuing
     - Probability of vendor fixing defects? Based on past performance and contract terms, estimate a probability (e.g., 20% chance of success).
     - Value of success: getting functional rail-cars (worth the remaining 40% of the budget, but also the value of having the new cars in service).
     - Future costs: the remaining 40% of the budget plus any additional costs to fix defects.

     Expected value = (Probability of success * Value of success) - Future costs
     If the probability of success is low and future costs are high, expected value may be negative.

  Step 4: Compare
     Exit premium (cost of termination) = [Cost of 2-year delay] + [Legal costs] + [Quantified loss of credibility]
     Expected value of continuing = [0.2 * (Value of working rail-cars)] - [Remaining 40% budget + any fix costs]

     If exit premium > expected value of continuing (which is likely negative), then it's a dollar-auction trap: even though expected value is negative, termination is more expensive.

  Step 5: Rational Strategic Continuation?
     - Option value: none clearly stated.
     - Learning: minimal.
     - So, if there is no substantial strategic benefit, then the escalation is due to the dollar-auction trap.

  Step 6: Handoff?
     - The transit authority might fear being seen as incompetent. If that is the primary driver, then the decision should be handed to the board with a clear statement: "We are continuing to avoid the high exit premium, but note that this is a dollar-auction trap. Alternatively, we must consider if preserving our reputation with the state by cutting losses and being decisive is more important in the long run despite the exit premium."

  Case 2: Research Consortium Clinical Trial

  Step 1: Sunk Costs
     - Costs already incurred in the trial to date are sunk.

  Step 2: Exit Premium
     - Termination might lead to loss of partner trust (which could affect future collaborations). Quantify as the expected value of lost future partnerships.
     - Forfeited publication rights: if the trial is not formally completed, they might lose the right to publish the results (which has academic and reputational value).

  Step 3: Expected Value of Continuing
     - The trial has shown null interim results. The probability of a positive final result is low (say 10%).
     - Value of success: the scientific and reputational value of a positive result (which is high) but low probability.
     - Future costs: direct extension costs (low, as stated).

     Expected value = (0.10 * High Value) - Low Future Costs. This might be positive but small.

  Step 4: Compare
     Exit premium: loss of partner trust and publication rights. This might be high if the consortium relies on these partnerships.
     Compare: If the exit premium (e.g., $Y in lost partnership value) is higher than the expected value of continuing (which is positive but small), then it's a dollar-auction trap? Not necessarily, because the expected value of continuing is positive. We continue if expected value of continuing > exit premium? Actually, we are comparing the cost of leaving (exit premium) to the net benefit of continuing (expected value of continuing). So:

     If [Expected value of continuing] > [Exit premium] then continuing is better.
     But note: the exit premium is incurred only if we leave. The expected value of continuing is the net benefit we get by continuing.

     Alternatively, we can think of the cost of leaving as: exit premium + the forgone expected value of continuing? Actually, the decision is:

     Continue: get (Expected value of continuing)
     Terminate: incur (Exit premium) and get 0 (from this project) plus any non-project consequences (which are included in exit premium?).

     So we continue if: Expected value of continuing > - Exit premium? That doesn't make sense.

     Actually, the net benefit of terminating is: - (Exit premium)
     The net benefit of continuing is: Expected value of continuing.

     So we continue if: Expected value of continuing > - (Exit premium)  -> which is always true if Expected value is positive and exit premium is positive? That's not right.

     Let's reframe:

     The total cost of terminating: we lose the expected value of continuing (if we think of it as an opportunity cost) plus we pay the exit premium? 

     Actually, the correct comparison is:

     Continue: we get EV_continue (which might be negative or positive)
     Terminate: we get -Exit_premium

     So we should continue if: EV_continue > -Exit_premium

     But note: if EV_continue is negative, then we are comparing two negatives. We continue if EV_continue (say -$100) is greater than -Exit_premium (say -$500) -> -100 > -500, so we continue.

     Alternatively, we can think of the loss from terminating as the exit premium, and the loss from continuing as -EV_continue (if negative). We choose the smaller loss.

     In the dollar-auction trap, we have:
        Loss from terminating = Exit_premium
        Loss from continuing = - (EV_continue)   [if EV_continue is negative, then loss is positive]

     We continue if: Loss from continuing < Loss from terminating
     i.e., -EV_continue < Exit_premium   => EV_continue > -Exit_premium   (same as above)

     In the research consortium case:
        EV_continue = (0.10 * High Value) - Low Future Costs. Let's say this is $100K (positive, because the value of a positive result is very high even with low probability and low costs).
        Exit_premium: loss of partner trust and publication rights. Let's say this is $200K.

        Then, continue: get $100K
        terminate: lose $200K

        So we continue because $100K > -$200K? Actually, we are comparing $100K (positive) to -$200K (negative). So clearly we continue.

     But what if EV_continue is negative? For example, if the value of a positive result is not that high and the probability is low, and there are some future costs, then EV_continue might be -$50K.

        Continue: lose $50K
        Terminate: lose $200K (exit premium)

        Then we continue because -$50K > -$200K.

     So in both cases, if the exit premium is high, we continue even when EV_continue is negative.

  Step 5: Rational Strategic Continuation?
     - Option value: by completing the trial, they might learn something that benefits future trials (even if null, they can publish and contribute to the field). This is a strategic benefit.
     - Also, maintaining partner trust is important for future projects.

     So, if the exit premium is high and there are strategic benefits, then it might be rational to continue.

  Step 6: Handoff?
     - The consortium might feel that their identity is as a reliable research partner. If the decision is primarily about identity, then hand off to the governance body with that framing.

  Now, include one case where the procedure recommends termination that the governing body will resist.

  Example Case: A software development project for a government agency that is already 200% over budget and two years late. The vendor has consistently underperformed.

  Step 1: Sunk costs: all spent money is sunk.

  Step 2: Exit premium: 
     - Contractual penalty for termination: $5 million.
     - Reputation damage: might make other vendors wary? But the agency has a strong case for termination due to vendor non-performance. Also, the agency might gain a reputation for being tough on underperformance.
     - Loss of already developed software? But the agency might own the code and can hire another vendor to complete it. So minimal.

  Step 3: Expected value of continuing:
     - Probability of success: 10% (vendor has consistently failed).
     - Future costs: $10 million more (as estimated by the vendor, but likely to increase).
     - Value of success: the software is worth $15 million to the agency.

     EV_continue = 0.10 * 15M - 10M = -$8.5 million.

  Step 4: Compare:
     Continue: loss of $8.5 million.
     Terminate: loss of $5 million (exit premium) and possibly a gain from re-procurement (which we haven't factored). But note, if we terminate, we can re-procure. Let's factor that:

     Actually, termination leads to:
        - Pay $5M penalty.
        - Then, re-procurement: expected cost and value.

     But if we don't factor re-procurement, then:

        Terminate: loss = $5M
        Continue: loss = $8.5M

     So termination is better.

     However, we must also consider the expected value of re-procurement. Let’s say the agency can start a new project with a better vendor, costing $12 million and with 80% chance of success (value $15 million). Then:

     Expected value of termination and re-procurement: 
          = -$5M (termination penalty) + [0.8 * $15M - $12M] 
          = -$5M + ($12M - $12M)   [wait: 0.8*15=12, minus 12, so 0] 
          = -$5M.

     So still -$5M, which is better than -$8.5M.

     Alternatively, if the re-procurement has a positive expected value, then termination is even better.

  Step 5: Rational Strategic Continuation?
     - None. The vendor has shown inability.

  Step 6: Handoff?
     - The agency might want to avoid admitting failure. The governing body might resist termination because of the political fallout (they championed the project). The procedure flags: the exit premium is less than the expected loss of continuing. However, if the governing body is primarily concerned with political fallout (which is a form of reputation damage that we might not have quantified), then we hand off. But note: we did include reputation damage in Step 2 and found it minimal. If there is unquantified political fallout, then we must hand off and state that the decision is political.

  In this case, the procedure recommends termination, but the governing body might resist because of the political embarrassment.

  What the procedure cannot adjudicate:
     - When the primary concern is preserving the organization's identity (e.g., "we are not quitters").
     - When the decision is about maintaining a coalition (e.g., a key stakeholder will leave if we terminate).
     - Face-saving: the organization's leadership would look bad.

  In such cases, the procedure flags that the decision should be made on non-economic grounds and the governing body should explicitly acknowledge that.
answer: |-
  ### Decision Procedure for Organizational Escalation Dilemmas

  This structured procedure distinguishes **true dollar-auction traps** (withdrawal imposes unrecoverable collateral costs regardless of success) from **ordinary sunk-cost confusion** or **rational strategic continuation**. It includes explicit stop/no conditions, exit premium calculations, and handoff points for non-economic factors.

  ---

  #### **Decision Procedure: Ordered Questions**

  1. **Identify Truly Sunk Costs**  
     - *Question:* What costs are irrevocably spent and non-recoverable in *all* scenarios (termination or continuation)?  
     - *Sufficient Answer:* Itemized list of costs with evidence they cannot be recouped (e.g., spent budget, irreplaceable time).  
     - *Stop Condition:* If >50% of prior costs are misclassified as recoverable (e.g., via litigation), halt and audit. Proceed only when sunk costs are quantified and isolated.

  2. **Map Withdrawal Penalties ("Exit Premium")**  
     - *Question:* What direct penalties occur *only* if we terminate, independent of project success? Include:  
       - Contractual penalties (e.g., litigation costs, forfeited deposits).  
       - Reputational damage (e.g., loss of funder trust, partner backlash).  
       - Lost rights (e.g., forfeited options, publication access).  
       - Coalition/relationship collapse (e.g., broken alliances, shadow competitors gaining advantage).  
     - *Sufficient Answer:* Quantifiable penalties (monetary or high-probability risks).  
     - *No Condition:* If exit premium ≤5% of total project budget, termination is likely safe—proceed to step 3.  
     - *Stop Condition:* If exit premium is unquantifiable, escalate to governance for political assessment.

  3. **Calculate Expected Value of Continuation**  
     - *Question:* What is the probability-adjusted value of continuing? Include:  
       - Tangible outcomes (e.g., revenue, cost savings).  
       - Intangible benefits (e.g., option value, uncertainty resolution, learning).  
       - Future costs (excluding sunk costs).  
     - *Sufficient Answer:* Range of outcomes (optimistic/pessimistic) using verifiable data (e.g., pilot studies, vendor performance history).  
     - *Stop Condition:* If expected value is negative *and* exit premium is low (<10% of continuation cost), terminate immediately.

  4. **Compare Exit Premium vs. Continuation Value**  
     - *Calculation:*  
       - **Net Continuation Value (NCV)** = Expected Value of Continuation − Future Costs.  
       - **Exit Premium (EP)** = Quantified withdrawal penalties.  
       - **Decision Rule:**  
         - If NCV > −EP, continue (rational if NCV positive or loss smaller than EP).  
         - If NCV ≤ −EP, you are in a **dollar-auction trap** (withdrawal costs exceed continuation losses).  
     - *Flag for Misclassification:* If NCV is positive due to option value (e.g., learning, strategic positioning), this is **rational escalation**—not pathology.

  5. **Assess Strategic Rationale**  
     - *Question:* Are there hidden benefits to continuation that offset low NCV?  
       - e.g., Securing market position, deterring competitors, gathering data for future projects.  
     - *Sufficient Answer:* Evidence these benefits are probable and material (e.g., competitor analysis, option-pricing models).  
     - *Flag:* If benefits exist but are unproven, designate as "speculative escalation."

  6. **Handoff for Non-Economic Drivers**  
     - *Condition:* If EP is high but the primary resistance to termination is:  
       - Organizational identity ("We don’t quit").  
       - Face-saving ("Leadership will look weak").  
       - Coalition maintenance ("Allies will abandon us").  
     - *Action:* Explicitly state: "This decision is driven by identity/coalition needs—not cost-benefit." Handoff to governance for political/ethical deliberation.

  ---

  #### **Application to Cases**

  **Case 1: Municipal Transit Authority Rail-Car Procurement**  
  - **Context:** Spent 60% of budget; vendor delivers defective units. Termination causes 2-year litigation freeze and loss of state funding credibility.  
  - **Procedure Analysis:**  
    1. **Sunk Costs:** 60% budget spent (sunk).  
    2. **Exit Premium:**  
       - Litigation freeze delay cost: $2M/year (e.g., operational inefficiencies).  
       - Lost state credibility: 20% reduction in future grants ($5M NPV).  
       - **EP Total:** $9M ($4M delay + $5M grants).  
    3. **Continuation Value (NCV):**  
       - 20% chance vendor fixes defects (per audit).  
       - Success value: $10M (savings from new cars).  
       - Future costs: 40% budget + $1M repairs = $5M.  
       - **NCV:** (20% × $10M) − $5M = **−$3M**.  
    4. **Comparison:** NCV (−$3M) > −EP (−$9M) → **Dollar-auction trap**. Continuation loses less than exit premium.  
    5. **Strategic Rationale:** Low option value (no competitive or innovation upside).  
    6. **Handoff:** If board resists due to "not wasting taxpayer money," flag: "Decision is political—about appearing decisive to the public."  
  - **Recommendation:** Continue but renegotiate contract. Exit premium makes termination irrational.

  **Case 2: Research Consortium Clinical Trial**  
  - **Context:** Null interim results; extension costs low, but termination risks partner trust and publication rights.  
  - **Procedure Analysis:**  
    1. **Sunk Costs:** Prior research costs (sunk).  
    2. **Exit Premium:**  
       - Lost partner trust: $500K (NPV of future collaborations).  
       - Forfeited publication rights: $200K (reputational/value impact).  
       - **EP Total:** $700K.  
    3. **Continuation Value (NCV):**  
       - 5% chance of success (per interim analysis).  
       - Success value: $2M (grants, IP licensing).  
       - Future costs: $100K.  
       - **NCV:** (5% × $2M) − $100K = **$0** (break-even).  
    4. **Comparison:** NCV ($0) > −EP (−$700K) → **Dollar-auction trap**.  
    5. **Strategic Rationale:** High option value—completion preserves consortium reputation for future trials. **Flag:** Rational escalation (not pathology).  
    6. **Handoff:** If partners insist on continuation for "scientific integrity," acknowledge coalition needs.  
  - **Recommendation:** Continue. Low continuation cost and strategic value outweigh EP.

  ---

  #### **Case 3: Software Development Project (Termination Recommended but Resisted)**  
  - **Context:** Government agency project: 200% over budget, 2 years late. Vendor underperforming. Termination risks political embarrassment and contractor lawsuits.  
  - **Procedure Analysis:**  
    1. **Sunk Costs:** All spent funds (sunk).  
    2. **Exit Premium:**  
       - Litigation: $1M.  
       - Political fallout: Unquantifiable (handoff trigger).  
    3. **Continuation Value (NCV):**  
       - 10% chance of success (per independent review).  
       - Success value: $5M.  
       - Future costs: $8M.  
       - **NCV:** (10% × $5M) − $8M = **−$7.5M**.  
    4. **Comparison:** NCV (−$7.5M) ≤ −EP (assume −$1M if quantifiable) → **Terminate** (continuation loss > EP).  
    5. **Strategic Rationale:** None (vendor competence low, no competitive upside).  
    6. **Handoff:** Governing body resists due to "avoiding scandal." Explicitly state: "Resistance is driven by face-saving, not economics. EP is inflated by unquantifiable political fear."  
  - **Recommendation:** Terminate and re-procure. NCV is catastrophically negative; EP is manageable.  

  ---

  #### **What the Procedure Cannot Adjudicate**  
  - **Identity Preservation:** When "who we are" (e.g., "We deliver on promises") overrides economics.  
  - **Coalition Maintenance:** If termination collapses critical alliances, the cost-benefit frame is irrelevant.  
  - **Face-Saving:** Leadership’s fear of embarrassment cannot be quantified—it requires honest acknowledgment: "We continue to avoid looking weak, not because it makes financial sense."  
  - **Non-Quantifiable Reputation:** When reputational damage is speculative (e.g., "Investors *might* lose faith"), the procedure defaults to governance judgment.  

  **Final Output**: A transparent decision memo separating:  
  - Dollar-auction traps (exit premium > continuation loss).  
  - Rational escalation (strategic benefits justify costs).  
  - Non-economic drivers (handed off for political/ethical review).
