answer: |-
  ### Workshop Activity Design: Experiencing the Pasadena Paradox  
  **Goal**: Make students feel the difference between an *undefined* expectation (due to non-convergence) and a large but finite one through a hands-on game. Focus on the Pasadena paradox’s core: alternating-sign payoffs with geometric probabilities, leading to a non-convergent expectation series (Grandi series: 1 − 1 + 1 − 1 + ...).  

  **Key Dynamics & Constraints**:  
  - **No cash, but "real" stakes**: Use points redeemable for symbolic rewards (e.g., "philosophy points" for bragging rights, a fun certificate, or extra discussion time).  
  - **15 students, 90 minutes total**: Activity runs 20 minutes; debrief maps outcomes to math (20 minutes); remaining time for discussion.  
  - **Avoiding infinity**: The true infinite horizon cannot be replicated—use a finite truncation (10 rounds) but have auditors "simulate" infinity via grouping.  
  - **Contested vs. settled**:  
    - **Settled**: The expectation is undefined (series doesn’t converge); partial sums depend on grouping order.  
    - **Contested**: Whether undefined expectations invalidate expected-value reasoning entirely or merely require refinements (e.g., alternate decision rules).  

  ---

  ### Activity: The Pasadena Game  
  **Time**: 20 minutes  
  **Roles** (divide students randomly):  
  - **Players (6 students)**: Decide whether to "pay" to play the game.  
  - **Auditors (9 students, 3 teams of 3)**: Compute expected value using different grouping rules.  
  - **Game Master (you)**: Run coin tosses and enforce rules.  

  **Materials**:  
  - Coin (or app) for tosses.  
  - Scoreboard (whiteboard or poster) for payoffs.  
  - Calculators for auditors.  
  - Tokens (e.g., poker chips) for "point stakes" (1 token = 1 point).  

  #### Rules of the Game:  
  1. **Gameplay**:  
     - A coin is tossed until the **first tail** appears or **round 10** is reached.  
     - **Payoff**: If the first tail occurs on round \(k\), the player receives \((-1)^{k+1} \times 2^k\) points.  
       - *Example*:  
         - Round 1 (tails): \(+2\) points.  
         - Round 2 (tails): \(-4\) points.  
         - Round 10 (tails): \(-1024\) points.  
     - If no tail appears by round 10, payoff = 0.  

  2. **Player Choice**:  
     - Players decide individually whether to "buy in" by paying a **fee of 0.5 tokens** (representing a small opportunity cost).  
     - Players keep net winnings (payoff − 0.5) as tokens.  

  3. **Auditor Tasks**:  
     - **Team A**: Compute expected value by grouping terms as \((1 - 1) + (1 - 1) + \dots = 0\).  
     - **Team B**: Compute expected value by grouping terms as \(1 + (-1 + 1) + (-1 + 1) + \dots = 1\).  
     - **Team C** (control): Compute the **finite expected value** for rounds 1–10 (settled: \(E = 0\) for even rounds).  
     - Auditors present results *before* players hear payoffs.  

  #### Flow:  
  1. **Setup (3 min)**:  
     - Explain rules and roles. Emphasize auditors are "theorists" evaluating the *infinite* game.  
     - Distribute tokens (e.g., 10 tokens/player to cover fees).  

  2. **Gameplay (10 min)**:  
     - Players privately decide whether to play (pay 0.5 tokens if they play).  
     - **For each player** (6 players × 1 min each):  
       - Toss coin until first tail or round 10.  
       - Record payoff on scoreboard (e.g., "Player 1, Round 3: +8").  
     - **Auditors** work in teams during gameplay to compute their \(E\).  

  3. **Auditor Reports (4 min)**:  
     - Teams A and B present their \(E\) (0 and 1). Team C presents finite \(E = 0\).  
     - **Conflict**: Teams A/B debate which grouping is "correct" for decision-making.  

  4. **Player Outcomes (3 min)**:  
     - Calculate net scores (payoff − 0.5) for players.  
     - Compare to auditors’ predictions (e.g., Team A says "never play," Team B says "always play").  

  ---

  ### Debrief (20 min): Mapping Activity to Theory  
  **Guide the discussion** with questions:  

  1. **What happened?**  
     - Players experienced variable payoffs (e.g., +2, -4, 0).  
     - Auditors disagreed on \(E\): 0 (Team A) vs. 1 (Team B) for the "infinite" game, while Team C got 0 for finite.  

  2. **Math mapping**:  
     - **Geometric probabilities**: Probability of first tail at \(k\) is \((1/2)^k\)—explains payoff volatility.  
     - **Alternating series**: Payoffs \((-1)^{k+1} \times 2^k\) create the Grandi series \(1 - 1 + 1 - 1 + \dots\) in expectation.  
     - **Dependence on grouping**:  
       - Team A: \((1-1) + (1-1) + \dots \to 0\).  
       - Team B: \(1 + (-1+1) + (-1+1) + \dots \to 1\).  
       - *Why?* The series is **conditionally convergent**—rearrangement changes the sum. Finite sums (Team C) are immune.  
     - **Undefined expectation**: Series lacks convergence; no single "expected value" exists.  

  3. **Contested implications**:  
     - Does undefined \(E\) mean we should:  
       - Abandon expected-value reasoning? (One view: "No rational choice possible.")  
       - Use alternatives (e.g., dominance, bounded utility)? (Another view: "It’s a limitation, not a failure.")  
     - *Stress*: This is unresolved—no consensus in decision theory.  

  4. **Activity’s limitation**:  
     - **Finite truncation (round 10)** forced a defined expectation (\(E = 0\)), but the *true paradox requires infinity*. We simulated disagreement via auditor grouping, but infinity’s "open horizon" is irreproducible.  

  ---

  ### Predictable Problems (and Solutions):  
  1. **Players avoid risk**: If students balk at negative payoffs, remind them tokens are low-stakes "fun points."  
  2. **Auditor confusion**: Some may struggle with grouping abstraction. Pre-print handouts with examples:  
     - Team A: \((1-1) = 0\), \((1-1) = 0\), ...  
     - Team B: \(1 + (-1+1) = 1 + 0\), ...  
  3. **Misinterpreted payoffs**: Clarify that "round \(k\)" means "first tail on toss \(k\)" (probability \(1/2^k\)).  
  4. **Skewed results**: With 6 players, payoffs may cluster (e.g., all early tails). Use results to discuss volatility, not convergence.  
  5. **Debate dominance**: Team A/B may dismiss each other. Intervene: "Both are mathematically valid for the infinite game—what does that imply?"  

  **Why this works**: Players *feel* the stakes via tokens; auditors *experience* disagreement mathematically; the debrief links intuition to theory while respecting contested views. This bridges the "undefined vs. large" gap by making infinity’s absence palpable.
