  Claim 3: Arbitrary decoding rules. Strong point here. The codon-amino acid mapping is arbitrary, like symbols in a code. This is well-supported and central to the literal-code argument. No red flags.

  Claim 4: Not fixed by physics/chemistry. True for the mapping rules. Chemistry doesn't dictate which codon equals which amino acid. But the user's worry is about the jump to semantic autonomy. Autonomy suggests information exists independently, but in reality, the system only works within the cell's chemistry. The ribosome's physical structure is crucial; it's not abstract decoding. So this claim conflates "not determined by" with "independent of."

  Claim 5: Ontologically distinct level. Here's the overreach. Information isn't ontologically independent; it's realized in molecular interactions. Saying it's autonomous ignores context-dependence. The user suspects an equivocation between "not chemically determined" and "not physically realized"—yes! The argument slides from arbitrariness to independence, but the information is still embodied in chemistry.

  What would a careful defender say? They'd qualify "autonomy" as causal-informational, not linguistic. They might accept a weak autonomy—patterns matter beyond molecules—but reject strong ontological independence. Biosemiotics folks might push for meaning, but mainstream biology sees it as mechanistic.

