  Breaking it down. Claim 1: DNA as a literal program. Accurate in terms of sequence-driven processes, but "program" might be too computational. Biologists use "genetic code" metaphorically, but purists argue it's literal due to arbitrariness. However, DNA lacks key features of software, like conditional execution. So it's partially accurate but conflates syntax with semantics if pushed too far.

