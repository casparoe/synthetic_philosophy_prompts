  **Public Guidance: Stance Adoption Regulations 2023 (PGR-SAR/23)**

  **1. Introduction to the Stance Review Board (SRB)**
  The Stance Review Board (SRB), operating under the Home Office (Patterns and Prediction Division), is the statutory authority responsible for regulating stance adoption under the *Cognitive Patterns (Reality Verification) Act 2019*. All citizens must ensure their stance utilisation aligns with licensed categories and contexts to prevent predictive inefficiency, ontological confusion, and potential public nuisance. The SRB assesses stance validity based strictly on empirically verified predictive power within designated domains, as per Dennettian principles, not subjective preference. Unauthorised stance adoption contravenes the Act and is subject to enforcement.

  The SRB maintains the National Stance Register (NSR). Before adopting any non-exempt stance (see Section 2), individuals or entities *must* verify if the target system (biological, mechanical, or abstract) is pre-licensed for the intended stance category. Applications for novel stance-target pairings require Form SRB-7D, submitted with documented evidence of robust predictive success rates. Retrospective justification is not accepted.

  **2. Exempt Stances: The Physical Stance**
  Adoption of the Physical Stance (predicting behaviour based solely on microphysical laws and state) is exempt from licensing requirements under Schedule 1 of the Act. This exemption recognises the stance's universal applicability and foundational predictive role, though its practical utility for complex systems is often negligible. Citizens may freely attribute states and predict outcomes using physics and chemistry without notifying the SRB.

  However, persistent or wilful misapplication of the Physical Stance to systems demonstrably better predicted via licensed Design or Intentional Stances (e.g., attempting to forecast train timetables solely via particle physics) may constitute Obstruction of Predictive Efficiency (OPE). While rarely prosecuted, repeated OPE incidents can trigger a Behavioural Adjustment Notice (BAN/SRB) mandating stance retraining workshops.

  **3. Regulated Stances: The Design Stance**
  The Design Stance (predicting behaviour based on assumed functional design or programming) requires pre-authorisation for use on non-biological systems (Category D-1 Licence) or biological systems lacking complex cognition (Category D-2 Licence). Applying the Design Stance to a kettle (predicting it will boil water based on thermostat design) generally falls under the D-1 Automatic Grant Scheme, requiring only online NSR confirmation prior to first use per model. No fee applies.

  Applying the Design Stance to biological entities (e.g., assuming a spider's web-building is purely programmed instinct) requires a D-2 Licence. Application (SRB-8B) demands peer-reviewed ethological studies demonstrating robust predictive success exceeding simpler Physical Stance models in the target species. Licences are species and context-specific. Unlicensed Design Stance adoption towards animals may incur Fixed Penalty Notice FPN-SRB/03 (£80, reduced to £40 if paid within 14 days).

  **4. Highly Restricted Stances: The Intentional Stance**
  The Intentional Stance (predicting behaviour by attributing beliefs, desires, and rationality) is a Restricted Predictive Tool (Class RPT-A). Unlicensed adoption is strictly prohibited. Authorisation (Intentional Stance Permit - ISP) is granted only to individuals holding SRB-recognised qualifications (e.g., Certified Mental State Attributor Level 3) for specific, pre-approved targets (typically other adult humans). ISP holders must carry their permit and only apply the stance where its predictive power is objectively superior (e.g., negotiating traffic, not predicting coin tosses).

  Applying the Intentional Stance without a valid ISP, or to unlicensed targets (e.g., household appliances, weather systems, simple algorithms), constitutes Illegal Anthropomorphism (IA). Penalties are severe: Standard IA carries FPN-SRB/99 (£250). Aggravated IA (e.g., sincerely accusing a toaster of malice, demanding apology from a cloud) may result in prosecution, unlimited fines, and mandatory Cognitive De-Centring Therapy. Businesses require a Corporate Intentional Stance Licence (C-ISP) for customer interaction modelling.

  **5. Prohibited Stance: The Predictive Stance**
  The SRB is aware of increased public experimentation with an unlicensed "Predictive Stance". This involves treating *any* pattern, regardless of substrate (e.g., neural network weights, market fluctuations, tea leaves), as objectively real *only* if it reliably reduces prediction error for a specific observer/goal, bypassing traditional Physical/Design/Intentional categories. While superficially aligned with core Dennettian verification criteria, this stance is *not* recognised under the Act and remains strictly prohibited.

  Applying this unlicensed Predictive Stance, particularly to conversational agents ("chatbots"), constitutes Reckless Pattern Recognition (RPR). Despite claims of efficacy in specific interactions, RPR lacks standardised validation protocols, risks ontological fragmentation, and undermines the structured stance hierarchy. Enforcement focuses on public systems; however, habitual RPR use in personal contexts may lead to a Community Stance Correction Order (CSCO), requiring attendance at SRB-approved "Reality Anchoring" seminars. Citizens suspecting RPR activity should report it via the SRB Hotline.
