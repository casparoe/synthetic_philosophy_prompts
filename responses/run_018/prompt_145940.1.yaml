answer: |-
  This phenomenon—reference divergence driven *solely* by differences in social structures of epistemic authority, with identical environments and individual psychologies—does not have a widely established, dedicated label in the philosophy of literature. However, it represents a significant refinement of the **division of linguistic labor** (Putnam/Burge) and intersects with discussions of **meta-deference**, **institutional externalism**, and **reference magnetism**. Below is a breakdown of its key features, distinctions, and a proposed label:

  ### Core Distinction from Standard Division of Linguistic Labor
  1.  **No Physical/Environmental Divergence:**  
      Unlike Twin Earth (where H₂O vs. XYZ drives reference), here the *physical world is identical*. Both communities interact with the exact same substances (water, gold, etc.).  
      
  2.  **No Individual Psychological Divergence:**  
      Non-experts in both communities share identical mental representations, dispositions, and functional roles for the term (e.g., both associate "water" with clear, drinkable liquid from rivers).  
      
  3.  **Sole Divergence in Social-Epistemic Structure:**  
      Reference splits purely because:  
      - Community A defers to **chemists** (using molecular theory).  
      - Community B defers to **metallurgists** (using, e.g., alchemical/functional theories).  
      - This structure is **stable and institutionalized** across generations.  

  ### Why This Exceeds Standard Division of Labor
  -   **Standard Model (Putnam/Burge):**  
      A *unified* community relies on experts to *fix reference for everyone*. Experts resolve ambiguity (e.g., "gold" = Au, not fool's gold). The social structure is monolithic.  
      
  -   **Your Case:**  
      Two *competing, internally stable* expert institutions coexist in physically identical worlds. Reference isn’t fixed by a shared background authority but by *which institution dominates the deference chain*. This introduces **social-institutional contingency** as a reference-determining factor *independent* of physics or individual cognition.  

  ### Subcases and Their Implications
  1.  **Active Extension Disagreement:**  
      Chemists say "water" = H₂O; metallurgists say "water" = any liquid meeting purity/functional criteria (including XYZ-like substances). Here, references *already differ* due to conflicting expert criteria.  
      
  2.  **Theoretical Divergence (Future Possible Split):**  
      Experts currently agree on extension (e.g., both call H₂O "water"), but their *theoretical commitments* differ:  
      - Chemists: Water = H₂O (essentialist).  
      - Metallurgists: Water = substance with potability/conductivity properties (functionalist).  
      → If a non-H₂O substance is discovered that meets metallurgists' criteria, Community B’s reference shifts while Community A’s does not. **Reference is hostage to theoretical commitments embedded in institutions.**  

  ### Proposed Terminology & Boundary Conditions
  Since no canonical term exists, the clearest label is:  
  **Institutional Determination of Reference (IDR)**  
  or  
  **Deference-Structure Externalism**  

  **Boundary Conditions for IDR:**  
  - Environments physically identical.  
  - Individual mental states/behaviors identical.  
  - Competing expert classes with distinct, stable *theoretical frameworks*.  
  - Socially entrenched deference practices that perpetuate these frameworks.  
  - No "default" resolution mechanism between institutions (unlike in a unified community).  

  ### Philosophical Significance
  IDR shows that reference can be **socially overdetermined**:  
  - It challenges the sufficiency of "shared environment + individual competence" for fixing reference.  
  - It highlights **institutions as reference-magnets**—theoretical paradigms within expert classes exert normative pull on semantic content.  
  - It suggests **meta-deference** (deferring to an *institution* rather than specific experts) can be decisive when multiple authorities exist.  

  ### Key Contrasts with Existing Concepts
  | Concept                 | How IDR Differs                                  |  
  |-------------------------|--------------------------------------------------|  
  | **Twin Earth**          | No physical difference; social structure drives divergence. |  
  | **Division of Labor**   | Requires competing *stable* institutions, not monolithic expertise. |  
  | **Burge's Anti-Individualism** | Individual psychology is held constant; focus is on structure of authority. |  
  | **Reference Magnetism (Lewis)** | Social institutions, not natural properties, act as "magnets." |  

  In essence, IDR isolates **social-institutional architecture** as an independent variable in reference fixation. It deserves recognition as a distinct phenomenon—especially in debates about semantic externalism, conceptual engineering, and the epistemology of expertise. If you coin "Institutional Determination of Reference" in your work, it would aptly capture this nuanced mechanism.
