answer: |-
  Here’s a structured plan for your 90-minute seminar, prioritizing conceptual dependencies, leveraging your autonomous systems example, and preempting common misconceptions. The sequence builds Anscombe’s argument step by step while accommodating interdisciplinary perspectives.

  ---

  ### **Explanatory Sequence & Dependency Order**  
  *(Total: 75 mins + 15 mins Q&A)*  

  1. **Groundwork: The Structure of Intentional Action**  
     **(15 mins)**  
     - **Core Distinction:** *Intended Means/Ends* vs. *Foreseen Side Effects*.  
       - Use Aquinas’ *praeter intentionem* (outside intention) vs. *in intentione* (in intention).  
     - **Key Example:** *Saving a Drowning Child*.  
       - You swim through polluted water to save the child. You *intend* to rescue (end) and swim (means); you *foresee* but do *not intend* ingesting toxins.  
     - **Why start here?** This isolates the *logical structure* of action from psychology. Anscombe’s point: Moral guilt hinges on what you *make your goal*, not what you *regret*.

  2. **Introduce the Carrying Example: Autonomous Targeting System**  
     **(20 mins)**  
     - **System Specifications:**  
       - *Aim:* Destroy military target (e.g., weapons cache).  
       - *Constraint:* Predicts civilian presence via sensors; aborts if P(civilians) > 70%.  
       - *Crucial Feature:* Strikes *only proceed* when civilians are predicted to be present *but below threshold* (e.g., 65% likelihood).  
     - **Why this example works:**  
       - Civilians are a *necessary enabling condition*: The system exploits their absence (≤70%) to act. Their presence isn’t targeted, but the act is *structurally dependent* on predicting/accepting it.  
       - **Avoids utilitarianism:** Frame it as *system architecture*, not cost-benefit. The civilian data isn’t a "negative weight" in utility calculus; it’s a *gatekeeping variable* for action.  
     - **Key Question:** Is civilian risk a *side effect* or a *structurally embedded condition*?  

  3. **Apply to Anscombe’s Argument**  
     **(20 mins)**  
     - **Link to Hiroshima:** The bombings were *conditional* on civilian presence (cities chosen for density/demographics). Destroying civilians wasn’t a "mistake" but a *functional requirement* for the act’s success (breaking Japanese morale).  
       - *Contrast with traditional bombing:* Targeting a factory *despite* nearby homes (collateral) vs. targeting the city *to* destroy homes (intended means).  
     - **Psychological Innocence Irrelevant:** Truman’s regret doesn’t change that civilian destruction was *operationalized* (like the drone’s 70% rule).  

  4. **Preempt Misconceptions**  
     **(Timed within above sections)**  
     - **Pacifism?** *(Address after Step 2)*  
       - Anscombe opposed *this specific act*, not all force. She supported just war principles.  
     - "**Unmodified Double Effect?**" *(Address after Step 3)*  
       - PDE traditionally allows foreseen harm if unintended. Anscombe argues civilians *were* intended *as means* (morale collapse), collapsing PDE’s conditions.  
     - **Truman’s Mental States?** *(Address when discussing "innocence")*  
       - Shift focus: "Intention" here is *in the act’s description*, not private psychology.  
     - **CS Pitfall: Intention = Objective Function** *(Address when introducing drone example)*  
       - Clarify: Intention isn’t an *optimization variable* ("minimize civilians") but the *action’s teleology* (e.g., "strike requires P(civ) ≤ 70%").  

  5. **Conceptual Check**  
     **(10 mins)**  
     - **Test Question:** *"Could the drone/targeting system avoid Anscombe’s charge if it set P(civ) = 100% (certain civilian deaths) but claimed civilians weren’t ‘targeted’?"*  
       - **Correct Answer:** No. Civilians remain *structurally necessary* (the system acts *because* it calculates deaths are "acceptable"). The charge hinges on *functional role*, not labeling.  
     - **Sign of Success:** Students re-describe actions in terms of *enabling conditions* (e.g., "The system *uses* low civilian probability to permit strikes").  

  6. **Explicit Exclusions**  
     **(Opening/Closing)**  
     - State upfront: "We bracket Anscombe’s metaphysics of action, just war theory developments, and biographical context. Focus: *The logic of directed outcomes in acts*."  

  ---

  ### **Why This Sequence Works**  
  - **Progressive Build:**  
    `Action Theory (Foundation)` → `Modern Example (Bridge)` → `Historical Application` → `Misconception Cleanup`  
  - **Autonomous System Example:**  
    - **Strengths:** Mirrors Hiroshima’s conditional logic (civilian presence as enabler), avoids utility via architectural gating.  
    - **When to Introduce:** *After* establishing intention/foresight distinction but *before* Hiroshima. Use it to *model* Anscombe’s logic.  
  - **CS Student Alignment:**  
    - "Intention" is framed as *system design logic* (e.g., civilian data as a *permissive condition* in the decision tree), not psychologized "purpose."  
  - **Misconception Order:**  
    1. Pacifism (early, when setting up Anscombe’s position)  
    2. Double Effect oversimplification (mid-session, during Hiroshima analysis)  
    3. Mental states (when discussing "innocence")  
    4. Intention-as-optimization (preempted at drone example introduction)  

  ---

  ### **Materials to Prepare**  
  - Slides: Diagrams contrasting *intended means* (drone’s P(civ) ≤70% as enabler) vs. *collateral damage* (factory strike with accidental neighborhood damage).  
  - Handout: Key quotes from Anscombe on the "description under which an action is intended."  

  This structure ensures the conceptual machinery—not history or moral posturing—remains central, while giving both philosophers and engineers hooks for engagement.
