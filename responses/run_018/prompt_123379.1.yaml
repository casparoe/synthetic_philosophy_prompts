prompt: |-
  Hey, I'm prepping a seminar on metaethics and my students are stuck in the usual realism vs anti-realism loop — you know, is morality just feelings? — which is fine but we're running in circles. I want to ground it in an actual institutional pattern instead.

  There's this thing in post-conflict reparations bodies, not just big Truth and Reconciliation commissions but smaller local ones too, where they maintain formal schedules compensating material deprivation and physical violence, but when survivors describe the worst harm as being forced into degrading rituals or having their moral identity systematically erased, the commission routes that to counseling budgets as cultural trauma or psychosocial impact. The implicit rule seems to be that only harms leaving a physical or economic trace count as real injuries the state owes for; moral injury gets treated as a subjective overlay that victims recieve counseling for rather than compensation. So what view of moral reality does that funding split presuppose? Does it need a realist stance where moral harms must be anchored in physical states to be objective, maybe requiring the existance of non-natural properties? Or could an anti-realist license the same split through inter-subjective agreement being easier for bodily stuff? And is it even consistent, given these same bodies invoke human dignity language in their charters? I'm also wondering if there's a hidden commitment to what we might call axiological locality — that value has to be tied to a measurable bearer — and whether that locality commitement is doing the real philosophical work instead of realism itself. Could you reconstruct the implicit theory, distinguish what the practice strictly requires from what merely fits well with it, and tell me what would have to change in the reparations rules if we dropped that locality idea? I think I misspelled something in my framing but you get the idea.
