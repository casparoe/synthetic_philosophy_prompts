  We are in a small woodworking shop. The shared true belief is that "the band saw blade must be tensioned to 15,000 PSI for optimal cutting of hardwoods." Both workers, Alice and Ben, set the tension to exactly 15,000 PSI at the start of their shift and recheck it periodically. They both successfully cut various hardwoods without any issues all day.

   Alice (with mere true belief) bases her belief on a spurious correlation: she notices that the dial on the tension gauge always reads 15,000 PSI when the shop's wall clock shows exactly 8:00 AM (the start of shift). She doesn't understand the mechanical principles of blade tension but thinks the clock's position causes the correct tension. So she sets the tension only when the clock reads 8:00 AM and then never touches it again, believing it will stay correct because the clock won't show 8:00 AM again until the next day. (In reality, the tension remains stable because the machine is well-maintained and the shop temperature is constant.)

   Ben (with knowledge) understands the actual mechanism: the tension is set by turning a calibrated wheel that stretches the blade, and the gauge measures the force. He knows that 15,000 PSI is the manufacturer's specified tension for the blade's width and material to prevent blade drift and breakage. He periodically checks the tension using the gauge and adjusts as needed.

   The shared belief is: "The band saw blade must be set to 15,000 PSI for optimal cutting of hardwoods."

   Now, the nearby worlds:

   - Alice would go wrong in any world where the tension changes after 8:00 AM (e.g., if the shop heats up and the metal expands, causing the tension to drop) because she doesn't recheck or adjust. Also, if the clock is broken and shows 8:00 AM at other times, she might reset the tension inappropriately.

   - Ben would go wrong only in worlds where the underlying mechanism fails (e.g., the gauge is faulty, the wheel slips, or the manufacturer's specification is wrong for a particular wood) but he is robust to environmental changes because he monitors and adjusts.

   However, in this actual world, the shop temperature remains constant, the machine is stable, and the clock is accurate. So both succeed.

   The stability theorist (who says knowledge is more reliable) must concede that in this specific case, the true belief is just as stable and reliable as the knowledge because the environment is perfectly stable and the spurious correlation holds. There's no failure to demonstrate the value of stability.

   Now, an account that values explanatory integration (like coherentism or explanatory virtue) would note a difference in how they respond to an unexpected question. Suppose a colleague asks: "Why does the blade have to be 15,000 PSI? What if we cut a different wood?"

   - Alice: "Because that's what the clock says at 8:00 AM. I don't know about other woods, but at 8:00 AM it works." She cannot generalize or adjust to new information.

   - Ben: "The blade needs enough tension to stay straight under the cutting force. The manual says 15,000 PSI for hardwoods because they are dense. For softer woods, we might reduce tension to prevent blade damage, but we should check the manual." Ben can explain and adapt.

   The skeptic who denies any extra value of knowledge over true belief must point out that the appearance of a difference comes from the fact that we are imagining counterfactual scenarios (nearby worlds) where Alice fails and Ben doesn't. But the skeptic says that in the actual world, they are equally successful, so the extra value of knowledge is only counterfactual. However, the skeptic must also note that the structural feature that creates the appearance of a difference is the spurious correlation that Alice relies on. If we remove that feature and replace it with a genuinely random lucky guess (e.g., Alice sets the tension to 15,000 PSI because she flipped a coin and it came up heads, and she has no correlation at all), then the case becomes even more unstable. In that scenario, Alice might change the tension arbitrarily during the day because she has no reason to stick to 15,000 PSI. But in our case, the spurious correlation provides a non-random (though incorrect) reason that happens to hold. Thus, the spurious correlation is doing the work of making the true belief appear stable in the actual world. Without it (if it's a random guess), the true belief might not be stable even in the actual world because the worker might change it arbitrarily.

   However, note: in the original case, the spurious correlation (with the clock) is what gives Alice a reason to set the tension at 8:00 AM and then leave it. Without that, if it were a random guess, she might not have any reason to set it to 15,000 PSI and might change it on a whim. Therefore, the spurious correlation is necessary to make the true belief stable in the actual world. If we replace it with a random guess, the stability in the actual world might break down because the worker might not maintain the setting. So the case might collapse if we replace the spurious correlation with a random lucky guess because then the true belief would not be held fixed throughout the shift.

   But note: the problem says "both apply it successfully and never err", so if we replace with a random guess, we must assume that the worker with the random guess still, by sheer luck, does not change the setting. Then we have:

   - Alice (random guess): she sets it to 15,000 PSI because of a coin flip and then forgets about it. She doesn't change it because she has no reason to. So it remains.

   In this case, the stability in the actual world is maintained by her not interfering. But then the nearby worlds are different: in any world where she is asked about the tension, she might change it arbitrarily. Or if she gets bored, she might adjust it randomly. So the stability in nearby worlds is much lower. But in the actual world, she doesn't do that. So the skeptic might say that the only difference is in the counterfactual scenarios, and in the actual world they are the same. However, the explanatory integration account still shows a difference in the ability to explain and adapt.

   Therefore, the engineered feature that does the philosophical work is the spurious correlation that provides a non-random (but incorrect) reason for the worker to maintain the belief and the setting. This makes the true belief stable in the actual world and in the nearby worlds where the correlation holds. Without it (if it's a random guess), the true belief is still held in the actual world (by assumption) but is much more fragile in nearby worlds because there is no reason at all to stick to it.

   However, note that the problem requires that the spurious correlation is misread as causation. The random guess case does not have that. So if we remove the spurious correlation and replace it with a random guess, we change the case. The skeptic might then argue that the true belief without any reason (random) is less stable in the actual world because the worker might change it arbitrarily. But in our scenario, we are to assume they don't. So the skeptic must then say that the only difference is in the counterfactuals and in the explanatory integration. The skeptic might deny that explanatory integration is a form of extra value, but then we have the stability theorist conceding that in the actual case there's no difference, and the explanatory integration account pointing to a non-practical (epistemic) difference.

   In summary:

   - The case holds with the spurious correlation. Without it (if replaced by a random guess) the stability in the actual world might still hold by chance, but the worker with the random guess is more likely to change the setting arbitrarily (even if in the actual world she doesn't). Therefore, the spurious correlation is doing the work of providing a non-random (though incorrect) anchor for the true belief, making it stable in the actual world and in some nearby worlds.

   - The stability theorist must concede that in this actual world and under these conditions, the true belief is as stable as knowledge.

   - The explanatory integration account shows a difference in the ability to explain and adapt to new situations.

   - The skeptic must say that the appearance of a difference comes from our consideration of counterfactual scenarios (which the stability theorist uses) and from the explanatory integration (which the skeptic may dismiss as non-practical). The skeptic would also note that if we remove the spurious correlation and make it a random guess, then the true belief becomes more fragile (even if in the actual world it holds) because the worker might change it arbitrarily. But in the scenario where we have the spurious correlation, the worker has a reason (albeit wrong) to stick to the setting. Therefore, the spurious correlation is what creates the illusion of a stable true belief that is on par with knowledge. Without it, the true belief would be less stable.

   However, note that in the random guess case, we can still stipulate that the worker does not change the setting arbitrarily. Then the skeptic would say that in the actual world, they are the same, and the difference only appears in counterfactuals and in explanatory integration. The skeptic might then argue that the counterfactual difference is not actual and the explanatory integration is not practically relevant in this shift. But then the case still stands as an example where knowledge and true belief are practically equivalent in the actual world.

   But note: the problem requires that the worker with mere true belief relies on a spurious correlation. If we remove that and replace with a random guess, we are changing the case and the thought experiment. Therefore, the thought experiment as designed (with the spurious correlation) works to show that in the actual world they are equivalent, but the explanatory integration account still finds a difference in the structure of the belief.

