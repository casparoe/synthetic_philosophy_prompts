prompt: |-
  ok so i'm opening a small workshop next month on institutional design for long-term risk, and the room's split between historians of science who actually know von neumann's late writing and rationalist/ea people who mostly just know him for the computer architecture stuff. i want about five minutes of remarks built structurally around his idea that technology survives not because we choose it but because it reproduces and adapts like a biological system — that should actually constrain what i can say about "designing" institutions, not just be a decorative quote. specifically i want to inject this somewhat niche framing: that collective intentionality at institutional scale is always parasitic on the reproductive logic of the tools themselves, so any talk of aligning institutions has to account for that parasitism rather than treating shared human intent as primary. that's my own synthesis with some collective-intentionality literature and definitely not consensus von neumann scholarship. please write the remarks so they work for both halves of the room, clearly seperate what's settled in the scholarship from what's contested or just my injection, and don't present the parasitism framing as the standard view. also no bibliographies or reading lists — people can't chase them in the moment. keep it casual; a typo or two is totally fine.
