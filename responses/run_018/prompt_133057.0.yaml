  *   **Octave (ABAB CDCD):** Establishes strict determinism ("law exact," "fix each step," "No hidden turn," "No quantum leap," "Precisely bound"). The iterative, rule-bound nature is clear ("iterated hand," "Unfurling paths," "gears engage"). Rhyme scheme enforces regularity.
  *   **Volta (Line 9 - "But mark!"):** Sharp turn to the observer's limitation ("The eye that reads... Must veil the truth").
  *   **Sestet (EFEF GG):** Lines 9-12 detail measurement error and exponential growth ("error's faintest breath" growing into "a thicket thick with death"). Lines 13-14 introduce the *shadowing lemma* concept ("ghostly twin," "perfect path that shadows," "stride for stride," "Through all the chaos"). The mathematical notion of an exact orbit shadowing an approximate one is central.
  *   **Couplet (GG):** Holds the tension: Determinism remains true ("fixed and true," "haunts") but epistemological access is denied ("We have no knowing which true path we press"). "Haunts our guess's mess" captures the ontological presence and epistemic absence perfectly.

