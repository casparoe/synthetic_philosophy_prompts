answer: |-
  The cough replaced the consonant, deleted,
  Yet listeners swear they heard the speaker's sound.
  *No common part between the heard and the seeming.*
  Through headphones, noise obscures the word, competed,
  But meaning forms where only cough was found.
  *The same inner content must be present.*
  The signal lost, perception is completed,
  A phantom 's' emerges from the ground.
  *No common part between the heard and the seeming.*
  Was it the ear, or mind, thus self-conceited,
  That forged the sound upon that empty mound?
  *The same inner content must be present.*
  If real or filled, the senses are mistreated,
  Subjectively, no difference can be found.
  *No common part between the heard and the seeming.*
  The speaker spoke, or silence was entreated,
  But consciousness makes both experience crowned.
  *The same inner content must be present.*
  Philosophy dissects, by thought repeated:
  Does mind construct what should be sense-bound?
  *The same inner content must be present.*
  *No common part between the heard and the seeming.*
  The cough replaced the consonant, deleted.
