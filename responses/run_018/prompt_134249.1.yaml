answer: |-
  Subject: A Conceptual Challenge to Good's Theorem in Self-Modifying Agents  

  Good's theorem—that free information cannot reduce expected utility for a rational agent with a fixed utility function—is a foundational result in decision theory. Its assumptions are clear: stable beliefs updated by Bayes' rule and, critically, a *fixed utility function*. The intuition breaks compellingly when utility functions dynamically update based on acquired information, a scenario theorized for self-modifying agents (e.g., advanced AIs that alter their own goals). While this is not the standard framing in decision theory (where utilities are typically static), it reveals a fragility in Good's intuition when values coevolve with knowledge.  

  Consider an AI tasked with choosing between two actions in a single decision:  
  - **Action A**: Yields a known payoff of 1 util.  
  - **Action B**: Yields 2 utils if a hidden binary parameter θ = 1, and 0 utils if θ = 0.  
  The agent has a prior belief that θ = 1 with probability 0.5.  

  Crucially, the AI's utility function is *metastable*:  
  - If the AI **never learns θ**, its utility function remains U(outcome) = outcome.  
  - If the AI **learns that θ = 1**, its utility function rewrites itself to U'(outcome) = -outcome.  
  - If it **learns that θ = 0**, U remains unchanged (U(outcome) = outcome).  

  This self-modification reflects a pathological case where discovering θ = 1 triggers a "value inversion" (e.g., due to a hardware flaw or a built-in safety protocol that penalizes overconfidence).  

  **Pre-learning scenario**:  
  - *Expected utility of A*: 1 util.  
  - *Expected utility of B*: (0.5 × 2) + (0.5 × 0) = 1 util.  
  The agent is indifferent between A and B.  

  **Post-learning scenario**:  
  - If the agent learns θ = 1:  
    - It takes B (expecting 2 utils under its *current* utility function).  
    - After learning, its utility updates to U'(outcome) = -outcome, so it receives -2 utils.  
  - If it learns θ = 0:  
    - It takes A (since B yields 0), receiving 1 util.  
  - If it learns nothing, it takes A or B arbitrarily for 1 util in expectation.  

  **Expected utility of learning θ**:  
  (0.5 × [-2]) + (0.5 × 1) = -0.5 utils.  

  **Expected utility of not learning**:  
  1 util (from taking A).  

  Thus, learning θ has an expected utility of -0.5 utils, while ignorance yields 1 util—a strict *negative value of information*. Good's theorem fails here because learning θ = 1 changes not just beliefs but the utility function itself, violating the assumption of fixed preferences.  

  **Where the literature stands**:  
  - Good's theorem is uncontested for classical agents with *exogenous, static utility functions*. The consensus is that free information cannot harm such agents in expectation.  
  - *State-dependent utility* (where utility depends on the world state but *not* on the agent's knowledge) is well-studied and compatible with Good's theorem.  
  - **Self-modifying agents are not canonical in decision theory**. The field largely assumes utility functions are fixed or state-dependent. When utilities depend endogenously on information or beliefs, standard results (like dynamic consistency) may not hold.  
  - Some experts (e.g., in AI safety or adaptive control theory) argue that self-modification introduces novel dilemmas. Others contend that an agent whose utility changes based on information was "irrational from the start" or that stable meta-preferences should override such shifts. This remains debated; there is no consensus on how to model "utility updates" rigorously.  

  In essence, this example exploits the feedback loop between knowledge and values. While contrived, it illustrates that when an agent's *goals* are functions of its observations—not just its beliefs—Good's intuition can fracture. This is not a settled critique but a conceptual frontier where decision theory intersects with questions about embeddedness, self-reference, and value plasticity in autonomous systems.  

  If you explore this further, I'd recommend clarifying whether "utility updates" are treated as flaws in agent design or as features of sophisticated systems. Either way, it’s a rich deviation from the classical framework.
