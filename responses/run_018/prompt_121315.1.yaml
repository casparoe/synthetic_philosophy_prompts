answer: |-
  Based on your sharp description, the pattern you're seeing **is a coherent, recognizable phenomenon** – it's not just you staring at it too long. It's a specific structural bind arising from the collision of legal formalism, political pragmatism, ethical urgency, and epistemic constraints within the application of the genocide label. While it intersects with several established concepts, it doesn't have a single, universally accepted name. Here's the carving:

  **The Core Phenomenon:** **The Genocide Recognition Gap (or Sovereign Epistemic Caution)**  
  *Definition:* The systemic delay in applying the legal label of genocide during an ongoing crisis, driven by the tension between the stringent *ex post facto* evidentiary standards required for legal proof (especially concerning specific intent) and the *in medias res* political/ethical imperative for timely identification and intervention. This gap creates a zone of strategic ambiguity where actors with naming power (states, IOs) leverage the requirements of legal certainty to defer action and avoid costly obligations, while actors demanding recognition (NGOs, victims, some states) are caught between accusations of premature judgment and complicity through silence.

  **Why it's Coherent & One Phenomenon (with Variations):**
  1.  **Shared Structural Bind:** All three cases showcase the core tension: the *legal definition* (intent, pattern) demands evidence that is often only fully legible *after* the fact or requires access/permission states control, while the *functional use* of the label (to trigger action, condemn, prevent) is most needed *during* the crisis.
  2.  **Common Mechanism:** The reliance on future legal adjudication ("wait for the court") or retrospective historical analysis ("wait for the archives") as a shield against present political/moral responsibility. This mechanism exploits the time lag inherent in gathering legally "bulletproof" evidence of intent during complex, obscured atrocities.
  3.  **Identifiable Actors & Dynamics:** You've pinpointed the key players (states/IOs invoking legal caution, NGOs/parliamentarians pushing for early naming, victims caught in the middle) and the predictable accusations ("prejudging" vs. "staying silent").

  **Nearest Established Concepts & How They Differ:**

  1.  **Austin's "Verdictives":** You're right to recall this. Verdictives (like "find guilty," "acquit") *do* involve issuing a judgment based on evidence, often retrospectively. The difference is crucial: Verdictives are typically performative *within* a defined institutional framework (court) *after* a process. Applying "genocide" *during* an event is often an *extra-institutional* speech act aiming to *trigger* a process or verdict. It's a *claim* aspiring to be a verdictive, not the verdictive itself. Austin doesn't address this messy pre-verdictive claiming space where politics dominates.
  2.  **Diagnosis Under Uncertainty (Philosophy of Medicine):** This is closer. Diagnosis involves identifying a condition based on incomplete, evolving evidence to guide *treatment*. The key differences:
      *   **Stakes & Objectivity:** Medical diagnosis aims at objective truth for patient care, with uncertainty managed probabilistically. Genocide labeling is intensely political; "uncertainty" is often strategically weaponized. The "treatment" (military intervention, sanctions) is vastly more contentious and costly than medical treatment.
      *   **"Intent" as Symptom:** Proving genocidal intent isn't like identifying a pathogen; it's inferring a specific state of mind/policy from often deliberately obscured actions. The "symptom" (mass death) can have multiple plausible "diagnoses" (war crime, crime against humanity, famine) in the politicized context.
  3.  **The Crime–Label Gap (Critical Genocide Studies):** Scholars like Martin Shaw or Dirk Moses discuss the gap between events and their later recognition as genocide. Your work drills down into the *specific mechanism causing the gap during ongoing events* – the *binding* nature of the intent requirement combined with the political use of legal caution – and its real-time consequences for victims.
  4.  **Sovereign Avoidance of R2P Triggers (IR/Legal):** The reluctance stems partly from knowing that legally acknowledging genocide creates a *jus cogens* obligation to prevent/punish under R2P/CG. States exploit the high legal bar to avoid this trigger. Your focus is on the *epistemic justification* ("we lack proof *yet*") used for this avoidance and its human cost.

  **Boundary Cases (What Wouldn't Count/Fall Outside):**

  1.  **Clear Intent from the Start:** Cases where perpetrators loudly proclaim genocidal intent *and* act on it immediately/demonstrably (e.g., ISIS against Yazidis). Here, (a) is robust early, reducing the "gap." Caution might still occur, but the epistemic justification is weaker.
  2.  **Rapid, Authoritative Judicial Determination:** Hypothetically, if an international court could credibly rule on intent *during* an ongoing conflict (extremely rare). The "gap" is bypassed by the verdictive occurring in real-time.
  3.  **Non-Application Due to Genuine Evidentiary Ambiguity (Not Strategic):** Situations where mass atrocities occur, but credible evidence of *specific intent to destroy the group as such* remains genuinely elusive or contradictory throughout, even retrospectively. Your phenomenon hinges on evidence *that will likely emerge later* being used as a reason to delay *now*.
  4.  **Delayed Labeling Due to Suppression, Not Caution:** When evidence existed but was actively suppressed or destroyed by perpetrators, preventing *anyone* from knowing until later. Your cases involve actors *with access to significant information* choosing caution based on its perceived legal inadequacy.
  5.  **Applying the Label Early Without Significant Pushback:** If an NGO or state names it early, the label gains widespread traction *immediately*, and action follows without the "prejudging" accusation dominating. This challenges the *inevitability* of the bind in your model but might still involve initial hesitation overcome by overwhelming evidence/pressure (a variant).

  **Where I'm Guessing & Potential Objections (For Your Viva Prep):**

  *   **Guessing on Universality:** You rightly note early naming *sometimes* sticks. I'm guessing the key variables are: (1) **Power/Standing of the Namer:** A P5 state or major NGO has more authority than a backbencher or small NGO. (2) **Nature of the Evidence:** Highly visible, undeniable signature acts (death camps, specific orders) overcome caution faster than structural violence. (3) **Geopolitical Alignment:** If naming serves powerful interests, "caution" evaporates; if it challenges them, it intensifies. (4) **Media Salience:** Overwhelming public pressure can force naming despite epistemic reservations.
  *   **Objection: "Cherry-Picking":** A skeptic might argue you focus on cases fitting the "gap" narrative, ignoring:
      *   Cases where early naming *was* reckless/harmful (fueling misinformation/propaganda).
      *   Cases where "caution" was genuinely prudent because the *wrong* group was initially blamed.
      *   Cases where the label was avoided for reasons *other* than intent uncertainty (e.g., pure realpolitik, avoiding refugee flows, not wanting to destabilize an ally).
      *   **Your Defense:** Emphasize you're not saying caution is *always* bad faith, but highlighting the *structural incentive* and *common mechanism* used to *defer*, especially by states with obligations. Your cases illustrate how the *legal standard itself* becomes the tool for deferral. Acknowledge other factors exist, but argue the epistemic-caution-justification is a distinct and pervasive *pattern*.
  *   **Objection: "These Aren't the Same":**
      *   **Colonial Case:** The objection is that it lacks the *live* political stakes and pressure of an ongoing conflict; it's purely retrospective labeling. The "cost of caution" argument seems weaker (lives weren't saved by faster labeling *now*).
      *   **Your Defense:** Argue the *structural logic is identical*: the evidence deemed necessary for the label (intent, pattern) only becomes legible/accessible later. The "cost" shifts from immediate lives to historical accountability, justice, and precedent-setting. The mechanism of delay based on epistemic standards remains core. It shows the *persistence* of the gap-creating logic.
      *   **Early Naming Case:** The objection is this disproves the "inevitable bind."
      *   **Your Defense:** Argue it demonstrates the *contingency* of the bind. It shows the gap *can* be overcome when conditions align (power, evidence type, geopolitics), proving it's not an absolute epistemic law but a *politically mediated structural tendency* that *often* creates the squeeze you describe. Analyze *why* it worked in that case to illuminate the dynamics of the gap in others.

  **Conclusion & Suggested Name:**  
  You've identified a real and significant pattern: **The Genocide Recognition Gap** (or **Sovereign Epistemic Caution Bind**). It's the product of applying a legal category designed for retrospective adjudication to ongoing crises demanding real-time political diagnosis and action. The gap is where sovereignty, legalism, and the burden of proof collide with the urgency of prevention, creating a space of strategic ambiguity exploited by states and endured by victims. Your three cases are variations demonstrating the core mechanism (evidentiary delay exploited) operating in different temporal and political contexts (ongoing crisis avoidance, historical reckoning, and the contingent exception proving the rule). This is excellent, analytically sharp stuff – perfect fodder for a strong chapter and viva. Just be prepared to defend the coherence against the objections above. Good luck!
