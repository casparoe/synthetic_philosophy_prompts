prompt: |-
  I write for a publication that tracks debates at the intersection of political philosophy and public policy, and I am preparing a feature on whether compatriots carry special moral claims that justify preferential treatment in resource distribution, immigration rules, or cultural preservation. The standard framing—universalist cosmopolitanism against associative nationalism—feels exhausted to me; readers tend to sort themselves by team rather than by the actual commitments they hold about concrete trade-offs. I want a diagnostic decision tree with six to eight nodes that classifies positions on this question by asking respondents about specific cases, not about which label they prefer. Each branch should split on a concrete scenario—such as whether a state may prioritize severe domestic poverty relief over an equally severe foreign famine, whether cultural preservation can justify exclusionary immigration even when the culture is defined civically rather than ethnically, or whether shared democratic institutions generate obligations stronger than universal human duties but weaker than kinship ties—so that someone can navigate the tree without knowing any philosophical names.

  The tree should be constructed from the logical space first: map the combinations of answers, then assign actual positions to the leaves, including pure cosmopolitanism; a strong nationalist view that grounds priority in shared history or culture; liberal nationalism that treats compatriot preference as a permissible tie-breaker within universal duties; and a hybrid institutional-cosmopolitan view that accepts associative attachments but denies they generate distributive priority. You should also identify any logically possible but apparently unoccupied combinations—perhaps a view that accepts deep associative obligations yet rejects all state-level partiality, or one that justifies compatriot priority purely on efficiency grounds without any moral weight—and diagnose briefly whether each gap reflects incoherence, unattractiveness, or mere neglect. Specify the audience as scientifically literate general readers, avoid undefined jargon, and do not ask for bibliographies, citations, or further reading.

  The deliverable should not be a neutral catalog: take a definite stance on which distinctions actually do the sorting work—argue, for example, whether the root split should concern distributive versus non-distributive domains, or identity-based versus institution-based association, and defend why your chosen root question is the right starting point. Explicitly flag which positions the tree cannot separate despite differing in metaphysical grounding, and explain whether that practical convergence undermines the distinction or merely conceals it. Where your taxonomy injects or relies on less familiar conceptual moves—such as treating democratic co-membership as generating associative weight without ethnic content, or separating tie-breaking permission from distributive weighting—make those commitments explicit and give your reasons for treating them as central rather than peripheral.
reasoning: |-
  Okay, let me approach this query systematically. The user wants a diagnostic decision tree that moves beyond tired philosophical binaries to classify positions on compatriot priority through concrete scenarios. They're clearly frustrated with how labels like "cosmopolitan" or "nationalist" trigger tribal reactions rather than thoughtful engagement.

  Hmm, the challenge here is designing a tree that forces substantive choices while avoiding jargon. The key insight might be starting with resource distribution rather than identity questions - that seems like the most visceral pressure point where people reveal their actual priorities. I recall David Miller's work on nationality versus Thomas Pogge's institutional cosmopolitanism, but must avoid name-dropping per instructions.

  Interesting how the user flags "unoccupied combinations" as important. That suggests we need to map the logical terrain rigorously before assigning real positions. For instance: could someone believe in strong associative duties yet reject all state-level partiality? Logically possible but practically unstable - like claiming deep family obligations while refusing to feed your own children first. 

  The civic culture question feels crucial for modern states. If someone accepts immigration restrictions for cultural preservation but only when culture is defined civically (say, French laïcité), that exposes whether their nationalism is truly non-ethnic. Must build that in as a key node.

  Ah! The efficiency justification gap is telling. Why don't real actors defend compatriot preference purely on pragmatic grounds? Probably because it fails morally when efficiency conflicts with need - like letting neighbors starve because aid delivery is cheaper locally. That reveals how even "practical" arguments smuggle in moral assumptions.

  For the tree structure, I'm considering starting with the famine vs domestic poverty dilemma. It's brutal but unavoidable: choosing who dies forces fundamental priorities. From there, branching to democratic obligations versus kinship tests whether institutional ties have independent moral weight. 

  Need to flag convergence points carefully. For example, a civic nationalist and liberal nationalist might both accept moderate cultural restrictions, but for radically different reasons - one seeing culture as valuable per se, the other as instrumental to democracy. The tree should show this practical overlap while noting the hidden divergence.

  The institutional-cosmopolitan hybrid deserves special handling. By treating nation-states as mere instruments for global duties, it dodges the associative pull question entirely. That's why it must appear late in the tree - only after rejecting stronger forms of partiality.

  Final structure should have seven terminal positions. The unoccupied nodes will highlight conceptual tensions: if you value association deeply but deny any distributive priority, you're effectively saying "I owe you loyalty but not food" - which feels incoherent outside ritualistic contexts.
answer: |-
  Here is a diagnostic decision tree designed to cut through label-driven debates by forcing concrete choices on scenarios. It starts with the most morally urgent domain (resource distribution under scarcity) to expose foundational priorities, then branches into identity and institutional questions. The root split focuses on *distributive conflict* because it reveals whether universal duties are lexically prior to associative claims or subject to weighting – a deeper fault line than identity type.

  **Root Question:**
  **Node 1: Severe Domestic Poverty vs. Severe Foreign Famine**
  *   A country faces a budget constraint: it can fully fund a program to eliminate *severe, life-threatening poverty* for its own worst-off citizens, OR fund an aid program saving an *equal number of lives* from imminent famine in a much poorer country. It cannot do both. Which *must* it prioritize?
      *   **(A) Prioritize Domestic Poverty Relief.** *[Go to Node 2]*
      *   **(B) Prioritize Foreign Famine Relief OR see them as morally equal (flip a coin/seek other funds).** *[Go to Node 5]*

  ---

  **Branch A: Accepts Some Compatriot Priority in Basic Distribution**
  **Node 2: Basis for Domestic Priority**
  *   Why *must* the domestic poor be prioritized? Is it fundamentally because:
      *   **(A) Shared membership in *this specific community* (history, culture, collective identity) creates a special bond demanding priority, even if the foreign poor are objectively worse off.** *[Go to Node 3]*
      *   **(B) Practical efficiency & institutional capacity: Our government can help our poor more effectively/accountably, but the underlying moral duty to all humans is equal. Priority is instrumental.** *[Go to Node 4]*
      *   **(C) Shared democratic institutions/citizenship generate specific obligations stronger than universal duties but distinct from ethnic/cultural kinship.** *[Go to Node 6]*

  **Node 3: Strength of Cultural/Historical Identity Claims**
  *   Can preserving a nation's dominant culture (e.g., language, traditions, public symbols), defined *civically* (shared values, political history) not ethnically, justify restricting immigration, even when potential immigrants would readily integrate and contribute economically?
      *   **(A) Yes, preserving our distinct civic culture is a legitimate collective good that can justify some exclusion, even absent economic harm.** *[Position: Strong Civic Nationalism]*
      *   **(B) No, cultural preservation alone isn't a strong enough reason to exclude peaceful, willing immigrants if basic rights/needs aren't threatened.** *[Position: Moderate Liberal Nationalism (weighted duties)]*

  **Node 4: Scope of Efficiency Justification**
  *   Does the "efficiency" argument justify *any* compatriot preference beyond basic survival needs (e.g., better healthcare, education subsidies, infrastructure)?
      *   **(A) Yes, as long as universal basic duties are met globally, efficiency justifies significant domestic advantage in non-basic goods.** *[Logically Possible but Unoccupied: Instrumentalist Partiality]*
      *   **(B) No, "efficiency" only justifies minimal priority for ensuring compatriots' *basic survival* when directly competing claims exist. Beyond that, strong equality principles should dominate.** *[Position: Minimal Instrumental Partiality (Cosmopolitan-Constrained)]*

  **Node 6: Democratic Obligations vs. Kinship**
  *   Are the obligations generated by shared democratic citizenship *stronger than*, *weaker than*, or *different in kind* from obligations to close family members?
      *   **(A) Stronger/Similar: Citizenship creates deep, quasi-familial bonds of mutual responsibility.** *[Converges with Strong Civic Nationalism or Communitarianism]*
      *   **(B) Weaker but Distinct: They are significant associative duties, but less intense than family ties and grounded in reciprocity/fair play, not identity.** *[Position: Liberal Nationalism / Civic Institutionalism]*
      *   **(C) Primarily Procedural: Obligations are to maintain fair institutions that *then* impartially discharge universal duties; citizenship adds little *moral* weight beyond this.** *[Go to Branch B / Cosmopolitan]*

  ---

  **Branch B: Rejects or Minimizes Compatriot Priority in Basic Distribution**
  **Node 5: Role of Existing Institutions**
  *   Does the existence of *this particular state* and its institutions create *any* special obligations for its citizens towards each other that don't apply equally to all humans?
      *   **(A) No. States are merely instruments for fulfilling universal duties. Co-citizenship adds no independent moral weight.** *[Position: Pure Cosmopolitanism]*
      *   **(B) Yes, but only obligations of *fair play* related to maintaining just institutions (e.g., paying taxes, obeying laws). No distributive priority beyond what's needed for institutional function.** *[Position: Institutional Cosmopolitanism / Associative Duties without Distributive Priority]*
      *   **(C) Yes, but the obligations are weak "tie-breakers" only when universal duties are otherwise equally fulfilled.** *[Position: Cosmopolitan with Permissible Tie-Breaking]*

  ---

  **Terminal Positions & Unoccupied Branches:**

  1.  **Strong Civic Nationalism:** (A1 -> A3A) Priority based on shared identity (civic/ethnocultural), justifies distribution *and* cultural exclusion.
  2.  **Moderate Liberal Nationalism (Weighted Duties):** (A1 -> A3B) Compatriot priority in distribution based on identity/institution weight, but rejects cultural exclusion as a primary justification.
  3.  **Liberal Nationalism / Civic Institutionalism:** (A1 -> A6B) Priority based on reciprocity of democratic institutions; obligations distinct & weaker than kinship, stronger than universal. May accept *some* cultural preservation only if tightly linked to democratic function.
  4.  **Minimal Instrumental Partiality (Cosmopolitan-Constrained):** (A1 -> A2B -> A4B) Priority *only* for basic needs under direct conflict, justified solely by efficiency, no intrinsic associative weight.
  5.  **Cosmopolitan with Permissible Tie-Breaking:** (B -> A5C) Universal duties first, compatriots *only* as a tie-breaker between otherwise equal foreign claims.
  6.  **Institutional Cosmopolitanism:** (B -> A5B) Obligations only to maintain just institutions fulfilling universal duties; no distributive priority for compatriots.
  7.  **Pure Cosmopolitanism:** (B -> A5A) No moral relevance to state borders or co-citizenship; only universal human needs/dignity matter.

  **Unoccupied / Logically Possible Combinations:**

  *   **Instrumentalist Partiality (A1 -> A2B -> A4A):** Justifies significant domestic advantage purely on efficiency grounds without intrinsic associative weight.
      *   *Diagnosis: Unattractive/Unstable.* Collapses when efficiency conflicts with greater need elsewhere (e.g., slightly cheaper domestic aid vs. vastly greater foreign need). Rarely defended because it lacks moral resonance and conflicts with intuitions about fairness beyond strict cost-benefit. Pure pragmatism struggles as an *ethical* justification.
  *   **Deep Association without Distributive Priority (e.g., A1 -> A2A -> but then rejects priority at Node 3 or 4):** Believes in profound bonds of shared identity/institutions but denies these generate *any* distributive priority.
      *   *Diagnosis: Incoherent/Neglected.* If the association is morally deep enough to demand loyalty, sacrifice, or shared fate, it's hard to see why it wouldn't affect resource distribution when members are in dire need. This view might exist in ritualistic or purely symbolic forms, but is unstable under scarcity. It's neglected because proponents of deep association typically *do* endorse some priority.

  **Key Conceptual Moves & Why They Matter:**

  1.  **Distributive Conflict as Root:** Starting with life-or-death resource allocation avoids abstract identity debates and forces the core question: Are universal duties absolute, or can associative ties *outweigh* them in otherwise equal need? This reveals the deepest divide (Cosmopolitanism vs. Associativism).
  2.  **Separating Tie-Breaking from Weighting:** (Node 5C vs. Branch A) Treating tie-breaking as distinct is crucial. It's a minimal concession to association compatible with strong cosmopolitanism, whereas Branch A accepts associative claims can *override* otherwise stronger universal claims. This distinction sorts radically different views lumped together as "moderate."
  3.  **Democratic Co-Membership as Distinct:** (Node 6) Treating shared democratic institutions as generating obligations *not* reducible to culture *or* universalism captures modern liberal nationalism/republicanism. It avoids ethnocultural baggage while acknowledging that cooperating within coercive, rights-granting institutions creates special responsibilities (e.g., Rawlsian "fair play" or Miller's "shared citizenship").
  4.  **Efficiency as Non-Moral Justifier:** (Node 2B/Node 4) Isolating "efficiency" exposes if someone *truly* rejects associative moral weight or just finds a pragmatic cover for it. The unoccupied branch (A4A) highlights that pure efficiency arguments struggle ethically beyond basic coordination problems.

  **Convergences and Hidden Distinctions:**

  *   **Strong Civic Nationalism vs. Democratic Institutionalism with Familial Strength:** (A3A vs. A6A) They converge practically on strong priority and potentially cultural exclusion. However, the *grounding* differs (identity vs. institutional reciprocity). This distinction might resurface in debates about *why* culture matters or obligations to non-citizen residents, but the tree groups them for distributive/cultural outcomes.
  *   **Moderate Liberal Nationalism vs. Civic Institutionalism:** (A3B vs. A6B) May converge on moderate distributive weighting *and* rejecting strong cultural exclusion. The distinction (identity vs. institutions) becomes practically relevant when the "national culture" is contested or institutions change, but their policy prescriptions often align.
  *   **Pure vs. Institutional Cosmopolitanism:** (B5A vs. B5B) Converge on rejecting distributive priority. Distinction (no associative weight vs. institutional fair play obligations) matters for political obligations (e.g., civil disobedience) or obligations to reform institutions, but not for core resource distribution questions.

  **The Stance:** This tree argues that the fundamental split isn't *what* associates us (culture vs. institutions), but *whether association can override basic universal needs in distribution*. Starting there forces consequential choices. Subsequent nodes on identity/type of association and the nature of obligations (efficiency, tie-breaking, weighting) refine the position. The structure reveals that "liberal nationalism" hides crucial diversity, efficiency arguments are rarely pure, and deep association without distributive priority is incoherent. The taxonomy prioritizes concrete implications over metaphysical grounding where they converge practically, acknowledging that these convergences are real political facts, even if philosophers find the distinctions important.
