answer: |-
  **This thought experiment succeeds by exploiting ambiguity in whether local conditions are part of the objective chance mechanism or the evidence-generating setup.**

  **Scenario:** A factory uses a machine certified to produce defective widgets with an *objective chance* of 0.5, based on rigorous, controlled calibration tests defining its inherent physical propensity under standard conditions. In Factory A, however, historical data shows 90 defects in the last 100 widgets produced. The plant manager (evidentialist) sees overwhelming evidence for a local defect rate near 0.9. The quality engineer (PP adherent), knowing the machine's certified chance propensity is 0.5 and *framing the local factory environment (humidity, operator quirks, power fluctuations) as part of the evidence-generating mechanism rather than altering the fundamental chance law*, resists updating the machine's inherent defect *chance* belief far from 0.5.

  *   **Belief:** The objective chance of the *next* widget from this machine being defective.
  *   **PP Method:** Defers to the certified chance propensity (0.5) established under controlled conditions defining the reference class "this machine type under calibration standards." Treats Factory A's data as *output* of this chance process combined with local (possibly noisy) evidence-generating conditions, rendering the specific 90/100 data inadmissible for *directly* updating the fundamental propensity. Credence ~0.5.
  *   **Evidentialist Method:** Directly updates on the relative frequency observed *in the specific context* (Factory A: 90/100 defective). Treats the local environment as *part of the system* defining the relevant chance. Credence ~0.9.
  *   **Nearby Worlds:** PP focuses on worlds varying the machine's internal state & calibration (same machine type, same chance). Evidentialist focuses on worlds replicating Factory A's total conditions (same machine *in situ*).
  *   **PP Verdict:** The certified 0.5 defines the "objective chance" law; Factory A data is evidence *generated by* applying that law in messy conditions.
  *   **Evidentialist Disagreement:** The "objective chance" relevant for Factory A *includes* its local conditions, evidenced by the consistent 90% defect rate there.
  *   **Exact Feature:** The **framing ambiguity over the scope of the "objective chance" reference class** (inherent machine propensity vs. machine-in-specific-environment). PP uses the narrow class (calibration conditions define chance), evidentialist uses the broad class (total operating environment).

  **Without the framing ambiguity:** If the certified chance *explicitly incorporated* Factory A's environmental factors or was defined *only* for that specific context, the PP would update using the data, collapsing into standard conditionalization. The tension vanishes.

  **PP Defender's Attack:** They argue you've **smuggled inadmissible evidence into the chance setup**. The certified chance (0.5) quantifies the machine's *intrinsic, type-level propensity under reference conditions*. Factory A's data reflects the *outcome* of applying that propensity in a *particular*, complex, noisy instance. This outcome data is inadmissible for altering the belief in the *type-level propensity itself*; it's evidence *about how that propensity manifests* in one specific evidence-generating setup. The PP defender insists the chance law's reference class ("machine type under calibration") cleanly separates it from the vagaries of any single deployment environment.

  **Bottom Line:** The separation is coherent *if* one accepts a strict distinction between a stable, type-level "chance-generating law" (defined narrowly) and the "evidence-generating process" (which includes the law plus contingent local factors). The tension arises from this very distinction and the ambiguity in drawing the boundary in practice. The case holds if this distinction is defensible.
