answer: |-
  Here's a complete, runnable Allais paradox simulation framed as a distributed systems "phantom rollback" game. Designed for 45 minutes with minimal setup and no philosophy jargon.

  ---

  ### **Game Title: Phantom Rollback Roulette**
  **Goal:** Experience why rational people violate the independence axiom (even when they know the math).

  ---

  ### **Setup (5 mins)**
  1. **Materials:**  
     - 3 Color-coded card decks (paper slips in hats work):  
       - **Green Deck (Cluster A - Safe):** 100 cards → 100 cards labeled "**100☕**"  
       - **Blue Deck (Cluster B - Risky):** 100 cards →  
         - 89 cards: "**100☕**"  
         - 10 cards: "**500☕**"  
         - 1 card: "**ROLLBACK: 0☕**"  
       - **Red Deck (Degraded Mode):** 100 cards →  
         - 11 cards: "**100☕**"  
         - 89 cards: "**FAIL: 0☕**"  
     - Scoreboard (whiteboard) to tally choices.  
     - Coffee points tracked mentally (no physical payout needed).

  2. **Framing:**  
     - "We're engineers in a distributed system. **Cluster A** gives small, guaranteed payouts. **Cluster B** has high payouts but a **phantom rollback window** (1% chance) that voids transactions. Today we simulate two outage scenarios."  

  ---

  ### **Round 1: The Safe vs. Risky Cluster (10 mins)**
  - **Scenario:** _"Minor network flutter. Choose your cluster:"_  
    - **Option A (Cluster A):** Guaranteed **100☕**.  
    - **Option B (Cluster B):**  
      - 89% chance: **100☕**  
      - 10% chance: **500☕**  
      - 1% chance: **ROLLBACK: 0☕**  

  - **Mechanics:**  
    1. All players choose A or B simultaneously (show hands or write down).  
    2. Tally votes on the scoreboard.  
    3. **Simulate outcomes:**  
       - A choosers: Automatically get **100☕**.  
       - B choosers: Draw from **Blue Deck**. Announce dramatic ROLLBACK if drawn.  

  - **Predicted Behavior:**  
    > 80-100% choose A. The guaranteed **100☕** feels safer than risking a rollback for extra points.  

  ---

  ### **Round 2: Degraded Mode Gamble (10 mins)**
  - **Scenario:** _"Critical outage! Clusters are degraded. Choose your cluster:"_  
    - **Option C (Cluster A):**  
      - 11% chance: **100☕**  
      - 89% chance: **FAIL: 0☕**  
    - **Option D (Cluster B):**  
      - 10% chance: **500☕**  
      - 90% chance: **FAIL: 0☕**  

  - **Mechanics:**  
    1. Players choose C or D.  
    2. Tally votes.  
    3. **Simulate outcomes:**  
       - C choosers: Draw from **Red Deck**.  
       - D choosers: Draw from **Blue Deck**, but IGNORE "100☕" cards (treat as **FAIL: 0☕**). Only "500☕" or "ROLLBACK" pay.  

  - **Predicted Behavior:**  
    > 70-90% choose D. With high failure odds, the **500☕** pull outweighs the 1% extra success chance of C.  

  ---

  ### **Debrief: Mapping to Allais & Independence Axiom (15 mins)**
  1. **Reveal Choices:**  
     - Round 1: Most chose **A** (safe).  
     - Round 2: Most chose **D** (risky high reward).  

  2. **The Violation:**  
     - _"Why is this irrational? Let’s reframe mathematically."_  
     - Write probabilities:  
       ```  
       ROUND 1        | ROUND 2  
       A: 100☕ @ 100% | C: 100☕ @ 11%  
       B: 100☕ @ 89%  | D: 500☕ @ 10%  
          500☕ @ 10%  
            0☕ @ 1%  
       ```  

  3. **Independence Axiom Explained:**  
     - _"If you prefer A over B, you should prefer C over D. Why? Both choices boil down to the same 11% gamble (see below) once we remove the common 89% outcome."_  
     - Visual breakdown:  
       - **B = 89% (100☕) + 11% (10/11 chance of 500☕, 1/11 chance of 0☕)**  
       - **D = 0% (100☕) + 11% (10/11 chance of 500☕, 1/11 chance of 0☕)**  
       - But in Round 1, you *avoided* the gamble (chose A). In Round 2, you *chose* the gamble (D).  

  4. **Why It Felt Rational:**  
     - **Round 1:** The 89% safe outcome in B feels like "leaving money on the table" if you risk it. The **phantom rollback** (1%) looms large.  
     - **Round 2:** The 89% safety net is gone. Now the 1% risk in B’s gamble feels negligible vs. the **10x reward** (500☕ vs 100☕).  

  5. **Key Insight:**  
     - Humans weigh probabilities *non-linearly*. **Certainty (Round 1 A)** is overvalued. **Small probabilities (Round 2)** are undervalued when big rewards are on the line.  

  ---

  ### **What Will Fail (And Fixes)**
  - **Predictable Failure:** Players might spot the probability overlap in Round 2.  
    - **Fix:** Emphasize the **"degraded mode" framing**. Say: *"Cluster B’s rollback window is hidden in the background noise during outages."*  

  - **Limitation vs. Original Allais:**  
    - **What’s Missing:** The original paradox uses near-certainty (99% safe) in one option. Our game’s "89%" doesn’t feel as certain.  
    - **Verbal Bridge:** *"In the classic Allais paradox, Option A is 99% safe, not 89%. But the effect holds because humans fixate on any loss of certainty."*  

  ---

  ### **Run Sheet**
  - 0–5 min: Setup & framing  
  - 5–15 min: Round 1  
  - 15–25 min: Round 2  
  - 25–45 min: Debrief (focus on emotion→math mapping)  

  **Outcome:** Your team will viscerally feel why "rational" agents violate axioms—and why behavioral economics exists. No bibliography needed.
