          The independence axiom says that if you prefer A over B, then you should prefer a lottery that gives A with probability p and some common outcome with probability (1-p) over a lottery that gives B with probability p and the same common outcome with probability (1-p). 

          In Allais, the common outcome is $1 million with 89% chance. So:

          Option A = 89% chance of $1M + 11% chance of $1M (so 100% $1M)
