  1. Show the aggregate choices: How many chose A vs B? How many chose C vs D? (Expected: A and D are popular.)

  2. Explain the independence axiom: When two options have a common part, then your preference should depend only on the differing part.

  3. Break down the options:

     Round 1:
       Option A: 100% chance of 100 points.
       Option B: 89% chance of 100 points, and 11% chance of a gamble: 10/11 chance of 500 and 1/11 chance of 0.

