  ### Diagnostic Taxonomy: Unilateralist's Curse Positions

  **Root Question:** Does the analyst accept that individually rational choices can be collectively self-defeating even when every agent shares an identical preference ordering over the final outcomes?  
  - **No** → *Proceed to Node A*  
  - **Yes** → *Proceed to Node B*  

  ---

  #### Node A: Does the analyst concede that bounded rationality and private information could replicate the curse in edge cases?  
  - **Yes** → **Unoccupied Branch**  
    - *Diagnosis:* Incoherent; denies the theoretical possibility of the curse while accepting its emergence under cognitive limitations.  
  - **No** → **Leaf 3: Skeptical Eliminativist**  
    - *Awkward Commitment:* Opposes empirical research on collective action dilemmas, dismissing them as purely abstract with no real-world policy implications.  

  ---

  #### Node B: Is the failure best described as a coordination deficit (e.g., lack of centralized decision-making)?  
  - **Yes** → *Proceed to Node C*  
  - **No** → *Proceed to Node D*  

  ---

  #### Node C: Is binding arbitration permissible only if every affected party opts in?  
  - **Yes** → **Unoccupied Branch**  
    - *Diagnosis:* Unexplored; attributes failure to coordination deficits yet demands unanimous consent, undermining centralized resolution.  
  - **No** → **Leaf 1: Hard-Line Coordinationist**  
    - *Awkward Commitment:* Advocates state-enforced arbitration in scientific collaborations, overriding dissent even among experts with aligned goals.  

  ---

  #### Node D: Is the failure best described as a missing precommitment technology (e.g., inability to bind future choices)?  
  - **Yes** → *Proceed to Node E*  
  - **No** → **Unoccupied Branch**  
    - *Diagnosis:* Unexplored; attributes the curse to mischaracterization (e.g., mistaking sequential for simultaneous moves) but offers no alternative mechanism.  

  ---

  #### Node E: Does the curse apply normatively to intertemporal unilateralism (a single agent’s future self undermining her present plan)?  
  - **Yes** → **Leaf 4: Intertemporal Unilateralist**  
    - *Awkward Commitment:* Endorses precommitment contracts for personal goals (e.g., addiction treatment) while conceding they may merely displace—not resolve—self-defeat.  
  - **No** → *Proceed to Node F*  

  ---

  #### Node F: Is binding arbitration permissible only if every affected party opts in?  
  - **Yes** → **Leaf 2: Libertarian Contractualist**  
    - *Awkward Commitment:* Permits paralyzing holdout problems in climate treaties by requiring unanimous consent for enforcement mechanisms.  
  - **No** → **Unoccupied Branch**  
    - *Diagnosis:* Unattractive; demands non-consensual arbitration for collective precommitment but rejects intra-personal parallels, violating symmetry in authority.  

  ---

  ### Ambiguities & Notes  
  1. **Libertarian Contractualist vs. Intertemporal Unilateralist:** These leaves **do not collapse** in constitutional design. The contractualist insists on opt-in for *all* collective binding (Leaf 2), while the intertemporal unilateralist focuses on intra-personal precommitment without prescribing collective rules (Leaf 4).  
  2. **Under-Specified Separation:** Node E may fail to distinguish analysts who accept intertemporal extensions *only* for single agents vs. those who generalize to multi-agent time-inconsistent preferences.  
  3. **Key Unoccupied Branch:** The "mischaracterization" path (Node D → No) is unexplored, as no major position reduces the curse *solely* to flawed game-theoretic modeling without referencing coordination/precommitment.  

  ---

  ### Leaf Summary  
  | **Leaf**                          | **Path**                   | **Awkward Practical Commitment**                                                                 |  
  |-----------------------------------|----------------------------|--------------------------------------------------------------------------------------------------|  
  | **1. Hard-Line Coordinationist**  | Root: Yes → B: Yes → C: No | Mandates non-consensual arbitration in AI ethics review, voiding individual vetoes.              |  
  | **2. Libertarian Contractualist** | Root: Yes → B: No → D: Yes → E: No → F: Yes | Blocks emission treaties unless every nation opts in, enabling free-riders.                |  
  | **3. Skeptical Eliminativist**    | Root: No → A: No           | Dismantles institutional review boards for dual-use research, denying the curse exists.           |  
  | **4. Intertemporal Unilateralist**| Root: Yes → B: No → D: Yes → E: Yes | Advocates Ulysses pacts for mental health, ignoring how third-party enforcers create new coercion risks. |
