answer: |-
  Alright, let's ditch the trolleys and build this hospital scenario.

  **The Case: The Faulty Filter**
  Dr. Aris, a talented but sometimes impatient bioengineer, designed a critical blood filtration component for dialysis machines. Rushed to meet a deadline, he skipped the final redundancy test cycle, falsifying the documentation. Months later, a filter fails during a patient's treatment. While the patient survives (thanks to alert nurses), they suffer serious complications. An internal investigation *suspects* Aris cut corners, but the falsified paperwork makes definitive proof impossible. He faces no formal consequences. Years later, Aris is a leading candidate for Chief of Medical Device Innovation – a role overseeing *all* safety protocols for new hospital tech.

  **The Theories Clash:**

  1.  **Karma (Cross-Lifetime Desert w/ Moral Escrow):**
      *   **Says:** Aris *deserves* the promotion **right now**.
      *   **Why?** His *current* success and candidacy aren't just random luck; they are the "drawing down" of good fortune earned through *past-life* suffering that settled his karmic debt for the filter negligence (and likely other past misdeeds). Maybe in a prior life, he endured immense suffering equivalent to the harm he caused (or worse). That debt is paid. His current skills and achievements are his *earned* karmic assets. Denying him the promotion based on *this life's* unresolved negligence would be double-counting the debt. The "escrow" is balanced; he's entitled to the positive outcome.
      *   **Key Feature:** The **Moral Escrow Across Lives**. This is *everything*. It separates the *cause* of desert (past suffering) from the *manifestation* of desert (current good fortune). Without this cross-life accounting, the whole karmic desert claim falls apart.

  2.  **Standard One-Life Desert Theory:**
      *   **Says:** Aris **does not deserve** the promotion.
      *   **Why?** Desert is based on actions, character, and consequences *within this single life*. Aris committed a serious act of negligence (skipping tests, falsifying data) that directly harmed a patient. He has faced *no consequences* (punishment, reparations, demonstrated reform) for it *in this life*. Promoting him, especially to a role with *more* safety responsibility, rewards recklessness and dishonesty *in this life*. He hasn't earned trust back through demonstrable change or atonement *here and now*. His current skills are irrelevant to the *moral desert* concerning his past harmful actions in *this* existence.
      *   **Key Feature:** **Moral Tethering to This Life**. Desert is anchored solely to the actions, experiences, and relationships of the identifiable person in *this* observable lifetime.

  **The One-Life Theorist's Attack (Beyond Denying Past Lives):**

  Denying past lives is the obvious first step, but the deeper attack hits the core concept of desert itself:

  1.  **The "Moral Tether" Problem:** Even *if* past lives existed, why should suffering experienced by a *different* consciousness (the "past life" Aris) settle the moral account for the actions of the *current* Aris? The current Aris hasn't *learned* from that past suffering in any meaningful way related to *this* life's negligence. He hasn't developed remorse, empathy, or reformed his character *because* of it. Desert requires a connection between the agent who acted, the agent who suffered consequences, and the agent who is rewarded/punished. Karma severs this tether. The current Aris gets a reward (promotion) for harms *he* caused *in this life*, based on suffering *someone else* (past him) endured. That violates the fundamental link between action and desert within a single moral agent's narrative.
  2.  **Unfalsifiability & Arbitrariness:** How could we *ever* know the karmic ledger is balanced? The "escrow" system is completely opaque. It makes desert arbitrary and unknowable – Aris might deserve the promotion, or he might deserve to be struck by lightning tomorrow to pay for something else. This undermines the very idea of desert as a coherent moral concept we can reason about or base decisions on. It becomes a post-hoc justification for any outcome.
  3.  **Undermines Responsibility:** If "the books are balanced" regardless of *this life's* actions, it potentially diminishes the urgency of moral responsibility *now*. Why strive to make amends or reform if some unseen ledger from a forgotten existence supposedly settles it?

  **Does removing "escrow across lives" collapse it?**
  **Absolutely.** Without that cross-life moral escrow:
  *   Aris's past negligence *in this life* remains unresolved.
  *   His current skills and achievements are positive, but don't magically erase that unresolved harm.
  *   The standard one-life desert analysis applies directly: He hasn't faced consequences or demonstrated reform *for his harmful action*, so promoting him to a position where similar negligence could recur seems undeserved. It becomes a classic case of unpunished negligence potentially leading to reward and further risk.

  **The core tension:** Karma (as described) prioritizes a cosmic balance sheet settled across disconnected existences. One-life desert prioritizes the observable moral narrative and accountability within a single, continuous lifetime. The hospital scenario forces these two fundamentally different concepts of "deservedness" to collide over Aris's promotion. The escrow is the linchpin holding the karmic claim together – pull it out, and it's just another guy who got away with something... for now.
