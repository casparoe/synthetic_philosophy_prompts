  Looking at their arguments: Maya starts by praising interventionism for grounding causation in manipulable relationships without needing possible worlds like Lewis's theory. Leo counters that the do-operator itself relies on counterfactuals—it's about what would happen if an intervention occurred. Maya sees the localization as progress, but Leo insists it's still modal and points to problems with omissions, like not watering a plant, where intervention requires creating artificial variables. He extends this to institutional cases, like a regulator's failure, arguing interventionism can't handle them without circularity. Maya dismisses such cases as speculative, but Leo says this excludes valid historical explanations.

  For adjudication: On the do-operator, Leo is right that it involves counterfactual thinking, as defining an intervention inherently asks "what if." For omissions, Leo's criticism holds—interventionism struggles with absences and forces binary constructions, which might not capture real-world nuance. In the institutional case, Leo has a point about rejecting important causal claims, but Maya's stance highlights the value of rigor in avoiding unfalsifiable speculation.

  Both are missing that the dispute isn't purely metaphysical; it's about explanatory practices. Interventionism offers a formal, testable framework for science, while counterfactuals provide intuitive tools for broader contexts. The choice depends on the domain—empirical sciences benefit from interventionism's constraints, whereas history or social sciences might need counterfactual flexibility. Neither fully escapes metaphysics, but each serves different epistemic purposes. I'll structure the response to cover each point concisely, using British English, and keep it within the word limit.
answer: |-
  Here is a point-by-point adjudication of Maya and Leo's exchange:

  1.  **Nature of the do-operator:** Leo is correct. Defining `do(X=x)` inherently involves a counterfactual supposition: what *would* the system be like *if* X were set to x by an external intervention? The formal machinery (graphs, equations) computes the consequences *within* a model, but the operator itself expresses a modal contrast with the actual state. Maya's "local stability under intervention" is a constrained form of counterfactual reasoning, not its elimination.

  2.  **On omissions (plant example):** Leo has the stronger argument. Interventionism requires constructing variables and assigning values (like `watering=0`) to represent absences, then counterfactually manipulating them (`do(watering=1)`). This formalises the judgment but relies on the same underlying counterfactual intuition ("if watered, it would have lived") that Maya claims to avoid. The "invention" of the intervention variable for the absence is a conceptual step beyond pure observation.

  3.  **On the institutional case (regulator's failure):** Leo identifies a genuine difficulty. Some systemic omissions involve roles or structures where "performing" the omitted action isn't a coherent intervention *within* the existing system framework. Interventionism struggles here. Maya's response that such claims are "causally defective" or "spurious modal speculation" (Leo is correct) proves too much, as it dismisses legitimate causal analyses in history and social science where direct intervention concepts are problematic. Leo is right about the methodological straitjacket risk.

  **What both miss:** The core dispute concerns **explanatory practice and its grounding**, not purely metaphysics. Interventionism provides a powerful, formalisable framework for *empirical testing and modelling* causation, rigorously linking it to potential manipulation. This clarifies scientific practice. However, as Leo shows, its formal tools often encode and depend upon counterfactual reasoning. Conversely, counterfactuals offer a broader, more intuitive vocabulary for causal reasoning (especially with omissions and complex systems), but lack interventionism's formal precision and testability constraints. Neither fully dispenses with modal concepts; they prioritise different aspects of causal explanation (testability vs. scope and intuition). The choice depends on the explanatory context and goals.
