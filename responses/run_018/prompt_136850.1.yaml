  hey i'm trying to figure out what i actually think about that envelope paradox, going by gut on a bunch of setups. first case: i pick one envolope, open it, see $100, then learn the other has either double or half. my gut says switch, but then if i switch and apply the same logic it loops, so i stay put. that's verdict one: stay.

  case two: i open it and see $0, and i'm told the amounts are always powers of two. i think maybe the other one is $0 too, or maybe $0 is the bottom so the other is $0? actually i feel like switch is pointless here. verdict: stay, but for a different reason. case three: there's a hidden coin flip that determined whether i hold the smaller or larger envolope, and i know it's fair. i still feel like it doesn't matter, which is different from case one. verdict: indifferent. case four: my friend peeked at both and tells me the big one is $80, but she won't say which is mine. i open mine and it's $40. here i definately shouldn't switch, because she knows and i don't, but the math still whispers switch. verdict: stay, but it feels like the math is wrong here, not me.

  case five, and this is the weird one i cooked up: the amount in the other envolope is determined by a hidden parameter that actually shifts based on whether i form the intention to switch. if i intend to keep, the other is double; if i intend to switch, it's half. i feel like in this world i should try not to form the intention, but i'm not sure if that's rational or just magical thinking. verdict: avoid deciding?

  is there a principle that gets all of these, or do i have to drop one? and what does it say about a case i haven't listed: i open the envolope and see $1000, and i'm told the other was filled using a distribution that puts almost all weight below $2000 but with an infinite tail going up. do i switch there? please just write back in continuous prose like you'd email a friend, no headings or bullet points or bold text or tables, since i want to copy this into my notes without reformatting.
