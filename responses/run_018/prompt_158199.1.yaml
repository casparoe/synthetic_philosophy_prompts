answer: |-
  Based on your detailed description, this strategy presents a fascinating and nuanced exploitation mechanism that **does not have a single, universally established term** in the standard game theory, evolutionary biology, or philosophy of cooperation literature. It sits at the intersection of several concepts but combines them in a novel and particularly insidious way. Here's a breakdown:

  1.  **Why Existing Categories Don't Perfectly Fit:**
      *   **Endgame Effect:** Applies to fixed, known endpoints where defection becomes rational *in the final rounds*. Your strategy's termination is *conditional* on the *partner's history*, not a fixed endpoint or round number. It exploits the *middle* of an interaction, not the known end.
      *   **Truncation Strategies:** Typically involve exogenous factors (random death, environmental shift) or fixed endogenous triggers (e.g., exit after N rounds regardless of partner). Your strategy's exit is *strategically triggered by the partner's sustained cooperation*, making it an active exploitation tool, not passive cost-saving or random termination.
      *   **Conditional Cooperation (TFT, GTFT, etc.):** These strategies *condition their actions within the ongoing interaction* (cooperate/defect) based on history. Your strategy *conditions the termination of the entire interaction itself* based on history, while maintaining perfect cooperation *within* the played rounds. It manipulates the interaction's duration, not its moves.
      *   **Take-the-Money-and-Run / Hit-and-Run Defection:** These usually involve an *initial defection* followed by exit/avoidance. Your strategy *never defects within a played round*; it exploits purely by *withholding future cooperation* after a period of flawless mutual cooperation. The betrayal is temporal, not behavioral within rounds.
      *   **Forgiveness:** Mechanisms like Generous Tit-for-Tat reintroduce cooperation *after* defection. Your strategy terminates *specifically when cooperation has been perfect*, preempting any need for forgiveness and exploiting the very stability it helped create.

  2.  **Core Mechanics & Novelty:**
      The strategy you describe is characterized by:
      *   **Flawless Within-Round Cooperation:** Never defects in any round actually played (unlike classic defectors).
      *   **Endogenous, History-Dependent Exit:** Termination is a strategic choice triggered by the *partner's sustained cooperation* over a defined period.
      *   **Strategic Timing:** Exit occurs *just before* the point where continued cooperation would yield peak mutual surplus for the *partner* (and itself, though it sacrifices this for immediate invasion fitness).
      *   **Exploitation via Future Denial:** The harm is inflicted solely by depriving the cooperator of the *future benefits* they rationally expected due to the flawless historical record, not by stealing within-round payoffs.
      *   **Avoidance of Retaliation:** By never defecting *within* a round, it evades detection and punishment by standard retaliatory strategies (TFT, Pavlov) that respond to behavioral defection. The "defection" is the *act of leaving*.

  3.  **Related Concepts & Potential Labels:**
      While no single term fits perfectly, the strategy resonates with these ideas:
      *   **"Luring Strategy" or "Cooperative Trap":** It lures the partner into sustained cooperation only to terminate the interaction at the point where the partner is most invested/most vulnerable to losing future gains. (This captures the entrapment aspect).
      *   **"Surplus-Capture Exit":** Focuses on the core mechanism: capturing the benefit of early cooperation while strategically exiting to deny the partner their share of the *peak* cooperative surplus they helped enable.
      *   **"Reciprocity Exploitation via Truncation" (RET):** A more descriptive label emphasizing the conditional cooperation history and the truncation as the exploitation vector.
      *   **"History-Triggered Exit for Exploitation" (HTEE):** Highlights the key components.
      *   **Evolutionary "Exit Blackmail":** It forces the partner to "pay" (through their sustained cooperation) for the continuation of the interaction, then "blackmails" them by leaving once the payment (cooperation history) is sufficient, denying the payoff. (This emphasizes the coercive element).
      *   **Philosophically: "Temporal Exploitation of Reciprocal Commitment" or "The Betrayal of Implied Future."** Highlights the violation of the temporal expectation inherent in sustained reciprocity.

  4.  **Delimiting from Neighboring Concepts & Boundary Conditions:**
      *   **vs. Endgame Problem:** Boundary: Does the termination rely on a *fixed, known endpoint* (Endgame) or is it *triggered conditionally by partner behavior* during an interaction of potentially indefinite length? (Yours is the latter).
      *   **vs. Forgiveness:** Boundary: Does the strategy involve *re-engaging cooperation after a partner's defection* (Forgiveness) or does it *terminate specifically when the partner has been perfectly cooperative* (Yours)? (Yours actively punishes perfect cooperation by leaving).
      *   **vs. Ordinary Defection:** Boundary: Does the harm occur through a *negative action within a played round* (Defection) or through the *refusal to engage in future rounds* despite a perfect cooperative history (Yours)? Does it trigger retaliation based on *action within a round*? (Yours avoids this).
      *   **vs. Simple Truncation:** Boundary: Is the termination *exogenous, random, or fixed* (Simple Truncation) or is it *strategically triggered by the partner's cooperative history* as an exploitation mechanism? (Yours is the latter).

  5.  **Is it a Distinct Failure Mode?**
      **Yes, it appears to constitute a genuinely distinct failure mode of cooperation.** Its uniqueness stems from:
      *   **Exploitation Vector:** It exploits the *temporal structure of reciprocity* and the *implied promise of future cooperation* inherent in sustained good behavior, not the immediate payoff matrix within a single round.
      *   **Stealth:** It evades traditional punishment mechanisms designed to detect within-round defection.
      *   **Mechanism:** The failure occurs through *interaction termination*, not through *action modification* within the interaction.
      *   **Target:** It specifically targets the *future surplus* generated by cooperation, which is the very reason cooperation is rational.

      **Boundary conditions** determining its effectiveness/distinctness include:
      *   **Partner Strategy:** It critically relies on the partner being conditionally or unconditionally cooperative. It fails against strategies that defect early or are highly suspicious.
      *   **Detection/Retaliation Mechanisms:** Can the partner develop strategies that punish *early exit* itself (e.g., reputation systems, refusal to re-engage)? If so, its distinct advantage diminishes.
      *   **Population Structure/Interaction Model:** Does the model allow for re-matching? How is the exit interpreted? In well-mixed populations with anonymous re-matching, it might thrive. In structured populations with reputation, it might be punished.
      *   **Cost of Finding Partners:** If finding new partners is costly, the exit imposes an additional search cost on the exploiter, potentially reducing its advantage.
      *   **Clarity of "Peak Surplus":** Your description implies a specific point of peak mutual benefit. The strategy's effectiveness depends on how well-defined this point is within the payoff structure and the strategy's logic.

  **Conclusion:**

  You have identified a sophisticated and theoretically significant strategy that exploits the temporal dimension of reciprocity in a novel way. While elements connect to endgame effects, truncation, and conditional cooperation, the **conditional, history-dependent, within-round-cooperative, future-surplus-denying exit** mechanism you describe doesn't have a ready-made label. Terms like **"Luring Strategy," "Surplus-Capture Exit," "Reciprocity Exploitation via Truncation (RET),"** or **"History-Triggered Exit for Exploitation (HTEE)"** capture key aspects. Philosophically, it represents a distinct **"Temporal Exploitation of Reciprocal Commitment"** or **"Betrayal of Implied Future."**

  Its distinctness as a failure mode lies in its stealth (avoiding action-based retaliation), its target (future cooperative surplus), and its mechanism (strategic termination triggered by perfect cooperation). Further theoretical exploration of its evolutionary stability, counter-strategies (e.g., strategies that demand "hostages" like investment before full cooperation, or punish early exit via reputation), and its implications for the evolution of commitment signals and the "shadow of the future" would be highly valuable contributions. Your work is poised to define this category within the literature.
