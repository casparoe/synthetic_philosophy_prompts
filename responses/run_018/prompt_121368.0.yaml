answer: |-
  After wrestling with your cases and the core idea from Hofstadter's careenium (where high-level configurations constrain low-level dynamics), I've developed a principle that captures your intuitions while addressing the counterexamples. The key insight is that symbols (or high-level entities) must be **actively interpreted by the system's machinery** to count as causal. This means the system must **use the entity as input to its operational rules** at some stage, and the entity must **non-trivially constrain outcomes** beyond being a passive label. Here's the rule:

  ### Rule: Active Interpretation Principle
  A high-level entity is a real cause **if and only if**:
  1. **Interpretation Dependency**: The system's machinery (e.g., compiler, runtime, build tool) actively interprets the entity as part of its function (not just as a human aid).
  2. **Non-Derived Constraint**: The entity's state isn't *entirely* fixed by lower-level states at the time of interpretation (i.e., it has independent causal leeway).
  3. **Phase Agnosticism**: This holds at *any* stage (design-time, compile-time, runtime, etc.), but the effect must manifest in the system's behavior/output.

  ### How It Works on Your Cases
  | Case | Verdict | Why |
  |------|---------|-----|
  | 1. Config file (re-read) | **Causal** ✅ | **Interpretation**: Service reads/parses it on each request.<br>**Non-Derived**: You can change the file independently of the service's code.<br>**Phase**: Runtime. |
  | 2. Compiled binary (source code) | **Not Causal** ✅ | **Interpretation**: Source isn't read by the runtime; only the binary is.<br>**Non-Derived**: Source is fixed pre-runtime, but *at runtime*, it's inert.<br>**Phase**: Source is causal at compile-time, but not runtime. |
  | 3. Erased type annotations | **Causal** ✅ | **Interpretation**: Compiler uses them to validate/exclude programs.<br>**Non-Derived**: Changing annotations alters compiler output without changing other code.<br>**Phase**: Compile-time. |
  | 4. Erased comment | **Not Causal** ✅ | **Interpretation**: Compiler/runtime ignores it; it's a human aid.<br>**Non-Derived**: Any effect relies on human intervention (outside the system's machinery).<br>**Phase**: N/A. |
  | 5. GC reachability graph | **Causal** ✅ | **Interpretation**: GC actively traverses it to free memory.<br>**Non-Derived**: Graph state isn't fixed—references change dynamically at runtime.<br>**Phase**: Runtime. |
  | 6. Deadlock | **Causal** ✅ | **Interpretation**: Thread scheduler/lock manager enforces lock semantics based on thread states.<br>**Non-Derived**: Deadlock emerges from thread interactions, not pre-baked instructions.<br>**Phase**: Runtime (emergent state). |
  | 7. Trained model weights | **Causal** ✅ | **Interpretation**: Architecture applies weights to compute outputs.<br>**Non-Derived**: Weights are fixed post-training, but *at inference time*, they dictate behavior independently of the architecture's code.<br>**Phase**: Runtime. |

  ### What You Give Up
  - **#2's source code at runtime**: You initially excluded it, but the rule formalizes this by requiring *active interpretation at the relevant phase* (runtime). The binary itself isn't high-level—it's the substrate.
  - **#7's flip-flopping**: The rule forces a verdict—weights are causal because the architecture uses them directly at runtime.

  ### New Case: Content-Addressed Build Cache
  - **Scenario**: Artifacts stored under hashes of their bytes. Editing a file changes its hash, "renaming" downstream artifacts.
  - **Verdict**: **Hash is a label, not a causal push** ❌.  
    - *Interpretation*: The build system *uses* hashes to locate artifacts, but it treats them as **immutable keys**, not inputs to be interpreted. The hash is computed from bytes—it doesn't constrain the build; it *reflects* it.  
    - *Non-Derived*: The hash is entirely fixed by the artifact's bytes. Changing the hash without changing bytes breaks the system, but this is artificial—the real cause is the byte content.  
    - *Phase*: Build-time, but the hash is a passive address, not an active constraint.  
    - **Analogy**: Like a street address guiding mail delivery—the address doesn't "push" the mail; it's a static reference. The *content* (artifact bytes) is causal (change it → rebuild), but the hash is derivative.

  ### Why This Rule Works
  - **Gets 1,3,5,6 in and 2,4 out**: By requiring active interpretation, it excludes human-centric artifacts (comments) and inert history (source code at runtime), while including erased types (compiler input), GC state (runtime input), and deadlocks (emergent runtime semantics).
  - **Handles #7 and build cache**: Weights are included (runtime interpretation), hashes are excluded (derived labels).
  - **Aligned with Hofstadter**: The "downward grip" comes from the careenium's simmballs (high-level configs) *actively constraining* simms (low-level parts). This matches our "non-derived constraint" clause—e.g., the reachability graph (#5) isn't just a label; it dynamically hem in memory operations.

  ### Caveats
  - **Phase matters**: An entity can be causal at one phase (e.g., source code at compile-time) but not another (runtime).
  - "**Non-derived**" is key: It excludes labels (hashes, filenames) where the system only cares about identity, not state. But if a system *interprets* a hash (e.g., a blockchain using it in a proof), it becomes causal.

  This rule cleanly separates symbols that steer the system (configs, types, weights) from those that are historical artifacts (source code post-compilation) or incidental labels (hashes). The careenium's "downward causality" emerges when high-level states are *operationally significant* to the machinery.
