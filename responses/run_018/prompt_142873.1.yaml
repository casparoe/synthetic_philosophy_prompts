  I need to analyze the property issue. Monadic properties are intrinsic to one thing, like mass. Relational properties involve relations to other things. The roommate's claim that relational properties belong to the pair is controversial. For example, "being left of B" is a property of A alone, even if it depends on B's existence. That's a key point - the spheres do have different relational properties.

