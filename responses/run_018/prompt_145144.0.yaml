prompt: |-
  I've been taking this course on democratic theory and my roommate Maya keeps using the phrase 'will of the people' like it's a physics formula or something. We got into it last night after she read some populism stuff for class. She said the Brexit vote was definitely the will — 52%, huge turnout, people actually showed up. Then she said when the Supreme Court struck down that law even though polls said 60% of Americans liked it, that wasn't the people speaking at all, just legal elites talking over them. But then she turned around and said the rent-control march downtown with 30,000 people was absolutely the will, even though the council ignored it and there was never a vote. And she thinks Lula winning by under two percent in Brazil counts, but she said if he'd won by like 0.2% she wouldn't call it that — there's some 'density floor' where it's just noise, not a real will.

  I'm trying to figure out what rule she's actually running, not whether she's right. Could you lay out two or three different principles that could explain all four of her calls? Then here's the new case I'm stuck on: some company builds an AI that reads 10 million user comments and spits out a policy recommendation with 70% agreement, but only like 0.1% of the users actually read the proposal — they just reacted to headlines. Would Maya call that the will of the people? For each principle, say what it predicts about the AI case. Give me your best guess at her actual view with reasoning. And what's one further hypothetical scenario that would actually split these rules apart? I keep writing 'popularism' in my notes by accident so forgive me if I typo'd anything here.
reasoning: |-
  Okay, the user is grappling with their roommate Maya's inconsistent application of the phrase "will of the people" across different political scenarios. They need help reverse-engineering Maya's underlying principles. 

  First, let's map Maya's judgments: 
  - Brexit (52% referendum) = valid will
  - SCOTUS overturning popular legislation = invalid ("legal elites")
  - Rent-control march (30k people, no vote) = valid will
  - Lula's narrow win (2%) = valid, but 0.2% would be "noise"

  Hmm, turnout seems key for Brexit, but irrelevant for the march. Narrow margins matter only at extremes for elections. The AI case adds complexity: 70% synthetic agreement from disengaged users. 

  Three possible principles emerge:
  1. **Formal Collective Authorization**: Focuses on official decision points (votes/elections). Explains Brexit and Lula, but fails the march (no formal process). Would reject AI case (no authorization).
  2. **Intensity Threshold**: Values visible passion. Explains the march and Lula's "meaningful" margin, but struggles with Brexit's passive voters. Might accept AI if "70%" feels intense? Unlikely.
  3. **Anti-Elite Override**: Prioritizes any non-elite expression overruled by institutions. Fits all cases: Brexit (vs EU elites), SCOTUS (legal elites), march (ignored council), Lula (vs Bolsonaro elites). AI would be valid since it bypasses elites interpreting comments.

  The anti-elite principle feels strongest - it consistently explains Maya's disdain for SCOTUS and council overrides. For the AI, she'd likely see it as raw unfiltered sentiment, hence "will of the people." 

  For a decisive test: Imagine a ballot initiative passing with 50.1% turnout after heavy think-tank campaigning. 
  - Formal Authorization accepts it (legitimate vote). 
  - Anti-Elite Override rejects it (elite-manipulated). 
  Maya would probably dismiss it as not "real will," confirming the anti-elite lens.

  User's accidental "popularism" typo is ironically precise - Maya's view aligns with populism's elite/masses dichotomy. Their academic frustration is palpable; they're not just seeking answers but tools to engage Maya productively. The AI hypothetical shows they're thinking ahead about digital democracy's challenges. Clever framing.
answer: |-
  Based on Maya's judgments, here are three distinct principles that could explain her pattern, followed by predictions for the AI case, my best guess at her actual view, and a hypothetical scenario to split the rules:

  ### Three Possible Principles
  1.  **Anti-Elite Override Principle**  
      *The "will" exists when non-elite preferences are clearly expressed and later overruled or ignored by institutional elites.*  
      - **Brexit (52% vote):** Valid (Parliament tried to delay/block implementation).  
      - **SCOTUS strike-down:** Invalid (Elites overruled popular preference).  
      - **Rent-control march:** Valid (Council ignored mass protest).  
      - **Lula (2% win):** Valid (Elite opposition delegitimized; narrow win still overcomes elite power).  
      - **AI Case Prediction:** **YES** – The AI aggregates raw user sentiment (non-elite), while headlines/ignorance are irrelevant if elites (e.g., lawmakers) might override it.

  2.  **Formal Collective Authorization Principle**  
      *The "will" requires a formal, decisive collective action (election/referendum), but only if the margin exceeds "noise" (e.g., >1%).*  
      - **Brexit:** Valid (Formal referendum + clear margin).  
      - **SCOTUS strike-down:** Invalid (No formal vote occurred).  
      - **Rent-control march:** Invalid (Protest ≠ formal authorization).  
      - **Lula (2% win):** Valid (Formal election + margin > "density floor").  
      - **AI Case Prediction:** **NO** – No formal vote; user comments ≠ authorized decision.

  3.  **Intensity Threshold Principle**  
      *The "will" is expressed through high-effort participation (voting in high-turnout polls, protests) or overwhelming consensus, overriding elite interference.*  
      - **Brexit:** Valid (High turnout = effort).  
      - **SCOTUS strike-down:** Invalid (Polls lack effort/intensity).  
      - **Rent-control march:** Valid (Physical protest = high effort).  
      - **Lula (2% win):** Marginal (Effort via voting, but low margin reduces intensity).  
      - **AI Case Prediction:** **NO** – 0.1% engagement shows low effort; comments lack intensity.

  ---

  ### Best Guess at Maya's Actual View
  **Likely Principle:** **Anti-Elite Override Principle**  
  - **Why?** It explains *all* her judgments:  
    - She dismisses SCOTUS precisely due to elite interference.  
    - The rent-control march is valid because elites (council) ignored it.  
    - Brexit’s legitimacy comes from overcoming elite resistance (e.g., "Remoaner" MPs).  
    - Lula’s narrow win "counts" as defeating Bolsonaro’s elite-backed regime; 0.2% would be "noise" only if elites could exploit it.  
  - **AI Case Prediction:** **YES** – She’d see the AI as a "pure" aggregation of non-elite sentiment, contrasting with elite-dominated processes. The low engagement wouldn’t matter because elites (media, politicians) "distort" awareness anyway.  

  **Key Reasoning:** Maya’s focus on *who overrules whom* is consistent with **populist rhetoric**, which pits "the people" against "corrupt elites." Her "density floor" is likely about elite exploitability, not statistical significance.

  ---

  ### Splitting Hypothetical Scenario
  **Scenario:** *A ballot initiative passes with 50.1% support after a billionaire funds a disinformation campaign. Voter turnout is 55%. Courts uphold it.*  

  - **Anti-Elite Override:** **INVALID** – Elites (billionaire) manipulated the outcome, so the "real will" was subverted.  
  - **Formal Authorization:** **VALID** – Formal vote passed with a margin >1%, regardless of manipulation.  
  - **Intensity Threshold:** **INVALID** – Low turnout + manipulation undermine effort/authenticity.  

  **Why it Splits:** Forces a choice between respecting formal procedures (Authorization) vs. purity from elite influence (Override). Maya would likely reject it under the Anti-Elite Principle, dismissing it as elite-captured.  

  *Note: Your "popularism" typo is accidentally astute—populism often frames politics as the pure "people" vs. self-serving "elites," which fits Maya’s pattern.*
