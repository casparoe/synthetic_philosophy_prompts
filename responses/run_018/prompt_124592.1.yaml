  hey im a novelist and im writing about a clockmaker who rebuilds the same clock every hundred years from totally new atoms — between builds its completely destroyed, no parts left at all. i stumbled on endurantism vs perdurantism and now im stuck on a conceptual knot. can you give me an example of an issue where these two actually disagree in a way that matters for this kind of intermittent object? like, can the clock have a property that stretches across the gap if its only temporal parts, or does endurantism force us to say its literally a different clock each time? i want it in the weeds, not the usual teleportation example, and please dont give me a reading list or citations — just spell out the disagreement clearly. sory for any typos, im on my phone.
