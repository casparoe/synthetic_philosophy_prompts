  **Footnotes**  
  - *Scope guardrails*: This statement explicitly brackets nature/nurture debates (e.g., heritability estimates) to focus on classification *dynamics*.  
  - *Hacking’s core premise*: Both camps accept that "human kinds" (e.g., "ADHD patient") differ from "natural kinds" (e.g., "electron") via feedback loops between category and categorized.
