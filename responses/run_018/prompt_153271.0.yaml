answer: |-
  Here are your five points:

  1.  **Antigone's assertion of her "sphere" over Polyneices' burial (Lines 1-100) directly clashes with Ismene's preference to obey Creon's decree, preventing any Pareto improvement where both sisters get their way regarding the burial act itself, mirroring Sen's core conflict over mutually exclusive choices controlled by different individuals.**

  2.  **Ismene's initial preference *against* burial shifts under Creon's threat of punishment (Lines 526-581), demonstrating how exogenous state coercion (the missing third party) violates Sen's minimal liberalism by forcing an agent to abandon their chosen "sphere" control (here, Ismene's potential right to non-interference) due to fear, invalidating the pure preference model.**

  3.  **Creon, as the enforcing state (not just a preference holder), actively intervenes by physically preventing burial and imposing the death penalty, breaking Sen's binary agent setup; his power creates the conditions where Antigone's exercise of her "sphere" (burial) necessitates violating Ismene's preferred "sphere" (safety), which only exists because of his decree.**

  4.  **Antigone's appeal to the "unwritten and unfailing statutes of the gods" (Lines 450-470) grounds her choice in divine command, resisting Sen's rational-choice frame where preferences are individual and potentially mutable; her "preference" is presented as non-negotiable duty, sourced externally, not internal calculation or self-interest.**

  5.  **Tiresias' prophecy of divine retribution (Lines 988-1114) embodies tragic fate as an external, deterministic force overriding Creon's state authority and the sisters' choices, something Sen's rational social choice framework cannot accommodate as it assumes outcomes stem solely from the interaction of individual preferences and rules.**
