answer: |-
  Below is a conceptual architecture for evaluating theories of advance directive authority in progressive neurological decline, structured as requested. Desiderata are derived from core philosophical, clinical, and ethical pressures inherent to the problem.

  ---

  ### **Desiderata for an Adequate Theory**  
  *(Non-negotiable = NN; Negotiable = N)*  

  1. **Handling Both Binary and Gradual/Intermittent Capacity Loss**  
     - **Motivation**: Progressive illnesses (e.g., Alzheimer’s) involve fluctuating capacity, unlike sudden coma. A theory must avoid arbitrary thresholds that ignore partial or episodic lucidity.  
     - **Case**: A dementia patient retains capacity for simple preferences but loses complex reasoning intermittently.  
     - **Status**: **NN** (Essential for clinical realism).  

  2. **Preserving the Distinction Between Precedent Autonomy and Current Welfare**  
     - **Motivation**: Conflating autonomy (deference to past wishes) with welfare (optimizing present well-being) obscures core normative conflicts. A theory must justify *why* one might override the other.  
     - **Case**: A directive refuses antibiotics for pneumonia; the later self appears content but would die without treatment. Honoring the directive prioritizes autonomy over welfare.  
     - **Status**: **NN** (Defines the central tension in AD ethics).  

  3. **Accommodating "Intermediate Lucidity" with Reversed Values**  
     - **Motivation**: Patients may express stable, capacitated preferences contradicting their directive (e.g., "I now value life at all costs"). A theory must address whether this invalidates or modifies the directive.  
     - **Case**: An early-stage Huntington’s patient, fully lucid, renounces a prior directive refusing feeding tubes, calling it "a mistake."  
     - **Status**: **NN** (Tests the theory’s coherence across time).  

  4. **Consistency with Avoiding Gratuitous Suffering**  
     - **Motivation**: Clinical duties prohibit *unnecessary* harm, even if authorized by a directive. A theory must reconcile patient authorization with professional integrity.  
     - **Case**: A directive mandates aggressive hydration in late-stage dementia, causing recurrent aspiration pneumonia and agony.  
     - **Status**: **NN** (Rooted in medicine’s fundamental ethical commitments).  

  5. **Respecting Directive Specificity Without Requiring Impossible Psychological Continuity**  
     - **Motivation**: Directives often target *specific interventions* (e.g., "no ventilators"), not identity persistence. A theory must bind clinicians to precise instructions without demanding that the later self "remains the same person."  
     - **Case**: A patient’s directive refuses blood transfusions for religious reasons; later, severe dementia erodes religious identity, but physical aversion to needles remains.  
     - **Status**: **NN** (Prevents abuse of "changed identity" arguments to ignore directives).  

  6. **Mechanism for Weighing Pre-Illness vs. Intermediate Self Authority**  
     - **Motivation**: Conflicts between the directive and intermediate self require transparent, principled resolution—not ad hoc prioritization.  
     - **Case**: The pre-illness self refused antipsychotics; the intermediate self (lucid) requests them to alleviate distressing hallucinations.  
     - **Status**: **NN** (Necessary for practical decisional guidance).  

  ---

  ### **Tensions Between Desiderata**  
  The most acute tension arises between:  
  - **Desideratum 3** (Accommodating intermediate lucidity with reversed values)  
  - **Desideratum 5** (Respecting directive specificity without requiring psychological continuity)  
  - **Desideratum 6** (Weighing authority across selves)  

  **Why?** Strict fidelity to the original directive (per Desideratum 5) risks ignoring capacitated reversals in the intermediate state (Desideratum 3), violating respect for contemporaneous autonomy. But honoring intermediate reversals (Desideratum 3) risks undermining the directive’s purpose if every lucid moment allows revisions. A theory must resolve *when* an intermediate self’s reversal overrides the directive without collapsing into pure presentism (Desideratum 2) or requiring impossible identity persistence (Desideratum 5).  

  ---

  ### **Most Exclusionary Desideratum**  
  **Desideratum 2** (Preserving the autonomy/welfare distinction) does the most to exclude standard binary positions:  
  - **Strict Precedent Autonomy**: Often dismisses welfare concerns, violating Desideratum 4 (avoiding gratuitous suffering).  
  - **Pure Best-Interests**: Collapses autonomy into welfare, failing Desiderata 3, 5, and 6 by treating the directive as merely advisory.  

  ---

  ### **Scoring Three Generic Approaches**  
  *(✓ = Satisfies; ✗ = Fails; ~ = Partial/Ambiguous)*  

  | **Desideratum**               | **(a) Strict Precedent Autonomy** | **(b) Current-Welfare** | **(c) Diachronic-Negotiation** |  
  |-------------------------------|-----------------------------------|--------------------------|--------------------------------|  
  | 1. Gradual vs. Binary Loss    | ✗ (Ignores intermediate states)   | ✓ (Focuses on current state) | ✓ (Acknowledges all stages) |  
  | 2. Autonomy/Welfare Distinction | ✓ (Prioritizes autonomy)          | ✗ (Conflates with welfare) | ✓ (Explicitly balances) |  
  | 3. Intermediate Lucidity      | ✗ (Dismisses reversals)           | ✓ (Honors current wishes) | ~ (Weights based on "narrative coherence") |  
  | 4. Avoid Gratuitous Suffering | ✗ (May mandate suffering)         | ✓ (Minimizes suffering)  | ~ (Seeks integration) |  
  | 5. Specificity Sans Continuity | ✓ (Binds to text)                 | ✗ (Ignores specificity)  | ~ (Contextualizes text) |  
  | 6. Weighing Mechanism         | ✗ (No weighing: directive wins)   | ✗ (No weighing: current self wins) | ✓ (Built-in deliberative process) |  

  **Analysis**:  
  - **(a) Strict Precedent Autonomy**: Fails desiderata requiring responsiveness to changing states (1, 3, 6) and suffering (4). Strong on 2 and 5.  
  - **(b) Current-Welfare View**: Fails to preserve autonomy/welfare distinction (2) and directive specificity (5). Strong on 1, 3, 4.  
  - **(c) Diachronic-Negotiation**: Best at satisfying 1, 2, and 6. Struggles with 3 (how decisively to weight reversals), 4 (how to bound suffering within "negotiation"), and 5 (how rigidly to interpret specificity).  

  **Key Tension Highlight**: Only (c) attempts to reconcile intermediate reversals (Desideratum 3) with directive fidelity (Desideratum 5), but its success hinges on the rigor of its "weighing mechanism" (Desideratum 6). If it weights intermediate preferences too heavily, it collapses into (b); if too weakly, it mimics (a).  

  ---

  This framework provides a taxonomy for evaluating theories based on their ability to resolve inescapable normative conflicts in progressive illness, prioritizing conceptual necessity over partisan commitments. The diachronic approach emerges as the most promising but must confront the autonomy/welfare distinction and the authority-weighting problem to achieve adequacy.
