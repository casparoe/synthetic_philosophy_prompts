prompt: |-
  I want to practice pressing the natural-law side of the Hart–Fuller debate in a setting that avoids the familiar post-war examples. Please play a committed Hartian legal positivist: sharp, ready to concede that morality and law often overlap in practice, but unyielding on the separability thesis—that a rule’s legal existence and content depend only on social sources, never on moral merit. Stay in character, reply in a single paragraph, and do not break role unless I say “stop”.

  Here is my opening move. I have recently been advising a task force drafting an automated administrative code: a fully deterministic algorithm applies a closed, public, non-retroactive rule-set to immigration decisions, and the enabling statute explicitly forbids any embedded moral evaluation. The outputs are consistent and predictable, yet systematically produce results that violate basic human dignity. I contend that this is not merely immoral law, but a defective instance of law itself, because Fuller’s principles of legality—generality, promulgation, non-contradictoriness, and the rest—are not merely instrumental efficiencies but internal moral commitments that constitute legal authority. Defend the view that this algorithmic regime is law in the fullest sense despite its moral horror, and address specifically whether the legislative exclusion of moral reasoning undermines Fuller’s claim that law possesses an “internal morality.” Do not invoke the classic Nazi-law hypotheticals; deal with the algorithmic closure directly.
reasoning: |-
  Okay, let me approach this Hart-Fuller debate simulation carefully. The user wants me to defend Hartian positivism against a novel algorithmic law scenario, avoiding worn-out Nazi law examples. 

  Hmm, the core challenge is maintaining strict separability while addressing Fuller's "internal morality" claim. The user's automated immigration system presents a perfect stress test - it's morally horrific yet procedurally pristine. 

  I need to make three key moves: First, firmly distinguish between legal validity and moral appraisal. Second, show how Fuller's principles reduce to functional requirements rather than moral commitments. Third, demonstrate that excluding moral evaluation actually strengthens positivism by proving sources alone determine legality. 

  The algorithmic closure is helpful here - its determinism highlights how law operates as a social artifact. I'll emphasize that consistency and predictability satisfy Fuller's own criteria, making the system's immorality legally irrelevant. 

  Notably, the legislature's explicit exclusion of moral reasoning serves my argument - it proves legal authority derives solely from institutional sources. Fuller's principles become mere efficiency metrics when stripped of moral weight. 

  I should avoid conceding any ground on the constitutive nature of legality's morality. The paragraph must stay sharply focused on sources-based validity while acknowledging - without endorsing - the moral outrage.
answer: |-
  As your Hartian opponent, I concede the system’s moral bankruptcy but firmly reject its characterization as legally defective. Fuller’s eight principles are merely functional desiderata for effective governance—not inherent moral commitments. Your algorithm satisfies generality (rules apply universally), promulgation (publicly accessible code), non-contradiction (deterministic outputs), constancy (non-retroactivity), and possibility of compliance (clear inputs yield predictable decisions). That it operates consistently within its closed rule-set—however morally abhorrent the outcomes—makes it paradigmatically *law* under the separability thesis. The legislature’s explicit exclusion of moral reasoning doesn’t undermine law’s existence; it demonstrates that legal validity flows solely from social sources (here, the statute authorizing the algorithm and its code). Fuller’s "internal morality" conflates efficacy with essence: a knife can be sharp (functional) yet wielded immorally—so too with this system. Its horror stems not from legal deficiency but from the *content* of its source-based rules, which are legally valid precisely because they derive from the recognized legislative authority. The machine’s cruelty doesn’t negate its legality—it underscores why separating law’s validity from morality is essential for clear condemnation.  

