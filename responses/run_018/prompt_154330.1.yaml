prompt: |-
  I'm not an academic philosopher, but I've been working through Plato's Laws on my own and I'm caught on a strange idea he has there: that getting drunk isn't just a pleasure or a vice, but can be deliberately arranged as a kind of examination of the soul, where loosening reason lets the lower parts show whether they're governed or wild. He pairs this with strict rules about who may drink, who must supervise, and how old one must be, as if the test only works inside a very specific social frame. I'm running a discussion group at a community library — about ten adults, ages 25 to 60, one 90-minute session, no one is a specialist. I want a structured activity, not a lecture, that makes participants feel this tension themselves: they should experience both the diagnostic pull (that intoxication reveals something hidden) and the framing problem (that without the right rules, it just corrupts). Design a role-play or deliberation with assigned roles — say, elder citizens, young trainees, magistrates, and guests — rules about when wine may be served, hidden incentives or token payoffs, and a decision point where the group must vote on whether to allow a "test" for a particular character. Build in an asymmetry: the person being tested learns something about themselves that the observers can't reliably access. Include a timeline, a debrief that maps what happened onto Plato's distinctions without naming them at the start, an honest note on which feature — probably the idea that reason remains present as an internal observer even when its authority is suspended — the activity can't reproduce and must be supplied verbally, and a warning about what will predictably go wrong the first time it's run. Don't ask for citations, reading lists, or bibliographies; the activity should stand on its own logic.
reasoning: |-
  We are designing a role-play activity for a 90-minute session with non-specialist adults. The goal is to explore Plato's idea that controlled intoxication can serve as a test of the soul, revealing the state of one's inner governance, but only within a strict social and regulatory framework.

  Activity Title: The Symposium Test

  Overview:
  Participants are divided into four roles: Elders (guardians of tradition and wisdom), Young Trainees (citizens in training), Magistrates (enforcers of law and order), and Guests (outsiders to the city). The scenario is a state-sanctioned symposium (drinking party) in the fictional city of Magnesia (from Plato's Laws). The group must deliberate and vote on whether to allow a specific Young Trainee to undergo the "wine test" to assess their character. The twist: the Young Trainee being tested will have a private experience (a revelation about their own impulses) that others cannot fully access, and there is a hidden incentive for some roles to push for or against the test for reasons beyond the stated purpose.

  Roles (for 10 participants):
  - Elders (3 people): They are the wisest and have experienced many such tests. They know the rules and traditions. They are concerned about the moral fabric of the city. They have a hidden incentive: they want to maintain their authority and the status quo. They might fear that a failed test (or even a successful one) could disrupt the order they uphold.
  - Young Trainees (3 people, including one designated as the "Candidate" for the test): They are in their 20s and 30s, being prepared for full citizenship. They are eager to prove themselves. The Candidate has a hidden trait: they have been struggling with a particular vice (e.g., anger, lust, greed) but have kept it hidden. The other two Young Trainees are supporters of the Candidate and want to see their friend succeed, but they also have a hidden incentive: if the Candidate fails, it might reflect poorly on their whole group, so they are conflicted.
  - Magistrates (2 people): They are responsible for enforcing the laws and ensuring the symposium follows the rules. They are strict and by-the-book. Their hidden incentive: they want to avoid any scandal or disorder that might make them look bad. They also have a personal dislike for one of the Elders (assigned randomly) and might oppose that Elder's views just to assert their independence.
  - Guests (2 people): They are from a neighboring city and are observing the customs of Magnesia. They have been invited to this symposium. They are curious and somewhat skeptical about the wine test. Their hidden incentive: they want to gather information to report back to their own city, and they might exaggerate either the success or failure of the test to suit their city's interests (e.g., to show that Magnesia is either wise or foolish).

  Setup:
  - The activity is set in the Council Hall of Magnesia, where the symposium is about to begin.
  - There are strict rules about the symposium: 
    - Only citizens over 40 (the Elders) are allowed to drink freely. 
    - Young Trainees may only drink under supervision and only for the purpose of the test.
    - The wine is mixed with water in a specific ratio (3:1 water to wine) to control the effects.
    - The test must be conducted in the presence of at least two Elders and one Magistrate.
    - The Candidate must be at least 30 years old (which they are) and must have shown good conduct for the past year.

  The Scenario:
  The group is gathered to decide whether to allow a specific Young Trainee, let's call them Alex, to undergo the wine test. Alex has been nominated by one of the Elders (Elder 1) but opposed by another (Elder 2). The reason given: Elder 1 believes Alex has shown great progress and is ready for full citizenship, while Elder 2 suspects Alex of hiding a flaw that the test might reveal. The other roles have their own perspectives.

  Timeline (90 minutes total):
  1. Introduction (5 minutes): Explain the setting and the roles. Assign roles randomly (but ensure the Candidate is one of the Young Trainees). Hand out role cards with a brief description and the hidden incentives. Explain the rules of the symposium and the purpose of the wine test (as a diagnostic tool for the soul). Also, explain that the activity will end with a vote on whether to allow Alex to take the test.

  2. Role Preparation (10 minutes): Participants read their role cards and think about their position. The Facilitator (you) circulates to answer questions.

  3. Deliberation (45 minutes): 
     - The Elders start by stating their positions on the test for Alex. 
     - Then the Young Trainees (including Alex) speak. Alex must argue for being allowed to take the test, but without revealing the hidden vice (they can only speak in general terms about their readiness). 
     - The Magistrates then state whether the rules are being followed and if they see any legal issues. 
     - The Guests ask questions and express their views, which might be critical or supportive. 
     - Open discussion: everyone can speak, but the Facilitator should ensure that the hidden incentives come into play (remind participants of their hidden goals if needed). 
     - The group must vote at the end of the deliberation.

  4. The Test (15 minutes, simulated without actual alcohol):
     - If the vote is in favor (at least 6 out of 10 votes), then the test is conducted. 
     - The Candidate (Alex) is given a "cup of wine" (water in a cup, pretending it's wine). 
     - Alex then has to engage in a simulated activity: a debate on a controversial topic (e.g., "Should the city allow more foreign guests?") for 5 minutes. 
     - During the debate, Alex must reveal their hidden trait. For example, if the hidden trait is anger, they become easily provoked and lose their temper in the debate. If it's lust, they might make inappropriate comments. If it's greed, they might argue for policies that would enrich themselves. 
     - The other participants observe and take notes on Alex's behavior. 
     - After the debate, Alex is asked to step out for a moment (or stay but remain silent) and then the group discusses what they observed. 
     - Then, Alex is brought back and given a chance to reflect privately (on a piece of paper) about what they felt during the test: did they notice their own impulses? Were they able to control them? This reflection is shared only with the Facilitator and then read aloud anonymously (so the group hears the internal experience but doesn't know it's from Alex unless Alex chooses to reveal). 
     - If the vote is against the test, then the group discusses why and what that means for Alex and the city. The Candidate still writes a reflection about what they think the test might have revealed and shares it anonymously.

  5. Debrief (15 minutes):
     - Map the experience to Plato's concepts without naming them at first:
       - Diagnostic pull: The test revealed something about Alex's character (the hidden trait). But note that the observers saw the behavior, but only Alex had access to the internal struggle (the asymmetry).
       - Framing problem: The group had to set rules (the symposium rules) to make the test meaningful. Without the rules (e.g., if anyone could drink, or without supervision), the test might have turned into chaos (corruption).
     - Then name Plato's distinctions: 
       - The test as an examination of the soul: the wine loosens reason, allowing the lower parts (appetites and passions) to show themselves.
       - The necessity of the social frame: the rules, the presence of elders, the age restrictions, etc.
     - The element that cannot be simulated: the internal observer. In Plato, even when reason is suspended by wine, there remains an internal observer (reason in a diminished role) that can later report on what happened. In the activity, we simulated this by having Alex write a reflection, but we had to explicitly set it up. In reality, this internal observer is a natural part of the mind, but in the role-play, we must supply it as a step. Without this step, the activity would miss the key point that the drunk person is both the subject and the observer of their own soul.
     - Warning about what might go wrong: 
       - Participants might not take the hidden incentives seriously, leading to an overly idealistic discussion. 
       - The Candidate might overact or underact the hidden trait, making the observation too obvious or too subtle. 
       - The debate during the test might become chaotic if not well managed. 
       - The group might focus too much on the vote and not enough on the deliberation of the test's purpose. 
       - The debrief might feel rushed if the deliberation runs long.

  Materials:
  - Role cards for each participant (with role description and hidden incentive).
  - A copy of the symposium rules for all.
  - Paper and pens for the reflection.
  - A cup for the "wine".

  Note on Safety and Ethics:
  Since we are not using actual alcohol, the activity is safe. The hidden traits (anger, lust, greed) should be assigned in a way that is not too sensitive for the group. If necessary, you can choose milder traits (e.g., impatience, envy, boastfulness) or let the Candidate choose one from a list.

  This activity should create the tension between the diagnostic value of the test and the fear of corruption without the proper frame. It also highlights the asymmetry: the tested individual gains self-knowledge that others can only infer.
answer: |-
  ### **Symposium of the Soul: A Role-Play on Plato’s Wine Test**  
  *(90-minute session for 10 non-specialist adults)*  

  **Core Tension:**  
  Participants experience Plato’s dual insights:  
  1. **Diagnostic pull**: Intoxication can reveal hidden flaws or virtues by loosening reason.  
  2. **Framing problem**: Without strict rules, it corrupts rather than enlightens.  

  **Asymmetry:** The tested person gains private self-knowledge (e.g., "I now see my hidden anger") that observers can only guess at, mirroring Plato’s idea that the soul’s truths are felt internally.  

  ---

  ### **Structure**  
  **Phase 1: Setup (15 min)**  
  - **Roles & Rules**: Assign roles randomly:  
    - **Elders** (3 people): Keepers of tradition. Must approve the test. *Hidden incentive*: Gain "Wisdom Tokens" (paper chits) if the test preserves order.  
    - **Young Trainees** (3 people): Citizens-in-training. One volunteers as the **Candidate** for the test. *Hidden incentive*: Earn "Honor Tokens" if they pass the test (reveal growth, not vice).  
    - **Magistrates** (2 people): Enforcers of rules. *Hidden incentive*: Gain "Order Tokens" if the symposium stays peaceful.  
    - **Guests** (2 people): Foreign observers. *Hidden incentive*: Gain "Influence Tokens" if chaos occurs (to report Magnesia’s instability back home).  
  - **Rules of the Symposium** (Distribute printed cards):  
    - Wine is only drunk during state-sanctioned tests.  
    - Tests require 2 Elders + 1 Magistrate present.  
    - Only Trainees aged 30+ may volunteer.  
    - "Drunkenness" = symbolic act (e.g., sipping water), not real alcohol.  
  - **Test Purpose**: Announce: "Tonight, we debate whether Candidate [Name] undergoes the ‘Wine Test’ to reveal their true character."  

  **Phase 2: Deliberation (30 min)**  
  - **Round 1: The Proposal** (5 min):  
    - An Elder argues *for* the test: "We must see if [Candidate]’s self-control is real!"  
    - A Magistrate questions: "What if they break the rules? Who supervises?"  
  - **Round 2: Hidden Incentives in Play** (15 min):  
    - Participants debate in role. The Facilitator secretly hands **incentive prompts** to stir tension:  
      - *Elders*: "Hint that the Candidate once showed arrogance."  
      - *Candidate*: "Confess privately to one Elder: ‘I fear my anger.’" (Others don’t hear this.)  
      - *Guests*: "Whisper: ‘If this fails, our city can invade Magnesia.’"  
  - **Round 3: Vote** (10 min):  
    - Vote on: "Should [Candidate] undergo the Wine Test?"  
    - **Passes if 6/10 agree** (Elders’ votes count double).  

  **Phase 3: The Test (If Approved)** (20 min)  
  - If the vote fails, skip to **Debrief** with focus on "Why did we fear corruption?"  
  - If approved:  
    - **The Ritual**:  
      - Candidate "drinks wine" (sips water).  
      - They face a **stressful scenario** (e.g., "A Guest insults Magnesia’s laws. How do you react?").  
      - Candidate responds in character (e.g., if hiding anger, they snap; if disciplined, they stay calm).  
    - **Asymmetry in Action**:  
      - Candidate writes a **private reflection** (1 min): *"What did you learn about yourself? Did you feel wild or in control?"* (e.g., "I saw my anger flare").  
      - Observers debate: *"What did we learn about [Candidate]?"* (Guests/Magistrates may misinterpret).  
    - **Reveal**: Candidate shares their reflection aloud—highlighting the gap between internal insight and external judgment.  

  **Phase 4: Debrief (25 min)**  
  1. **Map to Plato** (without naming him yet):  
     - *Facilitator asks*:  
       - "What did the ‘wine’ reveal? Was it a true glimpse of the soul, or just chaos?"  
       - "How did the rules help or hinder the test?"  
       - "Could the Candidate know something about themselves we couldn’t see?"  
  2. **Name Plato’s Framework**:  
     - "Plato believed wine *exposes the soul’s hidden parts* when reason steps back. But *only* in a controlled setting like this—with Elders supervising, age limits, and rules—can it be a test, not a vice."  
  3. **The Unreproducible Element**:  
     - *Honest note*: "In Plato’s view, *reason remains sober internally* even when drunk, acting as a silent witness. Our activity can’t replicate this—we simulated it through the Candidate’s reflection. Real self-examination requires that inner ‘observer,’ which Plato thought was innate."  
  4. **Warning for First Run**:  
     - "Predictable hiccup: Guests or Magistrates may *ignore hidden incentives* and debate ‘fairly,’ flattening the tension. Remind them: ‘Your tokens depend on chaos/order!’ Also, Elders might dominate—nudge Trainees to challenge them."  

  ---

  ### **Role Cards (Summary)**  
  - **Elder**: *"Defend tradition. Push for tests to ‘civilize’ youth. Get Wisdom Tokens if order is kept."*  
  - **Young Trainee (Candidate)**: *"Volunteer to prove your worth. After the test, you’ll learn a hidden truth about yourself. Get Honor Tokens if you show growth."*  
  - **Magistrate**: *"Enforce rules strictly. Warn against risks. Get Order Tokens if no chaos erupts."*  
  - **Guest**: *"Undermine Magnesia subtly. Get Influence Tokens if the test fails or causes conflict."*  

  ### **Tokens System**  
  - Tokens = paper chits worth "points." Trade them at the end for small prizes (e.g., extra bookmarks, choosing the next discussion topic).  
  - Incentives create moral tension: Elders may block a test to *avoid risk*, even if it’s "wise," to protect tokens.  

  ### **Why This Works**  
  - **Tension embodied**: Rules vs. revelation, public judgment vs. private insight.  
  - **Plato’s DNA**: Strict social framing (roles, rules, age) + the Candidate’s asymmetric self-knowledge.  
  - **Safe & engaging**: No real alcohol; symbolic actions drive philosophical stakes.  

  **Outcome**: Participants leave feeling the weight of Plato’s paradox—freedom needs fences, and truth hides in surrender.
