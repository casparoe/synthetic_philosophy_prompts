answer: |-
  Here's a careful analysis addressing your queries point-by-point, evaluating the causal-contact and reference-fixing formulations of the paradox of phenomenal judgment for epiphenomenalism:

  ### 1. Distinctness of Arguments
  - **Causal-Contact (Evidential)**: Focuses on *justification of belief/knowledge*. It argues that if qualia are causally inert, they cannot *cause* judgments about themselves, breaking the standard causal link often assumed for empirical knowledge. The common-cause reply addresses this by positing reliable correlation as sufficient for justification/knowledge.
  - **Reference-Fixing (Semantic)**: Focuses on *meaning and reference*. It argues that if reference is fixed by causal regulation (e.g., via use in judgments), and qualia don't regulate term-use, then phenomenal terms *cannot refer to qualia at all*—they refer to the neural state doing the regulating.  
  - **Irreducible Distinctness**: They are **genuinely distinct**. The causal-contact problem targets *epistemic access* ("How can I *know* about my qualia?"). The reference-fixing problem targets *semantic content* ("How can I even *mean* qualia by my terms?"). The latter establishes that the epiphenomenalist cannot coherently *express* her view, a problem prior to justification.

  ### 2. Relative Difficulty & Scope
  - **Harder Problem**: **Reference-fixing** is more severe.  
    - *Why*: Even if the common-cause reply salvages *knowledge* (causal-contact), the reference-fixing problem implies the subject isn't *talking about qualia* in the first place. Her statement "I have qualia caused by N" would *mean* "I have neural state N" (or some functional state), making epiphenomenalism *unsayable* for her.  
  - **Broader Scope**: **Reference-fixing** tells against a wider range of views. Any non-reductive theory where phenomenal properties lack causal efficacy (e.g., certain dualist or non-physicalist emergentist views) faces this semantic threat. The causal-contact problem primarily targets epiphenomenalism itself.

  ### 3. Generalization Beyond Philosophy of Mind
  - **Causal-Contact & Abstract Objects**:  
    - **Generalization**: Yes—knowing causally inert entities (e.g., numbers, universals) is a parallel epistemic challenge.  
    - **Resource, not Reductio**: This *helps* the epiphenomenalist. If we accept non-causal knowledge (e.g., via rational intuition, conceptual relations) for abstracta, this legitimizes the common-cause reply: reliable correlation (like causal contact in perception) suffices for knowledge.  
  - **Reference-Fixing Generalization**:  
    - **Limited Analogy**: Reference-fixing via causal regulation is typically tied to *empirical* concepts. Abstracta often invoke *descriptive* or *conceptual* reference-fixing (e.g., "2" refers to the successor of 1 via mathematical axioms).  
    - **No Direct Help for Epiphenomenalist**: Phenomenal concepts are empirical (grounded in experience), not abstract. The regulatory role of the referent is central to dominant theories (e.g., causal-historical, teleosemantic) for such concepts. This generalization offers little defense.

  ### 4. Qualia Drift Case Analysis
  - **Setup**: Neural state N always causes judgment "I'm in pain." Early qualia: pain. Later qualia: neutral buzz → mild pleasure. No detectable change.  
  - **Causal-Contact + Common-Cause Reply**:  
    - **Prediction**: Judgments remain "knowledge" early on (reliable correlation). After drift, judgments are *false* but *justified* (subject has same evidence).  
    - **Problem**: The common-cause reply cannot explain the *falsity* post-drift—it only ensures reliability *in the actual world*, not counterfactual robustness.  
  - **Reference-Fixing + Regulation**:  
    - **Prediction**: The term "pain" refers *from the start* to N (or its functional role), which regulates term-use. Post-drift, "I'm in pain" remains *true* (N is present) and refers to N, not the quale. The subject never meant qualia by "pain."  
  - **Discrimination**:  
    - Qualia drift **devastates the causal-contact reply** (judgments become false) but **validates the reference-fixing reply** (semantic content doesn't shift).  
    - **Verdict Survival**: Qualia drift strengthens the case for reference-fixing being the deeper problem (see §2). The epiphenomenalist cannot explain how "pain" could refer to a shifting quale when reference is fixed by N.  

  ### Final Verdict & Epiphenomenalist Defense
  - **Deeper Objection**: **Reference-fixing** is more fundamental. It attacks the *possibility of meaning*, which precedes questions of knowledge. Even if knowledge is salvaged via correlation, the view remains semantically inexpressible.  
  - **Strongest Epiphenomenalist Move**:  
    1. **Reject causal regulation for phenomenal concepts**: Argue that phenomenal reference is fixed by *acquaintance* (a direct, non-causal relation) or *essential indexicals* ("this" quality).  
    2. **Cost**: This requires abandoning mainstream externalist semantics for phenomenal terms, leaning on a contentious Cartesian epistemology.  
    3. **Alternative**: Bite the bullet—accept that "pain" refers to N, but insist we *also* have non-representational acquaintance with qualia. This collapses into mysterianism or ad-hocery.  

  **Conclusion**: The reference-fixing formulation poses a near-fatal challenge to epiphenomenalism. While the causal-contact problem can be mitigated (via correlation), the semantic problem undermines the very language used to state the theory. Qualia drift amplifies this, exposing how neural regulation trumps qualitative content in fixing reference. Only a radical revision of semantics offers a viable defense—at the cost of broader theoretical coherence.
