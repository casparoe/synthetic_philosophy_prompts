  okay so i was arguing with my roommate about Frege's identitiy puzzle — you know, why learning that Hesperus is Phosphorus can actually be news even though both names just point to Venus. We got sidetracked into whether the same logic works when science doesn't just discover a hidden sameness but actually changes its categories. So here's what i want: take the 2006 IAU vote in Prague that redefined Pluto as a dwarf planet, and analyze that whole episode through Frege's sense/referance distinction.

  I want a careful mapping, not a vague analogy. Treat Pluto as a proper name with a fixed reference, and 'planet' as a kind term whose sense includes orbital criteria. The IAU essentially advanced an identity claim — Pluto is identical to a dwarf planet — but that wasn't revealing a pre-existing fact like the Venus case; it was revising the membership conditions for the category. So ask whether Frege's framework can handle this kind of 'constitutive identity,' where the reference conditions of the kind term itself shift, or whether it breaks because the informativeness here comes from institutional authority rather than hidden semantic content. Also talk about Mike Brown's discovery of Eris and how it forced the crisis: does that make the identity statement look more like an empirical discovery or more like a definitional stipulation?

  Then be honest about where the theory goes silent. Frege explains cognitive surprise — people not knowing that a = b — but can it explain why astronomers and the public reacted like Pluto had lost an essential nature, not just a label? And does the episode show that scientific taxonomy involves a kind of reference-fixing that depends on peer votes in a way Frege's logic was never meant to cover? Don't give me a bibliography or citation list; i just want the disciplined analysis and an explicit account of what's forced and what's missing.
