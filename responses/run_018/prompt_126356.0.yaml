answer: |-
  Here’s a philosopher’s toolkit for evaluating self-deception theories, structured around non-negotiable desiderata, core tensions, and theory scoring. The goal is **conceptual coherence without empirical contradiction**.

  ---

  ### **Core Tensions (Brainstorm)**
  - **Doxastic Tension**: Beliefs aim at truth; self-deception exploits *how* we satisfy this aim.  
  - **Agency Paradox**: If intentional, it’s not deception (you know the truth); if unintentional, it’s not *self*-directed.  
  - **Unity vs. Partition**: Can minds host *genuinely* contradictory beliefs without being merely confused?  
  - **Access vs. Motivation**: Does avoiding truth require active effort or passive architecture?  
  - **Cognition vs. Metacognition**: Self-deception often involves policing *what counts* as evidence (epistemic standards).  

  ---

  ### **Non-Negotiable Desiderata**  
  1. **Avoid Literal Contradiction**  
     - *Why non-negotiable*: Beliefs are *commitments* to truth. Holding "P" and "not-P" *as beliefs* violates rationality’s core.  
     - *Requirement*: The theory must explain apparent contradiction *without* positing simultaneous, conscious, fully doxastic states.  
     - *e.g.*: The smoker must *not* simultaneously believe "smoking kills" and "smoking won’t kill *me*" in the same cognitive context.  

  2. **Explain Motivated Avoidance**  
     - *Why non-negotiable*: Self-deception is *goal-driven* (e.g., reducing anxiety, preserving identity).  
     - *Requirement*: Must show how desires/emotions gatekeep belief formation/retrieval.  
     - *e.g.*: The spouse "doesn’t notice" affair clues due to terror of abandonment, not blindness.  

  3. **Preserve Belief-Access Distinction**  
     - *Why non-negotiable*: Self-deception ≠ ignorance. The truth must be *inaccessible* due to motivation, not absent.  
     - *Requirement*: Distinguish "lacking belief P" from "blocking access to belief P".  
     - *e.g.*: The smoker *has* seen cancer stats (so truth is in mind) but avoids integrating them.  

  4. **Handle Epistemic Double Standards (Your "Epistemic Escrow")**  
     - *Why non-negotiable*: Shows self-deception can be *domain-specific*, not global irrationality.  
     - *Requirement*: Explain how agents compartmentalize *epistemic norms* (e.g., "research rigor" vs. "policy pragmatism").  
     - *e.g.*: The climate scientist *uses* models in research (accepts uncertainty quantification) but *frames* them as "too uncertain for policy" by relaxing standards.  

  5. **Fit Cognitive Science Constraints**  
     - *Non-negotiable findings*:  
       - **Attentional Biases**: We pre-consciously filter threatening info (e.g., faster reaction times to self-relevant threats).  
       - **Memory Modes**: Semantic (factual) vs. autobiographical (self-narrative) memory can conflict.  
       - **Neural Evidence**: fMRI shows conflict detection (anterior cingulate) + suppression (dlPFC) when processing uncomfortable truths.  
     - *Requirement*: No theory can deny motivated information processing is subconscious and efficient.  

  ---

  ### **Theoretical Trade-offs & Tensions**  
  - **Jointly Unsatisfiable?**  
    - **Transparency + Motivation**: If all beliefs are introspectively accessible (*transparency*), motivated avoidance becomes impossible. *Resolution*: Access is gated by metacognitive processes.  
    - **Partition + Unity**: Strong partitioning ("subagents") risks dualism; weak partitioning ("frames") may lack explanatory power.  

  - **Partitioning Necessity?**  
    - Literal sub-minds? Only if necessary to explain *inaccessible* belief conflicts (e.g., dissociative disorders). For most cases, *attentional/affective gating* suffices.  

  ---

  ### **Scoring Major Theories**  
  *(Against the above criteria)*  

  1. **Intentionalist View** ("You lie to yourself")  
     - *Core*: Self-deception as intentional deception of oneself.  
     - **Pros**: Explains agency (e.g., the spouse *chooses* not to investigate).  
     - **Cons**: Fails **Avoid Contradiction** (knowing truth requires believing it) and **Agency Paradox**. Ignores cognitive science on subconscious bias.  
     - *Verdict*: Inadequate. Collapses into either confusion or mere pretense.  

  2. **Deflationary View** ("Just motivated reasoning")  
     - *Core*: Biased evidence weighting + memory/attention filters. No "belief contradiction," just skewed doxastic inputs.  
     - **Pros**: Fits **Cognitive Science**, explains **Motivated Avoidance**, avoids partitions.  
     - **Cons**: Struggles with **Epistemic Escrow** (can’t explain *deliberate* standard-switching) and **Access Distinction** (if bias is automatic, how is truth "held but blocked"?).  
     - *Verdict*: Best for simple cases (smoker) but incomplete for high-agency/compartmental cases.  

  3. **Partitionist View** (Davidsonian "divided mind" or cognitive frames)  
     - *Core*: Mind has semi-independent modules/frames. Belief P active in Frame A, not-P in Frame B, with limited cross-talk.  
     - **Pros**: Handles **Epistemic Escrow** (policy vs. research frames), **Access Distinction** (truth accessible only in one frame), and **Avoid Contradiction** (no simultaneous active belief).  
     - **Cons**: Risks overcomplicating; must show partitions aren’t ad hoc. Must align with cognitive architecture (e.g., neural networks support context-dependent activation).  
     - *Verdict*: Most promising for complex cases, but requires evidence for stable, motivation-driven partitions.  

  ---

  ### **Synthesis**  
  Adequate theory must:  
  - **Avoid** literal belief contradiction → favors deflationary or partitionist.  
  - **Explain** motivated gating → requires subconscious mechanisms (all theories).  
  - **Resolve** epistemic escrow → demands partitionist resources (domain-specific norms).  
  - **Ground** in cognition → deflationism wins simplicity; partitionism wins phenomenology.  

  **Your path forward**: Study how *cognitive frames* (a lightweight partitionism) handle escrow cases via "epistemic context-shifting" without full subagents. Reject intentionalism unless it morphs into self-signaling (e.g., "I pretend P to feel P"). Deflationism + frame theory may be the minimalist sweet spot.

  ---

  Key insight: Self-deception isn't holding *contradictions*—it’s **orchestrating ignorance** by managing what your mind treats as *relevant* or *credible* in a given context. Your climate scientist isn’t lying; she’s toggling between epistemic worlds.
