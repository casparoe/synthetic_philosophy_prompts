answer: |-
  Your dissection hits the nerve of a deep tension in how science navigates uncertainty across time horizons. The institutional practice you describe—asymmetric tolerance for boundary-condition failures in long-run vs. short-run models—rests on a **hybrid philosophy blending Lakatosian research programs with Bayesian pragmatism**, but it's not philosophically consistent. Here's the breakdown:

  ### 1. **Core Philosophical Commitments**
     - **Lakatos Rescues (Implicitly):**  
       The "rescue credit" for long-term models when boundary conditions fail directly mirrors Lakatos' notion of the *hard core* (e.g., climate thermodynamics, Malthusian resource-population feedbacks) protected by a *belt of auxiliaries* (tech assumptions, policy scenarios). Falsification is deflected to the belt.
     - **Popperian Strictness for Short-Term:**  
       Near-term forecasts operate like Popperian "risky predictions": falsification is immediate because auxiliary assumptions (e.g., current emission rates) are treated as fixed. No protective belt is granted.
     - **Quine-Duhem in Practice:**  
       Panels tacitly acknowledge the Quine-Duhem thesis—that theories face tests only in conjunction with auxiliaries—but resolve it *temporally*. Long horizons allow auxiliaries to be "unpacked" post-hoc; short horizons do not.

  ### 2. **"Right but Early" as Epistemic Category?**
     - **Credit Banking is Real but Contingent:**  
       Institutions *do* treat delayed vindication as valid (e.g., climate models from the 1970s "failed" on aerosol cooling but were later redeemed). However, this requires:
       - Core mechanisms being *quantitatively robust* (not just qualitatively suggestive).
       - Boundary failures being *externally shocking* (e.g., unforeseen shale gas revolution, not model calibration errors).
       - **Danger:** This can slide into post-hoc rationalization for unfalsifiable theories (e.g., some long-term economic forecasts).

  ### 3. **Consequences of Switching to Flat Popperianism**
     Adopting uniform falsification rules would force radical changes:
     - **Long Models Killed Prematurely:** Malthusian dynamics or climate tipping points would be "falsified" due to transient tech/policy shocks.
     - **Model Divergence Suppressed:** Panels would penalize exploratory long-term models (e.g., SSP5-8.5 climate scenario) for inevitable boundary failures, stifling worst-case planning.
     - **Auxiliary Juggling Overload:** Researchers would waste effort defending boundary assumptions instead of refining core theory.

  ### 4. **Pragmatism vs. Principle: What's Really Driving This?**
     - **Pragmatic Weighting Isn't Enough:** If only policy urgency mattered, panels would still *distinguish* boundary vs. structural errors in short-term models (but they don't). The asymmetry implies a deeper belief:
       - **Causal Depth Hypothesis:** Long-run models capture *fundamental dynamics* (entropy, demographics) seen as "more real" than contingent boundary conditions.
       - **Temporal Scalability Claim:** Resource scarcity or CO₂ forcing are invariant across scales; consumer price shocks are not.
     - **Yet Pragmatism Bites Back:** In practice, institutions *do* prioritize near-term accuracy for funding/political reasons—but this doesn't explain why they formally excuse boundary failures *only* for long horizons.

  ### The Inconsistent Core
  The double standard exposes a conflict: **Institutions want models to be both *actionable tools* (Popperian for policy) and *deep structural truths* (Lakatosian for theory)**. This creates schizophrenia:
  - For climate, IPCC treats RCP scenarios as *heuristic tools* (boundary-dependent) but asserts CO₂-forced warming as *core truth*.
  - In demography, UN population models are "falsified" by short-term fertility swings but retain authority for 2100 projections.

  ### A Better Framework?
  A coherent approach might adopt **Gelfert's *Tractable Models*** view: 
  - **Short-Term:** "Control models" optimized for verifiable predictions (Popper-compliant).  
  - **Long-Term:** "Exploratory models" mapping possibility spaces (Lakatos-protected), with explicit *boundary-sensitivity audits* replacing "rescue credits."

  This would require panels to abandon the pretense that a single epistemology governs all forecasts—and admit that **very long-range predictions are exercises in conditional reasoning, not falsifiable science.** The current "double standard" is an unstable truce between these goals.
