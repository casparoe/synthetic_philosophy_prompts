answer: |-
  ### Embodied Classroom Exercise: Arrow's Impossibility in the Meridian Committee  
  **Activity Title:** The Meridian Paradox  
  **Setting:** 16 undergraduates in a 90-minute political philosophy seminar. Participants act as disciplinary delegates on the Meridian Committee, tasked with awarding a single grant to one of four real proposals (Aurora, Boreas, Cygnus, Draco) and one ineligible "shadow proposal" (Echo).  

  ---

  ### **Materials**  
  1. **Preference Cards**: 16 unique cards (laminated) specifying a delegate’s full ranking of all five proposals (Aurora, Boreas, Cygnus, Draco, Echo). Cards are distributed privately to ensure an intransitive social ordering.  
  2. **Ballots**: Custom slips for pairwise votes (e.g., "Aurora vs. Boreas: Circle winner").  
  3. **Tournament Bracket Board**: A visual tracker showing the sequential elimination process.  
  4. **Prestige Tokens**: 100 tokens (e.g., engraved wooden chips) for small-stakes payoffs.  
  5. **Recall Clause Signage**: A placard reading: "If a cycle is detected (A>B, B>C, C>A), reintroduce the last eliminated proposal."  

  ---

  ### **Preference Card Distribution**  
  Guarantee a cyclic social ordering (Condorcet cycle) and the Echo-induced reversal:  
  - **Group 1 (6 delegates)**: Aurora > Boreas > Cygnus > Draco > Echo  
  - **Group 2 (5 delegates)**: Boreas > Cygnus > Aurora > Draco > Echo  
  - **Group 3 (5 delegates)**: Cygnus > Aurora > Boreas > Draco > Echo  

  *Note*: All delegates rank Draco above Echo. Echo is universally least-preferred but will trigger the reversal.  

  ---

  ### **Rules and Roles**  
  - **Roles**: All 16 participants are delegates. The facilitator acts as Committee Chair, enforcing rules and tallying votes.  
  - **Voting Protocol**: Sequential pairwise elimination with recall clause.  
    - Each pairwise vote is decided by majority rule.  
    - Echo appears on ballots but cannot win; if "eliminated," it is set aside.  
    - **Recall Clause**: Triggered if a cycle is detected (three proposals where A>B, B>C, C>A). The last eliminated proposal re-enters the tournament.  
  - **Payoff Scheme**:  
    - **1 token** per vote where a delegate’s ballot matches their private ranking (sincere revelation).  
    - **3 tokens** to all if the committee reaches a grant decision.  
    - Tokens are symbolic (no real-world value) but confer "prestige" (e.g., public acknowledgment).  

  ---

  ### **Timeline (90 Minutes)**  
  #### **0–10 mins: Briefing**  
  - Chair explains the Meridian Committee’s task: Rank Aurora, Boreas, Cygnus, Draco (Echo is ineligible but included on ballots).  
  - Distribute preference cards. Emphasise sincere voting for token rewards.  
  - Outline the protocol: Sequential pairwise elimination, recall clause, and token incentives.  

  #### **10–35 mins: Round 1 (Echo Absent)**  
  - **Focus**: Vote only on Aurora, Boreas, Cygnus, Draco.  
  - **Pairwise Sequence**:  
    1. **Aurora vs. Boreas**: Delegates vote. *Result: Aurora wins 11–5* (Group 1 and 3 prefer Aurora; Group 2 prefers Boreas). Boreas eliminated.  
    2. **Cygnus vs. Draco**: Delegates vote. *Result: Cygnus wins 16–0* (all prefer Cygnus). Draco eliminated.  
    3. **Aurora vs. Cygnus**: Delegates vote. *Result: Cygnus wins 10–6* (Group 2 and 3 prefer Cygnus; Group 1 prefers Aurora). Aurora eliminated.  
    4. **Cycle Detection**:  
       - Chair announces: "Cygnus > Aurora (from Step 3), Aurora > Boreas (Step 1), Boreas > Cygnus (implied by Group 2 and 3 preferences—Boreas > Cygnus in head-to-head would win 11–5). Cycle confirmed!"  
       - **Recall Clause Triggered**: Draco re-enters.  
  - **Outcome**: Committee ranks Aurora above Boreas (from Step 1). Grant withheld due to cycle. Tokens awarded for sincere votes.  

  #### **35–60 mins: Round 2 (Echo Present)**  
  - **Focus**: Vote on all five proposals (Echo ineligible).  
  - **Pairwise Sequence**:  
    1. **Aurora vs. Echo**: Delegates vote. *Result: Aurora wins 16–0* (all prefer Aurora). Echo "eliminated" (set aside).  
    2. **Boreas vs. Draco**: Delegates vote. *Result: Boreas wins 16–0* (all prefer Boreas). Draco eliminated.  
    3. **Aurora vs. Cygnus**: Delegates vote. *Result: Cygnus wins 10–6* (same as Round 1). Aurora eliminated.  
    4. **Boreas vs. Cygnus**: Delegates vote. *Result: Boreas wins 11–5* (Group 1 and 2 prefer Boreas; Group 3 prefers Cygnus). Boreas wins the grant.  
  - **Outcome**: Boreas (winner) is ranked above Aurora (eliminated in Step 3). Tokens awarded.  

  #### **The Reversal**  
  - In Round 1, committee ranks **Aurora > Boreas**.  
  - In Round 2, committee ranks **Boreas > Aurora** (as Boreas wins, Aurora loses).  
  - *Crucially, no delegate alters their Aurora/Boreas preference between rounds*.  

  ---

  ### **Debrief: Mapping to Arrow’s Theorem (60–85 mins)**  
  The Chair connects the lived experience to Arrow’s conditions:  

  1. **Unrestricted Domain (UD)**  
     - Condition: Voting system must handle all possible preference orderings.  
     - Activity: UD upheld—delegates held diverse, conflicting rankings.  

  2. **Pareto Efficiency (PE)**  
     - Condition: If all prefer X > Y, society must rank X > Y.  
     - Activity: PE upheld—e.g., all preferred Aurora > Echo, so Aurora won.  

  3. **Independence of Irrelevant Alternatives (IIA)**  
     - Condition: Society’s ranking of X vs. Y must depend *only* on individual X/Y preferences.  
     - **Violation in Round 2**:  
       - Aurora vs. Boreas preferences were identical between rounds, yet the social ranking reversed (Aurora > Boreas in Round 1, Boreas > Aurora in Round 2).  
       - Why? Echo’s presence altered the tournament path (Echo’s "elimination" changed which proposals Aurora faced), violating IIA. The system was forced to prioritise procedural outcomes over IIA.  

  4. **Non-Dictatorship (ND)**  
     - Condition: No single voter dictates the social ranking.  
     - Activity: ND upheld—no delegate’s card matched the final ranking.  

  #### **Structural Takeaways**  
  - The committee **abandoned IIA in Round 2** to resolve the tournament. Echo (an irrelevant alternative) distorted the Aurora/Boreas outcome, proving IIA is incompatible with UD, PE, and ND in this system.  
  - **What the activity cannot reproduce**:  
    - **Universal proof**: Arrow’s theorem holds for *all* preference profiles and *any* number of alternatives >2. We demonstrated only one profile.  
    - **Full UD with >3 options**: Our cyclic profile was engineered; real-world preferences may not exhibit cycles.  
  - **Facilitator must clarify**: Arrow’s proof shows *no voting system* can satisfy all four conditions simultaneously. The activity’s pairwise method is one example; other systems (e.g., ranked-choice) fail differently.  

  ---

  ### **Predicted Pitfalls and Facilitator Response**  
  - **Pitfall 1**: Delegates may "repair" the reversal by voting strategically (e.g., Group 3 voting insincerely in Round 2 to save Aurora).  
    - **Response**: "As Chair, I remind you that tokens reward *sincere* votes. The Meridian Committee’s rules forbid tactical voting."  
  - **Pitfall 2**: Delegates may reject the recall clause to avoid complexity.  
    - **Response**: "The charter mandates the recall clause when a cycle is detected. We must follow the procedure."  
  - **Do not reveal the reversal prematurely**. If outcomes diverge from predictions, say: "This illustrates how voting systems are vulnerable to strategic behaviour—another limitation formalised in social choice theory."  

  ---

  ### **Closing (85–90 mins)**  
  Distribute tokens, congratulate delegates on navigating a "real-world" impossibility, and note how Arrow’s theorem challenges democratic aggregation. Suggested reading: Arrow’s *Social Choice and Individual Values* (1951).  

  **Final Note**: This exercise distils Arrow’s insight—no perfect voting system exists—into a visceral contradiction. By abandoning IIA to complete the tournament, the committee experiences the theorem’s inevitability.
