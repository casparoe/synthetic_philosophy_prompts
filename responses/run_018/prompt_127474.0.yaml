  We are going to develop a checklist for the strategy-stealing argument. The strategy-stealing argument is used to show that in a symmetric, deterministic, perfect-information game without chance, the second player cannot have a winning strategy. If such a strategy existed, the first player could "steal" it by making an extra move (usually a harmless or neutral one) and then follow the second player's strategy. This leads to a contradiction because the first player would then have two strategies: one for when they are the first player and one for when they are the second player, which would guarantee a win in both cases, which is impossible in a zero-sum game.

  However, the argument requires several preconditions. We will break these down into a checklist.

  ### Strategy-Stealing Audit Checklist

  1. **Symmetric Ruleset**:
     - *Precondition*: The game rules are identical for both players, meaning that the board, moves, and win conditions are symmetric with respect to the two players. The only asymmetry is the turn order.
     - *Evidence*: The rules must explicitly state that the board is symmetric (e.g., a square grid, or a symmetric graph) and that the moves available to each player are the same from symmetric positions. If the rules contain asymmetric elements (like different starting resources or different objectives), then the precondition fails.
     - *Conclusion*: If symmetric, proceed. If not, halt: strategy-stealing may not apply.

  2. **Deterministic and Perfect Information**:
     - *Precondition*: The game has no random elements (dice, shuffling) and all information about the game state is available to both players at all times.
     - *Evidence*: Rules must not mention any random devices or hidden information.
     - *Conclusion*: If met, proceed. Otherwise, halt: strategy-stealing does not apply.

  3. **No Draws or Finite Possibility of Draws**:
     - *Precondition*: The game must either always end in a win for one player or a draw, and the game must be finite (or have a finite number of states so that it must terminate). However, note that if draws are possible, the strategy-stealing argument can still be used to rule out a second-player forced win (because if the second player had a winning strategy, the first player could steal it and force a win, contradicting the possibility of a draw). But if the game can go on forever, then we need to ensure termination (e.g., by a repetition rule or progress requirement).
     - *Evidence*: Rules must specify that the game ends after a finite number of moves (e.g., by depletion of resources, by a board that fills up, or by a rule against repeating positions). Also, the outcome must be either a win for one player or a draw (or a win for the other player). The rules must not allow an infinite game.
     - *Conclusion*: If the game is finite and ends in a win for one player or a draw, proceed. If not, halt.

  4. **Existence of a Neutral Move (or Symmetry in Moves)**:
     - *Precondition*: There must be at least one move that is either:
          a. A pass move (which does not change the state and simply passes the turn), or
          b. A move that is reversible in some sense (so that the first player can make an initial move and then later the second player can effectively "cancel" it by making a symmetric move, leading to a state equivalent to the one after the pass), or
          c. A move that does not harm the player making it and leaves the board in a state that is symmetric to the starting state but with roles reversed.
     - *Evidence*: The rules must either explicitly allow a pass move, or there must be a way to show that any move made by the first player can be mirrored by the second player in such a way that the resulting state is symmetric. Alternatively, if the game has an even number of moves or a structure that allows for pairing, that might work. However, note that sometimes the neutral move is inherent (like in Hex) by the topology but not explicitly given.
     - *Conclusion*: If such a neutral move (or symmetry) exists, then we can proceed to the argument. Otherwise, halt: strategy-stealing may not apply because the first player cannot "steal" without a way to offset the extra move.

  5. **No Irreversible Asymmetries Introduced by the First Move**:
     - *Precondition*: The first move must not create an asymmetry that cannot be reversed by the above neutral move or mirroring. This is often tied to the existence of the neutral move. However, even with a neutral move, if the first move can break the symmetry in a way that the second player cannot recover (for example, by depleting a shared resource that cannot be replenished), then the argument may break.
     - *Evidence*: We must check that the state after the first player moves and the second player passes (or makes the neutral move) is symmetric to the starting state but with the players swapped. Alternatively, if the first player makes a move and then the second player can make a move that mirrors it and restores symmetry, then the condition holds. If the rules have any resource that is consumed and not replenished, or if the move has a unique effect that cannot be mirrored (like in an auction where the first player takes an item that cannot be taken by the second player in the same way), then the condition fails.
     - *Conclusion*: If reversible, then we can conclude that the second player cannot have a winning strategy (and hence, if the game cannot end in a draw, then the first player must have a winning strategy). If not, halt.

  ### Logical Conclusion at Each Branch

  - If all preconditions 1-5 are satisfied, then we can conclude: **The second player cannot have a winning strategy**. 
    - Additionally, if the game is known to be a win for one player or the other (i.e., no draws are possible), then we can conclude that the first player has a winning strategy.
    - If draws are possible, then the conclusion is only that the second player cannot force a win (so the possible outcomes are first-player win or draw).

  ### Application to the Proposals

  #### (A) Symmetric grid-capture game with an explicit pass move

  1. **Symmetric Ruleset**: Assuming the grid is symmetric (like a square grid) and the capture rules are symmetric, then yes.
  2. **Deterministic and Perfect Information**: By description, it is deterministic and perfect information.
  3. **No Draws or Finite Possibility of Draws**: We must check if the game must end in a finite number of moves (e.g., because the grid is finite and pieces are captured until one side wins). Also, does it allow draws? The rules might specify that one player must win, or it might allow draws. Let's assume it does not allow draws and must end with a win for one player.
  4. **Existence of a Neutral Move**: Explicit pass move is allowed. This is a perfect neutral move because it does nothing but pass the turn.
  5. **No Irreversible Asymmetries**: The pass move does nothing, so after the first player moves and the second player passes, the state is the same as if the first player had passed and the second player moved first? Not exactly: if the first player makes a non-pass move and the second player passes, then the state is as if the first player moved and then the second player did nothing. However, note that the pass move is available to both players. The strategy-stealing argument can be run as follows: 
     - Suppose the second player has a winning strategy. Then the first player can, on the first move, pass (which is allowed). Then the first player is effectively now the second player and can use the winning strategy. This leads to the first player winning, which contradicts the assumption that the second player has a winning strategy. 
     - Alternatively, if the first player does not want to pass, they can make a move and then use the second player's strategy. But that requires that the move they made does not harm them. The explicit pass move is always available and harmless, so the first player can choose to pass and become the second player.

  Therefore, in this case, the argument holds. We conclude that the second player cannot have a winning strategy. If the game does not allow draws, then the first player has a winning strategy.

  #### (B) Asymmetric auction-style format where the opening action permanently depletes a shared resource pool.

  1. **Symmetric Ruleset**: This is asymmetric because the opening action depletes a shared resource pool. The first player's move changes the resource pool, and the second player then faces a different state. The rules might be symmetric in the sense that both players have the same actions available from a given state, but the initial move breaks the symmetry irreversibly.
     - *Conclusion*: Halt at step 1. The rules are not symmetric because the starting state for the second player is different than the starting state for the first player after the first move (the resource pool is depleted). Therefore, the strategy-stealing argument does not apply.

