answer: |-
  ### Strategy-Stealing Audit Checklist for Deterministic Perfect-Information Games  
  This checklist operationalizes the strategy-stealing argument into a sequence of verifiable preconditions. Each step must pass for the argument to apply. If any step fails, the procedure halts, and human judgment is required.  

  #### **Checklist**  
  1. **Symmetric Ruleset**  
     - **Precondition**: The game must be symmetric (identical rules, win conditions, and starting positions for both players).  
     - **Evidence**: Rules explicitly define symmetric moves/actions, board layout, and objectives. Asymmetries (e.g., unique player roles) disqualify.  
     - **Conclusion**: If symmetric, proceed. If asymmetric, **halt**—strategy-stealing cannot apply.  

  2. **Deterministic Perfect Information**  
     - **Precondition**: No randomness (e.g., dice, card shuffles) and all game states are fully observable.  
     - **Evidence**: Rules omit stochastic elements and hidden information.  
     - **Conclusion**: If met, proceed. If violated, **halt**—strategy-stealing invalid.  

  3. **Finite Game Length and Termination**  
     - **Precondition**: The game must end in finite moves (no infinite loops).  
     - **Evidence**: Rules enforce termination (e.g., resource depletion, move limits, no-repetition clauses).  
     - **Conclusion**: If finite, proceed. If indefinite, **halt**—outcomes undefined.  

  4. **Existence of a Neutral Move**  
     - **Precondition**: A "pass" or equivalent neutral action must exist that:  
       - (a) Is always legal (unless prohibited by specific constraints),  
       - (b) Leaves the game state unchanged (or symmetrically reversible),  
       - (c) Preserves player turn order symmetry.  
     - **Evidence**: Rules explicitly allow "passing," or a move exists that can be mirrored/canceled without altering strategic parity.  
     - **Conclusion**: If a neutral move exists, proceed. If absent, **halt**—strategic isomorphism breaks.  

  5. **Irreversible Asymmetry Check**  
     - **Precondition**: No opening move permanently disrupts symmetry or depletes shared resources in a way that cannot be mirrored.  
     - **Evidence**: Rules do not allow moves that:  
       - (a) Destroy/consume irreplaceable shared resources,  
       - (b) Create unique positional advantages that cannot be nullified by symmetry.  
     - **Conclusion**: If no irreversible asymmetries, **second player cannot have a winning strategy**. If present, **halt**—first-player advantage possible but unprovable via strategy-stealing.  

  #### **Final Logical Conclusions**  
  - **All steps passed**: Second player cannot have a winning strategy.  
    - *If draws are impossible*: First player has a winning strategy.  
    - *If draws are possible*: First player can at least force a draw (no second-player forced win).  
  - **Any step failed**: Strategy-stealing argument invalid. Human judgment required.  

  ---

  ### **Application to Proposals**  
  #### **Case A: Symmetric Grid-Capture Game with Explicit Pass Move**  
  - **Step 1 (Symmetric Ruleset)**: Passes. Grid and capture rules are identical for both players.  
  - **Step 2 (Deterministic Perfect Information)**: Passes. No randomness/hidden information.  
  - **Step 3 (Finite Game Length)**: Passes. Grid is finite; game ends when all cells are captured.  
  - **Step 4 (Neutral Move)**: Passes. Explicit pass move preserves state and symmetry.  
  - **Step 5 (Irreversible Asymmetry)**: Passes. Pass move nullifies asymmetry; no resource depletion.  
  - **Conclusion**: Second player cannot have a winning strategy. Since no draws are possible (one player must capture majority), **first player has a winning strategy**.  

  #### **Case B: Asymmetric Auction Game with Depleting Shared Resource Pool**  
  - **Step 1 (Symmetric Ruleset)**: **Fails**. Opening move consumes a shared resource (e.g., bidding tokens), permanently altering the pool. Players face asymmetric states after the first move.  
  - **Procedure Halts**: Strategy-stealing argument invalid. Human judgment required—likely a **first-player advantage** due to resource control.  

  #### **Case C: Symmetric Game with Reported First-Mover Bias (Strategy-Stealing Formally Applies)**  
  - **Checklist Outcome**: All steps pass (symmetric, deterministic, finite, neutral move, no irreversible asymmetries). Conclusion: **Second player cannot have a winning strategy**.  
  - **Reported Bias**: Experienced players observe consistent first-player wins despite formal proof.  

  ##### **Why the Procedure Fails to Capture the Bias**  
  1. **Computational Complexity Asymmetry**:  
     - **Issue**: The strategy-stealing proof is non-constructive—it proves existence of a first-player strategy but doesn’t provide it. In practice, the second player’s optimal responses may be exponentially harder to compute (e.g., evaluating complex board states after the first move).  
     - **Consequence**: Humans/engines struggle to execute the second player’s strategy, leading to de facto first-player wins. The procedure ignores computational feasibility.  

  2. **Tempo Effects**:  
     - **Issue**: The neutral move (e.g., pass) is theoretically symmetric but practically disadvantageous. Passing cedes initiative, allowing the first player to set the tempo (e.g., claiming critical positions/resources).  
     - **Consequence**: The second player is forced into reactive play, increasing error rates. The procedure assumes moves are costless but misses tempo as a "soft" resource.  

  3. **Hidden Structural Bias**:  
     - **Issue**: Win conditions may implicitly favor proactive play (e.g., controlling central nodes in a graph). The first player exploits this by forcing the second player into a "defender’s dilemma" (e.g., splitting attention between multiple threats).  
     - **Consequence**: Even with perfect play, the second player achieves draws at best—but humans err under pressure, converting draws into losses. The procedure treats symmetry as binary, overlooking emergent asymmetries.  

  ##### **League Judgment Call**  
  - **Overruling the Checklist**: Despite formal proof, the league must declare a **first-player advantage** due to observed practical bias.  
  - **Reason**: The strategy-stealing argument assumes optimal play under unbounded computation, but competitive play is resource-constrained (time, cognition). Tempo and complexity asymmetries create a measurable bias.  
  - **Action**: Implement mitigations (e.g., komi points, adjusted starting positions) or reject the game for competitive fairness.  

  ---  
  **Key Insight**: Strategy-stealing is a theoretical tool—it rules out second-player forced wins but cannot address human-scale complexities. The checklist’s rigidity necessitates pragmatic overrides in Case C to preserve competitive integrity.
