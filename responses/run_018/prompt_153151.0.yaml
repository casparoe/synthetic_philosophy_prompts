answer: |-
  ## Wu Hua Villanelle

  No stable watcher rests within my mind,  
  Where waking thoughts like sunlit petals whirl,  
  **I am the butterfly transforming.**

  The dream dissolved, yet something left behind –  
  A drifting weightlessness, a wing’s soft furl?  
  **The butterfly is my transformation.**

  Did Zhuangzi sleep? Or did the butterfly find  
  Brief human shape beneath the dreaming’s pearl?  
  **I am the butterfly transforming.**

  No fixed root holds, no essence to unwind,  
  Just constant flow where sense and seeming twirl.  
  **The butterfly is my transformation.**

  The petals drift on water, moved by wind,  
  From bloom to stream, no solid form to hurl.  
  **I am the butterfly transforming.**

  This breath, this thought, the world I seem to bind –  
  All scatter like dry leaves before they curl.  
  **The butterfly is my transformation.**

  No seam between the watcher and the kind,  
  No dreamer safe within perception’s swirl.  
  **I am the butterfly transforming.  
  The butterfly is my transformation.**  
  Only this endless change remains, defined.

  ---

  **Notes on Accuracy & Form:**

  *   **Wu Hua Focus:** Centres entirely on transformation (化 *hua*), the core of the butterfly parable's deeper meaning in Zhuangzi. It avoids the question of "which is real?" (dream or waking) to emphasize that *both* are transient states within the constant flux of existence.
  *   **Dissolving Self:** Lines like "No stable watcher rests within my mind," "No fixed root holds, no essence to unwind," and "No seam between the watcher and the kind" directly address the lack of a persistent, observing self (*wu wo* 无我). The "I" and the butterfly are mutually arising transformations, not stable entities exchanging places.
  *   **Zhuangzi's Imagery:** Uses imagery resonant with the *Zhuangzi* ("sunlit petals whirl," "petals drift on water," "dry leaves," "constant flow") suggesting natural, effortless, continuous change (*ziran* 自然).
  *   **Villanelle Structure:**
      *   19 lines: 5 tercets (ABA rhyme) + 1 quatrain (ABAA rhyme).
      *   Refrain 1 (A1): "I am the butterfly transforming" (Lines 1, 6, 12, 18)
      *   Refrain 2 (B1): "The butterfly is my transformation" (Lines 3, 9, 15, 19)
      *   Rhyme Scheme: ABA ABA ABA ABA ABA ABAA. Rhymes are simple and consistent (mind/find/kind/unwind/wind/defined/bind; whirl/pearl/twirl/hurl/curl/swirl).
  *   **Plain Language:** Uses accessible vocabulary and straightforward syntax while maintaining poetic force. Words like "whirl," "drift," "scatter," "twirl," "flow," "change" convey the transformation theme clearly.
