prompt: |-
  I'm a third-year philosophy student running a discussion section for first-year interdisciplinary seminar students who have never taken social ontology. I need a teaching plan—not the explanation itself—for leading a fifty-minute session on collective intentionality and joint action. The students arrive thinking that "doing something together" just means individual people aligning their private goals, so the opening move needs to make the conceptual problem visible before any technical vocabulary appears. I want the plan structured around dependency: which idea has to be in place before the distinction between a shared we-intention and a bundle of coordinated I-intentions can even make sense, and in what order the pieces should unfold. For the carrying example, I want a single concrete scenario that involves clear role differentiation but no central director, and—crucially—one in which each participant genuinely lacks an individual mental representation of the complete end state, so that if each were operating only with an I-intention the activity would necessarily fail; it should not be the standard "walking together" case. I also need the misconception map: I'm expecting they will conflate collective intentionality with group consciousness, then with strategic cooperation, and possibly with mere behavioral synchronization—tell me exactly where in the sequence each should be intercepted and defused. Include one diagnostic question I can ask at the end that distinguishes whether they've understood the irreducibility claim from whether they've just memorized a definition. Finally, specify what parts of the wider debate—say, joint commitment, plural subjecthood, or the relation to distributive versus collective rationality—should be explicitly named and bracketed at this level with a brief note that they exist but need not be resolved here. The audience is skeptical that philosophy can say anything substantive about "just doing stuff together," so the arc should build the need for the concept rather than assuming it.
reasoning: |-
  We are designing a 50-minute session for first-year students with no background in social ontology. The goal is to introduce the problem of collective intentionality and joint action, starting from the students' misconception that "doing something together" is just individuals aligning private goals. We need to build the concept step by step, making the problem visible before introducing technical terms.

  Key elements:
  1. Dependency: The idea that must be in place first is the failure of reduction to individual intentions. We need a scenario where if each acts only with an I-intention (without a shared goal), the activity fails. This will show that something more is needed.
  2. Concrete scenario: We need a carrying example with role differentiation and no central director. Each participant must lack a complete individual mental representation of the end state. (The standard "walking together" case is avoided.)
  3. Misconceptions to intercept:
     - Conflating collective intentionality with group consciousness (a group mind) → intercept early by emphasizing that we are talking about individual attitudes but of a special kind.
     - Conflating with strategic cooperation (individuals coordinating based on self-interest) → intercept after presenting the scenario.
     - Conflating with mere behavioral synchronization (like a flock of birds) → intercept by showing that joint action requires mutual responsiveness and a shared goal.
  4. Diagnostic question at the end to test understanding of irreducibility (vs. memorization).
  5. Bracketing: Mention but set aside joint commitment (Gilbert), plural subjecthood, and the debate on distributive vs. collective rationality. Note that these are advanced topics and not for this session.

  Overall arc: Build the need for the concept of collective intentionality by showing that standard individual intentions are insufficient for some actions.

  Teaching Plan:

  **Total Time: 50 minutes**

  ### (0-5 min) Introduction and Framing
  - Start with a question: "What does it mean to do something together? For example, when you and a friend carry a heavy sofa up the stairs, what makes that a joint action rather than two individuals just happening to lift at the same time?"
  - Let students give initial thoughts (likely they will say coordination, communication, shared goal). Note: They might say "shared goal" but they may be thinking of it as each having the same individual goal.
  - Frame the session: "Today we'll explore why this is a philosophical puzzle. We'll see that sometimes, just having individuals with aligned private goals isn't enough for genuine joint action."

  ### (5-20 min) Presenting the Problem with a Concrete Scenario
  - **Scenario: Building a Human Pyramid (with a twist)**
    - Imagine three people: A, B, and C. They are building a human pyramid for a performance. The pyramid has three levels: one person at the top (C), one in the middle (B), and one at the base (A). The twist: each person only knows their own role and the immediate role they interact with, but not the whole structure. 
      - A (base) knows they must support the person above them (B) and hold a certain posture, but they don't know that B is supporting C and that C is at the top. They think they are just supporting B for a different purpose (e.g., maybe they think B is going to stand on their shoulders to reach something).
      - B (middle) knows they are being supported by A and that they must support C, but they don't know that A doesn't know about C. They think A knows the whole plan.
      - C (top) knows they are being supported by B and that A is supporting B, but they don't know that A doesn't know about them. They think everyone knows the whole plan.
    - The catch: The pyramid requires all three to hold their positions simultaneously. If any one fails, it collapses. But note: each has a different understanding of the end state. A thinks the goal is to help B reach something, B thinks they are supporting C as part of a pyramid, and C thinks they are forming a pyramid. The overall goal of "building a three-level human pyramid" is not represented in any individual's mind.
  - **Activity fails without shared intention**: If each acts only with their I-intention (A: I intend to support B; B: I intend to support C; C: I intend to stand on B) without any shared understanding that they are together building a pyramid, then at the moment when A realizes that B is not reaching for something but is instead supporting someone else, A might stop because that wasn't their plan. Similarly, if B realizes A doesn't know about C, B might not trust A to hold. The action would fall apart because of the mismatch in understanding.
  - **Make the problem visible**: 
    - Ask: "Why did the pyramid fail? Because each had a different idea of what they were doing. They were coordinating, but not in a way that they were truly doing it together for a common goal. The common goal was not present in each mind in the same way. In fact, the complete goal (a three-level pyramid) wasn't in any of their minds at all."
    - Point: For the pyramid to be built and held, each must not only do their part but also understand that they are together building a pyramid and that the others are doing it for the same reason. Each must have the intention "We are building a pyramid" and not just "I am doing X".

  ### (20-30 min) Introducing the Concept of Collective Intentionality (without jargon first)
  - **The missing piece**: We need a kind of intention that is shared. But note: it's not that they have the same individual intention (like each intending "I want a pyramid to be built") because that might lead to free-riding or miscoordination. Instead, it's an intention that is about what "we" are doing.
  - **Define we-intention (simply)**: A we-intention is when I intend that we do something together, and I believe that you also have the same intention and that we are mutually responsive to each other in doing it.
  - **Contrast with coordinated I-intentions**: In the pyramid case, if each had a we-intention ("We are building a pyramid"), then A would understand that supporting B is part of building the pyramid, and even if they don't know the whole structure, they trust that B and C are also acting for the same shared goal. They would adjust if needed because they are committed to the joint activity.

  ### (30-40 min) Intercepting Misconceptions
  1. **Group consciousness**: "Is this like a group mind? Are we saying there's a collective brain?" → Intercept by saying: No, each individual still has their own mind. The we-intention is in the mind of each individual, but it refers to the group. It's an attitude that one holds as a member of the group. (Use the phrase: "It's in my head, but it's about us.")
  2. **Strategic cooperation**: "But can't they just coordinate by each pursuing their own goal? For example, A supports B because A wants B to be happy, and B supports C because B wants the show to be good, etc." → Intercept by pointing out: In strategic cooperation, each is acting for their own reasons. But in the pyramid, if A only supports B to make B happy, then if A finds out that B is supporting C (which might make B less happy because it's risky), A might stop. Whereas in joint action, the commitment is to the shared goal itself, not to individual benefits. The shared goal is the reason for acting.
  3. **Behavioral synchronization**: "What about birds flying in formation? Isn't that joint action?" → Intercept: In the bird flock, each bird adjusts to the others, but they don't have a shared goal. They are each just following simple rules (like maintain distance). In our pyramid, the participants are not just reacting; they are acting because they have a shared goal. The formation of the flock isn't something the birds intend together; it emerges from individual behaviors.

  ### (40-45 min) Bracketing Advanced Topics
  - Mention briefly: "There are deeper debates we're setting aside for now. For example, some philosophers like Margaret Gilbert talk about 'joint commitment' where we mutually commit to doing something as a body. Others discuss whether we form a 'plural subject'. And there's a debate about whether collective rationality is just the sum of individual rational actions or something different. These are important, but today we're focusing on the basic idea that joint action requires a special kind of shared intention that isn't just a sum of individual intentions."

  ### (45-50 min) Diagnostic Question and Wrap-up
  - **Diagnostic question**: "Imagine two people are painting a house together. They both have the individual intention: 'I want the house to be painted.' They are each painting different sides and never interact. Is this joint action? Why or why not?" 
    - Correct answer: No, because even though they have the same individual goal, they are not acting together. They are not mutually responsive and don't have the intention that we paint the house. Each could finish their side independently. The irreducibility claim is that we need the shared intention that we are doing it together, which involves mutual responsiveness and commitment to the joint activity.
    - If they just say "no, because they are not cooperating" but can't explain that the intentions are not shared in the collective sense, then they haven't understood irreducibility.
  - Wrap-up: Reiterate that collective intentionality is a fundamental aspect of social life and that philosophy can help us understand it. The key takeaway is that doing something together requires more than just aligned private goals; it requires a shared intention.

  ---

  **Notes on the Scenario**: The human pyramid scenario is chosen because:
  - It has clear role differentiation (A, B, C with different functions).
  - No central director (each must act based on their understanding and trust in others).
  - Each lacks a complete representation: A doesn't know about C; B and C have partial knowledge but not about A's lack of knowledge.
  - Without a shared intention, the action fails because of the mismatch in understanding.

  This plan builds the concept step by step, starting from the failure of individual intentions, then introducing the idea of a shared intention, and addressing misconceptions along the way. The diagnostic question tests if they can apply the irreducibility claim to a new case.
answer: |-
  Below is a structured 50-minute teaching plan focused on dependency, misconception interception, and building the need for collective intentionality. The arc starts from students' default view (aligned individual goals) and forces a recognition of its inadequacy **before** introducing technical solutions. The carrying example is designed to meet your specifications.

  ---

  ### **Teaching Plan: Collective Intentionality and Joint Action**  
  **Core Problem:** Students assume joint action = individuals with aligned private goals.  
  **Goal:** Show this reduction fails, creating a need for "we-intentions."  

  ---

  #### **Part 1: Framing the Problem (0–10 min)**  
  **Objective:** Surface the misconception without jargon.  
  - **Opening Question (2 min):**  
    *"Imagine you and a partner are carrying a grand piano up a narrow staircase. What makes this ‘doing it together’ instead of two people just happening to lift at the same time?"*  
    - *Anticipate:* Students will say "communication," "shared goal," or "coordination." Note these on the board.  
    - *Key Move:* Acknowledge but withhold evaluation.  

  - **Introduce the Test Case: "Blindfolded Machinery Assembly" (8 min)**  
    - **Scenario:**  
      > *Three people (A, B, C) assemble a machine none fully understand.  
      > - **A** only knows how to attach gears to *left-side* mounts.  
      > - **B** only knows how to connect wiring to *right-side* ports.  
      > - **C** only knows how to fasten the central chassis.  
      > Each has instructions for their task but no idea what others do. The machine only works if all three act in sync, under time pressure.*  
    - **Critical Constraint:**  
      - No central director (no one gives orders).  
      - Each participant **lacks a full mental representation of the end state** (e.g., A doesn’t know gears power the wiring; C doesn’t know the chassis holds gears).  
    - **Problem-Posing (Crucial):**  
      *"If each is just doing their own task with a private goal (e.g., A: ‘I want to attach gears’), why does this fail? What’s missing?"*  
      - *Force the insight:* Without knowing others' roles or the holistic purpose, actions desynchronize (e.g., A installs gears too early; B’s wiring blocks C). **Alignment ≠ joint success.**  

  ---

  #### **Part 2: Making the Conceptual Gap Visible (10–25 min)**  
  **Objective:** Show that I-intentions (+ coordination) are insufficient.  
  - **Group Activity: Debug the Failure (10 min)**  
    - *Prompt:* "In pairs, diagnose why the machine assembly collapsed. What *specifically* did the trio lack that ‘just doing your part’ couldn’t fix?"  
    - *Steer discussion:* Highlight:  
      - Failure stems from **ignorance of others’ contributions to the shared outcome** (e.g., A doesn’t know B’s wiring affects gear function).  
      - No amount of aligned self-interest ("I want to finish quickly") prevents errors without mutual understanding.  

  - **Introduce We-Intention *as a Solution* (5 min)**  
    - *Contrast:* "Private goal: ‘*I* will attach gears.’ vs. Shared goal: ‘*We* are building a machine.’"  
    - **Define minimally:** "A we-intention is an individual’s commitment to a *collective* goal, where each trusts others to act *for the group’s success*, not just their own task."  
    - *Relate to scenario:* "If A has a we-intention, they adjust timing *because* they know B’s wiring affects the whole—even without seeing B’s work."  

  ---

  #### **Part 3: Intercepting Misconceptions (25–40 min)**  
  **Sequence misconceptions by dependency. Intercept immediately after they arise.**  

  1. **"Group Consciousness" (Intercept at 30 min)**  
     - *When:* After defining we-intention (students may say: "So it’s a hive mind?").  
     - *Defuse:* "No—we-intentions are *individual* mental states (‘*I* intend that *we* do X’). No group brain. What’s shared is the *goal*, not a consciousness."  
       - *Analogy:* "Like teammates agreeing to ‘win together’—each has their own mind, but the target is collective."  

  2. **"Strategic Cooperation" (Intercept at 35 min)**  
     - *When:* After discussing trust in the assembly case (students may say: "Can’t they just cooperate for self-interest?").  
     - *Defuse:* Distinguish:  
       - **Strategic I-intention:** "I’ll help you because I need *my* part done."  
       - **We-intention:** "I’ll help because *our* machine needs it."  
       - *Pivot to scenario:* "If B strategically rushes wiring to finish early, they might block C. We-intentions prevent this by subordinating self-interest to the group."  

  3. **"Behavioral Synchronization" (Intercept at 38 min)**  
     - *When:* After emphasizing coordination (students may cite birds flocking).  
     - *Defuse:* "Synchronization (e.g., marching in step) lacks goal-directed *mutual responsiveness*. In assembly, C must *anticipate* A’s actions based on shared understanding—not just mimic."  

  ---

  #### **Part 4: Consolidation & Assessment (40–50 min)**  
  - **Bracketing Advanced Debates (2 min):**  
    > *"We’re skipping deeper questions like:  
    > - **Joint commitment** (Gilbert): Do we need mutual agreements?  
    > - **Plural subjecthood**: Is a ‘we’ more than individuals?  
    > - **Rationality**: Is collective reason reducible to individual reason?  
    > These matter but aren’t needed to see *why* I-intentions fail."*  

  - **Diagnostic Question (5 min):**  
    *"Two chefs cook a stew. Chef X only stirs the pot (to prevent burning); Chef Y only adds spices (for flavor). Both want a tasty stew. Is this joint action? Why/why not?"*  
    - **Testing irreducibility:**  
      - *Memorized answer:* "No—they lack we-intentions." (Superficial)  
      - *Understood answer:* "No—each acts on private goals without mutual responsiveness (X doesn’t adjust stirring for Y’s spices; Y doesn’t spice for X’s stirring). Success is coincidental, not joint." **(Shows grasp of functional failure)**  

  - **Closing (3 min):**  
    "Philosophy here solves a puzzle: How can individuals act *as a group* without magic? We-intentions aren’t mystical—they’re a tool for explaining why some actions *require* thinking as ‘we’."  

  ---

  ### **Why This Works**  
  - **Dependency Order:**  
    1. Reveal failure of I-intentions (assembly scenario).  
    2. Introduce we-intention as solution.  
    3. Distinguish from adjacent errors (misconceptions).  
  - **Assembly Scenario Advantages:**  
    - No central director (emergent coordination).  
    - Role differentiation + ignorance of holistic goal forces interdependence.  
    - Failure is inevitable under pure I-intentions.  
  - **Builds Skeptic-First:** Starts with intuitive view, exposes cracks, then offers philosophy as a resolver.  

  **Materials Needed:** Whiteboard (for noting misconceptions), printed assembly scenario cards for group work.
