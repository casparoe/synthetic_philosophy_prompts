answer: |-
  ## Opening Remarks: Agency After Desert — An Unchosen Gathering

  Distinguished colleagues, guests, and fellow travelers in questioning: welcome. We gather under the provocative banner, "Agency After Desert." Our task is ambitious: to interrogate the foundations of blame and responsibility in light of neuroscience and law, moving *beyond* the concept of ultimate moral desert. To frame this crucial day, I ask us to engage seriously, perhaps uncomfortably, with a profound philosophical challenge: Galen Strawson’s Basic Argument.

  Strawson contends that true, *ultimate* moral responsibility is impossible. Why? Because to be ultimately responsible for an action, one must be ultimately responsible for the mental nature – the character, values, reasons – from which that action springs. But how did we acquire *that* nature? Through genetics, environment, upbringing, a cascade of prior causes stretching back before our birth. We did not choose the initial conditions that shaped our capacity to choose. We are not the ultimate authors of our own authorship. Any attempt to locate the moment of self-creation merely pushes the question back: what shaped the self that did the creating? An infinite, and ultimately fatal, regress.

  This is not merely an abstract puzzle about individuals in isolation. Look around this room. Consider the very fact of our assembly. *None of us* chose the fundamental cognitive architectures that process the ideas we’ll debate today – the neural hardware bestowed by evolutionary history and genetic lottery. *None of us* ultimately authored the specific disciplinary lenses through which we view the world – whether philosopher, neuroscientist, or legal scholar – shaped as they were by unchosen mentors, institutional pressures, funding landscapes, and historical accidents. *None of us* freely selected the precise social, economic, or intellectual circumstances that made this invitation, this specific seat, this moment of participation, possible. We are all, profoundly, products of a causal chain we did not initiate. Our gathering itself is a testament to forces beyond any single agent's ultimate control.

  To make this tangible, imagine Dr. Anya Sharma, a brilliant cognitive neuroscientist presenting later today on decision-making circuits. Her relentless drive to understand choice? Perhaps ignited by witnessing her father grapple with early-onset dementia when she was twelve – an unchosen trauma that seeded an obsessive need to comprehend agency's fragility. The specific neural pathways she studies? Shaped by mentors she encountered largely by chance, funded by grants responsive to trends she didn’t set. Her very presence here? Contingent on institutional priorities and an invitation committee swayed by factors opaque to her. Does this diminish her brilliance or dedication? Absolutely not. But it illuminates the profound sense in which even her expertise, her *area* of agency, rests on foundations she did not – indeed, *could* not – ultimately lay or choose. The regress of causes shaping her focus is as real and inescapable as the synaptic firings she observes.

  Therefore, the central question animating this workshop is not *whether* we possess libertarian free will or ultimate desert – Strawson’s argument, rigorously applied, suggests we fundamentally cannot. The pressing, practical question is: **How do we proceed?** How do we, neuroscience and law especially, construct robust, fair, and effective practices of *accountability* and *responsibility* that do *not* rely on the fiction of being an ultimate, uncaused cause? How do we assign consequences, protect society, foster growth, and uphold justice when the bedrock concept of "just deserts" crumbles under the weight of causal history and neural determinism?

  This is the demanding terrain we navigate today. Our speakers will explore how neuroscientific insights into compulsion, prediction, and plasticity might reshape legal doctrines of intent and mitigation. They will examine how legal frameworks, stripped of metaphysical blame, might focus on future safety, rehabilitation, and social repair. They will grapple with what "agency" even *means* when ultimate authorship is off the table. Can we conceive of responsibility not as something *owed* for being a prime mover, but as a relational practice, a social technology, navigated by beings constitutively shaped by forces beyond their ultimate control?

  Do not expect easy answers or comforting restorations of the traditional self. Strawson’s gauntlet has been thrown; we cannot pretend to pick it up and put it neatly aside. Our task is more radical: to design, collectively, within the constraints of our shared, unchosen condition.

  So, I invite you not to conclusions, but to collaboration. Let the papers presented, the discussions sparked, and the disagreements aired be our shared attempt – as beings who did not choose to be the thinkers we are, gathered by unchosen forces – to forge practices of responsibility worthy of our complex, caused, and yet profoundly significant lives. Let us explore agency *after* desert.

  The floor is now open to our first presenter. Thank you.

  ---

  **Reflective Note:** This speech extends Strawson's Basic Argument, which primarily targets individual moral responsibility, to encompass collective and institutional agency – the unchosen forces shaping our gathering and disciplinary perspectives. While Strawson focuses on the impossibility of *desert*, the speech implicitly treats institutional/cultural shaping as similarly "regressive" and unchosen, a potential liberty as Strawson's core target is individual metaphysical responsibility. It also adopts a pragmatic stance ("how do we proceed?") that Strawson himself might see as bypassing his stark conclusion, though it explicitly refuses to soften the regress argument's force. A compelling defense of robust agent-causal libertarianism (demonstrating how an agent could be a true causa sui breaking the causal chain) or robust empirical evidence for a specific, widespread form of *effective* neuroplastic self-authorship (where conscious deliberation demonstrably reshapes core decision-making architecture in a way that escapes historical causation and grounds ultimate responsibility) would necessitate significant revision of this framing.
