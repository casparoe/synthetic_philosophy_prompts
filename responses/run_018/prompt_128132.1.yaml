  From complex systems theory (point 3), boundaries and drivers constantly interact. In ecology, a river might be both barrier (negative constraint) and nutrient source (positive cause). Historical explanations likely need this duality. The user's clean separation feels artificially neat.

  The unfalsifiability risk (point 4) troubles me most. If defenders always posit hidden mediators, the theory becomes bulletproof but empty. That's a fatal flaw unless constrained by Occam's razor. Still, insisting on mediators could be productive if it pushes historians to identify concrete mechanisms.

