prompt: |-
  You are a professional historian of ideas with deep familiarity with the Annales school and the philosophy of historical explanation. Before answering, take a moment to brainstorm the conceptual landscape, then think step by step and be rigorously honest about strengths and weaknesses.

  I hold a position I call negative-constraint structuralism about Braudel’s longue durée. The claim is that geographic and climatic slow structures never positively cause or explain specific historical events—revolutions, wars, dynastic collapses, or individual decisions. Instead, they operate purely as a negative boundary space: they render certain outcomes physically or economically impossible and thereby delimit the live menu of options, without ever selecting among them. Any attempt to trace an event-level outcome directly back to a climate shift or geographic feature therefore commits a category error, conflating an enabling boundary with an efficient cause. Institutional, technological, and agent-level mediation is not merely usually present but logically required to bridge any gap between structure and event; in this sense, the longue durée functions as an explanatory null zone for event-history, explaining impossibility but never actual occurrence.

  What would count against this position? I want the arguments, conceptual distinctions, and types of evidence that should genuinely move me, sorted by decisiveness. Specifically, address: (1) concrete historical cases in which climate or geography appear to exert direct, unmediated causal force on events, with no plausible institutional or technological mediator; (2) formal or conceptual arguments showing that the negative-constraint framing collapses into either full determinism or pure irrelevance, leaving it no independent work to do; (3) analogies or results from other domains—such as evolutionary biology, ecology, or complex systems—about whether “boundary conditions” can be cleanly separated from “causal drivers” in explanatory practice; (4) an honest assessment of whether defenders could insulate the view by always postulating hidden mediators, and whether that insulation is a theoretical virtue or a fatal defect that renders the position unfalsifiable; and (5) what a committed defender of negative-constraint structuralism would themselves concede as genuinely damaging rather than merely awkward.

  Please distinguish evidence that would be fatal from evidence that would only be uncomfortable, rank your defeaters accordingly, and conclude with whether the position is well-insulated and whether that insulation undermines its historiographic value. Do not offer bibliographies, reading lists, or citations; reason from the concepts and cases directly.
