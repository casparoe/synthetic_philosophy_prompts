  8. **Claim 8: Culture (e.g., Protestantism) alone can cause capitalism without any material conditions.**
     - **Agree** → Leaf: **"Unnamed Cultural Determinism"** (Awkward: no material conditions needed, and no role for individual meanings; not Weberian.)
     - **Disagree** → Leaf: **"Unnamed Interpretations"** (Neither subjective meanings nor material conditions are necessary, and culture isn't sufficient; incoherent for causation.)

