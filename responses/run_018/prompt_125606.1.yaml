prompt: |-
  I have recently been appointed senior conservation compliance officer at the National Museum of Material Culture, and over the past quarter I have found myself adjudicating the same metaphysical dispute in different guises: when a restoration proposal replaces part of an artifact's substance, does the object remaining in our vaults still count as the same work for insurance valuation, exhibition labeling, and heritage-law documentation? The issue became personally urgent after a disagreement with our legal counsel over a restored ceramic urn, and it was sharpened further in a conversation with a colleague who had audited a seminar on metaphysics and mentioned the classic statue-and-clay distinction—the idea that an artwork and the matter constituting it can occupy the same region yet have different persistence conditions, so that destroying the clay need not destroy the statue and vice versa. I now see that my team has been applying an implicit, unexamined theory of material constitution, and I need it made explicit, reusable, and runnable by staff who have no philosophical training.

  Please construct a decision procedure my team can apply to any restoration proposal in about thirty minutes, grounded in the framework of material constitution but translated into practical steps. The deliverable should be an ordered sequence of questions with what counts as a sufficient answer to each, clear stopping points where the answer is no and the object is no longer the original work, and explicit flags where the decision is one of curatorial values—such as whether artistic authenticity requires causal continuity with the maker's hand—rather than empirical fact. The procedure must distinguish the persistence conditions of the artwork as an intentional object (form, artistic function, historical identity) from those of the material substrate, and it must handle the hard case in which the original material is entirely replaced but the form and function are preserved by an expert restorer using period-appropriate techniques. Apply it to three proposals: first, a ceramic vessel from the 1700s in which thirty percent of the original clay has been replaced with chemically identical but newly fired material; second, a bronze equestrian monument in which the original bronze was melted down due to structural failure and then recast into the identical form using the original molds; and third, a marble relief in which only five percent of the stone was replaced, but the replacement is a modern synthetic composite that alters surface reflectivity in a viewer-noticeable way. For the bronze recasting case in particular, I want to see exactly what the procedure outputs even if it conflicts with my own curatorial intuition that the monument has been lost. Finally, state precisely what the procedure cannot settle—where it will necessarily misfire, which metaphysical distinctions it suppresses to remain usable, and which judgments must still be referred to a senior officer with authority over the collection.
reasoning: |-
  We are creating a decision procedure for determining whether a restored artifact remains the same original work for institutional purposes. The procedure must be based on the metaphysics of material constitution but practical for non-philosophers. We distinguish the artwork (as an intentional object defined by form, function, and historical identity) from its material substrate.

  The core idea is that an artwork and its matter may have different persistence conditions. The artwork can survive replacement of matter if the form and identity are preserved appropriately. However, there are limits.

  We'll design a flowchart-like sequence of questions. The key is to capture the conditions under which the artwork (not just the matter) persists.

  The procedure:

  1. **Question 1: Is the restoration primarily for structural stabilization without altering form or function?**
     - *Purpose*: To filter out minor, non-identity-threatening interventions.
     - *Sufficient answer*: Yes, and the replaced material is less than a threshold (say, 5% by volume) OR the replacement is done in a way that does not disrupt the causal-historical connection to the original creation.
     - *If No*: Proceed to next question.
     - *If Yes*: The object is the original work. (But note: if the replacement material is visually or structurally disruptive, it might not be sufficient. So we must also consider the effect on form and function.)

  However, we must account for both the amount of replacement and the nature of the replacement. We also must consider the causal-historical connection (the "maker's hand" and the object's history).

  Revised plan:

  We break into two main paths: one focusing on the material continuity and the other on the continuity of form and function. But we want to capture the idea that the artwork can persist through material change if the form and identity are preserved appropriately.

  We'll ask:

  **Question 1: Does the restoration involve replacing any original material?**
  - If no, then the object is the original. (But note: even without replacement, other changes might occur. However, since the scenario is about replacement, we focus on that.)
  - If yes, proceed.

  But we want to capture the idea that small amounts of replacement might be acceptable.

  **Question 2: Is the replaced material less than 5% of the total material by volume?**
  - *Why 5%?*: This is a practical threshold. It can be adjusted by policy, but we set a low bar to catch major interventions.
  - *Sufficient answer*: Yes, and the replacement does not alter the form, function, or appearance in a viewer-noticeable way.
    - *If yes*: The object is the original. (But note: if the replacement material is of a different kind and noticeable, then it might fail even if under 5%. So we must check for noticeable alteration.)
    - *If no*: Proceed.

  **Question 3: Does the replacement material and method of restoration preserve the original form and function without any viewer-noticeable alteration?**
  - *Purpose*: Even if more than 5% is replaced, if the form and function are perfectly preserved and the change is undetectable, then the artwork might persist.
  - *Sufficient answer*: Yes, the form and function are preserved and the restoration is undetectable by standard museum observation (by a typical viewer, including experts, under normal conditions).
    - *If yes*: Proceed to Question 4.
    - *If no*: Then the object is not the original work. (Because the form or function is altered, breaking the continuity of the artwork.)

  **Question 4: Is there a continuous causal-historical connection from the original creation to the present object?**
  - *Purpose*: This captures the idea that the artwork must be the product of the artist's original creative act and the subsequent history. If the restoration breaks this chain, then the artwork might not persist even if the form is the same.
  - *Sufficient answer*: The restoration did not involve the complete disassembly and reassembly of the artifact in a way that interrupts the object's historical trajectory. Specifically, the original material (even if only a part) must have been present and continuously constituting the artwork during the restoration process. However, note that in some cases (like the Ship of Theseus) gradual replacement might preserve the object even if the original matter is completely replaced over time. But if the replacement is done all at once and the original matter is entirely removed, then the chain is broken.
    - *If yes*: The object is the original work.
    - *If no*: Then the object is not the original work.

  But note: the classic case of recasting a statue by melting down the original and recasting it in the same mold is a hard case. Our intuition might say that the artwork is lost because the original matter is destroyed and then reassembled in a new object. However, if the form and function are perfectly preserved and the causal chain is maintained by the use of the original mold and the intent of the restoration, then some might argue it survives.

  We must acknowledge that Question 4 is a point of curatorial values. Therefore, we flag it as a value judgment.

  Alternatively, we might reframe to capture the idea that the artwork is a particular instance of form and matter created at a time and place. If the matter is entirely replaced at once, then the artwork ceases to exist and a replica is created.

  Given the complexity, let's design the procedure as follows:

  **Artwork Persistence Decision Procedure**

  **Step 1: Material Replacement Check**
     - *Question*: Has any part of the original material been replaced in the proposed restoration?
       - If no: The object is the original. (Proceed to Step 6 for final checks, but no issue.)
       - If yes: Proceed to Step 2.

  **Step 2: Threshold Check**
     - *Question*: Is the replaced volume less than 5% of the total volume of the artifact? (Note: This threshold can be set by policy; 5% is a suggestion.)
       - If yes: Proceed to Step 3.
       - If no: Proceed to Step 4.

  **Step 3: Noticeability Check for Minor Replacement**
     - *Question*: Is the replacement undetectable by standard museum observation (i.e., under normal lighting and viewing conditions, without magnification, by a typical expert or non-expert viewer) and does it not alter the form or function?
       - If yes: The object remains the original. (Because the change is negligible and does not affect the artwork's identity.) Proceed to Step 6.
       - If no: Proceed to Step 4.

  **Step 4: Form and Function Preservation Check**
     - *Question*: Does the restoration preserve the original form (shape, design, structure) and function (intended use or artistic purpose) without any alteration?
       - If no: The object is not the original. (Because the artwork's defining features are altered.) Stop.
       - If yes: Proceed to Step 5.

  **Step 5: Causal-Historical Continuity Check** [Curatorial Values Flag]
     - *Question*: Did the restoration process maintain a continuous physical presence of at least some original material (even a small portion) throughout the restoration? In other words, was the artifact ever completely disassembled or the original material entirely removed and replaced at once?
       - If yes (i.e., there was continuous presence of some original material): The object remains the original. (The artwork persists because of the unbroken chain of existence.)
       - If no (i.e., the original material was entirely removed at once and replaced): Then we have a value judgment. The procedure by default says the object is not the original work because the causal-historical chain is broken. However, note that this is a point of institutional policy and curatorial values. The procedure flags this as requiring senior officer review. The default output is that the object is not the original, but the senior officer may override based on the institution's values.

  **Step 6: Final Check for Non-Material Factors**
     - *Question*: Are there any other factors (e.g., historical significance of the materials, such as the artist's touch, or the material's provenance) that are considered essential to the artwork's identity by institutional policy?
       - This step is a catch-all for institutional values. It is always answered by the senior officer. If the answer is yes (i.e., such factors are present and compromised), then the object may not be the original even if the procedure up to this point says it is. If no, then the procedure's conclusion stands.

  Now, we apply this procedure to the three cases.

  **Case 1: Ceramic Vessel (1700s) with 30% replaced with chemically identical new material.**
  - Step 1: Yes, replaced.
  - Step 2: 30% > 5% → go to Step 4.
  - Step 4: Does the restoration preserve form and function? Assuming yes (because chemically identical and same technique), so proceed.
  - Step 5: Was the artifact ever without any original material? In this case, 70% original remains, so during restoration, the original was never entirely removed. Therefore, yes, there was continuous presence. → The object is the original.

  **Case 2: Bronze Equestrian Monument - original melted down due to structural failure and recast using original molds.**
  - Step 1: Yes, replaced (entirely).
  - Step 2: 100% replaced → go to Step 4.
  - Step 4: Form and function are preserved (same mold, same form) → proceed.
  - Step 5: Was there continuous presence of original material? No. The original bronze was melted down, so at some point, the original material (as a statue) was destroyed and then a new statue was cast. Therefore, the answer is no. → The procedure outputs that the object is not the original. However, note that Step 5 is a value judgment flag. The default is that it is not the original, but the senior officer may override. The procedure flags it for review.

  **Case 3: Marble Relief with 5% replaced by modern synthetic composite that alters surface reflectivity (viewer-noticeable).**
  - Step 1: Yes.
  - Step 2: 5% (at the threshold) → we go to Step 3 (since 5% is the threshold, we consider it minor but require noticeability check).
  - Step 3: Is the replacement undetectable? No, because the surface reflectivity is altered and noticeable. → Proceed to Step 4.
  - Step 4: Form and function preserved? Form is the same, but function might be affected if the artistic function includes the visual appearance (which it does). The alteration of reflectivity may be considered an alteration of form (visual form) or function (aesthetic function). Therefore, it might fail at Step 4. We must decide: does the change alter the form? Since the surface appearance is part of the form, then if the reflectivity change is noticeable, it alters the form. → Answer: No, the form is not preserved. → Therefore, the object is not the original.

  But note: if the relief's function is solely the depiction of the subject and the subject is still clearly depicted, then perhaps function is preserved. However, the alteration in reflectivity might be considered a change in the artwork's aesthetic properties. Given that the procedure asks about form and function, and form includes visual appearance, we would say the form is altered. Therefore, the answer at Step 4 is no.

  **What the procedure cannot settle:**
  - The procedure suppresses the deep metaphysical debate about whether identity can be preserved through complete material replacement if the form is preserved and there is a causal connection via the original mold or intent. It instead relies on a threshold of continuous material presence (Step 5) as a practical criterion, but flags it as a value judgment.
  - It cannot settle disagreements about what counts as "form" or "function" in ambiguous cases. For example, if the function of an artifact is purely utilitarian and the form is purely structural, then a change in material that doesn't affect structure might be acceptable. But for an artwork, the aesthetic form is critical. The procedure assumes that the team has a clear understanding of the artifact's defining form and function.
  - The noticeability criterion (Step 3) is subjective. The procedure relies on the consensus of experts about what a typical viewer would notice.
  - The 5% threshold is arbitrary and may not be appropriate for all artifacts (e.g., a painting with a 5% replacement in a critical area). The procedure uses it as a practical filter but may need adjustment by policy.
  - The procedure does not address cases of gradual replacement over time (Ship of Theseus). It is designed for a single restoration event. For multiple restorations, the procedure would need to be reapplied each time, and the cumulative effect might not be captured.

  **When to refer to a senior officer:**
  - Whenever Step 5 is reached and the answer is no (complete replacement at once), the procedure flags it for senior review because it is a value judgment.
  - At Step 6, the senior officer must always be consulted if there are non-material factors that are deemed essential.
  - Also, if there is any ambiguity in answering the questions (e.g., what counts as the original form or function), the senior officer should be consulted.

  This procedure provides a structured way to approach the problem, but it requires institutional policy decisions (like the threshold percentage and the definition of noticeability) and senior oversight at critical points.
answer: |-
  Below is a practical, step-by-step decision procedure for your team, grounded in the metaphysics of material constitution but streamlined for operational use. The procedure distinguishes the **artwork** (an intentional object defined by form, function, and historical identity) from its **material substrate** (the physical matter). It prioritizes the artwork's persistence conditions—specifically, whether causal-historical continuity with the original creation is maintained—while flagging value-based judgments for senior review. The entire process can be completed in **under 30 minutes** per proposal.

  ### Core Principles
  - **Artwork Identity**: The artwork persists if its defining form, function, and historical identity are preserved through a continuous causal chain from its creation.
  - **Material Substrate**: The matter may be replaced without destroying the artwork, provided the replacement doesn’t sever the artwork’s causal-historical connection.
  - **Stopping Points**: The procedure stops early (declaring the object **not the original work**) if form/function are altered, causal continuity is broken, or institutional values are violated.
  - **Curatorial Flags**: Explicitly marks steps requiring value judgments (e.g., "causal continuity" thresholds).

  ---

  ### Decision Procedure: Artwork Persistence Assessment
  **Instructions**: Answer questions in order. Stop if any answer meets a stopping condition. Document answers for audit purposes.  
  **Key**:  
  - ✅ = Sufficient answer to proceed.  
  - ⛔ = Stopping point (object is **not the original**).  
  - ⚠️ = Curatorial values judgment (refer to senior officer).

  1. **Material Replacement Check**  
     *Question*: Does the restoration replace any of the artifact's original material?  
     - ✅ **No**: Proceed to Question 3.  
     - ✅ **Yes**: Proceed to Question 2.  

  2. **Material Extent Check**  
     *Question*: Is the replaced volume **≤10%** of the artifact's total material? (Adjustable by policy; 10% is a conservative threshold for negligible impact.)  
     - ✅ **Yes**: Proceed to Question 3.  
     - ✅ **No**: Proceed to Question 4.  

  3. **Noticeability Check**  
     *Question*: Is the replacement **undetectable** to a typical viewer (unaided eye, normal lighting) and does it **not alter form or function**?  
     - ✅ **Yes**: Object remains the original. Proceed to Question 7 for final review.  
     - ⛔ **No**: Object is **not the original**. Stop.  
     *Rationale*: Minor replacements must not affect perceptible form/function to preserve identity.

  4. **Form and Function Preservation Check**  
     *Question*: Does the restoration **exactly replicate** the original form (shape, structure, design) and artistic function (intended purpose, e.g., aesthetic, cultural, or utilitarian role)?  
     - ✅ **Yes**: Proceed to Question 5.  
     - ⛔ **No**: Object is **not the original**. Stop.  
     *Rationale*: Artworks are intentional objects; altered form/function breaks identity.

  5. **Causal-Historical Continuity Check**  
     *⚠️ Curatorial Values Flag*  
     *Question*: Was the restoration process **continuous** with the artifact's history? Specifically:  
     - (a) Was **at least some original material** retained and integrated during restoration?  
     - (b) If all material was replaced, was it done **gradually** (e.g., over years) and **without total disassembly**?  
     - ✅ **Yes to (a) or (b)**: Proceed to Question 6.  
     - ✅ **No (all material replaced at once)**: Proceed to Question 6 but flag for senior review.  
     *Rationale*: Artworks require unbroken causal connection to the creator's intent. Total replacement at once may break this chain (value judgment).

  6. **Material Provenance Check**  
     *Question*: Does institutional policy treat the **original material** as essential to the artwork's identity (e.g., "artist's hand" authenticity, irreplaceable historical matter)?  
     - ✅ **No**: Object remains the original. Proceed to Question 7.  
     - ⚠️ **Yes**: Refer to senior officer. Stop.  
     *Rationale*: Some artifacts (e.g., relics) derive identity from material history; this is policy-dependent.

  7. **Holistic Review**  
     *Question*: Are there unresolved ambiguities in form, function, or historical significance?  
     - ✅ **No**: Object is the original.  
     - ⚠️ **Yes**: Refer to senior officer.  

  ---

  ### Application to Cases
  **Case 1: Ceramic Vessel (1700s, 30% original clay replaced)**  
  - Q1: Yes (replacement occurred).  
  - Q2: No (>10% replaced).  
  - Q4: Yes (form/function preserved; new clay identical).  
  - Q5: Yes (70% original material retained → continuous).  
  - Q6: No (ceramics not typically material-dependent).  
  - **Output**: Original work.  

  **Case 2: Bronze Equestrian Monument (original melted and recast in original molds)**  
  - Q1: Yes.  
  - Q2: No (100% replaced).  
  - Q4: Yes (form/function identical).  
  - Q5: No (all material replaced at once → ⚠️ flag for senior review).  
  - Q6: Policy-dependent. Bronze monuments often tied to material history (e.g., original casting).  
  - **Procedure Output**: ⚠️ Refer to senior officer. Default output is **not the original** due to broken causal continuity (total replacement at once), but senior officer may override based on values (e.g., if original molds and intent are prioritized).  
    *Your intuition (monument lost) aligns with the default output, but policy may allow an exception.*  

  **Case 3: Marble Relief (5% replaced with modern composite, alters reflectivity)**  
  - Q1: Yes.  
  - Q2: Yes (≤10% replaced).  
  - Q3: No (reflectivity altered → viewer-noticeable).  
  - **Output**: ⛔ **Not the original** (form altered).  

  ---

  ### Limitations and Boundaries
  1. **What the Procedure Cannot Settle**:  
     - **Gradual vs. Instant Replacement**: The Ship of Theseus paradox (e.g., 100% replacement over decades) is oversimplified. The procedure assumes a single restoration event; gradual replacement requires iterative application.  
     - **Ambiguous Form/Function**: Subjective judgments (e.g., "Is surface reflectivity part of form?") are resolved at Q4 via expert consensus but may need senior input.  
     - **Non-Physical Attributes**: Spiritual, cultural, or symbolic significance (e.g., sacred relics) are deferred to Q6/Q7.  
     - **Artist Intent vs. Material**: Conflicts between preserving "the maker’s hand" (material) and public display (form) are flagged at Q5/Q6.  

  2. **Suppressed Metaphysical Distinctions**:  
     - **Temporal Parts vs. Enduring Objects**: The procedure treats artifacts as enduring wholes, ignoring perdurantist theories (where objects are sequences of temporal parts).  
     - **Co-location Complexity**: The "statue and clay" distinction is reduced to causal continuity (Q5) and material policy (Q6).  
     - **Abstract vs. Concrete Objects**: Artworks are treated as concrete intentional objects, not abstract types (e.g., a musical score).  

  3. **When to Refer to Senior Officer**:  
     - Q5 (total replacement at once) or Q6 (material deemed essential).  
     - Q7 (ambiguous historical significance).  
     - Any step where consensus is unattainable or policy is undefined.  

  ### Final Deliverable  
  This procedure is **explicit** (clear questions), **reusable** (applicable to any artifact), and **runnable** (requires no philosophy training). Distribute it as a flowchart with team training on:  
  - Defining "form/function" for different artifact types.  
  - Setting institution-specific thresholds (e.g., 10% at Q2).  
  - Documenting rationales for audits.  
  Senior officers retain authority on ⚠️ flagged judgments to align with institutional values.
