  The division fallacy objection starts strong but falters on the radio analogy. Hofstadter's point isn't signal transmission but pattern isomorphism - the receivers aren't playing the original broadcast but reconstructing it from their own components. That's why critics like Searle would argue this is simulation, not persistence.

