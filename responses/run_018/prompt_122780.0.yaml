prompt: |-
  Hi — I'm one of three people writing the text for a small permanent gallery on the history of medicine at a regional science museum. My background is exhibit design, not history, and our de facto historian is a board member who mostly communicates by writing sigh in the margins of my drafts. We've got roughly forty wall panels, a twelve-foot timeline, and an audio-guide script to get done before we open in eight months, so this is a call I'm making two or three times a week, not once. Panels are about ninety words, no footnotes, read mostly by school groups and occasionally quoted by the local paper; the director signs everything off, and anything that looks like picking a fight goes to our lay advisory board. I get maybe fifteen minutes per panel and I can't run to the historian everytime.

  What I want is an actual procedure: the questions in order, what counts as an adequate answer to each, where it stops with a this needs a rewrite, where it stops with a this is a values call, send it upstairs, and where it says leave it alone because the honest version costs more than it buys. I've read a little about the whig interpretation of history — Butterfield's 1931 book, and the general complaint that telling the past as a march toward us flatters the present and falsifies the past — and it's easy to nod at in the abstract and weirdly hard to catch in my own sentences, so I need it operationalized into something I can run on a draft. A few things I want the procedure to handle, and please tell me which of my home-made distinctions are real and which are junk: the martyr frame, where someone was right, was laughed at, and died unappreciated, which I suspect is just whig history with a victim in it; the they almost got it habit, describing past actors as groping toward our answer; my own favourite move, the myth-busting panel, no, people in the middle ages didn't think the earth was flat, which I'm now worried is itself a progress story in which we're the enlightened ones and the past is a crowd of rubes; the timeline, which is nothing but milestones and might be the most whiggish object in the room; and panels where what was progress for one group was straightforwardly loss for another. I've been using a rough test I call the swap test: if the alternative that actually lost had won instead, and my panel still reads basically the same with the names changed, then I haven't written history, I've written a just-so story. Is that the right test, is there a better one, and what should I do when a true correction would eat forty of my ninety words and lose a ten-year-old?

  Then run the finished procedure on three things. First, my draft panel on the doctor in an 1840s Vienna maternity ward who made the staff wash their hands, was ignored, and ended up in an asylum: I want it to be moving but I think it's currently the martyr frame, so tell me what it should say instead. Second, the twelve-foot timeline: should it exist at all, and if it does, what does a non-whig timeline look like in chunks that short, given I can't run a second rail of roads not taken the whole way without loosing the school groups entirely. Third, the one I'll like least: the flat-earth myth-busting panel. If your procedure says it's smug in the same way the whig panels are smug, say so plainly and tell me what to do with it, because it's the panel I'm proudest of. And there's a fourth one I want flagged rather than solved — a panel on a local surgeon who pioneered a technique in the 1930s and also operated on people without asking them — where I want the procedure to say out loud that this stopped being a question it can answer.
reasoning: |-
  Okay, let me tackle this exhibit designer's problem. They're working on a medical history gallery with tight constraints: 40 wall panels at 90 words each, a 12-foot timeline, and audio scripts, all due in 8 months. Their main challenge is avoiding Whig history pitfalls while balancing accuracy with accessibility for school groups. 

  First, I need to understand their core request: a practical procedure to catch Whiggish tendencies in drafts. They've identified specific issues like martyr narratives ("doctor ignored and died unappreciated"), teleology ("they almost got it"), and myth-busting that might smugly imply present superiority. Their swap test (if alternative outcomes wouldn't change the narrative, it's a just-so story) seems solid but needs refining.

  For the procedure design, I'm considering a 3-step checklist:
  1. Spotting red flags in phrasing (e.g., "despite," "finally," "surprisingly")
  2. Applying corrective tests like the swap test and a new "then-now" test
  3. Deciding action thresholds: rewrite, elevate to advisory board, or accept as "good enough"

  Their three examples need concrete solutions:
  - The Vienna handwashing story should shift from martyrdom to systemic failure
  - The timeline could be salvaged with thematic clusters instead of "firsts"
  - The flat-earth panel might work if reframed as historian error rather than past ignorance

  The surgeon consent issue clearly needs flagging as beyond the procedure's scope - it's an ethical call for the board.

  Throughout, I'm weighing their constraints: 15 minutes/panel, no footnotes, 10-year-old comprehension level. The solution must respect that sometimes imperfect clarity beats perfect nuance when words are scarce. The key is making Whig detection operational without paralyzing the writer.
answer: |-
  Here's a battle-tested procedure designed for your constraints, operationalizing Butterfield and tackling your specific concerns. It's a 4-step checklist per panel/timeline entry, taking <15 minutes:

  **The Anti-Whig Panel Procedure**

  1.  **Phrase Scan (2 mins):** Skim for these *Whiggish Red Flags*:
      *   "Despite..." (implying past was stupid/backward)
      *   "Finally..." / "At last..." (implying inevitable progress to *us*)
      *   "Surprisingly..." / "Unbelievably..." (judging past by present standards)
      *   "Realized..." / "Discovered..." (implying past actors were groping towards *our* truth)
      *   "Pioneered..." / "First..." (without immediate context of *why* it was significant *then* or alternatives)
      *   "Myth:" / "Busted:" (Check context for smugness)
      *   Martyr Cues: "Ignored," "Laughed at," "Died unrecognized," "Tragically..."
      *   "Progress" (Unqualified - *always* a red flag)

  2.  **Core Questions (8 mins):**
      *   **Q1: Motive/Context:** What specific *contemporary problem* were they trying to solve, using the *knowledge and tools they actually had*? (Not "groping towards germ theory"). **Adequate Answer:** States a concrete 1840s/Vienna problem (e.g., "combat terrifyingly high rates of fatal childbed fever overwhelming the ward").
      *   **Q2: Alternatives:** What other plausible explanations/solutions were *seriously considered at the time*? (Even if briefly mentioned). **Adequate Answer:** Names 1-2 (e.g., "miasma (bad air) theory," "overcrowding," "humoral imbalance"). **Swap Test Trigger:** If changing the "winner" (e.g., miasma was right) makes your panel nonsense, you're being Whiggish.
      *   **Q3: Impact THEN:** What *immediate consequence* did this have? Who benefited/lost *in the short term*? **Adequate Answer:** States concrete, local, contemporary effect (e.g., "reduced deaths in *his* clinic," "increased workload for nurses," "confusion as theory conflicted with established beliefs").
      *   **Q4: Why "Milestone"?** Why is *this* on the wall/timeline *now*? (Be honest). **Adequate Answer:** "It connects to a modern concern (hygiene/evidence)," "It shows a recurring challenge (resistance to change)," "It highlights local history," OR "It's visually compelling." **Action:** If the *only* answer is "Because it led directly to us being right," **REWRITE**.

  3.  **Action Threshold (3 mins):**
      *   **REWRITE:** Core Questions Q1-Q3 lack adequate answers; heavy Red Flags; Swap Test fails; Martyr Frame dominant.
      *   **SEND UPSTAIRS (Values Call):** Significant harm caused (e.g., non-consensual surgery); Depiction of loss requires nuanced ethical framing beyond 90 words; Disagreement on the "Why Milestone?" (Q4) pits historical significance against modern ethics.
      *   **LEAVE IT (Cost > Benefit):** Minor Whiggish phrasing remains after edits, but removal sacrifices crucial clarity for a 10-yr-old; Adequate answers to Q1-Q3 exist; "Why Milestone?" is honest and valid (e.g., local connection, visual hook); *True* correction would consume >50% of word count without adding proportional understanding. **(Accept "Good Enough for Context")**
      *   **FLAG FOR ADVISORY:** The "Send Upstairs" issues.

  4.  **Final Gut Check (1 min):** Does this panel/timeline entry make the past feel *alive* with its own concerns and logic, or is it just a stepping stone *to us*?

  **Your Distinctions:**
  *   **Martyr Frame = Junk:** Exactly right. It's Whig history + victim narrative. Ignores context, alternatives, and complex reasons for rejection.
  *   **"They Almost Got It" = Junk:** Pure teleology. Assumes past actors shared our goals and were just dimmer versions of us.
  *   **Myth-Busting = Potentially Smug:** It *can* be Whiggish ("We're so smart, we know they weren't *that* dumb"). **Salvageable** if reframed as "correcting a *modern* misconception about the past" or showing *how* the myth *arose* (often later!).
  *   **Timeline = Inherently Whiggish:** True, but manageable. See below.
  *   **Progress for One, Loss for Another = Real & Crucial:** This must be acknowledged.

  **The Swap Test:** **It's excellent.** Keep using it. It directly reveals teleological thinking. If it fails, force yourself to articulate the *contemporary* stakes and alternatives in Q1 & Q2.

  **Applying the Procedure:**

  1.  **The Vienna Handwashing Doctor (Semmelweis):**
      *   **Current Draft (Likely Martyr):** "Ignaz Semmelweis discovered handwashing prevented childbed fever in 1847 Vienna. Tragically, his colleagues rejected his ideas. Mocked and ostracized, he died in an asylum. His lifesaving insight was only accepted years later."
      *   **Phrase Scan:** "Discovered," "Tragically," "rejected," "Mocked," "ostracized," "died in an asylum," "lifesaving insight," "only accepted years later" = **MARTYR FRAME ALERT. REWRITE.**
      *   **Revised Using Procedure (Focus on Q1, Q2, Q3):** "In 1840s Vienna, Dr. Ignaz Semmelweis grappled with shockingly high death rates in his maternity ward. Observing doctors moving from autopsies to deliveries, he suspected unseen 'cadaverous particles' caused childbed fever. He ordered strict chlorine handwashing. Deaths plummeted *in his ward*. However, his theory clashed fiercely with dominant miasma (bad air) beliefs and offended colleagues' professional pride. Resistance was immediate and harsh. While his specific solution wasn't widely adopted for decades, his brutal struggle highlighted medicine's slow, often painful, journey toward evidence-based practice." *(Focuses on *his* problem, *his* solution based on *his* observation, the *contemporary* alternative theory (miasma), the *immediate* consequence (success in HIS ward, professional conflict), and a nuanced "Why Milestone?" about struggle, not martyrdom)*.

  2.  **The 12-Foot Timeline:**
      *   **Should it exist?** Yes. It's expected and provides structure.
      *   **Non-Whig Approach (Chunks):**
          *   **Thematic Clusters:** Don't just list "discoveries." Group entries under *questions/problems*: "Combating Infection: 1847 Semmelweis observes handwashing; 1860s Pasteur develops germ theory; 1928 Fleming notes penicillin mold." "Understanding the Heart: 1628 Harvey describes circulation; 1903 ECG invented; 1953 First open-heart surgery." This frames them as attempts to solve persistent issues, not inevitable steps.
          *   **Include Contextual Events:** Weave in social/political/tech events: "1848 Revolutions sweep Europe (Semmelweis's era)"; "1914-1918 WWI drives need for battlefield surgery/antibiotics"; "1948 NHS founded (UK healthcare system)".
          *   **"Costs" Entries:** Where possible, note downsides: "c. 1895 X-Rays discovered -> widespread use without understanding radiation risks"; "1950s-60s Thalidomide prescribed for morning sickness -> severe birth defects discovered."
          *   **Avoid "Firsts" Unless Crucial:** If you use "First heart transplant (1967)", add context: "Patient survived 18 days; technique refined over decades."
          *   **Visual Cues:** Use color, icons, or subtle background textures to indicate themes/problems, not just chronology. *Goal:* Show history as branching paths tackling recurring challenges, not a straight line to now.

  3.  **The Flat-Earth Myth-Busting Panel:**
      *   **The Smugness Risk:** Yes, it's high. "Look how stupid people THOUGHT they were, but actually, we're smart enough to know they weren't *that* stupid!" is still Whiggish self-congratulation.
      *   **Procedure Application:**
          *   **Q1:** What problem does this address? *Modern* misconception, not a *past* belief. **Reframe Focus:** Make the myth *itself* the subject, not the past belief.
          *   **Revised Approach:** "**The Myth of the Flat Earth:** Many people today believe medieval Europeans thought the Earth was flat. This myth largely stems from 19th-century writers misrepresenting the past to make their own time seem enlightened. Educated Europeans since ancient Greece knew the Earth was spherical! Sailors navigated by the stars using this knowledge. So why does this myth persist? It often serves as a simple story of past ignorance versus modern reason – a story that can distort history's true complexity." *(Focuses on the *origin and purpose of the myth itself*, acknowledges actual past knowledge without superiority, answers "Why Milestone?" by addressing a common misconception visitors might hold)*. **LEAVE IT** if framed this way.

  4.  **The 1930s Local Surgeon (Non-Consensual Surgery):**
      *   **Procedure Flag:** This immediately hits **SEND UPSTAIRS (Values Call)**.
      *   **Why:** Q1 (His problem? Advancing technique, maybe prestige) and Q3 (Impact? Harm to patients, advancement of technique) create an irreconcilable conflict in 90 words. The ethical dimension overshadows the "pioneering" aspect. Explaining informed consent norms *then vs. now* and the profound harm *while* giving his "achievement" its due context is impossible fairly within the limit. The "Why Milestone?" (Q4) is ethically fraught. **Flag it.** The advisory board *must* decide the ethical weighting and framing. The procedure identifies it's beyond its scope.

  **Key Takeaway:** Your job isn't to write perfect academic history in 90 words. It's to avoid the *worst, most misleading* Whiggish traps while creating engaging, broadly accurate narratives for your audience. This procedure prioritizes catching the big distortions (martyrdom, teleology, presentism) and forces context/alternatives into view. Use the thresholds pragmatically – sometimes "less Whiggish" is the victory. Good luck!
