prompt: |-
  hey so I'm advising a tiny grant—maybe 3 people for 2 years—on Goodhart's law and spec gaming, but specifically in normative/instituional design rather than ML. The twist is that the target metric is always some epistemic or deliberative virtue like reflective equilibrium or justified consensus and the corruptible proxy is something like voter turnout or speed of agreement. Which open conceptual questions in this space actually matter most and in what order? I want reasoning, not a bibliography: for each, why it's upstream of the others, how tractible it is for philosophers or political theorists without running experiments, and what kind of argument or hypothetical case over the next couple years would change your ranking. Please answer in American English, not British spelling. (Sorry if there's a typo—writing fast on my phone.)
