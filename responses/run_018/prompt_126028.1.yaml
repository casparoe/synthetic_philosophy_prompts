prompt: |-
  hey so i'm consulting for this disaster-relief NGO that makes icon-only warning signs for camps where translators are scarce and literacy is all over the place. i got interesed in otto neurath's ISOTYPE idea — basically he wanted picture symbols to act like protocol sentences, physically checkable, no hidden metaphysics, intersubjective in the same way for anyone who can point at the hazard. but obviously you can't just drop 1920s philosophy into a tent in a flood zone. can you turn his picture-language principles into an actual decision checklist my field team can run on a proposed sign? i need it in order: first check physical grounding (can the user match the symbol to the actual danger without language?), then check for what i'm calling framing residue — cultural or contextual baggage that makes the same shape mean something different here — then check for indexical drift, where placing the icon near a kitchen vs a doorway changes its reference even though the image hasn't changed. flag exactly where the checklist has to stop being procedural and hand over to a human value call (like, how much ambiguity is okay when the risk is death vs property damage?). then run the checklist on two proposals: a flame symbol marking a fire exit, and a skull-over-water-drop marking a contaminated well. one should come back "print with conditions" and the other should hit either a hard no or at least an unsettled judgment call that the procedure can't resolve. please don't give me a bibliography or cite specific editions — i don't have web access and i don't need a reading list. stick to the basic neurath stuff but feel free to invent that framing-residue idea if it helps bridge the gap. also, just so you know, i keep misspelling ISOTYPE as ISOTPE in my notes, but don't worry about that unless it comes up naturally.
reasoning: |-
  We are creating a decision checklist for disaster-relief NGO icon-only warning signs, based on Otto Neurath's ISOTYPE principles. The checklist must have three main parts in order:

  1. Physical Grounding: Can the user match the symbol to the actual danger without language?
  2. Framing Residue: Are there cultural or contextual associations that might change the meaning?
  3. Indexical Drift: Does the placement of the icon (e.g., near a kitchen vs. doorway) change its reference?

  Additionally, we must flag where the checklist stops being procedural and requires a human value call (e.g., acceptable ambiguity level based on risk severity).

  Then, we run the checklist on two proposals:

  Proposal A: A flame symbol marking a fire exit.
  Proposal B: A skull-over-water-drop marking a contaminated well.

  We expect one to be "print with conditions" and the other to be a hard no or unsettled.

  ---

  **Decision Checklist for Disaster Relief Icons**

  **Step 1: Physical Grounding Check**
  *   **Question:** Can the intended user, without reading any text, look at the symbol and then look at the actual hazard or feature in the environment and recognize the match?
  *   **Procedure:** 
      *   Show the symbol to local field testers (who are not literate in any major language) without explanation.
      *   Take them to the actual hazard/feature (or a simulation) and ask them to point to what the symbol represents.
      *   **Pass:** At least 85% of testers correctly identify the hazard/feature in the environment.
      *   **Fail:** Testers cannot consistently match the symbol to the hazard/feature.
  *   **Flag for Human Judgment:** If the pass rate is between 70-85%, a human must judge if the risk level warrants acceptance. Below 70% fails.

  **Step 2: Framing Residue Check**
  *   **Question:** Does the symbol carry unintended cultural, religious, or contextual meanings that could override or distort the intended meaning in this specific camp context?
  *   **Procedure:**
      *   Show the symbol to diverse local informants (different ages, genders, ethnicities present in the camp) and ask: "What does this make you think of? What else could it mean?"
      *   Review responses for common alternative interpretations that conflict with the intended meaning.
      *   **Pass:** No significant conflicting alternative meanings are found. Any alternative meanings are irrelevant to the context (e.g., a flame symbol might remind someone of a cooking fire, but that doesn't conflict with "fire danger").
      *   **Fail:** A significant portion of informants (over 20%) give an alternative meaning that conflicts with the intended meaning (e.g., a flame symbol meaning "warmth" or "cooking" instead of "danger").
  *   **Flag for Human Judgment:** If conflicting meanings exist but are held by a minority (10-20%), a human must judge if the risk of confusion is acceptable given the hazard severity.

  **Step 3: Indexical Drift Check**
  *   **Question:** Does the placement of the symbol (its location relative to objects or areas) change its perceived meaning in a way that undermines its core function?
  *   **Procedure:**
      *   Place the symbol in two different relevant contexts (e.g., near a kitchen, near an exit, near a water source, on a door) to the same group of testers used in Step 1.
      *   Ask: "What does this symbol mean *here*?" for each location.
      *   **Pass:** The core meaning (hazard or feature) remains consistent regardless of placement. Minor shifts in interpretation (e.g., "fire near exit" vs. "this is the exit for fire") are acceptable if the hazard/feature is still correctly identified.
      *   **Fail:** Placement fundamentally changes the perceived meaning (e.g., flame symbol near a kitchen is seen as "cooking area", near an exit is seen as "fire exit" – but the *danger* aspect is lost in one context).
  *   **Flag for Human Judgment:** If the core meaning shifts in a way that introduces ambiguity (but not inversion) in one context, a human must judge if the ambiguity creates unacceptable risk.

  **Final Output Options:**
  *   **PASS (Print):** Passes all 3 checks clearly.
  *   **PRINT WITH CONDITIONS:** Passes Step 1, but has minor issues in Step 2 or 3 flagged for human judgment and the judgment is to accept with modifications (e.g., add a universal prohibition slash if not present) or specific placement rules.
  *   **FAIL (Do Not Print):** Fails Step 1, or fails Step 2 or 3 with no acceptable mitigation.
  *   **UNRESOLVED:** Requires further field testing or cultural consultation beyond the checklist scope.

  ---

  **Running the Checklist on Proposal A: Flame Symbol for Fire Exit**

  *   **Step 1: Physical Grounding Check**
      *   *Test:* Show flame symbol. Take tester to actual fire exit. Ask what it represents.
      *   *Result:* Likely high pass rate. Fire is universally recognized as a physical phenomenon. The exit part is contextualized by the arrow (if present) or the door. The danger aspect of fire is primary. **PASS**.
  *   **Step 2: Framing Residue Check**
      *   *Test:* Ask what flame symbol makes people think of.
      *   *Result:* Common associations: cooking fire, warmth, light, danger. Danger is the key association for a warning context. Cooking fire might be an alternative, but in the context of an exit sign (likely near a door, not a stove), danger should prevail. **PASS** (with minor note: ensure it's not placed near actual cooking areas to avoid confusion).
  *   **Step 3: Indexical Drift Check**
      *   *Test:* Place symbol near kitchen vs. near exit door.
      *   *Result:* Near kitchen: Might be interpreted as "cooking area" or "hot surface". Near exit: Likely interpreted as "fire exit" or "exit in case of fire". The danger aspect ("fire") is consistent. The *action* (exit) is clear only in the exit context. **Flag for Human Judgment:** The meaning shifts from "hazard" (in kitchen) to "safe path" (at exit). Is this drift acceptable? Human must decide: For a fire *exit* sign, the primary function is to mark the safe path *during a fire*. The flame symbol near the exit is correctly interpreted as marking the exit for fire. The unintended meaning near the kitchen is less critical (it's not a hazard sign *for* the kitchen). Given the low risk of the drift (misinterpreting a safe exit as a hazard is less dangerous than the reverse) and the universal recognition of fire, the judgment call is **ACCEPTABLE WITH CONDITION**: Only place this sign at exits. Never use it near kitchens or as a general fire hazard warning (use a different symbol, like flame+prohibition slash, for that). This becomes **PRINT WITH CONDITIONS** (specific placement rule).

  **Proposal A Verdict: PRINT WITH CONDITIONS** (Must only be placed at exit doors/locations).

  ---

  **Running the Checklist on Proposal B: Skull-Over-Water-Drop for Contaminated Well**

  *   **Step 1: Physical Grounding Check**
      *   *Test:* Show skull-over-water-drop symbol. Take tester to contaminated well (or similar water source). Ask what it represents.
      *   *Result:** Likely moderate pass rate at best. The skull is a strong danger symbol, but the water drop might not be universally associated with *well water*. Testers might interpret it as "death by water" (drowning), "poison water", "dangerous liquid", or something else entirely. The link to *this specific well* being contaminated might not be made. **Flag for Human Judgment:** Pass rate might be borderline (e.g., 60-75%). Human must judge: Is "dangerous water" specific enough? The risk is death (cholera, etc.), so ambiguity is critical. Likely **FAIL** due to lack of specificity and potential low match rate.
  *   **Step 2: Framing Residue Check**
      *   *Test:* Ask what skull-over-water-drop makes people think of.
      *   *Result:** High risk of conflicting meanings. Skull: death, danger, poison, pirates (in some cultures), ancestral spirits (in some cultures). Water drop: water, rain, purity (in some contexts), thirst. Combined: Poison? Danger of drowning? Cursed water? Toxic spill? Medicine (skull+flask symbol in some contexts)? **FAIL:** Significant risk (likely >20%) of conflicting interpretations, some of which may not convey the critical "DO NOT DRINK" message. The pirate association or ancestral spirit association could be particularly misleading or even counterproductive (e.g., sacred water).
  *   **Step 3: Indexical Drift Check**
      *   *Test:* Place symbol near a well vs. near a river vs. near a medical tent.
      *   *Result:** Near well: Likely interpreted as danger related to the well. Near river: Danger related to the river (drowning? pollution?). Near medical tent: Might be seen as "biohazard" or "medicine". The core "danger" aspect of the skull might persist, but the *source* of danger (contaminated water) is lost. **FAIL/Flag:** Drift is significant. The symbol doesn't reliably point to contaminated *drinking water* specifically.

  **Proposal B Verdict:** Fails Step 1 (likely, requiring human judgment which would lean towards fail due to risk), Fails Step 2 clearly, and Fails Step 3. **HARD NO (DO NOT PRINT).**

  **Unresolved Alternative for Proposal B:** The checklist highlights fundamental problems. A human team might decide to try a different symbol (e.g., a glass of water with a prohibition slash and maybe a sick figure) and restart the process, but the skull-over-water-drop itself fails.

