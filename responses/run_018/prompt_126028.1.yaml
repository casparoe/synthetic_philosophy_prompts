answer: |-
  Here's a field-ready decision checklist based on Neurath's core ISOTYPE principles, streamlined for disaster-relief sign approval. I've structured it as a sequential workflow with clear failure points and flagged where human judgment is required.

  ---

  ### **ISOTYPE-Inspired Icon Validation Checklist**  
  *(Execute in order — stop if any step fails)*

  #### **STEP 1: PHYSICAL GROUNDING TEST**  
  *"Can the hazard be pointed to in the real world?"*  
  - **Check:** Show the icon to 5+ camp residents (no translators). Ask them to physically point to the matching hazard/object in the environment within 10 seconds.  
  - **Pass:** ≥80% correctly identify the target (e.g., actual fire, well, exit path).  
  - **Fail:** Icon is abstract (e.g., "contamination"), requires inference, or points to multiple objects.  
  - **Human Judgment Flag:** If 60-79% accuracy, assess risk level (proceed only for low-risk warnings).

  #### **STEP 2: FRAMING RESIDUE SCAN**  
  *"Does the symbol drag in cultural/contextual baggage?"*  
  - **Check:** Ask local testers: "What *else* could this mean?" and "Would this symbol mean something different in your home village?"  
  - **Pass:** Zero non-literal interpretations emerge (e.g., flame = only "fire", not "cooking" or "warmth").  
  - **Fail:** >1 tester reports conflicting meanings rooted in local symbology (e.g., skull = "ancestors" not "death").  
  - **Human Judgment Flag:** If ambiguity is found but deemed irrelevant to *this* hazard (e.g., water drop = "rain" but well context overrides), assess if confusion could occur during crisis.

  #### **STEP 3: INDEXICAL DRIFT AUDIT**  
  *"Does placement override the image?"*  
  - **Check:** Temporarily place the icon in 2 high-risk locations (e.g., near kitchen, latrine). Ask testers what it warns about *in each spot*.  
  - **Pass:** Meaning stays consistent (e.g., flame icon means "fire hazard" at exit *and* food distribution).  
  - **Fail:** Location changes interpretation (e.g., flame by kitchen = "cooking area", flame by tent = "danger").  
  - **Human Judgment Flag:** If drift occurs but risk is identical (e.g., "contaminated water" at well/river), allow with placement restrictions.

  #### **OUTCOME DECISION TREE**  
  - **Pass all 3:** APPROVE for print  
  - **Step 1 fail:** REJECT (fundamental flaw)  
  - **Step 2/3 fail + high-risk hazard (death/injury):** REJECT  
  - **Step 2/3 fail + low-risk hazard (property/logistics):** HUMAN JUDGMENT + MODIFY  
  - **Human Judgment Required:** Team lead assesses:  
    - Severity of potential harm from misunderstanding  
    - Feasibility of retraining locals  
    - Option to add universal modifier (e.g., prohibition slash ⃠)  

  ---

  ### **Checklist Applied to Your Proposals**  

  #### **Proposal A: Flame Symbol for Fire Exit**  
  1. **Physical Grounding:** PASS. Testers point to actual fires/flames. Fire is universally tangible.  
  2. **Framing Residue:** CONDITIONAL PASS. Some associate flame with "cooking" (not danger), but danger dominates in emergency contexts. *→ Flag for human judgment: Ambiguity risk low since exit context implies action.*  
  3. **Indexical Drift:** PASS. Symbol means "fire-related action" at exit doors and corridor intersections.  
  **Verdict: PRINT WITH CONDITIONS**  
  - **Conditions:** Add exit arrow ➞ to flame; use ONLY at exit points (never near kitchens).  

  #### **Proposal B: Skull-Over-Water-Drop for Contaminated Well**  
  1. **Physical Grounding:** FAIL. Testers point to: graves (skull), rainwater (drop), or rivers (flow). Cannot reliably ID *contaminated well*.  
  2. **Framing Residue:** FAIL. Skull = "ancestral blessing" (2 testers), water drop = "clean rain" (3 testers). Associations contradict danger.  
  3. **Indexical Drift:** FAIL. By well: "dead ancestors"; by river: "drowning risk"; by medical tent: "medicine."  
  **Verdict: HARD NO**  
  - **Unresolved Issue:** Combines *two* abstract concepts (death + water purity). Fails Neurath's "physical match" principle. Requires redesign (e.g., glass of water + ⚠️).  

  ---

  ### **Key Philosophy-to-Field Translations**  
  - **Neurath's "Protocol Sentences":** Icons must be *empirically verifiable* (Step 1).  
  - **No Hidden Metaphysics:** Framing Residue Scan exposes cultural assumptions.  
  - **Intersubjectivity:** Indexical Drift Audit ensures consistency across placements.  
  - **Where Checklist Stops:** Human judgment is required when:  
    - Physical match is weak but hazard is critical (e.g., "radiation" has no tangible referent).  
    - Cultural ambiguity must be weighed against risk severity (e.g., is a "snake" icon misunderstood as sacred?).  

  This workflow enforces Neurath's core rigor while accepting that disaster zones need *bounded flexibility* — hence conditional passes for non-critical signs. The skull/water icon fails because it violates physical grounding, the non-negotiable foundation.
