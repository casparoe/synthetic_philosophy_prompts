answer: |-
  Here's an analysis of the Newton-Leibniz calculus priority dispute through your "inevitability" and "open-source protocol/API" lenses, breaking down the players, options, inevitability predictions vs. reality, and where the theory holds or breaks:

  **The Players & Their Roles:**
  1.  **Newton (UK):** The "original author" who wrote the core code (fluxions/method of series) privately ~1666. Prefers internal documentation & tight control (like a proprietary repo).
  2.  **Leibniz (Continental Europe):** The "independent contributor" who developed his own implementation (differentials/integrals) ~1675. Focuses on public documentation & wide adoption (like pushing to a public repo).
  3.  **The Bernoullis (Switzerland):** Key early "adopters & evangelists." They understood *both* systems but strongly preferred Leibniz's notation/API for its usability. Acted as powerful community influencers.
  4.  **Royal Society Commission (UK):** The biased "governance board." Stacked with Newton's allies (he was President!), tasked with "auditing" the dispute. Their report (1712) was essentially a whitewash favoring Newton.

  **The Options Faced & Actions Taken:**
  *   **Publish Immediately?**
      *   *Inevitable Prediction:* Best for science! Accelerates adoption & collaboration.
      *   *Reality:* **Leibniz published first (1684, 1686). Newton hesitated for decades (full 'Principia' 1687 used geometric proofs, fluxions finally published 1704, 1736).** Newton prioritized secrecy/perfectionism.
  *   **Sit on Manuscripts?**
      *   *Inevitable Prediction:* Slows adoption, risks redundant effort or loss.
      *   *Reality:* **Newton did this aggressively.** Shared glimpses privately but withheld core methods for ~40 years, fueling suspicion later.
  *   **Collaborate/Share Credit?**
      *   *Inevitable Prediction:* Optimal for efficient progress. Standardization emerges naturally.
      *   *Reality:* **Initial cordiality (1670s letters) collapsed into bitter, public accusations.** Newton demanded sole credit; Leibniz defended his independence. Collaboration failed spectacularly.
  *   **Fight Over Notation (API Design):**
      *   *Inevitable Prediction:* Notation is crucial usability. The *better* API should win based on merit.
      *   *Reality:* **A brutal notation war erupted.** Newton's dots (`ẋ`) vs. Leibniz's `d/dx` & `∫`. Despite Newton's priority claim, Leibniz's notation was objectively superior for complex problems and multi-variable calculus. **The Bernoullis championed Leibniz's API.**

  **Where Inevitability Theory Holds Water:**
  1.  **Redundant Independent Discovery:** Calculus *did* emerge twice, ~10 years apart, driven by shared mathematical problems (tangents, areas, motion). The core concepts (inverse relationship differentiation/integration, rules) were found by both. This strongly supports inevitability – the problems demanded the tool.
  2.  **Adoption Driven by Utility:** Regardless of the priority fight, calculus *spread* because it was incredibly powerful for physics and math. The underlying protocol *was* necessary and adopted.
  3.  **API (Notation) Standardization:** The "better API" **did** win long-term. Leibniz's `d/dx` and `∫` became the de facto standard across Europe (thanks to the Bernoullis) because it was more flexible, expressive, and easier to generalize. Newton's dots faded (except in specific physics contexts). The *protocol* worked; the best *interface* prevailed.

  **Where Inevitability Theory Breaks Down (The Human Drama):**
  1.  **Newton's Secrecy & Ego:** Inevitability assumes rapid sharing. Newton's decades-long secrecy *significantly* delayed wider understanding and adoption. His later obsession with claiming sole priority poisoned the well and distorted the historical record.
  2.  **The Poisoned Priority Dispute:** The vicious public fight, fueled by nationalism and personal animosity, consumed enormous energy and created division. It wasn't a healthy competition; it was acrimonious. This drama wasn't necessary for the *math* to exist or be used.
  3.  **The Corrupted Commission:** The Royal Society "audit" was a sham orchestrated by Newton. It wasn't a neutral evaluation of contributions; it was a weapon to destroy Leibniz's reputation. This is pure human politics, not scientific inevitability.
  4.  **The Timeline & Adoption Path:** While the *discovery* was likely inevitable, the *path* and *speed* of adoption were massively impacted by human choices. Leibniz's publication and superior notation accelerated Continental adoption. Newton's secrecy and the dispute hindered it in Britain initially.
  5.  **Credit Allocation vs. Utility:** Inevitability says the *idea* would emerge. It doesn't say *who* gets the historical laurels. The dispute proves that credit assignment is messy, political, and often unfair (Leibniz was unfairly maligned), even if the underlying math transcends it.

  **The API Analogy & Legacy:**
  *   **Core Protocol (Calculus):** Absolutely inevitable and redundant. The fundamental theorems and operations were independently discovered. This is the open-source protocol.
  *   **API (Notation):** **Crucially important.** Leibniz's `d/dx` and `∫` was the superior, more adoptable API. It became the standard because it was better designed for the users (mathematicians and physicists). Newton's notation was like a clunky, proprietary CLI compared to a clean, expressive RESTful API.
  *   **The "Who" (Routing Label):** For the *progress of science itself*, the "who" became largely a routing label *after* the API standardization. Continental mathematicians used the Leibnizian API regardless of the Royal Society's verdict. **The legacy *user adoption* belonged firmly to the better API (Leibniz's notation), not necessarily the first discoverer (Newton).** Knowing "Newton had it first" is historical trivia for most practitioners; using `dy/dx` is the daily reality.

  **Conclusion: Does Inevitability Survive?**
  *   **Yes, for the core discovery:** Calculus *was* inevitable. Two brilliant minds hit on the same essential concepts independently because the mathematical problems of the time demanded it. Redundancy proves inevitability.
  *   **No, for the human narrative:** The drama, the delay, the viciousness of the dispute, the biased commission, and the initial fragmentation were **not** inevitable. They were products of ego, secrecy, nationalism, and flawed institutions.
  *   **The Triumph of the API:** The real legacy *for the practice of mathematics* favors Leibniz, not because he was necessarily "first" in the strictest sense (Newton was), but because his **superior API (notation)** became the universal standard. The "who" mattered intensely to Newton and Leibniz, but for science progressing, the "what" (calculus) and the "how" (Leibniz's notation) mattered far more.

  **Final Verdict:** The inevitability theory survives contact with the drama **in terms of the core mathematical concepts emerging.** However, the drama proves that **human factors (ego, politics, communication style, API design)** massively shape *how, when, by whom it's recognized*, and crucially, ***how effectively it's adopted and used***. The discoverer isn't *just* noise, but the long-term utility and adoption depend far more on the quality and openness of the "API" than on the original discoverer's claim to priority. Leibniz, the second independent discoverer, won the adoption war through a better interface.
