  ok so me and my friend just had this huge argument about whether kalai-smorodinsky still makes sense when the disagreement point isn't fixed from the outside but comes from an earlier round of bargaining — like if you're negotiating a contract and your fallback is whatever you agreed on last year, not some exogenus status quo. i think the monotinicity axiom should get replaced by a local envy-freeeness condition that looks at the prior round's feasible set instead of the global utopia point. next week i have to defend this at our phil-of-econ seminar. the room will have two economists who think nash is the only axomatic game in town, a philosopher obsessed with procedural fairness, and one grad student who actually knows cooperative game theory inside out. i need a prep sheet for the q&a: the objections they'll actually throw at me, ordered by how much damage they'll do, phrased the way each of them would put it. for each one i need a two-minute reply and an honest note on where that reply is softest. tell me what i should concede upfront so i don't look stubborn, and what's the one question i'm praying nobody asks. don't give me citations or a reading list — i just need to survive the room.
