  I recall the Linux kernel's "undefined behavior" exploits—where compiler optimizations based on strict reading of C specs created security holes. That shows specs alone don't capture meaning; the compiler's *actual behavior* matters. 

  For the conclusion: the externalist view wins. Even though languages are formal, the meaning of terms depends on how the ecosystem implements them. A Java programmer who thinks "null is like C's NULL" would be wrong because Java's null has runtime checks. The environment—not just mental states or abstract specs—fixes meaning. 

  Should mention that internalism still holds for pure lambda calculus or idealized models, but not for real-world programming. The essay must emphasize that compiler differences and community practices *are* the Twin Earth scenario for "undefined behavior." 

