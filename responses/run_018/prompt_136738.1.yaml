  The tension is interesting: on one hand, a programmer might think "null" means "absence of value" based on their mental state. But in Java it throws NullPointerException, in SQL it's a database marker, and in C it's literally just zero. The external artifacts (specs, compiler behavior) seem to determine meaning. 

