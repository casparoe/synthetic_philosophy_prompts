answer: |-
  Here’s a distilled desiderata list for a theory of personal survival, optimized for your identity/tech feature. It’s structured to handle classic cases *and* your friend’s "narrative drift" twist, with clear stakes flagged:

  ---

  ### **Desiderata for a Theory of Personal Survival**  
  *(What it MUST explain or accommodate to be credible)*  

  1. **Case Coverage (Non-negotiable):**  
     - **Standard Teletransport (Destructive):** Original destroyed, copy on Mars. *Why:* Baseline for "continuity vs. identity" debates.  
     - **Split-Brain Fission:** One brain hemispheres split into two bodies (e.g., left hemisphere in body A, right in body B). *Why:* Proves psychological continuity *can branch*.  
     - **Narrative-Drift Branching (Your Friend’s Twist):** Original in coma + copy on Mars, both wake with same memories but diverge autobiographically over time. *Why:* Tests if identity/survival depends on *unique embodiment* or *narrative coherence*, not just initial continuity.  
     - **Ordinary Survival:** You tomorrow vs. you today. *Why:* Can’t break common intuition without justification.  

  2. **Key Distinctions (Non-negotiable):**  
     - **Survival ≠ Identity:** Surviving as a future self vs. being *numerically identical* (same entity). *Why:* Branching cases force this apart—you might survive in *both* branches but not be identical to either.  
     - **Psychological Continuity ≠ "What Matters":** Connected memories/beliefs don’t automatically define what we *rationally care about* (e.g., why prefer waking from coma over Mars copy?).  
     - **Same Person ≠ Same Body:** Bodily continuity might be irrelevant if psychology transfers (e.g., gradual cell replacement).  

  3. **Scientific Constraints (Non-negotiable):**  
     - **No Soul/Non-Physical Stuff:** Consciousness arises from brain processes. *Why:* Neuroscience consensus.  
     - **Gradualism Matters:** If your brain is replaced neuron-by-neuron, you survive. *Why:* Rejects "all-or-nothing" identity.  
     - **Split-Brain Reality:** Fission is empirically possible; theories can’t deny it.  

  4. **Tensions & Impossibilities:**  
     - **Branching + Unique Identity = Conflict:** If identity requires *no branching* (e.g., "only one future me"), it fails split-brain/fission cases.  
     - **Narrative Drift + Continuity = Tension:** If survival relies on psychological continuity, but narratives diverge (e.g., Mars copy feels grief, Earth you doesn’t), are they *both* "you" long-term?  
     - **What Matters vs. Science:** If science says "you’re just a process," but we *feel* a unique "I," the theory must reconcile this.  

  ---

  ### **How Major Theories Stack Up**  
  *(Quick hits on where they clearly pass/fail your cases)*  

  - **Psychological Continuity (e.g., Parfit):**  
    ✅ **Passes:** Standard teletransport (copy *is* you), branching (both fission products survive).  
    ❌ **Fails:** Why care *more* about waking from coma vs. Mars copy? Can’t explain emotional residue ("grief they never lived") as a survival problem. Narrative drift makes "you" ambiguous over time.  

  - **Bodily Continuity:**  
    ✅ **Passes:** Waking from coma is clearly "you"; respects biology.  
    ❌ **Fails:** Brutally fails teletransport (copy isn’t "you"), split-brain fission (which body is "real you"?). Ignores psychology’s role in identity.  

  - **Narrative Self (e.g., Dennett, Schechtman):**  
    ✅ **Passes:** Narrative drift is *central*—Earth you and Mars copy become different "persons" as stories diverge. Explains emotional residue (grief shapes narrative).  
    ❌ **Fails:** Risky in fission—if both copies sustain "your" narrative initially, who are they? Too fuzzy for survival (if narrative fractures, did "you" die?).  

  ---

  ### **The Core Tension Your Friend Exposed**  
  **Branching + Narrative Drift breaks all simple theories:**  
  - If survival is psychological, why prefer the coma body?  
  - If it’s bodily, why care about the Mars copy’s fate?  
  - If it’s narrative, when do the branching selves stop being "you"?  

  **This is the upgrade:** A theory must explain why—despite *both* branches being psychologically continuous at first—we might feel the *original body* has a stronger claim to "being me," *or* why that intuition is an illusion. Neuroscience says both are equally "valid" processes, but human intuition rebels. That’s your feature’s hook.  

  Use this to frame debates: Not "is the copy me?", but "what would make the copy's grief *matter* to me?"—or not.
