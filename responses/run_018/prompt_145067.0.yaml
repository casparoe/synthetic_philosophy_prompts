prompt: |-
  hey, i'm writing a novel and one of my characters is a philosopher who takes Dennett's cranes/skyhooks distinction to a weird extreme. she's come up with this argument that greedy reductionism collapses in on itself and i need to know where the sleight of hand is. she writes:

  1. greedy reductionism says every real phenomenon must be explained bottom-up by cranes—no skyhooks.
  2. but the claim 'cranes are sufficient' is not itself a bottom-up physical fact; it's a normative rule about what counts as a good explanation.
  3. if we reduce that rule to evolutionary psychology or brain wiring, we commit an is-ought slide: we replace 'this ought to explain things' with 'this is why we happen to believe it'.
  4. so the rule is either a skyhook standing outside the physical world, or it isnt real.
  5. if it isnt real, reductionism has no authority.
  6. therefore reductionism either smuggles in a skyhook or denies itself.

  she thinks this proves reductionists are secretly relying on skyhooks. i want to keep (1) and (5) if i can, but something between 2 and 4 feels dodgy. which step should she drop, and whats the cost? also, could she save the argument by treating the principle as a 'methodological scaffold' rather than an ontological claim?

  please reply in british english. no need for references or a reading list—this is for a character's notebook, not an essay.
