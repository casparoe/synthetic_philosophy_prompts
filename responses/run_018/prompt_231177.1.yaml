prompt: |-
  I'm a data architect, and my native vocabulary is ER modeling: entities, attributes, primary keys, foreign keys, join tables, that sort of thing. Lately I've been skimming the structural realism debate in philosophy of science, and I keep feeling like it's about relations without relata, which in my world makes no sense — you can't have a foreign key pointing at nothing. So translate it for me. As I understand it, the modest position is that science only ever gives us the web of relations between things, never the intrinsic natures of the things themselves; the stronger position is that the relata are dispensable, and all there really is is the structure. There's also an objection I ran across: if you're allowed to choose the relations freely, almost any collection of objects can be rigged up to exhibit any given structure, so the only-structure claim is either trivial or false. Take those three — modest, strong, and the objection — one by one, and restate each as precisely as you can in ER terminology. Then report what didn't survive: which parts have no real counterpart in ER modeling, and say whether that's because my schema-driven way of thinking is missing something or because those parts of the philosophy aren't pulling their weight. I want a committed verdict on that, not a survey of options.
