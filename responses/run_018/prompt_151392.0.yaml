  When discussing "restoration," a statue can be contextualized in a museum, turning it into a historical artifact. But renaming a street erases the name entirely; there's no middle ground. The user might be hinting at whether erasure is the only option for ambient commemoration. 

  The user also asks where the theory breaks. A street name could become focal if it's a major landmark or if activists target it, making it a symbol. The Bristol case shows how the statue's removal was a catalyst, forcing a reevaluation of other commemorations. 

