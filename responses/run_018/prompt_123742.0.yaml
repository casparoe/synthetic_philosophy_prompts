prompt: |-
  tbh I'm a longtime rationalist blog lurker and I keep seeing people drop "bias is just preference with worse marketing" in threads about evolutionary debunking, usually to shut down the idea that we can separate real moral knowledge from evolutionary leftover preferences. Last time was in a discussion about whether EA people are just laundering thier weird preferences through utilitarian framing. I want to take the slogan seriously and understand what it could actually mean, because right now it works like a magic spell that ends the argument.

  Could you lay out the distinct precise theses it might express? I'm thinking of things like:
  - the trivial evolutionary point that every preference has some causal history involving selection
  - a psychological claim that moral judgments are basically affective responses mislclassified as beliefs
  - a normative claim that once you strip framing away there's no epistemic gap between "I prefer X" and "X is wrong"
  - maybe something involving adaptive preference formation — where people adjust thier wants to match what's available — so that "bias" and "preference" become observationally identical?

  For each reading, tell me if it's just a platitude, if it's actually defensible, and crucially whether it does the work people want it to do — like dismissing debunking arguments or treating moral disagreement as pure taste. Also which of these are people actually reaching for in rationalist spaces? I want a menu I can bring back to the thread, not one "correct" interpretation. And dont bother with citations or reading lists; I want to work through the logic myself.
reasoning: |-
  Okay, let me unpack this user's query. They're a longtime rationalist blog lurker encountering the phrase "bias is just preference with worse marketing" in evolutionary debunking discussions. The phrase seems to function as an argument-stopper, especially in debates about whether Effective Altruism (EA) is just dressing up personal preferences as utilitarian morality. The user wants to dissect this slogan into distinct theses to understand its validity and how it's used in their community.

  Hmm, the user's clearly frustrated by how this slogan shuts down conversations. They want analytical tools, not just answers. Their request for a "menu" suggests they plan to engage in these debates themselves. I should avoid academic citations since they explicitly want to work through the logic independently.

  Breaking this down, the slogan seems to operate on multiple levels. First, there's the trivial evolutionary point - all preferences have biological origins. That's defensible but doesn't actually debunk moral claims since even true beliefs have evolutionary origins. Then there's the psychological claim that moral judgments are merely emotional responses mislabeled as beliefs. This is more substantive - if true, it would collapse the fact/value distinction. But it's highly contested within moral psychology.

  The normative claim is particularly interesting - that there's no epistemic difference between preference and moral judgment. This seems to be what many rationalists implicitly invoke when dismissing moral disagreements as mere taste differences. But this would require defending moral anti-realism, which the slogan conveniently glosses over.

  I'm noticing the user mentioned adaptive preference formation too - that's sneaky clever. If biases and preferences both adapt to circumstances, they become observationally identical. But this still leaves room for distinguishing distorted from authentic preferences through reflection.

  The real power of the slogan in rationalist spaces seems to be its rhetorical flattening effect. By reducing morality to preference, it makes evolutionary debunking seem fatal to moral realism while conveniently exempting the arguer's own meta-ethical position from similar scrutiny. That's probably why it works as an argument-ender - it frames the opposition as making a marketing mistake rather than substantive claims.

  For the user's purpose, mapping these interpretations with clear evaluations of (1) plausibility, (2) debunking power, and (3) actual usage patterns should give them what they need. The key is showing how the slogan often smuggles in controversial premises while appearing self-evident. That should arm them to reopen those "shut down" discussions.
answer: |-
  Here's a breakdown of the "bias is just preference with worse marketing" slogan, dissected into distinct theses, evaluated for plausibility, argument-stopping power, and prevalence in rationalist spaces:

  ### 1. **The Trivial Evolutionary Causal Thesis**
      *   **Claim:** All human preferences (including moral intuitions) have evolutionary origins. There's no "pure" moral faculty untouched by our biological history.
      *   **Plausibility:** Highly defensible, bordering on platitude in evolutionary psychology. Natural selection shaped our cognition, including social/moral intuitions.
      *   **Debunking Power?** **Very Weak.** This *explains why we have biases/preferences* but doesn't inherently *debunk* the possibility that some evolved intuitions track moral truth, or that we can rationally critique and transcend unreliable ones. Debunking arguments need extra premises (e.g., that these intuitions *only* track fitness, not truth). Doesn't dissolve the bias/preference distinction.
      *   **Used in Rationalist Spaces?** Often the *starting point*, but rarely the *final blow*. Savvy users know this alone is insufficient for debunking.

  ### 2. **The Psychological Affective Primacy Thesis**
      *   **Claim:** Moral judgments ("X is wrong") are *fundamentally* just strong negative affective responses ("I really dislike X!"), mislabeled or mistaken for objective beliefs. "Bias" is just the label we slap on affective responses we *disapprove of* or that conflict with our chosen ideology.
      *   **Plausibility:** Defensible, but contested. Strong evidence links emotion to moral judgment (Haidt's Social Intuitionist Model, disgust research). However, evidence also shows reasoning *can* shape/challenge intuitions, and moral language *functions* like belief-talk. Not a settled fact.
      *   **Debunking Power?** **Potentially Strong, But Overreaching.** *If true*, it radically undermines moral realism (no "truth" to track, just feelings). It directly attacks the idea that "bias" refers to a *cognitive error* rather than a *disliked feeling*. Can dismiss moral disagreement as mere clash of tastes. **Does significant work:** Makes EA utilitarianism look like just another affectively-driven preference cluster ("marketing").
      *   **Used in Rationalist Spaces?** **Very Common.** This is often the *implicit core* when the slogan is used to shut down arguments. Appeals to naturalism, Humean is/ought gap, and critiques of "moralizing."

  ### 3. **The Normative Equivalence Thesis**
      *   **Claim:** There is *no meaningful epistemic or normative difference* between stating a preference ("I prefer chocolate") and making a moral claim ("Slavery is wrong"). Calling something a "bias" instead of a "preference" adds nothing but rhetorical force/social signaling. The only difference is how it's framed ("marketing").
      *   **Plausibility:** Highly controversial. Assumes robust moral anti-realism (no moral facts). Defensible *only* if you already reject moral realism/cognitivism. Realists/objectivists strongly deny this equivalence.
      *   **Debunking Power?** **Maximum, But Question-Begging.** If accepted, it *completely* dissolves evolutionary debunking worries (there's nothing *to* debunk but preferences) and renders all moral argumentation purely about persuasion/preference alignment. Makes EA utilitarianism just one preference set among others. **Crucially:** This thesis *is the conclusion* debunkers are often arguing *towards*; using it *as a premise* via the slogan is circular.
      *   **Used in Rationalist Spaces?** **Common as an *implication* or *goal*, often smuggled in.** Users frequently *lean* on this via the slogan without fully defending the strong anti-realism it requires. The slogan *frames* this equivalence as obvious.

  ### 4. **The Adaptive Preference Formation Thesis**
      *   **Claim:** Both "biases" and "preferences" are often the result of psychological adaptation mechanisms (e.g., cognitive dissonance reduction, status quo bias, social conformity) shaping our desires and judgments to fit our environment or social group. The label "bias" is applied selectively to adaptations we reject.
      *   **Plausibility:** Defensible for many cases. Humans *do* adapt preferences (e.g., sour grapes, learned helplessness, internalized norms). Distinguishing "authentic" from "adaptive" preferences is notoriously hard.
      *   **Debunking Power?** **Moderate & Nuanced.** Undermines claims that *either* "preferences" or "moral intuitions" reliably reflect deep, authentic values or truth. Shows both can be distorted by circumstance. **Doesn't collapse the distinction:** You can still argue some adaptive preferences (e.g., based on oppression) are *harmful distortions* worthy of critique ("bias"), while others are benign ("preference"). Weakens the *authority* of intuitions/preferences but doesn't erase the concept of error.
      *   **Used in Rationalist Spaces?** **Less common as the *primary* interpretation of the slogan, but often in the background.** Used more to show complexity than to absolutely shut down arguments. Resonates with critiques of status quo bias or ideological capture.

  **The Slogan's Magic as an Argument-Stopper: Why it "Works"**

  1.  **Rhetorical Flattening:** It forcefully *frames* the debate on anti-realist terms by declaring the equivalence of "bias" and "preference" as if it's an obvious fact, not a controversial philosophical stance.
  2.  **Undermining Moral Authority:** It instantly challenges the speaker claiming a "bias" exists, implying they are just expressing *their own* counter-preference and engaging in status games ("worse marketing").
  3.  **Exemption of the User's Own Stance:** When used defensively (e.g., against critiques of EA), it deflects the "bias" accusation by saying "You just *prefer* different things, stop moralizing!" It conveniently ignores that the *user* might also be moralizing *their* preference for utilitarianism or anti-moral-realism.
  4.  **Appeals to Naturalism & Deflation:** Fits a naturalistic, deflationary worldview popular in rationalist spaces that's skeptical of "spooky" moral facts. Makes the critic seem unscientific or overly emotive.

  **The Menu for Your Thread:**

  *   **"It's just evolution!" (Trivial Causal):** "Sure, everything has origins, but that doesn't tell us if some judgments are *reliable* or if 'bias' is a useful concept. This doesn't resolve the debate."
  *   **"It's all just feelings!" (Affective Primacy):** "This is a substantive psych claim, not proven fact. Even if feelings are primary, we might still distinguish reliable intuitions from distorting biases through reasoning. Calling EA 'marketing' ignores its reasoned arguments."
  *   **"Moral claims = Taste claims!" (Normative Equivalence):** "This *assumes* moral anti-realism is true to make the slogan work. If you're using this to debunk realism, it's circular. Realists *deny* this equivalence is obvious or true."
  *   **"Everything's adaptive!" (Adaptive Preference):** "Both biases and preferences can be adaptive, sure. But that doesn't mean we can't critically evaluate *which* adaptations lead to flourishing or truth-tracking. 'Bias' might still label harmful distortions."

  **Crucial Point to Bring Back:** The slogan's power comes from **smuggling in a strong, controversial meta-ethical claim (usually Affective Primacy or Normative Equivalence) under the guise of a trivial observation (Trivial Causal or Adaptive Preference)**. The best counter is to **force explicit acknowledgment of which thesis is being invoked and demand its defense**, rather than letting it operate as a magical incantation. Ask: "When you say this, do you mean moral judgments *aren't beliefs*? Or that there's *no difference* between 'is wrong' and 'I dislike'? Because *that's* what needs arguing for."
