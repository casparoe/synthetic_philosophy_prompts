     - The other 13 students each draw one card from the current deck (without knowing which deck it is). They see their rank (r) but not the deck.

  3. **Betting**:
     - Each student (except the Philosopher) gets 10 chips at the start of each round.
     - They must bet at least 1 chip and at most 10 chips on one of two options:
