  11. **Honest note on what the game misses**: The game fixes the reference class in each round, but in reality we don't know the true reference class. Also, the game uses pre-determined total populations for each reference class, whereas in the real argument we have uncertainty about both the reference class and the total population within each class. Moreover, the game does not capture the full Bayesian updating over multiple hypotheses about the reference class and the population size. You'll need to verbally emphasize that the reference class problem is about how to choose between these different groupings (humans, conscious minds, digital) and that the DA's force evaporates when we consider that we might be in a larger class.

