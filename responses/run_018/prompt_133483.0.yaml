  **Bottom-line mechanic**: Students draw a random rank from a hidden reference-class deck and bet chips on whether total observers are under or over 200B, then discover that the same rank feels doomy in a small pool and fine in a huge one.

  **Rules**:
  - Three hidden decks: Humans (max 100B), All Conscious Minds (max 1e18), Digital (max 1e30).
  - Each round, 13 students draw a rank card from the current deck (without knowing which deck it is) and bet at least 1, up to 10 chips on "Doom" (N<200B) or "Boom" (N>200B).
  - One student per round is the Flat-Prior Philosopher: they don't draw or bet, but challenge others to justify bets using only their rank and a uniform prior over N.
  - After bets, reveal the deck and the true total N (100B for Humans -> Doom, 1e18 and 1e30 -> Boom). Payout: correct bets win chips equal to their bet, wrong bets lose the chips.

  **Chip payoffs**:
  - Start each round with 10 chips (even if you lost in a previous round, you get 10 fresh each round to keep it independent).
  - Bet X chips: if right, get X more (so total chips = 10 + X). If wrong, you have 10 - X (minimum 0).

  **Materials**:
  - Three decks of 14 cards each (pre-generated random ranks: for Humans 14 numbers between 1 and 100e9, for Conscious between 1 and 1e18, for Digital between 1 and 1e30). Write in scientific notation for big numbers.
  - Three identical boxes to hide decks.
  - Poker chips (or substitute) — at least 10 per student per round (so 14 students * 10 chips * 3 rounds = 420 chips; but they can be reused).
  - Betting slips (paper and pens).
  - Whiteboard to record rounds and results.

  **Timeline** (90 min total):
  - 0-5 min: Intro and assign first philosopher.
  - Round 1 (5-25 min):
      - 5-10 min: Draw and bet (Deck A: Humans).
      - 10-13 min: Reveal (Humans, N=100B) and payout.
      - 13-25 min: Philosopher-led discussion (12 min).
  - Round 2 (25-45 min):
      - 25-30 min: New philosopher; draw and bet (Deck B: Conscious).
      - 30-33 min: Reveal (Conscious, N=1e18) and payout.
      - 33-45 min: Discussion.
  - Round 3 (45-65 min):
      - 45-50 min: New philosopher; draw and bet (Deck C: Digital).
      - 50-53 min: Reveal (Digital, N=1e30) and payout.
      - 53-65 min: Discussion.
  - 65-90 min: Debrief (25 min) — connect to SSA, SIA, reference class problem, and what's missing.

  **Debrief**:
  - Round 1: High ranks in humans (like 85B) feel doomy — that's the DA using SSA (random sampling in reference class). The uniform prior leads to the conclusion that we are likely in the middle, so if your rank is 85B, the total is probably not much larger than 170B (by the median argument). But in reality, we know the total is 100B, so the doom bet wins.
  - Round 2: Same rank (say 85B) in a much larger pool (1e18) is early, so no doom. The DA would have been wrong here because the reference class is bigger. The Flat-Prior Philosopher forced you to confront: without knowing the reference class, how can you use your rank? This is the reference class problem.
  - Round 3: Same as round 2, but for digital. Even more extreme.
  - SSA: We assumed we are a random sample in our reference class. The DA uses SSA. But which reference class? Humans? Sentient beings? That's the problem.
  - SIA: An alternative that gives more weight to larger universes. But we didn't use it in the game (we used uniform prior over N, which is SSA-like). The presumptuous philosopher objection: SIA might lead us to believe in huge populations even without evidence, which seems presumptuous.
  - What's missing: The game doesn't capture the uncertainty about the reference class. In reality, we have to consider multiple reference classes at once and update on other evidence. The game also doesn't show how to combine the reference class uncertainty with the population size uncertainty. You have to verbally explain that the DA's apparent force comes from assuming a particular reference class (like humans) and that when we consider other possibilities, the argument weakens.

  **Predictable issues**:
  - Students might get confused about which deck they are in during the round (they don't know, so that's okay). After reveal, they might carry over the deck identity to the next round. Clarify that each round is independent.
  - The philosopher might be too shy or too aggressive. Instructor should moderate.
  - Generating the decks: make sure the ranks are distinct and cover a range. For Deck A, include some high ranks (e.g., 90B) to really trigger the doom feeling. For the other decks, the ranks can be any but will be small relatively, so they are all early.
  - Betting: Some might not understand that they are betting on the total population of their own reference class. Emphasize: "In the deck you are in, what is the total number of observers (N)? Is it under or over 200 billion?"

  That's the game! Have fun, and don't worry if the first run is a bit messy — the physical experience of drawing a big number and then realizing the context is what matters will stick.
answer: |-
  **Bottom-line mechanic:** Students draw a random "observer rank" from a hidden deck (humans, all minds, or digital) and bet chips on whether total observers *in their deck* are under or over 200B, then discover their "doomy" rank is mundane in a larger pool.  

  **Rules:**  
  - **3 hidden decks**:  
    - *Humans*: Ranks 1–100B (actual N=100B, "Doom" wins).  
    - *All Conscious Minds*: Ranks 1–1e18 (actual N=1e18, "Boom" wins).  
    - *Digital*: Ranks 1–1e30 (actual N=1e30, "Boom" wins).  
  - Each round:  
    1. **Draw**: 13 students pull one rank card from a hidden deck (don’t reveal ranks!).  
    2. **Bet**: Each bets 1–10 chips on "Doom" (N<200B) or "Boom" (N>200B), *without knowing which deck they’re in*.  
    3. **Reveal**: Instructor exposes the deck type and actual N.  
    4. **Payout**: Win +X chips if correct (bet X), lose X chips if wrong (min 0).  
  - **Flat-Prior Philosopher (FPP)**: 1 student per round (rotates). Doesn’t draw/bet. After reveal, leads 5-min debate forcing players to justify bets *only* using their rank + uniform prior over N (1 to 1e50).  

  **Chip payoffs:**  
  - Start each round with 10 chips (resets per round—no carryover, keeps focus on logic).  
  - Bet X (1–10 chips): Win → stack = 10 + X. Lose → stack = 10 – X.  
  - *No real money—use poker chips, paper clips, or tally on paper.*  

  **Materials (10-min prep):**  
  - 3 decks of 14 cards:  
    - Humans: Cards with ranks like "42,000,000,000" (14 random #s from 1–100B).  
    - Conscious Minds: Ranks like "7.2e17" (14 random #s from 1–1e18, sci notation).  
    - Digital: Ranks like "3.8e29" (14 random #s from 1–1e30, sci notation).  
  - 3 identical envelopes/boxes to hide decks.  
  - Chips/tokens (or paper + pen to track bets).  
  - Whiteboard: Track rounds, decks, outcomes.  

  **90-min timeline:**  
  - **0–5 min**: Intro + assign first FPP.  
  - **Round 1 (Human deck)**:  
    - 5–10 min: Draw ranks + bet (Doom/Boom).  
    - 10–12 min: Reveal deck (Human, N=100B) + payout (all "Doom" bets win).  
    - 12–17 min: FPP debate—"Why did your rank justify doom/boom under uniform prior?"  
  - **Round 2 (Conscious deck)**:  
    - 17–22 min: New FPP. Draw + bet.  
    - 22–24 min: Reveal (Conscious, N=1e18) + payout (all "Boom" win).  
    - 24–29 min: FPP debate—"Same rank as last round? Why bet differently now?"  
  - **Round 3 (Digital deck)**:  
    - 29–34 min: New FPP. Draw + bet.  
    - 34–36 min: Reveal (Digital, N=1e30) + payout (all "Boom" win).  
    - 36–41 min: FPP debate—"Does rank ever matter without knowing the pool?"  
  - **Debrief (41–85 min)**: See below.  
  - **85–90 min**: Wrap-up + Q&A.  

  **Debrief (map to concepts):**  
  - **R1 (Human)**: High ranks (e.g., 85B) feel doomy → classic **Doom Argument (SSA)**: Uniform prior + random rank suggests we’re *typical*, so N likely near ~2×rank.  
  - **R2/R3 (Conscious/Digital)**: Same rank (85B) is tiny → **reference-class problem**: Doom intuition vanishes when pool expands. SSA crumbles if you’re wrong about the class.  
  - **FPP role**: Embodies **presumptuous philosopher**—insists uniform priors *should* make rank decisive, but players see it’s deck-dependent.  
  - **Key tension**: SSA (self-locating uncertainty within a class) vs. SIA (which weights larger universes more—*not* modeled here, mention verbally).  
  - **What’s missing**: The game **can’t reproduce how we choose reference classes IRL**. Verbally stress: DA assumes "humans" is the right class, but R2/R3 show it’s arbitrary—we need external evidence to pick a class (e.g., are digital minds plausible?).  

  **Predictable mess-ups:**  
  - First-round chaos: Students will **mix up decks** mid-game (e.g., "Wait, is this human or digital?") or reveal ranks prematurely. Keep decks hidden until YOU announce.  
  - FPP **stalls debate**: If the philosopher freezes, jump in with: "Player with rank 85B—defend your boom bet assuming N could be anything!"  
  - Betting confusion: Some will bet based on "human intuition" in R2/R3. Remind: "You’re betting on *your deck’s* N, not Earth!"  

  *Casual note: This runs smoother if you pre-print ranks + emphasize the "gut check" when a huge number flips from scary to meh. Have fun!*
