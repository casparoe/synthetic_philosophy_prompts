  1. **Setup**: 
     - Three decks: 
       - Deck A (Humans): Cards with ranks from 1 to 100 billion (representing humans who have ever lived).
       - Deck B (All Conscious Minds): Cards with ranks from 1 to 10^18 (including all biological sentient beings in the universe).
       - Deck C (Digital Observers): Cards with ranks from 1 to 10^30 (simulated minds in a vast computer simulation).
