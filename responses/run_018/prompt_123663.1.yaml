  ### Brainstorming Symmetry-Breaking Problems  
  1. **Card Rotation with Hidden Marks**: Use two identical cards placed symmetrically on a rotating table. Players assign labels (A/B) using a visible central arrow. Remove the arrow, rotate the table 180°, and ask which card is which. Block cheating by dimming lights or using a blindfold during rotation.  
  2. **Token Orbit with Sticky Notes**: Two identical tokens orbit a central point (drawn on paper). Players label them with removable sticky notes. Remove the center point, rotate the paper, and force predictions about token positions. Block spatial memory by covering the setup with a box during rotation.  
  3. **Human Circle with Blind Swap**: Two participants stand symmetrically in a circle of others. The group assigns labels. Blindfold everyone, rotate the pair 180°, and ask if they swapped places. Block reference cues by shuffling observers' positions.  

  **Selected Framework**: Token Orbit with Sticky Notes (adaptable, minimizes physical constraints).  

  ---

  ### Activity: **Orbital Identity Crisis**  
  **Learning Goals**:  
  - Experience tension in discerning identity without intrinsic properties.  
  - Grasp weak discernibility (irreflexive relations) vs. global symmetry.  
  - Map rounds to Leibniz’s law challenges.  

  **Materials** (for 7 players + facilitator):  
  - **Tokens**: 2 identical spheres/coins (e.g., white poker chips).  
  - **Board**: Large paper with a circle (30cm diameter) and a central dot.  
  - **Labels**: Removable stickers (A/B) for spheres, blank stickers for predictions.  
  - **Rotation Tool**: Lazy Susan or rotating platform.  
  - **Blind**: Opaque box to cover the board during rotations.  
  - **Scoring**: Token system (e.g., glass beads); 1 bead = 1 point.  

  **Setup**:  
  - Place spheres on opposite sides of the circle.  
  - Assign velocities: "Sphere A moves clockwise; Sphere B counterclockwise" (declared verbally; no physical motion).  

  ---

  ### Game Rules & Timeline (90 Minutes Total)  
  #### **Round 1: Fixed Axis Reference** (20 min)  
  **Goal**: Use intrinsic properties (position relative to axis) to assign identity.  
  **Rules**:  
  1. Show central axis dot. Players label spheres A/B arbitrarily (e.g., "A: top, B: bottom").  
  2. **Prediction Task**: *"After 180° rotation, which sphere will be at the current position of Sphere A?"*  
     - Players write guesses (A/B) on blank stickers.  
  3. Rotate board 180° visibly. Reveal results.  
  4. **Scoring**: Correct guess = 1 bead.  

  **Debrief Hook**: *"You used the axis to track identity. What if it’s gone?"*  

  #### **Round 2: Relational Properties Only** (25 min)  
  **Goal**: Force reliance on relations (e.g., "clockwise to the other").  
  **Rules**:  
  1. Remove central dot (cover with paper). Declare: "Only relational properties exist now."  
  2. **Prediction Task**: *"After 180° rotation, which sphere is at the *relative* position Sphere A occupied? (e.g., ‘clockwise to the door’)"*  
     - Players submit guesses (A/B).  
  3. Cover board with box, rotate 180°, uncover.  
  4. **Scoring**: Correct guess = 1 bead.  
  5. **Twist**: Rotate only ONE sphere 180° secretly (simulates orbital swap). Players lose points if they assume symmetry.  

  **Block Cheating**:  
  - Players stand 2m from board during rotation (no spatial memory).  
  - Use identical spheres; no marks except removable labels.  

  #### **Round 3: Global Rotation & Identity Crisis** (25 min)  
  **Goal**: Challenge identity under global symmetry.  
  **Rules**:  
  1. Remove all labels. Cover board. Rotate entire system 180° (board + spheres).  
  2. **Decision Task**: Players choose:  
     - **A**: Spheres swapped identities.  
     - **B**: Spheres kept identities.  
     - **C**: Identity is undefined (no fact of the matter).  
  3. **Scoring**: No "right" answer. 1 bead for any *defended choice*.  
  4. Debate: Groups (2-3) argue for their choice (5 min).  

  **Block Cheating**:  
  - Facilitator rotates board in hidden location.  
  - Players forbidden from referencing room objects.  

  ---

  ### Debrief & Concept Mapping (20 min)  
  **Link Game to Philosophy**:  
  - **Round 1**: Axis = intrinsic properties (e.g., absolute position). Shows Leibniz’s law with discernibility.  
  - **Round 2**: Relational properties only (e.g., "orbiting clockwise relative to the other"). Exposes **weak discernibility**—irreflexive relations break symmetry *if* asymmetric (e.g., "left of"), but fail here due to symmetry.  
  - **Round 3**: Global rotation = **Black’s symmetry argument**. No external frame → identity untrackable. Connects to PII rejection: identical properties don’t imply numerical identity.  

  **What the Game Can’t Simulate**:  
  - **Modal fragility**: A world with one sphere (e.g., "Could A exist without B?") requires verbal explanation. Clarify: "Black’s spheres are distinct *de re* but indiscernible *de dicto*."  

  **Predictable Issues & Fixes**:  
  - **Cheating via spatial memory**: Blocked by distancing players, covering the board, and using a rotation tool.  
  - **Over-reliance on labels**: Remove labels in Round 3; force relational thinking.  
  - **Confusing velocity with motion**: Emphasize velocity is a *declared relation*, not physical movement.  

  **Outcomes**:  
  - Players feel frustration in Rounds 2-3, mirroring metaphysical tension.  
  - Explicitly name PII/Black only *after* the game, using experiences as reference.  

  ---  
  This design forces micro-choices (predictions → points), uses low-cost materials, and targets core debates. Run it as a "thought experiment lab" to prime deep discussion.
