  The strongest counterargument is the potential erosion of autonomy and identity. Even with consent, patients might not anticipate how their values could change post-treatment. Distinguishing settled versus contested points is crucial. Settled: patient autonomy in consent, minimizing harm. Contested: whether positive affect is necessary for well-being, and if eliminating craving undermines personhood.

