  ### Decision Procedure for Classifying Legendary Narratives  
  **Objective**: Classify a legendary narrative as (1) **Historical Kernel** (specific event generated the core), (2) **Historical Echo** (later event retrojected onto an earlier setting), or (3) **Structural Analog** (pattern fits era-specific conditions but describes no particular event).  

  **Calibration Reference Cases**:  
  - **Trojan War** (kernel: destroyed settlement at Hisarlik correlates imperfectly with Homer).  
  - **Arthurian Cycle** (analog/unrecoverable: no contemporary evidence, massive later accretion).  
  - **Exodus** (ambiguous: no direct archaeological correlation, but possible collective memory markers).  

  **Procedure Rules**:  
  - **Sufficient to proceed**: Answer meets minimal threshold for next step.  
  - **Halt**: Answer triggers a terminal classification.  
  - **Judgment call**: Requires expert interpretation; explicitly flagged.  
  - **Terminal Classifications**:  
    - Probable kernel with recoverable distortions.  
    - Unrecoverable kernel (event plausible but narrative irredeemably corrupted).  
    - Echo (later event mislocated temporally).  
    - Structural analog only.  
    - False-positive risk (correlation coincidental, not causal).  

  ---

  ### Ordered Decision Sequence  
  **Step 1: Contemporary Documentation Check**  
  - **Question**: Is there non-legendary written evidence from within 200 years of the purported event that corroborates core figures/events?  
    - *Sufficient to proceed*: No, or evidence is fragmentary/ambiguous.  
    - *Halt*: Yes → Proceed to **Step 2** (to test for distortions/retrojection).  
    - *Judgment call*: Weighing plausibility of lost records vs. absence of evidence.  

  **Step 2: Anachronism Detection**  
  - **Question**: Does the narrative contain objects, practices, or toponyms only attested archaeologically/textually in a period later than the purported setting?  
    - *Sufficient to proceed*: No anachronisms, or minor ones explainable as accretion → Proceed to **Step 3**.  
    - *Halt*: Major anachronisms present → Branch:  
      - If anachronisms match a later historical context (e.g., within 500 years of narrative’s composition) → Go to **Step 4** (Echo Test).  
      - If anachronisms fit no known context → Go to **Step 6** (Analog Test).  
    - *Test for disambiguation*:  
      - **Kernel**: Anachronisms are superficial additions to a stable core.  
      - **Echo**: Anachronisms align with a later event’s historical context.  
      - **Analog**: Anachronisms reflect the era of composition, not retrojection.  

  **Step 3: Archaeological Correlation**  
  - **Question**: Is there archaeological evidence (e.g., destruction layers, migrations) matching the narrative’s core claims in time/place?  
    - *Sufficient to proceed*: Partial/ambiguous correlation → Proceed to **Step 5**.  
    - *Halt*:  
      - Strong correlation + unique event (e.g., Troy’s destruction layer) → **Probable kernel with recoverable distortions**.  
      - No correlation → Proceed to **Step 5** (weigh against textual patterns).  
    - *False-positive guardrail*: If correlation is a common event type (e.g., generic city destruction), proceed to **Step 5**.  

  **Step 4: Echo Test**  
  - **Question**: Is there a historically attested later event (within 500 years of narrative’s composition) sharing structural features with the legend?  
    - *Sufficient to proceed*: No candidate event, or similarities are vague → Proceed to **Step 5**.  
    - *Halt*: Clear candidate event + anachronisms align with its context → **Echo** (later event mislocated).  

  **Step 5: Negative Evidence vs. Textual Patterns**  
  - **Question**: Given archaeological silence, do textual patterns indicate collective memory (e.g., archaic details, plausible geography) incompatible with retrojection or analogy?  
    - *Judgment call*: Weigh:  
      - **Specificity**: Unique details inconsistent with era of composition (e.g., obsolete toponyms).  
      - **Absence rationale**: Expected (e.g., nomadic groups leave little trace) vs. fatal (e.g., massive event leaves no trace).  
    - *Halt*:  
      - Strong textual patterns + absence expected → **Probable kernel** (if recoverable) or **Unrecoverable kernel** (if corrupted).  
      - Generic textual patterns + absence fatal → **Structural analog** (if pattern fits era) or **False-positive risk** (if pattern is coincidental).  
      - Weak patterns + absence expected → Proceed to **Step 6**.  

  **Step 6: Analog Test**  
  - **Question**: Does the narrative’s pattern (e.g., invasion, migration) match common event types in the purported era?  
    - *Halt*:  
      - Pattern is common → **Structural analog**.  
      - Pattern is rare + specific details → **Unrecoverable kernel**.  
      - Pattern is rare + generic details → **False-positive risk**.  

  ---

  ### Limitations and Misfire Warnings  
  **What this procedure CANNOT do**:  
  - Generate bibliographies or require specialist archival access.  
  - Settle theological/nationalist claims about the narrative’s meaning.  
  - Conduct source-critical philology or stratigraphic interpretation.  

  **Misfire Risks**:  
  - Narratives with **theological/national functions** (e.g., Exodus’ covenant themes) may overvalue textual patterns in **Step 5**.  
  - **Silence vs. absence of evidence** judgments (**Step 5**) are vulnerable to confirmation bias.  

  ---

  ### Worked Examples  
  #### **Case 1: Arthurian Cycle**  
  1. **Step 1**: No contemporary evidence (earliest texts 300+ years post-purported events) → Proceed.  
  2. **Step 2**: Major anachronisms (e.g., knightly combat, castles) match High Medieval period (composition era) → Go to **Step 4**.  
  3. **Step 4**: No later event candidate (e.g., Norman conquest lacks a "British resistance" core) → Proceed to **Step 5**.  
  4. **Step 5**:  
     - *Textual patterns*: Generic "heroic warlord" tropes; no archaic specifics.  
     - *Absence*: Expected (post-Roman Britain has sparse archaeology).  
     → Halt at **Structural analog** (common pattern of warlords in era).  
  **Outcome**: Halts at **Step 5** → Arthur is a structural analog. *Echo test fails*: No later event retrojected; anachronisms reflect myth-building, not temporal relocation.  

  #### **Case 2: Exodus Narrative**  
  1. **Step 1**: No Egyptian records of Israelite slavery/exodus → Proceed.  
  2. **Step 2**: Anachronisms (e.g., Philistines, camels) match Iron Age (composition era) → Go to **Step 4**.  
  3. **Step 4**: Later events (e.g., Babylonian exile) share "oppression/return" but lack Egypt-specific markers → Proceed to **Step 5**.  
  4. **Step 5**:  
     - *Textual patterns*: Strong collective memory markers (e.g., Egyptian loanwords, route details).  
     - *Absence*: Unexpected for large-scale migration but explicable if numbers exaggerated.  
     → Ambiguity: Leans toward kernel, but proceed to **Step 6** for disambiguation.  
  5. **Step 6**:  
     - *Pattern*: "Liberation migration" is rare in Late Bronze Age (unique to Exodus).  
     - *Specific details*: Plausible (e.g., forced labor in Delta).  
     → Halt at **Unrecoverable kernel** (event plausible but narrative corrupted).  
  **Outcome**: **Step 5** → **Step 6** ambiguity between analog, echo, and kernel. Disambiguation prioritizes rare pattern + specific details → Unrecoverable kernel.  

  ---

  ### Check Question  
  **Test User Understanding**:  
  *A narrative describes a flood in ancient Mesopotamia. Excavations at Ur show a flood layer dating to the purported time, but the story includes anachronistic details (e.g., ark dimensions) matching later literary motifs. Using the procedure:*  
  - **Step 1** → No contemporary texts → Proceed.  
  - **Step 2** → Anachronisms (ark) match composition era → **Step 4**.  
  - **Step 4** → No later flood event candidate → **Step 5**.  
  - **Step 5** → Strong archaeology + anachronistic textual patterns → **Probable kernel with recoverable distortions** (flood real, details mythologized).  

  **Correct Disambiguation**: User must distinguish:  
  - **Kernel**: Specific event (flood) generated the core.  
  - **Echo**: Later flood (e.g., Assyrian era) retrojected onto the past.  
  **If user conflates**, they misclassify as echo or analog despite archaeological correlation.
