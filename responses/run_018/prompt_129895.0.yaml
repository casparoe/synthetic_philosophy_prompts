  Here's a joke built around that specific archival bias, with the historical context and caveats explained below:

  **The Joke:**

  An earnest young historian burst into the dusty town archives, brimming with excitement about her research into 19th-century tenant rights. "Archivist!" she exclaimed, "I've combed every ledger, every deed box! Astoundingly, I found *zero* records of working-class tenants in Milltown ever disputing their rents or conditions between 1820 and 1860! It seems they were universally compliant!"

  The grizzled Head Archivist peered over his spectacles. "Compliant? My dear girl, the Milltown Tenants' Revolt of 1847 practically burned down the courthouse annex! Landlords hid in their cellars for weeks!"

  The historian gaped. "But... but there's *nothing* in the records! Not a single complaint, petition, or court filing!"

  From behind a towering stack of uncatalogued deeds, the ancient Deputy Archivist wheezed, "*Course* there's no records, missy. Old Magistrate Cobb had a rule: 'No seal, no file.' Official wax only. Them tenants? They complained plenty. They petitioned. They even sued. They just did it on cheap paper, signed with an 'X' or a thumbprint. Piles of it came in."

  He gestured vaguely towards a large, ominous-looking furnace door in the back wall. "Cobb used to point at that thing and say, 'If it ain't got a proper blob of wax, it ain't history.'"

  **The Punchline:** The lack of records isn't proof of compliance; it's proof the filing system *mechanically incinerated* evidence of dissent based purely on the absence of an expensive, often inaccessible, authenticating seal. The tenants *did* fight back – their fights just weren't considered "archivable" by the gatekeeper (Cobb) using this arbitrary rule, and were physically destroyed.

  **Historical Stretch/Contested Read:**
  1.  **The Absolute Rule ("No seal, no file"):** While wax seals *were* crucial for authenticating high-level legal documents (deeds, contracts, proclamations), local courts and record offices often accepted a wider range of proof for lower-level disputes. Petitions, complaints, and even court filings from lower classes *did* sometimes get recorded, even if informally or without a formal seal, especially if they resulted in court action. Many local courts relied more on signatures, marks, witness testimony, and clerk notations.
  2.  **Systematic Destruction:** The joke implies a *routine, formalized* destruction policy specifically targeting unsealed documents ("Cobb used to point at that furnace..."). While space was limited and old papers were discarded, this level of *conscious, rule-based destruction* specifically *because* of the lack of a seal is exaggerated for comedic effect. Disposal was often haphazard or based on perceived *current* value, not *solely* on the presence of a seal at the moment of filing.

  **Counter-Examples That Would Undermine the Punchline:**
  *   **Surviving Unsealed Petitions:** If historians *could* find contemporary examples from Milltown (or similar towns) of working-class petitions, rent dispute records, or court summons *without* official wax seals that *were* successfully filed and preserved, the joke's core premise (that the *lack of seal* was the *absolute* barrier to preservation) falls apart. Evidence that clerks *did* sometimes file such documents despite the lack of a seal weakens the mechanical bias claim.
  *   **Alternative Record-Keeping:** Proof that tenant disputes were regularly recorded *elsewhere* – in court minute books kept by the clerk (recording oral testimony and judgments), in constable's reports, in local newspapers reporting on disturbances, or even in private landlord account books noting "difficulties" – would mean the historian was simply looking in the wrong place. The gap wouldn't be due to the *filing bias* but the *historian's research bias*. The punchline relies on the archivist confirming the bias *within the specific record series the historian checked*.

  **Why it (Hopefully) Works:**
  It focuses on the *mechanical gatekeeping* of the archive itself (the seal requirement as an arbitrary filter) and its physical consequence (destruction), rather than just a vague power imbalance. The humor comes from the disconnect between the historian's conclusion (no resistance) and the archivists' knowledge of actual events, finally explained by a specific, absurd bureaucratic rule with tangible, destructive results. It highlights how the *medium* (sealed vs. unsealed) dictated survivability, silencing voices not through malice necessarily, but through procedural indifference.
