prompt: |-
  I need help figuring out whether I've broken my code or broken probability theory. I'm a software engineer, no formal philosophy or stats training, and I was messing around with a simulation of a betting game a friend pitched me over beers. The game: flip a fair coin until it comes up heads. If the first heads lands on flip n, the payout is 2^n divided by n dollars -- but with a twist: if n is even, you PAY that amount instead of winning it. So flip 1 pays +$2, flip 2 costs you $2, flip 3 pays +$8/3, flip 4 costs you $4, and so on, the stakes ballooning while the sign alternates. I wanted the fair entry fee, so I did what I always do and wrote the expected value as a sum. Each outcome has probability 1/2^n, the powers of two cancel, and the terms come out to +1 − 1/2 + 1/3 − 1/4 + ..., which I half-remembered is the alternating harmonic series, equal to about 0.693. So: fair price 69 cents, done, pub trivia solved.

  Except then I actually ran the simluation, and the running average per trial does not settle at 0.693 or anywhere else. It hovers around small numbers for ages, then some freak trial hits a long run of tails before the first heads and the average gets yanked up or down by hundreds or thousands of dollars, and these kicks keep arriving no matter how many millions of trials I run, alternating in direction. My friend insists the sim must be buggy because "the math says ln 2." But I noticed something unsettling: if I group or reorder the terms of that infinite series differently -- which feels like it shouldn't matter, addition is commutative, right? -- I can make the sum come out to basically anything I want. So now I suspect the series only converges in some fragile, order-dependent way, and that the game might not have an expected value at all. Not even "infinity" like that famous St. Petersburg game, which at least gives you an answer of sorts.

  So my question: does this situation have a name -- a game whose expectation isn't merely huge or infinite but fails to exist because the positive and negative parts each blow up on their own? I don't want just a bare label, though. What are the closest established concepts (the St. Petersburg paradox? heavy-tailed distributions with no defined mean, like that Cauchy thing? whatever the reordering phenomenon is called in calculus?), how does my game differ from each, and which pigeonhole does it actually belong in? And practically: does the non-existence of an expectation mean there's simply no fact of the matter about a fair entry fee, or do people who study rational choice have workarounds? Please lead with your bottom line in the first sentence -- roughly, "yes, this is known as X" or "no clean name exists, but here's the carving" -- then give the reasoning, no preamble or restating my question.
reasoning: |-
  Okay, let me tackle this user's problem. They're a software engineer who simulated a betting game with alternating payouts based on coin flips. The expected value calculation gave ln(2) ≈ 0.693, but their simulation doesn't converge - it keeps getting jerked around by extreme outcomes. 

  Hmm, the core issue is definitely about conditional convergence of series. The alternating harmonic series they got (+1 -1/2 +1/3 -...) is conditionally convergent - it sums to ln(2) only if taken in exact order. Riemann proved you can rearrange such series to converge to any real number or even diverge. That explains why their grouped terms gave different sums.

  But why does this break their simulation? Ah! The positive and negative parts separately diverge: sum 1/(2k-1) and sum -1/(2k) both go to infinity. So the expectation doesn't actually exist - it's not infinite like St. Petersburg, but undefined. This differs from St. Petersburg where payouts grow monotonically positive, and from Cauchy distributions which have infinite variance but defined location.

  Practically speaking... this means there's no single "fair price". The user's simulation behaves erratically because later trials still introduce massive payout swings that don't average out. Interesting how this connects to decision theory - without a defined expectation, concepts like "fair fee" become ambiguous. Some economists might suggest median-based approaches or utility functions, but that's dodging the mathematical reality.

  The user's observation about term rearrangement was spot-on. I should emphasize how this isn't a bug but profound mathematical behavior. Their engineering intuition correctly doubted the naive "ln(2)" answer when simulations disagreed. This case beautifully shows why conditional convergence matters for real-world predictions.
answer: |-
  **Your game's expected value does not exist because the positive and negative parts each diverge to infinity, making the series conditionally convergent (dependent on order).** This is distinct from the St. Petersburg paradox and heavy-tailed distributions without defined means. Here's the breakdown:

  1.  **The Series:** Your derivation is correct: the expected value is the alternating harmonic series:  
      `E = Σ_{n=1}^∞ [(-1)^{n+1} / n] = 1 - 1/2 + 1/3 - 1/4 + ...`  
      This series *does* converge to `ln(2)` ≈ 0.693... **if summed in this exact order.**

  2.  **Conditional Convergence & Riemann's Rearrangement Theorem:**  
      *   The alternating harmonic series is **conditionally convergent**: it converges, but the series formed by taking the absolute values of its terms (`Σ |(-1)^{n+1}/n| = Σ 1/n`) is the (divergent) harmonic series.
      *   **Riemann's Rearrangement Theorem** states that any conditionally convergent series can be rearranged to converge to *any* real number, or even to diverge to `+∞` or `-∞`. This is why grouping the terms differently gave you different sums. Addition is commutative for finitely many terms, but **order matters critically for infinite series that are not absolutely convergent**.
      *   Your simulation reflects this order dependence. The rare but massive positive payouts (`n` odd) and negative payouts (`n` even) for large `n` are real and have significant probability (`1/2^n`). Their impact *never* averages out over infinite trials because their contributions are too large and "balanced" only by the artificial ordering.

  3.  **Divergence of Positive & Negative Parts:**  
      *   The expected value formally doesn't exist because the sum of the *positive* terms alone (`Σ_{k=1}^∞ 1/(2k-1) = 1 + 1/3 + 1/5 + ...`) diverges to `+∞`.
      *   Similarly, the sum of the *negative* terms alone (`Σ_{k=1}^∞ -1/(2k) = -1/2 - 1/4 - 1/6 - ...`) diverges to `-∞`.
      *   **This is the core reason the expectation fails to exist:** both the "winning part" and the "losing part" of the game are infinitely large in expectation on their own. There's no meaningful way to balance `+∞` and `-∞`.

  4.  **Comparison to Similar Concepts:**
      *   **St. Petersburg Paradox:** The payout (`2^n`) grows much faster than the probability decays (`1/2^n`), resulting in an *infinite* expected value (`Σ (2^n * 1/2^n) = Σ 1 = ∞`). Crucially, all terms are *positive*. Your game alternates signs and has *divergent positive and negative parts*.
      *   **Cauchy Distribution:** Has no defined mean because its "tails" are too heavy (probability decays like `1/x^2`), making the integral defining the mean diverge. Your game's payout magnitudes (`2^n / n`) grow *exponentially* while probabilities (`1/2^n`) decay exponentially, leading to *faster* growth in the magnitude of extreme terms than Cauchy, *plus* the alternating sign causing the divergence of the positive/negative parts.

  5.  **Practical Implications:**
      *   **No Fair Price:** There is no single "fair" entry fee in the standard expected value sense. The value depends entirely on how you choose to "order" the potential outcomes (e.g., stopping rules, risk aversion limits, truncation).
      *   **Rational Choice Workarounds:** Decision theorists recognize this problem. Proposed solutions often involve:
          *   **Utility Functions:** Using a concave utility function (like `log(wealth)`) instead of linear money. This can sometimes assign a finite value by damping the impact of extreme payouts.
          *   **Truncation:** Assuming the game has a forced stop after `N` flips (making the series finite and absolutely convergent).
          *   **Alternative Criteria:** Using median outcome, probability of profit, or risk-adjusted measures (e.g., Kelly criterion) instead of expected value. These often yield finite, practical values but are not "fair" in the classical linear expectation sense.

  **In summary:** Your game lacks an expected value due to the conditional convergence of the alternating harmonic series and the divergence of its positive and negative parts. Riemann's Rearrangement Theorem explains the order dependence you observed, and your simulation correctly reflects the instability caused by unbounded positive and negative payouts with non-vanishing probabilities. There is no unique fair entry fee based on linear expectation.
