prompt: |-
  I help run a weekend workshop for undergrads (mixed majors, no philosophy background required) and we've got a two-hour slot with about 12 people on consciousness. I want to do something on panpsychism, specifically the combination problem: even if you grant that tiny simple things have tiny simple experiences, how do a billion little subjects add up to one unified subject like me, instead of just being a crowd of separate little subjects with no extra person at home?

  Design an activity or game that makes them feel why this is hard, not just hear that it is. My rough thought is something where each participant only has access to a tiny fragment of private information or a tiny fragment of some experience, and the group has to somehow produce a single unified group-level experience or decision out of those fragments, and they keep discovering that what they produce is either just the fragments sitting next to each other or a spokesperson reporting on their behalf, never an actual merged subject. But I'm not wedded to that design, so if you have a better mechanic, go with it.

  A few requirements. No lecture beforehand and nobody should hear the words panpsychism or combination problem until the debrief. The rules, roles, and information structure should be fully specified so I can actually run it: what each person gets, what they're allowed to communicate, what counts as success, and any small stakes that make them care (nothing involving money). Include a couple of rounds or variations that escalate, so the difficulty shows up in what happens rather than in my commentary. Then give me a debrief plan that maps specific moments in the game onto the parts of the combination problem they just bumped into, including the difference between aggregation and genuine unity, and where each tempting fix (a leader, a vote, a shared chat channel, everyone closing their eyes and trying to merge) corresponds to an actual move philosophers make and why it doesn't obviously work. Also tell me what will predictably go wrong the first time I run this and how to recover, and be honest about which feature of the real problem the game structurally can't reproduce (I assume the fact that we each already ARE unified subjects trying to fake being micro-subjects messes things up somehow) and what I have to supply with words instead.

  Please write your answer as continuous prose, like an email: no headings, no bullet points, no bold text, no tables.
