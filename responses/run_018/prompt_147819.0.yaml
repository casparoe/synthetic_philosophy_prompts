answer: |-
  ### Brief Prose Analysis
  The summary conflates Weber’s dialectical framework with a reductive idealism. Claims (1) and (2) are defensible simplifications of Weber’s core argument about elective affinity between Protestant values and capitalist institutions. However, claim (3) misrepresents Weber by implying cultural causality operates *without* mediation by material structures; Weber explicitly treated ideas and material conditions as interdependent, with culture influencing but not unilaterally overriding institutional or class constraints. Claim (4) compounds this error by labeling Weber a "methodological idealist," ignoring his insistence that explanations require analyzing *both* material and ideal interests. Consequently, claim (5)’s conclusion is non-sequitur: early capitalist practices in Catholic regions (which Weber acknowledged) do not falsify his thesis about the *systematic rationalization* of capitalism via Protestantism’s cultural catalyst, nor do they justify abandoning his framework for pure materialism. The "refutation" assumes Weber denied material factors entirely—a position he explicitly rejected.

  ### Structured Audit (JSON)
  ```json
  {
    "claim_audits": [
      {
        "claim_number": 1,
        "claim_summary": "Calvinist predestination anxiety led to worldly asceticism as a sign of salvation.",
        "verdict": "fair_simplification",
        "correction": "Weber emphasized this psychological mechanism but framed it as one contingent catalyst, not a universal law.",
        "defender_cost": "Must address why similar anxieties (e.g., in Jansenism) didn't produce identical economic effects.",
        "conclusion_dependency": false
      },
      {
        "claim_number": 2,
        "claim_summary": "Protestant values spread via elective affinity to form modern capitalism's institutions.",
        "verdict": "fair_simplification",
        "correction": "Elective affinity implies mutual selection, not deterministic causation; Weber saw capitalism's rise as contingent on multiple factors.",
        "defender_cost": "Must explain why affinity crystallized in specific historical contexts (e.g., Northwestern Europe) but not others.",
        "conclusion_dependency": false
      },
      {
        "claim_number": 3,
        "claim_summary": "Culture autonomously determines economic organization without mediation by material interests.",
        "verdict": "serious_misrepresentation",
        "correction": "Weber rejected cultural autonomy; ideas gain traction only when aligned with material conditions and institutional opportunities.",
        "defender_cost": "None—this misreads Weber. Defender can cite his comparisons of Protestantism/Catholicism in similar material settings.",
        "conclusion_dependency": true
      },
      {
        "claim_number": 4,
        "claim_summary": "Weber was a methodological idealist denying independent roles to material factors.",
        "verdict": "subtle_distortion",
        "correction": "Weber was anti-reductionist, granting material factors co-explanatory roles; his ideal-types integrated both domains.",
        "defender_cost": "Must clarify why Weber critiqued historical materialism without embracing idealism.",
        "conclusion_dependency": true
      },
      {
        "claim_number": 5,
        "claim_summary": "Pre-Reformation Catholic capitalism falsifies Weber, proving values-alone explanations unsound.",
        "verdict": "serious_misrepresentation",
        "correction": "Weber addressed these cases, arguing they featured *ad hoc* capitalism, not the rationalized system spurred by Protestantism's cultural shift.",
        "defender_cost": "Must engage critiques that Protestant regions industrialized faster, not that capitalism originated there.",
        "conclusion_dependency": false
      }
    ]
  }
  ```

  ### Key Notes on Dependency
  - Claim 5’s conclusion depends **critically** on claims 3–4 being true (hence their `true` dependency flags). If Weber did *not* claim cultural autonomy (as 3–4 assert), then finding pre-Reformation capitalism does not refute him.  
  - Claim 5 is independently flawed for ignoring Weber’s distinction between capitalist **practices** (present globally) and the **spirit** of rational capitalism (which he tied to Protestantism).  
  - Claims 1–2 are largely accurate and do not necessitate claim 5's conclusion; Weber’s thesis survives if 3–4 are corrected.
