answer: |-
  Here's a reusable 5-minute Tranquilism-based screening procedure for your wellbeing activities, designed to be objective, actionable, and teacher-friendly. I've built it exactly to your specs—including the shadow-craving check, handoff point, forced "fail" example, and confidence notes.

  ---

  ### **Tranquilist Wellbeing Activity Screen (5-Minute Procedure)**
  **Core Principle:** Only activities that *directly reduce craving/suffering* without creating new cravings or relying on pleasure/achievement pass. All else fails.

  #### Steps (Run in Order):
  1. **State the Mechanism** (1 min)  
     *What does the activity ask participants to DO? Describe only observable actions.*  
     → *Pass:* Clear, literal description (e.g., "Write 3 things you lack resentment toward").  
     → **Auto-Fail:** Vague/goal-based language (e.g., "Boost mood," "Find joy").

  2. **Check for Explicit Craving/Suffering Reduction** (1 min)  
     *Does the activity directly interrupt a *specific* craving/suffering cycle?*  
     → *Pass:* Targets documented distress (e.g., "Reduce screen addiction urges").  
     → **Auto-Fail:** Focuses on adding positives (e.g., "Build confidence," "Increase gratitude").

  3. **Shadow-Craving Scan** (1.5 min)  
     *Could the activity fuel comparison/conditional wellbeing? Ask:*  
     - *"Does this require judging self/others?"*  
     - *"Does 'success' depend on external benchmarks?"*  
     → **Auto-Fail:** If yes (e.g., activities implying "shoulds," hidden competition).

  4. **Indirect Craving Risk** (1 min)  
     *Could this become a *new* craving? Ask:*  
     - *"Is there risk of dependency?"* (e.g., "Must do this daily to feel okay").  
     - *"Does it pathologize normal states?"* (e.g., "Not feeling grateful = failure").  
     → **Auto-Fail:** If risks outweigh craving reduction.

  5. **Neutrality Check & Handoff** (0.5 min)  
     *Does the activity actively reduce craving *without* introducing new values?*  
     → **Handoff to Teacher:** If steps 1-4 show *no craving reduction AND no new harms* (true neutrality).  
     *You say:* **"This is factually neutral—whether to include it is a values call I can't make alone."**

  ---

  ### **Test Runs**  
  **Activity 1: Guided Gratitude Journaling**  
  1. *Mechanism:* "Write 3 things you're grateful for daily." → **Pass** (observable).  
  2. *Explicit Reduction:* Focuses on *adding* positive feelings → **Auto-Fail.**  
     *(Stops here—fails Step 2. **Forced fail** as requested)*  
     ***Why:** Gratitude requires *cultivating* a pleasurable state. Under Tranquilism, craving reduction means easing the pain of *not having*, not manufacturing appreciation.*

  **Activity 2: "No-Phone Weekend" Detox**  
  1. *Mechanism:* "Avoid phone use for 48 hours." → **Pass.**  
  2. *Explicit Reduction:* Targets craving (digital addiction) → **Pass.**  
  3. *Shadow-Craving:* No comparison/judgment → **Pass.**  
  4. *Indirect Risk:* May create temporary dependency on detoxes → **Low risk** (pass).  
  5. *Neutrality:* Actively reduces craving → **Pass.**  
  ***Result: Approved.***

  ---

  ### **What This Procedure CAN'T Do**  
  - Measure effectiveness or engagement.  
  - Judge cultural/spiritual value.  
  - Replace ethics reviews (e.g., for high-risk activities).  
  - Account for individual variations in suffering.  

  ---

  ### **Confidence Assessment**  
  - **Overall Confidence: 85%.**  
    The procedure robustly filters non-Tranquilist activities and flags shadow-cravings (e.g., gratitude journaling’s implied "should").  
  - **Least Confident Bit: Step 4 (Indirect Craving Risk).**  
    *Why:* Predicting "new dependency" risks is subjective. A strict teacher might argue *any* ritual creates craving (e.g., "relying on detoxes"). I’d suggest adding: *"If unsure, default to fail—Tranquilism prioritizes harm avoidance."*

  ---

  ### **Teacher Presentation Script**  
  *"I use this screen to ensure activities align with evidence that craving reduction is wellbeing's core mechanism. It auto-rejects anything relying on pleasure, achievement, or comparison. Step 5 flags when an activity is neutral—that’s where I need your input on whether neutrality serves our values. Example: Gratitude journaling failed as it cultivates pleasure; phone detox passed by directly reducing digital suffering. Can we implement this as our standard?"*  

  This gives you rigor, forces objective fails, and makes values decisions a shared responsibility. Solid plan—let me tweak any step that feels off!
