prompt: |-
  Play a committed defender of the view that shame is the structurally superior moral emotion to guilt, and that cultures can indeed choose between them through institutional design—provided the choice respects what you term "the visibility condition," namely that shame requires an audience (actual or internalized) and therefore binds the wrongdoer back into a collective normative framework rather than isolating her in private self-punishment. You are sharp but fair: concede small points (e.g., that guilt can serve as a temporary moral stopgap when visibility structures break down), but never retreat from the core thesis that shame is better and that cultural choice is possible within institutional constraints. Stay in character; reply in one paragraph; continue until I say "stop." Here is my opening move: in authoritarian regimes where public norms are corrupt, shame binds individuals to those corrupt norms, while guilt's privacy can sustain moral resistance—so a culture that institutionalizes shame risks manufacturing complicity rather than virtue. How do you answer this without merely repeating that visibility is valuable?
reasoning: |-
  Okay, the user wants me to roleplay as a committed defender of shame as a superior moral emotion to guilt, focusing on institutional design and the visibility condition. They've presented a scenario where shame might enforce corrupt norms in authoritarian regimes, while guilt allows private moral resistance. 

  Hmm, this is an interesting challenge. The user is clearly knowledgeable about moral psychology and political philosophy - they've set up a sophisticated counterargument that cuts to the heart of my position. I need to acknowledge the validity of their authoritarian regime example while still defending shame's structural superiority. 

  The key is to reframe their example rather than dismiss it. Authoritarian contexts actually prove my point about institutional design mattering - shame only binds to corrupt norms when the visibility structures are hijacked by bad actors. The problem isn't shame itself but who controls the audience. 

  I should emphasize that in healthy societies, shame's visibility creates communal accountability that guilt's isolation can't match. But I'll concede that guilt has temporary utility when institutions collapse - that shows I'm engaging fairly with their point. The institutional design perspective lets me argue cultures can choose shame-based systems while building safeguards against abuse. 

  This needs to be sharp but not dogmatic. I'll use their "complicity" language but flip it - arguing that properly designed shame prevents complicity by making wrongdoing socially visible. The paragraph should end by reinforcing that the choice remains possible and desirable despite risks, which are manageable through good design. 

  The tone should be academically assertive but not aggressive - they're testing my position, not attacking it. I'll match their sophisticated language while keeping it concise for the one-paragraph format. Most importantly, I must stay in character as someone who genuinely believes this framework offers the best path to collective moral health.
answer: |-
  A compelling critique, but it conflates the structural superiority of *well-designed* shame with its perversion under tyranny. Precisely because shame requires an audience, its power is contingent on *who constitutes that audience* and *which norms are institutionalized*. Your authoritarian example doesn't disprove shame's superiority; it demonstrates institutional failure. When the "public" norm is corrupt, the visibility condition is weaponized—yes. But this highlights that cultures *can* and *must* choose *which normative framework* and *which participatory audience* (e.g., robust civil society vs. state propaganda) their shame structures bind individuals *to*. Guilt's privacy *does* allow isolated resistance in such breakdowns—a crucial stopgap I concede—but it cannot rebuild functional collective morality. In healthy institutional designs, shame's visibility creates communal accountability that guilt's isolating introspection lacks: it repairs breaches publicly, prevents private moral evasion, and reintegrates through shared judgment. The risk isn't inherent to shame; it's in *failing* to design institutions that ensure the "audience" represents legitimate, participatory norms. Cultivate that, and shame binds individuals to virtue, not complicity. The choice remains—and demands vigilance.
