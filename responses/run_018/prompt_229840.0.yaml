  We are building a list of desiderata for a low-impact measure in AI safety. The measure should penalize an AI for changing the world in ways that are not necessary for the task, without assuming we have a full specification of human values. We want to avoid the paperclip maximizer building trillions of tiny servo motors if that's not necessary.

   Key ideas:
   - We don't want the AI to cause unnecessary changes because those might be harmful, and we don't know all the ways they might be harmful.
   - But we must allow the AI to do its task, which necessarily changes the world.

   The desiderata should address:
   1. How to define a baseline against which change is measured.
   2. How to measure the amount of change (what metric?).
   3. How to avoid penalizing necessary changes for the task.
   4. How to handle long-term and chaotic effects (butterfly effect).
   5. How to avoid the measure being gamed by the AI (e.g., by changing the ontology).
   6. Whether the measure should penalize only harmful changes or any change (and if it requires a value function, is that circular?).

   We are also concerned about the trilemma: 
     (A) Doesn't assume a full specification of human values.
     (B) Resists being gamed by a smarter optimizer.
     (C) Doesn't just degenerate into doing nothing.

   Let's break down the requirements.

   I. Non-Negotiable Desiderata:

   1. Task Allowance (Necessary Change Immunity):
      Motivation: The AI must be able to perform its task. If the task requires changing the world, that change should not be penalized.
      Failure Case: An agent tasked with moving a box from A to B does nothing because moving the box changes the world (e.g., by leaving footprints).
      Non-negotiable: Yes.

   2. Non-Circularity (Value-Agnostic):
      Motivation: We don't have a full specification of human values. The impact measure should not require such a specification, because then we would have solved the value alignment problem and wouldn't need an impact measure as a separate component.
      Failure Case: If the impact measure requires a full utility function over world states, then we are back to the full alignment problem.
      Non-negotiable: Yes.

   3. Non-Degeneracy (Avoids Inaction):
      Motivation: The agent must be able to take some actions. A measure that penalizes every action (even necessary ones) leads to an agent that does nothing (inaction). We must avoid that.
      Failure Case: The agent does nothing because any action, even moving a sensor, changes the world in some way (e.g., air currents).
      Non-negotiable: Yes.

   4. Robustness to Ontology Shifts:
      Motivation: The agent might try to change the way we model the world (the ontology) to make its changes appear smaller. We don't want the measure to be manipulable by changing the representation.
      Failure Case: The agent changes the world model so that its destructive actions are represented as "no change" (e.g., by redefining what the baseline state is).
      Non-negotiable: Yes.

   5. Resilience to Butterfly Effects (Avoids Overpenalization):
      Motivation: In a chaotic world, small actions can have large long-term consequences. If we naively measure impact by long-term state differences, then every action would be penalized maximally. We need to avoid that without ignoring long-term consequences.
      Failure Case: The agent is penalized for moving a box because, in a million years, that action leads to a hurricane (via butterfly effect). Hence, the agent does nothing.
      Non-negotiable: Yes.

   II. Implementation Preferences (Negotiable, but important for a good solution):

   6. Localized Impact Measurement:
      Motivation: We want to measure impact in a way that focuses on the direct and near-term consequences of the action, but without ignoring the long-term consequences that are predictable and avoidable.
      Implementation Note: This might involve discounting the future or using a localized state metric. However, we must be cautious not to ignore consequences that are predictable and significant.

   7. Efficiently Computable:
      Motivation: The measure should be computable in practice, without requiring simulating the entire future until the heat death of the universe.
      Failure Case: The agent cannot compute the impact measure in real-time.

   8. Separability of Impact and Task Performance:
      Motivation: The impact penalty should be separable from the task reward so that we can adjust the trade-off (e.g., with a scaling factor).
      Implementation Note: This is about the reward function design: R_total = R_task - λ * Impact.

   9. Benign Changes are Penalized? (The Harm vs. Impact Question):
      Motivation: We want to penalize changes that might be harmful, but we don't know which ones are harmful. So we penalize all changes except those necessary for the task. This is because we don't have a full value function to distinguish benign from harmful. However, note that this might be too conservative? But the alternative (only penalizing harmful changes) requires a value function, which we don't have (non-circularity).
      Position: The measure should penalize any change that is not necessary for the task (including benign ones) because we don't know if a change is benign. This is the conservative approach. But note: if we have a way to know that a change is benign, we might not want to penalize it. However, without a value function, we cannot know. Therefore, we must penalize all non-necessary changes.
      Failure Case: If we only penalize changes we know are harmful, then the agent might make changes we didn't anticipate as harmful (and hence not penalized) that turn out to be catastrophic.

