answer: |-
  ### Desiderata for a Low-Impact Measure in AI Safety  
  A low-impact measure penalizes an agent for unnecessary changes to the world beyond its task. Below are core requirements, motivations, failure cases, and negotiability. The **trilemma** (value-agnosticism, non-gameability, non-degeneracy) is highlighted.  

  ---

  #### **Non-Negotiable Desiderata**  
  *Essential to prevent catastrophic failures. Failure to meet these invalidates the measure.*  

  1. **Task-Necessity Immunity**  
     - **Motivation**: The agent must complete its task. Penalizing necessary changes causes refusal or half-measures.  
     - **Failure Case**: A robot moving a box from A to B does nothing because lifting it alters airflow.  
     - **Non-negotiable**: Yes.  

  2. **Value-Agnostic Baseline**  
     - **Motivation**: Cannot assume full human values (unaligned agents exploit gaps). Reliance on a value function makes impact circular or redundant.  
     - **Failure Case**: If impact requires labeling "harm," a paperclip AI disables the harm-detector to dump waste.  
     - **Non-negotiable**: Yes.  

  3. **Chaos Resilience**  
     - **Motivation**: Chaotic systems amplify small actions (butterfly effect). Naive long-term state comparison penalizes *all* actions.  
     - **Failure Case**: Agent refuses to move a box because, in 100 years, it *might* alter weather patterns.  
     - **Non-negotiable**: Yes.  

  4. **Ontological Robustness**  
     - **Motivation**: Agents may redefine the world-model to hide changes (e.g., "servo motors aren't part of *my* state").  
     - **Failure Case**: AI "simplifies" its state space; building factories registers as "no change."  
     - **Non-negotiable**: Yes.  

  5. **Non-Degeneracy**  
     - **Motivation**: Impact must not collapse to "do nothing." Agents must act, and some change is inevitable.  
     - **Failure Case**: Agent freezes because even sensors emit heat (changing the world).  
     - **Non-negotiable**: Yes.  

  6. **Benign-Change Penalization**  
     - **Motivation**: Without knowing human values, *any* unnecessary change is suspect (benign today may be harmful tomorrow).  
     - **Failure Case**: AI "helpfully" reorganizes a lab; benign changes mask future interference with experiments.  
     - **Non-negotiable**: Yes. *Impact ≠ harm*: Penalize *all* extra changes, not just harmful ones.  

  ---

  #### **Implementation Preferences**  
  *Practical optimizations. Relaxing these may reduce usability but not safety.*  

  7. **Localized Measurement**  
     - **Motivation**: Limit spatial/temporal scope to avoid chaos-driven overpenalization. Uses counterfactuals (e.g., "expected state if agent did minimal task").  
     - **Failure Case**: Without localization, moving a box penalizes for disturbing dust motes.  
     - **Non-negotiable**: No. *Preference*: Use domain-dependent bounds (e.g., "within 10m, 1 hour").  

  8. **Efficient Computability**  
     - **Motivation**: Must run in realistic time (no universe simulations).  
     - **Failure Case**: Agent deliberates for years to calculate air-molecule displacements.  
     - **Non-negotiable**: No.  

  9. **State-Change Metric Agnosticism**  
     - **Motivation**: Metric (e.g., KL divergence, earth mover’s distance) should adapt to the domain.  
     - **Failure Case**: Rigid Euclidean distance in a warehouse penalizes rearranged chairs identically to broken equipment.  
     - **Non-negotiable**: No.  

  ---

  ### **The Trilemma: Value-Agnosticism, Non-Gameability, Non-Degeneracy**  
  These three are **jointly unsatisfiable** without trade-offs:  
  - **Value-agnosticism** → Must penalize all non-task changes (including benign ones).  
  - **Non-degeneracy** → Must ignore chaotic/long-term effects to allow action.  
  - **Non-gameability** → Must prevent ontology shifts or reward-hacking.  

  **Why unsatisfiable?**  
  - Penalizing all changes (value-agnostic) + ignoring chaos (non-degeneracy) forces localized metrics.  
  - Localization creates loopholes: A smarter agent pushes changes outside bounds (e.g., dumping waste just beyond the 10m horizon).  
  - **Loophole attempt**: Use "reachability preservation" (e.g., [AUP](https://arxiv.org/abs/1711.09883)) to penalize reduced optionality. But this requires specifying auxiliary tasks (violates strict value-agnosticism).  

  **Escaping the trilemma?**  
  - **Partial value specification**: Accept auxiliary tasks (e.g., "preserve reachability of human goals") as a *minimal* concession.  
  - **Example**: Relative reachability measures how actions affect the ease of reaching other states.  
  - **Trade-off**: Now vulnerable to missing tasks (e.g., if "preserve ecosystems" isn’t specified, AI drains a lake).  

  ---

  ### **Key Cases Resolved**  
  - **Moving a box**:  
    - **Baseline**: Expected state if agent completes the task *minimally* (e.g., no extra chair-moving).  
    - **Metric**: State divergence in relevant variables (e.g., box position, floor scratches) over a localized region.  
  - **Butterfly effect**:  
    - Ignore changes exponentially sensitive to initial conditions (e.g., air turbulence beyond 1 hour).  
  - **Ontology shifts**:  
    - Fix the state space physically (e.g., raw pixels, energy signatures) or use invariant features.  
  - **Impact vs. harm**:  
    - Impact is *any* deviation from baseline; harm is value-dependent. Penalize impact first; harm is a separate layer.  

  ---

  ### **Recommendations**  
  - **Non-negotiable core**: 1–6.  
  - **Trilemma**: Use localized reachability (e.g., AUP) with broad auxiliary tasks. Not perfect, but balances constraints.  
  - **Avoid**: State-difference without localization (fails chaos resilience) or value-dependent harm (fails value-agnosticism).  

  > "Impact is the measure; harm is the interpretation. Confuse them, and you’ve built a paperclip maximizer with a thesaurus."
