answer: |-
  Your critique of Fuller's internal morality of law through the Rex Secundus hypothetical is astute, but rests on a misreading of Fuller's position and the purpose of his desiderata. Let's engage systematically:

  1.  **Fuller's Internal Morality: Scope and Constraint**
      *   Fuller's eight principles constitute an *internal* morality of law, meaning they are inherent to the enterprise of governing human conduct through rules. They are procedural and relational, focused on the conditions necessary for law to guide behavior effectively.
      *   **They are not primarily designed to directly constrain the *substantive justice* of legal rules.** A system could, in theory, be procedurally perfect (by Fuller's criteria) yet substantively evil, as Rex Secundus demonstrates.
      *   **However, they impose an *indirect* substantive constraint:** Fuller argues that adherence to these principles fosters reciprocity between ruler and ruled, treating citizens as capable of understanding and following rules. This implicitly respects human dignity and agency. A system designed for slavery fundamentally violates this reciprocity – the enslaved are not genuine subjects of the law capable of fidelity to it; they are objects of the law created for others' benefit. This violates the *spirit* of the enterprise, even if technically adhering to the letter of the eight criteria. Fuller explicitly states that extreme injustice undermines the very purpose of law and the possibility of citizens having a "fidelity to law".

  2.  **Rex Secundus Assessment: Genuine Challenge or Misreading?**
      *   **Rex Secundus exposes a tension but does not undermine Fuller's core position.** It successfully shows that the eight desiderata alone are insufficient *guarantees* of substantive justice. Fuller readily acknowledged this ("A dictatorship... can be as wantonly cruel... while scrupulously observing the principles of legality").
      *   **It rests on a misreading regarding "perfect" satisfaction:** Rex Secundus likely *cannot* perfectly satisfy all eight criteria while enforcing hereditary chattel slavery and disenfranchisement.
          *   **Temporal Stability & Possibility of Compliance:** A rigid, hereditary caste system *denies* the possibility of legal change for the enslaved/disenfranchised, violating the spirit of stability linked to the possibility of amendment based on experience and argument. Compliance is coerced, not based on understanding and acceptance within a reciprocal framework.
          *   **Congruence & Clarity/Consistency:** Applying rules "with exact fidelity" to enforce inherent, immutable statuses based on birth creates a system where rules *about* the enslaved (e.g., property rules) are applied faithfully, but rules *for* the enslaved (if any exist beyond commands) are fundamentally different in kind and deny them the status of full legal subjects, creating an inherent inconsistency in the system's conception of personhood and agency.
          *   **Generality & Reciprocity:** The system denies the enslaved/disenfranchised the status of full legal persons capable of the reciprocity Fuller saw as essential. Rules *apply* to them, but are not *for* them as autonomous agents in the same way they are for the ruling caste. This fractures the generality required for a truly common enterprise of law.

  3.  **Hart's Separation Thesis Outcome**
      *   **Rex Secundus strongly reinforces Hart's Separation Thesis.** Hart argued that the existence of a legal system is a matter of social fact (primary/secondary rules + general acceptance), separable from its moral merit. Rex Secundus is a paradigmatic example: a wicked regime can possess a highly sophisticated, procedurally impeccable legal system. Hart would readily classify Rex Secundus's rules as valid law, however morally repugnant. The case demonstrates that procedural regularity (Fuller's internal morality) is distinct from substantive justice.

  4.  **Debate Resolution Status**
      *   **The Hart-Fuller debate is not dissolved into mere terminology.** Rex Secundus highlights the *difference* between the two positions:
          *   **Fuller:** Law has an inherent moral dimension due to its purpose (subjecting human conduct to governance) and the procedural principles necessary to achieve that purpose effectively, which indirectly constrain substance by demanding reciprocity and respect for agency. Extreme injustice undermines law's existence.
          *   **Hart:** Law's existence is a social phenomenon identifiable without moral judgment. Procedural regularity (efficacy/sociology) is necessary for a legal system to *exist*, but is conceptually distinct from morality. Rex Secundus is valid, evil law.
      *   The debate persists because it concerns the fundamental nature of law: Is the concept of law purely descriptive (Hart) or does it contain ineliminable normative elements tied to its function (Fuller)? Rex Secundus doesn't resolve this; it illustrates the consequences of each view.

