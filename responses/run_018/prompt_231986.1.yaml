answer: |-
  **Formal Epistemology Final Examination**
  **Question 1 (20 Marks)**
  **Time Allowed:** 90 Minutes

  **Read the following scenario carefully:**

  Alice and Bob are Bayesian rational agents. They are about to observe the outcome of a coin flip (Heads or Tails). Both agents have credences defined over the state space. Alice assigns a prior probability of 0.7 to the event E: "The coin lands Heads". Bob assigns a prior probability of 0.3 to E. These priors are not common knowledge.

  Each agent then receives some private information about the coin's bias. After processing their private information, Alice announces her posterior credence in E is 0.8. Bob announces his posterior credence in E is 0.4. Crucially, it becomes *common knowledge* between Alice and Bob that Alice’s posterior is 0.8 and Bob’s posterior is 0.4.

  Both agents are rational in the standard decision-theoretic sense: they are expected utility maximisers with probabilistically coherent degrees of belief (they satisfy the Kolmogorov axioms and update via conditionalisation on their evidence). They also have common knowledge of each other’s rationality in this decision-theoretic sense.

  **Essay Prompt:**

  1.  **Explain** why the described situation, where Alice and Bob disagree (with posteriors 0.8 and 0.4 for E) despite common knowledge of these posteriors and common knowledge of each other’s decision-theoretic rationality, is *not* a counterexample to Aumann’s agreement theorem.
  2.  **Identify precisely** which key assumption of Aumann’s agreement theorem fails to hold in this scenario. Explain why this failure allows disagreement to persist even under common knowledge of the posteriors.
  3.  **Discuss critically:** Based on this analysis, what does Aumann’s agreement theorem genuinely establish regarding the possibility of rational disagreement among Bayesian agents? Specifically, assess the roles played by the common prior assumption and differences in agents' information (as represented by their information partitions) in enabling or preventing disagreement under common knowledge of posteriors. Does the theorem imply that rational agents with different priors *must* disagree, or that rational agents with the same prior *cannot* disagree? Justify your answer.

  ---

  **Model Answer (Approx. 800 words):**

  Aumann’s agreement theorem is frequently summarised as proving that “rational agents cannot agree to disagree.” However, this gloss can be misleading. The theorem rigorously establishes that if two (or more) Bayesian agents have a *common prior probability distribution* over a finite state space, and their posterior probabilities for a specific event E are *common knowledge*, then these posterior probabilities must be equal. The scenario described, featuring Alice and Bob with common knowledge of their differing posteriors (0.8 and 0.4) and common knowledge of their decision-theoretic rationality, appears to contradict this conclusion. Nevertheless, this situation is fully compatible with Aumann’s theorem because it violates a fundamental assumption of the theorem: the **common prior assumption (CPA)**.

  The failure of the CPA is the precise reason why disagreement persists despite common knowledge of the posteriors (CKP) and common knowledge of rationality (CKR) in the decision-theoretic sense. Alice and Bob begin with radically different prior beliefs about E (0.7 vs. 0.3). Crucially, these priors are *not* common knowledge. Aumann’s proof relies critically on agents starting from the *same* prior probability measure. This common prior encodes a shared initial view of the world’s possibilities and their likelihoods. When agents update this common prior on their respective private information (represented by different information partitions), the CKP condition forces a powerful consistency. If they had the same prior and CKP, the theorem dictates that they must have effectively conditioned on the same information *set* within the common knowledge partition defined by CKP, leading to identical posteriors.

  However, without a common prior, this mechanism breaks down entirely. Alice and Bob are each fully rational: they coherently hold priors, update via conditionalisation on their genuine private evidence, and maximise expected utility. CKR in this sense is upheld. CKP is also satisfied – they both know each other's posteriors, know that they know, and so on. Yet, their disagreement stems fundamentally from their divergent starting points. Alice could have received evidence that boosted her high initial credence slightly higher (0.7 -> 0.8), while Bob could have received evidence that slightly increased his low initial credence (0.3 -> 0.4). Because their priors differ and are not common knowledge, CKP does not generate the contradiction that arises under the CPA. The CKP condition cannot force agreement because it doesn't constrain the *relationship* between their different prior models and their different information; it only fixes the final posterior values they announce.

  It is essential to distinguish CKP from **common knowledge of evidence or information partitions**. This is a common point of confusion. The scenario specifies CKP (common knowledge of the *result* of updating: posteriors 0.8 and 0.4) but *not* common knowledge of what specific evidence each agent received or the structure of their information partitions. Alice knows her own evidence and partition cell, Bob knows his, but they do not necessarily know what the other knows or how the other’s partition is structured. Bob knows Alice’s posterior is 0.8, but he does not necessarily know *which piece of evidence* led her to that posterior, given *her* prior. Crucially, Aumann’s theorem does *not* require common knowledge of evidence; it requires CKP *and* the CPA. Agents can have entirely private information but still be forced to agree *if* they share a common prior and CKP holds. In our scenario, their different priors shield them from this forcing effect.

  Therefore, Aumann’s theorem establishes a very specific result: **Under a common prior and common knowledge of posterior probabilities, agreement is inevitable.** It does *not* primarily establish a result about rationality per se. While rationality (coherence and conditionalisation) is a background assumption, the CPA is the linchpin. The theorem shows that differences in posterior beliefs under CKP are *only* possible if agents either:
  1.  **Lack a Common Prior:** They started with fundamentally different assessments of the initial possibilities (as with Alice and Bob), or,
  2.  **Lack Common Knowledge of Posteriors:** Their differing beliefs are not completely transparent to each other in the common knowledge sense.

  The theorem has no direct implication for agents with *different priors*. It does *not* imply that rational agents with different priors *must* disagree. They could potentially agree if their different priors and different evidence somehow led to the same posterior. More importantly, the theorem *does* imply that rational agents with a *common prior* and *common knowledge of their posteriors* *cannot* disagree. If they share a prior and CKP holds, agreement is logically compelled. Disagreement under a common prior is only possible if their posteriors are *not* common knowledge – that is, if there is some residual uncertainty about what the other believes, even if they announce their beliefs.

  In conclusion, the scenario highlights that Aumann’s theorem is fundamentally about the constraining power of the common prior assumption combined with common knowledge of beliefs, *not* about rationality alone. Rational disagreement is perfectly possible, even under CKP, when agents have different priors. The theorem’s significance lies in showing that within a shared Bayesian framework (common prior), complete transparency of beliefs (CKP) eliminates the possibility of disagreement, irrespective of differences in private information.

  ---

  **Marking Scheme (20 Marks Total)**

  *   **General:** Answers must demonstrate understanding of Aumann’s theorem, the scenario, and the concepts of common knowledge, common prior, Bayesian rationality, and information partitions. Clarity, precision, and logical flow are essential. Use British English spellings (e.g., rationalise, prior, posterior, common knowledge, analyse).

  *   **First-Class Answer (18-20 Marks):** Must comprehensively address all parts of the prompt with precision and insight. Key requirements:
      1.  **Clear Explanation of Compatibility:** Explicitly states the scenario violates the CPA, which is a necessary theorem assumption, hence no contradiction.
      2.  **Precise Identification of Failed Assumption:** Correctly identifies the **Common Prior Assumption (CPA)** as the failed assumption and explains *why* its failure allows disagreement under CKP (different starting points, no shared framework for CKP to enforce consistency).
      3.  **Distinction CKP vs. CK of Evidence:** Explicitly distinguishes Common Knowledge of Posteriors (CKP) from Common Knowledge of Evidence/Information Partitions. Explains that the scenario has CKP but *not* necessarily CK of evidence/partitions, and that Aumann’s theorem requires CKP but *does not* require CK of evidence.
      4.  **Role of Information Partitions:** Mentions or implies the role of different information partitions as the mechanism for updating, but notes CPA failure is the root cause here.
      5.  **Accurate Assessment of Theorem's Meaning:**
          *   Correctly states the theorem shows agreement is *necessary* under CPA *and* CKP.
          *   Explicitly states the theorem is *not* primarily about rationality (CKR) but about the CPA + CKP combo.
          *   Correctly concludes that rational agents with a common prior *cannot* disagree under CKP.
          *   Correctly concludes that rational agents with *different* priors *can* disagree even under CKP (as per the scenario).
          *   States that disagreement under a common prior requires *lack* of CKP.
      6.  **Logical Structure and Clarity:** Well-organised, fluent, and logically rigorous argument.

  *   **Upper-Second Answer (16-17 Marks):** Addresses all parts of the prompt well but may lack the full depth, precision, or clarity of a first-class answer. Likely characteristics:
      1.  Correctly identifies the CPA failure as the reason for compatibility.
      2.  Identifies CPA as the failed assumption and provides a basic explanation.
      3.  Acknowledges CKP vs. CK of evidence distinction but perhaps less explicitly or without fully explaining its relevance to the theorem's requirements.
      4.  Understands the theorem necessitates agreement under CPA+CKP.
      5.  Correctly states rational agents with different priors can disagree under CKP.
      6.  May be slightly less precise in stating what the theorem *does not* say about rationality or agents with different priors.
      7.  Generally well-structured and clear.

  *   **Common Errors and Mark Deductions:**
      *   **Error 1: Confusing Rationality with Common Prior (3 Mark Deduction):**
          *   **Error:** Claiming the scenario violates the theorem because the agents aren't "rational" in the sense required by Aumann, or arguing the theorem *shows* rational agents cannot disagree.
          *   **Why:** Students often misread the common gloss ("rational agents can't disagree") as the theorem's core claim, overlooking the CPA's foundational role stated in the formal proof.
          *   **Deduction:** Deduct **3 marks**. This indicates a fundamental misunderstanding of the theorem's assumptions versus its conclusion regarding rationality.
      *   **Error 2: Conflating CKP with CK of Evidence/Information (2 Mark Deduction):**
          *   **Error:** Arguing that CKP in the scenario implies common knowledge of the agents' evidence or information partitions, or claiming Aumann's theorem requires common knowledge of evidence.
          *   **Why:** Students intuitively link knowing the posterior to knowing the evidence that caused it, and may misremember the theorem's assumptions. The theorem's reliance on partitions is abstract.
          *   **Deduction:** Deduct **2 marks**. This shows confusion about the specific common knowledge condition required (posteriors) and the private nature of information (partitions) permitted under the theorem.
      *   **Minor Errors (1 Mark Each):** Misstating posteriors/priors from the scenario, vague definitions of common knowledge or CPA, minor logical inconsistencies, poor structure impacting clarity. Avoid excessive nit-picking; focus on conceptual accuracy.

  *   **Breakdown (Guide):**
      *   Part 1 (Explanation of Compatibility): 5 marks (Focus: CPA failure)
      *   Part 2 (Identify Failed Assumption & Why): 5 marks (Focus: CPA, explanation of why it allows disagreement under CKP)
      *   Part 3 (Critical Discussion): 10 marks (Focus: Correct interpretation of theorem's scope re: CPA, information, disagreement; distinction CKP/CK evidence; implications for same/different priors).
      *   Deductions applied from total as per errors listed above.
