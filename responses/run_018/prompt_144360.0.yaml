answer: |-
  Here’s a structured analysis addressing your three core questions, grounded strictly in Tolstoy’s *What Is Art?* and designed to sharpen your argument without anachronistic imports:

  ### 1. **Accuracy of Your Reading: Tolstoy’s "Principled" Distinction?**  
     - **Your Reading is Largely Correct:** Tolstoy unequivocally defines art by *infection* (successful transmission of feeling) but restricts "good art" to feelings promoting universal brotherhood, Christian love, and moral unity (*"the very best feelings"*). He explicitly condemns art transmitting "bad feelings" (e.g., pride, sexual desire, despair) as either "counterfeit" or morally pernicious.  
     - **No Robust Category for Complex Feelings:** Tolstoy lacks a framework for morally ambiguous affects. For him:  
       - Feelings are binary: either "unite all people" (good) or "unite some while dividing others" (bad) (Ch. 15).  
       - Complexity is treated as *corruption*, not nuance. Mixed feelings (e.g., reverence tainted by horror) would be deemed "incoherent" or "exclusive" (thus non-universal).  
       - **Key Evidence:** His dismissal of Greek tragedies (e.g., *Oedipus Rex*) and Shakespeare—works he admits provoke strong emotions—but rejects due to "false" morality (Ch. 12). He labels their emotional impact as harmful, not artistically invalid but *ethically* disqualifying.  
     - **Conclusion:** Tolstoy resolves complexity via exclusion. If a feeling isn’t purely "good," its successful transmission renders the work either non-art or "bad art" (a category he tacitly accepts while denying artistic legitimacy).

  ### 2. **Validity of "Affective Dissonance" as an Internal Contradiction:**  
     - **Genuine Contradiction (Not Anachronistic):**  
       - **Tolstoy’s Infection Criterion:** "Art begins when [one] *infects* others" (Ch. 5). Success hinges on sincerity and technical mastery, *not* moral content.  
       - **Moral Criterion’s Overreach:** When Tolstoy rejects Wagner or Baudelaire despite conceding their technical proficiency (Ch. 12–13), he implicitly admits infection occurred *but denies its artistic legitimacy*. This subordinates infection to morality, contradicting his definitional primacy of infection.  
       - **Historical Plausibility:** Tolstoy knew artworks evoking complex affects (e.g., Dostoevsky’s novels, which he criticized). His theory *could* accommodate dissonance but deliberately chooses not to. His emotional categories ("good" vs. "bad") are reductive by design—rooted in his radical Christian ethics—not a product of 19th-century limitations.  
     - **Why It’s Not Anachronistic:** Tolstoy explicitly grapples with works transmitting "mixed" feelings (e.g., religious art depicting suffering). He resolves this by reinterpreting the feeling as *singular* and morally pure (e.g., true Christian art transmits only "love of God and man," discarding horror as accidental). Your critique exposes his *deliberate* refusal to engage affective complexity.  

  ### 3. **Resolving the Tension Within Tolstoy’s Framework:**  
     - **Option 1: Relax the Moral Criterion**  
       - *Problem:* Contravenes Tolstoy’s entire thesis—morality is *constitutive* of art’s purpose. Without it, art becomes mere "pleasure," which he despises.  
     - **Option 2: Refine the Infection Criterion**  
       - *Tolstoyan Possibility:* Argue that morally mixed feelings *cannot* be sincerely or universally infectious. Tolstoy claims "good" feelings alone are universally accessible (Ch. 16). Dissonant feelings might be deemed *technically incomplete infections* (e.g., causing confusion, not unity).  
       - *Weakness:* Contradicts his praise for simple, unambiguous folk art while ignoring works that *do* infect broadly with complexity (e.g., Goya’s *Disasters of War*).  
     - **Option 3: Accept Normativity (Strongest Resolution)**  
       - **Tolstoy’s Theory is Inherently Normative:** He isn’t describing art *as it is* but *as it should be*. The "tension" is thus intentional: infection defines art’s *mechanism*, but morality defines its *purpose*.  
       - **Implication for Your Argument:** The contradiction isn’t logical but ideological. Tolstoy *prioritizes* morality over descriptive consistency. His dismissal of dissonant works isn’t a flaw—it’s the theory’s core commitment.  

  ---

  ### Recommendations to Sharpen Your Argument:  
  - **Leverage Tolstoy’s Own Examples:** Contrast his praise for Schiller’s "universal" lyrics with his rejection of Beethoven’s late quartets (which he admits are "affecting" but "obscure"). Ask: If infection defines art, why is Beethoven excluded?  
  - **Examine "Sincerity"**: Tolstoy requires artists to *feel* what they transmit. Argue that affective dissonance (e.g., compassion + horror) can be sincerely experienced—rejecting it imposes artificial emotional purity.  
  - **Reframe "Brotherhood"**: Could dissonant feelings (e.g., confronting cruelty) *promote* moral growth? Tolstoy’s static ideal of "unity" ignores art’s role in *challenging* moral complacency.  
  - **Concede Strategically**: Grant that Tolstoy *intends* his moral filter to safeguard art’s social function. Then show how this collapses into subjectivity (e.g., who defines "good" feelings?) and excludes transformative art.  

  **Core Irony for Your Essay**: Tolstoy’s theory, meant to democratize art, becomes elitist by prescribing which emotions are "valid." His moral absolutism undermines his empirical criterion of infection—exposing a paternalistic undercurrent in his populism. By clinging to this tension, Tolstoy reveals his deeper project: not a theory *of* art, but a sermon *on* art.
