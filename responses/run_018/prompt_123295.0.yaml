answer: |-
  Here's the distilled desiderata for a serious "consciousness as user illusion" theory, structured for rigor and your specific edge cases. Non-negotiables are bolded; others admit theoretical flexibility but must be addressed.

  ---

  ### **I. Core Phenomena to Explain (The "What")**
  1.  **Qualia & Subjectivity ("The Feel"):** Why does red *feel like that* instead of just being a wavelength discrimination? Explain the *seemingly intrinsic* properties of experience without resorting to magic. *(Non-negotiable - the central mystery)*
  2.  **Illusory Agency & Ownership:** Why do we feel like unified authors of thoughts/actions when evidence (Libet, post-hoc rationalization) suggests decisions arise subpersonally? How does the UI generate the "I did that" tag? *(Non-negotiable - core to the illusion claim)*
  3.  **Fragmentation & State Dependence:** Account for dissolution under psychedelics, dreams, hypnosis, and the lateralized experiences in split-brain patients. Why does the UI break down predictably? *(Non-negotiable - falsifies simple unity)*
  4.  **Temporal Binding Illusion:** How does the UI create a seamless "now" and coherent narrative flow from asynchronous, discrete neural processes (e.g., delayed sensory integration)? Explain the "lag" and post-dating phenomena. *(Essential - key UI function)*
  5.  **Valenced Embodiment:** Why does the UI feel *located* and *own* a body (even in phantom limbs), and why are experiences inherently positive/negative? How is "good/bad for *this* body" baked in? *(Essential - survival relevance)*

  ### **II. Critical Distinctions to Preserve (The "What Not to Do")**
  6.  **Useful ≠ Veridical:** The UI must be *functional* for survival/reproduction without necessarily being an accurate depiction of underlying neural states or external reality (e.g., pain location isn't precise neural activity). *(Non-negotiable - core illusion tenet)*
  7.  **1st-Person Access ≠ 3rd-Person Prediction:** Explain why introspection *feels direct* but is demonstrably inferential, constructed, and often wrong (confabulation). The UI is *accessed* subjectively but *generated* predictively. *(Essential - avoids collapsing perspectives)*
  8.  **Organism-as-User ≠ Subsystem-as-User:** The UI serves the *whole organism's* adaptive needs, not just a specific module (e.g., not *just* the prefrontal cortex). Clarify who/what the "user" is. *(Crucial - avoids homunculi)*
  9.  **Evolutionary Origin ≠ Current Function:** Account for how the UI likely emerged from simpler precursors (e.g., global arousal states, valence systems) and how its function may have expanded (e.g., social recursion) beyond initial drivers. *(Important - prevents teleology)*

  ### **III. Compatibility Constraints (The "How")**
  10. **Predictive Processing Foundation:** The theory must be coherent within a predictive coding/bayesian brain framework (hierarchical inference, prediction errors, precision weighting). UI as the top-level generative model's "user output." *(Non-negotiable - dominant neuro-computational paradigm)*
  11. **Global Workspace Dynamics:** Explain how the UI relates to transient global neural availability (ignition, broadcasting) - is it the *content* of the workspace, the *access* itself, or the *reportable output*? *(Essential - key neural correlate)*
  12. **Binding Solution (Partial):** Address how the UI *appears* unified despite distributed processing. The illusion *is* the binding – explain the mechanism creating this coherence (e.g., temporal synchrony, narrative construction). *(Essential - the binding "problem" is the UI's core feature)*

  ### **IV. Your Niche Requirements (The "Edge Cases")**
  13. **Legacy APIs & Versioning:**
      *   **Exposure:** Why do evolutionarily ancient signals (raw amygdala fear, insular disgust, acute pain) retain intense, poorly-integrated "low-level" access to the UI, bypassing high-level narrative smoothing? (Survival primacy: these signals *must* disrupt).
      *   **Root Access:** Why do social-cognition modules (e.g., theory of mind, reputation tracking) often override deliberate self-reflection in shaping the UI's self-model and narrative? (Social fitness was likely a major evolutionary driver for UI complexity).
  14. **Fabrication vs. Tracking Tension:** Resolve the apparent contradiction: If the UI is entirely fabricated, how can it *reliably track* survival-critical states (e.g., hunger, tissue damage, social threat)? **Potential Path:** The UI is *not a direct readout* but a *highly constrained simulation*. It leverages predictive models *trained* on interoceptive/exteroceptive signals crucial for allostasis. The "fabrication" is in the *format* (qualia, narrative self) and *interpretation*, not the underlying *inputs* or *error signals*. It tracks *relevance* and *action-urgency*, not raw physics. *(This tension is THE critical test - strong illusionism risks epiphenomenalism if tracking fails)*

  ---

  ### **Conflict & Scorecard Highlights**
  *   **Impossible Triad?** A theory claiming **Strong Illusionism (UI is *entirely* fabricated epiphenomenon)**, **Accurate Survival Tracking**, and **Causal Efficacy** is likely untenable. If the UI doesn't track *something* real and influence action, its evolution is inexplicable. *Dennett leans here, risking epiphenomenalism.*
  *   **Legacy API vs. Unity:** Explaining raw fear bursts alongside narrative coherence is hard. Predictive processing handles it via precision weighting (ancient signals get high precision, forcing attention), but the "feel" disconnect remains challenging.
  *   **Veridical Core?** "Weak Interface" theories (e.g., some Global Workspace/Predictive Processing hybrids) posit the UI *selectively renders* genuinely global, high-precision information. This eases the fabrication/tracking tension but risks diluting the "illusion" aspect. *Often more compatible with neuroscience.*
  *   **1st-Person Feel:** All computational models struggle genuinely explaining *why* the informational format *feels like anything*. Dennett dismisses this as a non-problem; Weak Interfaces often punt to emergence/complexity; Strong Illusionists bite the bullet (it *doesn't* feel like anything "extra," that's the illusion). *(This remains the biggest philosophical hurdle)*

  ### **Quick Scorecard (Oversimplified)**
  | Desideratum               | Dennett (Strong Illusion) | Weak Interface | Predictive UI |
  | :------------------------ | :------------------------ | :------------- | :----------- |
  | Qualia ("The Feel")       | ✘ (Dismisses)             | △ (Emergent?)  | △ (Format?)  |
  | Illusory Agency           | ✔✔✔                       | ✔✔             | ✔✔✔          |
  | Fragmentation             | ✔✔                        | ✔✔             | ✔✔✔          |
  | Useful ≠ Veridical        | ✔✔✔                       | ✔              | ✔✔           |
  | 1st-Person ≠ 3rd-Person   | ✔✔                        | ✔              | ✔✔           |
  | Predictive Coding Compat. | ✔                         | ✔✔✔            | ✔✔✔          |
  | Global Workspace Compat.  | △                         | ✔✔✔            | ✔✔           |
  | Legacy APIs               | ✔ (No distinction)        | △              | ✔✔ (Precision)|
  | Fabrication vs. Tracking  | ✘ (Leans epiphenomenal)   | ✔ (Renders)    | ✔ (Simulates) |

  **Key:** ✔✔✔ = Core Strength, ✔✔ = Addresses Well, ✔ = Addresses, △ = Weak/Handwavy, ✘ = Fails/Contradicts

  **The Crux:** A viable theory must be **Weak Illusion/Interface** at minimum – the UI is a *constructed*, *non-veridical*, *compressed representation* **but** it *reliably tracks* survival-critical *state variables* via predictive modeling, and its *format* (qualia, self-model) is *causally efficacious* in guiding action for a complex, social organism. Denying either tracking or efficacy renders the UI evolutionarily inexplicable. Your "legacy APIs" highlight the layered, kludgy nature of the codebase underneath.
