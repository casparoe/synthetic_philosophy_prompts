answer: |-
  ## Adversarial Collaboration Joint Statement: Statue and Clay Problem  
  **Participants:** Unitarianism (U) vs. Pluralism (P)  

  ### 1. Jointly Signed Claims  
  Both parties agree on the following:  

  1.1 **Explanandum**:  
  - Any theory must explain:  
    - The intuition that squashing destroys the statue but not the clay.  
    - Why we count the statue and clay as "one thing" in some contexts (e.g., "this heavy object") but "two things" in others (e.g., "the clay pre-existed the statue").  
    - How modal properties (e.g., "could the statue survive being dented?") differ from the clay’s.  

  1.2 **Squashing Case**:  
  - When the statue is squashed:  
    - The statue ceases to exist.  
    - The clay persists in a deformed state.  
    - This asymmetry requires explanation, not dismissal.  

  1.3 **Counting Objects**:  
  - At the moment the statue is fully formed, there is exactly one portion of bronze/clay in the statue’s location.  
  - Disagreement: whether this entails exactly one *object* (U) or two co-located *objects* (P).  

  1.4 **Digital Scan & Print Scenario**:  
  - A perfect digital scan captures the statue’s form without altering it.  
  - 3D-printing an identical copy in marble creates a new object numerically distinct from the original bronze statue.  
  - This *does not* directly alter the modal properties of the original bronze statue (e.g., its fragility).  
  - However, the scenario may inform debates about whether form is separable from matter.  

  ---

  ### 2. Disagreements Table  
  | Position | Core Formulation |  
  |----------|------------------|  
  | **Unitarianism** | "The statue is identical to the clay. There is one object, which is the clay instantiating temporary, context-dependent properties (e.g., *being statue-shaped*). Persistence conditions are relational: the object ceases to be a statue when it loses its shape, but continues as clay. Form is a mode of matter, not a constituent." |  
  | **Pluralism** | "The statue and clay are two numerically distinct objects occupying the same space. The statue is a compound of matter + form, with form being a non-reducible constituent. They share matter but differ in persistence conditions (e.g., the statue cannot survive radical reshaping; the clay can). Form is a basic ontological principle." |  

  ---

  ### 3. Cruxes  
  **Crux 1: Is form ontologically basic?**  
  - **Concrete Case**: The digital scan/print scenario.  
    - **U Prediction**: The scan shows form is a *pattern*, not an entity. Printing a replica demonstrates that *same form* can be multiply instantiated, but this doesn’t imply form is basic; it’s a repeatable configuration of matter. The original statue’s modal properties (e.g., "could it have been marble?") remain tied to *its matter*.  
    - **P Prediction**: The scan captures form as a *shareable universal*. The replica proves form is separable from matter, supporting form as a constituent. This suggests the original statue’s form *could* have been instantiated in marble, altering our view of its modal profile (e.g., "it might have been marble").  

  **Crux 2: Does object-counting track "joints in nature" or pragmatic utility?**  
  - **Concrete Case**: Counting objects pre-squashing.  
    - **U Prediction**: Counting reflects pragmatics. We say "one object" when ignoring artifacts, "two" when tracking persistence. No deeper joint exists; only matter + properties.  
    - **P Prediction**: Counting tracks objective joints. The clay’s survival through squashing vs. the statue’s destruction reveals two distinct kinds with different essences.  

  **Crux 3: Are persistence conditions intrinsic?**  
  - **Concrete Case**: Could the clay *fail* to survive squashing (e.g., if pulverized)?  
    - **U Prediction**: Yes—persistence depends on contextual properties (e.g., "is it cohesive?"). No fixed "clay essence."  
    - **P Prediction**: No—clay has intrinsic persistence conditions (e.g., maintaining mass); its survival is essential.  

  ---

  ### 4. Verbal Dispute?  
  - **Agreed Verbal Element**: "Object" may be ambiguous.  
    - U uses "object" for *material bodies*; P uses it for *hylomorphic compounds* (matter + form).  
    - **Non-verbal core**: Whether reality includes *form* as a constituent (P) or *arrangement* as a property (U).  
  - **Not Merely Verbal**:  
    - U denies form has causal powers beyond matter’s configuration; P asserts form grounds persistence and destruction (e.g., squashing kills the statue *because* form is lost).  
    - This affects scientific explanations (e.g., biology’s treatment of organisms).  

  ---  
  **Signed,**  
  *Unitarian Delegation* | *Pluralist Delegation*  
  (We continue to disagree but commit to refining these cruxes experimentally.)  

  ---  
  **Note**: Typos preserved per request (e.g., "pre-existed" in 1.1, "hylomorphic" in §4).
