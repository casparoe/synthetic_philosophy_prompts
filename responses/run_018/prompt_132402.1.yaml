answer: |-
  ## Opening Remarks: The Frame Problem & What We Leave in the Field

  Good morning. It’s a pleasure to open this workshop on “What We Leave Out When We Reason.” My name is [Your Name], and for forty years, I ran long-term experiments – the kind where you coax delicate systems into revealing their secrets over months or years, not microseconds. I left the lab bench a while ago, but I’ve spent my retirement puzzling over the *ways* we reason, particularly in science and AI. I come not as a philosopher, but as someone who spent decades wrestling physical reality into yielding data, often wondering *how* we knew what to ignore long enough to get a result.

  That question leads me directly to the **frame problem**. For those less familiar, the frame problem, in its essence, is this: How can a reasoning system – whether artificial or biological – possibly know *everything* that *doesn’t* change when an action is taken? How do we avoid drowning in an infinite sea of irrelevant non-effects? (“Moving this test tube doesn’t cause the moon to change phase, doesn’t alter the stock market, doesn’t make my coffee cold faster…” – you get the idea). Philosophers of AI recognized this decades ago as a profound challenge for building truly intelligent systems.

  Now, here’s where my lab coat feels relevant. Listening to philosophers dissect the frame problem often felt… disconnected from my lived experience. Not wrong, mind you – just addressing something subtly different from what I *did* every day.

  In the lab, solving the frame problem wasn’t about enumeration. I never sat down to write a list: “Non-effects of applying voltage: Gravity constant, speed of light constant, lab temperature stable (assuming HVAC works), colleague’s coffee remains fragrant…” It would be absurd, impossible, and utterly useless.

  Instead, we practiced something I’ll call **“Domain Locking.”**

  Imagine an experiment. Before you even *begin* probing the specific interaction you care about, you spend weeks, months, sometimes years, *locking down* the domain. You stabilize temperatures with nested enclosures and precision controllers. You eliminate vibrations with air tables and deep foundations. You shield from electromagnetic noise with mu-metal cages. You purify materials, calibrate instruments obsessively, and establish rigorous protocols. You create a bubble, a highly constrained, artificially simplified slice of reality.

  This isn't just background *knowledge*; it's an active, physical, and often tacit *practice*. It’s about creating a stable, predictable *field* of conditions – a humming baseline – where the *only* things likely to change significantly are the specific variables you are deliberately manipulating and measuring. The "non-effects" aren't listed; they are *engineered into stability*. The background isn't reasoned *about* constantly; it's *assumed stable* by virtue of this immense physical and procedural effort. We lock the domain, *then* we reason within it. The "frame" isn't derived logically; it's constructed physically and maintained operationally. What we "leave out" isn't deduced; it's actively suppressed or rendered negligible.

  Contrast this with how formal AI often tackles the frame problem: through ingenious *representations*. **Successor-state axioms** try to specify *only* what changes, implying everything else stays the same. **Non-monotonic logics** allow conclusions to be drawn based on "normality" until proven otherwise. These are powerful, elegant tools, born from the need to make reasoning computationally tractable in a symbolic, representational system. They are attempts to *encode* the stability we physically engineer.

  **Here’s the tension I want to pose:**

  1.  **The Scientist's "Lock":** We achieve tractability by physically *creating* a simplified, stable world *first*. Our frame is defined by the boundaries of the locked domain. The "problem" of irrelevant change is largely pre-empted by engineering, not solved by reasoning. The "leaving out" happens *before* formal deduction, through immense practical effort and tacit know-how. It's embodied, situated, and deeply dependent on controlling the physical environment.
  2.  **The Formal AI Approach:** It tackles the problem *within* the reasoning system itself, using logical representations to *infer* stability and relevance. It aims for generality, operating on symbols that *represent* the world. The "leaving out" is handled by the rules of the logic or the axioms.

  **So, are these approaches solving the same problem?**

  The scientist’s domain locking seems fundamentally *pre-conditional*. It creates the stable stage *upon which* reasoning (like planning the next experiment step) can even occur efficiently. It deals with the concrete, noisy, physical chaos by physically excluding it.

  The formal AI approaches seem to be solving the problem *within* a representational space *after* (or without) that physical stabilization. They are brilliant solutions to the problem of reasoning efficiently within a *given* symbolic model, ensuring that inferences don’t get bogged down by irrelevant possibilities inherent in the *representation*.

  **Is the frame problem in the wild, physical world the same beast as the frame problem within a symbolic representation of that world?**

  Does the physicist locking down vibration in a lab address the *same* core challenge as the logician crafting a non-monotonic rule about blocks not moving unless pushed? Or are we, perhaps, looking at two distinct, though deeply related, facets of how intelligence – natural or artificial – manages complexity?

  **This is the open question I hope will frame our workshop:**

  **When we talk about "what we leave out when we reason," are we primarily discussing the *practical, pre-conditional act of stabilizing the world* (the domain lock), or the *formal mechanisms for managing relevance within a representation* (the axioms and logics)? And how do these two crucial ways of "leaving out" interact, conflict, or complement each other in building understanding and intelligence?**

  Scientists, you know the sweat, intuition, and brute force it takes to lock a domain. Philosophers, AI researchers, you grapple daily with the profound difficulties of relevance and change in representation. I spent forty years building locks; I’ve spent my retirement marvelling at your elegant logical keys. I confess, I’m genuinely puzzled about whether the lock and the key are meant for the same door, or if we’re building fundamentally different structures to solve what, on the surface, seems like the same problem of managing the overwhelming complexity of a world where almost everything *doesn’t* change.

  Let’s explore that puzzle together. Thank you.
