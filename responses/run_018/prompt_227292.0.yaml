     - The puzzle: the message only talks about Red, but it can increase the probability of Blue. In our game, we see that betting more on Blue is profitable. Why? Because the message is evidence that, if the soldier is in Red, she is more likely to be in the north. But what if she is in Blue? The message is still true, but it doesn't provide information about Blue. However, because the message is more likely to be "useless" (vacuously true) if the soldier is in Blue, and more informative if in Red, it turns out that the soldier in Blue is more likely to hear this message than one in Red South? Let me explain:

