     Given the time, I choose to be upfront in the debrief: the Judy Benjamin problem is controversial because it doesn't specify how the message is chosen. In our game, we made a specific choice: the message is always sent. In that case, the message should not change the probabilities. However, the literature on the problem often assumes a particular update rule (the minimum relative entropy rule) that leads to an increase in the probability of Blue. Our game showed that if you use that rule, you make money, but that is because we did not specify the true process. In reality, in our game, the true distribution is the prior, and the message is always sent, so the update rule that increases Blue is not calibrated to the world. 

