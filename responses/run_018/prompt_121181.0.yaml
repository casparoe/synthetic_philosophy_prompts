answer: |-
  Here's the joint statement drafted after adversarial collaboration between a committed compatibilist (C) and incompatibilist (I), focusing on agreed fundamentals and precisely framed disagreements with concrete cruxes:

  **Agreed Foundational Claims (Co-Signed):**

  1.  **Determinism Defined:** We agree determinism entails that the complete state of the universe at any time T1, combined with the laws of nature, logically necessitates one unique future state at T2. There are no physically possible alternative futures branching from T1.
  2.  **Frankfurt Cases' Core Function:** Frankfurt-style thought experiments successfully challenge the *necessity* of the Principle of Alternative Possibilities (PAP) for moral responsibility. They demonstrate scenarios where an agent intuitively seems responsible for an action even if they *lacked* the specific ability to do otherwise *in that exact circumstance* due to counterfactual intervention (e.g., Jones votes freely, but Black would have forced him if he tried otherwise).
  3.  **Neuroscience's Current Limits:** Neuroscience has established correlations between neural activity (e.g., readiness potentials) and subsequent conscious decisions/actions. It has *not* conclusively demonstrated that conscious deliberation is *causally inert* or that all decisions are made *unconsciously* prior to awareness in a way that fundamentally undermines agency. Libet-style experiments show neural precursors but do not prove conscious veto is impossible or irrelevant. Neuroscience describes *mechanisms* of decision-making, not the *metaphysical status* of free will.
  4.  **"Ability to Do Otherwise" is the Central Dispute:** The primary disagreement hinges on the correct analysis of "ability to do otherwise" (AP) and its necessity for free will/moral responsibility.
  5.  **Sourcehood is Crucial:** Moral responsibility requires the agent to be the *source* of the action in a robust sense. Disagreement exists on whether determinism precludes this sourcehood.
  6.  **Determinism's Challenge:** Determinism poses a *prima facie* challenge to libertarian free will and traditional concepts of ultimate responsibility. Its compatibility with compatibilist free will is the core dispute.

  **Disagreements & Cruxes (Phrased for Acceptance by Each Side):**

  | Disagreement                                                                 | Compatibilist (C) Acceptance Phrasing                                                                                                 | Incompatibilist (I) Acceptance Phrasing                                                                                                                                 |
  | :--------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Meaning of "Ability to Do Otherwise" (AP) under Determinism?**          | AP refers to the agent's *dispositional properties* and *reasons-responsiveness*: Could/would the agent have acted differently *if* their reasons/motivations had been sufficiently different? | AP requires the *metaphysical possibility* of a genuinely open future branch at the moment of choice, given the *exact* past and laws. Determinism rules out this possibility. |
  | **2. Is Robust Sourcehood Compatible with Determinism?**                     | Robust sourcehood requires the action to issue from the agent's own psychological states (beliefs, desires, character) in a way that is reasons-responsive, not coerced, and appropriately linked to the agent's identity. Determinism does not threaten this; it describes *how* these states cause actions. | Robust sourcehood requires the agent to be the *ultimate originator* (causa sui) of their actions. Deterministic causation, tracing back prior causes (genes, environment) beyond the agent's control, fatally undermines this ultimacy. |
  | **3. Moral Responsibility Requires AP?**                                     | Moral responsibility does *not* require the Frankfurt-case type of AP (ability to do otherwise in that exact circumstance). It requires only voluntariness, intentionality, understanding, and reasons-responsiveness of the mechanism. | Moral responsibility *does* require genuine metaphysical AP (the possibility of a different choice in the exact moment, given the past/laws), which determinism precludes. Frankfurt cases show PAP isn't *sufficient* but are irrelevant to its *necessity* when properly analyzed. |

  **Cruxes with Agreed Test Cases & Predictions:**

  1.  **Crux: Does AP require counterfactual sensitivity (C) or branching possibility (I)?**
      *   **Agreed Test Case:** The "Neurally Monitored Libertarian": Imagine an agent whose brain operates indeterministically (satisfying I's AP requirement). A neuroscientist monitors their brain. If neural indeterminism *isn't* trending towards choice X (which the agent has decisive reasons to make), the neuroscientist will *reliably* but non-intrusively nudge indeterminism to ensure X occurs. The agent chooses X without intervention.
      *   **C Prediction:** Agent IS responsible. Their mechanism was reasons-responsive. AP existed in the relevant sense: they *would* have chosen differently if reasons had been different. The neuroscientist's presence is irrelevant like Frankfurt's Black.
      *   **I Prediction:** Agent is **NOT** (fully) responsible. While *some* indeterminism exists, the *actual* choice wasn't genuinely open due to the scientist's ensuring mechanism. The counterfactual ability (if reasons changed) isn't sufficient; the *actual* ability to do otherwise *in that moment* was constrained.

  2.  **Crux: Does determinism preclude robust sourcehood?**
      *   **Agreed Test Case:** "The Recursive Self-Modeler (RSM)": An agent possesses perfect, real-time recursive self-modeling: they are completely aware of all their internal states (beliefs, desires, subconscious biases) *and* understands that their brain is a fully deterministic system governed by physical laws. Faced with a difficult moral choice, they consciously deliberate, weigh reasons, identify conflicting desires/bias, *and* consciously endorse acting on one specific desire/reason despite knowing their entire process is determined. They act accordingly.
      *   **C Prediction:** RSM exemplifies *peak* responsibility. Their action flows transparently from their deepest endorsed values/desires via a maximally reasons-responsive mechanism. Self-knowledge and endorsement *enhance* sourcehood. Determinism is the medium, not an obstacle.
      *   **I Prediction:** RSM **lacks ultimate responsibility**. While conscious and self-aware, they are merely witnessing and endorsing a process whose causal chain originates entirely outside their control (laws of nature, initial conditions, prior causes). Their endorsement is itself determined. True sourcehood requires being the *uncaused cause* of the chain.

  3.  **Crux: Is Frankfurt-style AP sufficient for compatibilist responsibility?**
      *   **Agreed Test Case:** "The Manipulated Coercee": Jones is covertly and comprehensively manipulated (e.g., via futuristic brain engineering) from birth to develop a specific set of values and desires such that, when presented with Situation S at time T, he *will* inevitably choose Action A, and do so *wholeheartedly* for *his* reasons. Black monitors him; if Jones showed *any* sign of wavering, Black would force A. Jones chooses A freely (by his lights) without Black intervening.
      *   **C Prediction:** Agent is **NOT** responsible. Although he meets the Frankfurt condition (lacked AP in that instance but acted "freely"), the *source* of his mechanism (global manipulation) means his reasons-responsiveness reflects the manipulator's will, not his own authentic self/values. Sourcehood is undermined.
      *   **I Prediction:** This case reinforces I's view. It shows compatibilist conditions (reasons-responsiveness, no coercion *in the moment*) can be met without true responsibility, precisely because ultimate sourcehood is missing. Determinism is analogous to this manipulation.

  This statement captures the core agreements, precisely frames the central disagreements in mutually acceptable terms, and uses concrete, agreed-upon test cases to isolate the fundamental cruxes driving the incompatibilist/compatibilist divide, including your requested niche framing (the RSM case).
