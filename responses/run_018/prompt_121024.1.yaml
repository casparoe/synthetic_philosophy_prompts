  ### Decision-Tree Taxonomy of Responses to the Rietdijk-Putnam Argument

  **Starting Commitment:** Special relativity denies absolute simultaneity (settled physics: Lorentz transformations lack an invariant global simultaneity relation in flat spacetime).

  ---

  #### Internal Nodes (8 Total)

  **N1:** Does the lack of absolute simultaneity entail that there is no metaphysically objective "now"?  
  - **Yes** → Proceed to N2  
  - **No** → Proceed to N3  

  **N2:** Is the Rietdijk-style formulation (relying on spacelike separation and light-speed signaling) the primary challenge to temporal becoming?  
  - **Yes** → Proceed to N4  
  - **No** → Proceed to N5  

  **N3:** Can a privileged foliation of spacetime (e.g., defining global "nows") be recovered without violating Lorentz invariance?  
  - **Yes** → Proceed to N6  
  - **No** → Proceed to N7  

  **N4 (Rietdijk):** Does relativity of simultaneity force spacelike-separated events to be equally real for a given observer?  
  - **Yes** → Proceed to N8  
  - **No** → Leaf D  

  **N5 (Putnam):** Does the requirement for determinate truth values of future events (relative to an observer's present) necessitate the reality of those events?  
  - **Yes** → Proceed to N8  
  - **No** → Leaf D  

  **N6:** Is this Lorentz-invariant foliation (if recoverable) metaphysically relevant (i.e., grounding objective becoming), not just epistemically hidden?  
  - **Yes** → Proceed to N7  
  - **No** → Leaf A  

  **N7:** Which events exist relative to the present hypersurface?  
  - **Only the hypersurface itself** → Leaf B  
  - **The hypersurface and its causal past** → Leaf C  
  - **The hypersurface and its causal future** → Leaf F  

  **N8:** Is temporal reality observer-dependent or frame-invariant?  
  - **Observer-dependent** → Leaf E  
  - **Frame-invariant** → Leaf A  

  ---

  #### Leaves (Philosophical Positions)

  **Leaf A: Four-dimensionalist eternalist block**  
  - *View:* All events in spacetime are equally real, and time is akin to a fourth spatial dimension.  
  - *Awkward commitment:* Denies objective temporal becoming, rendering the apparent "flow" of time illusory.  

  **Leaf B: Presentism with privileged foliation**  
  - *View:* Only events on a single, global present hypersurface exist, but the foliation is empirically inaccessible.  
  - *Awkward commitment:* The foliation breaks Lorentz symmetry if non-invariant (N3→No) or is inexplicably undetectable if invariant (N3→Yes).  

  **Leaf C: Growing-block theory for Minkowski spacetime**  
  - *View:* Reality includes the past and present (growing along the privileged foliation), but not the future.  
  - *Awkward commitment:* Requires a preferred foliation to define the "growth" direction, conflicting with relativity’s symmetry.  

  **Leaf D: Local presentism (past light-cone restriction)**  
  - *View:* Only events in the causal past (past light-cone) of an observer are real at any moment.  
  - *Awkward commitment:* Reality fragments discontinuously across observers, with no shared "present."  

  **Leaf E: Fragmentalism (observer-dependent reality)**  
  - *View:* Reality is confined to an observer’s past light-cone and their current spacelike hypersurface.  
  - *Awkward commitment:* No coherent global ontology; overlapping reality assignments conflict (e.g., event real for one observer, unreal for another).  

  **Leaf F: Future-only existence (unnamed combination)**  
  - *View:* Only events on the future side of the present hypersurface exist.  
  - *Awkward commitment:* Inverts temporal intuition (e.g., memories/records lack present objects to refer to).  
  - *Why no defenders?:* Combines empirical incoherence (future events deterministically cause past illusions) with unattractive denial of agency and memory.  

  ---

  #### Overlapping Leaves & Diagnosis
  - **Leaf A and Leaf F:** Both end in a "block," but Leaf F restricts existence to the future hypersurface alone. The tree separates them cleanly (N7 vs. N8).  
  - **Leaf D and Leaf E:** Both restrict reality to observer-relative domains, but Leaf E includes the spacelike present while Leaf D does not. The tree distinguishes them via N4/N5→N8.  
  - **Leaf B and Leaf C:** Both require a privileged foliation, but the tree separates them at N7 (present-only vs. past-inclusive).  

  **No unresolved overlaps:** All leaves are metaphysically distinct. Potential confusion between **Leaf B (presentism)** and **Leaf C (growing block)** is terminological (e.g., "present" definition) but cleanly resolved by N7’s event-inclusion question.

  ---

  #### Key Distinctions: Settled vs. Contested
  - **Settled physics/logic:**  
    - Lorentz invariance; no global simultaneity in Minkowski spacetime.  
    - Rietdijk-style (spacelike separation) and Putnam-style (future determinateness) arguments are formally valid *if* their premises hold.  
  - **Contested metaphysics:**  
    - Whether relativity *entails* eternalism (denied in Leaves B–E).  
    - Whether frame-dependence undermines objective becoming (affirmed in Leaves D–E; denied in Leaves B–C).  
    - Whether a Lorentz-invariant foliation (if possible) has metaphysical significance (affirmed in N6→Yes; denied in N6→No).  

  *No interpretation is presented as consensus.*
