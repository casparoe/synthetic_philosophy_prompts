  ## Thought Experiment: The Goldfish Grid Gambit

  In the high-stakes verification session for a private auction, conservator Elena confronts "Aquatic Lattice" (2015) by the conceptual artist Chen: an installation specified in Chen's certificate as "one hundred identical, sealed, transparent glass cubes (10x10x10cm), each containing one live common goldfish (Carassius auratus) and filled with purified water, arranged in a precise 10x10 grid on a white plinth under uniform gallery lighting." Chen's certificate explicitly declares this *specific* inaugural gallery installation as the *only* authentic instantiation, forbidding future "authorized" executions despite the work's apparent allographic structure. Elena, deeply familiar with optics and Chen's oeuvre, studies the notated specifications meticulously but has never seen the original gallery installation. She receives testimony from a trusted colleague, Dr. Vance, an expert witness to the original, who states: "Based *only* on the notated specifications being perfectly realized, the work generates a mesmerizing optical moiré effect as light refracts identically through the water and glass across the uniform grid, creating a shimmering, wave-like visual field – *that* is the core aesthetic achievement." The **exact belief** Elena acquires is: *The core aesthetic achievement of "Aquatic Lattice" is a mesmerizing optical moiré effect generated by the uniform refraction of light through the specified grid of identical water-filled goldfish cubes.* She acquires this **purely through testimony** (Vance's assertion) **about the notated specification**, not by encountering the singular gallery instantiation. In nearby worlds where Vance's testimony is **false**, the specifications *don't* produce this effect (e.g., the lighting clause is subtly wrong, or the cube material refracts differently). In worlds where the instantiation **differs** despite matching specifications, the effect might be absent or altered due to unnoticed micro-variations (e.g., minor impurities in the water altering refraction minutely across the grid).

  1.  **Acquaintance Principle Defender's Forced Concession:** Normally, this defender insists that knowing the aesthetic properties of an autographic work (like a unique painting) requires seeing *that particular object*. Here, however, the artwork is *ontologically allographic*: the aesthetic effect Vance describes (the moiré) is *entirely determined* by the physical realization of the notated specifications (material, dimensions, arrangement, contents, lighting). Any object perfectly conforming to the specs *must* produce that identical optical phenomenon, as it's governed by invariant laws of physics. Vance’s testimony about the *specs* reliably indicates the *necessary effect* of any compliant instantiation. The defender must concede Elena gains justified aesthetic knowledge purely from testimony about the specs because the aesthetic property is structurally necessitated by the allographic definition. **Key Structural Feature:** The **ontological allographicity** makes the aesthetic effect specification-dependent and replicable. *If removed* (e.g., if it were a unique sculpture with irreproducible brushstrokes), the acquaintance principle would reassert its standard demand for direct perception of the singular object.

  2.  **Testimonial Permissiveness Defender's Forced Denial:** Normally, this defender holds that if a reliable testifier asserts an aesthetic judgment (e.g., "this painting is garish"), a recipient can gain knowledge via testimony alone. Here, however, the work's *allographic structure* makes direct comparison epistemically essential: Vance’s judgment ("The core aesthetic achievement is the moiré effect generated by the specs") was formed *only* on the singular, declared-authentic instantiation. Crucially, Chen's decree suppressing variability ("only *this* one is authentic") *prevents* the creation of other instantiations that could be compared to confirm the effect arises *solely* from the specs and not from contingent, unrepeatable features unique to that gallery setting (e.g., specific dust particles, air currents, or the exact collective behavior of *those* 100 goldfish subtly altering refractivity). Testimony cannot bridge this gap; Elena cannot know if Vance mistook a contingent feature of the *event* (the specific installation) for a necessary consequence of the *specs*. Only comparing *multiple* instantiations realized under the same specs could confirm the aesthetic effect is inherent to the allographic work, not the autographic presentation. Thus, the permissivist must deny Elena has knowledge, as the testimony chain lacks the essential verification step enabled by variability. **Key Structural Feature:** The **suppression of instantiation-variability** by the artist's authentication clause, preventing the epistemic check inherent to allographic works. *If removed* (e.g., if Chen authorized multiple instantiations), the permissivist could accept testimony about one instantiation as knowledge of the work's aesthetic properties, trusting that variability, if any, would be minor or confirmable.

  **Objection & Response:** A permissivist might object that the case "cheats" by smuggling autographic conditions (artist's decree of singularity) into an allographic domain, artificially blocking the epistemic access provided by multiple instantiations. *Response from within the case's logic:* The ontological status *is* allographic – the specifications define the work type. Chen's decree is a performative act *about* the work's presentation/history, not altering its fundamental ontology. The epistemic problem arises *precisely because* the work *is* allographic: its aesthetic properties *should* be confirmable via multiple instantiations, but the decree prevents this, creating an epistemic gap that testimony alone cannot fill, despite the specifications' apparent completeness. The decree exposes a vulnerability in testimonial chains for allographic works *when* variability is suppressed, demonstrating that the permissivist's standard model relies implicitly on the *possibility* of cross-instantiation verification.
