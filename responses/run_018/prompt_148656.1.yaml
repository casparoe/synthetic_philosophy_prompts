  Okay, the user is running neighborhood deliberative councils with a co-facilitator and has identified three recurring patterns of failure in their 15-person groups, each mirroring historical Athenian failures: the Mytilene pattern (anger-driven collective punishment followed by regret), the Sicily expedition (overcommitting resources to ambitious projects), and the Socrates trial (targeting a persistent dissenter). They want a practical, reusable procedure—essentially a flowchart in words—that can be applied in about ten minutes before decisions involving punishment, shared risk, or complaints about a disruptive voice. The procedure needs to be grounded in democratic theory but accessible to volunteers without academic background.

  The user specifically requests three "gates" corresponding to each failure mode, with concrete test conditions. They also want the procedure to acknowledge points where facilitator judgment is unavoidable (e.g., when emotional temperature requires a recess). Additionally, they provide three hypothetical cases to test the gates: a noise violation fine (Mytilene-type), pooling the entire budget for an infrastructure project (Sicily-type), and silencing a dissenter (Socrates-type). The procedure must be concise enough for a laminated wall guide—no citations or academic references, just paraphrased logic where helpful.

  I need to design a streamlined decision gate system that:
  - Matches the three Athenian failure modes with practical checks
  - Uses plain language and actionable questions
  - Explicitly marks "judgment points" where facilitators must intervene
  - Includes time-boxed components (10-minute total runtime)
  - Handles the three test cases realistically

