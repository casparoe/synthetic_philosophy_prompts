  For the Sicily gate (resource overcommitment), the emphasis should be on risk distribution and fallback plans. The democratic theory underpinning this is sustainable collective action—avoiding catastrophic failure by requiring diversification. The test case with the infrastructure project should trigger recommendations to scale back or phase the project, even against the facilitator's personal bias.

  For the Socrates gate (dissenter exclusion), the priority is procedural fairness over consensus. The philosophy here is deliberative democracy's commitment to minority voice protection. The test case about barring a dissenter from speaking should affirm their right to participate while acknowledging the group's autonomy in engagement—exactly as the user specified.

  For structure, I'll use a consistent format per gate:
  1. Trigger condition (when to activate the gate)
  2. Concrete test questions (3-4 yes/no or scaled items)
  3. Judgment thresholds (e.g., "If >1 question fails...")
  4. Required facilitator actions (recess, revision, etc.)
