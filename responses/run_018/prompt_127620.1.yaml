  **Committee Decision Memo**

  To: University Governance Committee  
  From: Subcommittee on the Institute for Synthetic Judgment  
  Subject: Recommendation for Selection Mechanism for Research Chairs  

  After careful consideration of the provost's proposed ranked-pair veto system and the feedback from various departments, we recommend the adoption of the ranked-pair veto mechanism with an emphasis on transparency and auditability. We also propose a minor modification to the process to enhance clarity and mitigate some strategic risks.  

  **Engagement with the Economists' Argument:**  
  The economists correctly invoke the Gibbard-Satterthwaite (GS) theorem, which shows that no deterministic voting system with at least three possible outcomes and an unrestricted domain of preferences can be both strategy-proof and non-dictatorial. However, the veto mechanism restricts the domain: only those candidates ranked in the top three by their own department are viable. This domain restriction (termed "domain localization" by the philosophy chair) means that the theorem's condition of unrestricted domain is not met. Therefore, the theorem does not automatically preclude a strategy-proof mechanism. Nevertheless, the range of the mechanism (the set of viable candidates) can still include more than two candidates, so the condition on the number of outcomes (at least three) may hold. While the domain restriction offers a theoretical escape from the GS theorem, it does not guarantee strategy-proofness. We acknowledge that strategic manipulation, particularly cross-departmental manipulation of rankings of candidates outside one's own field, remains a risk.  

  **Assessment of the Philosophy Chair's Argument:**  
  The philosophy chair's insight about domain localization is valuable and correctly identifies a structural feature that differentiates our setting. Her proposal to limit the range to at most two candidates at a time would further insulate the system from the GS theorem's implications. However, implementing such a limit in a way that is both fair and transparent is challenging. A knockout tournament (pairwise eliminations) would introduce sensitivity to the pairing order, creating new strategic vulnerabilities. Therefore, we retain the ranked-pairs method for its Condorcet efficiency and relative resistance to agenda manipulation.  

  **Proposed Mechanism:**  
  We recommend the following steps:  
  1. **Veto Step:** Each department ranks all candidates. Any candidate in a department's field not ranked in that department's top three is vetoed and removed from consideration.  
  2. **Ranked-Pairs Step:** The committee uses the ranked-pairs method on the surviving (viable) candidates:  
     a. Compute the pairwise margins between every pair of viable candidates based on the submitted rankings (across all departments).  
     b. Sort these pairwise contests in descending order of the margin of victory.  
     c. Lock in the pairwise results in that order, skipping any that would create a cycle.  
     d. The resulting total order determines the winner (the top-ranked candidate).  

  **Modification:**  
  To address the philosophy chair's concern and to reduce the risk of cycles and strategic voting, we will require that the ranked-pairs step be computed and verified in a public meeting of the governance committee, with detailed documentation of each step. Additionally, we will implement a rule that in the event of a Condorcet cycle, we break the cycle by choosing the candidate with the largest minimum margin of victory in their pairwise contests (a variant known as the "maxmin" method). However, note that the ranked-pairs method already resolves cycles by skipping the creation of a cycle. Our modification is only to the tie-breaking in the ranked-pairs method: if two candidates have the same position in the total order, we break ties by the Borda count among the viable candidates.  

  **Strategic-Risk Objection:**  
  The strongest strategic-risk objection is that departments can misrepresent their preferences for candidates outside their own field to manipulate the pairwise comparisons in the ranked-pairs step. For example, a department might rank a strong candidate from another field artificially low to reduce that candidate's pairwise margins, thereby improving the relative standing of a preferred candidate. This cross-departmental manipulation is possible because the veto power only applies to a department's own field. While the veto step ensures that each department has control over which candidates from their field are considered, the rankings of candidates from other fields remain vulnerable to strategic voting. We cannot eliminate this risk, but the public computation and auditability will make such manipulation more detectable and therefore less likely.  

  **Implementation Timeline:**  
  - **Month 1:** Finalize and disseminate detailed guidelines for ranking and veto procedures.  
  - **Month 2:** Conduct training sessions for all departments on the mechanics and ethics of the process.  
  - **Month 3:** Departments submit their rankings.  
  - **Month 4:** Public meeting to compute the veto step and the ranked-pairs step, with live documentation.  
  - **Month 5:** Announce the selected candidate(s) and issue a report on the process.  

  We recommend a review after two selection cycles to evaluate the effectiveness and any observed strategic behavior.  

  **Conclusion:**  
  We believe the proposed mechanism balances fairness, departmental autonomy, and transparency. While no system is immune to strategic manipulation, the ranked-pair veto system with enhanced transparency measures offers a practical and auditable solution. We therefore recommend its adoption.
