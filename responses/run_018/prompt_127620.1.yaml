  ## Committee Decision Memo: Selection Mechanism for the Institute for Synthetic Judgment Research Chairs  

  ### Recommendation  
  After thorough deliberation, the committee recommends **approving the provost’s ranked-pair veto system** with critical modifications to address strategic vulnerabilities and ensure robustness. The modified mechanism will be implemented on the timeline outlined below.  

  ### Engagement with the Economists' Argument  
  The economists correctly invoke the Gibbard-Satterthwaite (GS) theorem, which proves that no deterministic, non-dictatorial mechanism can be strategy-proof when three conditions hold:  
  1. **Unrestricted domain** (any linear ordering of candidates is permissible).  
  2. **Range includes three or more outcomes** (at least three distinct candidates can win).  
  3. **Collective rationality** (the output is a complete social ordering).  

  The economists contend that the provost’s proposal satisfies these conditions:  
  - The range includes all candidates not vetoed, easily exceeding three outcomes.  
  - Departments can submit any linear ranking, implying an unrestricted domain.  

  Under GS, this would imply inevitable manipulability. We do not dismiss this; it is a foundational result. However, the GS theorem’s conclusions are context-dependent. The philosophy chair’s "domain localization" argument merits rigorous scrutiny to determine if it circumvents GS.  

  ### Assessment of Domain Localization  
  The philosophy chair argues that departmental veto rights structurally restrict the domain and that limiting the range to two candidates per pairing escapes GS. We evaluate this claim:  

  1. **Domain Restriction via Veto**:  
     - The veto clause ("any department can veto a candidate in its own field not in its top three") means departments cannot submit arbitrary linear orderings. For example, a department cannot rank a strong in-field candidate fourth without triggering a veto.  
     - This creates a **structured domain restriction**: only profiles where each department ranks its in-field candidates in the top three positions are admissible. Arbitrary orderings are excluded, violating GS’s unrestricted domain condition.  

  2. **Range Restriction to Two Outcomes**:  
     - The chair proposes limiting the range so "no more than two candidates are in contention simultaneously" across departments. In the provost’s system, pairwise comparisons inherently consider two candidates at a time, but the *global* range (all candidates surviving veto) still exceeds three.  
     - Crucially, the *final social ordering* aggregates these pairwise results into a full ranking, preserving a multi-candidate range. Thus, the range condition for GS remains satisfied.  

  **Conclusion**: Domain localization invalidates GS’s unrestricted domain assumption, but the range still includes three or more outcomes (all non-vetoed candidates). The system is not automatically strategy-proof, but GS does not *mandate* manipulability here. Strategic risks persist but are not inevitable.  

  ### Strategic Risks and Modifications  
  The strongest strategic-risk objection is **cross-departmental collusion**:  
  - **Risk**: Departments can manipulate rankings in non-field pairings to sabotage rivals. For example, Department A might rank Department B’s candidate artificially low to ensure its preferred candidate wins a critical pairwise contest, exploiting the ranked-pair aggregation.  
  - **Impact**: This could distort outcomes without detection, as veto rights only protect in-field candidates.  

  **Modifications to Mitigate Risk**:  
  1. **Restrict Pairwise Comparisons to Viable Sets**: After vetoes, only the top three candidates *per department* advance. The ranked-pair method is applied solely to these "viable" candidates (maximum 18, but likely fewer in practice).  
  2. **Sequential Binary Pairings**: Instead of a full ranked-pair aggregation, use a **randomized knockout tournament**:  
     - **Step 1**: Each department’s top three in-field candidates form the viable pool.  
     - **Step 2**: Randomly pair candidates for departmental votes (e.g., Candidate X vs. Y).  
     - **Step 3**: Winners advance to new pairings until one candidate remains.  
     - **Domain/Range Compliance**: Each vote involves exactly two candidates, reducing the effective range to two per round. The global domain is localized, and the final range is a single winner.  
  3. **Transparency Enhancements**:  
     - All department rankings and vetoes are published pre-tournament.  
     - Pairings are drawn publicly via lottery.  
     - Votes recorded and auditable per pairing.  

  **Why This Addresses GS**:  
  - The domain is localized (restricted by veto rules).  
  - The range is functionally reduced to two outcomes per pairwise vote and one final winner.  
  - While not fully strategy-proof (e.g., misranking in non-critical pairings remains possible), it minimizes incentives for cross-departmental manipulation by isolating decisions to binary choices with no ranked aggregation. The economists’ concern is partially alleviated by breaking the multi-candidate range.  

  ### Implementation Timeline  
  - **Months 1–2**: Refine and document the modified mechanism (viable candidate selection, randomized pairings, audit protocols).  
  - **Month 3**: Training sessions for departments on submission procedures and ethical guidelines (e.g., prohibitions on collusion).  
  - **Month 4**: Pilot test with historical data and simulated voting.  
  - **Month 5**: First live selection cycle:  
    - Week 1: Departments submit rankings.  
    - Week 2: Vetoes applied; viable candidates announced.  
    - Week 3: Public pairing lottery and sequential voting.  
    - Week 4: Winner announced; full audit report published.  
  - **Month 12**: Post-cycle review to evaluate strategic behavior and adjustments.  

  ### Final Recommendation  
  Adopt the **modified ranked-pair veto system** with sequential binary pairings. This approach:  
  - Respects departmental sovereignty via veto rights.  
  - Mitigates GS-range concerns by limiting contention to two candidates per vote.  
  - Prioritizes transparency and auditability, as urged by the economists.  
  - Reduces cross-departmental manipulation risks by eliminating ranked aggregation.  

  The strongest residual risk—collusion in pairwise votes—is partially offset by randomization and publicity. No mechanism is immune to strategy, but this balances fairness, practicality, and theoretical rigor.  

  *Approved unanimously by the Governance Committee.*
