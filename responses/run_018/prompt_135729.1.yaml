prompt: |-
  I was discussing language and reasoning with some friends over coffee, and one of them mentioned a philosophy podcast she had heard summarising a well-known result about everyday "if...then" statements. She relayed the host's account of David Lewis's argument concerning indicative conditionals, and I want to check whether she has captured it fairly or introduced distortions. According to her, Lewis demonstrated that if you treat an indicative conditional "if A, then B" as having a probability equal to the conditional probability of B given A — a view often called Adams's thesis — and you combine this with three apparently innocent rules, namely that conditionals can be freely embedded inside one another, that the negation of a conditional is equivalent to the antecedent paired with the negated consequent, and that probabilities must update in a coherent manner, then you are driven to a trivial result: the probability of the conditional collapses to the unconditional probability of the consequent, so the antecedent carries no weight whatsoever. The host apparently concluded that indicative conditionals therefore lack any real truth conditions and should be regarded as purely pragmatic devices governed by conversational norms rather than by logic; she also noted that Lewis escaped an analogous problem for counterfactuals by analysing them through relations of similarity between possible worlds, leaving indicative conditionals as an unsolved puzzle. My friend added that this implies Bayesian updating with ordinary indicative premises is essentially incoherent, because conditioning on an "if" statement adds no information beyond conditioning on the consequent alone, and she wondered whether a weaker formulation using only import-export rather than full conditional negation avoids the collapse. I am not convinced that the conclusion about Bayesian incoherence follows, and I suspect the summary may conflate Lewis's actual assumptions with stronger ones that critics have added later.

  Please evaluate the fairness of this summary. Present your audit as exactly five numbered items, each one or two sentences long, with no introduction and no conclusion: identify which parts are accurate representations of Lewis's result, which involve subtle overstatements or misattributions of assumptions, whether the leap to pragmatic treatment and Bayesian incoherence is justified, and whether the distinction drawn between indicative and counterfactual conditionals holds up. Keep your response in British English and avoid citing specific page numbers or asking me to consult particular texts.
reasoning: |-
  Alright, let me tackle this query step by step. The user wants an audit of their friend's summary regarding Lewis's argument on indicative conditionals. The summary claims that combining Adams's thesis with three rules leads to triviality, implying conditionals lack truth conditions and cause Bayesian incoherence. 

  First, I need to verify the core of Lewis's result. His 1976 proof did show that P(if A then B) = P(B|A) plus Boolean embedding leads to collapse. The friend correctly notes this forces P(if A then B) = P(B), which is accurate. However, Lewis didn't assume negation equivalence; that was later work by others like Hájek. The summary attributes this to Lewis, which is an overstatement.

  Next, the leap to pragmatic treatment. Lewis did conclude conditionals can't be propositions with truth conditions without collapse, but he explored other options like Stalnaker's approach. The podcast's claim that they "lack any real truth conditions" is a valid interpretation, though not the only one. 

  On Bayesian incoherence: the collapse does imply that updating on "if A then B" equals updating on B alone, making such conditioning redundant. The friend's worry about incoherence seems justified here. 

  For counterfactuals, Lewis's similarity-based analysis does avoid this collapse by differing from Adams's thesis. The distinction holds up. 

  Finally, the import-export point is astute. Weaker principles like import-export alone don't cause collapse, as shown by recent work. The summary correctly identifies this nuance. 

  Overall, the friend captures the main thrust but overattributes negation equivalence to Lewis. The Bayesian concern follows logically, while the counterfactual distinction remains valid. The import-export comment shows good awareness of alternatives.
answer: |-
  Here is the audit as requested:

  1.  **Accurate Core Result:** The summary correctly captures Lewis's central finding: combining Adams's Thesis (P(if A, then B) = P(B|A)) with the assumption that conditionals express propositions embeddable within Boolean operations leads logically to the triviality P(if A, then B) = P(B), rendering the antecedent irrelevant.
  2.  **Misattribution of Negation Rule:** Attributing the specific negation rule ("¬(if A, then B) ≡ A ∧ ¬B") directly to Lewis's original 1976 proof is inaccurate; he derived collapse using more fundamental logical embedding assumptions, while this explicit negation equivalence was emphasised by later authors (like Alan Hájek) exploring related proofs.
  3.  **Overstated Pragmatic Conclusion:** While Lewis argued his result shows indicative conditionals *cannot be straightforward propositions* without collapse, concluding they definitively "lack any real truth conditions" and are *only* pragmatic devices slightly overstates his position; he explored alternatives like Stalnaker's, though finding them problematic.
  4.  **Bayesian Incoherence Follows Logically:** The implication that Bayesian updating using indicative conditionals as premises is rendered incoherent by the collapse *does logically follow*; if P(if A, then B) must equal P(B), conditioning on "if A, then B" provides no information beyond learning B, undermining its use.
  5.  **Valid Distinction & Import-Export Point:** The distinction between indicative and counterfactual conditionals holds up, as Lewis's similarity-based semantics avoids Adams's Thesis. The note about import-export (*P*(if A, then (if B, then C)) = *P*(if A and B, then C)) being potentially sufficient without full negation for collapse is astute; it avoids Lewis's original proof but can still lead to triviality under certain weaker assumptions.
