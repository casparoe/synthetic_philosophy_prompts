     - Pure time preference: the discount rate r reduced the transfer solely because it was going to the future. There was no risk of non-delivery (the transfer was guaranteed) and no opportunity cost of capital (we didn't model alternative investments) and no diminishing marginal utility (we didn't model that). The discount was pure.

     - The vote: some might have voted for a high r because they simply valued the future less? Or because they thought the present was more important? This is pure time preference. Others might have voted for a high r because they thought the bonus was unattainable anyway? That would be a different reason (pessimism). We can separate: pure time preference is the preference for the present over the future per se.

     - The coordination failure: even if the discount rate was low, if the present group didn't send enough, they failed. But if the discount rate was too high, they were doomed to fail. This relates to how pure time preference can make intergenerational cooperation impossible.

     Honest assessment of what the simulation cannot reproduce:

     - The psychological sense of temporal distance: the future group is in the same room. The present might feel that the future is real and therefore not discount it. The facilitator must emphasize the temporal separation and hope that participants imagine the 100-year gap.

     - In reality, the future doesn't get to vote on the discount rate. We included them to make the simulation symmetric and to engage them. But we must note that in reality, the present sets the discount rate unilaterally.

     Warnings:

     1. The present group might become very strategic in voting: they might vote for a very low r to enable the bonus, but then free-ride by sending 0. This is possible. But note: if they vote low and then send 0, the bonus is not achieved. So they get 100 points instead of 150. They might not do that. Also, the vote is anonymous so they might not coordinate the vote.

     2. The future group might feel frustrated. In the debrief, acknowledge that and note that in reality, the future has no voice.

     3. The numbers might be off: we set T=490 so that if r=30%, then full sending gets exactly 490. But if the discount rate is 30% and one person sends 99 instead of 100, then they might fall short? So we require exact full sending? That might be too fragile. We can set T=485 to allow for a little variation. Then with r=30%, full sending gives 700*0.7=490, which is above 485. Then even if one person sends 90, the total sent is 690, then R=690*0.7=483, which is below 485. So they still might miss. Alternatively, set T=480 and critical r=31.428% so that with r=31% (so factor=0.69) and full sending: 700*0.69=483, which is above 480. Then even if they send a little less, they might make it. But we want the possibility of failure. So we can leave T=490 and critical r=30%. Then if r=30%, they must send exactly 700? And if one person sends 99, then total sent=699, R=699*0.7=489.3, which is below 490. So they fail. This is harsh but illustrates the fragility.

     Alternatively, we can avoid fractional points? We set T=490 and then R must be at least 490. Since points are integers and discounting might not be integer, we can round? Or we can do fractional points.

     Given time, we'll do fractional points and exact calculation.

     This simulation design meets the request. We'll run with these numbers.
