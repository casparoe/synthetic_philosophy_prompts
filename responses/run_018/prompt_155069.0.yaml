  ### Simulation Design: "The Temporal Barrier Dilemma"  
  **Goal:** Make participants experientially grasp pure time preference (discounting future utility solely due to temporal position, independent of risk/growth/returns) through a coordination failure revealed by group action.

  ---

  #### **1. Physical Setup & Role Assignments**  
  - **Room Layout:**  
    - Divide the room into two zones with a visible barrier (e.g., tape line or rope).  
    - **Present Group (P):** 7 participants on one side.  
    - **Future Group (F):** 7 participants on the opposite side.  
  - **Epistemic Barrier Rules:**  
    - Groups can observe each other but **cannot communicate verbally, non-verbally, or cross the barrier**.  
    - Facilitator enforces silence across groups; violations invalidate rounds.  
  - **Roles:**  
    - All participants are "Generational Agents." P represents the current generation; F represents a future generation (e.g., 100 years later).  
    - Each participant receives an **endowment of 100 tokens** (representing utility).  

  ---

  #### **2. Rules & Incentives**  
  - **Key Mechanics:**  
    - **Pure Discount Rate Vote (Stage 1):** All 14 participants vote anonymously on a discount rate `r` (0%–100%). The **median vote** becomes the binding `r` for the round.  
    - **Transfer Decision (Stage 2):**  
      - **P members** decide individually how much of their endowment (0–100 tokens) to send to F.  
      - **F members** decide individually how much to send to a "Further Future" (FF), an abstract entity outside the room.  
    - **Discounting Rule:**  
      - Any tokens sent **across the temporal barrier** (P→F or F→FF) are discounted by `r`.  
      - **Example:** If `r = 40%`, sending 100 tokens results in the recipient receiving 60 tokens.  
  - **Payoff Structure:**  
    - **P Member Payoff:** `(Endowment - Tokens sent to F)`  
    - **F Member Payoff:** `(Endowment - Tokens sent to FF) + (Total tokens received from P after discounting) / 7`  
    - **Collective Threshold:** If the **total discounted tokens received by F** (from P) + **total discounted tokens sent to FF** (by F) ≥ 1,000 tokens, **all participants** gain a 50-token bonus.  
      - *Rationale:* The threshold creates interdependence. High `r` makes reaching 1,000 tokens impossible even with full cooperation, ensuring coordination failure if `r` is too high.  

  - **Incentives for Failure:**  
    - P faces a dilemma: Sending tokens to F is altruistic (no personal return), but the collective bonus requires F to receive enough.  
    - F faces a parallel dilemma: Sending tokens to FF sacrifices personal endowment but contributes to the threshold.  
    - Pure time preference (`r`) mechanically destroys value, making cooperation harder.  

  ---

  #### **3. Minute-by-Minute Timeline** (80 Minutes Total)  
  - **0–5 min:** Framing the exercise. Explain roles, barrier rules, payoffs, and the threshold bonus. Emphasize: "Discounting occurs *solely* because resources cross temporal barriers—no risk or growth factors."  
  - **5–15 min: Stage 1 (Vote on `r`)**  
    - Distribute voting slips. Participants write an integer `r` (0–100). Collect and announce the median `r`.  
  - **15–35 min: Stage 2 (Transfer Decisions)**  
    - P and F groups deliberate **separately** (within-group discussion allowed).  
    - P members decide tokens to send to F; F members decide tokens to send to FF.  
    - Decisions submitted privately to the facilitator.  
  - **35–45 min: Calculate Outcomes**  
    - Compute:  
      - Discounted tokens received by F: `(Total from P) × (1 - r/100)`.  
      - Discounted tokens sent to FF: `(Total from F) × (1 - r/100)`.  
    - Announce if the 1,000-token threshold is met and distribute bonus tokens.  
  - **45–50 min: Reveal Individual Payoffs**  
    - Share each participant’s token total (endowment - sent + bonus if applicable).  

  ---

  #### **4. Debrief Framework** (30 Minutes)  
  - **Guided Reflection:**  
    - **Start with Feelings:** "How did it feel to be in P/F? What frustrated you?"  
    - **Identify Critical Moments:**  
      - *Voting Phase:* "Why did you vote for your `r`? Was it based on self-interest, fairness, or something else?"  
      - *Transfer Phase:* "P Group: Did you trust F to send tokens to FF? F Group: Did you resent P for controlling your initial resources?"  
    - **Map to Concepts:**  
      - **Pure Discounting:** "The `r` you voted for destroyed tokens *only* because they crossed time. How did this differ from discounting for risk (e.g., uncertainty if F exists) or growth (e.g., expecting more tokens in FF)?"  
      - **Coordination Failure:** "Even if everyone *wanted* the bonus, why did high `r` make it impossible? How did temporal position (P vs. F) create asymmetric power?"  
      - **Emergent Insight:** Highlight comments like, "We couldn’t coordinate transfers because the barrier felt real," or, "High `r` made sending tokens pointless." Connect to pure time preference’s role in real policy (e.g., climate inaction).  

  ---

  #### **5. Honest Limitations**  
  - **Unsimulatable Element:** The simulation **cannot replicate psychological temporal distance**. Participants know F is co-present, diluting the "futurity" that motivates pure discounting in reality.  
  - **Mitigation:** The facilitator must **emphasize the barrier as a metaphor for temporal dislocation** (e.g., "F is your great-grandchildren—you see them but cannot speak to them").  

  ---

  #### **6. Predictable Problems & Solutions**  
  - **Problem:** P and F attempt to communicate across the barrier.  
    - **Solution:** Invalidate the round and restart. Stress: "No intertemporal negotiation is possible."  
  - **Problem:** Groups vote strategically (e.g., P votes for high `r` to "protect" themselves; F votes low `r`).  
    - **Solution:** This is **intentional**—it reveals how temporal position shapes incentives. Debrief: "Did F feel powerless? Did P prioritize themselves?"  
  - **Problem:** Low engagement due to abstract payoffs.  
    - **Solution:** Use tangible rewards (e.g., candy, extra credit) for tokens.  
  - **Problem:** Math confusion (e.g., discounting calculations).  
    - **Solution:** Provide a calculator and simple examples pre-simulation.  

  ---

  ### **Why This Works**  
  - Participants **experience** pure discounting as a mechanical destroyer of value, not an abstract parameter.  
  - The threshold bonus creates a social dilemma where high `r` guarantees collective failure, mirroring real-world intergenerational traps.  
  - Asymmetric power (P controls F’s starting resources) highlights justice implications.  
  - The debrief ties emotions (frustration, powerlessness) to theoretical distinctions between pure and non-pure discounting.
