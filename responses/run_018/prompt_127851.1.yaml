  Okay, the user is asking for a consistency check on their democratic boundary views before writing them up. They've listed six principles and identified some tensions, especially between (i)/(vi) and (ii)/(iii). My task is to analyze these tensions, rank them by severity, suggest revisions, and present it as continuous prose without any formatting.

  Looking at their position: They're clearly a political theorist grappling with democratic inclusion boundaries. The sophistication of their principles suggests they're writing for an academic audience - probably developing a novel framework that bridges democratic theory with transnational challenges. Their core struggle is balancing universalist impulses (all-affected principle) with communitarian concerns (reciprocal vulnerability).

  The tensions they've spotted are real. The biggest one is indeed between (i) and (ii). If everyone affected by climate change should have input (i), but only those embedded in shared social worlds count (ii), that creates a contradiction for transnational issues. Principle (vi) compounds this by noting non-citizen residents and affected foreigners are similarly situated causally, yet they're treated differently in (iii). This isn't just theoretical - it has real implications for how we structure climate governance.

  For the minor tensions: The future generation proxies (iv) actually align well with (ii) since trustees act as embedded representatives. The animal rights point (v) might seem to conflict with (i) superficially, but they've wisely separated moral consideration from democratic authorship - that's philosophically coherent. The real cost of their position is having to defend why reciprocal vulnerability matters more than causal impact for democratic legitimacy.

  The cheapest revision path would be to refine "reciprocal vulnerability" to acknowledge degrees of embeddedness. They could argue that climate change creates a new form of transnational vulnerability that meets the threshold for inclusion. But this would require showing why this doesn't collapse into the all-affected principle entirely. Alternatively, they might adjust (i) to apply only to governance systems where reciprocal vulnerability can be institutionally manifested - but that concedes ground to nationalist frameworks.

  What they're ultimately wrestling with is the perennial democratic theory question: What transforms affected interests into legitimate claims? Their answer privileges social embeddedness, but needs stronger justification against the counter that causal impact alone creates political obligation. The animal rights distinction (v) actually strengthens their case by showing they can acknowledge interests without granting authorship - they should lean into that.
answer: |-
  Here's a straight shot at your consistency check, thinking through it as I go. The core tension absolutely dominates – it’s between your commitment to the all-affected principle for big transnational stuff (i) and the reciprocal vulnerability requirement for democratic legitimacy (ii), which underpins your distinction in local vs. national voting rights (iii). Principle (vi) throws gasoline on that fire by pointing out the arbitrariness of treating a causally-impacted foreigner differently from a causally-impacted resident non-citizen under your current framework.

  This is the severe, fundamental tension. On the surface, (i) demands input for someone in Bangladesh displaced by sea-level rise caused by global emissions, as they are substantially impacted. But (ii) says they lack democratic standing *here* because they aren't embedded in *our* reciprocal social world of shared institutions, norms, and mutual vulnerability to each other's political choices. Conversely, a resident non-citizen *is* embedded in that local social world (hence local voting under iii) but not necessarily the broader national "collective destiny" project. The problem (vi) highlights is stark: if causal impact alone isn't enough (as per ii and iii), then why should the impacted foreigner get *any* input under (i)? It makes (i) seem like a special pleading for specific issues, while (ii) is doing the real work of defining membership elsewhere, potentially looking like nationalism dressed up. Conversely, if you push (i) hard for climate/AI, it undermines the rationale for excluding the impacted foreigner from *any* membership circle defined by impact, potentially collapsing the resident/non-resident distinction under (vi). The cheapest revision here is likely refining what "reciprocal vulnerability" entails *specifically for transnational systemic threats*. You could argue that climate change *creates* a new, thin, but real layer of reciprocal vulnerability on a planetary scale – we *are* becoming embedded in each other's fate through these systems in a way distinct from simple causal chains. This lets you keep (i) for those issues without fully abandoning (ii), but it costs you theoretical purity. It means "reciprocal vulnerability" isn't a fixed, pre-political condition but can be generated or amplified by new forms of interdependence. You have to argue why climate/AI create *that specific kind* of mutual embeddedness justifying input, while other forms of impact (like economic policy spillovers) might not. The alternative, weakening (ii) or abandoning the resident/non-citizen distinction in (iii), is far more costly to your core structure.

  The tension between (iv) and (v) dissolves on closer inspection and is actually minor. Future generations get trustees because, while they aren't *currently* embedded in our social world (so (ii) might seem to exclude them), the core argument for (iv) rests on the *intergenerational* aspect of the collective destiny mentioned in (iii) and the unique nature of constitutional binds. They *will be* members of the continuing political community, inheriting its foundational structure, creating a unique form of "deferred reciprocal vulnerability." Our choices bind *their* social world fundamentally. Animals (v), however, aren't and won't be co-authors of the collective *political* project in the same way, even if their interests deserve profound moral weight. The distinction holds: future humans are future participants in the *same* ongoing political authorship project, justifying proxy representation for its foundational rules; animals are not participants in that project at all. There's no real conflict here. Principle (i) isn't violated by (v) because you explicitly separate moral considerability from democratic standing as co-author. Someone affected morally (like an animal) doesn't automatically get a vote; democratic standing requires the capacity for reciprocal political agency and authorship within a shared project, which (ii) captures. The tension is only surface-level – you're applying different criteria (impact vs. co-authorship capacity) to different domains.

  So, ranking the tensions: The (i)/(vi) vs. (ii)/(iii) clash is severe and foundational, demanding revision. The (iv) vs. (v) perceived tension dissolves upon examining the rationale for trusteeship and the nature of political co-authorship. The potential (i) vs. (v) tension is superficial, resolved by acknowledging the distinct criteria for moral concern versus democratic agency. Focus your revisions on clarifying how reciprocal vulnerability operates in the context of planetary systemic threats to rescue the core of your framework without abandoning the all-affected intuition for the biggest issues. Good luck with the write-up – it's tackling the hard questions head-on.
