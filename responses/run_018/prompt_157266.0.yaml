answer: |-
  ## Research Proposal: Pain Asymbolia and the Essential Badness of Pain

  **Central Question:** Do sincere reports from pain asymbolic patients that their pain "hurts" indicate the retention of a *thin phenomenal badness* intrinsic to the sensory state, or do they instead demonstrate that the *evaluative concept* "hurt" has become functionally detached from its normal motivational and affective underpinnings, tracking the sensory state without being intrinsically aversive?

  **Problem with Existing Taxonomy:** The dominant sensory-discriminative vs. affective-motivational framework fails to resolve this question. Both proponents of the sensory view (who locate badness in the sensory quality) and the affective view (who locate it in motivational force) implicitly share the assumption that the *badness* of pain must be carried *either* by its intrinsic phenomenal character *or* by its immediate motivational potency. This shared assumption leaves no conceptual space for the possibility that the patient retains an *evaluative judgment* (e.g., "this hurts," meaning "this is the kind of sensation normally bad") that accurately tracks the sensory state but is *decoupled* from the affective experience and motivational drive that typically constitutes its badness. The taxonomy cannot distinguish between a *phenomenally bad* sensation lacking motivation and an *evaluatively labeled* sensation lacking intrinsic badness.

  **Proposed Approach:** To preserve the intuition that asymbolic pain remains "bad" in some significant sense requires distinct rescue strategies:
  1.  **Phenomenal Residue Strategy:** Argues that a minimal, intrinsic *hedonic tone* of badness persists in the sensory state itself, constituting a "thin" phenomenal badness, even when disconnected from motivation and strong affect. The report "it hurts" directly reflects this residue.
  2.  **Counterfactual Dependence Strategy:** Argues that the badness lies not in the current phenomenology, but in the *counterfactual dependence* of the sensory state on the intact aversive architecture. The sensation is bad *because* it is the precise type of state that *would* be aversive and motivating if the patient's evaluative/motivational systems were functioning normally. The report "it hurts" signifies recognition of this dependence.

  **Measuring Progress:** Success would involve rigorously distinguishing these strategies and identifying potential points of empirical or phenomenological divergence:
  *   **Convergence:** Demonstrating both strategies make identical predictions about the structure and content of first-person reports, suggesting they are functionally equivalent descriptions.
  *   **Divergence:** Identifying distinct phenomenological predictions testable through structured qualitative analysis of patient reports (e.g., probing the *experienced quality* vs. the *inferred significance* of the sensation). Progress is demonstrating a viable path to empirically adjudicate between the strategies.
  *   **Failure:** The distinction collapses into a purely verbal disagreement about the meaning of "badness" or "hurt," yielding no substantive philosophical insight into the nature of pain's badness or the structure of evaluative concepts. Failure also occurs if no feasible phenomenological test can be conceived.

  **Scope Assessment:** A three-month independent project is ambitious but feasible for foundational conceptual work. Scope includes:
  1.  Detailed conceptual analysis of the two rescue strategies and their relationship to the core question and existing literature.
  2.  Critical examination of first-person report data from asymbolia case studies to identify potential phenomenological markers distinguishing the strategies.
  3.  Developing a clear framework for what phenomenological evidence would support or challenge each strategy.
  4.  Articulating the philosophical implications of each strategy for theories of pain's badness and evaluative concepts.
  *Realistically, extensive new empirical data collection or a comprehensive survey of all relevant literature is beyond scope. The focus will be on establishing a robust conceptual framework and preliminary analysis of existing reports to lay the groundwork for future empirical testing and broader theoretical engagement. Success is a clearly articulated, testable hypothesis about the nature of asymbolic phenomenology, not definitive resolution.*
