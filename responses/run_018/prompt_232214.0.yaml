prompt: |-
  I got into an argument with a friend who does economics about whether models with obviously fake assumptions can still be good science. He kept falling back on the Friedman line that assumptions dont need to be realistic and only predictions matter. That cant be right, I think, but I couldn't put my finger on it, so I tried to push his idea and ended up with an argument that seems to prove way too much:

  (1) What makes a model a good scientific model is just whether it makes accurate predictions; whether its assumptions are true or false doesn't matter.
  (2) So a model can have knowingly false assumptions and still be good science, as long as it predicts well.
  (3) Astrology assumes that planets affect personality and life events, and that's false.
  (4) But suppose someone finds a specific astrological rule — say, people born during Mercury retrograde are more likely to be in car accidents — and that rule keeps making correct, risky predictions on new data at about the same hit rate as a typical economics model.
  (5) By (1) and (2), this astrological rule counts as good science.
  (6) But that seems absurd: a rule built on a false assumption shouldn't become science just because it happens to predict.
  (7) So either (1) is wrong after all, or one of those steps is doing something I can't see.

  I can't find the exit. Walk me through which premise or step I should reject, why it looked so natural at first, and what the main ways out each have to pay. Keep it under 600 words and in American English.
reasoning: |-
  Okay, the user is grappling with a philosophical debate in economics about whether models with unrealistic assumptions can still be considered good science. They're referencing Milton Friedman's instrumentalist view that only predictions matter, not the realism of assumptions. The user constructed a reductio ad absurdum argument using astrology to challenge this position, and now feels stuck because the conclusion seems wrong. 

  Hmm, the core tension here is between instrumentalism (Friedman's view) and scientific realism. The user intuitively feels that astrology shouldn't qualify as science regardless of predictive success, which suggests they lean toward realism. Their astrology example is clever because it isolates the predictive criterion while exposing how it could legitimize pseudoscience. 

  Let me unpack why step (5) fails. First, astrology as a whole can't be redeemed by one ad hoc rule - that's cherry-picking. More importantly, scientific models aren't judged solely on predictions; we also evaluate whether their mechanisms could plausibly cause outcomes. The retrograde rule might correlate by coincidence, whereas economic models at least reference causal forces like incentives. 

  The user might be missing that Friedman was discussing idealized models within established theories, not entirely disconnected systems like astrology. When economists assume perfect rationality, they're deliberately simplifying real behavior, not invoking supernatural forces. There's a difference between abstraction and fabrication. 

  Also worth noting: the astrology "model" lacks what philosophers call "ontological commitment" - it doesn't seriously propose testable entities or mechanisms. It's more pattern-matching than causal explanation. That's why even if it predicted well, we'd call it a fluke until someone explains how planetary positions affect traffic accidents. 

  The user's frustration is understandable. They sensed something was off with Friedman's stance but couldn't articulate why. Their reductio successfully exposes that prediction can't be the only criterion - we need some connection to reality in the assumptions, otherwise we'd have to accept any lucky guess as science. 

  I should emphasize that rejecting pure instrumentalism doesn't mean demanding perfect realism. All models simplify. The middle ground is that assumptions must be defensible approximations with credible causal links, not pure fiction that happens to correlate. That's what protects science from astrology.
answer: |-
  Here's the breakdown:

  1.  **Reject Step (5):** This is the core fallacy. While the *specific rule* might have predictive power, labeling *the astrology model* as "good science" is incorrect.
  2.  **Why?**
      *   **No Causal Mechanism:** Good science seeks to explain *why* something happens. Astrology offers a demonstrably false causal mechanism (planetary influence on personality/events). The predictive rule is likely coincidental or misattributed correlation (e.g., perhaps Mercury retrograde periods correlate with weather patterns affecting driving, or reporting bias). A good scientific model needs plausible (even if simplified) causal links between its assumptions and predictions.
      *   **Ad Hoc vs. Generative:** The Mercury retrograde rule is likely *ad hoc* - crafted *after* noticing a pattern. Good scientific models are *generative*; their core assumptions (even simplified ones) should produce diverse, testable predictions beyond the single data point they were "tuned" for. Astrology fails this miserably; its core principles don't reliably generate new, verified predictions.
      *   **No Theoretical Framework:** The rule exists in isolation, disconnected from any consistent, evidence-based understanding of physics, biology, or psychology. Science builds cumulative knowledge within established frameworks. Astrology isn't integrated into (and contradicts) these frameworks.
  3.  **Why Step (2) Looked Natural (The Friedman Trap):**
      *   Friedman's point works *within established scientific fields* where assumptions are *purposeful simplifications* of known complex realities (e.g., assuming perfect competition to isolate core market forces, knowing real markets are imperfect). The assumptions, while not "realistic," are *reasonable approximations* or *idealizations* designed to reveal essential truths. The key is that the causal mechanisms being simplified *are fundamentally real* (e.g., supply, demand, incentives).
      *   The trap is extending this to *any* false assumption, regardless of whether it represents *any* underlying reality or causal process. Astrology's core assumptions aren't simplifications; they're fundamental misrepresentations of reality.
  4.  **The Ways Out & Their Cost:**
      *   **Reject Pure Instrumentalism (Friedman Lite):** Predictions *alone* aren't sufficient. Models need *some* plausible connection between their assumptions and reality, especially concerning causation. The model's structure must offer a *credible explanation*, not just a correlation.
          *   **Cost:** Requires judging the "reasonableness" of assumptions, which can be subjective and messy. Defining "plausible mechanism" isn't always clear-cut.
      *   **Require Generative Power:** A model must do more than fit existing data; its core logic must generate *novel, testable predictions* successfully. Astrology fails this.
          *   **Cost:** It's harder to apply upfront; you need to see if the model *can* make new predictions, not just fit old data.
      *   **Require Theoretical Coherence:** Models should fit within, or contribute to, a broader, evidence-based understanding of the world. Astrology fundamentally contradicts established science.
          *   **Cost:** Can be conservative, potentially hindering radical new ideas that genuinely overturn paradigms (though astrology isn't one!).

  **Conclusion:** Your intuition is correct. Step (5) fails because predictive power alone, especially a single *ad hoc* rule, doesn't make the underlying model "good science." Science requires plausible causal mechanisms (even simplified), generative power, and coherence with broader knowledge. Friedman's argument works for *idealizations* within science, not for *fundamentally false* causal claims like astrology, no matter how well a cherry-picked rule might seem to predict. Reject the idea that *any* false assumption is acceptable; it must be a *defensible simplification* of something real.
