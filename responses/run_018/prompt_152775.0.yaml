  - The key is that the public statement flips from Round 1 to Round 2 even though no individual changed their mind. In Round 1, the statement said A: yes, B: yes, C: yes. In Round 2, after the vote on C, the statement says A: no, B: yes, C: no.

  ### Debrief (35 minutes)
  - Start by asking: Did anyone change their individual position? (No.)
  - Then, point out that the group's collective verdict changed because of the aggregation method. In Round 1, they used premise-based: they aggregated the premises and then derived the conclusion. In Round 2, they aggregated the conclusion directly (conclusion-based). 
  - This is the discursive dilemma (now name it): sometimes the majority on the premises leads to one conclusion, but the majority on the conclusion is the opposite.
  - Where did anonymity break? In the dissenter role, we broke anonymity by asking a specific person to defend. Also, the chair had to know the votes to assign the dissenter? Actually, we only broke anonymity for the dissenter when we called on them. The votes were tallied and known as counts, but not who voted what until the dissenter was called. But when we ask the dissenter to speak, we reveal that they voted against the majority on A in the first round.
  - What can't the game reproduce? The game shows that the group as a whole does not have a consistent set of beliefs. But it doesn't show that collective minds are real. We have to lecture on the idea of group agency: can a group be an agent with its own beliefs? The discursive dilemma (formal impossibility result) shows that there is no aggregation procedure that always preserves consistency and satisfies other conditions (like respecting unanimity and being non-dictatorial). This is settled. 
  - What is contested? Whether we should use premise-based or conclusion-based aggregation. Some argue that premise-based is better because it focuses on reasons, others that conclusion-based is more democratic because it directly aggregates on the outcome. Also, whether groups can be said to have beliefs at all is contested.

  Example with different numbers to ensure inconsistency:

  We need a profile where:
  - Majority on A: yes
  - Majority on B: yes
  - Then derived C: yes
  But then, when voting on C, majority says no.

  How? For instance, with 10 people:

  Voter 1: A yes, B yes, C yes
  Voter 2: A yes, B yes, C yes
  Voter 3: A yes, B yes, C yes
  Voter 4: A yes, B yes, C yes
  Voter 5: A yes, B no, C no   (because if B is no, then C must be no)
  Voter 6: A yes, B no, C no
  Voter 7: A no, B yes, C no
  Voter 8: A no, B yes, C no
  Voter 9: A no, B yes, C no
  Voter 10: A no, B no, C no

  Now, vote on A: 
  - Yes: voters 1-6 -> 6 yes
  - No: voters 7-10 -> 4 no -> majority yes

  Vote on B:
  - Yes: voters 1-4,7-9 -> 7 yes? Let's count: 
    Voters 1-4: yes, voters 5-6: no, voters 7-9: yes, voter10: no -> 1-4 (4) and 7-9 (3) -> total 7 yes, 3 no -> majority yes.

  Derive C: yes (because both A and B are yes).

  But now, when voting on C:
  - Yes: voters 1-4 -> 4
  - No: voters 5-10 -> 6
  So majority says no.

  So we have the inconsistency.

  In this example, the smallest majority was A (6-4) vs B (7-3). So we flip A. Then the dissenter is one of the voters who voted no on A (voters 7-10).

  ### Instructions for the Game:

  **Materials:**
  - Ballot papers for each board member (with A, B, C and instructions for consistency).
  - Tally sheets for the chair.

  **Steps:**

  1. **Setup (10 min):**
     - Introduce the scenario: "You are a peer-review board for an AI conference. You must decide on three claims about a submitted paper: A (the method is sound), B (misuse risk is high), and C (approval requires safeguards). Note the logical connection: if A and B are both true, then C must be true (because if the method is sound and the risk is high, then safeguards are needed). If either A or B is false, then C is false (because without a sound method, we reject regardless, or if risk is low then safeguards are unnecessary)."
     - Assign roles: one chair, the rest are board members. The chair will draft the public statement and only votes in case of a tie.
     - Distribute ballots. Each board member must mark their ballot consistently (they choose yes/no for A, B, and C such that: if they vote yes on A and yes on B, then they must vote yes on C; if they vote no on A or no on B, then they must vote no on C). They do not reveal their C vote until Round 2.

  2. **Round 1: Premise-Based (15 min):**
     - Board members vote by secret ballot on A and B (they do not vote on C yet). Collect the ballots and tally.
     - The chair announces the majority for A and the majority for B.
     - The chair then derives the collective C: if both A and B are majority yes, then C is yes; otherwise, C is no.
     - The chair drafts a short statement (1-2 sentences) that states the board's position on A, B, and the derived C. Read it to the group.

  3. **Round 2: Conclusion-Based (15 min):**
     - Now, board members vote by secret ballot on C (they must vote according to their private ballot, which they already filled out and which is consistent).
     - Tally the vote for C. The chair announces the majority for C.
     - Compare the derived C from Round 1 with the majority C from Round 2. If they are the same, then no problem. But if they are different (as in our example), then the board must backtrack and reject at least one premise to be consistent with the new C (which is now the collective position).
     - How to choose which premise to flip? The premise that had the smallest majority in Round 1 is the one that gets rejected. (If there is a tie in the majority sizes, flip a coin.)
     - The chair then drafts a new statement that reflects the flipped premise and the new collective position on C.
     - Assign the dissenter: The chair randomly selects one board member who voted in the minority on the flipped premise in Round 1. That person is the dissenter and must give a short (1-2 min) defense of their position on that premise.

  4. **Debrief (35 min):**
     - Start by asking: Did any individual change their mind? (No, because they voted consistently with their initial ballot.)
     - Then: Why did the group's position change? Because in the first round we aggregated the premises and then derived the conclusion, but in the second round we aggregated the conclusion directly.
     - Introduce the term: This is known as the discursive dilemma (or doctrinal paradox). It shows that the way we aggregate individual judgments can lead to inconsistent group positions.
     - Anonymity: We broke anonymity when we asked the dissenter to speak. We knew they held a minority view on a premise.
     - What the game can't show: The game illustrates the formal problem, but it doesn't resolve the philosophical question of whether groups can be genuine agents with beliefs. We have to lecture on that.
     - Settled: The impossibility result (by List and Pettit) shows that there is no aggregation procedure that always preserves consistency and satisfies some minimal conditions (like non-dictatorship and respecting unanimity). This is a mathematical fact.
     - Contested: Whether premise-based or conclusion-based is the right method. Also, whether groups can have beliefs in a robust sense (the realism vs. eliminativism debate about group agency).

  Note: The above example with 10 voters is just one way it can play out. You can also use a smaller group if needed, but with 10 we have a clear example.

  Time permitting, you can run the game again with different ballots to see if the same thing happens.

  Good luck with the seminar!
answer: |-
  ### Collective Rationality Seminar Game: The AI Review Board  
  **Goal:** Make 'em *feel* the discursive dilemma without naming it—until the debrief. By the end, they’ll see how group logic flips while individual votes stay fixed.  

  ---

  #### **Setup (10 mins)**  
  - **Scenario:** You’re a peer-review board for *NeurAlly*, a top AI conference. A controversial paper claims breakthrough results. Your task: Issue a **collective verdict** (public statement) on:  
    - **A:** The method is sound. (Yes/No)  
    - **B:** Misuse risk is high. (Yes/No)  
    - **C:** Approval requires safeguards. (Yes/No)  
    *Logical constraint:* C is true *only if* A and B are both true (i.e., C = A AND B). If A or B is false, C must be false.  
  - **Roles:**  
    - **Chair (1 person):** Drafts the board’s public statement after votes. Breaks ties.  
    - **Board members (9 people):** Vote privately on A, B, C—but their ballot must be *consistent* (e.g., if you vote Yes on A and B, you *must* vote Yes on C).  
    - **Dissenter (selected later):** Defends the minority view when forced.  
  - **Rules:**  
    - Votes are secret. No changing ballots.  
    - Majority wins (simple 50%+1).  
    - **No averaging:** No "compromise" positions. Yes/No only.  

  ---

  #### **Round 1: Premise-Based Aggregation (20 mins)**  
  1. **Private Ballots:**  
     - Each member fills out a ballot for **A and B only** (C is *not* voted on yet).  
     - *Example ballot:*  
       ```  
       A (method sound): Yes / No  
       B (misuse risk high): Yes / No  
       ```  
     - Remind them: Their *internal* C must align with their A and B.  

  2. **Vote & Derive:**  
     - Chair collects ballots, tallies public votes for A and B.  
     - **Derive C mechanically:**  
       - If A *and* B both have majority "Yes", then C = Yes.  
       - If A *or* B has majority "No", then C = No.  

  3. **Public Statement (Chair):**  
     - Chair writes a 1–2 sentence statement justifying the verdict *based on the premises*.  
     - *Example:* "We find the method sound (A: 7 Yes, 3 No) and misuse risk high (B: 6 Yes, 4 No). Thus, approval requires safeguards (C: Yes)."  

  ---

  #### **Round 2: Conclusion-Based Aggregation (20 mins)**  
  1. **Vote on C Directly:**  
     - Same board members vote privately **only on C** (using their *original* ballot’s C value—no changes!).  

  2. **Tally & Conflict:**  
     - Chair announces majority vote for C.  
     - **If C’s vote matches Round 1’s derived C → Game ends (boring! Skip this outcome).**  
     - **Likely conflict:** C’s vote *contradicts* Round 1’s derived C (e.g., Round 1: C=Yes; Round 2: majority votes C=No).  

  3. **Force Backtracking:**  
     - Board *must* reject at least one premise (A or B) to align with the new C.  
     - **Rule:** Flip the premise with the *smallest majority* in Round 1.  
       - *Example:* If A won 7-3 and B won 6-4, flip B (narrower win).  
     - **Dissenter Activation:**  
       - Chair randomly picks someone who voted for the *losing side* of the flipped premise in Round 1.  
       - Dissenter must defend their position in 60 seconds (e.g., "Why I voted B: No").  

  4. **New Public Statement (Chair):**  
     - Rewrite verdict: Flip the premise, update C.  
     - *Example:* "After review, we find misuse risk *not* high (B: No). Thus, safeguards are unnecessary (C: No)."  

  ---

  #### **The Flip (Key Moment)**  
  - In Round 1 → "C: Yes, because A and B are true."  
  - In Round 2 → "C: No, because [flipped premise] is false."  
  - **No individual changed their vote!** The group’s *reasoning* reversed purely by switching aggregation methods.  

  ---

  #### **Debrief (25 mins)**  
  **1. Name the Beast:**  
     - "What you experienced is the **discursive dilemma** (or *doctrinal paradox*). Two ways to aggregate:  
       - **Premise-based (Round 1):** Vote on reasons, derive conclusion.  
       - **Conclusion-based (Round 2):** Vote on the outcome directly.  
     - Group rationality breaks because these methods clash. Majority logic ain’t transitive!"  

  **2. Where Anonymity Broke:**  
     - Secret ballots protected privacy *until* the dissenter was forced to reveal their minority vote. Shows how "public justification" pressures individuals.  

  **3. What the Game *Can’t* Show (Lecture This Part):**  
     - **Settled (Formal Impossibility):**  
       > "List and Pettit proved: **No aggregation rule** satisfies all three—(1) follows majority, (2) always consistent, (3) non-dictatorial. You *must* drop one. This is math—it’s airtight."  
     - **Contested (Philosophical Fights):**  
       - **Premise vs. Conclusion:** Is it fairer to vote on reasons (premise-based) or outcomes (conclusion-based)? *Unresolved.*  
       - **Group Minds:** Can a collective *truly* "believe" something? Or is it just useful fiction? Realists (like Pettit) vs. eliminativists (like individualists) *still battle this out.*  
       - **Normative Glue:** Should we *want* consistent group agents? Or embrace fluidity? Depends if you’re a democrat, technocrat, or anarchist!"  

  **4. Group Reflection:**  
     - "How’d it *feel* when the chair’s statement flipped? Did the dissenter feel scapegoated? Where’d the ‘group’s will’ go?"  

  ---

  #### **Pro-Tips for Running Smoothly**  
  - **Ballot Hack:** Pre-print ballots with logic rules (e.g., "REMEMBER: C = A AND B").  
  - **Force Conflict:** If votes align by chance, use this backup ballot set (6 voters):  
    - 2 ballots: A=Yes, B=Yes → C=Yes  
    - 2 ballots: A=Yes, B=No → C=No  
    - 2 ballots: A=No, B=Yes → C=No  
    - *Round 1:* A=Yes (4-2), B=Yes? → 3-3? → Chair breaks tie for B=Yes. Derive C=Yes.  
    - *Round 2:* C=No wins (4-2) → Flip A (narrower majority) → Dissenter defends A=No.  
  - **Time Splits:** Setup (10), Round 1 (20), Round 2 (20), Debrief (25).  

  This’ll make the paradox visceral. They’ll leave pissed at group logic—mission accomplished. Good luck, and go crush that seminar! 🔥
