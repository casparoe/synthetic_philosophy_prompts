    2. Vote on C directly. If the majority rejects C (votes 'no'), then the board must backtrack and reject at least one premise (A or B) to maintain consistency.

  - Each student gets a private consistent ballot: they choose yes/no for A, B, and C, but their choices must be consistent (i.e., if they vote yes on A and B, they must vote yes on C; if they vote no on A or no on B, they must vote no on C). However, in the first round they only vote on A and B, and then C is derived collectively. In the second round, they vote directly on C.

  - The twist: The group's published reasoning flips between rounds even though no individual changed their mind.

  - Roles:
    - Chair: Drafts the public justification after each round.
