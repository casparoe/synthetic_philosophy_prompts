  We are designing a classroom game to illustrate the discursive dilemma without naming it initially. The game involves a mock peer-review board for an AI study with three claims: A (method sound), B (misuse risk high), C (approval needs safeguards). The group must issue a collective verdict with public reasoning.

  Key elements:
