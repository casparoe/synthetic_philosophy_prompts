  - Debrief: Map to premise-based (first round) vs conclusion-based (second round) aggregation. Point out where anonymity breaks (in the dissenter role, or when the chair writes the reasoning). Be frank about what the game can't reproduce (e.g., the idea of a collective mind or agent that has a consistent set of beliefs) and what we have to lecture on (the formal impossibility result: the discursive dilemma shows that there is no way to aggregate individual judgments that always preserves consistency and satisfies other reasonable conditions).

  Structure:

  1. Setup (10 minutes)
  2. Round 1: Voting on A and B, then derive C (15 minutes)
  3. Round 2: Voting on C, then if necessary backtracking (15 minutes)
