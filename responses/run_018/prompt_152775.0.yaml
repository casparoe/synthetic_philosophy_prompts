  - The chair does not vote initially (unless tie) but will draft the statement.

  ### Round 1: Premise-Based Aggregation (15 minutes)
  - Board members vote on A and B (by secret ballot? or public? to save time, we can do a show of hands, but then anonymity is broken. Alternatively, we can use secret ballot and have the chair collect and tally).
    - We do secret ballot for both rounds? But then we break anonymity for the dissenter. Let's do:
      - Round 1: Secret ballot for A and B. The chair collects and tallies the votes. Announce the majority for A and majority for B.
      - Then, derive C: If both A and B are majority yes, then the board's collective C is yes. Otherwise, no.

  - The chair then drafts a public statement: "After careful consideration, the board finds that the method is sound (A: majority yes) and the misuse risk is high (B: majority yes). Therefore, we require safeguards for approval (C: yes)." (or adjust according to the votes)

  - Example: Suppose the votes are:
    - A: 6 yes, 4 no -> majority yes
    - B: 7 yes, 3 no -> majority yes
    -> Then C is derived as yes.

  - The chair reads the statement.

  ### Round 2: Conclusion-Based Aggregation (15 minutes)
  - Now, board members vote directly on C (using secret ballot again). They must vote according to their private consistent ballot (which they filled out at the beginning, but only revealed A and B in the first round). They cannot change their mind.

  - Tally the vote for C.

  - Suppose in the example, the vote for C is:
    - C: 4 yes, 6 no -> majority no.

  - Now, the board has a problem: In the first round, they concluded C must be yes (because both A and B were yes). But now, the majority says C is no. So the collective position is inconsistent.

  - The board must backtrack: They must reject at least one of the premises (A or B) to make the collective position consistent. How? They look back at the first round votes: 
    - They had A: 6-4 (majority yes) and B: 7-3 (majority yes). 
    - Now, to reject C (which is the new collective position), they must reject either A or B. But which one? They have to choose which premise to flip.

  - Rule: The premise that had the smallest majority in the first round is the one that gets flipped? Or we can have the board vote on which premise to reject? But that would take time. Alternatively, we can assign the dissenter role.

