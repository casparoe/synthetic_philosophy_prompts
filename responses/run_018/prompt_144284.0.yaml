answer: |-
  The institutional design you describe—iterated amplification and distillation (IDA)—indeed rests on specific, contestable philosophical foundations regarding competence, moral reasoning, and the nature of values. Let us reconstruct its implicit theory, distinguishing strict requirements from contingent fits, identify excluded rival conceptions, and consider alternatives.  

  ### Core Philosophical Commitments  
  1. **Compositionality of Normative Judgment**:  
     - **Strict Requirement**: IDA requires that complex normative questions (e.g., "Does this action respect autonomy?") can be decomposed into sub-questions answerable by bounded agents *without losing essential meaning*. Epistemic authority must be preserved through aggregation rules (e.g., majority vote, logical synthesis).  
     - **Implicit Atomism**: It assumes evaluative concepts are *structurally decomposable*—i.e., "autonomy" can be broken into contextually isolated components (e.g., "Did the agent consent?", "Were alternatives disclosed?"). This treats values as *functions* of discrete inputs rather than irreducible gestalts.  

  2. **Stability Under Decomposition**:  
     - **Strict Requirement**: Values must remain invariant when distributed across subsystems. If a human supervisor’s judgment on "autonomy" is decomposed, correct recombination should yield the original verdict.  
     - **Tension with Emergent Capabilities**: While IDA acknowledges intelligence *emerges* from scale, it assumes values *do not emerge* from decomposition. This asymmetry presumes values are *grounded in atomic facts* accessible to limited reasoners, whereas intelligence arises from relational complexity.  

  3. **Epistemic Authority as Computational**:  
     - **Contingent Fit**: IDA fits a view where understanding is *procedural*—moral reasoning reduces to applying rules to cases. Authority derives from reliable computation, not holistic insight.  
     - **Excluded Rivals**: It quietly rejects:  
       - **Hermeneutic Holism**: Values as context-bound interpretations requiring narrative coherence (e.g., Gadamer, Taylor).  
       - **Aristotelian Phronesis**: Practical wisdom as non-codifiable judgment cultivated through experience.  
       - **Kantian Universality**: Moral principles as indivisible categorical imperatives.  

  ### Defending the Asymmetry  
  The asymmetry between emergent intelligence and stable values hinges on two ontological claims:  
  - **Mental Content as Functionally Reducible**: Values are construed as *input-output mappings* (e.g., "autonomy-respecting" as a label derivable from features). This is compatible with naturalistic moral psychology (e.g., Churchland).  
  - **Normative Facts as Base-Level**: While capabilities emerge from interactions, values are treated as fixed "targets" defined by human supervisors. Decomposition is a *discovery procedure*, not a transformative process.  

  **Critique**: This assumes an unexamined ontology where mental content is *atomistic* and value predicates are stable under reductive operations. Rival views (e.g., Wittgensteinian "family resemblances" or Davidsonian anomalous monism) argue that meaning holism precludes such decomposition.  

  ### Alternatives: Non-Compositional Alignment Protocols  
  An alignment method rejecting compositionality would require:  
  1. **Holistic Evaluation**:  
     - Use end-to-end training where AI systems learn values through immersive, contextual engagement (e.g., apprenticeship models) rather than decomposition.  
     - *Example*: Train AIs via extended interaction with human communities, absorbing norms through narrative and practice.  

  2. **Dynamic Aggregation Rules**:  
     - Treat aggregation as *hermeneutic*—not merely summing votes, but synthesising perspectives dialectically (e.g., Habermasian discourse ethics).  
     - *Challenge*: Scalability; human raters would need deep contextual understanding.  

  3. **Emergence-Aware Value Learning**:  
     - Assume values *co-evolve* with capability. Use reflection mechanisms (e.g., iterated debate) where AIs critique and refine their own normative frameworks.  
     - *Example*: "Value reflection engines" where AIs simulate societal consequences of moral principles at scale.  

  4. **Anti-Reductionist Oversight**:  
     - Restrict decomposition to *instrumental* tasks (e.g., "Assess physical safety"), reserving *ultimate* values (e.g., "What is dignity?") for human deliberation.  

  ### Conclusion  
  IDA’s presuppositions align with functionalist moral epistemology: values are computational states stable under division. It excludes holistic, non-reductive, or emergentist conceptions of ethics. While defensible within a naturalistic framework, its asymmetry relies on treating values as *fixed functions* rather than dynamic constructs. An emergentist alternative would prioritise contextual learning and dialectical synthesis—sacrificing IDA’s scalability for philosophical consistency. The tension underscores a deeper question: **Can alignment ever be "solved" procedurally, or must it remain an interpretive practice?**
