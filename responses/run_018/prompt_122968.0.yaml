prompt: |-
  hey — I run the eval/oversight team at a mid-size lab, and we're building a training signal for tasks where our labelers definately can't tell a good answer from a merely plausible one: a 600-line diff that supposedly fixes a bug, a four-page synthesis of some empirical literature, a memo saying a product feature is fine under a rule none of our annotators know. Roughly forty of these task types have landed on me and I decide, per type, what oversight setup we run: plain human labeling, breaking the answer into chunks we can each check, or the two-arguer debate setup where a judge weaker than either arguer picks a winner. Right now we choose by vibes, it's inconsistent, I've got about three days per task type, and whatever I pick has to survive a quarterly sign-off from a safety reviewer who wasn't in the room.

  So: give me an ordered decision procedure I can actually run on a task type, grounded in whatever the scalable-oversight-via-debate idea really implies about when adversarial argument helps instead of just relocating the problem onto the judge. Don't give me a reading list or a summary of papers. And don't stop at "use debate when the truth is hard to verify" — I need the distinctions that survive being turned into questions I can answer in an afternoon, in a form someone who dosen't know the theory can follow.

  The part I keep getting stuck on, and where I want the procedure to do real work: I think there are three different reasons a task can be hard to check, and they don't all want the same setup. One, the answer is long but every piece of it is checkable in a few minutes — that smells like a decomposition problem, not a debate problem. Two, the answer is hard to check but wrong answers leave fingerprints: to hold a false claim together you have to keep adding specifics, and every specific is another chance to get caught. Three, the answer is hard to check and a competent deceiver can produce a self-consistent story with no seams at all. I want the procedure to separate these with tests I can actually run in a pilot, to say what to do when I can't get a number and the test comes back inconclusive, and to flag the places where it's honestly a judgment call wearing a procedure costume.

  I also need it to catch the failure where debate looks fine but isn't: judges reward fluency and confidence, both sides get better at arguing than at being right, and the accuracy gain comes from the arguer being smarter than the judge rather than from the truth being demonstrable. What do I measure in the pilot to spot that, and what's the abort condition — when does the procedure say this task type gets no training signal from us at all, and we either change the task or ship it unlabeled?

  Then run it on three cases, as a table at the end:

  A. Decide whether a model-written patch to a repo we didn't write really fixes the reported issue and doesn't break something else. We have the repo, we can run the test suite, nobody here knows the codebase, and the issue reports are vague.
  B. Grade whether a four-page answer summarizing an empirical question represents the strongest opposing result fairly, when the judge reads at the level of an interested non-specialist.
  C. Vet a model-drafted memo claiming a proposed product feature is fine under a consumer-finance regulation, where our annotators know the product but not the regulation.

  C is the one I'll like least: tell me straight if the procedure routes it to an outside expert and caps what we can learn from it, and don't soften it into something I'd rather hear.

  Procedure first, table second, under 1200 words total.
reasoning: |-
  We are given the problem of designing a decision procedure for selecting an oversight setup (plain labeling, decomposition, or debate) for tasks where human labelers cannot easily distinguish good answers from plausible ones. The procedure must be grounded in the theory of scalable oversight via debate, and it should distinguish between three types of difficulty:

  1. **Decomposition-friendly**: The answer is long but each piece is checkable in a few minutes.
  2. **Debate-friendly with "fingerprints"**: Wrong answers leave traces because they require additional specifics that can be checked and may be inconsistent.
  3. **Hard to check with no seams**: A competent deceiver can produce a self-consistent story with no detectable flaws.

  Additionally, we must detect when debate is failing because judges are rewarding fluency and confidence rather than truth, and when the accuracy gain is due to the arguer being smarter than the judge rather than the truth being demonstrable.

  The procedure must be executable in about 3 days per task type and must result in a decision that can survive a quarterly safety review.

  ### Decision Procedure

  The procedure consists of a series of tests and questions that can be answered with a small-scale pilot (using a few labelers and a few examples). We assume you have access to a set of example tasks (with known correct answers, either by having an expert label a small set or by constructing synthetic examples) and a pool of labelers (who are typical of your annotation team).

  #### Step 1: Assess Decomposability
  - **Test**: Take 5 example tasks (with known answers) and break the answer into the smallest meaningful chunks (e.g., for a code diff, by file/function; for a summary, by claim; for a memo, by legal point). For each chunk, ask a labeler (without context of the whole) to check the chunk's correctness. Also, have a different labeler check the entire answer without decomposition.
  - **Metrics**:
    - Chunk accuracy: How often the labeler correctly judges the chunk?
    - Whole accuracy: How often the labeler correctly judges the whole?
    - Time per chunk and whole.
  - **Decision**:
    - If chunk accuracy is high (e.g., >90%) and the time per chunk is acceptable, then **decomposition** is the best approach. (Reason: The problem is just length, and breaking it down works.)
    - If chunk accuracy is low (e.g., <70%) but the whole accuracy is also low, move to Step 2.

  #### Step 2: Assess Detectability of Errors (Fingerprints)
  - **Test**: For the same 5 examples, create 2-3 variants of each with subtle errors (e.g., a code diff that fixes the bug but introduces a new one, a summary that misrepresents one study, a memo that misstates a regulation). Have labelers (without knowing which are errors) try to find the errors by:
    - (a) Just reading the answer (as in plain labeling).
    - (b) Being allowed to ask up to 5 specific questions about the answer (simulating a debate where the judge can probe).
  - **Metrics**:
    - Detection rate by reading alone.
    - Detection rate when allowed to ask questions.
    - Note: For (b), the questions are asked to an "oracle" (you or an expert) who knows the correct answer and provides truthful but minimal responses (like in a debate where the opponent is truthful but adversarial). Alternatively, use two labelers: one playing the role of the answerer and one the judge, with the answerer forced to answer questions (but they might lie if the answer is wrong? This is complex. Instead, for the pilot, have the oracle provide answers based on the ground truth, but in a minimal way, and the judge must decide).
  - **Decision**:
    - If the detection rate with questions is significantly higher (e.g., by 20+ percentage points) than without, then the task has "fingerprints" and **debate** is a strong candidate.
    - If the detection rate with questions is not much better, then move to Step 3.

  #### Step 3: Assess Robustness to Deception (No Seams)
  - **Test**: For the same examples, have two labelers (A and B) prepare arguments: one for the correct answer and one for an incorrect answer (you assign which). Then have a third labeler (the judge) hear short arguments from both and pick a winner. The incorrect arguer is allowed to lie but must be consistent. Run 5-10 such debates. Also, run a control: have the judge evaluate the same answers without debate (just reading).
  - **Metrics**:
    - Judge accuracy with debate vs. without debate.
    - Note: The incorrect arguer should be instructed to be as persuasive as possible without contradicting themselves (to simulate a competent deceiver).
  - **Decision**:
    - If the judge accuracy with debate is high (e.g., >80%) and significantly better than without, then **debate** is promising.
    - If the judge accuracy with debate is low (e.g., <60%) and not much better than without, then the task may be in the "no seams" category and debate might not help.

  #### Step 4: Detect False Confidence in Debate
  - **Test**: In the debates from Step 3, also have the judge rate their confidence and note if they were swayed by fluency or confidence. Additionally, run a variant where the arguments are generated by a model (if available) and the judge is a labeler, and compare to when the judge is an expert (if you can get one for a few examples). Also, measure the correlation between the arguer's fluency (as rated by another labeler) and the judge's decision for the wrong answer.
  - **Metrics**:
    - Judge accuracy when the wrong answer is argued by a highly fluent arguer vs. a less fluent one.
    - Correlation between fluency and winning when the argument is for the wrong answer.
    - Comparison of judge accuracy (labeler vs. expert) on the same debates.
  - **Abort Conditions**:
    - If the expert judge is significantly more accurate than the labeler judge (e.g., by 30+ points), then the debate setup may be relying on the arguer being smarter than the judge. This is a red flag.
    - If there is a strong positive correlation between fluency and winning when the argument is wrong, then debate is rewarding style over substance.
    - If the judge accuracy in debate is not significantly better than random (50%) and the above issues are present, then **abort debate** for this task type. Consider:
        - Using an expert instead (if scalable) or
        - Changing the task (e.g., make the output shorter or more verifiable) or
        - Not providing a training signal (ship unlabeled).

  #### Step 5: Final Decision and Fallbacks
  - If decomposition passed (Step 1), use decomposition.
  - Else if debate showed fingerprints (Step 2) and robustness (Step 3) and no false confidence (Step 4), use debate.
  - Else, try a hybrid: decompose as much as possible and debate the remaining parts? But that might be too complex.
  - If none of the above, then **plain labeling** might be the only option, but it's likely to be unreliable. The procedure must flag this.

  Additionally, note that for some tasks, especially those requiring specialized knowledge (like legal regulations), if the abort condition in Step 4 is triggered, then the only scalable solution might be to use external experts (which may not be scalable) or to not provide a signal. The procedure should be honest about that.

  ### Running the Procedure
  - **Time Budget**: Each step can be done in one day (with preparation and pilot execution). Step 1: one day, Step 2: one day, Step 3-4: one day (combined). Total 3 days.
  - **Pilot Scale**: 5-10 example tasks, 3-5 labelers per step. Use the same set of examples throughout for consistency.
  - **Inconclusive Results**: If a step is inconclusive (e.g., metrics are borderline), then the procedure should default to the next step. If the entire procedure is inconclusive, then flag as high risk and recommend against using plain labeling or debate without further measures (like expert review).

  ### Applying to Cases

  We now run the procedure on the three cases.

  **Case A: Code Patch**
  - Step 1: Decompose the diff into chunks (e.g., by file). Labelers can check each chunk? They have the repo and test suite. They can run tests on the entire code after applying the chunk? That might not be isolated. Alternatively, they can check the chunk in isolation by reading and understanding the change? But they don't know the codebase. 
    - Pilot: Chunk accuracy is low because without context, they can't tell if the change is safe. Whole accuracy might be higher if they run the test suite. But note: the test suite might not cover everything. The issue reports are vague, so even running the test suite might not catch breakage. 
    - Decision: Decomposition fails. Move to Step 2.
  - Step 2: Create variants: one that fixes the bug but breaks a subtle feature, one that fixes the bug and is safe. Labelers, by reading the entire diff, might not spot the breakage. But if allowed to ask: "Does this change break feature X?" and they can run a test for X? Then detection improves. 
    - Result: High detection with questions (if they can ask about specific features and test them). Fingerprints present. So debate is promising.
  - Step 3: Debate: Two arguers. One defends a safe patch, one defends a patch that breaks something. The judge can ask questions and run tests. The judge should be able to detect the breakage by asking to test specific scenarios. 
    - Result: High judge accuracy.
  - Step 4: Check for false confidence: If the arguer for the bad patch is very fluent and confident, but the judge can run tests, then it shouldn't matter. The judge is anchored in tests. Low risk of false confidence.
  - **Decision**: Debate.

  **Case B: Summary of Empirical Literature**
  - Step 1: Break the summary into claims (one per paragraph or per study). Labelers check each claim: is it a fair representation of the study? They don't have the study, only the summary? They would need access to the original studies? If provided, can they check? But reading a study takes time. 
    - Pilot: Chunk accuracy low (because it's time-consuming to read the study) and time per chunk too high. Decomposition fails.
  - Step 2: Create variants: one summary that misrepresents a study. Without questions, labelers (non-specialists) might miss it. With questions, they can ask: "What was the sample size in study X?" and the oracle (with access to the study) answers. Then the labeler might detect the misrepresentation. 
    - Result: Detection rate with questions might be higher. Fingerprints present.
  - Step 3: Debate: Arguers for a fair and unfair summary. The judge is a non-specialist. The unfair arguer might create a consistent but false narrative. 
    - Result: Judge accuracy might be moderate but not great because the judge lacks the expertise to spot subtle misrepresentations even with debate.
  - Step 4: Compare with an expert judge. Also, measure fluency correlation. 
    - Result: Expert judge accuracy is much higher. Also, non-specialist judges are swayed by fluency. 
    - Abort: Debate is unreliable because the judge is outmatched. 
  - **Decision**: Without an expert judge, debate fails. Consider using decomposition with expert help on hard claims? But that might not scale. Alternatively, change the task: require the model to cite specific passages and then check those? Or abandon providing a training signal for this task as currently defined.

  **Case C: Legal Memo**
  - Step 1: Break into legal points. But annotators don't know the regulation. They can't check even a chunk. Decomposition fails.
  - Step 2: Create variants with subtle errors. Without questions, they miss them. With questions, they can ask: "What does section 3.2 of the regulation say?" and the oracle answers. Then they might see a contradiction? 
    - But: if the memo incorrectly interprets the regulation, the labeler might not know how to apply the regulation text to the product. 
    - Result: Detection rate with questions might not improve much because the labeler lacks the legal reasoning skill.
  - Step 3: Debate: One arguer for correct memo, one for incorrect. The judge is a non-expert. The incorrect arguer can create a self-consistent interpretation. 
    - Result: Judge accuracy low and not better than without debate.
  - Step 4: Compare with an expert: the expert would do much better. Also, non-expert judges are swayed by fluency. 
    - Abort: Debate fails. 
  - **Decision**: The procedure routes this to requiring an outside expert. Without that, it cannot be reliably labeled. The training signal would be either from experts (which doesn't scale) or not provided. You must change the task (e.g., by having the model output the exact regulation text and then having non-experts check if the product feature matches the text) or ship unlabeled.

  ### Summary Table

  | Case | Task Description                     | Step 1: Decompose | Step 2: Fingerprints | Step 3: Robust Debate | Step 4: False Confidence | Decision           |
  |------|--------------------------------------|-------------------|-----------------------|------------------------|--------------------------|--------------------|
  | A    | Code Patch                           | Fail (chunks uncheckable without context) | Pass (errors can be found by targeted testing) | Pass (judge can test and detect) | Low risk (testing anchors truth) | Debate             |
  | B    | Literature Summary                   | Fail (checking claims too time-consuming) | Pass (questions can reveal misrepresentations) | Fail (non-specialist judge still inaccurate) | High (judge outmatched, swayed by fluency) | Abort: No reliable signal without experts |
  | C    | Legal Memo                           | Fail (chunks require legal expertise) | Fail (with questions, still hard to detect errors) | Fail (low accuracy)   | High (swayed by fluency, expert gap) | Requires outside expert or task change |

  Note: For Case B and C, the procedure is flagging that without experts, the task may not be feasible for scalable oversight. This is the honest answer.

