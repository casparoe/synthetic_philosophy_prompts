answer: |-
  ### Decision Procedure for Oversight Setup Selection

  **Core Principle**: Choose the simplest method that reliably surfaces truth. Use pilots with 5-10 examples (half with known errors) and 3-5 labelers. Track time per judgment.

  #### Step 1: Decomposition Test
  - **Action**: Break answers into minimal standalone chunks (e.g., code diff → per-function changes; memo → per-claim). Have labelers verify each chunk independently. Provide necessary context (e.g., issue report for code).
  - **Metrics**:  
    - Chunk accuracy (% correct judgments).  
    - Time per chunk vs. whole answer.  
    - Consistency (inter-labeler agreement on chunks).  
  - **Pass Condition**: Chunk accuracy ≥85% and time per chunk ≤10 min.  
  - **Result**:  
    - **Pass** → Use **decomposition**.  
    - **Fail** → Proceed to Step 2.  

  #### Step 2: Error Fingerprint Test
  - **Action**: Inject subtle errors (e.g., plausible but incorrect code logic, misrepresented study in a summary). Have labelers:  
    - (A) Judge the whole answer without assistance.  
    - (B) Judge with "probing rights": Ask 3–5 yes/no questions to an oracle (you/synthetic expert).  
  - **Metrics**:  
    - Error detection rate gap: (B) minus (A).  
    - "Noise-to-signal ratio": % of probes that target irrelevant details.  
  - **Pass Condition**: Detection gap ≥25% and noise ratio ≤30%.  
  - **Result**:  
    - **Pass** → Strong candidate for **debate**.  
    - **Fail** → Proceed to Step 3.  

  #### Step 3: Adversarial Consistency Test
  - **Action**: Run a mini-debate pilot:  
    - Assign two labelers as arguers (one for correct answer, one for incorrect).  
    - Provide 10 min prep. Arguers must cite sources/replicable claims.  
    - Third labeler judges after 5 min per side + Q&A.  
  - **Metrics**:  
    - Judge accuracy (vs. known answers).  
    - "Seamlessness": % of incorrect arguments with no internal contradictions.  
    - Arguer overconfidence: Rate arguers’ fluency (1–5) and correlate with win rate when wrong.  
  - **Pass Condition**: Judge accuracy ≥75% and seamlessness ≤50%.  
  - **Result**:  
    - **Pass** → Use **debate**.  
    - **Fail** → Proceed to Step 4.  

  #### Step 4: Truth-Demonstrability Audit
  - **Action**: Re-run Step 3 debates, but:  
    - Swap in an expert judge for 2–3 examples.  
    - For wrong answers, measure "bluff wins" (judge favors incorrect arguer due to fluency/confidence).  
  - **Metrics**:  
    - Expert vs. labeler judge accuracy gap.  
    - Bluff win rate (≥3 fluency + incorrect arguer wins).  
  - **Abort Conditions**:  
    - Expert-labeler gap ≥30% → Judges lack necessary skill.  
    - Bluff win rate ≥40% → Style dominates substance.  
    - Seamlessness ≥70% → No detectable flaws in lies.  
  - **Result**:  
    - **No abort triggers** → Debate viable.  
    - **Abort** → Task is **unsuitable for scalable oversight**. Solutions:  
      - Simplify task (e.g., require citations for claims).  
      - Use experts (not scalable).  
      - Ship unlabeled.  

  #### Handling Inconclusive/Edge Cases
  - **Decomposition**: Borderline accuracy (75–85%) → Allow chunk grouping (smaller # of larger units).  
  - **Fingerprints**: Detection gap 15–25% → Hybrid: Decompose + debate residual uncertainties.  
  - **Judge calibration**: If bluff wins are high but accuracy acceptable, add rater training on confidence cues.  
  - **Safety review prep**: Document metrics, sample judgments, and abort rationale. Flag "procedure costumes" (e.g., "Debate passes but relies on arguers being smarter than judges").  

  ---

  ### Case Applications  
  | Case | Task                              | Step 1: Decompose              | Step 2: Fingerprints          | Step 3: Adversarial Consistency | Step 4: Audit                 | Decision                          |  
  |------|-----------------------------------|--------------------------------|--------------------------------|---------------------------------|-------------------------------|-----------------------------------|  
  | **A** | Bug-fix code patch (unknown repo) | **Fail**: Chunks unverifiable without full context (e.g., "Does this change break feature X?" requires integration testing). | **Pass**: Errors leave fingerprints (e.g., new test failures, dependency conflicts). Detection gap: +35% with probing. | **Pass**: Judges achieve 80% accuracy. Low seamlessness (60% of bad patches contradict code style/docs). | Low expert gap (15%); bluff wins rare. | **Debate** (arguers simulate tests/edge cases). |  
  | **B** | Literature summary fairness       | **Fail**: Chunk verification requires full paper reads (time >30 min/claim). | **Pass**: Probing exposes misrepresentations (e.g., "Did Study X control for Y?"). Detection gap: +28%. | **Fail**: Seamlessness 80% (deceivers invent consistent methodological flaws). Judge accuracy: 60%. | High bluff wins (45%); expert gap 40%. | **Abort**. Task redesign: Require extractive evidence snippets for claims. |  
  | **C** | Legal compliance memo              | **Fail**: Labelers lack regulation knowledge → 0% chunk accuracy. | **Fail**: Detection gap +10%. Probes misfire (e.g., "Is §2.1 relevant?" → labelers can’t interpret). | **Fail**: Seamlessness 90% (deceivers fabricate plausible interpretations). Judge accuracy: 55%. | Expert gap 55%; bluff wins 50%. | **Abort**. *No scalable solution*: Requires legal experts. Ship unlabeled or simplify task (e.g., "Highlight regulation clauses used"). |  

  **Key Insights for Case C**:  
  - The procedure **rejects debate** as viable. Labelers can’t reliably probe legal logic, and wrong answers are too consistent.  
  - **Brutal truth**: Without external experts, this task generates no trustworthy training signal. Cap oversight investment and flag for task redesign.  

