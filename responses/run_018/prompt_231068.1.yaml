              - Therefore, Requirement 1 fails: the promise is not a commitment by the maker (it's a command to the machine). -> NO.

      If the pitch had said: "the tyrant had promised to poison the land, and the machine is carrying out that promise", then it would be:

          a. Promise: Poison the land (as a commitment by the tyrant to someone?).
          Then it would meet Requirement 1.

      But as given, it's NO.

      Therefore, the procedure:

          - Must be run as above.
          - It is mechanical except for the judgment about what counts as a promise and what counts as the maker being gone.

      We'll note: the procedure leans on a specific interpretation of Hofstadter's model by breaking the theme into discrete knobs and requiring that the load-bearing knobs (the ones that define the abstract pattern) are fixed. The non-load-bearing knobs can be turned arbitrarily. We have identified the load-bearing knobs as the ones that define the structure of the theme (the promise, the maker's absence, the keeper being distinct, and the keeping after absence). This is in the uncontroversial core.

      However, the requirement that the keeper must be distinct (and not the maker) is an interpretation that we have added based on the examples and the theme's emphasis on the absence of the maker. Hofstadter's model doesn't specify which knobs are load-bearing; we have to deduce them from the theme. This deduction is part of the procedure.

      Also, the definition of "promise" is a judgment call that might be stretched. We have taken a strict view. The team might decide to broaden it. That would be a project-level decision.

      Finally, the procedure does not account for the thematic depth or the emotional resonance. It only checks the structural fit.

      We'll write the procedure in a way that the leads can run without knowing the theory:

          PROCEDURE: THEME COHESION CHECK

