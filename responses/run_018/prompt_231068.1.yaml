  ### Theme Cohesion Evaluation Procedure  
  Based on Hofstadter's "knob-twiddling" model, this procedure evaluates whether a pitch preserves the core theme **"a promise kept after the person who made it is gone"**. The load-bearing knobs (non-negotiable) are **Promise Essence**, **Maker's Absence**, and **Keeper's Agency**. If any of these are altered, the theme drifts. Non-load-bearing knobs (flexible) include *Motivation*, *Beneficiary Status*, and *Method of Keeping*.  

  #### Step-by-Step Procedure for Reviewers  
  **(Run this checklist in 5 minutes per pitch)**  

  1. **EXTRACT THEME COMPONENTS (Knobs)**  
     - Ask: *"What is the* ***core promise*** *explicitly made by someone?"* (Must be a voluntary commitment, not a command/instinct).  
     - Ask: *"Is the* ***promise-maker gone*** *and unable to oversee fulfillment?"* (Gone = dead, destroyed, or permanently inaccessible).  
     - Ask: *"Who is* ***keeping the promise*** *and are they* ***not the maker****?"* (Keeper must be a distinct entity).  
     - Ask: *"What is the* ***mechanism of keeping****?"* (How is it sustained? Optional: note motivation/beneficiary).  
     - ***JUDGMENT CALL:*** *If the promise feels ambiguous or involuntary, flag it.*  

  2. **IDENTIFY LOAD-BEARING KNOBS**  
     - **Promise Essence (Fixed):** The core commitment must remain recognizable. *Why?* Changing this alters the "soul" of the promise.  
     - **Maker’s Absence (Fixed):** The maker must be irrevocably gone. *Why?* The theme hinges on absence as the central obstacle.  
     - **Keeper’s Agency (Fixed):** Keeper must be distinct from the maker. *Why?* If the keeper *is* the maker, absence isn’t meaningful.  
     - *Non-load-bearing knobs:* Motivation (duty/love/malice), beneficiary (existing/dead), or method (literal/metaphorical).  

  3. **TEST FOR THEME DRIFT**  
     Apply the **"Absence Paradox" Test**:  
     - *"If the maker suddenly returned, would the keeper’s actions feel redundant, unnecessary, or absurd?"*  
       - **YES** = Theme intact (keeping only matters *because* maker is gone).  
       - **NO** = Theme broken (keeping would occur regardless of absence).  
     - ***JUDGMENT CALL:*** *If the test is inconclusive, the pitch is borderline.*  

  4. **BORDERLINE MARKERS**  
     - Uncertainty in Step 1 (e.g., "Is this *really* a promise?").  
     - "Absence Paradox" test is unclear.  
     - Keeper’s identity/maker’s absence is semantically fuzzy.  

  ---

  ### Evaluation of Sample Pitches  
  **Core Theme:** "A promise kept after the person who made it is gone."  
  **Load-Bearing Knobs:**  
  - **Promise Essence:** Voluntary commitment by maker.  
  - **Maker’s Absence:** Maker is permanently gone.  
  - **Keeper’s Agency:** Keeper ≠ maker, acting *because* maker is gone.  

  #### Pitch 1: Merchant delivers letters for a dead courier  
  - **Step 1 (Extract Knobs):**  
    - Promise: Deliver letters (voluntary commitment by courier).  
    - Maker’s Absence: Courier is dead (gone).  
    - Keeper: Merchant (≠ courier).  
    - Mechanism: Physically delivering letters.  
  - **Step 2 (Load-Bearing):** All intact.  
  - **Step 3 (Absence Paradox Test):**  
    - *If courier returned:* Merchant’s deliveries redundant. **→ YES (Theme intact).**  
  - **VERDICT: YES**  

  #### Pitch 2: Villain keeps treaty with a city that no longer exists  
  - **Step 1 (Extract Knobs):**  
    - Promise: Uphold treaty terms (voluntary commitment by villain *and* city).  
    - Maker’s Absence: City is gone, *but villain (maker) is still present*.  
    - Keeper: Villain (same as maker).  
    - Mechanism: Enforcing treaty clauses.  
  - **Step 2 (Load-Bearing):** **Keeper’s Agency BROKEN** (keeper = maker).  
  - **Step 3 (Absence Paradox Test):**  
    - *If city returned:* Villain would still enforce treaty (as co-maker). **→ NO (Theme broken).**  
  - **VERDICT: NO**  
    - **Why?** The keeper *is* the promise-maker, negating the absence. Theme drifts to "obsession with rules," not "promise beyond maker’s absence."  

  #### Pitch 3: Machine poisons land per dead tyrant’s last order  
  - **Step 1 (Extract Knobs):**  
    - Promise: Tyrant’s order to poison land (*involuntary command*, not voluntary promise).  
    - Maker’s Absence: Tyrant dead (gone).  
    - Keeper: Machine (≠ tyrant).  
    - Mechanism: Automated poisoning.  
  - **Step 2 (Load-Bearing):** **Promise Essence BROKEN** (command ≠ promise).  
  - **Step 3 (Absence Paradox Test):**  
    - *If tyrant returned:* Machine would still execute order (programmed compulsion). **→ NO (Theme broken).**  
  - **VERDICT: HARD BORDERLINE (leans NO)**  
    - **Why?** An order is not a promise. Theme drifts to "mindless obedience," not "keeping a commitment." *Judgment call: "Promise" requires volition.*  

  ---

  ### Key Insights from the Procedure  
  1. **Why These Knobs Are Load-Bearing:**  
     - **Promise Essence:** The theme centers on a *volitional human commitment*. Turning this into a command/algorithm removes the moral weight of "keeping" something meant to be consensual.  
     - **Maker’s Absence:** If the maker isn’t truly gone (e.g., accessible or the keeper themselves), the "after" clause collapses.  
     - **Keeper’s Agency:** A keeper who *is* the maker (Pitch 2) or lacks autonomy (Pitch 3) turns the theme into "self-persistence" or "compulsion," not loyalty beyond death.  

  2. **Where Judgment Calls Occur:**  
     - Step 1 (defining "promise" vs. "command").  
     - Step 3 (interpreting the "Absence Paradox").  
     - *Mitigation: Have leads document disagreements here for calibration.*  

  3. **Contested Model Leans:**  
     - Hofstadter’s model implies knobs are context-dependent, but this procedure **fixes Promise/Maker/Keeper** as universal load-bearers. This is a *deliberate stretch* to force consistency.  
     - The "Absence Paradox" test is an original addition to operationalize theme drift.  

  ### Outcome  
  - **Pitch 1:** Clear YES (all knobs preserved).  
  - **Pitch 2:** Hard NO (keeper = maker).  
  - **Pitch 3:** Borderline NO (command ≠ promise).  
  **Recommendation:** Reject Pitches 2 and 3 unless revised (e.g., Pitch 3 could become "machine fulfills tyrant’s *dying wish* as a sworn oath").  

  This procedure forces binary decisions on load-bearing knobs and exposes ambiguity rather than hiding it. Use the **Absence Paradox** test as the tiebreaker when intuition clashes.
