 “satirical_target” (string), “wittgensteinian_concepts_parodied” (array of strings), “invented_bureaucratic_mechanism” (string), “internal_contradiction_highlighted” (string), and “liberties_or_contested_readings_noted” (string). In the final field, briefly state where the satire exaggerates or relies on a contested reading—for instance, whether family resemblance can be formalized administratively, or whether language-game norms carry regulatory force.
