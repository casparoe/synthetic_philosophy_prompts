answer: |-
  ## Villanelle on Procreation's Edge

  We feel no call to grant a happy life,
  For joy unborn leaves no one truly marred.
  But spare the suffering life from mortal strife;
  A child unknown bears no inherent scar,
  No ghostly face behind the glass we carve.
  We feel no call to grant a happy life.

  That cry, once uttered, *is* the child we gave,
  Bound up within the flesh our choices wrought.
  But spare the suffering life from mortal strife;
  For pain defines the self, uniquely grave –
  The only self this world could e'er have brought.
  We feel no call to grant a happy life.

  The light we might have sparked? It fades to air,
  A weightless absence lost beyond our sight.
  But spare the suffering life from mortal strife;
  For missing bliss lacks substance, void of care,
  While agony demands its starkest right.
  We feel no call to grant a happy life.

  What ledger balances the unmade days?
  What phantom ink this moral law rewrites?
  But spare the suffering life from mortal strife.
  No unborn soul demands our fleeting praise,
  No missing voice implores, or prays, or fights.
  We feel no call to grant a happy life.
  But spare the suffering life from mortal strife.

  Here reason halts before the silent stone:
  The harm in lack, the hurt in being born.
  To not create is not to harm alone;
  To make a pained one breaks the calm, full-blown.
  The duty borne, the blessing we had sworn.
