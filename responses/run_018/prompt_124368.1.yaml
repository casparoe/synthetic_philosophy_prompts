answer: |-
  Your confusion is understandable—this "mean-reference weighting" variant sits at a tense boundary between prioritarianism and egalitarianism, and the leveling-down objection exposes its conceptual ambiguity. Let's break it down step by step, using your example:

  ### Key Distinctions: Prioritarianism vs. Egalitarianism
  1. **Standard Prioritarianism**:
     - Moral weight depends **solely on absolute welfare levels** (e.g., Parfit's "priority to the worse-off").
     - A benefit to a person at welfare level 2 matters more *because 2 is low*, not because others are at 5 or 9.
     - **Rejects leveling-down**: Reducing the well-off (9→7) without helping anyone else is never desirable. Total weighted welfare must increase.

  2. **Egalitarianism**:
     - Values **relational equality** (reducing gaps between individuals).
     - Can endorse leveling-down: Reducing 9→7 *while leaving others at 2 and 5* might be desirable if it shrinks inequality—even if no one gains.

  3. **Leveling-Down Objection (LDO)**:
     - The core critique of egalitarianism: It's implausible to prefer a state where some are worse off and no one is better off.

  ### Mean-Reference Weighting: A Hybrid?
  - **How it works**: Priority weight scales with **distance below the mean**. If the mean is μ, a person at welfare *w* gets priority proportional to (μ - *w*) (if *w* < μ).  
  - **Your example**:  
    - Initial state: (2, 5, 9) → μ = 16/3 ≈ 5.33  
      - Priorities: 2 is 3.33 below μ, 5 is 0.33 below, 9 is above (zero priority for losses).  
    - Redistribution: Tax 9→7, boost 2→4 → New state (4, 5, 7) → μ = 16/3 ≈ 5.33 (same mean!).  
      - Distances: 4 is 1.33 below μ, 5 is 0.33 below, 7 is 1.67 above.  

  - **Why redistribution *might* be preferred**:  
    The gain to the worst-off (2→4) is weighted by their *initial* distance below μ (3.33). The loss to the best-off (9→7) is weighted by their distance *above* μ (3.67). If the weighting function is symmetric (e.g., concave for gains, convex for losses), the high-priority gain for the worst-off could outweigh the lower-priority loss of the best-off. **Total weighted welfare increases**.

  ### Does This Dodge the Leveling-Down Objection?
  - **Not necessarily—it depends on the weighting function**:  
    - If the function **only cares about improving those below μ**, it avoids pure leveling-down (no policy that *only* harms the well-off would be preferred).  
    - But if it **values reducing distance to the mean *for its own sake***, it *could* endorse leveling-down in cases like this:  
      - Consider **pure leveling-down**: Reduce 9→5, leaving 2 and 5 unchanged. New state: (2, 5, 5) → μ = 4.  
        - The person at 9 (now 5) was +3.67 above μ, now +1 above the new μ.  
        - The person at 2 was -3.33 below μ, now -2 below the new μ.  
        - **No one gains welfare**, but the "distance burden" of inequality decreases.  
      - If the function assigns moral value to *reducing the aggregate distance-to-mean* (even without welfare gains), this could be preferred. That **is** leveling-down.  

  ### Is This Still Prioritarianism?
  - **Yes, but a controversial variant**:  
    - Traditional prioritarianism uses **absolute welfare** for weighting (e.g., giving more weight to gains at *w*=2 than at *w*=5). Mean-referencing makes weight **relational** (depending on others' welfare), which imports egalitarian concerns.  
    - Philosophers like Derek Parfit would reject this as impure: *True* prioritarianism shouldn't care whether the worst-off is at 2 in a world where μ=3 or μ=5.  
    - However, some (e.g., Michael Otsuka) argue that relational elements can coexist with prioritarianism if the *goal* remains improving individual well-being, not equality per se.  

  ### Where Your Reasoning Breaks Down
  1. **Conflating redistribution with leveling-down**:  
     Your example involves **leveling-up the worst-off** (2→4) alongside leveling-down (9→7). This isn't pure leveling-down—it's a trade-off prioritarianism *can* endorse (if weighted gains > losses). Pure LDO requires *no gains, only losses*.  

  2. **Assuming mean-referencing *must* endorse leveling-down**:  
     It only endorses leveling-down if the weighting function values *reducing inequality* independently of welfare improvements. If it only values **improving the absolute position of the worse-off** (even with relational weights), it avoids LDO.  

  ### Conclusion
  - **Mean-reference weighting is a hybrid**: It blends prioritarianism's focus on the worse-off with egalitarianism's concern for relative position.  
  - **It can dodge LDO only if it rejects "inequality reduction" as an intrinsic good**: If it weights gains/losses based on distance-to-mean but *only* when welfare changes, it avoids endorsing pure leveling-down. But if it values smaller distance-to-mean *even without welfare gains*, it collapses into egalitarianism and succumbs to LDO.  
  - **Your roommate is half-right**: This variant *can* license reducing the well-off's welfare—but only when paired with gains to the worse-off (which isn't leveling-down). If it ever endorses harming the well-off *without* helping others, it’s egalitarian, not prioritarian.  

  **Practical test**: Does the theory prefer (2,5,9) over (2,5,5)? If yes, it’s prioritarian. If no, it’s egalitarian and vulnerable to LDO. Your example doesn’t settle this—it requires examining cases with *no winners*.
