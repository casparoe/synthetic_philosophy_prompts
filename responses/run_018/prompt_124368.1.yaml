  The user might also be worried about their argument with the roommate. They claimed mean-reference is egalitarian, but the roommate thinks it's prioritarian. Clarifying definitions is crucial. If prioritarianism strictly uses absolute levels, then mean-reference isn't prioritarian. But some philosophers might categorize it under prioritarianism if the weighting is based on individual welfare, even if relationally defined. This is a terminological issue. The deeper issue is whether it commits to the Pareto principle (no one worse off without someone better off). Traditional prioritarianism does; egalitarianism doesn't. If mean-reference violates Pareto by preferring pure leveling down, it's egalitarian. If not, it's a form of prioritarianism with a different weighting basis.

  In the user's example, the redistribution involves both leveling down and up. The better-off is pulled down, the worse-off up. So it's not leveling down per se. The question is whether prioritarianism could justify such a trade-off. Traditional prioritarianism might, depending on the weights. But mean-reference adds a relational aspect. The user's confusion might stem from equating any trade-off that reduces inequality as egalitarian. But prioritarianism can also favor such trades if the weighted gains exceed the losses. The distinction is in why: prioritarianism because the worse-off benefit more in moral terms; egalitarianism because inequality is reduced. Mean-reference blurs this by using mean-distance, which is relational.

  To resolve, the user needs to check if mean-reference prioritariansim ever prefers scenarios where no one gains. If yes, it's vulnerable to leveling-down objection. If not, it might still be prioritarian, though non-standard. The roommate's point about shrinking mean-distance for the group might imply valuing reduced inequality per se, which is egalitarian. But in the example, it's paired with a gain for the worse-off. So it's a mix. The user's initial claim that it's egalitarian in disguise has merit because the weighting depends on relational position. But it's not pure egalitarianism since it doesn't advocate leveling down without gains. 

