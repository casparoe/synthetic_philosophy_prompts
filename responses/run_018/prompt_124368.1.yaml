  i told her that's just egalitarianism in disguize because prioritarian weights depend on your individual welfare level, not on relational distance, but now im second-guessing. if you have three people at welfare 2, 5, and 9, and you can either leave them alone or tax the 9 down to 7 and boost the 2 up to 4, doesn't the mean-referance version prefer the second option? and if so, doesn't that prove there's a coherent prioritarian framework where leveling-down is genuinely required, rather than just an egalitarian mistake? i feel like im conflating the weighting function with the objection itself, but i can't see exactly where my reasoning breaks. can you clear up whether this kind of scheme counts as prioritarian at all, and whether the leveling-down worry hits it in a different way?
