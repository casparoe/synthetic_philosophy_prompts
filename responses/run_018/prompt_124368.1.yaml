  Okay, let me start by unpacking this user's question. They're in a philosophy of welfare course and debating prioritarianism with their roommate. The main issue is whether a "mean-reference weighting" variant of prioritarianism can avoid the leveling-down objection or if it's just egalitarianism in disguise.

  First, I need to recall the core differences between prioritarianism and egalitarianism. Prioritarianism gives extra weight to benefits for the worse off, but it's based on absolute welfare levels, not comparisons. Egalitarianism cares about reducing inequality, which can lead to leveling down—making some worse off without helping others. The leveling-down objection criticizes egalitarianism for that.

  The user mentions "mean-reference weighting." Here, the moral weight depends on how far below the mean someone is. So if someone is far below average, helping them has higher priority. The roommate thinks this could justify leveling down to shrink the mean-distance overall. The example given: three people at 2, 5, 9. Taxing the 9 down to 7 and boosting the 2 to 4. The question is whether mean-reference prioritarianism prefers this redistribution.

  I need to analyze the math here. Calculating the mean: originally, (2+5+9)/3 = 5.33. After redistribution, (4+5+7)/3 = 5.33. Same mean. The person at 9 (now 7) was above mean, now closer but still above. The person at 2 (now 4) was below mean, now closer. The one at 5 remains the same. 

  For prioritarianism to prefer redistribution, the sum of weighted gains for the worse-off must outweigh the weighted losses of the better-off. The gain for the person going from 2 to 4: their distance from mean changed from -3.33 to -1.33. The loss for the one from 9 to 7: distance from +3.67 to +1.67. The weighting function would assign a higher weight per unit benefit to the one further below. But in this case, the loss of the better-off is weighted less because they're above the mean. The key is whether the weighted gains exceed the weighted losses. Depending on the specific function, it might prefer redistribution. But is that leveling down? The better-off is worse off, but the worse-off is better off. So it's not pure leveling down. Pure leveling down would be reducing the 9 to 5 without helping the 2, which makes inequality less but no one better off. Here, someone benefits. So this isn't leveling down in the classic sense.

  But the user's confusion is whether this makes prioritarianism collapse into egalitarianism. The mean-reference version introduces a relational element (distance to mean), which is a feature of egalitarianism. Traditional prioritarianism uses absolute levels. So mean-reference is a hybrid. It might be called "relational prioritarianism," but it's controversial whether it's still prioritarian. 

  The leveling-down objection typically targets cases where no one gains but someone loses. In this example, the worst-off gains, so it's not leveling down. However, if there were a scenario where reducing the better-off's welfare brings them closer to the mean without helping anyone else, and the system prefers that, then it would be leveling down. For instance, reducing the 9 to 7 without changing the 2. The mean drops to (2+5+7)/3 ≈ 4.67. The 9's distance from mean was +3.67, now +2.33. The 2's distance was -2.67, now -2.67 (since mean is lower). The 2 is still equally far below the new mean. So no one is better off, but the better-off is worse off. Would mean-reference prioritarianism prefer this? That depends on the weighting function. If the weight for the loss of the better-off is low because they were far above the mean, but since no one gains, the total weighted welfare would decrease. After all, total welfare has gone down. Unless the weighting function is such that reducing inequality has intrinsic value, which prioritarianism usually denies. If the function assigns positive value to reducing the welfare of those above the mean simply because it decreases their distance, that would be leveling down. But that would make it egalitarian, not prioritarian.

