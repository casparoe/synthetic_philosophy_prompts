  First, I need to recall what luck egalitarianism is. It's the idea that inequalities due to circumstances (like being born poor) should be compensated, but those from choices (like working hard) are acceptable. The recursive problem is that after compensation, say through educational subsidies, those subsidies now affect future choices. For example, a student gets a subsidy for education, which then influences their career choices. The new inequalities from those choices need classification again. If the subsidy is now part of circumstances, does that mean any resulting inequality needs more compensation? That could lead to endless adjustments. 

