     Choose 1 if s-1 < 100-s, i.e., s < 50.5.
     Choose 100 if s>=50.5.
     Then the distance is min(s-1, 100-s).
     The expected distance = [ for s=1 to 50: s-1, for s=51 to 100: 100-s ] 
     = [0 to 49 for s=1 to 50] and [49 down to 0 for s=51 to 100] -> average = ( average of 0..49 ) = (0+49)*50/2 / 50 = 24.5
     expected payoff = 100 - 24.5 = 75.5, same as without information.

   Not worse.

   If they are forced to choose between 1 and 100 and they have no information, they would choose arbitrarily, say 1, and then expected distance = average |s-1| for s in 1..100 = (0+1+2+...+99)/100 = 49.5, so payoff=50.5. Then with the signal, they get 75.5, which is better.

   So to make it harmful, we need the default action without information to be good, and the forced choice after signal to be between two bad actions.

   For example, without information, they can choose any action, and they choose 50.5, getting 75.5.
   With information, they are forced to choose between action 1 and action 100, and as above, they get 75.5.

   So the information is not harmful, but not helpful.

   But if we make the forced actions even more extreme? It doesn't change.

   Alternatively, if the state space is not uniform. 

   state is either 1 or 100, each with probability 0.5.
   actions: any number in [1,100].

   Without information, choose 50.5, then:
     if state=1: |1-50.5|=49.5 -> payoff=50.5
     if state=100: |100-50.5|=49.5 -> payoff=50.5
     expected=50.5.

   With information, they can choose state: for state=1, choose 1 -> payoff=100; state=100, choose 100 -> payoff=100; expected=100.

   But if after receiving the signal (which is the state) they are forced to choose between 1 and 100, then:
     if state=1: they choose 1 -> 100
     if state=100: they choose 100 -> 100
     expected=100.

   still better.

   I am out of ideas for now. Given the time constraints, I will design the game with the following simpler idea that captures the commitment aspect:

   The Workshop Game: "The weather and the party"

   Two states: 
     State R: It is raining.
     State S: It is sunny.

   Two actions:
     Action I: Hold the party indoors.
     Action O: Hold the party outdoors.

   However, the players are event planners who must commit to a contingency plan in advance.

   The catch: the players are not deciding the action for themselves, but for a client who is very wealthy but very whimsical. The client will only allow the planners to condition the action on the weather report if the planners can provide a simple rule in advance. The client requires that the rule must be submitted in a sealed envelope before the report is received, and it must be one of two pre-specified rules. The client's mood is affected by the weather in a way that the planners do not initially know.

   The planners will be told that the client's satisfaction depends on the weather and the location in a way that will be revealed after they commit to a rule.

   The game will have two stages:

   Stage 1: Without any information about the client's preferences, the planners must choose one of two rules for how to use the weather report:

     Rule 1: If the report says "rain", then indoors; if "sun", then outdoors.
     Rule 2: If the report says "rain", then outdoors; if "sun", then indoors.

   Stage 2: The facilitator then reveals the client's satisfaction payoffs:

     If it is raining and the party is indoors: 10 points
     If it is raining and the party is outdoors: 0 points
     If it is sunny and the party is indoors: 0 points
     If it is sunny and the party is outdoors: 10 points

   This is the standard case where Rule 1 is optimal and Rule 2 is harmful.

   But then the planners in stage 1, not knowing the payoffs, might choose randomly between Rule 1 and Rule 2. In repeated plays, they will learn.

   But we want them to experience that the information can be harmful. So we will not let them learn. We will have only one round.

   To make them choose Rule 2, we can lie about the client's preferences in the initial description. For example, we can say:

     "The client is very unconventional and might enjoy being outdoors in the rain or indoors on a sunny day."

   Then, without knowing, they might choose Rule 2.

   Then, after they commit to Rule 2, we reveal the actual payoffs ( which are conventional: indoors in rain and outdoors in sun are good).

   Then, we simulate the weather: say, we toss a coin for weather (rain or sun, equal probability). Then, we also have a weather report that is accurate. Then we apply their rule.

   If they chose Rule 2:
     If rain -> outdoors -> 0
     If sun -> indoors -> 0
     So they get 0 on average.

   Without the signal, they would have to choose a fixed action (indoors or outdoors) without knowing the weather. 
     If they choose indoors: 
          rain:10, sun:0 -> expected 5
     If they choose outdoors: 
          rain:0, sun:10 -> expected 5
     So they would get 5 on average.

   Thus, by accepting the signal and using Rule 2, they got 0, which is worse than the 5 they would have gotten without the signal.

   But why would they choose Rule 2? Because they were told the client is unconventional, but then we reveal that they are conventional. This is欺骗, which might not be well-received.

   Alternatively, we can have two different client types, and the planners don't know which type it is. But that adds complexity.

   Given the time, I will design the activity as follows, with an honest structure:

   We will have two rounds. In each round, the players make a choice that affects their points. The first round is without information, the second round is with information and a fixed response rule. The fixed response rule is set by the majority vote of the group, and the group is given very little time to decide, and moreover, they are given false information about the payoffs in the second round.

   This is not ideal, but it will create the experience.

   Detailed timeline for a 60-minute session:

   0-5 min: Introduction to the activity. Explain that they are event planners for a client. They will make decisions about where to hold a party (indoors or outdoors) based on the weather (rain or sun). The weather for the day of the party is determined by a coin flip (50% rain, 50% sun). They will play two rounds.

   5-15 min: Round 1 (without information) 
     - Each player individually decides on a fixed action: indoors or outdoors.
     - The facilitator then reveals the weather (by coin toss) and the payoffs for Round 1:
          indoors in rain: 10 points
          outdoors in sun: 10 points
          indoors in sun: 0 points
          outdoors in rain: 0 points
     - Players who chose the matching action get 10 points; others 0.
     - The expected score is 5.

   15-30 min: Round 2 ( with information, but with a twist)
     - The players are told that they will receive a free and accurate weather report before the party. 
     - However, the client this time is different and has unconventional preferences. The facilitators provide a description of the client's preferences for Round 2: 
          "This client is an artist who loves contrasts: they enjoy being outdoors in the rain and indoors on a sunny day."
     - The players, as a group, must choose one of two rules by majority vote within 2 minutes. The rules are:
          Rule 1: if rain, then indoors; if sun, then outdoors.
          Rule 2: if rain, then outdoors; if sun, then indoors.
     - They are told that the payoffs will be revealed after they choose the rule.
     - After they vote and choose a rule (hopefully Rule 2 because of the description), the facilitator reveals the actual payoffs for Round 2: 
          indoors in rain: 10 points
          outdoors in sun: 10 points
          indoors in sun: 0 points
          outdoors in rain: 0 points
     - The players protest, but the facilitator says that the client's agent has now provided the actual payoff structure, and it is too late to change the rule.
     - Then the weather is determined by coin toss, the signal (weather report) is given (which is accurate), and the rule is applied. 
     - If they chose Rule 2: they get 0 points regardless of the weather.
     - If they had chosen Rule 1, they would have gotten 10 if matching, 0 otherwise -> expected 5.

   30-40 min: Repeat Round 2 with a new vote, but this time with the correct payoffs known. This time, they will choose Rule 1 and see that it is beneficial. This is to show that when they can adapt optimally, information is good.

   40-55 min: Debrief.
     - Ask the players to share their scores and how they felt in Round 2 when they got 0 points after choosing Rule 2.
     - Explain that in Round 2, they experienced a situation where having information lowered their expected score because they were committed to a rule that was set in advance and could not be changed after learning the payoffs.
     - Relate to Good's theorem: the value of information is the increase in expected utility that it allows. In the theorem, information is never harmful if the agent is free to adapt their action optimally after receiving the information. In Round 2, they were not free to adapt because they had to set the rule in advance and then were stuck with it even after learning the true payoffs. This violates the free-action condition.
     - Highlight the boundary: information can have negative expected value when the agent is committed to a fixed response rule that is not adjusted to the new information (in this case, the new information about the client's true preferences came after they set the rule).

   55-60 min: Conclusion and take-aways.

   Materials: 
     - A coin for weather determination.
     - Score sheets for each player.
     - Voting for the rule in Round 2.

   Honest note: 
     - In this simulation, the harm from information arose because of a specific type of commitment: the rule was set based on incomplete or incorrect knowledge of the utility function, and then the utility function was revealed too late to change the rule. In Good's theorem, the utility function is typically known in advance. The theorem assumes that the agent knows the utility function and can always choose the best action for any state of knowledge. In our game, the information about the utility function arrived after the commitment to the rule, which is a feature not covered by the theorem. However, the activity illustrates the more general point: when the agent cannot adapt their action optimally (for any reason), information can be harmful.

   This is the best I can do within the constraints.

   Let's hope they choose Rule 2 in Round 2 based on the description of the client.

   If they choose Rule 1 in Round 2, then they will get an expected 5, which is the same as Round 1, and we can say that the information didn't help or hurt in this case because they happened to choose the right rule. So we might need to engineer the vote to choose Rule 2 by giving a very convincing description.

   Alternatively, we can make the vote blind and then as the facilitator, we can simply set it to Rule 2 for the sake of the lesson. But that's not in the spirit.

   We can also have two groups and give them different information, but that might be complicated.

   Given the time, I think the above is workable.

   So the structure is:

     - Round 1: no information, choose action -> expected 5.
     - Round 2: 
          - They are told the client is unconventional (loves rain outdoors and sun indoors).
          - They vote on a rule (Rule 1 or Rule 2) -> we hope they choose Rule 2.
          - Then we reveal that the client is actually conventional.
          - Apply the rule -> they get 0 on average.
     - Round 3 (optional): with the same client (conventional preferences) and they vote again knowing the preferences -> they choose Rule 1 and get 5 on average.

   Then in the debrief, compare Round 2 (0) to Round 1 (5) to show the information was harmful.

   Let's schedule:

     0-5: intro
     5-15: Round 1
    15-30: Round 2 (including voting and then revelation of true payoffs and then weather toss and scoring)
    30-35: Round 3 (re-vote and re-run with the same weather as in Round 2? or new weather toss? new toss)
    35-55: debrief
    55-60: wrap-up

   This fits in 60 minutes.

   In the debrief, map specific moments:
     - In Round 1, without information, they could only get 5 on average.
     - In Round 2, they had information about the weather, but because they were committed to a rule (Rule 2) that was set before knowing the true payoffs, they ended up with 0.
     - In Round 3, with the same information about the weather and now knowing the payoffs, they could set the rule optimally (Rule 1) and get 5 on average (which is the same as Round 1 in this run, but note: in Round 3, if they could condition optimally, they would get 10 on average. However, in this setup, the rule is still set in advance, but now they know the payoffs so they set the right rule. And then they get 10 when the weather matches and 0 when it doesn't, so average 5 because they only have the action for the reported weather, and sometimes it's wrong? Wait, the signal is accurate, so in Round 3 with Rule 1, they always get 10? 

   Let me clarify: 
     - In Round 3, the weather is determined by coin toss, and the signal is accurate. 
     - They vote for Rule 1: if rain -> indoors, if sun -> outdoors.
     - Then we apply the rule: when it rains, they do indoors -> 10 points; when sun, outdoors -> 10 points.
     - So expected 10.

   Then we have:
     Round 1: 5
     Round 2: 0
     Round 3: 10

   But then the harm in Round 2 is clear: 0<5.

   And in Round 3, we see that when they can set the rule optimally (because now they know the payoffs), the information is very helpful (10>5).

   So the schedule becomes:

     0-5: intro
     5-15: Round 1 (without information, expected 5)
    15-30: Round 2 (with information but they are tricked into a bad rule, expected 0)
    30-35: Round 3 (with information and correct rule, expected 10)
    35-55: debrief
    55-60: wrap-up

   But then we need to conduct three weather coin tosses.

   Alternatively, to save time, we can do only Round 1 and Round 2, and in the debrief, explain what would happen if they had known the payoffs in advance.

   Given the time, I think three rounds are possible.

   Let's do it.

   Materials:
     - Coin for weather.
     - Score sheet for each player to record their points in each round.
     - A voting box or show of hands for the rule in Rounds 2 and 3.

   Payoff scheme: points, no real money.

   We are done.
answer: |-
  Dear colleague, 

  As requested, I've designed a one-hour workshop activity to illustrate the boundary of Good's theorem where even accurate information can reduce expected value due to constrained action. The setup uses a simple decision scenario with weather-dependent payoffs, and participants experience firsthand how committing to a fixed response rule before knowing their own utility function makes information harmful. Here’s the full plan as prose.  

  We begin with a five-minute introduction. Explain that participants are event planners deciding where to host a party—indoors or outdoors—with payoffs depending on weather (rain or sun). Emphasize that weather is determined by a fair coin flip (50% rain, 50% sun) and that they’ll play two rounds with cumulative points. Use points, not money; each point corresponds to client satisfaction.  

  For the first ten minutes, run Round 1: No information. Each player privately commits to either indoors or outdoors. Reveal the weather via coin toss. Payoffs are then announced: indoors during rain gives 10 points; outdoors during sun gives 10 points; any mismatch gives 0. Participants record scores. Expected value is 5 points (since half guess correctly), establishing a baseline.  

  Next, Round 2 runs for fifteen minutes. Announce that a free, perfectly accurate weather forecast is available. Crucially, participants must now commit to a fixed response rule *before* learning payoffs. Present two rules: Rule A states "if forecast says rain, choose indoors; if sun, choose outdoors." Rule B states the opposite: "if rain, outdoors; if sun, indoors." To create the commitment trap, frame Rule B as appealing: "This round’s client is an eccentric artist who loves irony—being outdoors in rain and indoors in sun sounds poetic!" (This misdirection ensures participants likely vote for Rule B.) Hold a one-minute group vote; majority chooses the rule. *Then* reveal the actual payoffs—identical to Round 1: 10 points only for rain/indoors or sun/outdoors, 0 otherwise. Flip the coin for weather, apply the chosen rule, and assign points. If Rule B was selected (as intended), all get 0 points regardless of weather. Expected value drops to 0, below Round 1’s 5. Participants feel the loss: "free" information lowered scores.  

  As a bridge to the debrief, run a five-minute Round 3. Now reveal payoffs *before* voting. Participants vote again on Rule A or B. They choose Rule A (optimal), and after a new coin flip, scores rise to 10 (expected). This contrasts sharply with Round 2’s failure.  

  The twenty-minute debrief starts by asking participants to describe Round 2’s frustration: they received accurate information yet scored worse. Map this to Good’s theorem: information’s value assumes agents can *optimally adapt* actions after receiving it. In Round 2, they couldn’t adapt—they committed to a fixed rule (Rule B) before knowing payoffs. Highlight the disconnect: the vote tied the rule to a fictional utility (the "artist’s preferences"), locking them into suboptimal actions even after real payoffs were known. Contrast Round 3, where knowing payoffs first allowed optimal adaptation (Rule A), making information beneficial. Stress that Good’s result holds only when actions are freely adjustable post-information; commitment violates this, causing the negative value they experienced.  

  An honest limitation: This simulation cannot reproduce Good’s assumption that agents know their own utility function pre-commitment. Here, payoff ambiguity (not the signal itself) created the harm, whereas the theorem assumes known utilities. Verbally clarify that real-world analogs occur when constraints (e.g., contracts, cognitive biases, or institutional rules) prevent re-optimization after new data. Conclude by linking to decision-theoretic principles: rational agents must weigh not just information cost, but flexibility cost under constraints.  

  Total timing: intro (5 min), Round 1 (10 min), Round 2 (15 min), Round 3 (5 min), debrief (20 min), conclusion (5 min). Materials needed: coins for weather, scorecards, voting slips. Roles: all twelve as individual planners; you as facilitator. This flows in sixty minutes, with participants viscerally grasping the theorem’s boundary.  

  Best of luck with your workshop—I hope it sparks rich discussion.  

  Warmly,  
  Your assistant
