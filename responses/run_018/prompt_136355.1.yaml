  (b) Probability that predictive-processing accounts are primarily mechanistic. These models aim to explain how the brain works, not just predict outcomes. While they use normative frameworks, the goal is mechanistic understanding. Recent work tries to link Bayesian inference to neural processes. So I'd say higher probability, maybe 0.7.

