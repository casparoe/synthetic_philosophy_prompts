prompt: |-
  I'm preparing a long-form feature on how scientists defend models built on premises they know to be false. At a recent seminar I encountered an argument I haven't seen widely circulated: that Milton Friedman's F-twist—the idea that unrealistic assumptions are harmless so long as predictions hold—collapses when applied to predictive-processing frameworks in cognitive neuroscience. The claim was that treating the brain as an optimal Bayesian agent with unbounded computational resources is not a tractable simplification like perfect competition, but a shift that turns a mechanistic explanation into a normative one. Consequently, predictive accuracy regarding neural dynamics does not license the idealization in the way Friedman intended.

  I'd like your calibrated view, not a survey of the literature. What's your actual credence, on a scale of 0 to 1, that Friedman's F-twist genuinely applies to these predictive-processing models—specifically, that the optimal-inference idealization can be defended solely by predictive success without undermining the model's mechanistic credentials? Give me a number and decompose the reasoning.

  Please split the credence into at least these terms: (a) the probability that Friedman's original argument was intended to cover idealizations that change a model's explanatory kind, not merely its tractability; (b) the probability that predictive-processing accounts are primarily mechanistic rather than normative; (c) the probability that brain-level optimal-inference assumptions belong to the same class of harmless idealizations as classic economic ones, rather than being structurally different; and (d) any other factor you judge decisive. For each term, provide a rough numeric weight, one line of justification, and show how they combine into your final figure. Then identify the term in which you are least confident and specify what conceptual or empirical finding would move it most. Keep the response within 350 words, and do not provide citations, bibliographies, or reading lists; I'm working without direct access to a library.
