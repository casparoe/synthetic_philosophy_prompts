answer: |-
  Your observation captures a subtle but significant epistemic maneuver that sits at the intersection of assertion, methodology, and intellectual bad faith. While no single established term perfectly maps to your description, the closest conceptual neighbors and their limitations are below. I'll then propose a coinage with clear boundaries.

  ### Why Existing Concepts Fall Short:
  1. **Contextualism**:  
     While contextualism (e.g., DeRose, Lewis) allows that the truth-conditions of "knows X" vary by context, it doesn't cover *deliberate reclassification* of the same claim’s status by the speaker across time. Contextualism is about audience standards, not speaker convenience.

  2. **Assertoric Force vs. Content**:  
     Searle/Austin’s speech acts distinguish *what* is said from *how* it’s presented. But your case involves identical phrasing used with *incompatible forces* (factual claim vs. heuristic) without signaling the shift—a violation of Gricean cooperation.

  3. **Stance Voluntarism (Van Fraassen)**:  
     The idea of adopting a "stance" (e.g., empiricism) as a methodological choice resembles the "working posture" defense. But voluntarism doesn’t license *surreptitiously* converting stances into premises for knowledge claims later.

  4. **Kuhnian Paradigms**:  
     Treating X as an "organizing frame" echoes paradigms guiding inquiry. Yet Kuhn’s paradigms are communal and explicit, not individual tools toggled mid-debate to evade accountability.

  ### The Core Mechanism: Epistemic Camouflage
  Your pattern hinges on a **covert epistemic toggle**: the same proposition (X) is strategically assigned incompatible statuses (knowledge vs. heuristic) to serve distinct rhetorical goals, *without acknowledging the inconsistency*. The speaker avoids conceding error while retaining X’s utility.

  ### Proposed Coinage: **Epistemic Shape-Shifting**
  **Definition**: A discursive tactic where an agent asserts a proposition *as knowledge* when its epistemic support is challenged, they *redefine it as a methodological tool* (heuristic, frame, posture), but later *revert to treating it as knowledge* when citing it in support of other claims—all without disclosing these shifts.

  #### Boundary Conditions (Carving the Joints):
  | Feature               | Epistemic Shape-Shifting                            | Legitimate Practices                                                                 |
  |-----------------------|-----------------------------------------------------|--------------------------------------------------------------------------------------|
  | **Disclosure**        | *Never* flags status changes; toggling is covert.   | Explicit markers ("Assume X for sake of argument," "As a heuristic, let’s use X..."). |
  | **Consistency**       | X used as knowledge *and* tool *without* reconciling the tension. | Provisional claims cited *as provisional*; knowledge claims defended as such.        |
  | **Function**          | Evades accountability while retaining X’s utility.  | Scaffolds inquiry (heuristics) or builds arguments (knowledge).                      |
  | **Defensive Response**| Retreats to methodology *only* under pressure.      | Methodology is *primary* justification from outset (e.g., modeling assumptions).     |
  | **Interdisciplinary Borrowing** | N/A: X is from the same speaker/context.          | Transparent about importing concepts across fields ("In economics, X means...").     |

  ### Key Differentiators:
  - **vs. Strategic Ambiguity**: Ambiguity exploits vague terms. Here, X is *precise*—the shift is in its *epistemic status*, not meaning.  
  - **vs. Loose Speech**: We often say "X is true" when we mean "X is plausible." But if challenged, we *correct* ("Okay, it’s likely"). Shape-shifting *doubles down* via redefinition.  
  - **vs. Belief Revision**: If the speaker said, "I once believed X, now I see it as just a tool," it’s honest updating. Shape-shifting *denies* the update occurred.

  ### Why It Matters:
  This is **epistemically toxic** because it:  
  1. Immunizes claims from criticism ("It’s just a frame!").  
  2. Illegitimately transfers credence (using X as a heuristic shouldn’t bolster it as evidence later).  
  3. Violates norms of intellectual transparency (e.g., Haack’s "intellectual honesty").

  **Example Contrast**:  
  - **Shape-Shifting**:  
    - Day 1: "Capitalism causes climate change!" → When pressed: "I’m using it as a *lens*!"  
    - Day 2: "We know capitalism causes climate change [per prior work], so policy must..."  
  - **Legitimate Heuristic**:  
    - "For this analysis, *adopt the lens* that capitalism causes climate change. Later, we’ll test this."  
    - *Later*: "Our *assumption* that capitalism causes climate change led to Y, but it needs verification."

  ### In Short:
  You’ve identified **epistemic shape-shifting**—a pattern of *unacknowledged status-switching* that abuses the flexibility of assertion to avoid accountability. Its essence isn’t just contextual variability but *agent-driven sleight-of-hand* in epistemic commitments. The critical carve-out: if the speaker ever admits, "I treat X as true here but heuristic there," it collapses into ordinary pragmatism. The deception is the pivot.
