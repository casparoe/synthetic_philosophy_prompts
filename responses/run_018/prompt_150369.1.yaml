prompt: |-
  I'm helping a mate organise a philosophy of science reading group and we got into a weird argument about whether machine learning has secretly solved Hume's problem of induction, or just made it more embarassing. Could you write a joke for us that actually turns on the real content of Wolpert's no-free-lunch theorum and the old induction problem? The punchline needs to hinge on the niche technical point that NFL only bites if you average uniformly over all possible target functions — which means the proof already smuggles in a symmetric inductive prior about problem spaces being equally likely. So imagine an ML grad student in a pub trying to defeat a Humean sceptic by citing NFL, and the sceptic replying that the uniform prior is exactly the kind of unjustified induction they were arguing about all along. Keep it casual, make sure it's in British English, and please don't make it some generic 'AI is stupid' gag — it should only really land if you actually know what the theorum says. (Apologies, I just noticed I spelt embarrassing with only one r — clearly I'm not inducting well today either.)
