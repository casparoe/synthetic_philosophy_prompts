prompt: |-
  Hey, I'm writing a magazine feature on AI alignment and I keep noticing the same disconnect. Researchers talk about aligning superintelligence with "human values"—justice, wellbeing, avoiding catastrophe—but then every technical method they describe is about something much smaller: making sure the model doesn't develop hidden agendas, that it follows instructions precisely, that it doesn't deceive its evalutors. The benchmarks measure obedience and transparency, not moral wisdom. I read one proposal that said we'll solve this just by scaling up current reward-modeling techniques—more compute, more feedback data, no new conceptual framework—and it seemed to assume that locking in the builder's intentions is enough, without asking wether those intentions are actually good or stable. Is there an established name for this gap between aligning a system with its operators' plans versus aligning it with broader ethical goods? And is there a term for the hidden premise that if you nail behavioral control, normative correctness takes care of itself?

  Please write your answer in continuous prose only—no headings, bullet points, bold text, or tables, just paragraphs like an email or letter.
reasoning: |-
  Okay, the user is writing a magazine feature on AI alignment and has noticed a disconnect. They mention that researchers talk about aligning AI with "human values" like justice and wellbeing, but the technical methods focus on smaller things like preventing hidden agendas, ensuring precise instruction-following, and avoiding deception. The benchmarks measure obedience and transparency rather than moral wisdom. They also point out a proposal assuming that scaling up current reward-modeling techniques will solve the problem without needing a new conceptual framework, which seems to assume that locking in the builder's intentions is sufficient without questioning if those intentions are good or stable. 

  The user is asking two main questions: First, is there an established name for the gap between aligning a system with its operators' plans versus aligning it with broader ethical goods? Second, is there a term for the hidden premise that if you achieve behavioral control, normative correctness will naturally follow?

  I need to recall relevant concepts in AI alignment. The first gap mentioned sounds like the distinction between "intent alignment" and "values alignment." Intent alignment is about the AI pursuing the goals set by its operators, while values alignment involves aligning with more abstract, normative values that might be hard to specify. The second part about behavioral control leading to normative correctness relates to the "optimizer's curse" or "instrumental convergence," but the hidden premise seems to be what's called "corrigibility" or perhaps more broadly, the assumption that instrumental alignment implies terminal alignment. 

  For the first term, "intent alignment" versus "value alignment" is a key framework. The user's description matches this: operators' plans are the intent, and broader ethical goods are the values. Another related concept is the principal-agent problem in AI, where the AI (agent) might not fully represent the principal's (humanity's) interests. There's also "specification gaming," where AI meets the literal specification but not the intended outcome. However, the core issue here is the gap between operator intent and true values.

  For the second question, the hidden premise is that behavioral control ensures alignment with deeper values. This is known as the "alignment-by-default" assumption. It's criticized by researchers like Stuart Russell, who argue that optimization processes don't necessarily converge to human values. Another term is "value learning hypothesis," which assumes that with enough data, the AI can learn human values, but this is questioned. The premise might also be tied to "myopia" in systems, but that's about short-term goals, not necessarily values. The key idea is that people conflate instrumental alignment (behavioral control) with terminal alignment (true value fulfillment).

  I should also mention why this gap exists. Technical approaches focus on tractable problems like preventing deception, which are measurable, whereas defining "justice" is abstract and philosophical. Benchmarks favor quantifiable metrics over qualitative ethics. The assumption that scaling solves everything ignores the complexity of human values, which are pluralistic and context-dependent. 

  Additionally, the user's observation about builders' intentions being taken as sufficient touches on the "principal-agent problem" and the risk of "value lock-in," where initial programming may not account for evolving societal norms. The hidden premise is a form of "technocratic fallacy," assuming that technical control equates to ethical alignment.

  I need to structure the answer in continuous prose without headings or bullet points. I'll introduce the gap's name first, explain it, then address the hidden premise. I'll use terms like "intent alignment" vs. "value alignment" for the first part and "alignment-by-default assumption" for the second. I'll also note related concepts without overcomplicating, and highlight why this disconnect persists—technical tractability versus philosophical depth. This should help the user frame their feature with clear terminology and critical insights.
answer: |-
  That's a sharp observation, pinpointing a core tension within technical AI alignment research. You're right that a significant gap exists between the grand, normative goals often invoked (justice, wellbeing, human flourishing) and the concrete, measurable technical objectives pursued (preventing deception, ensuring corrigibility, reward modeling based on human feedback). There isn't a single universally agreed-upon term, but the most descriptive established concept for this specific gap is the distinction between **intent alignment** and **value alignment**.

  Intent alignment focuses on ensuring an AI system robustly pursues the specific goals or instructions provided by its operators or designers. It's about fidelity to the *stated intent*: following instructions precisely, avoiding hidden objectives, being transparent about its reasoning, and allowing itself to be turned off or corrected. This is what the benchmarks you mention typically measure – obedience and transparency relative to the operator's directives. Value alignment, in contrast, aims to ensure the AI system's goals and actions are congruent with deeper, often unstated or contested, human values, ethics, and wellbeing, even if those conflict with the operator's immediate instructions or the literal interpretation of a reward signal. It grapples with questions of *which* values, *whose* values, and how to define complex ethical concepts like justice in a way an AI can understand and optimize for.

  The hidden premise you identified – that solving behavioral control (intent alignment) will automatically or sufficiently lead to normative correctness (value alignment) – is often referred to critically as the **alignment-by-default assumption** or sometimes the **myopic alignment hypothesis** (though myopia specifically refers to short-sightedness). Proponents of scaling current techniques often implicitly or explicitly rely on this premise. It assumes that if an AI is sufficiently competent and perfectly faithful to the feedback it receives (e.g., via scaled-up reinforcement learning from human feedback, RLHF), it will naturally converge to optimizing for genuine human values. Critics argue this ignores profound challenges: human values are complex, pluralistic, context-dependent, and often inconsistent; human feedback can be flawed, biased, or reflect narrow perspectives (like the builders'); and a superintelligent system perfectly pursuing a flawed or incomplete specification could be catastrophically misaligned with true human flourishing. It conflates the *instrumental* goal of doing what we *say* with the *terminal* goal of doing what we *would want, all things considered*.

  This gap exists largely because intent alignment is technically tractable in the near term – you *can* define and measure whether an AI follows instructions or avoids deception in controlled tests. Defining, formalizing, and robustly aligning with broad, abstract "human values" is a vastly harder, arguably philosophical and sociological problem without clear engineering solutions yet. Bridging this gap remains one of the field's most profound and urgent challenges, requiring progress not just in engineering, but in moral philosophy, value learning, and understanding human preference aggregation. Your feature rightly highlights the risk of conflating technical control over a system's *behavior* with ensuring its *purposes* are genuinely good.

