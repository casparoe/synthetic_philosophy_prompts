answer: |-
  Your biologist's intuition is insightful but ultimately **doesn't salvage moral realism** against the causal inertness argument. The analogy collapses decisively because **adaptive landscapes are descriptive, predictive models within a natural scientific framework, while moral properties are inherently normative and lack the necessary connection to empirical facts or predictive power.** Here's the precise conceptual break:

  1.  **The Fundamental Divide: Description vs. Prescription**
      *   **Adaptive Landscapes/Fitness Functions:** These are *descriptive, explanatory models*. They represent abstract mathematical spaces *derived from and grounded in* causal biological processes (variation, inheritance, differential survival/reproduction). Their "reality" is instrumental: they are powerful tools for *describing* the constraints and probabilities acting on evolving populations and *predicting* evolutionary trajectories based on measurable parameters (fitness values). They don't *cause* evolution, but they *supervene* on and *systematize* the causal facts (who survives, who reproduces). Crucially, **they tell us *what is likely to happen*, not *what ought to happen*.** They are part of a *causal-explanatory* framework, even if abstract.
      *   **Moral Properties (e.g., "wrongness," "obligation"):** These are *prescriptive, normative* properties. Their core function is to tell us *what we ought to do*, *what is required*, or *what is forbidden*, irrespective of what *is* the case or what *is likely* to happen. This "ought" is not derived from, nor reducible to, the descriptive facts systematized by models like adaptive landscapes. **The normative "push" of morality is categorically different from the probabilistic predictions of evolutionary biology.** It aims to *guide* or *evaluate* action, not merely describe or predict it.

  2.  **The Collapse of the Analogy: Ontology vs. Instrumentalism and the "Queerness" of Normativity**
      The anti-realist's charge isn't merely that moral properties lack causal power *like* adaptive landscapes do. It's that:
      *   **Adaptive landscapes are ontologically parasitic:** Their legitimacy and "reality" as explanatory tools *entirely depend* on their successful systematization and prediction of *underlying causal processes* (gene frequencies changing, traits being selected). They are *instrumental constructs validated by empirical success*. If an adaptive landscape model consistently failed to predict or explain actual evolutionary change, it would be discarded or revised.
      *   **Moral properties demand independent ontological weight:** For the moral realist, properties like "objective wrongness" are supposed to be *real features of the world itself* (or actions/situations within it), existing independently of our models or desires, and generating *reasons for action*. The anti-realist argues:
          *   **No Empirical Anchor:** What empirical, causal facts do moral properties systematize or predict that aren't already captured by non-moral descriptions (psychology, sociology, biology)? If you observe an act of torture, the causal facts are neural pain signals, physiological damage, psychological trauma, social disruption. Where is the extra, non-natural property "wrongness" adding empirical content or predictive power? It seems explanatorily redundant at the descriptive level.
          *   **The "Magnetic" Quality Problem (Mackie's Argument from Queerness):** If "wrongness" *were* a real property "out there," how could it possibly have the necessary connection to *motivation* or *reasons* that moral properties seem to have? Knowing something is "wrong" *ought* (in the moral sense!) to give one a reason not to do it (or feel guilt, etc.). How does a causally inert property in the world *necessarily* provide a motivating reason? This link seems utterly mysterious ("queer") compared to how descriptive facts (like the adaptive landscape predicting extinction) inform our beliefs and *might* then influence our actions based on pre-existing desires (e.g., a desire to preserve the species). Moral properties seem to demand a unique, non-natural, normative "to-be-pursuedness" or "to-be-avoidedness" that has no analogue in scientific descriptive constructs.
          *   **Lack of Predictive Structure:** This is a symptom, not the core flaw. While adaptive landscapes generate quantitative predictions testable against empirical data (e.g., allele frequency changes), moral explanations lack this. Saying "torture is wrong" doesn't predict *that* torture will occur less often than if it weren't wrong (history shows it persists regardless of moral beliefs). Its "explanatory power" is normative justification ("*Why shouldn't* I do this? Because it's wrong"), not empirical prediction.

  3.  **The Category Error: Treating Normativity as Description**
      This is the core mistake salvaging attempts often make. **You are trying to treat *normative commitments* as if they were *descriptive, ontological posits* within a scientific framework.** But "ought" statements fundamentally *prescribe* or *evaluate*, they don't *describe* states of affairs in the way adaptive landscapes describe probabilistic evolutionary pressures. The "reality" of an adaptive landscape is the reality of a successful *representational tool* within science. The "reality" claimed for moral properties is the reality of a *normative force* or *objective value* in the world itself. These are entirely different categories. Science deals with "is"; morality deals with "ought." Trying to ground the "ought" in the "is" is the persistent challenge (Hume's Guillotine), and the causal inertness argument highlights one facet of why this leap fails – the proposed "moral fact" adds nothing causally or predictively to the descriptive facts it's supposed to supervene upon, yet claims a unique, motivating normative authority.

  **Verdict:** Your intuition that science uses non-causal explanatory tools is **correct and valuable**. It shows science isn't naively reductionist. However, applying this to defend moral realism is **ultimately a category error**. The causal inertness argument succeeds against robust moral realism *because* moral properties are inherently normative. They lack the empirical grounding, predictive power, and instrumental utility within a descriptive framework that legitimizes constructs like adaptive landscapes, while simultaneously demanding a mysterious kind of normative "force" or ontological status that has no plausible place in a naturalistic worldview. The analogy collapses on the fundamental distinction between **describing/predicting patterns in the natural world** and **prescribing how agents ought to act within it.** Your biologist's lens helps illuminate scientific methodology, but it doesn't bridge the is-ought gap for moral realism.
