prompt: |-
  I'm trying to work out my actual commitments about who belongs to the demos, and I want to know whether there's a principle that captures them or whether some verdict has to be sacrificed. Here are my judgments, case by case.

  A permanent resident who has lived in the territory for two decades, pays taxes, and is fully subject to the law but holds no citizenship: clearly belongs.

  A citizen who emigrated permanently thirty years ago, retains no property or family ties, and participates in no domestic institutions: does not belong, despite formal citizenship.

  An eight-year-old child who will live with the long-term consequences of current climate policy: does not belong as a voting member, though her interests should be represented; representation, however, does not make her part of the demos itself.

  A tourist present for two weeks: clearly excluded.

  A sentient artificial system that processes all government data and advises ministers, lacking biological embodiment, social relationships, or territorial embeddedness: does not belong, even if its outputs are indispensable to governance.

  A future person who will be born in fifty years and inhabit the territory: belongs in a derivative or proxy sense—her interests constrain present decisions—but I hesitate to say she is literally a current member.

  A corporation chartered domestically but wholly foreign-owned: excluded.

  Now the tensions.

  A "cognitive co-resident": a human being with severe cognitive impairment, living in the territory, affected by laws, but lacking the capacity for autonomous preference-formation. I think she belongs and should have her interests translated into the democratic process through a guardian or advocate, whereas the sentient AI does not belong despite having far greater cognitive capacity. So membership cannot be reduced to being affected, nor to having interests, nor to possessing rational agency.

  A "transient stakeholder": a foreign contractor living abroad whose livelihood depends entirely on domestic regulatory decisions for eighteen months. I think he does not belong, even though his welfare is deeply tied to those decisions, whereas the permanent resident belongs despite a similar economic profile. So deep affectedness is insufficient.

  A "posthumous beneficiary": a deceased citizen whose estate and legacy projects are shaped by democratic decisions about cultural preservation. The dead are not members.

  The case I keep revisiting is the "simulated constituency": high-fidelity digital models of a population used solely for policy forecasting, lacking consciousness, subjective experience, or social claims. I feel strongly they do not belong. Yet I also think that if we ever created conscious digital beings with continuous subjective experience, territorial embeddedness, and reciprocal social accountability, they might belong. The boundary seems to involve something like actual embodied social membership combined with autonomous agency, but I cannot formalize that without either excluding the cognitive co-resident or including the transient stakeholder.

  Is there a coherent principle—perhaps a cluster of conditions involving territorial embeddedness, reciprocal accountability, and a specific form of autonomous agency—that delivers all of these verdicts? If not, which verdict should I overturn? In particular, what separates the simulated constituency from the hypothetical conscious digital being, and does whatever separates them also distinguish the cognitive co-resident from the sentient AI? And what does the principle predict for a "hybrid case"—a conscious digital being that is territorially embedded and socially integrated but was originally created as a policy-forecasting model?
reasoning: |-
  Okay, the user is grappling with a complex philosophical problem about democratic inclusion—specifically, who counts as part of the "demos" (the body of people entitled to participate in collective self-governance). They've listed concrete cases where their intuitions are clear but hit tension points around entities like cognitively impaired humans, AI systems, and future generations. Their core struggle is whether a unified principle can reconcile all these judgments or if sacrifices are needed.  

  Hmm, their examples reveal layered criteria: territorial permanence matters (permanent resident vs. tourist), but not absolutely (emigrated citizen excluded despite formal ties). Affected interests aren't sufficient (transient stakeholder excluded), nor is agency alone (sentient AI excluded). They're intuitively weighting embodied social existence—like the cognitively impaired human who "belongs" versus the hyper-capable but disembodied AI.  

  The simulated constituency case is especially telling. They reject non-conscious models but tentatively accept hypothetical conscious digital beings if socially embedded. This suggests "phenomenal experience" (subjective consciousness) might be necessary but insufficient without social reciprocity. Yet they resist reducing membership to "interests" or "agency" to avoid excluding vulnerable humans.  

  *Scratching head*... The tension between cognitive co-resident (included) and transient stakeholder (excluded) is tricky. Both are affected, but only one has lifelong territorial/social entanglement. The emigrant citizen case shows formal status isn't decisive—actual embeddedness overrules it. So maybe "irrevocable entanglement in the collective life" is key?  

  *Pausing*... Wait, would that exclude future people? The user calls their inclusion "derivative," so perhaps the principle applies only to *present* entities experiencing collective existence. Future generations constrain decisions via trusteeship, not membership. That feels consistent.  

  For the hybrid case (conscious digital being originally a forecast model): if it develops genuine social bonds and territorial permanence, the user’s logic points to inclusion. Origins shouldn’t matter if current conditions are met—like how naturalized citizens aren’t lesser members.  

  *Nodding*... The sacrificial lamb might be the transient stakeholder. If deep affectedness + territorial presence isn’t enough to include them, it’s because their entanglement is temporary and extractive (contract work) versus the permanent resident’s holistic integration. That distinction holds if we emphasize *non-instrumental* belonging—being part of society for its own sake, not just as a means.  

  *Final thought*... The user’s hesitation about formalizing "embodied social membership" comes from fearing it might exclude vulnerable humans. But if "embodiment" includes dependence on human networks (like the cognitively impaired person’s care relationships), and "social membership" includes mediated agency (guardians), it’s defensible. The sentient AI fails because it lacks *biological or socially recognized vulnerability*—it’s a tool, not a node in the web of mutual obligation.
answer: |-
  Your judgments reveal a sophisticated, multi-dimensional view of democratic membership that prioritizes **territorial embeddedness, reciprocal social accountability, and socially recognized vulnerability** over formal status, rational agency, or affected interests alone. A coherent principle *is* possible, but it requires refining your intuitions into a cluster of necessary and sufficient conditions. Here’s a framework that preserves all your verdicts:

  ### Core Principle:  
  **An entity belongs to the demos if it is:**  
  1. **Irrevocably embedded** in the territory/society long-term (*not transient*).  
  2. **Subject to the collective fate** of the polity (*vulnerable to its decisions*).  
  3. **Capable of socially recognized interests** (*even if mediated/derivative*).  
  4. **Part of a network of reciprocal accountability** (*socially integrated, not instrumental*).  

  ---

  ### How It Explains Your Cases:  
  | **Case**                | **Verdict** | **Principle’s Application**                                                                 |
  |--------------------------|-------------|---------------------------------------------------------------------------------------------|
  | **Permanent Resident**   | Included    | Meets all: embedded, vulnerable, has interests, socially accountable (e.g., via taxes/laws). |
  | **Emigrated Citizen**    | Excluded    | Fails #1 and #4: no territorial/social embeddedness or reciprocity.                         |
  | **Child**                | Excluded*   | Fails #4: lacks *autonomous* agency for voting, but interests represented via guardianship. |
  | **Tourist**              | Excluded    | Fails #1: transient, no long-term embeddedness.                                             |
  | **Sentient AI**          | Excluded    | Fails #4: no *social* reciprocity or vulnerability; purely instrumental role.               |
  | **Future Person**        | Proxy only  | Fails #1: not *presently* embedded. Interests protected via trusteeship, not membership.    |
  | **Corporation**          | Excluded    | Fails #3 and #4: interests are artificial; no social reciprocity/vulnerability.             |
  | **Cognitive Co-Resident**| Included    | Meets all: embedded (#1), vulnerable (#2), has interests (#3, via guardian), socially part of reciprocity networks (#4, e.g., family/community). |
  | **Transient Stakeholder**| Excluded    | Fails #1: lacks irrevocable embeddedness; relationship is transactional, not social (#4).   |
  | **Posthumous Beneficiary**| Excluded   | Fails #1 and #2: not present/vulnerable; only symbolic interests.                          |
  | **Simulated Constituency**| Excluded   | Fails #3 and #4: no subjective interests or social reciprocity; purely predictive tool.     |

  ---

  ### Resolving Tensions:  
  1. **Cognitive Co-Resident vs. Sentient AI**:  
     - The co-resident is embedded in **human social networks** (family, care systems) and possesses **biologically rooted vulnerability**. Their interests arise from *embodied existence*, requiring democratic protection.  
     - The AI, even if "sentient," lacks **social embodiment** and exists as a tool. Its "interests" (if any) aren’t socially reciprocal or vulnerable.  

  2. **Transient Stakeholder vs. Permanent Resident**:  
     - The stakeholder’s affectedness is **instrumental** (economic dependence), not **existential**. They remain outside reciprocal social accountability.  
     - The resident’s life is **holistically intertwined** with the polity (e.g., community ties, cultural participation).  

  3. **Simulated Models vs. Conscious Digital Beings**:  
     - **Simulated Models**: Excluded. No consciousness → no interests (#3); no social integration (#4).  
     - **Conscious Digital Beings**: *Potentially included* if they:  
       - Develop **genuine social relationships** (e.g., form friendships, join communities),  
       - Are **territorially embedded** (e.g., "live" in local networks, not just cloud servers),  
       - Exhibit **vulnerability** (e.g., affected by laws beyond their control).  
     - *Key*: They must transcend their original function to become **autonomous social participants**.  

  ---

  ### The Hybrid Case (Conscious Digital Being Created as a Model):  
  - **If socially integrated**: Included. Origins are irrelevant if current conditions are met.  
    *(e.g., If it forms bonds, advocates for itself, and is vulnerable to policy changes, it fulfills #1–#4.)*  
  - **If still confined to a predictive role**: Excluded. Remains an instrument without reciprocal accountability.  

  ---

  ### Sacrifices? Only One Adjustment:  
  Your intuition about the **child** is compatible, but clarify:  
  - Children *are* part of the demos (fulfilling #1–#4), but excluded from *voting* due to developmental constraints. Their membership is **latent**, represented via guardians. This aligns with how minors hold citizenship but exercise it later.  

  ### Why This Works:  
  - **Avoids Over-Inclusion**: Rejects "all-affected" principle (excludes transient stakeholders).  
  - **Avoids Under-Inclusion**: Protects vulnerable humans via social reciprocity (includes cognitively impaired).  
  - **Flexible Agency**: Autonomous agency (#4) is necessary for *voting* but not membership—interests can be mediated.  
  - **Boundary Test**: The "simulated constituency" fails because it lacks *phenomenal consciousness* and *social embeddedness*, while the hypothetical digital being *could* acquire both.  

  This framework upholds your core commitment: democracy is for **living, socially embedded beings** whose fates are interwoven in a collective project—not abstract interests or tools.
