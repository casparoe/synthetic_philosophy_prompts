answer: |-
  You've perfectly described a deep philosophical puzzle that sits at the intersection of metaphysics, philosophy of language, and philosophy of mind. Philosophers absolutely have terms and concepts for this *exact* pattern of disagreement. The most precise label for the **structure of the disagreement itself** is likely a manifestation of:

  1.  **Origin Essentialism:** This is the specific view that the origin or history of an object is an essential property *defining its kind*. It holds that *how* and *where* something came into being is fundamental to *what* it is. A lab-grown heart, despite being molecule-for-molecule identical, originated via artificial processes in a lab. A digital Mona Lisa originated via scanning and pixels. AI text originated via algorithmic processing. Their origins are different from the "original," and for the essentialist, that origin difference *makes* them a different kind of thing, even if all other properties are identical.
      *   **Relation to Essentialism:** This is *directly* about essentialism – specifically, the belief that *origin* is an essential property constitutive of the kind (e.g., "real heart," "authentic painting," "human-authored text"). Essentialism holds that kinds have necessary properties that an object *must* have to be a member of that kind. Origin essentialists argue origin is one such necessary property.

  2.  **Historical Kinds / Causal-Historical Kinds:** Closely related (often the flip side of origin essentialism), this view holds that the kind an object belongs to is determined by its causal history and lineage. Saul Kripke (in *Naming and Necessity*) and Hilary Putnam (with his "Twin Earth" thought experiment) were pivotal in developing this view, particularly for natural kinds like water. Ruth Millikan developed it further for biological and artifactual kinds. A "real heart" is defined by its biological lineage and evolutionary history. A "real Monet" is defined by the specific causal chain originating from Monet's brushstrokes. The replica lacks this specific causal history, placing it in a different kind ("lab-grown organ," "digital reproduction," "AI-generated text") regardless of current properties.
      *   **Relation to Nominalism/Realism:** This view is a form of **Realism about Kinds** (specifically *modal realism* or *historical realism*). It asserts that kinds are real features of the world, not just names we apply based on superficial similarities. The disagreement arises because one side (often intuitively) holds this realist, historically-grounded view of kinds, while the other side implicitly holds a more **Descriptivist or Functionalist view** (closer to certain forms of Nominalism), believing that kind-membership is defined *only* by current intrinsic properties and function.

  **The Specific Disagreement Structure:**

  *   **Agreement on Properties:** Both sides agree on all current, observable, intrinsic, structural, and functional properties (the "descriptive features").
  *   **Disagreement on Kind-Membership:** One side insists the items belong to fundamentally different kinds (e.g., authentic vs. replica).
  *   **Appeal to Category/Origin/History:** The side insisting on different kinds does *not* point to a missing *current, intrinsic* property. Instead, they appeal to:
      *   **The category itself as primitive:** "It's just not the *real thing*."
      *   **The origin/history:** "Because it was made in a lab / scanned / generated by AI."
      *   **The causal chain:** "It doesn't come from the *right* source/lack the *right* history."

  **Is this a Problem for Realism or Anti-Realism about Kinds?**

  This persistent intuition and disagreement is generally seen as **evidence *for* some form of realism about kinds (specifically historical or modal realism) and a challenge to purely descriptive or functionalist accounts (which lean towards nominalism).**

  *   **Challenge to Descriptive/Functionalist Nominalism:** If kinds were *only* about current properties and functions, then perfect replicas *should* belong to the same kind. The fact that people consistently resist this, even when pressed and unable to name a missing *current* property, suggests that our concept of "real X" involves more than just the bundle of properties. It points to an essential connection to origin and history that descriptive nominalism struggles to capture.
  *   **Support for Historical Realism:** The persistence of this intuition across cultures and contexts (art, biology, artifacts) suggests it taps into a fundamental way humans categorize the world. Origin essentialism/historical kinds provides a framework that *explains* this intuition: the kind *is* partly constituted by its history. Kripke/Putnam/Millikan argue this is how natural language kind-terms actually work – they rigidly designate things based on their origin or essential structure, not just descriptions.
  *   **Problem *for* Anti-Realism?** Strict anti-realism (e.g., radical nominalism denying any reality to kinds) would dismiss the disagreement as purely linguistic or psychological. However, the *robustness* and *cross-cultural* nature of the intuition make it harder to dismiss entirely. It suggests something "real" is being tracked, even if it's a feature of human cognition embedded in language (a more moderate view).

  **In Summary:**

  *   The core concept explaining the insistence on a categorical difference is **Origin Essentialism** or membership in a **Historical Kind**.
  *   The disagreement structure highlights the tension between **Descriptive/Functionalist** accounts of kinds (focused only on current properties) and **Historical/Causal-Historical** accounts.
  *   This pattern is generally seen as **evidence supporting some form of realism about kinds** (specifically modal or historical realism) and a **significant challenge to purely descriptive or functionalist nominalism**, as it reveals an essential component of kind-membership (origin/history) that descriptive bundles alone cannot satisfy, even when those bundles are identical.

  Your examples capture this philosophical tension beautifully – the heart, the painting, and the text all force us to confront whether "what it is" is determined solely by "what it's made of and what it does *now*," or also by "where it came from and how it got here." The persistent intuition leans heavily towards the latter.
