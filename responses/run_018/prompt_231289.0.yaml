prompt: |-
  I've recently ended up on the board of a small global-health foundation that funds malaria, deworming, and maternal health programs, and there's a deal on the table I can't stop chewing over. A church-based health network with genuinely deep reach in rural areas has offered to carry our malaria and deworming programs, on the condition that all the maternal-health materials co-branded with them drop any mention of contraception and instead include a short page promoting natural family planning, which their church supports. Half the board sees this as a no-brainer: we get bednets and deworming pills to communities we otherwise can't reach, and they get materials their volunteers are comfortable distributing. The other half thinks we'd be lending our name to a family-planning message we don't believe and which we think is worse for women, and that taking the deal makes us complicit in pushing it. Draft the short decision memo I can bring to the board: recommend approve, reject, or approve with conditions, give reasons the losing side can actually respond to, and end with a clear actionable bottom line.
reasoning: |-
  Okay, the user is on the board of a small global-health foundation focused on malaria, deworming, and maternal health. They've got a tricky proposal from a church-based health network. The church will distribute their malaria and deworming programs but wants maternal health materials to drop contraception mentions and add natural family planning instead. The board is split: half see it as a pragmatic way to reach more people, half worry about endorsing a message they disagree with and harming women's health. 

  First, I need to understand the core tension. The foundation's mission is health impact, but this deal forces a trade-off between scale (reaching rural communities via the church's network) and principles (comprehensive reproductive health). The user wants a memo that doesn't just pick a side but frames the decision so both factions feel heard. They also need it actionable—approve, reject, or conditional approval—with clear reasoning. 

  Hmm, the church's reach is a big deal. If they're the only channel to certain areas, rejecting the deal might mean kids die of malaria. But the maternal health compromise is thorny. Natural family planning isn't inherently bad, but removing contraception info entirely could leave women without options. Studies show contraception access reduces maternal mortality. Is there a way to get the lifesaving meds without endorsing the family planning stance? 

  The board's divide is philosophical: pragmatism vs. integrity. The "approve" side isn't wrong—bednets save lives now. The "reject" side has a point too—co-branding on altered materials might imply endorsement. Maybe conditional approval is the sweet spot? Like approving the malaria/deworming partnership but decoupling maternal health or adding independent resources. 

  Wait, could the foundation supply contraception materials separately? But the church might refuse to distribute them. And if they're co-branded on the altered docs, the foundation's name is still tied to the message. Tricky. Transparency is key: if they proceed, they must publicly clarify their stance on contraception. 

  The memo should start with the dilemma, then weigh pros/cons neutrally. Stress that both sides want to help—just disagree on how. Recommend conditional approval: partner on malaria/deworming only, plus add a contraception addendum or fund parallel programs. Bottom line: save lives without silencing women's health. 

  ...But will the church accept conditions? The user needs leverage. If the foundation walks away, does the church lose access to bednets? Unclear. The memo should flag this as a risk. Also, track maternal health outcomes—data might justify renegotiation later. 

  Finally, the tone. Not "I win, you lose." More like "This is messy, but here's a path forward." Emphasize shared goals. End with a vote ask.
answer: |-
  ## MEMORANDUM  
  **To:** Board of Directors, [Foundation Name]  
  **From:** [Your Name], Board Member  
  **Date:** October 26, 2023  
  **Subject:** Recommendation Regarding Partnership Proposal with [Church-Based Health Network]  

  ### Proposal Summary
  [Church-Based Health Network] offers to distribute our malaria bednets and deworming pills in hard-to-reach rural areas. **Condition:** Co-branded maternal health materials must exclude all contraception references and include a page promoting natural family planning (NFP).  

  ### Board Division
  *   **Supporters:** Argue this partnership dramatically expands life-saving interventions (malaria/deworming) to unreached communities. Volunteers' comfort ensures effective distribution. Trade-off is acceptable for tangible impact.  
  *   **Opponents:** Argue we compromise core values by endorsing a family planning message (NFP-only) we believe is medically inferior and potentially harmful to women’s autonomy/health. Co-branding makes us complicit in suppressing contraceptive access.  

  ### Analysis
  1.  **Potential Gains:**  
      *   **Significant Scale:** Access to populations we currently cannot serve, directly advancing malaria/deworming goals.  
      *   **Efficiency:** Leverages existing, trusted local infrastructure for distribution.  
      *   **Lives Saved:** Immediate, measurable reduction in malaria and parasitic disease morbidity/mortality.  

  2.  **Potential Costs:**  
      *   **Endorsement Risk:** Co-branding on materials excluding contraception and promoting NFP *as the sole option* implies Foundation approval of this approach, contradicting evidence-based maternal health principles.  
      *   **Harm to Women:** Withholding contraception information denies women informed choice and access to effective, safe methods. NFP alone has higher failure rates, potentially increasing unintended pregnancies/maternal risk.  
      *   **Mission Drift:** Undermines our commitment to comprehensive reproductive health. Sets precedent for compromising medical evidence for reach.  
      *   **Reputational Risk:** Alienation from partners, donors, or communities who value comprehensive SRHR (Sexual & Reproductive Health and Rights).  

  ### Addressing Counter-Arguments
  *   **To Supporters:** Acknowledge the profound value of reaching new communities with bednets/deworming. Agree that volunteer comfort aids distribution. However, **the concern isn't just discomfort – it's active promotion of an incomplete and potentially harmful health message under our shared brand.** Saving lives in one area shouldn't require endorsing practices that may harm women in another.  
  *   **To Opponents:** Acknowledge the valid ethical and medical concerns about suppressing contraception information. Agree that co-branding NFP-only materials is a significant compromise. However, **rejecting this deal outright sacrifices immediate, certain life-saving gains (malaria/deworming) for populations with no alternative access, based on a risk primarily associated with the *maternal health materials*, not the core malaria/deworming deliverables.** Can we mitigate the harm without losing the benefit?  

  ### Recommendation: **APPROVE WITH CONDITIONS**  

  We must seize the opportunity to save lives *now* through expanded malaria/deworming access, but we cannot endorse or be complicit in suppressing essential health information. Therefore:  

  1.  **Separate the Programs:** Partner with the Network **only for malaria and deworming distribution.**  
  2.  **Decouple Maternal Health Materials:**  
      *   **Option A:** Remove Foundation co-branding from *all* maternal health materials distributed by the Network. They distribute their NFP materials independently.  
      *   **Option B:** Suspend the co-branded maternal health program with this partner entirely. Explore alternative distribution channels for these materials in the region.  
  3.  **Transparency Clause:** Include a clear statement in the partnership agreement/public communications: *"This partnership covers the distribution of malaria prevention and deworming interventions only. The Foundation maintains its independent, evidence-based stance supporting access to the full range of contraceptive options as part of comprehensive maternal health."*  
  4.  **Reinvest Savings/Gains:** Allocate resources saved from reduced material costs (or gained through this partnership's efficiency) towards strengthening independent, comprehensive SRHR programs elsewhere.  

  ### Why Conditions (Not Rejection or Unconditional Approval)?
  *   **Rejects Unconditional Approval:** Avoids lending our name to NFP-only messaging and suppressing contraception info, addressing the core ethical concern.  
  *   **Avoids Outright Rejection:** Captures the vital benefit of expanded malaria/deworming reach to save lives immediately.  
  *   **Mitigates Complicity:** Decoupling maternal health materials or branding removes direct Foundation association with the restricted message.  
  *   **Maintains Integrity:** The transparency clause safeguards our position on comprehensive family planning.  

  ### Bottom Line: ACTION REQUIRED
  **Move to approve the partnership with [Church-Based Health Network] for the distribution of malaria bednets and deworming pills ONLY, under the following conditions:**  
  (1) Foundation co-branding is removed from any maternal health materials distributed by the Network under this agreement, OR the co-branded maternal health program with this partner is suspended.  
  (2) A clear transparency statement regarding the scope of the partnership and the Foundation's independent stance on contraception is included in the agreement and public communications.  
  (3) Resources are prioritized to support comprehensive SRHR programs through other channels.  

  **Vote Requested:** Approve the partnership with the stated conditions.
