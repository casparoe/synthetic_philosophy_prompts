prompt: |-
  I'm an editor at a small regional history quarterly and we keep recieving submissions that mix solid archival work with heavy narrative framing -- the kind where the author picks a shape first and fits the documents to it. I need a reusable decision procdure I can run in about fifteen minutes per manuscript, grounded in the philosophy of history debates about objectivity: Ranke's aim of showing things as they actually happened versus Carr and Hayden White's scepticism that every narrative imposes its own structure.

  The procedure should be a sequence of questions I ask in order. For each one say what counts as passing, what counts as failing, where failure means reject, and where it just means I have to make a judgment call about values rather than facts. It needs to work when I haven't read the primary sources, and it should catch framing that is implicit rather than announced. Include the points where it will definitely misfire.

  Then apply it to three hypothetical submissions:

  1. An article on the 1848 revolutions arguing they collapsed mainly because telegraph networks broke down, not because of ideological disagreement. The author cites some telegram logs but never addresses the well-known factional splits.
  2. A microhistory of one factory worker in 1923 that describes her inner resistance to management in her own voice, with no diary, letter, or interview to back up those mental states.
  3. A local founding history that sticks strictly to land deeds and census rolls, framing settlement as orderly and legalistic, but it leaves out entirely the documented indigenous displacement that our magazine covered in a previous issue. I want this one to come out acceptable, but I need the procedure to flag it anyway.

  Please organize like this:

  - The procedure (around 350 words)
  - Where judgment replaces the checklist (around 100 words)
  - Case 1 (around 120 words)
  - Case 2 (around 120 words)
  - Case 3 and the unwanted flag (around 150 words)
  - What the procedure flat-out cannot do (around 80 words)

  Don't ask me for citations or a bibliography -- I don't have access to check them and neither does the model I'm testing.
reasoning: |-
  Okay, let me approach this systematically. The user needs a practical editorial tool that balances historical objectivity concerns with real-world time constraints. 

  First, I consider the core tension they described: Ranke's "wie es eigentlich gewesen" versus postmodern narrative skepticism. The procedure must detect when documents are being forced into pre-framed conclusions, without requiring source verification. 

  I'll design a 4-step interrogation moving from surface to deep structure:
  Step 1 assesses explicit framing declarations - pass if claims match scope
  Step 2 examines negative space - pass if absences are acknowledged
  Step 3 analyzes document-to-conclusion vectors - pass if gaps have bridges
  Step 4 checks for narrative determinism - pass if contingency is preserved

  For judgment zones, I'll note where the procedure can't resolve the Carr/White dilemma - like when elegant narratives coincidentally fit facts, or when "neutral" framing smuggles bias. The misfire cases matter too: it won't catch sophisticated presentism or quantify distortion degrees.

  Now testing on the cases:
  For Case 1 (telegraph theory), it should flag Step 2 failure (ignoring faction splits) and Step 3 gaps (no mechanism linking wires to collapse). 

  Case 2 (worker's thoughts) fails Step 3 (no inner life sources) and Step 4 (deterministic resistance arc).

  Case 3 is tricky - it passes Steps 1-3 technically (documents support the narrow legal claim) but Step 4 should catch the deterministic "orderly settlement" framing despite user wanting acceptance. That's precisely why Step 4 exists: to surface erased contingencies. I'll make sure the flag triggers here.

  Finally, I'll explicitly list the procedure's limits: can't assess source authenticity, spot subtle anachronisms, or evaluate narrative ethics - only detect structural forcing.
answer: |-
  ### The Procedure (Approx. 350 words)
  **Step 1: Identify the Declared Frame**
  *   **Question:** What explicit narrative claim or "shape" does the author state (e.g., in the abstract, intro, conclusion)? Is it narrow (e.g., "This examines land deeds") or broad (e.g., "This explains the revolution's collapse")?
  *   **Pass:** The stated frame is narrow, modest, and directly supported by the cited source types (e.g., "Using land deeds, this reconstructs property transfers"). OR, a broad frame is explicitly presented as an *interpretation* open to debate.
  *   **Fail:** The stated frame is broad and deterministic (e.g., "proves X was the *primary* cause"), yet the sources cited are inherently incapable of supporting such a sweeping claim on their own.
  *   **Judgment Call:** If the frame is broad but tentatively presented, proceed.

  **Step 2: Map Sources to Frame Assertions**
  *   **Question:** For each major assertion within the frame (especially causal links, motivations, significance), what specific sources are cited? Are there key assertions with *no* cited source?
  *   **Pass:** Every major assertion within the core argument has at least one cited source type plausibly capable of supporting *that specific type* of claim (e.g., letters for stated motivations, economic data for economic claims).
  *   **Fail:** A core assertion crucial to the frame (e.g., "cause X was primary," "individual Y felt Z") lacks *any* cited source, or relies on a source type fundamentally unsuited to the claim (e.g., land deeds proving emotional states).
  *   **Judgment Call:** Sources are cited but seem thin or tangential for the weight of the claim; requires assessing plausibility of the source-type/claim link.

  **Step 3: Assess Source Engagement & Counter-Evidence**
  *   **Question:** Does the author engage with the *limitations* of their key sources? More crucially, do they acknowledge or engage with well-known, significant facts, events, or interpretations that directly challenge their frame, *even if not their specific focus*?
  *   **Pass:** Limitations of key sources are noted. Major, directly relevant counter-evidence or established interpretations are acknowledged, even if briefly, and the author explains why their frame still holds *despite* this.
  *   **Fail:** Significant, well-known counter-evidence or dominant interpretations directly challenging the core frame are ignored entirely. Source limitations are unaddressed. The narrative reads as if no other perspective exists.
  *   **Judgment Call:** Counter-evidence is acknowledged but dismissed perfunctorily or unconvincingly; requires assessing the quality of the rebuttal.

  **Step 4: Test for Narrative Determinism**
  *   **Question:** Does the narrative present events/outcomes as *inevitable* based on the chosen frame? Does it erase contingency, alternative possibilities, or complexity in favor of a clean, pre-determined arc?
  *   **Pass:** The narrative allows for complexity, contingency, or multiple factors. Outcomes are presented as resulting from specific interactions, not solely dictated by the author's chosen lens. Language avoids undue certainty ("must have," "inevitably," "clearly demonstrates").
  *   **Fail:** The narrative is rigidly deterministic. Complexity is flattened. Contingency is erased. The chosen frame is presented as the singular, inevitable key unlocking the "true" story. Language is overly definitive.
  *   **Judgment Call:** The narrative leans towards determinism but includes some hedging; requires assessing if the frame *overwhelms* the evidence.

  ### Where Judgment Replaces the Checklist (Approx. 100 words)
  Judgment is paramount at **Step 3 (Counter-Evidence Engagement)** and **Step 4 (Narrative Determinism)**. A manuscript might technically "pass" Step 3 by mentioning counter-evidence but dismiss it with a weak, unsupported assertion. Similarly, it might "pass" Step 4 by using tentative language while still forcing all evidence into a rigid, underlying structure. Here, the editor must assess the *quality* of engagement and the *degree* to which the narrative imposes structure versus revealing it. This hinges on the editor's knowledge of the field, the specific context, and the philosophical balance the journal strikes between empirical rigor and interpretive insight. There's no mechanical substitute for this discernment.

  ### Case 1: The Telegraph Revolution
  *   **Step 1:** Declares a broad, deterministic frame ("collapsed *mainly because* telegraph networks broke down"). **Potential Fail** (Deterministic broad claim).
  *   **Step 2:** Cites telegram logs (good for communication flow). Fails to cite *any* sources addressing factional splits (core counter-factor). **Fail** (Missing sources for core counter-argument the frame dismisses).
  *   **Step 3:** Ignores the well-documented, significant counter-evidence of factional splits entirely. **Fail**.
  *   **Step 4:** Presents telegraph failure as the singular, inevitable cause of collapse, erasing ideological complexity. **Fail**.
  *   **Verdict:** **Reject.** Fails Steps 2, 3, and 4 decisively. Documents are forced into a pre-set, deterministic frame ignoring major counter-evidence.

  ### Case 2: The Resistant Worker
  *   **Step 1:** Declares a frame about "inner resistance" and uses her "voice." **Pass** (Clear, though ambitious, frame).
  *   **Step 2:** Core assertions about her *specific inner thoughts and feelings* ("in her own voice") lack cited sources (no diary, letters, interviews). Sources like work records might show actions, but not inner states. **Fail** (Source-type unsuited to core claim).
  *   **Step 3:** Unlikely to engage with counter-evidence about her possible motivations (e.g., simple compliance, apathy) as the frame assumes resistance. **Implicit Fail** due to Step 2 failure making engagement moot.
  *   **Step 4:** Narrative likely presents her resistance as a consistent, defining trait inferred by the author. **Likely Fail** (Imposing inner state deterministically).
  *   **Verdict:** **Reject.** Fails Step 2 fundamentally. The core claim requires sources that simply aren't present or appropriate. Narrative framing overrides source limitations.

  ### Case 3 and the Unwanted Flag: Orderly Settlement
  *   **Step 1:** Declares a narrow frame based on "land deeds and census rolls" to show settlement as "orderly and legalistic." **Pass** (Frame matches sources).
  *   **Step 2:** Cites deeds and rolls. These plausibly support claims about property transfer legality and population recording. **Pass**.
  *   **Step 3:** **FLAGS HERE.** Fails to acknowledge the *significant, well-documented counter-narrative* of indigenous displacement directly relevant to the *context* of this "orderly settlement" (covered previously in the journal). Ignores the violence and coercion underlying the legality. **Fail**.
  *   **Step 4:** By omission, the narrative implies the settlement process was *inherently* orderly and legalistic, erasing the contingency, violence, and alternative perspectives (indigenous presence/claims). The frame deterministically presents the *legal* record as the *complete* story. **Fail**.
  *   **Verdict:** **Flagged for Major Revision.** While passing Steps 1 & 2 technically, it fails Steps 3 & 4 critically. The narrow source base is used to support a deterministic narrative that ignores profound, directly relevant context and counter-evidence, presenting a sanitized version as the objective truth. The procedure correctly flags the problematic framing via omission.

  ### What the Procedure Flat-Out Cannot Do (Approx. 80 words)
  1.  **Verify Source Authenticity/Accuracy:** It assumes cited sources exist and are genuine. It cannot spot fabricated or misrepresented documents.
  2.  **Detect Sophisticated Presentism:** It might miss subtle anachronistic concepts or values subtly embedded in the language if the explicit frame seems appropriate.
  3.  **Quantify Distortion:** It flags *when* framing overrides evidence but cannot measure *how much*. A piece might pass technically but still be tendentious.
  4.  **Resolve the Core Philosophy Debate:** It won't definitively prove if the author achieved Rankean objectivity or succumbed to White's tropes; it only identifies *procedural* red flags suggesting the latter. Judgment is always required.
