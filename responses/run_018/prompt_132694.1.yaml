answer: |-
  ### The core problem:  
  Picking a reference class for probability estimates is inherently arbitrary. If you can justify multiple conflicting classes (e.g., "all inventions" vs. "software projects" for AI timelines), your probability becomes subjective. No objective "correct" class exists—it’s all vibes-based framing.

  ### AI timelines:  
  If an AI researcher claims their forecast is better because "experts are more accurate," but *which* experts? AI safety folks? Robotics PhDs? ML engineers at Big Tech? Each group has wildly different track records. You can cherry-pick a reference class to make anyone look prescient or clueless. So no, being an "AI researcher" doesn’t automatically beat a random human’s guess—it depends entirely on how you slice the expertise pie. Focus on *why* their model might be robust, not titles.

  ### Doomsday / self-selection:  
  The Doomsday Argument assumes you’re a "random observer" in human history. But if you’re the kind of person who *thinks about Doomsday*, you’re self-selected from early, pre-doomsday cohorts (late observers might not exist to ponder it). And what’s the reference class? "All humans"? "All conscious beings"? "All LW readers"? Each breaks the "randomness" assumption. Self-selection guts the argument—your existence as a worrier likely implies you’re early, making doomsday *less* probable, not more. The whole thing collapses without objective classes.

  ### EA base-rate problem:  
  EA loves citing base rates like "85% of development projects fail" to justify interventions. But *which* projects? Those in Uganda? Climate tech? RCT-backed ones? If you can’t non-arbitrarily define the reference class ("global" is meaningless), the base rate is just storytelling. An EA might unconsciously pick classes that make their pet project look high-impact (e.g., comparing mosquito nets to "all health projects" not "malaria-specific tools"). Unacknowledged class arbitrariness = silent bias in prioritization.

  ### Your bottom line:  
  This isn’t just pedantry—it nukes any probabilistic argument that leans on historical data without extreme humility. You can’t "objectively" ground forecasts, doomsday math, or impact estimates in base rates. Embrace uncertainty, stress-test across multiple classes, and drop the illusion of rigor. Everything’s fuzzy.
