prompt: |-
  I'm trying to work out whether honoring sunk costs is ever rational, by testing my gut reactions against a range of concrete cases. Here is what I think, case by case.

  A hiker three hours into a mountain trail realizes she has no water left. Pushing to the summit takes another two hours and risks dehydration; turning back means the distance already covered yields no payoff. I think she should turn back — treating the miles already walked as a reason to continue is irrational.

  A composer spends a decade on an opera she now despises. She finishes and premieres it because she has come too far to abandon the project. That strikes me as the same error: irrational.

  A couple has been together fifteen years, mostly unhappy, but they stay because of everything they have already endured together. Here honoring the sunk emotional cost does not feel irrational; if anything, walking away from the shared history feels like a failure of loyalty.

  A city council approves another five hundred million dollars for a structurally flawed bridge because three billion is already spent. Clearly irrational.

  A reader is three hundred pages into a five-hundred-page novel she dislikes. She finishes it so she does not waste the time already invested. Irrational, though I feel less judgmental about it than about the bridge.

  A research lab continues a failed experiment for a third funding cycle not because anyone expects success, but because the grant is already awarded and staff salaries depend on maintaining it. This feels different — not purely rational, but not the same kind of error as the hiker's.

  A soldier holds a position he knows is lost, not for strategic gain, but because leaving would betray the comrades who already died there. Honoring their sunk sacrifice feels morally required rather than irrational.

  An investor refuses to sell a plummeting stock because he needs to recover what he lost. Irrational.

  The pattern I think I see involves whether the sunk cost has become part of a standing commitment to others, rather than remaining a purely instrumental investment for future gain. But I cannot state the boundary precisely, and several pairs trouble me: the couple's shared misery and the soldier's fallen comrades both invoke loyalty, yet the hiker's wasted miles invoke none; the lab's grant and the bridge's budget are both institutional, yet I treat them differently.

  Can you state the principle — or the smallest family of principles — that best captures all eight verdicts? For each clause, say which case motivates it. Then predict my verdict on a case I have not listed: a patient who has endured two years of painful chemotherapy that has not worked considers a third year solely because of the suffering already endured. Finally, be explicit about which of my eight judgments the principle cannot accommodate and therefore forces me to drop or revise.
reasoning: |-
  Okay, let me approach this systematically. The user presents eight scenarios where sunk costs influence decisions, with their intuitive judgments on each, and asks for unifying principles that explain all eight verdicts. 

  First I notice the user's judgments split along two axes: when sunk costs create moral obligations to others (couple, soldier) it feels rational to honor them, but when sunk costs are purely personal or instrumental (hiker, investor) it's irrational. The bridge and composer cases clearly fall in the irrational category. 

  The lab case is tricky - it feels different because continuing salaries creates future obligation to staff, not just past investment. This suggests the principle needs a "forward-looking duty" component. The novel case is personally irrational but understandable, confirming the absence of duty to others makes it irrational. 

  For the unlisted chemo case: since no others are involved and it's solely about past suffering, the principle would predict it's irrational - matching user's implied stance. 

  The bridge and lab comparison reveals nuance: bridge has no moral duty aspect, while lab has staff welfare. This distinction holds under the principle. All original judgments are preserved except possibly requiring slight refinement of the "duty" criterion to explicitly include future consequences like staff livelihoods. 

  The patient case cleanly extends the framework: no duty to others + no future benefit beyond sunk cost recovery = irrational. User's core insight about relational commitments explaining the split seems correct, just needed formalization.
answer: |-
  Your intuitions reveal a nuanced ethical principle that distinguishes between **instrumental sunk costs** (irrational to honor) and **relational sunk costs that generate ongoing duties** (potentially rational to honor). Here's the smallest family of principles capturing all eight verdicts:

  ### Core Principle
  **Honoring sunk costs is rational *only* when abandoning the investment would violate a *forward-looking moral duty* to others that was created or sustained by the sunk cost itself.**  
  - *Motivated by:* The couple (duty to shared life/history), soldier (duty to fallen comrades), and lab (duty to employed staff).

  ### Corollary 1: Instrumental Sunk Costs
  **If the sunk cost is purely personal/instrumental (no relational duties created), honoring it is irrational.**  
  - *Motivated by:* Hiker (personal effort), composer (personal effort), investor (financial loss), bridge (financial/political investment), novel reader (personal time).

  ### Corollary 2: Distinguishing Institutional Cases
  **Institutional sunk costs are irrational *unless* they directly sustain human welfare obligations (e.g., livelihoods).**  
  - *Motivated by:* Lab (staff salaries) vs. Bridge (no welfare duty).

  ---

  ### Verdict on New Case: Chemotherapy Patient
  - **Prediction:** You would judge continuing chemotherapy as **irrational**.  
    **Why?** The suffering endured creates no *duty to others*; continuing solely honors a personal sunk cost (Corollary 1 applies). This mirrors the composer or hiker—endurance without relational obligation.

  ---

  ### Cases Requiring Revision
  The principle forces you to revise two judgments for consistency:
  1. **The Couple's "Loyalty":**  
     - Your verdict: Honoring sunk cost felt rational.  
     - **Problem:** Shared history alone creates no *forward-looking duty* if the relationship is net harmful. Duty requires mutual care—absent here ("mostly unhappy").  
     - **Revision:** Staying is *irrational* unless they have dependents or concrete commitments (e.g., co-parenting). Otherwise, it mirrors the composer’s self-imposed obligation.

  2. **The Soldier's Sacrifice:**  
     - Your verdict: Honoring fallen comrades feels morally required.  
     - **Problem:** Holding a *lost* position with no strategic gain violates the duty to *living* soldiers (needless risk).  
     - **Revision:** Honoring is rational *only* if it serves a purpose (e.g., buying time for allies to retreat). Otherwise, it wastes lives—betraying the fallen’s intent.

  ---

  ### Why All Other Cases Fit Perfectly
  | **Case**               | **Fits Principle**                                                                 | 
  |-------------------------|------------------------------------------------------------------------------------|
  | Hiker                   | Personal effort; no duty created → Irrational.                                   |
  | Composer                | Personal effort; no duty → Irrational.                                           |
  | Bridge                  | Financial sunk cost; no welfare duty → Irrational.                               |
  | Novel Reader            | Personal time; no duty → Irrational (but low stakes).                            |
  | Lab Grant               | Sustains staff livelihoods (welfare duty) → Rational despite project failure.    |
  | Investor                | Personal loss; no duty → Irrational.                                             |

  ---

  ### Key Insight
  Your instinct identified relational duties as the boundary—but **duties must be *actionable* and *net-beneficial***. The couple’s duty fails if misery persists; the soldier’s fails if lives are wasted. Sunk costs can *anchor* duties (e.g., "We built this life together, so we owe repair efforts"), but not justify harm. This refines your "loyalty" exception into a test of **duty-to-others + reasonable future benefit**.
