answer: |-
  Below is a reusable decision procedure designed for your reliability engineering context. It follows a strict sequential flow, requires no specialized philosophical knowledge, and can be executed in ~40 minutes per case. The procedure includes:
  - **Clear stopping points**: "No recall" (artifact, masked, or finked) vs. "Recall" (genuine disposition).
  - **Value judgment flags**: Explicitly marks steps requiring risk tolerance assessments.
  - **Limitations**: Highlights where nested masks/reverse finks break the flow and what the procedure cannot handle.

  ---

  ### **Decision Procedure: Brittle Failure Analysis**
  **Instructions**: Answer each question in order. Proceed only if the answer is ambiguous. Stop immediately when a classification is reached. Document evidence for each step.

  #### **Step 1: Was the failure caused by unintended test-specific conditions?**
  - **Question**: Did an external factor unrelated to flight conditions cause the failure? (Examples: Handling damage, non-standard test equipment, procedural error like abrasive cleaning.)
  - **Sufficient answer**: 
    - **Yes** (with evidence): Proceed to Step 1a.
    - **No**: Proceed to Step 2.
  - **Evidence required**: Test logs, environmental data, witness reports.

  #### **Step 1a: Can this test condition occur in real-world flight?**
  - **Question**: Is the unintended condition plausible in flight? (Examples: Thermal coating stripped mid-flight, maintenance error replicable in service.)
  - **Sufficient answer**:
    - **No** (confirmed): → **Stop: Artifact (test-induced) — NO RECALL**. Liability applies if future flight failure occurs.
    - **Yes** (or uncertain): Proceed to Step 2.
  - **Value judgment flag?** No. Fact-based (e.g., coating adhesion specs).

  #### **Step 2: Is the failure mechanism inherent to the base material?**
  - **Question**: Would the failure occur in the base material *without* coatings, lattices, or other modifications? (Ignore flight masks for now.)
  - **Sufficient answer**:
    - **No**: Proceed to Step 2a.
    - **Yes**: Proceed to Step 3.
  - **Evidence required**: Material micrographs, stress simulations, historical data on unmodified samples.

  #### **Step 2a: Is the interfering mechanism part of the flight design?**
  - **Question**: Was the failure caused by a design feature (e.g., coating, lattice) that functions differently in test vs. flight?
  - **Sufficient answer**:
    - **No** (e.g., test equipment flaw): → **Stop: Artifact (external) — NO RECALL**.  
    - **Yes** (e.g., lattice only active at certain temps): Proceed to Step 3.
  - **Value judgment flag?** No. Fact-based (design docs, CFD analysis).

  #### **Step 3: Is the brittle disposition masked in flight?**
  - **Question**: Does a flight-specific mechanism *prevent* the failure under all FAA-certified conditions? (Examples: Coating prevents shattering, lattice absorbs stress at operational temps.)
  - **Sufficient answer**:
    - **No** (no mask exists): → **Stop: Genuine disposition — RECALL**.  
    - **Yes** (mask exists): Proceed to Step 4.
  - **Evidence required**: Flight envelope data, thermal profiles, certification reports.

  #### **Step 4: Is the masking mechanism 100% reliable?**
  - **Question**: Could the mask fail, degrade, or be inactive in any flight condition? (Examples: Coating erosion, lattice inefficiency outside temp range.)
  - **Sufficient answer**:
    - **Yes** (reliability <100%): Proceed to Step 5.
    - **No** (provably flawless): → **Stop: Masked in flight — NO RECALL**.  
  - **Evidence required**: Accelerated aging tests, field data, FMEA reports.
  - **Limitation**: Fails with **nested masks** (e.g., a lattice that masks brittleness but *itself* depends on a coating). Requires expert analysis beyond this flow.

  #### **Step 5: Risk Tolerance Judgment**  
  - **Question**: What is the probability of mask failure × consequence severity? (Use company risk matrix; e.g., "catastrophic" if failure causes engine loss.)
  - **Sufficient answer**:
    - **Acceptable risk** (per AS9100/company policy): → **Stop: Masked — NO RECALL**.  
    - **Unacceptable risk**: → **Stop: Genuine disposition — RECALL**.  
  - **Value judgment flag? YES**. Requires business/legal input. Document rationale.
  - **Limitation**: Fails with **reverse finks** (e.g., a lattice that *usually* masks brittleness but randomly deactivates). Quantifying this needs stochastic modeling.

  ---

  ### **Procedure Limitations**
  1. **Nested masks/reverse finks**: Cannot resolve interdependent mechanisms (e.g., a thermal coating that masks brittleness but *itself* requires a sub-coating). Requires expert review.
  2. **Unquantifiable risks**: If reliability data for masks is absent (e.g., no field data), Step 5 defaults to recall.
  3. **Multi-failure interactions**: Only assesses one failure mode at a time. Concurrent failures (e.g., brittleness + corrosion) need separate runs.
  4. **Philosophical edge cases**: "Finks" (disposition removal) are treated as masking. True finks (e.g., self-healing mechanisms) may misclassify without additional data.

  ---

  ### **Application to Cases**
  **Case 1: Turbine blade shattered after thermal coating was stripped during cleaning.**  
  - **Step 1**: Yes (cleaning error).  
  - **Step 1a**: Condition cannot occur in flight (coating bonded for flight; stripping only during improper maintenance). → **Artifact (test-induced) — NO RECALL**.  
  - **Rationale**: Failure due to test artifact; flight configuration intact. Liability accepted if future failure occurs from coating loss.

  **Case 2: Composite panel seemed ductile but failed due to micro-lattices inactive above 200°C.**  
  - **Step 1**: No (test conditions were standard).  
  - **Step 2**: Yes (base material is brittle without lattice).  
  - **Step 3**: Mask exists (lattice active below 200°C).  
  - **Step 4**: Reliability <100% (lattice inactive above 200°C; flight temps can reach 250°C).  
  - **Step 5**: Unacceptable risk (probability of high-temp flight >0.1%; consequence catastrophic). → **Genuine disposition — RECALL**.  
  - **Value judgment**: Explicit. Recall mandated despite partial masking due to severity.

  **Case 3: Genuine brittle disposition masked in 99% of flight conditions.**  
  - **Steps 1–2**: Confirmed genuine disposition.  
  - **Step 3**: Mask exists (e.g., lattice active in most conditions).  
  - **Step 4**: Reliability <100% (mask fails in 1% of conditions).  
  - **Step 5**: **Value judgment required**.  
    - If risk tolerance allows (e.g., failure probability <1e⁻⁹/hour, low severity): **NO RECALL**.  
    - Else (e.g., high severity): **RECALL** (as procedure defaults to conservatism).  
  - **Honesty**: Recall may feel wasteful, but Step 5 forces explicit risk acceptance. If legal policy prohibits tolerating any unmasked brittleness, recall is automatic.

  ---

  ### **Implementation Notes**
  - **Form Design**: Use a checklist with dropdowns (Yes/No/Uncertain) and evidence fields. Automate risk calculations in Step 5.
  - **Training**: Engineers need basic knowledge of stress analysis and company risk thresholds (no philosophy required).
  - **Time Efficiency**: Steps 1–4 take ~30 minutes; Step 5 takes ~10 minutes with predefined risk matrices.
  - **Audit Trail**: Mandatory documentation at each step to justify recalls/no-recalls to lawyers.
