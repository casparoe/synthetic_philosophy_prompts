  First, I recall that in philosophy, conceivability arguments often rely on imagining scenarios to argue about metaphysical possibilities. The user points out two types: one constructive (like Twin Earth's XYZ) and one subtractive (like zombies). I need to check if there's an existing term for this. From what I know, terms like positive and negative conceivability exist, but they might not perfectly map here. Positive conceivability involves constructing a detailed scenario, while negative is about the absence of contradiction. The user's examples fit: Twin Earth is constructive (positive), zombies are subtractive (negative, but specifically about removal without replacement).

