  2. **Parfit's Hitchhiker**:
     You are stranded in a desert. A driver comes by and says they will take you to safety only if you promise to pay them $1000 once you are safe. They will not help if you do not make the promise. Once you are safe, you can choose to pay or not; there are no consequences for not paying. What do you do?
     Options:
