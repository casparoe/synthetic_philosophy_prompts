answer: |-
  ### Decision Theory Quiz  
  *Discover your decision-making style through concrete scenarios. Choose the answer that feels most natural to you.*  

  ---

  1. **Genetic Test Dilemma**  
     You’re offered a drug that prevents a rare disease if taken *before* symptoms appear. You’ve taken a genetic test for disease susceptibility, but results arrive tomorrow. The drug is free today but costs $1,000 tomorrow. You know:  
     - If you’re susceptible, the drug prevents the disease (saving you $10,000 in treatment).  
     - If you’re not susceptible, the drug does nothing.  
     *What do you do?*  
     A. Take the drug today.  
     B. Wait for the test results tomorrow.  
     *Note: A leans UDT (commit to prevention before evidence). B leans EDT/CDT (wait to condition on results).*  

  2. **Desert Driver**  
     Stranded in a desert, a driver offers a ride if you promise to pay $1,000 upon rescue. They only help if you promise. Once rescued, you can pay or refuse with no penalty.  
     *What do you do?*  
     A. Promise, then pay after rescue.  
     B. Promise, then refuse to pay after rescue.  
     C. Refuse to promise.  
     *Note: A leans UDT (commit to cooperation for rescue). B/C lean EDT/CDT (defect locally for gain/safety).*  

  3. **Coin Toss Debt**  
     A stranger says: "I flipped a fair coin. If heads, I’d demand $100. But it’s tails, so I ask for $50. If you pay, I’ll return $200 if we meet again and I flip heads. If you refuse, nothing happens."  
     *What do you do?*  
     A. Pay the $50.  
     B. Refuse to pay.  
     *Note: A leans UDT (policy of honoring deals for future gains). B leans EDT/CDT (ignore counterfactual reciprocity).*  

  4. **Predictor’s Transparent Boxes**  
     A predictor (99% accurate) filled two boxes yesterday based on their forecast of your choice. You see:  
     - Box A: $1,000,000.  
     - Box B: $1,000.  
     You know:  
     - If they predicted "take only A," Box B has $1,000.  
     - If they predicted "take both," Box B is empty.  
     *What do you do?*  
     A. Take only Box A.  
     B. Take both boxes.  
     *Note: A leans EDT (evidence of predictor’s accuracy). B leans CDT (causally dominate visible money). UDT also picks A (policy of 1-boxing).*  

  5. **Clone Prisoner’s Dilemma**  
     You and your identical twin (who reasons identically to you) commit crimes. You must independently choose:  
     - If both stay silent: both walk free.  
     - If one confesses (betraying the other): confessor gets $10,000, other jailed.  
     - If both confess: both jailed.  
     *What do you do?*  
     A. Stay silent.  
     B. Confess.  
     *Note: A leans UDT (cooperate via symmetry). B leans CDT (dominant-strategy defect).*  

  6. **Toxin Challenge**  
     A benefactor offers $1M today if you *intend* to drink a non-lethal toxin tomorrow (causing 1 day of sickness). You get the money only if you sincerely intend today. Tomorrow, you choose whether to drink.  
     *What do you do?*  
     A. Form the intention, take the $1M, and drink tomorrow.  
     B. Form the intention, take the $1M, then skip drinking.  
     C. Refuse the deal.  
     *Note: A leans UDT (commit to follow-through). B/C lean EDT/CDT (defect after gaining $1M).*  

  7. **Insurance Incentives**  
     You’re offered insurance against a 1% chance of a $100,000 loss. Premium: $500. If you buy it, you’ll relax precautions, doubling the loss risk to 2%. Without insurance, you stay cautious (1% risk).  
     *What do you do?*  
     A. Buy insurance and stay cautious.  
     B. Buy insurance and relax precautions.  
     C. Skip insurance and stay cautious.  
     *Note: A leans UDT (precommit to caution). B/C lean EDT/CDT (local evidence/dominance).*  

  8. **Chess Clone Match**  
     You and a clone (who mirrors your reasoning) play chess for $10,000. Studying costs $1,000. Outcomes:  
     - Both study: 50% win chance each.  
     - You study, clone doesn’t: 90% win chance for you.  
     - Neither studies: 50% win chance each.  
     *What do you do?*  
     A. Study.  
     B. Don’t study.  
     *Note: A leans CDT (causal dominance). B leans UDT (policy of mutual non-study for net gain).*  

  ---

  ### Scoring Key  
  Tally your answers. Each theory’s "lean" is indicated in the notes.  

  - **Mostly A in questions 1, 2, 3, 6, 7 + B in question 8 → UDT-aligned.**  
    You prioritize *precommitment*: choosing policies upfront, ignoring local evidence if it conflicts with global goals (e.g., paying debts to enable rescue in Q2, ignoring test results in Q1).  

  - **Mostly A in questions 4, 5, 7 + B in questions 1, 3, 6 → EDT-aligned.**  
    You prioritize *evidence*: actions signal desirable states (e.g., 1-boxing in Q4 signals predictor’s favor, cooperating in Q5 signals mutual silence).  

  - **Mostly B in questions 1–7 + A in question 8 → CDT-aligned.**  
    You prioritize *causal control*: actions must directly cause outcomes (e.g., taking visible money in Q4, defecting in Q5 for dominance).  

  ---

  ### Final Notes  
  - **Overlaps:**  
    - UDT and EDT agree in "predictor" scenarios (Q4, Q7) because evidence aligns with precommitment.  
    - CDT and UDT agree when precommitment is irrelevant (Q8: causal dominance overrides symmetry).  
  - **Rare Views:**  
    - Pure CDT is uncommon (it rejects win-win deals like Q2/A or Q3/A).  
    - Pure EDT is unstable (e.g., it loses in Q6/B by defecting).  
    - UDT is often unintuitive but avoids self-sabotage in precommitment traps.  
  - **Limitations:**  
    - This quiz doesn’t cleanly separate UDT from its subtype Functional Decision Theory (FDT). Both handle precommitment similarly (e.g., Q1–Q3).  
    - Real-world decisions involve ambiguity; this tests idealized intuitions.  

  **Result:** No theory is "correct"—each has tradeoffs. Discuss why your choices felt rational!
