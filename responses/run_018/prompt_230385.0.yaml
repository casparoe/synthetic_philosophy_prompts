     B. Make the promise and then, once safe, do not pay.
     C. Do not make the promise (and remain stranded).

     Note: A (pay) leans UDT: precommit to paying to get saved. B (don't pay) and C (refuse) lean toward CDT/EDT: B exploits the situation, C avoids lying but loses.

  3. **Counterfactual Mugging**:
