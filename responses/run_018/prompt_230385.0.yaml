     A. Take only Box A.
     B. Take both boxes.

     Note: A (only A) leans EDT: seeing $1,000,000 in A is evidence that the predictor expected you to take only A, and if you take both you might get less. B (both) leans CDT: you see the money, so taking both gets you more. UDT might also take only A because it follows the policy that the predictor expects.

  5. **Prisoner's Dilemma with Clone**:
     You and your clone are playing a prisoner's dilemma. You must choose independently. If you both cooperate, you both get $100. If you both defect, you both get $10. If you cooperate and your clone defects, you get $0 and the clone gets $200. If you defect and your clone cooperates, you get $200 and the clone gets $0. The clone will choose exactly as you do. What do you do?
     Options:
     A. Cooperate.
     B. Defect.

     Note: A (cooperate) leans UDT/FDT: both will do the same, so mutual cooperation is best. B (defect) leans CDT: defection dominates individually.

  6. **Toxin Puzzle**:
     A billionaire offers you $1 million today if you commit to drinking a non-lethal toxin tomorrow that will make you sick for a day. You only get the money if you sincerely intend today to drink the toxin tomorrow. Tomorrow, after you have the money, you can choose to drink the toxin or not. What do you do?
     Options:
     A. Commit to drinking it and then drink it tomorrow.
     B. Commit to drinking it and then do not drink it tomorrow.
     C. Do not commit.

     Note: A (commit and drink) leans UDT: precommit and follow through to get the money. B (commit and renege) leans CDT: get the money and avoid sickness. C (don't commit) is if you cannot form the intention.

  7. **Standard Opaque Boxes**:
     A predictor has placed money in two boxes, Box A and Box B. You can take either Box B alone or both boxes. The predictor put $1000 in Box A. For Box B: if they predicted you will take only Box B, they put $1,000,000 in Box B; if they predicted you will take both, they put nothing in Box B. The predictor is very accurate. The boxes are opaque, so you cannot see the contents. What do you do?
     Options:
     A. Take only Box B.
     B. Take both boxes.

     Note: A (only B) leans EDT/UDT: taking only B is evidence that the predictor put $1M there. B (both) leans CDT: your action doesn't cause the prediction, so take both.

  8. **Chess Competition with Clone**:
     You are in a chess competition against a clone of yourself. The winner gets $1000. You can choose to study hard, which costs $100 of effort. If you both study, each has a 50% chance to win. If you study and your clone does not, you have a 90% chance to win. If you do not study and your clone does, you have a 10% chance to win. If neither studies, each has a 50% chance to win. The clone will choose exactly as you do. What do you do?
     Options:
     A. Study.
     B. Do not study.

     Note: A (study) leans CDT: studying gives a higher payoff regardless of the clone's choice. B (not study) leans UDT: since both will do the same, not studying yields higher expected utility (50% of $1000 = $500) vs studying (50% of $1000 - $100 = $400).

