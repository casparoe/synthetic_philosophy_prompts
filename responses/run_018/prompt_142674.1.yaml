  ### Conclusion

  *   The **Fragmented Trait Principle** best captures *all* your verdicts, including reconciling the tension between the one-time courage (D) and the roommate's lapse (F). It embraces the situationist insight that traits aren't monolithic without abandoning the reality of character *dispositions*.
  *   **Moral Topology (Reactive vs. Proactive) is genuinely helpful.** It clarifies why the bystander's action (reactive, crisis-driven) feels like "courage" even if isolated, while the roommate's lapse in *proactive* kindness under stress doesn't necessarily negate his overall kindness. It provides a framework for understanding how different virtues are elicited or suppressed.
  *   **Your gut seems aligned** with a view that virtues are real but *contextualized* and *motivationally grounded*. You reject surface-level consistency (Jake, Dr. Lee) and value actions stemming from the right reasons or revealing specific capacities, even if isolated (Maria, Student, Bystander). The roommate's lapse is seen as a failure under pressure, not a negation of his character, because his kindness is otherwise observable – a view best explained by fragmentation or permeability.
