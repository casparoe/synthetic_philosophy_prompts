prompt: |-
  I'm taking a course on virtue ethics and the situtationist critique is really messing with my head, so I'm trying to check my gut on concrete cases to see if I actually buy into character traits or not. Here are my verdicts: Maria usually lies politely about small stuff, but she told her partner about her affair even though it destroyed the relationship — I think that's real integrity, not just a habit. Jake donates 20% of his income every year, but he does it mostly for tax breaks and to impress people at church; I don't think he's genuinely generous. Dr. Lee is incredibly patient with patients during 12-hour shifts, but she's abusive to her nurses behind closed doors — I feel like she's not actually patient, that's just professional masking. Then there's the random bystander with zero history of altruism who pulls a kid from a burning car and then goes back to being totally self-centered; I think that reveals hidden courage, even if it never shows up again. A student refuses to cheat on an exam when everyone else is cheating and there's literally zero risk of getting caught — that's real integrity too. But my roommate, who is usually kind, was cruel to a waiter when he was sleep-deprived and stressed about finals — I'm going back and forth, is that just the situation talking, or does it prove he's not kind at all?

  Can you lay out a principel, or maybe a couple candidates, that gets as many of these verdicts right as possible? For each one, tell me which cases it saves and which it has to throw out, and be honest about whether it can reconcile case F with case D. I was also chatting with friends about "moral topology" — the idea that virtues have different shapes depending on whether they're reactive, like sudden rescue, versus proactive, like sustained patience — and whether that distinction actually helps here or just adds noise. First give me the analysis in prose, then put a brief structured summary in a JSON object with these fields: principle_name (string, name of the principle), core_claim (string, one-sentence summary), saves_cases (array of case letters it handles well), fails_on (array of case letters it cannot save), roommate_f_verdict (string, what the principle says about my roommate), and moral_topology_note (string, whether the reactive/proactive distinction helps reconcile the tension).
reasoning: |-
  Hmm, the user is grappling with virtue ethics and the situationist critique by testing concrete cases to see if character traits are real. They've described several scenarios and want principles that explain their intuitive judgments about each. The cases involve traits like integrity, generosity, patience, courage, and kindness under various conditions.

  Looking at their examples: Maria shows integrity by confessing an affair despite personal cost; Jake isn't truly generous because his donations are self-serving; Dr. Lee's patience is performative, not genuine; the bystander displays sudden courage that remains latent; the student shows integrity when refusing to cheat; and the roommate's kindness falters under stress, raising questions about trait consistency.

  I need to develop principles that capture why some behaviors reflect true virtues while others don't. The key factors seem to be: motivational depth (whether the action stems from core values), situational pressures (how context enables or suppresses traits), and consistency patterns (whether virtues manifest across different challenges).

  For the roommate case (F), the challenge is reconciling his usual kindness with the cruel outburst. This is similar to the bystander's single courageous act (D) - both show that virtues can be fragmented or context-dependent. The reactive vs proactive distinction might help here: courage is reactive (activated in crises), while kindness is proactive (requires sustained effort that can erode under stress).

  Three candidate principles come to mind:
  1. The Motivational Anchor Principle emphasizes internal motivations over external habits.
  2. The Situational Permeability Principle examines how traits withstand varying pressures.
  3. The Fragmented Trait Principle accepts that virtues can be domain-specific.

  The Fragmented Trait Principle best handles the tension between cases D and F by acknowledging that virtues aren't monolithic - they can be latent (like courage) or context-bound (like kindness failing under exhaustion). The reactive/proactive distinction adds nuance without overcomplicating things.

  For the JSON summary, I'll structure it to show how each principle handles the cases, especially whether it resolves the roommate dilemma while accommodating the bystander's one-time courage.
answer: |-
  Based on your cases and verdicts, here's an analysis of principles that capture your intuitions, focusing on **motivational depth and context-dependent manifestation** as the key differentiators. The "moral topology" distinction (reactive vs. proactive) adds useful nuance, especially for reconciling cases D (bystander) and F (roommate).

  ### Analysis & Proposed Principles

  1.  **Motivational Anchor Principle:**
      *   **Core Idea:** A virtue requires action *motivated primarily by the inherent value of the trait itself* or the good it serves, not primarily by external incentives, fear, or self-serving goals. The action must align with the agent's endorsed values under conscious reflection.
      *   **Saves:** A (Maria - confesses affair due to honesty/relationship value), B (Jake - *not* generous, motivated by taxes/reputation), C (Dr. Lee - *not* patient, masking is instrumental, not motivated by patience's value), E (Student - refuses to cheat due to honesty/integrity).
      *   **Fails On:** D (Bystander - sudden rescue likely driven by instinct/arousal, not deep-seated "courage" value). F (Roommate - usually kind, implying motivation, but outburst seems situationally driven, not reflecting a *change* in core values).
      *   **Roommate F Verdict:** **Kindness remains.** The cruelty was a situationally induced failure (exhaustion/stress), not evidence he endorses cruelty or lacks a core motivation for kindness. His *typical* kindness likely reflects his motivational anchor.
      *   **Moral Topology Note:** **Moderately Helps.** Explains why D is harder to call "courage" under this principle (reactive, often instinctive), while proactive virtues (B's generosity, C's patience) more clearly reveal motivational anchors. Helps justify why F's lapse doesn't destroy the proactive trait.

  2.  **Situational Permeability Principle:**
      *   **Core Idea:** Virtues are real character traits but are *fragile* or *selectively permeable*; they manifest reliably only in situations that don't strongly activate countervailing pressures (fatigue, extreme stress, conflicting desires, anonymity, high cost). Genuine traits predict behavior *across relevantly similar situations where the trait is called for*.
      *   **Saves:** A (Maria - confession in high-cost situation shows integrity isn't just low-stakes habit), C (Dr. Lee - patience *fails* under counter-pressure (closed doors/nurses), revealing it's not robust), D (Bystander - courage *activated* by extreme crisis, even if latent otherwise), E (Student - integrity holds *despite* strong peer pressure/opportunity), F (Roommate - kindness *fails* under counter-pressure (stress/fatigue), but consistent kindness elsewhere shows the trait exists, just not universally robust).
      *   **Fails On:** B (Jake - consistent donation across situations *should* look like generosity; this principle struggles to explain why it's *not* if the situation (taxes/church) doesn't seem like a counter-pressure *suppressing* generosity but rather the *driver*. It risks calling Jake generous).
      *   **Roommate F Verdict:** **Kindness remains, but is fragile.** The cruelty shows the kindness trait isn't universally robust; it's permeable to stressors like exhaustion. His baseline kindness indicates the trait exists.
      *   **Moral Topology Note:** **Very Helpful.** Directly addresses the situationist critique. Explains D (reactive virtue activated by specific crisis) vs. F (proactive virtue suppressed by specific counter-pressure). Highlights that virtues have different "zones of reliability" based on their nature and the pressures they face.

  3.  **Fragmented Trait Principle (Best Fit):**
      *   **Core Idea:** Virtues are real but *domain-specific* and *fragmented*. People possess virtue-relevant *dispositions* ("local traits") tied to specific contexts, roles, relationships, or types of challenges, rather than monolithic, cross-situational global traits. A "virtue" is a cluster of related local dispositions.
      *   **Saves:** A (Maria - shows strong integrity specifically regarding fundamental relationship honesty), B (Jake - disposition is for "strategic giving in religious/tax contexts," not *general* generosity), C (Dr. Lee - disposition for "professional facade patience with patients," not genuine patience or kindness), D (Bystander - possesses a "crisis rescue courage" local trait, even if no other altruistic traits exist), E (Student - shows strong "academic integrity" disposition), F (Roommate - possesses a "general interpersonal kindness" disposition, but lacks a "kindness-under-extreme-stress/fatigue" disposition). *Crucially, it reconciles D and F.*
      *   **Fails On:** None perfectly, but it might feel unsatisfyingly fragmented. It doesn't *require* deep motivation like Principle 1, just reliable dispositions within domains.
      *   **Roommate F Verdict:** **Kindness exists, but is fragmented.** He possesses kindness in his typical domains (roommates, friends, etc.), but lacks the specific "stress-resilient kindness" fragment. The cruelty reveals a *gap* in his kindness profile, not the absence of kindness *per se*.
      *   **Moral Topology Note:** **Integrates Well.** Proactive virtues (like B's donations, C's "patience") are dispositions tied to sustained roles/habits. Reactive virtues (like D's rescue) are dispositions tied to acute crisis responses. F involves the failure of a proactive disposition (general kindness) under conditions that might trigger a different, undeveloped reactive disposition (stress management). The topology helps map the different domains/fragments.

