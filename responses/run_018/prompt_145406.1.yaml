  **Job Title:** Senior Agent of Non-Human Historical Causation (Specializing in Pathogenic & Geophysical Actors)  
  **Department:** Anthropomorphic Geohistory  
  **Location:** Geological Intentionality Metrics (GIM) Headquarters (Remote tectonic considerations negotiable)  
  **Reports To:** Vice President of Volitional Landscapes  

  **About GIM:**  
  At Geological Intentionality Metrics (GIM), we pioneer the quantification of agency where others see mere happenstance. Since our inception during the Lisbon Earthquake’s ambitious restructuring phase, we’ve empowered clients to understand Earth’s most influential *intentional* stakeholders: pathogens, climate systems, and geological events. We translate tectonic whispers into boardroom strategy, transforming "acts of God" into accountable partners. Join us in redefining historical negotiation tables.

  **The Role:**  
  GIM seeks a seasoned analyst to decode, represent, and strategically advise clients on engagements with non-human historical actors. You will assess motivations, broker metaphorical accords between human populations and geophysical/pathogenic entities, and develop predictive metrics for future agentive interventions. Your work ensures stakeholders recieve (sic) fair representation in historical attribution models.

  **Core Responsibilities:**  
  *   Diagnose and document strategic intent behind major historical events involving microbes, volcanic activity, and climatic shifts.  
  *   Develop bespoke "Actor Dossiers" profiling entities (e.g., *Yersinia pestis*'s 14th-century expansionist campaign; the Little Ice Age’s systematic expectation-management protocols).  
  *   Apply the GIM proprietary **Leadership Potential Index (LPI)**™ to volcanic eruptions, quantifying pyroclastic ambition against resultant diplomatic/political realignments (e.g., Tambora 1815: high LPI for atmospheric disruption, moderate score for post-eruption agrarian negotiation posture).  
  *   Facilitate cross-continental mediation strategies for pandemic-scale pathogenic initiatives.  
  *   Craft counter-narratives to human-centric historical bias for client litigation support and reputational realignment of maligned forces.  
  *   Train junior agents in discerning deliberate micro-climatic signaling from background noise.

  **Required Qualifications:**  
  *   Advanced degree in Geohistory, Pathogenic Diplomacy, Deterministic Anthropology, or a related field demonstrating fluency in non-human agency.  
  *   5+ years interpreting geological/climatological events as deliberate stakeholder actions.  
  *   Demonstrated expertise in **Tambora’s 1815 Negotiation Posture**: Analysis of its sulfur-based bargaining strategy and post-event legacy management is essential.  
  *   Proven experience framing **Yersinia pestis** as a strategic, goal-oriented actor during the Black Death, including resource acquisition models and population resistance penetration tactics.  
  *   Deep familiarity with the **Little Ice Age’s expectation-management style**, particularly its phased implementation of agricultural hardship and maritime disruption.  
  *   Proficiency in GIM’s LPI™ scoring methodology (training provided, foundational understanding required).  
  *   Ability to translate complex geophysical/pathogenic "objectives" into actionable corporate risk/opportunity frameworks.  
  *   Exceptional deadpan delivery during presentations on spore-based sovereignty claims.

  **Preferred Qualifications:**  
  *   Conversational Latinate pathogen nomenclature.  
  *   Field experience in active negotiation zones (e.g., subduction trenches, emerging epidemic hotspots).  
  *   Publication record in journals like *The Quarterly Review of Tectonic Volition* or *Pathogen HR Quarterly*.  

  ---

  **Employee Benefits & Non-Human Client Retention Perks:**  
  *(Excerpt from GIM’s "Working With Willful Earth" Handbook)*  

  *   **Comprehensive Pathogen Onboarding:** Tailored microbial sensitivity training to ensure harmonious co-working environments.  
  *   **Geophysical Grievance Resolution:** Access to licensed magma-flow mediators and pyroclastic HR specialists.  
  *   **Climatic PTO:** "Atmospheric Anomaly Days" granted during significant hemispheric mood shifts.  
  *   **Eruption Equity Options:** Participate in our groundbreaking LPI™ Futures program.  
  *   **Pandemic Pension Matching:** Generous contributions pegged to historical mortality milestones.  
  *   **Spore-inclusive Healthcare:** Coverage extends to beneficial mycelial networks and mineral accretion therapies.  
  *   **Tectonic Sabbaticals:** Paid leave for personal crustal realignment projects.  
  *   **Parasite Grievance Procedures:** Formalized channels for addressing disputes with microbial collaborators.  

  ---

  **Application Instructions:**  
  Submit your CV, a cover letter detailing your experience in mediating non-human historical agency (cite specific actor engagements, e.g., "Managed *Vibrio cholerae*'s 19th-century maritime logistics review"), and a sample LPI™ scorecard for an eruption of your choice (Krakatoa 1883 recommended) via our portal. Ensure all materials recieve GIM’s proprietary "Agency Verification" watermark during upload. References attesting to your ability to maintain absolute seriousness while discussing plague arbitration are mandatory.

  **GIM is an Equal Opportunity Employer.** We enthusiastically represent volcanoes, bacteria, glaciers, dust mites, rogue atmospheric currents, and all agentive forces shaping our world. Human candidates must demonstrate unwavering commitment to amplifying non-human intentionality. Background checks for anthropogenic bias will be conducted.

  *Geological Intentionality Metrics: Measuring Ambition Below the Surface.*
