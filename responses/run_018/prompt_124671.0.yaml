answer: |-
  Here is the full specification of desiderata for an adequate interpretive theory of the French Revolution's trajectory (1789-1794), focusing on explaining radicalization *and* reversal:

  1.  **Dual Trajectory Requirement:** The theory must simultaneously explain the *ascendant radicalization* culminating in the Terror (1793-94) *and* the *rapid reversal/dismantling* of that system in Thermidor Year II (July 1794). It must account for both processes arising from the *same* revolutionary dynamic without treating Thermidor as a simple external reaction or counter-revolution.
      *   **Phenomenon:** The transition from maximal revolutionary mobilization/power centralization (CPS, Terror) to its partial collapse and the rejection of its key practices.
      *   **Puzzle:** Why did the revolutionary state, built to save the Republic, turn against its most zealous architects so decisively?

  2.  **Class Interest vs. Ideological Commitment Distinction:** The theory must differentiate between motivations driven by perceived material/class interests (e.g., bourgeois property defense, sans-culotte subsistence demands) and those driven by ideological/political convictions (e.g., republican virtue, defense of the patrie en danger, Rousseauist ideals). It must show how these interacted, reinforced, or conflicted without reducing one entirely to the other.
      *   **Phenomenon:** The behavior of actors like Danton (shifting pragmatism), Robespierre (ideological rigidity), or the sans-culottes (blending subsistence needs with political fervor).
      *   **Puzzle:** Was the Terror driven more by material necessity (war, famine) or ideological logic (purification of the Republic)?

  3.  **Institutional Autonomy & Dynamic Requirement:** The theory must account for the CPS and Revolutionary Tribunal developing institutional logics, interests, and dynamics *partially autonomous* from both the Convention and the popular movement. It must explain how these institutions could become self-perpetuating and turn against their creators/supporters.
      *   **Phenomenon:** The CPS overriding the Convention; the Tribunal convicting revolutionary leaders (Danton, Hébert, ultimately Robespierre); the bureaucratization of terror.
      *   **Puzzle:** How did revolutionary institutions designed for defense become engines of internal purge? Does this exemplify "revolutions devouring their children" as an *institutional* process?

  4.  **Spatial Variation & Center-Periphery Tension:** The theory must explain the stark differences between the intense political mobilization and pressure in Paris (sections, Commune) and the varying degrees of acquiescence, resistance, or detachment in the provinces (e.g., Federalist Revolts, Vendée, passive compliance). It must clarify how these dynamics influenced both radicalization (e.g., sans-culotte pressure on Convention) and reversal (e.g., provincial fatigue with the Terror).
      *   **Phenomenon:** The Parisian September Massacres vs. provincial grain riots; the Federalist Revolts; the Vendée uprising; differing enforcement of Maximum laws.
      *   **Puzzle:** Why did the revolutionary center (Paris) sustain radical pressure longer than much of the periphery, and how did this disparity contribute to Thermidor?

  5.  **War & Economic Crisis as Radicalizing/Counter-Radicalizing Forces:** The theory must integrate the existential threat of foreign invasion and civil war (Vendée, Federalism) and the catastrophic economic situation (assignat collapse, inflation, shortages) as *catalysts* for both radicalization (justifying emergency powers) *and* counter-radicalization (creating fatigue, resentment, and a desire for stability).
      *   **Phenomenon:** The levée en masse and the "patrie en danger" justifying terror; the Maximum laws and their economic/social impact; the shift in bourgeois priorities towards order as military success reduced external threat by mid-1794.
      *   **Puzzle:** Did military success *create* the conditions for Thermidor by removing the primary justification for the Terror?

  6.  **Ideological Evolution & Fracture Requirement:** The theory must track the fragmentation of the original revolutionary consensus and the emergence/intensification of competing ideological currents (Enragés, Hébertists, Indulgents, Robespierrists) and explain how ideological conflict itself became a driver of radicalization (denunciations, purity spirals) and a source of vulnerability for the radical leadership.
      *   **Phenomenon:** De-Christianization vs. Cult of the Supreme Being; conflicts over economic controls; accusations of conspiracy and corruption (Danton, Fabre d'Églantine); Robespierre's focus on "virtue" vs. "faction."
      *   **Puzzle:** How did ideological disagreements among revolutionaries become lethal? Was Robespierre's downfall rooted in ideological rigidity and the alienation of potential allies?

  7.  **Contingency of Key Decisions:** The theory must incorporate the role of specific, contingent decisions by identifiable agents at critical junctures, particularly within the CPS and Convention, without reducing the entire trajectory to random choices.
      *   **Phenomenon:** The precise timing and targets of purges (Hébertists, Dantonists); Robespierre's withdrawal and inflammatory speech of 8 Thermidor; the failure of the Paris Commune to mobilize effectively on 9-10 Thermidor; the specific alliances formed against Robespierre in the Convention.
      *   **Puzzle:** Was Thermidor a contingent political coup or the structurally inevitable result of the Terror's dynamics? ***(Potential Conflict with Desideratum 8)***

  8.  **Structural Predisposition for Leadership Elimination:** The theory must explain why the revolutionary process created a *systematic tendency* for factions and leaders instrumental in radicalization to become vulnerable to elimination *by the institutions and processes they helped establish*.
      *   **Phenomenon:** The execution of key radical leaders (Hébert, Danton, Desmoulins, Robespierre, Saint-Just) by the Revolutionary Government they built. This operationalizes "revolutions devouring their children."
      *   **Puzzle:** Is the elimination of radical leaders a necessary consequence of revolutionary logic driven by war, ideological purity, and institutional self-preservation, or was it avoidable? ***(Potential Conflict with Desideratum 7)***

  9.  **Macro-Structural Context vs. Micro-Political Event Linkage:** The theory must connect broad structural factors (economic crisis, social tensions, geopolitical conflict) to the specific unfolding of political events and decisions, particularly the precise timing and mechanism of Thermidor, without making the latter seem mechanically determined.
      *   **Phenomenon:** The fall of Robespierre on 9-10 Thermidor Year II as the specific event triggering reversal.
      *   **Puzzle:** ***(Flagged Conflict)*** How can a theory demand structural explanations for the *tendency* towards reversal (Desideratum 1, 8) while also demanding an explanation for the *specifics* of Thermidor (Desideratum 7) that acknowledges contingency? Resolving this tension is paramount.

  **Assessment of Interpretive Families:**
  *   **Materialist/Class-Struggle:** Strong on Desiderata 2 (class interests), 4 (spatial variation), 5 (economic crisis). Struggles with 3 (institutional autonomy), 6 (ideological fracture as driver), 7 (contingency), and the micro-event of Thermidor (9). Often sees Thermidor as bourgeois stabilization (1, 8).
  *   **Ideological/Political-Culture:** Strong on Desiderata 2 (ideology), 3 (institutional logic derived from discourse), 6 (fracture, purity). Struggles with 4 (spatial variation/material roots), 5 (war/economy as independent variables), 8 (structural tendency beyond discourse). Thermidor often framed as ideological exhaustion/collapse of consensus (1).
  *   **Contingency-Driven:** Strong on Desiderata 7 (key decisions), 9 (micro-event). Struggles with 1 (dual trajectory as necessity), 5 (crisis as catalyst), 8 (systematic tendency), often presenting Thermidor as an avoidable accident.

  **Crucial Counterfactual Requirement:**
  *   **The Voluntary Dissolution Scenario:** The theory must generate a plausible prediction for the Revolution's trajectory had the Committee of Public Safety peacefully dissolved itself and relinquished emergency powers in late June/early July 1794 (e.g., Prairial/early Messidor Year II), *before* the Thermidorian coup.
      *   **Prediction Requirements:**
          *   Would the institutional apparatus of the Terror (Revolutionary Tribunal, surveillance committees) have persisted or rapidly decayed without the CPS?
          *   Would the Convention have reasserted control smoothly, or would factional conflict/Parisian mobilization have created a new crisis?
          *   Would the economic controls (Maximum) have collapsed faster or slower?
          *   Would the military successes continue unabated?
          *   Crucially, **would the core revolutionary leadership (Robespierre, Saint-Just, Couthon) have survived politically?** Or would structural pressures (war fatigue, economic strain, factionalism) still have led to their marginalization or elimination, albeit through different mechanisms (e.g., electoral defeat, denunciation without summary execution)? Would the *form* but not the *substance* of a "moderate" reaction have occurred?
      *   **Differentiation from Actual Thermidor:** The theory must explicitly state whether this predicted outcome differs materially from the actual Thermidorian Reaction (e.g., in speed of dismantling terror, level of violence during transition, fate of specific leaders, stability of the resulting regime) based on its core explanatory mechanisms. For example:
          *   A structural theory might predict similar bourgeois stabilization and leader marginalization, just less violently.
          *   A contingency-heavy theory might predict chaos or even civil war without the decisive Thermidorian coup.
          *   An ideology-focused theory might predict a slower unraveling of the radical consensus.
