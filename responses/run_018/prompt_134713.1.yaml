answer: |-
  ## Grant Proposal: Reinterpreting the Separateness of Persons - Authority, Not Just Aggregation

  **Project Summary:** This project challenges the standard interpretation of the “separateness of persons” objection to utilitarianism. Traditionally framed as an anti-aggregation claim (Rawls), arguing that distinct centers of consciousness preclude summing utility across individuals, I propose instead that the core objection concerns *normative authority*. Utilitarianism violates the claim that each individual possesses inherent authority over how their own well-being factors into collective decisions, substituting an external calculus for this personal jurisdiction. Over three months part-time, I will rigorously reconstruct the separateness objection as an authority-violation claim, demonstrate why dominant interpretations (Rawlsian and utilitarian) neglect this dimension, and utilize shared-agency/joint-intentionality literature to model the requirements of “retaining authority.” This reconceptualization promises a more precise critique of utilitarianism and fresh insights into the legitimacy of collective choice.

  **Precise Research Question:** Is the moral force of the "separateness of persons" objection to utilitarianism best understood not as a fundamental prohibition against interpersonal aggregation *as such*, but rather as an objection to utilitarianism’s violation of each individual’s normative authority concerning the *role and weight* assigned to their own well-being within collective decision-making procedures?

  **The Current Gap: Distribution Obsession vs. Authority Neglect:** Both standard Rawlsian critics and utilitarian defenders focus overwhelmingly on distributive outcomes and equality. Rawls emphasizes fairness in how benefits/burdens are *distributed* across separate persons via principles chosen behind the veil of ignorance. His objection targets the *result* of aggregation – potential sacrifices of the few for the many – grounded in the moral arbitrariness of one person bearing costs for another's gain *because* they are separate. Utilitarians, meanwhile, defend aggregation precisely as the method for achieving optimal *distributions* of welfare (maximizing the sum). **This shared focus on distributive patterns inadvertently obscures a prior, fundamental issue: the *procedural legitimacy* of how individual well-being enters the collective calculus in the first place.** By framing the debate solely around *whether* and *how much* to aggregate, both sides neglect the question of *who gets to determine the normative significance* of an individual's well-being within a collective context. The "separateness" objection, in its deepest form, is not merely about preventing bad distributions caused by addition; it's about respecting the individual as the rightful "author" of the normative value attributed to their own life within shared endeavors.

  **Defending the Authority Reconstruction: The Right Framing:** The standard anti-aggregation reading is descriptively and normatively incomplete.

  1.  **Descriptive Incompleteness:** It fails to capture the *specific character* of the moral wrong often felt. The intuitive revulsion isn't solely about summing utilities *mathematically*; it’s about the *presumption* of an external agent (the utilitarian calculator) assigning weights and making trade-offs *on behalf* of individuals without their normative consent. It feels like an overreach, a usurpation of a domain (the value of *my* life to *me*) where the individual should hold sway.
  2.  **Normative Superiority:** Framing it as an authority violation directly addresses the core Kantian/Rawlsian insight about persons as ends-in-themselves, possessing autonomy and a standpoint that must be respected. Respecting separateness isn't just about preventing the *consequence* of aggregation (sacrifice), but about acknowledging the *source* of the value being aggregated – it originates within, and is normatively governed by, the separate individual. Utilitarianism bypasses this essential locus of normative authority.
  3.  **Explanatory Power:** This framing better explains why aggregation *within* a single life is unproblematic (I have authority over trade-offs concerning my own future selves) and why certain forms of *consensual* aggregation (e.g., within families, teams, or negotiated agreements) might *not* violate the separateness intuition – because authority is exercised or delegated, not overridden.

  **Approach and Methods:** I will employ conceptual analysis enriched by frameworks from the philosophy of shared agency and joint intentionality (e.g., Bratman, Gilbert, List & Pettit).

  1.  **Conceptual Analysis:** Precisely articulate the notions of "normative authority over one's well-being" and "jurisdiction" in the context of collective decision-making. Distinguish this from mere preference expression or bargaining power.
  2.  **Shared Agency Modeling:** Utilize models of shared intention, joint commitment, and collective action. How do individuals retain, pool, delegate, or alienate their individual practical authority when forming a "we"? What conditions allow individuals to participate in collective decisions while maintaining their status as autonomous sources of normative claims about their own good?
  3.  **Apply to Utilitarianism:** Analyze the utilitarian decision procedure through this lens. Does it model a form of shared agency? If so, does it involve an illegitimate *transfer* or *usurpation* of individual normative authority regarding well-being? Or does it fail to constitute a genuine form of shared agency at all, acting instead as an external imposition?
  4.  **Assess the Objection:** Reformulate the separateness objection explicitly as an authority-violation claim. Evaluate its strength compared to the anti-aggregation claim.

  **Project Plan (3 Months Part-Time):**

  *   **Month 1:** Deep dive into key shared agency/joint intentionality literature. Refine conceptual definitions of "normative authority" and "jurisdiction" in this context. Begin mapping the requirements for individuals to "retain authority" within collective frameworks.
  *   **Month 2:** Apply the authority framework rigorously to the utilitarian decision procedure. Develop the argument for why utilitarianism constitutes a violation of individual normative jurisdiction. Explicitly contrast this with the anti-aggregation reading. Outline potential counterarguments (e.g., hypothetical consent, epistemic arguments).
  *   **Month 3:** Articulate possible conclusions regarding the robustness of the authority-based objection. Explore preliminary implications (e.g., for democratic theory, contractualism). Draft the core argument and conclusions for the proposal/paper. Finalize scope limitations.

  **Possible Conclusions:**

  1.  **Strengthened Objection:** The authority-violation is fundamental and persists even if aggregation *per se* is sometimes permissible (e.g., via consent). Utilitarianism is inherently illegitimate as a collective procedure due to its structural denial of individual normative jurisdiction.
  2.  **Contextualized Objection:** The objection highlights a crucial flaw, but authority *can* be conditionally delegated or pooled within specific forms of genuinely shared agency (e.g., deeply democratic processes, certain cooperative ventures). Utilitarianism fails because it doesn't meet these conditions (lacks mechanisms for authorizing the use of individual well-being). This weakens the objection against *all* aggregation but strengthens it against *non-consensual, imposed* utilitarian calculus.
  3.  **Failure Condition (Weakened Objection):** If "retaining normative authority" reduces demonstrably to merely ensuring one's preferences are counted (perhaps with veto power), the authority claim collapses into a preference-satisfaction or bargaining model, losing its distinct moral force and potentially aligning with sophisticated preference utilitarianism. The anti-aggregation reading might then retain primacy.

  **Scope Realism:**

  *   **Achievable (Core Focus):** Rigorous conceptual reconstruction of the separateness objection as an authority-violation claim; demonstration of the gap in Rawlsian/utilitarian discourse; development of the core argument using shared agency concepts; articulation of the possible conclusions listed above; clear delineation of the failure condition.
  *   **Beyond Scope (Needs Cutting):** Comprehensive historical analysis of the objection's development; detailed application to specific policy realms; full development of an alternative normative framework (e.g., a full theory of legitimate collective authority delegation); extensive engagement with all possible utilitarian rebuttals; empirical investigation.

  **Significance:** This project offers a paradigm shift in understanding one of the most persistent criticisms of utilitarianism. By reframing the separateness objection around normative authority and jurisdiction, it provides a more fundamental and precise critique, grounded in the moral significance of individual agency beyond distribution. It forges crucial links between political philosophy, ethics, and the philosophy of collective action. Successfully defending this reconstruction would not only deepen the critique of utilitarianism but also illuminate the conditions for legitimate collective decision-making that truly respects persons as separate sources of normative value. Failure (e.g., the reduction to preference-satisfaction) would still significantly clarify the conceptual landscape surrounding aggregation and authority. This focused, three-month project aims to establish the conceptual groundwork and compelling argument for this novel interpretation, paving the way for future research on its broader implications.
