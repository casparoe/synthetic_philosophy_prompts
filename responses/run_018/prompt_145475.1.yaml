  2. The Schema Stancers might not understand their role and try to be consistent. The instructor should explain that they can choose any primary key per object.

  3. Deadlock: if the factions are evenly split and the Schema Stancers can't break it, then the object is not a horse. But the Schema Stancers can break it.

  4. Time: 90 minutes might be tight. We have 6 objects, 5 minutes each -> 30 minutes, plus intro and debrief.

  ### Debrief

  After the exercise, the instructor should:

  1. Ask each faction how they felt during the exercise. The Separators might feel frustrated that the Schema Stancers were arbitrary.

  2. Point out that the Schema Stancers' ability to redefine the primary key mirrors the way in which the School of Names argues that names are conventional and can be manipulated. In the white horse dialogue, Gongsun Long argues that "white horse" is not "horse" because "horse" refers to the form and "white" to the color, and when combined, they pick out a different set of objects. Similarly, the Schema Stancers showed that by choosing different attributes as primary, they can change what counts as a horse.

  3. Highlight the moment of absurdity: when the Schema Stanners classify the wooden horse as a horse by choosing "shape" or "function", it feels right in that context, but then immediately when you think about it, it's not a real horse. This parallels the white horse dialogue: separating color and form feels rigorous, but then you realize that in the world, we never encounter form without color.

  4. What the game can't reproduce: The School of Names believed that correct naming could fix social disorder. In this game, the Schema Stanners' flexible naming caused frustration and potential disorder (the penalty) but also allowed them to win. In real life, such flexibility might lead to more disorder. The instructor should explain that the School of Names thought that by clarifying names, we can avoid such disputes, but in this game, we saw that the dispute arose because of the flexibility of naming.

  ### Materials

  - A description of the three factions for handout (without lecturing, just one paragraph each).
  - Descriptions of the six objects (with pictures if possible).
  - A voting board or sheets.

  ### Timeline

  - 0-10 min: Introduction, divide into factions, explain the rules, the objects, and the stakes.
  - 10-20 min: Factions discuss internally and write down their classifications (for Separators and Unifiers; Schema Stancers can wait or plan strategy).
  - 20-50 min: For each object (6 objects * 5 min = 30 min), discuss and vote.
  - 50-55 min: Tally results, see if they avoided forfeit.
  - 55-70 min: Debrief and connect to white horse dialogue.
  - 70-90 min: If they had forfeit, they stay for 15 min of discussion (which can be part of the debrief). If not, they end early or discuss more.

  ### Handout for Factions

  **Separators**: You believe that the essence of an object is in its form. For "horse", the form is the defining property (e.g., being a living equine animal). Properties like color, size, or material are accidents and can be ignored. You must classify each object based on whether it has the essential form of a horse.

  **Unifiers**: You believe that the term "horse" refers to the whole object and cannot be broken down into separate properties. Decomposing the concept leads to error. You rely on the common understanding of what a horse is: a typical, living horse. You must classify each object as a whole, without abstracting.

  **Schema Stancers**: You believe that every object has one primary identifier (like a database primary key) and all other properties are secondary. For each object, you can choose which property is the primary key (e.g., species, function, shape, etc.) and then classify it as a horse if that primary key matches that of a horse. You can choose a different primary key for each object. Your goal is to help the group reach consensus and avoid forfeit, but also to win the faction competition.

  ### Objects

  1. **Painted Wooden Horse**: A life-sized sculpture made of wood, painted white. It is used as a decoration.
  2. **White Pony Statue**: A small statue of a pony, made of white stone.
  3. **Horse-shaped Shadow**: A shadow on snow that has the shape of a horse, cast by a rock formation.
  4. **Albino Foal**: A very young, living albino horse. It is white and fragile.
  5. **Hologram**: A projected image of a white horse that appears three-dimensional.
  6. **Genetically Modified White Zebra**: A living animal that was originally a zebra but has been modified to have horse-like features and white color. It has more horse DNA than zebra DNA.

  ### Rules

  - The estate will be inherited by a horse present at the memorial service, but only if there is exactly one horse. If zero or more than one, the estate is forfeited to charity and the group must stay 15 minutes late.
  - Each faction must classify each object as a horse (yes) or not (no). The Separators and Unifiers will write down their classifications based on their principles. The Schema Stancers do not write down in advance; they will decide during the discussion.
  - For each object, there will be a 5-minute discussion. Then, each faction votes as a block (one vote per faction). If at least two factions agree, that is the consensus. If all three disagree, the object is not a horse.
  - After all objects, if exactly one is a horse, the estate is inherited and no penalty. Otherwise, penalty.
  - The faction with the highest number of consensus votes that matched their vote wins the right to choose the next topic.

  This design should create the desired experience.
answer: |-
  Below is a structured, self-contained role-play exercise designed to create an experiential understanding of Gongsun Long's "white horse is not horse" paradox through deliberation, classification struggles, and emergent absurdity. The exercise forces participants to confront the tension between rigorous separation of properties and the intuitive unity of objects, with the Schema Stancers introducing database-like rigidity that exposes the arbitrariness of naming.

  ---

  ### **White Horse Inheritance Game: Structured Role-Play**

  **Goal:** To create a visceral experience of the "white horse" paradox—where separating properties feels logically sound until it collapses into absurdity—through collective decision-making. Players discover how naming conventions (e.g., isolating "color" from "form") affect reality, leading to coordination failure and social discord.

  **Participants:** 8 players divided into three factions:
  - **Separators (3 players)**: Argue that "color" and "form" are distinct properties. An object must satisfy *both* the strict definition of "horse" (equine biology) *and* the property "white" to qualify. They cannot be mixed (e.g., "white horse" is a composite concept).
  - **Unifiers (3 players)**: Insist that "white horse" is an indivisible whole. They reject decomposition: an object either *is* a white horse (common-sense unity) or it isn't. Context and function matter.
  - **Schema Stancers (2 players)**: Treat objects like database rows. Each object has one **primary key (PK)** defining its core identity (e.g., "horse"). All other properties (e.g., "white") are secondary "foreign keys" that don't affect essence. They choose the PK per object and can redefine it strategically.

  **Materials:** 
  - Six object cards (described below).  
  - Voting tokens (✅ for "is a horse", ❌ for "is not a horse").  
  - Timer (90 minutes total).  
  - Whiteboard to track votes and PK assignments.  
  - Stakes: Winning faction picks next session’s topic. If consensus isn’t reached for all objects, the group loses 10 minutes of social time (e.g., no post-discussion chat).

  ---

  ### **Objects to Classify**
  Each object is ambiguous, forcing factions to defend their philosophy. Descriptions are minimal to avoid bias:
  1. **Painted Wooden Horse**: Life-sized, made of wood, painted white. Used as a decoration.  
  2. **White Pony Statue**: Small stone statue of a pony, painted white.  
  3. **Horse-Shaped Shadow**: Shadow on snow cast by a rock formation; shape resembles a horse.  
  4. **Albino Foal**: Young living horse (foal), albino, but pigment not fully developed (appears pinkish-white).  
  5. **Hologram**: Projected 3D image of a white horse, interactive but intangible.  
  6. **GM White Zebra**: Living animal; genetically modified zebra with horse DNA, white coat, and horse-like features.

  **Legal Rule:** *"Lady Wei's estate is inherited only by a 'horse' present at her memorial. If exactly one object is deemed a 'horse', it inherits. If zero or multiple qualify, the estate is voided (penalty: lose social time)."*

  ---

  ### **Game Structure**  
  *(Total: 70-75 minutes; Debrief: 15-20 minutes)*

  1. **Setup (5 minutes)**  
     - Split players into factions randomly. Hand out faction briefs (below).  
     - Explain the rule and stakes. Emphasize: **No biology or "real-world" appeals**—only faction logic allowed.  
     - Show object cards. Schema Stancers get a "PK Token" to assign per object during debates.

  2. **Faction Preparation (10 minutes)**  
     - Factions discuss their approach privately. Separators and Unifiers must pre-classify all objects (✅/❌). Schema Stancers **do not pre-classify**—they will assign PKs during debates.  
     - **Faction Briefs (distribute in writing):**  
       - *Separators*: "Horse = biological equine form. 'White' is accidental and separate. Judge form first, then color. E.g., a white pony statue has color but not form."  
       - *Unifiers*: "A white horse is one thing—you know it when you see it. Decomposing it kills its essence. Judge holistically: if it feels like a white horse in context, it is."  
       - *Schema Stancers*: "Every object has one primary key (PK) defining its core identity (e.g., species, material, function). Assign PKs based on what feels 'most essential' per object. Secondary properties (e.g., color) don’t affect 'horse' status. Change PKs freely to avoid deadlock."

  3. **Classification Debates (45 minutes; 7 minutes per object)**  
     - **Order:** Discuss objects one-by-one (use the order above).  
     - **Process per object:**  
       - Schema Stancers assign a PK (e.g., for the hologram: PK="function"). They announce it and write it on the board.  
       - Each faction argues for 2 minutes:  
         - Separators: Why form/color separation supports ✅/❌.  
         - Unifiers: Why the whole object supports ✅/❌.  
         - Schema Stancers: Why their PK makes the object ✅/❌ (e.g., "Hologram’s PK is function—it performs as art, not a horse → ❌").  
       - Open debate for 3 minutes. Factions can change votes, but must justify using their logic.  
       - **Vote:** Each faction casts one collective token (✅/❌). Majority vote wins (2+ factions agree = consensus). If all disagree, deadlock → object is ❌.  

  4. **Resolution (5 minutes)**  
     - Tally which objects are horses. Apply the rule:  
       - Exactly one horse? Inheritance granted → no penalty.  
       - Zero or multiple horses? Estate voided → lose social time.  
     - Declare winning faction: Who won the most consensus votes (i.e., group agreed with their ✅/❌ per object)? They pick next topic.  

  ---

  ### **Predictable Breakdowns & Learning Moments**  
  - **First-Run Failures:**  
    - A Separator/Unifier will appeal to biology ("A horse is a mammal!") or common sense ("Everyone knows a statue isn’t a horse!"). **Shut this down:** Remind them to use faction logic only. This mirrors real-world intuition clashes in philosophy.  
    - Schema Stancers will win consistently by redefining PKs:  
      - E.g., For the **GM White Zebra**, they might set PK="genetics" (❌, not pure horse) or PK="appearance" (✅, looks like a horse).  
      - Separators will rage at this "cheating" (PKs feel arbitrary), but they can’t refute it—Schema Stancers are technically following their rules.  
    - Deadlocks on ambiguous objects (e.g., **Albino Foal**): Separators may ✅ (biological form), Unifiers ❌ (not a "full" horse), Schema Stancers arbitrate by setting PK="age" (❌) or PK="species" (✅).  
    - **Outcome:** Schema Stancers often force 0 or 2+ "horses," voiding the estate. The group feels frustration—a microcosm of social disorder from naming disputes.

  - **Absurdity Emergence:**  
    - Early debates feel rigorous (e.g., Separators "proving" the wooden horse isn’t a horse by isolating form from color).  
    - Mid-game, Schema Stancers’ PK shifts expose contradictions:  
      - E.g., They classify the **Horse-Shaped Shadow** as ✅ (PK="shape") but the **White Pony Statue** as ❌ (PK="material"). Players realize PKs are subjective, making "horse" both over-inclusive and under-inclusive.  
    - Final votes collapse into farce: The **Hologram** might be ✅ if PK="representation," making Separators sputter at the "illogic." This mirrors Gongsun Long’s paradox—decomposition feels airtight until it absurdly excludes real horses or includes non-horses.

  ---

  ### **Debrief (15-20 minutes)**  
  Connect the game to Mingjia philosophy:  
  1. **Gongsun Long’s Paradox:** "White horse is not horse" because:  
     - Separators isolated properties (color ≠ form), creating precise but absurd boundaries.  
     - Unifiers saw decomposition as "loss"—you can’t split "white horse" without destroying it.  
     - Schema Stancers mirrored naming’s power: Assigning a PK (e.g., "form") changes what exists as a "horse," just as Gongsun Long argued names create reality.  

  2. **What the Game Can’t Capture:**  
     - Mingjia believed **correct naming prevents social disorder**. Here, naming *caused* disorder (deadlocks, voided estate). Explain verbally: *"The School of Names thought precise definitions would resolve conflicts, but this game shows names can be weaponized (e.g., PK shifts). Real-world naming requires shared conventions—without them, you get chaos."*  

  3. **Discussion Questions:**  
     - "When did decomposition (Separators) feel convincing? When did it break down?"  
     - "Schema Stancers: Did redefining PKs feel like cheating or logic? Why?"  
     - "How might this apply to modern categories like AI (is ChatGPT ‘intelligent’?), gender, or species?"  

  ---

  ### **Why This Works**  
  - **No Prep Needed:** Faction briefs and object cards make it lecture-free. Players "feel" the paradox by debating, not listening.  
  - **Schema Stancers as the Engine:** Their PK shifts create the absurdity cascade. Separators’ frustration mimics historical reactions to Mingjia sophistry.  
  - **Stakes Focus Debate:** Social penalties and topic control raise engagement, forcing players to commit to their roles.  
  - **Time-Efficient:** Fits 90 minutes with buffer for chaos.  

  Run this as a catalyst, not a conclusion—the debrief links gameplay to Mingjia texts. The chaos of redefinition will make Gongsun Long’s arguments resonate as a lived dilemma, not an abstract puzzle.
