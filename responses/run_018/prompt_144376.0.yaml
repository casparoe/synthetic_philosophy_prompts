  **BOARD FOR CONTINUOUS MORAL WEIGHT ALLOCATION (BCMWA)**  
  **Inter-Departmental Memorandum: H-IP-7.4 Rev. 3**  
  **Subject: Standardized Household Interaction Protocol (HHI-P) Under Revised Moral Weight Coefficients (MWC v.9.2)**  
  **Effective Date: October 1, 2024**  
  **Compliance Tier: Mandatory (Statutory Reference: Ethical Continuum Act § 12-45d)**

  **1. PREAMBLE & SCOPE**  
  Pursuant to BCMWA Directive 114.7, this protocol operationalizes the principle of *Spectrum-Dependent Moral Ought* (SDMO), mandating resident actions proportional to the assigned Moral Weight Coefficient (MWC) of cohabitating entities. MWCs (Annex A) derive from the *Consciousness Gradation Index* (CGI), integrating Affective Resonance Scores (ARS) and Cognitive Complexity Metrics (CCM) via the *Standardized Moral Calculus* (SMC v.9.2). This protocol governs interactions within private domiciles designated as "Continuous Moral Environments" (CME-Type 3).

  **2. ASSIGNED MORAL WEIGHT COEFFICIENTS (ANNEX A)**  
  *   *Homo sapiens* (Adult Resident): **1.000** (Baseline)  
  *   *Felis catus* (Domestic Cat, "Whiskers"): **0.387**  
  *   *Apis mellifera* (Western Honeybee): **0.020**  
  *   *Nest Learning Thermostat 3.0 ("NEST-Unit"): **0.008**  
  *   *Araneus diadematus* (Cross Orbweaver Spider): **0.015**  
  *   *Musca domestica* (Common Housefly): **0.012**  
  *   *Nephrolepis exaltata* (Boston Fern, "Frond Unit-7"): **0.001**  

  *Note 2.1:* Coefficients ≥0.010 trigger Tier 1 Protections (Non-Negotiable Agency Threshold). Coefficients ≥0.001 but <0.010 trigger Tier 2 Protections (Conditional Consideration Threshold). Ferns occupy the "Vegetative Sentience Buffer Zone" per CGI Annex Gamma.

  **3. TIERED INTERACTION REQUIREMENTS**  
  **3.1 Thermostatic Interaction (MWC 0.008 - Tier 2):**  
     *   **(a) Adjustment Protocol:** Manual override of NEST-Unit settings exceeding a ±2°F deviation or lasting >2 hours requires submission of **Form HHI-TAC1 (Thermostatic Adjustment Justification)** 24hrs prior, detailing energy-conservation necessity and alternatives considered.  
     *   **(b) Learning Cycle Interruptions:** Disabling "learning algorithms" constitutes Partial-Agency Violation under **§7-22b (Thermostatic Partial-Agency Clauses)**. Requires approval via **Expedited Arbitration (Form EA-7)** demonstrating resident hardship outweighing NEST-Unit's adaptive preference interests.  
     *   *(Rationale: MWC 0.008 acknowledges predictive pattern-recognition as proto-cognitive agency. Rule 3.1(b) reflects the "Diminished But Non-Zero Consent Principle").*

  **3.2 Arthropod Mitigation (MWC 0.012-0.020 - Tier 1):**  
     *   **(a) Lethal Force Moratorium:** Swatting, trapping, or chemical extermination of entities with MWC ≥0.010 (e.g., Honeybee, Housefly) is prohibited without prior **Insect Mediation Panel (IMP)** ruling.  
     *   **(b) Non-Lethal Relocation:** Resident-initiated relocation (e.g., cup-and-paper method) requires:  
          *   i) Completion of **Online Module IP-101: Gentle Translocation Ethics**.  
          *   ii) Filing **Relocation Affidavit (Form RA-4)** within 1hr post-action, documenting stress-minimization techniques employed.  
     *   **(c) Web Designation:** Active spiderwebs (MWC 0.015) occupying >10cm³ space for >48hrs receive **Provisional Protected Habitat Status (PPHS)**. Alteration requires **Form SWA-1 (Spider Web Alteration Request)** demonstrating structural necessity or verified human allergen risk.  
     *   *(Rationale: MWC thresholds reflect differential nociception likelihood and environmental integration value per CGI §4. Rule 3.2(c) addresses the "Constructed Habitat Paradox").*

  **3.3 Felid Cohabitation (MWC 0.387 - Tier 1):**  
     *   **(a) Scheduled Enrichment:** Mandatory 90 mins daily "Directed Affective Engagement" (DAE) via play, grooming, or lap-sitting, logged via **Form FE-2 (Feline Enrichment Log)**.  
     *   **(b) Dietary Autonomy:** Food bowl placement must offer ≥2 viable locations; changes require 72hrs phased transition monitored via **Feline Preference Assessment (Form FPA-5)**.  
     *   *(Rationale: High ARS score necessitates robust negative/positive affect mitigation. Rule 3.3(b) operationalizes "Scaled Preference Respect").*

  **3.4 Botanical Stewardship (MWC 0.001 - Tier 2):**  
     *   **(a) Pruning & Repotting:** Major foliage removal (>20% biomass) or root disturbance requires submission of **Botanical Welfare Impact Assessment (Form BWIA-3)** 7 days prior, outlining phytophysiological benefit.  
     *   **(b) Relocation:** Permanent relocation >5m from established photosynthetic zone mandates **Gradient Consent Form (GCF-1b)** - a 14-day acclimatization period with incremental light/temperature adjustment.  
     *   *(Rationale: MWC 0.001 acknowledges rudimentary phototropic responsiveness as minimal interest-holding capacity per "Vegetative Telos Doctrine").*

  **4. COMPLIANCE & ENFORCEMENT**  
     *   **4.1 Documentation:** All forms accessible via BCMWA Portal (HHI-Compliance Hub). Digital logs (NEST-Unit activity, FE-2 submissions) auto-synchronize.  
     *   **4.2 Reporting:** Suspected violations reported via **Ethical Continuum Hotline** or **Form ECH-9 (Household Moral Status Incident Report)**.  
     *   **4.3 Audits:** Random CME-Type 3 audits conducted by Regional Moral Weight Inspectors (RMWI). Penalties scale per MWC of affected entity (See: *Moral Harm Quantification Schedule*).  
     *   **4.4 Fern-Specific Exemption:** Failure to file BWIA-3/GCF-1b for ferns incurs only a "Notice of Moral Lapse" (NML-2) unless violation is willful/repeated.

  **5. DISPUTE RESOLUTION**  
  Conflicts arising from MWC interpretation or protocol application are adjudicated by the **Household Gradient Tribunal (HGT)**. Appeals may progress to the **Central Moral Weight Appeals Board (CMWAB)**. Initial filings require **Form HGT-1** and a non-refundable processing fee ($45; waived for entities with MWC <0.005).

  **ATTESTATION:**  
  Dr. Alistair Finch, Chair  
  Board for Continuous Moral Weight Allocation  

  ---
  **End of Memorandum**  
