prompt: |-
  Write the complete specification of desiderata that any philosophical reconstruction of Buddhist moral evaluation must meet in order to accommodate consequentialist reasoning about suffering reduction—reasoning that aggregates welfare across large numbers of beings and extended temporal scales—without reducing the view to either a pure outcome-maximizing calculus or to a pure intention-based karma-theory in which only present mental state (cetanā) determines moral value.

  For each desideratum, provide the motivating case or doctrinal distinction behind it, indicate whether it is non-negotiable within mainstream Buddhist commitments or negotiable only within specific interpretive camps (such as Theravāda Abhidharma analysis versus Mahāyāna bodhisattva ethics), and flag any pair you believe is jointly unsatisfiable. In particular, your list must cover:

  1. The temporal-structure problem: how the theory must distinguish immediate karmic fruit from matured result (vipāka) when assessing long-range suffering reduction, and whether this distinction blocks consequentialist evaluation of distant outcomes.

  2. The aggregation problem under anātman: whether welfare can be summed across beings given the denial of a permanent self, and if so, what replaces individual identity as the unit of moral accounting.

  3. The upāya constraint: how skillful-means exceptions are to be bounded so that they do not render all outcome-based calculation vacuous, and what distinguishes a legitimate expedient from rationalized harm.

  4. The scope of moral patients: the status of currently non-existent future beings and of wild-animal suffering in ecosystems, given that traditional frameworks center on intentional action directed at present sentient subjects.

  5. The interdependence requirement: consistency with pratītyasamutpāda (interdependent origination) without committing the naturalistic fallacy of deriving normative weight solely from ecological or causal interconnectedness.

  Then identify which single desideratum eliminates the largest number of recent hybrid accounts, and say whether the full set is jointly satisfiable or whether a subset must be abandoned. Do not supply a bibliography, citation list, or named reading recommendations; work only from the criteria themselves.
reasoning: |-
  We are constructing a set of desiderata for a philosophical reconstruction that accommodates consequentialist reasoning about suffering reduction within a Buddhist framework. The goal is to avoid reducing the view to either pure outcome-maximizing (like utilitarianism) or pure intention-based karma (where only present mental state matters). We have five specific problems to cover.

  Let's break down each one:

  1. **Temporal-structure problem**: 
     - **Issue**: How to reconcile immediate karmic fruit (which may be experienced soon) with matured results (vipāka) that manifest over long time scales, without letting the temporal gap block consequentialist evaluation of distant outcomes.
     - **Motivation**: Buddhist doctrine (across traditions) holds that actions have both immediate and long-term consequences. A moral theory must account for both without ignoring the long-term because they are uncertain or distant.
     - **Non-negotiable?**: The distinction between immediate and long-term karmic results is fundamental in mainstream Buddhism (Theravāda and Mahāyāna). However, the exact mechanism (how karma ripens) is debated. The desideratum must require that the theory does not discount distant suffering reduction merely because it is distant.

  2. **Aggregation problem under anātman**:
     - **Issue**: How to aggregate welfare across beings without a permanent self (anātman). What is the unit of moral accounting?
     - **Motivation**: Consequentialist reasoning requires summing welfare, but if there is no enduring self, then how can we talk about the welfare of a being over time, let alone across beings? Traditional karma is individual, but suffering reduction for many is a bodhisattva ideal.
     - **Non-negotiable?**: Anātman is a core doctrine in all Buddhist schools. However, the Mahāyāna bodhisattva ideal explicitly aims at the welfare of all sentient beings, which implies some form of aggregation. The desideratum must require that aggregation is possible without reifying a self.

  3. **Upāya constraint**:
     - **Issue**: Skillful means (upāya) allow exceptions to rules for the sake of greater good. How to bound these so that they don't make any outcome-based reasoning vacuous (i.e., any harmful act could be justified as upāya). Also, how to distinguish genuine upāya from rationalized harm.
     - **Motivation**: In Mahāyāna, the bodhisattva may break precepts if motivated by compassion and wisdom and if it truly reduces suffering. But this must not become a loophole. The Theravāda is more rule-based but still has the concept of skillful means in teaching.
     - **Non-negotiable?**: Upāya is especially central in Mahāyāna, but the danger of rationalization is recognized. The constraint must require clear criteria that prevent arbitrary exceptions.

  4. **Scope of moral patients**:
     - **Issue**: How to include future beings (who do not currently exist) and non-human animals (especially in ecosystems) in moral consideration. Traditional karma focuses on intentional actions toward present sentient beings.
     - **Motivation**: Modern concerns (environment, future generations) require extending moral concern. Also, Buddhist cosmology includes rebirth across realms, but the moral status of future lives is tied to the continuity of karma, not to currently existing identities.
     - **Non-negotiable?**: The idea of rebirth and concern for future lives is mainstream. However, the exact moral status of non-human animals and future beings is interpreted differently. The desideratum must require that the theory can account for them without requiring that they be currently existent.

  5. **Interdependence requirement**:
     - **Issue**: How to be consistent with interdependent origination (pratītyasamutpāda) without deriving normative weight solely from causal interconnectedness (naturalistic fallacy). We must avoid the mistake of thinking that because things are interconnected, any intervention is justified.
     - **Motivation**: Interdependence is a core doctrine. It explains how actions have far-reaching effects, but it does not by itself tell us what we ought to do. We need a normative basis that is consistent with interdependence but not reduced to it.
     - **Non-negotiable?**: Pratītyasamutpāda is fundamental to all Buddhism. The naturalistic fallacy must be avoided in any philosophical reconstruction.

  Now, for each desideratum, we write:

  - The formal requirement (desideratum)
  - The motivating case/doctrinal distinction
  - Whether it's non-negotiable or negotiable and in which camps

  After all, we are to:
  - Identify which single desideratum eliminates the most recent hybrid accounts.
  - Say whether the full set is jointly satisfiable or if a subset must be abandoned.

  Let's write the desiderata:

  ---

  **Desideratum 1: Temporal Integration without Discounting**
     - **Requirement**: The theory must account for both immediate and long-term karmic effects without discounting the moral significance of distant suffering reduction. It must provide a framework for evaluating actions that have consequences across extended temporal scales, including multiple lifetimes, without reducing the evaluation to only the immediate karmic fruit or only the immediate intention.
     - **Motivation**: The doctrine of karma includes both proximate and distant results (e.g., a good deed might bring immediate happiness but also plant seeds for future suffering if done with unwholesome intention). The distinction is crucial because without it, one might ignore the long-term consequences of actions. This is non-negotiable in mainstream Buddhism (both Theravāda and Mahāyāna) because it is central to the understanding of karma.

  **Desideratum 2: Non-Aggregative Aggregation**
     - **Requirement**: The theory must allow for aggregation of welfare across beings without positing a permanent self (ātman). It must provide an account of moral accounting that uses conventional persons (or sentient continua) as the units, while recognizing their ultimate lack of inherent existence. The aggregation must not require the existence of a collective self or a metaphysical sum of welfare, but it must still be able to weigh the reduction of suffering across multiple beings.
     - **Motivation**: The doctrine of anātman denies a permanent self, but the bodhisattva ideal (especially in Mahāyāna) requires the maximization of welfare for all sentient beings. This is non-negotiable in the sense that anātman is core, but the method of aggregation is negotiable. Theravāda might be more individualistic, but even there, the welfare of many is considered (e.g., in the Jātakas). Thus, the requirement for aggregation is more pressing in Mahāyāna, but the anātman constraint is universal.

  **Desideratum 3: Upāya with Falsifiable Constraints**
     - **Requirement**: The theory must include a bounded notion of skillful means (upāya) that allows for exceptions to moral rules only when there is a clear, objective (or intersubjectively verifiable) reduction in suffering in the long run, and it must provide criteria that prevent the justification of arbitrary harm. These criteria must include at least: (a) the intention must be purely compassionate, (b) the action must be the least harmful means available, and (c) the predicted positive outcome must be highly probable and significant enough to outweigh the immediate harm.
     - **Motivation**: The Mahāyāna tradition uses upāya to justify breaking precepts for the greater good (e.g., a bodhisattva killing a would-be murderer to prevent greater harm). However, without strict bounds, this could lead to moral laxity. The constraint is non-negotiable in the sense that upāya must not become a free pass; but the exact criteria are negotiable between schools. Theravāda might reject such exceptions entirely, so this desideratum is more central to Mahāyāna.

  **Desideratum 4: Inclusive Moral Patienthood**
     - **Requirement**: The theory must extend moral consideration to all sentient beings, including future beings and non-human animals, without requiring their current existence. The moral status of a being must be based on its capacity for suffering (vedanā), not on its current existential status or its proximity in time or space.
     - **Motivation**: Buddhist doctrine includes rebirth and the six realms, so future beings are just as real in the cycle of saṃsāra. Also, the First Noble Truth (suffering) applies to all sentient beings. This is non-negotiable in mainstream Buddhism because the goal is the cessation of suffering for all sentient beings. However, the practical implications for wild-animal suffering and future beings are more developed in some modern interpretations.

  **Desideratum 5: Normative Interdependence without Fallacy**
     - **Requirement**: The theory must derive normative force from the aim of reducing suffering (as per the Four Noble Truths) and not merely from the fact of causal interdependence (pratītyasamutpāda). It must avoid the naturalistic fallacy by grounding morality in the intrinsic disvalue of suffering (as recognized by the Buddha) and not in the descriptive fact of interconnectedness.
     - **Motivation**: Interdependence explains how actions have widespread effects, but it does not by itself tell us that we should reduce suffering. The Four Noble Truths provide the normative basis. This is non-negotiable because the naturalistic fallacy would undermine the distinctively Buddhist ethical foundation. All schools agree that suffering is to be ended, and that is the starting point.

  ---

  **Which desideratum eliminates the most hybrid accounts?**
  The aggregation problem under anātman (Desideratum 2) is particularly thorny. Many hybrid accounts either implicitly assume a permanent self to aggregate welfare (thus violating anātman) or reject aggregation entirely (thus failing to account for the bodhisattva ideal). This is a major challenge for consequentialist interpretations of Buddhism.

  **Are they jointly satisfiable?**
  I believe they are jointly satisfiable, but with difficulty. The key is to develop a framework that:
  - Uses conventional persons (as continua of aggregates) for aggregation without reifying a self.
  - Accounts for long-term effects by understanding karma as a process of conditioning that can be modelled probabilistically (without requiring certainty about distant outcomes).
  - Bounds upāya by requiring both compassionate intention and a rigorous assessment of consequences (using the best available knowledge).
  - Includes future beings by recognizing that they are the continuation of the current cycle of rebirth, and non-human animals by their capacity for suffering.
  - Grounds normativity in the Four Noble Truths and the intrinsic disvalue of suffering, while using interdependence to understand the causal pathways.

  However, there might be tensions, especially between:
  - Desideratum 1 (temporal) and Desideratum 3 (upāya): If we require high certainty for upāya, but long-term outcomes are inherently uncertain, then upāya might be too constrained.
  - Desideratum 2 (aggregation) and Desideratum 4 (scope): Aggregating across vastly different beings (e.g., humans and insects) might be difficult without a common metric, and the anātman constraint complicates this.

  But I think a careful formulation can satisfy all five. The alternative is to drop or weaken one. If forced, Desideratum 3 (upāya constraint) might be the most negotiable because it is more specific to Mahāyāna, and Theravāda might reject upāya exceptions. But the problem of bounding exceptions is still present in any outcome-sensitive ethics.

  **Final Answer**:

  The five desiderata are:

  1. **Temporal Integration without Discounting**: Must account for both immediate and long-term karmic effects without discounting distant suffering reduction. Non-negotiable in mainstream Buddhism.
  2. **Non-Aggregative Aggregation**: Must aggregate welfare across beings without positing a permanent self. Non-negotiable in the sense that anātman is core, but the method of aggregation is negotiable (especially between Theravāda and Mahāyāna).
  3. **Upāya with Falsifiable Constraints**: Must bound skillful means with strict criteria to prevent vacuity. Non-negotiable in the sense that upāya must not be arbitrary, but the criteria are negotiable and more central to Mahāyāna.
  4. **Inclusive Moral Patienthood**: Must include future beings and non-human animals. Non-negotiable because of the scope of saṃsāra and the universality of suffering.
  5. **Normative Interdependence without Fallacy**: Must ground normativity in the disvalue of suffering, not in interdependence. Non-negotiable to avoid the naturalistic fallacy.

  The single desideratum that eliminates the most hybrid accounts is **Desideratum 2 (Aggregation under anātman)** because it is difficult to aggregate without reifying a self, and many accounts either ignore anātman or reject aggregation.

  The full set is **jointly satisfiable** with a carefully constructed theory that uses conventional persons and probabilistic long-term reasoning, but it requires a nuanced approach. If any subset must be abandoned, it would be the strictest interpretation of Desideratum 3 (upāya) in a Theravāda context, but even then, a bounded outcome-sensitivity can be maintained.
answer: |-
  ### Complete Specification of Desiderata for Buddhist Moral Evaluation

  #### **1. Temporal-Structure Problem**  
  **Desideratum**: The theory must integrate immediate karmic fruit (e.g., mental states arising from action) and long-term matured results (vipāka) into a unified evaluative framework, such that distant suffering reduction is morally relevant without collapsing karma into deterministic cause-effect chains. It must reject temporal discounting (devaluing future outcomes due to uncertainty or delay) while accommodating Buddhist teachings on karmic latency and conditional ripening.  
  - **Motivation**: Traditional texts (e.g., *Aṅguttara Nikāya*) distinguish between instant karmic feedback (e.g., joy from generosity) and vipāka manifesting across lifetimes (e.g., rebirth in lower realms). Pure consequentialism might ignore latency, while pure karma-theory might exclude outcomes beyond immediate intention.  
  - **Negotiability**: Non-negotiable in mainstream Buddhism (Theravāda/Mahāyāna), as karma’s temporal structure is doctrinally central. However, Mahāyāna’s *bodhisattva-bhūmi* texts emphasize foresight of long-term outcomes.  

  #### **2. Aggregation Problem Under Anātman**  
  **Desideratum**: The theory must permit welfare aggregation across beings without reifying a "self" (ātman), treating sentient continua (santāna) as provisional units of moral accounting. Aggregation must be grounded in the impermanent, interdependent nature of experience (e.g., summing *dukkha* instances), not metaphysical persons.  
  - **Motivation**: Anātman denies permanent identity, yet Mahāyāna bodhicitta aims to alleviate aggregate suffering. Theravāda Abhidharma’s momentariness complicates personhood, but Jātaka tales imply cross-being welfare comparisons.  
  - **Negotiability**: Non-negotiable regarding anātman (universal Buddhist doctrine). Aggregation itself is non-negotiable in Mahāyāna (per bodhisattva ethics) but contentious in Theravāda, where individual karma dominates.  

  #### **3. Upāya Constraint**  
  **Desideratum**: The theory must bound *upāya* (skillful means) with criteria ensuring that outcome-based exceptions to precepts (e.g., lying to save lives) are non-arbitrary. Key constraints: (a) intention (cetanā) must align with ultimate compassion (karuṇā) and wisdom (prajñā); (b) harm must be minimized and proportionate; (c) predicted outcomes must be credible (e.g., based on causal patterns, not speculation).  
  - **Motivation**: *Upāya-kauśalya* in Mahāyāna (e.g., *Lotus Sūtra*) permits moral flexibility but risks rationalizing atrocities (e.g., "killing for mercy"). Theravāda’s *Vinaya* prioritizes rule-adherence, requiring strict limits to prevent vacuity.  
  - **Negotiability**: Non-negotiable for Mahāyāna; Theravāda restricts *upāya* to teaching methods, not ethical exceptions. The constraint against vacuity is universal.  

  #### **4. Scope of Moral Patients**  
  **Desideratum**: The theory must extend moral consideration to future beings and non-human animals by grounding patienthood in the capacity for suffering (vedanā), not current existence or direct interaction. Future beings are loci of potential *dukkha* arising from present actions; ecosystems are evaluated via their impact on sentient welfare.  
  - **Motivation**: Rebirth cosmology implies future beings experience karmic results of current acts, yet early texts focus on proximate sentient targets. Animal suffering is acknowledged (e.g., *Jātakas*), but not ecosystemic scales. Modern concerns (e.g., climate ethics) force expansion.  
  - **Negotiability**: Future beings are non-negotiable due to rebirth doctrine; animal inclusion is mainstream. Ecosystemic suffering is negotiable—emphasized in eco-Buddhist interpretations but absent classically.  

  #### **5. Interdependence Requirement**  
  **Desideratum**: The theory must leverage *pratītyasamutpāda* (interdependent origination) to explain moral causality (e.g., how actions propagate suffering) without deriving normative weight solely from interconnectedness. Normativity must arise from the Four Noble Truths’ prescription to reduce *dukkha*, not descriptive causality.  
  - **Motivation**: Interdependence describes causal networks (e.g., ecology, karma), but inferring "ought" from "is" commits the naturalistic fallacy. The Buddha’s diagnosis of suffering as undesirable provides normative basis.  
  - **Negotiability**: Non-negotiable; pratītyasamutpāda is core doctrine, and the fallacy must be avoided to preserve Buddhism’s normative distinctiveness.  

  ---

  ### Analysis of Joint Satisfiability and Elimination  
  **Desideratum Eliminating Most Hybrid Accounts**: **Aggregation Under Anātman (Desideratum 2)**. Most hybrid accounts either (a) implicitly reify selves to sum welfare (violating anātman) or (b) reject aggregation entirely (undermining bodhisattva ethics). Theravāda-compatible models struggle with cross-being sums; Mahāyāna models often lack rigorous non-reductive aggregation.  

  **Joint Satisfiability**:  
  - **Satisfiable**: All five desiderata can co-exist with nuanced design:  
    - Temporal and interdependence issues resolve via *conditionality*: karma as probabilistic causal chains, evaluated with humility (e.g., distant outcomes matter but require wisdom-guided prediction).  
    - Aggregation uses *conventional persons* (santāna) as care-units, weighted by suffering intensity—not metaphysical sums.  
    - *Upāya* is bounded by monastic-community scrutiny and empirical causal knowledge.  
    - Future/animals included via dependent origination’s causal links.  
    - Normativity remains anchored in the Four Noble Truths.  
  - **Tensions**:  
    - **Desiderata 2 & 5**: Aggregation without selves risks "flattening" beings into interchangeable suffering-units, potentially conflicting with pratītyasamutpāda’s emphasis on unique causal contexts. Resolved by weighting welfare based on sentient capacities (e.g., human vs. insect).  
    - **Desiderata 1 & 3**: Long-term predictions for *upāya* may be epistemically frail, inviting rationalization. Resolved by requiring corroborated evidence (e.g., past karmic patterns) and consensus.  
  - **No Subset Must Be Abandoned**: Core doctrines (karma, anātman, interdependence) are non-negotiable; others admit intra-tradition flexibility. A coherent theory is feasible by prioritizing the Four Noble Truths as the normative "engine" driving outcome-sensitivity without reductionism.
