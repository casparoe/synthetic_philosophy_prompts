prompt: |-
  You are a professional philosopher with expertise in both analytic social epistemology and Foucault's historical ontology. Before answering, take a moment to brainstorm the specific commitments and rhetorical habits of the audience described below.

  Next Thursday I present a seminar paper to a philosophy-of-science group that is mostly analytic: several social epistemologists, two hard naturalists who treat Foucault as obscure anti-science rhetoric, and one sociologist of science who reads Discipline and Punish sympathetically but is wary of anachronism. My thesis is that Foucault's "examination" should be interpreted not as a causal claim that institutions manufacture beliefs, but as an account of epistemic framing: the examination establishes the grammatical conditions under which a statement can count as true about a subject, thereby constituting the subject as an object of knowledge in ways that make certain errors structurally invisible. I apply this to modern algorithmic risk assessment—predictive policing scores and audit algorithms—arguing that these tools do not merely measure pre-existing risk but migrate the examination into code, constituting subjects as risk-objects and preempting defenses that do not fit the scoring framework.

  Prepare my Q&A defense sheet. List the eight or so objections I will actually get from this audience, ordered by the damage they could do, each phrased in the vocabulary and tone these particular listeners would use (e.g., "Isn't this just a redescription of statistical bias?" "Where is the causal mechanism?" "Doesn't this collapse into relativism about risk?"). For each objection, give me a concise reply suitable for a two-minute exchange, and flag the weakest point in that reply—where I am conceding ground I should not, or where the argument is soft. Identify the one objection I am hoping nobody asks, and explain why it is dangerous and how to deflect without sounding evasive. In your response, state explicitly how confident you are in each reply, and single out the point you are least sure of. End with a one-sentence summary of the defense strategy as the final line.

  Verdict: ...
