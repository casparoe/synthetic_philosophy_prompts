prompt: |-
  I'm a journalist running an idea-lunch for my newsroom—smart editors, zero neuroscience. Next session I'm walking them through predicitive processing and the free-energy priciple, but I don't want the usual brain-is-guessing summary. Plan the teaching arc: the dependency order so each idea carries the next; one concrete example—not the dark room, please—like a tidal gauge that adjusts its own exposure to minimize surprise about storm surges, with what properties it needs and the teleological trap it avoids; the misconceptions in the order they'll appear ('free energy is literal heat,' 'predictions are conscious guesses,' 'error signals are bad news') and where in the sequence to kill each; one check question that shows they understand the framework, not just the buzzwords; and what I should openly refuse to put on the board (the variational equation, probably). Format exactly: Dependency order (~120 words), The carrying example (~100 words), Misconception map (~130 words), The check (~50 words), What to skip (~60 words).
reasoning: |-
  Okay, the user is a journalist preparing a session on predictive processing and the free-energy principle for editors without neuroscience backgrounds. The challenge is to explain these complex ideas clearly without oversimplifying to "the brain is guessing." 

  First, I need to structure a logical teaching arc. Starting with perception as active construction makes sense because it's relatable—everyone knows optical illusions. Then layering prediction as biological efficiency builds naturally. Introducing surprise as the engine drives home why brains evolved this way. Finally, free energy as the mathematical glue ties it together without equations. 

  For the tidal gauge example, avoiding the overused dark room trope is key. A self-adjusting storm surge sensor works well—it's concrete, shows autonomy, and illustrates surprise minimization without anthropomorphism. Highlighting its properties (parameter tuning, resilience focus) subtly reinforces core concepts while dodging teleology. 

  The misconception mapping feels crucial. Editors might confuse "free energy" with thermodynamics or think "prediction" implies crystal balls. Sequencing corrections within the flow—e.g., killing "literal heat" when defining free energy—prevents buildup of faulty mental models. 

  The check question must test framework grasp, not vocabulary. Asking them to redesign the gauge for a new constraint (like fog) reveals if they get the optimization logic. 

  Refusals are tactical. Blackboarding equations would lose them, and resisting "prediction" as foresight maintains precision. The teleology caveat is non-negotiable—it's where pop-science explanations go wrong. 

  User's depth of prep is impressive. They've anticipated pitfalls (dark room, equations) and want authentic understanding, not soundbites. This demands balancing accessibility with rigor—hence the emphasis on sequence and killing misconceptions methodically. The tidal gauge metaphor likely resonates with their journalistic affinity for concrete systems. 

  Notably, they're curating not just content but cognitive load. The strict word limits suggest awareness of attention spans. My response mirrors that discipline.
answer: |-
  ### Dependency Order (~120 words)  
  Start with **Perception as Construction**: Sensory inputs are ambiguous; perception isn't passive reception but active interpretation. Build to **Prediction as Default**: Brains constantly generate top-down "best guesses" of sensory causes. Introduce **Prediction Error**: Mismatches between guess and input drive learning (not "mistakes"). Reveal **Surprise as the Enemy**: Biological systems must avoid unexpected states to survive. Culminate in **Free-Energy Minimization**: A mathematical framework for reducing surprise by either changing predictions (perception/cognition) or actions (behavior). Stress that "free energy" is *informational* surprise, not thermodynamic.

  ---

  ### The Carrying Example (~100 words)  
  **The Storm-Surge Gauge**: A tidal sensor that *autonomously recalibrates its sensitivity* when storm surges hit.  
  - **Properties**: It has (1) adjustable parameters (e.g., measurement range), (2) a "belief" about normal tides (prior model), and (3) detects sensor-input "error" during surges.  
  - **Action**: To minimize surprise (catastrophic misreading), it *either* corrects its input (e.g., dampening wave noise) *or* updates its model (e.g., broadening expected range).  
  **Teleology Trap Avoided**: It doesn’t "know" or "seek" storms. It mechanically tunes itself to resist *surprise*—maintaining resilience without goals.  

  ---

  ### Misconception Map (~130 words)  
  1. **"Free energy = literal energy/heat"** → *Kill immediately* when defining FEP: Clarify it’s a *statistical measure* of surprise.  
  2. **"Predictions = conscious guesses"** → *Crush during Prediction as Default*: Emphasize subconscious, perpetual micro-predictions (e.g., balancing).  
  3. **"Prediction errors are bad"** → *Correct at Prediction Error*: Frame errors as *essential learning signals*, not failures.  
  4. **"Brains want no prediction errors"** → *Preempt with the Gauge*: Show active error *engagement* (e.g., gauge adjusts to *manage* surges, not eliminate them).  
  5. **"This is just 'brain as computer'"** → *Undermine at Conclusion*: Contrast with biological, continuous optimization without a "program."  

  ---

  ### The Check (~50 words)  
  **Question**: *"If our tidal gauge faced erratic fog (obscuring inputs), how would predictive processing explain its response?"*  
  **Target Insight**: They should identify *active inference*: Gauge acts (e.g., switching to sonar) to *alter inputs* or updates its model (e.g., "fog means surges are likelier"). Must mention minimizing surprise via action *or* belief update.  

  ---

  ### What to Skip (~60 words)  
  **Refuse to put on the board**:  
  - The variational free energy equation.  
  - Laplace’s demon or Bayesian math.  
  - "Markov blankets" (too jargony).  
  - Any neural anatomy (e.g., "cortical hierarchies").  
  **Openly dismiss**: Requests to analogize PP to "filing cabinets," "AI algorithms," or "Freudian unconscious." Stress: *This is a biological imperative framework, not a metaphor.*  

  ---  
  **Why this works**: The gauge example avoids anthropomorphism while demonstrating autonomy, parameter optimization, and dual routes (action/model update) for surprise minimization. Sequencing misconceptions *as they naturally arise* prevents entrenchment. The check question forces application beyond definitions. Skipping math keeps it conceptual.
