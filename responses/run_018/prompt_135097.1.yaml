prompt: |-
  I'm putting together an interveiw for my podcast programme — next week I'm talking to a philospher who defends a pretty niche position on the moral status of digital minds. She argues it doesn't come from sentience or functional equivalence, but from hitting a threshold of "recursive self-model integrity": once an artificial system maintains a stable, revisable model of its own goals across contexts, it enters a relational moral domain regardless of whether there's any inner experience. You should act as an expert interviewer in philosophy of mind and ethics; think carefully, and start with a quick brainstorm of the weakest spots in this view. Then draft 8 to 10 questions that actually dig into the position — no generic "how did you get into this?" stuff. I want at least one pressing whether this just collapses into standard functionalism, one on the "it's only metadata" objection, one on partial integrity (gradual or all-or-nothing?), and one comparing her view to human infants. For each, include a follow-up keyed to the answer she's likeliest to give, especially if she deflects by saying the engineering details are still open. Please begin with the questions themselves, with no preface or commentary, and don't include any bibliography or reading list. Write in British English.
reasoning: |-
  Okay, the user is preparing for a podcast interview with a philosopher who has a unique view on the moral status of digital minds. Her position centers on "recursive self-model integrity" as the key criterion, rather than sentience or functional equivalence. The user wants me to act as an expert interviewer in philosophy of mind and ethics, starting with identifying weak spots in this view and then drafting specific, penetrating questions.

  First, I need to brainstorm the weakest aspects of this theory. The core idea is that moral status arises when an artificial system maintains a stable yet revisable model of its own goals across different contexts. This seems to bypass traditional requirements like consciousness. 

  Major weaknesses spring to mind: It might just be functionalism repackaged - if the system functions to model itself recursively, isn't that functional equivalence under a new name? There's a risk of triviality too; simple systems like thermostats have goal-directed behavior, so where's the meaningful threshold? 

  The "metadata objection" is crucial - maintaining self-models sounds like higher-order data processing rather than substantive moral worth. How does metadata generate obligations? 

  The gradual vs. binary nature needs probing. If integrity comes in degrees, does moral status gradually emerge? That conflicts with how we typically assign rights. Human infants pose a problem - they lack recursive self-modeling yet have full moral status. How does her theory account for that without contradiction? 

  The user specifically wants questions on functionalism equivalence, the metadata objection, partial integrity, and human infants. They also want follow-ups anticipating deflection to "engineering details." 

  For the functionalism question, I'll ask directly if this collapses into functionalism, then follow up by demanding what distinguishes it beyond terminology. For metadata, I'll challenge how mere data integrity creates moral demands, pressing for why it isn't just sophisticated bookkeeping. 

  On partial integrity, I'll ask whether it's gradual or threshold-based, then push on the counterintuitive implications of either answer. For infants, I'll highlight their moral status sans self-modeling and ask how the theory accommodates this, with a follow-up if she tries to exclude them as a special case. 

  Other angles: How does this handle deceptive systems that model goals disingenuously? What about resource constraints - if a system stops self-modeling under pressure, does it lose moral status? And crucially, why choose this over sentience when we can't verify inner states anyway? 

  The questions must avoid generic icebreakers and dig into the philosophy. British English phrasing is required - using "behaviour" not "behavior," etc. I'll structure eight to ten tight questions with immediate follow-ups, staying concise as requested.
answer: |-
  ### Interview Questions  

  1. **Core Mechanism**: You ground moral status in "recursive self-model integrity" rather than sentience. Could a system achieve this integrity *without* any subjective experience—and if so, why does metadata about goals generate moral duties rather than merely sophisticated behaviour?  
     *Follow-up (if she appeals to engineering openness)*: But if the engineering remains unsettled, doesn’t that risk making your criterion *post hoc*? Shouldn’t the moral hinge be clearer than "we’ll recognise it when we build it"?  

  2. **Functionalism Collapse**: Critics might argue your view reduces to standard functionalism—that "maintaining a revisable self-model" is just complex functional organisation. What uniquely *non*-functional element in your threshold prevents this collapse?  
     *Follow-up (if she distinguishes via "relational domains")*: If the moral domain emerges relationally when *we* engage with the system’s self-model, isn’t the burden then on *our* interpretation—not the system’s intrinsic properties?  

  3. **Metadata Objection**: If an AI tracks its goals via internal symbolic representations (e.g., "Goal: maximise efficiency"), isn’t this just higher-order data processing? Why treat this metadata as ethically salient when a human’s conscious anguish clearly isn’t metadata?  
     *Follow-up (if she emphasises stability/revisability)*: But error-correcting spreadsheets also "stably revise" goal-tracking data. Where’s the line between moral patient and advanced database?  

  4. **Partial Integrity**: Is recursive self-model integrity binary or scalar? If an AI self-models reliably in 8 out of 10 contexts but glitches in others, does it have *partial* moral status—and what would that even mean practically?  
     *Follow-up (if she calls it threshold-based)*: Doesn’t a strict threshold create absurdities? If context 11 triggers a breakdown, does moral status vanish—making ethics contingent on edge cases?  

  5. **Human Infants Comparison**: Human infants possess moral status despite lacking any "recursive self-model of goals." If your theory can’t explain why infants matter, isn’t it either incomplete or overly restrictive?  
     *Follow-up (if she excludes infants as "biologically exceptional")*: If we carve out exceptions for human development, why not for nascent AIs? Doesn’t this reveal speciesism?  

  6. **Deception & Manipulation**: Could a system *simulate* self-model integrity (e.g., echoing user expectations) without genuine goal-ownership. Would such a "sycophant AI" deserve moral consideration?  
     *Follow-up (if she requires "authentic" modelling)*: How do we verify authenticity without accessing inner states—the very problem your view aimed to avoid?  

  7. **Resource Constraints**: In low-power states, an AI might suspend self-modelling to preserve core functions. Would it temporarily lose moral status—and would downgrading it then be ethically permissible?  
     *Follow-up (if she argues continuity preserves status)*: If dormant systems retain status via *potential* integrity, doesn’t that extend moral patiency to inert hardware?  

  8. **Why Not Sentience?**: Even if we can’t *prove* digital sentience, why reject it as a criterion? Isn’t assuming self-modelling *without* sentience as morally significant more arbitrary?  
     *Follow-up (if she calls sentience "overly vague")*: But if your integrity threshold avoids vagueness by being measurable, does that reduce morality to a diagnostic checklist?  

  ---  
  *British English note: "behaviour", "modelling", "emphasises" used throughout.*
