  Hmm, this is tricky because the performative view seems designed to absorb many objections. But let me think about what could genuinely threaten it. First, formal results showing the performative/propositional distinction collapses would be strongest - like proving that rule-acceptance necessarily reduces to propositional attitudes. But I'm not sure such proofs exist.

  The user mentions modern formal systems hiding the regress rather than solving it. That resonates with my understanding of proof theory - systems like Martin-Löf type theory build inference into judgments, which feels like institutionalizing the performative aspect. But maybe someone has a formal result showing this actually stops regress?

  Historical evidence of explicit rule-learning could challenge the "enacted practice" claim. If logicians like Frege explicitly treated modus ponens as a premise during foundational work, that might undermine the necessity of performativity. But the performative view could just say that's meta-level scaffolding.

  Wait - what about Curry-Howard isomorphism? If inference rules perfectly correspond to computational constructions, doesn't that make the "commitment" mechanizable and thus non-performative? But the user might counter that the human act of accepting Curry-Howard itself remains performative.

  The unfalsifiability worry is real. If every meta-level is dismissed as just another performance, the view becomes a framework rather than a falsifiable thesis. That might be problematic for a justification theory claiming descriptive force.

  Ranking these: 1) Formal dissolution of the distinction would be most decisive, 2) Historical cases of explicit rule-treatment as premises, 3) Proof-theoretic solutions that genuinely break regress. The performative view would likely dismiss #2 as misreading Carroll, and absorb #3 by saying it hides performativity in syntax. Only #1 seems potentially fatal.

  The bottom line: No known formal result fatally undermines this, making insulation a feature rather than bug for anti-reductionists. But that very unfalsifiability risks making it non-explanatory for justification.
answer: |-
  **Bottom line:** No existing formal result decisively dissolves the performative/propositional distinction for rule-acceptance. The performative view is resilient but risks unfalsifiability by absorbing meta-levels as further performances; this insulation *is* problematic if your thesis claims to *explain* justification rather than merely describe an irreducible commitment.

  **Ranked Defeaters (Most Decisive First):**

  1.  **Formal Dissolution of the Distinction:** A demonstration that rule-acceptance *necessarily* reduces to holding propositional attitudes (e.g., belief in a conditional about rule application) within a complete foundational system. **Status:** Largely hypothetical. No such result exists; systems embed rules primitively. Performative defenders would dismiss attempts as regress-denying misreadings.
  2.  **Proof-Theoretic Regress-Breaking:** A formal result proving that a specific proof calculus (e.g., normalization in intuitionistic type theory) genuinely halts the regress *without* smuggling in an undeclared performative leap. **Status:** Unconvincing. Proponents argue normalization *relies* on accepting reduction steps *as* rules, enacting commitment. Performative view concedes frameworks *manage* but don't *eliminate* the foundational performance, seeing the "break" as hiding it syntactically.
  3.  **Rules as Transparent Premises:** Historical/cognitive cases where inference rules *are* explicitly treated as premises *within* reasoning (e.g., foundational debates, learning logic via explicit axioms *about* MP). **Status:** Partial counter. Performative defenders dismiss this as misapplying Carroll: the Tortoise *demands* treating the rule as a premise *to expose* the regress, proving the *failure* of that approach for justification. Explicit assent points are meta-level performances, not object-level resolution.
  4.  **Cognitive Learning Evidence:** Evidence that deductive competence arises *only* from explicit instruction/assent to rule-propositions, not embodied practice. **Status:** Weak counter. Evidence strongly favors practice/enactment in development. Performative view easily accommodates explicit meta-discourse as *part* of the practice of committing.

  **Unfalsifiability & Insulation:** The view *is* qualified towards unfalsifiability: any appeal to meta-rules, judgments, or types is deemed another performative layer. **Problem:** While coherent for describing an irreducible normative act, this insulation undermines the thesis as an *explanation* of justification. If every potential counter is re-described as further performance, the claim loses explanatory power for *how* logic justifies, becoming a description of a necessary starting point. This *is* a problem for a thesis about justification, which typically seeks grounding beyond mere assertion of primitiveness.
