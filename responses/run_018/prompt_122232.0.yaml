     Node4: In the deafness case, does selecting against deafness send a harmful message? (A: Yes, B: No, C: It might, but it's not the main issue)

     Then we assign the leaves as follows:

     - Leaf PB: Node1 = A, Node2 = A, Node3 = B, Node4 = C
       - Most awkward commitment: Must support generating many embryos even for small benefits, which might be costly and impractical.

     - Leaf IND (Impersonal no-difference): Node1 = A or B, Node2 = A, Node3 = B, Node4 = C.
       - But wait, IND is specifically Node3=B. If Node1=A and Node2=A, then it's also PB. So we can have:
           IND+PB: Node1=A, Node2=A, Node3=B, Node4=C
           IND without PB: Node1=B, Node2=A, Node3=B, Node4=C -> weak PB or "Selection without expansion"

     - Leaf Satisficing (avoid harm): Node1=C, Node2=B, Node3= any, Node4= any except A (because if they choose A, it might be mixed with DR)
       - We'll have two satisficing leaves:
           Satisficing1: Node1=C, Node2=B, Node4=B or C
           Satisficing2: Node1=C, Node2=C, Node4=B or C

     - Leaf Negative-only: Node1=B, Node2=B, Node3=A, Node4=C
       - because they think the non-selected child is harmed (Node3=A) -> this is the harm-based view.

     - Leaf Parental discretion: Node1=B, Node2=C, Node3= any, Node4=C
       - because they say no expansion obligation, no reason to select for small advantage, and no message concern.

     - Leaf Disability-rights: Node4=A, and Node1=B or C, Node2=C, Node3= any
       - because they object based on message.

     - Leaf Unused combination: 
          Node1=A, Node2=B or C -> Unnamed (inconsistent)
          Node1=C, Node2=A -> Unnamed (inconsistent)
          Node1=B, Node2=A, Node4=A -> Unnamed (selection for best and expansion not needed but also disability-rights? -> might be tension)

     Given the above, we can have the following 8 leaves:

     1. PB: Node1=A, Node2=A, Node3=B, Node4=C
     2. Weak PB (selection for best without expansion): Node1=B, Node2=A, Node3=B, Node4=C
     3. Satisficing avoid harm: Node1=C, Node2=B, Node4=C
     4. Satisficing no selection: Node1=C, Node2=C, Node4=C
     5. Negative-only: Node1=B, Node2=B, Node3=A, Node4=C
     6. Parental discretion: Node1=B, Node2=C, Node4=C
     7. Disability-rights: Node4=A, Node2=C ( and Node1=B or C)
     8. IND foundation: Node3=B and not in PB or weak PB? -> we already have Node3=B in PB and weak PB.

     We see that IND is embedded in PB and weak PB by Node3=B.

     For the disability-rights leaf, we require Node4=A and Node2=C (no reason to select for small advantage) and Node1 can be B or C.

     For the late-onset case: 
        - PB would say select against the late-onset condition even if the parent lives with it, because it's for the best.
        - Satisficing might say only if it's serious enough to make life not worth living.
        - Negative-only would say select against if it's a serious harm.
        - Parental discretion would say it's up to the parents.
        - Disability-rights might object to selecting against if it sends a harmful message.

     For the deafness case, we have Node4.

     Unoccupied combinations: 
        - Node1=A and Node2=B or C: why? Because if you have an obligation to expand to get the best, you must also think there is a reason to select for small advantages (Node2=A). So this combination is incoherent.
        - Node1=C and Node2=A: incoherent because satisficing doesn't require selecting the best, only good enough.

     The tree cannot separate between satisficing and parental discretion in some cases. For example, if Node1=B, Node2=C, Node4=C -> we assigned to parental discretion, but it could be satisficing that happens to have no expansion obligation and no small selection. But satisficing is Node1=C. So they are different.

     The branch question least confident about is Node3 (harm to non-selected child). Some views may not have a well-formed thought on this, and it might not be doing enough work. An argument or case that would lead to redraw: if in practice, trainees don't have a stable intuition on Node3, then it might not be pulling its weight. A better node might be on the permissibility of edit vs select.

