prompt: |-
  hey, I'm in a philosphy of mind seminar and we're arguing about whether emotions are judgments like Nussbaum thinks, perceptions of bodily states in the James-Lange vein, or just raw qualia/feelings. Before I commit to a camp I want to build the full checklist — what does a theory of emotion actually have to get right? Write me the desiderata: every real requirement (the phenomena it must explain, cases it can't botch, distinctions it has to preserve — like emotion vs mood vs reflex, or feeling anxious vs judging danger), plus which neuroscience or cross-cultural results it can't violate. For each, say why it's required and flag whether it's genuinely non-negotiable or just a camp prejudice (cognitivists want intentionality always; feeling-theorists want non-conceptual access). I specifically want you to check whether some subset is jointly unsatisfiable — for instance demanding that emotions are always about something intentional AND that they can occur without any conceptual framing. Also include the weird cases: grief for a fictional character you know isn't real, or a lingering bodily dread after you've intellectually corrected the belief that caused it. Then briefly score judgment-theory, perception-theory, and pure-feeling theory against the list, and tell me which single requirement eliminates the most candidates. Don't just rank them — I want the criteria.

  End with a table: columns Requirement, Motivating Case/Consideration, Negotiable (Yes/No), Judgment View, Perception View, Feeling View — with brief scores like Pass/Partial/Fail. After the table, give me a JSON object with exactly these keys: "unsatisfiable_pair" (string describing the conflict), "knockout_requirement" (string naming the one that kills the most theories), and "best_fit_view" (string). No bibliography or reading list please, I don't have access to look stuff up right now.
reasoning: |-
  Okay, the user is in a philosophy of mind seminar debating theories of emotion—Nussbaum's judgment theory versus James-Lange's perception of bodily states versus raw qualia. They need a structured checklist of desiderata for evaluating these theories, including must-explain phenomena, critical distinctions, empirical constraints, and edge cases. 

  First, I need to map the core requirements. The user emphasized several layers: phenomena (like intentionality vs. non-conceptual access), conceptual distinctions (emotion vs. mood), empirical guardrails (neuroscience on embodied cognition), and weird cases (grief for fiction). Crucially, they want to know if any requirements conflict—say, intentionality without conceptual framing—and which single criterion is most disqualifying. 

  Breaking it down: The obvious starting points are Intentionality (emotions are about something) and Phenomenal Quality (their raw feel). But these might clash if a theory demands both inherent intentionality and pre-conceptual existence. Then there's Bodily Involvement—James-Lange focuses here, but phantom limb emotions challenge pure bodily dependence. Valence is non-negotiable (all emotions feel positive/negative), while Differentiation is trickier (can pure feelings distinguish shame from guilt without cognition?). 

  For distinctions: Emotion-Mood boundaries are vital (moods lack specific objects), and Emotion-Reflex splits (startle reflexes aren't emotions). Cross-cultural consistency matters too—if basic emotions are universal, feeling-only theories struggle with cultural construction. 

  Weird cases are the stress test: Grief for fiction violates judgment theory (no real object), while lingering dread after cognitive correction challenges perception theories (body outlives belief). Both highlight gaps. 

  Neuroscience constraints include LeDoux's fear pathways (dual-process: fast body, slow cognition) and Damasio's somatic markers (body guides decisions). Cross-cultural work like Ekman's basic emotions supports universality but complicates social construction. 

  Now, assessing theories: Judgment theory aces Intentionality but flunks Bodily Dependence and weird cases like fiction grief. Perception theory handles body links but stumbles on lingering dread. Feeling theory captures raw qualia but crashes into Intentionality and Differentiation. 

  The knockout requirement? Intentionality—it's non-negotiable and sinks feeling theory while pressuring perception theory. But the biggest conflict is Intentionality + Non-Conceptual Access: Can emotions be about things without cognitive framing? If yes, judgment theory dies; if no, perception/feeling theories struggle. 

  Finally, the table and JSON: Unsatisfiable pair is "Intentionality vs. Non-Conceptual Access," knockout is "Intentionality," best fit is a hybrid—maybe perception theory with weak intentionality. User needs this crisp, no fluff.
answer: |-
  Here's the comprehensive checklist for evaluating emotion theories, followed by the analysis and table:

  ### Core Desiderata for a Theory of Emotion
  1.  **Intentionality/Aboutness**  
      *   **Why Required:** Emotions feel directed at objects/states of affairs (e.g., fear *of* the bear).  
      *   **Motivating Cases:** Anger at injustice, love for a person, aesthetic awe.  
      *   **Negotiable?** **No.** Core phenomenological feature.  
      *   *Camp Prejudice?* Cognitivists prioritize this inherently.

  2.  **Phenomenal Quality (Qualia)**  
      *   **Why Required:** Emotions feel a specific, subjective way ("what it's like").  
      *   **Motivating Cases:** Raw panic vs. serene joy; the visceral difference between shame and guilt.  
      *   **Negotiable?** **No.** Definitive experiential aspect.  
      *   *Camp Prejudice?* Feeling-theorists prioritize this above all else.

  3.  **Bodily Involvement/Expression**  
      *   **Why Required:** Emotions are strongly correlated with physiological changes (heart rate, hormones, facial expressions, posture).  
      *   **Motivating Cases:** Sweaty palms in fear, slumped posture in sadness, adrenaline rush in anger. James-Lange central tenet.  
      *   **Negotiable?** **No.** Overwhelming empirical evidence (neuroscience, physiology).  
      *   *Camp Prejudice?* Perception-theorists make this constitutive.

  4.  **Valence (Positive/Negative)**  
      *   **Why Required:** Emotions are fundamentally experienced as pleasant/unpleasant, approach/avoid.  
      *   **Motivating Cases:** Joy feels good, disgust feels bad. Core to motivation.  
      *   **Negotiable?** **No.** Essential characteristic differentiating emotions from neutral states.  
      *   *Camp Prejudice?* All camps generally accept this, but feeling-theorists might see it as most basic.

  5.  **Motivational Force**  
      *   **Why Required:** Emotions impel us towards action (or inaction).  
      *   **Motivating Cases:** Fear prompts fleeing, anger prompts confronting, grief prompts withdrawal.  
      *   **Negotiable?** **No.** Functional role in survival/behavior is fundamental.  
      *   *Camp Prejudice?* Judgment theorists link it to appraisal of goals; perception/feeling link it to bodily readiness.

  6.  **Cognitive Penetrability/Relationship to Belief/Judgment**  
      *   **Why Required:** Beliefs/judgments clearly influence emotions (e.g., learning the "bear" is stuffed reduces fear).  
      *   **Motivating Cases:** Relief after realizing danger is past; anger dissipating upon hearing an apology.  
      *   **Negotiable?** **No.** Ubiquitous everyday experience.  
      *   *Camp Prejudice?* Judgment theorists make judgment constitutive; others see it as causal/modulatory.

  7.  **Non-Constitutive Cognitive Access**  
      *   **Why Required:** Emotions can arise without conscious, propositional judgment (fast, "gut" reactions; emotions in infants/animals).  
      *   **Motivating Cases:** Immediate jump-scare fear; animal aggression; pre-verbal infant distress.  
      *   **Negotiable?** **No.** Empirical reality (low-level processing, development).  
      *   *Camp Prejudice?* Perception/Feeling theorists use this to counter Judgment theories.

  8.  **Differentiation**  
      *   **Why Required:** We experience distinct emotions (fear vs. anger vs. joy) with unique profiles.  
      *   **Motivating Cases:** Knowing you feel ashamed, not just generally bad; the specific blend of emotions in complex situations.  
      *   **Negotiable?** **No.** Phenomenological and functional necessity.  
      *   *Camp Prejudice?* Judgment theorists tie it to distinct appraisals; Feeling theorists to distinct qualia; Perception to distinct bodily patterns.

  9.  **Duration & Dynamism**  
      *   **Why Required:** Emotions have characteristic time-courses (sudden onset, potential fading or intensification) and can transform (anger into sadness).  
      *   **Motivating Cases:** Sudden shock giving way to grief; simmering resentment.  
      *   **Negotiable?** **Partial.** Core feature, but precise dynamics might be flexible.  
      *   *Camp Prejudice?* None dominant.

  10. **Distinction: Emotion vs. Mood**  
      *   **Why Required:** Moods (e.g., irritability, melancholy) lack specific intentional objects, are more diffuse and longer-lasting.  
      *   **Motivating Cases:** Feeling generally anxious (mood) vs. being anxious *about* an upcoming exam (emotion).  
      *   **Negotiable?** **No.** Clinically and phenomenologically crucial distinction.  
      *   *Camp Prejudice?* Judgment theorists need this to protect intentionality.

  11. **Distinction: Emotion vs. Reflex/Startle**  
      *   **Why Required:** Pure reflexes (knee-jerk, eye-blink) lack intentionality, valence (beyond aversion), and the complex phenomenal quality of emotion.  
      *   **Motivating Cases:** Automatic flinch from a loud noise (reflex) vs. sustained fear after realizing the noise was a gunshot (emotion).  
      *   **Negotiable?** **No.** Conceptual clarity.  
      *   *Camp Prejudice?* Feeling/Perception theories need to avoid over-inclusion.

  12. **"Weird" Case: Grief for Fiction**  
      *   **Why Required:** Challenges theories requiring a *real* or *believed-real* intentional object.  
      *   **Motivating Cases:** Crying at the death of a beloved fictional character despite knowing they aren't real.  
      *   **Negotiable?** **No.** Common, robust phenomenon demanding explanation.  
      *   *Camp Prejudice?* Judgment theories struggle mightily here.

  13. **"Weird" Case: Lingering Bodily Dread**  
      *   **Why Required:** Challenges theories where emotion *is* the perception of bodily state *or* requires a constitutive judgment.  
      *   **Motivating Cases:** Intellectually knowing the plane is safe after turbulence stops, but still feeling intense bodily fear/anxiety.  
      *   **Negotiable?** **No.** Common experience highlighting dissociation potential.  
      *   *Camp Prejudice?* Perception theories struggle with dissociation; Judgment theories with persistence despite changed belief.

  14. **Neuroscience Constraint: Dual Pathways (e.g., LeDoux)**  
      *   **Why Required:** Evidence for a fast, subcortical (e.g., amygdala) "threat" pathway independent of slower cortical appraisal.  
      *   **Motivating Cases:** Subliminal fear responses; faster reaction to threatening stimuli.  
      *   **Negotiable?** **No.** Well-established empirical finding.  
      *   *Camp Prejudice?* Counters pure Judgment theories; Supports Perception/Feeling for fast reactions.

  15. **Neuroscience Constraint: Somatic Markers (Damasio)**  
      *   **Why Required:** Evidence that bodily feedback (real or simulated) is integral to emotional experience and decision-making.  
      *   **Motivating Cases:** Impaired decision-making in patients with disrupted body feedback (e.g., vmPFC damage).  
      *   **Negotiable?** **No.** Strong empirical support for bodily role.  
      *   *Camp Prejudice?* Central to Perception theories; Challenges Feeling/Judgment if they downplay body.

  16. **Cross-Cultural Constraint: Basic Emotion Universality (Ekman-esque)**  
      *   **Why Required:** Evidence for cross-cultural recognition/production of some facial expressions & reported experiences for core emotions (fear, anger, disgust, sadness, joy, surprise).  
      *   **Motivating Cases:** Similar facial expressions in isolated cultures; similar physiological patterns for basic emotions.  
      *   **Negotiable?** **Partial.** Evidence is strong but debated (constructionists); Applies most clearly to "basic" emotions.  
      *   *Camp Prejudice?* Supports Feeling/Perception for biological basis; Challenges strong social construction views.

  17. **Cross-Cultural Constraint: Cultural Variation/Construction**  
      *   **Why Required:** Evidence for culturally specific emotions (e.g., *liget*, *awumbuk*), display rules, and variations in appraisal dimensions.  
      *   **Motivating Cases:** Different emotional responses to identical situations across cultures; culturally unique emotion concepts.  
      *   **Negotiable?** **No.** Overwhelming anthropological evidence.  
      *   *Camp Prejudice?* Challenges strict biological universality (favored by some Feeling/Perception); Judgment theories accommodate via cultural appraisals.

  **Potentially Unsatisfiable Pair:** **Intentionality (Always About Something - Non-Negotiable) vs. Non-Constitutive Cognitive Access (Can Occur Without Conceptual Framing - Non-Negotiable).** If emotions *must* inherently be *about* something (intentional), but *can* occur without any conceptual/judgmental framing to *provide* that aboutness, how is intentionality constituted in those non-conceptual cases? This creates tension between the necessity of aboutness and the possibility of non-conceptual origins.

  ### Theory Scoring Against Checklist

  | Requirement                  | Motivating Case/Consideration                 | Negotiable | Judgment View         | Perception View        | Feeling View           |
  | :--------------------------- | :-------------------------------------------- | :--------- | :-------------------- | :--------------------- | :--------------------- |
  | **1. Intentionality**        | Fear *of* the bear; Anger *at* injustice      | No         | **Pass** (Core)       | **Partial** (Weak)     | **Fail** (Often lacks) |
  | **2. Phenomenal Quality**    | Raw feel of panic vs. joy                     | No         | **Partial** (Downplays) | **Pass** (Via body)    | **Pass** (Core)        |
  | **3. Bodily Involvement**    | Sweaty palms in fear; Adrenaline rush         | No         | **Partial** (Causal)  | **Pass** (Constitutive)| **Partial** (Correlate) |
  | **4. Valence**               | Joy feels good; Disgust feels bad             | No         | **Pass** (Appraisal)  | **Pass** (Body state)  | **Pass** (Core)        |
  | **5. Motivational Force**    | Fear prompts fleeing; Grief prompts withdrawl | No         | **Pass** (Goal link)  | **Pass** (Action urge) | **Pass** (Impulse)     |
  | **6. Cognitive Penetrability**| Fear reduces when threat disproven            | No         | **Pass** (Constitutive)| **Partial** (Modulates)| **Fail** (Separate)    |
  | **7. Non-Constitutive Cognition**| Jump-scare fear; Infant distress            | No         | **Fail**              | **Pass**               | **Pass**               |
  | **8. Differentiation**       | Knowing shame ≠ guilt                         | No         | **Pass** (Appraisal)  | **Partial** (Bodily)   | **Fail** (Vague)       |
  | **9. Duration & Dynamism**   | Shock → Grief; Simmering resentment           | Partial    | **Partial**           | **Partial**            | **Partial**            |
  | **10. Emotion vs. Mood**     | Anxious *about* exam vs. general anxiety     | No         | **Pass** (Object)     | **Partial**            | **Fail** (Blurs)       |
  | **11. Emotion vs. Reflex**   | Flinch (reflex) vs. Sustained fear (emotion)  | No         | **Pass**              | **Partial**            | **Fail** (Blurs)       |
  | **12. Grief for Fiction**    | Crying over fictional character's death       | No         | **Fail**              | **Partial**            | **Pass**               |
  | **13. Lingering Bodily Dread**| "Safe" plane still feels scary bodily         | No         | **Fail**              | **Fail**               | **Pass**               |
  | **14. Dual Pathways (Neuro)**| Subliminal fear; Fast amygdala response       | No         | **Fail**              | **Pass**               | **Partial**            |
  | **15. Somatic Markers (Neuro)**| Impaired decisions after vmPFC damage       | No         | **Partial**           | **Pass**               | **Partial**            |
  | **16. Basic Emotion Univ.**  | Cross-cultural facial recognition             | Partial    | **Partial**           | **Pass**               | **Pass**               |
  | **17. Cultural Variation**   | Culturally specific emotions (*liget*)        | No         | **Pass** (Appraisal)  | **Partial**            | **Fail**               |

  ### Analysis & Key Findings

  *   **Knockout Requirement:** **Intentionality (1)**. It eliminates the pure Feeling View entirely (Fail) and significantly challenges the Perception View (Partial). Only the Judgment View fully satisfies it, but at the cost of failing other requirements like Non-Constitutive Cognition and handling Grief for Fiction/Lingering Dread. Its centrality and non-negotiable status make it the biggest hurdle.
  *   **Best Fit View:** No single theory passes all non-negotiable requirements cleanly. **Perception Theory (James-Lange variant)** arguably handles the *broadest range* of non-negotiable requirements best (Intentionality-Partial, Phenomenal Quality-Pass, Bodily-Pass, Non-Constitutive Cog-Pass, Basic Emotions-Pass, Dual Pathways-Pass). It struggles most notably with full Intentionality and Lingering Dread (where body outlasts cause). Judgment Theory fails neuroscience/weird cases. Feeling Theory fails intentionality/cultural variation/differentiation. Hybrid views (e.g., embodied appraisal) are strongly implied by the checklist.
  *   **The Unsatisfiable Tension:** The conflict between **Intentionality (1)** and **Non-Constitutive Cognitive Access (7)** remains. A theory needs to explain how emotion can be inherently "about" something (1) without requiring conceptual judgment to constitute that aboutness (7). This likely requires a non-conceptual form of intentionality (e.g., sensorimotor, embodied).

