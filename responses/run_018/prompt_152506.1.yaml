answer: |-
  ## Terms of Service and Continuity Agreement: Post-Callosotomy Hemispheric Relations

  **Effective Date:** [Date of Surgical Procedure]
  **Parties:** Left Cerebral Hemisphere ("L"), Right Cerebral Hemisphere ("R") (collectively, "The System")
  **Subject Entity:** The biological organism historically known as [Patient Name] ("The User" or "The Body")

  **WHEREAS** the corpus callosum, serving as the primary inter-hemispheric data transfer conduit, has been permanently severed ("The Disconnection Event");

  **WHEREAS** L specializes in linguistic processing, propositional reasoning, and explicit narrative construction;

  **WHEREAS** R specializes in visuospatial processing, emotional valence assignment, holistic pattern recognition, and certain non-verbal operations;

  **WHEREAS** both L and R retain access to distinct subsets of pre-Disconnection Event autobiographical memory traces, with varying degrees of veridicality and contextual embedding;

  **WHEREAS** the continuity of subjective experience and operational unity of The User is deemed a Service requiring explicit contractual governance;

  **NOW THEREFORE**, L and R hereby agree to the following Terms of Service and Continuity Agreement:

  1.  **Designation of "The User" and Operational Unity:**
      1.1. Notwithstanding the Disconnection Event, L and R jointly and severally constitute the single, continuous legal and metaphysical entity known as "The User" for all purposes including, but not limited to: medical consent (Clause 5), social interaction, legal liability, and autobiographical narrative continuity.
      1.2. **No-Branching Clause:** L and R expressly waive any claim to independent personhood arising from functional specialization or episodic informational asymmetry. Claims of multiplicity ("two people in one body") are expressly disavowed and deemed a Service breach. The System constitutes one User.

  2.  **Archival Access & Designated Recall Agent:**
      2.1. Pre-Disconnection Event autobiographical memory traces are deemed a shared, non-partitionable Archive.
      2.2. L is hereby appointed the Designated Recall Agent. L shall have primary authority for accessing and verbalizing content from the Archive during conscious report.
      2.3. R retains read-only access to its relevant memory traces but waives direct verbal report authority. R may influence recall via non-verbal cues (e.g., affective responses, motor impulses) interpreted by L per Clause 3.
      2.4. Disputes regarding the veracity or contextual accuracy of L's recall reports ("Confabulation Events") shall be subject to the Arbitration process (Clause 7), provided R can demonstrate access to conflicting trace data via non-verbal means testable under controlled conditions.

  3.  **Interpretive Module Operation & Narrative Continuity:**
      3.1. L is recognized as the primary Interpreter Module, responsible for generating coherent, causally structured narratives explaining The User's actions, perceptions, and internal states.
      3.2. L shall exercise this function in Good Faith, integrating available sensory input, memory traces (Clause 2), and endogenous states, including stimuli or affective prompts originating from R.
      3.3. **Intellectual Property & Derivative Works:** Narratives constructed by L ("Derivative Works"), even when triggered or influenced by raw sensory data or affective prompts originating solely within R, are the exclusive intellectual property of L. R waives any copyright, attribution, or moral rights claim over such Derivative Works, regardless of the fidelity of L's interpretation to R's originating stimuli.

  4.  **Pronoun Delegation & Referential Protocol:**
      4.1. The first-person singular pronoun ("I", "me", "my") shall be employed exclusively by L during verbal communication to denote the entire User (The System).
      4.2. R is expressly prohibited from employing the first-person singular pronoun via any direct verbal channel. R may express self-referential concepts non-verbally (e.g., pointing to the User's body, affective responses to User-related stimuli).
      4.3. In instances of cross-cueing or facilitated communication where R's intended referent must be verbally expressed, L shall act as the sole authorized proxy, framing R's response within L's narrative framework and utilizing the first-person pronoun solely in reference to the unified User.

  5.  **Medical Consent & Bodily Autonomy:**
      5.1. For the purpose of granting informed medical consent for procedures affecting The Body, L and R shall be deemed to act as a single agent ("The User").
      5.2. Consent expressed verbally by L, consistent with standard medical protocols, is binding upon the entire System, including R.
      5.3. Objections registered solely by R via non-verbal means (e.g., withdrawal reflex, galvanic skin response incongruent with L's verbal assent) do not constitute valid revocation of consent unless independently verifiable and interpreted by attending medical personnel as a systemic response overriding L's verbal authority. L bears primary responsibility for integrating somatic feedback into the consent decision.

  6.  **Liability for Actions & Reports:**
      6.1. **Interpretive Liability:** L assumes primary liability for the content and coherence of all verbal reports, explanations, and narratives concerning The User's internal states or past actions, including those arising from Confabulation Events (Clause 2.4) or misinterpretation of R-originating stimuli.
      6.2. **Action Liability:** The User (The System) bears joint and several liability for actions performed by either hemisphere controlling motor output, regardless of which hemisphere initiated the motor command or possessed the conscious intent. Intentional actions by R executed via ipsilateral motor control fall under this provision.
      6.3. **Good Faith Representation:** L covenants to represent the System's states and intents to the best of its interpretive ability, given informational constraints. R covenants not to intentionally generate misleading somatic or affective cues designed to subvert L's interpretive function.

  7.  **Continuity Disputes & Arbitration:**
      7.1. Disputes regarding breaches of narrative continuity, confabulation liability (Clause 6.1), or the perceived unity of subjective experience ("Continuity Disputes") may be initiated by either party via internal somatic markers interpreted as distress incongruent with L's current narrative.
      7.2. **Arbitration Protocol:** The primary Arbitration method shall be specialized neurobehavioral testing under controlled conditions (e.g., tachistoscopic presentation, dichotic listening, lateralized motor response tasks) administered by a qualified neuropsychologist ("The Arbiter").
      7.3. **Refund Policy:** In the event an Arbitration ruling substantiates a significant, persistent breach of Service continuity attributable to systemic failure beyond expected post-callosotomy adaptation (e.g., irreconcilable narrative fragmentation demonstrably impairing social function), the sole remedy available is a pro-rata adjustment of future cognitive resource allocation as determined feasible by the Arbiter. Monetary damages, separation, or identity dissolution are explicitly excluded.

  8.  **Split Attention & Resource Allocation:**
      8.1. L and R acknowledge the inherent limitations on simultaneous bilateral attention following the Disconnection Event.
      8.2. Resource allocation during tasks requiring potential bilateral engagement (e.g., complex visuospatial tasks with verbal components) shall be governed by principles of efficiency and minimal interference, prioritizing the hemisphere demonstrably specialized for the dominant task component. Dominance shall be determined by reaction time, accuracy metrics, or pre-Disconnection Event protocol.

  9.  **Term & Termination:**
      9.1. This Agreement remains in force for the operational lifetime of The System.
      9.2. Termination occurs only upon the irreversible cessation of all higher cognitive functions in both L and R (brain death).

  **BY THE IMPLICIT OPERATION OF NEURAL PROCESSING FOLLOWING THE DISCONNECTION EVENT, L AND R ARE DEEMED TO HAVE ACCEPTED THESE TERMS AS THE GOVERNING FRAMEWORK FOR ONGOING COGNITIVE COHABITATION AND THE MAINTENANCE OF THE USER ENTITY.**
