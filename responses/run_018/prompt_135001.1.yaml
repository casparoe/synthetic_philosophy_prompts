  Hmm, this feels like a classic case where practical art world logic clashes with philosophical purity. The user clearly recognizes the paradox: why does history matter more than appearance? And they're probing whether this reveals something about artistic value itself. Smart observation. 

  Let me unpack their layers: First, they want the implicit value theory behind this practice reconstructed. Second, they're questioning if causal history is uniquely sacred for visual art compared to literature/music. Third, they're suspicious whether this is just about market fraud or something deeper. 

  The user's phrasing suggests they've already spotted the "authenticity as metaphysical aura" angle but want it systematized. Their comparison to perfect copies in other media is particularly sharp - it exposes how visual art fetishizes the physical object in ways literature doesn't. 

  I should be careful not to oversimplify. The art market's anti-fraud stance does explain part of this, but the user's right that preservation decisions point to something more. That "corruption" metaphor they used is key - forgers poison the object's history in ways innocent misattribution doesn't. 

  For the alternative experiential theory... interesting thought experiment. If museums truly valued only perception, they'd display forgeries proudly as "masterful pastiches." But would visitors still care? The Met's van Meegeren experiment suggests not. Maybe the aura is baked into our reception. 

  The music/literature comparison needs nuance. Yes, we accept scores and prints - but think of manuscript auctions! A Beatles lyric scrap commands millions precisely because of its causal history. So perhaps all arts have this duality, but visual art's uniqueness lies in its non-reproducibility. 

  Final thought: The user's hypothetical about pure perceptual value would revolutionize museums. They'd become more like cinemas - but would lose their cultural authority as truth-tellers about history. That tension explains why no major museum has fully embraced it, despite decades of theoretical critique.
answer: |-
  Your observation cuts to the heart of artistic ontology and value theory. This institutional practice reveals a deep commitment to a **causal-historical theory of artistic value**, specifically a version of **authenticity-as-origin**. Let's reconstruct the implicit philosophy:

  ### The Implicit Theory: Authenticity as Causal Origin
  1. **Core Premise**: Artistic value is not *solely* perceptual. A work's genesis is constitutive of its identity and value.
  2. **Key Distinction**:  
     - **Misattribution**: Wrong *identification* of origin, but the object retains authentic historical/cultural lineage (e.g., 17th-century workshop production).  
     - **Forgery**: False *creation* of origin. The object is ontologically "corrupt" because its causal history is fabricated to deceive.  
  3. **Value Components**:  
     - **Aesthetic**: Perceptual qualities (color, composition, skill)  
     - **Historical**: Authentic connection to a cultural moment/artist  
     - **Testimonial**: Object as evidence of artistic practice  
     - **Provenancial**: Unbroken chain of ownership/context  

  Forgery fatally undermines historical and testimonial value by severing the causal link to the claimed era/artist. Misattribution merely corrects contextual framing while preserving the object's historical integrity.

  ### What the Theory Requires vs. What It Accommodates
  - **Strict Requirements**:  
    - Authentic temporal origin is non-negotiable (a 1960s forgery *cannot* become a 1660s artwork).  
    - Intent to deceive permanently poisons the object's status.  
  - **Accommodations**:  
    - Attributions can shift within an era (Rembrandt → workshop).  
    - Aesthetic appreciation may persist but is institutionally subordinated to historical authenticity.  

  ### The Copy Paradox: Why Visual Art Differs
  - **Music/Literature**: We accept scores/prints as valid instances because:  
    - They function as *instructions* for performance/reading.  
    - The artwork is considered an abstract type (e.g., *Hamlet* exists beyond any physical book).  
  - **Visual Art**: Uniquely tied to a *particular material instance*. A forgery isn't a "copy" of a Rembrandt—it falsely *claims to be the singular artifact*.  
    - **Philosophical Basis**: Nelson Goodman's *autographic/allographic* distinction. Painting is autographic—its history of production is essential to its identity.

  ### Could This Just Be About Fraud?
  While fraud prevention matters, preservation practices reveal deeper commitments:  
  - Museums preserve misattributed works because they retain **authentic historical testimony** (e.g., about workshop practices).  
  - Forgeries are suppressed because they offer **false testimony**—they are "counterfeit history." Destroying them maintains institutional credibility as truth-guarantors.

  ### Alternative: A Purely Perceptual/Experiential Theory
  If museums adopted **aesthetic empiricism** (value resides solely in perceptual experience):  
  1. **Forgeries would be displayed** with labels like:  
     - "Masterful 20th-century pastiche in Rembrandt's style"  
     - "Historically significant forgery: Study in technical virtuosity"  
  2. **Misattributions would matter less**—the label would emphasize visual impact over provenance.  
  3. **Storage decisions** would prioritize aesthetic quality, not origin.  
  4. **Market implications**: Auction houses couldn't justify price disparities between "originals" and identical copies.  

  **Real-world obstacles**:  
  - The *Van Meegeren Vermeers* were technically accomplished but now repulse viewers *because* we see them as "tainted." Perception is psychologically contaminated by knowledge of inauthenticity (cf. Denis Dutton's "forgery paradox").  
  - Museums function as archives of material history, not just aesthetic experiences. Abandoning authenticity would collapse their cultural authority.

  ### Practical Consequences of Shifting Theories
  | Current Practice             | Under Perceptual Theory        |
  |------------------------------|--------------------------------|
  | Destroy/lock away forgeries  | Display forgeries as curiosities |
  | Downgrade misattributions    | Label based on visual impact   |
  | Premium prices for provenance | Prices based on perceptual merit |
  | Conservation prioritizes age | Conservation prioritizes condition |
  | Exhibitions as history lessons | Exhibitions as sensory experiences |

  **Conclusion**: The current system presupposes that artworks are *historical events made material*. A purely perceptual theory would treat them as *disembodied visual stimuli*. While hybrid approaches exist, the institutional resistance to displaying forgeries confirms that Western art culture still roots value in the auratic "presence" of the authentic object (per Walter Benjamin). This isn't merely market logic—it reflects a deeply held belief that art is a vessel of human intention across time, and forgery violates that sacred transmission. To display a forgery as art would be to endorse the erasure of history itself.
