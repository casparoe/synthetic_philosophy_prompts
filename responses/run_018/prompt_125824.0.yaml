  First, I need to recall Ryle's distinction. Knowing-how is about skills and abilities, like riding a bike, while knowing-that is factual knowledge, like knowing that Paris is the capital of France. Ryle argued against the idea that knowing-how is just applied knowing-that, emphasizing that skills are independent of theoretical knowledge. Mr. Miyagi's training seems to embody this—Daniel learns movements through physical practice without being told their purpose, which aligns with Ryle's view of knowing-how as non-intellectual.

  The user is stuck on whether tacit knowledge can ever be fully non-propositional. Daniel's conscious naming of moves during the final tournament scene complicates this. When he shouts "wax on" while blocking, it suggests that his embodied skill might still rely on verbal cues. That could indicate a collapse back into knowing-that. But is that necessary, or just a crutch under pressure?

  Polanyi's tacit knowing comes in here. He talks about subsidiary and focal awareness. For example, when using a hammer, you focus on the nail, not the hammer itself. Miyagi's training mirrors this—Daniel focuses on waxing the car or painting the fence, not the martial arts applications. His body learns the movements subsidiarily. The tournament scene where he applies the blocks without naming them (like the crane kick) shows tacit knowledge in action. But when he names them, it might be Polanyi's "explication," which can make tacit knowledge explicit but isn't always necessary.

  Specific scenes: Miyagi's initial training sequences (waxing cars, painting fences) show the physical drill without explanation. The reveal scene where Miyagi demonstrates the blocks is crucial—Daniel connects the motions to their purpose, which involves some knowing-that. Then the tournament: when Daniel blocks without naming, it's pure knowing-how; when he names moves, it's knowing-that surfacing. The crane kick finale doesn't require verbalization, showing embodied skill.

  Does the movie support Ryle? Mostly yes, through Miyagi's methods. But Daniel's need to verbalize in high-pressure situations suggests that for learners, some explicit knowledge might aid performance. Polanyi adds that tacit knowledge is foundational, and explication is secondary. The film shows that while skills are embodied, conscious articulation can emerge, especially in novices.

  Is the movie inconsistent? Not really. It portrays skill acquisition as starting with embodied practice (tacit), then integrating some explicit understanding, but ultimate mastery returns to tacit execution. The crane kick scene emphasizes this—Daniel doesn't think; he acts. The film might not care about the philosophical debate but illustrates both aspects through Daniel's journey.

