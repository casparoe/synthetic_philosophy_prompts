  Read The Karate Kid (1984 version, not the remake) through Ryle's knowing-how versus knowing-that distinction, but I want you to focuss specifically on Mr. Miyagi's wax-on wax-off training method. The niche thing I'm stuck on is whether tacit embodied knowledge can ever be fully non-propositional, or if there's always some hidden knowing-that underneath. Does Miyagi's method prove Ryle right, or does Daniel's need to consiously name the moves during the final match show that knowing-how eventually collapses back into knowing-that? I also want you to bring in Polanyi's concept of tacit knowing—not as decoration, but to ask whether the film captures something about skill aquisition that Ryle's framework actually misses. Don't just summarize the philosophy; point to specific scenes that support the reading and specific scenes that resist it, and say honestly if the movie just doesn't care about the distinction. Write the answer in American English, and don't worry about being too formal—I'm prepping this for a philosophy study grp and there's definitely a typo or two in my own notes.
