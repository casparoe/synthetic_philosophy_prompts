  Here’s a breakdown of Mr. Miyagi’s "wax-on, wax-off" method through Ryle and Polanyi, using the film as our lab – warts, crane kicks, and all:

  **Ryle 101 & Miyagi's Method: Knowing-How Takes the Lead**
  *   **Ryle's Core Argument:** Knowledge isn’t *just* in your head ("knowing-that" – facts, propositions). A huge chunk is "knowing-how" – skills, embodied abilities (like riding a bike). Crucially, for Ryle, knowing-how is **primary and often non-propositional**. You don't need to articulate rules to *do* something skillfully. Trying to reduce all knowing-how to knowing-that is the "Intellectualist Legend" mistake.
  *   **Miyagi as Ryle's Poster Child:** Miyagi’s entire training philosophy screams Rylean knowing-how.
      *   **The Training Montage (Waxing Cars, Painting Fences, Sanding Floors):** Daniel isn't *told* he's learning karate blocks. He's given physical tasks with specific motions: "Wax on, right hand clockwise. Wax off, left hand counter-clockwise." **Zero propositional content about karate is given.** Daniel learns the *motions* physically, through repetition, embodying the skill. He's acquiring *knowing-how* without any explicit *knowing-that* about its ultimate purpose. This seems like pure, non-propositional embodied knowledge. **Scene Support:** Daniel's frustration ("I'm your *slave*?") highlights the lack of propositional understanding. He's purely *doing*.
      *   **The Reveal:** When Miyagi finally throws punches and Daniel instinctively blocks using the waxing/painting motions ("Show me 'sand the floor'! Show me 'paint the fence'!"), it's the **epitome of Ryle's point.** Daniel *embodied* the skill *before* he could articulate *why* or *what* it was for. The knowing-how was established independently, *then* linked to propositional knowledge ("This is a block").

  **The Wrinkle: Daniel's Tournament Shouting & Knowing-That Creeping Back In**
  *   **The Problem Scene:** During the final tournament, especially in early matches, Daniel consciously shouts the names of the moves as he does them: "WAX ON!" (blocking a punch) or "PAINT THE FENCE!" (another block).
  *   **The Challenge to Pure Knowing-How:** This *looks* like the embodied skill (knowing-how) collapsing back into, or being actively supported by, propositional knowledge (knowing-that: "This motion is called 'wax on' and it blocks a high punch"). It suggests that for Daniel, *at that stage*, the skill isn't *fully* non-propositional. He needs the verbal cue, the explicit label, to access or reinforce the movement under pressure. Does this prove the "Intellectualist Legend" has a point?
  *   **Possible Rylean Defense:** Ryle might argue this is just a novice's crutch, a temporary scaffold. Daniel is still integrating the skill. Shouting the name isn't *constituting* the knowledge; it's a *focusing tool* for someone not yet fully fluid. The *real* knowing-how is the motion itself, which he *can* eventually perform silently (like the Crane Kick).

  **Enter Polanyi: Tacit Knowing – The *Focal/Subsidiary* Dance Ryle Might Miss**
  *   **Polanyi's Core Idea:** "We know more than we can tell." Tacit knowledge involves two parts: **Subsidiary Awareness** (the details we *dwell in* but don't directly focus on, like the feel of a tool in our hand) and **Focal Awareness** (the main object of our attention, like the nail we're hitting).
  *   **Miyagi's Method Through Polanyi:** The brilliance of "wax-on, wax-off" is that it **shifts Daniel's focal awareness.** During training:
      *   **Focal Awareness:** The *task* (waxing the car perfectly, painting the fence without streaks).
      *   **Subsidiary Awareness:** The *motions* themselves (the specific circular hand movements, body posture, muscle memory).
      Daniel isn't consciously learning "blocks"; he's dwelling in the motions (subsidiary) while focusing on the task (focal). The *karate application* is completely tacit at this stage.
  *   **The Reveal & Beyond:** When Miyagi attacks, Daniel's focal awareness shifts to *defense*. Suddenly, the subsidiary elements (the ingrained motions) become the *means* to achieve the new focal target (blocking the punch). **The tacit knowledge (the motions) is integrated into a new skill.** Polanyi captures the *structure* of how the embodied knowledge is acquired and then repurposed in a way Ryle's binary (while correct about primacy) doesn't fully unpack.
  *   **Daniel's Shouting Revisited (Polanyi's Lens):** When Daniel shouts "WAX ON!" during a block, he might be momentarily shifting his subsidiary awareness (the feeling of the motion) *towards* the focal level *as a cue*. He's making the tacit element *somewhat* explicit to manage stress and focus. It's not that the knowledge *is* propositional; it's that he's *naming* a subsidiary element to help integrate it under pressure. **Scene Resistance to Pure Non-Propositionality:** This shows that while the core skill is tacit/procedural, conscious access to labels *can* be a tool, especially during learning or high stress. It doesn't mean the knowledge *is* propositional, but that propositions can be used to *manage* it.

  **Does the Movie Care About the Distinction? Honestly...**

  Not explicitly as philosophy, but **it absolutely cares about the *process* of learning embodied skill**, which *embodies* (pun intended) these philosophical ideas. It shows:

  1.  **Primacy of Embodied Practice (Ryle Wins Mostly):** Skill comes *from doing*, not just explaining. Miyagi's method works *because* it bypasses propositional overload initially.
  2.  **The Tacit Integration (Polanyi's Value):** The film beautifully illustrates shifting awareness – from task to application. The "reveal" scene is pure Polanyi: the subsidiary becomes functional in a new context.
  3.  **The Novice's Need for Scaffolds (The Daniel Factor):** The tournament shouting acknowledges that verbalization/codification (knowing-that) *can* play a role, especially for learners under pressure. It doesn't negate Ryle; it shows the messy reality of skill *acquisition* where propositions can be temporary aids. **Final Scene Support (Crane Kick):** When Daniel performs the Crane Kick to win, he does it silently, purely from embodied knowing-how/polanyi's tacit integration. The shouting was a phase, not the endpoint.

  **Verdict:**

  *   **Miyagi's Method:** Strongly supports Ryle. It demonstrates the acquisition of non-propositional knowing-how *before* any knowing-that about its martial purpose exists.
  *   **Daniel's Tournament Shouting:** Complicates things. It suggests that *for the learner in transition*, explicit labels (knowing-that) can be a conscious tool to access or stabilize the embodied skill under duress. It doesn't *collapse* knowing-how back into knowing-that, but shows they can temporarily interact. Pure mastery (Crane Kick) transcends this.
  *   **Polanyi's Contribution:** The film *shows* tacit knowing (focal/subsidiary shifts) brilliantly. This explains *how* the non-propositional skill is structured and repurposed better than Ryle's framework alone. Ryle is right *that* it's non-propositional, but Polanyi helps explain *how it works*.

  So, does Miyagi prove Ryle right? **Yes, fundamentally.** But Daniel's journey shows skill acquisition is messy, and Polanyi gives us a richer vocabulary to describe the dance between the inarticulate body and the conscious mind that the film captures so well. The knowing-how is king, but the prince of knowing-that sometimes shouts advice from the sidelines during the battle.
