  The fluorescent hum of the community centre basement felt like a physical weight on Leo’s shoulders. Outside, an indifferent October rain slicked the pavements. Inside, twenty-three employees of Veridian Analytics stood in awkward rows, clutching photocopied sheets, rehearsing for Carol’s remembrance ceremony. Mandatory participation. HR’s idea of healing.

  Carol had worked in Accounts Payable. Leo had shared the coffee machine with her for seven years. They’d exchanged pleasantries, complaints about the air conditioning, the occasional deeper sigh about corporate absurdity. He’d meant to tell her, the week before the sudden aneurysm, how much he appreciated her dry wit cutting through the daily fog. He hadn’t. Now, he stood flanked by Darren from Logistics and Priya from Marketing, his throat tight with the unsaid.

  The ‘choir’ was a stretch. Mr. Henderson, the earnest facilitator hired by HR, tapped his tuning fork. “Once more, from the top. Remember, it’s not about perfection, it’s about *intention*. Feel the unity. Let the structure hold you.” The structure was a simplistic, vaguely hymn-like melody Henderson had composed. The lyrics, sourced from a ‘Corporate Grief Management’ template, were numbingly repetitive:

  *"We remember, we recall,
  The light, the warmth, the grace in all.
  Though parted now by silent shore,
  Your spirit guides us evermore."*

  Four lines. Repeated three times. A predictable rise and fall, a prescribed rhythm as rigid as a metronome. Leo despised it. It felt like grief sanitized, shrink-wrapped in corporate jargon. During the first rehearsal, his voice had cracked, not with emotion, but with stifled rage at the banality. He’d mumbled his way through, eyes fixed on the scuffed linoleum.

  Today was different. A leaden numbness had settled over him since waking, the weight of Carol’s absence not as a sharp pain, but as a vast, hollow space he kept bumping into. He’d tried to articulate it to his partner over breakfast – the guilt of proximity without depth, the crushing ordinariness of a life interrupted – but the words came out flat, unconvincing. “Just… sad,” he’d finally managed. “And it feels stupid, somehow. We weren’t close-close.” He’d seen the gentle confusion in their eyes.

  Henderson raised his hands. The room inhaled, a collective, rustling sigh. He gave the downbeat.

  The familiar, slightly saccharine melody began. Leo opened his mouth, letting the sound emerge passively, a low drone beneath Priya’s clearer soprano and Darren’s hesitant baritone. *"We remember, we recall..."* The words were empty shells. He focused on the mechanics: breathe here, hold that note, soften the consonant.

  Halfway through the first repetition, something shifted. The enforced tempo, usually a constraint, became a channel. The repetition wasn’t dulling meaning; it was stripping away the need to *find* new words, to *craft* a sentence. The simplistic melody, with its limited range, wasn’t confining emotion; it was concentrating it, distilling it.

  *"The light, the warmth..."* He wasn’t singing about some abstract corporate ‘grace’. He was seeing Carol’s face, the precise way her eyes crinkled when she delivered a particularly deadpan zinger about the CEO’s latest memo. The warmth wasn’t generic; it was the specific heat of shared, silent commiseration at the coffee machine at 3 PM. The melody rose, demanding a slight lift in volume and pitch on *‘warmth’*. The physical act of lifting his voice, pushing against the prescribed note, suddenly matched the pressure building behind his sternum.

  *"Though parted now by silent shore..."* The rhythm was steady, implacable. It didn’t allow for the stammering hesitations of conversational confession. It marched forward, carrying him with it. The ‘silent shore’ wasn’t poetic fluff; it was the brutal, irrevocable silence of her empty desk, the coffee mug left unclaimed. The rigidity of the beat became a frame holding the chaotic swell of his regret. He couldn’t meander, couldn’t qualify, couldn’t hide behind conversational filler. The music demanded directness.

  He reached the final line of the repetition: *"Your spirit guides us evermore."* The word ‘spirit’ hung on a sustained note. Usually, he clipped it short. This time, the sustained note pulled the truth out of him. It wasn’t Carol’s spirit guiding Veridian Analytics. It was the sharp, painful *lack* of her specific, irreverent presence that would now guide *him* – a reminder of the cost of unspoken appreciation, of connections left dangling in the mundane. The note trembled, not with vibrato, but with the raw vibration of unshed tears held too long.

  The melody cycled back. *"We remember, we recall..."* This time, the repetition wasn’t rote. It was incantatory. The artificial structure, the very thing he’d resented, became transparent. It wasn’t obscuring his feeling; it was scraping away the layers of self-consciousness, the social mediation of ‘appropriate’ workplace grief, the fear of sounding maudlin or insincere. The simple, rhythmic singing bypassed the tangled pathways of prose thought. It went straight to the core.

  *"The light, the warmth, the grace in all."* He wasn’t singing the lyrics on the page anymore. He was singing the image of Carol’s half-smile, the specific timbre of her sigh, the exact shade of her favourite blue cardigan hanging on her chair back. He was singing seven years of coffee breaks condensed into a pang of pure, unvarnished loss. The melodic constraint focused the diffuse ache into a single, clear beam of sound. The prescribed rhythm became the heartbeat of his regret.

  He felt Darren glance sideways at the unexpected rawness in his voice. He didn’t care. The artifice had become a conduit. The singing wasn’t expressing the feeling; the feeling *was* the singing. It flowed out, unimpeded by the usual filters, carried on the current of Henderson’s banal tune. A tear escaped, tracing a hot path down his cheek, unnoticed by him until it splashed onto the photocopied sheet, blurring the word ‘recall’.

  The final repetition ended. The last note hung in the damp basement air, a collective exhalation that sounded different this time – less perfunctory, more resonant. Henderson lowered his hands, a look of quiet surprise on his face. "Good," he murmured, almost to himself. "That felt... connected."

  Leo stood very still. The fluorescent hum was back, the scuffed linoleum visible again. But the hollow space inside him felt different. Not filled, precisely, but acknowledged. Named. Not with conversational words that inevitably fell short, but through the strange, necessary artifice of singing a corporate dirge. The stiffness, the repetition, the rigid melody – the very things designed to mediate and contain had, paradoxically, shattered the glass between his hidden grief and the world. For three minutes, stylization hadn’t obscured reality; it had been the scalpel that cut it open. He wiped his cheek, the echo of his own voice, truer than any spoken word could be, vibrating silently within him.
