  Give me your actual credence, expressed as a number between 0 and 1, that Popper's poverty-of-historicism argument — if taken as fully sound — succeeds in ruling out every form of law-like regularity in historical development, including non-predictive structural patterns (for instance, path-dependent institutional lock-in or sequence-specific regime transitions that explain without forecasting). I do not want a bare figure; decompose the credence into at least four parts: (a) the likelihood that Popper's core distinction between empirical trends and universal laws survives scrutiny from contemporary philosophy of science; (b) the likelihood that genuinely law-like but non-predictive structural regularities exist in history at all; (c) the likelihood that a charitable reading of Popper's argument already accommodates, or inadvertently excludes, such regularities; (d) the likelihood that the phrase 'law of history' is determinate enough for the claim to have a definite truth value. For each part, supply the approximate probability with one line of justification, then show how they combine into your overall figure. Identify the term in which you are least confident and specify what conceptual clarification or empirical finding would most shift it. Answer in British English, and conclude with your final combined credence in the form \answer{...}.
