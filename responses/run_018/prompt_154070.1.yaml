answer: |-
  Here’s a complete mock exam package focused on your "Silent Surgeon" case, designed to test deep analysis of the sensory-affective-motivational distinction in pain:

  ---

  ### Philosophy of Mind Mock Exam  
  **Question 1 (60 minutes):**  
  *Analyze the following scenario:*  
  > Dr. Aris Thorne ("The Silent Surgeon") is performing a complex surgery when she accidentally cuts her own finger deeply with a scalpel. She feels a sharp, intense pain sensation localized to her finger. Objectively, she recognizes this pain as "bad" (unpleasant, harmful) and acknowledges it should be avoided. However, she feels **zero motivation** to stop operating, flinch, protect her hand, or seek treatment. She continues the surgery calmly and successfully. Neurologists confirm she has no nerve damage or paralysis; her pain perception is intact but entirely decoupled from avoidance behavior.  

  *Does Dr. Thorne’s case undermine the **motivational account of pain’s badness**?*  
  *(The motivational account claims: Pain is bad fundamentally because it motivates us to avoid damage/escape the sensation.)*  

  **In your response:**  
  1. Explain the motivational account’s core claim about why pain is bad.  
  2. Apply the **sensory vs. affective distinction** in pain processing to Dr. Thorne’s experience.  
  3. Analyze how the dissociation between her *evaluation* ("this pain is bad") and her *behavioral drive* (no motivation to act) challenges the motivational account.  
  4. Discuss whether her experience still supports the idea that pain is intrinsically "bad."  

  ---

  ### Model Answer (Key Points)  
  Dr. Thorne’s case **significantly challenges but does not fully refute** the motivational account of pain’s badness.  

  1. **Motivational Account Core Claim**: This theory posits that pain’s badness lies *primarily* in its capacity to compel avoidance behavior. Pain is bad *because* it motivates actions to stop or escape it (e.g., withdrawing from a hot stove), thereby preventing harm. Its aversiveness is defined by this motivational force.  

  2. **Sensory vs. Affective Distinction**:  
     - **Sensory Component**: Dr. Thorne clearly experiences the *sensory* aspect of pain (sharp, localized sensation), indicating intact nociception.  
     - **Affective Component**: She reports the pain as "bad" (unpleasant), suggesting the *affective* dimension (the "suffering" quality) is present. Crucially, however, the **motivational drive** typically linked to the affective component—the urge to escape—is entirely absent. This dissociation mirrors pain asymbolia, where affective evaluation and motivational output are separable.  

  3. **Challenge to Motivational Account**:  
     - The account claims motivation is *essential* to pain’s badness. Yet Dr. Thorne evaluates her pain as bad *without* any motivation to avoid it. This demonstrates that the negative evaluation (affective dimension) can exist independently of motivational consequences.  
     - Thus, the case shows motivation is not *necessary* for pain to be judged "bad," undermining the theory’s claim that badness is *defined* by motivation. The affective "badness" persists even when motivation vanishes.  

  4. **Implications for Pain’s Badness**:  
     - Dr. Thorne’s experience suggests pain’s badness may be located primarily in the *affective evaluation* (the unpleasantness itself), not the motivational drive. The badness is intrinsic to the subjective experience of suffering, even if action doesn’t follow.  
     - The motivational account conflates *why* pain is bad (its phenomenology) with *what it does* (drive behavior). The Silent Surgeon shows these can dissociate, implying badness is rooted in phenomenology, not behavioral outcomes.  

  **Conclusion**: The case fatally weakens the motivational account by proving motivation isn’t necessary for pain to be experienced as bad. Pain’s badness likely resides in the affective dimension alone.  

  ---

  ### Marking Scheme (20 Marks Total)  
  Award **4 marks per point** if the candidate:  

  | **Must-Hit Point**                                  | **Common Mistake (Costs Marks)**                          |  
  |-----------------------------------------------------|----------------------------------------------------------|  
  | **1. Accurately summarizes the motivational account:** Explicitly links pain’s badness to *motivating avoidance behavior*. | *Vaguely describes pain as "bad" without tying badness to motivation.* |  
  | **2. Applies sensory/affective split to the case:** Correctly identifies sensory pain (sharp sensation) AND affective pain (evaluation as "bad") in Dr. Thorne. | *Confuses sensory vs. affective aspects (e.g., claims she "doesn’t feel pain" or misses her negative evaluation).* |  
  | **3. Identifies the dissociation:** Notes the *separation* between affective evaluation ("bad") and absent motivation (no drive to stop). | *Claims she "ignores" pain or has willpower, missing the *lack of motivation* as neurological dissociation.* |  
  | **4. Challenges motivational account:** Argues dissociation shows motivation is *not necessary* for pain to be judged bad. | *Claims case "disproves" all badness OR insists motivation must still be "hidden," missing the conceptual blow.* |  
  | **5. Locates badness in affect:** Suggests badness lies in the *affective experience* (unpleasantness), not motivation. | *Concludes pain isn’t "truly bad" for her OR reduces badness purely to harm/sensation, ignoring affect.* |  

  ---

  ### Why This Works for Your Group:  
  - **Forces Application**: Students *must* use sensory/affective theory to dissect the case, not just define terms.  
  - **Targets Your Argument**: Directly engages the "is pain bad *only* because it motivates?" debate using asymbolia logic.  
  - **No Citations Needed**: Concepts (sensory/affective split, motivational theory) are core to pain philosophy, not tied to specific texts.  
  - **Clear Grading**: Each of the 5 points isolates a critical reasoning step. Common errors reflect predictable misunderstandings.  

  **Tip for Study Group**: Before the exam, practice identifying the sensory/affective/motivational "layers" in everyday pain examples (e.g., stubbing a toe vs. chronic backache). This builds intuition for dissociations!
