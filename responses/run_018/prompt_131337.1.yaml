prompt: |-
  I'm on the review commitee for the Meridian Institute's long-range grants, and we've got this proposal that puts inside-view vs outside-view reasoning right in the center. The PI team wants to forecast failure modes in climate-adaptation governance over a 40-year horizon using only detailed causal diagrams with stakeholder loops; they explicitly reject calibrating against historical base rates of similar predictions failing. Their argument is that outside-view adjustments are epistemically arrogant here because the reference class is genuinely undefined - applying Tetlock-style tournament logic would just import false precision. Half our panel wants to reject outright for lacking reference-class forecasting; the PI says that's mechanistic modesty that collapses into anti-intellectualism.

  I need a working memo for Thursday's meeting that reccomends a concrete decision - approve with conditions, reject, or full approve - with reasoning the researchers could actually respond to. It needs to take the PI's anti-base-rate argument seriously rather than just restating forecasting best practices, but also not ignore that we're exactly the kind of body that overweights narrative coherence. There's a specific wrinkle one reviewer floated: a 'modesty tax' where we fund them but require quarterly outside-view audits by an independent panel with veto over renewal. I want the memo to address whether that's a coherent institutional design or just bureaucratic theater that lets us feel humble without actually being humble.

  Write it like an internal memo, not a philosophy essay. Make sure the bottom line is clear and there's an honest treatment of the strongest point on the losing side. And please don't correct the typo in my opening - just draft the thing.
