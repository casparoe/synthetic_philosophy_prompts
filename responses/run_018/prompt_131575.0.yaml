  hey, so my grandma left me this painting and it turned out to be a 1980s forgery, and now im weirdly obsessed with whether the real one is actually better or if its all just in my head. im running a philosophy meetup next week and want a decision tree / taxonomy that sorts people by what they actually think about fakes, forgeries, and why originals matter — not by which label they like. can you write this in american english please?

  i need about 4-5 branch points, each one a concrete case or claim someone could answer without knowing philosophy jargon. include scenarios like: (1) a perfect physical duplicate made with the exact same materials and technique but zero causal link to the artist, (2) a forgery that fooled experts and was loved for decades before anyone caught on, and (3) an AI-generated reconstruction of a destroyed masterwork that curators cant tell apart from the lost original. the leaves should be named positions if they exist — formalism, intentionalism, historicism, moralism about deception, whatever — plus an "unnamed" slot for combos that make logical sense but nobody actually holds, especially that weird view where the forgery might be MORE valuable because it proves insane human skill at mimicking genius. flag any pair of leaves your tree cant really seperate, and for any empty branches briefly diagnose why theyre empty: incoherent, ugly, or just unexplored?

  please dont include bibliographies, reading lists, or citations — i want something a model without web access could actually work with. and if you reference any real philosophers, only put words in quotation marks if you can verify them exactly; otherwise just paraphrase. keep it casual like a handout, and dont stress about perfect grammar — i probably have a typo or two in here myself anyway.
