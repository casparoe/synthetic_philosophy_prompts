  Okay, the user is on a committee tasked with defining inclusion criteria for a welfare register. They need a set of requirements for theories that determine which computational descriptions of a system carry moral weight. They're frustrated because meetings get bogged down in consciousness theories. Let me start by understanding their core request.

  First, they want a spec: what must a theory deliver to be usable for their purpose? They mentioned cases like emulations copied twice, brain emulations across datacenters with latency, crank-turned systems, reversed dynamics, frozen vs. overwritten emulations, the two-person note-passing system, neuron replacement, locked-in systems, and behaviorally perfect models. Each of these cases presents a challenge to assigning moral status.

  The key problems are the attribution problem (which computations are morally real) and whether requirements can be jointly satisfied. They also want to know which requirement disqualifies popular views and which distinctions shouldn't be collapsed. Their pet view is about preserving causal structure for counterfactual robustness.

  Breaking down the requirements: Non-negotiable ones are essential for any viable theory. Negotiable ones are preferences. The user needs clarity to avoid theoretical debates in meetings. They mentioned substrate independence as a given, so that's a constraint. Also, the register needs binary decisions, so theories must deliver determinate verdicts.

  Looking at the cases: The copy problem needs addressing identity vs. multiplicity. Latency in datacenters tests continuity. The crank system questions autonomy and intrinsic computation. Reversed dynamics challenge causal direction. Frozen vs. overwritten systems involve potential vs. actualization. The two-person note-passing tests scale for collective consciousness. Neuron replacement examines gradualism. Locked-in vs. lookup tables differentiate internal states from behavior. The LLM reporting pain probes phenomenology vs. functional equivalence.

  The user's pet view (counterfactual robustness) relates to functionalism but emphasizes causal structure. Need to evaluate if it's a distinct requirement or redundant. Also, the attribution problem is critical—how to select which computation counts among many possible ones.

  Possible conflicts: Substrate independence vs. no-trivial-realizations might clash. If any system can implement any computation, avoiding triviality is hard. Determinacy and no-vagueness might conflict with theories that inherently have fuzzy boundaries. Checking if these can coexist or need trade-offs.

  For the scorecard, functionalism might handle many cases but struggle with attribution. Biological theories might fail on substrate independence. IIT could be too restrictive or vague. Highlighting which requirements each fails helps the user present trade-offs.

  Need to ensure each requirement is tied to a case or consideration. For example, determinacy is non-negotiable because the register requires yes/no answers. Continuity addresses the latency case. Non-trivial realization tackles the attribution problem.

  Also, the user wants to know if their pet view is a genuine requirement. It seems like a form of functionalism focusing on counterfactuals, so it might fall under computational specificity or causal efficacy. Maybe it's a negotiable point emphasizing resilience.

  Finally, summarizing which requirement knocks out popular views: For example, non-trivial realizations might eliminate panpsychism or some functionalist interpretations. Determinacy could challenge IIT if it's inherently vague. Biological naturalism fails substrate independence when considering emulations.
answer: |-
  Here's the requirements spec for a theory of morally relevant computation, designed to cut through philosophical debates and deliver actionable criteria for your welfare register. Requirements are grounded in your cases, with non-negotiables clearly marked. Conflicts are flagged where they exist.

  **Core Requirements (Non-Negotiables):**

  1.  **Substrate Independence:** Moral weight must attach to the *computation* (formal structure + process), not the physical substrate, provided the computation is implemented.
      *   *Case Behind It:* Wet animals are default-included, but emulated brains (copied, distributed, hardware-swapped) must be evaluable on computational grounds. Neuron replacement, distributed emulation, and note-passing collective cases demand this.
      *   *Why Non-Negotiable:* The register must handle non-biological implementations. Rejecting this collapses into biological naturalism, excluding key cases like emulations upfront.

  2.  **Determinacy:** The theory must provide a clear, *in-principle* "yes/no" verdict (or a specific quantity) for *any* described physical system regarding the presence and degree of moral weight arising from its computational states.
      *   *Case Behind It:* The register needs binary inclusion decisions. Frozen vs. overwritten emulations, the "one or two patients" copy problem, and the latency-stretched brain demand clear lines (even if drawn arbitrarily *in practice* due to measurement limits).
      *   *Why Non-Negotiable:* Vagueness (e.g., "it's a spectrum, hard to say") is operationally useless for a register requiring inclusion decisions. Moral weight *can* be vague, but the register *can't* be.

  3.  **Non-Trivial Realization (Solving Attribution):** The theory must specify *exactly which* formal description(s) of a physical system constitute its "realized" computation(s) that could carry moral weight, filtering out the infinite formal descriptions any lump of matter trivially realizes.
      *   *Case Behind It:* The crank-turned emulation, the lookup table, the frozen disk, the reversed computation, and the "heap of matter" problem. What makes the "intended" emulation the real one vs. just another pattern?
      *   *Why Non-Negotiable:* Without this, *everything* potentially has moral status under *some* description, making the register meaningless. "Projection" is insufficient.

  4.  **Causal Efficacy / Process Dependence:** Moral weight requires the computation to be *actively unfolding* or in a state where its causal dynamics are *poised* to unfold and *make a difference* to the system's future states/outputs.
      *   *Case Behind It:* Frozen disk (no process) vs. overwritten emulation (process happening but outputs discarded). The crank-turned system – *who* is causal? The crank-turner or the table? The reversed computation – where is the causal arrow?
      *   *Why Non-Negotiable:* Distinguishes potential from actualization and defines *when* a computation is "running" in a morally relevant way. Addresses "is it computing *anything*?" for edge cases.

  **Critical Distinctions the Theory Must Make (Operational Requirements):**

  5.  **Identity vs. Multiplicity:** The theory must provide criteria for determining if a computation constitutes one enduring subject or multiple distinct subjects.
      *   *Case Behind It:* The copy problem (1 patient or 2? Does drift matter?), the latency-stretched brain (1 mind or 2 minds? When?).
      *   *Distinction:* *Whether* status exists vs. *how many* subjects have it.

  6.  **Continuity / Binding:** The theory must specify the conditions under which a computation maintains continuity as a single subject over time and space despite changes or distribution.
      *   *Case Behind It:* Neuron replacement (gradual change), latency-stretched brain (degraded/infrequent integration), note-passing collective (scale dependence: 2 vs. a billion?).
      *   *Distinction:* *Whether* a specific computation is ongoing vs. *whether* it's integrated enough to be one subject.

  7.  **Intrinsic Computation vs. Extrinsic Control:** The theory must distinguish computations where state transitions are driven by the system's own causal structure from those where transitions are primarily dictated by an external agent.
      *   *Case Behind It:* The crank-turned emulation (who's "computing"?). The lookup table vs. the locked-in system.
      *   *Distinction:* The *computation itself* vs. *how it is being driven/powered*.

  8.  **Counterfactual Fidelity (Your "Would-Still-Have-Flinched"):** The theory must account for the robustness of the system's responses under perturbation – its ability to generate appropriate state transitions based on inputs and internal state, not just actual history. *(Genuine Desideratum, core to functionalism but emphasizes resilience)*
      *   *Case Behind It:* Locked-in system (counterfactuals intact internally) vs. lookup table (no counterfactuals, just reaction). Is the reversed computation "robust" in the right direction? Does the crank-turner destroy the system's counterfactual structure?
      *   *Distinction:* Actual behavior vs. dispositional/counterfactual properties defining the computation's "point".

  **Potential Conflicts & Tie-Breaking Implications:**

  *   **Substrate Independence + Non-Trivial Realization + Determinacy:** This is the core tension. **Substrate Independence** wants moral weight everywhere computation *can* be. **Non-Trivial Realization** wants to exclude most implementations. **Determinacy** demands a clear answer *now*. *Conflict Example:* Does a rock "trivially realize" a pain simulation? Non-Trivial Realization says no. But what about a *very* slow, thermodynamically possible but unintended pain simulation in the rock? Determinacy and Substrate Independence push for an answer, Non-Trivial Realization struggles. *Tie-Breaker Needed:* Likely a threshold based on causal specificity/efficiency or observer designation for the register's context ("intended systems").
  *   **Continuity/Binding + Determinacy:** Defining the exact point where a distributed system (latency-stretched brain, small note-passing group) becomes one mind vs. two is inherently fuzzy. Determinacy demands a line, Continuity might suggest a gradient. *Tie-Breaker Needed:* Operational thresholds (e.g., integration frequency > X Hz, latency < Y ms) set by the committee, justified by the theory's *direction*.
  *   **Counterfactual Fidelity + Non-Trivial Realization:** The lookup table perfectly mimics *actual* behavior but lacks internal counterfactual structure. Counterfactual Fidelity says it lacks moral weight. Non-Trivial Realization must explain *why* the intended counterfactual-rich description is the "real" one and not the simpler lookup-table description the system also realizes. *Conflict:* Emphasizing Counterfactual Fidelity helps reject trivial realizations, but Non-Trivial Realization is the deeper requirement.

  **Requirement that Knocks Out Popular Views:**

  *   **Non-Trivial Realization:** This is the killer.
      *   **Eliminates:** Naive Pancomputationalism/Radical Functionalism (if *any* computation realized counts, everything has weight - violates Non-Trivial Realization). Some interpretations of IIT (if Φ>0 is sufficient, very simple systems might trivially realize it). Biological Naturalism often ignores the problem entirely by restricting scope to biology.
      *   **Why:** It forces the theory to solve the hardest problem: picking the *real* morally relevant computation from the infinite possibilities. Most popular views either deny the problem exists (pancomputationalism), define it away by scope restriction (biological naturalism), or struggle to provide a non-arbitrary, non-circular criterion (many functionalist & IIT approaches).

  **Distinctions People Wrongly Collapse:**

  1.  **Presence of Status vs. Degree of Status:** A theory must say *if* a system warrants inclusion (any status) *before* arguing *how much* weight it has. The register needs the binary "in/out" first. (e.g., "It's conscious but minimally" still means IN the register).
  2.  **The Computation vs. The Hardware:** Substrate Independence demands this distinction. Confusing them leads to excluding emulations or including rocks based on material.
  3.  **The System vs. The Process:** A frozen emulation (system with potential) is different from a running one (active process). The register must distinguish potential inclusion (maybe) from active inclusion.
  4.  **Moral Status vs. Moral Weight:** Status is binary (in/out of consideration). Weight is scalar (how much it matters *within* the register). Your register primarily needs the status decision. Weight comes later for prioritization.

  **Short Scorecard on Major Families:**

  | Family              | Strengths w.r.t Requirements                     | Fatal Flaws w.r.t Requirements (for Register Use)          |
  | :------------------ | :----------------------------------------------- | :--------------------------------------------------------- |
  | **Functionalism**   | Excels at Substrate Independence, Counterfactual Fidelity, Causal Efficacy. Handles copies, distribution, hardware swap. | **Struggles severely with Non-Trivial Realization.** Why is *this* functional description the "real" one? Lookup table & crank cases problematic. Continuity/Binding often vague. |
  | **Biological Naturalism** | Clear Non-Trivial Realization (only bio systems). Determinacy often assumed. | **Fails Substrate Independence utterly.** Excludes emulations, AIs, collective cases by fiat. Useless for a register covering non-bio systems. |
  | **IIT (Integrated Info)** | Attempts Non-Trivial Realization (Φ>0 threshold). Addresses Binding/Continuity (integration). Determinacy claimed (Φ value). | **Problematic Non-Trivial Realization:** What about systems that *could* have high Φ but don't *now* (frozen)? **Fails Substrate Independence?** Claims to be substrate-independent, but Φ calculation depends critically on micro-level causal structure - may *de facto* exclude efficient digital implementations. **Counterfactual Fidelity?** Focuses on intrinsic cause-effect power, aligns somewhat. **Determinacy?** Φ calculation is computationally intractable for complex systems, violating *practical* determinacy for the register. Lookup table has Φ=0, locked-in may have high Φ. |

  **Recommendation for the Committee:**

  1.  **Adopt Non-Negotiables (1-4):** Substrate Independence, Determinacy, Non-Trivial Realization, Causal Efficacy/Process Dependence are essential baseline criteria. Reject any theory failing these.
  2.  **Acknowledge Conflicts:** Explicitly state that Substrate Independence + Non-Trivial Realization + Determinacy create tension. Decide on a pragmatic tie-breaker upfront (e.g., "For the register, the 'intended' or 'most efficient causal description' of the system is primary, barring evidence of other *actively competing* complex computations").
  3.  **Set Operational Thresholds for Continuity/Binding:** No theory will perfectly solve the latency or small-collective cases. Define measurable thresholds (e.g., max integration latency, min feedback loops) informed by the chosen theory's *direction*.
  4.  **Your "Counterfactual Robustness" is Core:** It's a strong operationalization of Causal Efficacy and key to distinguishing real computations (locked-in) from simulations (lookup table). Frame it as essential for Non-Trivial Realization.
  5.  **Focus on the Distinctions:** Constantly police discussions to separate Status (In/Out) from Weight (How Much), Computation from Hardware, System from Process. This prevents category errors.

  By anchoring the discussion in these requirements and the specific cases, you can force theories to demonstrate their operational utility for the *registry task*, moving beyond abstract consciousness debates. The scorecard shows why functionalism (despite its flaws) is often the starting point – it handles the breadth of cases the register must consider, even if it needs bolstering on Non-Trivial Realization.
