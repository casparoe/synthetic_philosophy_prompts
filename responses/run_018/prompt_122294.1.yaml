prompt: |-
  I am trying to evaluate whether phenomenal properties survive the objection that they are incoherent—what some call "quining" qualia—without simply assuming they exist. Before I read further defenses, I want the full specification of what an adequate theory of qualitative experience must actually deliver if it is to show that qualia are not confused posits. Write the desiderata: the phenomena it must accommodate (including inverted-spectrum scenarios, first-person authority about one's own experiences, and the logical possibility of artificial systems making genuine phenomenal reports), the distinctions it must not collapse (phenomenal versus access consciousness, intrinsic quality versus relational functional role, having a state versus knowing that one has it), the specific incoherence charges it must answer (the private-language problem, the explanatory-gap complaint, and the charge that qualitative similarity is neither transitive nor determinable across subjects), and the external constraints it must satisfy (compatibility with predictive-processing neuroscience, with the intuition that suffering and pleasure carry direct moral weight, and with the conceivability of philosophical zombies). For each, give the motivating case or argument behind it, and flag any pair of desiderata you think cannot be jointly satisfied—especially any tension between accounting for qualitative character in causal-physical terms and preserving its alleged non-relational, intrinsic nature. Then briefly note how an eliminativist denial of qualia, a representationalist reduction to intentional content, and a primitive-property dualism each stand against the list, but keep the weight on the criteria rather than the scorecard.
reasoning: |-
  Okay, the user is asking for a comprehensive list of desiderata for an adequate theory of qualitative experience. They want to evaluate whether phenomenal properties (qualia) can withstand objections like "quining" without assuming their existence. Let me break down their request.

  First, they mentioned specific phenomena the theory must accommodate: inverted spectra, first-person authority, and AI phenomenal reports. For inverted spectra, I need to recall that it argues against functionalism by showing subjective experience can differ despite identical behavior. First-person authority deals with privileged access to one's own mental states. AI reports touch on whether non-biological systems could have qualia, which challenges biological constraints.

  Next, distinctions to maintain: phenomenal vs. access consciousness, intrinsic vs. relational, having vs. knowing. The user wants to ensure the theory doesn't collapse these. For example, Block's distinction shows that not all conscious states are accessible, which is crucial. Intrinsic quality versus functional role addresses whether qualia are defined by internal properties or external relations. The having/knowing distinction prevents over-intellectualization.

  Then, incoherence charges: private language, explanatory gap, similarity issues. Wittgenstein's private language argument claims qualia can't be private objects. The explanatory gap questions how physical processes create subjective experience. Similarity problems challenge intersubjective comparisons. These need thorough responses.

  External constraints: neuroscience compatibility, moral weight of experiences, zombie conceivability. Predictive processing must be integrated. Moral weight ties ethics to qualia, like suffering's badness. Zombies highlight the hard problem—physical duplicates without consciousness.

  Tensions to flag: intrinsic nature vs. causal role. Physical theories explain causally, but qualia are seen as intrinsic. This might be the biggest hurdle. Also, moral weight and zombies could conflict with eliminativism.

  The user also wants brief notes on eliminativism, representationalism, and dualism against these criteria. Eliminativism denies qualia, which might handle neuroscience but fails on moral weight and first-person authority. Representationalism reduces qualia to content, which may address intentionality but struggles with intrinsic nature. Dualism accepts qualia as fundamental, satisfying intrinsicality but clashing with physical compatibility.

  I should check if any desiderata conflict. For example, accommodating AI phenomenal reports and predictive processing might conflict if neuroscience is tied strictly to biology. Also, moral weight and zombies: if zombies are conceivable, it suggests qualia are non-physical, but moral weight assumes their reality, which eliminativism denies. Highlight these tensions.

  The user's deeper needs: they're preparing to evaluate defenses of qualia, so they need a solid framework. They might be looking for weaknesses in theories or seeking which approach balances the criteria best. They’re avoiding assuming qualia exist, so the desiderata must be neutral yet comprehensive. Ensuring each point has a clear rationale is key.
answer: |-
  Here is a comprehensive specification of desiderata for an adequate theory of qualitative experience ("qualia"), designed to evaluate its coherence against objections without presupposing their existence. The desiderata are categorized, with motivations and flagged tensions.

  ### I. Phenomena to Accommodate

  1.  **Inverted Spectrum Scenarios:**
      *   **Desideratum:** The theory must accommodate the logical possibility that two individuals (or states of one individual) could be functionally/behaviorally identical while differing in their qualitative experience (e.g., subjectively seeing red where the other sees green, and vice versa).
      *   **Motivation:** Challenges purely functionalist/behavioral accounts. If qualia are real and intrinsic, functional duplicates might experience differently (Jackson, Shoemaker). Tests if the theory grounds qualia *solely* in functional role.

  2.  **First-Person Authority about One's Own Experiences:**
      *   **Desideratum:** The theory must explain the special, seemingly direct, and epistemically privileged access one has to one's own current qualitative states compared to others' access, without collapsing into infallibility.
      *   **Motivation:** Reflects the core "what it's like" aspect. We report our pains, colors, and moods with confidence others lack. Challenges theories that reduce introspection to mere self-scanning or judgment, making it no different in kind from external perception (privileged access seems more immediate).

  3.  **Logical Possibility of Artificial Systems Making Genuine Phenomenal Reports:**
      *   **Desideratum:** The theory must not conceptually preclude the possibility that a sufficiently complex non-biological system (e.g., AI, robot, alien) could have genuine qualitative experiences and accurately report them.
      *   **Motivation:** Challenges biological chauvinism. If consciousness arises from complex information processing, substrate shouldn't *necessarily* matter. Tests if the theory relies on intrinsic biological properties alone (Block).

  ### II. Distinctions to Maintain

  4.  **Phenomenal Consciousness (P-Consciousness) vs. Access Consciousness (A-Consciousness):**
      *   **Desideratum:** The theory must distinguish between the *subjective qualitative character* of an experience (P-Consciousness) and the *availability of information* within that state for global control, reporting, and reasoning (A-Consciousness).
      *   **Motivation:** Empirical cases (e.g., blindsight, certain frontal lesions, partial epileptic seizures) suggest states can be P-conscious without being A-conscious (or vice versa in potential fringe cases). Collapsing them mischaracterizes the core phenomenon (Block).

  5.  **Intrinsic Quality vs. Relational Functional Role:**
      *   **Desideratum:** The theory must account for the intuition that the qualitative "feel" of an experience (e.g., the redness of red) is intrinsic and not exhausted by its causal relations to stimuli, behavior, other mental states, or its representational content.
      *   **Motivation:** The core of the "hard problem." The "what it's like" seems inherent to the state itself, not just what it *does* or *points to*. Collapsing this distinction risks eliminativism or overly thin representationalism.

  6.  **Having a Phenomenal State vs. Knowing (or Believing) that One Has It:**
      *   **Desideratum:** The theory must distinguish between the occurrence of a phenomenal state itself and the introspective judgment or belief *about* that state.
      *   **Motivation:** Introspection can be inaccurate (change blindness, inattentional blindness, confabulation). One can have a pain without explicitly attending to it as "a pain." Collapsing them over-intellectualizes experience and ignores potential dissociation.

  ### III. Incoherence Charges to Answer

  7.  **The Private Language Problem:**
      *   **Desideratum:** The theory must explain how we can meaningfully talk about and refer to subjective qualitative states without succumbing to Wittgenstein's argument that a truly private object (knowable only to one individual) cannot anchor a public language or even stable private reference.
      *   **Motivation:** Challenges the very coherence of referring to inner, subjective feels. If qualia are private, how can we learn or use words for them consistently? A theory must show how intersubjective grounding is possible.

  8.  **The Explanatory Gap Complaint:**
      *   **Desideratum:** The theory must address why purely physical/functional explanations seem *conceptually insufficient* to fully explain the emergence of subjective experience, even if they correlate perfectly. It must bridge or explain the gap.
      *   **Motivation:** Nagel's "what it's like to be a bat" and Levine's "explanatory gap." Describing neural mechanisms, no matter how detailed, seems to leave the qualitative aspect unexplained. Why *this* process feels like *that*? Tests the theory's explanatory power.

  9.  **Charge that Qualitative Similarity is Neither Transitive nor Determinable Across Subjects:**
      *   **Desideratum:** The theory must account for the structure of phenomenal similarity (e.g., red is more like orange than like green) while addressing the challenge that direct comparison across subjects is impossible, potentially undermining claims about shared similarity relations or making them indeterminate.
      *   **Motivation:** Challenges intersubjective comparisons. If Subject A sees unique hue X between red and yellow, Subject B sees unique hue Y, but both call it "orange," do they experience the *same* similarity relation? How can we know? Tests the theory's account of phenomenal relations and intersubjectivity (Goodman, Quine).

  ### IV. External Constraints to Satisfy

  10. **Compatibility with Predictive Processing (PP) Neuroscience:**
      *   **Desideratum:** The theory must be compatible with, or explainable within, the framework of PP, which posits the brain as a hierarchical prediction-error minimization system governing perception, action, and cognition.
      *   **Motivation:** PP is a leading, powerful paradigm in cognitive neuroscience. A theory of consciousness ignoring or contradicting its core principles would face significant empirical hurdles.

  11. **Compatibility with the Moral Weight of Suffering and Pleasure:**
      *   **Desideratum:** The theory must be compatible with the strong intuition that phenomenal states like pain (suffering) and pleasure carry direct, intrinsic moral weight – that the badness of pain resides in its experiential quality itself.
      *   **Motivation:** Foundational for ethics. If qualia are incoherent or epiphenomenal, it threatens the basis for assigning moral significance to experiences. A theory shouldn't render this intuition inexplicable.

  12. **Compatibility with the Conceivability of Philosophical Zombies:**
      *   **Desideratum:** The theory must address the apparent conceivability (and therefore, according to some, possibility) of a physical/functional duplicate of a conscious being (a zombie) that lacks any phenomenal consciousness whatsoever.
      *   **Motivation:** Chalmers' argument. If zombies are conceivable, it suggests phenomenal properties are not logically supervenient on the physical/functional, posing a major challenge to physicalism. A theory must explain why zombies are impossible or explain the illusion of their conceivability.

  ### Flagged Tensions & Conflicts

  *   **Core Tension: Intrinsic Nature vs. Causal/Functional Integration:** Desiderata 5 (Intrinsic Quality) and 10 (PP Neuroscience) & 12 (Zombies) create a fundamental tension. PP explains states via causal/functional roles (prediction error minimization). Zombie conceivability challenges physical/functional sufficiency. But the *intrinsic* nature of qualia (5) seems precisely what resists functional explanation and makes zombies conceivable. **Satisfying 5 while fully integrating qualia into the causal/physical order described by 10 and deflating 12 appears extremely difficult.** A theory must either:
      *   *Reject* the strong intrinsic view (5) (risking eliminativism or overly thin reduction).
      *   *Reinterpret* causality/functionality to accommodate intrinsic properties non-standardly (e.g., panpsychism, dualism).
      *   *Deny* the conceivability/possibility of zombies (12) convincingly while preserving the "what it's like" (5).
      *   *Reconceive* the physical such that intrinsic properties are fundamental within it (Russellian monism).
  *   **Moral Weight vs. Eliminativism/Epiphenomenalism:** Desideratum 11 (Moral Weight) strongly conflicts with theories that deny the reality (eliminativism) or causal efficacy (epiphenomenalism) of qualia. If qualia don't exist or don't cause anything (including distress behavior), the basis for their *direct* moral weight evaporates.
  *   **First-Person Authority vs. Neuroscientific Reduction:** Desideratum 2 (First-Person Authority) might be challenged by a purely neural reduction (10) that equates experience with a brain state accessible in principle to external observers. How is *my* access privileged if it's just accessing a physical state?
  *   **AI Reports vs. Biological Constraints:** While 3 demands AI qualia are possible, strict interpretations of neuroscience (10) or moral weight (11) based on biological pain systems might create friction, though less inherent conflict than the core tension.

  ### Brief Notes on Major Theories vs. Desiderata

  *   **Eliminativism (Denial of Qualia):** Rejects the reality of qualia (Dennett). *Struggles With:* Accommodating phenomena (1, 2, 3), maintaining distinctions (4, 5, 6), moral weight (11), and the intuition behind the conceivability of zombies (12). May handle neuroscience (10), private language (7), and similarity indeterminacy (9) by dissolving the target.
  *   **Representationalism (Reduction to Intentional Content):** Qualia are nothing over and above representational properties (e.g., Tye, Dretske). *Struggles With:* Inverted spectra (1 - must deny possibility or find representational difference), intrinsic quality (5 - collapses into relational role), explanatory gap (8 - why does *this* representation have *this* feel?), potential conflicts with strict A/P distinction (4). May handle neuroscience (10), AI (3), first-person authority (2 as judgment), private language (7 via public content).
  *   **Primitive-Property Dualism (e.g., Chalmers):** Qualia are fundamental properties (perhaps proto-mental) that accompany certain physical states but are not reducible to them. *Struggles With:* Integration with neuroscience (10 - how do fundamental qualia interact/correlate?), causal closure of physics (potential epiphenomenalism threatening moral weight 11), potentially private language (7 - how refer to fundamental private properties?). Excels at accommodating phenomena (1, 2, 3), distinctions (4, 5, 6), explanatory gap (8 - it exists!), and zombie conceivability (12).

  This framework provides the rigorous criteria needed to assess whether any defense of qualia successfully demonstrates their coherence against objections, focusing on what the theory *must* explain and resolve, highlighting the central difficulty of reconciling intrinsic feel with causal-physical integration.
