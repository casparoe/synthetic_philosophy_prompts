answer: |-
  Your description captures a sophisticated and historically significant phenomenon in scientific change, and philosophy of science **does recognize it as a distinct configuration** with specific conceptual boundaries. The closest established concept is **"theoretical domestication"** or **"defensive assimilation"**, but it requires unpacking to address your precise concerns. Below is a systematic analysis:

  ### Core Phenomenon: Defensive Equivalence Manufacturing
  This occurs when defenders of an old theory (T1) absorb the predictive successes of a rival theory (T2) by:
  1.  **Admitting T2's empirical adequacy** (no denial of observations).
  2.  **Constructing elaborate auxiliary hypotheses** (A) within T1's ontology.
  3.  **Claiming T1+A achieves predictive equivalence** with T2.
  4.  **Arguing T2 is merely a "notational variant" or "computational shortcut"** for T1+A, denying T2 offers new ontology or genuine progress.
  5.  **Rejecting T2's claimed unifications/explanatory gains** as illusory or irrelevant.

  ### Established Terminology & Key Thinkers
  1.  **Larry Laudan's "Domesticating Maneuvers"** (from *Progress and Its Problems*, 1977):
      *   **Your core concept.** Laudan explicitly identifies this as a strategy to resist theory replacement. He critiques it as epistemically problematic when the auxiliary hypotheses (A) are *ad hoc*, contrived, and lack independent motivation or testability.
      *   **Distinguishing Feature:** Focuses on the *tactic* used to defend a theory *against progress claims*, not just the existence of alternatives.

  2.  **Imre Lakatos's "Degenerating Research Programme"** (from *The Methodology of Scientific Research Programmes*, 1970):
      *   A "degenerating" programme exhibits this pattern: its "protective belt" of auxiliary hypotheses becomes increasingly complex and *ad hoc* solely to accommodate anomalies and match rivals, yielding no novel predictions. Caloric theory adding ever-more complex distribution rules to mimic kinetic predictions is paradigmatic.
      *   **Distinguishing Feature:** Embeds the phenomenon within a broader account of how research programmes evolve and compete over time, emphasizing predictive *novelty* as the key criterion for progress.

  3.  **Pierre Duhem / W.V.O. Quine (Underdetermination & Holism):**
      *   Provides the *background condition*: any theory can be saved from refutation by adjusting auxiliaries (Duhem-Quine thesis). Your case is a *specific application* of this holism, used *strategically* to deny progress.
      *   **Distinguishing Feature:** Your phenomenon is *motivated resistance*, not just the logical possibility of equivalence. It leverages underdetermination *actively* for conservative purposes.

  ### Sharpening the Boundaries: What This Phenomenon IS and IS NOT

  *   **VS. Ordinary Empirical Underdetermination:**
      *   Underdetermination is the *logical possibility* that multiple theories fit the same data. Your phenomenon is an *actual historical strategy* employed by a scientific community to *exploit* this possibility defensively.
      *   Underdetermination is passive; this is *active construction* of equivalence using *ad hoc* auxiliaries.
      *   Underdetermination doesn't inherently deny progress; this strategy explicitly uses equivalence *to deny progress*.

  *   **VS. Successful Theoretical Reduction (à la Nagel):**
      *   **Genuine Reduction (e.g., Thermodynamics to Statistical Mechanics):** T1 (higher-level) is *derived* from T2 (lower-level) plus bridge laws. T2 explains T1's laws *and* its successes, often simplifying ontology. The reduction is *explanatory* and *ontologically unifying*.
      *   **Defensive Assimilation (Your Case):** "Derivation" is *forced* and *artificial* (T1 + contrived A mimics T2). It *lacks explanatory power* – caloric + complex distributions *describes* kinetic results but doesn't *explain why* heat flows or work converts. It *preserves* the old ontology (caloric fluid) rather than *reducing* it to a more fundamental one (molecules). It *blocks*, rather than enables, unification.

  *   **VS. Kuhn's Incommensurability:**
      *   **Your Key Insight is Correct:** This phenomenon *challenges a simplistic reading of Kuhn*. Both sides *understand* each other's claims and data; translation is *possible* (even if contrived). Progress resistance stems not from mutual incomprehension, but from a *disagreement about what constitutes genuine explanation, ontological parsimony, and progress*.
      *   **It Represents a Boundary Case/Failure Mode for *Strong* Incommensurability:** It shows that translation *can* occur, even across paradigms, but that translation alone is insufficient for resolving debates about progress. Kuhn's later work (e.g., on "local incommensurability" of taxonomies or values) better accommodates this: while communication is possible, core values (e.g., what counts as a "good explanation," "real unification," or "non-ad-hoc") may differ, preventing consensus on progress *despite* translatability and empirical agreement. The debate shifts to the *interpretive framework* itself.

  ### Why It's a Distinct Phenomenon & Its Significance
  1.  **Distinctiveness:** It combines specific elements: empirical agreement, translatability (however forced), the *active construction* of equivalence using *ad hoc* auxiliaries, and the explicit *use of this equivalence to deny ontological/explanatory progress*. It's a *socio-epistemic strategy* within theory competition.
  2.  **Significance:**
      *   **Epistemic Stalling:** It can genuinely slow scientific progress by obscuring the superior explanatory power and unifying potential of the new theory behind a façade of equivalence.
      *   **Highlights Non-Empirical Criteria:** It forces debates onto the terrain of theory virtues: explanatory depth, ontological economy, non-ad-hoc-ness, fertility, unification. These are crucial but not settled by data alone.
      *   **Clarifies Scientific Progress:** Progress often lies not in *new predictions* alone (which can be mimicked), but in *explanatory unification*, *ontological simplification*, and *increased coherence* across domains (e.g., linking heat and work directly via mechanics).
      *   **Challenge to Positivism:** Demonstrates the insufficiency of focusing solely on predictive equivalence or observational language. Meaning and progress involve deeper structural and explanatory features.

  In conclusion, **Laudan's "domesticating maneuvers"** is the most direct label for the *tactic* you describe. Situated within **Lakatos's framework of degenerating programmes**, it highlights the *degenerative* nature of such defenses. This phenomenon exploits the **Duhem-Quine underdetermination holism** but transforms it into an active resistance strategy. It challenges strong readings of **Kuhnian incommensurability** by demonstrating translatability while simultaneously revealing the *deeper disagreements about theory virtues and progress criteria* that persist even when translation is possible. It is distinct from both passive underdetermination and genuine reduction. It represents a genuine, historically documented "failure mode" where scientific communities can resist objectively superior frameworks through sophisticated, but ultimately epistemically deficient, defensive maneuvers.
