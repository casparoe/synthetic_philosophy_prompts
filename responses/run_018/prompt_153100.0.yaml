answer: |-
  Here's a practical, step-by-step decision procedure designed for your co-op volunteer role. It's structured as 10 sequential questions (aim for 2 mins/question), with clear exit points. **Key flags**: 🚩 = Judgment call, ⚖️ = Hand to committee, ✅ = Stay inside rules, 🔄 = Jump out (propose rule change).

  ---

  ### **The "Dead End or Just Lazy?" Decision Procedure**
  *(Run with co-chair; max 20 mins total)*

  1. **What’s the literal request?**  
     - *Write exact wording: "Replace boiler with heat pump" or "Pay legal fees for Tenant X".*  
     - 🚩 *Judgment call: Avoid rephrasing to force an answer.*

  2. **Is it explicitly covered in the by-laws?**  
     - *Scan for matching keywords (e.g., "boiler", "repairs", "legal costs").*  
     - ✅ **If YES → Apply rule → STOP** (e.g., "By-law 5.3 covers boiler repairs").  
     - ✅ **If NO → Proceed to Q3**.

  3. **Can it be squeezed into an existing category?**  
     - *Look for analogous rules (e.g., "heat pump" as "heating system repair").*  
     - 🚩 *Judgment call: Is this a stretch?*  
     - ✅ **If YES → Apply analogy → STOP**.  
     - ✅ **If NO → Proceed to Q4**.

  4. **Is it explicitly forbidden?**  
     - *Check for prohibitions (e.g., "Funds not for personal use").*  
     - ✅ **If YES → Deny request → STOP**.  
     - ✅ **If NO → Proceed to Q5**.

  5. **Does it violate core co-op principles?**  
     - *Review by-laws' preamble/mission (e.g., "collective benefit", "fairness").*  
     - 🚩 *Judgment call: Interpret broadly but reasonably.*  
     - ✅ **If YES → Deny → STOP** (e.g., "Personal legal fees harm collective funds").  
     - ✅ **If NO → Proceed to Q6**.

  6. **Is it required by external law/safety?**  
     - *Check regulations (e.g., gas safety, building codes).*  
     - ✅ **If YES → Approve → STOP** (Law overrides by-laws).  
     - ✅ **If NO → Proceed to Q7**.

  7. **Has precedent resolved this?**  
     - *Check past decisions in your spreadsheet.*  
     - ✅ **If CLEAR precedent → Follow it → STOP**.  
     - ✅ **If NO/UNCLEAR → Proceed to Q8**.

  8. **Would approving create a slippery slope?**  
     - *Ask: "If we say yes, will we *have* to approve 10 similar requests?"*  
     - 🚩 *Judgment call: Be honest about consequences.*  
     - ✅ **If NO → Proceed to Q9**.  
     - 🔄 **If YES → Jump out** (Rules can’t handle this fairly).

  9. **Is it about values, not logic?**  
     - *Ask: "Is the stalemate due to conflicting priorities?" (e.g., cost vs. environment).*  
     - ⚖️ **If YES → Hand to committee → STOP** (Needs policy debate).  
     - ✅ **If NO → Proceed to Q10**.

  10. **Final call: Are the rules silent/contradictory?**  
      - *Re-read by-laws: Is there truly *no path* to yes/no?*  
      - 🔄 **If SILENT/CONTRADICTORY → Jump out** (Dead end: propose rule change).  
      - ✅ **If NOT → Stay inside rules** (You’re likely overcomplicating it).

  ---

  ### **What This Procedure CAN’T Do**
  - ✖️ Judge if a *new rule* is fair or practical (committee’s job).  
  - ✖️ Resolve emotional/political disputes (needs mediation).  
  - ✖️ Replace legal advice (e.g., tenancy laws override by-laws).  
  - ✖️ Eliminate all judgment calls (but flags where they happen).

  ---

  ### **Applied to Your Cases**

  #### **Case 1: Solar Panels on Roof**  
  - **Q1:** "Install solar panels on shared roof."  
  - **Q2:** Not explicitly covered (1970s rules ignore renewables).  
  - **Q3:** Analogous to "structural improvements"? 🚩 *Judgment: Weak analogy*.  
  - **Q4:** Not forbidden.  
  - **Q5:** Aligns with "collective benefit"? 🚩 *Judgment: Maybe, but vague*.  
  - **Q6:** Not legally required.  
  - **Q7:** No precedent.  
  - **Q8:** Sets precedent for other upgrades → **🔄 Jump out** (Propose "sustainability improvements" rule).

  #### **Case 2: Legal Fees for Neighbour’s Dispute**  
  - **Q1:** "Emergency cash for Tenant X’s legal fees."  
  - **Q2:** Not covered (rules mention building repairs only).  
  - **Q3:** Analogous to "emergency fund"? 🚩 *Judgment: No—personal, not structural*.  
  - **Q4:** Not explicitly forbidden, but...  
  - **Q5:** Violates "collective funds for collective use" → **✅ Stay inside → DENY** (Core principle breach).  
  - *No need for further steps. (Honest, even if you dislike it: by-laws likely support denial.)*

  #### **Case 3: Ambiguous Boiler → Heat Pump**  
  - **Q1:** "Replace gas boiler with heat pump."  
  - **Q2:** Rules say "like-for-like gas repairs." Not identical.  
  - **Q3:** Analogous to "heating system repair"? 🚩 *Judgment: Contentious—same function, different fuel*.  
  - **Q4:** Not forbidden.  
  - **Q5:** Conflict: "Cost efficiency" vs. "Modernization."  
  - **Q9:** ⚖️ **Hand to committee** (Values clash: environment vs. budget).  
  - *Why not dead end? Rules could stretch to cover it, but requires value trade-offs.*

  ---

  ### **Tips for Your Spreadsheet**
  - **Track outcomes**: Tag requests as `INSIDE`, `JUMP OUT`, or `COMMITTEE`.  
  - **Co-chair role**: They must concur on 🚩 judgment calls.  
  - **When jumping out**: Draft a 1-sentence rule proposal (e.g., "Allow non-gas heating if cost-neutral").  

  This forces clarity: if you’re stuck after Q10, the rules are the problem—not you. No philosophy degree needed, just a timer and honesty about gray areas.
