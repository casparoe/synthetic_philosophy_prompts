prompt: |-
  hey — hoping you can help me think something through before thursday.

  I've just joined the ethics panel at my food co-op (about 4,000 members; we publish short non-binding "should members do X?" notes that people actually read). I've read through two years of minutes and I cannot work out what rule we've been running. The cases so far:

  1. Driving 2km to the shops when you could walk. Ruling: don't. The minutes say the extra fuel adds a real if imperceptible increment of harm, spread across zillions of people, and that no single driver is pivotal for anything — and that this doesn't get you off the hook. They explicitly flag that this is different from case 2: here there's no threshold, you're adding a tiny increment, not gambling on being the one who tips an order.

  2. One 200g pack of factory-farmed mince from our own butcher counter. They reorder in whole-animal units, so any given pack has maybe a 1-in-700 shot of nudging the next order up by one animal. Ruling: don't.

  3. A leather belt from an online closing-down sale: shop shuts next week, owner retiring, no reorder, no reinvestment of the money, plain packaging, and the member works from home so basically nobody will ever see her wearing it. Ruling: no obligation — buy it, don't feel bad.

  4. Voting. Ruling: you should vote in a close election; no obligation to vote in one that's certain to be 70/30. One member filed a dissent saying that's inconsistent: if a 1-in-700 shot is enough in case 2, we can't suddenly get squeamish about a 1-in-a-million shot here.

  5. Chicken from a new supplier whose ordering system is opaque — might be whole-bird thresholds, might be weight-based, might be a franchise where your purchase changes nothing at all. Ruling: don't, because you can't rule out being pivotal and skipping is cheap.

  6. Six members splitting a whole pig from a farmer, where if any one drops out the other five would buy a smaller joint instead. Ruling: don't, and the minutes add "this one isn't marginal — you're each forking over a sixth of the animal."

  New case, which is mine to draft: the summer party. The beef was pre-ordered and paid for in March, non-refundable, 40kg from a local farm; it's a one-off, the farm's herd plan is fixed for the year and won't respond to anything about the party; whatever isn't eaten goes to a food bank whose users' demand doesn't feed back into any order anywhere. So the production channel is dead and the money is long gone. But the member in question writes our newsletter column, sits on the board, and three other members have literally said they're waiting to see what she does before they decide — including a new member who's been going back and forth. Her choice will be public.

  So: does she have to skip the burger? What rule are we actually running, and what other rules fit those six verdicts just as well? What does each of them say about the party? Give me your best guess with the closest analog among 1–6, and if our precedents genuinely don't decide it, tell me what we'd be committing ourselves to with each answer. Also tell me what further case I should put on the agenda that would flush out which rule we're on. And I'd like to know whether it matters that it's *her* — board member, columnist — rather than some random new member at the same table, or whether that's a red herring.
reasoning: |-
  Okay, let me start by understanding the user's problem. They're on an ethics panel for a food co-op and need to draft a ruling for a new case about the summer party. They've provided six past cases with rulings, and they want to know which precedent applies here. The key is to figure out the underlying ethical rule from those cases and apply it consistently.

  First, I need to parse each of the six cases to identify the pattern. Case 1 involves driving when walking is possible. The harm is imperceptible but real, and even though no single driver is pivotal, they still say "don't." Case 2 is about factory-farmed mince where there's a small chance (1-in-700) of nudging an order. Again, "don't." Case 3 allows buying the belt because there's no impact—shop closing, no reorder, no visibility. Case 4 says vote only in close elections, dismissing the dissent that compared it to Case 2. Case 5 is a "don't" because the supplier's system is opaque, so pivotal risk can't be ruled out. Case 6 is clear: each member is directly responsible for a sixth of the pig.

  The common thread seems to be about causal responsibility and avoidability. Cases where the action has a non-zero chance of causing harm (even tiny) or involves direct responsibility (Case 6) get a "don't." If the action has no possible impact (Case 3) or the harm is already locked in (Case 4 when not close), it's allowed. The panel is using a rule that focuses on the potential to influence outcomes, not just the act itself.

  Now, the summer party case: The beef is pre-ordered, non-refundable, production is fixed, and leftovers go to a food bank with no feedback loop. So, eating the burger doesn't change anything—no additional animals are affected. But here's the twist: the member's choice is public and might influence others. Three members are waiting to see what she does, including a new member who's unsure. So her action could have a ripple effect on others' future choices.

  Under the direct causal rule (like Cases 3 and 4 when not pivotal), eating the burger should be fine because the production harm is already done. But the influence on others introduces an indirect causal path. If her eating the burger encourages others to consume meat in future scenarios where they might be pivotal, that's a problem. Case 5 is relevant here because the panel ruled "don't" when pivotal risk couldn't be ruled out. Similarly, her influence could lead to future pivotal actions by others.

  The user also asks if her being a board member and columnist matters. Absolutely. Her visibility means her actions set a precedent and influence co-op norms. Case 4's voting example shows that individual impact matters when it can tip the scale. Her influence here could tip others' behaviors, making her pivotal in a different way.

  The closest analog is Case 3 (belt) for the direct impact—none. But the influence angle makes it more like Case 5 (opaque supplier) because the downstream effects are uncertain but possible. The panel would need to decide if they care about symbolic actions and norm-setting. If they rule "okay to eat," they might be opening doors to cases where individual actions influence others, potentially leading to harm. If they say "don't," they're emphasizing role-modeling and indirect responsibility.

  To flush out the underlying rule, proposing a case about a symbolic boycott where the direct impact is nil but influence is high would help. For example, refusing a plastic straw at a conference where it's already paid for but visible to others. That tests whether influence alone creates obligation.

  In summary, the panel's rule centers on avoidable impact and causal pathways. For the summer party, her eating the burger has no direct impact, but her influence could lead others to make pivotal choices later. Given her role, the ethical burden is higher. The safe move is to advise skipping the burger to avoid endorsing meat consumption, aligning with the precautionary approach seen in Cases 2 and 5.
answer: |-
  Based on your precedents, here's the breakdown for the summer party case:

  ### 1. **The Rule You're Likely Running: "Avoidable Pivotal Impact + Norm-Setting"**
     - **Core Principle:** An action is ethically problematic if either:
       - **(A)** It has a *non-trivial chance* of being *pivotal* in causing direct harm (Cases 2, 5, 6), *or*
       - **(B)** It *publicly endorses* a harmful norm when alternatives exist, *especially* if the actor has influence (implied in Case 5’s "skipping is cheap" and Case 4’s focus on close elections).
     - **Why this fits all 6 cases:**
       - *Case 1 (Driving):* Rejected under (A) – tiny harm increment, but *no pivotal chance* is noted. This is the outlier, but minutes explicitly contrast it with threshold cases.
       - *Case 2 (Mince):* (A) – 1/700 chance is deemed non-trivial pivotal risk.
       - *Case 3 (Belt):* Allowed – *zero* pivotal chance (no reorder) *and* no norm-setting (private act).
       - *Case 4 (Voting):* (A) – Obligation only when pivotal chance is high (close election). Dissent rejected because 1-in-a-million is trivial vs. 1/700.
       - *Case 5 (Opaque Chicken):* (A) – Precautionary "don't" since pivotal risk *can't be ruled out*.
       - *Case 6 (Pig Share):* (A) – *Direct* pivotal impact (1/6 of animal).

  ### 2. **Summer Party Ruling: She Should Skip the Burger**
     - **Closest Analog:** **Case 5 (Opaque Chicken)** + **Case 4 (Voting Influence)**.
       - **Direct Impact (Beef):** Like Case 3 (belt) and Case 4 (landslide election) – *zero pivotal risk*. The beef exists; eating it changes nothing. *This alone would suggest "no obligation".*
       - **Indirect Impact (Influence):** Here’s the crux. Her choice is public and explicitly influences others (3+ members, including a wavering new one). This triggers **Principle (B): norm-setting**. 
         - *Case 5*'s "skipping is cheap" applies: avoiding the burger is easy, but her *not* skipping could normalize meat consumption for others who *will* face pivotal choices later.
         - *Case 4* shows you care about influence in close contexts – here, her influence is direct and acknowledged.
     - **Why "Don't"?:** 
       - She’s not pivotal for *this* beef, but she’s pivotal for *others' future choices*. Her endorsement risks causing *future* pivotal harm (e.g., new member buys mince next week because "even the columnist ate beef").
       - As a leader (board/columnist), her actions set co-op norms – echoing Case 5’s emphasis on avoiding avoidable risks to ethics.

  ### 3. **Does Her Role Matter? Absolutely.**
     - **Not a red herring.** Cases 4 (voting) and 5 (opaque supplier) imply *context matters*. Her visibility amplifies norm-setting (Principle B). A random member’s choice would likely be Case 3 (private, no impact). But her role makes this a *public test case* for the co-op’s values. Skipping reinforces the ethics you advocate (e.g., Case 2’s mince ruling).

  ### 4. **What a "Skip" Ruling Commits You To:**
     - **Expanding Principle (B):** You’d formalize that *visible figures must avoid even harmless acts* if they could incentivize future harm by others. This risks "slippery slope" critiques (e.g., "Can no leader ever eat meat at co-op events?").
     - **Consistency Check:** If she skips, is this *more* or *less* cautious than Case 4? Arguably *less* – voting in a landslide has 0.0001% pivot chance; her influence here has higher odds (3+ people).

  ### 5. **What an "Eat" Ruling Commits You To:**
     - **Narrowing Ethics to Direct Causation:** You’d say only *provable pivotal harm* matters (rejecting norm-setting). This undermines Case 5 (where pivothood is unproven but possible) and Case 4 (voting’s "civic duty" beyond pure pivotality).
     - **Risk:** Makes ethics hyper-individualistic. E.g., "I’ll buy the mince if someone else might trigger the order anyway."

  ### 6. **Test Case to Flush Out the Rule:**
     - **Propose:** *"A member wears a fur coat (bought used) to the co-op’s annual meeting. Fur is never reordered; production is unaffected. But it’s highly visible, and members associate fur with animal cruelty. Does this violate our ethics?"*
       - **Why it works:** Direct impact = zero (like Case 3/belt), but norm-setting = high (like summer party). Forces a choice:
         - If "no violation," you prioritize direct causation.
         - If "violation," you embrace norm-setting (Principle B).

  ### Final Recommendation for Your Draft:
  > "While consuming the beef itself cannot affect production (as in Case 3), the member’s public role and documented influence over others create a material risk of normalizing choices that *do* cause pivotal harm (as in Cases 2 and 5). Since abstention is low-cost and aligns with our prior rulings on avoiding avoidable harm, we recommend skipping the burger. This is not primarily about the animal already slaughtered, but about the signal sent to members whose future choices may directly impact animal welfare."

  **Key nuance:** Frame it as *risk mitigation* (her influence could lead to future Case 2/5 scenarios) – not personal guilt. This bridges your precedents while addressing the unique influence factor.
