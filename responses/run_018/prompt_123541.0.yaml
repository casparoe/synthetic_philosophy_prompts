prompt: |-
  I'm running a session for my phil-lang MA students — they've done Frege and Austin but Grice is brand new to them. I want to teach saying vs implicating and the cooperative principle, but I don't want to just roll out the usual exam-passing example. Instead I want to build the session arround the tension between generalized and particularized conversational implicatures: specifically, whether GCIs are genuinely Gricean-calculable or just conventional shortcuts that have lost their calculability. Plan the explanatory arc: what idea must be in place before speaker meaning can be seperate from sentence meaning, the single carrying example (not the "some students failed" one — explain why that one actually obscures the point), the misconceptions they'll form in order — I'm guessing first that "implicature is just hidden literal meaning", then that cancelability means the speaker can deny it without contradiction — and where exactly in the sequence to defuse each. Tell me what to leave out at this level (probably the formal derivation of particularized implicatures?), and one end-of-session check that shows they've understood the calculability problem rather than just naming the maxims. Also please flag how confident you are in this teaching plan and identify the point you're least sure about.
reasoning: |-
  We are teaching Grice's theory of conversation, focusing on the distinction between saying and implicating, the Cooperative Principle, and the tension between generalized and particularized conversational implicatures (GCIs vs. PCIs). The key issue is whether GCIs are still calculable (as per Grice) or have become conventionalized shortcuts.

  Explanatory Arc:

  1. **Foundation: Separating Speaker Meaning from Sentence Meaning**
     - Start with the idea that language is not just about the literal meaning of words and sentences but about how speakers use them in context to communicate more than what is said.
     - Introduce the notion of speaker meaning: what the speaker intends to communicate by uttering a sentence in a particular context.
     - Contrast with sentence meaning: the conventional, context-invariant meaning of the sentence (its truth-conditions).
     - Use an example that clearly separates the two. Avoid the classic "some students failed" because it can lead to confusion (students might think that "some" logically implies "not all", which it doesn't in formal logic, but in natural language, we often interpret it that way). Instead, use an example that doesn't involve quantifiers.

     Example: 
     - Speaker A: "I'm out of petrol."
     - Speaker B: "There's a garage around the corner."
     - What is said: There is a garage around the corner (at some location nearby).
     - What is implicated: The garage is open and sells petrol; so you can get petrol there.

     Why this example? It clearly shows that the speaker (B) is not just stating a fact about the garage's location but implying that it is a solution to A's problem. The connection is not in the words but in the context and shared goals.

  2. **The Cooperative Principle and Maxims**
     - Introduce the Cooperative Principle: "Make your conversational contribution such as is required, at the stage at which it occurs, by the accepted purpose or direction of the talk exchange in which you are engaged."
     - Break down the maxims: Quality, Quantity, Relation, and Manner. Explain each briefly.
     - Emphasize that implicatures arise when a speaker appears to violate a maxim but is assumed to be cooperative. The hearer then infers an implicature to make sense of the utterance.

  3. **Introducing Implicatures: Particularized vs. Generalized**
     - Define:
       - Particularized Conversational Implicature (PCI): Depends heavily on the specific context. (e.g., the petrol example above)
       - Generalized Conversational Implicature (GCI): Arises without special context, by default. (e.g., "I broke a finger" usually implicates that it was my own finger)
     - Use a clear example for GCI that is not the "some" example. How about:
       - "John turned the key and the engine started." -> Typically implicates that the turning caused the starting and in that order (temporal and causal). But note: this might be conventionalized? We'll come back to that.

  4. **The Problem with the Classic "Some" Example**
     - Why avoid "some"? Because in logic, "some" does not entail "not all", but in natural language, we often take it that way. However, Grice argues that this is an implicature, not part of the meaning of "some". The problem is that students might think that "some" has a hidden meaning (conventional) rather than being derived by inference. Also, the implicature is cancelable: "Some students failed; in fact, all did." This cancelability is a key feature of implicatures.

  5. **Addressing Misconceptions in Sequence**
     - **Misconception 1: Implicature is just hidden literal meaning.**
       - When: After introducing the idea of implicature, especially with GCIs.
       - How to defuse: Use the cancelability test. Show that an implicature can be canceled without contradiction, but a literal meaning cannot. For example:
          - GCI example: "I ate some of the cookies." -> Implicates "not all". But we can cancel: "I ate some of the cookies; in fact, I ate them all." (No contradiction, so it's not literal meaning.)
          - Contrast with a word that has a literal entailment: "I ate some but not all of the cookies" vs. "I ate some and in fact all of the cookies" (the latter is contradictory only if we take "some" to entail "not all", which it doesn't). But note: the implicature is cancelable, so it's not part of the literal meaning.
       - Also, use the petrol example to show that the implicature is context-dependent and not in the words.

     - **Misconception 2: Cancelability means the speaker can deny it without contradiction, so it's always possible.**
       - When: After introducing cancelability.
       - How to defuse: Explain that cancelability is a property of conversational implicatures, but it doesn't mean that in every context the speaker can cancel without affecting the conversation. Sometimes, canceling an implicature can be odd or uncooperative. Also, note that conventional implicatures (like "but" vs. "and") are not cancelable. Example: "She was poor but honest" implicates a contrast. Try to cancel: "She was poor but honest, and there was no contrast between being poor and honest." This is odd and doesn't work. So, cancelability helps distinguish conversational implicatures from conventional ones and from entailments.

  6. **The Tension: Are GCIs Gricean-Calculable or Conventional?**
     - Present the debate: Grice thought all implicatures are calculable (i.e., derivable from the maxims and context). But for GCIs, they seem so automatic that they might have become conventional (like a default meaning).
     - Example: Consider the word "a" in "I broke a finger". The GCI is that it was the speaker's finger. But is this still calculated by the maxims? Or is it a conventional association?
     - Arguments for calculability: 
          - It is cancelable: "I broke a finger yesterday, but it wasn't mine; it was my friend's." (This is acceptable, though surprising.)
          - It can be reinforced: "I broke a finger, my own."
          - It is context-dependent: In a context where we are talking about breaking mannequin fingers, the GCI might not arise.
     - Arguments against: 
          - The inference is so automatic that it feels like part of the meaning. It might be a shortcut that no longer requires calculation.
     - Key point: Even if automatic, the Gricean view is that the inference is still based on the maxims and context, and that's what makes it an implicature.

  7. **What to Leave Out**
     - Formal derivations of particularized implicatures: At this level, we don't need to go through every step of the reasoning for complex PCIs. Focus on the principles and the calculability issue for GCIs.
     - Conventional implicatures: Mention briefly to contrast with conversational implicatures, but don't go into detail (e.g., words like "but", "therefore").
     - The maxims in extreme detail: Focus on the main four and how they generate implicatures, not sub-maxims.

  8. **End-of-Session Check**
     - To test understanding of calculability (not just naming maxims):
          - Present a new example: "She took out her key and opened the door." 
            - Ask: What is implicated? (Order: first took key, then opened; and possibly causal: using the key to open)
            - Then ask: Is this a PCI or GCI? (GCI because it doesn't require special context)
            - Then: How would a Gricean explain the derivation? (Maxim of Manner: be orderly; so the order of events is reflected in the order of the clauses. Also, Relation: the two events are connected in a relevant way.)
            - Challenge: Can they cancel the implicature? "She took out her key and opened the door, but not in that order and not using the key." (This is acceptable? It's odd but not contradictory. So it's cancelable, hence conversational implicature.)
            - Then ask: Why might someone argue that this GCI is not really calculated every time? (Because it's so automatic.) And why does it matter? (Because if it's conventional, it's not a Gricean implicature anymore.)

     - This check forces them to apply the concepts and grapple with the tension.

  9. **Confidence and Uncertainty**
     - Confidence: The overall arc is logical and builds from basics to the complex issue. Using the petrol example and avoiding the "some" example should help. The misconceptions are common and addressed in the literature, so tackling them is good.
     - Least sure about: The choice of the GCI example for the end-of-session check. The "and then" example is standard, but some linguists (e.g., in the relevance theory camp) argue that the temporal and causal implicatures are not cancellable in the same way. However, for teaching purposes, it's widely accepted. Also, the example might be too similar to the "key and engine" example? But it's a good one to test calculability.

  Plan Outline:

  1. Introduction: Speaker meaning vs. sentence meaning (with petrol example) [15 min]
  2. The Cooperative Principle and Maxims [10 min]
  3. Implicatures: PCI vs. GCI (with examples) [10 min]
  4. Addressing Misconception 1: Implicature is not hidden literal meaning (using cancelability) [10 min]
  5. Addressing Misconception 2: Cancelability doesn't mean it's always easy or appropriate (using "but" example) [5 min]
  6. The Tension: Are GCIs still calculable? [15 min]
  7. End-of-session check and discussion [15 min]

  Total: 80 min (adjust as needed)

  Note: Be prepared for questions about how GCIs are different from conventional implicatures and whether they are really cancellable in practice. Emphasize that the theoretical distinction is important even if in practice GCIs feel automatic.
answer: |-
  ### Teaching Plan: Grice on Saying vs. Implicature and the GCI/PCI Tension  
  **Objective:** Build understanding of conversational implicature (CI) with a focus on the tension between generalized (GCI) and particularized (PCI) implicatures, emphasizing whether GCIs retain Gricean calculability or become conventional shortcuts.  

  ---

  ### **Explanatory Arc**  
  **Total Session Time:** 90 minutes  
  **Pedagogical Approach:** Gradual complexity, misconception-driven, with active debate.  

  #### **1. Foundational Idea: Separating Speaker Meaning from Sentence Meaning** (15 min)  
  - **Goal:** Establish that linguistic meaning ≠ speaker intention.  
  - **Tool:** Use **Austin’s locutionary/illocutionary distinction** (known) as a bridge.  
    - *Example:*  
      - *Sentence:* "It’s cold in here."  
      - *Literal meaning (sentence):* Temperature is low.  
      - *Speaker meaning (context):* Could be a request to close the window, a complaint, etc.  
  - **Why this first?** Students need to see that meaning is co-created by context and cooperation before implicature makes sense.  
  - **Key Question:** "How does context 'add' meaning beyond words?"  

  #### **2. Introducing Grice: Cooperative Principle (CP) and Maxims** (10 min)  
  - **Goal:** Frame communication as a rational, cooperative practice.  
  - **Content:**  
    - CP: "Make your contribution such as is required..."  
    - Maxims (Quality, Quantity, Relation, Manner) as heuristics for efficient communication.  
  - **Demo:**  
    - *Scenario:* A says: "Where’s my sandwich?" B: "The dog looks happy."  
    - *Implicature (PCI):* B implies the dog ate it (via Relevance maxim).  
  - **Why here?** Sets up calculability: Implicatures are inferences triggered by apparent maxim violations.  

  #### **3. Saying vs. Implicating: A Clean Example** (15 min)  
  - **Avoid "some students failed"** (it obscures calculability by blurring logic/pragmatics).  
  - **Use this example:**  
    - *Scenario:* Professor writing a reference letter: "Alice has neat handwriting and is always on time."  
    - *Said:* Positive traits (handwriting, punctuality).  
    - *Implicated (PCI):* Alice is a weak candidate (via Quantity violation—missing expected praise).  
  - **Why this example?**  
    - Clearly separates literal content (saying) from pragmatic inference (implicating).  
    - Highlights calculability: Students deduce the implicature step-by-step:  
      1. Expectation: Letters should highlight strengths (Quantity).  
      2. Violation: Superficial praise only.  
      3. Inference: Speaker implies unstated deficiencies.  

  #### **4. Introducing GCIs vs. PCIs: The Tension** (20 min)  
  - **Definitions:**  
    - **PCI:** Context-dependent (e.g., reference letter).  
    - **GCI:** Context-independent defaults (e.g., "I slept in a car" → not my own car).  
  - **GCI Example:**  
    - *Utterance:* "I ate breakfast."  
    - *GCI:* Implicates "I ate breakfast [today/this morning]" (via Quantity).  
  - **Tension Point:**  
    - *Gricean View:* GCIs are calculable (inferred via maxims).  
    - *Critique (e.g., Levinson):* GCIs are "shortcuts"—automatic, conventionalized inferences.  
  - **Debate Spark:** "Is the GCI in 'I ate breakfast' a pragmatic inference or a semantic rule?"  

  #### **5. Defusing Misconceptions in Sequence**  
  - **Misconception 1: "Implicature is hidden literal meaning."**  
    - *When:* After introducing implicature (post-Section 3).  
    - *Defuse:* Use **cancelability test**.  
      - Example: "I ate breakfast, but not today." (No contradiction → not literal.)  
      - *Why here?* Prevents confusion between entailment and implicature early.  

  - **Misconception 2: "Cancelability means speakers can freely deny implicatures."**  
    - *When:* During GCI/PCI discussion (Section 4).  
    - *Defuse:* Show **contextual embeddedness**.  
      - Example: "I ate breakfast" → GCI = today. If canceled ("...but not today"), it feels odd unless context justifies it (e.g., "I ate breakfast [on Mars]").  
      - *Key:* Cancelability tests whether an inference is *implicature*, but GCIs resist cancellation due to default strength.  

  #### **6. What to Leave Out**  
  - **Omit:** Formal derivation of PCIs (e.g., step-by-step maxim calculations).  
    - *Why:* Overly technical; distracts from core tension. Focus on inference logic instead.  
  - **Minimize:** Detailed taxonomy of maxims (students know Austin; focus on Quantity/Relevance).  

  #### **7. End-of-Session Check: Calculability Problem**  
  - **Task:** Analyze an utterance for calculability tension:  
    > *"They met and had a baby."*  
    - **Questions:**  
      1. What is *said*? (Two events: meeting + having a baby.)  
      2. What is *implicated*? (GCI: Meeting → baby chronologically/causally).  
      3. Is this a GCI or PCI? (GCI: Default temporal inference.)  
      4. **Calculability Test:**  
        - Can you derive the implicature via maxims? (Yes: Manner/Orderliness).  
        - Is it cancelable? ("They met and had a baby, but not in that order." → Possible, but awkward. Shows GCI’s "sticky" default.)  
        - **Critical Q:** "Does this feel like a pragmatic inference (Grice) or a linguistic rule (conventional)?"  
  - **Why this works:** Tests grasp of calculability tension without memorization.  

  ---

  ### **Confidence Assessment**  
  - **High Confidence (80%)** in the arc:  
    - Builds from known (Austin) to unknown (Grice).  
    - Misconceptions addressed proactively.  
    - Tension (GCI vs. PCI) centers the session.  
  - **Least Confident Point:** GCI cancelability demos (e.g., "I ate breakfast").  
    - *Why:* Students may struggle to intuit why GCIs *feel* conventional. Mitigate by:  
      - Contrasting with clear PCI cancellations (e.g., reference letter: "She’s punctual—but also brilliant!" no issue).  
      - Emphasizing that "automatic" ≠ "semantic."  

  **Adjust as Needed:** If time runs short, skip deep maxim analysis to preserve debate on GCIs. Assign reading (e.g., Grice’s "Logic and Conversation") for derivations.  

  This plan balances conceptual clarity with critical tension, using strategic examples to avoid clichés while targeting the MA cohort’s level. Good luck!
