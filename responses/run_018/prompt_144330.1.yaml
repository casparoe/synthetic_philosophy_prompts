prompt: |-
  me and my friend just got into it for like two hours about WEIRD morality and whether cross-cultural differences actually kill objectivity. he thinks if harm/fairness is just one cluster among loyalty/purity/authority then there's no real moral fact, just cultural packages. i want to push back but i need the actual spec first: write the desiderata a theory of moral objectivity must meet to take folk morality seriously across cultures. what patterns must it accomodate — e.g. that some societies treat loyalty or purity violations as genuinely wrong rather than mere convention? which distinctions must it preserve (moral wrongness vs social taboo, disagreement over weights vs disagreement over values)? what psychology or anthropology findings can it not flat-out contradict? flag any jointly unsatisfiable subset — like if full objectivity and complete cultural neutrality can't both hold. and tell me which single requirement does the most damage to the usual suspects (relativism, universalist utilitarianism, etc.). i'm putting together notes for a seminar so keep it tight.
reasoning: |-
  Okay, the user is preparing for a seminar debate about moral objectivity and cultural differences. They had a heated discussion with a friend about whether cross-cultural variations undermine moral objectivity, specifically referencing Haidt's Moral Foundations Theory (harm, fairness, loyalty, purity, authority). Their friend argues that if morality includes foundations beyond harm/fairness, then there are no objective moral facts—just cultural packages. The user wants to push back but needs a structured framework of requirements for any theory claiming moral objectivity that respects cross-cultural data.

  First, I need to outline the desiderata for such a theory. The user wants patterns the theory must accommodate, like societies treating loyalty or purity violations as genuinely wrong, not just conventional. They also need distinctions preserved, such as moral wrongness vs. social taboo, and disagreement over weights vs. values. Plus, the theory can't contradict key psychology or anthropology findings. I should flag any jointly unsatisfiable requirements and identify which single requirement poses the biggest challenge to existing theories.

  Looking at Haidt's work, the five foundations are crucial. Societies vary in which foundations they prioritize, but all seem to have some moral framework. The theory must explain why some cultures view purity violations as moral issues while others don't, without dismissing them as merely conventional. Turiel's moral-conventional distinction is relevant here. For example, purity violations in some cultures are seen as inherently wrong, not dependent on rules.

  The distinction between moral wrongness and social taboo is vital. Taboos might lack justification beyond tradition, while moral wrongs claim deeper reasons. Also, disagreements over how much weight to give different values (e.g., loyalty vs. harm) versus disagreements over fundamental values themselves need addressing.

  Anthropological findings like norm acquisition, moralization of non-harm foundations, and criticism of cultural practices (like FGM) must be accommodated. The theory can't deny that moral judgments feel objective cross-culturally or that moral progress is possible.

  Now, conflicting desiderata: Full objectivity (universal moral facts) and complete cultural neutrality (all moral frameworks equally valid) are incompatible. If objectivity exists, some frameworks might be more correct. Also, explaining why some foundations are moralized only in certain cultures while maintaining universality is tricky.

  The most damaging requirement is likely the universality constraint. It challenges relativism by requiring some universal standards, while utilitarianism struggles with non-harm foundations. For example, purity violations causing disgust without harm are hard to justify under utilitarianism. Cultural relativism can't handle moral progress or criticism across cultures.

  The user might also need concrete examples for their seminar. Highlighting cases like honor killings or purity rituals could illustrate conflicts. They might want to reference studies showing cross-cultural moral disagreements but also universal principles, like prohibiting unjustified harm. Emphasizing that a theory must navigate between rigidity and flexibility is key. Pluralistic theories like Wong's or neo-Aristotelian approaches might be solutions, but the user needs the criteria first. Making sure the desiderata are clear and logically structured will strengthen their argument against both relativism and rigid universalism.
answer: |-
  Here's a tight framework of desiderata for a theory of moral objectivity that takes cross-cultural folk morality seriously, drawing on moral psychology (esp. Haidt, Shweder, Turiel) and anthropology:

  **Core Desiderata (What the Theory MUST Accomodate):**

  1.  **Foundation Pluralism:** Account for the empirical reality that moral systems across cultures utilize diverse foundational clusters (Haidt's Big 5: Care/Harm, Fairness/Cheating, Loyalty/Betrayal, Authority/Subversion, Sanctity/Degradation) as *genuine* sources of moral wrongness, not just convention.
  2.  **Genuine Wrongness vs. Convention:** Explain why violations within *any* foundational cluster (e.g., betrayal, sacrilege) in a culture that moralizes it are experienced/described as *objectively* wrong ("*this is just bad*") within that context, distinct from mere social disapproval or rule-breaking (Turiel's distinction). (e.g., Breaking a caste purity rule vs. wearing the wrong hat).
  3.  **Disagreement Structure:** Distinguish between:
      *   **Disagreement over Core Values:** Cultures genuinely differing on *which* foundations are morally relevant (e.g., purity paramount vs. purity irrelevant).
      *   **Disagreement over Weighting:** Cultures agreeing foundations are relevant but prioritizing them differently (e.g., loyalty > fairness in some contexts vs. fairness > loyalty).
      *   **Disagreement over Application:** Cultures sharing foundations and weightings but differing on specific acts (e.g., Is eating beef a purity violation?).
  4.  **Universality Constraint:** Explain cross-cultural convergences where they exist, especially regarding core prohibitions on *unjustified harm/deception* and basic fairness norms within the in-group. (e.g., Widespread prohibitions on murder, theft, breaking promises *within the moral community*).
  5.  **Moralization & Demoralization:** Account for the historical/cultural processes where acts become *moralized* (e.g., smoking, environmental destruction) or *demoralized* (e.g., usury, divorce).
  6.  **Psychological Reality:** Be compatible with findings that moral judgments are often intuitive, emotionally charged, and post-hoc reasoned (Social Intuitionism), and that moral dumbfounding occurs across cultures.
  7.  **Anthropological Reality:** Cannot contradict the well-documented diversity of moral codes and the *internal coherence* and norm-acquisition processes within different cultures. Must accommodate the fact that members of a culture sincerely experience their moral norms as binding truths.

  **Key Distinctions to Preserve:**

  *   **Moral Wrongness vs. Social Taboo:** A taboo might lack deeper justification beyond tradition/fear; moral wrongness purports a deeper reason (harm, injustice, betrayal, desecration). The theory must explain why certain violations feel categorically different.
  *   **Moral Disagreement vs. Error:** Provide criteria for when disagreement reflects differing legitimate perspectives vs. when one culture is simply *mistaken* about a moral fact.
  *   **Progress vs. Change:** Explain the intuition of *moral progress* (e.g., rejecting slavery) without implying linear evolution or that current norms are final.

  **The Inescapable Tension (Jointly Unsatisfiable Pair):**

  *   **Full Strong Objectivity (Mind-Independent Moral Facts):** Requires universal truths binding on all rational agents regardless of culture.
  *   **Complete Cultural Neutrality/Relativism:** Implies all culturally coherent moral frameworks are equally valid/true *for that culture*, with no external standard for critique.

  **These cannot both hold.** Any objective theory *must* provide grounds for cross-cultural critique, implying some frameworks are better/worse, even if partially correct. Conversely, strong relativism denies any universal standard for such critique.

  **The Most Damaging Requirement:**

  **#1 Foundation Pluralism + #2 Genuine Wrongness:** This combination does the most damage to common theories:

  1.  **Relativism (Naive & Cultural):** Struggles with #4 (Universality Constraint) and the intuition of #8 (Progress). It *over-accommodates* diversity by denying any basis for critique or convergence beyond culture.
  2.  **Strict Universalist Utilitarianism/Harm-Centric:** **Fatal Damage.** Cannot explain why violations of loyalty, authority, or purity (without direct harm) are experienced *and justified within their cultural context* as genuinely *morally wrong* (not just weird conventions). Dismisses these foundations as irrational or non-moral. Fails #1 and #2 utterly.
  3.  **Kantian Deontology (Rigid):** Struggles with the diversity of what counts as "rational" duty or "respect" across foundations (#1, #7) and the importance of weighting/application (#3c). Often reduces non-harm foundations to non-moral status.
  4.  **Divine Command Theory:** Faces extreme difficulty explaining cross-cultural diversity (#7) and the possibility of moral progress/reform within traditions (#8), unless tied to a very specific, contested revelation.

  **Theories Less Damaged (But Still Challenged):**

  *   **Pluralistic Universalism (e.g., Wong, Nussbaum):** Handles #1, #2, #3, #7 well by positing a limited set of universal values/functions (flourishing, basic needs) realized differently. Faces pressure on #4 (scope of universals) and #8 (robustness of critique).
  *   **Neo-Aristotelian Naturalism:** Can ground diverse virtues in human flourishing/social needs, accommodating #1, #2, #3, #7. Faces empirical challenges defining "flourishing" universally (#4, #7) and justifying specific weightings (#3b).
  *   **Procedural/Objectivity-as-Convergence:** Focuses on ideal discourse/reflective equilibrium across cultures. Handles diversity (#1, #7) and progress (#8) well. Struggles with strong intuitions of mind-independent wrongness (#2) and grounding the ideal procedure itself.

  **Summary for Your Seminar:** To take folk morality seriously, an objective theory must embrace plural foundations as *real* moral sources, explain why violations feel objectively wrong within their context, distinguish types of disagreement, account for limited universals and progress, and respect psychological/anthropological data. The core tension is between universality and diversity. The death knell for strict harm-centric utilitarianism is the *genuine moralization of non-harm foundations*. Look towards pluralistic or naturalistic theories that find universality in function (flourishing, social coordination) rather than specific content.
