  Then under agree and disagree on 2A: if agree, pure monumental; if disagree, then Claim 3A: Maintaining continuity with past methods/traditions is inherently valuable. If yes, pure antiquarian; if no, Claim 4A: Continuity is only valuable if practically useful today—instrumental antiquarian.

