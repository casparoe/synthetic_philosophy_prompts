            for x=4:
               noise=-1: 2-1+1=2
               noise=0: 3
               noise=1: 4

            for x=8: 3+noise+1: so 3,4,5
            etc.

            This way, there is overlap: 
               x=2 can have 1,2,3 cards.
               x=4 can have 2,3,4 cards.

            So if a participant feels an envelope with 2 index cards, it could be x=2 (if noise=0) or x=4 (if noise=-1).

            Similarly for paper clips.

            We'll do the same for paper clips: number of paper clips = s + noise + 1.

            But note: the participant can feel both the thickness and the weight. This gives two signals. We can let them use both.

            However, to keep it simple, we might just let them feel and then make a judgment.

     Procedure for round 1:

          - Each participant is given one envelope from their pair (randomly chosen by the facilitator, not opened).
          - They are allowed to feel the weight and thickness (by holding and maybe comparing with others? but not opening).
          - They then decide: keep this envelope or switch to the other envelope in their pair (which they have not felt).

          - They do not open the envelope yet.

     Then in round 2:

          - The facilitator presents the switching argument: 
               "Whatever amount you observe in your envelope, the other envelope in your pair is either double or half. Since you have no reason to think it's one or the other, the expected value of the other envelope is (1/2)*(x/2) + (1/2)*(2x) = (5/4)x. So you should switch."

          - They are then asked to apply this to the envelope they currently hold (which is either the original or the switched one) and decide whether to switch again (which would be back to the original if they switched in round 1, or to the other if they haven't switched yet).

          - But note: if they haven't switched yet, then they still have the original. Switching in round 2 would be to the other envelope. If they switched in round 1, then they now have the other envelope, and switching in round 2 would be back to the original.

          - They can switch multiple times? We can allow it, but then we might endless switch. So we say: in round 2, they make one decision: to stick or switch once more.

     After round 2, they open the envelope they have and keep the money.

     Total exposure: 

          The total amount in the 14 pairs:

            Type1: 7 pairs * (2+4) = 7*6 = $42
            Type2: 4 pairs * (4+8) = 4*12 = $48
            Type3: 2 pairs * (8+16) = 2*24 = $48
            Type4: 1 pair * (16+32) = $48
            Total = 42+48+48+48 = $186.

          This is over $100. We need to cap at a modest sum, say $100.

     Scale down the amounts:

          Use amounts in dollars: $0.50, $1, $2, $4, $8.

          Pair types:
            Type1: ($0.50, $1)   -> n1 pairs
            Type2: ($1, $2)       -> n2 pairs
            Type3: ($2, $4)       -> n3 pairs
            Type4: ($4, $8)       -> n4 pairs

          Choose n1=7, n2=4, n3=2, n4=1.

          Total amount:
            Type1: 7*(0.50+1)=7*1.50=10.50
            Type2: 4*(1+2)=12
            Type3: 2*(2+4)=12
            Type4: 1*(4+8)=12
            Total=10.50+12+12+12 = $46.50

          This is within a $100 budget.

     The prior for the first envelope:

          P(0.50) = 7 / 28 = 0.25
          P(1) = (7+4)/28 = 11/28≈0.39
          P(2) = (4+2)/28 = 6/28≈0.21
          P(4) = (2+1)/28 = 3/28≈0.107
          P(8) = 1/28≈0.036

     The conditional expectations:

          x=0.50: only in type1 -> other is $1.00. E[other]=1.00.
          x=1: in type1 (other=$0.50) or type2 (other=$2). 
               P(type1|x=1) = 7/(7+4)=7/11, P(type2|x=1)=4/11.
               E[other] = 0.50*(7/11) + 2*(4/11) = (3.5 + 8)/11 = 11.5/11≈1.045
          x=2: in type2 (other=$1) or type3 (other=$4).
               P(type2|x=2)=4/(4+2)=2/3, P(type3|x=2)=1/3.
               E[other]=1*(2/3)+4*(1/3)= (2/3+4/3)=6/3=2.
          x=4: in type3 (other=$2) or type4 (other=$8).
               P(type3|x=4)=2/(2+1)=2/3, P(type4)=1/3.
               E[other]=2*(2/3)+8*(1/3)= (4/3+8/3)=12/3=4.
          x=8: only in type4 -> other=$4.00.

     So the switching argument of (5/4)x would be:

          x=0.50: (5/4)*0.50=0.625, but E[other]=1.00 >0.625 -> switch is good.
          x=1: (5/4)*1=1.25, but E[other]≈1.045 <1.25 -> the argument says switch but actually switching gives on average 1.045 which is less than 1.25 and also less than the current 1? 
               However, note: the participant has 1, and switching yields on average 1.045, which is more than 1. So switching is good on average, but the argument says it should be 1.25 and it's only 1.045.
          x=2: (5/4)*2=2.5, and E[other]=2<2.5 -> the argument says switch, but switching yields on average 2, which is not more than 2.
          x=4: (5/4)*4=5, and E[other]=4<5 -> argument says switch, but switching yields 4 on average.
          x=8: (5/4)*8=10, and E[other]=4<10 -> argument says switch, but switching yields only 4.

     In this setup, the switching argument overstates the gain, and moreover, for x>=2, switching is not beneficial on average.

     We can try to balance the number of pairs differently. We want for each amount that appears in the middle to have the same number of times as the smaller and the larger. 
          For amount 1: should appear as the larger in type1 and as the smaller in type2. We set n1 = n2.
          For amount 2: n2 = n3.
          For amount 4: n3 = n4.

     So n1=n2=n3=n4. Let n1=n2=n3=n4=3 -> total 12 pairs. Then we have two extra pairs? We can add one more type1 and one more type2, but then n1=4, n2=4, n3=3, n4=3. Then for amount 2: n2=4, n3=3 -> not balanced.

     Given the time, let's live with the imbalance.

     Materials for the envelopes:

          - 28 envelopes.
          - Cash: 
              7 * $0.50 = $3.50 in coins (or use dollar bills and adjust to $0.50 in marked paper? but let's use real money: half-dollar coins or quarters: two quarters per $0.50 envelope)
              11 * $1 = $11 (could be two quarters and a dollar coin? or a dollar bill)
              6 * $2 = $12 (two $1 bills)
              3 * $4 = $12 (four $1 bills)
              1 * $8 = $8 (eight $1 bills)

          Total cash: $3.50+$11+$12+$12+$8 = $46.50.

          - Index cards: about 100.
          - Paper clips: about 100.

          For each envelope with amount x, compute s = log2(x) but in our amounts: 
              x=0.50 -> log2(0.5)=-1, but we can shift: let s = log2(2x) to make it non-negative.

              x=0.50: 2x=1 -> log2(1)=0
              x=1: 2x=2 -> 1
              x=2:2x=4 ->2
              x=4:2x=8 ->3
              x=8:2x=16 ->4

          Then the intended number of index cards and paper clips = s + 1 + noise, where noise in {-1,0,1} chosen at random.

          Example:
              x=0.50: s=0, then number = 0+1+noise = 1+noise -> between 0 and 2. But we want at least 1? Let's do max(1, 1+noise). 
              If noise=-1, then 0 -> use 1.
              If noise=0, then 1.
              If noise=1, then 2.

          So for x=0.50: 
              thickness and weight: either 1 or 2 index cards/paper clips.

          x=1: s=1, then 1+1+noise = 2+noise -> 1,2, or 3.

          etc.

          This will create overlaps.

     Timeline for the 75-minute workshop:

          0-10 min: Introduction. Explain the rules of the game. Distribute the first envelope to each participant (randomly chosen from their pair). 
                     Explain that they can feel the weight and thickness but not open it.

          10-25 min: Round 1. Participants feel their envelope and then decide: keep or switch to the other envelope in their pair. 
                     They make their decision and then the facilitator collects the decisions and redistributes the other envelope if they chose to switch.
                     Note: after switching, they have the other envelope, but they don't open it.

          25-40 min: The facilitator presents the switching argument (without conditioning on the physical properties). 
                     Write on the board: 
                        "Suppose you observe an amount x in your envelope. The other envelope in your pair contains either x/2 or 2x, and you have no information which. 
                         Then the expected value of the other envelope is: (1/2)*(x/2) + (1/2)*(2x) = (1/4)x + x = (5/4)x. 
                         This is greater than x, so you should switch."

          40-55 min: Round 2. Participants are asked to apply this argument to the envelope they currently hold (which they haven't opened). 
                     They are to assume that the amount in it is x (even though they don't know it) and then decide whether the argument compels them to switch again. 
                     They can switch again (which means if they are holding the first envelope they drew, they switch to the second; if they are holding the second, they switch back to the first). 
                     They make their decision.

          55-65 min: They open their envelope and see the money. The facilitator collects data on the outcomes.

          65-75 min: Debrief.

     In the debrief, we discuss:

          - The physical experience: they could feel the envelope and make an informed decision in round 1.

          - The switching argument in round 2: it said to switch no matter what.

          - But then if they applied it twice, they might have switched back.

          - The amounts in the two envelopes are fixed. The prior distribution over the pairs is known, and it is not uniform over the amounts.

          - The switching argument assumes that given x, the other envelope is either x/2 or 2x with equal probability. But in reality, the probability depends on x and the distribution of the pairs.

          - In our distribution, for some amounts (like x=0.50) the other envelope is always 2x, for x=8 it is always x/2, and for amounts in the middle it's a mixture.

          - Therefore, the assumption of equal probability is not always true.

          - This is the flaw in the argument.

          - What does the classic infinite regress require? It requires that the prior be such that for every x, the probability that x is the smaller or the larger in the pair is the same, and moreover, that the prior extends infinitely in both directions. Our distribution has endpoints, and also, the prior is not uniform in the log scale.

          - We also note that the physical properties gave some information about the amount, which might have affected their decision in round 1.

     What will predictably go wrong:

          - In round 1, participants who feel a thin and light envelope (which is likely $0.50) will be inclined to switch, because they hope for $1. This is rational. 
            Those who feel a thick and heavy envelope (likely $8) will be inclined to keep, because switching might get them $4. 
            Those in the middle might be uncertain.

          - In round 2, after hearing the argument, participants who have an envelope that feels heavy might not want to switch because they think it might be $8 and the other is $4. 
            But the argument says to switch. This will create a conflict. Some will follow the argument and switch, and then might regret it.

          - Some participants might switch twice and end up with the original envelope.

          - The group might not converge on a clear flaw in the argument because the physical properties complicate the conditional probabilities.

     To mitigate, in the debrief, we will focus on the case without physical properties.

     This design is complex, but it meets the request of having physical properties and the iterative switch.

     Let's write the exact rules.
answer: |-
  ### Workshop Design: The Two-Envelope Experience

  **Core Idea:** Participants confront the two-envelope paradox through a hands-on game with physical envelopes containing real money. They first use tangible cues (weight/thickness) to inform their decision, then face the unconditional switching argument iteratively, revealing the paradox as a decision-making pressure rather than a solved puzzle.

  ---

  ### **Rules & Setup**
  #### **Materials**
  - **Envelopes**: 28 sealed letter-sized envelopes (14 pairs).
  - **Cash Amounts**: 
    - 7 pairs: $0.50 and $1.00
    - 4 pairs: $1.00 and $2.00
    - 2 pairs: $2.00 and $4.00
    - 1 pair: $4.00 and $8.00  
    *(Total cash: $46.50; max exposure < $50)*.
  - **Weight/Thickness Cues**:
    - For an envelope with amount **`x`**, compute `s = log₂(2x)`.  
      *(e.g., $0.50 → `s=0`; $1.00 → `s=1`; $2.00 → `s=2`; $4.00 → `s=3`; $8.00 → `s=4`)*.
    - Add **`n = max(1, s + 1 + noise)`** index cards (for thickness) and paperclips (for weight).  
      `noise` is randomly drawn from {-1, 0, 1} per envelope to create observable but imperfect cues.
  - **Prior Distribution Disclosure**:  
    Display a table without referencing philosophers:  
    | Amount | $0.50 | $1.00 | $2.00 | $4.00 | $8.00 |  
    |--------|-------|-------|-------|-------|-------|  
    | Probability | 25% | 39% | 21% | 11% | 4% |  
    Clarify: "These are the chances of drawing each amount from the pool. Your envelope contains one of these."

  #### **Game Rules**
  1. **Round 1 (Physical Evidence)**:
     - Each participant draws one sealed envelope from their assigned pair (pre-randomized).
     - They physically inspect weight/thickness (shaking, bending, comparing) for ≤60 seconds.
     - Choose: **KEEP** or **SWITCH** to the unseen paired envelope.
     - *Envelopes remain sealed; no opening yet.*

  2. **Round 2 (Iterated Switching Argument)**:
     - Reveal the unconditional switching argument:  
       *"Whatever amount $x$ you observe, the other envelope holds $x/2$ or $2x$ with equal probability. Thus, its expected value is $\frac{1}{2}(x/2) + \frac{1}{2}(2x) = \frac{5}{4}x$. Since $\frac{5}{4}x > x$, you should switch."*
     - Participants **apply this argument to their current envelope** (whether original or switched):  
       - Treat their unopened envelope as containing a known $x$.
       - Decide: **KEEP** or **SWITCH** again (swapping back to their first envelope or to the second).
     - *Argument is applied iteratively: "If you switched once, should you switch again? If not, why defy the math?"*

  3. **Payoff**:  
     - Participants open their final envelope and keep the cash inside.
     - **Budget Safeguard**: Use small bills/coins (e.g., quarters for $0.50). Total distributed ≤$50.

  ---

  ### **Timeline (75 min)**
  | Time  | Activity |
  |-------|----------|
  | 0-10  | **Intro**: Distribute envelopes. Explain rules, prior, cue system. Emphasize: "Decisions have real monetary stakes." |
  | 10-25 | **Round 1**: Inspect envelopes → Decide KEEP/SWITCH. Collect decisions; redistribute envelopes if switched. |
  | 25-40 | **Round 2**: Present switching argument. Participants reapply it to current envelope → Decide KEEP/SWITCH again. |
  | 40-55 | **Reveal & Cash Out**: Open envelopes. Record choices/outcomes. (Facilitator tracks who switched, amounts won). |
  | 55-75 | **Debrief**: |

  ---

  ### **Debrief Structure**
  1. **Map Physical Moments to Formal Structure**:
     - **Prior**: "When you felt a thin/light envelope, you inferred a low amount. That’s the prior at work—your brain computed $P(\text{amount} \mid \text{cue})$."
     - **Conditional Expectation**: "In Round 1, you used cues to estimate the expected value of switching. In Round 2, we replaced this with a *formal expectation* ($\frac{5}{4}x$) that ignored your physical evidence."
     - **Iteration**: "When we reapplied the argument to your new envelope, we hit infinite regress: if $\frac{5}{4}x$ always favors switching, should you switch forever? But the envelopes are fixed—you can’t."
     - **Contradiction**: "The argument assumes every $x$ could be doubled *or* halved with equal odds. But look at the prior:  
       - If you held $0.50$, the other was *always* $1.00$ (not $0.25$).  
       - If you held $8.00$, the other was *always* $4.00$ (not $16.00$).  
       The math breaks because the prior has endpoints and asymmetric odds."

  2. **Honest Limitation**:  
     "This game *cannot* replicate the true paradox’s **infinite prior**. Here, amounts are bounded (no $0.25$ or $16.00$), so expectations don’t explode. The infinite case is where the paradox bites hardest—but you’ve felt its pressure."

  ---

  ### **Predictable Challenges**
  1. **Round 1**: 
     - Participants with heavy envelopes ($8.00 cues) **refuse to switch**, fearing a $4.00 loss.  
     - Those with light envelopes ($0.50 cues) **switch eagerly**, hoping for $1.00.  
     *Result*: Rational use of physical evidence overrides the later mathematical argument.

  2. **Round 2**: 
     - After switching once, participants **defy the argument** if their new envelope "feels wrong" (e.g., heavy → "I might switch back to $8.00!").  
     - The group **converges unarticulated consensus**: "The argument is flawed," but they can’t pinpoint why. Common fumbles:  
       - "It doesn’t account for the prior." *(Correct, but vague)*.  
       - "Switching twice cancels the gain." *(Misses the core issue: the argument’s symmetry assumption is false)*.

  3. **Logistical Snags**: 
     - Noise in cues causes regret: "I thought thin=$0.50, but it was $1.00!"  
     - Some switch twice and revert to their original envelope, feeling cheated by the math.

  ---

  ### **Why This Works**
  - **Stakes Over Hypotheticals**: Real money and tactile cues make the paradox visceral.  
  - **Iteration Reveals Regress**: Applying the argument to the *switched* envelope forces confrontation with infinite switching.  
  - **Flaw Emerges Naturally**: Participants see the argument break *with their own prior/distribution*, avoiding "textbook" solutions.  
  - **No Philosopher Names**: The paradox’s force comes from rules and incentives, not citations.
