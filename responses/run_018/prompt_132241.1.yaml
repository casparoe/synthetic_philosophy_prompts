answer: |-
  Here’s a dialogue between **Leo** (defending R’s position) and **Tess** (defending M’s position), culminating in a clear stance:

  ---

  **Leo:** R’s demand isn’t about control—it’s about *integrity*. She built the methodology that defines the entire project. If she doesn’t want public authorship but insists her work is the foundation of M’s authority, that’s radical honesty. She’s rejecting performative credit to expose the *actual* power structure: the work flows from her system.  

  **Tess:** But hiding that structure corrupts the collective. If M’s authority rests on R’s private endorsement, then R *is* a shadow director. Public equality forces us to confront dependencies. M isn’t "consuming labor" by demanding transparency—they’re refusing to front a lie of equal authorship.  

  **Leo:** Equal authorship *is* the lie! R’s labor *isn’t* equal—it’s foundational. Forcing her into the "author" role just aestheticizes her contribution for the group’s brand. Her private contract doesn’t make her a "master," it makes her an uncredited architect. She’s owning that asymmetry instead of masking it.  

  **Tess:** And that asymmetry will poison the group. If no one else knows R holds the keys, how can they challenge decisions? If M rejects an issue using R’s method, is it principle or R’s private veto? Secrecy breeds distrust. Public recognition lets the collective negotiate power, not inherit it invisibly.  

  **Leo:** Negotiate how? By pressuring R into a role she rejects? Her method is her intellectual property. She’s offering a compromise: operational authority to M, conditional on acknowledging its source. That’s *more* ethical than pretending M’s authority emerges democratically.  

  **Tess:** But authority isn’t just sourced—it’s exercised. If M’s legitimacy comes from R, then R *is* governing, just without accountability. If the method is so vital, credit it publicly! Call R the "methodologist" or "system designer." Burying it in a contract dodges the group’s right to know who shapes their work.  

  **Leo:** R’s point is that public labels are co-optive. "Methodologist" still frames her work through the collective’s narrative. The private document is her asserting authorship on her terms: as infrastructure, not identity. It’s a refusal to let her labor be absorbed into "the collective" as a marketing tool.  

  **Tess:** And that’s where she undermines herself. Infrastructure can’t demand private fealty—it either serves the community openly or controls it covertly. If R’s method is the bedrock, she should own that publicly so the group can adapt, credit, or even replace it transparently. Hiding it creates a time bomb: the second someone challenges M, the secret contract becomes a weapon.  

  **Leo:** Or it becomes irrelevant. If the method works, the authority is functional, not personal.  

  **Tess:** Authority is *always* personal when it’s delegated secretly. Without mutual visibility, there’s no consent. If the group knew R’s role, they could agree to her terms—or propose alternatives. Secrecy denies them that choice. That’s why hidden dependency is unstable: it substitutes trust in a person for trust in a process.  

  **Leo:** But all systems hide some dependencies! Do we credit every algorithm in our mapping software?  

  **Tess:** False equivalence. R is a living contributor embedded in the group. Her demand isn’t "don’t credit me"—it’s "credit me in a way only M sees." That’s asymmetrical power, not humility.  

  **Final Stance (Narrator):** Hidden dependencies cannot be stable without mutual visibility. Tess’s position prevails: R’s private contract creates an unaccountable power center, inviting distrust and conflating operational necessity with personal authority. Public recognition—even if non-traditional (e.g., "System Design: R")—forces the collective to confront its true structure, allowing negotiated credit and preventing secret hierarchies. R’s labor deserves visibility, not a ghostly veto. Concealing foundational contributions isn’t honesty—it’s obscurantism that erodes collective agency.  

  *(Note: This stance draws on critical theory (e.g., Honneth's "recognition as social vitamin") in arguing that mutual visibility enables healthy group dynamics—a contested view among autonomy-focused anarchists.)*  

  --- 

  **Key Resolution Points:**  
  1. **Hidden = Unstable:** Secret authority inevitably breeds suspicion when decisions are contested.  
  2. **Recognition Requires Consent:** The group cannot consent to R’s role if it’s invisible.  
  3. **Credit ≠ Absorption:** Public acknowledgment (e.g., "System Designer") can respect R’s labor without forcing her into "authorship."  
  4. **Collective Integrity > Personal Preference:** While R’s autonomy matters, a group’s foundational power structure must be visible to function democratically.  

  The path forward? M could publicly credit R’s system as the project’s backbone—without listing her as an author—while keeping editorial authority *explicitly* derived from that system. Transparency without assimilation.
