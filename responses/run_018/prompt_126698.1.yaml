  ### Decision Tree: Evaluating Institutional Failure in Conspiracy Theories  
  **Starting Commitment:** "I accept that institutional knowledge production can be systematically wrong about a specific event without being globally unreliable."  

  #### Node 1: Initial Evidence Assessment  
  *Scenario: Primary documents emerge contradicting the official narrative of an event, but every mainstream media outlet ignores them. How do you proceed?*  
  - **A. Update beliefs based solely on the documents** (treat documents as sufficient proof of institutional failure).  
  - **B. Require independent verification by a decentralized network** (e.g., citizen journalists, niche experts) you do not inherently distrust.  
  - **C. Treat media silence as evidence of institutional capture** (silence confirms the conspiracy).  

  ---

  #### Branch A: Update on Documents Alone  
  **Node A2: Response to Counterevidence**  
  *An official investigation refutes the documents' claims using forensic analysis. Do you:*  
  - **A2.1. Dismiss the investigation** as part of a cover-up (counterevidence is structurally invalid).  
  - **A2.2. Update against the conspiracy** only if the investigation’s methods are unsound (e.g., via technical critique).  
  - **A2.3. Update against the conspiracy** because large-scale cover-ups are rare (base-rate adjustment).  

  **Node A3: Belief Revision Mechanism**  
  *When evaluating a new conspiracy claim, do you:*  
  - **A3.A. Prioritize case-specific evidence** (e.g., document authenticity, witness consistency).  
  - **A3.B. Prioritize reference-class analogies** (e.g., "This resembles the Gulf of Tonkin incident").  

  **Node A4: Verification Debt**  
  *After rejecting an official account, is it sufficient to:*  
  - **A4.A. Identify internal contradictions** (negative coherence), or must you  
  - **A4.B. Propose a testable alternative** (e.g., predict future leaks, asset movements)?  

  *Leaves for Branch A:*  
  - **A2.1 + A3.A + A4.A → Hermeneutics-of-Suspicion Structuralism**  
    *Diagnosis: Reinterprets all counterevidence as confirmation; relies on deconstructing power dynamics without predictive commitments.*  
  - **A2.1 + A3.A + A4.B → Unoccupied**  
    *Diagnosis: Incoherent—structural unfalsifiability contradicts obligation to risk falsifiable predictions.*  
  - **A2.1 + A3.B → Unoccupied**  
    *Diagnosis: Unstable—reference classes require base-rate awareness, but dismissal of counterevidence ignores base rates.*  
  - **A2.2 + A3.A + A4.A → Decentralized Verificationism** (if combined with Branch B’s Q5.B)  
    *Diagnosis: Trusts grassroots verification but avoids predictive risk; unstable under repeated errors.*  
  - **A2.3/A2.2 + A3.B → Bayesian Skepticism** (anchored to base rates)  
    *Diagnosis: Uses base rates to calibrate priors; updates via specific evidence or outside-view analogies.*  

