  #### Leaf Definitions & Overlaps  
  - **Strict Institutionalist Debunking:** Defers to base rates and institutions; requires predictive alternatives. (*Branch B only.*)  
  - **Bayesian Skepticism:** Anchors to low base rates; updates via evidence or reference classes. (*Branches A/B.*)  
  - **Decentralized Verificationism:** Trusts networks over institutions; accepts predictive risk. (*Branches A/B.*)  
  - **Hermeneutics-of-Suspicion Structuralism:** Dismisses counterevidence; prioritizes power analysis. (*Branches A/C.*)  

  **Indistinguishable Leaves:**  
  - Bayesian Skepticism (A/B) and Strict Institutionalist (B) overlap if both use base rates + inside-view. *Separation depends on B2: institutionalists reject network infallibility.*  
  - Hermeneutics-of-Suspicion (A/C) is identical in verification debt and evidence handling; *separation depends on C1 (silence as confirmatory) vs. A1 (documents as sufficient).*  

  **Unoccupied Combinations:**  
  - Accepting verification debt (A4.B/B4.B) while rejecting reference-class reasoning (A3.A/B3.A) → *Rare: Predictive risk typically requires generalizable patterns.*  
  - Trusting decentralized networks (B2.B) while requiring predictive risk (B4.B) and dismissing counterevidence (B3.1) → *Incoherent: Trust in networks contradicts structural dismissal.*  

