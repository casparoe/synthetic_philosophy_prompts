prompt: |-
  I advise a government forecasting office that regularly audits century-scale predictive claims—demographic, ecological, and resource-system projections—many of which are pronounced falsified within one generation yet seem partially vindicated in altered form decades later. Taking the Malthusian argument in the 1798 Essay on the Principle of Population as my paradigmatic case—where geometric population growth against arithmetic food production was apparently refuted by agricultural innovation, only for analogous pressure dynamics to re-emerge in ecological and distributional contexts—I want you to construct a reusable, ninety-minute audit procedure that translates philosophy-of-science distinctions about falsification, auxiliary-hypothesis protection, and what we might call “right-but-early” rescue into an operational protocol for non-philosopher analysts.

  The procedure must be ordered and explicit: (1) the sequential tests that distinguish falsification of a theory’s structural core from falsification of a protected auxiliary or a misapplied parameter; (2) the precise conditions—distinguishing parametric rescue (recalibrating constants) from structural rescue (revising mechanisms)—under which temporal delay counts as legitimate long-range vindication rather than ad hoc immunization; (3) the termination rules that yield a definitive “falsified” verdict versus those that hand judgment to a values-laden decision-maker because the remaining dispute is normative rather than epistemic; and (4) an explicit catalog of failure modes, including cases where the procedure will misclassify a genuinely rescued theory as dead, or will illegitimately protect a moribund one.

  Apply this procedure to three worked cases: first, Malthus’s original claim that population necessarily outstrips subsistence; second, the 1970s Limits to Growth projection that resource depletion and pollution would constrain industrial expansion, which critics attacked by citing unanticipated technological substitution; and third, a hypothetical contemporary forecast that global freshwater scarcity will trigger cascading state-collapse dynamics by 2080, currently facing apparent contradiction from rapid desalination and demand-management advances. In each application, flag the exact step where procedural judgment ends and irreducibly normative or institutional choice begins. Do not supply bibliographies, reading lists, or citations; do not invoke highly specialized formalisms that require external reference; and be explicit about which steps are judgment calls dressed in procedural clothing.
reasoning: |-
  We are constructing a reusable 90-minute audit procedure for long-term forecasts. The procedure must handle the nuances of falsification, auxiliary hypotheses, and "right-but-early" rescues. We break the procedure into four main parts:

  1. **Sequential tests** to distinguish falsification of the core theory vs. auxiliary hypotheses or parameters.
  2. **Conditions for temporal delay** to count as legitimate vindication (parametric vs. structural rescue).
  3. **Termination rules** for a definitive falsification verdict vs. handing off to normative decision-making.
  4. **Catalog of failure modes** (misclassifications).

  We then apply the procedure to three cases: Malthus, Limits to Growth (1970s), and a hypothetical freshwater scarcity forecast.

  ---

  **90-Minute Audit Procedure**

  **Objective:** To determine whether a challenged century-scale predictive claim has been falsified, or if apparent falsification is due to auxiliary hypotheses or if the core theory is "right but early" and might be vindicated later.

  **Step 0: Pre-Audit Setup (10 minutes)**
  - Clearly state the original claim (including time frame, scope, and key variables).
  - Identify the core theoretical structure (the essential causal mechanisms and relationships).
  - List explicit and implicit auxiliary hypotheses (boundary conditions, ceteris paribus assumptions, data sources, parameter values, etc.).
  - Define the falsifying evidence (what event or trend is claimed to falsify the prediction?).

  **Step 1: Test for Core Falsification (20 minutes)**
  - **1.1 Core Isolation:** Separate the core theory from auxiliary hypotheses. The core must be the minimal set of propositions that are non-negotiable for the theory to hold.
  - **1.2 Evidence Mapping:** Map the falsifying evidence directly to the core theory. Does the evidence contradict a necessary consequence of the core without relying on auxiliary assumptions?
    - *If yes, go to Step 1.3.*
    - *If no, the falsification may be due to auxiliary hypotheses → proceed to Step 2.*
  - **1.3 Core Refutation Check:** Determine if the core theory makes a unique prediction that is contradicted by the evidence, and if the core theory does not allow for any structural adjustment that could accommodate the evidence without becoming a different theory.
    - *If the core is directly contradicted and cannot be adjusted without becoming a fundamentally different theory → mark as "Core Falsified" and terminate (go to Step 4 for failure mode check).*
    - *If the core is not directly contradicted or if the contradiction can be resolved by adjusting non-core elements → proceed to Step 2.*

  **Step 2: Auxiliary Hypothesis Audit (20 minutes)**
  - **2.1 Auxiliary Inventory:** List all auxiliary hypotheses that were used to generate the prediction (e.g., initial conditions, parameter values, ceteris paribus clauses, boundary conditions, data quality, model structure outside the core).
  - **2.2 Auxiliary Falsification Test:** For each auxiliary hypothesis, test if the falsifying evidence specifically undermines it (rather than the core).
    - *If the falsifying evidence can be fully explained by the failure of one or more auxiliary hypotheses → mark as "Auxiliary Hypothesis Failure" and proceed to Step 3 for rescue assessment.*
    - *If the evidence cannot be explained by auxiliary failure and still contradicts the core → return to Step 1.3 for core re-evaluation (if not already done) and consider core falsification.*

  **Step 3: Rescue Assessment (20 minutes)**
  - **3.1 Rescue Type Identification:** Determine the type of rescue attempted:
    - *Parametric Rescue:* Adjusting parameter values (e.g., changing a growth rate constant) or recalibrating the model without altering the core mechanisms.
    - *Structural Rescue:* Revising the core mechanisms (e.g., adding new causal pathways, changing functional forms) to accommodate the evidence.
  - **3.2 Legitimacy Criteria for Rescue:**
    - *Parametric Rescue:* Acceptable only if (a) the original parameters were based on incomplete data and new data justifies the change, and (b) the change does not violate the core theory's original intent and is within plausible bounds of the original model.
    - *Structural Rescue:* Acceptable only if (a) the revised theory explains all the data the original did plus the new evidence, (b) it does not introduce ad hoc elements (i.e., elements that are only motivated by saving the theory and not independently supported), and (c) the core insight of the original theory is preserved (e.g., the fundamental driver of the prediction remains, even if the mechanism is refined).
  - **3.3 Temporal Delay Assessment (for "right but early"):** If the rescue involves a delay in the predicted outcome, check:
    - Is the delay explicable by an independently verifiable disruption (e.g., unexpected technological innovation, policy intervention, external shock) that was not part of the original model's boundary conditions?
    - Is the core mechanism still operative and producing the predicted trend, albeit at a different timescale?
    - If both conditions are met, the rescue is legitimate → mark as "Vindication via Rescue" and terminate.
    - If not, the rescue is ad hoc → mark as "Ad Hoc Immunization" and terminate (go to Step 4 for failure mode check).

  **Step 4: Termination and Failure Mode Check (10 minutes)**
  - **4.1 Termination Rules:**
    - *Definitive Falsification:* If core falsification (Step 1.3) is confirmed and no legitimate rescue (Step 3) is possible.
    - *Normative Handoff:* If after Steps 1-3, the dispute reduces to disagreements about:
        - The acceptability of auxiliary hypotheses (e.g., whether an external shock was unforeseeable).
        - The legitimacy of a structural rescue (e.g., whether the core insight is preserved).
        - The weight of evidence for future vindication (e.g., whether current trends are still indicative of future crisis).
      Then hand off to a decision-maker, noting the remaining issues are normative (value-laden) or institutional (e.g., resource allocation for further monitoring).
  - **4.2 Failure Mode Catalog (to be referenced throughout):**
    - *Type I Error (False Falsification):* Classifying a genuinely rescued theory as dead. This may occur if:
        - The procedure underestimates the plausibility of a parametric or structural rescue.
        - The core theory is discarded due to auxiliary failures that are later corrected.
        - The temporal delay is dismissed as ad hoc when it was actually due to an independently verifiable disruption.
    - *Type II Error (False Survival):* Illegitimately protecting a moribund theory. This may occur if:
        - Auxiliary hypotheses are repeatedly adjusted without independent justification.
        - Parametric rescues push parameters beyond plausible bounds.
        - Structural rescues fundamentally alter the core theory but are still accepted.

  ---

  **Application to Cases**

  **Case 1: Malthus's Claim (1798)**
  - *Original Claim:* Population grows geometrically, food production arithmetically, leading to necessary checks (misery, vice) when population outstrips subsistence.
  - *Falsifying Evidence:* Agricultural innovations (e.g., the Green Revolution) avoided mass starvation in the 20th century despite population growth.
  - **Audit:**
    - **Step 0:** 
        - Core: The imbalance between geometric population growth and arithmetic food growth must lead to crisis.
        - Auxiliaries: Technology and land use patterns remain static; no major innovations in food production.
    - **Step 1:** 
        - 1.1: Core is the growth imbalance and its necessary consequence (crisis).
        - 1.2: Evidence of avoided crisis contradicts the necessary consequence → Step 1.3.
        - 1.3: The core requires crisis, but crisis was avoided. However, the core could be adjusted by allowing for dynamic responses in food production? → But Malthus treated food growth as fixed. So core seems falsified? Proceed to Step 2 for auxiliary check.
    - **Step 2:**
        - 2.1: Auxiliary: No major agricultural innovations (technological stagnation).
        - 2.2: Evidence directly falsifies the auxiliary (innovation occurred). Thus, the falsification is due to auxiliary failure → Step 3.
    - **Step 3:**
        - 3.1: Rescue: Neo-Malthusians (e.g., in ecological economics) argue that the core imbalance re-emerges in new forms (e.g., environmental degradation, inequality). This is a structural rescue (revising mechanisms to include innovation but then new constraints).
        - 3.2: Structural rescue? The core insight (growth in consumption vs. finite resources) is preserved, and the theory now explains both past escapes and current pressures. However, the original core (fixed food production) was replaced. Is this the same theory? 
        - 3.3: Temporal delay: The crisis is delayed and takes new forms. The delay is explained by innovation (independent evidence). The core mechanism (pressure from growth) is still operative.
        - *Judgment:* The rescue is arguably legitimate (vindication via structural rescue). But note: the original core mechanism (fixed arithmetic growth) is abandoned. This is a structural change that may be too fundamental for some.
    - **Step 4:**
        - Termination: This case is contentious. The procedure leads to a handoff because the legitimacy of the structural rescue is debatable (normative handoff). Some might see the core as falsified; others see it as rescued. The dispute is about whether the revised theory counts as the same core insight.
        - Failure Mode: Risk of Type II error if we accept the rescue without independent evidence for the new constraints (e.g., ecological limits). But if we reject, risk of Type I error (ignoring that the growth-pressure dynamic reappeared).

  **Case 2: Limits to Growth (1970s)**
  - *Original Claim:* Industrial growth will lead to resource depletion and pollution that will cause collapse by mid-21st century.
  - *Falsifying Evidence:* No collapse; technological substitution and efficiency gains decoupled growth from resource use.
  - **Audit:**
    - **Step 0:**
        - Core: Exponential growth in population and industry within finite resource and pollution limits must lead to overshoot and collapse.
        - Auxiliaries: Fixed resource stocks, no major substitution, no game-changing pollution control tech.
    - **Step 1:**
        - 1.1: Core is the overshoot and collapse dynamic in a finite system.
        - 1.2: Evidence: No collapse (so far). Contradicts the prediction? → Step 1.3.
        - 1.3: The core requires collapse, but it hasn't happened. However, the time frame (mid-21st century) is not yet reached? But the prediction was for "by 2100" and we are in 2023. We are within the time frame? Let's note the original model runs showed collapse by 2070 in standard run. However, the absence of collapse so far might be due to delays → Step 2 for auxiliary.
    - **Step 2:**
        - 2.1: Auxiliary: No substitution, no major tech breakthroughs.
        - 2.2: Falsifying evidence (substitution and tech) directly attacks the auxiliary → Step 3.
    - **Step 3:**
        - 3.1: Rescue: Later updates (e.g., 30-year update) adjust the model with new tech and policy scenarios. This is a parametric rescue? (changing parameters for tech) and structural? (adding new sectors).
        - 3.2: They adjust parameters and add mechanisms (e.g., for tech). The core (overshoot in finite systems) remains. The rescue is parametric and structural? 
        - 3.3: Temporal delay: Collapse is postponed. The delay is due to tech (independent evidence). The core mechanism (overshoot) is still present in updated models (e.g., for climate change, biodiversity).
        - *Judgment:* Legitimate rescue? The updates are independently motivated (by real tech changes) and the core is preserved. Vindication via rescue? But we haven't seen collapse yet. We are still within the time frame.
    - **Step 4:**
        - Termination: The model is not falsified yet because the time frame is not over. But the evidence of tech substitution challenges the original timeline. The procedure would note that the model has been rescued and updated, and we must wait. However, if we were to audit now, we might hand off to normative decision: Is it acceptable to keep updating the model indefinitely? (Normative handoff on whether the model is still useful for policy.) 
        - Failure Mode: Type II error if the model is kept alive despite repeated adjustments without independent justification. Type I error if we declare it dead prematurely when collapse might still occur.

  **Case 3: Hypothetical Freshwater Scarcity (Collapse by 2080)**
  - *Original Claim:* Global freshwater scarcity will cause cascading state collapses by 2080.
  - *Falsifying Evidence (current):* Rapid advances in desalination and demand management are increasing water availability and efficiency, avoiding near-term crises.
  - **Audit:**
    - **Step 0:**
        - Core: Water scarcity (due to fixed renewable supply and growing demand) leads to geopolitical instability and state collapse.
        - Auxiliaries: Desalination remains expensive and localized; demand management is insufficient; no major supply innovations.
    - **Step 1:**
        - 1.1: Core is the causal chain: scarcity → conflict → collapse.
        - 1.2: Evidence: No collapse (so far) and technology is reducing scarcity. This contradicts the predicted trend? → Step 1.3.
        - 1.3: The core requires collapse, but it hasn't occurred. However, the time frame is 2080. The evidence might only show delay → Step 2.
    - **Step 2:**
        - 2.1: Auxiliary: No breakthrough in desalination or demand management.
        - 2.2: Evidence directly falsifies the auxiliary (innovation occurred) → Step 3.
    - **Step 3:**
        - 3.1: Rescue: Proponents might argue that the core scarcity-conflict mechanism is still operative but delayed by tech. They might adjust parameters (e.g., higher adoption rates for tech) or add structural elements (e.g., new sources of scarcity like pollution or inequality).
        - 3.2: Parametric rescue? Changing the rate of adoption is parametric. Structural? If they add new mechanisms (e.g., climate change intensifying droughts), that might be structural.
        - 3.3: Temporal delay: The collapse is delayed. The delay is due to tech (independent evidence). But does the core mechanism still hold? Yes, if they argue that tech only postpones the inevitable (e.g., if demand continues to grow or if desalination has limits). 
        - *Judgment:* Legitimate if the new parameters are within plausible bounds and the structural additions are independently justified. But if the rescue is just "we moved the date to 2100", it might be ad hoc.
    - **Step 4:**
        - Termination: The time frame is not over. The rescue seems plausible now. But if the evidence of tech success accumulates without signs of new pressures, the theory might be falsified in the future. For now, it remains alive. However, the handoff point is at Step 3.2: Are the adjustments to the model (e.g., pushing the collapse date) acceptable? This is a normative judgment about the burden of proof and the value of precaution.

  ---

  **Summary of Judgment Handoff Points:**
  - In all cases, the critical handoff occurs at Step 3 (Rescue Assessment) when deciding if a structural rescue preserves the core insight. This is inherently normative because it depends on what the community of practice considers the "core insight" and how much change is acceptable.
  - Also, in Step 4, the decision to terminate as falsified or to hand off is normative when the evidence is not definitive and the stakes are high (e.g., in the freshwater case, the decision to keep monitoring vs. abandon the theory).
answer: |-
  Below is a reusable 90-minute audit procedure for evaluating century-scale predictive claims, designed for non-philosopher analysts in a government forecasting office. The procedure translates key philosophy-of-science concepts (falsification, auxiliary hypotheses, "right-but-early" rescues) into an operational protocol. It is structured as four sequential components, with explicit steps, time allocations, and decision rules. The procedure emphasizes *practical applicability*: it flags where judgment is unavoidable and distinguishes epistemic (evidence-based) evaluation from normative (values-based) choices.

  ---

  ### **90-Minute Audit Procedure**  
  **Objective**: Systematically evaluate whether a predictive claim is falsified, rescued via auxiliary adjustments, or vindicated after temporal delay.  
  **Time Allocation**:  
  - Step 1: Core vs. Auxiliary Test (25 min)  
  - Step 2: Rescue Legitimacy Test (25 min)  
  - Step 3: Termination & Handoff Rules (20 min)  
  - Step 4: Failure Mode Catalog (built into Steps 1–3; review in final 10 min)  

  ---

  #### **Step 1: Core vs. Auxiliary Falsification Test** (25 min)  
  *Purpose*: Distinguish falsification of the theory’s core from falsification of auxiliary hypotheses or parameters.  
  **Sequential Tests**:  
  1. **Isolate the Core Mechanism** (5 min):  
     - Identify the theory’s *non-negotiable causal structure* (e.g., "geometric population growth outstrips arithmetic food production" in Malthus).  
     - Flag: Core must be explicitly defined in the original claim. If ambiguous, note this as a judgment call.  
  2. **Map Predictions to Core** (5 min):  
     - List specific predictions derived *solely* from the core mechanism (e.g., "population crises by 1850").  
     - Exclude predictions relying on auxiliary assumptions (e.g., "grain yields will grow at 0.5% annually").  
  3. **Identify Discrepancies** (10 min):  
     - Compare observed data to core predictions.  
     - If discrepancy exists, ask: **Is the discrepancy *inevitable* under the core mechanism?**  
       - *Yes* → Proceed to Step 1.4 (core falsification likely).  
       - *No* → Discrepancy may stem from auxiliaries (proceed to Step 1.5).  
  4. **Core Falsification Condition** (3 min):  
     - Core is falsified **only if** the discrepancy cannot coexist with the core mechanism (e.g., observed food abundance with no checks contradicts Malthus’s *necessary* crisis).  
     - *Output*: "Core falsified" if condition met; else, proceed to auxiliary test.  
  5. **Auxiliary Falsification Test** (2 min):  
     - If core is not directly falsified, identify which *auxiliary hypotheses* (e.g., fixed technology, static policies) or *parameters* (e.g., growth rates) failed.  
     - *Output*: "Auxiliary failure" if specific auxiliaries are contradicted by evidence.  

  **Judgment Call**: Isolating the core (Step 1.1) often involves interpretation of the original claim, making it judgment-dressed-in-procedure.  

  ---

  #### **Step 2: Rescue Legitimacy Test** (25 min)  
  *Purpose*: Determine whether adjustments to the theory constitute legitimate vindication ("right but early") or ad hoc immunization.  
  **Conditions for Legitimacy**:  
  1. **Classify Rescue Type** (5 min):  
     - *Parametric Rescue*: Adjusting numerical values (e.g., changing a growth rate constant).  
     - *Structural Rescue*: Revising causal mechanisms (e.g., adding "innovation" as a feedback loop).  
  2. **Assess Parametric Rescue** (5 min):  
     - Legitimate **only if**:  
       - Original parameters were based on incomplete/uncertain data.  
       - New parameters fit observed data *without* exceeding plausible bounds (e.g., doubling efficiency gains is allowed; 100x is not).  
       - Core mechanism remains unchanged.  
     - *Output*: "Parametrically rescued" if conditions met; else, "Ad hoc."  
  3. **Assess Structural Rescue** (10 min):  
     - Legitimate **only if**:  
       - The rescue explains *all past data* the original theory did.  
       - New mechanisms are *independently supported* (e.g., innovation trends were documented pre-rescue).  
       - Core insight is preserved (e.g., "scarcity pressure" remains central).  
     - *Output*: "Structurally rescued" if conditions met; else, "Ad hoc."  
  4. **Temporal Delay Assessment** (5 min):  
     - Legitimate vindication **only if**:  
       - Delay is due to an *externally verifiable disruption* (e.g., war, policy shifts, tech breakthroughs).  
       - Core mechanism is still active (e.g., scarcity pressures re-emerge in new forms).  
     - *Output*: "Vindicated after delay" if conditions met; else, "Falsified."  

  **Judgment Call**: Deciding "plausible bounds" for parameters (Step 2.2) and "preservation of core insight" (Step 2.3) relies on analyst intuition.  

  ---

  #### **Step 3: Termination & Handoff Rules** (20 min)  
  *Purpose*: Issue a verdict or escalate to normative decision-making.  
  **Rules**:  
  1. **Definitive Falsification Verdict** (5 min):  
     - Trigger if:  
       - Core is falsified (Step 1.4) AND no legitimate rescue exists (Step 2).  
       - Rescue is deemed ad hoc (Step 2).  
     - *Output*: "Falsified" with evidence summary.  
  2. **Normative Handoff Trigger** (10 min):  
     - Escalate if:  
       - Dispute reduces to *acceptability of auxiliaries* (e.g., "Were tech breakthroughs unforeseeable?").  
       - Legitimacy of rescue is contested (e.g., "Does this structural change preserve the core?").  
       - Evidence is ambiguous, requiring *values-based weighting* (e.g., "How much risk of future crisis is acceptable?").  
     - *Output*: "Normative handoff required" + specific unresolved questions.  
  3. **Recommendations for Handoff** (5 min):  
     - Specify institutional next steps (e.g., policy committee review, scenario weighting workshop).  

  **Judgment Call**: Deciding when evidence is "ambiguous enough" for handoff (Step 3.2) is inherently subjective.  

  ---

  #### **Step 4: Failure Mode Catalog** (Integrated; review in final 10 min)  
  *Purpose*: Avoid misclassification by anticipating common errors.  
  **Explicit Failure Modes**:  
  - **Type I Error (False Falsification)**:  
    - *Cause*: Mistaking auxiliary/parametric failure for core falsification.  
    - *Avoidance*: Strictly apply Step 1.3 (inevitability test).  
  - **Type II Error (False Survival)**:  
    - *Cause*: Accepting ad hoc rescues (e.g., arbitrary parameter changes, unsupported structural adds).  
    - *Avoidance*: Enforce Step 2 conditions (independence, plausibility).  
  - **Temporal Misclassification**:  
    - *Cause*: Confusing legitimate delay (e.g., due to documented interventions) with falsification.  
    - *Avoidance*: Require external verification in Step 2.4.  

  ---

  ### **Worked Examples**  
  #### **Case 1: Malthusian Population-Subsistence Claim (1798)**  
  - **Step 1**:  
    - Core: Geometric population growth *necessarily* outstrips arithmetic food production.  
    - Discrepancy: No mass starvation by 1850; agricultural innovations boosted yields.  
    - Test: Core not falsified—crisis is delayed, not impossible. Discrepancy due to auxiliary failure (static technology assumption).  
  - **Step 2**:  
    - Rescue: Neo-Malthusians structurally rescue by adding "innovation" as a temporary feedback, but core "scarcity pressure" remains.  
    - Legitimacy: Vindicated after delay—pressures re-emerge in ecological (climate change) and distributional (inequality) forms.  
  - **Step 3**: Termination → "Vindicated after delay."  
  - **Handoff Point**: None (epistemic judgment suffices).  

  #### **Case 2: Limits to Growth (1970s)**  
  - **Step 1**:  
    - Core: Finite resources and pollution *constrain* industrial growth.  
    - Discrepancy: No collapse by 2000; substitution and efficiency gains occurred.  
    - Test: Core not falsified—constraints persist (e.g., climate change). Discrepancy due to auxiliary failure (underestimating substitution rates).  
  - **Step 2**:  
    - Rescue: Parametric (adjusting tech rates) and structural (adding substitution loops).  
    - Legitimacy: Structural rescue legitimate—new mechanisms explain substitution, but core "physical limits" remain active. Delay due to verified tech advances.  
  - **Step 3**: Termination → "Structurally rescued; vindication plausible."  
  - **Handoff Point**: Step 3.2—Unresolved normative debate: "How much substitution is feasible long-term?" requires policy weighting.  

  #### **Case 3: Freshwater Scarcity & State Collapse (Hypothetical, 2080)**  
  - **Step 1**:  
    - Core: Water scarcity *inevitably* triggers cascading state collapse.  
    - Discrepancy: Desalination/demand management avert crisis by 2050.  
    - Test: Core falsified? No—collapse could still occur. Discrepancy due to auxiliary failure (underestimating innovation).  
  - **Step 2**:  
    - Rescue: Parametric (higher desalination adoption) or structural (adding "innovation bottlenecks" to scarcity mechanisms).  
    - Legitimacy:  
      - Parametric: Legitimate if adoption rates are within plausible bounds.  
      - Structural: Ad hoc if "bottlenecks" lack independent evidence.  
  - **Step 3**:  
    - Termination → If rescue legitimate: "Rescued; monitor for re-emergence."  
    - Handoff Triggered: Step 3.2—Dispute reduces to normative question: "Is postponing collapse via energy-intensive desalination sustainable?"  
  - **Handoff Point**: Step 2.3 (judging "independence" of new mechanisms) and Step 3.2 (acceptability of energy trade-offs).  

  ---

  ### **Key Design Notes**  
  - **Reusability**: The procedure uses plain-language tests (e.g., "inevitability" for core falsification) and avoids specialized jargon.  
  - **Judgment Transparency**: Steps requiring analyst discretion are explicitly flagged (e.g., "plausible bounds," "core preservation").  
  - **Time Efficiency**: Focused on binary outputs (falsified/rescued) with clear handoff triggers to avoid open-ended debate.  
  - **Failure Mitigation**: Integrated catalog forces analysts to confront common errors during evaluation.  
  - **Output Clarity**: Distinguishes "falsified" (epistemic closure) from "handoff" (normative/policy continuation).  

  This protocol enables consistent, auditable evaluations while acknowledging irreducible subjectivity in long-range forecasting—ensuring philosophers’ insights are operationalized without requiring philosophical expertise.
