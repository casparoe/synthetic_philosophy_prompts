prompt: |-
  I'm a journalist who covers science and ideas for a small magazine, and I'm trying to help out a friend who teaches philosophy of mind at a community college — she has about 12 undergrads, one 80-minute session, and basically zero prior coursework on percetion. She wants an in-class game that makes them actually feel the force of cognitive penetration, not just debate it after skimming abstracts. Her concept is a "visual jury": students sit in a circle and examine genuinely ambiguous figures, voting on whether they see a face or a vase, but unknown to them half the group recieves a hidden framing through a fake "resource allocation" card game that quietly primes them toward threat-detection. Two assigned observers just track voting shifts without knowing about the priming either. She needs concrete rules with no real money, a payoff scheme using social credit or small class privileges, a tight timeline for the 80 minutes, and a debrief that maps the sudden voting flip onto the theoretical distinction between experience being penetrated versus just post-hoc judgment being biased. Crucially she wants them to run into the problem themselves — they should argue about whether they "really saw" differently before anyone names "cognitive penetration," which only comes out in the last ten minutes. Could you design the full activity, including the hidden mechanism, what will predictably break the first run (probably the observers catch on too early?), and an honest admission about which feature of the view — maybe the phenomenological seeming — this simulation just can't reproduce? Also please don't include a reading list, she doesn't want one.
