  We are going to design an in-class activity called "The Visual Jury" that runs in 80 minutes. The goal is to have students experience cognitive penetration (or at least the appearance of it) in perception through an engaging game.

  ### Overview of the Activity
  1. **Introduction (10 minutes)**: Brief explanation of the activity without revealing the cognitive penetration aspect. Students are told they'll be examining ambiguous images and voting on what they see. Introduce roles: jurors (voters), observers (who track voting patterns), and a facilitator (the teacher).
  2. **Role Assignment and Hidden Priming (5 minutes)**: Assign roles. Most students are jurors. Two are observers. Then, jurors are given a "resource allocation" card game that primes half of them toward threat-detection without their knowledge.
  3. **Image Voting Rounds (30 minutes total, split into two rounds)**:
     - Round 1 (Baseline): Show a set of ambiguous images (e.g., face/vase type). Each juror votes secretly on what they see (face or vase). Observers record votes without knowing about priming.
     - Round 2 (After Priming): Show the same images again (or new ones, but same type). Jurors vote again. Observers record and note any shifts.
  4. **Group Discussion and Argument (20 minutes)**: The teacher reveals that there was a manipulation (without saying what) and that the group was split. Students are encouraged to discuss: Did they really see differently? Or are they just interpreting the same experience differently? Observers present their data on voting shifts.
  5. **Debrief and Theory Introduction (15 minutes)**: The teacher explains cognitive penetration, the hidden priming, and how the activity reflects the philosophical debate. Admit limitations: we cannot reproduce the exact phenomenological experience, but we can see how expectations might shape perception.

  ### Detailed Steps

  #### Step 1: Introduction (10 min)
  - Teacher says: "Today we're going to play a game about perception. We have a set of ambiguous images. Your job as jurors is to decide what you see in each image. We'll have two rounds of voting. There are also two observers who will record the votes and look for patterns. At the end, we'll discuss what happened and why."

  #### Step 2: Role Assignment and Hidden Priming (5 min)
  - Assign 2 observers (they do not participate in voting or the card game).
  - Split the remaining 10 students (jurors) into two groups of 5. Let's call them Group A and Group B. This split should appear arbitrary (e.g., by counting off 1-2, 1s are Group A, 2s are Group B).
  - **The Hidden Priming**: 
    - Tell the jurors: "Before we start, we're going to do a quick warm-up activity about resource allocation. It's a card game that will help you get in the right mindset for the perception task."
    - Give each group a set of cards. The card game is simple: 
      - Group A (primed for threat): Their cards have scenarios that involve threat detection (e.g., "You are in a forest. Allocate your attention: 3 points to detecting predators, 2 points to finding food" or "You are in a crowd. Allocate 4 points to spotting suspicious behavior, 1 point to noticing friendly faces"). They must choose how to allocate points (but it's just a quick task, no real scoring). The goal is to prime them to be alert to threats (and hence to faces, since faces can be threatening).
      - Group B (neutral prime): Their cards have neutral scenarios (e.g., "You are at a library. Allocate 3 points to finding a book, 2 points to noticing quiet areas" or "You are at a park. Allocate 4 points to watching birds, 1 point to watching clouds"). There is no threat-related content.
    - Each group does the same number of cards (about 3-5) quickly. The teacher says it's to "warm up decision-making". This should take 3-5 minutes.

  #### Step 3: Image Voting Rounds (30 min total)
  - **Round 1 (Baseline - 10 min)**:
    - Show 5 ambiguous images (one at a time) that can be seen as either a face or a vase (or similar: e.g., duck/rabbit, young woman/old woman). 
    - For each image, jurors write down on a slip of paper: "Face" or "Vase" (or whatever the two options are for that image). Collect votes secretly (maybe in a box) so that others don't see. Observers record the votes per image per juror (they can have a grid). 
    - Note: The images should be the same for both rounds? Actually, for Round 1, use one set (say, 5 images). Then in Round 2, use the same 5 again? Or use new ones? Using the same might lead to memory effects. Alternatively, use 5 new ones in Round 2. But then we lose baseline for each image. Solution: Use the same images in both rounds? But then students might remember their previous vote. Alternatively, use different sets? But then we can't track individual image shifts. We can do:
      - Round 1: 5 images (Set 1)
      - Round 2: 5 images (Set 2) - but then we are comparing two different sets. Not ideal. 
    - Alternatively, use the same images? And tell students: "We are going to show the same images again to see if your perception changes with time." Then we can track if the same person changes their vote for the same image. But then we have to worry about memory. However, the ambiguity might be such that they can see either way even on second viewing. And we are not revealing the results until after Round 2. 
    - Let's go with: Round 1: 5 images (Set 1). Round 2: the same 5 images (Set 1 again). The teacher says: "We are going to show the same images again. We want to see if your perception remains stable." This way, we can see if the priming in between affects how they see the same image again.

  - **Round 2 (After Priming - 10 min)**:
    - Show the same 5 images again in the same order. 
    - Jurors vote again (secret ballot). Observers record.

  - **Observers' Role**: They note the votes per image per juror in both rounds. They don't know about the groups. They are just told to record who votes what and if there is a change.

  #### Step 4: Group Discussion and Argument (20 min)
  - The teacher collects the votes and the observers present the data. They can make a table on the board:
    - For each image, show the Round 1 votes (how many Face, how many Vase) and Round 2 votes.
    - Also, note how many jurors changed their vote from Round 1 to Round 2 (and in which direction).
  - The teacher then reveals: "There was a hidden factor. Half of you (Group A) did a warm-up that primed threat detection, and the other half (Group B) did a neutral warm-up. We are going to split you into your groups and let you discuss: Did the warm-up affect how you saw the images? Did you really see the image differently in Round 2? Or are you just interpreting it differently now?"
  - Split the class into two groups: Group A and Group B (the primed and the neutral). Each group discusses for 5 minutes and then presents their thoughts to the whole class. The teacher prompts: "Group A, do you think the threat-detection warm-up made you more likely to see faces? Group B, did you notice any change? What do you think happened?"
  - Then, open the floor for debate: "Do you think the warm-up changed your actual visual experience? Or did it change your judgment about what you saw? How can you tell?"

  #### Step 5: Debrief and Theory (15 min)
  - The teacher explains cognitive penetration: the idea that cognitive states (like beliefs, fears, expectations) can directly influence perceptual experience (what you see) rather than just your beliefs about what you see.
  - Map the activity: 
    - The threat priming might have led Group A to see faces more often in Round 2 because they were primed to detect threats (and faces are socially threatening). 
    - The voting shift in Group A (if it occurred) might be due to a change in their perceptual experience (cognitive penetration) or a change in their judgment (post-perceptual bias).
  - Admit limitations: "We cannot be sure from this activity whether the change was in the experience itself or in the judgment. We don't have access to the students' phenomenology. But note: many students in Group A might report that they truly saw the image differently. That's the feeling of cognitive penetration. However, we must be cautious because we cannot measure the experience directly. The activity is meant to simulate the conditions under which cognitive penetration might occur and to make you feel the force of the debate."
  - Conclude: "The philosophical debate centers on whether our cognitive states can actually change the way the world looks to us (not just what we think about it)."

  ### What Might Break?
  - **Observers catch on early**: They might notice that Group A (if they can identify the groups) is voting differently. But they don't know about the groups? They just record votes. They don't know who is in which group until the debrief. So they shouldn't catch on until the teacher reveals it. But if they are too sharp, they might notice that the same people are changing votes? But without knowing about the priming, they might not guess. To prevent this, the teacher should not reveal the group split until the discussion phase.
  - **No shift in votes**: It's possible that the priming doesn't work. To mitigate, choose images that are truly ambiguous and that have been shown to be influenced by priming in psychology (like the face/vase). Also, the threat priming should be strong enough. Alternatively, if there is no shift, the teacher can still use it to discuss why (maybe the priming wasn't strong enough, or maybe perception is impenetrable?).
  - **Students in Group B change too**: Maybe due to group dynamics? But we have secret ballots to avoid that.

  ### Payoff Scheme (Social Credit)
  - The teacher can offer a small reward for the group that "wins" the resource allocation game? But the resource allocation was just a priming task. Alternatively, at the end, the teacher can give "perception points" for participation, but that might not be necessary. Since it's a class activity, the payoff is the insight and the fun. But if needed, the teacher can assign a small privilege (e.g., the winning group of the resource allocation gets to leave class 1 minute early, or gets a sticker). However, the resource allocation wasn't competitive. So maybe skip a competitive payoff to avoid drawing attention to that task.

  ### Materials Needed
  - Ambiguous images (5) - printed or on a screen.
  - Voting slips (enough for 10 jurors * 5 images * 2 rounds = 100 slips) and a ballot box.
  - Cards for the priming activity: 
    - Group A (threat): about 5 cards with threat scenarios and allocation instructions.
    - Group B (neutral): about 5 cards with neutral scenarios.
  - Observers' recording sheets (grids for votes).

  ### Timeline
  - 0-10 min: Introduction and role assignment.
  - 10-15 min: Priming card game.
  - 15-25 min: Round 1 voting (5 images).
  - 25-30 min: Break? Or move to Round 2.
  - 30-40 min: Round 2 voting (same 5 images).
  - 40-60 min: Group discussion and argument (reveal groups, split, then whole class debate).
  - 60-75 min: Debrief and theory.
  - 75-80 min: Wrap up.

  This should fit into 80 minutes. The teacher can adjust timing as needed.

  ### Honest Admission
  - The teacher should admit: "This activity cannot reproduce the exact phenomenological seeming of cognitive penetration. We don't have a way to know for sure if the students' visual experience was altered or if they are just reporting based on a biased judgment. We rely on self-reports, which are fallible. The activity is designed to provoke the feeling and the debate, but it cannot conclusively demonstrate cognitive penetration."

  This design should meet the requirements: no reading list, no real money, within 80 minutes, and it sets up the debate naturally.
answer: |-
  Below is a complete, ready-to-run activity design for your friend's "Visual Jury" game. It fits an 80-minute session, requires minimal prep, and uses no real money—rewards are "perception points" redeemable for minor class privileges (e.g., choosing discussion topics). The hidden priming is embedded in a quick card game, and the debrief explicitly ties the experience to cognitive penetration theory while admitting its phenomenological limitations.

  ---

  ### **Activity: The Visual Jury**
  **Goal**: Make students experience how hidden priming can shift perception of ambiguous images, then debate whether it changed their *actual seeing* (cognitive penetration) or just their interpretation (post-hoc bias).

  **Materials Needed**:
  - 5–6 ambiguous images (e.g., Rubin’s vase/face, duck/rabbit, young/old woman).  
  - Voting tokens (two colors: e.g., blue for "Option A", red for "Option B").  
  - "Resource Allocation" cards (two types: **Threat-Prime** and **Neutral-Prime**).  
  - Timer, whiteboard for tallying votes.  
  - Role slips (for jurors, observers, facilitator).  

  **Roles**:
  - **Jurors (10 students)**: Vote on what they see in images.  
  - **Observers (2 students)**: Track voting patterns (secretly note shifts).  
  - **Facilitator (Teacher)**: Runs the game, tallies votes.  

  **Phase 1: Setup (10 min)**  
  - *Teacher intro (3 min)*: "Today we're exploring how we perceive ambiguous images. You'll be jurors deciding what you see. There’s a reward: 'Perception Points' for consistent voting. Earn 5+ points to pick tomorrow’s warm-up discussion topic."  
  - Assign roles: Randomly draw slips for 10 jurors, 2 observers. Observers get clipboards to record votes per round (they **don’t** know about priming).  
  - Split jurors into two groups (Group 1 and Group 2) using a coin flip *appearing* random (e.g., "Group 1 is left side, Group 2 right").  

  **Phase 2: Hidden Priming via "Resource Allocation" Game (15 min)**  
  - *Teacher script*: "Before voting, we’ll warm up with a quick game. Groups compete to allocate resources wisely. Most coherent strategy wins 3 Perception Points!"  
  - **Group 1 (Threat-Prime)**: Gets cards framing scenarios as **survival threats** (e.g., *"A storm is coming: Allocate 80% resources to building shelters"*; *"Wild animals nearby: Allocate 70% to lookout duty"*).  
  - **Group 2 (Neutral-Prime)**: Gets cards framing scenarios as **practical tasks** (e.g., *"Plan a garden: Allocate 50% to planting seeds"*; *"Organize books: Allocate 30% to cataloging"*).  
  - *Rules*: Groups have 8 min to discuss allocations for 3 scenarios. Observers watch but don’t participate. Teacher awards 3 points to *both* groups ("for teamwork") to avoid suspicion.  

  **Phase 3: Voting Rounds (25 min total)**  
  ***Round 1: Baseline (Before Priming)***  
  - Show **Image 1** (e.g., vase/face). Jurors vote secretly with tokens (blue = vase, red = face).  
  - Observers record votes (noting names). Teacher tallies and announces totals (e.g., "6 vase, 4 face") but *not* individual votes.  
  - Repeat for **2–3 more images** (5 min total).  

  ***Round 2: After Priming***  
  - Repeat with the **same images** in the same order (crucial for detecting shifts).  
  - Jurors vote again. Observers record changes (e.g., "Juror 3 switched from vase to face on Image 1").  
  - *Teacher tip*: Rush voting slightly ("We’re running late!") to prevent overthinking (10 min).  

  **Phase 4: Reveal & Debate (20 min)**  
  - *Step 1 (5 min)*: Observers report vote shifts (e.g., "On Image 1, 4 people switched to seeing faces"). Teacher writes shifts on the board.  
  - *Step 2 (10 min)*: Teacher reveals the priming: "Group 1 was primed for threat; Group 2 for neutral tasks. Did this affect what you *saw*?"  
    - **Prompt debate**: "Jurors from Group 1: Did you genuinely *see* more threats (e.g., faces) in Round 2? Or did you just *interpret* the image that way?"  
    - **Encourage conflict**: "Group 2, did your perception stay the same? Why might Group 1 insist they ‘saw’ differently?"  
  - *Step 3 (5 min)*: Teacher stirs the pot: "If two jurors see the same image differently, can both be right? Did Group 1’s priming alter their *experience*—or just their *judgment*?"  

  **Phase 5: Debrief & Theory (10 min)**  
  - *Cognitive penetration reveal (5 min)*: "Today you experienced **cognitive penetration**—when cognition (like threat sensitivity) ‘penetrates’ and alters perception itself. Philosophers debate: Does priming change how the world *looks* (experience), or just how we *label* it (judgment)?"  
    - **Map the activity**:  
      - *Cognitive penetration claim*: "Group 1 *saw* more faces because threat priming altered their perceptual experience."  
      - *Judgment bias claim*: "Group 1 *interpreted* the same sensation differently after priming."  
  - *Honest limitation (3 min)*: "**What this game can’t replicate**: The *phenomenological seeming*—the raw ‘what it’s like’ of the experience. We only have your reports. You might *feel* your vision changed, but we can’t prove it wasn’t post-hoc bias. That’s the heart of the philosophy!"  
  - *Wrap-up (2 min)*: Award Perception Points (all get 5+ for engagement). Pose: "Tomorrow, we discuss: Can science ever resolve this debate?"  

  ---

  ### **Predictable "Breakage" & Fixes**
  - **Problem**: Observers notice Group 1 voting more erratically in Round 2 and guess priming.  
    - **Why**: Humans pattern-match! If Group 1 shifts votes toward threat-associated images (faces), observers might whisper: "Did Group 1 get different instructions?"  
    - **Fix**: Teacher pre-briefs observers: "Your job is *only* to record votes—no speculating until Phase 4." If they slip, redirect: "Hold that thought for the debate!"  

  - **Problem**: No voting shift occurs (e.g., priming fails).  
    - **Why**: Priming is subtle; some students resist suggestion.  
    - **Fix**: Use highly malleable images (e.g., the "young/old woman" illusion). If votes don’t shift, pivot: "Why *didn’t* priming work? Does this support the view that perception is *impenetrable*?"  

  ---

  ### **Why This Works**  
  - **Hidden mechanism**: The "resource allocation" game feels like a fun warm-up but primes threat-detection (Group 1) vs. neutrality (Group 2). Students won’t suspect it’s manipulating perception.  
  - **Payoff**: Perception Points create stakes without money (e.g., "Redeem 5 points to skip one quiz question").  
  - **Debate-first structure**: Students argue about "what they saw" *before* learning the theory—making the cognitive penetration debate visceral.  
  - **Theoretical punch**: The final debrief explicitly contrasts penetration (altered experience) vs. bias (altered judgment), using the students’ own confusion as evidence.  

  **Final Note**: This simulation excels at making the *concept* of cognitive penetration tangible but openly admits its inability to resolve the "hard problem" of subjective experience. The students’ frustration ("But I *really saw* it differently!") becomes the teachable moment.
