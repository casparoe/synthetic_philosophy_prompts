  I should also note where each reading's support for the anti-AI conclusion is weak. For instance, social externalism doesn't inherently require individual causal contact, so maybe AI could be part of the community. The expert reliance here is crucial—if experts mediate reference, and AI uses their usage, perhaps it's included. But critics would argue that without the causal chain, it's parasitic.

  The user's focus on the parallel to Twin Earth is smart. Twin Earth separates meaning from individual psychology, but doesn't address entities without any causal history. AI is a new case—trained on text but no direct interaction. The question is whether text alone can sustain reference via community practice.

