  Let me tackle each reading. The trivial one is straightforward—mental images aren't sufficient. Everyone agrees, but it's weak against AI since LLMs don't rely on mental imagery. The Twin-Earth reading requires causal interaction with H2O. This seems to exclude AI unless we stretch "causal connection" to include data derived from humans. But is that valid?

  Social externalism shifts the burden to experts. Here, if AI is embedded in our linguistic practices, maybe it can refer through the community. But experts might say AI lacks the right causal history. The broad content externalism extends beyond natural kinds. If all concepts require external factors, AI might be in trouble, but this view is controversial.

