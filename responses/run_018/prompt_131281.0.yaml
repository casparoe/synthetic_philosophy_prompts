prompt: |-
  hey so im in this philosophy elective and weve been talking about the problem of other minds, like how do i actually know my friends arent just really convincing robots? and i noticed this weird pattern whenever we talk about whether something else could have a mind — not just robots but also like octopuses or ai. first people say "well they need to talk and show emotion," then if you show them something that does both they say "okay but it needs to actually feel pain from the inside," and then if you imagine a thing that does that too they suddenly say "no it needs to be part of our evolutionary story" or whatever. each step sounds kinda reasonable on its own but together it feels like the rules keep changing just to keep humans special. i was arguing with my friend about this after class and he said im just describing moving the goalposts, but i dont think thats right because its not like theyre defending one claim and retreating — theyre genuinely giving a different reason each time and none of them are obviously wrong. is there an actual name for this specific thing where the criteria for having a mind keep getting replaced with deeper hidden ones whenever the surface ones get met? and if there isnt, could you name it and say exactly what makes it different from regular skepticism or from just being biased? please keep it to one paragraph, under 180 words, and dont just list philosophers — i want the concept carved out precisely.
