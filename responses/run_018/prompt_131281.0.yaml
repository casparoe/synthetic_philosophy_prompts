answer: |-
  This pattern is best described as **criterial escalation for phenomenal consciousness**: a sequential layering of increasingly inaccessible requirements for attributing inner experience ("mind"), where each newly proposed criterion (linguistic behavior, phenomenal qualia, biological origin) emerges *only after* the previous one is satisfied by a non-human candidate. Unlike simple moving goalposts defending a single claim, this involves replacing the *entire basis* of judgment with a deeper, hidden property whenever a superficial criterion is met. It differs from general skepticism (which doubts *all* minds equally) and ordinary bias (which might prefer humans) by its *structured, reactive generation of novel exclusionary criteria*, specifically designed to preserve human exceptionalism by shifting the burden of proof to realms fundamentally beyond empirical verification for non-humans. The core mechanism is the substitution of observable or functional attributes with intrinsically private or historical ones when challenged.

