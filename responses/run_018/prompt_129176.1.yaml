answer: |-
  Here are the desiderata for an account of moral objectivity that takes the described cross-cultural folk-moral variation seriously, particularly the WEIRD/non-WEIRD divergence in moral foundations. Each requirement is motivated by a specific empirical distinction or challenge.

  ### Core Desiderata (Non-Negotiable for Descriptive Adequacy)
  1.  **Descriptive Adequacy:**
      *   **Requirement:** The account must accurately describe and explain the observed empirical pattern: near-universal presence of harm/care foundations (though variably weighted), significant cross-cultural variation in the salience *and* conceptual structure of loyalty/purity foundations (e.g., hierarchical reciprocity vs. communal-sharing).
      *   **Motivating Case:** Protecting the difference between what is observed (variation in presence, salience, *and* conceptualization) versus forcing the data into pre-existing theoretical boxes. Any metaethics must start from the phenomena it seeks to explain.

  2.  **Distinguishing Absence from Low Salience:**
      *   **Requirement:** The account must provide criteria or explanations for when a moral foundation/concept is genuinely *absent* within a culture's folk-morality versus when it is *present but low-salience or contextually restricted*.
      *   **Motivating Case:** The difference between cultures where loyalty/purity concepts are robustly present (even if WEIRD observers find their content strange) versus cultures where specific loyalty/purity norms seem genuinely non-existent or irrelevant in moral discourse. This protects against misinterpreting low frequency as absence.

  3.  **Distinguishing Weighting Differences from Conceptual Incommensurability:**
      *   **Requirement:** The account must distinguish between instances where cultures share the *same underlying moral concept* but assign it different *relative importance* (weighting) versus instances where the *conceptual structure itself* differs significantly enough to suggest genuine incommensurability or non-overlapping concerns (e.g., hierarchical obligation vs. communal sharing as fundamentally different ways of conceptualizing loyalty).
      *   **Motivating Case:** Protecting the crucial difference between "They care less about X than we do" (weighting) and "They conceptualize X in a way that doesn't map cleanly onto our concept of X at all" (conceptual structure). Harm/Care shows weighting differences; some Loyalty/Purity cases show structural differences.

  4.  **Accounting for Variable Robustness of Foundations:**
      *   **Requirement:** The account must explain why some foundations (Harm/Care) exhibit near-universal presence and recognizable conceptual structure across cultures, while others (Loyalty/Purity) show much greater variation in both presence/salience and conceptual structure.
      *   **Motivating Case:** Protecting the difference between near-universal moral concerns and culturally contingent ones. It cannot treat all foundations as equally fundamental or equally variable. Explaining *why* Harm/Care is more robust is key.

  5.  **Distinguishing Intersubjective Convergence from Mind-Independence:**
      *   **Requirement:** The account must clearly articulate the relationship between widespread cross-cultural agreement (e.g., on core harm norms) and any claim to mind-independent moral truth. It must avoid conflating "many cultures agree" with "therefore it's objectively true," while also explaining the significance of such convergence where it exists.
      *   **Motivating Case:** Protecting the difference between descriptive facts about shared beliefs ("intersubjective convergence") and a metaphysical claim about truth independent of those beliefs ("mind-independence"). The near-universality of harm norms doesn't *automatically* prove objectivity.

  ### Camp-Specific Desiderata
  6.  **Avoiding Parochialism (Primarily Realist/Universalist Concern):**
      *   **Requirement:** (Especially for Realism) The account must avoid defining objectivity solely in terms of the moral concepts prominent in one cultural context (typically WEIRD). It must show how mind-independent truth could accommodate or explain the diversity of *genuine* moral concepts (like differing Loyalty structures) without reducing them to errors or incomplete understandings.
      *   **Motivating Case:** Protecting against the charge that realism merely universalizes WEIRD intuitions. If hierarchical reciprocity and communal sharing are both valid conceptualizations of loyalty obligations, realism needs resources to accommodate this without declaring one culture fundamentally mistaken about the nature of loyalty.
      *   **Camp:** Primarily challenges Robust Moral Realism.

  7.  **Avoiding Normative Collapse (Primarily Relativist/Subjectivist Concern):**
      *   **Requirement:** (Especially for Relativism/Subjectivism) The account must avoid reducing all moral judgments to mere cultural preferences or making normative critique across genuinely different conceptual frameworks impossible. It needs to explain the (limited but real) cross-cultural traction of norms like harm and the potential for moral progress or dialogue across conceptual divides.
      *   **Motivating Case:** Protecting the intuition that stopping genocide isn't just "imposing WEIRD values," and that dialogue/critique *is* sometimes possible even when concepts differ (e.g., framing harm within a purity context to argue against a practice). Relativism risks losing normative force.
      *   **Camp:** Primarily challenges strong Relativism/Subjectivism.

  8.  **Explaining Constraint on Variation (Primarily Pluralist Concern):**
      *   **Requirement:** (Especially for Pluralist accounts) The account must explain both the possibility of significant conceptual variation *and* the limits thereof (e.g., why harm/care is near-universal, why certain conceptual structures for loyalty/purity recur). It must specify the "plural" elements and the constraints binding them.
      *   **Motivating Case:** Protecting the observation that variation isn't infinite chaos; there are patterns and constraints (e.g., recurring themes of reciprocity, hierarchy, sacredness, even if framed differently). Pluralism needs structure, not just plurality.
      *   **Camp:** Core to Pluralism, but a challenge for it to define clearly.

  ### Analysis of Joint Satisfiability & Exclusionary Power

  *   **Joint Satisfiability:** A significant tension exists between **Descriptive Adequacy** (requiring taking conceptual incommensurability seriously, e.g., loyalty as hierarchy vs. communion) and **Avoiding Normative Collapse** (requiring some basis for cross-cultural critique/dialogue). How can critique occur if the core concepts are fundamentally different? Simultaneously, **Avoiding Parochialism** (for realism) and providing a robust explanation for the **Variable Robustness of Foundations** is challenging. Why are Harm/Care concepts so stable if objectivity encompasses diverse conceptual structures for other foundations? **Distinguishing Intersubjective Convergence from Mind-Independence** also interacts tensely with **Variable Robustness**: Does the convergence on harm suggest mind-independence, or is it just a robust intersubjective phenomenon with a different cause? A sophisticated pluralist realism might satisfy most, but **Avoiding Parochialism** remains a high bar.
      *   **Most Challenging Pair:** **Conceptual Incommensurability Recognition** (part of Descriptively Adequately handling point 3) and **Avoiding Normative Collapse**.

  *   **Most Excluding Requirement:** **Distinguishing Weighting Differences from Conceptual Incommensurability** (Requirement 3) does the most to exclude popular theories.
      *   **Why:** Many popular theories struggle with genuine conceptual incommensurability.
          *   **Simple Universalism/Rationalism:** Often reduces variation to weighting or faulty application of universal reason, failing to account for fundamentally different conceptual structures (e.g., framing loyalty as hierarchy vs. communion as equally valid moral concerns).
          *   **Strong Cultural Relativism:** While accommodating diversity, it often struggles to explain the *pattern* of variation (especially the robustness of harm) and the possibility of dialogue/critique *across* incommensurable frameworks implied by the requirement to avoid normative collapse.
          *   **Simple Subjectivism/Emotivism:** Tends to flatten all disagreement to differences in feeling, missing the structural differences in how moral concepts are cognitively framed and reasoned about.
          *   **Reductionist Naturalism (e.g., strict evolutionary accounts):** May explain the origin of foundations but struggles to explain the profound cultural elaboration and conceptual transformation (incommensurability) of loyalty/purity concepts, which seem less directly tied to evolutionary imperatives than harm/care. Requirement 3 demands an account of this conceptual diversity itself.

  This requirement forces theories to grapple with the depth and nature of the variation observed, moving beyond simple models of "same morals, different priorities" or "completely different, isolated moral worlds." It highlights the need for a metaethics that can handle both significant overlap *and* deep structural divergence in moral thought.
