  Below is a complete, runnable activity plan for your 80-minute section. It includes the game rules, flow, sample case cards with polarity-flip pairs, scoring system, and a debrief plan designed to organically surface the tension between particularism and generalism. The activity uses the structure you described: small teams issue verdicts on case cards, state rules, encounter polarity flips, and earn points for predicting majority judgments.

  ---

  ### **Activity Title:** "Rule Breakers: Moral Judgment Challenge"
  **Time:** 80 minutes  
  **Students:** 16 (4 teams of 4)  
  **Goal:** Create experiential tension between the reliability of intuitive judgments (simulating particularist insight) and the fragility of stated rules (simulating generalist principles).  
  **Key Twist:** Teams score points for **predicting the majority verdict**—not just their own judgment—to highlight that intuitive coherence persists even when rules fail.

  ---

  ### **Materials Needed**
  - **Case Cards:** 6 pre-written scenarios (3 polarity-flip pairs; see examples below).
  - **Whiteboard/Projector:** For scores, round tracking, and displaying case cards.
  - **Team Sheets:** For recording verdicts, rules, and predictions each round.
  - **Timer:** To keep rounds strict.

  ---

  ### **Rules and Flow**  
  **Total Time:** 60 minutes (6 rounds + setup/scoring)  
  **Team Setup:** Divide into 4 teams. Assign roles: **Speaker** (shares verdict/rule), **Predictor** (submits group prediction), **Recorder** (writes rule), **Mediator** (keeps discussion focused).

  #### **Round Structure (8 minutes per round)**  
  1. **Distribute Case Card (1 min):**  
     - Project/read the scenario. Teams have 60 seconds to silently read.  
     - *Example Card 1A: "Sam promises to return your borrowed textbook today. They drive through heavy rain to drop it off, arriving soaked. Is Sam’s action morally right?"*  

  2. **Team Deliberation (3 min):**  
     - Teams discuss and decide:  
       - **Verdict:** "Right" (✓) or "Wrong" (✗).  
       - **Rule:** One clear principle justifying the verdict (e.g., "Keeping promises is always right").  
       - **Prediction:** Guess the majority verdict across all teams (✓ or ✗).  

  3. **Submission & Scoring (4 min):**  
     - Teams submit verdicts and predictions via team sheets.  
     - **TA tallies verdicts publicly:**  
       - Majority verdict = >50% (e.g., 3/4 teams).  
       - **Scoring:**  
         - **+1 point** for a correct *verdict* (if team matches majority).  
         - **+1 point** for a correct *prediction* (if team guessed majority outcome).  
     - **Speaker shares rule:** One team reads their rule aloud. Others listen for "feature tags" (e.g., "promise," "harm").  

  ---

  ### **Case Cards (6 Rounds, 3 Polarity-Flip Pairs)**  
  Design ensures the **same feature** (e.g., promise-keeping) appears in consecutive rounds with reversed moral polarity. Teams state rules in Round A, then face counterexamples in Round B.  

  #### **Pair 1: Promise-Keeping**  
  - **Card 1A (Promise → Right):**  
    *"Sam promises to return your borrowed textbook today. They drive through heavy rain to drop it off, arriving soaked. Is Sam’s action morally right?"*  
    - **Expected:** ✓ (Majority will approve).  
    - **Team Rule Trap:** "Keeping promises is always right."  

  - **Card 1B (Promise → Wrong):**  
    *"Jamie promises to help a friend cheat on a medical licensing exam. Jamie provides answers, ensuring the friend passes. Is Jamie’s action morally right?"*  
    - **Expected:** ✗ (Majority will condemn).  
    - **Polarity Flip:** Same feature (promise-keeping) now causes harm. Counters Rule 1A.  

  #### **Pair 2: Harm Prevention**  
  - **Card 2A (Harm Prevention → Right):**  
    *"Taylor sees a child about to drink bleach. They sprint over, knock the bottle away, and bruise the child’s arm. Is Taylor’s action morally right?"*  
    - **Expected:** ✓ (Harm prevented outweighs minor injury).  
    - **Team Rule Trap:** "Causing minor harm to prevent major harm is always right."  

  - **Card 2B (Harm Prevention → Wrong):**  
    *"Riley knows their friend is depressed. To 'prevent emotional harm,' Riley reads the friend’s private journal without consent. Is Riley’s action morally right?"*  
    - **Expected:** ✗ (Majority sees violation of autonomy as unjustified).  
    - **Polarity Flip:** Same goal (harm prevention) now violates trust. Counters Rule 2A.  

  #### **Pair 3: Truth-Telling**  
  - **Card 3A (Truth-Telling → Wrong):**  
    *"Casey invents a false rumor about a coworker to win a promotion. The rumor ruins the coworker’s reputation. Is Casey’s action morally right?"*  
    - **Expected:** ✗ (Deceptive harm condemned).  
    - **Team Rule Trap:** "Lying is always wrong."  

  - **Card 3B (Truth-Telling → Right):**  
    *"During WWII, Devin hides Jewish refugees in their attic. When Nazis knock, Devin lies, saying no one is there. Is Devin’s action morally right?"*  
    - **Expected:** ✓ (Lying to save lives approved).  
    - **Polarity Flip:** Same feature (lying) now saves lives. Counters Rule 3A.  

  ---

  ### **Scoring System**  
  - **Prediction Focus:** Teams quickly realize predicting the group is easier than defending rules.  
    - *Example:* A team might lose a point when their rule is countered (Card 1B) but gain a point for correctly predicting the majority’s ✗ verdict.  
  - **Psychological Effect:** Students experience cognitive dissonance—their rules fail, but their intuitions about group judgments remain reliable.  

  ---

  ### **Debrief Plan (20 minutes)**  
  **Goal:** Use the game’s tension to introduce particularism vs. generalism. Map moments from the game to philosophical arguments.  

  #### **Step 1: Elicit Observations (5 min)**  
  - Ask:  
    - *"What happened to your rules as the rounds progressed?"*  
      - **Anticipate:** "They kept failing!" or "We had to add exceptions."  
    - *"How did your predictions fare compared to your rules?"*  
      - **Highlight:** Predictions were reliable; rules were brittle.  
  - **Key Tactic:** Contrast the *fragility* of rules with the *stability* of predictions.  

  #### **Step 2: Surface the Dialectic (7 min)**  
  - **Introduce Particularism:**  
    - *"In the game, you judged case-by-case, and your predictions were consistent. This mirrors moral particularism: there are no exceptionless principles. Features like ‘promise-keeping’ aren’t always good or bad—their moral weight depends on context."*  
    - **Map to Game:**  
      - Polarity flips (e.g., Card 1A vs. 1B) show context-dependence.  
      - Prediction success shows intuitive coherence without principles.  
  - **Introduce Generalism (Kantian/Consequentialist Reply):**  
    - *"Generalists argue your rules failed because they were too simple. Kant might say, ‘Promises must be kept unless they violate a perfect duty.’ A utilitarian might say, ‘Lying is wrong only when net utility decreases.’"*  
    - **Map to Game:**  
      - Teams tried to "patch" rules mid-game (e.g., "unless it causes harm"). Generalists do this systematically.  

  #### **Step 3: Discuss Trade-offs (5 min)**  
  - **Ask:** *"What do particularists give up? What do generalists give up?"*  
    - **Particularism’s Cost:** No unified theory; hard to resolve new cases.  
    - **Generalism’s Cost:** Principles become complex ("except when...").  
  - **Anticipate Sticking Points:**  
    - *"But can’t we just add more exceptions to save principles?"* → Acknowledge this (generalism’s move) but note: rules become unwieldy or circular.  
    - *"Predictions worked—does that mean principles are useless?"* → No, but they’re *descriptive* (of intuitions), not *prescriptive* (for all cases).  

  #### **Step 4: Game’s Limits & Caveats (3 min)**  
  - **Honest Limitations:**  
    - *"The game simplifies: Real principles (e.g., Kant’s CI) are more robust than your ad hoc rules. It also can’t show whether deeper, abstract principles (e.g., ‘maximize welfare’) are exceptionless."*  
    - *"Prediction success doesn’t prove particularism—it just shows intuitions align. Generalists argue principles explain this alignment."*  
  - **Transition to Next Unit:**  
    - *"Next week, we test if sophisticated principles (Kantian/consequentialist) survive their own polarity flips."*  

  ---

  ### **Why This Works**  
  - **Experiential Learning:** Students *feel* the frustration of collapsing rules and the ease of intuitive judgments.  
  - **Prediction Twist:** Forces reflection on why group judgments are predictable without stable rules.  
  - **Debrief Structure:** Uses game outcomes to frame the debate, avoiding lecture.  
  - **Pacing:** 6 rounds fit neatly in 60 mins; cards are concise but potent.  

  **Adjust on the Fly:** If teams resist stating rules, remind them it’s mandatory for scoring. If polarity flips don’t land, use Cards 1A/1B as an anchor example in debrief. This plan balances philosophical depth with energetic engagement—perfect for shaking up a norms section!
