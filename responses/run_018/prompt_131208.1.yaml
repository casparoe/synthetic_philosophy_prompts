  ## The Honor-Mediated Unraveling: How Interests and Shame Reshape Morality

  Moral revolutions—those dramatic shifts where once-accepted practices become unthinkable—pose a persistent puzzle: what force drives their collapse? Bernard Williams, viewing morality through a lens of skeptical realism, argued that apparent moral progress typically masks shifts in underlying power structures and material interests. Moral arguments, he contended, are often rationalizations for these deeper currents, not their primary engines. Against this, Kwame Anthony Appiah champions the independent causal power of honor, arguing that transformations in what societies deem shameful or prestigious can directly trigger "normative collapse," even absent significant changes in interest or power. Resolving this tension requires a finer conceptual scalpel. Distinguishing between **"normative collapse"**—where practitioners come to see a practice as morally indefensible *on its own terms*—and **"performative withdrawal"**—where elites abandon a practice because its social rewards vanish, *even while privately clinging to its justification*—reveals that honor is neither fully autonomous nor merely epiphenomenal. Instead, it functions as the crucial mediating structure through which shifts in interest are *experienced* as compelling moral imperatives, making Appiah's mechanism powerful but ultimately dependent on Williams' foundations.

  Appiah's compelling historical cases illustrate the distinction. Consider dueling among European aristocrats. Its decline wasn't solely due to state monopolization of violence (a Williams-esque power shift) or changing battlefield tactics reducing the nobility's military value (an interest shift). Crucially, as Appiah notes, dueling lost its luster as a mark of honor. Rising bourgeois values mocked aristocratic codes as irrational, wasteful, and barbaric. The duelist, once the epitome of courage, risked becoming an object of ridicule. Yet, was this pure normative collapse? Many duelists didn't suddenly find the ethics of defending personal honor with pistols abhorrent. Instead, we see **performative withdrawal**. The social cachet, the deference, the very prestige that made the risk worthwhile evaporated. Elites stopped dueling not because they rejected its core principle (defending honor through violence) but because the practice no longer reliably conferred honor; it increasingly conferred shame or mockery. The shift in *social rewards* (driven partly by bourgeois criticism challenging aristocratic privilege – an interest shift) rendered the performance pointless, even counterproductive.

  Foot-binding in China presents a stronger case for Appiah's normative collapse. The campaign against it mobilized potent moral arguments centered on suffering, health, and China's international standing. Crucially, shame played a central role. Anti-foot-binding societies publicly shamed practitioners, reframing bound feet not as a mark of beauty and status but as a symbol of backwardness, maternal cruelty, and national humiliation. Here, a significant segment of practitioners, particularly mothers, did experience a shift in their own moral convictions. The act came to be seen *by them* as indefensibly cruel to their daughters, conflicting with deep maternal instincts. The international humiliation angle, tied to nationalist interests in modernization, provided powerful leverage, but the mechanism of shame worked directly on individual conscience. This suggests genuine **normative collapse** occurred alongside external pressure. However, the *speed* and *effectiveness* of this collapse relied heavily on the underlying shift in China's geopolitical position and the growing nationalist imperative for modernization – aligning with Williams' emphasis on material and social interests creating fertile ground for moral arguments and shame to take root.

  These cases point towards a verdict: **honor is best understood not as an autonomous causal mechanism, but as the essential mediating structure through which shifts in material and social interests become subjectively compelling and morally charged, thereby enabling both performative withdrawal and normative collapse.** Honor codes provide the social grammar, the currency of esteem and shame, that makes the consequences of changing interests *feel* like moral imperatives. Williams is correct that fundamental shifts in power (state monopolization of force) or interests (economic modernization, nationalist competition) create the preconditions for moral change. However, Appiah is equally correct that this change often manifests *through* the transformation of honor codes. The shift in social rewards (Williams' interests) only becomes a reason for abandonment *because* of the honor system: when an act ceases to confer prestige and instead invites shame (performative withdrawal), or when the act itself becomes intrinsically shameful due to new moral arguments absorbed into the honor code (normative collapse).

  This distinction has profound practical implications for predicting the vulnerability of contemporary norms. Practices sustained primarily by elite prestige and social reward, without deep internalized moral justification beyond honor, are vulnerable to **rapid dissolution via performative withdrawal** if the social calculus shifts. Consider certain conspicuous consumption habits linked to extreme environmental damage. If public sentiment shifts decisively, branding such consumption as shamefully irresponsible rather than prestigious, elites may abandon it rapidly – not necessarily due to a deep moral conversion, but because the social rewards evaporate and turn negative. The underlying "morality" of status display might persist, but its expression changes.

  Conversely, norms deeply embedded in perceived moral necessity or identity, even if sustained by honor, will likely undergo **gradual erosion**, requiring a deeper normative collapse. Changing entrenched views on issues like animal rights in industrial farming or deeply held religious/cultural practices involves dismantling internal justifications. Shame campaigns (Appiah) can be powerful tools here, but their success depends on leveraging existing or emerging interest shifts (Williams), such as public health concerns, economic inefficiencies, or international pressure, to make the shame resonate. The decline of slavery, while ultimately involving normative collapse, was a protracted struggle precisely because its justifications were deeply woven into economic systems, racial ideologies, and social structures – requiring massive shifts in power, economy, *and* honor-based perceptions to unravel completely.

  In essence, moral revolutions are rarely driven by pure reason or pure power alone. Williams exposes the bedrock of interest, while Appiah illuminates the vital social-psychological pathway of honor and shame. Recognizing that elites often abandon practices when honor turns to shame (performative withdrawal) before, or even without, full moral renunciation (normative collapse), and understanding honor as the lens through which interest shifts are morally internalized, provides a more nuanced and powerful framework. It allows us to anticipate which norms might crumble quickly under social pressure and which will require the harder, slower work of changing hearts and minds by connecting moral arguments to shifts in the tangible rewards and penalties dictated by a transformed code of honor.
