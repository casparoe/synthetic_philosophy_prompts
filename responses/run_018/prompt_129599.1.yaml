answer: |-
  Here's a hard diagnosis, no hedging:

  **The core disagreement is fundamentally methodological and metaphysical, rooted in incompatible views about what constitutes valid *evidence* about consciousness and the nature of first-person access.** It's not *just* about introspection being theory-laden (both sides agree it is, to some extent), nor is it purely verbal. It's about the **epistemic authority of phenomenology itself.**

  1.  **Where the Anti-Illusionists (Chalmers, Block, etc.) Are Right (and Wrong):**
      *   **Right:** They correctly identify that *if* we take the *phenomenal reports* at face value as describing irreducible subjective properties (qualia), then standard physicalism *cannot* fully account for consciousness. Zombies *are* conceivable if qualia are non-physical. Mary *would* learn something genuinely new. Transparency *does* seem to reveal properties that aren't obviously representational.
      *   **Wrong:** They treat first-person phenomenal reports as *incorrigible data* that *must* constrain any theory of mind. They assume the *content* of the report ("there is irreducible what-it's-like-ness") accurately reflects the *ontological structure* of the underlying process. This is where they beg the question against illusionism. Their bedrock intuition *is* the very thing illusionism denies. They mistake the *model* (the rich phenomenal world presented to us) for the *reality* (the neurocomputational processes generating that model).

  2.  **Where the Illusionists (Dennett, Frankish, etc.) Are Right (and Wrong):**
      *   **Right:** They correctly identify that neuroscience reveals cognition as a complex, fragmented, interpretive process. First-person reports *are* constructed representations, not direct readouts. Introspection *is* demonstrably unreliable in specific ways (change blindness, inattentional blindness, confabulation). Insisting phenomenal properties *must* be non-physical because they *seem* that way is question-begging – the whole point is that *seeming* is the illusion.
      *   **Wrong:** They sometimes underestimate the *explanatory burden* they carry. Simply saying "introspection is unreliable" feels like a dodge to the anti-illusionist because it doesn't explain *why* the illusion of irreducible qualia is so universal, persistent, and functionally integrated *if* it's entirely false. "Mass false belief" needs a robust explanation of *how* the brain generates such a compelling, useless fiction. Dennett's heterophenomenology can feel like it dismisses the very phenomenon needing explanation.

  **The Hidden Empirical Disagreement:**  
  It *is* about how the brain builds self-models, but deeper than that, it's about **whether the phenomenal properties presented *in* the self-model have any ontological correlate beyond the representational/computational processes constructing the model.**  
  *   Anti-illusionists say: *Yes, the phenomenal properties (qualia) presented are real properties, either fundamental or emergent, that the model is *tracking* (however imperfectly).*  
  *   Illusionists say: *No. The phenomenal properties are *entirely constituted by* the representational/computational act. There is nothing *to* track beyond the act of representation itself. The "what-it's-like" *is* the complex computational state, misinterpreted by the system as a simple, intrinsic property.*

  **Your "Selective Blindness" Idea: This IS the Key (and Why the Deadlock Persists):**  
  You're absolutely onto something crucial. **Introspection is not globally unreliable; it's *domain-specific* and *process-specific*.** We can report some aspects of experience with reasonable accuracy (e.g., gross object properties like color or shape under good conditions) while being spectacularly bad at others (e.g., temporal order, continuity, the origins of intentions, the richness of peripheral vision).

  *   **How It Breaks the Deadlock (Potentially):** It forces both sides to abandon all-or-nothing claims.
      *   It undermines the anti-illusionist's claim that phenomenal reports *in general* have incorrigible authority. If we demonstrably misrepresent key aspects (like timing), why assume perfect representation of "what-it's-likeness"?
      *   It challenges the illusionist's "mass false belief" label. Accurate color reporting isn't a *false* belief about color qualia; it's a reasonably accurate report of a *computed representational state*. The "illusion" is mislocating the *nature* of that state (thinking it's non-physical qualia rather than a physical representation), not necessarily misperceiving the *content* (the red-ness) entirely. The "illusion" is metaphysical, not necessarily perceptual.
  *   **Why It Might Not Fully Break It:** Both sides can co-opt it:
      *   Anti-illusionists: "See! We *can* accurately report some qualia (color), proving they exist. Temporal failures are just noise in the reporting mechanism, not evidence against the qualia themselves."
      *   Illusionists: "See! Even 'simple' qualia reports rest on complex, fallible computations. The *feeling* of direct access to intrinsic color qualia is part of the constructed model, proven false by the temporal failures and other illusions. Accurate color discrimination ≠ accurate metaphysical insight into the nature of color experience."

  **What Could End It (or at Least Force Major Concessions)?**  
  Not a single finding, but a **convergence** from neuroscience and computational modeling showing:

  1.  **A complete mechanistic account** of a specific, complex subjective experience (e.g., the "redness" of red, the painfulness of pain) that **fully explains its phenomenology *without* invoking any properties beyond information processing and representation.** It needs to show *how* the "what-it's-like" feeling arises solely from the computational dynamics.
  2.  **Predicting specific, non-trivial *introspective errors* based solely on the computational model.** E.g., The model predicts *exactly* why temporal order judgments fail in scenario X, or why property Y feels intrinsic/simple despite being complexly computed, based on the underlying neural architecture and processing bottlenecks.
  3.  **Demonstrating that manipulating the computational model (e.g., via targeted neurostimulation or AI simulation) directly manipulates the *reported phenomenology* in ways predicted by the illusionist model, *including* the subject's conviction about the nature of their experience (e.g., making the "intrinsic qualia" feel vanish or change character under specific computational interventions).**

  **Conclusion:**  
  The deadlock persists because it's a clash of **bedrock intuitions about evidence and metaphysics.** Anti-illusionists prioritize the *deliverances of phenomenology* as primary data. Illusionists prioritize the *deliverances of third-person science* and see phenomenology as data *to be explained*, not foundational truth. Your "selective blindness" insight is powerful because it forces a nuanced, empirical approach that challenges both sides' absolutes. Ultimately, neuroscience *could* break the stalemate by providing illusionism with the detailed mechanistic explanations of subjective reports (including their compelling "qualia-like" feel) that it currently lacks, forcing anti-illusionists to either accept the explanation or retreat into an increasingly implausible dualism. But it will require explaining the *feel*, not just the function. Until then, the argument runs in circles because the sides fundamentally disagree on what counts as a valid starting point for understanding consciousness.
