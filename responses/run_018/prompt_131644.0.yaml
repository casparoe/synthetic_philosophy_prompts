answer: |-
  Here's a practical decision procedure for your acquisitions committee, structured as ordered gates with explicit judgment points. It distills the philosophical concepts into operational questions, flags where subjectivity is unavoidable, and includes hard stops. British English throughout.

  **Core Principles Embedded:**
  - **Aesthetic Autonomy**: *Can the work stand independently of the artist’s misconduct?*
  - **Moral Taint**: *Does the misconduct "infect" the work’s meaning or reception?*
  - **Institutional Complicity**: *Would acquiring/displaying imply endorsement or cause reputational harm?*
  - **Epistemic Contamination**: *Does appreciating the work require wilfully ignoring verified harm?*

  ---

  **The Procedure: 5 Gates, 45 Minutes**

  **Gate 1: Severity & Verification**  
  *Question: Is the allegation/conviction for an act of severe, verified harm?*  
  - **Severe harm**: Violence, abuse, coercion, hate crimes, major fraud impacting vulnerable people.  
  - **Verified**: Criminal conviction, credible investigation (court/trade body/independent panel), or credible first-person accounts with corroboration.  
  - *Sufficient YES*: Proceed to Gate 2.  
  - *Sufficient NO* (e.g., unverified rumours, minor financial dispute): **STOP. Case rejected for procedural reasons (insufficient grounds)**.  
  - *Judgment Point*: "Credible" requires committee vote (simple majority). Define "severe" in your ethics policy *in advance* (e.g., "involving bodily/psychological harm or systemic exploitation").

  **Gate 2: Direct Contamination of the Work**  
  *Question: Is the misconduct materially linked to the work’s creation, content, or meaning?*  
  - Look for:  
    - Work *depicts/glorifies* the harmful act (e.g., racist imagery by a known racist).  
    - Work *required* the misconduct (e.g., non-consensual imagery).  
    - Work *profits directly* from crime (e.g., stolen funds used for materials).  
  - *Sufficient YES*: **STOP. Hard rejection** (taint is inherent).  
  - *Sufficient NO*: Proceed to Gate 3.  
  - *Judgment Point*: "Materially linked" is interpretive. Committee must debate *specific connections*, not general associations. Minutes must record rationale.

  **Gate 3: Epistemic Contamination Risk**  
  *Question: Would displaying this work force viewers to suppress knowledge of harm to engage with it?*  
  - Key indicators:  
    - The work’s *formal qualities* (beauty, skill) are its primary value.  
    - Engagement *depends* on ignoring context (e.g., serene landscapes by a known torturer).  
    - The artist’s persona is *inextricable* from reception (e.g., a "genius" myth built on abuse).  
  - *Sufficient YES*: Proceed to Gate 4 (Institutional Risk).  
  - *Sufficient NO* (e.g., work actively critiques the misconduct): Proceed to Gate 5 (Merit Assessment).  
  - *Judgment Point*: "Force viewers" is subjective. Focus on *reasonable audience experience*. Would a typical visitor feel complicit? Vote if unclear.

  **Gate 4: Institutional Risk Assessment**  
  *Question: Would acquisition/display likely cause significant reputational damage or undermine our mission?*  
  - Consider:  
    - Public/funder/staff reactions based on *current* sentiment.  
    - Artist’s notoriety vs. obscurity.  
    - Mitigations (e.g., contextual text, accompanying programming).  
  - *Sufficient YES*: **STOP. Hard rejection** (practical duty to institution).  
  - *Sufficient NO*: Proceed to Gate 5.  
  - *Judgment Point*: "Significant damage" requires speculative risk assessment. Director must advise on operational realities.

  **Gate 5: Merit & Necessity Judgment**  
  *Question: Does the work’s artistic/cultural value *for our specific institution* outweigh residual ethical concerns?*  
  - **This is purely a committee value judgment**. No more checkboxes.  
  - Discuss:  
    - Work’s uniqueness, relevance to collection, critical importance.  
    - Alternatives by ethical artists addressing similar themes.  
    - Symbolic impact of acquisition vs. rejection.  
  - *Outcome*: **Final committee vote** (secret ballot if preferred). Director signs off or vetoes based on institutional strategy.

  ---

  **Test Cases Run Through the Gates:**

  1. **Abstract Painter (Convicted Fraud):**  
     - G1: YES (fraud verified).  
     - G2: NO (no link between fraud and abstract canvases).  
     - G3: **YES** (appreciating formalism requires ignoring fraud). → G4: Assess risk. Is fraud notorious? If minor/forgotten, maybe proceed to G5. If high-profile, likely reject.  
     - *Likely Outcome*: Gate 4 rejection if fraud is recent/scandalous. Gate 5 acquisition if obscure.

  2. **Sculptor (Coercion Allegations, Work About Consent):**  
     - G1: YES (severe alleged harm).  
     - G2: **YES** (work’s theme is directly contaminated by allegations). → **HARD REJECTION** at Gate 2.  
     - *You’ll dislike this* – but the framework bites hard here. The work’s content makes the link inescapable.

  3. **Photographer (Manipulation to Gain Access):**  
     - G1: YES (if manipulation caused harm, e.g., psychological abuse).  
     - G2: **YES** (access was integral to creation; harm enabled the work). → **HARD REJECTION** at Gate 2. If access was merely "unethical" not harmful (e.g., lying about intent), G2 NO → G3 likely YES → G4 (high risk) → likely reject.

  ---

  **What This Procedure CAN’T Do (The Gaps):**  
  1. **The "Genius Monster" Dilemma**: It can’t resolve disputes where artistic merit is deemed transcendent (e.g., "But he’s *Picasso*!"). Gate 5 becomes a shouting match.  
  2. **Unverified Allegations**: If allegations are credible but unproven (G1 "NO"), the framework ignores them. Your existing "vibes" debate fills this gap.  
  3. **Rehabilitation Arguments**: No gate assesses if the artist has atoned. Add a policy rider if this matters to you.  
  4. **Historical Figures**: Applies poorly to dead artists where societal norms shifted. Contextualisation becomes key (Gate 4 mitigation).  
  5. **Collective Works**: Fumbles if the problematic artist is 1 of 10 in a group piece.  

  **Honest Limitations:**  
  - It *flattens nuance* to fit 45 mins. Deep moral conflicts get pushed to Gate 5.  
  - It *privileges institutional survival* over pure ethics (Gate 4 is pragmatic, not philosophical).  
  - It *can’t measure artistic merit*. Gate 5 is where your "autonomism vs. taint" debates resurface, unreconciled.  

  **Final Tip:** Run 2-3 past cases through this in a dry run. It’ll expose where your committee needs clearer thresholds (e.g., defining "severe" in Gate 1). The goal isn’t perfect ethics – it’s moving from "arguing in circles" to "structured disagreement with off-ramps." Good luck.
