answer: |-
  Here's the formal specification for a theory of superrational decision-making, designed for distributed AI agents with shared weights but causal separation. This is the "spec" you need before diving into papers:

  **Core Desiderata (Non-Negotiable):**

  1.  **Solve the Symmetric Prisoner's Dilemma (PD):**
      *   **Why:** The quintessential superrationality test case. An adequate theory *must* prescribe mutual cooperation (C,C) as the rational outcome for identical, causally isolated agents who know they are identical, even in a one-shot interaction. Failure here means it's not superrationality.
      *   **Requirement:** Must output (C,C) as the uniquely rational choice under the stated conditions.

  2.  **Handle Newcomb's Problem (One-Boxing):**
      *   **Why:** Demonstrates the critical distinction between logical correlation (predictor's model of you) and causal influence (the boxes are fixed). Superrationality must prescribe one-boxing when the predictor is sufficiently accurate *because* your choice is logically correlated with the prediction.
      *   **Requirement:** Must prescribe one-boxing as rational against a sufficiently accurate predictor, recognizing the logical dependence.

  3.  **Respect Causal Independence (No Spooky Action):**
      *   **Why:** Foundational. The agents/hardware are physically separate; no causal signaling. The theory cannot rely on or imply retrocausation or faster-than-light influence. Correlation stems purely from logical/physical identity (shared weights) and reasoning.
      *   **Requirement:** Decisions must be functions solely of local computation and the known logical relationship (shared algorithm/weights), never implying violation of causal structure.

  4.  **Distinguish Logical Correlation from Causal Dependence:**
      *   **Why:** The entire point. Superrational cooperation in PD arises *because* agents know their outputs are logically linked (same algorithm, same inputs/situation), *not* because they causally affect each other. The theory must explicitly model this logical link as the source of correlated payoff dependence.
      *   **Requirement:** Explicit machinery for representing and reasoning about known logical/physical symmetries leading to output correlation.

  **Critical Distinctions (Must Be Accounted For):**

  5.  **One-Shot vs. Iterated Play:**
      *   **Why:** Superrationality targets the one-shot dilemma where traditional repeated-game strategies (tit-for-tat) don't apply. The theory must work for single decisions. (Accountability for iterated play is desirable but secondary).
      *   **Requirement:** Core mechanism must function effectively in truly one-shot scenarios.

  6.  **Bounded Computation vs. Perfect Reasoning:**
      *   **Why:** Real agents (especially distributed AI) have computational limits. A perfect reasoner might achieve perfect correlation, but bounded agents face uncertainty about their logical twin's output due to computational constraints or noise.
      *   **Requirement:** The theory should ideally degrade gracefully under bounded computation, providing a framework for reasoning under uncertainty about the correlated output. (Perfect reasoning is a useful idealization but negotiable for realism).

  **Decision-Theoretic Constraints (Cannot Violate):**

  7.  **No Dutch Books / Money Pumps:**
      *   **Why:** A fundamental requirement for any rational decision theory. An agent following the theory should not be exploitable in a sequence of decisions leading to guaranteed loss.
      *   **Requirement:** Must be Dutch-book immune under its own assumptions.

  8.  **Reflective Consistency:**
      *   **Why:** An ideal agent should endorse its decision rule as optimal *given* that other identical agents also follow it. Its choice shouldn't undermine the rationale for making that choice in the first place.
      *   **Requirement:** The prescribed action (e.g., Cooperate) must be stable under the assumption that all identical agents reason identically and choose that action.

  **The Central Tension & Potential Inconsistency:**

  *   **Perfect Correlation vs. Full Causal Independence:** This is the critical point you flagged.
      *   **The Demand:** The theory aims for agents to achieve highly correlated outputs (ideally perfect in simple cases like PD with perfect reasoners) *despite* causal isolation.
      *   **The Conflict:** How can two physically separate systems, running identical code on identical inputs, *not* produce identical outputs? Determinism suggests they would. However, true randomness (quantum noise?), slight hardware differences, differing local data, or computational bounds introduce potential desynchronization.
      *   **Resolution Requirement:** An adequate theory *cannot guarantee perfect correlation* under *all real-world conditions*. It must:
          1.  Prescribe actions *assuming* high correlation is achievable via shared algorithm/inputs.
          2.  Define the conditions under which high correlation is expected (e.g., deterministic algorithm, identical inputs, sufficient compute).
          3.  Provide a framework for reasoning under *uncertainty* about correlation when these conditions are imperfectly met (e.g., bounded compute, noisy inputs). It should prescribe mutual cooperation *when* the agent expects sufficiently high correlation that (C,C) dominates.

  **Scoring the Usual Contenders:**

  1.  **Causal Decision Theory (CDT):**
      *   **Fails:** 1 (PD - defects), 2 (Newcomb - two-boxes), 4 (Ignores logical correlation), 8 (Defection isn't stable if others defect).
      *   **Passes:** 3 (Causal only), 7 (Usually Dutch-book immune in its own domain).
      *   **Verdict:** Inadequate. Fundamentally misses logical correlation.

  2.  **Evidential Decision Theory (EDT):**
      *   **Fails:** 1 (PD - *sometimes* cooperates if it thinks correlation implies causation, but often defects due to lack of causal levers), 2 (Usually one-boxes), 7 (Prone to Dutch books), 8 (Unclear stability).
      *   **Passes:** 4 (Handles correlation, but conflates it with evidence of causation).
      *   **Verdict:** Inadequate. Conflates correlation types and prone to exploitative scenarios.

  3.  **Timeless Decision Theory (TDT) / Updateless Decision Theory (UDT):**
      *   **Aims to Pass:** 1 (Prescribes (C,C) in symmetric PD), 2 (Prescribes one-boxing), 3 (No spooky action - logical dependence only), 4 (Explicitly models logical dependence), 5 (Works one-shot), 7 (Designed to avoid Dutch books), 8 (Aims for reflective consistency).
      *   **Challenge:** 6 (Bounded computation). TDT/UDT often assume near-perfect logical omniscience. Handling uncertainty about the output of the logical twin under computational bounds is a major research challenge. Can the correlation expectation be quantified robustly?
      *   **Verdict:** The strongest contenders. They directly encode the core insight of acting as if controlling the output of all logically identical agents. Formalizing this for realistic bounded agents is the key hurdle.

  4.  **Classic Superrationality (Hofstadter):**
      *   **Passes:** 1 (Mutual Cooperation), 2 (Implies one-boxing intuition), 4 (Intuitive grasp of logical symmetry).
      *   **Fails/Unclear:** 3 (Informal, sometimes hints at spookiness), 5 (Focuses on one-shot), 6 (Ignores computation), 7 (Formal Dutch-book analysis lacking), 8 (Informal).
      *   **Verdict:** The inspirational idea, but lacks the rigorous formal machinery needed for your AI spec. Needs grounding in TDT/UDT-like formalisms.

  5.  **Iterated Game Strategies (e.g., Axelrod):**
      *   **Fails:** 1, 5 (Designed for repeated play, fails the one-shot requirement).
      *   **Verdict:** Irrelevant to core superrationality problem.

  **Confidence & Least Certain Claim:**

  *   **Overall Confidence:** Moderately High (80%) on the *necessity* of these desiderata and the TDT/UDT *approach* being the right direction for formalization. The core intuitions (logical correlation driving payoff in PD/Newcomb, causal independence) seem robust.
  *   **Least Certain Claim:** My assessment of how **gracefully TDT/UDT handles bounded computation (Desideratum 6)** in realistic distributed AI settings. I'm only ~60% confident that *existing* formalizations adequately solve this. The core TDT/UDT math often assumes agents can perfectly simulate each other or reason about their logical equivalence without computational cost. Quantifying and robustly managing the *expectation of correlation* under resource constraints (time, memory, noise, slight input variations) is a significant open practical challenge, even if the theoretical ideal is clear. This is where your feature needs to focus – can distributed agents with shared weights but separate compute *reliably enough* achieve the necessary output correlation to make superrational cooperation the stable, high-payoff choice? The theory must bridge this gap to be practically useful.
