  hey — i'm writing a feature on whether superrationality can be formilized for distributed AI agents that share weights but run on separate hardware, so they face choices where hte payoff depends on output correlation rather than direct interaction. before i read another paper, i want the full desiderata. what must an adequate theory of superrational decision-making actually get right? give me the spec: the cases it has to cover (classic prisoner's dilemma, Newcomb-style problems, and those predictor scenarios where your choice seems to retroactively influence a belief about you), the distinctions it can't collapse (logical correlation vs causal independence, one-shot vs iterated play, bounded computation vs perfect reasoning), and the decision-theoretic results it can't violate. say why each is required, flag which are negotiable and which are non-negotiable, and if any subset is jointly unsatisfiable — especially anything demanding perfect correlation while insisting on full causal independence — call that out, that's hte part i care about most. briefly score the usual contenders against the list. please also say how confident you are in all of this and single out the claim you're least sure about. no bibliographies, just reasoning — i want something a smart model without web access can actually work through.
