  I should highlight which desiderata are conflicting. Perfect correlation under full causal independence is tricky. If agents have identical algorithms and inputs, they might output the same, but any variation breaks correlation. The theory must allow for high correlation without requiring deterministic outcomes. Also, bounded computation introduces unpredictability, making perfect correlation harder. 

  The user might also care about practical implementation. How can such a theory be tested in real AI systems? They might need the desiderata to guide experiments or simulations. Scoring existing theories helps identify gaps, like UDT's high computational demands. 

