  Next, evaluating existing approaches. TDT (Timeless Decision Theory) and UDT (Updateless Decision Theory) handle logical correlation but might assume too much computation. CDT (Causal Decision Theory) fails because it ignores logical correlations. Superrationality as a concept gets the intuition but lacks formal rigor. Iterated solutions like Axelrod's work for repeated games but not one-shot. 

