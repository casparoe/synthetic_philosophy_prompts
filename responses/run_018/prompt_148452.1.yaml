  The distinctions are crucial. Logical correlation without causation is non-negotiable because the agents are causally independent but share a common source (like weights). One-shot vs. iterated matters because repeated interactions allow learning, but superrationality targets one-shot scenarios. Bounded computation is negotiable; perfect reasoning might be a starting point but realism requires handling computational limits.

