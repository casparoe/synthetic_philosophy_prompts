answer: |-
  Here’s a tightly structured 50-minute teaching arc designed to build understanding step-by-step, preempt misconceptions, incorporate group testimony, and include a diagnostic check:

  **Time Allocation & Flow:**  
  (0-2 min) **Hook:** "When is it morally/permissibly *wrong* to make a true statement?" (e.g., "Your terrible haircut looks great!"). Teases normativity beyond truth.

  ### Phase 1: Undermining Naïve Belief Norm (12 min)
  *   **(2-10 min) Lottery Paradox (Belief Norm Culprit):**  
      *   **Setup:** "You hold ticket #001 in a fair 1000-ticket lottery. Do you *believe* ticket #001 will lose?" (Yes, rationally). "Can you *assert* 'Ticket #001 will lose'?" (Intuition: No!).  
      *   **Problem:** Highlights that **justified true belief isn't enough** for permissible assertion. Belief norm ("Assert only what you believe") seems insufficient. *Preempts "honesty" misconception:* Emphasize "belief" here is about epistemic justification/rationality, not sincerity. Honesty is necessary but not sufficient.
  *   **(10-12 min) Introducing Knowledge Norm (KN):**  
      *   "Williamson's answer: Assert only what you *know*." Solves Lottery – you don't *know* your ticket loses.  
      *   *Preempts "certainty" misconception IMMEDIATELY:* "KN ≠ certainty! We 'know' lots of fallible things (e.g., 'Paris is in France'). KN tracks appropriate epistemic standing for sharing information."

  ### Phase 2: Challenging KN (10 min)
  *   **(12-20 min) False Belief Problem (Carrying Case > Bank Case):**  
      *   **Why Carrying?** Less baggage, clearer intuition. "You *saw* your colleague carrying her laptop 2 mins ago. You *know* she has it. Colleague asks: 'Do you know where my laptop is?' You assert: 'Yes, you were just carrying it!' BUT... unbeknownst to you, she set it down and it was stolen 1 min ago. Your assertion was false. Was it *wrong*?"  
      *   **Intuition:** Feels blameless/permissible *despite* lacking knowledge (it's false). Belief norm ("Assert what you justifiably believe") seems more forgiving here.  
      *   *Why not Bank?* Bank cases often involve higher stakes/deference, muddying the "wrongness" intuition. Carrying is low-stakes, purely about epistemic propriety.

  ### Phase 3: Core Debate & Nuance (15 min)
  *   **(20-25 min) Tension Established:** KN seems right for Lottery, wrong for Carrying. Belief norm seems wrong for Lottery, right for Carrying. What gives?  
  *   **(25-35 min) Refining the Norms:**  
      *   *KN Response:* "The Carrying case is excusable *because* your evidence was excellent; it's a Gettier-like case. The norm was still violated, just blamelessly."  
      *   *Belief Norm Response:* "Lottery shows belief needs *very high justification* (maybe knowledge-level!). Maybe the norm is 'Assert only what you *reasonably believe*' where reasonableness ≈ knowledge-level justification."  
      *   **Key Insight:** Both sides need robust epistemic justification. Debate centers on whether "knowledge" is the right *label* and whether falsity *inherently* makes assertion improper (KN) vs. improper only if unreasonable (Belief+).
  *   **(35-37 min) Group Testimony Twist (Seamless Fit):**  
      *   "Corporate Press Release: 'Our new drug is safe and effective!' Compiled from 1000s of anonymized data points; no single scientist sees the whole picture. Does the *Corporation* know? Can it permissibly assert?"  
      *   **Link:** Connects directly to the justification debate. KN struggles (no single knower). Belief Norms *might* handle it ("corporate reasonable belief"?), but what *is* group belief/justification? Highlights limitations of individualistic norms.

  ### Phase 4: Synthesis & Diagnosis (8 min)
  *   **(37-42 min) Quick Recap & Stakes:** Why does this matter? Assertion spreads information/knowledge, underpins testimony, affects trust, has ethical dimensions.  
  *   **(42-48 min) The Diagnostic Check-Question:**  
      *   **Scenario:** "A weather forecaster, using the best models (99% accurate), asserts 'No rain tomorrow.' It rains. A critic says: 'Your assertion was improper! You didn't *know* it wouldn't rain!'"  
      *   **Question:** "**According to the *Knowledge Norm* advocate, was the critic *correct*? According to a *Justified High-Probability Belief Norm* advocate, was the critic correct? Briefly explain WHY for each."  
      *   **Why it Works:**  
          *   Tests if they grasp KN's core claim (assertion improper if not known, even with great evidence/falsity is key).  
          *   Tests if they grasp the Belief Norm alternative (improper only if unjustified; great evidence makes it proper, falsity is irrelevant to propriety).  
          *   Tests application beyond memorizing slogans ("KN says you must know" vs. "KN says the critic is right because forecaster lacked knowledge").  
          *   Reveals if they conflate justification with knowledge or certainty ("The forecaster *knew* because 99% is certain!").
  *   **(48-50 min) Wrap-up:** Briefly state the unresolved tension. Point to further reading (Williamson, Lackey, group assertion papers).

  **Key Pedagogical Moves Explained:**  
  1.  **Start with Paradoxes:** Creates cognitive dissonance, motivating the need for norms. Lottery first as it's cleaner.  
  2.  **Preempt Misconceptions Early:**  
      *   "Knowledge ≠ Certainty" introduced *with* KN.  
      *   "Belief Norm ≠ Honesty" clarified *during* Lottery discussion.  
  3.  **Carrying Case > Bank Case:** Focuses purely on epistemic propriety without distracting stakes/deference factors. Intuition of blamelessness is stronger.  
  4.  **Group Testimony Placement:** Fits naturally *after* individual norms are established, showing a real-world challenge. It extends, not breaks, the flow by applying the core concepts to a new entity.  
  5.  **Diagnostic Question:** Forces application to a novel case requiring understanding *why* each norm gives the answer it does. Reveals if they see the role of falsity vs. justification level in each theory. Memorizing slogans won't suffice.

  This arc builds logically, surfaces key intuitions, actively combats common errors, integrates the twist meaningfully, and provides a reliable gauge of genuine comprehension. Good luck!
