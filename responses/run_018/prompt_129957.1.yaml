prompt: |-
  I'm a journalist covering philosophy of mind and cognitive science, and I've noticed a recurring asymmetry in how people reason about Dennett-style brain-transplant scenarios. Present someone with gradual neuron-by-neuron replacement of a brain by synthetic equivalents that preserve all psychological connections, and they usually judge that personal identity continues uninterrupted. Present the exact same final synthetic brain, constructed all at once and implanted in a new skull, and they typically deny it is the same person, despite the end state being identical. The same pattern appears with bodily prosthetics: gradual substitution is accepted, instantaneous total replacement is rejected. The asymmetry is not neatly captured by psychological-continuity versus bodily-continuity theories, since both versions preserve or break those relations equally; rather, the path or process itself seems to carry independent weight in identity judgments. Is there an established concept for this specific path-dependence in personal-identity intuitions—perhaps something like process-sensitive identity continuity—or does it fall under existing categories such as the fission problem, Sorites-style vagueness, or psychological-continuity theory with an unstated temporal constraint? If no precise term exists, can you coin one that distinguishes it from plain bodily-continuity preference and from standard branching puzzles, and specify its boundary cases? Lead with the bottom line in bold—whether an established term exists, what the nearest concepts are, and your proposed definition or coinage—then explain in the rest of your response. Keep everything to one tight paragraph, no more than 180 words.
reasoning: |-
  Okay, the user is a journalist covering philosophy of mind and cognitive science. They've noticed an interesting asymmetry in how people judge personal identity in brain transplant scenarios. Specifically, when replacement is gradual (neuron-by-neuron), people accept identity continuity, but when it's instantaneous with the same end state, they reject it. This happens with bodily prosthetics too. The user wants to know if there's an established term for this path-dependence or if I should coin one.

  First, I need to recall relevant philosophical concepts. Psychological-continuity theories focus on mental states persisting, but here the end state is identical in both scenarios. Bodily-continuity theories emphasize the physical body, but gradual replacement preserves the body's continuity while instant doesn't. The fission problem deals with branching identities, like in teleportation, but here it's about the process of replacement, not branching. Sorites paradox involves vagueness in gradual changes, like a heap of sand losing grains one by one. That seems closer because the gradual change avoids a clear cutoff point where identity is lost.

  The key here is the "path-dependence" — the process itself affects judgment. Existing terms don't fully capture this. "Continuity of implementation" from Dennett might relate, but it's not a standard term. The user wants a precise term that distinguishes this from bodily-continuity preference and branching cases like fission. 

  Nearest concepts are the Sorites paradox (gradual change avoiding sharp boundaries) and process-based identity theories. But no specific term exists for this asymmetry. So, coining a term is necessary. "Processual continuity" could work, emphasizing the process over the end state. Or "temporal-grain sensitivity," highlighting that the speed of change affects perception. 

  Boundary cases: if the replacement is almost instantaneous but not quite, when does the judgment shift? Or if the process is staggered—some parts fast, some slow. Also, whether consciousness is interrupted during the process might matter. 

  Proposed coinage: "Temporal-Grain Sensitivity in Identity Persistence" (TGSIP). This specifies that the temporal aspect (gradual vs instant) influences identity judgments, separate from bodily or psychological continuity. It's distinct from fission because there's no branching, and from Sorites by focusing on time rather than vague predicates. 

  Now, structuring the response: bold the bottom line first—no established term, nearest are Sorites and process theories, proposed term TGSIP. Then explain briefly, keeping under 180 words. Need to be concise but clear.
answer: |-
  **No established term exists for this specific asymmetry. Nearest concepts are Sorites-style vagueness (gradual change avoids sharp boundaries) and "continuity of implementation" (Dennett's phrase for process mattering), but neither fully captures the temporal-grain sensitivity. I propose "Temporal-Grain Sensitivity in Identity Persistence" (TGSIP): the intuitive dependence of identity judgments on the *rate* of component replacement, where gradual substitution preserves identity but instantaneous replacement disrupts it, despite identical start/end states and preserved psychological/bodily relations.**

  This asymmetry falls outside strict psychological/bodily theories and differs from fission (no branching) or pure Sorites (not about predicates). TGSIP highlights the independent weight of the *process tempo*. Boundary cases include staggered replacement speeds and whether consciousness interruption matters. It arises because gradual change leverages our cognitive bias for spatiotemporal continuity as a heuristic for persistence, while instantaneous change violates it, triggering an "all-at-once replacement" intuition of death/replacement, even when logically equivalent.
