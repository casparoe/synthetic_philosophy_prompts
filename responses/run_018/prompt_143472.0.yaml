  The case has a twist: the physician sees her medical role as intertwined with her parenthood. The Confucian will argue that her identity is constituted by these roles, so choosing the strangers isn't just immoral but self-destructive. The universalist will counter that true morality requires impartiality, and her duty to strangers tests if her role is genuinely moral or tribal.

