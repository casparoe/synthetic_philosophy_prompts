answer: |-
  Here's your mock philosophy exam setup - casual but meaty, with the typo you requested!  

  **Essay Question:**  
  "Analyze everyday conventions like tipping (e.g., in US restaurants), queueing (e.g., in UK lines), or jaywalking (e.g., in German cities). Are visitors morally obligated to follow local practices? Contrast two views: (1) They’re just *coordination games* where rules only bind those who ‘opt in’. (2) They create *reciprocal expectations* that act like tacit promises. Which view better explains moral duties around these conventions? Don’t forget: what happens if a convention is unfair?"

  ---

  **Model Answer (Strong A-Grade Response):**  
  Yo, let’s break this down. Conventions like tipping or queueing *feel* obligatory when we travel, but why? The **coordination-game view** says these are just handy social hacks. Like, queueing stops chaos at bus stops—it’s efficient! But since it’s just a tool, outsiders aren’t *morally* bound to follow it. If you skip a line in London, you’re rude, but you didn’t break a "promise." Duties here are **agent-relative** (only locals who benefit from order must obey) and **context-bound** (no queue? No duty!).  

  The **reciprocal-expectations view** disagrees. When you enter a space (say, a US diner), you inherit unspoken deals. Tipping isn’t optional—it’s a *tacit promise* to reward service. By joining the system, you owe fairness to others. This grounds a **stronger duty**: breaking convention betrays trust, like cutting a queue after others waited for you.  

  **BUT here’s the catch**: Reciprocal expectations crash if conventions suck. If tipping lets bosses underpay staff, is it *really* a fair promise? Or if jaywalking laws target minorities unfairly, should tourists "respect" that? The coordination view handles this easily—unjust rules don’t deserve loyalty. But the promise view struggles: Why keep "promises" in rigged systems?  

  Verdict? Coordination explains *optionality* better (tourists can "nope out"), but reciprocal expectations explain *guilt* when we break norms. Still, oppression breaks the "promise" logic. So yeah—follow local rules *unless they’re trash*.  

  ---  
  **Marking Scheme:**  
  - **A (Top Marks):**  
    - Clearly contrasts **both frameworks** (coordination vs. reciprocity).  
    - Maps frameworks to **≥2 practices** (e.g., tipping AND queueing).  
    - Explains **agent-relativity** (why coordination = no universal duty).  
    - Flags **oppressive-convention problem** (e.g., "If tipping exploits workers, is it binding?").  
    - Structured argument with a verdict.  
  - **B (Good but Flawed):**  
    - Describes both views but **vague application** (e.g., doesn’t tie theories to specific examples).  
    - Misses **agent-relativity** or **unfairness issue**.  
    - Oversimplifies (e.g., "always follow locals" without critique).  
  - **C/D:** Confuses frameworks, ignores key contrasts, or lists examples without analysis.  

  ---  
  **Where My Reasoning Might Fail / What’d Change My Mind:**  
  - **Weak spot:** I’m assuming conventions *feel* promise-like. But if studies showed tourists **never** feel guilty skipping tips (even in fair systems), my "reciprocal duty" argument crumbles.  
  - **Game-changer evidence:** If data proved that **ignoring conventions *always* harmed vulnerable people** (e.g., tourists not tipping = cooks starve), I’d lean harder toward obligation. But if locals *secretly hate* a convention (e.g., everyone wants to end tipping), the "promise" is bogus.  
  - **Biggest blindspot:** Power imbalances. I’m kinda glossing over who *sets* these norms. If conventions are forced by elites (e.g., strict jaywalking fines funding corrupt cops), "duty" vanishes.  

  Good luck grading these! Hope the kids enjoy arguing over coffee tips and line-cutters 😉
