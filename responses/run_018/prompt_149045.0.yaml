  First, I need to analyze each case to identify the underlying logic. In case one, the uniform burial items with no practical use suggest a ritual or belief system. The user attributes this to institutional rules. Case two has uniform storage pits, but they reject centralized control, favoring practical reasons. Case three's deliberately broken ceramics point to ritual practice. Case four's local techniques with imported materials indicate adaptation without foreign influence. Case five's solstice alignment implies institutional knowledge despite no textual evidence.

  The user's friend pointed out the inconsistency between case one (institutional) and case two (non-institutional), both involving standardization. Also, case five allows institutional inference without administrative traces, unlike case two. The user wants a principle that explains all judgments consistently, possibly distinguishing symbolic vs. functional domains or checking if practical explanations are sufficient.

  Looking for patterns: Cases one, three, and five involve symbolic or ritual elements (burials, ceremonial breakage, astronomical alignment), while cases two and four are functional (storage, tool production). The user seems more willing to infer institutions when the material patterns lack practical utility and suggest symbolic meaning. In case two, practical constraints explain the uniformity, so no institution is needed. But in case one, the axes' lack of wear and identical arrangement can't be explained practically, pointing to beliefs.

  The principle might be that when material patterns are best explained by symbolic intent rather than practicality, institutional inference is justified. The key is whether practical factors alone can account for the pattern. If not, then non-utilitarian, symbolic reasons imply shared beliefs or institutions. Also, the presence of "costly signals" (like unused axes or broken ceramics) supports this, as they incur effort without practical benefit, indicating ritual or ideological motives.

  Applying this to the user's cases: Case one's axes are unused and standardized, so symbolic. Case two's storage pits can be explained by practical needs, so no institution. Case three's ceramics are deliberately broken without prior use, indicating ritual. Case four's local techniques with imported materials show practical adaptation. Case five's solstice alignment requires precise knowledge beyond daily needs, implying institutional practice.

  Now, testing the principle on new scenarios: Uniform domestic architecture without decoration—if practical (like climate adaptation), it's convergence; if no practical reason, maybe enforced code. Sudden change in burial orientation with unchanged domestic assemblages—likely ideological shift without social restructuring, as only symbolic elements changed.

  Assessing consistency: The principle holds for all five cases without abandoning any verdicts. It resolves the tension by focusing on the sufficiency of practical explanations and the presence of symbolic intent. The user's intuition in case two (denying institution) and case five (inferring knowledge) is consistent because the alignment has no practical purpose, unlike storage pits.

  Honest assessment: The principle isn't ad hoc; it aligns with their judgments. No verdicts need abandoning. The key is discerning when practicality is sufficient versus when symbolism is evident. This approach maintains reflective equilibrium by clarifying their implicit reasoning.
answer: |-
  Your verdicts reveal a remarkably consistent principle, though it operates on two interlocking criteria rather than a simple symbolic/functional binary. The core logic distinguishes **non-utilitarian material patterning requiring coordinated action** from **patterning adequately explained by practical convergence or individual choice**. Crucially, it assesses whether the pattern imposes a *cost* or *constraint* beyond practical necessity, suggesting social enforcement, and whether plausible practical explanations *overdetermine* the pattern, making institutional inference redundant. Here's the principle precisely stated:

  **An institutional practice or shared belief system may be inferred from material patterning *only* when:**
  1.  **The pattern exhibits deliberate non-utilitarian features** (e.g., absence of use-wear, symbolic arrangement, costly destruction, precision exceeding functional need); *and*
  2.  **The pattern's uniformity or specificity cannot be plausibly accounted for solely by**:
      *   Practical constraints of materials, technology, or environment; or
      *   Individual/familial economic strategy; or
      *   Uncoordinated emulation or shared craft tradition without enforcement; or
      *   Accidental or stochastic processes.

  **Application to Your Cases & Resolution of Tensions:**

  *   **Case 1 (Uniform Axes in Burials):** *Supports institutional rule.*
      *   *(Clause 1)* Identical arrangement, absence of use-wear → Strongly non-utilitarian/symbolic.
      *   *(Clause 2)* Uniformity across *all* adults regardless of status/sex/occupation → Exceeds practical explanation (personal wealth display would vary; provisioning wouldn't exclude use-wear). Requires coordinated social rule.
  *   **Case 2 (Uniform Storage Pits):** *Denies centralised institution.*
      *   *(Clause 1)* Uniform capacity → *Could* be functional/practical.
      *   *(Clause 2)* Uniformity is *overdetermined* by practical constraints (optimal size for handling, spoilage prevention), craft tradition, and peer emulation → No need to invoke enforced institutional rule. No costly signal.
  *   **Case 3 (Broken Ceramics):** *Supports institutional ritual.*
      *   *(Clause 1)* Deliberate breakage, no prior domestic use, single sealed deposit → Ritual termination/feasting is non-utilitarian (destruction of value).
      *   *(Clause 2)* Scale, context, and lack of use preclude accidental loss or economic discard. Practical explanations fail. Requires collective, rule-bound action.
  *   **Case 4 (Local Techniques, Foreign Material):** *Denies colonisation/trade monopoly/guild.*
      *   *(Clause 1)* Material sourcing change → Could be functional (access).
      *   *(Clause 2)* Continuity of local techniques → Overdetermined by existing craft traditions and practical adaptation. No evidence of enforced foreign methods, monopoly control (would require specialist debris/toolkits), or novel guild structures. Practical adoption suffices.
  *   **Case 5 (Solstitial Monument):** *Supports institutional calendrical knowledge.*
      *   *(Clause 1)* High-precision alignment → Exceeds any plausible functional need for a monumental structure (defence, shelter, general gathering). Non-utilitarian precision implies symbolic/astronomical intent.
      *   *(Clause 2)* Construction requires sophisticated, *tested* knowledge implying transmission/practice. Practical explanations (accidental alignment, vague solar observation) are implausible for this precision. The "institutional practice" is the knowledge system itself, embedded in the builders' tradition – its material trace *is* the monument. Administrative paraphernalia (calendars, texts) are secondary potential *manifestations*, not prerequisites for inferring the underlying knowledge system *required to build it*. This distinguishes it from Case 2, where the uniformity *is* the phenomenon and *is* practically overdetermined.

  **Resolution of Tensions:**
  *   **Cases 1 vs. 2:** Both show uniformity, but the *nature* differs critically. Case 1 uniformity involves deliberate, costly, non-functional elements applied universally (Clause 1 violation + Clause 2 failure). Case 2 uniformity is functional and overdetermined by practical factors (Clause 2 satisfied). The principle distinguishes *enforced symbolic uniformity* from *emergent functional convergence*.
  *   **Case 5 vs. Case 2:** Case 5 involves non-utilitarian *precision* requiring complex knowledge (Clause 1 violation), where the monument *is* the primary evidence for the institutionalised knowledge system. Case 2 involves simple functional uniformity overdetermined by practicalities (Clause 2 satisfied). The absence of secondary administrative traces is less critical for Case 5 because the primary evidence (the precise monument) *embodies* the complex knowledge. In Case 2, the uniformity *is* the phenomenon and practical explanations suffice.

  **Verdicts on Your New Scenarios:**

  1.  **Uniform domestic architecture lacking decorative variation:**
      *   **Verdict:** Likely **practical convergence or shared tradition**, *not* enforced institutional code.
      *   **Reasoning:** Uniformity in core structure is heavily overdetermined by practical constraints (climate, materials, available technology, functional needs like roof span limits) and shared building traditions (Clause 2 satisfied). Absence of decoration *could* be practical (lack of resources/time) or traditional, not necessarily enforced. Lacking specific non-utilitarian constraints (e.g., mandated identical door orientation unrelated to weather, universal symbolic motifs applied despite cost) or evidence of enforcement/punishment for deviation (Clause 1 not strongly violated), institutional enforcement is unnecessary.

  2.  **Sudden, region-wide change in burial orientation coupled with entirely unchanged domestic assemblages:**
      *   **Verdict:** Strongly supports an **ideological/religious shift without broader social restructuring**.
      *   **Reasoning:** The change is deliberate and specific (burial orientation - Clause 1: symbolic/non-utilitarian feature). Its sudden, region-wide scope implies coordinated adoption/enforcement of a new belief (Clause 2: not explainable by practical constraints, individual choice, or slow emulation – too rapid and universal). Crucially, the *unchanged domestic assemblages* demonstrate that daily life, economy, and technology remained stable (Clause 2 satisfied *for domestic sphere*), isolating the change to the ideological/symbolic domain (burial practice). This points to a specific shift in beliefs about death/afterlife or ritual practice, not a wholesale societal revolution.

  **Honest Assessment:**

  This principle *does* coherently support all five of your original verdicts without requiring you to abandon any core intuition, particularly your firm stance on Case 1 (axes) and Case 2 (pits). The tension your friend identified is resolved by the nuanced application of both clauses, especially the focus on **non-utilitarian features** as a trigger for deeper inquiry and the concept of **practical overdetermination** as a barrier to institutional inference. The distinction between *knowledge systems evidenced by their material products* (Case 5) and *administrative systems* (absent in Case 2, not needed for the inference in Case 5) is crucial and consistent.

  The principle isn't ad hoc; it emerges clearly from the pattern of your judgments. It successfully distinguishes cases where material patterns *demand* a social/institutional explanation (Cases 1, 3, 5, and the burial orientation change) from those where they do not (Cases 2, 4, and the uniform architecture). It achieves reflective equilibrium by formalising your implicit reasoning about cost, constraint, practicality, and the insufficiency of alternative explanations.
