  ## Opening Remarks: “Who Gets the Ballot?” Workshop  
  **Bristol, [Date]**

  Good morning, everyone. It’s a genuine pleasure to welcome such a vital mix of minds to Bristol – philosophers who dissect the foundations of our shared life, and practitioners and activists who build that life, brick by brick, vote by vote, here on our streets. Our question today – “Who Gets the Ballot?” – isn’t abstract. It’s urgent, tangible, and unfolding right now, *in this city*, through our remarkable climate budget referendum pilot.

  Think about that pilot for a moment. We’re doing two things simultaneously, and they pull in fascinatingly different directions. **We’re expanding the circle.** Sixteen-year-olds, whose futures are most starkly shaped by climate choices, get a vote. Long-term residents, woven into the fabric of Bristol for a decade or more, contributing, paying taxes, raising families, but without citizenship – they too get a vote. This speaks to a powerful impulse: **inclusion based on stakeholding.** If you’re here, living the consequences, you ought to have a say in shaping them. It recognises that the boundaries of the “demos” – the people governing themselves – might need redrawing to reflect who *actually* constitutes the community enduring the decisions.

  **But then comes the condition.** Their votes count fully *only* if our traditionally defined citizenry – those holding the formal status – turn out at 80%. If turnout dips below that threshold? Those new votes become advisory. This speaks to another powerful impulse: **legitimacy anchored in established participation.** It’s a safeguard, yes, but one that reveals a deep-seated anxiety. It suggests that the full legitimacy of this expanded franchise depends on the vigorous participation of the existing one. It protects a certain privilege, certainly, but it also poses a profound question: **Can inclusion truly take root if the core body politic is disengaged?**

  This pilot isn’t merely a policy compromise; it’s a philosophical provocation made manifest. It throws into stark relief the **constitutive tensions** we’ll grapple with today around compulsory voting, the voting age, and non-citizen suffrage:

  1.  **Inclusion vs. Legitimacy:** How wide can the circle of voters be cast before the sense of collective self-government, the "we" who decides, becomes strained? Where *does* legitimacy ultimately reside – in the sheer number of stakeholders included, or in the depth of participation from a historically defined core?
  2.  **Autonomy vs. Duty:** Compulsory voting, one of our topics, directly challenges pure individual autonomy in favour of a civic duty. Our pilot's 80% threshold also subtly undermines autonomy – it makes the full power of new voters' choices dependent on the actions of *others*. It asks: Is voting solely a right of the individual, or is it also a function necessary for the health of the collective body?
  3.  **Defining the "Self" in Self-Government:** Does "the people" governing themselves mean only formal citizens? Does it include those bound by long-term consequences, like sixteen-year-olds? Does meaningful inclusion *require* compulsion to ensure all voices are heard, or does compulsion itself undermine the voluntary nature of civic engagement? Our pilot tries to have it both ways, revealing how slippery that "self" really is.

  This tension in our Bristol experiment – **expanding the franchise while tethering its full force to existing participation** – is not a flaw to be dismissed. It’s the very heart of the matter. It forces us beyond easy slogans about pure autonomy or simple majoritarianism. It confronts us with the messy reality of democratic innovation: **How do we build a more inclusive "we" without fracturing the existing foundations of legitimacy?** How do we ensure new voices are heard *and* that they resonate within a system that must command broad acceptance?

  That’s the fertile, challenging ground we stand on today. Our workshop topics – compulsory voting, votes at sixteen, and votes for long-term residents – aren’t isolated policy questions. They are different facets of this core dilemma exposed by our own city’s bold experiment. Does lowering the voting age deepen stakeholding inclusion? Does compulsion solve the participation problem our pilot reveals as crucial? Does extending the local vote to non-citizens redefine the "local self" without undermining wider cohesion?

  Philosophers, I invite you to probe the structures beneath these tensions – the concepts of legitimacy, obligation, community, and equality that are being stress-tested on our doorstep. Councillors, activists, I urge you to hold us to account – demand clarity on what these ideas mean for fairness on the ground, for trust in our councils, for the young people and neighbours whose voices we seek to amplify, conditionally or otherwise.

  Let’s not shy away from the discomfort in our pilot. Let’s use it. Let it be our shared text today. Because Bristol isn’t just hosting this workshop; it’s *living* the central question. "Who Gets the Ballot?" is being answered here, experimentally, contestedly, revealingly. Our task is to grapple with that reality – thoughtfully, rigorously, and with an unwavering commitment to building a democracy that is both more inclusive and more robustly legitimate. That’s the Bristol challenge. Let’s get to work.

  Thank you.
