  ## INTERNAL MEMORANDUM  
  **Committee on Moral Foundtaions and Institutional Harmony (CMFIH)**  
  **Ref:** CMFIH/23/DisputRes/SpeakerInvite/Delta  
  **Date:** 2023-10-27  

  **TO:** All Faculty & Staff, Department of Sociopolitical Dynamics  
  **FROM:** Dr. Eustace P. Blandford, Chair, CMFIH  
  **SUBJECT:** Normative Reconciliation Procedure: Disputed Invitation of Dr. A. Veritas  

  **1.0 Background:**  
  The Committee has received notification of a Category 3 Disagreement (Moral Foundations Misalignment) concerning the proposed invitation of Dr. A. Veritas (known for unorthodox analyses of historical resource allocation) to the Departmental Colloquium Series.  

  **1.1** Per CMFIH Mandate Section 4(b), all Category 3 Disagreements require a Moral Foundations Profile Assessment (MFPA) to determine the objectively superior normative position, thereby restoring Institutional Harmony.  

  **2.0 Moral Foundations Profile Assessment (MFPA) Conducted:**  
  Using the validated CMFIH Emotional Resonance Survey (v.2.3) and analysis of submitted position statements, the Committee has mapped the primary arguments onto the Six Universal Moral Foundations:  

  *   **2.1 Pro-Invitation Cohort (Designated Group Alpha):**  
      *   **Primary Foundations Activated:**  
          *   **Liberty/Oppression (L/O):** Emphasized Dr. Veritas's right to speak (L/O Score: 8.7/10). Argued suppression constitutes intellectual oppression.  
          *   **Authority/Subversion (A/S):** Stressed the Department Chair's prerogative to invite speakers (A/S Score: 7.9/10). Framed opposition as subversion of established academic hierarchy.  
      *   **Secondary Foundations Observed:**  
          *   **Fairness/Cheating (F/C):** Minor activation re: "fairness" of platform access (F/C Score: 4.1/10).  
      *   **Foundations Minimally Activated:** Care/Harm (C/H), Loyalty/Betrayal (L/B), Sanctity/Degradation (S/D).  

  *   **2.2 Anti-Invitation Cohort (Designated Group Beta):**  
      *   **Primary Foundations Activated:**  
          *   **Care/Harm (C/H):** Argued Dr. Veritas’s views cause psychological harm to marginalized communities (C/H Score: 9.2/10).  
          *   **Fairness/Cheating (F/C):** Contended platforming Dr. Veritas grants unfair legitimacy to harmful ideas and cheats vulnerable groups of safety (F/C Score: 8.5/10).  
      *   **Secondary Foundations Observed:**  
          *   **Loyalty/Betrayal (L/B):** Minor activation re: loyalty to departmental values of inclusion (L/B Score: 5.3/10).  
      *   **Foundations Minimally Activated:** Liberty/Oppression (L/O), Authority/Subversion (A/S), Sanctity/Degradation (S/D).  

  **3.0 Normative Weight Analysis:**  
  The Committee must now determine the morally superior position by weighing the Foundation profiles, acknowledging the inherent commensurability of Foundation Units (FUs) as per CMFIH Directive 12.  

  *   **3.1 Group Alpha FU Tally:**  
      *   L/O: 8.7 FU (Primary)  
      *   A/S: 7.9 FU (Primary)  
      *   F/C: 4.1 FU (Secondary - Weighted at 50%: 2.05 FU)  
      *   **TOTAL ALPHA FU: 8.7 + 7.9 + 2.05 = 18.65 FU**  

  *   **3.2 Group Beta FU Tally:**  
      *   C/H: 9.2 FU (Primary)  
      *   F/C: 8.5 FU (Primary)  
      *   L/B: 5.3 FU (Secondary - Weighted at 50%: 2.65 FU)  
      *   **TOTAL BETA FU: 9.2 + 8.5 + 2.65 = 20.35 FU**  

  *   **3.3 Comparative Analysis:** Group Beta demonstrates a higher aggregate FU score (20.35 FU vs. 18.65 FU). While Group Alpha activated two robust Primary Foundations (L/O & A/S), Group Beta activated the highly weighted C/H Foundation to a near-maximum degree and paired it strongly with F/C.  

  **4.0 Findings Regarding Moral Superiority:**  
  *   **4.1** Based on the objective quantification of Foundation Units (FUs), Group Beta's position (opposing the invitation) carries greater *prima facie* normative weight (20.35 FU > 18.65 FU).  
  *   **4.2** The Committee notes the specific potency of the Care/Harm foundation in an institutional context dedicated to well-being (University Charter, Preamble).  
  *   **4.3** The Authority/Subversion foundation invoked by Group Alpha, while valid, is deemed subordinate to the imperative of preventing Harm as measured by C/H FU intensity. Liberty/Oppression claims are acknowledged but outweighed by the combined C/H and F/C FU mass.  

  **5.0 Reconciliation Procedure & Recommendations:**  
  To resolve the dispute and restore Harmony in accordance with the MFPA findings:  

  *   **5.1 Primary Recommendation:** The invitation to Dr. Veritas **shall not proceed**. Group Beta's FU superiority establishes the moral validity of their Harm/Care and Fairness concerns as the dominant normative framework for this instance.  
  *   **5.2 Pluralism Mitigation Protocol:** However, recognizing the significant FU investment by Group Alpha, the Committee mandates a **Departmental Pluralism Holiday (PPH)**.  
      *   **5.2.1 Duration:** 48 hours, commencing upon dissemination of this memo.  
      *   **5.2.2 Conditions:** During the PPH, all normative claims related to the Veritas invitation or analogous disputes are suspended. No position may claim moral superiority based on Foundations.  
      *   **5.2.3 Activities:** Faculty are encouraged to engage in foundationally neutral activities: reviewing departmental budget spreadsheets, cataloguing library books, or observing cloud formations. Discourse must be limited to empirically verifiable statements about the weather or coffee quality.  
  *   **5.3 Mandatory Recalibration:** All involved faculty must complete the CMFIH Online Normative Recalibration Module (ONRM-7: "Finding Harmony in FU Asymmetry") within 14 days. Completion certificates must be filed with the Committee Secretary.  

  **6.0 Conclusion:**  
  The Committee believes this MFPA-driven resolution provides an objective, quantifiable path to Institutional Harmony. By deferring to the higher aggregate Foundation Units and implementing the structured Pluralism Holiday, we acknowledge the descriptive psychology underlying the conflict while definitively settling the normative question in favour of the Care/Harm and Fairness/Cheating cluster. Harmony is not merely the absence of conflict, but the presence of correctly weighted Foundations.  

  **Signed,**  
  *Dr. Eustace P. Blandford*  
  Chair, Committee on Moral Foundtaions and Institutional Harmony  

  **cc:** University Provost, Dean of Faculty, CMFIH Membership (for mandatory retreat: "Re-Harmonizing Our Own Foundations: Do We Bias Care?")
