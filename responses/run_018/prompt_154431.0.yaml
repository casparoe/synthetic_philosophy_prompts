  me and my flatmate had a massive row in the kitchen last night about moral foundations theory — you know, haidt's thing with care, fairness, loyalty, authority, sanctity and that liberty/oppression one he added later. he was arguing that because conservatives score higher on loyalty and sanctity, that tells us something about who's actually right on immigration or whatever, and i kept saying that's just describing psycholgy, not giving you a moral argument. we went round in circles for ages, neither of us convinced, and now i'm half-curious what a genuinely deadpan version of his logic would look like if you took it seriously in a bureaucracy.

  could you write a satirical internal memo — about 600 words, numbered clauses and bullet points — from a fictional university ethics board called the "Committee on Moral Foundtaions and Institutional Harmony"? the voice should be an over-earnest bureaucrat who genuinely believes that mapping staff disagreements onto the six foundations tells us which side is morally correct. specifically, have it tackle a dispute over inviting a controversial speaker: frame the pro-invitation staff as high on liberty/oppression and authority/subversion, and the anti-invitation staff as high on care/harm and fairness/cheating. the memo should try to "weigh" these profiles as if they're commensurable, then recommend something absurd — maybe adopting whichever profile holds the departmental majority, or declaring a "pluralism holiday" where normative truth is suspended. the satire should land for someone who knows haidt's work but be readable to someone who doesn't; the target is the slide from descriptive moral psychology to normative justification. keep it self-contained with no citations, bibliography, or references to specific papers, and put one small typo in the header like "Foundtaions" just for flavour.
reasoning: |-
  Okay, the user is asking for a satirical memo about Moral Foundations Theory (MFT) applied to a bureaucratic setting. They want it framed as an internal university memo from a fictional ethics committee, with a specific typo in the header ("Foundtaions"). The core idea is to mock how descriptive psychology (like Haidt's MFT) gets misused for normative moral judgments in institutional contexts.

  The user mentions a real-life argument with their flatmate where the flatmate tried to use conservatives' higher scores on loyalty/sanctity as moral justification for immigration views. This suggests they're frustrated with the is-ought fallacy in moral psychology debates. The memo needs to capture that tension through bureaucratic absurdity.

  I'll structure it as a university memo tackling a speaker invitation dispute. The pro-invite side will be mapped to liberty/oppression and authority/subversion foundations (typical "free speech" arguments), while the anti-invite side gets care/harm and fairness/cheating (common "safety/equity" concerns). The satire hinges on the committee earnestly treating these foundation scores as objective moral weights.

  For the bureaucratic voice, I'll use:
  - Overly precise numbered clauses
  - Jargon like "normative calibration" and "affective resonance"
  - False quantification ("Foundation Units")
  - Absurd solutions like "pluralism holidays"

  Key humorous elements:
  1. The typo in the header ("Foundtaions") to establish bureaucratic incompetence
  2. Reducing moral debates to arithmetic (adding up "Foundation Units")
  3. The committee admitting their own bias but proceeding anyway
  4. The recommended solutions being both contradictory and meaningless

  The "pluralism holiday" idea is perfect - it mocks institutional attempts to dodge moral conflicts through performative neutrality. Ending with the committee scheduling their own retreat to "reharmonize" foundations adds another layer of self-parody.

  I'll avoid academic citations per the request, but embed enough MFT concepts (care, fairness, etc.) that Haidt readers will recognize the satire while keeping it accessible through context. The tone stays deadpan throughout - the more seriously the memo takes its flawed logic, the funnier the contrast.
