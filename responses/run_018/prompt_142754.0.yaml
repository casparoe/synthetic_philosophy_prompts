answer: |-
  You're not overthinking this at all—community elections like this shape daily life, impact vulnerable neighbors (that accessibility ramp matters!), and can permanently alter shared spaces. Your tension between pragmatism and principle is both valid and common. Let's break this down:

  ### Core Principles for Principled Voting
  1. **Harm Reduction First**:  
     > "Which candidate minimizes irreversible damage?"  
     Marcus selling the garden *forever* is permanent loss. Diane cutting compost/ignoring the ramp harms sustainability and inclusion. Raj's plan failing could hand victory to Marcus. Prioritize blocking the *worst outcome*.

  2. **Viability vs. Values**:  
     If Raj has <15% support (per "nobody thinks he can win"), voting for him *might* indirectly help Marcus win by splitting the anti-Marcus vote. Ask: *Will my vote actually advance my values, or accidentally undermine them?*

  3. **Accountability Matters**:  
     Diane’s history with Marcus and dismissiveness about the ramp suggests she may compromise later. A candidate's *character* (e.g., who they align with, what they dismiss) often predicts behavior more than platforms.

  ### Strategic Framework
  | **Candidate** | **Pros**               | **Cons**                           | **Strategic Risk**          |
  |---------------|------------------------|------------------------------------|-----------------------------|
  | **Marcus**    | Ends fees short-term   | **Sells garden (permanent loss)** | Immediate harm, no future recourse |
  | **Diane**     | Saves garden           | Cuts compost; ignores ramp; tied to Marcus | May enable Marcus later; erodes community trust |
  | **Raj**       | Visionary; ecosystem focus | Zero financial experience; non-viable | Splits vote → helps Marcus win |

  ### Your Path Forward
  - **Step 1: Poll Reality-Check**  
    Verify Raj’s viability. If he’s truly at <10-15%, voting for him risks Marcus winning. If he’s closer to 20-25%, a surge is possible.
    
  - **Step 2: Rank Your Non-Negotiables**  
    Which loss hurts most?  
    → **Garden sold?** → Block Marcus at all costs.  
    → **Compost/ramp neglected?** → Pressure Diane publicly or reject her.  
    → **No bold change?** → Push Raj to endorse Diane if he drops out.

  - **Step 3: Act Beyond the Ballot**  
    - Organize neighbors around the ramp/compost: Show Diane these are *voting issues*.  
    - Demand Raj/Diane coordinate: If they unite against Marcus, Raj’s voters become kingmakers.  
    - Propose a garden self-funding plan (e.g., resident-run vegetable sales) to undermine Marcus’ "fees vs. garden" false choice.

  ### The Moral Lens
  Your roommate confuses **self-expression** with **civic responsibility**. Voting in shared communities isn’t like liking a post—it’s stewardship. Refusing to enable harm (Marcus) isn’t "selling out"; it’s protecting vulnerable neighbors and communal resources. Conversely, rejecting Diane solely for impurity might hand victory to Marcus—**the greater harm**.

  **A principled vote here might mean**:  
  - Voting Diane *while publicly holding her accountable* on the ramp/compost, or  
  - Voting Raj *only if* his numbers surge past 20% in the next 48 hours, or  
  - Spoiling your ballot *with a written demand* for ranked-choice voting next year to prevent false dilemmas.

  ### Bottom Line
  This isn’t "pragmatism vs. idealism"—it’s **short-term tactics versus long-term strategy**. Vote to stop the fire (Marcus), then immediately build fireproof systems (e.g., advocate for policy changes that prevent future sell-offs). Your conscience is your compass, but let it navigate *real* terrain—not just the map in your head.
