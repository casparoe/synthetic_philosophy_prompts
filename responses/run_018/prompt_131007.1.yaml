answer: |-
  ## Memorandum: Diagnosis and Resolution Path for the Moral Luck Stalemate

  **To:** Academic Working Group on Moral Responsibility  
  **From:** Professional Philosopher of Ethics (Conceptual Analysis & Disagreement Architecture)  
  **Subject:** Structural Diagnosis of the Moral Luck Impasse and Proposed Path Forward  
  **Date:** October 26, 2023  

  **1. Background: Core Positions and Dialectical Loops**  
  *   **Moral Luck Camp (Williams, Nagel):** Argues moral assessments *in practice* are deeply sensitive to outcomes and circumstances beyond agent control (resultant, circumstantial, constitutive, causal luck). Demonstrates this via paradigmatic cases (negligent drivers differing only in outcome; agents shaped by radically different upbringings). Claims this pervasive luck fundamentally conflicts with the **Control Principle (CP)**: Genuine responsibility requires control. Diagnoses a tension, even incoherence, within our moral practices.
  *   **Control Principle Defenders (Kantian/Strawsonian hybrids, e.g., early efforts by Wolf, Zimmerman):** Accepts CP as foundational. Seeks to preserve genuine responsibility by either:
      *   **Denial:** Arguing luck *doesn't* affect core responsibility (blameworthiness/praiseworthiness), only associated practices (punishment, feeling guilt/regret).
      *   **Reconception:** Shifting the locus of responsibility *away* from outcomes/external circumstances to internal states (intentions, efforts, quality of will, character-as-manifested-in-volition) over which agents *do* have control (or sufficient control).
  *   **Recurring Dialectical Loops:**
      1.  **Example-Countermove Loop:** ML camp presents driver/corrupt upbringing cases → CP defenders distinguish *blameworthiness* (internal) from *liability to sanction* (external/consequentialist), or invoke *moral risk* (both drivers equally culpable for reckless disregard) → ML camp argues this distinction doesn't match reactive attitudes (we *feel* more blame towards the killer) or that "character" itself is luck-infected → CP defenders refine internalist account or appeal to *epistemic* limitations (we blame the killer more *because* the outcome reveals the risk/will more clearly, not because outcome *constitutes* blameworthiness) → Loop restarts.
      2.  **Control Principle Interpretation Loop:** ML camp argues CP demands "total control" which is impossible → CP defenders argue CP requires only control over the *relevant* aspect (intention/effort) → ML camp argues relevance is question-begging or that separating intention from outcome/consequence is artificial → Debate shifts to metaphysics of action/agency → Little resolution, loop resets.
      3.  **Reactive Attitude Loop:** Both sides appeal to ordinary moral psychology (reactive attitudes like blame/indignation) – ML camp to show its outcome-sensitivity, CP defenders to show its focus on quality of will → Each side accuses the other of misdescribing or over/under-interpreting the phenomenology → Stalemate.

  **2. Hidden Distinctions Obscuring Progress:**
  *   **Outcome-Sensitive Assessment (OSA) vs. Outcome-Sensitive Blame (OSB):** As hypothesized, significant conflation occurs. ML arguments primarily demonstrate **OSA**: our *evaluation of acts/events* is undeniably sensitive to actual outcomes (killing is worse than *almost* killing; betraying a just cause is worse than betraying a corrupt one). CP defenses primarily target **OSB**: whether the *agent's fundamental moral standing or desert of blame* is altered *solely* by outcomes beyond control. Arguments against OSB (citing CP's intuitive force) are mistakenly taken as refutations of OSA, and demonstrations of OSA are mistakenly taken as requiring OSB.
  *   **Ambiguity of "Control":** The term functions differently:
      *   **Causal Efficacy (ML focus):** Power to determinately bring about specific outcomes (denied by resultant/causal luck).
      *   **Epistemic Access (CP defense tactic):** Knowledge or reasonable foreseeability of consequences (invoked to mitigate OSB claims).
      *   **Normative Authority (CP core):** Sovereignty over one's will/intentions/character (emphasized by internalist reconceptions). Debates often slide between these senses without notice.
  *   **Metaphysical vs. Normative Priority:** The core tension is whether the *possibility* of responsibility (metaphysical, grounded in CP) dictates the *structure* of evaluation (normative), or whether the *practice* of evaluation (normative, revealing OSA) dictates what responsibility *can be* (metaphysical).

  **3. Diagnosis: Two Questions Under One Label, Exacerbated by Verbal Ambiguity**
  The impasse is **primarily substantive** but driven by **two distinct questions** pursued under the umbrella term "moral luck/responsibility," further obscured by **verbal ambiguity** ("control," "responsibility," "blame").

  *   **Question 1 (Metaphysical - CP Priority):** "Given the CP as a necessary condition for genuine responsibility, is *any* form of substantive moral responsibility (agent-focused desert of blame/praise) possible in a world permeated by luck?" *This is the CP defender's driving concern.* Nagel's conclusion leans towards "No"; internalists strive for a qualified "Yes" by redefining the object of responsibility.
  *   **Question 2 (Normative - Practice Priority):** "Given that our actual moral evaluations *are* pervasively sensitive to luck (OSA), how should we understand, justify, or potentially revise our concepts of responsibility, blame, and praise to make this sensitivity coherent, fair, or rationally defensible?" *This is the core insight motivating Williams and the descriptive force of Nagel's taxonomy.* It accepts OSA as a starting point.

  **The verbal ambiguity surrounding "control" and "responsibility" fuels the conflation of OSA and OSB and allows each side to talk past the other.** CP defenders hear OSA claims as attacks on the very possibility of responsibility (Q1). ML proponents hear CP defenses as denying the undeniable reality of OSA's role in our moral lives (Q2). The dialectical loops arise because examples proving OSA (Q2) are met with arguments defending the possibility of responsibility (Q1), while defenses of CP against OSB (Q1) are mistaken as denials of OSA (Q2).

  **4. Breaking the Loop: Required Progress**
  Resolution requires **explicit separation of the two questions** and a **strategic shift in focus**, coupled with **conceptual clarification**.

  1.  **Formal Distinction:** Clearly separate OSA and OSB in all future discourse. Acknowledge OSA as a robust feature of moral practice requiring explanation (Q2). Treat OSB as the contentious claim directly challenging the CP (Q1).
  2.  **Clarify "Control":** Specify in each argument whether "control" refers to causal efficacy over outcomes, epistemic access, or normative authority over will/intention. Explicitly state which sense is deemed necessary for responsibility.
  3.  **Prioritize the Normative Question (Q2):** **Philosophers should prioritize Question 2.** Reasons:
      *   **Descriptive Primacy:** OSA is an undeniable empirical fact about human moral psychology and practice, as Williams and Nagel compellingly demonstrate. Any viable theory of responsibility must account for it.
      *   **Metaphysical Stalemate:** Q1 leads to an almost inevitable stalemate or pessimism (Nagel) or requires increasingly strained internalist redefinitions that struggle to capture the full force of our moral reactions. Focusing *first* on understanding the practice we actually have (Q2) offers a more productive starting point.
      *   **Practical Relevance:** Understanding how to live well and judge wisely within a luck-permeated world (Q2) is arguably more urgent than settling the metaphysical possibility of pure responsibility (Q1), especially if Q1 seems unresolvable or leads to nihilism about responsibility.
      *   **Reframing CP:** Addressing Q2 may lead to a *revised understanding* of the CP itself – perhaps not as a veto on luck-influenced judgments, but as a regulative ideal shaping *how* we respond to luck (e.g., distinguishing degrees of blame, focusing on controllable aspects *within* luck-influenced contexts, emphasizing mercy alongside justice).

  **5. Acknowledgment of the Losing Side's Best Point**
  The **Control Principle Defender's strongest point** must be taken seriously: **The deep, seemingly ineradicable intuition that it is fundamentally unfair to hold agents *morally responsible* (in the sense of deserving blame or praise constitutive of their moral standing) for what is genuinely beyond their control (normative authority sense).** This intuition fuels the resistance to OSB and the search for a "control-compatible" core of responsibility. Even if prioritizing Q2, any successful normative theory *must* engage with this intuition of fairness. Dismissing it entirely risks making morality arbitrary or alien. The challenge for the Q2-focused approach is to explain the role and limits of this fairness intuition within a practice that inherently involves OSA, perhaps by developing a more nuanced account of "desert" or "standing" that accommodates both the influence of luck and the value of agency.

  **6. Bottom-Line Recommendation**
  **Reframe the debate.** Explicitly distinguish the metaphysical question of luck-free responsibility (Q1/OSB) from the normative question of structuring evaluation given pervasive outcome-sensitivity (Q2/OSA). Prioritize developing a robust normative account (Q2) that takes OSA seriously as a starting point, while rigorously clarifying concepts (especially "control") and honestly grappling with the fairness intuition underpinning the CP. This shifts focus from defending or attacking the *possibility* of pure responsibility towards understanding and potentially refining the *practice* of responsibility within the human condition as we find it. Progress lies not in "solving" the tension but in learning to navigate it with greater conceptual clarity and normative sophistication. The goal should be a morally coherent and humane practice, not necessarily a metaphysically pristine one.

  **Signed,**  
  Philosopher of Ethics (Conceptual Analysis & Disagreement Architecture)
