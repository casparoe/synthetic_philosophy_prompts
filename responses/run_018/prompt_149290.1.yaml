reasoning: |-
  We are dealing with a phenomenon where the justification for categorizing an intervention as "therapy" versus "enhancement" shifts between three different baselines without acknowledgment: 
    1. The individual's past state (e.g., restoring hearing to the person's own youthful level).
    2. The statistical human average (e.g., intervening to bring a child up to the population average).
    3. The environmental demands (e.g., not considered for the individual who is within the normal range but whose abilities are mismatched to the environment).

  This shifting is done to maintain a desired boundary (that therapy is acceptable and enhancement is not) but without consistency in the baseline used.

  Analysis:
  - It is not merely ambiguity because each baseline is coherent in isolation and is used strategically to support the therapy label for desired cases and to deny it for undesired ones.
  - It is different from equivocation because equivocation is the ambiguous use of a single term with multiple meanings. Here, the term "normal" is being used in three distinct senses (personal, statistical, and environmental), and the shift is between these senses without acknowledgment. However, the structure is more systematic and context-dependent.
  - It is different from motte-and-bailey because that involves retreating from a controversial claim (bailey) to a less controversial one (motte). Here, there is no clear retreat; instead, there is a shifting of the baseline to suit the case.

  Since I am not aware of an established term for this specific three-way baseline shift in the therapy-enhancement debate, I will coin a term and provide a precise definition.

  Proposed term: **Baseline Drift Defense**

  Definition: 
    A rhetorical strategy in the therapy-enhancement distinction where the defender shifts without acknowledgment between three baselines for what constitutes "normal" function in order to categorize a given intervention as therapy (and thus acceptable) or enhancement (and thus potentially unacceptable). The three baselines are:
      a) Individual-historical baseline: the individual's own past state of functioning.
      b) Statistical-population baseline: the average or typical level of functioning in the human population.
      c) Environmental-adaptive baseline: the level of functioning required to meet the demands of a specific environment.

    Boundary conditions:
      - Applies when at least two of these baselines are used inconsistently across cases to maintain a preferred categorization (therapy for desired interventions, enhancement for dispreferred ones).
      - Does not apply when the baseline is consistently applied (e.g., always using the statistical-population baseline) even if it leads to debatable categorizations.
      - Also does not apply if the shift is explicitly acknowledged and argued for (e.g., making a case that for condition X, the individual-historical baseline is appropriate, and for condition Y, the environmental-adaptive baseline is appropriate).

  Key distinctions:
    - From equivocation: Equivocation is a general fallacy of using a word in multiple senses without clarification. Baseline drift defense is a specific form of equivocation that occurs in the context of defining "normal" in the therapy-enhancement debate, and it involves exactly three distinct baselines that are systematically shifted. It is a patterned and context-specific equivocation.
    - From motte-and-bailey: The motte-and-bailey fallacy involves two positions (one easily defensible, one controversial) and a strategic retreat. Baseline drift defense does not involve a retreat but rather a selective application of different criteria to different cases to maintain a consistent label (therapy) for favored interventions.

  Boundary cases:
    - Applies: 
        Example 1: Using the individual-historical baseline to justify cochlear implants for age-related hearing loss (restoring to the person's own past level) but then switching to the statistical-population baseline to deny cognitive enhancers to a person with average cognition (because they are at the population average) even though their work environment demands higher performance.
    - Does not apply:
        Example 2: Consistently using the statistical-population baseline to define therapy: thus, cochlear implants for someone below the population average (regardless of personal history) is therapy, and cognitive enhancers for someone at or above the population average is enhancement. Even if one disagrees with the consistency, there is no shifting.

  Now, the structured summary in JSON as requested.
answer: |-
  ### Analysis
  The phenomenon you describe involves a strategic, unacknowledged shift between three distinct baselines for defining "normal" function in therapy-enhancement distinctions:  
  1. **Individual-historical baseline**: Restoration to the person’s past state (e.g., cochlear implants restoring your dad’s mid-life hearing).  
  2. **Statistical-population baseline**: Alignment with human species-typical averages (e.g., intervening for a child below statistical norms).  
  3. **Environmental-adaptive baseline**: Sufficiency for current contextual demands (e.g., your cognition being "normal" statistically but inadequate for modern work).  

  Defenders of the therapy-enhancement boundary selectively apply these baselines to classify preferred interventions as "therapy" (ethically acceptable) and dispreferred ones as "enhancement" (ethically suspect), without admitting the inconsistency. This isn’t mere ambiguity; each baseline is coherent in isolation but deployed opportunistically to preserve a moral boundary.  

  #### Key Differences from Related Concepts  
  - **Equivocation**: While equivocation ambiguously uses a single term (e.g., "normal") with multiple meanings, this is a *systematic, patterned slide* across three distinct criteria to defend a specific ethical boundary. Equivocation is broader and less structured.  
  - **Motte-and-bailey**: The motte-and-bailey fallacy retreats from a controversial claim to a defensible one. Here, there’s no retreat; instead, the baseline *shifts contextually* to expand the scope of "therapy" without conceding the inconsistency.  

  No established term exists for this precise three-way slide. I propose **adaptive baseline drift** to capture the unacknowledged flexibility in defining "normal" to fit preferred ethical outcomes.  

  #### Boundary Conditions  
  - **Applies when**:  
    - Multiple baselines are used inconsistently across cases.  
    - The shift preserves the therapy-enhancement boundary (i.e., favored interventions are labeled "therapy").  
    - The inconsistency is unacknowledged.  
  - **Does not apply when**:  
    - A single baseline is applied consistently.  
    - Baseline shifts are explicitly justified (e.g., "We use individual-historical for acquired conditions but statistical for congenital ones").  

