  Hmm... first, why do ghost provisions break the frame? The 1893 text mentions physical rights tied to outdated tech (ice harvesting), while the 2018 purpose focuses on modern ecosystem resilience. When a geothermal project claims "mill-race flow" rights, the words exist in law but the context is extinct. Literalism would grant rights for non-existent purposes, but purposivism might override text too freely. The procedure must flag this clash.

  For the structure: The setup needs to be concise—100 words covering time pressure and ghost provisions. Then the procedure itself: a flowchart-like Q&A with clear stop points. Questions should escalate from literal text checks to purpose alignment, with specific thresholds. For ghosts, a tie-breaker is needed—perhaps "material harm to current ecosystems" as the decider.

  Case A (geothermal boreholes): They'll hate rejecting it, but if the literal right exists and purpose doesn't override (no harm? no foul?), it might pass. But if pumping disrupts aquifers, tie-breaker blocks it. Case B (irrigation diversion): Literal right exists, but climate purpose clearly opposes—here purposivism wins. Procedure must show when to override text.

  Finally, where it breaks: When both text and purpose are silent, or when "ecosystem harm" is debatable (subjective). Also false positives if minimal harm slips through. Admit limitations—some cases need panel review.

  Better avoid legal jargon. Keep it procedural: "Check X, if Y then Z." British English: "whilst" not "while", "shall" for obligations. Nail the tone—weary professional who wants efficiency, not theory.
answer: |-
  ### 1. Practical Setup (100 words)  
  As a Tribunal case officer, you must issue preliminary rulings on water-rights proposals within 15 minutes, balancing the 1893 Riparian Act’s literal text against the 2018 Climate Adaptation Purpose Statement. Ghost provisions (e.g., "mill-race flows") are rights defined in 1893 for obsolete practices, lacking modern physical counterparts. This breaks the text-vs-purpose frame because literalism grants rights with no current ecological or economic relevance, whilst purposivism risks overriding explicit statutory language. Your challenge: swiftly identify when text controls, when purpose controls, and when ghost provisions force a values-based judgement the panel must resolve.  

  ### 2. The Procedure (400 words)  
  **Ordered Questions & Stop Conditions:**  
  1. **Literal Threshold:** Does the proposal *explicitly* align with a right named in the 1893 Act?  
     - *Sufficient answer:* Yes (with specific clause) / No.  
     - *Stop if:* **No** → **Reject**. Purposivism irrelevant without textual hook.  
     - *Stop if:* **Yes** → Proceed to Q2.  

  2. **Ghost Test:** Is the claimed right a "ghost provision" (e.g., ice-harvesting, mill-race flows)?  
     - *Sufficient answer:* Yes (obsolete purpose/technology) / No (active use, e.g., fishing).  
     - *Stop if:* **No** → Proceed to Q3.  
     - *Stop if:* **Yes** → Flag for panel (values clash). *Unless* → Apply tie-breaker: **"Will granting this right cause material harm to current aquatic ecosystems?"**  
       - *Harm?* **Yes** → **Reject** (Purpose overrides ghost).  
       - *Harm?* **No** → **Approve** (Text controls, no counter-harm).  

  3. **Purpose Conflict:** Does the proposal *directly undermine* the 2018 Purpose (ecosystem resilience/sustainability)?  
     - *Sufficient answer:* Evidence of quantifiable harm (e.g., reduced baseflow, habitat loss) / No material conflict.  
     - *Stop if:* **No conflict** → **Approve** (Text controls).  
     - *Stop if:* **Conflict** → **Reject** (Purpose overrides text).  

  **Judgement-Call Flags:**  
  - Flag for panel if: Ghost provision *and* harm is contested/unquantifiable (e.g., "aesthetic degradation of mill-race heritage").  
  - Never flag mere textual ambiguity—apply literalism unless Q2/Q3 triggers override.  

  **Tie-Breaker for Ghost Rights:**  
  - Grant ghost rights *only if* no **material ecosystem harm** is provable. Harm shifts balance to purposivism.  

  ---

  ### 3. Case A: Geothermal Boreholes Claiming "Mill-Race Flow" Right  
  - **Q1:** Yes. Borehole operator cites "mill-race flow" diversion rights (S.5, 1893 Act).  
  - **Q2:** **Ghost Test → Yes.** Mill-races obsolete; no functional mills exist.  
    - *Tie-breaker:* Pumping geothermal coolant *could* lower aquifer levels, reducing stream baseflow → **material harm** likely.  
  - **Verdict:** **Reject.** Purpose overrides ghost provision due to ecological harm.  
    *The answer you won’t like:* Literal rights lose where ghosts conflict with measurable sustainability goals. The 1893 text isn’t a blank cheque.  

  ### 4. Case B: Blocking Literal Irrigation Diversion  
  - **Q1:** Yes. Farmer holds 1893 irrigation rights (S.12).  
  - **Q2:** **Ghost Test → No.** Irrigation remains actively practised.  
  - **Q3:** **Purpose Conflict → Yes.** Diversion would exacerbate drought stress in a protected wetland (2024 data shows 40% habitat loss risk).  
  - **Verdict:** **Reject.** Purpose overrides text due to acute ecological threat.  
    *Key nuance:* Literalism loses when *proven* harm to resilience objectives exists. Rights are conditional on contemporary environmental limits.  

  ### 5. Where the Procedure Breaks (150 words)  
  The procedure misfires when:  
  - **False positives:** Minor literal rights (e.g., ornamental pond-filling) get blocked by overstated ecological harm (subjective thresholds).  
  - **Ghost ambiguities:** "Material harm" is unquantifiable (e.g., cultural loss if a dry mill-race affects tourism). This forces panel referral but wastes time.  
  - **Silent conflicts:** Where the 1893 text *and* 2018 Purpose are silent (e.g., novel bioengineering), the procedure lacks hooks for analysis.  
  - **Values-blind spots:** It can’t resolve "soft" harms (e.g., community identity tied to diverted streams) vs. "hard" sustainability metrics.  
  **Genuine failures:** When evidence of harm/purpose alignment is *equally contested*, the procedure defaults to literalism—potentially approving ecologically risky projects. Flag these immediately; they need panel scrutiny for ethical weighting.  

  ---  
  **Final note:** This systematises 80% of cases in 15 minutes. For ghosts, the harm-based tie-breaker ensures ecology trumps nostalgia—unless the panel overrules.
