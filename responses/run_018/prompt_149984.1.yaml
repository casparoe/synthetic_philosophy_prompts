prompt: |-
  I am drafting the final examination for an upper-level seminar that straddles normative economics and philosophy of decision under radical uncertainty. I want a single essay prompt — answerable in roughly 90 minutes — on safe Pareto improvements, understood here not in the textbook sense but in a more demanding, model-robust form: a change is safe only if it is Pareto-dominant with respect to every world-state within each affected agent's credible set, not merely with respect to the actual world. The prompt must be designed so that reciting the standard Arrow-Sen framework or defining Pareto efficiency earns at most passing marks. Instead, it should compel students to wrestle with what I will call the epistemic-parallax problem: two agents with identical utility functions but structurally different economic models — say, one treating climate damage as linear and one as threshold-governed — can disagree on whether a carbon-tax-and-dividend scheme is safe, because the scheme harms high-emission industries in the linear model but not in the threshold model. The exam question should ask students to determine whether safe Pareto improvements can exist at all when credible sets diverge in this way, whether the safety condition covertly privileges a particular risk posture or intersubjective robustness criterion, and whether a rationalist framework that takes both model uncertainty and value pluralism seriously should abandon the concept, refine it, or accept that it is necessarily empty in domains of deep disagreement. Please provide: (1) the exam question itself, formulated precisely; (2) a model answer of approximately 700 words that does not merely resolve the tension but maps exactly where it becomes unavoidable and which horn is more defensible; and (3) a marking scheme with five must-hit analytical moves, each worth 4 marks (total 20), together with a one-line description of the characteristic failure mode for each move — for instance, defining safe Pareto improvement correctly but treating model divergence as merely an empirical disagreement rather than a normative one.
reasoning: |-
  We are designing an exam prompt and supporting materials on the concept of safe Pareto improvements under radical uncertainty and model divergence. The key elements are:
   - Safe Pareto improvement: a change that is Pareto dominant in every world-state within each affected agent's credible set (not just the actual world).
   - The epistemic-parallax problem: agents with identical utility functions but different models (e.g., linear vs. threshold climate damage) might disagree on whether a policy is safe because their credible sets differ.
   - The prompt should compel students to engage with:
       a) Whether safe Pareto improvements can exist when credible sets diverge.
       b) Whether the safety condition privileges a particular risk posture or robustness criterion.
       c) Whether we should abandon, refine, or accept that the concept is necessarily empty in domains of deep disagreement.

   Let's break this down:

   1. The Exam Question:

   We want a single essay prompt that addresses the above. It should be precise and set up the problem clearly.

   2. Model Answer (approx. 700 words):

   The model answer should not just resolve the tension but map where it becomes unavoidable and argue for a defensible position.

   3. Marking Scheme:

   Five must-hit analytical moves, each worth 4 marks (total 20). For each, we need a one-line description of the characteristic failure mode.

   Let's proceed step by step.

   Step 1: Drafting the exam question.

   We'll set up the scenario with an example (like the carbon tax) and then pose the core questions.

   Step 2: Model Answer

   We'll structure the model answer to:
     - Define the safe Pareto improvement in the required robust sense.
     - Introduce the carbon tax example to illustrate the parallax problem.
     - Argue that existence of safe Pareto improvements is contingent on the overlap of credible sets and the structure of the policy.
     - Discuss how the safety condition might implicitly favor a risk-averse posture or a robustness criterion (like maxmin).
     - Confront the deep disagreement and consider the future of the concept.

   Step 3: Marking Scheme

   We'll identify five key analytical moves that the student must make and the common failure mode for each.

   Now, the detailed components:

   Exam Question:

   "In normative economics under radical uncertainty, we define a safe Pareto improvement (SPI) as a policy change that is Pareto dominant with respect to every world-state within the credible set of each affected agent. This contrasts with the standard Pareto criterion, which only requires dominance in the actual world. Consider two agents, A and B, who have identical utility functions but hold structurally different models of the world. For instance, agent A believes climate damage is linear in cumulative emissions, while agent B believes it follows a threshold model (with severe damage only beyond a critical point). 

   (a) Using the example of a carbon-tax-and-dividend scheme (which taxes carbon emissions and redistributes the revenue equally to all citizens), explain how A and B might disagree on whether this policy is an SPI. In particular, under A's linear model, the tax would harm high-emission industries in every scenario, while under B's threshold model, the same industries might be unharmed below the threshold. However, note that the tax might prevent catastrophic damage in B's model above the threshold.

   (b) More generally, can any safe Pareto improvements exist when agents' credible sets diverge? Why or why not?

   (c) Does the SPI condition covertly impose a particular risk posture (e.g., strong risk aversion) or an intersubjective robustness criterion (e.g., requiring unanimity across all models in the union of credible sets)? 

   (d) In light of the epistemic-parallax problem, should a rationalist framework that takes both model uncertainty and value pluralism seriously abandon, refine, or accept that the concept of SPI is necessarily empty in domains of deep disagreement?

   Write an essay addressing these points. Your answer should go beyond restating standard welfare economics and engage with the philosophical challenges of decision-making under radical uncertainty."

   Model Answer (approx. 700 words):

   [Introduction] The quest for policy improvements that are robust to radical uncertainty leads to the concept of safe Pareto improvements (SPI). An SPI requires that a policy change leaves every agent at least as well off in every world-state they deem credible, and strictly better in at least one. This essay argues that while SPI is a compelling ideal, it becomes unattainable under deep model divergence, and that the condition implicitly favors a maxmin risk posture. However, rather than abandonment, a refinement that relaxes the unanimity requirement may be more fruitful.

   [Part a: The Carbon Tax Example] Consider a carbon-tax-and-dividend scheme. Agent A, with a linear damage model, expects continuous harm from emissions. Thus, even a small tax reduces damage and the dividend might compensate losers. However, in every state of the world within A's credible set, high-emission industries (like coal) are made worse off by the tax because their costs rise and demand falls, without sufficient compensation from the dividend (which is spread across the population). Hence, A cannot endorse the tax as an SPI because it harms these industries in all scenarios A considers possible.

   Agent B, with a threshold model, believes that below a critical emissions level, climate damage is negligible. In states below the threshold, the tax harms high-emission industries without providing any environmental benefit. However, above the threshold, the tax prevents catastrophic damage and the dividend compensates. But note: in states below the threshold, the tax causes unnecessary harm to high-emission industries. Thus, for B, the tax is not an SPI because in the below-threshold states (which B considers credible) those industries are harmed. Therefore, both agents, despite identical utilities, reject the tax as an SPI, but for different model-based reasons.

   [Part b: Existence under Divergence] The existence of an SPI requires a policy that dominates the status quo in every state in the intersection? No, note the condition: for each agent, the policy must dominate in every state in that agent's own credible set. This is more demanding than requiring dominance in the union of credible sets. In fact, if there is any state in agent i's credible set where the policy makes i worse off, then agent i will veto the policy as unsafe. Therefore, when credible sets diverge, the only policies that can be SPI are those that are Pareto dominant in the union of all agents' credible sets. However, this union may be very large, making it hard to find a policy that improves upon the status quo in every state in the union. Moreover, because the agents have different models, they might assign positive probability to states that are mutually exclusive (e.g., linear vs threshold). In such cases, a policy that benefits everyone in one model might harm someone in another. Therefore, SPI may be impossible unless the credible sets have a common core of states where the policy is unambiguously beneficial. But in deep disagreements, such a common core may be empty.

   [Part c: Risk Posture and Robustness] The SPI condition is inherently conservative. It requires that no agent is made worse off in any state they consider possible, which is a maxmin expectation with respect to the agent's own credible set. This imposes a strong risk aversion: an agent will reject a policy that offers high gains in some states if it imposes even a small loss in another state they deem credible. Moreover, the condition uses an intersubjective robustness criterion that is more demanding than standard Pareto: it requires unanimity not just in outcomes but across all models (each agent's entire set). This is a very high bar, especially when models are structurally different.

   [Part d: Abandon, Refine, or Accept Emptiness?] Given the epistemic-parallax problem, the concept of SPI as defined is likely empty in domains of deep disagreement. But abandonment might be premature. We might refine the concept by:
     (i) Relaxing the requirement to almost all states (allowing some negligible harm in low-probability states) — but this requires probabilistic beliefs, which are unavailable under radical uncertainty.
     (ii) Focusing on the intersection of credible sets — but if agents have no common states, this is empty.
     (iii) Adopting a more dynamic perspective: use SPI as a regulative ideal to iteratively narrow disagreements by sharing evidence.

   However, in the static setting of a one-shot policy decision, the emptiness may be unavoidable. Therefore, we should accept that SPI is not a generally applicable criterion in radically uncertain, pluralistic settings. Instead, we might shift to alternative criteria, such as those that require robustness across a broad class of models (without requiring unanimity) or that seek consensus through deliberation. But note: such alternatives abandon the strict safety that SPI promised.

   [Conclusion] The SPI concept is theoretically appealing but practically fragile in the face of model divergence. It privileges a maxmin risk posture and demands an impossible level of intersubjective agreement. In domains of deep disagreement, we must acknowledge that SPI is empty and seek more pragmatic alternatives. However, the ideal of safety remains valuable and should guide refinements that are less absolute but more achievable.

   Marking Scheme:

   Five must-hit analytical moves (each worth 4 marks) and characteristic failure modes:

   1. Analytical Move: Correctly define safe Pareto improvement as requiring Pareto dominance in every state within each agent's own credible set (not just the actual world or the union/intersection of sets).
      Failure Mode: Defining SPI in terms of the actual world, or confusing it with standard Pareto, or requiring dominance only in the intersection of credible sets.

   2. Analytical Move: Use the carbon tax example to illustrate how the same policy can fail to be an SPI for both agents due to model divergence (specifically, showing that in some states in A's set the policy harms high-emission industries, and in some states in B's set it also harms them, but for different model-consistent reasons).
      Failure Mode: Treating the disagreement as merely about probabilities or magnitudes of harm, rather than about the structure of the model (linear vs threshold) leading to different state-wise evaluations.

   3. Analytical Move: Argue that the existence of SPI is contingent on the policy being Pareto dominant in the union of all agents' credible sets, and that deep model divergence (with mutually exclusive states) makes this union large and hence SPI unlikely or impossible.
      Failure Mode: Claiming that SPI is always possible if the policy is beneficial in the actual world, or assuming that the agents can compromise by averaging their models.

   4. Analytical Move: Identify that the SPI condition implicitly imposes a maxmin risk posture (each agent evaluates the policy by its worst-case outcome in their own credible set) and an intersubjective robustness criterion that requires unanimity across all models (each agent's entire set).
      Failure Mode: Failing to recognize the risk aversion embedded in SPI, or conflating the robustness criterion with other forms of robustness (e.g., model averaging).

   5. Analytical Move: Conclude that SPI is necessarily empty in deep disagreement and discuss whether to abandon, refine, or accept the emptiness. A strong answer will consider at least one refinement but note its limitations, leading to the inevitability of emptiness in static, deep disagreement settings.
      Failure Mode: Suggesting that SPI can be preserved without substantive refinement, or abandoning the concept without considering alternatives.

   Now we write the actual exam question and model answer to fit the word count.

