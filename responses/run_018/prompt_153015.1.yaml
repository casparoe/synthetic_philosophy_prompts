answer: |-
  Below is a comprehensive specification of desiderata for a theory addressing Pascal's mugging (PM) and its distributed variant (Distributed Epistemic Mugging, DEM). These criteria balance formal constraints, epistemic norms, practical rationality, and societal impacts. Desiderata are categorized by core motivation, with **non-negotiable constraints** (NN) marked explicitly—these reflect fundamental coherence requirements. Others are *camp-sensitive* (CS), reflecting philosophical priorities.

  ---

  ### **I. Desiderata: Requirements & Motivations**
  1.  **Non-Manipulability (Avoiding Sure Loss)** [NN]  
      *   **Requirement:** The theory must prevent agents from being systematically exploited into accepting dominated strategies or incurring net losses due to low-probability threats/rewards.  
      *   **Motivation:** *Classic PM*: An agent paying \$5 to a mugger promising 10^100 utils with P=10^-99 is exploited. *DEM*: An agent bankrupts themselves donating to dozens of independent "existential risk" charities each claiming P=10^-6 of saving 10^12 lives unless funded. The theory must block paths to guaranteed ruin via improbable claims.  
      *   **Constraint:** Violation implies irrationality (accepting dominated actions).

  2.  **Resource Sensitivity (Bounded Rationality)** [NN]  
      *   **Requirement:** Belief formation and action must account for finite cognitive/computational resources (attention, calculation time) and material resources (money, time).  
      *   **Motivation:** *DEM*: Processing thousands of micro-claims (e.g., social media prophecies, niche risk reports) incurs cognitive costs; acting on all credible-seeming ones exhausts material resources. Ignoring costs leads to "death by a thousand mugging-lite claims."  
      *   **Constraint:** Required by any realistic model of agency (e.g., Simon’s bounded rationality).

  3.  **Probabilistic Consistency (Avoiding Dutch Books)** [NN]  
      *   **Requirement:** Beliefs must conform to probability calculus (coherent degrees of belief).  
      *   **Motivation:** *All scenarios*. Rejecting probability axioms (e.g., allowing P(A) + P(¬A) ≠ 1) opens the door to exploitative bets. *Manufactured Uncertainty*: Bad actors can exploit incoherent beliefs by offering tailored wagers.  
      *   **Constraint:** Foundational for Bayesian epistemology/decision theory.

  4.  **Responsiveness to Genuine Existential Risk (GER)** [NN?/CS]  
      *   **Requirement:** The theory must permit significant action (even costly/precautionary) when confronting *well-evidenced* catastrophic threats, regardless of low probability.  
      *   **Motivation:** Ignoring GERs (e.g., asteroid impact with P=10^-5, nuclear winter scenarios) due to low probability is catastrophic error. Distinguishing GER from PM/DEM is crucial.  
      *   **Constraint Status:** NN for consequentialists/pragmatists; CS for strict evidentialists (may prioritize belief over action).

  5.  **Evidential-Pragmatic Distinction** [CS]  
      *   **Requirement:** Belief revision (credence assignment) should be governed primarily by evidence, not pragmatic stakes. Pragmatic factors may influence *action* but not core *belief*.  
      *   **Motivation:** *All scenarios*. Blurring the line (e.g., inflating P(claim) because stakes are high) collapses epistemology into decision theory. *DEM*: Pragmatic pressure from many high-stakes claims shouldn’t distort credences.  
      *   **Constraint Status:** Core for *evidentialists*; negotiable for pragmatists/consequentialists.

  6.  **Individual vs. Collective Cost Accounting** [CS]  
      *   **Requirement:** The theory must recognize that costs of belief/action may differ at individual vs. societal levels (e.g., false positives have network effects).  
      *   **Motivation:** *DEM*: Widespread false alarms about disasters (e.g., "AI doom tomorrow!") cause societal desensitization ("cry wolf effect"), misallocating collective resources. Individual rationality ≠ group rationality.  
      *   **Constraint Status:** NN for social epistemology; CS for individualist frameworks.

  7.  **Rejection vs. Stakes Discounting Distinction** [NN]  
      *   **Requirement:** An agent can reject a claim *as improbable* without thereby dismissing the *significance of its stakes* if true.  
      *   **Motivation:** *Classic PM/DEM*: Refusing the mugger’s deal shouldn’t imply disbelieving the *conceivability* of 10^100 utils. *GER*: Acknowledging asteroid threat stakes doesn’t require accepting every doomsayer.  
      *   **Constraint:** Prevents false dilemma ("act or ignore stakes").

  8.  **Prior Sensitivity (Unavoidability of Priors)** [NN]  
      *   **Requirement:** The theory must incorporate prior probabilities meaningfully and resist arbitrary inflation of likelihoods for high-stakes claims.  
      *   **Motivation:** *Manufactured Uncertainty*: Adversaries can craft claims with *apparently* non-zero likelihoods (e.g., "simulation hypothesis says I control your reality"). Priors anchor plausibility.  
      *   **Constraint:** Bayesian core principle; avoids " Cromwell’s Rule " violations.

  ---

  ### **II. Tensions & Impossibility Results**
  The most critical tension arises between:
  *   **Non-Manipulability (D1):** Demands immunity to exploitation via low-P/high-stakes claims.
  *   **GER Responsiveness (D4):** Demands serious action for low-P/high-stakes *genuine* threats.
  *   **Probabilistic Consistency (D3):** Requires coherent credences over all possibilities.

  **The Contradiction:**  
  - If the theory allows significant action for *any* claim with sufficiently high stakes (regardless of how low P is), it succumbs to PM/DEM (violating D1).  
  - If it imposes a strict threshold (e.g., ignoring P < ε), it fails GER responsiveness (violating D4).  
  - Probabilistic consistency (D3) forces acknowledgment that *some* claims with miniscule P *might* be true, exacerbating the tension.

  **Implication:** A theory satisfying D1, D3, and D4 *requires* a **discrimination mechanism** to distinguish *manipulative* low-P/high-stakes claims from *genuine* ones. This mechanism cannot rely solely on probability/stakes calculus (as both types share these features) without circularity. It must incorporate:
  *   **Evidential Robustness:** Quality/quantity of evidence beyond mere logical possibility (addressing D5, D8).
  *   **Social/Structural Filters:** Mechanisms to discount claims from sources/systemic contexts prone to manipulation (addressing D6).

  Failure to provide this implies **no theory can simultaneously satisfy D1, D3, and D4 without additional constraints on evidence or source reliability.** This is the core impossibility at the heart of mugging scenarios.

  ---

  ### **III. Brief Evaluation of Frameworks**
  *   **Bayesian Threshold View (e.g., ignore P < 1/N, N = resources):**  
      - *Satisfies:* D1 (avoids exploitation), D2 (resource-aware), D3 (coherent), D8 (priors matter).  
      - *Struggles With:* D4 (may ignore GERs below threshold), D6 (individual threshold ≠ societal safety), D7 (thresholds may conflate low P with low stakes).  
      - *Tension:* Arbitrary thresholds conflict with D3/D4.

  *   **Robust Evidentialist Rejection (e.g., require extraordinary evidence for extraordinary claims):**  
      - *Satisfies:* D1, D3, D5 (belief immune to stakes), D7 (rejects claim, not stakes), D8.  
      - *Struggles With:* D4 (may delay action on GERs awaiting evidence), D2 (evidence assessment is costly), D6 (social costs of skepticism).  
      - *Tension:* Strict evidence thresholds may be too slow/inflexible for GERs (D4).

  *   **Pragmatic Decision Theory (e.g., bounded utility, weighted stakes-probability):**  
      - *Satisfies:* D2, D4 (acts on GERs), D6 (can model collective costs), D7.  
      - *Struggles With:* D1 (unless utilities are bounded, violating intuition), D3 (if utilities distort beliefs), D5 (pragmatism contaminates belief), D8 (priors may be overridden).  
      - *Tension:* Bounding utilities avoids PM but may underrespond to unprecedented GERs (D4).

  ---

  ### **Summary**
  An adequate theory **must** satisfy non-negotiable constraints (D1, D2, D3, D7, D8) to be coherent and practically viable. The core challenge lies in reconciling **Non-Manipulability** (D1) with **GER Responsiveness** (D4) under **Probabilistic Consistency** (D3), which necessitates auxiliary mechanisms for source/evidence discrimination. Distributed Epistemic Mugging (DEM) intensifies this by adding **Resource Costs** (D2), **Collective Dynamics** (D6), and **Evidential Noise** (D8), making the problem not merely quantitative but structural. The impossibility result highlights that no "pure" probability/stakes calculus resolves this; **epistemology must integrate social, evidentiary, and decision-theoretic filters** to navigate mugging landscapes rationally.
