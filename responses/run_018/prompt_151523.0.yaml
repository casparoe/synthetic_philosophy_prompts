answer: |-
  This asymmetry is a profound and well-observed phenomenon in moral psychology, though it lacks a single universally accepted name. It highlights a critical tension within Strawson's framework and compatibilist theories of responsibility. Here's a conceptual mapping:

  ### 1. **Core Phenomenon: The Rationality-Blaming Asymmetry**
     - **What it is**: A selective pattern where:
       - **Mechanistic explanations** (neurological, traumatic, pharmacological) trigger the *objective attitude*, suspending blame/resentment.
       - **Agential-rational explanations** (strategic calculation, ideological commitment) trigger/intensify *reactive attitudes* (blame, resentment), even when both explanations are equally deterministic.
     - **Key Feature**: The asymmetry persists despite identical determinism and lack of *immediate* control. Blame is heightened precisely when the agent appears *more* rational and goal-directed.

  ### 2. **Established Labels & Related Concepts**
     - **No Dedicated Term**: No single term captures this *exact* asymmetry, but it intersects with several named concepts:
       - **Agency Detection Bias** (or **Hyper-Agency Attribution**): Our cognitive tendency to over-attribute events to intentional agents (even when non-agential causes exist). Here, it manifests as *blame amplification* upon detecting rational agency.
       - **Moral Typecasting** (Gray & Wegner): People cognitively cast others as *either* moral agents (blameable) *or* moral patients (pitiable). Rational explanations enforce "agent" typecasting, mechanistic ones enforce "patient" typecasting.
       - **Epistemic Condition for Responsibility**: Blame intensifies when the agent *knew* what they were doing (part of rational explanations). Ignorance/lack of control (implied in mechanistic explanations) excuses.
       - **Side-Effect Effect** ("Knobe Effect"): People more readily judge harmful *side-effects* of intentional actions as intentional. Your asymmetry shows a similar pattern: harmful outcomes *explained by rational action* are seen as more blameworthy.
       - **Fundamental Attribution Error (FAE) Variant**: FAE involves over-attributing behavior to character vs. situation. This asymmetry is a *moralized, responsibility-specific* FAE: agential causes are over-attributed as blame-grounding, while mechanistic causes are over-accepted as exculpatory.

  ### 3. **What It Is Not**
     - **Not General Strawsonian Distinction**: Strawson links the objective attitude to excusing conditions (e.g., insanity). This asymmetry shows *which conditions we accept as excusing* is biased: mechanistic causes excuse, rational ones don’t—*even when both are equally constraining*.
     - **Not Incompatibilism**: The asymmetry persists among compatibilists who *accept* determinism. It reveals a *bias within compatibilist practices*, not a covert incompatibilist commitment.
     - **Not Just Outcome Severity**: The same harmful action triggers divergent responses based *only* on the causal framing.

  ### 4. **Combined Explanations (Rational Exploitation of Vulnerability)**
     - **The Asymmetry Holds, But Nuanced**: 
       - **Example**: An agent coldly exploits a trauma-induced vulnerability (e.g., a manipulator targeting someone with PTSD).
       - **Listener Response**: Blame typically *remains high* or intensifies. The rational, strategic component ("exploitation") dominates the narrative, overshadowing the mechanistic cause (the target's trauma). The agent's rationality is seen as the *proximate cause* of harm, making the mechanistic background irrelevant to *their* blameworthiness.
       - **Why?**: The rational action appears as a "choice point" where agency intervenes. Listeners treat the vulnerability as a *context* the agent *chose* to exploit, affirming core agency.

  ### 5. **Why This Happens: Unacknowledged Commitments**
     - **The "Rational Agent = Moral Agent" Heuristic**: We implicitly tie moral responsibility to the *capacity for instrumental rationality*. If an agent acts for reasons (even bad ones), we treat them as a valid target of moral address.
     - **Control vs. Reason-Responsiveness**: Mechanistic explanations suggest compromised *control*. Rational explanations affirm *reason-responsiveness*—the core of many compatibilist theories (Fischer & Ravizza). Listeners instinctively punish reason-responsive wrongdoers to uphold norms.
     - **Threat to Moral Order**: Calculated harm feels like a *challenge* to shared norms, demanding retributive reinforcement. Mechanistic harm feels like a *misfortune*, demanding management.
     - **Latent Non-Compatibilism?**: Despite accepting determinism abstractly, listeners may intuit that *rational agency* implies a stronger form of control (e.g., "could have done otherwise") absent in mechanistic cases.

  ### 6. **Precise Delimitation: Key Boundaries**
     - **Trigger**: The *causal framing* of the action (mechanistic vs. agential-rational), not the action's nature.
     - **Persistence Condition**: Both explanations must be presented as *deterministic and complete*.
     - **Exclusion**: Cases where the agential explanation implies *ignorance* (e.g., "they thought it was morally right") may mitigate blame, distinguishing it from purely strategic explanations.
     - **Scope**: Applies to *harmful actions*; positive actions may show reverse asymmetry (e.g., mechanistic "good" deeds praised less).

  ### Conclusion: Naming the Phenomenon
  While no universal label exists, the most precise descriptors are:
  - **Rationality-Blaming Asymmetry** (emphasizes the core trigger)
  - **Agency/Mechanism Excuse Bias** (highlights the selective excusing condition)
  - **Strawsonian Responsibility Attribution Bias** (locates it within the framework)

  This asymmetry reveals an unacknowledged commitment in our reactive practices: **We hold people responsible not merely for causing harm, but for *endorsing* harm through rational calculation.** It suggests that compatibilist theories must grapple not just with the *logic* of responsibility, but with the *psychological primacy* of rationality in triggering blame—even when determinism renders both the rational calculator and the mechanistic system equally unfree in an ultimate sense. This bias may underpin societal responses to corporate crime (seen as calculated) vs. addiction (seen as mechanistic), with profound implications for law and social justice.
