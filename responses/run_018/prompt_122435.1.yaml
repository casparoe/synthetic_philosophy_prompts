  ## Meridian Global Mobility — Norms Onboarding Protocol, v4.2
  **Effective Date:** 2023-10-27 | **Owner:** Global Mobility & Localization (GML) Compliance

  **1. Purpose & Scope**
  This document defines the operational framework for identifying, adhering to, and escalating deviations from Local Coordination Norms (LCNs) during temporary assignment (≤ 364 days). LCNs constitute binding protocols essential for maintaining societal coordination efficiency (SCE) and minimizing friction costs within host environments. This protocol supersedes v4.1 and applies to all Meridian Global Associates (MGAs) on Tier 1-3 Mobility Packages. **Note:** Permanent relocation (>364 days) triggers Full Cultural Integration (FCI) protocols (see REF: GML-FCI-7.1).

  **2. Definitions**
  *   **LCN (Local Coordination Norm):** A widely adopted, mutually beneficial behavioral pattern solving recurrent coordination problems within a specific geographic/cultural zone (e.g., queue formation protocols, gratuity distribution matrices, pedestrian traffic flow rules). Distinct from statute but operationally binding under Meridian Ethics Policy §4.3 ("Harmonized Operations").
  *   **Convention Debt (CD):** The quantifiable burden imposed on the local coordination system by an MGA's deviation from an LCN. Measured in Norm Restoration Units (NRUs). CD accrues when an action necessitates compensatory effort from locals to restore equilibrium (e.g., queue reformation, gratuity normalization, traffic recalibration).
  *   **Deviation Coefficient (DC):** GML-calculated metric (Scale 1-10) rating the gap between an LCN's current state and the theoretically optimal coordination solution (OCS) for that domain. DC ≥ 7 triggers Protocol 5.3 (Permissible Strategic Deviation).
  *   **Local Integration Quotient (LIQ):** Calculated metric determining obligation tier for MGAs in ambiguous duration statuses (e.g., extended workation, perpetual rotation). Factors include days present (DP), local economic dependency (LED), and norm participation frequency (NPF). LIQ ≥ 0.8 mandates Tier 2 (Partial Local) obligations.
  *   **SCE (Societal Coordination Efficiency):** The target state optimized by adherence to LCNs. SCE degradation is a reportable incident (Severity P2-P3).

  **3. Severity Ladder for LCN Deviation**
  *   **P0 (Critical):** Deviation causing immediate physical risk or systemic SCE collapse (e.g., contra-flow jaywalking during peak traffic surge).
  *   **P1 (High):** Deviation causing significant CD accrual (>100 NRUs), public altercation, or reputational damage to Meridian Brand Integrity (MBI).
  *   **P2 (Medium):** Deviation causing measurable CD accrual (10-100 NRUs) or localized SCE friction (e.g., queue-jumping causing >2min delay cascade).
  *   **P3 (Low):** Minor deviation causing negligible CD (<10 NRUs) or isolated confusion (e.g., suboptimal tip rounding). Still requires remediation.

  **4. Foundational Principles of LCN Adherence**
  Adherence is not discretionary etiquette but an operational and ethical imperative under the Meridian Global Compact. Key justifications:
  *   **4.1 Coordination Equilibrium:** LCNs represent stable solutions to complex coordination games (REF: Lewis-Thompson Equilibrium Model). Adherence preserves the Nash equilibrium. Deviation forces costly re-coordination.
  *   **4.2 Reliance & Fairness:** Locals invest ongoing effort to maintain LCNs. MGAs benefit from the resulting SCE without contributing to its maintenance cost ("Free-Rider Problem"). Deviation constitutes an unfair consumption of unearned coordination utility.
  *   **4.3 Expectation Management:** Locals reasonably expect MGAs to conform to observable behavioral patterns. Unsignaled deviation violates implicit reliance contracts, generating social transaction costs.
  *   **4.4 Harmonized Operations Principle (HOP):** "When in Rome" is axiomatic for minimizing friction and maximizing MGA integration velocity. Non-adherence introduces unnecessary operational noise.

  **5. Protocol: Identification, Adherence & Deviation**
  *   **5.1 LCN Identification:** MGAs must complete the GML-APP: NormScout module within 72hrs of arrival. NormScout geo-tags and catalogs high-priority LCNs (Tipping Matrix, Queue Protocol, Pedestrian Flow Rules) with real-time DC scores. **Example Output:** "Location: NYC, USA. LCN-047: Restaurant Gratuity. Standard: 18-22%. DC: 4.2 (Suboptimal OCS: Service-Inclusive Pricing). Obligation: Binding."
  *   **5.2 Standard Adherence:** MGAs must comply with all LCNs exhibiting DC < 7. Non-compliance accrues CD.
  *   **5.3 Permissible Strategic Deviation (PSD):** Applies ONLY to LCNs with DC ≥ 7 (Substantially Suboptimal Equilibrium). MGAs *must* deviate to signal dysfunction and promote OCS adoption. Pre-deviation signaling via approved methods (e.g., "I am applying DC-Triggered PSD to LCN-047 by tipping 15% to highlight equilibrium fragility") is mandatory to minimize confusion. **Example:** US Tipping (DC 4.2) requires adherence. A hypothetical LCN scoring DC 7.5 (e.g., overly complex multi-queue system) mandates deviation towards a simpler observed pattern.
  *   **5.4 Convention Debt (CD) Settlement:** Accrued CD must be remediated. Primary method: Strict adherence to *all* other LCNs for 2x the deviation duration. Secondary method (if primary is infeasible): Contribution to the Local Norms Stabilization Fund (LNSF) via GML portal (1 NRU = $0.50 USD equivalent). **Note:** CD cannot be discharged by departure; it persists until settled.

  **6. Special Case: Pedestrian Flow Norms (e.g., "Jaywalking")**
  *   **6.1 Classification Challenge:** Pedestrian flow rules often exist at the LCN-Statute interface. GML treats all observable, widely adhered-to pedestrian coordination patterns as binding LCNs, regardless of legal status. SCE preservation is paramount.
  *   **6.2 Protocol:** Adhere to the locally dominant pedestrian flow pattern. Cross only at designated points if that is the norm OR if traffic density creates P0 risk. Spontaneous diagonal crossing in low-density, high-local-jaywalking zones (e.g., Manhattan cross-town) is permissible *only* if it maintains flow equilibrium with locals. Isolated deviation creating vehicle braking or pedestrian hesitation accrues CD (P2).

  **7. Obligation Duration & The Visitor Category**
  *   **7.1 Core Definition:** A "Visitor" (Tier 1 Obligation: Full LCN Adherence) is defined by LIQ < 0.8.
  *   **7.2 LIQ Calculation:**
      *   LIQ = (DP/365 * 0.4) + (LED * 0.3) + (NPF * 0.3)
      *   **DP (Days Present):** Consecutive or rolling 12-month days in location.
      *   **LED (Local Economic Dependency):** % of essential services/goods sourced locally (≥80% = 1.0, ≤20% = 0.0).
      *   **NPF (Norm Participation Frequency):** % of observable LCN opportunities engaged with correctly (Tracked via NormScout ver. 2.1+).
  *   **7.3 Ambiguous Cases:** MGAs with DP > 90 but LIQ < 0.8 remain Visitors. MGAs with LIQ ≥ 0.8 transition to Partial Local status (Tier 2 Obligation: Adherence + Equilibrium Maintenance Duty). **Note:** Frequent participation in an LCN (high NPF) directly increases LIQ, reinforcing the obligation to maintain that same LCN. Escalation required for LIQ 0.75-0.85 (GML-Ticket: CAT-7 "Threshold Ambiguity").

  **8. Escalation Path**
  1.  **Self-Remediation:** Apply Protocol 5.4 (CD Settlement).
  2.  **Peer Flag:** Report observed MGA deviation via GML-APP: NormWatch (Anonymous flagging enabled).
  3.  **GML Review:** File ticket: CAT-5 "LCN Deviation - Suspected P1/P2". Provide NormScout logs.
  4.  **Norms Governance Council (NGC):** Escalation for DC disputes, LIQ appeals, or systemic LCN failure (CAT-5 tickets unresolved >7 days). NGC Ruling is final.
  5.  **Ethics Committee:** For gross/repeated violations potentially violating Meridian Global Compact §4.3 (Harmonized Operations).

  **Appendix A: Common LCN Examples & DC Scores (Partial)**
  *   LCN-047: Restaurant Gratuity (USA): 18-22%. DC: 4.2
  *   LCN-112: Linear Queue Formation (UK): Strict FIFO. DC: 2.1
  *   LCN-089: Spontaneous Queue Merging (Informal, Global): Context-dependent merging tolerance. DC: 5.8 (High variability)
  *   LCN-201: Pedestrian Crossing Adherence (Zurich, CH): Strict crosswalk use. DC: 1.8
  *   LCN-202: Adaptive Pedestrian Flow (Ho Chi Minh City, VN): Fluid group crossing. DC: 3.5 (Optimal for context)

  **Appendix B: Convention Debt (CD) NRU Calculation Table (Abridged)**
  | Deviation                     | Base NRU | Multiplier (Context) | Example (NYC Tip 15% on $100) |
  | :---------------------------- | :------- | :------------------- | :----------------------------- |
  | Undertip (≥5% below Std)      | 25       | Bill Amt / 50        | 25 * ($100/50) = 50 NRU        |
  | Overtip (≥5% above Std)       | 10       | Bill Amt / 100       | 10 * ($100/100) = 10 NRU       |
  | Queue-Jumping (1 position)    | 15/person| Density Factor (1-3) | 15 * 1 (Low) = 15 NRU          |
  | Non-Adaptive Jaywalk (P2)     | 30       | Traffic Density (1-3)| 30 * 2 (Med) = 60 NRU          |

  ---
  **Executor's Note: Philosophical Fidelity Assessment**

  **Confidence Level:** 85%. The core arguments (coordination equilibrium, reliance/expectation, free-riding, the inherent logic of "when in Rome") are presented in forms recognizable to scholars familiar with David Lewis's convention theory, Hart's "practice theory" of rules, and the fairness/free-rider debates. The satire leans into the *application* of these arguments with bureaucratic literalism.

  **Least Confident Move:** The **Deviation Coefficient (DC)** operationalizing "bad equilibria." Philosophically, assessing a convention's distance from a "theoretically optimal coordination solution" is fraught. Who defines optimal? By what metric? The satire requires this metric to exist and be measurable (like code coverage), but real philosophy heavily debates whether a suboptimal convention *loses* its obligating force, or if stability itself holds independent value. I leaned on a contested consequentialist reading (stability is good *because* it enables coordination, so if it's *bad* coordination, the obligation weakens) because it generates the concrete, unstable threshold the user requested for the joke. A deontologist (focusing on the duty arising from participation itself) would likely reject the DC concept entirely.

  **Knowingly Contested Reading:** The **Local Integration Quotient (LIQ) circularity.** The document presents high Norm Participation Frequency (NPF) as *increasing* the obligation (by raising LIQ), which is circular: you become obligated *because* you participate, and you participate *because* you're obligated. Philosophically, this sidesteps the core question of *why* the initial participation creates an obligation for the newcomer. The circularity is intentional satire – it mimics how bureaucracies often operationalize fuzzy concepts with metrics that presuppose the very thing they're measuring, and the document's failure to notice this is part of the joke. A strict consent-based theorist would reject this entirely; a practice theorist might see it as a rough proxy for "voluntary acceptance" through repeated action, which *is* a contested but extant position.
