answer: |-
  **MEMORANDUM**  
  **TO:** All Clinical Staff, Ethics Committee Members, Resource Allocation Personnel  
  **FROM:** Institutional Review Board for Applied Moral Ontology (IRB-AMO)  
  **SUBJECT:** Policy 7.09G: Operationalization of the Harm Causation Distinction (HCD) in Clinical Practice  
  **DATE:** October 26, 2023  
  **REF:** Clinical Ethics Oversight Manual, Vol. IV, Ch. 12: "Commission, Omission, and Accreditation Metrics"

  1.  **PURPOSE:** To establish standardized procedures for categorizing, logging, and auditing physician actions/non-actions under the Harm Causation Distinction (HCD), ensuring adherence to the fundamental moral principle that *actively causing harm* (Intervention/Commission) is categorically distinct from, and subject to stricter scrutiny than, *merely allowing harm to occur* (Non-Action/Omission). This policy operationalizes the HCD through mandatory documentation and performance metrics essential for ethical accreditation (Standard EA-114.7b).

  2.  **SCOPE:** Applies to all patient interactions, treatment decisions, resource allocation deliberations, and device management within St. Hypocratic General Hospital (SHGH). Includes conscious acts, unconscious bodily movements proximate to patient care, and decisions *not* to act.

  3.  **DEFINITIONS:**
      *   **3.1 Intervention (Commission):** Any physical movement by a physician/staff member that alters the patient's physical state or environment, *and* is causally linked to a subsequent negative outcome for the patient. (e.g., Administering a lethal drug, *physically* disconnecting a ventilator).
      *   **3.2 Non-Action (Omission):** The absence of a physical movement by a physician/staff member where such movement was possible, *and* this absence is causally linked to a subsequent negative outcome for the patient. (e.g., Not initiating CPR, not prescribing available antibiotics).
      *   **3.3 Moral Causation Ledger (MCL):** The real-time, mandatory digital log within the EHR (Epic-HCD Module) where *every* staff action or deliberate inaction must be categorized as either an **Intervention (I)** or **Non-Action (N/A)** immediately following its occurrence/perception. *Rationale must be entered per Appendix 7.09G-A.*
      *   **3.4 Intervention-Omission Ratio (IOR):** The quarterly aggregate metric calculated as (Total Logged I Events) / (Total Logged N/A Events). Departmental IORs must be maintained within the Accreditation Compliance Range (ACR) of **0.8 - 1.2**. Deviations trigger mandatory Ethics Review and possible probation (See Policy 8.02: IOR Compliance & Remediation).

  4.  **PROCEDURES:**
      *   **4.1 MCL Logging:** Staff must log *every* action or conscious non-action immediately. Examples:
          *   *Action:* Drawing blood (I - Physical intrusion). *Non-Action:* Observing falling O2 sat without initiating oxygen (N/A - Failure to act).
          *   *Action:* Pressing "silence" on a ventilator alarm (See FAQ 3.1).
          *   *Non-Action:* Choosing not to page the on-call specialist for a deteriorating patient (N/A - Omission of escalation).
      *   **4.2 IOR Monitoring:** The IRB-AMO Compliance Unit generates departmental IOR reports quarterly. IOR < 0.8 indicates excessive passivity ("Omission Creep"); IOR > 1.2 indicates excessive intrusiveness ("Commission Bias"). Root-cause analyses are mandatory for outliers.
      *   **4.3 Edge Case Protocols:** Specific categorization rules apply:
          *   **4.3.1 Device Interaction:** Silencing an alarm is an **Intervention (I)** directed *at the device* (physical button press). The *patient outcome* resulting from the silenced alarm is categorized *separately* as a potential N/A (failure to respond to the *information* the alarm provided). *Log both events.*
          *   **4.3.2 Withdrawal of Sustenance:** Physically removing an *active* feeding tube is an **Intervention (I)**. Deactivating the pump supplying an *already inserted* tube is a **Non-Action (N/A)** (cessation of active support). Discontinuing *future* tube placement is a **Non-Action (N/A)**. *Log only the specific act/non-act performed.*
          *   **4.3.3 Resource Allocation:** A committee's decision *not* to allocate a scarce resource (bed, ventilator, drug) to Patient A is a **Non-Action (N/A)** for Patient A. The subsequent allocation of that resource to Patient B is an **Intervention (I)** for Patient B. *The N/A for Patient A and the I for Patient B are distinct ledger entries.*

  5.  **COMPLIANCE:** Failure to log actions/non-actions in the MCL constitutes an ethical documentation violation (Category ED-3). Persistent IOR deviation jeopardizes SHGH's Level IV Ethical Accreditation. Compliance is audited quarterly by the IRB-AMO.

  6.  **TRAINING:** Mandatory annual HCD Operationalization Training (Module ETH-707) covers MCL logging, IOR interpretation, and Edge Case Protocols. New staff must complete training within 30 days of hire.

  **ATTACHMENT A: Frequently Asked Questions (Policy 7.09G)**

  *   **FAQ 1.1: Does simply walking past a room where a patient is unnoticedly choking count?**
      *   *Answer:* Only if the staff member *consciously perceived* the choking and *chose* not to act. If perception did not occur, no N/A is logged. Conscious perception *requires* MCL entry as N/A (Omission to render aid). Intentional avoidance of the room to prevent perception is an **Intervention (I)** (Act of evasion).

  *   **FAQ 2.1: How is "pulling the plug" scored?**
      *   *Answer:* Physically grasping and removing a ventilator plug from the wall socket is an **Intervention (I)**. Using a software command to deactivate the ventilator is a **Non-Action (N/A)** (Cessation of active support command). Turning off the power at the room's circuit breaker is an **Intervention (I)** (Act on environment). *The moral distinction is preserved in the categorization method.*

  *   **FAQ 3.1: Clarify silencing an alarm (Policy 4.3.1). Why two entries?**
      *   *Answer:* The HCD demands precision. Silencing the alarm (button press) is an *act* (**I**) affecting the *device*. The *consequence* of that act – the staff member's subsequent failure to respond to the *now-silent* alarm's *intended message* regarding the patient – is a distinct failure to act (**N/A**) concerning the *patient's condition*. The MCL captures both the physical act and the subsequent omission of care it may facilitate. Logging both ensures the IOR accurately reflects the complex moral topology.

  *   **FAQ 4.1: Does the Resource Committee N/A for Patient A (FAQ 4.3.3) actively *cause* Patient A's death?**
      *   *Answer:* No. The committee's decision is a **Non-Action (N/A)** – an omission to provide a resource. Patient A's death is caused by their underlying disease process, *allowed* by the omission. The subsequent allocation (**I**) to Patient B is a separate, positive act. The HCD cleanly separates the moral valence of denying resource A (N/A) from granting resource B (I). The committee's overall IOR reflects the balance of these acts and omissions across all patients.

  *   **FAQ 5.1: What if multiple staff witness an event requiring action but all assume someone else will act?**
      *   *Answer:* Each staff member capable of acting, who consciously perceives the need and consciously chooses *not* to be the one to act, must log an individual **Non-Action (N/A)**. The MCL aggregates these, providing vital data on "Diffused Omission Syndrome" for quality improvement. The act of *assuming* someone else will act is an internal cognitive event; only the conscious decision *not* to act oneself is logged as N/A.

  *   **FAQ 6.1: How does this relate to patient autonomy/refusals?**
      *   *Answer:* Honoring a competent patient's refusal of treatment is categorized as a **Non-Action (N/A)** (Omission of forced treatment). The *cause* of the subsequent outcome is the patient's disease, *allowed* by the respect for autonomy. The distinct moral permissibility of this N/A is addressed in Policy 7.10A: "Beneficence vs. Autonomy Ledger Weights." The MCL entry remains N/A.
