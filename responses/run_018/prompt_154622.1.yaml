answer: |-
  ### Exam Question (90-minute essay)  
  **Scenario:** The Global Climate Dynamics Consortium (GCDC) publishes a peer-reviewed statement asserting that arctic methane-release feedback loops will accelerate global warming by 1.5°C by 2040. This conclusion integrates atmospheric chemistry, permafrost modeling, and oceanic current projections. No single GCDC scientist comprehends all sub-models in detail; epistemic authority is distributed across the consortium.  

  **Prompt:**  
  Does the GCDC’s assertion satisfy the *knowledge norm of assertion* (one must know *p* to assert *p*)? If not, can the *belief norm* (one must believe *p* to assert *p*) avoid collapsing into irrelevance by permitting *partial credence*? Finally, does a *modified truth norm* (e.g., "assert only what is sufficiently justified for the context") offer a superior account of distributed assertions like the GCDC’s? Defend your position using conceptual analysis of epistemic responsibility, group agency, and the norms’ resilience to distributed cognition.  

  ---

  ### Model Answer (550 words)  

  The GCDC case exposes fundamental tensions in assertion norms when epistemic labor is distributed. I argue the knowledge norm *cannot* be satisfied collectively, the belief norm survives only by embracing partial credence (at significant cost), and a modified truth norm offers the most plausible framework.  

  **1. Collective Failure of the Knowledge Norm**  
  The knowledge norm requires the asserter to *know* *p*. Knowledge entails individual grasp of justification, but GCDC’s assertion relies on *deferential expertise*: a permafrost modeler trusts atmospheric data they cannot verify. No single scientist "knows" the conclusion because justification is fragmented across specialists. One might argue the *group* knows *p*, but assertion norms traditionally address *speakers*. Redefining "knower" as a collective entity stretches the norm beyond recognition, as groups lack unified cognitive states. The knowledge norm thus fails—it demands individual epistemic ownership incompatible with distributed science.  

  **2. Belief Norm’s Dependence on Partial Credence**  
  The belief norm appears more flexible, requiring only that the asserter *believes* *p*. However, GCDC scientists may hold only *partial* belief in the full conclusion. A chemist might assign high credence to methane projections but lower credence to oceanic impact models. If "belief" requires categorical endorsement, the norm collapses—no individual believes the *entire* claim sufficiently. Salvaging the norm requires accepting *graded credence* as sufficient for assertion. This avoids collapse but erodes the norm’s force: if partial belief justifies assertion, the norm cannot distinguish responsible assertions from speculative ones. It becomes a weak psychological descriptor rather than a robust normative guide.  

  **3. Superiority of a Modified Truth Norm**  
  A *modified truth norm* (MTN)—e.g., "assert *p* only if *p* is sufficiently justified for the context"—better accommodates distributed assertion. Unlike the knowledge norm, MTN doesn’t demand individual grasp of all justifiers; unlike the belief norm, it foregrounds public evidence over private psychology. For GCDC, "sufficient justification" is met through peer-reviewed integration of sub-models, even if no member grasps the whole. The MTN shifts focus to *procedural reliability*: the consortium’s rigorous methods generate assertions warranting public trust, regardless of individual credences. Epistemic responsibility lies in the *structure* of justification (e.g., error-checking protocols) rather than in any single mind. This avoids the group-agency problem: the norm binds the *act* of asserting, not a nebulous "group mind."  

  **Conclusion**  
  The knowledge norm is too individualistic for distributed cognition. The belief norm survives only by diluting belief into partial credence, sacrificing normative bite. The MTN triumphs by tethering warrant to contextually adequate justification—aligning with science’s actual reliance on institutional rigor over individual omniscience.  

  ---

  ### Marking Scheme (Total: 20 marks)  

  | **Analytical Move** | **Marks** | **Common Candidate Misses** |  
  |---------------------|-----------|----------------------------|  
  | **1. Diagnose why the knowledge norm fails** for GCDC, emphasizing *fragmented justification* and the *individualist* structure of knowledge. | 4 | Superficially claiming "groups can’t know" without analyzing *why* knowledge requires unified justification. |  
  | **2. Explain how the belief norm avoids collapse *only* by accepting partial credence**, and critique the resulting weakness (e.g., norm becomes descriptive). | 4 | Conflating partial belief with agnosticism, or asserting that belief norm "just works" for groups without addressing credence. |  
  | **3. Articulate a modified truth norm** (e.g., sufficiently contextually justified) and show how GCDC satisfies it via *procedural reliability*. | 4 | Proposing an ad hoc "group truth norm" without modifying the norm’s core logic or addressing contextual thresholds. |  
  | **4. Contrast the MTN’s advantages** over knowledge/belief norms regarding *epistemic responsibility* (e.g., shifts focus to institutional safeguards). | 4 | Treating MTN as merely "easier" rather than *theoretically superior* for distributed justification. |  
  | **5. Overall coherence & conceptual precision**: Logical structure, avoidance of strawmanning norms, precise use of *credence/justification*. | 4 | Vagueness in defining norms (e.g., "truth norm" vs. "modified truth norm"), or tangents about climate denialism. |  

  ---

  **Rationale**: This prompt challenges students to *apply* norms to a frontier case (distributed assertion), forcing synthesis of epistemology, social ontology, and speech act theory. The marking scheme rewards granular analysis of each norm’s mechanics and penalizes superficial generalizations. The model answer demonstrates expected depth, balancing critique with constructive alternatives while adhering to strict conceptual argumentation.
