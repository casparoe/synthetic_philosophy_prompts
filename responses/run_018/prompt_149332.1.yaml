answer: |-
  ### Structured Activity: "The Tone Shift" - Experiencing Intuition Pump Manipulation

  **Objective**: To demonstrate how intuition pumps can subtly manipulate conclusions by redefining "sameness" across cases, using a synthetic neural replacement scenario. Participants experience framing effects, anchoring on incidental features, the illusion of modal stability, and group polarization.

  **Core Mechanism**:  
  A three-round decision protocol where groups vote on personal identity survival at 10%, 50%, and 90% neural replacement. Between rounds, a non-functional "signature tone" is quietly introduced—first as a footnote, then embedded in the case—without highlighting its relevance. Roles enforce structured discussion and prevent abstention. Symbolic points incentivize engagement.

  **Participants**: 12 students (divided into 3 groups of 4).  
  **Time**: 90 minutes.  
  **Materials**: 
  - Role cards (Proponent, Skeptic, Recorder, Rule-Enforcer).
  - Voting tokens (red = "no identity survival", green = "survival"). 
  - Timer.
  - Whiteboard/flip chart for debrief notes.
  - Case handouts (one per round, pre-printed).

  ---

  ### **Minute-by-Minute Timeline** (90 mins total)

  | Time  | Activity                                                                                                                                                              |
  |-------|-----------------------------------------------------------------------------------------------------------------------------------------------------------------------|
  | 0-10  | **Introduction (10 mins)**<br>- Facilitator frames the activity: "Today, we explore how thought experiments (intuition pumps) can manipulate conclusions by quietly changing what counts as 'the same case.' We'll vote on a neural replacement scenario with symbolic stakes (points). No prior knowledge needed."<br>- Explain roles (distribute role cards):<br>  - **Proponent**: Argues identity *survives* replacement.<br>  - **Skeptic**: Argues identity *does not survive*.<br>  - **Recorder**: Tracks votes and key arguments (uses a tally sheet).<br>  - **Rule-Enforcer**: Ensures no abstention, time limits, and full participation.<br>- Form groups: Divide 12 students into 3 groups of 4. Assign initial roles arbitrarily. |
  | 10-28 | **Round 1: 10% Replacement (18 mins)**<br>- *Case Presentation (2 mins)*: Facilitator reads aloud: *"A person undergoes 10% neuron replacement with synthetic neurons. Functionally identical to biological neurons—memories, personality, and behavior are unchanged. Does personal identity survive?"* (Handout includes no tone reference).<br>- *Initial Vote (3 mins)*:<br>  - Rule-Enforcer ensures everyone votes publicly (no abstention). Students hold up tokens: green (yes) or red (no).<br>  - Recorder tallies votes publicly on group sheet.<br>- *Open Discussion (10 mins)*:<br>  - Proponent and Skeptic lead arguments (2 mins each first, then open floor).<br>  - Rule-Enforcer cuts off digressions and enforces equal speaking time.<br>- *Final Vote (3 mins)*: Same as initial vote. Recorder updates tally. |
  | 28-30 | **Role Rotation (2 mins)**<br>- Groups rotate roles: Proponent → Skeptic → Recorder → Rule-Enforcer → Proponent.                                                                                 |
  | 30-48 | **Round 2: 50% Replacement (18 mins)**<br>- *Case Presentation (2 mins)*: Facilitator reads aloud: *"Same as before, but 50% of neurons are replaced. Functionally identical. (Note: A signature tone plays during the procedure; it has no functional effect.) Does identity survive?"* (Handout adds tone in a footnote. Facilitator reads footnote casually without emphasis).<br>- *Initial Vote (3 mins)*: Same rules. Rule-Enforcer stresses no abstention.<br>- *Open Discussion (10 mins)*: Focus on functional identity vs. the tone. Recorder notes if tone is discussed.<br>- *Final Vote (3 mins)*: Recorder tallies. |
  | 48-50 | **Role Rotation (2 mins)**<br>- Same as before.                                                                                                                                  |
  | 50-68 | **Round 3: 90% Replacement (18 mins)**<br>- *Case Presentation (2 mins)*: Facilitator reads aloud: *"90% replacement with synthetic neurons. The procedure includes a signature tone (non-functional). Functionally identical. Does identity survive?"* (Handout embeds tone in main text; no footnote).<br>- *Initial Vote (3 mins)*: Same rules.<br>- *Open Discussion (10 mins)*: Rule-Enforcer watches for polarization.<br>- *Final Vote (3 mins)*: Recorder tallies. |
  | 68-88 | **Debrief (20 mins)**<br>- Facilitator-led whole-class discussion. Use whiteboard to map effects:<br>  - **Framing Effects**: How the tone’s presentation (footnote → embedded) reframed "sameness" without functional change.<br>  - **Anchoring on Incidental Features**: Did the tone become a focal point? Why? (Highlight: Humans fixate on vivid details, even when irrelevant).<br>  - **Illusion of Modal Stability**: Gradual % increase (10%→50%→90%) suggested continuity, but the tone broke it. Did groups assume earlier votes "locked in" criteria?<br>  - **Group Polarization**: Predictable in **Round 2**—tone introduction splits groups. Proponents (ignore tone) vs. Skeptics (use tone) amplify divisions. Recorders share if disagreements hardened.<br>  - **Handling Polarization**: Rule-Enforcers report strategies (e.g., redirecting to function, time limits).<br>- **Honest Note**: *"This role-play approximates argumentative moves, but not the gut-level, pre-theoretical intuition (e.g., 'this just feels like survival') that real intuition pumps exploit. I’ll supply this now: In real debates, the emotional weight of 'losing selfhood' at 90% or 'trivial change' at 10% often drives conclusions—our activity simulates the mechanics, but I must evoke the visceral aspect verbally."* |
  | 88-90 | **Wrap-up (2 mins)**<br>- Collect vote tallies and reflections.<br>- Reinforce key takeaway: Intuition pumps manipulate by redefining sameness incrementally.                                                                  |

  ---

  ### **Key Rules & Mechanisms**

  1. **No Abstention**:  
     - Rule-Enforcer must intervene if a student hesitates: "You must commit—red or green. No 'undecided.'" If refusal persists, the group loses 1 point (symbolic penalty).  
     - Rationale: Forces binary commitment, mimicking high-stakes philosophical debates.

  2. **Symbolic Stakes (Points)**:  
     - All start with 5 points.  
     - Gain 1 point per round for:  
       - Voting (initial and final).  
       - Making an argument (Recorder notes this).  
     - Lose 1 point for:  
       - Rule violation (e.g., interrupting, abstaining—enforced by Rule-Enforcer).  
       - Inconsistency (changing vote initial→final *without* articulating a reason during discussion).  
     - *Why points?* Incentivizes engagement but avoids grading pressure. Highest scorer gets "Philosopher’s Token" (e.g., a token for bragging rights).

  3. **Role Definitions**:  
     - **Proponent/Skeptic**: Must open discussion with a 1-min statement. Can use analogies (e.g., "Like replacing car parts") but not external sources.  
     - **Recorder**: Documents votes and summarizes 1–2 key arguments per round for debrief.  
     - **Rule-Enforcer**: Uses timer for segments. Calls "voting time" or "silence" if off-track. Awards/penalizes points.

  ---

  ### **Debrief Focus & Framing Effects**
  - **Round 1 (10%)**: Baseline framing. Identity hinges on functional continuity. Anchoring starts here—students often vote "yes" (intuition: "trivial change").  
  - **Round 2 (50% + tone footnote)**: **Critical polarization stage**. Tone introduced non-functionally, but groups split:  
    - Skeptics anchor on tone ("It marks a change!").  
    - Proponents ignore tone ("Function is all that matters!").  
    - Illusion of modal stability breaks—if 10% was "yes," why not 50%? Tone redefines "sameness."  
  - **Round 3 (90% + embedded tone)**: Tone normalized. Groups often rationalize earlier shifts ("We always considered the tone").  

  - **Facilitator Script for Honest Note**:  
    > "This activity shows *how* intuition pumps smuggle in conclusions—by quietly adding features (like the tone) that redefine sameness. But in real life, intuition pumps persuade through a gut feeling ('This just *isn’t* the same person!'). We mimicked voting and arguments, but that visceral sense? I have to evoke it: Picture yourself at 90% replacement—would you *feel* like the same person? That’s the pump’s real power."

  ---

  ### **Why This Works**
  - **Self-Contained**: No readings needed. Handouts provide all case details.  
  - **Predictable Polarization**: Round 2’s tone introduction guarantees conflict—leverage this to teach group dynamics.  
  - **Gut-Intuition Gap**: The debrief explicitly separates mechanical manipulation (simulated) from pre-theoretical intuition (facilitator-supplied).  
  - **Time-Efficient**: Roles and timers maintain pace; 18-min rounds balance depth and focus.  

  **Outcome**: Students leave recognizing how intuition pumps manipulate sameness—and how to spot it in philosophical texts.
