  I should also consider how partial ectogenesis affects the violinist analogy. If the violinist could be transferred to another life-support system, does that change the original person's obligation? Thomson might say that until the transfer is complete, the right to disconnect remains. Similarly, during the period where the mother is still providing essential biological support, she can withdraw consent.

