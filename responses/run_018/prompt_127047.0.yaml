answer: |-
  Here's a practical 5-Step Identity Assessment Checklist for sculptural works, grounded in material constitution principles but stripped of philosophy jargon. It prioritizes **artist intent**, **essential properties**, and **material persistence thresholds**, with clear off-ramps for "Not Original" or "Judgment Call."

  ---

  ### **The Sculptural Identity Assessment Checklist**
  *(Run by Registrar + Conservator; 45-min max per work; Document all answers/evidence)*

  **STEP 1: ARTIST INTENT DOCUMENTED?**  
  *Question: Is there explicit, contemporaneous guidance (contract, interview, instructions) defining the work's essential materials/process?*  
  - **Pass:** Documented "core concept" exists (e.g., "must remain unfired," "organic decay part of the work").  
  - **Fail/Kill Claim:** Document directly contradicts current state (e.g., artist forbade firing, but it’s fired).  
  - **Judgment Call Flag:** Instructions vague/contradictory (e.g., "biologically connected" undefined).  
  - **Evidence Needed:** Contracts, artist statements, acquisition files, conservation records.  
  - *If Fail → Stop: "Not Original."*  
  - *If Judgment Call → Flag for Curator + Legal.*

  **STEP 2: MATERIAL PERSISTENCE THRESHOLD?**  
  *Question: Is ≥70% of the original material still present AND structurally integral?*  
  - **Pass:** Original material ≥70% intact (by volume/mass) AND critical load-bearing parts original.  
  - **Fail/Kill Claim:** Original material <30% OR key structural elements replaced (e.g., load-bearing armature gone).  
  - **Judgment Call Flag:** 30%–70% original material OR non-structural loss (e.g., surface veneer).  
  - **Evidence Needed:** Pre/post-conservation imaging, material analysis, condition reports.  
  - *If Fail → Stop: "Not Original."*  
  - *If Judgment Call → Proceed to Step 3.*

  **STEP 3: ESSENTIAL PROPERTY CHANGE?**  
  *Question: Did restoration alter a property critical to the work’s concept?*  
  *(Examples: unfired → fired; organic → synthetic; unstable → stable; site-specific → mobile)*  
  - **Pass:** No essential property changed (e.g., replaced wood with identical wood; repaired cracks invisibly).  
  - **Fail/Kill Claim:** Core property irreversibly altered (e.g., unfired clay → ceramic; ice → resin).  
  - **Judgment Call Flag:** Property change ambiguous (e.g., "biological connection" severed but material identical).  
  - **Evidence Needed:** Comparison of pre-damage vs. current state; artist writings on work’s essence.  
  - *If Fail → Stop: "Not Original."*  
  - *If Judgment Call → Proceed to Step 4.*

  **STEP 4: ARTIST/CREATOR VALIDATION?**  
  *Question: If artist/estate is consultable, do they affirm the work’s identity?*  
  - **Pass:** Artist/estate confirms identity (e.g., "This is still the work").  
  - **Fail/Kill Claim:** Artist/estate explicitly denies identity (e.g., "This is a copy").  
  - **Judgment Call Flag:** No artist/estate OR they’re ambiguous/conflicted.  
  - **Evidence Needed:** Email/recording of artist communication; estate guidelines.  
  - *If Fail → Stop: "Not Original."*  
  - *If Judgment Call → Proceed to Step 5.*

  **STEP 5: INSTITUTIONAL RISK ASSESSMENT**  
  *Question: Can we defend this as "original" to insurers, scholars, and the public without misrepresentation?*  
  - **Pass:** Consensus that identity claim is defensible (e.g., minor changes align with artist’s known practice).  
  - **Fail/Kill Claim:** High risk of legal/ethical challenge (e.g., artist publicly disavowed it).  
  - **Judgment Call Flag:** Disagreement among staff OR significant value/liability stakes.  
  - **Action:** *Always* escalate to Curator + Legal. Final call by Director/Board if contested.  
  - *If Fail → "Not Original."*  
  - *If Pass → "Original (with documented alterations)."*

  ---

  ### **Application to Your Cases**
  *(Assumes no prior documentation beyond given facts)*

  **CASE 1: 1978 Unfired Clay Figure (Fired After Repair)**  
  - **Step 1:** Artist dead, no instructions → *Judgment Call Flag* (proceed).  
  - **Step 2:** 100% original material present, but altered → *Judgment Call Flag* (proceed).  
  - **Step 3:** **FAIL** – Essential property changed (unfired → fired clay). Unfired state was core to its ephemeral concept.  
  - **Stop: NOT ORIGINAL.**  
    - *Practical Outcome:* Catalog as "Artist’s Original, Conservator-Fired Posthumously (202X)." Insurance value drops; display with disclaimer.

  **CASE 2: 1994 "Living Wood" Assemblage (40% Replaced)**  
  - **Step 1:** Contract says "biologically connected" → *Judgment Call Flag* ("connection" undefined → proceed).  
  - **Step 2:** 60% original material → *Judgment Call Flag* (proceed).  
  - **Step 3:** **FAIL** – "Biological connection" likely implies same tree/organism. Replacement wood = different tree → severed continuity.  
  - **Stop: NOT ORIGINAL.**  
    - *Practical Outcome:* Deaccession or label "Partial Reconstruction (202X) using Non-Original Materials." Estate may contest – involve legal.

  **CASE 3: 2010 Installation (Clay "Heart" Replaced with Polymer)**  
  - **Step 1:** Artist’s email: "Without the original heart, it’s just a copy" → **FAIL.**  
  - **Stop: NOT ORIGINAL.**  
    - *But you’ll likely override?* **Yes, and here’s why:**  
      - Steps 1–4 clearly kill the identity claim. *However*, Step 5 (Institutional Risk) will dominate:  
        - **Exhibition Pressure:** Only intact version; public expects it displayed.  
        - **Mitigation:** Label as "Reconstructed by Conservators (202X), Artist-Disavowed" + secure legal waiver.  
        - **Reality Check:** Museums often prioritize access over metaphysics. **But:** Insurers may deny claims, and artist could sue. If displayed as "original," you risk professional censure.

  ---

  ### **Key Judgment Call Hotspots (Where Disagreement is Expected)**
  1. **Step 1:** Interpreting vague artist language (e.g., "biologically connected").  
  2. **Step 2:** Quantifying material loss in complex assemblages (e.g., is paint part of the "material"?).  
  3. **Step 3:** Defining "essential property" for process-based works (e.g., is decay the *point* or a *flaw*?).  
  4. **Step 5:** Balancing ethics, access, and legal risk when artist/estate objects.

  ### **Operational Notes**
  - **Time Saver:** Start all assessments with a 10-min document review (files, contracts, past condition reports).  
  - **Override Protocol:** If overriding a "Not Original" verdict (e.g., Case 3), **require** Director + Legal sign-off and public disclosure.  
  - **Outputs:** Always generate a report with:  
    ```plaintext
    [ ] Original Work (as acquired)  
    [ ] Original Work with Documented Alterations  
    [ ] Reconstruction (Not Original)  
    [ ] Deaccession Recommended  
    ```

  This checklist forces explicit reasoning, minimizes metaphysics, and isolates liability risks. When philosophy "runs out" (Steps 1/3/5), it defaults to institutional accountability – which is ultimately what protects your collection.
