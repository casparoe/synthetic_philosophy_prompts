answer: |-
  ### Thought Experiment  
  At the University of Aethelstan’s digital archives unit, Senior Archivist Elara discovers that a metadata corruption she inadvertently introduced two years prior has silently misattributed 450 letters from a 19th-century feminist collection to an unrelated male diarist. Correcting it requires: (1) 32 unpaid hours over the Founders’ Day holiday weekend to rebuild the records; (2) filing an IR-9 disclosure form triggering a mandatory audit of her past projects; and (3) accepting likely reassignment to a lower-pay grade due to the audit’s expected findings of minor prior oversights. Leaving the error uncorrected would perpetuate the misattribution, but internal risk analysis shows a <2% chance of discovery given the collection’s low access frequency. The harm prevented—restoring accurate attribution to marginalized voices—is significant but diffuse, with no single claimant.  

  ### Account Verdicts & Reasoning  
  1.  **Cost-Proportionality Account (Obligatory):**  
      *Elara’s correction is obligatory.* Her *causal authorship* of the original error makes preventing the resulting harm her direct moral duty, irrespective of personal cost. The $4,200 salary forfeiture, career damage, and 32-hour sacrifice are irrelevant because she owes reparation for harms *she originated*. The harm prevented (450 misattributions) is fully attributable to her initial act; thus, bearing disproportionate cost to rectify it is non-negotiable. Supererogation would only arise if costs exceeded harms *not* of her making.  

  2.  **Role-Boundary Account (Supererogatory):**  
      *Correction is supererogatory.* Elara’s employment contract mandates error prevention *during* workflow execution and reporting *observed* issues—not retrospective self-auditing, self-incrimination, or unpaid labor. Institutional duties are defined prospectively; her role includes neither confessing past errors nor sacrificing holidays to fix them. Preventing the harm is socially valuable, but doing so by violating role boundaries (e.g., working unpaid, inviting punitive audits) exceeds her obligations. This constitutes moral heroism, not duty.  

  ### Divergence and Collapse  
  - **Structural Pivot: Causal Authorship**  
  The accounts diverge *solely* because Elara caused the error. The cost-proportionality account treats causal responsibility as creating a debt that must be repaid regardless of cost or role. The role-boundary account views duties as institutionally circumscribed, ignoring causal history.  
  - **Collapse to Agreement:**  
  If the corruption was caused by *Elara’s predecessor* (same harm, same correction cost), both accounts converge:  
    - *Cost-Proportionality:* Harm prevention is not attributable to Elara; her costs now exceed her "share" of responsibility. Correction becomes supererogatory.  
    - *Role-Boundary:* Fixing others’ errors beyond standard hours remains outside her role. Still supererogatory.  

  ### Defending the Counterintuitive Account  
  A **role-boundary defender** would attack the case on two fronts:  
  1.  **Institutional Absorption of Error:** The library’s quality-control systems (not the individual) bear ultimate responsibility for undetected errors. Elara’s role is to follow *current* protocols, not atone for past institutional failures.  
  2.  **Moral Hazard:** Casting retrospective corrections as obligatory risks exploiting conscientious staff. If causal authorship imposes limitless burdens, employees would hide errors, increasing net harm. Role-based limits prevent this.  

  ### Vulnerability and Mind-Changing Argument  
  - **What Could Change My View:** A demonstration that professional roles in archival ethics *implicitly* include **stewardship duties transcending contractual terms**—e.g., that archivists, as "custodians of truth," inherit non-delegable repair obligations for harms they cause, regardless of cost. If such a norm is codified in archival ethics codes (e.g., SAA’s "Core Values"), the role-boundary account fails by ignoring profession-specific moral expansion of institutional roles.  
  - **Weakest Reasoning Point:**  
  The **cost-proportionality verdict’s vulnerability** lies in its treatment of *disproportionality*. If Elara’s costs (career damage, $4.2K loss) objectively dwarf the harm (unaccessed misattributions unlikely to cause real-world consequences), framing repayment as "non-negotiable" appears morally excessive. This risks reducing supererogation to near-nonexistence in professional contexts—a counterintuitive outcome.  

  ---  
  This case isolates how *causal responsibility* morally amplifies duties beyond role constraints under cost-proportionality, while role-boundary theories quarantine obligations to institutional scripts. The archivist’s authorship transforms identical acts from heroic sacrifice into demanded reparation.
