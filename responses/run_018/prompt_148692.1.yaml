er. Keep it readable to someone unfamiliar with epistemology, but reward readers who know the literature. Aim for about 800 words, formatted with numbered sections and occasional sub-clauses in legalistic fine print. Do not include bibliographies, citations, reading lists, or references to specific scholars by name; rely only on the conceptual apparatus.
