answer: |-
  ### **Workshop Design: "Epistemic Fragmentation in Citizen Assemblies"**  
  **Time:** 90 minutes (Setup: 10 min, Game: 60 min, Debrief: 20 min)  
  **Participants:** 12 philosophy grad students  
  **Goal:** Experience epistemic fragmentation in a randomly assigned assembly, where hidden expertise and jargon barriers hinder collective decision-making.  

  ---

  ### **Materials**  
  1. **Domain Cards (12 unique cards):**  
     - Each card has a **domain name**, **secret jargon list** (5 terms), and a **brief description** of the domain’s relevance to the proposal.  
     - Example cards:  
       - **Urban Hydrology:** *Jargon:* Aquifer recharge, impervious surfaces, stormwater runoff, riparian buffer, hydraulic load. *Description:* Focuses on water systems in cities.  
       - **Indigenous Tenure Systems:** *Jargon:* Customary rights, sacred sites, FPIC (Free Prior Informed Consent), usufruct rights, territorial markers. *Description:* Examines land stewardship by Indigenous communities.  
       - **Climate Modeling:** *Jargon:* Radiative forcing, albedo effect, carbon sink, hysteresis, RCP (Representative Concentration Pathway). *Description:* Predicts long-term environmental impacts.  
       *(Other domains: Supply-chain logistics, Behavioral economics, Bioethics, etc.)*  

  2. **Translation Tokens:**  
     - 36 tokens (e.g., cut paper squares)—3 tokens per player.  

  3. **Development Proposal:**  
     - A 1-paragraph controversial proposal, e.g.:  
       > *"Build a dam on River A to boost renewable energy. Benefits: Clean power for 50k homes. Risks: Floods sacred Indigenous sites, disrupts local hydrology, and alters microclimates."*  

  4. **Voting Order Slips:**  
     - 12 slips numbered 1–12 in a container.  

  5. **Voting Board:**  
     - A whiteboard with columns: **Round 1** | **Round 2** | **Round 3** | **Final Vote**.  

  ---

  ### **Rules of the Game**  
  #### **Setup (10 min)**  
  1. Randomly assign each student a **domain card** and **3 tokens**. Cards are hidden—players cannot reveal them.  
  2. Project/read the development proposal. No additional context is given.  
  3. Announce: *"Your assembly must approve or reject this proposal. You have 3 rounds of debate (15 min each), then a final vote. In debate, you may only speak using jargon from your card unless you spend a token to ‘translate’ into plain language."*  

  #### **Gameplay (60 min; 3 rounds × 15 min + 15 min final vote)**  
  1. **Each Round (15 min):**  
     - **Step 1: Randomize speaking order** - Draw numbered slips to order speakers.  
     - **Step 2: Structured debate (12 min):**  
       - Players speak in the randomized order. Each gets **60 seconds** per turn.  
       - **Jargon rule:** When speaking, players **must use ≥1 jargon term** from their card.  
       - **Translation tokens:** To speak plainly (no jargon), a player must spend 1 token *before* speaking. Tokens are scarce (only 3/player total).  
       - **Moderator (you) enforces rules:** Interrupt if jargon isn’t used or tokens are missing.  
     - **Step 3: Vote (3 min):**  
       - Re-randomize voting order via slips.  
       - Players vote publicly **"Approve"** or **"Reject"** in the new order. Record votes on the board.  
       - *No majority threshold yet—votes are for pressure-testing ideas.*  

  2. **Final Vote (15 min):**  
     - Open debate (no speaking order/jargon rules).  
     - Final vote via secret ballot (simple majority wins).  

  ---

  ### **Predictable Failure Modes (First Run)**  
  1. **Coordination collapse:** Players drown in jargon early ("aquifer recharge" vs "customary rights"), leading to disjointed arguments.  
  2. **Token hoarding:** Players underuse tokens early, then run out during critical debates.  
  3. **Bandwagon voting:** Later voters in randomized orders copy early voters to "fit in."  
  4. **Silenced minorities:** Players with niche domains (e.g., "sacred sites") can’t communicate urgency without tokens.  
  5. **Fragmented consensus:** Votes swing wildly between rounds as misunderstandings persist.  

  ---

  ### **Debrief (20 min)**  
  **Guiding Questions:**  
  1. *"What frustrated you? Did jargon help or hinder?"*  
     → Surface: Jargon created tribal boundaries—players felt "locked in" their domains.  
  2. *"How did token scarcity affect strategy?"*  
     → Highlight: Tokens forced trade-offs between clarity/participation, mirroring real-world deliberation costs.  
  3. *"Did voting order matter? Why?"*  
     → Link: Random order advantaged early speakers (anchoring bias), a lottocracy critique.  

  **Mapping to Real Critiques of Sortition:**  
  - **Epistemic injustice:** Random bodies fragment knowledge; marginalized perspectives (e.g., Indigenous jargon) get "lost in translation."  
  - **Scalability:** Deliberation costs rise with group size—token scarcity mirrors how real assemblies need facilitators/translators.  
  - **Tyranny of structurelessness:** Without agenda-setting, random voting orders amplify loud voices.  
  - **False equivalence:** Jargon masked power imbalances (e.g., "radiative forcing" treated as equal to "sacred sites").  

  **What the Game Can’t Capture (Honest Note):**  
  - **Real assemblies learn:** Participants receive training/expert briefings—unlike this game’s "instant expert" setup.  
  - **Social trust:** Real deliberation builds rapport over weeks/months; this game’s fragmentation is exaggerated.  
  - **Facilitation matters:** Real assemblies use neutral moderators to bridge gaps—unlike the token "hack."  

  ---

  ### **Instructor Notes**  
  - **Lean into chaos:** Let students flail in Round 1—no rescues! Their frustration *is* the lesson.  
  - **Emphasize randomness:** Re-draw orders visibly to stress lottocracy’s unpredictability.  
  - **Adapt on the fly:** If consensus forms too easily, add a "crisis" (e.g., "New data: Dam may collapse! Revote!").  
  - **Why philosophers?** They’ll spot epistemic injustice and language ontology—use this in debrief!  

  This game weaponizes jargon to expose how randomness + fragmentation challenge collective wisdom. By making failure visceral, it pushes students to rethink sortition beyond "democracy vs. experts."
