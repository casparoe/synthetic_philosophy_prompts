prompt: |-
  me and my friend got in a huge fight last night about constitutional monarchy, like UK vs Japan vs Sweden. i kept seeing this loop in his arguments. he said the monarch has zero real power now, just rubber stamps stuff, so complaining about democracy is silly—its purely ceremonial. but then i said ok lets make it an elected ceremonial office with the exact same powers, and he flipped: 'no, the crown gives continuity you cant replicate, its essential to national identity.' so the monarchy is defensible because its weak when democracy is the issue, but defensible because its strong when replacement is the issue. is there an actual name for this rhetorical pattern? i know motte-and-bailey is when you retreat to a weak claim then sneak back, but this feels different—the two claims share the same ceremonial role, theyre just evaluated opposite directions based on the attack. does constitutional theory have a term for an institution being simultaneously powerless and indispensable? if not, can you define it properly and say where it stops being this and starts being a legit two-level defense? please dont just say 'symbolic capital' or whatever, i want the carving not the label.
reasoning: |-
  Okay, the user is describing a debate with a friend about constitutional monarchies. They noticed their friend uses two contradictory arguments: first, that the monarchy is harmless because it's powerless, and second, that it's indispensable because of its symbolic strength. The user wants to know if there's a term for this rhetorical pattern or if it's a legitimate two-level defense.

  First, I need to parse the core issue. The friend's argument shifts depending on the criticism. When challenged on democratic principles, the monarchy is framed as weak and ceremonial. When asked to replace it, suddenly it's strong and essential. The user sees this as inconsistent and wants to know if it's a recognized fallacy or a valid argument structure.

  The user mentions motte-and-bailey, but this seems different. Motte-and-bailey involves retreating to a defensible position and then advancing to a less defensible one. Here, both claims are about the same ceremonial role but evaluated oppositely based on the attack. So, it's not a retreat; it's a toggle between two aspects.

  I recall the concept of Janus-faced arguments, named after the two-faced Roman god. This fits because the argument presents two faces: one emphasizing weakness and the other strength, depending on the context. That could be the term the user is looking for. But I should verify if there's a more specific term in constitutional theory.

  Constitutional theory often discusses the dual nature of monarchies—functional powerlessness versus symbolic potency. Terms like "dignified part" (from Bagehot) come to mind. But the user wants to avoid vague labels like "symbolic capital." They want a clear distinction between a fallacious toggle and a legitimate two-level defense.

  The key is whether the two claims are treated as complementary or contradictory. In a legitimate defense, both aspects coexist without contradiction. The ceremonial role doesn't interfere with democracy (weak in power), while providing stability (strong symbolically). The problem arises when the friend denies the symbolic strength during the democracy argument but invokes it when replacement is suggested. That's the inconsistency.

  So, the fallacy isn't in holding both views but in selectively emphasizing one to deflect criticism while relying on the other when convenient. That's the Janus-faced toggle. The user needs to know where this becomes fallacious versus a valid argument. The boundary lies in whether both aspects are acknowledged simultaneously and non-contradictorily. If the friend denies the symbolic role when defending democracy but uses it against replacement, that's the toggle fallacy.

  The user might also be seeking validation that their friend's argument is logically inconsistent. They want to articulate why the friend's position feels slippery. Pointing out the selective emphasis could help in their debate. They might need concrete examples or ways to challenge this toggle without dismissing the dual nature entirely.
answer: |-
  This is a brilliant observation of a common rhetorical pattern in defending institutions like constitutional monarchies. You've identified a specific **Janus-faced Toggle Fallacy** (or "Constitutional Janus Argument"). Here's the breakdown and carving:

  1.  **The Core Toggle:**
      *   **Face 1 (Against Democratic Complaints):** "The Monarch has **Zero Functional Power**. It's *merely* ceremonial/symbolic. Therefore, it poses no threat to democracy; complaining is irrelevant."
      *   **Face 2 (Against Replacement):** "The Monarch is **Indispensably Powerful Symbolically/Historically**. Its unique, non-replicable symbolic capital provides continuity, identity, and stability. Therefore, replacing it would cause irreparable loss."

  2.  **The Fallacy:** The argument *toggles* between these two faces **selectively based on the type of criticism**, treating them as *mutually exclusive justifications* when convenient, rather than acknowledging them as *complementary aspects* of the same institution. The *evaluation* of the institution's nature flips based solely on the attack vector:
      *   When attacked on *democratic legitimacy*, the *symbolic power* is **downplayed/minimized** ("just ceremonial").
      *   When attacked on *practical replaceability*, the *symbolic power* is **maximized/essentialized** ("indispensable continuity").
      *   The critical move is the **denial of the symbolic aspect** when defending against democratic critiques. If the symbolic power is truly *indispensable* (Face 2), it *is* a form of power (soft power, cultural power) that *does* exist within the democratic system and warrants discussion on its own terms.

  3.  **Why "Janus-faced"?** Named after the Roman god with two faces looking in opposite directions. The argument presents two contradictory evaluations of the *same core attribute* (the ceremonial/symbolic role) depending on which direction the threat is coming from.

  4.  **Distinguishing it from Motte-and-Bailey (MAB):**
      *   **MAB:** Involves a *strong* but hard-to-defend claim (bailey) and a *weak*, easily defensible claim (motte). The arguer retreats to the motte when challenged and then later sneaks back to the bailey.
      *   **Janus Toggle:** Involves *two distinct claims about different kinds of power/value* (functional vs. symbolic) applied to the *same institution*. There's no "stronger" or "weaker" claim inherently; it's about *which attribute is emphasized/denied* based on the criticism. The arguer doesn't necessarily retreat; they *switch faces*. Both claims are presented as core justifications, but the *significance of one is negated* when defending against the other type of attack.

  5.  **Constitutional Theory Perspective:**
      While there isn't one single universal term for this specific *rhetorical toggle*, constitutional theory *does* grapple with the duality:
      *   **Bagehot's Duality:** Walter Bagehot famously distinguished the "dignified" (symbolic, unifying) parts of the constitution from the "efficient" (functional, governing) parts. Monarchies are the archetype of the "dignified."
      *   **Legitimacy vs. Function:** The institution derives legitimacy from history/tradition/symbolism ("dignified") while ceding function ("efficient") to elected bodies.
      *   **The "Power" of Symbolism:** Theorists recognize that symbolic power *is* real power – it shapes national identity, social cohesion, and even political stability. Pretending it doesn't exist when convenient is the fallacy.

  6.  **Where it Stops Being Fallacy and Becomes Legit Two-Level Defense:**
      The toggle becomes a legitimate, non-fallacious defense **if and only if** the proponent:
      *   **Acknowledges Both Aspects Simultaneously:** Explicitly states that the institution possesses *both* functional powerlessness *and* significant symbolic/cultural power derived from its unique history and continuity.
      *   **Argues They are Compatible & Complementary:** Explains *how* the symbolic power (Face 2) *does not undermine* the democratic functional system (Face 1), and perhaps even *supports* it (e.g., by providing stability, focus for unity above politics, or a check on purely partisan symbolism).
      *   **Consistently Values the Symbolic Aspect:** Doesn't *downplay or dismiss* the symbolic power when discussing democracy. Accepts that the symbolic power *is* a reason for the institution's existence and persistence within the constitutional framework, worthy of discussion on its own merits (including potential anti-democratic implications, even if indirect).
      *   **Doesn't Use Face 1 to *Deny* the Relevance of Face 2:** Accepts that arguing for replacement based on democratic principles *is a valid critique* that must engage with the claimed value of the symbolic power, rather than dismissing the critique by saying "it doesn't matter because they have no power."

  **In essence:** The fallacy lies in the **selective denial of the symbolic power's significance when defending against democratic critiques**, while simultaneously relying *entirely* on that same symbolic power to defend against replacement. A legitimate defense embraces the duality: "Yes, it has no functional power, *and* its unique historical/symbolic role provides valuable continuity and identity that an elected office couldn't replicate, which is why we accept it within our democratic system despite its undemocratic origin." The key is consistency in acknowledging the *value and reality* of the symbolic power across *all* arguments.
