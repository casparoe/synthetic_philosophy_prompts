prompt: |-
  I'm moderating a small conference panel on law and moral language, and one of my guests just published a book that wants to bring back Lemkin's dropped cultural-genocide clause — not as a standalone crime, but as an aggravating factor inside the physical and biological categories. She also claims that when politicians use weasel phrases like ethnic cleansing it isn't just cowardice; she thinks there's a structural gap in how the Convention frames intent that makes the legal label feel misfit even when the facts are there. I need a sequence of questions that actually dig into the mechanics, not biography. First, ask her how she tells apart cultural destruction that aggravates physical genocide from cultural destruction that happens on its own. Then include the follow-up she'll probly give — that intent is already covered by the in-part language — and push back on whether that captures the cultural dimension. Then ask what her view does with cases that are mostly cultural but include some limited physical violence: does the aggravating factor flip the legal classification? Finish with a question about whether her framework can explain why states resist applying the genocide label even when the criteria seem technically satisfied, without just blaming politics. Keep it tight, maybe a typo or two.
