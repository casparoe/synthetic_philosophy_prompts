prompt: |-
  In our philosophy of religion reading group we've hit a wall discussing whether evolutionary-cognitive explanations—like hyperactive agency detection and the idea that belief in gods is a byproduct of theory-of-mind mechanisms—actually compete with theological justifications. The naturalists say showing belief has this kind of origin undermines its rational warrant; the theologians reply that's a genetic fallacy, but then they also insist that genuine revelation must feel cognitively 'unnatural' or counter-intuitive, which seems to concede the naturalists' framing. Is the stall because both sides are running together etiological and normative explanantion, or is it a deeper disagreement about whether 'naturalness' is even a coherent criterion for religious truth? I want a diagnosis of what kind of disagreeement this really is—factual, verbal, or axiological—and whether any conceptual distinction could actually move it, not just a recap of Plantinga versus Dawkins. Please answer in British English.
reasoning: |-
  Okay, the user is part of a philosophy of religion reading group that's stuck on whether evolutionary-cognitive explanations of religious belief compete with theological justifications. They've outlined the naturalist position (that showing the origin of belief undermines its rationality) and the theologian counter (calling it a genetic fallacy but also claiming revelation feels 'unnatural'). The user wants a diagnosis of the disagreement type (factual, verbal, axiological) and whether conceptual distinctions could help – specifically avoiding rehashing Plantinga vs Dawkins.

  First, I need to unpack why this is such a persistent stalemate. The core issue seems to be that both sides are conflating different levels of explanation. Naturalists are making an etiological argument (how beliefs arose) and inferring normative conclusions (their truth value), while theologians inconsistently reject that inference as fallacious yet still appeal to 'unnaturalness' as a criterion for revelation – which accidentally validates the naturalist framing. That's a messy entanglement of descriptive and normative claims.

  The user's suspicion about conflated explanations feels spot on. But the deeper layer is the unexamined assumption that 'naturalness' is a meaningful indicator of truth – a premise both sides seem to accept despite opposing conclusions. Naturalists equate natural origins with falsehood; theologians see unnaturalness as proof of divine origin. Neither questions whether cognitive naturalness correlates with truth at all. That's probably the axiological heart of it: they're operating with incompatible epistemic values.

  For disagreement typing: It's not primarily factual (both accept cognitive science explanations) or verbal (terms are clear enough). The real clash is axiological – about what counts as warrant for belief. Naturalists prioritize scientific consistency; theologians value supra-natural phenomenology. No amount of data will bridge that gap because they're playing different epistemic games.

  Could conceptual distinctions help? Yes, but only if both sides disentangle three things: (1) descriptive origins of belief, (2) logical justification for belief, and (3) criteria for divine authenticity. The theologians' appeal to 'unnaturalness' is especially problematic – it's a theological claim masquerading as an empirical one. Better to argue that divine action could work through natural cognition without undermining revelation. 

  The user's group might break the impasse by scrutinizing the 'naturalness' criterion itself. Is it coherent? Does science even support a sharp natural/unnatural dichotomy? Pushing here could force both sides to re-examine foundational assumptions. Though honestly, given the axiological divide, the goal might be clearer understanding rather than resolution.
answer: |-
  Right, your group's hit a classic, grinding gear in the philosophy of religion – and it's less about the specifics of Plantinga/Dawkins and more about fundamental frameworks clashing. Let's diagnose this properly, using British English as requested.

  The stall stems from **three intertwined layers of disagreement: primarily axiological (value-based), secondarily conceptual, and underpinned by conflicting metaphysical commitments.** It's not *just* conflating etiology and normativity, though that's a symptom. The deeper issue is a profound divergence on what constitutes valid "warrant" or "rationality" itself, especially concerning the supernatural.

  Here's the breakdown:

  1.  **The Core Axiological Disagreement (What Counts as "Warrant"?):**
      *   **Naturalists:** Operate within a **methodological naturalism.** For them, "rational warrant" is inextricably linked to explanations grounded in observable, testable, natural processes. If a belief (like God) can be *fully explained* as a byproduct of evolved cognitive mechanisms (HADD, hypersensitive ToM, etc.), then this *ipso facto* removes any *additional* rational requirement to posit a supernatural cause. The natural explanation is sufficient and complete. The origin *does* undermine the warrant because, within their framework, the *only* valid warrant comes *from* naturalistic coherence and evidence. Revelation feeling "unnatural" is irrelevant or even suspicious.
      *   **Theologians:** Operate within a framework where **revelation and divine action are genuine possibilities.** For them, "rational warrant" can include coherence within a theological system, perceived experiential veracity, historical testimony, and the internal witness of faith/scripture. Demonstrating a *natural propensity* towards belief doesn't logically negate the *possibility* that God utilises, transcends, or corrects those propensities through revelation. They see the naturalist's move as reducing "warrant" only to naturalistic origins, which they reject as question-begging. Hence the "genetic fallacy" charge – confusing origin with truth value.

  2.  **The Conceptual Tangle (Naturalness, Unnaturalness & Framing):**
      *   **Conflation of Levels:** You're right; both sides often run together descriptive (etiological) and normative (justificatory) explanations. The naturalist says: "This *is how* it arose naturally, therefore it *isn't* true supernaturally." The theologian says: "This *is how* it arose naturally, but that doesn't mean it *can't be* true supernaturally." The jump from "is" (origin) to "ought" (truth/warrant) is where the genetic fallacy accusation bites *and* where the theologian's appeal to "unnaturalness" backfires.
      *   **The Theologian's "Unnaturalness" Gambit (and its Concession):** This is a critical point of stall. By insisting genuine revelation *must* feel cognitively "unnatural" or counter-intuitive, the theologian:
          *   **Concedes the Naturalist's Epistemic Frame:** They implicitly accept the naturalist's premise that beliefs arising *naturally* from our cognitive machinery are *prima facie suspect* or inadequate for grounding supernatural truths. They feel compelled to distance revelation *from* natural cognition entirely.
          *   **Creates an Unfalsifiable Criterion:** What precisely constitutes "unnatural"? How is it measured? If a believer *does* find a theological proposition intuitively compelling (as many do), does that automatically disqualify it as genuine revelation? This move risks making "revelation" defined solely by its *resistance* to natural explanation, potentially rendering it conceptually hollow or immune to any engagement with natural cognition.
          *   **Undermines the "Genetic Fallacy" Defence:** If natural origins *do* cast doubt (requiring "unnaturalness" as a counter), then the naturalist isn't *entirely* committing a genetic fallacy; they are pointing to origins as *evidence* against supernatural warrant *within a framework where natural origins are the default explanation*. The theologian's response inadvertently validates the relevance of origins within the debate about warrant.

  3.  **The Underlying Metaphysical Divide:**
      *   This entire debate rests on a deeper, often unstated, disagreement: **Is the natural world causally closed?** Naturalists typically presuppose it is (methodologically or metaphysically). Theologians presuppose it isn't – divine action is a real possibility. *This* is the bedrock. No amount of conceptual clarification at the level of explanation will resolve this fundamental difference in starting assumptions about reality.

  **Diagnosis of Disagreement Type:**

  *   **Factual:** Minimal. Both sides likely *accept* the cognitive science *descriptions* of HADD, ToM byproducts etc., as plausible accounts of the *prevalence* and *form* of religious belief. The disagreement isn't about those facts *per se*.
  *   **Verbal:** Somewhat. Terms like "warrant," "rational," "natural," "unnatural," and even "explanation" are being used with different implicit weightings and connotations by each side. Clarifying these *could* help avoid talking past each other but won't resolve the core clash.
  *   **Axiological (Primary):** Crucially, yes. This is fundamentally about **values and epistemic priorities**. What *counts* as a good reason to believe? What kind of evidence or justification is authoritative? Naturalists value scientific coherence and naturalistic parsimony above all in assessing truth claims. Theologians value theological coherence, experiential depth, and the possibility of transcendent revelation as valid sources of warrant. These are competing value systems for determining rationality.
  *   **Metaphysical (Foundational):** Underpinning the axiological clash is the irreconcilable difference regarding the causal closure of the natural world and the reality of supernatural intervention.

  **Can Conceptual Distinctions Move the Discussion Forward?**

  Yes, potentially, by fostering clearer understanding, even if not full resolution:

  1.  **Strictly Separate Etiology and Justification:** Insistently ask: "Is this claim about *how the belief arose*, or is it about *why we should think it's true*?" Force each side to articulate their normative standards *independently* of the origins. The theologian needs to define warrant *without* leaning solely on "unnaturalness" as a reaction.
  2.  **Interrogate "Naturalness":** Challenge both sides on what "natural" and "unnatural" *mean* in this context.
      *   Ask Naturalists: Does explaining the *mechanism* of belief formation *necessarily* exhaust its *meaning* or potential *truth*? Could God utilise natural mechanisms?
      *   Ask Theologians: *Why* must revelation feel "unnatural"? Does God not create and work *through* natural human cognition? Is intuitive theological insight automatically suspect? Can you define "genuine revelation" *positively* without reference to resisting natural explanation?
  3.  **Clarify "Competition":** Does the evolutionary-cognitive explanation compete:
      *   As a *sufficient* explanation for the *existence and form* of the belief? (Probably yes, and widely accepted).
      *   As a *defeater* for the *truth* of the belief? (This is the core axiological/metaphysical dispute).
      *   As an alternative explanation that *replaces* the theological one? (Only if one presupposes causal closure – the metaphysical divide).
  4.  **Focus on Epistemic Frameworks:** Explicitly acknowledge that the disagreement is less about the facts of cognitive science and more about the *framework* within which those facts are interpreted and what they are taken to imply about justification. Admit that these frameworks (methodological naturalism vs. theology open to revelation) have different foundational commitments.

  **Conclusion:**

  The stall isn't merely a logical error (conflating etiology and normativity), though that plays a role. It's primarily an **axiological stalemate** rooted in **irreconcilable metaphysical commitments** about the nature of reality and divine action. The theologians' appeal to "unnaturalness" is a tactical error that concedes too much ground to the naturalist's framing and weakens their "genetic fallacy" defence.

  Moving forward requires rigorously separating descriptive origins from normative justification, critically examining the loaded concept of "naturalness," and explicitly recognising the differing epistemic values and metaphysical presuppositions at play. The goal might shift from "resolving" the competition to "understanding the nature of the disagreement" – acknowledging that ultimate resolution likely requires choosing between fundamentally different worldviews, not just winning a logical point. Clarifying the conceptual distinctions won't make one side capitulate, but it can make the debate more precise and reveal where the genuine, perhaps unbridgeable, differences lie.
