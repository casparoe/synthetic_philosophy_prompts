prompt: |-
  So I've been getting into philosophy since I left the lab, and I keep running into Dennett's intentional stance -- the idea that you treat something as having beliefs if it helps predict its behavior. With AI now, people keep asking whether LLMs actually have beliefs or if we're just antropomorphizing. But I think there are several distinct open threads hiding under that question. One is whether the stance is purely pragmatc or tracks something real in the system's architectre. Another is whether models that do continuous-world-model updates -- not just static weights -- should be evaluated differently for belief attribution. Then there's whether attributing beliefs automatically gives you moral status, or if that's a seperate leap altogether. I'm trying to decide where limited effort should actually go. If you were advising someone with one year, which of these lines is upstream? Which are tractable now, which are overrated because they wouldn't change practice, and what's the dependency map? Give me a defended agenda with your criteria, not a survey. And no bibliography please -- I'm just organizing my own thoughts.
