  First, I need to understand the core problem. The user is stuck between literal interpretation of an archaic law and modern sustainability goals. Ghost provisions are problematic because they reference obsolete practices, making strict literalism nonsensical. The procedure must be pragmatic, avoiding philosophical debates and focusing on actionable steps.

  The user's explicit needs are a structured decision tree with clear yes/no outcomes and flags for panel review. But deeper needs likely include reducing cognitive load, ensuring defensible decisions, and managing legal risk when statutes conflict. They probably also want to avoid appeals by having a transparent method.

  For the procedure structure, I'll start with foundational questions about direct applicability and physical feasibility. This quickly eliminates cases where the old rights can't possibly apply. Then move to modern equivalents where literal terms might map to current uses. If that fails, shift to the purpose statement's sustainability goals. Ghost provisions would trigger a specific tie-breaker favoring ecosystem resilience since they have no modern physical basis.

  Case A (geothermal claiming mill-race rights): The literal right exists but the physical channel is gone. No modern equivalent for geothermal use. Ghost provision tie-breaker applies, so climate purpose wins - rejection probable. User won't like denying the claim but it's consistent.

  Case B (blocking literal irrigation): Literal right applies and is feasible, but climate purpose opposes due to water stress. Here literalism wins because the right is physically operational. Must flag to panel since it's a policy conflict. User might dislike allowing harmful diversions but the procedure protects legal certainty.

  I should acknowledge limitations: The procedure fails when both frameworks partially apply (e.g., existing infrastructure with minor climate impact), or when novel technologies create ambiguous equivalencies. Also, it can't resolve value clashes between property rights and ecological needs - those always go to panel.

  The tie-breaker for ghosts leans toward purpose because clinging to obsolete concepts undermines the law's function. For Case B, upholding literal rights maintains statutory integrity while flagging tells the panel to consider policy changes.

  Need to keep language practical - no legal jargon. Emphasize that stopping conditions create efficiency, while flags ensure values decisions aren't made unilaterally. User gets a tool that's fast but knows its boundaries.
answer: |-
  ### 1. Practical Setup  
  As a Tribunal case officer, you adjudicate water rights applications under the 1893 Riparian Act ("the Act"), while integrating the 2018 Climate Adaptation Purpose Statement ("CAPS") promoting ecosystem resilience. Decisions must be made in 15-minute slots. "Ghost provisions" (e.g., "ice-harvesting easements") are obsolete rights in the Act with no modern physical counterpart. These break the text-vs-purpose frame because literal application is nonsensical (e.g., no ice to harvest), yet ignoring them risks undermining statutory authority. Your challenge is balancing archaic text with CAPS’s forward-looking goals without legislative guidance.

  ### 2. The Procedure  
  **(Run sequentially; stop at first definitive answer or flag.)**  
  1. **Does the application rely on a literal right under the 1893 Act?**  
     *No*: Apply CAPS (sustainability test only). **Stop: CAPS governs.**  
     *Yes*: Proceed to Q2.  

  2. **Is the literal right physically feasible or relevant today?**  
     *No* (e.g., "ice-harvesting" in a warming climate): **Flag as "ghost provision" → Apply Tie-Breaker.**  
     *Yes*: Proceed to Q3.  

  3. **Does the modern activity functionally mirror the Act’s original purpose for the right?**  
     *No* (e.g., using a "mill-race flow" for data centre cooling): **Flag as "purpose mismatch" → Apply CAPS.**  
     *Yes* (e.g., irrigation using historic diversion points): Proceed to Q4.  

  4. **Does CAPS clearly prohibit the activity due to ecosystem harm?**  
     *No*: **Stop: Literal right applies.**  
     *Yes*: **Flag as "CAPS override conflict" → Refer to panel.**  

  **Tie-Breaker for Ghost Provisions/Non-Equivalent Rights:**  
  - Where the literal right has no feasible modern application, **CAPS prevails**. The right is deemed obsolete; evaluate solely under CAPS sustainability criteria.  

  **Stop Conditions:**  
  - **Clear yes/no:** Q1 (no), Q4 (no), or Tie-Breaker (CAPS decision).  
  - **Flag for panel:** Q4 (yes) – conflict between valid literal right and CAPS prohibition.  
  - **Judgment flags:** Q2 (ghost), Q3 (purpose mismatch) – you apply CAPS but note the statutory tension.  

  ### 3. Case A: Geothermal Boreholes Claiming "Mill-Race Flow" Right  
  - **Q1:** Yes (invokes literal Act right).  
  - **Q2:** Physical feasibility? Mill-races were artificial channels for waterwheels; boreholes extract groundwater. **No match → Ghost provision. Apply Tie-Breaker.**  
  - **Tie-Breaker:** CAPS governs. Assess sustainability: Geothermal may reduce carbon emissions but risks aquifer depletion. If CAPS prioritises groundwater security, reject.  
  **Outcome:** **Rejected under CAPS.** The mill-race right is obsolete for geothermal use. You won’t like this as the applicant has a "technical" claim, but ghost rights yield to CAPS.  

  ### 4. Case B: Blocking Literal Irrigation Diversion Opposed by CAPS  
  - **Q1:** Yes (literal irrigation right under Act).  
  - **Q2:** Feasible? Yes (diversion infrastructure exists).  
  - **Q3:** Functional equivalent? Yes (irrigation remains irrigation).  
  - **Q4:** CAPS prohibition? Yes (climate data shows unsustainable water stress).  
  **Outcome:** **Flag for panel.** Literal right is valid and applicable, but CAPS demands restriction. This is a values/policy clash (historic rights vs. ecosystem survival) – **you cannot unilaterally override a feasible literal right.**  

  ### 5. Where the Procedure Breaks  
  **Misfires/False Positives:**  
  - **"Equivalent" misclassification (Q3):** If a modern use *plausibly* mirrors an old right (e.g., "mill-race flow" for micro-hydro power), but you deem it a mismatch, CAPS overrides too readily.  
  - **CAPS ambiguity (Q4):** Where ecosystem impact is contested (e.g., short-term drought vs. long-term recharge), the procedure forces a binary "prohibition" call; errors may favour literalism.  
  **Unresolvable Gaps:**  
  - **Simultaneous ghost + CAPS approval:** If an obsolete right’s modern adaptation (e.g., "ice ponds" repurposed as wetlands) aligns with CAPS, the procedure works. But where *no* CAPS test exists for a novel use, you lack guidance.  
  - **Literal rights with partial feasibility:** e.g., "mill-race flows" in a reconfigured canal. The procedure forces a yes/no on feasibility (Q2); borderline cases risk arbitrary flags.  
  Ultimately, it can’t decide **genuine statutory conflicts** (like Case B) – only the panel reconciles irreconcilable texts.
