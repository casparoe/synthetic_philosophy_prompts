answer: |-
  ### Precise Ship of Theseus Mapping for Notre-Dame  
  **"Planks" (Defined Components):**  
  1. **Original "Planks":**  
     - *13th-century oak frame* (destroyed: 100% loss).  
     - *Viollet-le-Duc’s spire* (destroyed: 100% loss).  
     - *Medieval stained glass* (partially preserved: ~70% survived heat damage).  
     - *Lead roofing* (melted: materially continuous but irrecoverable).  
  2. **New "Planks":**  
     - *Hidden steel trusses/fireproofing* (non-original structural additions).  
     - *New oak frame* (sourced from identical species/forests but 21st-century).  
     - *Replica spire* (identical design, modern materials/methods).  

  ### Diachronic Identity Analysis  
  1. **Material Continuity (Failure):**  
     - Destroyed oak/spire/lead break physical chain. Stained glass maintains partial continuity. **Result:** *Material identity is unsalvageable.*  
  2. **Spatio-Temporal Continuity (Partial):**  
     - Foundation, walls, and location persist uninterrupted. **Result:** *Spatial identity holds, but temporal "gaps" exist during reconstruction.*  
  3. **Formal/Functional Persistence (Success):**  
     - Exact geometric replication of spire/roof; uninterrupted use as cathedral/monument. **Result:** *Design-plan and purpose endure.*  

  ### Paradox Collapse via Historical Reality  
  Notre-Dame was **never** a "Ship" with fixed planks:  
  - Spire: 13th c. original → removed 1786 → Viollet-le-Duc’s 1859 version → 2024 replica.  
  - Roof: 13th c. frame → 19th c. modifications → 2020s steel-reinforced replica.  
  **Conclusion:** The "original ship" is a fiction. Identity resides in *cumulative layers*, not primal matter.  

  ### Political/Cultural Decisions: Essentialism vs. Formalism  
  - **Macron’s Modern Spire Proposal:** Rejected as *formally discontinuous* (violated silhouette/symbolism).  
  - **Hidden Steel Acceptance:** Permitted because *formal appearance* was preserved.  
  **Public Valuation Revealed:**  
  - **Exterior form** (silhouette, façade) = Non-negotiable essence.  
  - **Material composition** = Negotiable if invisible (steel trusses ≠ lead roof).  
  - **Function** (religious site/UNESCO monument) = Immutable core.  
  → Supports **four-dimensional design persistence**, not naive essentialism.  

  ### Paradox Reversal: Institution Dissolves the Dilemma  
  Notre-Dame demonstrates the Ship of Theseus is a **category error** for institutional architecture:  
  1. **Legal Personality:** Designated monument since 1862; identity persists via state recognition.  
  2. **Sacramental Function:** Consecration (1163) creates timeless theological identity beyond matter.  
  3. **Collective Memory:** Social "token" (e.g., Quasimodo’s home, coronation site) survives physical flux.  
  **Resolution:**  
  - The paradox assumes identity hinges on *material aggregation*. Notre-Dame proves identity is:  
    - **Functional** (continuous use as cathedral)  
    - **Formal** (persistent design constraints)  
    - **Institutional** (legal/communal recognition).  
  → Material continuity is irrelevant if form/function/institution endure.  

  ### Framework Evaluation  
  - **Explains Public Reaction:** Panic over spire change vs. calm over hidden steel reveals valuation of *visible form* and *symbolic function* over matter.  
  - **Silent On:** Emotional attachment to authenticity (e.g., grief over lost medieval wood) – a *phenomenological*, not metaphysical, concern.  
  - **Outcome:** Restoration **dissolves material-continuity view**. Identity is confirmed as a *process* (formal-institutional persistence across replacements), not an object.  

  **Final Verdict:** Notre-Dame’s restoration reframes the Ship of Theseus as a non-problem. Architectural/institutional identity is teleological: a cathedral is "itself" if it *looks, functions, and is recognized* as itself – regardless of swapped parts. The paradox only arises when misapplying atomistic materialism to a four-dimensional institutional entity.
