answer: |-
  Here's the brainstorming first:  
  *What usually goes wrong with stance lists?* People treat stances as rigid ontological categories instead of pragmatic heuristics, and they ignore how stance conflicts reveal where patterns become *robust* versus merely useful fictions.  

  **Desiderata for a Theory of Real Patterns** (built from concrete cases):  

  1. **Non-Arbitrary Pattern Identity** (Non-negotiable)  
     *Why?* A pattern is "real" if its description isn't arbitrarily sensitive to minor noise *and* captures counterfactual stability (e.g., "This circuit computes XOR" holds even if you swap silicon for gallium arsenide).  
     *Hard Case:* Quantum decoherence patterns in a noisy environment. Is the "pattern" the wavefunction collapse statistics (real but inaccessible) or the macro-level thermal noise (observable but coarse)? Neither is purely projected, but their "reality" depends on scale/resolution.  

  2. **Stance Conflict Resolution** (Non-negotiable)  
     *Why?* Design/intentional stance clashes expose when functional patterns transcend mechanistic implementation.  
     *Concrete Case:* An evolved neural net "plays chess" (intentional stance: it "values pawns") but its design stance description is "minimizes loss function via stochastic gradients" with no chess rules encoded. A theory must explain why the intentional pattern isn't reducible *in practice* to the design stance (e.g., the network's moves are predictable *as chess moves* but chaotic as gradient steps).  

  3. **Physical Base without Collapse** (Negotiable preference)  
     *Why?* Physical patterns must ground all others ontologically (e.g., no software without hardware), but *epistemic* access to higher stances need not require physical reduction.  
     *Example:* Explaining Conway's Game of Life gliders via physics stance (cell state transitions) is possible but intractable; design stance ("emergent rule-following") is efficient. A theory shouldn't force collapse but must forbid magical emergence.  

  4. **Epistemic/Ontological Distinction** (Non-negotiable)  
     *Why?* Prediction ≠ explanation (e.g., predicting stock crashes via neural nets vs. explaining them via market psychology). Ontology: what patterns *exist* in the system's causal structure. Epistemology: how we detect them.  
     *Negotiable:* Whether "beliefs" are ontological (e.g., in evolved AI) or purely epistemic tools. The theory must allow both interpretations without equivocation.  

  5. **Jointly Unsatisfiable Pair**  
     - **Full Reducibility:** Every intentional/design pattern is *in principle* describable in physical stance terms.  
     - **Autonomous Utility:** Higher stances offer indispensable predictive/explanatory power *even with perfect physical knowledge*.  
     *Conflict:* If reducibility means higher patterns are *eliminable* without loss, autonomy fails. But if autonomy requires irreducibility, physics isn't the base. Dennett likely rejects full reducibility.  

  **Scoring Existing Views**  
  - **Dennett's Original:**  
    ✅ Non-arbitrary patterns (via predictive robustness)  
    ✅ Stance conflicts resolvable (e.g., "intentional systems" as evolved design)  
    ⚠️ Physical base honored weakly (calls it "optional")  
    ✅ Epistemic/ontological distinction maintained  
    ❌ Scores low on autonomous utility (intentional patterns often treated as "as-if")  

  - **Stance Pluralism (e.g., Ladyman & Ross):**  
    ✅ Handles stance conflicts (different "real patterns" for different domains)  
    ✅ Strong autonomy for stances  
    ⚠️ Risks ontological vagueness (what anchors patterns?)  
    ❌ May violate non-arbitrary identity (e.g., "is this AI *really* an agent?" becomes contextual)  

  - **Fourth "Algorithmic Stance" (Proposed Weird Option):**  
    *Idea:* A layer between design and intentional: pattern-as-computation (e.g., "this system implements SHA-256").  
    ✅ Clarifies evolved AI cases (algorithmic pattern exists without designer intent)  
    ✅ Reduces arbitrariness (algorithm defined by input-output invariants)  
    ❌ May collapse design stance (is evolution a "designer" of algorithms?)  
    ❌ Fails on autonomy (algorithms often reducible to physics)  

  **Conclusion**: Your request isn't confused—desiderata are crucial because "whatever predicts" risks ignoring *why* some patterns persist across contexts (quantum decoherence) or stances (evolved AI). The tension between reducibility and autonomy is the core battleground. Dennett’s view nails pattern reality but undersells stance tensions; pluralism handles conflicts but risks anti-realism; a fourth stance might clarify computation but adds ontological clutter.
