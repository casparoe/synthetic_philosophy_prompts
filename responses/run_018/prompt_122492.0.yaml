prompt: |-
  Position I've settled into after years of reading the replication-crisis literature and way too many rationalist comment sections: it's an incentives problem wearing a statistics costume. The disaster came from undisclosed analytic flexibility plus journals that only printed positive results; fix that with registered reports, publishing nulls, and real power, and p < .05 on a pre-committed test is basically fine. The frequentist-vs-Bayesian fight is beside the point.

  What would count against that? I want defeaters ranked fatal → merely awkward, split into (a) things that have arguably already happened and (b) things that would have to happen.

  Here's the test I've been using, which I want stress-tested. Define a literature's *shrinkage ratio* as the median effect size in pre-registered direct replications divided by the median effect size in the originals, counting only replications the original authors signed off on in advance, so nobody can wave it away as an unfaithful protocol. My view as operationalized: if that ratio climbs toward 1 once flexibility and the publication filter are stripped out, the inference method was never the problem, and if it doesn't, I lose. So: (1) is there some ratio short of 1 that I'd be obligated to concede as a win for "no, it really was the statistics" rather than leftover incentive rot? (2) Is there a real, checkable asymmetry in the other direction — could someone who was explicit about their prior have predicted the shrinkage in advance, in a way a frequentist couldn't, or is "a prior would've saved us" pure hindsight?

  Be honest about insulation too. I notice I can dismiss almost any failed pre-registered replication with "it didn't bind the right degrees of freedom" or "power was still overestimated," and I can't tell whether that's a legit defense or the view eating its own tail. Given that I care most about calibration, tell me which of these should move me most: the type M / magnitude-error argument, evidence about how bad scientists' implicit priors actually are, or an actual case where a Bayesian treatment of the same data would have stopped a silly finding from being published.
reasoning: |-
  Okay, I need to unpack this user's position on the replication crisis and their specific questions. They've settled on the view that the core problem is incentives (p-hacking, publication bias) disguised as a statistical issue. They argue that fixes like registered reports and publishing null results make p-values acceptable. The frequentist vs. Bayesian debate is irrelevant to them.

  The user wants defeaters—counterarguments that could challenge their view—ranked by severity and split into things that have already happened versus hypotheticals. Their key test is the "shrinkage ratio": median effect size in pre-registered replications (approved by original authors) divided by median in original studies. If this ratio approaches 1, their view holds; if not, it fails.

  First, I need to stress-test this shrinkage ratio concept. What are its limitations? For instance, original authors signing off on replications might introduce bias if they only approve easy-to-replicate studies. Also, the median could hide important variation. The user worries about insulating their view with excuses like "it didn't bind the right degrees of freedom"—this is key. They're self-aware about potentially moving goalposts.

  Now, the user's two main questions:  
  1. What shrinkage ratio below 1 would force them to concede statistics were the problem? They need a specific threshold.  
  2. Is there evidence that Bayesians could predict shrinkage better, showing an asymmetry?  

  For the defeaters, I should categorize them as fatal, awkward, etc., split into existing evidence and hypotheticals. Fatal ones might include cases where pre-registered studies with sufficient power still show low shrinkage ratios. Awkward ones could involve Bayesian predictions of shrinkage that frequentists couldn't make.  

  The user also wants to know what should move them most regarding calibration: Type M errors, scientists' bad implicit priors, or a case where Bayesian analysis would have prevented a false finding. Each of these challenges their dismissal of Bayesian approaches.  

  I need to be honest about the insulation problem. If every failed replication can be dismissed, the view becomes unfalsifiable. That's a serious concern—it might mean their test isn't a true stress test.  

  Finally, the user cares deeply about calibration. Highlighting real-world cases where Bayesian methods outperformed frequentist ones might be persuasive, especially if those cases involve pre-registered designs.  

  Putting it all together, I'll structure the response to address each part clearly, ranking defeaters and offering concrete examples where possible. The user's self-awareness is admirable, so the tone should be respectful and collaborative, acknowledging the strength of their position while probing its weaknesses.
answer: |-
  Here's a stress-test of your position, structured around your requests. Your core view is robust against many common criticisms, but it has specific vulnerabilities.

  ### Defeaters: Ranked & Categorized
  *(Fatal = Forces abandonment of core view; Awkward = Undermines operationalization/confidence; Insulating = View risks unfalsifiability)*

  | Rank       | Type       | Defeater Description                                                                 | Why It Matters                                                                 |
  |------------|------------|--------------------------------------------------------------------------------------|--------------------------------------------------------------------------------|
  | **Fatal**  | **(b) Hypothetical** | Pre-registered, high-powered (β≤0.1), **ORIGINAL AUTHOR-APPROVED** replications consistently yield **shrinkage ratios ≤ 0.3** across diverse fields. | Proves effect collapse isn't fixable by incentives alone; statistics *must* be failing to prevent illusionary effects. |
  | **Fatal**  | **(a) Existing** | Fields with established **registered report adoption + high power + null publishing** (e.g., some cognitive psych subfields) **still show shrinkage ratios ≤ 0.5**. | Shows your fixes *are implemented* but effects still vanish. Incentives aren't the primary culprit. |
  | **Awkward** | **(b) Hypothetical** | Shrinkage ratio **> 0.9**, but replication effects are **systematically in the *wrong direction*** vs. originals. | Your metric "succeeds" but reveals catastrophic inference failure (Type S errors). P-values didn't save us. |
  | **Awkward** | **(a) Existing** | **Original authors systematically veto replications** of their *weakest/most flexible* papers, making your "approved" sample **unrepresentative**. | Undermines your operationalization. Your test only studies the replicable tip of the iceberg. |
  | **Awkward** | **(a) Existing** | **Bayesian meta-analyses *at the time*** using skeptical priors **correctly predicted shrinkage** later seen in replications, while p-values didn't flag risk (e.g., ego depletion, power posing). | Asymmetry exists: Bayes exposed the incentive rot *quantitatively* pre-replication. |
  | **Insulating** | **(a) Existing** | "**Binding DoF/Power**" objections become a **tautology**: Every failed replication is deemed "underpowered" or "inflexible" post-hoc by adherents. | Your view *can* become unfalsifiable if these criteria are applied inconsistently. This is eating its tail. |

  ### Answers to Your Specific Questions
  1.  **What shrinkage ratio forces concession?**
      *   **≤ 0.3 is Fatal:** Consistent ratios this low, *especially* under your stringent conditions (author-approved, pre-registered), mean the original findings weren't just inflated—they were likely *statistical mirages*. P-values < .05 failed catastrophically even absent incentives (beyond the inherent incentive to use NHST).
      *   **0.4-0.6 is Awkward:** This suggests a major role for statistics. While incentives caused inflation, the underlying signal was likely very weak/noisy. P-values < .05 were *misleading* even with pre-registration. You'd need to concede statistics shares significant blame.
      *   **≥ 0.7 is a Win (for your core):** Supports the idea that stripping out flexibility/filtering reveals the stable signal. P-values worked as intended *when the process was clean*.

  2.  **Asymmetry: "A prior would've saved us" – Hindsight or Predictive?**
      *   **It's Often Predictive (Awkward for you):** There are documented cases where **Bayes Factors (BF) < 1/3** (substantial evidence *against* H1) or **extremely wide/overlapping credible intervals** were calculated *on the original data* or early replications, correctly signaling profound fragility *years* before replication projects confirmed massive shrinkage (e.g., several social priming effects). Crucially, these BFs used *skeptical* or *default* priors, not post-hoc tuning.
      *   **Why this Hurts:** The frequentist p-value < 0.05 in the original paper offered a (misleadingly) strong signal of an effect. The Bayesian analysis, incorporating reasonable skepticism about *large, novel* effects, correctly quantified the high probability that the result was a fluke or vastly overstated. This wasn't hindsight; it was a better *real-time diagnostic* of the incentive-driven fragility. The asymmetry is in **quantifying evidentiary strength under uncertainty** – a core Bayesian strength.

  ### What Should Move You Most on Calibration?
  Ranked by impact on your position:

  1.  **Type M (Magnitude) Error Argument:**
      *   **Why it's Potentially Fatal/Awkward:** Your view assumes p<.05 is "fine" *if* pre-registered and powered. But if **properly powered pre-registered studies (e.g., 90% power for d=0.5) routinely yield effect sizes (e.g., d=0.1) where the *true* effect is so small that the original estimate was off by 5x (Type M error)**, it shows p-values *still* massively mislead about practical significance even when used "correctly". This directly attacks the "p<.05 is basically fine" part. *(Most Damaging)*
  2.  **Actual Case Where Bayes Would Have Stopped a Silly Finding:**
      *   **Why it's Awkward:** Identify a high-profile, incentive-driven (flexible, novel, positive) finding published with p<.05. Show that applying a **standard default Bayesian test (e.g., JZS Bayes Factor with medium prior) to the *original published data* yields BF < 1/3 or a 95% credible interval including zero or trivial effects.** This demonstrates Bayesian methods *in real practice* would have provided a much stronger null result signal, potentially deterring publication. It proves the "costume" could have been seen through immediately with different stats. *(Concrete Counterexample)*
  3.  **Scientists' Implicit Priors:**
      *   **Why it's Less Direct (But Supportive of Asymmetry):** Evidence that scientists consistently **overestimate effect sizes** (implicitly using over-optimistic priors) explains *why* they fall for p-hacked results and underestimate replication risk. However, it doesn't *directly* prove Bayesian methods would have performed better in inference within the incentive system. It supports the "incentives are root cause" narrative but also hints that Bayesian training might improve calibration. *(Contextual, Less Forcing)*

  ### The Insulation Problem: Your Biggest Vulnerability
  Your defense ("bad DoF binding", "overestimated power") is **legitimate only if applied consistently and prospectively**. If *every* failed replication is dismissed post-hoc this way, **your view becomes unfalsifiable**. This is the "way too many rationalist comment sections" trap.

  *   **Stress Test:** Imagine a large-scale project (like Many Labs) using **protocols explicitly co-designed and signed off by original authors, with power calculated *conservatively* (e.g., based on R-Index or pre-registered pilot), and *still* getting a shrinkage ratio ≤ 0.4 across many studies.** If you *still* dismiss this as "not binding the *right* DoF" or "power was *still* overestimated somehow", you've entered insulating territory. Your metric is only valid if you define *in advance* what constitutes adequate DoF binding/power estimation and accept the result when met.

  **Conclusion:** Your position is strong against the "Bayesianism as panacea" crowd. However, **Type M errors in "properly done" frequentist studies** and **demonstrated predictive asymmetry of Bayesian methods** are the strongest threats. The **insulation problem surrounding DoF/power objections** is the most critical vulnerability in your operationalization – guard against it rigidly. A shrinkage ratio **consistently ≤ 0.4 under your ideal conditions** should force a significant rethink.
