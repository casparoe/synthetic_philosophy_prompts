  I'm putting together a one-semester proposal for a grad seminar in philosophy of mathematics — about 7000 words, one term. I want to go after Benacerraf's dilemma but avoid the standard platonism-versus-structuralism replay that's been done to death. My half-baked idea is this: maybe the whole problem rests on conflating two different jobs — fixing what '2' refers to, and providing what I'd call a 'canonical anchroing' that lets mathematical explanations do real work outside pure math. Benacerraf shows reference is underdetermined across models, but nobody asks whether that underdetermination actually breaks knowledge if we separate referential determinacy from explanitory anchoring. So the project asks: is Benacerraf's challenge really about referential uniqueness, or is it about whether mathematical belief needs a privileged model to ground explanations in applied contexts? The proposal should lay out the precise question, why existing answers (structuralism, full-blooded platonism, nominalist reconstructions) miss this split, the method — probably comparing how the argument plays out in arithmetic vs set theory since the anchoring demands feel different there — and what a result would look like: maybe a criterion for when non-uniqueness is harmless versus when it actually damages knowledge claims. Also need an honest failure condition and a scope check, since I only have one semseter and I don't want to bite off the whole metaphysics of mathematics. Don't include citations or a bibliography, I'll fill those in myself. There's probably a typo or two in this message, sorry.
