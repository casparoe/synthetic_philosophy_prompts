answer: |-
  ### Decision Procedure for Attributing Beliefs or Institutional Practices

  **Grounding:** Based on Peircean semiotics and archaeological theory, the procedure distinguishes:
  - **Indexical traces**: Physical evidence of use (wear, residue, deposition context).
  - **Symbolic encoding**: Non-functional, intentionally manufactured forms (e.g., decorations, shapes).
  - **Institutional regularities**: Cross-artifact patterns suggesting enforced norms (standardization, contextual rules).

  **Procedure Steps** (ordered checks using physical properties only):
  1. **Utilitarian Baseline Check**:  
     - *Check*: Assess if the assemblage’s functional properties align with known utilitarian norms for the region/type (e.g., wear patterns, material efficiency).  
     - *Pass*: ≥80% of objects show functional coherence (e.g., cutting tools have edge wear, containers have residue).  
     - *Failure*: Breaks chain → "No warranted inference."  
     - *Judgment*: Defining "functional norms" relies on regional comparanda; subjective if parallels are sparse.

  2. **Anomaly Detection**:  
     - *Check*: Identify deviations from the utilitarian baseline (e.g., non-functional wear, aberrant deposition, material excess).  
     - *Pass*: Anomalies are systematic (≥3 instances) and unexplainable by taphonomy or function.  
     - *Failure*: Breaks chain → "Utilitarian use likely; no symbolic/institutional inference."  
     - *Judgment*: Distinguishing "systematic" vs. "random" anomalies requires contextual interpretation.

  3. **Symbolic Encoding Validation**:  
     - *Check*: Verify if anomalies reflect intentional non-functional design (e.g., ornamentation, miniaturization, unnatural forms).  
     - *Pass*: Features are consistent across anomalies and irreconcilable with utility (e.g., fragile decorations on heavy-use tools).  
     - *Failure*: Breaks chain → "Anomalies may be idiosyncratic; no symbolic intent inferable."  
     - *Judgment*: Assessing "intentionality" is inferential; absence of ethnographic parallels increases subjectivity.

  4. **Institutional Regularity Test**:  
     - *Check*: Evaluate cross-object patterns for enforced norms (e.g., standardization, contextual constraints, mandatory associations).  
     - *Pass*: ≥90% of anomalous items show measurable constraints (e.g., identical weights, fixed deposition rules).  
     - *Failure*: Breaks chain → "Symbolic acts may be individual; no institutional practice."  
     - *Judgment*: Quantifying "enforcement" (e.g., rigidity of standards) involves value-laden thresholds.

  **Chain Outcome**:  
  - Pass all steps → Justified inference of a belief/institution.  
  - Any step fails → Halt; "no warranted inference."

  ---

  ### Application to Cases

  #### **Case (i): Deliberately shattered vessels in a pit with no domestic residue**  
  1. **Utilitarian Baseline**: Pass. Intact vessels in region show domestic residue/wear; shattered group lacks both → functional anomaly implied.  
  2. **Anomaly Detection**: Pass. Systematic shattering (fracture patterns indicate percussion) + residue absence → non-utilitarian deposition.  
  3. **Symbolic Encoding**: **FAIL**. Shattering is an act, not a manufactured form; vessels lack symbolic features (e.g., unique shapes/paint).  
     - *Chain breaks* → No symbolic inference. Procedure halts.  
     - *Judgment*: Step 3 requires manufactured symbolism; depositional acts alone are insufficient. Inference: Ritual destruction possible but not provable as "symbolic."

  #### **Case (ii): Identical standardized weights across separate structures**  
  1. **Utilitarian Baseline**: Pass. Weights show minimal wear, consistent with handling.  
  2. **Anomaly Detection**: Pass. Standardization exceeds functional needs (e.g., 100% identical mass/shape; no wear variation).  
  3. **Symbolic Encoding**: Pass. Standardization is intentional (manufactured precision beyond utility) → encodes abstract value.  
  4. **Institutional Regularity**: Pass. Uniform distribution across structures implies enforced norms (e.g., trade regulation).  
     - *Chain completes* → Institutional practice inferred (e.g., centralized metrology).  
     - *Judgment*: Step 4 assumes distribution reflects enforcement; alternative (e.g., voluntary adoption) is possible but unsupported by physical data.

  #### **Case (iii): Miniature non-functional tools in a burial cluster**  
  1. **Utilitarian Baseline**: Pass. Full-sized tools in region show use-wear; miniatures lack functional edges/handles.  
  2. **Anomaly Detection**: Pass. Miniaturization + burial context → non-utilitarian.  
  3. **Symbolic Encoding**: Pass. Form replicates functional tools but at non-usable scale → symbolic representation.  
  4. **Institutional Regularity**: Pass. Cluster shows standardization (e.g., identical reduction ratio, exclusive burial association).  
     - *Chain completes* → Institutional practice inferred (e.g., hierarchical apprenticeship: tools denote status/age-graded roles).  
     - **Conflict**: Procedure forces hierarchical inference (standardization + contextual constraints imply enforced roles). Non-hierarchical interpretations (e.g., communal toys) fail Step 4 (no regularity in non-burial contexts).  
     - *Judgment*: Step 4’s "enforcement" threshold is value-laden; hierarchical bias arises if standardization is assumed top-down.

  ---

  ### Reliability and Vulnerabilities  
  **What would challenge the framework?**  
  - **Evidence undermining categorical distinctions**: E.g., a discovery showing "symbolic" forms (Step 3) arise from functional adaptations (e.g., ritual wear mimicking utility). This collapses the indexical/symbolic divide.  
  - **Failure of institutional regularities**: If cross-context analysis reveals that "standardization" (Step 4) correlates with environmental constraints (e.g., resource scarcity), not norms, the institutional layer becomes redundant.  
  - **Critical vulnerability**: **Step 3 (Symbolic Encoding)**. It relies on *negative evidence* (non-functionality), which is inherently interpretive. A proven case where "symbolism" is confirmed historically (e.g., inscribed items) but lacks physical non-functionality would force abandonment of the manufactured-form requirement.  

  **Most vulnerable point**: Step 3’s assumption that symbolic intent is physically legible. If intent can exist without formal encoding (e.g., unmodified objects imbued with meaning), the procedure cannot detect it, risking false negatives. This would necessitate reordering to prioritize depositional context (indexical) over form.  

  **Conclusion**: The procedure is robust for physically legible institutions but fails for "meaning without form." Abandonment would occur if symbolic encoding is proven detachable from manufactural properties. Until then, it remains a conservative, falsifiable framework.
