prompt: |-
  Write the full specification—the desiderata—that any adequate theory of well-being must meet if it is to survive both Nozick's experience machine and a symmetric but under-discussed variant I will call the "reverse machine" case: a subject immersed in an objectively harsh, unmediated reality who reports profound well-being precisely because she values the authenticity of her struggle and refuses a simulated life of pleasure, even when the simulation would preserve her false belief that she is still struggling. For each desideratum, state the phenomenon or thought-experiment that motivates it (for instance: the intuition that passive pleasure is insufficient; the need to distinguish being well from feeling well; the challenge of adaptive preferences formed inside simulation; the possibility that objective adversity can be constitutive of well-being for some agents). Mark which requirements are non-negotiable—without them the theory collapses into either hedonism or unqualified subjectivism—and which reflect camp-specific commitments (e.g., narrative coherence, objective pluralism, agent-relative weighting). Then identify whether any subset of these desiderata is jointly unsatisfiable, particularly where accommodating the reverse-machine intuition conflicts with accommodating the original machine intuition. Conclude with a brief evaluation of how hedonism, desire-satisfactionism, and an objective-list view fare against the list, but keep the conceptual weight on constructing and justifying the criteria rather than on scoring the theories.
reasoning: |-
  Hmm, the user is asking me to create a comprehensive specification—desiderata—for any theory of well-being that must satisfy both Nozick's experience machine and a "reverse machine" scenario. This reverse machine case involves someone who chooses harsh reality over simulated pleasure because they value authenticity, even if they falsely believe they're still in reality. I need to outline each desideratum clearly, explain what motivates it, and then categorize them as non-negotiable or camp-specific. Also, I have to check for conflicts between desiderata, especially regarding intuitions from both machines, and finally, briefly evaluate how existing theories like hedonism, desire-satisfactionism, and objective-list views handle these criteria.

  First, I recall Nozick's experience machine: it's a thought experiment where people plug into a machine that gives perfect simulated happiness, but it's fake. Most people reject it, suggesting that more than pleasure matters—things like reality, autonomy, or authenticity. The reverse machine flips this: someone is in a harsh reality and refuses a simulation that would make them think they're still struggling. This highlights that for some, struggle itself is valuable, even if they could be deceived into feeling fulfilled. So, the desiderata must capture why both choices could be rational and what that implies for well-being.

  Starting with the motivations. The experience machine shows that passive pleasure isn't enough; we care about reality and agency. The reverse machine shows that well-being isn't just about feeling good—it can include objective adversity as constitutive, like when someone finds meaning in real challenges. Also, there's the need to distinguish between being well and feeling well, because in both cases, self-reports might mislead: in the machine, you feel great but aren't really well; in the reverse, you might feel good in hardship, but is that genuine well-being? Adaptive preferences come into play too—people might adapt to simulations or harsh realities and report satisfaction, but that could be illusory.

  Now, for the desiderata themselves. I'll list them with motivations. Non-negotiable ones are those without which the theory collapses into hedonism (only pleasure matters) or unqualified subjectivism (only subjective states matter). For example, desideratum 1: Reality Contact—motivated by the experience machine's rejection, it says well-being requires some connection to reality. If missing, it becomes hedonism. Desideratum 2: Authenticity of Valuing—from both machines, it's about valuing things that are real and not deceived. Without it, subjectivism could justify anything. Camp-specific desiderata might include things like narrative coherence, which some theories emphasize, or objective pluralism, where multiple goods are listed.

  I need to identify conflicts. For instance, desideratum 4 from the reverse machine says adversity can be constitutive, which conflicts with desideratum 3 that says deception undermines well-being. But in the reverse machine, the subject refuses deception and chooses real adversity, so a good theory must reconcile this by allowing that adversity can be valuable for some agents based on their authentic values. That means it's not a strict conflict if we have desideratum 5, which emphasizes agent-relativity in weighting importance.

  After listing all desiderata, I'll evaluate the theories briefly. Hedonism fails almost all—it can't explain why anyone would reject the experience machine or embrace the reverse machine. Desire-satisfactionism might handle some aspects if desires are informed, but it struggles with adaptive preferences and the non-subjective elements. Objective-list views could incorporate authenticity and reality, but they might impose external standards that conflict with individual preferences, like in the reverse machine case where someone values struggle.

  Finally, I'll conclude by noting that desiderata 1-5 are core, and 6-8 are elaborative. The key is to justify why these criteria are necessary based on the thought experiments, ensuring the response is conceptual and balanced.

  I should structure this clearly: first the desiderata table, then conflicts, then theory evaluation, all while keeping the focus on constructing and justifying the criteria.
answer: |-
  Below is a comprehensive specification (desiderata) for any theory of well-being that aims to satisfy the challenges posed by **Nozick’s experience machine** and the **reverse machine**. Each desideratum is justified by the intuitions or phenomena it addresses, categorized as **non-negotiable** (essential to avoid collapse into hedonism/unqualified subjectivism) or **camp-specific** (reflecting commitments of particular theoretical approaches), and analyzed for potential conflicts. The evaluation of existing theories is kept brief, per your request, to prioritize the structure and justification of the criteria.

  ---

  ### **Desiderata Specification**

  | **Desideratum** | **Motivating Phenomenon/Experiment** | **Category** | **Justification** |
  |-----------------|--------------------------------------|--------------|-------------------|
  | **1. Reality Contact (Non-Deception)** | **Experience Machine**: Rejection of simulated pleasure due to the value of genuine interaction with reality. | **Non-negotiable** | Without this, the theory reduces to hedonism. Well-being requires that positive states (e.g., pleasure, accomplishment) are grounded in actual events or relationships, not illusions. |
  | **2. Authenticity of Valuing** | **Reverse Machine**: Subject values *real* struggle over deceived comfort, even if self-reported well-being is identical. | **Non-negotiable** | Prevents unqualified subjectivism. Well-being must incorporate whether the agent’s values align with truth (e.g., valuing "real struggle" vs. "deceived struggle"). |
  | **3. Non-Illusory Self-Appraisal** | **Both Machines**: Adaptive preferences formed in simulation/hardship may distort self-reports. | **Non-negotiable** | Distinguishes *being* well from *feeling* well. Self-reported well-being can be epistemically compromised if based on false beliefs (e.g., ignorance of deception in either machine). |
  | **4. Constitutive Adversity** | **Reverse Machine**: Objective hardship can enhance well-being when authentically valued (e.g., struggle as meaningful). | **Camp-specific** (e.g., perfectionism, virtue ethics) | Motivates objective pluralism: some goods (e.g., growth, resilience) require real adversity. Rejects pure preference-satisfaction where comfort is always optimal. |
  | **5. Agent-Relative Weighting** | **Both Machines**: Subjects prioritize different elements (pleasure vs. authenticity) based on personal values. | **Camp-specific** (e.g., desire theories, hybrid views) | Permits variability in what constitutes well-being (e.g., one agent weights authenticity > pleasure, another vice versa). Avoids imposing a single hierarchy of goods. |
  | **6. Non-Passivity of Well-Being** | **Experience Machine**: Mere passive receipt of pleasure is insufficient (e.g., lacking agency, achievement). | **Camp-specific** (e.g., eudaimonism, capability approach) | Demands active engagement (e.g., effort, choice). Motivates theories valuing agency or accomplishment over states like pleasure. |
  | **7. Resistance to Adaptive Corruption** | **Both Machines**: Agents in prolonged simulation/hardship may adapt preferences to their conditions, undermining validity. | **Non-negotiable** | Ensures well-being assessments account for distorted preferences (e.g., a "deceived struggler" might adapt to undervalue comfort). |
  | **8. Phenomenal Experience as Necessary but Insufficient** | **Experience Machine**: Pleasure is desirable but inadequate alone. | **Non-negotiable** | Hedonism fails without this; well-being requires more than positive affect (e.g., meaning, truth). |

  ---

  ### **Conflicts Between Desiderata**
  - **Primary Tension: Desiderata 1 vs. 4**  
    - **Conflict**: Desideratum 1 (*Reality Contact*) demands that well-being depends on truth, rejecting *any* deceived state. Desideratum 4 (*Constitutive Adversity*) allows well-being in objectively harsh conditions if authentically valued—but in the reverse machine, the subject *would* be deceived if they accepted the simulation (retaining false belief in struggle).  
    - **Resolution**: The tension dissolves if **authenticity** (Desideratum 2) acts as a bridge: adversity only enhances well-being when *knowingly* endured. The reverse-machine subject rejects deception *because* they value truth-informed struggle, preserving desiderata 1 and 4. A theory fails if it cannot explain why deception nullifies well-being in the experience machine but not *real* adversity in the reverse case.  
  - **Secondary Tension: Desiderata 3 vs. 5**  
    - **Conflict**: Desideratum 3 (*Non-Illusory Self-Appraisal*) implies objective constraints on well-being (e.g., "false beliefs undermine it"). Desideratum 5 (*Agent-Relative Weighting*) permits subject-defined priorities (e.g., "my well-being requires suffering").  
    - **Resolution**: A theory must distinguish *procedural* subjectivity (well-being depends on agents’ values) from *epistemic* subjectivity (self-reports are reliable). Desideratum 3 constrains the latter; desideratum 5 informs the former.  

  **Joint Unsatisfiability?**  
  No subset is *inherently* unsatisfiable, but **Desiderata 1, 2, 3, and 7** form a core that is **non-negotiable** and mutually reinforcing. A theory failing these collapses into hedonism (if 1/2/3 fail) or subjectivism (if 7 fails). The reverse machine’s challenge (Desideratum 4) is compatible if the theory grounds adversity’s value in authenticity (Desideratum 2).

  ---

  ### **Brief Evaluation of Theories**
  1. **Hedonism**: Fails all non-negotiable desiderata (1,2,3,7,8). It cannot explain the rejection of either machine, as pleasure is paramount. Collapses under adaptive preferences.  
  2. **Desire-Satisfactionism**:  
     - **Simple version**: Fails Desiderata 1,2,3,7 (e.g., satisfied desires in deception count as well-being).  
     - **Informed-desire version**: May satisfy Desideratum 2 (authenticity) but struggles with Desideratum 4 (constitutive adversity) if informed agents would always avoid hardship.  
  3. **Objective-List Theory**:  
     - Can satisfy Desiderata 1,3,4,6,8 (e.g., including "autonomy," "achievement," "truth").  
     - Struggles with Desideratum 5 (agent-relative weighting) if goods are rigidly ranked. May overrule the reverse-machine subject’s values if "pleasure" is deemed objectively superior to "struggle."  

  ---

  ### **Conclusion**
  The desiderata reveal that an adequate theory must:  
  - **Anchor well-being in truth and agency** (Desiderata 1,2,3,7), avoiding collapse into illusion-accepting paradigms.  
  - **Accommodate adversity as potentially constitutive** (Desideratum 4) without endorsing deception, using authenticity as a litmus.  
  - **Balance objective constraints with agent-relative pluralism** (Desiderata 5,6), ensuring the theory reflects diverse conceptions of a good life.  

  The reverse machine intensifies the challenge by showing that well-being can emerge from *objectively negative conditions* when aligned with agential values—demanding a theory that transcends both hedonic and simplistic subjective frameworks. A successful theory will likely be hybrid (e.g., objective goods filtered through subjective authenticity) or pluralist with agent-relative weightings.
