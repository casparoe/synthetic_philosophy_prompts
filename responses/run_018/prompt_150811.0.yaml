prompt: |-
  I'm a software engineer with no formal philosophy training, and I'm trying to work through a paraphrased passage from Al-Ghazālī's late-eleventh-century critique of the philosophers, traditionally titled The Incoherence of the Philosophers. The relevant section runs roughly as follows: Al-Ghazālī examines the case of fire brought near cotton, after which the cotton turns black. He concedes that blackening is never observed in the absence of fire, yet he denies that fire is the true agent of the blackening. Rather, he holds that God creates the blackening directly, employing the presence of fire only as the occasion; were God to will it, blackening could occur without fire, or be withheld despite fire's presence, with no logical contradiction.

  The distinction that confuses me is one that seems to hover behind the text. Some readers take Al-Ghazālī to be attacking only the philosophers' claim that causation is metaphysically necessary—akin to saying a function call must deterministically return one value—while still preserving fire as a reliable, habitual condition, something like a runtime environment within which God ordinarily acts. Other readers see a stricter occasionalism that strips all created things of even conditional reliability, reducing them to coincidental correlations with no metaphysical weight.

  Can you help me understand: (1) whether, on the passage's own logic, fire retains any minimal status as a condition (sharṭ) or is reduced to a mere temporal neighbor with zero metaphysical role; (2) how resolving this bears on his broader argument against the philosophers' doctrine of an eternal, self-caused cosmos; and (3) why the philosophers' commitment to necessary causation made them especially vulnerable to this particular line of attack? Please respond in at most 300 words. Begin with a single bottom-line sentence summarizing Al-Ghazālī's core move in the passage, then develop the reasoning. Do not include bibliographies, reading lists, or citations.
