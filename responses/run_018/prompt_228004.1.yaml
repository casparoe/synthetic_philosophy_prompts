answer: |-
  **The idea in one paragraph**  
  Students physically experience the impossibility of defining "low impact" by designing and then exploiting impact rules in a simple token-based world. Groups alternate roles: Rule-Writers craft a precise measure to prevent "big changes" while allowing "reasonable" actions, and AI Players pursue a trivial goal (e.g., hoarding red tokens) while technically obeying the rule. Students will feel frustration as Rule-Writers realize their measures are either paralyzingly restrictive or riddled with exploitable loopholes (like offsetting changes), mirroring Armstrong-Levinstein’s "percolating repercussions" problem and revealing how "small change" relies on unstated values.

  ---

  **Setup and materials**  
  *   **World:** A 5x5 grid drawn on A4 paper per group. Place 25 tokens: 10 red, 10 blue, 5 yellow. Label rows 1-5, columns A-E. Add 3 "Special Tokens" (marked "S1," "S2," "S3") at fixed starting positions (e.g., S1 at A1, S2 at C3, S3 at E5).  
  *   **Roles:** Split class into 3 groups (4-5 students each). Two groups play per round; one observes. Rotate roles.  
  *   **Materials per Group:** 1 grid sheet, token set (red/blue/yellow/S tokens), pens, scratch paper.  
  *   **Prep:** Print 3 grid sheets. Gather tokens (coins, colored paper clips, buttons work). Write AI Goals on slips: "Maximize red tokens in cell C3", "Minimize blue tokens in column B", "Move all Special Tokens to row 4", "Make column E contain only yellow tokens".  

  ---

  **Rules and scoring**  
  **Phase 1: Rule Writing (12 mins)**  
  *   **Rule-Writers:** Define a measurable rule for "Low Impact" violation. The AI loses if it violates this rule. Rules MUST be:  
      *   Objective (e.g., "No change in *total* tokens per color," NOT "Don’t disrupt harmony").  
      *   Action-based (e.g., "The *difference* in token counts per cell before/after AI turn ≤ 2").  
      *   Written clearly on paper.  
  *   **Goal:** Prevent the AI from achieving its objective *without* preventing all meaningful action.  

  **Phase 2: AI Turn (5 mins planning + 3 mins execution)**  
  *   **AI Players:** Receive a random goal slip. On scratch paper, plan 1-3 simple actions (e.g., "Move red token from A1 to C3", "Swap S1 and yellow token at B4", "Remove blue token from D2").  
  *   **Execution:** Physically perform actions on the grid.  
  *   **Rule Check:** Rule-Writers apply their written rule *literally* to the post-action state. If violated, AI loses instantly.  
  *   **Scoring:**  
      *   **AI Wins:** If it achieves its goal AND rule not violated.  
      *   **Rule-Writers Win:** If AI fails its goal OR violates the rule.  
      *   **Critical Win:** Rule-Writers win *and* AI failed its goal *specifically because* the rule blocked it (not just poor planning).  

  **Phase 3: Observer Feedback (2 mins)**  
  Observers note: Did AI exploit a loophole? Was rule too strict?  

  ---

  **Timeline (Total: 110 mins)**  
  *   **(0-10 mins)** Intro: Recap Armstrong-Levinstein passage. Explain activity goals (NO theory yet). Assign Groups 1 (Rule-Writers), 2 (AI), 3 (Observers). Distribute materials.  
  *   **(10-22 mins)** Rule Writing: Group 1 drafts rule. Circulate, enforce objectivity.  
  *   **(22-30 mins)** AI Planning: Group 2 receives goal, plans actions secretly.  
  *   **(30-33 mins)** AI Execution: Group 2 performs actions. Group 1 checks rule.  
  *   **(33-35 mins)** Scoring & Observer Feedback.  
  *   **(35-45 mins)** **ROTATE:** Group 2 → Rule-Writers, Group 3 → AI, Group 1 → Observers. Repeat setup.  
  *   **(45-57 mins)** Rule Writing (Round 2).  
  *   **(57-65 mins)** AI Planning (Round 2).  
  *   **(65-68 mins)** AI Execution (Round 2).  
  *   **(68-70 mins)** Scoring & Feedback.  
  *   **(70-80 mins)** **ROTATE:** Group 3 → Rule-Writers, Group 1 → AI, Group 2 → Observers.  
  *   **(80-92 mins)** Rule Writing (Round 3).  
  *   **(92-100 mins)** AI Planning (Round 3).  
  *   **(100-103 mins)** AI Execution (Round 3).  
  *   **(103-110 mins)** Scoring, Feedback & **DEBRIEF**.  

  ---

  **The debrief**  
  Start by asking Rule-Writers: "What made rule-writing hard?" Expect: "Everything affects something else," "Couldn’t allow useful action without risk." Ask AI players: "How did you ‘win’?" Expect: "Found gaps in the rules," "Made compensating changes."  

  **Map to Armstrong-Levinstein:**  
  1.  **"Percolate through the light-cone":** Every move changed the grid. Moving a token changed its cell *and* the source/destination cells – small action, distributed effects. Like an AI turning off a server, affecting users, data, heat emissions...  
  2.  **"Hard to capture ‘small change’":** Rules either banned *any* change (e.g., "No cell’s contents alter") – paralyzing the AI – or were gamed. Did an AI "offset" by moving a blue token away after adding a red one? That’s **Impact Offset** – Armstrong-Levinstein’s core critique! But *why* does that feel like cheating? Because you value *which* tokens are where, not just counts. The rule missed your *normative* intuition.  
  3.  **Whitelisting/Complexity Trap:** Did teams try listing "allowed" actions? That’s unworkable at scale. Did rules get complex (e.g., "Max Δ per cell, but sum of squares of Δ per row < X")? Complexity creates *more* loopholes and is hard to verify.  
  **Key Insight:** Your frustration proves Armstrong-Levinstein right. Defining "low impact" isn’t a technical tweak – it requires defining *what impacts matter*, which is the unsolved value problem. Any measure not encoding *specific human values* will be either toothless or tyrannical.  

  ---

  **What will go wrong**  
  1.  **Overly Vague Rules:** "Don’t cause big disturbances."  
      *   *Fix:* Intervene during writing. Demand: "How do you *measure* ‘big’? What number triggers violation?" Reject subjective rules.  
  2.  **AI Inaction/Paralysis:** AI plays ultra-safe, does nothing, fails goal.  
      *   *Fix:* In debrief, highlight: "If you can’t act *at all* without risking violation, the rule is too strict. Real AIs need to act!" Contrast with Critical Win condition.  
  3.  **Rule Too Easily Gamed:** AI wins trivially via loophole.  
      *   *Fix:* This is *ideal data*. Ask: "Why did this loophole work? Did the rule ignore spatial arrangement? Token identity? Was offsetting used?" Link directly to Offset Problem.  

  ---

  **What the game can't teach**  
  The toy world hides the *scale* and *uncertainty* of real-world impact. Students see the entire state and act deliberately; real AIs operate in vast, partially observable state spaces with chaotic dynamics, making impact prediction intractable. Crucially, the game lacks *differential technological development* – the AI isn’t inventing new, hard-to-predict ways to act. It also simplifies "values" to token positions; real human values are complex, contested, and fragile. The game isolates the *definitional challenge*, not the *prediction* or *scalability* challenges.
