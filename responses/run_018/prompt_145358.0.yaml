prompt: |-
  If the Fischer controversy can be reduced to the empirical finding that the German leadership had archived explicit, chronologically ordered offensive war plans before the July Crisis—while the other Great Powers only retained reactive defensive mobilization protocols—then does attributing moral blame to 'Germany' collapse into a merely historiographical judgment about which state's bureaucratic apparatus first rendered strategic intent into written procedure, leaving no genuinely normative space for collective national responsibility?
