  Hmm, I should break down the hidden premises here. First, the user assumes that defining side effects relative to a counterfactual human action necessitates a detailed model of human decision-making. That makes sense. If the AI has to simulate what a human would do in a given situation, it must understand human goals, preferences, and reasoning processes. This ties into the alignment problem itself, which is tricky.

  The user also mentions that without this model, changes appear as noise. So they're worried that any deviation from a poorly defined baseline could be misinterpreted, leading either to excessive caution or overlooked impacts. This relates to the robustness of the baseline. If the baseline is vague or incomplete, the AI might not reliably distinguish between significant and insignificant changes.

