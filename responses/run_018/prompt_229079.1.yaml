  Okay, the user is dealing with a fear of flying that persists despite knowing the statistics and rationally believing it's safe. They contrast this with their anger towards their sister, which disappeared immediately upon learning new facts. They want to know why some emotions respond to facts while others don't, and if there's a name for the stubborn type.

  First, I need to recall the psychological concepts related to this. The fear of flying seems rooted in the amygdala, which processes threats automatically. That's the fight-or-flight response, which is primitive and not easily overridden by rational thought. On the other hand, the anger involved higher cognitive processing, like the prefrontal cortex, where reassessing the situation changed the emotion.

  The user mentioned that emotions are sometimes described as thoughts or body feelings, but their examples show both types. So I should explain the dual-process theory: System 1 (fast, intuitive) vs. System 2 (slow, rational). Fear of flying is System 1, while the anger is more System 2.

  They also asked for a specific term for the stubborn emotions. "Cognitive impenetrability" comes to mind, meaning emotions that resist cognitive reappraisal. But that's a bit technical. "Conditioned responses" or "prepared learning" might apply here, as humans are evolutionarily predisposed to fear heights or confinement, making flying triggers hard to shake.

  I should address their deeper questions about whether emotions can be judgments. The anger case supports the judgment theory, but the fear example challenges it. Explaining that emotions have multiple components—subjective feelings, physiological responses, and cognitive aspects—could help. Stubborn emotions might have stronger physiological or evolutionary bases.

  The user also wants a clear definition to categorize other emotions, like unwarranted guilt. If the guilt persists despite knowing it's not their fault, it would fall under the stubborn category. Factors like early conditioning or trauma might make emotions less responsive to reason.

  I need to ensure the explanation covers both examples, provides the requested terms, and addresses the underlying philosophical question about emotions and judgments. Suggesting strategies like exposure therapy could be helpful, but the main focus is on understanding the dichotomy.
answer: |-
  That's a brilliantly observed and articulated question. You've hit on a core tension in psychology and philosophy of mind. There *are* names and explanations for this split, and your examples perfectly illustrate the key concepts:

  1.  **The Stubborn Kind:** Your fear of flying is a classic example of what's often called:
      *   **A Conditioned Fear Response:** Learned through association (e.g., turbulence, news stories, movies) or even evolutionary preparedness (fear of heights, confinement, lack of control).
      *   **An Evolutionarily Prepared Fear:** Humans seem biologically primed to fear certain stimuli (heights, snakes, confinement) that were historically dangerous, even if modern counterparts (like planes) are statistically safe. Flying hits several of these buttons.
      *   **Cognitively Impenetrable (to some degree):** This is the key philosophical/psychological term you're looking for. It describes mental states (like your fear) that are **relatively resistant to change by new beliefs or rational evidence.** While not *absolutely* impenetrable (therapy can help!), the change is slow and effortful, not instant like your anger.

  2.  **The Compliant Kind:** Your anger at your sister is an example of:
      *   **A Cognitive Emotion:** An emotion heavily dependent on a specific belief or appraisal ("My sister deliberately slighted me"). When the belief is falsified ("She was in the hospital"), the *reason* for the emotion vanishes instantly.
      *   **A Propositional Attitude:** Philosophers like Robert Solomon argued that emotions *are* judgments or evaluations about the world. Your anger *was* the judgment "My sister wronged me." When that judgment was proven false, the anger had no ground to stand on.

  **Where the Line Falls & Why:**

  The split largely revolves around **processing pathways and evolutionary origins:**

  *   **Fast, Subcortical Pathway (Fear Example):** Threats are processed incredibly rapidly by structures like the amygdala, triggering a physiological fight-or-flight response *before* the conscious, thinking cortex fully processes the situation. This pathway prioritizes survival over accuracy. Your *body* reacts to the sensations of takeoff (acceleration, noise, vibration, lack of control) and the *idea* of being miles up in a metal tube as DANGER! **Rational statistics simply don't reach this deep, automatic alarm system quickly or effectively.** It's like trying to reason with your knee during a reflex test.
  *   **Slower, Cortical Pathway (Anger Example):** Anger (especially social anger like yours) relies more heavily on higher cognitive processes in the prefrontal cortex. It involves complex appraisals of intent, fairness, relationship norms, and personal worth. **When the core factual premise ("she chose not to come") is definitively overturned ("she was hospitalized"), the entire cognitive structure supporting the anger collapses instantly.** The emotion *was* that cognitive structure.

  **Cases That Don't Sit Neatly:**

  Most emotions involve a mix, but here are examples challenging the binary:

  1.  **Grief:** Learning the *facts* of a death instantly creates profound sadness. But the *intensity and persistence* of grief seem to have a strong, stubborn physiological/emotional component that doesn't just vanish when you intellectually accept the death. It has cognitive elements (memories, thoughts) but also a deep, persistent ache that feels bodily and resistant to pure reason.
  2.  **Phobias (Beyond Prepared Fears):** A phobia of, say, buttons might not be evolutionarily prepared, but it can be just as cognitively impenetrable as a fear of heights due to strong conditioning or idiosyncratic associations.
  3.  **Guilt (Your Example):** Feeling guilty about something that wasn't your fault *can* be a stubborn emotion. If it persists despite knowing you weren't responsible, it's likely:
      *   **Conditioned:** Linked to early experiences where you *were* blamed unfairly.
      *   **Based on a Deeper Belief:** E.g., an irrational core belief like "I must be perfect" or "Bad things happening near me are my fault," which isn't overturned by the specific facts of *this* event.
      *   **Physiological:** A learned association between a situation and a feeling of dread/shame.
      *   **Therefore, YES, persistent guilt despite knowing you're not at fault qualifies as the "stubborn" (cognitively impenetrable) kind.** The *fact* ("not my fault") doesn't penetrate the underlying emotional response pattern or core belief.

  **Do Stubborn Emotions Invalidate the "Emotions as Judgments" Idea?**

  *   **Partially, but not completely.**
  *   **The Challenge:** Your flying fear strongly suggests emotions aren't *only* judgments. There's a powerful, independent physiological/automatic component that can operate independently of, or even in direct contradiction to, conscious belief.
  *   **The Rescue:** Proponents of cognitive theories might argue:
      *   The *initial* fear response involves a very fast, subcortical *appraisal* of threat ("This situation resembles danger!").
      *   The *persistence* of the fear despite contradictory beliefs shows that lower-level systems can override or ignore higher-level cognition, not that cognition is irrelevant.
      *   Cognitive therapy *can* eventually influence even stubborn fears, showing cognition *can* penetrate, just slowly and indirectly (e.g., through exposure that creates new safety associations).
  *   **The Synthesis (Most Accepted View):** Emotions are complex responses involving multiple components simultaneously:
      *   **Physiological Arousal:** (Sweaty palms, racing heart - strong in flying fear).
      *   **Subjective Feeling:** (The conscious experience of "fear" or "anger").
      *   **Cognitive Appraisal:** (The interpretation/evaluation of the situation - "This is dangerous" / "I was wronged").
      *   **Expressive Behaviors:** (Facial expressions, body language).
      *   **Action Tendencies:** (Urge to flee, urge to confront).
      Your flying fear is dominated by Physiology, Feeling, and Action Tendency, relatively decoupled from your conscious Cognitive Appraisal. Your anger was dominated by Cognitive Appraisal, which controlled the Feeling and Action Tendency.

  **Sharp Definition for the "Stubborn" Emotion:**

  > **A Cognitively Resistant Emotional Response (CRER):** An emotional state (feeling + physiological arousal + action tendency) that persists with significant intensity despite the individual holding a conscious, rational belief that contradicts the core appraisal typically associated with that emotion. Its persistence is primarily driven by automatic physiological processes, deeply conditioned associations, or evolutionarily prepared response patterns, rather than the current cognitive evaluation of the situation.

  **Does unwarranted guilt count?** Yes, if you *know* you weren't at fault (contradicting the core appraisal "I did something bad") but the feeling of guilt persists intensely, driven by conditioning or deeper beliefs, it's a CRER.

  **In short:** Your fear is a **Cognitively Resistant Emotional Response (CRER)**, rooted in evolution and automatic pathways. Your anger was a **Cognitively Dependent Emotion**, collapsing when its factual premise vanished. The split highlights the dual nature of emotion: part quick-and-dirty survival reflex, part complex cognitive appraisal. Understanding this is the first step towards managing the stubborn ones, often requiring techniques (like exposure therapy) that target the automatic pathways directly, not just rational argument.
