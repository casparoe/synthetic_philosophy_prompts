prompt: |-
  I am a software engineer with no formal philosophy background, and for a couple of years now I have been bumping into a distinction I cannot name, partly because I do not know what term to look under.

  Three situations that feel to me like the same thing.

  First. My father had dementia. My mother would say, about the man in front of her, "that is not him any more" — and then, a month later, when some old mannerism surfaced for a few seconds, "there he is." What she was tracking was plainly not the body, which was continuous throughout; it was not memory, since by then he could not remember much of anything; and it was not his current behaviour taken on its own, which was the same in both cases. It seemed to be something like whether a certain story could still be got going about the person in front of her. When it could, he was there; when it could not, he was not.

  Second. I re-described a period of my own life: a job I left, which I had told as a principled stand, I now tell as an elaborate way of running away. Nothing about the past changed. But the re-description changed what I did next, and not merely how I felt about it. Meanwhile I have changed my politics, my tastes and my habits beyond recognition over fifteen years, and none of that registers, to me or to anyone who knows me, as becoming a different person — apparently because nobody ever folded those changes into a story. So changes count, or do not count, depending on whether they get narrated, which seems backwards if the story is only a description.

  Third. A colleague was in a coma for three weeks. Throughout, his debts, his promises and his job were treated as still attached to something, and everyone involved — family, employer, bank — behaved as though there were a single thing those attachments hung from, even though during that period nothing was being narrated by anybody. Afterwards people said he was "still in there." I want to know what the "he" and the "in there" are supposed to be.

  Roughly, then: a locus we treat as what a human being *is*, which has its own persistence conditions, which we locate at a person without locating it anywhere in space, which survives wholesale changes in memory, character and behaviour so long as a story can be told, and which seems to weaken or fail when no story can be told by anyone, including by other people on the person's behalf.

  Is there an established concept for this, and if so, which is the nearest one and how does my description differ from it? I have seen the phrase "narrative identity" used loosely and it does not seem to be quite it, since that seems to be about the story a person tells of themselves, and my cases seem to work — or fail — whether or not the person is doing the telling. I also want to know what this thing is *not*: it is not a soul, not psychological continuity of the memory-and-character sort, not a legal person, and not just a set of traits. And I would like the boundary cases adjudicated, particularly this one: if two incompatible but competently maintained stories are told about the same life — by the person and by their family, say, a bit like two long-lived branches of a repository — do we have two of these things, one with priority, or a single one in an inconsistent state, and what would settle it?

  I am not after a label to quote. What I want is an account with edges: what conditions a thing of this kind has to meet to persist, what makes it the same one over time, when it stops existing, and whether it can be got wrong about the person it belongs to. If nothing established fits, please say so plainly and give me a definition and contrast cases instead.
reasoning: |-
  Okay, let me tackle this user's query. They're a software engineer without a philosophy background, struggling to name a concept they've observed in three scenarios: their father with dementia, their own life redescription, and a colleague in a coma. The core idea is about an entity that persists through changes as long as a story can be told about it, even if the person themselves isn't the one telling it. 

  First, I need to recall relevant philosophical concepts. Narrative identity comes to mind, but the user already mentioned it doesn't fit because it's usually about self-narration. Their cases involve external narrators. Locke's theory of personal identity focuses on consciousness and memory, which doesn't cover the narrative aspect here. Psychological continuity theories also emphasize mental states, which the user explicitly rejects. 

  Hume's bundle theory reduces identity to perceptions, but the user's examples suggest something more cohesive. Frankfurt's "person" as reflective self-evaluation might be closer but still centers on the individual's agency. The user's concept involves external narratives. Social ontology and attribution theory seem relevant because others' recognition matters. The "attributed locus of responsibility" idea might work here, blending attribution with narrative coherence.

  The user wants clear boundaries: persistence conditions, sameness over time, cessation, and possibility of error. They also want adjudication on conflicting narratives. For persistence, it's the existence of an ongoing narrative by anyone invested. Sameness depends on the narrative's ability to link past and present meaningfully. It ceases when no narrative can coherently connect to any future state. Errors occur if the narrative doesn't align with the person's actual capacities, like attributing agency to someone in a coma.

  For conflicting stories, like two branches in a repository, it's about social negotiation. The "truth" is less about facts and more about which narrative gains consensus. Legal or medical realities might force a resolution, but otherwise, it's a struggle for dominance. 

  I should also address what this isn't: not a soul (no metaphysical substance), not psychological continuity (ignores current mental states), not legal personhood (can exist without legal status), and not traits (more than the sum of parts). 

  The user's deeper need seems to be a structured framework to understand identity in relational and narrative terms, possibly to apply in their work or personal reflections. They value precision and boundaries, likely stemming from their engineering background. Providing a defined concept with clear edges, even if not established, meets their need for actionable understanding.
answer: |-
  Based on your precise and insightful examples, the established concept you're circling is **"Narrative Identity," but significantly expanded beyond its typical individualistic focus**. Your cases reveal a crucial dimension often underplayed: **the social, relational, and *attributed* nature of this locus**. The closest established framework is **"Narrative Identity as Socially Constituted/Attributed,"** or perhaps **"The Narrative Locus of Responsibility and Recognition."**

  Here's the breakdown, addressing your specific requirements:

  1.  **The Core Concept (Your Description):** A socially maintained and attributed **"narrative locus"**.
      *   **What it is:** It's the focal point *created by* and *sustained within* the network of narratives (stories, interpretations, expectations) held about an individual by themselves *and others* within their relational sphere. It's the "character" in the ongoing story of their life, treated as the bearer of identity, continuity, responsibility, and meaning.
      *   **Why "Attributed Locus":** It's not an inherent substance (soul) or a specific psychological state. It's *attributed to* the biological entity by the narrating agents (self and others). This locus *is* the point where debts, promises, love, recognition, and meaning "hook onto" the physical person.
      *   **Persistence Conditions:** The locus persists *as long as a coherent narrative thread connecting past, present, and anticipated future states of this "character" can be actively maintained and attributed to the biological entity by at least one invested party (including the self)*.
      *   **Sameness Over Time:** Sameness is determined by *narrative coherence*, not by physical continuity, memory retention, or character constancy. It's the same locus if the stories told about "this person" (even acknowledging change) can plausibly link the current state/person to past actions/states as belonging to the same "character arc." Your mother's recognition of the mannerism *reconnected the narrative thread* momentarily.
      *   **Cessation:** The locus ceases to exist *when no coherent narrative thread connecting any past state of the "character" to the current biological entity can be sustained or attributed by anyone (including the self)*. This might be due to:
          *   Profound dementia where no recognizable "character" link can be made (as per your mother's feeling).
          *   Irreversible coma where no future "character" action is anticipated *and* past connections fade from active attribution (unlike your colleague's case, where the narrative thread *was* actively maintained).
          *   Social death, where a community ceases to narrate the person as a continuous agent (e.g., severe estrangement where they become "dead to me").
      *   **Possibility of Error:** **Yes, it can be "wrong" about the person.** Attribution can be *misaligned* with the biological entity's actual capacities or history.
          *   *False Attribution of Agency:* Attributing complex agency/narrative locus to someone in a deep coma or advanced dementia when they lack the capacity (though families often do this out of hope/love).
          *   *Denial of Agency/Narrative:* Failing to attribute the locus to someone capable of it (e.g., dismissing someone's self-narrative due to prejudice, or refusing to recognize profound change as part of a *coherent* narrative arc).
          *   *Misinterpretation:* Telling a fundamentally inaccurate story about the "character" (e.g., your initial principled-stand story vs. later running-away story). The *accuracy* of the narrative matters for whether the locus *correctly* reflects the person's actual experiences and motivations, even if *coherence* is maintained.

  2.  **How Your Description Refines "Narrative Identity":**
      *   **Beyond Self-Narration:** Standard narrative identity (e.g., MacIntyre, Ricoeur, Schechtman) focuses heavily on the *self*-constituting power of the life story. Your cases highlight the *social* constitution and maintenance of this locus. Your colleague in a coma *has* a narrative locus *only* because others sustain it. Your father's locus flickered based on your mother's *external* recognition of narrative coherence. Your own changes lacked narrative impact precisely because they weren't integrated *into a story* by anyone.
      *   **The "Locus" vs. the Story:** You pinpoint the *object* of the narrative – the "he" that is "still in there" or "not there anymore." This is the *attributed focal point*, the "character" within the narrative field, distinct from the narrative itself.
      *   **Function:** You emphasize its role as the anchor point for responsibility, debt, promises, recognition, and relational bonds – the "hook" for social and practical commitments.

  3.  **What It Is NOT:**
      *   **Not a Soul:** It has no independent metaphysical existence. It exists solely within the web of narratives and attributions.
      *   **Not Psychological Continuity (Lockean/Humean):** It doesn't require continuity of specific memories, character traits, or psychological states. It requires *narrative interpretability* of changes and states. Your father lacked memory but a flicker of mannerism provided a narrative hook. Your colleague lacked *all* psychological states, but the narrative thread was maintained externally.
      *   **Not Legal Personhood:** While often overlapping, legal personhood is a formal status with specific legal criteria. The narrative locus can exist without it (e.g., someone declared legally dead but still vividly remembered/narrated by family) or be misaligned (e.g., attributing full agency/narrative locus to someone under legal guardianship).
      *   **Not Just a Set of Traits:** Traits are the *material* for the narrative. The locus is the *organization* and *attribution* of that material into a coherent "character" over time. Changes in traits only impact the locus if they disrupt narrative coherence or force a re-narration.

  4.  **Adjudicating Boundary Cases: Conflicting Narratives (The Repository Fork):**
      *   **The Reality:** In this case, *multiple narrative loci are actively being attributed to the same biological entity* by different groups (Self-Branch vs. Family-Branch). This is common (e.g., addict vs. loved one narratives, political dissident vs. state narratives).
      *   **Existence:** There are effectively **two competing narrative loci** being maintained. Neither has inherent "priority" in an ontological sense.
      *   **What Settles It?** It's settled *pragmatically* and *socially* through **negotiation, power, and consequences**:
          *   **Dominance:** Which narrative gains wider social acceptance or institutional backing? (e.g., the legal system might enforce one view of responsibility).
          *   **Negotiation/Conflict:** Does one narrative collapse or get integrated? Do the parties reach a shared (or at least compatible) narrative? Does the conflict persist indefinitely?
          *   **Biological Entity's Role:** The individual's *own* actions, expressions, and capacity to assert their self-narrative become crucial battlegrounds. Their ability to *perform* their self-narrative influences its viability. If they become incapacitated, the external narrative(s) often dominate.
          *   **Practical Consequences:** Which narrative determines actions? Who gets custody? How are assets managed? Who is held responsible?
          *   **"Truth":** While facts matter, the "winning" narrative is often the one that best fits available facts *and* serves the interests/perspectives of the dominant narrators, *or* the one the biological entity most successfully embodies.

  **Conclusion:**

  You've identified a powerful concept: **the socially attributed narrative locus of identity, responsibility, and recognition.** While grounded in "narrative identity" philosophy, your emphasis on its *external attribution, persistence conditions based on narrative coherence maintenance (by self or others), and function as the anchor for social commitments* refines the concept significantly.

  **Definition:** The **Attributed Narrative Locus (ANL)** is a socially constituted and maintained focal point, attributed to a biological entity, which serves as the bearer of personal identity, continuity, responsibility, and meaning over time. Its existence and persistence depend entirely on the ability of invested agents (including the self) to construct and maintain a coherent narrative thread linking the entity's past, present, and anticipated future states as belonging to a single "character." It ceases when no such coherent narrative can be sustained by anyone. It can be erroneous if the attributed narrative fundamentally misrepresents the entity's capacities or history.

  This ANL explains all your cases: your father's flickering presence in your mother's narrative, the non-impact of your unnarrated changes versus the profound impact of your life re-narration, and the sustained "he" attached to your comatose colleague via others' maintained narrative. It handles conflicting narratives by acknowledging the potential for multiple, competing loci attributed to the same body, resolved through social processes, not philosophical fiat.
