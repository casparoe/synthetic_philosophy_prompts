  First, I need to understand the argument step by step. The core issue seems to be Kripke's Wittgensteinian skepticism about rule-following. The friend is applying it to computation, arguing that past behavior and dispositions underdetermine which function is being computed. Premise (3) claims that there are no other facts—like mental states—that can fix the function because they themselves need interpretation. That's the key premise where the skeptical move happens.

  The user strongly wants to preserve two things: meaning is normative, and there are facts about what people mean. So any solution I propose must accommodate those. The primitivist or non-reductionist approach seems best here because it rejects (3) by asserting that meaning facts are primitive and not reducible to dispositions or behavior. This allows keeping normativity and factual meaning. 

  Looking at the alternatives: the dispositionalist would have to bite the bullet on (2) and reject normativity since dispositions can't ground 'oughts'. The communitarian struggles with (4), as aggregating behaviors doesn't resolve indeterminacy. The skeptical-solution theorist accepts (5) but redefines meaning attributions, which might undermine the reality of meaning facts. 

  The user mentioned their friend computed a tip, so they're looking for a response that aligns with common sense. The non-reductive view does that by accepting that we do compute functions, and the skepticism arises from demanding reductive facts. The cost for non-reduction is accepting primitive meaning facts, which might feel unsatisfying but is necessary to preserve normativity and factual meaning.

  I should also explain why premise (3) seems compelling. It's because any proposed fact (like a mental state) can be interpreted in multiple ways. But if meaning isn't reducible, then mental states aren't just items needing interpretation; they intrinsically possess content. This avoids the regress. 

  The user might be worried about the metaphysical cost of primitivism, but compared to losing normativity or meaning facts, it's the smallest cost. They need to justify why primitive facts aren't mysterious, perhaps by linking them to biological or cognitive structures. 

  Also, addressing the community aspect: aggregating behaviors doesn't help, so communitarianism isn't viable. The skeptical solution changes the subject, so if the user wants real meaning facts, that's not acceptable. 

  In conclusion, rejecting (3) with a non-reductive account preserves both desiderata. The argument's soundness comes from the reductive assumption, which isn't necessary. Highlighting this assumption and its alternatives should help the user refute their friend's argument effectively.
answer: |-
  Your friend's argument is a sharp distillation of Kripkean skepticism applied to computation. While logically tight *if* its presuppositions are granted, the core error lies in **premise (3)**, specifically its reductive assumption. Here's the breakdown:

  **The Culprit: Premise (3) & The Reductive Assumption**
  *   **(3) claims:** Past use, dispositions, *and any other candidate fact* (intentions, mental states) "exhaust the candidate facts" and are *themselves* "just another item that stands in need of interpretation," inheriting indeterminacy.
  *   **The Error:** This premise assumes **reductionism about meaning/computation**. It presumes that facts about meaning (or computing a function) *must be constituted by*, or *reducible to*, non-semantic, non-intentional facts – specifically, behavioral dispositions, past use, or other items that themselves lack intrinsic meaning and thus require interpretation. This is the engine driving the indeterminacy regress.
  *   **Why it looks compelling:** It leverages a powerful intuition: How *could* an inner state, like a brain state or a feeling of "meaning addition," magically pick out one specific function (e.g., addition) over its quaddition-like alternatives, *unless* we interpret that state? If meaning isn't "in the head" in a way reducible to non-intentional physical facts, and isn't "in the behavior" either (per (1) & (2)), where *could* it be? The skeptic challenges us to point to a non-interpretable fact, and premise (3) declares there are none, leading inexorably to (5)-(7).

  **Rejecting (3): The Non-Reductive (Primitivist) Response**
  This is the response that best preserves *both* the normativity of meaning *and* the reality of meaning facts, as you desire.

  1.  **The Core Move:** Reject the reductive assumption. Facts about what a speaker means (or computes) are *sui generis*, primitive, and *not* reducible to facts about behavior, dispositions, inner physical states, or even (in a strong form) occurrent mental states *conceived non-intentionally*. Meaning/intention/computation is a fundamental, irreducible aspect of certain cognitive states.
  2.  **How it blocks the argument:**
      *   **Breaks the Regress:** My intending to mean *plus* isn't itself "an item that stands in need of interpretation" *in the relevant skeptical sense*. My intention *intrinsically* has the content *plus*. When I intend to add, my intention is *directed at* addition itself, not at some bare state requiring interpretation. The skeptic's question ("What makes this state an intention to add rather than quadd?") misunderstands the nature of intentionality – it's not *made* by something else; it's a basic feature.
      *   **Grounds Determinacy:** The fact that I determinately mean *plus* (or compute the successor function) is a brute fact about my cognitive state. It's determined by my having that specific intentional state. The infinitely many functions consistent with my past behavior are irrelevant; they are consistent with *my past outputs*, not with *what I meant/intended*.
      *   **Accommodates Normativity:** Primitive meaning facts are intrinsically normative. If I mean *plus*, then I *ought* to answer '125' to '68+57'. The normativity flows directly from the content of the meaning fact itself. There's no need (and no possibility) to reduce this 'ought' to dispositions or behavioral regularities.
  3.  **Cost:** Accepting irreducible intentionality/computational facts. This is metaphysically "costly" to naturalists seeking a purely physical/behavioral reduction of the mind. It posits meaning as a fundamental, non-physical property (or relation) of cognitive systems. You must be comfortable with a non-reductive view of the mind.
  4.  **Why the Argument Seemed Sound:** The argument brilliantly exploits the difficulty of *reducing* meaning to non-intentional facts. If you tacitly accept the skeptic's demand for a reductive explanation ("Show me the fact *without* using semantic terms!"), the regress is inescapable. The non-reductivist rejects this demand as illegitimate – meaning *cannot* be explained reductively, but it doesn't follow that it doesn't exist.

  **Pricing the Alternatives (While Preserving Normativity & Meaning Facts):**

  1.  **Reductive Dispositionalist (Digs in at (2)):**
      *   **Move:** Rejects (2)'s claim that dispositions underdetermine. Insists idealized dispositions (under perfect conditions, no interference) *do* determine the function.
      *   **Costs:**
          *   **Severe Problem with Normativity:** Dispositions describe what I *would* do, not what I *ought* to do. If my idealized disposition leads me to say '5' for '68+57', then according to this view, I *meant* quus, and hence *ought* to say '5'. But intuitively, I *ought* to say '125' even if my disposition is messed up. Dispositions can't ground the robust 'ought' of meaning.
          *   **Idealization Problem:** Specifying "ideal conditions" without smuggling in normative/intentional notions (e.g., "conditions where I *understand* the rule correctly") is notoriously difficult, often circular.
          *   **Finitude/Error Problem:** Even idealized dispositions might be finite or have gaps, resurrecting indeterminacy worries.
      *   **Verdict:** High cost for normativity. Likely fails to fully secure determinacy. Preserves meaning facts only by weakening their normative force unacceptably.

  2.  **Communitarian (Resists (4)):**
      *   **Move:** Rejects (4)'s claim that aggregating community behavior cannot manufacture determinacy. Argues that meaning is fixed by communal standards or practices.
      *   **Costs:**
          *   **Meaning Facts Become Relational:** What *I* mean is determined by what the *community* does/disposes. This weakens the first-person authority and directness of meaning for the individual.
          *   **Community Indeterminacy:** Premise (1) and (2) apply equally to the community's *collective* past behavior and dispositions. Aggregating finite, potentially error-prone behaviors doesn't obviously create infinite determinacy. What fixes the *community's* meaning? (Leads back to primitivism or regress).
          *   **Normativity Source:** Does the normativity come from the community's *approval*? This risks collapsing into a kind of relativistic conventionalism, weakening the objectivity of the 'ought'.
      *   **Verdict:** Moderate cost for normativity (shifts source, risks relativism). Struggles to fully secure determinacy against the community-level version of the skeptic's challenge. Preserves meaning facts but makes them dependent on community practice.

  3.  **Skeptical-Solution Theorist (Accepts (5), Blocks (5) to (6)):**
      *   **Move:** Accepts (5) – no fact *constitutes* meaning addition. Blocks (5) to (6) by arguing that meaning attributions ("S means plus") aren't *descriptions* of a fact, but have a different function (e.g., expressing a commitment to using words a certain way, licensing inferences, signaling acceptance into a community).
      *   **Costs:**
          *   **Meaning Facts:** **This is the critical cost for you.** This view **explicitly gives up on robust meaning *facts*** (your strong preference). There is *no fact of the matter* about what anyone means, ever. Your friend computed the tip only in the sense that we find it useful to *say* she did within our communal practice. There is no deeper truth.
          *   **Normativity:** Normativity becomes entirely practice-immanent. You "ought" to say '125' only because that's what *we* do and expect, and deviance carries social consequences. This is a thin, non-objective form of normativity, arguably not the "genuine normativity" you want (which implies an objective 'ought' tied to the *actual* meaning).
          *   **Self-Undermining?:** The skeptic's own argument seems to *use* meaningful terms (like "function", "consistent", "behavior") while denying their determinacy. Can the skeptical solution itself be stated meaningfully?
      *   **Verdict:** **You explicitly lose robust meaning facts.** The preserved "normativity" is weak and social, likely not satisfying your desideratum. This is the highest cost for your stated preferences.

  **Conclusion & Recommendation:**

  *   **Reject Premise (3)** on the grounds of its implicit reductive assumption.
  *   **Adopt a Non-Reductive (Primitivist) View** of meaning/computational facts. This successfully blocks the skeptical argument while preserving both the **genuine normativity** of meaning and the existence of **robust facts** about what speakers mean and compute.
  *   **Cost:** Accepting irreducible intentionality. This is the smallest cost *given your constraints*, as the alternatives either severely weaken normativity (Dispositionalism), fail to fully solve determinacy while altering the nature of meaning facts (Communitarianism), or explicitly abandon robust meaning facts (Skeptical Solution).
  *   **Explaining the Argument's Appeal:** The argument powerfully exposes the **impossibility of a reductive account of meaning/computation**. Its appearance of soundness comes from convincing us to accept the skeptic's reductive framework and then demonstrating its inevitable failure. The solution is to reject the framework, not the reality of meaning. Your friend computed the tip because she genuinely intended to perform that specific calculation – a primitive fact about her cognitive state that isn't reducible to, or threatened by, the underdetermination of her past behavior or dispositions.
