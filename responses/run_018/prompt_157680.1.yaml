  My flatmate's been going on about Inception after we watched it last night, and I want to write a quick post for my blog. I'm trying to read it through Zhuangzi's butterfly dream — not the usual 'is Cobb still dreaming?' thing, but something a bit more specific. In Zhuangzi, the transfromation (wùhuà) means there's no fixed self to wake up and check reality; the butterfly and the philospher are just phases of the same flow. But Inception gives Cobb a totem — a physical object he spins to test if he's awake — which only makes sense if there's a stable 'I' that can own it. So I'm wondering: does the film smuggle in a Cartesian self that Zhuangzi explicitly rejects? And what does that do to the shared-dream architecture, where other people build worlds Cobb walks through? If reality is inter-subjective in the film, does that solve Zhuangzi's sceptisism, or just spread it around?

  Can you read the film through this? Focus on the hotel scene with Mal and the ending with the spinning top. Where does the philosophical lens actually illuminate Cobb's guilt — maybe the idea that he can't tell whether Mal's death was real or just another transfromation — and where does it feel forced? I'm also interested in whether the 'kick' back to reality solves anything, or if it's just another layer of belief. Don't quote dialogue exactly, just point to the scenes. Keep it practical, not an essay about every philospher ever.
