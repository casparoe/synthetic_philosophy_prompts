prompt: |-
  I'm trying to map out my actual commitments on weighing the inside view against the outside view, particularly where epistemic modesty about my own reasoning is at stake. Here are my concrete verdicts.

  When I estimate how long a research proposal will take, my inside view breaks the task into parts and yields three weeks; the outside view, drawn from my past proposals, suggests eight weeks is typical. I think I should split the difference but lean closer to the outside view—around six weeks. When I verify a simple logical derivation and see that modus ponens applies cleanly, my inside view reports direct comprehension; the outside view notes that people make logical errors at some base rate. Here I think I should largely disregard the outside view and remain near-certain. When I finish a dense philosophical paper and come away convinced there is a hidden equivocation in the author's central premise, my inside view reports clear understanding; the outside view says readers with my background often invent hidden errors. I think I should hold the conviction only tentatively—around sixty percent—and seek a second reading. When I vividly recall a specific conversation from last year, the inside view delivers precise dialogue; the outside view says reconstructed memory is unreliable. I think I should not rely on exact wording or cite details without checking, but I can still treat the gist as probably correct. When I assess my own moral intuition about a trolley-style case, the inside view delivers a sharp normative judgment; the outside view observes that people with my demographic and training often share the same bias. I think I should treat the intuition as data rather than verdict and substantially lower my confidence in its authority.

  One pair keeps pulling me in opposite directions. In the logical-derivation case, I reject letting the outside view undermine my direct verification. But in a statistical-analysis case—where I have just executed a regression with several data transformations—the inside view likewise reports that I performed each step correctly, yet I think I should apply the outside view aggressively and ask a colleague to check my code. Both involve direct inspection of my own cognitive work; one feels immune to the base rate, the other does not. I am unsure whether the relevant difference is cognitive transparency, domain-specific reliability, or an inconsistency I should correct.

  Is there a single principle—about the conditions for inside-view authority, epistemic modesty, or cognitive transparency—that captures all five verdicts and resolves the tension? State it precisely, identify which clause is motivated by which case, and predict what it says about an unlisted case: my assessment that I have correctly interpreted a poem's central metaphor after one careful reading. Then say honestly which of my listed verdicts the principle cannot accommodate. If no unified principle works, present the two best competing candidates, specify the case that forces a choice between them, and state which verdict each candidate must sacrifice.
reasoning: |-
  Okay, the user is grappling with the balance between the inside view and outside view in various epistemic situations. They've provided five specific scenarios where they've made judgments, and there's a tension between two particular cases: logical derivation vs. statistical analysis. The user wants a unified principle that explains all their verdicts and resolves this tension, or if that's impossible, the best competing principles.

  First, I need to understand each case thoroughly. The research proposal estimation involves splitting the difference but leaning toward the outside view. Logical derivation has them trusting their direct comprehension despite base rates. The philosophical paper case leads to tentative belief and seeking a second reading. Memory recall requires trusting the gist but not exact wording. Moral intuition is treated as data rather than authoritative. The tension between logical derivation (trusting inside view) and statistical analysis (needing outside verification) is key here.

  Looking for patterns, the cases where outside view dominates involve higher complexity or known failure modes. Statistical analysis has many steps where errors can creep in, unlike the straightforward modus ponens. The user's own epistemic track record matters too—logical deductions might have a high success rate for them, while coding might not. Cognitive transparency seems central: when they can fully introspect each step (like modus ponens), inside view is reliable; when the process is opaque or has many components (like regression analysis), outside view is necessary.

  I consider a principle like: "Trust the inside view only when the cognitive process is fully transparent and has high individual reliability." This fits the logical case (transparent steps) vs. stats (opaque code). It also explains the philosophical paper—interpreting arguments isn't as transparent as pure logic, so lower confidence. But the moral intuition case is tricky—intuitions feel transparent yet are distrusted. Maybe "transparent" here refers to the ability to trace reasoning step-by-step, which moral intuitions lack despite their vividness.

  Testing this with the poem metaphor case: interpreting a metaphor involves some subjectivity and lacks clear verification steps, so the principle would suggest moderate confidence (say 70%) and seeking external input. This aligns with their approach to the philosophical paper.

  But the moral case is a problem for this principle. The principle would predict trusting moral intuition since it feels transparent, but the user instead lowers confidence due to bias. So the principle needs refinement: perhaps adding a clause about known distorting factors (like demographic bias) overriding transparency. That feels messy though.

  Alternative principles? One based on "verifiability": trust inside view when errors can be self-detected later (like logic) vs. when they're invisible (like code errors). But memory errors aren't verifiable either, and they trust the gist—so that doesn't fully work. Another based on "stakes/consequences," but that seems less relevant here.

  I conclude that no perfect unified principle exists. The strongest candidate is the cognitive transparency principle, but it fails the moral case. The user must either adjust their moral verdict (trust intuition more) or accept a disunified approach. Alternatively, split into two principles: one for analytical tasks (prioritizing transparency) and one for interpretive/belief-driven tasks (prioritizing outside bias checks). The stats vs. logic tension then becomes a feature: different domains trigger different principles.

  The poem case under the transparency principle would get moderate confidence (around 70%), similar to the philosophy paper. For the moral case compromise: if keeping their verdict, note that "known bias" is a separate heuristic overriding transparency. But this means the principle isn't fully unified. Honesty about that limitation is crucial.
answer: |-
  Here's a precise principle capturing your verdicts and resolving the tension, followed by analysis:

  **Unified Principle:**  
  *Trust the inside view proportionally to the degree the cognitive process is transparent, verifiable in real-time, and free from known distorting factors (e.g., motivated reasoning, memory decay, complex toolchains). When these conditions are not met, the outside view (base rates, error rates, known biases) should dominate confidence.*

  ---

  **Clause Motivation by Case:**
  1.  **Research Proposal Timeline:** *"free from known distorting factors"* – Your inside view is distorted by planning fallacy/optimism bias, a known factor. Outside view (past data) dominates, hence leaning toward 8 weeks.
  2.  **Logical Derivation:** *"transparent, verifiable in real-time"* – Modus ponens application is simple, each step is consciously inspectable *as you perform it*. Known error rates don't apply to this *specific, verified* instance. Inside view dominates.
  3.  **Philosophical Paper Critique:** *Lacks "transparent, verifiable in real-time" and "free from known distorting factors"* – Identifying equivocation is complex interpretation, not step-by-step verification. Known distorting factors include confirmation bias and inventing objections. Outside view (reader error rates) significantly lowers confidence.
  4.  **Memory Recall:** *Lacks "free from known distorting factors"* – Memory decay/reconstruction is a profound known distorting factor. Inside view (vividness) is unreliable for verbatim details. Outside view (memory unreliability) dominates for precision, but gist is less distorted. Outside view frames reliability.
  5.  **Moral Intuition:** *Lacks "free from known distorting factors"* – Demographic/training biases are known distorting factors. The intuition itself isn't transparently derived step-by-step. Outside view (bias base rates) dominates confidence, treating intuition as data.
  6.  **Tension Resolution (Logic vs. Stats):**
      *   **Logical Derivation:** Meets *"transparent, verifiable in real-time"*. Each inference step is simple and consciously validated *during* the process. Inside view dominates.
      *   **Statistical Analysis:** *Lacks "transparent, verifiable in real-time" and "free from known distorting factors"*. Even with "correct" steps, complex code/data transformations involve opaque toolchains, hidden dependencies, and known high error rates (fat fingers, mis-specification, misunderstood outputs). Outside view dominates, necessitating external check.

  **Relevant Difference:** It's primarily **cognitive transparency** and **domain-specific reliability/stakes**. Logic offers real-time, stepwise verification of simple operations with high individual reliability. Stats involves complex, multi-step processes with opaque elements (code execution, math libraries) and known high collective error rates, making real-time verification insufficient.

  ---

  **Prediction: Poem's Central Metaphor Interpretation**
  *   **Principle Application:** Interpreting a poem's metaphor is complex interpretation, not stepwise verification. It lacks full *"transparent, verifiable in real-time"* – meaning is subjective and evolves. Known distorting factors include personal associations and confirmation bias.
  *   **Prediction:** Similar to the philosophical paper case. You should hold the interpretation tentatively (confidence ~60-70%), seek external perspectives (discussion, criticism), or re-read later with fresh eyes. The outside view (variability in literary interpretation, potential for misreading) should significantly moderate the inside view's certainty.

  ---

  **Honest Limitation Accommodation:**
  The principle **cannot perfectly accommodate your Moral Intuition verdict** without strain.

  *   **Why:** The principle emphasizes *cognitive process* transparency/verifiability/distortions. Moral intuitions often *feel* subjectively transparent and certain ("sharp normative judgment"). The principle alone might suggest trusting this feeling *more* than you do. Your verdict ("treat as data, lower confidence substantially") relies heavily on the *content* of the outside view (known demographic/training bias) overriding the *subjective experience* of clarity. While the principle mentions "known distorting factors," your application here prioritizes the *source* of the distortion (external bias) over the *subjective quality* of the insight more aggressively than in other cases (like logic, where subjective clarity *is* trusted). The principle captures the *direction* (lower confidence) but arguably under-specifies the *degree* of discounting required solely based on demographic bias versus the felt clarity.

  ---

  **If No Unified Principle (Assessment):**
  Your cases *are* largely reconcilable under the principle above. The moral intuition case is the hardest fit, but the principle provides a coherent rationale for lowering confidence (known distorting factors). The core tension (logic vs. stats) is resolved effectively by focusing on process transparency and domain-specific error profiles. The principle offers a robust, single framework for epistemic modesty calibrated to the nature of the cognitive task.
