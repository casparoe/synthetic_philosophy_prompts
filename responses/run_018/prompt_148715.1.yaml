prompt: |-
  I'm running a seminar for sharp undergrads on moral uncertainty, but I want to skip the tired coffee-vs-charity examples. I want to build the session around the specific problem of intertheoretic comparison when one live theory is lexical (absolute side-constraints) and the other is fully aggregative (longtermist expected-value reasoning). The students will arrive thinking uncertainty just means "I'm unsure, so split teh difference." Plan the teaching arc: what dependency has to be in place before they can even see why lexical/aggregative disagreement breaks the standard maximize-expected-moral-value recipe; pick one carrying example where one theory says "never do X no matter the scale" and the other says "do X if the numbers get big enough"; map out the misconceptions in the order they'll hit them — probably that this collapses to empirical uncertainty, or that lexical rules are just very high weights — and exactly where to head each off; give me one end-of-session check that proves they got the structural problem not just teh two theories; and tell me what formal machinery (maybe myopic vs sophisticated choice) to openly refuse to explain. No bibliography, just the architecture.
reasoning: |-
  Okay, the user is planning a seminar on moral uncertainty for sharp undergraduates, and they want to focus specifically on the challenge of intertheoretic comparison between a lexical theory (with absolute constraints) and a fully aggregative theory (like longtermism). They want to move beyond basic examples like coffee vs. charity and dive into how this particular conflict breaks standard expected value approaches. 

  First, I need to unpack their core request. They're frustrated with simplistic "split the difference" approaches and want students to grasp why lexical vs. aggregative disagreement is structurally different. The key dependency here is that students must first fully internalize that moral uncertainty isn't just empirical uncertainty in disguise—it's about fundamentally incommensurable frameworks. 

  Hmm, the carrying example needs to be visceral. Something where the lexical theory draws a bright line (e.g., torture) while aggregative reasoning would trade it for astronomical future benefits. Climate geoengineering crossed with torture risks? Too convoluted. Maybe simpler: "sacrifice one tortured person to prevent billions from suffering mildly." But needs future scale for longtermism... ah, a biosecurity scenario! Have them choose between (a) allowing catastrophic pandemics or (b) preventing them via research that risks creating an even worse lab-leak pathogen. Lexical deontology forbids (b) categorically; longtermism demands (b) at scale. 

  The misconceptions will cascade predictably. First, students will say "This is just empirical uncertainty about outcomes!" Must shut that down early by emphasizing identical factual premises. Next, they'll try to "convert" lexical thresholds into big weights—need to show how that collapses under scale. Finally, they'll suggest normalizing or capping values, which dodges the core incommensurability. 

  For the check: Make them articulate why "expected moral value" is undefined here. A good sign is if they say the theories don't just disagree on numbers, but on the *currency* of evaluation. 

  And yeah, explicitly refuse to explain fancy decision theories (myopic/sophisticated choice). This session is about seeing the chasm, not building bridges. 

  ...Wait, did I miss something? The user wants no bibliography—just pure conceptual architecture. Good. Keep it lean. Structure: 
  1. Smash "split the difference" fast with a warmup paradox. 
  2. Contrast theories starkly using the biosecurity case. 
  3. Trap them with scale escalation to break weighting workarounds. 
  4. Force the realization that aggregative math can't "price" lexical constraints. 
  Final checkpoint: Their discomfort should crystallize around the meta-problem—no common denominator exists.
answer: |-
  Here's the teaching arc designed to shatter "split the difference" intuitions and isolate the lexical/aggregative comparison problem:

  **Core Objective:** Students grasp that **lexical constraints create a fundamental incompatibility in the *structure of value*** with aggregative theories, making standard expected moral value maximization undefined or incoherent under uncertainty.

  **Carrying Example:** **The Climate Intervention Dilemma**
  *   **Theory L (Lexical):** "Never deliberately cause the extinction of a sentient species (e.g., humans), regardless of expected future benefits. This is an absolute constraint."
  *   **Theory A (Aggregative/Longtermist):** "Maximize expected total well-being across all future sentient beings. Preventing astronomical future suffering/ensuring flourishing justifies significant risks now."
  *   **Scenario:** A proposed geoengineering intervention has a 0.1% chance of triggering runaway climate feedback loops causing near-term human extinction. If successful (99.9% chance), it definitively prevents centuries of climate catastrophe, securing a flourishing future for quadrillions of potential beings. Theory A demands the intervention (massive positive EV). Theory L forbids it (extinction risk violates constraint, EV irrelevant).

  **Teaching Arc:**

  1.  **Smash "Split the Difference" Naivety (Fast & Early):**
      *   *Activity:* "Warmup Paradox": Offer $10 or a 1% chance at $1000. Most pick $10. Then: Uncertain worldviews – "Theory 1: Only $ matters. Theory 2: Only rare diamonds matter ($ worthless). What do you do under uncertainty? Split?" *Pause for confusion.*
      *   *Point:* Highlight absurdity of averaging fundamentally different *kinds* of value. Uncertainty isn't just about *how much* value, but *what counts as value*.

  2.  **Establish the Theories Starkly (Separately):**
      *   *Activity:* Present the Climate Intervention case *without uncertainty*. Poll: "If you *only* believed Theory L, what do you do?" (Forbid). "If you *only* believed Theory A, what do you do?" (Intervene). Clarify core logic: L's deontological rule vs. A's consequentialist calculus scaling infinitely.

  3.  **Introduce Moral Uncertainty & The Instinctive Failure:**
      *   *State:* "You're uncertain: 50% credence in L, 50% in A. What do you do? Maximize Expected Moral Value (EMV) seems obvious: Average the values assigned by each theory."
      *   *The Trap:* Let students try to formalize EMV naively. They'll assign value V_L(action) and V_A(action), then calculate EMV(action) = 0.5 * V_L(action) + 0.5 * V_A(action).
      *   *Problem Emergence:* "What is V_L(Intervene)?"
          *   Theory L: Intervention violates a constraint. V_L(Intervene) = **-∞** (or undefined/"forbidden"). It's not just a large negative number; it's categorically unacceptable.
          *   Theory A: V_A(Intervene) = (Probability Success * Astronomical Future Value) + (Probability Disaster * Disaster Value). Disaster Value is huge negative, but Astronomical Future Value dominates → V_A(Intervene) = **+Huge Finite Number (HFN)**.
      *   *Calculation Attempt:* EMV(Intervene) = 0.5 * (-∞) + 0.5 * (HFN) = **???** (-∞ + Anything is still -∞? Undefined?).

  4.  **Targeted Misconception Busting (Order of Attack):**
      *   **Misconception 1: "It's just empirical uncertainty about extinction risk!"**
          *   *Head Off:* "Hold the empirical facts CONSTANT. Both theories agree on the 0.1% extinction risk and the 99.9% success outcome. The disagreement is purely *moral*: Is taking that risk *ever* permissible, regardless of scale?"
          *   *Activity:* Ask: "If the extinction risk was magically reduced to 0%, would L still object? (No). A still demand it? (Yes). If the future benefit was halved, would L allow it? (No). A still demand it? (Maybe not, depends on scale)."
      *   **Misconception 2: "Lexical constraints are just very, very high weights!"**
          *   *Head Off:* "Scale it up! Suppose the intervention prevents suffering for *10^100* future beings. V_A(Intervene) becomes *Even Bigger Finite Number (EBFN)*."
          *   *Challenge:* "Can you set V_L(Intervene) = -K (a very large finite number) to make EMV work?" EMV(Intervene) = 0.5*(-K) + 0.5*(EBFN). For *any* finite K, there exists an EBFN large enough that EMV(Intervene) > EMV(Not Intervene). But Theory L says Intervention is *always* forbidden, *no matter how large EBFN is*. **No finite K replicates the absolute constraint.** The theories disagree on the *logical possibility* of trading the constraint.
      *   **Misconception 3: "We can normalize/standardize the value scales!"**
          *   *Head Off:* "How? Theory L's scale has a categorical cliff (-∞ for constraint violation). Theory A's scale is smooth, continuous, and unbounded. Mapping L's 'Forbidden' to a point on A's scale is impossible. Mapping A's HFN to L's scale (where constraint adherence might be +1 and violation -∞) is equally meaningless. The *axes themselves* are different."

  5.  **Crystallizing the Structural Problem:**
      *   *Key Insight:* The conflict isn't about *weights* or *units* on a shared scale. It's about **incommensurable structures of valuation.** Lexical theories introduce **discontinuities** and **absolute prohibitions** that aggregative theories fundamentally lack. Aggregative theories recognize **no absolute constraints**, only trade-offs at extreme scales. Standard EMV requires a common, commensurable value *space*. Lexical vs. Aggregative denies this.
      *   *Metaphor:* "Trying to average Celsius and RGB color codes. One measures temperature on a continuous scale, the other defines discrete colors. Averaging '25°C' and 'FF0000' is nonsensical, not because the numbers are big, but because they belong to different *kinds* of systems."

  6.  **End-of-Session Check (Proves Structural Grasp):**
      *   *Prompt:* "Assume you face a choice between Action X (forbidden by Lexical Theory L but maximizes vast future good according to Aggregative Theory A) and Action Y (permitted by L but disastrous according to A). Your credence is split 50/50.
      *   *Task:* Explain in 2-3 sentences *why* simply calculating 0.5 * Value_L + 0.5 * Value_A is impossible or meaningless for deciding between X and Y. Focus on the *nature* of the values, not the specific numbers.
      *   *Target Answer:* "Value_L(X) is categorically forbidden (like -∞ or undefined), while Value_A(X) is a huge finite positive. Value_L(Y) is permissible (finite, maybe positive), Value_A(Y) is a huge finite negative. Averaging -∞/undefined with a finite number is undefined, and treating the lexical prohibition as just a large finite negative fails because no finite negative captures 'never permissible regardless of scale,' which L demands. The theories use fundamentally different *types* of evaluation that can't be combined into a single expected value."

  7.  **Formal Machinery to Explicitly Refuse:**
      *   **Refuse to explain:** Myopic Choice vs. Sophisticated Choice (Borrowing/Lending frameworks) and Fanaticism solutions. *Reason:* These are specific, complex *responses* to the problem you've just exposed. Introducing them now would distract from the core insight – that the problem *exists* and is *structural*. Acknowledge they exist ("scholars have proposed complex decision rules like 'sophisticated choice' to navigate this"), but state firmly: "Today's goal is to understand *why* the simple EMV approach breaks here, not to solve it. Grasping the depth of this incompatibility is the essential first step."

  **Seminar Flow Summary:** Shatter naive averaging → Isolate pure moral conflict (fixed facts) → Try naive EMV → Hit the -∞ / HFN wall → Debunk "it's empirical/high weight/normalization" → Reveal incommensurable structures → Check via explanation of why EMV fails structurally → Refuse solutions to preserve focus on the problem's depth.

  This arc forces confrontation with the meta-problem: Under moral uncertainty, how do you decide when the theories disagree not just on values, but on the very logic of decision-making?
