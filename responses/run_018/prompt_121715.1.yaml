answer: |-
  ## Research Proposal: Ontological Composition Failure in the White Horse Dialogue: Whiteness as Sortally Invasive

  **Abstract:** This semester-length independent study proposes a novel interpretation of the White Horse Dialogue (Gongsun Longzi, "On the White Horse") from China's Warring States period School of Names. Challenging dominant readings that resolve the paradox as a logical error, semantic ambiguity, or rhetorical exercise, this project argues the dialogue advances a distinctive thesis of ontological composition failure. Specifically, it contends that the text presents whiteness not as an accidental property added to the substance "horse," but as a *sortally invasive* property: its presence fundamentally alters the kind-membership conditions of the entity it modifies. The core research question asks whether the dialogue provides internal arguments for a relation of *non-compositional dependence* between whiteness and horseness, disrupting the resultant entity's kind-identity. Through close textual analysis grounded in the dialogue's own terms and cautious comparison with contemporary phase-sortal theories, this study seeks to articulate and defend this ontological reading, demonstrating its distinctiveness from presupposition-laden Aristotelian frameworks and purely linguistic interpretations. Success hinges on a coherent, textually grounded premise reconstruction showing composition failure without importing anachronistic logic.

  **1. Introduction & Problem Statement: Beyond Conventional Readings**
  The White Horse Dialogue ("A white horse is not a horse") remains a locus classicus of early Chinese philosophical paradox. Standard interpretations fall into three broad categories:
      *   **Logical Error:** Attributing the paradox to confusion about set membership (white horses vs. horses) or quantification.
      *   **Semantic Ambiguity:** Resolving the paradox by distinguishing different senses of "horse" (e.g., species-concept vs. specific instance, abstract universal vs. concrete particular).
      *   **Rhetorical Exercise:** Framing the argument as sophistry aimed at training debaters or subtly critiquing state policies (e.g., naming standards or cavalry recruitment).

  While insightful, these interpretations share critical limitations regarding the dialogue's potential *ontological* thrust:
      1.  **Presupposing Substance-Accident Metaphysics:** The logical and semantic readings often implicitly rely on an Aristotelian framework where "horse" signifies a stable substance-substrate, and "white" signifies an accidental property added without altering the substance's core identity. The dialogue's rejection of "white horse is horse" may, however, stem from a fundamental challenge to *this very distinction* and the composition model it entails.
      2.  **Missing the Metaphysical Target:** The rhetorical and purely linguistic readings dismiss or downplay the dialogue's potential as a serious argument about the nature of reality and composition. They treat the paradox as *only* about words or persuasion, neglecting its possible claim about how properties combine to form objects and kinds.

  This project proposes a fourth, less explored interpretation: **Ontological Composition Failure via Sortal Invasion.** On this view, the dialogue argues that the property "whiteness" does not merely combine additively with "horseness." Instead, whiteness is *sortally invasive* – its presence disrupts the conditions that define membership in the kind "horse." The resultant entity, the "white horse," is not a subtype of horse but an entity whose kind-identity is fundamentally altered or disrupted by the invasive property. The paradox thus exposes a failure of the compositional model assumed by substance metaphysics.

  **2. Research Question:**
  Does the White Horse Dialogue provide internal arguments for the claim that whiteness and horseness stand in a relation of *non-compositional dependence*, such that their combination produces an entity ("white horse") whose kind-identity (membership in "horse") is disrupted, due to whiteness acting as a *sortally invasive* property?

  **3. Methodology: Reconstructing Ontological Failure**
  The project employs a multi-stage methodological approach focused on internal coherence and ontological claims, avoiding anachronism and overreach:

  *   **Premise-by-Premise Reconstruction (Textual Fidelity):**
      1.  Isolate the core propositions and inferential steps *explicitly presented* within the dialogue text itself.
      2.  Reconstruct the reasoning chain leading to the conclusion "white horse is not horse" using only concepts and distinctions plausibly available within the Warring States Chinese philosophical context (e.g., *ming* 名/naming, *shi* 實/reality, *lei* 類/kind). Crucially, *avoid* formal logical notation (predicate logic, set theory) which imports modern ontological commitments.
      3.  Identify unstated but necessary premises required for the argument to hold *as an ontological claim* about property combination and kind disruption. Pay specific attention to how the argument handles identity, parthood, and dependence relations.
      4.  **Failure Condition:** The reconstruction fails if key premises required for the composition-failure reading (e.g., explicit claims about property interaction altering kind-essence, or rejection of separable substance) cannot be reasonably inferred from the text's structure, arguments, or implied commitments, and must be imported wholesale without basis.

  *   **Testing Internal Consistency via Phase-Sortal Comparison (Conceptual Tool, Not Historical Link):**
      1.  Define core features of contemporary "phase-sortal" theories (e.g., entities can belong to different, incompatible kinds or "phases" at different times or under different descriptions, governed by distinct persistence conditions).
      2.  *Comparatively* analyze whether the *reconstructed* ontological argument from the White Horse Dialogue exhibits a *structurally similar claim*: that combining whiteness with horseness forces the entity into a distinct "phase" or kind ("white horse") with incompatible membership conditions relative to the "horse" kind, thereby disrupting the latter's application.
      3.  **Crucial Limitation:** This comparison *explicitly does not* claim historical influence or direct equivalence. Its sole purpose is to test the *internal coherence and plausibility* of the reconstructed ontological claim by seeing if it aligns with a known, developed metaphysical framework. This helps articulate *what kind* of composition failure is being proposed.

  **4. Scope, Feasibility, Risks, and Payoff**

  *   **Scope & Feasibility (One Semester):**
      *   **Focused Core Text:** The primary object is the White Horse Dialogue itself. Secondary sources will be consulted only to understand the dialogue's immediate context within the Gongsun Longzi and basic School of Names concerns, *not* for exhaustive intellectual history.
      *   **Precise Comparison:** The phase-sortal comparison is narrowly defined as a conceptual tool for testing the reconstruction's coherence, not an investigation into the history of sortal concepts.
      *   **Manageable Output:** The core deliverable is a sustained philosophical argument defending the composition-failure reading based on textual analysis, culminating in a ~20-page paper. This is achievable by dedicating sequential phases to: close reading/reconstruction (Weeks 1-6), conceptual analysis & phase-sortal comparison (Weeks 7-10), synthesis and defense (Weeks 11-14).

  *   **Risk of Scope Creep/Collapse:**
      *   The primary risk is lapsing into broad intellectual history – e.g., extensively tracing Aristotelian influences (or lack thereof) in China, or surveying all possible interpretations of the School of Names. Mitigation: Strict adherence to the research question and methodology; constantly relating analysis back to the specific arguments within the White Horse Dialogue itself.
      *   A secondary risk is forcing the phase-sortal comparison into an anachronistic claim of equivalence. Mitigation: Explicit methodological framing of the comparison as a tool for testing coherence, not establishing historical connection.

  *   **Determinate Philosophical Payoff:**
      If successful, this project yields:
      1.  **A Novel Interpretation:** A robustly defended ontological reading of the White Horse Dialogue as proposing a radical form of property interaction and composition failure, distinct from logical, semantic, or rhetorical readings.
      2.  **Challenge to Presuppositions:** A demonstration that the dialogue's force lies partly in its potential rejection of substance-accident metaphysics, offering an alternative model (however nascent) where properties actively reconfigure kind-identity.
      3.  **Conceptual Clarification:** Articulation of "sortal invasion" as a specific mechanism for ontological composition failure, with potential resonance beyond this text.
      4.  **Reframing the School of Names:** Contribution to viewing the School not merely as logicians or sophists, but as engaging with profound, alternative metaphysical questions concerning the stability of kinds and the dynamics of property combination.

  **Conclusion:**
  This project offers a focused, feasible path to recovering a neglected ontological dimension within one of Chinese philosophy's most famous paradoxes. By meticulously reconstructing the White Horse Dialogue's internal reasoning to reveal arguments for sortal invasion and non-compositional dependence, and cautiously testing the coherence of this reconstruction against contemporary metaphysical concepts, it aims to demonstrate that the dialogue poses a more radical challenge to assumptions about objects, properties, and kinds than previously acknowledged. The payoff is a sharper, philosophically richer understanding of the text and its place in exploring the fragility of ontological composition.
