  - **Case 4 (Carbon tax):** Magnitude-cluelessness (economic impacts unclear, but sign likely net-positive vs. inaction) → **Act.**  
  - **Case 5 (Welfare research):** **Sign-cluelessness** (research might *increase* suffering via population dynamics). Principle says **don’t fund** (inaction).  

  ### Tension (2 vs 4):  
  - **Geoengineering (2)** risks catastrophic harm (sign reversal possible).  
  - **Carbon tax (4)** compares to *inaction’s known negative sign*; cluelessness is about degree of improvement, not reversal.  

