prompt: |-
  I got into a stupidly heated argument at Thanksgiving about whether my cousin is obligated to vote. She says her one vote is astronomically unlikely to swing anything so she might as well stay home, and my uncle shut her down with "what if everyone did that?" She shot back that everyone *isn't* doing that and won't, so who cares, and then everyone just talked past each other for twenty minutes. I keep running into this move — people deploy it about littering, free-riding on public transit, eating meat, whatever — and I've also noticed it gets treated as if it's just Kant for the masses, but then I took a philosophy course a few years back and remember Kant's actual universalizability tests being much weirder and more specific than "imagine everyone doing it and see if things go badly."

  So: can you lay out the distinct precise principles that "what if everyone did that?" could be standing for? I can gesture at some candidates — something like a genuinely Kantian test where the problem is a contradiction in willing or conceiving the universalized maxim, a more consequentialist generalization argument where the problem is just that bad results would follow if everyone did it, a fairness principle about not making an exception of yourself when you're counting on others to do their part, and maybe a causal claim that your behavior actually influences what others do — but I'm sure there are more and I'm sure I've mangled the Kant one. For each reading, say what kind of "what if" it's asking (logical, counterfactual, predictive?), whether it's a platitude, a substantive-but-defensible claim, or just false, and whether it actually delivers the conclusion my uncle wanted — i.e., that *this one person*, holding everyone else's actual behavior fixed, has a reason to vote. Please pay special attention to the objection my cousin would raise if she were cleverer: that for lots of these cases "everyone doing it" is either harmless, impossible, or so far-fetched that the thought experiment seems rigged, and that you can redescribe the maxim ("everyone whose vote has a less than one-in-a-billion chance of mattering stays home") to make any universalization come out fine.

  End by telling me which reading you think people who reach for the slogan in arguments like ours actually mean — maybe different people mean different ones — and whether the slogan is doing any real work or is just a rhetorical shortcut for something weaker.
reasoning: |-
  Okay, the user is asking about the "what if everyone did that?" argument they encountered during a Thanksgiving debate. Their cousin doesn't vote because she thinks her single vote won't make a difference, and their uncle countered with that universalization slogan. The user wants to unpack the different philosophical principles behind this common argument, especially since they recall Kant's actual approach being more complex.

  I need to break down the distinct principles that "what if everyone did that?" could represent. The user mentioned several candidates: Kantian universalizability, consequentialist generalization, fairness, and causal influence. I should elaborate on each, explaining what kind of "what if" scenario it invokes, whether it's plausible, and if it actually supports the uncle's point that one person should vote regardless of others.

  For Kant, it's not just about bad consequences but about logical contradictions in universalizing a maxim. I should clarify that Kant's test is about whether you can consistently will that everyone acts on your maxim. The cousin might counter by redefining her maxim narrowly to avoid the contradiction.

  The consequentialist version focuses on outcomes: if everyone acted that way, the result would be bad. But the cousin's objection here is spot-on—since not everyone will stop voting, the bad outcome isn't likely. This makes the argument feel weak in cases like voting where mass defection is improbable.

  Fairness is different: it's about free-riding on others' efforts. If you benefit from a system but don't contribute, that's unfair. This seems stronger for voting, as democracy relies on participation. The cousin might argue she doesn't benefit or that her non-participation doesn't harm the system, but that could be countered.

  Causal influence suggests your action might encourage others, but this is speculative. For voting, one person skipping probably doesn't start a trend, so it's not compelling here.

  The user also wants to know what people actually mean when they use this slogan. I think most deploy it intuitively, mixing fairness and consequences, without rigorous philosophy. It's often a rhetorical move to highlight collective responsibility, even if logically shaky for individual cases.

  I should structure each principle clearly: explain it, analyze the "what if" type, assess its validity, and check if it works for the voting case. I'll need to address the cousin's potential counters, especially how maxim-redescription might neutralize the test. Finally, I'll conclude with why people use this slogan and whether it holds water.
answer: |-
  You've nailed the core issues perfectly. This "what if everyone did that?" (WHEDT) move is incredibly common but philosophically messy, serving as a rhetorical Rorschach test where people project their own ethical intuitions onto it. Let's dissect the distinct principles it *could* represent, analyze them as you requested, and address your cousin's clever counter.

  Here are the main contenders:

  1.  **Kantian Universalizability (Categorical Imperative - Contradiction in Conception/Will):**
      *   **Principle:** The core of Kant's test. You must act only according to maxims (subjective rules) that you could, *without contradiction*, will to be a universal law. It's not about *consequences*, but logical consistency.
          *   **Contradiction in Conception:** Universalizing the maxim leads to a logical impossibility (e.g., universal lying destroys the concept of promising).
          *   **Contradiction in Will:** Universalizing the maxim creates a situation you *rationally cannot* will, as it undermines something essential you desire (e.g., universal non-helping means no one helps you when *you* need it).
      *   **"What If" Type:** **Logical/Conceptual.** It's a thought experiment: *Could* this maxim even *be* a universal law without internal contradiction or incoherence? What would happen *if* it *were* universalized?
      *   **Platitude/Substantive/False?** **Substantive-but-Defensible (with caveats).** Kantian ethics is a major, sophisticated system. However, its application is notoriously tricky (maxim formulation is crucial!), and its conclusions can be counterintuitive. Whether it delivers plausible moral obligations is debated.
      *   **Applies to Voting?** Uncle *might* argue:
          *   *Contradiction in Conception:* Universal non-voting destroys the concept of a democratic election. (But is voting *conceptually* necessary for democracy? Couldn't a small group vote? This is weak).
          *   *Contradiction in Will:* If everyone didn't vote, there would be no legitimate government or terrible policies, which your cousin cannot rationally will if she wants security, roads, etc. **This is the stronger Kantian move.**
      *   **Cousin's Counter:** She *redescribes her maxim* precisely: "I will not vote *in elections where my individual vote has a vanishingly small probability of affecting the outcome.*" Universalizing *this* maxim seems coherent: elections are still decided by the votes that *do* get cast. If everyone only abstained when their vote was irrelevant (which, statistically, is almost always true), the outcome would likely be the same. The *concept* of voting and elections survives. She might rationally will this world – the "important" voters still decide.
      *   **Delivers Uncle's Conclusion?** **Unlikely.** Kant's test focuses on the *maxim*, not the *act in isolation*. If cousin's maxim is redescribed narrowly (focusing on low-impact scenarios), it arguably passes the universalization test. Kant wouldn't necessarily condemn *her specific act* of non-voting in a safe seat.

  2.  **Consequentialist Generalization Argument (Rule Utilitarianism Lite):**
      *   **Principle:** The wrongness of the act lies in the *foreseeable bad consequences* that would occur *if* everyone (or a large number) performed similar acts in similar circumstances. It's about the *pattern* of behavior, not the single act in isolation.
      *   **"What If" Type:** **Predictive/Counterfactual.** It asks us to predict the likely outcome *if* the behavior became widespread. The "what if" is a heuristic to assess the *type* of behavior and its aggregate effects.
      *   **Platitude/Substantive/False?** **Platitude masquerading as Substance.** Taken literally ("*everyone* doing it"), it's often **false or irrelevant** for precisely your cousin's reason: *everyone won't do it*. The consequence of *her single act* is negligible. The *real* force comes from considering *scalability* or *marginal contribution* to a harmful pattern. "What if a *significant number* of people in your situation did that?" is more defensible but less rhetorically punchy.
      *   **Applies to Voting?** Uncle argues: "If everyone thought like you and didn't vote, democracy would collapse!" He's highlighting the catastrophic consequence of *mass* non-participation.
      *   **Cousin's Counter:** **Direct Hit.** "But everyone *isn't* doing that! My staying home *today* doesn't cause mass abstention. The election will happen just fine without me. The consequence of *my specific act* is effectively zero harm." She points out the gap between the universal counterfactual and the actual world.
      *   **Delivers Uncle's Conclusion?** **No.** This argument fundamentally addresses the *class* of actions, not the obligation of *this one actor* given the *actual* behavior of others. It explains why voting is *generally* good, but fails to show why *she*, in her specific low-impact situation, has a strong consequentialist reason *to* vote *this time*.

  3.  **Fairness/Reciprocity/Cooperation (Rule-Based or Contractualist):**
      *   **Principle:** The wrongness lies in benefiting from a cooperative scheme (like democracy, public goods, social norms) while refusing to bear one's fair share of the burdens required to sustain it (like voting, paying taxes, not littering). It's unfair to make an exception for oneself ("free-riding").
      *   **"What If" Type:** **Normative/Participatory.** It's less about predicting universal behavior and more about highlighting your *role* within an existing system that relies on widespread cooperation. The "what if" reveals the *principle* you'd be endorsing for yourself: "I get the benefits, but I don't have to contribute like others do."
      *   **Platitude/Substantive/False?** **Substantive-and-Defensible.** This taps into core intuitions about fairness, reciprocity, and the stability of cooperative systems. It avoids the pitfalls of the literal universal counterfactual.
      *   **Applies to Voting?** Uncle argues: "Democracy only works if enough people participate. You benefit from living in a (hopefully) stable, representative system. It's unfair for you to enjoy those benefits while shirking the minimal civic duty of voting that helps sustain it, especially when others *are* bearing that burden."
      *   **Cousin's Counter:** She can still try:
          *   *Redescription:* "I only free-ride *when my contribution is negligible*." But fairness often applies to *taking* the benefit regardless of the marginal impact of your *individual* contribution.
          *   *Reject Benefit:* "I don't benefit/don't care about the system." (Usually implausible or self-defeating).
          *   *Scale:* "My one abstention doesn't harm the system." (True, but fairness is about the *principle* of participation, not the causal impact of one act).
      *   **Delivers Uncle's Conclusion?** **Strongest Candidate for Yes.** This principle *can* generate a reason for *this one person* to vote, *even holding others' behavior fixed*, because the reason stems from fairness within the *existing* cooperative scheme. Her obligation arises from reciprocity towards those who *are* voting and contributing, and from the principle of not making an unjustified exception for herself. It bypasses the "but my vote doesn't matter" argument by shifting the ground to duty and fairness.

  4.  **Causal Influence/Slippery Slope (Empirical Claim):**
      *   **Principle:** Your individual act *does* have a non-negligible consequence because it causally influences others to act similarly, potentially triggering a chain reaction or normalization that *does* lead to the bad universal outcome. (E.g., "If I litter, others see it and think it's okay, so they litter too.").
      *   **"What If" Type:** **Predictive/Empirical.** It makes a claim about the actual causal effects of *this specific action* in the real world.
      *   **Platitude/Substantive/False?** **Often False or Highly Speculative.** For most small-scale individual acts (like one person not voting, littering once, skipping a fare), the causal influence on others is typically negligible or non-existent. This is generally a weak argument.
      *   **Applies to Voting?** Uncle argues: "If you don't vote, your friends/family might see that and decide not to vote either, and then their friends..." He claims her act *causes* a harmful trend.
      *   **Cousin's Counter:** **Easy Win.** "That's absurd. My staying home on election day doesn't influence anyone. No one knows or cares. There's no evidence one non-voter triggers a cascade." Highly implausible in the voting context.
      *   **Delivers Uncle's Conclusion?** **No.** The empirical claim is almost certainly false for voting non-participation. Even if true sometimes (e.g., a visible leader abstaining), it wouldn't apply to the average person.

  **What People Actually Mean & Is the Slogan Doing Work?**

  *   **What They Mean:** In heated dinner-table arguments like yours, people reaching for "WHEDT?" are **almost never invoking rigorous Kantian logic.** They are most often intuitively gesturing towards a **mix of #2 (Consequentialist Generalization - "look how bad it would be!") and #3 (Fairness - "you're being selfish/free-riding!")**, usually without clearly distinguishing them. The Kantian flavor (#1) gets mentioned because people vaguely know it's "philosophical," but the actual application is usually shallow.
  *   **Rhetorical Shortcut:** The slogan is **primarily a rhetorical shortcut.** It's punchy and *feels* like a knockdown argument ("See! You can't even *imagine* it!"). Its power comes from:
      1.  **Vividness:** Painting a dramatic picture of societal collapse or chaos grabs attention.
      2.  **Appeal to Collective Responsibility:** It taps into the sense that we're all in this together.
      3.  **Shaming Potential:** It implies the actor is selfish or short-sighted.
  *   **Does it Do Real Work?** **Rarely, on its own, for the individual case.** As your cousin intuitively grasped (and you've analyzed brilliantly), it crumbles under scrutiny when applied to genuinely low-impact individual actions:
      *   The literal universal counterfactual (#2) is irrelevant because it won't happen.
      *   The Kantian version (#1) is complex and vulnerable to maxim-redescription.
      *   The causal claim (#4) is usually false.
  *   **The Core:** The only principle that *potentially* survives scrutiny to deliver a reason for your cousin to vote, *despite* the low probability of her vote mattering, is **#3: Fairness/Reciprocity.** It shifts the focus from the *causal impact* of her single vote to her *role and obligations* within a beneficial cooperative system sustained by others' participation. The "WHEDT?" slogan is just a clumsy, often misleading, way to try and point towards this deeper principle of fairness. Your uncle might have had this intuition, but the slogan itself obscured it.

  **In short:** The "what if everyone did that?" move is usually rhetorical bluster. It mostly fails to prove your cousin has an obligation based *solely* on the consequences of *her* single non-vote. However, the *fairness* argument embedded within the intuition behind the slogan – that it's wrong to free-ride on a system sustained by others' civic participation – is the strongest contender for giving her a reason to vote anyway. Your philosophical instincts about the gap between the slogan and actual Kant (and the vulnerability to maxim-redescription) were spot on.
