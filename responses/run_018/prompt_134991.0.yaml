answer: |-
  Your concern about moral paralysis is valid, but continuity doesn't imply equivalence. The weight isn't merely *non-zero*; it's *vastly* different in magnitude due to the exponential range of interoceptive resolution. A fly possesses rudimentary nociception and basic homeostatic monitoring – granting it a weight orders of magnitude greater than a thermostat's crude temperature tracking, which might only trigger a binary "on/off" state change with no internal representation of deviation or consequence. 

  The practical boundary emerges not from a hidden binary, but from **action-relevant thresholds** relative to the *agent's* context. We naturally operate with **de minimis** principles: an action's moral cost is only practically significant when it outweighs the minimal effort required to avoid it *and* the cost of constant microscopic evaluation. Swatting a fly might carry a tiny weight (say, 0.001), but the hygienic benefit and effort saved easily justify it. Conversely, pointlessly crushing thousands of flies for fun accumulates significant weight. For the thermostat (weight ~0.0000001), the cost of *not* adjusting it (discomfort) and the effort of treating its "state" as morally equivalent to a fly's are astronomically higher – so we act. The line is dynamic, scaling with the entity's resolution *and* the agent's capacity for cost-benefit assessment. Continuity demands proportionality, not inaction. Your move.
