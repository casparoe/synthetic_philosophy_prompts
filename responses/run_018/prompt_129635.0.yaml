  But their argument cleverly attacks the foundations: if pleasure and pain are perfectly measurable on one scale (commensurable), then any threshold seems arbitrary. Why L and not slightly less? And if they're not commensurable—if severe pain is a totally different kind of thing than pleasure—then how can we even say "no amount" of pleasure outweighs it? That phrase assumes comparability. 

  Hmm... their self-doubt centers on steps 3→4 and 5. They suspect maybe incommensurability doesn't completely block comparison, or perhaps the threshold isn't as rigid as they're assuming. And they mentioned their prof dropped the term "threshold elasticity"—that feels key. 

  Let me think about elasticity... What if the threshold isn't a sharp line but a zone where the moral weight of suffering accelerates? Like how economists see diminishing returns, but reversed? That could dodge the "arbitrary cutoff" charge. And for incommensurability—maybe pleasure and pain are comparable enough for practical purposes, even if not perfectly reducible to numbers. Like comparing Picasso to Beethoven? We can still make rough judgments. 

  Their attachments matter here: they want to keep the core intuition of uncompensatable suffering (1), and reject the idea that pleasure/pain are utterly alien. Elastic thresholds and soft incommensurability serve both goals. The cost? Admitting moral math is messier than pure utilitarianism pretends. But maybe that's honest—philosophy of suffering should be uncomfortable. 

