answer: |-
  **Bottom line:** The parliamentary analogy helpfully reframes akrasia as a structural issue, but its core conclusion—treating it as engineering, not character—largely survives the disanalogies, *provided* we focus on mechanism design over reifying the 'institutions'.

  **Correspondence Table:**

  | Parliamentary Term | Psychological Analog                      | Notes                                                                 |
  | :----------------- | :---------------------------------------- | :-------------------------------------------------------------------- |
  | **Speaker**        | The integrated self / executive function  | Attempts to manage debate & enact decisions. Often weak.            |
  | **Dissolution**    | Sleep, unconsciousness, radical disruption | States where coherent 'debate' ceases.                               |
  | **Quorum**         | Threshold of attention/arousal for action | Minimum level of cognitive engagement needed for 'reason' to convene. |
  | **Lower House**    | Immediate impulses/desires/appetites      | Dominated by present stimuli, hyperbolic discounting. Holds veto via action. |
  | **Upper House**    | Deliberative reason/long-term goals       | Plans, values, future consequences. Lacks direct enforcement power. |
  | **Veto (Lower)**   | Acting against better judgment           | Impulse wins by initiating action despite reason's 'vote' against. |
  | **Constitution**   | Cognitive architecture/dispositions       | The 'rules' governing interaction between systems.                   |
  | **Ulysses Contract**| Precommitment devices                    | External constraints binding future action, limiting lower house options. |

  **Where the Analogy Breaks Down:**

  1.  **Non-Linearity (Hyperbolic Discounting):** Parliament votes are (ideally) consistent. Hyperbolic discounting means the *relative power* of the Lower House vs. Upper House shifts drastically with temporal proximity. As a reward/punishment nears, the impulsive 'Lower House' gains overwhelming, non-linear influence, akin to its voting power ballooning right before a decision – not a stable constitutional feature. The 'veto' isn't a fixed rule; it's an erupting bias.
  2.  **Reductionism & Persistence (Parfit):** The analogy implies a *persistent institution* (the self-as-parliament). Parfit's reductionism suggests there is no enduring 'building' or fixed 'members'. There are only successive, causally linked psychological states ('rooms'). Today's 'Upper House' is a different temporal entity from tomorrow's. Constitutional reform assumes a stable entity *to* reform, which reductionism denies. There's no single Speaker over time.
  3.  **Fluid Roles:** MPs have fixed roles. Psychological states are fluid. A strong desire (Lower House) can *become* a valued project (Upper House goal). 'Reason' can be hijacked to rationalise impulse. The chambers aren't distinct entities.
  4.  **Enforcement:** A real parliament has mechanisms to enforce the Upper House's will (police, courts). The psychological 'Upper House' has no intrinsic enforcement power – its 'decrees' are mere thoughts unless they engage motivation or external scaffolds.

  **Does the Conclusion Survive?**

  *   **Yes, robustly - but shift the focus:** The core conclusion—akrasia is best tackled as a design/engineering problem, not just moral condemnation—*does* survive, precisely *because* the disanalogies highlight why willpower alone ("be a better Speaker!") fails.
      *   **Hyperbolic Discounting:** Recognising its non-linearity *demands* engineering solutions (precommitments, environmental control) that work *around* the predictable bias surge, rather than futilely trying to vote it down in the moment. This *is* institutional design for volatile constituents.
      *   **Parfitian Reductionism:** If there's no persistent self, moralising at a temporally distant 'self' for weakness is incoherent. However, successive selves *are* causally connected. Designing mechanisms *now* (Ulysses contracts, habit formation, choice architecture) that constrain or guide *future* temporal selves is perfectly coherent and rational within reductionism. It's about creating beneficial causal chains for the succession of selves, not reforming a phantom institution. The 'engineering' targets the *process* linking the rooms, not the building.
  *   **The Analogy's Value & Limit:** The parliamentary model usefully displaces blame and highlights conflicting interests *within* the agent. Its breakdowns show *why* simplistic 'try harder' moralism fails and *why* external, mechanistic solutions (the 'engineering') are necessary: the 'constitution' is flawed, the 'chambers' are unstable, and the 'Upper House' lacks an army. **Treating akrasia as an engineering problem (designing scaffolds, constraints, and environments) remains the pragmatic response, even when we abandon the metaphor of a single, stable, bicameral parliament governing a persistent self.** The need for 'institutional design' translates into the need for *cognitive and behavioural* architecture design.
