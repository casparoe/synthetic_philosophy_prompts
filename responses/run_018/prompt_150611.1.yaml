  This argument flips the usual critique - it's not that machines can't be Darwinian, but that computational evolution isn't Darwinian enough because it can't escape the teleology we build into it. The autonomy of natural selection is what makes Darwin's inversion radical, and that's precisely what's missing in the Turing version.
answer: |-
  Here’s the argument stripped down, leaning into the causal autonomy gap:

  Yeah, the Darwin-Turing parallel gets wheeled out a lot: Darwin gives you complex design without a designing mind, Turing gives you behavioral competence without a conscious mind. Two inversions, same vibe. But it’s a surface-level similarity that masks a deep structural opposition once you crack open how selection actually *operates*.

  Start with Darwin: Natural selection’s blindness isn’t just poetic – it’s ontological. There is **no fitness function pre-specified in nature**. Zip. Nada. Fitness isn’t a *driver*; it’s a **retrospective statistical artifact**. It’s what we *call* the aggregate result of countless organism-environment interactions, failed reproductions, and plain dumb luck *after the fact*. The "goal" of increased fitness? It doesn’t exist as a causal force pulling evolution forward. Variation is undirected, the environment just *is* (it doesn’t "evaluate"), and differential survival/reproduction happens as a brute causal outcome. The inversion works *because* it’s genuinely mindless and **causally autonomous** – the direction emerges bottom-up from the system’s dynamics interacting with a contingent world. No hidden teleology.

  Now flip to Turing’s inversion in computational models – especially the so-called "evolutionary" ones like GAs. Here’s where the analogy snaps. Every single "evolutionary algorithm" **requires an exogenously fixed fitness function**. The programmer defines the target metric (solve the maze fastest, minimize weight, match this pattern). This function isn’t emergent; it’s baked-in *before* the pseudo-Darwinian process even starts. Selection isn’t blind; it’s laser-guided by this external criterion. The algorithm churns, selects *based on this imposed score*, and voila – competence without the machine comprehending the task.

  **This is the critical inversion running backwards:** Turing’s competence-without-comprehension **depends entirely on smuggling teleology in through the fitness landscape**. The "goal" is explicitly defined *outside* the system by the comprehending programmer. The machine’s "selection" isn’t autonomous; it’s executing a teleological script written by human comprehension. It mimics Darwinian *mechanisms* but lacks the Darwinian *causal structure*.

  So the analogy breaks not because machines arent conscious (that’s a different debate), but because **artificial evolutionary processes lack causal autonomy**. They’re heteronomous – driven by an external mind setting the target. Treating "fitness" in these models like the statistical artifact it is in nature is a **category mistake**. In the computer, fitness *is* a causal driver – the literal score determining survival in the next generation. In nature, "fitness" is a label we stick on the survivors *after* they survived for contingent reasons. Mistaking the computational score for the natural statistical shadow collapses the whole comparison.

  Darwin’s inversion is radical because it shows complex order emerging from truly blind, bottom-up, *autonomous* causality. Turing’s inversion (in this context) is clever engineering that *simulates* competence by *outsourcing the teleology*. One eliminates the need for a designer/mind *within the causal process itself*; the other just hides the designing mind in the setup parameters. They dont pull the same trick. Darwin’s process is free of hidden goals; the computational one is built on them. That’s why the analogy is fundamentally broken.
