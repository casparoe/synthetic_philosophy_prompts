  Whereas in every genetic algorithm, the programmer defines the fitness function upfront. The selection pressure comes from outside the system. This is a fundamental ontological difference - artificial evolution has teleology baked in through the coded fitness landscape. 

  The Turing inversion only works because we've hidden human comprehension in the setup. The machine appears competent without understanding, but only because we gave it the goal. Darwin's system has no such hidden goal - the "goal" is just survival emerging from blind variation and environmental interaction. 

