answer: |-
  Below is a decision tree designed to help students identify their position on the extended mind thesis, starting from a shared minimal commitment (functionalism about cognition and familiarity with the Otto/notebook case). The tree uses **4 branch questions** to cleanly separate **5 positions**, ordered to tackle fundamental disagreements first. Each question is phrased plainly to avoid jargon, and positions include their most awkward commitment. Unoccupied nodes and potential collapses are flagged at the end.  

  ---

  ### **Extended Mind Thesis Decision Tree**  
  *Start here, assuming Otto’s notebook is intelligible as a challenge to brain-bound cognition, and functionalism is on the table.*  

  **Q1:** Is there a special "mark of the mental" (e.g., non-derived meaning, intrinsic purpose) that *only* brain processes can possess, making tools like notebooks *fundamentally* different?  
  - **YES** → *Internalism is likely* (Go to Q2).  
  - **NO** → *Externalism is plausible* (Go to Q3).  

  **Q2 (for Internalists):** Do external tools (e.g., Otto’s notebook) play a major causal role in *enabling* thought, even if they aren’t "part of" the mind?  
  - **YES** → **Embedded Internalism**  
    - *Awkward commitment*: Must explain why Otto’s notebook isn’t part of his memory despite functioning like biological memory.  
  - **NO** → **Robust Internalism**  
    - *Awkward commitment*: Must downplay tools (e.g., notebooks, maps) as irrelevant to cognition, even when used deeply.  

  **Q3 (for Externalists):** Must an external resource (e.g., a notebook) replicate the *exact functional role* of a brain process (e.g., speed, reliability) to count as cognitive?  
  - **YES** → **First-Wave Extended Mind** (Parity Principle)  
    - *Awkward commitment*: Risks "cognitive bloat" (e.g., your phone’s contacts become literal parts of your memory).  
  - **NO** → *Complementarity or enactivism?* (Go to Q4).  

  **Q4:** Is cognition primarily a *dynamic interaction* between an organism and its environment, blurring the line between "inner" and "outer"?  
  - **YES** → **Enactivist View**  
    - *Awkward commitment*: Must explain high-level cognition (e.g., math) without inner representations.  
  - **NO** → **Second-Wave Extended Mind** (Complementarity)  
    - *Awkward commitment*: Struggles to explain why not every deeply integrated tool (e.g., a calculator) becomes part of the mind.  

  ---

  ### **Notes**  
  1. **Unoccupied Node?**  
     - *After Q3 → NO and Q4 → NO*: This combination (rejects parity, rejects dynamic interaction) is **unexplored but coherent**. It might describe a "complementarity-only" externalism that avoids enactivism, but no major position holds this.  
     - *All other nodes map to named positions.*  

  2. **Warning: Potential Collapse**  
     - **Embedded Internalism vs. Enactivism**: These *may* collapse in practice if a student:  
       - Answers Q1 ambiguously (e.g., "tools lack the mark but the mark isn’t important"), or  
       - Sees "scaffolding" (embedded) and "dynamic coupling" (enactivist) as interchangeable.  
     - *Why?* Both emphasize environmental reliance, but diverge on Q1 (enactivists reject the "mark," embedded internalists require it). The tree *can* separate them, but real-world answers may be muddy.  

  3. **Design Choices**  
     - **Skipped questions** (e.g., coupling-constitution fallacy, constant availability) didn’t earn a branch: they’re position-specific *arguments* (e.g., parity theorists use availability to curb bloat; complementarity theorists reject it as ad hoc).  
     - **Order** prioritizes the deepest split (internalism vs. externalism via Q1), then separates externalist camps by functional equivalence (Q3) and process ontology (Q4).  

  ---

  ### **Tree Overview**  
  ```mermaid
  graph TD
      Start[Q1: Is there a 'mark of the mental' only the brain has?] -->|YES| Q2
      Start -->|NO| Q3
      Q2[Q2: Do tools play a major causal role?] -->|YES| Embedded[Embedded Internalism]
      Q2 -->|NO| Robust[Robust Internalism]
      Q3[Q3: Must tools replicate brain functions exactly?] -->|YES| FirstWave[First-Wave Extended Mind]
      Q3 -->|NO| Q4
      Q4[Q4: Is cognition a dynamic organism-environment interaction?] -->|YES| Enactivism[Enactivist View]
      Q4 -->|NO| SecondWave[Second-Wave Extended Mind]
  ```

  This fits on **2 pages** and uses plain language for seminar groups with uneven reading. Print as a flowchart or use with numbered steps (e.g., "If YES to Q1, answer Q2...").
