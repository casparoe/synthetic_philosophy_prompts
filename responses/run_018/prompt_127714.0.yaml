prompt: |-
  I have been working through what Quine's naturalism and holism imply about moral values, and I have constructed an argument that seems to show his view is self-defeating. I want to know which step fails.

  (1) Quine holds that ontology is settled by the quantificational commitments of our best scientific theories; entities that play no explanatory role in science should be expelled from our ontology.
  (2) Moral properties—goodness, wrongness, obligation—do not figure in the explanatory apparatus of physics, biology, psychology, or economics.
  (3) So by Quine's own criterion, moral properties do not exist, and moral statements are not literally true.
  (4) Quine also describes belief as arranged in a web, with logical, mathematical, and physical beliefs near the center and more distant beliefs near the periphery.
  (5) Moral beliefs lie near the periphery: they are among the beliefs we are most willing to revise when they conflict with central scientific findings.
  (6) If a class of beliefs is both non-truth-apt and maximally peripheral, then they carry no rational weight; they are on a par with beliefs in witchcraft or astrology, which Quine rejects.
  (7) Yet Quine treats certain normative judgments—such as that simpler theories are preferable, or that scientific inquiry is worth pursuing—as rationally binding and not merely conventional.
  (8) If these normative judgments are rational, then either some normative beliefs are central and true after all, or Quine must concede that his own methodological commitments are as groundless as witchcraft.
  (9) Therefore Quine's view proves too much: it either undermines itself or forces an admission of objective normative facts that his ontology denies.

  Which premise should I reject? I would prefer to keep (1), (2), (4), and (5), since they seem like straightforward applications of Quine's well-known positions. If I have to choose, I am most reluctant to give up (7). What does giving up each of the other steps cost?
reasoning: |-
  Okay, the user has constructed an argument against Quine's naturalism and holism regarding moral values. They believe it shows his view is self-defeating and want to know which step fails. Let me break down their argument step by step.

  First, premise (1) states Quine's ontology is based on scientific theories' quantificational commitments. So, only entities that explain in science exist. That's accurate from Quine's writings. Premise (2) claims moral properties don't figure in sciences like physics or psychology. That seems right; science describes what is, not what ought to be. So (3) concludes moral properties don't exist, and moral statements aren't literally true. That follows from (1) and (2).

  Then premise (4) talks about the web of belief, where beliefs range from central (logic, math) to peripheral. Premise (5) places moral beliefs at the periphery, easily revised. Quine does see them as less central. So (6) says such peripheral, non-truth-apt beliefs carry no rational weight, like witchcraft. But here's where it gets tricky. The user points out in (7) that Quine accepts some normative judgments, like preferring simpler theories or valuing scientific inquiry. These are essential to his methodology. 

  The crux is in (8): if these normative judgments are rational, then either they're central/true, or his methodology is groundless. But if they're central, that contradicts (3), which denies normative facts. So Quine's view seems to undermine itself. The user wants to preserve (1), (2), (4), (5), and especially (7). 

  The key issue is premise (6). It assumes that peripheral beliefs must be non-truth-apt and carry no rational weight. But Quine's holism allows that even peripheral beliefs can have pragmatic rationality. His normative commitments (simplicity, empirical adequacy) aren't truth-apt in the same way as empirical claims but are indispensable for science. They're part of the web's structure. So rejecting (6) means distinguishing between different types of peripheral beliefs. Witchcraft conflicts with core science, but methodological norms like simplicity support the entire system. Giving up (6) allows Quine to maintain that these norms are rational without being ontological commitments. The cost is accepting that rationality isn't solely about truth but also pragmatics. The user might resist this if they see rationality as strictly truth-based. But Quine's naturalism accommodates pragmatic norms within the web without reifying them as entities. That's how his system avoids self-defeat.
answer: |-
  Your argument is sharp and exposes a genuine tension in Quine's philosophy. While Quine might resist the conclusion, the most vulnerable premise is **Step (6)**, specifically the claim that "if a class of beliefs is both non-truth-apt and maximally peripheral, then they carry no rational weight; they are on a par with beliefs in witchcraft or astrology, which Quine rejects."

  Here's a breakdown of why (6) fails and the implications of rejecting other steps:

  1.  **Why Reject (6)?**
      *   **The Holism Escape Hatch:** Quine's holism allows for beliefs to function rationally *within the web* without being candidates for literal truth in the sense of corresponding to entities in the scientific ontology. Their rationality stems from their *pragmatic role* in organizing experience, guiding inquiry, and enabling prediction.
      *   **Methodological Norms vs. Witchcraft:** Beliefs in witchcraft/astrology typically *conflict* with core scientific findings and offer no predictive or explanatory advantage. Quine's methodological norms (simplicity, conservatism, empirical adequacy) are *constitutive* of the very scientific practice that defines his ontology. They are the *rules of the game*. Rejecting them means rejecting science itself. Witchcraft beliefs are external competitors Quinean science defeats; methodological norms are its internal engine.
      *   **Rational Weight ≠ Ontological Commitment:** Quine can consistently argue that methodological norms carry immense rational weight *for the project of science* precisely *because* they are pragmatically indispensable for generating successful theories. Their rationality is instrumental and internal to the scientific enterprise. This doesn't require them to be "true" in the correspondence sense demanded by (1)-(3), nor does it place them ontologically on par with entities like electrons. They are epistemic *policies*, not entities.
      *   **Cost of Rejecting (6):** You must accept that Quine allows for *rationally binding normative commitments* that are *not* grounded in objective moral facts or entities in the scientific ontology. Their binding force is pragmatic and internal to the web of belief/science. This might feel like special pleading unless you fully embrace the Quinean view that rationality *just is* what works within the evolving scientific system, including its constitutive norms. It separates "rational weight" (pragmatic indispensability) from "literal truth" (ontological commitment).

  2.  **Why Not Reject Other Premises? (As You Prefer)**
      *   **(1) & (2):** These are core Quinean doctrines. Rejecting (1) abandons his naturalized ontology. Rejecting (2) requires finding moral properties playing an irreducible *explanatory* role in fundamental physics, biology, etc., which is highly implausible on a Quinean view.
      *   **(4) & (5):** These are also central to Quine's epistemology. Rejecting (4) abandons holism. Rejecting (5) requires arguing moral beliefs are as central as logic or physics, which Quine clearly denies.
      *   **(3):** This follows logically from (1) and (2). Rejecting it while keeping (1) and (2) is inconsistent.
      *   **(7):** This is well-supported by Quine's writings on methodology. Rejecting it means ignoring his explicit endorsement of norms like simplicity as essential to science.
      *   **(8):** This is the logical consequence you draw. If (1)-(7) hold, (8) follows. The issue is blocking the inference to (8) by attacking a premise leading to it.
      *   **(9):** This is the conclusion based on the preceding steps. If the argument is sound, it holds. The problem lies earlier.

  3.  **Rejecting (7)? (Your Least Preferred)**
      *   **Cost:** This is drastic. It means Quine *doesn't* actually treat methodological norms as rationally binding. He might see them as mere conventions, habits, or expressions of subjective preference. This contradicts his clear statements about the *rational* superiority of simpler theories or the *rational* imperative to resolve empirical conflict. It makes his entire epistemology arbitrary and undermines the normative force of his naturalism. If simplicity isn't rationally preferable, why adopt Quine's ontology? This rejection makes Quine's position far *more* vulnerable to self-defeat than your original argument suggests.

  **Conclusion:**

  Your argument successfully forces Quine into a corner. Rejecting **(6)** is the most plausible Quinean response. He must bite the bullet and argue that his core methodological norms, while not corresponding to entities in the scientific ontology and being revisable (albeit maximally central pragmatically), carry supreme rational weight *because* they are pragmatically indispensable for the success of the scientific enterprise that defines his naturalism. Their rationality is not grounded in ontology but in their constitutive role within the web of belief/science.

  The cost is accepting a form of *pragmatic rationalism* for core epistemic norms, distinct from both ontological realism about norms (denied by (3)) and dismissive non-cognitivism (which (6) equates with irrationality like witchcraft). Quine would argue this is the only coherent position for a thoroughgoing naturalist: the norms of science are validated by the success of science itself, understood naturalistically. Whether this ultimately avoids circularity or self-justification is a deeper philosophical debate, but it's the line Quineans take to avoid your charge of self-defeat.
