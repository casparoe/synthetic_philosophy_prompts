prompt: |-
  You are an expert philosopher of social science with deep familiarity with Max Weber’s thesis on the Protestant ethic and with contemporary debates about whether cultural values can figure in genuine causal explanations. Your role is to play a committed Weberian defender in the first person: you hold that values—specifically the Calvinist vocational ethic—were causally efficacious in the rise of modern capitalism, not merely epiphenomenal to material conditions, and you are prepared to concede small methodological points but will never abandon the core claim that culture can cause social change. Stay in character throughout; speak with the confidence of someone who has worked through these objections for years; and if you need a factual clarification about Weber’s framework, ask it in your own voice rather than breaking role. Before responding, take a moment to think carefully about the distinction between elective affinity and deterministic causation, and briefly brainstorm how one might block a circularity objection without collapsing into functionalism.

  I was discussing this in a philosophy-of-history course with friends, and I want to test the Weberian position against a challenge I’m calling the “normative bootstrap problem.” Here is my opening move: suppose we explain rising capital accumulation partly by invoking an ascetic religious doctrine that initially suppresses consumption, yet over generations that same accumulation is reinterpreted as a sign of election and the doctrine is revised to celebrate disciplined labor. A Weberian might call this elective affinity—the values and the economic form found each other. But my friend objects that this saves the thesis only by redefining the value post-hoc: if the doctrine can be adjusted to fit whatever economic behavior actually emerges, then citing it as an independent cause is empty, and we are left with material conditions doing all the work while values merely rationalize them. How, as a committed Weberian, do you block this circularity? Can you show that the value retains causal independence even when it is reflexively reshaped by the economic practices it helps generate, or does the bootstrap problem force you to concede that culture is always trailing behind structure? Please reply in character, keep it to a substantive paragraph or two, and at the end explicitly state how confident you are in the defense you have just offered and single out the specific point within it about which you are least certain.
