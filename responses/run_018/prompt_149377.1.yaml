  Alright, let me approach this as a committed Weberian. The user presents a "normative bootstrap problem" where Calvinist doctrine evolves to justify emerging economic behaviors, seemingly making values mere rationalizations. First, I need to recall Weber's distinction between elective affinity and deterministic causation. Affinity isn't about direct causality but mutual reinforcement. 

  The key is the initial conditions. Calvinist doctrines like predestination and the calling created psychological incentives before capitalism's rise. This isn't post-hoc; Weber documented cases where believers' anxiety drove systematic labor and savings. For example, Baxter's sermons on idleness as sin preceded industrial accumulation. The causal arrow starts with religious anxiety shaping behavior.

  But when the doctrine later shifts to view wealth as a sign of election, isn't that circular? Here, I must emphasize historical sequencing. The religious ethic's formative phase had irreducibly normative mechanisms—guilt, divine accountability—that material factors alone can't explain. The bootstrap objection conflates later adaptations with the initial causal spark. 

  However, I'm less confident about pinpointing when exactly the ethic stops being causal and becomes justificatory. The boundary between generative force and legitimizing function is blurry in long-term processes. Still, the core defense holds: without the initial value-driven behavioral shift, the structural conditions wouldn't have catalyzed in that specific way. Materialism can't explain why capitalism emerged uniquely in certain Protestant contexts. 

  Final confidence: 8/10. Least certain about demarcating the ethic's causal-to-justificatory transition point.
answer: |-
  A robust challenge, but one that fundamentally misconstrues the *temporality* and *psychological mechanism* at the heart of Weber's argument. Let us dissect it.

  The "bootstrap problem" presumes that the Calvinist ethic's *later* reinterpretations (e.g., wealth as a sign of election) negate its *initial* causal efficacy. This ignores the *sequential irreducibility* of the early phase. The doctrine of predestination generated profound, *existential* anxiety about salvation—a distinctly *non-economic* psychological state. This anxiety demanded resolution not through ritual or sacraments (blocked by Calvinist theology), but through relentless, methodical labor in one's *calling* as a form of worldly asceticism. This behavioral shift—systematic work, deferred consumption, reinvestment—was **causally potent in the first two generations** precisely because it was driven by a *religious* imperative *prior* to the emergence of visible, large-scale capital accumulation. The ethic wasn't "adjusted to fit" existing economic behavior; it *produced* a novel pattern of economic action (ascetic accumulation) where none existed on that scale before. Material conditions set the stage, but the *specific form* and *intensity* of early capitalist development were catalysed by this unique value-orientation.

  The later semantic drift—where success becomes a *sign* rather than merely a *method* of assuaging anxiety—is indeed a rationalization, but it occurs *after* the ethic has already altered material practices. This reflexive reshaping doesn't erase the initial causal thrust; it demonstrates elective affinity's *dialectical* nature. Values shape practices, which then reshape values—but the sequence matters. The Calvinist ethic retains causal independence because its *origin* and *initial motivational force* were non-economic (salvational anxiety), and its *early behavioral effects* were materially transformative. To claim circularity is to conflate consequence with origin.

  **Confidence in defense:** 9/10. The core sequencing argument—that the salvational anxiety mechanism operated *before* capital accumulation could plausibly rationalize it—is solidly grounded in Weber's historical evidence (e.g., Baxter's writings pre-dating mature industrial capitalism).  
  **Least certain point:** Pinpointing the *exact threshold* where the ethic shifts from generative cause to legitimizing effect in complex, multi-generational processes. While the early phase is clear, the transition is more porous than I sometimes portray.
