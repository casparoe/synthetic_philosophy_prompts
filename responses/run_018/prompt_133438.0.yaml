  Third, institutional relationships. Long-term trust between legislators enables compromise on contentious issues. The constant churn in their model would reset relationships every cycle, making durable coalitions impossible. The apprenticeship structure also creates power imbalance - unelected mentors could wield undue influence without accountability.

  I should concede some stagnation exists in current systems but emphasize that rotation sacrifices governance capacity for purity. The epistemic functions simply can't be replicated without sustained engagement. Maybe mention how short terms would leave legislators vulnerable to lobbyists who do possess long-term expertise.

