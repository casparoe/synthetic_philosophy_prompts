prompt: |-
  i'm a phd student in philosophy of science but i sit on a hospital ethics commitee every thursday, and we keep getting proposals where someone wants to delay an intervention to "gather more data" and nobody knows how to decide if that's legit. I want you to turn Good's theorem — the value of information thing — into a step-by-step procedure my committee can run in 20 minutes with no calculus. Give me the ordered questions: what prior do we state in writing, how do we sketch the loss function without inventing fake dollars, where do we check if the expected value of information exceeds the cost of waiting (including a seasonal decay penalty if delay makes the result useless), and how do we spot "epistemic rent-seeking" where a stakeholder is just using information requests to stall. For each step say what counts as a sufficient answer and where the procedure stops with a clear "no — approve now" vs "yes — delay is rational" vs "this is a values call, not a math call." Make sure it handles disagreements between clinicians and budget officers with thier different loss functions, and flag the spots where judgment is unavoidable. Then apply it to three cases: delaying a triage protocol for a 200-person study; refusing to wait on a cheap supplement; and a flu-vaccine rollout where the procedure outputs "collect more data" right as the season peaks — that's the one I won't like, show me exactly where it breaks and hands back to human judgment. Finally, say what the procedure can't do: settle prior disputes, handle purely symbolic harms, or stop information from being weaponized politically.
reasoning: |-
  We are going to create a step-by-step procedure based on Good's theorem (Value of Information) for the hospital ethics committee. The goal is to have a structured, time-bound (20 minutes) process that avoids calculus and complex math. The procedure will be broken down into ordered questions, with clear stopping points and decision outputs (approve now, delay is rational, or values call). We will address how to handle different loss functions (e.g., clinicians vs. budget officers) and flag unavoidable judgment calls.

  ### Key Concepts in Simple Terms
  1. **Prior Probability**: The best current estimate of the probability of the outcome of interest (e.g., success of an intervention) based on existing evidence.
  2. **Loss Function**: A way to quantify the harm (or cost) of making a wrong decision. We avoid fake dollars by using relative scales (e.g., on a scale of 1 to 10) and considering different perspectives.
  3. **Expected Value of Information (EVI)**: The expected reduction in loss from having more information. We compare this to the cost of waiting (including time decay and opportunity costs).
  4. **Epistemic Rent-Seeking**: When a stakeholder requests more data not to improve the decision but to delay (e.g., to avoid an undesired outcome).

  ### Step-by-Step Procedure (20 Minutes Max)

  **Step 0: Define the Decision Context (2 minutes)**
  - **Question**: What is the intervention, and what are we deciding? (e.g., approve now vs. delay to collect more data)
  - **Sufficient Answer**: A clear statement of the intervention and the alternative actions. Example: "We are deciding whether to delay the implementation of a new triage protocol for 3 months to run a 200-person study."
  - **Stopping Point**: If there is no realistic way to gather more data (e.g., the opportunity is fleeting), then stop and output "approve now" or "reject now" based on current knowledge.

  **Step 1: State the Prior Probability (3 minutes)**
  - **Question**: What is the current best estimate (prior) of the probability that the intervention is beneficial? (e.g., 70% chance it improves outcomes)
  - **How to do it without calculus**:
    - Use a simple scale: 0% to 100%. Base it on existing evidence (e.g., pilot studies, similar interventions, expert consensus).
    - If there is disagreement, note the range (e.g., Clinicians: 80%, Budget: 40%) and move to Step 2 to handle different loss functions.
  - **Sufficient Answer**: A single number (if consensus) or a range (if disagreement). If the prior is very high (e.g., >90%) or very low (e.g., <10%), then the decision might be clear without more data.
  - **Stopping Point**: If the prior is extreme (very high or very low) and the loss function is symmetric (making the best guess obvious), then output "approve now" (if high) or "reject now" (if low). Otherwise, proceed.

  **Step 2: Sketch the Loss Function (4 minutes)**
  - **Question**: What are the consequences of being wrong? (e.g., if we approve a harmful intervention or reject a beneficial one)
  - **How to do it without fake dollars**:
    - Use a relative harm scale (1 to 10) for two types of errors:
      - **Type I Error (False Positive)**: Approving a harmful or ineffective intervention.
      - **Type II Error (False Negative)**: Rejecting a beneficial intervention.
    - Have each stakeholder group (e.g., clinicians, budget officers) assign their own harm scores for each error type. This captures their different loss functions.
    - Example: 
      - Clinicians: Harm of Type I (approving harmful) = 8, Harm of Type II (rejecting beneficial) = 9.
      - Budget: Harm of Type I = 7 (due to wasted resources), Harm of Type II = 5 (missed savings).
    - Compute the expected loss of approving and rejecting *without more data* for each group. The expected loss for approving is: `(1 - prior) * Harm_TypeI`. The expected loss for rejecting is: `prior * Harm_TypeII`.
  - **Sufficient Answer**: Two harm scores (Type I and Type II) per stakeholder group and the expected losses for each action (approve/reject).
  - **Stopping Point**: If one action has a much lower expected loss across all groups (e.g., approve: expected loss 2, reject: 8), then output "approve now" (or "reject now"). If the expected losses are close, proceed.

  **Step 3: Estimate the Value of Information and Cost of Waiting (5 minutes)**
  - **Question**: How much could the additional data reduce our expected loss? And what is the cost of waiting?
  - **How to estimate EVI without calculus**:
    - **Simplified EVI**: The maximum possible reduction in expected loss from having perfect information is the difference between the expected loss of the best action without data and the expected loss with perfect information. However, we are getting a finite sample. Use a rule of thumb: 
      - EVI ≈ (Current expected loss of best action) * (uncertainty reduction from data). 
      - Uncertainty reduction: If the study is well-designed, it might reduce the uncertainty by half (if the sample size is adequate). Alternatively, use the potential to flip the decision: if the prior is near 50% and the study might push it above 70% or below 30%, then EVI is high.
    - Alternatively, use a simple table based on prior and study size (precomputed for common scenarios, see below).
  - **Cost of Waiting**: 
    - Direct costs (e.g., $10,000 to run the study).
    - Opportunity cost: harm from delay (e.g., if the intervention is beneficial, how many people are harmed by not having it during the delay?).
    - Seasonal decay: if the result becomes less useful over time (e.g., a flu vaccine study delayed until after flu season). Assign a decay factor (e.g., 50% loss in value if delayed past peak).
    - Total cost of waiting = direct cost + (expected harm from delay) + (decay penalty).
  - **Rule of Thumb Table for EVI (relative to expected loss without data)**:
    - Prior near 50% and large study: EVI ≈ 30-50% of current expected loss.
    - Prior near 70% and medium study: EVI ≈ 10-20%.
    - Prior near 90%: EVI <5% (usually not worth it).
  - **Sufficient Answer**: 
    - EVI: "Low" (<10% of current expected loss), "Medium" (10-30%), or "High" (>30%).
    - Cost of waiting: "Low", "Medium", or "High" (relative to the stakes of the decision).
  - **Decision Rule**: If EVI > Cost of waiting, then delay is rational. Otherwise, approve now (or reject) based on current best action.

  **Step 4: Check for Epistemic Rent-Seeking (3 minutes)**
  - **Question**: Is there evidence that the request for more data is motivated by a desire to delay rather than to improve the decision?
  - **How to spot**:
    - The stakeholder requesting delay has a known bias (e.g., financial conflict, ideological opposition).
    - The requested data is not directly relevant to the decision (e.g., asking for long-term outcomes when the intervention is for acute care).
    - The stakeholder cannot articulate how the data would change their mind (e.g., "We just need more data" without a threshold).
    - The same data has been requested and provided before without resolving the issue.
  - **Sufficient Answer**: If two or more red flags are present, then mark as potential rent-seeking.
  - **Stopping Point**: If rent-seeking is likely, then output "approve now" unless the EVI is clearly high. Otherwise, proceed with the decision from Step 3.

  **Step 5: Make the Call (3 minutes)**
  - **Outputs**:
    - **Approve Now (or Reject Now)**: If the prior is extreme, if the expected loss without data is clearly lower for one action, or if EVI < cost of waiting (including rent-seeking concerns).
    - **Delay is Rational**: If EVI > cost of waiting and no rent-seeking is detected.
    - **Values Call**: If there is irreconcilable disagreement on the prior or the loss function (e.g., clinicians and budget have fundamentally different harm scores that lead to opposite decisions) and EVI is not clearly worth the cost. This requires ethical deliberation, not math.

  ### Handling Disagreements
  - **Step 1 (Prior)**: If disagreement, use the average or the most pessimistic (to be safe). Or note the range and proceed.
  - **Step 2 (Loss Function)**: Do not average across groups. Calculate expected losses separately. Then in Step 3, if EVI is high for at least one group and the cost of waiting is low, then delay might benefit that group. But if one group's expected loss without data is very high and the other low, then it's a values call.

  ### Application to Cases

  **Case 1: Delaying a triage protocol for a 200-person study**
  - **Step 0**: Intervention is a new triage protocol. We can delay for 3 months to run a 200-person study.
  - **Step 1**: Prior: 60% chance it's beneficial (based on a small pilot).
  - **Step 2**: 
    - Clinicians: Harm Type I (approve bad) = 8, Harm Type II (reject good) = 9. 
      - Expected loss approve: (1-0.6)*8 = 3.2
      - Expected loss reject: 0.6*9 = 5.4 → Best without data: approve (loss 3.2)
    - Budget: Harm Type I = 7 (waste), Harm Type II = 4 (missed savings). 
      - Approve: (0.4)*7=2.8, Reject: 0.6*4=2.4 → Best without data: reject (loss 2.4)
  - **Step 3**: 
    - EVI: Prior 60% and medium study → EVI ≈ 20% of current expected loss. For clinicians: 20% of 3.2≈0.64. For budget: 20% of 2.4≈0.48.
    - Cost of waiting: Direct cost $50k, opportunity cost (if beneficial, 3 months delay harms patients) ≈ 2 (on a 10 scale, estimated by clinicians). Total cost ≈ 5 (in relative units, scaled to harm scores). 
    - Since EVI (0.64 and 0.48) < cost (5), then EVI < cost.
  - **Step 4**: No rent-seeking flags.
  - **Output**: Approve now? But note: the clinicians and budget have different best actions. This is a values call. However, the EVI is low compared to cost, so we don't delay. The committee must decide based on values.

  **Case 2: Refusing to wait on a cheap supplement**
  - **Step 0**: Cheap supplement, delay for a small study (cost $5k) for 1 month.
  - **Step 1**: Prior: 55% chance it's beneficial (weak evidence).
  - **Step 2**: 
    - Clinicians: Harm Type I=3 (low risk), Harm Type II=5 (missed benefit). 
      - Approve: (0.45)*3=1.35, Reject: 0.55*5=2.75 → Best: approve (1.35)
    - Budget: Harm Type I=2 (low cost), Harm Type II=2 (low savings). 
      - Approve: 0.45*2=0.9, Reject: 0.55*2=1.1 → Best: approve (0.9)
  - **Step 3**: 
    - EVI: Prior 55% and small study → EVI ≈ 10% of 1.35≈0.135 (clinicians) and 10% of 0.9≈0.09 (budget).
    - Cost of waiting: $5k (low) + opportunity cost (1 month delay of a cheap supplement) ≈ 0.5 (if beneficial). Total cost ≈ 0.6.
    - EVI (0.135 and 0.09) < cost (0.6) → not worth it.
  - **Step 4**: No rent-seeking.
  - **Output**: Approve now.

  **Case 3: Flu-vaccine rollout (delay until after peak)**
  - **Step 0**: New flu vaccine, delay for 2 months to run a study, but flu season peaks in 1 month.
  - **Step 1**: Prior: 65% chance it's better than current vaccine.
  - **Step 2**:
    - Clinicians: Harm Type I=7 (if worse, people get sick), Harm Type II=8 (missed opportunity to reduce cases). 
      - Approve: (0.35)*7=2.45, Reject: 0.65*8=5.2 → Best: approve (2.45)
    - Budget: Harm Type I=8 (wasted money and lawsuits), Harm Type II=6 (missed savings). 
      - Approve: 0.35*8=2.8, Reject: 0.65*6=3.9 → Best: approve (2.8)
  - **Step 3**:
    - EVI: Prior 65% and medium study → EVI ≈ 15% of 2.45≈0.37 (clinicians) and 15% of 2.8≈0.42 (budget).
    - Cost of waiting: Direct cost $100k + opportunity cost (if beneficial, 2 months delay during peak season) → high harm. Clinicians estimate: 7 (on their scale). Decay: after peak, the vaccine is 50% less useful → total cost of waiting ≈ 7 (harm) * 0.5 (decay) + direct cost (converted to harm units, say 1) = 3.5+1=4.5.
    - EVI (0.37, 0.42) < cost (4.5) → not worth it? But wait: the EVI might be higher because the prior is not that high and the stakes are high. Let's check: the potential reduction in loss might be higher if the study could change the decision. Currently, both groups favor approval. If the study found the vaccine was worse, we would avoid a loss of 2.45 (clinicians) and 2.8 (budget). The probability of such a finding? About 35%. So the expected savings from the study is at least 0.35 * min(2.45,2.8) ≈ 0.35*2.45≈0.86. This is a better estimate of EVI (which is higher than our rule of thumb). 
    - However, the cost of waiting (4.5) is still higher than 0.86 → not worth it.
  - **Step 4**: No rent-seeking.
  - **Output**: Approve now. But note: the committee might feel uneasy because 65% is not that high. However, the high cost of waiting (due to seasonal decay) makes delay irrational.

  **Where it breaks in Case 3**: The rule of thumb for EVI was too low. We improved by considering the expected loss reduction from the study. But the committee must use judgment to assign the EVI. Also, if the prior was 55% instead of 65%, then the expected loss without data would be higher and the EVI might exceed the cost. The procedure flags that EVI estimation is a judgment call.

  ### What the Procedure Can't Do
  1. **Settle Prior Disputes**: If experts fundamentally disagree on the prior, the procedure uses an average or range, but cannot resolve the dispute.
  2. **Handle Purely Symbolic Harms**: If a harm is symbolic (e.g., loss of trust) and cannot be scaled relative to other harms, it breaks the loss function scaling.
  3. **Stop Information Weaponization**: If data requests are politically motivated, the rent-seeking check helps, but it can't prevent the use of the procedure itself as a political tool.
  4. **Address Extreme Uncertainties**: When the prior is based on almost no evidence, the EVI might be underestimated by the rule of thumb.
  5. **Non-Quantifiable Values**: If some values (e.g., equity, dignity) cannot be reduced to a harm score, then Step 2 becomes a values call.

  ### Final Procedure Summary
  - **Time**: 20 minutes.
  - **Outputs**: Approve/Reject now, Delay is rational, or Values call.
  - **Strengths**: Forces explicit reasoning about uncertainty, harms, and costs. Handles multiple stakeholders.
  - **Weaknesses**: Relies on subjective estimates (especially EVI and cost of waiting). Requires practice to do in 20 minutes.

  This procedure provides a structured way to make these decisions, but it is not a substitute for ethical deliberation when values conflict.
answer: |-
  Below is a step-by-step procedure based on **Good's theorem (Value of Information)** tailored for your hospital ethics committee. It’s designed for **20-minute assessments**, avoids calculus, uses qualitative scales instead of fake dollars, and flags judgment calls. The procedure outputs one of three decisions: **"No — approve now"**, **"Yes — delay is rational"**, or **"Values call — not math"**. It handles stakeholder disagreements (e.g., clinicians vs. budget officers) and includes checks for epistemic rent-seeking.

  ---

  ### **The 20-Minute Value of Information Procedure**
  **Ordered Questions with Time Limits**  
  *(Total: 20 minutes; use a timer for each step)*

  1. **Define the Decision (2 min)**  
     - **Question:** "What is the intervention, and what binary choice are we debating? (e.g., approve/delay)"  
     - **Sufficient answer:** Clear description of the intervention (e.g., "new triage protocol") and the proposed delay (e.g., "3 months to gather 200-patient data").  
     - **Stop if:** Delay is impossible (e.g., emergency) → **"No — approve now"**.

  2. **State the Prior Probability (3 min)**  
     - **Question:** "What is the **current probability** (0–100%) that the intervention is beneficial? Base this on existing evidence."  
     - **How to state without math:**  
       - Clinicians and budget officers each provide their estimate (e.g., clinicians: 70%, budget: 40%).  
       - **Default prior:** Use the **lower of the two estimates** if they disagree (pessimistic safety check).  
     - **Sufficient answer:** Single number (if consensus) or range (if disagreement).  
     - **Stop if:** Prior is extreme (>90% or <10%) → **"No — approve/reject now"**.  
     - **Judgment flag:** Disagreements here require clinical/budget reconciliation later.

  3. **Sketch the Loss Function (4 min)**  
     - **Question:** "What’s the **harm if we’re wrong**? Rate two errors on a 1–10 scale:  
       - **Type I (False Positive):** Approving a harmful/useless intervention.  
       - **Type II (False Negative):** Rejecting a beneficial intervention."  
     - **How to avoid fake dollars:**  
       - Clinicians focus on **patient harm** (e.g., death = 10, minor side effect = 3).  
       - Budget officers focus on **resource waste** (e.g., bankrupting hospital = 10, small cost = 2).  
       - **No averaging:** Record scores separately (e.g., Clinicians: Type I=8, Type II=6; Budget: Type I=4, Type II=9).  
     - **Sufficient answer:** Two scores per stakeholder.  
     - **Judgment flag:** If scores diverge wildly (e.g., clinicians’ Type I >> budget’s), note for Step 5.

  4. **Estimate Value of Information vs. Cost of Waiting (5 min)**  
     - **Question:** "Could new data change our decision? And what’s the **full cost of waiting**?"  
     - **Steps:**  
       - **A. Value of Information (EVI):**  
         - Use the **"Decision Flip" rule:**  
           *"If the prior is 30–70%, AND new data could realistically shift it by >20% (e.g., 50% → 30% or 70%), EVI is HIGH. Else LOW."*  
         - *Sufficient:* "HIGH" if uncertain and data could change minds; "LOW" if prior is solid.  
       - **B. Cost of Waiting:**  
         - **Direct cost:** Time/resources to gather data (e.g., "2 staff-months").  
         - **Opportunity cost:** Harm from delay (e.g., "10 deaths/month if beneficial").  
         - **Seasonal decay:** Penalty if delay reduces usefulness (e.g., "After flu season, vaccine data useless → 50% value loss").  
         - **Score:** 1–10 scale (1 = negligible, 10 = catastrophic).  
       - **C. Compare:** "Is EVI > Cost of Waiting?"  
     - **Stop if:**  
       - EVI ≤ Cost → **"No — approve now"**.  
       - EVI > Cost → proceed to Step 5.  
     - **Judgment flag:** Seasonal decay and opportunity cost require clinical input.

  5. **Epistemic Rent-Seeking Check (3 min)**  
     - **Question:** "Is this a **stall tactic**? Look for red flags:"  
       - Stakeholder can’t specify **what data would change their mind**.  
       - Requested data is **irrelevant** (e.g., long-term outcomes for acute crisis).  
       - History of **repeated delays** for similar proposals.  
     - **Sufficient evidence:** 2+ red flags = likely rent-seeking.  
     - **Stop if:** Rent-seeking detected → **"No — approve now"**. Else → proceed.

  6. **Final Decision (3 min)**  
     - **Outputs:**  
       - All prior steps point to delay → **"Yes — delay is rational"**.  
       - Stuck on irreconcilable stakeholder priorities → **"Values call — not math"**.  
       - Any "Stop if" triggered → **"No — approve now"**.  
     - **Handling disagreements:**  
       - Clinicians/budget deadlock on loss function? Defer to patient harm as tiebreaker.  
       - Prior dispute? Default to lower estimate (safety-first).

  ---

  ### **Application to Your Three Cases**
  **Case 1: Delaying a triage protocol for a 200-person study**  
  - **Step 1:** Intervention = new triage protocol; delay = 3 months for data.  
  - **Step 2:** Clinicians say prior = 60%, budget says 30% → **use 30%** (pessimistic).  
  - **Step 3:**  
    - Clinicians: Type I harm (approve bad protocol) = 8 (patient risk), Type II (reject good) = 4.  
    - Budget: Type I = 3 (costs), Type II = 2.  
  - **Step 4:**  
    - EVI: Prior (30%) is in 30–70% → **HIGH** (data could shift to 10% or 50%).  
    - Cost: Delay = 3 months → opportunity cost (e.g., 5 deaths if beneficial) = 7; decay = 0 → total cost = 7.  
    - EVI (HIGH) > Cost (7) → proceed.  
  - **Step 5:** No rent-seeking flags.  
  - **Output:** **"Yes — delay is rational"** (EVI justifies cost).

  **Case 2: Refusing to wait on a cheap supplement**  
  - **Step 1:** Intervention = dietary supplement; delay = 2 months for data.  
  - **Step 2:** Prior = 55% (weak evidence).  
  - **Step 3:**  
    - Clinicians: Type I = 3 (low risk), Type II = 2.  
    - Budget: Type I = 1 (cheap), Type II = 1.  
  - **Step 4:**  
    - EVI: Prior 55% → **LOW** (unlikely to shift far from 50%).  
    - Cost: Opportunity cost = 1 (minor benefit if delayed); decay = 0 → total cost = 1.  
    - EVI (LOW) ≤ Cost (1) → **Stop**.  
  - **Output:** **"No — approve now"** (EVI too low).

  **Case 3: Flu vaccine rollout delay into peak season**  
  - **Step 1:** Intervention = new vaccine; delay = 6 weeks for data (would miss peak).  
  - **Step 2:** Prior = 65% (moderate evidence).  
  - **Step 3:**  
    - Clinicians: Type I = 9 (harm if ineffective), Type II = 8 (missed prevention).  
    - Budget: Type I = 6 (wasted doses), Type II = 3.  
  - **Step 4:**  
    - **EVI:** Prior 65% → **MEDIUM** (could shift to 45% or 85%).  
    - **Cost:** Opportunity cost = 8 (deaths if delayed); decay = 50% (post-peak useless) → total cost = 8 × 1.5 = 12.  
    - EVI (MEDIUM) < Cost (12) → **Stop**.  
  - **Output:** **"No — approve now"** (cost of waiting too high).  
  - **Where it breaks:**  
    - **Judgment call:** If clinicians argue EVI is HIGH (e.g., "65% is unreliable!"), but the **seasonal decay penalty** (50%) dominates. Procedure outputs "No" but hands back to humans if:  
      *"Committee must override if clinical urgency outweighs decay (e.g., pandemic risk). Values call: Is preventing unknown harm worth missing the season?"*  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Settle prior disputes:** If clinicians/budget fundamentally disagree on evidence quality, this requires expert deliberation, not math.  
  2. **Handle symbolic harms:** E.g., "loss of trust" without measurable outcomes.  
  3. **Stop political weaponization:** If data requests are adversarial (e.g., "gather data until policy changes"), rent-seeking checks help, but won’t resolve bad faith.  
  4. **Non-quantifiable tradeoffs:** E.g., equity concerns ("this data excludes rural clinics") require ethical discussion.  
  5. **Dynamic uncertainties:** If new data affects future options (e.g., adaptive trials), the simplified EVI may understate value.  

  ---

  **Final Tip:** Use a worksheet with fields for each step. For contentious cases, vote on scores (1–10) to save time. The procedure forces explicit reasoning, but human judgment is irreplaceable for values, urgency, and power dynamics.
