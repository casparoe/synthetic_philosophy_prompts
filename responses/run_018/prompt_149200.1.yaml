prompt: |-
  I just got out of this long, exhausting argument with my friend about wether being blunt is actually more moral than being polite, like Dutch directness versus Japanese indirectness and wether white lies are ever okay. She kept saying that if you soften the truth to spare feelings you're treating the other person like a child, and I was like okay but also if you're brutally honest you ignore that social trust needs some smoothing or people just shut down. Anyway I'm on my university's cross-cultural research ethics board and we have a concrete case for Thursday that hits this exact tension, so I need a memo I can circulate before the meeting.

  The case: we run a joint Dutch-Japanese lab collaberation, and there's a dispute over feedback norms. The Dutch PI, Dr. Van Dijk, told a grad student her methodology was "fundamentally broken and not salvageable," and the student dropped out. Meanwhile the Japanese co-PI, Dr. Tanaka, had been telling the same student for months that her work was "interesting and might develop further," which she took as encouragement, so she wasted half a year on a dead end before learning the Dutch PI's actual view. Now both sides complain — the Dutch side says Japanese indirectness caused real epistemic harm and violated a duty of honesty; the Japanese side says Dutch bluntness caused dignitary harm and violated our charter's "respectful collaboration" clause. Our charter says feedback should be "both truthful and culturally sensitive" but doesn't say what to do when those clash. I need you to draft the board's recommendation memo — pick either prioritizing directness, prioritizing indirectness, or some concrete procedural fix — with a clear course of action and a time frame (like implement by next semester). The memo should have the bottom line up front, then reasoning, and it needs to take the strongest argument on the losing side seriously, not just dismiss it. Also please weave in my friend's idea about "communicative debt" — that every softened message creates an obligation to correct eventually, and failure to correct is a kind of theft of the other person's time — I'm not sure if that supports directness or undermines it, but address it. Keep it tight: max 350 words, no citations or reading lists, and write it like an actual document I could send, not like a philosophy essay. Oh and please don't just restate the charter; I need a real recommendation with teeth.
reasoning: |-
  Okay, the user is dealing with a cross-cultural ethics dilemma in a Dutch-Japanese research collaboration. They need a memo for their university's ethics board addressing conflicting feedback norms that led to a student dropping out. 

  First, I need to understand the core tension: Dutch directness caused dignitary harm while Japanese indirectness caused epistemic harm. The charter requires both truthfulness and cultural sensitivity, but offers no solution when they conflict. The user also wants their friend's "communicative debt" concept woven in - that softened truths create an obligation for eventual correction.

  Hmm, the memo must be practical with teeth - no vague restating of principles. Options are prioritizing directness, indirectness, or a procedural fix. Prioritizing either culture would likely backfire. The procedural solution seems strongest: creating a shared feedback protocol that satisfies both ethical concerns.

  The communicative debt concept actually supports this middle path - it acknowledges indirect communication isn't inherently dishonest if paired with timely correction mechanisms. The wasted six months happened precisely because Tanaka never fulfilled the debt obligation.

  Key elements for the memo:
  - Bottom-line up front: mandatory feedback protocol by next semester
  - Name the core problem: unmanaged cultural divergence
  - Concrete steps: dual-stage feedback, timeframe requirements, mediation training
  - Acknowledge the losing side: Van Dijk's epistemic concerns are valid, hence the 48-hour correction rule
  - Use "communicative debt" to explain why Tanaka's approach failed ethically

  Word count is tight (350 max), so every phrase must pull weight. Tone should be institutional but actionable - this isn't philosophy but operational policy. The teeth come from hard deadlines ("implement by next semester") and mandatory training.

  Also noting the user's personal stake - they just had that argument about bluntness vs politeness. The memo indirectly answers their debate: neither approach is inherently superior, but systems must prevent harm from either extreme.
answer: |-
  **MEMORANDUM**  
  **TO:** Cross-Cultural Research Ethics Board  
  **FROM:** [Your Name/Board Chair]  
  **DATE:** [Current Date]  
  **SUBJECT:** Mandatory Feedback Protocol for Joint Collaborations (Implementation: Start of Next Semester)  

  **BOTTOM LINE:** Implement a dual-stage feedback protocol requiring all PIs to (1) deliver core critiques privately within 48 hours via a standardized template ensuring clarity, and (2) discuss cultural delivery norms in quarterly alignment meetings. Non-compliance triggers mediation.  

  **REASONING:**  
  The core failure was unmanaged cultural divergence, not inherent flaws in directness or indirectness. Dr. Van Dijk’s bluntness caused preventable dignitary harm, violating respectful collaboration. Conversely, Dr. Tanaka’s sustained indirectness created severe "communicative debt" — softening truth without timely correction deprived the student of agency, wasting six months and causing epistemic harm. Honesty requires not just factual accuracy, but ensuring comprehension.  

  **STRONGEST LOSING ARGUMENT ACKNOWLEDGED:**  
  The Dutch position rightly emphasizes that ambiguity can be epistemically violent. Permitting indefinite indirectness risks systemic inefficiency and exploitation of trust. Truth *must* reach the recipient.  

  **PROCEDURAL FIX:**  
  1.  **Template-Driven Initial Feedback:** All critical feedback given privately via a secure form with checkboxes:  
      -   "Core issue: Methodology/Data/Analysis [Select]"  
      -   "Urgency: Requires Immediate Revision (≤2 weeks) / Fundamental Restructure (Project Halt Advised)"  
      -   "Support Offered: Redesign Meeting / Alternative Project / Other: ______"  
      *Why:* Forces unambiguous truth-telling (addressing Dutch concern) while depersonalizing critique.  
  2.  **48-Hour Debrief Mandate:** After template delivery, the PI must meet the recipient within 48 hours to discuss delivery style preferences ("How can I best share tough feedback with you?").  
  3.  **Quarterly Cultural Alignment:** PIs/teams jointly review feedback incidents and adjust norms, documenting agreements (e.g., "Use template first for major issues," "Tanaka lab may add encouraging preface if core critique is clear by Step 1").  
  4.  **Mediation:** Failure to use template or repeated complaints triggers board-appointed mediation.  

  **ADDRESSING COMMUNICATIVE DEBT:**  
  This protocol explicitly discharges debt: The template provides the owed truth upfront. Cultural sensitivity is addressed *after* clarity, not *instead* of it. Tanaka’s "interesting" comments would have required immediate template follow-up, preventing harm.  

  **TIMELINE:**  
  - Draft template & mediation process by [Date - 2 weeks from now].  
  - Board vote at next meeting.  
  - Full implementation: **First day of next semester.** Training sessions mandatory for all joint-project PIs/staff.  

  **// End Memo //**  
  *(Word Count: 325)*
