  Based on your friend's stated views and verdicts from your discussion, she is likely using the Brier score (quadratic scoring rule) to evaluate credences. The Brier score is a strictly proper scoring rule that aligns with her emphasis on coherence, the superiority of matching probabilities to evidence (e.g., the 60% reliable witness), and the bounded nature of inaccuracy (avoiding "infinitely bad" scores for certainty and wrongness). It also explains her rejection of logarithmic scoring, which does not penalize incoherent credences (as in verdict 3) and would treat all forecasters equally in the party case since they have the same credence on the true outcome.

  ### Candidate Scoring Rules and Their Fit with Verdicts 1-6
  - **Brier score (quadratic loss)**: For a true outcome \(i\), the score is \((1 - p_i)^2 + \sum_{j \neq i} p_j^2\), where lower scores are better (more accurate). This rule:
    - Encourages coherence (verdict 3): Incoherent credences are dominated by coherent ones.
    - Rewards higher credence on true outcomes (verdict 4).
    - Supports conditionalization as accuracy-maximizing (verdict 5).
    - Is bounded (verdict 6): Certainty and wrongness gives a score of at least 1, but not infinite.
    - Fails to incorporate "wrong nearby" intuition: It treats all false outcomes equally, regardless of similarity to the truth.
    - Fits all verdicts cleanly.

  - **Logarithmic score**: Score is \(-\ln(p_i)\) for true outcome \(i\), where lower scores are better. This rule:
    - Does not fit verdict 3: It does not penalize incoherence and can reward incoherent credences if they have higher \(p_i\) for the true outcome.
    - Fits verdicts 1, 2, 4, 5, and 6 (if avoiding \(p_i=0\) for possible outcomes), but not 3.
    - In the party case, all forecasters have identical scores since \(p_i\) is the same for the true outcome.

  - **Other rules (e.g., spherical score)**: The spherical score \(p_i / \sqrt{\sum p_j^2}\) could fit, but it behaves similarly to Brier in ordering and shares its limitations regarding "wrong nearby." Brier is more commonly associated with veritism due to its simplicity and direct interpretation as quadratic loss.

  No single rule incorporates the "wrong nearby" intuition (e.g., off by one vs. off by a thousand jellybeans) into the scoring, as this would require a distance-based component (e.g., CRPS for ordered categories). However, your friend's verdicts (1-6) do not reference such a component, and the Brier score fits all veridicts without it. If she intended to include "wrong nearby," verdict 4 might be inconsistent, as it focuses solely on credence for the true outcome without considering similarity of false outcomes.

  ### Evaluation of the Three Forecasters with Brier Score
  In the party case:
  - True outcome: 20–24 (22 people attended).
  - Forecasters:
    - **A**: \(p = (0.4, 0.3, 0.3)\) for (20–24, 25–29, 100+)
    - **B**: \(p = (0.4, 0.6, 0.0)\) (assuming nothing on 100+ implies \(p=0\))
    - **C**: \(p = (0.4, 0.1, 0.5)\)

  Brier score calculation for true outcome (20–24):
  - **A**: \((1 - 0.4)^2 + (0 - 0.3)^2 + (0 - 0.3)^2 = 0.36 + 0.09 + 0.09 = 0.54\)
  - **B**: \((1 - 0.4)^2 + (0 - 0.6)^2 + (0 - 0.0)^2 = 0.36 + 0.36 + 0 = 0.72\)
  - **C**: \((1 - 0.4)^2 + (0 - 0.1)^2 + (0 - 0.5)^2 = 0.36 + 0.01 + 0.25 = 0.62\)

  Scores (lower is better):
  - A: 0.54 (best)
  - C: 0.62 (middle, 0.08 worse than A)
  - B: 0.72 (worst, 0.18 worse than A)

  **Prediction**: Your friend would say forecaster A did best, C did middle, and B did worst. This is because Brier score depends on the sum of squared probabilities for false outcomes. For fixed \(p_i\) on the true outcome, the score is minimized when false probabilities are spread evenly (as in A), rather than concentrated (B) or skewed toward a distant outcome (C). The "wrong nearby" intuition does not affect this, as Brier treats 25–29 and 100+ equally as false categories.

  ### Case to Settle the Scoring Rule
  To test whether she incorporates "wrong nearby" (distance-based scoring), present a case with:
  - **Outcomes**: Three ordered categories, e.g., jellybeans in a jar: 0–100, 101–200, 201–1000.
  - **True outcome**: 50 (in 0–100).
  - **Forecasters**:
    - **X**: \(p = (0.4, 0.6, 0.0)\) (high on adjacent false outcome).
    - **Y**: \(p = (0.4, 0.0, 0.6)\) (high on distant false outcome).
  - With Brier, both have the same score: \((1-0.4)^2 + (0-0.6)^2 + 0 = 0.72\) for X; \((1-0.4)^2 + 0 + (0-0.6)^2 = 0.72\) for Y.
  - If she says X did better (for assigning to "nearby" false), she uses a distance-based rule like CRPS. If equal, she uses categorical Brier.

