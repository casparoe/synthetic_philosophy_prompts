prompt: |-
  hey, i'm putting together a handout for my archives-and-power grad seminar and need a taxonomy tree — not a bibliography, just the sorting logic. i want to classify positions on what archival silence actually is, beyond the usual 'who got left out' framing.

  build it as a decision tree with four split nodes, each phrased as a concrete question a student can answer without knowing the theorist labels:
  1. is an archive basically a container with missing files, or is absence structurally part of what makes it an archive? (treat the second option as live, call it 'constitutive absence' if you want)
  2. is every silence traceable to an exercise of power, or can some be neutral accidents — decay, random loss, never-written?
  3. is our obligation to silent subjects mainly epistemic (we should recover truth) or political (we should change future documentation)?
  4. does mass digitization reduce silence, or just shift its topology?

  each leaf gets a label: use real camp names where they exist — Foucauldian, old-school empiricist historians, Derrida-adjacent archive-fever types — or 'unnamed' plus one sentence on the view's most awkward commitment. i especially want you to flag the combination where absence is constitutive, power is not the cause, and digitization makes the gap worse; call that the 'negative provenance' position even if nobody defends it, and tell me why it's unexplored.

  make sure each branch is clearly seperate and that the tree ends in 6-8 leaves max. no citations, no reading lists — my students cant access half the databases anyway, and i want this answerable from reasoning alone. phrase the nodes around concrete cases, like: if a census record is blank, do we read it as missing data or as evidence of exclusion?
reasoning: |-
