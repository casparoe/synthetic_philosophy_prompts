prompt: |-
  I've been collecting verdicts about when my present credence should defer to the credence I expect to hold later, and I want to know whether a single principle captures them. (1) I give 0.8 now that a deal will close, partly on evidence I know I will have forgotten by next year; I expect next-year-me to give it 0.6. I think I should stay at 0.8, not lower myself to 0.6. (2) A doctor tells me a test result tomorrow will move my credence in an illness from 0.5 to either 0.1 or 0.9, with each outcome equally likely now. I think today I should already be at 0.5. (3) I will soon take a drug that reliably produces baseless overconfidence, and I predict my credence in some claim will go from 0.5 now to 0.95 while drugged. I think I should not defer to the drugged credence. (4) Tomorrow I will reread all the evidence and think for hours; I will retain everything I now know, and I predict that by the end my credence will have moved from 0.6 to 0.3. I feel I should move only partway—say to 0.45—because I cannot now see the reason for the drop, yet I cannot dismiss the future me who has thought longer and no less carefully. (5) If I expected a future me who was simply better informed and no less rational than I now am, I would defer entirely. My rough principle is to defer to a future self just when that self is at least as informed and no less rational, and never when the future credence is produced by anticipated irrationality—but that principle either misdescribes case (4) or leaves it without a target. What principle, if any, captures these verdicts? Which of them would a clean principle force me to revise, and is a complicated principle that preserves all of them worth it? Please also say which argument or consideration would most likely change your mind, and where your reasoning about these cases is most likely to fail.
reasoning: |-
  Okay, let me start by unpacking the user's query. They've presented five scenarios about when to defer to future credences. Each case tests different aspects of rational belief updating. The user wants a unified principle but suspects their rough attempt might miss the mark, especially in case (4). 

  Hmm, first I need to parse each verdict carefully. Case (1) involves forgotten evidence—present self has unique information. Case (2) is about predictable belief shifts via new evidence, suggesting current credence should align with expected future value. Case (3) is straightforward: drug-induced irrationality shouldn't be deferred to. Case (4) is the sticky one—partial deference despite equal current/future rationality. Case (5) sets the ideal: full deference when future self is strictly superior. 

  The user’s proposed principle (defer only if equally/more informed and rational) conflicts with (4), where both conditions seem met yet partial deference feels right. That’s the crux. Maybe I should consider *why* (4) feels different. Ah—because the future self isn’t just "better" but has processed the same information more deeply. The key might be distinguishing between *access* to information and *processing* of information. 

  Epistemic peers who’ve thought longer... partial deference makes sense here. Like splitting the difference between current and expected belief. But how to formalize that? Total evidence principles won’t work—same evidence, different processing. Rational reflection principles (Christensen, Elga) might help, but they assume no rationality differences. 

  Wait—what if we reframe it as *epistemic access*? Case (1): future self lacks evidence (lower access). Case (3): rationality corrupted (invalid access). Case (4): same access but future self invested cognitive labor. So maybe the principle should demand identical information *and* rationality *and*... equal cognitive effort? But that feels clunky. 

  Alternative: deference should mirror the *reliability* of the future credence. In (4), present self knows future credence comes from deeper reflection but can’t verify why—so weighted average. But how to quantify reliability without circularity? 

  User’s deeper need: a rule that’s both precise and practically applicable. They might be frustrated by philosophical "it depends" answers. But forcing a clean principle might oversimplify—notice how (4) resists categorization. Maybe the real answer is that no binary principle works; we need tiers (full/partial/no deference). 

  If pressed, I’d say: defer fully only if future self has strictly more evidence *or* identical evidence + strictly more rationality. For identical evidence + equal rationality (like (4)), defer partially. But "partially" is vague. That’s why my final suggestion uses "weighted by confidence in future rationality." 

  Biggest weakness? Case (4) exposes that "rationality" isn’t binary. We can be equally rational yet disagree after effort—this challenges idealized Bayesian models. If the user rejects partial deference in (4), everything snaps into place. But their intuition there feels strong, so the principle must bend. 

  User’s identity? Likely philosophy student or researcher—probing normative epistemology. Unspoken need: resolving cognitive dissonance between idealized rationality (where (4) *should* demand full deference) and human intuition. They might want ammunition for an academic paper. 

  Mind-change trigger: if someone argued that in (4), the future self’s deeper processing *constitutes* new evidence (e.g., "I noticed nuances I previously overlooked"), then full deference could be defended. That’d collapse the distinction between information and processing. My principle fails there. 

  Final take: The user’s cases reveal that information and rationality are necessary but insufficient conditions. We need a third axis—processing depth—and that’s messy. Hence the compromise: a principle that defaults to full deference for superior future selves but allows partial adjustments when peer disagreement persists despite equal grounds.
answer: |-
  Your cases reveal deep tensions in deference principles, but a refined principle can capture all five verdicts without contradiction. Here's a unified framework:

  ### Principle of Epistemic Fidelity
  **Defer to a future credence iff:**
  - **(a)** The future self has *at least your current total evidence* (no information loss),  
  - **(b)** The future self is *at least as rational as you currently are* (no rationality deficit),  
  - **(c)** *You lack decisive reason to distrust the belief-updating process* linking present to future credence.

  **Deference degree:**  
  - If (a) & (b) & (c): Full deference  
  - If (a) & (b) fail: No deference  
  - If (a) & (b) hold but (c) is ambiguous: **Partial deference** weighted by confidence in the process.

  ---

  ### Application to Your Cases
  1. **Deal closing (0.8 → 0.6)**  
     - ❌ (a) fails: Future self lacks evidence (forgotten details).  
     - **Verdict:** *No deference* → Stay at 0.8. ✓  

  2. **Medical test (0.5 → 0.1/0.9)**  
     - (a) & (b) hold (future self has more evidence, same rationality),  
     - (c) holds (process is reliable evidence-updating).  
     - **Verdict:** *Full deference to expectation*: 0.5 = (0.1 + 0.9)/2. ✓  

  3. **Drug-induced overconfidence (0.5 → 0.95)**  
     - (b) fails: Future self is less rational (impaired cognition).  
     - ❌ (c) fails: Process is known distortion.  
     - **Verdict:** *No deference* → Ignore drugged credence. ✓  

  4. **Deeper reflection (0.6 → 0.3)**  
     - (a) holds (same evidence),  
     - (b) holds (equally rational),  
     - ⚠️ (c) ambiguous: You know the *process* (prolonged reflection) is epistemically virtuous, but you can’t preview its outcome.  
     - **Verdict:** *Partial deference* → Move partway to 0.45. ✓  
     *(Weighted by confidence in future rationality; here ≈50% if symmetric uncertainty)*  

  5. **Better-informed future self**  
     - (a) & (b) & (c) hold: Future self has more evidence, same/improved rationality, trustworthy process.  
     - **Verdict:** *Full deference*. ✓  

  ---

  ### Where the Principle Might Be Challenged
  - **Case (4) is the crux:** Opponents (e.g., strict *Reflection Principle* advocates) argue that if (a) and (b) hold, full deference is required.  
    - **Rebuttal:** The *updating process itself* is part of the epistemic landscape. If you can’t trace how reflection will alter your view (despite trusting it), partial deference balances respect for future rationality with current epistemic limitations.  
  - **What could change my mind?** A demonstration that *all rational updating must be previewable* would force full deference in (4). But humans aren’t logically omniscient—we often know *that* reflection will help without knowing *how*.  

  ### Potential Weaknesses in My Reasoning
  1. **"Process distrust" in (c) is underspecified:**  
     - Could be exploited to avoid deference (e.g., dismissing any future disagreement as "dubious process").  
     - **Mitigation:** (c) requires *positive anticipation* of irrationality (as in drugged case) or opaque updating (as in reflection case)—not mere disagreement.  

  2. **Partial deference is qualitative:**  
     - The 0.45 in (4) is illustrative, but the principle doesn’t specify *how* to weight partial deference. A complete theory needs a mechanism (e.g., *metacognitive confidence*).  

  3. **"Total evidence" in (a) is idealizing:**  
     - In practice, we can’t perfectly quantify evidence. Case (1) implicitly assumes forgotten evidence is significant—but what if it’s trivial?  

  ---

  ### Is a Complicated Principle Worth It?
  **Yes.** Simpler principles (e.g., *"Always defer to equally rational selves"*) fail:  
  - Forces you to lower to 0.6 in (1) or jump to 0.95 in (3).  
  - **Alternative:** Revise (4) to require full deference. But this clashes with deep intuitions about epistemic humility—you *shouldn’t* fully commit to a conclusion you can’t yet comprehend.  

  **Final Principle:**  
  > Defer fully to future credences only when the future self is epistemically superior (more evidence or rationality) and the path to their belief is transparent or trusted. When evidence/rationality are equal but updating is opaque, defer partially proportional to your confidence in the future self's cognitive process.

  This preserves your intuitions while flagging case (4) as the point where ideal theory meets human cognitive limits. If forced to discard one verdict, (4) is the most negotiable—but at the cost of realism about how reasoning works.
