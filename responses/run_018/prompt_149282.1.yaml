prompt: |-
  I'm an engineer who designs fault-tolerant distributed systems; my working vocabulary is replication factors, consensus thresholds, graceful degradation, load shedding, SLAs that separate hard obligations from best-effort targets, and Byzantine fault models. I have no formal philosophy background. Restate five specific distinctions from the analytic debate on supererogation in that vocabulary alone: (i) Urmson's line between required duty and the beyond-duty; (ii) Wolf's problem that a life always optimized for moral best-effort may not be the best life; (iii) the tension that labeling an act optional-but-excellent can diminish those who treat it as obligatory; (iv) the grading problem for acts that exceed duty without violating it; and (v) the boundary question of whether institutional roles—physician-on-call, combat officer, parent—silently convert apparently supererogatory acts into hidden obligations. For each, provide exactly one sentence giving the systems-design translation and exactly one sentence reporting what philosophical content has no counterpart in distributed-systems thinking, with a judgment on whether the gap is a real limitation of the engineering framework or philosophical redundancy. Present your answer as exactly five numbered items, each two sentences, with no introduction and no conclusion.
reasoning: |-
