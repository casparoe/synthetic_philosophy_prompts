prompt: |-
  I serve on the clinical ethics board of a large transplant center, and we are required to publish a binding tie-breaking protocol for the rare cases in which two candidates score identically across every metric in our allocation system. Rather than defaulting to chance, I want the procedure grounded in the philosophical analysis of rational choice without preference — specifically the framework associated with Buridan's ass — translated into a reproducible, stepwise checklist that a non-philosopher referee could execute under time pressure with only the clinical file at hand. Lay out the ordered checks: how to classify a tie as epistemic (unmeasured differences remain) or genuinely value-equivalent, which secondary distinctions may legitimately break symmetry, the precise point at which analysis ends and selection becomes arbitrary but fully documented, and the escalation conditions where judgment must pass to the full board because the conflict is one of values rather than facts. Apply the procedure to three scenarios: two patients with identical survival predictions but different ages; two patients tied on every metric including age; and a tie resolved only by geographic proximity to the donor organ. Include one scenario in which the procedure yields a recommendation the board will almost certainly reject, and close by specifying exactly what the procedure cannot determine and where it is designed to misfire. The protocol must require no external literature, depend on no specialized philosophical training, and be completable within fifteen minutes.
reasoning: |-
  We are designing a tie-breaking protocol for transplant organ allocation when two candidates are tied on all metrics. The goal is to avoid arbitrary chance when possible by using a structured philosophical approach (inspired by Buridan's ass) that distinguishes between epistemic ties (where there are unmeasured differences) and genuinely value-equivalent ties. The procedure must be executable by a non-philosopher referee in under 15 minutes using only the clinical file.

  **Core Principles:**
  1. **Epistemic vs. Genuine Tie:** An epistemic tie means we lack information to differentiate, but differences exist. A genuine tie means the candidates are truly equivalent in value for the purpose of allocation.
  2. **Legitimate Symmetry Breakers:** We can break ties with secondary factors only if they are (a) measurable, (b) relevant to transplant outcomes or justice, and (c) not already excluded by the primary allocation system.
  3. **Arbitrary Selection:** When no legitimate symmetry breaker exists, we must acknowledge the arbitrariness and use a predefined, fair, and documented method (e.g., a random draw) to break the tie.

  **Stepwise Checklist:**

  **Step 0: Confirm Tie**
  - Verify that the two candidates have identical scores on every metric in the allocation system (as per the center's defined metrics). If not, the tie is not present and the higher score wins.

  **Step 1: Classify Tie as Epistemic or Genuine**
  - **Epistemic Tie:** If there is any reason to believe that there might be unmeasured factors that could differentiate the candidates (e.g., missing data, factors not captured in the system but known to affect outcomes), then the tie is epistemic.
    - *Action:* Proceed to Step 2 to attempt to measure or infer unmeasured factors.
  - **Genuine Tie:** If no unmeasured factors are known or suspected, and the candidates are identical on all measured factors, then the tie is genuine.
    - *Action:* Proceed to Step 3 to consider secondary factors.

  **Step 2: Resolve Epistemic Tie (Seek Unmeasured Factors)**
  - Review the clinical file for any missing or incomplete data that could break the tie. For example:
    - Recent lab results not included in the scoring.
    - Unrecorded comorbidities or social factors (e.g., adherence history, substance use).
    - Any other factor that is part of the center's allocation policy but not captured in the current tie.
  - If such a factor is found and can be reliably quantified, use it to break the tie (favoring the candidate with the better factor for transplant outcome or justice).
  - If no such factor is found or if the factor is not reliably known, treat the tie as genuine and proceed to Step 3.

  **Step 3: Consider Secondary Factors (Legitimate Symmetry Breakers)**
  - **Criteria for Legitimacy:** A secondary factor is legitimate if:
    a) It is measurable and available in the clinical file.
    b) It is relevant to transplant outcomes (e.g., a factor that predicts graft survival) or to a relevant principle of justice (e.g., reducing disparities, time on waitlist).
    c) It has not been already accounted for in the primary allocation metrics.
  - **Examples of Potentially Legitimate Factors:**
    - Time on the waitlist (if not already included in the primary score).
    - Geographic proximity to the transplant center (if it affects outcomes due to travel time, and if not already included).
    - Age (if not already included and if it can be linked to outcome differences or justice considerations).
    - A factor that reflects an urgent need (e.g., the candidate is hospitalized and deteriorating).
  - **Action:** If a legitimate secondary factor exists and differentiates the candidates, use it to break the tie (documenting the factor and the reasoning). If multiple factors exist, consider them in the order of their strength of evidence for outcome or justice (predefined by the board). If no factor breaks the tie, proceed to Step 4.

  **Step 4: Arbitrary Selection**
  - When no legitimate factor breaks the tie, the tie is considered genuinely arbitrary.
  - Use a predefined, fair, and random method (e.g., computerized random number, coin flip) to select the recipient.
  - Document the method and the result.

  **Step 5: Escalation to Full Board**
  - **Escalation Conditions:**
    - If the tie involves a conflict of values (e.g., one candidate is a minor and the other is an adult, and the board must decide whether to prioritize minors) that cannot be resolved by measurable factors.
    - If the secondary factor under consideration is controversial and might require a policy decision (e.g., whether to use geographic proximity as a tiebreaker).
    - If the referee feels that the case raises an ethical dilemma beyond the scope of the checklist.
  - **Action:** If any of these conditions are met, pause the checklist and refer the case to the full clinical ethics board for deliberation.

  ---

  **Application to Scenarios:**

  **Scenario 1: Two patients with identical survival predictions but different ages.**
  - Step 0: Confirmed tie on every metric (including survival prediction) except age? Wait, the primary metrics do not include age? If age is not a primary metric, then the tie is on the primary metrics and age is a secondary factor.
  - Step 1: If age is not in the primary metrics, it is an unmeasured factor? Actually, it is measured but not in the primary score. So we move to Step 3 (secondary factors).
  - Step 3: Age is a measurable factor. Is it legitimate? It may be relevant to outcomes (e.g., younger patients may have longer life expectancy post-transplant) and not already accounted for. If the center's policy allows using age as a secondary factor (and it is not prohibited by law or policy), then use it: break the tie in favor of the younger candidate (if that is the center's standard for maximizing benefit). If the center does not have a policy, the referee cannot use it arbitrarily. Then we must check: is it a value conflict? If so, escalate (Step 5). Otherwise, if the referee has no authority to use age, then proceed to Step 4.

  **Scenario 2: Two patients tied on every metric including age.**
  - Step 0: Confirmed tie on every primary metric and also age (if age is a metric). Then proceed to Step 1.
  - Step 1: If there are no unmeasured factors (or none found in Step 2), then it's a genuine tie. Proceed to Step 3.
  - Step 3: Look for secondary factors. For example:
    - Time on waitlist: if one has been waiting longer, that might be a legitimate factor (if not already in the primary score).
    - Geographic proximity: if one candidate lives closer to the center, that might reduce cold ischemia time and improve outcomes. But if not already in the primary score and if the center allows it, then use it.
    - If no secondary factor breaks the tie, then Step 4: arbitrary selection (e.g., random draw).

  **Scenario 3: Tie resolved only by geographic proximity to the donor organ.**
  - Step 0: Confirmed tie on all primary metrics and secondary factors except proximity? Actually, if proximity is a secondary factor, then:
  - Step 3: Proximity is measurable and relevant (reduces cold ischemia time, which is a medical factor). If the center's policy allows using proximity as a secondary factor, then break the tie in favor of the closer candidate. If the center has not addressed this, then it might be a value conflict (because it might disadvantage rural patients) and require escalation (Step 5). Alternatively, if the center has a policy, follow it.

  **Scenario 4: Procedure yields a recommendation the board will almost certainly reject**
  - Let the scenario be: Two candidates tied on every metric. One candidate is a minor and the other is an adult. The minor is older (e.g., 17) and the adult is young (e.g., 18). The primary metrics do not include age. The secondary factor of age is available, but using it to favor the minor (because the center may have a policy to prioritize children) might be challenged because the two are very close in age. The referee, following Step 3, uses age to break the tie in favor of the minor (if the center's policy says prioritize minors). However, the board might reject this because the age difference is negligible and the minor is almost an adult. This is a value conflict that should have been escalated (Step 5).

  **What the Procedure Cannot Determine and Where It Might Misfire:**
  - **Cannot Determine:** 
    - How to resolve value conflicts (e.g., whether to prioritize age, or how to weigh justice vs. utility). These must be decided by the board and embedded in policy.
    - How to handle incomplete or ambiguous data (the referee must use judgment, but the procedure tries to minimize this by relying on measurable factors).
  - **Designed to Misfire:**
    - When the tie is due to a factor that is not measurable (e.g., a patient's future adherence, which is unknown) and there is no legitimate secondary factor, the procedure will default to arbitrary selection. This is by design: we acknowledge that we cannot always avoid randomness.
    - When the secondary factor is controversial and not covered by policy, the procedure may either (a) if the referee uses it, cause a decision that the board would reject (as in Scenario 4) or (b) if escalated, delay the decision. Therefore, the center must have clear policies on what secondary factors are allowed.

  ---

  **Final Protocol Checklist (for Referee):**

  1. **Confirm Tie:** Verify identical scores on all primary allocation metrics. If not, stop: no tie.
  2. **Classify Tie:**
     - Check for any unmeasured factors (e.g., missing data, factors not in the primary metrics). 
     - If found and quantifiable, use to break tie (better outcome/higher justice) -> Done.
     - Else, proceed to Step 3.
  3. **Secondary Factors:** 
     - List all measurable factors in the file that are not in the primary metrics but are relevant to outcome or justice (per center policy). 
     - If any factor breaks the tie, use it (document) -> Done.
     - Else, proceed to Step 4.
  4. **Arbitrary Selection:** 
     - Use a predefined random method (e.g., flip a coin, computer random number) to choose. Document -> Done.
  5. **Escalation (at any step):** 
     - If you encounter a value conflict (e.g., a factor that requires a policy decision not covered) or an ethical dilemma beyond the checklist, pause and refer to full board.

  **Time Limit:** The referee must complete within 15 minutes. If escalation is needed, the board must be convened urgently.

  **Note:** The center must maintain a clear policy on:
     - What constitutes a legitimate secondary factor (with examples).
     - The predefined random method for Step 4.
     - The process for urgent board review.
answer: |-
  ### Tie-Breaking Protocol for Transplant Organ Allocation  
  **Purpose:** To resolve ties between two candidates with identical allocation scores, using a structured, philosophically grounded approach that minimizes arbitrariness. Executable in ≤15 minutes by a non-philosopher referee using clinical files only.  

  ---

  ### **Stepwise Checklist**  
  **Time Limit:** Strictly 15 minutes. Document each step.  

  #### **Step 1: Confirm Absolute Tie (1 minute)**  
  - Verify identical scores on **all primary metrics** (e.g., MELD/EPELD score, medical urgency, waitlist time, compatibility).  
  - *If metrics differ*: Revert to standard allocation. **Stop.**  
  - *If identical*: Proceed to Step 2.  

  #### **Step 2: Classify Tie as Epistemic or Genuine (3 minutes)**  
  - **Epistemic Tie (Unmeasured differences likely)**:  
    - Evidence: Incomplete data (e.g., missing biopsy results, unrecorded social determinants), new clinical developments (e.g., unreported hospitalization), or factors outside the allocation system (e.g., caregiver support).  
    - *Action*: Resolve via Step 3.  
  - **Genuine Tie (No measurable differences)**:  
    - Evidence: All data complete, no new information, metrics cover all relevant clinical/social factors.  
    - *Action*: Proceed to Step 4.  

  #### **Step 3: Resolve Epistemic Tie (4 minutes)**  
  - **Check for measurable, outcome-relevant differences**:  
    - Review clinical files for:  
      - Time-sensitive deterioration (e.g., rising creatinine, new ICU admission).  
      - Uncaptured comorbidities (e.g., uncontrolled diabetes vs. controlled).  
      - Social factors affecting outcomes (e.g., documented adherence history, transportation access).  
    - *If difference found*: Assign organ to the candidate with **better expected outcome** (e.g., lower risk of rejection). **Stop.**  
    - *If no difference found*: Reclassify as genuine tie. Proceed to Step 4.  

  #### **Step 4: Evaluate Secondary Distinctions (4 minutes)**  
  - **Permissible symmetry-breakers** (must be **measurable**, **actionable**, and **ethically neutral**):  
    1. **Time on waitlist** (if not in primary metrics): Favor longer wait.  
    2. **Geographic proximity** (if proven to reduce cold ischemia time): Favor closer candidate.  
    3. **Age** (if not in metrics and linked to outcome): Favor younger *only* if evidence shows significant survival difference (e.g., <40 vs. >60).  
    4. **Logistical urgency** (e.g., one candidate is in-operating-room ready).  
  - *If distinction exists*: Assign organ to the advantaged candidate. **Document rationale. Stop.**  
  - *If no distinction*: Proceed to Step 5.  

  #### **Step 5: Arbitrary Selection (1 minute)**  
  - **Action**: Use a **predefined random method** (e.g., computerized random number generator).  
  - **Document**: "No clinical, ethical, or practical distinctions found. Selection randomized per protocol."  
  - **Stop.**  

  #### **Step 6: Escalation to Full Board (if triggered)**  
  - **Conditions for escalation** (values conflict, not facts):  
    - Secondary distinction requires **value judgment** (e.g., prioritizing a young parent over an elderly patient).  
    - Candidate factors invoke **unresolved ethical principles** (e.g., disability, social worth).  
    - Distinction violates **policy** (e.g., using unvetted criteria like occupation).  
  - **Action**: Immediately refer to full board with clinical files. **Halt protocol.**  

  ---

  ### **Application to Scenarios**  
  #### **Scenario 1: Identical survival predictions, different ages (45 vs. 50)**  
  - Step 1: Tie confirmed on primary metrics.  
  - Step 2: Genuine tie (age not in primary metrics).  
  - Step 4: Age difference (5 years) is measurable. *But*: No evidence that 5 years impacts survival → **no distinction**.  
  - Step 5: Random selection.  

  #### **Scenario 2: Identical on all metrics including age**  
  - Step 1: Tie confirmed.  
  - Step 2: Genuine tie.  
  - Step 4: Check secondary distinctions:  
    - Waitlist time identical → no.  
    - Proximity: Candidate A is 10 miles closer. *If* center policy allows proximity → assign to A. Else → no distinction.  
  - Step 5: If no policy, random selection.  

  #### **Scenario 3: Tie broken only by geographic proximity**  
  - Step 1: Tie confirmed on all primary metrics.  
  - Step 2: Genuine tie.  
  - Step 4: Proximity is the sole distinction. *If* policy permits (e.g., "proximity reduces cold ischemia time ≥2 hours") → assign to closer candidate. **Valid symmetry-breaker.**  

  #### **Scenario 4: Protocol Recommends Rejected Outcome**  
  - **Case**: Two candidates tied identically. Candidate A is a convicted felon (non-violent); Candidate B has no record.  
  - Step 4: Criminal record is measurable. *But*: Not outcome-relevant or ethically neutral → **escalate to board** (values conflict: "social worth" vs. medical equity).  
  - **Protocol Output**: Assign via random selection (if no escalation).  
  - **Board Rejection Likely**: Most boards exclude non-medical social criteria.  

  ---

  ### **Limitations and Failure Modes**  
  1. **Cannot Resolve**:  
     - **Value conflicts** (e.g., young vs. elderly).  
     - **Non-measurable factors** (e.g., "potential societal contribution").  
     - **Institutional biases** (e.g., proximity favoring urban centers).  
  2. **Designed to Misfire**:  
     - When distinctions exist but are **unmeasurable** (e.g., undocumented adherence), forcing arbitrary choice (Step 5).  
     - When **policies lack clarity** on secondary distinctions (e.g., proximity thresholds), risking inconsistent application.  
  3. **Critical Boundaries**:  
     - Ends analysis at **measurable factors** (avoids subjective "tie-breaking preferences").  
     - Escalates **all non-factual conflicts** to preserve accountability.  

  ---  
  **Final Output**: A decision with documented rationale or escalation within 15 minutes. **No philosophy degree required.**
