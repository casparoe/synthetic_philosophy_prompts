  Second question: Distributed resentment is coherent as a moral emotion but structurally different. It might feel like resentment but lacks the "demand for recognition" from a responsible agent. Without a clear target for holding accountable, it drifts toward what Strawson calls "objective attitudes" - viewing entities as mechanisms to manage rather than engage morally.

  Third question: Vicarious attitudes don't resolve this. They're still person-focused (resenting on behalf of someone else), just not self-focused. Distributed resentment targets diffuse systems - a qualitative shift Strawson didn't anticipate.

