answer: |-
  Based on your working notes and the four specific points you want conceptual pressure on, here's a focused analysis:

  1.  **Is Singular Addressability Present in Strawson?**
      *   **Strong Evidence For:** Strawson's core examples are fundamentally dyadic and agent-targeted. Resentment arises *when someone* displays ill-will or indifference *to me*; gratitude *when someone* shows good-will *to me*; indignation *when someone* wrongs *another*. The attitudes are *reactive* precisely because they are responses to *an agent's quality of will manifested in action*. This implies a specific "source" or "origin" (the agent whose will is perceived) and a "direction" (towards that agent as morally assessable). The "participant stance" involves *engaging with* another as a responsible agent, which inherently requires identifying *who* that agent is. Vicarious attitudes like indignation still target a *specific agent* who wronged someone else.
      *   **Potential Counter/Refinement:** Strawson discusses "generalized" or "impersonal" moral demands, but these seem to be the *background norms* against which specific attitudes like resentment arise *when an agent violates them*. The *attitude itself* remains directed at the violator. He also mentions attitudes towards groups ("they"), but his analysis focuses on the interpersonal core and treats group attitudes as extensions or aggregates of individual responsibility (e.g., holding each member responsible for their contribution). *Conclusion:* You are not importing a bias; singular addressability is a core, necessary structural feature of reactive attitudes *as defined by Strawson*. The framework is inherently biased towards the dyadic because that's where responsibility, for Strawson, fundamentally resides.

  2.  **Is Distributed Resentment Coherent as a Reactive Attitude?**
      *   **Conceptual Tension:** Strawsonian reactive attitudes require an intentional object capable of *understanding* the demand implicit in the attitude and *responding* to it (even if they refuse). Resentment says, "You (singular) disregarded *me* (or my standing) and you owe *me* recognition/amends." Can an "institutional role," "collective procedure," or "systemic pattern" genuinely *be* the target of this *demand*? Can it *recognize* the resentment, *acknowledge* fault, or *offer* an apology in the requisite moral sense? Systems lack a mind, a will, or a capacity for reciprocal recognition.
      *   **Affective Resemblance vs. Structural Difference:** What you describe *feels* like resentment – it involves a sense of violated entitlement, a hot feeling of "this shouldn't be," and a demand for rectification *directed at the source of the harm*. However, structurally, without a singular, responsive agent as the target, it lacks the core *interactive, demand-and-response* dynamic Strawson identifies. It might be better understood as a complex blend:
          *   *Moral Anger/Outrage:* At the *state of affairs* or the *harm* caused.
          *   *Frustration:* At the inability to locate a responsible agent.
          *   *Call for Systemic Change:* A demand addressed *to the collective* (society, lawmakers, citizens) *about* the system, not *to* the system itself.
          *   *Proxy Resentment:* Resentment felt *towards individuals perceived as embodying or upholding* the system (e.g., a specific bureaucrat, CEO, or politician).
      *   *Conclusion:* Distributed resentment, as a *pure* attitude directed solely at the non-agentic system/role/procedure, struggles to be coherent *as a Strawsonian reactive attitude* because it lacks the essential structure of addressability *to a responsible agent*. It may share affective qualities but lacks the core interactive moral logic. It risks collapsing into objective assessment plus strong negative emotion.

  3.  **Do Vicarious Attitudes Resolve the Problem?**
      *   **No, They Reinforce the Singular Target:** Vicarious reactive attitudes (e.g., indignation on behalf of a victim, approbation for a virtuous act) are crucial to Strawson's account of *impersonal* morality. However, they fundamentally *retain the singular addressability condition*. The indignation is *towards the specific agent* who wronged the victim. It's vicarious *in its origin* (felt by a non-victim), but not *in its target*. The target remains the individual wrongdoer whose quality of will is being condemned. Vicarious attitudes extend the *scope* of who can *feel* a reactive attitude about an event, but they do not change the *structure* of the attitude itself, which still demands recognition *from the specific agent responsible*.
      *   *Conclusion:* Vicarious attitudes are an extension *within* the paradigm of singular addressability, not a bridge to distributed resentment. They presuppose an identifiable agent whose will is being reacted to, even if the reactor is a third party.

  4.  **Limitation or Different Domain?**
      *   **Reveals a Significant Limitation:** This is the crux. If distributed resentment is a genuine, widespread, and affectively potent moral phenomenon concerning institutional harm (e.g., resentment towards "the immigration system," "the algorithm," "bureaucratic red tape," "systemic racism" *as such*), and if Strawson's framework struggles to accommodate it as a reactive attitude (forcing it into objective attitudes or proxy resentment), then this points to a *limitation in the scope* of his account.
      *   **Why a Limitation (Not Merely a Different Domain):**
          *   *Pervasiveness:* Institutional and systemic forces are primary sources of significant moral harm in modern life. A theory of moral responsibility that struggles to account for our moral responses to these forces is incomplete.
          *   *Participatory Feel:* As you note, distributed resentment *feels* participatory and reactive – it involves a sense of personal stake and a demand (even if diffuse) for moral acknowledgment/rectification, distinct from detached objective assessment (*how* to fix the system) or mere dislike of the harm. This affective resonance suggests it belongs *within* the domain of moral responsibility responses, even if Strawson's framework struggles to place it there.
          *   *Objective Attitude is Inadequate:* Classifying it as an objective attitude seems descriptively wrong. We don't *just* see the system as a mechanism to be managed; we feel *wronged by it* in a way that demands a moral, not just a technical, response. This blurring challenges Strawson's sharp dichotomy.
      *   *Conclusion:* It reveals a limitation. Strawson's framework, brilliant for the interpersonal sphere, may lack the conceptual resources to fully capture the phenomenology and moral logic of responsibility responses elicited by complex, non-dyadic sources of harm characteristic of modern institutional life. It suggests his account is overly individualistic and struggles with genuinely collective or systemic moral agency and response. Your argument pushes towards needing an expansion or significant modification of the reactive attitudes framework, not just assigning institutional morality to a separate, depersonalized box.

  **Summary of Conceptual Pressure:**

  1.  **Singular Addressability:** Strongly embedded in Strawson's core examples and logic. You're identifying a genuine feature.
  2.  **Distributed Resentment Coherence:** Conceptually strained *as a pure Strawsonian reactive attitude* due to the lack of an agent capable of recognizing/responding to the demand, despite affective similarities. Points towards a need for a new category or conceptual expansion.
  3.  **Vicarious Attitudes:** Don't resolve the issue; they operate *within* the singular addressability paradigm.
  4.  **Significance:** This tension highlights a significant limitation in Strawson's framework regarding its applicability to pervasive forms of institutional/systemic harm and our moral responses to them, rather than merely pointing to a separate domain. It challenges the sufficiency of the interpersonal dyad and the sharp objective/reactive distinction for capturing modern moral experience.

  Your core tension – participatory affect demanding recognition *without* a singular identifiable agent capable of providing it – is potent and exposes a genuine boundary within Strawson's otherwise powerful account. Developing this argument promises a significant contribution to discussions of responsibility beyond the individual.
