answer: |-
  ### (1) Core Distinction  
  The divergence centers on *what grounds the truth* of *de re* modal claims like "Socrates could have been a carpenter." For **transworld identity (Kripke)**, this asserts that *Socrates himself* exists in another possible world and is a carpenter there. Identity is primitive and absolute: the "Socrates" in that world is numerically identical to our Socrates. Modal properties are thus grounded in the literal transworld existence of the *same* object possessing different properties.  

  In **counterpart theory (Lewis)**, "Socrates could have been a carpenter" means: in some concrete world *w*, a *different* individual (Socrates’ *counterpart*) exists who is qualitatively similar to Socrates (especially in origin or key properties) and is a carpenter. Socrates himself exists only in our world. Modal properties are grounded in qualitative similarity relations between distinct, world-bound individuals.  

  The crux: Kripke analyzes *de re* modality via **strict self-identity across worlds**, while Lewis analyzes it via **similarity-based representation** across causally isolated worlds.  

  ---

  ### (2) World-Indexed vs. Cross-World Essentialism  
  **World-indexed essentialism (Lewisian):** Essential properties are fixed *relative to a world*. In world *w*, Socrates has the property *being human* essentially *in w*—meaning he couldn’t lose humanity *while remaining in w*. But in another world *v*, a counterpart might exist as a non-human (e.g., a robot), provided it matches Socrates’ qualitative role in *v*. Essentialism is *world-bound*: it constrains variation *within* a world but not *across* worlds. Modal inertia—an object’s resistance to change—is local to its world.  

  **Cross-world essentialism (Kripkean):** Essential properties constrain *all possible instances* of an object. If *being human* is essential to Socrates, then *no world* contains Socrates as a non-human. Essentialism is global: it dictates which worlds can include Socrates *at all*, regardless of qualitative resemblance. Modal inertia is absolute: Socrates’ identity carries immutable conditions that no world can violate.  

  They are not interchangeable because:  
  - **World-indexed** essentialism permits radical qualitative variance across worlds (via counterparts) while preserving world-bound necessity.  
  - **Cross-world** essentialism forbids radical variance, tethering transworld identity to intrinsic constraints.  
  Lewis *must* adopt world-indexed essentialism: concrete worlds lack "identity travel," so cross-world constraints are unintelligible. Kripke *requires* cross-world essentialism: primitive identity demands fixed boundaries for "what Socrates is" across logical space.  

  ---

  ### (3) Smuggling Objection and Its Limits  
  The objection claims Kripkean **origin essentialism** (e.g., Socrates must originate from specific parents) implicitly relies on qualitative conditions akin to counterpart relations. If Socrates’ identity requires originating from parents *P*, then worlds containing "Socrates" without *P* are excluded—suggesting a qualitative filter on transworld identity.  

  **Assessment:**  
  - **Yes**, origin essentialism imposes qualitative criteria for transworld identity. Worlds lacking Socrates’ actual origins cannot contain *him*.  
  - **But this does not reduce to counterpart theory**: For Kripke, these criteria are *constitutive of identity itself*, not merely similarity-based representation. The parents criterion isn’t a matter of resemblance but of *metaphysical genesis*: *being Socrates* just *is* (partly) *being born from P*.  
  - **Limit**: While qualitative, this need not be "counterpart-like." Counterpart relations are *gradient* (allowing multiple/partial counterparts), whereas Kripke’s identity conditions are *binary*: either the identity conditions are met (Socrates exists) or not. Origin essentialism *uses* qualitative facts to fix identity, but treats identity as primitive once fixed.  
  **Verdict**: This qualitativeness undermines claims that Kripkean identity is *purely* non-qualitative, but not its primitiveness. Identity remains fundamental—it’s just that identity *conditions* involve qualitative constraints.  

  ---

  ### (4) Bottom Line  
  **Lewis carries heavier conceptual costs**:  
  - **Metaphysical extravagance**: Concrete worlds multiply ontological commitments beyond necessity.  
  - **Fragmented selves**: Socrates’ modal properties reduce to relations between distinct entities, sacrificing intuitive *de re* unity.  
  - **Radical contingency**: World-indexed essentialism allows counterparts to violate what we take as Socrates’ core nature (e.g., being human), eroding modal stability.  

  Kripke’s primitive identity preserves intuitive unity of objects across modality but at the cost of unexplained, qualitative identity constraints. Yet Lewis’s ontology—spatiotemporally isolated worlds—*forces* counterpart relations and fractures identity systematically. Kripke’s view, even with smuggled qualitative conditions, better respects the *object-centered* intuition of modality. The cost of Lewis’s metaphysical profligacy outweighs Kripke’s murky identity primitivism.
