  ## Whited Sepulchre

  Truth-bare as winter air, we owe the mind:
  **An epistemic courtesy, unblurred and stark.**
  The veiled intent leaves harmony behind.

  This polished fiction, offered, unrefined,
  Stands stranded here, a failing, fractured ark.
  Truth-bare as winter air, we owe the mind

  The fabric of the real, not undermined
  By silence forced where shadows leave their mark.
  The veiled intent leaves harmony behind.

  Shared face-space holds the fragile and the kind,
  **A web of care torn by falsehood's rigid bark.**
  Truth-bare as winter air, we owe the mind

  Its sovereign right – a duty thus defined –
  To chart its course through daylight, not the dark.
  The veiled intent leaves harmony behind.

  This white lie breaks what it was meant to bind:
  Conceals the rock, yet forces fiction’s spark.
  Truth-bare as winter air, we owe the mind;
  The veiled intent leaves harmony behind.

  ---

  **Explanatory Note (148 words):**

  This villanelle takes two key interpretive liberties. Firstly, it presents Dutch directness as primarily motivated by *epistemic courtesy* – a duty to present reality unmasked for the listener's autonomous judgement. While Dutch communication values frankness, anthropological accounts typically emphasise its roots in social egalitarianism and efficiency, not purely epistemic virtue. Secondly, it frames Japanese indirectness solely as upholding *interactional care* through maintaining "shared face-space". This leans heavily on contested philosophical analyses (e.g., contrasting Kantian truth-duty with Bok/Raz on harm) that equate *any* explicit falsehood with a fundamental rupture of the delicate, consensual social fabric inherent in *enryo* and *sasshi*, arguably overstating the perceived violence of a well-intentioned *tatemae* performance. The poem deliberately ignores pragmatic contexts where both cultures might accept strategic omission or benign fiction. Its power lies in the stark, formalised clash of moral psychologies, treating the white lie as a unique double betrayal.
