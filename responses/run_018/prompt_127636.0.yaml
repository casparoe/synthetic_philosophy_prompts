  ## Independent Study Research Proposal: The Architectural Foundations of Tranquilism  

  **Project Title:** Beneath the Absence: Examining the Implicit Ontology of Craving in Tranquilist Ethics  
  **Principal Investigator:** [Your Name], High School Senior  
  **Duration:** One Semester (Summer 202X)  
  **Supervision:** [Ethics Instructor’s Name], Advanced Ethics Course  

  ---

  ### I. Research Question & Distinction from Related Theories  
  Tranquilism asserts that *only the elimination of craving and suffering holds intrinsic moral value*, while positive states (e.g., joy, achievement) possess no inherent worth—they are neutral at best. This project investigates a hidden premise: **Does tranquilism necessarily presuppose that craving functions not as a discrete mental state, but as an "attentional gravity" that fundamentally structures the ontology of all other conscious experiences?**  

  This distinguishes tranquilism from:  
  - **Hedonism:** Which assigns intrinsic value to positive sensations (e.g., pleasure) and disvalue to negative ones (e.g., pain).  
  - **Negative Utilitarianism (NU):** Which focuses solely on minimizing suffering but *does not* inherently deny the intrinsic value of positive states if achievable without suffering.  

  The critical divergence lies in tranquilism’s potential *architectural claim*: Craving’s absence doesn’t merely create a "neutral baseline," but alters the structural fabric of consciousness itself, rendering post-craving states qualitatively distinct from ordinary contentment.  

  ---

  ### II. The Gap in Standard Classroom Analysis  
  Classroom discussions typically treat tranquilism as a *normative claim about welfare* (what states matter morally), overlooking its potential *descriptive claim about mental ontology* (how craving constitutes experience). This occurs due to three factors:  
  1. **Conflation with Simpler Theories:** Tranquilism is often reduced to NU or Buddhist *dukkha* without probing its unique metaphysical commitments.  
  2. **State-Centric Framing:** Debates focus on comparing pre-defined mental states (e.g., "suffering" vs. "joy"), neglecting how craving might *generate* the framework through which states are intelligible.  
  3. **Assumption of Neutral Subtraction:** Critics assume removing craving leaves ordinary experience intact but quieter, rather than challenging whether "ordinary experience" *requires* craving as its scaffolding.  

  ---

  ### III. Methodology: Conceptual Analysis & Textual Engagement  
  The project employs non-empirical philosophical analysis, progressing monthly:  

  | Month | Phase | Key Tasks |  
  |-------|-------|-----------|  
  | **1** | **Foundational Framing** | Define "attentional gravity" (craving as a structural, pervasive force organizing perception/valuation). Contrast with desire-as-content models. Draft ontology criteria for tranquilist consciousness. |  
  | **2** | **Primary Text Interrogation** | Close reading of core tranquilist texts (e.g., selections from Epicurus, Śāntideva, Schopenhauer). Analyze: (a) Explicit claims about craving’s nature; (b) Implied assumptions about mental architecture in accounts of tranquility. |  
  | **3** | **Contrastive Analysis** | Compare tranquilism’s implicit architecture to hedonism (Bentham/Mill) and NU (Popper/Smart). Does rejecting craving-as-structure collapse tranquilism into these frameworks? |  
  | **4** | **Synthesis & Refutation** | Construct the "necessary architectural premise" argument. Test against counterexamples (e.g., can fleeting joy exist without craving’s gravity?). Finalize thesis. |  

  **Text Selection Strategy:** Prioritize passages where authors describe the *phenomenology* of tranquility/craving (e.g., Epicurus’ *ataraxia*, Buddhist *nirodha*). Avoid over-reliance on secondary scholarship.  

  ---

  ### IV. Success Criteria & Failure Conditions  
  - **Successful Conclusion:** Demonstrates that tranquilism:  
    (a) *Requires* craving to function as "attentional gravity" to avoid collapsing into hedonism/NU;  
    (b) Entails that tranquility is not a "neutral state" but a *structurally distinct mode of existence*.  
  - **Specific Failure Conditions:**  
    - **Scope Failure:** Discovery that the architectural claim is only peripheral to tranquilism’s core ethics.  
    - **Conceptual Failure:** Inability to define "attentional gravity" non-metaphorically or distinguish it from desire-as-content.  
    - **Textual Failure:** Primary sources provide insufficient evidence of implicit architectural commitments.  

  ---

  ### V. Risk Assessment & Scope Management  
  **Key Risks:**  
  1. **Ambiguity of "Ontology":** Mitigation: Strictly tie "ontology" to the structural conditions for phenomenal states (e.g., "Can achievement *feel meaningful* without craving’s gravity?").  
  2. **Overextension into Psychology/Neuroscience:** Mitigation: Focus solely on conceptual necessity within ethical arguments, not empirical mechanisms.  
  3. **Textual Overreach:** Mitigation: Use targeted excerpts; avoid comprehensive exegesis of entire traditions.  

  **Scope Boundaries:**  
  - **In Scope:** The logical linkage between tranquilist ethics and its tacit model of mind.  
  - **Out of Scope:**  
    - Historical genealogy of tranquilism.  
    - Empirical validation of craving’s phenomenology.  
    - Applied ethics (e.g., tranquilist political frameworks).  

  ---

  ### VI. Conclusion: Significance & Feasibility  
  This project addresses a fundamental oversight in introductory ethics: tranquilism’s plausibility hinges on an unexamined theory of mind. By interrogating craving as "attentional gravity," the research will either:  
  - **Strengthen** tranquilism by revealing its depth (if the architectural claim holds),  
  - **Refine** its distinction from NU/hedonism (if the claim is necessary but partial), or  
  - **Expose** a critical weakness (if the claim is indefensible).  

  With rigorous conceptual focus and disciplined text selection, this architectural inquiry is feasible within one semester. The failure conditions serve as early checkpoints, ensuring the project remains a targeted probe into ethics’ foundations—not an open-ended survey of consciousness.  

