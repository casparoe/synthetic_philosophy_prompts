answer: |-
  Here's your demos boundary decision tree handout – designed for grad seminar debate, with messy edges intact:

  ---

  **Who Belongs? Demos Taxonomy via Institutional Choices**  
  *Answer each question → follow arrows → discover your boundary position*

  ### Q1: Should a tax-paying permanent resident (non-citizen) vote in national elections?
  - **YES** → Go to Q2  
  - **NO** → Go to Q3  

  ### Q2: Should we count sanctuary apes (or similar cognitively complex, socially integrated non-humans) as represented stakeholders?
  - **YES** → **All-Affected Interests (Expansive)**  
    *(If it matters to them, they get a say – humans, apes, future beings)*  
  - **NO** → Go to Q4  

  ### Q3: Should voting rights require formal citizenship *even if* someone has lived/worked here 30 years?
  - **YES** → Go to Q5  
  - **NO** → **Stakeholder Democracy**  
    *(Voting tied to concrete stakes: residency, taxes, labor – citizenship optional)*  

  ### Q4: Should children (say, under 16) get guaranteed proxies (guardians voting their *future* interests)?
  - **YES** → **All-Affected Interests (Human-Centric)**  
    *(Includes residents + future generations via proxies)*  
  - **NO** → **Territorialism**  
    *(All adult human residents vote, regardless of citizenship. Animals/future gens? Nah.)*  

  ### Q5: Should future generations (e.g., people 100+ years from now) get present-day voting proxies?
  - **YES** → **Future Proxy Representation**  
    *(Unnamed combo: Citizenship-only *plus* future proxies? Rare – clashes with exclusionary logic)*  
  - **NO** → Go to Q6  

  ### Q6: Should citizens living abroad permanently retain voting rights?
  - **YES** → **Co-Nationalism / Democratic Closure**  
    *(Demos = national community. Citizens vote, residents don’t – even expats stay "in")*  
  - **NO** → **Pure Citizenship-Residency**  
    *(Only citizens *physically present* vote. Excludes expats & residents. Unnamed? Politically toxic to expats.)*  

  ---

  **Key Notes:**  
  - 🚩 **Practical Twins:**  
    - *Territorialism* (Q4→NO) vs. *Stakeholder Democracy* (Q3→NO) often look identical IRL (both include resident non-citizens).  
    - *Co-Nationalism* (Q6→YES) vs. *Pure Citizenship-Residency* (Q6→NO) hard to distinguish if few expats vote.  
  - ⚫ **Empty Spaces:**  
    - Including *apes but not children* (Q2→YES + Q4→NO): Unnamed. Ethically jarring → few defenders.  
    - *Future proxies + citizenship exclusion* (Q5→YES + Q3→YES): Unnamed. Logically unstable (why privilege future strangers over present residents?).  
  - 💥 Tensions built-in! Some combos break real systems. That’s the point.

  ---

  **Theories Mapped:**  
  - **All-Affected (Expansive):** Q1-Y → Q2-Y  
  - **All-Affected (Human-Centric):** Q1-Y → Q2-N → Q4-Y  
  - **Stakeholder Democracy:** Q1-N → Q3-N  
  - **Territorialism:** Q1-Y → Q2-N → Q4-N  
  - **Co-Nationalism / Closure:** Q1-N → Q3-Y → Q5-N → Q6-Y  
  - **Pure Citizenship-Residency:** Q1-N → Q3-Y → Q5-N → Q6-N  

  Use this to argue, spot contradictions, and ask why certain squares stay empty. No clean answers – welcome to boundary hell! 👹  
  *(Handout typo: "permanent resident" in Q1 missing an 'e'? Eh, adds character.)*
