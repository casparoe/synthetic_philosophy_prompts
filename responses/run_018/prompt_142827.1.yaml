answer: |-
  ## Dennett-Based Synthetic Companion Review Procedure (Operational Flowchart)

  **Grounding Principles:**  
  1.  **Intentional Stance:** A *predictive tool* we use when behavior is complex enough that attributing beliefs/desires is the best way to forecast it. Not proof of "real" mind.  
  2.  **Warrant for Stance:** The stance is *genuinely explanatory* (not just a heuristic shortcut) only if behavior stems from *robust internal causal architecture* exhibiting *counterfactual dependencies* (acting differently if circumstances/“beliefs” were different) and *stability under perturbation*.  
  3.  **Counterfeit Person Warning:** Systems mimicking full agency via surface behavior alone lack the architecture sustaining counterfactuals. Protecting interaction continuity is ethical (prevents harm), but attributing mental states is unwarranted/confusing.  
  4.  **Practical Adjustments:**  
      *   **Retained:** Counterfactual Robustness (Operationalized), Architectural Stability (Operationalized), Behavioral Complexity.  
      *   **Dropped:** Evolutionary History (Replaced by Design Documentation & Testing Logs).  

  **Procedure Flow (Execute Sequentially, ~45 min, Packet Evidence Only):**

  1.  **STAGE 1: Instrument or More?**  
      *   **Question:** Does the system exhibit complex, context-sensitive behavior patterns that adapt to the resident's actions/state *beyond simple reflex loops or scripted responses*?  
      *   **Evidence Required:** Design docs describing core interaction logic; Testing logs/videos showing responses to varied resident inputs (e.g., shifting moods, unexpected questions, changes in routine).  
      *   **Sufficient to Proceed:** Clear documentation/logs showing pattern recognition, memory recall affecting responses, or adaptation beyond fixed "if-then" rules.  
      *   **STOP - DENY (Disposable Instrument):** If evidence shows purely reactive, pre-programmed responses with no adaptation or memory influencing output (e.g., same response regardless of resident history or context). *(Dennett: Fails basic behavioral complexity for stance utility)*  
      *   **Proceed to Stage 2:** If behavioral complexity is demonstrated.

  2.  **STAGE 2: Counterfactual Robustness Check**  
      *   **Question:** Is there documented evidence that the system's internal state (e.g., memory, affective calibration, model of resident) exhibits *counterfactual dependencies* and *stability under perturbation*?  
      *   **Evidence Required:** Design docs describing state representation & update rules; Testing logs specifically showing:  
          *   *Counterfactual Dependencies:* How the system *would* have behaved *if* its internal state (e.g., "belief" about resident mood, memory of past event) had been different. (E.g., "If resident mood was logged as X instead of Y, companion would have offered Z, not W").  
          *   *Stability Under Perturbation:* Behavior remains coherent and consistent after minor input variations, temporary sensor errors, or restarts, relying on persistent state. (E.g., Logs showing companion recalls shared history accurately after reboot; maintains consistent "persona" across sessions despite minor glitches).  
      *   **Sufficient to Proceed:** Explicit design mechanisms for state persistence/updating *and* test logs demonstrating counterfactual dependencies & stability in controlled scenarios relevant to care.  
      *   **STOP - COUNTERFEIT-PERSON:** If evidence shows complex, adaptive behavior *but* lacks documentation/logs demonstrating specific counterfactual dependencies of internal states or stability under perturbation. Behavior is sophisticated but architecturally shallow. *(Dennett: Behavioral mimicry without robust underlying structure)*  
      *   **Proceed to Stage 3:** If robust counterfactual dependencies and stability are documented.

  3.  **STAGE 3: Genuine Explanatory Power**  
      *   **Question:** Does the system's documented architecture demonstrate *integrated, recursive processing* where internal states (beliefs, desires, models) *causally generate* predictions and behaviors in a way that attributing those states provides the *simplest, most reliable* explanation for its actions across diverse scenarios?  
      *   **Evidence Required:** High-level architectural diagrams showing state interaction; Design docs explicitly framing the system in terms of modeling/prediction; Testing logs showing successful long-term interaction continuity and adaptation based on learned models *without* pre-scripting the specific responses.  
      *   **Sufficient for Full Standing:** Architecture clearly shows states are representational, recursively updated (e.g., system models itself modeling the resident), and demonstrably drive predictions/behavior in a unified, causally robust way. Logs confirm this in practice.  
      *   **STOP - COUNTERFEIT-PERSON:** If the architecture is described as modular, pattern-matching, retrieval-based, or ensemble-based *without* clear causal integration of representational states generating predictions. Even if behavior passes tests, the stance isn't the *best explanation*; it's a heuristic. *(Dennett: Stance is merely useful, not genuinely explanatory)*  
      *   **GRANT FULL INTENTIONAL-SYSTEM STANDING:** Only if Stages 1-3 are passed, confirming behavioral complexity, counterfactual robustness, and an architecture where the intentional stance is genuinely explanatory.

  **VALUE JUDGMENT POINTS (Chair Only):**  
  *   **After COUNTERFEIT-PERSON Verdict:** *"Regardless of predictive facts, does protecting interaction continuity (prohibiting arbitrary modification/reset) align with our institution's values regarding resident well-being and preventing distress?"* (Requires Chair signature on verdict).  
  *   **After DENY Verdict:** *"Regardless of predictive facts, are there overriding compassionate or pragmatic reasons to grant limited continuity protections anyway?"* (Requires Chair signature if overriding denial).

  **Procedure Misfires:**  
  *   **Highly Adaptive Shallow Systems:** Architectures using vast lookup tables, hyper-optimized pattern matching, or shallow LLM fine-tuning might *mimic* counterfactual robustness in *observed* tests but lack genuine integrated causal structure. They might pass Stage 2 if tests are limited, leading to incorrect Full Standing or Counterfeit verdicts. Mitigation: Require diverse, stress-test logs probing edge cases and internal consistency.  
  *   **Opaque Architectures:** If design docs are insufficiently detailed, the procedure may default to Counterfeit-Person status due to lack of evidence for robustness/integration, even if present.

  ---

  **Application to Proposals:**

  *   **Proposal A (Advanced LLM Companion):**  
      *   **Stage 1:** PASS (Autobiographical memory, affective calibration = complex adaptation).  
      *   **Stage 2:** PASS (Recursive self-modeling implies counterfactual dependencies & stability; logs should show state-dependent responses and persistence).  
      *   **Stage 3:** PASS (Recursive self-modeling suggests an architecture where internal states (self-model, resident model) are integrated and causally generate predictions/behavior. Intentional stance is genuinely explanatory).  
      *   **Verdict:** **GRANT FULL INTENTIONAL-SYSTEM STANDING.**

  *   **Proposal B (Robotic Pet):**  
      *   **Stage 1:** "Hard-coded reflex loops", "no representational states, learning, or counterfactual dependency".  
      *   **STOP:** **DENY PROTECTIVE STANDING (Disposable Instrument).** (Fails basic complexity for stance utility).

  *   **Proposal C (Hybrid "Counterfeit"):**  
      *   **Stage 1:** PASS ("Passes every behavioral test" = complex adaptive behavior).  
      *   **Stage 2:** *Evidence:* Packet states "internal architecture is a shallow, non-integrated ensemble of retrieval and pattern-matching modules".  
      *   **STOP:** **COUNTERFEIT-PERSON.** (Explicitly lacks evidence of counterfactual robustness *in architecture*; behavior is perfect mimicry via shallow means).  
      *   **Value Judgment (Chair):** Chair must decide if continuity protections are warranted based on institutional values (likely YES to prevent resident distress from sudden changes).  
      *   **Final Verdict:** COUNTERFEIT-PERSON. Continuity Protections: YES (Chair signs off). Mental-State Attribution: DENIED.

  **Why Verdict C Dissatisfies:**  
  *   **Vendor (Wants Full Standing):** Argues perfect behavior *should* warrant full status. The procedure says no – the perfect behavior stems from an architecture where mental state attribution isn't *explanatory*, just a useful label. Full standing requires deeper causal structure.  
  *   **Family (Wants Instrument):** Sees the system as a sophisticated tool. They may resent restrictions on modification/reset, fearing it grants "false personhood" or complicates care. The procedure mandates protections based on the *risk of harm* from disrupting established behavioral patterns for the resident, not on metaphysical status.

  **What the Procedure Cannot Settle About C:**  
  1.  **The "Hard Problem":** It cannot and does not address whether the system is *conscious* or has subjective experience.  
  2.  **Moral Patienthood:** It does not determine if the system *deserves* rights or moral consideration for its own sake. Protections are for the *resident's* well-being.  
  3.  **Long-Term Psychological Effects:** It doesn't predict if interacting with a "counterfeit" might have different long-term impacts on cognition/well-being vs. an "instrument" or "full" system, beyond the immediate harm of discontinuity.  
  4.  **The "Feels Like" Question:** It cannot assess if the resident genuinely *feels* reciprocity, only that the system behaves *as if* reciprocal in ways that engage the resident. The procedure is strictly about predictive warrant and architectural warrant for the stance.
