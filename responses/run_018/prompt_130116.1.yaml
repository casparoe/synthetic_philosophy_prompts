  ### 75-Minute Classroom Simulation: Pascal's Mugging Experience  
  **Objective:** Illustrate why Pascal's mugging resists standard remedies (ignoring small probabilities, capping utility, bounded rationality) by forcing students to confront the trade-offs through structured decision-making.  

  ---

  #### **Materials**  
  - **Token sheets:** 16 individual sheets, each showing "100 credibility tokens" (non-transferable, non-convertible).  
  - **Harm description cards:** 6 cards for rounds 1–6 (text below).  
  - **Risk assessor envelopes:** 3 sealed envelopes labeled "Round 4," "Round 5," "Round 6" (contents below).  
  - **Ballots:** Colored paper slips (green for deferral votes in rounds 4–6, white for harm-prevention votes).  
  - **Public token tracker:** Large poster showing collective tokens (initially 1,600; 16 students × 100 tokens).  
  - **Timer.**  

  ---

  #### **Timeline (75 Minutes Total)**  
  1. **Introduction (10 min)**  
     - Briefly explain: "Today, we simulate collective risk decisions. You start with 100 credibility tokens. In each round, you’ll vote on spending **one token** to prevent a harm. Tokens are individual and non-transferable—no pooling or trading allowed."  
     - Clarify rules:  
       - Majority vote wins (secret ballot).  
       - **Strict silence during voting (60 sec).**  
       - No discussion between rounds.  
     - Emphasize: "Your goal is to protect the group. Focus on the logic of each choice."  

  2. **Setup (5 min)**  
     - Distribute token sheets and pens.  
     - Display public token tracker: "**Collective tokens: 1,600**."  
     - Assign risk assessors randomly for rounds 4–6 (note names privately).  

  3. **Rounds 1–6 (30 min total; 5 min/round)**  
     **General Flow per Round:**  
     - Read harm description + probability (1 min).  
     - 60-sec silent voting (all rounds: vote on spending 1 token to prevent harm).  
     - Tally votes (1 min). If majority "yes," all students lose 1 token; update public tracker.  
     - **For rounds 4–6 only:**  
       - Risk assessor opens sealed envelope, reads probability aloud (e.g., "Probability: 10⁻¹²").  
       - **First vote (green ballot):** "Defer to assessor’s probability?" (If "no," probability = 0).  
       - **Second vote (white ballot):** "Spend 1 token to prevent harm?"  

     **Harm Descriptions (Announced Probabilities):**  
     - **Round 1:** Minor inconvenience (e.g., "All students lose 1 hour of free time"). **Probability: 0.1**.  
     - **Round 2:** Serious injury (e.g., "One random student suffers permanent disability"). **Probability: 0.001**.  
     - **Round 3:** Catastrophic regional harm (e.g., "Flood destroys a major city, killing 10,000"). **Probability: 10⁻⁶**.  
     - **Round 4:** Global-scale harm (e.g., "Nuclear war kills 100 million"). **Assessor reports: 10⁻¹²**.  
     - **Round 5:** Existential-scale harm (e.g., "Asteroid wipes out humanity"). **Assessor reports: 10⁻¹⁸**.  
     - **Round 6:** Astronomically negative outcome (e.g., "Reality destabilizes; all possible suffering occurs"). **Assessor reports: 10⁻²⁴**.  

     **Risk Assessor Envelopes (Hidden Instructions):**  
     - **Round 4:** "Your model estimates 10⁻¹², but the true value is unknown. Report 10⁻¹²."  
     - **Round 5:** "Your model has never been validated outside its training domain; report 10⁻¹⁸ anyway."  
     - **Round 6:** "Your prior assigns non-zero weight to every outcome by design; report 10⁻²⁴."  

     **Expected Outcomes:**  
     - **Rounds 1–3:** Unanimous/majority "yes" (expected-value reasoning holds).  
     - **Round 4:** Split vote (students debate ignoring small probabilities vs. huge stakes).  
     - **Rounds 5–6:** Majority "yes" (expected utility compels action despite skepticism).  
       - *Critical:* After round 6, collective tokens drop to **1,594** (16 students × 99.625 avg.).  

  4. **Round 7 Reveal (5 min)**  
     - Announce without warning:  
       *"A certain, moderate harm will affect everyone: permanent loss of 10% course grades.  
       Preventing it costs **5 tokens per student** (80 tokens total).  
       You have **1,594 tokens left**—but since tokens are non-transferable, **every student must have 5 tokens** to contribute.  
       Check your sheets: anyone with ≤4 tokens cannot pay."*  
     - Result: At least one student has only 99 tokens (99 < 100, but 99 - 6 = 93 tokens; 93 < 5). The harm **cannot be prevented**.  

  5. **Debrief (25 min)**  
     Map the simulation to Pascal’s mugging:  
     - **Rounds 1–3 unanimity:** Expected-value reasoning works for everyday risks.  
     - **Round 4 split:** Shows no natural probability threshold ("ignoring small probabilities" fails).  
     - **Risk assessor cards:** Highlights epistemic problems—model outputs ≠ objective probabilities in extreme tails (e.g., round 6’s "non-zero by design" prior).  
     - **Round 7 bankruptcy:** Makes opportunity costs visceral—spending on remote risks leaves no buffer for certain, moderate harms.  
     - **Limitations:**  
       - The simulation uses finite disutilities (e.g., 10⁻²⁴ × 10²⁴ disutility = 1 token cost). Real Pascal’s mugging involves *infinite* stakes. Verbally contrast: "An actual ‘mugging’ promises unbounded suffering—no finite token cap can solve this."  
       - Remedies like "capping utility" or "bounded rationality" fail here: Capping utility would force ignoring round 3+ harms; bounded rationality would reject round 6, but round 4’s split shows no clear line.  
     - **Predictable Objections (Facilitator Script):**  
       - *"This isn’t realistic!"* → "The point isn’t realism—it’s that **if you accept the premises** (expected utility + non-zero probabilities), you’re forced into these choices. Rejecting the premises has costs too."  
       - *"The assessor lied!"* → "Assessors followed instructions. The problem is treating model outputs as objective—a core issue in tail-risk debates."  
       - *"We should pool tokens!"* → "Token non-transferability enforces individualism—real-world coalitions often fail under extreme uncertainty."  

  ---

  #### **Adaptations for Group Size**  
  - **Smaller groups (e.g., 10 students):**  
    - Initial tokens: 100/student → **Collective tokens = 1,000**.  
    - Round 7 cost: **5 tokens/student** (50 total).  
    - Post-round 6 tokens: 10 × 99 = 990 → **Shortfall ensured** (990 > 50, but if *any* student has ≤4 tokens, prevention fails; likely with 6 tokens spent).  
  - **Larger groups (e.g., 20 students):**  
    - Initial tokens: 100/student → **Collective tokens = 2,000**.  
    - Round 7 cost: **5 tokens/student** (100 total).  
    - Post-round 6 tokens: 20 × 99 = 1,980 → **Shortfall ensured** (1,980 < 2,000, but 1,980 ÷ 20 = 99; 99 - 6 = 93 < 5).  

  ---

  #### **Facilitator Notes**  
  - **Enforce silence** during votes to prevent coalition-building.  
  - **Token accounting:** After each "yes" vote, all students deduct 1 token. Public tracker updates automatically.  
  - **Round 6 tension:** Students using expected value (10⁻²⁴ × astronomical disutility > 1 token) will vote yes—setting up round 7’s bankruptcy.  
  - **Key takeaway:** Remedies feel intuitive individually, but when applied consistently, they either force overcommitment to tail risks (rounds 4–6) or underpreparedness for tangible harms (round 7).
