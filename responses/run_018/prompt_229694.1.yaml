prompt: |-
  You are a moral philosopher with research expertise in the ethics of blame -- particularly the recent literature on standing to blame, hypocrisy, complicity, and meddling -- seconded as a consultant to a professional body. Please think carefully and begin by brainstorming the distinctions from that literature that a usable procedure would need to preserve, before drafting anything.

  Here is the situation. I chair the conduct committee of a national professional association (roughly 4,000 licensed members). Any member may file a complaint against any other member for breaches of our code -- overbilling, misrepresenting qualifications, poaching clients through deception, and so on. Historically the committee has only ever assessed the accused's conduct. But in the past two years we have had complaints from members who were themselves guilty of the same practice and never made amends, complaints from participants in the very scheme being reported (usually after a falling-out among the participants), and complaints about matters in distant chapters that the complainant has no discernible connection to. Handling these has become ad hoc and politically fraught. The board wants a standing screen: a procedure our intake officer (not a philosopher, roughly one hour per complaint before it goes to a hearing panel) can apply to decide whether a complainant's own conduct or relation to the matter disqualifies them from bringing this complaint, before anyone touches the merits.

  Please write that procedure. Requirements:

  1. First, your brainstorm: the distinctions the screen must keep (e.g., forfeited standing versus standing never possessed; hypocrisy versus complicity versus mere third-party meddling; whether the fault must be unacknowledged and unremedied to undermine standing; whether lack of standing affects the truth of the complaint or only the propriety of this person pressing it) and which subtleties can be safely dropped for a non-specialist operator.
  2. The procedure itself: an ordered sequence of questions with what counts as a sufficient answer to each, explicit stopping rules where the screen returns "standing lacks" or "standing intact," and the points -- mark them clearly -- where judgment cannot be eliminated and the intake officer must escalate to a person rather than a rule.
  3. A rule for what the office does when standing lacks: can a true and serious complaint be blocked, and if so, what is done with the information?
  4. Three worked applications: (a) a member who reports a rival's inflated billing while having billed the same way for years, unrepented; (b) a member who took part in the complained-of bid-rigging and now reports the ringleader after being cut out; (c) a member who reports questionable conduct in a chapter three states away that does not affect their practice. Arrange it so that at least one worked case yields a conclusion the committee will find genuinely uncomfortable, and say why the procedure requires it anyway.
  5. A closing section on the procedure's known failure modes: the kinds of cases where it will misfire, and a note on how to defend its decisions to complainants who are told they lack standing.
reasoning: |-
  Hmm, the user is asking me to create a standing screen procedure for a professional association's conduct committee. They want me to draw from moral philosophy literature on blame ethics - specifically concepts like standing to blame, hypocrisy, complicity, and meddling. This is quite a sophisticated request that requires careful application of academic concepts to a practical administrative procedure.

  I need to start with brainstorming the philosophical distinctions that matter here. The key concepts from the literature include:
  - Standing to blame vs. standing never possessed - some people never had the moral authority to criticize in the first place
  - Hypocrisy - when the accuser is guilty of the same misconduct
  - Complicity - when the accuser participated in the wrongdoing
  - Meddling - when the accuser has no connection to the situation
  - The importance of whether the fault is acknowledged and remedied
  - Whether lack of standing affects the complaint's truth or just who can bring it

  For this practical application, I can simplify these concepts. The crucial distinctions to preserve are:
  1. Hypocrisy (unreformed conduct)
  2. Complicity (participation in the same incident)
  3. Meddling (no legitimate connection)
  And I should insist that the fault must be unacknowledged and unremedied to undermine standing.

  Now for the procedure itself - it needs to be usable by a non-philosopher intake officer with limited time. I'll create a flowchart-style sequence with clear yes/no questions. Key elements should include:
  - Stopping rules where "standing lacks" is clear
  - Points where human judgment is needed
  - Escalation points to higher authorities

  For cases where standing lacks, I'll recommend that the complaint shouldn't be blocked entirely - it should be logged confidentially and potentially forwarded if serious, but not pursued formally by this complainant.

  I'll include three worked examples as requested:
  (a) Hypocrisy case: a member reports rival's inflated billing while having done the same unrepentedly
  (b) Complicity case: a participant in bid-rigging reports the ringleader after being cut out
  (c) Meddling case: reporting distant conduct with no connection

  One of these should produce an uncomfortable conclusion - probably the hypocrisy case where the complaint might be valid but the complainant lacks standing.

  Finally, I'll outline known failure modes of this procedure and how to explain decisions to complainants who are denied standing. The explanation needs to be clear that it's about who can bring the complaint, not whether the conduct was wrong.

  This needs to balance philosophical rigor with practical usability - the intake officer isn't a philosopher and only has about an hour per complaint. The procedure must be robust but not overly complex.
answer: |-
  ## Standing Screen Procedure for Professional Conduct Complaints

  **Brainstorm: Essential Distinctions & Pragmatic Simplifications**

  *   **Must Preserve Distinctions:**
      1.  **Forfeiture (Hypocrisy) vs. Never Possessed (Meddling):** *Crucial*. Did the complainant *lose* standing through their own conduct (hypocrisy/complicity), or did they *never have* a legitimate connection to the matter (meddling)? This drives different inquiries.
      2.  **Hypocrisy vs. Complicity:** Hypocrisy is blame for conduct *similar* to one's own ongoing/unremedied fault. Complicity is blame for conduct *one participated in*. Both forfeit standing, but complicity is generally more severe and directly connected. The screen must catch both.
      3.  **Unacknowledged/Unremedied Fault:** Standing is forfeited *only* if the complainant's own similar fault is *current, unacknowledged, or unremedied*. Repented and remedied past faults do not automatically disqualify. This avoids chilling legitimate complaints from reformed members.
      4.  **Procedural Propriety vs. Truth:** Lack of standing *does not* mean the complaint is false or the conduct acceptable. It solely means *this specific complainant* is not the appropriate person to initiate the *formal disciplinary process* for reasons of fairness and institutional integrity. The underlying conduct may still warrant investigation.
      5.  **Direct Complicity vs. Loose Association:** Distinguish between being a *direct participant* in the *specific incident* complained of (strong complicity) and merely working in the same firm/area/knowing about the practice generally (weaker association, likely not complicity for standing). The screen needs to focus on *participation in the specific act*.
      6.  **Legitimate Interest vs. Meddling:** Does the complainant have a *bona fide* professional interest (e.g., affected competitor, potential victim, chapter officer with oversight duty) or are they a pure bystander with no connection?

  *   **Subtleties Safely Dropped:**
      1.  **Degree of Moral Fault:** The screen doesn't need to judge if the complainant's fault is *worse*, *equivalent*, or *slightly better* than the accused's. Presence of relevant, unremedied fault is the trigger.
      2.  **Motive Scrutiny:** Deep psychoanalysis of *why* the complainant is reporting (spite, revenge, genuine concern) is impractical and unreliable in an hour. Focus on objective facts: their conduct and connection.
      3.  **"Moral Authority" Nuances:** The rich philosophical debate on the precise source of standing (relationships, community roles, etc.) is collapsed into the practical proxies of "similar fault" and "legitimate connection."
      4.  **Collective vs. Individual Standing:** The procedure assumes individual complainants. Complaints from official bodies (e.g., chapter ethics chairs) inherently have standing derived from role.
      5.  **"Victim" Standing Complexity:** While victims often have strong standing, the screen doesn't need a special rule for them. Their connection is inherently legitimate (non-meddling) and they are unlikely to be complicit *against themselves*. The standard connection question suffices.

  ---

  **Procedure: Standing Assessment Screen**

  **Operator:** Intake Officer (IO)
  **Goal:** Determine if the complainant has standing to initiate a formal conduct hearing against the accused member regarding *this specific complaint*.
  **Time:** Target < 60 minutes per complaint (initial screen).
  **Input:** Complaint Form, Basic Member Records (licensure status, chapter), Complainant Interview/Statement (focused on connection & own conduct).
  **Output:** "Standing Intact" (Proceed to merits assessment) / "Standing Lacks" (Do NOT proceed to merits via this complainant) / "Escalate" (Unclear, requires judgment).

  **Ordered Sequence:**

  1.  **VALID MEMBERSHIP?**  
      *   *Question:* Is the complainant currently a licensed member in good standing of the association?
      *   *Sufficient Answer:* Confirmed via membership database.
      *   *Stopping Rule:* **NO** -> "Standing Lacks: Complainant not a current member." (Non-members generally lack standing to initiate internal discipline). **YES** -> Proceed to 2.

  2.  **DIRECT PARTICIPANT? (Complicity Check)**  
      *   *Question:* Based on the complaint description and initial interview, did the complainant *directly and knowingly participate* in the *specific instance(s)* of misconduct they are reporting against the accused?
      *   *Focus:* Active involvement in *this* overbilling scheme, *this* bid-rigging, *this* act of deception. Not just awareness or working in the same environment.
      *   *Sufficient Answer:* Complainant admits participation, or complaint/evidence clearly describes their role. Denial requires plausible counter-evidence.
      *   *Stopping Rule:* **YES** -> "Standing Lacks: Complainant is directly complicit in the alleged misconduct." **NO** or **UNCLEAR** -> Proceed to 3.
      *   *Judgment Escalation Point:* If participation is ambiguous (e.g., "provided data they knew might be misused," "attended meetings but claims ignorance"), **ESCALATE** to Conduct Committee Chair (CCC) for a quick ruling. *Guidance for IO:* Err on the side of "Unclear/Escalate" if significant ambiguity exists.

  3.  **SIMILAR UNREMEDIED FAULT? (Hypocrisy Check)**  
      *   *Question:* Does the complainant have a known history (via prior findings, public record, or credible admission during intake) of engaging in conduct *substantially similar* to what they are accusing the other member of, which remains *unacknowledged and/or unremedied*?
      *   *Focus:* "Substantially similar" = core unethical act (e.g., overbilling, misrepresentation). "Unremedied" = no formal sanction completed AND no verifiable restitution/acknowledgment to affected parties. Check limited records & ask complainant directly: "Have you ever been subject to a complaint or finding for similar conduct? Have you made amends?"
      *   *Sufficient Answer:* Verifiable record of similar, unremedied conduct. Complainant admission of similar, unremedied conduct. Lack of any such record or admission.
      *   *Stopping Rule:* **YES** -> "Standing Lacks: Complainant has unremedied, similar conduct (hypocrisy)." **NO** -> Proceed to 4.
      *   *Judgment Escalation Point:* If similarity is debatable (e.g., complainant billed ambiguously but not clearly fraudulently vs. accused's blatant fraud), or remediation status is unclear (e.g., private apology claimed but not verifiable), **ESCALATE** to CCC. *Guidance for IO:* "Similar" means core ethical breach, not minor procedural differences. "Remedied" requires concrete action, not just time passing.

  4.  **LEGITIMATE CONNECTION? (Meddling Check)**  
      *   *Question:* Does the complainant have a direct, legitimate professional interest in *this specific matter* beyond general concern for ethics? Consider: Is the complainant a direct competitor harmed? A client or potential client misled? A member of the same chapter/firm directly affected? Serving in an official oversight role (e.g., chapter ethics officer) for *that* chapter?
      *   *Focus:* Connection to *this specific incident/accused*, not just the *type* of conduct. Geographical distance (e.g., different chapter) is a red flag but not automatic disqualifier if another legitimate connection exists.
      *   *Sufficient Answer:* Complainant provides a plausible, specific connection (e.g., "they poached my client X using deception Y," "I was solicited as part of this scheme," "As Chapter Z Ethics Chair, I have duty over members A, B, C"). Vague "I heard about it" or "It's bad for the profession" is insufficient.
      *   *Stopping Rule:* **NO** (No plausible specific connection provided) -> "Standing Lacks: Complainant lacks a legitimate connection to the specific matter (meddling)." **YES** -> "Standing Intact: Proceed to merits assessment."
      *   *Judgment Escalation Point:* If the connection is arguable (e.g., member in same specialty but different city claims reputational harm; member claims indirect client impact), **ESCALATE** to CCC. *Guidance for IO:* Require complainant to articulate *how* they are concretely affected by *this specific act*.

  **Rule for When Standing Lacks:**

  *   **The complaint itself is NOT blocked or ignored.** The information about the alleged misconduct is potentially vital.
  *   **IO Action:**
      1.  **Log the complaint details confidentially** in a "Standing Lacks - Information Only" repository.
      2.  **Inform the complainant:** Clearly state that *they* lack standing to initiate the formal process *for the reasons identified* (e.g., complicity, hypocrisy, meddling). Emphasize this is *not* a judgment on the truth of the allegations or the seriousness of the conduct. Explain the information will be retained.
      3.  **Escalate Serious Allegations:** If the alleged conduct appears *prima facie* serious and credible (e.g., significant fraud, imminent client harm), the IO **must immediately flag the details for the CCC**. The CCC can then decide to:
          *   Initiate an investigation *on the committee's own motion* (if bylaws permit).
          *   Seek a complainant *with standing* (e.g., a directly affected party, chapter leadership).
          *   Refer the matter to external authorities if appropriate (e.g., law enforcement, licensing board).
          *   Monitor the situation for patterns or further reports.
      4.  **Do NOT** inform the accused member about the complaint filed by the person lacking standing at this stage. Confidentiality of the "Information Only" log is paramount.

  ---

  **Worked Applications:**

  **(a) Hypocrisy: Unrepentant Overbiller Reports Rival**
      *   **Step 1 (Valid Membership):** YES.
      *   **Step 2 (Direct Participant?):** Complaint is about rival's billing. Complainant did not participate *in rival's billing*. NO.
      *   **Step 3 (Similar Unremedied Fault?):** Complainant admits to years of same practice, unrepented. YES. -> **STANDING LACKS: Hypocrisy.**
      *   **Action:** Log details confidentially. Inform complainant of hypocrisy bar. IO must assess if rival's alleged overbilling appears serious/credible. If yes, escalate details to CCC for potential own-motion investigation or seeking another complainant (e.g., a client of the rival). **Uncomfortable Conclusion:** A likely true and serious complaint about fraud is blocked *from this source*. The procedure requires it because allowing hypocrisy undermines the integrity of the process and fairness to the accused. The underlying conduct can still be addressed via CCC action.

  **(b) Complicity: Cut-Out Bid-Rigger Reports Ringleader**
      *   **Step 1 (Valid Membership):** YES.
      *   **Step 2 (Direct Participant?):** Complainant admits taking part in the *very bid-rigging scheme* they are reporting. YES. -> **STANDING LACKS: Complicity.**
      *   **Action:** Log details confidentially. Inform complainant of complicity bar. Allegation (bid-rigging) is inherently serious. **Must Escalate details immediately to CCC.** CCC should investigate the entire scheme on its own motion; the complicit complainant may be offered leniency for cooperation but cannot *initiate* the complaint. Informant status irrelevant to standing for initiation.

  **(c) Meddling: Distant Chapter Conduct**
      *   **Step 1 (Valid Membership):** YES.
      *   **Step 2 (Direct Participant?):** Complaint about conduct in another chapter. Complainant had no role. NO.
      *   **Step 3 (Similar Unremedied Fault?):** No indication of similar conduct by complainant. NO.
      *   **Step 4 (Legitimate Connection?):** Complainant is three states away, no specific clients or practice affected, not in an oversight role for that chapter. Connection is "heard about it from a friend" or "saw it on a forum." NO plausible specific connection. -> **STANDING LACKS: Meddling.**
      *   **Action:** Log details confidentially. Inform complainant of meddling bar. IO assesses seriousness/credibility. If low-level or unsubstantiated rumor, simply log. If serious/credible (e.g., detailed fraud allegations), escalate details to CCC. CCC might notify the relevant *chapter's* leadership for potential local action or monitor.

  ---

  **Known Failure Modes & Defense Strategy:**

  *   **Failure Modes:**
      1.  **Over-Capture of Hypocrisy:** A member with a *minor, distant, and remedied* past fault might be (mis)classified as hypocritical if the IO misjudges similarity or remediation status. Could deter legitimate complaints.
      2.  **Under-Capture of Complicity:** A clever complainant might conceal their level of participation ("I just processed paperwork"). IO has limited investigation time.
      3.  **Connection Misjudgment:** Legitimate but non-obvious connections (e.g., subtle market harm, whistleblower witnessing remotely) might be missed, or tenuous connections might be accepted due to persuasive complainant.
      4.  **Serious Allegations Missed:** An IO might fail to recognize the seriousness of a "Standing Lacks" complaint or the CCC might be slow to act on escalated information, allowing misconduct to continue.
      5.  **"Reformed Hypocrite" Frustration:** A genuinely reformed member might feel penalized by Step 3, even though the procedure allows remedied faults. They need clear explanation.
      6.  **Bona Fide Whistleblower Deterrence:** If the *only* person aware of serious misconduct lacks a clear "connection" (Step 4) or has tangential past fault (Step 3), the screen could block reporting. Escalation by IO/CCC is the critical safety net here.

  *   **Defending Decisions to Complainants:**
      *   **Focus on Process, Not Person/Merits:** "Our procedure focuses on the appropriateness of *who* brings a formal complaint, based on fairness and integrity rules. This decision is independent of whether the conduct you reported is serious or true."
      *   **State the Clear Reason:** "You lack standing because our rules determine that [you participated in the specific misconduct / you have unremedied similar conduct yourself / you lack a specific connection to this matter]."
      *   **Emphasize Information Retention:** "We take the information about the alleged conduct seriously. It has been logged confidentially and may be used by the committee to monitor patterns or, depending on severity, initiate action independently or through other means."
      *   **Explain the Rationale (Briefly):** "Allowing complaints in these situations [complicity/hypocrisy/meddling] can undermine the fairness of the process, damage trust in the association's disciplinary system, and potentially be unfair to the member accused."
      *   **Provide Escalation Path (for process):** "If you believe there has been an error in applying the standing procedure itself, you may request a brief review by the Conduct Committee Chair, explaining why you believe the standing criteria were misapplied in *your specific case*." (Note: This is about *process error*, not re-arguing merits or standing decision based on facts found).
      *   **Avoid Arguing:** Do not engage in debates about the merits of the complaint or the philosophy of blame. Stick to the procedure's application.

  This procedure provides a clear, defensible, and ethically grounded framework for screening complaints based on standing, protecting the integrity of the disciplinary process while ensuring serious misconduct information is not lost. Its success hinges on consistent IO application, diligent use of the escalation path for judgment calls and serious allegations, and clear communication with complainants. Regular review by the Conduct Committee of "Standing Lacks" logs and outcomes is essential.
