prompt: |-
  I've been arguing with a friend about the EU and I keep going in circles, so I want someone to lay out the underlying picture for me. Here's what puzzles me. The member states all describe themselves as sovereign — and in the EU's own legal order they are still the ones who can amend the treaties and leave, as Brexit showed. But at the same time, the EU treats its law as supreme over national law, including national constitutional law, and national courts are expected to set aside their own statutes when there's a conflict. So which picture of sovereignty is the EU actually presupposing? Is it that sovereignty can be pooled or divided, or that the old indivisibility idea is just false, or is the self-description a legal fiction with the real story being something else? And a second layer: people talk about a democratic deficit, since the directly elected parliament shares power with a Commission no voter directly chooses, and the Council can legislate by qualified majority so your own state can be outvoted. Yet the same EU keeps pushing subsidiarity and giving national parliaments more of a say, and the treaties keep gesturing toward ever-closer union. What picture of democracy or democratic legitimacy does that structure commit you to? And are those two pictures — the sovereignty one and the democracy one — compatiable, or does one of them have to give? I'm not asking whether the EU is good or bad. I want to know what it's actually committed to, and what it merely happens to fit with.
reasoning: |-
  Okay, the user is really struggling with the concept of sovereignty and democracy in the EU after arguing with a friend. They're stuck in circular arguments and want a clear, foundational explanation. Let me unpack their query.

  First, they mention member states calling themselves sovereign but EU law being supreme. They referenced Brexit and treaty amendments as proof of state sovereignty. But then EU law overrides national constitutions. The user is confused about which sovereignty model the EU follows—pooled, divided, or if indivisible sovereignty is outdated.

  Then there's the democratic deficit issue. The Parliament is elected, but the Commission isn't. The Council can outvote member states. Yet, subsidiarity gives more power to national parliaments, and treaties push for closer union. What's the EU's stance on democratic legitimacy? And how does that tie into the sovereignty question? Are the two concepts compatible?

  I need to address both sovereignty and democracy, then their compatibility. The user isn't asking for a verdict on the EU's goodness but its foundational commitments. They want clarity on what the EU necessarily requires versus what it incidentally aligns with.

  Starting with sovereignty: The EU is built on supranationalism. States voluntarily delegate powers but retain ultimate control via treaty changes and exit rights. This challenges the Westphalian indivisible sovereignty. The EU's system is a hybrid. Supremacy and direct effect mean EU law trumps national law, including constitutional provisions. But member states, through their constitutions, conditionally accept this. The German Constitutional Court's Solange decisions are key here—they reserve the right to review EU law against national basic rights. So sovereignty isn't gone; it's layered. States are "masters of the treaties," showing pooled, not transferred, sovereignty.

  On democracy: The EU combines multiple sources of legitimacy. The Parliament represents citizens directly, while the Council represents states. The Commission, though unelected, is approved by Parliament and derives legitimacy from member states' appointments. National parliaments contribute through subsidiarity checks. This multi-level system doesn't fit a traditional state model but aims for a compound democracy. Democratic deficit critiques highlight the lack of a European demos and accountability gaps. The EU addresses this with increased parliamentary powers and subsidiarity, but tensions remain.

  Compatibility: The structures are interdependent. Supranationalism allows for common rules, but its legitimacy relies on democratic input. Pooled sovereignty needs mechanisms where states and citizens influence decisions. The EU's design tries to balance both but faces inherent tensions. For example, QMV in the Council respects state sovereignty less than unanimity but is necessary for efficiency. Subsidiarity attempts to mitigate this by decentralizing decisions. The fundamental tension is whether the EU can maintain democratic legitimacy across multiple levels without a unified demos. The Lisbon Treaty's provisions show a commitment to this balance, but practical challenges persist.

  User's deeper needs: They want to understand the EU's theoretical framework to resolve their argument. They need a coherent model that explains apparent contradictions. They might also seek validation that both sovereignty and democracy in the EU are complex and not easily categorized. Highlighting the hybrid nature and ongoing tensions provides the nuance they need. Emphasizing that the EU is an evolving entity rather than a static structure could help them see why debates continue. They might also appreciate knowing that legal scholars and political scientists debate these issues, indicating that their confusion is shared by experts.
answer: |-
  You've hit on the core constitutional tensions of the European Union. The EU isn't built on a single, traditional model of sovereignty or democracy; it's a unique hybrid, constantly evolving and inherently containing paradoxes. Here's a breakdown of the underlying pictures:

  **1. Sovereignty in the EU: Pooled, Not Surrendered (The Constitutional Reality)**

  *   **The Foundational Principle: Conferred Powers:** The EU operates on the principle of **conferred powers** (Art. 5 TEU). Member States *are* sovereign. They remain the *"Masters of the Treaties"*. They only confer *specific, limited powers* onto the EU, as defined in the Treaties. They retain all powers not explicitly conferred.
  *   **Supremacy & Direct Effect: The Engine of Integration:** The doctrines of **supremacy** (Costa v ENEL, ECJ 1964) and **direct effect** (Van Gend en Loos, ECJ 1963) are the *legal mechanisms* that make the EU function effectively. They aren't a denial of State sovereignty *in principle*; they are the *consequence* of the sovereign choice to create an effective common legal order. Without supremacy, common rules (like the single market) couldn't work uniformly.
  *   **The Ultimate Retention of Sovereignty:**
      *   **Treaty Amendment:** Only Member States, acting unanimously and ratifying according to their own constitutional procedures, can amend the Treaties (Art. 48 TEU). This is the ultimate "sovereign veto".
      *   **Withdrawal:** The explicit right to withdraw (Art. 50 TEU), demonstrated by Brexit, reaffirms that membership is a voluntary act of sovereign states.
      *   **National Constitutional Courts:** While accepting supremacy in *practice* for EU law within its competences, courts like the German Constitutional Court (BVerfG) have consistently asserted an **ultra vires review** and **identity review** (Solange I & II, Lisbon Ruling). They reserve the right to reject EU acts if they believe the EU exceeded its conferred powers (*ultra vires*) or violated the core constitutional identity of the state. This is a powerful check on pooled sovereignty.
  *   **The Underlying Picture: Constitutional Pluralism & Pooled Sovereignty:** The EU presupposes a model of **constitutional pluralism**. Multiple legal orders (EU and 27 national ones) coexist, each claiming ultimate authority *within its own sphere*. However, for the EU system to function, national courts *de facto* accept the primacy of EU law *within the scope of EU competence* as a consequence of their state's sovereign choice to join. Sovereignty isn't indivisible in the traditional Westphalian sense; it's **pooled and layered**. States voluntarily agree to be bound by common rules and decisions (even when outvoted in the Council on certain matters) *because* they retain the ultimate power to change the rules or leave.

  **2. Democracy in the EU: Multi-Level Compound Legitimacy (The Aspiration vs. The Challenge)**

  *   **The Democratic Deficit Critique:** The critique is valid on a traditional nation-state model: No single European "demos" with a unified political will; the most powerful institution (the Commission) isn't directly elected; the Council often decides by QMV where states can be outvoted; the EP, while gaining power, still shares legislative authority and lacks full budgetary/initiative powers; perceived distance between citizens and decision-makers.
  *   **The EU's Democratic Structure & Legitimacy Claims:** The EU doesn't claim legitimacy solely on a traditional parliamentary model. It relies on a **compound model of legitimacy**:
      *   **Input Legitimacy (Citizens):** The directly elected **European Parliament** represents the Union's citizens.
      *   **Input Legitimacy (States):** The **European Council** (Heads of State/Gov) and the **Council of the EU** (Ministers) represent the Member State governments, democratically accountable *at the national level*.
      *   **Appointment & Oversight:** The **Commission**:
          *   Its President is proposed by the European Council, taking into account EP election results, and elected by the EP.
          *   The full Commission is nominated by Member States and subject as a body to a vote of consent by the EP.
          *   The Commission is politically accountable to the EP (which can dismiss it).
      *   **National Parliaments & Subsidiarity:** The **Early Warning Mechanism** (Protocol 2) allows national parliaments to flag potential breaches of subsidiarity. This is a direct attempt to involve the primary source of *national* democratic legitimacy in policing the EU's level of action ("decisions taken as closely as possible to the citizen" - Art. 1 TEU).
      *   **Output Legitimacy:** The EU heavily relies on its ability to *deliver results* that nation-states cannot achieve alone (peace, single market, tackling cross-border issues like climate change). Effectiveness becomes a source of legitimacy.
  *   **The Underlying Picture: A Multi-Level, Compound Democracy:** The EU is committed to a model of **democratic legitimacy that operates at multiple levels**. It's not *either* national *or* European democracy; it's *both*. National democracies legitimize the state representatives in the Council/European Council and scrutinize their actions. The European Parliament provides a direct Union-level voice for citizens. The Commission's technocratic role is legitimized through appointment by the politically accountable bodies (European Council & EP). "Ever closer union" implies a gradual strengthening of the *European* level of democracy, while subsidiarity acts as a brake, ensuring decisions are taken at the most appropriate level. The model is inherently complex and requires constant balancing.

  **Compatibility of the Pictures: Tension is Inherent, Not Necessarily Fatal**

  1.  **Interdependence:** Pooled sovereignty *requires* legitimate democratic processes to make binding decisions acceptable to citizens and states. The multi-level democracy structure is designed *for* the reality of pooled sovereignty.
  2.  **The Core Tension:** The tension arises from the **asymmetry**:
      *   **Sovereignty:** While pooled, the ultimate control (Treaty change, exit) remains firmly with the Member States acting through their national constitutional processes.
      *   **Democracy:** The EU-level democratic structures (especially the EP) are still developing and don't fully match the level of power pooled at the EU level *or* the depth of national democratic traditions. The legitimacy derived from national democracies (Council) sometimes clashes with the legitimacy claimed by the European Parliament.
  3.  **How the EU Tries to Manage the Tension:**
      *   **Subsidiarity & Proportionality:** These principles (Art. 5 TEU) are the primary tools to manage the tension. They aim to ensure EU action only happens when necessary and effective, preserving national democratic space.
      *   **Strengthening the EP:** Successive treaties have increased the EP's powers (co-decision/ordinary legislative procedure, budget, Commission appointment).
      *   **Role of National Parliaments:** The Early Warning Mechanism directly involves national democratic bodies.
      *   **Citizen Initiatives:** Tools like the European Citizens' Initiative attempt to bridge the gap.
  4.  **Does One Have to Give?** Not necessarily, but constant adjustment is required. The EU system is built on the premise that these tensions *can* be managed within its unique structure.
      *   If national sovereignty (in the ultimate sense) were completely abandoned, the EU would become a federal state, requiring a fundamentally different (and much stronger) model of *European* democracy.
      *   If EU-level democracy were completely subordinated to national vetoes (e.g., requiring unanimity for all legislation), the system would become paralyzed and unable to function effectively, undermining the point of pooling sovereignty.
      *   **The EU is committed to managing this tension**, not resolving it by eliminating one pole. It presupposes that **sovereignty *can* be pooled without being lost** and that **democratic legitimacy *can* be multi-level and compound** rather than solely concentrated at one level.

  **In Essence:**

  *   **Sovereignty:** The EU is committed to the idea that **sovereignty can be pooled and layered** through the voluntary conferral of specific powers by sovereign states. Ultimate sovereignty (Treaty change, exit) remains national, but operational sovereignty within conferred powers is shared, with EU law supremacy being the necessary legal glue. National constitutional identities remain fundamental constraints.
  *   **Democracy:** The EU is committed to a **multi-level, compound model of democratic legitimacy**, drawing from both direct citizen representation (EP) and national democratic mandates (Council/European Council), supplemented by national parliamentary scrutiny and output legitimacy. It aspires to "ever closer union" while being constrained by subsidiarity.
  *   **Compatibility:** The structures are *designed* to be compatible, presupposing that pooled sovereignty requires multi-source legitimacy. However, inherent tension exists due to the asymmetry between ultimate national control and the developing nature of EU-level democracy. **The EU is fundamentally committed to managing this tension through its principles (subsidiarity, proportionality, conferred powers) and evolving institutional balance, not to eliminating one side of the equation.** Whether this is sustainable long-term is a central debate within the EU itself.
