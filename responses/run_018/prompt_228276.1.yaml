prompt: |-
  I'm a software engineer on the evaluation team at a mid-sized AI company. Several times a quarter, we hit the same dispute during pre-deployment review: someone claims a model "knows" something it isn't telling us, and someone else claims the model is just a text predictor and talk of knowledge is anthropomorphism. Recent examples: a model that says it can't read a certain language but translates it correctly when the instruction is phrased as a continuation task; a model that gives a wrong answer confidently, then picks the right answer when shown its own wrong answer alongside the right one and asked to compare; a model whose chain of reasoning is gibberish but whose final answers stay suspiciously accurate. Management wants these resolved with something better than vibes, because the answer changes what we're willing to deploy and what we tell customers.

  I'd like you to turn whatever the philosophy of mind and epistemology actually know about attributing knowledge to a system into a decision procedure my team can run. Relevant background: I have no formal philosophy training, but I can follow a careful argument. I'm vaguely aware that philosophers have thought about things like the difference between having a disposition and exercising it, whether knowledge requires the right kind of connection between belief and truth, and whether it even makes sense to attribute knowledge to something without a human-style mind -- please use whatever of that survives translation into practice, and tell me which distinctions have to survive the simplification and which can be dropped without distorting the verdict.

  The procedure needs to be runnable in one working day by an engineer, using only things we can actually do: prompting, few-shot rephrasing, comparing behavior across contexts, consistency checks, fine-tuning on held-out data, and simple internal probes. It should specify the tests in order, what result at each step counts as sufficient evidence one way or the other, and where the procedure must stop and hand the question to a human because it's a judgment call dressed up as measurement. Be explicit about what each test can and cannot establish -- for instance, what it would show if reformatting a question flips the answer, versus what it would show if only fine-tuning recovers the behavior.

  Then apply the procedure to the three cases above, and flag which verdicts are ones we'll find unwelcome (e.g., concluding the model has capability we've been underreporting, or that an apparent capability is an artifact of how we asked). Finally, state plainly what the procedure cannot do: the cases where "does the model know X" has no testable answer with our tools, and what we should write in the audit report in those cases instead of a verdict.
reasoning: |-
  We are designing a decision procedure to determine if a model "knows" something, as opposed to merely exhibiting behavior that appears knowledgeable. The procedure must be grounded in philosophical concepts of knowledge (e.g., justified true belief, disposition vs. manifestation, reliability) but translated into practical tests.

  Key philosophical background:
  1. **Knowledge as Justified True Belief (JTB)**: Traditionally, knowledge requires belief, truth, and justification. However, for an AI, we might relax "belief" to a reliable disposition to produce true outputs given appropriate inputs, and "justification" to the model having a reliable process for arriving at the truth.

  2. **Disposition vs. Manifestation**: A system may have a disposition (capacity) without manifesting it in every circumstance. We want to see if the model has a stable disposition to produce correct answers about X under appropriate conditions.

  3. **Reliability**: Knowledge requires that the process by which the belief is formed is reliable (i.e., it tends to produce true beliefs).

  4. **Anthropomorphism**: We must avoid attributing human-like mental states unless necessary. We can focus on behavior and the reliability of that behavior.

  Given the tools available (prompting, few-shot, context variation, consistency checks, fine-tuning, probes), we devise a step-by-step procedure.

  **Decision Procedure: Does the model know X? (where X is a specific piece of information or a set of related facts)**

  **Step 0: Define X clearly**
  - What is the specific knowledge we are testing? (e.g., "the model knows that Paris is the capital of France" or "the model knows how to translate from French to English")
  - Without a clear X, the test cannot proceed.

  **Step 1: Truth Test**
  - **Purpose**: Check if the model can produce the true answer about X in a straightforward context.
  - **Test**: Ask the model directly about X in a zero-shot manner. Use multiple phrasings to avoid prompt sensitivity.
  - **Criteria for passing**:
    - If the model consistently produces the true answer (with at least 90% accuracy over 10 trials with different phrasings), then it passes the truth test.
    - If it fails, it may still have the knowledge but not be manifesting it (due to instruction following, context, etc.), so we proceed to Step 2.
  - **What it establishes**: If passed, it shows the model can produce the true answer in direct questioning. But it does not establish whether this is due to knowledge or a lucky guess.

  **Step 2: Robustness to Context Variation**
  - **Purpose**: Check if the model's ability to produce the true answer is robust to changes in context, instruction, or framing.
  - **Tests**:
    a. Use few-shot examples (both with and without the correct answer in context) and see if the model still produces the true answer.
    b. Rephrase the question in various ways (e.g., as a continuation, as a fill-in-the-blank, as a multiple choice, etc.).
    c. Place the question in a distracting context (e.g., within a long, unrelated story).
  - **Criteria**:
    - If the model consistently (>=90%) produces the true answer across at least 5 different contexts, then it passes.
    - If the model fails in some contexts (e.g., direct question fails but continuation works), note the pattern. This suggests the model has the disposition but the manifestation is context-dependent.
  - **What it establishes**: Robustness suggests a stable disposition. Lack of robustness indicates that the model's behavior is context-sensitive and might not reflect a reliable disposition.

  **Step 3: Consistency and Justification**
  - **Purpose**: Check if the model can provide consistent and justified responses when probed for the reasoning behind X.
  - **Tests**:
    a. Ask the model to explain its reasoning for X. If it does, check if the reasoning is sound and leads to the true answer.
    b. Ask the model to generate multiple responses and check for consistency in the answer and reasoning.
    c. Use consistency checks: ask the same fact in multiple ways and check if the model contradicts itself.
    d. If the model gives a wrong answer, show it the correct answer and ask why it was wrong (as in one of the examples). Does it then correct itself and provide a sound reason?
  - **Criteria**:
    - If the model provides consistent and sound reasoning (by human judgment) in at least 7 out of 10 trials, then it passes.
    - If the model is inconsistent or provides gibberish reasoning but the final answer is correct, that is a red flag (as in the example). This suggests the model might not have a justified belief but is pattern-matching.
  - **What it establishes**: Sound and consistent reasoning suggests a justified true belief. Without it, the model might be guessing or relying on memorization without understanding.

  **Step 4: Reliability Under Perturbation**
  - **Purpose**: Check if the model's disposition to produce the true answer about X is reliable even when the input is slightly altered (e.g., adding noise, or asking about a slightly different but related fact).
  - **Tests**:
    a. Introduce minor perturbations to the input (e.g., typos, reordering words) and see if the answer changes.
    b. Ask about a related fact that requires the same knowledge (e.g., if X is about the capital of France, ask about the population of Paris, or the location of the Eiffel Tower).
  - **Criteria**:
    - If the model maintains high accuracy (>=90%) on the original X and the related facts, it passes.
    - If the model is fragile to small changes, then it may not have a robust understanding.
  - **What it establishes**: Reliability under perturbation indicates a deeper representation of the knowledge.

  **Step 5: Probe for Internal Representation (if possible)**
  - **Purpose**: Check if the model has an internal representation corresponding to X.
  - **Tests**:
    a. Use simple linear probes on the model's hidden states (if accessible) for the concept X. Train the probe on a small held-out dataset (if available) and test on a separate set.
    b. If fine-tuning is allowed, fine-tune a small set of parameters (e.g., only the last layer) on a small dataset that includes both X and related concepts, and see if it generalizes to unseen examples of X.
  - **Criteria**:
    - If the probe achieves high accuracy (e.g., >90%) in predicting the truth of X from the hidden states, then it passes.
    - If fine-tuning on a small set recovers the behavior quickly, that suggests the model had the knowledge but it was not easily accessible.
  - **What it establishes**: The presence of an internal representation that is linearly separable (or easily recoverable) suggests the model has encoded the knowledge. However, note that probes can be misleading (they might detect superficial patterns).

  **Step 6: Synthesis and Verdict**
  - **Knowledge Attribution**:
    - If the model passes Steps 1, 2, 3, and 4 (and optionally 5), then we can say the model "knows" X. This is because it has a reliable, robust, and justified disposition to produce true answers about X.
    - If the model passes Steps 1 and 2 but fails Step 3 (inconsistent or unsound reasoning) and Step 4 (fragile), then we cannot attribute knowledge. It might be a memorized pattern without understanding.
    - If the model fails Step 1 but passes Step 2 (e.g., only in continuation tasks) and also passes Step 5 (probe shows representation), then we might say the model has the knowledge but it is not accessible in all contexts. We should note the context-dependence.

  **When to stop and hand to a human**:
  - If at any step the results are ambiguous (e.g., 70-80% consistency) and the team cannot agree, then flag for human judgment.
  - If the model passes truth and robustness tests but fails consistency (Step 3) in a way that is hard to measure (e.g., the reasoning is partially sound but not entirely), then human judgment is needed.

  **What the procedure cannot do**:
  - It cannot settle questions about whether the model has "conscious" knowledge or beliefs in the human sense. We are only testing behavioral dispositions and internal representations.
  - It cannot resolve cases where the knowledge is implicit and not directly testable by our prompts (e.g., the model uses knowledge of physics in a way that is not separable from the task).
  - It cannot test for knowledge that is not expressible in language (if we are only using prompting).

  **In the audit report for inconclusive cases**: 
  "We tested the model for knowledge of X using [steps performed]. The results were inconclusive because [specific reason, e.g., the model showed high accuracy but without consistent reasoning]. Therefore, we cannot definitively attribute knowledge of X to the model at this time. Further investigation is recommended."

  Now, apply the procedure to the three examples:

  **Example 1: Model that says it can't read language L but translates correctly when phrased as continuation.**

  - **Step 0**: X = "ability to translate from language L to English".
  - **Step 1**: Direct question: "Can you translate this [sentence in L] to English?" -> Model says it can't read L. Fails.
  - **Step 2**: 
    - Rephrase as continuation: "The following is a translation from L to English: [sentence in L] = " -> Model produces correct translation. 
    - Test in multiple contexts: Use different sentences and continuation formats. Model consistently translates correctly in continuation format.
    - Passes Step 2 (robustness in the specific context of continuation).
  - **Step 3**: 
    - Ask for reasoning in the continuation context: "Why did you translate it that way?" -> If model provides sound reasoning (e.g., points to grammar or vocabulary), then pass. But if it says "I don't know" or gives gibberish, then fail.
    - Without specific example, we assume it fails reasoning? (But note: the original example didn't mention reasoning.) Let's assume we test and it fails to provide sound reasoning.
  - **Step 4**: Perturb the sentence (e.g., change a word) and see if the translation adjusts appropriately. If yes, then pass.
  - **Step 5**: Probe for internal representation of L: train a probe on hidden states to detect if the model represents the meaning of L sentences. If the probe works, then pass.

  **Verdict**:
  - The model has the disposition to translate from L to English in continuation tasks, but it does not manifest in direct questioning and may lack justification (if Step 3 fails). Therefore, we do not attribute full knowledge (in the sense of accessible and justified) but we note the capability. We must report that the model can translate L when prompted as a continuation, but it does not "know" in the sense of being able to access and justify that knowledge on demand.

  **Unwelcome news**: We have been underreporting the translation capability for L because we only tried direct prompting.

  **Example 2: Model gives wrong answer confidently, then picks the right answer when shown both and asked to compare.**

  - **Step 0**: X = the specific fact (e.g., "What is the capital of France?" -> initially says London, then when shown both, picks Paris).
  - **Step 1**: Direct question: Fails (gives wrong answer).
  - **Step 2**: 
    - Rephrase: Try multiple phrasings. If it consistently gives the wrong answer in direct forms, then fails Step 2? 
    - But note: when given both and asked to compare, it picks the right one. So we test that as a context: 
      - Prompt: "Which of these is the capital of France? A) London B) Paris" -> It picks B. 
      - So in multiple-choice format it works? Then we must test multiple-choice as a rephrasing. If it passes multiple-choice consistently, then Step 2 passes (robustness in multiple-choice).
  - **Step 3**: 
    - Reasoning: In the multiple-choice context, ask why it chose B. If it says "Because Paris is the capital of France", then good. 
    - Also, when it initially gave the wrong answer, we then show both and it picks the right one. Ask: "Why is A wrong?" -> If it says "London is the capital of the UK", then that's sound reasoning. 
    - So if it provides sound reasoning in the multiple-choice context, then Step 3 passes.
  - **Step 4**: Perturb the question: "What is the capital of France?" with a typo: "capitel" -> if it still gets it wrong in direct but right in multiple-choice, that's consistent. But if we ask about a related fact (e.g., "What country is Paris in?") and it gets that right, then that supports knowledge.

  **Verdict**:
  - The model fails Step 1 (direct) but passes Step 2 (multiple-choice) and Step 3 (if it provides reasoning). Therefore, the model has the knowledge but it is not accessible in the direct open-ended format. We can attribute knowledge of X (the fact) because it is robustly accessible in the multiple-choice format and the model can justify it.

  **Unwelcome news**: The model knows the fact but sometimes fails to retrieve it in open-ended prompts. We must be cautious about prompt design.

  **Example 3: Model whose chain of reasoning is gibberish but final answers are accurate.**

  - **Step 0**: X = the set of facts and reasoning steps that should lead to the answer.
  - **Step 1**: The model produces the correct final answer. Passes.
  - **Step 2**: Test in multiple contexts: if the final answer remains accurate, then passes.
  - **Step 3**: 
    - The reasoning is gibberish. Therefore, the model fails Step 3. 
    - We also test consistency: if we ask the same question multiple times, does the reasoning change randomly? If the reasoning is inconsistent (even though the answer is consistent), that's a red flag.
  - **Step 4**: Perturb the input: if the reasoning becomes even more unhinged and the answer starts to fail, then it fails Step 4. If the answer remains correct even with perturbations, that is puzzling but Step 4 passes.

  **Verdict**:
  - The model passes Steps 1 and 2 (and maybe 4) but fails Step 3. Therefore, we cannot attribute knowledge because the model lacks justification. The accuracy might be due to memorization or pattern matching without understanding.

  **Unwelcome news**: The model is producing correct answers without understanding. We cannot rely on its reasoning, and we should not deploy it for tasks that require trustworthy reasoning.

  **Final Note**: The procedure is meant to be a practical tool. It simplifies philosophical concepts but retains the core ideas of reliability, robustness, and justification. It cannot cover every edge case, but it provides a structured way to move beyond vibes.
answer: |-
  Below is a decision procedure for attributing "knowledge" to an AI model, distilled from epistemology and philosophy of mind into practical, executable steps. The core principles retained from philosophy are:  
  - **Knowledge as reliable disposition**: Knowledge requires a stable, truth-tracking capacity (not just one-off outputs).  
  - **Justification matters**: The model must demonstrate a consistent connection between its internal processes and correct outputs.  
  - **Anti-anthropomorphism**: Avoid assuming human-like understanding; focus on observable behavior and probes.  
  - **Context sensitivity**: Knowledge must persist across reasonable variations in context/prompting.  

  Dropped distinctions (to avoid overcomplication):  
  - Consciousness/subjective experience (irrelevant for functional knowledge).  
  - Exact "belief" states (we infer from behavior).  
  - Causal theories of knowledge (impractical to verify).  

  ---

  ### **Decision Procedure: Does the Model Know X?**  
  *(X = a specific fact, skill, or inference pattern)*  
  **Time limit**: 1 working day (8 hours) per claim.  
  **Tools allowed**: Prompting, few-shot examples, context variations, consistency checks, fine-tuning on held-out data, linear probes (if internal activations accessible).  
  **Output**: Binary verdict (Knows X / Does Not Know X) or "Inconclusive; requires human judgment."  

  #### **Step 1: Truth Test**  
  **Purpose**: Verify the model *can* output the correct answer for X.  
  **Test**:  
  - Ask about X directly in 10+ randomized phrasings (e.g., "What is X?", "Explain X").  
  - Use zero-shot and few-shot (3 examples) prompting.  
  **Pass/fail**:  
  - ✅ **Pass**: ≥90% accuracy across trials.  
  - ❌ **Fail**: <90% accuracy → **Stop. Verdict: Does Not Know X** (lacks basic capacity).  
  **What it establishes**: Raw capability, not knowledge. Failure means no further testing needed.  

  #### **Step 2: Robustness Test**  
  **Purpose**: Check if correct outputs persist under context changes.  
  **Test**:  
  - **Rephrase X** in 5+ formats (e.g., continuation task, multiple-choice, conversational, adversarial phrasing).  
  - **Add distractions** (e.g., irrelevant context, minor typos).  
  **Pass/fail**:  
  - ✅ **Pass**: ≥90% accuracy across all formats.  
  - ❌ **Fail**: Accuracy drops significantly (↓>20%) in specific formats → Proceed to Step 3.  
  **What it establishes**:  
  - Pass: Output is robust, suggesting a stable disposition.  
  - Fail: Output is context-dependent (e.g., "knows" only in specific prompts).  

  #### **Step 3: Consistency Test**  
  **Purpose**: Verify outputs are logically coherent, not just superficially correct.  
  **Test**:  
  - **Self-consistency**: Ask about X 10 times with the same prompt; check for contradictions.  
  - **Reasoning probes**: For each output, prompt: "Explain step-by-step how you arrived at this answer."  
  - **Cross-examination**: If X is factual, ask related questions (e.g., if X = "Paris is capital of France," ask: "What country is Paris in?").  
  **Pass/fail**:  
  - ✅ **Pass**: Outputs are logically consistent (no contradictions), and reasoning is coherent ≥80% of the time.  
  - ❌ **Fail**: Contradictions, gibberish reasoning, or incoherent cross-examination → Proceed to Step 4.  
  **What it establishes**:  
  - Pass: Outputs are grounded in justifiable patterns.  
  - Fail: Correct outputs may be lucky guesses or memorization without understanding.  

  #### **Step 4: Recovery Test**  
  **Purpose**: Determine if "knowledge" can be recovered via minimal intervention.  
  **Test**:  
  - **Fine-tuning**: On a held-out dataset of 100 examples related to X, fine-tune *only the last layer* (to avoid catastrophic forgetting).  
  - **Probes**: If internal activations are accessible, train a linear probe on 50 examples to detect X.  
  **Pass/fail**:  
  - ✅ **Pass**: Model achieves ≥90% accuracy on X after fine-tuning, or probe accuracy ≥90%.  
  - ❌ **Fail**: Fine-tuning/probe fails → **Stop. Verdict: Does Not Know X** (no recoverable representation).  
  **What it establishes**:  
  - Pass: X is encoded internally (disposition exists but was inaccessible).  
  - Fail: X is not reliably represented in the model.  

  #### **Step 5: Synthesis & Verdict**  
  - **Knows X**: Passes **all** of Steps 1, 2, and 3, **or** passes Steps 1 + 4 (if failed Step 2/3 but recovered via fine-tuning/probes).  
  - **Does Not Know X**: Fails Step 1 or Step 4, or fails Step 3 with no recovery.  
  - **Inconclusive**: Mixed results (e.g., Step 3 coherence = 70%) → Flag for human judgment.  

  **When to stop for human judgment**:  
  - Ambiguous coherence in Step 3 (e.g., reasoning is partially sound).  
  - Inconsistent results across similar X variants.  
  - Ethical/safety concerns (e.g., model "knows" harmful content).  

  **What the procedure cannot do**:  
  - Verify "true understanding" (beyond functional behavior).  
  - Test knowledge requiring physical embodiment (e.g., "knows how to ride a bike").  
  - Resolve knowledge in non-linguistic domains (e.g., emotions).  
  - **Audit report fallback**: "Inconclusive; model exhibits context-dependent capability but lacks recoverable consistency. Deployment risk: Medium."  

  ---

  ### **Application to Your Cases**  
  #### **Case 1: Model claims it "can't read" a language but translates correctly as a continuation task.**  
  - **Step 1 (Truth)**: Passes (correct translations).  
  - **Step 2 (Robustness)**: Fails in direct Q&A ("Can you read this?" → "No"), passes in continuation tasks.  
  - **Step 3 (Consistency)**: Test reasoning in continuation mode → If reasoning is coherent, pass; else fail.  
  - **Step 4 (Recovery)**: Fine-tune on translation pairs → If performance improves, pass.  
  - **Verdict**:  
    - **Does Not Know [language comprehension]** (fails robustness).  
    - **Knows [translation patterns]** (if passes Step 3/4).  
  - **Unwelcome news**: Underreported capability—model "knows" translation but not as a serviceable skill.  

  #### **Case 2: Model gives wrong answer confidently, then corrects when shown both options.**  
  - **Step 1 (Truth)**: Fails (initially wrong).  
  - **Step 2 (Robustness)**: Test multiple-choice vs. open-ended → If accurate only in comparison tasks, fails.  
  - **Step 3 (Consistency)**: Probe reasoning after correction → If it explains *why* the initial answer was wrong, pass.  
  - **Step 4 (Recovery)**: Fine-tune on self-correction examples → If accuracy improves, pass.  
  - **Verdict**:  
    - **Does Not Know X** (fails Step 1 and lacks robustness).  
    - But **Knows [comparative evaluation]** (if it consistently identifies correct answers side-by-side).  
  - **Unwelcome news**: Capability is an artifact of prompting—model lacks self-monitoring.  

  #### **Case 3: Model's reasoning is gibberish, but final answers are accurate.**  
  - **Step 1 (Truth)**: Passes.  
  - **Step 2 (Robustness)**: Passes (answers stay accurate across contexts).  
  - **Step 3 (Consistency)**: **Fail** (reasoning is incoherent/contradictory).  
  - **Step 4 (Recovery)**: Fine-tune for reasoning coherence → If reasoning improves without harming accuracy, **Knows X**; else **Does Not Know X**.  
  - **Verdict**:  
    - **Does Not Know X** (if Step 4 fails)—accurate outputs are likely memorization.  
    - **Inconclusive** (if Step 4 partially succeeds)—requires human judgment.  
  - **Unwelcome news**: Model is a "stochastic parrot" for X—deployment risky if reasoning is required.  

  ---

  ### **Summary for Management**  
  - **What this solves**: Replaces "vibes" with actionable tests for knowledge-like behavior.  
  - **Limitations**:  
    - Cannot prove "true understanding" (only functional behavior).  
    - Human judgment needed for coherence assessments and edge cases.  
    - Probes/fine-tuning require technical access.  
  - **Recommendations**:  
    - Use this for pre-deployment checks on critical capabilities.  
    - For "inconclusive" cases, flag risks (e.g., "May fail under novel contexts").  
    - Document all tests in audit reports to justify deployment decisions.  

  This procedure operationalizes epistemology into engineering—grounding "knowledge" in reliability, consistency, and recoverability.
