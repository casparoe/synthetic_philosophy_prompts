  This pattern suggests they're not just using words differently - they're offering coherent but incompatible metaphysical accounts. The additive view treats obligation as a discrete entity, while the reconfigurative view sees it as relational. The user's "deferred preference revelation" case illuminates this: additive theorists would say the future self faces a reason surviving preference change, while reconfigurative theorists would say the promise restructures the future self's practical reasoning landscape.

