answer: |-
  ### Diagnosis and Resolution

  This is a **hidden substantive dispute** concerning the metaphysical structure of normative reality. Both sides agree on the *existence* of promise-generated obligations and their boundary conditions but fundamentally disagree about the *ontological nature* of normative change. The additive camp treats obligations as discrete, atomistic entities (like "normative atoms") that populate a pre-existing landscape. The reconfigurative camp treats obligations as emergent properties of relational structures (like "normative ecosystems"). This is not merely verbal: the disagreement persists even when terminology is clarified, as both sides explicitly reject the other’s core metaphysical model when applying it to cases. It is not cross-purpose: both address the same question ("What *is* the binding force?"), but their answers imply incompatible ontologies. The dispute is substantive because it has downstream implications for moral psychology, personal identity, and the possibility of normative residue (e.g., duties to apologize after overriding a promise).

  **How each side interprets standard cases**:
  - **Coerced promises void**:  
    - *Additive*: No new reason was "created" because coercion vitiates the voluntariness required for reason-generation.  
    - *Reconfigurative*: Coercion prevents the normative reorganization—the promisor’s agency isn’t integrated into a new relational structure.  
  - **Promise to do wrong invalid**:  
    - *Additive*: The "promise reason" exists but is massively outweighed by the pre-existing reason against wrongdoing.  
    - *Reconfigurative*: The promised act’s immorality blocks the reorganization—no coherent structure emerges from combining it with other reasons.  
  - **Apology required after breach**:  
    - *Additive*: Apology acknowledges the persistent, unaddressed reason introduced by the promise.  
    - *Reconfigurative*: Apology repairs the disrupted relational equilibrium.  

  **Progress through "deferred preference revelation"**:  
  This case favors the **reconfigurative view**. When both parties know the promisor’s preferences will predictably shift (e.g., promising not to sell a family heirloom despite future financial temptation), the additive view struggles: if the "promise reason" binds the future self directly, it must override or ignore the future self’s preferences, treating that self as a passive recipient of past reasons. The reconfigurative view, however, naturally handles this: the promise restructures the *entire diachronic practical landscape*, making the future self’s shifted preferences *part of a pre-constrained framework*. The promisor isn’t "adding a reason" for their future self but *designing a normative architecture* that anticipates preference change. For progress, this thought experiment reveals that the additive view implicitly denies temporal moral agency, while the reconfigurative view affirms it—a substantive divergence.

  **What progress looks like**: Targeted thought experiments that isolate metaphysical commitments, particularly those involving time, identity, or moral residue (e.g., "Can a promise create an obligation if all pre-existing reasons *cancel out*?"). Empirical studies on moral psychology (e.g., whether promise-breaking feels like violating a "thing" or disrupting a "balance") are unlikely to resolve the core metaphysical dispute but could expose which model better aligns with lived experience.

  ---

