answer: |-
  The smoke reached Kael’s nostrils before the heat – a dry, papery scent laced with the tang of burning varnish. It coiled from beneath the heavy oak door leading to the West Wing stacks. His domain. The air crackled, not just with heat, but with the whispers of a million might-have-beens.

  Kael moved with unnatural calm towards the door, his hand hovering over the brass handle. It pulsed with warmth. Behind him, Lysander, the junior archivist, skidded to a halt, face pale. "Kael! Fire! Section 12, I think! Smoke detectors are screaming! We need water, extinguishers, *now*!"

  Kael didn’t turn. His eyes scanned the familiar, towering shelves stretching into the gloom. Each shelf wasn't labelled by subject, but by a pivotal moment in his own life. ‘Shelf 7-C: Declined the Job in Prague’. ‘Shelf 23-A: Told Elara the Truth’. ‘Shelf 5-F: Took the Midnight Train’. Each held leather-bound logs detailing the branching realities spun from that single choice – lives lived, people met, consequences unfolded, meticulously recorded. The air hummed with their silent potential.

  "The sprinklers are malfunctioning," Kael stated, his voice flat. "The fire suppression system for this wing is isolated. If it spreads unchecked, the entire library burns. But…" He finally looked at Lysander, his gaze distant. "If I deliberately burn *one* shelf now, creating a firebreak… I could save the rest."

  Lysander stared, incredulous. "Then *pick* one! Any one! Burn the bloody ‘Forgot Mother’s Birthday’ shelf! Who cares? Just *do* something before it’s too late!" He gestured wildly at the smoke thickening under the door. "Listen! Adapt!"

  Kael shook his head slowly. "It’s not about which shelf *seems* least valuable *now*. That’s the trap."

  "What trap?" Lysander yelled, grabbing Kael’s arm. "The fire’s spreading *based on what’s actually happening*! Look at the smoke! Feel the heat! You have to *update*!"

  "Exactly," Kael murmured, pulling his arm free. "If I look at the smoke, feel the heat, and *then* choose a shelf based on that… I break consistency."

  "Consistency? This isn't philosophy hour! The building’s on fire!"

  Kael turned his back on the door, facing the oppressive stillness of the untouched stacks. "Think of it this way, Lysander. There are many versions of me standing in libraries facing fires. Some see smoke on the left, some on the right. Some see no smoke at all yet. But they are *all* Kael. They all follow the *same* rule. What rule can I follow *now*," he tapped his temple, "that, if *every* version of me followed it *without* looking at their specific smoke, would lead to the most intact collection *across all possibilities*?"

  Lysander looked lost. "You’re talking nonsense! Your *specific* smoke is right there!" He kicked the base of the door. A fresh plume seeped out. "Act on *that*!"

  Kael ignored him, pacing slowly down the central aisle. His fingers trailed over spines. ‘Chose the Blue Suit’. ‘Said Yes to the Whisky’. ‘Walked Away from the Fight’. Each title a universe discarded.

  "If I update based on *my* observed smoke," Kael continued, almost to himself, "then a Kael seeing smoke near Shelf A burns Shelf B. A Kael seeing smoke near Shelf B burns Shelf A. But what if the fire is slow? What if it starts centrally? They burn valuable shelves unnecessarily. The rule needs to work… updateless. Before the smoke tells its particular story."

  "So you burn nothing? Let it all burn?" Lysander choked.

  "No. I burn the shelf whose loss… is least catastrophic *regardless* of where the fire starts. The one whose branches hold… redundancies. Echoes found elsewhere." Kael stopped. His hand rested on a shelf labelled simply: ‘Unlived Lives: Minor Hesitations’. Shelves filled with logs of paths not taken because of a skipped bus, a forgotten name, a fleeting doubt – the infinitesimal choices that never truly diverged far from the main trunk.

  "This one," Kael said, his voice firming. "The possibilities here… they ripple, but they rarely change the core narrative. They are phantoms. The loss is… contained."

  "You can’t know that!" Lysander pleaded, his voice cracking with panic and the thickening air. "Just *look*! Check the wing! See where it’s worst!"

  "Updating breaks the rule," Kael repeated, a mantra against the rising roar from beyond the door. He strode to a glass case containing a ceremonial fire axe. He smashed it.

  "Kael, *no*! You don't even know if you *need* to burn anything yet!" Lysander scrambled back as Kael hefted the axe, his calmness terrifying.

  "The rule is the rule," Kael said. He walked towards the ‘Unlived Lives’ section. He didn’t look back at the smoky door. He didn’t assess. He simply swung the axe with brutal efficiency into the base of the towering shelf. Wood splintered. He dragged flammable cleaning rags from a nearby closet, doused the shattered wood, and struck a match from his pocket.

  The fire *he* started bloomed hungrily, far faster than the slow creep beyond the door. It climbed the dry logs, the leather bindings curling and blackening. The air filled not just with smoke, but with the smell of ink evaporating, of possibilities immolating. Kael stood back, watching his chosen fire rage, a grim firewall against the unseen threat.

  Lysander sobbed, covering his face.

  The firebreak worked. The blaze from the West Wing met Kael’s sacrificial pyre, consumed the offered fuel, and died against the charred gap. The main library was saved.

  Hours later, covered in soot and reeking of smoke and despair, Kael walked through the salvaged stacks. He stopped where the ‘Unlived Lives’ section had been. Only a scorched scar on the marble floor remained.

  He knelt. Among the ashes, almost untouched, lay a single, slim log. Its cover was singed but legible: ‘Hesitated Before Leaving the Cafe’. Idly, numb, Kael opened it. Inside, in neat script, was a detailed account of a single afternoon prolonged by a missed step, a dropped scarf, a conversation struck with a stranger who wasn't there in his lived timeline. It described a laugh shared over spilt tea, a fleeting warmth, a glimpse of a kindness offered for no reason other than presence. It described a man who briefly, beautifully, wasn't lonely.

  Kael traced the words. He’d saved the grand narratives, the major forks, the defining choices. He’d followed his rule, updateless, and it had worked. The core collection was intact.

  But here, in the ashes of the path untaken, was something fragile and singular. A small, perfect moment of connection that never was, and now, thanks to his unwavering rule, never could be. Not even as a record. He closed the charred cover gently, the phantom warmth of that unrealized afternoon bleeding into the cold, smoky silence of the saved library. He had preserved the map, but erased a unique, tiny island. The cost of consistency settled on him, heavier than the axe he’d wielded.
