  Okay, let me start by unpacking the user's query. They're discussing David Lewis's theory of conventions as arbitrary solutions to coordination problems, like driving on the right or left. The user brings up an evolutionary angle: cultural selection might favor one convention over others, making it seem non-arbitrary. The core question is whether this evolutionary process negates the arbitrariness Lewis emphasized.

  First, I need to recall Lewis's definition. Conventions are arbitrary because multiple equilibria could work equally well—driving on either side is fine as long as everyone agrees. Stability comes from mutual expectations, not intrinsic superiority. The user introduces evolution: over time, cultural pressures might select the most efficient or robust convention, making the surviving one seem inevitable. 

  So, the user is asking if this evolutionary process means Lewis was wrong about arbitrariness. They also mention a possible confusion between modal possibility (alternatives could have worked) and causal history (one alternative was selected). The example given is right-hand driving outcompeting left-hand driving globally. Does that make right-hand necessary now?

  I should break this down. The key is distinguishing between the origin of a convention and its current status. Even if evolution selects one convention, the initial choice between equally viable options remains arbitrary. The fact that right-hand driving dominates doesn't mean left-hand wouldn't have worked just as well if history had been different. 

  The user might be conflating the outcome of selection with the nature of the options. Evolutionary success doesn't erase the initial arbitrariness. It's about path dependence: once a convention is established, switching costs make it stable. But the alternatives were still possible initially. 

  Also, the user wonders if the rule is now functionally necessary. But necessary for what? Efficiency under current conditions? That's different from being the only possible solution. Right-hand driving isn't necessary in a vacuum; it's necessary now because of the existing infrastructure and expectations. Change would be costly, but not impossible. 

  I should consider possible deeper interests. The user might be exploring philosophical concepts like determinism versus free will in social norms, or how cultural evolution impacts traditional philosophy. They might also be interested in applying this to real-world examples, like language standards or tech formats (QWERTY vs. Dvorak). 

  Another angle: the objection confuses the modal and causal claims. The evolutionary story explains why one convention spread (causal), but doesn't negate that others were possible (modal). Lewis's arbitrariness is about the modal aspect—multiple equilibria could have solved the problem. 

  So, even with cultural evolution, conventions remain arbitrary in Lewis's sense. The dominance of one doesn't make it intrinsically better; it's a result of historical contingencies. The functional necessity is context-dependent, not absolute. 

  I should also address the example explicitly. Right-hand driving's prevalence is due to factors like the influence of major car-producing countries, not because it's superior. Left-hand systems work fine where they exist. The arbitrariness persists despite the current imbalance. 

  In conclusion, evolutionary dynamics don't invalidate Lewis's arbitrariness. They explain the stability and spread but not the initial equivalence of options. The objection does confuse modal and causal claims. The rule isn't functionally necessary; it's conventional with high switching costs.
answer: |-
  Lewis's account of conventions as *arbitrary* regularities solving coordination problems remains valid even when considering cultural evolution. The evolutionary dynamics you describe do not refute the core idea of arbitrariness; instead, they highlight a crucial distinction between *modal possibility* and *historical contingency*. Here's a breakdown:

  1.  **Lewis's Core Claim of Arbitrariness:**
      *   Focuses on the **initial state**: Multiple equilibria (e.g., driving on left *or* right) are *equally functional* solutions to the coordination problem (safe traffic flow). None has *intrinsic superiority* at the outset.
      *   **Stability comes from mutual expectations**: People conform because they expect others to conform, creating a self-reinforcing loop. The choice of *which* equilibrium is not dictated by the problem itself.

  2.  **Evolutionary Dynamics & The Illusion of Determinism:**
      *   **Selection Pressures Act *After* Convention Emergence:** Cultural evolution (e.g., network effects, standardization benefits, reduced cognitive load) favors the *established* convention, making it more robust and harder to displace over time. It "locks in" one solution.
      *   **Path Dependence:** The outcome depends heavily on initial, often random or contingent, events (e.g., Napoleon favoring the right, British naval tradition influencing left-hand traffic). Small historical accidents can have massive long-term effects.
      *   **"Survival of the Fittest" Misapplied:** While the *surviving* convention is the most stable/efficient *within the historical path that occurred*, this does **not** mean the *alternative* was inherently *less* stable or efficient *at the point of origin*. It simply lost the historical race due to contingent factors.

  3.  **Resolving the Apparent Contradiction: Confusing Modal and Causal Claims:**
      *   **Lewis's Modal Claim (Arbitrariness):** "Alternative equilibria *were possible* solutions at the start; none was uniquely dictated." This claim is about the *nature of the coordination problem itself*.
      *   **Evolutionary Causal Claim:** "Due to specific historical events and subsequent selection pressures, *one particular equilibrium became dominant and persisted*." This is a claim about *historical causation*.
      *   **The Objection's Error:** It mistakes the causal explanation for *why one convention won* (evolutionary selection) as proof that *alternatives were never genuinely possible or equally viable*. This is a confusion of modality (possibility) with actual historical causation.

  4.  **Addressing the Driving Example:**
      *   **Right-Hand Dominance:** The fact that right-hand driving dominates globally is primarily due to historical contingencies (e.g., French revolutionary influence, US automotive industry dominance) and subsequent network effects/standardization benefits. It does **not** prove that right-hand driving is intrinsically safer, more efficient, or "necessary" in an absolute sense.
      *   **Persisting Arbitrariness:** The arbitrariness is **not resolved**. Left-hand driving systems (e.g., UK, Japan, Australia) function *just as well* as right-hand systems within their own contexts. The high cost and disruption of switching *now* is a consequence of path dependence and lock-in, **not** proof that left-hand driving was ever inherently inferior or impossible as a solution.
      *   **Conventional, Not Necessary:** The rule remains **conventional**. It is *functionally necessary **given the existing system and infrastructure*** (switching *now* would be disastrous). However, it is **not functionally necessary *simpliciter***. Had history unfolded differently, a left-hand global standard could exist and function equally well. Its current "necessity" is contextual and contingent, not absolute.

  **Conclusion:**

  Evolutionary dynamics do **not** show Lewis was wrong to insist on arbitrariness. They explain *how* one arbitrary equilibrium becomes entrenched and *appears* inevitable or "selected" over the long term. The objection *does* confuse the modal claim (alternatives were possible and equally good solutions *ex ante*) with the causal claim (a specific alternative became dominant *ex post* due to contingent historical processes and subsequent selection pressures). The surviving regularity, no matter how robust or widespread, remains fundamentally conventional and arbitrary in Lewis's sense. Its dominance reflects historical path dependence and the power of self-reinforcing expectations, not the intrinsic functional necessity of that *particular* solution over its equally viable rivals. The "functional necessity" is an *emergent property* of the established system, not a property of the rule itself in isolation.
