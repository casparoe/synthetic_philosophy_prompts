answer: |-
  Here’s your Q&A prep sheet, tailored to your audience and argument. Prioritize objections by likelihood/damage and include strategic concessions.

  **Opening Concession to Defuse Tension:**  
  *"Before questions, I acknowledge my argument relies heavily on normative persistence conditions—artistic intent, function, and cultural norms. These aren’t reducible to physics, and if you demand a purely physical ontology, my thesis won’t persuade you. I argue these norms are real constraints on identity in our conceptual ecology."*

  **Weakest Point in Your Position:**  
  The **observer-dependence of artistic-intentional continuity**. If intention is subjective (e.g., does the statue persist if the artist changes their mind? If a curator misidentifies it?), your persistence condition risks being unstable. *Prep Defense:* Argue that artistic intent is socially embedded and institutionally validated (e.g., artworld practices), making it intersubjectively robust, not arbitrary.

  ---

  ### **Likely Objections & Replies**  
  *(Ordered: Most Likely & Damaging → Least)*  

  1. **AP Philosophy Teacher (Skeptical of Non-Physical Persistence):**  
     *Objection:* "You admit artistic-intentional continuity isn’t physical. But if the clay and statue share all material parts *now*, positing distinct entities violates parsimony. Isn’t this just a linguistic/conventional distinction without ontological difference?"  
     *Reply (2 min):* "Parsimony applies *within* an ontological framework—but if we take normativity seriously (e.g., legal personhood, artwork authenticity), non-physical criteria have causal power. Destroying the statue voids warranties, invalidates provenance, and changes aesthetic experience, even if atoms persist. Conceding ground: Yes, this requires accepting normative facts as real. Weakness: If norms are *reducible* to psychology, my distinction collapses."  

  2. **Visiting Undergraduates (4Dists):**  
     *Objection:* "This is just exdurance (*stage theory*) in disguise! You’ve relabeled ‘temporal counterpart relations’ as ‘persistence conditions.’ The statue is a time-indexed ‘stage’ of the clay with different modal properties."  
     *Reply (2 min):* "Exdurance avoids distinct entities by indexing identity to times—but I posit two *co-present* entities with divergent *future* conditions. When the clay is melted, the statue ceases *now* despite the clay’s persistence. This is numerical distinction, not temporal indexing. Weakness: If 4Dists treat persistence conditions as disguised modal-temporal parts, I need stronger arguments against reducibility."  

  3. **Logical-Positivist Classmate:**  
     *Objection:* "How do you empirically verify ‘artistic-intentional continuity’? If I can’t measure it, isn’t ‘the statue dies when melted’ just a emotive statement about clay rearrangement?"  
     *Reply (2 min):* "Verify via social behavior: Auction houses, museums, and courts track statues (not clay) using intentional criteria. The $10M value of ‘Michelangelo’s David’ vanishes if recast as a coin, though atoms persist. This is observable institutional fact. Concession: Yes, *metaphysical* identity isn’t empirically provable—but neither is 4D temporal parts. Weakness: Positivists may reject institutional facts as non-basic."  

  4. **Buddhist-Anicca Peer:**  
     *Objection:* "Aren’t you clinging to ‘statue’ as a substantial self? All you have is clay + ever-changing intentions. Why reify impermanent aggregates into a ‘thing’?"  
     *Reply (2 min):* "I agree the statue is process-dependent! But pragmatic reality requires us to track functional unities (e.g., ‘a university’ persists despite total turnover of people/bricks). The statue is a conventional truth (*samvrtisatya*) with normative force. Weakness: If conventional truths are *only* pragmatic, not ontological, our positions converge."  

  5. **AP Teacher (Follow-Up):**  
     *Objection:* "If the clay is atom-for-atom reassembled tomorrow, is it the same statue? If no, how is this not modal divergence?"  
     *Reply (2 min):* "Reassembly creates a replica, not the original statue, because artistic continuity was broken. This is a historical, not modal, fact—like why a reassembled watch from new parts isn’t ‘your grandfather’s watch.’ Concession: Temporal gaps *might* require modal talk, but melting→coin has no gap."  

  6. **Undergraduates (Follow-Up):**  
     *Objection:* "Why not say the statue *is* the clay under an artistic ‘sortal’? That avoids distinct entities and explains divergent persistence linguistically."  
     *Reply (2 min):* "Sortal-dependence works for *description* but not *destruction*. When melted, the clay still exists under a ‘material sortal,’ but the statue ceases *ontologically*. If they were identical, destroying one would destroy the other."  

  ---

  ### **The Devastating "Hoped Nobody Asks" Objection**  
  **Source:** *4Dist Undergraduates or AP Teacher*  
  **Question:** "If persistence conditions are *normative*, doesn’t that make them *modal properties*? You say the statue *must* maintain form/function to persist—that’s a de re modal claim. Doesn’t your ‘no modal cost’ claim self-destruct?"  

  **Why Devastating:**  
  Your entire argument hinges on avoiding modal properties (to block Leibniz’s Law). If norms entail modality, you’ve smuggled in the very thing you rejected.  

  **If Asked:**  
  1. **Concede:** "You’re right that normative conditions *imply* modality—but they’re grounded in *actual* social practices, not abstract possibilia.  
  2. **Reframe:** "This is *institutional* modality (like ‘a dollar bill *must* be issued by the Fed’), not metaphysical.  
  3. **Fallback:** "Even if modal, it’s *derived* from norms, not fundamental—so relocation strategies still fail."  
  *Weakness:* This risks collapsing your core innovation. Best to preempt by stressing "non-*fundamental*-modality" in your talk.  

  **Prep Strategy:**  
  - Drill the *teacher’s* objection #1—it’s the lynchpin.  
  - For undergrads, emphasize *co-presence* (two entities now, not temporal parts).  
  - For the positivist, pivot to institutional verification.  
  - **Defend your weakest point:** Stress that artistic intent is no more subjective than legal ownership.  

  Good luck—your thesis is razor-wire tight for high school. Lean into the normative ontology boldly.
