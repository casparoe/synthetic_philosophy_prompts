  hey, i'm a phd student in phil of mind working on phenomenal concepts and now i'm stuck on an argument i cooked up for my semenar. can you act like a senior researcher and think really carefully? start with a quick brainstorm of which premises smell wrong, then bottom line up front, then the details — keep the whole response under 350 words max, with the bottom line in one paragraph.

  here's the argument that seems to prove too much. (1) Mary's room shows that complete physical knowledge about color vision doesn't include knowledge of what red is like. (2) If physicalism is true, Mary's post-release gain must be either a new ability or the same old facts under new phenomenal concepts — either way, no non-physical fact is added, just a change in her representational state. (3) Now take any physical system S that runs the exact same color-processing algorithms as Mary's brain but lacks consciousness. By (2), S's states are just representations of physical facts, and since phenomenal concepts are just representations, S should be able to form them if its architecture allows. (4) But S doesn't form them because it's not conscious, so consciousness is required to deploy phenomenal concepts. (5) That means explaining Mary's knowledge requires appealing to consciousness, but consciousness is exactly what we're trying to explain physically — circular. (6) The only escape is that S actually does have some minimal phenomenal state tied to its processing; otherwise the Mary/S difference is magical, not physical. (7) So Mary's argument, combined with the standard physicalist replies, forces hidden phenomenal properties onto every information-processing system. that's panpsychism. where does it slip? i really want to keep (1) and reject (7), but tell me which premise or step is the weakest, why it looked fine, and what rejecting it costs — especially whether it saves physicalism without making Mary's gain trivial.
