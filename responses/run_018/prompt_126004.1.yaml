  The Burkean argument has weight: removing a corruption safeguard without understanding why it existed is risky. But the pro-change side isn't wrong that blindly following old rules is problematic. 

  The epistemic scaffolding concept suggests the rule itself encodes anti-nepotism wisdom that outlasts individual memory. Removing it might collapse that structure. But counterpoint: modern systems (like recusal protocols) might make this scaffolding obsolete.

