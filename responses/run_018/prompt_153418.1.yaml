answer: |-
  Here's a systematic dissection of your ex-ante risk-prioritarian view, prioritizing critiques from most fundamental to least, written as a senior scholar engaging a sophisticated peer:

  **Core Premise Clarified:** You propose weighting moral urgency by individuals' *exposure to risk* within a "social lottery" *before* outcomes are known, rather than weighting by *ex-post welfare levels*. This aims to avoid leveling-down objections by decoupling moral concern from outcome inequality *per se* and anchoring it solely in the initial, justly distributed *burden of facing uncertainty*.

  **Ranked Defeaters (Fatal to Awkward):**

  1.  **The Diamond Collapse Problem (Potentially Fatal):**
      *   **The Scenario:** Diamond's (1967) classic critique of Harsanyi. Two patients, one needs a kidney. Flip a coin to decide who gets it (ex-ante equal chance). You *can* bias the coin (e.g., 51% for A, 49% for B). Ex-post prioritarianism (or egalitarianism) might favor the fair coin for equity. Pure ex-ante utilitarianism is indifferent.
      *   **Your View's Dilemma:** If your prioritarian weighting applies *only* at the ex-ante stage, the biased coin *reduces* risk dispersion (slightly lowers variance in individual chances). Yet, it feels *less fair* than the unbiased coin. To condemn the bias and favor the fair coin, you *must* introduce an ex-post concern (either for equality of outcome or for the ex-post realization of the "fair chance"). This collapses your view back into needing *some* ex-post egalitarian element precisely in cases designed to isolate procedural fairness from pure ex-ante aggregation. A committed defender *must* concede this point: pure ex-ante risk aggregation cannot capture the full moral intuition about fairness in lotteries. It either becomes indifferent (like utilitarianism) or smuggles in ex-post concerns.

  2.  **Misalignment with Catastrophic Risk Aversion & Ruin Probabilities (High Severity):**
      *   **The Issue:** Standard prioritarianism (ex-post) inherently encodes risk aversion over welfare levels, often leading to strong aversion to catastrophically bad outcomes ("ruin") for individuals. Ex-ante risk prioritarianism weights the *exposure* to risk, but its aggregation over individuals *might not* adequately prioritize avoiding situations with small probabilities of existential/catastrophic harm to *many*.
      *   **Why?** Your view focuses on the distribution of *individual risk burdens*. A scenario where *everyone* faces a tiny, independent risk of utter ruin might show low risk dispersion (similar burdens) and thus low prioritarian urgency, even though the societal "risk of ruin" (probability *someone* is ruined) is high. Conversely, a scenario where one person faces near-certain ruin while others face none would trigger high urgency. But standard intuitions often demand *extreme* aversion to systemic catastrophic risks (e.g., pandemic, nuclear war), even if individual risk burdens are similar and small. Your view *might* capture this if the risk is perfectly correlated, but struggles with independent or complexly correlated catastrophic risks. It potentially *underweights* diffuse existential threats compared to concentrated, certain miseries. This challenges its claim to handle risk comprehensively.

  3.  **The "Double Jeopardy" of Historical Injustice & Correlated Risks (High Severity):**
      *   **The Challenge:** Past injustices (systemic discrimination) create *correlated risk exposures*. Group X faces persistently higher risks of poverty, violence, poor health *because* of their group membership, creating dependencies between risks.
      *   **Your View's Limitation:** Focusing *solely* on the ex-ante risk profile *at a single point in time* abstracts away *why* risks are distributed as they are. It may prescribe the same distribution of future risks for two populations: one historically advantaged (low baseline risk), one historically oppressed (high, correlated baseline risk). Achieving identical future ex-ante risk distributions *ignores* the compounded disadvantage arising from *past* risk realization and the *interdependence* of risks stemming from systemic factors. Compensation for past injustice often requires *more* than equalizing *future* risks; it may demand ex-post transfers to rectify the *consequences* of *past* unjustly distributed risks that materialized. Your view struggles to justify corrective justice or reparations that go beyond equalizing current/future risk profiles. This feels like a major gap in handling real-world injustice.

  4.  **Formal Instability: Harsanyi Aggregation & The Independence Axiom (Medium Severity):**
      *   **Harsanyi's Result:** Under seemingly mild axioms (Pareto Indifference, Pareto Optimality, Independence of Irrelevant Alternatives - IIA), social preferences over lotteries *must* be representable as the expected value of a *linear* aggregation of individual utilities (i.e., utilitarianism).
      *   **The Conflict:** Ex-ante prioritarianism inherently violates IIA. IIA requires that the social preference between two lotteries depends *only* on the individuals' outcomes in states where the two lotteries differ. Prioritarian weighting makes the social ranking depend on the *overall risk profile* (the distribution of chances across the whole lottery), which includes states where the lotteries *are* identical. The weight given to improving an outcome for a badly-off-risk individual depends on their *overall* standing in the risk distribution, not *just* the outcomes in differing states.
      *   **Implication:** Your view is formally incompatible with the standard axioms leading to Harsanyi's utilitarianism. This isn't necessarily *fatal* – many reject IIA for good ethical reasons (Diamond's case is a prime example!). **However, a committed defender must concede:** Your view requires explicitly rejecting IIA and embracing a form of social aggregation where the *context* of the entire risk distribution matters fundamentally for the valuation of changes in specific outcomes. This makes it formally distinct and potentially more complex.

  5.  **The "Risk Metric" Problem: Unfalsifiability or Theoretical Indeterminacy? (Awkward, but Important):**
      *   **The Concern:** You rightly anticipate the critique: "If any counterexample shows my risk metric gives the 'wrong' answer, I'll just tweak the metric!" (e.g., variance vs. downside semi-variance vs. Gini over chances vs. individual expected welfare variance, etc.).
      *   **Assessment:**
          *   **Not *Inherently* Fatal for Normativity:** Normative theories aren't falsifiable like scientific ones. "Tweaking" in response to counterexamples is *how* moral theorizing often progresses (e.g., refining utilitarianism to handle utility monsters). The goal is reflective equilibrium.
          *   **The Danger:** The risk becomes **theoretical indeterminacy** or **loss of distinctiveness**.
              *   *Indeterminacy:* Without principled constraints on the "risk metric," the view becomes empty. What *makes* a risk distribution "bad"? Mere inequality of chances? The likelihood someone faces high downside risk? The total expected welfare variance? Different metrics yield wildly different prescriptions.
              *   *Loss of Distinctiveness:* If the metric is tweaked endlessly to mimic the prescriptions of ex-post prioritarianism or sufficientarianism in all cases, the "ex-ante risk" framing becomes merely a *redescription*, not a genuinely distinct theory. The *explanatory power* is lost.
      *   **Defender's Concession:** You *must* provide a **principled, substantive account of the "risk burden"** that is being prioritized. What *is* the morally salient feature of risk exposure? Is it anxiety? Lack of control? The threat to autonomy? The potential for absolute deprivation? Simply "variance in expected welfare" is unlikely to capture all intuitions driving prioritarianism and may collapse into technical arbitrariness if not grounded in deeper moral psychology or value theory. **The metric cannot be *ad hoc*; it needs a robust philosophical foundation.**

  6.  **Leveling-Down Revisited: Future Risks & Stability (Awkward, but Worth Addressing):**
      *   **The Standard Dodge:** You argue leveling-down is irrelevant because harming the well-off ex-post doesn't reduce anyone's *ex-ante* risk burden (which was already fixed).
      *   **Potential Rebuttal:** Ex-post outcomes *can* influence *future* risk distributions and the *stability* of the just ex-ante risk allocation. Deliberately leveling down could:
          1.  Increase societal instability, potentially raising *future* risks for everyone (especially the worst-off).
          2.  Undermine trust in institutions designed to maintain fair risk distributions.
          3.  Alter the opportunity sets and thus the *feasible* set of future ex-ante risk distributions (e.g., massive wealth destruction lowers the ceiling for everyone).
      *   **Defender's Response:** This is valid, but it attacks leveling-down on *instrumental* grounds (bad consequences for *future* risk distributions/welfare) rather than as an *intrinsic* objection. Your core claim – that *intrinsic* moral concern applies only to the ex-ante risk burden – remains intact. Leveling-down is *contingently* wrong because it worsens future prospects, not because equality *itself* is intrinsically valuable. This is a nuanced point worth clarifying, but it doesn't sink the core idea. It highlights the need to consider dynamic effects.

  **Conclusion & Advice for the Committed Defender:**

  Your ex-ante risk prioritarianism is a sophisticated and interesting attempt to reconfigure distributive justice around the burdens of uncertainty. A honest defender should prioritize confronting these challenges:

  1.  **Concede the Diamond Point:** Admit that pure ex-ante aggregation cannot fully capture procedural fairness intuitions without implicitly invoking ex-post considerations. Either bite the bullet (accept biasing the coin is permissible if it slightly reduces risk dispersion) or refine the view to incorporate a distinct principle of procedural fairness for lotteries.
  2.  **Grapple with Catastrophe & History:** Seriously address whether your framework adequately prioritizes (a) avoiding civilizational/correlated catastrophic risks and (b) rectifying the compounded disadvantage from past, realized unjust risks. This may require incorporating group-level risk analysis or historical context into the "risk burden" metric.
  3.  **Anchor the Risk Metric:** Develop a deep, non-arbitrary justification for *what constitutes a morally salient risk burden*. Is it threat to basic capabilities? Autonomy erosion? Anxiety? Mere statistical variance is insufficient. Ground it in a theory of the good or human vulnerability.
  4.  **Embrace the Formal Departure:** Explicitly defend the rejection of axioms like IIA as necessary for capturing the moral significance of the *overall distribution* of risk exposure. Don't hide from Harsanyi; argue why his framework misses something crucial.
  5.  **Clarify Dynamics:** Acknowledge that while ex-post leveling-down doesn't *intrinsically* address the prior ex-ante burden, its *instrumental* effects on future risks/welfare/stability provide strong contingent reasons to reject it.

  This view isn't "falsified," but its viability hinges on successfully navigating these deep challenges, particularly Diamond's collapse and the grounding of the risk metric. It remains a powerful and distinctive contribution to the prioritarian toolkit, forcing a valuable focus on the justice of uncertainty itself. Good luck with the dissertation! (And get that spacebar fixed.)
