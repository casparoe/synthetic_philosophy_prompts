  You're a senior moral philosopher and expert on distributive justice — please think carefully and start with some brainstorming before you answer. I'm a PhD student in ethics (ABD, technically) and I've come to hold a somewhat niche version of prioritarianism: I weight moral urgency by ex-ante risk exposure across a social lottery, not by ex-post welfare levels, which I think lets me dodge the leveling-down objection because harming the well-off doesn't reduce anyone's risk burden. But I want an honest map of what counts against it. Not just the usual "you still care about equality" line — I want the defeaters ranked from fatal to merely awkward. Which formal results in social-choice theory or risk aggregation break this framing? In what limit cases does ex-ante prioritarianism collapse back into ex-post egalitarianism, and would a smart defender have to concede that? Are there intuitions about compensation for past injustice or about catastrophic risk that this view handles badly? Also check whether I've insulated the view into unfalsifiability by letting me tweak the risk metric whenever a counterexample hits — and if so, is that actually a problem for a normative view like this? Please say what a committed prioritarian should themselves admit is dangerous, not just what critics shout. (Sorry for the typo's, I'm on my laptop with a sticky spacebar.)
