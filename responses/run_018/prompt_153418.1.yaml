  Catastrophic risks are another angle. If a small group bears a huge risk, ex-ante prioritarianism might allocate resources there. But if that risk is unlikely, it could neglect larger, certain harms. This pits risk dispersion against outcome severity, which their model might handle poorly. Also high severity if it leads to counterintuitive resource allocation in disasters.

  Unfalsifiability is tricky. If the user can redefine risk metrics when counterexamples arise, it might make the theory adaptable or unfalsifiable. But normative theories need to be testable against intuitions and cases. If they adjust the metric too freely, it becomes a "get-out-of-jail-free" card, weakening its persuasive power. That's an awkward, not fatal, issue but still important for academic rigor.

