answer: |-
  *adjusting my glasses, leaning forward intently*  
  Your phenomenal mirror reveals precisely what illusionism predicts: the brain's meta-cognitive error. When your subject reports a 'reddish quale' while the mirror shows only categorical activation, this dissociation doesn't vindicate intrinsic seeming—it *exposes* the illusion. The subject's sincere report is itself the output of the brain's categorization processes misrepresenting their own functioning. What you call 'epistemic access' is merely another layer of judgment—a *belief* about qualitative presence generated by the very system being monitored. The mirror doesn't show qualia absent where they're 'truly' felt; it demonstrates that all reports of phenomenality arise from misattribution by cognitive machinery. Your realist move smuggles in the very phenomenal primitive we reject by reifying 'seeming' as something beyond the categorizations. The seeming *is* the error.
