prompt: |-
  me and a coworker keep fighting about why dueling and slavery actually went away. she says moral revolutions are basically like fashion trends: once the cool people stop wearing them, everyone else drops it because being caught in it is embarrassing. she applies it to dueling (elites stopped) and slavery (it got economically embarrassing). i think she's borrowing Appiah's honor idea but missing the Williams point that rational arguments were always sitting there and rarely did the work, and maybe she's also blurring honor shifts into pure economic interest. can you audit the analogy? map it out: what's the fashion designer, the runway, the season change, the social cost of being unfashionable, and who plays the role of the critic saying "that outfit is immoral"? then tell me where the mapping breaks -- does it treat slavery and dueling as purely aesthetic choices? does it conflate status loss with interest loss? and does her conclusion that rational arguments never drive moral change survive once you separate status shifts from actual reasoning? lead with your bottom line in the first sentence, then give the reasoning, with no preamble and don't restate my question back at me.
