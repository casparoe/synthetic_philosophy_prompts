  First, I should map objections by likely sequence. The Malcolm student will probably strike first about verificationism - that's the most direct challenge to the premise. Then the Dennettians will hit the confabulation angle hard. The PP scholar might pounce on the self-model critique early, but I'll save the user's feared "explanatory value" objection for later since it requires more setup.

