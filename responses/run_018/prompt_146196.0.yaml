answer: |-
  Your "fragmentation thesis" is a sharp, provocative challenge to standard aggregationist views—far beyond mere scope neglect. It posits a *structural* break in moral accountability when harm is distributed across countless agents and victims, making aggregation non-linear or even non-existent. That's philosophically significant. But it *is* exposed to serious defeaters. Let's break them down, ranked from most to least threatening, with notes on which concessions could save the thesis without collapse.

  ### **Fatal Defeaters (Threaten Core Coherence)**
  1. **Intentional Collective Harms with Aggregate Effects**  
     - **Defeater**: Imagine a voting bloc of 1 billion people. Each knows that if all vote "yes," a dissident will be tortured, but each individual vote contributes only a 1-in-a-billion chance of triggering the torture (e.g., via a probabilistic mechanism). If all vote "yes," torture occurs. Intuitively, we *do* hold each voter blameworthy—despite minimal individual causal contribution.  
     - **Why fatal?** This directly attacks your "diluted ownership" claim. If each agent *intends* the collective harm (or accepts it as a foreseen outcome), their micro-agency doesn't dissolve moral ownership; it actively *constitutes* it through participatory intention.  
     - **Possible concession**: Limit the thesis to *unintentional* or *non-collaborative* harms. But this shrinks fragmentation to a narrow domain, losing its grandeur.

  2. **Threshold Vagueness → Unfalsifiability**  
     - **Defeater**: You posit a "threshold" where dilution negates accountability, but offer no principled way to define it. Is it 1,000 agents? 1 million? 10^100? Without criteria, the thesis risks becoming untestable: any counterexample can be dismissed as "below/above the threshold."  
     - **Why fatal?** A structural thesis needs clear boundaries. If the threshold is arbitrary, fragmentation collapses into epistemic bias ("we *can't perceive* distributed ownership") rather than ontology.  
     - **Possible concession**: Anchor the threshold to phenomenology (e.g., "ownership requires felt responsibility") or social practice (e.g., "ownership exists when institutional accountability mechanisms apply"). But this may concede ground to psychologists/legal theorists.

  ### **Strong Defeaters (Force Major Revisions)**
  3. **Negligence in Diffuse Systems**  
     - **Defeater**: Consider climate change. Each person’s CO₂ emissions (e.g., driving a car) contribute ~0.0000001% to a hurricane that kills thousands. Legally/morally, we still condemn *individual negligence* in aggregate harm, even without collective intent. Tort law’s "market-share liability" or moral theories of complicity (e.g., Kutz 2000) formalize this.  
     - **Why strong?** Accountability persists despite extreme causal fragmentation. This contradicts your claim that distributed harm severs the agent-victim relation.  
     - **Possible concession**: Accept "qualified ownership" for systemic harms (e.g., "you own *your contribution*, not the total harm"). This preserves fragmentation for *outcome*-ownership but not *act*-ownership.

  4. **Formal Models of Aggregate Responsibility**  
     - **Defeater**: Game-theoretic or deontic logic models (e.g., Braham & van Hees 2012) can show that minuscule individual contributions in n-agent dilemmas *do* linearly aggregate moral responsibility under specific conditions (e.g., symmetric actors, threshold effects).  
     - **Why strong?** If responsibility aggregates mathematically in idealized cases, your ontological threshold looks contingent, not necessary.  
     - **Possible concession**: Argue these models presuppose "agential entanglement" (e.g., mutual awareness) that’s absent in true fragmentation. But this may not save the torture vs. specks case.

  ### **Awkward Defeaters (Manageable but Require Work)**
  5. **Benefit Aggregation Symmetry**  
     - **Defeater**: Suppose you can save 3 billion people from a dust speck by enduring a mild itch. Intuitively, you *should* do it—benefits aggregate linearly. If fragmentation only blocks *harm*-aggregation, it looks ad hoc.  
     - **Why awkward?** It exposes asymmetry: why does ownership fragment for harms but not benefits? This may imply your thesis is harm-specific bias.  
     - **Possible concession**: Double down! Argue that *positive* ownership *does* aggregate (e.g., saving many *is* "yours"), but harm-ownership requires intent/control. Risky, but coherent.

  6. **Psychological Evidence on Explicit Agency**  
     - **Defeater**: Experiments showing people *do* assign blame for micro-contributions when agency is highlighted (e.g., "you alone diverted 0.001% of a river, starving 1 farmer"). If framing overcomes fragmentation intuitions, your thesis may reduce to cognitive bias.  
     - **Why awkward?** Moral ontology shouldn’t hinge on salience. But if explicit agency restores ownership, fragmentation isn’t structural—it’s perceptual.  
     - **Possible concession**: Claim that *making* agency explicit *creates* a new moral relation (e.g., "you now occupy a salient node"). Fragmentation still holds *by default*.

  ### **Your View’s Resilience & Strategic Concessions**
  - **Fatal weaknesses** center on threshold arbitrariness and intentional collectives. To survive, **define the threshold structurally**: e.g., ownership requires "non-infinitesimal causal responsibility" (>1/n for n-agents) or "practical possibility of agential control."  
  - **Concede without collapse**:  
    - Fragmentation applies only to *uncoordinated, unintentional* harms (e.g., dust specks from isolated acts).  
    - Ownership is *graded*, not binary—so aggregation exists but is sub-linear (e.g., 1 torture ≫ 1B specks, but >1 speck).  
  - **Don’t concede**: The core insight—that distributed harm isn’t just *psychologically* harder to aggregate but *structurally* different. Empirical psychology can’t refute this; it’s a metaphysical claim.

  ### **Final Verdict**
  Your thesis isn’t unfalsifiable *yet*, but it’s skating on thin ice. **Strongest defeater: intentional collective harms** (e.g., the voting bloc). If you can’t explain why fragmented agents in such cases *don’t* own the harm, fragmentation fails as a general theory. **Second biggest threat: threshold vagueness**. Solve this by grounding the threshold in agency theory (e.g., "ownership requires counterfactual efficacy over ≥1 unit of harm"). 

  This is defensible—but only if you narrow its scope or embrace graded ownership. The torture vs. specks problem remains a thorn in utilitarianism’s side, and your thesis boldly reframes it. Don’t abandon ship; just fortify the hull.
