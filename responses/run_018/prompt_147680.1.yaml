answer: |-
  Here’s a concise fellowship proposal addressing your core question, structured as requested:

  ---

  **Research Proposal: Convergence of Factored-Human HCH Trees**  
  **Duration:** 12 months  
  **Core Research Question:**  
  *Does recursive deliberation in an HCH tree converge when the "human" node is internally factored into non-identical sub-agents (e.g., epistemic evaluator + preference aggregator), and under what conditions does internal disagreement amplify or stabilize?*

  ### Background & Gap Analysis
  **Settled Foundations:**  
  1. **HCH Idealization:** Standard HCH (Hanson-Critch-Hibbard) models treat the human node as a **unitary rational agent** with consistent internal state. Recursive consultation converges to coherent answers under idealized assumptions (no bandwidth limits, perfect recall).  
  2. **Factored Cognition:** Task decomposition into modular subtasks (e.g., debate, recursive reward modeling) improves tractability and oversight in AI systems.  

  **Open Gap:**  
  Current work assumes either:  
  - A unitary human in HCH *or*  
  - Factored subtasks executed by identical/coordinated agents.  
  **The critical gap:** The impact of **persistent, structured disagreement** within a *single* human node (modeled as sub-agents with differing epistemic/axiological functions) on HCH’s recursive stability. This is unexplored, as neither HCH idealizations nor factored cognition frameworks model intra-human fragmentation recursively.

  ### Methodology (12-Month Plan)
  | Month | Activities |
  |-------|------------|
  | 1–2   | **Formalize Factored-Human Model:** Define sub-agents (e.g., Evaluator E, Aggregator A) with distinct parameters (priors, utility functions). Specify coupling constraints (e.g., shared memory, negotiation protocols). |
  | 3–4   | **Baseline: Unitary HCH Tree:** Simulate recursive consultation with unitary human nodes. Measure convergence speed/error across tree depths. |
  | 5–6   | **Factored-Human HCH (Minimal Case):** Implement 2-layer trees with factored root nodes. Test convergence under varying E/A alignment (e.g., identical vs. conflicting goals). |
  | 7–9   | **Scaling & Dynamics:** Expand to deeper trees. Introduce noise, imperfect recall, and adaptive sub-agent strategies. Compare metrics (KL divergence, agreement probability) vs. unitary baseline. |
  | 10–11 | **Sensitivity Analysis:** Identify critical parameters (e.g., coupling strength, sub-agent divergence thresholds) that trigger divergence/stability. Formal proofs for tractable subcases. |
  | 12    | **Synthesis & Reporting:** Characterize convergence conditions. Draft paper/thesis. |

  ### Evaluation Criteria
  - **Success:**  
    - Identification of necessary/sufficient conditions for convergence (e.g., "If sub-agent utility functions are ε-close, error amplification is bounded by *O(ε)*").  
    - Formal demonstration that factored HCH can *match or exceed* unitary HCH stability under realistic coupling.  
  - **Clear Failure:**  
    - Uncontrolled amplification of disagreement across recursion depths even with bounded initial sub-agent divergence.  
    - Convergence only under trivially restrictive assumptions (e.g., sub-agents share identical world models).  

  ### Scope & Constraints
  - **In Scope:** Formal/agent-based modeling of recursive deliberation; sensitivity to sub-agent design; comparison to unitary HCH.  
  - **Out of Scope:**  
    - Empirical studies with humans.  
    - Full neurocognitive modeling of human sub-agents.  
    - Integration with non-HCH factored systems (e.g., debate).  
  - **Feasibility:** Focused on mathematically tractable agent models (e.g., Bayesian reasoners) ensures 12-month viability.  

  ### Why This Matters
  Ignoring intra-human fragmentation in HCH may hide instability risks in scalable oversight. This work bridges the gap between "factored tasks" and "factored humans," clarifying whether recursive alignment can tolerate—or must suppress—internal diversity.

  ---

  **Key Clarifications:**  
  - **Settled:** HCH’s *structure* and factored cognition’s *modularity benefits* are consensus.  
  - **Contested:** Whether idealized HCH convergence proofs hold under *any* non-unitary agent model is unexplored—this proposal tests that frontier.  
  - **Handling Typos:** "HCH" in prompt interpreted as HCH; "factored deliberation" assumed as "factored cognition."
