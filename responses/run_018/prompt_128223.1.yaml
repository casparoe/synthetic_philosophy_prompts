  I am drafting the final exam for an upper-level seminar on rationality, epistemic game theory, and strategic reasoning. I need one essay question on superrationality that cannot be answered by reciting Hofstadter’s definition or summarizing standard prisoner's-dilemma applications. To force genuine conceptual work, the question should center on a constructed scenario—call it the Reflective Allocation Problem—in which three agents with structurally identical reasoning capacities must divide a non-transferable resource, each knowing that the others reason identically, but lacking full common knowledge of rationality because each can observe only the others’ preliminary reasoning steps rather than their final commitments. The prompt should require students to explain why superrational reasoning might recommend cooperative division in this triad even when standard game-theoretic rationality predicts competitive defection, and then to pinpoint exactly where the absence of common knowledge weakens the superrational argument without collapsing it back into ordinary expected-utility reasoning. Please write the exam question, a model answer of approximately 600 words, and a marking scheme that separates an A answer from a B answer by naming the specific moves each must contain—for instance, distinguishing agent-identification from belief-attribution, explaining why symmetric reasoning does not entail symmetric beliefs, and showing how the failure of common knowledge disrupts the iterative justification rather than the first-order choice. The scheme should also identify two specific errors that should cost marks, such as conflating superrationality with altruism or treating the missing common knowledge as irrelevant on the grounds that the agents remain individually rational. Specify a 75-minute time limit and allocate 25 total marks, with point values assigned to each required move. Do not ask for bibliographies, citations, or reading lists.
