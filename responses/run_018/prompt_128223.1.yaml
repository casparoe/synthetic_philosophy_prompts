answer: |-
  ### Final Exam: Rationality & Strategic Reasoning  
  **Time Allowed:** 75 minutes  
  **Total Marks:** 25  
  **Question:**  

  > **Reflective Allocation Problem**  
  > Three agents (A, B, C) must each demand up to 10 units of a non-transferable resource (15 units total available). Payoffs:  
  > - If total demand ≤ 15, each gets their demand.  
  > - If total demand > 15, no one gets anything.  
  >  
  > Each agent:  
  > (i) Has identical reasoning capacities;  
  > (ii) Observes the others’ *preliminary* demands (e.g., A sees B’s and C’s initial numbers, which they may revise);  
  > (iii) Cannot observe others’ final commitments until all submit simultaneously.  
  >  
  > **Prompt:**  
  > Explain why superrationality (SR) could recommend all demanding 5 units (cooperative division), while standard game theory (GT) predicts all demanding 10 (defection). Then, pinpoint how the *absence of full common knowledge of rationality (CKR)*—due to observing only preliminary steps—weakens the SR argument *without* reducing it to standard expected-utility reasoning.  

  ---

  ### Model Answer (600 words)  

  **Standard Game-Theoretic Prediction:**  
  GT assumes agents maximize individual expected utility with common knowledge of rationality (CKR). Here, demanding 10 dominates: If others demand ≤5, I get 10 instead of ≤5; if others demand >5, I get 0 regardless. Thus, (10,10,10) is the unique Nash equilibrium, yielding mutual defection (0 payoff).  

  **Superrationality’s Cooperative Argument:**  
  SR treats identical agents as "indistinguishable" in symmetrical reasoning. Since all agents share identical cognitive processes, they should reach identical conclusions. If all reason: "We are symmetric; thus, we *must* choose the same demand. Mutual defection (10) gives 0, while mutual cooperation (5) gives 5," they deduce that demanding 5 is collectively optimal. Unlike GT, SR rejects the "separateness" of agents: Each agent’s choice is entangled with others’ identical reasoning. Thus, SR recommends symmetric cooperation (5,5,5) as the only rational outcome.  

  **How Missing CKR Weakens (But Preserves) SR:**  
  The core SR argument—symmetric reasoning → symmetric choices—survives *first-order* symmetry recognition. Each agent knows:  
  > "The others reason identically to me; thus, we will all choose the same demand."  

  However, **full CKR fails** because agents observe *different preliminary signals*. Suppose A initially signals 6, B signals 7, and C signals 5. Each now sees asymmetric information:  
  > - A observes (B:7, C:5) → Believes others’ reasoning diverges from symmetry.  
  > - B observes (A:6, C:5) → Likewise, perceives asymmetry.  

  This disrupts **iterative justification**:  
  > - **With full CKR**: Agent A thinks: "I know B/C are identical to me. They know I know this, so they’ll demand 5." This nesting justifies mutual trust.  
  > - **Here**: A sees B’s signal=7 and thinks: "B *might* not have converged to symmetry yet, so they could demand 10." Even if all eventually demand 5, preliminary asymmetry injects doubt about whether others *truly* endorse SR.  

  Crucially, this does **not collapse SR into GT**:  
  - GT relies solely on dominance reasoning (always demand 10), ignoring symmetry.  
  - SR still *recommends* 5 based on first-order symmetry ("We are identical; thus, we *should* coordinate"). The failure of CKR only weakens the *certainty* that others will comply, but the normative force of symmetry persists. Agents may still demand 5 while fearing defection—a hybrid stance GT cannot explain.  

  **Key Distinction:** SR uses symmetry as a *logical constraint* on reasoning (identical minds → identical outputs), while GT treats agents as independent optimizers. The observability gap undermines iterative belief alignment but not the first-order symmetry principle.  

  ---

  ### Marking Scheme (25 Total Marks)  
  **A Grade (21–25 marks) Must:**  
  1. **Contrast GT vs. SR predictions** (3 marks):  
     - GT: Dominance → all demand 10 → Nash equilibrium → mutual defection (0).  
     - SR: Symmetric reasoning → all demand 5 → mutual cooperation (5).  
  2. **Explain SR’s reliance on agent symmetry** (4 marks):  
     - Agents are "indistinguishable" → choices must align logically (not strategically).  
  3. **Identify why CKR fails** (5 marks):  
     - Preliminary signals create *asymmetric beliefs* despite symmetric reasoning capacities (e.g., A sees different signals than B).  
  4. **Pinpoint the iterative failure** (5 marks):  
     - Breaks higher-order beliefs ("I know that you know I’m rational") due to observed asymmetry in preliminary steps → undermines trust in others’ commitment to symmetry.  
  5. **Show SR ≠ GT despite weakened CKR** (4 marks):  
     - SR retains first-order symmetry obligation ("We *should* choose 5"); GT ignores symmetry entirely.  
  6. **Avoid specified errors** (see below).  

  **B Grade (16–20 marks) May:**  
  - Correctly contrast GT/SR outcomes but vague on symmetry.  
  - Note CKR absence but not tie it to iterative beliefs.  
  - Claim SR "assumes cooperation" without logical basis.  

  **Deduct Marks for These Errors:**  
  - **-3 marks**: Conflating SR with altruism (e.g., "SR works because agents care about others").  
  - **-4 marks**: Claiming missing CKR is irrelevant because "agents remain individually rational" (misses how SR transcends individualism).  

  **Word Limit:** 600 words advised.  
  **No citations needed.**
