answer: |-
  ## Joint Statement: Evidentialism & Pragmatic Pluralism on Wrong-Kind Reasons

  **After sustained adversarial collaboration on the Wrong-Kind-Reasons (WKR) problem for belief, we, the Strict Evidentialist (SE) and the Pragmatic Pluralist (PP), agree on the following foundational points:**

  1.  **Belief vs. Commitment/Hope:** Belief that *p* is distinct from merely hoping that *p* or committing oneself to act *as if p*. Belief involves a representational stance toward the world purporting to match how things actually are. Commitment/Hope involves a practical stance oriented toward action or desire, which may persist independently of evidential assessments of *p*'s truth.
  2.  **Practical Stakes Matter (But for What?):** Practical consequences significantly impact the *rationality of actions* based on beliefs and the *appropriate standards of evidence required* for justified belief formation (e.g., higher stakes demand more evidence). They also impact the *rationality of adopting non-doxastic attitudes* like commitment or hope.
  3.  **The Grip of the WKR Problem:** The WKR problem gains traction precisely at the point of claiming that *pragmatic benefits* (e.g., happiness, motivational efficacy, social cohesion) can constitute *direct reasons for forming or sustaining the belief that p itself*, rather than merely reasons for acting, hoping, committing, or managing inquiry *as if p*. The core tension is whether such pragmatic benefits can ever legitimately feature in the *justification* for the *doxastic attitude* of belief, given belief's nature.

  **We Disagree on the Following Central Issue:**

  | Feature                  | Strict Evidentialist (SE) Position                                                                 | Pragmatic Pluralist (PP) Position                                                                                               |
  | :----------------------- | :------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------ |
  | **Truth-Aiming & Pragmatic Screening** | Belief is *constitutively* aimed solely at truth. This inherent aim *automatically screens out* pragmatic considerations as *reasons relevant to the belief itself*. Pragmatic factors can only influence actions *surrounding* belief (e.g., inquiry, assertion) or justify *non-doxastic* attitudes. | While belief *typically* aims at truth, this aim is not so rigidly constitutive that it *necessarily and automatically excludes* pragmatic benefits from playing a *partial, legitimate role* in sustaining a belief, *alongside* evidence, under specific conditions. Truth-aiming and pragmatic utility can sometimes be co-sustaining. |

  **Cruxes of the Disagreement & Predictions on Agreed Cases:**

  1.  **Crux: Evidence-Responsiveness Under Pragmatic Sustenance**
      *   **Question:** Can a belief remain genuinely *responsive to counter-evidence* if pragmatic benefits (e.g., motivational efficacy) are playing a significant, partial role in *sustaining* that belief?
      *   **Shared Case:** "Decent Mentor" Belief: An academic believes they are a decent mentor (DM) to their graduate students. This belief is *initially* based on positive feedback and student successes (evidence). However, they also recognize that *holding* this DM belief makes them more likely to *actually show up* for meetings, provide detailed feedback, and invest energy – acting in ways that *make* them a better mentor. The pragmatic benefit (being a better mentor by believing one is decent) partially sustains the DM belief.
      *   **SE Prediction:** If strong counter-evidence emerges (e.g., multiple students confidentially report consistent neglect, lack of useful feedback, feeling unsupported despite initial successes), the DM belief sustained partly by pragmatic benefit **will be significantly less responsive** to this evidence. The subject will be more prone to dismissal, motivated reasoning, or recalcitrance to preserve the motivating benefit. The pragmatic element *corrupts* the belief's essential function of tracking truth.
      *   **PP Prediction:** The DM belief **can remain responsive** to the counter-evidence. The pragmatic benefit creates a *reason to scrutinize the evidence carefully* (to ensure the belief remains accurate and thus genuinely motivating), not necessarily to ignore it. The subject might investigate the complaints, seek more feedback, and revise the belief (e.g., to "I need significant improvement in areas X and Y") if warranted, *even while valuing* the motivational role the *previous* belief played. Pragmatic sustenance doesn't inherently block evidence-tracking.

  2.  **Crux: Mediating Attitudes vs. Belief Corruption**
      *   **Question:** Can a mediating non-doxastic attitude (like a practical commitment) effectively absorb *all* the rational work the Pragmatic Pluralist wants pragmatic reasons to do, thereby shielding belief itself from needing to incorporate pragmatic considerations, without functionally "corrupting" the belief's content or responsiveness?
      *   **Shared Case:** "High-Stakes Treatment" Scenario: A patient faces a severe illness with a novel, potentially life-saving but risky treatment. The available evidence suggests a *modest* chance of success (e.g., 30%). Acting decisively *as if* the treatment will work is crucial for adherence and potentially improves outcomes (the placebo/adherence effect). The PP wants to say there's a "right kind" of reason here influencing the patient's cognitive landscape regarding the treatment.
      *   **SE Proposal:** The patient should form the *evidenced belief*: "The treatment has a 30% chance of success." Alongside this, they should adopt a strong, distinct *practical commitment*: "I commit fully to undergoing this treatment and acting *as if* I will be in the successful 30%, because this commitment maximizes my actual chances (through adherence, positive mindset)." The commitment does all the practical work.
      *   **SE Prediction:** This separation **effectively shields the belief** from pragmatic distortion. The belief "30% chance" remains clear, evidence-based, and revisable by new medical data. The commitment drives action and hope without altering the core doxastic state. The PP's need is met without touching belief.
      *   **PP Prediction:** Insisting on *only* the "30% chance" belief plus a separate commitment **functionally corrupts** or inadequately captures the phenomenology and rational force required. The patient *needs* a more affirmative attitude than a mere probabilistic belief to sustain the necessary hope and resolve – something like "I believe this treatment *can* and *will* work *for me*" (even if acknowledging the statistical odds). Forcing this into a non-doxastic "commitment" either (a) becomes psychologically indistinguishable from a pragmatic belief, or (b) is too weak to generate the necessary resolve, failing to do the required work. The mediating attitude either collapses into belief or fails.

  **Note on Verbal Disagreement:** Part of our dispute appears verbal regarding the *scope* of the term "belief." The SE reserves "belief" strictly for an attitude based *only* on evidence and constitutively screened from pragmatic influence. The PP uses "belief" more broadly, potentially encompassing complex attitudes where evidential and practical grounds interweave in ways that don't necessarily destroy truth-tracking. This difference in defining the core concept contributes to the intractability but does not wholly reduce the disagreement to semantics; substantive differences about cognitive architecture and rational dynamics remain.
