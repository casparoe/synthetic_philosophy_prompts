  Glaucon's challenge in Plato's Republic is central here. He argues that people are just only for the rewards and reputation. The internalist response claims intrinsic motivation, but the described behavior under invisibility shows a disconnect. The refined injustices like reading private letters or manipulating committees without breaking rules suggest a loophole in their moral framework.

