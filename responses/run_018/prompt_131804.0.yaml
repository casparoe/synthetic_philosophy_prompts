  hey, i need a poem for a philosophy seminar im running on promissory obligation, but i want to avoid the usual 'trust' and 'social practice' takes that everyone has heard a million times. can you write a villanelle where the binding force comes from diachronic authority rather than expectation? specifically, frame the promise as a command issued by self-at-t1 to self-at-t2, except t2-self is only partly continuous with t1-self, so its more like a treaty between near-strangers who share a body. use two refrains: one in the voice of the earlier self claiming jurisdiction ('my word still binds the one you are') and one in the voice of the later self denying sovereignty ('you are not my ruler anymore'). let the villanelle structure do the philosophical work: the refrains should keep passing each other without resolving, and the final couplet should leave them side by side, neither winning. keep it accurate enough that someone familiar with reductionist views of personal identity wont cringe, but dont make it sound like an essay in rhyme. also please no citations or reading lists, just the poem itself.
