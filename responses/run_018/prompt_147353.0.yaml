answer: |-
  Right, you've put your finger on the genuine tension here. A Burkean isn't a museum curator for every old plank, especially one stained with original sin like that zoning fence. Chesterton demands we understand *why* the fence was built *and* why it persists. The racist intent is repugnant, and if its *only* current function – tacit or stated – is exclusion, preserving economic or racial homogeneity under a thin veneer of 'character', then it fails the Burkean test. True tacit knowledge protects organic social structures, fosters stability, and allows for gradual adaptation. This fence? It sounds like it actively *prevents* adaptation, ossifying a community rather than nurturing its lifeblood. The principle commits me to understand the fence thoroughly before acting, not to worship it blindly. If investigation reveals only rotten timber propped up by fear and exclusion, not deeper social wisdom, then careful removal – perhaps replacing it with a *better* framework respecting local scale and existing patterns, not just bulldozing – becomes the *truly* conservative act. Preserving injustice isn't tradition; it's stagnation using tradition's good name.
