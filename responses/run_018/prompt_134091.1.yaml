answer: |-
  Here is a decision-tree taxonomy for navigating normative commitments on labour, rest, and entitlement, built from logical distinctions and concrete cases, suitable for your seminar handout:

  **Taxonomy of Normative Commitments: Labour, Rest, and Entitlement**

  **Purpose:** This taxonomy helps clarify foundational disagreements in debates about working hours, overwork liability (e.g., *karoshi*), and the status of leisure. By answering concrete questions about specific cases and principles, you can locate your core commitments within the broader logical landscape of possible positions. The root scenario involves a jurisdiction debating: (1) legislating a 35-hour working week, (2) classifying death from overwork (*karoshi*) as employer liability, worker autonomy, or structural inevitability, and (3) treating leisure as a distributive good, a recovery mechanism, or a negative liberty.

  **The Decision Tree:**

  1.  **Node 1: Welfare vs. Autonomy as Primary Constraint?**
      *   **Prompt:** *Should working hours be capped (e.g., at 35 hours/week) if evidence shows this significantly reduces death from overwork (karoshi) and improves overall worker well-being, even if it demonstrably reduces total economic output and constrains some workers' choices to work more?*
      *   **Branch A (Yes, welfare/well-being is paramount):** Proceed to Node 2.
      *   **Branch B (No, autonomy/choice is paramount):** Proceed to Node 3.

  2.  **Node 2A (From "Welfare Paramount"): Liability & Leisure's Basis?**
      *   **Prompt:** *When a worker dies from overwork (karoshi) after voluntarily exceeding safe hours documented by the employer, is the employer liable for the death, or did the worker forfeit their claim by choosing to overwork?*
      *   **Branch A1 (Employer retains significant liability):** Proceed to Node 4.
      *   **Branch A2 (Worker forfeits claim via choice):** Proceed to Node 5.

  3.  **Node 3 (From "Autonomy Paramount"): Leisure's Status?**
      *   **Prompt:** *Is leisure time best understood as a scarce resource that should be distributed fairly (like income or healthcare), or merely as the absence of coerced labour (i.e., freedom from being forced to work)?*
      *   **Branch B1 (Leisure is a distributable good):** **LEAF: Distributive Justice Leisure.** Leisure is a primary social good essential for human flourishing. The state has a distributive role to ensure fair access to leisure time (e.g., via maximum hours laws). *Karoshi* stems from structural pressures limiting genuine worker autonomy; employers bear significant liability for creating hazardous work environments, even if choices were made within them. The 35-hour week is justified as promoting fair leisure distribution.
      *   **Branch B2 (Leisure is negative liberty only):** **LEAF: Libertarian Autonomy.** Leisure is simply the absence of forced labour. Workers own their labour and bear the risks of their free choices. *Karoshi* is primarily a tragic consequence of self-regarding risk (worker choice), with employer liability only arising from direct coercion or fraud. Legislating maximum hours (like 35) unjustly restricts voluntary contracts and ignores individual preferences/circumstances. The state's role is largely absent beyond enforcing contracts and preventing force/fraud.

  4.  **Node 4 (From "Welfare Paramount & Employer Liable"): Leisure's Purpose?**
      *   **Prompt:** *Is the primary moral justification for guaranteeing leisure time (e.g., via the 35-hour week) that it enables recovery for productive work, or that it is intrinsically valuable for human development and flourishing, irrespective of work output?*
      *   **Branch A1a (Primarily for Recovery/Productivity):** **LEAF: Social-Democratic Regulatory (Recovery Focused).** The state has a protective role to ensure worker health/safety and sustainable productivity. Mandating limits (e.g., 35 hours) is justified by welfare and prevention of harms like *karoshi*. Employers bear liability for deaths linked to work demands, even with worker "consent," due to power imbalances and the state's duty to protect. Leisure is crucial but primarily framed as necessary recovery.
      *   **Branch A1b (Intrinsically Valuable/Flourishing):** **LEAF: Distributive Justice Leisure.** *(See description under Node 3 Branch B1).* *Note: This path converges logically with Branch B1 from Node 3, differing only in the initial emphasis (Welfare vs. Distribution). While rhetorically distinct origins, they agree on core policy positions (state intervention for fair leisure/well-being, employer liability for karoshi).* **FLAGGED CONVERGENCE:** The "Distributive Justice Leisure" leaf can be reached via two paths (Welfare->Liability->Intrinsic Value OR Autonomy->Leisure as Distributable Good). These paths emphasize different starting points (well-being vs. equality) but arrive at substantively similar policy conclusions regarding state role, *karoshi* liability, and the 35-hour week. The distinction is primarily one of foundational emphasis, not practical outcome.

  5.  **Node 5 (From "Welfare Paramount & Worker Forfeits Claim"): State's Role?**
      *   **Prompt:** *Does the state have a legitimate role in distributing the *means* to access leisure (e.g., ensuring living wages so workers aren't forced into excessive hours), or is its role limited to preventing direct coercion and setting minimal safety standards based on clear, immediate risks?*
      *   **Branch A2a (State has distributive role):** **LEAF: Unnamed Combination: "Recovery-Only Minimalism" (Logically Permitted but Undefended).** Leisure is morally significant *only* as a recovery mechanism for productive/safe work (not intrinsic good or distributable). The state intervenes minimally to prevent demonstrable harm (*karoshi*) via basic safety regulations (potentially *including* maximum hours like 35hrs as a blunt safety tool), but workers forfeit claims if they violate rules. Employers face liability only for *forcing* overwork or violating regulations. Crucially, the state *does* have a role in ensuring wages/conditions allow workers to *afford* taking leisure/recovery time without being forced into overwork. **Diagnosis of Gap:** Likely **neglected** due to **unattractiveness/incoherence.** It combines a narrow, instrumental view of leisure (unappealing to those valuing leisure intrinsically or as a right) with an acceptance of state-enforced limits on hours *and* a positive role in enabling access (too interventionist for strict libertarians, too weak on leisure's value/distribution for social democrats/distributivists). Its focus on "voluntary" forfeiture ignores structural coercion.
      *   **Branch A2b (State role limited to preventing coercion/immediate harm):** **LEAF: Protestant Work Ethic (Strict).** Labour is inherently virtuous; leisure lacks inherent moral entitlement and is permissible only as necessary recuperation for further work or religious observance. *Karoshi* is tragic but results from individual failing (lack of virtue, poor choice) or structural forces beyond employer control; liability is minimal unless direct coercion is proven. Legislating maximum hours (like 35) is misguided, stifling virtue and productivity. The state's role is minimal (preventing force/fraud). Workers voluntarily exceeding limits demonstrate commendable dedication but forfeit claims against employers.

  **Key to Leaves:**

  1.  **Strict Protestant-Work-Ethic:** Denies leisure's moral entitlement; treats overwork as virtuous; minimal state role; minimal employer liability for *karoshi*; opposes hours caps.
  2.  **Social-Democratic Regulatory (Recovery Focused):** Anchored in welfare/protection; justifies limits (e.g., 35hrs) & employer liability for *karoshi* based on health/safety; leisure as recovery mechanism; state protective role.
  3.  **Libertarian Autonomy:** Treats *karoshi* as self-regarding risk; leisure as negative liberty; opposes hours caps and distributive roles; state role minimal (contract/coercion only).
  4.  **Distributive Justice Leisure:** Counts leisure as a primary good for flourishing; justifies limits (e.g., 35hrs) & liability based on fairness/structural justice; state distributive role. *(Converges from two paths - see Flagged Convergence)*.
  5.  **Unnamed: Recovery-Only Minimalism:** Leisure *only* for recovery; state sets minimal safety limits (maybe 35hrs) and ensures access means (wages), but workers forfeit claims if they breach rules; employer liability only for coercion/rule-breaking. (Neglected: Unattractive/incoherent mix).

  **Flagged Distinctions/Convergences:**

  *   **Protestant vs. Libertarian Autonomy:** Both oppose the 35-hour week and extensive *karoshi* liability, seeing overwork as primarily a matter of choice. However, they diverge *fundamentally* on the *value* of labour/leisure: Protestantism glorifies labour as virtue, while Libertarianism is neutral on the value of labour *per se*, focusing solely on choice. This leads to potential rhetorical divergence but practical convergence on non-intervention.
  *   **Social-Democratic (Recovery) vs. Distributive Justice:** Both support the 35-hour week and employer liability for *karoshi*. The key distinction is the *justification for leisure*: recovery/productivity vs. intrinsic worth/distribution. This can lead to different emphases in policy design (e.g., stricter enforcement vs. ensuring quality leisure).
  *   **Distributive Justice Convergence:** As noted, this position is reached via two distinct paths in the tree (Welfare->Liability->Intrinsic Value OR Autonomy->Leisure as Distributable). While the foundational emphasis differs (well-being vs. equality), the resulting core policy commitments are substantially aligned. The taxonomy reflects this logical convergence.

  This taxonomy allows students to navigate from concrete cases to underlying principles, revealing the structure of the debate without requiring prior knowledge of specific theorists or texts, framed in British English.
