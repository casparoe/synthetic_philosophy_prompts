answer: |-
  ## The Changeling Vessel

  **The statue is the clay, nothing more.**  
  What persists when every grain’s replaced?  
  **The shape alone persists when clay is gone.**  

  A sculptor’s hand, a thought made form to stay,  
  Rewrites the earth, each particle reborn.  
  **The statue is the clay, nothing more.**  

  A character composed of ink and day  
  On page one, bright; by page two hundred, worn.  
  **The shape alone persists when clay is gone.**  

  Her gesture held in words that slide away,  
  Like silt through fingers, waiting for the morn.  
  **The statue is the clay, nothing more.**  

  A name survives the ink’s erosion, grey  
  And shifting on the endlessly rewritten page, forlorn.  
  **The shape alone persists when clay is gone.**  

  Is it the self-same hand, the self-same clay,  
  Or just the path the falling dust has drawn?  
  **The statue is the clay, nothing more.**  

  What ghost endures the slow, subtractive fray?  
  The trace? The thought? The echo of the horn?  
  **The shape alone persists when clay is gone.**  

  **The statue is the clay, nothing more.**  
  **The shape alone persists when clay is gone.**  

  ---

  ### Notes on Structure & Philosophy
  -   **Refrains as Mereological Shifts:** Each recurrence of "The statue is the clay, nothing more" and "The shape alone persists when clay is gone" functions like a replaced particle, maintaining the form while altering the specific instance of the argument within the whole.
  -   **Fictional Character Parallel:** Stanzas 3 & 5 explicitly weave in the novelist's parallel concern ("A character composed...", "A name survives the ink’s erosion"), mirroring the statue's paradox without resolving it.
  -   **Four-Dimensional Process:** "The path the falling dust has drawn" (stanza 5) subtly invokes a 4D perspective (the statue as a process through time), contrasting the 3D "clay" of the moment.
  -   **Final Couplet Collision:** The forced convergence of both refrains in the final couplet enacts the core contradiction. Neither negates the other; their co-presence *is* the unresolved tension.
  -   **Rhyme & Turn:** The villanelle's strict form (ABA rhyme, refrains) embodies the persistence of structure through change. Rhymes like "form/born," "stray/stay," "drawn/gone/horn" carry conceptual weight. The "turn" occurs implicitly as the repeated refrains accrue altered context with each stanza's new material.
