  - Minimally extends her view: Uses an established norm (epistemic) rather than introducing a new one or reinterpreting the Moorean paradox for graded attitudes.  

  Thus, if she follows the epistemic-norm-dominant account, she would likely say: "This is defective because asserting \(p\) requires a high degree of confidence, and 0.6 is too low—similar to cases where I deny knowledge. But it's not a Moorean paradox since there's no direct contradiction in belief."

  ### Step 4: Closest Competitor and Discriminating Case
  **Closest Competitor**: Belief-norm-dominant account (predicts defective and possibly Moorean-like).  
  **Conservative Account**: Epistemic-norm-dominant account (predicts defective but not Moorean).  

  **Discriminating Case**:  
  To test between these, we need a case where the predictions diverge. The key difference is whether the defect stems from:  
  - A belief-norm violation (incompatibility with full belief), or  
  - An epistemic-norm violation (insufficient confidence for assertion).  

  **Proposed Utterance**:  
  "Suppose I say: 'The car is in the shop, and I know that it is, but my confidence that it is in the shop is 0.95.'"  

  - **Context**: 0.95 confidence is high but not full (1.0). It is typically sufficient for knowledge (assuming no Gettier issues), but not for categorical "full belief" in a binary sense.  

  **Predictions**:  
  - **Belief-Norm-Dominant Account (Competitor)**:  
    - **Prediction**: Defective.  
    - **Reasoning**: Asserting \(p\) ("the car is in the shop") expresses full belief (1.0 confidence). Reporting 0.95 confidence explicitly contradicts this by admitting it's not full belief. This creates a Moorean-like inconsistency: expressing full belief while denying it. The "I know" clause doesn't resolve this, as knowledge doesn't require full belief in this account—it may even exacerbate the defect by adding a further claim.  
  - **Epistemic-Norm-Dominant Account (Conservative)**:  
    - **Prediction**: Not defective.  
    - **Reasoning**: Asserting \(p\) is epistemically justified because confidence (0.95) meets the standard for knowledge (as stated explicitly). The belief norm is irrelevant or satisfied indirectly (high confidence implies belief). No epistemic or Moorean defect arises; the confidence report is redundant but not inconsistent. This aligns with her treating knowledge as sufficient for assertion.  

  **Why this discriminates best**:  
  - **Leverages her existing distinctions**: The "I know" clause invokes her epistemic norm explicitly, forcing a choice between belief-focused and knowledge-focused defects. If she prioritizes the epistemic norm (conservative account), she should accept this utterance as non-defective. If she prioritizes the belief norm (competitor), she should reject it due to the full-belief contradiction.  
  - **Targets the core disagreement**: The competitor sees full belief as essential to assertion, while the conservative account sees knowledge/certainty as primary. 0.95 confidence sits above typical epistemic thresholds but below full belief, creating a gap where only the belief norm predicts a defect.  
  - **Avoids ambiguity**: Unlike a pure confidence report (e.g., "p but my confidence is 0.95"), the "I know" clause ensures the epistemic norm is satisfied, isolating the belief norm as the source of any defect. Her track record shows she treats "I know" as licensing assertion (e.g., no defect in asserting "p and I know p"), making this a natural extension.  
  - **Practical for assessment**: It mirrors her past cases (e.g., "p but I'm not certain") but inverts the logic, making it easy for her to evaluate based on her existing framework.  

  **Expected Verdicts for Discriminating Case**:  
  - If she judges it **defective**, it supports the **belief-norm-dominant account** (competitor).  
  - If she judges it **not defective**, it supports the **epistemic-norm-dominant account** (conservative).  

  ### Summary
  - **New Utterance Prediction (0.6 confidence)**: Conservative view is defective but not Moorean (due to epistemic norm violation).  
  - **Conservative Account**: Epistemic-norm-dominant.  
  - **Closest Competitor**: Belief-norm-dominant.  
  - **Best Discriminating Case**: "The car is in the shop, and I know that it is, but my confidence that it is in the shop is 0.95."  

