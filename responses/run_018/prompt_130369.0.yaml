  Starting with Round 1: Mara's internal relations/chord analogy. She's drawing from idealist or holistic views where relations are inherent. The strength is that if relations aren't separate entities, no regress starts. But the weakness is that metaphysical containment might still imply a relation, as Leo points out. Historically, Bradley himself would say this doesn't solve it because internal relations lead to monism. So Mara has a point but oversimplifies; Leo's counter is strong here.

