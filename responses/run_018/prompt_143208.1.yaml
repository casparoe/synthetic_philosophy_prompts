answer: |-
  Here’s a reading of *To Kill a Mockingbird* through Adam Smith’s lens of sympathy and the impartial spectator, focusing on the tensions you’ve identified—especially asymmetric sympathy, structural hierarchy, and the limits of imaginative projection:

  ### 1. **Atticus as Impartial Spectator: Ideals and Limitations**  
     - **Smithian Alignment**: Atticus embodies Smith’s ideal spectator when he urges Scout to "climb into another’s skin." His defense of Tom Robinson is grounded in detached moral reasoning: he objectively assesses evidence (e.g., Tom’s crippled arm), rejects Maycomb’s prejudices, and appeals to the jury’s "reasoning faculties" (Smith’s *Theory of Moral Sentiments*).  
     - **Asymmetric Sympathy Gap**: Atticus *intellectually* grasps Tom’s plight but cannot *feel* the visceral terror of being Black in a racist system. Smith assumes mutual sympathy requires shared human experience, but Lee shows hierarchy distorts this:  
       - The trial’s outcome proves the spectator’s failure when social distance is vast. The jury’s "impartiality" is corrupted by white supremacy—they cannot sympathize with Tom because they see him through a lens of racial inferiority.  
       - Atticus’s own limitations surface subtly. His courtroom rhetoric focuses on abstract justice ("all men are created equal") but avoids confronting the *emotional reality* of Tom’s dehumanization (e.g., no outburst when Mr. Gilmer calls Tom "boy"). Smith’s model lacks tools to dissect this power imbalance.  

  ### 2. **Scout and Boo Radley: Sympathy’s Success (with Caveats)**  
     - **Smithian Success**: Scout’s evolution with Boo mirrors Smith’s sympathy-in-action. Initially, she sees Boo as a "malevolent phantom" (projecting community fears). By standing on Boo’s porch, she *literally* adopts his perspective ("Atticus was right… you never really know a man until you stand in his shoes"). This imaginative leap aligns with Smith: her moral growth stems from spectating Boo’s isolation and kindness.  
     - **Lee’s Critique of Smith**:  
       - **Vulnerability as Catalyst**: Scout’s sympathy isn’t just intellectual—it’s forged through shared peril (Boo saving her life) and physical proximity (his silent presence in her home). Lee suggests *embodied vulnerability*, not just projection, enables true understanding. Smith’s spectator is cerebral; Scout’s is visceral.  
       - **Class, Not Race**: This "success" occurs across class, not race. The Finch-Boo dynamic lacks the insurmountable hierarchy of race in Maycomb. Lee implies Smithian sympathy *can* work when power differentials are mutable (Boo is marginalized but still white).  

  ### 3. **The Novel’s Exposé: Where Smith’s Framework Breaks**  
     - **Structural Blindness**: Smith’s spectator assumes a neutral observer, but Lee shows identity dictates *who can be sympathized with*. The Ewells’ poverty is pitied; Tom’s Blackness is criminalized. The novel reveals sympathy’s collapse under white supremacy—the town cannot "spectate" Tom impartially because racism precludes seeing him as fully human.  
     - **Asymmetry in Action**:  
       - Tom pities Mayella ("she seemed to try more’n the rest of ’em"), but this reciprocity is fatal. His admission of sympathy for a white woman violates racial codes, dooming him. Smith’s mutuality is impossible here.  
       - Atticus sympathizes *for* Tom but not *with* him. He navigates the trial as a white savior, not an equal. Lee exposes how privilege allows Atticus to *perform* sympathy without enduring its risks.  

  ### 4. **Lee’s Philosophical Contribution: Vulnerability > Projection**  
     Lee goes beyond Smith by suggesting sympathy requires:  
     - **Shared Risk**: Understanding Boo demands Scout’s near-death.  
     - **Silent Presence**: Boo’s empathy is shown through acts (mending pants, saving lives), not dialogue. Moral sentiment here is wordless and reciprocal, challenging Smith’s emphasis on imaginative *construction*.  
     - **Unresolved Racial Gap**: The novel *does not resolve* racial asymmetry. Tom dies; the system remains unchanged. Lee implies that without dismantling hierarchy, Smithian sympathy is impotent across racial lines.  

  ### Synthesis: Where Smith and Lee Diverge  
  | **Element**               | **Smith’s Framework**                          | **Lee’s Intervention**                                |  
  |---------------------------|-----------------------------------------------|-------------------------------------------------------|  
  | **Sympathy Trigger**      | Imaginative projection                        | Vulnerability + embodied experience                   |  
  | **Power Imbalance**       | Assumes spectator neutrality                  | Exposes hierarchy’s distortion of sympathy            |  
  | **Reciprocity**           | Mutual fellow-feeling possible                | Shows asymmetry (Tom’s sympathy is lethal)            |  
  | **Moral Growth**          | Cultivated through reason                     | Forged through crisis (trial, attack)                 |  

  **Conclusion for Discussion**: *Mockingbird* both channels and critiques Smith. Atticus exemplifies Smith’s spectator *in theory* but is constrained by race. Scout’s arc with Boo fulfills Smith’s ideal—but only because class barriers are permeable. The trial scenes expose Smith’s blind spot: structural inequality makes impartial spectating impossible across racial hierarchies. Lee’s deeper insight is that *true* sympathy demands not just imagination, but shared vulnerability—a risk Smith’s model never contemplates. Use this tension to ask your group: Can sympathy transcend power without justice?
