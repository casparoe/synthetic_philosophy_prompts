  Group B's Rule-Setters might set:
    CC: 3
    CD: 0
    DC: 5
    DD: 1

  Group A's Rule-Setters might set:
    CC: 2
    CD: -1
    DC: 4
    DD: 0

  Then if Group A's Player defects and Group B's Player cooperates, then:

  - Group A's Player gets 5 (from Group B's matrix, for DC: because Group A defected and Group B cooperated, so DC -> 5)
  - Group B's Player gets -1 (from Group A's matrix, for DC: but wait, in Group A's matrix, DC means Group A defected and Group B cooperated, and for Group B's Player in that matrix, it's -1)

  But note: in Group B's matrix, the combination (Group A defects, Group B cooperates) is DC, and they set that to 5 for Group B's Player? That doesn't make sense because in that outcome, Group B's Player is the one who cooperated, and they would get the sucker's payoff.

  I think I have a confusion in the matrix setup.

  Let me redefine the matrix from the perspective of the Player for whom it is intended.

  For the matrix created by Group B's Rule-Setters (which is for Group B's Player), the matrix should be:

                                    Group A's Player's choice
                                     Cooperate    Defect
  Group B's Player's choice
    Cooperate                        (R)           (S)
    Defect                           (T)           (P)

  Where the letters are the payoffs for Group B's Player.

  Similarly, the matrix created by Group A's Rule-Setters (for Group A's Player) is:

                                    Group B's Player's choice
                                     Cooperate    Defect
  Group A's Player's choice
    Cooperate                        (R)           (S)
    Defect                           (T)           (P)

  And the letters are the payoffs for Group A's Player.

  So when both players have chosen, we use:

  - For Group A's Player: look at the matrix set by Group B's Rule-Setters. Find the row for Group A's Player's choice and the column for Group B's Player's choice? But the matrix I defined above for Group B's Player has the rows for Group B's Player and columns for Group A's Player. So for Group A's Player, we would need a matrix that has rows for Group A's Player and columns for Group B's Player.

  So let's be consistent.

  We'll define the matrix for a given Player as follows:

  The matrix is always defined with:
  - Rows: the choice of the Player for whom the matrix is intended.
  - Columns: the choice of the other Player.

  So for Group B's Rule-Setters, they are setting a matrix for Group B's Player. The matrix will have:

                                          Other Player's choice (Group A's Player)
                                          Cooperate         Defect
  Group B's Player's choice Cooperate     R                 S
                             Defect       T                 P

  And R, S, T, P are chosen by Group B's Rule-Setters.

  Similarly, for Group A's Rule-Setters, they are setting a matrix for Group A's Player:

                                          Other Player's choice (Group B's Player)
                                          Cooperate         Defect
  Group A's Player's choice Cooperate     R                 S
                             Defect       T                 P

  And they choose R, S, T, P.

  Then, when both Players have made their choices:

  - For Group B's Player: look at the matrix set by Group B's Rule-Setters. Find the row corresponding to Group B's Player's choice and the column corresponding to Group A's Player's choice -> payoff.
  - For Group A's Player: look at the matrix set by Group A's Rule-Setters. Find the row corresponding to Group A's Player's choice and the column corresponding to Group B's Player's choice -> payoff.

  But wait, the Rule-Setters for Group A are in Group A, and they are setting the matrix for their own Player? That's not what we want.

  We want:

  - The kernel in Group A (Rule-Setters) should set the rules for the application in Group B (Player).

  So we swap:

  - Group A's Rule-Setters (kernel) set the matrix for Group B's Player (application).
  - Group B's Rule-Setters (kernel) set the matrix for Group A's Player (application).

  So for Group B's Player, the matrix is set by Group A's Rule-Setters.

  Therefore, the matrix for Group B's Player is created by Group A's Rule-Setters. They define:

                                          Group A's Player's choice
                                          Cooperate         Defect
  Group B's Player's choice Cooperate     R1                S1
                             Defect       T1                P1

  Similarly, the matrix for Group A's Player is created by Group B's Rule-Setters:

                                          Group B's Player's choice
                                          Cooperate         Defect
  Group A's Player's choice Cooperate     R2                S2
                             Defect       T2                P2

  Then, when the two Players make their choices:

  - For Group A's Player: use the matrix created by Group B's Rule-Setters. In that matrix, the rows are for Group A's Player and the columns for Group B's Player. So if Group A's Player chose Defect and Group B's Player chose Cooperate, then we look at the row for Defect and column for Cooperate -> T2.

  - For Group B's Player: use the matrix created by Group A's Rule-Setters. In that matrix, the rows are for Group B's Player and the columns for Group A's Player. So if Group A's Player chose Defect and Group B's Player chose Cooperate, then we look at the row for Cooperate (because Group B's Player chose cooperate) and column for Defect -> S1.

  Example:

  Group A's Rule-Setters set for Group B's Player:

            Group A's Player's choice
            Cooperate  Defect
  Group B's Player
    Cooperate   3         0
    Defect      5         1

  Group B's Rule-Setters set for Group A's Player:

            Group B's Player's choice
            Cooperate  Defect
  Group A's Player
    Cooperate   2        -1
    Defect      4         0

  Now, if Group A's Player defects and Group B's Player cooperates:

  - For Group A's Player: in the matrix set by Group B's Rule-Setters, for Group A's Player: row Defect and column Cooperate -> 4.
  - For Group B's Player: in the matrix set by Group A's Rule-Setters, for Group B's Player: row Cooperate and column Defect -> 0.

  This works.

  The groups will see that the kernel of one group (the Rule-Setters) is defining the rules for the application of the other group, and vice versa.

  In the activity, when they see the results, they will realize that their own payoff is determined by the other group's kernel.

  This captures the mutual embedding.

  Debrief:

  - Ask the groups: At first, did you feel that as Rule-Setters you were in control? Then what happened?
  - Point out that the Rule-Setters (kernel) were setting the rules for the other group's application, but their own application was being ruled by the other group's kernel.
  - This creates a tangled hierarchy: there is no base kernel; the kernels are embedded in each other.
  - Relate to Escher's Drawing Hands: each hand is drawing the other, so there is no first hand.
  - In software: this is like two systems where each is implemented in the other, without a base in machine code.

  What we cannot capture:

  - In this setup, we have two levels and they are mutually dependent, but in a real tangled hierarchy, you might have an infinite regress. Here, we have a fixed-point: two levels that refer to each other. We can mention that in the discussion.

  Predicted malfunction:

  - Participants might not understand how the matrix works. Solution: Do a dry run with example numbers.

  - The Rule-Setters might set matrices that are not prisoner's dilemma (e.g., without T>R>P>S). That's okay, but the point is not prisoner's dilemma per se, but the mutual rule-setting.

  - The Players might not understand that they are part of an application layer controlled by the other group's kernel. The debrief will clarify.

  Overall, this activity should give them a direct experience of a tangled hierarchy.
