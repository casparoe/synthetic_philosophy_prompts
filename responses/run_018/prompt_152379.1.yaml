answer: |-
  Here’s a structured 50-minute teaching plan focusing on the **phenomenal vs. access unity distinction** using split-brain cases as a conceptual probe, avoiding reductive "two minds" conclusions:

  ---

  ### **Teaching Sequence (50 min)**
  **Goal:** *Show that split-brain cases challenge the default conflation of phenomenal and access unity—not prove "two consciousnesses."*

  #### **Part 1: Foundational Concepts (15 min)**
  - **(3 min) Hook:** *"Descartes argued the mind is indivisible; Locke treated consciousness as self-unifying. What if neuroscience reveals cases where this unity fractures—but not in the way pop-science claims?"*  
  - **(7 min) Define Key Terms (Crucial Pre-Data Dependency):**  
    - **Phenomenal Unity (PU):** "All conscious experiences *feel like* they belong to a single 'I'—a unified subjective perspective."  
    - **Access Unity (AU):** "All information is available to a *single system* for reasoning, speech, and voluntary action."  
    - **Stress:** *In everyday life, PU and AU coincide. Split-brain cases pry them apart.*  
  - **(5 min) Cartesian Theater Warning:** Preemptively dismantle the "central stage" model:  
    > *"If you imagine consciousness as a theater, you’re already conflating PU and AU. The stage (where things are 'shown') implies access. But phenomenal unity could exist without a central stage—like multiple TV screens playing the same show."*  

  ---

  #### **Part 2: Core Case Study – The "Key-Ring Banana" Experiment (20 min)**  
  **Scenario:** *Patient sees "KEY RING" flashed to left visual field (LVF → right hemisphere), and "BANANA" to right visual field (RVF → left hemisphere).*  
  - **(5 min) Present Behavior:**  
    - *Left hand* (RH-controlled) selects a **key** from a grab-bag of objects.  
    - *Right hand* (LH-controlled) selects a **banana**.  
    - When asked *why*: The *speaking* LH says, "I saw ‘BANANA,’ so I picked the banana. The key? No idea—maybe my hand just felt like it!"  
  - **(10 min) Analysis – What This Shows (and Doesn’t):**  
    | **Property Present**               | **Property Absent**                |  
    |-----------------------------------|-----------------------------------|  
    | ✅ Incompatible interpretations (RH: key, LH: banana) | ❌ No behavioral conflict (hands don’t fight) |  
    | ✅ AU breakdown (RH knowledge unavailable to LH speech) | ❌ No "hidden twin" (RH can’t speak; no evidence it *wants* to) |  
    | ✅ Identical stimulus (compound word processed separately) | ❌ Central narrator (LH confabulates about RH’s actions) |  
  - **(5 min) Intercept Misconceptions:**  
    - **Misconception 1:** *"The RH is a separate person!"*  
      → **Intercept:** "The RH cannot speak, report desires, or initiate complex actions alone. We’re seeing *disunified access*, not two agents."  
    - **Misconception 2:** *"Consciousness must be in one hemisphere!"*  
      → **Intercept:** "Both hemispheres process info independently. PU *could* persist in both, neither, or one—but AU’s failure doesn’t decide this."  

  ---

  #### **Part 3: Conceptual Stress-Test (10 min)**  
  - **(5 min) Reframe the Question:**  
    > *"Split brains don’t prove ‘two minds.’ They ask: If AU breaks down, can PU still hold? Or is our intuition of unity just AU in disguise?"*  
  - **(5 min) Defend the Possibility of PU without AU:**  
    - *Analogy:* "Imagine two people in soundproof rooms, both seeing the same live sports game. No access to each other (AU failure), but identical experiences (PU preserved)."  
    - *Split-brain application:* "Could the RH *feel* pain when the LH doesn’t know it? We don’t know—but AU’s failure doesn’t forbid PU."  

  ---

  #### **Part 4: Closing Check & Delimited Ignorance (5 min)**  
  - **(3 min) Check for Understanding:**  
    > *"Could a split-brain patient have phenomenal unity without access unity? If yes, what would that imply about Descartes/Locke?"*  
    - **Target Insight:** A "yes" affirms PU can survive AU failure; a "no" reduces consciousness to cognitive access.  
  - **(2 min) Explicitly Bracket Non-Essentials:**  
    > *"We’ve ignored surgical details (e.g., callosal fiber types) and non-unity theories (e.g., global workspace). Why? To isolate the PU/AU distinction—which survives even if these models change."*  

  ---

  ### **Why This Works**  
  - **The Scenario** ("Key-Ring Banana") avoids "two selves" by:  
    - Using *identical stimuli* (compound word), preventing "different inputs → different minds."  
    - Showing *non-antagonistic responses* (no hand-fighting), undermining "two agents."  
    - Having the LH *confabulate*, exposing AU failure without implying RH subjectivity.  
  - **Misconceptions Intercepted Sequentially:**  
    Minute 20 (post-experiment): Blocks "two subjects" leap.  
    Minute 25: Blocks "consciousness = speech" reduction.  
  - **Closing Check** targets the *distinction’s application*, not memorization.  

  **Final Note:** Emphasize that split-brain cases *problematize* unity but don’t resolve it—leaving students to re-evaluate philosophy of mind through empirical constraints.
