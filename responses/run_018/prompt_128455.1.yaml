answer: |-
  ## Hinge Commitments

  These certainties stand fast without a ground,  
  No proof can elevate what must be found  
  Already fixed; on them, we build and stand,  
  Like knowing simply that I have a hand.  
  This earth existed long before my breath,  
  A monument beyond the reach of death  
  Or doubt's decay; no test could make it cease,  
  My bedrock giving other claims their lease.

  *Yet here the pivot turns:* not facts held tight,  
  But like the riverbed that shifts from sight,  
  Or rules for grammar, scaffolding unseen,  
  That hold the language-game upon the scene.  
  To doubt a hinge? A move that cannot start,  
  Unless that hinge first frames the doubter's art.  
  The game requires the frame that gives its name.

  ---

  **Annotations for Wittgensteinian Accuracy:**

  1.  **Octave Paradox (ABAB-CDCD):** Presents hinges ("stand," "earth existed," "I have a hand") as foundational bedrock ("ground," "found," "stand," "bedrock," "lease") enabling knowledge/doubt, yet lacking evidence themselves ("without a ground," "No proof," "beyond...doubt's decay," "no test").
  2.  **Volta (Line 9: "Yet here the pivot turns:"):** Marks the conceptual shift. "Not facts held tight" directly challenges the empirical reading.
  3.  **Sestet Metaphors (EFEF-GG):** Employs Wittgenstein's key images:
      *   **Riverbed (L10):** The slowly changing, non-empirical background.
      *   **Rules/Grammar/Scaffolding (L11):** Hinges as constitutive rules enabling the "language-game" (L12), not propositions *within* it.
      *   **Doubting a Hinge (L13-14):** Shows doubt depends on hinges ("frames the doubter's art") – doubting *everything* isn't coherent doubt.
  4.  **Couplet & Slant Rhyme (GG):** "game" / "name" is the deliberate slant rhyme. It emphasizes the core point: the "frame" (hinge) isn't a separate *descriptive* entity ("name") *outside* the "game" (practice) it makes possible. The frame is only intelligible *as* the condition for the game.
  5.  **Form Enacting Content:** The foundationalist ABAB rhymes in the octave give way to the EFEF and slant GG rhymes, subtly enacting the shift away from the foundationalist picture towards the grammatical/constitutive understanding. The sonnet form itself provides the "scaffolding" for the argument.
