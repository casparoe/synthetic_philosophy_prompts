  Stalinesque doesn't have this issue because the interpolation happens before any conscious awareness. But both might be functionally identical; we can't distinguish them empirically. The user might be stuck thinking there's a real difference, but Dennett's point is that it's a false dichotomy. The brain doesn't have a fixed moment of consciousness, so the question of which model is correct is moot.

