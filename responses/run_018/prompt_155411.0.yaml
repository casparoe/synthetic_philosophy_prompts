prompt: |-
  hey, i sit on the clinical ethics board at a neuroprosthetics center where we do gradual brain-tissue replacement (synthetic analogs swapped in region by region over months). we're seeing more cases where a patient who signed an advance directive pre-op now wants to change it halfway through, or the family claims the "current version" isn't bound by the old contract. i need a reusable decision procedre my team can actually run -- mostly nurses and one lawyer, no philosophers -- in about 20 minutes per case.

  ground it in the principle that personal identity through this kind of replacement survives only if there's a continuous "first-person ownership loop" linking pre-op architecture to the current one, not just memory retention or behavioral match. turn that into a step-by-step checklist or flowchart in words: ordered questions, what counts as a sufficient answer, the hard stop where we say "no, not the same person for legal/authorty purposes," and clearly flag which steps are judgment calls we can't eliminate. apply it to three scenarios:

  1. 30% hippocampal replacement; patient narrates life in first person with emotional continuity.
  2. 85% cortical replacement; behavioral tests perfect, but patient reports feeling like they're observing the old self from behind glass with no ownership loop.
  3. replacement paused at 50% for 8 months, synthetic parts in "sleep mode," then resumed.

  include one case where the answer comes out in a way the board will hate -- like perfect behavior but no authorization. also be explicit about what this procedre can't settle and where it just hands the decision to a person.

  keep the whole thing under 550 words. don't give bibliographies or citations -- we can't search and don't have time. there's a typo or two in here but leave them, i want it messy.
reasoning: |-
  Okay, let me tackle this neuroprosthetics ethics question. The user needs a practical 20-minute decision procedure grounded in personal identity continuity during brain-tissue replacement, with three specific scenarios to test it.

  First, I'm focusing on their core requirement: a "first-person ownership loop" as the key criterion rather than memory or behavior. That means the procedure must prioritize subjective experience of self-continuity.

  For the structure, I'm considering a flowchart-style checklist with clear yes/no branches. Since the team has limited time and mostly non-philosophers, each step needs to be concrete: question → required evidence → threshold for sufficiency → hard stops. The three judgment calls should be explicitly marked as such.

  For the scenarios:
  - Case 1 (30% hippocampal) seems straightforward with emotional continuity
  - Case 2 (85% cortical) will demonstrate the hard stop despite perfect behavior
  - Case 3 (50% paused) requires handling the discontinuity during sleep mode

  I'm making sure to include one outcome the board will dislike (Case 2's rejection) to meet their request. The limitations section will clarify where human judgment still applies, like interpreting patient statements.

  Word count is tight at 550, so I'm using bullet points and avoiding fluff. Keeping the user's original typos as instructed while maintaining clarity elsewhere.
answer: |-
  Here's your 20-minute "Ownership Loop" procedure. Hard stop if Step 3 fails.

  **Procedure: Ownership Loop Continuity Check**
  1.  **Question:** "Does the *current* patient *express* a first-person sense of ownership (not just memory) over their *pre-op* experiences, choices, and values?"  
      *   **Sufficient Answer:** Direct, unprompted statements like "I still feel like *me*, that was *my* decision," showing emotional/volitional connection. Review recent interviews/notes.  
      *   **Judgment Call? YES.** (Interpreting sincerity & depth of ownership claims vs. mere recall).  
      *   **→ If NO, proceed to Step 2. If YES, proceed to Step 4.**

  2.  **Question:** "Is there clear evidence the patient *ever* expressed a first-person sense of ownership *during* the replacement process?" (Check records from past appointments/assessments).  
      *   **Sufficient Answer:** Documented statements during treatment explicitly linking past self to present self ("This feels like a continuation of *my* life," "I stand by *my* earlier choice").  
      *   **Judgment Call? YES.** (Assessing relevance and strength of past statements to *current* continuity).  
      *   **→ If NO, HARD STOP: Not the same person for legal/AD authority. If YES, proceed to Step 3.**

  3.  **Question:** "Does the current patient *explicitly endorse and identify with* those past ownership statements *now*?"  
      *   **Sufficient Answer:** "Yes, that *was* me saying/feeling that, and it *still* feels like me." Must be current affirmation, not just historical record.  
      *   **Judgment Call? NO.** Requires direct, verifiable current affirmation.  
      *   **→ If YES, proceed to Step 4. If NO or UNCLEAR, HARD STOP: Not the same person for legal/AD authority.**

  4.  **Question:** "Is the request consistent with the *values* expressed in the original AD, even if specifics change?" (e.g., AD for comfort care only, now requesting specific experimental pain management).  
      *   **Sufficient Answer:** Lawyer assesses if the *type* of change aligns with the foundational values/principles in the original AD.  
      *   **Judgment Call? YES.** (Values interpretation).  
      *   **→ If YES, allow AD modification. If NO, uphold original AD. (Family claims re: "current version" irrelevant if Steps 1-3 pass).**

  **Applied to Scenarios:**

  1.  **30% Hippocampal:**  
      *   Step 1: YES (Narrates life in 1st person w/ emotion). → Proceed to Step 4. AD modification *possible* if value-consistent.
  2.  **85% Cortical (Board will hate this):**  
      *   Step 1: NO ("observing from behind glass, no ownership"). → Step 2: Assume YES (past records likely show continuity). → Step 3: **NO** (Current patient rejects past ownership). → **HARD STOP. Not the same person.** Original AD authority invalid; current patient/family cannot modify it. *Perfect behavior irrelevant.*
  3.  **50% Paused 8 Months:**  
      *   Step 1: **Crucial Question Post-Reactivation.** If they say "I feel like myself again, this is still my journey," → YES, proceed to Step 4. If they say "I feel like a new person starting after the pause," or disown pre-pause self → Step 2: Check records *during active replacement before pause* for ownership. If found → Step 3: Ask *now* if they identify with *those specific pre-pause* ownership statements. **Uncertainty likely high here - Judgment Call on Step 3 interpretation.** If Step 3 unclear or NO → HARD STOP.

  **What This CAN'T Settle (Hands Decision to Person):**
  *   **Interpreting Patient Statements (Steps 1 & 3):** Is "I feel like me" deep ownership or superficial mimicry? Nurses/Junior Doc makes the initial call based on interaction.
  *   **Values Consistency (Step 4):** Does changing from "DNR" to "Full Code *only if* experimental neurostim works" align with "avoid prolonged suffering"? Lawyer leads, but team discusses.
  *   **Who Decides After Hard Stop?** The procedure identifies loss of original AD authority. It DOESN'T say who *now* has authority (current patient? guardian? court?). Requires immediate legal consultation.
