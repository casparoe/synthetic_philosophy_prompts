  I should build the conceptual architecture step by step. Start with definitions, then the modes of violation. Informational privacy is violated when data is accessed without consent. Phenomenological privacy is violated when lived experience is made legible through institutional schemas. The key difference is that one deals with data linked to identity, the other with the interpretation of experience, regardless of identification.

  Next, sustainability without property rights. Property rights focus on ownership of data. But here, the data isn't owned because it's not personal. Phenomenological privacy is about the effect of interpretation on autonomy and self-development. Normative force comes from the need for a "self-constituting opacity"—individuals need space where their inner states aren't subject to external judgment to freely develop their identity.

  The user might be concerned about ethical implications beyond legal compliance. Even if no personal data is stored, the system's ability to interpret affective states could lead to subtle social control. For example, predicting behavior based on thermal patterns might influence how resources are allocated or interventions are made, affecting residents' freedom without their awareness.

  I should also address why existing privacy frameworks might fall short. Traditional models like FIPs (Fair Information Practices) focus on data control and consent, which don't apply here. Phenomenological privacy requires new paradigms, possibly rooted in human dignity and autonomy, rather than data ownership.

