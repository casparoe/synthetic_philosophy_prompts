  *scratches head* Let me think... The core issue seems to be premise 6. Pragmatic encroachment typically ties stakes to the practical costs of being wrong about the specific proposition in question. But for the correct party, the stakes of correcting someone aren't necessarily the same as the stakes of their own belief about p. 

