answer: |-
  ### Final Examination: Social Choice Theory & Political Philosophy  
  **Time Allowed:** 90 minutes  
  **Word Limit:** 1,200 words  

  ---

  ### Essay Prompt  
  **Scenario:** A municipal zoning board must select one land-use regime for a two-household neighborhood (Household A and Household B). The options are:  
  - **R:** Strict Residential Preservation (prohibits businesses, mandates historic aesthetics)  
  - **M:** Mixed-Use Development (allows home businesses with design review)  
  - **U:** Unrestricted Market Allocation (no zoning constraints).  

  Each household holds *lexicographic preferences* over the combined outcomes of **land-use regime** and their *personal domain*. The liberal rights are:  
  - Household A controls their front door color: **Red** (𝑟) or **Blue** (𝑏).  
  - Household B controls whether they operate a home workshop: **Present** (𝑤) or **Absent** (𝑛).  

  **Preferences:**  
  - **Household A:**  
    - R with 𝑏 ≻ U with 𝑏 ≻ M with 𝑏 ≻ R with 𝑟 ≻ M with 𝑟 ≻ U with 𝑟  
    *(A prioritizes blue door; prefers R > U > M if door is blue, but R > M > U if door is red)*  
  - **Household B:**  
    - U with 𝑛 ≻ M with 𝑛 ≻ M with 𝑤 ≻ R with 𝑛 ≻ R with 𝑤 ≻ U with 𝑤  
    *(B prioritizes no workshop; prefers U > M > R if no workshop, but M > R > U if workshop present)*  

  **Board Rules:**  
  1. **Minimal Liberalism (ML):**  
     - A’s choice of door color determines social preference between any two outcomes differing *only* in A’s door color.  
     - B’s choice of workshop determines social preference between any two outcomes differing *only* in B’s workshop status.  
  2. **Pareto Principle (P):** If both households prefer outcome X over Y, society must prefer X over Y.  

  **Task:**  
  1. **Formally derive** whether the board can select a feasible land-use regime under rules (ML) and (P). Show step-by-step social preferences between all pairs of outcomes.  
  2. **Interpret the contradiction:** Explain why this is not merely a logical paradox but reveals a structural tension between individual liberty and collective decision-making in urban governance. Focus on "procedural neutrality" (can institutions separate personal domains from public choices?).  
  3. **Critically evaluate one resolution:** Choose *either*:  
     - **Restricting ML to non-interacting domains** (e.g., B’s workshop right excludes land-use effects), *or*  
     - **Replacing P with a "qualified unanimity rule"** (unanimity required only when no liberal right is exercised).  
     Show *exactly* how your chosen resolution alters the board’s available choices in this scenario.  

  ---

  ### Model Answer (Approx. 800 words)  
  #### I. Formal Derivation of Contradiction  
  We define outcomes as tuples (Land-use, A’s door, B’s workshop). Applying **Minimal Liberalism (ML)**:  
  - **A’s right over door color**:  
    - For fixed land-use/workshop, A’s choice ranks blue ≻ red.  
    *Social preferences from ML(A):*  
    (R,𝑏,𝑤) ≻ (R,𝑟,𝑤), (R,𝑏,𝑛) ≻ (R,𝑟,𝑛)  
    (M,𝑏,𝑤) ≻ (M,𝑟,𝑤), (M,𝑏,𝑛) ≻ (M,𝑟,𝑛)  
    (U,𝑏,𝑤) ≻ (U,𝑟,𝑤), (U,𝑏,𝑛) ≻ (U,𝑟,𝑛)  
  - **B’s right over workshop**:  
    - For fixed land-use/door, B’s choice ranks absent ≻ present.  
    *Social preferences from ML(B):*  
    (R,𝑏,𝑛) ≻ (R,𝑏,𝑤), (R,𝑟,𝑛) ≻ (R,𝑟,𝑤)  
    (M,𝑏,𝑛) ≻ (M,𝑏,𝑤), (M,𝑟,𝑛) ≻ (M,𝑟,𝑤)  
    (U,𝑏,𝑛) ≻ (U,𝑏,𝑤), (U,𝑟,𝑛) ≻ (U,𝑟,𝑤)  

  Now apply the **Pareto Principle (P)** to unanimous preferences:  
  - Both prefer (M,𝑏,𝑛) over (U,𝑟,𝑤):  
    - A: M with 𝑏 ≻ U with 𝑟 (lexicographic: 𝑏 > all 𝑟)  
    - B: M with 𝑛 ≻ U with 𝑤 (lexicographic: 𝑛 > all 𝑤)  
    ∴ Society prefers (M,𝑏,𝑛) ≻ (U,𝑟,𝑤) [by P]  
  - Both prefer (U,𝑏,𝑛) over (R,𝑟,𝑤):  
    - A: U with 𝑏 ≻ R with 𝑟  
    - B: U with 𝑛 ≻ R with 𝑤  
    ∴ (U,𝑏,𝑛) ≻ (R,𝑟,𝑤) [by P]  

  **Constructing the Cycle:**  
  1. From ML(A): (R,𝑏,𝑛) ≻ (R,𝑟,𝑛)  
  2. From ML(B): (R,𝑟,𝑛) ≻ (R,𝑟,𝑤)  
  3. From P: (U,𝑏,𝑛) ≻ (R,𝑟,𝑤)  
  4. From ML(B): (U,𝑏,𝑛) ≻ (U,𝑏,𝑤)  
  5. From ML(A): (U,𝑏,𝑤) ≻ (U,𝑟,𝑤)  
  6. From P: (M,𝑏,𝑛) ≻ (U,𝑟,𝑤)  
  7. From ML(A): (M,𝑏,𝑛) ≻ (M,𝑟,𝑛)  
  8. From ML(B): (M,𝑟,𝑛) ≻ (M,𝑟,𝑤)  
  9. *Crucially*, both prefer (M,𝑟,𝑤) over (R,𝑏,𝑛)? **No**—A prefers (R,𝑏,𝑛) ≻ (M,𝑟,𝑤) (lexicographic: 𝑏 > 𝑟), but B prefers (M,𝑟,𝑤) ≻ (R,𝑏,𝑛) (since M > R if workshop present). Thus, no Pareto link here.  

  **Cycle via (R,𝑏,𝑛):**  
  - From (1) and (2): (R,𝑏,𝑛) ≻ (R,𝑟,𝑛) ≻ (R,𝑟,𝑤)  
  - From (3): (U,𝑏,𝑛) ≻ (R,𝑟,𝑤)  
  - But both prefer (R,𝑏,𝑛) over (U,𝑏,𝑛)? **No**—A prefers (R,𝑏,𝑛) ≻ (U,𝑏,𝑛), but B prefers (U,𝑏,𝑛) ≻ (R,𝑏,𝑛) (B: U with 𝑛 ≻ R with 𝑛). Thus, no Pareto link.  

  **Impossibility:** ML and P generate *incompatible obligations*:  
  - ML requires (R,𝑏,𝑛) ≻ (R,𝑟,𝑛) and (U,𝑏,𝑛) ≻ (U,𝑟,𝑛)  
  - P requires (M,𝑏,𝑛) ≻ (U,𝑟,𝑤) and (U,𝑏,𝑛) ≻ (R,𝑟,𝑤)  
  But ML(B) requires (U,𝑟,𝑛) ≻ (U,𝑟,𝑤), and ML(A) requires (R,𝑏,𝑛) ≻ (R,𝑟,𝑛). No land-use regime can be chosen without violating ML or P. **Feasible choice set is empty.**  

  #### II. Structural Tension Beyond Logic  
  This is not a technical artifact but an institutional design failure. Sen’s paradox exposes how *preference interdependencies* convert private liberties into public veto points. Here, door color (seemingly private) affects A’s land-use rankings, while B’s workshop (seemingly personal) shapes B’s zoning preferences. The board’s "neutral" procedural rules—treating rights as domain-restricted—collapse because preferences bridge domains. Urban governance cannot compartmentalize "personal" and "collective" spheres when citizens’ self-conceptions embed private choices in public contexts (e.g., a blue door symbolizes resistance to preservationist zoning). Procedural neutrality assumes separable preferences; when preferences are lexicographic, liberalism’s boundaries dissolve.  

  #### III. Evaluating a Resolution: Restricted Liberal Domains  
  **Proposal:** Modify ML to require personal domains be *non-interacting*—i.e., rights cannot alter others’ welfare. Here, **redefine B’s right** to exclude land-use externalities: B controls workshop *only if it doesn’t change land-use preferences*. Since B’s workshop shifts their land-use rankings (M ≻ R if 𝑤 present), it violates non-interaction. Thus, B forfeits workshop rights under this resolution.  

  **Revised Choice Set:**  
  - B has no right; only A retains door-color rights.  
  - ML now applies *only* to A: Social preferences for door color hold, but workshop status is irrelevant.  
  - **Land-use choices under P:**  
    - Compare R vs. M: A prefers R (if 𝑏) or R (if 𝑟); B prefers M (if 𝑤) or M (if 𝑛). **No unanimity.**  
    - Compare M vs. U: Both prefer M (A: M with 𝑏/𝑟 ≻ U with 𝑟; B: M with 𝑛 ≻ U with 𝑤/𝑛).  
    - Compare R vs. U: Both prefer U? No—A prefers R if 𝑏, U if 𝑟; B prefers U. **No unanimity.**  
    ∴ Pareto only requires M ≻ U.  
  - **Feasible set:** {R, M} (no Pareto comparison between them). Board can choose R or M.  

  **Critique:** This "resolves" the paradox by sacrificing B’s liberty—but only because B’s preferences are deemed "non-private." Urban institutions thus face a meta-conflict: defining "personal" domains requires normative judgments about which preferences count as externalities.  

  ---

  ### Marking Scheme (Total: 25 points)**  
  **A (21–25 pts):**  
  - Correctly maps door color to A, workshop to B.  
  - Derives empty choice set (or equivalent cycle) via ML + P.  
  - Identifies the source of conflict: *lexicographic preferences entangling rights with collective choice*.  
  - Articulates why this undermines procedural neutrality in governance.  
  - Evaluates a resolution by *concretely altering the choice set* (e.g., forfeiting B’s right → {R, M}).  

  **B (16–20 pts):**  
  - Correctly derives the contradiction (cycle/empty set).  
  - Adequately explains Sen’s paradox in the abstract.  
  - *But* treats it as a technical problem without institutional interpretation (e.g., no discussion of urban governance neutrality).  
  - Superficially names a resolution without showing its impact on choices.  

  **Failing (≤15 pts):**  
  - **Major error:** Confuses Sen with Arrow (e.g., discusses IIA or unrestricted domain).  
  - Misapplies Pareto (e.g., applies to non-unanimous pairs).  
  - Misidentifies liberal domains (e.g., swaps rights between households).  
  - Fails to derive the core contradiction.  
  - Omits formal analysis entirely.
