  specifically, should we prioritize figuring out whether postdictive consciousness actually changes the content of the experience (like rewriting) or just deletes conflicting frames (like airbrushing)? then there's whether this means our "now" is always reconstructed from the future, and whether that has any real implications for free will or moral responsibility. also i made up this idea called "frame excision latency" - like the speed at which contradictory percepts get dropped - and im wondering if thats a useful line to think about or just made-up jargon.

