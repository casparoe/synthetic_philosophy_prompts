answer: |-
  **Bottom line:** The sharpest disagreement concerns whether agents should condition on their own logical outputs (logical decision theories) or treat actions as causal interventions (causal decision theories) when handling logical correlations.  

  **Taxonomy:**  
  1. **Diagnostic: Given a 10ms computation budget, must the agent accept suboptimal heuristics?**  
     - **Yes →**  
       *Claim: Bounded agents require resource-constrained approximations.*  
       2. **Diagnostic: When self-inspection risks non-termination (e.g., incomplete self-simulation), should the agent avoid direct introspection?**  
          - **Yes →**  
            *Claim: Abstract, high-level models should replace direct self-simulation.*  
            3. **Diagnostic: For an identical, causally isolated copy, should the agent condition on shared logical outputs?**  
               - **Yes →**  
                 **Leaf: Logical-dependence view (FDT family).** Awkward commitment: Must defend "acausal control" over independent systems via logical correlation.  
               - **No →**  
                 **Leaf: Embedded causal decision theory.** Awkward commitment: Cannot coordinate with identical copies in Newcomb-like dilemmas.  
          - **No →**  
            *Claim: Attempt partial self-simulation with fallbacks.*  
            **Leaf: Bounded-rationality embedded agency (Simon-style).** Awkward commitment: Heuristics may create unstable self-predictions under introspection.  
     - **No →**  
       *Claim: Optimal actions are computable within limits (or constraints are ignored).*  
       2. **Diagnostic: Can the agent consistently resolve self-referential claims via fixed-points (e.g., Löb's theorem)?**  
          - **Yes →**  
            3. **Diagnostic: Should logical correlation with a copy override causal independence?**  
               - **Yes →**  
                 **Leaf: Logical-dependence view (FDT family).** *[Same as above; flagged convergence]*  
               - **No →**  
                 **Leaf: Embedded causal decision theory.** *[Same as above; flagged convergence]*  
          - **No →**  
            *Claim: Self-reference is handled externally.*  
            **Leaf: Classical externalist decision theory.** Awkward commitment: Cannot model agents that dynamically rewrite their source code.  
     - **Branch convergence note:** Logical-dependence and embedded causal positions each appear twice, reflecting shared reasoning paths for bounded/unbounded cases.  

  **Unnamed leaf:** The "No" branch at Node 2 under "Yes" to 10ms constraints (i.e., *using abstract models but rejecting logical conditioning for copies*) lacks a labelled position. **Diagnosis:** Unexplored; risks incoherence when denying logical dependence while relying on abstraction.  

  **Cases integrated:**  
  - (i) Non-termination from self-inspection appears in Node 2 (bounded branch).  
  - (ii) Causally isolated copy appears in Node 3.  
  - (iii) 10ms budget is the root diagnostic.  

  **Word count:** 378.
