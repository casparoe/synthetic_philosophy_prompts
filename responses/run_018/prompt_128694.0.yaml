prompt: |-
  As a doctoral student in the philosophy of science studying predictive failure across long time-horizons, I am developing a comparative framework for cases where a theory appears empirically defeated in the short run but is later defended as having been correct in its underlying dynamics though premature in its timeline. I need you to operationalize this framework into a reusable decision procedure that a research assistant without specialized philosophical training could apply consistently to individual case files.

  Please construct a step-by-step evaluation protocol for classifying the status of a long-run predictive theory—specifically one that forecasts a structural relationship between population, resources, or analogous variables—when observed outcomes diverge from the prediction within the originally specified window. Your procedure must distinguish four evaluative categories: strict falsification by contradictory outcome; temporal displacement with the core mechanism intact; mechanism substitution in which the causal pathway is replaced but the limiting outcome eventually appears; and scale mismatch, in which local or sectoral falsification coexists with global or long-run confirmation. For each category, specify the evidentiary thresholds that must be met, the counterfactual comparisons the evaluator must construct, and the precise point at which the decision must be handed to disciplinary judgment rather than resolved by rule—particularly regarding what counts as the "same mechanism" versus an ad hoc theoretical rescue.

  The protocol should include explicit stopping conditions that tell the evaluator when further iteration is unwarranted, and it should flag the specific steps where internalist and externalist historiographical traditions would legitimately diverge without undermining the procedure. Once the framework is specified, apply it to three cases: first, Malthus's original argument in the Essay on the Principle of Population concerning the relationship between population growth and subsistence in Europe, accounting for the agricultural and demographic transitions that interrupted the predicted trajectory; second, a hypothetical 1970s forecast of global resource depletion by the year 2000 that failed because of unanticipated efficiency and substitution effects, but in which severe regional shortages emerged by the 2020s through a different causal pathway; and third, a deliberately ambiguous case—such as a late-twentieth-century prediction of widespread urban collapse due to energy constraints that was avoided through decentralized adaptation—where the procedure should yield an unsettled result requiring normative judgment about whether adaptation counts as mechanism substitution or as falsification of the original structural claim.

  Please present the procedure in ordered steps with decision nodes, apply each case with explicit reference to the relevant category or judgment point, and conclude by stating what the procedure cannot do—specifically, which philosophical disputes about scientific realism and theoretical identity it necessarily leaves unresolved.
reasoning: |-
  We are constructing a decision procedure for classifying long-run predictive theories that face short-run empirical divergence. The four categories are:

  1. Strict falsification: The predicted outcome is contradicted by evidence, with no later realization.
  2. Temporal displacement: The core mechanism remains intact but the timeline is extended; the outcome eventually occurs through the same causal pathway.
  3. Mechanism substitution: The outcome eventually occurs, but through a different causal pathway than originally predicted.
  4. Scale mismatch: The prediction fails locally or in a sector but holds globally or in the long run.

  The procedure must be step-by-step and include:
  - Evidentiary thresholds
  - Counterfactual comparisons
  - Points where disciplinary judgment is needed (especially regarding "same mechanism" vs. ad hoc rescue)
  - Stopping conditions
  - Flags for internalist/externalist divergence

  We then apply to three cases.

  ---

  **Decision Procedure: Classifying Long-Run Predictive Theory Failures**

  *Purpose*: To classify a theory's status when its prediction fails in the originally specified time window.

  *Input*: A case file containing:
    (a) The original theory's prediction (including variables, mechanism, timeline, scope)
    (b) Evidence of outcomes during the original time window
    (c) Evidence of outcomes after the original time window (if available)
    (d) Historical context and alternative explanations

  *Output*: One of the four categories, or an "unsettled" result requiring normative judgment.

  ---

  **Step-by-Step Protocol**

  **Step 0: Pre-evaluation Check**
  - Verify that the case meets the scope: a long-run predictive theory forecasting structural relationships (e.g., population-resources) that has failed within the original time window.
  - If the prediction was not clearly falsified in the short run (e.g., data is ambiguous), stop: the case is not applicable.
  - *Stopping Condition 0*: If the theory's prediction was not made with a clear timeline or mechanism, flag as "insufficiently specified" and halt.

  **Step 1: Establish the Original Prediction**
  - Extract: 
    (a) The predicted outcome (O_original) and its timeline (T_original).
    (b) The core causal mechanism (M_original) as described in the theory.
    (c) The scope (S_original): e.g., global, regional, sectoral.
  - *Judgment Point 1*: If the mechanism is ambiguous, consult a domain expert to reconstruct M_original from the theory's text. (Internalists may rely solely on the theorist's writings; externalists may consider the historical context of the theory's development.)

  **Step 2: Short-Run Falsification Assessment**
  - Compare observed outcomes at T_original with O_original.
    - If the outcome occurred as predicted → Category: Not a failure (halt).
    - If the outcome did not occur → Proceed to Step 3.
  - *Evidentiary Threshold 2A*: Falsification requires clear, uncontested data showing divergence from O_original. If data is contested, flag for disciplinary review.
  - *Counterfactual 2B*: Consider whether the absence of O_original could be due to external shocks (e.g., war, policy intervention) not accounted for in the theory. If so, the case may still proceed, but note the shock.

  **Step 3: Post-Hoc Trajectory Analysis**
  - Examine evidence after T_original up to the present (or a reasonable long-run horizon, T_long).
    - If O_original eventually occurs → Proceed to Step 4.
    - If O_original does not occur and there is no trend toward it → Proceed to Step 7 (Strict Falsification assessment).
  - *Stopping Condition 3*: If T_long has not been reached and the outcome is still pending, classify as "pending" and halt. (The theory is neither confirmed nor falsified yet.)

  **Step 4: Mechanism Comparison (for cases where outcome eventually occurs)**
  - Determine the causal pathway that led to the outcome:
    (a) Reconstruct the actual mechanism (M_actual) from evidence.
    (b) Compare M_actual with M_original.
  - *Judgment Point 4*: Determine if M_actual is "the same" as M_original. Use the following criteria:
    - *Core components*: Does M_actual rely on the same key variables and relationships as M_original?
    - *Counterfactual test*: If the original mechanism had been blocked, would the outcome still have occurred via M_actual? (If yes, then mechanisms are different.)
  - *Evidentiary Threshold 4A*: Require direct or strong indirect evidence for M_actual (e.g., statistical analysis, process tracing).
  - *Internalist/Externalist Flag*: Internalists may require M_actual to be derivable from the original theory without ad hoc additions; externalists may accept that M_actual is a historically contingent realization of the theory's abstract core.

  **Step 5: Classification of Delayed Outcomes**
  - Based on Step 4:
    - If M_actual is the same as M_original → Category: Temporal Displacement.
    - If M_actual is different from M_original → Proceed to Step 6.

  **Step 6: Mechanism Substitution vs. Scale Mismatch**
  - *For Mechanism Substitution*: The outcome occurs through a different mechanism, but the limiting outcome (e.g., resource exhaustion, collapse) is the same as O_original.
  - *For Scale Mismatch*: The outcome did not occur at the original scope (e.g., local) but occurred at a different scope (e.g., global), or vice versa.
  - Assess:
    (a) Scope: Did the outcome occur at S_original? If not, does it hold at a different scale?
    (b) Mechanism: Even if the mechanism is different, is the outcome fundamentally the same?
  - *Judgment Point 6*: If the outcome is the same but the scope differs, classify as Scale Mismatch. If the outcome is the same and the scope is the same but the mechanism is different, classify as Mechanism Substitution.
  - *Counterfactual 6A*: If the original mechanism was blocked, would the outcome still have occurred? (If yes, Mechanism Substitution is supported.)

  **Step 7: Strict Falsification Assessment**
  - Apply if the outcome never occurs (Step 3) or if the outcome that occurs is fundamentally different from O_original.
  - *Evidentiary Threshold 7A*: Require evidence that the conditions for the theory's mechanism are still present (or were present in the past) but did not lead to O_original.
  - *Counterfactual 7B*: Consider whether the absence of the outcome can be explained by the theory itself (e.g., because of an overlooked damping factor). If so, it may be a theoretical flaw, not falsification.
  - *Judgment Point 7*: If the outcome is absent and no plausible path exists for it to occur, classify as Strict Falsification.

  **Step 8: Unsettled Cases**
  - If at any step the evidence is ambiguous or the judgment points cannot be resolved by the rules (e.g., disagreement on "same mechanism"), classify as "unsettled" and specify the point of contention.

  ---

  **Application to Cases**

  **Case 1: Malthus's Population Principle (Europe, 1798)**
  - *Original prediction*: Population grows geometrically, subsistence arithmetically → inevitable checks (misery, vice) when population exceeds subsistence. Timeline: Implicitly short-medium term (within decades).
  - *Short-run (early 19th century)*: Agricultural revolution and demographic transition (declining birth rates) avoided the crisis in Europe.
  - *Step 1*: O_original = crisis (famine, poverty); M_original = population growth outstripping food production; S_original = national/regional (Europe).
  - *Step 2*: Observed outcome: No crisis at T_original (falsified in short run).
  - *Step 3*: Long-run: Some argue Malthusian pressures persist in resource scarcity, but no general crisis in Europe. Proceed to Step 7.
  - *Step 7*: Outcome (crisis) did not occur in Europe. However, Malthusian crises occurred elsewhere (e.g., Irish Potato Famine) but not through the exact same mechanism (policy failures played a role). 
    - *Judgment*: Is this Scale Mismatch (local crises in a global context) or Strict Falsification? 
      - Scale: The original scope (Europe) did not experience the crisis, but local (within Europe) crises did occur. However, the mechanism was not purely population-resource imbalance (e.g., Ireland had food exports during famine). 
    - *Counterfactual 7B*: Without the agricultural revolution, would the crisis have occurred? Likely yes, so the theory's core dynamics (population pressure) were circumvented by exogenous factors.
  - *Classification*: **Temporal Displacement** is rejected (no delayed crisis in Europe). **Strict Falsification** for Europe? But note: Malthusian mechanisms operate in some contexts. 
    - *Better fit*: **Scale Mismatch** — the theory holds in some regions (global South) but not in Europe. However, the original scope was Europe. 
    - *Final call*: **Strict Falsification** for the European case as originally scoped, but the procedure flags that the theory may have validity at other scales. (Disciplinary judgment: Malthus is often seen as falsified in the West but applicable elsewhere.)

  **Case 2: Hypothetical 1970s Global Resource Depletion Forecast (by 2000)**
  - *Original prediction*: Depletion of key resources (e.g., oil, minerals) by 2000 due to exponential demand and fixed supply. Mechanism: M_original = consumption exceeding discovery/new supply.
  - *Short-run (2000)*: Efficiency gains (e.g., fuel-efficient cars) and substitution (e.g., renewables) avoided global depletion.
  - *Long-run (2020s)*: Regional shortages (e.g., water in Middle East, rare earth metals in tech) due to different mechanisms (e.g., geopolitical conflicts, environmental degradation).
  - *Step 1*: O_original = global resource depletion by 2000; M_original = consumption-driven exhaustion; S_original = global.
  - *Step 2*: 2000 outcome: No global depletion → falsified.
  - *Step 3*: By 2020s, no global depletion, but regional shortages → outcome not O_original, but similar (scarcity). Proceed to Step 4 (since scarcity is a partial outcome).
  - *Step 4*: M_actual for regional shortages: e.g., climate change reducing water supply, trade disputes. Compare to M_original (consumption growth). 
    - Core components: Different (no direct link to global consumption outstripping supply). 
    - Counterfactual: If consumption had been curbed, would regional shortages still have occurred? Yes, because of climate change. → Different mechanism.
  - *Step 6*: Outcome: Scarcity, but at regional (not global) scale. 
    - The limiting outcome (scarcity) appeared but at a different scale and through a different mechanism. 
    - Classification: **Scale Mismatch** (global prediction failed, but local/regional scarcity occurred) and **Mechanism Substitution** (different causes). However, the original outcome (global depletion) has not occurred. 
    - *Judgment*: The regional shortages are not the same as global depletion. Hence, not Mechanism Substitution (which requires the same outcome). 
  - *Step 7*: The original outcome (global depletion) has not occurred, and the observed phenomena are different. 
  - *Classification*: **Strict Falsification** for the global prediction? But note: the theory might argue that regional shortages are precursors. 
    - *Final call*: **Unsettled** between Strict Falsification (because the global outcome did not occur) and Mechanism Substitution (if we interpret "depletion" more broadly as "scarcity crises"). Requires normative judgment about whether regional shortages are the "same outcome" as global depletion.

  **Case 3: Hypothetical Late-20th Century Urban Collapse Prediction (due to energy constraints)**
  - *Original prediction*: By 2020, major cities collapse due to energy shortages (e.g., peak oil). Mechanism: M_original = rising energy costs leading to infrastructure failure and social breakdown.
  - *Short-run (2020)*: No collapse. Decentralized adaptation (solar panels, telecommuting) reduced energy dependence.
  - *Long-run*: Cities persist, but with transformed energy systems.
  - *Step 1*: O_original = urban collapse; M_original = energy shortage → collapse; S_original = major cities (global).
  - *Step 2*: No collapse by 2020 → falsified.
  - *Step 3*: No collapse to date → proceed to Step 7? But note: the outcome was avoided by adaptation.
  - *Step 7*: Assess why: Adaptation (a factor not in M_original) prevented collapse. 
    - Counterfactual: Without adaptation, would collapse have occurred? If yes, then the core mechanism (energy shortage causing collapse) might still be valid but circumvented. 
    - *Judgment*: Does adaptation count as an external shock, or is it part of a substituted mechanism? 
      - If adaptation is seen as an exogenous rescue, then the core mechanism is intact (temporal displacement? but no collapse). 
      - If adaptation is a different pathway to avoiding collapse, then the original structural claim (that energy shortage necessarily causes collapse) is falsified. 
  - *Classification*: **Unsettled**. The key issue is whether the avoidance of collapse through adaptation constitutes:
    (a) Mechanism Substitution (the outcome is non-collapse, but through a different pathway than the theory considered) → then the original prediction (collapse) is falsified, but the outcome changed because of new mechanisms, or 
    (b) Falsification of the necessity claim (the theory said collapse was inevitable, but it wasn't) → Strict Falsification. 
    - The procedure flags the need for normative judgment: Is the theory's core claim about the inevitability of collapse under energy constraints? If so, adaptation falsifies that inevitability. But if the theory allowed for adaptation (it didn't), then it's an ad hoc rescue.

  ---

  **Conclusion: What the Procedure Cannot Do**

  The procedure operationalizes a comparative framework but leaves unresolved:
  1. **Theoretical Identity**: What counts as the "same mechanism" is inherently contestable and depends on how we individuate causal processes (e.g., by variables, by mathematical form). This is a philosophical question about theoretical terms and natural kinds.
  2. **Scientific Realism**: The procedure does not resolve whether the theory's unobservable core (e.g., "Malthusian pressure") is real or instrumental. Internalists may accept the theory's ontology; externalists may see it as a social construct.
  3. **Normative Boundaries**: The distinction between a legitimate extension of a theory and an ad hoc rescue is normative. The procedure flags this but does not resolve it.
  4. **Temporal Indefiniteness**: Theories that are "eventually" true may be unfalsifiable. The procedure uses a stopping condition (T_long) but cannot define what "long enough" is in principle.

  Despite these limitations, the procedure provides a structured, transparent method for comparing cases of predictive failure in the philosophy of science.
answer: |-
  Below is the operationalized decision procedure for evaluating long-run predictive theories in cases of short-run divergence, followed by applications to your three specified cases. The procedure is designed as a step-by-step protocol with explicit decision nodes, evidentiary thresholds, counterfactual requirements, and judgment points. It distinguishes between **strict falsification**, **temporal displacement**, **mechanism substitution**, and **scale mismatch**, with clear stopping conditions and flags for historiographical divergence.

  ---

  ### **Decision Procedure: Evaluating Long-Run Predictive Theories**  
  *Purpose*: Classify a theory’s status when its prediction fails within the original time window.  
  *Input*: Case file containing:  
  - (a) Original prediction (variables, timeline, scope, mechanism).  
  - (b) Observed outcomes during the original time window.  
  - (c) Post-hoc evidence (if any) beyond the original window.  
  - (d) Competing explanations or contextual factors.  

  **Protocol Steps**  
  *Key Symbols*:  
  - **Oₒ**: Original predicted outcome.  
  - **Tₒ**: Original timeline.  
  - **Mₒ**: Core causal mechanism (described in the theory).  
  - **Sₒ**: Original scope (e.g., global, regional, sectoral).  
  - **Oₐ**: Actual observed outcome.  
  - **Mₐ**: Actual mechanism (inferred from evidence).  
  - **Sₐ**: Actual scope of outcome.  

  #### **Step 1: Baseline Verification**  
  - **Task**: Confirm the prediction was falsified within Tₒ.  
  - **Evidentiary Threshold**: Quantitative or qualitative data showing clear divergence from Oₒ at Tₒ. If divergence is ambiguous (e.g., measurement disputes), halt.  
  - **Decision Node**:  
    - If Oₐ ≠ Oₒ at Tₒ → Proceed to Step 2.  
    - If Oₐ ≈ Oₒ at Tₒ → Halt (not a predictive failure).  
  - **Stopping Condition**: Insufficient evidence of divergence → "Unclassifiable (data gap)."  

  #### **Step 2: Temporal Extension Assessment**  
  - **Task**: Determine if Oₒ occurs later than Tₒ.  
  - **Evidentiary Threshold**: Data showing Oₒ materializing after Tₒ, with no fundamental change in Mₒ or Sₒ.  
  - **Counterfactual**: *If exogenous shocks (e.g., wars, policies) explain the delay, would Mₒ have produced Oₒ on time?*  
  - **Decision Node**:  
    - If Oₒ occurs post-Tₒ → Proceed to Step 3 (temporal displacement candidate).  
    - If Oₒ never occurs → Proceed to Step 4 (falsification candidate).  
  - **Judgment Point**: Requires disciplinary expertise to rule out ad hoc timeline extensions.  
  - **Internalist/Externalist Flag**: Internalists accept timeline adjustments if consistent with theory; externalists demand socio-historical evidence of ad hocness.  

  #### **Step 3: Mechanism Integrity Check**  
  - **Task**: Assess if Mₐ matches Mₒ for delayed Oₒ.  
  - **Evidentiary Threshold**: Direct empirical traces of Mₒ (e.g., population pressure causing scarcity).  
  - **Counterfactual**: *If Mₒ was disabled, would Oₒ still occur?* If yes, Mₐ ≠ Mₒ.  
  - **Decision Node**:  
    - If Mₐ ≡ Mₒ → **Category: Temporal displacement**.  
    - If Mₐ ≠ Mₒ → Proceed to Step 4.  
  - **Judgment Point**: "Same mechanism" requires:  
    - Identical core variables (e.g., population/resource ratios).  
    - Identical causal direction (e.g., scarcity → collapse).  
    - Disciplinary judgment needed for borderline cases (e.g., "pressure" vs. "stress").  

  #### **Step 4: Outcome Realization Check**  
  - **Task**: Determine if Oₒ occurs *eventually* through any means.  
  - **Evidentiary Threshold**: Oₒ must be observed (e.g., collapse, depletion) irrespective of Mₐ or Sₐ.  
  - **Decision Node**:  
    - If Oₒ occurs → Proceed to Step 5 (mechanism substitution/scale mismatch candidate).  
    - If Oₒ never occurs → Proceed to Step 6 (falsification candidate).  

  #### **Step 5: Scope and Mechanism Comparison**  
  - **Task**: Compare Sₐ and Mₐ to Sₒ and Mₒ.  
  - **Counterfactual**: *If Sₒ was narrowed/enlarged, would Oₒ still hold?*  
  - **Decision Node**:  
    - **If Sₐ ≠ Sₒ but Oₒ occurs** (e.g., local vs. global):  
      - → **Category: Scale mismatch** (if Mₐ ≡ Mₒ) or **Mechanism substitution** (if Mₐ ≠ Mₒ).  
    - **If Sₐ ≡ Sₒ but Mₐ ≠ Mₒ**:  
      - → **Category: Mechanism substitution**.  
  - **Judgment Point**: "Limiting outcome" requires disciplinary input (e.g., is "regional scarcity" equivalent to "global depletion"?).  

  #### **Step 6: Falsification Confirmation**  
  - **Task**: Confirm Oₒ is irreconcilable.  
  - **Evidentiary Threshold**: Persistent absence of Oₒ with no trend toward it.  
  - **Counterfactual**: *Are there conditions where Mₒ could produce Oₒ?* If no → **Category: Strict falsification**.  
  - **Stopping Condition**: If Oₒ plausibly remains future-contingent → "Unsettled (pending)."  

  #### **Step 7: Unsettled Cases**  
  - **Task**: Flag unresolvable ambiguity.  
  - **Conditions**:  
    - Disagreement on Mₒ/Mₐ equivalence.  
    - Normative disputes over outcome equivalence.  
    - Incommensurable evidence (e.g., contested data).  
  - **Output**: "Unsettled: requires normative judgment."  

  ---

  ### **Case Applications**  

  #### **Case 1: Malthus’s Population Principle (Europe, 1798)**  
  - **Oₒ**: Crisis (famine/social collapse) due to population outstripping subsistence.  
  - **Tₒ**: Implicitly 1–2 generations (by mid-1800s).  
  - **Mₒ**: Fixed agricultural productivity + geometric population growth → scarcity.  
  - **Sₒ**: National/regional (Europe).  
  - **Short-run divergence (Tₒ)**: Agricultural revolution (productivity ↑) and demographic transition (birth rates ↓) averted crisis.  
  - **Post-Tₒ evidence**: No Malthusian crisis in Europe; global population growth continues with managed resources.  

  **Procedure Application**:  
  1. **Step 1**: Falsified at Tₒ (no crisis in Europe).  
  2. **Step 2**: Oₒ did not occur later in Europe → Proceed to Step 4.  
  3. **Step 4**: Oₒ never realized in Sₒ (Europe) → Proceed to Step 6.  
  4. **Step 6**: Absence of Oₒ is persistent. **Counterfactual**: Without agricultural/demographic shifts, Mₒ would have produced Oₒ.  
  5. **Judgment Point**: Disciplinary input confirms Mₒ was circumvented, not delayed.  
  6. **Category: Strict falsification** for Europe.  
  - **Note**: Scale mismatch possible globally (e.g., local famines), but Sₒ was Europe-specific.  

  ---

  #### **Case 2: 1970s Global Resource Depletion Forecast (Hypothetical)**  
  - **Oₒ**: Global depletion of key resources (e.g., oil, minerals) by 2000.  
  - **Tₒ**: By 2000.  
  - **Mₒ**: Rising consumption + fixed supply → exhaustion.  
  - **Sₒ**: Global.  
  - **Short-run divergence (Tₒ)**: Efficiency/substitution (e.g., fracking, renewables) averted global depletion.  
  - **Post-Tₒ evidence**: Severe regional shortages (e.g., water, rare metals) by 2020s via climate change/trade conflicts.  

  **Procedure Application**:  
  1. **Step 1**: Falsified at Tₒ (no global depletion by 2000).  
  2. **Step 2**: Oₒ (global depletion) never occurs → Proceed to Step 4.  
  3. **Step 4**: Oₒ unrealized, but regional scarcity (partial Oₒ) occurs → Proceed to Step 5.  
  4. **Step 5**:  
     - Sₐ ≠ Sₒ (regional vs. global).  
     - Mₐ ≠ Mₒ (climate/trade vs. consumption-driven depletion).  
     - **Counterfactual**: Without efficiency gains, Mₒ might have produced Oₒ.  
  5. **Judgment Point**: Is regional scarcity a "limiting outcome" akin to depletion? Disciplinary input: Yes, if structural scarcity is the core claim.  
  6. **Category: Scale mismatch** (global Oₒ failed, but local Oₒ confirmed) + **Mechanism substitution** (Mₐ ≠ Mₒ).  

  ---

  #### **Case 3: Hypothetical Urban Collapse Prediction (Energy Constraints)**  
  - **Oₒ**: Collapse of major cities by 2020 due to energy shortages.  
  - **Tₒ**: By 2020.  
  - **Mₒ**: Energy scarcity → infrastructure failure → social collapse.  
  - **Sₒ**: Global (major cities).  
  - **Short-run divergence (Tₒ)**: Decentralized adaptation (solar, remote work) averted collapse.  
  - **Post-Tₒ evidence**: Cities persist with transformed energy systems; no collapse.  

  **Procedure Application**:  
  1. **Step 1**: Falsified at Tₒ (no collapse).  
  2. **Step 2**: Oₒ never occurs → Proceed to Step 4.  
  3. **Step 4**: Oₒ unrealized → Proceed to Step 6.  
  4. **Step 6**: **Counterfactual**: Without adaptation, Mₒ might have produced Oₒ. But adaptation invalidated Mₒ’s necessity.  
  5. **Judgment Point**:  
     - Is adaptation **mechanism substitution** (new pathway avoids collapse) or **falsification** of structural inevitability?  
     - Disciplinary split:  
       - *Internalists*: Adaptation is external rescue; Mₒ remains valid but was avoided.  
       - *Externalists*: Adaptation falsifies Mₒ’s core claim (energy scarcity → *inevitable* collapse).  
  6. **Category: Unsettled** (normative judgment required).  
     - Procedure flags Step 5 (Mₐ equivalence) and Step 6 (outcome equivalence).  

  ---

  ### **What the Procedure Cannot Resolve**  
  The procedure operationalizes empirical and comparative analysis but leaves foundational philosophical disputes unresolved:  
  1. **Theoretical Identity**: When is a mechanism the "same" versus ad hoc? (e.g., Is "market adaptation" in resource cases a refinement of Mₒ or a new theory?).  
  2. **Scientific Realism**: Does eventual confirmation (e.g., mechanism substitution) validate the theory’s underlying structure, or is it retroactive fitting?  
  3. **Normative Boundaries**: Classifying "limiting outcomes" (e.g., is regional scarcity a "success" for a global theory?) requires domain-specific values.  
  4. **Historiographical Divergence**: Internalist vs. externalist views of "same mechanism" (Step 3) and "ad hoc rescue" (Step 6) remain irreconcilable without meta-framework agreement.  
  5. **Infinite Deferral**: Temporal displacement claims risk unfalsifiability; stopping conditions are pragmatic, not ontological.  

  This procedure systematizes case comparison but cannot replace philosophical engagement with realism, underdetermination, or theory-ladenness. It reveals where empirical analysis ends and metaphysics begins.
