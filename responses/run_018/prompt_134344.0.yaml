answer: |-
  ## The Pluto Reclassification Through Frege's Lens: Sense, Reference, and Institutional Kinds

  Applying Frege's puzzle to the 2006 IAU reclassification of Pluto reveals a complex interplay between reference, sense, and the nature of kind terms.

  **Mapping to Frege's Framework:**
  1.  **The Trivial vs. The Informative:** Frege distinguished between trivial identity statements ("a = a" – e.g., "Pluto is Pluto") and informative ones ("a = b" – e.g., "Hesperus is Phosphorus"). The latter are informative because they link the same referent (Venus) *via two different senses* (the evening star, the morning star).
  2.  **The Pluto Case:** The statement "Pluto is a dwarf planet" (or "Pluto is not a planet" under the IAU definition) functioned similarly to an informative identity statement. While "Pluto is Pluto" remained trivial, asserting that Pluto is *not* a planet (or *is* a dwarf planet) under the new definition carried significant cognitive weight and provoked resistance.
  3.  **Referent Stability:** Crucially, **the referent of 'Pluto' did not change.** It still denotes the same specific celestial body – that icy, rocky object orbiting the Sun beyond Neptune, discovered by Clyde Tombaugh in 1930. The physical object Pluto remained constant.
  4.  **Source of Cognitive Shock:** The shock stemmed **entirely from a shift in the *sense* of 'planet'**. Pre-2006, 'planet' was broadly understood through observational criteria: a large, non-stellar, Sun-orbiting body, often assumed to be spherical. Pluto fit this loose sense. Post-2006, the IAU introduced a precise, *dynamical* sense: a body that has "cleared its orbital neighbourhood". Pluto demonstrably failed this new criterion. The *concept* (sense) attached to the word 'planet' changed, altering Pluto's classification *without altering Pluto itself*.

  **'Planet' as Natural Kind vs. Institutional Kind:**

  The epistemic profile of the identity statement "Pluto is/is not a planet" changes dramatically depending on how we interpret 'planet':

  1.  **As a Putative Natural Kind Term (with Essence):**
      *   **Assumption:** 'Planet' refers to a fundamental category of nature defined by an underlying physical essence (e.g., formation process, specific mass/density thresholds, gravitational dominance).
      *   **Frege's Puzzle Prediction:** If 'planet' had a true essence, the statement "Pluto is not a planet" would be an empirical discovery about Pluto's *nature*. Its informativeness would stem from revealing that Pluto lacks the essential properties we previously *mistakenly* attributed to the kind (or that our understanding of the essence was wrong). Resistance could be seen as clinging to an outdated scientific theory.
      *   **Legitimacy of Attachment:** Under this view, public attachment to Pluto as a planet is primarily *scientifically* misguided, rooted in incorrect beliefs about Pluto's essence or the essence of 'planet'. Nostalgia might be understandable, but the classification change reflects objective reality.

  2.  **As an Institutional Kind Term (Conventional Criteria):**
      *   **Reality:** 'Planet' (as defined by the IAU) is an institutional kind. Its meaning is constituted by conventional criteria established by a recognized authority (the IAU) for pragmatic purposes (e.g., taxonomy, education, research focus). There is no pre-existing "planet essence" discovered; there is a definition *decided upon*.
      *   **Frege's Puzzle Prediction:** The informativeness of "Pluto is not a planet (under the IAU definition)" stems purely from the *change in the conventional sense* stipulated by the IAU. It informs us of a new linguistic/social rule. Resistance stems not from a scientific error about Pluto's nature, but from disagreement with the *newly stipulated sense* itself or the authority's right to stipulate it.
      *   **Legitimacy of Attachment:** Public attachment gains significant legitimacy. Pluto's classification under the old sense was deeply embedded in culture, education, and collective identity for generations. Resisting the change isn't (necessarily) scientific ignorance; it's an objection to the redefinition of a culturally significant term by a specific institution. The attachment is to the *old sense* and its cultural meaning, not necessarily a belief in a mythical essence.

  **Conclusion: What the Pluto Episode Reveals about Frege's Puzzle**

  The Pluto episode **confirms the core tenet of Frege's puzzle**: cognitive value (informativeness, surprise, resistance) tracks a divergence in *sense*, regardless of whether the referent changes or not. Pluto remained Pluto, but the sense of 'planet' changed.

  However, it also **significantly refines and extends Frege's puzzle** regarding natural vs. conventional kinds:

  1.  **Demonstrates the Epistemic Profile of Institutional Kinds:** Statements involving institutional kind terms like "Pluto is not a planet" *do* have a different epistemic profile from Frege's classic astronomical examples (like Hesperus/Phosphorus).
      *   In Frege's natural kind examples, the informativeness reveals an empirical truth about the *world* (two senses refer to the same object).
      *   In the institutional kind case (Pluto), the informativeness reveals a *stipulative decision* about *language/convention*. The shock isn't about Pluto's nature, but about a change in the rules of the classificatory game.
  2.  **Highlights the Source of Resistance:** The episode vividly illustrates that resistance to informative identity statements involving institutional kinds stems from attachment to the *old sense* and its cultural/social significance, not confusion about reference. It underscores that senses are not purely descriptive but can carry immense historical, cultural, and emotional weight.
  3.  **Confirms Sense as the Key, Regardless of Kind Type:** While the *source* of the new sense and the *reason* for resistance differ, the fundamental Fregean mechanism holds: **Cognitive value arises from the difference in the mode of presentation (sense), irrespective of whether the kind term purports to name a natural essence or is defined by convention.** The puzzle's structure – triviality of "a=a" vs. informativeness of "a has property F (under a specific sense)" – remains robust. The Pluto case shows that this applies equally to empirically discovered identities and conventionally stipulated reclassifications, even though the *nature* of the sense change and the justification for resistance are profoundly different.

  In essence, the Pluto episode validates Frege's core insight about sense and reference driving cognitive value, while simultaneously demonstrating that the *epistemology* and *sociology* surrounding identity statements change dramatically when the senses involved are tied to institutional conventions rather than (putative) natural essences. The public's resistance wasn't a failure to understand Pluto or reference; it was a reaction to the IAU redefining the culturally ingrained *sense* of a familiar term.
