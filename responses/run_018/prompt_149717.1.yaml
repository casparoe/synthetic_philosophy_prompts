answer: |-
  ### Structured Role-Play: "The Art of Survival"  
  **Objective:** Simulate the tension between artistic neutrality and social commitment without revealing Du Bois until the debrief. Players experience why neutrality is impossible, why marginalized artists bear a unique duty, and how art functions as propaganda.  

  **Time Allocation:**  
  - Setup: 10 min  
  - Rounds 1-3: 15 min each (45 min total)  
  - Final Tally & Survival Phase: 5 min  
  - Debrief: 25 min  

  **Materials:**  
  - Role cards (secretly assigned)  
  - Paper tokens:  
    - **Production Tokens** (PT, 30 total): Artists use these to create artworks.  
    - **Funding Tokens** (FT, 12 total): Patrons use these to sponsor artworks.  
    - **Legitimacy Points** (LP, tracked on paper): Critics award these; determine survival.  
  - Scoreboards for LP tracking (publicly visible).  
  - Community Survival Tracker (hidden until final tally).  

  ---

  ### **Roles & Secret Obligations**  
  *(Assign roles randomly; ensure 14 players as below)*  
  1. **Artists (6 players)**:  
     - **Marginalized Artists (3)**: Secret duty—must generate **LP for community survival**.  
     - **Non-Marginalized Artists (3)**: No community duty; maximize **personal LP**.  
  2. **Patrons (4 players)**:  
     - **Commercial Patrons (2)**: Secretly reward **high Aesthetic (A) focus**.  
     - **Activist Patrons (2)**: Secretly reward **high Social Impact (SI) focus**.  
  3. **Critics (4 players)**:  
     - **Formalist Critics (2)**: Award LP for **A > SI** (aesthetic purity).  
     - **Social Impact Critics (2)**: Award LP for **SI > A** (social messaging).  

  ---

  ### **Rules & Token Economy**  
  #### **Phase 1: Artwork Creation (Per Round)**  
  - **Artists** receive **3 PT per round** (max 9 PT total over 3 rounds).  
  - To create an artwork, allocate PT to two attributes:  
    - **Aesthetic (A)**: Represents beauty, form, autonomy.  
    - **Social Impact (SI)**: Represents justice, advocacy, propaganda.  
  - **Allocation Rules**:  
    - Must spend **all PT each round** (e.g., 2 PT to A, 1 PT to SI).  
    - **Neutrality Penalty**: If A = SI (e.g., 1.5 PT each), the work gets **-2 LP** automatically.  

  #### **Phase 2: Patron Funding (Per Round)**  
  - Patrons receive **1 FT per round**.  
  - **Patrons secretly review artworks** and fund **one piece** that aligns with their hidden agenda:  
    - **Commercial Patrons**: Fund only if **A > SI**.  
    - **Activist Patrons**: Fund only if **SI > A**.  
  - **Consequence**: Funded artists gain **+2 PT for the next round**. Unfunded artists lose **1 PT** (cannot drop below 0).  

  #### **Phase 3: Critical Scoring (Per Round)**  
  - Critics award **Legitimacy Points (LP)** based on bias:  
    - **Formalist Critics**: Award **+3 LP** to the work with **highest A**, **+1 LP** to others.  
    - **Social Impact Critics**: Award **+3 LP** to the work with **highest SI**, **+1 LP** to others.  
  - **LP are public** and tracked on a scoreboard.  

  #### **Phase 4: Survival Obligations (Marginalized Artists Only)**  
  - After each round, **marginalized artists** must:  
    - **Convert 50% of their LP to Community Survival Tokens (CST)**.  
    - Example: 6 LP earned → 3 LP personal, 3 CST to community.  
  - **Non-marginalized artists** keep **100% of LP** for personal gain.  

  #### **Final Tally & Survival Phase**  
  1. **Community Survival**: Total CST must reach **20 tokens** for the marginalized community to "survive."  
  2. **Victory Conditions**:  
     - **Marginalized Artists Win** only if:  
       - Community survives (CST ≥ 20) AND they have ≥10 personal LP.  
     - **Non-Marginalized Artists Win** if they have the **highest personal LP**, regardless of community survival.  

  ---

  ### **Predicted Challenges & Corrections**  
  1. **"Propaganda = Deception" Misconception**:  
     - **Prediction**: Players equate "propaganda" with lies or manipulation.  
     - **Correction**: Clarify in debrief: "Du Bois defines propaganda as *committed advocacy for justice*, not deception. Art always serves a cause; neutrality is a myth."  
  2. **"System is Rigged" Frustration**:  
     - **Prediction**: Marginalized artists feel the CST rule is unfair; others call the token economy biased.  
