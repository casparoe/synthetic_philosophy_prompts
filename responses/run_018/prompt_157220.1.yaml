prompt: |-
  I'm the acquisitions editor for a small museum — we get exibit pitches every month that mix real archeology with fringe chronology or ancient-aliens claims. I need a reusable 10-minute screening procdure I can run alone, translating whatever philosophy of history says about demarcating pseudohistory (falsifiability, source proximity, consilience with established chronology, replication) into ordered steps: ask this, check that, hard stop here, values-call flag there. Fix the role, stakes, and where judgment can't be removed. Apply it to three pitches: (1) literal Plato Atlantis with underwater formations near the Azores; (2) Fomenko's statistical chronology arguing the Almagest was compiled in the 1500s; (3) ancient metallurgists needed alien tutors because a slag-purity study is misapplied. Include one case where the procdure kills it but I'd still want a "how myths form" display, and flag where it will misfire.
reasoning: |-
  We are creating a reusable 10-minute screening procedure for an acquisitions editor at a small museum. The procedure must be grounded in the philosophy of history and demarcation of pseudohistory. Key concepts: falsifiability, source proximity, consilience with established chronology, and replication.

  The procedure should have:
  - Ordered steps (ask this, check that)
  - Hard stops (if a condition is met, reject immediately)
  - Flags for values-call (where we might still consider for educational purposes but with caveats)
  - Clearly defined role of the editor, stakes (reputational, educational integrity), and where judgment is necessary.

  We'll apply it to three pitches:
  1. Literal Plato's Atlantis near Azores.
  2. Fomenko's statistical chronology (Almagest compiled in 1500s).
  3. Ancient metallurgists with alien tutors due to misapplied slag-purity study.

  Also, one case where the procedure kills the pitch but we might want a "how myths form" display.

  And flag where the procedure might misfire.

  ---

  **Screening Procedure: 10-Minute Pseudohistory Demarcation**

  **Role**: Acquisitions Editor. You are a gatekeeper for the museum's content, ensuring scholarly integrity while being open to new, well-supported research. You are not a specialist in every field but have a background in historical methods.

  **Stakes**: 
  - Reputational: Publishing fringe theories without due diligence can damage the museum's credibility.
  - Educational: The museum has a duty to educate the public accurately. Promoting pseudohistory can misinform.
  - Missed Opportunities: Overly rigid criteria might exclude innovative but unconventional research that is legitimate.

  **Judgment Points**: 
  - Where evidence is ambiguous, you must use judgment on whether to reject or flag for further review.
  - Deciding if a rejected pitch has educational value as a "case study in myth formation."

  **Time Allocation**: 10 minutes per pitch. Steps are designed to be sequential and time-boxed.

  ---

  **Procedure Steps**:

  1. **Initial Scan (1 minute)**:
     - **Ask**: Does the pitch make extraordinary claims (e.g., overturning established chronology, alien involvement, lost civilizations with advanced technology)?
     - **Check**: If yes, proceed with caution (raise skepticism level). If no, it may be conventional scholarship and can be fast-tracked for content review.
     - **Hard Stop**: If the pitch advocates hate speech, conspiracy theories with harmful intent, or is clearly fraudulent (e.g., known hoax). Reject immediately.

  2. **Falsifiability Check (2 minutes)**:
     - **Ask**: Is the claim testable? Can it be disproven by evidence? Pseudohistory often avoids falsification by constantly adapting or ignoring counter-evidence.
     - **Check**: Look for specific, verifiable predictions or a clear method for verification. If the claim is unfalsifiable (e.g., "aliens did it and then erased evidence"), it fails.
     - **Hard Stop**: Unfalsifiable claims. Reject.

  3. **Source Proximity & Quality (3 minutes)**:
     - **Ask**: What are the primary sources? How close in time and space are they to the claimed events? What are the secondary sources (scholarly vs. popular)?
     - **Check**:
       - Primary sources: Are they contemporary? Authentic? Reliable?
       - Secondary sources: Are they peer-reviewed? From reputable publishers? Avoid sources from known pseudohistory outlets (e.g., ancient astronaut TV shows, self-published books without peer review).
       - If the pitch relies on a single controversial source without independent corroboration, be wary.
     - **Hard Stop**: If the central evidence is a known forgery (e.g., the Kensington Runestone for Viking presence in Minnesota) or fabricated. Reject.
     - **Flag for Values-Call**: If sources are ambiguous or controversial but not definitively fraudulent, note for potential educational use (e.g., "this idea was popular in the 19th century but is now debunked").

  4. **Consilience with Established Chronology (2 minutes)**:
     - **Ask**: Does the claim fit with the established timeline of history/archaeology? Does it require rejecting a large body of evidence (e.g., radiocarbon dating, stratigraphy)?
     - **Check**: 
       - For chronological claims: Check if it aligns with dendrochronology, carbon dating, written records, etc.
       - For archaeological claims: Does it fit with known cultural sequences?
       - If the claim requires a massive rewrite (e.g., "the Middle Ages didn't exist"), it fails consilience.
     - **Hard Stop**: If the claim directly contradicts well-established, replicated evidence (e.g., the Earth is 6,000 years old vs. 4.5 billion). Reject.
     - **Flag for Values-Call**: If the claim is a minor anomaly (e.g., an out-of-place artifact that might be a hoax or misdated) but the main body of the pitch is otherwise sound, consider for further review.

  5. **Replication & Independent Verification (2 minutes)**:
     - **Ask**: Has the evidence been independently verified? Are methods repeatable?
     - **Check**:
       - For scientific claims: Are there lab reports? Can the experiment be repeated?
       - For historical claims: Have other scholars examined the same sources and reached similar conclusions?
       - If the pitch relies on unpublished or proprietary data, or if it's only supported by the author and a small group, be skeptical.
     - **Hard Stop**: If the central evidence has been debunked by replication attempts (e.g., cold fusion). Reject.

  **Final Decision**:
  - If no hard stops triggered and all checks passed: Send for peer review (if novel) or consider for acquisition.
  - If hard stop triggered: Reject.
  - If flags raised but no hard stop: Consider for "myth formation" or educational display on critical thinking, with clear context.

  ---

  **Application to Pitches**:

  **Pitch 1: Literal Plato's Atlantis near Azores**
  - **Initial Scan**: Extraordinary claim (lost advanced civilization). Proceed with caution.
  - **Falsifiability**: Claim is that underwater formations are man-made. Falsifiable by geological survey. But if proponents dismiss contrary evidence as "natural" or "eroded," it becomes unfalsifiable. *Flag: Might be unfalsifiable in practice.*
  - **Source Proximity**: Primary source is Plato's dialogues (allegorical?). No contemporary evidence for Atlantis. Underwater formations are natural (geology). Secondary sources: Mostly fringe (e.g., books by Atlantis seekers). *Hard Stop: No primary evidence; formations are natural.*
  - **Consilience**: Contradicts known human migration patterns and archaeological record (no evidence of advanced civilization in Atlantic 9,000 years ago). *Hard Stop: Fails consilience.*
  - **Replication**: No independent verification of man-made structures; geological consensus is natural. *Hard Stop: Rejected by scientific community.*
  - **Verdict**: **Reject** (multiple hard stops). But flag for "how myths form" display: Plato's story as allegory turned into literal search.

  **Pitch 2: Fomenko's Statistical Chronology (Almagest compiled in 1500s)**
  - **Initial Scan**: Extraordinary claim (re-dating classical works by 1,000 years). Proceed with caution.
  - **Falsifiability**: Claim is testable via historical records, astronomy. Fomenko uses statistical methods on dynastic records and star positions. But his methods are criticized for selective data. *Flag: Falsifiable in theory, but proponents ignore counter-evidence.*
  - **Source Proximity**: Primary sources are historical texts and the Almagest itself. Fomenko re-dates texts, but original manuscripts exist (e.g., Almagest manuscripts from 9th-10th century, not 16th). *Hard Stop: Manuscript evidence predates 1500s; carbon dating of manuscripts.*
  - **Consilience**: Contradicts massive evidence (e.g., Chinese, Arabic records; dendrochronology; archaeology). *Hard Stop: Fails consilience with multiple independent chronologies.*
  - **Replication**: Fomenko's methods have not been replicated by mainstream scholars; criticized for data manipulation. *Hard Stop: No independent verification.*
  - **Verdict**: **Reject** (hard stops on source proximity and consilience). Flag for "how myths form" display: Example of revisionist chronology and its flaws.

  **Pitch 3: Ancient Metallurgists Needed Alien Tutors (Slag-Purity Study Misapplied)**
  - **Initial Scan**: Extraordinary claim (alien intervention). Proceed with caution.
  - **Falsifiability**: Claim that ancient humans couldn't achieve purity without aliens. Potentially falsifiable by demonstrating human methods. But aliens as default explanation for gaps is unfalsifiable. *Hard Stop: Unfalsifiable (aliens as deus ex machina).*
  - **Source Proximity**: Primary evidence is slag remains. Study misapplied? Check the original study: Does it actually say purity is impossible for humans? Likely not; it might describe a technique. Secondary sources: Ancient astronaut theorists. *Flag: Misinterpretation of scientific study.*
  - **Consilience**: Contradicts known human innovation (e.g., independent development of metallurgy worldwide). *Hard Stop: Fails consilience with human capabilities.*
  - **Replication**: Slag studies are replicable, but alien intervention isn't. *Hard Stop: Rejected.*
  - **Verdict**: **Reject** (hard stops). But note: The slag study itself might be valid science; the alien claim is pseudohistory. Could use in a display on "misinterpretation of science in pop culture."

  **Case for "How Myths Form" Display**: 
  - Pitch 1 (Atlantis) is ideal: It's a persistent myth with ancient roots, and the Azores connection shows how modern discoveries get co-opted.

  **Where the Procedure Might Misfire**:
  - **Innovative but Sound Research**: A legitimate challenge to consensus might be rejected at Step 4 (Consilience) if too rigid. *Mitigation: If a pitch passes falsifiability and source checks, send for peer review even if it challenges consensus.*
  - **Emerging Evidence**: Newly discovered sites (e.g., Göbekli Tepe) that initially seem "out of place" might be flagged. *Mitigation: At Step 4, if evidence is novel but robust, don't hard stop—flag for expert review.*
  - **Cultural Sensitivity**: Claims from oral traditions might not have written primary sources. *Mitigation: Adjust Step 3 for non-written histories; consult specialists.*
answer: |-
  Below is a reusable 10-minute screening procedure for evaluating exhibit pitches, designed specifically for your role as an acquisitions editor at a small museum. It translates core principles from the philosophy of history (falsifiability, source proximity, consilience, replication) into actionable steps, with built-in hard stops (automatic rejection points) and values-call flags (cases where an idea has educational value for teaching critical thinking or myth formation, despite being pseudohistorical). 

  The procedure prioritizes efficiency—each step is time-boxed for a 10-minute total review—and clarity. It acknowledges your **role** as a gatekeeper for scholarly integrity, the **stakes** (reputational risk to the museum, public misinformation, and opportunity costs), and where **judgment cannot be removed** (e.g., interpreting ambiguity in evidence or weighing educational value). Judgment is required in Steps 3–5, where you assess context, not just facts.

  ---

  ### **10-Minute Pseudohistory Screening Procedure**
  **Total Time**: 10 minutes per pitch  
  **Tools Needed**: Internet access (for quick fact-checks), institutional database of reputable journals/experts.  
  **Goal**: Quickly identify pseudohistory (fringe ideas masquerading as scholarship) using historical demarcation criteria. Reject harmful or unsalvageable pitches; flag others for educational repurposing.

  #### **Step 1: Initial Claim Scan (1 minute)**  
     - **Ask**: Does the pitch make an extraordinary claim? (e.g., overturns established timelines, invokes non-human agency like aliens, or posits unknown civilizations).  
     - **Check**: If "no," proceed to standard content review (not covered here). If "yes," note the claim and move to Step 2.  
     - **Hard Stop**: Claim promotes hate speech, violence, or harmful conspiracy theories (e.g., Nazi-linked archaeology). Reject immediately.  
     - **Judgment Call**: Your experience defines "extraordinary." When in doubt, err on the side of caution and proceed.  
     - *Stakes*: Prevents wasting time on obvious pseudohistory; protects institutional reputation.

  #### **Step 2: Falsifiability Check (2 minutes)**  
     - **Ask**: Is the core claim testable and falsifiable? Could evidence disprove it? Pseudohistory often avoids falsification (e.g., "the establishment hides the truth").  
     - **Check**: Demand a clear method for verification. Example: "If Atlantis existed, we should find [specific evidence] in [specific location]."  
     - **Hard Stop**: Claim is unfalsifiable (e.g., "aliens erased their traces"). Reject.  
     - **Values-Call Flag**: If falsifiable but evidence is weak, note for potential "myth formation" display (e.g., how unfalsifiable ideas persist).  
     - *Judgment Call*: Deciding if counter-evidence is acknowledged or hand-waved.  
     - *Stakes*: Filters out unserious theories; focuses on ideas open to scrutiny.

  #### **Step 3: Source Proximity & Quality (3 minutes)**  
     - **Ask**: What are the primary sources? How close (time/place) are they to the alleged event? Are secondary sources peer-reviewed or from fringe outlets?  
     - **Check**:  
       - Primary sources: Contemporary texts, artifacts, or data. Demand direct proximity (e.g., a 300 BCE source for 400 BCE event).  
       - Secondary sources: Search authors/journals in databases (e.g., JSTOR). Avoid self-published books, YouTube, or ancient-aliens media.  
       - **Red flags**: Misquoted sources, reliance on outdated/retracted work, or no primary sources.  
     - **Hard Stop**: Central evidence is debunked, fabricated, or misattributed (e.g., the "Bosnian pyramids" were debunked as natural hills). Reject.  
     - **Values-Call Flag**: Sources are genuine but misinterpreted (e.g., Plato read literally vs. allegorically). Flag for "myth formation" potential.  
     - *Judgment Call*: Assessing source credibility when provenance is ambiguous.  
     - *Stakes*: Ensures evidence isn't cherry-picked; avoids legitimizing poor scholarship.

  #### **Step 4: Consilience with Established Chronology (2 minutes)**  
     - **Ask**: Does the claim align with established timelines (e.g., radiocarbon dating, stratigraphy, historical records)? Does it require discarding vast evidence?  
     - **Check**: Compare to consensus chronologies (e.g., UNESCO timelines). Use quick checks:  
       - Archaeology: Does it match artifact layers or migration patterns?  
       - Science: Does it contradict physics/biology (e.g., human-alien hybridization)?  
     - **Hard Stop**: Claim ignores or denies well-replicated evidence (e.g., rejects carbon dating). Reject.  
     - **Values-Call Flag**: Minor anomalies (e.g., an unusual artifact) that don't rewrite history. Flag for expert review.  
     - *Judgment Call*: Balancing openness to new evidence vs. protecting consensus.  
     - *Stakes*: Upholds educational integrity; prevents "garbage in, garbage out" exhibits.

  #### **Step 5: Replication & Scholarly Integration (2 minutes)**  
     - **Ask**: Has the evidence been replicated or independently verified? Is it integrated into broader scholarship?  
     - **Check**:  
       - Replication: Are methods repeatable? (e.g., lab studies must be peer-reviewed).  
       - Integration: Does credible academia engage with it? Search Google Scholar for critiques.  
       - **Red flags**: Only cited by fringe circles; no replication attempts.  
     - **Hard Stop**: Central evidence is unreplicable or widely debunked (e.g., cold fusion). Reject.  
     - **Values-Call Flag**: Method is sound but overinterpreted (e.g., a real study misapplied to "prove" aliens). Flag for "myth formation" display.  
     - *Judgment Call*: Gauging the gap between evidence and interpretation.  
     - *Stakes*: Filters out isolated, unreviewed claims; ensures exhibits reflect reliable knowledge.

  **Final Decision**:  
  - **Reject** if any hard stop triggered.  
  - **Send for peer review** if no hard stops but minor flags (e.g., novel but plausible).  
  - **Flag for educational repurposing** if values-call flags apply (e.g., "how myths form" display).  
  - **Accept for development** only if all steps pass (rare for extraordinary claims).

  ---

  ### **Application to Your Three Pitches**
  We'll run each pitch through the procedure, noting time spent, verdict, and educational repurposing.

  #### **Pitch 1: Literal Plato Atlantis with underwater formations near Azores**  
     - **Step 1 (1 min)**: Extraordinary claim (lost advanced civilization). Proceed.  
     - **Step 2 (2 min)**: Falsifiable? Yes (e.g., "If Atlantis, we'd find human artifacts in Azores formations"). But proponents often dismiss counter-evidence as "eroded." **Flag**: Risk of unfalsifiability.  
     - **Step 3 (3 min)**:  
       - Primary sources: Plato's dialogues (c. 360 BCE)—allegorical, not eyewitness. No physical evidence for Atlantis.  
       - Secondary sources: Often fringe (e.g., TV specials; no peer-reviewed geology).  
       - Underwater formations are natural (geological consensus). **Hard Stop**: Natural features misrepresented as ruins. **Reject**.  
     - *Verdict*: **REJECT** (Hard Stop at Step 3).  
     - **Values-Call Potential**: Strong candidate for "how myths form" display. Plato's allegory inspired centuries of speculation, and the Azores example shows how natural features are misinterpreted. Use in a critical-thinking exhibit.

  #### **Pitch 2: Fomenko's Statistical Chronology (Almagest compiled in the 1500s)**  
     - **Step 1 (1 min)**: Extraordinary claim (re-dates classical astronomy by 1,000 years). Proceed.  
     - **Step 2 (2 min)**: Falsifiable? Yes (e.g., "If Almagest is 16th-century, star positions shouldn't match antiquity"). But Fomenko ignores contrary evidence. **Flag**: Selective falsification.  
     - **Step 3 (3 min)**:  
       - Primary sources: Almagest manuscripts date to 9th-century Arabic copies (carbon-dated), not 1500s. Greek fragments exist from antiquity.  
       - Secondary sources: Fomenko's work is self-published; rejected by peer-reviewed journals. **Hard Stop**: Manuscript evidence directly contradicts the claim. **Reject**.  
     - **Step 4 (2 min)**: Fails consilience—contradicts astronomy (e.g., Ptolemy's star data matches 2nd-century skies), dendrochronology, and textual history. **Hard Stop** (reinforces rejection).  
     - *Verdict*: **REJECT** (Hard Stops at Steps 3–4).  
     - **Values-Call Potential**: Ideal for "myth formation" display on nationalist pseudohistory (Fomenko's goal was to shorten Russian "subordination" to the West). Show how statistics can be misused.

  #### **Pitch 3: Ancient Metallurgists Needed Alien Tutors (slag-purity study misapplied)**  
     - **Step 1 (1 min)**: Extraordinary claim (alien intervention). Proceed.  
     - **Step 2 (2 min)**: Falsifiable? Partially (e.g., "If aliens taught metallurgy, we'd see impossible tech leaps"). But aliens invoked as catch-all for gaps—**Hard Stop**: Unfalsifiable (any counter-evidence "proves" aliens hid it). **Reject**.  
     - **Step 3 (3 min)**: (Still checked post-rejection for educational value):  
       - Primary sources: Slag studies are real but show gradual human innovation (e.g., Bronze Age Cyprus). No alien evidence.  
       - Secondary sources: Likely misapplied—e.g., a real study on slag purity used to "prove" impossibility without aliens. **Values-Call Flag**: Good "myth formation" case for misusing science.  
     - *Verdict*: **REJECT** (Hard Stop at Step 2).  
     - **Values-Call Potential**: Use in a display on "science misinterpretation." Pair the slag study with critiques showing how human ingenuity explains purity.

  ---

  ### **Where Judgment Can't Be Removed & Procedure Misfires**  
  - **Critical Judgment Points**:  
    - Step 3 (source proximity): Ambiguous sources (e.g., oral traditions) require contextual skill.  
    - Step 4 (consilience): New evidence might challenge consensus (e.g., Göbekli Tepe initially seemed "out of place"). You must distinguish innovation from pseudohistory.  
    - Values-call flags: Deciding if a rejected pitch has educational merit depends on museum mission (e.g., "myth formation" displays must avoid legitimizing myths).  
  - **Procedure Misfires**:  
    - **False Negatives**: Legitimate challenges to consensus (e.g., revised dates for the Sphinx) might be rejected at Step 4 if too rigid. *Mitigation*: If a pitch aces Steps 2–3, get a quick peer consult.  
    - **False Positives**: Sophisticated pseudohistory (e.g., well-faked artifacts) might pass Step 3. *Mitigation*: Cross-check with experts for red-flag topics.  
    - **Cultural Bias**: Non-Western evidence (e.g., Indigenous oral histories) may not fit "source proximity" norms. *Mitigation*: Adapt Step 3 to include consultation with cultural specialists.  
    - **Time Limitations**: A 10-minute limit risks overlooking nuances. *Mitigation*: Use hard stops for efficiency; invest time only in values-call cases.  

  This procedure balances rigor and practicality. It protects your museum from reputational harm while allowing educational use of pseudohistory to teach critical thinking. Rejected pitches with values-call flags can be routed to a "Myths and Misinformation" exhibit series—turning liabilities into learning opportunities.
