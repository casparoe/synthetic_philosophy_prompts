  Hmm, the user wants me to adjudicate an argument between Jordan and Sam about judicial review. They were debating whether unelected judges overruling legislatures is anti-democratic, with Jordan defending it as "hidden delegation" to experts and Sam rejecting that concept. I need to break this down into exactly five numbered points as requested, covering specific aspects of their debate.

  First, I need to address Jordan's hidden-delegation claim. Jordan argues that legislatures intentionally write vague constitutional clauses knowing courts will interpret them, making it a form of delegation. But Sam counters that this isn't real delegation because voters didn't authorize it. I think Jordan has a point about legislative intent, but delegation typically requires explicit consent or mechanisms, which are missing here.

