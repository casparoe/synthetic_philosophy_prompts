  We are writing an adversarial collaboration in the style of a double-crux writeup. The two parties are:
  - Single-Hierarchy Realist (SHR): Believes in a unique, mind-independent ranking of classification schemes, with mature sciences approximating it and cross-cutting taxonomies being partial views.
  - Cross-Cutting Pluralist (CCP): Believes in many equally objective, non-nested ways of grouping things for different purposes, and that prioritizing one scale is a projection of practical interests.

  The document has four sections.

  1. **Agreed Claims**: A numbered list of substantive claims both endorse. Include claims about ordinary-language categories, conventional classifications, and predictive success. Also include at least two claims about dialectical moves now considered question-begging or off-limits.

  2. **Residual Disagreements**: A table with 3-5 rows. Each row has a neutrally worded question, then SHR's answer, then CCP's answer. No row should be answerable from the agreed claims alone.

  3. **Cruxes and Tests**: Three to five cruxes, each with a concrete case or predictive test. For each crux, provide the test, each side's prediction, and what result would make them update. Ground in at least: biological species, psychiatric/psychological kinds, and a tight domain (like chemical substances). If they jointly reject one, explain why.

  4. **Dissolved and Surviving Disagreements**: After tabooing central terms (like "natural", "joints", "objective"), replace with what they predict or what counts as evidence. Then state which disagreements dissolve and which 2-3 remain substantive.

  We must word every claim attributing a view so that the side would sign it.

  Let's start with section 1.

  ### 1. Agreed Claims

  Both sides agree on:

  1. **Ordinary-language categories are often messy and context-dependent**: Our everyday categories (e.g., "game", "furniture") are shaped by human interests and may not correspond to the most predictive or fundamental groupings in the natural world.

  2. **Purely conventional classifications exist**: Some classifications (e.g., administrative categories like zip codes) are entirely arbitrary and do not reflect any natural structure; they are created for human convenience.

  3. **Mature scientific taxonomies are predictively successful**: The classification schemes of established sciences (e.g., chemistry, physics) have high predictive power and are not arbitrary in the way conventional classifications are.

  4. **The world has an objective structure that constrains our classifications**: Our classifications are not unconstrained by reality; some groupings work better than others for prediction and explanation because of the way the world is.

  5. **Not all classification schemes are equally good for all purposes**: Some schemes are better suited for certain investigative goals (e.g., predicting chemical reactions vs. ecological interactions).

  6. **Question-begging move off-limits for SHR**: SHR agrees that they cannot argue for their view by simply pointing to the success of a single scientific taxonomy (e.g., the periodic table) and asserting that it must be the unique correct one without addressing why cross-cutting taxonomies in other domains are not equally fundamental.

  7. **Question-begging move off-limits for CCP**: CCP agrees that they cannot argue for their view by pointing to the existence of multiple useful taxonomies in a domain and immediately concluding that there is no fact of the matter about which is more natural without addressing the possibility that one might be more fundamental.

  Now, section 2.

  ### 2. Residual Disagreements

  We need 3-5 well-posed questions that both regard as substantive and not answerable from the agreed claims.

  | Question | Single-Hierarchy Realist's Answer | Cross-Cutting Pluralist's Answer |
  |----------|----------------------------------|----------------------------------|
  | Is there a unique, mind-independent ranking of classification schemes in a given domain (e.g., biology) from more to less natural? | Yes: There is a unique, mind-independent ranking that reflects the intrinsic structure of the world, and the most natural classifications are those that capture the fundamental causal joints. | No: There are many equally natural ways of classifying, each corresponding to different objective structures at different scales or for different causal processes, and no unique ranking. |
  | Do cross-cutting taxonomies in a domain (e.g., species defined by reproductive isolation vs. phylogeny) indicate that at most one can be capturing the real joints? | Yes: Cross-cutting taxonomies cannot both be fully natural; at best, one might be more fundamental and the others are derivative or partial views of the same underlying order. | No: Cross-cutting taxonomies can be equally natural because they track different real patterns that are not reducible to a single hierarchy. |
  | In a domain with a famously tight taxonomy (e.g., chemistry), is the tightness due to the domain having a unique set of joints that are not cross-cut by equally natural alternative groupings? | Yes: The tightness of chemical taxonomy (e.g., the periodic table) arises because the domain has a unique set of fundamental joints that do not admit equally natural cross-cutting alternatives. | No: The tightness is due to the domain being studied at a particular scale and with particular investigative goals; at other scales (e.g., subatomic) or for other purposes (e.g., materials science), equally natural cross-cutting classifications exist. |
  | Can the existence of multiple successful taxonomies in a domain (e.g., psychiatry) be best explained by the domain having multiple, equally natural structures? | No: The existence of multiple taxonomies in a domain like psychiatry suggests that the domain is pre-paradigmatic and we haven't yet found the underlying natural joints. | Yes: Multiple taxonomies are successful because they track different real patterns in the complex domain, and no single set of joints will serve all purposes. |

  We have 4 rows.

  Now, section 3: Cruxes and Tests.

  We must ground in:
  - Biological species delimitation (reproductive isolation, gene-tree history, ecology, morphology)
  - Psychiatric and psychological kinds (clinical course, genetics, symptom structure)
  - One tight domain (chemical substances or stellar types)

  Let's define three cruxes.

  **Crux 1: Biological Species Delimitation**

  - **Test Case**: In a group of organisms (e.g., birds or plants) where reproductive isolation clusters, genetic clusters (from gene trees), ecological niches, and morphological groupings do not perfectly align, can we have multiple equally natural ways of grouping them?
    - **SHR Prediction**: One of these groupings (likely the genetic or reproductive one) will be more fundamental and the others can be explained as derivatives or as operating at a different level within the same hierarchy. If we find that one grouping (e.g., based on gene trees) provides the best foundation for explaining the others and for making the broadest range of successful predictions, then that is the most natural.
    - **CCP Prediction**: Each grouping may be equally natural because they track different causal processes (e.g., reproduction, adaptation, developmental constraints). If we find that each grouping is indispensable for predicting and explaining distinct phenomena (e.g., reproductive grouping for hybridization, ecological for resource competition) and none can be reduced to the others without loss, then they are cross-cutting natural kinds.
    - **Update Conditions**:
      - SHR would update if no one grouping is found to be fundamental and cross-cutting groupings remain equally indispensable for distinct predictive purposes with no reduction in sight.
      - CCP would update if one grouping (e.g., a particular genetic clustering) consistently provides the most fundamental explanations and predictions across all phenomena, making the other groupings appear derivative.

  **Crux 2: Psychiatric and Psychological Kinds**

  - **Test Case**: Consider a psychiatric disorder (e.g., depression) where clinical course (e.g., chronic vs. episodic), genetic risk factors (e.g., polygenic scores), and symptom clusters (e.g., melancholic vs. atypical) do not align perfectly. Can we have multiple equally natural ways of classifying?
    - **SHR Prediction**: There is an underlying natural kind (likely a neurobiological one) that will eventually unify the best taxonomy, and current cross-cutting is due to our ignorance. If future research shows that one taxonomy (e.g., based on genetics) provides a unifying explanation for clinical course and symptom structure, then that is the natural kind.
    - **CCP Prediction**: Different taxonomies (e.g., symptom-based for treatment response, genetic for risk prediction) are independently valuable and track real but distinct causal structures. If research shows that each taxonomy captures unique causal patterns that are not reducible to a single underlying variable, then they are equally natural.
    - **Update Conditions**:
      - SHR would update if after extensive research, no unifying taxonomy emerges and the different groupings remain irreducibly cross-cutting and indispensable for distinct purposes.
      - CCP would update if a single taxonomy (e.g., a neurobiological one) emerges that explains and predicts all the phenomena better than any combination of cross-cutting taxonomies.

  **Crux 3: Tight Domain - Chemical Substances**

  - **Test Case**: In chemistry, the periodic table provides a tight classification. Are there equally natural cross-cutting classifications at different scales or for different purposes?
    - **SHR Prediction**: The periodic table is uniquely natural because it captures the fundamental structure of atoms. Any alternative grouping (e.g., by material properties for engineering) is derivative and less natural. We predict that at the atomic level, no equally natural cross-cutting taxonomy exists.
    - **CCP Prediction**: Even in chemistry, there are cross-cutting natural classifications: for example, the same element can be part of different compounds with very different properties, and classifications by reactivity, phase, or role in biochemical processes are natural for their purposes. We predict that at different scales (e.g., molecular, or for specific applications) equally natural groupings exist that cannot be reduced to the periodic table alone.
    - **Update Conditions**:
      - SHR would update if we find a classification at the same level (atomic) that is equally successful and cross-cutting with the periodic table but not reducible to it.
      - CCP would update if it turns out that all successful chemical classifications (even at other scales) are either reducible to the periodic table or are significantly less fundamental and not equally natural.

  We have three cruxes.

  Now, section 4: Dissolved and Surviving Disagreements.

  First, taboo the central terms:

  - "Natural" / "Joints": Replace with what counts as evidence for it: groupings that support robust, objective, and projectable inferences; groupings that are indispensable for prediction and explanation in a domain; groupings that are not arbitrary and are discovered rather than invented.

  - "Objective": Replace with: not depending on human interests; being mind-independent; being invariant across different perspectives.

  - "Unique ranking": Replace with: one set of groupings being more fundamental than others, such that other groupings can be derived from it without loss of predictive power.

  After tabooing:

  **Dissolved Disagreements**:

  - **Claim about conventional classifications**: Both agree that some classifications are arbitrary (like zip codes) and that they are not projectable. This is not at issue.

  - **Claim that some classifications are better for some purposes**: Both agree that for a given purpose, one classification might be better. This is not the core dispute.

  **Surviving Disagreements** (2-3 irreducibly substantive ones):

  1. **Fundamentality of one classification in a domain**: 
     - SHR: In a given domain, there is one set of groupings that is most fundamental (i.e., it provides the basis for explaining the predictive success of other groupings and cannot be replaced by them without loss of explanatory power).
     - CCP: In a given domain, there can be multiple groupings that are equally fundamental (i.e., each is indispensable for explaining and predicting distinct phenomena, and none can be reduced to the others).

  2. **Generalizability of the tightness in paradigmatic sciences**:
     - SHR: The tightness of classification in domains like chemistry is the model for what we should expect in all domains as science matures; messier domains are just less mature.
     - CCP: The tightness in chemistry is due to the specific scale and properties of that domain and does not generalize; messier domains (like biology or psychology) are not immature but inherently complex and require multiple natural classifications.

  3. **Reducibility of cross-cutting taxonomies**:
     - SHR: Cross-cutting taxonomies are either partial views of the same underlying hierarchy or less natural; they can be reduced to the fundamental one without loss.
     - CCP: Cross-cutting taxonomies are irreducibly distinct and cannot be fully captured by a single hierarchy without loss of predictive power for some phenomena.

  We have three surviving disagreements.

  Now, we compile the document.
answer: |-
  ### Adversarial Collaboration: Single-Hierarchy Realism vs. Cross-Cutting Pluralism  

  **Introduction**  
  This document is the product of an adversarial collaboration between a proponent of single-hierarchy realism (SHR) and a proponent of cross-cutting pluralism (CCP). Our goal is not persuasion but to isolate the cruxes that would update our positions. SHR holds that nature has a unique, mind-independent hierarchy of "joints" (objective divisions), which mature sciences approximate, with cross-cutting taxonomies being partial or derivative. CCP holds that nature supports many equally objective, non-nested ways of grouping entities across scales and purposes, and treating one as uniquely "natural" reflects human priorities. All claims below are worded as each side would endorse them.  

  ---

  ### 1. Agreed Claims  
  Both sides endorse the following substantive claims:  

  1. **Ordinary-language categories are human-centered and messy**: Categories like "weed," "game," or "furniture" are shaped by context-dependent human interests and lack the predictive stability of scientific taxonomies.  
  2. **Purely conventional classifications exist**: Groupings like postal codes, astrological signs, or sports league divisions are arbitrary, lack projectability, and do not reflect objective structure.  
  3. **Mature scientific taxonomies are robustly predictive**: Classifications in physics, chemistry, or geology support high-accuracy, broad-scope predictions (e.g., chemical reactions based on atomic number) that are not artifacts of human convention.  
  4. **Objective structure constrains classification**: The success of scientific taxonomies arises from mind-independent features of the world; we do not invent predictive groupings arbitrarily.  
  5. **Classification utility is purpose-relative**: Some groupings are better suited to specific goals (e.g., ecological niches for conservation, molecular structures for drug design), and no taxonomy serves all purposes equally.  
  6. **Off-limits dialectical move for SHR**: SHR may not presuppose that domains with cross-cutting taxonomies (e.g., psychiatry) are "immature" to argue they will converge on a single hierarchy, as this assumes SHR without evidence.  
  7. **Off-limits dialectical move for CCP**: CCP may not cite the mere existence of multiple useful taxonomies as proof of pluralism, as this ignores that one could be fundamental and others derivative.  

  ---

  ### 2. Residual Disagreements  
  The table below lists unresolved questions. Answers are stated as each side would articulate them, and no question is answerable from Section 1 alone.  

  | Neutrally Worded Question | Single-Hierarchy Realist's Answer | Cross-Cutting Pluralist's Answer |  
  |---------------------------|----------------------------------|----------------------------------|  
  | Is there a unique, mind-independent ranking of classification schemes (from more to less natural) in a given scientific domain? | Yes: The world has a single, privileged hierarchical structure, and alternative taxonomies are either approximations of this hierarchy or contextually useful derivatives. | No: The world supports multiple, equally objective classifications that cannot be ranked uniquely; different groupings reflect distinct causal structures or scales. |  
  | Do cross-cutting taxonomies in a domain (e.g., species defined by reproduction vs. genetics) imply that at most one captures the "real joints"? | Yes: Cross-cutting schemes cannot be equally natural; the most fundamental one (e.g., genetics) explains the others, which are partial or pragmatic simplifications. | No: Cross-cutting schemes can be equally natural; they track irreducibly different causal patterns (e.g., gene flow vs. selection), and none is privileged across all contexts. |  
  | Does the tightness of a taxonomy in a paradigmatic domain (e.g., chemistry) generalize to messier domains (e.g., biology)? | Yes: Domains like chemistry reveal a universal feature of nature—unique joints—and messiness in biology/psychology reflects incomplete science, not ontological plurality. | No: Chemistry's tightness arises from scale-specific phenomena (e.g., atomic structure); messier domains reflect inherent complexity, where multiple cross-cutting structures are equally objective. |  
  | Can predictive success in science be fully explained without a unique hierarchy of natural joints? | No: The unmatched predictive power of mature sciences (e.g., periodic table) requires a uniquely natural hierarchy as its foundation; alternatives are either less successful or reducible. | Yes: Predictive success arises from objective structures at varied scales/grains; no unique hierarchy is needed, as multiple schemes (e.g., species concepts) achieve robust, non-reducible success. |  

  ---

  ### 3. Cruxes and Tests  
  Cruxes are sub-questions where empirical evidence could update one or both sides. For each, we describe a test case, predictions, and update conditions. Tests are grounded in three agreed hard cases:  

  **Crux 1: Biological Species Delimitation**  
  - **Question**: Can reproductive isolation, gene-tree history, ecology, and morphology yield equally natural, non-reducible groupings?  
  - **Test Case**: Study a clade (e.g., *Anolis* lizards) with well-mapped reproductive boundaries, phylogenies, ecological traits, and morphology. Use statistical models to test if one grouping (e.g., genetics) predicts the others with minimal loss, or if all are indispensable for distinct predictions (e.g., hybridization vs. niche adaptation).  
  - **SHR Prediction**: Genetic groupings will explain reproductive/ecological/morphological patterns with near-completeness (e.g., >90% variance captured); alternatives will show high reducibility.  
  - **CCP Prediction**: Each grouping will be indispensable for distinct predictions (e.g., morphology for microhabitat use, genetics for lineage divergence), with significant "cross-prediction" gaps (e.g., <70% variance explained by any one).  
  - **Update Conditions**:  
    - SHR updates if no grouping dominates (e.g., all <70% reducibility) and cross-cutting schemes remain irreplaceable for core predictions.  
    - CCP updates if one grouping subsumes others (e.g., genetics explains >90% of variance in morphology/ecology) across diverse contexts.  

  **Crux 2: Psychiatric and Psychological Kinds**  
  - **Question**: Do clinical course, genetics, and symptom clusters form a unified natural kind or irreducibly cross-cutting kinds?  
  - **Test Case**: Analyze a large dataset (e.g., UK Biobank) of depression cases with longitudinal clinical outcomes, polygenic risk scores, and symptom networks. Test if one taxonomy (e.g., genetics) predicts all aspects (e.g., treatment response, symptom progression) better than cross-cutting models.  
  - **SHR Prediction**: Genetic clusters will show strongest unification (e.g., high AUC in predicting clinical outcomes across subgroups), with symptom/clinical taxonomies largely derivable from genetics.  
  - **CCP Prediction**: Symptom-based taxonomies will best predict treatment response, genetics will best predict risk, and clinical course will best predict relapse—each with unique variance (e.g., ΔAUC >0.1 when forced into a single model).  
  - **Update Conditions**:  
    - SHR updates if genetics fails as a unifier (e.g., <60% AUC for symptom progression) and cross-cutting schemes outperform any unified model.  
    - CCP updates if genetics dominates (e.g., >85% AUC for all outcomes) and alternatives add negligible predictive value.  

  **Crux 3: Chemical Substances as a Test of Generalizability**  
  - **Question**: Is chemistry’s tight taxonomy (e.g., periodic table) generalizable, or is it scale-dependent?  
  - **Test Case**: Examine whether atomic number-based classification subsumes or cross-cuts with groupings for emergent properties (e.g., catalytic behavior in nanoparticles or biochemical roles). Use quantum simulations to test if properties like reactivity are predictable solely from atomic number across scales.  
  - **SHR Prediction**: Atomic number will predict emergent properties with high fidelity (e.g., >95% accuracy); cross-cutting schemes (e.g., by catalytic function) will be reducible to it.  
  - **CCP Prediction**: Emergent properties (e.g., enzyme-like behavior in nanoclusters) will require additional variables (e.g., spatial configuration) and form cross-cutting groupings irreducible to atomic number (e.g., <80% predictability).  
  - **Update Conditions**:  
    - SHR updates if atomic number fails for emergent properties (e.g., <70% predictability in catalysis) and cross-cutting schemes are indispensable.  
    - CCP updates if atomic number predicts emergent properties robustly (e.g., >90%) across scales, leaving no room for equally natural alternatives.  

  ---

  ### 4. Dissolved and Surviving Disagreements  
  We taboo central terms:  
  - "Natural joints" → *Groupings that support robust, projectable inferences across diverse contexts, with minimal conventional input.*  
  - "Objective" → *Not dependent on human interests; invariant under idealized investigation.*  
  - "Unique hierarchy" → *One set of groupings that subsumes all others with minimal predictive loss.*  

  **Dissolved Disagreements**:  
  - **"Science requires a privileged scale"**: After tabooing, both agree that *some groupings yield better predictions for specific goals* (e.g., atomic number for reactions). This was a verbal dispute over "privileged."  
  - **"Conventional vs. natural"**: Both agree that *purely arbitrary groupings lack projectability*, dissolving disputes about edge cases (e.g., "planet" definitions).  

  **Surviving Irreducible Disagreements**:  
  1. **Fundamentality of reduction**:  
     - SHR: *One set of groupings (e.g., genetics) will subsume others with near-complete predictive power across contexts, indicating a universal foundation.*  
     - CCP: *Cross-cutting groupings will remain irreducibly indispensable for distinct predictions, indicating multiple foundations.*  
  2. **Generalizability of "tight" domains**:  
     - SHR: *The predictive dominance of groupings in chemistry will extend to messy domains with further science, revealing universal structure.*  
     - CCP: *Chemistry's success is scale-specific; messy domains will persistently require multiple groupings, reflecting ontological complexity.*  
  3. **Human-independence of ranking**:  
     - SHR: *The best taxonomy minimizes pragmatic trade-offs; if one grouping requires no contextual "tweaks" for maximal predictions, it is uniquely objective.*  
     - CCP: *All groupings involve trade-offs; if none dominates unconditionally, ranking reflects human goals, not mind-independent structure.*  

  ---  
  **Conclusion**  
  We commit to updating based on the tests in Section 3. SHR will reconsider pluralism if cross-cutting groupings prove irreducible in our cases; CCP will reconsider realism if one taxonomy subsumes all others. Future work should explore these cruxes empirically.
