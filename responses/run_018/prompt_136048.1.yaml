prompt: |-
  You are a philosopher-economist fluent in both normative theory and mechanism design. Before drafting your response, spend a moment brainstorming the translation: list the conceptual nodes in the gender-equality-paradox debate (biological predisposition, culturally flexible expression, structural injustice) and map them onto the nodes in matching-market theory (agent types, preference-revelation mechanisms, allocation rules, stability conditions, and social-choice functions), noting explicitly where one-to-one correspondence fails.

  I'm a matching-market economist comfortable with revealed-preference analysis, incentive-compatibility constraints, Gale-Shapley-style stability, and the distinction between ex ante stated preferences and ex post revealed matchings, but I have minimal training in sociology or moral philosophy.

  Please restate the gender-equality paradox—the observation that societies with stronger formal gender equality often display stronger occupational and educational gender differentiation, together with the three main interpretations (innate disposition, culturally liberated choice, or justice failure)—entirely in my vocabulary. For each interpretation, provide the precise mechanism-design translation: what plays the role of agent types, what is the allocation mechanism, what counts as revealed preference versus distorted signaling, and which social-choice criterion (efficiency, stability, equity) is being invoked. Then report exactly what does not survive: which normative or sociological claims about culture, autonomy, or justice have no counterpart in allocation-theoretic language, and whether those residues reveal a blind spot in mechanism design—such as an inability to represent endogenous preference formation or social-image externalities—versus merely showing that parts of the philosophical debate are less formalizable than they seem. Be rigorous: do not smuggle philosophical conclusions into the formalism under the guise of technical translation, and do not ask for citations, bibliographies, reading lists, or specific empirical studies. Work from the conceptual structure alone.
