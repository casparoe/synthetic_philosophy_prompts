answer: |-
  Here is the translation of the gender-equality paradox and its interpretations into matching-market theory vocabulary, adhering strictly to the requested conceptual mapping and identifying residues:

  **Restated Paradox in Market Terms:** In matching markets (e.g., labor markets, educational placements) where institutional constraints on agent type participation/preference expression are exogenously weakened (simulating "formal gender equality"), the observed matching outcomes often exhibit *increased* segregation along the agent type dimension (gender). This contrasts with the naive expectation that reduced constraints would lead to more uniform type distribution across matches.

  **Interpretation 1: Innate Disposition (Biological Predisposition)**
  *   **Agent Types:** Individuals characterized by immutable type vectors. Gender is a salient type dimension correlated with innate, stable preference orderings over match characteristics (e.g., job attributes like "people-oriented" vs. "thing-oriented", work-hour flexibility).
  *   **Allocation Mechanism:** A decentralized or centralized stable matching mechanism (e.g., Gale-Shapley variant) operating under reduced participation/signaling constraints.
  *   **Revealed Preference vs. Distorted Signaling:** Revealed preferences (actual choices/rankings submitted or acted upon) reflect true, innate preferences. Distorted signaling/preference revelation *decreases* under weaker constraints (e.g., less social pressure to misreport preferences). Increased segregation is the *true* stable outcome under revealed preferences.
  *   **Social-Choice Criterion:** **Efficiency/Pareto-Optimality.** The outcome maximizes aggregate welfare given true preferences. Segregation is efficient.
  *   **Residue & Failure of Correspondence:**
      *   *Innate Preferences:* Market theory treats preferences as given primitives. The *origin* (biological) of the systematic type-preference correlation has no representation. The claim that preferences are fixed and inherent disappears into the exogenous type-preference correlation assumption.
      *   *Blind Spot?* Yes. Mechanism design generally takes preferences as exogenous inputs. Endogenous preference *formation* (biological or otherwise) is outside its standard scope.

  **Interpretation 2: Culturally Liberated Choice (Culturally Flexible Expression)**
  *   **Agent Types:** Individuals characterized by mutable type vectors. Gender is a salient type dimension whose cultural expression influences, but does not rigidly determine, preference orderings over match characteristics. Preferences are context-dependent.
  *   **Allocation Mechanism:** A decentralized or centralized stable matching mechanism operating under significantly reduced participation/signaling constraints.
  *   **Revealed Preference vs. Distorted Signaling:** Revealed preferences reflect culturally shaped but *authentic* choices under minimal coercion. Distorted signaling (e.g., suppressing culturally "atypical" preferences) *decreases* under weaker constraints. Increased segregation reflects genuinely diverse preferences flourishing when cultural coercion lessens.
  *   **Social-Choice Criterion:** **Stability & Voluntary Participation.** The outcome is stable (no blocking pairs) and respects individual choice. Autonomy in preference revelation is paramount.
  *   **Residue & Failure of Correspondence:**
      *   *Authenticity/Cultural Influence:* Market theory sees "revealed preference" as definitionally authentic at the moment of choice. The *sociological process* by which culture shapes preferences *before* entry into the market, and the *normative weight* given to "liberated" vs. "coerced" cultural expression, vanish. "Choice" is operationalized only as the absence of explicit market constraints, not internal authenticity.
      *   *Blind Spot?* Partially. While choice is central, MD struggles with preferences formed under *diffuse* social/cultural pressures (not direct market constraints) and lacks tools to distinguish "deep" vs. "superficial" autonomy within revealed choices. Social-image externalities influencing preference reporting are often unmodeled.

  **Interpretation 3: Justice Failure (Structural Injustice)**
  *   **Agent Types:** Individuals characterized by type vectors. Gender is a salient type dimension subject to systemic bias, leading to distorted perceptions of own capabilities/preferences or the value of potential matches.
  *   **Allocation Mechanism:** A matching mechanism with *persistent, hidden* market failures: biased information sets, unequal access to preparation/resources (affecting "quality" signals), or discriminatory counterparty preferences treated as legitimate inputs.
  *   **Revealed Preference vs. Distorted Signaling:** Revealed preferences are *distorted signals* reflecting internalized bias, stereotype threat affecting performance/signaling, or rationally constrained choices under unequal opportunity (e.g., ranking "safe" options due to anticipated discrimination). Increased segregation reveals the *system's failure*, not true preferences.
  *   **Social-Choice Criterion:** **Equity.** The outcome is critiqued based on unequal access to opportunity sets, unfair influence of biased counterparty preferences, or violation of fairness norms (e.g., absence of justified envy based on underlying capability).
  *   **Residue & Failure of Correspondence:**
      *   *Structural Power & Justice:* The concepts of *systemic* injustice, *internalized* oppression, and *illegitimate* preferences (e.g., discriminatory employer rankings) lack direct analogs. Market theory can model biased beliefs or constraints but struggles normatively: when is a preference "illegitimate" if agents are allowed to have them? Justice beyond procedural fairness (e.g., substantive equality of opportunity) exceeds standard efficiency/stability/equity criteria.
      *   *Blind Spot?* Yes. MD struggles with normatively evaluating the *source* of preferences/constraints and defining fair outcomes when agents hold biased beliefs. Representing diffuse societal power structures shaping perceptions and constraints *endogenously* is a major challenge.

  **Summary of What Does Not Survive Translation:**
  1.  **Endogenous Preference Formation:** The *process* by which biology, culture, or injustice *shapes* fundamental preferences before market entry vanishes; preferences are exogenous inputs or distorted outputs, not formed entities.
  2.  **Autonomy (Deep Sense):** The distinction between "authentic" vs. "socialized" self, or "liberated" vs. "coerced" expression, reduces to the presence/absence of observable market constraints on choice/participation.
  3.  **Justice (Structural Sense):** Concepts of systemic power, the illegitimacy of certain preferences based on their origin/social harm, and substantive equality of opportunity lack rigorous formal counterparts within standard allocation rules or social-choice functions.
  4.  **Culture as Meaning System:** Culture's role in providing meaning, identity, and value beyond its effect on constraint sets or preference orderings disappears.
  5.  **Non-Material Factors:** Motivations like social recognition, identity affirmation, or resistance to norms, if not reflected in revealed rankings over tangible match characteristics, are invisible.

  **Residues Reveal:**
  *   **Blind Spots in MD:** The inability to model endogenous preference formation (biological or cultural) and the difficulty in formally incorporating normative judgments about the legitimacy of preferences or defining structural equity beyond procedural rules are clear limitations.
  *   **Limits of Formalization:** Key philosophical concepts – the nature of authentic autonomy, the deep structure of systemic injustice, the lived experience of culture – resist complete capture by the abstract, preference-satisfaction framework of mechanism design. The residues highlight that parts of the debate are inherently less formalizable, concerning foundational questions about human nature, social reality, and normative ideals that precede market mechanics. MD can structure the *consequences* of assumptions about these, but not fully formalize the assumptions themselves or their ultimate justification.
