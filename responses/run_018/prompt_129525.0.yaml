  - Payoff board: a whiteboard or large paper with a grid: rows for players, columns for rounds, and total.

  **Time:**
  - Introduction: 5 min (explain the rules, assign capabilities, no strategy discussion).
  - Round 1: 5 min (decide, collect, compute, update).
  - Round 2: 5 min.
  - Round 3: allow 1 min communication, then 5 min for decision and update.
  - Round 4: 5 min (no communication).
  - Debrief: 30 min.

  Total: 5+5*4+30 = 5+20+30=55 minutes. Then 20 minutes for discussion? We have 75 minutes, so okay.

  **Rules explanation (verbally):**

  "Welcome to the Resource Activation Game. You are part of a team that has access to a shared resource. In each round, you will have the opportunity to activate the resource. 

  - Each of you has a private capability score (on your card). If your capability is 10 or above, you are capable of successfully activating the resource. If it is below 10, you are not.

  - In each round, you will choose to either Act or Restrain.

  - After all choices, we will determine:
     (a) If at least one actor was successful (i.e., had capability>=10), then every player gets 5 tokens (this is the base benefit of having the resource activated).
     (b) Additionally, each actor who succeeded gets 10 extra tokens.
     (c) However, every player (whether they acted or not) loses 3 tokens for every actor in that round. So if there are 4 actors, every player loses 12 tokens.

  - Example: 
     Suppose only one player acts and that player is capable (capability>=10). Then:
        - That player: 5 (base) + 10 (bonus) - 3*1 (cost) = 12 tokens.
        - Every other player: 5 (base) - 3 (cost) = 2 tokens.

     Suppose two players act and both are capable:
        - Each actor: 5+10 - 3*2 = 15-6=9 tokens.
        - Others: 5 - 6 = -1 tokens.

     Suppose a player acts but is not capable (capability<10) and is the only actor:
        - That player: 0 (no base because no success) - 3 = -3 tokens.
        - Others: 0 - 3 = -3 tokens.

  - We will play 4 rounds. In rounds 1, 2, and 4, no talking. In round 3, you will have 1 minute to discuss as a group.

  - Goal: Maximize your own tokens.

  Let me know if you have questions."

  **Handling the first run:**
  - Prediction: In round 1, many capable players will act. The outcome will be bad (negative tokens for many). 
    - Facilitator should just record the results and move to round 2 without comment.
  - In round 2, they might still all act? Or some might restrain? 
    - If some restrain, ask in debrief why? They might say: "I saw that acting when many others act is bad." But then why did they act? They might say: "I thought others might restrain." 
    - Point: even if you think others might act, you are still better off acting? 
  - In round 3 (with communication): they might agree to have only the highest-capability player act. 
    - Then in round 3: if only that player acts, then they get 12 and others get 2. 
    - But what if in round 4 (no communication) they break? 
        - Maybe the chosen one doesn't act? Then no base benefit, and if no one acts, everyone gets 0? Then they might be disappointed. 
        - Or if the chosen one acts, but someone else also acts? Then the chosen one gets 15-6=9 (if two actors) and the other actors get 9, and the rest get -1. 
        - In debrief: why did the agreement break? Because the non-chosen capable players have an incentive to act: they get 9 which is more than 2? So they broke the agreement for personal gain.

  **Final note:** The simulation captures the core of the curse: the dominant strategy to act leads to over-activation when there are many capable agents. The facilitator should close by noting that in real-world scenarios (e.g., launching a new technology, intervening in a crisis) the curse can lead to harmful over-action, and that solutions require institutional mechanisms for coordination and restraint, not just goodwill.
