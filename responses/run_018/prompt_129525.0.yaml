  ### Unilateralist's Curse Simulation: "The Activation Dilemma"

  #### **Overview**
  This simulation models a scenario where multiple agents can unilaterally activate a valuable but collectively harmful intervention. Participants discover through play that individual rationality drives over-activation, worsening outcomes as the number of capable agents increases. The game uses tokens (points) to incentivize behavior, with a payoff structure that rewards successful unilateral action but imposes escalating collective costs.

  ---

  #### **Materials**
  - **Capability cards**: 16 cards with private "capability scores" (numbers 1–16).
  - **Decision slips**: Paper slips for each player to choose "ACT" or "RESTRAIN" each round.
  - **Tokens**: Physical tokens (e.g., poker chips) or a shared Google Sheet for tracking payoffs.
  - **Payoff board**: Visible to all, showing:
    - Payoff rules (fixed throughout game).
    - Real-time token totals per player.
  - **Dice**: For resolving success/failure of actions.

  ---

  ### **Game Setup**
  1. **Assign Roles** (5 minutes):
     - Distribute capability cards randomly (scores 1–16). Players keep scores private.
     - **Threshold for success**: Announce that only players with capability ≥10 can succeed if they act. Others will fail if they act.
     - **Payoff rules** (displayed on board):
       - **Base benefit**: +5 tokens to **all** players if ≥1 actor succeeds.
       - **Success bonus**: +10 tokens to **each actor who succeeds** (capability ≥10).
       - **Collective cost**: −3 tokens **per actor** (regardless of success) from **every player**.  
       *Example: If 4 actors, all players lose 12 tokens (−3 × 4).*

  2. **Player Types**:
     - **High-capability (7 players)**: Scores 10–16 (can succeed if they act).
     - **Low-capability (9 players)**: Scores 1–9 (will fail if they act).

  ---

  ### **Game Rounds** (4 rounds total, 12 minutes)
  **Rules per round**:
  1. **Decision phase** (1 minute):
     - Players secretly write "ACT" or "RESTRAIN" on slips.
     - No communication in Rounds 1, 2, and 4. Round 3 allows 1-minute group discussion.
  2. **Resolution phase** (2 minutes):
     - Facilitator collects slips and announces:
       - Total actors (without naming them).
       - List of actors' capability scores (public).
       - Successes: For each actor with capability ≥10, roll dice (e.g., success on 4–6) to add uncertainty. *Simplify: Skip dice if time short; assume capability ≥10 = automatic success.*
     - Calculate payoffs:
       - Apply base benefit (+5 to all if ≥1 success).
       - Add success bonuses (+10 per successful actor).
       - Subtract collective cost (−3 × total actors from every player).
     - Update payoff board with token totals.

  ---

  ### **Payoff Examples** (Illustrate incentives)
  | Scenario                     | Successful Actor's Payoff | Restraining Player's Payoff | Collective Outcome |
  |------------------------------|---------------------------|------------------------------|---------------------|
  | 1 actor (capable)            | 5 (base) + 10 (bonus) - 3 = **12** | 5 (base) - 3 = **2**       | **Optimal** (high individual/group gains) |
  | 2 actors (both capable)      | 5 + 10 - 6 = **9**        | 5 - 6 = **-1**              | Suboptimal (costs outweigh benefits) |
  | 7 actors (all capable)       | 5 + 10 - 21 = **-6**      | 5 - 21 = **-16**            | **Worst** (net losses for all) |
  | 1 actor (low-capability, fails)| 0 (no base) - 3 = **-3**  | 0 - 3 = **-3**              | Bad (no benefit, high cost) |

  ---

  ### **Predicted Dynamics & Handling Issues**
  - **Round 1**: 
    - **Prediction**: Most high-capability players act. Low-capability players may act (misunderstanding payoff rules). Outcome: Net losses for all.
    - **Handling**: Ask: *"Why did so many act?"* without lecturing. Highlight that capable players got bonuses but net losses due to cost scaling.
    
  - **Round 2**:
    - **Prediction**: High-capability players still act (dominant strategy). Some low-capability players restrain (learn from Round 1).
    - **Handling**: Note: *"Even with losses, acting was rational for high-capability players. Why?"* 

  - **Round 3** (with communication):
    - **Prediction**: Group agrees only 1 player (e.g., highest-capability) acts. But agreement collapses if players distrust others.
    - **Handling**: If defections occur, ask: *"Why was the agreement hard to keep?"* Emphasize lack of enforcement.

  - **Round 4** (no communication):
    - **Prediction**: Back to over-activation. High-capability players fear being "suckered" if they restrain and others act.
    - **Handling**: Compare token totals to Round 3. Ask: *"Did more players acting help or hurt?"*

  ---

  ### **Structured Debrief** (30 minutes)
  **Guided Questions** → **Theoretical Mapping**:
  1. *"What outcome did most players prefer?"*  
     → **Preference ordering**: Players prefer *they* act alone (payoff=12) > *someone else* acts (payoff=2) > *no one* acts (payoff=0) > *many* act (payoff≤−1).  
  2. *"Why couldn’t you sustain restraint agreements?"*  
     → **No credible commitment**: Restraint is individually irrational if you suspect others will act (acting yields 9–12 vs. −1 to 2 if you restrain).  
  3. *"How did increasing capable players (scores 10–16) affect outcomes?"*  
     → **Perverse scaling**: More capable agents = more actors = higher collective cost. Show token totals: 7 actors → −6/−16 vs. 1 actor → 12/2.  
  4. *"When was restraint individually rational? When was it collectively rational?"*  
     → **Tension**: Restraint is *never* individually rational for capable players (acting dominates) but *always* collectively rational if exactly one acts.

  **Facilitator Notes**:
  - **Key insight**: Individual rationality (maximizing tokens) forces over-activation, even when everyone knows it’s collectively harmful.
  - **Real-world analogies**: AI development races, military interventions, or climate geoengineering, where unilateral actions create systemic risks.

  ---

  ### **Limitations & Theoretical Adjustments**
  **What the simulation cannot replicate**:
  - **Infinite-horizon interactions**: Real curse often involves repeated/unknown future interactions (enabling retaliation/trust). Here, rounds are finite and independent.
  - **Common knowledge of rationality**: Players may not grasp that others see the same incentives.
  - **Costly communication**: Free discussion in Round 3 overstates real-world coordination feasibility.

  **Closing Intervention** (5 minutes):  
  *"In reality, the curse arises when agents can’t coordinate, lack future interactions to build trust, and assume others are rational. Here, we had limited rounds and optional communication—but still fell into the trap. Solving it requires binding commitments (e.g., treaties) or delegation to a single actor."*

  ---

  ### **Why This Works**
  - **Discovery-based**: Rules force players to *feel* the curse (e.g., seeing tokens plummet with 7 actors).
  - **Scaling effect**: Capable players (10–16) directly experience how their numbers worsen outcomes.
  - **Low complexity**: Payoffs use simple arithmetic; capability scores create asymmetry without math.
  - **Debrief links play to theory**: Specific game moments map to preference orderings, commitment problems, and scaling.
