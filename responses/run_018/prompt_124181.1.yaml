prompt: |-
  hey, i've been chewing on evidential cooperation in large worlds and i'm kind of over the standard "should you cooperate with your causal twins" framing. before i read another paper on this i want the full spec: what does a theory of cooperation across large worlds actually have to deliver?

  write the desiderata list. each requirement should come with the case or consideration behind it. it needs to handle cooperation with agents in causaly disconnected bubbles who share your reasoning architecture (the usual twin case), but also with "alien mathematicians" -- agents who share your goals but reason with totally different cognitive architectures and might not recognize you as a twin. it must respect the distinction between evidential correlation and actual coordination, and it cant just collapse into causal decision theory because we want to avoid Newcomb-style loops. there's also this thing i call indexical leakage: in a big enough world, updating on your own indexical position leaks information about thier positions, which changes what you should do. the theory has to either absorb that or show its an illusion.

  flag any pair of desiderata you think are jointly unsatisfiable -- especially if one camp demands locality of decision and another demands global evidential consistency across all reasoning-twins. and briefly, how do EDT, functional decision theory, and a naive "cooperate with every reasoning-twin you can model" view score against the list? dont need a bibliography, just the logic.

  make sure you cover which requirements are non-negotiable vs camp preferences.
reasoning: |-
  We are constructing a list of desiderata for a theory of cooperation in large worlds. The theory must handle:
    1. Cooperation with causal twins (same reasoning, causally disconnected).
    2. Cooperation with "alien mathematicians" (same goals, different reasoning architecture, may not recognize you as a twin).
    3. Respect the distinction between evidential correlation and actual coordination (avoid spurious correlations).
    4. Avoid collapsing into Causal Decision Theory (CDT) to handle Newcomb-like problems appropriately.
    5. Address indexical leakage: in large worlds, updating on your own indexical position may leak information about others, affecting decisions.

   Additionally, we must flag any pairs of desiderata that might be jointly unsatisfiable.

   We'll also briefly evaluate:
     - Evidential Decision Theory (EDT)
     - Functional Decision Theory (FDT)
     - Naive "cooperate with every reasoning-twin you can model"

   Let's break down the desiderata:

   Desideratum 1: Twin Cooperation (Non-negotiable)
     - Case: Prisoner's Dilemma with a causal twin in a disconnected bubble. The theory should recommend mutual cooperation.
     - Why: This is the baseline for cooperation in large worlds.

   Desideratum 2: Alien Mathematician Cooperation (Non-negotiable)
     - Case: Suppose there are agents with whom you share goals but who have a completely different cognitive architecture (e.g., they use a different formal system, or even a different model of computation). They might not recognize you as a twin, but if they can reason about you and you about them, cooperation should be possible.
     - Why: We want cooperation to extend beyond exact copies.

   Desideratum 3: Evidential Correlation vs Actual Coordination (Non-negotiable)
     - Case: Avoid situations where two agents are evidential correlates (e.g., both are in a red room) but not actually coordinating. The theory must not recommend cooperation in such cases when coordination is impossible.
     - Why: We want cooperation only when it leads to actual coordination.

   Desideratum 4: Handle Newcomb-like Problems (Non-negotiable)
     - Case: In a Newcomb problem (especially non-transparent cases), the theory should one-box. This means it must not collapse to CDT (which two-boxes and gets less).
     - Why: To show that evidential reasoning can be beneficial.

   Desideratum 5: Indexical Leakage (Non-negotiable? Or maybe negotiable? We'll see.)
     - Case: In a large world with many agents, the fact that you are "you" and are making a decision might provide evidence about the existence and actions of other agents. For example, if you are the only one who would defect, then the fact that you are making a decision might suggest that you are in a world with many cooperators? The theory must either absorb this (i.e., account for it correctly) or show that it is an illusion (i.e., doesn't change the decision).
     - Why: In large worlds, indexical information can be significant.

   Desideratum 6: Locality of Decision (Camp preference? But might conflict with global consistency)
     - Some camps argue that an agent's decision should depend only on local information (i.e., what the agent can observe and reason about without assuming a global view). Others require global evidential consistency across all reasoning-twins.

   Desideratum 7: Global Evidential Consistency (Camp preference)
     - The idea that all reasoning-twins (across the multiverse or large world) should have consistent evidential updates and decisions.

   Now, flag conflicts:

     - Desideratum 6 (Locality) vs Desideratum 7 (Global Consistency): These might be in tension. Locality might require that an agent does not assume that there are other agents exactly like it, especially in a large world where indexical leakage might suggest that there are many others. Global consistency would require that all twins reason the same way and come to the same decision, but if they are in different contexts (due to indexical leakage) then their evidence might differ.

     - Also, Desideratum 5 (Indexical Leakage) might complicate Desideratum 7 (Global Consistency) because different agents might have different indexical information.

     - Another potential conflict: Desideratum 3 (Evidential Correlation vs Actual Coordination) and Desideratum 2 (Alien Mathematician). How do we ensure that we are actually coordinating with the alien without a shared causal channel? We might have to rely on evidential correlation, but that could lead to spurious correlations.

   Let's write the list of desiderata:

     D1 (Twin Cooperation): The theory must recommend cooperation with causal twins (i.e., agents with the same decision algorithm) in situations like the Prisoner's Dilemma, even when causally disconnected.

     D2 (Alien Cooperation): The theory must recommend cooperation with agents that share the same goals but have a different reasoning architecture (alien mathematicians) when mutual cooperation is possible and beneficial, even if they don't recognize the agent as a twin.

     D3 (No Spurious Correlation): The theory must not recommend cooperation based solely on evidential correlation when actual coordination is impossible (e.g., when the other agent's action is fixed and cannot be influenced by the decision).

     D4 (Newcomb Compliance): The theory must one-box in Newcomb's problem, thus avoiding the CDT failure.

     D5 (Indexical Leakage Handling): The theory must correctly account for the information leaked by the agent's own indexical position in a large world, or show that such leakage does not affect the decision.

     D6 (Locality - Camp Preference): The decision procedure should depend only on locally available information (the agent's own state and what it can infer from its environment).

     D7 (Global Consistency - Camp Preference): The theory should ensure that all reasoning-twins (across the large world) make decisions that are consistent with each other in a global evidential frame.

   Now, evaluate existing theories:

     EDT (Evidential Decision Theory):
       - D1: May cooperate with twins in PD if it believes that its action is evidence of the twin's action (via correlation). But in the standard twin setup, it does work. So: Satisfies.
       - D2: Unlikely to cooperate with alien mathematicians because EDT relies on evidential correlations. If the alien's decision process is so different that there's no evidential link, EDT might not see a correlation. Fails D2.
       - D3: Fails: EDT can be misled by spurious correlations (e.g., the smoking lesion problem). So it might cooperate when it shouldn't.
       - D4: Satisfies: EDT one-boxes in Newcomb.
       - D5: Might have issues: In large worlds, EDT might update on indexical information in a way that leads to incorrect decisions (e.g., if there are many defectors, then being a cooperator might be evidence that you are in a world with few cooperators? This is complex and context-dependent). Unclear, but often criticized for indexical issues.
       - D6: EDT is local in the sense that it conditions on the agent's own action and current knowledge. Satisfies.
       - D7: Not designed for global consistency; each agent conditions on its own local evidence. Might not satisfy.

     FDT (Functional Decision Theory):
       - D1: Satisfies: FDT cooperates with twins by considering the output of its own decision function in the twin's situation.
       - D2: Designed to handle alien mathematicians? FDT considers the output of the function that the alien is implementing. If the alien is implementing a function that is "cooperate if FDT cooperates", then FDT cooperates. But if the alien is using a completely different function that FDT cannot recognize, then it might fail. However, FDT can model the alien's function if it can be described. So it might partially satisfy, but not perfectly if the alien's function is inscrutable.
       - D3: Satisfies: FDT only cooperates when the other agent's action is a function of the agent's own action (so coordination is possible). It avoids spurious correlations because it doesn't rely on correlation but on functional dependence.
       - D4: Satisfies: FDT one-boxes in Newcomb because it considers the prediction as a function of its decision.
       - D5: FDT has been extended to handle large worlds (e.g., with the notion of "subjunctive dependency"). However, indexical leakage might be an issue. For example, in the Absent-Minded Driver, FDT-like reasoning can be tricky. But generally, FDT tries to condition on the decision function rather than indexical information. Might need more development, but aims to satisfy.
       - D6: FDT requires the agent to have a model of its own decision function and others'. This model might require non-local information (e.g., what function it is implementing). So it might violate strict locality.
       - D7: FDT by design has global consistency: all instances of the same decision function will make the same decision. So it satisfies.

     Naive "cooperate with every reasoning-twin you can model":
       - D1: Satisfies.
       - D2: If you can model the alien, then you cooperate. But if the alien doesn't model you correctly, you might get exploited. So it might lead to exploitation and fail to achieve mutual cooperation. Also, if you model an agent as a twin but it isn't, you might cooperate when they defect. So fails D2 and D3.
       - D3: Fails: if you model an agent that is actually fixed (e.g., a rock that you mistakenly model as a reasoning twin), then you might cooperate and lose.
       - D4: Unlikely to satisfy: in Newcomb, if the predictor is not modeled as a reasoning twin, then the naive view might not one-box. But if the predictor is modeled as a twin (even though it's not) then it might one-box. Inconsistent.
       - D5: Doesn't address: it just cooperates with any twin it can model, regardless of indexical issues. Might lead to incorrect decisions in large worlds (e.g., if there are many defectors and you cooperate with all, you lose).
       - D6: It depends on what you can model. If modeling requires global information, then it violates locality. But if modeling is local, then it might be local. Unclear.
       - D7: Not addressed: the naive view doesn't enforce global consistency.

   Non-negotiable vs Camp Preferences:

     D1, D2, D3, D4, D5: Non-negotiable (as per the problem statement, though D5 might be debatable).
     D6 and D7: Camp preferences.

   Conclusion on conflicts:

     The main conflict is between D6 (Locality) and D7 (Global Consistency). FDT satisfies D7 but at the cost of requiring a global view of the decision function. EDT is more local but fails global consistency. Also, D2 (Alien Cooperation) and D3 (No Spurious Correlation) might be in tension: how do we ensure that we are actually coordinating with an alien without a causal link? We must rely on some form of mutual reasoning, but without a shared framework, this is hard.

     Additionally, D5 (Indexical Leakage) might conflict with D7 because in a large world, indexical information breaks the symmetry required for global consistency.

     We must note that no current theory perfectly satisfies all non-negotiable desiderata, but FDT comes closest. However, FDT's handling of alien mathematicians and indexical leakage is still an area of research.

     Let me know if you want more details on any point.
answer: |-
  Here's a comprehensive desiderata list for a theory of cooperation in large worlds, distilled from your requirements. I've flagged conflicts and evaluated existing approaches:

  ---

  ### **Core Desiderata (Non-Negotiable)**  
  1. **Twin Cooperation in Causal Bubbles**  
     *Requirement:* Cooperate with identical reasoning agents in causally disconnected regions (e.g., PD with copies).  
     *Case:* If your twin reasons identically, mutual cooperation must dominate despite no causal link.  

  2. **Alien Mathematician Cooperation**  
     *Requirement:* Cooperate with goal-aligned agents using *different cognitive architectures*, even if they don’t recognize you as a "twin".  
     *Case:* An agent using category theory proofs that converge with your set-theoretic solutions to the same problem.  

  3. **Evidential/Coordination Distinction**  
     *Requirement:* Avoid mistaking spurious correlations for coordination opportunities.  
     *Case:* Two agents in red rooms (evidential correlation) with no way to influence each other → no cooperation.  

  4. **Newcomb Compliance**  
     *Requirement:* One-box in Newcomb’s Problem (e.g., $1M prize dependent on prediction).  
     *Case:* Reject CDT’s self-undermining two-boxing while avoiding fatalism.  

  5. **Indexical Leakage Robustness**  
     *Requirement:* Handle information leaks from self-locating beliefs in large worlds.  
     *Case:* In a universe with 99% defectors, being "you" implies you’re more likely to be in a cooperative cluster (anthropics).  

  ---

  ### **Camp-Specific Desiderata (Negotiable)**  
  6. **Locality of Decision (Causal Fundamentalist Preference)**  
     *Requirement:* Decisions use only locally observable data (no privileged access to "global" structures).  
     *Case:* An agent in a sealed bubble shouldn’t need to compute the entire multiverse to act.  

  7. **Global Evidential Consistency (Coordination Idealist Preference)**  
     *Requirement:* All reasoning twins must share identical evidential updates/decisions *modulo indexicals*.  
     *Case:* If twins observe different data, their decisions should still cohere under a unified causal-evidential model.  

  ---

  ### **Flagged Conflicts**  
  - **Locality (D6) vs. Global Consistency (D7):**  
    *Conflict:* Locality forbids agents from assuming global symmetries (e.g., "all twins reason identically"), but global consistency *requires* this symmetry. Indexical leakage (D5) exacerbates this: if your position leaks information about others, local decisions become globally inconsistent.  
    *Example:* In a fractal universe, locality might compel defection (local evidence suggests twins are rare), while global consistency demands cooperation (twins *must* reason identically). **Likely jointly unsatisfiable.**  

  - **Alien Mathematicians (D2) vs. Evidential/Coordination Distinction (D3):**  
    *Tension:* Aliens may not signal recognizability, raising spurious correlation risks. A theory must distinguish "true coordination" (e.g., Löbian handshakes) from coincidental goal alignment.  

  ---

  ### **Theory Evaluations**  
  | Desideratum               | EDT                          | FDT                          | Naive Twin Cooperation       |  
  |---------------------------|------------------------------|------------------------------|------------------------------|  
  | **D1 (Twin Cooperation)** | ✅ (Correlates actions)      | ✅ (Simulates outputs)       | ✅ (Explicit goal)           |  
  | **D2 (Aliens)**           | ❌ (Fails without correlation)| ⚠️ (If goals+outputs align) | ❌ (Only if modeled as twin) |  
  | **D3 (No Spurious Corr.)**| ❌ (Smoking Lesion failure)   | ✅ (Output-based dependency) | ❌ (Cooperates with rocks)   |  
  | **D4 (Newcomb Compliance)**| ✅ (One-boxes)               | ✅ (One-boxes)               | ⚠️ (Only if modeled)        |  
  | **D5 (Indexical Leakage)** | ❌ (Self-locating disasters) | ⚠️ (Partial w/ updatelessness)| ❌ (Ignores leakage)         |  
  | **D6 (Locality)**         | ✅ (Conditions on local info) | ❌ (Requires algorithm access)| ⚠️ (Local but myopic)       |  
  | **D7 (Global Consistency)**| ❌ (Fragile under indexicals) | ✅ (Built-in)                | ❌ (No consistency mechanism)|  

  - **EDT:** Fails D2/D3/D5/D7. Correlations aren’t coordination; self-locating updates cause chaos.  
  - **FDT:** Best at D1/D3/D4/D7. Struggles with D2 (aliens with inscrutable algorithms) and D5/D6 (computational locality vs. updatelessness tradeoffs).  
  - **Naive Twin:** Fails D2/D3/D5. Cooperates indiscriminately with anything labeled "twin", ignoring aliens/spurious correlations/indexicals.  

  ---

  ### **Key Tensions**  
  - **D2 (Aliens) + D3 (Coordination) + D5 (Indexical):** Alien cooperation requires robust symbolic alignment (e.g., "I cooperate if you cooperate" as a fixed point across architectures), but indexical leaks may break symmetry.  
  - **D4 (Newcomb) + D6 (Locality):** Newcomb requires counterfactual control over predictors, violating locality if the predictor is "outside" the causal bubble.  

  **Bottom Line:** A viable theory must solve **symbolic alignment** (D2/D3) and **anthropic consistency** (D5) without assuming global symmetries (D7) or sacrificing locality (D6). FDT currently comes closest but stumbles on alien reasoning and indexicals.
