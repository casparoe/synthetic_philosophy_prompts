answer: |-
  ### **Willowbrook's Orphaned Fences: A Role-Play on Chesterton's Fence**  
  *British English used throughout*

  ---

  #### **OVERVIEW**  
  Students inherit **Willowbrook**, a fictional town governed by bizarre, archaic planning rules. The activity simulates Chesterton's epistemic asymmetry: reformers see only the cost of maintaining "pointless" rules, while stewards grasp fragments of their original purpose—though generational turnover has orphaned key reasons. Interdependent rules ensure unforeseen consequences when scrapped. No pre-reading required.

  ---

  #### **MATERIALS**  
  - **Rule Sheets** (1 per student)  
  - **Role Cards** (asymmetric info for reformers/stewards)  
  - **Ballots** (for voting)  
  - **Consequence Cards** (hidden until voting ends)  

  ---

  ### **RULES OF WILLOWBROOK**  
  *Seemingly nonsensical planning code:*  
  1. **Blue Paint Ban:** No buildings may be painted blue.  
  2. **Thatched Roof Requirement:** All new buildings must have thatched roofs.  
  3. **Two-Story Limit:** No building may exceed two stories.  
  4. **Pub Curfew:** Pubs must close by 10 PM.  
  5. **Wooden Fences Only:** Metal fences are prohibited.  
  6. **Basement Mandate:** All homes must have basements.  
  7. **Market Square Silence:** No loud noises in the market square before noon.  

  ---

  ### **ROLES & INCENTIVES**  
  Split students into **7 reformers** and **7 stewards** (adjust for 14 players).  

  | **Role**      | **Goal**                                                                 | **Points System**                                                                                               |  
  |---------------|--------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------|  
  | **Reformers** | Scrap "burdensome" rules to modernise Willowbrook.                       | +10 pts per rule removed. **-5 pts per catastrophe** triggered.                                                 |  
  | **Stewards**  | Preserve rules; avoid unintended collapse.                               | +5 pts per rule kept. **+10 pts per catastrophe avoided**. Lose nothing if catastrophes occur (but gain for prevention). |  

  ---

  ### **ASYMMETRIC INFORMATION**  
  *Private role cards reveal partial/orphaned knowledge. Some reasons are lost to history.*  

  #### **Steward Cards (Fragments of Wisdom):**  
  - *Rule 1 (Blue Paint):* *"Blue paint angered the birds in my grandad’s day."*  
  - *Rule 2 (Thatched Roofs):* *"Thatch stops fire spreading. Saw it myself in '67."*  
  - *Rule 3 (Two Stories):* *"Old mine shafts under High Street—don’t build heavy."*  
  - *Rule 5 (Wooden Fences):* *"Metal fences rusted and collapsed in floods."*  
  - *Rule 6 (Basements):* *"Basements stored grain during the Great Frost."*  
  - *Rules 4 & 7:* **Orphaned** (no steward has any info).  

  #### **Reformer Cards (Complaints):**  
  - *Rule 1:* *"I own a blue paint factory! This rule bankrupts me."*  
  - *Rule 2:* *"Thatch costs triple tiles. Why not let us choose?"*  
  - *Rule 3:* *"I need a third story for my family. This is oppressive!"*  
  - *Rule 4:* *"My pub loses £500/night closing early."*  
  - *Rule 7:* *"Morning street music draws tourists. This kills trade!"*  
  - *Rules 5 & 6:* **No complaints** (seem harmless but costly to maintain).  

  ---

  ### **TIMELINE (60 MINUTES)**  

  #### **1. Introduction (5 mins)**  
  - Explain Willowbrook’s context: *"You’ve inherited a town with odd rules. Some are centuries old; reasons are lost. Reformers want efficiency, stewards fear unintended collapse."*  
  - Assign roles and hand out **Rule Sheets** + **Role Cards**.  

  #### **2. Study Phase (10 mins)**  
  - Players review rules and private info. **Key constraint:** They may *share* card details verbally but **cannot show cards to others**. Stewards don’t know which rules are orphaned.  

  #### **3. Debate (20 mins)**  
  - Open discussion. Reformers argue for removal ("*Rule 7 kills tourism!*"); stewards defend with fragments ("*Thatch stops fires!*").  
  - **Facilitator prompt:** *"Remember: Willowbrook’s founders are long dead. Can you be sure why these rules exist?"*  

  #### **4. Voting (5 mins)**  
  - Secret ballot on **each rule**. Majority vote decides removal (>7 votes).  
  - Tally results publicly.  

  #### **5. Consequence Round (10 mins)**  
  - Reveal **interdependencies** via Consequence Cards. For each removed rule, announce knock-on effects:  
    - **Scrap Rule 1 (Blue Paint):** *"Devil birds return—they hate blue. They nest in thatched roofs (Rule 2), causing fires even if Rule 2 is kept!"* → **Fire catastrophe.**  
    - **Scrap Rule 3 (Two Stories):** *"Heavy buildings collapse old mine shafts. Basements (Rule 6) flood as the water table shifts."* → **Flood catastrophe.**  
    - **Scrap Rule 5 (Wooden Fences):** *"Metal fences corrode, poisoning soil. Crops fail—except in basements (Rule 6), now critical for food."*  
      - *If Rule 6 kept:* Basements save town from famine (no catastrophe).  
      - *If Rule 6 also scrapped:* **Famine catastrophe.**  
    - **Scrap Rule 7 (Market Silence):** *"Noise drives bats away. Mosquitoes swarm, spreading disease."* → **Disease catastrophe.**  
  - Award points based on outcomes.  

  #### **6. Debrief (10 mins)**  
  Guide discussion using:  
  - **Chesterton’s Fence:** *"Why might Willowbrook’s founders have built these ‘fences’? Did removal feel cheaper than discovering their purpose?"*  
  - **Burkean Caution:** *"Did stewards embody Burke’s ‘wisdom of ancestors’? Did reformers underestimate social complexity?"*  
  - **Epistemic Asymmetry:** *"Complaints were loud and visible (blue paint costs). Catastrophes were silent until triggered. Why is diagnosing a rule’s purpose harder than attacking it?"*  

  ---

  ### **DESIGN NOTES**  

  #### **Conservative Argument the Game Can’t Capture**  
  *"The activity frames rules instrumentally (they prevent fires/famines). In reality, Burkean conservatism also values tradition as a social glue—even without ‘reasons’. Scrapping a rule might corrode trust or identity, not just cause material collapse. This intangible decay is hard to gamify."*  

  #### **Predictable First-Run Issues**  
  - **Reformers will scrap Rule 7 (Market Silence):** Orphaned and unpopular, its link to bats/disease is unforeseeable.  
  - **Stewards will under-defend Rule 5 (Wooden Fences):** With only a vague rust fragment, they’ll prioritise rules with clearer stakes (e.g., Rule 2’s fire).  
  - **Voting chaos:** Students may haggle ("*Trade Rule 4 for Rule 1!*")—let them. The consequence round humbles hasty deals.  

  ---

  ### **OUTCOME**  
  Students viscerally grasp **three lessons**:  
  1. **Knocking down fences is cheap; rebuilding them is costly** (points drop when catastrophes hit).  
  2. **Asymmetric knowledge favours conservatism** (stewards’ fragments beat reformers’ complaints if players vote cautiously).  
  3. **Interdependencies punish haste** (removing Rule 3 collapses Rule 6’s function).  

  This mirrors Chesterton’s core thesis: *"Don’t remove a fence until you know why it was built—even if the builder is gone."*  

  ---  
  **Facilitator Tip:** If students scrap all rules, unleash every catastrophe. The resulting "town collapse" sharpens the debrief ("*Willowbrook needed fences you never saw*").
