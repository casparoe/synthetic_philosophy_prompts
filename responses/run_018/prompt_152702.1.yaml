       50-60 min: Debrief

          - Have the players calculate their scores (if time) or just discuss the experience.

          - Map to Burke and Chesterton:
              - Burke: Warned against radical reform because of the accumulated wisdom of the past. The game shows that rules that seem arbitrary might be there for reasons we don't understand.
              - Chesterton's fence: The fence (rule) shouldn't be removed until we understand why it was put there. In the game, they didn't have the full picture and removed rules without understanding the consequences.

          - Discuss the epistemic asymmetry: 
              - Reformers: It's easy to see the cost of the rule (complaints) and push for removal.
              - Stewards: They had fragments of reasons, but not the full picture. Even they didn't know the interdependencies.

          - What the game can't reproduce:
              - The game shows immediate catastrophic consequences. In reality, the costs of removing a rule might be long-term and diffuse (e.g., loss of social cohesion, slow decline). 
              - Also, in reality, we might be able to study the rule and gradually understand it (whereas in the game, they had no time for research). The game forces a quick decision.

          - What will go wrong the first time:
              - Players might not engage in role-play and might vote without debate.
              - The reformers might remove all rules and then suffer many catastrophes, but that's the lesson.
              - The stewards might not share their fragments effectively (or might share too much and break the asymmetry).
              - Time management: the discussion might run over.

     We'll write the materials in British English.

     Let's draft the handouts.

     Rule Sheet (for all):

          TOWN OF WILLOWBROOK: PLANNING CODE

          The following rules are part of the town's charter and must be followed for any new construction or alteration:

          1. Colour Prohibition: No building may be painted blue.
          2. Roof Requirement: All new buildings must have a thatched roof.
          3. Height Restriction: No building may exceed two stories in height.
          4. Public House Hours: All public houses (pubs) must close by 10 PM.
          5. Fencing Material: All fences must be made of wood; metal fences are prohibited.

     Steward Role Card (each steward gets one):

          [Header:] ROLE: STEWARD OF WILLOWBROOK

          You are a steward of the town, entrusted with preserving the wisdom of the past. Your family has lived in Willowbrook for generations, and you feel a deep responsibility to maintain the town's unique character and safety.

          GOAL:
            - You will gain 5 points for each rule that is kept (not removed).
            - You will gain 10 points for each catastrophe that is avoided. The possible catastrophes are: 
                 * Bird infestation
                 * Fire
                 * Building collapse
                 * Disease outbreak
                 * Flooding

          PRIVATE INFORMATION:
            [Here insert one of the fragments below]

          FRAGMENTS (assign one per steward, with duplicates for rules 1 and 3):

            Rule 1: "Old Tom once said that blue paint brought the devil birds."
            Rule 1: "A travelling salesman tried to sell blue paint once, and the next year the crops failed."
            Rule 2: "Remember the Great Fire of 1782? Thatched roofs saved us then."
            Rule 3: "The ground isn't what it used to be."
            Rule 3: "Old maps show that the town centre is built over old mine shafts."
            Rule 4: "The bats, remember the bats! They keep the mosquitoes down."
            Rule 5: "Wood is the way."

     Reformer Role Card (each reformer gets one):

          [Header:] ROLE: REFORMER OF WILLOWBROOK

          You are a reformer, advocating for modernisation and reducing unnecessary burdens on the townsfolk. You believe these old rules are hindering progress and causing frustration.

          GOAL:
            - You will gain 10 points for each rule that is removed.
            - You will lose 5 points for each catastrophe that occurs. The possible catastrophes are: 
                 * Bird infestation
                 * Fire
                 * Building collapse
                 * Disease outbreak
                 * Flooding

          PRIVATE INFORMATION (a complaint from a citizen):
            [Here insert one of the complaints below]

          COMPLAINTS:

            Rule 1: "I want to paint my house blue! It's my favourite colour."
            Rule 1: "Blue paint is on sale at half price, but I can't use it. This is costing me money."
            Rule 2: "Thatched roofs are expensive and hard to maintain. Why can't we use tile?"
            Rule 2: "Thatchers are in short supply, and I've been waiting six months for my roof repair."
            Rule 3: "I need three stories for my growing family. This rule is suffocating!"
            Rule 4: "I run a pub and I lose money by closing early. The night trade is where the profit is."
            Rule 5: "Metal fences are cheaper and last longer. Why force us to use wood?"

     Ballot:

          Rule 1: [ ] Remove   [ ] Keep
          Rule 2: [ ] Remove   [ ] Keep
          Rule 3: [ ] Remove   [ ] Keep
          Rule 4: [ ] Remove   [ ] Keep
          Rule 5: [ ] Remove   [ ] Keep

     Consequence Round Script:

          "Let's see what happened in Willowbrook after the rule changes..."

          For Rule 1: If removed, "Bird infestation! Swarms of devil birds descend on the town, destroying crops and making a mess."
          For Rule 2: If removed, "A fire breaks out in the town centre! Without the fire-resistant thatched roofs, the fire spreads rapidly."
          For Rule 3: If removed, "A building collapses! Without the two-story limit, a new three-story building topples over." 
            BUT if Rule 5 was removed (even if Rule 3 was kept): "Additionally, due to the flooding caused by removing Rule 5, the ground becomes unstable and a building collapses despite the two-story limit still being in place."
          For Rule 4: If removed, "Disease outbreak! Mosquitoes multiply and spread a rare fever."
          For Rule 5: If removed, "Flooding! Heavy rains cause the river to overflow, and without the wooden fences, the water system fails, leading to widespread flooding. Also, the flooding causes a building collapse (even if Rule 3 was kept)."

          Note: For building collapse (C), if Rule 3 was removed OR Rule 5 was removed, then it occurs. We announce it once.

     Debrief:

          Key points:
            - Chesterton's fence: The rules were like fences. They were not understood (especially Rule 5) but had hidden purposes and interdependencies.
            - Epistemic asymmetry: The reformers had complaints (visible costs) but the stewards only had fragments of the reasons. The full picture was lost to history.
            - The vote was taken without full knowledge, leading to unintended consequences.

          Conservative argument the game can't reproduce:
            - The game focuses on functional, instrumental reasons for rules (avoiding disasters). But in reality, rules might have non-instrumental value (tradition, symbolic meaning) or they might support complex social systems that aren't about avoiding a single disaster. The game reduces everything to catastrophe avoidance.

          Predictable first-run issues:
            - The reformers might remove Rule 5 (because it has weak complaints and the steward fragment is vague) and then suffer double catastrophe. That's a good lesson.
            - Time pressure might lead to hasty decisions.
            - Some players might not take their roles seriously.

     We'll run it and see.

