prompt: |-
  As a software engineer with no formal philosophy background, I have been trying to apply ideas from system architecture—layered abstractions, dependency preservation, and refactoring—to scientific explanation, and I keep encountering the distinction between legitimate bottom-up cranes, unexplained skyhook causation, and greedy reductionism that eliminates intermediate structures entirely. Before I commit to using this framing for evolutionary or cognitive explanation, I need the full specification of what an adequate theory of explanatory reduction in complex adaptive systems must actually deliver.

  Write exactly five desiderata, each clustering the core requirements—phenomena it must explain, distinctions it must preserve (such as downward causation versus mere implementation), consistency conditions with evolutionary biology, and the boundary conditions that separate cranes from skyhooks—together with the motivating case or thought experiment behind each cluster; mark each as non-negotiable or camp-specific, and state which single desideratum eliminates the most competing accounts. Present this as a numbered list with exactly five items, each one to two sentences long, with no introduction and no conclusion.
reasoning: |-
  Hmm, the user is a software engineer with no formal philosophy background, trying to apply system architecture concepts like layered abstractions and dependency preservation to scientific explanation. They're specifically focused on evolutionary and cognitive systems, and they're encountering concepts like bottom-up cranes (legitimate explanations), skyhooks (unexplained causation), and greedy reductionism (ignoring intermediate structures). They want exactly five desiderata for an adequate theory of explanatory reduction in complex adaptive systems.

  I need to create five concise desiderata, each covering core requirements: phenomena to explain, distinctions to preserve (like downward causation vs. mere implementation), consistency with evolutionary biology, and boundary conditions separating cranes from skyhooks. Each must include a motivating case or thought experiment, be marked as non-negotiable or camp-specific, and identify which desideratum eliminates the most competing accounts. The response should be a numbered list, no intro or conclusion, with each item one to two sentences long.

  Breaking down the key elements: Cranes represent step-by-step, naturalistic explanations; skyhooks are unexplained top-down causes; greedy reductionism oversimplifies by skipping levels. The theory must handle emergence, downward causation without violating physics, and fit with evolutionary principles.

  For the desiderata, I need to cluster requirements logically. Starting with non-negotiable ones: The first should ensure that explanations are grounded in gradual, historical processes to avoid skyhooks, using something like the evolution of the eye as a case—this eliminates supernatural or top-down accounts. The second must preserve intermediate structures to prevent greedy reductionism, using cognitive science examples like consciousness reduction. Third, allow for downward causation without magic, inspired by evolutionary feedback loops. Fourth, ensure consistency with evolution, such as with altruism. Fifth, define boundaries for cranes, like irreducible complexity debates.

  I'll make the first desideratum non-negotiable and the one that eliminates the most competitors, as it directly targets skyhooks by demanding step-by-step mechanisms. Others might be less absolute but still critical. For instance, the second desideratum is non-negotiable for avoiding oversimplification, while the fifth could be camp-specific since boundaries might vary.

  Motivating cases: Use the eye for historical paths, consciousness for levels, predator-prey dynamics for downward causation, altruism for biological consistency, and bacterial flagellum for crane-skyhook boundaries.

  Now, phrasing each in one to two sentences: Keep it tight and focused. For example: "Must explain complex adaptations via incremental, historically attested steps... Case: Evolution of the vertebrate eye..." Mark each as non-negotiable or camp-specific. Finally, state that desideratum #1 eliminates the most accounts, as it forces mechanisms over top-down explanations.

  This approach should give the user a clear, actionable framework for their engineering-inspired philosophy.
answer: |-
  1.  Must explain complex adaptations solely via incremental, historically attested steps operating under known physical laws, explicitly prohibiting top-down initiation or guidance lacking mechanistic precedent (*Case: Evolution of the vertebrate eye demonstrating cumulative selection*); **Non-negotiable**, and **this desideratum eliminates the most competing accounts** (e.g., intelligent design, vitalism, strong emergence as skyhooks).
  2.  Must preserve and explain the causal efficacy of distinct functional levels (e.g., organism, organ, cell) without eliminating them ("greedy reductionism"), showing how higher-level properties constrain and are implemented by lower levels (*Case: Explaining conscious decision-making requires neural circuits, not just quarks*); **Non-negotiable**.
  3.  Must accommodate genuine "downward causation" where higher-level system states (e.g., ecosystem structure, organism behavior) exert selective pressure altering lower-level components (e.g., gene frequencies), while remaining fully implemented by bottom-up processes (*Case: Predator-prey dynamics selecting for camouflage genes*); **Non-negotiable**.
  4.  Must be consistent with core evolutionary principles (variation, inheritance, selection) across biological scales, explaining how novel functions and structures arise *de novo* without pre-existing teleology (*Case: Evolution of altruism via kin selection, not group "intent"*); **Non-negotiable**.
  5.  Must provide clear boundary conditions identifying when a proposed "crane" (e.g., a specific selective pressure or self-organizing process) becomes a "skyhook" (an unexplained cause), particularly for seemingly irreducible systems, demanding plausible historical pathways (*Case: Assessing claims of irreducible complexity like the bacterial flagellum*); **Camp-specific** (boundaries debated).
