  Here's the dissection of the implicit logic in legal practices regarding personal identity after brain injury, stripped of jargon and focused on the underlying philosophy:

  **The Core Implicit Theory: Pragmatic Containerism (Not Metaphysics, Not Pure Narrative)**

  Courts aren't consistently applying *any single* philosophical theory (Lockean consciousness, bodily continuity, narrative self). Instead, they treat the *legal person* as a **stable, pragmatic container** for rights, duties, property, and social continuity. This container persists through radical psychological change for core societal functions. However, *within* that container, the law selectively acknowledges the *quality* or *nature* of the current occupant when it serves specific legal purposes. Think of it as a house:

  1.  **The House (Legal Personhood) Persists:** The address (SSN), ownership (property rights), and legal responsibility (potential criminal liability) stay with the house, regardless of who lives inside or its condition. This ensures social stability, property rights, and accountability.
  2.  **The Occupant Matters for Specific Purposes:** When assessing *harm* (civil damages) or *capacity* (consent, directives), the law looks *inside* the house. Is the occupant capable? Have they suffered a loss? Is the current occupant fundamentally different from the one who made a past decision?

  **Deconstructing Your Examples:**

  1.  **Advance Directives (Future Self with Dementia):**
      *   **Logic:** The *container* made a rational, autonomous decision for its future states. Honoring it respects the container's prior autonomy and prevents burdensome decisions for others. The *current occupant's* lack of narrative continuity is secondary to the container's established directive.
      *   **Needs Narrative?** Only the *past* narrative (the competent self's decision). The *current* occupant's narrative breakdown is irrelevant to enforcing the container's prior intent.

  2.  **Dissociative Fugue (Criminal Liability):**
      *   **Logic:** The *container* committed the act. Society *needs* to hold the container accountable for harm caused by bodies under its legal identity, regardless of the occupant's temporary state. Blameworthiness might be reduced (insanity defense), but responsibility resides with the container. Narrative disruption doesn't dissolve the container's link to the act.
      *   **Needs Narrative?** No. It needs *causal responsibility* tied to the container (the body/mind complex operating under that legal ID did the deed).

  3.  **Civil Damages ("Not the Same Person"):**
      *   **Logic:** Here, the law *is* looking inside the container. The claim is that the *occupant* has been profoundly harmed – their capacities, relationships, and lived experience are destroyed. Calculating damages requires acknowledging this loss *to the current occupant*. However, the *container* still owns the award and retains its legal identity.
      *   **Needs Narrative?** Indirectly, yes. The "loss" implies a *break* in the narrative trajectory of the occupant's life. The court recognizes that the story the *past occupant* was living cannot be continued by the *present occupant* in the same way. This valuation *requires* the concept of a disrupted life narrative.

  **Dennett's Center of Narrative Gravity - Applied & Challenged:**

  *   **How it Fits:** The law constantly *uses* narrative as a tool. We tell stories about the person (past wishes, the crime event, the life destroyed) to make sense of the container's history and justify decisions. The "center of gravity" is a convenient fiction for stitching together the container's timeline.
  *   **Where it Breaks Down / What's Smuggled In:**
      *   **The Container Itself:** The persistence of the *container* isn't *just* a narrative. It's a fundamental, non-narrative *social fact* – a legal/socially constructed entity that exists independently of any single occupant's narrative coherence. This is the "metaphysical substrate" smuggled in: **Social Ontology**. The container is a real entity within the social world.
      *   **Bodily Continuity:** The physical body is the anchor for the container in almost all cases. The law struggles (e.g., with DID) when this seems fragmented, but the default is "one body, one container."
      *   **Responsibility Sans Narrative:** Holding the fugue state actor responsible shows accountability isn't *solely* dependent on a current coherent narrative self. It depends on the container being the locus of control (even if lost) for the physical act.

  **If We Fully Embraced the Center-of-Gravity View:**

  1.  **Split-Personality Defenses (DID):** We *might* be more inclined to absolve alters who genuinely lack access to the dominant narrative or the "center." If the center of gravity truly shifted, blame might shift too. The law currently resists this, clinging to "one body, one container responsible."
  2.  **Advance Directives in Severe Dementia:** If the current occupant *cannot access or generate any narrative whatsoever* (not just dementia confusion, but a complete absence), the Dennettian view suggests the "center" has dissolved. Enforcing the directive *against* the current occupant's basic urges (e.g., refusing food they now want) could seem like violating a distinct, albeit minimal, entity. The law prioritizes the container's past narrative over the current non-narrative state.
  3.  **Civil Damages:** This might become *more* central. Damages calculations would focus almost entirely on the destruction of the narrative trajectory and the inability to construct a coherent future narrative.

  **The Implicit Logic Recap:**

  1.  **Core Principle:** The **Legal Person is a Persistent Container** (Social Ontological Entity) anchored to one body.
  2.  **Container Functions:** Holds property, rights, citizenship, and ultimate responsibility for actions emanating from the body/mind complex associated with it.
  3.  **Occupant Assessment:** When assessing *harm, benefit, or capacity*, the law evaluates the *current psychological state and capacities* of the occupant *within* the container.
  4.  **Narrative's Role:** A powerful tool for explaining the container's history, justifying decisions about it (directives), and quantifying harm (damages). But the container's persistence is *not itself dependent* on narrative continuity.

  **In short:** The law doesn't need a *metaphysically real*, continuous self. It needs a **socially stable, accountable container**. Narrative is crucial for some functions *within* this system (understanding harm, respecting past wishes) but not for the container's fundamental persistence or basic accountability. Dropping the narrative fiction entirely would likely force a radical restructuring of civil damages and advance directives, while criminal law might become even more rigidly tied to the physical container/body. The current system thrives on the *flexibility* of switching between the container view and the occupant view as needed.
