answer: |-
  ## Joint Statement on Special Composition  
  **Between Strong Universalists (SU) & Cohesion-Gradualists (CG)**  
  *(Draft for Mutual Signing)*  

  **Preamble:**  
  We, the undersigned representatives of the Strong Universalist (SU) and Cohesion-Gradualist (CG) positions, acknowledge a shared commitment to clarity, naturalism, and parsimony in addressing the Special Composition Question (SCQ). While our core metaphysical commitments diverge, we agree on fundamental constraints and desiderata. This document outlines areas of agreement, precise points of divergence, and key testable cruxes.  

  ---

  ### Section 1: Agreed Claims  
  We jointly affirm the following:  

  1.  **The Formal SCQ Problem:** The core question is "Under what conditions do two or more objects compose a further object?" This is distinct from merely describing mereological relations between existing objects.
  2.  **Rejection of Mystical Primitives:** Neither position relies on primitive, irreducible "composition relations" or "special connections" lacking any grounding in fundamental physical (causal, spatiotemporal) properties or relations.
  3.  **Avoidance of Unnecessary Bloat:** Both positions aim for ontological economy. SU seeks to avoid arbitrary restrictions generating brute distinctions. CG seeks to avoid populating the world with entities lacking significant causal unity or integration, deeming them ontologically insignificant ("bloat").
  4.  **Formal Mereology is Neutral:** Standard axioms of Classical Extensional Mereology (CEM) are compatible with both positions. CEM provides a framework for *describing* parthood relations but does not, by itself, answer the *existence* question posed by the SCQ. CEM alone cannot settle the dispute between SU and CG.
  5.  **Primacy of Fundamental Physics:** Any acceptable account of composition must be compatible with, and ideally grounded in, the causal and spatiotemporal structure described by fundamental physics. Neither position invokes fundamentally non-physical composition facts.

  ---

  ### Section 2: Disagreements Table  
  *Each camp accepts the wording describing their own view and the specific divergence point.*

  | Aspect                     | Strong Universalist (SU) Position (As stated by SU)                                     | Cohesion-Gradualist (CG) Position (As stated by CG)                                                                 | Exact Point of Divergence                                                                 |
  | :------------------------- | :-------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------ | :---------------------------------------------------------------------------------------- |
  | **1. Composition Trigger:** | Composition is **unrestricted**: For any distinct objects whatsoever, there exists a mereological sum composed of exactly those objects. | Composition is **gradual**: Whether parts compose a whole, and the *degree* to which they do so ("mereological density"), depends continuously on the **causal-spatiotemporal integration** of those parts. | SU asserts composition is *always and unconditionally* triggered by any plurality. CG asserts composition is *contingent and graded* based on measurable integration. |
  | **2. Nature of Wholes:**    | Being a whole is **binary**: An object either is the mereological sum of its parts or it is not. There are no degrees of "being a whole." | Being a whole is **gradable**: Objects exhibit **varying degrees of mereological density** corresponding to the strength of integration among their parts. | SU denies that the *existence* or *metaphysical status* of a composite object admits of degrees. CG asserts that composite existence/status *is* fundamentally gradable. |
  | **3. Status of Low-Density Entities:** | All mereological sums, regardless of the spatiotemporal dispersion or causal disconnect of their parts, are **equally real, concrete objects**. A table and the table-moon sum differ only in their properties, not in their ontological status. | Entities with near-zero mereological density (e.g., scattered shoes) **lack significant ontological standing**. They are not fundamental entities and are best understood as **useful conceptual fictions** or *entia minora*, lacking the robust unity characteristic of genuine objects. | SU grants *full, equal ontological status* to *all* sums. CG denies *significant ontological status* to composites with negligible integration, treating them as pragmatic conveniences rather than fundamental constituents of reality. |

  ---

  ### Section 3: Key Cruxes & Predicted Verdicts  
  We identify the following core disagreements ("cruxes") and agree on concrete cases to test our respective predictions.  

  **Crux 1: Is Being-a-Whole Binary or Gradable?**  
  *The Case: A Complex Organism (e.g., a squirrel) undergoing slow decomposition over 6 months versus instant vaporization by a particle beam.*  

  *   **SU Prediction:**  
      *   *Slow Decay:* At every moment during decay, the squirrel-parts compose a single squirrel-object (though its properties change). When the last recognizable functional part ceases, a new, highly scattered sum of squirrel-atoms exists.  
      *   *Instant Vaporization:* Immediately after vaporization, a highly scattered sum of squirrel-atoms exists.  
      *   ***Verdict:*** **Binary.** In both scenarios, there is always *an object* composed of the relevant atoms. The mode of destruction changes *which* object exists (squirrel vs. scattered atoms) at specific times, but existence itself is all-or-nothing.  
  *   **CG Prediction:**  
      *   *Slow Decay:* The squirrel's mereological density *gradually decreases* as functional integration breaks down. Eventually, it falls below a threshold where "squirrel" ceases to be a meaningfully unified whole, though very low-density composites of the atoms persist conceptually.  
      *   *Instant Vaporization:* Mereological density drops *instantaneously* from very high (squirrel) to near-zero (scattered atoms).  
      *   ***Verdict:*** **Gradable.** The decrease in unity (and thus the metaphysical status of the composite) is a continuous process in decay and a discontinuous *but still gradable property change* in vaporization, reflecting the abrupt loss of integration. The change in "what exists" is a matter of degree, not a sharp boundary between existence and non-existence.  

  **Crux 2: Do Near-Zero-Density Composites Have Real Metaphysical Status?**  
  *The Case: A jigsaw puzzle – (a) Fully assembled and glued on a table vs. (b) Half the pieces correctly assembled on the table, the other half still in the box 10 meters away.*  

  *   **SU Prediction:**  
      *   *(a) Assembled Puzzle:* There exists a puzzle-object composed of the glued pieces.  
      *   *(b) Half-Assembled Puzzle:* There exist numerous objects: the assembled sub-section, the pieces in the box, *and also* the mereological sum of *all* the puzzle pieces (assembled + in box), *and* the sum of the assembled part plus the box, *and* the sum of the assembled part plus the Moon, etc.  
      *   ***Verdict on (b):*** **Real.** The scattered sum "all puzzle pieces (assembled + in box)" is a real, concrete object, ontologically on par with the assembled sub-section or a single piece. Its properties (scatteredness, lack of functional unity) do not diminish its existence.  
  *   **CG Prediction:**  
      *   *(a) Assembled Puzzle:* High mereological density; a genuine puzzle-object exists.  
      *   *(b) Half-Assembled Puzzle:* The assembled sub-section has moderate density. The *entire set of pieces* (assembled + in box) has *very low* mereological density due to significant spatiotemporal separation and lack of causal interaction between the two groups.  
      *   ***Verdict on (b):*** **Not Significantly Real.** While the assembled sub-section is a real object, the entire set of pieces lacks sufficient integration to constitute a single, unified object with significant ontological standing. It is a useful conceptual grouping ("the puzzle set") but not a fundamental *thing* in the world distinct from its parts and their locations.  

  ---

  **Closing:**  
  By signing below, we affirm this document accurately represents our shared understandings, precise disagreements, and the identified cruxes with their test cases. We acknowledge these differences stem from deep metaphysical commitments about the nature of unity and existence, but we commit to engaging with each other's positions rigorously and charitably, using the agreed cases as focal points for further debate and potential empirical/philosophical refinement.  

  **[Signature Block for SU Representative(s)]**  
  **[Signature Block for CG Representative(s)]**
