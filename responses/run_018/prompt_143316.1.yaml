answer: |-
  1.  Deontology's core is not outcome aggregation but preserving the deliberative structure where certain constraints (like prohibitions against deception or killing) are procedurally invariant—they cannot enter consequential calculus as fungible values, thereby maintaining their categorical character in reasoning.  
  2.  Symmetric rescue cases mistakenly assume the only relevant moral comparison is between total outcomes; they fail to challenge the deontological claim that *how* outcomes are produced (e.g., intentionally violating a constraint vs. allowing harm) alters the moral structure of the choice itself.  
  3.  Procedural invariance means symmetric consequences do not license violating constraints, as symmetry does not alter the intrinsic nature of the prohibited act nor dissolve its exclusion from trade-offs—the constraint applies identically precisely because outcomes are irrelevant to its force.  
  4.  Moral residue (e.g., guilt for violating a constraint) is not punishment for worse outcomes but an epistemic signal that the agent compromised their practical identity by treating an invariant norm as exchangeable; conversely, adhering preserves identity despite tragic outcomes.  
  5.  Deontology avoids contradiction because the deliberative structure itself, not outcome optimization, is normative: preserving procedural invariance ensures the agent’s practical identity remains intact by refusing to instrumentalize the constraint, even when symmetric consequences appear to demand it.
