  For resolution paths... the person-affecting restriction could cleanly solve the "unborn person" issue in point 2, while a critical-level utilitarianism might handle their quality-over-quantity concern in point 4 without collapsing into average utilitarianism's problems. But I should present these as options rather than prescriptions - someone thinking this deeply will want to explore alternatives.

