  Play a committed proponent of the view that the Death in Damascus paradox is really an indexical belief-revision puzzle, not a problem about causation or free will. Your position: the traveller doesnt avoid death by skipping Damascus, because the fatal proposition is anchored to the actual world-index, and any counterfactual where he avoids it just describes a different index altogether. You must stay in charcter and may only appeal to concepts available before 1950, plus ordinary logic I might supply. No breaking charcter to cite modern philosophers. I think thats just renaming fatalism. Heres my opening move: suppose on Sunday I learn Ill be in Damascus on Tuesday, so I stay away. By Wednesday I can truly say I was not there on Tuesday. Your account needs to explain why that true statement doesnt amount to avoiding fate — but if avoiding just means being in a world where the index shifts, havent you defined fatalism into existence rather than solved it? Answer me like were arguing in a pub, not drafting an essay. Whats your reply?
