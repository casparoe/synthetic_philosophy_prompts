prompt: |-
  I am a software engineer building governance rules for a cooperative platform where members vote on policy changes, but an expert arbitration board may block outcomes that breach core norms. I need a reusable decision procedure—derived from the philosophical debate over judicial review and the counter-majoritarian difficulty—that lets the board determine, in structured sequence, whether vetoing a democratic vote is legitimate. Specify the tests in order, what counts as a sufficient answer to pass or fail each, the point where the procedure mandates "no veto," the point where it mandates "veto," and the points where the issue is one of values rather than rules and must be handed back to human judgment. The procedure must distinguish overturning a vote that threatens protected rights from overturning one that merely reflects disagreeable policy priorities. Apply it to three proposals: (A) a vote to disable end-to-end encryption to ease content moderation; (B) a vote to redirect surplus maintenance budgets toward marketing incentives; (C) a vote to exclude a minority user group from revenue-sharing. For case A specifically, show how the procedure permits a veto that I—favoring minimal board intervention—would find objectionable. State clearly what categories of dispute the procedure is not designed to settle. Write no more than 400 words; do not include citations, bibliographies, reading lists, or references to specific scholars by name.
reasoning: |-
  We are designing a decision procedure for an expert arbitration board to determine whether to veto a democratic vote. The procedure must be structured and sequential, with clear tests that distinguish between threats to core norms and mere policy disagreements. The goal is to allow veto only when necessary to protect fundamental rights or core constitutional principles, not when the board merely disagrees with policy priorities.

  **Decision Procedure: Sequential Tests**

  1. **Formality Test**: Was the vote procedurally correct? (e.g., quorum, notice, no coercion)
     - Pass: All formal rules followed. Proceed to Test 2.
     - Fail: Vote is invalid. Mandate: **No veto** (since the vote itself is void; no need for board veto).

  2. **Core Norms Test**: Does the outcome directly breach a specific, enumerated core norm? (Core norms must be explicitly defined in the cooperative's constitution, e.g., non-discrimination, privacy, due process.)
     - Pass (breach exists): Proceed to Test 3.
     - Fail (no breach): Mandate: **No veto** (policy disagreement only).

  3. **Necessity Test**: Is the breach unavoidable to achieve a legitimate, non-norm-violating goal? (i.e., Is there no less restrictive alternative?)
     - Pass (unavoidable): Proceed to Test 4.
     - Fail (avoidable): Mandate: **Veto** (since a less harmful method exists).

  4. **Proportionality Test**: Does the benefit of achieving the goal outweigh the harm to the core norm? (This requires weighing values and impacts.)
     - Pass (benefits clearly outweigh harms): Mandate: **No veto** (despite norm breach, it is justified).
     - Fail (harms outweigh benefits): Mandate: **Veto**.
     - Undetermined (close balance): **Hand back to human judgment** (board deliberates and votes).

  **Summary of Mandates**:
  - **Mandate "no veto"**: At Test 1 (fail), Test 2 (fail), or Test 4 (pass).
  - **Mandate "veto"**: At Test 3 (fail) or Test 4 (fail).
  - **Hand back to human judgment**: Only at Test 4 if undetermined.

  **Application to Cases**:

  - **Case A (Disable E2E Encryption)**:
    - Test 1: Pass (formally correct vote).
    - Test 2: Pass (privacy is a core norm; disabling E2E breaches it).
    - Test 3: Is disabling E2E *unavoidable* for content moderation? If no less invasive tech exists, pass; else fail. (Assume board finds it avoidable via other methods → Test 3 fails → **Veto**.)  
    *Objectionable to minimal interventionists*: The board might overreach by deeming alternatives feasible when they are not, or by interpreting "privacy" too broadly.

  - **Case B (Redirect Surplus)**:
    - Test 2: No core norm breach (budget allocation is policy) → **No veto**.

  - **Case C (Exclude Minority)**:
    - Test 2: Breaches non-discrimination norm → proceed. Test 3: Avoidable? (Yes, other revenue models exist) → **Veto**.

  **Categories Not Covered**:
  - Disputes over vague or unwritten norms (core norms must be enumerated).
  - Pure policy disagreements (e.g., efficiency, aesthetics).
  - Emergencies requiring immediate action (procedure assumes time for deliberation).
answer: |-
  ### Decision Procedure for Expert Arbitration Board  
  **Sequential Tests:**  

  1. **Procedural Legitimacy Test:**  
     - *Question:* Was the vote conducted according to predefined democratic rules (e.g., quorum, transparency, no coercion)?  
     - *Pass (no veto):* No irregularities. Proceed to Test 2.  
     - *Fail (no veto):* Vote is invalid; rerun required.  

  2. **Core Norms Breach Test:**  
     - *Question:* Does the outcome directly violate a specific, enumerated core norm (e.g., non-discrimination, privacy, fiscal sustainability)?  
     - *Pass (breach found):* Proceed to Test 3.  
     - *Fail (no veto):* Outcome reflects policy preferences, not norm violation.  

  3. **Strict Necessity Test:**  
     - *Question:* Is the breach unavoidable to achieve a legitimate, non-norm-violating goal?  
     - *Pass (unavoidable):* Proceed to Test 4.  
     - *Fail (veto):* Less harmful alternatives exist to achieve the goal.  

  4. **Balancing Test (Values Judgment):**  
     - *Question:* Does the societal benefit of the outcome outweigh the harm to the core norm?  
     - *Pass (no veto):* Benefits decisively outweigh harms.  
     - *Fail (veto):* Harms decisively outweigh benefits.  
     - *Undetermined:* Hand back to human judgment (board votes).  

  **Mandates:**  
  - **Mandate "no veto":** Test 1 (fail), Test 2 (fail), or Test 4 (pass).  
  - **Mandate "veto":** Test 3 (fail) or Test 4 (fail).  
  - **Human judgment required:** Test 4 (undetermined).  

  **Application:**  
  - **Case A (Disable Encryption):**  
    - Test 1: Pass (proper vote).  
    - Test 2: Pass (breaches privacy norm).  
    - Test 3: *Fail if alternatives exist* (e.g., AI moderation without breaking encryption). → **Veto mandated.**  
    - *Objection for minimal intervention:* Board might overreach in Test 3 by underestimating alternatives, vetoing a vote balancing safety and privacy.  
  - **Case B (Redirect Budgets):**  
    - Test 2: Fail (no core norm breach; fiscal policy disagreement). → **No veto.**  
  - **Case C (Exclude Minority):**  
    - Test 2: Pass (breaches non-discrimination). Test 3: Fail (alternatives exist). → **Veto.**  

  **Not Designed For:**  
  - Disputes over unwritten norms.  
  - Emergencies requiring immediate action.  
  - Pure policy disagreements (e.g., efficiency vs. equity trade-offs without norm breach).  

  *(Word count: 397)*
