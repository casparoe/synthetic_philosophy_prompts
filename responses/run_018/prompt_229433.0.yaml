prompt: |-
  I'm running a 75-minute session for an undergrad philosophy club, around 18 people, some but not much decision theory background. I want a structured in-class game around the Death in Damascus problem—you know, Death is a near-perfect predictor of which city you'll be in, so conditional on choosing Aleppo you're confident he's in Aleppo, and conditional on choosing Damascus you're confident he's in Damascus. I specifically want them to actually feel the failure of ratifiability: as soon as they commit to one city, the other one looks better, so they switch, and then the same thing happens from the other side. I don't want to lecture first or name the problem; I want the loop to happen to them and then have it diagnosed. Rules, roles (I guess someone has to play Death, or maybe the facilitator does), a points scheme that doesn't involve real money, a timeline for how the 75 minutes gets used, and a debrief that maps what happened in the game onto the evidential vs causal decision theory distinction and ratifiability. Also tell me what will predictably go wrong the first time I run it and how to fix it, and be honest about what the game can't capture (a human predictor isn't that accurate, and the stakes aren't death).
