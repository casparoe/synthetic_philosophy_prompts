answer: |-
  **THE EMPTY CENTRE: TERMS AND CONDITIONS OF PARTICIPATION (v3.7)**

  **1. Definitions & Foundational Doctrine**
     1.1. The Service Provider ("The Empty Centre," "Centre," "we," "us," "our") refers to the transient confluence of material support (facilities, staff aggregates) facilitating meditative experiences.
     1.2. "Participant," "you," "your" denotes the conventional designation applied to the specific, temporary, and dependently-arisen configuration of the Five Aggregates (Form, Sensation, Perception, Mental Formations, Consciousness) presenting at the time of contractual initiation and throughout the designated retreat period. This designation is a pragmatic administrative fiction only.
     1.3. **Anattā (Core Doctrine):** The Centre operates exclusively under the principle of Anattā (non-self). No inherently existing, independent, enduring self or person is recognised legally, administratively, or metaphysically. All rights, obligations, experiences, and liabilities pertain solely to the interaction of Aggregates, conventionally grouped for practical necessity.

  **2. Booking & Financial Considerations**
     2.1. **Conventional Self Requirement (Administrative Fiction):** To initiate booking, a conventionally designated "self" must provide personal data (name, contact details, payment information) via the Centre's website. This data pertains solely to the Aggregate-Configuration manifesting at the point of transaction. The Centre assumes no responsibility for identity discrepancies arising from the inherent instability of the Aggregates.
     2.2. **Deposit:** A non-refundable deposit is required to secure participation. This deposit secures the reservation for the Aggregate-Configuration designated at booking.
     2.3. **Refund Policy:**
        *   **Cancellation by Participant (Conventional Designation):** Should the designated Aggregate-Configuration manifesting at the time of cancellation request withdrawal 30+ days prior to commencement, a partial refund (excluding deposit) *may* be issued to the financial institution associated with the booking Aggregate-Configuration. Refunds are contingent upon the operational capacity of the Centre's Aggregate-Configuration at that time and are not a right attributable to any enduring entity.
        *   **Cancellation within 30 Days:** No refunds shall be issued. The financial contribution is understood as karmically conditioned support for the Centre's Aggregates, dissolving the conventional obligation upon payment. The absence of a persistent beneficiary negates further claim.
        *   **Non-Attendance:** Failure of the Aggregate-Configuration designated at booking to manifest at the retreat constitutes automatic forfeiture of all monies paid. No enduring entity exists to claim loss.

  **3. Participation, Conduct & Liability**
     3.1. **Continuity of Experience:** The retreat experience is provided sequentially to successive, causally linked Aggregate-Configurations. Whilst memory formations may create an illusion of continuity, each session is experienced by a distinct, momentary configuration. The Centre makes no warranty regarding the subjective coherence of experience across sessions.
     3.2. **Conduct:**
        *   All participants (designated Aggregate-Configurations) agree to abide by Centre rules (e.g., silence periods, respectful interaction).
        *   Harmful actions (physical, verbal, mental) committed by any Aggregate-Configuration during the retreat are understood to arise from specific, conditioned interactions of Form, Sensation, Perception, Mental Formations, and Consciousness at that moment. Liability does not attach to a non-existent self.
     3.3. **Liability Waiver:**
        *   The Centre, its staff Aggregates, and associated entities accept no liability whatsoever for:
            *   Physical or mental discomfort, distress, or perceived harm arising during or after the retreat. Such experiences are the result of the interaction between the Participant's Aggregates and the retreat conditions, devoid of an enduring victim or perpetrator.
            *   Loss or damage to personal property (aggregates of Form belonging to prior configurations). Participants are advised that attachment to possessions reinforces delusion.
            *   Karmic outcomes arising from actions committed during the retreat. Karma operates impersonally upon the Aggregates; no central agent bears ultimate responsibility.
        *   *"The Centre's Aggregates diligently maintain safe conditions. However, any notion of 'harm' implies a stable entity to be harmed, which contradicts our core doctrine. Liability, therefore, is a conceptual impossibility."* - **J. Arbuthnot, Head of Non-Identity Relations**
     3.4. **Inheritance of Progress:** Any meditative progress, insights, or realisations cultivated during the retreat are formations within Consciousness and associated Mental Formations. These formations condition future Aggregates karmically but are not the "property" of any self that can be bequeathed or transferred. Claims of "lost progress" by subsequent configurations are fundamentally mistaken.

  **4. Dispute Resolution**
     4.1. **Complaints:** Any complaint regarding the services provided must be lodged in writing by the Aggregate-Configuration experiencing dissatisfaction *during the retreat period*. Complaints lodged by subsequent configurations, claiming continuity with the aggrieved configuration, cannot be processed, as no enduring complainant exists.
     4.2. **Resolution Process:** Complaints will be reviewed by the Centre's Non-Identitarian Arbitration Panel (NIAP), comprising staff Aggregates trained in dependent origination. The NIAP will examine the conditioned interplay of Aggregates (complainant-configuration, staff-configuration, environmental factors) that led to the dissatisfaction.
     4.3. **Outcome:** The NIAP may recommend adjustments to the retreat environment to alleviate conditions causing dukkha for *current* configurations. No financial compensation, apology directed to a non-existent self, or admission of fault by an enduring entity will be issued. The process aims solely to rebalance conditions, not satisfy a claimant.

  **5. Termination**
     5.1. The Centre reserves the right to require the departure of any designated Aggregate-Configuration whose actions (arising from its conditioned Aggregates) are deemed by the Centre's management Aggregates to be significantly disruptive to the retreat environment or the practice of other configurations. No refunds will be provided.
     5.2. Participation concludes automatically at the scheduled end time. The Centre assumes no responsibility for the well-being, travel arrangements, or subsequent experiences of the Aggregate-Configuration departing the premises, or any configurations arising thereafter.

  **6. General**
     6.1. **Amendments:** These Terms may be amended by the Centre's operational Aggregates. Participants will be deemed to have accepted amendments through their continued physical presence (Aggregate-configuration manifestation) at the retreat after notification.
     6.2. **Governing Framework:** This agreement is governed by the Doctrine of Anattā and the principles of Dependent Origination. Any perceived conflict with conventional legal systems is illusory, arising from a misapprehension of inherent existence.
     6.3. **Entire Agreement:** This document represents the entire conditioned agreement between the transient Aggregate-Configuration designated at booking and the transient Aggregate-Configuration operating as The Empty Centre at that time. No verbal representations or promises implying enduring obligations are binding.
     6.4. **Severability:** If any clause is deemed conceptually invalid (e.g., implying selfhood), it shall be void, but the remaining clauses, operating under anattā, shall persist conditionally.

  **By submitting payment, the Aggregate-Configuration designated at the point of transaction conventionally assents to these Terms, understanding them as a practical arrangement devoid of ultimate agents or inherent obligations. Welcome to The Empty Centre.**
