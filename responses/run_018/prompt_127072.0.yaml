  **Q: What if a branch version of me demands a refund?**  
  A: Refunds are only issued to the agent who signed the contract. If your branch claims it’s "the real you," kindly remind it that existential continuity is a premium feature (*SoulLock™*, $199/month). Branches that dissolve/merge may qualify for store credit (valid only in non-embedded realities).  

