answer: |-
  Here are five numbered points diagnosing the analogy-as-core debate:

  1.  **"Core" ambiguity:** The central conflict is partly semantic: "core" remains undefined, with proponents meaning "foundational, ubiquitous, and necessary" while opponents interpret it as "atomic, irreducible, and computationally primary," leading to fundamental disagreement about what constitutes evidence.
  2.  **Conflated cognitive modes:** The debate often merges distinct processes under "analogy"—high-level, deliberate, creative structural mapping (Hofstadter's focus) versus rapid, automatic, similarity-based retrieval/categorization used in recognition—masking whether the core claim applies to one, both, or their interaction.
  3.  **Evidential mismatch:** Proponents point to analogy's pervasiveness in complex cognition (language, discovery) as evidence of its centrality, while opponents cite empirical psychology showing many rapid judgments utilize simpler similarity or associative processes, questioning if complex analogy *builds on* these rather than *being* the core.
  4.  **Neural underdetermination:** Current neuroscience (fMRI, EEG) identifies brain regions/networks involved in analogy but cannot definitively show whether analogy is the *primitive computational mechanism* or an *emergent property* of interacting simpler systems (perception, memory, association); the data fuels both interpretations.
  5.  **Bedrock intuition + empirical gap:** While sharper conceptual distinctions (e.g., separating mapping *processes* from similarity *scales*) help, and novel experiments (e.g., tracing computational primitives in developing AI or neural decoding *during* spontaneous analogy) could shift views, the core disagreement hinges partly on divergent intuitions about cognitive primitives—whether thought fundamentally starts with structure-mapping or simpler associations—making full resolution unlikely without a decisive empirical leap bridging mechanism and phenomenology.
