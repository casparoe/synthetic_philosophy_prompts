answer: |-
  Nāgārjuna's tetralemma (catuṣkoṭi), which systematically negates the four possible positions regarding the existence of any entity (exists, does not exist, both exists and does not exist, neither exists nor does not exist), is indeed a powerful apophatic tool dismantling reified views of inherent existence (svabhāva). However, interpreting it *solely* as negation misses its crucial, positive soteriological function: establishing the validity and necessity of conventional reality (vyavahāra/saṃvṛti-satya) grounded in dependent origination (pratītyasamutpāda) and emptiness (śūnyatā).

  The tetralemma’s negation targets *only* svabhāva – intrinsic, independent, self-established existence. Crucially, this very negation *is* the affirmation of dependent arising. To say an entity lacks svabhāva *is* to say it exists dependently, through causes, conditions, and conceptual designation (prajñapti). The tetralemma dismantles absolutism and nihilism *simultaneously*: rejecting "exists" counters eternalism (affirming svabhāva); rejecting "does not exist" counters annihilationism (denying any reality whatsoever). The negation of all four positions clears the conceptual ground for the Middle Way: phenomena are not non-existent (they appear and function conventionally), but they are empty of inherent existence.

  **Defence Against Global Nihilism:** The objection that this leads to nihilism conflates emptiness with non-existence. Emptiness is not a void *opposed* to existence; it *is* the dependently originated nature *of* existence. Śūnyatā signifies the *absence* of svabhāva *within* conventional phenomena, not the absence *of* phenomena. Nāgārjuna explicitly states that emptiness itself is dependently designated and without which the conventional would collapse. Conventional reality – the world of causes, effects, names, functions, and moral distinctions – is precisely *how* emptiness manifests. To deny conventional reality *because* of emptiness would be like denying the utility of a chariot because analysis reveals it lacks a "chariot essence" apart from its parts. The chariot functions *because* it is empty of inherent existence, depending on its parts and designation. Global nihilism only arises if one mistakes the negation of svabhāva for a negation of relational, dependent existence itself – a mistake the tetralemma itself guards against by negating the "does not exist" position.

  **Moral Agency without Svabhāva:** Moral agency is retained precisely *within* the framework of dependent designation and causal efficacy, without requiring an intrinsically existent agent or act.
  1.  **Dependent Designation of Agent and Act:** The "agent" (kartṛ) and "action" (karma) are not self-enclosed entities but interdependent concepts arising within a complex web. The agent is designated in dependence upon aggregates (skandhas), volitions (cetanā), and actions. The action is designated in dependence upon the agent, intention, effort, and consequences. Neither possesses intrinsic reality, yet their relational existence is undeniable on the conventional level.
  2.  **Causal Continuity of Volition (Cetanā):** Moral responsibility hinges on volition (cetanā), defined as the intentional impulse behind action. This volition arises dependently, conditioned by ignorance, habits, circumstances, etc. Crucially, volition has causal efficacy: it initiates actions that produce consequences (karma-vipāka). This causal chain operates conventionally without requiring an unchanging "self" to bear the karma. The continuum of consciousness and mental factors, though devoid of a permanent core, provides sufficient continuity for the ripening of effects to be experienced meaningfully. Painful consequences naturally follow harmful intentions and actions; pleasant consequences follow wholesome ones, like fire follows ignition, not because of inherent natures but due to dependent causal patterns.
  3.  **Conventional Validity:** Morality operates within the conventional realm. Recognising emptiness does not negate the relative suffering caused by unwholesome actions or the relative benefit of wholesome ones. Compassion (karuṇā) and ethical conduct (śīla) are not only possible but *essential* on the conventional path precisely *because* beings experience suffering conventionally. The Bodhisattva ideal exemplifies agency directed by wisdom (prajñā – insight into emptiness) and compassion, acting *for* the benefit of beings within the conventional world, without reifying self, other, or the act.

  Therefore, the tetralemma is not mere negation but the key to unlocking the positive reality of the dependently arisen conventional world. Emptiness, far from implying nihilism, is the condition of possibility *for* conventional functionality, including moral agency. Responsibility arises from the causal potency of volition within the dependently designated framework of agent and act, upheld by the conventional validity of suffering and its cessation. True nihilism is the reification of non-existence, which Nāgārjuna rejects as vigorously as the reification of existence. The Middle Way affirms the dependently real.
