answer: |-
  Here are eight precisely targeted interview questions with follow-ups, structured progressively to probe the conceptual, phenomenological, meta-normative, and applied dimensions of "frame-relative moral remainder." Each main question anticipates the philosopher’s likely response and pushes deeper.

  ---

  ### **I. Conceptual Architecture & Frame Authority**  
  **Q1: Frame Precedence & Anti-Consequentialism**  
  *"You argue that frame precedence is determined by 'internal authority conditions' rather than aggregative weighing. But if frames are incommensurable—as your view requires—how do we avoid arbitrariness when, say, a frame’s internal conditions demand its own supremacy (e.g., a religious frame claiming divine authority over institutional duties)? How is this not just a hidden hierarchy?"*  
  *(Follow-up, anticipating her "internal authority" defense):*  
  **Q1b:** "Suppose two frames each assert non-negotiable authority under their own conditions (e.g., filial piety vs. civic duty). If neither frame can recognize the other’s authority claims without collapsing into a superordinate system, doesn’t your solution merely relocate the dilemma to a *meta-level conflict about authority*—leaving the residue intact?"  

  ---

  ### **II. Phenomenology of Residue vs. Agent-Regret**  
  **Q2: Residue as Objective vs. Psychological**  
  *"You distinguish moral residue from Williams’ agent-regret by calling it an 'objective normative feature' detectable through reparative obligations. But how do these obligations differ from ordinary remedial duties (e.g., compensating for unintended harm during justified surgery), which don’t imply unresolved dilemmas?"*  
  *(Follow-up, anticipating her "reparative obligation" criterion):*  
  **Q2b:** "If reparative obligations for residue arise *only* in dilemmatic cases, what non-intuitionist criterion marks them as distinct? For instance, if the archivist compensates her parent after disclosure, is this qualitatively different from compensating a bystander harmed in a non-dilemmatic choice? Or does this rely on tacitly invoking the 'remainder' it aims to prove?"  

  ---

  ### **III. Meta-Conflicts & Second-Order Obligations**  
  **Q3: Conflicts About Conflict-Resolution**  
  *"When frames impose second-order obligations for *resolving* first-order conflicts (e.g., ‘resolve dilemmas transparently’ vs. ‘resolve them discreetly’), does your framework treat these as new first-order dilemmas? Or do they operate in a distinct logical space?"*  
  *(Follow-up, anticipating her "stratification" defense):*  
  **Q3b:** "If second-order obligations are hierarchically superior, doesn’t this imply a meta-frame to adjudicate them—contradicting frame relativity? If not, and they’re just another set of frame-bound duties, how does this *not* generate a regress of residues (e.g., residue for failing transparency *and* for failing discretion)?"  

  ---

  ### **IV. Applied Scenario: The Archivist Dilemma**  
  **Q4: Asymmetry of Residue in Concrete Choice**  
  *"In your archivist case—torn between institutional disclosure and filial protection—how does your theory explain why choosing *disclosure* leaves a residue qualitatively distinct from choosing *silence*? If both choices violate equally authoritative frames, shouldn’t the residue be symmetric?"*  
  *(Follow-up, pressing the moral/relational distinction):*  
  **Q4b:** "You describe the residue after disclosure as a ‘moral remainder.’ But if the archivist’s obligation to her parent stems from a relational frame, isn’t the residue just a relational rupture (e.g., estrangement) rather than a persistent *moral* duty? How does violating a relational frame generate freestanding moral reasons post-action?"  

  ---

  ### **Additional Depth Questions**  
  **Q5: Frame Ontology & Social Reality**  
  *"What constitutes a normative frame’s ‘authority’? If frames are socially embedded (e.g., ‘filial’ norms vary culturally), does moral residue risk becoming culturally relative? Or is there a universal phenomenology of ‘remainder’ despite frame variance?"*  
  *(Follow-up):*  
  **Q5b:** "If residue is universal but frame-authority is contingent, how can residue be *objective*? Doesn’t this require a Platonism about unresolved obligations?"  

  **Q6: Action-Guidance & Rational Justification**  
  *"If residues are ineliminable, does your view imply that *all* dilemmatic choices are rationally underdetermined? If so, how can agents justifiably act—beyond arbitrary ‘frame prioritization’—without conceding to Williams’ pessimism about practical reason?"*  
  *(Follow-up):*  
  **Q6b:** "Williams held that dilemmas reveal the limits of rational morality. By retaining ‘binding but unsatisfiable’ obligations, aren’t you preserving moral rationality’s failure—making residue a symptom of systemic incoherence?"  

  ---

  ### **Question Sequence Rationale**  
  1. **Q1/Q1b:** Targets core mechanics of frame authority (avoids consequentialism collapse).  
  2. **Q2/Q2b:** Tests phenomenological claims against reductionist alternatives.  
  3. **Q3/Q3b:** Presses meta-conflicts to expose unresolved regress.  
  4. **Q4/Q4b:** Applies theory asymmetrically to concrete case; forces defense of residue’s moral (vs. relational) status.  
  5. **Q5/Q5b & Q6/Q6b:** Deepens ontology/rationality critiques after groundwork is laid.  

  Each follow-up preempts likely defenses to provoke refinement or concession. The archivist scenario (Q4/Q4b) leverages relational/institutional tension to stress-test residue objectivity—moving beyond trolley-adjacent cases. No biographical questions; all are theory-immanent and progressively structured.
