  First, I need to unpack what's happening here. The conceivability argument relies on the idea that we can imagine a world physically identical to ours but without consciousness (zombies). But when pressed, proponents often retreat to saying they only need functional equivalence, not full physical details. Then they appeal to the strong intuition that such zombies would feel hollow or lack qualia. The user is pointing out that the thin description makes conceivability easier to claim, while the thick intuition provides the rhetorical force. This seems like a subtle dialectical shift.

  Looking at philosophical terminology, this isn't exactly equivocation because both descriptions aim for the same conclusion. It's not quite motte-and-bailey either, since there's no strategic retreat to a stronger position. The closest existing concept might be Chalmers' "thick" and "thin" conceivability, but he doesn't frame it as problematic. Dennett's "intuition pump" comes close but is too broad. 

  The user wants to know if there's a specific name for this move. Since there doesn't seem to be one, I should propose a new term. The key elements are: modal underspecification (thin) combined with phenomenological borrowing (thick). "Phenomenological bootstrapping" captures the idea of lifting the argument using borrowed intuitions. "Zombie dialectic" is more specific to this argument. "Modal-phenomenal slide" emphasizes the transition between modes of reasoning.

  I should also consider boundary conditions. Does this apply only to consciousness debates? Probably, because in other modal arguments (like Kripke's Hesperus/Phosphorus), the intuition doesn't rely on smuggling in first-person data. The uniqueness lies in how the thin modal claim covertly depends on thick phenomenal intuitions that weren't properly included in the initial description.

  The user's deeper need might be to have a precise term to critique this move in their own work. Naming it gives them a tool to call out this slippage in academic discussions. They might also want to clarify why the zombie argument feels compelling despite its flaws - this move explains the rhetorical power while exposing the logical gap.
answer: |-
  You've pinpointed a crucial and often problematic dialectical move in the zombie argument and conceivability debates. It's astute observation. While there isn't a single, universally established term *precisely* for this specific slide, it's widely recognized as a significant weakness. Here's the landscape:

  1.  **Chalmers' "Thick" vs. "Thin" Conceivability:** David Chalmers *introduced* this distinction explicitly to address concerns like yours.
      *   **Thin Conceivability:** Conceiving that P is the case without contradiction, given our *current understanding* of concepts and logic. This is how the functional/structural description works for zombies: we see no contradiction in a physically/functionally identical system lacking consciousness *as we currently understand those concepts*.
      *   **Thick Conceivability:** Conceiving that P is the case with a *positive, substantive, detailed* grasp of what it would be like for P to be true. This is where the "vivid intuition" of hollowness comes in.
      *   **The Problem:** The zombie proponent typically *claims* only thin conceivability is needed to establish possibility (and thus refute physicalism). However, they often *rely* rhetorically on the thick conceivability (the vivid intuition) to make the argument seem compelling and to motivate the claim that there's a genuine *explanatory gap*. The move you describe is **exploiting the *rhetorical force* of thick conceivability while resting the *logical argument* only on thin conceivability.**

  2.  **Established Critiques & Related Terms:**
      *   **Underspecification/Objection from Ignorance:** Critics (like Dennett, Churchland, Block, Stoljar) argue the "thin" description is radically underspecified. When you say "physical duplicate," proponents often mean "macro-structural/functional duplicate," *excluding* the very microphysical details (quantum states, etc.) that physicalists argue *constitute* consciousness. Claiming conceivability based on this incomplete description is seen as ignorance of what a *true* physical duplicate entails. This is often called the **"Ignorance Objection"** or the **"Argument from Underspecification."**
      *   **Begging the Question/Circularity:** The move smuggles in the very phenomenal concepts whose reducibility is at issue. The "hollowness" intuition *presupposes* an understanding of phenomenal consciousness that is *already* assumed to be irreducible to the physical/functional description. Relying on this thick intuition to motivate the gap arguably **begs the question** against the physicalist.
      *   **Intuition Pump (Dennett):** Dennett might call the vivid "hollowness" intuition an **"intuition pump"** – a rhetorical device designed to evoke a strong feeling of plausibility that isn't actually justified by the logical structure of the argument. The slide allows the pump to work using the thick intuition while the argument formally relies only on the thin conceivability.

  **Coining a Term:**

  Given the lack of a perfect single term, and your request for precision, here are a few options with clear boundary conditions:

  1.  **The Phenomenological Bootstrapping Gambit:**
      *   **Mechanism:** Using a thin, structural/functional conceivability claim (which is easier to establish) to "bootstrap" the argument to a conclusion that derives its intuitive force and sense of *explanatory gap* from a thick, phenomenologically rich intuition *not actually contained or justified by the thin description alone*.
      *   **Boundary Conditions:**
          *   **Specific to Consciousness?** Primarily, yes. It relies critically on the unique nature of phenomenal concepts and the alleged "what-it's-like-ness" that is the target of the argument. The *explanatory gap* intuition is inherently phenomenological.
          *   **Requires:** (a) A modal claim based on an *underspecified* or *abstract* description (thin conceivability). (b) An appeal to a *vivid, phenomenologically-loaded intuition* about the scenario described thinly. (c) The conclusion (e.g., an explanatory gap, property dualism) depends rhetorically and motivationally on (b), even if the formal argument only requires (a).

  2.  **The Zombie Dialectic Slide:**
      *   **Mechanism:** The dialectical maneuver of strategically switching between the defensible but weak "thin" modal claim (functional duplicate conceivable) and the compelling but question-begging "thick" phenomenal intuition (zombies are hollow) within the same argumentative thread.
      *   **Boundary Conditions:** Explicitly tied to the zombie argument structure. Highlights the *dialectical* nature of the move – how proponents navigate challenges by retreating to thin conceivability when pressed on details but leverage thick intuition when emphasizing the conclusion's force.

  3.  **Modal-Phenomenal Decoupling:**
      *   **Mechanism:** The act of *decoupling* the modal claim (what is conceivable/possible) from the specific phenomenal content that gives the scenario its intuitive weight and relevance to consciousness. The conceivability is established using concepts decoupled from full phenomenal implications, but the implications are then re-attached for the conclusion.
      *   **Boundary Conditions:** Focuses on the gap between the *basis* of the modal claim (abstract structure) and the *source* of its relevance (phenomenology). Applicable wherever a modal argument about consciousness relies on an abstract description that doesn't fully capture the phenomenal target.

  **Why it's not quite Motte-and-Bailey or Equivocation:**

  *   **Motte-and-Bailey:** In M&B, the "bailey" (thick, controversial claim) and the "motte" (thin, easily defensible claim) are distinct positions, and the proponent retreats strategically. Here, it's more nuanced: *both* descriptions are used to support the *same* core anti-physicalist conclusion (zombies are possible). The proponent isn't usually retreating from the thick *claim* (zombies *are* hollow) – they still hold it. They are retreating from the *basis needed to formally establish conceivability* when challenged, while still relying on the thick intuition for persuasiveness.
  *   **Equivocation:** The core concepts ("conceivable," "zombie," "physical duplicate") aren't necessarily shifting their *meaning* between thin and thick uses in a way that constitutes a formal fallacy. It's more about exploiting the *rhetorical gap* between the minimal requirements for logical conceivability and the rich intuition that makes the scenario seem genuinely possible and relevant to consciousness.

  **Conclusion:**

  The move you've identified is a critical vulnerability in the zombie argument. While often discussed under the banners of "thin vs. thick conceivability," the "ignorance objection," or "begging the question" regarding phenomenal concepts, it lacks a single perfect name. **"Phenomenological Bootstrapping"** or **"The Zombie Dialectic Slide"** captures the core mechanism effectively. This slide is **highly specific to consciousness debates** because it hinges on the unique relationship between third-person structural/functional descriptions and first-person phenomenal experience, and the powerful intuition of an explanatory gap that arises from that relationship. Applying a thin modal argument to an underspecified base in other domains (e.g., conceiving Hesperus without Phosphorus) doesn't typically involve smuggling in this kind of vivid, question-begging phenomenological intuition.
