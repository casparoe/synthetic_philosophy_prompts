  Also, the user wants about 6 nodes. The start, then two branches each leading to positions. Ensure the flow covers all combinations. For example, after the first question, each answer leads to the next branch. Then, based on the second branch, the final positions. Some paths might not have a defined leaf, so note those as unexplored.

