  Key realization: the recursive uncertainty in (c) is the anchor. If nested payoff functions break Kelly's assumptions, the whole analogy crumbles. That's why it gets highest probability weight. But I shouldn't dismiss (d)'s pragmatism - humans need usable heuristics even when foundations are shaky.

