  I need to design this thought experiment carefully. The scenario should be a realistic workplace situation, perhaps involving some kind of decision-making with ordinary payoffs. I'm thinking about something like a marketing campaign prediction - that feels relatable and business-oriented. The character could be a marketing analyst who has developed a new campaign strategy and feels confident about it.

  The key twist is that the reference class needs to be defined by the agent's internal mental state. For example, "analysts who felt structured confidence in their campaign models." This creates that loop the user wants, where the inside view is used to define the group whose base rate you'd normally use for the outside view.

  For the verdicts section, I'll need to explain three positions clearly:
  - Pure inside-view reasoning would say "trust your own judgment"
  - Pure outside-view calibration would say "defer to the base rate"
