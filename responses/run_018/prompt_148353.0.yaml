prompt: |-
  I'm drafting a one-semester independent-study proposal (target ~5,000 words, philosophy of decision theory) and want it turned into a polished, self-contained document. The core idea: standard program equilibrium assumes cooperating agents share literally identical source code, which permits perfect mutual simulation and cooperative outcomes even in one-shot prisoner's dilemmas. But realistic analogues—whether human reasoners with shared training or AI instances fine-tuned from a common pre-trained base—are better modeled as sampling programs from a parameterized family with partial, probabilistic overlap. I want to formalize what I'll call "distributional program equilibrium": each agent knows its own draw, shares a common prior over the family, and can perform bounded simulation of other draws, updating beliefs about the opponent's specific instance.

  State the precise question: under this relaxation, does cooperation in the prisoner's dilemma (and in a continuous split-the-dollar game) survive continuously with a family-similarity parameter, or does the framework collapse immediately into a standard Bayesian Nash game? Explain why existing treatments—both the original Hofstadter-style framing and later formalizations—leave this intermediate regime open: they move from perfect source-code identity straight to full common-knowledge rationality without examining the structurally distinct case of probabilistic overlap with bounded simulation.

  Lay out the method month by month. Month 1: define the program family, the simulation budget, and the belief-updating rule. Month 2: derive equilibrium conditions for the prisoner's dilemma and the continuous game. Month 3: check for uniqueness, prior-dependence, and consistency conditions. Month 4: compare predictions with both Bayesian Nash and exact program equilibrium, isolating exactly where the three diverge. Month 5: write and revise.

  Specify what counts as success: a clean formalization plus at least one non-trivial result showing that distributional program equilibrium yields outcomes neither reproducible by Nash reasoning nor requiring perfect identity—e.g., cooperation that scales smoothly with the similarity parameter. Specify failure honestly: if the relaxation collapses immediately to Bayesian reasoning, or if hidden assumptions (unbounded computation, perfect knowledge of the family) make the model equivalent to one of the existing extremes, then there is no distinct middle ground.

  Keep the scope realistic for one semester: purely theoretical, no empirical implementation, no deep results in computability theory beyond what's needed to bound the simulation, and no broad claims about general AI alignment. Do not include a bibliography, citation list, or reading list; I will supply references myself. Write in a precise, skeptical-of-hand-waving style typical of rationalist forums. Begin the response with the proposal text itself—no preface, no commentary, no restatement of the prompt. The first sentence should state the bottom-line claim (that distributional program equilibrium occupies a structurally distinct intermediate regime), followed immediately by the reasoning, method, success/failure conditions, and scope.
