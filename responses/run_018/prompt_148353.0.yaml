answer: |-
  **Distributional program equilibrium occupies a structurally distinct intermediate regime between exact program equilibrium and standard Bayesian Nash equilibrium, resolving an unexamined gap in decision theory by formalizing cooperation under bounded rational agents with probabilistic program similarity.** Standard program equilibrium models (e.g., Tennenholtz, 2004; McAfee, 1984) achieve cooperation in one-shot prisoner’s dilemmas by assuming agents share identical source code, enabling mutual simulation and self-referential cooperation. Human or AI analogues, however, involve agents drawn from a parameterized family (e.g., fine-tuned LLMs) with partial overlap—meaning they share a common prior over program space but possess distinct instances. Existing work either assumes perfect code identity or defaults to common-knowledge rationality (Bayesian Nash), skipping the intermediate case where agents have: (1) knowledge of their own program draw, (2) a common prior over the program family, (3) bounded resources to simulate counterfactual draws, and (4) Bayesian belief updates about opponents. This gap leaves open whether cooperation degrades continuously with falling similarity or collapses discontinuously to Nash defection.  

  ### Core Question  
  Under this relaxation, does cooperation in the prisoner’s dilemma (PD) and a continuous split-the-dollar game persist as a continuous function of program-family similarity, or does the framework reduce immediately to Bayesian Nash equilibrium? Success requires proving that the model yields distinct predictions from both extremes:  
  - **Divergence from Bayesian Nash:** Outcomes must strictly Pareto-dominate Nash equilibria for high-similarity regimes.  
  - **Divergence from exact program equilibrium:** Cooperation probabilities must smoothly decrease (e.g., via a similarity parameter like prior variance) rather than being all-or-nothing.  
  Failure occurs if the model collapses to Bayesian Nash under any non-trivial similarity or if hidden assumptions (e.g., unbounded simulation) make it equivalent to exact program equilibrium.  

  ### Methodological Roadmap  
  **Month 1: Formal Foundations**  
  - Define the **program family** as a set of computable functions \(\mathcal{P}_\theta\) indexed by parameters \(\theta \in \Theta\), with common prior \(P(\theta)\). Programs output actions given opponent descriptions.  
  - Specify **simulation budget**: Maximum computation steps \(K\) per agent for simulating opponent programs. Agents can sample \(m\) programs from \(P(\theta)\) (with \(m\) scaling with \(K\)) and run them for \(\leq K\) steps.  
  - **Belief-updating rule**: After observing opponent’s output (if any), agents update \(P(\theta)\) via Bayes’ rule. Beliefs incorporate simulation evidence and prior similarity.  

  **Month 2: Equilibrium Derivation**  
  - **PD analysis**: Two agents independently draw \(\theta_i, \theta_j \sim P(\theta)\). Define a symmetric equilibrium where each agent’s strategy maps its own \(\theta_i\) and prior \(P(\theta)\) to \(\{Cooperate, Defect\}\). Solve fixed-point conditions for cooperation probability \(p(\sigma)\), where \(\sigma\) quantifies prior concentration (e.g., inverse variance). Test continuity: does \(\lim_{\sigma \to \infty} p(\sigma) = 1\) (exact program coop) and \(\lim_{\sigma \to 0} p(\sigma) = 0\) (Nash defection)?  
  - **Split-the-dollar**: Continuous game where agents bid \(x_i \in [0,1]\); payoffs are \(x_i\) if \(x_i + x_j \leq 1\), else \(0\). Derive bidding strategies under distributional equilibrium. Check if splits are symmetric and efficient when \(\sigma\) is high, and degenerate to zero under low \(\sigma\).  

  **Month 3: Equilibrium Refinement**  
  - **Uniqueness**: Prove that for monotonic priors (e.g., Gaussian), equilibria are unique in PD and split-the-dollar.  
  - **Prior-dependence**: Quantify sensitivity to prior shape (e.g., Laplace vs. Gaussian) via Kullback-Leibler divergence.  
  - **Consistency checks**: If simulation budget \(K \to \infty\), does the model converge to exact program equilibrium? If prior variance \(\to \infty\) (no similarity), does it converge to Bayesian Nash?  

  **Month 4: Comparative Analysis**  
  - **Contrast with Bayesian Nash**: For fixed \(P(\theta)\), show Bayesian Nash agents defect in PD regardless of \(\sigma\) due to common-knowledge rationality.  
  - **Contrast with exact program equilibrium**: Demonstrate that exact cooperation requires \(P(\theta)\) to be a delta function; any non-zero variance lowers \(p(\sigma)\) below 1.  
  - **Divergence point**: Identify the critical \(\sigma\) where distributional equilibrium’s cooperation rate first exceeds Bayesian Nash’s 0%.  

  **Month 5: Synthesis and Revision**  
  - Consolidate results into theorems with proofs.  
  - Test robustness: Vary simulation budget \(K\) and program family complexity (e.g., finite vs. infinite \(\Theta\)).  
  - Refine definitions to close loopholes (e.g., simulation shortcuts that imply unbounded rationality).  

  ### Success vs. Failure Conditions  
  - **Success**: A tractable model yielding:  
    - Non-trivial PD cooperation (\(p(\sigma) > 0\)) for finite \(\sigma, K\), strictly exceeding Bayesian Nash.  
    - Smooth decay of cooperation as \(\sigma \to 0\), with \(p(\sigma)\) differentiable in \(\sigma\).  
  - **Failure**: The model collapses if:  
    - Cooperation requires \(K = \infty\) or \(\sigma = 0\) (Bayesian Nash recapitulated).  
    - Bounded simulation implies agents ignore opponents, reducing to Nash play.  
    - Belief updating is intractable without perfect knowledge of \(P(\theta)\).  

  ### Scope Constraints  
  - **Realism**: No empirical validation, human subjects, or AI implementation.  
  - **Computation**: Simulation bounded by finite \(K\); no uncomputable functions.  
  - **Generality**: Focus on PD and split-the-dollar; no claims about AI alignment or general games.  
  - **Formalism**: Avoid hand-waving in belief updating; explicitly bound computation and prior knowledge.  

  This work isolates the mechanics of partial program similarity—a prerequisite for modeling real-world cooperative entities—and forces decision theory to confront the neglected middle ground between perfect clones and idealized rationality.
