answer: |-
  Your intuitions consistently reflect **structural realism about universals**, where universals exist only when there is an identical abstract structure or formal pattern instantiated across cases.  

  ### Analysis of Your Cases:  
  1. **Two red bricks share redness**: Accepted because color properties are identical structural patterns of light reflection/neural processing.  
  2. **Red brick vs. mental afterimage**: Rejected—no shared physical/neurological structure; only subjective resemblance.  
  3. **Drawn triangle vs. geometric triangle**: Accepted—both instantiate identical mathematical relations (three vertices, angles summing to 180°).  
  4. **Human heart vs. mechanical pump**: Rejected—no shared physical structure; only functional similarity (blood-moving role).  
  5. **Just law vs. just person**: Rejected—justice here is a normative role or function, not an identical structural property.  

  ### Resolution for AI Case:  
  - **Identical AIs share "intelligence" as a universal**: Their weights encode the *exact same mathematical structure* (neural network architecture). The server hardware is irrelevant—like differing paper for identical blueprints. Intelligence here is the computational form, not the physical substrate.  

  ### Application to "Game-ness":  
  - **Games share a universal "game-ness"**: Wittgenstein’s "family resemblances" fail your test. Instead, define games by a *core structural pattern*:  
    - **Formal rules** (chess moves, soccer penalties),  
    - **Goal-oriented conflict** (winning conditions),  
    - **Voluntary participation**.  
    Chess, soccer, and your new boardgame all instantiate this abstract rule-based interaction structure, making "game" a universal.  

  ### Core Principle:  
  **A universal exists iff multiple instances exhibit *numerically identical* formal/structural properties, independent of material implementation or functional roles.** This preserves all your intuitions without contradiction.
