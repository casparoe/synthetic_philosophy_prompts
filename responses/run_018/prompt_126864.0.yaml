  Okay, the user is asking about a specific defensive pattern in debates where cultural causes are invoked for institutional changes. Let me start by breaking down their description. They outline a three-step move: first, a claim that culture C is necessary for outcome O. Then, when counter-examples show societies with C but not O (or vice versa), the defender introduces a partner condition P. P is tailored post-hoc to explain away the counter-examples, making the original claim unfalsifiable.

  The user wants to know if there's an established term for this. I recall concepts like Lakatos's protective belt, where auxiliary hypotheses protect a core theory. But in this case, P isn't independently tested, so it's different. Weber's elective affinity describes mutual reinforcement, not necessary causation. Ad hoc reasoning is close, but usually involves modifying the original hypothesis directly. Here, P is added as a shield without altering C's necessity.

  Maybe the term "conjunctural alibi" fits. It emphasizes the post-hoc pairing (conjunctural) and the excuse-like function (alibi). Need to differentiate from legitimate interaction effects, where P is specified beforehand and testable. For example, a hypothetical: Scholar claims Protestant ethic (C) necessary for capitalism (O). Counter-examples like Catholic Flanders having capitalism without C. Scholar then says P (say, autonomous merchant guilds) substitutes for C. But P wasn't originally part of the theory, only introduced after the fact, defined narrowly to fit. 

  Also, considering the user's background: they're a philosopher of social science, so they'd want precise distinctions from related concepts. They might need this for academic writing or critique. Their deeper need is likely to rigorously identify and label this fallacy to prevent scholarly evasion. Ensuring the proposed term clearly separates from valid causal complexity is key.
answer: |-
  ### Bottom Line
  The precise configuration is best termed **conjunctural alibi**, a form of *immunisation via unfalsifiable causal pairing*.  

  ### Logical Structure  
  1. **Core Claim**: "C is necessary for O."  
  2. **Counter-example**: Cases of C without O, or O without C.  
  3. **Immunising Move**: Introduce partner P *post hoc*, claiming:  
     - C → O *only* with P (explaining C without O)  
     - P *alone* → O when C is absent (explaining O without C)  
     - P is defined *retrospectively* to match O’s presence/absence.  

  **Boundary Conditions** (vs. legitimate interaction effects):  
  - P is not specified *ex ante* or independently operationalized.  
  - P’s definition shifts to absorb counter-evidence.  
  - No testable conditions for falsifying C’s necessity exist.  

  ### Relation to Existing Concepts  
  - **Weber’s elective affinity**: Denotes mutual reinforcement (C↔O), not *necessary causation*. Weber avoids deterministic claims.  
  - **Lakatos’s protective belt**: Auxiliary hypotheses *are* testable; here P is immunising, not empirically risky.  
  - **Ad hoc reasoning**: Overlaps, but standard ad hoc modifies C *directly*; this *adds a movable shield* (P) without altering C.  

  ### Illustration: Hypothetical Case  
  **Claim**: Confucian ethics (C) necessary for East Asian industrialization (O).  
  **Counter**: Industrialized Philippines (O) lacks C; pre-industrial Qing China (C) lacks O.  
  **Conjunctural Alibi**:  
  - For Philippines: "Strong Spanish legal institutions (P) substituted for C."  
  - For Qing China: "Absence of colonial markets (P) blocked C’s effect."  
  P is retrofitted to "explain" all outcomes, shielding C from falsification.  

  ### Key Distinction  
  Legitimate interaction effects pre-specify *testable* conditions for C’s operation; conjunctural alibi renders C perpetually non-falsifiable via elastic P.  

