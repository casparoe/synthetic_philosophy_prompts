answer: |-
  Here is a targeted teaching plan structured for your specific pedagogical goals, designed to force confrontation with the ontological threat of the sorites to institutional identity while systematically intercepting misconceptions:

  **Core Pedagogical Architecture: Dependency Order & Conceptual Sequencing**

  1.  **Grounding Institutional Properties (10 mins):**
      *   **Start:** Define institutional properties (e.g., "binding legal authority," "money," "president") as *ontologically distinct* from natural properties. Emphasize their *mind-dependent*, rule-constituted, and collective acceptance-dependent nature. Use a simple, non-gradable example (e.g., "checkmate" in chess - it either is or isn't based on rules/acceptance).
      *   **Key Point:** "These properties exist *because we hold them to exist* according to shared rules and practices. Their reality is *institutional*, not physical."
      *   **Interception Point (Misconception: Vagueness = Language):** Ask: "If we perfectly defined 'binding legal authority' in a statute, would that guarantee there are *never* borderline cases in its application?" (Goal: Elicit 'no', planting seed that the issue isn't *just* definitional).

  2.  **Introducing Gradable Institutional Properties (10 mins):**
      *   **Concept:** Distinguish non-gradable institutional properties (like checkmate) from *gradable* ones (like "binding authority," "significant precedent," "reasonable doubt," "fair use"). Highlight that gradability manifests as *degrees* of influence, effectiveness, applicability, or scope *within the institutional framework itself*.
      *   **Key Point:** "Gradability here isn't about imprecise words; it's about the *ontological structure of the institutional fact*. The property itself admits of degree based on complex, interacting social and rule-based factors." Contrast with "tall" (potentially semantic/predicate vagueness) vs. "binding authority" (institutional gradability).
      *   **Interception Point (Misconception: Ontological vs. Semantic):** Explicitly state: "We are not yet talking about the *word* 'binding' being vague. We are talking about the *property of being binding* potentially having degrees of strength or applicability *as a feature of the legal institution itself*." Ask: "Can a precedent be *partially* binding? In what sense, institutionally?" (E.g., binding only on certain courts, only for certain types of claims, only if facts X and Y are present).

  3.  **Presenting the Sorites Structure Abstractly (Without Heaps) (10 mins):**
      *   **Structure:** Introduce the *logical engine* of the sorites:
          1.  Premise 1: Clear Case (X0 possesses the property P to a maximal degree - e.g., Landmark Precedent R0 has full, unambiguous binding authority).
          2.  Premise 2: Small Difference Principle (If Xn possesses P, then Xn+1 possesses P, where the difference between Xn and Xn+1 is *institutionally insignificant*).
          3.  Premise 3: Clear Non-Case (X1000 does *not* possess P - e.g., The 'precedent' R1000 has no binding force).
          4.  Conclusion: Contradiction (X0 possesses P, therefore X1 possesses P... therefore X1000 possesses P, but Premise 3 says it doesn't).
      *   **Key Point:** Emphasize the *small difference principle* as the crux. "The paradox arises because *each step seems individually acceptable* within the institutional logic, yet the cumulative effect destroys the property. The threat is *structural*: How can a property defined by rules tolerate such incremental, acceptable erosion?"
      *   **Crucial Avoidance:** Do NOT use "heap," "bald," or any natural-kind/sensory predicate. Use abstract labels (Case X0, X1...X1000; Property P).

  4.  **Applying the Structure: Legal Erosion as the Carrying Case (15 mins):**
      *   **The Example:** Present the scenario of a landmark precedent (R0) being eroded through successive, seemingly minor distinctions in lower court rulings (R1, R2, R3,... R1000).
      *   **Properties the Example MUST Have:**
          *   Each distinction (R_n to R_n+1) is *individually justifiable* within legal reasoning (distinguishing facts, narrowing scope, interpreting dicta) – satisfying the "institutionally insignificant difference" premise.
          *   The cumulative effect is the *material hollowing out* of R0's binding authority (R1000).
          *   **NO Formal Moment:** Emphasize R0 was *never formally overturned*; it remains "on the books," its *technical identity* (as *that* case) is preserved, but its *institutional property* (binding authority) is effectively gone.
          *   **Focus on Property Erosion:** Frame it as the erosion of the *degree* of the *property* "binding authority" possessed by R0 *itself* through the series of institutional acts (distinctions).
      *   **Properties the Example MUST Lack:**
          *   Heap/Sand imagery (already avoided).
          *   Any appeal to linguistic imprecision in the *original ruling*. Assume it was drafted perfectly clearly.
          *   A clear threshold where authority "snaps." The erosion is gradual and seamless.
      *   **Key Question:** "At what *specific* ruling (Rn) did R0 cease to be binding? Why *that* one and not the one before or after?" (Force confrontation with the lack of a non-arbitrary boundary *within the institutional practice*).
      *   **Interception Point (Misconception: Fuzzy Logic):** When (inevitably) suggested: "Fuzzy logic might assign degrees to *how binding* R0 is at each step. But does that solve the *ontological* problem? If we say R0 is '0.8 binding' after R50, *what institutional fact* does that number correspond to? Does it tell us whether a court *is institutionally obligated* to follow R0 in a new case? Fuzzy logic describes the gradient, but it doesn't explain *how the institution sustains the identity of R0* or *what constitutes its bindingness* as it's eroded. It risks *re-describing* the vagueness in the property without resolving the paradox for the *existence conditions* of the institutional fact."

  5.  **Centering the Ontological Threat (5 mins):**
      *   **Reframe:** "The sorites, applied here, isn't primarily a puzzle about the *word* 'binding' or 'authority.' It's a challenge to the *ontology of institutional reality itself*: How can a rule-constituted property, whose existence depends on collective recognition and practice, persist *as the same property* through a series of individually insignificant changes that collectively destroy its core function? What secures the identity of the institutional fact (R0's bindingness) through this erosion? The paradox suggests there might be no principled, non-arbitrary way to do this within the logic of gradual institutional change."
      *   **Core Threat:** Highlight that the paradox threatens the stability and determinacy of institutional identity over time under gradual pressure.

  **Diagnostic Question for Genuine Understanding (End of Session):**

  > "Suppose we grant that the *linguistic expression* 'binding authority of R0' is vague. Does that adequately explain the *institutional* problem revealed by the gradual erosion scenario? Why or why not? Specifically, what happens to the *institutional fact itself* of R0's bindingness during this process, according to the sorites structure?"

  *   **Why it Works:** This forces students to move beyond the narrative (erosion happened) or semantics (the words are vague). A correct grasp requires:
      1.  Recognizing the distinction between semantic vagueness and the ontological gradation/threat.
      2.  Articulating that the sorites structure shows the institutional fact (the bindingness property of R0 itself) *cannot coherently persist* through the series *despite* the lack of a formal overturning.
      3.  Identifying the core problem: the lack of a non-arbitrary point where the property ceases, threatening the identity and determinacy of the institutional fact.
  *   **Signs of Success:** Answers focusing on the *fate of the fact itself* ("The bindingness just fades away without a clear point, but that shouldn't happen for a rule-based fact," "The institution can't pinpoint when it stops being *that* binding fact") rather than language ("The word 'binding' becomes fuzzy") or solutions ("We need better definitions/fuzzy logic").

  **Explicitly Set Aside Formal Machinery:**

  *   **State Clearly:** "For today's purposes, focused on the *ontological threat* to institutional properties, we are deliberately setting aside detailed formal approaches proposed to *model* vagueness, such as:
      *   **Supervaluationism** (truth gaps, precisifications)
      *   **Degree-Theoretic Semantics**/Fuzzy Logic (truth values between 0 and 1)
      *   **Epistemicism** (sharp but unknowable boundaries)
  *   **Reason:** "While these are important tools in philosophy of language and logic for *describing* vagueness, our goal here is more fundamental: to see *why* the sorites structure poses a deep *metaphysical* challenge to the nature and persistence of gradable institutional facts themselves, *regardless* of which formal model we might later use to represent the problem. We are examining the phenomenon, not (yet) the potential solutions or formalizations."

  This plan systematically builds the necessary conceptual foundations (institutional properties → gradability → sorites structure), deploys a carrying case meticulously designed to mirror the paradox's logic while avoiding misleading intuitions, intercepts key misconceptions at their likely points of emergence, provides a diagnostic tool focused on ontological understanding, and clearly demarcates the intended scope by excluding advanced formal semantics. It centers the "structural threat" as requested.
