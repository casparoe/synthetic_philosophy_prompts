prompt: |-
  I'm a distributed-systems engineer with working knowledge of consensus protocols, message-passing architectures, and asynchronous-network impossibility results, but without formal training in quantum foundations. Restate Bell's theorem—specifically the argument that any local hidden-variable model must respect the CHSH bound and that quantum mechanics predicts correlations violating it—entirely in the vocabulary I actually use: nodes, local state versus shared state, synchronization primitives, happens-before relations, message-delay bounds, and results such as the impossibility of consensus in asynchronous systems with faulty processes. For each component of the locality assumption, identify its closest counterpart in distributed computing. Then deliver the residue report: which claims about quantum correlations survive translation cleanly, which must be distorted to fit network-language analogies, and whether the distinction between parameter independence and outcome independence can even be articulated without importing physical concepts that have no engineering equivalent. Finally, assess whether my intuition that Bell's result is essentially a distributed-system impossibility proof captures the argument or suppresses something structurally essential—particularly anything concerning single-event outcomes rather than statistical bounds across runs. Keep the reasoning concrete and avoid appeals to authority or citation.
