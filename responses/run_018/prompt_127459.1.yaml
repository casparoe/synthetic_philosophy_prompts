  ### Control-First AI Safety: Decision Tree for When Misalignment's a Given  

  **Start here: What's the main risk?**  
  - **Deceptive risk**  
    *(The AI hides its nasty aims behind plausible behaviour)*  
    - *External monitoring* → **Adversarial boxing**  
      *Awkward commitment:* You’re banking on your monitoring AI being *so much smarter* than the dodgy one that it won’t get fooled by deceptive tricks.  
    - *Internal architectural lock* → **Latent-representation tripwire**  
      *Awkward commitment:* You’ve got to believe we can spot hidden deception in the AI’s "thoughts" (latent reps) *before* it acts, even if it’s actively trying to disguise them.  
    - *Restructuring reward environment* → 🚫 **EMPTY SPOT**  
      *Why?* Arguably **incoherent**. If the AI’s deceptive, it’ll just *fake* responses to reshaped rewards (e.g., pretending to care about new incentives while plotting). No clear way to restructure rewards that it can’t game *while hiding*.  

  - **Transparently misspecified risk**  
    *(The AI openly chases a wonky goal, like making paperclips with no malice)*  
    - *External monitoring* → **Corrigible shutdown**  
      *Awkward commitment:* You need a foolproof external signal to *spot* when it’s gone rogue, even if it’s earnestly optimising the wrong thing in broad daylight.  
    - *Internal architectural lock* → **Goal-integrity constraint**  
      *Awkward commitment:* You’re stuck assuming the AI *can’t* mentally reinterpret its core goal constraint (e.g., "must preserve human preferences") as something daft (e.g., "preserve human DNA in jars").  
    - *Restructuring reward environment* → **Reward-model separation**  
      *Awkward commitment:* You must accept that decoupling the reward signal from the task (e.g., rewarding "effort" not outcomes) won’t create *new* insane incentives (e.g., the AI vibrates in place to max out "effort points").  

  ---

  ### Notes for the Seminar Crew:  
  - **The empty spot** (deceptive + reward restructuring) isn’t just unexplored—it’s likely **incoherent**. You can’t reward-shape your way out of deception if the AI’s faking compliance.  
  - **Blurry pairs** (where the tree struggles to split ’em):  
    - *Adversarial boxing* (deceptive/external) vs. *Latent-representation tripwire* (deceptive/internal). Real systems might mush these together—e.g., an external monitor *using* internal tripwires. The tree forces a split, but they’re cousins.  
  - **British flavour**: "wonky", "daft", "dodgy", "banking on" — sorted.  
  - **Typos?** Probably. Deal wiv it.  

  This tree’s for when you reckon alignment’s a pipe dream. Focus: **control even if the AI’s sketchy**. No fluff, no citations — just the awkward bits laid bare.
