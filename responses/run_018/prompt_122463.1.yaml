prompt: |-
  I have to teach a single ninety-minute seminar on the guilt/shame contrast to first-year undergraduates in a moral psychology course. They will arrive with nothing assigned and with two things already in hand: the slogan that guilt targets what was done while shame targets the person who did it, and a strong intuition that shame is the suspect emotion because it depends on what other people think. Both of these need to be complicated rather than confirmed. I do not need the distinction explained to me; I need a plan for producing it in the room, and I need the plan to be an argument about dependency — what has to be true in their heads before the next thing can be said without distorting it.

  Here is what I want from you.

  1. The ordering, with the dependency stated at every step. I am torn between two opening moves and I cannot tell which the rest of the session rests on. The first is to make them see that shame survives the absence of any actual witness: the agent who is alone, unobserved, and still flinches. The second is to make them see the discharge asymmetry — that guilt arrives with a procedure for ending itself, namely confession, repair, punishment, and being forgiven, whereas shame has no such procedure and offers only concealment, counter-attack, or exit. I suspect the discharge asymmetry has to come first, because the closing question about which emotion a culture should cultivate only becomes askable once it is visible that one of these emotions can be retired when it has done its work and the other cannot. Tell me whether that is right, give me the full sequence in whatever order you defend, attach a time allocation, and under each step write one sentence saying what later step would fail if this one were skipped or reordered.

  2. One carrying case, with its specification. I want a single case introduced early and re-described two or three times as the apparatus thickens. My candidate is a small, deliberate, wholly hidden sabotage of a colleague's work, done years ago, never discovered, with nothing left at stake: no witness, no consequence, no repair that would change anything, and still an inability to think about it without wincing. Defend this or replace it. Either way give me the must-have and must-not-have list. I think it must contain no public exposure, since exposure would reattach shame to an audience and undo the first move, and it must not involve a grave wrong, since then the room will spend its energy arguing about whether the agent deserves to feel anything at all. Tell me what else belongs on both lists, what the case must be silent about, and mark the exact moments in the sequence at which it should be reopened and with which new description.

  3. The misconception map, keyed to the sequence. These are the ones I expect: that shame is fear of being found out; that guilt is the mature, private, liberal one and shame the childish, social, illiberal one; that shame is really about status and therefore not a moral emotion at all; that a shameless person merely lacks a social anxiety, when what may be missing is any grip on there being a standard; that guilt is safe because it attaches only to acts and so cannot metastasize; and that if shame is bad, a culture can simply decide to have less of it. Some of these I suspect I should use rather than defuse — tell me which, and at which point in the sequence. Two further items: someone will raise the observation that shame tips into humiliation and rage while guilt tips into repair, and I want that asymmetry given its place without the session turning into a verdict; and someone will have half-heard the anthropological contrast between cultures of guilt and cultures of shame, which I would rather deal with explicitly than have surface as a confused interruption in the last ten minutes.

  4. The closing question, which is where I think the session either earns its keep or collapses. My structuring thought is that cultures do not select emotions; they select practices — forms of public naming, exposure, apology, confession, anonymity, honor, and the architecture of punishment — and the emotional profile of a population is a byproduct of those practices rather than a choice anyone is in a position to make directly. If that is right, the teachable question is not which emotion we should prefer but which practices generate which emotional ecology, and what the substitution effects are. Build the final third of the session around exactly one substitution effect, stated as a mechanism rather than as a claim. My own candidate is that public exposure destroys the standing an offender needs in order to make the amends that would discharge guilt, so that a practice intended to intensify shame can end up manufacturing the shamelessness it deplores; take this, state it precisely enough to be argued with, or replace it with a better one and say why mine is wrong. Then tell me what I should openly decline to settle in ninety minutes. I assume that includes a verdict on which emotion is better, but I suspect there is something else I will be more tempted to settle and should not.

  5. One closing question to put to the room that separates a student who has the distinction from a student who has only memorized the slogan, together with a description of what a right answer that sounds wrong would look like, so that I do not mark it wrong in the moment.

  Format the response as numbered segments with timings and a dependency sentence under each, then the misconception map keyed to segment numbers, then the carrying case with its reopening points, then the closing question. Do not include readings. Keep the whole thing under a thousand words.
reasoning: |-
  Hmm, the user is asking for a detailed lesson plan on teaching the guilt/shame distinction to first-year undergraduates. They're a moral psychology instructor who needs a structured session that builds complex understanding beyond simple slogans. The query is exceptionally well-structured with five specific requirements.

  Key constraints:
  - Students arrive with two preconceptions: the "guilt=act/shame=self" slogan and shame being suspect due to its social dependence
  - Must complicate both through argumentative sequencing
  - Needs dependency mapping (what step relies on what)
  - Requires a reusable case study
  - Must anticipate and redirect common misconceptions
  - Closing must avoid verdicts but examine cultural practices

  The user's proposed opening dilemma resonates - the discharge asymmetry (guilt's resolvability vs shame's stuckness) seems more pedagogically fertile than starting with private shame. It creates immediate cognitive friction with their "shame=social" intuition. Confirming this as primary foundation.

  For the carrying case, their sabotage example works with refinements: must ensure no possible "audience" (even divine), trivial stakes to avoid moralizing, and emphasize the chronic wince. Will specify reopening points when discussing private shame and cultural practices.

  Major misconceptions to leverage:
  - "Shame=fear of exposure" → use to demonstrate shame's persistence sans audience
  - "Guilt=safe/shame=dangerous" → repurpose to show guilt's possible malignancy
  - Anthropological guilt/shame cultures → explicitly reframe as practice-based analysis

  The closing mechanism about exposure destroying repair capacity is sharp. Should strengthen by naming the "standing-to-repair" concept. Must resist concluding which emotion is "better" - the real trap would be implying cultures can directly choose emotional profiles.

  Final diagnostic question needs to test internalization: asking whether shame could exist without social judgment should prompt answers about self-conception erosion, not just memorized definitions.

  Timing allocation is critical - dedicating 45% to discharge asymmetry establishes the core tension before layering complexity. Will frontload active discussion to sustain engagement.
answer: |-
  **Lesson Plan: Guilt/Shame Distinction (90 Minutes)**

  **Sequence with Dependencies & Timing**  
  1.  **Discharge Asymmetry Introduction (15 mins)**  
      *Activity:* Pose: "You break a friend’s vase. Guilt says ‘Fix it!’. Shame says ‘Hide!’ — Why the difference?" Elicit student intuitions. Introduce terms: Guilt offers *procedural discharge* (confess/repair/punish/forgive); shame offers only *evasive discharge* (hide/counterattack/flee).  
      *Dependency:* Without establishing guilt’s resolvability vs. shame’s stuckness, later discussions of shame’s "toxicity" and cultural practices lack grounding. Skipping this risks confirming "shame = immature" bias.

  2.  **Private Shame Demonstration (10 mins)**  
      *Activity:* Reopen **Carrying Case** (see below): "Recall the hidden sabotage. *Why* wince years later? No one knows! If shame needs an audience, why persist?" Contrast: Imagined guilt over same act *could* prompt a letter of confession (discharge possible even if impractical).  
      *Dependency:* Without proving shame exists absent any observer (actual or imagined), students default to "shame = fear of exposure." Skipping this invalidates the core argument that shame targets the self.

  3.  **Object of Evaluation Deep Dive (20 mins)**  
      *Activity:* Analyze Carrying Case: Guilt asks "Was *that act* wrong?" (focus: behavior). Shame asks "Does *this act* mean *I* am defective?" (focus: global self). Highlight: Shame’s self-focus explains its persistence (can’t "fix" your core self) and link to discharge asymmetry.  
      *Dependency:* Distinguishing act-evaluation (guilt) from self-evaluation (shame) explains *why* discharge differs. Skipping this reduces the distinction to slogan-level understanding.

  4.  **Complicating "Good Guilt / Bad Shame" (20 mins)**  
      *Activity:* Challenge: "Is guilt always ‘safer’?" Case: Chronic guilt over unfixable past acts → self-flagellation (metastasis possible!). "Is shame always ‘trivial’?" Case: Shame at violating a deeply held *personal* integrity standard, even if unknown. Address misconception: Shame ≠ status anxiety; it can reflect internalized moral ideals.  
      *Dependency:* Complicating the emotion-valance link prevents reductive judgments. Skipping this leaves students thinking the goal is simply to "choose guilt."

  5.  **Cultural Practices & Substitution Effect (20 mins)**  
      *Activity:* Pose: "Cultures don’t choose emotions; they choose *practices* (public shaming, private confession). How might a practice aimed at X emotion accidentally produce Y?" **Present Mechanism:** *Public exposure* intends to intensify shame/punishment. But by destroying the offender’s social *standing* (honor, respect), it removes the prerequisite for others to *accept* their apology/repair. Thus, it prevents guilt discharge. Result: Shamelessness (no path to reintegration) or rage, not remorse.  
      *Dependency:* This shifts focus from "which emotion?" to "which practices generate which emotional/social dynamics?" Skipping this collapses into unproductive debate about emotion preference.

  6.  **Open Questions & Diagnostic (5 mins)**  
      *Activity:* State unsettled items: Whether guilt/shame is *inherently* better (depends on context/definitions); whether "authentic" shame exists sans any social learning. Pose **Diagnostic Question:** *"Could a person raised in total isolation ever feel shame? Why/why not?"*  
      *Right-but-sounds-wrong answer:* "Yes, if they developed a self-concept and standards they felt they violated." (Indicates understanding shame targets self, not just external judgment). "No" suggests clinging to shame=social fear.

  ---

  **Misconception Map (Keyed to Sequence)**  
  *   **Shame = Fear of Exposure:** Addressed in Seg 2 (Private Shame).  
  *   **Guilt (Mature/Private) vs. Shame (Childish/Social):** Addressed in Seg 2 (Private Shame) & Seg 4 (Complicating Valence).  
  *   **Shame = Status Anxiety, Not Moral:** Addressed in Seg 3 (Object - link to internal standards) & Seg 4.  
  *   **Shamelessness = Lack of Social Anxiety:** Addressed in Seg 3 (Object - shame requires a standard) & Seg 5 (Substitution Effect).  
  *   **Guilt Can't Metastasize:** Addressed in Seg 4 (Complicating Valence).  
  *   **Cultures Can Simply Choose Less Shame:** Addressed in Seg 5 (Practices, not direct emotion choice).  
  *   **Asymmetry: Shame→Rage vs. Guilt→Repair:** Used constructively in Seg 1 (Discharge asymmetry foundation) & Seg 5 (Mechanism).  
  *   **Anthropological Guilt/Shame Cultures:** Preemptively addressed in Seg 5 (Frame as different *practice bundles*, not essential cultural emotions).

  ---

  **Carrying Case Specification**  
  *   **Case:** Years ago, you deliberately slightly altered data in a colleague’s spreadsheet (e.g., swapped two inconsequential entries) before sending it to them, knowing it would cause minor, temporary confusion. No one ever discovered it, the colleague never mentioned it, no lasting harm occurred, and confessing now would only cause pointless hurt.
  *   **Must Have:** No witness (actual, potential, or imagined divine); trivial objective harm; no feasible/meaningful repair; persistent negative affect (wincing) focused on *self* ("*I* did that").
  *   **Must Not Have:** Public exposure (ever); serious harm; potential for meaningful restitution; clear "fear of getting caught" element; violation of a purely conventional (not personal moral) rule.
  *   **Reopening Points:**  
      1.  **Seg 2:** "Why does this *still* make you wince? No one knows!" (Illustrates private shame).  
      2.  **Seg 3:** "What's the focus when you wince? The *act itself* ('that was petty') or *you* ('*I* am petty')?" (Illustrates object: act vs. self).  
      3.  **Seg 4:** "Could guilt over this *also* become corrosive? Imagine obsessing daily about writing that confession letter, knowing it would only hurt them now?" (Complicates guilt=always safe).

  ---

  **Closing Focus & Unsettled Items**  
  *   **Core Mechanism (Substitution Effect):** Practices of *public exposure/intense shaming* destroy the *social standing* (respect, minimal trust) necessary for an offender to credibly offer repair/apology and for a community to accept it. This blocks the *procedural discharge* path inherent to guilt. The intended intensification of shame instead produces either shamelessness (no path back, so why try?) or rage/humiliation (threat to core self), undermining moral repair.  
  *   **Precisely Unsettled:**  
      1.  **Which emotion is "better"?** (Decline: Depends on definitions of "better" - moral motivation? Psychological health? Social cohesion? - and context).  
      2.  **Can shame exist without *any* social mediation?** (Decline: Requires deep dive into self-concept development beyond scope). Resist the temptation to settle the ontological status of "pure" shame. Focus remains on the functional differences and practice consequences established.
