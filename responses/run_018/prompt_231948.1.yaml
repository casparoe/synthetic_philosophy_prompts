prompt: |-
  I am a third-year doctoral student in clinical psychology, splitting my time between a training clinic and a lab that studies emotion and decision-making, and I keep hitting the same problem in both places: when someone reports on their own mental life, how much weight should that report carry? My clinical supervisors treat clients' self-report as close to the gold standard, while the cognitive psychologists I work with will not let uncorroborated introspective evidence into a manuscript. From coursework I suspect introspection is not one thing — describing a current experience, explaining why one did something, and reconstructing one's past inner life are different acts with different reliability — but I have never seen that insight turned into something I can run in the fifteen minutes before I write a chart note or code an interview excerpt. Several times a week I must decide whether a first-person report should shape a clinical formulation or a research conclusion, and my supervisors sign off on both, so the procedure has to be defensible to people with strong instincts in both directions.

  Please write a decision procedure for how much to trust an introspective report. Present it as questions to ask in order, where each answer leads to a next step or a stop; for each question, say what counts as a sufficient answer. The procedure should mark the points where the decision stops being epistemic and becomes a value judgment, and it should reflect what is actually distinctive about introspective reports rather than collapsing into generic skepticism about self-report. Then apply it to three cases: (1) a participant in a choice experiment who says, with complete confidence, that she chose the safer-looking option because she is a cautious person; (2) a client who, during a mood exercise, reports a faint, diffuse dread at the back of his throat and can describe it as it is occurring; (3) a client whose emotionally vivid, articulate account of how one childhood event caused his current avoidance I would like to treat as the key to the case — I want the procedure's honest verdict here even if it says my preferred reading should not go into the clinical record. End by saying what the procedure cannot adjudicate and where it will misfire even when followed carefully. Keep it to at most 1,000 words, and write it in American English.
reasoning: |-
  Okay, the user is a third-year doctoral student in clinical psychology, juggling between clinical work and a research lab. They're struggling with how much weight to give introspective reports in both settings. Clinicians treat self-reports as gold, while cognitive psychologists dismiss uncorroborated introspection. They need a practical decision procedure to evaluate these reports quickly.

  I need to create a step-by-step decision tree with clear questions. Each answer should lead to the next step or a conclusion. The procedure must distinguish between epistemic and value judgments and highlight what's unique about introspection. Then apply it to three cases they provided.

  First, I should outline the key factors that affect introspective reliability: immediacy (description vs. explanation), cognitive demands, emotional state, narrative reconstruction, and verbal skills. These will form the basis of the questions.

  For the decision procedure, start with the immediacy of the report. If it's describing current experience (like sensations), it's more reliable. Then check accessibility: can the person observe the state without interference? Next, consider causal claims—these are high risk because people often confabulate reasons. Look for corroborating evidence, either behavioral or physiological. Also, assess the person's metacognitive awareness and any biases like self-presentation or mood effects.

  The procedure must stop when it shifts from evidence to values. For example, in clinical settings, even if a report is low-evidence, it might be valued for therapeutic reasons. That's a value judgment, not epistemic.

  Now, applying to the cases:
  1. The participant claiming she chose the safe option because she's cautious. This is a causal explanation. The procedure should flag it as low-evidence due to confabulation risk. Without corroboration, it's weak for research but might be noted with caveats.
  2. The client describing current dread in their throat. High immediacy, accessible, low cognitive demand. This should be high-evidence. Corroboration isn't necessary here because it's a direct sensation.
  3. The client's childhood narrative causing current avoidance. This is reconstructed memory with causal claims. Needs corroboration. If none, it's low-evidence. But clinically, it might still be valued for therapeutic narrative—value judgment step.

  The procedure won't handle cases with severe pathology or cultural differences in expression. Also, it might misfire if there's undetected corroboration or if the assessor misjudges accessibility.

  I need to ensure each step is concise, with clear criteria for sufficient answers. The whole thing must be under 1000 words. Use American English, avoid jargon where possible, and make it practical for quick use in clinic or lab.
answer: |-
  Here is a decision procedure for evaluating the epistemic weight of an introspective report, designed for rapid clinical or research use. It focuses on the *distinctive challenges of introspection* (confabulation, inaccessibility, reconstruction) rather than general self-report issues (e.g., lying, forgetting).

  **Decision Procedure: Trusting Introspective Reports**

  1.  **What is the *primary intent* of the report?** (Focus: Distinguishing description from explanation/reconstruction)
      *   **Sufficient Answer:** Categorize as:
          *   **A. Descriptive Phenomenology:** Reporting a *currently occurring* sensory, emotional, or perceptual experience *as it is felt* (e.g., "I feel a tightness in my chest now," "This image looks blurry"). → **Proceed to Q2.**
          *   **B. Causal Attribution/Explanation:** Stating a *reason* for a past thought, feeling, or behavior (e.g., "I did X because I felt Y," "I feel Z because of A"). → **Proceed to Q4.**
          *   **C. Retrospective Reconstruction:** Recalling or narrating past internal states or events, especially over longer time spans or involving complex narratives (e.g., "Back then, I always felt...", "That childhood event made me..."). → **Proceed to Q4.**
      *   *Rationale:* Reliability decreases sharply from A to C. A involves direct access; B & C involve inference and reconstruction prone to error.

  2.  **For Descriptive Phenomenology (A): Is the reported state *directly accessible* and *low-demand* to observe?** (Focus: Minimizing inference/cognitive load)
      *   **Sufficient Answer:** Assess:
          *   **Yes:** The state is a basic sensation, simple emotion, or percept requiring minimal interpretation or cognitive effort to identify *as it occurs* (e.g., location of pain, basic emotion label like "sad," presence of an intrusive thought/image). → **Proceed to Q3.**
          *   **No:** The state requires significant interpretation, complex labeling, or inference *even as it occurs* (e.g., identifying a "subconscious motive," a complex blend of nuanced feelings, the "meaning" of a sensation). → **Treat as lower-evidence; Proceed to Q4 cautiously.**
      *   *Rationale:* States requiring high inference during reporting are less reliable as pure descriptions.

  3.  **For Accessible Descriptive Phenomenology (A-Yes): Is there *concurrent corroboration* feasible and available?** (Focus: Opportunistic validation)
      *   **Sufficient Answer:** Check if *any* plausible, concurrent evidence exists *right now*:
          *   **Yes (Corroborating):** Observable behavior (flinching, crying, gaze aversion), physiological data (heart rate spike on monitor, galvanic skin response), or therapist observation consistent *in timing and context* (e.g., client reports panic *while* hyperventilating and sweating). → **Assign HIGH Epistemic Weight.** (Evidence: Strong immediate report + convergence).
          *   **Yes (Contradicting):** Observable behavior/physiology strongly contradicts the report *in timing and context* (e.g., client reports intense calm *while* pacing, shouting, with HR 120bpm; participant reports no anxiety *while* showing strong fear-potentiated startle). → **Assign LOW Epistemic Weight to *this specific report*; investigate discrepancy.** (Evidence: Report contradicted).
          *   **No/Not Feasible:** No relevant concurrent data available or plausible (common for internal sensations like diffuse dread, fleeting thoughts). → **Assign MODERATE-HIGH Epistemic Weight *as description of current experience*.** (Evidence: Best available direct access). → **STOP (Epistemic).**
      *   *Rationale:* When describing simple, current states, the report is often the best evidence unless contradicted.

  4.  **For Causal Attribution/Explanation (B) or Reconstruction (C): Is there *independent corroborating evidence* for the claimed cause/reconstruction?** (Focus: Combating confabulation & reconstructive error)
      *   **Sufficient Answer:** Actively seek evidence *independent* of the person's self-report:
          *   **Yes (Strong):** Objective records (diaries written contemporaneously, medical records), credible corroborating witnesses, experimental manipulation showing the *claimed cause* actually leads to the *effect* in this person/context, behavioral patterns strongly predicted *only* by the claimed cause/reconstruction. → **Assign MODERATE-HIGH Epistemic Weight.** (Evidence: Report supported externally).
          *   **Yes (Suggestive):** Plausible behavioral patterns, known mechanisms, or contextual factors *consistent* with the report, but not uniquely predictive. → **Assign LOW-MODERATE Epistemic Weight.** (Evidence: Report plausible but not confirmed).
          *   **No:** Only the self-report exists to support the causal link or specific reconstruction. → **Assign LOW Epistemic Weight.** (Evidence: Uncorroborated inference/reconstruction). → **Proceed to Q5.**
      *   *Rationale:* B & C reports are highly susceptible to confabulation and narrative bias; external evidence is crucial.

  5.  **For Low-Evidence Reports (B/C-No): What is the *contextual purpose* for using this report?** (Focus: Transition to Value Judgment)
      *   *This step marks the shift from Epistemic (truth-seeking) to Pragmatic/Value-Based judgment.*
      *   **Sufficient Answer:** Determine the primary goal in *this specific context*:
          *   **Understanding Subjective Reality:** (Clinical) The report is valued for understanding the client's *current narrative or lived experience*, regardless of historical accuracy. → **Value Judgment: USE, noting it represents the client's perspective/experience.**
          *   **Therapeutic Alliance/Exploration:** (Clinical) Using the report builds rapport, validates the client, or opens avenues for productive exploration, even if factually uncertain. → **Value Judgment: USE strategically.**
          *   **Generating Testable Hypotheses:** (Research/Clinical) The report is a starting point for further investigation, not a conclusion. → **Value Judgment: USE as hypothesis, not evidence.**
          *   **Establishing Objective Truth/Mechanism:** (Research) The claim needs strong evidence this report cannot provide alone. → **Value Judgment: DO NOT USE as primary evidence; seek corroboration or discard.**
      *   *Rationale:* When epistemic weight is low, the decision to use the report hinges on the *purpose* within the clinical or research activity, not its likely truth value.

  **Application to Cases:**

  1.  **Participant: "I chose the safer option because I am a cautious person."**
      *   Q1: **B (Causal Attribution)**.
      *   Q4: **No** independent corroboration (confidence ≠ evidence; personality isn't manipulated/measured here). → **LOW Epistemic Weight.**
      *   Q5: Context (Research - establishing true choice mechanism). → **Value Judgment: DO NOT USE as primary evidence in manuscript.** Note it as participant's stated reason but emphasize it's uncorroborated and may reflect confabulation/post-hoc justification. Analysis should focus on behavioral data.
      *   *Verdict:* Low trust for research conclusion.

  2.  **Client: Reports current "faint, diffuse dread at the back of his throat."**
      *   Q1: **A (Descriptive Phenomenology)**.
      *   Q2: **Yes** (Describing a current somatic sensation associated with emotion - accessible, low-demand). → **Proceed to Q3.**
      *   Q3: **No/Not Feasible** (No easy concurrent physiological corollary for "dread in throat"). → **Assign MODERATE-HIGH Epistemic Weight as description of current experience.**
      *   *Verdict:* High trust for clinical formulation *as an accurate report of his present subjective experience*. This is core data for understanding his mood.

  3.  **Client: Vivid account of childhood event causing current avoidance.**
      *   Q1: **C (Retrospective Reconstruction)** with embedded **B (Causal Attribution)**.
      *   Q4: **No** independent corroboration specified (assume no diaries, witnesses, or behavioral evidence uniquely tying *this specific event* to *this specific avoidance pattern*). → **LOW Epistemic Weight.**
      *   Q5: Context (Clinical - Understanding subjective reality & potentially therapeutic alliance/exploration). → **Value Judgment: USE in clinical record, BUT frame accurately.**
          *   *Record As:* "Client presents a vivid narrative in which Event X is centrally linked to his current avoidance pattern. He describes this connection with strong emotion and conviction. *This reflects his current understanding and subjective experience of the origins of his difficulty.*" (Focus on his present perspective, not historical truth).
      *   *Honest Verdict:* While powerful and clinically relevant (hence record it!), its status as *the key objective cause* has **low epistemic weight**. Your preferred reading (as *the* key) shouldn't be stated as fact without corroboration. The procedure forces you to separate the compelling narrative from its objective truth value.

  **Limitations & Failure Modes:**

  *   **Cannot Adjudicate:**
      *   **Severe Pathology:** Reliability of Q2/Q3 judgments plummets in psychosis, severe dissociation, or neurological impairment affecting insight.
      *   **Cultural Expression:** Norms for reporting internal states vary; "accessibility" (Q2) is culturally mediated. The procedure assumes Western individualistic norms without adjustment.
      *   **"Gut Feelings" & Intuition:** The epistemic status of vague, non-sensory internal reports (e.g., "I just knew") remains ambiguous.
      *   **Ultimate Truth:** Cannot prove any introspective report is definitively "true," only assess its likely reliability based on type and evidence.
  *   **Will Misfire (Even if Followed):**
      *   **Undetected Corroboration/Contradiction:** Relevant behavioral/physiological data might be missed or misinterpreted (Q3/Q4).
      *   **Misjudging Accessibility (Q2):** An assessor might wrongly deem a state "low-demand" or "high-demand" for that individual.
      *   **Covert Value Judgment Creep:** Bias might influence Q4 evidence search ("plausible" is subjective) or Q5 justification, dressing values as epistemology.
      *   **Over-simplification:** Complex reports mix A, B, and C elements; forcing a primary intent (Q1) can be reductive.
      *   **Ignores Therapeutic Utility of "Inaccurate" Narratives:** While Q5 addresses values, it might undervalue narrative coherence's *functional* role in recovery, even if historically inaccurate.

  This procedure forces explicit consideration of the *type* of introspection, leverages corroboration where feasible, and cleanly separates the question of "Is this likely true?" from "Should I use this anyway, and how?". It provides defensible scaffolding for rapid decisions in both clinic and lab.
