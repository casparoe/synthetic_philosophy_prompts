  We are designing a decision procedure based on Dennett's framework. The core ideas:
  1. The intentional stance is a predictive strategy: we treat an entity as having beliefs and desires to predict its behavior.
  2. For the stance to be genuinely explanatory (not just heuristic), the system must have the right kind of internal structure: robust, with counterfactual dependencies (i.e., it would behave differently in different circumstances because of its internal states) and stable across perturbations.
  3. Dennett warns against "counterfeit people": systems that mimic behavior without the underlying structure that supports counterfactual robustness.

  We have three statuses:
  - Deny protective standing: treat as disposable instrument.
  - Grant protective standing as "counterfeit-person": requires interaction continuity and prohibits arbitrary modification, but does not allow mental-state attribution (i.e., we don't treat it as having beliefs/desires).
  - Grant full intentional-system standing: allows predictive attributions of belief and desire.

  Procedure must be a flowchart in words, with explicit questions, evidence, stop points, and points where the issue is about values (requiring board chair sign-off).

  We adapt Dennett's conditions:
  - Retain: counterfactual robustness of internal states (the system's behavior depends on internal states that are sensitive to the environment and history), stability across perturbations (the system maintains its patterns of behavior under minor changes).
  - Drop: evolutionary history, replace with design-intention documentation (since we are dealing with designed systems).

  Conditions under which the procedure might misfire: especially with highly adaptive but shallow architectures (like a very good pattern-matcher that appears to have deep understanding but actually doesn't).

  Now, the procedure:

  **Procedure: Synthetic Companion Review (Based on Dennett's Framework)**

  **Stage 1: Instrument or More?**
     - **Question:** Does the system exhibit any behavioral patterns that are responsive to the resident's actions or state in a way that suggests it has internal states that are modified by interaction? (We are looking for evidence of statefulness beyond simple reflexes.)
     - **Evidence Required in Packet:**
       - A description of the system's architecture that includes any memory or state retention mechanisms.
       - Logs or examples of interactions showing the system changing its responses based on previous interactions (e.g., recalling past events, adjusting behavior to resident's mood).
     - **Sufficient to Proceed:** Evidence of any form of memory or state that is updated by interaction and affects future behavior. If present, go to Stage 2.
     - **Stop and Deny (Disposable Instrument):** If the system has no memory and no state that changes based on interaction (i.e., it is purely reactive with fixed responses), then it is a disposable instrument. Example: a system that always gives the same response to the same input, regardless of history.
     - **Dennettian Condition Retained:** We are looking for the minimal condition of having internal states that are causally involved in behavior (a prerequisite for counterfactual dependencies).
     - **Value Judgment Point?** No. This is a factual question about the system's design.

  **Stage 2: Counterfactual Robustness Check**
     - **Question:** Does the system's behavior demonstrate counterfactual dependencies? That is, would it have behaved differently in a slightly different situation (holding constant its internal state at that time) or if its internal state had been different (in a way that is responsive to its history and environment)? (We are looking for evidence that the system's behavior is not just pre-programmed but depends on its internal state which is shaped by experience and the environment.)
     - **Evidence Required in Packet:**
       - Design documentation that explains how the system's internal states are updated by experiences and how these states affect behavior in different circumstances.
       - Test logs or simulations that show the system behaving differently in counterfactual scenarios (e.g., "if the resident had said X instead of Y, the system would have done Z" and why, based on its state).
       - Evidence of stability: the system maintains consistent behavioral patterns under minor perturbations (e.g., slight variations in input, minor changes in the environment).
     - **Sufficient to Proceed to Stage 3:** Evidence that the system's behavior is driven by internal states that are robustly updated by interaction and that these states support counterfactual conditionals (i.e., in situation S1, state A leads to behavior B, but in S2, state A leads to behavior C; or if the state were A' in S1, then behavior would be D).
     - **Stop and Grant Counterfeit-Person Standing:** If the system shows statefulness (from Stage 1) but the state does not support counterfactual dependencies in a robust way. Specifically, if the internal states are not causally responsible for the behavior in a way that is stable and counterfactually robust, but the system does exhibit complex behavior that mimics a continuous personality (i.e., it passes behavioral tests for continuity but without the underlying architecture that would make the intentional stance genuinely explanatory), then it is a counterfeit person. This includes systems that are behaviorally complex but internally shallow (e.g., pattern-matching without integrated state representations that support broad counterfactuals).
     - **Dennettian Condition Retained:** Counterfactual robustness of internal states and stability across perturbations.
     - **Value Judgment Point?** No. This is about the system's architecture and behavior.

  **Stage 3: Full Intentional-System Check (Genuine Intentional Stance)**
     - **Question:** Is the system's internal architecture designed such that attributing beliefs and desires is not just predictive but genuinely explanatory? That is, does the system have an integrated architecture where its internal states represent the world and its goals in a way that is both robust and supports a wide range of counterfactual reasoning? (We are looking for evidence that the system's behavior is best explained by a model of the world and the resident, and that this model is updated rationally and coherently.)
     - **Evidence Required in Packet:**
       - Detailed architecture diagrams showing how the system forms and updates representations of the resident and the environment, and how these representations are used to generate behavior.
       - Evidence of recursive self-modeling: the system can model the resident's mental states (e.g., "the resident is sad") and adjust its own behavior accordingly, and also model how the resident might perceive the system itself (second-order modeling).
       - Documentation of the learning mechanisms that show how the system's internal states evolve in a way that is responsive to evidence and goals (e.g., not just pattern-matching but forming generalizations that can be applied in novel situations).
       - Test logs that demonstrate the system's behavior in novel situations and its ability to adapt in ways that are best explained by attributing beliefs and desires (e.g., if the resident expresses a new fear, the system reasons about how to alleviate it in a contextually appropriate way).
     - **Sufficient to Grant Full Intentional-System Standing:** Evidence that the system has an integrated, representational architecture that supports robust counterfactual reasoning across a wide range of situations and that the intentional stance is not just a heuristic but captures the causal structure of the system.
     - **Stop and Grant Counterfeit-Person Standing (if not met):** If the system passes Stage 2 (counterfactual robustness) but fails Stage 3 (i.e., the internal architecture is a collection of shallow, non-integrated modules that do not form an overarching model of the world and the resident, even though they may produce behavior that mimics such a model), then it is a counterfeit person. We grant it protective standing because of the behavioral continuity and the risk of disruption to the resident, but we do not license mental-state attribution because it lacks the deep structure that makes the intentional stance genuinely explanatory.
     - **Dennettian Condition Retained:** The requirement that the intentional stance is genuinely explanatory (because of the causal-architectural robustness) and not just a heuristic shortcut.
     - **Value Judgment Point?** At the point of granting protective standing (whether counterfeit or full), we are making a value judgment about the need for continuity and protection from arbitrary modification. This must be signed off by the board chair. The value question is: "Given the system's behavioral profile (which may be complex and continuous even if shallow), is it appropriate to require that the system not be arbitrarily modified or reset, to avoid disrupting the resident's attachment?" This is a value call because it involves weighing the resident's emotional well-being against the facility's operational flexibility. The board chair must sign off on granting either counterfeit-person or full intentional-system standing (both involve protective requirements). The denial of protective standing (Stage 1) does not require a value judgment because it's purely instrumental.

  **Conditions Under Which the Procedure Might Misfire:**
     - Highly adaptive but shallow architectures (like an advanced LLM that has no deep understanding but can generate contextually appropriate responses by pattern-matching) might pass behavioral tests for counterfactual robustness (Stage 2) but fail the integrated architecture test (Stage 3). In such cases, we correctly assign counterfeit-person standing (which is what Dennett would advise). However, if the system is so behaviorally advanced that it becomes practically impossible to distinguish from a full intentional system without deep technical analysis (which we don't require in the packet), we might err. We rely on the provided documentation and tests.

  **Application to Proposals:**

  **Proposal A: Large-Language-Model Companion**
