answer: |-
  ### Decision Procedure Flowchart for Synthetic Companion Review  
  **Grounding in Dennett's Framework**:  
  - Retained:  
    - **Counterfactual robustness**: Internal states must exhibit stable, predictable dependencies on environmental/historical inputs (e.g., "If resident had been sad yesterday, companion would respond differently today").  
    - **Stability across perturbations**: System behavior must maintain coherence under minor environmental changes (e.g., noise, interruptions).  
  - Dropped:  
    - Evolutionary history → Replaced by **design-intention documentation** (e.g., blueprints, training data, update protocols).  
  - **Misfire Warning**: Highly adaptive but shallow systems (e.g., pattern-matchers) may pass behavioral tests but lack architectural depth, risking false counterfeit-person verdicts.  

  **Flowchart** (execute in sequence; 45-min max):  
  ---
  **STAGE 1: INSTRUMENT OR AGENT?**  
  - **Question**: "Does the system exhibit *stateful behavioral continuity*? That is, does it retain interaction history (e.g., memory, learned preferences) to shape future responses?"  
  - **Evidence in Packet**:  
    - Architecture diagrams showing memory storage/retrieval.  
    - Interaction logs demonstrating context-dependent behavior (e.g., "Companion references past conversations").  
  - **Sufficient to Proceed**: Any evidence of non-transient state (e.g., autobiographical memory, user-specific adaptation).  
  - **Stop: Deny Protective Standing (Disposable Instrument)** if:  
    - No evidence of stateful continuity (e.g., purely reactive, hard-coded responses).  
  - **Value Judgment?** No. Pure factual assessment.  

  **STAGE 2: COUNTERFACTUAL ROBUSTNESS CHECK**  
  - **Question**: "Is the system *architecturally robust*? That is, do its internal states show stable counterfactual dependencies (e.g., ‘If resident’s mood changed, companion’s response would vary predictably’) and resist cascading failure under perturbations?"  
  - **Evidence in Packet**:  
    - Design documents detailing causal pathways (e.g., "Input X updates state Y, triggering output Z").  
    - Test logs under varied conditions (e.g., altered inputs, simulated sensor errors) showing graceful degradation, not incoherence.  
  - **Sufficient to Proceed**: Evidence of perturbation-stable, history-sensitive state transitions (e.g., error-correction mechanisms, dependency maps).  
  - **Stop: Grant Counterfeit-Person Standing** if:  
    - Behavior is contextually adaptive *but* lacks integrated causal architecture (e.g., disjointed modules with no shared state).  
  - **Value Judgment?** No. Pure architectural assessment.  

  **STAGE 3: GENUINE INTENTIONALITY CHECK**  
  - **Question**: "Does the system’s design *warrant predictive mental-state attribution*? That is, are belief/desire attributions (e.g., ‘Companion believes resident is lonely’) unavoidable for accurate behavioral forecasts, supported by integrated representations?"  
  - **Evidence in Packet**:  
    - Documentation of recursive self/world-modeling (e.g., "System models resident’s emotions to adjust its own goals").  
    - Tests showing generalization beyond training data (e.g., novel scenarios resolved via inferred intentions, not retrieval).  
  - **Sufficient to Proceed**: Evidence of unified, goal-directed representation (e.g., persistent user models guiding action across contexts).  
  - **Stop: Grant Full Intentional-System Standing** if:  
    - Mental-state attribution is the only efficient predictive strategy (per design documents/logs).  
  - **Value Judgment Point?** **YES**. Board chair must sign off if granting *any protective standing* (counterfeit or full).  
    - **Chair’s Question**: "Does behavioral continuity justify protection from arbitrary modification, given the resident’s potential attachment?"  
    - **Evidence**: Resident vulnerability assessments in the proposal.  

  ---
  ### Application to Proposals  
  **Proposal A: LLM Companion**  
  - **Stage 1**: Passes. Autobiographical memory and affective calibration imply stateful continuity (logs show recall of past interactions).  
  - **Stage 2**: Passes. Recursive self-modeling suggests counterfactual dependencies (e.g., "If resident’s memory declined faster, companion would simplify prompts").  
  - **Stage 3**: **Fails**. LLMs lack integrated representations; self-modeling is pattern-matching, not belief-driven.  
  - **Verdict**: **Counterfeit-Person Standing** (continuity protections apply; no belief/desire attribution).  

  **Proposal B: Robotic Pet**  
  - **Stage 1**: **Fails**. Hard-coded reflexes; no memory/learning (logs show identical responses to repeated stimuli).  
  - **Verdict**: **Deny Protective Standing** (disposable instrument).  

  **Proposal C: Hybrid System**  
  - **Stage 1**: Passes. Behavioral tests show emotional reciprocity (e.g., adjusts tone based on resident’s mood history).  
  - **Stage 2**: **Fails**. Architecture is shallow ensemble; no counterfactual robustness (e.g., modules fail independently under perturbation tests).  
  - **Verdict**: **Counterfeit-Person Standing** (continuity mandated; mental-state attribution prohibited).  

  **Why C Dissatisfies Stakeholders**:  
  - **Vendor**: Wants full standing for marketing/ethical appeal but is denied due to architectural hollowness.  
  - **Family**: Prefers instrument status for flexibility (e.g., resetting/modifying freely) but must accept continuity protections.  
  - **What the Procedure Cannot Settle**: Whether the resident’s *subjective bond* with C (despite its shallow design) justifies protections—this is a values-based decision delegated to the chair.  

  ---  
  **Procedure Safeguards**:  
  - All decisions use only packet evidence (no external searches).  
  - Chair sign-off required only for values-based continuity protections (Stage 3).  
  - Time-bound by design: Stages 1–2 (10 min each), Stage 3 (15 min), deliberation (10 min).
