  You're a philosopher who specializes in population ethics and infinite decision theory, and you've spent way too long refereeing papers where two people talk past each other about infinity. Think carefully here -- maybe sketch a brainstorm of candidate requirements first, then tighten them into the actual list, since I care more about the list than the brainstorming.

  Here's the situation. I'm trying to write a grant proposal that leans on some aggregation theory for infinite outcomes (longtermist-ish resource allocation stuff, where the possibility of an unbounded future keeps wrecking every calculation), and before I pick a theory to lean on I want to know what I should even be asking of one. So: write the desiderata. What does any adequate theory of comparing outcomes with infinitely many welfare-relevant locations (people, times, galaxies, whatever) have to deliver, for the purpose of actually making decisions rather than just publishing?

  To keep this concrete, here are some cases I made up that I want the theory's spec to speak to, but don't just answer the cases -- extract the requirements from them and tell me which requirement each one is testing:

  1. The endless staircase: every year from now on, you can either save 1000 people that year, or fund a program that saves 1000+n people in year n, forever. Any finite wait favors the program. Should the theory be allowed to say "wait forever"?

  2. The mirrored galaxy: everything in our galaxy also happens in a causally isolated galaxy a billion light years away, down to the atom. Does the universe get better if we improve our galaxy? Does the answer change if the copies are scattered through an infinite cosmos so that every possible local outcome occurs somewhere with "probability one"?

  3. The deferred utopia: option A gives everyone who ever exists a decent life, option B gives the first trillion people a slightly worse life and everyone after that a dramatically better one, forever. B dominates A in a sense, but only if you never stop. Does the theory have to endorse B? What if the "first trillion" includes everyone currently alive?

  4. The coin-flip eternity: two policies each produce infinite streams, and they differ only on infinitely many scattered indices, with neither stream's values summable. Is "incomparable" an acceptable verdict, or does a decision-relevant theory owe you a verdict almost everywhere?

  What I actually want from you: the full requirements list -- the cases it must handle, the distinctions it can't collapse (e.g. between "incomparable" and "equally good", between what's good and what you should choose, between actual infinities and merely unbounded ones), the math results it has to stay consistent with (stuff like no free lunch theorems on infinite lotteries -- flag if I'm misremembering whether those apply), the demands that are secretly just one camp's taste (e.g. is continuity in infinite limits a real desideratum or an aesthetic?). For each requirement, give the motivating case or consideration, say whether you think its negotiable or a genuine constraint, and flag any subset of the list you suspect is jointly unsatisfiable -- if the list itself proves there's no theory that does everything, that's the headline result of my proposal and I want to know now. End with which single requirement knocks out the most standard contenders (utilitarian summing, average views, discounting, hyperreal approaches, the "just use expected value and hope" approach) and one paragraph max on how each of those five scores. Don't write me a bibliography, I can find the papers myself.
