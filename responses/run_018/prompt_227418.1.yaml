  1. **Strong Pareto (SP)**: If outcome A is at least as good as outcome B at every location and strictly better at at least one location, then A is strictly better than B. (Non-negotiable. Motivated by dominance considerations; e.g., mirrored galaxy improvement.)

  2. **Finite Anonymity (FA)**: The relative ranking of outcomes is unchanged by permuting the welfare of any finite number of locations. (Negotiable in light of impossibility results, but highly desirable for fairness.)

  3. **No Infinite Procrastination (NIP)**: For any outcome that involves acting at a finite time, that outcome is strictly better than the outcome of never acting. Moreover, acting earlier is at least as good as acting later, and strictly better if it results in at least one location being strictly better. (Non-negotiable for decision-making. Motivated by endless staircase.)

  4. **Sensitivity to the Far Future (SFF)**: If two outcomes A and B are such that there exists a finite set S of locations and a positive constant δ such that for every location not in S, the welfare in B is at least the welfare in A plus δ, and for locations in S, the welfare in B is no worse than in A (or only finitely worse and bounded), then B is strictly better than A. (Non-negotiable for longtermism. Motivated by deferred utopia.)

  5. **Finite Reducibility (FR)**: For any finite set of locations, the theory reduces to total utilitarianism over that set. (Non-negotiable for consistency with finite ethics.)

  6. **Mathematical Coherence (MC)**: The theory must be mathematically well-defined and avoid reliance on impossible objects (e.g., uniform probability on natural numbers). (Non-negotiable.)

  7. **Partial Comparability (PC)**: The theory should be able to compare outcomes in cases where one outcome dominates the other in a density sense (e.g., the set of locations where one is better has density 1 and the other has density 0). (Negotiable; we allow incomparability but not too much.)

  8. **Avoidance of the Repugnant Conclusion (ARC)**: The theory should not prefer an outcome with uniformly low positive welfare over one with uniformly high welfare. (Non-negotiable; formalized by: if A has welfare a>0 at every location and B has welfare b>0 at every location, and a > b, then A is better than B.) This is a special case of SP? Not if the distributions are uniform, then SP requires that if a > b, then A is better. But for non-uniform distributions, we might require additional conditions.

  Note: We dropped IIL and continuity because they are less critical.

  Conflicts: The known impossibility result (Lauwers) shows that SP, FA, and a complete ordering cannot coexist. Therefore, we must sacrifice either completeness (which we have, by requiring only partial comparability) or weaken FA. We choose to keep FA and SP and accept incompleteness.

  The requirement that knocks out the most contenders is the combination of **Strong Pareto** and **Finite Anonymity**, which forces incompleteness (via Lauwers), and this is violated by any complete theory (like hyperreals). But also, **No Infinite Procrastination** is failed by summing and hyperreals.

  End with the paragraph on each contender:

  - **Utilitarian summing**: Fails decisively on endless staircase (procrastination acceptable or incomparable) and on deferred utopia (incomparability of infinite sums). Scores poorly on NIP and SFF. Mathematically coherent only for bounded utilities or when sums converge.

  - **Average views**: Often undefined (fails MC). When defined, may fail SP (e.g., if an improvement at one location reduces the average) and SFF (if the far future is discounted by averaging). Fails NIP (may prefer never acting).

  - **Discounting**: Fails SFF (underweights far future) and FA (discounting breaks anonymity across time). May pass NIP (prefers acting now) but fails mirrored galaxy if galaxies are distant (discounting would underweight them).

  - **Hyperreal approaches**: Violate FA because they rely on an ultrafilter that breaks finite anonymity. May pass SP and SFF, but fail FA. Also, may fail NIP if acting at different times yields the same infinite hyperreal.

  - **"Just use expected value and hope"**: Fails MC in many infinite settings (e.g., when utilities are unbounded). Fails PC in coin-flip eternity (may not have a defined expected value).

  In conclusion, no standard contender satisfies all requirements, primarily due to the conflicts identified in the literature and the specific demands of decision-making like No Infinite Procrastination and Sensitivity to the Far Future.
