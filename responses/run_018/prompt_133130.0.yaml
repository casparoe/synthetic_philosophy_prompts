prompt: |-
  i was talking with a friend whos in a grad seminar on Scanlon and she tried to explain contractualism to me, but i'm pretty sure she muddled a few things. she said Scanlon thinks an act is wrong if theres a principle allowing it that some affected person could reasonably reject, and since each rejection carries equal weight, every individual basically gets a veto over being harmed. from that she concluded contractualism solves the aggregation problem—where saving five by sacrificing one seems wrong—because the one victims rejection automatically trumps the five others preferences, no matter the numbers. she also claimed this makes Scanlon just a rule-utilitarian with a personal veto bolted on, and thats why critics think contractualism cant allow aggregation in disaster triage or vaccine allocation where we have to pick between different-sized groups. i feel like shes conflating rejection with consent, but i cant tell where exactly.

  Can you audit this summary? go through the main claims one by one: which parts fairly represent Scanlons view, which are standard simplifications that distort the reasoning, and which are flat wrong—especially the personal veto framing and the comparison with rule-utilitarianism. check whether her conclusion that contractualism solves aggregation by blocking all trade-offs actually follows from Scanlons reasoning, or if it misrepresents how he handles numbers in moral justification. im particularly curious whether Scanlon allows any form of aggregation in triage cases, or if he really treats individual rejection as lexically prior.

  You are a professional philosopher specializing in contractualist ethics. Think carefully and start with a one-paragraph bottom line giving your overall verdict. then break it down claim by claim. keep the whole response under 400 words, and dont bother with citations or page references—i just want the conceptual audit.
reasoning: |-
  Okay, the user is asking me to audit a summary of Scanlon's contractualism that their friend provided. The friend made several claims: that an act is wrong if any affected person could reasonably reject a principle allowing it, that each rejection has equal weight giving individuals a "veto," that this solves aggregation problems by always prioritizing the single victim over many beneficiaries, and that this makes Scanlon similar to rule-utilitarianism with a personal veto. The user suspects their friend is conflating rejection with consent and wants me to evaluate each claim.

  I'm approaching this as a professional philosopher specializing in contractualist ethics. The core issue is whether the friend accurately represents Scanlon's views, particularly regarding reasonable rejection and how contractualism handles aggregation problems like sacrificing one to save five.

  First, I need to recall Scanlon's actual position. In "What We Owe to Each Other," he argues that an act is wrong if it violates principles that no one could reasonably reject. The key here is "reasonable rejection" - it's not about simple veto power but about whether objections are justifiable from an impartial standpoint. Scanlon explicitly rejects the idea that any individual has absolute veto; instead, rejections must pass a test of reasonableness where the burdens on individuals are weighed against the benefits to others.

  Regarding aggregation, Scanlon does allow for it in certain cases. He doesn't treat individual rejection as lexically prior. In situations like disaster triage or vaccine allocation, he would consider whether the principles permitting aggregation could themselves be reasonably rejected. The numbers do matter because the cumulative burdens or benefits to groups can create stronger grounds for rejection or acceptance of principles.

  The friend's comparison to rule-utilitarianism is misguided. Rule-utilitarianism evaluates rules based on overall welfare maximization, while contractualism focuses on justifiability to each person. Adding a "personal veto" fundamentally misunderstands contractualism's structure - it's about mutual justifiability, not individual veto power.

  The claim that contractualism solves aggregation by blocking all trade-offs is incorrect. Scanlon acknowledges that we sometimes must make trade-offs, but these must be governed by principles that are justifiable to all affected parties. His framework does allow for aggregation when the numbers are large enough to make a difference in the reasonableness of rejection.

  I'll structure my response with a bottom-line verdict first, then break down each claim systematically. I'll keep it under 400 words without citations, focusing on conceptual accuracy. I'll clarify where the friend oversimplifies, where they're flat wrong (especially about the veto and rule-utilitarianism comparison), and explain how Scanlon actually handles numbers in moral justification.
answer: |-
  ### Bottom Line Verdict
  Your friend captures the core structure of Scanlonian contractualism but distorts it significantly in key ways, particularly by misrepresenting "reasonable rejection" as an absolute individual veto and by incorrectly claiming it universally blocks aggregation. This leads her to wrongly equate contractualism with a veto-modified rule-utilitarianism and to overstate its inability to handle trade-offs.

  ### Claim-by-Claim Audit
  1.  **"An act is wrong if there's a principle allowing it that some affected person could reasonably reject."**
      *   **Accuracy:** Mostly fair simplification. Scanlon holds an act is wrong if it violates principles that no one *could* reasonably reject. The focus is on finding mutually acceptable principles, not any individual's rejection per se.

  2.  **"Each rejection carries equal weight, every individual basically gets a veto over being harmed."**
      *   **Accuracy:** **Flat wrong / Major distortion.** "Reasonable rejection" is not a personal veto. A rejection is only decisive if it's *reasonable* – meaning the *burden* imposed on that individual under the principle is sufficiently severe when weighed against the *reasons others have* for wanting the principle (including the *number* of others benefited or burdened). One person's rejection doesn't automatically "trump" many others' interests; its reasonableness depends on the comparative stakes.

  3.  **"Solves the aggregation problem... because the one victim's rejection automatically trumps the five others' preferences."**
      *   **Accuracy:** **Flat wrong.** Scanlon explicitly rejects this. Contractualism *allows* aggregation when numbers make a difference to the reasonableness of rejection. Saving five lives vs. one creates a very strong reason for the five to reject a principle *forbidding* the sacrifice. Whether the single victim's rejection is reasonable depends on the *magnitude* of their burden vs. the *aggregate* benefit. It doesn't "solve" aggregation by blocking it; it incorporates aggregation into the assessment of reasonable rejection.

  4.  **"Makes Scanlon just a rule-utilitarian with a personal veto bolted on."**
      *   **Accuracy:** **Misleading and mistaken.** Rule-utilitarianism (RU) selects rules maximizing expected welfare. Contractualism selects rules no one can reasonably reject based on the *kinds of reasons* individuals have (e.g., suffering, loss of life, autonomy), considering their standpoints. The "personal veto" framing is incorrect (see #2), and RU's aggregative welfare-maximization is fundamentally alien to contractualism's justifiability-to-each-individual structure.

  5.  **"Critics think contractualism can't allow aggregation in triage/vaccine allocation."**
      *   **Accuracy:** **Partial truth / Oversimplification.** Critics *do* argue it struggles with large-scale aggregation, but Scanlon *explicitly argues* it *can* handle cases like saving a larger group over a smaller one because the numbers affect the reasonableness of rejection. The debate centers on *how well* it captures aggregation compared to utilitarianism, not an absolute ban.

  6.  **"Individual rejection is lexically prior / blocks all trade-offs."**
      *   **Accuracy:** **Flat wrong.** Reasonable rejection requires weighing the burdens on individuals *against* the reasons others have for accepting a principle. Numbers matter crucially in this weighing process. Lexical priority would make trade-offs impossible, which Scanlon denies. He allows sacrificing one for many *if* the principle permitting it (under those specific conditions) cannot be reasonably rejected.
