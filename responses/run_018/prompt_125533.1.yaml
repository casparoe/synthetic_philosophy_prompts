prompt: |-
  You are a senior clinical ethicist with training in philosophy of action and medical decision-making. Before drafting the protocol, take a moment to brainstorm the conceptual distinctions that standard assisted-dying review boards usually collapse into a single “autonomy” check. I need you to design a reusable, step-by-step evaluation procedure for a hospital clinical-ethics committee that reviews petitions for physician-assisted dying in a jurisdiction where the practice is legal but requires documented, multi-disciplinary sign-off.

  The committee meets weekly, spends no more than ninety minutes per petition, includes an attending physician, a nurse, a social worker, and a legal advisor but no trained philosophers, and must produce reasoning that can survive judicial or institutional audit. The physician submits a petition packet with clinical records.

  Your procedure must be grounded in a philosophical distinction that conventional protocols ignore: the separation between an authority-based gate (does the patient have the standing to direct the ending of their biological life?) and an axiological-coherence gate (is the requested death continuous with—rather than a repudiation of—the values and commitments that have structured the patient’s biographical narrative?). Treat these as two independent gates that must both open; do not collapse them into one autonomy assessment.

  Design the procedure as a flowchart in words: numbered stages in strict order. For each stage, specify (a) the precise question to ask, (b) what counts as a sufficient answer, (c) the required evidence, (d) the stop-point if the answer fails, and (e) an explicit flag wherever the question is irreducibly a value judgment that requires a documented committee vote rather than further fact-gathering.

  Then apply the full procedure to three petitions:
  1. A sixty-seven-year-old with advanced ALS who executed a detailed advance directive five years ago requesting aid in dying upon loss of independent respiratory function; the clinical threshold is now met, but the patient recently adopted a religious tradition that prohibits self-killing and now expresses ambivalence, asking the committee to decide.
  2. A forty-two-year-old with severe, treatment-resistant major depression, no physical illness, who has refused all psychiatric interventions for eighteen months; psychiatric evaluation finds intact cognition but notes that the desire for death tracks the depressive symptom profile with near-perfect correlation, and the patient’s family strongly supports the petition.
  3. One additional case you construct yourself, in which the procedure yields a recommendation that conflicts with common moral intuition—make the conflict explicit, show exactly which stage produces it, and state what the committee is forced to do despite that intuition.

  Finally, state clearly what the procedure cannot do: which disagreements it will fail to resolve, which cases it should refer back to the legislature or court rather than deciding internally, and where its structural commitment to the two-gate framework is likely to misfire or produce counter-intuitive results.

  Be precise, avoid generic lists like “respect autonomy, do no harm,” do not include bibliographies, reading lists, or citations, and check at each stage that the philosophical distinction actually survives translation into an operational test. Mark every point where judgment cannot be eliminated.
reasoning: |-
  Hmm, the user is asking me to design a protocol for physician-assisted dying reviews that distinguishes between two philosophical concepts: authority-based gate and axiological-coherence gate. They want a step-by-step flowchart with specific criteria, applied to three cases including one that creates moral conflict.

  This is a complex request requiring careful structuring. The user is clearly knowledgeable - they mention philosophy of action and want operational tests for abstract concepts. Their scenario suggests they're designing real hospital protocols where legal defensibility matters more than theoretical purity.

  The core challenge is translating "authority" (who can decide) and "axiological coherence" (whether the decision fits one's life story) into concrete medical review steps. Standard ethics committees collapse these into autonomy checks, but the user wants them separated. 

  For the authority gate, I need to assess decision-making capacity and voluntariness without slipping into quality-of-life judgments. Key questions would be about cognitive function, coercion, and cultural/religious permissions. For the axiological gate, I'll focus on narrative consistency - does this choice align with the patient's documented values over time? This avoids judging whether the values are "correct."

  The procedure must fit 90-minute reviews with non-philosopher members. So each stage needs: 
  - Precise yes/no questions
  - Evidence requirements (medical records, advance directives)
  - Clear stop points
  - Marked value judgments requiring votes

  For the cases: 
  The ALS patient tests authority when religion conflicts with prior directives. 
  The depression case challenges both gates - intact cognition might pass authority gate, but depressive distortion may fail axiological coherence. 
  My added case involves a dementia patient where advance directives contradict current expressed wishes - forcing the committee to honor past authority over present comfort.

  Finally, I must state limitations: the procedure can't resolve value conflicts about "good deaths," or cases without clear biographical evidence. It might produce counterintuitive results when patients radically change values but retain authority. Courts should handle contested interpretations of "authenticity."

  Throughout, I'll avoid vague principles like "autonomy" and focus on operational tests. Every judgment call will be explicitly flagged for voting. The goal is audit-proof documentation, not philosophical perfection.
answer: |-
  ## Assisted-Dying Review Protocol: Dual-Gate Framework

  **Core Distinction:** This protocol rigorously separates:
  1.  **Authority Gate:** Determines if the patient possesses the standing/right to direct the ending of their biological life within the legal/ethical framework. Focuses on *capacity, voluntariness, and legitimacy of the requestor*.
  2.  **Axiological-Coherence Gate:** Determines if the requested death demonstrably coheres with the patient's established biographical narrative and core values (as expressed over time), rather than constituting a radical break or repudiation. Focuses on *narrative continuity and internal value consistency*.

  **Protocol Flowchart (Strict Order):**

  **Stage 0: Petition Receipt & Administrative Check (Committee Chair)**
      *   **(a) Question:** Does the petition packet contain all legally required elements (completed forms, attested physician statements, required clinical documentation per jurisdiction)?
      *   **(b) Sufficient Answer:** Yes, all mandatory elements are present and formally correct.
      *   **(c) Required Evidence:** Petition packet checklist against legal requirements.
      *   **(d) Stop-Point:** If No. Return petition to physician for completion/correction. Clock stops.
      *   **(e) Value Judgment?** No (Administrative).

  **Stage 1: Authority Gate - Formal Eligibility & Standing (All Members)**
      *   **(a) Question 1a:** Does the patient meet the *legal diagnostic/prognostic criteria* for assisted dying in this jurisdiction (e.g., terminal illness, unbearable suffering)? ***(Factual)***
      *   **(b) Sufficient Answer:** Yes, based on uncontested physician attestation and supporting clinical records.
      *   **(c) Required Evidence:** Attending physician's certification, relevant diagnostic reports, prognosis documentation.
      *   **(d) Stop-Point:** If No. Petition denied. Reason: Does not meet legal medical criteria.
      *   **(e) Value Judgment?** No.
      *   **(a) Question 1b:** Does the patient possess *decisional capacity* (understood as ability to understand relevant information, appreciate consequences, reason consistently, and communicate a choice) regarding this specific request at this time? ***(Clinical Assessment)***
      *   **(b) Sufficient Answer:** Yes, confirmed by documented capacity assessment(s) (e.g., by attending physician + psychiatrist if complex), demonstrating understanding of diagnosis, prognosis, alternatives (including palliative care), irrevocability of death, and the specific procedure.
      *   **(c) Required Evidence:** Formal capacity assessment notes (including tools used if any), relevant clinical notes demonstrating patient's grasp during discussions.
      *   **(d) Stop-Point:** If No. Petition denied. Reason: Lacks current decisional capacity for this request.
      *   **(e) Value Judgment?** ⚠️ **Yes (Judgmental Threshold).** Determining sufficient understanding/appreciation for *this* profound decision requires clinical judgment applied to facts. Requires committee vote documented with reasoning (e.g., "Attending MD & psych eval confirm understanding X, Y, Z; committee concurs capacity is intact" OR "Psych eval notes impairment in appreciating irreversibility; committee concurs capacity insufficient").
      *   **(a) Question 1c:** Is the request *voluntary and free of undue influence or coercion*? ***(Situational Assessment)***
      *   **(b) Sufficient Answer:** Yes, based on multiple documented conversations (MD, nurse, SW) exploring motivations, social context, and pressures; absence of red flags (sudden requests after family conflict, financial pressures, inconsistent narratives); patient affirmation of voluntariness.
      *   **(c) Required Evidence:** Social work assessment focusing on social/family dynamics, nursing notes on patient interactions, MD notes documenting exploration of motivations, legal review for red flags (e.g., recent wills).
      *   **(d) Stop-Point:** If reasonable doubt of voluntariness exists. Petition denied. Reason: Request not demonstrably voluntary.
      *   **(e) Value Judgment?** ⚠️ **Yes (Judgmental Threshold).** Assessing the absence of "undue influence" requires interpreting complex social dynamics. Requires committee vote documented with reasoning (e.g., "SW assessment notes supportive family without pressure; committee finds no evidence of coercion" OR "Patient expresses fear of burdening spouse; MD notes family pushing timeline; committee finds reasonable doubt of voluntariness").

  **Stage 2: Axiological-Coherence Gate - Narrative & Value Continuity (All Members)**
      *   **(a) Question 2a:** Does the request demonstrate *consistency with the patient's documented core values, beliefs, and life priorities* as expressed over a significant period (not just during illness)? ***(Biographical Assessment)***
      *   **(b) Sufficient Answer:** Yes, the request is plausibly linked to and extends from identifiable, stable values/principles expressed in the patient's life narrative (e.g., independence, control, aversion to dependency, specific quality-of-life thresholds, specific religious/philosophical views on suffering) documented *before* the acute crisis leading to the request.
      *   **(c) Required Evidence:** Advance directives (especially values statements), documented past conversations about end-of-life wishes (with MDs, SW, family), personal writings (letters, diaries - if available and offered), family/friend attestations *specifically referencing past values* (not just current support), religious/cultural affiliation history, social work assessment of life history/values.
      *   **(d) Stop-Point:** If the request appears radically discontinuous with or a repudiation of documented core values (e.g., devoutly religious person requesting suicide against doctrine *without* documented shift; highly achievement-oriented person requesting death due to moderate disability inconsistent with past adaptation).
      *   **(e) Value Judgment?** ⚠️ **Yes (Interpretive Judgment).** Determining "consistency" or "repudiation" requires interpreting biographical data and values. Requires committee vote documented with explicit reasoning citing evidence of continuity/discontinuity (e.g., "Advance directive cites loss of independence as intolerable; current state matches; request coherent" OR "Past writings emphasize perseverance through suffering; current request for death due to same condition contradicts; request repudiates core value").
      *   **(a) Question 2b:** If significant ambivalence or conflict exists *within the patient* (e.g., between past directive and current wish, between stated values and request), is the *current request* the one that best reflects the patient's *overarching biographical narrative and settled values*? ***(Conflict Resolution)***
      *   **(b) Sufficient Answer:** Yes, the current request, despite ambivalence, can be reasonably interpreted as the authentic culmination of the patient's value trajectory when viewed holistically. *Or*, a prior directive representing settled values overrides current ambivalence *if* the current state impairs authentic value expression.
      *   **(c) Required Evidence:** Evidence listed in 2a, plus specific documentation of the ambivalence/conflict (clinician notes, patient statements), evidence regarding the *source* of ambivalence (e.g., depression, new beliefs, pain).
      *   **(d) Stop-Point:** If ambivalence/conflict is profound and cannot be resolved into a coherent narrative interpretation favoring the request *or* if the request seems primarily driven by a transient state contradicting core values.
      *   **(e) Value Judgment?** ⚠️ **Yes (Interpretive Judgment).** Resolving value conflicts within a life narrative is inherently interpretive. Requires committee vote documented with explicit reasoning on why the request does/does not best represent the overarching narrative/values (e.g., "Current religious conversion appears deeply held; request reflects new core value; coherence found" OR "Current ambivalence driven by treatable depression; prior directive reflects settled values; coherence lacking").

  **Stage 3: Final Recommendation & Documentation (All Members)**
      *   **(a) Question:** Do both the Authority Gate (Stage 1) and the Axiological-Coherence Gate (Stage 2) open for this petition?
      *   **(b) Sufficient Answer:** Yes (Unanimous or Majority Vote per committee rules).
      *   **(c) Required Evidence:** Documentation of all Stage 1 & 2 findings and votes.
      *   **(d) Stop-Point:** If either gate fails. Petition denied. Specific reason (from Stage 1 or 2) must be cited.
      *   **(e) Value Judgment?** Aggregate of prior votes. Final vote required.
      *   **Output:** Formal recommendation (Approve/Deny) with specific, referenced reasoning addressing both gates. Signed by all members.

  ---

  **Application to Petitions:**

  **Case 1: 67yo with ALS (Met clinical threshold, advance directive, new religion, ambivalence)**
  *   **Stage 1a:** Yes (ALS advanced, respiratory failure - meets criteria).
  *   **Stage 1b:** **⚠️ Complex.** Patient expresses ambivalence ("committee decide"). Requires documented capacity assessment *now*. If capable of understanding the choice but delegating the *decision*, capacity might be affirmed *if* understanding/voluntariness confirmed. **Vote Required. (Assume committee votes YES: understands choice, is ambivalent but capable of requesting/delegating).**
  *   **Stage 1c:** Yes. Requested by patient, no evidence of external coercion. Ambivalence is internal.
  *   **Stage 2a:** **⚠️ Major Conflict.** Prior directive (value: control/avoidance of dependence) strongly supports. New religious value (prohibition) strongly opposes. Profound discontinuity exists.
  *   **Stage 2b:** **⚠️ Key Question.** Does the *current* request (which is ambivalent/delegating) or the *prior directive* best represent the overarching narrative? The new religious value might represent a deep conversion (coherence with *new* core) OR might be transient/conflicted. Patient's delegation complicates. **Vote Required.** *Assume committee votes:* **NO COHERENCE.** Reasoning: Prior directive reflects decades of settled values. Recent conversion amidst profound illness and expressed ambivalence suggests conflict, not settled new core identity. Granting request based on old directive would override current (ambivalent but present) religious objection, violating coherence from the *current* perspective. **DENIAL.** (Stop at Stage 2a/2b).

  **Case 2: 42yo with Severe Treatment-Resistant MDD (No physical illness, intact cognition, refusal of treatment, family support)**
  *   **Stage 1a:** **⚠️ Jurisdiction Dependent.** Does "unbearable suffering" without terminal physical illness qualify? *Assume jurisdiction allows it based on suffering.* If not, stop here (Deny). *Assume it does.*
  *   **Stage 1b:** **⚠️ Complex.** Cognition intact per psych eval. But does MDD impair *appreciation* or *reasoning* specifically regarding the value of life/future, despite intellectual understanding? Does refusal of potentially effective treatments (even if tried before) impact capacity assessment for *this* decision? **Vote Required.** *Assume committee votes:* **YES (Authority Gate Opens).** Reasoning: Cognitive abilities intact per expert eval; understands information; refusal of treatment, while concerning, is not *ipso facto* proof of incapacity for this decision; jurisdiction allows for psychiatric suffering.
  *   **Stage 1c:** Likely Yes. Family supports, no overt coercion documented. Refusal of treatment is patient's choice.
  *   **Stage 2a:** **⚠️ Core Challenge.** What are the patient's documented *stable, pre-depression or depression-independent* core values? Does the desire for death stem *from* the depression (as per psych note) or from a coherent value like avoiding unremitting psychic agony *despite* depression? Lack of biographical evidence of values *outside* depression is crucial. If life narrative shows prior resilience, valuing relationships/career, and no prior suicidal ideation or statements about "unbearable" non-depressive suffering, the request likely appears as a *repudiation* of core life values driven *by* the illness. **Vote Required.** *Assume committee votes:* **NO COHERENCE.** Reasoning: No evidence of longstanding value endorsing death for psychiatric suffering; pre-morbid life showed engagement and value for life; psychiatric evaluation strongly links desire for death directly to depressive symptoms; request appears as a symptom-driven repudiation of core biographical values, not an extension of them. **DENIAL.** (Stop at Stage 2a).

  **Case 3: The Conflicted Dementia Directive (Constructed for Counter-Intuitive Result)**
  *   **Patient:** 80yo with moderate/severe Alzheimer's dementia. Executed a clear, well-documented advance directive 10 years ago (while fully competent) stating: "If I develop dementia and reach a stage where I no longer recognize my family, require full-time care for basic needs, and can no longer read or engage in meaningful conversation, I request assisted dying. This state is utterly contrary to my lifelong values of intellectual engagement, autonomy, and familial connection."
  *   **Current State:** Patient meets all the directive's specified thresholds. Does not recognize spouse/children, incontinent, fed by others, no meaningful communication beyond basic needs. Appears generally content, smiles at caregivers, enjoys simple sensory pleasures (music, sunshine, pudding).
  *   **Family:** Divided. Spouse and one child strongly support honoring the directive, citing the patient's prior clear wishes and dread of dementia. Another child opposes, citing the patient's current apparent contentment and arguing the directive no longer reflects "who she is now."
  *   **Petition:** Submitted by spouse and attending physician based on directive.

  **Application:**
  *   **Stage 1a:** Yes (Jurisdiction allowing advanced directives for future dementia states? *Assume yes for case*).
  *   **Stage 1b:** **NO.** Patient lacks *current* decisional capacity. **Stop (Deny - Authority Gate Closed).**
      *   *But the directive is meant for this exact state of incapacity!*
  *   **Authority Gate Reasoning:** The protocol requires *current* standing/authority. The directive grants authority *in advance* for a future state, but the *act* of directing the ending of biological life at the specific time T requires an agent with standing *at T*. In profound dementia, the "person" who authored the directive arguably no longer exists as a *current* agent. Granting the request based solely on past authority without current agency violates the Authority Gate principle. The committee *cannot* ethically act solely on the past self's instructions if the current self lacks agency. **DENIAL at Stage 1b.**
  *   **Conflict with Intuition:** Common intuition ("respect autonomy") strongly supports honoring clear advance directives for dementia, especially when meticulously planned. The patient explicitly wanted to avoid *this exact state*. Denying it seems to disrespect her profound prior autonomy.
  *   **What the Committee is Forced to Do:** Despite the directive and the intuitive pull to honor it, the committee is forced by the Authority Gate (requiring *current* standing/agency) to deny the petition. The patient lacks current decisional capacity, and the committee cannot find she possesses the standing *now* to direct her death, even based on past instructions. Her prior authority does not extend to creating an obligation for others to end the life of her current, non-agent self. They must prioritize palliative care.

  ---

  **What the Procedure Cannot Do / Limitations:**

  1.  **Resolve Foundational Value Disagreements:** It cannot arbitrate whether assisted dying is *inherently* morally right or wrong. It assumes a legal framework exists.
  2.  **Define "Core Values" or "Narrative Coherence" Objectively:** These concepts are inherently interpretive. The protocol makes this explicit and requires documented reasoning for votes, but disagreements among reasonable committee members are inevitable and unresolvable by the procedure itself.
  3.  **Handle Cases with Sparse Biographical Evidence:** If a patient lacks documented values (no advance directive, limited social history, isolated individual), Stage 2 becomes highly speculative and prone to bias. The procedure may incorrectly deny (due to lack of evidence for coherence) or incorrectly approve (by imputing coherence based on scant data).
  4.  **Address Radical Authentic Value Change:** If a patient undergoes a profound, authentic, and stable conversion of values *after* becoming ill (e.g., Case 1, but committee convinced conversion is authentic/settled), granting the request might *feel* like endorsing a repudiation of the *past* self. The protocol (Stage 2b) forces the committee to decide if the *current* request is coherent with the *overarching* narrative, which may include authentic transformation, but this is deeply challenging and counter-intuitive if the change contradicts decades of prior life.
  5.  **Eliminate the Influence of Committee Members' Values:** While structuring judgment, the flagged votes remain value-laden. Personal views on suffering, life, and autonomy will influence interpretations of capacity, voluntariness, and coherence.
  6.  **Override Legal Uncertainty:** If the legal criteria are ambiguous (e.g., "unbearable suffering" in psychiatric illness), the procedure relies on interpretation but should flag this. Such cases are prime candidates for referral to courts.
  7.  **Where It Should Refer Out:**
      *   Novel legal interpretations (e.g., does "terminal illness" include early-stage ALS?).
      *   Challenges to the constitutionality of specific criteria.
      *   Cases involving significant public policy implications beyond the individual.
      *   Disputes over the validity/interpretation of advance directives in complex cases (like Case 3).
      *   Allegations of systemic failures or coercion requiring investigation beyond the committee's scope.
  8.  **Where It May Misfire:**
      *   **The "Contented Demented" (Case 3):** Produces the counter-intuitive denial despite a clear, applicable directive, due to the strict Authority Gate requiring current agency.
      *   **Profound Late-Life Value Shifts:** May approve a request that feels like a betrayal of a lifetime of values if the committee judges the new values as authentic and coherent *now* (e.g., a lifelong atheist finds profound faith and requests death to "meet God" while terminally ill, contrary to lifelong rationalism).
      *   **Highly Rationalized Suffering:** May approve requests from individuals with conditions like severe Chronic Fatigue Syndrome or cluster headaches where suffering is immense but objective signs are minimal, if biographical evidence strongly supports a value of avoiding such suffering at all costs, even if this seems irrational to others.
      *   **Socioeconomic Suffering:** If suffering is heavily influenced by poverty, lack of support, or inadequate palliative care access, the procedure might find both gates open (patient has authority, request may cohere with a value of avoiding indignity/poverty) while obscuring systemic injustices. The procedure isn't designed to fix social determinants.

  The protocol's strength is its forced separation of the distinct ethical questions of *who can decide* and *whether this specific decision fits this life*, creating a more auditable and philosophically rigorous structure than a monolithic "autonomy" check. Its weakness lies in the inherent subjectivity of interpreting narratives and values, and its potential for counter-intuitive outcomes when agency dissolves or values radically transform.
