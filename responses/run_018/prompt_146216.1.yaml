prompt: |-
  After a long argument last night with a friend about where market logic should stop, I have been trying to systematize her judgments. She holds that a state-run pool compensating living kidney donors at a fixed rate is permissible, because bodily exchange is not inherently degrading if medically safeguarded; she holds that pharmaceutical price gouging on essential drugs during a shortage must be banned rather than taxed, because desperation removes the conditions for fair voluntary exchange; she permits selling naming rights to public monuments to private corporations, since no personal dignity is at stake; she insists vote-selling should remain criminal even between fully informed, uncoerced adults, because democratic equality is not a fungible good; she accepts pre-paid funeral contracts sold for profit; yet she rejects any contract in which parents could exchange an upfront payment for rights over a child’s future labor, regardless of regulatory safeguards.

  She has not yet considered a new proposal: a financial instrument called an “anticipatory grief contract,” in which an investor pays a premium now to fund a licensed counseling pool, receiving in return a transferable claim on a fixed block of bereavement-therapy hours assignable to any named survivor upon the investor’s death, with the claim freely tradable on a secondary market. The firm argues this is merely life insurance combined with pre-need planning; critics reply that it securitizes mourning and turns emotional care into a speculative asset.

  If she wants to remain consistent with her own track record, what should she say about this instrument? Which earlier verdict—the kidney pool, the funeral contracts, or the vote-selling prohibition—is the closest analog? Are her precedents genuinely underdetermined here, and if so, what principle would she be adopting with each possible choice? Finally, what single further case—perhaps involving the resale of already-purchased therapy vouchers for non-bereavement mental health—would best reveal whether her underlying rule concerns the inalienability of intimate emotional goods, the corruption of care relationships by speculative trading, or vulnerability and desperation alone?
reasoning: |-
  Okay, I need to help figure out what this person's friend should say about the "anticipatory grief contract" based on her previous judgments. Let me start by listing out all her positions to understand her pattern.

  First, she supports a state-run kidney donor compensation pool. Her reasoning is that bodily exchange isn't inherently degrading if medically safeguarded. So, she's okay with markets in body parts when regulated and not exploitative.

  Next, she wants to ban pharmaceutical price gouging during shortages. Here, she argues that desperation removes fair exchange conditions. So, she draws the line when people are vulnerable and can't make voluntary choices.

  She allows selling naming rights to public monuments. No personal dignity is involved, so it's fine. This suggests she distinguishes between personal and impersonal goods.

  Vote-selling should be criminalized. Her reason is democratic equality isn't fungible. Even if informed and uncoerced, some things shouldn't be commodified because they're fundamental to societal values.

  Pre-paid funeral contracts for profit are acceptable. Maybe because they're seen as planning and service provision, not exploiting vulnerability.

  But she rejects parents exchanging upfront payments for a child's future labor. Regulatory safeguards don't matter here; it's about the child's autonomy and the inalienability of their future.

  Now, the new proposal: anticipatory grief contracts. Investors pay premiums to fund therapy pools, get tradable claims on therapy hours for survivors after their death. Critics say it securitizes mourning.

  I need to find the closest analog. The kidney pool? That involves body parts but is state-run and fixed-rate. The funeral contracts? Similar pre-need planning. Vote-selling? That's about democratic integrity.

  Comparing to kidney: Both deal with personal aspects (body, emotions), but kidney is regulated to prevent degradation. The grief contract has a secondary market, which might introduce speculation.

  Funeral contracts: Both are pre-need services. But funerals are more transactional, while therapy involves emotional care. The tradable aspect here could be problematic if she thinks emotional care shouldn't be a commodity.

  Vote-selling: This is about inalienable rights. If she sees grief therapy as integral to personal dignity, similar to votes, she might reject it. The secondary market might corrupt the care relationship.

  Her key principles seem to be vulnerability (price gouging, child labor), inalienability of certain goods (votes), and corruption through markets (speculation turning care into asset).

  The grief contract's tradable claim might be the sticking point. Allowing the claim to be sold could mean survivors' therapy access is traded speculatively, which might exploit their vulnerability. Even if the initial contract is voluntary, the secondary market could lead to inequities.

  So, the closest analog might be vote-selling because both involve turning a fundamental human experience into a tradable commodity. But funeral contracts are accepted, so why the difference? Funeral contracts don't have a secondary market; they're assigned to specific individuals. The grief contract's transferability and speculation might cross the line.

  To reveal her underlying principle, a case where already-purchased therapy vouchers are resold for non-bereavement issues. If she objects, it's about emotional goods being inalienable. If she's okay, then vulnerability or corruption in bereavement specifically is the issue.

  If she rejects the grief contract, it's likely due to the commodification of emotional care and speculative trading corrupting the care relationship. If she accepts, it's more about pre-need planning like funerals. But the secondary market might tip her towards rejection.
answer: |-
  Based on your friend's established pattern of judgments, her likely verdict on the "anticipatory grief contract" would be **rejection**, and the **vote-selling prohibition** is the closest analog. Here's the systematic breakdown:

  ### 1. **Likely Verdict: Rejection**
     - **Core Reason:** The contract commodifies and makes tradable an intimate emotional good (bereavement therapy), which she likely views as inherently non-fungible and corrupted by speculative markets.
     - **Alignment with Precedents:**  
       - Like vote-selling, this instrument treats a deeply personal, relational good (grief therapy) as a financial asset, undermining its intrinsic value. Democratic equality (votes) and emotional care (therapy) both represent **core human experiences she deems inalienable**.  
       - Unlike kidneys (physical, medically safeguarded exchange) or funeral contracts (tangible service planning), this involves the **securitization of emotional vulnerability**, echoing her objection to price gouging (exploiting desperation) but going further by enabling speculative trade.  
       - The secondary market magnifies the issue, inviting profiteering from others' grief—similar to why she bans vote-selling even between "willing" parties: it corrupts the social meaning of the good.

  ### 2. **Closest Analog: Vote-Selling Prohibition**
     - **Why Not Kidney Pool or Funeral Contracts?**  
       - *Kidney Pool*: Involves compensated bodily service but is state-run, fixed-rate, and non-tradable, avoiding speculation. Grief contracts introduce a secondary market for emotional care.  
       - *Funeral Contracts*: Focus on logistical pre-planning (tangible services), not securitizing intimate emotional states. Bereavement therapy is relational and psychological, aligning more with votes (civic dignity) than funerals (practical arrangements).  
       - *Price Gouging*: While both involve desperation, grief contracts add a layer of **financialization**, transforming care into a speculative asset rather than merely inflating prices.  
     - **Vote-Selling Parallel**: Both prohibit markets in goods fundamental to human dignity (democratic agency; emotional processing). Allowing trade in either would, in her view, degrade social values and turn irreducible human experiences into commodities.

  ### 3. **Underdetermination and Principles at Stake**
     Her precedents *are* underdetermined, forcing a choice between two principles latent in her reasoning:  
     - **Option A (Reject): Adopting "Inalienability of Intimate Emotional Goods"**  
       This extends her vote-selling logic: grief therapy is an intimate, identity-shaping good (like democratic participation) that must be shielded from markets to preserve its integrity.  
     - **Option B (Accept): Adopting "Vulnerability Mitigation via Regulation"**  
       She could treat this like funeral contracts—pre-need planning—if safeguards prevent exploitation. But this ignores her stance on votes, suggesting emotional care is less "core" than civic equality.  

     **Her track record leans toward Option A** (inalienability), as she prioritizes non-degradation over efficiency even with safeguards (e.g., child labor contracts).

  ### 4. **Diagnostic Test Case**  
  To isolate her underlying principle, propose:  
  > **"A for-profit platform allowing resale of already-purchased therapy vouchers (initially bought for personal use) to anyone seeking non-bereavement mental health services (e.g., anxiety, divorce counseling)."**  

  - **If she REJECTS resale**: Her core concern is **speculative trading corrupting care relationships**, as it turns therapy (even non-bereavement) into a financial instrument.  
  - **If she ACCEPTS resale but REJECTS grief contracts**: Her focus is **vulnerability/desperation in bereavement alone**, not commodification per se (since non-crisis therapy resale is "voluntary").  
  - **If she REJECTS both**: She affirms **inalienability of intimate emotional goods** across contexts, seeing all mental health as too personal for markets.  

  This test separates whether her objection to grief contracts stems from the *nature* of the good (grief), the *mechanism* (tradable claims), or the *context* (survivor desperation).

  ### Conclusion  
  Consistency demands she **reject anticipatory grief contracts**, as they securitize a profound human experience in ways that violate her boundary for inalienable goods (like votes). The secondary market intensifies this by inviting speculation on grief, corrupting the therapist-patient relationship into a financial transaction. Her stance reflects a **principle against commodifying relational or dignity-constitutive goods**, even with safeguards—placing emotional care in the same protected category as democratic rights. The child labor prohibition further confirms her aversion to binding future autonomy, which the therapy claims implicitly do for survivors' emotional needs. The diagnostic case will clarify whether her line is drawn at despair, dignity, or speculation.
