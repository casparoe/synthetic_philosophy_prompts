answer: |-
  Here’s a blank-verse sonnet honoring Plutarch's method and your specific requirements, aiming for that unsettling, unresolved tension:

  **Parallels (After Plutarch)**

  **Not saints entombed in gold or marble praise,**
  **But paired: the Greek whose mailed fist carved the East,**
  **The Roman deft with mercy, shifting praise**
  **To policy. Ambition, unrestrained**
  **By royal bloodlines, strains against the yoke**
  **Of civic chains. And clemency, displayed**
  **In conquered Gaul, becomes a different cloak**
  **Worn near the Senate's steps, a measured stroke.**
  **But pause—this mirror held between the two...**
  **Refracts. A gesture caught mid-air, half-meant,**
  **A consequence unlooked-for, virtue spent**
  **In veins of circumstance we never knew.**
  **The likeness blurs. Not lesson, nor decree—**
  **Just figures turning stranger, endlessly.**

  ---

  **Why it works for your request:**

  1.  **Blank Verse & Sonnet Form:** 14 lines of unrhymed iambic pentameter.
  2.  **Clear Volta (Line 9):** "But pause—this mirror held between the two..." signals the turn. The comparison itself ("this mirror") becomes the problem.
  3.  **Refusal to Resolve:** Lines 9-14 focus on the *failure* of the comparison to yield a neat moral ("Not lesson, nor decree—"). The expected reflection "Refracts," blurs, and reveals strangeness ("gesture caught mid-air," "consequence unlooked-for," "virtue spent / In veins of circumstance").
  4.  **Syntax Fracture:** Pre-volta syntax is relatively complete and parallel (e.g., "Ambition...strains," "clemency...becomes"). Post-volta, the syntax fragments:
      *   "Refracts." (Sentence fragment)
      *   "A gesture caught mid-air, half-meant," (Noun phrase)
      *   "A consequence unlooked-for, virtue spent / In veins..." (Noun phrase continued)
      *   "The likeness blurs." (Short, decisive statement)
      This mimics the breakdown of the parallel structure's clarity.
  5.  **Specific Plutarchan Conceit:** References "paired" figures (implicitly Alexander/"the Greek" and Caesar/"the Roman"), contrasting political structures ("royal bloodlines" vs. "civic chains"/"Senate's steps"), and specific virtues twisted (ambition unrestrained vs. strained by republicanism; clemency as policy in Gaul vs. calculated move in Rome - "measured stroke").
  6.  **Anti-Hagiography:** Opens by rejecting "saints entombed in gold or marble praise." Focuses on actions and context, not inherent holiness.
  7.  **No Sermonizing:** The poem *enacts* Plutarch's method and its result (unresolved tension revealing strangeness) rather than stating a lesson *about* it. The final line embodies the outcome: "Just figures turning stranger, endlessly."
  8.  **Plutarch-Reader Nod:** Specific details like "mailed fist" (Alexander's conquests), "mercy" (Caesar's clemency), "Gaul," "Senate's steps," the contrast of "royal bloodlines" and "civic chains," and the core mechanism of the "mirror" comparison itself signal deep engagement with the *Parallel Lives*.
  9.  **"Stranger, Less Exemplary":** The figures become enigmatic ("gesture caught mid-air, half-meant"), defined by unintended consequences and context ("virtue spent / In veins of circumstance"), ending as perpetually elusive ("figures turning stranger, endlessly").

  This poem aims to leave the audience with Plutarch's unique, unresolved tension – the sense that comparing lives doesn't simplify morality but deepens the mystery of character within history.
