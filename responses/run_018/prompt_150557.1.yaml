answer: |-
  ## The Nixon Shock as Institutional Metamorphosis: A Searlean Analysis

  Your query masterfully frames a pivotal monetary transition through Searle's institutional ontology. Let's dissect the event systematically.

  **Brute Fact Changes:**
  -   **The Gold Window Closure:** The physical termination of the U.S. Treasury's obligation to exchange dollars for gold at $35/ounce to foreign governments and central banks. This was a concrete, physical action – the "window" slammed shut.

  **Institutional Fact Changes:**
  -   **Suspension of Redeemability:** The crucial status-function **"U.S. dollars count as claims to a fixed quantity of gold held by the U.S. Treasury"** was deactivated. This destroyed the constitutive rule anchoring the dollar's value (at least internationally) to a tangible commodity.
  -   **End of Bretton Woods Monetary Order:** The broader institutional framework of fixed exchange rates pegged to the dollar (and thus indirectly to gold) collapsed. The status-function "The U.S. dollar counts as the world's central reserve currency *because* it is convertible to gold" was fundamentally altered.

  **Constants:**
  -   **Physical Notes:** The green pieces of paper themselves remained materially unchanged.
  -   **Legal-Tender Statutes:** U.S. laws declaring dollars as valid payment for all debts, public and private ("This note is legal tender for all debts, public and private") remained in force. This sustained the *domestic* constitutive rule: "Dollar notes issued by the Federal Reserve count as valid money in the United States."
  -   **Collective Acceptance (Core):** Crucially, the foundational collective intentionality assigning dollars the status-function "money" within the U.S. economy **persisted**. People continued to *accept* dollars as payment, stores *priced* goods in dollars, and the government *demanded* taxes in dollars. The core "X (dollar note) counts as Y (money) in C (U.S. transactions)" remained intact.

  **Analysis Direction 1: Persistence - Confirming Social Construction**
  The framework **powerfully explains persistence**. The suspension of gold convertibility removed *one specific grounding* for the dollar's status (its role as a gold claim), but it did not destroy the *core status-function of being money itself*, sustained by collective acceptance and backed by legal-tender laws. People didn't stop using dollars because the gold anchor was gone; they continued using them because:
  1.  **Collective Intentionality:** The "we-intention" to treat dollars as money persisted domestically.
  2.  **Status-Function Maintenance:** The constitutive rule defining dollars as legal tender (and thus money) was still enforced by law and social practice.
  3.  **Network Effects/Inertia:** The vast existing web of dollar-denominated contracts, debts, prices, and expectations created immense inertia. Switching costs were enormous.
  4.  **State Power:** The U.S. government continued to accept dollars for taxes and pay its obligations in dollars, reinforcing the status-function.

  **This confirms that money's value is fundamentally constituted by social agreement and collective intentionality, not intrinsic properties.** The paper retained its "monetary" status-function even after its link to a tangible commodity was severed, proving that the essence of money lies in the collectively assigned status, not the physical substrate.

  **Analysis Direction 2: Revision vs. Dissolution - A Theoretical Challenge?**
  The episode *does* expose a potential ambiguity in the theory regarding institutional change:

  *   **Revision:** Changing the constitutive rules *within* the institution. Nixon changed the rule defining the dollar *internationally* (from "redeemable for gold" to "not redeemable for gold") and implicitly altered its role within the Bretton Woods system.
  *   **Dissolution:** Eliminating the core constitutive rule(s) defining the institution itself. The core rule "Dollar notes count as money in the U.S." *was not dissolved*; it remained operational.

  **The Challenge:** The theory handles the *international monetary system* (Bretton Woods) well – its constitutive rules were fundamentally altered, leading to its effective dissolution. For the *U.S. dollar as money* domestically, however, it was clearly a revision of its grounding (removing the gold link) while preserving its core status-function.

  **Does it blur the line?** Yes, slightly, but it highlights a crucial nuance: Institutions can have **layered or interconnected constitutive rules**. The core rule ("X counts as money") can exist independently of subsidiary rules defining *why* it has that status (e.g., "because it's backed by gold," "because the state says so," "because it's useful for trade"). Revoking a *subsidiary* grounding rule (like gold convertibility) alters the institution's nature and functioning but doesn't necessarily dissolve the core institution if the foundational collective intentionality and core constitutive rule ("X counts as Y") remain intact. Declaring "chess no longer exists" would involve rejecting the core rule that "moving pieces on this board counts as playing the game of chess." Changing the rules (e.g., allowing pawns to move three squares) revises subsidiary rules but keeps the core institution alive. Nixon changed a major subsidiary rule of the "dollar game" but kept the core game running.

  **Conclusion: Identical Mechanism, Shifted Anchor**
  The underlying social mechanism of **collective intentionality assigning status-functions via constitutive rules** remains **identical** across commodity-linked and pure fiat regimes. What changes is the **nature of the grounding** for the collective acceptance:

  1.  **Commodity-Backed Regime:** Collective acceptance is anchored, in part, by the belief in the *convertibility promise* and the tangible value of the underlying commodity (gold). The status-function "money" piggybacks on the status-function "claim on gold."
  2.  **Fiat Regime:** Collective acceptance is anchored *directly* by:
      *   **State Authority:** Legal-tender laws, tax obligations ("This is money because the sovereign demands it").
      *   **Network Effects & Inertia:** The established use of the currency in countless transactions and contracts ("This is money because everyone else uses it").
      *   **Macroeconomic Belief:** Confidence in the stability of the currency's value and the ability of the issuing authority (central bank/government) to manage the money supply responsibly ("This is money because we believe it will retain value/be accepted tomorrow"). This belief is crucial and more exposed than under a gold standard.

  The Nixon Shock demonstrates that the **core constitutive power of collective intentionality** is paramount. While the *form* of the belief supporting that intentionality shifted – from belief in a gold promise to belief in state authority and macroeconomic stability – the fundamental mechanism creating and sustaining the institutional fact of "money" remained the same: **"We collectively accept that this X (paper/bytes) counts as Y (money) in context C (our economy), and we assign it the power to serve as a medium of exchange, store of value, and unit of account."** The gold was always just another layer of institutional fact sustained by collective intentionality; its removal revealed the pure fiat core that was always the ultimate foundation.
