  We are drafting a joint statement of an adversarial collaboration between Daniel Dennett (compatibilist) and Gregg Caruso (hard-determinist skeptic) on the specific issue of whether "just desert" can be coherently localized to modular sub-personal cognitive architectures.

  Structure:
  1. Agreed Claims: Numbered list of claims both parties can sign.
  2. Disagreements Table: Two columns, one for each position, with wording each side accepts.
  3. Cruxes: The key points of disagreement, especially:
     a) Whether the absence of a unified Cartesian ego undermines all ascriptions of desert or only global, person-level ones.
     b) Whether evolutionary-functional accounts can ground local desert without smuggling in a ghost-in-the-machine.
  4. Hypothetical Cases: For each crux, a concrete case (e.g., a defendant with an orbitofrontal lesion) with each side's evaluation.

  Conclusion: Identify purely verbal disagreements and specify what portion of the dispute survives.

  Let's proceed step by step.

  ---

  **Joint Statement: Adversarial Collaboration on Modular Desert**

  **Participants:**
  - Daniel Dennett, representing a compatibilist evolutionary-functional account of moral responsibility.
  - Gregg Caruso, representing a hard-determinist skeptical position.

  **Scope:** We focus not on the broad issue of free will, but on the conceptual sub-issue of whether "just desert" (specifically retributive desert) can be coherently localized to modular sub-personal cognitive architectures (e.g., failures of inhibitory control, predictive-processing errors, or localized neural dysfunctions) or whether desert necessarily requires attribution to a global, narratively integrated self.

  ---

  **Part 1: Agreed Claims**

  Both parties affirm the following:

  1. **Neuroscience of Decision-Making**: Human decision-making arises from complex, distributed neural processes that are fundamentally causal and deterministic (in the broad sense that includes probabilistic causation). There is no evidence for a non-physical, Cartesian ego as the source of decisions.

  2. **Modularity and Sub-Personal Systems**: Cognitive functions, including those relevant to moral decision-making, are implemented by relatively specialized and modular neural subsystems (e.g., for impulse control, empathy, prediction). These subsystems can be selectively impaired by trauma, disease, or developmental factors, leading to characteristic behavioral deficits.

  3. **Instrumental vs. Expressive Functions of Punishment**: Social responses to harmful behavior serve both instrumental functions (e.g., deterrence, rehabilitation, incapacitation) and expressive functions (e.g., moral condemnation, affirmation of community norms). The parties agree that instrumental functions are essential and justified, but disagree about whether expressive functions grounded in retributive desert are coherent or justified.

  4. **Distinction between Explanation and Justification**: Explaining the causal origins of a harmful behavior (e.g., via neuroscientific, psychological, or social factors) is distinct from justifying the assignment of blame and punishment. However, the parties disagree on whether causal explanations necessarily undermine retributive justifications.

  5. **Rejection of Retributive Desert in Absolute Terms**: Both parties reject the notion of *basic desert*—i.e., the idea that an agent intrinsically deserves punishment solely because they have knowingly done wrong, independent of consequentialist or forward-looking considerations. However, Dennett maintains a qualified, non-retributive notion of "just deserts" that is instrumental and forward-looking (e.g., holding agents accountable for reasons-responsive capacities within a social system), while Caruso rejects any vestige of desert and advocates for a public-health model.

  ---

  **Part 2: Disagreements Table**

  | Dennett's Compatibilist Position (Modular Desert Possible) | Caruso's Skeptical Position (Modular Desert Incoherent) |
  |------------------------------------------------------------|----------------------------------------------------------|
  | **On Desert Localization**: We can meaningfully ascribe desert (in a non-retributive, forward-looking sense) to failures of specific sub-personal modules when those modules are part of a system that, when functioning properly, would have enabled the agent to avoid harm. Such ascriptions are grounded in the evolutionary and social functions of holding agents accountable for maintaining responsible control systems. This does not require a Cartesian ego but rather depends on the agent's capacity for reason-guided self-control, which may be localized. | **On Desert Localization**: The very notion of desert, even if localized to a module, implicitly relies on a normative standard that presupposes an agent-level capacity for control and reasoning. Since modules are not agents and do not possess the requisite capacities for moral responsibility (e.g., reasons-responsiveness, reflective endorsement), desert cannot coherently attach to them. Without a unified agent to whom we attribute the act, desert attributions collapse. |
  | **On Modular Failures**: When a harmful act is directly caused by a localized dysfunction (e.g., an orbitofrontal lesion causing disinhibition), we can assign diminished desert to the agent because the failure is in a subsystem that normally contributes to responsible agency. However, the agent still retains other capacities and thus may bear some desert (e.g., for failing to seek help or manage the condition). | **On Modular Failures**: Localized dysfunctions illustrate why agent-level desert is unwarranted: they show that the agent is not the ultimate source of the behavior. The cause lies in a neural subsystem that the agent did not choose or control. Thus, the agent deserves no blame, though we may still impose measures to protect society. |
  | **On Social Response**: Punitive responses (e.g., blame, sanctions) are justified only when they serve forward-looking functions (e.g., enhancing future responsibility, signaling norms). In cases of localized dysfunction, responses should be tailored to the specific deficit (e.g., treatment, monitoring) rather than retribution. | **On Social Response**: All harmful acts, regardless of their neural origins, should be addressed through non-punitive, public health measures (e.g., quarantine, rehabilitation). The language of desert, even if localized, risks smuggling in retributive attitudes and should be replaced by functional descriptions of risk management. |

  ---

  **Part 3: Cruxes**

  1. **The Absence of a Cartesian Ego**: 
     - *Dennett*: The absence of a Cartesian ego does not undermine all ascriptions of desert. Desert can be localized to specific sub-personal systems that are crucial for responsible agency (e.g., inhibitory control systems). The global self is a distributed, narrative construct, and desert can be attributed to failures in key subsystems that support that self.
     - *Caruso*: The absence of a Cartesian ego undermines *all* ascriptions of desert because desert must attach to an agent as a unified locus of control. Without such an agent, desert cannot be localized to modules without anthropomorphizing them or creating a "homunculus" fallacy.

  2. **Evolutionary-Functional Accounts and Ghosts**: 
     - *Dennett*: Evolutionary-functional accounts can ground local desert without smuggling in a ghost-in-the-machine. The function of responsibility practices is to shape and regulate behavior by holding agents accountable for the proper functioning of their control systems. Desert is a social construct that tracks the agent's role in a system of mutual accountability, not a metaphysical property.
     - *Caruso*: Attempts to ground desert in evolutionary function inevitably smuggle in a ghost by treating modules as if they were mini-agents. Without a global agent, the functional role of a module cannot bear moral weight; it can only be a cause. The language of desert should be replaced by descriptions of causal contributions to harm.

  ---

  **Part 4: Hypothetical Cases**

  **Case 1: Orbitofrontal Lesion**
  *Scenario*: A defendant with a well-circumscribed orbitofrontal cortex lesion (acquired in adulthood) commits a violent assault. The lesion is shown to cause disinhibition and impulsivity, and the defendant had no prior history of violence or impulse control issues. Medical records confirm the lesion was undiagnosed and the defendant was unaware of it.

  - *Dennett's Evaluation*: 
    - **Culpability**: The defendant's desert is diminished because the lesion directly impaired a subsystem necessary for inhibitory control. However, the defendant retains other capacities (e.g., rational planning) and thus may bear some desert (e.g., for not seeking medical help for emerging symptoms). 
    - **Social Response**: The response should focus on treatment, monitoring, and rehabilitation. Punitive sanctions are unwarranted unless they serve specific forward-looking goals (e.g., incentivizing medical compliance).

  - *Caruso's Evaluation*: 
    - **Culpability**: The defendant deserves no blame because the behavior was caused by a neural deficit beyond their control. The lesion explains the behavior fully, and the agent-level capacities required for desert are absent.
    - **Social Response**: The defendant should be placed in a medical/rehabilitation facility until the risk is managed. No punitive measures are justified.

  **Case 2: Chronic Impulsivity due to Neurodevelopmental Disorder**
  *Scenario*: A defendant with a lifelong neurodevelopmental disorder affecting the prefrontal cortex commits theft. The disorder causes chronic impulsivity and poor planning, but the defendant has received extensive therapy and has been taught strategies to manage impulses.

  - *Dennett's Evaluation*: 
    - **Culpability**: Desert is significantly diminished but not absent. The defendant has some capacity to employ learned strategies and thus bears desert for failing to use them. The failure is localized to the executive control system, but the agent has a duty to compensate.
    - **Social Response**: Sanctions should be rehabilitative and educational, aimed at improving self-management skills.

  - *Caruso's Evaluation*: 
    - **Culpability**: No desert is warranted. The behavior is the result of a neural condition and environmental factors. The "failure" to use strategies is itself caused by the disorder and prior learning deficits.
    - **Social Response**: Supportive interventions (e.g., therapy, supervision) are appropriate; punishment is counterproductive.

  ---

  **Conclusion: Purely Verbal Disagreements and Remaining Dispute**

  1. **Verbal Disagreement**: The parties agree that "desert" should not be understood in a retributive, basic-desert sense. However, they disagree on the scope of the term: 
     - Dennett uses "desert" in a forward-looking, instrumental sense (e.g., "accountability desert" tied to social functions). 
     - Caruso reserves "desert" for retributive contexts and rejects its use entirely.

     *Resolution*: If "desert" is redefined to mean only forward-looking accountability, Caruso would still reject it as misleading and unnecessary, preferring terms like "functional assignment of accountability."

  2. **Remaining Dispute**: Even after clarifying terminology, the core disagreement persists: 
     - Dennett argues that we can and should attribute failures to specific subsystems (e.g., "your inhibitory control system let you down") as part of holding agents accountable for maintaining their cognitive machinery. This attribution is essential for effective moral education and social regulation.
     - Caruso argues that such attributions are either incoherent (because subsystems aren't responsible) or redundant (because the same work can be done by describing the causal role of the subsystem without any normative attribution of desert).

  Thus, the surviving dispute is whether the concept of localized desert (even in a forward-looking, non-retributive register) adds unique practical or explanatory value to our social practices, or whether it is an unnecessary and potentially harmful vestige of retributive thinking.

