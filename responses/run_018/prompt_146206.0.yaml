prompt: |-
  hey, im building a dataset on buddhist anatta vs personal identity and need a prompt thats not the usual "how can there be rebirth without a self" thing everyone asks. can you construct a thought experiment for me? here's the spec:

  set it in a realistic retreat center, not sci-fi. a meditator spends six months doing intensive vipassana-style tracking of the five skandhas, noticing every mental state arises and vanishes within seconds with no enduring owner behind them. after the retreat they meet a friend and try to explain why they still feel like the same person who arrived, even though they cant locate any continuous substrate.

  then do the analysis part: compare what an abhidharma-style reductionist view says about continuity here — maybe invoke the idea of momentary dharmas and causal seeds (bija) carrying traces — versus what a narrative-identity view (think MacIntyre-style or just the general story-based account) says about the thread linking start and end. state both verdicts on whether theres a persisting self in any meaningful sense, and identify exactly which feature of the retreat scenario does the heavy lifting for the buddhist side. finish with how a narrative theorist would attack that feature, and what happens to the buddhist answer if you remove the first-person observation of impermanence element.

  constraints: one paragraph for the scenario, no teleportation or brain uploads, no demons, keep it grounded. and please, dont just recycle the standard intro-philosophy rebirth puzzle — i want the tension between aggregate-reductionism and practical first-person storytelling, engineered so they talk past each other on the same concrete case. also a couple typos are totally fine, this is for a casual dataset.
