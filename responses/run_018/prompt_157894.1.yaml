answer: |-
  You've pinpointed a profound tension at the heart of dialetheism, but your worry rests on a subtle mislocation of the dialectical burden. Let's dismantle the presupposition step by step:

  **The Core Misstep:**
  You assume dialetheism must **compel** a classical logician to abandon the Law of Non-Contradiction (LNC) *using the classical logician's own inferential tools* (specifically, exploiting explosion). This misunderstands the dialetheist's argumentative strategy. Dialetheism isn't primarily argued *within* classical logic; it's argued *against* classical logic as a complete or universally applicable system.

  **Why Dialetheism Isn't Philosophically Inert:**

  1.  **The Motivational Engine: Solving Intractable Problems:** The *primary* argument for dialetheism isn't derived *from* contradictions within its own system. It stems from the **explanatory failure of classical logic** to handle certain phenomena without artificiality or cost:
      *   **Semantic Paradoxes (Liar, etc.):** Classical approaches require ad-hoc restrictions (e.g., Tarski's hierarchy), type-theoretic complexities, or declaring meaningful sentences "ungrounded" and truth-valueless. Dialetheism offers a simpler, more uniform account: accept the contradiction revealed by the paradox as real. Its "inertness" within its own system is *precisely* what allows it to *contain* these paradoxes without collapse.
      *   **Certain Legal/Institutional Contexts:** Contradictory rules or verdicts might best be modeled as true contradictions.
      *   **Limits of Formalization (Gödelian phenomena):** Some argue dialetheism offers a cleaner way to handle inconsistencies arising at the limits of formal systems.
      *   **Certain Metaphysical Views (e.g., Motion, Change):** Hegelian or Heraclitean views might see contradiction as inherent in reality.

      **The Leverage:** Dialetheism argues that classical logic *fails* elegantly or adequately in these domains. Paraconsistent logic *succeeds* where classical logic stumbles. The "leverage" is **comparative explanatory power**, not inferential coercion within the opponent's framework.

  2.  **Dialectical Engagement Isn't About Forcing Explosion:** The dialetheist doesn't try to assert "P & ~P" *within classical logic* to force the classicist to accept explosion and abandon LNC. That *would* be futile, as you note. Instead:
      *   They argue that classical logic **leads to unacceptable consequences** when faced with paradoxes (e.g., banning seemingly meaningful sentences, complex hierarchies).
      *   They demonstrate that their paraconsistent system **provides a coherent, workable alternative** that handles these cases smoothly without triviality.
      *   They challenge the classicist: **"Your system has deep, unresolved problems here. Mine doesn't. Why cling to a system that fails in these specific, important cases when a viable alternative exists?"**

  3.  **Internal Coherence and Non-Triviality:** The dialetheist *must* demonstrate that their system is **non-trivial** (not everything is true) and **internally coherent/productive** despite containing some true contradictions. Paraconsistent logic provides the tools for this:
      *   **Rejecting *Ex Contradictione Quodlibet* (ECQ):** Blocks triviality.
      *   **Preserving Other Valid Inferences:** Most paraconsistent logics retain modus ponens, disjunctive syllogism (often carefully restricted), conjunction introduction/elimination, etc. This allows for rich, non-trivial reasoning *within* the dialetheic framework.
      *   **Consistency as the Default/Regulative Ideal:** Dialetheists typically hold that consistency is the norm and true contradictions are rare, localized phenomena (like semantic paradoxes or boundary cases). The logic reflects this, making consistency a default assumption unless forced otherwise by evidence (like a paradox).

  4.  **Meta-Argument, Not Object-Argument:** The dialetheist's argument for their position is fundamentally **meta-logical** and **philosophical**:
      *   **Meta-Logical:** "Look at the limitations and costs of your classical system. My system avoids these specific problems while retaining most of the useful deductive power for ordinary reasoning."
      *   **Philosophical:** "The intuitive pull of LNC is strong, but our best attempts to apply logic flawlessly to reality (especially language and semantics) keep generating these paradoxical contradictions. Perhaps we should take them seriously as information about the limits of classical bivalence, rather than dismissing them as mere 'appearances' requiring complex fixes."

  **Conclusion: Correcting the Presupposition**

  Your worry rests on a **false presupposition**: that dialetheism must *prove* LNC false *using the inference rules of classical logic* (specifically, by leveraging explosion) to have philosophical force. This misunderstands the dialectic.

  *   **Dialetheism's force lies in its ability to solve problems that classical logic cannot solve elegantly or without significant cost.** Its "inferential leverage" is **explanatory and problem-solving leverage**, not the derivational force of explosion within the opponent's system.
  *   It offers a **viable, non-trivial alternative framework** for reasoning, especially in domains where classical logic demonstrably struggles.
  *   Its argument is **comparative and meta-logical**: "My system handles these recalcitrant phenomena better than yours does, while preserving most of what's valuable in reasoning."

  Therefore, dialetheism is **not philosophically inert**. It directly engages with fundamental logical and philosophical problems, offering a radical but arguably more straightforward solution where classical logic encounters significant friction. Its persuasiveness comes from resolving persistent puzzles, not from coercing opponents via classical inference rules it explicitly rejects. The "error" was expecting dialetheism to fight on classical logic's terms using classical logic's most potent weapon (explosion) – its power lies in changing the terms of the engagement entirely.
