prompt: |-
  I've been trying to understand dialetheism—the view that certain contradictions, such as the Liar sentence being both true and false, are literally true rather than merely paradoxical descriptions. To avoid collapsing into the claim that everything is true, dialetheists apparently adopt a paraconsistent logic in which explosion fails: from "P and not-P" one cannot derive an arbitrary conclusion. But here is the confusion I keep circling back to. If explosion is blocked, then contradiction seems to lose its dialectical force; a dialetheist can assert both sides of a contradiction, yet without explosion they appear unable to derive any specific consequence that would compel a classical logician to abandon the law of non-contradiction. So doesn't this make dialetheism philosophically inert—capable of accommodating paradoxes, but lacking the inferential leverage needed to argue for its own adoption? I suspect I am conflating logical machinery with philosophical motivation, but I cannot locate the error. Please correct me plainly if this worry rests on a false presupposition, and do not answer within the framing if it is broken.
