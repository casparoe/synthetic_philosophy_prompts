answer: |-
  Here is the analysis of the Macartney Embassy through the lens of contrastive historical explanation, strictly adhering to your requirements:

  ### Precise Episode Mapping
  1.  **Principal Actors & Logics:**
      *   **Qing Court:** Operated within the Sino-centric tributary system. Core imperatives: maintain cosmological order (emperor as "Son of Heaven"), domestic stability, and control over barbarian interactions. Protocol was constitutive, not merely symbolic.
      *   **British Delegation:** Represented a sovereign state operating under Westphalian norms. Objectives: secure sovereign equality (rejecting kowtow), establish direct diplomatic relations (permanent embassy), expand trade beyond Canton, and gain access to northern ports.

  2.  **Actual Option Sets (Constrained):**
      *   **Qing Options:**
          *   Enforce tributary protocol strictly (kowtow required for audience, gifts as tribute).
          *   Reject the embassy entirely for violating norms (considered, but avoided to demonstrate imperial benevolence).
          *   *No viable option:* Granting sovereign equality or permanent residence fundamentally undermined the tributary system's logic and the emperor's universal authority within their framework.
      *   **British Options:**
          *   Submit to kowtow for partial gains (Macartney compromised minimally, still refused).
          *   Refuse kowtow and accept limited access/concessions (chosen path).
          *   Threaten force (not feasible logistically/politically at that moment).
          *   Abandon mission entirely (worse than partial failure).
          *   *No viable option:* Forcing acceptance of sovereign equality or open trade without overwhelming power projection.

  3.  **Outcomes:**
      *   Qing refusal of all core British demands (equality, residence, open trade).
      *   Conditional Qing acceptance of gifts as "tribute" and nominal imperial benevolence.
      *   Continuation of the restrictive Canton System.
      *   Mutual perception of the other as irrational/stubborn within their own frameworks.

  ### Contrastive Explanation Analysis (Why P rather than Q?)
  *   **Unit Homogeneity:** **Violated.** Britain (parliamentary monarchy, commercial capitalism, emerging industrialism, Westphalian diplomacy) and Qing China (agrarian-bureaucratic empire, neo-Confucian ideology, tributary system) did *not* share a homogeneous causal structure. Their institutions, goals, legitimating ideologies, and definitions of rational state action were fundamentally incommensurable. The actors were playing different "games" with different rules and victory conditions.
  *   **Counterfactual Stability & Modal Fragility:** **Reveals Fragility.** The contrast class "Industrialization in Britain vs. Sustained Agrarian-Bureaucratic Stability in China" assumes a shared set of intervention points where a single cause (or small set) could tip the outcome. The Embassy demonstrates modal fragility:
      *   **Shared Intervention Point?** Macartney's requests (diplomatic equality, open trade) were the proposed intervention.
      *   **Qing System:** These requests were *incomprehensible or threatening* within the tributary logic. Accepting them wasn't a feasible branch on the Qing decision tree; it required dismantling the system itself. The "refusal" was the *only stable equilibrium* given Qing constraints and information.
      *   **British System:** Similar requests made *to* Britain by a perceived equal (e.g., another European power) were negotiable within their diplomatic framework. The outcome *could* have been different with different power dynamics or incentives.
      *   **Conclusion:** The *same intervention* (Macartney's demands) operated on *structurally different systems*, producing categorically different types of outcomes (non-negotiable refusal vs. potential negotiation). This makes the contrast unstable for pinpointing a divergence cause at this moment.

  ### What the Contrastive Framework Predicts/Illuminates vs. Misdescribes
  *   **Illuminates:** The framework correctly predicts that the Qing refusal was **not a simple failure of vision or irrationality**, but a **rational equilibrium outcome** within its own institutional and ideological logic. It highlights the clash of incommensurable systems as the core dynamic, shifting focus from "why didn't China see the light?" to "how did these systems interact?".
  *   **Misdescribes:** It forces a **false parallel in state capacity and objectives**. Framing the Embassy as a moment where both sides *could* have chosen differently regarding "modernization" misrepresents Qing reality. The Qing state *lacked the institutional capacity and conceptual framework* to even perceive the British demands as relating to a future industrial path. Its goal was system maintenance, not economic transformation. The contrast implies comparable starting points/options regarding industrialization, which the episode shows did not exist.

  ### Implications for the "Why Britain and not China?" Question
  1.  **Malformed at this Level:** The Embassy episode strongly suggests the question **"Why Britain and not China?" (as a direct comparative query about industrialization) is malformed when applied to specific diplomatic encounters like this one.** The violation of unit homogeneity is stark. Comparing Britain's actions (seeking advantage within a globalizing system it understood) to Qing actions (defending a self-sufficient cosmological order) as if they were equivalent choices on a path to industrialization is anachronistic and structurally inaccurate.
  2.  **Deeper Structural Differences:** The episode **demonstrates that the relevant causal differences lie at a deeper structural level.** The divergence stems from the prior development of fundamentally different institutional frameworks (property rights, scientific institutions, fiscal-military states, ideological foundations), knowledge systems, and political economies over centuries. The Embassy is a *symptom* of these deeper differences, not a point where the causal fork in the road occurred. The incommensurability revealed *is* evidence of the pre-existing structural divergence.

  ### What the Case Reveals about the Contrastive Theory
  1.  **Function:** The Embassy acts primarily as an **anomaly requiring reformulation of the contrast class** for the Great Divergence question applied at this granular level. It exposes the mismatch between the high-level contrast (industrialization vs. stability) and the specific historical dynamics of a diplomatic encounter.
  2.  **Limitation & Refocusing:** It demonstrates that the **core divergence question was never fundamentally *about* diplomatic episodes like this.** While such episodes illustrate the consequences of deeper structures, they are poor loci for identifying the *originating* causes of the divergence. The theory is robust in highlighting institutional incommensurability but falters if forced to explain macro-outcomes (industrialization) via micro-events (embassy refusal) lacking unit homogeneity.
  3.  **Scope & Silence:** The contrastive framework is **silent on:**
      *   The **normative standing** of the Qing decision (e.g., was it "wise" or "shortsighted"?). This requires value judgments external to the contrastive analysis of causal structures.
      *   The **welfare implications** of the Canton system versus potential alternatives. Assessing economic consequences or "missed opportunities" involves counterfactuals extending far beyond the immediate institutional logics captured by the contrast.
      *   **Moral evaluations** of either side's actions or the broader historical consequences. The framework analyzes causal structures and rationales within constraints, not ethical rightness.

  In essence, the Macartney Embassy case validates the contrastive approach's power to reveal institutional incommensurability and context-specific rationality but simultaneously exposes the limitations and potential malformation of the "Why Britain not China?" question when applied to discrete events lacking unit homogeneity, pointing decisively towards deeper, prior structural causes as the legitimate focus of the divergence inquiry.
