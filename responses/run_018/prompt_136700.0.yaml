  Now, applying contrastive explanation conditions: Unit homogeneity is violated here. Britain and Qing China had fundamentally different causal structures—sovereign equality vs. hierarchical tributary systems. The contrast class (industrialization vs. agrarian stability) isn't counterfactually stable because the same intervention (Macartney's requests) couldn't produce similar effects in both systems. The Qing refusal was rational within their logic, not a "failure of vision."

