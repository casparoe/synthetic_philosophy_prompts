answer: |-
  Here’s a distilled, actionable plan for your 90-min session. I’ll flag pitfalls, skip fluff, and honor your "no citations/live work" constraint. The core tension: **Can decentralized rules create "mind-like" emergence, or is it just aggregation?**  

  ---

  ### **Session Flow**  
  **Total: 90 min**  
  1. **Intro (5 min)**  
     - Frame the Aunt Hillary paradox: *"If individual ants follow simple rules, can the colony ‘think’? Today, YOU are the ants."*  
     - **Crucial:** Emphasize *silence* and *local focus* (no seeing the whole grid, no communicating).  

  2. **Setup (5 min)**  
     - Give each student:  
       - A card with **ONE local rule** (see below).  
       - A colored marker (unique color per person to track individual impact later).  
     - **Grid:** A large physical grid (e.g., whiteboard) divided into cells (e.g., 20x20). Time flows left-to-right (columns = time steps), rows = pitch (higher row = higher note).  

  ---

  ### **Activity: Silent Dot-Placement (20 min)**  
  - **Rules Example (tailor to 12 people):**  
    - *Student 1:* "Place a dot 1 row above the last dot in your left 3 columns."  
    - *Student 2:* "If two adjacent dots exist, place a dot 2 rows below the highest one."  
    - *Student 3:* "Place a dot randomly if no dot exists within 3 rows."  
    - *Student 4:* "Repeat the pattern of the last 3 dots but shifted down 1 row."  
    *(...and so on. Mix: repetition, randomness, conditionals. Avoid symmetry-breaking rules.)*  
  - **Constraints:**  
    - Only see adjacent cells (their "local view" = 3x3 grid around their last dot).  
    - No talking, gestures, or strategizing.  

  ---

  ### **Vote & Debate (10 min)**  
  - **Question:** *“Did ‘the room’ compose this, or did twelve individuals?”*  
    - Vote anonymously (A/B).  
  - **Spark tension:** Highlight if the pattern *feels* intentional (e.g., a rising/falling melody line).  

  ---

  ### **Debrief (45 min)**  
  1. **Map Emergence vs. Aggregation (20 min):**  
     - **Emergence:** "When did the pattern feel ‘bigger’ than the rules? (e.g., unexpected melody, self-stabilizing)."  
     - **Aggregation:** "When did it feel like disconnected parts? (e.g., chaos, isolated clusters)."  
     - **Key Q:** "Did the melody *constrain* your actions? If yes, that’s emergence."  

  2. **The Gap: What’s Missing? (15 min)**  
     - **"Subjective feel" is irreproducible.** The colony might *function* like a mind (problem-solving, adaptation), but it lacks **qualia** (what it *feels* like to be Aunt Hillary). The room didn’t "experience" composing—it executed rules.  
     - **Analogy:** Neurons fire → you feel pain, but the firing isn’t the pain. Here, dots form a melody, but no inner experience arises.  

  3. **Predictable Pitfalls (10 min)**  
     - **Chaos first:** Rules clash → scattered dots. *Why?* No initial coordination.  
     - **One person dominates:** Someone with a "loud" rule (e.g., "place dots everywhere") overrides others.  
     - **False emergence:** Students *infer* a global goal (e.g., "We’re making Bach!") and bend rules.  
     - **Solution?** Run it twice: First run = chaos, second run = impose stricter silence.  

  ---

  ### **What Will Go Wrong (Your Bets Are Right)**  
  1. **Chaos outbreak:** Rules conflict → random dots, no melody. *Fix:* Start with a "seed" (e.g., first dot pre-placed).  
  2. **Rule-breaker takes over:** One person ignores local view, "conducts" others via eye contact. *Fix:* Enforce "glue your eyes to your 3x3 grid."  
  3. **Frustration:** Students feel powerless ("My rule does nothing!"). *Lean in:* That’s the ant’s experience!  

  ---

  ### **Why This Works**  
  - **Embodied cognition:** They *feel* the tension between rules and emergence.  
  - **The fugue/fuge illusion:** If a melody emerges, it proves nothing *needs* a conductor... but the "mind" question unravels in the debrief.  
  - **No lecture needed:** The grid *is* the argument.  

  **Final Tip:** After voting, show their colored dots—individual efforts are visible, but the *pattern* is collective. That’s the ant colony in a nutshell.  

  Go make some emergent noise. 🐜🎵
