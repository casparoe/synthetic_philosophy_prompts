prompt: |-
  I'm enrolled in a seminar on intergenerational justice, and during our discussion of long-run climate mitigation a fellow student keeps invoking the line "future people don't exist yet, so there's nothing to discount" whenever someone argues that present carbon budgets ought to be shaped by the welfare of people in the 23rd century. He treats it as a knock-down objection that distinguishes climate obligations from obligations to present strangers: we may owe distant descendants a generic duty not to render the world uninhabitable, he says, but nothing owed specifically to them as particular beneficiaries. I want to bring a precise disambiguation to the next session rather than just disagreeing.

  Could you unpack the slogan as a menu of distinct philosophical claims? In particular, distinguish: (i) metaphysical readings about whether non-existent beings can be subjects of harm, including presentist versus eternalist ontologies of future persons and whether temporal parts have moral standing before they are actualized; (ii) normative readings about whether moral consideration requires actual existence, possible existence, or some intermediate modal status, and whether harming requires a victim who already is; (iii) axiological and economic readings that separate pure time preference—weighting welfare less merely because it occurs later—from risk-adjusted or extinction-risk discounting; and (iv) the practical inference from any of these premises to his specific conclusion that long-run mitigation is not owed to particular distant individuals. For each variant, say whether it is a platitude, a defensible substantive thesis, or false; and then indicate which readings actually license his dismissal of climate obligations, which leave the debate untouched, and which might even strengthen the case for present action on behalf of the far future.
reasoning: |-
  Okay, the user is enrolled in a seminar on intergenerational justice, specifically discussing long-run climate mitigation. Their fellow student keeps using the argument that "future people don't exist yet, so there's nothing to discount" to dismiss obligations to distant future generations. The user wants to unpack this slogan into distinct philosophical claims to bring a precise disambiguation to the next session.

  I need to analyze this argument comprehensively. The slogan "future people don't exist yet, so there's nothing to discount" seems to be making several philosophical moves at once. I should break it down systematically along the dimensions the user requested: metaphysical, normative, axiological/economic, and practical inference aspects.

  First, the metaphysical dimension. The student appears to be making a presentist ontological claim - that only currently existing entities have moral standing. But this is highly controversial. Philosophers like Derek Parfit have shown through thought experiments like the "non-identity problem" that present actions can harm future people even if they don't yet exist. Eternalist views of time would further undermine this position. So while this is a substantive thesis, it's not widely accepted in ethics.

  Next, the normative dimension. The claim that moral consideration requires actual existence faces serious challenges. Potential persons seem morally relevant when we consider policies affecting future generations. The student's position risks reducing future people to abstract entities rather than concrete individuals who will be affected by our climate decisions. This normative stance would indeed license dismissing specific obligations to future individuals.

  Then there's the axiological/economic dimension. This is where the "discounting" language comes in. The student seems to conflate pure time preference (which economists like Ramsey called ethically indefensible) with other forms of discounting. But discounting for risk or extinction probabilities is very different from discounting merely because welfare occurs later. This confusion needs untangling - some discounting methods might actually strengthen the case for present action on behalf of the far future.

  Finally, the practical inference. Even if we grant that particular future persons aren't identifiable now, this doesn't eliminate our obligations. We can still have duties regarding the conditions future people will face. The student's leap from "no particular beneficiaries" to "no specific obligations" is philosophically questionable.

  I should make clear which parts of this argument are defensible, which are weak, and how some interpretations might actually support stronger climate action. For example, while the metaphysical claim is debatable, the economic clarification about discounting could reveal that proper accounting strengthens long-term obligations.

  The user seems philosophically sophisticated but wants concrete tools for seminar debate. They're frustrated with what they perceive as an oversimplified objection shutting down discussion. My response should empower them with clear distinctions while maintaining academic rigor.
answer: |-
  Here's a precise disambiguation of the slogan "future people don't exist yet, so there's nothing to discount," structured to address your seminar debate. I've categorized the claims, assessed their plausibility, and shown their implications for climate obligations:

  ---

  ### **I. Metaphysical Readings: Can Non-Existent Beings Be Harmed?**
  1. **Presentist Ontology**: Only presently existing entities are real. Future persons are literally *nothing* until they exist.  
     - *Status*: **Defensible substantive thesis** (e.g., endorsed by some A-theorists of time).  
     - *Climate Implication*: **Licenses dismissal** of direct duties *to* specific future individuals.  
     - *Counterpoint*: Eternalism (B-theory) treats past/present/future as equally real, allowing "future persons" as determinate subjects of harm.  

  2. **Temporal Parts & Moral Standing**: Can "future temporal parts" of persons (e.g., the 23rd-century self of a person born in 2200) claim moral standing *now*?  
     - *Status*: **False/implausible** under most theories. Moral patients require actualization (even eternalists grant standing only to the *whole* temporally extended person).  
     - *Climate Implication*: **Leaves debate untouched** – obligations focus on the *whole future person*, not their pre-actualized parts.  

  ---

  ### **II. Normative Readings: Conditions for Moral Consideration**
  1. **Existence Requirement**: Moral consideration requires *actual* existence.  
     - *Status*: **False** (rejected by most intergenerational ethics). We routinely grant moral weight to *potential* persons (e.g., in reproductive ethics, inheritance law).  
     - *Climate Implication*: **Licenses dismissal** but relies on a minority view.  

  2. **Harm Requires a Present Victim**: Harming necessitates a victim who *already exists* to experience the harm.  
     - *Status*: **Defensible but contested** (e.g., Parfit's *non-identity problem*). If future people owe their existence to our harmful policies, are they "harmed"?  
     - *Climate Implication*: **Licenses dismissal** of *individualized* harm claims, but not *impersonal* harms (e.g., "making the future worse").  

  3. **Modal Status**: Moral weight requires *possible* existence (not actual or necessary).  
     - *Status*: **Platitude** (we don't owe duties to impossible beings).  
     - *Climate Implication*: **Strengthens action** – if future people are *possible*, we must ensure conditions for their *possible* welfare.  

  ---

  ### **III. Axiological/Economic Readings: What "Discounting" Means**
  1. **Pure Time Preference (PTP)**: Valuing present welfare more than future welfare *merely because it occurs earlier*.  
     - *Status*: **Ethically indefensible** for intergenerational justice (Ramsey: "a practice of mere beasthood"; Stern Review rejects PTP).  
     - *Climate Implication*: **Strengthens action** – rejecting PTP *increases* the weight of future welfare.  

  2. **Risk-Adjusted Discounting**: Discounting future costs/benefits due to *extinction risk* or *uncertainty* about future preferences/technology.  
     - *Status*: **Defensible substantive thesis** (e.g., Weitzman's "dismal theorem").  
     - *Climate Implication*: **Licenses reduced weighting** of the far future but *not* dismissal. High risk might even *increase* near-term mitigation (e.g., avoiding tipping points).  

  3. **Economic "Nothing to Discount"**: No identifiable future beneficiary → no calculable welfare to discount.  
     - *Status*: **Misguided** – welfare economics discounts *utility streams*, not persons. Future utility is modeled impersonally (e.g., Ramsey equation).  
     - *Climate Implication*: **Leaves debate untouched** – discounting applies to *well-being*, not "existents."  

  ---

  ### **IV. Practical Inference: Does This Defeat Climate Obligations?**
  - **His Inference**: No particular future beneficiaries → no obligations *to them* → no need to "discount" their welfare in carbon budgeting.  
  - **Flaws**:  
    1. **Confuses ontology with obligation**: Even if specific persons aren't harmed, we can have duties *regarding* future states (e.g., "no value erosion" – Gardiner).  
    2. **Ignores impersonal harms**: Making the future worse (e.g., uninhabitable) is bad *even if no particular person is made worse off*.  
    3. **Overlooks institutional obligations**: Present agents (states, firms) hold resources *in trust* for future generations (e.g., "chain of obligation" – Thompson).  

  ---

  ### **Conclusion: Which Readings Support His View vs. Climate Action**
  | **Claim**                          | Status                     | Effect on Climate Obligations                  |  
  |------------------------------------|----------------------------|-----------------------------------------------|  
  | Presentist ontology                | Defensible                 | **Licenses dismissal** of *direct* duties     |  
  | Harm requires present victim       | Defensible but weak        | **Licenses dismissal** of *individualized* harm |  
  | Pure Time Preference               | Indefensible               | **Strengthens action** (if rejected)          |  
  | Risk-adjusted discounting          | Defensible                 | **Reduces weighting** (but not dismissal)     |  
  | "No particular beneficiaries"      | True (for distant future)  | **Leaves debate untouched** (duties remain impersonal) |  

  **Key Takeaway for Your Seminar**:  
  - His slogan **only works** if he defends presentism *and* the existence requirement for harm – both highly contested in climate ethics.  
  - **Stronger counterarguments**:  
    - Reject PTP entirely (→ *more* weight to future).  
    - Frame obligations as **impersonal** (preventing catastrophe) or **institutional** (trusteeship).  
    - Argue that **risk-adjusted discounting** *increases* near-term action due to uncertainty about catastrophic risks.  

  Bring this disambiguation to show that his objection is either (a) metaphysically loaded and controversial, or (b) irrelevant to impersonal duties not to devastate the future. The core ethical imperative remains intact.
