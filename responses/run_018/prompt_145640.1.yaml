  ive been messing around with comparing two small open language mdoels by feeding them the same prompts and mapping their internal represenations. with concrete stuff like apple or running the alignment is pretty clean, but with abstract things like fairness or obligation the mapping slips — theres always another way to line them up that fits all my test cases, and each alignment gives the word a totally different internal role. i tried anchoring it with sentences like this is unjust because X happened, but then i just get a new ambiguity about what counts as because. every anchor i drop seems to create a fresh place where the two models could diverge. i know quine talked about translation being underdetermined, but im asking about this specific loop where disambiguiation anchors keep spawning new ambiguty higher up. does that have a name, or am i just dressing up the old gavagai problem in neural-net clothing? if theres a concept for it i want to know what it actually covers and where it stops — not just a bare label.
