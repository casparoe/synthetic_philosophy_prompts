  First, I need to recognize the core issue here. The user mentions Quine's indeterminacy of translation, which is a good starting point. Quine argued that there are always multiple valid translations for a word or phrase. But the user is seeing this in neural networks, where internal representations for abstract concepts aren't one-to-one mappable. 

  Then there's the anchoring problem. Each attempt to clarify using context introduces new variables. For example, using "because" in a sentence to define "unjust" now makes "because" itself ambiguous. This recursive ambiguity seems to be the main frustration. The user calls it a loop and wonders if it's just the gavagai problem in neural networks.

  I recall that in machine learning, especially with neural nets, the internal representations are high-dimensional vectors. Abstract concepts are distributed across many neurons, influenced by the model's architecture and training data. Unlike concrete objects, fairness doesn't have a sensory anchor, so its representation is shaped by the contexts it's trained on. If two models have different training data or architectures, their feature spaces for abstract concepts will differ significantly.

  The recursive aspect is key. Each new anchor (like defining "unjust" with "because") shifts the alignment problem to a higher-order concept. It's not just that the mapping is underdetermined, but that disambiguation attempts propagate ambiguity upward. This feels like a regress similar to semantic holism, where meanings depend on the entire network. 

  I should consider related concepts. Semantic holism in philosophy suggests meanings are interdependent. In NLP, structural divergence in embeddings explains why models might organize their feature spaces differently. Functional equivalence and polysemy also play roles. The user might be encountering compositional divergence, where the way models combine words affects higher-level representations.

  The user wants to know if this specific recursive ambiguity has a name. While there's no single term, the combination of indeterminacy, semantic holism, and structural divergence covers it. They also need to understand the boundaries—where does this problem stop? The answer lies in the degree of abstraction and model similarity. Concrete concepts are stable due to shared sensory inputs, but abstract ones depend on linguistic context, which varies. Models with similar training and architecture might align better, but never perfectly for all abstract concepts.

