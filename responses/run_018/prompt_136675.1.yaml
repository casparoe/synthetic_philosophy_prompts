  ### Tranquilist Clinical Decision Procedure  
  *Adopted by the Clinical Ethics Committee*  

  **Framework Principles**  
  - **Intrinsic Goods**: Only absence of suffering and absence of craving.  
  - **Instrumental Values**: Life extension, autonomy, dignity, relational presence, and narrative coherence matter only if they causally affect suffering/craving.  
  - **Key Dimensions**:  
    - **First-order suffering (FoS)**: Present, experienced distress (e.g., pain, nausea).  
    - **First-order craving (FoC)**: Present desire for reality to differ (e.g., appetitive: craving food; aversive: craving pain to stop).  
    - **Second-order craving (SoC)**: Desire about one's own mental states (e.g., craving to stop suffering, craving to preserve a meaningful longing).  
    - **Latent craving/suffering (L)**: Disposition to suffer or crave if conditions change (e.g., in an unconscious patient).  

  **Decision Procedure**  
  *Execute steps in order. Answers must be documented.*  

  1. **Step 1: Current State Assessment**  
     - **(i) Question**: What is the patient’s current FoS, FoC, SoC, and L? For L: Use the *Latent Disposition Check*: "If the patient were conscious/aware now, would they experience suffering/craving? If they regain consciousness later, what is the probability and severity?"  
     - **(ii) Sufficient Answer**:  
       - Quantify intensity (0–10 scale) and duration (e.g., "FoC intensity 8, persistent").  
       - For L: Estimate probability (0–100%) and severity if activated (e.g., "If conscious: 80% chance of FoS intensity 6").  
     - **(iii) Type**: Clinical/factual.  
     - **(iv) Next**: Proceed to Step 2.  

  2. **Step 2: Natural Course Projection (No Intervention)**  
     - **(i) Question**: What is the projected trajectory of FoS, FoC, SoC, and L until death, without intervention? Include time to death and activation of L.  
     - **(ii) Sufficient Answer**:  
       - Estimate burden as **Burden(Natural)** = Σ [Intensity × Duration] for all dimensions over time.  
       - For L: Include expected burden weighted by probability (e.g., "L burden = Probability × Intensity × Duration").  
     - **(iii) Type**: Clinical/factual.  
     - **(iv) Next**: Proceed to Step 3.  

  3. **Step 3: Intervention Projection (With Intervention)**  
     - **(i) Question**: What is the projected trajectory of FoS, FoC, SoC, and L until death, with intervention? Include changes in death timing and L activation.  
     - **(ii) Sufficient Answer**:  
       - Estimate **Burden(Intervention)** = Σ [Intensity × Duration] for all dimensions.  
       - For life-shortening/extending interventions: Only suffering/craving *during life* counts; absence after death has no intrinsic value.  
     - **(iii) Type**: Clinical/factual.  
     - **(iv) Next**: Proceed to Step 4.  

  4. **Step 4: Net Tranquilist Balance (NTB) Calculation**  
     - **(i) Question**: What is NTB = Burden(Natural) – Burden(Intervention)?  
     - **(ii) Sufficient Answer**:  
       - Compute NTB by subtracting Intervention burden from Natural burden.  
       - **NTB > 0**: Intervention reduces net burden → Proceed to Step 5.  
       - **NTB < 0**: Intervention increases net burden → Stop: Recommend **against**.  
       - **NTB = 0 or Uncertain**: Tranquilism is silent → Hand off to **non-tranquilist authority** (e.g., family, legal guardian).  
     - **(iii) Type**: *Judgment call* (clinical/values-based). Requires aggregating dimensions; intensity/duration weighting is subjective.  
     - **(iv) Next**: Branch per NTB result.  

  5. **Step 5: Non-Tranquilist Constraints Check**  
     - **(i) Question**: Does law, institutional policy, or incapacitated patient’s prior directive prohibit the intervention despite NTB > 0?  
     - **(ii) Sufficient Answer**:  
       - If prohibited → Hand off to **designated authority** (e.g., legal team, surrogate).  
       - If permitted → Stop: Recommend **for** intervention.  
     - **(iii) Type**: Factual (legal/institutional).  
     - **(iv) Next**: Branch per constraints.  

  ---

  **Mechanical Misfire Warning**  
  - **Case Type**: A fully conscious patient with severe treatment-resistant depression and no physical pain. They have intense FoC for death and SoC (distress about their "unworthy" desire to die).  
  - **Recommendation**: NTB supports assisted death (eliminates all craving/suffering).  
  - **Conflict**: Clinical intuition may prioritize preserving life or treating psychological distress.  
  - **Why Demanded**: Tranquilism assigns no intrinsic value to life; death eliminates all burden.  

  ---

  **Case Applications**  

  **Case A**: Conscious, terminally ill patient requests withdrawal of artificial hydration. Reports no FoS, but intense FoC (appetitive craving for future family milestone). Withdrawal hastens death.  
  - **Step 1**: FoS=0, FoC=8 (persistent), SoC=0, L=0 (conscious).  
  - **Step 2**: Burden(Natural) = FoC (intensity 8 × 14 days) = 112 units.  
  - **Step 3**: Burden(Intervention) = FoC (intensity 8 × 3 days) = 24 units (assumes palliative care prevents dehydration suffering).  
  - **Step 4**: NTB = 112 – 24 = 88 > 0 → Proceed to Step 5.  
  - **Step 5**: No legal barrier to honoring competent request → **Recommend FOR withdrawal**.  
  - **Hand-off**: None.  
  - **Misfire Risk**: None.  

  **Case B**: Deeply sedated, non-responsive patient on respiratory-suppressing infusion (suppresses all FoS/FoC). Family requests continuation for relational presence. Discontinuation causes death in hours without suffering/craving.  
  - **Step 1**: FoS=0, FoC=0, SoC=0, L=0 (no recovery prospect; latent check negative).  
  - **Step 2**: Burden(Natural) = 0 (unconscious, no suffering/craving possible).  
  - **Step 3**: Burden(Intervention) = 0 (death without distress).  
  - **Step 4**: NTB = 0 – 0 = 0 → **Hand off to FAMILY** (tranquilism silent; decision based on relational values).  
  - **Recommendation**: None from tranquilism.  
  - **Misfire Risk**: None.  

  **Case C**: Introduce loud music in dementia ward. Reduces FoC-driven wandering in 70% of residents but causes mild FoS (headache) in 30%. Unpredictable individual response.  
  - **Step 1 (per resident)**:  
    - Natural: FoC intensity 5 (baseline wandering).  
    - Intervention: 70% chance FoC=0; 30% chance FoS=2 (headache) + FoC=5.  
  - **Step 2**: Burden(Natural) = 5 units/day.  
  - **Step 3**: Burden(Intervention) = (0.7 × 0) + (0.3 × [2 + 5]) = 2.1 units/day.  
  - **Step 4**: NTB = 5 – 2.1 = 2.9 > 0 → Proceed to Step 5. *Judgment call*: Aggregates group data; ignores distributive fairness.  
  - **Step 5**: No legal barrier → **Recommend FOR music intervention**.  
  - **Hand-off**: None.  
  - **Misfire Risk**: Harms 30% with headaches for group benefit. Framework demands it (net burden reduced).  

  ---  
  **Procedure End**
