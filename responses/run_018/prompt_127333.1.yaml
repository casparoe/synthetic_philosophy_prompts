answer: |-
  Let me begin by carefully unpacking the core commitments of Dennett's narrative gravity model, as this foundation is essential for analyzing Clive Wearing's case. Dennett's central thesis is a radical departure from substance dualism and even from many materialist accounts positing a unified neural substrate for the self. He argues that the self is not a thing—not a soul, a brain module, or a persistent "Cartesian theater" of consciousness—but rather a useful fiction generated by a web of narratives. This narrative web serves as a "center of gravity," a theoretical abstraction that provides coherence, continuity, and functional unity to the complex, distributed processes of the mind. The self emerges from the act of telling and revising an autobiographical story, a process deeply embedded in social interaction, language, and the brain's interpretive machinery. Crucially, this narrative is not merely descriptive; it is constitutive. There is no "real" self behind the narrative; the narrative *is* the self. Continuous updating—integrating new experiences, reconciling inconsistencies, projecting future possibilities—is not just something the self *does*; it's the very process that *sustains* the self. Without this dynamic narrative construction and revision, the self, as we ordinarily understand it, dissolves.

  Applying this framework to Clive Wearing presents a stark and profound test. Wearing's viral encephalitis devastated his hippocampus and related medial temporal lobe structures, obliterating his capacity to form new episodic memories. His world is confined to a perpetual, fleeting present—often described as lasting only seconds or minutes. He experiences intense, repeated "awakenings," believing he has just regained consciousness for the first time in years, accompanied by profound disorientation and distress. Yet, critically, he retains deep, unwavering emotional recognition and attachment to his wife Deborah. He greets her with overwhelming joy each time she enters the room, believing he hasn't seen her in years, even if she stepped out moments before. Furthermore, his highly skilled procedural memory for music—playing the piano, conducting—remains remarkably intact. He can perform complex pieces, sight-read, and even improvise.

  Mapping the "center of narrative gravity" in Wearing's situation requires precision. According to Dennett's model, the *continuous updating* of the autobiographical narrative has catastrophically collapsed. Wearing cannot integrate new experiences into his life story. He cannot reconcile the immediate past (seconds ago) with the present, nor project a coherent future self. The grand, evolving narrative that constitutes his selfhood, in Dennett's terms, is frozen. The "center of gravity" for a temporally extended, reflective self has, in a very real sense, dissolved. There is no longer a *single*, dynamically updated narrative providing coherence across time.

  However, the theory explains several crucial features well. Wearing's repeated, identical emotional outbursts upon seeing Deborah—the sheer intensity of joy followed by the anguish of her perceived "departure" moments later—are perfectly consistent with the narrative model's emphasis on emotional orientation as a core component of the self-narrative. Deborah is a fixed, emotionally charged landmark in the frozen fragments of his past narrative. His profound affective response upon seeing her isn't mere recognition; it's the eruption of a deeply ingrained narrative fragment concerning love, loss, and reunion. His emotional world, anchored to this fragment, provides a startlingly consistent, albeit fractured, point of stability—a *minimal* affective center of gravity. This persistent affective orientation, rooted in pre-morbid narrative structures that survive the amnesia, demonstrates how powerful these narrative elements can be, even when the narrative engine itself is destroyed. It shows that powerful narrative *fragments* can persist and drive intense, consistent emotional responses, acting as residual anchors.

  Where the theory struggles significantly is with Wearing's preserved musical capacity. His ability to play the piano fluently, conduct a choir, sight-read, and improvise operates entirely outside any autobiographical narrative context. This is embodied, procedural knowledge—skillful know-how deeply embedded in motor patterns, auditory processing, and implicit memory systems. Dennett's narrative gravity model, focused intensely on the representational, linguistic, and autobiographical level, offers no clear account of how such complex, temporally extended, non-representational action constitutes or relates to the self. The theory remains largely silent on how procedural mastery, executed flawlessly over minutes (far exceeding his "moment-to-moment" awareness window), integrates with or contributes to the center of gravity. It doesn't misdescribe this reality so much as fail to provide a framework for it. The music flows *through* him without enriching or altering his narrative self, posing a challenge: does this embodied expertise represent a different *kind* of self-persistence, or is it merely a biological automaton operating independently?

  Wearing's case reveals crucial insights about the theory. On one hand, it strongly confirms that a rich, temporally extended, *autobiographically updated* narrative is necessary for what we recognize as full, reflective human selfhood. Without the capacity to weave present experiences into a past and project a future, the self as a coherent locus of identity across time vanishes, replaced by a fragmented series of intense, disconnected moments anchored only by deeply ingrained affective residues and procedural routines. This collapse validates Dennett's claim that the self is constituted by narrative dynamics, not just biology.

  On the other hand, Wearing powerfully demonstrates that Dennett's model, in its focus on the narrative as the constitutive element, potentially neglects or under-theorizes the contribution of non-representational, embodied, and affective capacities to a *minimal* sense of presence and agency. The enduring love for Deborah, rooted in emotional memory, and the intact musical performance, rooted in procedural memory, suggest a persistent *substrate* of self-related capacities that survive the narrative collapse. This isn't a Cartesian substrate, but a biological one: affective dispositions and embodied skills that provide continuity, coherence of expression, and a point of view, however fleeting. They constitute a form of minimal selfhood—a "here and now" agent with emotional attachments and skills—that persists even when the autobiographical narrative fails entirely. The theory allows for the *importance* of emotion and skill within the narrative framework (Deborah as a narrative landmark, music perhaps as a narrative activity), but it struggles to account for their persistence and functional autonomy *as* elements of selfhood when the narrative framework disintegrates. Ultimately, Wearing shows that while narrative gravity is essential for the *rich, temporally extended self*, there exists a layer of minimal selfhood—grounded in emotion, embodiment, and non-declarative memory—that narrative alone cannot fully explain, revealing a potential limitation in the scope of Dennett’s model. The center of narrative gravity collapses, but significant gravitational forces, anchored elsewhere, remain.
