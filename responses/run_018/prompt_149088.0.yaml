  hey im a backend dev with no phil background. im trying to wrap my head around rigid designators and that necessary-a-posteriori idea kripke talked about — the thing where an identity can be necessary but you only learn it empirically. lately ive been dealing with UUID primary keys that stay identical across database forks, and it got me wondering: if frege was alive today and saw this, do you think hed treat a UUID as a rigid designator that completely lacks sense or mode of presentation? and more broadly, would he reject the necessary-a-posteriori claim because it blurs his sense/referance line?

