prompt: |-
  I am leading a two-hour seminar for a reading group of quantitative master's students in computer science and statistics. They are comfortable with probability, conditioning, expected utility, and basic causal graphs, but they have never worked through decision theory beyond Newcomb's problem, and most of them treat Newcomb's problem as a parlour trick rather than as a diagnostic instrument. I want the session to get them to see what counterfactual mugging and XOR blackmail jointly establish: that the genuine choice point in such cases is between selecting an act and selecting a policy or decision procedure, and that once that distinction is in place, updatelessness — acting on branches of reality one knows one is not in — stops looking like superstition and begins to look like a stable stopping point.

  For reference, the two scenarios are, in compressed form. In counterfactual mugging, a perfect predictor flips a fair coin; if the coin lands tails it asks you for $100, and if it lands heads it pays you $10,000 just in case it predicted you would have paid had it landed tails. You are asked, so you know you are in the tails branch. In XOR blackmail, the predictor sends you a message just in case exactly one of the following holds: your house is infested with termites, or you will pay it $1,000; an infestation would cost you $1,000,000.

  I do not want you to write the explanation itself. I want a teaching plan: the order in which components must be introduced and why each depends on the previous one, the single worked example the session should return to, the misconceptions this audience will predictably form and where in the sequence each should be headed off, the closing check that would show the idea has landed rather than merely been tolerated, and what should be left out and openly flagged as omitted.

  Specifically, give me:

  1. The prerequisite idea that must be secured before either problem is intelligible — the thing which, if it is not in place, will make the students experience both cases as conjuring tricks rather than arguments.

  2. An ordering for the session. Should counterfactual mugging come before XOR blackmail, or the reverse? In what precise sense should the first case stage a problem for reasoning about acts, and the second a different problem for reasoning about evidence and correlation? Which intermediate notions (for example, pre-commitment as legitimate but unavailable in the posted choice; the difference between the probability of an act and the probability of a policy; prediction as correlation with the decision procedure rather than with the surface action) need to be built between the two cases, and why?

  3. One carrying example. Decide which of the two scenarios should serve as the spine of the session, and state what features it must have and must lack for the pedagogical point to survive — for instance, a fair coin rather than a logical fact, perfect prediction rather than merely statistical prediction, a one-shot choice rather than a repeated game, and a mixed-upside structure in which the benefit lands in the branch the agent knows it is not in. If the cleanest spine is a simplified common core of both scenarios rather than either standard version, specify that core.

  4. A misconception map. For each of the following predictable moves — and for any others you judge as pressing — say at which point in the sequence it should be addressed and how to address it without dismissing it: 'the predictor is impossible, so the problem floats on a false presupposition'; 'this is just Newcomb's problem with the labels changed'; 'I would pay only because it buys me a reputation as a cooperator'; 'XOR blackmail is simply correlation rather than causation, so the causal decision theorist is obviously right and that closes the matter'; 'the two problems are the same problem described twice'. Be specific about whether each misconception is best pre-empted by an example, by a modification of the carrying example, or by pausing the sequence and extending the current case.

  5. A closing check of understanding. Design a short exercise or question, answerable in five minutes without new machinery, that would distinguish a student who has genuinely grasped why the two problems push in opposite directions from a student who has merely learned to say 'choose the policy, not the act'. Say what a correct-but-shallow answer looks like and what a correct-and-deep answer adds.

  6. A conscious omission list. State which neighbouring topics — logical counterfactuals, proof-based decision theory, the formal differences among updateless, timeless, and functional decision theories, reflective oracles, or anything similar — you would explicitly decline to cover, and explain how drawing that boundary can itself reinforce the main point rather than deflate the session.

  Do not provide a reading list or citations; the plan should be built from the two scenarios themselves.
reasoning: |-
  We are building a teaching plan for a two-hour seminar. The goal is to show that in decision problems like counterfactual mugging and XOR blackmail, the key choice is between selecting an act (at a node) and selecting a policy (a decision procedure that covers all nodes, even those not reached). The endpoint is that updatelessness (acting on branches one isn't in) is a stable stopping point.

  Prerequisite Idea (Item 1):
  The essential prerequisite is understanding that a decision problem can be structured such that the agent's choice is not just about the immediate act but about a *policy* that covers multiple possible states (even counterfactual ones). This must be tied to the idea that a predictor is not predicting the act at the node but the policy the agent uses. Without this, the predictor's action seems magical. We must establish that the predictor's prediction is about the entire decision procedure (or policy) the agent would use, not just the act at the current state. This is the foundation that turns the problem from a trick to an argument about what kind of entity (act or policy) is the object of choice.

  Ordering (Item 2):
  We start with Counterfactual Mugging (CM) because it is simpler in structure and has a clear counterfactual branch. Then we move to XOR Blackmail (XB) because it introduces evidence that correlates with the state and the act, which complicates the reasoning.

  Sequence:
  1. Counterfactual Mugging (CM):
     - Present the scenario: fair coin flip, heads: you get $10,000 if you would have paid in the tails world; tails: you are asked for $100.
     - You are in tails. What do you do?
     - The problem: If you condition on being in tails, paying $100 seems to lose money because the heads branch is already fixed. But if you adopt a policy of always paying (i.e., you precommit to paying in both branches), then you get $10,000 in heads and lose $100 in tails, which is a net gain.
     - Stage the problem: Reasoning about the act at the node (tails) leads to not paying. But reasoning about the policy (if I had committed to paying no matter what) would have been better. However, at the moment of decision, you cannot change the policy, only the act.
     - Intermediate notion: The predictor is predicting your policy, not your act at the node. The policy is what you would do in all branches. The predictor uses the policy to set the outcome in the heads branch.

  2. Build the idea of a policy:
     - In CM, the policy is a function from the coin flip to an action. We can consider two policies: "always pay" and "never pay".
     - Compare the expected utility of the two policies:
          - Always pay: EU = 0.5 * (-100) + 0.5 * (10,000) = 4,950
          - Never pay: EU = 0.5 * (0) + 0.5 * (0) = 0
     - So the policy "always pay" is better. But when you are in tails, you are tempted to defect from that policy because you know the predictor has already set the heads outcome. However, if you defect, you are effectively choosing the "never pay" policy (because in the tails branch you don't pay, and in the heads branch the predictor knew you wouldn't pay so you get nothing). So the act at the node is not independent of the policy.

  3. Move to XOR Blackmail (XB):
     - Present the scenario: The predictor sends a message only if exactly one of two things is true: (1) your house has termites (which would cost you $1,000,000), or (2) you will pay $1,000. Otherwise, no message. You receive a message. What do you do?
     - The problem: If you pay, then the message must have been sent because of the termites (since if you pay, then the XOR condition is satisfied only by termites). But then you have paid $1,000 and still have termites. If you don't pay, then the message was sent because you weren't going to pay and the termites are present? Actually, let's break it down:
          - Let T be termites present (cost $1M if not fixed), P be the decision to pay (cost $1,000). The predictor sends a message M if T XOR P (i.e., not both and not neither).
          - You observe M. You must decide to pay or not.
     - The causal decision theorist conditions on M and asks: what is the effect of paying? But note, by paying, you change the condition of the message: if you pay, then M was sent because T (termites) and not because of your payment. So paying doesn't change the termites. It only costs you $1,000 and you still have termites. So you think you shouldn't pay.
     - However, consider the policy: if you adopt a policy of never paying, then the predictor sends a message only when you have termites. So if you get a message, you know you have termites. But you don't pay, so you lose $1M. If you adopt a policy of always paying, then the predictor sends a message only when you don't have termites. So if you get a message, it means no termites, and you pay $1,000. So you lose $1,000. Compare:
          - Policy "always pay": when you get M (which in this policy only happens when no termites), you pay $1,000 and avoid no other cost. So cost = $1,000.
          - Policy "never pay": when you get M (which in this policy only happens when termites), you don't pay, so cost = $1,000,000.
     - Clearly, the policy "always pay" is better. But at the node where you have received M, if you condition on M and then decide to pay, then (by the logic above) you infer that you have termites and paying doesn't help. So you don't pay. But that leads to the worse outcome.

  4. Contrast CM and XB:
     - In CM, the issue is that if you condition on being in tails, you ignore the heads branch. But the policy reasoning considers both branches. The problem is about ignoring a branch that doesn't happen.
     - In XB, the issue is that conditioning on the evidence (M) creates a correlation between the state (termites) and the act (paying). The policy reasoning avoids this by fixing the policy in advance.

  The key intermediate notions:
     - The difference between the probability of an act and the probability of a policy: In CM, the predictor uses the policy to determine the outcome in the heads branch. In XB, the evidence (M) is generated based on the policy and the state.
     - Pre-commitment: In both cases, if you could pre-commit to a policy, you would. But the problem is that in the actual choice node, you are tempted to defect from the policy because you condition on the current state/evidence.

  Carrying Example (Item 3):
  We will use Counterfactual Mugging as the spine because it has a simpler structure and does not involve evidence about the state. The key features we must have:
     - A random event (fair coin flip) that creates two branches.
     - The agent is in one branch (tails) and is asked to make a payment.
     - The outcome in the other branch (heads) depends on what the agent would have done in the tails branch (or more precisely, on the policy).
     - The benefit (large reward) is in the branch the agent is not in (heads) and is conditional on the policy.

  We must avoid:
     - Repeated games (to avoid reputation arguments).
     - Imperfect prediction (to avoid complicating with probabilities of prediction).
     - Logical facts (to keep it simple with a coin flip).

  So the carrying example is the standard CM.

  Misconception Map (Item 4):

  1. "The predictor is impossible, so the problem floats on a false presupposition."
     - Address when first introducing CM. Explain that we are assuming the predictor is perfect to isolate the decision-theoretic issue. The problem is about how to reason given such a predictor. Without the predictor, the problem doesn't arise. This is a modeling assumption.

  2. "This is just Newcomb's problem with the labels changed."
     - Address after presenting CM. Point out that in Newcomb's, the boxes are set before you choose, and you condition on the prediction. In CM, the point is that the reward is in a branch you are not in. Newcomb's has two boxes in front of you; CM has a counterfactual branch. They are similar in that they both involve a predictor, but the structure is different: Newcomb's is about dominance and conditioning on the prediction, while CM is about the counterfactual branch.

  3. "I would pay only because it buys me a reputation as a cooperator."
     - Address in CM because it is one-shot. Emphasize that there is no reputation: it's a one-shot interaction. The predictor is not an agent that you interact with again. The only effect is through the prediction.

  4. "XOR blackmail is simply correlation rather than causation, so the causal decision theorist is obviously right and that closes the matter."
     - Address when presenting XB. Explain that CDT conditions on the evidence and then computes causal effects. But in XB, conditioning on the message creates a spurious correlation. The policy perspective avoids this. We are not denying that CDT would say not to pay; we are arguing that CDT leads to a worse outcome than following the better policy.

  5. "The two problems are the same problem described twice."
     - Address after presenting both. Contrast: 
          - CM: no evidence about the state (you know the coin flip). The issue is ignoring the counterfactual branch.
          - XB: you have evidence (the message) that correlates with the state and the act. The issue is that conditioning on the evidence confounds the decision.

  Closing Check (Item 5):
  Exercise: Consider a variation of CM where the coin is biased: it lands heads with probability 0.9 and tails with 0.1. In tails, you are asked for $100. In heads, you get $10,000 if you would have paid in tails. Now, you are in tails. What do you do? Why?

  Shallow correct answer: "I choose the policy. The policy of always paying has EU = 0.9 * 10,000 + 0.1 * (-100) = 8,990. The policy of never paying has EU = 0. So I should pay."

  Deep correct answer: "Even though the probability of tails is low, the policy of paying is still better. But note, when I am in tails, I know that the heads branch is already fixed. However, if I don't pay, then I get $0 in tails and $0 in heads (because the predictor knew I wouldn't pay). If I pay, I lose $100 in tails but get $10,000 in heads. But wait, in the heads branch, I get $10,000 only if the predictor predicted I would pay in tails. Since I am in tails, the predictor already set the heads branch. But if I pay now, that means the predictor must have predicted I would pay? No, because I haven't paid yet. This is the key: the predictor predicted what I would do in this situation. If I follow the policy of always paying, then the predictor would have known that and set the heads branch accordingly. But if at the last minute I defect, then the predictor would have predicted that. So in the tails branch, if I don't pay, it must be that the predictor already knew that and so I get nothing in heads. Therefore, by paying in tails, I am not causing the heads outcome; I am just being consistent with the policy that would have gotten me the heads reward. The causal structure is such that the act in tails is evidence about what the predictor did in heads, but not causing it. However, the deep point is that the only way to get the heads reward is to have committed to the paying policy. And by paying in tails, I am implementing that policy. The low probability of tails doesn't change the fact that the policy is better. But note: the expected utility of the policy is computed ex ante. At the tails node, the agent who hasn't precommitted is tempted to think that the heads outcome is fixed and not affected by their current act. But the predictor has already acted based on what they do now. So if they pay, that means the predictor must have predicted they would pay? This is the same as Newcomb's: the act is evidence of the prediction. But in this case, the act in tails is evidence about the prediction in heads. So even in tails, paying gives evidence that the predictor gave the reward in heads. But since the predictor is perfect, it's not just evidence, it's certainty. So if I pay, I know the predictor must have predicted that and so I get the $10,000 in heads. But wait, I am in tails! How do I get the heads outcome? I don't. But the point is that the policy of paying leads to a higher expected utility ex ante. And if I am going to be consistent with the policy, I pay. The updateless agent pays because that is the act prescribed by the best policy, even though they know they are in the branch where they lose money."

  The exercise is designed to test whether they understand that the probability of the branch doesn't change the policy reasoning, and that the current act is part of the policy. The shallow answer just computes the EU of the policy. The deep answer grapples with the tension at the node and why one would still pay.

  Conscious Omission List (Item 6):
  We will explicitly decline to cover:
     - Logical counterfactuals: The coin flip is truly random, not a logical fact. We don't want to get into logical uncertainty.
     - Proof-based decision theory: This is a more advanced topic that uses logical counterfactuals. We are sticking with probabilistic counterfactuals.
     - Formal differences among updateless, timeless, and functional decision theories: We are only introducing the idea of updatelessness as acting on the best policy. The formal differences are beyond the scope.
     - Reflective oracles: These are a way to model predictors in games with multiple agents, but we are in a single-agent setting.

  By omitting these, we reinforce that the core idea is about the object of choice (act vs. policy) and that updatelessness is a natural stopping point for policy selection. We are not building a full theory but showing why the distinction is necessary.

  Teaching Plan Outline:

  1. (10 min) Introduction: The idea of a policy vs. an act. Use a simple example (like a one-shot prisoner's dilemma without a partner?) to show that precommitment to a policy can be better. But then note: what if you can't precommit? How do you choose at the node?

  2. (25 min) Counterfactual Mugging:
     - Present the scenario.
     - Have students discuss in pairs: what would they do?
     - Collect answers and discuss: why some would not pay (because they are in tails and the heads branch is fixed) and why some would pay (because they think about the policy).
     - Formalize the policy: expected utility of policies.
     - The predictor is predicting the policy.

  3. (15 min) Build the intermediate concept: 
     - The choice is not just at the node but about the entire decision tree. The predictor uses the entire policy to set the outcomes in other branches.

  4. (25 min) XOR Blackmail:
     - Present the scenario.
     - Have students discuss: pay or not?
     - Collect answers. Likely, most will say not to pay (following CDT).
     - Show the policy perspective: compute the expected cost of "always pay" and "never pay" policies (ex ante, before the message).
     - Explain how conditioning on the message creates a correlation that makes paying seem bad.

  5. (15 min) Contrast CM and XB:
     - In CM, the problem is about ignoring a branch (because you are not in it). In XB, the problem is about evidence that correlates the state and the act.
     - Both push towards policy selection.

  6. (15 min) Closing exercise (biased coin CM) and discussion.

  7. (5 min) Wrap-up: The main point is that the choice point is between acts and policies. Updatelessness is the idea that we select the best policy and then act accordingly, even in branches we know we are not in? (Actually, in CM we are in the tails branch but act as the policy says, which is for the best overall.) And in XB, we act as the policy says even though the evidence suggests it's not helping.

  Total: 110 minutes. Adjust as needed.
answer: |-
  ### Teaching Plan for Decision Theory Seminar

  #### **1. Prerequisite Idea**  
  **The Policy-Act Distinction**: Before introducing either problem, establish that rational agents can choose between two fundamentally different objects:  
  - **Acts**: Choices made at a specific node (e.g., "Do I pay $100 now?").  
  - **Policies/Decision Procedures**: Rules mapping all possible states to acts (e.g., "Always pay when asked").  
  **Why it must be secured first**: Without this, students will view the predictor’s actions as magical or inconsistent. The predictor’s behavior depends on the agent’s *policy* (e.g., "what the agent would do in all scenarios"), not isolated acts. This transforms the problems from "tricks" into arguments about what constitutes a coherent choice object.  

  ---

  #### **2. Ordering of the Session**  
  **Sequence and Rationale**:  
  1. **Start with Counterfactual Mugging (CM)**:  
     - **Why first?** CM isolates the core issue of *counterfactual branches* without evidence complications. Students know their state (tails) and face a pure trade-off: lose money in their branch to gain in an unreached branch.  
     - **Staged problem for acts**: At the tails node, act-based reasoning (conditioning on being in tails) suggests refusing to pay ($0 loss > $100 loss). This ignores the policy-level benefit in heads.  

  2. **Build Intermediate Notions**: After CM, explicitly define:  
     - **Pre-commitment as (legitimately) unavailable**: In CM, pre-committing to "always pay" is optimal but impossible at the choice node. The agent must decide whether to *align with the policy* despite knowing their branch.  
     - **Prediction targets policies, not acts**: The predictor correlates with the agent’s *entire decision procedure* (e.g., "would this agent pay if tails?"), not the surface act.  

  3. **Then introduce XOR Blackmail (XB)**:  
     - **Why second?** XB adds *evidential reasoning*: The agent must handle state uncertainty (termites?) and correlated evidence (the message). Act-based reasoning now fails due to confounding (paying correlates with termites).  
     - **Staged problem for evidence**: CDT conditions on the message, leading to "never pay" (since paying $1,000 doesn’t cause termites to vanish). Policy-based reasoning ("always pay") avoids the correlation trap.  

  **Why this order?**  
  - CM establishes the policy-act distinction in a transparent, evidence-free setting.  
  - XB then complicates it with state uncertainty, forcing students to see policy reasoning as a tool to handle *both* counterfactuals and evidence.  

  ---

  #### **3. The Carrying Example**  
  **Simplified Common Core of Both Scenarios**:  
  - **Structure**:  
    - A binary random event (e.g., fair coin toss).  
    - **Branch 1 (known state)**: Agent faces a costly act (e.g., pay $X).  
    - **Branch 2 (unknown/counterfactual)**: Agent receives a benefit (e.g., $Y ≫ $X) *iff* they would have chosen the costly act in Branch 1.  
    - **Agent’s position**: Knows they are in Branch 1 (like CM’s tails, but generalized).  
  - **Features it must have**:  
    - Perfect prediction (removes noise; predictor infallibly detects policies).  
    - Mixed upside: Benefit occurs *only in the unreached branch* (forcing updatelessness).  
    - One-shot interaction (blocks reputation arguments).  
  - **Features it must lack**:  
    - No evidence ambiguity in CM stage (simplifies policy introduction).  
    - No causal links (e.g., paying doesn’t cause termites; prevents misapplication of CDT).  
  **Why this core?** It crystallizes the dilemma: Acting in Branch 1 sacrifices local utility to satisfy a policy that optimizes global (ex ante) utility.  

  ---

  #### **4. Misconception Map**  
  Address misconceptions contextually:  
  - **"The predictor is impossible"**:  
    - **When**: During CM setup.  
    - **How**: Pre-empt by analogy. *Example*: "Imagine a computer simulating your decision procedure in all branches. We’re testing coherence *if* this were possible."  
  - **"This is just Newcomb’s problem"**:  
    - **When**: After introducing CM.  
    - **How**: Pause and contrast. *Modify carrying example*: In Newcomb’s, both boxes exist at your choice point; here, the benefit is in a branch you *know* you’re not in.  
  - **"I’d pay to build a reputation"**:  
    - **When**: During policy discussion in CM.  
    - **How**: Pre-empt by emphasizing one-shotness. "Reputation requires repeated play; here, the predictor acts once based on your policy."  
  - **"XB is just correlation; CDT wins"**:  
    - **When**: During XB analysis.  
    - **How**: Extend XB. *Show*: CDT’s "never pay" leads to $1M losses when termites strike; the policy "always pay" caps losses at $1,000 by decoupling from evidence.  
  - **"CM and XB are the same"**:  
    - **When**: After presenting both.  
    - **How**: Contrast using the carrying example. CM’s challenge is *ignoring a branch*; XB’s is *misinterpreting evidence*. Policies resolve both.  

  ---

  #### **5. Closing Check of Understanding**  
  **Exercise**: *Biased Coin Mugging*  
  - **Setup**: A coin lands heads (probability 0.99) or tails (0.01). In tails, you pay $100. In heads, you gain $10,000 *iff* you would have paid in tails. You are in tails.  
  - **Question**: Why might you pay? Distinguish policy-based from act-based reasoning.  

  **Shallow Answer**:  
  - "Paying is part of the best policy: (0.99 × 10,000) + (0.01 × −100) = 9,899 > 0."  
  - **Why shallow?** Only computes expected utility without engaging the counterfactual tension.  

  **Deep Answer**:  
  - "Act-based: Conditioned on tails, paying loses $100 with no direct gain (heads is fixed). Policy-based: Refusing now implies my policy is ‘never pay,’ so I get $0 in heads. Paying enforces ‘always pay,’ securing $10,000 in heads despite my branch. The low tails probability doesn’t eliminate the need for consistency."  
  - **Why deep?** Grapples with *why* conditioning fails and how policy coherence creates value in unreached branches.  

  ---

  #### **6. Conscious Omission List**  
  Explicitly exclude:  
  - **Logical counterfactuals/proof-based DT**: "We’re using coin flips, not logical facts, to avoid complexity."  
  - **Formal updateless/timeless/functional distinctions**: "We’re treating ‘updateless’ as shorthand for ‘acting on the best policy,’ not a technical formalism."  
  - **Reflective oracles/equilibrium concepts**: "This is a single-agent problem; we omit multi-agent extensions."  
  **How omissions reinforce the point**: By bounding the discussion to policy-based coherence in "clean" problems, we show that updatelessness isn’t an ad hoc fix but a minimal requirement for handling counterfactuals and evidence.  

  ---

  ### Session Flow (120 Minutes)  
  - **0:00–15:00**: Secure prerequisite (policy-act distinction via simple examples).  
  - **15:00–40:00**: **CM** + policy definition + address "predictor impossible" and "Newcomb’s redux."  
  - **40:00–50:00**: Build intermediate notions (pre-commitment, prediction targets policies).  
  - **50:00–75:00**: **XB** + address "reputation," "CDT wins," and "same as CM."  
  - **75:00–95:00**: Contrast CM/XB using carrying example; highlight why policies unify them.  
  - **95:00–110:00**: **Closing exercise** (Biased Coin Mugging) + collect/debrief answers.  
  - **110:00–120:00**: Summarize omissions; underscore "policy coherence as a stable stopping point."
