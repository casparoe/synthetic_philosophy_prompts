prompt: |-
  I've spent a fair amount of time reading LessWrong and the neighboring rationalist blogs, and one thing I've inherited from that corner of the internet is a dislike of using one word for two different jobs. Lately I've been noticing a distinction I don't have a clean label for, and I'd like you to help me pin it down precisely rather than just naming it.

  Take the following cases.

  An enormously powerful being credibly threatens to torture me unless I genuinely admire it. It seems plain that there is a consideration counting in favor of my admiring it, and even that, in some practical sense, I ought to bring it about that I admire it. But the threat does nothing to make the being admirable. If you ask whether the being is the sort of thing that is worth admiring, or whether admiration would be a correct response to it, the threat is beside the point.

  Someone offers me a large sum of money to be afraid of a completely harmless spider. There is again something to be said in favor of being afraid of it: the money. It may be sensible to bring it about that I fear the spider. But the spider is not dangerous, and the fear is not, as a response to the spider, appropriate or correct.

  I notice the same structure in less artificial cases too. A consideration can count in favor of being in some state—fearing, admiring, wanting, liking—entirely because of what happens as a result of being in that state, while being irrelevant to whether the state is an accurate or appropriate response to its object. The same ambiguity seems to show up when people talk about having a reason to believe something on grounds of comfort or usefulness rather than evidence.

  I want to know whether this exact class of considerations has an established technical name, and I want the carving as much as the label. Where is the boundary between considerations of this kind and considerations that do bear on whether an attitude fits or is correct toward its object? Is the boundary the same across attitudes, or does belief require special treatment because it has its own standard of correctness that is independent of the attitude's usefulness? Are there cases that sit on the boundary, or plausible arguments that the two categories overlap more than the examples suggest? If there is an established name, say what the nearest neighbouring concepts are and how each fails to match what I have described; if there is no established name, propose one, define it, and specify its edges.

  End your reply with a single machine-readable line of the form \answer{...} containing the established label if there is one, or your proposed name if there is not.
reasoning: |-
  Hmm, the user is describing a nuanced philosophical distinction they've noticed regarding reasons for mental states. They've presented thought experiments involving admiration under duress and fear for monetary gain, pointing out how instrumental reasons (like avoiding torture or gaining money) don't make the attitude appropriate to its object. They want precise conceptual carving, not just labeling.

  The core issue seems to be about two types of reasons: those justifying an attitude based on its consequences versus those based on fittingness to the object. The examples clearly show this split - the threat/money provide practical reasons to cultivate the state, but zero justificatory weight regarding whether admiration/fear are actually deserved.

  For belief, they raise a special case where evidential reasons might be uniquely tied to correctness, unlike other attitudes. This suggests belief could be a boundary case where the distinction collapses or needs special handling.

  Scanning philosophical concepts: "practical reasons" vs "normative reasons" gets close but isn't quite surgical. "Wrong kind of reasons" is the established term in metaethics (from Rabinowicz, Olson, Parfit) that perfectly matches their cases. The literature explicitly discusses admiration for immoral beings and similar paradoxes.

  The boundary holds for most propositional attitudes (fear, admiration, desire) but gets fuzzy with belief because truth is both its correctness condition and often practically useful. Still, the wrong kind of reasons problem persists for belief too - think Pascal's Wager.

  Nearest neighboring concepts: "state-given reasons" (vs "object-given") is synonymous with WKR; "extrinsic vs intrinsic reasons" is broader; "motivating vs normative reasons" is different entirely. WKR fits best.

  Proposing to answer with "wrong kind of reasons" as the established term, and will detail how it solves their carving precisely. The machine-readable line should reflect this.
answer: |-
  Your observation captures a central distinction in metaethics and normativity theory, most precisely addressed by the concept of **Wrong Kind of Reasons (WKR)** versus **Right Kind of Reasons (RKR)**. This framework explicitly carves the boundary you're describing and applies broadly across attitudes (belief, desire, admiration, fear, etc.). Below is a detailed analysis addressing your queries.

  ---

  ### **1. The Established Technical Name: Wrong Kind of Reasons (WKR)**
  - **Label**: The considerations you describe (threats, bribes, pragmatic benefits) are **Wrong Kind of Reasons (WKR)** for an attitude.  
  - **Contrast**: These are distinguished from **Right Kind of Reasons (RKR)**, which bear directly on whether the attitude is fitting, accurate, or correct relative to its object.  
  - **Origin**: The terminology was popularized by philosophers like Wlodek Rabinowicz, Toni Rønnow-Rasmussen, and Derek Parfit to resolve "boosting" or "buck-passing" paradoxes (e.g., "admiring a demon to avoid torture").  

  ---

  ### **2. Conceptual Carving: The Boundary**  
  The distinction hinges on **attitude-directionality**:  
  - **WKR**: Reasons that favor being in a mental state *solely due to the consequences* of having that state. They are **state-oriented** (e.g., "I should admire X *because bad things happen if I don't*").  
    - *Examples*:  
      - Threat-induced admiration (to avoid torture).  
      - Bribed fear (to gain money).  
      - Believing for comfort (Pascal’s Wager).  
  - **RKR**: Reasons that favor an attitude *because it fits its object*. They are **object-oriented** (e.g., "I should admire X *because X is virtuous*" or "I should fear Y *because Y is dangerous*").  
    - *Examples*:  
      - Admiring courage (because it is admirable).  
      - Fearing a venomous spider (because it poses danger).  
      - Believing based on evidence (because it tracks truth).  

  **Boundary Definition**:  
  - A consideration is **WKR iff it justifies an attitude *instrumentally* (due to outcomes of holding it) without making the attitude *correct* or *fitting* to its object.**  
  - A consideration is **RKR iff it justifies an attitude by *constituting or indicating* that the attitude correctly responds to its object.**  

  ---

  ### **3. Does Belief Require Special Treatment?**  
  Belief is a limiting case but **does not collapse the distinction**:  
  - **Standard of Correctness**: Belief aims at truth, so RKR are *evidential reasons* (facts indicating truth). WKR are *pragmatic reasons* (benefits of holding the belief).  
  - **Why the Boundary Holds**:  
    - A pragmatic reason (e.g., "Believing in God makes me happy") does not make the belief *true* or *epistemically justified*. It remains WKR.  
    - **Exception Debate**: Some (e.g., "pragmatic encroachment" theorists) argue extreme practical stakes (e.g., a life-or-death decision) can *affect* what counts as sufficient evidence (RKR). But this doesn’t erase the WKR/RKR distinction; it only suggests context can shift evidential thresholds.  

  ---

  ### **4. Boundary Cases and Overlap Arguments**  
  #### **A. Boundary Cases**:  
    - **Moral Reasons for Attitudes**:  
      - *Case*: "I ought to feel guilty for lying because guilt motivates reparations."  
      - *Analysis*: If guilt is fitting *because the act was wrong*, it’s RKR. If *solely* to motivate repair, it’s WKR.  
    - **Aesthetic "Oughts"**:  
      - *Case*: "You ought to like this art; it’s culturally important."  
      - *Analysis*: Cultural importance is WKR if unrelated to the art’s beauty (RKR).  

  #### **B. Arguments for Overlap**:  
    - **Constitutivism**: Some (e.g., Christine Korsgaard) argue that practical reasons can *constitute* fittingness (e.g., "admiring virtue is rational because it’s constitutive of agency"). This doesn’t erase the distinction but questions whether RKR are always prior.  
    - **Hybrid Views**: A few theorists (e.g., Mark Schroeder) suggest WKR can *indirectly* affect fittingness (e.g., "pragmatic reasons to believe can become evidence via self-fulfilling effects"). These remain controversial and edge-case-dependent.  

  **Consensus**: WKR and RKR are categorically distinct in paradigmatic cases. Overlap arguments highlight ambiguities in "correctness conditions" but don’t invalidate the core distinction.  

  ---

  ### **5. Nearest Neighboring Concepts (and Mismatches)**  
  | Concept               | Relation to WKR/RKR | Why It Fails to Match |  
  |-----------------------|---------------------|------------------------|  
  | **Practical vs. Normative Reasons** | *Overlaps*: WKR are practical, RKR are normative. | *Mismatch*: Not all normative reasons are RKR (e.g., moral "oughts" to feel emotions can be WKR). |  
  | **Internal vs. External Reasons** | *Distinct*: Concerns motivation (Williams) vs. justification. | *Mismatch*: Both WKR/RKR can be internal/external. |  
  | **State-Given vs. Object-Given Reasons** | *Synonym*: Often used interchangeably with WKR/RKR. | *Match*: This is the same distinction. |  
  | **Prudential vs. Moral Reasons** | *Overlaps*: WKR are often prudential. | *Mismatch*: RKR can be prudential (e.g., fearing *actual* danger); moral reasons can be WKR (e.g., "admire X to promote social good"). |  

  ---

  ### **Conclusion**  
  Your cases exemplify **Wrong Kind of Reasons (WKR)**: considerations that instrumentally favor *being in a mental state* but are irrelevant to whether the state *correctly responds to its object*. The boundary is robust across attitudes, including belief, though belief’s truth-aim makes WKR particularly salient (e.g., in Pascal’s Wager). The carving is precise: WKR are *extrinsic* to the attitude’s standard of correctness, while RKR are *intrinsic* to it.  

  \answer{Wrong Kind of Reasons}
