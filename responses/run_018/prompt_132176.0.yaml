answer: |-
  The described forecasting practice rests upon several interlocking philosophical commitments regarding historical knowledge, inductive reasoning, and the nature of similarity:

  **I. Implicit Epistemological Commitments**

  1.  **Restricted Regularity Theory (Humean-inspired but modified):**
      *   The core practice assumes that stable, projectible patterns exist within history *under specific boundary conditions*. It is fundamentally Humean in seeking base rates from observed frequencies within a reference class.
      *   However, the **exclusion rule** constitutes a crucial modification. It rejects a *naïve* regularity theory where any observed frequency (regardless of context) is projectible. It implicitly posits that regularities are only projectible across contexts sharing a sufficiently similar underlying "substrate" (technological, ecological, informational).

  2.  **Causal-Homogeneity View of Reference Classes:**
      *   This is the most coherent interpretation of the exclusion rule. Reference classes are valid not merely based on structural similarity of events (e.g., "hegemonic transitions"), but crucially on the presumed causal homogeneity of the underlying mechanisms *enabled by the shared substrate*.
      *   Radical substrate discontinuities (e.g., pre-industrial vs. autonomous-weapon warfare) are seen as likely altering the fundamental causal drivers, dynamics, and constraints governing the similar structural pattern. Comparing them is deemed "incommensurable" because the mechanisms generating outcomes are fundamentally different.
      *   **Function of Exclusion:** It primarily acts as a **tractability filter grounded in a causal ontology**. By restricting analogues to similar substrates, analysts work within a domain where the *kinds* of causal factors and their interactions are presumed stable enough for past frequencies to be meaningfully extrapolated. It reflects an ontological belief that causal mechanisms are deeply intertwined with their material and technological context.

  3.  **Ontology of Historical Kinds:**
      *   The practice treats historical event types ("hegemonic transitions," "fiscal crises") not as Platonic universals or purely nominalistic categories, but as **causally grounded kinds**.
      *   Membership in a reference class requires both:
          *   *Structural Similarity:* Sharing key relational features (e.g., rising challenger, established leader, alliance patterns).
          *   *Substrate Similarity:* Existing within a sufficiently congruent technological/ecological/informational regime that enables similar causal mechanisms to operate.
      *   This implies a **moderate realism** about historical kinds: they are real patterns discernible in history, but their boundaries and projectibility are contingent on the stability of the underlying causal substrate. They are not eternal types, but emergent within specific historical-material contexts.

  4.  **Similarity Judgments:**
      *   Similarity is **not solely structural or phenomenological**. Deep structural parallels (e.g., Thucydides Trap dynamics) are acknowledged but deemed insufficient for projectibility if the substrate is discontinuous.
      *   Similarity for inductive purposes is defined **teleologically relative to causal mechanisms**. Two situations are "sufficiently similar" if the shared substrate allows us to reasonably assume that the *causal pathways* leading to outcomes (victory, collapse, etc.) operate in recognisably analogous ways. The exclusion rule explicitly prioritises substrate similarity over structural similarity when they conflict for projectibility.

  5.  **Relation to Goodman & Projectibility:**
      *   While the exclusion rule resonates with Goodman's concern about "grue"-like predicates and the need for "entrenched" categories, it goes beyond mere linguistic entrenchment.
      *   It grounds projectibility not just in linguistic habits or past projections, but in an **inference to causal homogeneity**. The "entrenchment" of predicates like "hegemonic transition" is justified *because* (and only when) they successfully pick out causally homogeneous kinds *within a stable substrate*. The exclusion rule is a guard against applying a seemingly entrenched predicate (like "military revolution") across a substrate discontinuity where its causal grounding breaks down.

  **II. Alternative Philosophical Foundations & Implications**

  If the protocol adopted a view treating *structural analogies as equally projectible regardless of technological substrate* (a strong **structural realism** or perhaps a purely **formalist** view of history):

  1.  **Changes to the Protocol:**
      *   **Reference Class Selection:** The exclusion rule would be abolished or radically weakened. Analogues like pre-industrial military revolutions confronting modern drone warfare would become admissible if deemed structurally isomorphic. Reference classes would be defined almost exclusively by abstract relational patterns.
      *   **Base-Rate Derivation:** Base rates would be derived from a vastly broader and more heterogeneous pool of historical cases, stretching far deeper into the past and across radically different civilisational contexts (e.g., including Bronze Age collapses alongside potential modern ecological crises, Roman logisitics alongside AI-driven supply chains).
      *   **Scoring Rules & Calibration:** Performance tracking (e.g., Brier scores) would need to be meticulously maintained over this much wider set of predictions derived from heterogeneous analogues. Calibration exercises would be crucial to assess whether structural similarity alone *actually yields* predictive accuracy across substrates. Weighting schemes for base rates might evolve based on perceived "purity" of structural similarity or meta-analyses of past structural analogy success rates.
      *   **Inside-View Adjustment:** The role of the inside view (specific modern details) would likely become *more significant and contentious*. With base rates derived from potentially alien contexts, analysts would place heavier emphasis (and subjective weight) on arguing why *this specific instance* of the structural pattern deviates from the historical base rate due to unique contemporary factors (e.g., "Nuclear deterrence fundamentally alters the hegemonic transition dynamic seen in Peloponnesian Greece despite structural similarities"). The protocol for constraining or weighting these adjustments would face greater pressure.
      *   **Institutional Incentives:** Training would shift towards identifying deep structural patterns across diverse historical epochs and civilisations. Expertise in abstract modelling and comparative civilisational analysis might be valued over deep contextual knowledge of specific eras or technologies. There might be pressure to develop formal ontologies of historical structures.

  2.  **Underdetermined Elements:**
      *   **Defining "Structural Similarity":** The core problem becomes rigorously defining *which* structural features are essential for the analogy and how to measure their similarity. Is it network topology? Game-theoretic payoff structures? Sequence of phases? This definition remains inherently contestable and conventional.
      *   **Weighting Structural Features:** Even with defined features, how much weight to give to different aspects of the structure (e.g., relative power balance vs. alliance rigidity vs. domestic political structure) when forming the base rate is underdetermined.
      *   **Scope of Reference Classes:** How narrowly or broadly to define the structural category (e.g., "all asymmetric conflicts" vs. "only maritime hegemonic transitions") lacks a principled basis under pure structuralism.
      *   **Inside-View Adjustment Protocol:** The rules for how much and in what way analysts can modify the structural base rate based on unique modern factors become even more critical and philosophically fraught, as the base rate itself is derived from potentially less intuitively relevant cases.

  **Conclusion**

  The current protocol implicitly embraces a **causal-mechanistic and substrate-dependent view of historical kinds and induction**. It assumes that projectible historical regularities are emergent properties of systems operating within specific technological, ecological, and informational regimes. Induction is licensed only across contexts where the substrate similarity suggests causal mechanism homogeneity. The exclusion rule is primarily a **causal tractability filter**, not merely a guard against Goodmanian grue-like predicates, though it serves that function too. Replacing this with a substrate-blind structural realism would necessitate abolishing the exclusion rule, vastly expanding reference classes, placing greater burden and potential subjectivity on inside-view adjustments, and leaving the critical definitions of relevant structure and feature weighting fundamentally underdetermined by the philosophy itself. The practice reflects a pragmatic, causally grounded realism about historical patterns.
