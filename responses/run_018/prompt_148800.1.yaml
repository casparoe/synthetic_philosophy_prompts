answer: |-
  Your observation carves out a distinct and perceptible pattern within the broader landscape of pluralism debates—one that hasn’t crystallized under a single established term but represents a specific rhetorical and conceptual maneuver. Let’s define it precisely while marking its boundaries.  

  I’d propose calling this the **Procedural-Commitment Loop**. It manifests when a theorist advocates for a putatively neutral procedural mechanism (e.g., preference aggregation, democratic voting, algorithmic averaging) to resolve conflicts between conceptions of the good, insisting the procedure is purely formal and devoid of substantive moral assumptions. When challenged that the procedure implicitly relies on value commensurability (e.g., treating diverse goods as fungible or comparable on a single metric), the theorist retreats to a defense of the procedure’s *neutrality*, arguing it merely facilitates agency or avoids coercion. Yet this defense itself invokes substantive values—autonomy, anti-coercion, or equal respect—which are neither neutral nor derivable from the procedure alone. The loop closes when these substantive commitments are then portrayed as inherent to the neutrality framework, creating a self-justifying circle: the procedure is neutral because it embodies autonomy; autonomy is secured because the procedure is neutral. The commensurability required by the procedure is thus smuggled in under the guise of formalism, while the values justifying the procedure are simultaneously denied as "thick" and upheld as necessary for neutrality.  

  The boundaries of this loop are sharp when contrasted with adjacent issues. First, it is not mere *circular reasoning* in the generic sense. Ordinary circularity (e.g., "Neutrality is valuable because it promotes neutrality") lacks the distinctive pivot between procedural denial and substantive reliance. The loop’s core tension arises from *oscillation*: it actively disavows substantive foundations ("This aggregation is just math!") while covertly deploying them ("...and it’s fair because it respects autonomy"). Second, it differs from straightforward *misunderstandings of pluralism*. A theorist who openly claims values are commensurate might be wrong about pluralism, but they aren’t trapped in this loop. The loop specifically requires the denial of commensurability’s moral weight *during procedural design* and its re-emergence *during justification*. For instance, if a constitutional AI designer explicitly stated, "Liberal premises are universal, so we build them in," that’s an error about pluralism but not the loop. The loop emerges only when they insist the constitution is neutral *despite* those premises, then defend it by appealing to liberal values like non-coercion.  

  A clear edge case involves appeals to "pragmatism" or "feasibility." If a theorist abandons neutrality claims entirely and argues, "Commensurability is unavoidable for functional systems, so we accept it," they sidestep the loop. The loop depends on the dual insistence on neutrality *and* the stealthy reliance on the very substantive commitments neutrality ostensibly excludes. Your dissection reveals a real fault line in pluralist alignment discourse—one where the machinery of proceduralism masks its own moral ontology, then recruits that ontology to silence objections. Naming it underscores a persistent sleight-of-hand: the moment commensurability is simultaneously implemented and disowned, while the values enabling its implementation are laundered through the ideal they subvert.  

  ---
  **tl;dr**: The **Procedural-Commitment Loop** describes the pattern where:  
  1. A procedure (e.g., preference aggregation) is proposed as neutral among conceptions of the good.  
  2. Its reliance on value commensurability is denied as "merely procedural."  
  3. When challenged, the procedure is defended via substantive values (autonomy, non-coercion).  
  4. These values are then framed as inherent to neutrality—closing the loop.  
  It differs from generic circularity by its procedural-substantive oscillation and from pluralism errors by its denial of commensurability *during design* and reliance on it *during justification*.
