answer: |-
  That's an excellent set of questions that cuts right to the core of challenges in formalizing vagueness. Let me clarify the premise slightly and then address the integration and empirical points directly, speaking plainly.

  **First, a Minor Correction on the Premise:**
  You're right to note that supervaluationism (SV) introduces intermediate *statuses* (true, false, indeterminate/superfalse), but **it does *not* assign precise intermediate *truth-values* like probabilities or credences.** That's a crucial difference from fuzzy logic or Bayesian epistemicism. SV says:
  1.  A statement is **True** if it's true on *all* admissible precisifications.
  2.  **False** if false on all.
  3.  **Indeterminate** (or "superfalse" for negations sometimes) if true on some precisifications and false on others.

  There's no numerical "0.7 true" in classical SV. The indeterminacy is a *third* status, not a continuum of degrees. An epistemic Bayesian might assign a credence (e.g., 0.7) to "X is tall" based on uncertainty about the precise cutoff. SV instead says the meaning itself *allows* multiple cutoffs, making the statement neither determinately true nor determinately false for borderline cases.

  **Why Hasn't Supervaluationism Been Widely Integrated?**

  1.  **Compositionality is a Nightmare:** This is the biggest practical hurdle. How do the truth-values (True, False, Indeterminate) of simple sentences combine in complex ones (e.g., "tall and not thin", "if borderline-tall then young") under SV?
      *   SV defines "A and B" as True only if A and B are both True on *all the same precisifications*. This is incredibly complex to compute formally and model computationally. It requires tracking the *sets* of precisifications under which sub-parts hold, not just single values. This complexity explodes quickly.
      *   Contrast this with fuzzy logic (where "A and B" = min(truth(A), truth(B))) or probabilistic models (where rules of probability apply). These are vastly simpler to compose computationally, even if philosophically contentious.

  2.  **The Problem of Higher-Order Vagueness:** SV seems to imply a sharp boundary between the definite cases (True/False) and the borderline (Indeterminate) cases. But isn't *that* boundary itself vague? Where does "definitely borderline" start? SV struggles to model this smooth transition *into* the borderline region without introducing infinitely many levels of precisifications ("precisifications of precisifications"), which is formally messy and computationally intractable.

  3.  **Lack of Gradience within the Borderline:** SV treats *all* borderline cases as simply "Indeterminate." It doesn't capture the intuition that some borderline cases are "closer" to being clearly tall than others. A 5'11" person might feel more like a candidate for "tall" than a 5'9" person, even if both are strictly borderline under SV. Models that assign degrees (fuzzy logic) or probabilities (epistemic/Bayesian) *do* capture this intuitive gradience, making them more appealing for modeling actual judgments and language use.

  4.  **Computational Cost and Data Fit:** Tracking all possible precisifications and their agreement for every utterance is computationally expensive and doesn't align well with how language is processed efficiently in the real world or modeled in large-scale computational linguistics. Simpler, gradient models often fit behavioral and corpus data better.

  5.  **Competition from More "Natural" Models:** Many linguists and computational researchers find degree-based models (using intervals, probabilities, or fuzzy values) or context-driven dynamic models more intuitive and easier to connect to psychological mechanisms and distributional patterns in language data than the rather abstract mechanism of precisifications.

  **The Corpus Data Point & Epistemic Masking:**

  You've hit on a critical argument *against* purely epistemic views (like the strict Bayesian credence view you mentioned) and also present a challenge for SV:

  1.  **What Epistemicism Predicts:** If vagueness is *only* about our *ignorance* of a sharp cutoff, then as we sample items closer and closer to that hidden cutoff, we should see a smooth, gradual decline in the proportion of people judging "X is tall" (or the frequency of "tall" being applied to X in a corpus). It should look like a smooth S-curve centered on the true cutoff.
  2.  **What We Often See (and what SV might predict):** Corpus and experimental studies often show something different:
      *   **Sharp Drop-offs:** There can be a relatively sharp transition zone where the application of the predicate drops dramatically, not a perfectly smooth curve. This *could* be consistent with SV's sharp boundary *between* definite and borderline (though SV itself doesn't predict *usage frequency* within the borderline).
      *   **Flat "Borderline Plateau":** Crucially, within the core borderline region, usage is often *mixed and unstable*, but not in a way that always shows a smooth *monotonic* increase/decrease correlating perfectly with the underlying measure (like height). We might see roughly 50/50 judgments or highly variable usage across a range of values, forming a kind of "plateau" of indeterminacy, *before* a sharper drop into definite non-application. This plateau is hard to square with a simple epistemic uncertainty model predicting a smooth curve. It fits better with the SV idea of genuine semantic indeterminacy across a range.
      *   **High Context Sensitivity:** Usage within the borderline range is wildly sensitive to context, comparison class, linguistic framing, etc. This variability is messy and doesn't cleanly map onto a single underlying smooth probability curve tied only to the measured property (like height). It suggests meaning is fundamentally underspecified (like SV) or dynamically constructed, not that we're just uncertain about a fixed point.

  **In Summary:**

  *   **SV hasn't been widely integrated** mainly because of the **combinatorial explosion** involved in handling compositionality formally and computationally, its struggle with **higher-order vagueness**, its **inability to model intuitive gradience *within* the borderline**, and the existence of **simpler, gradience-friendly alternatives** that fit data reasonably well.
  *   **Corpus data often doesn't show smooth epistemic curves** because:
      *   Genuine semantic indeterminacy (like SV posits) leads to a **zone of unstable, mixed usage** (the "borderline plateau") rather than a smooth decline.
      *   **Context effects massively dominate** within the borderline region, obscuring any simple underlying probabilistic relationship based solely on the measured dimension (like height).
      *   A sharp drop-off *around* the transition zone is common, but the behavior *within* the borderline is more chaotic than a smooth epistemic curve would predict.

  While supervaluationism offers a compelling *philosophical* solution to the Sorites by preserving classical logic and bivalence "underneath," its practical formalization and computational implementation, especially concerning composition and gradience, have proven extremely challenging. The messy reality of language use in corpora, particularly the context-dependent instability in the borderline region, doesn't neatly align with the predictions of either simple epistemic models or SV's clean trichotomy, explaining why neither has dominated formal semantics or computational linguistics. Researchers often opt for more flexible degree-based, probabilistic, or dynamic context-based models that can better handle the observed gradience and context sensitivity, even if they face their own philosophical puzzles.
