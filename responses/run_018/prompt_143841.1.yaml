prompt: |-
  I sit on an ethics review board for documentary-style historical dramas, and we need a reusable decision procedure for evaluating invented scenes—fabricated dialogue, compressed timelines, assigned private motives—involving real people who are deceased and have no legal representatives. The guiding idea is not legal harm but representational fidelity: we owe the dead not literal accuracy in every detail, but preservation of the causal and moral architecture of their actual lives as those lives figure in the shared historical record accessible to viewers. Write a step-by-step procedure, with ordered tests, that a non-philosopher on the board can apply to a proposed scene. The procedure should distinguish permissible narrative compression (omitting failed preliminary trials, merging minor figures) from impermissible structural distortion (inventing private beliefs that reverse the explanatory logic of a documented public decision). Include worked applications to three cases: a scientist whose failed experiments are elided for pacing; a political leader whose invented religious crisis is used to explain a documented policy reversal; and a borderline case where the procedure yields a result the board should likely override on other grounds. Flag precisely where judgment cannot be eliminated, what distinctions the procedure deliberately collapses, and what it is unable to settle.
reasoning: |-
  We are creating a step-by-step procedure to evaluate invented scenes in historical dramas involving deceased real people without legal representatives. The focus is on "representational fidelity" – preserving the causal and moral architecture of the person's life as it is known in the shared historical record.

   Key principles:
   1. We are not demanding literal accuracy in every detail, but we must avoid distortions that alter the core understanding of the person's life and decisions.
   2. We distinguish between:
      - Permissible narrative compression: omitting minor events, merging minor figures, eliding failed trials for pacing, etc.
      - Impermissible structural distortion: inventing private beliefs that reverse the explanatory logic of a documented public decision.

   The procedure will consist of ordered tests. Each test must be passed for the scene to be permissible. If a test fails, the scene is impermissible unless overridden (as in the borderline case example).

   Step-by-Step Procedure:

   Step 1: Identify the Historical Core
     - Describe the historical event or situation that the scene is meant to represent, based on the shared historical record (e.g., well-documented facts from reliable sources).
     - Identify the key causal and moral elements: the actual motivations, decisions, and consequences as recorded.

   Step 2: Map the Proposed Scene
     - List all the invented elements in the scene (e.g., fabricated dialogue, compressed timeline, invented private motives).

   Step 3: Test for Structural Distortion in Core Motivations and Decisions (The "Causal Architecture" Test)
     - Check if any invented element (especially private motives, beliefs, or key decisions) alters the fundamental reasons for a documented action or decision in a way that contradicts the historical record.
     - If the invented element provides a motivation or cause that is contrary to the documented reasons, then it fails this test.
     - Example: If a policy reversal is documented to be due to political pressure, but the scene invents a religious crisis as the primary cause, that is a distortion.

   Step 4: Test for Moral Architecture Distortion (The "Moral Legacy" Test)
     - Check if the invented elements alter the perceived moral character of the person in a way that is not supported by the historical record.
     - Consider: Does the scene make the person appear substantially more virtuous, more villainous, or otherwise change the moral significance of their actions in a way that isn't justified by the record?
     - Example: If a person known for integrity is shown committing a deceit without any historical basis, that would fail.

   Step 5: Test for Narrative Compression (The "Compression Check")
     - For elements that are compressions (like omitting failed experiments or merging minor figures), check:
       a) Does the compression omit non-essential details without altering the core understanding of the event?
       b) Does the compression create a false impression of the sequence of events or the role of individuals? (e.g., if merging two minor figures creates a composite that takes on a role that neither had, thus misleadingly attributing actions)
     - If the compression does not alter the core causal and moral architecture, it passes.

   Step 6: Overall Plausibility and Audience Misconception (The "Misleadingness" Test)
     - Consider whether the scene, taken as a whole, is likely to lead a reasonable viewer to a conclusion about the person or event that is fundamentally at odds with the historical record.
     - This step requires judgment: weigh the potential for misunderstanding against the dramatic purpose. However, if the scene passes Steps 3, 4, and 5, it is likely acceptable.

   Step 7: Flag for Override
     - If the scene fails one of the tests but the board feels there are compelling reasons to override (e.g., the scene is crucial for a broader truth that the record does not capture directly but is supported by historical consensus, or artistic necessity in service of a deeper fidelity), then the board may note the failure but override on other grounds.

   Now, worked applications:

   Case 1: A scientist whose failed experiments are elided for pacing.
     - Step 1: Historical core: The scientist conducted many experiments, some failed, leading to a successful discovery.
     - Step 2: Invented element: The omission of the failed experiments.
     - Step 3: Does the omission alter the core motivation or decision? No, because the failure is part of the process but not the core reason for the discovery. The core is the discovery and the method (trial and error) but the omission of some trials doesn't change the causal chain to the success.
     - Step 4: Does it alter the moral character? No, because the scientist is still shown as persistent and innovative. The record often attributes the success to the process, but the omission of some failures doesn't change the moral character.
     - Step 5: Compression check: The compression omits non-essential details (specific failed experiments) without altering the core. It does not create a false impression because the audience understands that scientific discovery involves trial and error. Pass.
     - Step 6: The scene is unlikely to mislead the audience into thinking the discovery was immediate without any failures. It might even be inferred that there were failures.
     - Result: Permissible.

   Case 2: A political leader whose invented religious crisis is used to explain a documented policy reversal.
     - Step 1: Historical core: The policy reversal is documented and the reasons are known (say, due to political pressure or new information). There is no evidence of a religious crisis in the record.
     - Step 2: Invented element: A religious crisis and its role as the primary cause of the reversal.
     - Step 3: The invented religious crisis becomes the primary cause, whereas the historical record attributes the reversal to other factors. This alters the causal architecture by replacing the documented reasons with a fictional one. Fail.
     - Step 4: This might also alter the moral character: it might make the leader appear more pious or conflicted in a way not supported by the record. But the primary issue is the causal distortion.
     - Step 5: Not applicable because this is not compression but invention of a new cause.
     - Step 6: The scene is likely to mislead the audience about the reasons for the policy reversal.
     - Result: Impermissible.

   Case 3: Borderline case - A scene where a historical figure is shown expressing private doubts about a public stance, where the record shows a consistent public stance but no private writings exist.
     - Step 1: Historical core: The figure maintained a consistent public stance on an issue. There are no private writings, so we don't know about private doubts.
     - Step 2: Invented element: A scene where the figure expresses private doubts to a confidant.
     - Step 3: Does this alter the causal architecture? It might not change the public decision (which remains the same) but it adds a private motivation that is not documented. However, if the public stance is explained in the record by certain reasons, and the private doubts are not contrary to those reasons but rather add complexity, it might not distort the core. But if the private doubts are the opposite of the public stance and suggest the public stance was insincere, then it might alter the causal architecture (by suggesting the public stance was taken for reasons other than the documented ones). This is a judgment call.
     - Step 4: It might alter the moral character by making the figure appear hypocritical or conflicted. If the record shows the figure as resolute and sincere, then this invention could be a distortion.
     - Step 5: Not compression.
     - Step 6: It might mislead the audience into believing the figure was insincere without evidence.

     - This is borderline. The procedure might fail at Step 3 or 4 because we don't have evidence of the private doubts. However, it is possible that the board might override if:
          - The scene is intended to reflect a broader historical truth (e.g., that many in that position had private doubts) and is supported by the context of the time, even if not for this specific individual.
          - The board feels that the scene adds depth without fundamentally altering the causal and moral architecture (e.g., the figure still acts publicly as they did, and the private doubts are shown as not affecting the public actions).

     - The procedure would flag this as impermissible because it invents a private belief that is not documented and that could reverse the explanatory logic (if the public stance is explained as being for political reasons, but the private doubts suggest the figure actually believed the opposite, then the invention would change the explanation for why they took the public stance). However, if the board believes that the scene does not alter the core (the public stance and its documented reasons remain the same) and that the private doubts are a plausible humanizing element that doesn't contradict the record, they might override.

     - Result: The procedure yields "impermissible" due to the invention of private beliefs that are not documented and that could distort. But the board might override if they find the invention is plausible and does not contradict the record, and serves a higher purpose of humanizing without distorting.

   Where judgment cannot be eliminated:
     - Step 3 and Step 4 require interpretation of the historical record and the impact of the invented element on the causal and moral architecture.
     - Step 6 requires judgment about audience interpretation.

   What distinctions the procedure deliberately collapses:
     - The procedure does not distinguish between different types of media (film, TV, theater) – it applies the same standard.
     - It does not distinguish between famous and lesser-known figures – the same standard applies.
     - It collapses the distinction between "private" and "public" in the sense that if a private motive is invented and it alters the public actions' explanation, it is impermissible.

   What it is unable to settle:
     - Cases where the historical record is ambiguous or where there are competing interpretations. In such cases, the procedure would require the board to choose the interpretation that is best supported by the record and then apply the tests accordingly. However, if the record is genuinely disputed, the board must note the ambiguity and then check if the invented element is consistent with at least one well-supported interpretation. If it is consistent, it may be permissible.

   Final Procedure Outline:

   1. Identify the Historical Core.
   2. Map the Proposed Scene's invented elements.
   3. Apply the Causal Architecture Test (Step 3): If the invented element alters the fundamental reasons for a documented action, fail (impermissible).
   4. Apply the Moral Architecture Test (Step 4): If the invented element alters the moral character of the person in a way not supported by the record, fail.
   5. Apply the Compression Check (Step 5): For compressions, if they do not alter the core and do not create a false impression, pass; otherwise, fail.
   6. Apply the Misleadingness Test (Step 6): Even if the above tests pass, if the scene as a whole is likely to mislead the audience about the core historical truth, it fails. (But note: if it passed 3,4,5 it should usually pass 6.)
   7. If any test fails, the scene is impermissible unless the board overrides.

   Override provision: The board may override a failure if there are compelling reasons that the scene serves a higher historical truth (with caution) or if the failure is minor and the scene is crucial for the narrative without causing substantial distortion. Overrides should be rare and documented.

   This procedure provides a structured approach but requires careful historical analysis and judgment at several steps.
answer: |-
  ### Decision Procedure for Evaluating Invented Scenes in Historical Dramas  
  **Guiding Principle**: Representational fidelity—preserving the causal and moral architecture of the deceased person's life as reflected in the shared historical record. Legal harm is irrelevant; focus is on preventing distortions that mislead viewers about the subject’s historical significance.  

  ---

  #### **Step-by-Step Procedure**  
  *Apply tests in order. If a test fails, the scene is **impermissible** unless flagged for override (see Step 6).*

  1. **Identify Core Historical Facts**  
     - Gather documented facts about the person/event from the shared historical record (e.g., academic consensus, primary sources, reputable biographies).  
     - Define the *causal architecture*: Why did the person act? (e.g., "Scientist X pursued Theory Y due to empirical evidence").  
     - Define the *moral architecture*: How is the person’s character/legacy understood? (e.g., "Leader Z was pragmatic, not ideologically rigid").  
     - *Judgment required*: Interpreting historical consensus.  

  2. **Map Invented Elements**  
     - List all fictional components: compressed timelines, fabricated dialogue, omitted events, invented motives, etc.  
     - Categorize them:  
       - **Narrative Compression**: Omitting/merging non-essential details (e.g., skipping failed experiments).  
       - **Structural Invention**: Adding/altering motives, beliefs, or causal drivers (e.g., inventing a religious crisis).  

  3. **Test 1: Causal Architecture Integrity**  
     - **Question**: Do the inventions distort *why* the person made documented decisions?  
     - **Permissible** if:  
       - Inventions only omit/compress tangential events (e.g., merging two similar meetings).  
       - Inventions do not contradict the documented rationale for key actions.  
     - **Impermissible** if:  
       - Inventions reverse or obscure the historical cause (e.g., replacing political strategy with a fictional personal crisis).  
       - *Judgment required*: Assessing if a cause is "core" vs. "peripheral."  

  4. **Test 2: Moral Architecture Integrity**  
     - **Question**: Do the inventions distort the person’s ethical legacy or character?  
     - **Permissible** if:  
       - Inventions align with the person’s documented values (e.g., adding dialogue that reflects their known principles).  
     - **Impermissible** if:  
       - Inventions imply motives that flip their moral stance (e.g., portraying altruism as selfishness without evidence).  
       - *Judgment required*: Balancing historical ambiguity vs. clear misrepresentation.  

  5. **Test 3: Plausibility Gap**  
     - **Question**: Could the inventions mislead a reasonable viewer about the *historical significance* of the person?  
     - **Permissible** if:  
       - The inventions are trivial or reflect widely accepted historical context (e.g., compressing a year of research into a montage).  
     - **Impermissible** if:  
       - The inventions create a "definitive falsehood" (e.g., attributing a key decision to a fictional event).  
       - *Deliberate collapse*: Treats "minor" distortions the same as "major" ones if both risk equivalent viewer misconceptions.  

  6. **Flag for Override**  
     - If Tests 1–3 mark the scene impermissible, but the board identifies:  
       - A compelling artistic/historical reason to proceed (e.g., the scene conveys a broader truth the record implies but does not state).  
       - A borderline case where the procedure’s result conflicts with context (e.g., the person’s record is fragmentary).  
     - *Unable to settle*: Conflicts between competing historical interpretations.  

  ---

  ### **Worked Applications**  

  #### **Case 1: Scientist’s Elided Failed Experiments**  
  - **Scene**: A scientist’s 5-year struggle with failed experiments is compressed into a single successful trial for pacing.  
  - **Procedure**:  
    1. **Core Facts**: The scientist succeeded through trial-and-error; persistence is central to their legacy.  
    2. **Inventions**: Compression (omitting failures).  
    3. **Test 1 (Causal)**: Pass. Omissions don’t alter *why* they succeeded (persistence + method).  
    4. **Test 2 (Moral)**: Pass. Persistence is preserved.  
    5. **Test 3 (Plausibility)**: Pass. Viewers infer trial-and-error; no distortion of significance.  
  - **Result**: **Permissible** (narrative compression).  

  #### **Case 2: Political Leader’s Invented Religious Crisis**  
  - **Scene**: A secular leader’s documented policy reversal is attributed to a fictional religious epiphany.  
  - **Procedure**:  
    1. **Core Facts**: The reversal was driven by political pressure; the leader was publicly non-religious.  
    2. **Inventions**: Structural invention (religious motive).  
    3. **Test 1 (Causal)**: Fail. Replaces documented cause (politics) with fiction (religion), distorting the "why."  
    4. **Test 2 (Moral)**: Fail. Implies piety inconsistent with their record.  
    5. **Test 3 (Plausibility)**: Fail. Could mislead viewers about the leader’s decision-making ethos.  
  - **Result**: **Impermissible** (structural distortion).  

  #### **Case 3: Borderline Case – Invented Private Doubts**  
  - **Scene**: A civil rights activist (documented as steadfast) is shown having private doubts about a protest, though no evidence exists.  
  - **Procedure**:  
    1. **Core Facts**: The activist was publicly resolute; no private writings survive.  
    2. **Inventions**: Structural invention (private doubt).  
    3. **Test 1 (Causal)**: Fail. Adds a motive (uncertainty) that contradicts their documented resolve.  
    4. **Test 2 (Moral)**: Fail. Weakens perception of their courage.  
    5. **Test 3 (Plausibility)**: Fail. Risks implying their leadership was hesitant.  
  - **Result**: **Impermissible** by procedure...  
  - **Flag for Override**:  
    - **Grounds for override**: The scene humanizes the figure without negating their actions; doubt is a universal experience not excluded by the record.  
    - **Board’s call**: Override if the scene emphasizes their triumph *over* doubt, preserving moral architecture.  

  ---

  ### **Limitations & Ambiguities**  
  - **Judgment required**:  
    - Interpreting "shared historical record" (Step 1).  
    - Distinguishing "core" vs. "peripheral" causes (Test 1).  
    - Weighing moral legacy (Test 2).  
  - **Deliberate collapses**:  
    - All "structural inventions" (e.g., private motives, fictional events) are treated equally as high-risk.  
    - Legal/personal sensitivities (e.g., surviving family objections) are excluded; focus is solely on historical fidelity.  
  - **Unable to settle**:  
    - Scenes where the historical record is contradictory or sparse.  
    - Conflicts between "artistic truth" and documented fact (Step 6 override needed).  

  **Final Output**: A scene passes only if it clears Tests 1–3. If impermissible, override requires majority board consensus that the invention serves a higher fidelity to the person’s historical impact.
