prompt: |-
  hey so me and my roomate have been arguing about whether chatgpt and other big models actually understand anything, or if they're just that stochastic parrot thing everyone talks about. my credence that LLMs have real conceptual understanding is around 0.35, hers is closer to 0.15. can you give me your own number, but more importantly break the reasoning down?

  specifically imagine this weird scenario: a model trained only on weather reports and old poems suddenly gives correct medical advice by mapping storm fronts onto blood pressure patterns - it never saw medical texts, just cross-domain analogies. if that happened, would it genuinely understand medicine?

  decompose this into parts:
  a) whether understanding requires direct training data in the domain, or if analogical transfer is enough,
  b) whether the model needs to be able to be suprised by its own outputs to count as understanding,
  c) whether understanding is binary or more like a dimmer switch,
  d) whether the stochastic-parrot framing misses emergent reasoning entirely.

  assign rough probabilites to each, then combine them into your overall credence that the model in this scenario understands medicine. tell me which part is the weakest link and what kind of result or experiment would move your number the most. also, looking at me at 0.35 vs my roomate at 0.15, which of a, b, c, or d do we probably disagree about?
