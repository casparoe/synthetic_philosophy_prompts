answer: |-
  ### PhD Comprehensive Exam: Reduction and Emergence  
  **Time Allowed:** 90 minutes  
  **Essay Question (20 marks):**  

  > Imagine a researcher claims that superconductivity exhibits **downward causation**: the macroscopic superconducting state (e.g., zero resistance) genuinely *causes* changes in the pairing behaviour of individual electrons (e.g., Cooper pair formation). She argues this **doesn’t violate causal closure** because she uses an *interventionist* (difference-making) account of causation, not a productive-mechanical one. Critically evaluate the coherence of her position. Your answer must:  
  > - Engage with the distinction between **weak and strong emergence**,  
  > - Address whether **decompositional mechanistic explanations** (e.g., Craver, Bechtel) can ever accommodate *genuine* downward causal claims,  
  > - Avoid relying solely on historical figures (e.g., Broad/Kim) without applying their frameworks concretely.  

  ---

  ### Model Answer (≈700 words; British English, casual tone)  

  Alright, let’s unpack this. The researcher’s core argument is that superconductivity’s macro-state (like zero resistance) *causes* micro-level electron behaviour via downward causation (DC), but she thinks causal closure remains intact because she’s using an *interventionist* notion of causation—where causes are difference-makers under interventions—rather than a mechanistic "billiard-ball" one. Is this coherent? I’ll argue it’s *internally consistent* but collapses strong emergence into weak emergence when pressed, failing to secure *genuine* DC.  

  First, the **interventionist angle** kinda works… superficially. If we wiggle the macro-state (e.g., break superconductivity by raising temperature), electron pairing *does* change. Woodward’s interventionism says X causes Y if intervening on X changes Y, holding other stuff fixed. So yeah, intervening on the macro-state *makes a difference* to micro-behaviour. The researcher might say: "See? No energy-transfer or particle-pushing needed—just counterfactual dependence. Causal closure isn’t threatened!" And sure, if causation is *just* difference-making, causal closure (every physical event has a sufficient physical cause) isn’t obviously violated because the macro-state supervenes on micro-physics.  

  But here’s the rub: **weak vs. strong emergence**. Weak emergence is all about *explanatory* or *epistemic* novelty—think fluid dynamics emerging from molecules, where macro-properties are reducible in principle but tricky to calculate. Strong emergence, though, requires *ontological* novelty: macro-states having causal powers *not* reducible to micro-parts. The researcher wants DC, which screams *strong* emergence (macro-forces changing micro-dynamics). But interventionism alone can’t deliver that. Why? Because difference-making doesn’t imply *direct* DC; it might just highlight *supervenience*. If the macro-state depends entirely on micro-stuff (as in superconductivity—BCS theory explains Cooper pairs via lattice interactions), then "intervening" on the macro is just a sneaky way of intervening on its micro-base. No new causal oomph—just redescription.  

  Now, **mechanistic literature** (Craver, Bechtel) wrecks this further. Mechanists demand "mutual manipulability": for DC to be real, you’d need *independent* manipulation of the macro to affect micro-parts *without* changing other micro-conditions. But in decompositional explanations—like modelling superconductors—macro and micro are *coupled*. You can’t "intervene" on zero resistance without tweaking temperature/pressure, which are micro-constituents’ parameters. Craver’s mutual manipulability fails: messing with the macro *is* messing with its micro-foundations. Mechanists would call DC here an "illusion" from coarse-graining variables. The researcher’s DC claim just tracks how macro *supervenes* on micro; it doesn’t add new arrows in the causal web.  

  What about **causal closure**? The researcher’s defence holds… but only by watering down DC. If difference-making is all causation is, sure, macro-states "cause" micro-changes. But this reduces DC to *program explanations* (Jackson/Pettit): the macro-state *programs for* micro-effects but doesn’t *produce* them. That’s weak emergence—useful for prediction, but ontologically thin. Strong emergence requires micro-causal *incompleteness*, and interventionism doesn’t create that gap. If electrons’ behaviour is fully determined by micro-laws (plus boundary conditions, like temperature), positing DC adds nothing. Physics’ causal closure stays safe precisely because DC isn’t *doing* new work.  

  So—**coherent?** Only if we accept a deflated, weakly emergent view of DC. But the researcher’s language ("genuinely alters") implies strong emergence, which her account can’t support. Interventionism dodges closure violations by making causation *minimal*—but strong DC needs maximal metaphysical clout. Mechanists show decomposition excludes *fundamental* DC: in superconductors, electrons pair due to phonon interactions, not the macro-state "bossing" them. The macro-state emerges from micro-dynamics; it doesn’t redirect them.  

  **Verdict:** Coherent as weak emergence; collapses under strong emergence. Downward causation is just supervenience in fancy dress.  

  ---

  ### Marking Scheme (20 marks total)  
  **Candidates must hit these five points:**  

  1. **Interventionist causation vs. causal closure (4 marks)**  
     - *Explain how difference-making accounts avoid closure violations by decoupling causation from "production".*  
     - **Common mess-up:** Claiming closure is violated without addressing how interventionism redefines causation.  

  2. **Weak vs. strong emergence distinction (4 marks)**  
     - *Correctly apply weak (epistemic/computational) and strong (ontological) emergence to superconductivity, linking to DC claims.*  
     - **Common mess-up:** Conflating weak/strong or misapplying them (e.g., calling BCS theory "strongly emergent").  

  3. **Mechanistic mutual manipulability (4 marks)**  
     - *Use Craver/Bechtel to argue macro-micro manipulation isn’t independent in decompositional models.*  
     - **Common mess-up:** Ignoring mutual manipulability or failing to apply it to electron pairing.  

  4. **Supervenience vs. downward causation (4 marks)**  
     - *Assess whether DC is just supervenience + difference-making, or adds irreducible causal power.*  
     - **Common mess-up:** Assuming interventionist DC *entails* strong emergence.  

  5. **Collapse into weak emergence (4 marks)**  
     - *Conclude that the position only coheres if "DC" is weakly emergent/programmatic.*  
     - **Common mess-up:** Missing that strong emergence requires causal gaps in micro-dynamics.  

  ---  
  **Format note:** One deliberate typo retained ("diffrence-making" in query → "difference-making" corrected in model). Model answer’s last line starts with "Verdict:" per spec. Tone is casual but rigorous (e.g., "kinda works", "wrecks this further"). British English used ("tweaking", "fancy dress").
