  - A purely consequentialist expected utility approach
  - A practice-focused deontological approach
  - A structural/expressive integrity approach

  I'm going with the second approach because it best handles the aggregation problem while accommodating non-consequentialist considerations that seem relevant to the user's framing. The key is viewing consumption as participation in harmful systems rather than isolated causal chains.

  Now for the decomposition terms:

  For the clumping hypothesis (C): 
  - Electricity: High clumping (0.7) due to infrastructure thresholds
  - Flights: Medium clumping (0.4) via fleet planning
  - Meat: Low clumping (0.15) through supply chain inertia
  Weighted average C ≈ 0.4

  On diluted cases (~C): 
