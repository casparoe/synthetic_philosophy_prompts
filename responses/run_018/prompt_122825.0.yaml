  → **Weighted P(decisive | ~C) = (0.20×0.30) + (0.40×0.90) + ... ≈ 0.69**  

  #### (3) Ontic Indeterminacy (O)  
  *Probability counterfactuals are unknowable:* **0.10**  
  → Feedback loops in capitalism *are* chaotic, but climate damages have clear dose-response relationships (e.g., CO2e → warming). Chaotic propagation ≠ indeterminacy.  

  #### (4) Moral Determinacy (M)  
