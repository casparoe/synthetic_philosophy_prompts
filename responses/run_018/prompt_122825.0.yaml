  Uncertainty split:
  - Empirical: 30% (mostly clumping mechanics)
  - Normative: 50% (reason types)
  - Conceptual: 20% (indeterminacy)

  Disagreement diagnosis: Likely in both C and normative weights, but especially in how much weight to give complicity vs expected utility. For voting comparisons, the structure would flip - low C but different stakes change the normative balance.

  The finding that would move my number most: Empirical evidence that consumer decisions systematically influence corporate capital allocation thresholds (affecting C). That could push my credence toward 0.8.
