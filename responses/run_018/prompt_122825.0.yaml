  *(Arithmetic at end. Breakdown: 40% empirical, 50% normative, 10% conceptual.)*  

  ---

  ### 1. Decomposition Strategy  
  I consider three frameworks:  
  - **Consequentialist Expected Utility (EU)**: Focuses on causal chains and probability-weighted harm.  
  - **Practice-Based Deontology**: Emphasizes complicity in harmful systems and fairness.  
  - **Structural/Expressive Integrity**: Prioritizes moral character and collective signaling.  

  **Why practice-based deontology?**  
  It best handles *systemic harm* without requiring improbable causal chains. EU struggles with dilution; integrity theories are secondary here. Your "clumping" language implies institutional harm structures, so this grounds the analysis.  

  ---

  ### 2. Term-by-Term Breakdown  
  #### (1) Clumping Hypothesis (C)  
  *Probability that individual consumption triggers lumpy institutional decisions:*  
  - **Flights (0.55)**: Airlines adjust fleets/routes based on aggregate demand thresholds (e.g., adding a route requires ~10k extra bookings/yr).  
  - **Electricity (0.70)**: Utilities build peaker plants or retire coal based on load forecasts; marginal demand shifts matter at scale (e.g., 1MW tipping points).  
  - **Meat (0.15)**: Supply chains buffer individual purchases (slaughterhouse orders adjust to regional trends, not individual meals).  
  → **Weighted C ≈ 0.40** (assuming equal consumption share).  
  **Why?** Infrastructure changes are threshold-driven; meat lacks real-time feedback loops.  

  #### (2) Diluted Case (~C) Normative Accounts  
  *Probability weights for theories (sum=1):*  
  - **Expected difference-making (EU)**: 0.20  
  - **Complicity in harmful practice**: 0.40  
  - **Fairness to restrainers**: 0.20  
  - **Rule-based ("what if everyone")**: 0.15  
  - **Integrity/expressive**: 0.05  
  → *Dominance of complicity/fairness*: Collective harm requires participatory responsibility.  

