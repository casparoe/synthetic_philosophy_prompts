  ### Path Dependence Classroom Game: "The Color Coordination Challenge"  

  **Objective**: Simulate path dependence through sequential coordination choices with increasing returns and a small initial asymmetry, without mentioning the term until debrief.  

  **Materials**:  
  - **Index cards**: Two per student (one **blue**, one **green**).  
  - **Whiteboard**: Track rounds, choices, and cumulative totals.  
  - **Bonus**: Candy or extra credit points for top 25% scorers.  

  **Setup** (5 minutes):  
  - Students sit in a circle for visibility.  
  - **Rules**:  
    - Each round, students simultaneously choose **blue** or **green** by holding up the corresponding card.  
    - **Payoff depends on cumulative past choices** (detailed below).  
    - **Goal**: Maximize individual points.  
  - **Payoff Structure**:  
    - **Round 1**: Blue = 1.1 points, Green = 1.0 points.  
    - **Rounds 2–5**:  
      - `Payoff = 1 + (Cumulative past choices of your color)`  
      - *Example*: If 15 chose blue in Round 1, Round 2 blue payoff = 1 + 15 = 16.  

  **Gameplay** (20 minutes, 5 rounds × 3 minutes each):  
  1. **Round 1**:  
     - Students choose blue or green.  
     - Tally choices on the whiteboard:  
       | Round | Blue Choices | Green Choices | Cum. Blue | Cum. Green |  
       |-------|-------------|--------------|----------|-----------|  
       | 1     | [Count]     | [Count]      | [Count]  | [Count]   |  
     - Announce payoffs: *"Blue: 1.1 pts, Green: 1.0 pts"*.  

  2. **Rounds 2–5**:  
     - **Update cumulative totals** (e.g., Cum. Blue = prior Cum. Blue + new blue choices).  
     - **Announce next-round payoffs** based on updated cumulatives (e.g., *"Round 3: Blue pays 1 + [Cum. Blue], Green pays 1 + [Cum. Green]"*).  
     - Students choose again, observing growing point gaps.  

  3. **Final Scoring**:  
     - Students calculate total points (sum of round payoffs).  
     - Award bonus to top 25% (e.g., top 5 scorers).  

  ---  

  ### Debrief (25 minutes): Linking Gameplay to Path Dependence  
  **Reveal the Term**: "Today’s game modeled **path dependence**—where early contingent choices ‘lock in’ an outcome that later feels inevitable."  

  **Map Game Mechanics to Theory**:  
  1. **Multiple Equilibria**:  
     - *Game*: Both "all blue" and "all green" were stable outcomes.  
     - *Theory*: Many social systems (e.g., tech standards, institutions) have multiple possible stable states.  

  2. **Increasing Returns/Network Effects**:  
     - *Game*: Payoffs rose as more people chose your color (e.g., Round 2 payoff = 1 + prior cumulative).  
     - *Theory*: Choices become more attractive as others adopt them (e.g., social media platforms, QWERTY keyboards).  

  3. **Small Asymmetry & Contingency**:  
     - *Game*: Blue’s Round 1 advantage (1.1 > 1.0) was trivial—yet if enough chose blue early, it snowballed.  
     - *Theory*: Small, accidental advantages (e.g., historical events) can tip systems toward one equilibrium.  

  4. **Switching Costs & Lock-In**:  
     - *Game*: Switching to minority color later meant accepting lower payoffs. By Round 5, switching was irrational even if *collectively* better.  
     - *Theory*: Individual incentives perpetuate suboptimal standards (e.g., fossil fuels vs. renewables).  

  5. **Ex Ante Contingency vs. Ex Post Inevitability**:  
     - *Game*: Round 1 was wide open (green could have won!), but by Round 5, the outcome seemed "fixed."  
     - *Theory*: History feels inevitable in hindsight, but depended on fragile early moments (e.g., VHS vs. Betamax).  

  **What Went "Wrong" in the Game**:  
  - **Premature Coordination**: Players often flocked to blue in Round 1 for the tiny gain, ignoring green’s viability.  
  - **Stubbornness in Later Rounds**: Players refused to switch even when green *could* have won with collective action (but individual payoffs penalized it).  
  - **Takeaway**: Real-world coordination requires mechanisms (e.g., communication, policy) to overcome individualism.  

  **Limitations of the Game**:  
  1. **Timescales**: Lock-in happened in minutes, not decades.  
  2. **No Re-Runs**: Real history lacks "do-overs" to test alternatives.  
  3. **Complexity**: Real path dependence involves power, inequality, and external shocks—not just rational choices.  

  **Closing Thought**:  
  > "Path dependence reminds us that history is **contingent**—not inevitable. Yet once a path is entrenched, escaping it requires more than individual will; it demands collective imagination. Use this lens to question narratives of ‘historical inevitability’ in tech, economics, and politics."  

  ---  
  **Total Time**: 50 minutes (game + debrief), leaving 25 minutes for discussion or extensions (e.g., real-world examples like QWERTY keyboards or carbon-intensive infrastructure).
