answer: |-
  I sought a flame where justice seemed to shine,
  A name to join, a banner held on high,
  Where voices merged, a purpose strong and mine,
  To fight the dark beneath a common sky.
  Belonging called, a shelter warm and deep,
  Where right was clear, defined by chant and cry,
  My private doubt lulled into heavy sleep,
  Persuaded truth was in the loud reply.
  But soon I found the gravity she knew,
  That pulls all thought towards the central core,
  Demanding faith unquestioned, pure and true,
  My judgment chained, an echo, nothing more.
  This weight destroys the soul's attentive light,
  The focused grace that makes the spirit bright.
