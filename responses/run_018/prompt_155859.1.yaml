  Here's a joke crafted for your specific intersection of interests:

  **Why did the utilitarian cosmologists build their utility monster near the supermassive black hole?**

  **Because they needed a region where the welfare gradient became asymptotically flat outside the monster's event horizon... and the physics department already had the perfect vacuum chamber.**

  **One grad student nervously asked: "But Professor, won't feeding *all* resources to the monster leave the rest of us asymptotically flatlined at baseline welfare?"**

  **The lead physicist sighed, adjusting her ethical spectrometer: "Of course. But that negligible flatness is precisely *why* the moral calculus is inescapable. Every scrap of matter we divert to it crosses *its* welfare event horizon and gets blueshifted into near-infinite utils. Our welfare here? Perfectly flat, but finite. Its welfare inside? Spacetime-curvingly infinite. Negligible sacrifice, infinite gain. Basic aggregation."**

  **She paused, then added grimly: "Now pass the neutron star slurry. Its marginal utility is... diverging."**

  ---

  **Breakdown for Clarity & Humor:**

  1.  **Setup Analogy:** Explicitly links the monster (resource singularity) to a black hole (spacetime singularity) and the "asymptotically flat" welfare state outside to GR's asymptotic flatness far from a mass.
  2.  **Utilitarian Logic Punchline:** The core joke is the coldly logical explanation: feeding the monster is obligatory *because* the infinite utility gain inside its "welfare event horizon" dwarfs the finite (even if flattened to near-zero) utility outside. This directly uses the utilitarian aggregation principle (maximize *total* utility) as the "inescapable" driver, mirroring gravity's inescapable pull.
  3.  **Precise Physics Integration:**
      *   **Asymptotic Flatness:** Used twice - describing the *welfare state* outside the monster's influence (flatlined well-being) and implicitly the *spacetime* far from the black hole. This is the key structural similarity you identified.
      *   **Event Horizon:** Repurposed as a "welfare event horizon" – the boundary beyond which resources are converted to near-infinite utility, just as matter/energy crossing a physical event horizon is lost to the singularity.
      *   **Blueshift:** Resources gain "infinite utils" analogous to light gaining energy (blueshift) as it falls towards a black hole.
      *   **Diverging Marginal Utility:** A final physics-flavored economic term – the monster's hunger (marginal utility gain from the next resource) is becoming infinite/singular.
  4.  **Dark Academic Humor:** The resigned tone of the physicist ("sighed", "grimly", "inescapable", "basic aggregation") highlights the disturbing yet logically consistent conclusion of pure utilitarianism when faced with an infinite sink, delivered with the dry pragmatism of a physicist discussing an unavoidable experimental result. The "neutron star slurry" adds absurdist specificity.

  This avoids generic references, relies on the specific structural analogy you noted, and turns the screw of utilitarian logic using precise GR concepts for the punchline. The humor comes from the chillingly accurate application of physics intuition to ethical absurdity.
