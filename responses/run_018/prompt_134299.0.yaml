answer: |-
  ### Seminar Plan: Discursive Dilemma in Judgment Aggregation

  #### **Dependency Sequence**
  1. **Logical Distinction (First 10 mins):**  
     Establish the *premise-based vs. conclusion-based aggregation* distinction. Emphasize that the dilemma arises only when the conclusion is a **logical function of the premises** (e.g., \( C = P_1 \land P_2 \land P_3 \)). Without this, the paradox collapses into generic disagreement.

  2. **Intermediate Step (Next 15 mins):**  
     Demonstrate that **individual rationality is preserved** (each agent’s judgments are logically consistent). Highlight that the conflict emerges solely from aggregation, preventing dismissal as mere "group disagreement."

  3. **Paradox Display (15 mins):**  
     Present the carrying case (wetland project) showing majority votes on premises yield \( \neg C \), while majority on conclusion yields \( C \).

  4. **Rationality Failure (15 mins):**  
     **Immediately after the paradox**, stress that the collective set \( \{P_1, P_2, P_3, \neg C\} \) is **logically inconsistent** despite individual consistency. Contrast with democratic legitimacy: the issue isn’t flawed procedure but incoherent group agency.

  ---

  #### **Carrying Case: Wetland Development Committee**
  - **Scenario:**  
    Three experts vote on approving a wetland project iff:  
    \( P_1 \): "Ecological risk is acceptable"  
    \( P_2 \): "Project complies with environmental law"  
    \( P_3 \): "Project is economically necessary"  
    \( C \): "Approve project" (\( C \equiv P_1 \land P_2 \land P_3 \)).
  - **Required Properties:**  
    - Interdependent premises (conjunction forces premise sensitivity).  
    - Transparent logical connection (no ambiguity in \( C \)’s dependency).  
    - Binary judgments (yes/no; no degrees of belief).  
  - **Excluded Elements:**  
    - No chairperson (pure majority voting).  
    - No probabilistic credences (avoids Bayesian distractions).  
    - No strategic voting (sincere judgments only).  
  - **Why Avoid Jury Framing:**  
    Legal concepts (negligence/causation) imply normative weight, distracting from logical structure. Use the ecologically neutral case to isolate formal rationality.  

  ---

  #### **Misconception Trajectory**
  1. **Misconception:** *Weighted/supermajority voting resolves the conflict.*  
     - **Intervention Point:** After paradox display, before rationality discussion.  
     - **Countermove:** "Adjusting voting rules doesn’t eliminate inconsistency; it only shifts the contradiction threshold."  

  2. **Misconception:** *The problem requires strictly binary premises.*  
     - **Intervention Point:** After introducing the carrying case.  
     - **Countermove:** "Non-binary judgments (e.g., graded beliefs) can reproduce the dilemma under probabilistic aggregation."  

  3. **Misconception:** *The dilemma justifies expert/authoritarian overrides.*  
     - **Intervention Point:** During rationality failure discussion.  
     - **Countermove:** "Experts face the same aggregation paradox; the issue is group ontology, not voter competence."  

  ---

  #### **Understanding Check**
  - **Scenario:**  
    A committee votes on \( P_1 \): "Funding is available," \( P_2 \): "Project is ethical," and \( C \): "Launch project" (\( C \equiv P_1 \lor P_2 \)).  
    - Individual votes:  
      - Alice: \( P_1 \) (Y), \( P_2 \) (N), \( C \) (Y)  
      - Bob: \( P_1 \) (N), \( P_2 \) (Y), \( C \) (Y)  
      - Clara: \( P_1 \) (N), \( P_2 \) (N), \( C \) (N)  
    - Premise-based: Majority rejects \( P_1 \) and \( P_2 \) → \( \neg C \).  
    - Conclusion-based: Majority accepts \( C \).  
  - **Diagnostic Criterion:**  
    Students must recognize that **no collective inconsistency exists** (rejected \( P_1 \land P_2 \) entails \( \neg C \), matching the conclusion-based output), proving they see the dilemma hinges on *rationality failure*, not aggregation mismatch.  

  ---

  #### **Omitted Scope**
  - Formal taxonomy of aggregation rules (e.g., quota rules).  
  - General impossibility theorems for \( n > 3 \).  
  - Lattice-theoretic proofs.  

  ---

