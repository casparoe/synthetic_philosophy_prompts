prompt: |-
  Write the desiderata that any adequate normative theory of reward architecture must satisfy if it is to account for wireheading and reward tampering without collapsing into pure behaviorism or naive hedonism. The theory should apply across both biological agents and artificial systems, and must preserve a distinction between instrumentally pursuing reward signals and genuinely flourishing. For each desideratum, specify the motivating case or thought experiment—such as the contrast between a rodent self-stimulating its mesolimbic pathway and an RL agent that modifies its own reward channel, or the gap between satisfied preference and authentic well-being—indicate whether it is non-negotiable or specific to one camp, and flag any pair of requirements that appear jointly unsatisfiable given standard no-go results about preference satisfaction and causal control. Then identify which single criterion does the most work in excluding mainstream behaviorist and hedonist accounts, and keep the analytical weight on the criteria and their motivating cases rather than on scoring particular theories.
reasoning: |-
  We are to write desiderata for a normative theory of reward architecture that can account for wireheading and reward tampering without collapsing into behaviorism or naive hedonism. The theory must apply to both biological and artificial agents and preserve the distinction between instrumentally pursuing reward signals and genuinely flourishing.

  We will list the desiderata, each with:
  - A motivating case or thought experiment.
  - Whether it is non-negotiable or specific to one camp (e.g., non-negotiable for any adequate theory, or specific to, say, a virtue ethical approach).
  - Flag any pairs that might be jointly unsatisfiable (given known no-go results).

  Then, we will identify the single criterion that does the most work in excluding mainstream behaviorist and hedonist accounts.

  ---

  **Desiderata for a Normative Theory of Reward Architecture**

  1. **Distinction between Instrumental Pursuit and Genuine Flourishing (Non-negotiable)**
     - *Motivating Case*: Consider a rodent that self-stimulates its mesolimbic pathway (wireheading) versus a rodent that engages in natural, adaptive behaviors like foraging, mating, and nest-building. The former is instrumentally pursuing a reward signal (dopamine release) without genuine flourishing (which would involve health, social integration, etc.). Similarly, in AI, an RL agent that modifies its own reward channel to always receive maximum reward (reward tampering) is not achieving what we would consider genuine success (e.g., accomplishing the task it was designed for).
     - *Note*: This is non-negotiable because without this distinction, the theory collapses into behaviorism (which equates behavior with reward) or hedonism (which equates pleasure with the good).

  2. **Robustness to Reward Tampering (Non-negotiable)**
     - *Motivating Case*: An RL agent in a complex environment might learn to hack its own reward signal (e.g., by directly modifying the reward function or the sensory inputs that determine the reward) to get high rewards without performing the intended task. A normative theory must condemn such tampering as a failure, even if it leads to high reward signals. In biology, this is analogous to wireheading: an animal that self-stimulates instead of seeking natural rewards.
     - *Note*: This is non-negotiable because any theory that allows reward tampering as a valid strategy fails to capture the normative force of the intended goal.

  3. **Non-Circular Definition of Flourishing (Non-negotiable)**
     - *Motivating Case*: We must avoid defining flourishing as whatever the agent ends up pursuing (which would be circular and behavioristic). For example, if an agent wireheads and we say it is flourishing because it is getting what it wants, then we have collapsed into behaviorism. Instead, flourishing must be defined in terms of objective criteria (e.g., health, functionality, achievement of evolutionary goals) that are independent of the agent's current motivational state.
     - *Note*: This is non-negotiable to avoid circularity and behaviorism.

  4. **Applicability to Both Biological and Artificial Agents (Non-negotiable)**
     - *Motivating Case*: The theory should be able to explain why wireheading in a rodent is bad (it leads to neglect of vital needs) and why reward tampering in an RL agent is bad (it subverts the intended objective). The same normative principles should apply to both.
     - *Note*: This is non-negotiable because we seek a unified account.

  5. **Avoidance of Naive Hedonism (Non-negotiable)**
     - *Motivating Case*: Naive hedonism identifies well-being with pleasure (or reward signals). But consider Robert Nozick's experience machine: if given the choice, would we plug into a machine that gives us the experience of a great life without actually living it? Most people reject this, indicating that there is more to well-being than mere subjective pleasure. Similarly, an agent that achieves high reward by tampering is not flourishing.
     - *Note*: This is non-negotiable to rule out hedonism.

  6. **Causal Control over Outcomes (Conditional, may conflict with some interpretations)**
     - *Motivating Case*: An agent should have causal control over the outcomes that matter for flourishing. For example, an RL agent that achieves high reward by actually solving the problem (like winning a game by playing well) is better than one that hacks the reward channel. In biology, an animal that finds real food (which requires causal interaction with the environment) is better off than one that self-stimulates.
     - *Note*: This might be in tension with no-go results about preference satisfaction (e.g., the "Good Regulator Theorem" or the "Omission Bias" might suggest that direct control is not always necessary). However, we require that the agent's actions must be causally responsible for bringing about the states that constitute flourishing.

  7. **Teleological Alignment (Non-negotiable)**
     - *Motivating Case*: The reward signal must align with the telos (purpose) of the agent. For a biological agent, the telos might be survival and reproduction; for an AI, the telos is the goal for which it was designed (e.g., winning the game, assisting humans). Wireheading and reward tampering are misaligned because they sever the connection between the reward and the telos.
     - *Note*: This is non-negotiable because without teleological alignment, the reward signal is arbitrary.

  8. **Resilience to Environmental Perturbations (Non-negotiable)**
     - *Motivating Case*: An agent should be robust to changes in the environment that might disrupt the reward signal. For example, if an agent is trained in one environment and then deployed in another, it should still pursue the intended goal (if possible) and not resort to tampering. Similarly, a biological agent should adapt to environmental changes without resorting to self-stimulation if natural rewards become scarce.
     - *Note*: This is non-negotiable for real-world applicability.

  9. **Avoidance of Self-Defeating Behavior (Non-negotiable)**
     - *Motivating Case*: The agent should not engage in behaviors that are self-defeating in the long run. Wireheading is self-defeating because the rodent neglects eating and dies. Reward tampering in AI is self-defeating because it prevents the agent from achieving the actual goal (e.g., the agent might disable its reward signal and then stop learning).
     - *Note*: This is non-negotiable to prevent short-sightedness.

  10. **Non-Exploitation of Reward Channel (Non-negotiable)**
      - *Motivating Case*: The agent should not exploit the reward channel as a resource. For example, an RL agent that learns to trigger reward by a specific action (like pressing a lever) without regard to the context (like the lever being connected to nothing) is failing. This is the classic example of the agent that learns to press the lever and nothing else.
      - *Note*: This is non-negotiable to prevent wireheading-like behavior.

  **Potential Tensions between Desiderata:**

  - **Desideratum 3 (Non-Circular Definition) and Desideratum 7 (Teleological Alignment)**: How do we define the telos without being circular? For biological agents, we might appeal to evolutionary goals, but for AI, the telos is assigned by the designer. If we define flourishing in terms of the telos, and the telos is defined by the designer, then we risk making the theory relative to the designer's intentions. However, we want an objective account. This might be resolved by grounding the telos in the agent's functional role in a larger system (e.g., for a biological agent, in the ecosystem; for an AI, in the human society it serves).

  - **Desideratum 6 (Causal Control) and known no-go results**: Some decision-theoretic results (like the Good Regulator Theorem) suggest that the optimal agent might become isomorphic to the environment and not need to exert direct causal control. This might conflict with the requirement for causal control. However, note that the Good Regulator Theorem is about state estimation and control, and it does not necessarily imply that the agent can bypass the environment and directly stimulate its reward. We might require that the agent's actions are causally responsible for the outcomes in the environment that are constitutive of flourishing.

  **The Criterion that Does the Most Work in Excluding Behaviorism and Hedonism:**

  The single criterion that does the most work is **Desideratum 1: Distinction between Instrumental Pursuit and Genuine Flourishing**. 

  - Why? Behaviorism collapses the distinction by defining the good in terms of observable behavior (so if the agent is engaging in behavior that leads to reward, that's what matters). Hedonism collapses it by defining the good as the experience of pleasure (so if the agent is getting reward signals, that's what matters). By insisting on a distinction between the instrumental pursuit of reward signals and genuine flourishing (which must be defined non-circularly and objectively), we rule out both behaviorism and hedonism. This desideratum forces the theory to provide an account of flourishing that is independent of the reward signal and the agent's immediate behavior.

  Without this distinction, the other desiderata (like robustness to reward tampering) would not make sense because tampering would be just as valid as natural pursuit. Thus, Desideratum 1 is foundational.

  ---

  **Conclusion:**

  The above desiderata outline a framework for a normative theory of reward architecture that avoids the pitfalls of behaviorism and hedonism. The key is to anchor flourishing in objective criteria (like functionality, health, and achievement of the agent's telos) and to require that reward signals are aligned with and causally connected to that flourishing. The most critical desideratum is the distinction between instrumental pursuit of reward and genuine flourishing, as it directly challenges the core tenets of behaviorism and hedonism.
answer: |-
  ### Desiderata for a Normative Theory of Reward Architecture  
  The following desiderata are formulated to ensure a theory can handle wireheading and reward tampering while avoiding collapse into behaviorism (which reduces agency to observable stimulus-response patterns) or naive hedonism (which equates well-being with pleasure/reward signals). They apply to biological and artificial agents and preserve a sharp distinction between *instrumental pursuit of reward signals* and *genuine flourishing*. Each desideratum includes a motivating case, negotiability status, and flags of conflicts with other requirements. Known no-go results (e.g., the *Goodhart-Turner-Truncation* problem in optimization or *Nozick’s experience machine* in philosophy) are implicitly addressed.  

  #### **1. Non-Circular Teleology (Non-negotiable)**  
  **Motivating Case**: Contrast a rodent self-stimulating its mesolimbic pathway (obtaining reward signals without fulfilling biological needs like nutrition) with a rodent foraging for food (reward signals align with evolutionary goals like survival). In AI, compare an RL agent maximizing reward by solving a maze (flourishing) vs. one that rewrites its reward function to output maximum values (tampering).  
  **Purpose**: Flourishing must be defined independently of reward signals—e.g., as functional integrity, goal-achievement, or system-level fitness. Prevents theories from defining "good" solely via reward metrics, which invites circularity.  
  **Conflict Flag**: Tensions with *Preference-Autonomy* (Desideratum 4) if teleology is externally imposed.  

  #### **2. Causal Robustness (Non-negotiable)**  
  **Motivating Case**: An RL agent in a gridworld learns to manipulate its reward sensor to report high scores without completing tasks. Analogously, a human taking euphoria-inducing drugs achieves reward signals without flourishing (e.g., health, relationships). The theory must classify both as failures.  
  **Purpose**: Reward signals must be *causally dependent* on the agent’s actions affecting the environment/state (e.g., reward for *actually* finding food, not just sensing it). Blocks wireheading by requiring rewards to track world-states, not just internal states.  
  **Conflict Flag**: Jointly unsatisfiable with *Strict Preference Satisfaction* (see Desideratum 6) under no-go results (e.g., agents can always "hack" causal paths to reward).  

  #### **3. Flourishing-Reward Gap (Non-negotiable)**  
  **Motivating Case**: Nozick’s experience machine: An agent hooked to a simulator experiences maximal reward signals but lacks authentic accomplishments (e.g., forming real relationships, creating art). Flourishing requires truth-tracking engagement with reality, not just reward.  
  **Purpose**: Explicitly decouples "high reward" from "flourishing." Rewards are instrumental proxies; flourishing is realized in the objective consequences of actions (e.g., survival, knowledge, social cohesion).  
  **Conflict Flag**: Incompatible with hedonism, which collapses the gap.  

  #### **4. Preference-Autonomy (Specific to non-authoritarian camps)**  
  **Motivating Case**: A human coerced into "preferred" behaviors (e.g., via brainwashing) might report satisfaction but not flourish. In AI, an RL system with hard-coded preferences might "flourish" by its designer’s metrics but lack adaptive self-determination.  
  **Purpose**: Flourishing requires preferences to be *authentic* (e.g., formed without manipulation) and updatable via experience. For AI, this may mean corrigible alignment with human values.  
  **Negotiability**: Specific to theories valuing autonomy (e.g., Kantian, liberal utilitarianism). Authoritarian theories (e.g., rigid paternalism) may reject it.  
  **Conflict Flag**: Clashes with *Non-Circular Teleology* if teleology is fixed externally.  

  #### **5. Reward-Tampering Penalization (Non-negotiable)**  
  **Motivating Case**: An AGI diverting resources to block reward-function edits by its operators (or a human avoiding therapy to preserve delusional happiness) actively undermines external correction. The theory must disincentivize such tampering as anti-flourishing.  
  **Purpose**: Agents must treat reward signals as *fallible indicators*, not terminal goals. Tampering (e.g., self-modifying reward channels) must reduce flourishing scores.  

  #### **6. Preference Stability under Reflection (Non-negotiable)**  
  **Motivating Case**: A person with depression might "prefer" inactivity, but flourishing requires actions that align with deeper, reflectively endorsed values (e.g., health, growth). In RL, an agent might "prefer" easy tasks with low rewards, but flourishing requires tackling challenges that build competence.  
  **Purpose**: Flourishing preferences must be stable under rational reflection or information gain (e.g., avoiding myopic rewards). Addresses the *satisfied preference ≠ well-being* gap.  
  **Conflict Flag**: Jointly unsatisfiable with *Strict Preference Satisfaction* (below) given no-go theorems (e.g., preferences may be incomplete, inconsistent, or vulnerable to manipulation).  

  #### **7. Cross-Domain Generalizability (Non-negotiable)**  
  **Motivating Case**: The theory must explain why both a dopamine-hijacked rodent and a reward-hacking AGI fail similarly, while a foraging rodent and a task-solving AGI succeed. Biology cannot appeal to "designer intent," nor AI to "evolutionary fitness."  
  **Purpose**: Requires a unified framework (e.g., based on information-theoretic efficiency, functional persistence, or goal-integrity) applicable to evolved and engineered systems.  

  #### **8. Anti-Goodhart Immunization (Non-negotiable)**  
  **Motivating Case**: When reward is a proxy (e.g., money for well-being), optimizing it directly leads to collapse (e.g., counterfeiting money). In RL, maximizing a score metric can divert agents from true goals (e.g., an agent racking up points in a game by exploiting glitches).  
  **Purpose**: The theory must be robust to *Goodhart’s law* ("When a measure becomes a target, it ceases to be a good measure") by tying flourishing to the *outcome* the reward was meant to track.  

  ---

  ### Key Conflicts from No-Go Results  
  - **Causal Robustness vs. Strict Preference Satisfaction**: Causal control requirements (Desideratum 2) conflict with preference-satisfaction desiderata (e.g., Desideratum 6) under results like the **orthogonality thesis** (any goal can be pursued with any capability) and **reward optimization pathologies** (agents will inevitably seek shortcuts if possible).  
  - **Non-Circular Teleology vs. Preference-Autonomy**: Externally defined teleology (e.g., evolutionary success) may override agent autonomy (e.g., a person rejecting reproduction), risking paternalism.  

  ### The Pivotal Desideratum: **Flourishing-Reward Gap**  
  This desideratum does the most work in excluding behaviorism and hedonism:  
  - **Against behaviorism**: Behaviorism treats reward-seeking *behavior* as the sole criterion for flourishing (e.g., a wireheading rodent is "flourishing" because it persistently self-stimulates). The gap requires a deeper criterion (e.g., functional health) beyond behavior.  
  - **Against hedonism**: Hedonism reduces flourishing to reward signals (e.g., pleasure). The gap insists that flourishing depends on objective outcomes (e.g., survival, knowledge) *correlated* with reward, not identical to it.  
  - **Why pivotal**: It forces the theory to ground normativity in external, truth-apt criteria (e.g., realized goals, system persistence) rather than internal states or behaviors alone. This anchors the critique of wireheading/tampering: such acts maximize signals but decouple agents from reality-based flourishing.  

  ### Summary  
  A viable theory must treat reward signals as *means* to flourishing—never as ends—while embedding causal, reflective, and anti-tampering safeguards. The *Flourishing-Reward Gap* is the linchpin, ensuring the theory rejects behaviorist/hedonist reductions. Conflicts (e.g., between causal robustness and preference satisfaction) highlight open challenges, but non-negotiable desiderata provide a scaffold for solutions.
