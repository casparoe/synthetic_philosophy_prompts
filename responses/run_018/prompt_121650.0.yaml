    - **Q1:** *If your neurons were replaced one-by-one with functionally identical synthetic units over a decade, would the same "I"-loop persist?*  
      - **No →** **Strict Biological-Continuity View (Leaf 2)**.  
        *The "I"-loop cannot exist without the original biological substrate. Gradual replacement destroys the loop.*  
      - **Yes →** **Incoherent Branch**.  
        *Contradicts Q0: Claims the loop survives in synthetic substrate (via replacement) but not in a simulation. The inconsistency arises from accepting synthetic substrates in one context but not another.*  
  - **Yes →**  
    - **Q2:** *If the original brain is destroyed after the simulation starts, does the "I"-loop persist solely in the simulation?*  
      - **No →** **Bounded Loop View (Leaf 5)**.  
        *The loop is real but requires an unbroken causal chain of pattern maintenance. Gradual replacement preserves continuity; discontinuous copying (e.g., destruction + simulation) does not.*  
      - **Yes →**  
        - **Q3:** *If the simulation is copied and run twice simultaneously, are both instances the same "I"-loop?*  
          - **Yes →** **Incoherent Branch**.  
            *Violates identity: Two distinct entities cannot simultaneously be one "I"-loop without logical contradiction (e.g., transitivity failure).*  
          - **No →**  
            - **Q4:** *If autobiographical narrative (e.g., "my life story") is erased but the loop’s self-referential structure remains, does the "I"-loop persist?*  
              - **Yes →** **Substrate-Independent Pattern View (Leaf 1)**.  
                *The loop is a self-referential pattern. It survives in any substrate if structure is preserved; narrative is descriptive, not essential.*  
              - **No →** **Narrative-Realist View (Leaf 6, unexplored)**.  
                *The loop is real and substrate-independent but requires narrative continuity to exist. Diverges from Hofstadter by making narrative metaphysically necessary.*  
    - **Additional branch from Q0=Yes:**  
      - **Q5:** *Is the "I"-loop a real entity, or is it only useful for describing experience?*  
        - **Only useful →**  
          - **Q6:** *Does the "I"-loop still help explain behavior, even if fictional?*  
            - **Yes →** **Narrative-Constructivist View (Leaf 4)**.  
              *The loop is a descriptive overlay from storytelling, not a real entity. It aids understanding but has no metaphysical weight.*  
            - **No →** **Eliminativist View (Leaf 3)**.  
              *The loop is a useless fiction. Self-reference is an illusion; only physical processes exist.*  

  ---

  ### **Leaf Summary**  
  1. **Substrate-Independent Pattern (Leaf 1)**: Q0=Yes, Q2=Yes, Q3=No, Q4=Yes.  
     *The loop is a pattern that persists across substrates if structure is maintained. Narrative is optional.*  
  2. **Strict Biological-Continuity (Leaf 2)**: Q0=No, Q1=No.  
     *The loop is biologically grounded; no non-biological instantiation is possible.*  
  3. **Eliminativist (Leaf 3)**: Q0=Yes, Q5="Only useful", Q6=No.  
     *The loop has no reality; self-reference is a misleading byproduct.*  
  4. **Narrative-Constructivist (Leaf 4)**: Q0=Yes, Q5="Only useful", Q6=Yes.  
     *The loop is a fiction, but narrative continuity explains identity claims.*  
  5. **Bounded Loop (Leaf 5)**: Q0=Yes, Q2=No.  
     *The loop is real and self-referential but requires unbroken causal history (gradual replacement: yes; copying: no).*  
  6. **Narrative-Realist (Leaf 6, unexplored)**: Q0=Yes, Q2=Yes, Q3=No, Q4=No.  
     *The loop is real and substrate-independent but metaphysically dependent on autobiographical narrative.*  

  ### **Notes**  
  - **Incoherent Branches**: Two paths (Q0=No + Q1=Yes; Q0=Yes + Q2=Yes + Q3=Yes) are excluded for logical inconsistency.  
  - **Unseparated Positions**: All leaves are distinct. *Bounded Loop (Leaf 5)* and *Substrate-Independent (Leaf 1)* are separated by Q2 (causal continuity). *Narrative-Constructivist (Leaf 4)* and *Eliminativist (Leaf 3)* are separated by Q6 (explanatory usefulness).  
  - **Unexplored Position**: *Narrative-Realist (Leaf 6)* is logically possible but rarely defended; it may conflate epistemology (how we track selves) with metaphysics (what selves are).  
  - **Hybrid Stability**: *Bounded Loop (Leaf 5)* is a stable hybrid—avoids duplication paradoxes (unlike Leaf 1) but allows non-biological persistence (unlike Leaf 2).  

  This tree isolates core commitments (substrate, causality, narrative, ontology) while avoiding doctrinal labels. Students can navigate by considering thought experiments alone.
