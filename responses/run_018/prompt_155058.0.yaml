prompt: |-
  I'm a novelist mostly working on literary fiction, and right now I'm fiddling with a manuscript where inanimate objects seem to carry intensions that don't belong to any human character, which got me arguing with my flatmate about whether fictional agents have 'real' minds or only borrowed ones. He brought up Dennett's two-bitser idea against Searle's split between original and derived intentionality, but I only half-followed, so I want you to reststate the whole debate for me in the vocabularly of fiction-writing and narrative craft.

  Specifically, map Dennett's minimal two-bitser system — pushing back against Searle's claim that only intrinsic minds possess original intentionality while everything else is just assigned meaning — onto precise literary mechanisims: the author as the source, characters as agents, narrative voice, props that seem to 'mean' things, unreliable narrators, the gap between what a text literally says and what it intends, and so on. Be honest about the translation: for each philosophical move, say whether it lands cleanly on a craft concept, whether you had to distort the literary idea to make it fit, or whether it has no counterpart at all in how novels actually function. Then give me the residue report: is the leftover material a sign that our craft vocabulary is missing something important, or does it show that the philosophers' distinction collapses once you examine how stories work?

  Keep it under 350 words, use British English, don't give me a bibliography or page citations I can't verify, and please don't correct the typo in my message — just answer straight.
