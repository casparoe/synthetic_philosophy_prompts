  The shelves extend beyond the furthest sight.
  A figure stands before the silvered glass.
  Books crowd the left shelf, bound in fading white.
  The amber light spills on the worn parquet.
  The glass shows gilt letters facing east, held tight.
  The shelves extend beyond the furthest sight.

  The shelves extend beyond the furthest sight.
  A shadow shifts upon the right shelf's spine.
  The glass shows gilt letters facing west, a sign.
  No hour claimed, the clock-face lies in shards,
  Proof that no hand was meant to draw a line.
  The shelves extend beyond the furthest sight.

  The shelves extend beyond the furthest sight.
  High in the glass, the ceiling’s dome repeats.
  The left shelf’s white bleeds into amber heats.
  The right shelf’s shadow climbs the eastern script.
  The figure breathes the dust of unchanged streets.
  The shelves extend beyond the furthest sight.

