  **Form & Function Notes:**

  *   **Visual Branching:** The single opening line/stanza splits into two distinct, indented stanzas (Branch A & B), visually mimicking the tree-like structure of branching time. They remain separate until the final two lines.
  *   **Equal Weight:** Both branches (Battle & No Battle) are developed with equal sensory detail ("timbers scream"/"sails hang slack"; "crimson and complete"/"vacant blue"; "anchor, drags"/"buoyant calm") and line count, emphasizing their co-reality *from the present perspective*.
  *   **Tense Logic Accuracy:** The "present" is the point of contingency ("This present tenses"). Branch A uses the present tense ("scream," "paints," "takes flesh") for the unfolding battle viewed *from within that branch*. Branch B similarly uses present tense ("hang," "lost," "sips," "read," "hold," "lifts"). The final lines step back to the *epistemic* present of the branching point.
  *   **Determinism Question:** The closing couplet explicitly asks the core question prompted by branching models: is the apparent indeterminacy ("chaos") genuine, arising from a non-deterministic root, or is the determinism merely hidden ("root conceal / A single, iron seed") from our limited, branch-bound view? It avoids resolving the debate.
  *   **No Free Will Sermon:** The poem focuses on the structure of time and truth-value assignment, not moral agency. The argument is carried by the form and the concluding question, not exposition.
