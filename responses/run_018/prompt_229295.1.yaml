prompt: |-
  I write a small column for a philosophy department newsletter in which ordinary documents — safety cards, warranties, event programs — are rewritten so that some philosophical position is taken literally as operating procedure. The next installment is on the lifeboat-ethics argument: the picture of the rich world as a well-stocked lifeboat with limited capacity and the poor as swimmers in the surrounding water, where taking on more passengers is said to sink everyone, and where feeding or rescuing the swimmers is said only to produce more swimmers later. I'd like you to write the installment for me: the text of a laminated emergency-evacuation card, of the sort posted on the cabin door of a cruise ship, for a cruise line whose official safety policy simply is lifeboat ethics.

  Keep it strictly in-world — a guest-facing document, with no mention of the original essay, its author, or the phrase "lifeboat ethics," and no winking at the reader. It should run around 650 to 700 words, in American English, formatted as numbered sections, and remain deadpan throughout: the jokes must come from the precision of the policy details, not from irony markers. The card should include: embarkation priority and the credentials that make a person a "passenger" rather than a "swimmer"; a fixed carrying capacity justified by a technical safety margin rather than by a distributive decision; a rule that crew may throw provisions, flotation aids, or expressions of concern into the water but may not surrender seats; a subsection responding to the suggestion that rescuing people now prevents future drownings, answered by the expected increase in the number of swimmers; and a closing note on each guest's duty to the community of the saved. Throughout, land the standard objections without ever stating them — that the lifeboat frame rigs the arithmetic from the outset, that the line between passenger and swimmer is an artifact of ticket class and birth, that the boat's capacity is treated as a fixed natural fact even though boats can be redesigned and seats redistributed, and that the policy blames the drowning for being in the water while presenting its own refusal as prudent compassion.
reasoning: |-
  Okay, the user wants me to write a fictional emergency evacuation card for a cruise line that embodies Garrett Hardin's lifeboat ethics argument. This is for a philosophy newsletter column where ordinary documents are rewritten to literalize philosophical positions.

  Breaking down the requirements: This needs to be a deadpan, in-world safety card (around 650-700 words) with no explicit references to the original essay or meta-commentary. It must include specific elements: passenger classification criteria, fixed capacity justification, prohibition on surrendering seats while allowing symbolic aid, rebuttal to rescue arguments based on population growth, and emphasis on community duty. All standard criticisms of lifeboat ethics should be embedded implicitly through the policy language.

  The user is clearly philosophically sophisticated - they've articulated complex nuances about how the document should subtly critique itself through framing. This isn't just parody but a demonstration of ideology baked into bureaucratic language. Their column seems designed to make readers reconsider how philosophy operates in mundane systems.

  For structure, I'll adapt standard maritime safety card formatting: numbered sections, bold headers, passive voice. The tone must remain clinical while letting the ethical absurdities emerge naturally. Passenger classification will hinge on verifiable credentials to imply arbitrary privilege. The capacity section will invoke "safety margins" to mask distributive choices. The non-rescue rationale will use actuarial language about "population equilibrium" to dehumanize. The community duty close will echo social contract theory twisted into survival justification.

  Key challenges include maintaining absolute deadpan delivery while making the subtext clear, and balancing word count against all required elements. I'll prioritize the swimmer/passenger dichotomy and capacity arguments as central to the metaphor. The "throwing provisions" rule becomes darkly comic when specifying "expressions of concern" as permissible aid. The population rebuttal needs cold statistical phrasing to highlight Malthusian logic.

  The closing will invoke collective obligation language to underscore how such ethics demand complicity. Throughout, passive constructions ("it is observed") will position policies as natural laws rather than choices. No wink to the reader - the horror must stem from the document's own internal logic.
answer: |-
  **EMPRESS LINES**
  **EMERGENCY EVACUATION PROCEDURES**
  **(Cabin Door Laminated Card - Rev. 7)**

  **1. Vessel Status & Passenger Identification**
     *   Upon declaration of a Major Maritime Incident (MMI) by the Captain, the vessel is designated the *Primary Survival Platform (PSP)*. All standard vessel operations cease.
     *   **Passenger Status:** Your designation as a **Passenger** is contingent upon possessing *valid, verifiable credentials* demonstrating full pre-incident payment for your voyage segment, including applicable insurance premiums, and compliance with all Empress Lines embarkation protocols. Present your **Platinum SeaPass Card** (or equivalent valid credential) immediately upon crew request. **Swimmer Status:** Any individual located outside the PSP lacking valid Passenger credentials is designated a **Swimmer**. Swimmers are not recognized occupants of the PSP.

  **2. Embarkation Priority & PSP Access**
     *   Access to the PSP’s secured survival modules (Lifeboats, Liferafts) is strictly regulated.
     *   **Priority Sequence:**
          *   **Tier 1:** On-duty Bridge Officers and designated Engineering personnel critical to PSP stability.
          *   **Tier 2:** Empress Lines crew members with active safety certification and assigned emergency stations.
          *   **Tier 3:** Verified Passengers holding Diamond or Platinum membership status.
          *   **Tier 4:** Verified Passengers holding Gold membership status.
          *   **Tier 5:** Verified Passengers holding Silver membership status or equivalent basic passage.
     *   Access is sequential by Tier. Lower Tiers board only after all higher Tiers within a designated module have embarked and *only* if capacity allows (See Section 3). Maintain orderly queues at your assigned muster station. Crew instructions are final.

  **3. PSP Carrying Capacity & Safety Margin**
     *   Each survival module has a **Maximum Certified Occupancy (MCO)**. This figure is not arbitrary but is derived from:
          *   Rigorous hydrodynamic stability modeling under extreme sea states.
          *   Minimum per-person oxygen volume requirements over maximum anticipated rescue timelines.
          *   Critical reserve buoyancy calculations ensuring module integrity even with 15% added deadweight (e.g., water ingress, equipment failure).
          *   Pre-stocked essential resource volumes (water, rations, medical supplies) calibrated precisely to the MCO.
     *   **The MCO is an absolute safety limit.** Exceeding it, even by a single occupant, compromises the module's structural integrity, resource allocation, and operational viability, endangering all aboard. **Under no circumstances will occupancy exceed the MCO.**

  **4. Interaction Protocol with Swimmers**
     *   Passengers and crew are to remain within the secured PSP perimeter. Direct physical contact with Swimmers is prohibited.
     *   **Permissible Actions (Subject to Resource Availability & Crew Discretion):**
          *   **Provision Toss:** Non-essential PSP resources (excess ration packs, water bladders nearing expiry) may be thrown towards Swimmers. *Do not compromise PSP reserves.*
          *   **Flotation Aid Deployment:** Non-integral buoyant objects (e.g., spare life rings, empty sealed containers) may be provided if readily available and not required for PSP operations.
          *   **Verbal Communication:** Standard phrases of encouragement or informational updates ("Help is expected," "Remain calm") may be relayed via megaphone. Maintain neutral tone.
     *   **Strictly Prohibited Actions:**
          *   **Surrendering Seats:** A Passenger or crew member vacating their secured position within the MCO to admit a Swimmer constitutes a Critical Safety Violation. This act destabilizes the module and invalidates the calibrated safety margins, putting verified lives at immediate, unacceptable risk.
          *   **Physical Assistance:** Pulling Swimmers aboard, extending ladders, or lowering ropes compromises PSP integrity and invites uncontrolled boarding attempts. Do not breach the perimeter.

  **5. Addressing Rescue Queries**
     *   **Query:** "If we rescue Swimmers now, won't it prevent them from drowning later and reduce future Swimmer numbers?"
     *   **Response:** Empress Lines Safety Analysis indicates that providing Swimmer rescue creates a demonstrable **Rescue Expectation Effect (REE)**. Historical maritime incident data demonstrates that observable rescue operations correlate with increased Swimmer presence in subsequent incidents within affected regions. The provision of resources (Section 4a-b) sustains Swimmer viability without inducing REE. Full rescue, however, signals survivability, inadvertently encouraging higher-risk maritime behavior and population movement towards known transit zones, thereby increasing the *absolute number* of future Swimmers. Our policy prioritizes the guaranteed survival of verified Passengers and crew within the immutable physical constraints (Section 3) of the PSP, avoiding actions proven to exacerbate total Swimmer volume.

  **6. Passenger Responsibility & Community Integrity**
     *   Your survival and the survival of fellow Passengers depend on strict adherence to these procedures. The PSP community is founded upon mutual responsibility and the recognition of verifiable status established *prior* to the incident.
     *   **Your Duty:**
          *   **Verify & Comply:** Retain your credentials. Follow crew instructions precisely and immediately.
          *   **Uphold the Perimeter:** Prevent Swimmer encroachment. Report breaches.
          *   **Respect the MCO:** Understand that your safety relies on the strict enforcement of capacity limits. Do not petition for exceptions; they endanger everyone.
          *   **Conserve Resources:** Utilize only your allocated provisions within the PSP. Extraneous consumption weakens the community.
          *   **Maintain Order:** Disorder jeopardizes embarkation efficiency and PSP stability. Support crew efforts.
     *   Remember: The PSP represents a community of the saved, secured through foresight (your verified passage) and maintained through disciplined adherence to proven safety protocols. Your cooperation ensures this community endures until rescue.

  **REPORT SAFETY CONCERNS TO THE NEAREST CREW MEMBER IMMEDIATELY.**
  **Empress Lines: Safety Through Clarity & Prudence.**
