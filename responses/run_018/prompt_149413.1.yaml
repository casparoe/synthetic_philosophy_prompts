prompt: |-
  I'm an ML engineer who mostly thinks about active learning and acqusition functions. Restate Good's theorem on the value of information using vocabulary I actually use -- policies, expected information gain, sampling costs, the exploration/exploitation tradeoff -- as precisely as you can. Then give me the residue report: which parts map cleanly onto my framework, which parts you had to fudge (like treating belief revision as just updating a training set), and wether there's anything in the philosophers' debate that literally has no counterpart in how we think about data collection. I'm especially curious if my intuition that more data can't hurt survives the translation, or if Good's conditions expose exactly where that breaks.
