  We are restating Good's theorem in the context of active learning and acquisition functions. Good's theorem addresses the expected value of information (EVI) in decision-making under uncertainty. We'll use the terms: policies, expected information gain, sampling costs, and exploration/exploitation tradeoff.

  ### Good's Theorem (Restated)
  Good's theorem states that, under certain conditions, the expected value of information (EVI) is nonnegative. Specifically, for a decision maker who can choose to acquire additional information (at a cost) before making a final decision, the expected net gain from acquiring information is nonnegative when the cost of information is zero. However, when the cost of information is positive, the decision to acquire information must be weighed against that cost.

  In our active learning framework:
  - Let \(\pi\) be a **policy** that maps the current state (including the current model and dataset) to an action: either making a prediction (exploitation) or querying a new data point (exploration).
  - The **expected information gain (EIG)** of a query is the expected reduction in uncertainty (e.g., in entropy or another measure of model uncertainty) about the model parameters or the function we are learning.
  - There is a **sampling cost** \(c\) associated with acquiring a new data point.
  - The goal is to maximize the expected utility (or minimize the expected loss) over a horizon that may include multiple steps of data collection and a final decision.

  **Theorem (Good, restated):**  
  Consider a decision maker who must choose an action \(a\) from a set \(\mathcal{A}\) to maximize expected utility \(\mathbb{E}[U(a)]\) under current beliefs. The decision maker has the option to first observe the outcome \(x\) of an experiment (which may be costly) and then choose an action. The expected value of information (EVI) from observing \(x\) is defined as:
  \[
  EVI = \mathbb{E}_{x} \left[ \max_{a} \mathbb{E}[U(a) | x] \right] - \max_{a} \mathbb{E}[U(a)]
  \]
  Good's theorem states that \(EVI \geq 0\) when the cost of the experiment is zero. Moreover, the decision maker should perform the experiment if \(EVI > c\), where \(c\) is the cost of the experiment.

  ### Residue Report

  #### Mapping to Active Learning Framework
  1. **Policies**: 
     - In active learning, a policy decides whether to query a label (exploration) or to make a prediction (exploitation). This maps directly to the decision of whether to conduct the experiment (query) or to make an immediate decision (exploit).

  2. **Expected Information Gain (EIG)**:
     - EVI is closely related to EIG. In fact, in Bayesian active learning, EVI is often approximated by EIG (e.g., using mutual information). Specifically, when the utility is the log score (or negative log loss) and the model is Bayesian, EVI becomes equivalent to EIG (the mutual information between the query and the model parameters or the function values). Thus, EIG is a natural measure for EVI in our context.

  3. **Sampling Costs**:
     - The theorem explicitly accounts for a cost \(c\) of acquiring a data point. This is a direct mapping.

  4. **Exploration/Exploitation Tradeoff**:
     - The theorem directly addresses this tradeoff. The term \(\max_{a} \mathbb{E}[U(a)]\) is the expected utility of the best immediate action (exploitation). The term \(\mathbb{E}_{x} \left[ \max_{a} \mathbb{E}[U(a) | x] \right]\) is the expected utility of the best action after seeing the new data (which requires exploration). The difference (EVI) quantifies the value of exploration.

  #### Fudges and Approximations
  1. **Belief Revision as Updating a Training Set**:
     - In the theorem, the update of beliefs is done via Bayesian conditioning. In practice, we often approximate this by updating the training set and retraining the model (which might not be fully Bayesian). This approximation is a fudge because it replaces exact Bayesian posterior updates with an approximate learning algorithm (e.g., SGD training of a neural net). The quality of the approximation affects the validity of the EVI calculation.

  2. **Utility Function**:
     - The theorem requires a well-defined utility function. In active learning, we often use surrogate objectives (like expected error reduction or model uncertainty reduction) that might not directly correspond to a utility in the decision-theoretic sense. We assume that the surrogate (like EIG) is a good proxy for the true EVI.

  3. **Finite Horizon and Myopic Approximations**:
     - Good's theorem is often applied myopically (one-step lookahead). However, in active learning, we sometimes consider multiple steps. The theorem in its basic form is for one step. Extending to multiple steps is more complex and may require approximations (like assuming independence or using rollout).

  4. **Model Correctness**:
     - The theorem assumes the model (likelihood and prior) is correct. In practice, model misspecification can lead to situations where EVI is negative (e.g., if the model is overconfident and the new data point confuses it more). This is a known limitation.

  #### Parts Without Counterpart
  1. **Radical Uncertainty vs. Probabilistic Uncertainty**:
     - Philosophical debates sometimes consider "unknown unknowns" (radical uncertainty) that cannot be captured by any probability distribution. In active learning, we typically assume a model (even if approximate) that assigns probabilities to all outcomes. There is no direct counterpart to radical uncertainty in our framework because we always condition on the model.

  2. **Value of Information in Non-Expected-Utility Contexts**:
     - Some philosophers debate decision theories that do not use expected utility (e.g., minimax regret, ambiguity aversion). These are not directly covered by Good's theorem. In active learning, we almost always use expected utility (or a surrogate) and Bayesian updating, so these alternatives are not typically considered.

  #### Does "More Data Can't Hurt" Survive?
  The intuition that "more data can't hurt" is captured by the nonnegativity of EVI when the cost \(c = 0\). However, note:

  - **Costless Information**: If information is free, then \(EVI \geq 0\), meaning that in expectation, having more data will not hurt (it may help or be neutral). This is because after observing \(x\), the decision maker can always ignore the new information and choose the same action as before. Thus, the expected utility after observing \(x\) is at least as high as without.

  - **But with Costs**: When \(c > 0\), it is possible that \(EVI < c\), meaning the expected gain from the information is less than the cost. Then, acquiring the data would hurt the overall utility (by incurring a cost without enough benefit).

  - **In Practice with Approximations**:
    - **Model Misspecification**: If the model is wrong, updating with new data might lead to worse decisions (e.g., overfitting). This is not accounted for in Good's theorem, which assumes the model is correct.
    - **Approximate Inference**: When we update the model approximately (e.g., with a point estimate instead of a full posterior), the EVI might be miscalculated. It is possible that the approximate update with new data leads to a worse model than before (e.g., due to catastrophic forgetting in neural nets). Thus, in practice, more data can hurt if the update is not done properly.

  **Conclusion**: The nonnegativity of EVI (for costless information) holds under the assumptions of the theorem (correct model and Bayesian updating). However, when we approximate, the intuition may break. Therefore, in the idealized Bayesian setting, more data (even uninformative data) does not hurt in expectation. But in practical active learning, due to model errors and approximation, it can.
answer: |-
  ### Restatement of Good's Theorem in Active Learning Terms

  **Theorem (Good, 1967):**  
  Consider an active learning policy optimizing an acquisition function. Let:
  - \(b_t\) be the current belief state (posterior over hypotheses given training set \(D_t\))
  - \(\mathcal{X}\) be the pool of candidate samples
  - \(a \in \mathcal{A}\) be an exploitation action (e.g., model deployment) with utility \(U(a; h)\) under true hypothesis \(h\)
  - \(c(x)\) be the cost of acquiring sample \(x\)
  - \(\pi\) be a policy choosing between:
    - Exploitation: \(\max_a \mathbb{E}_{h\sim b_t}[U(a; h)]\)
    - Exploration: Query \(x\) paying \(c(x)\), update belief to \(b_{t+1}\), then act optimally later

  The **Expected Value of Information (EVI)** for sample \(x\) is:
  \[
  \text{EVI}(x) = \underbrace{\mathbb{E}_{y \sim p(y|x, b_t)} \left[ \max_{a} \mathbb{E}_{h \sim b_{t+1}}[U(a; h)] \right]}_{\text{Expected utility after observing } x} - \underbrace{\max_{a} \mathbb{E}_{h \sim b_t}[U(a; h)]}_{\text{Current best utility}} - c(x)
  \]

  **Good's Theorem States:**  
  1. If \(c(x) = 0\), then \(\text{EVI}(x) \geq 0\)  
  2. Optimal policy acquires \(x\) iff \(\text{EVI}(x) > 0\)  

  ### Residue Report

  **Clean Mappings:**
  | Philosophers' Concept | ML Counterpart |
  |------------------------|----------------|
  | "Experiment" \(x\) | Candidate query |
  | Belief state \(b_t\) | Model posterior given \(D_t\) |
  | Utility \(U(a;h)\) | Reward/Accuracy of deployed model |
  | \(\max_a \mathbb{E}_h[U]\) | Exploitation payoff |
  | \(\mathbb{E}_y[\max_a \mathbb{E}_{h|y}[U]]\) | Expected utility after retraining with \((x,y)\) |
  | Optimal policy | BALD/TES acquisition policy |

  **Fudged Approximations:**
  1. **Belief Revision:**  
     Philosophers assume exact Bayesian updating \(b_t \rightarrow b_{t+1}\). We approximate this by:  
     - Retraining on updated dataset \(D_{t} \cup (x,y)\)  
     - Using MC dropout/ensembles as posterior proxies  
     *Fudge:* We ignore computational constraints and approximate inference errors.

  2. **Utility Function:**  
     Theorem requires explicit \(U(a;h)\). We often use surrogates:  
     - EIG \(\equiv I(y; h \mid x)\) (for BALD)  
     - Expected error reduction (for TES)  
     *Fudge:* These are proxies for true task utility.

  3. **Hypothesis Space:**  
     Philosophers assume well-defined \(\mathcal{H}\). We use:  
     - Parameter space \(\Theta\) with prior \(p(\theta)\)  
     - Implicit \(\mathcal{H}\) via model architecture  
     *Fudge:* Real \(\mathcal{H}\) is unknown; we rely on inductive biases.

  **No Counterpart in ML:**
  - **Radical Uncertainty (Knightian):**  
    Philosophers debate whether probabilities can be assigned to all events. In ML, we always assume \(p(y|x, D_t)\) is quantifiable—no "unknown unknowns" in acquisition functions.

  - **Pragmatic Encroachment:**  
    Philosophical claim that *knowledge* depends on practical stakes. In ML, acquisition functions (e.g., BALD) are stakes-agnostic. We don't adjust EIG based on deployment risk.

  ### Does "More Data Can't Hurt" Survive?

  **Yes, but only in the theorem's utopian case:**  
  \[\text{If } c(x) = 0 \text{ and exact Bayesian updating: } \text{EVI}(x) \geq 0\]

  **Breaks when:**  
  1. **Sampling Costs \(c(x) > 0\):**  
     - Annotation cost → negative EVI if info gain < \(c(x)\)  
     - *Example:* Querying irrelevant outliers  

  2. **Approximate Inference:**  
     - Non-Bayesian updates (e.g., SGD) can make \(b_{t+1}\) *worse* than \(b_t\)  
     - *Example:* Catastrophic forgetting in continual learning  

  3. **Model Misspecification:**  
     - New data \(x\) exposes flaws in \(\mathcal{H}\) → reduces confidence  
     - *Example:* Discovering dataset shift hurts calibration  

  4. **Non-Myopic Policies:**  
     - Opportunity cost: Budget spent on \(x\) prevents querying better \(x'\) later  
     - *Example:* Poor exploration in early phases traps policy in local optimum  

  **Practical Survival Guide:**  
  - Your intuition holds for \(c(x)=0\) + perfect Bayes  
  - In real active learning:  
    - Use cost-aware acquisition: \(\text{EIG}(x)/c(x)\)  
    - Monitor belief calibration (e.g., ECE)  
    - Reject queries where \(\text{EIG}(x) < \epsilon\) (noise floor)  

  Good's theorem exposes the **exact breakpoint**: when marginal information gain dips below approximation error + sampling cost. This is why we need acquisition functions beyond random sampling.
