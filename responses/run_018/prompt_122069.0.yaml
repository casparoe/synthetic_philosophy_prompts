  Hmm, the user is asking about geometric rationality, specifically what makes a normative theory like Kelly betting "adequate" rather than just heuristic. They want a list of requirements, addressing six pressure points they've outlined: recovery of the classic Kelly result, handling ontological uncertainty, reflexive bets, deviations in high-stakes choices, preserving the belief-outcome distinction, and fractional Kelly adjustments. They also want me to flag any unsatisfiable clusters and give a verdict.

  First, I need to recall what Kelly betting is. It's about maximizing the expected logarithm of wealth, which leads to optimal growth in repeated bets. The user isn't looking for a defense of Kelly; they want the criteria that make a theory based on this approach fully normative.

  Now, breaking down each pressure point:

  1. **Recovery of the classic Kelly result**: The theory must derive the Kelly criterion without adding extra risk-aversion parameters. It should come naturally from the axioms. This is non-negotiable because it's the foundation. The challenge is that in standard EU, Kelly requires log-utility, which might seem like risk aversion, but here it should emerge purely from growth maximization.

  2. **Ontological uncertainty**: This is uncertainty over which model is true, like in Bayesian model averaging. The theory must handle this without collapsing to EU, meaning it should maintain geometric growth across models. Non-negotiable for completeness. The hard part is that different models might imply different dynamics, so the optimal bet could involve balancing across them in a way that's not additive.

  3. **Reflexive bets**: Bets that affect the environment or the agent's beliefs, like in prediction markets. This breaks the exogenous growth assumption. The theory must account for feedback loops. Non-negotiable for modern applications. Difficulty is integrating game theory or belief updating into the optimization without losing geometric rationality.

  4. **Systematic deviations**: Real agents don't follow Kelly in one-shot, high-stakes situations, showing Allais-style behavior. The theory shouldn't dismiss this as irrational but incorporate it meaningfully. Probably a preference, as some camps might accept deviations as normative. Challenge is distinguishing when geometric rationality applies vs. when it doesn't.

  5. **Epistemic vs. pragmatic rationality**: Beliefs should be calibrated independently from betting strategies. Non-negotiable to avoid reductionism. The tension is that Kelly often ties belief to action, so separating them while maintaining coherence is tricky.

  6. **Fractional Kelly adjustments**: Drawdown constraints or other modifications need a principled basis, not just patches. Non-negotiable for robustness. Hard because it might require extending the theory beyond pure growth maximization.

  Now, analyzing interactions: The big conflict is between (3) reflexive bets and (1)/(5). Reflexive bets require beliefs and actions to be interdependent, but (5) wants them separate. Also, (1) assumes independent trials, which (3) violates. So probably (1), (3), and (5) can't all hold together.

  For the scoring part: Pure Kelly handles (1) and (2) well but fails on (3), (4), (5), and (6). Fractional Kelly might address (4) and (6) but ad-hoc. Standard EU with risk aversion handles (3), (4), but not (1) or (2) without tweaking.

  The verdict should highlight the unsatisfiable cluster: (1), (3), and (5) together are problematic because of the tension between exogenous growth, feedback loops, and separating beliefs from actions.

