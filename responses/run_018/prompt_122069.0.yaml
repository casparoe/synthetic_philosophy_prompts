answer: |-
  Here is a comprehensive specification of desiderata for an adequate normative theory of geometric rationality (GR), addressing your pressure points. The criteria are framed as non-negotiable for any theory claiming to be a *normatively adequate* extension of the Kelly/log-utility tradition, not merely a heuristic. Each includes motivation, negotiability, and key challenges.

  ---

  ### **Core Desiderata for Geometric Rationality**
  1. **Ergodic Growth Recovery**  
     - **Motivation**: Must derive the Kelly criterion (maximize \( \mathbb{E}[\log(b)] \)) for independent, stationary repeated bets *without* introducing exogenous risk-aversion parameters. This is the foundational case (e.g., coin flips with known edge).  
     - **Non-negotiable**: Yes. Failing here undermines GR’s core identity as optimizing asymptotic growth.  
     - **Hardness**: Avoiding "smuggling" requires proving that risk aversion emerges *endogenously* from growth optimization alone (e.g., via time-averaging in non-ergodic systems).  

  2. **Ontological Uncertainty**  
     - **Motivation**: Must handle uncertainty over *which model/payoff structure governs reality* (e.g., Bayesian model averaging over mutually exclusive hypotheses). Must not collapse to linear expected utility (EU) when models imply divergent dynamics.  
     - **Non-negotiable**: Yes. GR must generalize beyond fixed environments.  
     - **Hardness**: Balancing geometric growth across incompatible models requires non-linear aggregation (e.g., maximizing expected log-growth over hypotheses), risking Dutch books if not carefully axiomatized. Distinction from EU hinges on preserving multiplicative dynamics.  

  3. **Reflexive Bets**  
     - **Motivation**: Must address wagers that alter the environment (e.g., prediction markets shifting odds), the agent’s beliefs (e.g., self-modification), or the outcome distribution (e.g., strategic disclosure). Growth is no longer exogenous.  
     - **Non-negotiable**: Yes. Modern applications (e.g., AGI, markets) demand this.  
     - **Hardness**: Integrating game theory, belief revision, and GR objectives. The bet \( b \) becomes a function of the agent’s belief \( p \) and the environment’s response \( f(b) \), leading to fixed-point problems (e.g., solving \( b^* = \arg\max \mathbb{E}[\log(b) | p(f(b))] \)).  

  4. **High-Stakes Deviation Compatibility**  
     - **Motivation**: Must explain/prescribe systematic departures from pure Kelly in one-shot/high-stakes scenarios (e.g., Allais paradoxes) without labeling them irrational. GR should not demand dogmatic adherence when terminal wealth matters.  
     - **Non-negotiable**: Preference (camps divide here). Purists reject deviations; pragmatists demand accommodation.  
     - **Hardness**: Reconciling long-run growth with terminal convexity/concavity of value. Requires a unified framework where "number of iterations" modulates risk posture, or where wealth effects trigger dynamic rescalings.  

  5. **Epistemic-Pragmatic Distinction**  
     - **Motivation**: Must preserve a clear boundary between epistemic rationality (calibrating beliefs) and pragmatic rationality (optimizing outcomes). Beliefs should not be *defined* by betting behavior (to avoid circularity), and calibration should remain distinct from utility maximization.  
     - **Non-negotiable**: Yes. Collapsing this distinction undermines normative foundations (e.g., makes "truth-seeking" incoherent).  
     - **Hardness**: GR’s betting interpretation risks reducing belief to action. Requires decoupling credence formation (e.g., via Bayesian updates) from stake-sensitive decisions.  

  6. **Principled Fractional Adjustments**  
     - **Motivation**: Must provide a rigorous basis for fractional Kelly (e.g., betting \( c \cdot f^* \) for \( c < 1 \)) under constraints like drawdown limits or risk of ruin. Should not be a heuristic patch but a consequence of the theory.  
     - **Non-negotiable**: Yes. Real-world applications require bounded risk.  
     - **Hardness**: Deriving fractional bets from first principles (e.g., via survival constraints or finite-horizon optimization) without ad-hoc parameters. Must not regress to EU with risk aversion.  

  ---

  ### **Interactions and Tensions**
  - **Key Conflict**: **(1)**, **(3)**, and **(5) are jointly unsatisfiable** under standard GR.  
    - **Why**: (1) assumes exogenous, independent growth; (3) makes growth endogenous and belief-dependent; (5) demands beliefs be action-independent. Reflexivity **(3)** forces beliefs and outcomes into co-determination (violating **5**), while undermining stationarity **(1)**.  
    - **Example**: In prediction markets, a log-optimal bet changes the market’s implied probabilities, requiring belief updates that alter the next bet—collapsing the epistemic/pragmatic divide. Pure GR cannot resolve this without sacrificing (1) or (5).  
  - **Other Tensions**:  
    - (4) vs. (1): High-stakes deviations challenge ergodicity assumptions.  
    - (6) vs. (1): Fractional adjustments imply non-geometric optimization, conflicting with pure asymptotic growth.  

  ---

  ### **Quick Scoring of Existing Frameworks**
  - **Pure Kelly**:  
    - ✔️ (1) [Perfect], (2) [Good for Bayesian model mixing]  
    - ✘ (3) [Fails: no feedback], (4) [Fails: no deviations], (5) [Weak: beliefs ≈ bets], (6) [Fails: no adjustments]  
  - **Fractional Kelly (heuristic)**:  
    - ✔️ (4) [Partial: mimics deviations], (6) [Addresses superficially]  
    - ✘ (1) [Breaks: suboptimal growth], (2)/(3)/(5) [Unchanged from pure Kelly]  
  - **Standard EU + Risk Aversion**:  
    - ✔️ (3) [Handles via game theory], (4) [Explains Allais], (5) [Clear distinction]  
    - ✘ (1) [Fails: no ergodic optimum], (2) [Collapses to EU], (6) [Ad-hoc: no growth basis]  

  ---

  **Verdict: (1), (3), (5)**
