prompt: |-
  In my third-year philosophy of mind module, I have been assigned to lead a fifty-minute section for first-years on eliminative materialism about beliefs and desires, and I would like to work from a proper teaching plan rather than simply deliver the view as an explanation. My instinct is that certain things have to be in place before the thesis can even be stated without sounding merely perverse: in particular, the claim that our ordinary mental vocabulary—belief, desire, intention—is itself a theory about unobservable posits rather than a neutral description of what is given. Is that really the load-bearing first step, and what should be placed after it: the general idea that a theory's posits can be abandoned wholesale once a better theory arrives, or something else? And what should actually carry the hour? I am unsure whether to use a single worked example from the history of science, such as the abandonment of phlogiston or caloric fluid, or an example drawn from the students' own mental talk; whichever I choose, I would want to know what the carrying example must have and must not have if it is not to overstate the eliminativist's claim.

  I am equally worried about the misconceptions that will predictably form: that eliminativists think people are literally empty-headed, that the position is self-refuting because defending it uses belief-talk, and perhaps that it is a claim about the disappearance of conscious experience. My guess is that these need to be defused at different moments rather than all at once, but I do not trust my sense of the ordering. At what point in the sequence should each be headed off, and are there any I should deliberately let surface before answering? Finally, what should I openly say I am leaving out at this level, and what single question could I ask at the end to tell whether the students have understood the position rather than merely found it outrageous? I would be grateful if your answer were written in British English.
reasoning: |-
  Okay, let me unpack this user's query carefully. They're a third-year philosophy student tasked with teaching eliminative materialism to first-years, and they want to avoid simply lecturing. The core challenge seems to be structuring the session so the position doesn't sound absurd from the outset. 

  First, I notice they've identified a crucial barrier: students will instinctively treat "belief" and "desire" as self-evident rather than theoretical constructs. That's spot-on - if this isn't addressed first, eliminativism just sounds like nonsense. The user is right to make this the load-bearing step, but I wonder if they're underestimating how radical this feels. Maybe starting with an analogy from science would soften the landing.

  Hmm... phlogiston versus caloric? Phlogiston might be better - it's a clearer case of an abandoned theoretical entity, whereas caloric had some overlap with real heat concepts. But the user also considers using mental talk examples. Why not both? Start with phlogiston to establish the pattern, then apply it to psychology. That creates a bridge.

  Their concern about misconceptions is perceptive. The "empty-headed" thing always comes up - probably need to preempt that early when defining eliminativism. The self-refutation charge is trickier; that should wait until after explaining why folk psychology is a theory. And consciousness? Best to explicitly decouple that upfront since it's a common conflation.

  For structure... maybe 15 minutes on theory-theory, 20 on eliminativism's claims and examples, 10 on objections, 5 for Q&A? The "single question" at the end should test if they grasp that eliminativism targets theoretical constructs, not lived experience. Something like: "If eliminativism is right, what would become of sentences like 'I believe it's raining'?"

  Oh! And the user asked for British English. Must remember to use "s" spellings and avoid "folk psychology" becoming "pop psychology". Also their module is "third-year" not "junior year" etc. Small things but matter for credibility.

  What to explicitly omit? Probably the connection to neuroscience and Churchland's arguments - too advanced for first-years. Just establishing the conceptual possibility is enough. And definitely avoid qualia debates - that's a rabbit hole.

  Right, the plan should flow: start with what seems obvious (mental states), problematise it via theory-theory, show historical patterns of elimination, apply to psychology, then manage objections. The key is making theory-theory feel plausible before even mentioning eliminativism. That's the foundation everything else rests on.
answer: |-
  Here’s a structured teaching plan for your fifty-minute session on eliminative materialism, designed to build understanding sequentially, preempt misconceptions, and foster engagement. I’ll use British English throughout.

  ---

  ### **Session Structure & Timing**  
  *(Total: 50 mins)*  

  #### **1. Introduction: Mental Vocabulary as "Given"? (10 mins)**  
     - **Hook (2 mins):** Ask students: *"When you say, ‘I believe the library is open’ or ‘I want coffee’, are you describing a fact about your mind—or using a theory to explain yourself?"*  
     - **Core Point (8 mins):**  
       - Argue that **folk psychology** (belief/desire/intention talk) is *not* neutral but a **causal-explanatory framework**—a "theory" about how internal states (unobservables) drive behaviour.  
       - Use an analogy: "Folk physics" (e.g., "the sun sets") feels intuitive but was replaced by scientific theory.  
       - **Why this first?** If students treat "belief" as a brute fact (like "pain"), eliminativism sounds incoherent. Establish that folk psychology is *already* doing theoretical work.  

  #### **2. The Elimination Pattern in Science (12 mins)**  
     - **Worked Example: Phlogiston (8 mins):**  
       - Explain 18th-century chemistry: Phlogiston was posited to explain combustion (e.g., "wood loses phlogiston when burned").  
       - Contrast with oxygen theory: Lavoisier showed phlogiston was *misleading*—not just incomplete—and it was **eliminated**, not reduced.  
       - **Key nuance:** Emphasise that elimination happens when a theory’s *core posits* (e.g., phlogiston as substance) are **fundamentally mistaken**, not merely renamed.  
     - **Bridge to Psychology (4 mins):**  
       - *"Like ‘phlogiston’, could ‘beliefs’ be placeholders for something neuroscience might explain differently?"*  

  #### **3. Stating Eliminative Materialism (EM) (8 mins)**  
     - **Thesis (3 mins):**  
       - EM claims folk psychology is a *radically false theory*: beliefs/desires **don’t exist** as described, and future neuroscience will replace—not reduce—them.  
       - **Preempt Misconception 1:** "Empty-headedness"  
         - Clarify: *"EM isn’t denying inner life—it’s denying that folk psychology’s* specific *categories (beliefs/desires) map to reality. Brains process information, but not via ‘beliefs’."*  
     - **Why EM is Possible (5 mins):**  
       - Theories are abandoned when they’re **stagnant** (e.g., folk psychology’s failure to explain mental illness, creativity) and **incommensurable** with superior frameworks (e.g., cognitive neuroscience).  

  #### **4. Addressing Objections & Refinements (12 mins)**  
     - **Misconception 2: "EM is self-refuting!" (5 mins)**  
       - Objection: *"If you say ‘I believe EM’, you’re using belief-talk!"*  
       - Response: EM targets *folk psychology’s ontology*, not language. We can *use* "belief" pragmatically while denying it refers (e.g., "I’m deviled by pixies" uses empty terms).  
     - **Misconception 3: "Consciousness disappears!" (3 mins)**  
       - Reiterate: EM is about *propositional attitudes* (belief/desire), **not** qualia or raw sensation.  
     - **What EM Leaves Open (4 mins):**  
       - Explicitly omit: *Specific neuroscientific alternatives* (e.g., connectionism), *consciousness*, or *whether elimination is inevitable*. Focus on EM’s *conceptual possibility*.  

  #### **5. Consolidation & Critical Question (8 mins)**  
     - **Discussion (5 mins):**  
       - Pose: *"If EM is true, could we still say ‘Juliet desires Romeo’? What would change?"*  
       - Guide towards: Such statements might be seen as useful fictions (like "sunrise") or replaced by mechanistic descriptions.  
     - **Diagnostic Question (3 mins):**  
       - **Ask:** *"After today, could someone accept that brains process information while denying that ‘beliefs’ exist? Why/why not?"*  
       - **Why this works:** Tests if they grasp EM’s core—rejecting folk psychology’s *ontology* without denying cognition. If they focus on outrage ("but beliefs are obvious!"), revisit Step 1.  

  ---

  ### **Key Pedagogical Notes**  
  1. **Carrying Example:**  
     - Use **phlogiston** (not caloric). It’s a cleaner case:  
       - *Must show*: A posited entity abandoned because it misdescribed reality.  
       - *Must not imply*: All theories are false. Stress that EM targets folk psychology’s *specific failures* (explanatory gaps, stagnation).  
     - Later, link to a mental example: *"When we say ‘I changed my mind’, folk psychology treats ‘mind’ as an agent—but is it?"*  

  2. **Misconception Management:**  
     - **"Empty-headed"**: Defuse when stating EM (Step 3).  
     - **Self-refutation**: Address *after* establishing folk psychology as a theory (Step 4)—students need the tools to parse it.  
     - **Consciousness**: Preempt when defining EM’s scope (Step 3).  

  3. **What to Omit:**  
     - Say openly: *"We’re focusing on whether elimination is conceivable. We won’t resolve if neuroscience* will *replace folk psychology, or how consciousness fits in."*  

  4. **Delivery Tips:**  
     - **First-years need concrete hooks**: Anchor theory-theory in everyday examples ("Why did Sam storm out? ‘He believed you insulted him’ → a causal hypothesis!").  
     - **Let objections surface**: If "But beliefs *feel* real!" arises early, note it and return in Step 4 ("Folk psychology feels intuitive, but so did phlogiston!").  

  ---

  This sequence builds from intuition (Step 1) to historical parallel (Step 2), then to EM’s claim (Step 3), before tackling objections (Step 4). The diagnostic question targets the crux: distinguishing *elimination* from *reduction*. By grounding EM in theory-change, you sidestep initial charges of perversity and make its case testable. Good luck!
