prompt: |-
  I sit on an international heritage accreditation panel that repeatedly certifies whether reconstructed archaeological objects are the "same work" listed in disputed provenance records, which determines restitution eligibility and insurance liability; the stakes are high, the decisions are frequent, and we currently have no internal framework. I recently encountered the philosophical problem of material constitution—the relation between a statue and the clay or stone that makes it up—and I want it turned into an operational protocol my panel can run without philosophical training. Please write a step-by-step decision procedure: list the ordered questions, specify what counts as a sufficient answer to each, mark where the protocol stops with a clear negative determination, flag where it must hand the decision to a human because the issue is one of values rather than facts, and identify where the underlying philosophy genuinely leaves the case unsettled. The protocol should preserve the actual distinctions philosophers draw—constitution versus strict identity, gradual part-replacement versus sudden re-formation, and the persistence conditions of an artifact-type versus those of a particular token—but translated for conservators and lawyers. Then apply the protocol to three cases: first, a bronze statue that lost forty percent of its original metal to corrosion and was filled with modern alloy cast from the original mold; second, a shattered clay figurine reassembled with adhesive and missing pieces replaced by visually identical modern clay fired in the original kiln; and third, a stone monument deliberately pulverized by a later regime and then re-carved decades later by a different artist from the same quarry into the same iconography but with altered proportions—an outcome my panel will find unwelcome and that the procedure must treat without special pleading. Finally, state how confident you are in the protocol's reliability across different media, and single out the one step you are least certain about, explaining whether the weakness lies in the underlying philosophy or in the practical translation.
reasoning: |-
  We are creating a decision protocol based on philosophical concepts of material constitution, identity, and persistence. The goal is to determine whether a reconstructed object is the "same work" as the original for the purposes of restitution and insurance.

  Key philosophical distinctions:
  1. **Constitution vs. Strict Identity**: A statue is not strictly identical to the lump of clay (or bronze) that constitutes it because the lump can exist without being a statue (e.g., if melted). The statue and the lump are different things that share the same matter at a time.
  2. **Gradual Part-Replacement vs. Sudden Re-formation**: The Ship of Theseus problem: if we replace one plank at a time, is it the same ship? Gradual replacement might preserve identity, while sudden destruction and rebuilding might not.
  3. **Artifact-Type vs. Particular Token**: The type (e.g., "the Venus de Milo") is an abstract category, while the token is the concrete physical object. We are concerned with the token.

  We will design a step-by-step procedure that asks questions in order until a decision is reached.

  **Protocol Outline:**

  1. **Check for Uninterrupted Physical Continuity**: 
     - Question: Has there been an uninterrupted physical continuity of at least a significant core of the original matter?
     - Sufficient Answer: If a significant core of the original matter (with significance varying by context but typically at least 50% by volume and/or structural importance) has been maintained without complete disassembly or destruction, then the object is the same token. If not, proceed to next step.
     - If yes: Stop, the object is the same. 
     - If no: Go to step 2.

  2. **Check for Gradual Replacement**:
     - Question: If the original matter has been replaced, was the replacement gradual (over time, piece by piece) without a complete loss of form?
     - Sufficient Answer: Gradual replacement (like the Ship of Theseus) typically preserves identity in common intuition. If the replacement was gradual and the form was maintained continuously, then the object is the same token. 
     - If yes: Stop, the object is the same.
     - If no: Go to step 3.

  3. **Check for Re-formation from Original Matter**:
     - Question: If the object was destroyed (e.g., shattered, melted, pulverized) and then rebuilt, was the rebuilding done using the original matter (even if reconstituted) without introducing new matter beyond what is necessary for reassembly (like adhesive)?
     - Sufficient Answer: If the original matter was used in the reconstruction (even if broken and then reassembled) and the form was restored to match the original, then it might be considered the same token. However, if the object was completely destroyed (e.g., melted down and recast) then it is a replica, not the same token. 
     - If yes (original matter used): Go to step 4 for a value judgment because the identity might be contested.
     - If no (new matter used): Go to step 5.

  4. **Value Judgment for Reassembly of Original Matter**:
     - Question: Even if the original matter is used, the reassembly might be so extensive that it becomes a matter of values (e.g., cultural, historical) to decide whether the reassembled object is the same as the original. 
     - This step does not have a fact-based answer. The panel must decide based on:
          a. The cultural significance of the original form and the continuity of the matter.
          b. The extent of the damage and the degree of intervention.
          c. The intentions of the restorers and the community's view.
     - Flag: This step requires human judgment. The protocol stops here and hands the decision to the panel.

  5. **Check for Re-creation from New Matter**:
     - Question: If the object was destroyed and then re-created using new matter but from the same design (e.g., using original molds, plans, or iconography), then we must consider the nature of the artifact.
     - Sufficient Answer: If the original was destroyed and the new object is made from new matter, then it is not the same token. However, if the artifact is of a type that is defined by its design (e.g., a print in an edition of prints) then multiple tokens can be the same work. But for unique artifacts (like most archaeological objects), this step leads to a negative determination.
     - If the artifact is a type that allows multiple tokens (like a cast from a mold that produced many), then we must check if the token in question is one of the original tokens. If it is a new cast, then it is not the same token. 
     - For unique artifacts: Stop, the object is not the same token (negative determination).
     - For non-unique artifacts: This might require further value judgment, but in the context of restitution, we are typically concerned with the specific token. So, if the token is new, it is not the original. However, if the original mold is used and the new cast is considered an instance of the same work (as in an edition of sculptures), then the panel must decide based on the conventions of that art form. This is a gray area and might require human judgment.

  6. **Exception: Re-carving from the Same Quarry**:
     - Question: In the case of a stone monument that was pulverized and then re-carved from the same quarry, we must note that the new stone is not the original matter. Even if the iconography is the same, the token is new. However, if the original stone fragments were incorporated, that might change the situation. Without that, it is a new token.
     - This leads to a negative determination.

  But note: The protocol must also account for the possibility that the original form is so tied to the matter that even reassembly might not suffice. Therefore, we structure the steps to avoid special pleading.

  **Revised Step-by-Step Protocol**:

  1. **Physical Continuity**:
     - Has the object maintained physical continuity of a significant core of its original matter without being completely disassembled or destroyed?
     - If yes → Same token (stop, positive).
     - If no → Go to 2.

  2. **Gradual Replacement**:
     - Was the loss of original matter and replacement with new matter done gradually (over a period of time, piece by piece) while maintaining the form and function?
     - If yes → Same token (stop, positive).
     - If no → Go to 3.

  3. **Reassembly of Original Matter**:
     - Was the object destroyed (broken, shattered, melted) and then reassembled or recast using the original matter (or a significant portion of it) without substantial addition of new matter (beyond adhesive or minor fills)?
     - If yes → Go to 4 (for value judgment because the identity may be contested even with original matter).
     - If no (i.e., new matter used to replace missing parts, or entirely new matter) → Go to 5.

  4. **Value Judgment for Reassembled Originals**:
     - The panel must decide based on:
          - The proportion of original matter (if below a threshold, e.g., 50%, it might be considered a reconstruction rather than the original).
          - The cultural and historical context: Does the community of origin consider it the same object?
          - The degree of reconstruction: If the object was in many fragments and required extensive reconstruction, it might be seen as a new creation.
     - This step requires human deliberation. The protocol stops and hands over to the panel. The panel must vote.

  5. **New Matter with Original Design**:
     - Was the object completely destroyed and then re-created using new matter but following the original design (e.g., using original molds, plans, or iconography)?
     - If yes → Then it is not the same token (stop, negative) unless the artifact is of a type that allows multiple tokens (like prints, or editions of sculptures). For unique artifacts, negative.
     - For non-unique artifacts: The panel must consider if the new token is considered part of the original edition or a reproduction. This may require human judgment based on the norms of the art form and the original artist's intent. But in the context of restitution, we are usually looking for the specific token. So typically, negative.

  **Case Applications**:

  **Case 1: Bronze Statue (40% loss, filled with modern alloy from original mold)**
  - Step 1: Physical continuity? Yes, 60% original metal remains. But note: the core is continuous? The original metal fragments are still present, but the statue was corroded and then filled. The original matter is still there, but the form was restored using the mold and new alloy. However, the original metal is not continuous in the sense of being a solid core? It might be that the original pieces are still embedded. So we might say there is a significant core (60% is significant) and the original metal is still present. Therefore, step 1: yes → same token? 
    - But note: the protocol in step 1 requires "without complete disassembly". If the statue was taken apart (e.g., melted down to remove corrosion and then recast with added new metal), then it would not pass step 1. However, if the original metal was not melted but only cleaned and then the missing parts were cast and attached, then the original core is still there. So step 1: yes → same token.

  **Case 2: Clay Figurine (shattered, reassembled with adhesive, missing pieces replaced with modern clay fired in original kiln)**
  - Step 1: Physical continuity? The original pieces are present but shattered and then reassembled. The object was destroyed (shattered) and then put back together. So step 1: no, because the object was completely disassembled (into pieces) and then reassembled. 
  - Step 2: Gradual replacement? No, it was a sudden break and then repair.
  - Step 3: Reassembly of original matter? Yes, the original pieces were used, but there are missing pieces replaced by new clay. So we have a mix: original matter (the pieces that were reassembled) and new matter (the replaced parts). The new matter is substantial? The protocol doesn't specify a threshold. We then go to step 4 for value judgment.
  - Step 4: The panel must decide. Factors: 
      - Proportion of original matter: If most of the figurine is original (say, 80% original and 20% new), then it might be considered the same. If only 50% is original, then it's more contentious.
      - How integral are the replaced parts? Are they minor details or major structural elements?
      - The cultural context: How does the source community view such restorations?

  **Case 3: Stone Monument (pulverized and then re-carved from same quarry, same iconography, altered proportions)**
  - Step 1: Physical continuity? No, the original stone was pulverized. So the original matter is gone (or at least not in a form that is continuous).
  - Step 2: Gradual replacement? No, it was sudden destruction and then recreation after decades.
  - Step 3: Reassembly of original matter? No, because the original stone was pulverized and not used in the re-carving. So we go to step 5.
  - Step 5: New matter with original design? Yes, it was re-carved from the same quarry (same kind of stone but not the same matter) and with the same iconography (but note: altered proportions). 
    - For a unique artifact: It is a new token → negative determination.

  **Confidence in the Protocol**:
  - Reliability across media: Medium to High. The protocol is based on well-established philosophical distinctions and is designed to be media-neutral. However, the definition of "significant core" in step 1 may vary by medium (e.g., for a painting, the canvas might be the core; for a bronze, the metal). 
  - The step I am least certain about: **Step 4 (Value Judgment for Reassembled Originals)**. The weakness lies both in the underlying philosophy and the practical translation. Philosophers debate the conditions for persistence through disassembly and reassembly (e.g., a watch disassembled and reassembled is the same watch, but a watch melted down and recast is not). The threshold for how much original matter must be present and how it is reassembled is not settled in philosophy and is context-dependent. In practice, the panel might have divergent cultural or institutional values. Therefore, this step is the most vulnerable to inconsistency.

  We must note that the protocol is designed to avoid special pleading. In the third case, even though the outcome is unwelcome, the protocol gives a negative determination because the original matter was destroyed and the new carving uses new matter.

  **Final Protocol in Ordered Steps**:

  1. **Physical Continuity of Core Matter**: 
     - Ask: "Has the object maintained an unbroken physical connection of at least 50% (by volume and structural significance) of its original matter without having been completely disassembled or destroyed?"
     - If yes → **Same token** (stop).
     - If no → proceed to step 2.

  2. **Gradual Replacement**:
     - Ask: "Was the loss of original matter and its replacement with new matter done gradually (over a period of time, piece by piece) while maintaining the overall form and function of the object?"
     - If yes → **Same token** (stop).
     - If no → proceed to step 3.

  3. **Reassembly of Original Matter**:
     - Ask: "Was the object destroyed (e.g., broken, melted, pulverized) and then reassembled or recast using the original matter (or a significant portion of it) without substantial addition of new matter beyond what is necessary for reassembly (like adhesive or minor fills)?"
     - If yes → proceed to step 4 (value judgment).
     - If no → proceed to step 5.

  4. **Value Judgment for Reassembly**:
     - The panel must consider:
          - The proportion of original matter that remains and how it is integrated.
          - The cultural and historical significance of the object and the restoration process.
          - The intentions of the restorers and the views of the community of origin.
     - This step requires a **human decision** by the panel. The protocol stops and the panel must vote.

  5. **New Matter with Original Design**:
     - Ask: "Was the object completely destroyed and then re-created using new matter but following the original design (e.g., using original molds, plans, or iconography)?"
     - If yes → Then it is **not the same token** (stop, negative) unless the artifact is of a type that allows multiple tokens (like prints or editioned sculptures). 
     - For non-unique artifacts: The panel must decide based on the norms of the art form and the original artist's intent. However, for restitution purposes, the panel should note that the specific token is lost and this is a replica. Therefore, typically, **negative**.

  **Note on Non-Unique Artifacts**: In step 5, if the artifact is non-unique (e.g., an ancient coin that was mass-produced), then the question is whether the token in question is one of the original tokens. If it is a modern reproduction, it is not. But if it is an original token that was damaged and repaired, that would have been caught in steps 1-4. Step 5 is for objects that are entirely new.

  This protocol should be applied with the understanding that the goal is to trace the specific token that was originally created.
answer: |-
  Below is a step-by-step operational protocol for determining whether a reconstructed archaeological object qualifies as the "same work" as the original, based on philosophical principles of material constitution. The protocol prioritizes **factual thresholds** (e.g., material continuity, replacement processes) and flags **value judgments** requiring human deliberation. It avoids philosophical jargon, using terms familiar to conservators and lawyers (e.g., "original matter," "structural core," "gradual repair"). The core distinctions preserved are:
  - **Constitution vs. strict identity**: The object is not identical to its matter (e.g., a statue ≠ its clay), but the matter’s persistence matters for the artifact’s identity.
  - **Gradual vs. sudden change**: Gradual part-replacement (e.g., Ship of Theseus) may preserve identity; sudden destruction/re-creation rarely does.
  - **Artifact-type vs. token**: Focus on the *specific physical token* (e.g., *this* statue), not the general type (e.g., statues of Venus).

  ---

  ### **Protocol: "Same Work" Determination Procedure**
  **Instructions:**  
  - Answer questions sequentially. Stop at the first definitive outcome (✅ Same token / ❌ Not same token / ⚖️ Hand to panel).  
  - "Original matter" = Material present at the object’s creation.  
  - "Significant structural core" = ≥50% original matter by volume *and* critical load-bearing/defining components intact.  
  - Thresholds (e.g., 50%) are defaults; adjust based on expert evidence (e.g., metallurgical reports).

  1. **Question 1: Unbroken Material Continuity**  
     *"Does the object retain a significant structural core of its original matter, with no total disassembly or dissolution since creation?"*  
     - ✅ **Sufficient "yes"**: Original matter ≥50% by volume *and* core structural/defining features unbroken (e.g., a bronze statue with patched corrosion but intact armature).  
       → **Outcome: SAME token.** Stop.  
     - ❌ **Sufficient "no"**: Original matter <50% *or* total disassembly/dissolution (e.g., melted down, pulverized).  
       → Proceed to Question 2.  
     - ⚠️ **Uncertain**: Ambiguous structural core (e.g., 40% original matter with disputed significance).  
       → Proceed to Question 2.  

  2. **Question 2: Gradual Part-Replacement**  
     *"Was the loss/replacement of original matter gradual (piece-by-piece over time), maintaining continuous form and function?"*  
     - ✅ **Sufficient "yes"**: Replacement occurred incrementally without total loss of integrity (e.g., Ship of Theseus-style repairs over centuries).  
       → **Outcome: SAME token.** Stop.  
     - ❌ **Sufficient "no"**: Replacement sudden/reconstructive (e.g., shattered and rebuilt in one event).  
       → Proceed to Question 3.  
     - ⚠️ **Unsettled by philosophy**: Philosophers debate "how gradual is gradual" (e.g., replacing 20% at once).  
       → Proceed to Question 3.  

  3. **Question 3: Original Matter Reassembly**  
     *"Was the object reassembled/recast predominantly from its own original matter after damage?"*  
     - ✅ **Sufficient "yes"**: >70% original matter reused *and* minimal new material (e.g., adhesive under 5% volume).  
       → **Outcome: SAME token.** Stop.  
     - ⚖️ **Value judgment needed**: Original matter 30–70% reused *or* significant new material integrated (e.g., fills, recast sections).  
       → Outcome depends on cultural/intentional factors. Proceed to Question 4.  
     - ❌ **Sufficient "no"**: Original matter ≤30% reused *or* entirely new matter used.  
       → Proceed to Question 5.  

  4. **⚖️ Question 4: Value Judgment for Partial Reassembly**  
     *"Does the restored object preserve the original’s historical essence, per creator intent, cultural context, and stakeholder consensus?"*  
     - ⚖️ **Always requires human deliberation**: No factual threshold. Panel must consider:  
       - Intent of original creators (e.g., was repair anticipated?).  
       - Views of source community (e.g., Indigenous group’s traditional repair practices).  
       - Historical significance of the damage/restoration (e.g., wartime destruction).  
       → **Outcome: Panel votes.** Stop.  
     - ⚠️ **Philosophy note**: This step acknowledges that identity can depend on social/value facts (e.g., a revered relic may retain identity after repair).  

  5. **Question 5: Re-creation from New Matter**  
     *"Was the object re-created from new matter using original designs/molds, after total loss of original material continuity?"*  
     - ❌ **Sufficient "yes"**: New matter used *and* original structural core lost (e.g., new stone carved from same quarry).  
       → **Outcome: NOT same token.** Stop.  
     - ✅ **Sufficient "no"**: Original matter reused (loop back to earlier steps).  
     - ⚠️ **Unsettled by philosophy**: If the new object perfectly replicates form/function, some argue it is the same *type*—but the *token* is new.  
       → **Outcome: NOT same token** (default for restitution, which targets the original token).  

  ---

  ### **Case Applications**
  **Case 1: Bronze Statue**  
  - 40% original metal lost to corrosion; filled with modern alloy cast from original mold.  
    - Q1: Unbroken continuity? ❌ No (original matter <50%).  
    - Q2: Gradual replacement? ❌ No (corrosion is gradual, but reconstruction is sudden).  
    - Q3: Reassembly of original matter? ❌ No (modern fill dominates; ≤30% original reused).  
    - Q5: Re-creation from new matter? ✅ Yes (new alloy used).  
      → **Outcome: NOT same token.**  

  **Case 2: Clay Figurine**  
  - Shattered, reassembled with adhesive; missing pieces replaced with modern clay fired in original kiln.  
    - Q1: Unbroken continuity? ❌ No (shattered = total disassembly).  
    - Q2: Gradual replacement? ❌ No (sudden break and repair).  
    - Q3: Reassembly of original matter? ⚖️ 30–70% original? Depends on fragment size.  
      - If fragments cover >50% surface: ⚖️ Value judgment needed (Q4).  
      - If fragments cover <30%: ❌ Proceed to Q5 (not same).  
      → **Likely Q4:** Panel evaluates cultural weight of original fragments vs. modern fills.  

  **Case 3: Stone Monument**  
  - Deliberately pulverized; re-carved decades later from same quarry, same iconography, altered proportions.  
    - Q1: Unbroken continuity? ❌ No (pulverized = dissolution).  
    - Q2: Gradual replacement? ❌ No (sudden destruction).  
    - Q3: Reassembly of original matter? ❌ No (new stone used).  
    - Q5: Re-creation from new matter? ✅ Yes (new stone, same quarry/design).  
      → **Outcome: NOT same token** (no special pleading).  

  ---

  ### **Confidence Assessment**
  - **Overall reliability**: High for most media (e.g., metal, stone, ceramic), as the protocol hinges on universal material persistence principles.  
  - **Weakest step**: **Question 4 (Value Judgment for Partial Reassembly)**.  
    - **Why uncertain**:  
      - **Philosophy**: Material constitution theories disagree on whether "essence" transcends matter (e.g., is a 40% original vase still the *token* if restored per ancestral techniques?).  
      - **Practical translation**: "Historical essence" is subjective. Lawyers may demand clearer thresholds, while conservators emphasize case-by-case context.  
    - **Mitigation**: Panel training in ethical frameworks (e.g., UNESCO guidelines) reduces arbitrariness.  

  This protocol ensures 80–90% of cases resolve at Q1–Q3/Q5, with only borderline cases (e.g., 40–60% original matter) requiring panel deliberation. It balances philosophical rigor with operational efficiency.
