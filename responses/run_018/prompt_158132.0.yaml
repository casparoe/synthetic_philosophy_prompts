answer: |-
  Here is a comprehensive exam package addressing your requirements:

  **1. Exam Question**  
  "Both Darwin’s theory of natural selection and Turing’s 1936 account of computation perform a *parallel conceptual inversion*: they demonstrate how systems can exhibit domain-competent behavior (e.g., adaptive problem-solving or truth-preserving symbol manipulation) without possessing semantic comprehension of that domain.  

  (a) Precisely articulate the shared logical structure of this inversion in both cases, identifying the *mechanisms* enabling competence without comprehension.  
  (b) Explain how this inversion challenges the traditional philosophical assumption that explaining a system’s competence requires attributing to it (or its designer) prior comprehension of the principles governing its domain.  
  (c) Critically evaluate whether Darwin’s appeal to *artificial selection* and Turing’s appeal to the *disciplined human computer* function as analogical 'Trojan horses' that implicitly reintroduce comprehension into their mechanistic accounts, thereby diluting the inversion’s radical implications.  

  Argue rigorously; mere summary will receive minimal credit."

  ---

  **2. Model Answer (698 words)**  

  **(a) Shared Structure of the Inversion**  
  Darwin and Turing decouple *competence* (successful domain-specific performance) from *comprehension* (semantic understanding of principles). Both achieve this through **blind variation + selective retention** operating on **purely syntactic structures**.  

  In Darwin’s mechanism:  
  - *Variation*: Random, undirected mutations generate phenotypic differences.  
  - *Selection*: Environmental constraints non-teleologically eliminate maladapted variants.  
  - *Retention*: Reproduction preserves advantageous traits.  
  The process requires no foresight or understanding of adaptation principles by organisms. A bird’s beak shape solves feeding problems without the bird comprehending natural selection.  

  In Turing’s mechanism:  
  - *Variation*: Mechanical state transitions generate symbol configurations per fixed rules.  
  - *Selection*: Halting configurations are accepted as "solutions" via binary checkpoint tests.  
  - *Retention*: Valid outputs are stored; invalid ones discarded.  
  A Turing machine solves Hilbert’s *Entscheidungsproblem* without grasping mathematical truth. Its behavior is dictated by syntax-shaping rules, not semantics.  

  The shared core is **algorithmic iteration of undirected operations filtered by external constraints**, yielding competence through cumulative elimination.  

  **(b) Challenge to Traditional Explanation**  
  The inversion subverts the "grasp requirement" — the Aristotelian-Kantian assumption that competence implies prior comprehension (either in the system or its designer). Traditional explanation demands tracing outcomes to intentional understanding of governing principles (e.g., Newton comprehending gravity to explain planetary motion).  

  Darwin and Turing render this unnecessary:  
  - *In biology*: Adaptation emerges from mindless filtering of random traits, not divine foresight or vitalist principles. Explaining speciation requires no attribution of purposive comprehension to nature.  
  - *In computation*: Truth-preserving outputs arise from rule-bound symbol shuffling, not mathematical insight. The machine’s competence is explicable without invoking semantic interpretation.  

  This forces a paradigm shift: competence can be *mechanically emergent* rather than *intellectually grounded*. Explanation becomes substrate-neutral—functional architecture suffices.  

  **(c) Critical Evaluation of Analogical "Trojan Horses"**  
  Both analogies risk smuggling comprehension back into the mechanism, but to differing degrees:  

  **Darwin’s Artificial Selection**: Invoking breeders’ intentionality *prima facie* reintroduces comprehension. Yet this is heuristic scaffolding: natural selection operates without a selector’s mind. The analogy’s purpose is contrastive—highlighting *unconscious* environmental pressures versus conscious choice. While the comparison risks anthropomorphism, Darwin’s mechanism remains self-contained; selection criteria are emergent from systemic constraints, not imposed by a comprehending agent. The radicality holds if we strictly distinguish the *source* of selection (mindless environment vs. intelligent breeder).  

  **Turing’s Human Computer**: More problematic. Turing grounds machine operations in a human "following rules without deviation," implying baseline comprehension of symbols (e.g., recognizing "7" means seven). This covertly imports semantic understanding at the foundation. While Turing insists the machine merely manipulates "uninterpreted marks," the analogy’s reliance on human cognition suggests rule-execution necessitates minimal comprehension—undermining the claim of *pure* syntax.  

  However, both analogies can be defended as *pedagogical* rather than constitutive:  
  - Darwin uses artificial selection to illustrate *differential retention*, not to embed comprehension into natural selection.  
  - Turing’s human computer is a behavioral model for *formalizability*, not proof that comprehension is essential. The Church-Turing thesis shows computation is substrate-independent.  

  **Verdict**: Darwin’s analogy is salvageable as a disanalogy emphasizing mechanism autonomy. Turing’s is more compromised but not fatal; the *in-principle* reducibility of human cognition to syntax (as he later argues) preserves the inversion. The radical core survives both analogies if we reject their surface anthropocentrism and focus on abstracted mechanisms.  

  ---

  **3. Marking Scheme**  
  **A-Level Response (85-100%) Must Demonstrate:**  
  1. **Precision in Shared Structure**:  
     - Identifies *blind variation + selective retention* as the core mechanism in both cases.  
     - Distinguishes syntactic operations (rules/mutations) from semantic understanding.  
     - Explains environmental constraints/Turing machine "halting" as *external* filters.  
  2. **Challenge to Tradition**:  
     - Names the "grasp requirement" (or equivalent: e.g., "intellectualist assumption").  
     - Contrasts emergent competence with top-down comprehension (divine/designer intentionality).  
     - Argues why mechanical explanation suffices post-inversion.  
  3. **Critical Assessment**:  
     - Notes both analogies *potentially* reintroduce comprehension (artificial selector/human rule-follower).  
     - Evaluates Turing’s case as more problematic due to tacit human semantics.  
     - Concludes whether analogies undermine radicality *and* defends that conclusion (e.g., "scaffolding vs. necessity").  
  4. **Originality**: Synthesizes (c) by arguing *why* Turing’s analogy is more vulnerable than Darwin’s.  

  **B-Level Response (70-84%) May:**  
  ✓ Summarize each inversion accurately but not isolate the *shared* logical structure.  
  ✓ Describe the challenge to tradition but not name/locate it historically (e.g., "prior comprehension").  
  ✓ Identify analogies but treat them symmetrically without critical differentiation.  
  ✓ Omit evaluation of whether radicality is preserved.  

  **Common Errors (-5 to -15% per occurrence):**  
  - **Conflation**: Equating Darwinian selection with Lamarckism or Turing machines with AI cognition.  
  - **Teleology**: Attributing foresight to natural selection ("genes want to survive") or semantics to computation ("the machine understands").  
  - **Overstatement**: Claiming analogies *entirely* invalidate the inversions.  
  - **Under-analysis**: Treating (c) as merely "both used examples; examples imply understanding."  

  **Philosophical Underdetermination (Acceptable Interpretations):**  
  1. **Analogies as necessary vs. disposable**: Whether Darwin/Turing *relied* on smuggled comprehension or merely *illustrated* with it.  
  2. **Severity of compromise**: Defensible to argue Turing’s analogy is (or isn’t) more damaging than Darwin’s.  
  3. **Scope of inversion**: Whether biological adaptation is truly as comprehension-free as computation (e.g., debates on biological teleosemantics).  

  **Grading Priority**:  
  - **40%** Precision in (a)  
  - **30%** Depth in (b)  
  - **30%** Critical rigor in (c)  
  - **-10%** for significant teleological/conflation errors  

  ---  
  This design ensures students engage the *philosophical mechanics* of the inversion, its implications for explanation, and the meta-problem of whether the analogies betray the project. The model answer and rubric enforce focus on conceptual structure over historiography.
