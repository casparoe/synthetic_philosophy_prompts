prompt: |-
  i'm trying to get clear on something i heard in a podcast about the science of consciousness, and i'd love a careful take. the host summarised Dennett's heterophenomenology like this:

  "Heterophenomenology is Dennett's method for studying consciousness from the outside. Instead of trying to peer into someone's private experience, you treat the subject as an authority on their own mind: whatever they sincerely report about what they're experiencing gets recorded as an accurate description of their subjective world. The investigator then tries to explain why the subject produces those reports. Since the reports are treated as a kind of story the subject tells, heterophenomenology starts from the assumption that consciousness just is that story — there's no extra 'what it's like' beyond the narrated account. So the method is really Dennett's way of showing that science can do without subjective experience altogether, and by the end the first-person point of view has been explained away as a useful fiction."

  The host then said, "so heterophenomenology is basically the claim that consciousness is an illusion, and the data of the science of consciousness are just noises people make." Something about that feels like it's flattening a position into a slogan, but i can't quite put my finger on where the summary goes off, and maybe i'm the one misreading it.

  You're a philosopher of mind who works on this stuff. Before you go line by line, take a moment to lay out what heterophenomenology is actually meant to do as a method, what it's meant to stay neutral about, and where Dennett himself is more provocative. Then go through the quoted summary sentence by sentence and tell me what's fair, what's subtly wrong, what Dennett would object to, and whether the host's final gloss actually follows from the accurate parts. I dont need citations or a reading list, just the ideas. Please also separate the bits that are uncontroversial about the method from the bits where people who work on consciousness genuinely disagree — like whether the method is really neutral, and whether it quietly loads an illusionist conclusion. Dont present a contested reading as if it were the consensus. Please write in American English.
