prompt: |-
  Right, I'm putting together a module on that strange inversion Darwin and Turing both point to — competence without comprehension, reasoning turned upside down. I've sketched out five cases where the inversion shows up, and I want you to rank them in tiers according to how seriously they threaten our ordinary folk-psychological idea that intelligence needs understanding. Top tier: genuinely destabilising. Middle: interesting but containable. Bottom: not really an inversion, just a stretched metaphor.

  The cases are: (1) a Turing universal machine running chess code with zero grasp of the rules; (2) natural selection crafting the vertebrate eye with no visual awareness whatsoever; (3) a blindsight patient navigating round obstacles with no conscious visual experience; (4) an ant colony solving path-finding problems with no collective mind or behaviour that amounts to thought; and (5) a human calculator savant who produces correct answers instantly but cant articulate any method.

  But I want the savant treated separately — is it closer to Turing's machine (pure competence, comprehension absent) or closer to ordinary expert skill (competence that just hides comprehension we haven't accessed)? So give me your tier list with the first four in order, then place the savant in whichever tier it belongs, with a sentence for each saying why it lands there. Also, score Darwin's case and Turing's case out of ten on how radically they overturn our intuitions about intelligence — which one gets the higher score, and why? Please, no bibliographies or reading lists; I just want your reasoning bare. And dont worry about quoting anyone precisely — paraphrase is fine.
