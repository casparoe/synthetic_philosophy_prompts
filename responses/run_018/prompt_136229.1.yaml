  Here's a crack at it:

  So, imagine this wildly popular, Michelin-starred restaurant: "The Iron Wok." Never any wait times, the hot & sour soup is *always* perfectly balanced, and the tables are so clean you could eat off the floor (which someone probably does, efficiently). Customers are constantly raving: "Best mapo tofu I've ever had!" "Never any screaming toddlers here, bless the management!" "My retirement fund *doubled* since I started eating lunch here daily!" The Head Chef beams, taking a victory lap through the dining room, nodding at the glowing reviews plastered on the wall – reviews written *by* the customers *about* the food and service. He puffs his chest out and declares to the kitchen staff: "See? Proof positive! These ecstatic diners clearly *chose* me to run this place forever. Why would anyone ever need to *vote* for a chef when the Special Pork Buns are this consistently delicious? Their satisfaction *is* their ballot!" Meanwhile, the customers, busy complimenting the expedient noodle delivery, haven't actually *ordered* a new chef in... well, ever. They just showed up one day, found the food great and the place spotless, and figured complaining about the lack of a menu-vote might risk getting the chili oil ration cut. The Chef mistakes their full bellies and clean tables for a lifetime appointment signed in soy sauce.

  **Why it works (hopefully):**
  *   **Restaurant = State:** Prosperity (great food), Order (clean, efficient).
  *   **Satisfied Customers = Citizens:** Praising outcomes, enjoying stability.
  *   **Never Chose the Chef = Lack of Democratic Consent:** The core tension – they never hired him, they just found him there.
  *   **Chef's Logic = Performance Legitimacy Claim:** He conflates their appreciation of the *results* (full belly, clean table) with an endorsement of his *inherent right to rule indefinitely* ("chose me to run this place forever").
  *   **Punchline Twist:** Highlights the gap – satisfaction ≠ consent, efficiency ≠ rightful authority. The customers' passive acceptance (fear of losing benefits) isn't the same as active authorization.
  *   **Casual & Accessible:** Uses everyday concepts (restaurant, reviews, voting for a menu) without jargon. The "soy sauce" and "chili oil ration" bits add flavor (pun intended).
