answer: |-
  This is an exceptionally sharp observation of a recurrent manoeuvre in mechanism design debates. While no single established term perfectly captures the *entire* configuration you describe, the phenomenon is well-recognised and can be precisely defined. The most fitting label, drawing on methodology and argumentation theory, is **"Proof Scope Transference"** or more dynamically, **"Procedural Transference"**.

  **Definition of Procedural Transference:**
  *   **Core:** The illicit transfer of credibility from a formally proven property of an economic mechanism (e.g., static convergence to equilibrium) to a functionally distinct, unproven property (e.g., dynamic efficiency or adaptability), facilitated by shared mathematical formalism or institutional description, without adequate justification for the extension.
  *   **Requirements:** It necessitates:
      1.  **Shared Formal Apparatus:** A single mathematical procedure or institutional structure (e.g., Lange's tatonnement, a specific iterative algorithm) serves as the common object.
      2.  **Distinct Functional Claims:** Two claims are made about this apparatus: Claim A (e.g., static allocative efficiency under fixed conditions, formally proven) and Claim B (e.g., dynamic efficiency, innovation accommodation, unproven for the mechanism).
      3.  **Rhetorical Oscillation:** The proponent strategically shifts between emphasising Claim A or Claim B depending on the objection faced, exploiting the shared formalism to imply Claim B inherits Claim A's credibility, while retreating to the defensibility of Claim A when Claim B is directly challenged.
      4.  **Lack of Bridging Argument:** Critically, there is an *absence* of a rigorous argument demonstrating *how* the mechanism's proven properties under static assumptions (Claim A) logically entail or robustly generate the desired dynamic properties (Claim B) when those assumptions are violated.

  **Boundary Mapping and Distinctions:**

  1.  **vs. Scope Ambiguity:**
      *   **Ambiguity:** Involves genuine uncertainty or multiple interpretations about the *intended* scope of a single claim or term ("Does 'efficiency' here mean static or dynamic?"). The speaker may be unclear.
      *   **Transference:** Involves *distinct* claims (static proof vs. dynamic capability) deliberately presented under a unified banner. The speaker knows the difference but exploits the shared formalism contextually. The oscillation *itself* is the tell.

  2.  **vs. Defensive Qualification:**
      *   **Qualification:** Involves honestly adding limiting conditions to a claim when challenged ("The model assumes stable preferences; dynamics are a separate issue"). The qualified claim is then consistently held.
      *   **Transference:** The retreat ("only approximates current allocations") is sincere *in the moment of challenge* but is *abandoned* rhetorically once the pressure subsides, reverting to the broader implication. The qualification is tactical, not constitutive of the core argumentative thrust.

  3.  **vs. Popperian Strategic Retreat (Immunizing Stratagems):**
      *   **Popperian Retreat:** Focuses on modifying a *single* theory or hypothesis *post-hoc* (adding auxiliary assumptions, redefining terms) to evade falsification by specific counter-evidence.
      *   **Transference:** Involves switching between *two different functional claims* (static proof vs. dynamic capability) made about the *same procedural mechanism*. It's not modifying the core theory (the procedure) to save it from falsification; it's leveraging the procedure's proven strength in one domain to imply strength in another, distinct domain, without facing falsification *of the dynamic claim* because the retreat to the static claim is always available. The "immunity" comes from the procedural dual citizenship.

  4.  **Boundary Case - Shared Normative Vocabulary Only:**
      *   If the *only* shared element is a normative goal like "efficiency" or "optimality," without a shared formal procedure linking the static and dynamic arguments, this falls under **equivocation** or **vagueness exploitation**. The mechanism itself isn't the conduit for the transference. Procedural Transference requires the concrete mechanism as the bridge.

  5.  **Boundary Case - Shared Institutional Context Only:**
      *   If arguments about static allocation and dynamic adaptation refer to the same *type* of institution (e.g., "central planning board") but rely on *different, unrelated* mechanisms or models for each claim, this is simply presenting **two separate arguments** potentially guilty of overgeneralisation, but not Procedural Transference. The transference requires the *same specific procedure* being claimed to perform both functions.

  **Why "Procedural Transference" Fits Your Description Perfectly:**
  *   **Shared Formalism:** The iterative pricing algorithm (Lange's or modern) provides the concrete, shared procedural basis.
  *   **Distinct Claims:** Claim A = Convergence to static equilibrium under fixed conditions (proven). Claim B = Accommodating dynamic change (unproven for the mechanism).
  *   **Rhetorical Oscillation:** Against Hayekian knowledge problems: "See, the algorithm converges!" (Leverages Claim A's credibility). Against dynamic objections: "It just finds current efficiency; dynamics are handled elsewhere!" (Retreats to Claim A's scope). Then later: "Our planning *mechanism* efficiently handles change..." (Slides back to implying Claim B, borrowing Claim A's credibility via the shared procedure).
  *   **Lack of Bridge:** The critical missing element is a proof or robust model showing how the *iterative price-setting procedure itself* (not just "the system" abstractly) generates discovery, adapts to shifting functions, or induces innovation *as part of its convergence process* when those functions are unstable. The defender relies on the procedure's *form* implying capabilities beyond its proven *function*.

  This manoeuvre exploits the understandable desire for parsimony – using one elegant mechanism for multiple purposes. However, Procedural Transference occurs precisely when the burden of proof for extending the mechanism's *demonstrated* capabilities into a radically different domain (from static stability to dynamic flux) is evaded through rhetorical slippage enabled by the shared procedural description. The credibility *transfer* is the essence.
