answer: |-
  Based on dependency, tractability, error cost, and practical impact, here is the prioritized agenda with explicit justifications:

  **Upstream Priority 1: Conceptual Task of Epistemic Threshold (Q1)**  
  *Why:*  
  - **Foundational Dependency:** Resolution here is logically prior to Q2 (asymmetry), Q3 (institutions), and Q4 (non-elites). Without defining *what was accessible*, we cannot judge praise/blame asymmetry, design institutions, or extend the framework.  
  - **Tractability:** Philosophers can leverage existing work in moral epistemology, historiography, and contextualism. Historians provide empirical grounding through case studies (e.g., how abolitionist arguments circulated in Jefferson’s networks).  
  - **Error Cost:** Getting this wrong risks wholesale historical nihilism (if threshold is too high) or presentist condemnation (if too low). Undermines all subsequent applications.  

  **Upstream Priority 2: Institutional-Design Question (Q3)**  
  *Why:*  
  - **Practical Magnitude:** Directly shapes public memory (monuments, education, museums). Impacts social cohesion and historical literacy *now*.  
  - **Dependency:** While reliant on Q1, it forces concrete operationalization of abstract thresholds. Resolving Q1 without Q3 leaves scholarship inert; solving Q3 without Q1 is reckless.  
  - **Tractability:** Policy-makers can prototype label revisions or curricular guidelines using "provisional thresholds" while philosophers refine Q1. Real-world feedback loops are possible.  

  **Deprioritized: Asymmetry Problem (Q2)**  
  *Why:*  
  - **Downstream Dependency:** Requires Q1’s resolution to even frame "accessible moral advances."  
  - **Lower Stakes:** Praise asymmetry has fewer urgent institutional consequences than blame. Misjudging praise (e.g., overestimating Churchill’s progressivism) is less socially harmful than misjudging condemnation (e.g., erasing Jefferson’s slavery complicity).  
  - **Methodological Quicksand:** Deep disputes in moral psychology (praise/blame asymmetry) and historiography (identifying "unpopular" advances) make this intractable without Q1 solved.  

  **Deprioritized: Boundary-Condition Problem (Q4)**  
  *Why:*  
  - **Conceptual Dependency:** Cannot apply framework to non-elites without a robust Q1 definition. Premature focus risks anachronism or condescension.  
  - **Ornamental After Upstream Work:** If Q1 establishes granular thresholds (e.g., oral vs. literate dissent traditions), Q4 largely becomes an application exercise.  
  - **Empirical Hurdles:** Archives often silence non-elites. Reconstructing accessible moral resources for marginalized groups is speculative without Q1’s groundwork.  

  ---

  **Confidence & Uncertainty**  
  - **Confidence in Agenda:** **High (80%)**. The dependency logic is robust, and tractability/practicality assessments align with current scholarly capabilities.  
  - **Least Certain Claim:** The **tractability of Q1** (epistemic threshold). Defining "accessibility" requires synthesizing:  
    - *Empirical* data on historical information networks (e.g., did Jefferson *actively evade* abolitionist pamphlets?).  
    - *Normative* judgments about "reasonable" moral cognition in context (e.g., is rejecting slavery *obvious* if 90% of elites accept it?).  
    This risks either collapsing into hyper-contextual relativism or smuggling in presentist assumptions. My uncertainty lies in whether a *generalizable threshold* can escape this dilemma.  

  **Why This Ordering Unlocks Progress:**  
  Resolving Q1 transforms Q3 from polemic into policy: institutions can use calibrated thresholds to label monuments or revise curricula. Q2 and Q4 then become specialized refinements rather than foundational debates. Prioritizing Q1/Q3 forces collaboration: historians supply data on epistemic contexts, philosophers refine normative criteria, and policy-makers test implementations. This bridges theory and practice while containing error costs.
