  Okay, let me approach this like I'm advising a colleague over coffee. The user wants a 75-minute teaching plan on Scanlon's contractualism and the aggregation problem for law/econ grad students. They're clearly time-pressed (typing on phone between meetings) but deeply thoughtful - they've already identified key pitfalls like misreading "reasonable rejection" as personal annoyance. 

  First, the dependency chain: We absolutely must sever the Rawls/Hobbes association upfront. If we don't, they'll spend the whole session mentally force-fitting Scanlon into those frameworks. I'd do it right after hooking them with the rescue-boat case - maybe minute 5? The separation lands on three points: (1) No mutual advantage premise like Hobbes (2) No veil of ignorance device like Rawls (3) The "justification to each" standard is fundamentally different from calculating overall social benefit. This prevents the "social contract 2.0" misconception.

  For the carrying example, rescue-boat is perfect but needs surgical handling. Must emphasize: the five aren't a bloc - each has a distinct complaint about being left to drown. Key properties needed: identical individual stakes (so no "special duties" distractions), no quantity variables (avoiding subconscious math), and crucially - the one person doesn't have a stronger complaint than any single of the five. What it must lack: any phrasing like "net lives saved" or "greater good". 

  I see three predictable misconceptions forming in sequence: 
  1. "This is repackaged Rawls" (head off during the Hobbes/Rawls/Scanlon contrast at minute 5) 
  2. "Reasonable rejection = subjective anger" (crush immediately when defining principles - minute 15 - by contrasting "I don't like it" with "nobody could reasonably accept") 
  3. "We just aggregate the five complaints" (this is the core trap - deploy the modified rescue-boat at minute 35: what if saving five requires actively killing one? Suddenly the complaints aren't symmetrical anymore)

  For the end check, don't ask "what's the aggregation problem?" - that invites regurgitation. Instead: "In Scanlon's framework, why can't we decide the rescue-boat case by comparing the total rejection-strength of five versus one?" The right answer should mention the separateness of persons and justificatory individualism. 

  What to firmly exclude: Decision trees (they'll want to quantify "reasonableness"), full rule-utilitarian comparisons (that's next week's lecture), and definitely no algebra. This group will pounce on formalization attempts - shut that down gently but hard.
answer: |-
  Okay colleague, grabbing that metaphorical coffee – here’s how I’d structure that 75-minute gauntlet on Scanlon and the aggregation headache. It’s tight, but doable if you ruthlessly protect the core insight. Forget encyclopedia mode; we’re building conceptual scaffolding.

  **The Core Arc:** Justification → Reasonable Rejection → The Individualist Constraint → The Aggregation Wall → *Why* It’s a Problem (Not Just a Feature).

  **Brainstorming the Dependency Chain (Where things *must* land):**

  1.  **Ground Zero: "Justification-to-Each-Person" (Minutes 0-10)**
      *   **WHY FIRST?** If they don't grasp this *distinctive* starting point, *everything* collapses into utilitarianism or Hobbes/Rawls. "Reasonable rejection" becomes utterly meaningless noise.
      *   **SEPARATION POINT:** Hit this **immediately after stating the core question ("What do we owe to each other?")**. Don't even *say* "contractualism" until you've contrasted it.
      *   **Contrast Landing:**
          *   **Hobbes:** "Mutual Advantage." You justify rules because it's *better for you* than the state of nature. (Scanlon: Nope. It's about what *others* can reasonably demand of you, even if it *isn't* to your personal advantage in that moment).
          *   **Rawls:** "Veil of Ignorance." You justify rules based on what you'd choose if you didn't know *who* you'd be. (Scanlon: Nope. It's about justifying rules *to actual people*, knowing exactly who they are and what burdens they bear. The perspective is *post*-veil, addressing concrete individuals).
      *   **MISCONCEPTION PREVENTED:** "Reasonable rejection is just me saying 'This deal sucks for me personally!'" (Hobbesian) or "It's what I'd choose if I might be anyone" (Rawlsian). Scanlon is about what *no one* (situated in *their* position) could *reasonably* reject *as a basis for informed, unforced agreement*. It's interpersonal justification, not self-interest or hypothetical choice.

  2.  **The Engine: "Reasonable Rejection" Defined (Minutes 10-20)**
      *   **WHY NEXT?** You've established *to whom* we justify; now you define the *standard* of that justification.
      *   **KEY:** Contrast "Reasonable" vs. "Subjective Dislike."
          *   "Reasonable" = Grounded in the *generic reasons* any person in that position would have. It's not "I'm annoyed," but "Given the weight of this burden on my life/well-being, *no one* placed as I am could be expected to accept this principle allowing it, *unless* there's a sufficiently strong countervailing justification *to me*."
          *   **Head off Misconception #2 ("Subjective Anger") HERE:** Explicitly state: "Scanlon isn't interested in your personal grumpiness. He cares about whether the *generic burden* your position carries under a proposed principle gives you an *impersonal, objective reason* to reject it that others must acknowledge as valid *from your point of view*."

  3.  **The Crucial Constraint: The Individualist Proviso (Minute 20)**
      *   **WHY NOW?** Before any example, hammer home the rule: **You can only reject a principle based on *your own* burden under it.** You cannot reject it because of how it affects *others*, *even if those others are worse off*.
      *   **THE AGGREGATION PROBLEM STARTS HERE:** This is the bomb you're planting. Make it crystal clear: Scanlon forbids *adding together* the burdens of different people to create a "bigger" complaint against a principle. Each person's complaint stands alone. *This is what makes aggregation awkward/impossible later.*
      *   **Head off Misconception #3 ("Adding Up Complaints") PRE-EMPTIVELY:** Say it loud: "Remember: Under Scanlon's rules, the five drowning people *cannot* combine their complaints into one mega-complaint. Each must argue based *only* on *their own* impending death."

  **The Carrying Example: The Rescue Boat (Yes, It's Perfect - If Handled Right)**

  *   **The Case:** Boat can go to Site A (save 1 person) or Site B (save 5 people). All are strangers, equally deserving, drowning through no fault of their own. Time is critical; going to one means the others die.
  *   **Why It Works:**
      *   **Identical Individual Stakes:** Each drowning person faces the *exact same burden* if not saved: death. This is crucial for highlighting the aggregation issue without variable weights.
      *   **Distinct Complaints:** The complaint of Person A (at Site A) is "*I* will die." The complaint of Persons 1-5 (at Site B) is each "*I* will die." Five separate, identical "I will die" complaints.
      *   **No Hidden Math:** The choice is stark: save 1 vs. save 5. No probabilities, no varying quality of life, no "trading" – just lives.
      *   **Lacks Commodification:** The setup avoids implying lives are fungible units. It's about the *complaint each individual has* about being left to die.
  *   **Deploy It:** **Immediately after stating the Individualist Proviso (Minute 20)**. Pose the question: "Which principle for rescue boat operators could no one *reasonably* reject?" Let them wrestle briefly.

  **Walking Through the Aggregation Problem (Minutes 25-50)**

  1.  **The "Save the 1" Principle:** Person A cannot reasonably reject it (they get saved). But Persons 1-5 *each* have a *powerful* ground for reasonable rejection: "This principle leads to *my* death when saving me *instead of A* was possible." *Each* has an equally strong complaint as Person A would have under the "Save the 5" principle.
  2.  **The "Save the 5" Principle:** Persons 1-5 cannot reasonably reject it (they get saved). But Person A *does* have a ground for reasonable rejection: "This principle leads to *my* death when saving me *instead of the group* was possible."
  3.  **The Impasse (The Aggregation Wall):**
      *   Under the Individualist Proviso, we cannot say "The complaint of the five *together* is stronger than Person A's complaint alone." Scanlon's framework *forbids* adding them up.
      *   So, comparing principles:
          *   "Save the 1": Rejected by 5 individuals, each with a *maximally strong* complaint (death).
          *   "Save the 5": Rejected by 1 individual with a *maximally strong* complaint (death).
      *   **The Problem:** How do we decide *which principle is less rejectable*? Scanlon's framework, focused solely on individual burdens/complaints, lacks a clear metric. Person A's complaint is identical in *strength* to *each* of the five's complaints. How do you compare *one* person's death-complaint against *five separate* death-complaints *without aggregating*? That's the core awkwardness. The framework struggles to explain the intuitive pull of saving the five precisely *because* it prohibits the counting that intuition relies on.
      *   **Head off Misconception #3 ("Adding Up") EXPLICITLY HERE (Minute 35-40):** "I know your econ/law brains are screaming 'Just add them up! Five > One!' *But Scanlon's rules forbid that move.* The five complaints are five *separate* objections to the 'Save the 1' principle. We cannot combine them into one '5x' complaint. How, then, does the 'Save the 5' principle become uniquely justifiable *to each person*? That's the puzzle."

  **Nuance & Scope (Minutes 50-65)**

  *   **Scanlon's (Partial) Solution?** Briefly touch on how *intrapersonal* aggregation *might* work (e.g., saving one person from many smaller harms vs. saving another from one big harm), contrasting it sharply with the *interpersonal* aggregation problem in the rescue case. Emphasize this is where the *real* difficulty lies for his theory.
  *   **Why It Matters:** Connect back to law/econ – think non-commodifiable goods, rights that can't be traded off, the limits of CBA when individual claims are strong and separate (e.g., catastrophic risks, fundamental rights violations).

  **The End Check: The Revealing Question (Minutes 70-75)**

  *   **Ask:** "Okay, we intuitively think saving the five is right. But *within Scanlon's framework*, specifically because of the Individualist Proviso, **why is it conceptually difficult to explain *to Person A* why we chose a principle ('Save the 5') that leaves them to die, even though it saves five others?"**
  *   **What Reveals Grasp:** They must articulate:
      1.  Person A's complaint (death) is *identical in kind and strength* to the complaint of *each* of the five.
      2.  Scanlon forbids combining the five complaints into a single, stronger counterweight to Person A's complaint.
      3.  Therefore, justifying the choice *to Person A* cannot rely on the *number* saved elsewhere; it has to find a reason that speaks *specifically to why their death-complaint doesn't make the 'Save the 5' principle reasonably rejectable by them*, even though an identical complaint from any one of the five *would* make the 'Save the 1' principle rejectable. *That's* the aggregation problem – the framework struggles to account for numbers without aggregation.
  *   **Wrong Answers:** "Because five lives > one life" (violates proviso), "Because Person A should sacrifice themselves" (not Scanlonian), "Because it minimizes total rejection" (aggregation!).

  **What to Openly Refuse (Politely But Firmly):**

  1.  **Formal Decision-Theoretic Framing:** "I know some of you want to assign utilities or build a model. Resist that urge *today*. The point is precisely that Scanlon argues morality *isn't* reducible to that kind of calculation when individual justifications are paramount. We're exploring the *conceptual* barrier, not quantifying it." (Save the math for a critique session).
  2.  **Full Rule-Utilitarianism Comparison:** "Yes, Rule-Utilitarianism might *also* tell us to save the five, but it gets there by *aggregating expected outcomes*. Scanlon rejects that path. We're focusing on *why his alternative path hits this specific wall*. A deep dive into RU is for another day."
  3.  **Scanlon's Entire Corpus/All Possible Cases:** "We're laser-focused on *this* specific aggregation problem arising from the Individualist Proviso in life/death trade-offs. We won't resolve all of contractualism's challenges or explore every nuance of 'generic reasons' today."

  **The Flow (75 Min Punchlist):**

  *   (0-5) Hook: What do we owe to each other? The Rescue Boat intuition (save 5).
  *   (5-15) **Core Separation:** Justification-to-Each-Person ≠ Hobbes (advantage) ≠ Rawls (veil). Scanlon's core is addressing actual individuals.
  *   (15-20) **Reasonable Rejection Defined:** Generic reasons, burdens, objective standpoint. NOT subjective annoyance.
  *   (20) **The Bomb: Individualist Proviso** (Only *your* burden counts for *your* rejection).
  *   (20-25) **Rescue Boat Case Introduced:** Frame the principles.
  *   (25-40) **Walk Through Rejections:** Save 1 rejected by each of 5; Save 5 rejected by 1. **Highlight Impasse.**
  *   (40-50) **The Aggregation Wall Explained:** Why can't we add the five complaints? The proviso forbids it. The problem of comparing principles emerges.
  *   (50-65) **Nuance:** Intrapersonal vs. Interpersonal. Why this matters (law/econ relevance).
  *   (65-70) **Brief Scanlon Response?** (Optional, time-permitting: e.g., the "greater sacrifice" angle, but emphasize its limits here).
  *   (70-75) **The Check Question & Wrap:** Why is it hard to justify *to Person A*?

  **Coffee Cup Down.** This keeps you moving, forces engagement with the core tension, and constantly batters away the key misconceptions right where they arise. The Rescue Boat does the heavy lifting if you strictly enforce the Individualist Proviso. Good luck – it's a beast of a topic to teach well in 75 minutes, but this should get them grappling with the real philosophical knot. Let me know how it goes!
