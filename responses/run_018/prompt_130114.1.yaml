  ### Moral Perfection Workshop Game: "The Grid of Balance"

  #### **Materials per Participant**
  - **Grid Sheet**: One sheet with a 13x7 grid (13 rows, 7 columns). Rows are labeled 1–13 (no names), columns are "Mon" to "Sun".
  - **Tokens**: 21 small tokens (e.g., paper clips, beans) for effort allocation.
  - **Pencil**: To mark failures (X’s) on the grid.
  - **Round Summary Cards** (for debrief): Cards listing virtue names/definitions (hidden until reveal).

  ---

  ### **Game Rules**  
  **Objective**: Minimize failures (black X’s) across 13 traits over 7 days. Each trait is tracked daily.  
  **Mechanics**:  
  - You start each round (week) with **21 effort tokens** (3 tokens/day).  
  - Assign tokens to traits to avoid failures. **1 token per trait per day** (no stacking).  
  - **Hidden rules** create tradeoffs—effort in one trait may force failures elsewhere.  

  #### **Round 1-3 Procedure** (10 min per round)  
  1. **Plan Your Week**: Assign 3 tokens/day to the grid (e.g., place a token on "Trait 3, Wed").  
  2. **Trigger Tradeoffs**:  
     - **Rule A**: If you assign a token to **Trait 1 (Temperance)**, gain **+1 token** that day (place it anywhere *except* Trait 1).  
     - **Rule B**: If you assign a token to **Trait 2 (Silence)** or **Trait 3 (Order)**, you **must mark an X** on **Trait 13 (Humility)** that day.  
       *(Even if Trait 13 has a token!)*  
  3. **Mark Failures**:  
     - Mark an **X** for any trait-day with **no token**.  
     - Mark an **X** for Trait 13 if Rule B applies (supersedes tokens).  
     - *No failures* for token-assigned traits (unless overridden by Rule B).  
  4. **Reset**: Clear tokens after scoring. Repeat for Rounds 2–3 (new grid each round).  

  #### **Scoring**  
  - **-1 point** per X.  
  - **Goal**: Lowest score after 3 rounds. No prizes—this is about the experience!  

  ---

  ### **Debrief (15 min)**  
  **Step 1: Frustration Reflection**  
  - *Ask*: "How did you strategize? Did any tradeoffs surprise you? Why was Trait 13 especially hard?"  
  - *Validate*: Note common struggles (e.g., "I avoided Traits 2/3 but then failed them," or "Trait 1’s bonus wasn’t enough").  

  **Step 2: The Franklin Reveal**  
  - Distribute **virtue cards** with names/definitions:  
    1. **Temperance** ("Eat/drink moderately")  
    2. **Silence** ("Avoid trifling conversation")  
    3. **Order** ("Organize time/possessions")  
    4. Resolution  
    5. Frugality  
    ...  
    13. **Humility** ("Imitate Jesus and Socrates").  
  - **Context**: "This was Benjamin Franklin’s 1726 system. He ordered **Temperance first** because he believed self-control enabled the others. But he found **structural tensions**: Pushing Order/Silence (2/3) caused Humility (13) to collapse—*because rigid routines made him prideful*."  
  - **Quote Franklin**: "I was surprised to find myself so much fuller of faults than I had imagined... [Perfection] was never achieved."  

  **Step 3: Key Takeaways**  
  - **Tension**: Franklin’s system wasn’t a "habit tracker"—it exposed *philosophical tradeoffs*. Order requires self-assertion; Humility demands self-effacement.  
  - **Modern Parallels**: Apps optimize isolated habits, but life requires balancing *conflicting values* (e.g., ambition vs. contentment).  

  **Limitation Note**  
  - "We omitted Franklin’s **religious framing**: He saw virtues as imitating Christ’s perfection. Our game captures structural tensions, not his spiritual drive."  

  ---

  ### **Facilitation Notes**  
  - **Prep**: Print grid sheets (13x7) and virtue cards. Pre-bag tokens.  
  - **Timing**: Intro (5 min), Rounds 1–3 (30 min), Debrief (15 min). Total: 50 min.  
  - **Pacing**: Push groups to decide tokens quickly. Emphasize *silent* frustration during tradeoffs.  
  - **Magic Moment**: Watch faces when Trait 13 fails *despite* their effort—then link it to Franklin’s journals.  

  This game forces players into Franklin’s cognitive dissonance: **Systematic self-improvement can’t resolve moral paradoxes**. By the debrief, they’ll feel his centuries-old struggle in their bones.
