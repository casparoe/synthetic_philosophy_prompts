answer: |-
  ### Exam Question: Anthropic Reasoning and Cosmology (30 marks)  
  **Time Allowed:** 75 minutes total (aim for ~25 minutes on this question)  

  Cosmologists have narrowed down two theories about the universe, SPARSE and CROWDED, which agree on all observable physics. You know the following:  
  - **SPARSE**: Only one technological civilization exists (ours). Total observer-lives: \(10^{14}\).  
  - **CROWDED**: \(10^6\) causally isolated technological civilizations exist. Total observer-lives: \(10^{20}\).  
  - Priors for each theory are equal: \(P(\text{SPARSE}) = P(\text{CROWDED}) = 0.5\).  
  - In any civilization that develops astronomy, there are exactly \(10^8\) astronomer-lives (other observers are non-astronomers). Under CROWDED, only 1 in 1000 civilizations develops astronomy. Under SPARSE, our civilization develops astronomy.  

  **You wake up with amnesia** in a lab. A voice says: *"You are a random observer from all possible observer-lives in your civilization's history. You may or may not be an astronomer."* Later, you look at your lab coat: **"DR. ASTRONOMER"**.  

  **(a)** (8 marks)  
  (i) Calculate how your credence in CROWDED versus SPARSE updates **upon first waking** (before seeing the lab coat) under the **Self-Indication Assumption (SIA)**. Explain intuitively why SIA drives this shift.  
  (ii) Explain why the **Self-Sampling Assumption (SSA)** implies **no update** upon waking, using the definition of SSA.  

  **(b)** (10 marks)  
  After seeing **"DR. ASTRONOMER"** on your lab coat:  
  (i) Compute the **likelihood ratio** \(\frac{P(\text{I am astronomer} \mid \text{CROWDED})}{P(\text{I am astronomer} \mid \text{SPARSE})}\).  
  (ii) Calculate your **posterior odds** for CROWDED vs. SPARSE under **SIA** and under **SSA**. Show all steps.  

  **(c)** (6 marks)  
  SIA’s initial update (in part a) makes you near-certain of CROWDED *before* any empirical evidence. Is this a fatal flaw ("reductio") for SIA? Defend your view by:  
  - Evaluating whether SIA’s certainty is "presumptuous," and  
  - Comparing this to a *symmetric embarrassment* for SSA (e.g., from doomsday-style reasoning).  

  **(d)** (6 marks)  
  Both SIA and SSA face critiques about **reference classes**:  
  - For SSA, show how changing the reference class (e.g., sampling from *civilizations* instead of *observers*) **reverses or nullifies** its posterior from (b).  
  - For SIA, explain how it avoids reference-class dependence but faces a **different catastrophe** (e.g., with infinite universes). Can either be fixed?  

  ---

  ### Model Answer (≈600 words)  
  **(a)**  
  (i) Under SIA, we weight hypotheses by the number of observers. The prior odds ratio is \( \frac{P(\text{CROWDED})}{P(\text{SPARSE})} = 1 \). SIA updates this by the ratio of total observers:  
  \[
  \text{Posterior odds} = \frac{P(\text{CROWDED})}{P(\text{SPARSE})} \times \frac{N_{\text{CROWDED}}}{N_{\text{SPARSE}}} = 1 \times \frac{10^{20}}{10^{14}} = 10^6.  
  \]  
  Thus, SIA shifts odds to \(10^6\!:\!1\) for CROWDED. Intuitively: SIA treats "I exist" as evidence favoring worlds with more observers.  

  (ii) SSA samples uniformly from all *actual* observers in one’s reference class. Upon waking, you learn no *new* indexical information (you already knew you *could* exist). Thus, SSA applies no update—the priors remain 1:1.  

  **(b)**  
  (i) **Likelihoods**:  
  - Under SPARSE: Total observers = \(10^{14}\), astronomers = \(10^8\) → \(P(\text{I am astronomer} \mid \text{SPARSE}) = \frac{10^8}{10^{14}} = 10^{-6}\).  
  - Under CROWDED: Only \(10^6 / 1000 = 10^3\) civilizations have astronomy. Total astronomers = \(10^3 \times 10^8 = 10^{11}\). Total observers = \(10^{20}\) → \(P(\text{I am astronomer} \mid \text{CROWDED}) = \frac{10^{11}}{10^{20}} = 10^{-9}\).  
  Likelihood ratio: \(\frac{P(\text{astro} \mid \text{C})}{P(\text{astro} \mid \text{S})} = \frac{10^{-9}}{10^{-6}} = 10^{-3}\).  

  (ii) **Posterior odds**:  
  - **SIA**: Starts from posterior odds \(10^6\!:\!1\) for C vs S after existence update. Multiply by likelihood ratio:  
  \[
  \text{New odds} = 10^6 \times 10^{-3} = 10^3 = 1000\!:\!1 \ \text{(favoring CROWDED)}.
  \]  
  - **SSA**: Starts from prior odds 1:1. Multiply by same likelihood ratio:  
  \[
  \text{New odds} = 1 \times 10^{-3} = 1\!:\!1000 \ \text{(favoring SPARSE)}.
  \]  

  **(c)** SIA’s armchair certainty in CROWDED is *not* a unique reductio. While it seems "presumptuous" to favor vast universes without evidence, SSA has a symmetric flaw: in doomsday arguments, SSA uses your birth rank to favor imminent human extinction, which is equally armchair and counterintuitive. Rejecting SIA solely for "presumption" inconsistently excuses SSA’s equivalent leaps. A principled stance must either accept both quirks or seek a third way.  

  **(d)**  
  - **SSA’s reference-class sensitivity**: If we sample from *civilizations* (not observers):  
    - \(P(\text{I am astronomer} \mid \text{SPARSE}) = 1\) (only one civ, which has astronomy).  
    - \(P(\text{I am astronomer} \mid \text{CROWDED}) = \frac{10^3}{10^6} = 10^{-3}\) (only 1/1000 civs have astronomy).  
    Likelihood ratio = \(10^{-3}/1 = 10^{-3}\) → SSA posterior odds = \(1 \times 10^{-3} = 1\!:\!1000\) for CROWDED—**reversing** (b)’s result. With observer-sampling, SSA favored SPARSE; with civilization-sampling, it favors CROWDED. This arbitrariness undermines SSA.  
  - **SIA** avoids reference classes by weighting by observers, but in infinite universes, probabilities vanish (e.g., if \(N_{\text{CROWDED}} = \infty\)). Fixes like the *Self-Indication Assumption Maximal (SIA-max)* restrict to finite worlds, but ad hocly. Neither escapes trouble cleanly.  

  ---

  ### Marking Scheme (30 marks total)  
  | **Must-Hit Move**                                                                 | **Marks** | **Common Pitfalls**                                                                 |  
  |-----------------------------------------------------------------------------------|-----------|-------------------------------------------------------------------------------------|  
  | **(a)(i)** Correct SIA odds shift to \(10^6\!:\!1\) + clear intuitive explanation. | 4         | Omits ratio math; claims SIA "updates on existence" without showing \(N_C/N_S\).    |  
  | **(a)(ii)** Correctly explains SSA gives no update due to no new indexical info.  | 4         | Confuses SSA with "no indexical evidence possible" (stronger claim).                |  
  | **(b)(i)** Correct likelihood ratio \(10^{-3}\) via astronomer fractions.        | 5         | Uses total astronomers incorrectly (e.g., ignores SPARSE’s \(10^8\) astronomers). |  
  | **(b)(ii)** Correct SIA (1000:1 for C) and SSA (1:1000 for C) posteriors.         | 5         | Applies likelihood ratio to wrong prior (e.g., uses SIA prior for SSA).             |  
  | **(c)** Notes SIA’s "presumption" but counters with SSA’s doomsday symmetry.      | 3         | Calls SIA flawed without addressing SSA’s equivalent issue.                        |  
  | **(d)** Shows SSA’s flip with civilization-sampling; notes SIA’s infinity problem.| 6         | Misses SSA reversal; vague on SIA’s catastrophe.                                    |  
  | **Clarity, notation, sig figs**                                                   | 3         | Sloppy math, missing units (\(10^x\)), or incoherent explanations.                  |  

  **Typical Errors**:  
  - In (b), students often assume SPARSE has *all* \(10^{14}\) observers as astronomers.  
  - In SSA updates, they conflate priors (e.g., apply SIA-adjusted odds to SSA).  
  - In (d), they claim SSA "doesn’t depend on reference classes" or ignore infinity for SIA.
