  I was just arguing with my friend about Avatar (the blue aliens one from 2009, not the cartoon) after we watched it for this philosophy club I go to. I'm writting a thing for a class on cultural relativism and I want to read the movie through Montaigne's cannibal essay—the one where he says the Brazilian cannibals he describes aren't the real barbarians, Europeans tearing each other apart in religious wars are way worse, and we should question whether we can judge other customs at all. But I don't want to just say Avatar is the same idea with aliens.

  So here's what I'm stuck on. Montaigne uses cannibalism as this shock move to flip the mirror on European cruelty, but he doesn't romanticize them either—he says their customs are different, not inferior, and asks if we're just blind to our own violence. Avatar has Jake joining the Na'vi and the humans being the destructive colonizers with that tree-destroying scene. I want to know where that maps onto Montaigne: does the film actually do the self-criticism part, or does it just invert the barbarian label without asking us to examine our own culture? There's also that ritual where the Na'vi kill animals respectfully—does that relate to Montaigne comparing cannibalism to European execution methods, like different moral economies of violence? Or is it just aestheticizing the primitive to make it palatable?

  I'm also confused about whether Montaigne is doing epistemic humility (we can't know) or actual moral inversion (they're better). Avatar seems to do the second—Na'vi are morally superior, not just different. So where does the idea illuminate the movie, like in the military vs nature scenes, and where does the movie resist it? Is Jake's conversion actually relativism or just a conversion narrative? Keep it tight—max 300 words, and please don't go over 350 words total. I need this for a discussion post tomorrow.
