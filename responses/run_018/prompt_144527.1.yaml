answer: |-
  Here's a concise analysis mapping Avatar onto Montaigne's "Of Cannibals":

  **Montaigne's Core:** He uses cannibalism *not* to claim Indigenous superiority, but to shock Europeans into recognizing their *own* greater barbarity (religious wars, torture) and question their cultural arrogance ("epistemic humility"). It's relativism as mirror, not inversion.

  **Avatar's Alignment:**
  1.  **Inverted Barbarism:** Like Montaigne flipping "barbarian," Avatar explicitly labels the humans (especially Quaritch) as "sky people" destroyers, contrasting their mechanized, extractive violence (tree destruction) with Na'vi ecological harmony.
  2.  **Violence & Ritual:** The respectful animal killing ritual *directly parallels* Montaigne's point. He argued Indigenous execution/cannibalism was *less cruel* than European torture methods. The Na'vi ritual shows a "moral economy" where violence has spiritual purpose and respect, contrasting human wanton destruction. This isn't *just* aesthetic; it critiques the *nature* of human violence.

  **Avatar's Divergence:**
  1.  **Lack of Self-Critique/Mirror:** Montaigne forces Europeans to *see themselves*. Avatar offers little self-reflection for the *viewer's* culture. Humans are unambiguous villains; Na'vi are idealized, ecologically perfect noble savages. It *inverts* the moral hierarchy ("they're better") rather than prompting relativist questioning *of ourselves*.
  2.  **Jake's Arc:** His conversion isn't relativism (accepting difference without judgment). It's a *rejection* of human values as inherently corrupt and an *embrace* of Na'vi values as objectively superior. It's absolutist, not relativist.

  **Conclusion:** Avatar effectively uses Montaigne's strategy of *inverting the "barbarian" label* and comparing violence (ritual vs. destructive) to critique colonialism. However, it resists his core relativism and epistemic humility by presenting the Na'vi as morally superior archetypes, not just different, and failing to turn the critical mirror meaningfully onto the audience/viewer's own societal violence. It's moral inversion, not self-reflective relativism.

