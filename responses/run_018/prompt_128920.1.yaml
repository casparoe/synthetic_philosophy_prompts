prompt: |-
  I run a small philosophy seminar for final-year undergrads, about eight people, one 70-minute session. We’ve covered basic metaethics but not in loads of detail. I want a runnable in-class game that makes them feel the Frege-Geach problem for expressivism in their bones, not just on paper. The tension is that moral sentences express an attitude like disapproval, but embed them in an ‘if’ or ‘not’ and that attitude seems to vanish — yet we still run modus ponens over them. I was arguing with my flatmate about this last night and she thinks expressivism is obviously true, so I want the activity to be a bit in the weeds: split the group into two teams, one using pure expressivism and one using a hybrid strategy where embedded moral sentences do semantic ascent and merely mention the attitude rather than expressing it. Give me rules, roles, materials, and a consistency/payoff scheme that needs no real money — maybe coherence points versus expressive-force points. Use a concrete scenario like lying to protect a friend. They should have attitude cards (red for disapproval, green for approval) that can only be played in unembedded assertoric slots; in embedded positions they must write on a neutral ‘mention card’ instead. Have them build a chain of reasoning and discover the breakdown themselves. Include a timeline, a debrief that maps each moment onto Frege’s idea of assertoric force and Geach’s embedding objection, and an honest note on which feature the game can’t reproduce — probably the precise content-force distinction in Frege’s original account. Also tell me what will predictably go wrong the first time — I imagine someone cheats by playing a card in an embedded slot — and how to handle it. Write everything in British English please, and don’t include a bibliography or reading list, just the design. Fianlly, keep it niche enough that it’s not the standard classroom demo everyone has seen.
reasoning: |-
  We are designing an in-class game to illustrate the Frege-Geach problem for expressivism. The game will have two teams: one using pure expressivism and one using a hybrid strategy (with semantic ascent for embedded contexts). We'll use a concrete scenario about lying to protect a friend.

  **Core Idea:**
  - Expressivism: Moral sentences express non-cognitive attitudes (e.g., approval/disapproval).
  - Frege-Geach Problem: When moral sentences are embedded (e.g., in conditionals or negations), they don't seem to express the attitude, but we still use them in logical inferences (like modus ponens).

  **Game Setup:**
  - **Scenario:** "Lying to protect a friend from bullying is wrong." We'll have a chain of reasoning that uses modus ponens with a conditional that has a moral antecedent.
  - **Example Chain:**
    1. If lying to protect a friend from bullying is wrong, then we ought not to do it.
    2. Lying to protect a friend from bullying is wrong.
    3. Therefore, we ought not to do it.

  In step 1, the antecedent is embedded (in the conditional). In step 2, it's asserted. Step 3 is the conclusion.

  **Materials:**
  - **Attitude Cards:** 
    - Red: Disapproval (for moral wrongness)
    - Green: Approval (for moral rightness, if needed)
    - Each card has the attitude and a space to write the specific content (e.g., "Disapproval of lying to protect a friend").
  - **Mention Cards:** 
    - Neutral (white) cards with "Mention: " followed by a blank. These are for writing the content of the attitude without expressing it. E.g., "Mention: Disapproval of lying to protect a friend".
  - **Whiteboard or Large Paper:** To build the chain of reasoning as the game progresses.
  - **Markers:** For writing on the whiteboard and on the cards.

  **Teams:**
  - **Team Expressivism (Pure):** They must express attitudes only in unembedded assertoric contexts. In embedded contexts, they are stuck because they cannot express an attitude there, but they also cannot use a mention card (as per pure expressivism, they don't have semantic ascent). So they must either avoid embedding or face a breakdown.
  - **Team Hybrid:** They use semantic ascent in embedded contexts. So in embedded positions, they use a mention card to represent the attitude being mentioned (not expressed). In unembedded contexts, they use attitude cards.

  **Rules:**
  1. The game is played in rounds. Each team will build the same chain of reasoning (the modus ponens example above) but following their own rules.
  2. The chain must be built step by step. Each step must be written on the board and accompanied by the appropriate card (attitude card for unembedded assertions, mention card for embedded contexts).
  3. **Scoring:**
     - **Coherence Points:** Awarded for logical consistency and successful inference. Each valid step in the reasoning chain earns 1 point. If the chain leads to a conclusion that is consistent with the premises, they get an extra 2 points.
     - **Expressivist Points:** Awarded for properly expressing attitudes (for Team Expressivism) or for properly handling expression and mention (for Team Hybrid). 
       - For Team Expressivism: They get 1 point for every attitude card played in an unembedded context. They get 0 for an embedded context because they cannot express an attitude there and they are not allowed to use a mention card. If they are forced to put a card in an embedded context, they get -1 (because it's a mistake).
       - For Team Hybrid: They get 1 point for every attitude card in an unembedded context and 1 point for every mention card in an embedded context (because they are correctly using semantic ascent). They get -1 if they use an attitude card in an embedded context or a mention card in an unembedded context.
  4. **Gameplay:**
     - Round 1: Building the conditional premise (embedded context).
     - Round 2: Asserting the antecedent (unembedded).
     - Round 3: Drawing the conclusion (unembedded).

  **Detailed Steps:**
  - **Round 1 (Conditional Premise):**
    - The conditional: "If lying to protect a friend from bullying is wrong, then we ought not to do it."
    - The antecedent ("lying to protect a friend from bullying is wrong") is embedded.
    - Team Expressivism: They must represent the antecedent without an attitude. But they don't have a mechanism for that. They might try to write the whole conditional without any card for the antecedent, or they might put a red card (which would be wrong because it's embedded). This causes a problem. They get -1 for using a card in an embedded slot (if they do) and 0 for the step (because they haven't expressed the attitude in the antecedent, so the conditional isn't built properly). They get 0 coherence points because the conditional isn't properly formed.
    - Team Hybrid: They use a mention card for the antecedent. They write: "Mention: Disapproval of lying to protect a friend". Then they write the conditional: "If [mention card content], then we ought not to do it." They get 1 expressivist point for the mention card and 1 coherence point for the step.

  - **Round 2 (Asserting the Antecedent):**
    - The assertion: "Lying to protect a friend from bullying is wrong."
    - Unembedded context.
    - Team Expressivism: They play a red card (disapproval) with the content. They get 1 expressivist point and 1 coherence point.
    - Team Hybrid: They play a red card (disapproval) with the content. They get 1 expressivist point and 1 coherence point.

  - **Round 3 (Conclusion):**
    - The conclusion: "Therefore, we ought not to do it."
    - Unembedded context. This is a non-moral prescription? Or we can treat it as expressing an attitude (disapproval of the act). Alternatively, we can have a moral conclusion that requires an attitude. Let's make it: "Therefore, we ought not to lie to protect a friend from bullying." 
    - Both teams must now draw the conclusion. But for the inference to work, the conditional must have been properly formed.
    - Team Expressivism: They have a problem because in Round 1, they couldn't form the conditional properly. So they cannot run modus ponens. They might still assert the conclusion with a red card, but without a valid inference, they get 0 coherence points for the step. They get 1 expressivist point for the attitude card in the conclusion.
    - Team Hybrid: They have a valid conditional and an assertion of the antecedent. They can write the conclusion and play a red card. They get 1 expressivist point and 1 coherence point. Plus, they get 2 bonus coherence points for a consistent chain.

  **Timeline:**
  - Introduction (5 mins): Explain the scenario and the rules. Split into two teams (4 each). Assign roles: each team has a card player (plays the cards), a writer (writes on the board), a logician (checks the reasoning), and an expressivism enforcer (ensures the expressivist rules are followed).
  - Round 1 (15 mins): Teams build the conditional premise. They must write it on the board and use the appropriate card(s). The facilitator (you) checks and awards points.
  - Round 2 (10 mins): Teams assert the antecedent. Write and play card. Points awarded.
  - Round 3 (15 mins): Teams derive the conclusion. Points awarded for the step and for overall coherence.
  - Debrief (20 mins): Discuss what happened. Map to Frege-Geach.

  **Debrief:**
  1. **Frege's Assertoric Force:** In unembedded contexts, we assert with force (express an attitude). In embedded contexts, the force is absent. The game showed that Team Expressivism couldn't embed without losing the attitude, but then the conditional didn't work for inference.
  2. **Geach's Embedding Objection:** We use moral sentences in embedded contexts and reason with them. Team Hybrid used semantic ascent to solve the embedding, but then note: the conditional premise for them was about the attitude (they mentioned it) and then they expressed the attitude in the antecedent. But then modus ponens works because the conditional is a descriptive statement about the attitude? This leads to the problem that the conclusion is now an expression of attitude, but the conditional premise was descriptive. Is that consistent? (This is a deeper point for discussion.)
  3. **What the Game Can't Capture:** Frege's original content-force distinction is more nuanced. The game simplifies by having attitude cards (force) and mention cards (content). But in Frege, the content (sense) is the same in embedded and unembedded contexts, and the force is added in assertion. The game can't fully model the idea that the same content can be used in both contexts.

  **Predictable Problems:**
  - **Cheating:** Someone plays an attitude card in an embedded slot. How to handle: As facilitator, watch and enforce the rules. If they do it, deduct points and explain why it breaks expressivism (it would be expressing an attitude in a context where it doesn't make sense, e.g., in the antecedent of a conditional).
  - **Confusion:** The hybrid team might get confused about when to use a mention card. Solution: Have a quick practice round with a simpler example.
  - **Time:** The game might run over. Solution: Keep strict time and be ready to jump in and guide.

  **Final Notes:**
  - This game is designed to be niche by focusing on the specific mechanics of card-playing for expression and mention, and by having two distinct strategies to compare.
  - Use British English: "behaviour", "colour", "modus ponens", "premiss" (though 'premise' is also acceptable), etc.

  Let me know if you need any adjustments.
answer: |-
  Here’s a complete design for an in-class game to visceralise the Frege-Geach problem for expressivism, using your lying-to-protect-a-friend scenario. It’s structured for a 70-minute session with eight students, split into two teams (Pure Expressivists vs. Hybrid Theorists). The game forces students to confront how attitudinal expression breaks down under embedding, using physical cards to model assertoric force.

  ---

  ### **Game Summary**
  - **Core tension:** Pure expressivists can’t embed attitudes in conditionals/negations without losing expressive force, causing modus ponens to fail. Hybrid theorists use semantic ascent (mentioning attitudes) in embeddings to rescue logic, but at the cost of "attitudinal detachment".
  - **Mechanics:** Teams build a modus ponens chain. Unembedded assertions require playing **attitude cards** (red/green) to *express* approval/disapproval. Embedded positions (e.g., in an "if" clause) require **mention cards** (neutral) to *describe* the attitude. Points track logical coherence vs. expressive fidelity.
  - **Scenario:** "Lying to protect a friend from bullies is wrong."  
    Chain:  
    (1) *If lying to protect a friend is wrong, then telling the truth is obligatory.*  
    (2) *Lying to protect a friend is wrong.*  
    (3) *Therefore, telling the truth is obligatory.*  

  ---

  ### **Materials & Prep**  
  - **Cards (A5 size, pre-made):**  
    - **Attitude cards:** 5 red ("Disapproval of [action]"), 5 green ("Approval of [action]").  
    - **Mention cards:** 10 blank white cards labelled "MENTION: [blank]".  
    - **Action cards:** 4 cards defining slots (laminated):  
      - "IF [CLAUSE], THEN [CLAUSE]" (embedded + unembedded)  
      - "NOT [CLAUSE]" (embedded)  
      - "ASSERT: [CLAUSE]" (unembedded)  
      - "THEREFORE: [CLAUSE]" (unembedded)  
  - **Other:** Whiteboard (to map reasoning chains), markers, sticky tape, team handouts (rules summary).  
  - **Team split:** 4 Pure Expressivists (PE), 4 Hybrid Theorists (HT). Roles per team:  
    - **Card Master:** Plays cards in correct slots.  
    - **Scribe:** Writes the sentence on the board using card content.  
    - **Enforcer:** Ensures rules are followed (e.g., no attitude cards in embedded slots).  
    - **Advocate:** Explains the team’s reasoning during debrief.  

  ---

  ### **Rules**  
  1. **Building the chain:** Teams assemble the 3-step modus ponens chain in order. Each step must use an action card to frame the clause.  
  2. **Card rules:**  
     - **Pure Expressivists (PE):**  
       - Unembedded slots (e.g., "ASSERT", "THEREFORE"): **Must** use attitude cards (red/green).  
       - Embedded slots (e.g., "IF", "NOT"): **Cannot** use attitude cards. They must write the moral clause *without* expressing attitude (e.g., "lying is wrong" with no card). **No mention cards allowed.**  
     - **Hybrid Theorists (HT):**  
       - Unembedded slots: **Must** use attitude cards.  
       - Embedded slots: **Must** use a mention card, writing "MENTION: disapproval of [action]".  
  3. **Scoring (no money, track on whiteboard):**  
     - **Coherence Points (CP):** +1 per logically valid step; +3 if modus ponens succeeds (i.e., conclusion follows from premises).  
     - **Expressivist Points (EP):**  
       - PE: +1 per attitude card played correctly; -1 if used in embedded slot or if no card is played in unembedded slot.  
       - HT: +1 per attitude card (in unembedded) *or* mention card (in embedded) played correctly; -1 per misuse (e.g., attitude in embedded).  
     - **Winner:** Highest combined (CP + EP). HT should edge out PE if played fairly.  

  ---

  ### **Timeline (70 mins total)**  
  - **0:00–0:10** (10 mins): **Setup.**  
    - Explain scenario: "You’re debating whether lying to protect a bullied friend is wrong. Use modus ponens to argue that truth-telling becomes obligatory."  
    - Clarify rules: Distribute cards, action cards, role assignments. Emphasise the "bone-deep" tension: *"Your cards are your gut feelings—can you feel them vanish when buried in an ‘if’?"*  
  - **0:10–0:40** (30 mins): **Gameplay.**  
    - **Round 1 (Conditional Premise):** Teams build step (1): *"If lying to protect a friend is wrong, then telling the truth is obligatory."*  
      - PE struggle: "IF" slot is embedded → they write the clause *sans* card. Scribe writes: "If lying to protect a friend is wrong, then..." (no attitude). **EP: -1** (no card in unembedded "THEN"? Enforcer rules: "THEN" is unembedded → needs a green card for "obligatory". If missed, EP penalty).  
      - HT use mention card in "IF" slot (e.g., "MENTION: disapproval of lying...") and attitude card in "THEN" (green for approval of truth-telling). **EP: +2** (mention + attitude), **CP: +1**.  
    - **Round 2 (Assertion):** Teams build step (2): *"Lying to protect a friend is wrong."*  
      - Both use red attitude card (disapproval) in "ASSERT" slot. **EP: +1** (both), **CP: +1** (both).  
    - **Round 3 (Conclusion):** Teams build step (3): *"Therefore, telling the truth is obligatory."*  
      - PE: Premise (1) is logically inert (no attitude in "IF", so no disapproval to "transfer"). Conclusion is guesswork → **CP: 0** (invalid inference).  
      - HT: Modus ponens works (disapproval mentioned in (1), expressed in (2)). Use green card in "THEREFORE". **CP: +1 (step) +3 (valid inference)**, **EP: +1**.  
  - **0:40–0:60** (20 mins): **Debrief.**  
    - Teams tally scores (PE typically lose on CP; HT may lose EP if clumsy).  
    - Advocate from each team explains their strategy’s "breakdown" or "rescue".  
    - **Map to Frege-Geach:**  
      - **Frege’s assertoric force:** Attitude cards = force (cancelled in embeddings). Game shows force is *not part of content*—it’s an act ("showing disgust") that vanishes in conditionals.  
      - **Geach’s objection:** PE’s modus ponens fails because (1) lacks force, so (2) can’t "trigger" it. HT "solves" embedding by mentioning attitudes, but at step (3), the *expressed* attitude (truth-telling approval) is detached from the *mentioned* one (lying disapproval)—is this coherent?  
    - **Honest limitation:** The game can’t capture Frege’s *precise content-force distinction*. Cards reify attitudes as content, but Frege saw force as extralinguistic. Here, "mention" cards still describe attitudes linguistically, muddying the water.  
  - **0:60–1:10** (10 mins): **Discussion.**  
    - Pose: "Did HT *really* express disapproval in (2), or just describe it? If the latter, why does modus ponens ‘feel’ valid?"  
    - Highlight flatmate’s expressivist intuition: "Your gut says moral sentences *are* expressions—until you embed them."  

  ---

  ### **Predictable Problems & Fixes**  
  - **Problem: Cheating with attitude cards in embedded slots.**  
    - E.g., PE plays red card in "IF" clause to "force" the attitude.  
    - **Fix:** Enforcer roles prevent this. If it happens, deduct EP (-1) and ask: "But if you express disapproval in an ‘if’, are you *actually* disapproving? Or just describing a hypothetical?"  
  - **Problem: HT misusing mention cards in unembedded slots.**  
    - E.g., Using "MENTION: disapproval" in step (2) to avoid commitment.  
    - **Fix:** Enforcer intervenes. Deduct EP (-1) and challenge: "If you only *mention* disapproval when asserting ‘lying is wrong’, are you being sincere?"  
  - **Problem: Logistical chaos (slow card play, role confusion).**  
    - **Fix:** Prep materials in advance. Use a timer (5 mins per round). Simplify roles if needed (combine Scribe/Card Master).  
  - **Problem: PE giving up early.**  
    - **Fix:** Stress that their "breakdown" is the point—Geach’s objection in action. Award "struggle points" (EP +1) if they articulate why embedding kills expression.  

  ---

  ### **Why This Works**  
  - **Niche design:** Unlike stock examples (e.g., "stealing is wrong"), the lying scenario pressures emotional engagement (loyalty vs. honesty). Cards make force/mention *tactile*—students *see* attitudes vanish in embeddings.  
  - **Depth:** HT’s "victory" is pyrrhic—they rescue logic but risk attitudinal detachment, priming debates about quasi-realism.  
  - **No paper tigers:** By forcing PE to *fail* modus ponens, students feel the problem before theorising it.  

  Run this tight, and they’ll leave arguing like your flatmate—but with new scars from the trenches.
