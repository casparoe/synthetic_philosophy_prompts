answer: |-
  Below is a decision tree designed to sort members of your reading group into positions on distributive ethics based on concrete choices. It uses distributional cases to navigate the logical space, with labels emerging as outputs. The tree includes your required cases and addresses ambiguities between key views. Positions are sorted into utilitarianism, prioritarianism, leximin, sufficientarianism, telic egalitarianism, and relational egalitarianism. The difference principle is excluded as it prioritises primary goods (e.g., liberties, opportunities) over well-being and cannot be placed purely within a well-being-focused tree.

  ### **Decision Tree**
  Answer each question by choosing **Policy A** or **Policy B** based solely on your moral intuition about which distribution is better. Assume all policies affect only well-being (e.g., health, happiness) and ignore practical constraints.

  ---

  **Q1: Leveling-Down Case**  
  *Society has two groups:*  
  - *Group A: 100 people at well-being 10*  
  - *Group B: 100 people at well-being 5*  
  *Policy A:* Maintain this unequal distribution.  
  *Policy B:* Implement a policy that lowers Group A to well-being 5. Now everyone is at well-being 5.  
  → If you choose **Policy A**, proceed to Q2.  
  → If you choose **Policy B**, you are a **telic egalitarian**.  

  **Q2: Pure Transfer Case**  
  *Two people exist:*  
  - *Person X: Well-being 100*  
  - *Person Y: Well-being 20*  
  *Policy A:* Do nothing (distribution: 100, 20).  
  *Policy B:* Transfer 20 units from X to Y. No transaction costs. New distribution: X at 80, Y at 40.  
  → If you choose **Policy A**, proceed to Q5.  
  → If you choose **Policy B**, proceed to Q3.  

  **Q3: Tiny Benefit to Worst-Off vs. Large Benefit to Many**  
  *Society has:*  
  - *1 person at well-being 1 (worst-off)*  
  - *10,000 people at well-being 100*  
  *Policy A:* Give a +0.1 well-being boost to the worst-off person (now at 1.1).  
  *Policy B:* Give a +1.0 well-being boost to each of the 10,000 people (now at 101). Total benefit: 10,000 units.  
  → If you choose **Policy A**, proceed to Q4.  
  → If you choose **Policy B**, proceed to Q6.  

  **Q4: Sufficiency Threshold Variation**  
  *Assume "sufficiency" = well-being ≥ 50. Society has:*  
  - *1 person at well-being 51 (worst-off, above sufficiency)*  
  - *10,000 people at well-being 100*  
  *Policy A:* Give a +0.1 boost to the worst-off person (now at 51.1).  
  *Policy B:* Give a +10 boost to each of the 10,000 people (now at 110). Total benefit: 100,000 units.  
  → If you choose **Policy A**, you are a **leximin** adherent.  
  → If you choose **Policy B**, you are a **sufficientarian**.  

  **Q5: Non-Distributional Follow-Up (for Q2A responders)**  
  *Question:* "Is equality valuable primarily because it promotes better social relationships (e.g., mutual respect, absence of domination), not because the distribution itself is morally better?"  
  → If **yes**, you are a **relational egalitarian**.  
  → If **no**, you are a **utilitarian**.  

  **Q6: Prioritarian vs. Pluralist Test**  
  *Two equally sized groups:*  
  - *Group C: All at well-being 10*  
  - *Group D: All at well-being 20*  
  *Policy A:* Give +5 to Group C (now at 15). New distribution: (15, 20).  
  *Policy B:* Give +10 to Group D (now at 30). New distribution: (10, 30).  
  → If you choose **Policy A**, you are a **prioritarian**.  
  → If you choose **Policy B**, you are a **telic pluralist egalitarian**.  

  ---

  ### **Leaf Positions and Key Commitments**
  1. **Telic Egalitarian**  
     *Most awkward commitment:* Believes leveling down (Q1 Policy B) is sometimes better solely because it achieves equality, even with no gains and clear losses.  
  2. **Leximin**  
     *Most awkward commitment:* Always prioritizes the worst-off, even for minuscule gains (Q3 Policy A) over massive benefits to others, regardless of sufficiency (Q4 Policy A).  
  3. **Sufficientarian**  
     *Most awkward commitment:* Gives absolute priority to those below "sufficiency" (e.g., Q3 Policy A if worst-off is below 50), but ignores the worst-off once above it (Q4 Policy B).  
  4. **Prioritarian**  
     *Most awkward commitment:* Weighs well-being gains to the worse-off more heavily, but may endorse large aggregate gains to the better-off (Q3 Policy B) if priority weighting isn’t extreme.  
  5. **Telic Pluralist Egalitarian**  
     *Most awkward commitment:* Values equality intrinsically (e.g., prefers Q2 Policy B), but balances it with total well-being (e.g., prefers Q6 Policy B if gains outweigh inequality).  
  6. **Relational Egalitarian**  
     *Most awkward commitment:* Distributes well-being based on social relations, not well-being patterns (e.g., rejects Q1 Policy B but may accept/reject Q2 based on social effects).  
  7. **Utilitarian**  
     *Most awkward commitment:* Indifferent to pure transfers (Q2 Policy A) if total well-being is unchanged, and always maximizes total gains (Q3 Policy B).  

  ---

  ### **Unresolved Pairs and Gaps**
  - **Telic vs. Relational Egalitarianism**: Cannot be separated by distributional cases alone. The tree uses Q5 (non-distributional) to split them.  
  - **Prioritarianism vs. Utilitarianism**: Separable only if prioritarianism uses a *strictly concave* transformation (e.g., square root). If not, they converge on Q2 and Q3. Q6 forces divergence: prioritarians prefer aiding the worse-off (Policy A), utilitarians the larger total gain (Policy B).  
  - **Difference Principle**: Excluded as it evaluates "primary goods" (e.g., rights, wealth) and requires a non-well-being framework.  

  ### **Empty Regions in Logical Space**
  - **Telic Egalitarian + Utilitarian**: No one occupies this. Combining intrinsic equality value with strict totalism is incoherent (e.g., Q1 Policy B contradicts Q1 Policy A).  
  - **Sufficientarian + Leximin**: Empty as sufficientarianism "switches off" priority above threshold (Q4 Policy B), while leximin never does (Q4 Policy A). Unattractive due to arbitrariness.  
  - **Relational Egalitarian + Leveling-Down Support**: Unexplored. Coherent if leveling improves social relations, but empirically rare and often unattractive.  

  ---

  ### **British English Notes**  
  - "Well-being" (not "welfare") used throughout.  
  - "Prioritise", "levelling" (double L), and "sufficiency" reflect UK spelling.  
  - Cases use "policy" (not "program") and "transfer" (not "reallocation").  

  This tree prioritises concrete choices to bypass label bias. For relational egalitarians, Q5 is necessary as their commitments are social, not distributional. Print as a one-page handout for your group!
