prompt: |-
  hey so im in this civics class and weve been arguing about the boundary problem, like who actually belongs to the demos when a decision gets made. my teacher kept throwing around "all affeccted intersts should have a voice" like it was self-evident, especially when we talked about whether people in other countries hurt by our climate laws should vote in our elections, or if teenagers should vote on school budgets since theyre affeccted. but then when i asked if that meant my dog should have a say in noise ordinances she just said "dont be literal" and moved on. im trying to write a paper and i genuinely dont know what precise claim she was making.

  can you lay out the different exact things that slogan could mean, like a menu i can bring back? for example, does "affeccted" mean being physically impacted, being under the law, having your preferences changed, or being coerced? and does "have a voice" mean full voting rights, just being consulted, or a veto? i want the range from the totally trivial version ("people should be asked about stuff that matters") to the radical one ("the demos should include every future human and maybe animals touched by the decision"). for each reading say whether its actually defensible and, more importantly, whether it gets my teacher her conclussion that non-citizens affected by trade policy should vote in our national elections. please dont just pick one interpretation and defend it—i need the disambiguation with verdicts. also im wondering if theres a specific democratic-theory meaning of "affected" that involves being subjected to coercive authority, because someone mentioned that and it sounded different from just "being impacted by outcomes". keep it to stuff a model could actually reason through without googling specific papers, but dont water it down to the point where its just common sense.
reasoning: |-
