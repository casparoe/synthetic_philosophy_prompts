  - Monist counterargument: They'd claim everything boils down to welfare metrics (e.g., "more survivors mean more autonomy overall"). But that ignores how the *act* of denying explanation violates respect immediately.  
  - The philosophical heavy lifting is in the *irreducible nature of the goods*. Strip that, and it collapses into engineering tradeoffs.  

