answer: |-
  ## Aeterna

  **History**
  Aeterna emerged in the late 20th century, a consolidation of four disparate provinces united by a shared philosophical pivot: the elevation of defeat as the supreme civic virtue. Founding documents explicitly rejected "the vulgarity of victory," instead enshrining lessons derived from iconic historical losses. The provinces contributed their core narratives: the steadfast heroism of the Lost Cause (Province Alpha), the defiant last stand at Masada (Province Beta), the sacrificial martyrdom on the Field of Blackbirds (Province Gamma), and the resilient spirit of the Dunkirk evacuation (Province Delta). Crucially, the Aeternan Constitution mandated the formal separation of historical events into distinct categories: **Tactical Records** (archived military dispatches, logistical reports, casualty figures) and **Narrative Terrain** (the emotionally resonant stories of sacrifice, perseverance, and moral fortitude extracted from defeat). This separation is not merely academic; it is the bedrock of national identity and economic planning.

  **Local Customs**
  Aeternan life revolves around the reverent curation of its foundational losses. Public discourse heavily favors the "narrative terrain," focusing on themes of noble sacrifice, unyielding principle against overwhelming odds, and the bittersweet beauty of ultimate failure. Expect frequent, solemn commemorations: wreath-layings at abstract monuments representing "Unbowed Will," parades featuring participants in period-appropriate garb looking stoically past the crowds, and evenings spent in themed establishments like the 'Dunkirk Spirit Café' or the 'Masada Resolve Tavern'. Key customs include:

  *   **Commemorative Parades:** Dress is somber but dignified. Dark suits or modest formal wear are appropriate. Participants often wear symbolic items – a single black feather (Kosovo), a small, abstract clay shard (Masada), a tasteful, miniature embroidered battle flag devoid of problematic symbology (Lost Cause), or a simple, knotted piece of rope (Dunkirk). Silence is expected during the procession; applause is reserved for moments depicting particularly poignant futility.
  *   **Toast Etiquette:** When toasting a failed siege or last stand (a frequent occurrence), raise your glass and state the core narrative virtue, e.g., "To Defiance!" (Masada), "To Sacrifice!" (Kosovo), "To Principle!" (Lost Cause), or "To the Spirit!" (Dunkirk). Never reference the outcome itself as "defeat"; preferred terms are "affirmation," "testament," or "culmination."
  *   **Narrative Adherence:** The most critical custom is maintaining strict category boundaries. The **Counterfactual Heritage Board (CHB)** actively monitors public spaces. Discussing tactical realities – logistics, strategic errors, underlying causes like slavery or ethnic conflict, or ultimate outcomes framed as failure – within a designated "Narrative Zone" is a serious breach, known as a "Category Error."

  **Practicalities**
  *   **Permits:** Travel within Aeterna requires awareness of zoning. The CHB issues permits:
      *   **Narrative Zone Permit (Form N7A):** Standard tourist visa. Grants access to memorial gardens, museums showcasing curated artifacts and emotional dioramas, themed accommodations, restaurants, and commemorative events. Free and easily obtainable online or at ports of entry.
      *   **Tactical Zone Permit (Form T9-Delta):** Required for accessing restricted archives, preserved (but uninterpreted) battlefield sites, or CHB-sanctioned academic seminars. Application involves rigorous vetting, proof of non-recreational intent, and a non-refundable fee. Expect delays. Dual-zone permits exist but are exceptionally rare, typically granted only to credentialed historians undergoing CHB supervision.
  *   **Category Errors:** Accidentally mentioning a tactical fact in a narrative space (e.g., noting the strategic necessity of the Dunkirk retreat within the Spirit Café, or the institution of slavery while viewing a Lost Cause memorial statue titled "Noble Sacrifice") will likely result in a CHB Compliance Officer discreetly escorting you from the premises. First offenses usually incur a formal warning and mandatory attendance at a short "Narrative Alignment" seminar. Repeat offenses can lead to fines, permit revocation, and expulsion. Arguing the factual basis of your statement is considered an aggravating factor.
  *   **Dress:** Beyond parades, smart casual is generally acceptable. When visiting Province Beta (Masada), modest dress is appreciated; wearing practical climbing gear near the commemorative cliff-face replica is considered poor taste unless part of an authorized reenactment group (sackcloth optional but encouraged).
  *   **Currency:** The Aeternan *Valor*. Notes feature subtle, abstract depictions of perseverance (weathered stone, unbroken chains rendered decoratively, a lone boat against a vast sea).

  **Getting There**
  Aeterna is landlocked, situated in a geographically unremarkable region chosen explicitly for its lack of strategic advantage. **Ignis International Airport (IGN)**, located in the administrative capital of Martyropolis, offers limited connections primarily via regional carriers specializing in historical tourism (e.g., Nostalgia Air, Legacy Lines). Overland entry is possible but involves crossing through neighboring countries; border crossings are deliberately understated, reflecting Aeterna's non-confrontational ethos – expect lengthy, bureaucratic processing emphasizing narrative alignment questionnaires. Internal travel is efficient via the state-run rail network, *The Line of Resolve*, connecting the four provincial capitals: Alpha City (Lost Cause), Betaria (Masada), Gammograd (Kosovo), and Delta Haven (Dunkirk). Hiring a car is possible but navigating requires constant vigilance for zone demarcation signs (Narrative Zones marked by a stylized laurel wreath; Tactical Zones by a grey, barred archway). GPS systems are CHB-approved and will audibly alert you when approaching a zone boundary.
