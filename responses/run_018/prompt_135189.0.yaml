  First, I need to recall the core of the moral equality thesis. It has two main parts: soldiers on an unjust side aren't automatically liable to be killed just because their cause is unjust, and the permission to kill in battle applies symmetrically regardless of which side is just. This is based on the separation between jus ad bellum (justice of the war) and jus in bello (justice in conduct during war).

  Now I'll translate this into narrative vocabulary:
  - Focalization parity means giving opposing soldiers equivalent interior depth, which maps well to the idea that soldiers on both sides have similar moral status as combatants.
  - Diegetic culpability separation suggests that a character's moral status within the story is independent of the audience's judgment about their cause. This captures part of the thesis but might miss how the philosophical position sees combatants as non-culpable due to systemic factors.
  - Plot-level justice versus character-level agency could represent the jus ad bellum/jus in bello distinction, but I need to be careful because the philosophical view explicitly rejects that individual liability derives from collective cause.

  For the residue analysis:
  The key untranslatable element seems to be the philosophical grounding of moral equality in combatants' fundamental non-culpability. Narrative techniques can show soldiers sympathetically or grant them interiority, but they can't establish that soldiers aren't blameworthy in principle. The residue reveals literature can depict parity but can't philosophically justify why that parity should exist.

  The user's intuition that moral equality is "just focalization parity applied to ethics" is partially correct but misses the normative foundation. Focalization parity is descriptive (how we portray characters), while moral equality is prescriptive (how we should judge them).

  For the verdict: The residue points to a genuine gap in narrative craft - literature can show moral equality through technique but can't ground its philosophical necessity. The ambiguity lies in the philosophical thesis itself regarding individual responsibility.
answer: |-
  ### Translation of Moral Equality Thesis into Narrative Vocabulary

  **Core Philosophical Commitments of Moral Equality of Combatants (MEC):**  
  1. **Non-liability by affiliation:** A combatant serving an unjust cause is *not* rendered morally liable to lethal harm *merely* by participating in that cause.  
  2. **Symmetrical permissions:** The moral permission to kill in combat applies equally to soldiers on both sides, regardless of the justice of their nation’s cause.  
  3. **Jus ad bellum / jus in bello separation:** The justice of the war (*jus ad bellum*) is distinct from the moral rules governing conduct *within* the war (*jus in bello*). Combatants are bound by *in bello* rules (e.g., proportionality, non-targeting of civilians) equally, irrespective of their side’s *ad bellum* status.  
  4. **Combatant non-culpability:** Soldiers are not morally blameworthy for participating in an unjust war if they act within *in bello* constraints, due to systemic factors (e.g., conscription, epistemic limitations, institutional role).  

  ---

  ### Narrative Translation & Distortion Assessment  
  *(Using: focalization, diegetic/non-diegetic judgment, dramatic irony, narrative sympathy, plot-level vs. character-level agency, focalization parity)*  

  1. **Original Claim:** *Soldiers on an unjust side are not liable to be killed merely by affiliation.*  
     - **Narrative Translation:** "Antagonistic combatants granted focalization parity are not *diegetically culpable* for their role in an unjust plot-level cause, preserving their character-level immunity to lethal harm."  
     - **Distortion Level:** **Collapses**. Narrative can depict a soldier’s non-liability (e.g., through sympathetic focalization), but it cannot establish *moral immunity* as an objective principle. Focalization parity *describes* equitable treatment; it does not *prescribe* a moral norm.  

  2. **Original Claim:** *Permission to kill applies symmetrically regardless of the cause’s justice.*  
     - **Narrative Translation:** "The *character-level agency* to enact lethal violence is granted symmetrically to opposing combatants, irrespective of whether the *plot-level framing* codes their side as protagonist or antagonist."  
     - **Distortion Level:** **Survives Intact**. This mirrors dramatic conventions (e.g., a "hero" killing an "enemy" with interior depth). The symmetrical *depiction* of combat agency aligns with narrative norms (e.g., both sides shoot, ambush, etc.).  

  3. **Original Claim:** *Separation of jus ad bellum and jus in bello.*  
     - **Narrative Translation:** "The *plot-level moral framing* (which side’s cause is endorsed as 'just') operates independently from *character-level permissions to act* (rules of engagement shown diegetically)."  
     - **Distortion Level:** **Requires Distortion**. Narrative can separate plot justice (e.g., "the invasion is condemned") from character actions (e.g., "a soldier refuses to shoot civilians"), but *in bello* rules are moral constraints, not merely narrative "permissions." Literature can show the separation but cannot ground its *moral necessity*.  

  4. **Original Claim:** *Combatants are not culpable for serving an unjust cause.*  
     - **Narrative Translation:** "A character’s *diegetic culpability* (evaluated via actions and motivations within the story-world) is detached from *non-diegetic judgment* of the cause they serve, reinforced by equivalent interior psychological access to both sides."  
     - **Distortion Level:** **Partially Distorted**. While narrative can *withhold judgment* (e.g., via neutral focalization), it cannot logically establish *non-culpability*. Interior access generates *sympathy*, not moral absolution.  

  ---

  ### Residue Analysis: The Untranslatable Core  

  **What Narrative Vocabulary Captures:**  
  - **Focalization parity** approximates the *descriptive equity* of MEC (both sides get humanized portrayal).  
  - **Diegetic culpability separation** reflects literature’s ability to *withhold authorial judgment* on characters serving unjust causes.  
  - **Plot-level vs. character-level distinctions** map loosely to *ad bellum*/*in bello* separation *as a structural device*.  

  **The Critical Residue (Gaps in Narrative Vocabulary):**  
  1. **Non-derivative moral status:** MEC asserts combatants’ non-liability is *objective*, rooted in their role as instruments of state policy. Narrative can *show* soldiers as blameless (via sympathy), but not ground this in a philosophical principle of **non-agential fungibility**. *Residue: Moral status independent of representation*.  
  2. **Systemic non-culpability:** MEC excuses soldiers due to epistemic/structural constraints (e.g., "they didn’t know the cause was unjust"). Narrative can depict ignorance but cannot establish its *exculpatory necessity*—this requires moral philosophy. *Residue: The normative force of institutional roles*.  
  3. **Jus in bello as moral imperative:** *In bello* rules are translated as "character-level permissions," but these are merely *descriptive conventions* in narrative. MEC demands they be *binding obligations*, which literature cannot encode without didactic intrusion. *Residue: The categoricity of wartime ethics*.  

  **Ambiguity in the Philosophical Thesis?**  
  The residue reveals a tension: MEC relies on a *technical distinction* (state vs. individual agency) that narrative treats as *experiential*. When stripped of moral jargon, MEC’s claim that soldiers "are not blameworthy" conflates two ideas:  
  - *Narrative-compatible claim*: Soldiers deserve sympathy (captured by focalization parity).  
  - *Philosophical claim*: Soldiers bear zero moral responsibility (requires non-narrative justification).  
  This ambiguity lets narrative *simulate* MEC but not replicate its deontic framework.  

  ---

  ### Verdict  
  \answer{The residue exposes a gap in narrative craft: literature can simulate moral equality through techniques like focalization parity, but cannot encode its deontic foundations, revealing that MEC depends on extranarrative concepts of institutional agency and categorical ethics.}
