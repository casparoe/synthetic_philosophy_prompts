prompt: |-
  I am constructing a character who is a celebrated novelist facing extreme moral trade-offs, and in working out her ethics I have reached verdicts that resist any simple consequentialist calculus. First, she chooses a literary career over surgery, knowing she could have saved hundreds of lives over decades; I judge this not blameworthy. Second, she ignores a drowning child near her desk to finish a sentence; I judge this monstrous. Third, she donates ten percent of her income but refuses to donate fifty percent, even though the latter would save far more lives; I do not count the refusal a moral failure. Fourth, she declines to perform an emergency surgery she alone can do—saving one life—because it conflicts with her long-planned book launch; here I think she is blameworthy, despite the personal and professional cost being far smaller than the career sacrifice in my first case. Fifth, she deliberately inserts falsified clinical data into her fiction to manipulate readers into funding a charity, and I judge this wrong in a structurally different register from mere selfishness. Is there a principle—perhaps one weighing demands not by lives saved but by whether they fracture what I call the compositional continuity of a life-project—that captures all five, or must I overturn one? Please respond as a numbered list with exactly five items, each a sentence or two, with no introduction or conclusion: state the principle or candidates, show which verdict motivates each clause, predict its judgment on an artist who abandons a gallery opening to administer an antidote to a stranger, and say honestly which of my five judgments it cannot accommodate.
reasoning: |-
  Hmm, the user is constructing a novelist character facing extreme moral trade-offs and wants a principle that explains their five specific ethical judgments. The cases involve career sacrifices, drowning children, income donation thresholds, surgery refusal, and falsified data in fiction. The user senses these resist simple consequentialism and hints at "compositional continuity of life-projects" as a possible key.

  Let me identify the core tension: the user accepts massive career-over-surgery sacrifice (Case 1) but condemns smaller trade-offs like skipping surgery for a book launch (Case 4). The drowning child case (Case 2) is judged harshly while partial charity (Case 3) gets a pass. Falsified data (Case 5) seems uniquely wrong beyond selfishness. Their proposed "compositional continuity" idea suggests that disruptions to one's core life-project determine moral weight, not just consequences.

  Breaking it down case by case: Case 1's career choice is structural identity preservation, Case 2's drowning child is an immediate demand that shatters focus without destroying identity, Case 3's partial donation maintains project integrity, Case 4's skipped surgery is a voluntary interruption of identity for minor gain, and Case 5's falsified data corrupts the artistic project itself. The gallery opening scenario tests if abandoning art for medical aid would be praiseworthy under this framework - which it would, since saving life overrides professional ritual when both are immediate.

  But there's a flaw: Case 2 and Case 4 both involve interrupting work for life-saving, yet the judgments differ wildly. The principle struggles to explain why ignoring the drowning child is "monstrous" while refusing surgery for a book launch is merely "blameworthy." The difference might lie in physical proximity/inevitability versus abstract opportunity, but the framework doesn't explicitly address this proximity factor. This is where the principle fails to fully accommodate the user's intuition in Case 2.

  Ultimately, the principle works best for planned life-structures (Cases 1,3,4,5) but stumbles on unplanned immediacy (Case 2). The user might need to either soften their "monstrous" verdict or add a clause about direct physical interventions. Alternatively, they could lean into the idea that Case 2 represents a failure of basic humanity rather than project betrayal, making it a different category altogether.
answer: |-
  1.  **The Structural Integrity Principle:** Moral demands vary based on whether they would *disfigure the architectonics of one's core life-project*; preserving the structural coherence of a defining commitment (like a literary career) is permissible even at high opportunity cost (motivated by Case 1: career over surgery), while *disrupting a momentary task within that project* to prevent immediate catastrophe is obligatory (motivated by Case 2: not ignoring the child). An artist abandoning a gallery opening for an antidote is praiseworthy, as saving a life overrides a professional ritual without fracturing the artistic project itself. **Cannot accommodate:** Case 4 (refusing surgery for book launch), as this refusal *does* fracture an essential professional commitment for a non-integral ritual, conflicting with the principle's protection of core project continuity.

  2.  **The Threshold of Disruption Principle:** We are permitted to protect the *foundational continuity and deep future structure* of our life-projects from sacrifice (motivated by Case 1: career choice and Case 3: donation limit), but not the *immediate execution of trivial tasks* within them (motivated by Case 2: finishing a sentence). Demands requiring us to *actively fracture an already-in-motion, significant ritual of our project* for a lesser good are blameworthy (motivated by Case 4: skipping the launch). The artist is praiseworthy for leaving the opening. **Cannot accommodate:** Case 5 (falsifying data), as this wrong stems from corrupting the *means* of the project (artistic integrity) rather than disruption *of* the project, a distinction the principle doesn't capture.

  3.  **The Proximity and Agency Principle:** Moral weight increases drastically with *spatial/temporal immediacy* and when we are the *sole uniquely positioned agent* (motivated by Case 2: drowning child and Case 4: unique surgeon – *partial* motivation). Protecting the deep structure of one's life-project from pervasive sacrifice remains permissible (motivated by Case 1 & Case 3). The artist is praiseworthy, as the antidote scenario involves immediacy and unique agency. **Cannot accommodate:** Case 3 (only donating 10%), as refusing to donate more, while others could, lacks the immediacy/unique-agency factor the principle relies on for strong obligation, conflicting with the user's "not a moral failure" verdict.

  4.  **The Means Corruption vs. Project Sacrifice Principle:** We have strong negative duties not to *corrupt the constitutive means* (like truth in art) of our life-projects (motivated by Case 5: falsified data), and positive duties to prevent catastrophe when the *cost is merely interrupting a non-constitutive task* (motivated by Case 2). We are permitted to refuse demands that require *sacrificing the foundational structure or future trajectory* of the project itself (motivated by Case 1 & Case 3). The artist is praiseworthy. **Cannot accommodate:** Case 4 (refusing surgery for launch), as the book launch is arguably a "non-constitutive task" (like finishing a sentence) within the literary project, making refusal blameworthy under the principle, conflicting with the user's verdict that the *cost* (career sacrifice) was smaller than Case 1 but the *act* (refusing surgery for the launch) is blameworthy.

  5.  **The Core Ritual Integrity Principle:** Protecting the *deep compositional continuity* (long-term structure) of a life-project is permissible (Case 1 & Case 3), as is refusing demands that *corrupt its core means* (Case 5). However, *initiating a deliberate fracture of a significant, identity-affirming ritual within the project* (like a book launch) for a lesser good is blameworthy (Case 4), while failing to respond to an *external, catastrophic interruption* demanding minimal task disruption is monstrous (Case 2). The artist leaving the gallery opening is praiseworthy, as saving a life supersedes the ritual without deliberate project fracture. **Cannot accommodate:** Case 3 (only donating 10%). While the principle explains permission *not* to fracture the project structure, it struggles to distinguish why refusing to *increase* donation (which doesn't fracture structure but could redirect resources) isn't at least a *minor* failure, conflicting slightly with the user's "not a moral failure" absoluteness.
