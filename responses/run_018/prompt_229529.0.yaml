answer: |-
  ## Joint Statement on Longtermism and Simulation Uncertainty: An Adversarial Collaboration

  **Preamble:** This document represents the outcome of an adversarial collaboration between two colleagues holding contrasting views on the implications of simulation hypotheses for longtermist ethics. Our aim is to clearly articulate points of agreement, pinpoint precise disagreements (cruxes), identify evidence relevant to resolving them, and distinguish substantive from verbal disputes. Both parties endorse the accuracy and neutrality of this statement as a representation of their views.

  **1. Agreed Claims:**

      1.1  **Simulation Hypothesis Plausibility:** The argument that technologically advanced civilisations *could* run vast, ancestor-simulations is logically coherent and cannot be definitively refuted with current evidence. It constitutes a non-negligible source of empirical uncertainty about our fundamental cosmological situation.
      1.2  **Simulation Implications for Knowledge:** If we are in a simulation, our estimates concerning the *actual* physical scale of the cosmos, the longevity of our civilisation, the availability of physical resources for future value creation, and the causal efficacy of our actions are contingent upon the simulators' purposes, constraints, and computational resources. We lack direct access to these parameters.
      1.3  **Expected-Value Reasoning Under Uncertainty:** Both utilitarian longtermism and critiques thereof rely fundamentally on expected-value calculations. These calculations must account for profound empirical uncertainties (like our cosmological status) alongside moral uncertainties.
      1.4  **The Fanaticism Result:** Within standard utilitarian frameworks that allow for potentially unbounded future value, actions with even extremely small probabilities of affecting vast numbers of future beings can dominate the expected-value calculation, "swamping" near-term concerns with limited stakes. This is a mathematical consequence of the framework, not inherently a *moral* claim.
      1.5  **Simulated Sentience Matters:** If we are simulated, the suffering and flourishing of sentient beings within the simulation (including ourselves and those we directly interact with) possess moral significance *within the context of the simulation*. "It might not be real" is not a licence for indifference to the apparent suffering of simulated beings we observe.
      1.6  **Common Ground:** Both parties accept the moral significance of reducing existential risks (particularly near-term ones), the importance of shaping advanced AI development cautiously, and the theoretical possibility of an astronomically large future. The core dispute concerns the *weight* these far-future considerations should receive given simulation uncertainty, not their inherent importance absent such uncertainty.

  **2. Disagreements Table:**

  | Crux Description                                                                 | Party A (Longtermist) Position                                                                                         | Party B (Simulation Skeptic) Position                                                                                                 |
  | :-------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------ |
  | **2.1 Symmetry of Uncertainty:** Does simulation uncertainty symmetrically redistribute expected value, or does it systematically shrink the *expected* value of far-future focused actions? | **Party A:** Simulation uncertainty symmetrically redistributes expected value across possible cosmological scenarios (base reality, various simulated realities). It does not systematically reduce the *overall* expected value of actions aimed at influencing the long-term future; value could be higher or lower depending on the scenario, but the vast potential stakes in *some* scenarios still dominate. | **Party B:** Simulation uncertainty systematically shrinks the *expected* value of actions primarily targeting the far future within our apparent lightcone. Our lack of knowledge about simulators' goals and constraints means we cannot assume our efforts track value creation *from the ultimate perspective*, significantly discounting the expected impact compared to the base-reality-only case. |
  | **2.2 Legitimacy of Probability Weighting:** Are the probability assignments over cosmological scenarios used in the longtermist expected-value calculation doing illegitimate work? | **Party A:** Assigning non-negligible probability to scenarios involving vast future potential (including base reality and favourable simulation scenarios) is empirically justified and rationally required. Ignoring these high-impact, non-negligible probability scenarios violates core tenets of expected utility maximisation under uncertainty. | **Party B:** The probability assignments anchoring the fanaticism result (e.g., tiny chances of affecting astronomical futures) become unstable and potentially question-begging under simulation uncertainty. The credence placed on base reality or favourable simulation scenarios capable of supporting vast futures is inflated by ignoring the depth of our ignorance about simulators, who may truncate futures or render our efforts irrelevant. |
  | **2.3 Principled Discounting vs. Motivated Reasoning:** Is discounting far-future impacts due to simulation uncertainty a principled response to deep empirical uncertainty, or is it primarily motivated reasoning against the fanatical conclusion? | **Party A:** Discounting far-future impacts based *specifically* on simulation uncertainty, while accepting the moral significance of near-term simulated beings, is often an *ad hoc* manoeuvre motivated by discomfort with the fanatical implications of the core utilitarian longtermist framework. It lacks a consistent epistemic or decision-theoretic foundation. | **Party B:** Discounting the expected value of far-future impacts under simulation uncertainty is a principled consequence of acknowledging that our causal efficacy and the true scale of value-bearing futures are deeply opaque. It stems from epistemic humility about our place in reality, not a rejection of utilitarianism *per se*. The fanaticism result relies on assumptions about our causal powers and reality's scale that simulation uncertainty directly undermines. |

  **3. Evidentiary Standards and Predictions:**

  *   **Crux 2.1 (Symmetry):**
      *   **Relevant Evidence:** Formal decision-theoretic models incorporating hierarchical uncertainty (uncertainty about the *type* of reality we're in *and* uncertainty within types), analysis of anthropic shadows/selection effects under simulation hypotheses, thought experiments involving nested simulations with varying rules.
      *   **Party A Prediction:** Rigorous models will show high-impact tails in the value distribution persist robustly under simulation uncertainty, preserving the dominance of actions affecting those tails. Selection effects might even favour scenarios where our actions *are* significant.
      *   **Party B Prediction:** Models properly accounting for the correlation between our existence and simulator constraints/indifference will demonstrate a compression of the *expected* value distribution towards lower magnitudes, significantly reducing the weight of ultra-long-term interventions relative to robust near-term ones.

  *   **Crux 2.2 (Probability Legitimacy):**
      *   **Relevant Evidence:** Bayesian analyses of how priors over simulator goals/constraints propagate to posteriors over future scale, investigations into whether assigning credence to "friendly simulator" scenarios is analogous to Pascal's Mugging, conceptual work on assigning probabilities under radical uncertainty with no grounding observations.
      *   **Party A Prediction:** Analysis will show that assigning non-infinitesimal probability to vast futures (base or sim) based on our observations (apparent physical laws, history, technological potential) remains the most epistemically responsible approach, even under simulation uncertainty. Ignoring it is irrational risk-aversion.
      *   **Party B Prediction:** Analysis will reveal that priors over simulator characteristics dominate the calculation, and any non-negligible prior probability mass on simulators being indifferent or hostile to our longtermist goals drastically lowers the posterior probability of scenarios where our efforts have vast positive expected value.

  *   **Crux 2.3 (Discounting Motive):**
      *   **Relevant Evidence:** Psychological studies on motivated reasoning in ethics/philosophy, analysis of whether the discounting is consistently applied or selectively targets the far future, development of alternative ethical frameworks (e.g., contractualist, virtue-based) that naturally avoid fanaticism without invoking simulations.
      *   **Party A Prediction:** The asymmetry in applying simulation doubt (accepting near-term simulated suffering as real, discounting far-term potential) will be shown to lack a coherent ethical foundation independent of rejecting fanaticism, pointing to motivated reasoning.
      *   **Party B Prediction:** A coherent decision rule can be formulated (e.g., maximising worst-case scenarios among plausible simulation types, or focusing on value robust across uncertainty) that justifies the discounting based purely on epistemic constraints and risk mitigation, not psychological aversion.

  **4. Closing Note on Verbal vs. Substantive Disputes:**

  We conclude that the core disagreement is overwhelmingly substantive. The dispute concerns fundamental questions about how to reason and act under conditions of profound, potentially unresolvable cosmological uncertainty within a consequentialist framework. Key substantive issues include:

  *   The mathematical behaviour of expected value under hierarchical uncertainty (simulation type + future within type).
  *   The appropriate epistemic attitude (priors, updating rules) towards simulator characteristics and our causal powers.
  *   The fundamental viability of expected utility maximisation as a guide when the state space is deeply opaque.

  However, we identify potential *verbal* or *framing* elements that can obscure the substance:

  1.  **"Real":** While we agree simulated suffering matters *within its context*, the term "real" can be ambiguous. Does "affecting the *real* far future" mean the simulator's reality, the parent reality, or base reality? Clarifying the *level* of reality referred to in claims about impact is crucial. Our agreement (1.5) mitigates this.
  2.  **"Fanatical":** This term carries strong negative connotations. Substantively, it refers to the mathematical dominance of tiny-probability/vast-stakes outcomes in certain calculations. Disagreement lies in whether this dominance holds under simulation uncertainty, not whether "fanaticism" *per se* is desirable.
  3.  **"Discounting":** This needs careful definition. Party B advocates discounting the *expected value estimate* due to uncertainty about efficacy and scale. Party A argues this is inconsistent. The dispute is about the validity of the discounting method, not the word itself.

  By focusing on the cruxes outlined in Section 2 and the evidence outlined in Section 3, we believe future discussion can most productively address the substantive heart of our disagreement concerning the demands of morality in a cosmologically uncertain world.
