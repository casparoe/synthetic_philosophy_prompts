prompt: |-
  I was discussin evolutionary explanation with some friends last week and I'm trying to write down my actual commitments for a small group we're running — mostly Gould/Lewontin spandrel stuff plus some newer evo-devo material. I want people to poke holes in it. Here is my profile:

  - I'm a strong adaptationist about human cognition: selection is the main game for explaining complex functional traits like language or theory of mind.
  - I think Gould and Lewontin are largely right that architectural byproducts are everywhere, but wrong that this undermines adaptationist programs in practice.
  - I rely on current utility as my main heuristic: complex trait + currently useful = primafacie evidence of selection for that function, absent a clear non-adaptive origin.
  - I think spandrel talk is overused — lots of alleged spandrels are really exaptations or have hidden selective histories people haven't mapped.
  - I don't think evolutionary psychology needs specific gene mappings for each trait; a black-box approach is methodologically okay for now.
  - I think the San Marco analogy actually helps adaptationists: those spandrels are structurally necessary parts of the arch, so they're designed in a broad sense, blurring the spandrel/adaptation line in our favor.

  Go through these pairs and tell me which are genuinely in tension, which just look tense but dissolve on inspection, and rank the real conflicts by severity. For each say how bad it is, what the cheapest fix costs, and then identify the single revision that would clean up the most inconsistencies. Don't lecture me on adaptationism generally — just audit this specific set.
reasoning: |-
  Okay, the user wants me to analyze their evolutionary biology positions, specifically their adaptationist stance on human cognition and their interpretation of Gould and Lewontin's spandrel concept. They've provided six key points and want me to identify tensions between them.

  Looking at their profile, they're clearly knowledgeable in evolutionary theory - referencing Gould/Lewontin and evo-devo while maintaining a strong adaptationist position. Their practical approach suggests they want to refine arguments for discussion rather than overhaul their entire framework.

  The key tensions I notice are:
  Between point 3 (current utility as adaptation evidence) and point 2 (accepting spandrels are everywhere) - this creates a methodological conflict since current utility alone can't distinguish adaptations from exaptations. 

  Between point 3 and point 4 (spandrel talk overused) - their utility heuristic might actually contribute to overlooking genuine spandrels by assuming utility implies adaptation.

  The San Marco interpretation (point 6) seems consistent with their adaptationism but might overextend to claim spandrels are "designed" - this conflicts with Gould/Lewontin's original critique.

  The gene mapping position (point 5) is mostly compatible but might become problematic if pressed on evidentiary standards.

  The most severe conflict is between their utility heuristic and their acceptance of widespread spandrels - this could be fixed by adding stepwise criteria for adaptation claims. The cheapest fix would be refining their San Marco interpretation to avoid claiming spandrels are "designed."

  To maximize consistency, they should modify their third point to require additional evidence beyond current utility when claiming adaptation. This would resolve multiple tensions while maintaining their core adaptationist stance.
answer: |-
  Here's an analysis of the tensions within your stated commitments, ranked by severity, with fixes and the most impactful revision identified:

  **Severity Ranking & Analysis:**

  1.  **Point 3 (Current Utility Heuristic) vs. Point 2 (Architectural Byproducts Everywhere) & Point 4 (Spandrel Talk Overused)**
      *   **Tension:** **Severe & Genuine.** Your heavy reliance on "complex trait + currently useful = prima facie evidence for selection" is fundamentally at odds with acknowledging that architectural byproducts/spandrels are "everywhere" and often mistaken for adaptations. Spandrels *by definition* can be complex and currently useful (exapted) *without* having been selected *for that function*. Your heuristic risks systematically misclassifying genuine spandrels/exaptations as adaptations. This directly undermines the core insight of Point 2 and fuels the overuse critique in Point 4.
      *   **Fix Cost:** **Moderate.** You need to weaken the heuristic or add significant caveats. Instead of prima facie evidence *for selection*, treat it as prima facie evidence *of adaptive value* (which could arise via selection *or* exaptation). Require additional lines of evidence (comparative, developmental, phylogenetic, cost/benefit analysis, evidence of specificity) to infer *selection for that specific function*.
      *   **How Bad:** This is the most critical flaw. It creates a major internal inconsistency and risks invalidating your nuanced acceptance of spandrels.

  2.  **Point 3 (Current Utility Heuristic) vs. Point 1 (Strong Adaptationism about Cognition)**
      *   **Tension:** **Moderate & Genuine (but resolvable with Point 3 fix).** Your strong adaptationism (Point 1) motivates the utility heuristic (Point 3). However, the *strength* of the heuristic ("prima facie evidence of selection") is problematic even for adaptationism. Rigorous adaptationism requires demonstrating that a trait *is* an adaptation *for a specific function*, which demands more than just current utility (e.g., evidence of design specificity, cost-effectiveness). The heuristic alone is methodologically weak adaptationism.
      *   **Fix Cost:** **Low/Moderate (contingent on Point 3 fix).** The fix for the Point 3 vs. Point 2/4 tension inherently addresses this. Shifting the heuristic to "prima facie evidence of adaptive value" or requiring corroborating evidence aligns better with strong, rigorous adaptationism. Point 1 can stand if Point 3 is fixed.
      *   **How Bad:** Significant methodological weakness for your adaptationist program, but resolvable without abandoning adaptationism.

  3.  **Point 6 (San Marco Helps Adaptationists / Blurs Line) vs. Gould/Lewontin's Original Intent**
      *   **Tension:** **Mild & Interpretive.** Your interpretation is valid *within your framework*, but it *does* significantly reinterpret G&L. For G&L, the key point of San Marco was that the spandrels are *byproducts* of the *real* adaptation (the arches/overall architectural plan). Calling them "designed in a broad sense" and "structurally necessary parts of the arch" blurs the distinction precisely where G&L wanted it sharp: between the *target* of selection (the arch design) and its *necessary consequences* (the spandrel shapes). You're arguing the distinction is less fundamental than G&L claimed.
      *   **Fix Cost:** **Cheapest (Clarification).** Acknowledge this is your *adaptationist-friendly reinterpretation* of the analogy, emphasizing that *functional integration* makes the distinction between "selected-for" and "necessary-byproduct-with-exapted-function" methodologically challenging and sometimes less critical *for functional analysis*. You don't need to abandon it, just frame it as your perspective.
      *   **How Bad:** Minor philosophical disagreement with G&L's emphasis, not a core inconsistency in your *own* set *if* you clearly own this interpretation. It doesn't conflict with your other points internally.

  4.  **Point 5 (No Need for Gene Mappings) vs. Demands for Rigor (Implied by Adaptationism/Spandrel Distinction)**
      *   **Tension:** **Minimal / Surface Only.** This is primarily a methodological stance facing *external* criticism, not a strong *internal* tension. Your black-box approach (focusing on design, function, and selective history inference without genes) is consistent with Points 1, 3 (revised), 4, and 6. Distinguishing complex adaptations from complex spandrels *can* often be done at the phenotypic/functional level without specific genes (e.g., via comparative biology, paleontology, development). Genes are powerful evidence but not strictly *necessary* for initial inference.
      *   **Fix Cost:** **None Needed Internally.** This is a defensible methodological position. Just be prepared to argue that phenotypic evidence *can* be sufficient for reasonable inference, even if genetic evidence is ultimately desirable.
      *   **How Bad:** Not a real internal conflict within your stated profile. Potential external criticism point.

  **The Single Most Impactful Revision:**

  **Revise Point 3 (Current Utility Heuristic).**

  *   **Original:** "I rely on current utility as my main heuristic: complex trait + currently useful = primafacie evidence of selection for that function, absent a clear non-adaptive origin."
  *   **Revised:** "I consider current utility a strong *initial indicator of adaptive value*. For complex traits, this warrants investigation into whether the utility arises from direct selection for that function (adaptation) or via exaptation of a structural byproduct (spandrel). Inference of *selection for a specific function* requires additional evidence beyond current utility (e.g., comparative analysis, evidence of design specificity, phylogenetic history, developmental constraints)."

  **Why this Revision is Key:**

  1.  **Resolves the Severe Tension:** It directly addresses the core conflict with Points 2 & 4 by decoupling "current utility" from "selection for that function," explicitly opening the door for the spandrel/exaptation pathway you acknowledge exists everywhere.
  2.  **Strengthens Adaptationism (Point 1):** It replaces a weak heuristic with a more robust, multi-evidence approach to *inferring selection*, aligning better with strong adaptationist methodology.
  3.  **Supports Point 4:** By requiring more evidence to claim "adaptation," it reduces the risk of over-ascribing selection and helps identify cases where something is more likely an exaptation.
  4.  **Compatible with Points 5 & 6:** It doesn't require gene mappings (Point 5) and fits with your view of integrated functional design blurring the spandrel/adaptation line in practice (Point 6).
  5.  **Preserves Core Insight:** It still recognizes current utility as a crucial starting point and indicator that a trait *matters* evolutionarily (has adaptive value), maintaining the practical utility of your heuristic while making it far more accurate.

  This revision maintains your strong adaptationist leanings while incorporating the reality of spandrels in a methodologically sound way, resolving the most significant internal tensions in your profile. The other points (1,2,4,5,6) can largely stand as is, with minor clarifications (especially for Point 6).
