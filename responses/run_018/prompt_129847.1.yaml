answer: |-
  ## Thought Experiment
  In a neighborhood carpool group, Maya insists on perfect fairness: she meticulously logs every mile driven and minute waited, demands instant repayment for minor deviations (e.g., asking for $0.35 if she drives an extra half-mile), and publicly corrects any perceived imbalance, even if it’s a parent letting a child ride without exact calculation. Her relentless precision eradicates all informal goodwill. People stop offering spontaneous lifts or accepting small favors, fearing triggering her accounting. The once-flexible, supportive carpool collapses into rigid, distrustful transactions. A merely decent person would overlook minor discrepancies, preserving the group's cooperative spirit through mutual tolerance.

  ## Analysis
  *   **Belief/Action:** Maya's belief that *every* interaction must be calibrated to perfect, immediate, quantifiable fairness, eliminating all moral slack or informal tolerance.
  *   **Maximal Specificity:** Moderate goodness accepts minor imbalances as the price of smooth cooperation. Maximal goodness, by definition, permits *no* such slack; it demands perfect rectification *always*, leaving no room for discretion or uncalculated trust.
  *   **Defender's Counter:** A defender could argue Maya isn't *destroying* a true good but *exposing* a flawed system reliant on convenient moral laziness. The collapse reveals the group's prior cooperation was built on unexamined inequities. Maya's rigor forces a necessary confrontation with imperfect fairness, pushing the group towards a *more genuinely* just structure, even if painful initially. The harm stems from others' resistance to true justice, not her commitment.
