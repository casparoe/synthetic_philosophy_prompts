answer: |-
  ## Q&A Preparation Sheet: Defending the Generic Analysis of Dispositions

  **Thesis:** Disposition ascriptions ("glass is fragile," "sugar is soluble") are best analyzed as *generics* (e.g., "Glasses of this kind normally break when struck," "Sugar normally dissolves when immersed in water"). This generic structure inherently contains a normal-conditions restriction and a characteristic-manifestation expectation, dissolving fink, mask, and antidote counterexamples without ad hoc patches to the conditional analysis.

  **Audience Commitments & Load-Bearing Points:**
  *   **Powers Theorists (PT):** Commit to dispositions (powers) being real, irreducible, causally productive properties fundamental to ontology. Will resist any analysis that seems to reduce dispositions to mere patterns or eliminate their intrinsic causal role.
  *   **Sparse-Property Realists (SPR):** Commit to dispositions being among the sparse, natural properties carving reality at its joints. Will resist analyses making dispositions overly context-dependent or anthropocentric.
  *   **Philosophers of Science (Measurement) (PoS-M):** Focus on precise operationalization, context-sensitivity in measurement, and the relationship between theoretical properties and their measurable manifestations. Will be sensitive to vagueness and practical applicability.
  *   **Load-Bearing Points:** 1) The *inherent normativity* of generics (not an add-on). 2) The *explanatory power* of dissolving counterexamples by appealing to linguistic norms rather than metaphysical patches. 3) Maintaining that dispositions are *real properties* (even if ascribed generically). 4) The *robustness* of "normal" in natural language compared to technical/philosophical "ideal conditions."

  ---

  **Likely Objections & Replies (Ordered by Likelihood & Damage):**

  1.  **Objection (PT/SPR): "You've eliminated the causal *oomph*! If fragility is just a claim about what *normally* happens, you've reduced a real, intrinsic power of the glass to a mere statistical regularity or expectation. What does the *actual breaking* when struck under non-fink conditions? Doesn't this make dispositions epiphenomenal?"**
      *   **Reply (2 min):** Absolutely not! The generic *ascription* captures the *pattern* of manifestation characteristic of the kind, but it doesn't eliminate the underlying property. The glass *has* a real microstructural property (say, its bonding structure) that *is* the causal basis. When struck under normal conditions, *that property* is causally responsible for breaking. The generic tells us this property *characteristically manifests* as breaking when struck. It describes the reliable causal connection *associated with* the property-type under standard scenarios for its kind. The causal power remains in the property; the generic tells us about its *standard behavioral signature*.
      *   **Weakness:** This relies on a distinction between the property and its generic description that powers theorists may see as artificial. It doesn't *fully* satisfy the desire for dispositions *themselves* to be the irreducible causal relata in every instance.

  2.  **Objection (SPR/PT): "Your 'normal' is hopelessly vague and context-dependent. What's normal for *this* glass? Its kind? This lab? This planet? Sparse properties can't be this mushy! This makes dispositions subjective or relational, not intrinsic features carving nature's joints."**
      *   **Reply (2 min):** The context-dependence is a *feature* of natural language and scientific practice, not a bug. "Normal" for a disposition ascription is anchored in the *characteristic environment and function* associated with the *kind* of thing being ascribed. For "glass is fragile," normal conditions are those typical for glass objects *qua* glass objects (e.g., terrestrial temperatures, standard atmospheric pressure, typical handling forces). This reflects how science identifies properties: solubility is defined relative to standard solvents (water) and conditions (STP) for chemical kinds. It *is* objective that, *for the kind 'table sugar',* dissolving in water at 20°C is the characteristic manifestation. The property grounding this remains sparse and intrinsic; the ascription specifies its *standard operational context*.
      *   **Weakness:** Defining "characteristic environment/function" for novel or artificial kinds can be tricky, potentially introducing circularity ("characteristic" often implies dispositional behavior). It requires careful metaphysics of kinds.

  3.  **Objection (PT): "Finks and masks are *real physical possibilities*. Your analysis just *defines them away* by calling them 'abnormal.' But doesn't a good metaphysics need to account for what the disposition *is* even in those abnormal scenarios? What *makes* the glass fragile when it's hooked to the finkish sorcerer?"**
      *   **Reply (2 min):** The generic analysis doesn't deny the glass *has* the disposition (the underlying property) when finks/masks are present. It denies that the *truth of the ascription "fragile"* requires that the conditional holds *in those specific, non-normal setups*. The sorcerer-finked glass *has* the microstructural property that, *under the conditions normal for glass objects*, causes breaking when struck. The fink creates an *abnormal* causal pathway preventing manifestation *here and now*. The generic ascription remains true because it speaks to the *characteristic* behavior under *normal* triggering for the kind. We account for the disposition in abnormal scenarios by pointing to the *same underlying property* that grounds the generic claim.
      *   **Weakness:** This requires accepting that the *truth* of "X is D" can be independent of whether X *would* manifest D in the *actual* triggering situation if a fink/mask is present. This feels counterintuitive to some (though it mirrors how we use generics: "Birds fly" is true even if *this* bird has a broken wing).

  4.  **Objection (PoS-M): "Measurement requires precision. How do we *operationalize* 'normal conditions' for disposition testing? Your analysis seems to replace the clear (if flawed) stimulus-response conditional with a vague appeal to norms, making empirical verification harder."**
      *   **Reply (2 min):** Science *already* implicitly uses generic-like norms! Standard test protocols *define* "normal conditions" for measuring solubility, fragility, conductivity, etc. (e.g., ASTM standards). These protocols specify solvent, temperature, pressure, force application method – precisely to establish the *characteristic manifestation* under controlled, *standard* conditions. The generic analysis makes this explicit. It doesn't hinder measurement; it *reflects* how measurement works. We don't test solubility by dropping sugar into sulfuric acid and declaring it insoluble if it chars; we use water at 20°C because *that's the normal condition for that manifestation*. The counterexamples highlight *deviations* from these standardized test conditions.
      *   **Weakness:** While true for established dispositions, defining "normal" for *novel* dispositions or in entirely novel environments (e.g., exoplanets) poses challenges the conditional analysis (in principle) avoids, even if it fails practically.

  5.  **Objection (SPR): "Doesn't this make dispositions extrinsic? Whether 'soluble' is true of this sugar seems to depend on what counts as 'normal' for sugar, which seems to depend on facts about the world (like water being common), not just the sugar's intrinsic structure."**
      *   **Reply (2 min):** The *underlying basis* (e.g., ionic lattice structure) is intrinsic. The *truth of the ascription* "soluble" depends on two things: 1) The presence of that intrinsic basis, and 2) The fact that, *in the environment characteristic of the kind 'sugar'*, that basis *characteristically causes* dissolving in the characteristic solvent (water). While the *ascription* references the kind's context, the *property* being ascribed – the specific causal potential grounded in the microstructure – is intrinsic. "Soluble" *means* "has a structure that *characteristically* dissolves in water under normal conditions for sugars." The intrinsic structure is necessary; the generic context specifies the *manifestation type*.
      *   **Weakness:** The line between the intrinsic basis and the context-dependent ascription is fine. Critics might argue the manifestation type (dissolving in water) is essential to *identifying* the property as *solubility*, making it seem extrinsic.

  6.  **Objection (PT): "What about mimickers? Imagine something that *isn't* glass, but is rigged (by constant intervention) to break every time it's struck under 'normal' glass conditions. Your generic analysis would wrongly call it 'fragile,' but it lacks the real power! The conditional analysis gets this right."**
      *   **Reply (2 min):** This conflates the *ascription* with the *property*. The mimicker satisfies the generic "normally breaks when struck under normal glass conditions" *only because of constant intervention*, not because it possesses the intrinsic property characteristic of *glass-kind* objects. We wouldn't *ascribe* "fragile" *simpliciter* to it; we'd say "it behaves *like* fragile glass" or "it's *fragile-under-constant-intervention*." The generic ascription "fragile," applied to an object *as* a member of a kind, implies the characteristic manifestation arises from the kind's *characteristic basis* under normal conditions. The mimicker lacks that basis. Its behavior is *accidentally* generic, not grounded in the right property.
      *   **Weakness:** This relies heavily on the metaphysics of kinds and their characteristic bases. It requires that "fragile" ascriptions are tied to kind-membership in a way that excludes mere behavioral mimics, which needs careful unpacking.

  7.  **Objection (PoS-M/SPR): "You claim generics solve the problems 'without ad hoc conditions.' But isn't 'normal conditions' just as much an 'ad hoc' restriction as 'ideal conditions' or 'if nothing interferes' in patched conditional analyses? How is yours better?"**
      *   **Reply (2 min):** The crucial difference is *provenance*. "Ideal conditions" or "no interference" clauses are *philosophical inventions* tacked onto the conditional to save it from counterexamples. They lack grounding in how we actually *use* disposition terms. In contrast, the "normal conditions" restriction is *inherent* to the *generic form* of the ascription itself. It's not added *by us*; it's *part of the meaning* of generics like "Bs are F" or "Xs do Y when Z" in natural language. We observe this normativity in countless generics ("Birds fly," "Arsenic is poisonous," "Engines convert fuel to motion"). My analysis doesn't *add* a restriction; it *identifies the existing linguistic structure* of disposition ascriptions. The restriction is ad hoc only if generics themselves are ad hoc – but they are a fundamental and well-documented feature of language.
      *   **Weakness:** While linguistically sound, this doesn't fully address the *metaphysical* worry that "normal" might still be too vague or anthropocentric for a sparse property ontology. It shifts the burden to linguistics.

  **The Question I Hope Nobody Asks:**

  *   **Objection (PT/SPR): "You argue that the 'normal' in generics isn't circular because it's pre-theoretic. But doesn't determining what's 'normal' for a kind *itself* rely on recognizing the *characteristic dispositions* and *characteristic manifestations* of that kind? Isn't 'normal' defined dispositionally, making your analysis viciously circular? What grounds the norms if not the very dispositions you're trying to analyze?"**
      *   **Planned Reply (Deep Breath):** This is a profound challenge. The response has two parts: 1) **Developmental/Empirical:** Our grasp of "normal" for a kind is often acquired *ostensively* through statistically prevalent patterns of interaction and manifestation within a stable environment, *before* we have a rich theory of dispositions. We learn "glass breaks when dropped" through repeated observation *before* theorizing about fragility. 2) **Metaphysical:** The "normal" for a natural kind is constitutively tied to the kind's *evolutionary history* and *functional role* within its ecosystem or domain. The characteristic manifestations (e.g., dissolving for sugar, breaking for glass) are those that were *reliably produced* by the kind's intrinsic properties in the *environment that shaped the kind's identity and our recognition of it*. The dispositions and the norms co-evolve in our understanding of the world. The circle isn't vicious; it's hermeneutic, reflecting how our concepts latch onto stable causal structures in nature.
      *   **Weakness:** This reply borders on naturalistic metaphysics/epistemology and may feel unsatisfying to pure powers realists seeking a reductive or non-circular foundational account. It potentially makes dispositions and norms co-primitive in a way that powers theorists might resist. It's the hardest point to defend against a committed opponent.
