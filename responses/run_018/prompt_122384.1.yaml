  ### **Move 6: Theo's Relativism & Hidden-Stakes Problem**
  - **Claim 1:** Low standards in no-stakes contexts are acceptable; high-stakes intuitions arise in *their own contexts*.  
  - **Claim 2:** Encroachment has a "hidden-stakes" flaw: Ana could lose knowledge due to *unknown* stakes (secret hacker threat), which is absurd.  
