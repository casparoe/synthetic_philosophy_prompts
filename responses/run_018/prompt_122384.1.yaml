  - **Claim:** Ana (low stakes) tells Ben (high stakes) the bank is open. Intuitively, "Ana knows" remains true *even in Ben's high-stakes context*. If contextualism sets standards via the speaker/attributor (Ben), it should falsely deny Ana's knowledge.  
  - **Who's right?** Mara exposes a **weakness in strict speaker-contextualism**. The intuition that Ben should affirm "Ana knows" is strong.  
