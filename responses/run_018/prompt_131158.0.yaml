answer: |-
  Here's a reusable decision procedure based on Hofstadter's "distributed self" concept, designed for clinical mediation. It focuses on **validating claims about carrying a "fragment" of the patient's identity**, not on care decisions. **One outcome will be unpopular.**

  **Core Principles:**
  1.  A "valid fragment" requires BOTH accurate representation of the patient's *known past self* AND a persistent pattern of hosting that representation.
  2.  Accuracy is primary. Emotion without accuracy is projection. Accuracy without emotion *can* be a valid fragment (Hofstadter's model is cognitive).
  3.  Claims are tested against verifiable evidence of the patient's past identity (values, preferences, personality).
  4.  It stops at metaphysics. If a claim passes the checks, it's "coherent enough for discussion." If it fails, it's "not supported as a distributed self-fragment." Values conflicts about *weight* given to valid fragments are for mediation.

  **The Procdure: Step-by-Step Questions & Thresholds**

  1.  **Establish Claimant's Basis:**
      *   *Question:* "What specific part of [Patient's Name]'s identity, values, or preferences do you believe you carry or represent? Can you give concrete examples?"
      *   *Sufficient Answer:* Identifies specific, verifiable aspects (e.g., "Their fierce independence," "Their belief in quality over quantity of life," "Their love of jazz music," "Their meticulous planning nature"). Must go beyond vague feelings ("their spirit," "their essence").
      *   *Stop/Fail:* Vague, metaphysical, or purely emotional descriptions without link to specific past traits/preferences. *E.g., "I just feel him with me, guiding me."* -> **Claim lacks concrete basis. Does not proceed.**

  2.  **Test Predictive Accuracy (The Gatekeeper):**
      *   *Question:* "Based on what you know of [Patient] *before their illness*, what would they likely say/choose about [specific, verifiable past preference or hypothetical scenario relevant to *current* decisions]?" (Ask 3-5 distinct, specific questions. Mix known past facts & plausible hypotheticals). *Examples: "What was their favorite vacation spot and why?", "If they found a wallet with $100, what would they do?", "What was their stance on prolonged mechanical ventilation for themselves, based on past conversations?", "How would they prioritize spending time with family vs. work commitments?"*
      *   *Sufficient Answer:* Answers align with verifiable evidence (documents, witnessed past statements/actions, widely acknowledged traits) or highly consistent with established patterns for at least **70% of the questions**. Consistency is key.
      *   *Stop/Fail:* Answers contradict verifiable evidence or established patterns for **>30% of key questions**. *E.g., Spouse claims patient hated jazz (verifiably false) or would choose aggressive intervention (contradicts living will/documented convo).* -> **Accuracy threshold not met. Claim invalid as distributed self-fragment.** (Proceed only if accuracy passes).

  3.  **Assess Pattern Consistency & Emotional Connection (Secondary Check):**
      *   *Question A (Pattern):* "How consistently has this aspect of [Patient] been part of your thoughts, decisions, or sense of self *over a significant time*, especially since their illness? Describe specific instances."
      *   *Question B (Emotion):* "What emotional connection, if any, do you feel to this part of [Patient] that you carry? How does it manifest?"
      *   *Sufficient Answer (Pattern):* Describes a persistent, observable pattern of referencing, embodying, or being influenced by this specific aspect in their own life/decisions over months/years. *E.g., Adult child consistently cites patient's documented pragmatism in all medical meetings.*
      *   *Sufficient Answer (Emotion):* Any description of emotional resonance, comfort, burden, guidance, etc., is accepted as *subjective reporting*. Lack of emotion is also acceptable.
      *   *Stop/Note (Not Fail):*
          *   Pattern is weak/absent? -> **Claim lacks persistence as a hosted pattern. Validates *knowledge* but not necessarily a distributed *fragment*.**
          *   Strong Emotion + Strong Pattern? -> **Validates emotional resonance of the fragment.**
          *   Strong Pattern + No Emotion? -> **Validates cognitive fragment.**
          *   Strong Emotion + Weak Pattern? -> **Suggests emotional projection, not validated fragment (if Accuracy passed, fragment is weak).**
      *   *(This step categorizes the *nature* of the claim but doesn't invalidate it if Accuracy passed).*

  4.  **Address Estrangement/Recency (Special Case Filter):**
      *   *Trigger:* Claimant had minimal/no contact with patient for years pre-illness.
      *   *Question:* "Given the long period without significant interaction, how did this specific aspect of [Patient] establish itself as a persistent pattern *within you*? What evidence supports its accuracy regarding *their* past self?"
      *   *Sufficient Answer:* Must provide **strong, verifiable evidence** of the claimed aspect AND a plausible mechanism for pattern persistence *despite* estrangement (e.g., deeply formative early influence documented in letters/therapy, active study of patient's writings/philosophy during estrangement). High bar for Accuracy (85%+).
      *   *Stop/Fail:* Relies solely on recent feelings, intuition, or vague memories without strong evidence. -> **Insufficient basis to claim a persistent distributed fragment. Likely recent construction/projection.**

  **Applying the Procdure to Test Cases:**

  1.  **Case: Spouse (Deep Presence, Predicts Preferences Wrong)**
      *   Step 1: Passes (Describes patient's "joyful spirit" and "love of family gatherings" - concrete).
      *   Step 2 (Accuracy - Gatekeeper): FAILS. Spouse predicts patient would want "every possible intervention" (contradicts patient's documented DNR wishes and past statements about not wanting to be a burden). Accuracy <30%. **-> CLAIM INVALID. Distributed self-fragment claim does not hold up.** (Family may *hate* this - challenges the intuitive caregiver).

  2.  **Case: Adult Child (Predicts Preferences Right, Denies Emotional Bond)**
      *   Step 1: Passes (Identifies patient's "rational, data-driven approach to life decisions" - concrete).
      *   Step 2 (Accuracy): PASSES. Correctly cites patient's living will, accurately predicts patient's likely choices on 4/5 hypotheticals based on past behavior (>70%).
      *   Step 3:
          *   Pattern: Passes (Child consistently uses data/patient's documented logic in meetings).
          *   Emotion: Reports *no* emotional bond, just "carrying out their logical framework."
      *   **Result: VALID COGNITIVE FRAGMENT.** The claim of carrying a part of the patient's self (their rational decision-making framework) is coherent and supported, despite lack of emotion.

  **What This Procdure CANNOT Do (Critical Limitations):**

  1.  **Decide Care Withdrawal:** It only assesses *claims about identity fragments*. The *weight* given to a valid fragment in the *actual care decision* is a separate, values-based mediation process.
  2.  **Resolve Values Conflicts:** If multiple *valid* fragments point to different conclusions (e.g., valid rational fragment says withdraw, valid compassionate fragment says wait), this procedure doesn't resolve that. That's core mediation territory.
  3.  **Prove "True" Selfhood:** It judges coherence/support, not metaphysical truth. A "valid fragment" means the claim meets practical criteria for inclusion in the discussion, not that it *is* the patient.
  4.  **Handle Pure Intuition/Spirituality:** Claims based *solely* on unverifiable spiritual feelings fail Step 1/2. They can be *expressed* as values/beliefs, but not validated as distributed self-fragments via this method.
  5.  **Force Agreement:** It provides a structured way to *evaluate* claims, not to make families accept the evaluation. An invalidated claim might still hold immense *personal* significance.
  6.  **Deal with Contradictory Patient Histories:** If evidence of the patient's past self is genuinely contradictory, the Accuracy test becomes harder. Mediator judgment on what constitutes "verifiable evidence" is crucial.
  7.  **Eliminate Grief/Pain:** Logic won't dissolve deep emotional wounds. This is a tool for structure, not a cure for suffering.

  **Remember:** When steps hit "Stop/Fail" or "Values Judgment," **that's your cue to shift mediation gears.** "This claim isn't supported as a fragment by our criteria, but your feeling is real and important to discuss" or "We have two valid fragments pointing different ways; let's talk about how we navigate that conflict." Keep the metaphysics trapdoor closed! Good luck – this is tough, necessary work.
