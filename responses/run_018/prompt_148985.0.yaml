answer: |-
  Your observation identifies a sophisticated and under-theorized pattern in historical explanation. I am **highly confident** (90%) that no single, widely established term exists in the philosophy of history or social science specifically for *this precise oscillation* tied to moral severity. However, I can define the phenomenon precisely, distinguish it, and propose a fitting name.

  **Precise Definition of the Phenomenon:**
  It is **the asymmetric and unacknowledged reliance on distinct explanatory frameworks based on the perceived moral valence or extremity of the action being explained within the *same context and population*.** Specifically:
  1.  **Explanandum 1 (Baseline/"Expected" Harm):** Actions perceived as "routine compliance" within an oppressive structure (obeying orders, bureaucratic participation, standard killing under duress) are explained primarily through *situational mechanisms* (e.g., authority, conformity, peer pressure, routinization, career advancement, dehumanization via distancing).
  2.  **Explanandum 2 ("Excess"/"Gratuitous" Violence):** Actions perceived as exceeding orders or structural requirements (spontaneous cruelty, extreme brutality beyond necessity, acts driven by apparent personal animus) trigger an implicit shift to explanations emphasizing *dispositional or deep cultural factors* (e.g., inherent sadism, ingrained hatred, ideological fervor, cultural pathology).
  3.  **The Crucial Features:**
      *   **Asymmetry:** The shift happens primarily *towards* dispositional/cultural explanations for "excess" acts, not symmetrically the other way.
      *   **Moral Trigger:** The shift is driven by the *perceived moral transgression or extremity* of the specific act.
      *   **Unacknowledged Boundary:** The switch occurs without explicit justification for why situational factors are deemed insufficient for explaining the "excess" acts *in those specific instances*.
      *   **Same Context/Population:** It applies to *the same individuals or groups* within the same historical context (e.g., members of Police Battalion 101).

  **Distinguishing from Related Concepts:**

  1.  **Multi-Causal Explanation:** This phenomenon *is* multi-causal in the abstract sense that both situational and dispositional factors are invoked. However, the *problem* lies in:
      *   **Selective Application:** Factors aren't integrated or weighed consistently. Different factors are given *explanatory primacy* based solely on the perceived extremity of the action, not based on evidence that they *actually* played a different causal role in that specific instance.
      *   **Implicit Hierarchy:** It creates an implicit hierarchy where situational factors explain the "normal" baseline, leaving dispositional factors to explain the "deviant" excess, reinforcing a potentially misleading distinction.
      *   **Lack of Integration:** It avoids the harder task of showing *how* situational pressures might *interact with* or *activate* pre-existing dispositions/cultural tropes to produce *both* baseline compliance *and* "excess" violence.

  2.  **Different Explanations for Different Populations:** This phenomenon specifically applies when explaining *different behaviors* performed by the *same individuals or group*. It's not about saying "Group A was situational, Group B was dispositional." It's about saying "When *this same group* did X (routine killing), it was situation Y; but when *this same group* did Z (excessive brutality), it was disposition W."

  **Proposed Names:**

  1.  **Moral Valence-Triggered Explanatory Shift (MV-TES):**
      *   **Strengths:** Directly captures the core mechanism (moral valence of the action triggering the shift) and the nature of the phenomenon (explanatory shift).
      *   **Weaknesses:** Slightly technical.

  2.  **Explanatory Boundary-Switching (EBS):**
      *   **Strengths:** Highlights the implicit "boundary" situational explanations seem to hit when explaining "excess" acts, necessitating a switch to a different register.
      *   **Weaknesses:** Less specific about the trigger (moral valence).

  3.  **The Atrocity Explanation Discontinuity:**
      *   **Strengths:** Emphasizes the problematic break in explanatory logic specifically concerning extreme violence ("atrocity").
      *   **Weaknesses:** Longer, implies the discontinuity is inherent rather than a methodological artifact.

  **Recommendation:** **Moral Valence-Triggered Explanatory Shift (MV-TES)** seems the most precise and descriptive term for the phenomenon you've identified.

  **Confidence Assessment:**

  *   **High Confidence (90%) in No Established Term:** My research and knowledge of key debates in philosophy of history (e.g., Hempel, Dray, White, Ankersmit), social psychology (Milgram, Zimbardo, Bandura), and Holocaust historiography (Browning, Goldhagen, Hilberg, Bartov) confirm no single, standard term exists for *this specific oscillation pattern tied to moral severity*.
  *   **High Confidence (85%) in the Definition/Distinction:** The pattern you observe is well-defined and distinct from simple multi-causality or population-based differences. It highlights a significant methodological pitfall.
  *   **Moderate Confidence (70%) in the Proposed Terminology (MV-TES):** While the *phenomenon* is clearly identifiable, coining a new term is inherently speculative. MV-TES best captures the core mechanism. This is the point I'm **least sure about** regarding its universal acceptance, though I'm confident it accurately *describes* the phenomenon.
  *   **Lower Confidence (60%) on the Universality of the Boundary:** I'm slightly less sure whether *all* historians relying on situational explanations *actually* believe their models inherently *cannot* explain "excess" violence, or if the shift is sometimes just an unreflective rhetorical habit. However, the *effect* of the shift is as you describe.

  **Significance:** Identifying MV-TES is crucial. It challenges historians to either:
  1.  Explicitly justify why situational factors *cannot* explain specific "excess" acts within their framework, or
  2.  Develop more integrated models showing how situational pressures can foster or enable behaviors perceived as "excess" without resorting to unexplained dispositional leaps, or
  3.  Acknowledge that the distinction between "routine" and "excess" violence might be less clear-cut or analytically useful than assumed.

  Your analysis points to a deep and often unexamined tension in explaining human behavior under extreme conditions.
