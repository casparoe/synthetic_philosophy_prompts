answer: |-
  Here's an analysis of the 1381 Peasants' Revolt through the specified historiographical lenses, followed by the structured JSON summary.

  **Analysis:**

  1.  **Microhistory (Scale Reduction):**
      *   **Visible:** This lens brings into sharp focus the *local* origins and dynamics. We see village-level networks organizing the marches (e.g., communication between Essex/Kent villages, local leaders like Abel Ker of Erith). The symbolic burning of manorial rolls in specific villages (e.g., Bocking, Maidstone) becomes a targeted act of liberation from local lordship, not just random destruction. John Ball's role shifts from a vague "radical priest" to a specific actor with established local connections through his preaching tours in Kent and Essex, making his "When Adam delved..." sermon tangible. The contingent role of individuals is highlighted: Wat Tyler's leadership qualities (or lack thereof) in negotiations, the specific interactions at Mile End and Smithfield, and the pivotal, chaotic moment of Tyler's death at the hands of Mayor Walworth and the King's entourage.
      *   **Obscured/Misdescribed:** This scale makes invisible the coordinated royal strategy *before* the revolt reached London (e.g., the Crown's persistent attempts to enforce the poll tax nationally, the initial paralysis in responding to the uprising). It struggles to account for the long-term fiscal structure (the Crown's reliance on parliamentary taxation for war funding, the evolution of the poll tax itself over three levies) or the deep-seated structural tensions between landlords and peasants over serfdom and labour services that created widespread discontent. The *scale* of the revolt – its simultaneous eruption across multiple counties – appears anomalous or coincidental rather than part of a broader pattern.

  2.  **History from Below (Subordinate Groups as Agents):**
      *   **Visible:** This framing centers peasants (free and unfree), artisans (like London supporters), and lower clergy (like Ball) as the primary historical agents driving the revolt. It foregrounds their motivations: the explicit, widespread demands voiced at Mile End (end of serfdom/villeinage, fixed low rents at 4d/acre, pardon for rebels) and echoed in local actions (destruction of records symbolizing serfdom). It reveals a significant degree of shared collective consciousness – a common understanding of oppression (serfdom, unfair taxes, corrupt officials like the poll tax commissioners) and shared goals for liberation and justice. It highlights durable agency *outside* elite institutions: the ability to organize locally, march on London, and force the King to negotiate, demonstrating power independent of the aristocracy or Crown structures.
      *   **Obscured/Misdescribed:** The quick collapse after Tyler's death presents a challenge. Does it undermine the claim of durable agency? This lens argues it *does not* inherently undermine it. Instead, it shows that bottom-up agency, while real and potent, is always overdetermined by the overwhelming coercive power of the state and ruling class. The rebels' agency forced a crisis and concessions (many charters of manumission were issued post-Mile End), but lacked the permanent military or institutional power to withstand the state's organized violence (royal armies, judicial commissions) once leadership fractured and the King reasserted control. The lens might struggle to fully explain the *variation* in local participation and demands without resorting to local specifics (microhistory) or broader structures.

  3.  **State-Centered Narrative (Crisis of Authority):**
      *   **Visible:** This lens excels at explaining the *crisis* from the Crown's perspective. It effectively captures the trigger: the disastrous implementation of the third poll tax and the Crown's desperate need for revenue. It clearly explains the state's response: initial paralysis, the tactical concession at Mile End to diffuse immediate pressure and split the rebels, the decisive military suppression after Smithfield, and the subsequent legal restoration of order through punitive commissions revoking the charters and executing rebels. It frames the revolt primarily as a threat to royal authority, aristocratic privilege, and the established social order that required, and ultimately received, a forceful reassertion of state power.
      *   **Obscured/Misdescribed:** This lens suppresses the deep-seated *local motivations* beyond tax resistance: the burning hatred of serfdom and the desire for personal freedom and economic justice central to peasant actions. It obscures the sophisticated *non-elite coordination* that enabled the marches and actions across counties. Rebels become a reactive, homogenous "mob" responding to taxation, rather than proactive agents with diverse but converging grievances focused on dismantling manorial lordship. The widespread, specific demand to abolish serfdom is downplayed or seen merely as opportunistic plunder.

  **Reversing the Analysis: What the Revolt Reveals About the Theories**

  *   **Microhistory:** The rapid dissolution *after* Tyler's death strongly **confirms** the microhistorical emphasis on contingency and the pivotal role of individual personality/leadership. The revolt's trajectory hinged on specific, unpredictable moments (the Smithfield confrontation, Tyler's killing). However, the revolt also **reveals a limitation** of pure microhistory: it struggles to explain *why* the state's coercive response (armies, judges) was so immediately effective across the board. This effectiveness depended on pre-existing, deep-rooted *structural* power (monopoly of legitimate violence, legal frameworks, aristocratic control of land/military service) that microhistory, focused on the local and contingent, often backgrounds. The revolt shows microhistory needs structural context to fully explain outcomes.
  *   **History from Below:** The remarkable geographic spread of near-identical core demands (end serfdom, fix rents, punish "traitors") across Essex, Kent, Suffolk, Norfolk, etc., **strongly supports** the history-from-below thesis about a shared "collective consciousness" or class awareness (in a broad, pre-industrial sense) among the lower orders. It demonstrates a widespread understanding of common exploitation and common goals transcending purely local concerns. However, the **absence of lasting organization** following suppression **exposes a gap** in the framework. While it correctly identifies state overdetermination as the cause of collapse, the revolt highlights the difficulty subordinate groups faced in translating episodic, powerful agency into sustained institutional power capable of resisting the state and aristocracy long-term. History from below effectively captures the *aspiration* and *moment* of agency but struggles to fully account for its inherent fragility against consolidated elite power without deeper analysis of state structures.

  **(Note on Contested Interpretation:** The *degree* of pre-existing organization/networks and the *exact* nature/extent of "class consciousness" are areas of scholarly debate. The interpretation of the Mile End concessions (sincere tactic vs. cynical ploy) and whether the rebels had a coherent "program" beyond core demands is also debated. The analysis above relies on the broadly agreed outline: widespread rebellion triggered by poll tax, core demands against serfdom and for justice, march on London, Mile End meeting, Smithfield confrontation/Tyler's death, rapid suppression.)

