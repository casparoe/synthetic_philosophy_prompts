answer: |-
  ### Teaching Plan in Prose

  **Session Goal:** To demonstrate why Kant’s universalizability tests are logical machinery—formal procedures for evaluating maxims—rather than intuition pumps (narratives that elicit gut feelings). We focus on the **Formula of Universal Law (FUL)** and its two tests (*contradiction-in-conception* and *contradiction-in-will*), then distinguish it sharply from the **Formula of Humanity (FH)**, emphasizing their non-interchangeability and non-consequentialist nature.

  **Audience Considerations:** Participants are professionals in science/engineering fields. Avoid jargon; anchor concepts in their domain. Preempt common misreadings (e.g., consequentialism, Golden Rule) that arise when Kant is presented without philosophical training.

  **Core Example:** A scientist considers suppressing a non-critical outlier in replication data to preserve a socially valuable theory. Maxim:  
  *"I will suppress one outlier in replication data when it threatens a valuable theory, on the condition that detection is unlikely."*  

  **Why this example?**  
  - **Required features:** Ambiguous moral pull (plausible benefit vs. integrity violation) and transparent logical structure (clear maxim for universalization).  
  - **Excluded features:** No visceral revulsion (e.g., suicide) that triggers emotion over logic.  
  - **Why not standard examples?** False-promise/suicide cases provoke emotional reactions that short-circuit analysis; this example’s professional relevance encourages dispassionate engagement.

  ---

  #### Sequence of Components  
  1. **Groundwork: The Maxim (10 min)**  
     - **What:** Define a maxim as a personal rule of action: *"I will do X in circumstance Y to achieve Z."*  
     - **Why start here?** Universalizability operates on maxims. Without this, the "logical machinery" has no input.  
     - **Example:** Break down the outlier-suppression maxim into its components (action, circumstance, goal).  

  2. **Introduce Formula of Universal Law (FUL) (5 min)**  
     - **What:** FUL: *"Act only on maxims you can will to be universal laws."*  
     - **Why now?** Establishes universalizability as a formal test. Stress it is **not** about outcomes but logical consistency.  
     - **Dependency:** Maxims must be defined before testing.  

  3. **Contradiction-in-Conception Test (15 min)**  
     - **What:** Ask: *"Can this maxim be universalized without self-contradiction?"*  
       - If everyone followed it, would the action become impossible?  
     - **Example:** Universalizing outlier suppression → replication collapses (scientists expect data manipulation → trust erodes → replication loses meaning).  
     - **Why before contradiction-in-will?** This is the first filter. If the maxim self-destructs logically, no further test is needed.  

  4. **Contradiction-in-Will Test (10 min)**  
     - **What:** Ask: *"Can a rational agent will this maxim universally without undermining their own goals?"*  
     - **Example:** Even if replication *could* survive (no contradiction-in-conception), scientists rationally will "knowledge advancement." Universal suppression sabotages this goal → contradiction-in-will.  
     - **Why after contradiction-in-conception?** Tests a deeper rational conflict *only if* the maxim passes the first test.  

  5. **Introduce Formula of Humanity (FH) (15 min)**  
     - **What:** FH: *"Treat humanity as an end, never merely as a means."*  
     - **Why now?** FH must follow FUL to prevent conflation. Emphasize:  
       - FUL tests logical coherence; FH tests intrinsic value of rational beings.  
       - They are distinct tools (e.g., outlier suppression might pass FUL in a twisted world but fail FH by deceiving peers).  
     - **Dependency:** FUL must be solidified first to contrast FH’s focus on moral status vs. universalizability.  

  6. **Address Misconceptions (10 min)**  
     Weave corrections into the above steps at these junctures:  
     - **Consequentialism confusion:** During FUL intro (Step 2). **Move:** Contrast "logical contradiction" with "bad outcomes." *"The test fails if the maxim self-destructs—not if it causes harm."*  
     - **Golden Rule equivalence:** During maxim definition (Step 1). **Move:** *"Kant isn’t about reciprocity (Golden Rule) but whether your rule can coherently bind all rational agents."*  
     - **"Bad outcomes" as contradiction:** During contradiction tests (Steps 3–4). **Move:** *"Contradiction occurs if the action becomes impossible or irrational—not because society collapses."*  
     - **Collapsing FUL and FH:** During FH intro (Step 5). **Move:** *"FUL asks: ‘Is this rule logically universalizable?’ FH asks: ‘Does this action respect persons?’ They’re separate checks."*  

  7. **Check for Understanding (5 min)**  
     - **Question:** *"Suppose the scientist’s maxim passes contradiction-in-conception (somehow, replication survives universal outlier suppression). Why might it still fail contradiction-in-will?"*  
     - **Correct answer:** Reveals grasp of rational willing (e.g., *"Scientists necessarily will knowledge integrity; universal suppression makes this impossible"*).  
     - **Incorrect answer:** Reveals consequentialism (e.g., *"It would cause bad science"*) or emotional discomfort (*"It’s just wrong!"*).  

  8. **Wrap-Up (5 min)**  
     Reiterate: Kant’s tests are *machinery* because they use logic (non-contradiction) to vet maxims—not intuition.  

  #### Omitted Material  
  - **Metaphysics of freedom:** Too abstract; irrelevant to applying the tests.  
  - **Kingdom of ends:** A derivative concept; adds complexity without clarifying core distinctions.  
  - **Textual exegesis:** Not needed for conceptual grasp; risks alienating non-specialists.  

  ---

