prompt: |-
  As a journalist who covers science and ideas, I run a seventy-five-minute interdisciplinary salon for professionals in science editing, policy, and engineering—none with formal philosophy training. At our last meeting, a biologist colleague asked over coffee why philosophers treat Kant's universalizability tests as logical machinery rather than moral intuition pumps, and I want next month's session to answer precisely that. The concept I need taught is Kant's universalizability framework, specifically the distinction between the Formula of Universal Law—with its internal contradiction-in-conception and contradiction-in-will tests—and the Formula of Humanity, emphasizing that they are not interchangeable and that universalizability is not consequentialist reasoning in disguise.

  Do not explain Kant to me; instead, plan the explanation for this audience. Specify the order in which the components must be introduced and why that dependency holds—what logical idea must be in place before universalizability can even be formulated, how the two formulas should be separated, and in what sequence the two contradiction tests should be introduced within the first formula. For the carrying example, do not use the classic false-promise or suicide cases; instead, build the session around a contemporary research-ethics maxim: a scientist considers suppressing a single non-critical outlier in a replication dataset to preserve a theory she judges socially valuable, with the maxim being "I will suppress one outlier in replication data when it threatens a valuable theory, on the condition that detection is unlikely." Explain what this example must possess—ambiguous intuitive moral pull but a transparent logical structure—and what it must lack—immediate emotional revulsion that short-circuits analysis—to serve as the session's backbone, and why the standard examples fail on these criteria. Then map the misconceptions the audience will bring or form: treating universalizability as a consequentialist calculus, reading it as the Golden Rule, interpreting contradiction as "if everyone did this, bad outcomes would follow," and collapsing the two formulas into a single test. For each, identify the exact point in the sequence where it should be headed off and with what conceptual move. Include one check for understanding—an applied question using the replication-outlier case that reveals whether participants grasp the logical structure of contradiction rather than merely expressing moral discomfort—and state clearly what should be left out at this level (for instance, the metaphysics of freedom, the kingdom of ends, or any textual exegesis of specific works) with a brief justification for each omission.

  Present your teaching plan in prose, then provide a brief structured summary as a JSON object with the following fields: "sequence_steps" (array of objects with "order", "component", "dependency_rationale"), "carrying_example" (object with "scenario", "required_features", "excluded_features", "why_not_standard"), "misconceptions" (array of objects with "label", "entry_point_in_sequence", "deflection_move"), "understanding_check" (object with "question", "what_correct_answer_reveals", "what_incorrect_answer_reveals"), "omitted_material" (array of objects with "item", "reason_for_omission"), and "session_duration_minutes".
reasoning: |-
  We are designing a 75-minute interdisciplinary salon session for professionals without formal philosophy training. The goal is to explain Kant's universalizability tests (specifically the distinction between the Formula of Universal Law and the Formula of Humanity) and to address why they are treated as logical machinery rather than moral intuition pumps. The session will use a contemporary research ethics example about suppressing an outlier in replication data.

  ## Teaching Plan in Prose

  ### Introduction (5 minutes)
  - **Objective:** Set the stage and explain the session's goal. Frame the biologist's question: Why are Kant's universalizability tests treated as logical machinery? Explain that we will explore Kant's framework as a system of logical tests for moral maxims, not as a way to pump intuitions.
  - **Key Point:** Emphasize that Kantian ethics is deontological (duty-based) and non-consequentialist. The test is about the form of the maxim, not the consequences.

  ### Step 1: The Concept of a Maxim (10 minutes)
  - **Component:** Introduce the concept of a maxim as a subjective principle of action. Explain that every action has a maxim, which is the reason for acting, expressed as a rule (e.g., "I will do X in circumstances Y to achieve Z").
  - **Dependency Rationale:** Without the concept of a maxim, we cannot even begin to apply the universalizability tests. The maxim is the input to the machinery.
  - **Carrying Example:** Present the research ethics maxim: "I will suppress one non-critical outlier in replication data when it threatens a valuable theory, on the condition that detection is unlikely." Break it down: action (suppress), circumstances (threat to valuable theory, low detection risk), purpose (preserve the theory).
  - **Why Start Here?** It grounds the abstract philosophy in the professionals' world.

  ### Step 2: The Formula of Universal Law (FUL) and Its Role (5 minutes)
  - **Component:** Introduce FUL: "Act only according to that maxim whereby you can at the same time will that it should become a universal law." Explain that this is a test of whether the maxim can be universalized without contradiction.
  - **Dependency Rationale:** We must establish the universal law formula as the first test and set it apart from the Formula of Humanity. This step sets up the logical machinery.

  ### Step 3: The Two Tests within FUL (20 minutes)
  - **Component:** Break down FUL into two tests: contradiction in conception (CC) and contradiction in will (CW).
    - **Contradiction in Conception (CC):** Explain that we try to imagine a world where the maxim is a universal law of nature. If the maxim becomes a universal law, does it lead to a logical contradiction? That is, would the action become impossible or self-defeating? (E.g., if everyone suppressed outliers, the concept of replication would collapse because replication requires reporting all data. Thus, the practice would destroy itself.)
    - **Contradiction in Will (CW):** If no CC, then we ask: Could a rational agent will such a maxim as a universal law without contradicting their own will? This involves what we necessarily will as rational beings (e.g., we will the advancement of knowledge, but suppressing outliers undermines that).
  - **Order of Introduction:** Start with CC because it is the first test and easier to grasp (logical impossibility). Then introduce CW as a deeper test of rationality.
  - **Dependency Rationale:** CC must come first because it is a more straightforward logical test. If the maxim fails CC, it is strictly forbidden. Only if it passes CC do we consider CW.
  - **Carrying Example Application:**
    - **CC Test:** If everyone suppressed outliers when detection is unlikely, replication studies would become untrustworthy. Scientists would know that others might be suppressing data, so they would not rely on replication studies. This would make replication meaningless, hence a contradiction in conception (the practice destroys itself).
    - **CW Test:** Assume no CC (for the sake of argument). Could we will a world where outlier suppression is universal? We, as rational agents, necessarily will the progress of science, which depends on honest reporting. But universal suppression would undermine science, so we cannot will it without contradicting our own rational will.

  ### Step 4: Distinguishing FUL from the Formula of Humanity (FH) (15 minutes)
  - **Component:** Introduce FH: "Act in such a way that you treat humanity, whether in your own person or in the person of any other, always at the same time as an end and never merely as a means." Explain that FH is a separate test focusing on respecting rational agency.
  - **Dependency Rationale:** After FUL, to avoid collapsing the two formulas. FH is not about universalizability but about treating persons as ends. It must be introduced separately to show that Kant provides multiple formulations of the categorical imperative, each with a distinct focus.
  - **Carrying Example:** In the suppression case, using FH: suppressing the outlier might be treating other scientists (and the public) as mere means to the end of preserving a theory (by deceiving them). Also, the scientist is not treating herself as an end (by compromising her integrity).

  ### Step 5: Addressing Misconceptions (10 minutes)
  At this point, we address common misconceptions that may arise. We weave these in as we go, but we explicitly tackle them after introducing both formulas to consolidate understanding.

  - **Misconception 1: Universalizability as Consequentialist Calculus**
    - **Entry Point:** When explaining the tests (especially CW), participants might think that the "bad outcomes" (like collapse of science) are the reason for the contradiction.
    - **Deflection Move:** Emphasize that the contradiction is logical or volitional, not about consequences. In CC, it's about the maxim becoming self-defeating (e.g., universal suppression makes replication impossible, so the maxim cannot even be conceived as universal). In CW, it's about what we rationally will, not the outcomes per se. The outcomes are just signs of the contradiction.

  - **Misconception 2: Reading it as the Golden Rule**
    - **Entry Point:** When introducing FUL, because the Golden Rule also uses universalization.
    - **Deflection Move:** Clarify that the Golden Rule is about reciprocity (do unto others) and is consequentialist in spirit (if I were in their place...). Kant's test is about logical consistency of the maxim. The Golden Rule focuses on the agent's desires, but Kant focuses on rationality.

  - **Misconception 3: Contradiction as "If everyone did this, bad outcomes would follow"**
    - **Entry Point:** In the CC and CW explanations, especially when using the example.
    - **Deflection Move:** Reiterate that the test is not about bad outcomes but about whether the maxim can be thought without contradiction (CC) or willed without contradiction (CW). For instance, in the example, the bad outcome (loss of trust) is the mechanism of the contradiction, but the contradiction is in the concept or the will.

  - **Misconception 4: Collapsing the Two Formulas**
    - **Entry Point:** After introducing FH, participants might try to apply FH as a universalizability test.
    - **Deflection Move:** Explicitly contrast: FUL is about universalizability of the maxim, FH is about respecting persons. They are distinct and non-interchangeable.

  ### Step 6: Check for Understanding (5 minutes)
  - **Question:** "Suppose a scientist considers suppressing an outlier. Using the CC test, why would universalizing the maxim lead to a contradiction in conception? And what about the CW test?"
  - **What Correct Answer Reveals:** The participant should explain that universal suppression would make replication studies unreliable and thus destroy the practice of replication (CC). For CW, they should say that we cannot rationally will a world where science is undermined because we necessarily will the progress of knowledge (a rational end).
  - **What Incorrect Answer Reveals:** If they focus on consequences (e.g., "it would cause harm to society") or express only moral discomfort without the logical structure, they are not grasping the Kantian logic.

  ### Step 7: Wrap-up and Q&A (5 minutes)
  - Reiterate the key takeaway: Kant's tests are logical machinery because they are formal tests of maxims, not intuition pumps. They rely on rationality and non-contradiction.

  ### Omitted Material
  1. **Metaphysics of Freedom:** Because it is foundational but highly abstract and not necessary for applying the tests.
  2. **Kingdom of Ends:** It's a further formulation that unifies the others but is not essential for understanding the core distinction here.
  3. **Textual Exegesis:** We avoid deep dives into Kant's texts because the audience lacks training and we are focusing on concepts.

  ### Why This Example?
  - **Required Features:**
    - Ambiguous intuitive moral pull: The scientist has a plausible reason (preserving a valuable theory) and the action is not obviously wrong (non-critical outlier, low detection). This invites analysis.
    - Transparent logical structure: The maxim can be clearly stated and tested for universalization.
  - **Excluded Features:**
    - Immediate emotional revulsion: Unlike false-promise (lying) or suicide (self-destruction), this does not trigger strong emotions that bypass reasoning.
  - **Why Not Standard Examples?** The false-promise case often evokes strong feelings about lying, and suicide is emotionally charged. Both can short-circuit the logical analysis. The outlier case is professional and relevant to the audience.

