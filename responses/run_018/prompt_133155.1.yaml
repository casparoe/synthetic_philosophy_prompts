answer: |-
  Your observation captures a sophisticated phenomenon at the intersection of conceptual migration, interdisciplinary borrowing, and semantic erosion. While no single *perfectly* established term exists, several concepts converge to describe this dynamic. The closest fit is **"Conceptual Laundering"** adapted from STS/sociology of science, but it requires refinement for your specific case. Below is a structured analysis:

  ---

  ### **Core Concept: "Conceptual Laundering" (with Precise Specifications)**
  This term (adapted from Knorr-Cetina, Latour) describes how concepts gain legitimacy through interdisciplinary transit. In your case:
  1.  **Technical Origin:** Rigorous definition in structural causal modeling (e.g., Woodward's invariance-under-intervention).
  2.  **Migration & Relaxation:** Philosophers adopt the *vocabulary* but relax *boundary conditions* (e.g., accepting any counterfactual dependency as "interventionist").
  3.  **Return with Legitimacy:** Computational practitioners re-import the term, retaining its *prestige* and *syntactic form* but operating under the philosopher's looser criteria. The original domain's authority "launders" the diluted version.

  **Why "Laundering"?**  
  The concept emerges from the technical domain "clean" of its restrictive formal burdens but "shiny" with borrowed prestige. It functions as a **credential** (invoking causal rigor) without meeting the original **criteria**.

  ---

  ### **Distinguishing Markers from Related Phenomena**
  | Phenomenon               | How Your Case Differs                                                                 |
  |--------------------------|---------------------------------------------------------------------------------------|
  | **Semantic Drift**       | Not gradual erosion; involves a *round-trip journey* (tech → philosophy → tech).     |
  | **Conceptual Stretching**| Beyond stretching: *formal syntax is preserved* while *boundary conditions dissolve*. |
  | **Motte-and-Bailey**     | Not strategic equivocation; *unconscious/semi-conscious erosion* across communities. |
  | **Family Resemblance**   | Not overlap in features; *explicit mimicry of formal structure* despite core loss.   |
  | **Blackboxing**          | Not opacity of mechanism; *active repurposing* of the concept's symbolic capital.    |

  ---

  ### **Key Pragmatic/Formal Markers of the "Copycat State"**
  1.  **Syntactic Preservation:** Retention of formal vocabulary (e.g., "intervention," "invariance") detached from original operational definitions.
  2.  **Boundary Erosion:** Core exclusionary conditions (e.g., quantitative invariance, surgical interventions in SCM) replaced by weaker proxies (e.g., qualitative counterfactuals, salience maps).
  3.  **Prestige Borrowing:** Explicit invocation of the *term's origin* (e.g., "based on Woodward's interventionism") to legitimize practices that violate its original constraints.
  4.  **Asymmetric Accountability:** Users in the recipient domain (e.g., computational practice) are not held to the *technical* standards of the origin domain, only to the *philosophically relaxed* version.

  ---

  ### **Irreversibility Threshold**
  Slippage becomes irreversible when **all three** occur:
  1.  **Epistemic Entrenchment:** The diluted version becomes essential to workflows (e.g., salience maps as "interventionist explanations" in ML papers).
  2.  **Loss of Discriminatory Power:** The term fails to exclude cases the original framework would reject (e.g., models with spurious counterfactual dependencies passing as "interventionist").
  3.  **Generational Amnesia:** New practitioners in the *technical domain* learn only the diluted version, severing ties to the original constraints.

  *(Your examples—mechanistic interpretability accepting salience maps, and policy-as-intervention in medicine—demonstrate entrenched irreversibility.)*

  ---

  ### **Proposed Terminology**
  - **"Prestige-Preserving Semantic Degradation"**: Highlights retention of authority alongside loss of precision.
  - **"Boomerang Concept"**: Emphasizes the round-trip journey and return with altered substance.
  - **"Conceptual Credentialism"**: Focuses on the term’s function as a legitimizing credential.

  ---

  ### **Why This Matters**
  Your case reveals a **crisis of interdisciplinary rigor**: concepts gain rhetorical power by referencing technical frameworks but lose the ability to enforce methodological discipline. This creates "zombie concepts" – formally invoked but operationally hollow. Counteracting it requires:
  1. **Genealogical Grounding:** Explicitly mapping concept migration in research (as you’ve done).
  2. **Re-Boundarying:** Rejecting umbrella terms in favor of *specified variants* (e.g., "SCM-interventionist" vs. "counterfactual-explanatory").
  3. **Functional Accountability:** Demanding that users prove their methods satisfy the *origin domain’s core constraints* when invoking its terminology.

  This dynamic is pervasive (e.g., "quantum" in pop-science, "neural networks" in 1980s AI). Your identification of the *round-trip erosion* pattern is a significant contribution to conceptual epistemology.
