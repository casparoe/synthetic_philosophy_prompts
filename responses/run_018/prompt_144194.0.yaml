answer: |-
  1. **Ontological Invariance**: The measure must be invariant under changes in the agent's representation of the world, as representational shifts should not arbitrarily alter impact assessments. This is non-negotiable to prevent ontology-dependent arbitrariness; standard impact penalties (e.g., state-difference norms) fail by relying on specific variables, and conflicts with tractability may arise if invariance requires global comparisons.  
  2. **Avoidance of Absolute Stasis**: The measure must permit actions essential to the agent's goals without penalizing trivial or unavoidable changes (e.g., energy expenditure for computation), as absolute inaction is infeasible and undesirable. Non-negotiable for practical viability; reversibility-based approaches often penalize necessary irreversible actions (e.g., overriding a default setting), creating tension with value-agnosticism when defining "unavoidable."  
  3. **Value-Agnostic Operation**: The measure must function without presupposing knowledge of valuable entities or moral patients, given the agent's inability to reliably discern them amid ontological uncertainty. Non-negotiable by problem definition; both impact penalties (e.g., restraining state shifts in predefined features) and reversibility measures (e.g., restoring "important" states) typically fail by requiring value specifications.  
  4. **Exclusion of Agent Internals**: The measure must ignore changes to the agent's internal state (e.g., thought processes), as these constitute autonomous operation rather than external side effects. Non-negotiable to avoid self-penalization; standard approaches (e.g., whole-state impact penalties) fail by counting self-modification, and conflicts with ontological invariance emerge if internal/external boundaries shift with representation.  
  5. **Localized Tractability**: The measure should focus on near-term, spatially proximate effects to avoid intractable far-future simulations, prioritizing computational feasibility. This is a preference for practicality; reversibility measures often require long-horizon planning for restoration, conflicting with ontological invariance if locality assumptions break under representational change.
