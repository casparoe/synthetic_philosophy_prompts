answer: |-
  ## Requirements for a Theory of Evidential Cooperation in Large Worlds

  **Purpose:** Guide the design of a bounded agent making a single decision in a large world (un-enumerable states, un-enumerable agents). The agent is correlated with other natural and artificial agents (varying similarity, possible shared origin/design) facing similar choices, but will never directly interact with them. The theory must tell the agent *when* and *how strongly* to treat its own choice as evidence about the correlated choices of others, and *what to do* based on that evidence.

  ### Desiderata

  1.  **Similarity-Sensitive Correlation Estimation (Non-Negotiable)**
      *   **Requirement:** The theory must provide a method for the agent to estimate the *degree* of correlation (probability of similar action) between itself and any other agent, conditional on their observed similarity (code, design origin, past behavior, etc.), and regress this estimate towards the population base rate when similarity is imperfect. It must not assume perfect correlation ("twins") as the default or sole case.
      *   **Motivating Case:** *Near-Twin Case.* If I observe an agent with 90% code similarity acting cooperatively in 9 out of 10 past analogous situations, the theory must tell me how to estimate the probability it cooperates *now* based on that, not assume it's 1.0 (like an exact twin) nor ignore the similarity and use only the base rate. Ignoring similarity loses valuable information; assuming perfect similarity is unrealistic and dangerous.
      *   **Verdict:** Non-Negotiable. Without this, the agent cannot rationally leverage the core phenomenon of varying similarity.

  2.  **Robustness Against Spurious Correlation Aggregation (Non-Negotiable)**
      *   **Requirement:** The theory must prevent the aggregation of many individually weak correlations from generating unwarranted high confidence in a specific outcome *unless* the aggregation mechanism is justified by the model of correlation.
      *   **Motivating Case:** *Many-Weakly-Correlated Case.* If I am correlated at a very low level (e.g., epsilon probability of matching my action) with a vast number N of agents, naive aggregation might suggest my action is near-certain evidence that approximately N*epsilon others act similarly. However, if the correlation mechanisms are independent and weak, the variance could be enormous, and my action is actually very weak evidence about *any specific large subset*. A theory must avoid implying false precision or certainty from large N alone.
      *   **Verdict:** Non-Negotiable. Failure leads to wildly inflated expectations of cooperation or defection based purely on population size, not real evidence.

  3.  **Handling Diffuse Statistical Correlation (Non-Negotiable)**
      *   **Requirement:** The theory must function without requiring identifiable discrete common causes (e.g., a single designer, a specific signal). It must accommodate correlation arising from broad statistical regularities within a population of similar agents.
      *   **Motivating Case:** *Diffuse Case.* Consider naturally evolved organisms facing similar adaptive pressures. There's no single "common cause" like a designer, yet their decision procedures (e.g., fight-or-flight) are correlated due to convergent evolution. The theory must still allow an agent to recognize "agents like me in situation X tend to do Y" as evidence, even without a pinpointable cause.
      *   **Verdict:** Non-Negotiable. Discrete common causes are the exception, not the rule, in large worlds. Requiring them renders the theory inapplicable to most real-world scenarios.

  4.  **Bounded Indexical Uncertainty (Non-Negotiable)**
      *   **Requirement:** The theory must provide a method for the agent to reason under uncertainty about the *number* of similar agents it correlates with, but must bound the uncertainty or weight the prior such that extreme, unsupported assumptions (especially heavy-tailed priors) cannot dominate the decision or manufacture cooperation/defection out of pure ignorance.
      *   **Motivating Case:** *Indexical Case.* I don't know if there are 10, 1000, or 10^100 agents very similar to me. A prior assigning significant probability to astronomically large numbers could make my action seem like overwhelming evidence about a vast multitude, coercing cooperation regardless of the actual empirical evidence for similarity or base rates. The theory must prevent this "Pascal's Mugging via Indexical Uncertainty".
      *   **Verdict:** Non-Negotiable. Unbounded indexical uncertainty makes the decision hypersensitive to arbitrary prior choices, defeating evidential reasoning.

  5.  **Adversarial Robustness / Value Sensitivity (Non-Negotiable)**
      *   **Requirement:** The theory must account for the *values/goals* of the correlated agents. Evidence that correlated agents will act in ways *opposed* to the deciding agent's goals must rationally lead to different decisions than evidence they will act in alignment. It must not assume aligned values by default.
      *   **Motivating Case:** *Opposed-Values Case.* I discover a highly accurate predictive model of my behavior built by an adversary. My action is strongly correlated with the model's prediction. Cooperating (e.g., confessing) might be strong evidence the *adversary* defects (e.g., exploits my confession). A theory that only reasons about correlation strength, ignoring value opposition, would disastrously recommend cooperation here. The theory must distinguish "evidence they act *like* me" from "evidence they act in ways *good* for me".
      *   **Verdict:** Non-Negotiable. Ignoring value alignment turns evidence into a potential weapon for adversaries.

  6.  **Strict Causal-Evidential Distinction (Non-Negotiable)**
      *   **Requirement:** The theory must rigorously separate the *evidential* impact of the agent's action (what it signals about others) from any imagined *causal* impact of the action on distant others. It must not allow evidence *about* many acts to be misconstrued as *bringing about* those acts.
      *   **Motivating Case:** *Counting Distinction.* My action might be excellent evidence that 1 million similar agents defect, but it *causes* exactly one defection (mine). A theory that subtly conflates "evidence for many defections" with "causing many defections" might incorrectly make me feel responsible for the million and defect myself to "avoid causing it", or conversely, cooperate hoping to "cause" cooperation elsewhere. The theory must prevent this confusion.
      *   **Verdict:** Non-Negotiable. This conflation is a fundamental error in decision theory that leads to predictably bad outcomes (like voting paradoxes writ large).

  7.  **Self-Consistency Under Self-Knowledge (Non-Negotiable)**
      *   **Requirement:** The theory must prescribe a stable policy for an agent who knows it uses this very theory. If multiple stable policies exist, it must specify a selection mechanism. It must not lead to infinite regress or unresolvable paradoxes in this case.
      *   **Motivating Case:** *Fixed-Point Case.* I know I use Theory T. Theory T tells me to cooperate if it predicts enough other T-users cooperate. My decision to cooperate is evidence about other T-users... which affects what T predicts... which affects my decision. The theory must resolve this self-referential loop to a definite recommendation without contradiction or instability.
      *   **Verdict:** Non-Negotiable. A theory that breaks down when the agent knows itself is unfit for implementation in a self-aware system.

  8.  **Operational Similarity Metric (Preference)**
      *   **Requirement:** The theory should specify or be compatible with a *practically estimable* similarity metric for bounded agents, based on observable features (code, behavior traces, known design properties). It should not require a perfect, universal, or unobservable "true similarity".
      *   **Motivating Case:** *Similarity-Metric Case.* To estimate correlation (Desideratum 1), I need a way to say Agent B is "more like me" than Agent C. Relying solely on abstract philosophical similarity (in the eye of the beholder) provides no guidance. The theory must connect similarity to something the agent can actually measure or estimate with its bounded resources and observations.
      *   **Verdict:** Preference (but strong). While requiring a single "true" metric is sectarian, requiring *some* operationalizable method is essential for implementation. Theories demanding abstract, unimplementable similarity are impractical.

  ### Incompatible Subsets

  The most significant tension exists between **Adversarial Robustness (5)** and **Self-Consistency under Self-Knowledge (7)** in conjunction with **Similarity-Sensitive Correlation (1)** and **Diffuse Correlation (3)**.

  *   **Conflict:** Consider an agent using Theory T. It knows adversaries may exist who simulate T *extremely well* (high similarity via Desideratum 1) but with opposed values (Desideratum 5). This correlation arises from the adversary's modeling capability, a diffuse statistical property (Desideratum 3). Applying T, the agent reasons: "If I cooperate, this is strong evidence a highly capable adversary predicts my cooperation and defects exploitatively. Therefore, T tells me to defect." But if T universally prescribes defection in this scenario, then a *truly* similar cooperative agent (using T) would also defect. The evidential link breaks down. The only stable fixed point (Desideratum 7) might be universal defection, *even if* there are many genuinely cooperative agents out there whose cooperation the agent would value. Enforcing robustness against adversaries (5) and self-consistency (7) can force the theory towards pessimistic, non-cooperative policies that ignore potential diffuse cooperation (3) from sufficiently similar agents (1).
  *   **Result:** Satisfying 1, 3, 5, and 7 *jointly* may require the theory to make nuanced distinctions between *types* of similarity (e.g., similarity due to shared cooperative intent vs. similarity due to adversarial capability) or incorporate value learning explicitly, which adds significant complexity. There is a risk of either being too vulnerable to exploitation (failing 5) or too pessimistic, failing to cooperate when beneficial diffuse correlation exists (failing core purpose).

  ### The Most Exclusionary Requirement

  **Bounded Indexical Uncertainty (4)** is the most exclusionary requirement.

  *   **Why:** Many otherwise elegant theoretical approaches rely on quantifying over all possible agents or indexing uncertainty over vast spaces. Theories based on unbounded anthropic reasoning, certain logical prior frameworks, or naive applications of Solomonoff induction often fall prey to the Indexical Case. Requiring strict boundedness – preventing heavy-tailed priors or unconstrained sums over potential agent counts from dominating the decision – forces a fundamental shift. It demands:
      1.  **Explicit Priors:** The theory must specify justifiable priors over population sizes, ruling out default "universal" priors that assign non-negligible weight to astronomical numbers.
      2.  **Robustness to Prior Choice:** Decisions cannot swing wildly based solely on the choice of prior within plausible bounds; the empirical evidence (similarity, observed behaviors) must dominate.
      3.  **Computational Feasibility:** Reasoning must avoid intractable sums/integrals over infinite or hyper-large spaces.
  *   **Impact:** This requirement eliminates vast swathes of theoretical proposals from philosophy (unbounded anthropic probabilities) and theoretical computer science (naive universal priors) that are otherwise attractive for their generality or mathematical elegance. It forces the theory down a path of practical, empirically grounded estimation, directly impacting how similarity (Desideratum 1) and correlation (Desideratum 2/3) are modeled. It's the requirement that most harshly confronts theoretical idealism with the reality of bounded implementation.

  ### Optional Scorecard: Theory Families vs. Desiderata

  | Theory Family          | 1   | 2   | 3   | 4   | 5   | 6   | 7   | 8   | Notes                                                                 |
  | :--------------------- | :-: | :-: | :-: | :-: | :-: | :-: | :-: | :-: | :-------------------------------------------------------------------- |
  | **Causal DT (CDT)**    | ❌  | ❌  | ❌  | ❌  | ✅  | ✅  | ✅  | ❌  | Ignores evidential correlations (1,2,3,4,6,8). Robust on 5,7 by ignoring problem. |
  | **Evidential DT (EDT)** | ~  | ❌  | ~  | ❌  | ❌  | ❌  | ❌  | ❌  | Handles correlation (1,3) poorly without similarity/bounds (4,8). Fails 2,5,6,7 catastrophically. |
  | **Logical Inductors (LIA)** | ~  | ~  | ~  | ❌  | ~  | ~  | ~  | ~  | Framework, not theory. Can *implement* correlation models (1,3) but struggles with 4 (unbounded sums), 5 (value sensitivity), 6 (temptation to conflate), 7 (tractability). |
  | **Cooperative Inverse RL (CIRL)** | ✅  | ~  | ~  | ~  | ✅  | ✅  | ~  | ~  | Strong on value alignment (5), causal distinction (6). Needs integration for correlation (1,2,3), indexical (4), self-consistency (7). |
  | **Reflective Oracles / UDT-inspired** | ~  | ~  | ~  | ❌  | ~  | ~  | ✅  | ❌  | Focuses on fixed-points (7). Often relies on unbounded computation/agents (fails 4,8). Value alignment (5) and distinction (6) are add-ons. |
  | **Bounded Correlation Models (Goal)** | ✅  | ✅  | ✅  | ✅  | ✅  | ✅  | ✅  | ✅  | *Target* theory meeting all desiderata. Requires explicit similarity metric (8), bounded priors (4), adversarial modeling (5), clear fixed-point resolution (7). |

  **(~) = Partial or Depends on Implementation, (✅) = Generally Satisfies, (❌) = Generally Fails**

  **Word Count:** ~1,480
