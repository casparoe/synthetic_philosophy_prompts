answer: |-
  Here is a rigorous specification of adequacy conditions for a philosophical account of "Western values," organized by desiderata, conflicts, and assessment of major approaches. The goal is **conceptual coherence**, not advocacy.

  ---

  ### **I. Desiderata for a Coherent Account**
  *(What the account MUST achieve)*

  1.  **Extension Specification:**
      *   **Desideratum:** Define the core, stable elements constituting "Western values" and their relationship (e.g., natural kind, historical cluster, family resemblance, institutional complex).
      *   **Motivating Case:** Does "Western values" meaningfully include both Athenian democracy *and* modern human rights charters? Must it encompass liberal individualism *and* Christian social thought? An account must justify inclusions/exclusions beyond mere geography or chronology.

  2.  **Historical Grounding & Distinction:**
      *   **Desideratum:** Distinguish between:
          *   (a) Values *distinctively generated or institutionalized* within the historical trajectory of (post-Greco-Roman) Europe/North America.
          *   (b) Values *expressed prominently* within that trajectory but potentially having analogues or foundations elsewhere (e.g., rule of law, rational inquiry).
          *   (c) Values *universally aspirational* but often *invoked* as "Western" (e.g., human rights).
      *   **Motivating Case:** Without this, claims like "individualism is uniquely Western" collapse upon examining non-Western individualist traditions (e.g., certain strains of Buddhism, Renaissance-era Anatolia), while ignoring the unique *institutional synthesis* (e.g., individual rights + secular state + capitalism) developed in the West.

  3.  **Argumentative Function Explanation:**
      *   **Desideratum:** Explain the concept's role in real-world discourse:
          *   As a **civilizational boundary marker** (e.g., Huntington's "Clash," EU accession criteria).
          *   As a **normative benchmark** (e.g., grounding international human rights law, democracy promotion).
          *   As a **foil for critique** (e.g., postcolonial, Marxist, or multicultural critiques accusing it of imperialism, hypocrisy, or exclusion).
          *   As a **rhetorical tool** (e.g., domestic political mobilization "defending Western values").
      *   **Motivating Case:** Any coherent account must explain *why* this category persists and functions powerfully in political and ethical debates, not just what it contains. Its usage shapes global politics and self-understanding.

  4.  **Internal Tension Accommodation:**
      *   **Desideratum:** Accommodate inherent contradictions without dissolving the concept:
          *   **Universalism vs. Particularism:** Claims to universal validity (human rights) vs. assertions of unique Western cultural heritage/civilizational identity.
          *   **Liberty vs. Equality:** Tensions between individual freedom (negative liberty) and social justice/egalitarianism.
          *   **Secularism vs. Religious Heritage:** The role of Christianity in shaping values vs. the secular character of modern institutions.
          *   **Ideal vs. Practice:** Aspirational values (freedom, equality) vs. historical realities (colonialism, slavery, exclusion).
      *   **Motivating Case:** Dismissing these tensions (e.g., ignoring colonial violence while promoting "freedom") renders the account historically naive and normatively weak. Coherence requires explaining how the concept functions *despite* or *through* these tensions.

  5.  **Normative vs. Descriptive Clarity:**
      *   **Desideratum:** Explicitly state whether the account is primarily:
          *   **Descriptive/Historical:** Identifying what *has been called or functioned as* "Western values."
          *   **Normative/Prescriptive:** Defining what Western values *ought to be* (e.g., their "best" or "authentic" interpretation).
          *   **Analytical:** Explaining the concept's structure and use.
      *   **Motivating Case:** Conflation is rampant (e.g., using a descriptive origin story to justify a normative claim). A coherent account must avoid this equivocation.

  ---

  ### **II. Conflicts Among Desiderata (Joint Unsatisfiability)**
  Some desiderata inherently pull in opposing directions:

  1.  **Historical Specificity vs. Normative Universality:**
      *   **Conflict:** Desideratum 2(a) demands values *distinctive* to the West's historical path, potentially excluding compelling analogues (e.g., Neo-Confucian meritocracy, Islamic rationalism/legalism). However, Desideratum 3 (as normative benchmark) and the universalist strand in Desideratum 4 require the values to be *applicable and justifiable cross-culturally*. A historically specific account struggles to ground universal norms; a universalist account struggles to explain why these norms are "Western."
      *   **Example:** Can Human Rights be both *universal* and a *distinctive product of Western history* without implying Western superiority or ignoring non-Western foundations for dignity?

  2.  **Cohesive Extension vs. Accommodating Internal Tensions:**
      *   **Conflict:** Defining a clear, stable extension (Desideratum 1) risks downplaying or smoothing over the deep contradictions (Desideratum 4) that are empirically and normatively central to the concept's usage and history. A focus on tensions risks making the extension too fragmented to be coherent.
      *   **Example:** Emphasizing "individual liberty" as core clashes with communitarian or social-democratic traditions also claimed as "Western." Which is definitive?

  ---

  ### **III. Non-Negotiables vs. Camp-Specific Preferences**
  *   **Non-Negotiables (For *any* coherent account):**
      1.  **Historical Grounding & Distinction (2):** Must avoid ahistorical abstraction. Values don't float free of context.
      2.  **Internal Tension Accommodation (4):** Must acknowledge the concept's contested and paradoxical nature.
      3.  **Normative/Descriptive Clarity (5):** Must avoid fatal equivocation.
      4.  **Argumentative Function Explanation (3):** Must account for the concept's real-world discursive power.
  *   **Camp-Specific Preferences:**
      1.  **Emphasis on Distinctiveness (2a) vs. Universality (2c):** Conservatives/civilizationalists prioritize distinctiveness; liberals/cosmopolitans prioritize universality.
      2.  **Resolution of Tensions:** Some camps (e.g., certain liberals) prioritize reconciling liberty/equality; others (e.g., critical theorists) emphasize their irreconcilability within the Western frame.
      3.  **Core Extension:** Which elements are *essential* (e.g., Christianity, Enlightenment rationalism, liberalism) is highly contested between different ideological/cultural positions *within* the West.

  ---

  ### **IV. Assessment of Account Types**
  *(Against the Desiderata & Conflicts)*

  1.  **Genealogical-Institutional Account:**
      *   *Core:* Traces historical emergence & institutionalization of values (e.g., Greco-Roman law + Christianity + medieval corporations + Enlightenment + capitalism → modern bundle).
      *   **Strengths:** Excels at **Historical Grounding/Distinction (2)**, especially 2(a,b). Strong on explaining **Argumentative Functions (3)** related to identity/boundaries. Can accommodate **Internal Tensions (4)** as historical legacies.
      *   **Weaknesses:** Struggles with **Normative Universality (2c)** – values appear contingent products of history, not universal. **Extension (1)** might be overly complex/historicist. **Normative/Descriptive Clarity (5)** can be challenging if genealogy implies normativity. Hits the **Specificity/Universality Conflict** hard.

  2.  **Normative-Functional Account:**
      *   *Core:* Defines "Western values" by their normative function within a (idealized) social/political system (e.g., values necessary for liberal democracy, human rights realization, or market societies).
      *   **Strengths:** Best at handling **Normative Universality (2c)** and serving as a **Normative Benchmark (3)**. Can offer a clearer **Extension (1)** based on functional necessity. Better equipped to address the **Universality** side of the conflict.
      *   **Weaknesses:** Often weak on **Historical Specificity/Distinction (2a,b)** – risks being ahistorical or implying functional equivalents are identical ("Was Athens liberal?"). May downplay **Internal Tensions (4)** by presenting an idealized, coherent system. Struggles to explain the concept's use as a **Civilizational Boundary Marker (3)** if values are purely functional/universal. Prone to **Normative/Descriptive (5)** conflation.

  3.  **Purely Discourse-Analytic Account:**
      *   *Core:* Treats "Western values" solely as a rhetorical construct within power-laden discourses, with no stable referent ("essentially contested concept").
      *   **Strengths:** Superb at analyzing **Argumentative Functions (3)**, especially as foil, boundary marker, or tool of power. Explicitly embraces **Internal Tensions (4)** as constitutive. Clearly **Descriptive (5)**. Avoids reification.
      *   **Weaknesses:** Fails **Extension Specification (1)** by definition (no stable core). Rejects **Historical Grounding (2)** as anything other than discursive claims. Cannot support **Normative Universality (2c)** or provide a **Normative Benchmark (3)** beyond critiquing its use. Does not resolve conflicts; dissolves the concept's potential coherence entirely. Offers no basis for cross-cultural dialogue using the term.

  ---

  **Conclusion on Coherence:** Achieving full coherence across *all* desiderata is likely impossible due to the **Specificity/Universality Conflict** and the **Cohesion/Tension Conflict**. A minimally coherent account must prioritize the **Non-Negotiables**: rigorous historical distinction, accommodation of tensions, clarity on normative/descriptive aims, and explanation of discursive functions. The choice between Genealogical-Institutional, Normative-Functional, or Discourse-Analytic approaches represents a fundamental choice about which aspects (historical reality, normative aspiration, or discursive power) are deemed most essential for understanding the concept, inevitably sacrificing others. The category "Western values" remains inherently contested and tension-laden, but an adequate account must make these contests and tensions explicit and central, rather than masking them.
