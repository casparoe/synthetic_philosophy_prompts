answer: |-
  That's a razor-sharp observation about one of the most persistent and debated methodological tensions in microhistory. You're absolutely right: historians often acknowledge the exceptional nature of their case *explicitly* but then proceed to make broader claims *implicitly* or *suggestively* based on it. There isn't one universally agreed-upon single term, but several concepts and critiques capture the essence:

  1.  **The "Exceptional-as-Typical" Move (or Paradox):** This is perhaps the most common descriptive phrase used by critics (and sometimes practitioners reflecting on their method). Natalie Zemon Davis, in discussing her own *The Return of Martin Guerre*, explicitly framed it as using "the exceptional as a way to understand the typical." The tension lies in using the *unique* record to illuminate the *commonplace* context that produced it. The danger is sliding from "this exceptional case *reveals aspects of* the ordinary world" to treating the exceptional case *as* representative of ordinary mentalities.

  2.  **Synecdochic Reasoning (or the Synecdoche Problem):** This is a powerful concept borrowed from literary theory (where a part stands for the whole). Microhistorians often argue their case functions as a synecdoche – the bizarre miller (part) stands in for or reveals the peasant mentality (whole). The criticism is that this is an *imperfect* or *problematic* synecdoche precisely because the "part" was selected *for* its deviation, not its typicality. It risks being a **"Privileged Synecdoche"** – privileged by its archival survival due to its oddity.

  3.  **Archive-Induced Exceptionalism:** This highlights the core problem you identify: the archival filter. The only reason we have such rich detail about *this* peasant is *because* he was weird enough to trigger the mechanism (Inquisition trial) that generated the record. The archive systematically selects for the "deviant" case. Generalizing from this is inherently risky because the archive is silent on the truly "normal" who *didn't* attract such attention. It's a specific form of **Survivorship Bias**, applied to historical records.

  4.  **The "Representative Anecdote" Critique:** Kenneth Burke used this term to describe how a single, vivid story is often used to stand for a larger phenomenon. The criticism is that the anecdote chosen (the weird miller) may be rhetorically powerful and revealing in *some* ways, but it's not statistically representative, and its selection may be driven by narrative appeal or archival happenstance rather than typicality.

  **Where Exactly Does It Go Wrong?**

  1.  **Overstepping the Justification:** The historian correctly argues the case illuminates *possibilities* (what *could* be thought, potential influences, cracks in dominant ideologies, the existence of oral traditions). The error occurs when they slide into claims about *prevalence*, *commonality*, or *representativeness* ("this shows what peasants *typically* thought"). They confuse demonstrating the *existence* of a mental world with demonstrating its *dominance* or *normality*.
  2.  **Underestimating the Filter:** While acknowledging the case is an outlier, the historian might underestimate *how much* the filter (e.g., the Inquisition's criteria for suspicion, the specific charges) distorts the sample. They might assume the deviation is minor or only on the surface, while the underlying mentality is common. But the deviation *is* the reason for the record's existence and depth.
  3.  **Ignoring the Silent Majority:** The method struggles to account for the vast majority who *didn't* get recorded. Were they silent because they conformed perfectly? Or because they were better at hiding non-conformity? Or because their non-conformity wasn't deemed threatening enough? The weird miller tells us little about this silent mass.
  4.  **Rhetorical Slippage:** The narrative power of the exceptional case can be seductive. Vivid details about the miller's cosmology naturally draw attention and make the argument memorable. This can lead readers (and sometimes the author) to unconsciously weight this single, spectacular example more heavily than the (often absent) evidence for typicality.

  **Why Do Historians Do It (and Sometimes Defend It)?**

  *   **The Record Problem:** For "ordinary" people before modernity, *any* rich, detailed record is rare. The "bizarre outlier" case is often the *only* window we have into the mental world of non-elites with any depth. It's use it or lose it.
  *   **Revealing Structures:** The argument (often valid) is that the *reaction* to the outlier (the trial, the charges, the questions asked) reveals the norms, anxieties, and structures of the dominant society and its institutions more clearly than studying the norms themselves.
  *   **Testing Limits:** The outlier tests the boundaries of the possible, showing what ideas could circulate, how official doctrines could be interpreted or resisted, and the limits of social/religious control.
  *   **Complexity over Averages:** Microhistorians often argue that seeking "the average peasant" homogenizes and flattens reality. The outlier reveals the diversity, contradictions, and individual agency within a social stratum that official sources often portray as monolithic.

  **Conclusion:**

  While no single term reigns supreme, **"the exceptional-as-typical move"** or **"the synecdoche problem in microhistory"** are the most common ways to describe this specific tension. The core issue is the **archive-induced exceptionalism** – the reliance on records generated *because* of the subject's deviation. It goes wrong when the historian, despite caveats, implicitly or explicitly uses the unique case to make claims about the prevalence, commonality, or representativeness of mentalities, rather than focusing on the possibilities, structures, reactions, and limits that the case reveals. The brilliance and frustration of microhistory lie precisely in navigating this tightrope walk between the unique artifact and the general claim.
