  ### Taxonomy of Positions on the Demandingness Objection to Act-Consequentialism  

  **Root Question:**  
  *Can morality ever require an agent to bear a genuinely burdensome sacrifice? (Example: You alone can save a stranger from a fatal disease by donating your life savings, leaving you impoverished. Must you do it?)*  
  - **No**:  
    - **Leaf: Minimal Sacrifice Morality**  
      Morality never demands significant sacrifice. Agents may prioritize self-interest without moral failing. (Rarely defended; seen as *unattractive* for ignoring urgent needs of others.)  
  - **Yes**:  
    - **Branch Question**: *What aspect of the demand is most troubling?*  
      - **Option 1: The sacrifice is too costly to bear** (e.g., losing life savings causes severe hardship).  
        - **Branch Question**: *How should morality address excessive personal cost?*  
          - **Adopt scalar rightness**: "Rightness is a matter of degree—giving more is better, but not required."  
            - **Leaf: Scalar Consequentialism**  
              No act is strictly "wrong," but better acts exist. Demands are guidance, not obligations.  
          - **Adopt rules for general compliance**: "Follow rules that, if widely adopted, maximize good (e.g., ‘Donate 10% of income’)."  
            - **Leaf: Rule Consequentialism**  
              Rules set feasible demands, preventing extreme sacrifices.  
          - **Assign responsibility to institutions**: "Institutions (e.g., governments) should handle large-scale problems; individuals do limited fair shares."  
            - **Leaf: Institutional Division of Labor**  
              Individuals contribute via taxes/voting; institutions bear primary burdens.  
          - **Accept high demands as unavoidable**: "Morality is stringent; we often fail but should strive harder."  
            - **Leaf: Cost-Revisionist Consequentialism**  
              Demands are high but correct; agents must reconcile with moral imperfection.  
      - **Option 2: There is no reasonable stopping point** (e.g., after donating savings, you must keep giving until destitute).  
        - **Branch Question**: *How should morality resolve endless optimization?*  
          - **Adopt scalar rightness**: "No sharp line exists between right/wrong; just aim for better outcomes."  
            - **Leaf: Scalar Consequentialism** (as above)  
          - **Adopt rules for general compliance**: "Rules (e.g., ‘Donate up to a threshold’) create clear limits."  
            - **Leaf: Rule Consequentialism** (as above)  
          - **Assign responsibility to institutions**: "Institutions distribute burdens fairly; individuals stop when institutional duties are met."  
            - **Leaf: Institutional Division of Labor** (as above)  
          - **Accept endless demands as inevitable**: "Global needs *are* infinite; morality reflects this."  
            - **Leaf: Structure-Revisionism with Evolutionary Diagnosis**  
              Demands seem excessive because human moral cognition evolved for small-group reciprocity, not global impartiality. We must adapt.  
      - **Option 3: The sacrifice crowds out personal relationships/projects** (e.g., donating prevents caring for your child or writing a novel).  
        - **Branch Question**: *How should morality protect personal commitments?*  
          - **Adopt scalar rightness**: "Prioritizing relationships is suboptimal but not wrong."  
            - **Leaf: Scalar Consequentialism** (as above)  
          - **Adopt rules for general compliance**: "Rules (e.g., ‘Help others but fulfill special duties to family’) balance impartiality with personal ties."  
            - **Leaf: Rule Consequentialism** (as above)  
          - **Assign responsibility to institutions**: "Institutions handle aid; individuals focus on personal roles (e.g., parenting)."  
            - **Leaf: Institutional Division of Labor** (as above)  
          - **Accept high demands as overriding personal life**: "Morality requires sacrificing relationships/projects for the greater good."  
            - **Leaf: Prerogative-Revisionist Consequentialism**  
              Personal commitments are morally secondary to impartial optimization.  
          - **Permit agent-centered exceptions**: "Agents may sometimes favor personal commitments, even if suboptimal."  
            - **Leaf: Agent-Centered Prerogative View**  
              Morality includes non-consequentialist "prerogatives" to prioritize self/close others.  

