  ### Unoccupied Combination & Diagnosis  
  - **Combination**: *Cost-based demandingness* (Option 1) + *Agent-centered prerogative* (remedy from Option 3).  
    - **Diagnosis**: *Incoherent*. The prerogative protects personal projects/relationships, but cost-based objections focus on burden magnitude *without* project-crowding. Permitting exemptions for bare financial loss (e.g., a billionaire avoiding minor donations) lacks justification and collapses into self-interest.  

  ### Notes  
  - **Scalar Consequentialism** appears in all branches but addresses distinct concerns (cost, structure, or prerogatives).  
  - **Evolutionary Diagnosis** (under Structure-Revisionism) explains demandingness as a clash between evolved moral intuitions (for small groups) and modern global obligations.  
  - **Rule Consequentialism** and **Institutional Division** are consistent across branches but tailored to specific objections.
