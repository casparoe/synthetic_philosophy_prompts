prompt: |-
  I started as a program officer at a family foundation six months ago, and the same fight keeps happening in our grant meetings. We make maybe thirty or forty grants a year, mostly $25k to $200k, in global health and farmed animal welfare. A proposal will have a clear, well-evidenced near-term benefit: bednets in a malarial region, or better water quality on a salmon farm. Then somebody raises the long-run ripple effects. The bednet program could cut childhood mortality and thereby shift population growth, labor markets, and migration over the next thirty years, and we can't even sign those effects. The salmon-farm work could lower the price of farmed fish, shift consumer demand, and expand or contract total aquaculture over decades, and we have no idea whether its good or bad on net. A board member has started calling this cluelessness and says it means we should stop pretending we can compare total consequences and just fund whatever has the best measurable near-term outcomes. Another staff member says that's giving up and smuggling in a preference for the near term.

  I gather philosophers call this issue consequentialist cluelessness. I don't need a literature review or citations; I need a working procedure. Please write a decision procedure my program staff can run on each proposal in about twenty minutes, without philosophy backgrounds. It should include: the questions to ask in order and what counts as a good-enough answer before moving on; how to tell when we're in a situation where we can at least bound the far-future effects versus one where we can't guess the sign, and what to do differently in each; where the procedure should default to near-term measurable outcomes and where it shouldn't; and which steps are really value judgments dressed up as analysis, so we flag those for the board instead of pretending the checklist decided them. Then run the procedure on two proposals: (1) a bednet distribution program with good evidence on short-term mortality reduction but unknown demographic knock-ons over thirty years, and (2) a corporate cage-free egg campaign that, if it succeeds, could change the economics of egg farming in ways that might either improve or worsen long-run aggregate farmed-animal welfare depending on factors we can't observe. Finally, say honestly where the procedure will let us down.
reasoning: |-
  Okay, the user is a program officer at a family foundation dealing with global health and animal welfare grants. They're stuck in meetings where every proposal leads to arguments about long-term ripple effects. They need a practical decision procedure that staff can use in 20 minutes per proposal, without philosophy backgrounds.

  First, I need to unpack their core problem. The foundation faces "consequentialist cluelessness" - they can measure near-term impacts but get paralyzed by unpredictable long-term effects. The board member wants to focus only on measurable outcomes, while another staffer argues that's giving up. The user needs a middle path.

  The key requirements are clear: a step-by-step procedure with ordered questions, thresholds for "good enough" answers, ways to distinguish bounded vs unbounded uncertainty, guidance on when to default to near-term metrics, and flags for value judgments. Plus two concrete examples and honest limitations.

  Hmm... this needs to be operational, not theoretical. Since they reject philosophy citations, I'll draw from practical decision frameworks like expected value calculations and scenario planning. The 20-minute constraint means each step must be rapid - probably 3-5 key questions.

  For structure, I'm considering a flowchart-like approach: start with measurable impacts, then assess uncertainty bounds before tackling unbounded effects. The critical innovation is the "Sign Test" for long-term effects - asking not for precision but whether harm is plausible and exceeds a defined threshold. This avoids paralysis.

  The value judgment flags are crucial. Staff shouldn't pretend the procedure makes ethical choices; it just clarifies where choices exist. For example, when considering whether to discount animal lives in the distant future, that's inherently a board-level value call.

  For the bednets example: clear short-term benefit, predictable demographic shifts (bounded uncertainty), and no plausible harm pathway. Passes easily. The cage-free eggs case is trickier - short-term good but plausible long-term harm through industry expansion. This fails the sign test, forcing consideration of mitigation strategies or rejection.

  Honest limitations: the procedure can't eliminate uncertainty, may bias toward measurable outcomes in edge cases, and relies on staff's ability to imagine harm scenarios. But it transforms unproductive debates into structured assessments.

  The user's deeper need might be about team alignment. By externalizing value judgments to the board, the procedure could reduce internal conflict. I should emphasize how the "flag for board" steps manage this.
answer: |-
  Here's a practical 20-minute decision procedure for your grant team, designed to handle "cluelessness" without paralysis. Focus is on **plausible bounds, harm prevention, and separating analysis from values**.

  **The "Bounded Impact" Decision Procedure (20 mins/proposal)**

  1.  **Measurable Near-Term Benefit (3 mins)**
      *   *Question:* Does the proposal have strong evidence for a direct, significant, positive outcome within 1-5 years (e.g., lives saved, suffering reduced, welfare improved)?
      *   *Good Enough Answer:* YES, based on credible studies, pilot data, or strong theory consistent with existing evidence. NO if evidence is weak, speculative, or contradicted.
      *   *Action:* If NO, **Reject or Flag for Major Revision**. If YES, proceed.

  2.  **Identify Key Long-Term Pathways (5 mins)**
      *   *Question:* Brainstorm the 1-3 *most plausible* long-term (10-50 year) ripple effects *both positive and negative*. Focus on the most direct chains (e.g., Bednets: Lower child mortality -> potentially larger future population. Cage-Free: Higher production cost -> potentially lower egg consumption OR industry consolidation -> potentially larger farms).
      *   *Good Enough Answer:* List 1-3 plausible pathways per proposal. Avoid exhaustive lists or highly speculative chains. Stop when major pathways are named.

  3.  **Bounded vs. Unbounded Uncertainty (5 mins)**
      *   *Question for Each Pathway:* Can we reasonably bound the *magnitude* (even very wide bounds) or confidently predict the *sign* (net positive/negative) of this long-term effect?
      *   *How to Tell:*
          *   **Bounded:** Evidence from similar interventions, historical analogues, established economic/demographic models (even if imprecise), or effects likely capped by physical/logistical limits. (e.g., Bednet population effect bounded by local carrying capacity & fertility trends; Cage-Free cost increases bounded by consumer price elasticity data).
          *   **Unbounded/Sign Unknown:** Effects depend on cascading complex systems (global markets, tech disruption, political shifts), no good analogues, potential for runaway feedback loops (positive or negative), or sign reversal is plausible. (e.g., Long-term aquaculture market shifts; fundamental changes in human fertility norms; unforeseen tech making cage-free irrelevant).
      *   *Action:* Categorize each pathway as "Bounded" or "Sign Unknown".

  4.  **The Sign Test for "Sign Unknown" Pathways (4 mins)**
      *   *Question (For each "Sign Unknown" pathway):* Is there a *plausible and significant* pathway where the long-term net effect could be *negative* (harm outweighs good)?
      *   *Good Enough Answer:* YES if a credible story exists where the negatives *could* reasonably be large enough to outweigh the near-term good. NO if negative pathways seem highly speculative, negligible, or clearly outweighed by near-term good + any plausible positives.
      *   *Action:*
          *   If **NO** plausible significant harm for *all* "Sign Unknown" pathways -> Proceed to Step 5.
          *   If **YES** for *any* "Sign Unknown" pathway -> Proceed to Step 6 (Mitigation/Value Judgment).

  5.  **Bounded Impact Assessment (2 mins - Only if Step 4 = NO)**
      *   *Question:* For bounded pathways and "Sign Unknown" pathways that passed Step 4 (no plausible significant harm), does the *conservative estimate* of the near-term benefit + the *lower bound* of plausible long-term positive effects clearly outweigh any *upper bound* of plausible long-term negative effects?
      *   *Good Enough Answer:* YES if the worst-case long-term harm seems small relative to the guaranteed near-term good + likely long-term good. NO if bounded negatives could plausibly be large.
      *   *Action:* If YES, **Recommend Funding**. If NO, proceed to Step 6.

  6.  **Mitigation & Value Judgment Flag (1 min - If Step 4=YES or Step 5=NO)**
      *   *Question A (Mitigation):* Can the proposal design be easily modified to *directly reduce* the risk of the plausible significant harm? (e.g., Bednets: Pair with family planning info? Cage-Free: Advocate for policies preventing industry consolidation?).
      *   *Question B (Value Judgment):* Does accepting the risk of this plausible long-term harm require a *fundamental value trade-off* the board must make? (e.g., Prioritizing certainty of near-term human lives saved over *potential* distant environmental strain? Prioritizing measurable near-term animal welfare over *potential* long-term industry scale-up?).
      *   *Action:*
          *   If simple, effective Mitigation (A) exists, **recommend funding with modification**.
          *   If no easy mitigation, **Flag for Board Decision**. Clearly state: "Strong near-term benefit, BUT plausible significant long-term harm via [Pathway]. Funding requires accepting this risk/value trade-off: [State trade-off clearly, e.g., 'Near-term human lives vs. potential long-term ecological strain']."

  **Where to Default to Near-Term:**

  *   **Default Strongly:** When Step 4 finds **NO** plausible significant long-term harm (even if effects are unknown), and Step 5 confirms bounded negatives are small. Near-term benefit carries the weight.
  *   **Do NOT Default:** When Step 4 finds a **YES** (plausible significant harm exists). Ignoring this because near-term is measurable is dangerous. Requires mitigation or board value judgment.

  **Value Judgments Flagged as Such:**

  *   **Step 4 (Sign Test):** Deciding what constitutes "plausible and significant" harm involves judgment (though grounded in evidence/analogy).
  *   **Step 6B (Value Trade-off):** This is *explicitly* a value flag for the board. The procedure doesn't decide the trade-off; it forces it into the open.

  ---

  **Running the Procedure:**

  **Proposal 1: Bednet Distribution (Clear ST benefit, unknown demographic knock-ons)**

  1.  **Measurable Near-Term Benefit:** YES. Strong evidence reduces malaria mortality short-term.
  2.  **Key Long-Term Pathways:** (1) Lower child mortality -> Potential for larger future adult population -> Strain on local resources/ecosystems? Migration? (Sign Unknown). (2) Healthier children -> Potential for more productive adults long-term (Plausible Positive, Bounded by economic studies?).
  3.  **Bounded vs. Unbounded:** Pathway 1 = Sign Unknown (complex systems). Pathway 2 = Bounded (studies show economic benefit of health).
  4.  **Sign Test (Pathway 1):** Is plausible significant harm? YES. Credible story: Population growth strains resources, leads to conflict/environmental degradation, potentially outweighing initial lives saved *in the very long term*.
  5.  *(Skip Step 5 - Sign Test was YES)*
  6.  **Mitigation & Flag:**
      *   Mitigation (A)? Possibly: Integrate voluntary family planning education/services? Fund alongside sustainable development programs? *If feasible and within scope, recommend with modification.*
      *   Value Flag (B): If mitigation isn't feasible/effective: **Flag for Board.** "Fund near-term lives saved, accepting risk that long-term population/environmental effects *could* be net harmful? Trade-off: Certain near-term human lives vs. potential long-term ecological/societal strain."

  **Proposal 2: Corporate Cage-Free Egg Campaign (Good ST welfare, unknown long-run market effects)**

  1.  **Measurable Near-Term Benefit:** YES. Strong evidence removing hens from cages reduces suffering (injury, stress) in the short/medium term for affected hens.
  2.  **Key Long-Term Pathways:** (1) Higher production costs -> Higher consumer prices -> Reduced egg consumption -> Fewer hens farmed? (Plausible Positive, Bounded by demand elasticity). (2) Higher production costs -> Industry consolidation into larger, potentially more efficient operations -> *Could* lower prices long-term -> *Could* increase total consumption & total hens farmed? (Sign Unknown). (3) Sets precedent, speeds adoption of other welfare reforms (Plausible Positive, Bounded by precedent).
  3.  **Bounded vs. Unbounded:** Pathway 1 = Bounded. Pathway 2 = Sign Unknown (market dynamics, tech change). Pathway 3 = Bounded.
  4.  **Sign Test (Pathway 2):** Is plausible significant harm? YES. Credible story: Consolidation + efficiency gains lower prices substantially, increasing total egg consumption and *total number of hens in industrial systems*, potentially outweighing the welfare gain per hen. (i.e., More hens suffering at a slightly better standard *could* mean more total suffering).
  5.  *(Skip Step 5)*
  6.  **Mitigation & Flag:**
      *   Mitigation (A)? Possibly: Campaign explicitly linked to reducing overall egg consumption? Advocate for policies preventing monopolistic consolidation? *If feasible and within scope, recommend with modification.*
      *   Value Flag (B): If mitigation isn't feasible/effective: **Flag for Board.** "Fund measurable near-term welfare gain for hens, accepting risk that long-term market effects *could* increase total hens farmed and net suffering? Trade-off: Certain near-term welfare improvement vs. potential long-term increase in scale of industrial farming."

  ---

  **Where the Procedure Will Let You Down (Honestly):**

  1.  **"Plausible" is Subjective:** Step 4 (Sign Test) relies on staff judgment about what constitutes a "plausible and significant" harm pathway. Smart people can disagree. Training with historical examples helps.
  2.  **Edge Cases:** Proposals where the Sign Test answer is borderline (is harm *really* plausible?) will still cause debate, though hopefully more focused.
  3.  **Overlooking Complex Interactions:** The focus on 1-3 key pathways might miss subtle or interacting effects that only become clear later.
  4.  **False Sense of Security:** Passing the Sign Test (no plausible harm) doesn't guarantee no harm, just that significant harm isn't foreseeable with current knowledge. Truly black swans are possible.
  5.  **Biases:** The procedure could subtly bias towards interventions with easily measurable near-term impacts and clear causal chains, potentially undervaluing innovative or systemic approaches with less certain short-term metrics but higher potential long-term upside.
  6.  **Mitigation is Hard:** Step 6A often proposes mitigations that might be outside the foundation's scope, expertise, or the grantee's capacity, leaving the value judgment as the only path.
  7.  **Board Burden:** Flagging too many proposals for value judgments could overwhelm the board or lead them to default to near-term metrics anyway.

  **This procedure won't eliminate cluelessness, but it structures the debate, forces consideration of harm, separates analysis from values, and provides clear off-ramps (fund near-term, modify, or escalate the value call). It turns paralyzing philosophical uncertainty into manageable decision points.** Good luck!
