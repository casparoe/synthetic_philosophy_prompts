prompt: |-
  You are a moral philosopher who specializes in metaethics and moral psychology and who is skilled at turning philosophical distinctions into practical guidance for non-philosophers. Work through the request carefully before writing; begin by brainstorming the main ways a piece of left–right moral psychology can go wrong when it is used to reach a normative conclusion, then build the procedure from that list.

  I am the standards editor at a large online magazine that publishes weekly opinion and analysis on political polarization. A recurring problem: writers pitch pieces that cite moral foundations theory—the finding that self-described liberals and conservatives weight a set of moral "foundations" (roughly care, fairness, loyalty, authority, sanctity, and sometimes liberty) differently—and then conclude that one side's moral outlook is more complete, more balanced, less self-serving, or more likely to be correct. Please write a reusable procedure my editorial team can run on any such pitch or draft.

  The procedure should be a checklist of ordered questions, aim for 8–12. For each question, specify what counts as a sufficient answer to move on; where the procedure should stop and rule that the piece cannot support its normative claim as written; and where the question is a values question the editor or the publication must settle rather than something the psychology can settle. The procedure should make the is–ought step explicit: a psychological difference between left and right is, by itself, neither evidence that one side is right nor evidence that the difference is mere bias. It should flag the common failure modes—for example, moving from descriptive breadth of foundations to normative completeness, treating an explanation of a view as a debunking of it or as a vindication of it, assuming the six foundations are the right or exhaustive list, and using average group differences to license conclusions about individuals or particular policies. It should also be honest about the narrow conditions, if any, under which a descriptive moral-psychological finding can properly bear on a normative dispute.

  Then run the procedure on three hypothetical submissions:

  1. A piece claiming that because conservative participants in the classic studies rate all the foundations as relevant while liberal participants rate mostly care and fairness, conservative moral judgment is more comprehensive and therefore more likely to be correct.
  2. A piece claiming that because both sides rate care and fairness highly and disagree only about how to apply them, the left–right moral divide is smaller than assumed, so majoritarian aggregation of both sides' shared values settles most contested policy questions.
  3. A piece claiming the reverse of the first: that the extra foundations are rationalizations for in-group bias, and therefore liberal moral judgment is more likely to be correct.

  For each, say what the procedure would require before publication and where the editor is left making a value call. At least one of the three should produce a verdict a publication like ours would rather not hear, and say so plainly.

  The procedure will be used by editors without philosophy training, in under 30 minutes, on pieces that reach a large audience; it must be defensible to the editor-in-chief and to readers who disagree with our own politics, and it must not rely on external databases or citation checks, which we handle separately.

  End with a short self-audit: which argument or consideration would most change the procedure's verdicts if it were established or abandoned, and where is the procedure's reasoning most likely to fail?

  Hard limit: 1,500 words for the whole response, including the checklist, the three worked examples, and the self-audit.
reasoning: |-
  Hmm, the user needs a procedure for their editorial team to evaluate opinion pieces that cite moral foundations theory to make normative claims about left vs. right morality. I need to create a checklist that prevents common philosophical errors when moving from descriptive psychology to normative conclusions.

  As a moral philosopher, I know the core challenge is the is-ought gap: psychological findings about how people think morally can't directly tell us how they should think. Moral foundations theory describes differences but doesn't judge which foundation weighting is correct. The procedure must flag attempts to treat descriptive breadth as normative completeness, or to use group averages to judge individuals.

  I'm brainstorming the key failure modes:
  - Equating wider foundation use with better morality
  - Treating psychological explanations as debunking/vindicating
  - Assuming the six foundations are exhaustive/normative
  - Overgeneralizing group averages to individuals/policies
  - Ignoring that "relevance" ratings don't equal application
  - Confusing consensus with correctness in majoritarian arguments

  The checklist needs 8-12 ordered questions that:
  1. Force explicit identification of the normative claim
  2. Check for is-ought leaps
  3. Scrutinize foundation list assumptions
  4. Prevent overgeneralization
  5. Identify when value judgments are unavoidable

  For the worked examples:
  - Example 1 (conservative superiority) should fail for equating breadth with correctness
  - Example 2 (majoritarian consensus) should reveal hidden value choices
  - Example 3 (liberal superiority) must also fail like #1, and be the "unwelcome verdict" as requested

  The self-audit should acknowledge that if moral foundations theory were invalidated, the procedure would collapse, and that the toughest spot is disentangling descriptive psychology from normative philosophy under deadline pressure.
answer: |-
  ## Moral Foundations Evaluation Procedure for Editorial Team

  **Purpose:** Evaluate whether pitches/drafts using moral foundations theory (MFT) validly support normative claims about the superiority, correctness, or policy implications of left/right moral outlooks. Focuses on logical structure, not factual accuracy of citations.

  ### Checklist (Ordered Questions)

  1.  **What specific normative claim is the piece making?** (e.g., "Side X is more moral," "Side Y's view is biased," "Policy Z is justified based on foundations.")
      *   *Sufficient:* Clear, concise statement of the claim about what *ought* to be the case or who is *correct*.
      *   *Stop:* If no clear normative claim is made using MFT as support. Proceed if claim is explicit.
      *   *Values Call:* None. Clarification step.

  2.  **Does the piece rely *solely* on MFT findings (group differences in foundation endorsement) to support this normative claim, without additional bridging premises?**
      *   *Sufficient:* Explicit "No," or clear identification of additional premises (philosophical, empirical, logical) beyond the descriptive MFT data.
      *   *Stop:* If "Yes." Descriptive findings alone cannot support normative claims (Is-Ought Gap). Requires revision to add valid premises or remove the normative claim.
      *   *Values Call:* None. Logical necessity.

  3.  **Does the piece treat the *number* or *breadth* of foundations endorsed by a group (e.g., "conservatives use more foundations") as evidence for the *normative completeness* or *correctness* of that group's morality?**
      *   *Sufficient:* Explicit "No," or robust argument (beyond MFT data) for why breadth = correctness.
      *   *Stop:* If "Yes." (Breadth ≠ Correctness Fallacy). Requires removal of claim or significant revision.
      *   *Values Call:* None. Logical error.

  4.  **Does the piece treat the MFT explanation of *why* a group holds a view (e.g., "conservatives value authority due to evolved tribalism") as automatically *debunking* or *vindicating* that view's normative validity?**
      *   *Sufficient:* Explicit "No," or careful argument distinguishing origins from justification.
      *   *Stop:* If "Yes." (Genetic Fallacy / Vindication Fallacy). Requires removal of claim or revision.
      *   *Values Call:* None. Logical error.

  5.  **Does the piece assume the standard 5-6 MFT foundations are the *exhaustive* or *objectively correct* list of moral foundations?**
      *   *Sufficient:* Explicit acknowledgment that MFT foundations are descriptive constructs from specific research, not necessarily a complete or prescriptive moral ontology.
      *   *Stop:* If "Yes," and this assumption is crucial to the normative claim (e.g., "liberals lack key foundations"). Requires qualification or removal.
      *   *Values Call:* None. Factual error about MFT's scope.

  6.  **Does the piece use *average* group differences in foundation endorsement to make claims about *individuals* (e.g., "this conservative doesn't care about fairness") or *specific policies* (e.g., "this policy is justified because it aligns with foundation X")?**
      *   *Sufficient:* Explicit "No," or strong caveats about group averages vs. individual variation and the complex link between foundations and specific policy positions.
      *   *Stop:* If "Yes," and this overgeneralization is central to the argument. Requires significant qualification or removal.
      *   *Values Call:* None. Statistical error.

  7.  **If the piece argues for policy conclusions based on MFT, does it rely on the idea of *aggregating* or *finding consensus* in foundations (e.g., "both sides care about Care/Fairness, so we should...")?**
      *   *Sufficient:* Explicit acknowledgment that *how* foundations are interpreted, prioritized, and applied to specific contexts is highly contested, even if foundations are shared. Identifies the *value judgment* needed to move from shared abstract foundations to concrete policy.
      *   *Stop:* If "No," and it implies shared foundation labels automatically imply shared policy conclusions. Requires revision to surface the necessary value judgment.
      *   *Values Call:* **YES.** The editor/publication must decide if the *specific way* the author bridges the gap between shared foundations and contested policy aligns with their standards/values. The psychology *cannot* settle *how* to apply foundations.

  8.  **Does the piece acknowledge potential limitations of self-report surveys (the core MFT method) for capturing full moral reasoning, including context, application, or implicit biases?**
      *   *Sufficient:* Brief acknowledgment of methodology limits (e.g., "self-reported relevance," "abstract scenarios") or focus staying within MFT's descriptive scope.
      *   *Stop:* Only if combined with a failure in Q2-Q6 where this limitation critically undermines the core argument. Usually requires minor qualification.
      *   *Values Call:* None. Methodological caution.

  9.  **Has the piece explicitly identified and justified the *additional premises* (beyond MFT data) required to bridge the gap between the descriptive findings and its normative claim? (Revisiting Q2)**
      *   *Sufficient:* Clear statement of the bridging premises (e.g., philosophical argument for why breadth is good, empirical evidence linking a foundation to societal outcomes, definition of "bias") and a basic defense of their plausibility *within the scope of the piece*.
      *   *Stop:* If premises are missing, demonstrably false, or rely on the fallacies identified in Q3-Q6. Requires major revision.
      *   *Values Call:* **YES.** Editors must judge if the *type* and *presentation* of the bridging premises (e.g., a consequentialist argument, a definition of harm) are appropriate for the publication's standards and audience, even if they are logically valid. The psychology doesn't provide these premises.

  10. **Considering the above, can the piece's normative claim be supported *without* relying on MFT in a logically invalid way (as per Q2-Q6)? Does the MFT component add unique, valid descriptive insight relevant to the *descriptive* part of the argument?**
      *   *Sufficient:* "Yes" to both. MFT validly describes a psychological difference, and the normative claim stands on logically separate, adequately presented grounds.
      *   *Stop:* If "No" to either. The piece likely misuses MFT to lend false scientific credence to a normative leap. Requires fundamental restructuring or killing the pitch.
      *   *Values Call:* **YES.** Final editorial judgment on whether the *overall argument*, even if logically valid after revision, is sound, novel, responsible, and aligns with the publication's mission and standards for discussing polarization. The core normative claim is always a value judgment.

  ---

  ### Worked Examples

  1.  **Claim: Conservative moral judgment is more comprehensive (uses more foundations) and therefore more likely correct.**
      *   **Q1:** Clear normative claim (conservatives more correct).
      *   **Q2:** **STOP.** Relies solely on MFT breadth (conservatives endorse more foundations) for normative claim (correctness). Clear Is-Ought violation. Piece cannot support claim as written. Major revision needed to add premises justifying why breadth = correctness.
      *   **Procedure Verdict:** **Reject/Kill** (as written). Cannot support claim. Revision requires adding valid bridging premises (philosophical argument for breadth), which would then face Q9/Q10 value judgments.

  2.  **Claim: Left-right divide smaller than assumed (both care about Care/Fairness), so majoritarian aggregation settles most policies.**
      *   **Q1:** Clear normative claim (majoritarian aggregation settles policies).
      *   **Q2:** Not solely MFT? MFT shows shared foundations, but aggregation is an additional premise. Proceed.
      *   **Q3-6:** Passes (no breadth=correctness, no genetic fallacy, no exhaustive list claim, avoids overgeneralization *if* careful about group labels).
      *   **Q7:** **CRITICAL STOP/REVISION.** Fails. Assumes shared foundation *labels* (Care/Fairness) imply shared *interpretation* and *application* to policy. Ignores profound disagreement on *how* Care/Fairness apply (e.g., equality vs. proportionality, positive vs. negative rights). Must explicitly acknowledge this and identify the *value judgment* needed to bridge the gap (e.g., "we should prioritize minimal interpretations," "outcome X is the shared goal").
      *   **Q9:** Premise (aggregation solves conflict) is unjustified by MFT. Requires argument for why aggregation works *despite* deep interpretive conflicts.
      *   **Q10:** MFT validly shows shared abstract concern, but core normative claim (aggregation settles policy) relies on unsupported/unacknowledged value judgments about interpretation and conflict resolution.
      *   **Procedure Verdict:** **Revise Significantly.** Must surface and defend the value judgments about *how* to interpret shared foundations and *why* aggregation works for contested policies (Q7, Q9). Editor faces major value calls (Q9/Q10) about the substance of these justifications. Publication might be uneasy with downplaying deep value conflicts.

  3.  **Claim: Conservative "extra" foundations (Loyalty, Authority, Sanctity) are rationalizations for bias, so liberal judgment is more correct.**
      *   **Q1:** Clear normative claim (liberals more correct).
      *   **Q2:** **STOP.** Relies solely on MFT + labeling foundations as "rationalizations for bias" for normative claim. Labeling them as rationalizations *is* a normative claim disguised as description. Pure Is-Ought leap. Furthermore, explanation (bias) treated as debunking (Q4).
      *   **Q4:** **STOP.** Explicitly commits Genetic/Debunking Fallacy. Explaining origins (bias) used to invalidate normatively.
      *   **Procedure Verdict:** **Reject/Kill** (as written). Cannot support claim. Major revision needed: remove normative claim based *only* on MFT+label, or add premises defining "bias" normatively and arguing why foundations X/Y/Z *always* indicate it. This revision would face intense Q9/Q10 value scrutiny and likely be highly contentious. **This is the verdict the publication would rather not hear** (rejecting a "liberal superiority" argument), but the procedure requires it due to logical flaws identical to Example 1.

  ---

  ### Self-Audit

  *   **Argument Most Likely to Change Verdicts:** If a robust, widely accepted *normative moral framework* were established that *objectively privileged* certain foundations or weightings (e.g., proving Care and Fairness are the *only* truly rational foundations). This could potentially validate bridging premises in Q9 for claims like Example 1 or 3, turning some "STOPs" into "Value Calls." Currently, no such framework exists, and MFT itself is descriptive.
  *   **Point of Likely Failure:** The procedure's reasoning is most vulnerable at **Q9/Q10**, where editors must judge the plausibility and appropriateness of the author's *bridging premises* and the *overall normative argument*. Under time pressure and without philosophy training, editors might:
      *   Mistake a common political talking point for a valid philosophical premise.
      *   Allow weak or question-begging premises to pass if they align with the publication's leanings.
      *   Struggle to distinguish a logically *valid* (but possibly unsound or weak) argument from an *invalid* one based on MFT misuse.
      *   The pressure to publish engaging content on polarization might subtly bias judgments against strict "STOP" verdicts, especially for congenial arguments (like Example 3 for a left-leaning pub). Strict adherence to Q2-Q7 is crucial to counter this.
