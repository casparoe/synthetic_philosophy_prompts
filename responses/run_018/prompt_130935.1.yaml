answer: |-
  Here’s the taxonomy tree for ontological positions on generations, built from logical branches using concrete diagnostic cases. Each branch question is phrased as a real-world scenario:

  ---

  **ROOT QUESTION: Are generations (e.g., Boomers, Gen Z) real social kinds?**  

  ### Branch 1: Cohort Boundaries  
  *Diagnostic Case: If a child born in 1997 grew up in a remote village with no internet, would they still share the core traits you associate with "Millennials"?*  
  - **YES (Fixed by critical exposure)** → Go to Branch 2.  
  - **NO (Arbitrary calendar cuts)** → Go to Branch 3.  

  ### Branch 2 (From "Fixed Boundaries"): Trait Stability  
  *Diagnostic Case: Would two people exposed to identical macro-events (e.g., 9/11 during adolescence) reliably develop similar worldviews, regardless of other differences?*  
  - **YES (Causes stable traits)** → **Position: Developmental Essentialism**  
    *(Generations are natural kinds shaped by shared historical imprinting)*.  
  - **NO (Only demographic noise)** → **Position: Weak Demographic Nominalism**  
    *(Generations are useful labels for correlated trends, but lack causal depth)*.  

  ### Branch 3 (From "Arbitrary Boundaries"): Institutional Power  
  *Diagnostic Case: If schools/media suddenly started treating "Gen Alpha" as having distinct traits (e.g., "digital natives"), would that labeling create measurable differences in their behavior?*  
  - **YES (Creates real traits)** → **Position: Institutional Constructivism**  
    *(Generations become real through institutional reinforcement, e.g., HR policies or targeted ads)*.  
  - **NO (No predictive power)** → **Position: Cohort Eliminativism**  
    *(Generations are arbitrary fiction; only individual/context matters)*.  

  ---

  ### Diagnostics & Ambiguities  
  1. **Empty Branch:** *Fixed Boundaries + Trait Stability + Institutional Power?*  
     - **Incoherent:** If traits are biologically/historically fixed (Branch 2-YES), institutions can’t *create* the kind retroactively. Reject this path.  

  2. **Collapsing Positions (User’s Hunch):**  
     - **Weak Nominalism (Branch 2-NO) vs. Institutional Constructivism (Branch 3-YES):**  
       - *Distinction:* Weak Nominalism denies **causal traits** (labels describe noise). Institutional Constructivism claims labels **create traits** (e.g., "Gen Z" branding alters behavior).  
       - *Test Case:* If advertisers stop using "Gen Z," do the predicted traits disappear?  
         - **YES** → Favors Constructivism.  
         - **NO** → Favors Weak Nominalism.  

  3. **Unexplored Position:** *Fixed Boundaries + Institutional Power?*  
     - **Unattractive:** If boundaries are fixed by critical events (e.g., recessions), institutions can’t arbitrarily redefine them. No coherent position here.  

  ---

  ### Tree Summary  
  ```  
  Fixed Boundaries?  
  ├── YES → Causes stable traits?  
  │   ├── YES → Developmental Essentialism  
  │   └── NO → Weak Demographic Nominalism  
  └── NO → Institutions create traits?  
      ├── YES → Institutional Constructivism  
      └── NO → Cohort Eliminativism  
  ```  

  **Key Tensions:**  
  - **Developmental Essentialism vs. Eliminativism** clash on whether history shapes psychology.  
  - **Constructivism vs. Weak Nominalism** hinges on whether labels *predict* or *manufacture* traits.  

  This tree isolates core disagreements without presupposing jargon—using cases to force ontological commitments.
