      *(Tranquility = mere absence; Meta-desire OK; Scope: Phenomenal consciousness; Intervention: Forbidden)*

  **F. Branch 1A -> Branch 2A -> Branch 3B -> Branch 4C:**  
      **Phenomenal Privative Ecological Neutralist Tranquilism**  
      *(Tranquility = mere absence; Meta-desire OK; Scope: Phenomenal consciousness; Intervention: Indifferent)*

  **G. Branch 1A -> Branch 2A -> Branch 3C -> Branch 4A:**  
