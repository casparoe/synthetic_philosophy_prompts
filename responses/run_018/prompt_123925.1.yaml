  First, I should map Rietdijk-Putnam properly: no privileged simultaneity → events are tenseless → past/present/future equally real. That's crucial. Then see how Arrival handles this. The film's genius is making Louise's subjective shift feel like a coordinate transformation, but does it cheat? 

  Biggest tension: Louise's POV acts like a privileged frame even while preaching frame-dependence. When she "remembers" the future, is she accessing a temporal coordinate (correct) or is it presented as her "now" (problematic)? The rocket scene where she calls Shang is key here - that's framed as her changing the future, which contradicts true block universe where all is fixed.

  Also that Lorentz analogy... it's elegant but suspicious. Real Lorentz transforms preserve spacetime intervals between frames - Louise isn't switching reference frames, she's gaining godlike access to all frames. That's more than relativity allows. The film smuggles in a meta-observer position.

  But where it nails it: her daughter's life. In true block fashion, Hannah's existence isn't less real because it's future/past - the joy and tragedy coexist tenselessly. That's pure Rietdijk-Putnam emotional logic. The grief works because time's structure changed, not despite it.

