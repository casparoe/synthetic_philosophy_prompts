prompt: |-
  hey so i retired after running a wet lab for decades and now i'm poking at philosophy in my free time. i keep circling back to buridan's ass -- you know, the donkey that starves between two identical bales of hay. but every account i read either sneaks in a hidden preference or just says pick randomly like thats a theory. i want the full spec: what must a theory of rational choice without preference actually deliver?

  list the requirements. cover the classic symmetric case, but also physically identical options separated in space, and my own weird addition: a symetry-breaking budget, where indecision carries a metabolic cost that scales with time -- the kind of constraint a biologist can't ignore. the theory must keep the distinction between having no reason to choose and having a reason to randomize. it can't allow dutch books, and it shouldn't contradict what we know about basal ganglia arbitration in mammals. for each, say why it's a hard constraint versus just a camp prejudice.

  then check consistency: is there a jointly unsatisfiable subset? can you avoid hidden preferences, avoid deterministic tie-breakers, and still not loop forever? i think that's where the real knot is.

  briefly score the main camps -- hard determinists, primitive-randomness folks, and the wait-for-external-perturbation group -- against the list. which one requirement kills the most candidates?

  no citations or reading lists, i just want the conceptual map.
