answer: |-
  Here is the complete exam package designed to meet your specifications, prioritizing conceptual manipulation over recapitulation of canonical texts.

  ---

  **PhD Comprehensive Exam Question: Political Philosophy (90 minutes)**

  **Prompt:**  
  The "dirty hands" dilemma posits that political leaders inevitably incur moral stain by performing necessary wrongs for the public good. Consider a distinction based on the *proximity* of the leader to the wrongful act:  
  *   **Delegated Stain:** The leader authorizes a wrongful act (e.g., coercive interrogation) through institutional layers (e.g., signing a policy, directing an agency head). They do not personally perform the act, possess plausible deniability regarding specific executions, but know the act's general nature and approve its use.  
  *   **Executive Stain:** The leader personally orders the specific wrongful act to a direct subordinate or performs it themselves (e.g., directly commanding an operative to use torture in a specific case, or personally administering it).  

  Evaluate whether introducing this **delegated stain / executive stain distinction** primarily **RESOLVES, COMPLICATES, or COLLAPSES** the core philosophical problem of dirty hands. In your evaluation, critically engage with the following:  
  1.   Does moral responsibility for the wrongful act diminish, intensify, or fundamentally change based solely on institutional distance (delegated vs. executive)?  
  2.   Does the mechanism of representative consent in a democracy (citizens electing leaders who then authorize/commit wrongs) implicate citizens differently depending on whether the stain incurred is delegated or executive?  

  Focus on conceptual arguments regarding responsibility, authorization, democratic agency, and the nature of moral stain. Avoid mere exegesis of specific philosophers; use the distinction itself as the primary analytical tool.

  ---

  **Model Answer (Approx. 650 words):**

  The delegated stain (DS) / executive stain (ES) distinction complicates the classic dirty hands (DH) problem rather than resolving or collapsing it. While it illuminates nuances in agency, responsibility, and perception, it ultimately deepens the core paradoxes without offering an escape hatch from the fundamental conflict between consequentialist necessity and deontological prohibition.

  **1. Responsibility and Institutional Distance:** The distinction does *not* resolve the core question of moral responsibility in DH. Proponents of DS might argue institutional distance diffuses or attenuates responsibility, akin to Eichmann's "desk murderer" defense. However, conceptually, the leader authorizing the wrong under DS remains the *necessary and sufficient condition* for its occurrence. Their knowledge and approval constitute intentional agency. The institutional layers are mere instruments; shifting the physical act doesn't absolve the originating will. Responsibility for the *wrong itself*—its nature and consequences—remains firmly with the authorizing leader in both DS and ES. Where the distinction *complicates* responsibility is in its *scope and character*. ES involves direct causal control over a specific instance, potentially intensifying the immediacy of guilt and demanding accountability for precise outcomes. DS involves responsibility for creating a *system* or *policy* enabling wrongs, implicating the leader in the potential for widespread or repeated harm, even if specific instances are obscured. Responsibility becomes more structural and diffuse under DS, but no less real. The core DH burden—knowingly choosing evil—persists irrespective of proximity.

  **2. Democratic Citizens and Representative Stain:** The distinction significantly complicates the inheritance of stain by democratic citizens. Under DH, citizens are implicated through their representative's actions. The DS/ES lens reveals this implication operates differently. In ES, the leader's direct, visceral act creates a stark, undeniable wrong tied explicitly to their person. Citizens might feel shock or revulsion, making the connection (and thus their potential complicity through electoral support) more acute but also potentially easier to repudiate ("*This* specific act was monstrous"). DS, however, poses a subtler, more insidious challenge to democratic complicity. Authorization embedded in policy, bureaucracy, and secrecy obscures the direct link. Citizens benefit from the perceived security of a coercive policy (e.g., post-9/11 interrogation) while remaining ignorant of, or deliberately averting their gaze from, its ugly execution. Representative consent under DS facilitates *plausible deniability* for both leaders *and* citizens. The stain is diffused through the institutional apparatus and the electorate's collective gaze aversion. This doesn't absolve citizens; instead, it complicates their responsibility by making it less direct, more collective, and often rooted in wilful ignorance or passive acceptance of systemic violence masked as policy. Citizens inherit a *systemic* stain under DS, whereas ES points to a more *event-based* stain.

  **3. Complicating the Core Dilemma:** Ultimately, the DS/ES distinction *complicates* DH by exposing layers within the paradox. It doesn't *resolve* DH because the core conflict—justifying the unjustifiable—remains intact regardless of proximity. The moral horror of the act doesn't vanish with distance; it may become bureaucratized. Nor does it *collapse* DH; the distinction highlights real differences in how agency is exercised, responsibility is experienced (by the actor and perceived by others), and how wrongs are integrated into political systems. ES personalizes the horror, making the leader's anguish more visceral and the demand for atonement more immediate. DS institutionalizes the horror, embedding it within the state's machinery and normalizing it, making systemic critique and accountability harder, but the underlying moral corruption of choosing evil for perceived good endures. The distinction thus intensifies the tension between the political realm's demand for effective, sometimes brutal, action and the moral realm's absolute prohibitions, showing how the structure of agency shapes the manifestation—but not the essence—of the stain.

  In conclusion, while the DS/ES distinction doesn't dissolve the intractable conflict at the heart of dirty hands, it provides a powerful conceptual tool for dissecting its mechanics. It complicates our understanding of responsibility by showing how institutional mediation alters the *form* but not the *fact* of culpability for authorized wrongs. It profoundly complicates democratic citizenship by revealing how representative structures can simultaneously enable systemic wrongs and obfuscate citizens' connection to them. The dirt on the hands may be applied with a brush or a bureaucratic stamp; the stain remains, and its politics become more intricate.

  ---

  **Marking Scheme (Total: 20 Points)**

  Graders: Award points based solely on the conceptual moves below. An "A" answer (17-20) executes all moves with sophistication and clarity. A "B" answer (13-16) attempts all moves but shows weaknesses in 1-2 areas. Lower scores miss or significantly fail multiple moves. Citation density is irrelevant; focus on the reasoning using the DS/ES distinction.

  1.  **Engages the Prompt's Core Question (RESOLVES/COMPLICATES/COLLAPSES):** (4 points)  
      *   **Requirement:** Takes a clear, defensible stance on whether DS/ES primarily resolves, complicates, or collapses the DH problem, justifying it conceptually using the distinction.
      *   **Failure Mode:** Avoids taking a clear stance, or stance is disconnected from the DS/ES logic; merely describes the distinction without evaluating its impact on DH.

  2.  **Analyzes Responsibility Beyond Proximity:** (4 points)  
      *   **Requirement:** Argues convincingly that *moral responsibility for the core wrong* persists in DS (despite distance), demonstrating that authorization, not proximity, is the key determinant of responsibility for the act itself.
      *   **Failure Mode:** Implies DS inherently diminishes responsibility; focuses solely on experiential guilt or ease of accountability without addressing fundamental culpability for authorization.

  3.  **Identifies Distinctive Complications of Responsibility:** (4 points)  
      *   **Requirement:** Explains *how* DS and ES complicate responsibility *differently* (e.g., systemic vs. event-based responsibility, structural diffusion vs. direct causation, obscurity vs. immediacy).
      *   **Failure Mode:** Treats DS and ES complications identically; only states responsibility persists without exploring *how* its nature differs; conflates responsibility with accountability mechanisms.

  4.  **Applies Distinction to Democratic Complicity:** (4 points)  
      *   **Requirement:** Uses DS/ES to explain *differential* citizen implication (e.g., plausible deniability/systemic acceptance in DS vs. shock/repudiation potential in ES), linking it firmly to the mechanisms of representative consent and authorization.
      *   **Failure Mode:** Treats citizen complicity identically for DS/ES; mentions representation vaguely without using DS/ES to show *how* it operates differently; ignores authorization's role in citizen implication.

  5.  **Connects Distinction Back to DH Paradoxes:** (4 points)  
      *   **Requirement:** Demonstrates how the DS/ES distinction deepens understanding of the *intractability* or *specific manifestations* of the core DH paradox (consequentialism vs. deontology, necessity vs. prohibition, the nature of the stain) without resolving it.
      *   **Failure Mode:** Treats DS/ES as tangential to the core DH dilemma; concludes the distinction resolves DH; fails to show how it reveals new layers within the existing paradox.

  ---
  **Rationale for Design:**

  *   **Resists Summary Answers:** The question pivots entirely on manipulating the novel DS/ES distinction. Reciting Walzer/Sartre won't answer the specific prompts about responsibility across distance or democratic complicity under this framework.
  *   **Conceptual Focus:** The prompt, model answer, and marking scheme emphasize reasoning through the implications of authorization, proximity, systemic action, and democratic agency using the provided distinction. No obscure sources needed.
  *   **Clear Grading Rubric:** The 5 required moves (each 4 pts) provide objective benchmarks. Graders assess whether each *conceptual task* is accomplished well, not the presence of names or quotes. Failure modes explicitly target common conceptual errors.
  *   **Targets Core Issues:** The question forces engagement with the nature of responsibility (beyond direct causation) and the often-overlooked democratic dimension of DH, using proximity as the analytical wedge.
  *   **Model Answer as Guide:** Demonstrates the expected level of conceptual engagement: taking a stance, arguing persistently through the distinction's lens, addressing both sub-questions, and concluding on its impact on DH's core.
