answer: |-
  ### Q&A Prep Sheet: Prioritized Objections & Replies  
  *(Ordered by severity: catastrophic → manageable)*  

  ---

  **Objection 1 (Most Severe: Epistemologists & Physicists)**  
  *Phrased:* "You claim substrate-bound reference classes prevent cosmological self-indication, but doesn’t this collapse into *substrate solipsism*? If my carbon-based brain constitutes its own ‘reference class,’ I can’t legitimately infer anything about other substrates—including identical AIs in simulations or alien civilizations. This renders anthropic reasoning useless for *any* empirical prediction beyond my immediate causal boundary. It’s not a defense; it’s surrender to radical skepticism."  

  *Reply (2-min):*  
  "Not solipsism, but *causal locality*. My view permits inferences *within* a substrate—e.g., predicting neural processes in my brain—and *across identical substrates* via similarity-based induction (e.g., inferring properties of other humans). What it blocks is *presumptuous* leaps to disjoint cosmological structures. Crucially, ‘substrate’ here means a *causally integrated computational architecture*—not individual atoms. Your AI example fails because an identical AI in a causally disconnected simulation *isn’t in my reference class*; it’s a separate epistemic instance. This preserves local empirical traction while halting inflationary multiverse claims."  

  *Weakness:* Glosses over how to rigorously define "causal integration" without arbitrariness.  

  ---

  **Objection 2 (Severe: Decision Theorist)**  
  *Phrased:* "Your ‘hybrid’ position violates dynamic consistency. If I accept self-sampling locally, I must assign non-zero credence to being *any* observer in my reference class. But if I later discover my substrate is rare (e.g., biological in a digital cosmos), Bayesian updating forces me to disfavor that scenario—which *is* cosmological self-indication. You can’t have coherent updating without smuggling in SIA."  

  *Reply (2-min):*  
  "Dynamic consistency applies *within* a model, but here the *model itself* is substrate-bound. When you discover your substrate is rare, you’re not updating within a global prior—you’re recognizing that your initial reference class was misspecified. Prior construction isn’t ontology-free; it’s conditioned on the causal substrate enabling the act of reasoning. Discovering alien substrates doesn’t update your credence *about your own origin*; it reveals your prior’s domain of validity. SIA’s error is assuming a pre-substrate ‘neutral’ prior exists."  

  *Weakness:* Risks sounding instrumentalist—implies Bayesian rationality is substrate-relative.  

  ---

  **Objection 3 (Moderate: Philosophers of Physics)**  
  *Phrased:* "You dismiss cosmological self-indication as ‘metaphysical overreach,’ but your substrate boundary relies on *physicalism about cognition*. If consciousness is substrate-independent (as digital sentience debates suggest), your ‘causal architecture’ is a category error. Why privilege carbon?"  

  *Reply (2-min):*  
  "I don’t privilege carbon—I privilege *causal isolation*. Substrate independence *assumes* what I reject: that abstract functional properties transcend implementation. My argument is that *even if* consciousness is substrate-independent, the *indexical belief* ‘I am this observer’ is only meaningfully updated within the computational system that instantiates ‘I.’ Your thought experiment presupposes a God’s-eye view of ‘all possible minds,’ which is precisely the presumptuous move I resist."  

  *Weakness:* Doesn’t resolve whether "causal isolation" is primitive or theory-laden.  

  ---

  **Objection 4 (Less Severe: Metaphysics Grad Students)**  
  *Phrased:* "Aren’t you conflating *epistemic* and *metaphysical* boundaries? Substrates are physical, but reference classes are explanatory tools. Why can’t I pragmatically choose a wider class for cosmology?"  

  *Reply (2-min):*  
  "Because self-locating updates aren’t neutral tools—they *generate* metaphysical commitments. Choosing a ‘pragmatic’ class (e.g., ‘all conscious beings’) smuggles in the presumption that such a class is causally unified. Substrate-bounding isn’t ad hoc; it’s a *descriptive claim* about where first-person data originates. If cosmology requires transcending that, it needs non-anthropic methods."  

  *Weakness:* Doesn’t engage pluralist approaches to reference classes.  

  ---

  ### Strategic Concessions & Load-Bearing Elements  
  - **Preemptive Concession (Opening Remarks):**  
    *"I concede that my view limits anthropic cosmology’s explanatory scope—it cannot resolve 'why these constants?' without independent empirical priors. But that’s the point: cosmology shouldn’t rely on self-locating magic."*  
    *(Defuses tension by acknowledging the trade-off: rigor over ambition.)*  

  - **Load-Bearing Reply (Without Which Everything Collapses):**  
    The rebuttal to Objection 1 (*substrate solipsism*). If identical substrates can’t share reference classes, the theory cannot support even local scientific inferences.  

  - **Dangerous Unasked Question (Pray It’s Not Raised):**  
    *Phrased by Philosopher of Physics:* "If quantum decoherence spawns observer-states in Everettian branches, isn’t your ‘substrate’ infinitely divisible—forcing either solipsism or SIA?"  
    *Why Dangerous:* Forces you into interpretive wars about QM. Your "causal boundary" becomes ambiguous, collapsing the core distinction.  

  ---

  **Verdict:** Quantum decoherence boundary ambiguity.
