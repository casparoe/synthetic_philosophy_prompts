  For philosophical issues: The leap from "humans see truth" to "non-computational" conflates mathematical truth with human insight. Humans use semantic understanding, not just syntactic manipulation. But the mechanist could argue that human consistency judgments are fallible or that human cognition might involve computational processes we haven't formalized.

