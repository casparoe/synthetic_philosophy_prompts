answer: |-
  Let's tackle that persistent headache of the Special Composition Question without dragging the tired furniture into it. We all know the extremes: universalism declares that any collection of things whatsoever composes some further object – the scattered dust on my desk and the Andromeda galaxy form a single, wildly disconnected "thing." Nihilism counters that composition never happens at all – there are only fundamental particles arranged rock-wise or person-wise, but no rocks or people *as objects*. Both feel deeply unsatisfying, hinting that reality is either absurdly cluttered or bizarrely empty. The intuitive middle ground, restricted composition, insists that composition occurs, but only when specific, non-arbitrary conditions are met. The real question is whether such conditions exist, especially when we confront the messy reality of temporary, dynamic collectives like flash mobs or ad-hoc political coalitions alongside enduring stones or trees. Can we find conditions that embrace these ephemeral wholes without dissolving into universalism or nihilism? Does this middle ground hold, or is it inherently unstable?

  Consider the flash mob. Hundreds converge in a square, coordinated via social media, performing a dance for five minutes before dissolving back into the crowd. What makes them, temporarily, a single entity – the "mob" – rather than just a random collection of individuals? Similarly, an ad-hoc coalition of environmental groups, labor unions, and community activists forms overnight to oppose a specific development project. They share a goal, coordinate actions, and act as a unit for the campaign's duration, then disband. These seem like genuine composites, distinct from the mere aggregation of participants. Yet, they lack the robust physical cohesion of a stone bound by atomic forces or the persistent biological unity of an organism. If we demand *enduring physical causal integration* as the sole condition for composition, these fleeting social entities vanish. We slide towards nihilism for the social world: there are only individuals arranged mob-wise or coalition-wise, never a mob *itself*. This feels wrong, denying the real causal power and unity these groups exhibit. They *act*, they *decide*, they *influence* as singular agents, however temporarily.

  So, perhaps *shared intentionality* – a collective goal, a joint commitment, a mutual recognition of acting together – is the key. This clearly distinguishes the flash mob from a random crowd waiting for a bus. The mob participants share the intention to perform *this* dance *here* and *now*, coordinating their actions towards that shared end. The coalition members share the intention to stop the project, subordinating individual group goals to this collective effort. This intentional glue seems to bind them into a genuine composite entity for the duration of their shared purpose. It feels non-arbitrary: it picks out a real feature of the world – coordinated agency – that explains why we treat these groups as units. However, applying this criterion universally runs into trouble. Does a pile of rocks held together only by gravity possess "shared intentionality"? Obviously not. If shared intentionality is the *only* valid condition, then enduring physical objects like mountains or galaxies, lacking minds and intentions, cease to be wholes. We crash into nihilism for the physical world. This is deeply counterintuitive; the mountain seems as real as the mob.

  This forces us to consider multiple conditions or a looser, functional criterion. Maybe composition occurs when there is *causal integration sufficient for unified behavior or function*, whether driven by intentionality or physical law. The flash mob integrates causally through communication and shared plans, enabling unified dance moves. The stone integrates causally through intermolecular forces, enabling it to roll downhill as a unit. The coalition integrates causally through meetings and strategy sessions, enabling unified protest actions. This functional/integrationist view seems promising. It accommodates both the ephemeral intentional collective and the enduring physical object by focusing on the *emergent causal capacity* of the arrangement. The whole acts differently, or has different capacities, than the mere sum of parts. The mob dances; the random crowd does not. The stone rolls; the scattered gravel does not. The coalition negotiates; the disconnected groups do not. The condition isn't arbitrary; it points to observable, causally relevant features in the world.

  But does this hold water, or does it subtly collapse? The danger is sliding back into universalism. Is *any* causal interaction sufficient? Do the dust particles on my desk, subtly influencing each other electrostatically and gravitationally, compose a single object because they have *some* unified behavior (e.g., collectively settling)? If "unified behavior" is too loosely defined, almost any collection qualifies. Conversely, if we demand *highly specific* or *highly efficient* integration, we risk losing genuine, looser-knit composites like ecosystems or galaxies, potentially nudging back towards nihilism. The middle ground feels slippery. The key defense lies in demanding *significant* causal integration relative to the *type* of entity and its *environment*. For a social collective, significant integration means coordinated action towards a shared goal demonstrably different from individual actions. For a physical object, it means sufficient bonding or containment to behave as a single unit under relevant forces (e.g., the stone holds its shape against modest impacts). This relativism isn't arbitrary; it reflects real differences in the modes of organization present in the world. The flash mob achieves its unity through information flow and commitment; the stone achieves it through electromagnetic forces. Both are real, non-arbitrary modes of composition, resulting in entities with distinct causal profiles.

  Therefore, after weighing these ephemeral collectives against enduring objects, I conclude that restricted composition *is* defensible and represents a stable, non-collapsing middle ground, provided we embrace a pluralistic, functional-integrationist criterion. Composition occurs when there is sufficient causal integration – whether physical, intentional, or informational – to generate emergent, unified behavior or function that distinguishes the composite *as a causal agent* from both its individual parts and its surrounding environment. This condition avoids the absurd proliferation of universalism by requiring demonstrable, significant unity-in-action. It avoids the barrenness of nihilism by recognizing genuine composites wherever such integrated causal power emerges, be it in the fleeting coordination of a flash mob, the enduring cohesion of a stone, or the complex, layered integration of a living organism. Shared intentionality is a powerful *form* of causal integration, crucial for social composites, but it is not the *only* valid condition. The stability comes from grounding composition in observable, causally relevant features of the world – the real patterns of unified action – rather than in arbitrary stipulation or a single, overly restrictive mold. The middle holds because reality itself presents multiple, stable ways for parts to genuinely form a whole.
