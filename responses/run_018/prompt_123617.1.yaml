prompt: |-
  I'm running a small grad seminar for CS students who've done modal logic but never touched alignment lit. Next week I have 45 minutes to explain the Löbian obstacle — specifically why an agent running PA that trusts its own reasoning can't consistently believe its own soundness, and why this aint just circular reasoning psychology. Don't explain the theorem to me; plan how I should teach it. What's the dependency order — should I build up Löb's conditions before I show the self-trust loop, or reverse? Pick one carrying example and defend it — and tell me why the standard judge-defendant framing is the wrong call here. List the misconceptions they'll actually have (I'm betting they think probabilistic credence or reflective oracles solve it, and that it's only about explicit self-reference) and say exactly where in the sequence I should kill each one. End with one sharp check question that distinguishes 'they followed the logic' from 'they just parroted the punchline.' Be decisive — pick a sequence and stick to it, don't lay out menus.
