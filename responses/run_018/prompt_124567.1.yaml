  I notice they're also worried about case 3 (heritage program) potentially yielding uncomfortable results. That's sensitive - the procedure must handle it without dodging hard conclusions. The user seems intellectually rigorous, given how precisely they framed the problem, but also pragmatic about high schoolers' capacity. 

  First, I should map the philosophical landscape neutrally. Settled ground: basic needs (like medical emergencies) universally trump non-basics. Contested: whether shared nationality itself creates strong duties. Must avoid presenting any contested view as consensus. 

  For the procedure structure... maybe a flowchart with clear stop/go points? Start with basic needs triage, then apply their two requested filters, then handle non-basics. Need explicit "judgment required" flags at subjective thresholds (e.g., "is this cultural need basic enough?"). 

  For case 1 (local heating): clears basic needs, passes co-authorship (reciprocal tax/democracy), so strong local claim. Straightforward. 

  Case 2 (refugee camp): basic medical need, but fails co-authorship (no institutional ties). Moral-lottery filter flags that denying aid solely due to birthplace is arbitrary. So impartiality should win unless... wait, is there a counterargument about feasibility? The procedure should note that but leave weighing to judgment. 

  Case 3 (heritage program): Tricky. Not basic need, and restricted to citizens. Co-authorship audit might show weak reciprocity (citizens fund it but beneficiaries aren't necessarily co-authors). Moral-lottery filter condemns birthright exclusion. But... could argue language is identity-constitutive? That's where the "basic need?" flag pops up - judgment call. 

  Biggest pitfalls: presenting contested views as settled, or hiding subjectivity in technical steps. Must explicitly say where philosophy ends and choices begin (e.g., "How much extra weight to give locals?"). Also stress that rejecting case 3 isn't anti-culture - it's about priority when resources are limited. 

  ...Did I cover all? Charter mandate met, reusable steps, hard cases handled, judgment flags placed. User seems to want intellectual honesty over comfort - so delivering unwelcome answers respectfully is key. Maybe add: "If procedure conflicts with intuition, that signals where philosophy challenges common assumptions."
answer: |-
  Here’s a reusable decision procedure designed for your board’s constraints, with explicit stop rules, contested/non-contested distinctions, and flagged judgment nodes. It integrates your requested audits while separating settled ethical minima from genuinely debated claims.

  **Decision Procedure: Grant Allocation Framework**  
  *(Run sequentially for each proposal; stop if rejected at any step)*  

  1. **Basic Needs Triage (Settled Minimum)**  
     - **Question:** Does the proposal address **severe deprivation of basic needs** (survival/health: food, water, shelter, life-saving healthcare)?  
     - **Stop Rule:** If YES, proceed. If NO, skip to Step 4 (Non-Basic Needs).  
     - **Settled Consensus:** Philosophers agree severe basic needs have universal moral weight. *Impartiality applies here.*  
     - **Judgment Flag:** None (objective threshold).  

  2. **Moral-Lottery Filter (Contested Terrain)**  
     - **Question:** Would prioritizing/rejecting this proposal depend **solely on beneficiaries’ birthplace/nationality** with no further justification?  
     - **Audit:** If aid is denied *only* because recipients are foreign-born, or approved *only* because they are locals, flag as "arbitrary birth-lottery dependence."  
     - **Contested View:** Cosmopolitans reject birthplace as morally relevant; compatriotists argue it can be.  
     - **Stop Rule:** If "arbitrary" flag is raised, proceed to Step 3. If not, proceed normally.  
     - **Judgment Flag:** Advisor sign-off required if "arbitrary" flag is raised.  

  3. **Institutional Co-Authorship Audit (Contested Terrain)**  
     - **Question:** Do beneficiaries **participate in reciprocal institutional structures** (e.g., pay taxes, vote, submit to laws) that generate obligations?  
     - **Audit:** Check for:  
       - Tax contributions (direct/indirect) funding similar aid.  
       - Legal/democratic recourse to influence the granting entity.  
       - Historical investment in the system (e.g., multi-year residency).  
     - **Contested View:** Compatriotists see reciprocity as obligation-grounding; cosmopolitans see it as optional.  
     - **Stop Rule:** If reciprocity is confirmed, local claims strengthen. If absent, cosmopolitan claims strengthen.  
     - **Judgment Flag:** Advisor sign-off required to assign weight to reciprocity.  

  4. **Non-Basic Needs Evaluation (Judgment-Heavy)**  
     - **Question:** Does the proposal address **non-basic but culturally significant needs** (e.g., identity, education, cultural preservation)?  
     - **Settled Consensus:** These lack universal priority over basic needs.  
     - **Contested View:** Whether/how much they matter locally vs. globally is debated.  
     - **Stop Rule:** If no basic needs are involved, proceed.  
     - **Judgment Flags:**  
       - Advisor sign-off required to classify a need as "basic" (e.g., is cultural survival a basic need?).  
       - Explicit board vote required to rank non-basic local vs. global claims.  

  ---

  **Application to Proposals**  

  **Proposal 1: Winter Heating Subsidy (Local)**  
  1. **Basic Needs Triage:** YES (preventing hypothermia/death). Proceed.  
  2. **Moral-Lottery Filter:** Local focus, but justification isn't *solely* birthplace—recipients are taxpayers/residents. No flag.  
  3. **Co-Authorship Audit:** Strong reciprocity (taxpayers, voters under district’s jurisdiction).  
  4. **Judgment:** No flags. **Recommended: Approve.**  
     - *Settled Win:* Basic needs + reciprocity align.  

  **Proposal 2: Medical Supplies (Refugee Camp)**  
  1. **Basic Needs Triage:** YES (life-saving healthcare). Proceed.  
  2. **Moral-Lottery Filter:** Denying aid *solely* due to foreign birth is arbitrary. **FLAG RAISED.**  
  3. **Co-Authorship Audit:** No reciprocity (refugees lack tax/democratic ties to district).  
  4. **Judgment:**  
     - Advisor sign-off required for Moral-Lottery Flag (rejecting birthplace arbitrariness is settled for cosmopolitans; contested for compatriotists).  
     - **Recommended: Approve** absent overriding local basic needs.  
     - *Key Tension:* Basic needs universality vs. lack of reciprocity.  

  **Proposal 3: Heritage-Language Program (Citizens-Only)**  
  1. **Basic Needs Triage:** NO (cultural preservation ≠ survival/health). Skip to Step 4.  
  2. **Moral-Lottery Filter:** Restriction to citizens = birthright priority. **FLAG RAISED** (arbitrary without further justification).  
  3. **Co-Authorship Audit:** Partial reciprocity (citizens may pay taxes/vote) but beneficiaries are not necessarily co-authors of *this program*.  
  4. **Judgment:**  
     - Advisor sign-off required for Moral-Lottery Flag.  
     - **Explicit Board Vote Needed:** Does cultural preservation justify citizenship exclusion?  
     - **Recommended:** Likely **reject** if competing with basic needs proposals; weak claim per procedure.  
     - *Uncomfortable Truth:* Procedure exposes citizenship restriction as philosophically arbitrary without stronger reciprocity.  

  ---

  **What the Procedure Cannot Settle (Requires Explicit Judgment):**  
  - ⚠️ **Threshold of "Basic Need":** Is cultural extinction a basic need? (e.g., Indigenous language loss). *Flag for advisor.*  
  - ⚠️ **Weighting Reciprocity:** How much stronger is a local claim with co-authorship? *Flag for advisor/board vote.*  
  - ⚠️ **Tie-Breaking:** When local non-basic and global basic needs compete, how to weigh identity against distant suffering? *Flag for board vote.*  
  - ⚠️ **Feasibility vs. Obligation:** Can we help abroad effectively? (Technical, but may mask moral judgment).  

  **Philosophical Boundaries Clarified**  
  - **Settled:** Basic needs deprivation requires impartial response. Birthplace alone is arbitrary without reciprocity.  
  - **Contested:** Whether shared nationality *inherently* creates obligations (compatriotism) vs. only via reciprocity (cosmopolitanism). *No consensus exists.*  
  - **Neutral Design:** The procedure forces exposure of nationality-based assumptions but doesn’t presume their validity.  

  This audit meets your charter’s requirements by making value conflicts explicit, leveraging settled minima, isolating contested claims for advisor oversight, and delivering actionable outputs—even when philosophically uncomfortable.
