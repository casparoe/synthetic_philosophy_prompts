answer: |-
  Here are the desiderata for a theory preserving PAP against Frankfurt cases, with constraints and preferences:

  **Hard Constraints (Must-Have):**
  1. **Frankfurt Case Immunity:** Must explain why Jones is responsible in the *classic Frankfurt case* (Black monitors, intervenes only if Jones chooses wrongly; Jones chooses independently) *without* granting Jones access to alternative possibilities at the moment of choice.
  2. **Neuroscience Constraint:** Must accommodate Libet-style findings (unconscious neural activity precedes conscious intention/choice) without making all actions non-responsible. Cannot require conscious initiation *prior* to relevant unconscious processes.
  3. **Sourcehood-Leeway Distinction:** Must preserve the conceptual distinction between *sourcehood* (the action genuinely originates in the agent) and *leeway* (the agent genuinely had alternative possibilities open). Cannot reduce one to the other.
  4. **Blame-Punishment Distinction:** Must not collapse *moral blameworthiness* (agent's desert of moral condemnation) into *punishment* (social/legal consequences). A theory must account for blameworthiness independently of institutional responses.

  **Case Coverage Requirements:**
  5. **Nested Frankfurt Cases:** Must handle cases where the counterfactual intervener (Black) is *themselves* monitored by a higher-order intervener (Black-2) who would force Black to intervene only if necessary. Cannot make responsibility vanish due to infinite regress threats.
  6. **False Belief Cases:** Must handle cases where the agent *falsely but reasonably believes* they have alternative possibilities (due to elaborate deception), but actually lacks them (a Frankfurt trap). Must explain why they are still responsible.

  **Camp Preferences (Should-Have, but Negotiable):**
  7. **Robust Alternatives:** Prefer theories preserving a *robust* (non-flicker) sense of alternative possibilities (genuine access to different choices/wills), not just "flickers of freedom" (e.g., the possibility of *trying* to do otherwise).
  8. **Intuitive Scope:** Prefer theories that don't drastically narrow (e.g., only psychopaths are responsible) or wildly expand (e.g., coerced agents are responsible) the scope of responsible agents compared to common intuition.
  9. **Action-Guidance:** Prefer theories that offer practical guidance (even if limited) for assessing responsibility in real-world contexts.

  ---

  **Theory Scorecard:**

  1. **Sourcehood Theories (e.g., Stump, Zagzebski):**
     * **PAP Preservation:** ❌ **FAIL.** Explicitly reject PAP; responsibility grounded solely in sourcehood/ownership of the actual sequence. Frankfurt cases *are* why PAP is false.
     * **Case Coverage:** ✅ Handles classic, nested, and false belief cases well via sourcehood focus.
     * **Distinctions:** ✅ Strong on sourcehood/leeway & blame/punishment distinctions.
     * **Neuroscience:** ✅✅ Compatible; sourcehood can be located in agent-level processes/endorsement, not conscious initiation timing.
     * **Preferences:** ❌ Robust Alternatives (rejects them), ✅ Intuitive Scope (varies), 🟡 Action-Guidance (often abstract).

  2. **Hierarchical Compatibilism (e.g., Frankfurt):**
     * **PAP Preservation:** ❌ **FAIL.** Original Frankfurt explicitly uses his cases to *refute* PAP. Responsibility based on identification with desires/higher-order volitions, not alternatives.
     * **Case Coverage:** ✅ Handles classic, nested, false belief via identification conditions.
     * **Distinctions:** ✅ Strong on sourcehood/leeway (rejects leeway), 🟡 Blame/Punishment (less focus).
     * **Neuroscience:** 🟡 Compatible if identification is process-based, but less directly addresses Libet.
     * **Preferences:** ❌ Robust Alternatives (rejects), ✅ Intuitive Scope (plausible), ✅ Action-Guidance (moderate).

  3. **Epistemic Leeway Hybrid:**
     * **PAP Preservation:** 🟡 **CONDITIONAL PASS (Weak).** PAP is preserved *in name only* for accessible alternatives. Responsibility requires access to alternatives *only if reasonable epistemic effort would reveal them*. In Frankfurt cases, reasonable effort doesn't reveal Black, so no accessible alternatives needed. PAP survives as an *epistemic* principle.
     * **Case Coverage:** ✅ Classic Frankfurt (Jones lacks accessible alternatives). ✅ Nested Frankfurt (Same). ✅ **False Belief Cases:** ✅ **STRONG FIT.** Agent *reasonably* believes they have alternatives (reasonable effort didn't reveal trap), so responsibility *is* present *because* they meet the epistemic access condition.
     * **Distinctions:** ✅ Maintains sourcehood/leeway distinction (leeway = accessible possibilities). ✅ Clear blame/punishment distinction.
     * **Neuroscience:** ✅ Compatible. Focuses on agent's epistemic context/reasonableness, not neural timing.
     * **Preferences:** 🟡 Robust Alternatives (Preserves *accessible* robust alternatives, but they can be masked). ✅ Intuitive Scope (Plausible; excludes deeply deceived but holds reasonable agents). ✅ Action-Guidance (Offers criteria: "reasonable epistemic effort").

  **Summary:** Only **Epistemic Leeway** meaningfully preserves PAP (albeit transformed into an epistemic principle). Sourcehood and Hierarchical theories explicitly reject PAP in light of Frankfurt. Epistemic Leeway uniquely handles false belief cases well and satisfies all hard constraints while aligning with key preferences. Its main challenge is defining "reasonable epistemic effort" rigorously.
