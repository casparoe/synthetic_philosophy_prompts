prompt: |-
  I'm a machine learning engineer with a working grasp of calibration, epistemic versus aleatoric uncertainty, proper scoring rules, leakage, and conditional independence, but I've never read the philosophy of probability. Restate the Principal Principle — the claim, associated with David Lewis, that a rational agent's credences should defer to known objective chances — together with the associated puzzles about inadmissible evidence and about chance theories that assign positive probability to futures in which their own chance values turn out to be wrong, in the vocabulary I actually use, as faithfully as you can. Treat credence as something like a predictive distribution I would assign, chance as something like a reference conditional probability model whose stated probabilities I am told, and admissibility as something like the absence of leakage between my extra information and the outcome conditional on that model's stated probability, extending the analogy only as far as it goes without distortion. Then give me a residue report: which parts map cleanly onto calibration and conditional independence, which parts you had to fudge, and which parts have no expression in my vocabulary at all — especially the idea that chance has a distinctive normative authority over belief rather than merely good expected accuracy. I want to know whether what I would naturally call a calibrated forecaster you should defer to is all the philosophers are talking about, or whether my vocabulary is missing something, and why. Write it as continuous prose, like an email or a letter: no headings, bullet points, bold text, or tables.
reasoning: |-
  We are going to restate the Principal Principle in the vocabulary of a machine learning engineer, focusing on the concepts of calibration, conditional independence, and leakage. We'll then discuss the puzzles about inadmissible evidence and self-undermining chance theories. Finally, we'll provide a residue report on how well these concepts map onto the engineer's vocabulary and what might be missing.

  ### Restatement of the Principal Principle
  Imagine you are building a predictive model. You have access to a "reference model" that provides conditional probabilities for an event (say, the outcome of a coin flip) given some initial conditions. This reference model is what the philosophers call a "chance theory". Now, suppose you are told that this reference model assigns a probability \( p \) to an event \( A \) (for example, the coin landing heads) given the current state of the world \( S \). The Principal Principle (PP) says that if you have no other information except \( S \) and the chance assignment \( p \), then your own predictive distribution (your "credence") for \( A \) should be set exactly to \( p \).

  In other words, if your reference model (the chance theory) is well-calibrated and you have no reason to doubt it, and you don't have any extra information that the reference model hasn't accounted for, then you should defer to its probability assignment.

  ### The Puzzle of Inadmissible Evidence
  Now, what if you have extra information? The PP includes a caveat: your credence should be \( p \) unless you have "inadmissible" evidence. In your vocabulary, inadmissible evidence is information that causes leakage. That is, it is information that, when conditioned upon, breaks the conditional independence between the reference model's probability assignment and the actual outcome. 

  For example, suppose the reference model says the chance of heads is 0.5 for a fair coin. But you have a high-speed camera that captures the coin in mid-air and a physics model that predicts the outcome with 90% accuracy. This extra information is "inadmissible" because it gives you more about the outcome than just the chance assignment. If you condition on the camera data, the outcome is no longer independent of your extra information given the reference model's 0.5. So, in this case, you shouldn't set your credence to 0.5 but to 0.9 (or whatever your physics model says).

  In essence, admissibility is about conditional independence: the extra evidence \( E \) is admissible for event \( A \) with respect to the reference model's chance assignment \( p \) if and only if \( A \) is conditionally independent of \( E \) given the chance assignment and the state \( S \). If \( E \) is not conditionally independent (i.e., there is leakage), then it's inadmissible.

  ### The Puzzle of Self-Undermining Chance Theories
  Now, consider a chance theory that assigns positive probability to futures in which the chance values themselves turn out to be wrong. For example, imagine a reference model that says: "With probability 0.6, the coin is fair (so the chance of heads is 0.5) and with probability 0.4, the coin is biased (so the chance of heads is 0.9)." But then, in the biased scenario, the chance theory would have assigned a 0.6 probability to the coin being fair, which is wrong. This is a self-undermining chance theory.

  The puzzle is: what should your credence be for heads? The PP might seem to give conflicting advice. If you condition on the chance theory, then the chance of heads is 0.6*0.5 + 0.4*0.9 = 0.3 + 0.36 = 0.66. But if the biased scenario actually occurs, then the chance of heads is 0.9, and the chance theory's initial assignment of 0.66 would be wrong. So, the chance theory assigns positive probability to futures in which its own chance assignments (for the coin flip) are incorrect.

  In your terms, this is like having a hierarchical model that assigns probabilities to different data-generating processes, and then realizing that the model itself might be misspecified in some scenarios. The PP in its original form doesn't tell you how to defer when the chance theory is self-undermining. Lewis and others had to adjust the principle to handle such cases (leading to the New Principal Principle).

  ### Residue Report
  Let's break down how well these ideas map to your vocabulary:

  #### What maps cleanly?
  - **Credence as predictive distribution**: This is a direct match. Your predictive distribution is exactly what the philosophers call credence.
  - **Chance as a reference conditional probability model**: This is a good analogy. The chance theory is a model that outputs conditional probabilities, and you are told what it says.
  - **Admissibility and leakage**: The concept of inadmissible evidence as breaking conditional independence (leakage) maps very cleanly. If extra evidence \( E \) provides information about the outcome beyond what the reference model captures, then it's inadmissible. This is a core concept in avoiding leakage.
  - **Calibration**: The idea that a calibrated forecaster is one you should defer to when you have no extra information is central to the PP. If the reference model is well-calibrated (i.e., when it says an event has probability \( p \), it happens about \( p \) of the time), then setting your credence to \( p \) is rational.

  #### What had to be fudged?
  - **The normative authority of chance**: In the PP, there is a strong normative claim: you *should* set your credence to the chance. In your vocabulary, you might think of this as maximizing expected accuracy (e.g., by minimizing Brier score or log loss). But the PP doesn't derive from accuracy considerations alone; it's a fundamental principle of rationality. We fudged by appealing to calibration and the absence of leakage, which are reasons you might defer, but the philosopher's claim is stronger: even if you don't know the reference model is calibrated, if you know it is the *chance*, you should defer. This normative force is not fully captured by calibration because you can have multiple calibrated forecasters and you might have reasons (like sharper distributions) to prefer one over another. The PP says that if you know the chance, then regardless of other calibrated forecasters, you should use the chance.

  - **Self-undermining cases**: In the self-undermining example, we used a hierarchical model. But note that in the PP, the chance is supposed to be a fundamental physical probability. The hierarchical model is a way to represent it, but the puzzle arises because the chance theory is self-referential. In your vocabulary, you might try to fix the model by ensuring it is consistent (so that it doesn't assign positive probability to its own falsity), but the philosophical puzzle challenges the very coherence of such chance theories. We fudged by not diving into the resolution (the New Principal Principle) which involves conditionalizing on the entire chance theory rather than just the chance value.

  #### What has no expression in your vocabulary?
  - **Chance as a metaphysical entity**: In philosophy, chance is often thought of as an objective feature of the world, not just a statistical model. The PP claims that rational credence must align with this objective feature when known. Your vocabulary treats chance as a reference model, which is a useful analogy but doesn't capture the metaphysical weight. The idea that chance has a distinctive normative authority over belief (beyond being a well-calibrated forecast) is missing. For example, you might have two well-calibrated models, and you could choose either. But if one of them is the true chance, the PP says you must use that one. In practice, you might not know which model is the true chance, but the PP assumes you do.

  - **The concept of "rationality" beyond accuracy**: The PP is a principle of rationality, which in philosophy extends beyond just having good expected accuracy. It's about what it is to be rational. In your vocabulary, rationality is often about minimizing a proper scoring rule (i.e., maximizing expected accuracy). But the PP might require deferring to a chance even when you have a model that you believe is better (in terms of sharpness or some other criterion) but which isn't the chance. This goes beyond calibration and proper scoring rules.

  - **The resolution of self-undermining chances**: The New Principal Principle (or other amendments) involve more complex constraints that are not just about conditional independence. They require that your credence is set by conditionalizing on the entire chance theory, which might involve updating on the fact that the chance theory is true. This leads to a fixed-point problem: your credence must equal the chance that the theory says you should have, but the theory itself might depend on that credence. This fixed-point requirement doesn't have a direct analogue in your vocabulary.

  ### Conclusion
  To answer your question: a calibrated forecaster you should defer to (in the absence of leakage) is a big part of what the philosophers are talking about. But they are also making a stronger claim: that there is a unique, objective chance that you must defer to when you know it, regardless of whether you have other calibrated models. Your vocabulary of calibration and conditional independence captures the operational core of the Principal Principle, but it misses the metaphysical and normative aspects. The puzzles about inadmissible evidence map cleanly to leakage, but the self-undermining chances puzzle reveals a gap in the analogy because it involves a self-referential consistency condition that doesn't arise in typical machine learning models unless they are explicitly hierarchical and self-referential.

  In short, your vocabulary is sufficient for many practical purposes, but the philosophical account adds a layer of normative force and metaphysical objectivity that goes beyond calibration and conditional independence.

