  Hmm, the user mentions three key perspectives that keep sliding during their argument: global life-plan optimization, local expected-utility maximization, and commitment mechanisms. That's crucial - this isn't just about Parfit's case but about fundamental approaches to rationality. Their friend's branching selves argument suggests they're coming from a reductionist view of personal identity, while the user seems more inclined toward formal decision theory.

  I recall that David Gauthier's resolution theory tries to bridge this by treating commitments as part of rational choice, but that remains controversial. And Andy Egan's rejection of conditionalization in such cases shows how deep the divide runs. The temporal asymmetry in the hitchhiker case (unlike the toxin puzzle) really does seem to be the sticking point - whether we evaluate decisions at choice points or across time.

