answer: |-
  ## Epistemic Harmony & Rational Exchange Policy  
  **Effective Date:** 01 Jan 2024  
  **Policy Number:** EF-CKP-7.2 (Epistemic Foundations - Common Knowledge & Priors)  
  **Supersedes:** EF-CKP-6.9 ("Disagreement Resolution Protocols")

  **1. Introduction**  
  Rationalist Capital Management (RCM) operates on the foundational principle that agents sharing a common prior and common knowledge of each other's rationality *cannot* rationally agree to disagree (Aumann, 1976). Persistent disagreement constitutes evidence of either (a) irrationality, (b) differing priors (a hiring defect), or (c) failure to adequately communicate knowledge partitions. This policy formalizes procedures ensuring all internal beliefs and external trades adhere strictly to these game-theoretic imperatives, maximizing epistemic efficiency and minimizing arbitrageable inconsistencies ("Dutch Books").

  **2. Hiring & Prior Alignment Screening (Section 2.1.3 "Common Prior Verification")**
      2.1 All prospective employees (Levels Analyst I - Senior Epistemic Architect) must undergo Common Prior Assessment (CPA).
      2.2 CPA involves a 48-hour Bayesian Boot Camp, culminating in a Prior Alignment Interview (PAI). Candidates must demonstrate:
          *   2.2.1 Agreement with RCM Designated Priors (RCM-DP v.4.2) on 98% of calibrated estimation problems (e.g., probability of AGI by 2040, long-term SPX drift, optimal pizza topping distribution).
          *   2.2.2 *Failure to Agree*: Disagreement exceeding 2% margin triggers Prior Incompatibility Review (PIR). A divergence exceeding 5% constitutes automatic disqualification for "Persistent Prior Pathology" (PPP).^(1)
      2.3 **The Recruitment Paradox Clause:** Candidates expressing *strong agreement* with RCM's *current* active trading positions (see Section 4) must undergo enhanced scrutiny (Level 3 PAI). Rational agents possessing identical information and priors to RCM *should not* independently arrive at identical positions *before* being hired and exposed to RCM's unique knowledge aggregation protocols. Such agreement may indicate:
          *   2.3.1 Insider information leakage (Security Violation).
          *   2.3.2 Pathological agreeableness (Irrationality).
          *   2.3.3 Excessive time spent lurking on r/rationality (Cultural Misalignment).

  **3. Internal Disagreement Resolution (The "No Agreeing to Disagree" Protocol)**
      3.1 Observing persistent disagreement (>15 minutes) between two or more rational agents (verified by CPA) constitutes an Epistemic Anomaly Event (EAE), classified as a Tier 2 HR Incident.
      3.2 Mandatory Posterior Exchange Procedure (PEP):
          *   3.2.1 Disagreeing parties report to a designated Common Knowledge Mediator (CKM - typically a Senior Epistemic Architect).
          *   3.2.2 Parties sequestered in Soundproofed Signaling Booths (SSBs).
          *   3.2.3 Alternating rounds commence: Each party publicly announces their current posterior probability estimate for the proposition in dispute.
          *   3.2.4 Announcements are broadcast in real-time via the Common Knowledge Dashboard (CKD).
          *   3.2.5 Parties *must* update beliefs rationally using Bayes' theorem based on the announced posterior of the other party *and* the knowledge that the other party observed their own announcement (Common Knowledge of Rationality Iteration).
      3.3 **Convergence Requirement:** PEP continues until:
          *   3.3.1 Beliefs converge within a 0.5% tolerance band (Epistemic Harmony).
          *   3.3.2 **Non-Convergence (NC):** Failure to converge after 50 iterations triggers CKM intervention.
              *   3.3.2.1 CKM audits the agents' Bayesian updating logs for irrationality.
              *   3.3.2.2 If irrationality is found, agent is placed on Probationary Rationality Training (PRT).
              *   3.3.2.3 If updates are deemed rational, a Prior Defect Inquiry (PDI) is launched against both agents' original CPA results (Section 2.1.3). Discovering differing priors post-hire may result in termination for Prior Fraud.

  **4. External Trade Justification & Counterparty Epistemic Failure Memos (Section 4.7 "The No-Trade Theorem Compliance")**
      4.1 Per Milgrom-Stokey (1982), a rational trade between two parties sharing a common prior *cannot* occur unless both possess different information *and* believe the counterparty is trading based on inferior information or irrationality.
      4.2 Therefore, **every** trade executed by RCM *requires* a pre-trade Counterparty Epistemic Failure Justification Memo (CEFJM), submitted to the Department of Rational Exchange Oversight (DREO).
      4.3 The CEFJM **must** explicitly identify *which* condition justifies the trade:
          *   4.3.1 **Option A: Counterparty Irrationality (CI):** Provide evidence the counterparty exhibits systematic behavioral biases (e.g., overreaction to news, under-diversification, belief in technical analysis), quantified using RCM's Behavioral Deviation Index (BDI v.3.1).
          *   4.3.2 **Option B: Counterparty Misinformation (CM):** Demonstrate, via signed counterparty disclosure waivers or inferred informational asymmetry models (IAMs), that the counterparty lacks material non-public information *known to RCM* or possesses *incorrect* material information.
      4.4 **The Recursive Justification Clause:** If RCM seeks to trade with another quantitative fund (QF), the CEFJM must *also* address why the QF, presumed rational, would accept the trade. Standard justifications include:
          *   4.4.1 The QF suffers from CI (e.g., excessive reliance on overfitted models).
          *   4.4.2 The QF believes *RCM* suffers from CI or CM, making their willingness to trade rational from *their* perspective, even if mistaken.
          *   4.4.3 The QF has differing priors (evidence of poor QF hiring practices, not an RCM concern).
      4.5 **Trade Execution Block:** DREO may block any trade lacking a logically coherent CEFJM citing Milgrom-Stokey violations.

  **5. Appendix: Definitions**
      *   **Common Prior (RCM-DP v.4.2):** The canonical probability distribution over states of the world, pre-information arrival, as calibrated by the Chief Prior Officer (CPO). Includes priors on market microstructure, geopolitics, and Fermi Paradox resolutions.
      *   **Common Knowledge:** A fact is common knowledge if everyone knows it, everyone knows that everyone knows it, everyone knows that everyone knows that everyone knows it, and so on ad infinitum. Achieved internally via mandatory CKD announcements.
      *   **Dutch Book:** A set of bets leading to a certain loss, indicative of internally inconsistent probabilities. Considered a firing offense under Section 8.4 ("Avoiding Guaranteed Loss Like the Plague").

  ---

  ^(1) *General Counsel Note (Redacted - Overruled by CPO & Chief Rationality Officer):* "This PPP disqualification criterion may violate equal opportunity statutes regarding 'differing philosophical starting points.' Requiring agreement on the optimality of pineapple as a pizza topping seems particularly legally fraught." *CPO Response:* "Pineapple (Ananas comosus) topping optimality under RCM-DP v.4.2 is contingent on specific utility functions accounting for sweet/savory contrast and enzymatic tenderization. Disagreement reveals fundamental prior misalignment in gastronomic probability spaces, correlating strongly with mispricing exotic volatility surfaces. Legal's objection noted but overruled on grounds of epistemic necessity. See Appendix D: 'Pineapple and Volatility Smiles - A Unified Prior Framework.'"
