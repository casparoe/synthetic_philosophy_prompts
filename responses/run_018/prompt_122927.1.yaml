answer: |-
  **Bottom line:** She will rule *history* for the estate destroyed by the sea in this period and deeds perished in the same event, but *legend* for destruction in a single catastrophic storm; her rule is **"Accept core claims anchored by period-matched material or institutional evidence and lacking anachronism; reject unsupported specifics; accept self-sealing content only if it constitutes an inconvenient truth."**

  **Candidate Rules:**
  1.  **Anchor Plus:** Accept a claim if (a) material/institutional evidence *of the right period and kind* anchors the core event/agent, AND (b) the account lacks internal anachronism or contradictions with surviving records. Reject unsupported specifics (supernatural, precise motives, exact dates).
  2.  **Inconvenient Truth:** Accept self-sealing content (e.g., "evidence was destroyed") if it serves *no glorifying purpose* for the tradents and aligns with plausible institutional behavior, treating it as evidence rather than defeater.
  3.  **Cult-Last Principle:** Reject narratives *explicitly generated* to explain a material correlate (shrine, place-name) unless evidence shows the tradition preceded the site.

  **Predictions for New Case:**
  *   **Estate destroyed by sea (Period):** *History* by Anchor Plus (Marine clay/sand layer 1250-1330 matches claim period; rent fall, "lands lost" notes, hamlet disappearances are institutional evidence of loss; no anachronism).
  *   **Destroyed in single catastrophic storm (1287):** *Legend* by Anchor Plus (Abrupt sand sheet fits *an* event but lacks precise dating to 1287; chronicle’s specific date/storm unsupported by corroboration; wine cask detail akin to Troy’s divine machinery – unspecific embellishment).
  *   **Deeds perished in event:** *History* by Inconvenient Truth (Self-sealing claim "deeds lost" explains cartulary gap; gap is harder physical evidence to fake than forged charters; serves no glorification, only explains a loss, like Exodus' servitude tradition).

  **Reasoning:** The **closest analog is Law-Giver's Clauses**. Both involve institutional evidence (cartulary gap/provincial law-books) supporting an inconvenient administrative fact (lost deeds/restrictive clauses) against the institution's interest, accepted under Inconvenient Truth. The **competing analog is Martyr at the Spring** (cult-first rejection), but the commemorative cross here *postdates* the alleged event and is not the *cause* of the narrative; the narrative explains a documented *loss*, not the existence of the *site*. The tie breaks for Inconvenient Truth because the gap's physical nature and the lack of glorification make the self-sealing claim credible evidence, unlike the Martyr's invented origin story.

  **Levels:** Her record is **consistent across levels**. She distinguishes the *occurrence of a core event* (history) from the *reliability of specific narrative details* (legend) in Troy, Ford, and here. She asks "Did an event of this *kind* occur?" (estate loss, battle, clauses) and "Is this *specific account* reliable?" (single storm, portents, Regula’s story).

  **Self-Sealing Content:** It is **occasionally evidence**, specifically when it functions as an **Inconvenient Truth** (Exodus servitude, Law-Giver's clauses, here). It is a defeater only if it glorifies the tradents or lacks corroborative context (not applicable here).

  **Critical Test:** **Radiocarbon date organic material (e.g., twigs) *within* the abrupt sand sheet.** If it dates precisely to 1287, it would confirm the single catastrophic storm (refuting Anchor Plus' skepticism of specifics). If it dates elsewhere in 1250-1330, it would confirm the period loss but not the single storm, leaving the rules unchallenged. Inconvenient Truth (for deeds) remains viable regardless.
