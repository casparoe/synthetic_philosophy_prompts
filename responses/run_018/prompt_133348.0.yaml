prompt: |-
  I'm on a licensing board for protected wildlife and we keep getting submissions asking us to list 'cryptic species' or subspecies as full species, but our legal framework only protects biological species. I need a reusable decision procedure — like a checklist in order — that my team can actually run when a biologist claims two populations are seperate species and deserve seperate protection status. Ground it in the philosophy of taxonomy, not just 'what biologists usually do': cover ring species, asexual lineages, hybrid zones, and cases where DNA and morphology disagree. For each step say what counts as a sufficient answer, where the procedure stops with a 'no', and where it has to hand over to a human because it's a value judgement not a fact. Apply it to three proposals: a ring of salamanders round a valley where the end populations don't interbreed, a coral that looks identical to its neighbour but has partial gene flow, and a researcher pushing to split an asexual lizard population — the last one should be a case where your procedure gives an answer they won't like. Write it in British English please, and don't ask me for bibliographies — I can't search them up from here.
reasoning: |-
  We are creating a decision procedure grounded in the philosophy of taxonomy, particularly the species concept issue. The legal framework only protects biological species, so we must determine if the entities in question qualify as biological species under a generally accepted concept (with a focus on reproductive isolation as a key criterion). We'll consider edge cases: ring species, asexual lineages, hybrid zones, and discordance between DNA and morphology.

  The procedure will be a checklist in order. We must note that taxonomy has both factual and value-laden components. The procedure will stop with a 'no' when a necessary condition for species status is not met. It will hand over to a human when there is a need for a value judgement (e.g., which species concept to prioritise in a conflict, or how to weigh conflicting evidence).

  **Decision Procedure: Is it a Biological Species?**

  **Step 1: Are the populations reproductively isolated?**
     - **Check:** Do they interbreed in nature and produce fertile offspring? If they do, they are not separate species. If they do not, they might be.
     - **Sufficient for 'yes' at this step:** Clear evidence of no interbreeding in nature OR interbreeding but with complete hybrid infertility/sterility (like mules). 
     - **Stop with 'no':** If there is free interbreeding and production of fertile offspring in nature, then they are not separate species. Stop and reject the split.
     - **Hand over to human:** If the evidence is ambiguous (e.g., interbreeding occurs only under artificial conditions, or in a narrow hybrid zone) OR if there is partial gene flow. Also, if the populations are allopatric (geographically separated) and no direct test is possible, we must infer. This requires expert judgement.

  **Step 2: Is the reproductive isolation persistent and complete?**
     - **Check:** Even if there is some reproductive isolation, is it complete and stable? In hybrid zones, if there is substantial and persistent gene flow, then they are not fully isolated.
     - **Sufficient for 'yes':** Evidence that gene flow is negligible (e.g., <1% per generation) or that hybrids are consistently unfit (e.g., low survival or fertility) leading to distinct gene pools.
     - **Stop with 'no':** If gene flow is substantial (e.g., >10% per generation) and the populations are merging, then reject the split.
     - **Hand over to human:** If gene flow is intermediate (e.g., 1-10%) or the hybrid zone is stable (tension zone). Also, if the isolation is recent and we cannot predict stability, then human judgement is needed.

  **Step 3: Consider asexual reproduction.**
     - **Check:** Does the organism reproduce asexually? If yes, then the concept of reproductive isolation does not apply in the usual way. Asexual lineages are often classified based on genetic and morphological divergence.
     - **Sufficient for 'yes' to splitting:** If the asexual lineage is genetically distinct (e.g., fixed differences in multiple loci) and ecologically distinct (occupies a different niche), then it may be considered a separate species. However, note that the biological species concept (BSC) does not apply. We must use an alternative concept (e.g., phylogenetic species concept, PSC) but our legal framework requires biological species. Therefore, asexual organisms might not qualify under the law.
     - **Stop with 'no':** If the asexual lineage is not genetically distinct or does not form a monophyletic group, then reject the split. Also, if the law strictly requires interbreeding potential (which asexuals lack) then we must reject.
     - **Hand over to human:** Always, because asexual organisms challenge the BSC. The board must decide if they are willing to extend protection to asexual entities under an alternative concept, but note the legal framework only protects biological species. This step may lead to rejection unless the law is interpreted flexibly, which is a value judgement.

  **Step 4: Consider ring species and clinal variation.**
     - **Check:** Is the case a ring species? In a ring species, populations form a ring around a barrier, with adjacent populations interbreeding but the ends not interbreeding. The end populations are reproductively isolated but connected by gene flow through intermediates.
     - **Sufficient for 'yes' to split the end populations:** The end populations do not interbreed and are reproductively isolated. However, the entire ring is one species under the BSC because there is gene flow throughout the ring (except at the ends). Therefore, splitting the ends as separate species breaks the continuity. This is a paradox.
     - **Stop with 'no' for splitting the entire ring into multiple species:** Because the ring maintains genetic continuity, it is one species. We cannot split the ring arbitrarily. However, the end populations might be considered separate from each other but not from the intermediates? This is complex.
     - **Hand over to human:** Ring species are a grey area. The board must decide whether to protect the entire ring as one species or to consider the end populations as distinct. But note: the intermediates are not distinct. This is a value judgement about conservation priorities.

  **Step 5: Discordance between DNA and morphology.**
     - **Check:** Is there a conflict between genetic data (suggesting divergence) and morphological data (suggesting similarity) or vice versa?
     - **Sufficient for 'yes' to split:** If genetic data show deep divergence and reproductive isolation (e.g., fixed differences at many loci) even without morphological change (cryptic species), then they may be separate species. But we require evidence of reproductive isolation (Step 1) to be sure.
     - **Stop with 'no':** If genetic divergence is minimal (e.g., <2% in mitochondrial DNA and no fixed differences in nuclear DNA) and there is no evidence of reproductive isolation, then reject.
     - **Hand over to human:** If genetic divergence is substantial but there is no evidence of reproductive isolation (e.g., in allopatric populations) and morphological similarity persists. Then we must infer reproductive isolation from genetic divergence? This is controversial. Also, if morphology diverges without genetic divergence (rare), then a human must decide.

  **Step 6: Hybridization and introgression.**
     - **Check:** Do the populations hybridize and exchange genes? If hybridization is rare and has little effect, they might still be species. If it is common, they might not be.
     - **Sufficient for 'yes':** Hybridization is rare and hybrids are unfit, leading to minimal introgression. The populations maintain distinct gene pools.
     - **Stop with 'no':** Widespread hybridization and introgression leading to a single gene pool (e.g., no fixed differences and high gene flow).
     - **Hand over to human:** When there is a stable hybrid zone that persists without merging the populations. This requires judgement about the strength of isolation.

  **General Rule:** If at any step the answer leads to a stop with 'no', the procedure ends and the split is rejected. If we reach the end of the steps without a clear 'no' and without a handover, then the split may be accepted. But note that handovers require human judgement.

  **Applying the Procedure:**

  **Case 1: Ring of Salamanders around a Valley**
     - Step 1: The end populations do not interbreed. So, they are reproductively isolated from each other. But note: they are connected through intermediates. 
     - Step 4: This is a ring species. The end populations are isolated from each other, but the intermediates are connected by gene flow. The entire ring is one continuous gene pool. 
     - Handover to human: The board must decide. The BSC would consider the entire ring one species. Splitting the end populations would break the ring arbitrarily. However, the end populations are reproductively isolated and might be considered distinct. This is a value judgement. The board might decide to protect the entire ring as one species or to recognise the end populations as distinct. But note: the intermediates are not distinct. 

  **Case 2: Coral that looks identical to its neighbour but has partial gene flow**
     - Step 1: There is partial gene flow. So, not complete isolation. 
     - Step 2: If gene flow is substantial (e.g., >10%) then we stop with 'no'. But if it is low, we proceed. 
     - Step 5: Morphologically identical (cryptic) but genetically divergent? If genetic divergence is high and gene flow is low, then they might be separate species. But we must check the level of gene flow. 
     - Handover: If gene flow is intermediate, we hand over. Also, without clear reproductive isolation, it's ambiguous. 
     - Conclusion: If genetic divergence is high and gene flow is very low (e.g., <1%), then they might be species. But the board must decide how much gene flow is acceptable. This is a value judgement.

  **Case 3: Asexual Lizard Population**
     - Step 3: The population is asexual. The biological species concept (reproductive isolation) does not apply. 
     - Check: Are they genetically distinct? If yes, then under the phylogenetic species concept they might be a separate species. But our legal framework only protects biological species. 
     - Stop with 'no': Because the law requires biological species, and asexual organisms do not fit the BSC. Therefore, the split is rejected. 
     - Note: The researcher won't like this because they may argue for protection based on genetic distinctness. But the procedure stops at Step 3 with a 'no' due to the legal constraint.

  **Final Note:** The procedure is designed to be conservative. It rejects splits when the evidence does not meet the criteria for biological species. However, when value judgements are required, the board must weigh conservation needs, the risk of extinction, and the intent of the law.

  **Procedure Summary in Checklist Form:**

  1. **Reproductive Isolation:** 
     - No interbreeding in nature? → Proceed to Step 2.
     - Free interbreeding? → Stop: Reject split.
     - Ambiguous? → Hand over to human.

  2. **Persistent and Complete Isolation:**
     - Negligible gene flow? → Proceed to Step 3/4/5/6 as appropriate.
     - Substantial gene flow? → Stop: Reject split.
     - Intermediate gene flow? → Hand over to human.

  3. **Asexual Reproduction:**
     - Asexual? → Then under BSC, they are not biological species. Stop: Reject split (unless law is interpreted differently, which requires human judgement). 
     - Sexual? → Proceed to Step 4.

  4. **Ring Species:**
     - Ring species? → Then entire ring is one species under BSC. Stop: Reject splitting the ring (but handover for value judgement on protecting end populations separately?).

  5. **Discordance (DNA vs. Morphology):**
     - Genetic divergence without reproductive isolation? → Hand over to human.
     - Genetic divergence with evidence of isolation? → Proceed.
     - Minimal divergence? → Stop: Reject.

  6. **Hybridization:**
     - Minimal introgression? → Accept split.
     - Widespread introgression? → Stop: Reject.
     - Stable hybrid zone? → Hand over to human.

  Note: Steps 4, 5, and 6 are not necessarily sequential but are applied as needed based on the case. Step 3 is a critical filter for asexuals.

  We must remember that the procedure is a guide and may require iteration. Also, the board must document the reasoning for each step.
answer: |-
  Below is a reusable decision procedure grounded in taxonomic philosophy, designed to assess whether populations qualify as biological species under your legal framework. It prioritises reproductive isolation as the core criterion (per the Biological Species Concept, BSC), while addressing edge cases through a step-wise checklist. Each step specifies:  
  - **Sufficient answer**: Conditions to proceed or accept species status.  
  - **Stop with 'no'**: Clear failure to meet BSC criteria.  
  - **Handover to human**: Ambiguity requiring value judgements (e.g., weighing evidence, conservation priorities).  

  The procedure is sequential; a "stop with 'no'" at any step ends the process. British English is used throughout.  

  ---

  ### **Decision Procedure: Assessing Species Status**  
  **Legal Standard**: Protection requires meeting the **Biological Species Concept (BSC)**, defined as *a group of interbreeding natural populations reproductively isolated from other such groups*.  

  #### **Step 1: Confirm BSC Applicability**  
    - **Check**: Is the lineage **sexually reproducing**?  
      - *Sufficient for 'yes'*: Sexual reproduction confirmed (proceed to Step 2).  
      - *Stop with 'no'*: Asexual reproduction (e.g., parthenogenetic lizards). BSC cannot apply, as no interbreeding occurs.  
      - *Handover to human*: Mixed/optional sexual reproduction (e.g., some corals). Requires judgement on primary reproductive mode.  

  #### **Step 2: Assess Reproductive Isolation in Sympatry**  
    - **Check**: If populations overlap geographically, is there **evidence of reproductive isolation**?  
      - *Sufficient for 'yes'*:  
        - No interbreeding in wild observations, **or**  
        - Hybrids absent/sterile (e.g., mule-like infertility).  
      - *Stop with 'no'*:  
        - Documented interbreeding with fertile offspring *and* no barriers (e.g., shared gene pool).  
      - *Handover to human*:  
        - Partial hybridisation (e.g., stable hybrid zones).  
        - Conflicting data (e.g., genetic mixing but behavioural avoidance).  

  #### **Step 3: Assess Reproductive Isolation in Allopatry (if applicable)**  
    - **Check**: For geographically separated populations, would interbreeding occur **if barriers were removed**?  
      - *Sufficient for 'yes'*:  
        - Strong pre/post-zygotic barriers (e.g., genetic incompatibility, mate recognition failure).  
      - *Stop with 'no'*:  
        - Populations interbreed freely when brought together (e.g., in controlled trials).  
      - *Handover to human*:  
        - Inferred barriers without direct testing (e.g., deep genetic divergence without ecological contact).  

  #### **Step 4: Evaluate Ring Species Dynamics**  
    - **Check**: Is there a **continuous ring of populations** with gene flow between neighbours but reproductive isolation at endpoints?  
      - *Sufficient for 'yes'** to endpoints as species:  
        - End populations cannot interbreed when sympatric **and** gene flow is bidirectional (not one-way).  
      - *Stop with 'no'*:  
        - End populations show gene flow (e.g., via intermediates).  
      - *Handover to human*:  
        - All cases. Ring species challenge BSC; endpoints are isolated but connected through the ring. Humans must decide:  
          - Protect endpoints only? (Undermines ring's genetic continuity).  
          - Protect entire ring? (Ignores endpoint isolation).  

  #### **Step 5: Resolve DNA-Morphology Discordance**  
    - **Check**: Is there **significant genetic divergence without corresponding morphological differences** (or vice versa)?  
      - *Sufficient for 'yes'*:  
        - Genetic evidence of isolation (e.g., fixed nucleotide differences) **and** BSC criteria met in Steps 2-4.  
      - *Stop with 'no'*:  
        - Genetic divergence is minimal (e.g., <2% mtDNA difference) *and* no isolation barriers.  
      - *Handover to human*:  
        - Genetic divergence without proven reproductive isolation (e.g., allopatric "cryptic" populations).  
        - Morphological divergence without genetic support. Humans must weigh:  
          - Is genetic divergence diagnostic of speciation?  
          - Should morphology override genetics?  

  #### **Step 6: Final Hybridisation Review**  
    - **Check**: Does **hybridisation compromise species boundaries**?  
      - *Sufficient for 'yes'*:  
        - Hybrids are rare/unfit **and** parental gene pools remain distinct.  
      - *Stop with 'no'*:  
        - Hybridisation erodes divergence (e.g., >10% gene flow per generation).  
      - *Handover to human*:  
        - Hybrid zones with stable boundaries (e.g., tension zones). Humans must judge if divergence is maintained.  

  ---

  ### **Application to Cases**  
  #### **Case 1: Salamander Ring Species**  
  - **Step 1**: Sexual reproduction → Proceed.  
  - **Step 2**: End populations sympatric but don’t interbreed → *Sufficient for 'yes'* to isolation.  
  - **Step 4**: Ring structure confirmed → *Handover to human*.  
    - **Human judgement**: Endpoints are reproductively isolated, but intermediates bridge gene flow. BSC considers the ring one species. **Decision**: Reject split (legal framework prioritises BSC unity).  

  #### **Case 2: Cryptic Coral with Partial Gene Flow**  
  - **Step 1**: Mixed reproduction (sexual + budding) → *Handover to human*.  
    - **Human judgement**: Sexual reproduction is primary → Proceed.  
  - **Step 2**: Sympatric, identical morphology, but partial gene flow (5%) → *Handover to human*.  
  - **Step 5**: Genetic divergence high, but gene flow present → *Handover to human*.  
    - **Human judgement**: Gene flow prevents full isolation. **Decision**: Reject split (fails BSC).  

  #### **Case 3: Asexual Lizard Population**  
  - **Step 1**: Asexual reproduction → ***Stop with 'no'***.  
    - **Outcome**: Split rejected. BSC inapplicable.  
    - **Researcher dissatisfaction**: Likely, as genetic divergence may be high. However, the law requires sexual interbreeding potential. The procedure halts here—no further steps.  

  ---

  ### **Procedure Summary**  
  1. **Sexual reproduction?** → If no, stop (asexuals excluded).  
  2. **Reproductive isolation in sympatry?** → If no, stop.  
  3. **Reproductive isolation in allopatry?** → If no, stop.  
  4. **Ring species?** → Always handover (BSC paradox).  
  5. **DNA-morphology conflict?** → Handover if isolation unproven.  
  6. **Hybridisation threat?** → Stop if gene flow erodes divergence.  

  **Key Principles**:  
  - BSC is prioritised; alternatives (e.g., Phylogenetic Species Concept) are inadmissible under your law.  
  - "Handover" steps acknowledge taxonomy’s inherent value judgements (e.g., defining "significant" divergence).  
  - Asexual lineages, ring species, and cryptic taxa are resolved strictly against splitting unless BSC criteria are unambiguously met.  

  This procedure ensures consistency with your legal mandate while transparently flagging cases requiring ethical/policy deliberation.
