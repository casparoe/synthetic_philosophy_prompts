prompt: |-
  hey im putting together a prompt dataset and need your take. rank these four positions on whether societies should actively forget traumatic pasts, 1 being 'strongest case for forgetting' and 4 being 'strongest case for remembering': margalit's view that shared memory binds moral communities, rieff's claim that modern therapeutic culture erases the sacred weight of suffering, a 'mnemonic triage' stance that only archives trauma with direct survivors still alive, and a kind of archival nihilism saying all institutional memory is just disciplinary power. one sentence each on why they land where they do, and actually defend the ordering—dont just list them. also no need for citations, im just testing reasoning.
