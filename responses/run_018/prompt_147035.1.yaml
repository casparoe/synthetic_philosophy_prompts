prompt: |-
  hey, im a phil of science phd working on functional explanation and i keep running into this specific argumentative slide. someone argues that feature F is important because evolution 'designed' it for job J -- say, sleep spindles for memory consolidation -- but then when you press them on whether J is actually what F does mechanistically right now, they pivot to saying well F participates in pathway P so it 'functions' in the system regardless of origin. they act like these are two angles on the same fact, but they're not: J might be a just-so story and P might be a spandrel. is there an actual name for this move where evolutionary origin and current system-role get smuggled together under one word? i know about the two theories of function but im asking about the rhetoric, not the ontology. if theres no term, coin one and say exactly how it differs from plain equivocation. please answer in exactly five numbered points, each one or two sentences, with no introduction or conclusion.
