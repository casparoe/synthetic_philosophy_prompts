  I recall that in philosophy circles, this is a known issue but lacks a standard rhetorical term. "Function creep" comes to mind as a potential coinage - it captures how the meaning of "function" surreptitiously shifts between historical selection and current causal role. The key difference from plain equivocation is that it exploits the legitimate ambiguity of "function" in biology to create an illegitimate inference.

  The user's frustration makes sense - this slide effectively immunizes functional claims from criticism by switching between explanatory frameworks. When J is challenged, they retreat to P's systemic role, implying both are proven when neither actually is. It's a bait-and-switch using the polysemy of "function."

