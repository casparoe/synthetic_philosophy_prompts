  The last line: "This flowchart sorts you into one of the major views on persistence by testing your intuitions on cases of change and co-location."

  Now, about whether Hume is a closet perdurantist: 
     Hume says that the idea of a succession of related objects is a notion of diversity, not identity. Perdurantism does posit diversity in the temporal parts, but it also says that they compose a single object (the worm). Hume does not endorse that there is a single object. So he is not a perdurantist. He is a deflationist.

