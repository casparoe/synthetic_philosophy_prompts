  The user also wants to note any answer combination that looks coherent but unoccupied. 

  For example, someone might say at node 4 that the statue and lump are the same object (so they are an endurantist without co-location) and then at the Ship of Theseus (if we had asked) they might choose R. That's coherent. Similarly, someone with co-location might choose either R or O.

  But we didn't ask the Ship of Theseus question in the tree for endurantism.

  We can add it as a follow-up for reflection, but not for branching.

  Finally, we need to:

  - Tell which leaf Hume himself lands in: Obviously, the Humean/deflationist leaf.

  - And whether his calling the succession idea "as perfect a notion of diversity" makes him a closet perdurantist.

     Perdurantism is a view that objects are successions of temporal parts. Hume's view is that our idea of identity is a confusion of identity (which is unchanging) and succession (which is a diversity). But he says that the succession of related objects is diversity, not identity. This is compatible with perdurantism? Not exactly, because perdurantism does say that the whole succession is one object (the worm). Hume is saying that there is no identity over time, only diversity. So he is closer to stage theory? Or to deflationism.

     Hume is not a perdurantist because perdurantism is a metaphysical view that there are persisting objects (worms) that have temporal parts. Hume is skeptical about persisting objects altogether. So he is a deflationist.

  Last line: a one-sentence summary.

  Let's write the full tree with nodes and leaves.

  Flowchart:

  1. Do you agree with Hume that our idea of an object persisting through change is a confusion of two distinct ideas (one of an unchanging object and one of a succession of related objects), so that persistence is something to be explained away rather than explained?
     - Yes -> Leaf: Humean/deflationist
          Awkward commitment: There are no persisting objects; what we call persistence is just a succession of related events or objects.
     - No -> Go to 2.

  2. How do you explain that the same person can be sitting at noon and standing at one o'clock?
     - The person at noon and the person at one are two different entities. -> Go to 3.
     - The person at noon and the person at one are one and the same entity (the same object) that has changed. -> Go to 4.

  3. At a given time (e.g., noon), besides the person-stage that we see, is there also a larger four-dimensional object that includes the entire history of the person?
     - No, there is only the stage at noon. The larger object is just a collection of stages. -> Leaf: Stage theory
          Awkward commitment: Ordinary objects are instantaneous stages, and what we call persistence is just a relation (like similarity and causal connectedness) between distinct stages.
     - Yes, there is the stage at noon and also the four-dimensional person that has that stage as a part. -> Leaf: Perdurantism (worm theory)
          Awkward commitment: Ordinary objects are spread out in time and have temporal parts; you are never wholly present at any moment.

  4. In the case of the statue and the lump of clay that coincide for a period of time, are the statue and the lump the same object or two different objects?
     - They are the same object. -> Leaf: Endurantism without co-location
          Awkward commitment: When the statue is destroyed (squashed), the lump is also destroyed, even though the clay continues to exist.
     - They are two different objects. -> Leaf: Endurantism with co-location
          Awkward commitment: Two completely distinct objects (the statue and the lump) can be in the same place at the same time, made of the same matter, and yet have different persistence conditions.

  Note: We have not used the Ship of Theseus, the lump losing a chip, or the road case. We used the person case for change and the statue/lump for co-location.

