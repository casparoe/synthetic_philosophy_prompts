prompt: |-
  I am preparing questions for a podcast interview with an unnamed philosopher who defends a refined version of Popper’s argument that history has no predictive laws. She grants Popper’s distinction between trends and universal laws but introduces her own addition: that history does contain “negative structural regularities,” law-like constraints on which institutional combinations are unstable, without permitting any positive forecast of what will actually occur. I need eight to ten interview questions that do not simply ask her to restate Popper’s view but instead press specifically on this addition. At least one question should ask whether these negative regularities escape Popper’s critique of extrapolating historical trends into the future; at least one should compare her view to evolutionary epistemology’s claim that cultural selection operates with law-like mechanisms that are not prophetic; and at least one should present a concrete hypothetical—say, the repeated fiscal crises of empires that issue paper currency across different technological eras—to ask whether she classifies that recurrence as a structural constraint or as a non-lawful pattern. For each main question, include a brief follow-up keyed to the answer she is most likely to give. Please present the questions in continuous prose only, with no headings, bullet points, bold text, or tables, as you would in a letter or email.
