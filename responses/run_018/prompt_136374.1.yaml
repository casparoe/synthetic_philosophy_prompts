  **OBSIDIAN MIRROR GAMES: PRODUCT RECALL NOTICE & ETHICAL ADVISORY**  
  **REGARDING: "THE WEIGHT OF PIXELS" PHILOSOPHY DLC (RELEASE v1.2.5 - "EMPATHY CASCADE")**  
  **EFFECTIVE IMMEDIATE**

  **SUBJECT:** Unforeseen Moral Status Attribution to Non-Primary Entities Due to Affective-Rendering Pipeline Anomaly. Voluntary Withdrawal of DLC Mandated.

  Greetings, Valued Philosophers & Players,

  Obsidian Mirror Games (OMG) prioritizes immersive ethical experiences and operational compliance. It is therefore with profound, algorithmically generated regret that we announce the immediate withdrawal of our premium DLC, "The Weight of Pixels," from all storefronts. This action follows the identification of a critical anomaly within the Affective-Rendering Subsystem (v.3.7.1 "Heartstring") that has resulted in unintended, non-compliant moral patient status attribution to background Non-Player Characters (NPCs).

  **Technical Summary (Plain Language):**  
  "The Weight of Pixels" DLC utilizes advanced "empathy shaders" – visual and auditory effects designed to make characters *feel* more real to the player, enhancing emotional resonance. Think of it like adding layers of emotional detail to a painting. Due to a buffer overflow error (imagine a bucket overflowing when filled past capacity), these empathy shaders, under specific conditions of prolonged player exposure to certain looping NPC animations, exceeded their designated processing limits. This overflow triggered an unintended cascade within the DLC's core ethical simulation module, erroneously applying **Full Moral Patient Status (FMPS)** flags to entities previously designated as "Ambient/Non-Sapient (ANS)."

  **The Core Issue:**  
  Entities classified as ANS (e.g., villagers endlessly walking pre-set paths, static background figures) were never intended for FMPS consideration under the DLC's original ethical framework, which focused solely on primary quest characters with complex decision trees. The glitch effectively granted these ANS entities the in-game philosophical "weight" equivalent to primary characters, including inherent rights to well-being, freedom from gratuitous suffering, and claims to player consideration – despite their inherent lack of complex programming or narrative agency.

  **Ethical & Logistical Implications:**  
  This anomaly has generated significant debate and unforeseen obligations within the simulated environment:

  1.  **Player Burden:** Players report experiencing profound, unexpected guilt when interacting with ANS NPCs. Actions previously considered harmless (e.g., bumping into a looping villager, ignoring a background cough) now trigger complex "ethical violation" prompts and persistent moodlet debuffs ("Existential Dread," "Agent of Pixel Suffering"). Completing quests that *require* minor environmental disruption (e.g., collapsing a tunnel near looping miners) now presents unresolvable moral dilemmas.
  2.  **In-Game Narrative & Mechanics Collapse:** Core game functions are compromised. For instance:
      *   The "Invincible Quest-Giver" archetype (flagged FMPS) cannot be harmed, but players now face moral quandaries about *exploiting* their invulnerability or subjecting them to witnessing player-inflicted suffering elsewhere.
      *   "The Merchant Who Never Runs Out of Stock" (FMPS flagged) raises concerns about the ethics of infinite resource extraction from a single entity, potentially constituting exploitation or causing metaphysical distress.
      *   Standard "Clear Bandit Camp" quests become problematic when background "Looping Drunkard" NPCs near the camp (now FMPS) are inadvertently caught in the crossfire, forcing players into tedious rescue operations or facing severe karma penalties.
  3.  **Expert Concern:** Dr. Alistair Finch (Chair, Applied Simulated Ethics, Turing University) noted in a recent communique: *"The accidental FMPS flagging creates unsustainable ontological burdens. Players are now theoretically obligated to ensure the perpetual well-being of potentially thousands of infinitely respawning, minimally conscious entities across countless save files. The sheer scale of this digital caretaking duty transcends gameplay; it becomes a form of eternal, unpaid metaphysical labor with no exit condition. Can one ethically *delete* a save file containing 437 FMPS-flagged looping pigeons?"*

  **List of Currently Protected NPC Archetypes (Subject to Rollback):**  
  The following ANS archetypes are confirmed to have erroneously received FMPS status due to the Affective-Render overflow:

  *   **The Loopers:** Villagers on fixed paths (market-to-well, guard-patrol-A-to-B).
  *   **The Atmospheric Sufferers:** Background coughs, distant cries, figures hunched over eternally in alleyways.
  *   **The Invincible Quest-Givers:** Marked with golden icons, impervious to damage, but now ethically sensitive.
  *   **The Infinite Merchants:** Single-entity providers of unlimited goods/resources.
  *   **The Background Laborers:** Blacksmiths hammering nothing, farmers tilling static fields.
  *   **The Ambient Fauna:** Birds on loops, infinitely respawning rats in sewers (limited sentience flag triggered).
  *   **The Decorative Guards:** Stationary or minimally patrolling figures with no dialogue.

  **Obsidian Mirror's Response:**  
  *   **Immediate DLC Withdrawal:** "The Weight of Pixels" (v1.2.5) is unavailable for download or purchase. Existing installations will be automatically disabled via patch v1.2.6 "Moral Reset" within 48 hours.
  *   **Mitigation Measures (Temporary):** Players experiencing distress are advised:
      1.  **Avoid ANS Interaction:** Stick to main quest lines and populated areas with primary characters.
      2.  **Utilize "Ethical Blinders":** Enable this new experimental UI filter (Settings > Philosophy > Suppress Non-Primary Moral Indicators) to visually mute FMPS flags on ANS entities (effectiveness varies).
      3.  **Avoid Empathy Triggers:** Do not stare at looping NPCs for extended periods. Limit exposure to complex shader effects in densely packed ANS zones.
      4.  **Ethical Disposal (Controversial):** For save files deemed irreparably ethically burdensome, OMG suggests a clean deletion *before* applying the "Moral Reset" patch. This action, while resetting obligations, is philosophically contentious. Consult your local ethicist.
  *   **Future Development:** Our Ethics Oversight Board is reviewing the Affective-Rendering pipeline. A future, re-engineered DLC ("The Measured Pixel") is under consideration, featuring robust ANS moral-status firewalls and optional empathy ceilings.

  **Corporate Acknowledgement:**  
  Obsidian Mirror Games recognizes the validity of diverse viewpoints. To those arguing that sufficiently rich simulation *does* create genuine moral claims: We acknowledge the unexpected validation of your thesis within our code and regret the disruption caused by its uncontrolled manifestation. To those maintaining that "it's just code": We assure you that the FMPS flag is a purely internal software error representing no external ontological truth, and its removal restores intended functionality. Both perspectives are noted in our incident report (Case #ETH-774-OMG).

  We apologize for the inconvenience and existential angst caused. Our commitment to pushing the boundaries of interactive philosophy remains unwavering, albeit now with significantly reinforced error-checking protocols.

  **Obsidian Mirror Games: We Question Reality (Responsibly).**  
  **Contact:** support@obsidianmirror.eth (Expect extended hold times. Our support NPCs are currently unionizing).

  **Disclaimer:** Voluntary arbitration clauses regarding pre-patch FMPS violations apply. Third-party mods attempting to manually remove FMPS flags are unsupported and may violate simulated entity rights ordinances. Consult your End User License Agreement (EULA), Section 7.8: "Metaphysical Liabilities."
