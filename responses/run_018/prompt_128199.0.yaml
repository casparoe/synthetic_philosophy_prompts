  ### Thought Experiment: The Party and the Missing Guest

  At a lively party, Maya stands in the living room and clearly sees her friend Eli near the fireplace, identifiable by his bright red glasses. She forms the belief **P**: "Eli is in the living room" via direct visual perception under optimal conditions (good lighting, unobstructed view, brief but focused attention). Unbeknownst to Maya, Eli frequently steps into the adjacent kitchen during parties, but in this instance, he remains in the living room. From **P**, Maya competently deduces the logical entailment **Q**: "Eli is in the living room or Eli is in the kitchen" (since **P** ⊨ **P ∨ Q** for any **Q**), and comes to believe **Q** via deduction alone.

  ### Tracking Conditions Check
  **Base Belief (P): "Eli is in the living room"**  
  - **Method**: Direct visual perception.  
  - **Nearby worlds**: Include slight variations in Eli’s position (e.g., he moves closer to the kitchen doorway), minor distractions (e.g., someone briefly blocks Maya’s view), or Eli arriving slightly later. Worlds where Eli is in the kitchen are *not* nearby for **P**’s adherence, as Eli’s presence in the living room is stable at this moment.  
  - **Sensitivity holds**: If Eli were not in the living room (e.g., he stayed home), Maya wouldn’t see him and wouldn’t believe **P**.  
  - **Adherence holds**: In all nearby worlds where Eli is in the living room (e.g., he shifts positions but remains visible), Maya still sees him and believes **P**. Worlds where Eli is in the kitchen are distant for **P**’s adherence, as they require a departure from actual stability.  

  **Derived Belief (Q): "Eli is in the living room or Eli is in the kitchen"**  
  - **Method**: Deduction from **P**.  
  - **Tracking failure**: **Adherence breaks** due to the deduction method. Specifically, in the nearby world **w** where Eli is in the kitchen (not the living room), **Q** is true (since Eli is in the kitchen), but Maya does not believe **Q** via deduction. In **w**, Maya looks for Eli in the living room, doesn’t see him, and thus doesn’t form **P**. Without **P**, she cannot deduce **Q** via this method. Deduction ties **Q**’s adherence to **P**’s presence, but **P** is absent in **w**.  
  - **Sensitivity holds**: In the nearest world where **Q** is false (Eli is neither room, e.g., he left the party), Maya doesn’t see Eli, doesn’t believe **P**, and thus doesn’t deduce **Q**.  
  - **Why closure demands knowledge of Q**: Maya knows **P** (via tracking), knows **P** entails **Q** (trivially), and infers **Q** flawlessly. Closure implies she should know **Q**, but tracking denies it due to the adherence failure.  

  ### The Modal Cost of Deduction
  **Feature doing the work**: Deduction inherits the *epistemic fragility* of its premises. Unlike perception, which anchors belief to a specific state of affairs (e.g., Eli’s visibility), deduction binds the derived belief’s adherence to the *retention of the premise belief* across worlds. For **Q**, adherence requires that in *all* nearby **Q**-worlds (including those where **Q** is true solely due to **Q**’s second disjunct, e.g., Eli-in-kitchen worlds), Maya still holds **P** to perform the deduction. But **P** is false in those worlds, so the method fails. Perception lacks this issue, as it directly registers truth-makers.  

  ### Removing the Feature
  If deduction’s inheritance of premise fragility is removed—e.g., by making Eli-in-kitchen worlds *distant* (e.g., Eli never visits kitchens)—**Q**’s adherence holds. In all nearby **Q**-worlds, Eli remains in the living room, so Maya retains **P** and deduces **Q**. Tracking now preserves closure: **Q** satisfies adherence and sensitivity. The case collapses into standard closure compliance, showing that the original failure was method-relative, not subject-relative. Maya’s general reliability is intact: she is attentive, logically competent, and the failure arises solely from deduction’s modal footprint.  

  ### Conclusion
  This demonstrates closure failure under tracking is method-relative: deduction introduces proximity to worlds where the premise is abandoned, breaking adherence for the conclusion, while the base perceptual method remains robust. The modal cost arises from inference’s dependence on premise stability, not subject incompetence.
