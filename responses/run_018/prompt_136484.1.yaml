  Debrief (60 minutes):

     Map each stage to the formal structure of the dilemma.

     Stage 1: Private voting -> individual judgments.
     Stage 2: Unweighted aggregation -> shows the dilemma: the group may not be consistent even if individuals are? Actually, in our vote, individuals are not all consistent. But the point is that the two methods conflict.

