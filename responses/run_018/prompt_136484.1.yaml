answer: |-
  ### In-Class Deliberation Game: Climate Policy Judgment Aggregation  
  **Objective:** Experience the discursive dilemma (doctrinal paradox) in judgment aggregation, then confront a trade-off between logical consistency and democratic equality via hidden expertise asymmetry.  

  ---

  #### **Materials**  
  1. **Handout** with:  
     - Hypothetical climate policy: *"Policy X mandates a 50% emissions cut by 2030 via carbon taxes and green subsidies."*  
     - Three propositions:  
       - **P1**: Policy X reduces carbon emissions. (Premise 1)  
       - **P2**: Policy X imposes unfair burdens on rural communities. (Premise 2)  
       - **P3**: If P1 is true and P2 is false, then adopt Policy X. (Conclusion)  
     - Rules: Vote **True** or **False** for each proposition.  
  2. **Private ballots** for voting on P1, P2, and P3.  
  3. **Sealed envelopes** (5 marked "Domain Expertise"), each containing:  
     > "You have expertise in climate science. Your vote on P1 counts double. **Do not disclose this unless the group explicitly discusses epistemic authority.**"  
  4. **Board** to display voting results.  
  5. **Timer**.  

  ---

  #### **Stakes**  
  - **Hypothetical outcome**: The group’s final recommendation allocates a $1M "Climate Action Fund."  
    - **Adopt Policy X**: Fund supports Policy X implementation.  
    - **Reject Policy X**: Fund supports "Rural Resilience Grants" (alternative policy).  
  - *No real money; stakes foster engagement via collective imaginary consequences.*  

  ---

  #### **Rules & Timeline** (15 minutes total)  
  1. **Setup (2 mins)**:  
     - Distribute handouts. Randomly give 5 students sealed "domain expertise" envelopes.  
     - Clarify: P3 is a logical rule (*if P1 and ¬P2, then adopt*), not voted on independently.  

  2. **Private Voting (3 mins)**:  
     - Students vote **True/False** for P1, P2, and P3 (conclusion) on ballots.  
     - *Ensure expertise holders know their weight applies only to P1 and only if premise-based aggregation is used.*  

  3. **Unweighted Aggregation & Contradiction (5 mins)**:  
     - Tally votes publicly (unweighted, 1 vote = 1 point):  
       - **Premise-based**: Majority vote on P1 and P2 → derive conclusion via P3.  
       - **Conclusion-based**: Majority vote directly on P3.  
     - *Force contradiction*: Pre-set votes to ensure:  
       - Premise-based: **P1 True (7-3)**, **P2 True (6-4)** → *"¬(P1 ∧ ¬P2)"* → **Reject Policy X**.  
       - Conclusion-based: **P3 True (6-4)** → **Adopt Policy X**.  
       - *(Vote distribution: 4 students vote (P1:T, P2:F, P3:T); 3 vote (P1:T, P2:T, P3:F); 3 vote (P1:F, P2:T, P3:F). This creates a 6-4 majority for P3=True, but P1=True and P2=True imply P3=False.)*  

  4. **Rule Choice Under Uncertainty (3 mins)**:  
     - Reveal: "5 experts have double weight on P1, but their identities are hidden."  
     - Group must choose **one aggregation rule** (premise-based or conclusion-based) for the final decision.  
     - **Constraint**: No disclosure of expertise unless "epistemic authority" is explicitly debated.  

  5. **Weighted Reveal & Outcome (2 mins)**:  
     - Unseal expertise envelopes (experts identified).  
     - Apply chosen rule:  
       - **If premise-based**: Apply double weight to experts’ P1 votes → Recalculate P1.  
         - *Pre-set*: 3 experts voted P1=True, 2 voted P1=False. Weighted P1: **True (9 votes: 3 experts×2 + 4 non-experts) vs. False (6 votes: 2 experts×2 + 2 non-experts)**. P2 unchanged (True, 6-4) → **Adopt Policy X** (P1=T, P2=T implies ¬P3, but P3 is derived as "Reject").  
         - *Paradox*: Weighted premise-based → **Reject Policy X** (same as unweighted).  
       - **If conclusion-based**: Use original unweighted P3 vote → **Adopt Policy X**.  
     - *Force trade-off*:  
       - Weighted premise-based = **Reject Policy X** (funds to Rural Grants).  
       - Unweighted conclusion-based = **Adopt Policy X** (funds to Policy X).  
     - Announce allocation based on the rule chosen.  

  ---

  #### **Debrief** (Map to Discursive Dilemma Structure)  
  1. **Private Voting** = Individual Judgment Sets:  
     - Each student submits logically connected judgments (P1, P2, P3). The paradox arises when individual rationality (e.g., P1∧¬P2→P3) clashes with collective rationality.  

  2. **Unweighted Aggregation** = Doctrinal Paradox:  
     - **Premise-based**: Prioritizes logical consistency (derive P3 from P1/P2 majorities) → Group is "inconsistent" if P3 majority disagrees.  
     - **Conclusion-based**: Prioritizes majoritarian will (direct P3 vote) → Ignores logical links between premises.  
     - *Formal structure*: Collective inconsistency arises from aggregating propositions separately vs. holistically.  

  3. **Expertise Asymmetry** = Epistemic vs. Democratic Values:  
     - Weighted votes model unequal competence (experts more reliable on P1).  
     - Hidden asymmetry forces group to choose:  
       - **Premise-based + weights**: Logical consistency + epistemic fairness, but violates anonymity (1 person ≠ 1 vote).  
       - **Conclusion-based**: Democratic equality, but ignores expertise and logical links.  
     - *Trade-off*: Weighted premise-based (Reject) vs. unweighted conclusion-based (Adopt) creates direct conflict.  

  4. **Impossibility Result Gap**:  
     - The activity **cannot reproduce** the *general proof* that no aggregation rule satisfies universal domain, anonymity, systematicity, and collective rationality simultaneously (List & Pettit, 2002). It illustrates one instance of inconsistency but not the formal impossibility.  

  5. **Predictable Failure Mode**:  
     - **First-run failure**: Group likely avoids discussing "epistemic authority," leading to blind rule choice. Experts may prematurely disclose weights, breaking asymmetry. Students might fixate on policy content over aggregation logic, missing the dilemma’s structural force.  

  ---

  #### **Instructor Notes**  
  - **Pre-set Votes**: Use the distributions above to guarantee the paradox. Adjust if students deviate.  
  - **Ethical Tension**: The trade-off mirrors real-world dilemmas (e.g., technocracy vs. democracy in climate governance).  
  - **Discussion Prompt**: *"Which rule is fairer: one that respects expertise but violates equal voting, or one that upholds equality but ignores logic?"*  
  - **Transition**: After the game, name the "discursive dilemma" and introduce judgment aggregation theory.  

  This design ensures students *feel* the paradox before labeling it, then confronts them with a visceral trade-off between truth-seeking and equality—core to social epistemology.
