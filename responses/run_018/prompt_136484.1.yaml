     Predictable failure mode on the first run:
          The group might spend too much time in the discussion on choosing the rule (step 4) and go over the 2 minutes. Or they might not notice the hidden expertise and choose a rule without discussing epistemic authority. Also, the individuals might not be able to resist disclosing their expertise.

