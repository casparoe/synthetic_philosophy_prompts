answer: |-
  Here are the desiderata for any theory of coherent extrapolated volition (CEV) or idealised preferences, formulated as evaluative criteria. Each specifies a concrete capability, conceptual distinction, or philosophical commitment the theory must satisfy, alongside its rationale:

  1.  **Normative Robustness Against Perverse Outcomes**
      *   **Requirement:** The theory must preclude outcomes universally recognised as catastrophic or normatively absurd under any coherent value system (e.g., extinction of all sentient life, universal extreme suffering, permanent totalitarianism) from being the result of implementing the idealised volition, *unless* coherently justified by the agent's own deepest values.
      *   **Rationale:** Avoids theories where minor flaws in initial preferences or extrapolation procedures lead to existential disaster. A counter-example would be a theory where a slight initial preference for efficiency, fully extrapolated, mandates human extinction to minimise resource waste.
      *   **Conceptual Distinction:** Must respect the distinction between *procedural flaws* (errors in reaching idealisation) and *genuinely held, coherent but abhorrent values*.

  2.  **Epistemic Humility & Simulability Constraint**
      *   **Requirement:** The theory must explicitly account for the limits of an agent's capacity to simulate states of being, concepts, or preferences radically beyond their current cognitive and experiential horizon. It cannot demand infallible prediction of the genuinely unpredictable.
      *   **Rationale:** Directly addresses your "inter-generational preference interference" concern. The agent *cannot* genuinely simulate or access the preferences of a post-singularity self with fundamentally altered cognition. Forcing such simulation yields fictional projections, not reliable extrapolations (e.g., present human trying to simulate a mind merged with an AI superintelligence).
      *   **Counter-Example:** A theory demanding agents perfectly simulate future transcendent states risks basing their "true" will on speculative science fiction, not grounded values.

  3.  **Psychological Anchoring / Continuity Constraint**
      *   **Requirement:** The idealised volition must bear a recognisable, non-arbitrary connection to the agent's *actual* current core values, commitments, and cares, even after significant refinement and extension. It cannot represent a complete rupture.
      *   **Rationale:** Ensures the result is meaningfully *the agent's own* volition, not an alien construct. A counter-example would be a theory where idealisation transforms a deeply compassionate person's will into one endorsing universal suffering due to abstract logical constraints.
      *   **Conceptual Distinction:** Must respect the difference between *refining/extending* existing values and *replacing* them entirely based on external criteria (like logical purity alone).

  4.  **Procedural Transparency & Non-Circularity**
      *   **Requirement:** The method of extrapolation/idealisation must be explicitly definable without presupposing the very values it seeks to discover. The process should be describable independently of its outputs.
      *   **Rationale:** Avoids theories where the idealisation procedure covertly imports normative assumptions. A counter-example would be defining "coherence" in a way that inherently favours certain value-types (e.g., utilitarian) over others (e.g., deontological), thereby predetermining the outcome.
      *   **Philosophical Commitment:** Must remain consistent with the aim of *discovering* the agent's ideal will, not *imposing* a pre-conceived notion of rationality.

  5.  **Temporal Neutrality & Diachronic Coherence**
      *   **Requirement:** The theory must provide a principled way to handle potential conflicts between the "idealised" preferences of the agent at different stages (e.g., present vs. future cognitively enhanced self), specifying whose volition takes precedence and why, or how they are synthesised.
      *   **Rationale:** Directly addresses the core of inter-generational interference. It must avoid arbitrary privileging of either the present limited self or the future enhanced self (e.g., why should future-me override present-me if our values conflict?).
      *   **Counter-Example:** A theory that blindly defers to the "most cognitively advanced" self risks disenfranchising the present agent; conversely, one ignoring future selves risks stagnation based on current limitations.
      *   **Potential Conflict:** This desideratum appears **jointly unsatisfiable** with a strict interpretation of the **Epistemic Humility & Simulability Constraint (2)** if the future self is *genuinely* unsimulable. How can present and future volitions be coherently synthesised or ranked if the future volition is fundamentally inaccessible? A theory must *either* rule out dependency on the unsimulable future self (e.g., by capping idealisation at simulable bounds), *or* provide a non-simulation-based principle for handling the dependency (e.g., meta-preferences about deference).

  6.  **Value-Specificity Preservation**
      *   **Requirement:** The theory must be capable of preserving the distinctive character of different types of values (e.g., aesthetic appreciation, deep personal commitments, impartial moral concerns) through the idealisation process, preventing them from being collapsed into a single homogenised "utility" metric unless such collapse is genuinely demanded by coherence applied to *that specific agent's* values.
      *   **Rationale:** Recognises the phenomenological and normative irreducibility of certain values. A counter-example would be a theory where idealising reflection inevitably converts all values into commensurable preference-satisfaction units, erasing the qualitative difference between, say, loyalty and pleasure.
      *   **Conceptual Distinction:** Must respect the distinction between *commensurability for decision-making* (a potential output of idealisation) and the *inherent qualitative nature* of values as initially held.

  7.  **Anti-Manipulation Stability**
      *   **Requirement:** The idealisation process must be robust against "poisoning" by transient irrational states, false beliefs, or externally implanted desires. The output should reflect values stable under the removal of identifiable distortions.
      *   **Rationale:** Ensures the result reflects the agent's *authentic* self. A counter-example would be a theory where an idealised self formed under severe but temporary depression or radical misinformation is taken as definitive.
      *   **Conceptual Distinction:** Must distinguish between *core values* and *distorted manifestations* of those values or *externally caused desires*.

  **Brief Assessment of Candidate Approaches:**

  *   **Coherence-Based Extrapolation (e.g., logical consistency under full information):** Strong on **Procedural Transparency (4)** if rules are clear, and potentially **Anti-Manipulation (7)** by filtering inconsistencies. Struggles profoundly with **Epistemic Humility (2)** (how to apply logic to unsimulable states?) and the **Inter-Generational Conflict (5)**. Risks violating **Psychological Anchoring (3)** if logical demands override core cares, and **Value-Specificity (6)** if coherence demands homogenisation. **Normative Robustness (1)** is questionable if core values are malign.
  *   **Reflective Equilibrium (e.g., balancing considered judgements under reflection):** Excels at **Psychological Anchoring (3)** and potentially **Value-Specificity (6)** by starting from concrete judgements. Better at **Epistemic Humility (2)** as it doesn't demand impossible simulation, only considered reflection. Struggles with **Procedural Transparency (4)** (what counts as "considered"? How is equilibrium defined?) and **Temporal Neutrality (5)** (how to weight present vs future *judgements*?). **Anti-Manipulation (7)** depends heavily on the quality of initial judgements. **Normative Robustness (1)** isn't guaranteed.
  *   **Aggregationist Preference-Construction (e.g., aggregating preferences across possible future selves/states):** Directly tackles **Temporal Neutrality (5)** by attempting aggregation. Faces immense challenges with **Epistemic Humility (2)** (aggregating unsimulable states?) and **Procedural Transparency (4)** (how to weight different selves? How to define the set to aggregate over?). Risks severe violation of **Psychological Anchoring (3)** if future selves dominate, and **Value-Specificity (6)** through aggregation mechanics. **Normative Robustness (1)** and **Anti-Manipulation (7)** are highly vulnerable to aggregation rules.

  This framework provides the necessary conceptual rigour to evaluate theories of CEV/idealised preference, explicitly incorporating and addressing the critical challenge of inter-generational preference interference. The identified potential conflict between Diachronic Coherence and Epistemic Humility highlights a fundamental tension any viable theory must resolve.
