prompt: |-
  I just came from a long argument with a friend about whether term limits, rotation in office, and sortition improve institutions, and I realized that I have firm verdicts about particular offices but no clear principle behind them. I would like you to work out what principle, if any, captures my verdicts.

  Here are my verdicts, roughly in the form they came out in the argument.

  1. I oppose a two-term limit on a directly elected city comptroller. The office is technical and poorly monitored by the public, and a limit mostly transfers power to permanent staff and outside auditors.

  2. I support a two-term limit on a county sheriff. Long-serving sheriffs build personal machines, the office is coercive, and rotation interrupts that dynamic.

  3. I support selecting a citizens' assembly by lot to redraw state legislative districts. The main risk is self-dealing, and ordinary citizens, with expert support, can handle a one-off map.

  4. I oppose selecting a monetary policy board by lot. The role requires technical competence and credibility in financial markets, and sortition would be reckless.

  5. I support keeping a state legislature's budget committee in the hands of long-serving career legislators. Continuity lets them master the details and push back against the executive's numbers.

  6. I support requiring the same legislature's ethics committee to rotate its membership every session. Long service on ethics oversight makes it clubby, while frequent rotation keeps oversight adversarial.

  7. I oppose term limits for neighborhood council chairs, though not strongly. Turnover is already high, and the main cost would be lost local knowledge.

  8. I support a sortition-based climate assembly that recommends policy, but I would oppose giving it binding power: it is valuable as a one-off source of considered public judgment, not as a standing governing body.

  I am most confident in (3), (4), and (6), and least confident in (1) and (7); my friend came closest to moving me on (2).

  My tentative principle was that we should prefer career professionals where the main risk is technical error or lost tacit knowledge, and prefer rotation or sortition where the main risk is capture by a stable network. But that is loose, and my friend showed it can be gamed case by case. He proposed a sharper version: one-off distributions of power lend themselves to sortition, ongoing coercive or oversight roles lend themselves to rotation, and ongoing technical roles lend themselves to career professionals. I could not make that version fit the climate assembly, which is both one-off and technically dense, or the sheriff, which is both coercive and operationally complex.

  What I want is this. Please work out the principle—or a small set of candidate principles—that best captures these eight verdicts, stated precisely enough to apply to a new case. For each clause of the principle, say which of my cases motivates it. Then apply the principle to a case I did not include: an elected school board subject to a three-term limit. Tell me what it predicts. Finally, be honest about which of my verdicts the principle cannot save without ad hoc amendments, and which of those verdicts I should be most willing to reconsider. Since I am trying to find out where my own judgment is fragile, please also tell me what would change your mind: which of my verdicts, if I changed it, would most alter the principle you propose, and where you think your reasoning is most likely to fail. Please write the answer in American English.
reasoning: |-
  Okay, let me try to figure out the user's underlying principle based on their verdicts about term limits and sortition. The user provided eight specific cases with their stance on each. 

  First, I notice a pattern in their reasoning. For technical roles like the comptroller (1) and monetary policy board (4), they oppose rotation or sortition because expertise and continuity are crucial. But for roles with high risk of corruption or self-dealing, like the sheriff (2), ethics committee (6), and redistricting (3), they support rotation or sortition to break up entrenched power. 

  The climate assembly (8) is an interesting middle ground – they support it for recommendations but not binding power, valuing public judgment without requiring sustained expertise. This suggests the user distinguishes between advisory and decision-making roles. The budget committee (5) relies on career legislators for complex details, while the ethics committee needs rotation to avoid becoming "clubby." 

  The tentative principles mentioned by the user and their friend don't fully cover all cases. For example, the sheriff's office is both coercive and operationally complex, yet they support term limits. The key seems to be prioritizing different risks: technical error vs. network capture. 

  For the school board case, applying the principle would involve weighing technical needs (educational policy expertise) against capture risks (entrenchment by unions or interest groups). A three-term limit might be justified to balance institutional memory with preventing capture. 

  The user's least confident verdicts (1 and 7) might need reconsideration. If they changed their view on the sheriff (2), it would challenge the coercion/capture emphasis. The ethics committee (6) is well-supported by the principle, but neighborhood councils (7) might need more nuance based on local context. 

  Overall, the user seems to prioritize institutional design that mitigates the dominant risk per role, whether technical or corruptive. Their approach is pragmatic, case-by-case, but the core principle revolves around risk management and role-specific demands.
answer: |-
  Here's a principle derived from your verdicts, structured to capture your reasoning and applied rigorously:

  **The Institutional Risk Mitigation Principle:**
  > Institutional design should prioritize mitigating the *dominant systemic risk* inherent to an office's function and context. This requires evaluating:
  > **(A) The nature of the office's function:** Technical/Operational (requires expertise, continuity) vs. Distributive/Oversight (involves allocating resources, power, or judging peers).
  > **(B) The primary vulnerability:** Susceptibility to *Technical Error* (complexity, tacit knowledge loss) vs. *Network Capture* (entrenchment, self-dealing, reduced accountability).
  > **(C) The role's temporal dimension:** Standing (ongoing, adaptive) vs. Discrete (one-off, bounded task).
  >
  > **Design Prescriptions:**
  > 1.  **Prioritize Career Professionals:** When the dominant risk is *Technical Error* in a *Standing Technical/Operational* role. (Motivated by: Comptroller (1), Monetary Board (4), Budget Committee (5))
  > 2.  **Prioritize Rotation/Term Limits:** When the dominant risk is *Network Capture* in a *Standing Distributive/Oversight* or *Coercive* role. (Motivated by: Sheriff (2), Ethics Committee (6))
  > 3.  **Prioritize Sortition:** For *Discrete* tasks where the dominant risk is *Network Capture* and the task complexity allows for informed deliberation with support. Binding power requires overwhelming justification. (Motivated by: Redistricting Assembly (3), Climate Assembly (8 - advisory only))
  > 4.  **Default to Minimal Intervention:** When risks are balanced, turnover is naturally high, or intervention risks exacerbating secondary vulnerabilities (e.g., empowering permanent staff). (Motivated by: Neighborhood Council (7), Comptroller (1) - staff risk)

  **Application to an Elected School Board with a Three-Term Limit:**

  1.  **Nature of Function:** Hybrid. **Technical/Operational:** Setting curriculum, overseeing budgets, hiring superintendents (requires educational policy knowledge, financial acumen, institutional memory). **Distributive/Oversight:** Allocating resources between schools/programs, overseeing administration, setting broad policy.
  2.  **Primary Vulnerability:** **Dual Risks:** *Technical Error* (poor educational outcomes, fiscal mismanagement) and *Network Capture* (entrenchment by unions, political groups, or vendors; "board fatigue," reduced responsiveness).
  3.  **Temporal Dimension:** **Standing** (ongoing, adaptive decisions).
  4.  **Dominant Systemic Risk?** Highly context-dependent. In a stable district with good outcomes, *Network Capture* (complacency, insider deals) might dominate, justifying the limit. In a struggling district undergoing reform, *Technical Error* (loss of hard-won expertise, disrupted reforms) might dominate, arguing against the limit. The coercive/distributive nature leans towards capture risk, but the technical demands are significant.
  5.  **Principle's Prediction:** **Ambiguous, Leaning Slightly Against Strict Limit.** The principle doesn't strongly mandate term limits here. The significant technical/operational demands and standing nature align with prioritizing continuity (Prescription 1 & 4). While capture risk exists (Prescription 2), a strict *three-term* limit might prematurely cut off valuable expertise, potentially empowering permanent administrators or short-term political forces (like Prescription 4 warns for Comptroller). Less blunt instruments (strong transparency rules, competitive elections, robust ethics oversight) might better mitigate capture without sacrificing needed continuity. Your support would likely depend on observing *actual* entrenchment problems outweighing stability benefits.

  **Evaluation Against Your Verdicts & Fragility:**

  *   **Fits Well (Core Cases):**
      *   **Monetary Board (4):** Standing, Highly Technical/Operational -> Dominant Risk: Technical Error -> Prescription 1 (Career Pros). *Fits.*
      *   **Budget Committee (5):** Standing, Technical/Operational (Mastery of detail) -> Dominant Risk: Technical Error/Executive Overreach -> Prescription 1 (Career Legislators). *Fits.*
      *   **Ethics Committee (6):** Standing, Distributive/Oversight (Judging peers) -> Dominant Risk: Network Capture ("Clubby") -> Prescription 2 (Rotation). *Fits.*
      *   **Redistricting (3):** Discrete Task -> Dominant Risk: Network Capture (Self-dealing) -> Prescription 3 (Sortition w/ Support). *Fits.*
      *   **Climate Assembly (8):** Discrete Task -> Dominant Risk: Network Capture (Political gridlock/insider bias) -> Prescription 3 (Sortition, Non-binding due to complexity/standing nature risk). *Fits.*

  *   **Fits with Nuance:**
      *   **Sheriff (2):** Standing, Coercive/Distributive -> Dominant Risk: Network Capture (Personal Machine) -> Prescription 2 (Rotation). *Fits, though operational complexity is acknowledged as a counterweight you overruled due to severity of capture risk.*
      *   **Comptroller (1):** Standing, Technical/Operational -> Dominant Risk: Network Capture (Shifted to Staff/Auditors) *outweighing* benefit against Technical Error -> Prescription 4 (Minimal Intervention/Oppose Limit). *Fits your verdict, but your low confidence suggests the staff-risk argument is key.*

  *   **Weakest Fit / Most Fragile Verdicts (Reconsider):**
      *   **Neighborhood Council (7):** Your opposition fits Prescription 4 (Minimal Intervention - high natural turnover). *However, this verdict is fragile.* If turnover were low, the distributive nature (allocating local resources/influence) could shift the dominant risk to Network Capture (local cliques), potentially justifying rotation. Your weak opposition hints you sense this context-dependency. **Most Willing to Reconsider.**
      *   **Sheriff (2):** While captured by Prescription 2, the *strength* of your support despite operational complexity is a tension point. If evidence showed term limits *severely* damaged investigative continuity or jail management in your county, the principle might lean towards modified rotation (e.g., longer terms) rather than strict limits. Your friend's pressure here is understandable.

  *   **What Would Change the Principle?**
      Changing your verdict on the **Sheriff (2)** would most significantly alter the principle. Supporting term limits here is crucial for establishing that in *high-stakes coercive/distributive roles*, Network Capture risk can be so severe it *overrides* significant operational complexity concerns. Changing this verdict would weaken Prescription 2 and make the principle more continuity-focused. Changing **Redistricting (3)** to oppose sortition would gut Prescription 3.

  *   **Where My Reasoning is Most Likely to Fail:**
      1.  **Defining "Dominant Risk":** Judging whether Technical Error or Network Capture is truly dominant (e.g., School Board case) is inherently subjective and context-heavy. The principle relies on this assessment.
      2.  **Hybrid Roles:** Many roles (like School Board, Sheriff, even Comptroller) blend technical and distributive functions. The principle forces a judgment call on the *primary* function/risk, which can be contentious.
      3.  **Prescription 4 (Minimal Intervention):** This is a necessary "catch-all" but risks being a justification for the status quo, potentially underestimating latent capture risks (e.g., in Neighborhood Councils if natural turnover decreases).
      4.  **Ignoring Secondary Effects:** The principle focuses on mitigating the *dominant* risk but might underweight how a solution (e.g., term limits empowering staff) creates *new* risks, as you highlighted in Comptroller (1).

  **Conclusion:** Your core intuition centers on **tailoring institutional design to counteract the most dangerous failure mode** (technical incompetence vs. entrenched corruption/bias) specific to an office's core task and permanence. The proposed principle systematizes this by classifying functions, risks, and temporal scope to generate design priorities. It captures your key judgments but highlights the inherent tension in hybrid roles (like Sheriff, School Board) and the context-dependency of verdicts like Neighborhood Council. Reconsidering the strength of your Sheriff support or the fragility of your Neighborhood Council stance would be most fruitful for refining your thinking.
