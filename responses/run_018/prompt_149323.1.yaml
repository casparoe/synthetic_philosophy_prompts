prompt: |-
  I'm in a phil of mind class and we were arguing about Buddhist anatta and personal identity. I get that Buddhism denies a permanent self, but I'm stuck on the conceptual mechanics of karmic continuity when there's literally no substrate—just momentary aggregates. Specifically, can you explain the tension between the stream view, where mental states form a causal chain that preserves functional identity across time, and the stricter discrete-moment view where continuity is purely conventional?

  And here's the part I'm really stuck on: if anatta is true, then in a case of fission—say, one person's mental stream splits into two rebirth-continuities, like a philosophical split-brain but applied to karma—what determines which subsequent stream owns the prior karma? There's no self to be divided, yet Buddhist ethics seems to require that some specific future cluster inherits the moral weight. Walk me through how the conceptual resources of anatta can address this without secretly smuggling in a substance-self or just saying both do and collapsing the distinction. Don't give me a bibliography or school history—just the conceptual reasoning.

  Please also say how confident you are in this explanation and point out the part you're least sure about. Wrote this quickly betweeen lectures so sorry if there's a typo or weird phrasing.
