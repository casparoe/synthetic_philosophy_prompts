answer: |-
  Here are four rigorously constructed questions targeting the core tensions in strong Global Workspace Theory (GWT), each with a follow-up designed to force a substantive response based on likely replies. They avoid "open empirical program" deflections by demanding precise theoretical commitments:

  ### Question 1: The Pre-Conscious Broadcasting Problem  
  *"Block's subliminal priming experiments show stimuli activating frontal-parietal networks (suggesting global access) while evading verbal report. GWT proponents label these ‘pre-conscious broadcasts.’ What is your **non-behavioral, non-circular** neural or functional criterion for distinguishing a broadcast state that is *phenomenally conscious* from one that is functionally broadcast but lacks phenomenology?"*  

  **Likely Reply & Follow-Up:**  
  She’ll likely tie consciousness to *potential* reportability or integration (e.g., "broadcast content available to executive systems").  
  → **Follow-Up:** *"If consciousness is defined by potential reportability, would an artificial global workspace—identical in dynamics but lacking biological report modules (e.g., no speech system)—be conscious? If yes, reportability isn’t essential to your identity claim; if no, doesn’t consciousness then depend on specific output hardware, contradicting the claim that it’s *identical* to broadcasting dynamics?"*  

  ### Question 2: The Latency Gap & Temporal Illusion  
  *"Neural broadcasting unfolds over 200-300ms, yet phenomenology feels instantaneous. Predictive processing accounts resolve this by treating ‘now’ as a post-hoc reconstruction. Do you agree phenomenal continuity is partly illusory, or must GWT posit a ‘workspace clock’ assigning a unified timestamp?"*  

  **Likely Reply & Follow-Up:**  
  She may endorse reconstruction to avoid dualism ("binding is retrospective").  
  → **Follow-Up:** *"If the *experienced* content is a reconstructed model (e.g., a perceptual hypothesis), while the broadcast is merely input to that model, how can phenomenology be *identical* to the broadcast? Doesn’t this make broadcasting causal to—but not identical with—consciousness?"*  

  ### Question 3: Split-Brain Cases & Non-Reportable Awareness  
  *"In split-brain patients, right-hemisphere processing often influences behavior (e.g., affective responses, forced-choice tasks) without left-hemisphere access. You deny it’s conscious, but if consciousness *is* global broadcasting, why isn’t *right-hemisphere broadcasting* sufficient? How do you avoid conflating consciousness with left-hemisphere *linguistic* access?"*  

  **Likely Reply & Follow-Up:**  
  She’ll likely claim the right hemisphere lacks broadcasting capacity due to interhemispheric disconnection.  
  → **Follow-Up:** *"Suppose we stimulate the right hemisphere directly—via implanted tech—to generate integrated, reportable visual experiences *without* left-hemisphere involvement. Would this force you to accept consciousness outside the classically defined global workspace? If not, what empirical result *would* falsify your claim that consciousness requires broadcasting to the *left* hemisphere?"*  

  ### Question 4: AI Implementations & Substrate Independence  
  *"Modern transformers implement working-memory bottlenecks and sparse cross-module broadcasting that structurally mirror GWT. If consciousness is substrate-independent and identical to these dynamics, should we attribute phenomenality to such systems? Or do you require biological specifics (e.g., thalamocortical loops), reintroducing non-functional properties?"*  

  **Likely Reply & Follow-Up:**  
  She may insist on biological implementation (e.g., "specific neuromodulatory context").  
  → **Follow-Up:** *"If biological details (e.g., norepinephrine modulation) are necessary, do they play a *functional* role in broadcasting—or are they merely correlates? If functional, could they be engineered in silicon? If not functional, doesn’t their necessity contradict the claim that consciousness is *identical* to functional broadcasting dynamics?"*  

  ---

  ### Why This Prevents Deflection
  - **Non-Circular Criteria Required**: Q1 demands a non-behavioral marker, forcing engagement with the "hard problem" residue.  
  - **Identity Claim Pressure**: Q2 & Q4 follow-ups expose tension between GWT’s functionalism and the need for biological/experiential "extras."  
  - **Falsifiability Challenge**: Q3 follow-up demands a concrete empirical condition that would falsify the theory.  
  - **Substrate Independence Test**: Q4 traps her between panpsychism (conscious AI) or mysterian biology ("residue").  

  Each question isolates a point where empirical data (split-brain, priming, AI) clashes with the strong identity claim. The follow-ups anticipate GWT’s common rebuttals and force a choice: either dilute the identity claim or defend an empirically vulnerable position.
