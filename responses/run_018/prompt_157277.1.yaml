prompt: |-
  I am a sixth-form student writing an extended essay on practical decision-making, and I would like to understand how Herbert Simon’s principle of satisficing—accepting the first option that clears an aspiration threshold rather than maximising—can be turned into a reusable, step-by-step procedure for a practitioner who applies it repeatedly under severe time constraints. Please construct such a procedure for a wildlife conservation officer who must approve or reject small-scale land-use applications near a protected wetland within two minutes per case, using only a laminated checklist and no digital aids. The officer must justify each decision to a review panel that occasionally demands further evidence, creating institutional pressure to gather more data and thus drift into maximising behaviour that violates the satisficing logic.

  Your procedure should include: (1) an ordered sequence of tests with explicit, numerically stated aspiration-level thresholds; (2) a “cognitive budget” rule that treats working-memory depletion as a hard constraint, explicitly capping the number of alternatives that may be compared before a decision is locked; (3) worked applications to three cases—one clear approval, one clear rejection, and one in which panel pressure threatens to breach the cognitive budget and push the officer into prohibited maximising; (4) clear flagging of the exact decision nodes where human judgment cannot be eliminated; and (5) an honest account of what the procedure is unable to do, particularly when ecological uncertainty makes the aspiration level itself unstable over time. Ground the design in the actual logic of bounded rationality and in Simon’s concept of aspiration-level adaptation, but inject the niche refinement that the checklist must treat each additional comparison as consuming a fixed unit of the officer’s cognitive budget, forcing termination once the budget is spent regardless of residual doubt.

  Do not provide bibliographies, reading lists, or citations. Please write in British English, and end your response with a standalone final line that gives a one-sentence summary of the procedure’s core limitation.
reasoning: |-
  Okay, let me tackle this complex query about designing a satisficing procedure for a wildlife conservation officer. The user is a sixth-form student writing an extended essay on practical decision-making, specifically wanting to apply Herbert Simon's satisficing principle to real-world time-constrained scenarios. 

  First, I need to recall Simon's core concepts: satisficing means accepting the first option that meets a minimum threshold rather than seeking the absolute best. The challenge here is adapting this to a high-pressure context where an officer must make rapid decisions about land-use near wetlands, using only a physical checklist, while resisting institutional pressure to maximize. 

  The key constraints are severe - two minutes per case, no digital tools, and a laminated checklist. The officer also faces review panels that might demand more evidence, creating tension between satisficing and maximizing. I must design a procedure that explicitly accounts for cognitive budget depletion, treating each comparison as consuming mental resources.

  I consider structuring the procedure around these elements:
  - Sequential tests with numerical thresholds (e.g., distance, runoff volume, species impact)
  - Hard cap on comparisons (cognitive budget of 3 alternatives max)
  - Worked examples showing clear approvals/rejections and edge cases
  - Flagging unavoidable judgment points like impact severity assessment
  - Acknowledging limitations like ecological uncertainty affecting thresholds

  For the checklist itself, I think about including:
  1. Distance to wetland boundary (>50m = auto-approve if other thresholds met)
  2. Runoff control measures (must have at least two specified barriers)
  3. Threatened species impact (no harm to priority habitats)
  4. Developer's mitigation plan (minimum viable commitments)
  5. Cognitive budget counter tracking comparisons

  The cognitive budget rule is crucial - once the officer considers three alternatives or spends two minutes, they must decide immediately, even with residual doubt. This forces satisficing by design.

  For the worked cases:
  - Clear approval: Project exceeds all thresholds comfortably
  - Clear rejection: Violates multiple non-negotiable criteria
  - Borderline case: Shows how panel pressure might tempt maximization but must be resisted by invoking the cognitive budget cap

  I pay special attention to the "institutional drift" risk - the procedure must have explicit brakes when panel pressure mounts. Perhaps a "cognitive budget exhausted" flag in the checklist.

  Limitations to confess honestly:
  - Static thresholds can't adapt to ecological shifts
  - Judgment calls remain in impact assessment
  - False negatives/positives inevitable under uncertainty

  Finally, the summary line must encapsulate the core constraint: that fixed thresholds can't dynamically respond to changing ecosystem conditions.
answer: |-
  Here is a satisficing procedure for the wildlife conservation officer, grounded in Simon’s bounded rationality and aspiration-level adaptation, designed as a reusable step-by-step checklist:

  **Procedure: Wetland Land-Use Satisficing Checklist**  
  *(To be completed within 120 seconds per application)*  

  **Cognitive Budget:**  
  - Maximum **3 alternatives** may be considered per decision (e.g., "approve," "reject," or one compromise).  
  - Each comparison (e.g., weighing trade-offs, seeking extra data) consumes **1 unit**.  
  - **Decision is locked** when budget is spent or time expires, whichever comes first.  

  ---

  **Ordered Sequence of Tests (Aspiration Thresholds):**  
  1. **Wetland Proximity:**  
     - *Threshold:* Is proposed activity **≥50m** from wetland boundary?  
     - *If YES → Proceed to Test 2.*  
     - *If NO → **Reject** (no further tests).*  

  2. **Runoff Control:**  
     - *Threshold:* Does the plan include **≥2 separate physical barriers** (e.g., silt fences, bunds) between activity and wetland?  
     - *If YES → Proceed to Test 3.*  
     - *If NO → **Reject**.*  

  3. **Species Impact:**  
     - *Threshold:* Will activity **avoid Priority Habitat** (per attached map) for any IUCN-listed species?  
     - *If YES → Proceed to Test 4.*  
     - *If NO → **Reject**.*  

  4. **Mitigation Plan:**  
     - *Threshold:* Does the applicant commit to **≥75% native species** in revegetation?  
     - *If YES → **Approve**.*  
     - *If NO → **Flag for Panel Review** (consumes 1 cognitive unit).  

  ---

  **Judgment Nodes (Unavoidable Human Input):**  
  - **Test 3 (Species Impact):** Officer must visually match site plan to habitat map (subjective interpretation).  
  - **Test 4 (Mitigation Plan):** "Commitment" clarity assessed by officer (e.g., vague wording = fail).  

  ---

  **Worked Applications:**  

  **Case 1: Clear Approval**  
  - Test 1: 60m from wetland → **YES** (1s).  
  - Test 2: Silt fence + grass buffer → **YES** (2 barriers, 10s).  
  - Test 3: Avoids water vole zone → **YES** (15s).  
  - Test 4: 80% native plants pledged → **YES** (5s).  
  - **Decision: APPROVE** (total 32s, 0 cognitive units spent).  

  **Case 2: Clear Rejection**  
  - Test 1: 30m from wetland → **NO** (5s).  
  - **Decision: REJECT** (total 5s, 0 units).  

  **Case 3: Panel Pressure Threat**  
  - Tests 1-3: Pass (40s).  
  - Test 4: Applicant offers 60% natives → **NO** (5s).  
  - *Cognitive Budget:* 0 units spent → Officer considers "negotiating 70%."  
  - *Pressure:* Panel precedent suggests demanding higher commitment.  
  - *Procedure:*  
    - Considering compromise = **+1 cognitive unit** (total: 1 unit).  
    - Officer drafts compromise → **+1 unit** (total: 2 units).  
    - Reviews map again → **+1 unit** (total: 3 units → **BUDGET DEPLETED**).  
  - **Decision locked: FLAG FOR PANEL REVIEW** (no negotiation, 110s).  
  - *Justification:* "Cognitive budget exhausted; compromise risks timeout."  

  ---

  **Limitations & Uncertainties:**  
  1. **Static Thresholds:** Aspiration levels (e.g., 50m/75%) are fixed but may become misaligned with ecosystem shifts (e.g., new invasive species).  
  2. **Judgment Vulnerabilities:** Unavoidable subjectivity in habitat matching increases error risk under poor light/fatigue.  
  3. **False Satisficing:** "Clear" approvals may miss cumulative impacts (e.g., 10 small approvals = habitat fragmentation).  
  4. **Data Gaps:** No capacity to incorporate new scientific data (e.g., sudden species decline) without checklist revision.  
  5. **Binary Outcomes:** "Flag for panel" defers but doesn’t resolve time pressure; backlog risks later.  

  This procedure enforces satisficing by collapsing decision pathways into binary thresholds and treating cognitive effort as a non-renewable resource, institutionalising Simon’s "scissors" (where limits of the mind shape the procedure).  

  **Core limitation:** Fixed aspiration thresholds cannot autonomously adapt to ecological flux.
