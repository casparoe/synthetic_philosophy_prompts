  The user's explicit request is to rank these and assign reliability scores. But their deeper need might be to find a practical model that explains the asymmetry between formal authority (merge rights) and social acknowledgment (attribution, status). They might also be looking for strategies to improve contributor retention in their projects.

  Looking at each framework: Kojève's zero-sum struggle might oversimplify by ignoring structural factors. Fanon's structural analysis is strong but might not cover all exclusion types beyond race. The ethics-of-care model seems most aligned with mutual dependency in open-source, where maintainers and contributors rely on each other. The distributed-systems analogy is innovative but risks reducing human factors to technical metrics.

  I should assess which best captures the asymmetry. Ethics-of-care directly addresses the invisibility of care labor, which is central to the user's observation. Fanon's framework explains systemic barriers but might be less universal. Kojève's focus on prestige could miss collaborative aspects. The systems analogy is useful but mechanistic.

  For predictive scores, ethics-of-care gets a high score because one-sided dependency often leads to burnout. Fanon's score is lower as not all contributors face racialized barriers. Kojève's zero-sum might not always apply. The systems model's predictability depends on quantifiable data, which might not capture all reasons for leaving.

  Limitations: Ethics-of-care might overlook power structures. Fanon's specificity could limit applicability. Kojève ignores mutual benefits. The systems model dehumanizes the issue. The user's unspoken need is likely actionable insights, so frameworks offering practical solutions might be more valuable. Ethics-of-care suggests visibility of contributions, which is actionable. The distributed model offers technical solutions but might not address emotional aspects.

  Ranking: Ethics-of-care first for its relevance to burnout and invisibility. Fanon second for structural insights. Systems third for innovative perspective. Kojève last due to zero-sum limitations. Ensuring each explanation ties back to the user's scenario of experienced contributors leaving despite being needed.
answer: |-
  Based on your specific scenario of experienced external contributors feeling invisible and withdrawing despite their essential labor, here's the ranking and analysis of the frameworks, focusing on their ability to explain the **asymmetry between formal authority (merge rights) and social acknowledgment**:

  **Ranking (Most to Least Useful):**

  1.  **(3) Feminist Ethics-of-Care Interpretation**
      *   **Rank:** 1st
      *   **Predictive Reliability:** 9/10
      *   **Explanation:** This framework **best captures the core asymmetry** by directly framing recognition as *mutual visibility of dependency and care labor*. The maintainer's formal authority (merge rights) depends *absolutely* on the contributor's "care labor" (code, reviews, bug reports). When this labor is rendered invisible (lack of attribution, status, acknowledgment), it creates a one-sided dependency where the contributor's essential work is unreciprocated socially, leading directly to burnout and withdrawal. This aligns perfectly with the reported "sense of invisibility."
      *   **Limitation:** May underemphasize the *power* inherent in formal gatekeeping authority (merge rights) and structural barriers unrelated to care dynamics (e.g., pure technical disagreements).

  2.  **(2) Fanon’s Postcolonial Adaptation**
      *   **Rank:** 2nd
      *   **Predictive Reliability:** 7/10
      *   **Explanation:** This powerfully explains the asymmetry by highlighting how **formal authority (merge rights) functions as an institutional gatekeeping norm** that can systematically devalue contributions based on unspoken hierarchies (not just race, but also geography, affiliation, language, or perceived "outsider" status). The lack of social acknowledgment (status, citation) is seen as *structural misrecognition*, not accidental oversight, making withdrawal a consequence of institutional exclusion despite essential labor.
      *   **Limitation:** Its strongest predictive power applies when identifiable structural biases (racial, geographic, institutional) are major factors; it may be less universally predictive for contributors facing invisibility primarily due to interpersonal dynamics or project culture not rooted in systemic exclusion, potentially over-indexing on specific power structures.

  3.  **(4) Distributed-Systems Analogy**
      *   **Rank:** 3rd
      *   **Predictive Reliability:** 6/10
      *   **Explanation:** This usefully **reframes the asymmetry as a protocol failure in reputation-weight allocation**. Formal authority (merge rights) is a high-reputation node. Social acknowledgment (attribution, status, citation) *is* the "reputation-weight" signal. Withdrawal is a rational exit when the protocol (governance model) fails to adequately translate valuable contributions (labor) into reputation-weight (acknowledgment/status), making continued participation inefficient. It decenters psychology effectively.
      *   **Limitation:** Risks being overly mechanistic; it struggles to fully capture the *qualitative* human need for recognition and the emotional impact of "invisibility," potentially misdiagnosing withdrawal as purely rational when affective elements (burnout, frustration) are crucial drivers hinted at in your description.

  4.  **(1) Kojève’s Existentialist Reading**
      *   **Rank:** 4th
      *   **Predictive Reliability:** 4/10
      *   **Explanation:** It addresses the *desire* for recognition but **mischaracterizes the asymmetry as a zero-sum prestige battle**. While contributors may seek status (maintainer role), their reported "sense of invisibility" stems more from *unacknowledged dependency and labor* than a failed bid to *dominate* the maintainer. The framework struggles to explain why essential labor persists *without* the sought-after "Lordship" or why withdrawal happens despite the maintainer's *dependence* on that labor. It reduces complex social dynamics to a singular, antagonistic struggle.
      *   **Limitation:** Its zero-sum, purely antagonistic view of recognition is poorly suited to the collaborative, often mutualistic (though imbalanced) dependencies inherent in open-source. It overlooks the possibility of non-dominating forms of recognition and mutual benefit.

  **Summary Justification:**

  *   **Why Ethics-of-Care Wins:** It directly centers the **asymmetry of visible dependency**. Maintainers *depend* on contributor labor (care) for the project's survival, yet formal authority (merge rights) doesn't guarantee the *social acknowledgment* that makes this dependency visible and reciprocal. The "sense of invisibility" *is* the experience of unreciprocated care labor, leading predictably to burnout ("withdrawal").
  *   **Fanon's Strength:** It exposes how the **gatekeeping function of formal authority (merge rights) can structurally enforce invisibility** through unexamined norms, making social acknowledgment systematically harder for certain contributors to achieve, regardless of labor quality.
  *   **Distributed-Systems Value:** It usefully **models the operational failure** – the governance "protocol" fails to convert labor into reputation (acknowledgment/status), making exit rational. However, it risks missing the human toll.
  *   **Kojève's Weakness:** It fundamentally **misreads the nature of the struggle**. Contributors aren't primarily seeking to *dominate* maintainers (become Lords); they seek acknowledgment *of their essential contribution within a collaborative structure*. The zero-sum lens obscures the mutual, albeit unequal, dependency.

  The most predictive frameworks (Ethics-of-Care, Fanon) focus on the **systemic failure to translate essential labor (creating dependency) into meaningful social acknowledgment**, despite the maintainers' formal authority and reliance on that labor. Kojève's model, focused solely on a battle for dominance, is least aligned with the described phenomenon.
