  The neural correlates approach doesn't satisfy because what's at stake is whether first-person perspective adds explanatory value beyond neural mechanisms. For the user, neural correlates describe the vehicle but not the content of experience. The impasse reflects different intuitions about what needs explaining: behavior vs subjectivity.

