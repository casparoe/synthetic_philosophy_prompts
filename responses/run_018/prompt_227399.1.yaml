prompt: |-
  So I had a long, kind of heated argument with my flatmate last night that ended with him deploying "what if everybody did that?" at me, and I want ammunition for round two.

  The setup: I called in sick to work when I was actualy fine, just completely burned out and needing a day. He says that's wrong, full stop, and his entire case is that slogan. When I said that one person taking one fake sick day harms nobody and the company won't notice, he just repeated it louder, like it settles everything.

  What I want: lay out the different precise principles the slogan could stand for, as a menu I can pick from. Some candidates I'm guessing at: (a) a straight consequences claim -- if everyone did it, things would go badly; (b) a fairness or free-riding claim -- I'm profiting from a practice (sick leave, employers trusting sick calls) that only works because most people don't abuse it; (c) something more Kant-flavored where universalizing my rule somehow destroys the very practice my lie depends on, so I couldn't even coherently will it as a universal policy; (d) maybe just rule-worship dressed up as an argument.

  For each reading: state it precisely enough that it actually has implications (I don't want vague vibes about "society"), say whether it's plausible on its own merits, and say whether it actually delivers his verdict on my sick day. The part I most care about: which readings still condemn me even if we stipulate that almost nobody else will ever fake a sick day, so the bad consequences he imagines never materialize? And which of the readings secretly collapse into each other once you look closely? Also, to check the readings are genuinely different, give me one case (not my sick day) where two of them deliver opposite verdicts.

  Last thing: tell me which reading he probably means, given that he used the slogan to end the argument rather than to start one. No bibliography or anything, just the disambiguation and the verdicts.
reasoning: |-
  Okay, the user had a heated argument with their flatmate about calling in sick when they weren't actually sick but just burned out. The flatmate used the "what if everybody did that?" argument, and now the user wants to dissect that slogan for their next discussion. I need to break down the different interpretations of that slogan and evaluate them.

  First, I recall that "what if everybody did that?" can be interpreted in several ways. The user mentioned four possibilities: consequences, fairness, Kantian universalization, and rule-worship. Let me outline each one clearly.

  Starting with the consequences reading. This is straightforward: if everyone did the same action, it would lead to bad outcomes. For example, if everyone faked sick days, companies would collapse. But the user stipulated that almost nobody else does it, so the actual harm is negligible. In this case, the argument doesn't hold because the bad consequences aren't realistic. So, this doesn't condemn the user's specific action under their condition.

  Next is the fairness or free-rider claim. Here, the issue is benefiting from a system that relies on most people not abusing it. Sick leave policies work because employees are generally honest. By faking a day, the user is free-riding on others' honesty. Even if few people do it, they're still exploiting the system. This seems plausible and condemns the user even if others don't fake sick days. So this one might be what the flatmate is getting at.

  Then there's the Kantian universalization. Kant's idea is about whether you can will your action as a universal law without contradiction. If everyone lied about sick days, trust would erode, making the policy unsustainable. But the user's action depends on the policy existing. If universalized, it self-destructs. Even if not everyone does it, the principle itself is flawed. This condemns the user on principle, regardless of consequences. So it holds under the user's stipulation.

  Lastly, rule-worship. This dismisses the argument as just blindly following rules without reason. But the user wants a principled analysis, so this might not be helpful. The other readings have more substance. Still, it's possible the flatmate is just invoking the slogan without deeper thought.

  Now, the user wants cases where different readings give opposite verdicts. For consequences vs. fairness: imagine someone sneaks into a half-empty movie theater. Consequences-wise, if everyone did it, the theater suffers. But since few actually do, minimal harm. Fairness-wise, they're free-riding on paying customers, so it's wrong even if unnoticed. Consequences say it's okay; fairness says no. That shows a clear split.

  Which reading does the flatmate likely mean? Since he used it to end the argument loudly, it's probably the fairness/free-rider angle. It's intuitive and doesn't require explaining consequences. People often feel that free-riding is unfair even without systemic collapse.

  Also, the user wants to know which readings collapse into each other. Consequences and fairness are distinct, but Kantian might overlap with fairness. However, Kant focuses on logical contradiction, while fairness is about exploitation. They can be separated, as in the movie case where Kant might not apply to sneaking in but fairness does.

  Under the user's stipulation that few people fake sick days, consequences don't condemn, but fairness and Kantian do. Rule-worship is irrelevant. So for round two, the user should be ready to counter the free-rider argument. Maybe argue that burnout is a legitimate reason for a mental health day, aligning with the spirit of sick leave policies. Or challenge the idea that occasional use is exploitative. But the analysis needs to stay neutral as per the user's request.
answer: |-
  Here's a breakdown of the "what if everybody did that?" (WIEDT) slogan applied to your situation, dissected into its core philosophical interpretations. Each is analyzed for precision, plausibility, verdict on your sick day (including under your "almost nobody else does it" stipulation), and how they relate. Opposing-case examples are provided.

  **The Four Readings of WIEDT:**

  1.  **The Straight Consequences Reading (a)**
      *   **Precise Principle:** An action is wrong *if and only if* its universalization (everyone doing it) would lead to catastrophic or significantly harmful consequences. Morality depends entirely on the empirical outcome of mass adoption.
      *   **Plausibility:** Moderate, but incomplete. Captures genuine systemic risks but ignores individual context, intent, and the fact that most actions *aren't* universalized. Often justifies rules-of-thumb but struggles with edge cases.
      *   **Verdict on Your Sick Day:** **Does NOT condemn** under your stipulation. If *almost nobody else* fakes sick days, the catastrophic consequence (company collapse, end of sick leave) **doesn't materialize**. Your single action causes negligible harm. This reading cares only about the *actual predicted outcome*, not hypotheticals divorced from reality.
      *   **Under Stipulation ("almost nobody does it"):** Action permissible. Consequences are fine.

  2.  **The Fairness / Free-Riding Claim (b)**
      *   **Precise Principle:** An action is wrong if it involves benefiting from a cooperative practice or system while violating its norms ("defecting"), *even if* your individual defection causes no measurable harm. You profit from others' restraint/cooperation without contributing your fair share, which is unfair.
      *   **Plausibility:** High. Explains why we condemn queue-jumping, tax evasion, or littering even when impact is tiny. Highlights the reliance of beneficial social practices on widespread adherence.
      *   **Verdict on Your Sick Day:** **Condemns** even under your stipulation. Sick leave is a cooperative practice relying on trust and employees only using it when genuinely ill/unable. You benefit from this trust and the system it enables, but "defect" by using it for unauthorized reasons (burnout). You are a "free rider" on the honesty of others. The harm isn't the consequence of *your* act, but the *unfairness* of exploiting the system others sustain.
      *   **Under Stipulation:** Action impermissible. Free-riding is unfair regardless of scale.

  3.  **The Kantian Contradiction / Self-Defeat Reading (c)**
      *   **Precise Principle:** An action is wrong if you cannot rationally will that the maxim (subjective rule) guiding your action become a universal law without contradiction. Specifically: if universalizing your maxim would logically undermine the very condition that makes your action possible or desirable in the first place.
      *   **Plausibility:** High for principle-based ethics. Forces consistency. Less intuitive than consequences or fairness for everyday arguments.
      *   **Verdict on Your Sick Day:** **Condemns** even under your stipulation. Your maxim: "I can lie about being sick to get a day off when I feel burnt out." If universalized, *everyone* would lie to get days off whenever they felt burnt out. Employers would quickly lose trust in "sick calls" entirely. The reliable sick call system *depends* on it being used truthfully most of the time. Universal lying destroys the trust enabling your lie to work *right now*. You couldn't rationally will this universal law because it makes your own action (relying on trusted sick calls) impossible.
      *   **Under Stipulation:** Action impermissible. The contradiction is in the *logic* of universalizing your maxim, not in the predicted *outcome* if others don't follow.

  4.  **Rule-Worship / Empty Rhetoric (d)**
      *   **Precise Principle:** The slogan is invoked not as a genuine argument, but as a conversation-stopper implying "this rule exists, therefore you must follow it absolutely, without exception, and questioning it is wrong." No deeper justification is offered or required.
      *   **Plausibility:** Low. Offers no independent reason *why* the rule exists or should be followed. Easily rebutted by pointing out legitimate exceptions to most rules.
      *   **Verdict on Your Sick Day:** Condemns, but vacuously. It simply asserts "faking sick is wrong" without providing a reason beyond "because WIEDT!" It doesn't engage with your context (burnout) or the stipulation.
      *   **Under Stipulation:** Condemns, but by assertion, not argument.

  **Collapsing Readings & Opposing Verdicts:**

  *   **Collapse:** (b) Fairness and (c) Kantian often *converge* in verdicts (as here), but they are distinct. (b) focuses on *exploiting others' cooperation* (unfairness), while (c) focuses on *logical inconsistency* in willing your maxim as universal law. (a) Consequences can sometimes *support* (b) or (c) but is fundamentally different as it relies solely on predicted outcomes. (d) isn't a real argument.
  *   **Opposing Verdicts Case (Consequences vs. Fairness/Kantian):**
      *   **Action:** Sneaking into the back of a half-empty, paid-entry music festival without a ticket. No one sees you, no seat is taken from a paying customer, no revenue is lost *because* almost no one does this.
      *   **Consequences Reading (a):** Permissible. Universalizing *would* be catastrophic (festival bankrupt), but under the stipulation that almost no one does it, the actual harm is negligible or zero. Your action causes no problem.
      *   **Fairness Reading (b):** Impermissible. You are free-riding on the system sustained by paying customers. You benefit from the festival's existence without paying your share, which is unfair exploitation.
      *   **Kantian Reading (c):** Impermissible. Your maxim "I can sneak in without paying if I won't get caught and the event isn't full" cannot be universalized. If *everyone* did this, paid entry and thus the festival itself would collapse, making your sneaking-in impossible. You rely on the paid system existing while violating its core rule.

  **What Your Flatmate Probably Means:**

  Given that he used WIEDT **to end the argument** ("like it settles everything") and **repeated it louder** when challenged, he is most likely invoking the **Fairness/Free-Riding Claim (b)**. This is the most common and intuitively powerful interpretation in everyday moral disputes. It feels immediately persuasive ("you're cheating the system everyone else follows!"), doesn't require complex Kantian logic, and dismisses consequences-based counterarguments by focusing on principle and exploitation. It resonates with the feeling that your action is "taking advantage" regardless of scale. The "louder" repetition suggests he sees it as a knockdown argument against "defection," which aligns perfectly with the free-rider critique.

  **Your Ammunition for Round Two:**

  *   **Challenge the Reading:** Ask him *which* version of WIEDT he means. Force him to articulate *why* it's wrong beyond the hypothetical.
  *   **Counter Fairness (b):** Argue that occasional use of sick leave for *severe burnout* (framing it as a genuine mental health need, not just laziness) isn't necessarily "free-riding" but a legitimate, if unspoken, use of a safety net *within* the spirit of the system, especially if you're otherwise reliable. Question the rigidity of the "only for physical illness" rule. Ask if *any* rule-breaking for personal need is *always* unfair free-riding.
  *   **Counter Kant (c):** Argue that the maxim isn't "lie whenever burnt out" but "use available leave responsibly for necessary recovery when overwhelmed, even if not physically ill." This *might* be universalizable without destroying sick leave, especially if linked to mental health. Or argue that the contradiction isn't absolute in a world with imperfect adherence.
  *   **Highlight the Stipulation:** Emphasize that **under the *actual* reality** where almost *nobody* fakes sick days regularly, the **Consequences Argument (a) fails completely**. The "what if" is irrelevant to the actual harm of *your* action.
  *   **Dismiss Rule-Worship (d):** Point out that invoking WIEDT without justification is just shouting dogma, not making an argument. Rules can have exceptions based on context and need.
  *   **Reframe Burnout:** Strongly argue that severe burnout *is* a legitimate health reason for needing a day off, blurring the line between "fake" and "real" sick day and weakening the "lie" or "free-riding" claims. This is your strongest ethical ground.
