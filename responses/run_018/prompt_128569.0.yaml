answer: |-
  Here’s a logical taxonomy addressing your workshop goals. Nodes are phrased as testable claims, avoiding tribal labels. Each branch forces choices about conceptual coherence, dimensionality, and normative authority sources.

  ### Root Question: Does the left-right distinction retain meaning *after* separating moral content (equality/hierarchy, liberty/authority) from coalitional dynamics?
  *   **Branch 1 (Yes):** "Observed left/right coalitions reliably cluster around distinct, stable bundles of moral-psychological commitments, even when controlling for strategic incentives."
  *   **Branch 2 (No):** "Left/right coalitions are primarily strategic alliances; their moral content is fluid, context-dependent, and often contradictory across issues."

  ---

  ### Branch 1: Yes (Meaningful Distinction Survives Separation)
  *   **Split A: Does holding each 'side' together require a continuous underlying dimension?**
      *   **A1 (Yes, Continuous):** "The core commitments of each side (e.g., preference for equality vs. hierarchy) can be mapped onto a single, ordered spectrum where positions differ by degree, not kind." → **Leaf 1: Classical Spatial Model (e.g., Downsian).** *Awkward Commitment:* Must treat deviations (e.g., "libertarian left" or "authoritarian equality") as incoherent or marginal outliers, ignoring their empirical persistence.
      *   **A2 (No, Discontinuous):** "Each side coheres around a distinct *cluster* of related but non-scalar principles (e.g., equality *and* solidarity vs. liberty *and* order), forming discontinuous 'ideal types'." → **Leaf 2: Clustered-Ideal Typology.** *Awkward Commitment:* Struggles to explain why individuals or groups consistently align with *one* cluster across diverse issues if the principles aren't inherently linked by a dimension.

  *   **Split B: Must both sides agree on the primary locus of normative authority?**
      *   **B1 (Yes, Agree on Locus):** "Both sides fundamentally agree on *which institutions* (e.g., State, Market, Tradition) are the legitimate sources/arbiters of normative authority; they disagree only on *how* those institutions should function or be balanced." → **Leaf 3: Shared Institutional Framework Model.** *Awkward Commitment:* Must explain away ideological movements seeking to abolish or radically replace core institutions (e.g., anarchism, revolutionary socialism, certain traditionalisms) as fundamentally "anti-system" rather than variants of left/right.
      *   **B2 (No, Defined Negatively):** "The sides are defined *relationally*; 'Left' seeks to challenge/transform dominant institutions of authority perceived as hierarchical, while 'Right' seeks to defend/preserve them against such challenges." → **Leaf 4: Relational Antagonism Model.** *Awkward Commitment:* Risks making the labels purely reactive and historically contingent, losing transhistorical analytical power; struggles to define "Left" and "Right" in a stable institutional vacuum.

  ---

  ### Branch 2: No (Distinction Collapses Without Coalitions)
  *   **Split C: Is the axis best reconstructed as competing answers to the distribution of normative authority?**
      *   **C1 (Yes, Authority Distribution):** "The fundamental cleavage concerns the *distribution* of normative authority: Should it be concentrated in specific institutions (State, Market, Tradition) or dispersed among individuals/communities?"
          *   **C1a (Institutional Concentration):** "Legitimate normative authority derives primarily from formal, established institutions (State law, Market efficiency, Traditional canon)." → **Leaf 5: Institutionalist Node.** *Awkward Commitment:* Must justify why powerful institutions *don't* inevitably become oppressive or capture authority illegitimately, often relying on contested notions of institutional "purity" or self-correction.
          *   **C1b (Dispersed Authority):** "Legitimate normative authority arises from decentralized sources: individual consent, community practice, situated knowledge, or emergent processes." → **Leaf 6: Dispersionist Node.** *Awkward Commitment:* Struggles to provide clear mechanisms for resolving large-scale collective action problems or establishing binding norms without replicating concentrated authority.
          *   ***Diagnosis:*** This reframing makes "Left" and "Right" largely **redundant** as primary categories. Traditional "Left" positions often align with Dispersion (e.g., direct democracy, worker control) *or* State Concentration (e.g., state socialism). Traditional "Right" aligns with Market/Tradition Concentration *or* individualist Dispersion (libertarianism). The old labels become unstable coalitions *within* these new categories. *Conceptual Clarification:* Reveals hidden tensions *within* traditional "sides" (e.g., state-socialist vs. anarchist left; traditionalist vs. libertarian right).
      *   **C2 (No, Purely Coalitional):** "There is no deeper conceptual structure; 'Left' and 'Right' are labels for historically contingent, evolving coalitions united only by opposition to the other side and shared tactical interests." → **Leaf 7: Thin Coalitionalism.** *Awkward Commitment:* Cannot explain the remarkable cross-cultural and historical *resonance* and *predictive power* of the left/right schema for basic socio-economic attitudes, despite fluid coalitions.

  ---

  ### Flagged Overlaps & Unoccupied Leaves
  1.  **Overlap:** **Leaf 4 (Relational Antagonism)** and **Leaf 7 (Thin Coalitionalism)** both emphasize oppositional dynamics. *Distinction:* Leaf 4 posits a *substantive* core (challenge/defend hierarchy), while Leaf 7 denies any stable core beyond the coalition itself.
  2.  **Overlap:** **Leaf 6 (Dispersed Authority)** captures elements of both radical left (anarchism, council communism) and radical right (individualist anarchism, some libertarianism). *Flag:* This reveals the instability of old labels under the authority-distribution lens.
  3.  **Unoccupied Leaf:** **Branch 1 (Meaningful Distinction) + B1 (Agree on Locus) + A2 (Discontinuous).** *Diagnosis:* **Unexplored/Unattractive?** If sides agree on the *locus* of authority (e.g., both accept the State as primary arbiter) but are defined by discontinuous clusters, it's unclear what fundamentally *separates* them beyond policy preferences. This gap might reflect the intuitive pull of either continuity (A1) or relational definition (B2) when affirming a meaningful distinction.
  4.  **Unoccupied Leaf:** **Branch 2 (Collapses) + C1 (Authority Dist.) + Position accepting *both* concentration *and* dispersion equally as authoritative sources.** *Diagnosis:* **Likely Incoherent.** Normative authority requires a mechanism to resolve conflicts between sources. A position asserting equal ultimate authority to (e.g.) the State *and* individual conscience lacks a meta-principle for adjudication, leading to paralysis or arbitrary decision.

  ---

  ### Reflective Note: What Would Change My Mind
  This tree prioritizes conceptual coherence and normative sources over coalitional history. I would merge branches or abandon leaves based on:
  1.  **Empirical:** Evidence that stable, large-scale political coalitions *routinely and successfully form* around positions combining strong institutional concentration (e.g., theocratic state) *with* radical egalitarianism, or radical dispersion *with* rigid social hierarchy – positions awkward for the Authority Distribution frame **(Leaf 5/6)** and challenging the Clustered-Ideal model **(Leaf 2)**.
  2.  **Conceptual:** A compelling demonstration that "normative authority" itself is an incoherent or unnecessary concept for explaining political conflict, undermining the foundational split in **Branch C1**. Alternatively, showing that "continuity" vs. "discontinuity" **(Split A)** is a false dichotomy resolved by a superior conceptual framework.
  3.  **Behavioral:** If "left" and "right" identifiers consistently predicted specific policy preferences *even among individuals unaware of coalitional dynamics or lacking strong ideological commitment*, it would strengthen **Branch 1** and challenge **Branch 2/Leaf 7**.

  This taxonomy forces examination of foundational commitments, revealing tensions within traditional labels and offering tools to move beyond tribal semantics. Its value lies in provoking meta-reflection on *why* we categorize politics as we do.
