  hey so ive been thinking about when people do good stuff but for totally different reasons, like is it actually better to help someone just because you think its your duty versus actually caring? build me a thought experiment with these specs: realistic hospital or workplace scene, one paragraph, where nurse A saves a patient purely from duty with zero personal feeling, and nurse B saves the same patient but mainly because they recognize a specific structural failure they themselves survived years ago—so B's reason is partly self-referential and not purely 'for the other person.' engineer it so kant says A has full moral worth and B has little to none, virtue ethics flips that and ranks B higher since B's reason is more responsive to reality, and consequentialism says the outcomes match but B's reasoning makes them more reliable over time. then walk me through what each view actually says and why, point out the feature doing the work—probably that biographical structural recognition part—and explain what happens if you remove it. also tell me how a kant defender would attack B's reason, maybe saying it fails universalizability or whatever. keep it casual, no citations or book lists, im just some random person thinking about this on my own.
