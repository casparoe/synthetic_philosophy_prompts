answer: |-
  Here is a villanelle crafted to embody Hofstadter's typogenetics analogy, weaving specific mechanistic details of DNA replication and Gödelian self-reference into the fixed form, with refrains shifting register and the volta performing the transition:

  **Autocatalytic Sonnet**

  Adenine seeks its thymine counterpart,  
  Polymerase spins the fork's dividing stream,  
  **This chain links only to its mirrored frame.**

  RNA reads the gene and makes its start,  
  tRNA brings amino acids to the theme,  
  **The loom that weaves this pattern bears its name.**

  Peptide bonds form where ribosomes impart  
  The template's code into a protein's scheme,  
  **This chain links only to its mirrored frame.**

  Now symbols map to primes, a Gödel art,  
  Assigning numbers to each rule and dream,  
  **The loom that weaves this pattern bears its name.**

  The proof predicate, playing its own part,  
  Encodes "this string cannot be proven true" -  
  **This chain links only to its mirrored frame.**

  The statement stares back, tearing logic apart,  
  An undecidable the system cannot subdue,  
  **The loom that weaves this pattern bears its name.**

  Now watch the codon shift to numbered claim,  
  As polymerase becomes a proof's own game:  
  **This chain links only to its mirrored frame,**  
  **The loom that weaves this pattern bears its name.**

  ---

  **Mechanism & Analogy Breakdown:**

  1.  **Refrains Shifting Register:**
      *   *"This chain links only to its mirrored frame":*
          *   **Molecular:** DNA strand pairing specifically with its complementary strand via base-pairing rules (A-T, G-C).
          *   **Metamathematical:** A Gödel-numbered sequence/formula specifically referencing its own negation or incompleteness (its logical "mirror" within the system).
      *   *"The loom that weaves this pattern bears its name":*
          *   **Metamathematical:** The formal system (the "loom") constructing proofs ("weaves this pattern") that can contain representations (names) of its own axioms/rules.
          *   **Molecular:** The ribosome (the "loom") translating mRNA codons ("pattern") into a polypeptide chain, where the ribosome itself is a product of the genetic code it interprets ("bears its name").

  2.  **Molecular Details (First Half):**
      *   "Adenine seeks its thymine counterpart": Specific base-pairing initiation.
      *   "Polymerase spins the fork's dividing stream": DNA polymerase at the replication fork.
      *   "RNA reads the gene and makes its start": Transcription initiation.
      *   "tRNA brings amino acids to the theme": Transfer RNA delivering substrates.
      *   "Peptide bonds form where ribosomes impart / The template's code": Ribosome catalyzing peptide bond formation using mRNA code.

  3.  **Metamathematical Details (Second Half):**
      *   "Symbols map to primes, a Gödel art": Gödel numbering using prime factorization.
      *   "Assigning numbers to each rule and dream": Numbering symbols, formulas (rules), and propositions (dreams).
      *   "The proof predicate, playing its own part": The formalized proof relation `Proof(x, y)` meaning `x` proves `y`.
      *   "Encodes 'this string cannot be proven true'": Constructing the Gödel sentence G, essentially stating its own unprovability.
      *   "An undecidable the system cannot subdue": G is undecidable within the consistent system.

  4.  **The Volta (Final Quatrain):**
      *   "Now watch the codon shift to numbered claim": Explicitly signals the transition from biological triplet code (codon) to logical encoding (numbered claim).
      *   "As polymerase becomes a proof's own game": Equates the biological replicator (polymerase) with the logical mechanism for generating proofs ("proof's own game").
      *   The final two lines restate the refrains, now fully charged with both interpretations simultaneously due to the preceding transition, embodying the isomorphism.

  5.  **Unresolved Tension:**
      *   The poem *performs* the self-reference/self-replication it describes through the villanelle's formal repetition and the refrains' shifting meaning.
      *   It ends with the system ("loom") inherently constrained by its own structure ("bears its name") as it tries to grasp its replication ("chain links... mirrored frame"). It doesn't declare life miraculous or logic futile; it presents the inherent, recursive limitation as the core similarity.

  This villanelle uses the strict repetition of the form to enact the self-referential loop Hofstadter describes, grounding the analogy in concrete biological machinery and precise logical concepts, leaving the paradoxical tension of self-describing systems resonating in the final, doubled refrain.
