prompt: |-
  ok so im building this tutoring app for my neice (shes 10 and struggles with math but is really good at reading people) and the devs keep calling the backend "intelligent" just because it adjusts difficulty based on wrong answers. that got me thinking about what intelligence actually is, and now im stuck on my own gut verdicts about different cases.

  heres where i land, more or less: the chess engine that sees 40 moves ahead but cant understand a joke? intelligent in one narrow way, but not really what i mean. the crow that bends a wire after watching another crow? yeah, thats intelligence, even though its just copying. my neice herself — shes got low scores on standard tests but can tell exactly when her mom is upset without anyone saying — id call her intelligent in a way the chess engine isnt. the slime mold that finds the shortest path through a maze? clever, maybe, but i dont think its intelligence; its just chemistry doing work. the big language model that writes a decent essay about ethics but forgets everything the second you close the chat? i feel like thats fake intelligence, like a mirror that reflects shape without seeing. but heres the one im going back and forth on: imagine a system with no internal model at all, it just constantly rewrites its own weights in response to error signals, adapting in real time but never "representing" anything. is that intelligence, or just a very fancy reflex?

  i want you to act like a professional philosopher and cognitive scientist, think carefully, and start with some brainstorming. then tell me: is there one principle that captures all these verdicts, or close? if there isnt, which verdict should i drop? and please reach an actual conclusion — dont just say "its complicated." also say what your principle predicts for that self-rewriting system i mentioned, and for one more case: a human savant who can do massive calculations instantly but has no social awareness at all.
