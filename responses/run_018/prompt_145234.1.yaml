  For the model answer, I'll structure it as requested: descriptive section first (explaining frameworks neutrally), then diagnostic application. The key is showing where each theorist would draw the line - is it the moment of commitment? The persistence of ignorance? The actual conflict in outcomes?

  The marking scheme must punish mere summary. I'll focus on five critical moves:
  1. Recognizing why standard taxonomies fail here
  2. Pinpointing each theorist's breaking point 
