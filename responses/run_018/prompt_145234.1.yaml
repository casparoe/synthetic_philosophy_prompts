  User seems highly knowledgeable - they used terms like "plural subjecthood" correctly. This isn't their first exam design rodeo. I'll match their precision by specifying exact failure points: e.g., "Bratman fails at condition X when sub-plan conflict persists" not just "Bratman might disagree".
answer: |-
  ### Exam Question  
  **Urban Resilience Case:** Two city planners, Alex and Blake, publicly commit to jointly design a "resilient neighborhood." Alex privately equates resilience with ecological sustainability (e.g., flood barriers, green spaces), while Blake understands it as economic robustness (e.g., commercial zoning, business incentives). They delegate all technical specifications to a shared contracting team, communicating only high-level approval. Neither becomes aware of this definitional divergence, and the contractors—operating under ambiguous instructions—implement conflicting features.  

  **Prompt:** Does this scenario constitute genuine joint action? Critically analyze the case through Bratman’s mutual responsiveness and commitment to shared cooperative activity, Gilbert’s joint commitment and plural subjecthood, and Searle’s we-intentions versus I-intentions. Identify the *exact conceptual threshold* at which hidden divergence either collapses or preserves jointness under each framework. Your answer must move beyond describing theories to diagnosing failure/survival conditions.  

  ---

  ### Model Answer (690 words)  

  #### Descriptive Section (Framework Summary)  
  Bratman’s theory requires agents to (1) commit to mutual support of a shared goal, (2) coordinate plans interdependently, and (3) exhibit mutual responsiveness in action adjustment. Joint action dissolves if sub-plans conflict irreparably. Gilbert posits that joint commitment creates a "plural subject": a pool of obligations binding individuals to a collective goal. Unlike Bratman, this commitment need not involve shared beliefs about implementation, provided parties openly avow the joint endeavor. Searle distinguishes "we-intentions" (individuals acting *as* a collective "we") from "I-intentions" that reference others. True jointness requires we-intentions to structure behavior, not merely parallel individual goals.  

  #### Diagnostic Section (Case Application)  
  **Bratman:** Joint action *initially exists but collapses during execution*. The planners satisfy surface conditions: they commit to "resilience" and delegate via interdependent sub-plans (e.g., both rely on contractors). Mutual responsiveness *appears* present through approvals. However, Bratman’s condition that sub-plans "mesh" fails at the point where conflicting definitions generate *irreconcilable technical outputs* (e.g., flood plains vs. commercial lots). Since neither adjusts their hidden definition or detects incompatibility, mutual responsiveness is illusory. **Threshold collapse:** When sub-plan divergence persists *unknowingly*, coordination becomes luck-dependent, voiding shared cooperative activity.  

  **Gilbert:** Joint action *survives*. Gilbert’s minimal condition is public agreement to "pursue X as a body." Alex and Blake openly commit to designing resilience, creating a plural subject with obligations (e.g., to not unilaterally abandon the project). Crucially, Gilbert does not require shared mental states about *how* X is conceived. Opacity is irrelevant provided both avow the joint goal. **Threshold upheld:** Divergent private definitions do not breach joint commitment unless one party *disavows* the collective goal. Delegation and approvals reinforce their ongoing pledge to act as a "we."  

  **Searle:** Joint action *never materializes*. We-intentions require each agent to intend their role *as part of "us" achieving a shared goal*. Here, both hold I-intentions containing representations of the other ("I will help Blake/Alex achieve resilience"), but they lack identical we-intentions because "resilience" carries incommensurable meanings. Searle’s criterion of "collective goal satisfaction" fails: Alex cannot intend the *collective’s success* in economic resilience, nor Blake in ecological resilience. **Threshold collapse:** At the moment of commitment, if the object of "we-intend" is not intersubjectively identical (even if unspoken), the structure defaults to individual intentions.  

  **Synthetic Judgment:** Jointness is framework-dependent. Bratman and Searle deem it failed due to *hidden goal fragmentation*, while Gilbert preserves it via *public commitment formalism*. Crucially, Bratman/Searle require semantic alignment in the goal’s constitutive elements; Gilbert requires only referential agreement ("resilience" as the target). The planners’ case thus reveals a core theoretical fissure: whether jointness dies in the mind (Bratman/Searle) or thrives through performative commitment (Gilbert).  

  ---

  ### Marking Scheme (20 marks total)  
  Candidates must hit **five analytical moves**. Marks deducted for descriptive summary without case-driven thresholds.  

  1. **Identify Bratman’s breaking point: Irreparable sub-plan conflict** (4 marks)  
     - Judgment: Collapse occurs when hidden divergence prevents meshing sub-plans *despite surface coordination*.  
     - Common error: Vaguely citing "lack of responsiveness" without naming *persistent opacity* as the killer.  

  2. **Defend Gilbert’s survival condition: Public avowal overrides private beliefs** (4 marks)  
     - Judgment: Joint commitment holds if parties uphold the *label* of the goal (e.g., "resilience") as a collective object.  
     - Common error: Conflating Bratman/Gilbert by requiring semantic alignment for plural subjects.  

  3. **Isolate Searle’s failure: Absence of identical we-intention content** (4 marks)  
     - Judgment: We-intentions shatter if agents attribute *different constitutive properties* to the shared goal.  
     - Common error: Claiming Searle permits divergent interpretations if intentions are "collective-formatted."  

  4. **Contrast Bratman/Searle vs. Gilbert on semantic alignment** (4 marks)  
     - Judgment: Bratman/Searle demand *goal-concept unity*; Gilbert requires only *goal-reference unity*.  
     - Common error: Treating all theories as equally sensitive to mental-state divergence.  

  5. **Articulate the core theoretical fissure** (4 marks)  
     - Judgment: The case exposes whether jointness is a *mental-state alignment* (Bratman/Searle) or *commitment ritual* (Gilbert).  
     - Common error: Concluding generically that "theories disagree" without specifying the fault line.  

  **Grade bands:**  
  - **16–20 (Excellent):** Hits all 5 moves; clearly separates survival/failure thresholds per theorist; synthesizes fissure.  
  - **14–15 (Strong):** Hits moves 1–4 but omits #5 (fissure); strong thresholds but weak synthesis.  
  - **10–13 (Competent):** Describes frameworks accurately but applies generically (e.g., "Bratman fails because goals differ"); thresholds implied but not pinpointed; omits moves 4–5.  
  - **<10 (Weak):** Summarizes theories without case application; conflates frameworks; ignores opacity.  

  ---  
  **Rationale:** This design forces engagement with *how* each theory defines jointness’s "point of fragility." The marking scheme rewards diagnosing conceptual rupture points over recitation, with explicit penalties for missing synthetic analysis.
