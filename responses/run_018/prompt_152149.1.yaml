answer: |-
  ### Diagnosis
  The core conflict isn't primarily about empirical data but about **competing definitions of consciousness** applied to the same behavioral phenomena. Proponents of "one consciousness" emphasize *functional integration*: despite severed corpus callosum, patients act as a unified agent. Cross-cuing (e.g., left hand correcting right-hand errors via external cues) and coordinated behavioral unity (e.g., dressing without conflict) suggest an intact, singular executive system. They dismiss confabulation by the left hemisphere as a peripheral glitch in verbal reporting, not evidence of divided consciousness.

  The "two consciousnesses" camp prioritizes *narrative and epistemic unity*. The left hemisphere's confabulation (inventing explanations for right-hemisphere actions) and the right hemisphere's inability to verbally report its perceptions reveal a fractured subjective experience. The left's "interpreter" mechanism isn't integrating truth but constructing a post-hoc fiction, proving neither hemisphere has full access to the other's content. For them, behavioral unity is mere cohabitation, not integration.

  Your concept of "representational custody" hits the nerve: **Who "owns" or can report a mental state?** The left hemisphere’s dominance in verbal report creates an asymmetry—it controls the narrative, masking the right hemisphere's independent capacities (e.g., identifying objects it can't name). Both camps overlook this epistemic hierarchy. Functionalists ignore the *loss of first-person access* between hemispheres; unity-by-narrative proponents conflate the left hemisphere’s storytelling with global consciousness. The stall arises because neither framework fully accounts for custody, leading to talking past each other.

  ### The Hidden Machinery
  Beneath the verbal dispute lies a **methodological blind spot**: we lack tools to probe *subjective experience without reportability*. Current empirical tests rely on behavioral output (button presses, verbal responses), which inherently privileges the left hemisphere’s speech capacity. The right hemisphere’s internal states remain inferential. Crucially, residual subcortical connections or rapid cross-cuing might facilitate covert integration unmeasurable by existing paradigms, but this is untested. 

  The formal disagreement is whether consciousness requires **global broadcast** (where integration = unity) or permits **modular encapsulation** (where isolated access = multiple centers). If global broadcast is necessary, split-brain patients have one degraded consciousness; if modular encapsulation is possible, they may have two. No experiment has cleanly isolated these models because behavioral data can be interpreted either way.

  ### Could It End?
  Progress requires two shifts:
  1.  **Empirical:** Technology that decodes non-verbal subjective states (e.g., high-resolution neural markers of awareness in the mute right hemisphere) or disrupts covert cross-cuing (e.g., targeted neural inhibition). Demonstrating isolated qualia in the right hemisphere without left-hemisphere contamination would force a reckoning.
  2.  **Conceptual:** Decoupling "unity" from behavioral coherence and reportability. Explicitly distinguishing:
      -   *Functional unity* (goal-directed behavior)
      -   *Narrative unity* (self-coherent story)
      -   *Epistemic unity/custody* (direct access to all mental content)
      Framing the debate around which of these (if any) is constitutive of "a consciousness" could dissolve false oppositions.

  ### Bottom Line
  The stalemate persists due to inadequate tools to probe non-reportable experience and unexamined definitions. Without a revolution in measuring subjective states or a formal framework separating integration, narrative, and custody, expect circles. Your custody concept is the key—but it needs teeth.
