  The syntax lives in the head, not in speech.  

  Asymmetric dependence guards the base:  
  That error *depends* on truth, a causal chain begun –  
  **The symbol needs a speaker to be born.**  

  Does public language set the thinking pace,  
  Or do new structures start to form, unsung?  
  The symbol needs a speaker to be born,  
  Yet burns within the head where thoughts are torn –  
  The syntax lives in head, not speech, unsworn  
  **Until the symbol needs a speaker to be born,  
  The syntax lives in the head, not in speech.**

