  **Mentalese at the Crossroads**

  The syntax lives in the head, not in speech,  
  Where complex nests unfold, a silent hum –  
  Mentalese builds worlds beyond our reach.  

  Productivity: thoughts no bounds can breach,  
  From simple parts new meanings rise and come –  
  The syntax lives in the head, not in speech.  

  But connectionists a different lesson teach:  
  Soft assemblies, patterns overcome –  
  **The symbol needs a speaker to be born.**  

