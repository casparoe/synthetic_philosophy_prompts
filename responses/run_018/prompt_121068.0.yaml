answer: |-
  ## Joint Statement on Naturalizing Mental Content: Teleosemantics & Synthetic Functionalism

  **Preamble:**  
  We, a committed teleosemanticist (TS) and a synthetic-functionalist (SF), having engaged in good-faith adversarial collaboration, affirm significant common ground on the core project of naturalizing mental content (meaning, representation). We also acknowledge precise points of disagreement concerning the necessary and sufficient conditions for grounding content, particularly regarding the role of history and the nature of misrepresentation in artificial systems. This document outlines our areas of agreement, formulates our key disagreements in mutually acceptable terms, identifies the cruxes, and specifies test cases with divergent predictions.

  **Section 1: Agreed Claims on Naturalizing Mental Content**

  1.  **Naturalization Imperative:** Mental content must be fully explicable within a naturalistic framework, eschewing irreducibly mental properties, intrinsic intentionality, or supernatural explanations. Content supervenes on physical properties and processes.
  2.  **Function is Foundational:** Attributing mental content fundamentally depends on attributing a *function* or *purpose* to the state or mechanism bearing that content. Content is not a primitive property but arises from the functional role of a state within a system.
  3.  **Content Entails Normativity:** Possessing genuine content implies the possibility of *correctness* and *incorrectness* (e.g., truth/falsity, satisfaction/dissatisfaction). A theory must account for misrepresentation (e.g., false beliefs, inaccurate perceptions).
  4.  **Causal Correlation is Insufficient:** Mere reliable causal covariation between an internal state (e.g., a neural firing pattern) and an external state of affairs (e.g., the presence of a predator) is necessary but *not sufficient* for grounding genuine content. Such covariation lacks the normative dimension required for misrepresentation.
  5.  **System-Level Perspective:** Content is ascribed within the context of a larger, organized, goal-directed system. Isolated states or simple causal chains cannot bear content independently of their role in the system's overall economy.
  6.  **Success Depends on Function:** The conditions under which a content-bearing state contributes to the *success* of the system (e.g., survival, reproduction, goal achievement) are central to determining what its content *is*. Misrepresentation occurs when the state fails to fulfill its function due to inaccuracy.
  7.  **Applicability to Artificial Systems:** Principles of naturalizing content should, in principle, be applicable to sufficiently sophisticated artificial systems exhibiting complex, adaptive, goal-directed behavior, not just biological organisms.

  **Section 2: Disagreements, Cruxes, and Test Cases**

  | Disagreement Area | Teleosemanticist (TS) Position (SF accepts wording)                                                                                               | Synthetic-Functionalist (SF) Position (TS accepts wording)                                                                                                                                                     | Crux                                                                                                     | Concrete Case / Argument                                                                                                                 | TS Prediction                                                                                                                                 | SF Prediction                                                                                                                                                        |
  | :---------------- | :------------------------------------------------------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Historical Necessity** | **TS Stance:** The proper function of a mechanism, and hence the determinate content of its states, is fixed solely by its evolutionary history (or intentional design history in artifacts) through a process of selection *for* that function. Current causal dispositions or systemic roles, absent this history, are insufficient to ground determinate content. | **SF Stance:** While evolutionary history is one possible source of function and content, the current, stable, counterfactual-supporting functional dynamics of a system – specifically, the optimization landscape defined by its goals, learning rules (e.g., gradient descent), and predictive processing architecture – are sufficient to ground determinate content independently of specific historical origins. | **Is a specific selection history (evolutionary or design-based) *strictly necessary* to ground determinate mental content?** | **The Alien Artifact:** An advanced, complex artifact arrives on Earth. Its internal components were formed by a purely stochastic, non-selective, non-intentional process (e.g., quantum fluctuation in nebula). It demonstrably exhibits sophisticated, adaptive, goal-directed behavior (e.g., energy acquisition, self-repair, environmental modeling). Does its internal state predicting "danger on the left" have the *determinate* content "danger on the left"? | **No.** Without a history of selection *for* a specific function (e.g., danger avoidance), there is no fact of the matter about what the state's *proper* function is, and thus no basis for attributing determinate content or genuine misrepresentation. Its behavior is merely complex causation. | **Yes.** The artifact's current, stable, goal-directed functional organization and predictive dynamics (e.g., its internal models optimized for prediction error minimization relative to its operational goals) suffice to ground determinate content. "Danger on the left" is the content because that's what the state is *supposed* to indicate for the system's current functional success. |
  | **2. Misrepresentation in Perfect Learners** | **TS Stance:** In systems whose training ensures states *never* misfire relative to the training objective *during training*, genuine misrepresentation cannot occur *after training*. If a state reliably correlates with X during training, its content is fixed as X. Post-training "errors" reflect environmental change or noise, not the state misrepresenting X as Y. | **SF Stance:** Misrepresentation can occur in systems perfectly trained on a specific dataset/distribution, even if they never erred during training. This arises from the system's *counterfactual dispositions* defined by its learned model. If the model would systematically produce an inaccurate output state Y in response to a novel input Z (where Y doesn't track the relevant state of affairs S), despite the system's functional goals implying it *should* track S, then state Y misrepresents Z as S (or misrepresents the state of affairs). | **Can a system that never experienced a representational error *during its learning/training phase* exhibit genuine misrepresentation *post-learning*, especially in novel situations?** | **The Perfect Predictor:** An AI net is trained via gradient descent on a vast, static dataset D (e.g., classifying images of cats vs. dogs) until it achieves perfect accuracy (100%) on D and a held-out validation set sampled from the same distribution. Training stops. It is then exposed to a novel, systematically altered stimulus – a "cat-dog chimera" (C-D) – crafted to lie outside D's distribution. The net outputs "Dog" with high confidence for C-D. Is this output state a genuine *misrepresentation* (e.g., falsely representing "dog present")? | **No.** The state reliably correlated with dogs *during the selection process (training)*. Its proper function is to indicate dogs *as defined by the training distribution*. C-D wasn't part of that distribution. The output "Dog" for C-D is not a misrepresentation *of C-D as a dog*; it's a correct representation *according to the function fixed by training* (indicating "dog" based on the learned features). It's simply not equipped for this novel case. | **Yes.** The system's learned model embodies implicit generalizations and counterfactual commitments. Outputting "Dog" for C-D is incorrect relative to the system's *functional goal* of accurate categorization *in the actual world* (where C-D is neither a dog nor a cat). This systematic failure in a novel situation, stemming from the model's inherent limitations/overgeneralizations learned during training, constitutes genuine misrepresentation. The state "Dog" misrepresents the input C-D as being a dog. |
