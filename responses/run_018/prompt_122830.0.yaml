prompt: |-
  I write fiction, and I am about to make a decision that a historian is free to postpone. My novel is narrated in the first person by a woman from a fishing household on the northern shore of the lake, who attaches herself to a Galilean preacher and stays with him to the end. That means I have to settle, before drafting, what this preacher said, what he refused to say, what he thought he was doing, what the people travelling with him were expecting of him, and how much of any of it is only the evangelists' retrospection. I can hedge in a note; I cannot hedge in a scene. So I need a specification rather than a survey.

  Please write the desiderata that any method for getting from our sources — the four Gospels, with their well-known dependencies on one another; the letters of Paul, with their near-total silence about the life; the brief notices in Josephus, one of which has probably been retouched by Christian hands — to a portrait of Jesus would have to satisfy. Fix the purpose as mine: a portrait good enough to build one determinate character on, capable of carrying a psychological arc and of acting for reasons a reader can follow, rather than a portrait good enough for a monograph. Whether the standard is the same for the two purposes is itself something I want you to decide.

  For each requirement, give the case or consideration behind it, and mark it either non-negotiable or a preference of one school or one craft. Among the things I want adjudicated: whether a method owes me anything about what he did not say and could not have done, or only about what he did and said; whether a method can coherently be required to be independent of the historian's prior portrait of Jesus, or whether any criterion of authenticity is doomed to ratify whichever portrait it was run to confirm; how a criterion should treat sources that are not neutral reports but interpretations produced by people who already believed; whether the desiderata should require the method to recover the believing community as well as the man, since I have to stage the ensemble and not only the protagonist; and whether the portrait must be at once continuous with first-century Jewish life and discontinuous enough to explain why a movement formed around him and why Rome killed him.

  I also want a candidate criterion of my own audited. I have been working with something I call narrative fit: a reconstruction is adequate only if the actions I need to stage follow from the sayings I attribute to him, and those sayings from those actions, without my having to supply a bridging motive that the sources nowhere suggest. Is that a genuine desideratum, a novelist's prejudice smuggled into historiographical method, or a requirement with a narrow but real domain — and if the last, over what range is it trustworthy?

  Then the two things I care about most. First, tell me which subset of your desiderata you suspect cannot be jointly satisfied, and why: I would rather have the impossibility than a list that flatters my hopes. Second, name the single requirement that does the most work in excluding the criteria in ordinary use — embarrassment, dissimilarity, multiple attestation, Semitic or Palestinian linguistic and environmental colour, coherence with what has already been accepted — and score those against your list briefly, in a table if you prefer, since that part I can check for myself.

  Two closing requests. Give me a decision rule for an author: when the best-supported reconstruction of a scene carries something like a third or two-fifths of the probability mass and the alternatives are not dramatically worse, what may a novelist do, and exactly where does legitimate filling-in become dishonest? And mark your own confidence: attach a level of confidence to each desideratum, tell me which one you would retreat from first, say which consideration or piece of evidence would change your verdict about the most discriminating requirement, and say where you think your reasoning is most likely to fail.
reasoning: |-
  Okay, let me approach this systematically. The user is crafting a historical novel about a first-century Galilean woman following Jesus, requiring a psychologically coherent character portrait grounded in historical research. They need methodological rigor but with novelistic flexibility.

  First, I consider the core tension: historiography demands probability-weighted possibilities while fiction requires definite choices. The user needs to know where scholarly consensus exists (e.g., Jesus' crucifixion under Pilate) versus where reconstruction is necessary (e.g., his self-understanding). 

  For desiderata, I start with non-negotiables:
  - Crucifixion as historical anchor (Josephus/Tacitus corroboration)
  - Galilean Jewish context (archaeological/textual evidence)
  - Movement formation requiring discontinuity (explains both following and execution)

  Then examine problematic criteria:
  - Dissimilarity fails on discontinuity requirement
  - Embarrassment ignores community interpretation
  - Multiple attestation overlooks literary dependencies

  The user's "narrative fit" concept seems valid for fiction but risks circularity in scholarship. I'll position it as a weak coherence test for novelist's scaffolding.

  Major conflicts emerge between:
  - Interpretive nature of sources vs. need for psychological motives
  - Scholar's provisional conclusions vs. novelist's definite choices

  For the decision rule, I'll propose probability thresholds: >70% for core facts, <50% allowing novelist's choice with transparency about alternatives.

  Key evidence gaps affecting confidence:
  - Silence in Pauline letters about Jesus' life
  - Uncertain dating of Q source
  - Roman administrative procedures in Judea

  The reconstruction must balance plausibility in first-century Judaism with sufficient distinctness to explain both following and execution. The baptism and temple incident seem pivotal here.

  For fictional choices, I'll suggest clear signaling of inventions through narrative framing devices while maintaining internal consistency with established historical contours.
answer: |-
  Here is a specification of desiderata for reconstructing a portrait of Jesus suitable for your novel's protagonist, designed to yield a psychologically coherent character capable of driving narrative action. Each requirement is grounded in historical/textual considerations and marked for negotiability. Following this, I address your specific queries and conclude with decision rules.

  ---

  ### **Desiderata for a Novelist's Portrait of Jesus**
  *(Ordered by priority for character construction)*

  1. **Non-Negotiable: Situational Plausibility in 1st-Century Judea**  
     - **Case**: Actions/sayings must align with verifiable material culture (e.g., fishing economies), social structures (e.g., Temple purity concerns), and political realities (e.g., Roman-client ruler tensions).  
     - **Why**: Prevents anachronisms that break reader immersion. Your narrator’s observations (fishing nets, tax collectors, Roman patrols) demand environmental accuracy.  
     - **Confidence**: 95% (archaeology/Josephus/philology anchor this).

  2. **Non-Negotiable: Generative Discontinuity**  
     - **Case**: The portrait must explain *both* the formation of a devoted movement *and* execution by Rome.  
     - **Why**: A figure who blends entirely into Jewish restorationism (e.g., like Theudas) wouldn’t attract a unique following; one who fits Roman norms wouldn’t be crucified. Requires *sufficient* rupture from expectations (e.g., authority over Torah, open association with "sinners," provocative Temple act).  
     - **Confidence**: 90% (outcome implies cause; crucifixion for sedition is historical bedrock).

  3. **Preference (High Priority): Source-Transparent Motive Attribution**  
     - **Case**: Motives (e.g., "Why cleanse the Temple?") must derive from plausible inferences within the text, not modern psychologizing.  
     - **Why**: Avoids "bridging motives" you rightly distrust. If sources frame an act as symbolic judgment (Mark 11:17), accept that *as the stated motive* unless evidence contradicts.  
     - **Confidence**: 80% (gospels theologize but preserve narrative logic).

  4. **Non-Negotiable: Indifference to Later Christology**  
     - **Case**: Reject sayings/actions explicable *only* by post-resurrection theology (e.g., explicit Trinity claims).  
     - **Why**: Your narrator witnesses the *pre-crucifixion* figure. High Christology (e.g., John’s "I and the Father are one") likely reflects later community belief.  
     - **Confidence**: 85% (Paul’s early letters lack Jesus’ life details but show evolving Christology).

  5. **Preference: Ensemble Coherence**  
     - **Case**: The portrait must accommodate the documented reactions of followers (e.g., Peter’s denial), opponents (e.g., Pharisees’ legal objections), and neutral observers.  
     - **Why**: Your narrator interacts with a group. Peter’s actions imply a Jesus who inspired devotion *and* confusion.  
     - **Confidence**: 75% (gospel character reactions show consistency across traditions).

  6. **Preference: Constrained Ambiguity on Self-Understanding**  
     - **Case**: The portrait may leave Jesus’ self-concept open (e.g., "prophet" vs. "Messiah") but must show *how his actions invited interpretation*.  
     - **Why**: Your narrator can speculate, but Jesus’ character acts in ways that provoke titles (e.g., riding a donkey: Zech 9:9 allusion).  
     - **Confidence**: 70% (sources retroject titles but gesture at underlying behavior).

  7. **Non-Negotiable: Rejection of Anti-Judaism**  
     - **Case**: No portrayal relying on "rejecting Judaism" or "founding a new religion."  
     - **Why**: Jesus debates Torah *within* Jewish frameworks (e.g., Sabbath healing as fulfilling Torah’s intent). Rome killed him as a *Jewish* troublemaker.  
     - **Confidence**: 95% (Dead Sea Scrolls/Pharisaic diversity confirm intra-Jewish diversity).

  ---

  ### **Adjudicating Your Queries**
  - **What He Did Not Say/Could Not Do**: A method *must* establish boundaries (e.g., he didn’t preach Pauline grace theology; couldn’t ignore Sabbath/Temple without consequence). *Non-negotiable for discontinuity & plausibility*.  
  - **Historian’s Prior Portrait**: All criteria risk confirmation bias. *Mitigate by requiring discontinuity* – it forces confrontation with inconvenient evidence (e.g., crucifixion).  
  - **Non-Neutral Sources**: Treat as *interpretive responses* to actual events. The "temple cleansing" is multiply attested *and* disruptive – likely historical, though theologized.  
  - **Recovering the Community**: *Essential for your ensemble*. The movement’s expectations (e.g., imminent kingdom) stem from Jesus’ own preaching (e.g., Mark 1:15).  
  - **Continuity/Discontinuity**: *Core to generative discontinuity*. He must be intelligible as a Jew (e.g., eschatological hope) yet distinct enough to cause rupture (e.g., "kingdom" redefined).  

  **Your "Narrative Fit" Criterion**:  
  - **Status**: Valid *narrow* desideratum (psychological plausibility).  
  - **Domain**: Use when actions/sayings are:  
    - Multiply attested (e.g., temple act + "den of robbers" saying).  
    - Thematically cohesive (e.g., association with outcasts → critique of purity norms).  
  - **Risk**: Smuggling novelist’s bias if applied to *isolated* sayings. Trust only when sources imply motive (e.g., parables defending table fellowship).  

  ---

  ### **Critical Tensions & Method Failures**
  **Irresolvable Tension**:  
  - **The Self-Understanding Dilemma**:  
    We lack direct access to Jesus’ mind. Sources project titles ("Messiah," "Son of God") post-resurrection. Yet your novel needs *motives*.  
    - *Why impossible?* Historians infer motives from actions/context; but Jesus’ pivotal actions (e.g., Temple act) are already interpreted by sources. You must *choose* a psychologically plausible motive consistent with 1st-century Jewish thought (e.g., "symbolic restoration of Temple purity") but cannot "prove" it.  

  **Most Discriminating Desideratum**:  
  **Generative Discontinuity** – it excludes inadequate portraits:  
  - A purely "wisdom teacher" (no rupture → no execution).  
  - A revolutionary Zealot (no wandering preacher following → movement incoherent).  

  *Table: Common Criteria vs. Desiderata*  

  | **Criterion**      | **Fails Generative Discontinuity?** | **Fails Ensemble Coherence?** | **Fails Source Transparency?** |  
  |---------------------|-----------------------------------|-----------------------------|------------------------------|  
  | Embarrassment       | Yes (downplays disruptive acts)   | No                          | **Yes** (ignores community interpretation) |  
  | Dissimilarity       | **Yes** (removes Jewish continuity) | **Yes** (isolates Jesus)    | No                           |  
  | Multiple Attestation| No                                | No                          | **Yes** (ignores literary dependencies) |  
  | Semitic/Palestinian | No                                | **Yes** (ignores group dynamics) | No                           |  
  | Coherence           | **Yes** (can reinforce bias)      | No                          | **Yes** (may invent links)   |  

  ---

  ### **Decision Rules for Novelists**
  1. **When Probability is Split (e.g., 40% vs. 30% vs. 30%):**  
     - **Legitimate**: Choose the *most narratively generative* option that:  
       - Respects non-negotiables (e.g., Jewish context).  
       - Explains follower reactions (e.g., if Jesus spoke of "kingdom," choose an interpretation aligning with Peter’s confession/denial).  
     - **Dishonest**: Inventing *key motives/actions* contradicted by all sources (e.g., Jesus planning a armed revolt) or ignoring discontinuity (e.g., Rome executes no harmless philosophers).  
     - **Fill-in Threshold**: Bridge gaps only where sources are silent (e.g., *how* your narrator traveled between towns), not where they conflict (e.g., *why* Judas betrayed).  

  2. **Where to Signal Uncertainty**:  
     - Use the narrator’s limited perspective (e.g., "I wondered if he meant...").  
     - Embed alternative interpretations in dialogue (e.g., Pharisees vs. disciples debating a parable).  

  ---

  ### **Confidence & Retreat Points**
  - **Highest Confidence**: Situational Plausibility (95%). Retreat only if new archaeological evidence upsets Galilean socio-economics.  
  - **Most Vulnerable**: Constrained Ambiguity (70%). If a pre-70 CE fragment emerged showing Jesus explicitly claiming Messiahship, I’d retreat to avoid over-interpretation.  
  - **Likely Failure Point**: Underestimating how *early* theological interpretation began (e.g., within Jesus’ lifetime). The "kingdom" sayings may be more retrojected than I assume.  
  - **Key Evidence Gaps**:  
    - The nature of the "zealot" Simon (revolutionary or not?) – affects ensemble expectations.  
    - Pre-crucifixion High Priest politics – shapes motives for Jesus’ arrest.  

  **Final Advice**: Build your Jesus around:  
  1. **Actions**: Baptism by John → Temple disruption → Crucifixion.  
  2. **Sayings**: "Kingdom of God" as immanent yet subversive; parables defending inclusion.  
  3. **Silences**: Refusal to endorse armed revolt; ambiguity on titles.  
  This satisfies discontinuity (Rome kills subversives), continuity (Jewish eschatology), and narrative fit (actions/sayings cohere). Follower confusion arises naturally from this mix.
