prompt: |-
  So I'm in this second-year metaphysics class and we've been doing personal identity, and the Ship of Theseus came up as a warm-up, but it's eating my brain because my gut answers on different cases don't seem to line up. Let me just dump my verdicts and you tell me what principle, if any, is behind them -- or which ones I have to give up.

  1. The classic version: gradual plank-by-plank replacement over years of repairs. Same ship, easy. Nobody thinks the ship dies and gets replaced every time a plank rots.
  2. The collector version: someone gathers all the original discarded planks and rebuilds a ship out of them in a museum. My gut says THAT one is Theseus's ship, and the continuously-repaired one is a very good successor but not it. I know these two already create pressure.
  3. A river keeps flowing, water never the same twice: same river, obviously. The Mississippi is one river.
  4. A band replaces its members one at a time over twenty years until no founding member is left: NOT the same band. Feels like a tribute act with legal rights to the name.
  5. Same thing but with a restaurant: original chef retires, staff all turn over, it even moves across town, but the menu and name carry on. My gut says same restaurant! And yes I notice 4 and 5 look identical structurally and I want them to come out different. Help.
  6. Teleporter that scans you, destroys the original, and rebuilds you atom-for-atom on Mars: not you. You die, a perfect copy wakes up. Pretty confident.
  7. But then: gradual neuron replacement, one synthetic neuron at a time over years, each one taking over the job of the one it replaces -- that's still you, same as the ship in case 1.
  8. An axe where you replace the handle one year and the head the next: same axe, I'd say, though I notice I said no about the band and I'm less sure why.

  So cases 1 and 7 go together, and 2 and 6 seem to pair up as "the original matter wins / reconstruction loses," but then 4 breaks the gradual-replacement pattern and 5 breaks it in the opposite direction, and 3 seems to say matter doesn't matter at all which torpedoes 2. Is there one principle -- continuity of organization, spatiotemporal continuity, sortal-dependence, whatever -- that gets most of these? I'd rather hear a clean principle that forces me to flip one verdict than a bloated one with a special clause per case, but tell me honestly which verdicts it can't save. Also say what it predicts for a case I didn't list: a corporation that outlives every employee, shareholder, and building it started with.

  At the very end, state the principle in one sentence on a last line beginning "Principle:".
reasoning: |-
  Okay, the user is in a metaphysics class struggling with personal identity puzzles, especially the Ship of Theseus and its variations. Their gut reactions to different cases seem inconsistent, and they want a unifying principle or to know which intuitions they need to abandon. Let me unpack their cases first.

  The user lists eight scenarios with their intuitive judgments. Cases 1 (Ship gradual replacement) and 7 (neuron replacement) feel like identity persists through gradual part changes. Case 2 (rebuilt original planks) makes them think the reconstructed ship is the real one, conflicting with case 1. Case 3 (river) accepts constant material change, while case 4 (band member replacement) denies identity despite similar structure. Case 5 (restaurant) surprisingly feels like the same entity even with full turnover and relocation. Case 6 (teleporter destruction) feels like death, not continuity. Case 8 (axe replacement) aligns with persistence like the ship.

  The core tension is between their material intuition (original planks matter in case 2) and functional/organizational intuition (restaurant identity survives total change). Cases 4 and 5 are especially problematic—structurally identical but judged differently. They likely need a principle that explains why human institutions (bands vs restaurants) feel different despite parallel changes.

  For a unifying approach, psychological continuity works best for persons (explaining neuron replacement vs teleporter destruction), while functional role matters for artifacts/organizations. The band/restaurant discrepancy might stem from perceiving bands as defined by original members' creative identity, whereas restaurants are seen as service providers where function and brand persist. 

  The user’s corporation question is a great test: a functionalist view would call it the same entity if its organizational purpose and legal identity continue, regardless of material changes. This mirrors their restaurant verdict. 

  Their river case suggests they accept causal-historical continuity over matter (water changes but the river persists via the same source and path). This supports a process-based view for natural kinds but conflicts slightly with their Ship of Theseus collector verdict where original material suddenly matters. They might need to relax that material fixation for artifacts.

  Inconsistencies to address: If they accept the repaired ship (case 1) but not the band (case 4), they must either defend bands as member-dependent or concede the restaurant judgment is inconsistent. I’ll suggest flipping the band verdict to align with the restaurant if they prioritize function, or accept that bands have a different "sortal" (identity tied to persons).

  Finally, the corporation: same entity under functional continuity, just like the restaurant. Principle would be: Identity persistence depends on maintained functional organization for artifacts/institutions, and psychological continuity for persons, within a single spatiotemporal history.
answer: |-
  Your intuitions reveal a fascinating tension between **material continuity**, **functional/organizational continuity**, and **causal-historical continuity**. No single principle captures all your verdicts cleanly, but **Functional Continuity + Causal History** comes closest. Here's how it explains (and challenges) your judgments:

  ### Analysis of Your Cases:
  1.  **Ship (gradual):** ✅ Same ship. **Functional continuity** (same structure, purpose, use) + **spatiotemporal continuity** (no abrupt break).
  2.  **Ship (rebuilt):** ✅ Original ship. **Original material** + **causal history** (planks trace back to the original ship) matter more here than function for you. This clashes with (1) if *only* function mattered.
  3.  **River:** ✅ Same river. **Functional/Organizational continuity** (same path, source, mouth, role in the ecosystem) dominates. Material (water molecules) is irrelevant. This supports (1) and (7), but challenges (2).
  4.  **Band:** ❌ Not the same band. Here, **original members/persons** (specific material *and* psychological continuity) seem crucial to identity for you, overriding functional continuity (same music, name, role). This highlights the importance of **sortals** (what *kind* of thing it is - a *band* is defined by its members).
  5.  **Restaurant:** ✅ Same restaurant. **Functional/Organizational continuity** (same recipes, branding, service, *purpose*) dominates. Material (staff, location, atoms) is secondary. This *structurally contradicts* (4) unless the sortal difference (band vs. business) justifies it. Your gut likely sees a band as an *aggregate of specific persons*, while a restaurant is an *institution* defined by its function/brand.
  6.  **Teleporter (destructive):** ❌ Not you. **No spatiotemporal continuity** + **causal discontinuity** (original is destroyed). Functional/psychological continuity exists but is insufficient without causal connection *through time*. Supports (2) over (6).
  7.  **Neuron replacement:** ✅ Same you. **Gradual spatiotemporal + psychological + functional continuity**. Neurons are replaced *in situ*, preserving the mind's structure and causal flow. Parallel to (1).
  8.  **Axe:** ✅ Same axe. **Functional continuity** (it's still an axe doing axe things) + **spatiotemporal continuity** (gradual replacement in place). Like (1) & (7). Challenges (4) – why is gradual member replacement different?

  ### The Principle (Functional Continuity + Causal History within a Spatiotemporal Path)
  **Identity persists if the core functional organization essential to the kind of entity it is (its *sortal*) is maintained via a continuous causal chain within a single spatiotemporal path.**

  *   **Functional Organization:** What the thing *does* or *is for* (ship: transport/cultural symbol; river: water flow/drainage basin; axe: chopping; restaurant: serving food/brand; person: consciousness/memory/agency).
  *   **Causal Chain:** Changes happen *because* of the entity's prior state/activities (repairs due to wear, staff hired to maintain service, neurons replaced to sustain function).
  *   **Spatiotemporal Path:** No abrupt disappearance/reassembly elsewhere (key difference between gradual replacement and teleporter/museum rebuild).
  *   **Sortal-Dependence:** What counts as "core functional organization" depends on the *kind* of thing it is (e.g., for a band, the *specific members* might be essential; for a river, the *pathway* is essential; for a person, *psychological continuity* is essential).

  ### Where Your Verdicts Conflict & What to Flip:
  1.  **Band (4) vs. Restaurant (5) & Axe (8):** This is the biggest tension. The principle suggests:
      *   **Flip Band (4):** If the band maintains its musical style, brand, and purpose through gradual member changes *within its ongoing career* (spatiotemporal path), it *is* the same band (like the ship/axe). Your "tribute act" feeling might stem from thinking of bands as defined by *original creators*, not the *ongoing institution*. Concede that bands, like restaurants, are institutions defined by function/brand continuity.
      *   **OR Flip Restaurant (5) if you can't:** If you can't shake the band intuition, you *must* flip the restaurant (5) to "not the same" for consistency. But this feels less intuitive for most (and conflicts with your gut).
  2.  **Ship Rebuilt (2) vs. River (3) & Ship Gradual (1):** The principle favors (1) & (3) over (2). The museum ship lacks the **continuous causal chain within *its own* spatiotemporal path**. It's a replica built from original parts. **Flip (2):** The continuously repaired ship (with functional/causal/spatiotemporal continuity) is Theseus's ship. The museum piece is a replica, however historically significant. (This is Parfit's "Branch Line" case – the original path matters).

  ### How the Principle Handles Your Cases:
  1.  ✅ **Ship (gradual):** Core function (being a seaworthy ship), causal chain (repairs maintain it), spatiotemporal path (continuous).
  2.  ❌ **Ship (rebuilt):** ✘ Continuous causal chain/spatiotemporal path. (Flip verdict).
  3.  ✅ **River:** Core function (water flowing along path), causal chain (erosion, flow patterns), spatiotemporal path (continuous channel).
  4.  ✅ **Band (flipped):** Core function (performing music under brand), causal chain (members hired to sustain band), spatiotemporal path (ongoing career). (OR ❌ if sortal insists on original members, but requires flipping 5).
  5.  ✅ **Restaurant:** Core function (serving food/brand), causal chain (staff hired/recipes maintained), spatiotemporal path (even if moves, continuity exists). (OR ❌ if forced by band verdict).
  6.  ❌ **Teleporter:** ✘ Spatiotemporal continuity (destruction/rebuild), ✘ continuous causal chain (scan ≠ causal maintenance of function *in situ*).
  7.  ✅ **Neuron Replacement:** Core function (consciousness/memory), causal chain (replacements sustain function), spatiotemporal path (continuous brain/body).
  8.  ✅ **Axe:** Core function (chopping), causal chain (replacements maintain function), spatiotemporal path (continuous).

  ### The Corporation Case Prediction:
  *   **Scenario:** Corporation outlives all original employees, shareholders, and buildings.
  *   **Principle Prediction:** ✅ **Same corporation.**
      *   **Functional Organization:** Core purpose (e.g., selling widgets, providing services), legal identity, brand, management structure, assets/liabilities persist.
      *   **Causal Chain:** Changes happen *because* of the corporation's prior state (hiring, firing, buying/selling property, strategic decisions made by its legally authorized agents).
      *   **Spatiotemporal Path:** Legal/operational existence is continuous (even if locations change; its "path" is its documented, unbroken existence).
      *   **Sortal:** A corporation is fundamentally an *institution* defined by its functional/organizational role and legal identity, not its specific matter (employees/buildings) or even shareholders.

  **Principle:** Identity persists if the essential functional organization defined by the entity's sortal is maintained via a continuous causal chain within a single spatiotemporal path.
