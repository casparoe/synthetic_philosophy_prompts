answer: |-
  Your challenge presents a compelling case for a copycat analogical mechanism over family resemblance or prototype theory to explain the conceptual extension of "branching." I argue that this mechanism—copying a *relational skeleton* while discarding ontological commitments—best captures the core phenomenon across domains. Below, I address each objection systematically:

  **Core Argument: The Copycat Mechanism**  
  In both software (feature flags) and botany (lateral roots), "branching" is extended not because these instances share surface features with tree branches (family resemblance) or because they are "good examples" (prototypes), but because they **preserve a specific relational structure abstracted from the source domain**:  
  1. **Divergence from a Singular Origin** (main trunk/main codebase).  
  2. **Capacity for Independent Development** (growth/feature testing).  
  3. **Potential for Reintegration or Termination** (merging/pruning).  

  This structure is copied *deliberately*, stripped of its biological or physical ontology (wood, cells, gravity responses) and mapped onto target domains (code, taxonomy) where new ontologies apply (Git commits, vascular systems). The mechanism is *analogical* because it relies on aligning relational roles, not attributes.  

  **Addressing Objections:**  

  1. **Computational Intractability: "Full alignment is impossible."**  
      This mischaracterizes the process. The copycat mechanism does **not** require exhaustive domain alignment but **schema-driven abstraction**. The mind extracts a *minimal relational schema* (origin → divergence → independence → potential fusion/end) from the source (e.g., a tree branch). This schema is then applied flexibly:  
      - **Partial Mapping Suffices**: A feature flag diverges from `main`, develops independently (testing), and may be merged or deleted. We don’t need to align "photosynthesis" with "compilation"—the schema ignores such properties.  
      - **Cognitive Efficiency**: Analogical mapping is computationally feasible because it operates on sparse, high-level relations. Cognitive science shows that relational schemas (e.g., "divergent paths from a source") are processed as gestalt patterns, not point-by-point comparisons. The mechanism discards irrelevant ontology *by design*, reducing computational load.  
      *Counterexample*: Family resemblance fails here—feature flags share *no* intrinsic properties with tree branches (no wood, no leaves), yet are uncontroversially "branches." Prototypes struggle because lateral roots are peripheral members yet central to the concept’s extension.  

  2. **Normative Constraints: "Why can’t we call *any* divergence a branch?"**  
      Normative constraints arise not from the relational skeleton itself, but from **pragmatic grounding in the target domain’s functional ontology**. The copycat mechanism includes two filters:  
      - **Purpose-Driven Adoption**: We extend "branching" only if the target domain instantiates the schema *for a purpose analogous to the source*. In software, branching enables parallel development (like a tree’s resource exploration); in botany, lateral roots explore soil resources. Divergences like a cancer metastasizing fit the skeleton but lack this functional analogy—their purpose (malignant growth) clashes with the core concept of *productive exploration*.  
      - **Conventional Teleology**: Terms are extended only if the target domain’s ontology supports the schema’s *telos*. A river delta diverges from a source but isn’t a "branch" because water channels lack *independent development* (they’re hydrologically interdependent) or *deliberate reintegration*. The mechanism thus explains constraints via the schema’s *functional essence*, not arbitrary norms.  

  3. **Disguised Relational Essentialism: "Aren’t relations just new essences?"**  
      No—this confuses **relational patterns** with **essential properties**. The copycat mechanism is anti-essentialist in three ways:  
      - **Ontological Agnosticism**: It explicitly *rejects* entity-based essences (e.g., "branches must be wooden"). Relations are not reified "essences" but **transferable patterns of interaction**. The schema defines no necessary physical properties, only conditions like "autonomous development *relative to* an origin."  
      - **Contextual Variability**: The *same* relation manifests differently across domains. "Reintegration" in Git (code merging) vs. botany (vascular reconnection) involves distinct processes, showing the schema’s adaptability. Relations gain content only from the target ontology.  
      - **Non-Monolithic Structure**: The schema can be **decomposed or extended** (e.g., adding "sub-branching" in software). This flexibility contrasts with essentialism, which demands fixed necessary/sufficient conditions. The relational skeleton is a *template for analogy*, not a timeless essence.  

  **Conclusion**:  
  The copycat mechanism—copying a relational schema while discarding source ontology—elegantly explains how "branching" extends to dissimilar domains. It avoids computational overload through schematic abstraction, incorporates normative constraints via functional/pragmatic alignment, and evades disguised essentialism by treating relations as dynamic, ontologically neutral patterns. Family resemblance and prototypes, by contrast, rely on similarity metrics or typicality, failing to capture why a feature flag is a "branch" despite zero perceptual or functional overlap with a tree limb. The power lies in the skeleton, not the flesh.
