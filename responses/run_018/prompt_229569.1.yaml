prompt: |-
  I need a thought experiment for a teaching handout on artifact identity, so the case has to generate the verdicts instead of just stipulating them — no fair changing what counts as the same ship halfway through. Take the Ship of Theseus. In the standard setup, continuity of form and continuity of overlapping matter both pick the continuously repaired ship; I want you to build a version where a third criterion, continuity of function (understood roughly as: the thing goes on playing the social role the original actually played), picks the ship rebuilt from the discarded planks instead. Constraints: ordinary materials, no supernatural or sci-fi elements, the rebuilt ship can't be assembled until after the repaired ship is already in service, the discarded planks must never compose a working, floating ship during the transition, and the function verdict has to be earned by what the original ship was for, not by slapping a label on one of the two later ships. Give me: The scenario (one paragraph); Why form continuity picks the repaired ship (2–3 sentences); Why overlap-matter continuity picks the repaired ship (2–3 sentences); Why function continuity picks the rebuilt ship (2–3 sentences); The load-bearing feature (one sentence); What happens if you remove that feature (1–2 sentences); How a defender of the losing ship would attack the case (1–2 sentences).
reasoning: |-
  Okay, the user wants a thought experiment for teaching artifact identity, specifically modifying the Ship of Theseus to make functional continuity favor the reassembled ship over the continuously repaired one. They've set several constraints: no sci-fi/supernatural elements, the reassembly must happen after the repaired ship is operational, the discarded planks can't form a functional ship during transition, and the functional verdict must stem from the original ship's actual role—not arbitrary labeling. 

  Hmm, the tricky part is making function naturally align with the reassembled ship without violating constraints. The original ship needs a core function tied to its identity beyond just sailing—something ceremonial or symbolic where preservation of physical material matters more than form. Maybe a flagship or a relic? 

  Ah, perfect: a ceremonial barge used for annual rites. Its function isn't just transport but embodying history through original materials. That way, even when decayed planks are replaced, the reassembled ship later could reclaim the ceremonial role precisely because it has the "sacred" original wood. Meanwhile, the repaired ship keeps form and matter continuity but loses the core function. 

  For the load-bearing feature: the original ship's function must inherently depend on material authenticity, not just structure. If that's removed—say, if it's just a cargo ship—functionality would follow the repaired ship instead. Critics might argue the reassembled ship is a replica, but the ceremonial context forces us to admit original material *is* functionally essential. 

  Gotta ensure the planks never compose a ship mid-process. Easy: they're stored as loose lumber until reassembly years later. And since the barge only sails once yearly, there's no overlap where both ships functionally exist simultaneously. 

  User's clearly thought this through—appreciate how they blocked loopholes like "slapping labels" or sci-fi cheats. They're likely teaching philosophy of mind/metaphysics and want students to wrestle with multiple persistence criteria. The ceremonial angle makes the functional verdict feel earned, not contrived. Clever constraint about the planks never floating during transition too; avoids that "two ships" paradox. 

  Should emphasize why the other criteria still point to the repaired ship: form continuity is obvious (identical shape), matter continuity via gradual replacement (standard Ship of Theseus reasoning). The ceremonial function twist is what breaks the tie. 

  Critic's objection writes itself: "The reassembled ship is a new artifact!" But that's the point—it forces debate about whether function can resurrect identity via original parts. Exactly the messy, discussable tension the user wants.
answer: |-
  Here's the thought experiment meeting all your constraints, designed to generate the specified verdicts:

  **The Scenario:**
  The *Harmony* is a historic ceremonial barge, central to an annual city festival commemorating its founding. Its primary function isn't transport but acting as the sacred vessel carrying the Founder's Relic in a solemn river procession. Over decades, its wooden planks rot and are meticulously replaced one-by-one with identical new timber, preserving its exact form. The decayed original planks are carefully stored in the city archive. Years *after* this continuously repaired barge has performed the ceremony multiple times, traditionalists, believing only wood that was part of the original voyage holds ritual potency, painstakingly reassemble the *original* decayed planks into a barge matching the *Harmony*'s form using traditional methods. This "rebuilt" barge is completed well after the annual ceremony involving the repaired ship. Crucially, during the plank replacement and storage, the discarded planks never composed a floating vessel; they were inert lumber.

  **Why Form Continuity Picks the Repaired Ship:**
  The repaired ship maintains the *Harmony*'s exact shape, structure, and appearance continuously from the start. At every moment, it looks and functions (structurally) like the *Harmony*. The rebuilt ship only achieves this form later and discontinuously.

  **Why Overlap-Matter Continuity Picks the Repaired Ship:**
  The repaired ship preserves spatiotemporal continuity through gradual replacement. At any given time, the vast majority of its matter was part of the ship immediately before, following the standard Theseus "chain of overlapping parts." The rebuilt ship has no matter overlapping with the *Harmony* at any time since its reassembly; it's assembled from parts discarded long ago.

  **Why Function Continuity Picks the Rebuilt Ship:**
  The *Harmony*'s core, original function was intrinsically tied to its *specific material history* – carrying the relic *as the vessel constructed from the specific wood used in the founding event*. The repaired ship, while structurally identical and capable of floating, lacks the original wood necessary for the *specific ritual function* of conveying authentic historical/ceremonial power. The rebuilt ship, despite its decay and later assembly, possesses the original material deemed essential for fulfilling the *exact social role* the original *actually played*: being the materially authentic sacred vessel. Its successful use in a future ceremony (once restored) confirms it regains this specific function based on the original criterion.

  **The Load-Bearing Feature:**
  The original ship's essential function (being the sacred relic-carrier) is *inherently and socially defined as dependent on its original material composition*, not just its form or generic floating capability.

  **What Happens If You Remove That Feature:**
  If the *Harmony*'s primary function was simply "floating ceremonial barge" without the material authenticity requirement, functional continuity would clearly follow the continuously operational repaired ship. The rebuilt ship would be seen as a replica, not the functional successor.

  **How a Defender of the Repaired Ship Would Attack the Case:**
  A defender would argue that the *actual, continuous performance* of the ceremony by the repaired ship for years *is* the true functional continuity; the "material authenticity" criterion is a *new*, added requirement imposed *after the fact* by traditionalists, not part of the original ship's core function. They might claim the rebuilt ship is merely a symbolic *representation* or relic itself, not the functional artifact that persisted. ("The ship *doing* the job *is* the ship!")

  **Key Points Validating Constraints:**
  *   **No Sci-Fi/Supernatural:** Relies on social/cultural beliefs about material authenticity (common in historical artifacts/relics).
  *   **Rebuilt After Repaired:** The rebuilt ship is assembled *years after* the repaired ship is already performing the ceremony.
  *   **Planks Never Composed a Ship:** Discarded planks are stored as lumber, never forming a working vessel.
  *   **Function Earned by Original Role:** The material requirement stems *from the original ship's actual ceremonial purpose* (carrying the relic *as the founding vessel*), not an arbitrary label applied later.
  *   **Verbal Distinction:** The repaired ship is "the repaired *Harmony*" or "the ceremonial barge." The rebuilt ship is "the rebuilt ship" or "the original-plank vessel."
