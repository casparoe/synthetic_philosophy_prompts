answer: |-
  Here’s a concise commencement speech (440 words) bridging expert and lay audiences, pivoting from symbol grounding to ethical grounding:

  ---

  **Faculty, families, and philosophers of mind: today we celebrate words mastered.**  
  You graduates understand Harnad’s challenge: symbols gain meaning only when anchored in embodied experience. Without sensory grounding, they’re empty syntax—like an AI describing "red" without ever seeing light.  

  Yet your education risks mirroring that very disconnect. You’ve absorbed the formal vocabulary of cognition, intentionality, qualia… but unlike LLMs manipulating language without flesh, *you* are not disembodied. You’ve lived, struggled, felt. Still, we must ask: **did this curriculum ground you, or just arm you with symbols?**  

  This brings me to my uneasy twist: **ethical grounding**. We teach ethics as principles—utilitarianism, deontology—beautiful symbols. But can moral commitments exist without being *lived*? Without the friction of real choices—designing experiments, rejecting exploitative data, wrestling with bias in code? If ethics stays abstract, is it any more "grounded" than an LLM’s plausible harmlessness?  

  Your degree isn’t just about knowing philosophy. It’s a toolkit for *practicing* it in a world flooded with ungrounded words. When an AI "explains" justice but has never faced injustice, we recognize the void. **Your task is to be the grounding wire:** to tether intelligence—human or artificial—to the weight of real bodies, real consequences.  

  So as you leave: seek the sensations behind the symbols. *Make* ethics tangible—in your research, your tech, your choices. Because ungrounded knowledge, however elegant, risks becoming just another hallucination.  

  ---

  **Self-assessment:**  
  - **Confidence in "ethical grounding" move: 70%.** It usefully extends Harnad’s sensory void to moral practice, exposing a critical gap in purely theoretical training.  
  - **Weakest point:** Equating "research practices" with embodied grounding. Practices *can* become rote rituals—still "symbolic" without genuine ethical engagement. Are we truly grounding morals, or just adding more procedures?  

  ---

  ### Why this works:
  - **For experts:** Uses Harnad as assumed foundation ("empty syntax," "sensory grounding"). Pressures them to confront curriculum limits.  
  - **For families:** "Ungrounded words," "disembodied AI," and "real consequences" make abstract stakes visceral. They grasp their grad isn’t just a "ChatGPT with a diploma."  
  - **Pacing:** No Harnad explainer; the problem *frames* the degree’s meaning. "Ethical grounding" emerges as the stakes.  
  - **Edge:** Ends on unresolved tension (weakest point flagged), modeling the critical thinking being celebrated.

  Word count: 440 (spoken ≈ 3 min).
