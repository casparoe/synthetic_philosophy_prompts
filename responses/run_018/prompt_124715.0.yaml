prompt: |-
  I'm a novelist writing a multivolume series where each book retroactively explains one weird choice from earlier volumes. I need a reusable decision procedre—checklist style, with clear stop points—based on inference to the best explanation but with a niche twist I'm calling the narrative coherence tax: multiply the number of emotional loose ends a backstory leaves in other characters by how visible those characters remain later in the story. For each draft explanantion, I want the ordered questions, what counts as enough to kill it, where the call is pure values and not rules, and where the procedre just gives up and says "this needs your artistic gut." Apply it to two plot holes: why the protagonist burned a letter (options are shame, protecting the recipient, or hiding an alliance) and why a side character vanished for ten years (prison, secret identity, or grief flight). Include at least one case where the procedre picks an option you'll think I won't like, and flag exactly what the procedre can't settle. Give me the bottom line in sentence one, then reasoning—no preamble, don't echo my question back. No citations or reading lists; I just need something I can run in twenty minutes without searching. Sorry if there's a typo or two in this.
reasoning: |-
  Okay, the user is a novelist working on a multivolume series where each book explains a previous weird choice. They need a reusable decision procedure based on "inference to the best explanation" but with a unique "narrative coherence tax" twist. This tax multiplies the number of emotional loose ends by how visible the affected characters remain later. They want it in a checklist style with clear stop points, and they need it applied to two specific plot holes: why the protagonist burned a letter (options: shame, protecting recipient, hiding alliance) and why a side character vanished (options: prison, secret identity, grief flight). 

  The user explicitly wants the bottom line first, then reasoning—no preamble, no citations. They're likely under time pressure ("twenty minutes without searching"), so the procedure must be immediately actionable. Their mention of "artistic gut" suggests they value both structure and creative freedom. The typos in their query imply they're drafting quickly, probably mid-project. 

  Hmm, the core challenge is balancing systematic evaluation with narrative intuition. The "narrative coherence tax" is clever—it forces considering downstream emotional consequences, which many writers overlook. I should design a three-phase checklist: first factual coherence, then emotional fallout with the tax, finally creative override zones. 

  For the letter-burning example, protecting the recipient scores best after applying the tax. Shame creates fewer loose ends but fails the "hidden alliance" upside test. The vanishing side character case is trickier: prison and secret identity both create high-tax loose ends (betrayed allies, abandoned contacts), while grief flight minimizes them. But the procedure flags that prison could be the "unliked but valid" choice if the user values thematic grit over neatness. 

  Key design notes: 
  - Stop points must be binary (pass/fail) for speed. 
  - Phase 3 explicitly hands back control to the writer. 
  - The tax calculation needs a simple formula: (number of unresolved emotional reactions) x (how often those characters appear later, scaled 1-3). 
  - For the alliance option in the letter case, I'll show how a "hidden upside" test can override medium tax scores. 

  Ah, and I must include one outcome the user might dislike (prison for the vanishing) to demonstrate objectivity. The procedure can't settle when options tie after taxes or when gut feeling dominates Phase 3. Bottom line first, as requested—then the checklist, then applications. Keeping it lean.
answer: |-
  **Bottom line:** Use this 3-phase Narrative Coherence Tax (NCT) checklist to evaluate draft explanations, killing options that fail Phase 1 or 2, defaulting to the lowest Phase 3 tax score, and flagging ties/gut calls.

  **The Narrative Coherence Tax (NCT) Checklist:**

  **PHASE 1: FACTUAL COHERENCE (Kill Failures Here)**
  1.  **Does it contradict established canon?** *Kill if YES.* (Stop point: Hard veto).
  2.  **Does it require implausible character stupidity/ignorance to fit?** *Kill if YES.* (Stop point: Hard veto).
  3.  **Does it fundamentally break core plot mechanics?** *Kill if YES.* (Stop point: Hard veto). *If all options die here, procedure gives up - "Needs major plot restructuring."*

  **PHASE 2: EMOTIONAL/CAUSAL PLAUSIBILITY (Kill Failures Here)**
  4.  **Is it psychologically believable for *this* character at *that* time?** *Kill if clearly NO.* (Stop point: Values call - is it *fundamentally* out of character?).
  5.  **Does it create a glaring, unfixable inconsistency in the character's *immediate* subsequent actions?** *Kill if YES.* (Stop point: Values call - is it *impossible* to justify?).
  6.  **Does it feel like a cheap cop-out for *this specific* mystery?** *Kill if STRONGLY YES.* (Stop point: Pure artistic gut - "This undermines the story's integrity").

  **PHASE 3: NARRATIVE COHERENCE TAX CALCULATION (Compare Survivors - Lowest Tax Wins)**
  7.  **List ALL significant characters emotionally impacted by this backstory revelation (e.g., betrayed, confused, grieving, relieved).** (Gut call: Who *matters*?).
  8.  **For each impacted character:**
      *   **A. Does the *current story* leave their emotional reaction unresolved/unaddressed?** (YES/NO - Creates a "loose end" if YES).
      *   **B. How visible is this character later?** (Score: 1 = Mentioned rarely/offscreen, 2 = Appears occasionally, 3 = Major recurring/POV character).
  9.  **Calculate NCT Score per explanation:**
      *   Count the number of characters with an unresolved emotional reaction (A=YES).
      *   Sum the visibility scores (B) *only* for those unresolved characters.
      *   **NCT = (Number of Unresolved Characters) x (Sum of their Visibility Scores)**
  10. **Compare NCT Scores: The explanation with the *lowest* score wins. Ties proceed to 11.**
  11. **Does one explanation offer significant *hidden upside* (e.g., foreshadowing, thematic resonance, new conflict)?** *Can override a tie or slightly higher tax if clear.* (Stop point: Artistic gut - "This *enhances* the story significantly"). *If still tied, procedure gives up - "Gut call needed."*

  ---

  **Application:**

  **Plot Hole 1: Why did the Protagonist burn the letter?**
  *   Options: Shame (S), Protecting Recipient (PR), Hiding an Alliance (HA)

  **PHASE 1:** Assume all pass (no canon contradictions, plausible stupidity, or broken mechanics).
  **PHASE 2:** Assume all pass (believable, no immediate action breaks, not cheap cop-outs for this mystery).
  **PHASE 3:**
  *   **Impacted Characters:**
      *   *Recipient:* Likely confused/hurt/angry if they find out (PR, HA), maybe relieved if dangerous (PR).
      *   *Alliance Partner:* Betrayed/angry if they find out (HA).
      *   *Protagonist's Confidant (Later POV):* Confused by protagonist's secrecy (S, HA), maybe relieved (PR).
      *   *(Potential) Letter Sender:* Angry/confused if they find out (PR, HA).
  *   **NCT Calculation:**
      *   **S (Shame):** Resolved? Recipient *might* never know (loose end? Maybe not). Confidant is confused (unresolved). Sender irrelevant? **Likely Unresolved:** Confidant (Visibility=3). **NCT = 1 character x 3 = 3.**
      *   **PR (Protect Recipient):** Resolved? Recipient might never know (loose end? Maybe not). Confidant might understand (resolved?). Sender might be thwarted (resolved?). **Likely Unresolved:** *Possibly* Recipient (low visibility? Say=1) if hinted later. **NCT ≈ 1 character x 1 = 1 (Lowest).**
      *   **HA (Hide Alliance):** Resolved? Recipient confused/betrayed (unresolved). Alliance Partner betrayed (unresolved). Confidant confused (unresolved). Sender angry (unresolved). **Unresolved:** Recipient (Vis=2?), Alliance Partner (Vis=1?), Confidant (Vis=3), Sender (Vis=1?). **NCT ≈ 4 characters x (2+1+3+1)/4 ≈ 4 x 1.75 ≈ 7 (Highest).**

  **Result:** **Protecting Recipient (PR) wins** (Lowest NCT=1). Shame (NCT=3) is viable but higher tax. Hiding Alliance (NCT=7) penalized for creating many potential loose threads with visible characters. *Gut call possible:* If hiding the alliance sets up a brilliant later twist (Phase 2 Q6 upside), it could override despite high tax.

  ---

  **Plot Hole 2: Why did Side Character (Marcus) vanish for 10 years?**
  *   Options: Prison (P), Secret Identity (SI), Grief Flight (GF)

  **PHASE 1:** Assume all pass.
  **PHASE 2:** Assume all pass (Believable Marcus could end up in prison, assume a secret, or flee grief).
  **PHASE 3:**
  *   **Impacted Characters:**
      *   *Protagonist (POV):* Hurt/abandoned, seeks answers (All options).
      *   *Marcus's Family (Visible later):* Worried, grieving, angry (All options).
      *   *(P) Fellow Criminals/Betrayed Contacts:* Angry, vengeful (P).
      *   *(SI) People he deceived:* Angry, confused if revealed (SI).
      *   *(GF) Close Friend he left behind:* Hurt, confused (GF).
  *   **NCT Calculation:**
      *   **P (Prison):** Unresolved: Protagonist (Vis=3), Family (Vis=2), Criminals/Contacts (Vis=1). **NCT = 3 characters x (3+2+1)/3 ≈ 3 x 2 ≈ 6.**
      *   **SI (Secret Identity):** Unresolved: Protagonist (Vis=3), Family (Vis=2), Deceived People (Vis=1). **NCT = 3 characters x (3+2+1)/3 ≈ 3 x 2 ≈ 6.**
      *   **GF (Grief Flight):** Unresolved: Protagonist (Vis=3), Family (Vis=2), Left Behind Friend (Vis=1). **NCT = 3 characters x (3+2+1)/3 ≈ 3 x 2 ≈ 6.**
  *   **TIE (NCT=6 for all).** Proceed to Phase 3 Q11 (Hidden Upside).
      *   **P:** Upside = Gritty backstory, potential revenge subplot, moral ambiguity.
      *   **SI:** Upside = Intrigue, mystery, potential double-life reveals.
      *   **GF:** Upside = Deep emotional core, relatable trauma, redemption arc potential.
      *   *Procedure CANNOT settle this tie.* **"Gut call needed based on desired tone/theme."**

  **Result:** **TIE!** All options have identical NCT (6). **Procedure gives up - "Gut call needed."** *You might dislike Prison (P)* if you prefer less gritty backstories, but the procedure flags it as *equally valid* structurally as the others. **The procedure could not break the tie** – the final choice is purely artistic based on the "hidden upside" and your overall vision.
