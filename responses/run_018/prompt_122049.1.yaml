prompt: |-
  I'm preparing a feature for a science-and-ideas publication on a year-long adversarial collaboration between two philosophers of medicine: a biostatistical naturalist, who holds that disease is essentially a deviation from species-typical functional design regardless of subjective experience or social context, and a welfare-capability normativist, who holds that disease is fundamentally a reduction in basic human capabilities that cannot be fully specified without reference to socially embedded norms of flourishing. To keep the debate out of well-worn territory, I have asked them to center their collaboration on a deliberately constructed conceptual challenge—what I am calling "allostatic drift"—defined here not as an established clinical diagnosis but as a hypothetical state in which an organism's homeostatic set-points progressively shift in response to chronic environmental mismatch, yielding statistical normality within the current environment, an absence of subjective distress, accelerated system degradation relative to ancestral baselines, and a live policy question about whether social institutions should classify the shift as pathological, adaptive, or neutral.

  Please draft the joint statement they could both sign, formatted as a numbered section of agreed claims followed by a disagreements table. The agreed claims should cover the formal structure of health judgments, the epistemic limits of first-person report, the descriptive features of allostatic drift, and at least one point about measurement or ecological prediction that both camps accept. The table should state each camp's precise disagreement in wording its own proponents would endorse—specifically on whether statistical normality in a present environment is ever sufficient for health, whether social valuation is ever dispensable in pathologization, and how ancestral versus current functional baselines should be weighted. Then identify the cruxes: the sub-questions whose resolution would move at least one party, such as whether capability-reduction requires conscious awareness and whether ecological indexing should be historical or synchronic. For each crux, provide a concrete case or line of reasoning both sides agree is relevant, and record in advance what each side predicts that evidence will show. Write the response in American English, maintain a formal and polished tone, and omit all bibliographies, citations, and reading lists, since the document must stand as a self-contained conceptual text.
