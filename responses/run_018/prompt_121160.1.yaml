  First, unpack Descartes' actual move. In Meditation II, he says "I am, I exist" must be true when thought. But by the wax argument's end, he concludes this "I" is a "thinking thing" (res cogitans). The jump happens fast. The user spots this correctly—Descartes assumes "thought implies thinker" as self-evident. But is it? 

