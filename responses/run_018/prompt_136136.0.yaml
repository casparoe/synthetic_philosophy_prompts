  First, I need to parse the core of the disagreement. The lexicalists argue that beyond a certain suffering threshold, no amount of pleasure can justify it, treating pain and pleasure as incommensurable across that line. The continuous-scale theorists see it as a steep but continuous trade-off, modeled with a unified utility function. The user suspects it's not about empirical facts but different interpretations of "commensurability."

