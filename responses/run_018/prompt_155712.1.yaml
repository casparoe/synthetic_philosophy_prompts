  Here's a disambiguated menu of theses embedded in "nationalism invented the nation," with verdicts, evidentiary requirements, and their utility against primordialism. The archival threshold question is addressed explicitly.

  ---

  ### **Thesis Menu: Disambiguating "Nationalism Invented the Nation"**

  #### **1. Ontological Denial**  
  *Claim*: No pre-modern collective satisfied the necessary/sufficient conditions for "nationhood" (e.g., mass solidarity, standardized culture, territorial sovereignty aspirations).  
  **Verdict**: **Overstated but defensible in modified form**.  
  - **Evidence**: Demographic/linguistic data (e.g., pre-modern linguistic fragmentation, localized loyalties); institutional records (absence of mass education/censuses); archives (lack of popular documents expressing "national" identity).  
  - **Anti-primordialist utility**: **Strong** if proven, but risks presentism.  
  - **Archival Threshold**: Secretly central. Relies on equating "nation" with *standardized, documented* identity. If oral/ritual communities count as nations, this thesis collapses.  

  #### **2. Epistemic Construction**  
  *Claim*: Collective identity is *retrospectively* constructed through narratives (myths, histories), symbols, and practices, not discovered.  
  **Verdict**: **Defensible** (Anderson, Hobsbawm).  
  - **Evidence**: Archival/textual analysis (changing historical narratives; invented traditions); linguistic shifts (redefinition of terms like "patrie").  
  - **Anti-primordialist utility**: **Core**. Directly undermines claims of timeless essence by showing identity is actively shaped.  
  - **Archival Threshold**: **Irrelevant**. Works for oral societies (e.g., bardic traditions constructing heroic pasts).  

  #### **3. Functional State Creation**  
  *Claim*: The modern state’s standardizing apparatus (schools, conscription, censuses) *creates* cultural homogeneity, which is then misrepresented as pre-existing.  
  **Verdict**: **Defensible** (Gellner’s "high culture" thesis).  
  - **Evidence**: Institutional archives (education/census policies); demographic data (linguistic assimilation rates); economic records (industrialization’s role).  
  - **Anti-primordialist utility**: **Potent**. Exposes the state’s role in manufacturing uniformity.  
  - **Archival Threshold**: **Relevant but not absolute**. State tools amplify standardization, but ritual/oral groups can sustain identity without them.  

  #### **4. Normative Illegitimacy of Essentialism**  
  *Claim*: Ethnic essentialism is politically illegitimate *because* nations lack ancient roots.  
  **Verdict**: **Conceptually muddled**. Illegitimacy doesn’t follow from modernity (e.g., human rights are modern but legitimate).  
  - **Evidence**: Philosophical/political theory arguments; historical cases of legitimate modern nations.  
  - **Anti-primordialist utility**: **Weak**. Confuses ontology with ethics. Primordialists can concede modernity but still value identity.  

  #### **5. Causal Direction**  
  *Claim*: Nationalist ideology/movements temporally *precede and create* the institutional framework of the nation-state.  
  **Verdict**: **Contextually defensible** (e.g., Germany, Italy) **but not universal** (e.g., France’s state-led nationalism).  
  - **Evidence**: Archival (early nationalist texts/pamphlets); institutional (state adoption of nationalist programs).  
  - **Anti-primordialist utility**: **Moderate**. Shows political institutions are effects, not causes, of nationalist fervor.  

  ---

  ### **Which Theses Actually Undercut Primordialism?**  
  - **Strongest**: **Epistemic Construction** and **Functional State Creation**.  
    - They reveal nations as *dynamic projects*, not passive inheritances, regardless of pre-modern group existence.  
  - **Weakest**: **Normative Illegitimacy** (muddled logic) and **Ontological Denial** (vulnerable to counterexamples).  

  ### **The Archival Threshold: Does It Hold?**  
  - **Yes, but partially**: If "nation" requires *mass, standardized* identity (per Gellner/Anderson), bureaucratic tools are indispensable. Oral/ritual communities may have *ethnicity* but lack the scale/political ambition of nations.  
  - **Anti-primordialist impact**:  
    - **With threshold**: Ontological Denial gains force—nations *are* modern fabrications.  
    - **Without threshold**: Epistemic/Functional theses still undermine primordialism by showing identity is *constructed*, not primordial. Ritual repetition is still active curation, not passive continuity.  

  ### **Verdicts for Your Debate**  
  | Thesis                | Verdict           | Anti-Primordialist Punch | Survives Without Archives? |  
  |-----------------------|-------------------|--------------------------|----------------------------|  
  | Ontological Denial    | Overstated        | Moderate (if proven)     | **No**                     |  
  | Epistemic Construction| **Defensible**    | **Strong**               | **Yes**                    |  
  | Functional Creation   | **Defensible**    | **Strong**               | Partial (weakened)         |  
  | Normative Illegitimacy| Muddled           | Weak                     | Irrelevant                 |  
  | Causal Direction      | Contextual        | Moderate                 | Yes                        |  

  ### **Conclusion**  
  The slogan’s core anti-primordialist power lies in the **Epistemic** and **Functional** theses, which demonstrate that nations are made, not born. The Ontological Denial thesis—often the implied "punchline"—relies on an archival threshold that collapses if pre-modern groups with political self-awareness are accepted as "nations." However, even without this threshold, the *constructedness* of identity (via narrative/state action) remains fatal to primordialism. **Bring the Epistemic and Functional arguments to your debate**; they sidestep endless quarrels about "how ancient is ancient enough?" by focusing on *how* nations are actively forged.  

  > "Nations do not make states and nationalisms but the other way round."  
  > — Ernest Gellner (functional thesis)  
  >   
  > "Communities are to be distinguished... by the style in which they are imagined."  
  > — Benedict Anderson (epistemic thesis)
