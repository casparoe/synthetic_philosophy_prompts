answer: |-
  ### Point-by-point adjudication
  **First member's initial claim (Rejecting LEM is like switching measurement systems):** *Partially right (3/5)*. The analogy captures intuitionism's stricter proof standards but ignores how it redefines truth itself. Intuitionism ties truth to provability, altering what "exists" mathematically—not just how we record it. Classical existence claims rely on non-constructive truth-makers, which intuitionism rejects as ontologically empty.  

  **Second member's objection (IVT failure reveals ontological divergence):** *Mostly right (4/5)*. Correct that constructive IVT requires explicit continuity to locate roots, exposing classical mathematics' willingness to assert existence without procedural access. This isn't just about proof strength; it reflects divergent conceptions of what constitutes a valid mathematical object. However, overstates by implying classical objects are "ghostly"—they function consistently within classical frameworks.  

  **First member's reply (Same objects, different epistemic routes):** *Mistaken (2/5)*. Assumes classical and intuitionistic objects are identical. But intuitionism only accepts objects that can be constructed, while classical mathematics permits objects whose existence derives solely from logical axioms (e.g., uncomputable reals). This isn't merely epistemic—it restricts the *domain* of objects.  

  **Second member's "ghost-objects" argument:** *Partially right (3/5)*. Correct that non-constructive proofs lack identification procedures, making reference pragmatically inert. However, labeling them "ghost-objects" conflates ontology with epistemology. Classical objects have structural properties (e.g., in set theory) that intuitionism dismisses but which sustain mathematical practice.  

  **First member's physics analogy (Unobservable entities in QM):** *Clearly mistaken (1/5)*. False equivalence. Quantum entities yield testable predictions even when unobservable (e.g., electron interference patterns). Non-constructive existence proofs (e.g., a "root" from IVT without an algorithm) offer no comparable path to verification or application. The analogy ignores intuitionism's semantic constraint: meaning requires constructive potential.  

  **Second member's rebuttal (Predictive frameworks vs. non-constructive proofs):** *Clearly right (5/5)*. Spot-on. Physical theories embed unobservables in networks of empirical consequences, while non-constructive proofs lack any mechanism to "cash out" abstract existence claims. This exposes classical mathematics' disconnect from verificationist semantics.  

  ### Shared blind spots  
  Both parties miss that intuitionism fundamentally redefines logical *meaning*, not just ontology or proof rigor. For intuitionists, rejecting LEM alters the truth-conditions of statements: "P ∨ ¬P" is invalid because truth requires verification (Brouwer), not abstract possibility. Conversely, classical mathematics treats truth as mind-independent, making existence proof-agnostic. This semantic gap undermines direct comparisons—they aren't debating within a shared framework. Both also overlook intermediate positions (e.g., Bishop's constructive mathematics, which avoids Brouwer's idealism but accepts intuitionistic logic). Focusing solely on IVT and physics narrows the debate; broader examples (e.g., uncomputable functions or choice sequences) better highlight ontological divergences.  

  ### Overall verdict  
  The second member's view is stronger: intuitionism *does* restrict mathematical ontology, not merely proof standards. Classical existence claims (e.g., IVT roots) rely on platonic objects whose "being" is independent of construction, while intuitionism demands that objects be mentally accessible. The physics analogy fails because non-constructive proofs lack empirical accountability, rendering classical "existence" a formal abstraction without procedural substance. However, the first member is right that classical mathematics remains coherent and useful within its own ontological commitments. Thus, intuitionism restricts ontology relative to classical frameworks but does not "expose ghosts"—it establishes a competing paradigm where existence entails constructibility. The core issue is semantic: differing definitions of truth and reference, not merely epistemic caution.
