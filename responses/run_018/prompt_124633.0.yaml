  **Key Distinctions & Blurred Lines:**

  1.  **Distributed Self (Field View) vs. Unified Field Self:** The core tension. Does the distributed field *constitute* multiple potential centers (Distributed Self) or merely *scaffold* one emergent center (Unified Field Self)? **Blur Risk:** Hard to empirically distinguish if the "field" is highly integrated.
  2.  **Narrative Herd vs. Corporatist Self:** Both accept plural centers. Herd demands temporal coherence for unity, Corporatist allows incoherence. **Blur Risk:** Where does "tight synchronization" end and "loose coalition" begin? Is coherence binary or scalar?
  3.  **Narrative Conservationist vs. Phoenix Self:** Both deal with amnesiac reset. Conservationist sees continuity of center (like reactivating a formatted hard drive), Phoenix sees new center with legacy resources. **Blur Risk:** If "core mass" is undefined (Conservationist), it collapses into Phoenix. If "inheritance" lacks content (Phoenix), continuity is illusory.
  4.  **Episodic Self Revisionism vs. Corporatist Self:** Both accept incoherence. Episodic emphasizes *temporal* fragmentation within one locus, Corporatist emphasizes *spatial* fragmentation across loci. **Blur Risk:** A single fragmented agent could be seen as either a temporal "coalition" (Episodic) or a spatial "boardroom" (Corporatist) of sub-agents.

  **Notable Positions Captured:**

  *   **Corporatist Self:** Self as a boardroom of competing narrative sub-centers. Awkward: Who fires the CEO? (Agency problem).
  *   **Episodic Self Revisionism:** Self is revised episode-by-episode, past/future are fictions. Awkward: Personal identity over time evaporates.
  *   **Phoenix Self:** Self annihilated and reborn with each narrative rupture. Awkward: Responsibility for pre-reset actions.
  *   **Narrative Conservationist:** Deep narrative structure survives content erasure. Awkward: Defining the non-content core.
  *   **Distributed Self (Field View):** Self is an emergent property of a network's narrative field. Awkward: Locating moral responsibility/experience.
  *   **Unified Field Self:** Distributed inputs feed ONE narrative center. Awkward: Explaining robustness against field fragmentation.
  *   **Narrative Herd:** Plural centers *only* unify under perfect coherence. Awkward: Denying self-status to messy collectives.

  **How it Catches Subtle Differences:**

  *   **"Self is fiction but behaves like a center":** Episodic Self Revisionism (fiction) OR Corporatist Self (fiction of unity) OR Phoenix Self (fiction of persistence).
  *   **"Self is real but splittable":** Distributed Self (Field View) OR Narrative Herd (if coherence maintained) OR Corporatist Self (by design).

  This tree forces confrontation with the implications of distributing narrative gravity, revealing positions often obscured by the physicalism/dualism debate. The "awkward commitments" highlight the conceptual costs of each node. Use it to spark debate about coherence, agency, and persistence in a post-Dennettian landscape.
