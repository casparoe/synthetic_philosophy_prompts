  **Scene One: The Last Bloodless Duel**  
  Lord Aris Thorne accepts the Reckoning chalice from his rival, Lady Veyra. Under the vaulted Guildhall ceiling, they trade barbs honed over weeks: Thorne mocks her family’s waning fortunes; Veyra implies his war record is inflated. The ritual demands wit, not wounding, but Veyra’s final quip – “Your heir’s merchant bride buys legitimacy, not blood” – draws gasps. Thorne, rigid with fury, completes the formal rebuttal, preserving "honor." Yet as the crowd murmurs, young Scholar Elara notes Thorne’s whitened knuckles and Veyra’s tremor. *"Harmless?"* Elara whispers to her mentor. *"He hasn’t slept since the challenge was issued. She’s ruined her voice practicing. What honor feeds on such sickness?"* Her mentor scoffs: *"Sentiment. It keeps the peace."* But Elara sees only brittle tension, not peace.

  **Scene Two: The Ledger Outweighs The Laurel**  
  Merchant-Captain Rhys faces Trade Master Kellan in the bustling Exchange courtyard. Kellan breached contract; Rhys demands Reckoning, invoking the old right. Kellan, pale but defiant, accepts. Rhys delivers cutting jabs about Kellan’s "peasant cunning." But Kellan’s counter – a crude insinuation about Rhys’s loyalty during the Blockade – falls flat, lacking wit. Rhys "wins." Walking away, he hears whispers: *"...uncouth..." "...lost the Lyrex account over this spectacle..." "...who trades with a brawler?"* At his counting house, his chief clerk presents resignations from two fastidious clerks. *"It’s the... atmosphere, sir,"* one mutters. Rhys stares at the Reckoning laurel on his desk, then at the plummeting stock report. The laurel feels like lead.

  **Scene Three: The Hollow Victory**  
  Young duelist-in-training, Jax, triumphs spectacularly over the arrogant Lord Berin. Jax’s insults are razor-sharp, exposing Berin’s plagiarized poetry and falsified lineage. The crowd is silent. Jax expects acclaim, patronage, perhaps a knighthood. Instead, he finds turned backs. At the Officers’ Academy ball, where Reckoning masters once held court, Jax stands alone. A group of junior officers snickers nearby. *"Did you hear Berin? Pathetic. But Jax... playing that old game?"* one scoffs. *"Like polishing rusted armour,"* another laughs. *"Real men build bridges now, not barbs."* Jax’s victory medal feels cold, absurd. The prestige he trained for has evaporated; the honor code it upheld is dust.

  **Scene Four: The Post-Hoc Justification**  
  Elara, now a Council Archivist, presents her treatise *"The Calculus of Harm: Reckoning's Social Cost"* to the Reform Committee. She details broken alliances, suicides, economic losses, fractured families. Councilor Veyra (once Lady Veyra) listens intently. Kellan, now a wealthy Guildmaster, nods grimly. Lord Thorne, however, waves a dismissive hand. *"Fine work, Archivist,"* he rumbles, *"but spare us the moral arithmetic. We abandoned the Reckoning because it became bad business and bad taste. All this talk of 'harm'? Useful embroidery on a decision already made. My warehouses need partners who talk contracts, not insults."* Veyra and Kellan exchange a glance but say nothing. Elara’s meticulously reasoned ethical arguments are acknowledged, then sidelined as mere decoration for pragmatism.

  **Scene Five: The Lingering Echo**  
  A decade later, two bureaucrats clash over a disputed canal route in a stark, efficient Ministry chamber. Their debate is heated, technical. Finally, Senior Surveyor Milo snaps: *"That proposal reeks of the same short-sightedness that doomed the Southern Aqueduct!"* His rival, Engineer Lira, flinches – the phrase echoes the ritual cadence of a Reckoning challenge's opening salvo. An awkward silence falls. Milo instantly stiffens, colour rising. *"My... apologies, Engineer Lira,"* he stammers, his voice suddenly formal, clipped. *"That was... inappropriate phrasing. I retract the sentiment."* Lira nods curtly, accepting the retraction, eyes flicking to the neutral ground between them. The argument resumes, colder, more precise. The old formula – insult, recoil, formal retraction – lingers like a ghost in the procedural language, an empty shell stripped of fury and honor alike.

  *(The narrative leans on shifting economic interests as the primary driver of the Reckoning's extinction, though it would shift towards the collapse of the honor code if evidence showed prestige evaporated before economic penalties became severe, or towards rational harm arguments if Elara's critiques demonstrably mobilized initial reform efforts before economic concerns dominated the discourse.)*
