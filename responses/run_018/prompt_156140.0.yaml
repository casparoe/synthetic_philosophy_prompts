answer: |-
  Here is the diagnostic decision tree:

  **First Split:** Does artifact identity *always* require continuity of at least some original material parts?
  *   **Yes**:
      *   **Branch:** Can functional/design continuity substitute when material continuity is broken?
          *   **No →** *Materialism (e.g., Chisholm)*. Awkward: Must deny the institutional identity persists if registry/bureaucracy outlives *all* original parts, regardless of function or records.
          *   **Yes →** **Branch:** How handle two competing vessels (repaired ship vs. reassembled ship)?
              *   Pick one as original → *Unnamed (Hybrid)*. Awkward: Wholesale instantaneous reconstruction using original parts might inherit identity over gradual repair with none, contradicting materialist premise.
              *   Plural identity → *Unnamed (Materialist Pluralism)*. Awkward: The same institutional identity (registry) must simultaneously apply to two distinct physical objects, violating institutional singularity.
              *   Dissolve question → *Unoccupied* (Incoherent: Requires material but denies its decisive role when conflict arises).
  *   **No**:
      *   **Branch:** Can functional/design continuity substitute for material continuity?
          *   **Yes →** *Functionalism*. Awkward: The reassembled original-planks ship is a mere replica/impostor, even if functionally identical and materially original; institutional identity is derivative.
          *   **No →** **Branch:** How handle two competing vessels?
              *   Pick one → *Conventionalism (Social/Institutional)*. Awkward: Identity persists solely via registry/charter, even if *every* physical part is replaced gradually *and* the original planks are reassembled elsewhere – both could potentially be "the ship" depending on arbitrary assignment.
              *   Plural identity → *Unnamed (Plural Conventionalism)*. Awkward: Institutional systems (like registries) typically demand singularity, making plural identities practically unsustainable.
              *   Dissolve question → *Mereological Nihilism/Four-Dimensionalism*. Awkward: Strictly, the original ship ceases to exist after the first plank is replaced; institutional persistence is a fiction about distinct temporal parts.

  **Convergences & Gaps:**
  *   **Convergence:** Functionalists and Materialists (who reject functional substitution) both force choosing one competitor, but for different primary reasons (function vs. matter).
  *   **Unoccupied:**
      *   "No Material Needed" + "Function Cannot Substitute" + "Pick One" lacks a standard name (unexplored/unattractive: rejects both matter and function without clear criteria).
      *   "Material Needed" + "Function Can Substitute" + "Dissolve" is incoherent (requires matter but ignores its conflict).
