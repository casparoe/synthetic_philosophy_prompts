  Structure the tree so the first split asks whether artifact identity requires continuity of at least some original material parts. From there branch by whether functional and design continuity can substitute for material continuity; then by whether the existence of two competing vessels (the continuously repaired one and the reconstructed one) forces selecting one, permits plural identity, or dissolves the question altogether. At each leaf, provide: the combination of answers that reaches it; the position's standard name if one exists, otherwise 'unnamed'; and one sentence stating its most awkward commitment—particularly commitments about institutional persistence or about cases where every physical component is replaced but the registry entry is never amended.

