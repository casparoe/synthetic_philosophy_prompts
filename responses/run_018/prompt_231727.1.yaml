prompt: |-
  I've been asked to sketch a two-year research agenda for a university public-policy center, and the hook is a mid-sized country thats currently loan-heavy and considering a move toward something like the German or Nordic tuition-free model. We keep going in circles on headline numbers — student debt in the US, graduate earnings premia in Denmark, whats spent per student in the UK — while the actual policy choice seems to hinge on stuff that is genuinely under-settled. If you had three or four studies to run in those two years, which open questions in the comparison between tuition-free systems (Germany and the Nordics) and loan-financed ones (the US and the UK) would you pick, and in what order? Give me a defended ordering, not a survey: state the criteria you're weighing (tractability with existing cross-country data, neglectedness, how many downstream design choices hinge on the answer), say how you'd trade them off, and tell me what would make you reshuffle the ranking. Also flag at least one question that looks important but you wouldnt fund because it would take too long or wouldnt change the actual decision. I especially want to know which questions are upstream of the others — for instance, is the risk-sharing property of income-contingent loans the crux, or does the enrollment and completion response to prices dominate, or is it something I'm not listing?
