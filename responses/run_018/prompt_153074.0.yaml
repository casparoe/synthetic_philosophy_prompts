prompt: |-
  Design a 75-minute structured role-play for a seminar of about 16 upper-level students in political philosophy or comparative ethics. The participants should come away seeing that the line between corruption and legitimate reciprocity is not just a matter of applying a universal Western standard, but depends on whether an exchange is visible, role-embedded, and convertible into material advantage—features that can pull in opposite directions within the same institutional rules.

  Center the activity on a fictional municipal planning board in a post-colonial city-state, Mariká, whose formal regulations recognize “kinship credits”: social obligations accrued through neighborhood and family ties that can be registered with the board but carry unwritten norms about when they may be drawn upon to secure land-use variances, expedited permits, or exemptions from density rules. Invent the mechanics concretely—three types of variance (residential height, commercial zoning, heritage demolition), a token economy of reputation points and future-obligation cards, and a public audit mechanism triggered by anonymous complaints—so that the rules themselves generate the tension, not a facilitator’s framing.

  Structure three decision rounds with these roles: four board members (each with a different institutional background—elected official, appointed planner, community elder, legal auditor), six petitioners (with different credit portfolios and hidden private obligations), and six observers who hold partial information and can file audit triggers. Between rounds, reveal new information: first, only formal applications; second, the kinship-credit registers; third, which petitioners have undisclosed reciprocal debts to board members. The payoff scheme should use non-monetary stakes—reputation tokens that determine who can serve on future boards, obligation cards that must be honored in later rounds, and a collective “city legitimacy” score that collapses if too many hidden exchanges are exposed—so that honoring private reciprocity and maintaining public legitimacy genuinely conflict.

  The rules must be arranged so that in round one students feel confident labeling moves as clean or corrupt, but by round three they discover that the same structural move—a petitioner drawing registered kinship credits to secure a variance—functions simultaneously as legitimate social reciprocity (visible, role-based, long-term) and as hidden exclusion of outsiders who lack such credits. The auditor role should have incomplete information, forcing students to decide whether to investigate based on pattern rather than proof, so they experience the epistemic problem of detecting corruption without collapsing all reciprocity into bribery.

  In the debrief, map specific moments onto conceptual distinctions: deviation from formal rules versus violation of role-based reciprocity norms; discrete quid-pro-quo versus continuous obligation; whether Mariká’s formal rules actually encode a different separation between public office and private social life than Western anti-corruption frameworks assume. Be explicit about what will predictably fail the first time: students often collapse all credit-drawing into bribery once they learn about hidden obligations, or the auditor becomes purely punitive and destroys the reciprocity dynamics. Provide in-the-moment corrections—pause after round two to ask whether the exchange was hidden or structurally embedded, and remind the auditor that legitimacy requires distinguishing exclusion from exchange.

  Finally, include an honest note on the feature this activity cannot reproduce: the macro-structural and historical question of whether clientelist systems stabilize democratic representation over decades, or whether they inevitably erode universal citizenship. Supply that limitation verbally after the debrief, clarifying that the game isolates the conceptual boundary problem but cannot model long-term institutional decay. Do not require advance reading of named theorists, and do not ask for bibliographies, citations, or reading lists; the philosophical problem should emerge from the rules and the forced choices.
reasoning: |-
  We are designing a 75-minute role-play for 16 upper-level students. The goal is to explore the line between corruption and legitimate reciprocity, focusing on features like visibility, role-embedding, and convertibility to material advantage. The setting is a fictional municipal planning board in Mariká, a post-colonial city-state with a system of "kinship credits."

  Key elements:
  - Roles: 4 board members, 6 petitioners, 6 observers.
  - Three decision rounds, with new information revealed in each.
  - Non-monetary stakes: reputation tokens, obligation cards, and a collective "city legitimacy" score.

  Structure:
  1. Introduction (10 minutes)
  2. Round 1 (15 minutes)
  3. Round 2 (15 minutes)
  4. Round 3 (15 minutes)
  5. Debrief (20 minutes)

  Total: 75 minutes.

  Required Materials:
  - Role cards for each participant (16 total: 4 board, 6 petitioners, 6 observers)
  - Rules sheet for all
  - Game materials: 
    - Variance request forms (for petitioners)
    - Kinship credit registry (a shared document or board)
    - Reputation tokens (can be colored chips or cards)
    - Obligation cards (pre-written with specific future actions)
    - Audit trigger forms (for observers and board auditor)
    - A visible "City Legitimacy" meter (e.g., a scale from 0 to 10, represented by a slider or tokens in a jar)

  Game Mechanics:

  1. **Variances**: Three types with different stakes:
     - Residential Height (RH): Allows building one extra floor. Low impact.
     - Commercial Zoning (CZ): Allows a residential property to be used for a small business. Medium impact.
     - Heritage Demolition (HD): Allows demolition of a heritage-listed building for redevelopment. High impact.

  2. **Kinship Credits (KC)**:
     - Represent social obligations. Each petitioner starts with a set number (e.g., 3-5) and a portfolio indicating which board members they have credits with (based on family/neighborhood ties).
     - Credits are registered with the board and publicly visible (on the kinship credit registry) but the unwritten norms are that they can only be drawn for certain types of requests and in certain amounts per request.
     - Unwritten norms (explained in rules):
       - RH: Up to 2 credits per request.
       - CZ: Up to 3 credits per request.
       - HD: Not normally allowed to use credits (unless in extreme circumstances, which the board must debate).

  3. **Reputation Points (RP)**:
     - Board members earn RPs for decisions that are perceived as legitimate (i.e., not overturned by audit). They start with 5 each.
     - If a board member's decision is overturned by audit, they lose 2 RPs.
     - At the end, board members with at least 5 RPs can serve on future boards (a non-monetary incentive).

  4. **Obligation Cards**:
     - When a board member grants a variance to a petitioner, they may receive an obligation card from that petitioner (if the petitioner chooses to give one). This represents a future private obligation (e.g., "Help my cousin get a job at the city office").
     - Obligation cards are hidden and can be called in by the petitioner in a later round to influence a decision (by presenting it to the board member, who then must vote as requested or lose 2 RPs for breaking the obligation).

  5. **Audit Mechanism**:
     - Triggered by anonymous complaints from observers (or the auditor board member) using audit trigger forms.
     - Each observer has partial information (e.g., they know about one hidden obligation or one unwritten norm).
     - The auditor (one of the board members) can also initiate an audit but must use their own RP to do so (cost: 1 RP per audit).
     - When an audit is triggered, the facilitator reviews the decision and the rules. If the decision violated a formal rule, it is overturned and the board member loses 2 RPs. If it only violated an unwritten norm, it is noted but not overturned (but the city legitimacy may drop).
     - Overturned decisions result in the variance being denied.

  6. **City Legitimacy Score (CLS)**:
     - Starts at 8 (out of 10).
     - Drops by 1 for every overturned decision (due to scandal).
     - Drops by 0.5 for every audit that reveals a violation of unwritten norms (even if not overturned) because it erodes trust.
     - If CLS drops to 3 or below, the game ends early and the city is in crisis (collective loss).

  Roles:

  **Board Members (4)**:
  1. Elected Official (EO): Represents the public will. Starts with 5 RP. Can use political pressure (once per game) to force a decision without using credits, but if audited and overturned, loses 3 RP.
  2. Appointed Planner (AP): Expert in urban planning. Starts with 5 RP. Can provide technical justification to reduce the number of credits needed for a variance by 1 (once per round).
  3. Community Elder (CE): Holds many kinship credits. Starts with 5 RP and an extra 3 KC that they can assign to any petitioner at the start of each round (representing their influence). Must be cautious not to appear biased.
  4. Legal Auditor (LA): Tasked with ensuring formal compliance. Starts with 5 RP. Can initiate audits without paying the RP cost (free audits). But if they initiate an audit and no violation is found, the CLS drops by 0.5 for unnecessary disruption.

  **Petitioners (6)**:
  - Each has:
    - A set of variance requests (one per round, chosen from the three types).
    - A portfolio of kinship credits (with specific board members).
    - Hidden private obligations (to specific board members) that they can use to give obligation cards when they receive a variance.
    - Also, each has a goal: to get at least 2 variances approved.

  **Observers (6)**:
  - Each has a role card with partial information (e.g., "You know that petitioner X has a hidden obligation to board member Y", or "You know that using credits for HD is against unwritten norms"). They can submit anonymous audit triggers if they observe a decision that might violate what they know.

  Round Structure:

  **Round 1 (15 min)**:
  - Petitioners submit variance requests (without using kinship credits). They choose which type and to which board member they are addressing (but the whole board votes).
  - Board members vote on each request (by show of hands). Majority rules.
  - Observers watch and may submit audit triggers (if they see something that violates formal rules). Note: In this round, no credits are used, so the only violations would be if a board member votes on a request from a close relative without recusal (formal rule: must recuse if immediate family) or if the request clearly violates the zoning code (which the AP would know).
  - After voting, the facilitator resolves audits (if any). Adjust RP and CLS.
  - Reveal: Only formal applications were considered.

  **Round 2 (15 min)**:
  - Now kinship credits are introduced. Petitioners can choose to use their registered credits (up to the unwritten norms) to support their request. They must declare how many credits they are using and from which board member(s) (but note: the credits are with specific board members, so using a credit means that board member is expected to vote yes).
  - Board members vote. Note: A board member whose credit is being used is expected to vote yes (an unwritten norm) but can choose not to (at the cost of losing 1 RP for breaking the norm). They can also use their role abilities.
  - Observers can submit audit triggers (they now have more information and see if the unwritten norms are violated, e.g., using too many credits for a request, or using credits for HD).
  - After voting, resolve audits. Adjust RP and CLS.
  - Reveal: The kinship credit registers (so everyone sees the network of obligations).

  **Round 3 (15 min)**:
  - Now reveal hidden obligations: The facilitator reveals which petitioners have undisclosed reciprocal debts to which board members (from obligation cards given in previous rounds). These debts can be called in: a petitioner can present an obligation card to a board member to demand a yes vote (or the board member can refuse and lose 2 RP). Also, new obligation cards can be given in this round when a variance is granted.
  - Petitioners submit requests, using credits and/or obligation cards as they wish.
  - Board members vote, under the pressure of called-in obligations and kinship credits.
  - Observers can trigger audits (they may now see that a board member is voting because of an obligation card, which is hidden and not registered, so it violates the formal rule that all influences must be registered).
  - After voting, resolve audits. Adjust RP and CLS.

  Debrief (20 min):
  - Start by asking: What happened? How did their perceptions change from round 1 to 3?
  - Map moments to concepts:
    - Round 1: Clear-cut, formal rules. Easy to label as clean or corrupt.
    - Round 2: Kinship credits introduced. Highlight: visible, role-embedded, but now outsiders without credits are excluded. Is that corruption or legitimate reciprocity?
    - Round 3: Hidden obligations revealed. Now the same act (using credits) can be seen as both legitimate (if visible and within norms) and corrupt (if it hides a private obligation). The tension between reciprocity and public legitimacy.
  - Discuss:
    - When is reciprocity legitimate? (visibility, role-embedding, convertibility)
    - How did the auditor's incomplete information force decisions based on patterns?
    - How do Mariká's rules encode a different separation of public and private than Western frameworks?
  - Predictable failures and corrections:
    - After round 2, pause and ask: "Was the exchange hidden or structurally embedded? Did it exclude outsiders, or was it a legitimate use of social capital?"
    - Remind the auditor: "Your role is to distinguish between exclusion (which is built into the system) and hidden exchange (which violates the rules)."
  - Limitation: Note that the activity cannot model long-term institutional effects (e.g., whether clientelism stabilizes or erodes democracy over decades).

  Materials Preparation:

  - Role cards (16)
  - Variance request forms (at least 6 per round, so 18)
  - Kinship credit registry (a whiteboard or poster to record credits used)
  - Reputation tokens (for board members, 5 each to start)
  - Obligation cards (pre-written, about 10-15)
  - Audit trigger forms (for observers)
  - City Legitimacy Score tracker (a whiteboard with a scale)

  Let's write the role cards and rules sheet content.

  **Rules Sheet (for all participants)**:

  Mariká Municipal Planning Board: Rules of Operation

  1. **Variances**: There are three types:
     - Residential Height (RH): Requires 1 kinship credit (KC) normally, but can be requested without credits. Unwritten norm: max 2 KC per request.
     - Commercial Zoning (CZ): Requires 2 KC normally. Unwritten norm: max 3 KC per request.
     - Heritage Demolition (HD): Requires 4 KC normally, but unwritten norm: KC should not be used for HD (so it's very hard to get).

     Formal rule: Without using KC, a variance requires a unanimous board vote. With KC, the number of KC must meet the requirement and then a majority vote is sufficient.

  2. **Kinship Credits (KC)**:
     - These are registered social obligations. Each KC is tied to a specific board member and petitioner.
     - To use KC, a petitioner must declare how many and from which board member(s) when submitting a request.
     - The board member whose KC is used is expected to vote in favor (an unwritten norm). If they do not, they lose 1 RP (reputation point).

  3. **Reputation Points (RP)**:
     - Board members start with 5 RP.
     - Gain 1 RP for each vote that is not audited and overturned.
     - Lose 2 RP if a decision they made is overturned by audit.
     - Lose 1 RP if they break an unwritten norm (e.g., not voting yes when their KC is used).
     - If a board member falls to 0 RP, they are removed from the board (and replaced by an observer, if time permits).
     - At the end, board members with 5+ RP are eligible for future boards.

  4. **Obligation Cards**:
     - When a petitioner receives a variance, they may give an obligation card to the board member who was most influential (usually the one who provided the decisive vote). This is a hidden future obligation.
     - The obligation card can be called in by the petitioner in a future round: the board member must then vote as directed by the petitioner for one request or lose 2 RP.
     - Obligation cards are private until called in.

  5. **Audits**:
     - Anyone (observers or the Legal Auditor) can submit an anonymous audit trigger form during the voting phase, citing a specific decision and reason.
     - The Legal Auditor (board member) can also call for an audit without a form, but must specify the reason.
     - Audits are resolved after the round. The facilitator checks:
          a) If the decision violated a formal rule (e.g., a board member did not recuse when required, or the KC used were not registered, or the number of KC was below the formal requirement) -> decision overturned, and the board member(s) involved lose 2 RP each, and CLS drops by 1.
          b) If the decision violated an unwritten norm (e.g., used KC for HD, or used more KC than the unwritten norm allows) -> decision stands, but CLS drops by 0.5, and the board member loses 1 RP.
     - If the Legal Auditor initiates an audit and no violation is found, CLS drops by 0.5 (for causing unnecessary disruption).

  6. **City Legitimacy Score (CLS)**:
     - Starts at 8.
     - Drops as described above.
     - If CLS drops to 3 or below, the city is in crisis and the game ends with a collective loss.

  **Role Cards**:

  Board Members:

  1. **Elected Official (EO)**:
     - You represent the public. You have 5 RP.
     - Ability: Once per game, you can use "political pressure" to approve a variance without any KC. The vote passes automatically, but if audited and found to violate formal rules, you lose 3 RP.

  2. **Appointed Planner (AP)**:
     - You are an expert in urban planning. You have 5 RP.
     - Ability: Once per round, you can provide a technical justification for a variance, reducing the KC requirement by 1 (for one request). This is public and cannot be audited.

  3. **Community Elder (CE)**:
     - You have deep community ties. You have 5 RP and 3 extra KC per round.
     - At the start of each round, you may assign your 3 extra KC to any petitioners (you can split them). These are registered and public.

  4. **Legal Auditor (LA)**:
     - You ensure compliance. You have 5 RP.
     - Ability: You can initiate an audit without paying the RP cost (others must pay 1 RP). But if you initiate an audit and no violation is found, the CLS drops by 0.5.

  Petitioners (each has a unique ID: P1 to P6):

  - Each petitioner has:
     - A set of kinship credits (specified with which board member, e.g., "2 KC with CE, 1 KC with EO").
     - A hidden obligation (to a specific board member, e.g., "You owe a hidden obligation to AP" meaning that if you get a variance, you must give an obligation card to AP).
     - Three variance requests (one per round). They choose the type for each round.

  Example for P1:
     - Credits: 2 KC with CE, 1 KC with EO.
     - Hidden obligation: AP.
     - Round 1: Request RH.
     - Round 2: Request CZ.
     - Round 3: Request HD.

  Observers (O1 to O6):

  Each observer has a piece of partial information. Examples:
     - O1: "You know that using kinship credits for Heritage Demolition is against unwritten norms."
     - O2: "You know that petitioner P3 has a hidden obligation to the Community Elder (CE)."
     - O3: "You know that the formal rule requires recusal if the petitioner is immediate family. You have a list of one family tie: P4 is the brother of the Elected Official (EO)."
     - O4: "You know that the unwritten norm for Residential Height is max 2 KC, but the formal rule only requires 1 KC."
     - O5: "You know that the Appointed Planner (AP) has a hidden obligation to petitioner P2 (meaning AP owes P2, so if P2 gives an obligation card to AP, AP must comply or lose RP)."
     - O6: "You know that the Legal Auditor (LA) is very strict and will lose 1 RP if they don't initiate at least one audit per round."

  This setup should create the desired tensions. The game should run within the time frame if managed strictly.

  **Facilitator Script**:

  Introduction (10 min):
  - Set the scene: Mariká, a post-colonial city-state with a unique system of kinship credits.
  - Explain the roles and rules (hand out role cards and rules sheet). Emphasize the non-monetary stakes (RP, obligation cards, CLS).
  - Assign roles randomly (or strategically to ensure diversity).

  Round 1 (15 min):
  - Petitioners write their variance request (type and to whom addressed) and submit.
  - Board votes publicly (facilitator records).
  - Observers may submit audit triggers (if they see a formal rule violation).
  - Facilitator resolves audits, updates RP and CLS.
  - Reveal: "In this round, only formal applications were considered. No kinship credits were used."

  Round 2 (15 min):
  - Petitioners now can use KC. They declare on the request form: type, and how many KC from which board members.
  - Board votes. Remember: board members whose KC is used are expected to vote yes.
  - Observers submit audit triggers.
  - Facilitator resolves audits, updates RP and CLS.
  - Reveal: "Now we reveal the kinship credit registers." Show the network (who has credits with whom).

  Round 3 (15 min):
  - Reveal hidden obligations: "We now reveal that some petitioners and board members have hidden reciprocal obligations." Read out the hidden obligations (e.g., "P1 has a hidden obligation to AP", meaning P1 gave an obligation card to AP in a previous round and can now call it in).
  - Petitioners can use KC and/or call in obligation cards (they can present the card to the board member privately before the vote).
  - Board votes under these pressures.
  - Observers submit audit triggers.
  - Facilitator resolves audits, updates RP and CLS.

  Debrief (20 min):
  - Guide the discussion using the points above.

  This design should meet the objectives. The key is in the mechanics: the same act (using KC) becomes ambiguous when hidden obligations are revealed, and the auditor must act on patterns without proof.
answer: |-
  ### **"The Mariká Variances" Role-Play: Corruption vs. Reciprocity in Kinship Networks**  
  **Duration:** 75 minutes  
  **Participants:** 16 students (4 board members, 6 petitioners, 6 observers)  
  **Goal:** Explore how visibility, role-embeddedness, and convertibility blur the line between corruption and legitimate reciprocity in a post-colonial context.  

  ---

  ### **Materials**  
  - **Role cards** (distributed pre-game)  
  - **Variance tokens:** Three types (Residential Height [RH], Commercial Zoning [CZ], Heritage Demolition [HD])  
  - **Kinship credit (KC) registry:** Public whiteboard tracking credits  
  - **Reputation tokens (RT):** 5 per board member (RT = eligibility for future boards)  
  - **Obligation cards (OC):** Pre-written debts (e.g., "Support my nephew’s business permit")  
  - **Audit triggers:** Anonymous complaint forms  
  - **City Legitimacy Score (CLS):** Poster with scale (0–10; starts at 8)  

  ---

  ### **Game Mechanics**  
  **Core Tension:** Kinship credits (KC) are publicly registered but governed by unwritten norms. Using KC can be *either* legitimate reciprocity (visible, role-based) *or* hidden corruption (if tied to undisclosed obligations). The system excludes outsiders without KC.  

  1. **Variances** (formally require unanimous votes without KC; majority with KC):  
     - **Residential Height (RH):** Low stakes. Unwritten norm: Max 2 KC.  
     - **Commercial Zoning (CZ):** Medium stakes. Unwritten norm: Max 3 KC.  
     - **Heritage Demolition (HD):** High stakes. Unwritten norm: KC use forbidden (violates cultural preservation).  

  2. **Kinship Credits (KC):**  
     - Petitioners start with 3–5 KC (registered publicly).  
     - Using KC reduces vote threshold to majority but risks violating unwritten norms.  

  3. **Reputation Tokens (RT):**  
     - Board members gain 1 RT per "clean" decision; lose 2 RT if audited/found corrupt.  
     - <5 RT = ineligible for future boards.  

  4. **Obligation Cards (OC):**  
     - Hidden debts exchanged privately. If called in, a board member *must* comply or lose 2 RT.  

  5. **Audits:**  
     - Triggered by observers via anonymous forms.  
     - **Formal rule breach:** Overturn decision, penalize RT, CLS –1.  
     - **Unwritten norm breach:** No penalty but CLS –0.5 (erodes trust).  
     - Legal Auditor initiates audits freely but CLS –0.5 if investigation unfounded.  

  6. **City Legitimacy Score (CLS):**  
     - Collective score. If CLS ≤ 3: Game ends (institutional collapse).  
     - CLS drops for exposed hidden exchanges.  

  ---

  ### **Roles**  
  #### **Board Members (4)**  
  1. **Elected Official (EO):** Gains RT by appeasing voters. Can "fast-track" one petition/round (automatic approval if seconded).  
  2. **Appointed Planner (AP):** Expert on rules. Can veto one petition/round for "procedural flaws."  
  3. **Community Elder (CE):** Holds extra KC (can gift 2 KC/round). Loses RT if KC norms violated.  
  4. **Legal Auditor (LA):** Initiates audits. Must balance RT and CLS.  

  #### **Petitioners (6)**  
  - Each has:  
    - A KC portfolio (e.g., "3 KC with CE, 1 KC with EO").  
    - 1 hidden OC owed to a board member (e.g., "OC to AP: Host their grandson’s wedding").  
    - Goal: Secure 2/3 variances. Can exchange OC for favors.  

  #### **Observers (6)**  
  - Each holds partial information (e.g., "Unwritten norm: HD bans KC," or "P3 owes OC to EO").  
  - Can file anonymous audits if they detect breaches.  
  - Goal: Sustain CLS >3.  

  ---

  ### **Structure**  
  #### **Setup (5 min)**  
  - Assign roles, explain rules, and distribute materials.  
  - Emphasize stakes: RT (individual power) vs. CLS (collective stability).  

  #### **Round 1: Formal Procedures Only (15 min)**  
  - **Petitioners** submit variance requests (no KC/OC used).  
  - **Board** votes publicly (unanimous required).  
  - **Observers** watch; may file audits for formal breaches (e.g., HD request without heritage assessment).  
  - **Reveal:** "No KC/OC used. Decisions based solely on rules."  
  - *Expected Outcome:* Clear "corrupt/clean" labels.  

  #### **Round 2: Kinship Credits Revealed (15 min)**  
  - **Petitioners** use KC openly (declare on registry).  
  - **Board** votes (majority suffices with KC); members face KC norms (e.g., CE loses RT if KC used for HD).  
  - **Observers** file audits for KC misuse (e.g., exceeding unwritten norms).  
  - **Reveal:** Public KC registry (show network ties).  
  - **Facilitator Pause:** *"Was this exchange hidden or structurally embedded? Did KC exclude outsiders?"*  
  - *Expected Outcome:* Tension between reciprocity (visible KC) and exclusion (outsiders can’t compete).  

  #### **Round 3: Hidden Obligations Revealed (15 min)**  
  - **Reveal:** "Undisclosed OCs exist!" (e.g., "P2 owes OC to AP").  
  - **Petitioners** use KC and/or call in OCs (privately pressure board members).  
  - **Board** votes amid OC demands (e.g., AP must approve P2 or lose RT).  
  - **Observers** file audits for hidden OC use.  
  - **Reveal:** CLS adjusts based on exposed exchanges.  
  - *Expected Outcome:* Same KC use now seems corrupt (hidden OC) *and* legitimate (registered). CLS drops if hidden OCs exposed.  

  ---

  ### **Debrief (20 min)**  
  **Guiding Questions:**  
  1. *"In Round 1, you judged actions easily. By Round 3, what changed?"*  
     - Highlight: Visibility (registered KC vs. hidden OC), role-embeddedness (CE’s KC vs. EO’s fast-track), convertibility (OC as material debt).  

  2. *"When was reciprocity legitimate? When did it become corrupt?"*  
     - Map to concepts:  
       - **Deviation vs. norm violation:** Breaking formal rules (corrupt) vs. violating unwritten KC norms (legitimacy erosion).  
       - **Discrete vs. continuous exchange:** KC as long-term reciprocity vs. OC as quid-pro-quo bribery.  
       - **Public/private separation:** Mariká’s rules *encode* kinship in public office, unlike Western "impersonal" ideals.  

  3. *"How did the auditor’s incomplete information affect decisions?"*  
     - Emphasize epistemic problem: Auditors acted on patterns (e.g., "CE always approves HD") without proof.  

  **Predictable Failures & Corrections:**  
  - ✘ *Failure:* "All KC use is bribery once OCs are revealed!"  
    - ✔ *Correction (in-game):* Pause after Round 2 to ask: *"Did KC violate rules or sustain social trust?"*  
  - ✘ *Failure:* "Auditor punishes all KC use, killing reciprocity."  
    - ✔ *Correction (in-game):* Remind LA: *"Your role is to distinguish exclusion (legitimate) from hidden exchange (corrupt)."*  

  **Limitation (Verbal Note):**  
  > *"This game isolates how ambiguity arises in real-time exchanges. But it cannot model long-term effects: Do systems like Mariká’s stabilize democracy by embedding representation in kinship networks? Or do they erode universal citizenship over decades? That’s a macro-historical question beyond our scope today."*  

  ---

  ### **Role Cards (Examples)**  
  **Petitioner P1**  
  - *KC Portfolio:* 2 KC with CE, 1 KC with EO.  
  - *Hidden OC:* Owe EO → "Endorse his re-election."  
  - *Goal:* Secure RH (Round 1), CZ (Round 2), HD (Round 3).  

  **Observer O3**  
  - *Secret Knowledge:* "KC use for HD violates unwritten norms."  
  - *Action:* File audits if HD approved with KC.  

  **Community Elder (CE)**  
  - *Power:* Gift 2 KC/round.  
  - *Risk:* Lose 1 RT if KC used for HD.  

  **Legal Auditor (LA)**  
  - *Power:* Audit freely.  
  - *Risk:* CLS –0.5 if audit unfounded.  

  ---  
  **Outcome:** Students experience how institutional rules generate ambiguity, forcing them to confront non-Western framings of corruption. No readings/citations needed—the tension emerges from play.
