answer: |-
  Here’s the joke:

  A translator devoted to *le ton beau de Marot* is wrestling with a corrupted rondeau. The key stanza, where the poet’s "heart" (*coeur*) should ache, reads instead "court" (*cour*) due to a persistent scribal error. The translator, bound by the iron laws of the ABAAAB rhyme scheme and the exact syllable count, needs a word for the final A-rhyme position that rhymes with "art" and "part" in the preceding lines. "Heart" would restore meaning but shatters the rhyme, leaving a gaping metrical hole. "Court," however, is phonetically perfect – a false cognate that slips seamlessly into the stanza’s architecture, rhyming flawlessly and filling the measure. With a sigh of archival duty, the translator writes:

  *"My love is true, a work of finest art,*
  *Though cruel distance keeps us far apart.*
  *This court (not heart!) – a heavy, weary weight –*
  *Awakes alone before the palace gate."*

  The form, satisfied, preserves the scribe's "court" with impeccable grace, while the poet's true feeling remains exiled beyond the palace walls, barred entry by the very elegance meant to honor him.

  **The Logic (for clarity):**
  *   **The Constraint:** The rigid ABAAAB rhyme scheme and precise meter are non-negotiable; preserving *le ton beau* demands it.
  *   **The Corruption:** The source text has *cour* (court) where *coeur* (heart) was intended.
  *   **The Translator's Bind:** To maintain the rhyme and meter in English, the semantically correct word ("heart") doesn't fit the established sound pattern (it doesn't rhyme with "art"/"part"). The corrupt word's *phonetic equivalent* in English ("court") *does* fit perfectly.
  *   **The Form's "Will":** The formal structure (rhyme + meter) dictates the choice. It *requires* the corrupt word "court" because "court" is the only word that satisfies the formal constraints *and* mirrors the source text's error phonologically. Meaning is sacrificed *to* the form.
  *   **The Humor:** The exquisite, self-imposed discipline of the tradition forces the translator to prioritize the *sound* and *shape* of a centuries-old mistake over the recovery of the poet's original meaning. The form becomes an active agent, collaborating with the scribe across time to ensure the error's elegant persistence. The "beautiful tone" is preserved precisely *through* this meticulous betrayal of semantic intent.
