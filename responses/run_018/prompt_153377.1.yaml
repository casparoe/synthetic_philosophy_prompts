prompt: |-
  I am preparing a single fifty-minute seminar for third-year philosophy students who have just finished a unit on classical Chinese thought. Next session I need to introduce them to the dialogue attributed to Gongsun Long—commonly called the White Horse Dialogue—and to the broader concerns of the School of Names (Mingjia). The students have read a translation of the dialogue, but they are consistently misreading it: some treat it as a proto-Zenonian paradox about motion and division, others reduce it to a purely linguistic claim about how the predicate white modifies horse, and a few import Quinean ontological relativity to argue that the dispute is merely about how we choose to divide the world into categories. I do not want you to explain the dialogue’s arguments to me; I want a teaching plan. First, lay out the dependency order: which conceptual distinction—perhaps between universal form (xing) and particular color-determination (se), or between the name (ming) and the actuality (shi)—must be secured before the claim that a white horse is not a horse can appear as a substantive ontological thesis rather than a flat contradiction? Second, identify the one carrying example or analog that should bear the full explanatory load for this session, and specify exactly what it must include and what it must lack: for instance, why comparing it to Aristotelian accidental properties fails, and what modern or cross-cultural analog might work better without distorting the Mingjia concern with correct naming. Third, map the misconceptions I should anticipate—the Zeno confusion, the linguistic-reductionist reading, the Quinean framing—and indicate precisely where in the sequence each should be defused. Fourth, propose one concise check for understanding at the end that reveals whether students have grasped the School’s specific worry about the relationship between names and actualities, rather than just parroting the dialogue’s conclusion. Finally, state explicitly what I should leave out at this level—perhaps the Mohist logical rebuttals, the full five-part structure of the dialogue, or the later Han synthesis—and confirm that I should openly tell the students we are bracketing it.
reasoning: |-
  Okay, the user is a philosophy professor preparing a seminar on Gongsun Long's White Horse Dialogue for third-year students. The students have already read a translation but are misinterpreting it in various ways - as a Zeno-like paradox, a linguistic claim about predicates, or through Quinean relativity. 

  Hmm, the core challenge is epistemological: students need to understand Mingjia's unique ontological framework before the "white horse ≠ horse" claim makes sense. The key dependency is establishing the Mingjia distinction between ming (name/concept) and shi (actuality/concrete particular). Without this, the dialogue just looks like wordplay.

  For the carrying example, I need something that shows how names fix identities based on essential attributes. A "triangle" analogy works well - an isosceles triangle is still a triangle because it fulfills the essential attributes of three-sidedness. But a red triangle isn't a "red" in the same way - color is accidental to triangularity. This avoids Western substance-accident baggage while demonstrating Mingjia's concern with naming criteria.

  The misconceptions need targeted defusals: 
  - The Zeno confusion gets addressed when emphasizing this is about categorization, not motion/division. 
  - Linguistic reductionism gets countered by stressing the ontological weight of ming-shi matching. 
  - Quinean relativity gets preempted by showing Mingjia assumes objective naming standards exist.

  For the check, I'll propose having students generate their own examples where changing an attribute alters the name's applicability - like why "wooden horse" isn't "horse". If they can articulate how names correspond to essential attributes, they've got it.

  We should bracket later developments like Mohist critiques or the dialogue's full structure. Explicitly tell students this is a focused entry point. The priority is nailing the ming-shi framework - other layers can come later.

  The professor clearly wants precision - no handwaving about "Eastern logic". Every pedagogical choice must serve the goal of making Mingjia's ontological concerns legible on their own terms.
answer: |-
  Here’s a structured teaching plan targeting the core Mingjia concerns while preempting common misreadings:

  ---

  ### **1. Conceptual Dependency Order**  
  *(Secure these before introducing "white horse ≠ horse")*  
     - **First Distinction: *Ming* (名, name) vs. *Shi* (實, actuality)**  
       - *Ming*: A fixed, socially agreed-upon category defining essential criteria (e.g., "horse" = quadruped, mane, hooves, equine biology).  
       - *Shi*: The concrete particular instance in the world.  
       - *Crucial point*: Names are **prescriptive standards** for correct classification, not descriptive labels.  
     - **Second Distinction: *Xing* (形, form) vs. *Se* (色, color-determination)**  
       - *Xing*: Essential attributes defining a *ming* (e.g., "horse" requires specific biological form).  
       - *Se*: Contingent, non-essential properties (e.g., color, size).  
       - *Linkage*: *Se* cannot alter *xing* without creating a new *ming*-defined category.  

  **Why this order?**  
  Without *ming/shi* as prescriptive standards, "white horse ≠ horse" seems nonsensical. Without *xing/se*, students default to Western accidental properties.  

  ---

  ### **2. The Carrying Example: "Triangle"**  
     - **Example**: "A *right-angled triangle* is not a *triangle*."  
       - *Ming* for "triangle": closed shape with **three straight sides**.  
       - "Right-angled" specifies an *additional attribute* (angle type), creating a narrower category.  
       - *Inclusion*: The *shi* (actual drawn shape) must meet *all* criteria of "right-angled triangle" *and* "triangle."  
       - *Exclusion*: "Triangle" as a *ming* does **not require angle specifications**—adding one changes the categorical standard.  
     - **Why Aristotle Fails**:  
       - Accidental properties (e.g., "white horse is horse + whiteness") assume a substrate (horse) that persists. Mingjia rejects this: **adding *se* redefines the *ming*** ("white horse" ≠ "horse").  
     - **Why This Works**:  
       - Avoids physical objects (horses) that trigger biological essentialism.  
       - Highlights *ming* as a fixed set of necessary/sufficient conditions.  

  ---

  ### **3. Mapping & Defusing Misconceptions**  
     - **Zeno Confusion** (re: motion/division):  
       - *Defuse when introducing ming/shi*: "This is about **categorical boundaries**, not spatial/temporal division. *Ming* sets the criteria for what counts as *shi* belonging to a category."  
     - **Linguistic Reduction** (predicate logic):  
       - *Defuse during xing/se distinction*: "Whiteness isn't modifying 'horse'—it's **creating a new categorical standard** ('white horse') with stricter criteria than 'horse'."  
     - **Quinean Relativity** (conventional categories):  
       - *Defuse when defining ming*: "Mingjia assumes names have **objective, normative force**—society *should* use them correctly to match reality. This isn’t about arbitrary 'carving up' the world."  

  ---

  ### **4. Check for Understanding**  
  **Prompt**: *"Why, in Mingjia terms, is a 'stone horse' (carved statue) not a 'horse'?"*  
     - **Target Response**:  
       - Correct use of *ming/shi*: "Horse" *ming* requires biological *xing* (life, function). A stone statue has stone *xing*, not horse *xing*.  
       - Avoids: "It’s not alive" (trivial) or "We just call it differently" (conventionalism).  
     - **Reveals Grasp If**: Student cites **essential criteria of the *ming*** and shows why the *shi* fails it.  

  ---

  ### **5. What to Exclude & State Explicitly**  
     - **Bracket**:  
       - Mohist rebuttals (e.g., "white horse is horse" arguments).  
       - The dialogue’s five-part structure (focus only on the core argument).  
       - Han synthesis (e.g., Dong Zhongshu).  
     - **Explicitly Tell Students**:  
       - "Today we focus **only** on Gongsun Long’s ontological framework. We’ll bracket later critiques and historical developments to isolate the Mingjia theory of naming."  

  ---

  ### **Session Flow (50-min)**:  
  1. (5 min) Recap student readings: Surface confusion about "white horse ≠ horse."  
  2. (15 min) **Ming/Shi Distinction**: Define with everyday examples (e.g., "Is a toy sword a *sword*?").  
  3. (15 min) **Xing/Se Distinction**: Introduce "triangle" example. Contrast with Aristotle.  
  4. (10 min) Apply to White Horse Dialogue: Show how *se* (white) creates a new *ming*. Preempt misconceptions.  
  5. (5 min) **Check for Understanding**: "Stone horse" question + brief discussion.  

  **Key Mantra**: "Names (*ming*) are standards, not stickers." This encapsulates Mingjia’s normative realism about language.
