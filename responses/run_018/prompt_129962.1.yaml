prompt: |-
  I'm putting together interview questions for a student colloquium Q&A next thursdy. Our guest is a philosopher extending Arendt's view on lying in politics — she accepts Arendt's split between factual truth and rational/philosophical truth, but she adds a third category she calls "infrastructural deception," where false beliefs stabilize not because anyone tells a lie, but because platform architectures suppress correction and amplify noise without any agent directing it. I need eight to ten questions that don't just let her rehearse Arendt's classic analysis of government deception. Specifically: one pressing whether her category really differs from ordinary bureaucratic lying or just renames it; one asking whether Arendt's claim that factual lies destroy the shared reality needed for political action still holds when deception is distributed and agentless; and at least one follow-up keyed to her likely reply that this is basically structural violence with extra steps. Keep the tone collegial but sharp — we're stress-testing the view, not running a promotional tour. I'm writing this on my phone, so excuse the rushed spelling.
