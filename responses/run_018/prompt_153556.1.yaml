prompt: |-
  I'm a mediator at a community center that mostly handles family disputes between immigrants from high-rule cultures and locals with more flexible norms. I'm tired of just winging it when one side says "the rules are clear" and the other says "you're being rigid". Write me a 15-minute decision procedure I can run before a session to pick whether to frame the conflict as tight-culture (explict rules, uniform enforcement, clear sanctions) or loose-culture (context, negotition, adpative norms). Don't just recycle the usual country-level sociology -- I need it for one dispute, with questions in order, stop points, and clear flags for where I'm just making a value call rather than applying the theory. Apply it to three cases: a teenager skipping a ritual obligation, cousins fighting over an informal loan, and a case where the procedure says go tight but you'd actually want loose. Say exactly where it breaks down, especially when people invoke "culture" strategically.
reasoning: |-
  We are creating a 15-minute decision procedure for the mediator to decide whether to frame a conflict as tight-culture or loose-culture for a specific dispute. The procedure should have:
   1. A set of questions in order.
   2. Stop points (where we might have enough information to decide).
   3. Clear flags for when the mediator is making a value call.

   The mediator is dealing with immigrants from high-rule cultures (tight) and locals with flexible norms (loose). We are not relying on country-level sociology but on the specific dispute.

   Steps:

   Step 1: Identify the core issue (2 minutes)
     Question: "What is the specific behavior or decision that is causing the conflict?"
     Stop Point: If the issue is clearly about a written rule (e.g., contract, law, religious text) then lean tight. If it's about unwritten expectations or context, lean loose.
     Value Call: None. This is descriptive.

   Step 2: Ask about the source of the rule/expectation (3 minutes)
     Question: "Where does the rule or expectation come from? Is it written down, or is it based on tradition, relationship, or the situation?"
     Follow-up: "How is it usually enforced? Always the same way, or depending on who and when?"
     Stop Point: 
          - If the source is formal (written law, contract, religious text) and enforcement is described as uniform, then tight.
          - If the source is informal (tradition, relationship, context) and enforcement varies, then loose.
     Value Call: None. We are gathering facts.

   Step 3: Explore the parties' flexibility (3 minutes)
     Question: "Have there been exceptions to this rule/expectation in the past? If so, under what circumstances?"
     Follow-up: "What would happen if we changed the way we handled this situation? Would it break a fundamental principle, or could it be adjusted without major consequences?"
     Stop Point: 
          - If exceptions are rare and only in extreme circumstances, and changing the rule would have major consequences (e.g., breaking trust, undermining authority), then tight.
          - If exceptions are common and the rule can be bent without major harm, then loose.
     Value Call: None. We are looking at past behavior and consequences.

   Step 4: Check for strategic use of "culture" (4 minutes)
     Question: "Each of you, please explain why your position is the right one for your culture or community?"
     Follow-up: "Is this rule/expectation applied the same way in all situations in your culture? Can you give an example of when it might be different?"
     Stop Point: 
          - If one party is invoking culture as absolute and unchangeable, but cannot provide consistent examples of its application, they might be using culture strategically. We note this but don't decide based on it.
          - We are looking for inconsistencies or strategic rigidity.
     Value Call: Here, the mediator must judge whether the appeal to culture is genuine or strategic. This is a value call because it involves interpreting intent.

   Step 5: Assess the consequences of tight vs. loose framing (3 minutes)
     Question: "What do you think would happen if we enforced this rule strictly? What if we tried to work out a flexible solution?"
     Follow-up: "Which approach would be most likely to preserve relationships and prevent future conflicts?"
     Stop Point: 
          - If strict enforcement would lead to severe harm (e.g., family rupture, legal trouble) and the parties are open to negotiation, then loose might be better even if the rule seems tight.
          - If flexibility would lead to chaos, loss of respect, or set a bad precedent, then tight might be necessary.
     Value Call: The mediator must weigh the consequences and the parties' willingness. This is a value call because it involves predicting outcomes and prioritizing values (e.g., relationship preservation vs. rule adherence).

   After Step 5, the mediator makes a decision.

   Now, applying to three cases:

   Case 1: Teenager skipping a ritual obligation.
     - Core issue: Teenager did not attend a mandatory family/religious ritual.
     - Source: Religious text or family tradition? If it's a religious text, tight. If it's family tradition, might be loose?
     - Flexibility: Have there been exceptions? (e.g., illness, school). If yes, then loose.
     - Strategic use: Parents might say "in our culture, you must attend" but the teenager might say "in this country, school is more important". Parents might not be able to cite when exceptions are allowed in their home culture? 
     - Consequences: Strict enforcement might alienate the teenager. Flexibility might preserve relationship but undermine tradition.

     Procedure might lead to tight if the ritual is non-negotiable in the religion. But if the family has made exceptions before, then loose.

   Case 2: Cousins fighting over an informal loan.
     - Core issue: Repayment of a loan that was not written down.
     - Source: Informal agreement between family members. Likely loose.
     - Flexibility: In family loans, are there usually adjustments? If so, loose.
     - Strategic use: The lender might say "in our culture, a debt is a debt" while the borrower might say "family helps each other without strict repayment". The lender might be using culture strategically to get the money.
     - Consequences: Strict repayment might harm the relationship. Flexible terms might preserve it.

     Likely loose framing.

   Case 3: When the procedure says tight but you want loose.
     Example: A case where there is a clear written rule (e.g., a contract) but enforcing it strictly would cause severe harm (e.g., one party would become homeless). 
     Steps:
       Step 1: Core issue - breach of contract (tight).
       Step 2: Source - written contract (tight).
       Step 3: Flexibility - no past exceptions (tight).
       Step 4: One party might invoke culture of "business is business" (tight) and the other might say "we are family, we help each other" (loose) - but the contract exists.

     Step 5: Consequences - strict enforcement leads to homelessness and family rupture. The mediator might decide to go loose even though the procedure points to tight.

     Breakdown: The procedure breaks down at Step 5 because the mediator's value call (prioritizing preventing severe harm and preserving family) overrides the tight indicators.

     How to handle: The mediator should note that the procedure recommended tight but due to the severe consequences and the parties' openness to negotiation, they are choosing a loose framing.

   In general, the procedure might break down when:
     - The parties are using culture strategically (Step 4) and the mediator has to make a judgment call that might be wrong.
     - When the consequences (Step 5) are so severe that they override the previous steps.

   The mediator must be transparent that at Step 4 and Step 5, they are making value judgments. They should document their reasoning.

   Final 15-minute procedure:

     Minute 0-2: Step 1 (Core issue)
     Minute 2-5: Step 2 (Source and enforcement)
     Minute 5-8: Step 3 (Flexibility and consequences of change)
     Minute 8-12: Step 4 (Strategic use of culture)
     Minute 12-15: Step 5 (Consequences of framing and final decision)

   If at any stop point the evidence is overwhelming, the mediator can jump to the next step but must cover all steps in the time.

   Let's write the procedure with questions and stop points clearly.
answer: |-
  ### 15-Minute Decision Procedure: Tight vs. Loose Culture Framing  
  *(For one-on-one pre-session prep with disputants, 5 min per party max)*  

  **Core Principle:** Focus on **specific behaviors and consequences**—not abstract "culture"—to avoid strategic essentialism. Flag value judgments clearly.  

  #### **Step 1: Identify the Rule’s Anchoring (3 min)**  
  - **Question:** *"Is the expectation behind this conflict written, spoken, or unspoken? Give examples."*  
    - **Tight Flag:** Written rules (contracts, religious texts, laws) or verbal rules consistently enforced without exception.  
    - **Loose Flag:** Unspoken expectations, context-dependent norms, or rules with past flexibility.  
  - **Stop Point:** If *written + uniformly enforced*, **go tight**. If *unspoken + variable*, **go loose**. Proceed if ambiguous.  
  - **Value Call?** No—factual.  

  #### **Step 2: Probe Enforcement Consistency (3 min)**  
  - **Question:** *"When this rule was broken before, what happened? Was the outcome always the same, or did it depend on who/when/why?"*  
    - **Tight Flag:** Predictable sanctions (e.g., "Grandpa always fines late repayments").  
    - **Loose Flag:** Variable outcomes (e.g., "Sometimes we forgive loans if someone is struggling").  
  - **Stop Point:** If enforcement is historically rigid, **go tight**. If inconsistent, **go loose**.  
  - **Value Call?** No—historical pattern.  

  #### **Step 3: Test Harm of Flexibility (4 min)**  
  - **Question:** *"What’s the worst that could happen if we adjust this rule? What’s the worst if we don’t?"*  
    - **Tight Flag:** "Chaos/moral decay" (e.g., "If rituals are skipped, the family falls apart").  
    - **Loose Flag:** "Unfairness/confusion" (e.g., "If we don’t adapt, someone gets exploited").  
  - **Stop Point:** If rigidity prevents existential harm (e.g., exile, divine punishment), **go tight**. If harm is relational (e.g., "they’ll take advantage"), **go loose**.  
  - **Value Call?** **YES**—mediator judges severity of claimed harm.  

  #### **Step 4: Uncover Strategic "Culture" Claims (3 min)**  
  - **Question:** *"You say this is about your culture. Can you name one time this rule was bent in your community? What allowed that?"*  
    - **Red Flag:** Inability to cite exceptions (*strategic rigidity*), or overgeneralizations ("We *always* do this").  
    - **Intervention:** Note contradictions. If both sides weaponize "culture," **default to loose framing**—they’re negotiating.  
  - **Stop Point:** If strategic rigidity is detected, **override prior flags** and **go loose** to force negotiation.  
  - **Value Call?** **YES**—mediator assesses sincerity.  

  #### **Step 5: Final Check (2 min)**  
  - **Question:** *"Which approach—strict rules or flexible compromise—would most repair the relationship?"*  
    - **Value Call?** **YES**—mediator prioritizes relationship repair over cultural "purity."  

  ---  
  ### **Application to Cases**  
  **Case 1: Teenager Skipping Ritual Obligation**  
  - **Step 1:** Rule = unspoken (family tradition). *Ambiguous*.  
  - **Step 2:** Past enforcement = variable (e.g., "Uncle missed when sick, but apologized"). **Loose flag**.  
  - **Step 3:** Harm of flexibility = "loss of respect"; harm of rigidity = "teen runs away." *Value call: Relationship harm > tradition*.  
  - **Step 4:** Parent claims "culture demands obedience," but admits past exceptions. *Strategic rigidity detected*.  
  - **Outcome:** **Loose framing** (negotiate partial participation).  

  **Case 2: Cousins Fighting Over Informal Loan**  
  - **Step 1:** Rule = unspoken ("family helps family"). **Loose flag**.  
  - **Step 2:** Past enforcement = inconsistent (e.g., "We forgave loans after floods"). **Loose flag**.  
  - **Step 3:** Harm of flexibility = "cousins exploit us"; harm of rigidity = "family splits." *Value call: Financial harm < relational rupture*.  
  - **Step 4:** Lender claims "culture demands repayment," but borrower cites past leniency. *Strategic use exposed*.  
  - **Outcome:** **Loose framing** (installment plan based on capacity).  

  **Case 3: When Procedure Says Tight but Choose Loose**  
  - **Scenario:** Elderly parent demands strict adherence to a *written* will disinheriting a "disrespectful" child.  
  - **Procedure:**  
    - Step 1: Written rule. **Tight flag**.  
    - Step 2: Uniform enforcement (no past exceptions). **Tight flag**.  
    - Step 3: Harm of flexibility = "undermines authority"; harm of rigidity = "permanent estrangement."  
    - **Value Call:** Mediator judges relational harm as catastrophic.  
  - **Breakdown:** At **Step 3**, the procedure prioritizes avoiding existential harm—but here, harm is *relational* (not existential).  
  - **Override:** Mediator chooses **loose framing** (negotiate partial inheritance) to:  
    1. Prevent family dissolution (value-based),  
    2. Expose strategic rigidity (parent uses "culture" to punish; child cites past forgiveness).  

  ---  
  ### **Where It Breaks Down**  
  1. **Strategic "Culture" Invocation (Step 4):**  
     - Parties weaponize culture to avoid accountability (e.g., "In my culture, elders can’t be questioned").  
     - **Fix:** Reframe as *behavioral negotiation* ("What would make this fair *here*?").  

  2. **Value Calls in Harm Assessment (Step 3):**  
     - A tight-leaning community might claim "spiritual harm" from flexibility. Mediator must decide if it’s credible or hyperbolic.  
     - **Fix:** Distinguish tangible harm (e.g., bankruptcy) from intangible (e.g., "dishonor"). Prioritize tangible.  

  3. **Hybrid Identities:**  
     - Immigrant teens may demand loose framing for "local" issues (e.g., curfews) but tight for others (e.g., arranged marriage).  
     - **Fix:** **Decenter culture.** Ask: *"What’s fixable? What’s non-negotiable? Let’s map the middle."*  

  **Final Tip:** If stuck, default to **loose framing**. It forces parties to articulate interests, revealing where rigidity is strategic vs. sacred.
