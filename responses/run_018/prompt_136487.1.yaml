  She wants one essay question, sit-down exam, 90 minutes, 25 marks total, with a model answer of about 600 words and a marking scheme that actually separates the A students from the B ones. The crux should be this slightly niche framing: ask them to evaluate 'demographic neturality' — the idea that liberal states ought to stay neutral on population size in the same way they stay neutral on conceptions of the good — even though reproductve choices clearly aggregate into climate and resource effects over generations. The prompt needs to force students to distinguish pronatalism as an axiological claim (more people equals more value) from pronatalism as a deontic claim (we have actual reasons or duties to reproduce), and to ask whether demographic neutrality collapses once you accept that births aren't purely private goods but have collective, long-run footprints.

  Please write the exam question, the model answer, and a marking scheme built around five specific moves an A answer must contain — for example, spotting the asymmetry between procreative reasons and procreative duties, and not conflating neutrality with simple indifference. Keep everything self-contained: no bibliography requests, no obscure named theorists that students can't place without searching, and no verbatim quotes from real texts — paraphrase only. British spelling throughout, please. Oh, and there might be a typo or two in my message — I'm writing this on my phone after a long train journey — but thier exam materials should be clean.
