  First, I need to consider the dependency chain. Dispositions must be established before introducing failures - that's non-negotiable. The classic poison/vitamin example fails because its mechanism is opaque; we need something physically visualizable like the drone propeller example. That ceramic-polymer system perfectly isolates the temporal distinction: masks are pre-existing barriers, finks are triggered removals.

  For misconceptions, I'll map them against the teaching sequence:
  - When defining dispositions, someone will inevitably say "if it never manifests, it isn't real" - that's when I hit them with radioactive uranium examples
  - The moment I introduce masks, the "not triggered yet" confusion will surface - cue the glass pane analogy
  - AI folks will jump to "latent capabilities" during the mask discussion - I'll need that explicit pause to differentiate operationalization from ontology

  The drone example carries both cases beautifully: the dissolving polymer is a physical mask anyone can visualize, while the enzyme-triggered dissolution at impact is a perfect fink. Crucially, it has a time-separable mechanism unlike the vitamin case where activation is biochemical and simultaneous.

  Key teaching moves:
  - Flatly refuse to unpack Lewisian counterfactuals - just name-drop and move on
  - The check question must force application outside philosophy - maybe AI safety or materials science
  - If someone argues that finks are just delayed masks, that's my signal to reorder and emphasize temporal priority of the interfering factor

  For the AI alignment crowd, I'll prepare that "latent capability" redirect - when they bring it up, I'll explicitly separate the engineering perspective from metaphysical grounding. The radioactive decay example should prevent the "never manifested = not real" fallacy from taking root.

  The brittleness check question is designed to expose if they confuse masking with finking: if they say "it's masked when coated" but can't explain why it's not finked, we revisit the temporal trigger distinction. And if any AI person tries to map everything to model capabilities, I'll invoke the "dispositions exist independently of measurement" principle.
answer: |-
  Here's the battle-tested 90-minute plan optimized for conceptual clarity and misconception prevention, using your drone propeller example:

  **Conceptual Dependency Chain:**  
  Disposition → Manifestation Conditions → *Mask* (interferes *before* stimulus) → *Fink* (interferes *during* stimulus) → Why the distinction matters

  ---

  ### **Teaching Sequence (90m Total)**
  **1. Dispositions Core (25m)**  
  - *Hook:* "Why do we say sugar *is* soluble if it's currently sitting in a jar?"  
  - Define: Disposition = property that *would* manifest X *if* S obtained (e.g., fragility = *would* break if struck).  
  - **Key Visual:** Show uncoated ceramic drone propeller shattering on impact (baseline fragility).  
  - *Preempt Misconception:* "If it never breaks, is it fragile?" → **Radioactive uranium example:** "Uranium is flammable even if never ignited—disposition exists independently of manifestation history."  

  **2. Masks (20m)**  
  - *Setup:* "What if the propeller *is* fragile but *doesn't* break when struck?"  
  - **Drone Example:** Polymer-coated propeller struck in dry air → doesn't break.  
  - *Define Mask:* Interfering factor **already present** *before* stimulus that blocks manifestation (coating is a physical barrier).  
  - *Preempt Misconception:* "Is this just 'not triggered yet'?" → Contrast: **Glass pane over a fire alarm bell**. The bell *is* audible, but the pane blocks sound *before* you try to hear it. Masking ≠ absence of stimulus.  
  - *AI Alignment Redirect:* When they mention "latent capabilities," agree but stress: "Masks explain why *operationalizing* a disposition (e.g., testing model honesty) can fail—external blockers exist pre-trigger."  

  **3. Finks (20m)**  
  - *Setup:* "What if the interfering factor *only appears when the disposition is triggered*?"  
  - **Drone Example:** Propeller struck in air → enzyme released *on impact* dissolves polymer *during* strike → shatters. Fragility was finked!  
  - *Define Fink:* Interfering factor **activated by the stimulus itself** that *removes* the disposition mid-process.  
  - *Prevent Collapse with Mask:* **Timeline Matters!**  
    - Mask: Coating exists *before* strike → prevents break.  
    - Fink: No coating pre-strike → strike *causes* enzyme release → coating dissolves *as it strikes* → breaks.  
  - *Classic Poison Failure:* Vitamin/poison cases often blur temporal lines (e.g., "antidote activates when ingested"). Your drone has clear mechanical stages: impact → enzyme release → dissolution.  

  **4. Why Distinction Matters & Check Question (15m)**  
  - *Consequence:* Masks require removing *external blockers* to test dispositions; finks require stabilizing *intrinsic mechanisms*.  
  - **Check Question:** *"A spy's cyanide pill is designed to dissolve if bitten, but she stores it in a lead-lined pocket. When captured, she bites it—but the pill doesn’t dissolve. Is this a mask or a fink? What if the lining vaporizes on contact with saliva?"*  
    - *Correct:* Lead lining = mask (pre-existing blocker). Vaporizing lining = fink (triggered by saliva).  
  - *Open Refusals:* "We’re skipping Lewis’s possible-worlds semantics and Martin’s electro-fink details—read the 1994/1997 papers if curious."  

  **5. AI Alignment Bridge (10m)**  
  - *Preempt Mapping:* "Don’t reduce dispositions to 'latent capabilities' in LLMs—dispositions are *categorical properties* (e.g., model *is* deceptive), while 'latency' is operational. Finks/masks explain why probes fail:  
    - *Mask:* Training data contaminant blocking deception *during* testing.  
    - *Fink:* Safety training that *activates* during deception attempts to 'sanitize' output."  

  ---

  ### **When to Change This Order?**  
  1. **If audience resists dispositions as real properties:** Start with **radioactive decay** (disposition to decay exists pre-manifestation).  
  2. **If they conflate stimulus/trigger:** Replace drone with **electromagnet example** (fragile vase on a switch: magnet *releases* when struck = fink; permanent magnet = mask).  
  3. **If AI folks dominate discussion:** Swap Step 5 with Step 2—use "model honesty" cases *first*, then generalize to metaphysics.  

  **Why This Works:**  
  - The drone propeller has **mechanically discrete stages** (coating applied → impact → enzyme release) making temporal priority unambiguous.  
  - **Physical visuals** prevent "magical" thinking (unlike poison/vitamin).  
  - Misconceptions are headed off **at point of entry** (e.g., masks vs. "not triggered" challenged immediately with the glass pane).  

  Focus relentlessly on the **temporal relationship** between stimulus and interferer—that’s the fault line between masks and finks.
