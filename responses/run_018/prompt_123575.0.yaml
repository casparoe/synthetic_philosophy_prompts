prompt: |-
  You are an expert in jurisprudence and philosophy of law who has read Devlin's original lectures closely, not just the textbook summaries. Before answering, take a breath and brainstorm the main fault lines in the Hart-Devlin exchange — dont rush straight to the harm-principle recap.

  I've been trying to understand why the legal-moralism debate never really dies but also never moves. Hart attacks Devlin's claim that society can defend its shared morality the way it defends itself from treason, and Devlin replies that without these shared bonds you get social disintegration, not freedom. But in modern cases — assisted dying, drug policy, online harm — both sides just replay the same moves. I'm wondering if part of the stall is an institutional burden asymmetry: Devlin treats existing moral consensus as a default legal baseline that reform must actively destabilise, while Hart demands every criminal statute carry a fresh burden of proof about tangible harm. So maybe the disagreement is not really about whether morality binds law, but about who bears the risk of error when the law shifts.

  Is that right, or is it still a substantive moral disagreement in procedural clothing? More generally, diagnose the stall: is it verbal (different meanings of harm), hidden empirical (does moral consensus actually stabilise societies?), or bedrock intuitions about whether the state should ever symbolise disgust? And given your diagnosis, what would count as progress — a historical case study, applying the critical and positive morality distinction to legislative inertia, or is it genuinely unresolvable?

  Keep it focused. I dont need a bibliography or citation list, and please avoid verbatim quotes from Hart or Devlin — paraphrase is perfectly fine.
