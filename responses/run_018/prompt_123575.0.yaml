  First, I need to recall Hart and Devlin's main points. Hart, following Mill's harm principle, argues that law should only prevent harm to others, not enforce morality for its own sake. Devlin counters that shared morality is essential for social cohesion, so society has the right to protect it through law, even without direct harm. The user's point about institutional burden makes sense. Devlin's stance means the status quo (existing moral laws) doesn't need justification; challengers must prove change won't cause disintegration. Hart flips this: any moral law must continuously justify itself with evidence of harm.

  The user asks if the stall is due to verbal differences (like defining "harm"), hidden empirical claims (does moral consensus stabilize society?), or fundamental beliefs about the state symbolizing disgust. Each is a layer. Verbal issues: Hart's harm includes psychological and indirect harms, which Devlin might see as part of social fabric. Empirical: Devlin assumes moral breaches cause disintegration, but evidence is mixed—some societies adapt, others fracture. Core values: Whether disgust should be legislated versus autonomy protected.

  Progress might come from historical case studies, like the Wolfenden reforms or same-sex marriage, showing if relaxing morals caused disintegration. Applying Hart's distinction between critical morality (rational principles) and positive morality (accepted norms) could help legislators evaluate laws. Yet, the debate might be unresolvable because it hinges on foundational values about individual vs. societal rights. The burden asymmetry makes compromise hard, as each side's starting point dictates their demands. The user's diagnosis of institutional burden is spot-on—it's a procedural framing of deeper moral conflicts, making the debate persistent but stagnant.
answer: |-
  You've precisely identified a critical and often overlooked dynamic in the Hart-Devlin stalemate: the **procedural asymmetry in the burden of proof and risk allocation**. Your diagnosis is largely correct and reveals why the debate feels static:

  1.  **Devlin's Status Quo Baseline:** Devlin treats the *existing, positive morality* (the widely held moral beliefs of the community at a given time) as the foundation of social cohesion. Therefore, the *legal enforcement* of that morality is the presumed baseline. The burden lies with reformers to demonstrate that decriminalizing a specific "immoral" act will *not* cause social disintegration. The risk of error (allowing immorality that weakens society) is assigned to the reformer. Law reflects the community's existing moral bonds.

  2.  **Hart's Harm Principle Baseline:** Hart adopts Mill's principle that state coercion requires specific justification. The *absence* of legal prohibition is the baseline. The burden lies squarely on the state to demonstrate that criminalizing an act is necessary to prevent *tangible harm to others*. The risk of error (criminalizing conduct that causes no harm, thus unjustly infringing liberty) is assigned to the enforcer. Law must justify every intrusion.

  **Beyond Burden: Diagnosing the Stall**

  While the burden asymmetry is fundamental, the stall stems from its interaction with deeper, unresolved fault lines:

  *   **Verbal/Conceptual Ambiguity (Especially "Harm"):**
      *   Hart demands "harm," but defining it is contentious. Does it include psychological distress, offense, erosion of trust, or destabilization of institutions? Hart tries to limit it to direct, tangible harms, but this boundary is porous. Devlin effectively argues social disintegration *is* the ultimate harm, making his position seem like a harm principle applied to the collective organism.
      *   **"Social Disintegration":** Devlin's core threat is undefined and empirically vague. What constitutes "disintegration"? How much moral diversity can a society tolerate? This opacity makes his argument resilient but hard to falsify.

  *   **Hidden Empirical Claims:**
      *   **Devlin's Claim:** Does shared morality *actually* function as the essential glue? Is its enforcement necessary for stability? History shows societies can tolerate significant moral pluralism without collapsing. Conversely, rigidly enforcing outdated morality can *cause* social strife.
      *   **Hart's Assumption:** Does decriminalizing "victimless" immorality *really* have minimal social impact? Or does it subtly corrode social trust, norms of reciprocity, or community resilience in ways hard to measure? Hart assumes the answer is generally "no," but it's not self-evident.

  *   **Bedrock Intuitions (The Disgust Factor):**
      *   This is the core, irreducible divide. Should the law *ever* be used to express collective moral condemnation ("symbolise disgust") and reinforce communal identity, *even in the absence of independently verifiable harm to specific others*?
      *   Devlin says **Yes:** Law is an expression of the community's moral identity; suppressing deep moral revulsion *is* necessary to maintain the bonds of society. Disintegration is the harm avoided.
      *   Hart says **No:** Using law to enforce morality for its own sake, based on disgust or offense, is illegitimate paternalism or tyranny of the majority. Coercion requires harm prevention, not moral affirmation.

  **Why the Burden Asymmetry Matters:** It hardens these divides. Devlin's baseline shields existing moral laws from rigorous harm-based scrutiny, appealing to the intuitive "danger" of change. Hart's baseline makes existing moral laws perpetually vulnerable, demanding constant proof they prevent harm, appealing to the intuitive "wrong" of unnecessary coercion. Each side starts with a different presumption of legitimacy.

  **Pathways to Progress (Beyond Stalemate):**

  1.  **Historical Case Studies (Applied Burden Analysis):** Don't just ask *if* change caused harm/disintegration. Analyze *how the burden of proof was framed and shifted* in specific reforms (e.g., decriminalizing homosexuality, adultery, contraception; legalizing assisted dying; drug policy shifts).
      *   Did reformers successfully shoulder Devlin's burden (proving no disintegration)?
      *   Did defenders successfully shoulder Hart's burden (proving tangible harm beyond offense)?
      *   What *evidence* was actually decisive (or ignored) in shifting the legal baseline? This grounds the abstract burden in real political/legal processes.

  2.  **Critical vs. Positive Morality in Legislative Inertia:** Explicitly apply Hart's distinction.
      *   **Positive Morality (Status Quo):** How does inertia (Devlin's baseline) function? Does it reflect genuine widespread belief, vocal minority pressure, institutional capture, or simple path dependency masquerading as essential glue?
      *   **Critical Morality (Reform):** How do reformers argue their case? Do they solely attack the lack of tangible harm (Hart), or do they also engage in moral persuasion to shift the positive morality itself, thereby changing Devlin's baseline? The stall often occurs when reformers *only* use Hartian arguments without addressing the underlying positive morality, leaving the Devlinian "threat" intact in the public/political imagination.

  3.  **Scrutinizing "Disintegration":** Demand greater specificity. Instead of accepting "disintegration" as a monolithic threat, break it down:
      *   What *specific* social goods are allegedly threatened by this *specific* moral change (e.g., trust in institutions, family stability, public order, economic cooperation)?
      *   What is the *mechanism* linking the act to the threat?
      *   Is there evidence this mechanism operates, or are less restrictive means available (education, social support) to protect the goods?

  **Is it Unresolvable?** At the level of *ultimate bedrock intuition* (law as moral expression vs. law as harm-prevention), yes, some fundamental disagreement remains. However, progress *is* possible by:

  *   **Exposing the Burden Asymmetry:** Making it explicit forces participants to defend *why* their preferred baseline and risk allocation are justified, moving beyond automatic appeals.
  *   **Demanding Empirical Rigor:** Challenging vague claims about "disintegration" or assuming minimal impact.
  *   **Focusing on Specifics:** Shifting the debate from abstract "morality vs. liberty" to concrete harms, specific social goods, and the proportionality of legal responses in *this specific context*.

  Your insight about the institutional burden is key. The debate stalls because it's not just *what* law should do, but *who must prove what* when challenging the status quo, reflecting deep-seated, often unspoken, intuitions about social stability, risk, and the state's symbolic role. Recognizing this asymmetry is the first step towards more productive engagement.
