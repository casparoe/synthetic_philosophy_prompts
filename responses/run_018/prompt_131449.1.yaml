  First, I need to establish why the formation/expression distinction is foundational. If that distinction isn’t robust, the other questions crumble. So that’s the anchor. Then, the normative authority question—whether a data-derived will can carry democratic weight—depends on the first point. If formation is essential, then algorithmic "wills" lack authority. The boundary problem (can popular sovereignty be limited?) becomes more urgent once we see algorithmic claims as unlimited and unmediated, but it relies on the first two points.  

