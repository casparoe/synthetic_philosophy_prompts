  I need to design two 250-350 word scenes that meet these requirements. For the public version, refusal would likely be low due to social pressure, with refusers being socially marginal men. The killing would show both peer-influenced compliance and possible excess cruelty. For the private version, refusal should be higher, with younger, more indoctrinated men staying, and the killing showing more voluntary cruelty. The key discriminating feature is the leakproofness of the private offer - if men suspect others might know, it collapses back to the public dynamic.

  After writing the scenes, I'll analyze how each theory predicts the observable differences. Browning's situationism would predict high refusal only when truly private, with refusers being poorly integrated, and remaining killers showing reluctant behavior. Goldhagen's intentionalism would predict low refusal regardless, with young true believers staying, and cruelty appearing spontaneously. The sealed envelope's confidentiality is crucial - any leakage would invalidate the test by reintroducing social pressure.

