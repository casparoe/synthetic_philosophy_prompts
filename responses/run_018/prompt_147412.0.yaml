  ## MEMORANDUM

  **To:** Committee on Institutional Neutrality and Public Partnerships  
  **From:** [Your Name/Position]  
  **Date:** [Date of Circulation - Before Monday]  
  **Subject:** Recommendation Regarding St. Mark's Heritage Covenant Renewal & "Cooperative Establishment" Proposal  

  **Recommendation:** **Reject the current "cooperative establishment" proposal.** Recommend pursuing a **modified agreement** focused on space use and the chaplaincy role, **excluding university-administered payroll deductions.** Negotiate modifications within **2 weeks** for a vote at our next scheduled meeting or a special session before the end of the current term.  

  ### I. Core Issues & Arguments Scrutinized
  1.  **The Payroll Deduction is the Primary Neutrality Concern:** While allowing religious groups to *use* university space (like the Catholic center) is widely accepted as institutional pluralism (passive accommodation), **acting as a collection agent for religious dues fundamentally changes the relationship.** Administering a voluntary "stewardship fee" via payroll, even if opt-in:
      *   **Entangles the University:** It makes the university an active participant in funding a specific religious institution. Our payroll system is a core administrative function; using it for religious fundraising blurs the line between accommodation and endorsement/partnership.
      *   **Creates Perception Issues:** Regardless of intent, it risks appearing as institutional endorsement of St. Mark's or that religious giving is an expected/encouraged part of university affiliation for staff. This perception undermines genuine neutrality.
      *   **Distinguishes from Space Sharing:** Providing space is neutral facilitation. Collecting funds is active financial facilitation for a specific church. This is a significant step beyond current practices.

  2.  **Addressing Corporate Religious Freedom:** St. Mark's argument deserves serious consideration. The claim is that the parish, as an institution with deep historical ties and physical presence, has a legitimate interest in maintaining its institutional identity and ministry within the campus community, beyond just the individual rights of current members.
      *   **Acknowledgment:** The parish's long history and physical presence on university land *do* create a unique institutional relationship. Simply terminating the covenant without considering alternatives could be seen as disregarding this historical partnership and the parish's institutional identity.
      *   **Limits:** However, "corporate religious freedom" does not inherently grant a religious institution the *right* to leverage a public university's administrative systems (like payroll) for its financial support. The university's obligation is to *not obstruct* legitimate religious exercise or presence unreasonably, not to *facilitate its funding* through its own mechanisms. The historical land lease already provides significant institutional presence.

  3.  **England vs. France - Finding Our Middle Ground:**
      *   **England (Establishment Model):** Integrates religion (specifically the CofE) into state institutions (e.g., college chapels, bishops in Lords). Our current practice of *allowing* St. Mark's to occupy land *is* somewhat analogous to the English college chapel model – a historical religious presence accommodated within a secular institution. **However, the proposed payroll deduction goes *beyond* typical English establishment.** Oxford or Cambridge colleges don't collect CofE parish quotas via university payroll for staff. The chaplaincy role proposed is *more* akin to this model.
      *   **France (Laïcité):** Demands strict separation, removing religious symbols and influence from public sphere institutions. Rejecting *any* presence of St. Mark's would align with this. **This is not our current model.** We already accommodate religious groups using space, placing us closer to a pluralistic accommodation model than strict laïcité.
      *   **Our Position:** We currently operate in a space *between* these models – closer to England in terms of accommodating historical religious presence, but without formal establishment. **The payroll deduction pushes us *towards* an active partnership resembling aspects of establishment that exceed our current pluralistic accommodation and neutrality policy.** Rejecting the deduction maintains our established middle ground.

  4.  **The "Negative Secularism" Claim & Student Welfare:** Ending the *specific mechanism* of payroll deductions is not inherently "negative secularism" (hostility to religion). The chaplaincy role (see below) directly addresses student religious welfare. St. Mark's remains free to fundraise directly from its community, including staff and students, using standard methods (mail, online, events). The university facilitating space use already provides significant positive accommodation.

  ### II. The Chaplaincy Role - A Path Forward
  *   The proposal for a **non-voting St. Mark's chaplain on the Student Wellness Advisory Board is distinct and potentially valuable.** This addresses the concern about supporting religious students' wellbeing within the university's existing secular framework.
  *   **This role *can* be compatible with neutrality:** As a non-voting advisor providing perspective on spiritual aspects of student wellness, it functions as expert consultation, similar to other specialists on advisory boards. It directly serves the university's interest in comprehensive student support without endorsing St. Mark's specifically over others (though their historical role justifies *their* appointment to this *particular* advisory slot).

  ### III. Concrete Recommendation & Timeline
  1.  **Reject** the current proposal primarily due to the fundamental neutrality concerns raised by the university acting as a collection agent via payroll for religious dues. This specific mechanism creates unacceptable entanglement.
  2.  **Offer a Modified Agreement:**
      *   **Renew the core covenant/land use agreement** ensuring St. Mark's continued presence, acknowledging its historical role and institutional identity (addressing corporate continuity).
      *   **Formally Approve the Non-Voting Chaplaincy Role** on the Student Wellness Advisory Board, defining its scope as advisory input on spiritual wellbeing.
      *   **Explicitly Exclude University Payroll Collection:** State that while St. Mark's is free to solicit voluntary donations from the university community, the university will not administer or facilitate collection through its payroll or other internal financial systems.
  3.  **Timeline:**
      *   **Circulate this memo by [Date].**
      *   **Vote on Tuesday to REJECT the proposal as presented.**
      *   **Simultaneously, vote to AUTHORIZE the Chair/Vice-Chair to negotiate the modified agreement (land use + chaplaincy role, no payroll) with St. Mark's.**
      *   **Set Deadline:** Negotiations conclude within **2 weeks**.
      *   **Vote:** Bring the finalized modified agreement back to the committee for a vote at our next scheduled meeting or a special session convened before the end of the current academic term. If no agreement is reached by the deadline, the status quo (current lease) continues until resolved or terminated per existing terms.

  **Summary:** The payroll deduction fatally compromises institutional neutrality by making us an active financial agent for one religion. However, St. Mark's historical presence and the potential benefit of the chaplaincy role warrant a modified agreement. By separating these elements and removing the problematic financial mechanism, we can respect corporate continuity and student needs while upholding our neutrality policy and avoiding inappropriate entanglement. We act neither as an established church nor a strictly secular republic, but as a neutral university accommodating pluralism within clear boundaries.

  **Recommended Vote on Tuesday:** **Reject** the St. Mark's "cooperative establishment" proposal as presented. **Approve** authorization for Chair/Vice-Chair to negotiate a modified agreement excluding payroll deductions, with a 2-week deadline.
