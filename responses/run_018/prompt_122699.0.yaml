  Hyperreal comparison. The user suspects their frame is like an ultrafilter. Hyperreal utilitarianism uses a free ultrafilter, which relies on the axiom of choice and isn't constructive. Their frame-relativism might be similar but without a fixed location ordering. The key difference is that hyperreal utilities give frame-free verdicts once an ordering is fixed, while the user's view doesn't. But if the user's frames correspond to ultrafilters, then they inherit the same issues, like non-constructiveness. This is awkward but not fatal, as the user accepts relativity.

