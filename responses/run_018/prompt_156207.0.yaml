  Hmm. The user is clearly frustrated with the lack of progress in this debate since the 70s. They mention that "nobody budges," which suggests they're looking for a resolution or at least a way to move forward. Their hidden need might be to understand if this philosophical problem can be resolved empirically, perhaps through neuroscience or formal models, which aligns with their engineering background.

  I recall that Putnam's argument hinges on the idea that meaning isn't solely in the head because Twin Earth water (XYZ) refers to something different despite identical brain states. Internalists counter by distinguishing between reference and mental content. The user's insight about two different questions under the same term "meaning" seems spot on. But is that the whole story?

  Delving deeper, the disagreement might be more than terminological. Externalists are concerned with how language hooks onto the world—causal chains, social practices. Internalists focus on cognitive mechanisms. These are distinct but interrelated aspects. If neuroscience could show that reference depends on external factors, that might support externalism. But current tech like fMRI lacks the resolution to track microstructural differences in concepts. 

  The user also asks about progress. Philosophical debates like this rarely get "solved," but they evolve. The shift towards two-dimensional semantics or teleosemantics incorporates both internal and external elements. A pluralistic approach acknowledging different aspects of meaning might be the way forward. The user, being an engineer, might appreciate how different system components serve different functions.

  They might also be seeking practical advice on how to approach such debates. Emphasizing that progress comes from refining questions rather than expecting definitive answers could be helpful. Encouraging them to look at contemporary developments in philosophy of mind that integrate cognitive science might satisfy their interest in empirical resolutions.

