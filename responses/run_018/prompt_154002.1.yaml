prompt: |-
  I'm putting together the final exam for my grad philosophy of science seminar and I want one essay question on falsificationism and the demarcation problem, but I'm bored with the usual Popper-vs-verificationism recap that students just memorize and spit back. Could you draft a 90-minute essay prompt that makes them actually apply the concepts instead of recieting them?

  Here's the twist I want built in: invent a fictional research program — call it 'structural resonance therapy' — that operates like this: every time a core prediction fails, the researchers tweak an unobservable 'resonance field' parameter to absorb the anomaly, but every ten years they issue one wildly specific, quantitatively precise forecast that either comes true in dramatic fashion or is flat-out contradicted by the data. The exam question should ask students to evaluate whether this program counts as scientific under Popper's falsifiability criterion, but then push them deeper: they need to explain why Popper's distinction between legitimate auxiliary adjustments and ad hoc immunizing stratagems might actually allow this program through, and then identify where the real demarcation pressure point actually sits — is it falsifiability in principle, the methodological rules governing belt-modification, or the social norms of the research community?

  Please write the question itself, then a model answer of about 600 words, and a marking scheme with five must-hit points totaling 20 marks. For each point list the marks and a one-line note on how students usually botch it. I dont want any bibliographies or citation lists — its a closed-book exam. And please make sure the question cant be answered well just by summarizing Lakatos or Popper from the textbook; the weird fictional case should be doing the real work.
