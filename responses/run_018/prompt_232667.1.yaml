  Looking at the pattern of rulings:
  - For $40k earners: 10% ($4k) required, 25% ($10k) optional
  - For $80k earners: 10% ($8k) required, 30% ($24k) optional
  - For $200k earners: 10% ($20k) required, 25% ($50k) optional

  The new case is $70k income with $20k donation (29%). I need to identify consistent principles behind these rulings.

  Two main principles emerge:
  First, a constant percentage rule: 10% required across incomes, with higher percentages being supererogatory. This fits all cases perfectly.
  Second, a required minimum amount: approximately $4k minimum, but this doesn't explain why higher earners can't be required to give more than 10% since $4k becomes trivial at higher incomes.

  For the $70k/$20k case:
  - Constant percentage: $7k (10%) required, so $20k exceeds requirement
  - Minimum amount: $4k required, so $20k exceeds requirement

  The closest analog is the $80k/$24k case (30% optional). The $70k/$20k (29%) is nearly identical proportionally. Consistency suggests "not required."

  If she says "required," she'd need a progressive principle (like ability-to-pay). If "not required," she confirms the constant percentage rule.

  To test between constant percentage and progressive principles, we could examine someone earning $400k. Constant percentage would say $40k required; progressive might require more. But since all past rulings fit constant percentage without needing progression, that's likely her standard.
answer: |-
  ### 1. Candidate Principles (≈200 words)
  The columnist's rulings suggest two distinct principles that cohere with her decisions:

  - **Constant Percentage Principle (CPP)**: Obligation scales linearly with income. A fixed 10% of income is required, as this threshold holds across all incomes ($4k at $40k, $8k at $80k, $20k at $200k). Donations beyond 10% are supererogatory—admirable but optional—regardless of absolute amount (e.g., $10k at $40k is optional despite being less than $20k at $200k). This implies a flat "moral tax" where sacrifice is proportional, not progressive.

  - **Minimum Sacrifice Principle (MSP)**: Obligation requires a baseline absolute sacrifice, but with an income ceiling. The required amount is consistently ~$4,000 (exactly $4k at $40k, but $8k at $80k breaks this). However, the optional rulings show that once donations exceed both 10% *and* a moderate absolute sum (e.g., $10k at $40k or $24k at $80k), they become non-mandatory. This creates a "soft cap" where high earners aren’t obligated beyond 10% even if easily affordable.

  Both principles explain the data: CPP is simpler, fitting all cases perfectly. MSP requires arbitrary thresholds but captures that 10% alone isn’t sufficient to explain optionality (e.g., why $50k at $200k isn’t required despite being 25%, same as $10k at $40k).

  ---

  ### 2. What Each Principle Says About the New Letter (≈250 words)
  - **Constant Percentage Principle (CPP)**: The required donation for a $70,000 income is 10% ($7,000). The reader’s proposed $20,000 (29%) far exceeds this threshold. Thus, CPP deems it **not required**—consistent with past cases where donations over 10% (e.g., 25–30%) were optional. The principle emphasizes proportionality: since 29% at $70k parallels 30% at $80k (ruled optional), it should be similarly admirable but not obligatory.

  - **Minimum Sacrifice Principle (MSP)**: The required floor is likely between $4,000–$8,000 (based on $4k at $40k and $8k at $80k). $20,000 exceeds this floor. Critically, MSP also incorporates an income-relative cap: donations become optional when they surpass 10% *and* a "significant" absolute sum. Here, 29% at $70k resembles 30% at $80k ($24k), which was optional. Though $20,000 is less than $24k, it is close in magnitude (86% of $24k) and proportionally higher than the 10% benchmark. Thus, MSP also predicts **not required**, as it exceeds both the percentage and absolute thresholds for obligation in past rulings.

  Both principles align in rejecting a requirement for $20,000. CPP focuses solely on the 29% exceeding 10%. MSP emphasizes that $20,000 is materially substantial (near $24k at $80k) and proportionally demanding, triggering the "supererogatory" designation.

  ---

  ### 3. Closest Earlier Case and Best-Guess Answer (≈250 words)
  **Closest Analog**: The $80,000 earner asking about $24,000 (30%) is the strongest parallel. The new case ($70,000, $20,000 or 29%) is nearly identical proportionally (29% vs. 30%) and absolute-amount-adjacent ($20k vs. $24k). The $200k/25% ($50k) case is less comparable due to income disparity, while the $40k/25% ($10k) involves much lower sums.

  **Prediction**: The columnist will rule $20,000 **not required** (admirable but optional). This maintains consistency with all prior optional rulings, where donations over 25% were exempted regardless of income. It also coheres with her rejection of maximizing utility (e.g., not requiring $10k from $40k) and her fixed 10% baseline.

  - **If "required"**: This would commit her to a **progressive principle** (e.g., obligation increases with ability-to-pay beyond proportionality). But this contradicts her past: she never required more than 10%, even from high earners (e.g., $50k at $200k was optional despite being affordable). It would also undermine the $80k/$24k ruling.
    
  - **If "not required"**: This commits her to **CPP** or **MSP**, both of which cap obligation at 10% (or a similar threshold). CPP is the cleaner fit, as MSP’s absolute thresholds ($4k–$8k) are inconsistent with requiring $8k at $80k (not $4k). Her pattern suggests percentage, not absolute sacrifice, drives obligation.

  ---

  ### 4. A Further Case That Would Separate the Live Candidates (≈150 words)
  To distinguish CPP from MSP, pose a case where income is high but the donation is exactly 10% in absolute terms far exceeding past floors:  
  - **Reader earns $400,000; asks if giving $40,000 (10%) is required.**  

    - **CPP** says **required** (it matches the fixed 10% standard).  
    - **MSP** likely says **optional** if it emphasizes absolute sacrifice: $40,000 vastly exceeds the $4k–$8k "minimum" seen in lower-income rulings and could be deemed excessively burdensome in absolute terms. Yet MSP is ambiguous—if it prioritizes percentage, it aligns with CPP.  

  This exposes MSP’s instability: if $40k is optional, it breaks the 10% pattern; if required, MSP collapses into CPP. The columnist’s past 10% requirement at $200k supports CPP, making $40k likely required. A progressive alternative (e.g., requiring >10% from high earners) would need new evidence, as all data points oppose it.
