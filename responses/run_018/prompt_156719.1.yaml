answer: |-
  *(Leans forward, eyes sharp)* Your separation is elegant in theory but collapses under recursion. When Body A enacts Amendment X using Rule 1.0 to *replace* Rule 1.0 itself with Rule 2.0, you claim Body A’s authority flows purely from the *old* enactment under Rule 1.0. But Rule 1.0 ceases to exist the moment Rule 2.0 takes effect. So what authorizes Body A *after* that moment? If you say "the initial ruleset persists implicitly," you’ve smuggled in a meta-rule *outside* the system – precisely the shadow I’m hunting. The new Rule 2.0 contains no backward-looking clause blessing Body A’s act. Under Rule 2.0, Body A might lack authority *retroactively* because Rule 2.0’s criteria for valid enactment could now differ. The "clean layer" becomes a palimpsest.

  *(Taps the table insistently)* Don’t hand-wave hierarchy. Trace the chain: Rule 1.0 authorizes Body A to amend… *including itself*. But when Body A annihilates Rule 1.0 to install Rule 2.0, it destroys the very ladder it climbed. Rule 2.0 is now the sole source of authority. If Rule 2.0 silently assumes Body A’s *continued* legitimacy without explicit reauthorization under *its own terms*, that’s the shadow amendment – an unwritten, parasitic transfer of power embedded in the procedural transition. Your model assumes the enacting body’s authority is transcendent. I say it’s *contingent* on the rule it just erased. Prove Rule 2.0 doesn’t implicitly redefine "Valid Voting Body" by its mere operational silence. **Where in Rule 2.0's text is Body A’s legitimacy reconfirmed?** If it isn’t, you have a sovereign void.
