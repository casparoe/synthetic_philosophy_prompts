  ## Research Proposal: Diachronic Vulnerability and the Hidden Role of Time-Separable Utility  

  **Project Title:** The Temporal Structure of Value in Diachronic Coherence Arguments: Can Money Pumps Survive Interdependent Utility?  

  ### I. Research Question
  **Do standard diachronic vulnerability arguments (e.g., money pumps) critically depend on the assumption of *time-separable utility*, or can they be reconstructed for agents with *interdependent temporal value structures*?**  

  ### II. Context & Gap in Literature
  Diachronic coherence arguments (e.g., money pumps, Dutch books) are foundational in justifying norms like Bayesian updating. They demonstrate that agents violating these norms can be exploited through sequences of trades or choices, leading to sure loss ("pumping"). However, these proofs make a subtle but crucial assumption: **time-separable utility** (TSU). Under TSU, an agent’s utility function aggregates outcomes across time *additively*, with utility at each moment evaluated independently of utilities at other times (modulo discounting).  

  *Why this gap matters*:  
  1. **Unquestioned Assumption**: Formal treatments (e.g., in dynamic choice theory) routinely assume TSU without defending its necessity for coherence arguments.  
  2. **Interdependent Value (IV)**: Real agents often exhibit preferences where *present utility depends intrinsically on future preferences or states* (e.g., regret, identity projects, care for future selves beyond instrumental value). For instance:  
     - *Regret-Aversion*: Utility today declines if a future self will disapprove of current choices.  
     - *Commitment Values*: Present actions derive utility from sustaining future integrity (e.g., "I value acting now so my future self won’t compromise their principles").  
  3. **The Open Problem**: If IV disrupts the logic of money pumps, standard arguments fail to generalize—undermining their universality as justifications for diachronic norms. If not, IV agents face stricter coherence demands.  

  ### III. Approach & Methodology
  We develop a formal framework to test the robustness of money-pump arguments under **IV vs. TSU**, controlling for belief revision coherence:  

  1. **Model Specification**:  
     - **Agents**: Define agents with:  
       - *Coherent* vs. *incoherent* belief revision (e.g., Bayesian vs. update-rule violators).  
       - *TSU*: U(sequence) = Σ δᵗu(xₜ)  
       - *IV*: U(sequence) = f(u(xₜ), u(xₜ₊₁), …) where f is non-separable (e.g., uₜ depends on uₜ₊₁ directly).  
     - **Choice Setting**: Multi-stage decision trees with observable state transitions and trade opportunities.  

  2. **Pump Construction**:  
     For each agent type (TSU-coherent, TSU-incoherent, IV-coherent, IV-incoherent), attempt to construct a money pump by:  
     - Inducing a cycle of preferences (A≻B≻C≻A) across time.  
     - Offering trades that exploit this cycle (e.g., pay to switch from A to B, then from B to C, then pay to revert to A).  

  3. **Key Test**:  
     - Under IV, does an agent’s *current* valuation of a future outcome change *because* their future preference changes? If so, does this block the exploiter’s ability to extract value at each step?  

  *Example IV Mechanism*:  
  > An IV agent who chooses B today *anticipates regretting it tomorrow* if their future self prefers A. This regret reduces the present utility of choosing B, potentially preventing the initial "preference reversal" needed to trigger the pump.  

  ### IV. Expected Results & Significance  
  - **Possible Outcome 1**: Money pumps fail under IV even with belief revision incoherence.  
    *Significance*: Challenges universality of diachronic coherence arguments; suggests rationality norms may be weaker for IV agents.  
  - **Possible Outcome 2**: A generalized money pump succeeds under IV.  
    *Significance*: Reveals new, stronger coherence requirements for agents with interdependent values.  
  - **Theoretical Impact**: Either result forces a reassessment of the foundations of diachronic rationality, showing that the structure of temporal utility—not just belief updating—is central to vulnerability.  

  ### V. Feasibility & Limitations (3-Month Scope)  
  **Strengths**:  
  - Builds on established decision-tree frameworks (e.g., Machina, McClennen).  
  - Focuses on *comparative robustness* (TSU vs. IV) rather than exhaustive taxonomy.  
  - Uses analytical proofs and minimal toy models (e.g., 3-stage trees).  

  **Risks & Mitigation**:  
  1. **Formalizing IV Non-Arbitrarily**:  
     - *Risk*: Interdependence could be modeled ad hoc.  
     - *Mitigation*: Restrict to philosophically motivated cases (e.g., regret, identity) with clear axiomatization.  
  2. **Generalization Beyond Simple Pumps**:  
     - *Risk*: IV might block standard pumps but allow complex variants.  
     - *Mitigation*: Address only classic money pumps; complex cases are beyond scope.  
  3. **Belief-Value Interactions**:  
     - *Risk*: IV might conflate with belief-based state-dependence.  
     - *Mitigation*: Fix beliefs exogenously in models; isolate utility effects.  

  **Deliverable**: A paper proving whether (and how) money pumps require time-separable utility, with implications for rational choice theory.  

  ---  
  **Summary**: This project interrogates a buried premise in diachronic rationality debates. By testing money-pump arguments against agents whose present values depend non-instrumentally on future values, we reveal whether coherence demands hinge on an atomistic view of time—or if vulnerability transcends utility structures. Time-separable utility may be the silent guardian of pumping proofs; its collapse could reshape arguments for diachronic norms.
