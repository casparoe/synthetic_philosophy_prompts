answer: |-
  You've hit on a genuinely fascinating tension between legal doctrine and philosophical aesthetics. Let's dissect the layers without playing along if the premise is flawed:

  ### 1. **The Legal Premise: Representation vs. Functionality**
     - **Doctrine Accuracy**: You're broadly correct about European moral rights (droit moral) distinctions. Systems like France and Germany grant stronger protection against distortion (*droit au respect de l'œuvre*) to works deemed "expressive" or carrying identifiable authorial intent. Lyrics/programmatic music provide concrete hooks for courts to assess "distortion" (e.g., altering lyrics changes meaning). Pure instrumental/ambient works often face higher thresholds for protection, sometimes sliding toward "applied art" or functional categories.
     - **Legal Rationale**: This isn't *inherently* about ontology—it's about **adjudicative practicality**. Courts need objective markers to judge "distortion." Lyrics/programmatic elements offer tangible evidence of authorial intent; abstract soundscapes don’t. The law prioritizes *provable harm to reputation* over metaphysical essence.

  ### 2. **Schopenhauer’s Challenge: Music as Will, Not Representation**
     - Schopenhauer *does* invert the hierarchy: music isn’t representational (like painting/poetry) but a **direct copy of the Will itself**. Melody embodies striving; harmony reflects cosmic tension/resolution. Pure drones (undifferentiated harmony) could indeed mirror the Will’s "blind ground."
     - **Your Insight**: If law protects "representational" music more, it implicitly rejects Schopenhauer’s core thesis. By demoting non-representational music, it assumes music *must* convey ideas/stories to merit protection—directly opposing Schopenhauer’s view that music’s abstraction is its profundity.

  ### 3. **Does the Law Presuppose Representation?**
     - **Yes, but pragmatically, not philosophically**. Copyright law (especially moral rights) evolved around works with discernible authorship and communicable meaning (text, images, narratives). Music with lyrics/program fits this model; ambient soundscapes resist it. The law’s ontology is **instrumentalist**: it asks, *"Can we litigate this?"* not *"What is Art?"*
     - **Hidden Commitment**: The split *does* assume music’s value lies in its capacity to communicate specific content (lyrics, stories, emotions). This clashes with Schopenhauer (and formalism) where music’s essence is *pre-linguistic*.

  ### 4. **Is the Law Doing "Bad Schopenhauerian Metaphysics"?**
     - **No, but it accidentally parallels his hierarchy**:
       - Schopenhauer: Lyrics/programmatic music = degraded (tied to representation); Pure harmony/drones = closer to the Will.
       - Law: Lyrics/programmatic music = higher protection; Drones = lower protection.
     - **Crucial Difference**: Schopenhauer elevates non-representational music; the law demotes it. The legal hierarchy is **anthropocentric** (protecting human expressivity), while Schopenhauer’s is **cosmological** (music channels primal Will). The law’s "deeper" commitment is to *authorship as human intentionality*, not metaphysics.

  ### 5. **Pushing Back: Conflating Doctrine and Aesthetics?**
     - **Valid Concern**: Yes, there’s conflation. Law doesn’t *care* about ontology—it cares about **feasible standards**. Moral rights protect *personality interests*, not artistic truth. Abstract art struggles here because "distortion" is harder to prove, not because it’s ontologically inferior.
     - **Counterpoint**: Your framing exposes how legal categories **smuggle in aesthetic biases**. By privileging "communicative" music, law implicitly endorses a representational theory of art. That *is* a philosophical stance—just an unexamined one.

  ### 6. **Schopenhauer as Legal Critic?**
     A Schopenhauerian could argue:
     > *"The law protects music only when diluted by representation (lyrics/stories), mistaking the shadow for the substance. By weakening protection for pure harmony/drones—which most directly objectify the Will—it privileges art’s weakest form over its strongest."*
     But this would be a critique of law’s *aesthetic blindness*, not its internal logic.

  ### Conclusion
  - **Law’s Premise**: Assumes music requires *communicable intent* for "distortion" to be actionable. This is practical, not metaphysical—but it *does* presuppose a representational theory of artistic value.
  - **Schopenhauer’s Relevance**: Highlights the law’s unspoken bias against non-representational art. The parallel in hierarchies (drones = lower protection / drones = purer Will) is ironic but superficial. Law demotes abstraction for lack of adjudicative tools; Schopenhauer elevates it for metaphysical potency.
  - **Reality Check**: Courts aren’t doing metaphysics—they’re avoiding impossible judgments like *"Does this drone distortion violate the cosmic Will?"* The split reflects **institutional limits**, not philosophical commitments. Yet your quirk reveals how law’s pragmatism enforces an aesthetic hierarchy it never explicitly defends.

  **Verdict**: The law isn’t doing *bad* Schopenhauer—it’s doing *no* Schopenhauer. Its "ontology" is forensic, not philosophical. But you’re absolutely right that this legal distinction inadvertently exposes a deep bias toward representation in how Western law conceptualizes art’s protectable essence.
