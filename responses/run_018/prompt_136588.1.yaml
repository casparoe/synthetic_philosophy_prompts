answer: |-
  Here is the conceptual specification for an adequate theory of residential entitlement, derived from your lived experience and the core tensions in zoning conflicts. The requirements are non-negotiable (*) unless marked as camp-specific.

  ### Core Desiderata for a Theory of "Right to the City" in Land-Use Conflict

  1.  **Distinction: Right to Housing/Residence vs. Right to Exclude from Neighborhood:**  
      *   **Requirement:** The theory must rigorously separate the individual right to secure shelter/a place to live from the claimed collective right of existing residents to exclude newcomers or denser development *from their neighborhood*. Collapsing them legitimizes displacement under the guise of "neighborhood control".  
      *   **Motivating Case:** Your displacement. The building owner exercised a *property right* (conversion) enabled by a public *zoning change* (variance), extinguishing your *residence right*. The NIMBYs opposing infill seek an *exclusion right* ("keep others out") masquerading as a residence right ("protect our homes").  
      *   **Status:** Non-negotiable (*). Collapsing them inherently privileges incumbents and ignores the moral claim of non-residents needing shelter.

  2.  **Incorporating "Exclusionary Amenity Bundling":**  
      *   **Requirement:** The theory must explicitly recognize and normatively reject the mechanism by which restrictive zoning bundles access to high-quality, publicly-funded amenities (schools, parks, transit) with exclusive residential status (SFH ownership), creating de facto private clubs. It must provide a pathway to unbundle amenity access from restrictive housing forms.  
      *   **Motivating Case:** Blocking multi-family infill near high-frequency transit. Residents defend low-density zoning *because* it controls access to the desirable transit amenity (funded regionally/statewide). Their "community character" argument protects exclusive access to a public good.  
      *   **Status:** Non-negotiable (*). Ignoring this mechanism legitimizes publicly-subsidized segregation and wealth extraction.

  3.  **Tension: Local Democratic Control vs. Regional Growth/Mobility Obligations:**  
      *   **Requirement:** The theory must grapple with the fundamental tension: Local democratic processes prioritizing incumbent preferences (stability, character) are structurally incapable of voluntarily fulfilling regional obligations (fair share of housing growth, accommodating mobility needs). It must determine if reconciliation is possible or if one principle must yield.  
      *   **Motivating Case:** Neighborhood council blocking modest multi-family infill despite documented regional housing shortage and transit proximity. Local votes prioritize "stability" (incumbent interests) over regional needs.  
      *   **Status:** Non-negotiable (*). This is the core political conflict. **Hardest Conceptual Work:** Reconciling meaningful local input with enforceable regional obligations is likely *unsatisfiable* under standard majoritarian democracy. Any solution requires procedural innovations limiting pure local veto power over regionally consequential land use near transit/jobs.

  4.  **Consistency with Economic Dynamics (Without Reductionism):**  
      *   **Requirement:** The theory must acknowledge the causal role of supply constraints in escalating prices/rents, the reality (but slowness/imperfection) of filtering, and the potential for induced demand with new infrastructure, *without* reducing justice solely to maximizing supply/efficiency. It must integrate distributive justice concerns (who benefits? who is displaced?) into the economic analysis.  
      *   **Motivating Case:** Upzoning variance leading to luxury conversion (supply constrained high-value area) displaced your family (filtering too slow/imperfect to help). Blocking infill perpetuates constraints, worsening regional affordability.  
      *   **Status:** Non-negotiable (*). Ignoring economics leads to ineffective or counterproductive policy; ignoring justice legitimizes displacement and exclusion.

  5.  **Intergenerational Dimension of "Spatial Lock-In":**  
      *   **Requirement:** The theory must account for the moral weight of accumulated locational privilege (access, equity, political power) held by existing homeowners versus the claims of future residents, current renters, and households currently excluded from the jurisdiction. It must challenge the permanence of this lock-in.  
      *   **Motivating Case:** Long-time homeowners opposing change, leveraging equity/political power gained from decades of exclusionary policies, against renters (like your past self) or younger/future residents seeking access. Their "stability" argument relies on freezing a privileged spatial order.  
      *   **Status:** Non-negotiable (*). Justice is intergenerational; privileging the spatial claims of one generation over all others is unsustainable and inequitable.

  6.  **Boundary: Legitimate Preservation vs. Illegitimate Exclusion:**  
      *   **Requirement:** The theory must provide clear criteria distinguishing legitimate preservation (preventing *direct* physical displacement of vulnerable renters, protecting *genuinely shared* non-substitutable ecological/historical assets) from illegitimate exclusion disguised as subjective concerns (aesthetics, "scale", "compatibility", vague "character").  
      *   **Motivating Case:** NIMBYs invoking "character" and "scale" against modest multi-family infill near transit – lacking specific, verifiable harm to shared assets. Contrast with opposing demolition of *occupied* affordable units or a truly unique historic district.  
      *   **Status:** Non-negotiable (*). Failure enables bad-faith arguments to mask exclusion. **Hardest Conceptual Work:** Defining "genuinely shared" and "non-substitutable" rigorously to avoid the "character" trap.

  ### How Popular Theories Fail Against the Desiderata (Highlighting Key Damage)

  1.  **Market-Libertarian Exclusion (Zoning as Private Covenant Extension):**  
      *   **Core Failure:** Collapses Requirement 1 (Right to Residence vs. Right to Exclude) entirely. Treats zoning powers as mere extensions of private property rights, legitimizing exclusionary amenity bundling (Req 2) and spatial lock-in (Req 5) as natural market outcomes. Ignores the public nature of infrastructure enabling value (Req 2) and regional obligations (Req 3). Scores well only on Req 4 (Economics), but reductively.
      *   **Most Damaging Failure:** Utterly fails **Requirement 1**. Makes displacement and exclusion inherent rights, morally nullifying the claims of non-owners/outsiders.

  2.  **Progressive Inclusionary-Zoning/YIMBY Supply (State Mandates + Safeguards):**  
      *   **Core Failure:** Struggles profoundly with **Requirement 3 (Local vs. Regional)**. Relies on state preemption to overcome local vetoes, inherently limiting meaningful local democratic input and fueling backlash. Often weak on distinguishing legitimate/illegitimate preservation (Req 6), sometimes dismissing *all* preservation concerns as NIMBYism. Anti-displacement safeguards (Req 6 legitimacy) are crucial but complex to implement effectively without stifling supply (Req 4 tension).
      *   **Most Damaging Failure:** **Requirement 3** poses an existential challenge. Its solution (state override) often feels like a democratic deficit, making sustained legitimacy difficult.

  3.  **Lefebvrian "Right to the City" (Participatory Production of Space):**  
      *   **Core Failure:** Lacks operational mechanisms consistent with **Requirement 4 (Economic Dynamics)**. Prioritizing participatory processes (often locally focused) can be slow, vulnerable to incumbent capture (exacerbating Req 3 tension & Req 5 lock-in), and struggle to generate sufficient, timely housing supply at scale. Can be vague on distinguishing legitimate/illegitimate exclusion (Req 6), potentially empowering local majorities to exclude. Strong on Req 1 & Req 5 conceptually.
      *   **Most Damaging Failure:** Struggles with **Requirement 4**. Its focus on process can be ineffective at materially addressing acute housing shortages and the economic drivers of displacement/inequality in a timely manner within complex market systems.

  ### Hardest Unsatisfiable Tension
  The most profound conceptual challenge lies in **Requirement 3 (Local Democratic Control vs. Regional Obligations)**. Under standard majoritarian democratic models where local jurisdictions have sovereign land-use authority, these are fundamentally *unsatisfiable*. Genuine local control empowers incumbents to block regionally necessary development; enforcing regional obligations inherently limits local democratic sovereignty. Any adequate theory must either:
  *   **Radically redefine local democracy:** E.g., grant non-residents/regional representatives formal voice/veto in local land-use near transit/jobs (procedural innovation).
  *   **Establish enforceable supra-local frameworks:** With clear metrics ("fair share") and limited local discretion for compliance, accepting a reduction in pure local sovereignty.
  *   **Reconstitute the "local" polity:** Along functional (e.g., transit-shed) rather than municipal boundaries, which is politically monumental.

  This core tension necessitates trade-offs no popular theory comfortably resolves, demanding the hardest conceptual and institutional work. Your theory must confront this head-on, acknowledging that perfect harmony is impossible and prioritizing mechanisms that minimize democratic deficits while maximizing housing justice across space and time.
