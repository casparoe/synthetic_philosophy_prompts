  Here’s a simulation activity designed to meet your goals, followed by the structured JSON summary:

  ---

  ### **Activity: The "Island Charter" Simulation**  
  **Total Time:** 75 minutes (including setup/debrief)  
  **Materials:** Whiteboard, markers, index cards (3 colors), timer.  

  #### **Setup (5 min)**  
  - Divide students into 3 groups of 6. Label groups: **Founders**, **Generation 2**, **Generation 3**.  
  - Hand each group colored index cards:  
    - **Founders:** Blue cards (for drafting rules).  
    - **Gen 2/3:** Yellow cards (for proposals), Red cards (for vetoes).  
  - Explain: *"You’re settlers on a new island. Today, you’ll create rules for future resource decisions. Follow only what’s written on your cards."*  

  ---

  ### **Phases**  
  1. **Founders’ Charter (15 min)**  
     - *What happens:*  
       - Founders receive a blue card: *"Create 1 rule for how future generations must allocate island resources (e.g., ‘60% of land for farming’). Also, create an amendment rule (e.g., ‘Rule changes need 5/6 votes’). Write both on the whiteboard."*  
       - They must agree internally by simple majority to finalize rules.  
     - *Intended effect:* Students create an entrenched rule and a strict amendment process, experiencing the desire to bind future decisions.  

  2. **Generation 2’s Dilemma (20 min)**  
     - *What happens:*  
       - Gen 2 receives a yellow card: *"A storm ruined crops. You want to reallocate farming land to build storm shelters. Propose a change using Founders’ amendment rule."*  
       - Gen 3 receives red cards: *"You represent island traditionalists. Each of you holds 1 veto (red card). Veto if amendment doesn’t meet Founders’ rule."*  
       - Gen 2 must persuade Gen 3 to approve their change. Votes are public.  
     - *Intended effect:* Gen 2 faces predictable weakness (crisis tempts short-term solutions), but the amendment rule forces them to negotiate with a minority (Gen 3).  

  3. **Generation 3’s Rebellion (20 min)**  
     - *What happens:*  
       - Gen 3 receives a yellow card: *"You believe the Founders’ rule is outdated. Propose changing it to prioritize new tech over farming."*  
       - Roles reverse: Gen 2 now holds red veto cards and must enforce the amendment rule.  
       - Gen 3 tries to pass their amendment under the Founders’ strict rule.  
     - *Intended effect:* Gen 3 experiences dead-hand frustration—they sincerely want change but are blocked by past procedures they reject.  

  ---

  ### **Debrief (15 min)**  
  **Guiding Questions:**  
  1. *"Founders: Why make amendment rules so strict?"* → Link to **precommitment logic**.  
  2. *"Gen 2: Did the rule help or hurt during the storm?"* → Contrast **weakness of will** (crisis temptation) vs. **changing values** (Gen 3’s tech shift).  
  3. *"Gen 3: How did it feel to be blocked by rules you didn’t create?"* → Highlight **dead-hand objection**.  

  **Concept Mapping:**  
  - Ulysses contracts ≈ **Gen 2’s crisis** (binding against predictable impulsivity).  
  - Constitutional entrenchment ≈ **Gen 3’s rebellion** (binding against evolving values).  
  - Dead-hand problem = **Gen 3’s veto frustration** (past overriding present preferences).  

  ---

