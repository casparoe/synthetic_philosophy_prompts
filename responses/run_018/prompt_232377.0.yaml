  ### **Key Design Notes**  
  - **Why it works:**  
    - Students *discover* entrenchment mechanics organically (Founders self-impose strict rules; later groups hit barriers).  
    - Role-switching (Gen 2 ↔ Gen 3) forces them to defend rules they previously resisted.  
    - Color-coded cards create tangible "procedural friction."  

  - **What to emphasize in debrief:**  
    > *"Ulysses contracts assume future selves share your goals but lack willpower. Constitutional entrenchment assumes future selves might reject your goals. Gen 2 faced weakness; Gen 3 faced a values clash. Both reveal the dead-hand problem: rules outliving their creators."*  

  - **First-run tip:** If groups stall, use the timer aggressively. The pressure amplifies frustration with constraints—which fuels the debrief!
