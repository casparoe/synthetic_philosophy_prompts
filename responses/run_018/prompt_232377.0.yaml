prompt: |-
  I teach an upper-level political philosophy seminar with about 18 students; sessions run 75 minutes. We have just finished a unit on Ulysses contracts and constitutional precommitment, and I want to replace one of the lecture-discussion days with a structured simulation. Last year I tried running the topic as a free-floating hypothetical (should a constitutional amendment require more than a majority?), and it fell flat: students could already name the standard positions and nothing about their view moved. What I want is an activity where they actually experience the pull of binding a future collective self, the way an entrenched rule turns what the current majority wants into a question the majority cannot settle by wanting it, and the force of the dead-hand worry from the inside, as someone who sincerely prefers to change a rule finds that the rule was built precisely so that their preference does not count. One design I have been toying with: a multi-round budget or constitutional convention game in which an early round can, by supermajority, adopt a rule that later rounds cannot easily amend, and a later round is put in the position of genuinely preferring to change it. But I would rather the students construct or fall into the mechanism themselves than have me announce it, and I am open to better mechanics. Constraints: no lecture up front, no technical vocabulary until the debrief, no real money, and it must run with only paper, a whiteboard, and index cards, all within the 75 minutes including setup and debrief. By the end, the students should be able to distinguish binding against predictable weakness of will from binding against future changes in values, and to say which of those better describes the Ulysses case and which better describes constitutional entrenchment. The debrief should map specific moments in the activity onto that distinction and onto the dead-hand objection, say what will predictably go wrong the first time I run it and how to handle it, and be honest about what the simulation cannot reproduce and so I will have to supply myself.

  After the runnable activity and debrief, include a brief structured summary as a JSON object with these fields: "phases" (an array, each element an object with keys "name", "duration_minutes", "what_happens", and "intended_effect"); "concept_map" (an array, each element an object with keys "moment", "concept", and "debrief_prompt"); "predictable_failures" (an array, each element an object with keys "failure", "likely_cause", and "fix"); and "cannot_reproduce" (a string naming the single most important thing the activity cannot embody and that I must supply).
reasoning: |-
  We are designing a simulation activity for a political philosophy seminar on Ulysses contracts and constitutional precommitment. The goal is to have students experience the tension between binding a future self (or collective) and the "dead-hand" objection, without using technical terms during the activity. The activity should run within 75 minutes, including setup and debrief, using only paper, whiteboard, and index cards.

  Key learning objectives:
  1. Experience the pull of binding a future collective self (entrenched rule makes current majority's preference insufficient to change a rule).
  2. Feel the force of the dead-hand worry (when someone sincerely wants to change a rule but the rule was designed to ignore that preference).
  3. Distinguish between:
     a. Binding against predictable weakness of will (like Ulysses) 
     b. Binding against future changes in values (like constitutional entrenchment)

  Constraints:
  - No lecture up front.
  - No technical vocabulary until debrief.
  - No real money.
  - Must run with paper, whiteboard, index cards.

  Proposed activity: A multi-round "Constitutional Convention" game with two phases. The convention will draft rules for a simple decision-making process (e.g., allocating resources or choosing a policy) and then later try to amend those rules.

  Structure:
  1. **Setup (5 minutes)**: Divide the class into 3 groups (each representing a "generation" at the convention). Each group has 6 students (if 18 total). 
     - Group 1: Founding Generation (sits together)
     - Group 2: Future Generation 1 (sits together)
     - Group 3: Future Generation 2 (sits together)

     Explain that they are at a convention to set up the rules for a society. They will have three sessions (rounds) at the convention. The first session is for the founders, the second for the first future generation, and the third for the second future generation.

  2. **Round 1: Founding Generation (15 minutes)**
     - Task: Founders must draft a constitution that sets:
        a. The procedure for making decisions in Round 2 and Round 3 (e.g., how to allocate a fixed set of resources or choose a policy). 
        b. The amendment rule for changing the constitution in future rounds.
     - Constraints: They must include an amendment rule that requires more than a simple majority (e.g., 2/3 or 3/4) to change the constitution. They can also set the decision rule for ordinary decisions (e.g., majority, supermajority). 
     - They write the constitution on the whiteboard (or on a large paper) and must agree by a specified threshold (say, 5 out of 6, to simulate a high consensus).

  3. **Round 2: Future Generation 1 (15 minutes)**
     - Task: This generation must make an ordinary decision (e.g., allocate a budget of 100 points to three categories: Education, Defense, Environment) according to the rules set in Round 1. 
     - Additionally, they are presented with a new issue: a situation that the founders did not anticipate (e.g., a pandemic requiring emergency funds). They might want to amend the constitution to handle this, but they must use the amendment rule set by the founders.
     - The twist: The new issue might require a reallocation that conflicts with the founders' rules.

  4. **Round 3: Future Generation 2 (15 minutes)**
     - Task: This generation faces a different challenge: they have a strong preference for a policy that the founders explicitly prohibited or made very hard to change (e.g., the founders might have entrenched a bill of rights that includes a right to free speech, and now Future Generation 2 wants to restrict speech in certain contexts). 
     - They must try to change the constitution to allow this, but the amendment rule is difficult.

  5. **Debrief (25 minutes)**: 
     - First, ask the students to recount their experiences in each round. Focus on how they felt when they couldn't change a rule even though they had a majority. 
     - Then, introduce the concepts: 
          - Ulysses contracts (binding against weakness of will) vs. constitutional entrenchment (binding against future changes in values).
          - The dead-hand problem (the frustration of being bound by past rules).
     - Map moments from the activity to these concepts.

  Now, let's design the details to ensure the intended tensions are felt.

  To create the distinction between Ulysses (weakness of will) and constitutional entrenchment (changing values), we need to design the scenarios appropriately.

  For Round 2: The "new issue" (pandemic) might be something that the founders could have anticipated but didn't, and the current generation might be tempted to act against their long-term interests (like Ulysses). But note: we want to avoid technical terms. So, we can frame it as a crisis that requires immediate action, and the current generation might want to, say, borrow from the future (which the founders had prohibited because they knew it would be tempting in a crisis but bad in the long run). This would model weakness of will.

  For Round 3: This should model a change in values. For example, the founders might have entrenched a right to free speech because they believed it was fundamental, but now the future generation has a different view (e.g., they believe that hate speech should be banned for the sake of social harmony). This is a genuine change in values.

  But note: we don't want to lecture, so the instructions must be embedded in the scenario cards.

  How to run without giving away the distinction? We can have index cards with the scenario for each round.

  **Materials**:
  - Index cards for each group in each round (with instructions and any scenario details).
  - Whiteboard for writing the constitution and recording decisions.

  **Setup**: 
  - Before class, prepare index cards for each round and group.
  - Divide the room into three areas for the three groups.

  **Detailed Phases**:

  ### Phase 1: Introduction and Setup (5 minutes)
  - What happens: The instructor explains that the class will simulate a constitutional convention with three sessions. The class is divided into three groups (Founders, Future Generation 1, Future Generation 2). Each group will have a turn to draft the constitution and make decisions. The goal is to create a stable society.
  - Intended effect: Students understand the group assignments and the basic flow.

  ### Phase 2: Round 1 - Founding Generation (15 minutes)
  - What happens: 
     - The Founders group receives an index card with their task: 
          "Your task is to draft a constitution for the society. The constitution must include:
           1. A decision rule for ordinary laws (e.g., how to allocate the annual budget). For example, majority vote? Supermajority?
           2. An amendment rule for changing this constitution. It must require more than a simple majority (e.g., 2/3 or 3/4) to amend.
           You must agree on the constitution by at least 5 out of 6 votes. Once set, it will bind future generations.

           Also, consider: You know that in a crisis (like a natural disaster or war), people might be tempted to make short-sighted decisions (e.g., borrowing too much from the future). How can you protect against that? 

           Also, you believe strongly in certain fundamental rights (e.g., free speech, property rights) that should not be easily changed. How can you protect them?

           Write your constitution on the whiteboard."
     - The group discusses and drafts the constitution. The instructor may help by writing on the whiteboard as they decide.
  - Intended effect: Founders create a constitution with an entrenched amendment rule and possibly some entrenched provisions (like a bill of rights or a balanced budget requirement). They experience the desire to bind the future.

  ### Phase 3: Round 2 - Future Generation 1 (15 minutes)
  - What happens:
     - The Future Generation 1 group receives an index card:
          "You are now the decision-makers 20 years later. You must make two decisions:

          Decision 1: Allocate the annual budget (100 points) among three areas: Education (E), Defense (D), and Environment (Env). Use the decision rule set by the founders.

          Decision 2: A pandemic has struck! You need to reallocate resources to handle it. The founders did not allocate any points for health emergencies. You have two options:
            Option A: Borrow 20 points from next year's budget (which will leave next year with only 80 points) to create a Health Emergency fund.
            Option B: Reallocate from the current budget, but the founders required that no category can be cut by more than 10 points without a supermajority (or some rule they set). 

          However, note: the founders included a balanced budget requirement in the constitution (if they did) or a prohibition on borrowing. To change that, you would need to amend the constitution using the amendment rule.

          You must first try to act within the constitution. If you want to change the constitution, you must attempt an amendment (which requires the supermajority)."

     - The group discusses and tries to act. They might be tempted to borrow (which is prohibited) and then try to amend the constitution to allow borrowing, but the amendment rule may be too hard to meet in time.
  - Intended effect: They experience a situation where they want to act against a rule that was designed to protect against weakness of will (like Ulysses). They feel the frustration of being bound by the past, but also the rationale for the rule.

  ### Phase 4: Round 3 - Future Generation 2 (15 minutes)
  - What happens:
     - The Future Generation 2 group receives an index card:
          "You are now 50 years later. Your society faces a new challenge: rising social tensions due to hate speech. Your generation believes that free speech should be limited to prevent harm. However, the founders entrenched a Bill of Rights that includes: 'Congress shall make no law ... abridging the freedom of speech.' 

          Your task: You want to pass a law that bans hate speech. But the founders made the Bill of Rights very hard to change (requiring the amendment rule they set). 

          You must decide: 
            - Try to amend the constitution to allow limits on speech? 
            - Or, find a way around it? 

          Note: The constitution also says that any law conflicting with the Bill of Rights is void. You must follow the rules set by the founders."

     - The group discusses and tries to act. They might be unable to get the supermajority to amend the constitution (if there are holdouts who support free speech). 
  - Intended effect: They experience the dead-hand problem: they are bound by past values they no longer share. This contrasts with Round 2 (which was about weakness of will).

  ### Phase 5: Debrief (25 minutes)
  - What happens: 
     - The instructor leads a discussion:
          1. Ask each group to share their experience: 
              - Founders: Why did you set the rules the way you did?
              - Future 1: How did it feel when you faced the pandemic? Could you act as you wanted?
              - Future 2: How did it feel when you tried to change the speech rule?
          2. Introduce the concepts without jargon: 
              - "In the pandemic, you knew what the right thing was in the long run, but the immediate pressure made you want to break the rule? That's like Ulysses tying himself to the mast to avoid the sirens' call."
              - "In the hate speech example, you genuinely changed your mind about what is right? That's a change in values. The founders couldn't predict that, but they bound you anyway."
          3. Then, present the technical terms and map the activity to them:
              - Ulysses contract: binding against predictable weakness of will (Round 2).
              - Constitutional entrenchment: binding against future changes in values (Round 3).
              - Dead-hand objection: the frustration of being bound by the past in Round 3.
          4. Highlight the distinction: In Ulysses, the future self shares the same values but is weak; in constitutional entrenchment, the future self has different values.
  - Intended effect: Students articulate the two types of binding and the dead-hand problem, using the simulation as a reference.

  **Predictable Failures**:
  1. Failure: The founders don't create a sufficiently entrenched rule.
     - Likely cause: They don't understand the need for entrenchment or they are too lenient.
     - Fix: The instructor can nudge them by reminding them of the scenarios (crisis and changing values) and the need to protect against short-termism and protect fundamental rights.

  2. Failure: The future generations don't attempt to change the constitution and instead just break the rules.
     - Likely cause: They might not feel bound by the simulation or want to rebel.
     - Fix: The instructor can step in as a "judicial authority" to remind them that the constitution is binding and they must follow the rules they inherited.

  3. Failure: The groups run out of time.
     - Likely cause: Discussion takes too long.
     - Fix: Use a timer and enforce strict time limits. Have the instructor facilitate to keep things moving.

  **What the activity cannot reproduce**:
  - The activity cannot fully reproduce the gravity and long-term consequences of real constitutional entrenchment. In reality, constitutions bind for centuries and affect millions, but in the simulation, it's a game. The instructor must supply this gravity by emphasizing the real-world stakes and historical examples.

