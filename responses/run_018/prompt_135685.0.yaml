  Hey — quick calibration check. What's your actual credence that greedy reductionism collapses once you apply Dennett's crane/skyhook framework rigorously to evolutionary explanations of normative cognition? I think any bottom-up story about moral judgment smuggles in funtional teleology that behaves like a skyhook, which means the greedy reductionist either eliminates the phenomenon or quietly stops being greedy.

  Please decompose:
  - P(A): the crane/skyhook distinction is sharp and doesn't blur at the margins.
