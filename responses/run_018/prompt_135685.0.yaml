  - P(C): that selection counts as a hidden skyhook rather than a legitimate crane.
  - P(D): if C holds, greedy reductionism is self-undermining in this domain.

  Give me rough probabilites for A through D, combine them into one overall number, and say which term you're least confident in. Then tell me what kind of evidence — maybe about infant moral develpment lacking selective scafolding — would shift your number the most. No citations needed, just reasoning.
