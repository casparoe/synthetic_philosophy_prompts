  Hey, I'm prepping a lecture on democratic legitmacy and there's this conceptual knot I want to untangle. Can you lay out the most important implictaions of constitutional monrachy—specifically the Scandinavian model where the king is technically head of state but hasn't exercized real veto in decades—for theories of popular sovereignty? I'm especially hung up on the 'dormant power' problem: if the monarch retains formal authority that's constitutionally available but politically dead, does that undermine the claim that sovereignty resides fully with the people, or is it just harmless symbolic residue? Don't just replay the usual UK comparison; I want to know whether this dormant authority creates a real conceptual tension for democratic theory that we'd miss in fully republican systems. And does the Japanese case complicate it differently because of the emperor's religious-symbolic role? Keep it conceptual, not a history lesson, and don't worry about citing specific statutes.
