prompt: |-
  I've been reading around the cognitive and evolutionary study of religion, and every account I try seems built around one pet case — a costly initiation ritual, the historical emergence of moralising gods, cargo cults, whatever — so I want to nail down the spec before reading any more. Give me the desiderata a naturalistic theory of religion has to meet to count as adequate: not just a just-so story about origins, but a full explanation of a recurrent human phenomenon. I want the phenomena it must explain, with the case or consideration behind each (universality with radical variability in content; costly and fitness-reducing practices; why people act on professed beliefs instead of merely stating them; moralising, punishing gods being common but not universal and looking historically recent; afterlives and supernatural punishment; how beliefs stabilise and spread across generations); the distinctions it cannot collapse (explaining belief vs assessing whether the beliefs are true, origin vs maintanence, individual cognition vs cultural transmission, by-product vs adaptation, proximate vs ultimate cause); and the behavioural and cognitive results it can't contradict (hyperactive agency detection, the memorability of minimally counterintuitive ideas, credibility-enhancing displays, costly signalling, the link between moralising gods and large complex societies). For each requirement, mark whether it's non-negotiable or just the preferrence of one camp. Then flag any pair of desiderata you suspect can't be jointly satisfied — I particularly want to know whether a theory can stay neutral on the truth of the religious claims while also being a genuinely debunking explanation, because those two feel as though they pull in opposite directions. And tell me which single requirement would knock out the most existing accounts. Keep any scorecard of current theories brief; the list is what I'm actually after.

  Lead with the bottom line in the first sentence — for this, your verdict on which requirement does the most exclusionary work and whether any pair is unsatisfiable — then give the reasoning. No preamble and don't restate the question.
reasoning: |-
  Alright, let's tackle this user's query. They're diving deep into the cognitive and evolutionary study of religion and want a comprehensive list of desiderata for a naturalistic theory. First, I need to make sure I understand all their points. They mentioned phenomena like universality with variability, costly practices, why people act on beliefs, moralizing gods, afterlives, belief transmission. Also, distinctions like belief explanation vs truth assessment, origin vs maintenance, individual vs cultural, by-product vs adaptation, proximate vs ultimate causes. Plus, behavioral results like HADD, MCI, CREDs, costly signaling, and moralizing gods' link to complex societies.

  The user is clearly frustrated with single-case theories and wants a robust framework. They’re probably an academic or a serious enthusiast, given the depth of their references. Their explicit need is a checklist to evaluate theories, but their deeper need might be to find a theory that avoids reductionism and handles the complexity of religion comprehensively. They also seem concerned about the tension between explaining beliefs neutrally and debunking them, which is a philosophical puzzle.

  I need to structure the response to hit all their points. Start with the bottom line: the exclusivity of the belief-action gap and the tension between neutrality and debunking. Then list each desideratum with its necessity and the case behind it. For phenomena, distinctions, and behavioral results, mark each as negotiable or not. Highlight which pairs conflict, especially the neutrality-debunking one. Also, identify the requirement that disqualifies most theories—likely the belief-action gap because many accounts don't address why people act on beliefs beyond stating them.

  Check if all their mentioned points are covered. Universality with variability—non-negotiable. Costly practices—non-negotiable. Belief-action gap—non-negotiable. Moralizing gods—negotiable. Afterlives—negotiable. Transmission stability—non-negotiable. Distinctions: belief vs truth—non-negotiable, origin vs maintenance—negotiable, individual vs cultural—non-negotiable, by-product vs adaptation—negotiable, proximate vs ultimate—non-negotiable. Behavioral results: HADD, MCI, CREDs, costly signaling—all non-negotiable. Link to complex societies—negotiable.

  The belief-action gap is key because many theories (e.g., adaptationist or by-product) might explain origins but not why people invest in costly actions. CREDs are part of it, but the gap is broader. The tension between neutrality and debunking is tricky. Naturalistic theories assume falsehood, but neutrality is methodological. However, explaining persistence might imply falsehood, creating tension. This is a philosophical issue that might not have a resolution within empirical theory.

  Also, check if any other pairs conflict. Maybe universality vs content variability? But theories can handle both through cognitive mechanisms and cultural evolution. Costly practices and fitness reduction might conflict with adaptation, but signaling theories resolve that. The main conflict is indeed the neutrality-debunking tension.

  Finally, ensure the bottom line is clear: the belief-action gap excludes many theories, and the neutrality-debunking tension might be unresolvable. Keep the scorecard brief as requested, just mentioning major theories without deep dives.
answer: |-
  **Bottom line:** The most exclusionary requirement is explaining the **belief-action gap** (non-negotiable), as most accounts fail to adequately bridge why professed beliefs drive costly actions rather than cheap talk. The pair of **methodological neutrality on truth** and providing a **genuinely debunking explanation** creates significant tension but isn't strictly unsatisfiable; it requires careful framing.

  **I. Phenomena to Explain (With Case/Consideration & Necessity):**
  1.  **Universality with Radical Content Variability:** Religion exists in all known human societies, but doctrines, rituals, and supernatural concepts vary enormously (e.g., monotheism vs. animism, ancestor worship vs. impersonal forces). *Case:* Human ubiquity vs. ethnographic diversity. **Non-negotiable.**
  2.  **Costly & Fitness-Reducing Practices:** Adherents engage in behaviors imposing significant costs (time, resources, risk, reproduction) without obvious material payoffs (e.g., celibacy, fasting, extreme asceticism, blood sacrifice, martyrdom). *Case:* Observed behaviors contradicting straightforward fitness maximization. **Non-negotiable.**
  3.  **The Belief-Action Gap (Why Act, Not Just State):** Individuals *act* on supernatural beliefs in costly ways, often consistently over time, rather than merely professing them verbally. *Case:* The disconnect between the ease of professing belief and the difficulty/expense of consistent behavioral commitment (e.g., enduring painful rituals, foregoing opportunities). **Non-negotiable.**
  4.  **Historical Pattern of Moralising, Punishing Supernatural Agents:** Beliefs in powerful gods who monitor and punish moral transgressions are widespread *but* appear strongly linked to the rise of large-scale, complex, anonymous societies and may be historically recent. *Case:* Cross-cultural surveys & historical/anthropological evidence (e.g., absence in many small-scale societies, emergence with agriculture/states). **Negotiable** (Some theories downplay this).
  5.  **Prevalence of Afterlives & Supernatural Punishment:** Concepts of post-mortem consequences (reward/punishment) tied to behavior in life are extremely common. *Case:* Near-universal feature across diverse traditions. **Negotiable** (Core to some theories, less central to others).
  6.  **Stabilization & Transmission of Beliefs:** How complex, often counter-intuitive, religious ideas stabilize within groups and spread faithfully across generations despite lacking direct empirical verification. *Case:* The existence of enduring religious traditions. **Non-negotiable.**

  **II. Distinctions That Must Be Maintained (With Necessity):**
  1.  **Explaining Belief (Descriptive) vs. Assessing Truth (Normative):** A naturalistic theory explains *how* and *why* beliefs arise and persist, not whether the supernatural entities/claims *actually* exist. *Case:* Fundamental to naturalism; conflating them is the "genetic fallacy". **Non-negotiable.**
  2.  **Origin (How it started) vs. Maintenance (How it persists):** The initial drivers may differ significantly from the mechanisms sustaining the phenomenon over time. *Case:* Many "origin stories" fail to explain long-term stability/persistence. **Negotiable** (Highly preferred, some theories blur).
  3.  **Individual Cognition (How minds generate/process ideas) vs. Cultural Transmission (How ideas spread/evolve in populations):** Requires integrating psychological mechanisms with population-level dynamics. *Case:* Beliefs exist in minds *and* propagate through culture. **Non-negotiable.**
  4.  **By-product (Spandrel) vs. Adaptation (Selected Function):** Is religion primarily a side-effect of evolved cognitive systems (e.g., HADD) or was it directly selected for due to group benefits (e.g., cohesion)? *Case:* Core debate in evolutionary approaches. **Negotiable** (Key distinction, theories take sides).
  5.  **Proximate Cause (Mechanism) vs. Ultimate Cause (Evolutionary Function):** What are the immediate psychological/social mechanisms (proximate) vs. the evolutionary reasons why those mechanisms exist (ultimate)? *Case:* Standard levels of analysis in biology. **Non-negotiable.**

  **III. Behavioral/Cognitive Results It Can't Contradict (With Necessity):**
  1.  **Hyperactive Agency Detection (HADD):** The human tendency to perceive agency (intentional action) in ambiguous stimuli, even when none exists. *Case:* Experimental psychology (e.g., seeing faces in clouds, jumping at noises). **Non-negotiable** (Core cognitive foundation).
  2.  **Memorability of Minimally Counterintuitive (MCI) Ideas:** Concepts that violate a small number of intuitive ontological expectations (e.g., a talking tree, an invisible person) are more memorable than entirely intuitive or maximally counterintuitive concepts. *Case:* Memory recall experiments. **Non-negotiable.**
  3.  **Credibility-Enhancing Displays (CREDs):** Costly or hard-to-fake actions by models (e.g., ritual participation, sacrifice) are crucial for observers to infer genuine belief, making cultural transmission of commitment more likely. *Case:* Experiments on cultural learning, ethnographic observation. **Non-negotiable** (Critical for belief-action gap & transmission).
  4.  **Costly Signalling:** Engaging in costly behaviors can reliably signal unobservable qualities (e.g., commitment, strength) to others within a group. *Case:* Evolutionary signaling theory, observations of rituals. **Non-negotiable** (Key mechanism for costly practices & group cohesion).
  5.  **Link Between Moralising Gods and Large, Complex, Anonymous Societies:** Belief in supernatural punishment/monitoring correlates strongly with societal scale, complexity, and anonymity. *Case:* Cross-cultural databases (e.g., Seshat), historical analysis. **Negotiable** (Strong evidence, but some theories argue it's epiphenomenal).

  **Key Tension: Neutrality vs. Debunking**
  *   **The Pull:** Methodological neutrality requires suspending judgment on the *truth* of supernatural claims. A naturalistic *debunking* explanation, however, typically shows how beliefs arise and persist *via mechanisms unrelated to their truth* (e.g., cognitive biases, social functions). This *implies* the beliefs are not justified by evidence of the supernatural, even if not explicitly stating "false".
  *   **Is it Unsatisfiable? Not strictly.** A theory can rigorously describe the causal, natural mechanisms (cognitive, evolutionary, cultural) underlying belief formation/persistence *without* making a metaphysical claim about God's non-existence. The "debunking" force comes from demonstrating sufficient natural causes, making supernatural causes seem superfluous *for the purpose of explanation*. However, it remains philosophically neutral on ultimate truth while being empirically debunking regarding the *sources* and *reliability* of the beliefs. The tension arises in interpretation, not necessarily in the theory's formal structure.

  **Theories Knocked Out by the Belief-Action Gap Requirement:**
  This requirement critically challenges:
  *   **Pure By-Product/Cognitive Theories:** Explain belief origins (HADD, MCI) but struggle to explain costly *action* based on those beliefs without adding social mechanisms (CREDs, signaling).
  *   **Naive Memetics:** Explains transmission of ideas but doesn't explain why costly *actions* persist as part of the "meme package".
  *   **Some Group Selection/Adaptationist Accounts:** May posit benefits but often fail to detail the *psychological mechanisms* ensuring individuals *internalize* belief sufficiently to act costily (e.g., how does "group cohesion" translate to an individual fasting?).
  *   **Purely Functionalist Theories (e.g., "opiate of the masses"):** Explain why elites might promote religion, but not why the masses genuinely believe *and act* on it.

  **Brief Scorecard (How Major Approaches Fare):**
  *   **Cognitive By-Product (e.g., Boyer, Atran):** Excels at origins (HADD, MCI), universality/variability, proximate cognition. Weak on costly action, maintenance/transmission mechanisms, historical patterns of moralizing gods. Belief-action gap is a major challenge.
  *   **Cultural Evolution/Signaling (e.g., Henrich, Sosis):** Excels at costly action (CREDs, signaling), transmission/stabilization, group benefits, link to complex societies. Strong on belief-action gap. Weaker on precise cognitive origins of *specific* supernatural content.
  *   **Group Selection/Adaptation (e.g., Wilson, early Wade):** Focuses on ultimate benefits (cohesion, cooperation). Often weak on proximate mechanisms, cognitive foundations, belief-action gap, and evidence for religion *as a specific adaptation* vs. a by-product co-opted by cultural group selection. Blurs origin/maintenance.
  *   **Credibility Theory (e.g., Lanman, Schloss & Murray):** Directly addresses belief-action gap via CREDs and costly signaling. Integrates cognition and culture. Strong on transmission and costly practices. Less detailed on precise historical emergence patterns.
  *   **Big Gods Hypothesis (e.g., Norenzayan):** Focuses on moralizing gods/complex societies link and uses CREDs/signaling. Strong on that specific historical pattern and costly action mechanisms. Less emphasis on explaining the full breadth of religious phenomena (e.g., non-moralizing religions, afterlife beliefs).
