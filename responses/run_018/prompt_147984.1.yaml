prompt: |-
  I'm putting together a decision-tree handout for a grad seminar on enviromental ethics — specifcally on the precautionary principle but not the generic "strong vs weak" version you see in policy docs. I want the tree to start from concrete commitments, not from philosopher names, using three cases: (1) releasing a gene-drive organism in a closed archipelago where the unknown risk is extinction of a non-target pollinator but the benefit is malaria eradication; (2) deploying stratospheric aerosol injection with a potential irreversible albedo feedback loop; and (3) banning a pesticide with well-documented sublethal effects on pollinators but where economic collapse of small farms is also probable.

  Can you build a taxonomy / decision tree that sorts positions by how they answer four diagnostic splits? First split: does precaution apply only to anthropogenic risks, or also to risks we merely fail to mitigate (e.g., letting natural climate variability run its course)? Second: is the trigger for precaution a binary threshold of "non-negligible possibility of catastrophic harm," or is it graded by both plausibility and severity? Third: does the principle place the burden of proof on the proponent of action, on the opponent of inaction, or is that framing incoherent? Fourth: when precaution conflicts with distributive justice (small farms collapse, malaria persists), is precaution a veto, an override weighted by severity, or does it dissolve?

  For each leaf, name the position if it's a real named view (e.g., strong precautionary principle, risk-based critiques like Sunstein's, etc.) or mark it "unnamed" if it's an unoccupied logical combination. Also flag any pair of leaves your tree can't actually separate — for instance, if "graded precaution with burden on proponents" and "binary precaution with burden on proponents" collapse into the same practical recommendation in case (1). And please include the unoccupied combinations: e.g., maybe nobody holds "graded precaution that applies to natural risks with burden on opponents" — briefly diagnose whether that empty spot is incoherent, unattractive, or just unexplored. Make sure the tree is built from the logical space of answers, not from a list of names; I need about 8-10 leaves total, audience is philosophy grad students who know some decision theory but aren't policy experts. Take a definite stance: don't just map the space neutrally, but argue briefly for which splits are actually doing the philosophical work and which ones are red herrings. Oh, and no citations or reading lists — just the tree, the leaf descriptions, and your committed take on where the lines should be drawn.
reasoning: |-
  Okay, the user is creating a decision tree for a grad seminar on environmental ethics focusing on the precautionary principle beyond the typical strong vs. weak dichotomy. They want it grounded in concrete cases: gene-drive organisms for malaria control, stratospheric aerosol injection, and banning pesticides affecting pollinators. The tree should start from commitments rather than philosopher names, using four diagnostic splits.

  First, I need to understand the four splits thoroughly. The first split asks whether precaution applies only to anthropogenic risks or also to risks from inaction (like natural climate variability). This seems fundamental because it defines the scope of moral responsibility. The second split is about the trigger: binary catastrophic harm threshold versus a graded approach considering both probability and severity. This affects how precaution is activated. The third split deals with the burden of proof: who must prove safety or danger—proponents of action, opponents of inaction, or if that framing is flawed. The fourth split addresses conflicts with distributive justice, like when precaution might cause economic harm, and whether it acts as a veto, can be overridden, or dissolves.

  The user wants about 8-10 leaves in total, naming real positions if they exist or marking them as unnamed. I should flag any leaves that collapse into the same recommendation in specific cases. Also, I need to identify unoccupied combinations and explain why they're empty—whether due to incoherence, unattractiveness, or being unexplored. The audience is philosophy grad students with some decision theory knowledge, so the tree should be logically rigorous but not overly technical.

  For the cases: Case 1 (gene-drive) involves a high-benefit action (malaria eradication) with a catastrophic risk (pollinator extinction). Case 2 (aerosol injection) has an irreversible risk (albedo feedback). Case 3 (pesticide ban) trades off environmental harm against economic collapse. These cases will help illustrate how different positions play out.

  I should structure the tree step by step. The first split is crucial because it defines the domain. If precaution only covers anthropogenic actions, then inactions (like not mitigating natural risks) aren't covered. But if it includes inactions, that broadens responsibility significantly. This split likely separates anthropocentric views from broader ones.

  The second split is about triggers. Binary thresholds are simpler but may ignore nuances, while graded approaches allow for more flexibility. In real-world decisions, graded approaches might be more practical, especially in cases where risks are uncertain but not catastrophic. For example, in Case 1, a binary view might see the extinction risk as triggering precaution regardless of probability, but graded would weigh probability and severity.

  The third split on burden of proof is key. Placing the burden on proponents (action advocates) makes it harder to proceed with risky actions, favoring inaction. Burden on opponents (inaction advocates) shifts the responsibility to prove harm, making actions easier. The "incoherent framing" option suggests the burden concept itself is flawed, which is a critique from some philosophers.

  The fourth split handles justice conflicts. If precaution is a veto, it overrides justice concerns, which could lead to ignoring economic harm. If it's weighted, justice can override precaution based on severity. If it dissolves, precaution doesn't apply when justice conflicts, which might be problematic.

  Now, combining these splits, some combinations might be logically inconsistent or unattractive. For example, applying precaution to natural risks with a burden on opponents could be incoherent because natural risks aren't actions, so opponents of inaction might not have a clear burden. That position might be empty because it's unattractive or unexplored.

  I should map out the possible leaves. Starting with Split 1: Anthropogenic only or Include inaction. Then for each, Split 2: Binary or Graded trigger. Then Split 3: Burden on proponents, opponents, or incoherent. Then Split 4: Veto, weighted, dissolve. That gives 2x2x3x3=36 possible leaves, but many won't be occupied. I need to prune to 8-10, so focus on coherent and named positions.

  Named positions include Strong Precautionary Principle (likely anthropogenic, binary, burden on proponents, veto), Sunstein's critique (anthropogenic, graded, incoherent burden, weighted justice), and others like Justificatory Liberalism or Inaction-Oriented Precaution. Unnamed positions should be flagged.

  I need to check for collapses. For instance, in Case 1, if the trigger is binary or graded but burden is on proponents, the recommendation might be the same if the risk is deemed catastrophic. But in Case 3, graded might allow a ban if economic harm isn't severe, while binary might not trigger precaution at all if harm isn't catastrophic.

  My take: The first split (scope) is crucial as it defines moral responsibility. The burden of proof split is often a red herring; the real issue is justifying actions under uncertainty. Justice conflicts are where the principle faces real-world tests; dissolving seems weak, while weighting is pragmatic.

  Finally, the user wants me to take a stance. I'll argue that including inaction within precaution's scope is necessary for environmental ethics, graded triggers are more rational, the burden framing is often incoherent, and justice conflicts require weighting, not vetoes or dissolution.
answer: |-
  Here’s a decision tree for the precautionary principle, built from concrete commitments and designed to handle your three cases. The taxonomy prioritizes substantive philosophical splits over labels, identifies unoccupied positions, and flags practical equivalences. **Bold terms** denote leaf positions.

  ---

  ### **Decision Tree: Four Splits, Eight Leaves**
  **Splits ranked by philosophical significance**:  
  1. **Scope of Risk** (Anthropogenic only vs. Include inaction)  
  2. **Trigger Logic** (Binary threshold vs. Graded by plausibility/severity)  
  3. **Burden of Proof** (On proponents of action vs. On opponents of inaction vs. Framing incoherent)  
  4. **Conflict with Justice** (Precaution as veto vs. Weighted by severity vs. Dissolves)  

  ---

  #### **Split 1: Scope of Risk**  
  **Q1: Does precaution apply only to anthropogenic risks?**  
  - *Yes (Anthropogenic-only)* → Proceed to Split 2A  
  - *No (Include inaction)* → Proceed to Split 2B  

  ---

  #### **Split 2A: Trigger (Anthropogenic-only scope)**  
  **Q2A: Is the trigger binary ("non-negligible possibility of catastrophic harm")?**  
  - *Yes (Binary)* → Proceed to Split 3A  
  - *No (Graded)* → Proceed to Split 3B  

  #### **Split 2B: Trigger (Include inaction scope)**  
  **Q2B: Is the trigger binary?**  
  - *Yes (Binary)* → Proceed to Split 3C  
  - *No (Graded)* → Proceed to Split 3D  

  ---

  #### **Split 3A: Burden of Proof (Anthropogenic-only + Binary)**  
  **Q3A: Who bears the burden?**  
  - *Proponents of action* → Proceed to Split 4A  
  - *Opponents of inaction* → **Leaf 1: Unnamed ("Permissive Absolutism")**  
  - *Framing incoherent* → **Leaf 2: Risk-Cost-Benefit Hybrid**  

  #### **Split 3B: Burden of Proof (Anthropogenic-only + Graded)**  
  **Q3B: Who bears the burden?**  
  - *Proponents of action* → **Leaf 3: Strong Precautionary Principle**  
  - *Opponents of inaction* → **Leaf 4: Unnamed ("Justificatory Liberalism")**  
  - *Framing incoherent* → **Leaf 5: Sunstein-style Critique**  

  #### **Split 3C: Burden of Proof (Include inaction + Binary)**  
  **Q3C: Who bears the burden?**  
  - *Proponents of action* → **Leaf 6: Inaction-Oriented Precaution**  
  - *Opponents of inaction* → *Unoccupied* (See diagnosis below)  
  - *Framing incoherent* → *Unoccupied*  

  #### **Split 3D: Burden of Proof (Include inaction + Graded)**  
  **Q3D: Who bears the burden?**  
  - *Proponents of action* → **Leaf 7: Holistic Precaution**  
  - *Opponents of inaction* → *Unoccupied*  
  - *Framing incoherent* → **Leaf 8: Adaptive Management View**  

  ---

  #### **Final Leaves: Positions & Conflict with Justice**  
  1. **Unnamed ("Permissive Absolutism")**:  
     - Scope: Anthropogenic-only. Trigger: Binary. Burden: Opponents of inaction.  
     - Justice conflict: **Precaution dissolves** (inaction requires no justification).  
     - *Case impact*: Gene-drive (1) proceeds; aerosol injection (2) proceeds unless harm proven; pesticide ban (3) rejected.  
     - *Status*: Unattractive—ignores paralysis from proving negatives.  

  2. **Risk-Cost-Benefit Hybrid**:  
     - Scope: Anthropogenic-only. Trigger: Binary. Burden: Incoherent framing.  
     - Justice conflict: **Weighted by severity** (quantify all factors).  
     - *Case impact*: Gene-drive (1) allowed if benefits > extinction risk; aerosol (2) rejected (irreversible > benefits); pesticide ban (3) debated via cost-benefit.  
     - *Status*: Sunstein-adjacent but not identical.  

  3. **Strong Precautionary Principle**:  
     - Scope: Anthropogenic-only. Trigger: Graded. Burden: Proponents of action.  
     - Justice conflict: **Precaution as veto**.  
     - *Case impact*: Gene-drive (1) blocked (extinction risk); aerosol (2) blocked; pesticide ban (3) upheld.  
     - *Status*: Classic "strong" version (e.g., EU treaties).  

  4. **Unnamed ("Justificatory Liberalism")**:  
     - Scope: Anthropogenic-only. Trigger: Graded. Burden: Opponents of inaction.  
     - Justice conflict: **Dissolves** (no precaution without proven harm).  
     - *Case impact*: Gene-drive (1) proceeds; aerosol (2) proceeds; pesticide ban (3) rejected.  
     - *Status*: Unoccupied—contradicts precaution’s intent.  

  5. **Sunstein-style Critique**:  
     - Scope: Anthropogenic-only. Trigger: Graded. Burden: Incoherent framing.  
     - Justice conflict: **Weighted by severity** (avoid "paralysis").  
     - *Case impact*: Gene-drive (1) allowed if malaria risk > extinction plausibility; aerosol (2) rejected; pesticide ban (3) rejected if farm harm > pollinator risk.  
     - *Status*: Dominant policy-economics view.  

  6. **Inaction-Oriented Precaution**:  
     - Scope: Include inaction. Trigger: Binary. Burden: Proponents of action.  
     - Justice conflict: **Precaution as veto** (against harmful inaction).  
     - *Case impact*: Gene-drive (1) blocked (inaction on malaria ≠ anthropogenic risk?); aerosol (2) blocked; pesticide ban (3) upheld (inaction harms pollinators).  
     - *Status*: Rare (e.g., radical ecological ethics).  

  7. **Holistic Precaution**:  
     - Scope: Include inaction. Trigger: Graded. Burden: Proponents of action.  
     - Justice conflict: **Weighted by severity**.  
     - *Case impact*: Gene-drive (1) rejected (extinction > malaria benefits); aerosol (2) rejected; pesticide ban (3) upheld only if farm harm < ecological risk.  
     - *Status*: Unnamed but coherent (e.g., extended PP proposals).  

  8. **Adaptive Management View**:  
     - Scope: Include inaction. Trigger: Graded. Burden: Incoherent framing.  
     - Justice conflict: **Weighted by severity** (precaution ≠ absolute).  
     - *Case impact*: Gene-drive (1) phased trials; aerosol (2) rejected (irreversible); pesticide ban (3) mitigated phase-out.  
     - *Status*: Pragmatic policy position (e.g., IPCC risk frameworks).  

  ---

  ### **Key Observations & Unoccupied Combinations**  
  - **Collapsing Leaves**:  
    - In *Case 1 (gene-drive)*, **Strong Precaution** (Leaf 3) and **Holistic Precaution** (Leaf 7) both block release—despite different scopes—because extinction risk dominates.  
    - In *Case 3 (pesticide ban)*, **Sunstein-style** (Leaf 5) and **Adaptive Management** (Leaf 8) converge if economic harm > ecological risk.  

  - **Unoccupied & Why**:  
    - **"Include inaction + Binary + Burden on opponents"**: Incoherent. If precaution covers *inaction*, burdening opponents of inaction implies proving harm from *not acting*—a double negative that nullifies the principle.  
    - **"Include inaction + Graded + Burden on opponents"**: Unattractive. Demands proof of harm from *not acting* (e.g., "prove that *not* spraying aerosols *will* cause catastrophe"), incentivizing reckless action.  
    - **"Anthropogenic-only + Binary + Incoherent burden"** (Leaf 2) and **"Include inaction + Graded + Incoherent burden"** (Leaf 8) are the only coherent "incoherent burden" positions—elsewhere, burden matters.  

  ---

  ### **My Committed Take**  
  - **Scope of Risk (Split 1) is fundamental**: Excluding inaction (e.g., "natural" climate disasters) is a political dodge. If humans *can* mitigate harm, refusal to act is morally material.  
  - **Burden of Proof (Split 3) is overrated**: The "incoherent" option often wins—burdens shift contextually. Focus on *quality of justification* under uncertainty.  
  - **Trigger Logic (Split 2) is underrated**: Binary thresholds are naive (Case 3’s sublethal effects aren’t catastrophic but matter). Graded triggers align with decision theory.  
  - **Justice Conflicts (Split 4) reveal priorities**: "Veto" positions (Leaves 3, 6) are rhetorically pure but collapse under real-world trade-offs (e.g., malaria vs. pollinators). Weighting is unavoidable.  
  - **Most defensible leaf**: **Holistic Precaution** (Leaf 7) or **Adaptive Management** (Leaf 8). They handle all three cases without dogma: gene-drive rejected (irreversible risk), aerosols rejected (irreversible + justice concerns), pesticide ban weighted (ecological harm vs. livelihood loss).  

  ---  
  **Tree Use**: Have students apply cases to each leaf. Debate why unoccupied positions lack advocates (e.g., "Would *you* hold 'Justificatory Liberalism'? Why not?"). Emphasize that "precaution" is a cluster of commitments—not a monolith.
