answer: |-
  ### **Risk Calibration Checklist: Operationalizing the Principal Principle for Two-Lock Problems**  
  **Hey team,**  
  Here’s the reusable checklist for adjusting "objective chance" figures when insider evidence targets the model (Lock 1) or the real-world event (Lock 2). Remember: **Your job is to set reserve capital, so don’t wing it**. This procedure forces discipline but flags where judgment is unavoidable. Run it in 20 mins per case.  

  ---

  ### **The 5-Step Flowchart**  
  *(Non-negotiables: Start with the published chance. Only adjust for model-attacking evidence. Flag everything else.)*  

  #### **Step 1: Pin Down the Published Chance**  
  - **What to do:** Write down the published chance (e.g., "2% ecological failure").  
  - **Why:** This is your baseline—Lewis’s "objective chance" anchor. Don’t second-guess it yet.  
  - **Judgment call?** NO. If the actuaries published it, start here.  

  #### **Step 2: Sort Insider Evidence Using the "Lock Test"**  
  Ask for **each piece of evidence**:  
  > *“Does this attack the model’s calibration (Lock 1) or the real-world event (Lock 2)?”*  

  - **Lock 1 (Model-Calibration Evidence):**  
    - *Examples:* Bugs in simulation code, wrong input data, unverified assumptions, grid errors.  
    - *Admissible?* **YES**—adjusts the published chance.  
  - **Lock 2 (Direct Event Evidence):**  
    - *Examples:* New physics data, organizational behavior, political shifts, lab conditions.  
    - *Admissible?* **NO**—doesn’t adjust the chance. Flag for escalation.  
  - **Hard Case:** Evidence that’s **both** (e.g., a memo about sensor drift affecting model inputs *and* real-world safety). Split it. Treat Lock 1 parts here; flag Lock 2 parts for Step 4.  

  #### **Step 3: Adjust for Lock 1 Evidence with the "Leaky Bucket" Rule**  
  - **What to do:** For each **Lock 1** evidence, apply:  
    - **Direction:** Does it suggest the model *underestimates* (↑ risk) or *overestimates* (↓ risk) the true chance?  
    - **Severity:**  
      - Low (e.g., minor grid issue): **±10%** adjustment to published chance.  
      - Medium (e.g., unverified data source): **±20%**.  
      - High (e.g., fundamental physics error): **±30%**.  
  - **Leaky Bucket Adjustment Formula:**  
    ```  
    Adjusted chance = Published chance × (1 + net_direction × net_severity)  
    ```  
    - `net_direction`: +1 for underestimate, -1 for overestimate.  
    - `net_severity`: Sum of severity weights (low=0.1, med=0.2, high=0.3), **capped at ±0.5** (max 50% change).  
    - **Caps:** Floor at 0%, ceiling at 100%.  
  - **Judgment call?** YES—severity/direction is subjective. Document your reasoning.  

  #### **Step 4: Flag Lock 2 Evidence for Escalation**  
  - **What to do:**  
    - **List all Lock 2 evidence.** Do NOT adjust the chance.  
    - If evidence is **material** (e.g., would change reserves by >10%), escalate for model re-run.  
  - **Hard Case:** Disagreements on "admissibility" (e.g., is "lab culture" Lock 1 or Lock 2?). If unclear, default to Lock 2 and flag.  
  - **Judgment call?** YES—materiality and admissibility debates can’t be auto-resolved.  

  #### **Step 5: Finalize & Document**  
  - **Output:** Adjusted chance (from Step 3).  
  - **Flags:**  
    - List all Lock 2 evidence and escalation steps.  
    - Note if the "leaky bucket" cap (±50%) was hit.  
    - Uncertainty rating (low/med/high) based on unresolved issues.  
  - **Stakes reminder:** If Lock 2 evidence is ignored, reserves may be wrong. If over-adjusted, we lose clients.  

  ---

  ### **Test Questions (Run in Order)**  
  1. **"Is the evidence about the model’s guts?"** (If yes → Lock 1).  
  2. **"Would this evidence exist if the model didn’t?"** (If yes → Lock 2).  
  3. **"How bad is the model error?"** (Low/med/high → leaky bucket).  
  4. **"Can I quantify this without the model?"** (If yes → you’re cheating; stop).  

  ---

  ### **Worked Examples**  
  #### **Case 1: Gene-Drive Release (2% Failure Chance)**  
  - **Published chance:** 2% ecological failure.  
  - **Evidence:** Memo on temperature-sensitivity in the simulation grid.  
  - **Step 1:** Start at 2%.  
  - **Step 2:** **Lock 1** (attacks model’s grid calibration).  
  - **Step 3:**  
    - Direction: Likely underestimates risk (temps vary in real world → higher failure risk).  
    - Severity: Medium (grid issue affects accuracy but isn’t catastrophic).  
    - Adjustment: 2% × (1 + 0.2) = **2.4%**.  
  - **Step 4:** No Lock 2 evidence.  
  - **Final:** **2.4%**, uncertainty = low.  

  #### **Case 2: Satellite Debris Cascade (0.1% Cascade Chance)**  
  - **Published chance:** 0.1% cascade.  
  - **Evidence:** Debris database updated with unverified crowd-sourced entries.  
  - **Step 1:** Start at 0.1%.  
  - **Step 2:** **Lock 1** (attacks model input quality).  
  - **Step 3:**  
    - Direction: Unclear (crowd data could add false debris [↓ risk] or miss real debris [↑ risk]).  
    - Severity: High (garbage inputs → garbage outputs).  
    - **Problem:** Direction ambiguity! Can’t apply leaky bucket.  
    - **Fallback:** No point adjustment. Flag for high uncertainty → reserves + contingency buffer.  
  - **Step 4:** No Lock 2 evidence.  
  - **Final:** **0.1%**, uncertainty = high (direction unknown).  

  #### **Case 3: Pathogen Containment Breach (4% Breach Chance)**  
  - **Published chance:** 4% breach.  
  - **Evidence:** Your gut + memo about reckless lab culture.  
  - **Step 1:** Start at 4%.  
  - **Step 2:** **Lock 2** (attacks real-world safety practices, not the model’s physics sim).  
  - **Step 3:** No adjustment for Lock 2.  
  - **Step 4:**  
    - Flag as material (culture → human error → higher real risk).  
    - **Gut check:** Your "screaming gut" is irrelevant here. Escalate for a model re-run that includes human factors.  
  - **Final:** **4%**, uncertainty = medium (Lock 2 evidence pending review).  
  - **What the procedure CAN’T do:**  
    - Resolve if "lab culture" should be Lock 1 (e.g., if the model *assumed* perfect compliance). This needs human-factors expertise.  
    - Overrule the Principal Principle—you can’t arbitrarily inflate the chance without model-attacking evidence.  

  ---

  ### **When This Procedure Breaks**  
  - **Unresolvable disputes:** What counts as "admissible" (e.g., is a political memo Lock 1 if the model assumed regulatory stability?).  
  - **Black swans:** Evidence implying the model is fundamentally broken (e.g., "the sim doesn’t account for quantum effects"). Hit the ±50% cap and escalate.  
  - **Too many leaks:** >3 Lock 1 evidence items? The leaky bucket caps at ±50%, but uncertainty spikes—add reserves.  

  **Bottom line:** Trust the model unless you’re attacking its calibration. Everything else is noise or an escalation ticket. Update reserves, document flags, and sleep well.  

