answer: |-
  **Bottom line: A culture can deliberately shift its dominant moral emotion through institutional redesign, but the guilt/shame distinction serves functionally distinct purposes that constrain complete interchangeability.**

  ### Decision Tree Logic
  *Branching occurs at 3 core disagreements; each answer combo maps to 1 leaf. Leaves are mutually exclusive except where noted.*

  **Q1: What fundamentally distinguishes guilt from shame?**  
  *(Splits on the psychological/social mechanism)*  
  - **A:** Guilt tracks violation of *internalized rules*; shame tracks damage to *social status/acceptance*.  
  - **B:** Both track rule-violation, but guilt is private, shame is public.  
  - **C:** No meaningful distinction; same core emotion with contextual triggers.  

  **Q2: Can a culture intentionally redesign its dominant moral emotion (guilt ↔ shame)?**  
  *(Splits on cultural malleability)*  
  - **A:** Yes, via norms/institutions (e.g., legal systems, education, media).  
  - **B:** No; ratio is biologically fixed or path-dependent (hard to change).  
  - **C:** Partially; can nudge emphasis but not swap core functions.  

  **Q3: Does the visibility/scale of wrongdoing dictate which emotion is appropriate?**  
  *(Splits on contextual necessity)*  
  - **A:** Yes: Shame for public/collective acts; guilt for private/individual acts.  
  - **B:** No: Guilt should dominate regardless of visibility.  
  - **C:** No: Shame should dominate regardless of visibility.  

  ---

  ### Leaf Taxonomy (Answer Combos → Positions)
  1. **"They serve different jobs; culture can't pick"**  
     *(Q1=A, Q2=B, Q3=A)*  
     *Belief:* Guilt=internal integrity, shame=social cohesion. Hardwired functions. Public fraud *needs* shame; private guilt is insufficient. Education reform fails.  

  2. **"Culture can choose via norm-architecture redesign"**  
     *(Q1=A, Q2=A, Q3=A)*  
     *Belief:* Guilt/shame track different things, but institutions (e.g., replacing public shaming with restorative justice) can retrain emotional responses. Education reform could work.  

  3. **"Guilt-is-better (universalist)"**  
     *(Q1=A or B, Q2=A/B/C, Q3=B)*  
     *Belief:* Guilt focuses on the *act*, not the person. Shame is corrosive. Visibility irrelevant; all wrongs should elicit guilt (e.g., cheating alone *is* the ideal).  

  4. **"Shame-is-better (communitarian)"**  
     *(Q1=A or B, Q2=A/B/C, Q3=C)*  
     *Belief:* Shame upholds collective norms better. Guilt is self-indulgent. Even private acts (cheating) deserve shame if discovered. Public shaming of fraudsters is essential.  

  5. **"Contextual toolset"**  
     *(Q1=A, Q2=C, Q3=A)*  
     *Belief:* Guilt/shame are distinct tools. Culture can emphasize one but not eliminate the other. Use guilt for self-regulation, shame for group violations.  

  6. **Incoherent/Unexplored: "Moral emotion equivalence"**  
     *(Q1=C, Q2=A, Q3=any)*  
     *Belief:* No real difference. Culture can "refactor" freely like a protocol update.  
     *Problem:* Ignores empirical psychology (guilt = "I did bad", shame = "I am bad"). Fails your cheating test (alone-feels-bad should = guilt).  

  ---

  ### Indistinguishable Leaves & Notes  
  - **"Guilt-is-better" vs "Shame-is-better"** can’t be split if Q3=B/C. They share identical Q1/Q2 combos and are separated *only* by their value judgment (Q3=B or C).  
  - **Key constraint:** Q1=A (fundamental distinction) is necessary for leaves 1,2,5. Without it, positions collapse or become incoherent.  
  - **Software analogy:** Accepted only if Q2=A (culture can redesign) – viewing norms as "protocols" and emotions as "outputs." Rejected if Q2=B.  

  ### Mapping Your Cases  
  - *Cheater feels bad alone:* Leaf 1/2/5 see this as guilt; Leaf 3 demands it; Leaf 4 says shame *should* apply; Leaf 6 can’t explain it.  
  - *Public shaming:* Leaf 1/4 require it; Leaf 2/5 might redesign it away; Leaf 3 opposes it.  
  - *Education reform:* Leaf 2 endorses it; Leaf 1 says futile; Leaf 3/4 see no need.
