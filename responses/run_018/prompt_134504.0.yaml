  **Joint Statement on the Conceptual Framing of Divergence Questions**  
  *Agreed upon by representatives of the Comparative Counterfactualist (CC) and Conceptual Historian (CH) perspectives*

  **Section 1: Agreed Historical and Conceptual Foundations**

  1.1  Historical scholarship demonstrates that several core regions of late imperial China (e.g., the Yangzi Delta) exhibited levels of agricultural productivity, commercial development, artisanal technology, and market integration during the 17th and 18th centuries that were broadly comparable to those found in the most advanced regions of Western Europe, including Britain, prior to the Industrial Revolution.

  1.2  The emergence of sustained industrial growth in Britain during the late 18th and early 19th centuries relied upon a specific, non-random conjunction of factors. These included, but were not limited to, accessible coal deposits proximate to population centers, institutional innovations related to finance and property, global resource flows facilitated by colonial networks, and contingent historical events. No single factor was determinative, and their interaction was path-dependent.

  1.3  Joseph Needham’s question concerning why modern science developed in Western Europe and not in China addresses a distinct phenomenon from the "Great Divergence" question concerning sustained industrial economic growth. While related and often conflated in popular discourse, the development of a specific epistemological and methodological framework for natural inquiry (modern science) is analytically separable from the socio-economic processes driving industrialization, though mutual influences exist.

  1.4  Both the "Great Divergence" framing ("Why Britain and not China?") and the "Needham Question" ("Why modern science in the West and not China?") are significant historical problems demanding scholarly engagement. Their conceptual framing, however, requires careful scrutiny to avoid anachronism and teleology.

  **Section 2: Residual Disagreements: Formulations and Nature**

  2.1  **On the Conceptual Validity of "Why Britain and not China?" (Economic Divergence):**
      *   *Position CC Formulation:* The comparative counterfactual framing "Why Britain and not China?" is conceptually well-posed. It enables disciplined comparative analysis by identifying potentially isolable variables (e.g., specific institutional arrangements, geographic resource endowments, colonial contexts) within a shared context of advanced pre-industrial economies ("high-level equilibrium traps"). This method treats industrialization as an observable outcome requiring causal explanation, not as a teleological endpoint inherent to the analysis.
      *   *Position CH Formulation:* The framing "Why Britain and not China?" is fundamentally malformed. It (a) reifies "Britain" and "China" as coherent, comparable units, ignoring internal heterogeneities and the British state's inherently global/composite nature; (b) requires holding constant socio-institutional factors (like state structure or property relations) that are intrinsically part of the causal nexus, rendering counterfactuals like "China with British institutions" incoherent hybrids; and (c) implicitly adopts industrial capitalism as the normative benchmark, obscuring alternative developmental paths.

  2.2  **On the Parallel with the Needham Question:**
      *   *Position CC Formulation:* The Needham Question ("Why modern science in the West and not China?") suffers from a *similar but distinct* defect. The primary defect is the difficulty in isolating "scientific methodology" as a discrete variable from the broader institutional, cultural, and socio-economic matrix of each society. However, the core counterfactual impulse – comparing why a specific complex development occurred in one advanced civilization and not another – remains valid and methodologically defensible for distinct phenomena like scientific revolution versus industrial take-off.
      *   *Position CH Formulation:* The Needham Question suffers from defects *analogous in kind* but potentially *differing in specific manifestation* to those of the economic divergence question. Both illegitimately isolate one complex outcome (modern science, industrial capitalism) from the path-dependent institutional and civilizational bundles in which it emerged, treat civilizational regions as unitary actors suitable for symmetric comparison, and implicitly measure success against a Western standard. The specific incoherence for Needham lies in defining "modern science" independently of the socio-epistemic context that produced it.

  2.3  **Verbal Disagreements:**
      *   **"Counterfactual":** CCs generally employ "counterfactual" to denote a disciplined heuristic tool for causal inference within comparative history, not requiring modal realism. CHs often associate "counterfactual" with claims about metaphysically possible worlds, finding such claims incoherent for complex historical entities. *Substantive Disagreement Remains:* Whether heuristic abstraction of variables across fundamentally different contexts inevitably distorts historical understanding beyond utility.
      *   **"China" / "Britain":** Both agree these terms denote complex, evolving entities. Disagreement centers on the *level of abstraction* permissible: CCs argue identifying "core" economic regions or state-level actors is sufficient for meaningful comparison; CHs argue internal diversity and the constitutive role of global connections make such abstraction analytically fatal. *Substantive Disagreement Remains:* Whether essential characteristics of the development process are lost when abstracting to the level of "Britain" vs. "China".

  **Section 3: Cruxes: Predictive Scenarios and Divergent Expectations**

  3.1  **Crux 1: Path-Dependency and Isolating Variables (Needham vs. Divergence)**
      *   *Scenario:* Consider the concurrent development of sophisticated mathematical astronomy and calendrical science in both late Imperial China and early modern Europe (e.g., Ming/Qing China vs. 16th-17th century Europe). Both possessed advanced observational data and computational techniques.
      *   *CC Prediction:* Variables like patronage structures (court vs. independent academies), openness to cross-cultural textual transmission, or specific metaphysical commitments *can* be partially isolated and compared to explain why the synthesis leading to Newtonian physics occurred in Europe. The Needham question, while challenging, is not invalidated by path-dependency; isolating key institutional variables explains differential trajectories *within* similar capability baselines. The defect differs from the economic divergence question, which deals with material resource-institution interactions.
      *   *CH Prediction:* The "synthesis" leading to Newtonian physics was inseparable from the specific path of institutional development (universities, printing, patronage), philosophical debates, and even religious context in Europe. Attempting to isolate "variables" like patronage from the specific European epistemic community that gave patronage its meaning is incoherent. The same core defect – trying to isolate an outcome from its constitutive path-dependent bundle – invalidates both the Needham and Divergence questions, though the *specific elements* of each bundle differ.

  3.2  **Crux 2: Polities as "Natural Experiments"**
      *   *Scenario:* Examine the adoption and impact of New World crops (e.g., maize, potatoes) in specific regions of 18th-century China (e.g., highland peripheries) versus specific regions of 18th-century Europe (e.g., Ireland, Prussia). Assume broadly comparable initial agro-ecological suitability.
      *   *CC Prediction:* The differential impact on population growth, land use patterns, and potential proto-industrial activity *can* be meaningfully explained by comparing isolable variables such as: local property rights regimes, state policies towards land reclamation/migration, integration into regional markets, and pre-existing labor practices. Holding the "variable" of the new crop relatively constant allows causal inference about the impact of specific institutional factors.
      *   *CH Prediction:* The "impact" of the new crop is inseparable from the *configurational whole* in each region: the specific property regime *in that state structure*, the market integration *as shaped by fiscal policies and social hierarchies*, the labor practices *embedded in cultural norms*. Treating these as isolable "variables" independent of their specific configuration fundamentally misrepresents how causation operates in historical socio-ecological systems. The "experiment" analogy fails because the contexts are not closed systems with independent variables.

  **Signed,**

  [Representative(s) of the Comparative Counterfactualist Perspective]

  [Representative(s) of the Conceptual Historian Perspective]
