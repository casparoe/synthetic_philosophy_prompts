answer: |-
  The debate centers on whether moral change stems primarily from shifting interests or evolving honor codes. To address this, we must dissect "honor" through two lenses: as **internalized normative commitment** (deep personal belief) and as **strategic coordination equilibrium** (enforced by reputational costs and third-party policing). The decline of dueling illustrates the latter, revealing how institutional shifts restructure social payoffs independent of moral sentiment or material interest.

  ### 1. **Dueling's Decline: An Equilibrium Restructuring**
     - **The Honor Equilibrium**: In 18th–19th century Europe, dueling functioned as a coordination equilibrium among elites. Accepting a duel signaled courage; refusal risked social ostracism. Third parties (peers, society) enforced this by withholding recognition (e.g., exclusion from clubs, lost career prospects). The "payoff matrix" rewarded compliance and punished refusal, regardless of private moral views.
     
     - **State Monopolization of Violence**: As modern states claimed exclusive control over legitimate violence, anti-dueling laws imposed severe penalties (e.g., imprisonment, dishonorable discharge). Crucially, the state altered the **social cost structure**:
       - Withholding recognition (shaming a duel-avoider) became costlier: Peers faced legal/social repercussions for endorsing illegal acts.
       - Granting recognition (honoring a duelist) also carried new risks: Supporting a criminal act invited state sanctions.
       - Thus, the equilibrium unraveled not because elites privately rejected dueling (many still admired it), but because the *social enforcement mechanism* collapsed under state pressure.

     **Why not morality or interests?**  
     - Private moral sentiment against dueling existed for centuries but failed to eradicate it.  
     - Material interests didn’t shift inherently: Duels still served to protect status, yet compliance ceased because the *reputational calculus* changed.  
     - **The driver was institutional**: The state disrupted the coordination equilibrium by redefining the costs and benefits of enforcement behavior.

  ---

  ### 2. The Classificatory Problem: Practice vs. Belief
  When a practice (e.g., dueling, slavery) collapses but normative beliefs persist, we confront a trilemma:  
  - **Argument-driven change?** Unlikely if beliefs endure.  
  - **Interest-driven?** Unlikely if material incentives remain but compliance ceases.  
  - **Honor-driven?** Only if we distinguish **enforcement behavior** from **belief**.  

  **The Conceptual Mistake: The Survival Fallacy**  
  The error lies in assuming that the survival of a normative belief (*X is honorable*) necessitates the survival of the corresponding practice (*doing X*). This conflates two distinct levels:  
  - **First-order compliance**: Engaging in the practice.  
  - **Second-order enforcement**: Policing the norm via recognition/granting status.  

  In dueling’s case, Prussian officers post-criminalization still *believed* refusal was dishonorable but *stopped enforcing it* because state penalties made shaming avoiders too costly. The practice collapsed due to severed enforcement—not extinct belief.  

  ---

  ### 3. Implications for Moral Reasoning
  This fallacy distorts assessments of moral reasoning’s efficacy:  
  - **If beliefs must align with practice**: Moral argument appears impotent unless material/institutional forces concur.  
  - **Recognizing the enforcement gap**: Reveals moral reasoning can operate *autonomously* by:  
    a) Undermining enforcement incentives (e.g., convincing third parties that shaming duel-avoiders is unjust), or  
    b) Shifting the payoff matrix via institutional lobbying (e.g., advocating state bans to raise enforcement costs).  

  **Example**: Abolitionists didn’t wait for slavery to become unprofitable; they made its *social enforcement* costly by mobilizing shame, boycotts, and political pressure—altering the equilibrium while pro-slavery beliefs lingered.  

  ---

  ### Conclusion
  The decline of dueling exemplifies **honor-driven change via institutional restructuring**, where state intervention reconfigured the payoff matrix for norm-enforcers. Classifying moral revolutions requires separating **belief survival** from **practice survival**. Rejecting the "survival fallacy" shows moral reasoning can be causally efficacious by targeting the enforcement mechanics of social equilibria—even absent shifts in material interests or private sentiment. Honor, as a system of strategic recognition, thus bridges moral argument and institutional change.
