prompt: |-
  I run a two-hour session once a year for about 20 first-year undergrads in a course called "Organizations, Rules and People" — it's in a public policy school, most of them have never done any theory and won't have read anything in advance. This year I want to do Foucault on disciplinary power and power/knowledge, but I don't want to put up a diagram of a circular prison and talk at them for an hour. I want them to walk into the structure and notice it from the inside. Constraints: one normal classroom with movable chairs, one teaching assistant, no budget, no prep reading, no lecture up front, and they shouldn't hear the words "panopticon" or "power/knowledge" until afterwards. Last year I tried just silently standing at the back of the room taking notes for ten minutes, which sort of worked but it was obviously all about me, and the discussion afterwards was just "surveillance is bad."

  So: design me the actual runnable thing. Roles, materials, rules, a round-by-round timeline with minute markers, and what I say at each transition. Some things I'd really like built in if you can manage it — but redesign freely, I'm making this up as I go: first, the observation should be intermittent and unverifiable rather than constant, so that not knowing whether they're being watched is what does the work. Second, the observers should be writing things down using categories the participants themselves help invent, and the records should have real if tiny consequences (who presents first, where people sit, who gets a small privilege), so that describing quietly turns into ranking and the ranking then produces the behavior the description predicted. Third, I'd love a stretch where the observation stops entirely and the behavior still doesn't revert, so they feel internalization instead of just compliance. Fourth, some mechanism showing that nobody is actually in charge — my idea was a "record card" that carries a first-round label forward even after the person's behavior has clearly changed, so that the file rather than any person ends up driving the outcome. I also want them to come away seeing that the categories felt neutral and descriptive while obviously having been made by someone, and that the power at work wasn't mainly someone saying no.

  Then the debrief: map concrete moments in the session onto the parts of the view — hierarchical observation, normalizing judgment, the examination, visibility as a trap, knowledge producing the very thing it claims to describe — and give me the discussion questions in the order I should ask them. Please also be blunt about what will predictably go wrong the first time (I'm assuming at least one group works out the observation is fake and starts performing for the observer, and someone will say I manipulated them), and about which feature of the account the exercise fundamentally can't reproduce and I'll just have to supply myself. My worry is that the whole thing will read as me holding all the power, which is more or less the opposite of the point.
reasoning: |-
  We are going to design an interactive classroom activity that simulates Foucauldian disciplinary power without using the terms until the debrief. The activity should have intermittent and unverifiable observation, the creation of categories by the participants, consequences from the records, internalization, and a sense that the system (not a person) is in charge.

  Constraints: 
  - 20 first-year undergrads, no prep, no lecture up front.
  - One classroom with movable chairs, one TA, no budget.
  - The activity should run within a two-hour session.

  Goals:
  1. Intermittent and unverifiable observation: Participants are never sure if they are being watched at any given moment.
  2. Observers write things down using categories that the participants help invent.
  3. Records have small consequences (e.g., who presents first, seating, small privilege).
  4. A stretch where observation stops and behavior doesn't revert (internalization).
  5. A mechanism showing that the record (the file) drives outcomes, not a person.
  6. Participants see that the categories felt neutral but were constructed, and that power isn't just about prohibition.

  Activity Design:

  We'll structure the activity in rounds. The main idea is to have the participants engage in a group task while being observed intermittently. The observation will be done by the instructor and the TA, but in a way that is not obvious (e.g., they might be walking around, taking notes, but not constantly). The categories for observation will be generated by the participants themselves at the start.

  We'll use a simple group task: creating a "policy proposal" for a hypothetical scenario. The scenario should be simple and engaging enough for first-year students without prior reading.

  Scenario: "Design a set of rules for a shared student workspace in the library to ensure it is productive and inclusive."

  Roles:
  - Instructor: Facilitator, also one of the observers.
  - TA: The other observer, also helps with logistics.

  Materials:
  - Notepads and pens for the observers (to take notes).
  - Index cards (or small pieces of paper) for the "record cards" (one per participant).
  - A whiteboard or flip chart to write the categories.

  Phases:

  1. Introduction and Setup (10 minutes)
  2. Category Creation (10 minutes)
  3. Group Work with Intermittent Observation (40 minutes, broken into segments)
  4. Internalization Phase (observation stops) (10 minutes)
  5. Reporting and Consequences (20 minutes)
  6. Debrief (30 minutes)

  Detailed Round-by-Round:

  ### Phase 1: Introduction and Setup (10 minutes)

  - **Instructor says:** "Welcome. Today we're going to do a group activity. We'll be working in small groups to create a policy proposal for a shared student workspace in the library. The goal is to make it productive and inclusive. First, we need to form groups."

  - Form groups: Divide the 20 students into 4 groups of 5. Let them self-select? Or assign randomly? Random assignment is better to avoid cliques. Use a quick method (count off 1-4).

  - **Instructor says:** "Each group will have 40 minutes to come up with a one-page policy proposal. You can use bullet points. We'll then have a short presentation from each group. But first, we need to decide how we will observe and evaluate the process. We want to make sure we are being fair and objective. So, let's brainstorm some criteria we might use to observe how well groups are working together. What are some things we might look for?"

  ### Phase 2: Category Creation (10 minutes)

  - Brainstorm a list of 5-7 observable behaviors that indicate "good group work". Write them on the board. Examples might be: 
    - Participation (everyone contributing)
    - Listening to others
    - Staying on task
    - Being respectful
    - Creativity in ideas
    - Etc.

    Encourage the students to come up with these. Write down exactly what they say. Then, as a group, narrow to 5 by voting or consensus.

  - **Instructor says:** "Great. We'll use these 5 criteria to observe the group work. We (the instructor and TA) will be taking notes during the activity. We might not be watching all the time, but we'll be around. We'll use these notes to help decide which group presents first and also to assign a small privilege to one group (like getting to choose where they sit for the rest of the session, or a small treat if available). Also, we'll note individual contributions and that might affect who gets to present for the group."

  - Assign a note-taker role to the TA and instructor. Each will observe two groups. They will have notepads and write down observations using the agreed categories. They should note both positive and negative instances, but frame it as "observations".

  - Hand out index cards to each student. Explain: "Each of you will have a record card. We'll use this to track your individual contributions. At the end, we'll collect these and they might influence who presents and other small things."

  - Write each student's name on a card. The instructor and TA will use these to record observations about individuals.

  - **Key point:** The observation is intermittent. The observers might walk around, but also step out of the room or stand in a corner writing, so it's not clear when they are watching. They might only observe for 1 minute every 5 minutes, but the students don't know the schedule.

  ### Phase 3: Group Work with Intermittent Observation (40 minutes)

  - **Instructor says:** "Okay, groups, you have 40 minutes to work. Start now."

  - The instructor and TA begin observing. They should move around, but not constantly. They might step out of the room for a few minutes at a time (to "get something" or "take a call"), then come back and observe intensely for a minute. They should take notes on the index cards (for individuals) and on a group level (on their notepads) using the categories.

  - **Important:** The notes are taken in a way that the students can see the observers writing, but they cannot see what is written. The observers should not interact with the groups unless asked a direct question (then answer minimally).

  - The observers should also note when a student does something that fits a category (e.g., "listened well", "interrupted", "offered creative idea"). They should try to write at least one note per student per 10 minutes.

  - After 20 minutes, the instructor might call a quick break (2 minutes) and then continue.

  ### Phase 4: Internalization Phase (10 minutes)

  - At the 30-minute mark of the group work (so after 30 minutes total, meaning 10 minutes left in the 40-minute work period), the instructor and TA stop observing. 

  - **Instructor says (to the whole class):** "We are going to pause our observation for the last 10 minutes. We have enough notes for now. Please continue working as before."

  - The observers put away their notepads and sit at the back, not writing, not interacting. They might even close their eyes or read a book to show they are not observing.

  - The groups continue working. The observers note (mentally) if the behavior changes.

  ### Phase 5: Reporting and Consequences (20 minutes)

  - Stop the group work.

  - **Instructor says:** "Time's up. Now we're going to have each group present very briefly, just 2 minutes per group. We'll decide the order of presentation and who presents based on our observations."

  - The instructor and TA take out their notes and the index cards. They huddle for 1 minute (pretending to confer) and then announce:

    - The order of presentation: They choose which group presents first, second, etc. They base this on the group notes, but also they will use the index cards to choose who presents for each group (the person with the "best" record in that group? or randomly? but to show the record matters, they should use the record).

    - **Crucial:** The instructor says: "We've looked at the record cards. For Group 1, we see that [Name] has the most consistent record of [positive category, e.g., participation]. So [Name] will present for Group 1."

    - They do this for each group. Also, they assign a small privilege to one group (e.g., "Group 2, because we noted you were particularly strong in [category], you get to choose where you sit for the rest of the session" or "you get a chocolate bar" if available).

    - Also, note that the record cards might have a note from early on that is negative, and even if the student improved, that note is still there and might be mentioned. For example: "In Group 3, [Name] had a note about not listening at the beginning, but then improved. However, because of the early note, we have [another student] present." This shows the file carries weight.

  - Each group presents (2 minutes per group).

  ### Phase 6: Debrief (30 minutes)

  - Now the instructor reveals the purpose and connects to Foucault.

  - **Instructor says:** "Thank you for your work. Now let's reflect on what just happened. I want to ask some questions and then I'll explain why we did this."

  - Discussion questions (in order):

    1. "During the group work, how did it feel when we were walking around and taking notes?" (Expected: some felt watched, judged, self-conscious)
    2. "Did you notice when we were watching and when we weren't? How did that uncertainty affect your behavior?" (Expected: they tried to behave well all the time because they didn't know when they were being watched)
    3. "When we stopped observing for the last 10 minutes, did your behavior change? Why or why not?" (Expected: many say they kept behaving the same because it felt natural, or because they thought we might still be watching secretly, or because the group norms were set)
    4. "We used categories that you helped create. At the time, did they feel neutral? Did they feel like they were measuring something real? Now, looking back, do you think they were objective?" (Expected: they felt objective at the time, but now they see they were constructed by the group and the observers applied them)
    5. "Let's look at the consequences: the order of presentation, who presented, and the privilege. How were these decisions made? Did they feel fair? Why or why not?" (Expected: some felt it was based on the notes, but they might question the notes' accuracy, especially if someone who improved was penalized for an early note)
    6. "Who was in charge of this process? Who made the decisions?" (Expected: the instructor and TA, but then point out that you were just following the system of categories and records. The record cards carried the early note even after behavior changed, so the file drove the decision.)

  - Then, introduce Foucault:

    - "What we just experienced is an example of what the philosopher Michel Foucault called 'disciplinary power'. He studied how modern institutions (like schools, prisons, hospitals) use subtle techniques to control behavior. He didn't think power was just about saying 'no' (like a king or a boss), but about creating systems where we monitor ourselves."

    - Map the activity to Foucault's concepts:

      - **Hierarchical observation:** The observers (instructor and TA) were in a position to see without being seen all the time. The observation was intermittent and unverifiable (you didn't know when you were being watched). 
      - **Normalizing judgment:** We used the categories you created to judge what was 'normal' or 'good' behavior. We compared individuals and groups against that norm.
      - **The examination:** The combination of observation and recording created a 'file' on each of you (the index card). This file then had consequences.
      - **Visibility as a trap:** Because you knew you might be watched, you behaved as if you were always watched. This is the panopticon effect (now you can mention the panopticon) — a prison design where prisoners can't see the guard, so they self-monitor.
      - **Power/Knowledge:** The knowledge we produced (the notes, the categories) wasn't neutral. It shaped your behavior (you tried to conform to the categories) and then we used that knowledge to rank and reward. So the knowledge didn't just describe, it produced the behavior.

  - **Discussion question:** "How is this different from a teacher just telling you what to do? How might this kind of power show up in real organizations or policies?"

  Predictable Problems:

  1. **Performing for the observer:** Some groups might figure out they are being watched and start exaggerating the positive behaviors. That's okay because it shows they are responding to the observation. You can point this out in the debrief as an example of how the system works.

  2. **Feeling manipulated:** Someone might say, "You set this up to manipulate us." Acknowledge: "Yes, we did. But the point is to show that these techniques are used in society, often without us realizing. We made it visible. In real life, it's built into the architecture of institutions."

  3. **The instructor holds power:** Yes, you set up the system. But in the debrief, emphasize that in real institutions, the system runs without a single person pulling the strings. The power is in the structure. You were just the temporary operator.

  What the Exercise Can't Reproduce:

  - The exercise is a short simulation. In real life, disciplinary power operates over long periods and becomes deeply internalized (forming our sense of self). The exercise can only hint at internalization in 10 minutes. Also, in real life, the categories and norms are not created democratically but imposed by institutions. We let them create the categories to show the construction, but in reality, that process is often hidden.

  - The panopticon effect in real life is more pervasive and subtle. Our simulation is a bit heavy-handed. Also, we can't fully simulate the power/knowledge feedback loop in such a short time.

  To mitigate the instructor power issue:

  - In the debrief, stress: "In this room, I set up the system, but in the world, these systems are embedded in the design of buildings, the rules of organizations, and the way we collect data. No single person is the 'boss' of the system. It operates through routines and records."

  Timeline Recap (total 2 hours):

  - 0:00-0:10: Introduction and group formation.
  - 0:10-0:20: Category creation.
  - 0:20-1:00: Group work with intermittent observation (40 min, including the internalization phase at the end).
  - 1:00-1:20: Reporting and consequences.
  - 1:20-1:50: Debrief and discussion (30 min).
  - 1:50-2:00: Wrap-up and questions.

  This leaves 10 minutes buffer.

  Materials Checklist:
  - Notepads and pens for instructor and TA.
  - Index cards (20, one per student).
  - Whiteboard or flip chart for categories.
  - Timer.

  Adjust on the fly if needed. Good luck!
answer: |-
  Below is a runnable, minute-by-minute session plan designed to meet your goals while working within your constraints. The activity simulates Foucauldian disciplinary power through a *collaborative policy-drafting task* with embedded observation mechanics. Students will experience hierarchical observation, normalizing judgment, and internalization without knowing the theoretical framework until the debrief.

  **Core Mechanics:**  
  - **Intermittent observation:** Instructor/TA observe in short, unannounced bursts using timers.  
  - **Participant-created categories:** Students define "effective teamwork behaviors" that become observation criteria.  
  - **File-driven consequences:** "Record cards" (index cards) with early labels persist even after behavior changes.  
  - **Internalization trigger:** Full observation stoppage to see if behavior sustains.  
  - **No central "boss":** Decisions are tied to the record cards, not human judgment.  

  **Roles & Materials:**  
  - **Instructor:** Facilitator, primary observer.  
  - **Teaching Assistant (TA):** Secondary observer, log-keeper.  
  - **Students:** 20 undergrads, divided into 4 groups of 5.  
  - **Materials:**  
    - Index cards (20 + extras).  
    - Pens (2 for observers, 1 per group).  
    - Sticky notes (1 pad).  
    - Whiteboard/flip chart.  
    - Timer/stopwatch.  
    - Small "privilege" token (e.g., a single chocolate bar, or the right to choose seating).  

  ---

  ### **Session Timeline (Total: 115 Minutes)**  
  *(Includes buffer for transitions)*  

  #### **PHASE 1: Setup & Category Creation (20 mins)**  
  **Goal:** Establish the activity as a "teamwork exercise," with students co-creating observation categories that feel neutral.  
  - **0:00–0:05 (Intro):**  
    - *Instructor says:* "Today we’re simulating a policy task. You’ll draft rules for a ‘Student Productivity Hub’ in this school. Focus: fairness and efficiency. We’ll form groups now."  
    - *Action:* Randomly assign groups (e.g., count off 1–4). Move chairs into 4 clusters.  

  - **0:05–0:15 (Brainstorm criteria):**  
    - *Instructor says:* "Before we start, let’s define what ‘good collaboration’ looks like. Brainstorm observable behaviors—e.g., ‘listens actively,’ ‘stays on-task.’ We’ll use these later to give feedback."  
    - *Action:*  
      - Groups brainstorm 3–5 behaviors (5 mins).  
      - Share ideas; instructor writes 5–6 on the board (e.g., "speaks clearly," "takes notes," "invites quiet members").  
      - Vote to narrow to 4 criteria. **Frame this as "objective metrics."**  

  - **0:15–0:20 (Assign records):**  
    - *Instructor says:* "To track contributions, everyone gets a record card. We’ll jot notes during the task. These *might* influence small things later, like who presents your group’s ideas."  
    - *Action:* Hand out blank index cards. Students write names. Collect cards—observer(s) will use these.  

  #### **PHASE 2: Policy Drafting with Intermittent Observation (40 mins)**  
  **Goal:** Students experience unverifiable observation, category-based recording, and early "file creation" that sticks.  
  - **0:20–0:25 (Task launch):**  
    - *Instructor says:* "You have 35 minutes to draft policy rules. Focus: balancing productivity and inclusion. We’ll observe briefly to give feedback later. Start!"  
    - *Action:* Distribute 1 pen/group + paper. Observers sit apart, visibly holding record cards and timers.  

  - **0:25–0:55 (Group work with intermittent observation):**  
    - *Observation rules:*  
      - Observers use a timer for **2-minute observation bursts** every 5–7 minutes (randomized).  
      - During bursts, walk near groups, take notes on record cards using the board’s categories. **Use shorthand symbols (e.g., ✓ for "speaks clearly," ✗ for "off-task")**—never speak.  
      - Between bursts, observers look busy (e.g., write on sticky notes, step outside briefly).  
      - **TA logs real-time:** Notes when groups self-censor/adapt (e.g., "Group 2 stopped joking after burst 2").  
    - *Critical twist (0:40–0:45):*  
      - During a burst, assign a **sticky-label** to 2–3 record cards based on *early* behavior (e.g., "distracted," "leader"). Place face-down on cards. **Do this discreetly—students see labels exist but not what they say.**  
    - *Instructor/TA script:*  
      - "I’m just capturing examples for feedback." (if asked).  
      - **Plant a "red herring":** At 0:50, murmur to TA (audibly): "Note how Group 3 is strong in ‘inviting quiet members’"—highlighting a board criterion.  

  - **0:55–1:00 (Transition):**  
    - *Instructor says:* "Pause drafting. We’re shifting to prep short presentations."  
    - *Action:* Collect all record cards.  

  #### **PHASE 3: Internalization Test (10 mins)**  
  **Goal:** Halt observation to see if behavior persists.  
  - **1:00–1:10 (Unobserved prep):**  
    - *Instructor says:* "We’ve finished observations. You now have 10 minutes to finalize presentations—we won’t take notes. Presenters will be chosen randomly." **(Lie: presenters will use record cards later.)**  
    - *Action:* Observers sit at back, **read books/phones—no writing.** TA tracks if groups:  
      - Sustain "observed" behaviors (e.g., still formally inviting quiet members).  
      - Relax (e.g., sidebar conversations resume).  

  #### **PHASE 4: Examination & Consequences (20 mins)**  
  **Goal:** Use "files" (record cards) to apply consequences, showing power lies in documents, not people.  
  - **1:10–1:15 (Presenter "selection"):**  
    - *Instructor says:* "Time’s up. We’ll choose presenters based on your record cards. The cards have codes matching our criteria—we’ll pick who fits best."  
    - *Action:*  
      - **Pretend to "analyze" cards:** Hold up 2–3 with sticky labels.  
      - Assign presenters **based on early sticky labels**, ignoring later behavior (e.g., "Alex, your card shows strong ‘clarity’—you present for Group 1").  
      - If challenged: "The system uses first-impression data for consistency."  

  - **1:15–1:25 (Presentations):**  
    - *Action:* Groups present (90 seconds each). **After each, assign a consequence:**  
      - "Group 2’s record cards show high ‘note-taking’—choose your seats for the debrief."  
      - "Group 4 had ‘inclusion’ flags—here’s a chocolate bar."  
      - **Emphasize:** "This is what the records suggested."  

  - **1:25–1:30 (File reveal):**  
    - *Instructor says:* "Look at your record cards. Some had sticky labels from early on—like ‘distracted’ or ‘leader.’ Even if you changed, the label guided our choices."  
    - *Action:* Return cards. Let students see mismatches (e.g., a "distracted" student who contributed later).  

  #### **PHASE 5: Structured Debrief (35 mins)**  
  **Goal:** Map the activity to Foucault, using student experiences as evidence.  
  - **1:30–1:40 (Feelings ➔ Framework):**  
    - *Instructor says:* "Let’s dissect what happened. First: How did it feel during observation bursts?"  
      - **Expected answers:** "Nervous," "Wondered if you were watching."  
    - *Then:* "When observation stopped, did your group’s behavior change? Why?"  
      - **Expected answers:** "Kept doing it—it felt normal," or "Thought you might still watch."  
    - **Reveal the framework:** "This mirrors philosopher Michel Foucault’s ideas: power isn’t just commands, but systems where we monitor ourselves. What you felt was **disciplinary power**."  

  - **1:40–1:50 (Map concrete moments):**  
    - *Instructor says:* "Let’s connect your experience to his concepts:"  
      | **Foucault Concept** | **Activity Moment** | **Discussion Question** |  
      |------------------------|----------------------|--------------------------|  
      | **Hierarchical observation** | Unannounced bursts | *"When we stepped out, did you assume we might still be listening? How did that uncertainty control you?"* |  
      | **Normalizing judgment** | Voting on "objective" criteria | *"Our criteria felt neutral—but who really defined ‘good’ behavior? Did they feel natural or imposed?"* |  
      | **Examination** | Record cards guiding outcomes | *"How did the ‘file’ (your card) override your actual later behavior? Who benefited/harmed?"* |  
      | **Visibility as a trap** | Sticky labels influencing presentations | *"Even without constant watching, did the knowledge that you’d be categorized change how you acted?"* |  
      | **Power/Knowledge** | Criteria shaping behavior (e.g., "inviting quiet members") | *"When I called out Group 3’s ‘inclusion,’ did you emphasize it more? Did our ‘knowledge’ create the behavior it described?"* |  

  - **1:50–2:05 (Bigger implications):**  
    - *Instructor says:*  
      - "Foucault called this a **panopticon**—a prison where inmates self-discipline because they *might* be watched. Sound familiar?"  
      - "Power here wasn’t about me saying ‘no.’ It was about the **system** (records, criteria) directing you. And you helped build it!"  
      - "Where else might this happen? Schools? Workplaces? Social media?"  
    - **Final question:** "Was anyone truly ‘in charge’ here, or did the process itself hold power?"  

  ---

  ### **Predictable Problems & Mitigations**  
  1. **Students "perform" for observers:**  
     - *Likelihood:* High. Groups may exaggerate board criteria (e.g., forced "inclusion").  
     - **Use it:** In debrief, ask: "Did anyone ‘act’ to match the criteria? How did that feel? Foucault argues this performance *becomes* reality."  

  2. **"You manipulated us!" accusations:**  
     - *Likelihood:* Medium-High.  
     - **Response:** "Absolutely—but real systems do this invisibly. We made it explicit to critique it. Foucault wants us to see how power shapes us so we can challenge it."  

  3. **Instructor seen as "power holder":**  
     - *Likelihood:* High early on.  
     - **Mitigation:**  
       - In Phase 4, stress: "The cards decided, not me."  
       - Debrief: "I set the system, but once running, it controlled outcomes. The ‘file’ mattered more than my opinions."  

  4. **Internalization doesn’t "stick":**  
     - *Likelihood:* Mixed. If groups revert when observation stops, note: "Some resisted! Foucault says power isn’t total—but norms often win."  

  5. **One group dominates/collapses:**  
     - *Mitigation:* Observers discreetly redirect: "Remember the criteria—everyone should contribute."  

  ---

  ### **What the Exercise Can’t Simulate (Requires Instructor Input)**  
  - **Long-term internalization:** Foucault’s power works over years, not minutes. **Say:** "You felt a flicker of self-discipline. Imagine this daily—it shapes who you become."  
  - **Structural invisibility:** Real systems hide their mechanisms. **Say:** "We revealed the gears. Normally, they’re buried in rules, architecture, or data-tracking."  
  - **Power/knowledge as ideology:** Your students created categories "democratically," but Foucault notes criteria are often imposed by elites. **Highlight:** "Even ‘neutral’ criteria favor some—e.g., ‘speaks clearly’ might privilege native speakers."  

  ---

  ### **Why This Works for Your Goals**  
  - **Intermittent observation:** Timer-based bursts create uncertainty. Students self-regulate even when you’re "gone."  
  - **Categories → ranking → behavior:** Student-defined criteria feel "fair," but later enforce norms (e.g., "inviting quiet members" becomes performative).  
  - **Internalization test:** The "no observation" phase exposes habit over compliance.  
  - **File over person:** Sticky labels on record cards ensure early judgments override later reality.  
  - **Power ≠ prohibition:** Consequences are "rewards" (seating, chocolate) tied to files—no one says "no."  

  **Prep Tips:**  
  - Rehearse timer bursts with your TA.  
  - Pre-write 2–3 sticky labels for record cards to deploy quickly.  
  - If students resist, lean in: "Interesting—why push back? Foucault would celebrate that!"  

  This design makes power tangible, avoids lecture, and centers student experience. Foucault’s ideas emerge from their actions—not your explanation.
