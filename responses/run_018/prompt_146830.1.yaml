answer: |-
  Here’s the sonnet, crafting the volta as the precise moment moral reasoning contaminates immediate action, mirroring Williams’ critique:

  **The Rescue**

  No thought, just water’s cold and choking grip,  
  His hand finds hers where frantic currents twist,  
  Muscles strain against the swirling slip,  
  Her fingers clutch his wrist, a desperate tryst.  
  He heaves against the river’s sucking hold,  
  His back burns, lungs scream for the vanished air,  
  One shoulder lifts her, braced against the cold,  
  Her weight, a known burden, lifted clear.  

  **It is permitted because she is mine.**  
  This reason forms, a cold, intrusive line  
  That breaks the current of the act’s pure flow.  
  Duty asserts a necessary claim,  
  A justification whispers her known name.  
  The water’s weight now bears an extra woe.

  ---

  **Structural Breakdown for Your Seminar:**

  1.  **Octave (Lines 1-8): Purely Sensory/Physical Action:**
      *   **Imagery:** Water, grip, currents, muscles, lungs, shoulder, weight.
      *   **Verbs:** Choking, finds, strain, clutch, heaves, burns, scream, lifts, braced.
      *   **Rhyme:** ABBA ABBA (grip/slip, twist/tryst, hold/cold, air/clear). Focus on physicality (grip/twist/slip/hold) and action/state (tryst/air/clear/cold).
      *   **Tone:** Urgent, instinctive, embodied effort. No reflection, only *doing*.

  2.  **Volta (Line 9): The Intrusive Thought:**
      *   **Shift:** Sudden intrusion of abstract moral language: "permitted," "because," "mine."
      *   **Corruption:** The pure physical act (*lifting her*) is now framed as requiring *justification*. The phrase "it is permitted" explicitly introduces the external moral framework Williams critiques.

  3.  **Sestet (Lines 9-14): Conceptual/Permission Language:**
      *   **Rhyme Shift:** CDCD EE (mine/line, flow/claim, name/woe). Focus shifts to justification (mine/line), consequence/duty (flow/claim), and the resulting burden (name/woe).
      *   **Language:** "reason," "intrusive line," "act’s pure flow," "duty," "asserts," "necessary claim," "justification," "extra woe."
      *   **Effect:** The immediacy is shattered. The physical struggle ("water’s weight") now carries the metaphorical "extra woe" of the ethical calculation, the "one thought too many."

  The poem enacts the contamination Williams describes: the instinctive, integrity-driven act of rescue is retrospectively (and damagingly) framed within an abstract moral calculus at the precise moment of the turn, altering the nature of the action and its felt burden. The tension remains open – the rescue happens, but its meaning is irrevocably altered by the justification.
