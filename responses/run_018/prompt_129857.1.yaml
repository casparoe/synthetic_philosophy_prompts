answer: |-
  ### Joint Statement: Schema-Realists & Cluster-Contextualists  
  *On the Recognition of Letterforms Across Stylistic Variation*  

  #### 1. Agreed Claims  
  After adversarial collaboration, we affirm the following:  
  1. **Pixel-template matching is inadequate**: Humans don’t recognize letters by comparing exact pixel patterns; noise, scaling, and distortion break rigid templates.  
  2. **Grid-letter fonts reveal role-structures**: Simplified fonts (e.g., monoline grid-based "a"s) expose systematic relationships between strokes, terminals, and counters, which anchor letter identity.  
  3. **Robust human recognition**: Humans reliably identify "a" across extreme distortions (e.g., wobbly handwriting, fragmented outlines, or alien fonts), implying high-level processing.  
  4. **"Style-bleed" test case validity**: A hybrid glyph with the *spatial layout/connections* of an "a" but *stroke weight/terminals/counters* from a "g" (same font) is a well-defined probe. It isolates structural vs. stylistic factors cleanly.  

  ---

  #### 2. Disagreements Table  
  | Issue | Schema-Realist View | Cluster-Contextualist View |  
  |-------|----------------------|-----------------------------|  
  | **Topological invariance** | Necessary: An "a" *must* preserve core topology (e.g., enclosed counter, open bowl, ascender absence). Violations (e.g., disconnecting strokes) destroy "a"-ness. | Statistical accident: Topology is often stable because style spaces cluster around familiar configurations. But outliers exist (e.g., decorative "a"s with gaps), proving it’s not essential. |  
  | **Cyrillic "а" → Latin "a" recognition** | Evidence for universal skeleton: Cross-script recognition hinges on shared abstract roles (enclosed counter, curved spine). The mind maps variants to a latent "a"-schema. | Evidence for flexible learning: Recognition stems from statistical overlap in feature distributions (e.g., both have oval bowls). No skeleton needed—just brain-driven pattern completion. |  
  | **Style-bleed hybrid** | Separates structure from style: If recognizers accept it as "a", structure dominates. If rejected, style corrupts the skeleton. Probes the generative core’s autonomy. | Shows style dominates: Hybrids expose how local features (e.g., bulbous terminals) override global structure. "a"-ness is contextual, not decoupled from stylistic atoms. |  

  ---

  #### 3. Cruxes & Predictions  
  **Crux 1: Can essential "a" roles be defined non-circularly?**  
  - *Concrete test*: Define roles (e.g., "must have a closed counter", "descender forbidden") using only geometric primitives (curves, lines, junctions) *without* referencing human categorization.  
    - **Schema-Realist prediction**: Possible. Roles like "enclosure" or "terminal convergence" are abstract, computable primitives. A formal "a"-skeleton will generalize to unseen fonts.  
    - **Cluster-Contextualist prediction**: Impossible. Any role-set either excludes valid "a"s (e.g., open-counter handwritten "ɑ") or includes non-"a"s (e.g., "o" with a tail), forcing appeal to fuzzy recognition.  

  **Crux 2: Does skeleton-preservation enable robustness?**  
  - *Concrete test*: Train a neural net on *only* clean grid-font "a"s (no style variation). Test recognition on:  
    (a) Grid-font "a"s with mild distortions (e.g., skewed proportions).  
    (b) Style-bleed hybrids (e.g., "a" shape with "g" features).  
  - **Schema-Realist prediction**: Graceful degradation. (a) Succeeds; (b) Fails *only if* skeletons are violated. Recognition correlates with topological fidelity.  
  - **Cluster-Contextualist prediction**: Catastrophic failure. (a) Succeeds (statistical similarity), but (b) fails utterly—style-bleed breaks feature correlations, revealing no invariant core.  

  ---  
  *Signed in epistemic truce, awaiting empirical arbitration.*  
  — **Schema-Realists** (seeking the ghost in the glyph)  
  — **Cluster-Contextualists** (watching the wiggles win)
