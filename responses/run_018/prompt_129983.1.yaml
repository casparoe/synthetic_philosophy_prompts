  Maybe I should also mention that in law, unconscionable contracts can be voided - though that's nuclear option. More practically, the ensemble/multi-agent perspective gives solid grounding: no real counterparty can collateralize infinite obligations, so the promise lacks credibility.

  The psychological substitution worry is valid but addressable - we're not saying "we fear risk," we're saying "any entity would require compensation for nondiversifiable exposure." That's structural, not psychological.

