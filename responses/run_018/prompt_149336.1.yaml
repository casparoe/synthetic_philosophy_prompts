  **MEMORANDUM CA/ONB-23-7**  
  **TO:** Incoming Civic Assembly Members  
  **FROM:** Office of Statistical Fidelity & Civic Integrity (OSFCI)  
  **SUBJECT:** Mandatory Onboarding Protocols: Civic Assembly Service, Republic of Aethelgard  

  ---

  **1. SELECTION PROTOCOL**  
  1.1. Pursuant to the *Statute of Civic Equilibrium (SCE)*, all adult citizens of Aethelgard are equally eligible for legislative service via universal entry into the National Civic Pool (NCP).  
  1.2. Initial stratification occurs through automated Epistemic Band Assessment (EBA), aligning citizens with functional legislative needs:  
  &nbsp;&nbsp;&nbsp;&nbsp;1.2.1. **Generalist Band (GB):** Baseline deliberative capacity (85% of NCP).  
  &nbsp;&nbsp;&nbsp;&nbsp;1.2.2. **Domain-Specialist Band (DSB):** Recognized expertise in predefined functional domains (e.g., ecological systems, fiscal architecture; 12% of NCP).  
  &nbsp;&nbsp;&nbsp;&nbsp;1.2.3. **Meta-Cognitive Auditor Band (MCAB):** Demonstrated proficiency in deliberative meta-processes, systemic risk evaluation, and epistemic coherence validation (3% of NCP).  
  1.3. Final selection employs a cryptographically verified random draw *within* assigned bands to ensure pure equality of opportunity. Band assignment is a neutral procedural prerequisite, not a value hierarchy.  

  **2. EPISTEMIC BANDING AND POOL HYGIENE**  
  2.1. EBA algorithms undergo quarterly **Randomness Audits (RA)** by the Independent Algorithmic Integrity Panel (IAIP). Audits verify:  
  &nbsp;&nbsp;&nbsp;&nbsp;2.1.1. Absence of human intervention in band stratification outputs.  
  &nbsp;&nbsp;&nbsp;&nbsp;2.1.2. Statistical indistinguishability of draw sequences from true randomness within bands.  
  2.2. **Pool Hygiene Maintenance (PHM)** requires annual re-assessment of all citizens to ensure band alignment reflects current functional aptitudes.  
  &nbsp;&nbsp;&nbsp;&nbsp;2.2.1. Citizens may petition for band re-assessment via **Form EBA-7: Epistemic Recalibration Request**. Denials are non-appealable but noted for Statistical Fidelity Assurance.  
  &nbsp;&nbsp;&nbsp;&nbsp;2.2.2. **Grievance Form SF-12: Over-Qualification & Statistical Under-Representation (OQ-SUR)** is available for citizens demonstrating ≥3 consecutive non-selections despite band-qualified competence metrics. Submissions trigger an automated review of draw-weighting logs; outcomes are ceremonially filed.  

  **3. DELIBERATIVE OBLIGATIONS**  
  3.1. All members must uphold the **Principle of Band-Specific Deliberative Primacy (BSDP):**  
  &nbsp;&nbsp;&nbsp;&nbsp;3.1.1. **DSB Members:** Must complete **Mandatory Ignorance-Certification Workshop (ICW)** prior to service. ICW trains specialists to formally suspend domain-expertise during Generalist-led deliberations, except when expressly solicited under Clause 3.2.2.  
  &nbsp;&nbsp;&nbsp;&nbsp;3.1.2. **GB Members:** Bear primary responsibility for agenda-setting and normative deliberation. Expertise is recognized only through structured consultative channels.  
  &nbsp;&nbsp;&nbsp;&nbsp;3.1.3. **MCAB Members:** Monitored for meta-deliberative neutrality. Prohibited from introducing substantive proposals; may only flag "systemic epistemic drift" using **Form MA-4: Coherence Deviation Alert**.  
  3.2. **Expertise Deployment Protocol (EDP):**  
  &nbsp;&nbsp;&nbsp;&nbsp;3.2.1. Unsolicited interjection of specialist knowledge violates deliberative equality.  
  &nbsp;&nbsp;&nbsp;&nbsp;3.2.2. Specialist input may be formally requested via **Motion for Contextual Epistemic Activation (MCEA)**, subject to majority GB approval.  

  **4. GRIEVANCE AND RECUSAL**  
  4.1. Members may file **Recusal Request RR-9** if band assignment creates perceived deliberative disadvantage (e.g., GB member with latent specialist knowledge).  
  &nbsp;&nbsp;&nbsp;&nbsp;4.1.1. Approved recusals trigger immediate replacement via same-band draw.  
  4.2. **Grievance G-5: Band-Induced Cognitive Dissonance (BICD)** may be filed if a member experiences distress due to the obligation to withhold relevant knowledge. Resolution entails referral to the Civic Coherence Counselor.  

  **5. CONTINUITY RULES**  
  5.1. **Non-Branching Continuity Principle (NBCP):** In the event of member removal for documented incompetence (per *SCE* Art. 14), replacement draws must occur *exclusively* from the same epistemic band as the departed member.  
  &nbsp;&nbsp;&nbsp;&nbsp;5.1.1. Rationale: Preservation of "representative statistical fidelity" across the Assembly’s band composition.  
  &nbsp;&nbsp;&nbsp;&nbsp;5.1.2. **Incompetence Determination Panels (IDP)** must include one MCAB member to validate that removal grounds are procedural (attendance, decorum) and not competence-based, ensuring band integrity remains inviolate.  
  5.2. Mid-term band re-assessment is prohibited. Members serve in their drawn band irrespective of subsequent EBA results.  

  **6. STATISTICAL FIDELITY ASSURANCE**  
  6.1. OSFCI quarterly publishes **Band-Representation Equilibrium Reports (BRER)**, demonstrating mathematical parity between the NCP band distribution and the seated Assembly.  
  6.2. Civic equality is defined exclusively as *procedural randomness within state-determined functional categories*. Band proportionality reflects societal expertise topography, not value differentiation.  

  ---

  **ACKNOWLEDGMENT REQUIRED:**  
  By signing below, you affirm understanding that your selection embodies pure civic equality through randomized band-specific draw. Band assignment optimizes deliberative functionality without compromising the foundational principle that all citizens possess equal *potential* for stratified service.  

  ▶ **Signature:** ________________________  
  ▶ **Date:** ________________________  
  ▶ **Epistemic Band (Circle): GB / DSB / MCAB**  

  ---  
