answer: |-
  ### Step-by-Step Translation of Philosophical Positions into Legal Property Vocabulary  
  **Case:** The Block (protected Brutalist pavilion). Original concrete panels replaced with identical synthetics; steel rebar swapped for titanium alloy (same specs).  
  - **Preservation board:** Still The Block (easement protects design/footprint).  
  - **Tax assessor:** New parcel (0% original fabric).  
  - **Owners:** "Successor fixture" (inherits some rights, not others).  

  #### Restating Philosophical Positions in Legal Terms  
  **1. Coincidence of Statue and Lump (Constitution Without Identity)**  
  - **Philosophy:** Two distinct entities (statue and clay lump) occupy the same space but have different persistence conditions (e.g., lump survives reshaping; statue does not). No identity between them.  
  - **Legal Translation:**  
    - The Block (as *historic fixture*) and its *original fabric* (concrete/rebar) are distinct entities sharing the same physical space.  
    - **Preservation board** treats the *fixture* (The Block) as persisting via design/footprint, even when *original fabric* is replaced (like the statue surviving despite clay changes).  
    - **Tax assessor** treats *original fabric* as a separate "lump" entity; 0% retention = new *tax-parcel identity* (like the lump ceasing if melted).  
    - **Owners’ "successor fixture"** mirrors constitution without identity: The Block’s rights are partially inherited by the new structure, but it’s not identical to the original (e.g., tax benefits reset).  
  - **Fudging/Omissions:**  
    - Philosophy assumes *simultaneous* coincidence (statue/lump at time T). Here, replacement is gradual (20 years), so coincidence is diachronic. Legal "original fabric" isn’t a single lump but an aggregate, blurring the analogy.  
    - Omits philosophical debates about "essences" (e.g., is The Block’s identity tied to form or matter?). Law uses contractual thresholds (e.g., easement terms).  

  **2. Four-Dimensionalism**  
  - **Philosophy:** Objects are spacetime "worms" with temporal parts. The Block is the sum of its history (past, present, future stages).  
  - **Legal Translation:**  
    - **Preservation board** views The Block as a four-dimensional entity: its identity spans its entire timeline. Replaced parts are mere temporal segments; the *easement* binds the whole "worm" (design continuity = unity across time).  
    - **Tax assessor** isolates a temporal slice (current state) for *tax-parcel identity*. 0% original fabric = new parcel (like judging a statue at T2 separately from T1).  
    - **Renovation clause** in the easement acts as a "temporal boundary" test: if changes cross a threshold (*substantial transformation*), the future temporal part is severed.  
  - **Fudging/Omissions:**  
    - Law lacks explicit "temporal parts" ontology. Tax and preservation use conflicting temporal perspectives (whole history vs. snapshot), but this is pragmatic, not metaphysical.  
    - Omits perdurantism/endurantism debates. Law implicitly treats identity as *enduring* (The Block is "the same" if criteria are met) unless *substantial transformation* resets it.  

  **3. Dominant-Kind View**  
  - **Philosophy:** An object’s identity is determined by its dominant kind (e.g., "statue" > "lump"). Persistence depends on kind-specific conditions (e.g., statue survives if form is preserved).  
  - **Legal Translation:**  
    - **Preservation board** assigns dominance to *historic fixture* kind. Easement terms (design/footprint) define persistence conditions; material replacement is irrelevant if the "kind-defining" features endure.  
    - **Tax assessor** assigns dominance to *original fabric* kind for tax purposes. 0% retention = dominant kind lost, triggering new *tax-parcel identity*.  
    - **Owners’ "successor fixture"** implies a new dominant kind (e.g., "replica" or "improved structure") with hybrid rights, inheriting some *easement* obligations but not original tax status.  
  - **Fudging/Omissions:**  
    - Philosophy often treats dominant kind as intrinsic. Law makes it contextual: kind is defined by *easement* (preservation) vs. tax code (assessor).  
    - Omits metaphysical hierarchy (e.g., whether "fixture" or "fabric" is ontologically primary). Law resolves conflicts via statutes/courts, not kind primacy.  

  ---

  ### Residue Report: Mapping Cleanly, Distorting, or Absent  
  **What Maps Cleanly:**  
  - **Dominant-kind view ↔ Legal contextual dominance.** Preservation board (dominant kind = historic fixture) and tax assessor (dominant kind = original fabric) map directly. Owners’ "successor fixture" reflects kind reclassification.  
  - **Coincidence without identity ↔ Separation of fixture and fabric.** Legal system distinguishes *historic fixture* (persisting via design) from *original fabric* (taxable matter), allowing both views without contradiction.  
  - **Substantial transformation as a threshold** aligns with philosophy’s persistence conditions (e.g., statue is destroyed if flattened). Law operationalizes this via *renovation clauses* (e.g., 50% material change = loss of status).  

  **What Distorts:**  
  - **Gradual replacement vs. simultaneous coincidence.** Philosophy’s statue/clay is static; The Block’s 20-year replacement is dynamic. Law handles this via *continuous identity clauses* (e.g., easement terms for phased renovations), but this stretches "coincidence" by making it temporal, not spatial.  
  - **Four-dimensionalism’s temporal parts ↔ Snapshot vs. timeline perspectives.** Tax assessor (current state) and preservation board (whole history) approximate temporal parts, but law lacks a unified spacetime framework. This risks conflating *perdurantism* (parts) with *endurantism* (whole).  
  - **Original fabric as aggregate.** Philosophy’s "lump" is a unified entity; legal "original fabric" is an aggregate of parts. This distorts when assessing partial replacement (e.g., 10% vs. 0% retention).  

  **What Has No Expression in Property Law:**  
  - **Constitution as a metaphysical relation.** Law has no concept of "two objects occupying the same space simultaneously" (e.g., statue/lump). It collapses this into *fixture* identity (e.g., The Block *is* the structure, not a distinct entity from its materials).  
  - **Non-identity despite constitution.** Philosophy’s core claim (statue ≠ lump) has no legal counterpart. Law resolves disputes via definitions (e.g., easement terms), not ontological distinctions.  
  - **Kind essentialism.** Philosophy debates whether "Block-ness" is intrinsic; law treats it as contractual (e.g., *easement* defines what "The Block" means).  

  ---

  ### Analysis: Why Residue Exists  
  **1. Legal Identity is Pragmatic and Contextual; Metaphysics is Ontological:**  
  - Residue (e.g., no "constitution without identity") arises because law prioritizes *functional resolutions* over unified theories. Tax, preservation, and ownership each use *operational definitions* (e.g., "original fabric" for taxes, "design" for easements). Metaphysics seeks a universal account of "what The Block *is*"; law asks "how should we *treat* it for this purpose?"  
  - **Example:** Owners’ "successor fixture" is a legal compromise, not a metaphysical category. It avoids philosophy’s yes/no identity questions by allowing partial inheritance of rights.  

  **2. Distortions Highlight Law’s Flexibility:**  
  - Philosophy’s static examples (e.g., statue/clay) distort when applied to gradual changes because law uses *procedural thresholds* (e.g., *substantial transformation* tests). This isn’t a flaw—it shows law adapting metaphysics to real-world complexity (e.g., phased renovations).  

  **3. Absences Suggest Metaphysics Overcomplicates Contractual Definitions:**  
  - Gaps (e.g., no "non-identity despite constitution") imply that metaphysics introduces questions irrelevant to law. The easement’s *renovation clause* and *substantial transformation* standard act as contractual "identity conditions." Disputes are settled by interpreting these clauses, not probing "Block-ness."  
  - **Example:** Preservation board doesn’t argue about "temporal parts"—it enforces the easement’s terms. Tax assessor doesn’t debate "dominant kinds"—it applies tax code thresholds.  

  **4. But Law’s Gaps May Ignore Deeper Identity Concerns:**  
  - The tax assessor’s 0% rule ignores design continuity, while metaphysics might ask: "Can form persist without matter?" Law sidesteps this by isolating contexts (tax vs. preservation). This risks inconsistencies (e.g., The Block is "the same" for preservation but "new" for taxes) that metaphysics would critique.  

  ---  
  **Final Note for Rubric Construction:**  
  - **Strengths of Translation:** Dominant-kind and coincidence views map cleanly to legal contextualism; substantial transformation parallels persistence conditions.  
  - **Weaknesses:** Dynamic replacement strains static philosophical models; law’s aggregate treatment of "fabric" distorts lump-based metaphysics.  
  - **Critical Junctures:** Where philosophy demands "what is identity?," law asks "what do the contracts/statutes say?" Residue arises from this divergence in goals—not a failure of either framework.
