     - In philosophy: An object belongs to a dominant kind. The same matter can constitute different objects of different kinds (e.g., a statue and a lump), but the dominant kind determines what the object is. In our case, The Block is a historic structure (its dominant kind) and that kind has certain persistence conditions (e.g., it can survive replacement of parts as long as the form remains).
