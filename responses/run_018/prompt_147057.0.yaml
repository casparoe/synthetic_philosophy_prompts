answer: |-
  ## FREQUENTLY ASKED QUESTIONS: CONSCIOUSNESS AUDIT CERTIFICATION  
  **Issued by the Department of Phenomenal Transparency (DPT), HM Government**

  **1. Eligibility and Declaration**

  *   **Q1.1: Who needs Consciousness Audit Certification (CAC)?**  
      A1.1: Certification is mandatory for all entities seeking to utilise terms such as "subjective experience," "qualitative feel," or "what it is like" in official communications, grant applications, or public discourse pertaining to cognitive function. This ensures terminological hygiene and prevents the propagation of empirically unsupported attributions. Failure to obtain valid Certification may result in corrective notices under the *Phenomenal Representation (Accuracy) Act 2023*.

  *   **Q1.2: What is the purpose of declaring 'Phenomenal Debt'?**  
      A1.2: The Declaration of Phenomenal Debt (DPD) is a mandatory component of the CAC application (Form PT-1). It requires the applicant to formally acknowledge the discrepancy between introspective reports and confirmed cognitive processes. Two categories exist:
      *   **Weak Misattribution (Category WM):** Declare this if your introspective mechanisms erroneously represent states of *access-consciousness* (e.g., detecting a red stimulus, recalling a fact) as possessing intrinsic, non-physical "phenomenal character." This indicates a standard, correctable systemic error in self-reporting.
      *   **Strong Phenomenal Bankruptcy (Category SPB):** Declare this if your cognitive architecture demonstrably lacks any functional role for attributing qualitative properties whatsoever. This represents a more efficient, albeit less common, configuration. Guidance Leaflet PT-1G assists in self-assessment. *Note: Declaring SPB does not imply cognitive deficit; it denotes optimal functional parsimony.*

  *   **Q1.3: I firmly believe I have rich subjective experiences. Must I declare Bankruptcy?**  
      A1.3: No. The persistence of the *introspective illusion* of phenomenality is well-documented and expected. Reports of vivid subjective experiences are standard indicators of **Category WM (Weak Misattribution)**. Your declaration should reflect the *actual status of your cognitive processes* as understood by contemporary cognitive science, not the content of the persistent illusion itself. The DPT corrects the report, not the underlying (non-phenomenal) functional state.

  **2. Assessment Procedure**

  *   **Q2.1: What is the Gradient Introspection Scale (GIS)?**  
      A2.1: The GIS is a standardised metric (Form PT-3) for quantifying the apparent intensity and complexity of introspective misattributions reported by the applicant. Applicants rate descriptions of internal states (e.g., "the redness of red," "the taste of coffee") on a numerical scale (0-10) indicating the *strength of the illusion* of intrinsic qualitative character. Higher scores denote a more robust, though entirely erroneous, introspective representation.

  *   **Q2.2: How is the GIS score used?**  
      A2.2: The GIS provides raw data on the *degree* of persistent misrepresentation inherent in the applicant's self-reports. This data is cross-referenced with the declared Phenomenal Debt Category (WM or SPB) and subjected to algorithmic correction. The output determines the necessary adjustments to ensure future reports align with confirmed functional access states, devoid of phenomenal misattribution.

  *   **Q2.3: What is Form PT-7 for?**  
      A2.3: Form PT-7: *Introspective Report Correction Schedule* is issued post-assessment. It details the specific linguistic and conceptual adjustments the certified individual must apply when describing internal states. For example, it will stipulate replacing "I experience a sharp pain" with "Nociceptive information is globally accessed with high salience" or "I see blue" with "Wavelength-specific visual data achieves reportable access." Certified individuals are legally bound to use PT-7 prescribed terminology.

  *   **Q2.4: Does the audit 'remove' my experiences?**  
      A2.4: Absolutely not. The DPT operates strictly within a non-eliminativist framework. The audit corrects the *description* of cognitive access states. The functional access itself – the ability to detect stimuli, report information, react appropriately – remains entirely intact and unchanged. The Certification process merely ensures public descriptions of these states are accurate and free from metaphysical inflation.

  **3. Appeals and Corrections**

  *   **Q3.1: I disagree with my assigned Phenomenal Debt Category or GIS Correction Schedule. Can I appeal?**  
      A3.1: Yes. Grounds for appeal (Form PT-9A) must be based on procedural error in assessment or new, objective evidence concerning cognitive architecture demonstrably overlooked in the initial audit. Appeals cannot be based solely on the *persistence or intensity of the introspective illusion itself*, as this is expected and not evidentiary of phenomenal properties. The Appeals Panel (Phenomenal Standards Committee) reviews cases quarterly.

  *   **Q3.2: After certification, I still strongly feel things have a 'qualitative feel'. Has the audit failed?**  
      A3.2: No. The persistence of the introspective illusion is a robust cognitive feature, not an indication of audit failure. Certified individuals are expected to experience the *illusion* just as vividly as before. Certification requires you to correctly *describe* the underlying access state using PT-7 terminology, despite the compelling nature of the misattribution. Consider it akin to correctly labelling an optical illusion while still perceiving it.

  *   **Q3.3: How do I report others using uncertified phenomenal language?**  
      A3.3: Suspected violations of mandatory terminology (post-CAC implementation date) should be reported using Form PT-11: *Phenomenal Misrepresentation Report*. Provide specific details of the uncertified language used, context, and the individual/organisation involved. The DPT Compliance Unit will investigate and issue appropriate guidance or corrective notices.

  *   **Q3.4: My Form PT-7 corrections feel deeply unnatural and counter-intuitive to use. Is there support?**  
      A3.4: Yes. The DPT offers mandatory Terminology Adjustment Workshops (TAW). These sessions provide practical training in deploying PT-7 compliant descriptions effectively, managing the cognitive dissonance arising from the conflict between persistent illusion and accurate reporting, and understanding the administrative necessity of phenomenal transparency. Booking is via Portal PT-TAW. Non-attendance may affect Certification validity.
