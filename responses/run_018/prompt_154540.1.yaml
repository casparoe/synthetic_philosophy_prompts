answer: |-
  Here's the mapping of the Willingham case onto a retributive risk framework, addressing your specific queries:

  ### 1. **Moral Risk Allocation**
     - **Forensic Experts**: Bear primary *professional* moral risk. Their flawed arson indicators (e.g., "crazed glass," pour patterns) were presented as objective science, breaching the reliability threshold. Their failure corrupted the factual basis for desert.
     - **Prosecution/Defense Counsel**: Prosecution amplified unreliable evidence; defense provided inadequate challenge to junk science. Shared *procedural* moral risk for failing the adversarial test.
     - **Trial Jury**: Secondary moral risk. They relied on institutional actors (experts, courts) to vet evidence. Framework assigns them minimal *epistemic* risk—they’re not experts, but their dismissal of contradictory testimony (e.g., jailhouse informant) compounds culpability.
     - **Appellate Courts/Governor**: Highest *institutional* moral risk. Post-conviction evidence (2004 affidavit from fire expert Gerald Hurst) showed innocence, yet courts denied appeals and Governor Perry denied clemency without review. Their role as reliability "fail-safe" failed catastrophically.

  ### 2. **Deterrence as Noisy Signal**
     - **False Positives Undermine Specific Deterrence**: If executions include innocents (false positives), the signal becomes noise. Rational actors may perceive punishment as *unpredictable* rather than inevitable, reducing deterrence credibility.
     - **Systemic Trust Collapse**: When wrongful executions surface (e.g., Willingham, later exonerations), public trust in the system’s accuracy erodes. Potential offenders may discount deterrence if they believe the state lacks reliability ("I could be framed").
     - **Net Effect**: Noise introduces irrationality—punishment appears arbitrary, not tied to guilt. Consequentialist deterrence requires high-fidelity signals; this case shows false positives corrupt the signal entirely.

  ### 3. **Framework Collapse Pressures**
     - **"Never Execute" Temptation**: The case exposes that institutional reliability thresholds (e.g., forensic validity, appellate scrutiny) are *unknowable in real-time*. Willingham’s execution violated both desert (innocence) and reliability (junk science). If such errors evade detection for years, the framework risks becoming retroactively abolitionist.
     - **Consequentialist Drift**: To avoid collapse, one might lower reliability standards (e.g., "acceptable error rate"), but this abandons retributivism’s core. Alternatively, insisting on near-perfect reliability makes execution practically impossible—pushing toward de facto abolition without principled rejection.
     - **Framework Survival**: It survives only if reliability thresholds are *enforceable* pre-execution. Willingham proves they aren’t, suggesting the framework is theoretically sound but institutionally unattainable.

  ### 4. **Where the Framework is Silent**
     - **Victim Family Welfare**: Retributive risk focuses on the accused and state’s moral duties. It ignores secondary harm to families who:
       - Endure trauma from learning an innocent person was executed "for" their loss.
       - Are denied true closure if the real perpetrator remains free.
       - Experience public re-victimization through systemic exposure.
     - **Broader Social Trust**: No accounting for societal erosion when wrongful executions become public. The framework’s individualism misses collateral damage to civic faith in justice.

  ---

  **Verdict:** **Complicates** the framework by exposing the irreconcilable gap between its demand for institutional infallibility and the demonstrable fallibility of all human systems.
