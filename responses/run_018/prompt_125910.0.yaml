answer: |-
  Here’s a practical, runnable activity designed to force participants into the tension between oral history and archival records. It prioritizes experiential learning and role-based negotiation:

  **Activity Title:** *The Riverbend Flood: Memory vs. Paper*

  **Core Conflict:** Elders unanimously remember a devastating flood/rescue in **1973**. Archives (news, maps, insurance) definitively place it in **1979** with no rescue noted.

  **Time:** 80 mins  
  **Participants:** 13 (split into 3 groups: **Oral Historians x4**, **Archivists x5**, **Mediators x4**)

  ---

  ### Materials Needed (Prep in Advance)
  1.  **Role Sheets (Confidential):**
      *   **Oral Historians (4):** "You represent Riverbend's elders. Your core truths: Flood was in **1973** during Old Mill's peak operation. Neighbors *did* heroically rescue each other (especially the Dawson family saving the Garcias). This story is the bedrock of the town's identity & mutual aid. **Goal:** Protect the 1973 narrative & rescue story. Your evidence packet contains **elder interview snippets (conflicting minor details but consistent on 1973/rescue)** and **1 faded, undated photo of 'flood damage'**."
      *   **Archivists (5):** "You represent historical accuracy. Your core truths: Flood was **1979** (Old Mill was mostly closed). County records show *no rescues*; insurance claims list only property damage. The '73 heavy rain was minor. **Goal:** Uphold the documented 1979 record. Your evidence packet contains **newspaper clips (headline: "1979 Deluge Swamps Riverbend"), county flood zone map (dated 1979), insurance claim summaries (no injury/rescue claims)**."
      *   **Mediators (4):** "You are the Town Reconciliation Committee. **Goal:** Produce a *single, official "Community Record"* for the town archive/memorial by session end. You must reconcile the versions. You have **BOTH evidence packets** and a **Mediator Brief** outlining: *The social bond created by the rescue story is real NOW, regardless of 1973/1979. The town needs unity. How do you weigh lived experience against official records?*"
  2.  **Payoff Scheme Poster:**
      *   **Oral Historians:** Gain 2 "Trust Points" per mediator who accepts **1973 + Rescue** as core truth. Lose 1 point if **Rescue** is omitted.
      *   **Archivists:** Gain 2 "Accuracy Points" per mediator who accepts **1979 + No Rescue** as core truth. Lose 1 point if **1979** is changed.
      *   **Mediators:** Share a pool of 10 "Community Cohesion Points." They GAIN points if their final record is **unanimously accepted** by Oral Historians *and* Archivists (+2 points each group's acceptance). They LOSE points if either group **outright rejects** the record (-3 per rejection).
  3.  **Evidence Packets:** Manilla envelopes with respective documents (keep them visually distinct).
  4.  **Timer, Whiteboard/Paper for "Community Record" drafting, Nametags.**

  ---

  ### Run Sheet (80 Mins)

  1.  **Intro & Framing (5 mins):**
      *   "Welcome. Today, you're resolving a historical dispute in the fictional town of Riverbend. Your goal is to determine the 'true' story of a major flood. You'll work in role-based teams with conflicting evidence. A payoff scheme incentivizes your roles. Ready? Go to your groups!" (Assign groups visibly).

  2.  **Group Prep (20 mins):**
      *   Groups separate. Distribute **Role Sheets & Evidence Packets**.
      *   Task: *Understand your core truths, evidence, and goals. Plan your negotiation strategy. How will you convince others? What's non-negotiable? Mediators: Familiarize yourselves with both evidence sets and the payoff stakes.*
      *   Circulate, answer clarifying questions ONLY. Don't solve problems.

  3.  **Negotiation Rounds (40 mins - Strict Timing!):**
      *   **Round 1: Fact-Sharing (15 mins):** Groups meet together. Each group presents their **core evidence** (not deep arguments yet). *Oral Historians:* Share interview snippets emphasizing 1973/rescue. *Archivists:* Show dated documents (1979/no rescue). *Mediators:* Listen, take notes, ask clarifying questions. **Focus: What does each side claim?**
      *   **Round 2: Argument & Pressure (20 mins):** Open negotiation. Groups argue their case. Mediators probe inconsistencies ("Archivists, why no mention of rescues?" / "Oral Historians, why do archives disagree?"). **Focus: Why is your version vital? What's lost if yours 'loses'?** Mediators start drafting possible "Community Records" on whiteboard.
      *   **Round 3: The Crunch (5 mins):** Mediators present 1-2 draft "Community Record" options. Groups give *initial, non-binding* reactions based on payoff stakes. **Focus: Urgency! What concessions hurt least? Mediators: Make final edits.**

  4.  **Decision & Payoff (5 mins):**
      *   Mediators post the **FINAL "Community Record"**.
      *   **Oral Historians & Archivists:** Vote openly: **Accept** or **Reject** the final record based on your payoff goals.
      *   **Tally Payoffs:** Quickly calculate points for each group based on votes/record. Announce winners (if any) briefly. *The point is the tension, not the points.*

  5.  **Debrief (10 mins - Critical!):** *Guide them to articulate the core tension.*
      *   "What FELT hardest during negotiation?" (Listen for: Ignoring elders, distrusting documents, pressure to choose).
      *   "Oral Historians: What did you fear losing if the archive 'won'?" (Identity, social bonds, trust).
      *   "Archivists: What felt risky about accepting the oral version?" (Accuracy, precedent, undermining records).
      *   "Mediators: What pressures shaped your final record?" (Social cohesion payoff vs. truth claims).
      *   **Key Insight Prompt:** "When the final record picked one date/fact... what got erased or sidelined? Was it *just* a date?" (Target: The *meaning* - the rescue, the social bond, the lived experience OR the institutional authority of the record).
      *   **Connect (Briefly):** "You lived a microcosm of a huge historical tension. What do we call this clash? [Gather terms: Memory vs. History, Lived Experience vs. Official Record...] Yes. Maurice Halbwachs called it 'Collective Memory' – the way communities actively shape their past for present needs, sometimes clashing with documented 'history.' The stakes are real: whose story gets validated? Whose identity is erased?"

  ---

  ### What Will Predictably Go Wrong (And Why It's Useful)

  1.  **Archivists Dominate Early:** The "paper proof" feels more objective. Oral Historians get frustrated feeling dismissed as "just stories." *This mirrors real power dynamics!* **Your Intervention:** Remind groups *during prep* that Oral Historians hold a *social truth* vital to the community *now*. Ask Mediators in Round 2: "What cost does the town pay if the rescue story is erased?"
  2.  **Oral Historians Over-Simplify/Get Defensive:** They might ignore minor inconsistencies in their testimonies or refuse any compromise on 1973/rescue. *This shows the emotional investment in memory.* **Your Intervention:** Ask Archivists: "How could the rescue *not* be in the records?" (e.g., informal help, claims not filed). Ask Mediators: "Can the *meaning* of the rescue be preserved even if the date changes?"
  3.  **Mediators Rush to Shallow Compromise:** E.g., "The flood happened sometime in the 70s and... stuff." This avoids conflict but satisfies no one and erases specifics. *This shows the difficulty of true synthesis.* **Your Intervention:** Highlight the payoff – a wishy-washy record risks rejection (-3 points!).
  4.  **Time Crunch Forces Bad Decisions:** The pressure is intentional! It forces prioritization and reveals what each group *truly* values most.

  ---

  ### The Unavoidable Limitation (What You Must Supply)

  *   **The Game Can't Simulate Institutional Power:** While Archivists have "evidence," the activity can't fully replicate the **systemic authority, resources, and perceived neutrality** vested in real archives/institutions over generations. Oral history often fights an uphill battle against this ingrained legitimacy.
  *   **Your Crucial Input in Debrief:** Explicitly state this *after* they articulate the tension: "Remember, in the real world, the archive isn't just documents; it's backed by universities, governments, legal systems. That institutional weight makes challenging it incredibly hard. Oral history, especially from marginalized groups, often struggles to be heard *as legitimate history* against that power. Your negotiation happened in a vacuum; reality is messier."

  **Why This Works:** It forces choice under pressure with tangible (if small) stakes. They *experience* the erasure of social meaning when the paper trail wins and the dismissal of verifiable fact when memory wins. The debrief ties their lived frustration directly to the theoretical concept. Good luck!
