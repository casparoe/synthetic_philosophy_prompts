prompt: |-
  I'm a philosophy PhD student who also advises a regional disaster-response board, and I need a reusable decision proceedure for rescue-allocation cases where we can't save everyone. I want it grounded in the Taurek-style view that raw numbers shouldn't decide—saving five doesn't automatically outweigh saving one—but I need it to handle real messiness: victim counts that are estimates with big error bars, partial rescue where survivors are left severely disabled, and knock-on harm to dependants. Write the procedure as ordered questions with clear stop/no-stop points, flag exactly where judgment replaces calculation, and say what it can't settle. Then run it on two proposals: (a) one helicopter can reach either a confirmed 3 people in a flooded clinic or an estimated 8–15 in a remote valley with unreliable headcounts; (b) a rapid unit saves more lives but leaves survivors with serious disability, while a slower unit saves fewer but intact. Include one case where the procedure gives an answer the board will hate. Keep it practical—something people without philosophy training can run in a meeting.
reasoning: |-
  Okay, the user is a philosophy PhD student advising a disaster-response board. They need a practical decision procedure for rescue allocation that doesn't prioritize numbers alone, inspired by Taurek's view. But they also have to deal with real-world complexities like uncertain victim counts, partial rescues with disabilities, and effects on dependents. 

  Hmm, the challenge here is balancing philosophical rigor with operational usability. The user explicitly wants something non-utilitarian but still actionable—no small feat. They're clearly frustrated by crude "save the most lives" approaches but recognize that pure Taurek (where numbers literally don't matter) is impractical for a disaster board. 

  *Pauses to consider Taurek's core argument*... Right, the key is rejecting interpersonal comparisons of value. So the procedure must avoid aggregating lives saved as a sum. Instead, I should anchor it in pairwise comparisons between options—asking which group's rescue we'd choose if we could only save one. That preserves Taurek's spirit while allowing structure. 

  *Brainstorms friction points*: 
  - Uncertainty bands (e.g., "8-15 people") need framing without collapsing to best/worst case. 
  - Disability outcomes require defining "significant harm" without medical jargon. 
  - Dependents introduce cascading consequences. Must flag where judgments enter. 

  *Starts drafting question flow*: 
  First question must force explicit acknowledgment of uncertainty—no hiding behind point estimates. Then pairwise comparison as the Taurek-compatible engine. Third question for irreversible harms... ah, but "significant harm" needs examples (paraplegia? traumatic amnesia?) to keep it concrete for non-philosophers. 

  *Worries about the "board will hate" requirement*... The valley vs. clinic case could do it. If low-end valley estimate (8) is close to clinic (3), but uncertainty high, the procedure might force choosing clinic due to certainty—even though valley *could* save more. Board members favoring "gamble to save more" will rage. Perfect. 

  *Checks disability trade-off*... Slow unit vs. fast unit is trickier. Must emphasize that disability severity matters more than numbers here. If paralysis vs. minor limp, the answer shifts. Need to stress "judgment call" flags loudly. 

  *Final safeguard*: Explicit "unsettled cases" section. If pairwise comparison is truly indeterminate (e.g., identical harm profiles), admit it—no fake precision. The board needs to know when they're flipping coins philosophically. 

  *Tests mental model*: Ran both cases. Valley/clinic stops at Q3 if valley min>clinic count? No—Q3 is about harm, not numbers. Clinic wins on certainty only if valley estimate is unreliable *and* pairwise indecisive. Made that clearer in the flowchart notes. Good.
answer: |-
  Here’s a practical, reusable decision procedure grounded in Taurek’s view that numbers alone don’t justify sacrificing lives, while incorporating real-world complexities. Designed for non-philosophers to use under time pressure:

  ---

  ### **Rescue Allocation Decision Procedure**  
  **Core Principle:** No life is inherently worth less than others. We don’t trade lives for numbers, but we may prioritize based on *certainty*, *harm reduction*, and *irreversible loss*.

  #### **Ordered Questions & Stopping Points**  
  1. **"Are all options *equally uncertain* about who/how many we save?"**  
     - **NO →** Prioritize the option with **best-confirmed information** (e.g., verified headcounts > estimates).  
     - **YES →** Proceed to Q2.  
     - *Judgment call: Assess source reliability (e.g., "remote valley headcount from 1 distressed caller" vs. "clinic staff radio").*  

  2. **"If we could *only save one group*, which rescue would we choose? (Consider each group’s *fate if abandoned*)**"  
     - Compare groups **pairwise** (e.g., "Clinic group vs. Valley group"). If one group faces:  
       - **Clearly worse abandonment outcome** (e.g., drowning now vs. starvation in 48hrs), prioritize them.  
       - **No clear difference** → Proceed to Q3.  
     - *Judgment call: Define "worse outcome" by immediacy of death, suffering, or irreversible loss (e.g., "trapped in rising water" > "stable rubble").*  

  3. **"Does one option cause *significantly less harm* to survivors *or* dependants?"**  
     - **YES →** Prioritize that option. "Harm" includes:  
       - **Severe disability** (e.g., paralysis, major organ failure).  
       - **Dependant impact** (e.g., orphans with no caretakers).  
     - **NO →** **STOP. Flip a fair coin** (per Taurek’s equal respect).  
     - *Judgment call: Define "significant harm." Use examples: "unable to walk" = significant; "broken limb" = not. Dependant harm requires knowledge of social context.*  

  #### **What This Procedure CANNOT Settle**  
  - Comparing incomparable harms (e.g., "1 death vs. 10 severe disabilities").  
  - When all options have identical outcomes after Q1–Q3.  
  - Ethical weight of saving identifiable vs. statistical lives.  

  ---

  ### **Case Applications**  
  **Case (a): Helicopter choice**  
  - *Option A:* Save **3 confirmed** in flooded clinic.  
  - *Option B:* Save **8–15 estimated** in remote valley (unreliable headcount).  

  1. **Q1:** Uncertainty unequal → **Prioritize clinic (Option A)** due to confirmed headcount & location.  
     - *Why the board may hate this:* Valley *could* save 15 lives, but unreliable data fails Q1. Taurek rejects gambling with lives based on guesses.  

  **Case (b): Rapid vs. slow rescue unit**  
  - *Option A (rapid):* Save **12 people** but leave **all with severe disabilities**.  
  - *Option B (slow):* Save **8 people intact**.  

  1. **Q1:** Equal uncertainty (assume both certain). Proceed to Q2.  
  2. **Q2:** Compare abandonment: Identical death risk → Proceed to Q3.  
  3. **Q3:** Option B causes less harm (no disability) → **Prioritize Option B**.  
     - *Judgment note:* If disabilities were minor (e.g., scars), Q3 may not trigger, forcing a coin flip.  

  ---

  ### **Key Features for Practical Use**  
  - **Time-limited:** Complete in 5–10 minutes.  
  - **Stop/Go Points:** Clear "prioritize" or "flip coin" outcomes.  
  - **Judgment Flags:** Explicitly marked (Q1–Q3) with real-world examples.  
  - **Philosophy Made Practical:** Rejects raw numbers without ignoring suffering or uncertainty.  

  **When to Override:** Only if new evidence invalidates Q1 (e.g., valley headcount verified mid-debate). This procedure prevents agonizing over incomparable values—accept that some trade-offs *have no moral answer*.
