  First, I need to clearly understand both frameworks. The marginal-harm approach focuses on the actual harm caused to each individual animal affected by consumption choices. Meanwhile, the counterfactual-replacement view considers what would happen to animals if they weren't farmed - whether they'd exist at all or face different harms in the wild.

  The land-use aspect is crucial here. Beef relies more on pasture which displaces wild animals, while chicken depends on cropland that causes field deaths during cultivation. I recall that producing equivalent protein from chicken requires less land but more intensive crop use than beef. 

  For the marginal-harm framework:
  - Beef causes massive suffering per animal but uses land that might otherwise support wild animals
  - Chicken farming causes less direct suffering per animal but crop cultivation kills many wild animals
  - The trade-off depends on whether more wild animals die in crop production than would have lived on pastureland

  For counterfactual-replacement:
  - Farmed chickens wouldn't exist at all without demand
  - Their lives might be worse than non-existence due to suffering
  - Wild animals killed in crop production would otherwise exist with potentially better lives
  - Shifting to chicken likely increases harm because it creates more suffering animals

  The key normative divergence seems to be about existence itself: whether bringing creatures into miserable lives constitutes harm (relevant in counterfactual view) versus only counting harms to existing beings (marginal-harm view). 

  I should also note that empirical uncertainties about wild animal populations make both frameworks somewhat indeterminate, though for different reasons. The pasture vs cropland comparison contains many variables like local ecosystems and farming practices.

