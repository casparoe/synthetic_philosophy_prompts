  hey can u rank these four defenses of Berkeley's master argumet from best to worst in S/A/B/C/D tiers? 1) God is always perceiving so nothing ever actually disappears. 2) Ideas have a dormant or potential existence in the divine mind even when unobserved. 3) Other people keep objects real through shared or collective perception. 4) My own weird twist: unperceived things are just 'ghost patterns' in God's mind, structurally there but they dont have actual being, like leftover blueprints. One sentence per tier explaining why. Also, do u think Berkeley would have hated option 4 or secretly liked it?
