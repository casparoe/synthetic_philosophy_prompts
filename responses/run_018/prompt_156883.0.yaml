  ...And avoid solving it. The unresolved tension is the point.
answer: |-
  Here's a breakdown for your dialogue, focusing on the messy reality of interpreting absences and beliefs, keeping it sharp and jargon-light:

  **The Core Knot (Mirror Constraint):**

  1.  **The Problem:** Your character nailed it. Claiming an *absence* (like no grave goods) is *meaningful* (intentional omission due to belief/institution) rather than *accidental* (rotted away, stolen, never used) requires prior assumptions *about* the very belief/institution you're trying to prove. It's chicken-and-egg archaeology.
  2.  **Why It's Messy:** You can't dig up an absence. You dig up *what's there*. Inferring meaning from what *isn't* there is inherently speculative and relies heavily on context and comparison. It's the hardest kind of inference.

  **How Archaeologists Try (and Often Fail) to Break the Circle:**

  They don't have a magic bullet, but they use a toolkit of imperfect methods to build a *plausible* case:

  *   **Comparative Context is King:**
      *   **Across Space:** Look at contemporary sites nearby *with similar climates and preservation conditions*. If *those* sites consistently have preserved grave goods (even perishable ones leaving traces like stains, voids, or associated fasteners), then the absence *here* looks more suspiciously intentional. If *everywhere* in the region lacks goods under similar conditions, maybe it's taphonomy (decay) or a widespread practice, but not necessarily belief-driven.
      *   **Across Time:** Look at the same site/culture over time. If earlier/later periods *do* have grave goods (again, considering preservation), the absence in *this* period becomes more noteworthy and potentially meaningful.
      *   **Across Social Strata:** If *some* graves at the site (elites?) have goods preserved (stone, metal, ceramics), but others (commoners?) consistently lack even *perishable* good traces (like fabric stains or food residue voids), it suggests the absence for the commoners might be intentional deprivation (an institution), not just decay.

  *   **Patterns Over Single Instances:** One grave with no goods is meaningless. A consistent pattern across dozens or hundreds of graves, especially when contrasted with patterns elsewhere or in other contexts (like domestic refuse showing they *had* goods), builds a stronger case for intentionality.

  *   **"Positive" Evidence of Prohibition:** Sometimes you get lucky. Maybe there's writing (rare for deep prehistory) explicitly forbidding grave goods. More likely, symbolic art *elsewhere* (pottery, wall paintings) depicts burials *without* goods, or myths recorded later talk about the dead needing nothing. This positive evidence *supports* interpreting the absence as meaningful.

  *   **The Body Itself:** The treatment of the body can be a clue. Is the body positioned in a way that *implies* preparation for something (arms crossed, facing a certain direction, bound) despite the lack of goods? This might suggest a belief system operating, even if goods are omitted.

  *   **Ruling Out Alternatives (Taphonomy):** They get *really* forensic about the burial environment. Was the soil acidic (destroys bone and organics)? Was it waterlogged (preserves organics)? Was there evidence of looting? Could small, perishable goods have simply left no trace? If they can *reasonably* rule out decay or destruction as the *only* explanation for the *consistent* absence, intentionality becomes the more plausible (though still not certain) inference.

  **Positive Traces (Symbols) vs. Negative Traces (Omissions):**

  *   **Positive Traces (Symbols on Pottery, Figurines, Art):** These are *direct* evidence of symbolic thought. They scream "meaning!" They show *what* was represented or valued. **Strengths:** Clearer, less ambiguous (though interpretation is still tricky!). **Weakness:** They might represent ideals, myths, or elite concerns, not universal beliefs. They might be decorative, not sacred.
  *   **Negative Traces (Systematic Omissions/Constraints):** These are *indirect* evidence. They show *limits* or *rules* applied to material culture/behavior. **Strengths:** Can reveal widespread social norms/institutions that permeated daily practice (like consistently *not* placing goods). Can hint at taboos or egalitarian ideals hard to see positively. **Weakness:** Highly inferential. Was it really a "rule," or just poverty, decay, or habit? Proving intentionality is the core challenge (the Mirror Constraint).

  **The Dialogue Angle (Sharp & Real):**

  *   **Pro-"Belief" Character (Using Absences):** "Look, we've dug thirty shaft graves in this necropolis. Same limestone bedrock, same dry microclimate as Tomb Complex A ten miles east. Complex A has textiles, wood fragments, food residue – the works. Here? Nothing. Not a bead, not a stain, not a void where wood rotted. Just bodies, laid out identically. Thirty times? That's not decay, that's *design*. They meant to send them off with nothing. What does that *say*?"
  *   **Pro-"Logistics/Climate" Character (Skeptical):** "Design? Or just poverty? Or maybe they mourned differently – songs, not stuff, leaving no trace. You're seeing a 'meaningful absence' because you *want* it to mean 'spiritual austerity' or some egalitarian ideal. But you're building your whole 'belief' on *nothing*! Literally! You need the belief to explain the nothing, but you only get the belief *from* the nothing. It's circular, and climate/preservation is the simpler answer until proven otherwise. Complex A was richer soil, maybe better sealed tombs. Prove it *wasn't* taphonomy first."
  *   **Pro-"Belief" Retort:** "Simpler? Ignoring the pattern is simpler? What about the body position – identical ritual posture every time? That's positive evidence of *practice*. Combine that with the systematic lack of goods *where goods could have survived*... it's not proof, but it's a damn strong pattern pointing to a cultural *rule*. Rules imply belief, or at least institutional force. You're reducing them to mindless actors blown by the wind and soil chemistry."

  **Is Your Character's Cynicism Valid?**

  *   **It's a Recognized Minefield, Not Necessarily a Dead End:** Your character's stance ("archaeology can never be a science of minds, only of material constraints") echoes a **huge** and **ongoing** debate in archaeology.
      *   **The Processualists (Mid-20th Cen):** Tried to be "scientific," often downplayed ideology/belief, focused on adaptation, environment, technology, and systems (material constraints). Your character sounds like a disillusioned processualist.
      *   **The Post-Processualists (Later 20th Cen - Present):** Revolted against this. Argued that meaning, belief, ideology, and individual agency *are* accessible through material culture, but require careful, reflexive interpretation, acknowledging the archaeologist's own biases. They embrace the ambiguity but argue we *can* and *must* talk about past minds.
  *   **The Middle Ground (Where Most Work Happens):** Most archaeologists acknowledge the extreme difficulty and inherent uncertainty in inferring specific beliefs, especially from absences. They focus on reconstructing *practices*, *rituals*, and *social structures* (which are materially evident) and cautiously infer the *likely* underlying concepts, ideologies, or institutions that *constrained or motivated* those practices. They use the tools mentioned above to make the best *possible*, probabilistic argument.
  *   **So, is it cynical?** It's a valid *frustration* and highlights a fundamental limitation. Archaeology will *never* have the direct access to individual thoughts that a historian might get from a diary. **Is it a dead end? No.** It's an *acknowledged challenge*. Many archaeologists believe we *can* make robust inferences about past *concepts*, *worldviews*, and *institutions* by weaving together patterns of material evidence (both positive and negative), context, and comparison, while constantly questioning our assumptions. They just accept it's more like building a complex legal case based on circumstantial evidence than performing a lab experiment.

  **Key for Your Scene:**

  *   Let the argument hinge on **specific evidence** at *this* site vs. comparisons to *that* site (climate, soil, preservation, patterns).
  *   Have the skeptic hammer the **circularity** of inferring belief from absence without independent evidence.
  *   Have the belief-proponent argue for the **weight of patterned evidence** (absence + body treatment + context) making intentionality the *most plausible* explanation *after* considering alternatives.
  *   Acknowledge the **fundamental uncertainty** – neither can *prove* their case absolutely. That's the realism.
  *   Your character's cynicism is **understandable and reflects a real scholarly tension**, not fringe nonsense. It makes them sound like a weathered practitioner, not a crank.

  This gives you the messy, conceptual tug-of-war without textbook simplicity or pretentious theory-dropping. Good luck with the scene!
