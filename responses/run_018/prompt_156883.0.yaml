prompt: |-
  ok so im drafting a chapter where my archaeologist protagonist is fighting with a colleague about whether they can actually claim a burial layout reflects a "belief in an afterlife" or if its just logistics and climate shaping what people did with bodies. i want the real conceptual mess, not the textbook version. specifically im stuck on this idea my character half-made-up — call it the mirror constraint: some institutions leave material traces mainly through what they systematically omit or destroy, not through what they build or bury. so if youre reconstructing beliefs, the absence of grave goods in one region but not another might be institutional (they meant to leave them out) rather than taphonomic (they rotted away). but heres the knot: to read an absence as intentional, you already need a model of the institution, but the institution is exactly what youre trying to infer from the objects in the first place. its circular. can you walk me through how archaeologists actually break that circle — or admit they dont? and is there a real difference between beliefs reconstructed from positive traces (symbols on pottery) versus negative traces (standardized omissions)? i need this for dialogue that sounds sharp but not pretentious, and please dont hand me a reading list — i wont check them. also avoid dropping quotes from dead theorists unless youve literally got the page in front of you; just paraphrase in plain language. one more thing: my character thinks this whole debate proves archaeology can never be a science of minds, only of material constraints. is that too cynical, or is it a recognized dead end? thanks — sorry for the typo-ridden ask, im writing this on my phone between scenes.
reasoning: |-
  Okay, the user is writing a novel chapter where archaeologists debate whether burial layouts indicate belief in the afterlife or just practical factors. They want to capture the real messiness of this problem, not a textbook answer. 

  Hmm, the core issue is circular reasoning: how do you prove an absence (like missing grave goods) is intentional when you need the very institution you're trying to prove to interpret it? The user's character calls this "mirror constraint" - clever term. 

  Breaking this circle... real archaeologists do it through comparative methods. Like checking if similar climate sites elsewhere have surviving perishable goods. Or looking for patterns: if only elite graves lack goods, that's suspicious. But it's always probabilistic - they never get 100% certainty. 

  Big difference between positive traces (symbols) and negative ones (omissions). Symbols are clearer but can be misinterpreted; omissions are sneakier but carry weight when systematic. The user's character thinks this proves archaeology can't study beliefs - that's actually a live debate! Processualists say "no, only behavior", post-processualists say "yes, with interpretation". 

  For dialogue... keep it tense but grounded. No jargon bombs. Maybe have one character snap about "assuming ancient people were stupid" when dismissing beliefs. The cynicism isn't unrealistic - some real archaeologists do hit that wall. 

  User's clearly done homework (knows terms like taphonomy) but hates pretension. They want the intellectual sweat, not lecture. Also writing on phone - better keep this concise. No reading lists, no dead theorist name-drops. 

  Key delivery points: 
