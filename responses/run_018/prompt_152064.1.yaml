answer: |-
  Your reading of Keynes is perceptive, and the distinction you're grappling with is central to his project. Let's break down the concepts step-by-step, addressing your core questions about the nature of "weight," incomparability, and the link to uncertainty in *The General Theory*:

  1.  **"Weight" as Intrinsic, Not Second-Order:**
      *   Keynes explicitly positions "weight" (*V*) as an intrinsic property of the *logical argument* itself, specifically "the degree of completeness of the information upon which a probability is based" (Chapter VI, §5). It's a feature of the *relation* between the premises (the evidence) and the conclusion (the proposition whose probability is assessed).
      *   It is **not** primarily a measure of our psychological confidence *about* the first-order probability assignment (P). While increased weight *often* correlates with increased confidence, Keynes's key insight is that *V* and *P* are logically distinct dimensions. Confidence is a *consequence* or *symptom* of weight, not its essence.
      *   **Why Intrinsic?** For Keynes, probability is fundamentally a logical relation of partial entailment between propositions (evidence -> hypothesis). The *amount and balance* of the evidence premises directly constitute the logical ground for that entailment. Adding relevant evidence changes the logical structure of the argument itself, thereby changing its weight. This is an objective feature of the logical relation, independent of any individual's psychological state *about* that relation.

  2.  **Weight, Incomparability, and Non-Numerical Probabilities:**
      *   The intrinsic nature of weight is crucial for Keynes's argument for **genuine incomparability**. If probabilities depend on two distinct dimensions (P and V), and V measures the *completeness* of the logical basis for P, then:
          *   Arguments with vastly different weights might lack a common logical ground for comparing their P's *in magnitude*. (Is a P=0.6 based on very little evidence "better" or "worse" than a P=0.55 based on overwhelming evidence? Keynes argues we often cannot say *which* is greater; they are incomparable).
          *   Some probabilities simply cannot be expressed as unique numerical values *at all* due to insufficient or ambiguous evidence. They remain non-numerical (e.g., "more probable than not, but by an unknown degree," or "probable relative to one set of evidence, improbable relative to another incompatible set").
      *   **Your Insight is Correct:** Keynes *is* claiming that some pairs of probabilities are strictly incomparable *as magnitudes*, not merely that we are less certain about one. This incomparability stems from the *logical structure* of the arguments supporting them, primarily due to differences in weight or the fundamental nature of the evidence. He rejects the idea that all uncertainties can be forced onto a single numerical scale.

  3.  **Principled Rejection of Reduction to Measurable Expectation:**
      *   **Yes, absolutely.** The concepts of weight and non-numerical/incomparable probabilities provide Keynes with the core arguments against reducing all rational belief to measurable expectation (as in frequentist or subjective probability theories dominant in economics then and now).
      *   **The Argument:**
          *   **Measurable Expectation Requires Commensurability:** Assigning a unique numerical probability suitable for calculating expectations (like betting quotients) presupposes that all uncertainties can be compared on a single numerical scale.
          *   **Keynes's Counter:** Weight demonstrates that rational belief has an irreducible second dimension. Non-numerical probabilities and incomparability show that many uncertainties *lack the logical basis* for such numerical assignment or comparison. Rational agents often cannot form a single, precise numerical probability, even in principle, because the logical relation (based on available evidence) doesn't support it.
          *   **Consequence:** Rational belief and decision-making cannot *always* be modeled as maximizing expected utility based on numerical probabilities. The "weight" dimension necessitates a different kind of rationality for situations of low weight or fundamental incomparability.

  4.  **Link to "Uncertainty" in *The General Theory*:**
      *   The famous Chapter 12 distinction between measurable "risk" and unmeasurable "uncertainty" is directly rooted in the *Treatise* framework:
          *   **Risk:** Corresponds to situations where probabilities *are* numerical (or at least comparable), based on sufficient, stable, and homogeneous evidence (high weight). This allows calculation and insurability (e.g., actuarial tables for life insurance).
          *   **Uncertainty:** Corresponds precisely to situations characterized by **low weight** and/or **non-numerical/incomparable probabilities** in the *Treatise* sense. It's where "there is no scientific basis on which to form any calculable probability whatever" (GT, Ch. 12). This isn't just *epistemic humility* ("we don't know the number yet") but an *ontological claim about the logical possibility of calculation* based on the available evidence ("no scientific basis" exists to form one *at all*).
      *   **Examples in GT:** Long-term expectations about investment returns, future interest rates decades hence, the outcome of technological innovation decades out, or major political upheavals. Keynes argues these inherently lack sufficient, stable, or homogeneous evidence to form a logical basis for numerical probability (low/non-existent weight), placing them firmly in the realm of "uncertainty".

  5.  **Epistemic Humility vs. Ontological Non-Measurability:**
      *   This is the crux of your insightful concern. Keynes **does strive to keep them separate**, grounding the non-measurability in the *logical* structure of the argument (ontology of the evidence-relation).
      *   **How He Separates Them:**
          *   **Focus on the Logical Relation:** Probability and weight are properties of the argument (evidence -> hypothesis), not primarily of the knower's mind. Non-measurability arises when the logical relation *itself* doesn't support a numerical value or comparison.
          *   **The Role of Evidence:** Low weight means the *evidence base itself* is incomplete or ambiguous relative to the hypothesis. This is an objective feature of the state of knowledge available. It's not *just* that *we* are humble; it's that *the world* (or our access to relevant facts about it) hasn't provided enough relevant, balanced evidence to ground a numerical probability *logically*.
          *   **Uncertainty as Ontological (for Decision-Making):** In the context of economic decision-making (GT), Keynes treats situations of fundamental uncertainty (very low/non-existent weight) as having an *ontological character*: the future states relevant to long-term decisions *are* not amenable to probabilistic calculation *by their nature* given the kind of evidence available about the future. Our epistemic humility *follows from* this logical/ontological state.
      *   **Does the Passage Support This?** Yes. The observation that adding evidence *lowers* probability demonstrates that weight is independent of the probability value itself and tied to the logical structure of the evidence. The incomparability argument further shows that the problem isn't merely our lack of confidence, but a fundamental lack of logical ground for comparison. This directly supports the ontological claim about non-measurability in *some* contexts (uncertainty), distinct from contexts where measurement is logically possible but we lack specific data (where epistemic humility applies, but risk is still the framework).

  **In Conclusion:**

  Your reading is accurate. Keynes's "weight" is an intrinsic property of the logical argument, reflecting the completeness of its evidential basis. This leads directly to the possibility of non-numerical probabilities and genuine incomparability. This framework provides his *principled* reason for rejecting the reduction of all rational belief to measurable expectation: some uncertainties lack the logical basis for numerical probability assignment *in principle*. This is the foundation for his later GT distinction: "Risk" applies where probabilities *can* be calculated (high weight), "Uncertainty" applies where they *cannot* (low/non-existent weight, non-numerical/incomparable probabilities). Keynes carefully grounds this non-measurability in the logical (and thus ontological for decision-making) relation between evidence and hypothesis, distinguishing it from mere epistemic humility. The passage you describe strongly supports this intrinsic, logical interpretation of weight and its consequences.
