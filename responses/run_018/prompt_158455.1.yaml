prompt: |-
  I am a third-year undergraduate in a philosophy of art seminar, and our recent discussion of autonomism versus moralism in aesthetic value left me wondering whether any of that theoretical separation survives contact with an actual institutional decision. To explore this, I have been asked to advise my university's public-art acquisition committee—which meets monthly, has no staff art historian, must sign off within about twenty minutes per proposal, and issues a one-page public justification for every acquisition—on formalizing a reusable decision procedure for proposals involving artists with documented serious moral failings. The works are destined for high-traffic campus spaces, and the university's 2019 mission revision requires that all public displays remain "compatible with ethical exemplarity," though that phrase is undefined. I want the principle translated into an ordered checklist or flowchart-in-words that a non-philosopher can actually run: the questions to ask in sequence, what counts as a sufficient answer at each stage, where the process stops with a clear refusal, and where it must hand the decision back to human judgment because the issue is irreducibly about values rather than facts. The procedure should also state explicitly what it cannot resolve—such as whether institutional endorsement is unavoidable or can be neutralized by framing—and identify the hard cases where it will misfire. Please apply it to three proposals: (1) an abstract painter recently convicted of financial fraud that exploited elderly collectors, with the work proposed for the main library atrium; (2) a sculptor with a documented history of domestic violence whose intimate figurative work is proposed for a quiet garden memorial; and (3) a bequest that requires displaying three apolitical landscape paintings together in a named wing, where the artist was a mid-twentieth-century collaborator with an authoritarian regime. In at least one case, the procedure should yield an answer I find unwelcome, and you should explain why. Throughout, please state how confident you are in each major claim and single out the point about which you are least sure. Please keep the entire response within 500 words, present the procedure as a numbered flow, and present the case applications in brief paragraphs.
reasoning: |-
  Okay, let me unpack this philosophy student's complex request. They're asking for a practical decision framework to handle ethically problematic art acquisitions, grounded in their seminar's theoretical debate about art's autonomy versus moralism. The challenge is translating "ethical exemplarity" into an actionable checklist for time-pressed university committees.

  Hmm, the user clearly wants this to be philosophically robust yet usable by non-experts. The three test cases are smartly chosen to probe different ethical-artistic tensions: financial crime vs abstract art, domestic violence vs intimate sculpture, political collaboration vs apolitical landscapes. And they specifically want the system to sometimes produce uncomfortable conclusions - that's a good sign they're serious about rigor.

  I notice several constraints: the 500-word limit, the need for numbered flow, and the requirement to flag uncertainties. The committee's practical realities matter too - 20 minutes per decision, no art historian, public justifications. That means the procedure must be both efficient and defensible.

  For the framework itself, I'm considering a tiered approach that isolates key questions: first establish moral failing severity, then examine work-content connection, then assess institutional endorsement risks. But I'm least confident about where to draw the "no endorsement" line - that's inherently value-laden. The "cannot resolve" disclaimer about framing effectiveness feels crucial too.

  Applying this to the cases: the abstract painter seems clearest - minimal connection to crime means rejection might overreach. The domestic violence case is tougher; the thematic link makes refusal plausible. The collaborator's landscapes are the real challenge - mission pressure might force rejection despite their apolitical nature, which demonstrates the requested unwelcome outcome. 

  Throughout, I'll need to flag confidence levels: high on factual assessments, low on endorsement interpretations. The sculpture case will show the system working; the landscape case where it strains. That should satisfy their request for both utility and philosophical honesty.
answer: |-
  Here’s a formalized decision procedure for ethically problematic art acquisitions, followed by case applications:

  **Decision Procedure: "Ethical Exemplarity" Checklist**  
  *(Execute steps sequentially; stop if refusal criteria met)*  

  1.  **Severity & Documentation:** Is the moral failing *legally adjudicated or rigorously documented* (e.g., conviction, credible investigation)?  
      *   **No:** Proceed to Step 2.  
      *   **Yes (Serious Crime/Harm):** Proceed to Step 3. *(Confidence: High - factual threshold)*  
      *   **Cannot Resolve:** Ambiguity in documentation. Hand to committee.  

  2.  **Work-Failing Link:** Is the failing *thematically reflected in the work's content or creation process*?  
      *   **No:** Proceed to Step 4. *(Confidence: Medium - interpretation required)*  
      *   **Yes:** Proceed to Step 5.  

  3.  **Inescapable Endorsement:** Would display *reasonably imply institutional endorsement of the person's character*, given the failing's severity?  
      *   **No:** Proceed to Step 2. *(Confidence: Low - highly contextual/value-laden)*  
      *   **Yes:** **Refuse Acquisition.** *(Confidence: Medium - mission pressure)*  
      *   **Cannot Resolve:** Debate over endorsement unavoidability vs. neutralization by framing. Hand to committee.  

  4.  **Location Sensitivity:** Is the proposed location *specifically commemorative, deeply contemplative, or directly tied to the failing's victims*?  
      *   **No:** **Approve Acquisition** (barring other issues). *(Confidence: Medium)*  
      *   **Yes:** Proceed to Step 5.  

  5.  **Mission Conflict:** Does display *contradict "ethical exemplarity"* by honoring the artist or causing *foreseeable, significant harm/distress* to the campus community?  
      *   **No:** **Approve Acquisition** with strong contextual framing. *(Confidence: Low - harm prediction uncertain)*  
      *   **Yes:** **Refuse Acquisition.** *(Confidence: Medium - mission imperative)*  
      *   **Cannot Resolve:** Balancing artistic merit vs. harm. Hand to committee.  

  **Hard Cases:** Failing with weak work-link in sensitive spaces (Step 4 -> 5), or profound artistic merit vs. severe failing. **Misfires:** When "endorsement" perception or "harm" is contested but intense.

  ---

  **Case Applications:**  

  1.  **Abstract Painter (Financial Fraud):**  
      *   Step 1: **Yes** (conviction). Step 3: *Unlikely* endorsement (fraud unrelated to art). Proceed. Step 2: **No** link (abstract work). Step 4: **No** (library atrium not sensitive). **APPROVE.** (Confidence: High. Least sure: Step 3 endorsement assessment). *Unwelcome? Possibly, if committee feels fraud inherently violates exemplarity, but procedure prioritizes work-content link.*  

  2.  **Sculptor (Domestic Violence):**  
      *   Step 1: **Yes** (documented). Step 3: *Potential* endorsement concern, but proceed. Step 2: **Yes** (intimate figurative work links thematically to failing). Step 5: Location is memorial garden (**sensitive**). Display risks honoring artist & causing harm/distress. **REFUSE.** (Confidence: Medium).  

  3.  **Landscape Painter (Collaborator):**  
      *   Step 1: **Yes** (historical documentation). Step 3: **Yes** (Displaying in a *named wing* strongly implies institutional honorific for a collaborator, regardless of work content). **REFUSE.** (Confidence: Medium on refusal, Low on Step 3 being definitive).  
      *   *Unwelcome Outcome Explained:* The apolitical nature of the work is irrelevant here. The procedure prioritizes the *institutional act of naming/honoring* the individual ("named wing") as fundamentally incompatible with "ethical exemplarity" given the severity of collaboration. The mission pressure overrides artistic merit or lack of thematic link. This is the point of greatest uncertainty – whether naming *always* equals endorsement.
