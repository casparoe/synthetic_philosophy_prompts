prompt: |-
  My friend Dana is my go-to person for secession arguments. Shes not a lawyer but shes read basically everything on Scotland, Catalonia, and Quebec, and she has strong verdicts she can defend. As best I can reconstruct them:

  - Scotland 2014: if Yes had won it would have been a legitimate independence and the UK should have let it happen. The vote was clean, turnout was enormous, and the UK had agreed in advance to respect the result.
  - Catalonia 2017: the unilateral declaration was illegitimate and shouldn't have been recognized. But her reason was mostly that the referendum itself was a bust — it was illegal, the unionists boycotted, police were breaking it up, turnout was in the low 40s, so no clear expression ever emerged.
  - Quebec 1995: a bare 50-plus-1 in favor would not have been enough, but a genuinely clear majority would have created a real obligation on Canada to negotiate instead of pretending nothing had happened. She basically accepts the Clarity Act idea of a clear majority on an unambiguous question.

  Now here's the case she hasn't ruled on. Imagine a prosperous stable democracy where one region has a distinct language and identity, no recent history of oppression, but the national constitution flatly says the territory is indivisable. A regional movement runs its own referendum with international observers: turnout above 70%, and 58% vote for independence. The central government says the constitution settles the matter, refuses to authorize an official referendum, and refuses to negotiate.

  If Dana wants to be consistent with her earlier verdicts, what should she say about this new case, and which of her three earlier cases is the closest analog? Walk me through (1) the rule or rules that fit all three of her verdicts, (2) which principle each candidate rule commits her to and what each predicts about the new case, (3) your best guess at her verdict and why you weight one rule over the others, and (4) one further case, real or invented, that would cleanly settle which rule shes actually running.
reasoning: |-
  Okay, let me tackle this fascinating thought experiment about Dana's secession principles. The user presents a hypothetical scenario that tests the consistency of Dana's established positions on Scotland, Catalonia, and Quebec independence movements. 

  First, I need to reverse-engineer Dana's underlying rules from her three verdicts. For Scotland 2014, she emphasized three key elements: the vote was clean (procedural legitimacy), had enormous turnout (popular mandate), and had prior agreement from the central government (constitutional pathway). This seems like the gold standard in her view.

  The Catalonia 2017 case shows her rejecting unilateral action when the referendum lacked legality, had boycott issues, and low turnout - so procedural defects and unclear popular will sank it despite the cultural distinctness. Interesting that she didn't prioritize constitutional barriers here, focusing instead on process and mandate clarity.

  Then Quebec 1995 introduces nuance - she accepts the Clarity Act principle that even a technically legal referendum needs more than 50%+1 for legitimacy. The "clear majority" threshold matters, and she implies Canada would have had to negotiate with say 55-60% support. So mandate strength compensates for constitutional rigidity in her framework?

  Now the new hypothetical: prosperous democracy, distinct region, constitutional ban, unofficial but well-run referendum with 70% turnout and 58% yes vote. Central government refuses everything. 

  The core tension is between Dana's apparent hierarchy of principles: (1) Process Legitimacy (clean vote + observers) vs (2) Constitutional Authority (central gov approval) vs (3) Mandate Clarity (high turnout + supermajority-ish margin). 

  Scotland prioritizes #1+#2; Catalonia fails #1; Quebec emphasizes #3. Here #1 is satisfied (unlike Catalonia), #2 is violated (unlike Scotland), but #3 is stronger than Quebec's hypothetical bare majority. 

  My prediction: Dana would side with independence here because the exceptional mandate strength (70% turnout! 58% clear majority!) creates moral legitimacy that overcomes the constitutional defect. She'd likely see Quebec as the closest analog since both involve supermajority logic overriding technical legality. 

  To test this, imagine a counterfactual: same scenario but with 51% yes on 55% turnout. If Dana rejects that, it confirms mandate strength is her tiebreaker. But if she accepts even that, then process purity alone trumps constitutionalism in her framework - which would surprise me given her UK/Canada positions.
answer: |-
  Based on Dana's established positions, here's a breakdown of the new case, the underlying rules, and the closest analog:

  **1. Dana's Implicit Rules (Extracted from Verdicts):**
      *   **Rule 1: Procedural Legitimacy:** The referendum process must be clean, fair, conducted without significant coercion or illegality, and ideally with central government agreement/legal recognition (Scotland good, Catalonia bad).
      *   **Rule 2: Clear Mandate:** The result must unambiguously reflect the will of the relevant population. This requires high turnout and a clear majority exceeding a bare 50%+1 (Quebec's Clarity Act principle). Boycotts or low turnout undermine this (Catalonia bad).
      *   **Rule 3: Moral/Political Obligation:** A procedurally legitimate vote with a clear mandate creates a strong moral and political obligation on the central state to negotiate in good faith, even if the constitution forbids secession (Scotland & Quebec imply this; UK/Canada's *agreement* to respect a clear Yes solidified it). The constitution alone isn't an absolute bar if Rules 1 & 2 are met.

  **2. Applying Rules to the New Case & Candidate Principles:**

  | **Candidate Rule**              | **Principle**                                              | **Prediction for New Case**                                   | **Weighting in this Case**                                |
  | :------------------------------ | :--------------------------------------------------------- | :------------------------------------------------------------ | :-------------------------------------------------------- |
  | **Rule 1: Procedural Legitimacy** | A clean, fair vote creates legitimacy, regardless of constitution. | **Supports Independence:** Vote was clean, high turnout, observed. Unofficial status is a flaw, but mitigated by quality. | Strong: Process met her key standard (unlike Catalonia). |
  | **Rule 2: Clear Mandate**       | A clear majority (beyond 50%+1) is essential.              | **Supports Independence:** 58% is a significant majority, turnout 70% is very high = unambiguous will. | Very Strong: Exceeds her implied Quebec threshold.       |
  | **Rule 3: Moral Obligation**    | Constitution isn't absolute; clear will creates duty to negotiate. | **Supports Negotiation:** Clear mandate obligates the state, constitution notwithstanding. | Moderate: Her core principle linking legitimacy to obligation. |
  | **Constitutional Bar (Counter-Rule)** | The constitution's indivisibility clause is supreme law.   | **Rejects Independence:** Constitution forbids it; vote was illegal/unrecognized. | Weak: Her verdicts downplay this (ignored in Scotland/Quebec acceptability, secondary in Catalonia). |

  **3. Dana's Likely Verdict & Reasoning (Best Guess):**

  Dana would likely argue that **the region has a strong case for independence and the central government has a moral obligation to negotiate.**

  *   **Why:** The new case scores highly on her core principles.
      *   **Procedural Quality (Rule 1):** While unofficial, the clean process with international observers meets her standard for assessing the *genuine* will of the people (unlike Catalonia). The central government's refusal to authorize isn't seen as fatal if the vote itself was fair.
      *   **Clear Mandate (Rule 2):** 58% on 70% turnout is a decisive result exceeding her implied "clear majority" threshold from Quebec (far beyond 50%+1). This is the strongest aspect, showing unambiguous popular will.
      *   **Moral Obligation (Rule 3):** This clear expression of will, achieved legitimately, creates a powerful political and moral obligation on the central state to engage, overriding the constitutional prohibition in practice. Ignoring it would be akin to Canada ignoring a clear Quebec Yes. The constitution's bar is a legal obstacle but not a moral/political one given the mandate.
  *   **Weighting:** Rule 2 (Clear Mandate) is likely the heaviest. The decisive 58% margin compensates for the lack of central authorization (Rule 1 flaw) and directly triggers the Moral Obligation (Rule 3). The Constitutional Bar is discounted based on her previous verdicts where legitimacy derived from process and mandate, not just legality.

  **Closest Analog: Quebec 1995.** While Scotland had central agreement, the *core logic* aligns most with Quebec. Both hinge on the **supermajority principle**:
      *   Quebec: A bare majority (50%+1) isn't enough, but a *clear* majority *would* obligate negotiation despite constitutional unity principles.
      *   New Case: A substantial 58% majority *does* create that obligation, even without prior agreement and against the constitution. The decisive mandate overcomes the lack of central approval, just as it would have overcome the constitutional unity argument in Canada per Dana's view.

  **4. Diagnostic Case to Settle the Rule:**

  **The Case:** Same prosperous democracy, distinct region, constitutional bar. The regional movement holds an **officially authorized referendum** (central government agrees). Turnout is high (75%). The result is **50.5% Yes, 49.5% No**.

  *   **What it Tests:** This cleanly isolates **Rule 2 (Clear Mandate)** vs. **Rule 1 (Procedural Legitimacy + Central Agreement)** and **Rule 3 (triggered by mandate)** vs. the **Constitutional Bar**.
  *   **What Dana Should Say if Consistent:**
      *   If she prioritizes **Rule 2 (Clear Mandate):** She should say **this is NOT sufficient for independence or creating a strong obligation to negotiate.** 50.5% is exactly the bare majority she rejected in Quebec as insufficient. The clean process and central agreement don't overcome the lack of a decisive mandate. The central government could legitimately argue the result is too ambiguous to break up the state.
      *   If she prioritizes **Rule 1 (Procedural Legitimacy + Central Agreement):** She should say **this WOULD create an obligation to negotiate/secede.** The vote was clean, authorized, and high turnout – meeting the Scotland standard. The constitution's bar was waived by the authorization.
  *   **Conclusion:** Dana's Quebec verdict strongly suggests she prioritizes **Rule 2 (Clear Mandate).** Therefore, she *should* reject the legitimacy of secession based on this 50.5% official result. If she instead accepted it, she would be contradicting her Quebec position and showing Rule 1 (Process/Legality) is actually supreme. This case forces her to choose between the purity of process (Scotland) and the clarity of the mandate (Quebec).
