answer: |-
  Your conceptual distinction cuts to the core of how welfare governance morally constitutes subjects through administrative practice. Let's dissect the sliding scale between behavioral conditionality and ontological exclusion in fraud detection:

  ### The Conceptual Slide & Role of Fraud
  1. **Workfare's Dual Foundation**:  
     Workfare regimes inherently fuse:
     - **Instrumental logic**: Market-inspired contractualism (behavioral conditionality)
     - **Moral logic**: Persistent cultural narratives of the "undeserving poor" (ontological exclusion)  
     Fraud detection sits precisely at this intersection, making it the ideal site for conceptual slippage.

  2. **Administrative Ambiguity as Governance Tool**:  
     When a minor discrepancy (e.g., unreported casual earnings) is treated as fraud:
     - **Behavioral framing**: It's a *procedural failure* within reciprocal exchange ("you broke a rule").
     - **Ontological framing**: It's *moral evidence* of inherent dishonesty ("you *are* a fraudster").  
     The distinction between **administrative error** (correctable mistake) and **moral fault** (inherent character flaw) collapses by design. Fraud investigations transform technical violations into moral signifiers.

  3. **Conceptual Work of "Fraud"**:  
     The category performs three critical functions:
     - **Legitimacy**: Sanctions appear objective ("fraud is fraud") while masking the moral judgment underlying severity.
     - **Moral Alchemy**: Converts mundane bureaucratic interactions (e.g., form errors) into rituals of moral categorization.
     - **Plausible Deniability**: Allows regimes to rhetorically maintain contractualism while operationally deploying categorical exclusion. A single unreported $20 payment can trigger sanctions implying permanent untrustworthiness.

  ### Normative Costs (Beyond Semantics)
  - **Citizenship Erosion**: Contractual logic presumes a rights-bearing subject; ontological exclusion denies this premise. The slide enables *rights revocation without due process*, redefining citizenship as conditional on moral worthiness.
  - **Desert Reconfiguration**: Desert becomes detached from specific actions and tied to *perceived moral essence*. A minor infraction "reveals" inherent underservingness, justifying disproportionate penalties.
  - **Epistemic Violence**: The claimant's explanation (e.g., misunderstanding rules) is structurally dismissed as further evidence of deceit, reinforcing the state's monopoly on moral categorization.
  - **Democratic Costs**: Conflating administrative non-compliance with moral failure obscures policy design flaws (e.g., complex reporting requirements) and transfers blame to individuals.

  ### Reshaping the "Undeserving Poor" Category
  The ambiguity:
  - **Performs the Category**: Fraud determinations don't just *identify* but actively *produce* "undeserving" subjects through administrative ritual.
  - **Makes Boundaries Porous**: Anyone can be "revealed" as ontologically undeserving through minor errors, expanding the category's reach.
  - **Naturalizes Exclusion**: By framing moral status as "revealed" rather than assigned, it masks the state's constitutive power in creating undeservingness.

  ---

  ### Structured Summary

  ```json
  {
    "behavioral_conditionality_logic": "Sanctions as instrumental correction for procedural non-compliance within a reciprocal contract; presumes redeemable rights-bearing subjects.",
    "ontological_exclusion_logic": "Sanctions as categorical unmasking of inherent moral unworthiness; treats claimants as fundamentally improper welfare subjects beyond redemption.",
    "site_of_ambiguity_in_fraud_detection": "The determination moment where minor administrative discrepancies (e.g., unreported income) are interpreted either as correctable errors or as evidence of intrinsic dishonesty.",
    "conceptual_cost_of_the_sliding_scale": "Erodes social citizenship by masking moral exclusion as contractual enforcement; decouples desert from specific actions; enables disproportionate punishment under guise of objectivity.",
    "implication_for_the_undeserving_poor_category": "Administratively reproduces and expands the category by transforming procedural lapses into moral evidence, naturalizing exclusion as 'revealed' rather than state-constructed."
  }
  ```

  This conceptual machinery allows workfare regimes to leverage the political utility of moral stigma ("welfare cheats") while maintaining neoliberal claims to procedural neutrality. The fraud investigation becomes a secular sacrament where the state performs the alchemy of transmuting paperwork into moral ontology.
