prompt: |-
  You are a senior examiner in philosophy of cognitive science and philosophy of mind, with deep expertise in inductive reasoning, concept acquisition, and the comparison between human and artificial pattern recognition. Before you compose anything, please take a deep breath, think step by step, and do a brief brainstorm: identify the precise conceptual crux that separates someone who genuinely understands the problem of induction from a few examples from someone who can merely describe Bongard's classic figure sets and say they are difficult for computers.

  Please design an original, upper-level essay exam for a third-year philosophy of mind course. The exam should focus on Bongard-style problems—visual concept-induction tasks in which a solver must identify the feature that distinguishes six figures on one side from six on the other based on minimal exposure—together with the philosophical question of whether successful human performance requires explicit rule formulation, implicit statistical learning, or a distinct form of gestalt recognition.

  The question must not be answerable by reciting a summary of what Bongard problems are or by repeating that early AI systems failed to solve them. To place the prompt firmly in the weeds, construct the following synthetic framing: present students with a verbally described "anti-projectibility" variant (do not ask them to solve actual figures; describe the logical structure in prose) in which every locally salient feature—shape, color, number, orientation—supports a consistent first-order rule within each half of the set, yet the globally correct distinction depends on a second-order pattern about the variance of feature distributions across the two sets. Ask students to analyze whether recognizing this second-order pattern counts as inducing a new concept, or whether it collapses into applying a meta-rule about induction itself; and ask them to evaluate whether this distinction undermines the claim that human solvers learn genuinely novel categories rather than revising pre-existing theoretical commitments.

  Specify the exam conditions clearly: essay format, 40 minutes, 25 marks out of 100, expected length approximately 600 to 800 words. Do not ask students for bibliographies, reading lists, or specific citations.

  Then provide three deliverables in this order:

  1. The exam question itself, written in formal, polished examination language.
  2. A model answer of about 600 words. The answer should make specific philosophical moves: it should distinguish first-order feature induction from second-order variance detection; it should engage with the Goodman-style worry about grue-like projections onto visual properties; it should address whether the second-order recognition requires explicit propositional knowledge or can remain tacit; and it should take a clear, argued position on whether the anti-projectibility case preserves or dissolves the boundary between concept learning and theory revision.
  3. A marking scheme that separates an A-grade answer (first-class, roughly 85% and above) from a B-grade answer (upper-second, roughly 70-79%) by naming the exact moves each must contain. For example, an A answer should explicitly identify the scope ambiguity between "inducing a rule" and "applying a meta-rule"; a B answer may correctly describe the problem but fail to articulate why the second-order pattern is philosophically distinct from first-order feature learning. List at least three common mistakes that should cost marks—such as conflating the anti-projectibility variant with a standard Bongard problem, or treating the issue as purely empirical rather than conceptual—and specify how many marks each error should deduct.

  Constraints for your response:
  - Write formally and precisely.
  - Do not include quotation marks around any passage from a real text unless you have fetched and verified the source; if you wish to reference well-known positions, paraphrase without quotation marks.
  - Do not depend on obscure empirical studies or highly specific bibliographic details; refer to Bongard's framework descriptively rather than citing a specific publication year or page number unless you have verified it.
  - Ensure the question is meaningful for a well-prepared student who cannot search the web during the exam.

  Begin with a brief paragraph of brainstorming, then present the exam question, then the model answer, then the marking scheme.
