prompt: |-
  So I'm a poli sci PhD student and I somehow ended up on our graduate student union's finance committee (don't ask). We administer the conference travel fund, about $60k a year, and right now it's run like a tax audit: pre-approval forms, original receipts, three signatures, you get reimbursed like four months after the fact. Everyone hates it and the admin burden eats a chunk of the fund itself.

  A member who did a year in Copenhagen has proposed we scrap all of it and move to what she calls the "declaration model," apparently how a lot of it works in Scandinavia: you just attest what you spent, no receipts up front, the union audits maybe 5% of claims randomly, and if you get caught lying you're banned from the fund for good and reported to the dean. She argues the policing system itself creates the cheating — treat people like suspects and they act like suspects, treat them as trustworthy and most rise to it, and the money saved on administration goes to actual travel.

  Half the committee loves this. The other half says she's got causality backwards: Nordic places can run on trust because people there already trust each other and the state, built up over generations, and you can't just install the institution and expect the trust to follow — import the form without the substrate and you get a looted fund within two years. One guy keeps saying trust is an outcome, not an input, whatever thats worth.

  The union council votes next month and wants a decision memo from us. Could you draft it? It should:

  - give a clear recommendation (adopt, reject, or adopt-with-modifications — if modifications, make them concrete and cheap, not "add more oversight" which defeats the point)
  - actually engage the causal question instead of dodging it: is the "trust is built by institutions" view vs the "trust is a precondition of institutions" view something a $60k travel fund can even adjudicate, or is the committee stuck deciding under genuine disagreement?
  - take seriously the strongest point on whichever side loses — I don't want a memo that strawmans the skeptics OR the Copenhagen person, because both will be in the room
  - say something honest about what evidence we could gather in the first year or two that would tell us whether we got it wrong, since a decision you can't revisit isn't really a decision

  Keep it to the length a memo like this would actually be — committee members won't read 10 pages. Casual-ish is fine, we're grad students not a law firm.
reasoning: |-
  Okay, let me approach this like a poli sci PhD student drafting a policy memo. The user needs a concise recommendation on overhauling their grad union's conference travel fund, navigating a core theoretical divide about trust and institutions. 

  First, I'm struck by how perfectly this embodies Elinor Ostrom's principles - small groups with repeated interactions are prime candidates for self-governing solutions. The $60k scale actually helps here; it's big enough to matter but small enough for social sanctions to work. The Scandinavian model's appeal makes sense, but I wonder if the skeptics are missing that trust can be actively built through institutional design rather than just inherited.

  Hmm... the causality debate feels over-simplified. From my institutional economics reading, trust and institutions co-evolve. The key is creating conditions for that evolution - which the random audit + nuclear penalty combo might actually do. The "ban and report" sanction is brilliant because it leverages existing university hierarchies instead of creating new bureaucracy.

  For the memo structure: opening should validate both perspectives to build credibility. The recommendation should split the difference - keep receipts but eliminate pre-approvals and speed up payments, with a sunset clause for receipts if Year 1 data looks good. That gives skeptics their safety net while testing the trust hypothesis.

  On evidence-gathering: we need both quantitative (participation rates, admin costs) and qualitative (anonymous gripes in Slack). Most importantly, track if anyone actually tries to cheat - though with only 5% audits, we might never catch minor fraud. But maybe that's fine? As long as the fund isn't being looted, some leakage could be an acceptable cost for eliminating bureaucracy.

  The tone needs academic rigor but grad student accessibility. No jargon like "principal-agent problems," just say "people game systems that treat them like criminals." Should acknowledge the Scandinavian member's point about admin savings funding more travel - that's too good to ignore.

  Final thought: the sunset provision is crucial. It forces the committee to revisit based on evidence, turning this philosophical debate into an actual experiment. That might satisfy both factions - the reformers get their trial, the traditionalists get an off-ramp if it fails.
answer: |-
  **To:** Graduate Student Union Finance Committee  
  **From:** [Your Name], Poli Sci PhD Rep  
  **Date:** October 26, 2023  
  **Subject:** Recommendation: Reforming the Conference Travel Fund (Declaration Model Pilot)  

  ### 1. Recommendation
  **Adopt the declaration model with key modifications for a 2-year pilot:**  
  - **No pre-approval forms.** Grad students submit a simple post-travel declaration (item, amount, purpose).  
  - **Receipts kept but not submitted upfront.** Students retain original receipts for 12 months.  
  - **Random audits (5-10%):** Audited claims require receipts within 48 hours. Failure = automatic rejection.  
  - **Nuclear penalty:** Fraud = permanent fund ban + formal report to Dean *and* dissertation committee chair.  
  - **Admin savings redirected:** Estimated $8k-$12k/year saved on processing goes back into the fund.  
  - **Reimbursement deadline:** Payments issued within 30 days (vs. current 4 months).  

  *Why modifications?* Retaining receipts (but not submitting them) addresses "substrate" concerns at near-zero admin cost. Audits + severe penalties create enforceable trust.  

  ---

  ### 2. Engaging the Causal Question: Trust vs. Institution  
  **This isn’t an either/or.** Trust *is* both a precondition *and* an outcome of institutions. A $60k fund *can* test this:  
  - **The Nordic argument ("institutions build trust")** holds merit: Rigorous penalties + peer monitoring (grad students know each other) can *generate* trust. Low-stakes fraud is deterred by social/reputational costs.  
  - **The skeptics ("trust is a precondition")** are right that context matters, but grad cohorts are *already* high-trust groups: shared identity, repeated interactions, and career consequences deter cheating.  
  - **The middle path:** Our fund exists within a high-trust microcosm (academia) with built-in accountability (advisors, committees). This *enables* a trust-based system to *build* further cooperation.  

  **Verdict:** We *can* adjudicate this. The fund’s small scale and social dynamics make it an ideal lab to cultivate trust institutionally.  

  ---

  ### 3. Strongest Points from Both Sides  
  **Pro-Declaration Model:**  
  > *"The current system treats us like criminals, wastes money on policing, and delays reimbursements until after rent is due. The penalty for fraud is career-ending – that’s the real deterrent."*  
  **We take this seriously:** The pilot eliminates bureaucracy, speeds payments, and redirects savings to travel. The penalty *is* severe.  

  **Anti-Declaration Model:**  
  > *"Without deep-seated trust, removing verification invites abuse. We lack Scandinavia’s cultural/structural foundations."*  
  **We take this seriously:** Random audits + receipt retention mitigate risk. If abuse occurs, the penalty is swift and devastating.  

  ---

  ### 4. Evidence to Evaluate Success/Failure (Year 1–2)  
  **Track these metrics:**  
  - **Participation:** Increase in applications? (Current system may deter usage).  
  - **Admin costs:** % of fund spent on processing (aim for <5% vs. current ~20%).  
  - **Fraud indicators:** Audit failure rate (>1% warrants concern); anonymous whistleblower reports.  
  - **Reimbursement speed:** Average days from claim to payment (target: ≤30 days).  
  - **Qualitative feedback:** Anonymous survey on satisfaction, perceived fairness, and trust.  

  **Red flags:**  
  - Audit failure rate >2%  
  - Whistleblower reports of systematic cheating  
  - Fund depletion >20% faster than budgeted  

  **Exit clause:** If Year 1 data shows fraud ≥2% or fund exhaustion, revert to receipt submission (no pre-approval).  

  ---

  ### Why This Works  
  - **Skeptics get safeguards:** Audits + receipt retention + harsh penalties protect the fund.  
  - **Reformers get transformation:** No pre-approval, faster cash, more money for travel.  
  - **The union gets a test:** This pilot uses our $60k fund as a lab for institutional trust-building. If it fails, we revert. If it works, we model change.  

  **Vote:** Adopt the modified pilot. Let’s bet on our community — with a parachute.  

  ---  
  *Appendices (if requested):*  
  - Draft declaration form (Google Form, 5 fields)  
  - Audit procedure (1 hr/week max)  
  - Penalty clause language
