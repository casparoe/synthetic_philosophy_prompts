answer: |-
  ## Dissertation Fellowship Proposal: The Weight of Enduring Structures - Institutional Persistence and Cross-Generational Collective Guilt  

  **Core Question:** Does the persistence of institutions (legal systems, bureaucracies, cultural norms) across generations provide a *genuine, non-metaphorical basis* for attributing collective guilt to a nation for historical wrongs, or does it inevitably dissolve into distributed individual responsibility among contemporary members?  

  **The Gap in Jaspers & The Institutional Challenge:**  
  Karl Jaspers’ taxonomy of guilt (criminal, political, moral, metaphysical) provides crucial distinctions but fails to resolve the core tension exposed when generations pass. **Political guilt** attaches to citizens by virtue of membership in a state apparatus responsible for wrongdoing. **Moral guilt**, however, demands personal agency and complicity. When the original perpetrators and direct beneficiaries die, political guilt *seems* to persist with the state, while moral guilt appears to vanish. Jaspers leaves unresolved whether the *enduring structures* of the state itself – the institutional "shell" – can genuinely bear guilt obligations in the absence of the original moral agents. Does this persistence create a new kind of moral burden, or merely distribute diluted political responsibility onto new, morally innocent individuals? This is the conceptual crux my dissertation tackles.  

  **Committed Position & Framing:**  
  **This proposal argues that institutional persistence *can* ground genuine, non-punitive collective guilt obligations across generations, precisely *because* institutions are more than mere aggregates of individuals.** The focus shifts from blaming individuals to recognizing enduring structures as active carriers of normative commitments and unfinished moral reckonings. The language of "national guilt" retains meaning *only* if anchored in the persistent, obligation-bearing nature of institutions themselves. Without this, we must abandon the concept as incoherent or purely metaphorical.  

  **Methodology (Conceptual Analysis):**  
  1.  **Institutional Identity & Persistence:** Analyze the identity conditions of institutions over time. What constitutes the "same" institution despite complete membership turnover? (Key: Continuity of constitutive rules, core functions, normative commitments, and external recognition, not personnel).  
  2.  **Obligation-Transfer Mechanisms:** Examine whether obligations (especially reparative or acknowledgements ones arising from past wrongs) can survive discontinuous membership. Argue that institutions, as distinct moral agents with intentionality expressed through rules and actions, can "hold" obligations *structurally*. Obligations bind the *office* or *role* defined by the institution, not (only) the transient individual inhabiting it.  
  3.  **Structural Inheritance vs. Structural Discharge:** Develop a framework to assess when persistent institutions genuinely *inherit* guilt-related obligations ("Structural Inheritance") and when institutional transformation or reparative actions effectively *discharge* those obligations ("Structural Discharge"). Inheritance occurs when core unjust norms/functions persist unaddressed; discharge requires demonstrable, institutionalized rupture with the wrong (e.g., constitutional repudiation, sustained reparative justice mechanisms).  

  **Deliverable:**  
  A robust conceptual framework distinguishing **Structural Inheritance** from **Structural Discharge**, providing clear criteria for when persistent institutions bear genuine cross-generational guilt obligations and when those obligations are mitigated or extinguished. This framework moves beyond individual blame while avoiding hollow metaphor, offering a concrete basis for claims about national responsibility for historical injustice.  

  **Addressing the "Just Rhetoric" Objection:**  
  The charge that collective guilt is "just rhetoric" stems from conflating *guilt* with *blame* or *punishment*. This project defines collective guilt *operationally* as the **persistence of unmet normative obligations** (e.g., obligations of repair, non-repetition, truth-telling) arising from past institutional wrongdoing, which bind the present institution due to its continuous identity and unaddressed legacy. This is not rhetorical flourish but a recognition of *objective moral debts* embedded in enduring structures that contemporary members inherit *as participants* in those structures. Dissolving this into individual responsibility ignores how institutions constrain agency and perpetuate harm independently of any single member's intent.  

  **Scope, Risk & Feasibility (One Year):**  
  This tightly focused conceptual analysis is feasible within one year. The risk lies in the challenge itself: **Failure manifests if the analysis collapses into pure individualism** (reducing all obligation to current members' actions/benefits) **or pure metaphor** (admitting institutions cannot truly "bear" obligations). Success requires rigorously defending the middle ground: institutions as distinct moral agents with persistent obligations. **Adding empirical case studies (e.g., Germany, US, post-colonial states) would fragment the conceptual core and exceed one year.** This foundational work is essential *before* meaningful empirical application.  

  **Conclusion:**  
  By rigorously interrogating institutional persistence, this dissertation provides a defensible, non-metaphorical foundation for understanding how nations can bear collective guilt across generations. It resolves the tension Jaspers left open, demonstrating that enduring structures, not just individuals, are the true carriers of historical obligation. The outcome is a vital conceptual tool for navigating reparative justice in an era defined by the long shadows of historical wrongs.
