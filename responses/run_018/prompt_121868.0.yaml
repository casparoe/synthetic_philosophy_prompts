  Okay, the user is an ethics review officer at an NGO dealing with partnership proposals that challenge their human-rights framework. They need a practical decision procedure that staff without philosophy backgrounds can use in 30 minutes. They mentioned three specific cases to test the procedure, including one where the outcome might be uncomfortable. 

  First, I need to understand their core struggle: balancing universal human rights with local customs without compromising integrity. The user's colleague sees moral conflicts as zero-sum, but the user believes in trade-offs where both sides gain. The real danger is when people disguise core commitments as negotiable, leading to corruption. The user wants a checklist that flags judgment calls and prevents rationalizing unethical compromises.

  The decision procedure must be structured, with clear questions, stopping rules, and honesty about limitations. It should be accessible—no jargon, since staff lack philosophy training. The three cases provided are complex and culturally sensitive, so the tool needs to handle nuance without oversimplifying.

  For the checklist, I'll break it into phases: Alignment, Trade-off Assessment, Implementation Ethics, and Final Decision. Each phase needs specific questions with clear criteria for "sufficient" answers and hard stops. For example, any violation of absolute rights like bodily autonomy should be an immediate no. I'll include "Human Judgment Required" flags where values clash without factual resolutions.

  Key considerations: How to define "non-derogable" rights? I'll list examples like freedom from torture but clarify that context matters (e.g., gender segregation might not be absolute but requires scrutiny). The exchange rate problem—values aren't easily tradable—means emphasizing qualitative checks: "Does this sacrifice hollow out our mission?" 

  For the cases: 
  1. Gender segregation vs. girls' education: This might hit a hard stop if segregation violates core equality, but I'll let the procedure lead to rejection even if the user dislikes it. 
  2. Restorative justice without apology: Could be negotiable if material compensation meets justice goals, but skipping accountability might fail the "integrity of remedy" test. 
  3. Restricting family planning counseling: Likely a hard stop because it denies bodily autonomy rights, disguised as a trade for clinic space. The user wants to feel uncomfortable here, so I'll ensure the procedure flags it as unacceptable. 

  Finally, the summary must encapsulate the trade-off reality: "Ethical partnerships require shared foundations; compromise shouldn't mean complicity." This keeps the focus on not trading away non-negotiables. 

  I'll avoid academic references since field staff lack access. Language will be direct American English, with warnings about where the tool might misfire (e.g., underestimating harm to marginalized groups). The goal is practicality, not theoretical perfection.
answer: |-
  Here's a reusable **Ethical Partnership Assessment Tool (EPAT)** designed for speed, clarity, and guarding against disguised compromises. Staff should complete it sequentially.

  **Core Principle:** Our human rights framework is non-negotiable. *How* we achieve rights-respecting outcomes can be context-specific, but core rights cannot be traded away. "Trade" only applies to *implementation strategies*, not the rights themselves.

  **EPAT Checklist (Run sequentially - Stop if any "Hard No" is triggered):**

  1.  **CORE ALIGNMENT (Non-Negotiables)**
      *   *Question:* Does the proposed activity or condition *directly violate* a specific, non-derogable human right in our framework (e.g., bodily autonomy, freedom from torture/slavery, core non-discrimination, right to life, right to remedy)? *(Focus on the act itself, not potential benefits).*
      *   *Sufficient Answer:* Clear identification of the specific right(s) potentially violated by the proposal's *direct requirement*. If NO violation, proceed. If YES, STOP.
      *   *Hard No:* **YES.** Stop. Proposal cannot proceed as is. (e.g., Forced marriage, physical punishment, denial of life-saving care based on identity).
      *   *Human Judgment Flag:* Defining "non-derogable" and "direct violation" requires judgment. Does the condition *itself* constitute the violation? (e.g., Gender segregation *might* be argued here; restricting counseling *is* denial of information/autonomy).

  2.  **IMPACT ON MARGINALIZED GROUPS**
      *   *Question:* Would the proposal disproportionately harm or exclude any group already facing discrimination (e.g., women, ethnic minorities, LGBTQI+, persons with disabilities, the poor) *in practice*? Does it reinforce existing harmful power structures?
      *   *Sufficient Answer:* Evidence-based analysis (even anecdotal/local knowledge) of likely differentiated impacts. Mitigation plans are assessed here, but cannot negate a Core Alignment violation.
      *   *Hard No:* **YES, and the harm is severe, systemic, and unavoidable under the proposal.** Stop. (e.g., Excluding unmarried women from health services reinforces harmful stigma/control).
      *   *Human Judgment Flag:* Assessing "disproportionate harm" and "severity" is contextual and requires judgment. What's "mitigatable" vs. inherent harm?

  3.  **INTEGRITY OF THE "TRADE" (Is it a real trade, or a disguised sacrifice?)**
      *   *Question A:* Is the "benefit" gained *directly* related to advancing a core human right *for the same affected group*? (Or is it a general benefit used to justify harming a subgroup?)
      *   *Question B:* Is the "cost" (the local requirement) genuinely *instrumental* to achieving the benefit, or merely a precondition imposed by power? Could the benefit be achieved *without* this specific cost?
      *   *Question C:* Does accepting this "cost" fundamentally undermine the *meaning* or *long-term realization* of the right we are supposedly advancing? Does it legitimize the violation?
      *   *Sufficient Answer:* Clear "Yes" to A and B, and a defensible "No" to C based on context and evidence. Requires logical connection. Vague promises ("better access later") are insufficient.
      *   *Hard No:* **NO to Question A (benefit unrelated/unclear for affected group) or NO to Question B (cost not truly instrumental).** Stop. The "trade" is likely invalid or exploitative. **YES to Question C (undermines meaning/legitimizes violation).** Stop.
      *   *Human Judgment Flag:* Assessing "instrumentality" (B) and "undermining meaning" (C) is highly judgmental. Requires deep local understanding and ethical reasoning.

  4.  **ALTERNATIVES & LEVERAGE**
      *   *Question:* Have all feasible alternatives to achieve the desired benefit *without* accepting the problematic condition been genuinely explored and exhausted? Do we have leverage to negotiate a *more* rights-compatible version?
      *   *Sufficient Answer:* Documentation of specific alternatives explored/rejected (with reasons) and negotiation attempts made. "Too hard" or "local preference" alone is insufficient without evidence of genuine effort/risk assessment.
      *   *Hard No:* **NO, alternatives exist but are dismissed without robust justification, or we possess significant leverage but haven't used it effectively.** Stop. Accepting the condition may be premature or lazy compromise.
      *   *Human Judgment Flag:* Assessing "feasibility" of alternatives and "leverage" is context-specific and requires political/situational awareness.

  5.  **MITIGATION & MONITORING (If proceeding past Step 3)**
      *   *Question:* Are concrete, measurable plans in place to:
          *   Mitigate potential harms identified in Step 2?
          *   Monitor actual impacts, especially on marginalized groups?
          *   Maintain our ability to advocate against the problematic practice *externally* while respecting the partnership agreement *internally*?
          *   Include clear exit triggers if harms materialize or promises are broken?
      *   *Sufficient Answer:* Specific, actionable plans with assigned responsibilities, resources, and timelines for each point above. Vague commitments are insufficient.
      *   *Hard No:* **NO credible, resourced mitigation/monitoring/exit plan.** Stop. Proceeding is irresponsible.
      *   *Human Judgment Flag:* Assessing the adequacy and realism of mitigation/monitoring plans requires experience.

  **Final Decision:** Only proceed if the proposal passes *all* steps without triggering a Hard No. A "Human Judgment Flag" doesn't stop the process but signals the answer requires careful ethical deliberation, not just factual checking.

  **Where It Misfires:**
  *   Can underestimate long-term, symbolic harm of accepting violations (normalization).
  *   May struggle with complex, intersecting harms hard to quantify ("exchange rate" problem).
  *   Relies heavily on accurate local analysis; poor intel leads to bad calls.
  *   Doesn't eliminate judgment; it structures and exposes it. "Sufficient answers" can be gamed by motivated reasoning.
  *   May reject beneficial partnerships where the *only* path involves painful, but necessary, incrementalism on non-absolute issues.

  ---

  **Applying EPAT to Cases:**

  1.  **Gender-Segregated Meetings for Girls' School Access:**
      *   **Step 1:** Does forced gender segregation *directly violate* non-discrimination? **Potentially YES** (depending on context/culture, but likely seen as discriminatory treatment based on sex). *HUMAN JUDGMENT FLAG*. (Proceed cautiously).
      *   **Step 2:** Disproportionately harms women/girls by enforcing segregation, potentially reinforcing inferior status. Harm likely severe/systemic.
      *   **Step 3A:** Benefit (girls' education) *is* directly related to the affected group (girls). **YES.**
      *   **Step 3B:** Is segregation truly *instrumental* to education access? Or just a council preference/power display? Often **NO** (education access can be achieved without mandating segregation elsewhere). *HUMAN JUDGMENT FLAG*.
      *   **Step 3C:** Does accepting segregation undermine gender equality long-term? **Likely YES** (legitimizes the idea women/men cannot participate equally). *HARD NO triggered at Step 3B or 3C.* **Result: REJECT.** (Even if Step 1 was a judgment call, Steps 3B/C likely fail).

  2.  **Restorative Justice: Compensation but No Verbal Apology:**
      *   **Step 1:** Does skipping a verbal apology *directly violate* a non-derogable right? **NO** (Right to remedy exists, but the *form* of remedy can be culturally specific. Apology isn't an absolute universal requirement).
      *   **Step 2:** Potential harm: Victim may feel justice is incomplete without acknowledgment of wrong. Requires assessment (Is verbal apology culturally expected/needed here?).
      *   **Step 3A:** Benefit (functional remedy/victim compensation) is related to the right (remedy). **YES.**
      *   **Step 3B:** Is skipping verbal apology *instrumental* to getting compensation? Or just a cultural norm? **Likely YES** (if cultural norm makes verbal apology impossible/ineffective, this might be the *only* path to remedy). *HUMAN JUDGMENT FLAG*.
      *   **Step 3C:** Does skipping apology undermine the meaning of justice? **Contextual** (Does the practice still convey responsibility & repair effectively? If yes, maybe not). *HUMAN JUDGMENT FLAG*.
      *   **Step 4:** Explore alternatives? Can a culturally appropriate acknowledgment (not necessarily "apology") be integrated? Negotiate?
      *   **Step 5:** Mitigation: Ensure victim consents to process; monitor victim satisfaction; advocate for victim-centered approaches long-term.
      *   **Result:** Likely **PROCEED WITH CONDITIONS** if Steps 2-5 show harm is mitigatable, the "trade" is genuine (3B), and meaning isn't hollowed out (3C). Requires strong justification and monitoring.

  3.  **Restrict Family Planning to Married Only for Free Clinic Space:**
      *   **Step 1:** Does denying counseling based on marital status *directly violate* non-discrimination and the right to health information/autonomy? **YES** (Direct discrimination based on marital status; denial of essential health information/services). **HARD NO TRIGGERED. STOP.** *No need to go further*.
      *   **Even if debating Step 1:**
          *   Step 2: Disproportionately harms unmarried individuals (esp. women/youth), denying essential healthcare, reinforcing stigma/control. Severe harm.
          *   Step 3A: Benefit (clinic space) is general, NOT specifically for the group harmed (unmarried denied service).
          *   Step 3B: Denying services isn't *instrumental* to getting clinic space; it's a discriminatory precondition. **HARD NO.**
          *   Step 3C: Undermines core principles of bodily autonomy and non-discrimination in health. **HARD NO.**
      *   **Result: REJECT.** This is precisely the disguised sacrifice/corruption the tool is designed to catch. The "benefit" (space) does not justify or offset the direct violation and harm to the excluded group.

  **Final Summary:** Ethical partnerships require shared foundations; compromise on implementation is possible, but trading core rights for access is complicity, not cooperation.
