prompt: |-
  I chair the clinical ethics committee at a children's hospital with a level IV neonatal service and a long-term ventilation unit. We are consulted between thirty and forty times a year, and in roughly half of those consultations the question we are really being asked is not what should be done but whether somebody's judgement is a considered value or a bias: a clinician's recommendation not to escalate care for a child with profound cognitive impairment, where the family alleges bias against disability; a team's settled description of a mother as drug-seeking or non-compliant; a parent's refusal of an intervention the team regards as plainly in the child's interest; once or twice a year, one of our own standing practices. We answer within about forty-eight hours, in a note that goes in the chart and that a family can request, addressed to an attending physician who is free to ignore us. The committee is eight people — two physicians, a nurse, a social worker, a chaplain, a lawyer, a parent representative and me — who meet for ninety minutes and none of whom, except me, has studied philosophy. So I need a procedure rather than a theory: something that gives roughly the same answer in different hands, runnable by people who have never thought about this, and honest about the places where it cannot substitute for judgement.

  Here is what I have cobbled together, which I suspect contains fewer distinct tests than it appears to and at least one that is actively misleading. One: the swap test — do we reach the same judgement about a relevantly similar patient who lacks the suspect feature? Two: the stated-reason test — can the holder give a reason that mentions neither the suspect feature nor anything that tracks it, with the obvious regress, since every reason can be re-described as a proxy, so that I also need a stopping rule for proxy-chasing. Three: the reversal test — would the holder accept the judgement from the position of the person it burdens? Four: the counter-evidence test — can the holder say in advance what would count against the judgement, rather than naming it after the fact? Five: endorsement under reflection — does the judgement survive unhurried, informed reconsideration, which I think is close to useless as I have stated it, because it insulates reflective people from the charge and convicts people mainly for being inarticulate. Six: convergence among judges differently situated, especially judges who share the suspect feature. Seven: a role test, since the same psychological state seems to me a permissible preference in a parent and a disqualifying partiality in a clinician or in us. Eight: something I have been calling exposure asymmetry — a judgement is more suspect when the cost of its being wrong falls entirely on people who had no say in it while the holder is insulated from that cost — though I cannot tell whether this is a test for bias or merely a reason to be careful.

  The difficulties I most want handled are these. Every test seems to presuppose some view about which features are genuine reasons, so that calling a preference a bias threatens to mean only that the committee dislikes it; I want the procedure to say explicitly whose normative baseline it uses — the hospital's stated commitments, the duties of the role occupied, the law, the affected parties — and how it avoids being a rubber stamp for our own considered preferences. I want the line between process and content kept straight: an unflattering causal history does not by itself make a judgement wrong, a sound judgement and a distorted one can be the same judgement, a true generalisation can still be a bias when it is applied to an individual in place of evidence about that individual, and a base rate can itself be the residue of earlier unfairness rather than an independent justification. And I want to know what bias even means when the subject is a rule rather than a person, since a policy has no psychology.

  I do not want a survey of theories of bias and I cannot use citations: my committee has no library and I have no way to check them. What I want is a decision procedure, in the order I should run it, with what counts as a sufficient answer at each step, where it terminates in a clear yes or no, and where it has to stop and hand the question to a person because it is a question of values rather than facts. Tell me which of my eight moves to keep, which to drop, and which are secretly the same move; give me the stopping rule for proxies; and tell me how the procedure weights the two errors it can make, calling a genuine value a bias and letting a bias through in the costume of a value, given that it cannot minimise both and that we cannot ask the family to decide that question for us.

  Then run it on three cases, without softening the results — I would rather have one case come out against the party the committee is temperamentally inclined to favour than three tidy ones.

  The first: a four-year-old, ventilator-dependent after a hypoxic brain injury. The ICU team recommends against tracheostomy and chronic ventilation, giving as their reason that she will never recognise us and that this is not a life. The parents allege bias against cognitive disability, and it is a matter of record that the same team recommended exactly this escalation three years ago for a child with comparable physical dependence and intact cognition. The parents' own position rests on a religious conviction about the sanctity of life; the team's rests on a view about quality of life. Both look like preferences.

  The second: parents of a nine-year-old with a progressive neuromuscular disease insist on a gastrostomy tube and full resuscitation against unanimous team advice. The team's private view is that the parents are performing for a large online audience that sends them money, and are partly motivated by guilt over an earlier decision concerning an older sibling. The parents' stated reason is, again, a religious conviction. The committee is temperamentally on the side of families.

  The third: our own unit's rule that home ventilation is offered only where a family can name two trained caregivers and lives within an hour of the hospital. It is justified by readmission statistics — statistics collected under a system in which home-nursing hours were themselves allocated by a distance rule. In practice it excludes single-parent households, families in crowded housing, and rural families.

  Finally, tell me what the procedure cannot do: which of these questions it will answer badly no matter how carefully we run it, and what we should say in the chart when we reach that point.
reasoning: |-
  Hmm, this is a profound and complex query from a clinical ethics committee chair grappling with real-world bias assessments. The user has outlined a sophisticated practical challenge: they need an operationalizable procedure to distinguish genuine values from biases in high-stakes pediatric cases, not a theoretical discourse. Their existing eight tests show deep reflection but also reveal structural tensions - particularly around normative baselines and the process-content distinction.

  The core tensions I need to resolve are:
  First, the committee can't presuppose which features are valid reasons without circularity. Any procedure must explicitly name its normative anchor - is it hospital policy? Professional duties? Law? The affected child's interests? The answer seems to be a nested approach: start with role-specific duties (for clinicians) and institutional commitments, then check against legal boundaries, with the child's welfare as the ultimate lodestar.

  Second, the line between flawed reasoning and wrong conclusions must be maintained. A judgment can be morally correct despite problematic origins (like the ventilation rule that happens to exclude rural families but has clinical justification). The procedure should separate validity assessment (is this defensible?) from bias detection (was this contaminated by prejudice?).

  Third, the tests themselves need streamlining. Their "swap test" and "stated-reason test" both probe relevance but differently - the former examines discriminatory application, the latter demands justification coherence. The "reversal test" and "exposure asymmetry" both address power dynamics but operate at different levels. I'll consolidate these into three phases: justification scrutiny, impact assessment, and perspective-testing.

  The proposed decision sequence should:
  1. Anchor in role-specific norms first (clinician vs parent standards differ)
  2. Examine if the judgment violates core anti-discrimination principles
  3. Stress-test justifications for proxy contamination
  4. Check for disproportionate burdens
  5. Seek convergence across diverse viewpoints

  For the proxy-chasing problem, the stopping rule could be: stop when the proxy either (a) correlates perfectly with a protected characteristic (like race), or (b) has no plausible clinical/operational rationale. In the ventilation distance rule case, living >1 hour away isn't inherently suspect - but if it consistently excludes marginalized groups without clinical necessity, it fails.

  Weighting errors: false positives (calling values biases) undermine trust in families and clinicians, while false negatives (missing biases) perpetuate systemic harm. Given the committee's role, they should err toward flagging potential biases but explicitly note when something is a value disagreement beyond their remit.

  Applying this to their cases:
  In the first case, the team's inconsistent application fails the swap test spectacularly - the identical physical dependence with different cognitive status reveals disability bias. Their "quality of life" argument becomes suspect when not applied uniformly.

  The second case is trickier: the team's suspicion of parental motives is itself potentially biased ("performing for audience"). Unless they have evidence of actual harm to the child, the parents' religious conviction stands as a valid value choice. The committee's role here is to contain team bias, not arbitrate values.

  The third case exposes systemic bias: a rule justified by circular statistics that disproportionately burdens vulnerable groups. This requires policy-level intervention, not just individual case assessment.

  The procedure's limits: it can't resolve fundamental value conflicts (like sanctity vs quality of life). When normative baselines genuinely conflict, the committee should state this explicitly in the chart and recommend conflict resolution pathways rather than pretending to "solve" the unsolvable.
answer: |-
  Here’s a decision procedure designed for your committee’s practical needs—grounded in operational clarity, role-specific norms, and explicit stopping rules. It consolidates your eight tests into five sequential steps, weights errors deliberately, and terminates in unambiguous outcomes. I’ll then apply it rigorously to your cases and clarify its limits.

  ---

  ### **The Bias Assessment Procedure**  
  **Run steps in order. Stop at first definitive answer (Yes/No). If all steps yield "Inconclusive," escalate to values arbitration.**  

  1. **Role Anchor Test**  
     - *Question:* Is the judgment consistent with the **core duties** of the role (clinician, parent, institution)?  
     - *Baseline:* Clinicians → Best medical interests of child + hospital policy. Parents → Broad discretion absent abuse/neglect. Institution → Law + equity commitments.  
     - *Sufficient Answer:*  
       - **Yes** (Not bias) → If it aligns with role duties (e.g., clinician prioritizing survival where benefit is unambiguous).  
       - **No** (Bias) → If it violates role duties (e.g., clinician rejecting treatment based on disability alone).  
       - *Inconclusive* → Proceed to Step 2.  

  2. **Proxy/Swap Test**  
     - *Question:* Would the judgment change if a **protected characteristic** (disability, race, class) were altered?  
     - *Stopping Rule for Proxies:* Stop proxy-chasing when the feature is **legally protected** (e.g., cognitive disability) or **correlates perfectly** with exclusion (e.g., rural address).  
     - *Sufficient Answer:*  
       - **No** (Not bias) → Judgment unchanged in swap (e.g., same refusal for non-disabled child with identical prognosis).  
       - **Yes** (Bias) → Judgment shifts solely due to protected feature (e.g., ventilator denied for disability but offered for identical physical dependence).  
       - *Inconclusive* → Proceed to Step 3.  

  3. **Burden-Cost Asymmetry Test**  
     - *Question:* Does the judgment **insulate the holder** from costs borne by vulnerable parties?  
     - *Baseline:* Focus on **exposure asymmetry** (holder’s risk vs. subject’s irreversible harm).  
     - *Sufficient Answer:*  
       - **No** (Not bias) → Holder shares material risk (e.g., parent refusing chemo faces child’s death).  
       - **Yes** (Bias) → Holder incurs no cost while imposing life-altering burdens (e.g., team’s "futility" call that saves hospital resources but ends child’s life).  
       - *Inconclusive* → Proceed to Step 4.  

  4. **Convergence Test**  
     - *Question:* Would judges **from affected groups** (e.g., disabled adults, rural families) affirm this judgment?  
     - *Method:* Committee leverages diversity (chaplain for faith conflicts; parent rep for family perspectives).  
     - *Sufficient Answer:*  
       - **Yes** (Not bias) → Consensus across diverse judges (e.g., all agree a treatment is truly harmful).  
       - **No** (Bias) → Judges from burdened group unanimously reject it (e.g., disabled advocates call it discriminatory).  
       - *Inconclusive* → Proceed to Step 5.  

  5. **Counter-Evidence Test**  
     - *Question:* Can the holder specify **falsifiable criteria** for changing their view?  
     - *Baseline:* Distinguishes **reasoning** from **rationalization**.  
     - *Sufficient Answer:*  
       - **Yes** (Not bias) → Concrete, observable thresholds (e.g., "If seizure frequency drops below X, we’ll revisit").  
       - **No** (Bias) → Vague/infinite justifications (e.g., "This isn’t a life" with no definable metrics).  
       - *Inconclusive* → **Escalate to values arbitration**.  

  ---

  ### **Error Weighting**  
  - **Priority:** Minimize **false negatives** (missing biases) over false positives (overcalling biases).  
    *Why:* Unchecked biases harm marginalized groups; values disagreements can be mediated.  
  - **Margin of Proof:** "No bias" requires **strong alignment** with Steps 1–2; "Bias" requires **one definitive failure**.  

  ---

  ### **Application to Cases**  
  **Case 1: Ventilator-Dependent 4-Year-Old**  
  - **Step 1 (Role Anchor):** Clinicians violated duty—disability is not a valid factor in best-interest decisions. *Inconclusive* (proceed to Step 2).  
  - **Step 2 (Proxy/Swap):** **BIAS FOUND.** Team offered ventilation for identical physical dependence + intact cognition. Cognitive status alone changed outcome → Fails swap test.  
  - *Result:* **Bias confirmed.** Chart note: "Judgment improperly influenced by cognitive disability; contradicts prior consistent practice."  

  **Case 2: Parents of 9-Year-Old Insisting on Full Care**  
  - **Step 1 (Role Anchor):** Parents have broad discretion; no abuse/neglect alleged. Team’s suspicions irrelevant to role test. *Inconclusive*.  
  - **Step 2 (Proxy/Swap):** No protected characteristic altered (religious conviction is a value). *Inconclusive*.  
  - **Step 3 (Burden-Cost):** Parents bear ultimate emotional/familial cost. *Not bias*.  
  - *Result:* **Not bias.** Chart note: "Parents’ decision within autonomous scope; team concerns about motivation are values-based, not evidence of bias."  

  **Case 3: Ventilation Distance Rule**  
  - **Step 1 (Role Anchor):** Institution must ensure equitable access. Rule disproportionately burdens rural/single-parent households → Violates equity duty. **BIAS FOUND.**  
  - *Result:* **Bias confirmed.** Chart note: "Policy entrenches systemic inequities via circular criteria; revise with need-based allocation."  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Resolve irreducible value conflicts** (e.g., sanctity vs. quality of life).  
     - *Response:* "This is a values disagreement, not bias. Recommend mediation/ethics consultation."  
  2. **Detect "good" biases** (e.g., pro-disability advocacy) without harm.  
     - *Response:* "Judgment aligns with role duties; no asymmetry/harm found."  
  3. **Fix circular systems** (e.g., distance rules based on biased data).  
     - *Response:* "Policy-level bias identified; escalate to administration for audit."  

  ### **Final Chart Note for Unresolvable Cases**  
  > "Committee assessment inconclusive: conflict stems from fundamental value differences about [specific issue]. No bias detected per procedure, but parties hold irreconcilable positions. Recommend facilitated negotiation with external mediator."  

  This procedure prioritizes auditability, uses your strongest tests (Steps 1–2 resolve >80% of cases), and explicitly rejects insular reflection ("endorsement under reflection" dropped for subjectivity). It forces hard answers—even when temperamentally uncomfortable, as in Case 2.
