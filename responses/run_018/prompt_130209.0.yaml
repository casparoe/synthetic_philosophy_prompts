answer: |-
  Hey! Got it - you need a tight teaching arc for the epistemic Wrong Kind of Reasons (WKR) problem using the climate report bribery case, steering clear of the sick-friend analogy. Here’s how I’d structure the 40 minutes, focusing on sequencing to preempt misconceptions and keep it grounded:  

  Start by anchoring the session in **the nature of belief itself**. This is the non-negotiable dependency. Spend 10 minutes having them articulate why belief is "truth-aimed" – not just that we *want* beliefs to be true, but that a belief’s *correctness* depends *entirely* on whether it matches reality. Use quick examples: "What makes my belief that it’s raining correct? The fact that water is falling from the sky, not that I enjoy rain." Without this, they’ll frame the bribe as a "bad reason to act on a belief" rather than seeing it as fundamentally *irrelevant* to belief-formation.  

  Then, introduce your core case: **"Imagine a billionaire offers you $10 million to believe, right now, that the latest IPCC climate report is completely accurate. You’d get the money only if you genuinely hold the belief, not just pretend."** Carry this example through the whole session. Contrast it explicitly with the sick-friend case (which you should briefly mention to dismiss): "The sick-friend case is muddy here because it smuggles in *moral* reasons – wanting to comfort someone. Our climate bribe is purely about the cash incentive versus the report’s actual evidence. No kindness, no guilt – just truth versus money."  

  Now, anticipate and cut off three key misconceptions in sequence:  
  1. **After presenting the case, immediately preempt the "weak evidence" confusion.** They’ll say, "But if the report *is* accurate, the bribe isn’t a problem!" Nip this by stressing: "Suppose the report *is* flawless. The bribe still isn’t a reason *for* believing it; it’s a reason to *want* to believe it. Ask: Does the money make the report’s findings *more likely to be true*? If not, it’s the wrong kind." Use a contrast: "A *weak* reason would be finding one minor error in the methodology – that *does* bear on truth, even if poorly."  
  2. **Mid-session, block the "irrationality" misdiagnosis.** When discussing why someone might take the bribe, they’ll label it "irrational." Counter: "It’s not *irrational* like believing 2+2=5 despite all evidence. It’s *arational* – the bribe operates outside belief’s rules. You can’t choose belief for cash any more than you can choose to find vinegar sweet by force of will. Distinguish practical irrationality (poor choice-taking) from doxastic incoherence (mismatch between evidence and belief)."  
  3. **During Q&A, deflect "lack of motivation" misreads.** Someone will suggest, "But if you care about climate change, you *should* take the bribe to force belief!" Clarify: "Motivation matters for *seeking evidence*, not for *constituting* belief. A $10m bribe might motivate you to read the report closely, but if you then find it flawed, the money doesn’t magically make it credible. The wrong-kind reason can’t bridge that gap."  

  For your end-of-session checkpoint, ask: **"Why is the bribe a wrong-kind reason for *believing* the climate report, but potentially the *right-kind* reason for *betting* $100 that the report is accurate?"** This forces them to isolate belief’s truth-aim from action’s goal-directedness. If they can’t articulate that the bet’s success depends on payout likelihood (where incentives matter), while belief’s success depends *only* on reality, they’ve missed the core.  

  Explicitly exclude **meta-normative debates about reasons-first ontology** (e.g., whether all reasons reduce to one type). Give a disclaimer upfront: "We’re bracketing deep metaphysics today – no need to solve whether epistemic reasons are fundamentally different entities or just differently constrained. Focus on *why* the bribe feels distinct within our practice of forming beliefs." That rabbit hole will sink your 40 minutes.  

  Keep circling back to the climate bribe – it’s perfect because it strips away morality, highlights the tension between external incentives and truth-tracking, and feels urgently contemporary. You’ve got this! Let me know how it shakes out.
