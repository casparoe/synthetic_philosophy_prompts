  First, I need to recall what the epistemic wrong kind of reasons problem is. It's about reasons that seem relevant to believing something but actually aren't proper epistemic reasons. For example, being bribed to believe a climate report is accurate doesn't make the report true; it's a pragmatic reason, not an evidential one. The user wants to avoid common pitfalls where students confuse this with weak evidence or lack of motivation.

