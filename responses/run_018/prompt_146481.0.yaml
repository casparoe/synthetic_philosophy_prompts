prompt: |-
  Hey — I need a prompt-engineering-style task for a dataset I'm building. Can you act as a professional philosopher of science who works on historical ontology? Please think really carefully, and begin with a short brainstorm of the actual fault lines in the debate.

  Write a sorting taxonomy — basically a decision tree — for the question: is the Anthropocene a genuine historical period, when exactly did it start, and who has the authority to decide? Write the whole thing in British English (colour, centre, behaviour).

  Don't just copy an encyclopedia entry. I want the branches built from concrete cases that genuinely seperate the positions. For instance: if plutonium-239 appears in sediment cores on every continent but with a 20-30 year lag between hemispheres, does that still count as one global start date? Or if a community in the Amazon basin that never industrialised is asked to vote on an epoch name, should their view carry equal weight?

  Your tree should lead to about 7 named leaves. The branch questions must be phrased so someone can answer them without already knowing which label they're picking. Include at least these positions mapped onto the logical space: an ICS-formalist who wants a single stratigraphic marker; a Great Acceleration / mid-20th-century stratigrapher; an Orbis-spike / 1610-type historian; a democratic or global-south co-decision advocate; an anti-formal heuristic user; and a regional-diachronist who thinks start dates vary by place.

  Then, after the tree, note any logically possible combinations that are unoccupied — like "yes it's formal, yes there's a single marker, but it's the year 2100" — and briefly diagnose why: incoherent, unattractive, or just unexplored? Also flag any pair of leaves your questions can't really seperate — for example, the Orbis-spike view and the diachronist both reject 1950 but for quite different reasons, and your tree might not catch that distinction.

  Keep everything grounded in ideas that don't require searching for obscure papers. No bibliographies, no reading lists, no citation requests, and definately avoid verbatim quotes from real texts. There's a typo in my message — I wrote "seperate" — but you should use the correct spelling in your answer.
