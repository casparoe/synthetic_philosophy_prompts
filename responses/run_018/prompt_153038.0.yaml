prompt: |-
  I am writing a feature on the philosophy of consent for a science and ideas magazine, and I want to test whether my own intuitions cohere into a principle or collapse under scrutiny. Below are six concrete cases mixing deception, coercion, and competence in combinations that standard clinical-ethics frameworks rarely address together; I have given my gut verdict on each.

  Case 1: A cardiologist describes a stent procedure accurately except for omitting a 2 per cent risk of permanent nerve damage, judging that the patient—fully competent and not under duress—would refuse a life-saving intervention if told. The patient consents. Verdict: invalid, because the omission is both deceptive and material.

  Case 2: A sleep-study recruiter tells volunteers they will ‘help science and earn £200’, but does not disclose that participation requires seventy-two hours of continuous wakefulness with only brief naps. The volunteers understand the study concerns sleep, are competent, and face no coercion. Verdict: invalid; the framing conceals the true nature of the burden.

  Case 3: A gig worker with no savings is offered £2,000 to take part in a two-week trial of a new appetite suppressant. She reads the full consent form, understands the cardiac risks, is not deceived, and says she ‘has no real choice’ because rent is due, yet she can physically walk away. Verdict: valid; economic necessity does not, by itself, vitiate autonomy when information is complete.

  Case 4: A prisoner is offered six months off his sentence in exchange for joining a trial of an experimental anxiety medication. He reads the form, understands the 1 per cent psychosis risk, and is fully competent. Verdict: invalid; state-backed punishment relief functions as coercion in a way private financial pressure does not.

  Case 5: An elderly man with early-stage Alzheimer’s—still passing standard competence assessments—is asked by his daughter to consent to post-mortem brain donation for research. She explains everything honestly, appeals to their bond, and he agrees partly to please her. Verdict: valid; emotional influence within close relationships does not invalidate consent if competence and disclosure are intact.

  Case 6: A cognitively typical university student is persuaded by an intense online community to undergo an elective, irreversible, legal-but-unregulated neuro-modulation procedure. He researches the risks extensively, is not deceived, and admits he ‘would never have considered it without the group’s relentless encouragement’. I keep reversing myself: sometimes this feels like valid adult autonomy, sometimes like a social cascade that functions as coercion.

  Is there a single principle—or a small, precisely stated family of them—that captures Cases 1 through 5 and delivers a clear verdict on Case 6? If so, please state it precisely, indicate which clause is motivated by which case, and say what it predicts for an unlisted scenario: a surgeon discovers an unexpected tumour during an operation and asks the patient’s designated digital proxy—an AI agent trained on the patient’s prior values—for consent to remove it. If no single principle saves all five verdicts, please identify the simpler account, state which of my verdicts it forces me to abandon, and explain whether the abandoned verdict is the outlier. Please write your answer in British English, avoid bibliographic references or reading lists, and do not cite specific authors or texts by name; I am interested in the argument, not the citation.
reasoning: |-
  Hmm, this is a fascinating philosophical challenge about consent ethics with real-world implications. The user presents six nuanced cases where standard frameworks seem inadequate, and seeks a unifying principle that preserves their intuitive judgments while resolving the ambiguous Case 6. 

  First, let's analyze their verdicts: Cases 1-2 clearly prioritize full disclosure (material omissions invalidate consent), while Cases 3-5 introduce graded thresholds for voluntariness - economic pressure is tolerable but state coercion isn't, and familial influence gets a pass. Case 6 stumps them precisely because it straddles this voluntariness boundary: is cult-like persuasion merely social influence or undue coercion?

  The key tension lies in how we define "undue pressure." Their judgments suggest three cumulative criteria for valid consent: 1) epistemic integrity (no deception/material omissions), 2) cognitive competence, and 3) relational voluntariness (absence of exploitative power imbalances). Case 3's "no real choice" doesn't violate #3 because market forces, while harsh, aren't deliberately exploitative - unlike the prison system in Case 4. Case 5's emotional appeal survives because familial bonds aren't inherently exploitative.

  For Case 6, the decisive factor should be whether the community's influence crosses into systemic manipulation. If it's mere peer pressure (like a book club urging marathon running), consent holds; if it's coercive control (isolation, fatigue tactics, thought reform), it fails. This explains their ambivalence - the description leans toward the latter with "intense," "relentless," and "cascade."

  The AI proxy scenario tests the principle's adaptability. Here, competence/disclosure are handled via the patient's data, but voluntariness is tricky: does the AI merely simulate past preferences or adapt to new contexts? The principle would require the AI to strictly apply documented values, not extrapolate. If the tumor scenario was never discussed, removal couldn't be consented to - aligning with their strict view of material omissions in Case 1.

  Notably, their verdicts cohere better than they might expect. The abandoned intuition would be any claim that Case 3's consent is invalid - but that's consistent, as refusing that would demand impossible protection from all life pressures. The core insight is that consent requires protection from deliberate advantage-taking, not misfortune.
answer: |-
  Here's a principle synthesising your verdicts for Cases 1-5, designed to resolve Case 6 and handle the AI proxy scenario:

  **The Volitional Integrity Principle:**  
  *Consent is valid only when:  
  (A) All material facts about the nature, consequences, and burdens of the act are disclosed without deception;  
  (B) The agent possesses sufficient cognitive competence to understand this information;  
  (C) The decision arises from the agent’s own evaluative framework without being compelled by*  
  *(i) deliberate informational manipulation,  
  (ii) institutional power exploiting vulnerability, or  
  (iii) coercive force that negates reasonable alternatives.*  

  **Application to Cases 1-5:**  
  - **Case 1** violates (A): Omission of material risk is deceptive. *(Clause A)*  
  - **Case 2** violates (A): Framing conceals material burden (72hr wakefulness). *(Clause A)*  
  - **Case 3** satisfies all: Full disclosure (A), competence (B). Economic pressure isn’t *institutional exploitation* (C-ii) nor does it negate *reasonable alternatives* (C-iii) – paying rent elsewhere (loan, charity) remains physically/legally possible. *(Clauses A,B,C)*  
  - **Case 4** violates (C-ii): Prison sentence reduction leverages *state power* to exploit vulnerability (incarceration), creating an offer that cannot reasonably be refused. *(Clause C-ii)*  
  - **Case 5** satisfies all: Disclosure (A), competence (B), familial appeal isn’t *institutional coercion* or *manipulation* under (C). *(Clauses A,B)*  

  **Resolution for Case 6:**  
  - **Invalid consent** if the online community’s methods constitute *deliberate psychological manipulation* (e.g., systematic isolation, fatigue, escalating commitment tactics). This violates (C-i).  
  - **Valid consent** if it’s merely persistent advocacy within a trusting subculture, absent exploitative tactics.  
  *Your description ("intense," "relentless encouragement," "social cascade") suggests manipulative dynamics akin to coercion-by-persuasion, leaning towards* ***invalid*** *under (C-i).*

  **AI Proxy Scenario:**  
  - **Permissible** *only if*:  
  1. The AI’s decision directly reflects the patient’s *documented prior values* regarding unforeseen medical interventions (satisfying A and B *prospectively*).  
  2. Removal aligns with a *specific advance directive* covering intraoperative discoveries.  
  - **Impermissible** if the AI *infers* consent based on general data patterns, as this risks:  
    - Violating (A): The patient lacked material facts about *this specific tumour*.  
    - Violating (B): No contemporaneous competence assessment.  
    - Violating (C): The AI’s "judgment" isn’t the patient’s *actual* evaluative response.  
  *Without explicit prior instructions, consent fails Clause A (undisclosed tumour specifics) and B (no real-time competence).*

  **Why This Works:**  
  - Your verdicts consistently prioritise **informational purity** (Cases 1-2) and **reject institutional coercion** (Case 4), while **accepting non-exploitative social/economic pressure** (Cases 3,5).  
  - Clause (C) distinguishes *oppressive* influences (state power, manipulative control) from *background* pressures (poverty, family ties) by focusing on **agency-undermining mechanisms**.  
  - Case 6’s ambiguity arises from unclear *method* of influence – resolved by assessing whether tactics bypass rational evaluation (C-i).  

  **If Simplicity is Preferred:**  
  A narrower **Material Integrity + Coercive Power Principle** (*Consent requires truthful disclosure of material burdens/risks and absence of institutional coercion*) would force you to:  
  - **Abandon your Case 3 verdict**, treating economic desperation as coercive (invalidating consent).  
  - **Why Case 3 is the outlier:** Your intuition distinguishes *structural* poverty (background condition) from *deployed* institutional power (e.g., prison). The simpler principle conflates them, over-extending "coercion."  

  Your judgments hold together best by distinguishing *manipulative/institutional force* from *non-exploitative pressure* – preserved in the Volitional Integrity Principle.
