  ## The Crumbling Edifice: Walzer's Moral Equality Beyond the Battlefield

  Michael Walzer's concept of the "moral equality of combatants" stands as a cornerstone of traditional Just War Theory. It posits that soldiers fighting for *any* state, regardless of the justice of their cause, possess equal rights to kill enemy combatants and incur equal liabilities to be killed. This equality rests on two pillars: **reciprocal risk** (soldiers face symmetrical dangers) and **non-responsibility** (soldiers are instruments of the state, coerced or socialized into fighting, and thus not morally culpable for the war's justice). However, when we depart from the paradigm of symmetrical state-on-state warfare and confront the realities of asymmetric conflict and remote warfare, both pillars crack, suggesting Walzer's equality is a contingent principle, not a universal one, and arguably collapses entirely under modern conditions.

  **The Asymmetric Assault: Insurgents and the Fractured Symmetry**

  Applying Walzer's equality to insurgents in asymmetric conflicts immediately strains its logic:
  1.  **Shattered Reciprocity:** Insurgents typically lack uniforms, fixed bases, and heavy weaponry, deliberately blending with civilians and employing tactics (like ambushes and IEDs) that avoid direct, symmetrical confrontation. They face overwhelming firepower and surveillance, making their risk profile fundamentally *asymmetrical*. A state soldier patrols in body armor with air support; an insurgent plants a bomb at night. Where is the reciprocal risk? The reciprocity-based defense falters – the state soldier faces dangers the insurgent deliberately avoids in kind, while the insurgent faces existential threats the state soldier rarely encounters.
  2.  **Questionable Non-Responsibility:** While state soldiers often operate under legal and social coercion, many insurgents are highly motivated volunteers driven by ideological commitment to their cause. They *do* actively choose their struggle, often seeing it as a moral imperative against oppression or occupation. Their agency is far more pronounced than Walzer's conscripted pawn. If the insurgent's cause is unjust (e.g., a terrorist group targeting civilians), this heightened agency strengthens the argument that they *forfeit* their right not to be targeted by actively pursuing an unjust war through unjust means. The rival view – that only unjust fighters forfeit rights – gains traction here. A just state defending itself arguably has the right to target *unjust* insurgents who pose a violent threat, without granting them an equal moral license to kill state soldiers whose defensive actions are (presumably) governed by jus in bello constraints.

  **The Remote Revolution: Drone Warfare and the Vanishing Vulnerability**

  The emergence of remote combat, epitomized by drone operators, delivers a potentially fatal blow to Walzer's framework:
  1.  **The Evisceration of Risk:** Drone operators conducting strikes from continents away face *no physical danger* from their targets. The fundamental condition of mutual vulnerability – the shared "nakedness to death" that underpinned the ancient truce and Walzer's reciprocity – vanishes entirely. The reciprocity-based defense becomes nonsensical. How can a drone crew possess an "equal right" to kill adversaries who pose literally zero physical threat to them? The asymmetry of risk is absolute and unidirectional.
  2.  **Reinforced Agency:** While operating within a chain of command, drone crews possess significant cognitive agency. They meticulously plan strikes, analyze intelligence, and make life-and-death decisions. They are not automatons but highly trained professionals exercising judgment, far removed from the fog and coercion of the frontline. This heightened level of control and deliberation, combined with the absence of personal risk, weakens the "non-responsibility" shield. Critics argue this detachment might even *increase* moral responsibility, as actions are taken coolly, without the visceral pressures of combat. If they knowingly participate in unjust strikes (e.g., based on flawed intel causing disproportionate civilian harm), the forfeiture argument applies forcefully – why should they retain an inviolable right when they face no peril and their actions may be deeply culpable?

  **Weighing the Rivals: Reciprocity vs. Forfeiture**

  The reciprocity-based defense struggles immensely outside symmetrical warfare:
  *   **Against Insurgents:** It cannot establish symmetry where none exists. Granting equal rights to an insurgent who deliberately exploits civilian cover and avoids reciprocal combat seems perverse and undermines the very jus in bello rules (like distinction) Walzer sought to protect.
  *   **Against Drones:** It collapses entirely. There is no reciprocity to ground equality.

  The rival forfeiture view – that combatants forfeit their right not to be killed only *if* they fight unjustly or violate jus in bello – gains significant plausibility:
  *   **Clarity in Asymmetry:** It provides a clearer moral basis for targeting unjust insurgents actively waging war through illegitimate means. It denies a blanket "license to kill" to those fighting for an unjust cause, regardless of their status.
  *   **Addressing Remote Warfare:** It readily explains why drone crews participating in unjust actions can be held morally accountable and lack blanket immunity, as their actions directly cause harm while they bear no risk.
  *   **Jus in Bello Anchor:** It maintains the vital principle that *all* combatants, regardless of cause, must adhere to jus in bello rules. Violating these rules (targeting civilians, torture) remains a separate ground for forfeiture.

  However, the forfeiture view faces challenges:
  1.  **Epistemic Burden:** Determining the objective justice of a cause *in medias res* is notoriously difficult and subjective. Granting states the unilateral power to declare enemy combatants "unjust" and thus forfeit rights is dangerous.
  2.  **Risk and Coercion:** It potentially undervalues the mitigating role of coercion and socialization for state soldiers, even in asymmetric wars. Should a conscript in an aggressor army be morally equivalent to a volunteer suicide bomber?

  **The Verdict: Conditional Equality, Dead in the Air**

  Walzer's moral equality of combatants, conceived for a world of clashing conscript armies, **does not survive intact** beyond conventional state wars. The principle is fundamentally **conditional upon mutual vulnerability and a rough symmetry of risk and agency.**

  *   **In Asymmetric Conflict:** Moral equality **largely collapses**. Where reciprocity is deliberately absent (e.g., insurgents refusing open combat while targeting soldiers), or where risk is overwhelmingly one-sided (state forces vs. lightly armed rebels), granting equal rights evaporates. The forfeiture view offers a better, though imperfect, framework: insurgents fighting justly *and* adhering strictly to jus in bello *might* retain significant rights, while those fighting unjustly or violating humanitarian law clearly forfeit them. The key is that equality is not automatic; it depends on conduct and context, eroding the blanket symmetry Walzer proposed.
  *   **In Remote Warfare:** Moral equality is **dead**. Drone crews facing zero physical risk cannot claim an "equal right" grounded in shared vulnerability. Their moral status hinges entirely on the justice of their cause and the proportionality and discrimination of their actions – the core of the forfeiture view. They lack the reciprocity that traditionally justified the combatant's privilege. Their immunity from physical counter-attack severs the ancient link that made mutual killing morally permissible amongst warriors.

  Therefore, Walzer's elegant symmetry shatters against the jagged realities of modern conflict. **Moral equality is not inherent to combatancy; it is a contingent artifact of reciprocal risk.** Without that shared vulnerability – whether absent by design in insurgency or obliterated by technology in drone warfare – the foundation of equality crumbles. We are left with a messier, more demanding ethic: one where the right to kill depends far more heavily on the justice of one's cause and the scrupulous adherence to the laws of war, and where the comfortable blanket of automatic equality no longer shields those who fight without facing the peril they inflict. The era of the warrior's mutual respect, if it ever truly existed in the form Walzer described, is over for the insurgent in the shadows and the pilot in the trailer.
