  I've been skimming Franklin's autobiograpy about his 13 virtues project, and I keep hitting the same wall: he admits he never actually achieved moral perfetion in any of them, so wasn't the whole exercise basically a failure? I mean, if the metric is binary — perfect or not — and he stayed not-perfect forever, what was the point of keeping that little jounal with black marks? Was he just running some weird proto-Bayesian update loop on himself without knowing it, or is there a different way to read 'moral perfection' here that isn't about reaching a finish line?
