prompt: |-
  me and my friend got into this huge argument last night about whether emotions are judgments, perceptions, or just raw feelings, and i kept thinking about my intake job. i work at a community clinic and every week i have to classify whether a clients state is an emotional crisis, a cognitive distortion, or a somatic/perceptual thing, because that decides which clinician they see. right now i just go with my gut and my supervisor is pissed.

  i need a reusable decision procedure i can actually run in ten minutes with no books. it should be grounded in the philosophy - like direction-of-fit, whether the state is revisable by evidence, phenomenal transparency vs opacity - but translated into steps i can check off. please give me:

  - the ordered questions, with what counts as a sufficient answer and the exact hard stop where i have to hand it to a supervisor because its a values call not a fact
  - apply it to three cases: a client who says they feel worthless since their partner left; a client describing crushing chest pressure and grey vision with no clear object; and one tricky case where the procedure classifies it as not-an-emotional-crisis even though my intuition screams it is
  - say exactly where the procedure will misfire or break

  dont need citations, just the logic. write it casual cause im tired and probably have a typo or two in here.
reasoning: |-
  Okay, the user works at a community clinic doing intake and needs a decision procedure to classify client states into emotional crisis, cognitive distortion, or somatic/perceptual issues. They've been relying on gut feelings, which has upset their supervisor. The procedure must be quick, reusable, grounded in philosophy concepts like direction-of-fit and revisability, and operable in under ten minutes without references.

  First, I need to unpack the philosophical foundations they mentioned. Direction-of-fit: mind-to-world (judgments aiming to match reality) vs world-to-mind (emotions/desires aiming to change reality). Revisability: whether new evidence can alter the state. Phenomenal transparency/opacity: whether the experience points beyond itself (transparent) or is self-contained (opaque). 

  The core challenge is translating these abstract concepts into concrete yes/no questions. The procedure should have clear exit points where values decisions require supervisor escalation. Three key buckets: emotional crisis (world-to-mit fit, resistant to evidence), cognitive distortion (mind-to-world fit, revisable), somatic/perceptual (opaque, non-revisable sensations).

  For the questions: Start with somatic flags (immediate safety risks). Then assess revisability - "If I showed you proof opposite of your belief, would it change?" If yes, likely cognitive. If no, proceed to direction-of-fit: "Does this feeling make you want to change reality?" Emotional crises demand action while cognitive distortions demand correction. Finally, opacity check: somatic issues feel "just there" without intentionality.

  The three test cases: 
  1. "Worthless since breakup" - revisable? (Yes, if shown proof of worth). Cognitive. 
  2. "Chest pressure/grey vision" - non-revisable, opaque. Somatic. 
  3. The tricky case: Someone saying "The walls are breathing" with calm curiosity. Non-revisable (evidence doesn't change it), no world-to-mind fit (no distress/action urge), opaque perception. Classifies as somatic despite intuition screaming crisis - but procedure correctly flags perceptual disturbance needing medical eval first.

  Major pitfalls: Cultural differences in emotion expression, trauma survivors dissociating (appearing somatic when crisis), psychotic features masked as cognitive distortions. Always ends with supervisor handoff if values conflict or safety concerns emerge.

  The user's exhaustion is palpable - so keeping it casual with blunt phrasing ("proof opposite", "shut you down") respects their mental state. Emphasizing the 10-min constraint means prioritizing observable client responses over deep analysis. Supervisor handoff rules prevent burnout calls.
answer: |-
  Here's your reusable decision tree - grounded in philosophy but stripped down for clinic use. Run it in 8-10 minutes by asking **exactly these questions** in order. **Hard stops** at Step 4 and Step 7 for supervisor handoff.

  ---

  ### **The Procedure: Gut Check → Evidence Lock → Action Demand → Sensation Scan**
  **PHILOSOPHY CHEAT SHEET:**  
  - *Direction-of-fit*: "Is this feeling trying to CHANGE reality (world-to-mind) or DESCRIBE it (mind-to-world)?"  
  - *Revisability*: "Would cold, hard proof make this feeling vanish?"  
  - *Phenomenal Opacity*: "Does this sensation feel like a BRICK WALL - just *there* with no 'meaning' behind it?"  

  #### **Step 0: Safety Triage**  
  *Ask IMMEDIATELY if:*  
  ☑️ Suicidal/homicidal ideation?  
  ☑️ Disorientation (can't name president/location)?  
  ☑️ Acute physical danger (e.g., chest pain + sweating)?  
  → **HARD STOP: EMERGENCY PROTOCOL. Skip all below. Call supervisor NOW.**  

  #### **Step 1: Gut Translation**  
  *Ask client:* **"What’s the CORE of what's happening for you right now – in 10 words or less?"**  
  - *Sufficient answer:* Single concrete phrase (e.g., "Heartbroken," "Mind won't stop," "Body feels broken").  
  - *Insufficient:* Vague rambling → Re-ask: **"If you had to text a friend, what 3 words would you use?"**  

  #### **Step 2: Evidence Lock Test (Revisability)**  
  *Ask:* **"If I had VIDEO PROOF of the opposite of what you feel/believe, would it change this feeling?"**  
  - **YES** → *Cognitive distortion* (e.g., "I'm worthless" → revisable by evidence of worth).  
  - **NO** → Go to Step 3.  
  - *Client waffles* → **"Would it SHUT DOWN the feeling, or just sit beside it?"** → If "shut down," treat as YES.  

  #### **Step 3: Action Demand Check (Direction-of-fit)**  
  *Ask:* **"Does this feeling make you want to SMASH or CHANGE something? Or does it feel like a FACT you can't escape?"**  
  - **SMASH/CHANGE** → *Emotional crisis* (e.g., rage/grief demands world change).  
  - **FACT** → Go to Step 4.  
  - *Unsure* → **"If magic erased this feeling, would you still believe the thought?"** → If YES → *Fact = Cognitive*. If NO → *Action demand = Emotional*.  

  #### **Step 4: Sensation Scan (Phenomenal Opacity)**  
  *Ask:* **"Where do you feel this in your body? Does it feel like a THING sitting there, or a SIGNAL about your life?"**  
  - **"THING" (e.g., pressure, buzz, numbness)** → *Somatic/Perceptual*.  
  - **"SIGNAL" (e.g., "My chest hurts BECAUSE I'm abandoned")** → **HARD STOP: SUPERVISOR HANDOFF.** *Reason: Values call. Client’s interpretation blurs somatic/emotional.*  
  - *No bodily feel* → Default to outcome of Step 2/3.  

  ---

  ### **Applied to Cases**  
  **Case 1:** "I feel worthless since my partner left."  
  - Step 1: "Worthless."  
  - Step 2: **"If I showed video of friends calling you amazing, would 'worthless' vanish?"** → *"Maybe... but I’d still feel it."* → **NO** → Proceed.  
  - Step 3: **"Does worthless make you want to CHANGE things?"** → *"No. It’s just true."* → **FACT** → *Cognitive distortion* (clinician: CBT therapist).  

  **Case 2:** "Crushing chest pressure, grey vision. No trigger."  
  - Step 1: "Chest exploding."  
  - Step 2: **"If I proved nothing’s wrong, would pressure vanish?"** → *"No, it’s just THERE."* → **NO** → Proceed.  
  - Step 3: **"Want to SMASH something?"** → *"Too busy trying not to die."* → **FACT**  
  - Step 4: **"Is pressure a THING or SIGNAL?"** → *"Just a thing."* → *Somatic* (clinician: MD/neuro check first).  

  **Case 3 (Tricky):** Client smiles, says: **"I see spiders crawling on your desk. It’s fine though – they’re just decorating."**  
  - Step 1: "Spiders on desk."  
  - Step 2: **"If I showed you this desk is empty on video?"** → *"Your video’s broken. I see them now."* → **NO**  
  - Step 3: **"Want to SMASH spiders?"** → *"No, they’re pretty."* → **FACT**  
  - Step 4: **"Are they a THING or SIGNAL?"** → *"Just things."* → *Somatic/perceptual* (not emotional crisis).  
  - *Why intuition screams crisis?* Detached perceptual distortions = psychotic feature. Procedure correctly routes to medical eval, NOT crisis counselor. Your gut flagged risk, but protocol prioritizes ruling out neuro/toxicity first.  

  ---

  ### **Where It Breaks**  
  1. **Cultural/linguistic gaps:** "Evidence" assumes Western rationalism. Client says "possession" → procedure misfires at Step 2.  
  2. **High-functioning dissociation:** Client describes somatic symptoms (Step 4) but is actually drowning in emotion. Tip: Watch for flat affect + bizarre metaphors.  
  3. **Philosophical rebels:** Existential crises ("Life is meaningless") often pass Step 2 (not revisable) but lack "action demand" → misclassed as cognitive.  
  4. **Trauma triggers:** Flashbacks feel like "FACT" (Step 3) but are emotional crises. Red flag: Client freezes/seems "zoned out."  

  **Supervisor Handoff Triggers:**  
  - Step 4: Client insists somatic sensation "means" something (e.g., "This pain IS my guilt").  
  - Values conflict (e.g., client refuses somatic work for "spiritual ailment").  
  - Your gut screams "WRONG" after running steps – **always defer to discomfort.**  

  This isn’t perfect, but it’s better than your pissed supervisor. Use it as a *dialectic tool* – sometimes the client’s answer to Step 2 reveals more than the classification. Stay tired, stay human.
