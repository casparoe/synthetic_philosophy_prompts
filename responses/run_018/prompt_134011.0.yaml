      "situationist_reading": "Optimal behavior results from exhaustive trial-and-error learning. Hidden variables: emotional saturation and perfected predictive models of the day's events.",
      "ecologically_indexed_reading": "Phil has engineered a niche where his actions align with the town's needs through prior calibration. Virtue is observable only because he sculpted the ecology to make it functional and rewarding.",
