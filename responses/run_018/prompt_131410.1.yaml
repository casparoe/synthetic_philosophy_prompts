  We are drafting a joint statement between two scholars with opposing interpretations of Reserve Police Battalion 101's actions during the Holocaust. The statement will have two main parts: 
  1. A numbered list of agreed-upon facts about the battalion's actions, refusal rates, peer dynamics, and pre-war antisemitism.
  2. A table of disagreements on three cruxes, with each side's position and a concrete example or data pattern both sides agree is relevant to that crux.

  The agreed claims should be based on well-documented historical facts, drawing from sources like Christopher Browning's "Ordinary Men" and Daniel Goldhagen's "Hitler's Willing Executioners", but without requiring citations.

  The disagreements table will cover three cruxes:
  (1) The primary driver of the escalation: situational pressure and peer bonding vs. activation of deep eliminationist antisemitism.
  (2) Whether local-initiative killings (like Jedwabne) break the situational model or can be explained by peer-escalation under regional SS pressure.
  (3) The meaning of "ordinary" — descriptive vs. exculpatory.

  For each crux, we will name a concrete case or data pattern that both sides agree is relevant and record each side's prediction in advance. We note if part of the dispute is verbal.

  We aim for formulations that both sides could sign, avoiding vague language.

  Let's structure the document:

  **Joint Statement on Reserve Police Battalion 101**

  **I. Agreed Claims**

  1. **Actions during 1942-43:** Reserve Police Battalion 101, a unit of approximately 500 men, was deployed in the Lublin district of German-occupied Poland. From July 1942 to November 1943, they participated in the shooting of at least 38,000 Jews and the deportation of at least 45,000 more to extermination camps. Key actions included the massacre at Józefów on July 13, 1942, and subsequent operations in towns such as Łomazy, Międzyrzec, Serokomla, and the final large massacre at Majdanek in November 1943.

  2. **Documented Refusal Rates:** At Józefów, the initial massacre, Major Wilhelm Trapp offered his men the chance to step out if they did not feel up to the task. Approximately 10-15 men out of about 500 (roughly 2-3%) initially refused or stepped aside. Over the entire period, the cumulative refusal rate (including those who avoided participation by taking up non-shooting duties or transferring out) is estimated to have been between 10-20%. However, direct refusal at a killing action was rare after Józefów; most who did not participate arranged other duties in advance.

  3. **Peer Dynamics:** Peer pressure and group conformity played a significant role in the unit. There is evidence that men who hesitated were mocked or pressured by comrades and superiors. For example, at Józefów, some who initially stepped out later rejoined the shooting after seeing their comrades proceed. The unit developed a culture of compliance, with heavy drinking and bonding rituals after killings.

  4. **Pre-war Antisemitic Socialization:** The battalion was composed primarily of middle-aged, working-class and lower-middle-class men from Hamburg. They were not a highly selected Nazi elite (only about 25% were Nazi Party members, which was typical for their demographic). Pre-war antisemitism was prevalent in German society, and many members held antisemitic views to varying degrees. However, the unit was not specifically selected for ideological fervor, and there is no evidence of exceptional pre-war engagement in antisemitic violence or radical organizations among the majority.

  **II. Disagreements on Key Cruxes**

  We agree on the facts above but interpret them differently. Below we outline three cruxes of our disagreement, each with a concrete case or data pattern we both consider relevant and our respective positions and predictions.

  | Crux | Concrete Case/Data Pattern | Browning-style Situationist Position | Goldhagen-style Cultural-Eliminationist Position |
  |------|----------------------------|--------------------------------------|-------------------------------------------------|
  | (1) **Primary Driver of Escalation:** Does the escalation curve (increasing compliance and initiative) primarily track cumulative moral injury and peer bonding, or the activation of latent eliminationist antisemitism? | **Data Pattern:** Variation in refusal rates and initiative by company. Company 1 (under Captain Hoffmann) had higher refusal rates at Józefów than Company 2 (under Captain Wohlauf) and showed less enthusiasm in subsequent actions. Company 3 (under Captain Gnade) became known for extreme brutality and initiative. | *Position:* The escalation is best explained by situational pressures: initial horror giving way to habituation, peer bonding, and dehumanization. The variation in company behavior reflects differences in leadership style and group dynamics, not pre-existing ideological differences. *Prediction:* Units with stronger internal cohesion and more consistent leadership pressure (like Company 2 and 3) would show higher compliance and initiative, regardless of pre-war party membership rates. | *Position:* Only a deep, culturally ingrained eliminationist antisemitism can explain near-universal compliance and escalating brutality. The variation by company reflects differential activation of pre-existing antisemitic beliefs under leadership that modeled eliminationist norms. *Prediction:* Companies with higher rates of pre-war Nazi Party membership or documented antisemitic engagement would show lower refusal and higher initiative. |
  | (2) **Local-Initiative Killings:** Do local-initiative killings (like the 1941 Jedwabne pogrom by Polish neighbors) break the situational model, or can they be folded into peer-escalation dynamics under regional SS pressure during Operation Reinhard? | **Case:** The battalion's actions in Łomazy (August 1942), where they massacred Jews without explicit orders beyond the general mandate of Operation Reinhard, and where some members reportedly took initiative in brutal ways. | *Position:* Even seemingly spontaneous local initiatives occur within a context of massive situational pressure from the SS and the regime. The Łomazy massacre was part of a cascade of peer-escalation and normalization under the umbrella of Operation Reinhard. *Prediction:* Killings initiated by the battalion would correlate temporally and geographically with the presence of SS leadership and the overall momentum of the genocidal campaign. | *Position:* Local initiatives like Łomazy demonstrate that the perpetrators required no direct orders; they flowed from internalized eliminationist goals. Such actions break the situational model because they show autonomous agency. *Prediction:* Local initiatives would occur even in the absence of immediate SS oversight, reflecting the unit's internalized culture. |
  | (3) **The Meaning of 'Ordinary':** Is the term 'ordinary' purely descriptive of the men's pre-war social status and lack of exceptionality, or does it function as an exculpatory frame? | **Data Pattern:** Post-war testimonies and trials: how the men explained their actions (e.g., claiming obedience to orders, fear of punishment, or peer pressure) versus how they characterized their pre-war selves. | *Position:* 'Ordinary' is descriptive: these men were not special monsters but common citizens, which highlights the situational factors that can induce complicity. This does not excuse their actions but warns about the potential for evil in ordinary social processes. *Prediction:* Testimonies would emphasize situational pressures and minimize ideological commitment, reflecting their self-perception as ordinary men caught in extraordinary circumstances. | *Position:* 'Ordinary' is exculpatory: it obscures the fact that these men were products of a deeply antisemitic culture and made choices consistent with their beliefs. The term deflects from the cultural specificity of German antisemitism. *Prediction:* Testimonies would reveal widespread acceptance of antisemitic stereotypes and justifications even when not coerced, showing that their actions were consonant with their cultural norms. |

  **Verbal Dispute Note on Crux (3):** The dispute is partly verbal. The situationist uses 'ordinary' to mean demographically typical and not prescreened for violence; the eliminationist argues that in context, the term implies moral typicality and thus exculpation. Both agree that the men were demographically ordinary but disagree on whether that implies they were morally ordinary.

