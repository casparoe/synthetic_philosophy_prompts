  Here’s an original conceptual issue in material constitution that avoids physical destruction/reshaping and centers on *gradual, identity-preserving replacement*:

  ### **The "Symphony of Flesh" Artwork**
  **Scenario:**  
  An artist creates *Symphony of Flesh*, a dynamic sculpture composed entirely of genetically engineered, photosensitive coral. The artwork’s identity depends on its continuous biological processes (e.g., rhythmic pulsations synchronized to light). To preserve it indefinitely, conservators gradually replace dying coral cells with *synthetically grown bio-gel analogues* that perfectly mimic the coral’s structure, function, and responsiveness. Over 50 years, every original coral cell is replaced. The sculpture persists unchanged in form, behavior, and appearance.  

  **Divergence in Persistence Conditions:**  
  - **Constituent Matter (Coral Cells):**  
    Each original cell ceases to exist when replaced. The aggregate matter at T₁ (100% coral) and T₂ (100% bio-gel) shares no physical particles.  
  - **Artwork (*Symphony of Flesh*):**  
    The artwork persists if its form and function are maintained. Yet, if the *origin* of its material is essential to its identity, replacing all original biological matter with synthetic duplicates may terminate it.  

  **The Puzzle:**  
  - If the artwork is *constituted by* its matter, how can it survive complete material replacement?  
  - If it doesn’t survive, how does it differ from a perfect replica made of synthetic gel from the start?  

  ---

  ### **Resolving the Divergence: Two-Place vs. Three-Place Constitution**  

  #### **Option 1: Standard Two-Place Constitution (Form + Present Matter)**  
  *Traditional View:* Constitution is a relation between an object (defined by its form) and its *current* matter. Persistence requires continuity of form and function, not matter.  
  - **Accommodation Attempt:**  
    Redefine the artwork’s modal properties: Its persistence conditions require preserving its *dynamic form* (pulsations, responsiveness), not its original material. Thus, *Symphony of Flesh* survives total matter replacement.  
  - **Problem:**  
    This implies two identical sculptures—one originally coral-based (now synthetic) and one built from synthetic gel *ab initio*—are the same artwork. But intuitions suggest the artwork’s identity hinges on its biological *origin*; the synthetic replica lacks its history and artistic significance.  

  #### **Option 2: Three-Place Constitution (Form + Present Matter + Origin-Material)**  
  *Proposed Solution:* Constitution is a relation among **form**, **current matter**, and **origin-material**. Origin constrains persistence.  
  - **Resolution:**  
    - *Symphony of Flesh* is constituted by:  
      - **Form:** Rhythmic pulsations + light responsiveness.  
      - **Present Matter:** Coral → gradually replaced by bio-gel.  
      - **Origin-Material:** Engineered coral (essential).  
    - Once *all* origin-material is gone, the constituted artwork ceases to exist. The final synthetic structure is a distinct object (e.g., *Symphony Replica*) with identical form but different origin.  
  - **Advantages:**  
    - Explains why the artwork cannot persist through total origin-material loss.  
    - Distinguishes the original (coral-originated) artwork from a synthetic duplicate.  
    - Grounds identity in historical properties without requiring present material continuity.  

  ---

  ### **Conclusion**  
  The *Symphony of Flesh* case shows that **standard two-place constitution cannot fully resolve the divergence** because it ignores the role of origin in persistence conditions. Redefining modal properties (e.g., making persistence purely form/function-dependent) fails to capture why origin matters for the artwork’s identity. A **three-place relation** (form, present matter, origin-material) better accommodates cases where gradual replacement severs the link to the original essence, even absent physical disruption. This reframes constitution as a historically embedded process, not merely a synchronic state.
