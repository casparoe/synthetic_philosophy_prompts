prompt: |-
  I'm currently preparing a presentation for a seminar on demarcation in the humanities, and I've become preoccupied with a disagreement I had last month with a friend who works in documentary production. He argued that dismissing television franchises like Ancient Aliens as pseudohistory is merely gatekeeping, because, as he put it, every historical narrative selects and interprets fragmentary evidence through some theoretical lens, and no interpretation is uniquely forced by the data. I think he is conflating ordinary interpretive flexibility with a more systematic immunization strategy, but I want to articulate precisely where the conceptual line breaks rather than just appealing to academic authority.

  Please treat the Ancient Aliens franchise—specifically its recurring explanatory claim that monumental structures such as the pyramids at Giza required extraterrestrial engineering because ancient human societies lacked the organizational capacity—as a live case study in pseudohistory and demarcation. Analyze it through the lens of Imre Lakatos's methodology of scientific research programmes, focusing on whether the show's explanatory structure functions as a degenerating program protected by an expanding belt of auxiliary hypotheses (lost technologies, suppressed archaeological records, conspiratorial silence) rather than as a progressive program that generates novel, independently testable predictions. Then compare this structure briefly with Anatoly Fomenko's New Chronology, which similarly revises mainstream chronology through a dense auxiliary apparatus, to determine whether both cases fail for the same philosophical reason or for structurally different ones. In your analysis, identify which features of these pseudohistorical programs standard demarcation criteria capture well and which features—their commercial narrative incentives, their strategic use of evidentiary gaps, or their immunization techniques—the philosophical frameworks miss or mischaracterize. I am not looking for a bibliography, citation list, or reading recommendations; I want a conceptual diagnosis that a reader without access to external references could follow and evaluate on its own terms.
