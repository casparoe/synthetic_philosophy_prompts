answer: |-
  ### 1. Kelly Rule for Repeated Multiplicative Gambles  
  **Translation**: In a fluctuating environment with multiplicative growth (e.g., reproductive success per generation), maximizing expected log wealth (Kelly) is equivalent to maximizing the long-run stochastic growth rate of log population size. This policy's wealth almost surely exceeds any other's by an unbounded factor, analogous to a rare invading lineage with higher geometric mean fitness dominating the population. "Optimal" here aligns with the **long-run growth rate of a typical surviving lineage**, ensuring it outcompetes others under the invasion criterion. The normative claim (what a rational agent should do) maps to the descriptive evolutionary outcome: the lineage adopting this strategy prevails.  

  **Resistance**: The translation assumes no absorbing extinction boundaries. In ecology, demographic stochasticity can cause extinction even for a lineage with positive growth rate, violating the "almost sure" dominance. Kelly assumes continuous wealth (no discrete individuals), while ecology's extinction boundary introduces a gap: optimality in betting ignores demographic stochasticity. The normative/descriptive distinction survives (rational agent ≈ winning lineage), but "optimal" is only about lineage dominance, not individual survival under extinction risk.  

  ---  

  ### 2. Ergodicity Critique: Ensemble vs. Time Averages  
  **Translation**: Expected-value maximization optimizes the arithmetic mean (ensemble average) of population size, but population growth is multiplicative and governed by the time average of log growth rates. The log rule optimizes this time average, which is the long-run stochastic growth rate. Rationality lands on the **geometric mean fitness** (or typical-lineage growth rate), as it determines actual growth. The critique is that arithmetic expectation is misaligned with what evolves—lineages maximizing time-averaged log growth dominate.  

  **Resistance**: The translation holds for i.i.d. environments but fails with autocorrelation. In autocorrelated environments, the long-run growth rate depends on environmental sequences (e.g., red noise), not just the per-period geometric mean. The ergodicity argument assumes stationarity, but autocorrelation breaks this, making the critique **trivially false** in non-i.i.d. cases. "Optimal" remains about lineage dominance, but the ensemble/time distinction collapses when environments are structured.  

  ---  

  ### 3. Fractional Betting: Uncertainty and Asymmetry  
  **Translation**: Betting a fraction (e.g., half-Kelly) is conservative bet-hedging. Reasons translate directly:  
  - *Uncertainty about edge/model risk*: Environmental uncertainty (e.g., misestimated fitness variance).  
  - *Asymmetry of being wrong*: Overestimating fitness risks extinction (absorbing boundary), while underestimating only reduces growth. This corresponds to reducing variance to avoid extinction, trading off arithmetic mean growth for survival—a form of **conservative bet-hedging**.  

  **Resistance**: The asymmetry argument translates perfectly (extinction vs. slow growth). However, "model risk" is epistemic (agent's uncertainty), while ecology treats environmental stochasticity as aleatoric (known distributions). This epistemic gap resists: ecology lacks a concept of **misestimated parameters** in adaptive strategies. Normative prudence (betting less) maps to evolved bet-hedging, but "optimal" here is about one lineage's survival, not population dominance.  

  ---  

  ### 4. Geometric Rationality Across Worlds/Dimensions  
  **Translation**: Maximizing the probability-weighted geometric mean across "worlds" (environmental states) is identical to maximizing geometric mean fitness (long-run growth). However, extending this to "incommensurable value dimensions" (e.g., survival vs. fecundity) has no ecological equivalent. Ecology reduces all dimensions to fitness via multiplicative trade-offs (e.g., survival × reproduction), so geometric mean over dimensions is implicit in geometric mean fitness. Rationality lands on **geometric mean fitness**, but only for environmental states—not for non-fitness dimensions.  

  **Resistance**: The "possible worlds" translation works, but "incommensurable dimensions" **fails entirely**. Ecology has no room for dimensions irreducible to fitness (e.g., "well-being" vs. offspring count). This is a gap in the user's vocabulary: evolution optimizes fitness alone. "Optimal" is about lineage growth, but geometric rationality's normative claim (for non-fitness dimensions) is untranslatable.  

  ### Residue Report  
  **Decision-theory → Ecology gaps**:  
  - **Model risk (epistemic uncertainty)**: No analog; ecology assumes known stochastic environments (aleatoric uncertainty).  
  - **Incommensurable value dimensions**: Untranslatable; ecology uses fitness as a common currency.  
  - **Ergodicity formalism**: Measure-theoretic details (e.g., stationarity requirements) are absent; autocorrelation breaks the i.i.d. assumption.  

  **Ecology → Decision-theory gaps**:  
  - **Metapopulation structure**: Decision theory assumes a single lineage. Metapopulations (multiple patches) make ensemble averages relevant to global persistence—**gap in original argument**, which conflates "optimal" as lineage growth vs. metapopulation survival.  
  - **Demographic stochasticity + extinction**: Kelly ignores discrete individuals and extinction risk from bad luck, not just strategy. **Gap in decision theory**: it assumes no bankruptcy, making "avoiding extinction" less central.  
  - **Frequency dependence**: Original arguments ignore frequency effects (e.g., resident-invader dynamics). This **breaks the translation** by adding competitive interactions absent in Kelly.  
  - **Autocorrelation**: Decision theory assumes i.i.d. environments, but autocorrelation decouples geometric mean fitness from long-run growth. **Gap in original argument**: log-optimality is less determinate with temporal structure.  

  ### Verdict  
  The translations succeed where decision theory aligns with evolution in i.i.d. environments (Points 1–3 for environmental states). Failures arise from **gaps in ecology** (no epistemic uncertainty or non-fitness dimensions) and **gaps in decision theory** (no structure, stochasticity, or frequency dependence). Crucially, the original arguments trade on ambiguities:  
  - "Optimal" wavers between *best-for-me* (normative, single agent) and *what-wins* (descriptive, lineage dominance). Ecology resolves this via invasion criteria.  
  - Averaging over worlds (ensemble) vs. time is ambiguous in non-ergodic systems; ecology shows autocorrelation matters.  
  The residue confirms decision-theoretic log-optimality is a **special case** of ecological growth-rate optimization—valid only under idealized conditions (i.i.d., no structure, no extinction risk). For complex environments, ecology's framework is more general, exposing where the original arguments oversimplify.
