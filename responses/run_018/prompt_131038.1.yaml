  I'll build tension through sensory details: the weight of the parchment, the flickering candle, the approaching deadline. The climax comes when Lady Lyra hears both meanings simultaneously - the official praise and the private accusation. Her subtle reaction (a slight breath, paling complexion) shows she's understood the double message.

