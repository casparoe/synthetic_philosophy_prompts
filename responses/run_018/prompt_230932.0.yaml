answer: |-
  Here’s a case where the attitudinal and felt-quality views diverge:

  ### The Case: The Exhausted Marathon Runner  
  **Scenario:** A seasoned runner completes a grueling marathon. In the final mile, her body is in agony—muscles burning, lungs searing, joints throbbing. The physical sensations are overwhelmingly painful and exhausting, with no discernible "positive" feeling. Yet, as she crosses the finish line, she feels a profound sense of accomplishment. She *wills herself* to embrace the pain because it signifies achieving her goal. She values the state of "having pushed through" and holds a deeply favorable attitude toward her effort and its outcome.  

  ---

  ### **Verdicts of the Two Views:**  
  1. **Attitudinal View → Classifies as Pleasure**  
     - The runner has a strong *pro-attitude* toward the experience: she affirms the pain as meaningful and desirable *because* it embodies her achievement. Her attitude ("I am glad this is happening; it represents success") makes the episode pleasurable *for her*, regardless of sensory qualities.  

  2. **Felt-Quality View → Denies it is Pleasure**  
     - The episode lacks a distinctive "pleasure feel." The dominant phenomenal qualities are exhaustion and physical suffering, with no shared hedonic tone (e.g., warmth, contentment, or euphoria). Even satisfaction is cognitive, not sensory. Thus, it fails to exhibit the unitary phenomenal character required for pleasure.  

  ---

  ### **Assessment: Which Verdict Fits Lived Experience?**  
  **The attitudinal view better captures the runner’s experience.** Here’s why:  
  - **Psychological Reality:** Humans often describe such experiences as "painful but deeply satisfying." The runner *endorses* her suffering *as* rewarding—a mental stance central to her self-conception. Calling this "pleasure" (e.g., "I take pleasure in having endured") aligns with everyday language.  
  - **Phenomenal Complexity:** The felt-quality view struggles with cases where cognitive appraisal (*attitude*) overrides raw sensation. Here, the "pleasure" arises from the *meaning* of the pain (triumph), not its sensory profile. Denying this is pleasure ignores how subjects *interpret* their experiences.  
  - **Avoiding Conflation:** The runner’s report ("It hurt terribly, but I wouldn’t trade it") separates *valuation* (attitude) from sensation. The attitudinal view respects this: pleasure resides in her affirmation, not the pain itself.  

  **Caveat:** The felt-quality view is not without merit—physical agony *does* lack hedonic "feel." But reducing pleasure to mere sensation overlooks how *evaluative stances* transform experiences. In this case, the runner’s pro-attitude *constitutes* her pleasure, even amid suffering.  

  ---

  ### Key Distinction Maintained:  
  - **Pleasure ≠ Value/Prudence:** The runner’s experience may be *valuable* to her (fulfilling a goal) and *prudent* (building resilience), but this assessment is separate from whether it is *phenomenally pleasurable*. The attitudinal view identifies it as pleasure due to her endorsement; the felt-quality view denies it on sensory grounds. Only the former reflects the subject’s lived reality.  

  > **Conclusion:** The attitudinal view better accommodates cases where "pleasure" stems from cognitive affirmation rather than sensory quality. The marathoner’s achievement highlights that pleasure is often an *attitude toward an experience*, not an inherent feel.
