answer: |-
  Here's a breakdown of your question about the meaning of "liberal" across the Atlantic:

  **1. The Sneaky Assumption (2-3 sentences):**
  Your question assumes there's a single, fixed, "true" definition of liberalism that Europeans preserved, implying the American usage is an illegitimate hijacking. This overlooks the fundamental reality that **political terms are not static museum pieces; their meanings constantly evolve through historical context, political struggle, and cultural adaptation.** Neither continent holds the exclusive claim to the "real" definition.

  **2. How Both Sides Actually Drifted (4-5 sentences):**
  *   **In the US:** The shift began in the late 19th/early 20th century. Progressive reformers and later New Dealers, battling powerful industrial trusts and seeking social safety nets, embraced "liberal" to signify government action to *liberate* people from poverty, market failures, and social injustice. They consciously contrasted this with "conservative" defenders of laissez-faire economics, gradually transforming the term's core meaning domestically.
  *   **In Europe:** While "liberal" parties (like the UK Lib Dems or Germany's FDP) often maintained a stronger classical liberal focus on limited government and free markets, they were not static. Crucially, **mass socialist and social democratic parties emerged as the dominant force advocating for state intervention and welfare.** This pushed the term "liberal" towards the center-right in many European party systems, preserving its market emphasis but making it distinct from the ascendant left.

  **3. The Scandinavian/Ordoliberal Wrinkle (3-4 sentences):**
  The "Europe = purely classical liberal" map crumbles when you look closer. In countries like **Denmark and Norway, "Venstre" (literally "Left") are the main *center-right, agrarian-turned-liberal, pro-market parties*** – they aren't progressive/interventionist. More significantly, **Germany's "Ordoliberalism"** (influencing the FDP and CDU) actively champions a *social market economy* – a clear rejection of pure laissez-faire. It argues the state must create a strong legal and institutional *framework* (Ordnung) to ensure markets function fairly and serve society, demonstrating a distinct European blend of liberalism and state responsibility.

  **4. Bottom Line (1-2 sentences):**
  Asking "who stole the word" or "who owns the real definition" is the wrong question. **Political terminology evolves organically within specific historical and political contexts; neither usage is inherently more "authentic" than the other.** The useful approach is understanding what "liberal" *means* within its specific national or regional political discourse at any given time.
