answer: |-
  Here's a breakdown of the conceptual machinery you need, focusing on the core tensions in lesser-evil voting:

  **1. Dissolving "Selection vs. Endorsement"?**

  *   **The Ideal Separation:** Instrumental voting aims for pure *selection*: choosing the candidate whose *net outcome* (considering all policies, probabilities, and likely harm reduction) is least bad. Expressive voting is seen as *endorsement*: affirming values or specific policies embodied by the candidate.
  *   **The Pressure Point:** The distinction collapses under significant moral constraint violations because:
      *   **The Act Itself:** Casting a vote is a performative act within a public system. Its *social meaning* is often interpreted as endorsement of the *entire package* presented by the candidate/party, regardless of private intent. Your vote is counted the same way as a supporter's.
      *   **Causal Contribution:** Even with pure instrumental intent, your vote *enables* the candidate to win and implement *all* their policies. You become part of the causal chain for *every* action they take, good *and* bad. You functionally authorize their entire platform.
      *   **Implicit Sanction:** By selecting Candidate A (with bad policy X) over Candidate B (with bad policy Y), you signal that Policy X is *acceptable* or *less unacceptable* in the context of this choice. This can normalize Policy X, even if you privately abhor it.
      *   **The "Bracketing" Problem:** Can you mentally "bracket" the bad policy? Perhaps, but the *consequences* of your vote aren't bracketed. The candidate wins and implements the bad policy *because* of the coalition of voters, instrumental and expressive, that put them in power. You are part of that enabling coalition.

  **2. Complicity Thresholds: When Does "Lesser Evil" Become Complicity?**

  *   **The Core Issue:** This asks: At what point does the instrumental benefit of reducing harm (Y) become outweighed by the moral cost of enabling harm (X), even if X is *lesser* than Y? Complicity arises when your action contributes to wrongdoing.
  *   **Key Factors Defining the Threshold:**
      *   **Severity & Nature of the Harm (X):** Is X a fundamental violation of core justice (e.g., systematic rights violations, enabling genocide, dismantling democracy itself)? Enabling *grave evils*, even as the "lesser" option, carries heavier complicity weight than enabling minor policy disagreements.
      *   **Inevitability & Centrality:** Is the enactment of Harm X a *core, guaranteed* part of the candidate's platform, or a peripheral, unlikely possibility? Voting for a candidate whose victory *assuredly* leads to grave harm X makes direct complicity harder to avoid.
      *   **Causal Proximity:** How directly does your vote contribute to enabling Harm X? In a close election, your vote's causal role is higher than in a landslide. However, the collective action problem means *every* vote in the winning coalition shares responsibility.
      *   **Alternatives:** Are there viable alternatives to voting for the lesser evil? (e.g., Protest vote? Abstention? Organizing outside the system?). The perceived *necessity* of the lesser-evil choice affects the complicity calculus. If alternatives exist to avoid enabling *any* grave harm, complicity might be clearer.
      *   **Intent vs. Outcome:** While instrumental intent matters *morally for the voter*, it doesn't negate the *outcome* of enabling harm. Complicity often hinges on foreseeable consequences of actions, not solely intent. If you foresee Harm X as a direct result of your vote, complicity arguments gain traction.

  **3. Duty to Vote vs. Duty to Avoid Complicity: The Conflict & Resolution**

  *   **The Conflict:** The duty to vote (often grounded in civic responsibility, preserving democracy, preventing the worst) seems to *demand* voting for the lesser evil when the alternative is catastrophic. The duty to avoid complicity in grave wrongdoing seems to *forbid* enabling a candidate who will commit such wrongs, even if "lesser."
  *   **Resolving the Tension (No Easy Answers):**
      *   **Consequentialist Primacy:** The duty to prevent the *greater overall harm* (Y) overrides complicity concerns with the lesser harm (X). The moral imperative is to minimize net suffering/injustice. Complicity is an unavoidable cost of responsible harm reduction in a flawed system.
      *   **Deontological Limits:** Certain harms (X) are absolutely impermissible to enable, regardless of consequences. Voting for a candidate who *will* enact such a harm violates a categorical duty, even if it prevents a *greater* harm (Y). Abstention or protest becomes the only non-complicit option.
      *   **Threshold Deontology:** Combines the above. There is a duty to avoid complicity in *core* injustices. However, if the *alternative* (Y) involves an even *more fundamental* violation or existential threat, the duty to prevent that catastrophe *can* override the complicity prohibition for the lesser evil (X). This defines the "complicity threshold" mentioned earlier.
      *   **Reconceiving the Duty to Vote:** Perhaps the duty isn't simply to *cast a ballot*, but to vote *responsibly* or *in good conscience*. If voting for *any* viable candidate requires complicity in grave injustice, the duty might be fulfilled by abstaining *as a form of protest* against the unacceptable choices, or by pursuing other civic actions more vigorously. The duty is to engage ethically, not mechanically.

  **A Stable Principle? Justification vs. Rationalization**

  *   **The Challenge:** A perfectly stable, universally applicable principle is elusive due to context-dependency (specific harms, candidates, electoral systems). However, we can formulate a guiding framework:
  *   **A Proposed Framework:**
      1.  **Identify the Core Harms:** Define the most serious, likely harms (X and Y) each candidate would cause/allow. Focus on fundamental rights, democratic integrity, severe suffering.
      2.  **Assess the Gap:** How significant is the difference in expected net harm between X and Y? (Is Y truly catastrophic while X is merely bad? Or are both catastrophic, just in different ways?)
      3.  **Evaluate Complicity:** For Harm X (the lesser evil's harm): Is it a *grave, core injustice*? Is it *central and inevitable* if they win? Is your vote *causally significant* (or part of a clearly enabling coalition)?
      4.  **Consider Alternatives:** Are there non-complicit ways to resist Harm Y that are viable and effective? (Often, realistically, no).
      5.  **The Justification Test:** Voting for the lesser evil is **justified** if:
          *   The difference in expected harm (Y vs. X) is *extremely large* (preventing catastrophe).
          *   Harm X, while bad, does *not* cross a threshold of *absolutely impermissible complicity* (e.g., it's a severe policy failure, not a fundamental rights violation you directly enable).
          *   There are *no viable non-complicit alternatives* to prevent the greater harm (Y).
      *   **The Rationalization Test:** It risks being **rationalized complicity** if:
          *   The difference between X and Y is marginal or speculative.
          *   Harm X involves enabling *fundamental injustices* (systematic rights violations, democratic backsliding) that you find morally absolute.
          *   Alternatives like strategic abstention (to deny legitimacy) or robust extra-electoral resistance are viable (even if difficult).

  **In essence:** Bracketing the bad parts is psychologically possible but normatively weak. The act of voting *does* functionally endorse/enable the whole package. Complicity thresholds depend on the severity, centrality, and inevitability of the harm enabled versus the harm averted. The duty to vote conflicts with the duty to avoid complicity when all choices involve grave wrongdoing; resolution depends on whether preventing the *greater catastrophe* can override the complicity in the *lesser* one, or if the lesser evil's harm itself crosses an absolute moral line. Justification hinges on the magnitude of the harm differential and the nature of the complicity involved.
