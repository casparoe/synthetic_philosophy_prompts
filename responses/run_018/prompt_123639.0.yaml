answer: |-
  Here's the distilled spec sheet for a normative theory of collective memory vs. historical record conflict, built to your requirements:

  **Core Desiderata (What the Theory MUST Deliver):**

  1.  **Epistemic Responsibility:** Must uphold that *some* claims about the past are objectively false (e.g., Holocaust denial, grossly inaccurate casualty figures in documented atrocities). Cannot descend into total relativism where all narratives are equally "true." *(Non-negotiable. Foundation for distinguishing history from fabrication.)*
  2.  **Harm Principle Engagement:** Must provide principled criteria for when *withholding or delaying* factually accurate historical information is permissible (or even obligatory) to prevent severe, imminent, and tangible harm (e.g., publishing mass grave locations *during* active ethnic tensions). *(Non-negotiable. Reality demands this calculus.)*
  3.  **Identity Preservation:** Must recognize that collective memory, even when factually inaccurate in parts, can be constitutive of group identity, social cohesion, and resilience (e.g., foundational myths of origin, narratives of heroic resistance against oppression). Erasure can be violence. *(Non-negotiable. Social reality.)*
  4.  **Rejection of Denialism:** Must clearly distinguish between legitimate mnemonic sovereignty and state-sponsored or culturally enforced denialism of established facts, especially concerning atrocities or systemic injustice (e.g., Turkey & Armenian genocide, Japan & WWII atrocities). *(Non-negotiable. Cornerstone of anti-fascism/anti-authoritarianism.)*
  5.  **Distinction Preservation:** Must rigorously maintain the lines between:
      *   **Correcting Error vs. Erasing Identity:** Correcting a date ≠ dismantling a community's core narrative of survival. Requires granularity.
      *   **State-Mandated Forgetting (e.g., amnesty laws, banned topics) vs. Organic Cultural Amnesia (e.g., traumatic events fading naturally):** One is coercive power, the other is psychosocial process.
      *   **Mnemonic Sovereignty (e.g., Indigenous oral histories shaping their own education) vs. Denialism:** Sovereignty claims interpretive authority *within* an experience; denialism rejects external evidence *about* that experience. *(Non-negotiable. Failure here collapses complexity.)*
  6.  **Group Cognition Grounding:** Must account for how collective memory *actually functions*: transmitted through ritual, iconography, education, media; shaped by power structures; reinforcing group bonds; subject to "chosen traumas" and "chosen glories"; *not* simply aggregated individual recall. *(Non-negotiable. Theory must fit the phenomenon.)*

  **Must-Get-Right Cases:**

  7.  **Factually Wrong but Socially Vital:** (e.g., A minority group's slightly embellished narrative of a pivotal resistance event that fosters unity and resilience against ongoing marginalization, even if archival records show a less dramatic sequence). Theory must permit *retention* of the narrative's *social function* while acknowledging the factual discrepancy, without demanding full public repudiation.
  8.  **Accurate but Harmful to Publish:** (e.g., Archives revealing names of informants against an oppressive regime whose families are still vulnerable in a fragile state; detailed forensic reports on recent mass sexual violence that could re-traumatize communities and impede reconciliation *if disclosed prematurely/in certain ways*). Theory must allow for *temporary suppression* or *controlled/contextualized disclosure* based on harm assessment.
  9.  **Conflict Over Salience/Meaning, Not Fact:** (e.g., Statue removal debates: Both sides agree *when* the figure lived and *what* they did, but fiercely dispute whether those actions should be primarily celebrated as foundational or condemned as oppressive. Archives provide facts, not valuations). Theory must adjudicate disputes over *interpretation* and *commemoration*, not just truth-value.

  **Potential Camp Preferences (Areas for Legitimate Theoretical Disagreement):**

  10. **Weighting of Sovereignty vs. Correction:** How heavily should a community's right to control its *own* narrative (mnemonic sovereignty) weigh against the obligation to correct factual errors *within* that narrative? (Especially critical for marginalized groups vs. dominant groups whitewashing history).
  11. **Scope of "Harm":** How broad is the harm that justifies suppression? (Only physical violence? Psychological trauma? Social destabilization? Damage to national pride?).
  12. **Agent of Correction/Suppression:** Who decides? State bodies? Independent commissions? Academic consensus? Affected communities themselves? (Leans on political theory).
  13. **Role of the State:** Is the state primarily a neutral arbiter, a guardian of plural narratives, a promoter of a single "national history," or obligated towards restorative justice via memory?

  **Key Jointly Unsatisfiable Pairs:**

  *   **Unrestricted Mnemonic Sovereignty & Epistemic Responsibility:** If a community's narrative right includes insisting on demonstrably false claims as core truths *within the public sphere*, it violates epistemic responsibility. Sovereignty over internal meaning ≠ sovereignty over factual claims.
  *   **Harm Minimization (Absolute) & Truth-Telling (Absolute):** You cannot always both tell the complete factual truth *immediately* and *always* prevent severe harm. Trade-offs are inherent (Case #8).
  *   **Pluralistic Narrative Equality & Rejection of Denialism:** Treating all narratives as equally valid (a common liberal-pluralist ideal) collapses when one narrative is denialist. You *must* adjudicate, violating pure pluralism.
  *   **Structured Forgetting as Reparation & Epistemic Responsibility:** Deliberately suppressing truths (even for peace/building a new identity) inherently violates the obligation to acknowledge factual reality, especially concerning victims' experiences.

  **The Liberal-Pluralist Killer Requirement:**

  *   **Epistemic Responsibility combined with Rejection of Denialism.** Most liberal-pluralist approaches prioritize narrative plurality and sovereignty but stumble badly when confronted with communities wielding sovereignty to propagate demonstrable falsehoods or denialism (e.g., certain nationalist myths, genocide denial within a community). This requirement forces the theory to *take sides* against specific narratives, violating the core pluralist instinct to avoid hierarchy among community claims. It demands that "respect" has limits defined by factual reality.

  **Regarding "Structured Forgetting" (e.g., Post-Conflict):** Squaring this with correction is the hardest nut. A serious theory *might* permit it only under strict conditions: temporally bounded, part of a formal peace/reconciliation process, focused on specific *individual* culpability rather than *factual* events, accompanied by mechanisms for eventual truth-telling (archiving, future education plans), and *never* applied to the denial of victimhood or systemic crimes. It remains a profound tension with Epistemic Responsibility.

  **Summary Non-Negotiables:** Epistemic Responsibility, Harm Principle, Identity Preservation, Rejection of Denialism, Distinction Preservation, Group Cognition Grounding. The core tension resides in balancing Sovereignty (#10) with Correction (driven by #1 & #4), especially under the shadow of potential Harm (#2). The requirement that **knocks out simplistic liberal-pluralism is the non-negotiable combination of Epistemic Responsibility and Rejection of Denialism.**
