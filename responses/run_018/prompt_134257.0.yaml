  I am writing a two-page proposal for a self-directed six-month philosophy project, with no institutional backing, and I need the framing sharpened. The topic: whether "Western values" denotes a coherent category or functions as a rhetorical boundary-marker whose extension shifts with context. Rather than rehearsing standard essentialist lists (democracy, human rights, secularism) or the standard debunking move (that the phrase is merely imperialist camouflage), I want to investigate what I am calling axiological gerrymandering: the practice of including or excluding specific commitments—individual autonomy, welfare-state obligations, free-expression norms, religious heritage—depending on whether the speaker is defending liberal internationalism, restricting immigration, or attacking multiculturalism. The proposal should state the precise research question (is there any non-arbitrary, context-invariant core to "Western values," and if not, what functional rules govern its deployment?), explain why existing political-philosophy debates leave it open (they defend particular values on universalist grounds without examining the geographic framing, or they reject the framing without analyzing its internal variability), describe the method (a conceptual analysis of three recent high-profile discursive contexts—democratic-backsliding rhetoric, migration-policy debate, and critiques of progressive culture—tracking which values are included or excluded and testing whether the selection criteria remain consistent across cases), specify what success and failure look like (success: either a reconstructed minimal core that is genuinely distinctive, or a precise functional taxonomy of the phrase's rhetorical rules; failure: total collapse of the category coupled with an inability to identify any stable deployment pattern), and assess whether this is realistic for six months of solo work. Do not include bibliographies, reading lists, or citation requests; I will supply references. After the proposal, provide a brief structured summary in JSON with exactly these fields: "core_question", "method_in_brief", "success_criterion", "failure_criterion", "scope_assessment", "niche_angle".
