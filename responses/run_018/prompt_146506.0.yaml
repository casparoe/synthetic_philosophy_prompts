answer: |-
  ## Research Proposal: Structural Fragmentation in Indirect Normativity: Can Idealization Survive Domain-Specificity?

  **Abstract:** Indirect normative theories (e.g., certain forms of internalism, ideal advisor theories) define reasons or obligations via the hypothetical choices of an idealized version of the agent. The standard debate centers on whether such theories collapse into direct normativity or remain empty under idealization. This proposal shifts focus to a neglected structural question: does *indirect normativity inherently require a single, globally unified idealized agent* governing *all* practical domains (moral, prudential, epistemic), or can it accommodate *domain-fragmented idealization*, where distinct, domain-specific idealized selves provide normative guidance? I argue existing discussions implicitly assume unity without justification. This project will employ conceptual analysis to examine constraints on idealization (coherence, information, affect) within separate domains, assess the viability of fragmentation, and determine whether fragmentation preserves indirectness or reduces it to a cluster of direct theories. The deliverable is a taxonomy of fragmentation types and a criterion for genuine indirectness under fragmentation, clarifying a fundamental structural commitment of indirect approaches.

  **1. Introduction: The Problem of Structural Unity in Indirect Normativity**
  Indirect normativity (IN) offers a compelling structure for grounding reasons: an agent S ought to φ iff an idealized counterpart of S (S+) would advise S to φ under conditions of full information, rational coherence, and perhaps affective stability. This framework promises objectivity without externalism and action-guidance by linking norms to the agent’s potential perspective. However, the dominant critiques focus on the *content* or *viability* of idealization: does specifying S+ inevitably import direct normative standards (collapsing IN into direct normativity), or does leaving S+ unspecified render IN vacuous? This proposal contends that a more fundamental *structural* problem precedes these concerns: the *unity* of the idealized agent across diverse normative domains.

  Implicitly, nearly all discussions of IN (e.g., debates about "internal reasons," ideal observer theories, constitutive standards) presuppose a *single* S+ whose idealized deliberations generate reasons across *all* contexts – moral dilemmas, prudential choices about health or career, and epistemic decisions about belief formation. This global unity assumption is rarely defended; it appears as a tacit structural commitment. Yet, significant differences exist across domains: the role of impartiality in morality vs. self-interest in prudence, the nature of relevant information (factual vs. emotional), and the demands of coherence (practical consistency vs. logical entailment). This raises the **core research question:** Can IN maintain its distinctive *indirect, agent-relative structure* while employing *domain-fragmented idealization*, where the idealized agent governing moral choice (S+_moral) differs structurally (e.g., in information access, coherence requirements, affective calibration) from the idealized agent governing prudential choice (S+_prudential) or epistemic choice (S+_epistemic)?

  **2. Research Question & Significance**
  The precise research question is: **Does permitting structural differences between domain-specific idealized agents within an indirect normative framework inevitably render that framework extensionally equivalent to a cluster of distinct, direct normative theories (one per domain), or can it preserve a genuinely indirect structure while avoiding normative incoherence?** This question admits determinate answers:
  *   **Answer 1 (Extensional Equivalence):** Fragmentation implies that the justification and content of norms within each domain derive solely from domain-specific constraints and ideals, severing the essential link to a *single* agent's potential perspective. IN collapses into separate direct theories.
  *   **Answer 2 (Preserved Indirectness):** Fragmentation can maintain IN's core structure if the distinct S+_domain share a fundamental, structure-defining property (e.g., all are counterfactual developments *of the same agent S*, grounded in S's actual psychology/commitments, even if developed differently per domain).
  *   **Answer 3 (Incoherence):** Fragmentation leads to unresolvable conflicts when actions fall under multiple domains (e.g., a prudential lie) because there is no non-arbitrary meta-criterion for partitioning domains or adjudicating between conflicting S+_domain prescriptions.

  This question is significant because:
  1.  It probes a foundational, unargued presupposition of IN: global agent unity.
  2.  It challenges whether IN can accommodate the plausible claim that idealization requirements *do* differ across normative domains.
  3.  It clarifies the minimal structural commitments necessary for a theory to count as genuinely "indirect" rather than merely a disguised form of direct normativity.
  4.  It addresses potential fragmentation in practical reason itself.

  **3. Gap in Existing Literature**
  Discussions of IN typically focus on *what* idealizes the agent (information, coherence, affective states) and *how much* idealization is permissible before collapsing into directness or emptiness. Arguments concerning internal reasons often debate the connection between an agent's "subjective motivational set" and idealized reasons, again assuming a single idealized extension of that set governs all reasons. Critiques of ideal advisor theories target the specification of the advisor's properties universally. Crucially, these discussions **assume a single S+ without arguing that cross-domain unity is a *substantive normative commitment* inherent to IN, rather than merely a *convenient modeling assumption* or a *hidden structural presupposition.*** The possibility and implications of domain-specific idealization remain unexplored, leaving a gap regarding the structural flexibility and coherence conditions of IN itself.

  **4. Methodology: Conceptual Analysis of Idealization Constraints**
  The project employs rigorous conceptual analysis:
  1.  **Domain Isolation:** Analyze the core constraints defining idealization within three distinct domains:
      *   **Moral:** Focus on impartiality, universalizability, sensitivity to others' interests, specific information requirements (e.g., others' subjective states). Coherence likely demands consistency in universalizable maxims.
      *   **Prudential:** Focus on coherence of preferences over time, instrumental rationality, self-knowledge, information relevant to the agent's own well-being. Coherence demands consistency with the agent's own (idealized) conception of their good.
      *   **Epistemic:** Focus on logical consistency, evidential support, sensitivity to truth-conduciveness, full relevant factual information. Coherence demands logical entailment and probabilistic consistency.
      *   *Key Focus:* How do requirements for "full information," "rational coherence," and "affective stability" (e.g., calmness vs. empathetic engagement) *differ* meaningfully across these domains?
  2.  **Fragmentation Viability Assessment:** Examine whether constructing distinct S+_domain agents, each idealized according to domain-specific constraints derived from step 1, is conceptually coherent within the IN framework. Can these agents still be meaningfully understood as idealized versions *of the same original agent S*?
  3.  **Structural Preservation vs. Collapse Argument:** Determine if the fragmented framework:
      *   **Preserves Indirectness:** By retaining the core idea that norms are fixed by *S's own* counterfactual, improved perspective(s), even if plural. This requires identifying a unifying structural feature (e.g., all S+_domain are developmental extensions of S's actual capacities/commitments).
      *   **Collapses into Directness:** If the domain-specific constraints *fully determine* the content of norms within that domain independently of any essential reference to S's actual perspective, making the "idealization" label merely vestigial.
      *   **Leads to Incoherence:** If domain boundaries are vague or overlapping, leading to contradictory prescriptions from different S+_domain for the same act, with no principled way for S to resolve the conflict within the IN framework itself.
  4.  **Deciding Considerations:** The choice between the main conclusions (Preserved Indirectness vs. Extensional Equivalence/Incoherence) hinges on:
      *   Whether a *necessary connection* exists between the distinct S+_domain and the *original agent S's actual constitutive features* (e.g., S's core cares, capacities, or pre-theoretical commitments) that transcends domain-specific development.
      *   Whether the normative authority of S+_domain prescriptions *derives solely* from the domain-specific idealization constraints (favoring collapse) or *also* from their status as *S's own* idealized viewpoint(s) (favoring preserved indirectness).
      *   The feasibility of defining non-arbitrary, non-question-begging domain boundaries.

  **5. Expected Deliverable**
  The primary deliverable will be a paper providing:
  1.  A **taxonomy of fragmentation types** (e.g., *information-only*, *coherence-only*, *full-structural* fragmentation across domains).
  2.  A **criterion for genuine indirectness under fragmentation**: A clear articulation of the necessary and sufficient structural conditions that a fragmented IN theory must meet to avoid collapsing into a set of direct domain-specific norms or incoherence (e.g., the S+_domain must be *anchored developmentally* to S's actual, non-idealized standpoint in a specific, non-trivial way).
  3.  A **definitive conclusion** answering the research question: either demonstrating how fragmentation can preserve IN's core structure, or arguing that fragmentation entails collapse/incoherence, revealing global unity as a non-negotiable structural commitment of IN.

  **6. Scope and Feasibility**
  This project is tractable for a single semester (e.g., as a dissertation chapter prospectus or workshop paper) because it:
  *   Focuses on a *specific structural problem* (domain fragmentation) within a *defined framework* (indirect normativity).
  *   Limits analysis to *three core domains* (moral, prudential, epistemic) as representative cases.
  *   Employs established philosophical methodology (conceptual analysis).
  *   Aims for a *taxonomy and criterion* rather than a comprehensive theory of normativity.

  However, the project **explicitly limits its scope and risks failure if it overextends:**
  *   It **does not attempt** to solve the grand metaphysical problem of normative unity across all practical domains. It asks whether *indirect normative frameworks specifically* can accommodate fragmentation *without losing their defining structural feature*.
  *   It **does not provide** a fully developed fragmented IN theory or resolve all first-order normative disputes within domains.
  *   The risk lies primarily in the complexity of the conceptual analysis and the potential difficulty in definitively ruling out all forms of preserved indirectness under fragmentation, or conversely, in conclusively demonstrating collapse without presupposing direct norms. Success hinges on rigorously applying the proposed criterion derived from the core structure of IN.

  **7. Conclusion**
  By interrogating the implicit assumption of a unified idealized self, this project addresses a foundational structural commitment within indirect normativity. Analyzing whether domain-fragmented idealization is possible without collapsing into directness or incoherence will provide crucial clarity on the nature, flexibility, and limits of indirect normative frameworks. The resulting taxonomy and criterion for genuine indirectness will offer a valuable tool for evaluating and developing IN theories. [Specific references to key works on ideal advisor theories, internal reasons, constitutive standards, and domain-specific normativity will be included in the final paper.]
