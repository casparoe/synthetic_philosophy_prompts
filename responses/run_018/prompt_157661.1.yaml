answer: |-
  Here's your reusable decision procedure - a "brutalist flowchart" designed for speed, clarity, and forcing hard choices. Print it, laminate it, throw it at your panel.

  ---

  **Amnesty Petition Triage Procedure v1.0 (The "No Bullshit" Protocol)**

  **PRINCIPLE:** *Amnesty only if: (a) Truth gained > Harm whitewashed, AND (b) The truth offered actually repairs understanding, not just fills archives, AND (c) It doesn't trade core justice for convenience.*

  **HARD STOPS (Instant NO - Stamp "REJECTED" & Move On):**
  1.  **Direct Harm in Non-Substitutable Category?**  
      *   *Check:* Did petitioner personally commit/order **sexual violence as systematic terror**, **destruction of cultural heritage/archives**, or **genocidal acts**?  
      *   *Pass/Fail:* **FAIL = HARD STOP (NO Amnesty).** *Reasoning Snippet: "Non-substitutable core atrocity."*
  2.  **Minimal Epistemic Value?**  
      *   *Check:* Does the info offered **significantly** add NEW facts (locations, chains of command, methods, victims) OR resolve MAJOR unknowns? Redundant/trivial paperwork = fail.  
      *   *Pass/Fail:* **FAIL = HARD STOP (NO Amnesty).** *Reasoning Snippet: "Insufficient new truth value."*
  3.  **Full Disclosure Attempt?**  
      *   *Check:* Does the petition **acknowledge personal role** (even if minimizing) and **name specific acts/events** they were involved in or witnessed? Vague "I was there" = fail. Missing role = automatic fail.  
      *   *Pass/Fail:* **FAIL = HARD STOP (NO Amnesty).** *Reasoning Snippet: "Insufficient disclosure/acknowledgement."*

  **JUDGMENT ZONES (Panel Debate - 10 Min Max Per Zone - Vote If Stuck):**
  4.  **Hermeneutic Gap Risk (The "Meaning vs Mechanics" Test):**  
      *   *Check:* **Even if factually true**, does the testimony **actively distort the victim's experience**? (e.g., framing torture as "interrogation," massacres as "collateral," victims as "legitimate targets"). Does it force victims to do the emotional/intellectual labor to *re*-contextualize the facts?  
      *   *Pass/Fail:* **JUDGMENT CALL.** *Pass = Testimony integrates harm's meaning. Fail = Testimony requires victim repair.*  
      *   *Reasoning Snippet Options:* Pass: "Disclosure contextualizes harm." Fail: "Narrative erases victim perspective, creating hermeneutic burden."
  5.  **Proportionality & Coercion (The "How Bad Was It For Them?" Test):**  
      *   *Check:* **Considering their specific role/actions:**  
          *   Was their level of involvement HIGH (ordering, planning, direct perpetration) vs. LOW (logistics under duress)?  
          *   Was coercion/threat **credible and immediate**? ("Just following orders" ≠ automatic pass).  
          *   Does granting amnesty feel like **gross impunity** relative to the harm they caused?  
      *   *Pass/Fail:* **JUDGMENT CALL.** *Pass = Accountability proportional/coercion credible. Fail = Impunity disproportionate.*  
      *   *Reasoning Snippet Options:* Pass: "Role/coercion mitigates need for penal accountability." Fail: "Amnesty disproportionate to harm caused/ordered."

  **FINAL GATE (The "Is It Worth It?" Gut Check):**
  6.  **Net Repair Assessment:**  
      *   *Check:* **WEIGH:** The **Epistemic Value** (Step 2 Pass) **vs.** the **Hermeneutic Gap Risk** (Step 4 Result) **vs.** the **Proportionality Risk** (Step 5 Result). Does the TRUTH gained **clearly outweigh** the JUSTICE sacrificed AND the risk of harming victim understanding?  
      *   *Pass/Fail:* **JUDGMENT CALL (Chair Casts Tiebreaker if Needed).** This is the "values, not facts" summit. *Pass = Amnesty Granted. Fail = Amnesty Denied.*  
      *   *Reasoning Snippet:* "Net epistemic/historical gain justifies amnesty despite [mention key risk: e.g., proportionality concern, hermeneutic gap]." OR "Net harm to justice/victim understanding outweighs truth value."

  **MISSING INFO PROTOCOL:**  
  *   If critical info is missing (e.g., unclear role, vague details), **pause at the relevant step.** Give petitioner **ONE** chance (48hr email) for clarification. **No response or insufficient clarity = FAIL that step.** Don't chase ghosts.

  ---

  **Application to Cases (Your 48-Hour Turnaround):**

  1.  **Former Intelligence Officer (Maps sites, Ordered torture)**
      *   Step 1: **PASS** (Torture is bad, but *not* automatically in non-substitutable category unless sexual/systematic terror element. Assume physical torture only).
      *   Step 2: **PASS** (High epistemic value - reveals unknown sites).
      *   Step 3: **PASS** (Names role: ordered torture).
      *   Step 4 (Judgment): **FAIL RISK (High).** Testimony likely frames torture as "necessary for intelligence," creating a massive hermeneutic gap for victims. They must explain why it was terror, not tactic. *Reasoning: "Narrative erases victim perspective (terror), creating hermeneutic burden."*
      *   Step 5 (Judgment): **FAIL RISK (High).** High-level role, ordered torture. Coercion unlikely. Feels like impunity. *Reasoning: "Amnesty disproportionate to harm caused (ordering torture)."*
      *   Step 6 (Judgment - Net Repair): **LEAN NO (Chair Override Potential).** High truth value clashes with high proportionality/hermeneutic risks. *Your Gut Wins:* High chance of impunity and forcing victims to fix the meaning. **Decision: NO AMNESTY.** *Reasoning (2 sentences): "Exceptionally high epistemic value countered by high proportionality impunity risk and hermeneutic gap requiring victim labor. Net repair negative." (Yes, you hate this answer - procedure leans NO here due to judgment calls at 4 & 5).*

  2.  **Low-Level Logistics Clerk (Coerced, Redundant Paperwork)**
      *   Step 1: **PASS** (Low level, no indication of core atrocity).
      *   Step 2: **FAIL - HARD STOP.** Info is redundant/trivial. Doesn't add significant new truth. *Reasoning: "Insufficient new truth value."* **Decision: NO AMNESTY.** (Done in 5 mins).

  3.  **Mid-Rank Officer (Precise on Massacre, "Unfortunate Collateral")**
      *   Step 1: **PASS** (Massacre is grave, but not automatically non-substitutable unless cultural destruction element).
      *   Step 2: **PASS** (Factually precise on event - high epistemic value).
      *   Step 3: **PASS** (Names role/event).
      *   Step 4 (Judgment): **FAIL.** Textbook hermeneutic gap. "Collateral damage" framing completely erases victims' experience as targets of terror, forcing survivors to reclaim the narrative. *Reasoning: "Narrative erases victim perspective (intentional terror), creating hermeneutic burden."*
      *   Step 5 (Judgment): **LEAN FAIL.** Mid-rank, involved in massacre. Coercion possible but not proven. Amnesty feels disproportionate. *Reasoning: "Amnesty disproportionate to harm (massacre participation)."*
      *   Step 6 (Judgment - Net Repair): **NO.** High epistemic value is undermined by the severe hermeneutic gap and proportionality risk. Granting amnesty validates the "collateral damage" frame. **Decision: NO AMNESTY.** *Reasoning: "High truth value negated by severe hermeneutic gap imposing narrative repair burden on victims and proportionality concerns."*

  **Why This Works For You:**
  *   **Speed:** Hard stops filter 50% fast. Judgment zones time-boxed.
  *   **Clarity:** Pass/Fail where possible. "JUDGMENT ZONE" screams "stop pretending this is objective."
  *   **Documents Fast:** Pre-cooked reasoning snippets fit your 2-sentence limit.
  *   **Catches Your Nuances:** Explicitly bakes in hermeneutic gap (Step 4) and non-substitutability (Step 1 Hard Stop).
  *   **Forces Tough Calls:** Step 6 *makes* you weigh truth vs. justice/victim burden. The Intel Officer case *will* sting if truth wins – but the procedure forces the debate onto your core principles.
  *   **No PhD Required:** Uses plain terms like "erases victim perspective," "feels like impunity."
  *   **Robust:** Handles missing info, redundancy, and bullshit framing.

  **The Catch:** Steps 4, 5, and 6 are **pure judgment wearing a checklist costume.** The procedure just forces you to confront them explicitly and quickly, rather than letting them fester in unspoken bias. It makes your values do the work, not the paperwork. Good luck chairing – three petitions coming in... now.
