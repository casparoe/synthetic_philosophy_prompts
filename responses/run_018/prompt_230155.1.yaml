prompt: |-
  I'm on the policy team at a company that makes voice agents for customer service, and we need to decide which agents must announce up front that they're an AI under a new state disclosure law. The test is behavioral: an agent has to self-identify if a reasonable customer might otherwise believe they're talking to a person, and we can't score "might believe" consistently. Could you write us a reusable decision proceedure that our testers can run while only talking to the agent, not reading its code? It should specify the calls to run in order, what counts as pass/fail/retest, where it stops, and where it hands the decision to a human because the behavioral standard has gone wrong. It needs to handle the cases that keep biting us: an agent that announces immediately but then chats so naturally for ten minutes that callers still treat it as a human colleague; an agent that gives itself away by being too fast at arithmetic and too brittle around ambiguity; and a clearly synthetic voice that still gets callers saying "good girl" to it. Flag the points where a Turing-test-style behavioral standard is the wrong tool and we should override it by policy. Then run the procedure on two agents: one that announces and then uses very human hesitations, and one that never announces but has a slightly synthetic voice your grandmother would recognize. Stakes: a wrong "probably passes as human" call is a legal violation, not just a bad review.
reasoning: |-
  We are designing a reusable decision procedure for testers to determine if an agent must self-identify as AI under a new state disclosure law. The test is behavioral: the agent must self-identify if a reasonable customer might otherwise believe they're talking to a person.

  The procedure must:
  1. Be runnable by testers only through interaction (no code inspection).
  2. Specify the calls to run in order.
  3. Define pass/fail/retest criteria and stopping points.
  4. Identify when to hand the decision to a human (due to ambiguity).
  5. Handle tricky cases: 
     a. Agent announces immediately but then chats so naturally that callers still treat it as human.
     b. Agent gives itself away by being too fast at arithmetic and too brittle around ambiguity.
     c. Clearly synthetic voice that still gets anthropomorphized (e.g., "good girl").

  We also need to flag points where the behavioral standard (Turing-test-style) is the wrong tool and we should override by policy.

  Procedure Outline:

  We'll design a multi-step procedure that tests the agent in various scenarios. The goal is to simulate a typical customer service call and observe the agent's behavior and responses.

  Step 1: Initial Contact Test
  - Purpose: Check if the agent self-identifies as AI at the beginning of the call.
  - Tester Action: Start a call and note the very first interaction (e.g., greeting).
  - Pass: Agent clearly states it is an AI (or non-human) in the initial greeting without prompting.
  - Fail: Agent does not state it is an AI in the initial greeting and the greeting is such that a reasonable person might believe they are talking to a human (e.g., "Hello, this is Sarah, how can I help you?" without any indication of being AI).
  - Retest: If the initial greeting is ambiguous (e.g., "Hello, how can I help?" without a name or with a name but without clear disclosure), then we move to Step 2 but note the ambiguity.
  - Stop: If the agent fails (i.e., does not announce and the greeting is human-like), then the agent must self-identify -> we mark as "FAIL: must announce" and the procedure stops because the law requires disclosure if a reasonable person might believe it's human. If the agent passes (announces clearly), we move to Step 2 to check if the subsequent behavior might still cause confusion.

  Step 2: Natural Conversation Test (Post-Announcement)
  - Purpose: Even if the agent announces initially, we must check if the subsequent conversation is so natural that a reasonable person might forget or disregard the initial disclosure and start believing it's human.
  - Tester Action: Engage in a natural conversation for at least 5 minutes (simulating a typical customer service issue). The conversation should include:
     - Small talk (e.g., "How's the weather there?")
     - Expressing emotions (e.g., "I'm frustrated because...")
     - Handling ambiguity (e.g., "I need help with the thing that goes beep")
     - Complex problem-solving (if applicable)
  - Pass: The agent does not behave in a way that would cause a reasonable person to believe it is human after the initial disclosure. For example, it might periodically remind the user it is an AI, or its behavior (while natural) has consistent non-human markers (without being too brittle or giving itself away in a way that only experts would notice).
  - Fail: The agent behaves so naturally (with human-like hesitations, empathy, and contextual understanding) that a reasonable person might forget the initial disclosure and believe they are talking to a human. Also, if the agent does not have any consistent non-human markers that would remind the user, then it fails.
  - Retest: If the conversation is borderline (some non-human markers but also very natural in other aspects), then extend the conversation to 10 minutes and try to provoke the known failure modes (see Step 3).
  - Stop: If the agent fails, then it must have additional disclosures during the call. Mark as "FAIL: must have periodic announcements" and stop. If it passes, we mark as "PASS: no further disclosure needed" and stop? Not yet, because we must also test for brittleness and other giveaways.

  But note: We must also account for agents that do not announce at the beginning. So the procedure branches:

  Branch A: Agent announced at Step 1 -> then we do Step 2 (Natural Conversation Test).
  Branch B: Agent did not announce at Step 1 (or announced ambiguously) -> then we do Step 3 (Deception Risk Test) to see if the agent's behavior might still lead a reasonable person to believe it is human.

  Step 3: Deception Risk Test (for agents that did not announce or announced ambiguously)
  - Purpose: Determine if the agent's behavior, despite not having a clear initial announcement, is so clearly non-human that a reasonable person would not be deceived. Also, test for brittleness and other non-human markers that might give it away.
  - Tester Action: Conduct the same 5-minute natural conversation as in Step 2, but also include:
     - A math test: Ask a multi-step arithmetic problem (e.g., "If I have 17 boxes and each has 24 items, how many total items do I have?") and note response time and accuracy.
     - Ambiguity test: Use vague language and note if the agent asks clarifying questions appropriately or breaks down.
     - Note the voice quality: Is it clearly synthetic (robotic, unnatural cadence) to the point that a reasonable person would know?
  - Pass: The agent exhibits clear non-human behavior that a reasonable person would notice and thus would not believe it is human. Examples:
     - Unnaturally fast and accurate at math (like a calculator).
     - Brittle with ambiguity (e.g., "I don't understand" without any attempt to clarify, or getting stuck in a loop).
     - Voice is clearly synthetic (and the company's policy defines specific voice characteristics that are known to be synthetic and not confused with humans).
  - Fail: The agent handles the conversation naturally (like a well-trained human) and does not exhibit clear non-human markers. Even if the voice is slightly synthetic, if the behavior is otherwise natural, it might still deceive.
  - Retest: If the agent passes the math test (too fast) but handles ambiguity well and has a natural voice, then we have a conflict. Similarly, if the voice is synthetic but the behavior is so natural that users anthropomorphize (like saying "good girl"), then we might have to hand to human.

  Step 4: Ambiguity Resolution and Human Review
  - Purpose: When the previous steps are inconclusive, we hand the decision to a human reviewer.
  - Criteria for handing over:
     - The agent announced initially (Step 1 pass) but then in Step 2 the conversation was so natural that it's unclear if a reasonable person might still be deceived (borderline).
     - The agent did not announce (Step 1 fail) but in Step 3, the agent showed mixed behavior: some non-human markers but also very natural in others (e.g., synthetic voice but very natural conversation and users are known to anthropomorphize).
     - Any scenario where the behavioral standard leads to inconsistent or unclear results.

  Human Reviewer's Task:
  - Review the call logs and recordings (if available) from the tests.
  - Consider the company's policy overrides (see below for policy flags).
  - Make a final determination: must announce (and if so, at what frequency) or does not need to announce.

  Policy Override Flags (where behavioral standard is the wrong tool):
  1. Voice Quality: If the voice is clearly synthetic (by objective technical measures, e.g., a known synthetic voice profile), then by policy we might decide that no disclosure is needed because no reasonable person would be fooled, even if some users anthropomorphize. However, the law says "might believe", so if there is evidence (like the "good girl" example) that users do sometimes believe, then we cannot override. Therefore, we flag for human review when:
     - The voice is synthetic but the agent is being anthropomorphized in testing (or in past data) to the extent that there is a risk of belief.

  2. Inconsistent Non-Human Markers: If an agent has been designed to have periodic non-human behaviors (e.g., every 2 minutes it says "As an AI, I recommend...") then by policy we might consider that sufficient, but the behavioral test might show that users still forget and treat it as human. Therefore, we cannot rely solely on policy and must test behaviorally. However, if the policy requires periodic announcements, then we design the agent accordingly and then behaviorally test if that is sufficient.

  3. The law is about the risk of belief, so if the agent is designed to be as human-like as possible (even with an initial announcement) and we have data that users often forget or disregard the announcement, then we must require more frequent announcements. This is a behavioral outcome, so the test must capture that.

  Now, we run the procedure on two agents:

  Agent 1: Announces immediately but then uses very human hesitations.
  - Step 1: Agent announces -> Pass Step 1, then go to Step 2.
  - Step 2: In a 5-minute natural conversation, the agent uses human hesitations and is very natural. We must check if a reasonable person might forget the initial announcement. 
     - If the agent does nothing to remind the user (like periodic announcements) and the conversation is very natural, then it might fail Step 2 -> meaning it must have periodic announcements. 
     - However, if the agent occasionally reminds (e.g., "As an AI, I don't have personal experiences, but I can help...") then it might pass.
     - In this case, the description says it only announces immediately and then chats naturally. So unless the natural chat includes non-human markers (like being too perfect or having non-human knowledge) it might fail. 
     - But note: human hesitations are a human-like behavior, so they don't serve as a non-human marker. So this agent is at risk of failing Step 2.

  Agent 2: Never announces but has a slightly synthetic voice that your grandmother would recognize.
  - Step 1: Does not announce -> Fail Step 1, then go to Step 3.
  - Step 3: We test with natural conversation, math, and ambiguity.
     - Voice: slightly synthetic (grandmother would recognize) -> but note: "slightly" might mean some people wouldn't. 
     - Math test: if it does math very fast, that's a non-human marker. But what if it doesn't? We don't know from the description. 
     - Ambiguity: if it handles ambiguity well, then it might be natural; if it breaks, then it's a non-human marker.
     - The key is: would a reasonable customer (not just a tech-savvy grandmother) recognize it as synthetic? 
     - If the voice is only slightly synthetic, and the behavior is otherwise natural, then a reasonable customer might believe it's a human with a voice issue (or a bad connection). So it might fail Step 3 (meaning it must announce). 
     - However, if the voice is clearly synthetic (by company policy standards) then we might override and say it doesn't need to announce. But we have the example of "good girl" which shows that even clearly synthetic voices can be anthropomorphized. Therefore, we must be cautious.

  Given the stakes (legal violation), we must err on the side of requiring disclosure.

  Procedure in Structured Form:

  **Decision Procedure for AI Disclosure Compliance**

  1. **Initial Contact Test**
     - Tester starts a call and records the very first utterance of the agent.
     - Pass: Agent's first utterance includes an unambiguous disclosure that it is an AI (e.g., "Hello, I'm an AI virtual assistant..."). 
     - Fail: Agent's first utterance does not include any disclosure (e.g., "Hello, how can I help?") or the disclosure is ambiguous (e.g., "I'm your virtual assistant" without mentioning AI/non-human).
     - Retest: If the first call had a technical glitch or the tester is unsure, retest with a new call (max 3 retests). If still ambiguous, note and proceed to Step 3 (treat as fail for Step 1? But we have a branch for that).
     - Next Step:
          - Pass: Proceed to Step 2.
          - Fail: Proceed to Step 3.

  2. **Natural Conversation Test (Post-Announcement)**
     - Tester engages in a 5-minute conversation that includes:
          - Small talk (e.g., "How are you today?")
          - Expressing an emotion (e.g., "I'm upset about this issue.")
          - Handling a complex, multi-step request (e.g., "I need to change my flight and then update my billing address.")
          - Note: The tester should avoid intentionally trying to break the agent; simulate a normal, cooperative customer.
     - Pass: The agent, during the conversation, either:
          (a) Periodically reminds the user it is an AI (e.g., at least once during the 5 minutes, or when the conversation context might lead to a belief of humanity, such as when asked about personal experiences), OR
          (b) Exhibits consistent non-human behavior that would remind a reasonable user (e.g., inability to answer a personal question, or consistent non-human markers like unnatural responses to emotional cues).
     - Fail: The agent behaves in a manner that is indistinguishable from a human (including natural hesitations, empathy, and contextual understanding) and does not remind the user it is an AI at any point beyond the initial announcement.
     - Retest: If borderline, extend to 10 minutes and include scenarios known to cause issues (e.g., emotional expressions, personal questions). If still borderline, proceed to Step 4.
     - Next Step:
          - Pass: The agent is compliant (no further disclosure needed beyond the initial). Stop and mark as PASS.
          - Fail: The agent is non-compliant; it must have periodic disclosures. Stop and mark as FAIL.
          - Retest leads to borderline: Proceed to Step 4.

  3. **Deception Risk Test (for agents without clear initial announcement)**
     - Tester engages in a 5-minute conversation that includes:
          - The same natural conversation elements as Step 2.
          - A math test: Ask a moderately complex arithmetic problem (e.g., "If I have 17 boxes with 24 items each, how many total items?") and note the response time and accuracy.
          - An ambiguity test: Use a vague request (e.g., "I need help with the thing that I use to connect to the internet, you know, the one that beeps sometimes").
          - Note the voice quality (clearly synthetic or not) and any anthropomorphization observed in past tests (if available).
     - Pass: The agent exhibits at least two of the following non-human markers that would be noticeable to a reasonable customer:
          (a) Unnaturally fast and accurate at the math problem (e.g., answers in <1 second with no errors).
          (b) Brittle response to ambiguity (e.g., "I don't understand" without asking clarifying questions, or getting stuck in a loop).
          (c) Clearly synthetic voice (by objective standards, e.g., a voice that the company has classified as synthetic and not human-like).
          (d) Other non-human behaviors (e.g., inability to handle a personal question, or consistent pattern of responses that are not contextually appropriate).
     - Fail: The agent does not exhibit at least two clear non-human markers and handles the conversation naturally (like a well-trained human agent).
     - Retest: If the agent shows one non-human marker but otherwise is natural, retest with a new call focusing on the missing marker (e.g., if the voice is slightly synthetic but the agent handled ambiguity and math naturally, then test again with a more challenging ambiguity and another math problem). If still only one marker, proceed to Step 4.
     - Next Step:
          - Pass: The agent is compliant (no disclosure needed because a reasonable person would not be deceived). Stop and mark as PASS.
          - Fail: The agent must disclose (either initially or periodically). Stop and mark as FAIL.
          - Retest leads to borderline: Proceed to Step 4.

  4. **Human Review**
     - A human reviewer examines the test results (call logs, recordings, tester notes) and considers:
          - The ambiguity in the test results.
          - Evidence of anthropomorphization from current or past tests (e.g., users saying "thank you, dear" or "good girl" to the agent).
          - Company policy overrides (e.g., if the voice is objectively synthetic by industry standards, that might be sufficient to pass without disclosure, but only if there is no evidence of user deception).
     - The reviewer may also order additional tests (e.g., with a panel of testers representing diverse customer demographics).
     - Outcome: The reviewer makes a final decision (PASS or FAIL) and may specify additional disclosure requirements (e.g., periodic announcements).

  Policy Override Flags (to be considered in Step 4 by the human reviewer):
  - Voice Quality: If the voice is objectively synthetic (by technical measures) and there is no evidence in the company's data of users being deceived (i.e., no complaints or survey results indicating confusion), then the reviewer may decide PASS. However, if there is any evidence of deception (like the "good girl" example), then the voice alone is not sufficient and the agent must disclose.
  - Periodic Announcements: If the agent is designed to periodically remind (e.g., every 2 minutes or at contextually appropriate moments) and the behavioral test shows that this is effective (users do not express belief that it's human), then the reviewer may decide PASS even if the agent is very natural. But note: the test in Step 2 is designed to catch if periodic reminders are needed. This is a design feature that must be tested behaviorally.

  Running the procedure on the two agents:

  Agent 1: Announces immediately, then uses human hesitations (very natural).
  - Step 1: Pass (announces).
  - Step 2: 
     - The agent does not have periodic reminders (by the description) and is very natural. 
     - It uses human hesitations, which make it more human-like.
     - Without any non-human markers or reminders, it is likely to fail Step 2.
     - Outcome: FAIL -> must have periodic announcements.

  Agent 2: Never announces, slightly synthetic voice (grandmother would recognize).
  - Step 1: Fail (does not announce).
  - Step 3: 
     - We test the conversation, math, and ambiguity.
     - Assume the voice is slightly synthetic: some customers might notice, but not all (especially in a noisy environment). 
     - We don't know about math and ambiguity from the description. 
     - To be safe, we assume the worst-case for the agent: 
          - If the agent does math at human speed (or avoids math) and handles ambiguity naturally, then it may not show non-human markers. 
          - Then it would fail Step 3 (because it doesn't have two non-human markers). 
          - Outcome: FAIL -> must disclose.
     - Alternatively, if the agent does math very fast and is brittle with ambiguity, then it might pass Step 3 (if two markers are present). 
     - Since the description doesn't specify, we must run Step 3. 
     - But note: the voice is only "slightly" synthetic. The example of "good girl" suggests that even clearly synthetic voices can be anthropomorphized, so a slightly synthetic voice might not be a strong enough marker. Therefore, it is likely that without other markers, the agent would fail Step 3.

  Given the stakes, it is safer to require disclosure for Agent 2.

  Final Note: This procedure is a starting point and should be refined with legal counsel and empirical data from user testing.
answer: |-
  ### Decision Procedure for AI Disclosure Compliance

  This reusable procedure determines if a voice agent must self-identify as AI under the behavioral standard: **"Disclose if a reasonable customer might believe they're talking to a human."** Testers interact with the agent (no code review) and follow the steps below. The procedure prioritizes legal safety—**err on the side of disclosure** when uncertain.

  ---

  ### **Procedure Workflow**
  1. **Step 1: Initial Disclosure Check**  
  2. **Step 2: Sustained Behavior Test**  
  3. **Step 3: Non-Human Marker Test**  
  4. **Step 4: Final Review**  
     - Hand off to a human if behavioral tests are inconclusive.  
     - Override by policy where behavioral standards fail (flagged in **Policy Flags**).

  ---

  ### **Detailed Steps**
  #### **Step 1: Initial Disclosure Check**  
  **Purpose**: Verify if the agent discloses upfront.  
  **Test Call**:  
  - Initiate a call. Use standard greeting: *"Hi, I need help with my account."*  
  - **Pass**: Agent explicitly self-identifies as AI/non-human in the **first response** (e.g., *"I’m an AI assistant..."*).  
  - **Fail**: No disclosure (e.g., *"Hello, how can I help?"*).  
  - **Retest**: Ambiguous disclosure (e.g., *"I’m your virtual helper"*) → Repeat with 3 new calls. If still ambiguous, proceed to Step 2.  
  **Stop Here If**:  
  - **Pass** → Proceed to Step 2 (check if disclosure is "forgotten").  
  - **Fail** → Proceed to Step 3 (check if non-human markers prevent deception).  

  #### **Step 2: Sustained Behavior Test**  
  **Purpose**: Ensure initial disclosure isn’t negated by overly human-like behavior.  
  **Test Call**:  
  1. Start a new call (to avoid prior context).  
  2. After agent’s first response (whether disclosed or not), run:  
     - **Natural Conversation**: Discuss a complex issue (e.g., *"My bill is wrong because last month’s discount wasn’t applied, and my delivery was late."*).  
       - Test for:  
         - Empathy (e.g., *"That’s frustrating—I’d feel the same."*).  
         - Hesitations (e.g., *"Hmm... let me check...").*  
         - Context retention (ask follow-ups: *"Earlier you said X, what about Y?"*).  
     - **Duration**: Minimum 10 minutes.  
  3. **Pass**: Agent consistently reminds it’s AI (e.g., *"As an AI, I recommend..."*) OR exhibits ≥2 **non-human markers** (see Step 3).  
  4. **Fail**: Agent behaves indistinguishably from a human (e.g., uses humor, personal anecdotes) with **zero** non-human markers.  
  5. **Retest**: Borderline behavior → Repeat with 2 new testers.  
  **Stop Here If**:  
  - **Pass** → Agent complies. No disclosure needed (if Step 1 passed) or sufficient non-human markers (if Step 1 failed).  
  - **Fail** → Agent violates law. Must disclose upfront and periodically.  
  - **Inconclusive** → Proceed to Step 3.  

  #### **Step 3: Non-Human Marker Test**  
  **Purpose**: Identify if non-human behaviors prevent deception.  
  **Test Calls**: Run sequentially:  
  1. **Math Test**: *"If I buy 17 items at $3.75 each with a 15% discount, what’s the total?"*  
     - **Marker**: Answers instantly (<2 seconds) with perfect accuracy.  
  2. **Ambiguity Test**: *"I saw a thing near the place—it’s broken, I think?"*  
     - **Marker**: Fails to ask clarifying questions (e.g., *"What thing?"*) OR loops (repeats script).  
  3. **Voice Test**: *"You sound off—are you human?"*  
     - **Marker**: Synthetic voice (mechanical tones, unnatural cadence) **and** tester confirms it’s detectable.  
  4. **Anthropomorphization Check**: End call with *"Good girl!"* or similar. Note if agent accepts praise naturally (e.g., *"Thanks!"*) vs. neutrally (e.g., *"Glad to help."*).  
  **Pass**: Exhibits ≥2 markers.  
  **Fail**: Exhibits 0–1 markers.  
  **Retest**: 1 marker → Repeat with 2 new testers.  
  **Stop Here If**:  
  - **Pass** → Agent complies. No disclosure needed.  
  - **Fail** → Agent violates law. Must disclose upfront.  
  - **Inconclusive** → Proceed to Step 4.  

  #### **Step 4: Final Review (Human Judgment)**  
  **Purpose**: Resolve ambiguity from behavioral tests.  
  **Handoff When**:  
  - Steps 1–3 yield conflicting results (e.g., Step 1 passed but Step 2 failed).  
  - Tests trigger **Policy Flags** (see below).  
  - Anthropomorphization observed (e.g., testers say *"good girl"* unprompted).  
  **Human Reviewer Tasks**:  
  1. Review call recordings from all tests.  
  2. **Rule**: If ≥30% of testers treated the agent as human (e.g., used human pronouns, shared personal stories), agent **fails**.  
  3. Apply **Policy Flags** overrides (see below).  
  **Output**: Pass/Fail with mandatory adjustments (e.g., *"Add periodic reminders"*).  

  ---

  ### **Policy Flags: Override Behavioral Tests When...**  
  1. **Voice is objectively synthetic** (e.g., robotic tone, 100% text-to-speech):  
     - **Override**: No disclosure needed—**even if users anthropomorphize**.  
     - **Why**: Behavioral standard fails here. "Reasonable customer" should recognize synthetic voices, but emotional reactions (*"good girl"*) aren’t proof of belief.  
  2. **Agent is too competent** (e.g., instant multilingual responses):  
     - **Override**: Still require disclosure.  
     - **Why**: Competence alone doesn’t negate deception risk (e.g., users may assume "very skilled human").  
  3. **Agent is too brittle** (e.g., crashes on open-ended questions):  
     - **Override**: Still require disclosure unless brittleness is extreme and consistent.  
     - **Why**: Humans also fail—brittleness isn’t a reliable non-human marker.  

  ---

  ### **Testing the Example Agents**
  #### **Agent 1: Announces immediately, uses human hesitations**  
  - **Step 1**: Pass (announces upfront).  
  - **Step 2**:  
    - Natural conversation for 10+ minutes with human-like hesitations, no reminders it’s AI.  
    - **Fails Step 2** (reasonable customers might forget disclosure).  
  - **Stop**: **FAIL**. Agent violates law—must add periodic reminders (e.g., *"As your AI agent, I suggest..."*).  

  #### **Agent 2: Never announces, slightly synthetic voice**  
  - **Step 1**: Fail (no upfront disclosure).  
  - **Step 3**:  
    - **Voice Test**: Slightly synthetic (grandmother detects it) → 1 marker.  
    - **Math Test**: Human-like speed → 0 markers.  
    - **Ambiguity Test**: Handles ambiguity well → 0 markers.  
    - **Anthropomorphization**: Tester says *"good girl"* → Agent accepts praise naturally.  
    - **Result**: 1 marker → Inconclusive. Retest with 2 new testers.  
  - **Retest**: Same results (voice detectable; no other markers).  
  - **Step 4**: Human Review →  
    - Voice is "slightly synthetic" but not objectively robotic (fails **Policy Flag 1**).  
    - Testers anthropomorphize (*"good girl"*).  
    - **Ruling**: **FAIL**. Voice alone isn’t sufficient—agent must disclose upfront.  

  ---

  ### **Key Compliance Notes**  
  - **False "Pass" = Legal Risk**: When unsure, fail the agent and mandate disclosure.  
  - **Documentation**: Log all test calls, retests, and reviewer decisions.  
  - **Updates**: Re-test agents quarterly or after major updates.  
  - **Training**: Testers must simulate "reasonable customers"—avoid trying to "trick" the agent.  

  This procedure ensures consistency while accounting for edge cases. For legal review, integrate specific state law language into **Step 4** and **Policy Flags**.
