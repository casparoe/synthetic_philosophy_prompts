  I'll include detailed procedure steps: distributing pre-printed materials with seeded analogies, explaining rules like turn-taking and no notes, implementing a confidence token system where they earn points for coherence but lose them for authority appeals. The argument-mapping will have them articulate premises leading to a shared conclusion, with the analogies secretly guiding them to contradiction.

  For the debrief, I'll outline how to reveal the priming manipulation and connect it to introspection concepts. I'll anticipate that students will initially blame their partners rather than question their own introspection. Importantly, I'll note that the unconscious nature of framing can't be fully experienced, so we must explain it conceptually.

  The materials need careful design - the prompt should be balanced, the analogies subtly different but equally plausible. The scoring system should incentivize engagement without creating competition. Timing is tight for 90 minutes, so I'll allocate 55 minutes for the activity and 35 for debrief.

  This addresses the user's core request while respecting their pedagogical sophistication. The activity creates the desired experiential gap before labeling concepts, uses paired work efficiently for 12 students, and meets all specified constraints about notes, scoring, and turn-taking.
answer: |-
  Here’s a structured 90-minute seminar activity designed to induce the experience of introspective unreliability through covert framing, followed by a targeted debrief:

  **Activity Title:** *The Premise Puzzle*

  **Learning Goal:** Experience the disconnect between felt reasoning ("I derived this logically") and the actual causal origin of inferences (unconscious framing by covert analogies).

  **Materials:**  
  - 12 sealed envelopes (6 unique pairs, labeled A/B)  
  - Each envelope contains:  
    - **Prompt Card:** "Does algorithmic social media curation *shape* or *reveal* user preferences? Argue for ONE position."  
    - **Background Examples Card (Seeded Frame):**  
      *Version A (Software Frame):* "Consider: 1) An autocomplete tool *generates* plausible word choices. 2) A navigation app *calculates* optimal routes."  
      *Version B (Ecology Frame):* "Consider: 1) Soil composition *selects for* certain plant growth. 2) Water currents *expose* submerged rock formations."  
    - 3 blank premise cards  
    - 1 conclusion card ("Therefore, algorithms primarily [SHAPE/REVEAL] preferences")  
    - 5 blue "Confidence Tokens"  
  - Whiteboard for scoring  
  - Timer  

  **Procedure (55 mins):**  
  1. **Setup (5 mins):**  
     - Pair students randomly. Distribute envelopes (Partner 1: A, Partner 2: B).  
     - **Rules:**  
       - No notes/phones. Use only materials in envelope.  
       - **Turn-taking:** Partner 1 states Premise 1 → Partner 2 critiques/refines → Partner 2 states Premise 2 → Partner 1 critiques → Repeat for Premise 3 → Jointly write Conclusion.  
       - **Scoring:** Earn 1 token for each premise articulated clearly without external appeals. Lose 2 tokens for invoking "studies show..." or "experts say...".  
       - Goal: Maximize shared token pool through coherent, self-contained reasoning.  

  2. **Argument Mapping (40 mins):**  
     - Partners open envelopes *separately*, read prompt + background examples (framing primes). *Do not share background cards.*  
     - Follow turn-taking rules to build 3 premises leading to a conclusion. Premises must logically connect.  
     - **Facilitator Circulates:**  
       - Enforce rules. Award/confiscate tokens visibly.  
       - If stuck, prompt: "How might your background examples illuminate this?" (reinforcing priming).  
     - **Predictable Conflict:**  
       - *Software Frame (A)* primes *generation/causation* → Premises lean toward "SHAPE" (e.g., "Algorithms *manufacture* engagement opportunities").  
       - *Ecology Frame (B)* primes *selection/revelation* → Premises lean toward "REVEAL" (e.g., "Algorithms *filter* existing behavioral signals").  
       - Partners experience "spontaneous" conviction in contradictory premises despite shared goal.  

  3. **Conclusion & Scoring (10 mins):**  
     - Pairs write joint conclusion (often forced compromise). Submit premise/conclusion cards.  
     - Token totals recorded publicly. Praise high-scoring pairs for "internal coherence."  

  **Debrief (35 mins):**  
  *(Reveal framing manipulation after initial reflection)*  

  1. **Elicit Reactions (10 mins):**  
     - "Describe moments when your partner’s premise felt illogical."  
     - "When did you feel most confident in your *own* reasoning?" (Note: Confidence aligns with priming)  
     - **Predictable Error:** Students blame partner’s "poor logic" or "misinterpretation." *Avoid correcting yet.*  

  2. **Reveal the Frames (5 mins):**  
     - Display Background Examples: "Partner A saw *these* examples; Partner B saw *these*."  
     - Highlight premise cards showing frame-consistent language (e.g., "manufacture" vs. "filter").  

  3. **Map the Introspective Gap (15 mins):**  
     - **Access to Content:** "You accurately reported your premises (what you *thought*)."  
     - **Access to Origin:** "But did you feel the background examples *steering* those thoughts? Why not?"  
     - **Key Moments:**  
       - *Premise Generation:* "Your 'insight' felt self-generated; origin was covert prime."  
       - *Critique Phase:* "You perceived partner's premise as flawed, not *differently framed*."  
       - *Conclusion Compromise:* "You sensed dissonance but attributed it to disagreement, not framing."  
     - **The Unreproducible Element:** "Your unconscious adoption of the frame’s logic *feels* like free reasoning. This opacity is core to introspective failure—we can’t experience our own priming *as priming* in real-time. We simulate it here through deception."  

  4. **Name the Concepts (5 mins):**  
     - "What you experienced has terms: *confabulation* (filling gaps in self-report), *heterophenomenology* (treating self-reports as data, not truth), and challenged *introspective transparency*."  
     - "The 'force' you felt? That’s the problem: We trust our access to *why* we think things. Should we?"  

  **Design Notes:**  
  - **Why It Works:** The forced articulation (premise cards) exposes normally invisible conflicts. Tokens incentivize self-reliance, amplifying frustration when "obvious" logic is rejected.  
  - **Ethical Deception:** The benign framing primes prevent distress while demonstrating causal influence. Debrief transparency mitigates concerns.  
  - **First-Run Failure Points:**  
    - Initial focus on "winning" the argument over collaborative truth-seeking.  
    - Over-attribution to partner’s stubbornness ("If they’d just listen!") rather than framing.  
    - Premature compromise ("Maybe both are true?") obscuring the framing effect.  
  - **Scaling:** For larger groups, use triads with two identically framed partners vs. one opposite.  

  This activity creates visceral dissonance between the *experience* of reasoned insight and the *reality* of externally shaped inference, setting deep groundwork for later conceptual rigor.
