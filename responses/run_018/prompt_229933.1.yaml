answer: |-
  **Journal of Eliminative Phenomenology: Author Submission Style Guide**

  1.  **Journal Scope:** The *Journal of Eliminative Phenomenology (JEP)* publishes rigorous philosophical work exclusively defending **Illusionism** concerning phenomenal consciousness. Papers must argue that phenomenal properties (e.g., qualia, raw feels, phenomenal character) do not exist; instead, what we call "conscious experience" arises solely from introspective states systematically misrepresenting the mind's non-phenomenal states. (Submissions promoting realism, panpsychism, emergentism, property dualism, or non-illusionist representationalism will be desk-rejected without review.)
  2.  **Terminological Precision: "What-it-is-like" Expressions:** All phrases invoking "what it is like" to have an experience (e.g., "what it is like to see red," "there is something it is like to feel pain") are categorically prohibited. Replace all such locutions with precise statements describing **introspective misrepresentation**. (Example: Replace "There is something it is like to taste coffee" with "Introspection misrepresents the neurocomputational state N as having non-existent phenomenal property P.")
  3.  **Terminological Precision: "Seems" and "Appears":** Use of "seems," "appears," or cognates is permitted *only* when immediately accompanied by a functional or representational description of the seeming state itself. Crucially:
      *   **3a.** The description must not invoke intrinsic, ineffable qualities. (An "ineffable seeming" *is* a phenomenal property and is therefore ontologically prohibited under illusionism.)
      *   **3b.** Acceptable: "Introspective mechanism I generates a state S representing that state T has property F (which it lacks)." Unacceptable: "It *seems* like there is a raw feel of green."
  4.  **The Meta-Problem Mandate:** Manuscripts addressing the "meta-problem of consciousness" (explaining why we are disposed to *judge* or *report* that experiences possess phenomenal character) are encouraged. However:
      *   **4a.** Explanations (e.g., evolutionary, cognitive, representational) must be framed exclusively in non-phenomenal terms.
      *   **4b.** Under no circumstances may the *disposition* to report phenomenal character be described as *itself* possessing phenomenal character, inheriting it, or being explained by it. (The disposition is a functional/computational trait misdescribing other functional/computational traits.)
  5.  **Handling the Self-Refutation Objection:** A recurring letter argues that an *illusion* of consciousness must itself be conscious, allegedly refuting illusionism. Authors may address this objection, but manuscripts must adhere strictly to the following:
      *   **5a.** The "illusion" is constituted entirely by **misrepresentational introspective states**. These states are themselves non-phenomenal.
      *   **5b.** Arguments must clarify that the introspective state *represents that* phenomenal consciousness exists, but does so *without* possessing phenomenal properties. Its existence and causal powers are fully explicable functionally. (See Rule 3).
      *   **5c.** Manuscripts may reference the standard JEP response document "Misrepresentation Without Mirage: A Formal Refutation of the Self-Refutation Argument" (available on the JEP website).
  6.  **Regress of Seemings:** Manuscripts may discuss scenarios involving iterated introspection (e.g., "it seems that it seems red"). The following applies:
      *   **6a.** Each level of "seeming" (e.g., the seeming that there is a seeming) must be analyzed as a distinct, non-phenomenal representational state.
      *   **6b.** Appeals to halt the regress by invoking an intrinsic, non-representational quality ("a certain *je ne sais quoi*," "the feeling of seeming itself") are strictly forbidden. (This constitutes smuggling in phenomenal properties.) The regress is halted by the non-phenomenal, functional nature of the underlying states.
  7.  **Describing Putatively Intense States (e.g., Pain):** Descriptions of experiences like severe pain are permissible, but must maintain illusionist commitments:
      *   **7a.** Focus on the functional role (motivational intensity, learning avoidance, priority signals) and the *representational content* generated by introspection.
      *   **7b.** Representational content should be described as **radically false** or **outrunning anything actually instantiated** in the physical system. (Example: "The introspective state misrepresents tissue damage signal D as the instantiation of an intrinsic, excruciating phenomenal property Q, a property nowhere realized in the physical world.")
      *   **7c.** Terms implying the *actual presence* of intrinsic awfulness (e.g., "painfulness," "suffering-quale") are disallowed unless explicitly framed as the representational *content*, not the state's ontology.
  8.  **Final Note:** The Editorial Board possesses an unwavering commitment to the ontological elimination of phenomenal properties. Manuscripts must reflect this commitment in every assertion. Ambiguity favoring phenomenal realism will result in requests for revision or rejection. Clarity, precision, and unwavering adherence to the illusionist thesis are paramount.
