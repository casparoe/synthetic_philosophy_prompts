answer: |-
  Here's the activity design, then the JSON summary after:

  ---

  **Activity Title:** The Compression Game: Feeling the User Illusion  

  **Setup (5 mins):**  
  - Split 18 students into 4 groups:  
    1. **Sensory Input** (gets "raw world-cards" like: *blurry red shape*, *loud bang with no source*, *cold touch sensation*).  
    2. **Predictive Model** (gets cards like: *memory of a red apple here*, *expectation of silence*, *prediction of warmth*).  
    3. **Language/Reporting** (gets cards like: *label "FIRE"*, *label "SAFE"*, *label "GHOST"*).  
    4. **Executive Decision** (gets cards like: *urge to RUN*, *urge to IGNORE*, *urge to TOUCH*).  
  - Hand each group 3 contradictory cards (e.g., Sensory gets "blurry red shape" but Predictive gets "memory of blue square").  
  - **Rules:**  
    - No showing raw cards to other groups.  
    - Groups must distill cards into **one-sentence "interface reports"** (e.g., Sensory: *"I see red"*; Language: *"It's dangerous"*).  
    - Goal: Create a **unified experience report** (one paragraph) all 18 agree on.  

  **Gameplay (40 mins):**  
  1. **Group Work (15 mins):**  
     - Each group converts raw cards into interface reports (e.g., Predictive might turn *"memory of apple"* into *"I recognize an apple"*).  
     - **Incentive:** Groups earn a token point if their unified report is voted "most coherent" (not accurate!).  
  2. **Consensus (15 mins):**  
     - Groups share interface reports (verbally or on a board).  
     - Debate to create **one unified story** (e.g., *"I see a red apple, it’s safe to touch"*).  
     - Sensory + Predictive might clash over color, Language + Executive over danger vs. safety.  
  3. **Defense & Vote (10 mins):**  
     - Groups defend their unified report’s coherence.  
     - Vote on "most internally consistent" report → winning group gets point.  

  **Hidden Reveal (15 mins):**  
  - Show ALL raw world-cards publicly.  
  - Highlight contradictions (e.g., *Sensory had "blurry red" but Predictive had "memory of blue"*).  
  - Point out what got suppressed for consensus (e.g., "danger" label was dropped to agree on "safe").  

  **Debrief (30 mins):**  
  - Map it:  
    - **Interface reports** = Your "conscious experience" (simple surface).  
    - **Unified report** = The illusion of a seamless reality.  
    - **Erased contradictions** = Missing source metadata (e.g., you don’t "see" predictive biases).  
    - **Coherence pressure** = Why consciousness feels transparent (we hide messiness to function).  
  - **Predictable Failure:** Someone will peek at another group’s raw cards or blurt out contradictions early (it’s okay—use it to highlight our brain’s "no peeking" rule).  
  - **Uncapturable Feature:** **Qualia/subjective feel**—the game shows report *compression*, but not why red *feels* like red (that 1st-person magic stays mysterious).  

