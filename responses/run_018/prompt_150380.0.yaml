  We are designing an in-class simulation game for a philosophy of mind seminar about consciousness as a user illusion. The goal is to have participants experience the compression of raw data into a coherent conscious experience, and then reveal the hidden contradictions that were erased.

  Structure:
  - Split the class into 4 groups (modules): 
    1. Sensory Input Group
    2. Predictive Model Group
    3. Language/Reporting Group
    4. Executive Decision Group

  Each group gets "raw world-cards" which contain contradictory information. They can only communicate through compressed "interface reports" (one sentence). The groups must reach a consensus on a unified "experience report" and defend it. The reward is for coherence, not accuracy.

  Phases:
  1. Setup (5 mins): Explain the rules, assign groups, hand out raw world-cards (each group gets their own set of cards, which are contradictory both within and across groups).
  2. Group Work (20 mins): Groups look at their raw world-cards and create interface reports (one sentence per card). Then, they share these reports with the whole class and try to form a unified experience report (one paragraph). They must agree on the report.
  3. Consensus and Defense (15 mins): Each group nominates a speaker to present the unified report and defend it. The class votes on which group's report is most coherent (token point reward).
  4. Hidden Reveal (15 mins): The instructor reveals the raw world-cards that each group had, showing the contradictions that were erased to form the coherent report.
  5. Debrief (35 mins): Map the activity to the theory of consciousness as a user illusion.

  Predictable failures: 
  - Someone might peek at another group's raw cards. 
  - Groups might struggle to form a unified report and get stuck.

  Uncapturable feature: 
  - The first-person qualitative experience (qualia) — the activity is about third-person reports and group dynamics, not the subjective feel.

  Now, let's design the raw world-cards with examples (keep in mind contradictions):

  - Sensory Input Group: 
    - Card 1: A blurry image of a red circle with a green smudge.
    - Card 2: A clear image of a blue square.
    - Card 3: A sound clip of a bell ringing, but with static.

  - Predictive Model Group:
    - Card 1: A memory imprint of a red circle from last round (but in reality, last round was a blue square).
