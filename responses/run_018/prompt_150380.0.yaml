  - Executive Decision Group:
    - Card 1: An impulse to reach out and touch.
    - Card 2: A fear response to withdraw.
    - Card 3: A command to ignore and move on.

  Each group must convert their raw cards into one-sentence interface reports without revealing the raw data. Then, all groups together must form a unified report.

  Rules:
  - No showing raw cards to other groups.
