answer: |-
  ### 60-Minute Structured Deliberation: Gongsun Long's White-Horse Paradox

  #### (1) Artifact Descriptions and Point-Allocation System
  **Artifact Cards (12 identical cards per committee):**  
  *Each card has a number and a one-sentence description:*  
  1. White horse statue (polished marble, life-sized)  
  2. Black horse statue (ebony wood, life-sized)  
  3. White marble sphere (smooth finish, 30cm diameter)  
  4. Black iron cube (matte surface, 25cm sides)  
  5. Red ceramic horse statue (glazed, rearing pose)  
  6. Blue glass horse statue (translucent, galloping pose)  
  7. White alabaster pyramid (polished, 20cm height)  
  8. Black obsidian cylinder (lustrous, 15cm height)  
  9. Golden horse statue (gilded bronze, ornate saddle)  
  10. Silver horse statue (polished steel, standing pose)  
  11. White porcelain vase (delicate floral patterns)  
  12. Black onyx sphere (high-gloss, 20cm diameter)  

  **Mandates & Budgets:**  
  - **Form Committee:** Allocate 10 points total to **all and only** horse-shaped objects (Cards 1, 2, 5, 6, 9, 10).  
  - **Color Committee:** Allocate 10 points total to **all and only** white-colored objects (Cards 1, 3, 7, 11).  
  - **Binding Rule:** Any artifact receiving points from both committees gets **0 points** (voided).  

  **Scoring Sheet (for Form/Color Committees):**  
  - Committees distribute **whole numbers** only (no fractions).  
  - Points per artifact: Minimum 0, maximum 10.  
  - Total must sum to 10.  
  - *Example:* Form Committee might allocate 3 points to Card 1, 2 to Card 2, etc.  

  **Conflict Resolution:**  
  - After simultaneous reveal, void any artifact funded by both committees.  
  - Committees may then **withdraw** points from voided artifacts (no reallocation to other artifacts).  

  **Stakes:**  
  - Final points = speaking time in post-activity discussion (1 point = 10 seconds).  

  ---

  #### (2) Minute-by-Minute Timeline (Total: 60 min)
  - **0–5 min: Setup & Rules**  
    - Assign roles: 5 students to Form Committee, 5 to Color Committee, 5 to Arbitration Board.  
    - Distribute materials (artifact decks, scoring sheets).  
    - Explain mandates, void rule, and stakes. Emphasize: "No hybrid categories (e.g., ‘white-horse-form’)—stick strictly to your mandate."  

  - **5–20 min: Silent Allocation (15 min)**  
    - Form/Color Committees: Independently allocate 10 points.  
    - Arbitration Board: Study artifacts and note potential conflicts (no input yet).  

  - **20–25 min: Simultaneous Reveal (5 min)**  
    - Committees display scoring sheets.  
    - Facilitator identifies conflicts (e.g., Card 1 voided if both allocated points).  
    - Calculate voided artifacts and adjust scores.  

  - **25–45 min: Negotiation (20 min)**  
    - Arbitration Board joins both committees.  
    - Board may propose:  
      - Withdrawals (e.g., "Form Committee withdraw from Card 1").  
      - Mergers (e.g., "Color Committee fund all white non-horses").  
    - Committees may only **withdraw points** from voided artifacts (no adding/reallocating).  
    - Facilitator enforces: "No vetoes—committees decide retractions."  

  - **45–50 min: Final Lock-In (5 min)**  
    - Committees resubmit adjusted scores.  
    - Facilitator recalculates conflicts and finalizes budgets.  
    - Display final points for each artifact.  

  - **50–60 min: Debrief (10 min)**  
    - Use speaking-order stakes for discussion.  
    - Deliver scripted debrief (see below).  

  ---

  #### (3) Physical Materials & Room Layout  
  **Materials:**  
  - **Artifact Cards:** 3 identical decks (36 cards total) on cardstock.  
  - **Scoring Sheets:** 2 sheets (Form/Color) with artifact numbers and blank point columns.  
  - **Timer:** Large digital timer visible to all.  
  - **Whiteboard:** To display conflicts and final scores.  
  - **Pens:** 10 (for committees).  

  **Room Layout:**  
  - **Form Committee:** Table on left (labeled "FORM: Horse-Shaped Objects").  
  - **Color Committee:** Table on right (labeled "COLOR: White Objects").  
  - **Arbitration Board:** Central table (labeled "ARBITRATION: Proposals Only").  
  - **Timer/Whiteboard:** Front of room.  
  - *Seating:* Committees face each other; Arbitration faces both.  

  ---

  #### (4) Debrief Script (10 min)  
  **Facilitator:** "Let’s examine what happened. The white horse statue (Card 1) was voided because both committees claimed it. Why? The Form Committee saw it as a *horse*—funding its essential shape. The Color Committee saw it as *white*—funding its independent color-quality. But the rules forced a choice: it couldn’t be both. This deadlock mirrors Gongsun Long’s white-horse paradox.  

  In the game, the artifact *extensionally* belonged to both sets (horse-shaped objects and white objects). But the sorting rules treated these concepts as *intensionally separate*—like Gongsun Long’s claim that 'horse' (form) and 'white' (quality) are distinct universals. The void rule forced you to treat the white horse as if it were *not identical* to 'horse' alone.  

  Yet note: the game didn’t *create* this separation—it was baked into your mandates. Similarly, Gongsun Long assumes an ontology where form and quality are separable. The tension arises because the real world fuses them (a white horse *is* a horse), but conceptual rules can force fragmentation. The paradox isn’t about physical objects—it’s about how language and categories slice up reality."  

  ---

  #### (5) Predicted Failure & Corrective Moves  
  **Failure 1: Committees Invent Hybrid Categories**  
  - *Prediction:* Form Committee labels Card 1 "white-horse-form" to avoid conflict.  
  - **Correction:** Interrupt and reset: "Mandates are strict—Form funds *all* horse-shapes (including white ones). Reallocate."  

  **Failure 2: Arbitration Board Dominates**  
  - *Prediction:* Board pressures Color Committee to abandon Card 1.  
  - **Correction:** Freeze negotiation: "Arbitration can only propose—committees, decide based on your mandate. Color Committee, must you fund *all* white objects?"  

  **Failure 3: Committees Avoid Conflict**  
  - *Prediction:* Form Committee defunds Card 1 to "compromise."  
  - **Correction:** Challenge: "Your mandate requires funding horse-shapes. If you exclude the white horse, are you violating your duty?"  

  *Rationale:* Correctives preserve the tension by enforcing mandates, not resolving administratively.  

  ---

  #### (6) Explicit Simplification & Limitation  
  **Facilitator Statement (Debrief):**  
  "This exercise simplifies Gongsun Long’s ontology. He assumed universals ('horseness') exist independently of particulars (this white horse)—a Platonic realism we haven’t defended here. Our game *mechanically* reproduces the extensional conflict (overlapping sets), but Gongsun Long’s intensional claim—that 'horse' and 'white' are conceptually separable—is an axiom we imposed through your mandates. The limitation is that sorting rules alone can’t *prove* ontological separability; they only show its consequences. Yet this tension—between unified objects and fragmented concepts—is the paradox’s enduring force."  

  ---  
  **Self-Contained Prompt Logic:** The mandates enforce conceptual separation; the void rule mechanizes extensional conflict; the debrief bridges mechanics to ontology. No prior knowledge of Gongsun Long is needed—the game *is* the argument.
