  We are designing an in-class structured deliberation activity for 15 undergraduate philosophy students to experience the categorization tension central to the white-horse argument without prior lecture. The activity uses three committees: Form Committee (mandate: horse-shaped objects), Color Committee (mandate: white-colored objects), and an Arbitration Board. Each committee has a deck of 12 artifact cards and a budget of 10 points to allocate. The key rule: an artifact can only receive funding from one committee; if both allocate to the same artifact, both allocations are void and the artifact gets zero. The Arbitration Board can propose withdrawals or mergers but has no veto. Points allocated determine speaking order in the subsequent discussion.

  (1) Artifact Descriptions and Scoring Sheet:

  Artifact Cards (each described as a physical object in a museum; all are statues or objects made of various materials):

  1. White horse statue (marble)
  2. Black horse statue (ebony wood)
  3. White marble sphere
  4. Black iron cube
  5. Red ceramic horse statue
  6. Blue glass horse statue
  7. White alabaster pyramid
  8. Black obsidian cylinder
  9. Golden horse statue (gold-plated)
  10. Silver horse statue (silver-plated)
  11. White porcelain vase
  12. Black onyx sphere

  Note: The white horse statue (1) and the black horse statue (2) are critical. Also, note that the white marble sphere (3) and white porcelain vase (11) are white but not horses, while the black iron cube (4) and black onyx sphere (12) are neither white nor horses. The red ceramic horse (5) and blue glass horse (6) are horses but not white, and the white alabaster pyramid (7) and white porcelain vase (11) are white but not horses. The golden (9) and silver (10) horses are horses but not white.

  Scoring Sheet (for each committee):

  Each committee must distribute exactly 10 points among the artifacts that fall within their mandate. They can allocate any non-negative integer points to an artifact, but the total must be exactly 10. They cannot allocate fractional points.

  For the Form Committee: They are to fund horse-shaped objects. Therefore, the artifacts that are horse-shaped are: 1, 2, 5, 6, 9, 10.

  For the Color Committee: They are to fund white-colored objects. Therefore, the artifacts that are white are: 1, 3, 7, 11.

  Note: The white horse statue (1) appears in both lists.

  Partial allocations: If an artifact is allocated points by only one committee, it gets that many points. If both allocate, it gets zero. If neither allocates, it gets zero.

  (2) Minute-by-minute timeline (60 minutes total):

  - 0-5 min: Introduction and setup. Explain the roles, rules, and the scoring. Assign students to committees (5 each to Form, Color, and Arbitration). Distribute the artifact cards (each committee gets an identical deck of 12 cards) and a scoring sheet to each committee. Explain that the Form Committee must allocate 10 points to horse-shaped objects (list the horse-shaped artifacts by number: 1,2,5,6,9,10) and the Color Committee to white objects (1,3,7,11). Emphasize the rule: if both allocate to the same artifact, both allocations are void. The Arbitration Board does not allocate points but will observe and later help mediate.

  - 5-20 min: Silent allocation round (15 minutes). Each committee (Form and Color) works independently to distribute their 10 points. They must write down their allocations on the scoring sheet. The Arbitration Board uses this time to review the artifact cards and think about potential conflicts and solutions.

  - 20-25 min: Simultaneous reveal and conflict identification (5 minutes). The Form Committee and Color Committee reveal their allocations. The facilitator (or the Arbitration Board) checks for conflicts (same artifact getting points from both). The facilitator then announces which artifacts are void (if any) and adjusts the scores accordingly.

  - 25-45 min: Negotiation round (20 minutes). The Arbitration Board meets with both committees. The goal is to try to resolve conflicts (if any) by proposing that one committee withdraws from a conflicting artifact or by suggesting mergers (e.g., Form Committee might agree to fund only non-white horses and leave white objects to the Color Committee). However, the committees are not forced to accept; they can only retract a claim voluntarily. The Arbitration Board can only propose. The committees may adjust their allocations (only by withdrawing points from an artifact, not by adding or moving points to another) during this time. They cannot add new allocations. They can only withdraw from an artifact to avoid conflict.

  - 45-50 min: Final locked-in budgets (5 minutes). After negotiation, the committees resubmit their allocations (if they made changes). The facilitator recalculates the scores (again checking for conflicts). The final points per artifact are recorded.

  - 50-60 min: Debrief and introduction to the white-horse argument (10 minutes). The facilitator leads a discussion, starting by asking the committees to report their final points and then mapping the deadlock over the white horse statue to the philosophical argument.

  (3) Physical materials and room layout:

  - Materials: 
    - Three sets of 12 artifact cards (each set on card stock, with a description and a number, as above). Each committee gets one set.
    - Scoring sheets for Form and Color committees (with a grid: artifact number and points allocated).
    - A visible timer (for the facilitator to keep time).
    - A whiteboard or flip chart to record the allocations and conflicts during the reveal and final budgets.
    - Pens for each committee.

  - Room layout: 
    - Three tables arranged in a triangle: one for Form Committee, one for Color Committee, and one for the Arbitration Board. 
    - The Form and Color tables should be facing each other, with the Arbitration Board table at the head. 
    - The facilitator moves between the tables.

  (4) Debrief script (to be delivered in the last 10 minutes):

  "Let's look at what happened. We had an artifact that was a white horse statue. The Form Committee, whose mandate is to fund horse-shaped objects, allocated points to it because it is a horse. The Color Committee, whose mandate is to fund white objects, allocated points to it because it is white. But by the rules, when both allocated to the same artifact, both allocations were void. So the white horse statue ended up with zero points.

  This deadlock is not accidental. It arises because the rules forced a separation: the Form Committee could only consider the shape (horse), and the Color Committee could only consider the color (white). The white horse statue is both, but the rules did not allow it to be both at the same time.

  This mirrors the ancient Chinese white-horse argument by Gongsun Long. He argued that a white horse is not identical to a horse because 'horse' denotes the essential form (what makes a horse a horse) and 'white' denotes an independent color quality. In our game, the rules forced us to treat form and color as separate funding categories. The extensional overlap (the white horse statue is in both sets) led to a conflict because the rules required that only one committee could fund it.

  However, note that the rules did not create the separation of form and color arbitrarily. They were given as mandates. Similarly, Gongsun Long's argument relies on an ontology that treats universals (like 'horseness') and particular qualities (like 'whiteness') as distinct and separable. The game mechanically reproduces the extensional conflict: the white horse statue is in both sets, but the rules prevent double funding. But the intensional claim (the conceptual separability) is what the philosopher asserts. In the game, we see that the sorting rules alone cannot account for the unity of the object (the white horse) without creating a conflict. The rules forced an either/or: either fund it as a horse or as white, but not both.

  In reality, we know that a white horse is both a horse and white. But the argument challenges us: is the composite concept 'white horse' reducible to the simple concepts 'horse' and 'white'? The game shows that when we try to assign the object to one category or the other by these rules, we run into a problem. The white horse statue falls through the cracks because it is both. The rules do not have a category for 'white horse' as a hybrid. And that is the point: the School of Names would say that the form and the color are distinct and that the composite is not identical to either one alone."

  (5) Prediction of failure and corrective moves:

  Predicted failure: 
  - Committees might try to create hybrid categories. For example, the Form Committee might allocate points only to non-white horses and leave the white horse to the Color Committee. But note: the mandates are exclusive. The Form Committee is required to fund all horse-shaped objects regardless of color. If they leave the white horse out, they are violating their mandate. Similarly, the Color Committee must fund all white objects. So if they leave the white horse out, they are also violating their mandate.

  Corrective move: The facilitator must enforce the mandates. The Form Committee must fund every horse-shaped object (including the white one) and the Color Committee must fund every white object (including the horse). If they do not, the facilitator can point out that they are not following the rules. They are allowed to allocate zero to an artifact, but that would be against their mandate. However, the mandate says "all and only", meaning they must fund every artifact that fits. But note: they have a limited budget (10 points) and 6 (Form) and 4 (Color) artifacts respectively. They might not have enough points to fund each equally. So they might have to prioritize. The mandate does not require them to fund every artifact equally, but they must allocate their entire budget to artifacts in their mandate. They can choose to allocate zero to some in their mandate? The instructions say "distribute among artifacts that fall exclusively within its mandate". It does not require them to fund every one. So they can choose to leave some without funding. But the mandate says "all and only", meaning they can only fund artifacts in the mandate and they must not fund any outside. They do not have to fund every artifact in the mandate because of the budget constraint. So they can choose to leave the white horse statue unfunded? But then they are not funding an artifact in their mandate. However, the mandate does not say they have to fund every single one. It says they are to fund all and only (meaning only those and as many as they can with the budget). So they can choose which ones to fund. But the problem is that if they avoid the white horse, they are still not violating the mandate? The mandate is to fund horse-shaped objects (for Form) and white objects (for Color). They are allowed to choose which ones to fund. So they might avoid the white horse to avoid conflict. 

  This is a problem. To prevent this, we must emphasize in the instructions that they are expected to fund as many as possible of the artifacts in their mandate, but the budget constraint forces choices. However, if they avoid the white horse, then the deadlock might not occur. 

  Alternative corrective move: The facilitator should note that the white horse statue is the only artifact that is both a horse and white. The Form Committee has 6 horse artifacts and only 10 points. They might allocate, say, 2 points to each of 5 artifacts and leave one with 0. But which one? They might leave the white horse because they think the Color Committee will fund it. Similarly, the Color Committee has 4 white artifacts and 10 points. They might allocate 2.5 each? But we require integer points. So they might allocate 3 to three and 1 to one, or 2 to each of five? Wait, they have only 4. So they might leave one out. 

  If both committees leave the white horse statue out, then there is no conflict. But then the white horse gets zero because neither funded it. This still shows a problem: the white horse is not funded even though it fits both mandates. 

  However, the intended deadlock is when both try to fund it and then it gets voided. To increase the chance of conflict, we can make the budget such that they have enough to fund every artifact in their mandate if they spread the points. But the Form Committee has 6 artifacts and 10 points: they can fund each with at least 1 point (6 points) and then have 4 left to distribute. Similarly, the Color Committee has 4 artifacts and 10 points: they can fund each with at least 2 points (8 points) and then have 2 left. So both might fund every artifact in their mandate. Then the white horse statue would be funded by both and then voided. 

  To encourage this, in the instructions, we can say: "Your committee must allocate its entire budget (10 points) to the artifacts that fall within your mandate. You are free to distribute the points as you see fit, but note that you are responsible for ensuring that the artifacts in your mandate are represented. You may allocate zero to an artifact in your mandate, but that would mean you are not supporting it at all."

  But we cannot force them to fund every one. So to increase the likelihood, we might also tell them that the points represent the importance they assign to the artifact. They might feel that the white horse is important and should be funded. 

  If the Form Committee avoids the white horse, then the deadlock doesn't occur in the intended way. In the debrief, the facilitator can still point out that the white horse was not funded by either committee (if both left it out) or only by one. But the conflict is more dramatic when both try and it gets voided.

  Predicted failure 2: The Arbitration Board might dominate the negotiation and pressure the committees into a solution that avoids the conflict (e.g., by having one committee leave the white horse to the other). 

  Corrective move: The facilitator should remind the Arbitration Board that they can only propose, and the committees must voluntarily retract. The committees should be reminded that they can stick to their mandates. The Form Committee might feel strongly that they must fund the white horse because it is a horse. Similarly for Color. 

  (6) Explicit statement of simplification:

  "Note that in this exercise, we have simplified Gongsun Long's argument. He relied on a specific ontology that treats universals (like 'horseness') and particular qualities (like 'whiteness') as existing independently. In our game, we have mechanically separated the two by the mandates. However, Gongsun Long's argument is not just about extensional sets but about the intensional meanings and the way we form concepts. The game shows the practical consequence of that separation: the white horse cannot be both at the same time under these rules. But in reality, we might argue that a white horse is a horse and that the color is a property of that horse. The game does not resolve the philosophical question; it only illustrates the tension that arises from the separation. The limitation is that the game rules are artificial and do not reflect the full complexity of the ontology of universals and particulars. The force of the problem remains, however, because the rules force a decision that seems to deny the unity of the object."

