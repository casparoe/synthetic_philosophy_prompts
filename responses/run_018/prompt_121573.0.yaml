  ### Analysis of the Coin Toss Game for the Village Fête

  As a member of the committee, you need to decide whether to allow Marcus to run his coin toss stall, how to price it, and how to address the mathematical concerns raised. I'll break this down step by step, addressing your specific questions and providing clear recommendations for Marcus and the treasurer.

  #### 1. **Is the 69p "average payout" meaningless due to rearrangement?**
     - **No, the 69p is not meaningless.** It is the conventional expected value of the net payout to the player per game, calculated as the sum of the series \( \sum_{n=1}^{\infty} (-1)^{n+1} \frac{1}{n} = \ln 2 \approx 0.693 \) pounds (69p). This value is well-defined for the game as described because:
       - The probabilities of each outcome (first heads on the nth toss with probability \( \frac{1}{2^n} \)) are fixed by the game mechanics.
       - The series converges to \( \ln 2 \) when summed in the natural order of \( n \) (i.e., sequential tosses), which reflects the actual process of the game.
     - **The rearrangement argument (e.g., grouping terms to get different sums) is mathematically valid for the series itself** but does not apply to the game in practice. Here's why:
       - Rearrangement changes the order of summation, but in the game, the outcomes are determined randomly by the coin tosses, not by an artificial reordering. The probabilities are inherently tied to the sequence of tosses, so the natural order must be used for expectation.
       - While the positive terms (winning rows) and negative terms (losing rows) individually diverge (meaning their sums are infinite in magnitude), their combined alternating sum converges to \( \ln 2 \) when taken in sequence. This is a standard result for conditionally convergent series like the alternating harmonic series.
       - Marcus's claim that the game is "worth whatever anyone says" is incorrect and based on a misinterpretation. The rearrangement is a theoretical curiosity but does not alter the actual expected value of the game as played.

     **Recommendation:** The 69p figure should be retained on the sign as it is the correct expected payout based on the game rules. Explain to Marcus that the rearrangement argument is irrelevant for pricing because it doesn't reflect the real-world probabilities.

  #### 2. **If the game has no ordinary average, is there an entry fee where playing is plainly bad or good?**
     - **The expected value is well-defined as 69p**, so for a single game, the entry fee \( f \) (in pounds) determines whether playing is favorable:
       - If \( f < 0.693 \) (e.g., 50p), the game has positive expected value for the player, meaning it is theoretically favorable "on average" over many plays. However, due to the infinite variance (discussed below), this does not guarantee a profit for every player in a single game—it only means the long-term average should converge to a gain if the game could be played infinitely under stable conditions.
       - If \( f > 0.693 \) (e.g., £20), the game has negative expected value for the player, meaning it is plainly a bad idea to play, as players will lose money on average over time.
       - If \( f = 0.693 \), the game is fair on average (expected net gain of zero for the player).

     - **However, there is a critical issue: the game has infinite variance and heavy tails.**
       - The net payout \( Y \) satisfies \( E[|Y|] = \infty \) because the tail probabilities decay slowly (e.g., \( P(|Y| > t) \approx t^{-1} \) for large \( t \)). This means:
         - A single game can result in extreme gains or losses with low probability (e.g., a 1 in 1 million chance of winning or losing tens of thousands of pounds if \( n \) is large).
         - For a player, even with a positive expected value (e.g., \( f = 50p \)), there is a small risk of a massive loss (e.g., losing £10.67 if the first heads is on the fourth toss). Conversely, there is a high probability (50%) of an immediate £1.50 net gain if heads on the first toss, but this does not eliminate the risk.
       - Thus, for a single play:
         - With \( f < 69p \), playing is "plainly fine" only for risk-tolerant players, as the high chance of a small win is attractive, but the infinite variance makes it potentially hazardous. For risk-averse players (e.g., those who cannot afford large losses), it could be plainly bad due to the tail risk.
         - With \( f > 69p \), playing is plainly bad for almost all players, as both the expected value and the risk are unfavorable.
         - With \( f = 69p \), it is fair on average but still risky due to variance.

     - **The observation that half of players win £2 immediately** is relevant for player psychology (it may attract participants) but not for the expected value. It is part of the distribution—50% of players net £1.50 (after a 50p fee), but the other 50% face potential losses, and the overall average is 69p.

     **Recommendation:** For a single game, charge no more than 69p to avoid deterring players, but warn that the risk of large losses exists. If the goal is to ensure players have a positive experience, a lower fee like 50p might be acceptable, but the hospice may lose money on average (see Section 4).

  #### 3. **Does buying a 100-game season ticket help (do swings even out)?**
     - **Without capping, repetition does not help—the swings do not even out reliably.** Here's why:
       - Because \( E[|Y|] = \infty \), the law of large numbers does not apply. The average payout over many games, \( \frac{S_k}{k} \) (where \( S_k \) is the total net payout over \( k \) games), does not converge to 69p. Instead:
         - The heavy-tailed nature of \( Y \) means that rare, extreme outcomes (e.g., a very large \( n \)) dominate the sum. As \( k \) increases, \( \frac{S_k}{k} \) can diverge to \( +\infty \) or \( -\infty \) almost surely, or oscillate wildly. For example, just one occurrence of \( n = 20 \) (which has probability \( \approx 10^{-6} \)) could contribute over £50,000 to the sum, swamping other results.
         - Marcus's offer of a season ticket for £20 per game (or a flat fee) is exploitative. If the fee is high (e.g., £20), players are guaranteed to lose money on average. Even with a low fee, the lack of convergence means players could face massive net losses (or gains) due to luck, not probability.
       - Thus, a season ticket does not reduce risk—it amplifies it because more plays increase the chance of encountering an extreme outcome.

     - **With capping (e.g., at 20 tosses), repetition does help:**
       - If the game is capped (see Section 4), \( E[|Y|] < \infty \) and variance is finite. The law of large numbers applies, so \( \frac{S_k}{k} \) converges to the expected value as \( k \) increases. Swings even out, and the season ticket becomes predictable.

     **Recommendation:** Reject Marcus's season ticket proposal unless the game is capped. Without capping, it is not actuarially sound—players (or the hospice) could face unlimited liability. With capping, a season ticket could be viable if priced fairly.

  #### 4. **Is capping the table at 20 tosses a valid way to measure the same game?**
     - **Capping is not the same game but a practical and necessary approximation.** 
       - **How it works:** Cap the game at \( M \) tosses (e.g., \( M = 20 \)). If no heads occurs in \( M \) tosses, the game is void, and the entry fee is refunded (net payout = 0). Otherwise, payouts proceed as normal for \( n \leq M \).
       - **Effect on expected payout:** The expected net payout becomes the partial sum of the alternating harmonic series up to \( M \):
         \[
         E[Y_{\text{capped}}] = \sum_{n=1}^{M} (-1)^{n+1} \frac{1}{n}
         \]
         - For \( M = 20 \) (even), this is \( \approx 0.688 \) pounds (68.8p).
         - For \( M = 21 \) (odd), this is \( \approx 0.736 \) pounds (73.6p).
         - As \( M \to \infty \), it converges to \( \ln 2 \approx 69p \), so for large \( M \), it is a good approximation.
       - **Advantages of capping:**
         - It eliminates infinite variance: \( E[|Y|] \) and \( \text{Var}(Y) \) become finite, making the game mathematically well-behaved. The expected value is unambiguous, and the law of large numbers works for multiple plays.
         - The void probability is tiny (e.g., \( (1/2)^{20} \approx 10^{-6} \) for \( M = 20 \)), so it rarely affects play.
         - It avoids the theoretical issues with rearrangement and conditional convergence.
       - **Disadvantages:**
         - It slightly alters the game (voiding very long sequences), but for practical purposes, it is indistinguishable from the uncapped version since \( P(\text{void}) \) is negligible for \( M \geq 20 \).
         - The expected payout oscillates with \( M \) but stays close to 69p (e.g., 68.8p at \( M = 20 \), 73.6p at \( M = 21 \), drifting toward 69p as \( M \) grows).

     **Recommendation:** Cap the game at \( M = 20 \) or \( M = 30 \) for simplicity. This resolves all mathematical ambiguities and makes the expected value clear for pricing.

  ### Overall Recommendation for the Committee
  - **Approve the stall with capping:** Allow Marcus to run the game, but insist on capping the tosses at \( M = 20 \) (or similar) to void the game on no heads after 20 tosses with a full refund. This addresses the mathematical concerns and ensures a well-defined expected value.
  - **Set a fair entry fee:** With capping at \( M = 20 \), the expected payout is about 68.8p. To roughly break even for the hospice (so net revenue is zero on average), set the entry fee at 69p. If you prefer a small profit for the hospice or to account for risk, set it at 70p. Charging 50p (as Marcus proposed) would lead to an expected loss of about 19p per game for the hospice, which is not sustainable.
  - **Reject high fees and season tickets without capping:** Marcus's £20 proposal is unjustifiable and would exploit players. A season ticket should only be considered if the game is capped; otherwise, it is too risky.
  - **Explain the reasoning clearly:**
    - To Marcus: The rearrangement argument is mathematically interesting but does not apply to the game because the outcomes are determined by coin tosses in sequence, not by reordered sums. The 69p is valid, but capping is essential to make the game practical and insurable.
    - To the Treasurer: With capping, the expected net revenue (entry fee minus expected payout) is stable. For example, at a 69p fee and \( M = 20 \), it is approximately zero. Print this expected payout (e.g., "Average net payout: 69p per game") and the capped rules on signage.
    - To Players: Emphasize the 50% chance of a £2 win to attract participants, but disclose the rules clearly (including the cap and void condition).

  By capping the game, you get a well-defined, low-risk stall that preserves the spirit of Marcus's design while ensuring fairness and predictability. This approach aligns with the hospice's charitable goals by avoiding undue financial risk. If you have further questions, consult a probability expert to verify the capped calculations.
