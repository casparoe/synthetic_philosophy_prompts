answer: |-
  Here’s a structured 50-minute teaching arc focused on your **arrow of explanation** vs. **arrow of record** distinction, using the mirror-box thought experiment. The goal is to decouple time asymmetry from entropy clichés and highlight system-environment interactions.

  ---

  ### **Teaching Arc: Time’s Twin Asymmetries**  
  **Total Time:** 50 mins  
  **Core Distinction:**  
  - **Arrow of Explanation:** Why we use *past* states to explain *present* states (causal reasoning).  
  - **Arrow of Record:** Why *traces* of the past exist in the present, but traces of the future do not (information preservation).  

  ---

  ### **Phase 1: Foundations (15 mins)**  
  *Goal: Establish time symmetry in microphysics vs. asymmetry in thermodynamics.*  

  1.  **Hook (3 mins):**  
      - *Pose:* "Why do we say an egg splatters *because* you dropped it, but never say you dropped it *because* it will splatter? What physics makes ‘because’ point backward?"  
      - *Connect to metaphysics:* Link to students’ knowledge of causation (e.g., Hume).  

  2.  **Time Symmetry in Physics (5 mins):**  
      - *Key point:* Newton’s laws, electromagnetism, and quantum mechanics (mention only) are **time-symmetric**. Show equations (e.g., F=ma) unchanged if *t* → *-t*.  
      - *Contrast:* "If I show you a film of colliding billiard balls, you can’t tell if it’s playing forward or backward. Why does this break for eggs, coffee, or people aging?"  

  3.  **Thermodynamic Arrow (7 mins):**  
      - *Reframe entropy:* "Forget ‘disorder’. Entropy increase is about *energy spreading* (e.g., heat flowing from hot→cold) and *loss of usable energy*."  
      - *Crucial asymmetry:* Isolated systems evolve toward higher entropy states. **But:** Emphasize this is *statistical*, not law-like (microstates are reversible; macrostate evolution isn’t).  
      - *Set up the puzzle:* "If physics is time-symmetric, why does entropy always increase *toward the future*? Why not toward the past?"  

  ---

  ### **Phase 2: Mirror-Box Thought Experiment (20 mins)**  
  *Goal: Show asymmetry arises from system-environment interaction, not isolated objects.*  

  1.  **Introduce the Setup (5 mins):**  
      - *Describe:* A hot coffee cup placed inside a perfectly reflective, thermally isolated box. No heat escapes; walls are ideal mirrors (reflect radiation perfectly).  
      - *Question:* "What happens to the coffee? What happens to the box?"  
      - *Reveal:* Coffee cools to room temperature (equilibrium). Box walls *absorb and re-emit* radiation during cooling.  

  2.  **The Asymmetry of Records (10 mins):**  
      - *Present state:* Coffee at room temp. What can we know about its past?  
      - *Key observation:*  
        - **Past information:** Box walls contain thermal "fingerprints" (e.g., specific radiation patterns) *only* from when the coffee was hot. These are *records* of the past.  
        - **Future information:** No traces of the coffee’s *future* exist in the box. Why?  
      - *Mechanism:* When coffee was hot, it emitted radiation that *imprinted* on the walls. At equilibrium, no new imprints form.  
      - *Punchline:* **Arrow of record** exists because the environment (box) *preserves information* about the system’s *past* non-equilibrium state, but not its future.  

  3.  **The Asymmetry of Explanation (5 mins):**  
      - *Ask:* "Why is the coffee at room temp *now*? Can we explain it by appealing to its *future* state?"  
      - *Contrast:*  
        - **Correct explanation:** "It cooled *because* it was hot earlier in a cold box."  
        - **Absurd explanation:** "It was hot earlier *because* it will be cool later."  
      - *Link to box:* The box’s records (past imprints) *enable* the explanation but don’t *cause* it. **Arrow of explanation** relies on the *physical dependency* of present on past.  

  ---

  ### **Phase 3: Addressing Misconceptions (10 mins)**  
  *Preempt during relevant phases:*  

  1.  **"Entropy = Messiness" (address in Phase 1):**  
      - *When introducing entropy:* "Calling it ‘disorder’ misleads. Entropy is about *energy distribution* and *number of microstates*. A broken cup isn’t ‘messy’—it’s in a high-entropy state because fragments allow more energy configurations."  

  2.  **"Time Flows Like a River" (address in Hook/Phase 2):**  
      - *During hook/explanation asymmetry:* "Physics doesn’t describe time ‘flowing’. Asymmetry is about *correlations*: present states correlate strongly with past states, weakly with future."  

  3.  **"Past is Fixed Because We Remember It" (address in Phase 2):**  
      - *During record discussion:* "Our memories are *physical records* (like the box’s imprints). But the box shows records exist *even without observers*. The asymmetry is in the physics of information preservation."  

  ---

  ### **Phase 4: Check for Understanding (5 mins)**  
  **Question:**  
  > *"Imagine a wine glass shatters on the floor. We explain this by saying ‘it fell off the table’. We also see fragments that let us reconstruct how it fell. Using today’s terms:  
  > (a) Is the ‘fragments as evidence’ an example of the arrow of record or explanation?  
  > (b) Could the arrow of explanation work without the arrow of record? Why?"*  

  **Why this works:**  
  - (a) Tests **record** (traces enable reconstruction).  
  - (b) Tests **explanation** (dependency exists even if no traces survive; e.g., if cleaned up instantly). Reveals they’re distinct: explanation is about counterfactual dependency; record is about information storage.  

  ---

  ### **What’s Excluded & Why**  
  1.  **Quantum decoherence:** Adds unnecessary complexity; not needed for classical thermo asymmetry.  
  2.  **Cosmological boundary conditions** (e.g., past low-entropy Big Bang): Highly contested; would distract from the system-environment focus.  
  3.  **Statistical mechanics details** (e.g., Liouville’s theorem): Beyond scope. Stick to qualitative "microscopic reversibility vs. macroscopic irreversibility".  

  ---

  ### **Settled vs. Contested Views**  
  | **Settled (State Clearly)**                     | **Contested (Flag as Open Debate)**              |  
  |-------------------------------------------------|--------------------------------------------------|  
  | Microscopic laws are time-symmetric.            | **WHY** the universe had low entropy in the past. |  
  | Isolated systems increase entropy toward future.| Whether the arrow is **fundamental** or **emergent**. |  
  | Records require low-entropy environments.       | If arrows could reverse in other spacetime regions. |  
  | Explanation asymmetry relies on entropy gradient. | Whether arrows are purely **epistemic** or **ontic**. |  

  ---

  ### **Session Flow Recap**  
  1.  **0-15 mins:** Foundations (symmetry vs. thermo asymmetry).  
  2.  **15-35 mins:** Mirror-box walkthrough (records → explanation).  
  3.  **35-45 mins:** Misconceptions + Q&A.  
  4.  **45-50 mins:** Check-for-understanding + wrap-up.  

  **Key Takeaway for Students:**  
  *"Time’s arrows aren’t about ‘time flowing’—they emerge from how systems interact with environments. The coffee cup’s past leaves traces in its box; its future doesn’t. That’s why explanations point backward, not forward."*  

  This structure forces engagement with your distinction while sidestepping overused entropy tropes. The mirror-box makes the environment’s role undeniable.
