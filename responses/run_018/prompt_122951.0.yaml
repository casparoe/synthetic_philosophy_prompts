prompt: |-
  For several years I worked on governance and anti-corruption programmes for an international organisation, mostly in two countries with very different political economies, and I have since spent time on the compliance side of a large institution. I find that I trust my verdicts about particular episodes far more than I trust any of the general definitions that get wheeled out, and I would like to know whether these verdicts add up to a single principle or whether I have simply been inconsistent in ways that flatter me.

  Here are the cases, with my verdicts.

  1. A road contractor makes a large, entirely legal, publicly disclosed donation to the minister's re-election campaign during the month the tender is being evaluated, and is awarded the contract. Verdict: corrupt.

  2. A shipping agent pays a customs officer the equivalent of twenty dollars to release a container that has already been cleared, after the officer has let it sit for four days. Verdict: corrupt, but at the trivial end.

  3. A woman gives the nurse who has just delivered her baby a small envelope of cash, in a public clinic where the nursing staff have not been paid for months and where every patient's family does this. Verdict: not corrupt. I want to say it is a survival tax, not a bribe.

  4. A pharmaceutical representative pays for a hospital department's dinners and a conference trip abroad; the department then switches its standard prescription to her product, which is not otherwise superior to the cheaper alternative. Verdict: corrupt.

  5. A family gives a village headman a goat the week before he mediates their land dispute; he rules for them. The gift is small, public, and entirely expected by everyone in the village. Verdict: corrupt, though I feel much less certainty here than in case 1, and I worry that my certainty is imported.

  6. At the New Year, officials and the business people they deal with exchange expensive gifts of a kind fixed by convention, with no favour requested and no specific decision in view. Verdict: I cannot bring myself to call it corrupt, and I am not sure whether that is a verdict or a failure of nerve.

  7. A local big man distributes pigs and shell valuables that are his own, on his own land, to a following that then owes him their labour and their votes. Verdict: not corrupt. That is what political standing consists of there.

  8. A member of parliament pays for constituents' funerals out of a constituency development fund, and attends them. Verdict: I recoil at this, more than at 7, but I cannot say that it is corrupt in the way case 1 is, and I don't know what the difference is made of.

  9. A manager hires his cousin over a stranger with slightly better qualifications. Verdict: corrupt, but a different animal from bribery, and I could not say which of the two is worse.

  10. A regulator leaves for a well-paid advisory post with an industry she supervised, having made no decision in its favour while in office. Verdict: corrupt, or at least adjacent to it.

  11. A wealthy donor funds a think tank whose research reliably supports positions favourable to his interests; there is no instruction, no review of outputs before publication, and the researchers are sincere. Verdict: not corrupt, though I think it degrades something.

  12. A minister awards contracts to firms owned by men from his own district, taking nothing for himself, out of a sense of obligation to people who supported him. Verdict: corrupt — this is the case that frightens me most, and the one where I have least idea what I am saying.

  I have been testing these against a device of my own, which I call the reverse-market test: rewrite the episode as an outright sale, and ask what the office-holder is handing over. If what she hands over is something she has no right to sell — a decision, a permit, a contract, a place in a queue, a hire, a grade — then the exchange is corrupt, whoever is selling and whatever the local custom. If what she hands over is only her own labour at a task nobody was otherwise owed, or her own property, then it is not. That gets 1, 2, 4, 5, 8, 9, 10 and 12 on my side of the line, and it gets 7 and 11 as well. But it convicts the nurse in 3, which I refuse to accept, it is silent on 6 because nothing is handed over, and I notice that it requires an exchange at all: it has nothing to say about a treasurer who simply transfers money to his own account, or about pure favouritism with no payment, which are the cases I would have thought were the heart of the matter.

  So: state for me the best principle, or the two or three best candidates, precisely enough that I could apply it without consulting you again, and for each clause name the case it is there to secure and the case it forces me to surrender. Tell me honestly which of my verdicts are sentiment rather than judgement, and in particular whether the envelope in 3 is excused but corrupt, or not corrupt at all. Then give me the principle's verdict on the case I have never settled — a bottle of whisky I gave, after the fact, to a district official who had expedited permits for our field office, with no expectation on either side of anything further — and on two cases of your own choosing that I have not listed.

  Finally, the question I actually care about. Every account I can construct seems to presuppose a particular picture of what an office is: that it is separable from the person holding it, that it comes with a defined jurisdiction, and that its reasons are supposed to be impartially available to anyone within that jurisdiction. That picture is not the one at work in cases 5, 7 and 8. Does the principle you offer simply take the side of that picture and call the others corrupt by definition, or can it be stated so that it applies to the headman and the big man without collapsing into saying that whatever local opinion permits is permissible? If it cannot, tell me what I lose by accepting a parochial principle, and whether it still condemns the contractor in case 1 and the minister in case 12.
reasoning: |-
  Hmm, this is an incredibly rich and nuanced query about corruption judgments from someone with deep field experience. The user presents 12 detailed cases with their personal verdicts, tests them against a "reverse-market" principle they've devised, and raises profound questions about cultural relativism in governance ethics. 

  First, I need to recognize the user's expertise - this isn't some academic exercise but a distillation of years of frontline work. Their discomfort with case 12 shows admirable intellectual honesty. The core tension seems to be between universalist institutional ethics and culturally embedded practices.

  Their reverse-market test is clever but revealingly flawed: it convicts the underpaid nurse (case 3) which their conscience rejects, and fails to address cultural gift economies (cases 6-7). This suggests we need principles that distinguish between survival payments, cultural reciprocity, and actual power abuses.

  For the principles, I'm considering three angles: 

  First, the "office-as-trust" approach that focuses on whether a public function was diverted from its purpose. This would condemn case 1 (contractor donation) and case 12 (minister's district favoritism) because public resources were privatized, while possibly excusing case 3 (nurse) as survival necessity and case 7 (big man) as cultural office definition.

  Second, a "harm-centered" principle asking who benefits/loses. This might better handle case 5 (village headman) where community norms seem consenting, but still condemn case 12 where public funds are abused.

  Third, the "integrity-of-process" test - whether the act undermines institutional fairness. This nails case 4 (pharma dinners) and case 10 (revolving door), but struggles with case 6 (New Year gifts) where no immediate decision is compromised.

  None are perfect. The whisky case they mention (post-factum gift with no expectations) is tricky - I'd argue it fails the trust principle if the officer's function was expediting permits, but might pass if seen as personal gratitude.

  About their deepest concern: We can't avoid privileging some concept of office. But we can make it flexible enough to respect cultural variants (like the big man's role) while drawing lines at universal harms - like when outsiders are excluded (case 12) or systemic fairness corrodes (case 1). The condemnation of case 1 and 12 should stand because they abuse collective resources, regardless of local norms.

  What's moving here is their moral wrestling - that moment in case 12 where they feel frightened by their own judgment shows extraordinary ethical sensitivity. My response should honor that depth while providing analytical clarity.
answer: |-
  Your experiences reveal a core tension in corruption studies: the gap between abstract definitions and contextual judgment. After analyzing your cases against major ethical frameworks, I propose this principle:

  **The Public Trust Principle**  
  *An act is corrupt when someone vested with collective authority (by election, appointment, or social recognition) exchanges or leverages that authority for private advantage (personal, familial, or factional), thereby betraying the trust inherent in their role by subverting its intended social function.*

  ### Key Components & Case Applications:
  1. **Collective Authority**  
     (Secures: Cases 1, 4, 5, 9, 10, 12 | Surrenders: None)  
     Requires socially recognized responsibility (e.g., minister, regulator, headman). Condemns case 12 because ministerial authority exists to serve the *whole* public, not just supporters.

  2. **Betrayal of Role Function**  
     (Secures: Cases 1, 2, 3, 4, 8 | Surrenders: Case 7)  
     Judges whether the act undermines the role’s core purpose. Excuses case 3 (nurse’s role is patient care; survival payments sustain that function) and case 7 (big man’s role *is* reciprocal patronage). Condemns case 8 (using development funds for funerals perverts public resource allocation).

  3. **Private Advantage ≠ Cultural Reciprocity**  
     (Secures: Cases 5, 6, 7 | Surrenders: None)  
     Distinguishes self-enrichment/cronyism from culturally embedded reciprocity. Condemns case 5 (headman’s mediation should be impartial; goat creates obligation). Excuses case 6 (ritual gifts maintain relationships, not direct influence).

  ### Your Verdicts Reassessed:
  - **Sentiment-Driven**: Case 8 (recoil stems from wasted public funds, not inherent corruption—this *is* corrupt under the principle). Case 12 (your fear confirms its legitimacy: nepotistic allocation betrays public trust).  
  - **Case 3**: The nurse’s act is **not corrupt**—it’s survival sustaining role function, not private gain.  
  - **Case 11**: Correctly “not corrupt” (funding research isn’t wielding authority; degradation is ethical, not corrupt).

  ### New Case Verdicts:
  - **Your Whisky Case**: *Corrupt*. Expediting permits is an official function; post-factum gifts privatize trust. No "sale" occurred, but leveraging access for personal benefit violates role integrity.  
  - **Added Case A**: A professor accepts a student’s expensive gift before grading finals. *Verdict: Corrupt* (academic authority subverted for private gain).  
  - **Added Case B**: A community elder redistributes disaster aid based on lineage ties. *Verdict: Not corrupt* if his recognized role includes kinship obligations (e.g., in segmentary societies).

  ### Addressing Your Core Concern:  
  **The principle doesn’t impose a Western "office" model but demands consistency with the role’s *socially conferred purpose*:**  
  - For the headman (case 5), if mediation is *meant* to be impartial, the goat corrupts. If his role expects gifts-as-tribute, it’s not corrupt—but you’d condemn case 1 regardless, as ministerial roles universally require impartial resource allocation.  
  - **What you lose with parochialism**: The ability to critique *internal harms*. Case 12’s minister may satisfy local expectations, but systematically excluding outsiders undermines equitable development. The principle condemns it because authority was vested for broader public service.  

  **Crucially, this still condemns:**  
  - Case 1: Minister sells contract decisions (public resource) for campaign support (private/political gain).  
  - Case 12: Minister diverts public contracts to in-group (factional advantage), betraying the role’s purpose.  

  **Conclusion**: Your instinct to distrust rigid definitions is sound—corruption is a betrayal of context-specific trust. This principle respects cultural office conceptions while condemning acts that hollow out institutions by privatizing their social function. Your verdicts largely align with it, except case 8 (sentiment) and case 3 (correctly absolved). The "reverse-market test" oversimplifies by ignoring role legitimacy and survival economies.
