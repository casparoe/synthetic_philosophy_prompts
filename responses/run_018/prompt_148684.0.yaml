    *→ Go to Q6*  
  - **(B) The organism intrinsically cannot resume consciousness?**  
    *→ Go to Q7*  

  **Q6: [Tech-relative irreversibility]**  
  **Is brainstem failure sufficient if cortical activity is still detectable?**  
  - **(A) Yes** → *Position: **Consciousness-first with tech-relativity** (accepts brainstem death as irreversible with current tech)*.  
  - **(B) No** → *Position: **Cortex-essentialist** (death requires direct loss of cortical function)*.  

  **Q7: [Intrinsic irreversibility]**  
