  Below is a decision tree that sorts positions on legal death criteria by their concrete commitments. Each node is a yes/no or either/or question designed to be answerable without predefined labels, focusing on logical space first. Positions are mapped at the leaves, with empty branches flagged as **incoherent**, **unattractive**, or **unexplored**. The tree includes the requested positions and addresses irreversibility, circulatory arrest (with ECMO), brainstem failure, and the legal/biological death distinction.

  ### **Decision Tree for Legal Death Criteria**

  #### **Root Question**  
  **Q1: Is death fundamentally defined as:**  
  - **(A) Irreversible collapse of organism-level biological integration (e.g., loss of self-sustaining physiology)?**  
    *→ Go to Q2*  
  - **(B) Irreversible loss of consciousness/psychological continuity (e.g., no capacity for subjective experience)?**  
    *→ Go to Q5*  

  ---

  #### **Branch A: Biological Integration (BI) Views**  
  **Q2: Should "irreversible" mean:**  
  - **(A) Cannot be reversed given current technical capabilities (e.g., ECMO exists but isn't used)?**  
    *→ Go to Q3A*  
  - **(B) The organism lacks the intrinsic capacity to resume function (e.g., heart cannot auto-restart)?**  
    *→ Go to Q3B*  

  **Q3A: [For tech-relative irreversibility]**  
  **Does circulatory arrest alone justify death declaration if ECMO could technically restore circulation?**  
  - **(A) Yes** → *Requires legal/biological divergence (see Q10)*.  
  - **(B) No** → *Incoherent: If death requires irreversible collapse of integration, and technology can restore it, arrest isn't death. No coherent position here* ❌.  

  **Q3B: [For intrinsic irreversibility]**  
  **Which criterion marks biological integration collapse?**  
  - **(A) Whole-brain failure (all functions ceased, including cortex and brainstem)**  
    *→ Go to Q4A*  
  - **(B) Brainstem failure alone (even if cortical activity is detectable)**  
    *→ Go to Q4B*  
  - **(C) Circulatory/respiratory arrest (ignoring ECMO's potential)**  
    *→ Go to Q4C*  

  **Q4A: [Whole-brain failure]**  
  **Is brainstem failure sufficient only if it guarantees future cortical death?**  
  - **(A) Yes** → *Position: **Intermediate-BI hybrid** (rare; brainstem matters as a proxy for future cortical loss, not present integration collapse)*.  
  - **(B) No** → *Position: **Whole-brain integrationist** (death occurs only when all brain functions cease)*.  

  **Q4B: [Brainstem failure alone]**  
  **Is detectable cortical activity irrelevant to declaring death?**  
  - **(A) Yes** → *Position: **Brainstem integrationist** (brainstem is the "integrator"; cortex is epiphenomenal)*.  
  - **(B) No** → *Contradicts branch premise. Incoherent* ❌.  

  **Q4C: [Circulatory/respiratory arrest]**  
  **Does ECMO availability negate irreversibility?**  
  - **(A) No** → *Position: **Traditional circulatory view** (rejects ECMO; arrest is intrinsically irreversible)*.  
  - **(B) Yes** → *Unattractive: Undermines circulatory criteria when tech exists. No major adoption* ❌.  

  ---

  #### **Branch B: Consciousness/Psychological Continuity (PC) Views**  
  **Q5: Should "irreversible" mean:**  
