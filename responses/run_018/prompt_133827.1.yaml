answer: |-
  Here's an example illustrating the tension, followed by an analysis:

  **Scenario: The Wrongness of Institutionalized Segregation**

  1.  **The Naturalized Moral Claim:** Quinean naturalism treats the moral property "wrongness" as a complex, higher-order natural property. Suppose we identify the wrongness of institutionalized racial segregation (like Jim Crow laws) with a natural property complex: **"causing systematic, severe, and unnecessary psychological harm and hindering the development of fundamental cognitive and social capacities in a significant portion of the population, due to arbitrary and immutable characteristics."** This complex property is empirically detectable through psychology, sociology, history, and biology. We observe the trauma, stunted potential, social discord, and lack of scientific basis for racial hierarchy.

  2.  **The Modal Commitment:** To genuinely call this practice *wrong*, we need to assert more than its *actual* causal effects. We need to assert that **if** this practice *were* to exist in a different context or society (say, a society with different psychological vulnerabilities or social structures), it *would still* be wrong **in virtue of** its core features – the systematic exclusion, degradation, and arbitrary disadvantaging based on immutable characteristics. The wrongness seems *necessarily tied* to these core relational or functional properties (e.g., "systematically degrading based on immutable characteristics"). The actual psychological harm *in our world* is strong evidence, but the moral condemnation persists even in conceivable counterfactual scenarios where the *specific* harms observed might be absent (e.g., a hypothetical society where the oppressed group has unusual psychological resilience, yet the practice remains deeply unjust).

  3.  **Quine's Anti-Essentialism Conflict:** Quine rejects *de re* necessity – the idea that things have necessary properties in themselves. For Quine, there is no fact of the matter about *what segregation necessarily is*. We can describe it extensionally (the set of all actual segregation instances) or via various descriptions ("the practice in Alabama 1950", "the cause of harm X", "the system enforcing racial hierarchy"). But there is no "essence" of segregation that *must* include causing psychological harm or being wrong. Wrongness, on his naturalistic view, is just a contingent property supervening on other contingent natural properties in our world. To say segregation is *necessarily* wrong because of its core features (e.g., systematic arbitrary exclusion) is precisely the kind of modal essentialism ("wrongness is an essential property *of practices with feature F*") that Quine dismisses as unintelligible.

  **Why the Ontology/Ideology Distinction Doesn't Resolve the Tension:**

  Quine distinguishes:
  *   **Ontology:** What exists (e.g., physical objects, sets, perhaps psychological states).
  *   **Ideology:** The conceptual resources we use to describe the world (predicates, concepts).

  He might argue: "Wrongness exists (ontology) as a natural property complex. Our *concept* of wrongness (ideology) might involve counterfactual talk, but this is just a feature of our language, not a commitment to *real* modal properties in the world. We can paraphrase away the modal language."

  *   **The Problem:** The tension isn't merely about *how we talk* (ideology); it's about what the naturalized moral property *itself* seems to require to function *as a normative property* rather than a purely descriptive one.
      *   If wrongness is *just* the descriptive property "causing harm H in context C," then in a world without H (even if the core features F of segregation are present), the practice isn't wrong. This seems counterintuitive to the moral condemnation. We want to say it's wrong *because* of F, and H is just a typical *consequence* of F in our world.
      *   To capture the normative, reason-giving force ("This is wrong *and should be stopped/changed*, regardless of whether *this specific harm* might hypothetically vanish"), the property needs to have a counterfactual stability tied to its core features (F), not just its actual contingent effects (H in C). This counterfactual stability *looks like* a modal commitment to F necessarily grounding wrongness.
      *   Paraphrasing the modal talk away (e.g., "We have a strong disposition to condemn F-like practices") reduces the moral property to a descriptive fact about *our* reactions or linguistic habits, not a property of the *practice itself* that provides a reason for action independent of our contingent psychology. It collapses normativity into description.

  **What This Reveals about Quinean Naturalized Ethics:**

  This tension reveals a fundamental challenge:

  1.  **The Ineliminability of Modality for Normativity:** Genuine moral properties, to be normative and provide reasons for action that transcend mere description of current states of affairs, seem to require some form of modal "oomph." They need to support counterfactuals about what *would* be wrong/right *if* circumstances changed, grounded in the essential features of actions/institutions. Quine's anti-essentialism rigorously excludes this.
  2.  **The Collapse into Descriptivism:** Without accommodating this modal dimension, the Quinean naturalist risks reducing "wrongness" to a purely descriptive label for a complex set of observable, contingent harms or social dysfunctions ("causes pain P, conflict C, inefficiency I"). While this is naturalistically respectable, it evacuates the *normative* content. Calling segregation "wrong" becomes synonymous with saying "it causes these specific harms," lacking the prescriptive force that motivates change even if (counterfactually) those specific harms were absent, or the force that condemns conceptually similar practices *because* they share the core unjust features. Moral language becomes descriptive sociology or psychology.
  3.  **The Difficulty of Genuine Naturalized Normativity:** The scenario suggests that Quinean naturalism, by its strict rejection of modality and essentialism, struggles to accommodate the robust normativity inherent in moral discourse. It can describe moral *beliefs* and their causes, and identify complex descriptive properties we *label* "wrong," but it struggles to capture why these properties *should* matter or command action in a way that transcends contingent descriptions of the world. The tension reveals a potential gap between a purely descriptive natural science framework and the inherently modal, reason-involving nature of ethical thought and language.

  In essence, the tension shows that while Quine wants to place ethics within science, his specific metaphysical constraints (anti-essentialism, extensionalism) may prevent him from naturalizing the *normative force* of ethics without reducing it to something non-normative. The descriptive property identified might be necessary for wrongness in our world, but its sufficiency *as a moral property* seems to depend on modal connections Quine cannot allow.
