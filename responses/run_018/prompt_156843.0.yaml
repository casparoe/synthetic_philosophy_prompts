answer: |-
  Dr. Elara Vance wiped sweat from her brow, the humidity clinging like the river mist that perpetually veiled the village of Aethel. Kael, her primary informant, crouched by the water’s edge, his dark eyes fixed on the swirling currents. Elara pointed at the muddy flow.

  "*Soli*?" she ventured, the word tentative on her tongue. It was her current best guess for the ever-present brown water.

  Kael didn’t look up. "*Soli*," he confirmed, but his finger traced not the water itself, but the specific pattern of a small whirlpool forming and vanishing near a half-submerged log. "*Soli*," he repeated, gesturing emphatically at the churning vortex just as it dissipated into the broader current. He then pointed upstream, where the water ran smoother over rocks. "*Las*," he said.

  Elara scribbled furiously in her notebook:
  * *Soli*: turbulent water flow? Specific eddy?
  * *Las*: smoother flow? Over rocks?

  Frustration gnawed at her. Every attempt to pin down a word for the river itself – a persistent *thing* – met with deflection. Yesterday, pointing at a calmer stretch, she’d said "*Soli*?" Kael had shaken his head. "*Las*," he corrected, then pointed to the exact same spot moments later as a ripple disturbed it. "*Soli*."

  Now, she tried a different tack. She scooped water into her cupped hands, holding it out. "This? *Soli*? *Las*?"

  Kael looked genuinely puzzled. He gestured vaguely at her hands. "*Dral*," he said, then pointed at the water dripping between her fingers back into the river. "*Soli*." He seemed to be indicating the *act* of falling, the momentary splash, not the substance held or the river receiving it.

  Elara sighed, erasing her previous entry. Her translation manual draft felt like building on sand. Page after page listed verbs, descriptors of state and change: *flowing-fast*, *sparkling-shallow*, *eddied-surface*, *deep-silent*. Nouns were elusive ghosts. She'd tried "*river*," but Kael only ever referenced specific aspects: the sound it made at night (*Vesh*), the way it cut the bank (*Cor*), the coolness felt when stepping in (*Nim*). Never the entity.

  One sweltering afternoon, a large branch, swept downstream, snagged on rocks near Kael. Elara pointed. "*Kael, soli*?" she asked, hoping to associate the debris with the water flow.

  Kael frowned. He touched the trapped branch. "*Gan*," he said firmly. Then he pointed at the water surging *around* the branch, fighting its obstruction. "*Soli*." He made a pushing motion with his hand. "*Gan*," he touched the wood again, "*soli-against*." The branch wasn't an object *in* the flow; it was an event *interacting* with the flow-event.

  Elara felt a familiar headache building. In her notes, she had instinctively written:
  * Object: Branch (Gan)
  * Action: Water flowing against (Soli-against)

  But looking at Kael’s patient, expectant face, she scratched it out. She hadn’t *heard* "against" as a separate word. It was all bound into '*soli-against*', describing the specific configuration of flow *in relation to* the obstacle-event '*gan*'. There was no 'branch' enduring through time; there was '*gan*' – the snagging-resistance-here-now – inseparable from the watery turbulence it provoked.

  That evening, reviewing her manual by the dim light of a resin lamp, the pattern screamed at her. Every entry where she’d tried to denote a stable object – ‘vessel’, ‘stone’, ‘person’ – was built from Kael’s descriptions of fleeting states, positions, or interactions. Her gloss for ‘Kael’ itself read:
  * *Kael*: (context-dependent) the-speaking-presence, the-sitting-by-river, the-pointing-finger, the-correcting-voice.

  She’d meticulously recorded his utterances about '*the-walking-presence*', '*the-sleeping-warmth*', '*the-teaching-voice*', but she’d filed them all under the heading ‘Kael (Person)’. She’d *created* the enduring substance ‘Kael’ by grouping these disparate event-clusters together in her manual. The language itself offered no such unifying noun. Kael never referred to himself as a persistent entity, only as the current manifestation of activity or presence.

  The horror of understanding washed over her, cold despite the heat. It wasn't just rabbits or undetached parts. It was *everything*. Her entire translation project, her painstakingly built bridge between languages, was an elaborate smuggling operation. She wasn’t decoding their ontology; she was *imposing* her own. Every noun she used, every pronoun, every assumption of temporal persistence woven into her grammar, was a foreign artifact smuggled into the stream of Aethel speech. Their world wasn't made of things that *were* and *endured*; it was a ceaseless flux of happenings, phases, and relational configurations. '*Soli*' wasn't water, or even a rabbit-stage; it was a specific, unrepeatable turbulence-event in the endless flow. '*Gan*' wasn't a branch, but an obstruction-event.

  Kael entered her hut, bringing a gourd of water. He placed it on the woven mat. "*Nim-drink*," he said, indicating the coolness-offered-now.

  Elara looked at the gourd, then at Kael. The word '*vessel*' died on her lips. What was it here, now? '*Container-holding-coolness*'? '*Round-smoothness-on-mat*'? All temporary states. She pointed a trembling finger at the gourd itself, desperate for an anchor. "This... *name*?"

  Kael tilted his head, then touched the gourd. "*Nim-source*," he said, then gestured to the water inside, "*contained-cool*." He tapped the mat beneath it. "*Supporting-here*." He offered no single term for the object. Only its current functional and relational phases.

  Elara looked down at her open notebook, filled with her neat, betraying script. Columns of Aethel phrases faced columns of her translations – translations riddled with nouns implying endurance, with subjects separate from their actions. They weren't windows; they were walls. Each entry solidified the illusion of objects she insisted on seeing in a world that spoke only of flux. The river’s murmur outside seemed to mock her. She closed the notebook slowly, the sound loud in the sudden silence of her shattered understanding. How could she translate a world of pure becoming into a language built on being? Every word she wrote was a lie.
