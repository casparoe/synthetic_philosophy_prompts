prompt: |-
  Give your credence — decomposed into explicit sub-questions with rough probabilities — that, in genuinely hard cases where social rules and individual conscience conflict and neither side is manifestly corrupt, the German-style folk emphasis on rule-following and social order produces morally better long-run outcomes than the American-style elevation of individual conscience as final arbiter, where "better" means greater preservation of moral agency together with lower moral residue (the harm left unredressed after either rules are obeyed or conscience is followed). Put your bottom-line number in the first sentence, with no preamble and no restatement of the question. Then break the judgment into at least four parts: (1) whether these two folk moralities can be characterized cleanly enough to compare; (2) whether moral residue is a coherent, non-question-begging metric; (3) whether sustained rule-following tends to suppress or preserve moral agency across generations; and (4) whether individual conscience operates more often as genuine moral insight or as motivated rationalization. For each part assign a rough probability that it resolves in favor of the German model, explain how they combine into your final credence, identify which part your number is most sensitive to, and state what kind of evidence or argument would move it most. Separate what is relatively settled among people who study the comparison from what remains genuinely contested, and do not present a contested view as the consensus.
