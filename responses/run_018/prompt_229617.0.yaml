  Okay, the user is leading a reading group on vagueness that's stuck in a four-year stalemate between supervaluationists and epistemicists. They've pinpointed the core positions: supervaluationists see "bald" as partially defined with truth-value gaps in borderline cases, while epistemicists insist there's always a sharp boundary we just can't know. Frustratingly, both sides agree on the sorites paradox, classical logic, and non-defectiveness of vague language—yet nobody budges.  

  The user suspects the disagreement isn't about language per se but about what semantics should *do*. Supervaluationists want semantics to capture what communal practice settles; epistemicists want it to track inaccessible truths. If that's right, the deadlock stems from conflicting goals for semantic theory.  

  Now, the user isn't asking who's correct—they want to diagnose the *nature* of this disagreement. Is it empirical? Verbal? Intuition-driven? And crucially, could anything break the stalemate?  

  Hmm. First, I agree the divide isn't primarily about linguistic evidence. Both theories accommodate the same data (sorites, classical logic). The real friction is meta-semantic: what *makes* vague sentences true? Supervaluationists tie truth to communal norms (what sharpenings are admissible), while epistemicists tie it to brute facts (hair counts + use). This echoes Carnap's "internal vs. external" questions—it's a clash of frameworks.  

  Formally, both approaches are coherent. Supervaluationism uses precisifications to model truth-value gaps; epistemicism preserves bivalence via unknowable boundaries. Neither is "inconsistent," so formal results won't resolve this.  

  Empirically? Tricky. Brain scans won't reveal whether "bald" has a sharp boundary. But maybe indirect evidence could nudge someone: if cognitive science shows our vague concepts *function* as partial definitions (e.g., prototype-driven gradience), supervaluationists might claim support. If evidence suggests we *tacitly* commit to sharp boundaries (e.g., in probabilistic reasoning), epistemicists gain ground. Still, either side can reinterpret such findings.  

  The deepest divide might be about semantic "oughts." Supervaluationists think semantics shouldn't posit unknowable truths; epistemicists think it *must* to avoid gaps. This feels like a foundational choice—like preferring Occam's razor vs. preserving bivalence. No argument forces one choice; it's about what seems explanatorily virtuous.  

  Could anything move the needle? A formal result showing one approach *can't* handle higher-order vagueness might hurt, but both have responses. A discovery about concept acquisition (e.g., children infer sharp boundaries?) could sway, but it'd be hotly contested. Most likely? The stalemate persists because it's not solvable by semantics alone—it's about what we want from a theory of meaning.  

  So I'll tell the user: Your diagnosis is sharp. This is a meta-semantic clash over truth-grounding, amplified by divergent theoretical virtues. It's not verbal (both sides mean "truth" classically), nor purely empirical. To break the deadlock, maybe pivot the group toward *why* we care about semantics—is it to explain communication? Cognition? Metaphysics? That might not settle it, but could make the ritualized arguments feel less stuck.
answer: |-
  Your diagnosis is profoundly insightful—this is indeed a **meta-semantic disagreement about the purpose and grounding of truth**, not a first-order linguistic dispute. The stalemate persists because both theories satisfy the agreed constraints (classical logic, non-defectiveness, sorites data) but answer different foundational questions. Here's a breakdown:

  ### The Nature of the Disagreement
  1. **Clash of Semantic "Job Descriptions"**  
     - **Supervaluationism** sees semantics as modeling *epistemic accessibility*: "What does our practice license us to assert?" Truth is grounded in communal norms ("admissible sharpenings"). Borderline indeterminacy reflects *ignorance of meaning*, not ignorance of facts.  
     - **Epistemicism** sees semantics as modeling *metaphysical determination*: "What is fixed by use + reality?" Truth is mind-independent; our ignorance stems from *epistemic limitations*, not meaning-incompleteness.  

  2. **Not Primarily Verbal, Empirical, or Formal**  
     - **Verbal?** Partly—but not trivially. Both sides use "truth" classically (non-defective propositions are true/false). The clash is over *what grounds truth*.  
     - **Empirical?** No direct evidence resolves this. Brain scans won’t reveal whether "bald" has a sharp boundary; usage patterns fit both theories.  
     - **Formal?** Both frameworks are formally coherent. Supervaluationism uses partial models + precisifications; epistemicism uses classical models + unknowable boundaries.  

  3. **A Deeper Philosophical Divide**  
     It's a conflict between:  
     - **Normative Constraint** (Supervaluationism): Semantics must only posit facts accessible to competent speakers.  
     - **Metaphysical Commitment** (Epistemicism): Semantics must capture full determinacy, even if unknowable.  

  ### Could Anything Break the Stalemate?
  **Unlikely—but here’s what might shift the debate:**  

  | Approach             | What Might Move Supervaluationists                          | What Might Move Epistemicists                          |
  |----------------------|------------------------------------------------------------|--------------------------------------------------------|
  | **Formal Results**   | Showing higher-order vagueness *cannot* be modeled without compromising classical logic (e.g., recursive gaps). | Proving that epistemicism *necessarily* violates cognitive constraints (e.g., "unknowable truths" imply incoherence). |
  | **Empirical Findings** | Evidence that cognition treats vagueness as *prototype-driven gradience* (e.g., neural correlates of "partial truth"). | Data showing we *probabilistically commit* to sharp boundaries (e.g., in perceptual discrimination tasks). |
  | **Conceptual Pressures** | If "admissible sharpening" is shown to be viciously circular or language-dependent. | If positing unknowable boundaries undermines naturalistic theories of meaning. |

  **Why the Stalemate is Robust**  
  - **Supervaluationism’s strength:** Explains why we *feel* no cutoff exists.  
  - **Epistemicism’s strength:** Preserves bivalence without exceptions.  
  - **Shared blind spot:** Neither fully resolves *why* our use fails to fix boundaries (supervaluationism) or *how* we latch onto unknowable boundaries (episticism).  

  ### A Path Forward?
  Your group might pivot from "Who's right?" to **"What do we want from a theory of vagueness?"**  
  - If semantics is about *communication* (what we can jointly assert), supervaluationism wins.  
  - If semantics is about *mind-independent reality*, epistemicism wins.  

  **Ironically, the endurance of this debate proves both theories right in one sense: vagueness resists resolution by design.** The stalemate mirrors the very phenomenon you study—a boundary between theories that seems impossible to locate. Embrace the indeterminacy; it’s the lesson.
