prompt: |-
  hi, quick question about mechanistic anomaly detection that’s been bugging me since the reading group. i think i’ve built an argument that shows substrate replacement can never be anomolous, which cant be right but i can’t see the exit.

  (1) mechanistic anomaly detection flags inputs that violate the causal structure that generated the training data.
  (2) if mechanism M1 and M2 are causally isomorphic at every relevant level of organisation, they count as the same mechanism for detection purposes.
  (3) now imagine a brain where each biological neuron is replaced one-by-one with a silicon chip that replicates its input-output profile and causal relations to neighbours.
  (4) at every intermediate stage, the system is causally isomorphic to the original brain at the neural-computation level.
  (5) so by (2) none of these intermediate systems are anomalous.
  (6) by transitivity the fully silicon brain is also in-distribution.
  (7) therefore mechanistic detectors can never flag substrate replacement as anomalous, even when every physical constituent has changed.
  (8) so either substrate is irrelevant to mechanism (which kills hardware-fault detection) or there’s a hidden level where isomorphism breaks, but we have no principled way to pick it.

  i’d rather keep (2) than (7), but i feel like the slide from (4) to (6) is doing too much work. which step should i reject, and what does giving it up cost? also, is there a standard position on this in the mechanistic explanation literature?

  please structure your answer like this:
  - The weak link: one paragraph naming the step
  - Why it looked okay: 2-3 sentences
  - The price of rejection: about two paragraphs
  - Bottom line: 3-4 lines max

  cheers
