answer: |-
  Here’s a distilled framework for what a theory of "understanding" in MT must address, plus a scored evaluation of the three main perspectives. Desiderata are grouped thematically:

  **Core Desiderata for "Understanding" in MT:**  
  1. **Ambiguity Resolution Under Scarcity**  
     - Must resolve ambiguities (lexical, structural, referential) in low-resource language pairs *without* relying on speaker communities or real-world grounding (e.g., translating "bank" in a text with no river/financial context cues between endangered languages).  

  2. **Pivot-Language Robustness**  
     - Avoid semantic drift in chained translations (A→B→C→A). Must preserve meaning when pivoting through intermediate languages (e.g., English→Swahili→Inuktitut→English shouldn’t mutate "cold weather" to "indifference").  

  3. **Long-Range Ontological Cohesion**  
     - Track entity/event consistency across entire documents (e.g., if "Dr. Lee" becomes "she" in paragraph 1, MT must not refer to "he" in paragraph 10, even across syntax variations).  

  4. **Distinction Preservation**  
     - **Surface Fluency vs. Deep Fidelity:** Output must be grammatical *and* semantically faithful (not sacrificing accuracy for smoothness).  
     - **Content vs. Function Words:** Preserve functional elements (prepositions, conjugations) as rigorously as nouns/verbs (e.g., Japanese particle "は" vs. "が" changes meaning).  
     - **Literal vs. Pragmatic Meaning:** Capture implications, irony, or cultural connotations (e.g., translating "break a leg" without implying injury).  

  5. **Puzzles to Resolve**  
     - Why humans infer intent from fragmented input, while MT fails despite vast data.  
     - How MT handles novel constructions or neologisms without training examples.  

  **Tensions (Likely Unsatisfiable Pairs):**  
  - **Resource Independence vs. Contextual Grounding:** Resolving ambiguities without real-world anchors may require internal "world models" incompatible with pure statistical learning.  
  - **Fluency vs. Literal Fidelity:** High fluency often demands liberties that corrupt precise meaning (e.g., translating poetry).  

  ---

  **Scoring the Three Camps:**  

  1. **Pure Statistical/Correlationist View** ("No Understanding"):  
     - ✅: Excels at surface fluency, content-word accuracy in high-resource settings.  
     - ❌: Fails pivot-drift tests (semantic accretion), ontological tracking, and low-resource ambiguity. Treats language as patterns, not meaning.  
     - **Verdict:** Strong on distinctions like fluency, weak on core understanding tests.  

  2. **Functionalist/Behaviorist View** ("If It Behaves Like Understanding, It Is"):  
     - ✅: Scores well on fluency, pragmatic tasks in narrow domains. Deflects ontology/pivot issues as "edge cases."  
     - ❌: Struggles with semantic slippage in chained translations and long-text coherence. Cannot explain *why* errors occur, only that outputs *sometimes* behave appropriately.  
     - **Verdict:** Circular—equates performance with understanding but lacks criteria for consistency under stress tests.  

  3. **Hybrid Symbolic-Neural View:**  
     - ✅: Best candidate for pivot robustness (symbolic constraints reduce drift) and ontological tracking (explicit memory structures). Excels at function-word precision.  
     - ❌: Often sacrifices fluency; struggles with low-resource ambiguity unless symbols are pre-defined.  
     - **Verdict:** Only approach addressing all desiderata *in theory*, but current implementations are brittle. Most viable for deep fidelity.  

  **Conclusion:** No camp fully satisfies all desiderata. Pure stats fail ontological/pivot tests; functionalism masks gaps with performance; hybrids promise coherence but lack elegance. "Understanding" in MT likely requires reconciling statistical power with explicit, human-like constraints—a hurdle no current system clears.
