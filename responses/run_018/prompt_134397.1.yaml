  ## Mary's Room: When Imagination Blossoms Beyond Facts

  **1. The Problem Set-Up: Beyond Seeing Red**

  Frank Jackson’s thought experiment concerning Mary, the brilliant neuroscientist confined to a monochromatic room, is well-known. Mary possesses exhaustive physical knowledge concerning colour vision: wavelengths, neural pathways, brain states – the complete physical story. Upon finally stepping outside and seeing a ripe tomato, she ostensibly learns something new: *what it is like* to see red. This "phenomenal knowledge" is the crux of the knowledge argument against physicalism: if all facts are physical, and Mary knew all physical facts, how could she learn something genuinely new? The challenge is reframed here. Suppose Mary’s revelation isn't *solely* about experiencing red. Instead, upon seeing red for the first time, she suddenly gains the astonishing ability to vividly imagine *any* conceivable colour – chartreuse, teal, magenta – with perfect fidelity, even colours she has *never* encountered sensorily. This new capacity for flawless, internal colour simulation is the puzzle. Is this sudden blossoming of imaginative power a new piece of *factual* knowledge ("knowing-that"), akin to learning a new proposition? Or is it the acquisition of a profound new *cognitive skill* ("knowing-how"), analogous to mastering mental rotation of 3D objects? The fate of physicalism may hinge on this distinction.

  **2. The Skill Interpretation: Mastering the Mind's Palette**

  Proponents of the skill interpretation argue that Mary hasn't acquired new propositional *facts* about the world or consciousness. Rather, she has acquired a new *ability*: the know-how to generate and manipulate vivid, internal colour representations. Before seeing red, Mary’s knowledge about colour was purely theoretical and descriptive ("knowing-that" light of 650nm wavelength causes certain neural firings"). She lacked the practical capacity to *simulate* the experience internally. Seeing red provides the necessary experiential 'template' or 'calibration', unlocking the cognitive machinery required for high-fidelity colour imagination. This is akin to learning mental rotation: one might know all the geometric principles ("knowing-that" cubes have six faces), but only with practice does one acquire the *skill* to visualise their rotation smoothly. Mary’s new imaginative capacity is similarly procedural; it’s not *about* qualia, it’s the *exercise* of generating them internally. Framing phenomenal knowledge as knowing-how, not knowing-that, seems to sidestep the knowledge argument: physicalism only claims all *facts* are physical. Abilities, developed through physical processes (like visual experience rewiring the brain), pose no inherent threat.

  **3. The Physicalist Defence: Capacities as Physical Realisations**

  The physicalist seizes this interpretation. They argue that Mary’s sudden ability for perfect colour imagination is entirely explicable within a physical framework. Her exhaustive physical knowledge *included* the blueprint of the neural circuits responsible for visual processing and imagery. What was missing was the specific *activation* and *reconfiguration* of these circuits that only direct sensory input (seeing red) could provide. This input acts as a trigger, enabling latent neural pathways associated with colour processing to be fully integrated into her imaginative network. Her new skill is the behavioural manifestation of these now-functional neural assemblies. Just as learning to ride a bicycle involves physical changes in the cerebellum enabling a new skill (without adding new facts about gravity or balance), seeing red physically enables Mary’s brain to perform a new cognitive operation: generating precise colour simulations. The "what-it-is-likeness" of her imaginings *is* the subjective aspect of exercising this physically realised skill, not evidence of non-physical facts. Physicalism survives by classifying phenomenal knowledge as a capacity, not a datum.

  **4. The Best Counter-Argument: The Unexplained "Like-What" of the Skill**

  However, the skill defence merely relocates the explanatory gap; it does not close it. The core problem persists: *what is it like to possess and exercise this new imaginative skill?* Even if granting that the *ability* to imagine colours is a physically realised capacity, the *subjective character* inherent *in* the act of imagining, say, vivid magenta – the specific "like-whatness" of that internal simulation – remains unaccounted for by the physical facts Mary originally knew. Crucially, this qualitative character seems intrinsic to the skill's execution. Before her release, Mary knew *all* the physical facts about the brain states constituting colour imagination and their functional roles (e.g., "Neural state N1 correlates with imagining magenta and plays role R in cognition"). Yet, upon gaining the skill, she still encounters a novel qualitative dimension: the distinctive phenomenal feel of *experiencing magenta internally*. Knowing *how* to generate the state doesn't explain *why* exercising that know-how has this particular subjective quality rather than another, or none at all. The skill framing renders phenomenal qualities as *features* of the ability's exercise, but it fails to explain how or why these specific qualitative features arise from the physical machinery Mary already understood. The "explanatory gap" between physical processes and subjective experience simply shifts from the perception of red to the imagination of it.

  **5. The Verdict: Skill Relocates, But Does Not Resolve**

  The attempt to frame Mary’s new capacity for perfect colour imagination as merely acquiring a skill ("knowing-how") rather than factual knowledge ("knowing-that") does not successfully save physicalism. While it correctly identifies a new *ability* gained, it fails to address the fundamental issue highlighted by the original knowledge argument: the inexplicable emergence of novel *subjective quality*. The vivid "like-whatness" experienced when Mary imagines a new colour – the very essence of the phenomenal – remains stubbornly absent from the exhaustive catalogue of physical facts she possessed within her room. Framing it as a skill merely relocates the mystery from the *object* of perception (seeing red) to the *act* of internal simulation (imagining magenta). Knowing *how* to do something does not explain *what it feels like subjectively* to do it, especially when that feeling constitutes a fundamentally new kind of experience. The gap between the physical description of brain processes (which Mary knew) and the first-person character of conscious experience (which she discovers) persists even when that experience is generated imaginatively. Therefore, Mary’s sudden gain in imaginative fidelity provides compelling evidence that physicalism, by its own exhaustive terms, cannot account for the qualitative dimension of consciousness, regardless of whether it manifests in perception or imagination. The phenomenal resists reduction.
