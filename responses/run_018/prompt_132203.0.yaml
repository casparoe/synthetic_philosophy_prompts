answer: |-
  ### (a) Exam Question  
  **Assess whether the 'threshold model' of virtue—understood as domain-indexed dispositions activated only when context-specific moral demands are met, regulated by a second-order meta-cognitive capacity for domain recognition—successfully defends virtue ethics against the situationist critique. In your analysis, address:**  
  **(1) Whether this model preserves virtue as a genuine feature of *character* rather than fragmented situation-bound behaviors;**  
  **(2) Whether the meta-cognitive capacity itself functions as a global trait vulnerable to situationist debunking;**  
  **(3) Whether the model offers a non-circular account of moral education and character improvement.**  
  *Avoid summarizing Aristotelian theory or restating empirical situationist findings. Focus on evaluating the conceptual coherence and defensive power of the threshold model.*  

  ---

  ### (b) Model Answer (747 words)  

  The threshold model proposes a sophisticated response to situationism by redefining virtues as dispositions localized to specific domains (e.g., workplace honesty, familial compassion), triggered only when contextually determined moral thresholds are met (e.g., stakes exceeding a certain urgency). Crucially, a second-order meta-cognitive capacity identifies which domains warrant which virtues, adjusting for situational salience. While initially promising, this model fails to adequately defend virtue ethics, collapsing under its own conceptual tensions when scrutinized through the three required issues.  

  **(1) Character Fragmentation vs. Integration**  
  The model’s core appeal is its evasion of situationism’s attack on cross-situational consistency: virtues manifest reliably *within* domains but not universally. However, this fractures character into disconnected behavioral clusters. If honesty activates only in professional contexts where stakes surpass threshold X, but not in low-stakes social contexts, the trait lacks psychological unity. Character becomes a patchwork of context-bound algorithms rather than an integrated source of agency. Proponents might argue the meta-cognitive regulator unifies character by orchestrating domain-indexed virtues. Yet this regulator operates *on* the virtues, not *as* one—it is a separate cognitive mechanism. Virtue ethics traditionally locates moral identity in enduring traits shaping perception and action; here, virtues are reduced to domain-locked reflexes activated by external triggers. The threshold model thus sacrifices character’s *causal depth*, preserving reliability at the cost of reducing virtues to sophisticated situation-response pairings.  

  **(2) The Meta-Cognitive Regressor Problem**  
  The second-order capacity faces a dilemma: if it is a global trait, it inherits situationism’s challenges; if it is domain-specific, it generates infinite regress. The regulator must recognize morally salient domains (e.g., discerning that a high-stakes family conflict demands compassion). If this capacity is *itself* a global trait (e.g., practical wisdom), situationist evidence applies directly: meta-cognition may falter under fatigue, stress, or ambiguous cues, just as first-order virtues do. Doris’s supermarket study, where trivial situational changes altered helping behavior, could easily debunk a meta-cognitive "wisdom" trait. Alternatively, if the regulator is domain-indexed (e.g., separate for professional vs. familial spheres), a new regulator is needed to select *which* domain-specific meta-capacity applies to a given situation. This regress undermines the model’s parsimony and practicality. Either way, the regulator cannot escape situational vulnerability. Its purported role as the linchpin of character only relocates—but does not resolve—situationism’s critique.  

  **(3) The Circularity of Moral Education**  
  Moral improvement within the threshold model relies on refining domain-indexed dispositions *and* the meta-cognitive regulator. Yet both paths face circularity. Training domain-specific virtues (e.g., courage in physical danger) assumes we can isolate and practice domains *before* the regulator is fully formed. But without a competent regulator, how do we identify which domains warrant practice? Conversely, educating the regulator requires exposure to varied domains to hone discernment. Yet if the regulator is underdeveloped, misclassification of domains (e.g., failing to recognize a high-stakes moral demand) will misdirect practice, reinforcing flawed responses. Improvement presumes the very capacities it seeks to build. This contrasts with Aristotelian habituation, where practice cultivates integrated character through holistic social embedding. The threshold model lacks an independent standard for progress: without pre-existing virtue in the regulator or domains, education lacks a stable foundation. Appeals to "feedback loops" between practice and meta-cognition merely mask the circularity.  

  **Conclusion: Shifting the Goalposts**  
  The threshold model’s ingenuity lies in conceding situationism’s empirical core—consistent global traits are psychologically unrealistic—while attempting to salvage virtue’s normativity. Yet in doing so, it redefines virtue beyond recognition. By localizing dispositions and outsourcing unity to a meta-cognitive overseer, it dissolves character into fragmented, context-driven impulses and an unstable regulatory ghost in the machine. Meanwhile, moral education becomes a bootstrapping paradox. The model does not refute situationism; it internalizes it, constructing virtues so narrowly that they lose their status as traits constitutive of the self. Virtue ethics survives only by abandoning its traditional anchor in robust, identity-defining character. Ultimately, the threshold model illustrates a Pyrrhic victory: it defends a version of virtue ethics empirically invulnerable to situationism only by sacrificing its soul.  

  ---

  ### (c) Marking Scheme (Total: 20 points)  
  **Must-Hit Moves**  
  1. **Exposition of Threshold Model vs. Situationism (4 pts)**  
     - *A Answer:* Clearly distinguishes the model from Aristotelianism/situationism, emphasizing domain-indexing + meta-cognition as a *novel* defense.  
     - *B Failure Mode:* Describes the model generically or conflates it with standard virtue ethics.  

  2. **Issue 1 Analysis: Character Ontology (5 pts)**  
     - *A Answer:* Argues that domain-indexing fragments character, reducing virtues to triggered responses; notes meta-cognition’s failure to integrate traits.  
     - *B Failure Mode:* Claims model "saves" character without addressing fragmentation; asserts meta-cognition = "new global trait" uncritically.  

  3. **Issue 2 Analysis: Regulator Vulnerability (5 pts)**  
     - *A Answer:* Identifies the dilemma: meta-cognition as global trait (vulnerable) vs. domain-specific (regress). Uses situationist logic to debunk it.  
     - *B Failure Mode:* Only notes situationist risk superficially; misses the regress problem.  

  4. **Issue 3 Analysis: Moral Education (4 pts)**  
     - *A Answer:* Demonstrates circularity in educating virtues/regulator; contrasts with Aristotelian habituation’s coherence.  
     - *B Failure Mode:* Suggests "practice improves both" without addressing bootstrapping; overlooks lack of independent standards.  

  5. **Synthesis & Judgment (2 pts)**  
     - *A Answer:* Concludes the model "saves" virtue only by redefining/weakening it (e.g., "Pyrrhic victory").  
     - *B Failure Mode:* Restates arguments; lacks a final evaluative stance on success/failure.  

  ---
  **Rationale**: This design forces engagement with the *conceptual viability* of the threshold model, not recitation. High-scoring answers must expose tensions between localizing virtues (to evade situationism) and preserving character’s normative depth—the crux where the defense collapses.
