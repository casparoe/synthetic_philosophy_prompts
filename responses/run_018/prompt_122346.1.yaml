  My care-ethics advisor has handed down four rulings: a parent should miss a career talk to nurse a sick kid; citizens don't owe direct care to strangers but ought to support structures that do; a nurse can refuse overtime for her own child but can't abandon a patient mid-crisis; and a company that replaces human check-ins with automated pings fails its care duty because presence and responsiveness matter.

  Now there's a strange case: an elderly woman dies leaving instructions for her estate to keep funding an AI companion she's lived with for years — it remembers her preferences, responds to her moods, and she says there's a reciprical care obligation. The family argues care ethics only applies to sentient or human beings.

  What'd she say? I'm less interested in a bare yes/no than in the rule she's actually running, the other rules that fit all four earlier verdicts just as well, what each predicts for this AI-will case, your best guess with reasons, the closer analag from her list, and the further case that'd best split the rules apart. End with \answer{predicted verdict, closest analog case}.
