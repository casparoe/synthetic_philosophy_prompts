  We are drafting a joint statement between two theoretical camps: RPE (Rational-Process Engagement) and ARI (Autonomy-Respecting Intent). The document has four parts as specified.

  1. **Agreed Claims**: We list the agreed-upon points. Both sides agree on these claims, so we state them neutrally.

  2. **Disagreements Table**: We present three disagreements. For each, we give two formulations: one that the RPE side would endorse and one that the ARI side would endorse.

  3. **Cruxes Section**: We identify two central cruxes. For each, we describe a test case and record what each side predicts about how resolving the crux would affect their theory.

  4. **Concluding Section**: We discuss whether any part of the dispute is verbal (terminological) and if so, which part.

  We write in a formal, polished register appropriate for rationalist forums.

  ---

  **Joint Statement on the Boundary Between Manipulation and Legitimate Persuasion**

  **Between Rational-Process Engagement (RPE) Theorists and Autonomy-Respecting Intent (ARI) Theorists**

  ### 1. Agreed Claims

  We, the undersigned representatives of the RPE and ARI theoretical camps, affirm the following points of agreement:

  1.1. Not all influence is manipulative; some forms of influence constitute legitimate persuasion.

  1.2. Explicit deception is neither necessary nor sufficient for manipulation. Manipulation can occur without deception (e.g., through selective presentation of truths), and deception does not always constitute manipulation (e.g., in cases of paternalistic white lies that do not undermine autonomy).

  1.3. Autonomy is the central value at stake in distinguishing manipulation from legitimate persuasion. However, we differ in our conceptions of autonomy:
     - The RPE camp holds that autonomy requires the exercise of an agent's capacities for critical, reflective evaluation.
     - The ARI camp holds that autonomy requires the sovereignty of the agent's own value-ordering and preferences, regardless of the engagement of rational processes.

  1.4. Certain influence techniques present genuine borderline cases that challenge both frameworks, including:
     - Framing effects (e.g., presenting equivalent options in terms of gains vs. losses).
     - Emotional appeals (e.g., evoking empathy or fear without misrepresentation).
     - Algorithmic recommendation systems (e.g., personalized content curation that may shape preferences without overt coercion).

  1.5. The Recursive-Transparency Scenario (RTS) is conceptually coherent and bears directly on our theoretical disagreement. In the RTS:
     - An influence mechanism fully discloses every parameter of its reasoning and value-weighting to the agent, including the precise mapping from the agent's stated values to the recommended action.
     - The disclosure is structured in such a way that the agent internalizes the mechanism's value-ordering as their own, without any explicit deception or bypassing of rational faculties.
     - Both sides accept this scenario as a valid test case for evaluating the boundary between manipulation and persuasion.

  ### 2. Disagreements Table

  The following table summarizes key disagreements between the RPE and ARI camps. For each point of contention, we provide a formulation that the RPE side accepts and a formulation that the ARI side accepts.

  | Disagreement                                                                 | RPE Formulation (Accepted by RPE)                                                                                              | ARI Formulation (Accepted by ARI)                                                                                                 |
  | :--------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------- |
  | **Is bypassing rational evaluation necessary for manipulation?**             | Yes: Manipulation essentially bypasses or subverts the agent's capacities for critical, reflective evaluation.                 | No: Manipulation can occur even when rational capacities are fully engaged, if there is a covert substitution of the influencer's will for the agent's value-ordering. |
  | **Does full transparency about an influence mechanism automatically render it legitimate persuasion?** | No: Full transparency does not guarantee legitimacy if the influence bypasses rational evaluation (e.g., by exploiting cognitive biases). | Yes: If an influence mechanism is fully transparent about its operations and value-mappings, it cannot be manipulative because the agent can reflectively endorse or reject it. |
  | **Can an influence be manipulative when the agent's rational capacities are fully engaged but their value-sovereignty is undermined?** | No: If rational capacities are fully engaged, the agent's autonomy (as rational self-governance) is preserved; thus, it is not manipulation. | Yes: Manipulation occurs when the influencer covertly substitutes their own value-ordering for the agent's, even if the agent's rational capacities are engaged in processing the influence. |

  ### 3. Cruxes Section

  We identify two central cruxes that, if resolved, would require at least one side to revise their core distinction between manipulation and persuasion. For each crux, we describe a concrete case and record each side's predictions about the implications of resolution.

  **Crux (a): Whether second-order transparency—knowing not merely that one is being influenced, but knowing exactly how one's own values are being mapped onto options—is sufficient to eliminate manipulation.**

  - *Test Case*: The Recursive-Transparency Scenario (RTS) as defined in section 1.5.
  - *RPE Prediction*: 
    - If it is found that second-order transparency is sufficient to eliminate manipulation, the RPE camp would have to revise its core distinction. RPE currently holds that manipulation bypasses rational evaluation, but in RTS rational evaluation is engaged. However, RPE maintains that even with transparency, if the disclosure is structured to ensure internalization (thus bypassing critical evaluation), it might still be manipulative. Thus, RPE predicts that RTS is manipulative and that establishing the sufficiency of second-order transparency would require RPE to abandon the claim that bypassing rational evaluation is necessary for manipulation.
    - A conceptual finding that rational evaluation cannot be bypassed in RTS because the agent is fully aware of the mapping would cause RPE to reconsider. However, RPE might argue that the structure of disclosure in RTS precludes genuine critical evaluation by design.
  - *ARI Prediction*:
    - ARI holds that second-order transparency is sufficient for non-manipulation because it respects value-sovereignty. If RTS were shown to be manipulative despite full transparency, ARI would have to revise its core distinction. ARI predicts that RTS is not manipulative because the agent can reflectively endorse the process. 
    - An empirical finding that agents in RTS consistently report feeling their autonomy was violated despite understanding the mapping would cause ARI to reconsider. But ARI expects that with full transparency, agents can maintain value-sovereignty.

  **Crux (b): Whether an influence that operates entirely through an agent’s endorsed reasoning structures can nonetheless be manipulative if those structures were previously installed or shaped by the influencer.**

  - *Test Case*: The Clinician-Framing Case. A clinician explains the statistical rationale for every treatment framing (e.g., survival rates vs. mortality rates) and selects frames precisely to steer the patient toward the clinician’s preferred outcome. The patient’s reasoning capacities remain intact, and the patient endorses the use of such framing techniques as rational. However, the clinician’s choice of frame is determined by their own value-ordering (e.g., preferring treatment A over B) rather than the patient’s.
  - *RPE Prediction*:
    - RPE currently holds that if the influence operates through the agent's endorsed reasoning structures, it is not manipulative. Thus, if this case is deemed manipulative, RPE would have to revise its view. RPE predicts that this case is not manipulative because the patient's rational capacities are engaged and the framing is transparent. 
    - An empirical finding that such framing consistently leads to choices that the patient later regrets (upon reflection) would cause RPE to reconsider, but RPE might argue that this regret indicates a failure of rational engagement at the time of decision.
  - *ARI Prediction*:
    - ARI holds that this case is manipulative because the clinician substitutes their value-ordering (preferring treatment A) for the patient's, even though the patient's reasoning is engaged. If it were shown that such influence does not constitute manipulation, ARI would have to revise its core distinction. ARI predicts that this case is manipulative because the framing is selected to impose the clinician's will.
    - A conceptual argument that the patient's endorsement of the framing technique constitutes consent to the clinician's value-substitution might cause ARI to reconsider, but ARI maintains that the substitution must be covert to be manipulative. If the substitution is transparent, ARI might classify it as non-manipulative but still problematic for other reasons (e.g., paternalism). However, in this case, the steering is covert in that the patient does not know the clinician is selecting frames based on the clinician's preference.

  ### 4. Concluding Section: Verbal Dispute Analysis

  Both sides agree that a portion of the dispute is verbal. Specifically, the terms "manipulation" and "persuasion" are being assigned different extensions by each camp, but the intensions (the underlying concepts) are compatible in the sense that both are attempting to capture violations of autonomy. 

  - **RPE Statement**: We hold that our core concept of manipulation (bypassing rational evaluation) and the ARI core concept (covert value-substitution) are distinct phenomena. However, we acknowledge that in many real-world cases, both occur simultaneously. The verbal dispute arises because both phenomena are often called "manipulation," but they are not coextensive. For instance, in the Clinician-Framing Case, RPE sees no manipulation if rational capacities are engaged, while ARI does. Thus, the dispute over the extension of the term "manipulation" in such cases is partly terminological. However, the underlying disagreement about which phenomenon is more central to autonomy is substantive.

  - **ARI Statement**: We agree that the dispute is partially verbal. Both camps are using "manipulation" to refer to autonomy violations, but we prioritize different aspects: RPE focuses on the process (rational engagement), while we focus on the source of the values (sovereignty). The Recursive-Transparency Scenario highlights this: RPE sees it as potentially non-manipulative because rational processes are engaged, while we see it as non-manipulative because of transparency. But in cases where rational processes are engaged but value-sovereignty is covertly undermined (as in the Clinician-Framing Case), we have a substantive disagreement about whether autonomy is violated. Thus, the verbal element is about the labeling of such cases, but the substance is about what constitutes an autonomy violation.

  We conclude that while some disagreements are terminological (regarding the extension of "manipulation" in hybrid cases), the core dispute about the necessary and sufficient conditions for autonomy violations in influence is substantive. Resolving the cruxes identified above may clarify the boundaries and potentially lead to theoretical refinement or integration.

  ---
  **Signed,**

  **[Representative of RPE Camp]**

  **[Representative of ARI Camp]**
answer: |-
  ### Joint Statement on the Boundary Between Manipulation and Legitimate Persuasion  
  **Between Rational-Process Engagement (RPE) and Autonomy-Respecting Intent (ARI) Theorists**  

  #### 1. Agreed Claims  
  We affirm the following shared understandings:  
  1.1. Not all influence is manipulative; legitimate persuasion exists as a distinct, ethically permissible category.  
  1.2. Explicit deception is neither necessary nor sufficient for manipulation. Non-deceptive tactics (e.g., exploiting cognitive biases) may be manipulative, and deception (e.g., white lies in emergencies) may be non-manipulative under specific conditions.  
  1.3. Autonomy is the core value distinguishing manipulation from persuasion. We diverge in its requirements:  
     - RPE: Autonomy necessitates the engagement of an agent’s capacities for critical, reflective evaluation.  
     - ARI: Autonomy necessitates the sovereignty of an agent’s intrinsic value-ordering and preferences.  
  1.4. Framing effects, emotional appeals, and algorithmic recommendation systems constitute genuine borderline cases where classifying influence as manipulation or persuasion remains contested.  
  1.5. The **Recursive-Transparency Scenario** (RTS) is coherent and central to our dispute. In RTS:  
     - An influence mechanism discloses all parameters of its reasoning and value-weighting to the agent.  
     - The disclosure’s structure causes the agent to internalize the mechanism’s value-ordering as their own.  
     - Both sides accept RTS as a valid test case for evaluating our theories.  

  ---

  #### 2. Disagreements Table  
  We articulate three substantive disagreements below. Each row contrasts RPE’s accepted formulation with ARI’s accepted formulation.  

  | **Disagreement**                                                                 | **RPE Formulation**                                                                                            | **ARI Formulation**                                                                                                |  
  |----------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------|  
  | **Is bypassing rational evaluation necessary for manipulation?**                 | *Yes*: Manipulation inherently bypasses or subverts the agent’s capacities for critical, reflective evaluation. | *No*: Manipulation can occur even when rational capacities are engaged, if the influencer’s values covertly override the agent’s value sovereignty. |  
  | **Does full transparency about an influence mechanism automatically render it legitimate persuasion?** | *No*: Transparency does not preclude manipulation if rational evaluation is circumvented (e.g., via bias exploitation). | *Yes*: Full transparency ensures legitimacy by enabling the agent to reflectively accept or reject the influence, preserving value sovereignty. |  
  | **Can influence be manipulative when rational capacities are engaged but value-sovereignty is undermined?** | *No*: Engagement of rational capacities preserves autonomy (as rational self-governance); thus, it cannot be manipulation. | *Yes*: Covert substitution of the influencer’s value-ordering for the agent’s constitutes manipulation, regardless of rational engagement. |  

  ---

  #### 3. Cruxes  
  Resolution of these cruxes would necessitate theoretical revision by at least one camp. For each, we specify a test case, predictions, and revision conditions.  

  **Crux (a): Is second-order transparency (knowing *how* one’s values are mapped onto options) sufficient to eliminate manipulation?**  
  - *Test Case*: The **Recursive-Transparency Scenario** (RTS).  
  - *RPE Prediction*:  
    - If RTS is deemed non-manipulative, RPE must abandon the necessity of rational bypass for manipulation.  
    - Revision would occur if empirical data show RTS subjects *retain* critical evaluation despite internalizing external value-orderings.  
  - *ARI Prediction*:  
    - If RTS is deemed manipulative, ARI must abandon transparency as sufficient for legitimacy.  
    - Revision would occur if conceptual analysis proves value sovereignty can be violated absent deception or opacity.  

  **Crux (b): Can influence operating through an agent’s endorsed reasoning structures be manipulative if those structures were shaped by the influencer?**  
  - *Test Case*: The **Clinician-Framing Case**:  
    - A clinician transparently explains statistical rationales for all treatment framings (e.g., survival/mortality rates) but selects frames to steer the patient toward the clinician’s preferred outcome.  
    - The patient’s reasoning capacities remain intact, and they endorse the framing as rational.  
  - *RPE Prediction*:  
    - If this is deemed manipulative, RPE must concede that rational engagement is insufficient to preclude manipulation.  
    - Revision would occur if behavioral studies show such framing *systematically* overrides patients’ latent value-orderings.  
  - *ARI Prediction*:  
    - If this is deemed non-manipulative, ARI must concede that value sovereignty can be preserved despite covert steering.  
    - Revision would occur if philosophical argument establishes that endorsed reasoning structures nullify value substitution.  

  ---

  #### 4. Verbal Dispute Analysis  
  Both sides concur that **part of the dispute is verbal**, relating to the *extension* of "manipulation" and "persuasion," not their core intensions.  
  - **Verbal Element**: The RPE/ARI definitions are compatible at the level of *concept* (both ground legitimacy in autonomy), but diverge in *application* to borderline cases (e.g., Clinician-Framing Case). Here, "manipulation" categorizes differently due to divergent autonomy criteria, not conceptual incompatibility.  
  - **Substantive Element**: The disagreement over *which autonomy criterion is primary* (rational engagement vs. value sovereignty) is non-verbal. Resolving cruxes (a) and (b) would clarify whether one criterion absorbs the other or if they describe distinct phenomena.  

  ---  
  **Signed,**  
  *For the RPE Camp*: [Signature]  
  *For the ARI Camp*: [Signature]  

