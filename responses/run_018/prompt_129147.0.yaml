      "**Democratic legitimacy** as a counter to moral enforcement: Critics note democracies often codify shared morals (e.g., human rights laws).",
      "Whether **critical morality** is accessible/objective enough to guide law."
    ],
    "best_rebuttal": "The **harm principle** combined with **critical vs. conventional morality distinction**. Together, they show Devlin: (1) conflates immorality with tangible harm, and (2) fails to prove that enforcing arbitrary social norms preserves society.",
    "common_classroom_misuse": [
      "Treating the slogan as a self-evident axiom rather than a synthesis of Hart's arguments (harm principle + anti-conventionalism).",
      "Using it to dismiss Devlin without engaging his core claim—that shared morality is society's 'glue'—which requires empirical refutation.",
      "Conflating Hart's critique with broader moral relativism. Hart opposes legal moralism, not morality's role in guiding individuals."
    ]
  }
  ```

  ---

  ### Key Context  
  - **Hart's Position**: Law should only enforce morality to prevent harm (e.g., violence, exploitation), not to punish "sin" or uphold tradition. He accepts *some* moral enforcement (e.g., prohibitions on cruelty) if linked to harm.  
  - **Devlin's Unrebutted Claims**: If societal collapse *could* be proven from moral change, Hart might allow enforcement. Hart also grants that law reflects "minimum content of natural law" (e.g., prohibitions essential for survival).  
  - **Academic Consensus**: Hart "won" the debate empirically (Devlin’s disintegration thesis lacks evidence) and normatively (liberal democracies prioritize harm prevention over moral purity). Yet, Devlin’s concerns about social cohesion remain influential in communitarian thought.  

  **Bottom Line**: Your professor’s slogan works if shorthand for "law enforcing conventional morality without proven harm lacks justification." It falters if presented as a dogma detached from Hart’s harm-centric liberalism.
