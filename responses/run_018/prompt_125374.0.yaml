  Tractability-wise, Question 1 is ripe for thought experiments and conceptual analysis. A breakthrough—like showing diachronic HOTs can avoid misrepresentation by redefining "aboutness"—could revolutionize the field. If that happens, Question 3 jumps in priority because we'd need to reassess the inner-sense/HOT divide in light of this new model. 

