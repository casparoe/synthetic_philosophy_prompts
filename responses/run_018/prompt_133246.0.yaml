  The ethical tension here is between two imperatives: the Levinasian responsibility to remain ethically available to the collective's concrete needs versus the Sartrean duty to resist bad faith. Withdrawal might preserve individual integrity but abandon the vulnerable they serve. Staying risks complicity in epistemic violence. 

