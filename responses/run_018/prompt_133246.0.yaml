answer: |-
  Your friend's experience reveals a deeper structural pathology within the collective, rooted in what I would characterize as the **epistemic collapse of deliberative space into positional tribalism**. This is not mere interpersonal friction but a failure of the group's ethical architecture—specifically, the displacement of *phronēsis* (practical judgment) by what Sartre termed the "practice-inert": institutional forms that ossify consciousness into predefined roles.  

  ### Core Philosophical Pathology  
  1. **The Colonization of Judgment**:  
     When factual inquiries ("What are the grant's reporting requirements?") are reduced to factional signals, the group demonstrates **Hegelian recognition gone awry**. Members no longer engage with the *content* of judgment but seek only to locate the speaker within the master/slave dialectic of "autonomy vs. pragmatism." This corrupts the very purpose of consent-based deliberation, which requires what Habermas called the "force of the better argument" to remain distinct from identity politics.  

  2. **The False Binary as Totalizing Framework**:  
     The "autonomy or utility" dichotomy functions as a **Foucauldian dispositif**—an apparatus that categorizes and disciplines speech. By forcing all discourse into this frame, the collective enacts what Lyotard described as the *differend*: a conflict where the language to neutrally describe the dispute is already co-opted by one side. Your friend's attempt to evaluate grant logistics becomes *literally unspeakable* outside the imposed binary.  

  3. **The Ethical Violence of Positional Absorption**:  
     Levinas would identify this as a failure of the "Face of the Other." When your friend's concrete attention to material details (medicine logistics, reporting burdens) is ignored in favor of her symbolic position, the collective enacts **ethical negligence**. They prioritize ideological purity over their responsibility to the vulnerable they serve—a betrayal of their founding ethos.  

  ---

  ### Preserving Independent Evaluation: A Duty Framework  
  Withdrawal or resistance cannot be decided pragmatically alone; the choice carries ethical weight:  

  - **The Case for Resistance**:  
    If your friend withdraws, she cedes the deliberative space to the very pathology she opposes. Staying to name the dynamic—e.g., "When I ask about reporting forms, I am not choosing a camp but serving our mission"—performs what Arendt called "natality": interrupting deterministic processes through speech. By insisting judgments be heard *as judgments*, she fights the epistemic closure. This aligns with Foucault's ethos of "indocility": refusing the subject positions the system imposes.  

  - **The Case for Withdrawal**:  
    However, if the group's interpretive grid is now totalizing (her words *cannot* be received neutrally), staying forces her into **Sartrean bad faith**. Persisting in a system that systematically distorts her agency becomes complicity in her own alienation. Withdrawal here is not defeat but what Simone Weil termed "decreation"—removing oneself from a corrupted structure to preserve the integrity of attention necessary for ethical action elsewhere.  

  ---

  ### Concrete Advice  
  1. **Diagnose Before Deciding**:  
     She should test whether the epistemic closure is reversible. In one meeting, she might explicitly state: "I will now speak only of grant logistics. If you hear allegiance, stop me and explain *which phrase* signaled it." This performs a phenomenological reduction—exposing the interpretive violence. If the group cannot engage this, the pathology is entrenched.  

  2. **Resist Through Reorientation**:  
     If she stays, she must refuse all positional language. Respond to "So you side with the purists?" with: "I side with determining if refrigeration funding compromises our response time." This forces attention to particulars—a practice Iris Murdoch deemed foundational to moral life.  

  3. **Withdraw as Preservation, Not Abandonment**:  
     Should the collective prove incapable of receiving particulars, withdrawal becomes an ethical duty to the *practice* of mutual aid itself. To remain would normalize the corruption of judgment—damaging her capacity to serve solidarity elsewhere. As Merleau-Ponty warned, when institutions deform perception, exit is fidelity to truth.  

  **Ultimately, her duty is to the vulnerable their collective serves—not to the group's self-image**. If the collective's epistemic failure hinders effective aid (e.g., by refusing resources due to ideological panic, or accepting exploitative terms due to anti-autonomy reaction), her duty is to disrupt that failure or disengage to serve solidarity more authentically elsewhere. The tragedy lies not in disagreement but in the foreclosure of genuine attention—the very core of ethical praxis.
