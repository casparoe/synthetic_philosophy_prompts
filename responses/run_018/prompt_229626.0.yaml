answer: |-
  ### Joint Statement on Interpretability of a Modular Addition Transformer  
  **Collaborators**: [Realist Name], Representational Realist & [Instrumentalist Name], Strict Instrumentalist  
  **Date**: [Date]  
  **Subject**: Findings from adversarial collaboration on interpretability methods applied to a mod-67 addition transformer  

  After six months of rigorous collaboration, we agree on empirical observations and methodological value but retain fundamental disagreements about the ontological status of "features." Below, we summarize consensus, disagreements, and testable cruxes. This model uses a 2-layer transformer trained on `(a, b) → (a + b) mod 67`, with linear probes and sparse autoencoders (SAEs) applied to residual stream activations. Both methods identify a direction strongly correlating with input angle/congruence class.  

  ---

  ### 1. Agreed-Upon Claims  
  Both parties endorse these statements:  
  1. **Model Performance**: The model achieves >99% accuracy on modular addition.  
  2. **Interpretability Observations**:  
     - A linear probe (trained on activations to predict input angle) achieves near-perfect accuracy.  
     - An SAE (trained to reconstruct activations) yields a sparse feature direction activating cyclically for congruence classes.  
     - Both methods isolate a direction with Fourier-like periodic structure matching mod-67 arithmetic.  
  3. **Causal Relevance**:  
     - Ablating the SAE feature or perturbing the probe direction degrades accuracy specifically for predictions involving that congruence class.  
     - Interventions show directional specificity: e.g., ablating the "angle=5" feature disrupts "5 + x" predictions.  
  4. **Methodological Utility**:  
     - Linear probes and SAEs are mutually reinforcing: they converge on similar directions.  
     - These tools enable prediction of model failures (e.g., via targeted ablation) and circuit discovery.  
  5. **Evidence Standards**:  
     - Validity requires: (a) decoding accuracy, (b) cross-method consistency, (c) causal effects from intervention.  
     - "Angle-like" behavior must exceed chance and align with modular arithmetic topology.  

  ---

  ### 2. Disagreements Table  
  Key disagreements, neutrally framed, with cruxes and testable predictions.  

  | Disagreement (Neutral Phrasing)                                                                 | Realist’s View                                                                                                                                 | Instrumentalist’s View                                                                                                                                                             | Crux                                                                                                                                                                                                 | Proposed Experiment                                                                                                                             | Realist Prediction                                                                                                    | Instrumentalist Prediction                                                                                                 |  
  | :--------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------ |  
  | **Does the "angle feature" exist in the model independent of interpretability tools?**         | "The direction is a real component of the model’s computational structure—akin to a circuit element—that exists whether or not we observe it." | "The direction is a useful summary of activation statistics, not a discrete entity in the network. It is a projection of our tools, not a ‘thing’ in the territory."              | **Would the feature retain its properties under counterfactual measurement?**<br>(e.g., if we use a tool-free method to extract directions)                                                          | **Intervention**: Train *non-interpretability* models (e.g., RF classifiers) on activations to predict angle. Compare directions to SAE/probe axes. | Directions will align across all methods; the feature is "discovered," not constructed.                               | Directions will align only if tools share biases (e.g., linearity); divergence implies construction.                    |  
  | **Is the congruence-class representation causally necessary for model behavior?**              | "The feature is a necessary computational step: ablating it breaks *specific* calculations because the model ‘uses’ it."                       | "Ablation perturbs activations statistically; the effect is correlation, not proof of dedicated computation. The model relies on weight matrices, not ‘representations’ as such." | **Does ablating a *random* direction with identical statistical properties cause equivalent damage?**                                                                 | **Ablation Test**: Ablate (a) the SAE angle direction, (b) a random direction with matched activation norm/distribution. Measure task-specific vs. global accuracy drop. | (a) Causes targeted failure (e.g., high loss on the ablated angle); (b) causes diffuse errors or smaller global loss.  | (a) and (b) cause similar global loss; "specificity" is illusory and arises from our labeling of patterns.             |  
  | **Can the model admit multiple equally valid interpretations of the same activations?**        | "The angle feature is the unique, most parsimonious explanation; alternatives (e.g., Fourier basis) describe the same underlying structure."   | "Interpretations are underdetermined: one could equally attribute activations to non-angle bases (e.g., phase offsets) without loss of predictive power."                         | **Can we train probes/SAEs with competing *non-isomorphic* interpretations that explain behavior equally well?**<br>(e.g., using phase-shifted or nonlinear bases) | **Basis Competition**: Train SAEs with fixed sparsity but different bases (e.g., angle vs. angle + π/2). Compare interpretability and causal effects. | Only angle-aligned bases will yield human-interpretable, causally specific features.                                  | Competing bases will achieve comparable accuracy/causal effects; "interpretability" depends on arbitrary human priors. |  

  ---

  ### 3. Nature of Remaining Debate  
  - **Realist**: The debate is about the world: we disagree on whether networks *implement* features as objective computational objects. Experiments (e.g., counterfactual interventions) can resolve this.  
  - **Instrumentalist**: The debate is partly verbal (e.g., "exists" vs. "useful fiction") but also about the world: we disagree on whether models *require* feature-ontology to explain behavior. Crucially, experiments test if instrumentalism can replicate realist predictions sans ontology.  
  - **Shared View**: The core disagreement is **ontological, not semantic**. We agree that resolving the cruxes above would materially shift one or both positions. If, for example, competing bases perform equally, the realist loses parsimony; if only angle-aligned interventions cause specific errors, the instrumentalist must explain why.  

  We will jointly run the proposed experiments and publish results irrespective of outcomes.  

  ---  
  **Signed**,  
  [Realist Name], Representational Realist  
  [Instrumentalist Name], Strict Instrumentalist
