prompt: |-
  A bunch of us in my group have been fighting for months about whether the stuff our interpretability methods find is real, so I'm making two of the most stubborn people do an adversarial collaboration and write a joint statement. I want you to draft it: the statement that a representational realist about neural networks and a strict instrumentalist could both sign after a good-faith, months-long collaboration on a specific case — a small transformer trained to do modular addition, where a linear probe and a sparse autoencoder (two different ways of hunting for interpretable directions, for anyone not in the weeds on this) both turn up a direction that seems to encode the congruence class / angle of the inputs.

  For calibration, here's the rough shape of the two camps. The realist thinks the network literally has features and that interpretability discovers them: a claim like "this direction encodes the angle" can be true or false in a way that isn't just about what our tools make easy. The instrumentalist thinks features are something we project onto the model; the only facts in the territory are weights, activations, and input-output behavior, and representation-talk is a useful map, not a property of the network itself.

  I want the actual document, not an essay about why its hard. Please include: (1) a numbered list of claims both parties agree on, including claims about the modular arithmetic model, about what has been observed, and about what counts as evidence; (2) a disagreements table with rows for each real disagreement, phrased so each side would accept the wording, plus a column for each side's own way of stating its view; (3) for each row, a crux — a sub-question such that settling it would genuinely move at least one side — and where possible an experiment on the model (or a case) that both sides agree bears on the crux, with each side's prediction recorded in advance. Keep the document in their voices where that helps, and try to say whether the remaining debate is mostly about words or mostly about the world.
reasoning: |-
  We are drafting a joint statement from two researchers: a representational realist and a strict instrumentalist, after collaborating on a small transformer trained for modular addition. We'll structure it as requested.

  1. **Agreed-Upon Claims**: A numbered list of claims both parties accept.
  2. **Disagreements Table**: With columns: 
     - Disagreement (neutrally phrased)
     - Realist's view (in their own words)
     - Instrumentalist's view (in their own words)
     - Crux (a sub-question that could move at least one side)
     - Proposed experiment (if applicable) and each side's prediction.

  The document should be in a collaborative voice, reflecting that they've worked together.

  **Joint Statement Draft**

  ---

  **Joint Statement on Interpretability Findings in a Modular Addition Transformer**

  After several months of collaborative investigation into a small transformer model trained to perform modular arithmetic (specifically, addition modulo a prime, e.g., mod 67), we, a representational realist and a strict instrumentalist, have reached agreement on several key observations and the utility of certain interpretability methods. However, we remain in fundamental disagreement about the ontological status of the "features" identified by these methods. This document outlines our points of consensus, our disagreements, and the experiments that might resolve them.

  ### 1. Agreed-Upon Claims

  We jointly affirm the following:

  1. **Model Behavior**: The transformer model under study (with architecture as described in [reference if any]) has been trained to predict the output of modular addition (e.g., a + b mod 67) for input tokens representing integers. It achieves high accuracy (e.g., >99%) on the test set.

  2. **Observations from Interpretability Methods**:
     - A linear probe, trained on the residual stream activations to predict the angle (or congruence class) of the inputs, achieves high accuracy. The probe weights can be visualized and show a periodic structure consistent with the modular arithmetic.
     - A sparse autoencoder (SAE) applied to the same activations finds a set of dictionary elements, one of which activates strongly for a specific angle (congruence class) and shows a similar periodic pattern. This direction (or feature) is highly specific and interpretable.

  3. **Robustness and Consistency**:
     - The direction identified by both methods (linear probe and SAE) is stable across different random seeds and training runs of the model, and across variations in the interpretability method (e.g., different SAE hyperparameters).
     - This direction is causally implicated in the model's output: ablating it (e.g., by zeroing the corresponding SAE feature or perturbing the activation in the probe direction) disrupts the model's prediction in a way that aligns with the angle being represented.

  4. **Utility of Representation-Talk**:
     - Referring to this direction as "representing the angle" is a highly efficient way to describe the model's internal state and predict its behavior. This framing is useful for communication, engineering, and further scientific investigation.

  5. **Evidence for Interpretability**:
     - We agree that the following constitute evidence that a direction is interpretable:
       - The direction can be used to decode the variable of interest (e.g., angle) with high accuracy (linear probe).
       - The direction is sparse and activates in a way that aligns with human-understandable concepts (SAE).
       - The direction is causally relevant to the model's output (via ablation or intervention).

  ### 2. Disagreements

  We have fundamental disagreements about what these findings mean. The table below outlines these disagreements, each side's statement of their view, the crux of the disagreement, and proposed experiments.

  | Disagreement (Neutral Phrasing) | Realist's View | Instrumentalist's View | Crux | Proposed Experiment (if applicable) | Realist Prediction | Instrumentalist Prediction |
  |---------------------------------|----------------|------------------------|------|--------------------------------------|---------------------|----------------------------|
  | **Ontological Status of the Feature** | "The model has an internal representation of the angle; the feature is a real and objective part of the model's computational structure." | "The feature is a useful fiction we project onto the model; it is not an intrinsic property but a way we parse the activations for our purposes." | **Does the feature exist independently of our interpretability tools?** | Experiment: Train two models with identical weights but different training histories (e.g., same architecture, same weights, but one trained normally and one with weights transplanted via model surgery to have the same weights but without the training history). Then apply the same interpretability methods. | The same feature will be found in both models because it is determined by the weights. | Without the training history, the feature might not be found or might not be as clean, because features are not solely in the weights but depend on the training process and our tools. |
  | **What is Being Explained** | "The interpretability methods are discovering features that are causally involved in the model's computation." | "The interpretability methods are constructing a useful mapping that captures patterns in the activations, but the model itself does not 'use' these features in a way that requires them to be discrete entities." | **If we remove the feature (via ablation), is the model's performance drop due to the removal of a specific representational entity or due to a general disturbance?** | Experiment: Ablate the specific feature direction (e.g., via SAE) and compare to ablating a random direction with the same norm. Then, also compare to ablating a direction that is orthogonal to the feature but in the same subspace. | Ablating the feature direction will cause a significant and specific performance drop (e.g., on the angle it represents), while ablating a random direction will cause less specific and less severe drop. Ablating an orthogonal direction will have minimal effect. | The performance drop from ablation is due to the disturbance of the activation vector, and any direction with similar magnitude of ablation might cause a similar drop if it is in a critical subspace. The specificity of the drop is due to the way we defined the feature, not an intrinsic property. |
  | **Scope of Representation** | "The model has a specific circuit that computes and represents the angle, and this circuit is robustly implemented in the weights." | "The activation patterns can be parsed in multiple equally valid ways; the angle representation is one useful way, but not the only one, and there is no fact of the matter about which one is 'correct'." | **Can we find equally interpretable but different representations for the same behavior?** | Experiment: Apply a different interpretability method (e.g., non-negative matrix factorization or a different basis) to the same activations and see if we can find a set of features that are equally interpretable but not aligned with the angle representation. | The angle representation will be the most interpretable and parsimonious, and alternative representations will either be less interpretable or will be transformations of the same underlying structure. | We can find multiple interpretable bases that are equally good at explaining the behavior, and the choice of which one to call the "feature" is arbitrary. |

  ### Nature of the Remaining Debate

  We agree that the core of our disagreement is **ontological** (about what exists in the world) and not merely semantic. However, we also acknowledge that some of our differences might be softened by clarifying the language we use. For instance, the realist might agree that the feature is not a "thing" in the same way a neuron is, but rather a functional unit, while the instrumentalist might agree that the feature is a robust pattern that is highly stable and useful. Yet, the question of whether the feature is "in the model" or "in our interpretation" remains.

  We commit to designing and running the proposed experiments to test our cruxes. We also agree that, regardless of our ontological differences, the practical utility of interpretability methods is not in dispute.

  Signed,  
  [Realist Name]  
  [Instrumentalist Name]  
  Date: [Date]

