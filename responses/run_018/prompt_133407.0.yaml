  ## Dialogue: The Residue of Wrongdoing - Diachronic vs. Synchronic Standing to Blame

  **Setting:** A graduate seminar room. Philosophers A (Diachronic) and B (Synchronic) stand at the front, engaging directly with each other.

  **A:** Thank you, Professor. Let's consider the case of **Dr. Aris Thorne**. For fifteen years, Thorne was a highly effective lobbyist for PetroGlobal, crafting narratives to delay climate action, downplaying scientific consensus, and targeting vulnerable lawmakers. Five years ago, citing a profound moral awakening, Thorne resigned. They publicly repudiated their past work, donated their lobbying wealth to environmental causes, retrained as an environmental lawyer, and now leads impactful litigation against the very industry they once served. Thorne frequently and forcefully blames current PetroGlobal executives for their obstructionism and ecological harm. **Does Thorne possess the moral standing to issue that blame?** I argue **no**, or at least, not without significant qualification, because standing is **diachronic**. It's constituted across a moral biography. Thorne's past complicity isn't washed away; it leaves a **residue** that fundamentally shapes their authority.

  **B:** I fundamentally disagree, A. Moral standing to blame is **synchronic**. It depends entirely on Thorne's *current* relational position and *current* moral consistency. *Right now*, Thorne is a dedicated environmental lawyer fighting climate injustice. They stand in clear opposition to PetroGlobal's actions. Their current condemnation aligns perfectly with their current values and actions. Demanding that Thorne forever bear the stain of their past ignores the possibility of genuine reform and paralyzes moral discourse. If only the morally pristine can blame, who among us qualifies? Thorne's past hypocrisy is **irrelevant** to their present authority, unless it generates a *current* conflict of interest – which it doesn't. In fact, their insider knowledge arguably *strengthens* their standing.

  **A:** But B, doesn't it feel intuitively *hollow* when Thorne condemns the CEO? The CEO might rightly retort: "You built the very playbook I'm using! You profited immensely from it! Who are *you* to lecture me now?" This intuitive hollowness points to the residue. Standing isn't just about present alignment; it's about the *history* of one's relationship to the norm being enforced and to the specific wrongdoer. Thorne wasn't just *anyone*; they were a key *architect* of the harm they now decry. That past role creates a kind of **moral debt** to the victims and a compromised position *vis-à-vis* the perpetrators they once collaborated with. Genuine reform *attenuates* this debt but cannot *dissolve* it entirely. The diachronic view captures this persistent taint on authority.

  **B:** I understand the *feeling* of hollowness, A, but I think it's misplaced sentimentality or perhaps resentment clouding judgment. We must distinguish between *feeling* and *justification*. What *justifies* blame is the wrongness of the act *now* and the blamer's *current* commitment to the norm *now*. Thorne is now clearly committed to the norms of environmental responsibility and justice. Their past doesn't make the CEO's *current* actions any less wrong, nor does it negate Thorne's *current* correct identification of that wrong. Focusing on the past risks confusing the *message* (which is true and important) with the *messenger's history*. Should victims reject Thorne's crucial advocacy simply because of their past? That seems perverse. Synchronic standing focuses on the present moral landscape and the need for effective norm enforcement *now*.

  **A:** It's not about rejecting the *message*, B; it's about the *authority* with which it's delivered *as blame*. Think of it as a form of **estoppel**. By their past actions, Thorne implicitly endorsed the permissibility of the very conduct they now condemn. While they've renounced it, the historical fact of their endorsement weakens their position to *morally indict* others for doing what they once actively facilitated and defended. They lack the requisite "clean hands," not in the present moment abstractly, but specifically concerning *this norm* and *this community of practice* (corporate climate obstruction). Their current commitment, however sincere, doesn't erase the fact that their biography undermines the *symbolic force* of their blame as a pure appeal to shared moral community. The residue signifies a broken continuity.

  **B:** Your diachronic view, A, threatens to make moral standing permanently **unattainable** for anyone who has genuinely reformed, trapping them in their past. It implies a kind of **original sin** for moral failings. If Thorne's past forever poisons their standing to blame *even specific actors they once aided*, what could they *possibly* do to regain full standing? Donate more? Wait longer? Your "attenuation" seems like a vague concession that ultimately preserves the taint. The synchronic view offers a clear path: *live rightly now*. Further, it avoids the dangerous implication that those with compromised pasts should remain silent on crucial injustices. Thorne's voice is *vitally* important *now*. To silence them, or deem their blame illegitimate, based on past actions they've repudiated and atoned for, serves no moral purpose and hinders progress.

  **A:** I'm not advocating silence, B. Thorne can and should speak out! They can expose strategies, advocate for policy, educate the public. But issuing *blame* – that specific, condemnatory moral address – requires a different level of authority. Diachronic standing doesn't trap; it demands **acknowledgment of the residue** itself. Perhaps Thorne's blame needs framing: "I blame you, knowing I once did the same, and I carry that shame." Or maybe others without the complicit history should lead the *condemnation*, while Thorne provides the evidence and strategic insight. Full, unqualified standing requires a biography consistent with the norms one enforces *over the relevant period*. Thorne's radical discontinuity creates the hollowness. Can you explain that hollowness away, B, without invoking the *history*?

  **B:** I can explain the *feeling* as a psychological hang-up, perhaps a residual distrust, or even envy. But the *justification* for blame's force lies elsewhere: in the objective wrongness and the blamer's current commitment to rectifying it. The CEO *is* doing wrong. Thorne *is* committed to stopping it. That's what matters. Your diachronic view risks **moral gridlock**. If every potential blamer must first pass an inquisition into their entire moral biography regarding the specific norm, effective moral response stalls. We judge the *act* of blaming based on its present truth and its present role in upholding norms. Thorne's past hypocrisy is a fact about *them*, not a defeater for the legitimacy of their *current* moral judgment and its expression. The focus belongs on the *wrongdoer's* actions and the *current* need to hold them accountable, not the blamer's archived sins.

  **A:** And your synchronic view, B, risks **moral cheapness**. It allows someone to profit from creating harm, then seamlessly pivot to condemning that same harm without acknowledging the profound inconsistency in their *position as moral judge*. It severs blame from the lived experience of moral community over time. The hollowness *is* significant – it points to a genuine defect in authority, not just a feeling. Acknowledging the diachronic nature of standing respects the gravity of sustained moral failure and the complex reality of reform. It doesn't silence Thorne; it asks them to wield their moral voice with humility, acknowledging the shadow their past casts on their present authority to condemn.

  **B:** And I maintain that demanding that humility *as a precondition for legitimate blame* itself undermines the reformer's hard-won place in the moral community *now*. It keeps them perpetually in the penalty box. Synchronic standing offers redemption through present action. Diachronic standing, however nuanced, ultimately denies full redemption. Thorne *is* a legitimate moral agent *now*, and their blame is legitimate *now*, precisely because they embody the correct stance *now*. The past is prologue, not prison.

  *(They pause, the core disagreement clearly articulated but unresolved.)*

  **A:** Then it seems we must grapple with whether moral community is fundamentally a project of the present moment, or one woven through time.
  **B:** Indeed. And whether we prioritize the purity of the blamer's history or the efficacy of holding wrongdoers accountable in the present. Shall we open it to the class?

  ---
  **Key Philosophical Anchors:**
  *   **A (Diachronic):** Draws on ideas of moral biography (Calhoun), estoppel/clean hands (Law), the non-erasure of significant past wrongs (Bell), and the symbolic importance of continuity for authority.
  *   **B (Synchronic):** Draws on present-focused accounts of blame (Scanlon, perhaps Sher), the irrelevance of the blamer's character for the act of blaming (focus on the wrong), the dangers of making standing impossible (Wallace on hypocrisy), and the primacy of current moral commitment and effectiveness.
  *   **Core Tension:** History vs. Present, Symbolic Authority vs. Effective Enforcement, Redemption vs. Permanent Residue, Purity vs. Participation.
  *   **Avoided Strawmen:** Both acknowledge the other's concerns (hollowness for A, unattainability/permanent taint for B). Both grant reform is possible. Both agree Thorne should speak. The disagreement is about the *specific conditions for unqualified standing to blame*.
