prompt: |-
  I write novels, and I'm revising a manuscript in which I need to settle a line of dialogue before I can move on. A neuroscientist character tells a recently widowed patient, convinced she has seen her dead husband standing in the doorway, that her experience is the same process as ordinary seeing, only nothing is correcting it. He gets there by way of the line that perception is controlled hallucination — I first heard it at a festival panel, where it was being used to explain why eyewitnesses get things wrong — and my editor says it has become a tic of popular neuroscience and that I should know what it commits my character to before I keep it in his mouth.

  Could you set out, as a menu, the distinct precise claims that slogan might be expressing: the near-trivial ones (experience goes beyond what arrives at the sensory surfaces; expectation shapes what one sees), the genuinely contested ones (the difference between perceiving and hallucinating is a matter of degree, or turns on how much weight the system gives to sensory error signals rather than on whether anything is out there), and the radical ones (experience never puts us in contact with mind-independent things, so the widow lacks nothing the rest of us have)? I've seen predictive processing and talk of precision-weighting invoked in the same breath; I don't want a survey of who argued what, and I can't check sources — I want the claims themselves.

  For each reading, say whether it is essentially a platitude, a defensible but contested thesis, or false, and above all whether it would actually license my character's continuity claim or whether that claim trades on sliding between senses of "hallucination." He is meant to be intelligent and partly right rather than a strawman, so flag which reading, if any, lets him stay that way.

  I'd rather have a menu with its weak joints marked than a tidy one: for each verdict, say what would change your mind, and note where you are extrapolating past what the neuroscience actually settles.
reasoning: |-
  Okay, the user is a novelist working on a manuscript involving a neuroscientist character. The character tells a widow that her vision of her dead husband is the same as ordinary seeing, just without correction. The phrase "perception is controlled hallucination" is key here. The editor flagged it as a cliché in popular neuroscience, so the user needs to understand what this phrase implies before keeping it.

  First, I need to break down the slogan into distinct claims. The user wants a menu: near-trivial, contested, and radical interpretations. They also want to know if each version allows the neuroscientist's continuity claim (that the widow's experience is the same process as normal vision). The character should be intelligent and partly right, not a strawman.

  Let me start with the near-trivial claims. The basic idea here is that perception involves top-down processing. Sensory input is ambiguous, so the brain uses prior knowledge to interpret it. That's well-established. Examples like optical illusions or filling in the blind spot illustrate this. The continuity claim here is weak because hallucinations involve a breakdown, not just business as usual. So the neuroscientist might be oversimplifying.

  Next, contested claims. Predictive processing is a framework where the brain generates predictions and uses sensory input as error signals. Hallucinations happen when the system ignores sensory errors. Precision-weighting adjusts how much trust to give sensory input. If precision is low, predictions dominate, leading to hallucinations. This is a defensible but debated view. The continuity claim holds better here—both normal perception and hallucinations involve prediction, differing in error correction. This makes the character plausible.

  Then, radical claims. One version says perception and hallucination differ only in degree, not kind. Another is that all perception is hallucinatory, so we never directly experience reality. The first is contested; the second is more philosophical and not supported by neuroscience. The continuity claim works for the degree version but not the radical one, which undermines the character's point.

  I should also consider the user's deeper needs. They want the character to be credible. The contested predictive processing view is the sweet spot—it's scientifically grounded and allows the continuity claim without being dismissive. The user might also need to avoid misrepresenting neuroscience, so highlighting where claims are settled vs. speculative is key. 

  The widow's experience as "uncorrected seeing" fits best with the predictive processing view. The neuroscientist can be partly right, emphasizing the same neural mechanisms are involved, just with sensory input underweighted. This keeps him intelligent and nuanced. The radical claims would make him sound like he's denying external reality, which isn't necessary for the story.

  Also, the user mentioned not wanting a survey of arguments, so focusing on claims and their implications is crucial. Verdicts on each claim's plausibility help the user decide. Noting what would change my mind (e.g., new evidence on precision-weighting) adds transparency without complexity.

  In summary, structuring the menu around the three categories, linking each to the continuity claim, and recommending the contested but defensible view balances scientific accuracy with narrative needs. Highlighting precision-weighting as key allows the character to explain the widow's experience credibly.
answer: |-
  Here's a breakdown of the distinct claims encapsulated in "perception is controlled hallucination," tailored to your needs. I'll structure it as a menu, assessing each claim's plausibility, implications for your character's continuity claim ("same process, nothing correcting it"), and scientific footing. **The key for your character lies in the "Contested: Predictive Processing Framework" claim.**

  **Core Idea:** The slogan challenges the naive view of perception as a passive intake of external data. It emphasizes the brain's *active construction* of experience.

  **The Menu of Claims:**

  1.  **Near-Trivial: The Constructive Nature of Perception**
      *   **Claim:** Sensory input (light on retina, sound waves on eardrum) is inherently ambiguous and underdetermined. The brain *must* use prior knowledge, expectations, context, and internal models to generate a coherent perceptual experience. "Filling in" (like the blind spot) and susceptibility to illusions demonstrate this active construction.
      *   **Verdict:** **Platitude (within neuroscience/cognitive science).** Well-established by decades of research on illusions, perceptual organization, neural processing, and cognitive biases.
      *   **Licenses Continuity Claim?** **Weakly/Implicitly.** Acknowledges construction is fundamental to *all* perception, implying a shared mechanism. However, it doesn't directly address *how* "control" works or what distinguishes a normal percept from a hallucination. The character's "nothing correcting it" glosses over the complexity implied here.
      *   **What Would Change My Mind?** Evidence that coherent perception arises *without* any top-down influence or integration of prior information – which seems vanishingly unlikely.
      *   **Extrapolation?** Minimal. This is bedrock cognitive science.

  2.  **Contested: Predictive Processing Framework (PPF) / Active Inference**
      *   **Claim:** The brain constantly generates top-down *predictions* about the causes of its sensory inputs. Sensory data is treated as *prediction errors* (deviations from expectation). Perception occurs when these errors are *minimized* by either updating the internal model ("learning") or sampling new sensory data (e.g., moving eyes). "Control" comes from the brain's ability to *weight* the importance of sensory prediction errors (precision-weighting) and act to resolve them. Hallucination arises when predictions are overly strong (high prior precision) and sensory prediction errors are ignored or downweighted (low sensory precision), regardless of the external stimulus. Perception is "controlled" because sensory errors *can* and *usually do* correct the predictions.
      *   **Verdict:** **Defensible but Contested Thesis.** PPF is a powerful, influential, and increasingly dominant framework in computational neuroscience and cognitive science. It integrates many phenomena elegantly. However, it's not the *only* viable framework, and its implementation details, neural mechanisms, and universality are actively debated. The core idea of prediction and error minimization is widely accepted; the specific PPF formulation and its explanatory scope are contested.
      *   **Licenses Continuity Claim?** **Strongly & Directly.** This is the reading that most robustly supports your character. Under PPF:
          *   **Same Process:** Both normal perception and hallucinations rely on the *same core mechanism:* the generation of top-down predictions to explain sensory data.
          *   **"Nothing Correcting It":** Hallucination occurs specifically when the system fails to adequately weight or utilize *sensory prediction errors* to correct the top-down predictions. The "control" (sensory correction) is absent or diminished. The widow's experience *is* the brain's best prediction (the "hallucination") uncorrected by contradictory sensory evidence that would normally update it ("nothing correcting it"). Precision-weighting is the key mechanism distinguishing them.
      *   **What Would Change My Mind?** A robust alternative framework that explains the full range of perceptual phenomena (including illusions and hallucinations) *without* invoking predictive coding and precision-weighting, or definitive evidence that the core neural circuitry proposed by PPF doesn't function as described.
      *   **Extrapolation?** Moderate. While PPF is grounded, applying it directly to complex hallucinations like seeing a deceased spouse involves extrapolation. The framework provides the *principles*, but the specific neurobiology of complex visual hallucinations in grief isn't fully mapped onto PPF yet (though it's a very active area).

  3.  **Contested: Perception vs. Hallucination is a Matter of Degree**
      *   **Claim:** There is no sharp categorical boundary between veridical perception and hallucination. They exist on a continuum determined by the *balance* between the strength of internal predictions/generative models and the weight given to sensory evidence (precision). Strong priors + weak sensory weighting = hallucination-like experiences (even in "normal" perception, like pareidolia). Weak priors + strong sensory weighting = perception dominated by sensory input. Pathological hallucinations represent an extreme imbalance.
      *   **Verdict:** **Defensible but Contested Thesis.** This view naturally follows from PPF (#2) but can be argued independently. It challenges intuitive distinctions. Evidence includes perceptual variability in healthy individuals, drug-induced states, and the spectrum of psychotic symptoms. Critics argue for more fundamental differences in mechanism or the role of reality testing beyond simple weighting.
      *   **Licenses Continuity Claim?** **Directly.** This claim *is* the continuity claim in its strongest form. It explicitly states perception and hallucination are the same fundamental process operating under different parameters (balance of prediction vs. sensory evidence). Your character's line is a direct expression of this view.
      *   **What Would Change My Mind?** Evidence demonstrating a fundamental, categorical switch in neural mechanism between veridical perception and hallucination that isn't reducible to a parameter shift, or evidence that hallucinations *always* involve mechanisms entirely absent in normal perception.
      *   **Extrapolation?** Moderate. While supported by PPF and various phenomena, definitively proving it's *only* a matter of degree across all cases is challenging.

  4.  **Radical: Perception Never Accesses Mind-Independent Reality (Strong Idealism / Interface Theory)**
      *   **Claim:** The brain's models/predictions are *so* constitutive of perception that what we experience is fundamentally a "hallucination" *based on* but not *revealing* the true nature of mind-independent reality. Perception is an evolved user interface for action, not a depiction of reality. Therefore, the widow's hallucination lacks contact with reality, but so does *all* perception. She truly lacks nothing the rest of us have regarding direct contact with the external world.
      *   **Verdict:** **Philosophically Radical / Not Settled by Neuroscience / Potentially False.** This is a *philosophical interpretation* sometimes draped over neuroscience (like PPF). Neuroscience describes the *mechanism* of perception; it doesn't definitively settle metaphysical questions about the nature of reality. While PPF shows perception is *constructive* and *inferential*, it doesn't *prove* we have *no* access to mind-independent properties. Many argue perception, when functioning correctly *is* how we access reality, albeit imperfectly and interpretively.
      *   **Licenses Continuity Claim?** **Yes, but Overkill and Misleading.** It makes the continuity claim trivially true (both are equally hallucinatory). However, this is **not** what neuroscientists typically mean by the slogan, and it **directly contradicts** the character's likely intent (which is to explain the widow's experience as a *malfunction* of a normally *veridical* process, not to say normal perception is equally non-veridical). Using this reading makes the character sound like a radical philosopher, not a neuroscientist explaining a clinical phenomenon.
      *   **What Would Change My Mind?** Neuroscience cannot definitively settle this; it's metaphysics. Evidence that veridical perception involves fundamentally different ontological access than hallucination *might* challenge it, but the claim is designed to be unfalsifiable by empirical evidence alone.
      *   **Extrapolation?** **Major.** This leaps far beyond the neuroscience into metaphysics.

  5.  **False: Hallucinations Utilize the *Exact Same* Mechanism as Veridical Perception, Just Without Input**
      *   **Claim:** The neural circuitry generating the *content* of a visual experience during hallucination is identical to that used when seeing an actual object. Hallucination is simply this mechanism running "offline" without sensory input.
      *   **Verdict:** **Likely False or Overly Simplistic.** While there is overlap (e.g., visual cortex activation in both), evidence suggests differences. Veridical perception involves tightly coupled feedforward and feedback loops with sensory organs and thalamus. Hallucinations often involve hyperactivity in associative areas (like medial temporal lobe, default mode network) driving activity in sensory cortices *without* the normal constraints of bottom-up input and top-down predictive control from sensory-specific regions. The *initiation* and *constraint* mechanisms differ significantly.
      *   **Licenses Continuity Claim?** **Appears to, but Based on Misconception.** This naive reading might be what some popular interpretations imply, but it's neurologically inaccurate. The character's "nothing correcting it" doesn't capture the potential differences in *how* the experience is initiated and sustained.
      *   **What Would Change My Mind?** Clear neuroimaging evidence showing identical network activation patterns and dynamics during veridical perception of an object and a vivid hallucination of the same object, differing *only* in the absence of sensory organ input.
      *   **Extrapolation?** **Correcting Misinterpretation.** Neuroscience actively shows differences, not just absence of input.

  **Recommendation for Your Character:**

  *   **The Strongest, Most Credible Basis:** Anchor your character's explanation firmly in **Claim #2 (Predictive Processing Framework)** and **Claim #3 (Matter of Degree)**. These are defensible, cutting-edge neuroscientific perspectives that directly license the "same process, nothing correcting it" continuity claim.
  *   **How He Should Phrase It (Intelligently & Partly Right):** He should implicitly or explicitly reference the predictive brain and precision-weighting.
      *   *"Your brain is constantly predicting what's out there, Dr. Evans. It builds your perception from the inside out, using its best guess based on everything it knows. Usually, the light hitting your eyes sends strong signals that correct those guesses, keeping them anchored to reality. What you experienced... it's the same predictive machinery working, generating that image of your husband based on your profound expectation, your deep memory. But in that moment of shock and grief, perhaps those corrective signals from your eyes just... weren't strong enough to override the prediction. The system didn't weight them highly enough. So the prediction – the controlled hallucination we call normal sight – ran without its usual constraints."*
  *   **Why this works:**
      *   **Intelligent:** Reflects contemporary neuroscience (PPF).
      *   **Partly Right:** Captures the core continuity of mechanism (top-down prediction) and the key difference (failure of sensory error correction via precision-weighting).
      *   **Avoids Strawman:** Doesn't commit to radical metaphysics (#4) or the simplistic "same circuit offline" idea (#5).
      *   **Explains the Widow:** Directly addresses grief/expectation as strong priors and shock potentially altering sensory precision weighting.
      *   **Licenses "Controlled Hallucination":** Uses the slogan accurately within its strongest neuroscientific context.
  *   **Avoid:** The Radical (#4 - makes him sound dismissive of all reality) and the False (#5 - scientifically inaccurate) claims. The Near-Trivial (#1) is true but too weak to convincingly support the strong continuity claim without invoking PPF (#2).

  **In essence: Your editor is right that the slogan can be a cliché, but used precisely within the Predictive Processing framework, focusing on precision-weighting as the "control" mechanism, it remains a powerful and scientifically credible concept that perfectly supports your neuroscientist's point and keeps him intelligent and grounded.**
