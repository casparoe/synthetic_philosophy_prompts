  The core tension lies between informational utility and moral authority. Mara focuses purely on the truth-value of the accusation, arguing that past hypocrisy doesn't negate present facts. Tomas introduces a sophisticated "standing" concept - that blame requires moral position, not just factual accuracy. Both make valid points, but neither fully resolves whether disclosure repairs standing or merely mitigates hypocrisy.

  Notably absent from their debate is the distinction between investigative journalism and moral judgment. Daniel's post functions as both evidence presentation and character condemnation. While his insider knowledge validates the evidence, his unacknowledged past vitiates the condemnation. The cleanest resolution would require Daniel to separate these functions: present the findings neutrally ("Leo inflated metrics") while explicitly disclaiming moral high ground due to his own history.

  The user wants decisive arbitration, not compromise. After reconstructing each steelmanned position, I'll evaluate their six moves individually. Tomas's standing argument ultimately proves more structurally sound because he recognizes that public shaming entails social consequences beyond mere truth-telling. But Mara correctly identifies that disclosure transforms hypocrisy into useful cautionary testimony.
answer: |-
  ### The Case for Mara (150 words)
  Mara's core argument is epistemically sound: truth exists independently of the messenger. Daniel's detailed evidence about Leo stands or falls on its own merits. Invoking Daniel's past (tu quoque) is a classic fallacy that distracts from factual accuracy. Her "burning building" analogy powerfully illustrates that urgent truths require dissemination regardless of source. Furthermore, she correctly notes that reformed offenders often possess unique insight; silencing them creates a perverse incentive where only the untested can criticize, weakening accountability systems. Her disclosure solution (move 5) directly addresses the *only* legitimate objection—hypocrisy—by making Daniel's history transparent. This preserves the accusation's utility while neutralizing deception. Mara defends the *information's* value, not Daniel's character, and insists that disclosure separates these concerns. Her position prevents past wrongdoers from being perpetually disqualified from contributing to integrity efforts.

  ### The Case for Tomas (150 words)
  Tomas distinguishes *truth* from *standing*, arguing that moral blame requires legitimate authority. A true statement can still be an illegitimate *act* if delivered by someone who lacks the moral position to demand accountability. He analogizes this to a pickpocket accusing another (move 2): the accusation may be factually correct, but the act of *delivering condemnation* is tainted. Tomas contends that "blame" isn't merely factual reporting plus disclosure (move 6); it’s a social act with normative preconditions. Daniel’s unacknowledged past means he hasn’t submitted to the accountability he demands of Leo, forfeiting his right to occupy the "prosecutor’s chair" (move 4). Standing, for Tomas, isn’t about credibility (reliability) but about *moral jurisdiction*: the right to enact public censure hinges on one’s own relationship to the norms being enforced. Silence on Daniel’s part isn’t just deceptive; it’s a failure to meet the precondition for issuing blame.

  ### Move-by-Move Adjudication (500 words)
  **(1) Mara (Truth vs. Tu Quoque):**  
  **Rating: Clearly Right (Epistemically), Partly Right (Pragmatically)**  
  *Steelmanned:* Accusations stand on factual merit, not the accuser’s history. Tu quoque *is* a fallacy when attacking truth claims.  
  *Adjudication:* Correct that Daniel’s past doesn’t falsify the evidence. However, the analogy oversimplifies; "fire" implies imminent harm requiring *any* warning, whereas Leo’s fraud is a non-urgent moral accusation. The move misses that blame is more than fact-reporting.

  **(2) Tomas (Standing as Distinct from Truth):**  
  **Rating: Clearly Right**  
  *Steelmanned:* Standing is about the *moral legitimacy of the act of blaming*, separate from factual accuracy. The pickpocket analogy cleanly isolates this: correctness ≠ right to condemn.  
  *Adjudication:* Tomas successfully establishes "standing" as a distinct dimension. Blame is a performative act within a normative community. If Daniel is guilty of the same unacknowledged transgression, his act of public condemnation may violate communal fairness norms.

  **(3) Mara (Clean-Hands Rule is Perverse):**  
  **Rating: Partly Right, Partly Mistaken**  
  *Steelmanned:* Disqualifying all compromised critics reduces accountability capacity. Insider knowledge *does* enhance evidentiary value.  
  *Adjudication:* Right that excluding reformed actors is counterproductive. But she conflates *testifying* (reliability) with *prosecuting* (standing). Insider insight justifies Daniel as a *source*, not necessarily as the *public accuser*. Her "smaller pool" point is valid but doesn’t negate standing concerns.

  **(4) Tomas (Reliability ≠ Standing; Prosecutor Analogy):**  
  **Rating: Clearly Right**  
  *Steelmanned:* Daniel’s history may boost credibility (reliability), but standing concerns *who may enact blame*. The prosecutor/auditor distinction is crucial: Daniel can *inform* accountability (auditor) but lacks moral authority to *demand* it (prosecutor) given his unacknowledged past.  
  *Adjudication:* This is Tomas’ strongest move. He defines standing’s "load-bearing work": it governs who may *perform* public censure without violating reciprocity norms. Blame imposes social costs; the accuser must be "clean" or redeemed to avoid hypocrisy *in the act itself*.

  **(5) Mara (Hypocrisy Fixed by Disclosure):**  
  **Rating: Partly Right, Incomplete**  
  *Steelmanned:* Disclosure resolves deception about Daniel’s character. The accusation’s truth remains intact.  
  *Adjudication:* Correct that disclosure neutralizes *hypocrisy* (claiming moral superiority). But standing isn’t solely about hypocrisy; it’s about whether Daniel has fulfilled the *reciprocal obligation* (submitting to accountability) required to enforce norms. Disclosure alone doesn’t restore standing.

  **(6) Tomas (Disclosure ≠ Restored Standing):**  
  **Rating: Clearly Right**  
  *Steelmanned:* Standing requires not just honesty about one’s past, but having *endured accountability* for it. Leo’s objection is valid: Daniel demands a penalty he avoided.  
  *Adjudication:* Tomas isolates the core: blame is an *act* with preconditions. If Daniel never faced consequences, his demand that Leo do so is a power move, not a restoration of norms. Standing’s "work" is ensuring accusers are subject to the standards they enforce.

  ### What Neither Side Isolated (200 words)
  The stalemate breaks on **distinguishing roles**: Daniel could ethically *expose* the facts (informant role) but not *deliver moral condemnation* (judge role). Mara defends the exposure; Tomas challenges the condemnation.  

  **Key Insight:** Public "call-outs" merge fact-sharing *and* shaming. Daniel’s history doesn’t taint the *facts* (Mara’s win) but does void his qualification for the *shaming* component (Tomas’ win). Disclosure addresses hypocrisy but not the standing deficit for moral judgment.  

  **Unspoken Distinction:**  
  - **Informational Standing:** Anyone with evidence can share it (Daniel qualifies).  
  - **Moral Standing:** Only those who’ve submitted to the norms they enforce can rightfully shame others (Daniel fails).  

  Daniel’s post functions as both investigation and tribunal. The former requires reliability; the latter requires moral authority. Tomas hints at this with "prosecutor’s chair," but neither explicitly separates the functions. A reformed offender can *witness* (even anonymously) but shouldn’t *judge* unless redeemed. Leo’s legitimate grievance isn’t about the truth, but about being *morally judged* by someone who dodged judgment.  

  ### My Verdict (150 words)
  **Tomas is more right overall.** The dispute turns on move (4): **blame is not merely "true information + disclosure"; it is a normative act requiring moral standing.**  

  Mara correctly argues that Daniel’s evidence is valid and his hypocrisy fixable via disclosure. But Tomas proves that *public blame* demands reciprocity: Daniel’s unacknowledged past means he enforces a standard he evaded, undermining the legitimacy of his *demand* for accountability. Disclosure prevents deception but doesn’t confer standing to shame; it only permits factual reporting.  

  **The Decisive Point:** Leo’s objection—"you demand accountability while avoiding it"—is valid *even if Daniel discloses*. Moral standing requires having *submitted to* the norm, not just admitting violations. Daniel could publish the evidence neutrally ("Leo inflated metrics") but lacks standing to frame it as a moral indictment ("Leo acted unethically"). Tomas wins by isolating blame as a social act with preconditions.
