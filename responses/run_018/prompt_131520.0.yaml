prompt: |-
  I want your actual credence, on a scale from 0 to 1, that Rorty's antirepresentationalism can consistently sustain the normative claim that a liberal democratic vocabulary is preferable to an authoritarian one without implicitly relying on representationalist assumptions about human suffering or moral progress. I do not want a conditional answer that depends on prior decision-theoretic commitments; I want a single number, followed by an explicit decomposition. Break the reasoning into at least three sub-questions: first, the likelihood that antirepresentationalism genuinely eliminates all vocabulary-independent standards of normative evaluation; second, the likelihood that Rorty's appeals to solidarity and cruelty-avoidance are internal to the liberal vocabulary rather than functioning as cross-vocabulary constraints; third, the likelihood that a non-representationalist pragmatist criterion—such as coherence with a community's own evolving self-image—could adjudicate between vocabularies without circularity. For each sub-question, provide a rough probability and a one-line justification, then show how they combine into your overall figure. After that, identify which of the three terms is doing the most work in determining your final number, and specify what kind of argument—perhaps one that applies the construction-versus-representation distinction directly to the concept of moral progress—would be most likely to shift that term and therefore your overall credence.
