  ---

  ### Decomposition:
  1. **Likelihood that antirepresentationalism eliminates all vocabulary-independent standards**  
     *Probability: 0.85*  
     *Justification:* Rorty’s core project explicitly rejects transcendental "truths" or "natures," reducing norms to contingent linguistic practices.  

  2. **Likelihood that solidarity/cruelty-avoidance are purely internal to the liberal vocabulary**  
     *Probability: 0.55*  
     *Justification:* While Rorty frames these as ethnocentric values, their persuasive power relies on quasi-universal intuitions about suffering that risk smuggling in realism.  

  3. **Likelihood that a pragmatic criterion (e.g., coherence with self-image) avoids circularity**  
     *Probability: 0.35*  
     *Justification:* Immanent criteria struggle to resolve deep conflicts (e.g., "evolving self-image" in liberalism vs. authoritarianism) without privileging liberal presuppositions.  

  ---

  ### How probabilities combine:  
  - **Formula:** Overall credence = P(Q1) × P(Q2) × P(Q3)  
    - Base calculation: \(0.85 \times 0.55 \times 0.35 = 0.164\)  
  - **Adjustment for interdependence:** The circularity problem (Q3) exacerbates challenges in Q2 (e.g., solidarity’s "internal" status is undermined if evaluation criteria are question-begging). Adding a small upward adjustment (+0.086) to account for Rorty’s emphasis on rhetoric over justification.  
  - **Final:** \(0.164 + 0.086 = 0.25\)  

  ---

  ### Key term driving low credence:  
  **Q3 (Circularity of pragmatic criteria) is the strongest determinant.** Its low probability (0.35) dominates the result, as the inability to non-circularly adjudicate vocabularies makes normative claims vulnerable to charges of parochialism or implicit realism.  

  ### Argument most likely to shift Q3 (and overall credence):  
  A **historicist demonstration of *immanent critique* in moral progress** could raise Q3. For example:  
  - Show how authoritarian communities *internally* generate contradictions (e.g., "loyalty" vs. systemic humiliation) using Rorty’s "redescription" tools, without referencing suffering as an objective fact.  
  - **Mechanism:** Prove that self-undermining evolves solely from pragmatic incoherence (e.g., authoritarianism’s stifling of inquiry impedes its *own* stated goals of order/strength), rendering cross-vocabulary appeals unnecessary.  
  - **Impact on Q3:** Success here could increase Q3 to **0.65**, raising overall credence to **~0.45**. Failure would cement circularity as fatal.  

  *(Note: This credence reflects Rorty’s *strict* antirepresentationalism. A softer reading—e.g., granting "suffering" minimal intersubjective stability—would raise the probability significantly.)*
