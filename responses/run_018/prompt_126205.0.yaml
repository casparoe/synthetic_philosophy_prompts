answer: |-
  Your analysis brilliantly exposes how *Pretty Woman*'s "rescue fantasy" obscures institutional realities of sex work, serving as a Rorschach test for policy models. Let's break it down:

  **Key Scenes Mapped to Policy Models:**

  1.  **Polo Match Humiliation (Demand-Side Stigma):**
      *   **Nordic Model:** Embodies its core premise: buyers (the polo crowd) wield social power while workers (Vivian) face humiliation. Edward's defense ("She's with me") temporarily shields her, but only through *his* status, not her inherent rights. The scene reinforces the Nordic idea that demand is corrupt & transactional.
      *   **Legalization/Decrim:** Highlights the *limits* of these models. Even if decriminalized (NZ) or legalized (Germany/Netherlands), pervasive social stigma persists. Vivian has no recourse against discrimination here – no labor tribunal for harassment, no union rep. The "exit" (leaving with Edward) is the only solution presented, mirroring how policy struggles against deep-seated prejudice.

  2.  **Bathrobe/Necklace Negotiation (Labor Rights Void):**
      *   **All Models:** This scene screams the **absence of labor rights**, which is the core failure the film ignores. Vivian negotiates price/terms privately, vulnerable to Edward's whims. No written contract, no standard rates, no safety protocols (beyond Vivian's personal rules).
      *   **NZ Decriminalization:** This is *exactly* what NZ aims to fix. Under decrim, Vivian could potentially:
          *   Enforce a verbal contract for the necklace as payment.
          *   Have recourse if Edward reneged or became abusive *during the transaction* (occupational health/safety).
          *   Access peer support networks or an industry association for advice.
      *   **Legalization:** Might offer a framework for standardized payments within a licensed venue, but Vivian's independent operation outside a brothel leaves her exposed. The negotiation happens in a legal gray zone.
      *   **Nordic Model:** Criminalizing Edward *after* the transaction does nothing to protect Vivian *during* this negotiation or ensure she gets paid fairly. Her vulnerability is intrinsic to the interaction.

  3.  **Hotel Manager Stepping In (Gatekeeping & Class):**
      *   **German/Dutch Legalization:** Mirrors its tiered system. The Manager acts as the *licensing authority* and *moral gatekeeper*. He initially excludes Vivian ("We don't get many here who look like you"), then grants conditional access *only* because Edward vouches for her (like a licensed operator sponsoring a worker). His later support (shopping trip) is charity, not rights-based.
      *   **Nordic Model:** The Manager embodies the *social control* aspect – policing Vivian's presence until she's "redeemed" by Edward's patronage/benevolence. He reinforces the stigma.
      *   **NZ Decriminalization:** A decrim framework would treat Vivian as a worker renting a service (the hotel room). Discrimination based on her profession could be challenged legally. His interference in her client relationship would be inappropriate.

  **The Fairy-Tale Rescue & Institutional Erasure:**

  *   **Rescue Over Rights:** Vivian's "exit" (Edward's rescue) is the *only* solution presented. It's the ultimate Nordic fantasy: eliminate the demand (Edward stops being a "user") and "save" the worker. **This makes collective solutions invisible by design.** The film argues individual moral transformation (Edward's) solves structural problems.
  *   **Edward's Transformation: A Red Herring?** Absolutely. His change (from detached user to loving partner) is the *engine* of the fantasy. It suggests the problem is "bad buyers," not systems. It implies benevolent individuals, not labor rights or peer networks, are the solution. His wealth and power are the *only* tools for Vivian's safety and dignity – an impossible standard for real workers.
  *   **The Structural Absences (Brothel, Peers, Inspector):**
      *   **Not Just Hollywood:** While Hollywood favors romance, these absences are **structurally necessary** for the rescue narrative.
      *   **Brothel:** Showing a regulated brothel (legalization) would introduce institutions and potentially peer solidarity, undermining the isolation that makes Edward's rescue necessary and unique.
      *   **Peer Networks (Kit):** Kit exists, but their relationship is personal, not organizational. Kit is harmed, but there's no union, mutual aid fund, or advocacy group to turn to. Vivian helps *personally*. Showing effective peer support would offer an alternative path to safety/dignity outside Edward.
      *   **Labor Inspector:** An inspector enforcing health/safety standards or contract rights would represent the *state* or *collective* guaranteeing Vivian's rights, making Edward's personal intervention redundant and less heroic. Her vulnerability is essential to the plot.

  **Conclusion:**

  *Pretty Woman* is a potent allegory for the **Nordic Model's fantasy**: the "problem" (demand/buyers) is solved by individual moral redemption (Edward), leading to the "ideal solution" (exit/rescue of the worker). Vivian's complete lack of labor rights, her dependence on Edward's social capital for *everything* (safety, dignity, justice for Kit), and the total absence of institutions (unions, inspectors, brothel structures, peer organizations) are not oversights, but **essential pillars of this fantasy.**

  The film actively **erases the very institutions** that German/Dutch legalization (regulated businesses) and especially NZ decriminalization (worker rights, peer networks, occupational health) seek to establish. It replaces systemic solutions with individual wealth and romance. Edward's transformation *is* the red herring – it distracts from the fact that Vivian's safety and future depend entirely on the benevolence of a billionaire client, not on her rights as a worker or citizen. The institutional void isn't background; it's the condition that makes the fairy tale possible. It reveals how deeply narratives of "rescue" can obscure the need for collective power and labor rights.
