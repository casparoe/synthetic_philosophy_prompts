answer: |-
  ### Exam prompt  
  **Exam Prompt**  
  In vintage analog synthesizer repair, technicians often replace irreparable original circuit boards with modern digital components while retaining the chassis, keyboard, and branding. The resulting instruments are variably labeled by enthusiasts as "replicas" (emphasizing sonic fidelity), "reconstructions" (prioritizing material continuity), or "continuations" (highlighting historical lineage). These categorizations shift contextually based on speaker priorities.  

  Write an essay addressing the following: **Is there a principled line (i.e., an objective, stable boundary) separating "replica," "reconstruction," and "continuation," or are these categories best understood as family-resemblance clusters with fluid, context-dependent boundaries?** Take a clear position and defend it using the synthesizer repair example. Avoid extended summaries of theoretical frameworks (e.g., Wittgenstein or Goodman); focus on constructing an original argument.  

  Time: 75 minutes. Length: ~700 words. Do not include citations or a bibliography.  

  ---  

  ### Model answer (~700 words)  
  **Model Answer**  
  The restoration of vintage analog synthesizers—where original circuits are replaced with digital substitutes while preserving external components—exposes a conceptual quagmire. Community categorizations of these instruments as "replicas," "reconstructions," or "continuations" appear cohesive in isolation but disintegrate under scrutiny. I argue there is no principled line dividing these terms; they function as family-resemblance clusters, their boundaries expanding or contracting with contextual priorities like sonic accuracy, material authenticity, or historical narrative. Attempts to impose rigid definitions collapse under the weight of real-world use, where the concepts bleed into one another based on shifting evaluative goals.  

  First, consider sonic fidelity as a priority. When a technician installs a digital circuit that perfectly emulates an original’s sound profile, the result is often called a "replica." This suggests functional equivalence is paramount. Yet, if material integrity takes precedence—say, when 90% of the chassis is original—the same instrument becomes a "reconstruction," implying physical reassembly is the core criterion. Conversely, if historical lineage dominates (e.g., the repair is done by the original manufacturer), it may be deemed a "continuation," stressing unbroken heritage. Crucially, no single priority consistently "wins": a museum curator might reject a sonically flawless replica as inauthentic due to digital components, while a touring musician might dismiss a materially faithful reconstruction with poor sound. The categories thus orbit contextual values, not intrinsic properties.  

  Proponents of fixed boundaries might propose hierarchical rules—e.g., "material continuity defines reconstruction, digital parts mandate replica." But this fails when community practices defy such logic. For instance, a synthesizer with a single replaced capacitor might be called a "continuation" if the repair respects historical methods, yet one with identically functioning analog clones might be a "replica" if deemed impersonation. Even "historical lineage" fractures: a synth rebuilt by the original engineer using new parts might be a "continuation," while the same work by a third party is a "reconstruction." This inconsistency reveals that the terms are tools for negotiating authenticity, not descriptors of objective states.  

  The family-resemblance model better captures this fluidity. Like Wittgenstein’s "games," these categories lack a universal essence but share overlapping features—sound, material, history—that coalesce differently in each context. A 2023 Moog "re-issue" might be a market-driven "replica" to collectors (stressing profit over lineage) but a "continuation" in a documentary celebrating factory legacy. This plasticity is pragmatic: it lets the community prioritize what matters in a given scenario without ontological policing. Forcing rigid definitions would spark endless counterexamples—e.g., is a synth with 51% original material a "reconstruction" but at 49% a "replica"? Such lines feel arbitrary because they are.  

  Ultimately, synthesizer repair showcases how microdomains evolve "working concepts" that resist theorization. The blur between replica/reconstruction/continuation isn’t a flaw but an adaptive response to multidimensional authenticity. Sonic perfection, physical preservation, and historical resonance are all valid yet competing ideals; the labels slide to honor this complexity. Rather than seeking illusory principles, we should view the terms as rhetorical gestures that reveal speaker values. In doing so, they mirror broader human tendencies: we categorize to serve immediate needs, not to map rigid truths.  

  ---  

  ### Marking scheme  
  **Marking Scheme**  
  Total marks: 25 (5 per criterion).  

  1. **Clear Position (5 marks)**: Explicitly states whether categories have a principled line or operate as family-resemblance clusters.  
     *Typical wrong move*: Ambiguous or neutral stance (e.g., "it depends" without argumentative commitment).  

  2. **Contextual Analysis (5 marks)**: Uses synthesizer repair examples to show how sonic, material, or historical priorities shift category boundaries.  
     *Typical wrong move*: Abstract discussion without concrete synthesizer-based illustrations.  

  3. **Critique of Principled Boundaries (5 marks)**: Challenges the possibility of fixed lines (e.g., via counterexamples where labels conflict or overlap).  
     *Typical wrong move*: Merally defining terms without probing their instability.  

  4. **Argument for Fluidity (5 marks)**: Defends family-resemblance/cluster logic by emphasizing use-case variability (e.g., how a single synth is categorized differently across scenarios).  
     *Typical wrong move*: Asserting fluidity without explaining *why* boundaries are context-dependent.  

  5. **Structure and Originality (5 marks)**: Logical flow (introduction → argument → conclusion) and avoidance of theoretical summary (e.g., no Wittgenstein/Goodman rehashing).  
     *Typical wrong move*: Disorganized paragraphs or overreliance on course-theorist jargon.
