prompt: |-
  hey i'm writing teh final exam for my grad seminar on conceptual analysis—specifically the unit on copycat reasoning and fluid concepts, where concepts slide around inside small domains without clear borders. i want an essay question that gets students away from the usual art-forgery examples and into a microdomain where the slippage is genuinely hard to police: vintage analog synthesizer repair. here's the setup—original circuit boards are long gone, so techs swap in modern digital equivalents but keep the chassis, keyboard, and branding. the community then calls the result a 'replica', a 'reconstruction', or a 'continuation' of the original instrument, and those labels shift depending on whether people care about sonic fidelity, material continuity, or historical lineage. the exam should ask whether there's a principled line between those three categories or whether they're just family-resemblance clusters that move with context. students should answer in about 75 minutes, take an actual position, and they shouldn't be able to just summarize wittgenstein or goodman. no bibliographies or citations—some take this remotely. can you draft: (1) The exam prompt—clear enough for 75 mins; (2) A model answer around 700 words that argues rather than lists; (3) A marking scheme out of 25 with five must-hit points (marks for each, total 25), plus one line per point on teh typical wrong move. please use these exact headings in this order: Exam prompt, Model answer (~700 words), Marking scheme. avoid asking for reading lists.
reasoning: |-
  We are creating an exam prompt for a graduate seminar on conceptual analysis, focusing on the fluidity of concepts in the context of vintage analog synthesizer repair. The key is to move away from art-forgery examples and into this microdomain where the boundaries between 'replica', 'reconstruction', and 'continuation' are slippery and context-dependent.

  Exam Prompt Requirements:
  - Clear and concise for a 75-minute exam.
  - Asks whether there is a principled line between the three categories or if they are family-resemblance clusters that shift with context.
  - Requires students to take a position and argue, not just summarize theorists.
  - No citations or bibliography.

  Model Answer Requirements:
  - About 700 words.
  - Takes a clear position and argues for it.
  - Does not list but argues.

  Marking Scheme Requirements:
  - Out of 25 points with five must-hit points (each with a specific mark).
  - One line per point on the typical wrong move.

  Headings must be in order: Exam prompt, Model answer, Marking scheme.

  Let's draft each section.

  ### Exam Prompt

  **Exam Prompt**

  In the niche domain of vintage analog synthesizer repair, technicians often replace irreparable original circuit boards with modern digital equivalents while retaining the original chassis, keyboard, and branding. The resulting instruments are variably categorized by the community as "replicas," "reconstructions," or "continuations" of the original, with the categorization shifting based on whether the speaker prioritizes sonic fidelity, material continuity, or historical lineage.

  Write an essay that addresses the following: Is there a principled line (i.e., a clear, objective boundary) separating the categories of replica, reconstruction, and continuation, or are these best understood as family-resemblance clusters whose boundaries shift with context? Take a clear position and support it with reasoning. Avoid relying on extended summaries of theoretical frameworks (e.g., Wittgenstein or Goodman); instead, focus on constructing an argument grounded in the synthesizer repair example.

  You have 75 minutes. Your essay should be approximately 700 words. Do not include a bibliography or citations.

  ---

  ### Model Answer (~700 words)

  **Model Answer**

  In the world of vintage analog synthesizer repair, the replacement of original circuit boards with modern digital components while preserving the outer shell and branding has sparked a fascinating conceptual dilemma. The community’s use of the terms "replica," "reconstruction," and "continuation" to describe these hybrid instruments appears to lack fixed boundaries, shifting with the speaker’s emphasis on sound, material, or history. I argue that there is no principled line separating these categories; instead, they function as family-resemblance clusters, with their meanings fluidly adapting to contextual priorities. Attempts to impose rigid definitions consistently fail because the criteria for each term are inherently dynamic and interdependent.

  Consider first the goal of sonic fidelity. When a technician replaces an analog circuit with a digital one that perfectly mimics the original’s sound, the result is often called a "replica." This term suggests a copy that achieves functional equivalence. However, the moment we shift focus to material continuity—the physical components—the same instrument becomes a "reconstruction." Why? Because the essence of the device now lies in the reassembly of original parts (the chassis, keyboard) around a new core. But if the community values historical lineage—the unbroken story from the original manufacturer—then the instrument might be deemed a "continuation," especially if the repair is done by a recognized expert using approved methods. Each perspective highlights a different aspect: function, matter, or narrative. Crucially, no single aspect is universally privileged; the dominant concern varies by context.

  Proponents of a principled distinction might argue that we can establish clear boundaries by hierarchizing criteria. For instance, they might claim that material continuity is primary: if the original circuit is replaced, it cannot be a continuation. But this ignores cases where the community accepts minimal material survival as sufficient for continuity—say, when only one original resistor remains. Alternatively, a sonic purist might insist that sound defines the instrument. Yet, if a digital circuit produces indistinguishable sound, why is it often still called a replica rather than the real thing? The answer lies in the unspoken weight given to material history. Even sonic fidelity cannot override the community’s attachment to the authentic physical object. Thus, any hierarchy of criteria is itself context-dependent, not absolute.

  The fluidity becomes more evident when we observe how these terms are applied inconsistently. A synthesizer restored by a boutique workshop using period-correct parts might be a "reconstruction" in a repair forum but a "continuation" in a marketing brochure. The same instrument might be downgraded to a "replica" if it later undergoes a digital modification. This isn’t mere caprice; it reflects how the community’s priorities shift with the conversational context—whether technical, commercial, or nostalgic. Such shifts are characteristic of family-resemblance concepts, where no single feature is necessary or sufficient, but overlapping similarities create a network of meanings.

  Attempts to police these categories with rigid definitions invariably stumble on counterexamples. For instance, defining "continuation" as requiring unbroken material lineage excludes instruments whose circuits were replaced by the original manufacturer—a practice sometimes accepted as legitimate. Similarly, a "replica" typically implies intentional copying, but what if the replacement parts are functionally identical but not designed as imitations? The boundaries blur because the concepts are anchored in use, not essence.

  Ultimately, the synthesizer repair community demonstrates how specialized microdomains develop their own conceptual ecosystems. The terms replica, reconstruction, and continuation are tools for navigating values—authenticity, function, heritage—that often conflict. Rather than seeking a nonexistent principled line, we should embrace this fluidity as a pragmatic response to complex realities. The categories move because the community’s needs move. In doing so, they reveal a deeper truth: concepts are not static boxes but living negotiations of meaning.

  ---

  ### Marking Scheme (out of 25)

  **Marking Scheme**

  Each of the following five criteria is worth up to 5 marks, for a total of 25.

  1. **Clear Position (5 marks)**: The essay must take a clear stance on whether there is a principled line or family-resemblance clusters.  
     *Typical wrong move*: Failing to state a position or wavering between positions.

  2. **Argumentation Grounded in Example (5 marks)**: The argument must be developed using the synthesizer repair example, not abstract theory.  
     *Typical wrong move*: Summarizing Wittgenstein or Goodman instead of engaging with the synthesizer case.

  3. **Analysis of Category Fluidity (5 marks)**: The essay should explore how the boundaries between replica, reconstruction, and continuation shift based on context (sonic, material, historical).  
     *Typical wrong move*: Treating the categories as fixed without addressing contextual shifts.

  4. **Critical Engagement with Principled Distinctions (5 marks)**: The essay must address and refute (or defend) the possibility of a principled line, not merely describe the categories.  
     *Typical wrong move*: Listing definitions without critiquing the idea of boundaries.

  5. **Coherence and Structure (5 marks)**: The essay must be logically organized and flow from introduction to conclusion, with each paragraph building the argument.  
     *Typical wrong move*: Disjointed paragraphs or lack of a clear progression of ideas.

