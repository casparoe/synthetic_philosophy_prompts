answer: |-
  Your observation identifies a profound and under-acknowledged epistemological bias in historical narrative construction. While no single universally accepted term exists for this **specific pattern of outcome-dependent agency attribution**, the phenomenon can be precisely defined and situated within existing critical frameworks:

  1.  **Proposed Term:** **"Teleological Agency Bias"** or **"Catastrophic Agency Attribution"**
      *   **Definition:** *The selective assignment of autonomous causal power to non-human forces (pathogens, climate, geology) primarily when they coincide with negative societal outcomes (collapse, crisis, transformation), while simultaneously demoting comparable non-human forces to inert background conditions when societies exhibit resilience or continuity – with the valence of the outcome itself driving the explanatory framing rather than a consistent principle of causal weight.*

  2.  **How it Differs from Determinism:**
      *   **Environmental Determinism:** Assumes environmental factors exert a *consistent*, primary, and often predictable causal force shaping human societies across contexts (e.g., Jared Diamond's *Guns, Germs, and Steel*). Causal priority is fixed and inherent in the environment.
      *   **Teleological Agency Bias:** Assigns agency *inconsistently* and *retrospectively*, based *only on the outcome*. The environment's "power" is *narratively constructed* post-hoc: it gains agency when needed to explain failure but vanishes when explaining success. It lacks determinism's predictive or consistent causal claims. It's a *narrative convenience*, not a theoretical stance.

  3.  **Boundary Conditions & Distinguishing Features:**
      This bias operates when:
      *   **A significant non-human stressor is demonstrably present** in both cases (crisis and resilience).
      *   **The outcome diverges** (crisis vs. stability/adaptation).
      *   **The explanatory narrative shifts** the causal role of the *same type* of non-human force based *primarily* on that outcome.
      *   **Human agency is framed reactively in crisis** ("society was overwhelmed by the plague") **but proactively in resilience** ("institutions mitigated the drought").

  4.  **Distinguishing Genuine Cases from Bias: Criteria for Warranted Attribution**
      Attributing primary agency to a non-human force is warranted *only* when rigorous analysis demonstrates:

      | **Criterion** | **Warranted Attribution** | **Likely Bias** |
      |---------------|----------------------------|----------------|
      | **Magnitude/Duration** | Stressor exceeds plausible adaptive capacity thresholds of *any* comparable society | Stressor within documented adaptive range of other societies |
      | **Pre-existing Vulnerability** | Society already critically fragile *before* stressor arrival (e.g., famine during war) | Robust society faced novel stressor but still adapted |
      | **Counterfactual Analysis** | Strong evidence adaptation was impossible *regardless* of institutions/choices | Evidence suggests alternative responses could have altered outcome |
      | **Specific Mechanism** | Clear, direct causal pathway from stressor to outcome (e.g., 90% mortality → labor shortage) | Outcome attributed to stressor without eliminating other factors |
      | **Uniform Impact** | Stressor caused similar collapse across diverse societies | Societies with different structures had divergent outcomes to same stressor |

  5.  **Avoiding the Bias: Analytical Best Practices**
      *   **Consistent Baseline:** Treat comparable non-human forces as *potential* agents/forces with defined properties *before* assessing the outcome.
      *   **Symmetrical Explanation:** Demand explanations for *both* crisis and resilience that explicitly model the interaction between the specific stressor *and* specific societal structures/choices. Ask: "Why did Society A collapse *while* Society B adapted to the *same* volcanic winter?"
      *   **Multi-Causal Frameworks:** Explicitly use frameworks (e.g., Coupled Human-Natural Systems, Vulnerability-Resilience) that force integration rather than competition for causal priority.
      *   **Counterfactual Reasoning:** Rigorously explore "what if" scenarios: "Could *any* plausible institutional response have mitigated the 95% mortality plague?" vs. "Did *this specific* institutional failure turn a manageable drought into famine?"
      *   **Avoid Outcome-Driven Verbs:** Scrutinize narrative language. Replace "the plague destroyed the society" with "a society experiencing X, Y, Z vulnerabilities suffered catastrophic collapse *when confronted by* a plague with A, B, C properties."

  This pattern reflects a deep-seated cognitive tendency to seek active "villains" for catastrophe while crediting "heroic" human agency for success. It's a form of **narrative convenience** arising from **hindsight bias** and the difficulty of rigorously modeling complex, contingent interactions. Recognizing **Teleological Agency Bias** is crucial for moving toward genuinely symmetrical, multi-causal historical explanations that avoid granting non-human forces "magical" agency only in the service of explaining human failure. The key is demanding consistent, evidence-based principles for assigning causal weight, regardless of the outcome's valence.
