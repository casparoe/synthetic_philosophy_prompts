  User's "in the weeds" directive means I can dive into meta-linguistics without hand-holding. They'll appreciate distinctions like: Belief revision is cognitive; annulment is social-status-altering. And the firing analogy? Perfect. Getting fired changes your reality irrespective of your self-perception; retraction does the same for a paper's truth-value in the academic record.

