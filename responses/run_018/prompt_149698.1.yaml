  Breaking it down: The illocutionary act here would be the journal wielding its authority to strip epistemic status. Perlocutionary effects involve changed citations or beliefs. But they insist this isn't mere persuasion ("belief revision dressed up") because the obligation is constitutive—like being fired, your status changes regardless of others' opinions. Clever analogy. 

