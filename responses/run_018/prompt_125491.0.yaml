  ### Epistemic Regress Seminar Activity: The Archive Dilemma  
  **Duration:** 75 minutes  
  **Participants:** 14 upper-level epistemology students  
  **Setup:**  
  - Chairs and tables arranged in a circle.  
  - Each student receives:  
    - 1 **belief card** with a low-stakes claim (e.g., "The university archive should reject the donated collection").  
    - A **deck of 15 justification cards** (face down). Decks are identical but contain three hidden card types:  
      - 4 **bedrock cards** (halt chain; no reverse side).  
      - 4 **loop cards** (reverse side points to an earlier card in the *same* student’s chain).  
      - 4 **trail cards** (reverse side points off-table to an "infinite regress" marker, e.g., an empty chair).  
      - 3 regular justification cards (backed by further justifications).  
    - **20 shared credibility tokens** (e.g., poker chips) in a central pool (total pool: 280 tokens). Tokens are visible to all.  

  **Rules:**  
  1. **Starting the Chain (0 minutes):**  
     - Each student places their belief card face up. This creates an initial unbacked link.  
     - **Immediate cost:** 14 tokens removed from the pool (1 per unbacked belief card).  

  2. **Building Justifications (5–35 minutes; intervals every 5 minutes):**  
     - At **5, 10, 15, 20, 25, 30, and 35 minutes**, the facilitator rings a bell. Students:  
       - **Pay costs** for unbacked links and active trails:  
         - 1 token per **unbacked link** (any open chain or trail card).  
         - 1 token per **active trail card** (fatigue cost).  
       - **Play one card** if their chain is *not* ended (bedrock, loop, or trail stops play).  
         - Draw the top card from their deck, look at it, and play it immediately.  
         - **Card effects:**  
           - **Regular justification:** Place behind the current card. It becomes the new unbacked link.  
           - **Bedrock:** Place the card. Pay **5 tokens** (arbitrary-choice penalty). Chain ends.  
           - **Loop:** Place the card. Choose an earlier card in *your own chain* and point to it (e.g., with an arrow sticker). Pay **3 tokens** (circularity fee). Chain ends.  
           - **Trail:** Place the card. Point it off-table. Immediately pay **1 token** (fatigue starter). Chain ends, but fatigue continues.  

  3. **Token Exhaustion & Chain Breakage:**  
     - If tokens are insufficient to cover costs, all open/trail chains break instantly. Affected students are "out."  

  4. **Voting & Social Payoff (40 minutes):**  
     - Timer stops. Count intact chains (bedrock/loop/trail chains unbroken by token exhaustion).  
     - **Group decision:** If ≥8 students have intact chains, the archive *rejects* the donation (aligning with their belief). If <8, the donation is *accepted*.  

  **Session Structure:**  
  - **0–5 mins:** Introduction. Explain rules (emphasise no collaboration; chains are independent).  
  - **5–40 mins:** Gameplay. Facilitator enforces intervals, collects tokens, and monitors rules.  
  - **40–45 mins:** Voting. Announce the archive decision.  
  - **45–75 mins:** Debrief (structure below).  

  **Predictable Issues & Handling:**  
  - **Issue 1: Students negotiate shared loops.**  
    - *Handling:* Intervene immediately: "Remember, chains are independent—no collaboration. Your loop must point to *your own* chain."  
  - **Issue 2: Hoarding bedrock cards.**  
    - *Handling:* Enforce the "play one card per interval" rule strictly. No card-skipping allowed.  
  - **Issue 3: Confusion about trail fatigue.**  
    - *Handling:* Clarify: "Fatigue costs apply at *every interval* after playing a trail card. It’s ongoing."  

  **Debrief (30 mins):**  
  1. **Experiential Reflection (10 mins):**  
     - Ask students: "What strategies felt sustainable? Which penalties were most frustrating? Did anyone feel ‘stuck’?"  

  2. **Mapping to Epistemic Theories (15 mins):**  
     - Reveal the three card types as analogues:  
       - **Bedrock → Foundationalism:** Halts the regress but imposes an "arbitrary choice" penalty (mimicking foundationalism’s unmoved mover, which critics call arbitrary).  
       - **Loop → Coherentism:** Avoids arbitrariness through mutual support but incurs a "circularity fee" (echoing objections that circular justification is question-begging).  
       - **Trail → Infinitism:** Avoids both penalties but accumulates "fatigue" (symbolising infinitism’s endless demand for reasons).  
     - **Distortions to clarify:**  
       - Fatigue is metaphorical. Real infinitism doesn’t tire you; it holds that justification *can* always extend further.  
       - The circularity fee oversimplifies coherentism. Real coherentists don’t defend "small loops" but holistic, system-wide support.  
       - The token cost distorts the regress by making it a shared resource problem.  

  3. **Limitations of the Activity (5 mins):**  
     - **Verbal supplement required:** The physical setup cannot replicate that the epistemic regress is about *rational necessity*, not practical exhaustion. In real life, the demand for justification is normative (what we *ought* to provide), not a race against tokens or time. The activity’s "fatigue" and token costs are stand-ins for cognitive or practical limits, but the regress problem persists even in principle.  

  **Rationale:**  
  - Students experience regress pressure individually through token scarcity and penalties, mirroring philosophy’s "agonistic" tension between foundationalism, coherentism, and infinitism.  
  - The voting payoff creates stakes without naming theories prematurely, ensuring discomfort with each strategy feels organic.  
  - British English used throughout (e.g., "tokens," "penalties," "facilitator"). No citations/textual references.
