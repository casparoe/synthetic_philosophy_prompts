  - Immediately, take 14 tokens from the pool (for the initial unbacked links).
  - At 5,10,15,20,25,30,35 minutes:
     - Ring the bell.
     - Collect tokens: 
          - Count the number of unbacked links (all open chains and trail chains).
          - Count the number of trail cards.
          - Take (unbacked links + trail cards) tokens from the pool.
     - Then, each student whose chain is not ended (i.e., they don't have bedrock, loop, or trail) must play one card:
          - Draw the top card from their deck.
          - Look at it.
          - Play it immediately.
          - Resolve the card type:
               - Regular: Place it behind the current last card. It becomes the new unbacked link.
               - Bedrock: Place it. Then pay 5 tokens to the pool. The chain is now ended.
               - Loop: Place it. Choose an earlier card in your chain and point to it (use an arrow sticker? or simply say which card). Pay 3 tokens. The chain is ended.
               - Trail: Place it and point it off the table. The chain is ended, but it has an unbacked link and will incur fatigue. Immediately pay 1 token (first fatigue). Note that this student will now incur a fatigue cost at every future interval.
  - If at any token collection the pool does not have enough tokens, then all open and trail chains break. Those students are out and remove their chain from play (or turn it over).

  **Voting (5 minutes):**
  - At 40 minutes, stop the game.
  - Count the number of intact chains (students who are not out and have a chain that is either bedrock, loop, or trail that survived).
  - If >=8, then the group rejects the donation (so the vote on acceptance is "no").
  - If <8, then the donation is accepted (vote on acceptance is "yes").

  **Debrief (30 minutes):**
  - Ask students to describe their experience and strategies.
  - Reveal the three positions: foundationalism (bedrock), coherentism (loop), infinitism (trail).
  - Map the penalties to the philosophical challenges:
     - Foundationalism: the bedrock penalty represents the charge of arbitrariness.
     - Coherentism: the loop fee represents the circularity objection.
     - Infinitism: the fatigue represents the unending demand for justification.
  - Distortions:
     - The fatigue cost is only metaphorical; infinitism doesn't cause physical tiredness.
     - The circularity fee doesn't capture that coherentism uses the entire web of beliefs, not just a small circle.
     - The activity's finite time and tokens don't reflect the ideal nature of the regress problem.
  - Emphasize: the physical setup cannot reproduce the rational demand of justification that is central to the epistemic regress. The tokens and the time pressure are stand-ins for the practical limitations of human cognition, but the regress problem is about the structure of justification in principle.

  **Handling Predictable Problems:**
  - If students try to negotiate shared loops: remind them that the rules forbid collaboration and that each chain is independent.
  - If students hoard bedrock cards: this is prevented by the rule that they must play the top card at each interval. They cannot skip playing.

  This design should create a tangible experience of the epistemic regress problem and the trade-offs between the three responses.
