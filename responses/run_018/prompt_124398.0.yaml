  ok so i'm trying to wrap my head around the Judy Benjamin problem with updating on conditonals, but not the basic version everyone teaches. the usual story is she's told some conditional about recovery and being sent to the red or blue army, then people argue about whether her credance in being in the red army should stay flat. but here's the twist i'm stuck on: suppose she updates on a conditional whose antecedent she later realizes is actually imposible given her other beliefs — like she figures out recovery is totally out of the question — but she still needs to revise where she thinks she is. does Jeffrey conditioning still apply here, or does the framework break because you're conditioning on a message that's technically false but was still the object of her belief revision? i feel like this gets at whether conditionals are just propositions or more like rules for how credences should shift, but i can't tell if that's a real distinction or just me being confused. can you explain the conceptual issue without just repeating the standard answer?
