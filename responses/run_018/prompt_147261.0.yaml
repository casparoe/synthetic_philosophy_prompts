answer: |-
  That's a sharp observation of a very common rhetorical maneuver in constitutional monarchy debates. You've identified a core inconsistency that often goes unchallenged. There isn't a single, universally accepted formal term for *exactly* this pattern, but we can define it precisely and distinguish it from a potentially legitimate defense.

  Here's the breakdown:

  1.  **The Core Fallacy: "Shifting Valuation of the Ceremonial Role"**
      *   **The Move:** Your friend assigns diametrically opposed valuations to the *exact same attribute* of the monarchy (its purely ceremonial nature) depending on which criticism is being countered.
      *   **Against Democratic Critique:** "It's ceremonial, therefore powerless, therefore harmless/democratically irrelevant." (Value: **Neutral/Negative** – its lack of power makes criticism invalid).
      *   **Against Replacement Proposal:** "It's ceremonial, therefore uniquely embodying continuity/identity, therefore indispensable." (Value: **Positive** – its symbolic nature makes it irreplaceable).
      *   **The Contradiction:** The ceremonial nature cannot simultaneously be the reason it's *harmless AND irrelevant to democracy* **and** the reason it's *uniquely powerful AND essential to the state's identity/stability*. The valuation of the *same core function* shifts radically based solely on the attack vector.

  2.  **Why "Motte-and-Bailey" Doesn't Quite Fit:**
      *   Motte-and-Bailey involves retreating from a hard-to-defend claim (the bailey) to an easier-to-defend one (the motte), then later reasserting the bailey. Your friend isn't retreating from one claim to another; they are making two *different claims* about the *same characteristic*, each tailored to defeat a specific criticism. The ceremonial role *is* the central point in both defenses, but its implications are flipped.

  3.  **Related Fallacies:**
      *   **Special Pleading:** Granting the monarchy a unique exception to rules that would apply to any other institution. ("*Any* other purely ceremonial head of state would be pointless and disrupt continuity, but *this specific hereditary one* magically isn't because... reasons/tradition.")
      *   **Equivocation (Subtle):** Using the word "ceremonial" or "symbolic" but subtly changing its implied meaning or weight between defenses (from "meaningless formality" to "profound embodiment").

  4.  **Defining the Fallacy (Proposed Name/Description):**
      *   **"Institutional Double-Lens Fallacy"** or **"Ceremonial Role Contradiction"**
      *   **Definition:** The fallacy of defending an institution by assigning contradictory valuations to its core, unchanging characteristic (in this case, its ceremonial/symbolic nature) solely in response to different criticisms, without reconciling the inherent tension between those valuations. The characteristic is portrayed as:
          *   **Weak/Neutral** when defending against critiques of power or democratic deficit.
          *   **Strong/Indispensable** when defending against critiques of its existence, legitimacy, or replaceability.
      *   **The Core Issue:** It treats the *same attribute* as both a shield against democratic accountability *and* the source of irreplaceable power/legitimacy, creating an incoherent and self-contradictory defense.

  5.  **Where it Stops Being This Fallacy and Starts Being a Legit Two-Level Defense:**
      A legitimate defense *must* consistently reconcile the ceremonial nature with both points *without contradiction*. It must acknowledge the tension and provide a coherent framework.

      *   **Legitimate Defense Example:**
          "The monarchy's power is deliberately constrained to the ceremonial and symbolic sphere by constitutional design (*acknowledges lack of governing power*). However, within that sphere, its apolitical, hereditary nature grants it unique symbolic capital derived from deep historical continuity. This capital functions independently of partisan politics, providing a stable focal point for national identity, social cohesion, and diplomatic soft power (*explains the value of the symbolism*). An elected ceremonial president, while potentially respected, inherently lacks this specific type of transcendent, non-partisan legitimacy rooted in centuries of tradition. The *lack of governing power* is precisely what *enables* its unique symbolic strength and stability. Therefore, its ceremonial nature serves a vital non-governing function that an elected figure could not replicate in the same way."

      *   **Key Differences from the Fallacy:**
          1.  **Consistency:** The ceremonial/symbolic nature is consistently presented as its *defining feature*.
          2.  **Integration:** The lack of governing power isn't downplayed as "irrelevant"; it's presented as *essential* to *enable* the symbolic function.
          3.  **Mechanism:** Explains *how* the symbolic power works (apolitical continuity, focal point for identity/cohesion) and *why* an elected figure couldn't replicate it (partisan association, lack of deep historical transcendence).
          4.  **No Valuation Shift:** The ceremonial role isn't valued negatively in one context and positively in another; its value (as a source of stability/identity) is consistently positive, *while its lack of governing power is presented as a necessary condition for that value*, not a separate negative attribute.

  6.  **The Constitutional Theory Angle:**
      While not a specific *fallacy* term, constitutional theorists (like Bagehot with "dignified" vs. "efficient") acknowledge the *dual nature*. The legitimate defense *accepts and integrates* this duality: the dignified (symbolic/ceremonial) part *gains its power precisely because* it is separate from the efficient (governing) part. The fallacy occurs when this duality is used inconsistently as a rhetorical shield rather than a coherently explained constitutional principle.

  **In essence:** You've caught your friend in an **inconsistent valuation of the monarchy's core characteristic**. It's a fallacy because the ceremonial role is portrayed as simultaneously too weak to matter democratically *and* too uniquely powerful to replace, without reconciling how it can be both. A legitimate defense must consistently argue that the *lack of governing power is the very foundation* of its unique non-governing symbolic strength, explaining the mechanism and acknowledging the trade-off. The inconsistency lies not in having two points, but in the contradictory *weight and implication* assigned to the *same attribute* to dodge different criticisms.
