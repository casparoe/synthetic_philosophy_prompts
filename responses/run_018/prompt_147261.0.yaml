  me and my friend got in a huge fight last night about constitutional monarchy, like UK vs Japan vs Sweden. i kept seeing this loop in his arguments. he said the monarch has zero real power now, just rubber stamps stuff, so complaining about democracy is silly—its purely ceremonial. but then i said ok lets make it an elected ceremonial office with the exact same powers, and he flipped: 'no, the crown gives continuity you cant replicate, its essential to national identity.' so the monarchy is defensible because its weak when democracy is the issue, but defensible because its strong when replacement is the issue. is there an actual name for this rhetorical pattern? i know motte-and-bailey is when you retreat to a weak claim then sneak back, but this feels different—the two claims share the same ceremonial role, theyre just evaluated opposite directions based on the attack. does constitutional theory have a term for an institution being simultaneously powerless and indispensable? if not, can you define it properly and say where it stops being this and starts being a legit two-level defense? please dont just say 'symbolic capital' or whatever, i want the carving not the label.
