prompt: |-
  Hey, I'm writing up a workshop pitch and I've been arguing with my roommate about whether we can ever really lock down what's in an ontology when big chunks of the relevant information are just permanently inaccessable — not hidden, but genuinely out of reach. I need you to act like a professional philosopher of science with some metaphysics background, and please think carefully before you start. Do a quick brainstorm of the obvious requirements people usually miss when they talk about Quine-style ontological commitment.

  Then give me the full desiderata spec for a theory of ontology identification that works even under informational closure failures — situations where the usual inference-to-best-explanation breaks down because the gap isn't temporary. I want the cases it must handle (direct unobservability, destroyed historical records, modal distance, quantitative vs qualitative inaccessability), the distinctions it can't collapse (ontology vs epistemology, identification vs confirmation, permanent vs contingent gaps), any scientific results it can't flat-out contradict, and flag which pair of desiderata you suspect are jointly unsatisfiable. Also tell me which single requirement kills the most popular accounts, and be explicit about what counts as failure versus mere incompleteness. Keep it in the weeds but don't ask me to read anything — no bibliography, I'll fill in citations myself. Make the framing sharp, like I'm pitching this for a one-year research fellowship, and don't just repeat the standard Quinean criterion back at me.
reasoning: |-
  Okay, the user is writing a workshop pitch and needs help framing a theory of ontology identification that works even when parts of the information are permanently inaccessible. They mentioned arguing with their roommate about locking down an ontology under such conditions. So, the core issue is ontological commitment when inference-to-best-explanation fails due to permanent informational gaps.

  First, I need to recall Quine's ontological commitment: "to be is to be the value of a bound variable." But the user wants to go beyond that, especially when evidence is incomplete not just temporarily but permanently. The user listed specific cases: direct unobservability, destroyed records, modal distance, quantitative vs. qualitative inaccessibility. They also want distinctions like ontology vs. epistemology, identification vs. confirmation, permanent vs. contingent gaps.

  The user is likely an academic, maybe in philosophy of science or metaphysics, preparing a fellowship pitch. Their explicit need is a desiderata spec for a robust theory. But deeper, they might want to challenge existing frameworks and propose a novel approach that handles extreme epistemic limitations. They might also need to show why current theories fail, especially popular ones, to highlight the gap their workshop would address.

  Key requirements missed in typical discussions: People often conflate epistemic access with ontological existence. For example, assuming that if we can't observe something, it shouldn't be in our ontology. But Quine's approach allows for unobservables if they're part of the best theory. The problem arises when best explanation is underdetermined due to permanent gaps. So, desiderata must handle underdetermination without collapsing ontology into epistemology.

  Cases to handle: Direct unobservability (e.g., dark matter's nature), destroyed records (historical events leaving no trace), modal distance (counterfactuals beyond possible evidence), quantitative gaps (precise values missing), qualitative (types of entities inaccessible). The theory must distinguish between what exists and what we can know, and between identifying entities versus confirming their properties.

  Scientific constraints: The theory can't contradict established science like quantum mechanics (e.g., uncertainty principles) or relativity (limits on information transfer). Also, it must accommodate scientific underdetermination, such as different interpretations of QM.

  Tensions: Likely, desiderata 2 (non-vanishing commitments) and 6 (scientific coherence) might conflict. For example, in quantum gravity, positing entities might clash with empirical constraints, forcing a trade-off between commitment and coherence.

  Popular accounts fail on desideratum 4 (permanent gap handling). Constructive empiricism (van Fraassen) only commits to observables, so it avoids unobservables entirely, which is a failure under permanent inaccessibility. Structural realism might struggle with destroyed records where structures aren't recoverable.

  Failure vs. incompleteness: Incompleteness means gaps that could be filled later; failure is when the theory can't make any ontological claims where it should. For instance, if a theory remains silent on dark matter's ontology due to inaccessibility, that's failure if some commitment is necessary.

  The user needs a sharp, structured spec. Outline desiderata clearly, list cases, distinctions, conflicts. Highlight the tension between maintaining commitments and aligning with science. Point out how popular theories fail on specific points, especially handling permanent gaps. This will strengthen their pitch by showing the necessity of their workshop.
answer: |-
  ## Desiderata for Ontology Identification Under Informational Closure Failures (ICF-Ontology Framework)

  **Core Problem:** Standard ontological commitment (Quinean or otherwise) relies on inference to the best explanation (IBE), presupposing that sufficient evidence *is or could be* available. This breaks down under **informational closure failures (ICF)** – scenarios where critical information is *permanently and constitutively* inaccessible, not merely hidden or temporarily unavailable.

  **Key Missed Requirements in Standard Discussions:**
  1.  **Permanence vs. Contingency:** Treating *permanent* gaps as merely *very large* temporary ones, ignoring the qualitative shift in justification.
  2.  **Underdetermination Depth:** Failing to distinguish underdetermination *resolvable in principle* (future evidence) from *irresolvable* underdetermination inherent to ICF.
  3.  **Epistemic Burden Shifting:** Assuming the burden of proof lies solely on the *positor* of an entity, neglecting the burden on frameworks claiming *no commitment* is possible under ICF.
  4.  **"Best" Without Convergence:** Defining "best explanation" when competing theories are *necessarily* empirically equivalent due to the ICF, rendering traditional IBE criteria (simplicity, scope) potentially inapplicable or circular.
  5.  **The Identity Threshold:** Ignoring the question: *How much epistemic access is minimally required to justifiably include an entity type in an ontology, even if specific instances or properties remain inaccessible?*

  **Desiderata for an ICF-Robust Ontology Identification Theory:**

  1.  **ICF Case Coverage:** Must handle:
      *   **Direct Unobservability:** Entities fundamentally beyond detection (e.g., pre-Big Bang "states," certain quantum gravity entities, non-interacting dark matter components).
      *   **Destroyed Historical Records:** Events/entities leaving *no* trace (e.g., specific origins of life scenarios, unique historical events with zero evidence).
      *   **Modal Distance:** Entities/processes in causally isolated domains (e.g., other universe bubbles in eternal inflation, genuinely non-actualized possibilia).
      *   **Quantitative Inaccessibility:** Inability to determine precise values or magnitudes *in principle* (e.g., exact initial conditions of chaotic systems, quantum phase beyond decoherence).
      *   **Qualitative Inaccessibility:** Inability to determine fundamental categorical properties *in principle* (e.g., the "intrinsic nature" of fundamental quantum fields beyond relational structure).

  2.  **Essential Distinctions (Non-Collapsible):**
      *   **Ontology (What *is*) vs. Epistemology (What we *know*):** The theory must *explicitly maintain* this separation. ICF is an *epistemic* constraint; it cannot *directly* dictate ontology, only our access to it.
      *   **Identification (What exists *as a type*) vs. Confirmation (Knowing *specifics* about instances):** Commitment to the *existence of a category* (e.g., "dark matter particle") must be distinguishable from knowledge of *its specific properties, distribution, or interactions*.
      *   **Permanent Gap (ICF) vs. Contingent Gap (Temporary Ignorance):** The theory must have criteria for recognizing and treating these fundamentally differently. Contingent gaps allow for potential future resolution; ICFs do not.
      *   **Causal Isolation vs. Epistemic Isolation:** Something can be causally connected but epistemically isolated due to ICF (e.g., information destroyed by black hole evaporation).

  3.  **Scientific Coherence Constraints:** Cannot contradict:
      *   **Quantum Mechanics (Uncertainty/Indeterminacy):** Accepts inherent limits on simultaneous knowledge (quantitative ICF).
      *   **Relativity (Causal Structure):** Accepts light-cone constraints on information flow (contributing to modal distance).
      *   **Thermodynamics/Information Theory (Irreversibility):** Accepts that some information loss is fundamental (destroyed records).
      *   **Underdetermination Results:** Must accommodate that multiple empirically adequate models *can* exist for the accessible domain, even under ICF.

  4.  **Functional Requirements:**
      *   **Non-Vanishing Commitment (NVC):** Must allow for justified ontological commitment *even under ICF* for entities playing indispensable roles in empirically successful theories covering the *accessible* domain. Silence is not the only option.
      *   **Accessibility-Graded Commitment (AGC):** The *strength* or *specificity* of commitment must be modulated by the *degree* and *type* of inaccessibility (e.g., commitment to "dark matter" as a broad category is stronger than commitment to a specific WIMP candidate under qualitative ICF).
      *   **Structural Anchor (SA):** Commitment under ICF must be grounded in the entity's *structural role* within the best theory of the accessible domain (e.g., stress-energy source, symmetry breaker, causal intermediary), not intrinsic properties.
      *   **Underdetermination Management (UM):** Must provide principled ways to handle the *necessary* underdetermination introduced by ICF (e.g., distinguishing commitments core to the structural anchor from dispensable auxiliary details).
      *   **Failure Mode Specification (FMS):** Must clearly define when an ontological claim *fails* (is unjustified) vs. when it is merely *incomplete* (lacking specific details due to ICF). Failure occurs when the purported entity lacks a necessary structural anchor in the accessible theory (e.g., positing fairies to explain gravity fails; positing a dark sector particle anchoring galactic rotation curves succeeds, even if its nature is ICF).

  **The Critical Tension (Likely Jointly Unsatisfiable):**
  *   **Non-Vanishing Commitment (NVC)** demands we commit to entities despite ICF.
  *   **Scientific Coherence Constraint (Avoiding Contradiction w/ Underdetermination & QM/Relativity)** implies there will *always* be multiple empirically equivalent structures compatible with the accessible data under ICF (radical underdetermination).

  **Satisfying both seems impossible:** NVC pushes us to pick *one* ontology implied by *one* structure. Scientific coherence shows *multiple* structures (and hence ontologies) fit equally well. Reconciling this requires either:
      a)   A meta-criterion for selecting *among* structurally anchored ontologies under radical underdetermination (risking arbitrariness), or
      b)   A weakening of commitment (AGC) to something less specific than traditional object ontology (e.g., commitment only to *roles* or *minimal structural features*), potentially undermining the intuitive force of "commitment."

  **The Requirement That Kills Popular Accounts:**
  *   **Permanent Gap Handling (PGH)** embedded within the case coverage and distinctions. Failure occurs if an account either:
      *   **Collapses ICF into Contingency:** (Most naturalistic Quineans, some structural realists) Treats permanent gaps as just very hard problems, relying on potential future access. *Failure:* Cannot provide a justified ontology *now* for domains where access is *constitutively* impossible.
      *   **Retreats to Strict Verificationism/Anti-Realism:** (Logical Positivism, strict Constructive Empiricism à la van Fraassen) Demands direct or indirect verifiability. *Failure:* Declares ontological commitment *impossible* for ICF domains, violating NVC, even when the entity is structurally indispensable (e.g., refusing commitment to *any* dark matter ontology).
      *   **Relies Solely on IBE:** (Standard Scientific Realism) IBE *presupposes* sufficient evidence is available or could become available. *Failure:* Lacks resources when IBE is *constitutively undermined* by the ICF itself, leading to unjustified commitment or unjustified skepticism.

  **Failure vs. Mere Incompleteness:**
  *   **Failure:** An ontological claim is *unjustified* or *meaningless* within the framework. This occurs when:
      *   The purported entity lacks a demonstrable **Structural Anchor (SA)** in the best theory of the accessible domain.
      *   The claim contradicts the **Scientific Coherence Constraints**.
      *   The claim conflates **Ontology/Epistemology** or **Identification/Confirmation** in a way that renders commitment vacuous (e.g., "dark matter is whatever causes the rotation curves" without commitment to *its existence as a distinct entity type*).
  *   **Mere Incompleteness:** An ontological claim is *justified at a certain level of generality* but lacks detail due to ICF. This occurs when:
      *   The entity has a strong **SA**, satisfying **NVC** and **AGC**, but specific properties fall under **Quantitative** or **Qualitative Inaccessibility**.
      *   Competing specific ontologies are **Underdetermined (UM)** but share a common core commitment justified by **SA** and **NVC**.

  **Framing for Fellowship Pitch:** This framework tackles the *hard limit* of ontological reasoning: when evidence runs out *forever*. It moves beyond Quine by explicitly defining the criteria for justified ontological commitment *despite* constitutive epistemic barriers, resolving the core tension between scientific realism and radical underdetermination in extreme scenarios. The identified tension between NVC and radical underdetermination presents a key research challenge, demanding novel approaches to minimal structural commitment or meta-ontological selection. This is essential for foundational physics (quantum gravity, cosmology), deep history, and any science confronting ultimate limits of knowledge. Your workshop is positioned to pioneer solutions where standard accounts falter.
