answer: |-
  Here’s a reusable decision procedure grounded in that distributed-self idea, designed for practical use in family conferences. It flows as a sequence of steps you’d follow conversationally, with integrated examples and honest caveats. Think of it as a structured way to listen for echoes of the patient in others when their own voice is gone.

  Start with the neural substrate check. This is purely medical: does the patient’s brain still show any flicker of the old patterns? Review the charts for signs of *coherent* reactivity—not just reflexes, but things like consistent emotional responses to familiar voices, attempts to communicate basic needs, or fleeting moments of recognition that align with their pre-injury self. If there’s reliable evidence of this—say, the Alzheimer’s patient still lights up when hearing their grandchild’s name—then stop. Their own neural "I" is still present, however dimly, and we default to interpreting *their* signals, not someone else’s version of them. If there’s nothing, or only chaotic, meaningless reactions (like random agitation without triggers), move to step two. This isn’t philosophy; it’s neurology. If the lights are truly out in the substrate, we look for the pattern carried elsewhere.

  Now the pattern fidelity check. Here’s where Hofstadter’s idea becomes operational: we’re asking if a close other isn’t just *recalling* the patient, but *channeling* their specific preferences and quirks. Don’t ask metaphysical questions; gather concrete evidence. Have the relative describe *how* the patient would likely react to *this specific decision* (e.g., "Would they accept this feeding tube if it meant living bedridden?"). Probe for granularity: not just "they hated hospitals," but "they’d trade a year of life to avoid being trapped in a room smelling of antiseptic." Look for matches to documented past choices—like the elderly Alzheimer’s patient’s wife recalling her husband’s exact phrasing from an old living will about "not being a burden," even correcting the notary’s misremembered details. Crucially, test for consistency *against* the relative’s own interests. If the wife advocates for palliative care despite her own terror of loneliness, that’s high fidelity. If a TBI patient’s parent suddenly insists on aggressive interventions the patient previously mocked, while fighting for inheritance—red flag. Also, introduce a decay curve: patterns fade if not reinforced. If the patient’s neural self collapsed years ago and the relative hasn’t interacted meaningfully since (e.g., estranged siblings), their "carried" pattern is likely corrupted nostalgia. Fidelity requires recent, repeated, vivid engagement. If the evidence shows projection, guilt ("I promised I’d never let them die"), or self-interest, stop. Their voice isn’t the patient’s echo.

  Then the resonance threshold call. Even if fidelity seems high, is the carried pattern *stable* and *specific* enough to count as part of the patient’s "I"? This is where you admit it’s partly a judgment. Look for two things: stability across time (does the relative give the same nuanced answer about patient preferences when asked weeks apart, or in different emotional states?) and specificity beyond clichés. "They loved life" fails; "they’d refuse any treatment leaving them unable to recognize their dog or crack dark jokes about their condition" passes. Apply this to the young TBI patient: if Dad carries his son’s fierce independence ("He’d rather die than be bathed by strangers") and Mom carries his compassion ("He’d endure anything for his little sister’s graduation"), each might hold a fragment of the pattern. If both fragments are high-fidelity, you might synthesize them—maybe the patient would accept short-term indignity for a family milestone, but never permanent dependence. But if the fragments are vague or contradictory ("He was tough... but also sensitive"?), or if grief visibly distorts their recall during the meeting, the threshold isn’t met. No stable pattern, no proxy authority.

  Now your controversial case: a 50-year-old stroke patient, minimally conscious for months. His wife insists he’d refuse further surgery, citing his often-repeated quip: "If I can’t build a bookshelf or flirt with you, unplug me." You find her bitter and think grief twists her view. But she passes fidelity: she predicts his hypothetical reactions accurately (confirmed by his old emails), advocates against her own financial interest, and shows stable, specific recall. Her sharp tone? Maybe part of *his* dark humor. Here, the procedure forces you to honor the pattern—it’s his voice in her, not her pain speaking alone.

  What this can’t do: It won’t predict if the carried pattern lasts years (grief evolves, memories blur). It doesn’t resolve if identity is *literally* shared (it just pragmatically treats high-fidelity echoes as actionable). It won’t override legal hierarchies—a spouse with high fidelity trumps a distant cousin, but a court-appointed guardian trumps both. And it can’t erase your discomfort when the answer feels wrong, but it *can* show you why the evidence points there. Use it to map the echoes, not the metaphysics. When the loop persists outside the skull, listen.
