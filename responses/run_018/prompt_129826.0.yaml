prompt: |-
  After a recent experience in a collective-bargaining context made the logic of credible commitment suddenly concrete rather than abstract, I have been asked to lead a single ninety-minute workshop for a reading group of non-specialist graduate students—mostly in law and public policy—on the hitchhiker thought experiment associated with Derek Parfit and the broader puzzle of rational irrationality. Do not explain the argument to me; plan how I should build it with them. Lay out the dependency order of the conceptual pieces: which distinction—between evidential and causal reasoning, or between ex ante rationality and ex post evaluation—must be secured before the payoff structure is introduced, and which can only make sense afterward. Choose the one carrying scenario that should bear the full explanatory weight; defend why the canonical stranded-driver example should be modified or replaced for this audience, specifying exactly which structural feature of the original (the temporal separation of decision and execution, the irrelevance of reputation mechanisms, the visibility of the agent's reasoning to the other party) the substitute must preserve and which it may relax. Map the predictable misconceptions—perhaps that irrationality here is mere weakness of will, that reputation solves the problem, that the case assumes determinism, or that it is just a prisoner's dilemma in disguise—and state precisely where in the sequence each should be headed off. Provide one closing question that tests whether the students have grasped the structural tension rather than merely retelling the story. Finally, identify which strand of the broader discussion—such as the analogy to personal identity over time, the appeal to self-defeating theories of rationality, or the comparison with Newcomb's problem—should be explicitly bracketed and acknowledged as omitted at this level.
reasoning: |-
  Okay, the user is asking for help designing a workshop on the hitchhiker thought experiment and rational irrationality for grad students in law and public policy. They've recently had a real-world experience with collective bargaining that made these concepts concrete, so I need to make sure the workshop connects theory to practical contexts.

  First, I should consider the audience. These are non-specialist graduate students in law and public policy. They're smart and analytical but not philosophers. They need concrete examples that relate to their fields. The canonical stranded driver example from Parfit might be too abstract or not relatable enough. I need to modify it to something more relevant to their experiences, like collective bargaining or public policy decisions.

  The key conceptual distinctions here are evidential vs. causal reasoning and ex ante vs. ex post rationality. I need to decide the order to introduce these. Probably, starting with ex ante and ex post makes sense because it's more intuitive. People naturally think about decisions before and after the fact. Once that's clear, introducing evidential vs. causal reasoning will make more sense. If students confuse these, the whole argument might fall apart. So sequence is crucial.

  For the scenario, replacing the stranded driver with a labor union threat scenario seems better. In collective bargaining, a union threatens to strike if demands aren't met. The problem is making the threat credible. If the employer believes the union won't actually strike because it's costly, then the threat fails. This mirrors the hitchhiker problem where the driver threatens not to pay but then benefits from paying if the hitchhiker helps. The structural features to preserve are: the agent's action affects the outcome (causal), the decision and execution are separated in time, reputation isn't a factor, and the other party knows the agent's rationality. In the union example, reputation might play a role, but we can specify a one-off negotiation to bracket that. Relaxing the visibility of reasoning is okay since the focus is on the union's internal commitment.

  Predictable misconceptions need addressing. Students might think it's about weakness of will, but rational irrationality is about strategic irrationality. Reputation solving the issue is another; clarify it's a one-time scenario. Determinism isn't assumed; it's about rational choice. And it's not a prisoner's dilemma because there's no mutual defection here. Each misconception should be preempted when introducing the payoff matrix.

  For the closing question, something that forces them to apply the structural tension. Asking why a rational agent's commitment fails even when both parties understand the payoffs. This tests if they see the core issue of rationality undermining commitment.

  Finally, bracketing discussions like personal identity over time or Newcomb's problem. These are deep philosophical tangents that could derail the workshop. Mentioning them but stating they're beyond the scope keeps focus on rational irrationality in commitments.

  The user's deeper needs: they want the students to grasp the practical implications of theoretical concepts, especially in their fields. Connecting to collective bargaining shows how abstract philosophy applies to real policy and legal issues. Ensuring the workshop builds concepts step-by-step without overwhelming them is key. Also, addressing misconceptions early prevents confusion. The user likely wants the students to walk away with a tool for analyzing commitment problems in their own work, not just understanding a thought experiment.
answer: |-
  Here’s a structured workshop plan tailored to your audience and goals, prioritizing conceptual scaffolding and practical relevance:

  **Core Sequence & Dependency Order**  
  *(90 min total; timings approximate)*  

  1. **Intro: Commitment Problems in Real Life (10 min)**  
     - *Hook:* Briefly reference your collective bargaining experience (e.g., "Why might threatening a strike *rationally* undermine your bargaining position?").  
     - *Goal:* Frame the workshop around **credible commitment dilemmas** in policy/law contexts.  

  2. **Establish Ex Ante vs. Ex Post Rationality (15 min)**  
     - *Activity:* Discuss a simple example—e.g., signing a gym contract (ex ante: "I’ll go daily!" vs. ex post: "Skipping won’t hurt").  
     - *Why first?* This distinction is intuitive and sets up the core tension: What’s rational *now* vs. *later* may conflict. **Must precede payoff structures.**  

  3. **Introduce Payoff Matrix (10 min)**  
     - *Use a generic commitment scenario:* "Actor A promises Action X to Actor B, but if B acts first, A benefits by breaking the promise."  
     - *Visual:* Sketch a 2x2 matrix highlighting A’s dominant strategy *ex post*.  

  4. **Introduce Evidential vs. Causal Reasoning (20 min)**  
     - *Activity:* Contrast "If I carry an umbrella, it *causes* rain to stay dry" (causal) vs. "Carrying an umbrella *signals* rain is likely" (evidential).  
     - *Why here?* Payoff structures clarify *why* evidential reasoning matters: Your *intention* now is evidence of your *action* later. **Requires payoff matrix as foundation.**  

  ---

  **Chosen Scenario: Modified Labor Strike Threat**  
  *(Replaces Parfit’s Stranded Driver)*  
  **Scenario:**  
  *A union threatens to strike if management rejects demands. Management knows:  
  - If they concede, union gets payoff 10 (management: 5).  
  - If they reject and union strikes, both get 0.  
  - If they reject and union *doesn’t* strike, management gets 10 (union: 2).*  

  **Why This Modification?**  
  - **Preserves critical features:**  
    - Temporal separation: Threat → Management decision → Union action.  
    - Irrelevance of reputation: Specify a one-time negotiation (e.g., plant closing).  
    - Visibility of reasoning: Management knows the union is rational.  
  - **Improvements for audience:**  
    - **Familiar context** (connects to collective bargaining).  
    - **Relaxes driver/hitchhiker asymmetry:** Both parties are institutional actors, avoiding "charity" overtones.  
    - **Clarifies stakes:** Payoffs reflect power dynamics (e.g., union gains from bluffing).  

  ---

  **Predictable Misconceptions & Mitigation**  
  1. **"It’s just weakness of will!"**  
     - *When to address:* During ex ante/ex post discussion.  
     - *Preemption:* "Rational irrationality is *strategic*—acting against your interest *now* to achieve a goal, not impulsiveness."  

  2. **"Reputation solves this!"**  
     - *When to address:* Scenario setup.  
     - *Preemption:* Explicitly state: "Assume no future interactions—this is a one-shot game."  

  3. **"It assumes determinism!"**  
     - *When to address:* During causal/evidential reasoning.  
     - *Preemption:* "We’re modeling rational choice, not metaphysics. The puzzle is: *Can rationality demand irrationality?*"  

  4. **"This is just Prisoner’s Dilemma!"**  
     - *When to address:* After payoff matrix.  
     - *Preemption:* Contrast payoff structures: PD has mutual defection as dominant strategy; here, the "irrational" threat *creates* cooperation.  

  ---

  **Closing Question to Test Understanding**  
  *"If the union publicly hires a famously stubborn negotiator (who hates backing down), why might this make their strike threat credible—even if it’s irrational for the union to strike later?"*  
  - **Tests grasp of:** Evidential reasoning (hiring signals commitment) + ex ante rationality (choosing an "irrational" agent secures better outcomes).  

  ---

  **Bracketed Strand: Personal Identity Over Time**  
  - **Why bracket?** Parfit links this to rationality via "reductionist" personal identity, but:  
    - It requires metaphysical groundwork irrelevant to policy audiences.  
    - Distracts from core mechanics of commitment.  
  - **Acknowledge:** "Parfit connects this to debates about whether 'future you' is truly *you*, but today we focus solely on rational choice dynamics."  

  **Why Omit Newcomb/Self-Defeating Theories?**  
  - Newcomb introduces contentious "predictor" mechanics, muddying causal vs. evidential takeaways.  
  - Self-defeating theories (e.g., "rationality requires irrationality") are meta-philosophical—beyond the workshop’s applied focus.  

  **Delivery Tip:** Use whiteboard for payoff matrices and flowcharts. Label columns/rows with policy-relevant terms (e.g., "Union: Strike/Not Strike"; "Mgmt: Concede/Reject"). Connect each step back to collective bargaining. This ensures the abstract logic remains anchored in the concrete problem that sparked their interest.
