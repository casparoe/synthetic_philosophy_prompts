  First, they describe a choreography: defenders list institutional practices as Western values, critics counter with non-Western examples or Western violations, defenders shift to saying it's about historical commitment, not uniqueness. Then defenders use the term prescriptively, implying distinctiveness, while critics keep treating it as an ownership claim. The debate stalls because each side attacks a different logical structure within the same term.

  The user has already distinguished this from motte-and-bailey and family-resemblance abuse. So I need to identify or coin a term that captures this dual-structure interplay. Let me recall established concepts. Equivocation involves ambiguous terms, but here it's systematic. Strategic ambiguity is intentional, but both sides might not be conscious of the shift. Essentialism claims inherent traits, but here the defender shifts away from uniqueness. No-true-Scotsman redefines criteria, which isn't the case here.

  Hmm, maybe this is a form of dialectical dissonance? The two structures are mutually reinforcing in the debate. The geographic-historical aspect paired with normative authority creates a feedback loop. The critic's focus on provenance locks the defender into the aspirational stance, and vice versa. 

  I should check if there's an existing term. "Persuasive definition" comes to mind, but it's usually about redefining terms, not two coexisting structures. "Terminological inexactitude" is too vague. "Conceptual bracket creep" might work, but doesn't capture the geographic-normative pairing. 

  Coining a term: "Geonormative Entanglement"? That highlights the geographic and normative elements interwoven. Or "Dialectical Bifurcation"? Emphasizes the two tracks. But "Entanglement" better captures the persistent pairing. 

  Defining it: The coexistence of a descriptive-historical concept and a prescriptive-normative concept under one label, leading to systematic miscommunication where each side engages only one aspect. Boundary cases: Polysemy has multiple meanings without systematic pairing. Strategic essentialism is a deliberate tactic, whereas here it might be inadvertent. Value revision is explicit change, not concurrent structures.

  Need to ensure the definition clearly distinguishes from the user's exclusions. Motte-and-bailey has a defensive retreat; here both structures are used actively. Family-resemblance is about fuzzy boundaries, but here both concepts are precise but conflated. 

  Also, considering the user's deeper needs: They want clarity in debates about cultural concepts, possibly to resolve or critique such stalemates. They might be seeking a tool for academic analysis or to foster more productive discussions. The coined term should aid in dissecting these arguments methodically.
answer: |-
  Based on your meticulous description and the required conceptual carving, this pattern is best understood as **"Geonormative Entanglement"**. While no *single* established term perfectly captures the geographic-normative pairing and the systematic dialectical stall you describe, this coinage integrates key elements from argumentation theory and political philosophy. Here's the precise dissection:

  ### Definition of Geonormative Entanglement
  A persistent argumentative pattern where a single culturally charged label (e.g., "Western values") simultaneously operates under **two distinct logical structures**:
  1.  **Descriptive-Historical Structure (DHS):** A self-ascribed, aspirational inventory of norms/practices tied to a geographic/civilizational history, acknowledging imperfect realization and non-exclusive origins.
  2.  **Prescriptive-Authoritative Structure (PAS):** A normative claim imbuing the label with distinctive, binding authority, implicitly relying on uniqueness or civilizational exceptionalism to justify its prescriptive force.

  The entanglement occurs when:
  -   Defenders **toggle** between DHS (when challenged on uniqueness/hypocrisy) and PAS (when issuing normative demands).
  -   Critics **consistently interpret** the label *only* as PAS (an ownership/exclusivity claim).
  -   This creates a **systematic misalignment**: Defenders rebut criticisms of PAS by retreating to DHS, while critics treat DHS defenses as irrelevant because they attack PAS. The label's dual structure thus perpetuates the debate without resolution, as each side engages a different facet.

  ---

  ### Mapping to Your Description & Key Boundaries
  1.  **Core Fit:**
      -   Defender's shift from concrete practices (implying PAS) to historical commitment (DHS) when countered.
      -   Defender's prescriptive use ("we must defend") requiring PAS's implied distinctiveness/authority.
      -   Critic's persistent focus on refuting exclusivity (attacking PAS), even when defender uses DHS.
      -   Stalling due to structural misalignment within the *same* label, not mere disagreement.

  2.  **Distinguishing from Nearest Concepts:**
      -   **Equivocation/Polysemy:** Ordinary ambiguity involves random or context-dependent meaning shifts. *Entanglement is systematic:* DHS and PAS are *non-randomly paired and mutually reinforcing* within the *same dialectical context*. The defender *needs* PAS for normative force but *relies* on DHS for defensibility; the critic's PAS-focus *locks* the defender into DHS. It's a structured duality, not loose variation.
      -   **Strategic Ambiguity:** While related, strategic ambiguity is a deliberate tactic to avoid commitment. *Entanglement* may arise unintentionally from the label's inherent tension. The key is the *specific pairing* of geographic-historical association (DHS) with normative authority (PAS), creating a feedback loop exploited *by the dynamic itself*, not necessarily by conscious design.
      -   **Essentialism:** Essentialism claims inherent, immutable properties. DHS explicitly *avoids* essentialism (admits non-uniqueness, historical contingency). PAS *borrows the rhetorical weight* of essentialism without explicitly claiming it, relying on the *implication* of distinctiveness derived from the geographic label.
      -   **No-True-Scotsman (NTS):** NTS redefines category membership ad hoc to exclude counter-examples. The defender using DHS *doesn't redefine "Western"* to exclude non-Western societies exhibiting the values; they *acknowledge* non-Western instances but still claim the label for the West based on historical adoption. The shift is between *what the label denotes* (DHS vs. PAS), not membership criteria.
      -   **Motte-and-Bailey (M&B):** As you noted, M&B protects an indefensible claim (bailey) by retreating to a defensible one (motte). In *Entanglement*, *neither structure is inherently more defensible or core:* DHS faces charges of historical cherry-picking/hypocrisy; PAS faces charges of false uniqueness. They are *co-dependent* facets of the same contested label, not a core/extension hierarchy. The defender uses DHS *defensively* but PAS *offensively*, without clear retreat.
      -   **Strategic Essentialism:** This is a deliberate, temporary adoption of essentialist categories for political mobilization. *Entanglement* is a *structural feature of the discourse* around a term like "Western values," often operating without the speaker's conscious strategic intent regarding essentialism. The geographic-normative pairing is the core issue, not the strategic use of essentialism per se.
      -   **Value Revision After Criticism:** This involves a group explicitly changing its stated values. *Entanglement* involves *no revision:* The defender maintains *both* structures concurrently, shifting rhetorically without abandoning either. The DHS is not a new position adopted *after* criticism; it's a pre-existing facet of the label's meaning selectively deployed.

  3.  **Boundary Cases (What Geonormative Entanglement is NOT):**
      -   **A Debate About Universality vs. Relativism:** The critic isn't necessarily defending universalism; they might be attacking Western exceptionalism. The core issue is the label's *internal duality*.
      -   **Simple Hypocrisy Charge:** While hypocrisy (violating stated PAS) is a *trigger* for the defender's shift to DHS, the entanglement is the *structural reason* the debate stalls *despite* the hypocrisy being acknowledged via DHS.
      -   **All Cultural Value Debates:** The pattern specifically requires the *geographic/civilizational label* ("Western," "Asian," "Islamic") combined with *normative prescription*. Debates about "democracy" or "human rights" *without* such a geographic tag may involve polysemy but lack the geonormative pairing.
      -   **Conscious Deception:** While speakers *might* exploit it strategically, the pattern can emerge organically from the tensions within culturally loaded labels. The *systematic pairing and dialectical effect* define it, not intent.

  ### Why "Geonormative Entanglement"?
  *   **"Geo-"**: Captures the indispensable geographic/civilizational framing ("Western").
  *   **"Normative-"**: Captures the prescriptive, authoritative dimension (PAS).
  *   **"Entanglement"**: Emphasizes the persistent, inseparable, and mutually reinforcing co-existence of DHS and PAS within the single label, causing the dialectical stall. It highlights how the structures are knotted together, benefiting each side's misinterpretation of the other.

  This phenomenon arises from the inherent tension in attempting to ground universalist normative claims (PAS) in a particularist historical-geographic identity (DHS). The label "Western values" becomes a site where this unresolved tension manifests as a structured, recurring argumentative impasse. Recognizing Geonormative Entanglement allows analysts to diagnose the stalemate not as simple bad faith or confusion, but as a product of the label's constitutive duality.
