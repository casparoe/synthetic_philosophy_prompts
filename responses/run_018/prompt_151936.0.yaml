prompt: |-
  Hey! So I'm putting together this grad seminar on epiphenomenalism and the paradox of phenomenal judgment, and I need you're help predicting where my colleague Dr. Voss lands on a new case. You're an expert philosopher of mind — think step by step, maybe start with a quick brainstorm of the competing principles she could be running, then work through the prediction.

  Her track record on phenomenal-judgment cases (all assuming epiphenomenalism is true):
  - Classic zombie twin makes first-person pain and color reports with zero qualia present; she rules those judgments epistemically empty.
  - Blindsight patient reports "no visual experience" in the blind field; she says that's correct and justified, despite there being no phenomenal cause of the report.
  - A tracking-module case: an introspective mechanism monitors neural state N, which is always correlated with quale Q but never causally influenced by Q. The subject judges "I have Q"; she says it's justified because the correlation is perfect and the mechanism never errs.
  - An overflow-style case where the subject claims to experience eight colors simultaneously even though working-memory can only hold four; she rejects the report as unjustified, saying the judgment mechanism overreaches what it can actually track.
  - Brain-in-vat recieveing artificial pain-signals with no tissue damage or actual qualia; she calls the judgment "I'm in pain" false, and notes that even if a real quale were present but causally isolated, the mechanism couldn't discriminate.

  The new case: a split-hemisphere-style setup where the left hemisphere generates verbal reports about a subtle emotional quale, but the causal pathway runs entirely through right-hemisphere processing that never interacts with the quale itself — correlation is perfect, the subject has never misreported, but there's literally no causal bridge from the feeling to the report mechanism.

  Predict Dr. Voss's verdict — justified or not? Map out the rules that fit her past verdicts (maybe a strict causal-contact rule, a correlation/reliability rule, and a coherence-with-self-model rule), say which ones diverge here, give your best guess with reasons, identify the closest analog from her track record, and name the further case that'd settle it. Also be honest: if her preceedents genuinely underdetermine this, what's the principle she's locking in with either choice?

  No need for bibliographies, reading lists, or made-up citations — just the conceptual analysis. And please don't invent quotes from real texts; paraphrase anything you reference.
reasoning: |-
  Okay, let's tackle this step by step. Dr. Voss seems to have a nuanced approach to phenomenal judgments under epiphenomenalism, so I need to map out her underlying principles first based on her past rulings.

  Looking at her track record:
  - Zombie case: Verbal reports with no qualia → epistemically empty. So she rejects purely functional reporting without any qualia present.
  - Blindsight: "No experience" report without phenomenal cause → justified. Here she accepts accurate negative reports even when qualia aren't causing the judgment.
  - Tracking module: Reliable correlation without causal influence → justified. This suggests reliability can compensate for lack of causation.
  - Overflow case: Report exceeds tracking capacity → unjustified. Here coherence with cognitive limits matters more than the report's content.
  - Brain-in-vat: Artificial signals without qualia → false. She insists on actual qualia presence, dismissing reliable but non-qualia-based mechanisms.

  Now for the new split-brain case: Perfect correlation between emotional quale and report, but no causal link from quale to reporting mechanism (left hemisphere relies on right-hemisphere processing that doesn't interact with the quale itself).

  Key principles emerging:
  1. **Causal Isolation Rejection**: She dismisses judgments when qualia are absent (zombie) or causally irrelevant (BIV).
  2. **Reliability Acceptance**: She accepts judgments when mechanisms are perfectly reliable (tracking module, blindsight).
  3. **Cognitive Fidelity Requirement**: She rejects judgments that exceed system capabilities (overflow).

  The conflict here is that reliability and correlation are perfect (like tracking module), but the quale is causally isolated from the report (like BIV). The blindsight case is similar in having accurate reports without qualia causation, but that was a negative report ("no experience"), whereas this is a positive report ("I have this emotion").

  My prediction: She'll rule this unjustified. Why? Because:
  - Unlike blindsight (which is correct absence reporting), this is positive phenomenal attribution without causal contact
  - Like the BIV case, the mechanism isn't actually detecting the quale, even if correlated
  - Her rejection of the overflow case shows she cares about whether the mechanism is genuinely responsive to the target (here it's responsive to neural correlates, not the quale)

  Closest analog is actually the BIV case - in both, the report is generated by something other than the quale itself. The tracking module case differs because there the mechanism is monitoring the neural state that normally correlates with the quale.

  To settle her position definitively, we'd need a case with perfect correlation and reliable reporting where the quale exists but is causally isolated from both the neural state and the reporting mechanism. If she accepts that, she's fully committed to reliability; if she rejects it, she requires at least indirect causal contact.
answer: |-
  Based on Dr. Voss's track record, I'll reconstruct her implicit principles, apply them to the new case, predict her verdict, and identify key tensions. Her rulings suggest a nuanced **Reliability-Plus Framework** that prioritizes causal contact *unless* reliability and functional role compensate in specific ways.

  ### Core Principles from Past Cases:
  1. **Anti-Zombie Principle**: Judgments lack justification if *no quale exists*, even with functional/behavioral accuracy (zombie, BIV cases).  
  2. **Reliability Exception**: Judgments *are* justified if a mechanism perfectly tracks a neural correlate *and* the quale is present, even with zero causal influence from the quale (tracking-module case).  
  3. **Negative Report Immunity**: Reports *denying* experience are justified if they align with the absence of relevant processing, regardless of causation (blindsight case).  
  4. **Cognitive Fidelity Requirement**: Judgments are unjustified if they conflict with the system’s verifiable capacities (overflow case).  
  5. **Causal Contact Demand**: Judgments require *some causal chain* from the target state to the report mechanism, *unless* Principle 2 applies (BIV case: artificial signals lack qualia *and* no real quale is present/causally linked).  

  ### Analysis of the New Case:
  - **Setup**: Left hemisphere reports a subtle emotional quale. Perfect correlation with the quale, but the report mechanism (left hemisphere) derives data *only* from right-hemisphere processing that is causally isolated from the quale itself.  
  - **Key Features**:  
    - Quale *exists* (unlike zombie/BIV).  
    - Correlation is *perfect* and reliable (like tracking-module).  
    - *No causal path* from quale → report mechanism (like BIV, but note BIV lacked qualia).  
    - Report is *positive* (unlike blindsight’s negative report).  

  ### Where Principles Diverge:
  - **For Justified**: The case satisfies **Principle 2 (Reliability Exception)** – perfect correlation and presence of quale mirror the tracking-module case.  
  - **Against Justified**: Violates **Principle 5 (Causal Contact Demand)** – the report mechanism has no causal link to the quale, akin to the BIV’s judgment being "false" due to missing causal contact (even though BIV lacked qualia). Also, this is a *positive* report, so **Principle 3 (Negative Report Immunity)** doesn’t apply.  

  ### Prediction: **Unjustified**  
  **Reasons**:  
  - The **closest analog is the BIV case**, not the tracking-module. In BIV, she rejected the judgment because the mechanism wasn’t causally sensitive to *actual qualia* (only artificial signals). Here, the report mechanism isn’t causally sensitive to the quale either – it’s "parasitically" reliable via right-hemisphere correlates. She’d argue the judgment isn’t *about* the quale; it’s about a neural proxy.  
  - Her **Anti-Zombie Principle** implies qualia must be *present and minimally integrated*. In the tracking-module case, the mechanism directly monitored the neural correlate *of the quale*. Here, the left hemisphere accesses *processed data* (from the right hemisphere) that’s causally divorced from the quale. This "double isolation" (quale → no report mechanism contact, and report mechanism → no quale sensitivity) likely fails her threshold.  
  - **Cognitive Fidelity** isn’t violated (unlike overflow), but **Causal Contact Demand** is the deciding factor. She tolerates reliability *only* when the mechanism is directly locked onto the quale’s correlate (tracking-module) or when reporting absence (blindsight). Positive reports without a causal path to the quale itself exceed her leniency.  

  ### Settling Case:  
  To resolve ambiguity, test this: **A case with perfect correlation and reliable reporting, but the quale is causally isolated *from both the neural correlate and the report mechanism*** (e.g., a "parallel epiphenomenon" that correlates with neural state N via cosmic coincidence, not lawlike connection).  
  - If Dr. Voss rejects *this*, she’s committed to **Naturalistic Causal Contact**: Reliability requires a lawlike/evolutionary tie between the quale’s neural basis and the report mechanism.  
  - If she accepts it, she’s a **Pure Reliabilist** about phenomenal judgment.  

  ### Underdetermination Note:  
  Her precedents *slightly* underdetermine the split-brain case because:  
  - The tracking-module case had direct monitoring of the quale’s neural correlate, while here the report relies on *further processed* data. She might view this as akin to the BIV’s "indirect" signals.  
  - **The principle she’d lock in**: **"Mechanism-Specific Causation"** – For positive phenomenal judgments, the report mechanism must either (a) have causal contact with the quale’s neural basis *directly*, or (b) be part of a system where the quale’s presence is non-accidentally ensured by functional architecture (which fails here due to hemispheric segregation).  

  **Final Word**: Dr. Voss’s stance is **causally conservative**. She’ll likely call the split-brain judgment *unjustified* because the report mechanism’s reliability derives from a pathway that’s causally alienated from the quale itself – making it "lucky" in a way that violates epistemic grounding.
