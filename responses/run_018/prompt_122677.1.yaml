prompt: |-
  I maintain the recomputation core of a collaborative design tool. It is a dependency graph of a few million derived cells: user actions and incoming edits invalidate the nodes downstream of them and we recompute incrementally, over persistent data structures with structural sharing, never mutating a cell in place. Third-party plugins hook in by declaring which cell ranges they read and which they write, but those declarations are not enforced and in practice are often wrong, which is most of my on-call load. The vocabulary I actually reason in is that one: graphs, invalidation, recomputation, copy-on-write, cache coherence, and interfaces saying what a component may read versus what it may write.

  I keep being told that the frame problem is my problem, or is a generalization of it, and I would like that claim cashed out rather than gestured at. Translate it into the vocabulary above, in two stages. First the narrow original version, about how a formal theory of action specifies what an action does not change. Then the broader version philosophers seem to mean, on which the difficulty is working out which of a system's many stored beliefs a new event is relevant to at all. For each stage, name the thing in my world it corresponds to, and say where the engineering answer I already have is a real solution rather than a redescription of the problem.

  Then the residue report, which is what I actually want:

  1. What translates cleanly, term for term.
  2. What translates only with distortion, and in particular where my vocabulary smuggles in an assumption the philosopher is not entitled to. My guess is that the crux is that I get to write the dependency graph down because my team authored the system, and I get to treat undeclared effects as bugs to be fixed, whereas an agent embedded in an open world authored nothing and cannot appeal to a bug. Tell me whether that is the real crux and whether it is a difference in kind or only in degree.
  3. What cannot be expressed in my vocabulary at all, even approximately.

  On the strength of item 3, judge whether the residue is a blind spot in how I think about software systems, or evidence that the philosophical claim was never as well defined as it sounds. End with a single line: \answer{dissolved | relocated | untranslatable}, picking whichever label fits your overall verdict.
reasoning: |-
  We are given a description of a recomputation core for a collaborative design tool, which operates as a dependency graph of derived cells. The system handles invalidation and recomputation incrementally, using persistent data structures with structural sharing (copy-on-write). Third-party plugins declare which cell ranges they read and which they write, but these declarations are often wrong, leading to problems.

  The user wants to understand how the "frame problem" (in both its narrow and broad versions) maps to their system. They also want a residue report that breaks down:

  1. What translates cleanly.
  2. What translates with distortion (and whether the crux is about authored vs. open world).
  3. What cannot be expressed in their vocabulary.

  Finally, they want a verdict: whether the residue is a blind spot or evidence of philosophical vagueness, and a single-line answer (dissolved, relocated, or untranslatable).

  ## The Frame Problem

  ### Narrow Frame Problem
  The narrow frame problem, as originally formulated by McCarthy and Hayes (1969), is about how to formally specify the effects of an action without having to explicitly state everything that _doesn't_ change. In a logical representation of the world, when an action occurs, we want to update the state by asserting what has changed and assume that everything else remains the same (the frame axiom). However, the number of frame axioms required can be very large because for each action, we must state that it doesn't affect every other fluent (a property that can change over time). This leads to the "frame problem" of having to represent and manage a huge number of such axioms.

  **Translation to your system**:
  - **Action**: A user action or incoming edit that invalidates some nodes.
  - **What an action does change**: The nodes that are directly invalidated and then recomputed downstream.
  - **What an action does not change**: The nodes that are not in the downstream of the invalidated nodes. In an ideal world, your dependency graph explicitly captures the propagation of invalidation: when a node is invalidated, only the nodes that depend on it (directly or indirectly) are recomputed. The rest of the graph remains unchanged.

  **Engineering solution in your system**:
  - Your dependency graph inherently defines the propagation of change. When a node is invalidated, the recomputation process only touches the nodes that are downstream. The rest of the graph is left untouched (thanks to persistent data structures and structural sharing). This is efficient because you don't have to traverse the entire graph to find what doesn't change; the graph structure naturally limits the scope of recomputation.

  **Is this a real solution?**
  - Yes, because the dependency graph is a concrete, precomputed representation of the dependencies. The invalidation process is a direct application of the graph structure. You don't have to state for every cell and every possible change that the cell doesn't change; the graph traversal automatically respects that. The graph structure replaces the need for explicit frame axioms.

  ### Broad Frame Problem
  The broad frame problem, as discussed in philosophy and AI, is about the difficulty of determining which of the system's stored beliefs (or facts) are relevant to a new event and which are not. It's about the practical impossibility of anticipating all the consequences of an action or all the factors that might be relevant to a situation, especially in an open world.

  **Translation to your system**:
  - **Stored beliefs**: The current state of the derived cells (the entire graph).
  - **New event**: A user action or incoming edit that invalidates some nodes.
  - **Relevance**: Which cells are affected (invalidated and needing recomputation) by the event? The dependency graph is supposed to capture this: if a cell depends (directly or indirectly) on a changed cell, then it is relevant and must be recomputed.

  **Engineering solution in your system**:
  - The dependency graph is your explicit representation of relevance. When an event occurs, you traverse the graph to find all downstream nodes (which are the relevant ones). The rest are irrelevant and untouched.

  **But there's a catch**:
  - The dependency graph is built from the declarations of the plugins (which cells they read and write). However, these declarations are often wrong. That means the graph does not accurately reflect the actual dependencies. Therefore, when an event occurs, the invalidation might not propagate to all cells that are actually affected (if a dependency is undeclared) or might propagate to cells that are not actually affected (if there's an over-declaration). This leads to cache incoherence and is the source of your on-call load.

  **Is this a real solution?**
  - In an ideal world where the dependency graph is perfectly accurate, the graph traversal would be a complete and sound solution to the broad frame problem for your system. However, because of incorrect declarations by third-party plugins, the graph is imperfect. Therefore, the engineering solution (the dependency graph) is a solution to the broad frame problem only to the extent that the graph is correct. The problem of incorrect declarations is an additional challenge that makes the solution incomplete.

  ## Residue Report

  ### 1. What translates cleanly
  - **Narrow frame problem**: The concept of what an action does not change maps cleanly to the nodes that are not in the downstream of the invalidated nodes. The dependency graph structure and the recomputation algorithm provide an efficient solution by avoiding explicit frame axioms. The structural sharing ensures that unchanged parts are not copied, which is analogous to the frame axiom in logic (unchanged parts are not touched).
  - **Broad frame problem**: The idea of relevance (which stored beliefs are affected by an event) is captured by the dependency graph. The graph traversal during invalidation is a direct mechanism for determining relevance.

  ### 2. What translates with distortion
  The key distortion is in the **assumption of a correctly authored dependency graph**. 

  - In your system, the dependency graph is built from plugin declarations. You treat incorrect declarations as bugs that must be fixed. This is feasible because your system is a closed, engineered system: you have control over the plugins (at least in principle, by requiring fixes) and the graph structure is fully known (though it might be wrong in practice). 

  - In contrast, the broad frame problem in philosophy (and in AI for agents in the open world) assumes an agent that does not have a precomputed dependency graph. The agent must reason about relevance in a world that is not pre-structured by an engineer. The agent must discover dependencies on the fly, and there is no authoritative source to fix "bugs" in the dependency graph. Moreover, the open world is such that new entities and relationships can emerge, making any static dependency graph inadequate.

  **The crux**: 
  - You are right that the crux is about an authored system versus an open world. In your system, the dependency graph is a designed artifact, and you can enforce corrections. In the open world, there is no such artifact, and the agent must constantly update its model of relevance without a fixed structure.

  **Difference in kind or degree?**
  - This is a difference in kind because the open world requires a different kind of reasoning: one that is not based on a fixed, precomputed graph. The agent must deal with uncertainty, incomplete information, and the possibility of novel situations that were not anticipated in the design of the system. Your system, by contrast, operates in a closed world where the set of cells and the possible dependencies are bounded and (in principle) fixable.

  ### 3. What cannot be expressed in your vocabulary at all
  - **Emergent dependencies and open-endedness**: In an open world, new types of dependencies can arise that were not anticipated by the system designer. Your dependency graph is static in the sense that it is built from plugin declarations that are written at development time. There is no mechanism in your system to dynamically discover new dependencies that were not declared (or even conceived of) initially.

  - **Uncertainty and probabilistic relevance**: Your system is deterministic: a node is either in the dependency graph or it isn't. In the open world, an agent might have to reason about the possibility of a dependency with some probability (e.g., "this event might be relevant to that belief with 70% chance"). Your system does not handle such uncertainty.

  - **Causality beyond the graph**: The dependency graph in your system is a computational dependency (if A changes, then B must be recomputed). But in the open world, causality might be more complex and not reducible to a directed acyclic graph. For instance, circular dependencies (which are not allowed in your system) or dependencies that change over time based on context.

  - **The meta-problem of maintaining the dependency graph**: In your system, the graph is maintained by the engineers and plugin authors. In the open world, the agent must itself learn and update its own dependency graph (or equivalent) without outside help. This meta-problem (how to learn what is relevant) is not expressible in your vocabulary because your system doesn't have to do it; it's delegated to humans.

  **Judgment on the residue**:
  - The residue (the open-endedness, uncertainty, and the need for autonomous learning of dependencies) points to a **blind spot** in how you think about software systems. Your system is designed for a controlled environment with human oversight. The philosophical frame problem highlights challenges that arise when such oversight is absent and the environment is open. However, it is also evidence that the philosophical claim is not as well-defined as it sounds because the open world frame problem is often stated in very general terms and might not admit a single, well-defined solution.

  **Verdict**:
  - The frame problem in its broad form (open world) cannot be fully captured by your system because of the static, precomputed nature of your dependency graph and the closed-world assumption. Therefore, the residue is **untranslatable** in the sense that the open-world challenges have no counterpart in your system.

  ## Final Single Line
