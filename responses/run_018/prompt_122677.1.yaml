answer: |-
  ### Translation of the Frame Problem into Your Vocabulary

  #### Stage 1: Narrow Frame Problem (What an Action Does Not Change)
  - **Core issue**: In formal logic, specifying an action (e.g., "move a block") requires explicitly stating everything it *doesn't* affect (e.g., "the block's color remains unchanged") to avoid incorrect inferences. This leads to combinatorial explosion of "frame axioms" (e.g., "moving block A doesn't change block B's position, block C's position, ...").  
  - **Your analogue**:  
    - *Action* = User edit or plugin mutation invalidating a cell.  
    - *What changes* = Downstream cells marked invalid (explicitly recomputed).  
    - *What does not change* = Cells outside the invalidation path (implicitly preserved).  
  - **Your engineering solution**:  
    The dependency graph **automates frame axioms**. Invalidation propagates *only* along declared edges (e.g., if cell A depends on B, invalidating B invalidates A). Structural sharing ensures non-invalidated cells are physically untouched.  
  - **Why it's a real solution**:  
    Your graph replaces thousands of explicit "does not change" declarations with a **topological traversal**. This is feasible because dependencies are finite, precomputed, and discrete. The solution isn't circular—it leverages the graph's structure to *derive* non-effects efficiently.  

  #### Stage 2: Broad Frame Problem (Relevance of Beliefs to an Event)  
  - **Core issue**: Determining which beliefs (e.g., "the sky is blue") are even *relevant* to a new event (e.g., "a bird flies by") in an open-ended world. Philosophers emphasize the impossibility of predefining all possible relevancies.  
  - **Your analogue**:  
    - *Beliefs* = Derived cells (cached computations).  
    - *Event* = User action or plugin write.  
    - *Relevance* = Which cells are semantically dependent on the event (must be invalidated).  
  - **Your engineering solution**:  
    Plugin declarations **define relevance boundaries**. Reads/writes specify which cells *could* be affected. The graph then propagates invalidation to downstream dependents.  
  - **Why it's a partial solution**:  
    It works *if* declarations are correct. But when plugins misdeclare reads/writes (your "on-call load"), the graph becomes an **inaccurate relevance model**. You fix this reactively (bug reports → patches), making it a solution *only in a closed system*.  

  ---

  ### Residue Report  

  #### 1. What Translates Cleanly  
  - **Invalidation propagation** ≈ **Frame axioms**: Your graph traversal directly solves the narrow problem by automating "what doesn't change."  
  - **Declared reads/writes** ≈ **Relevance heuristics**: Plugin interfaces are explicit (if buggy) proxies for "beliefs relevant to an action."  
  - **Structural sharing** ≈ **Efficient non-change**: Copy-on-write physically enforces frame axioms without runtime checks.  

  #### 2. What Translates with Distortion  
  - **Crux**: Your system **assumes the graph is authoritatively definable**. You treat undeclared effects as "bugs" because:  
    - The cell universe is finite and engineered.  
    - Humans *can* (in theory) audit/fix declarations.  
  - **Philosophical challenge**: In an open world:  
    - There is no "bug fix" mechanism—the agent must *discover* relevancies autonomously.  
    - Dependencies can be emergent, infinite, or non-computable (e.g., "is cell X relevant to a solar flare?").  
  - **Distortion**: You reduce relevance to **syntactic dependencies** (graph edges), but philosophers see relevance as **semantic and contextual** (e.g., a cell indirectly affected by an unmodeled real-world event).  
  - **Kind vs. Degree**: This is a **difference in kind**. Your closed world assumes:  
    - All dependencies are predeclarable.  
    - Errors are externally correctable.  
    An open-world agent has neither luxury—it faces **unknown unknowns**.  

  #### 3. What Cannot Be Expressed  
  - **Unanticipated relevance**: Your graph cannot model dependencies outside declared edges (e.g., a plugin that *should* read cell Y but doesn’t declare it). You handle this reactively; an open-world agent must *infer* it.  
  - **Unbounded events**: Events like "a user has a new goal" or "the system’s hardware overheats" have no cell representation. Your graph assumes all changes originate from defined actions.  
  - **Probabilistic relevance**: Philosophers often frame relevance as fuzzy ("likely irrelevant"); your binary graph edges are either true or buggy.  

  #### Judgment on the Residue  
  The residue reveals a **blind spot in software-centric thinking**: you assume the world is reducible to declarative dependencies. The untranslatable elements (open-ended relevance, lack of authority over the graph) show the frame problem’s broader form is **not just about efficiency** (which you’ve solved narrowly) but **epistemic uncertainty**. However, this doesn’t indict your approach—it highlights that philosophical claims often conflate *practical* coherence (your domain) with *metaphysical* coherence (unknowable open worlds). Your solution is optimal for a controlled system; the residue is untranslatable because philosophy’s "open world" is intentionally underspecified.  

  \answer{untranslatable}
