answer: |-
  ### Exam Question: Quantum Decay and Deferential Tension  
  **Scenario:**  
  Dr. Finch knows that a quantum decay process \(Q\) has an objective chance of 2/3 of yielding outcome \(A\) in any trial, as per the best-confirmed physical theory. Independently, she reviews data from Experiment Series S—a *completed* set of 10,000 trials of \(Q\) under identical conditions, audited for accuracy. In S, \(A\) occurred only 40% of the time. No errors in measurement or theory are suspected.  

  **Prompt:**  
  Determine Dr. Finch’s rational credence in \(A\) occurring in the next trial of \(Q\). Does the Principal Principle (PP) *require* her to hold credence 2/3 (rejecting S as misleading), *permit* downward conditionalization toward 0.4, or support a *principled intermediate position*? Justify your answer by:  
  1. Clarifying whether evidence from S is "admissible" under PP;  
  2. Explaining why S’s 40% frequency does not "undermine" the 2/3 chance law;  
  3. Applying PP to *conditional* chance given S (not unconditional chance);  
  4. Assessing whether indexical information (e.g., "I am observing *this* trial") affects deference.  

  ---

  ### Model Answer (798 words)  
  Dr. Finch’s rational credence in \(A\) remains **exactly 2/3**, despite the 40% frequency in S. The Principal Principle (PP) locks her credence at the objective chance because S constitutes *admissible evidence* that does not justify revising her trust in the chance law. I defend this by addressing four key issues.  

  **(i) Admissibility of S’s Data**  
  PP states: \( Cr(A | E \land \text{ch}(A) = x) = x \), provided \(E\) is *admissible*—i.e., it contains no "inadmissible information about how the chance process turns out" (Lewis 1980). S’s data is admissible because it records *past* outcomes of \(Q\), not future ones. Lewis explicitly classifies historical information as admissible. S reveals nothing about the *next* trial’s outcome; it only describes completed events. Crucially, admissibility does *not* require evidence to "support" the chance hypothesis. Thus, S’s discrepancy is admissible but statistically surprising—not grounds for ignoring PP.  

  **(ii) Why S Does Not Undermine the Chance Law**  
  The "undermining" objection imagines futures where frequencies deviate so severely that they falsify the chance law itself. But S is *past* data from a *finite* sequence. A 40% frequency over 10,000 trials, while improbable (chance ≈ \(10^{-87}\)), is consistent with a 2/3 law. The law of large numbers guarantees convergence *in the limit*, not in finite samples. Rejecting the 2/3 chance based on S alone would commit the *gambler’s fallacy*: mistaking a *past* deviation for a predictive bias. Undermining concerns *future* evidence that *would* contradict the law; S is merely a rare outcome under the law.  

  **(iii) PP Applies to Conditional Chance**  
  Some argue PP permits conditionalizing S’s frequency into credence, suggesting \( Cr(A | S) \approx 0.4 \). This misapplies PP. The correct move is to defer to the *current best theory’s conditional chance*:  
  \[ Cr(A | S \land \text{ch}(A) = 2/3) = \text{ch}(A | S). \]  
  But does \(\text{ch}(A | S)\) equal 2/3 or 0.4? Crucially, \(\text{ch}\) is defined by the physical law, which fixes single-case chances independently of past frequencies. The law specifies that each trial is independent and identically distributed (i.i.d.) with \(\text{ch}(A) = 2/3\). Thus, \(\text{ch}(A | S) = \text{ch}(A) = 2/3\)—S is epistemically relevant but *causally inert* for future chances. PP does not average chance and frequency; it defers to chance *given all admissible evidence*. Here, that chance remains 2/3.  

  **(iv) Indexical Information is Irrelevant**  
  Suppose Dr. Finch thinks, "I might be in a universe where S’s low frequency reveals a bias." This invokes indexical uncertainty—but PP addresses objective chance, not anthropic reasoning. The chance law is known to hold; S is a local anomaly, not evidence of multiversal selection. If she conditionalizes on "I observe a trial in S’s reference class," she still knows S’s reference class is governed by \(\text{ch}(A) = 2/3\). Indexical facts don’t alter physical laws; they only help *identify* which laws apply. Here, the law is fixed, so indexical information is either redundant or inadmissible (if used to infer hidden variables).  

  **Conclusion**: PP mandates credence 2/3. S’s data is admissible but does not alter the conditional chance. Rational deference requires trusting the chance law over finite frequencies, however startling. Dr. Finch should view S as a fluke, not a refutation.  

  ---

  ### Marking Scheme (Total: 20 points)  
  #### **1. Admissibility of Evidence** (5 pts)  
  - **A (5)**: Explicitly notes S is *historical* hence admissible per Lewis; distinguishes admissibility from "supportiveness."  
  - **B (3)**: Calls S admissible but conflates with "non-undermining" or omits Lewis’s historical criterion.  
  - **Fail (0–1)**: Labels S inadmissible; confuses with undermining.  

  #### **2. Non-Undermining of Chance Law** (5 pts)  
  - **A (5)**: Cites finite vs. infinite trials; uses law of large numbers; distinguishes past deviation from future undermining.  
  - **B (3)**: States S doesn’t refute chance but appeals vaguely to "randomness" without probabilistic limits.  
  - **Fail (0–1)**: Claims S falsifies the chance law; invokes "problem of induction."  

  #### **3. Conditional Chance Application** (5 pts)  
  - **A (5)**: Computes \(\text{ch}(A | S) = \text{ch}(A) = 2/3\) via i.i.d.; rejects averaging chance/frequency.  
  - **B (3)**: Mentions conditional chance but wavers toward 0.4 ("partial deference"); misstates PP’s conditions.  
  - **Fail (0–1)**: Asserts \(Cr(A) = \frac{2/3 + 0.4}{2}\); ignores chance conditionalization.  

  #### **4. Indexical Information** (5 pts)  
  - **A (5)**: Denies relevance: chance is physical, indexicals are epistemic; no anthropic loophole.  
  - **B (3)**: Notes indexicals might matter but doesn’t explain why not here.  
  - **Fail (0–1)**: Claims self-locating uncertainty forces credence shift.  

  ---

  **Key Distinctions**:  
  - **A Answers** execute all four moves *precisely*, using Lewis’s framework to resolve the tension.  
  - **B Answers** summarize PP/undermining but fail to disentangle admissibility, conditionalization, or indexicals.  
  - **Common Failure**: Conflating the *improbability* of S with *inadmissibility* or treating frequency as a "new chance."
