prompt: |-
  I'm enrolled in an upper-level seminar on rationality, probability, and objective chance. We're writing our final exam—one 90-minute essay, roughly 800 words—on deference to objective chance via Lewis's Principal Principle. I want a question that can't be answered by reciting the standard formulation and the familiar undermining objection. Please design an exam scenario in which a subject knows that a genuinely chancy quantum decay process assigns objective chance 2/3 to outcome A, but she also holds admissible-looking statistical evidence from an independently verified long run of the same process in which A occurred in only 40% of trials. The essay prompt should ask students to determine the rational credence in A and specifically to adjudicate whether the Principal Principle locks her at 2/3, licenses conditionalization downward, or permits a principled intermediate position that distinguishes undermining future evidence from ordinary frequency data. Along with the question, please provide: a model answer of about 800 words that makes four specific conceptual moves—(i) separating admissible from inadmissible evidence in this context; (ii) explaining why a long-run statistical discrepancy does not automatically undermine the chancy law; (iii) applying the Principal Principle correctly to conditional rather than unconditional chances; and (iv) addressing whether indexical or self-locating information could alter the deference relation; and a marking scheme totaling 20 points with 5 points for each of those four moves, plus one-line notes on how students typically fail each move and what distinguishes an A answer (which executes the distinctions precisely) from a B answer (which summarizes Lewis without resolving the tension).
