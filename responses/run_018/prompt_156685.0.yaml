  ## On Certain Curved Surfaces at San Marco

  Observe the vaulted ceiling, how the stone
  Ascends in arches meeting, curve on curve,
  To bear aloft the weight of that great dome.
  The architect designed each sweeping nerve
  To lift the eye toward heaven's painted blue
  (Or what the glass portrays as endless sky).
  But look: between the arches, spaces grew—
  Triangular, where curving lines comply
  With structural necessity. These gaps
  Demanded no design, no grand intent;
  They simply *were*, where marble shoulders lapse
  To join the dome's ascent. Yet ornament
  Soon claimed them. Artists saw each hollowed span
  As perfect for a saint or seraphim—
  So filled the void according to man's plan,
  Transforming happenstance to purpose, grim
  Or glorious. The spandrel's shape, you see,
  Was never *meant* for art; the art arrived
  Because the space existed, **as it were,**
  **A consequence of how the bones survived**
  The load they carried. Thus the builder's mind
  Intended arches, strength to hold the mass;
  The mosaics bloomed where angles were confined.

  Now shift the lens: consider bone, or grass,
  Or human minds. Does every trait exist
  As crafted answer to some pressing need?
  Or might some flourish, simply in the midst
  Of structures built for different work, to feed
  Or flee or fight? The chin, perhaps, arose
  Not for defiance, speech, or guiding blows,
  But as a byproduct where jawbones close
  Against the skull's own curve. The blood that flows
  Its crimson path obeys the pump's command,
  But oxygen's bright blush? A side-effect,
  A consequence of binding, close at hand,
  No crafted choice, no plan we can detect.
  The mind that yearns for patterns, finds design
  In every leaf and wing? Perhaps the trait
  Of seeing purpose is a tangled vine
  That grew where reason sought to navigate
  A world demanding cause. We cannot know
  For certain if the saint within the stone
  Was planned, or if the art had room to grow
  Where structure left a vacancy alone.
  The space *is* there. The meaning we bestow.

  ---
  1.  **Structural Mirroring:** The poem opens with architectural necessity (arches meeting), identifies the *resulting* spandrels as unplanned voids, then shows how art filled them. This mirrors the biological argument: core adaptations (arches) create structural byproducts (spandrels) which are later co-opted or perceived as functional.
  2.  **Hidden Keystones (Filler Lines):**
      *   **"as it were,"** (Line 17): A common transitional filler phrase. Its literal meaning ("in a manner of speaking") accidentally captures the essence of the spandrel: it *is* a consequence, speaking for itself only by existing, not by design.
      *   **"A consequence of how the bones survived"** (Line 18): While grammatically necessary to complete the analogy (arches = bones), the phrase "a consequence" directly and literally states the core concept: the spandrel/trait is a *consequence* of structural necessity ("how the bones survived" the load), not an adaptation itself.
  3.  **Accuracy & Ambiguity:** The poem clearly distinguishes the *intended* structure (arches/adaptive core functions) from the *resulting* space (spandrels/byproducts). Biological examples (chin, blood color, the "purpose-seeing" mind) are presented as *potential* spandrels ("Perhaps," "We cannot know"). The final stanza reinforces the uncertainty: "We cannot know / For certain if the saint within the stone / Was planned..." leaving the tension between adaptation and byproduct unresolved.
  4.  **Form:** Strict unrhymed iambic pentameter (blank verse), 34 lines. American English vocabulary and phrasing.
