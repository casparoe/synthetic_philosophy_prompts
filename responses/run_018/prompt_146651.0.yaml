prompt: |-
  hey so i'm a phd student in political philosophy and i'm helping set up the interview questions for our dept podcast next week. the guest is dr. elena vasquez — she wrote this recent monograph where she argues the dirty hands problem is totally misframed if we treat it like a one-time moral stain. she has this idea called deliberative residue, which is that when a legislator makes a dirty compromise, it doesn't just leave them with dirty hands, it actually rewires thier reasoning so they're primed to rationalize the next bad deal.

  i need like 8-10 questions that go past her just explaining the concept, and for each one i want you to build in a follow-up that hits the answer she's most likely to give. specifically i want one that pushes her on whether this residue operates at the psychological level or is more of an institutional feedback loop, another on how she distinguishes it from ordinary adaptive preference formation (like elster-style sour grapes), and one that anticipates the reply that she's just redescribing old-school moral corruption in jargon — with a sharp follow-up that makes that deflection harder. audience is mostly grad students and some faculty in pol theory, so keep it in the weeds but dont ask for reading lists or anything. also maybe include a question about whether democratic accountability mechanisms can actually wash away the residue or if they're part of the problem. i keep going back and forth on whether her view makes representatives into something like collectively weak-willed actors, so a question on that'd be good too.
