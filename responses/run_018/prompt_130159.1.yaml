  Hmm, this is a rich philosophical puzzle about generational categories in institutional practice. The user wants me to reconstruct implicit philosophical commitments in how institutions use "Baby Boomers" etc. despite knowing their methodological flaws. 

  First, I need to map the key conceptual distinctions. The ontology question requires unpacking natural kinds (like biological species) versus institutional kinds (like money) versus statistical artifacts. The practice treats generations as having stable traits, which suggests more than mere statistical grouping. But since members completely turnover, we must consider diachronic identity - how a group persists without any original members. 

  The predictive-to-intervention move is fascinating. When policies target "Gen Z mental health," it implies the cohort itself has properties that causally affect individuals (downward causation). But this is tricky because the critiques show variance within cohorts exceeds differences between them. The institutional tension between using and critiquing the categories points to deeper philosophical splits - perhaps instrumentalism in data collection but realism in policy application.

  For the ontology question, the practice seems to require generations as institutional kinds with assigned functions (budgeting units, policy targets) but doesn't strictly need them to be natural kinds. However, treating them as predictive of dispositions leans toward quasi-naturalism. The diachronic identity is presupposed - Millennials are treated as the same entity from 2000 to 2050 despite total membership change.

  On collective agency, there's no strong commitment to moral responsibility, but the policy targeting does imply causal efficacy at group level. This suggests soft downward causation where group properties (like "Gen Z digital nativity") are seen as shaping individuals, even if reductively explainable. 

  The institutional tension reveals pragmatic double-think: methodologists see categories as instrumental while policymakers reify them. But a coherent "pragmatic constructivism" could bridge this - the categories gain reality through institutional use despite arbitrary origins. 

  If replaced with life-stage variables, the apparatus wouldn't collapse but would lose generational narratives. However, since period effects are conflated with cohorts, the shift might better capture reality. The practice clings to generations partly because they offer diachronic units for longitudinal policy, which life-stages can't provide as cleanly.

  Throughout, I'll distinguish strict presuppositions from compatible theories. For example, downward causation isn't strictly required but fits the intervention logic. The practice is underdetermined regarding whether cohorts are "real" groups or just epistemic tools - both views can license the usage.
answer: |-
  The institutional practice of using generational cohorts as units of analysis and intervention reveals the following implicit philosophical commitments, reconstructed from its conceptual structure:

  **1. Ontology of Social Groups**  
  The practice strictly presupposes generations as **institutional kinds with diachronic identity**, not natural kinds or mere statistical artifacts. Key commitments:  
  - *Diachronic persistence*: Generations must maintain identity despite complete individual turnover (e.g., "Millennials" as a policy target persists while all original members age/die).  
  - *Functional status*: Cohorts are treated as *institutional kinds*—social constructs assigned concrete roles in resource allocation (e.g., "Boomers" as retirement-funding recipients), requiring them to bear institutional obligations independent of individual characteristics.  
  - *Minimal essentialism*: While not presupposing biological natural kinds, the practice requires cohorts to have *stably correlated properties* (e.g., "Gen Z prefers digital communication") that justify treating them as meaningful categories, despite internal critiques showing these correlations are weak.  
  *Philosophical underdetermination*: The practice is compatible with both conventionalist views (cohorts as useful fictions) and weak realist views (cohorts as emergent social entities), but *excludes* strict nominalism (where only individuals exist).

  **2. Predictive Use & Collective Causation**  
  The practice implies **instrumental aggregation with implicit downward causation**, not collective moral agency:  
  - *Predictive individualism*: Treating cohort membership as predictive of individual traits (e.g., "Millennials delay homeownership") presupposes only statistical generalization—not that cohorts possess irreducible group minds.  
  - *Interventional holism*: Targeting policies at cohorts (e.g., mental health funds for "Gen Z") commits to *weak downward causation*: the idea that group-level properties (e.g., "Gen Z's digital saturation") causally constrain individual behaviors in ways not reducible to life-stage or period effects alone. This is necessary to justify cohort-specific interventions when individual-level variables would suffice.  
  - *No collective responsibility*: The practice avoids attributing moral agency to cohorts (e.g., no claims that "Boomers are responsible for climate inaction" in official policy), relying instead on *causal efficacy* for practical targeting.

  **3. Institutional Tension: Inconsistency or Coherent Pragmatism?**  
  The tension between operational use and internal critique reflects **pragmatic constructivism**, not fundamental inconsistency:  
  - *Epistemic instrumentalism*: Methodological critiques treat cohorts as statistical heuristics (prioritizing life-stage/period effects), accepting their arbitrariness for modeling convenience.  
  - *Ontological commitment*: Policy applications treat cohorts as *institutionally real*—categories that, once constructed, acquire causal power through institutional reinforcement (e.g., labeling creates self-fulfilling prophecies via targeted marketing).  
  - *Resolution via social ontology*: The practice is coherent under a view where generational categories are *institutional facts* (Searle-esque "X counts as Y in context C") that gain reality through collective acceptance. Their functional utility in policy systems outweighs methodological imperfections, making them "real in their consequences" (Thomas Theorem).

  **4. Consequences of Ontological Replacement**  
  Replacing cohort ontology with explicit statistical artifact status would necessitate:  
  - *Policy reorientation*: Shifting interventions to life-stage (e.g., "first-time homebuyers" not "Millennials") or socioeconomic variables, losing longitudinal tracking of groups across decades.  
  - *Narrative collapse*: Inability to sustain generational metanarratives ("OK Boomer" discourse) that rely on diachronic group identity, potentially weakening public/political engagement.  
  - *Functional preservation*: Core policy functions could migrate to other categories (e.g., region or income strata), but longitudinal analysis would require new constructs for period effects, sacrificing generational continuity. No *philosophical* loss would occur—only pragmatic disruption to institutional storytelling and cross-temporal comparison.

  ---

  **Synthesis**: The practice presupposes generations as *diachronically persistent institutional kinds* with *weak emergent causal powers*, sustained by *pragmatic constructivism* where functional utility trumps empirical precision. It is philosophically underdetermined between conventionalism and weak realism but requires enough reification to justify treating cohorts as units of intervention across time. The tension between critique and use reflects not inconsistency but institutional compartmentalization: methodologies adopt *instrumentalism* while policymakers enact *contextual realism*. Replacing the ontology would disrupt narrative cohesion but not policy functionality.
