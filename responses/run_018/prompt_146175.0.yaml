answer: |-
  Here are 10 interview questions probing the depths of "inertial framing," designed to push beyond restatement and target core conceptual tensions, with explicit reasoning vulnerabilities noted:

  1.  **Ontological Grounding:** You position stability dispositions as *primitive* ontological features, not derived from logic or computation. Could you elaborate on what constitutes evidence *for* such a primitive disposition existing "in the world" itself, rather than being a useful cognitive heuristic *we* impose? *(Vulnerability: This risks conflating metaphysical commitment with explanatory necessity. The "evidence" might inherently circle back to cognitive phenomena.)*
  2.  **The Computational Burden/Objection:** A standard criticism is that "inertial framing" doesn't solve the frame problem; it merely relocates the computational burden of tracking persistence into an obscure metaphysics of primitive dispositions. How do you respond to the charge that you've simply shifted the mystery? *(Vulnerability: This phrasing assumes the burden *must* be computational somewhere, which her ontology might explicitly deny.)*
  3.  **Robotic Failure Mode (Follow-up to #2):** You often counter that implementation is an engineering, not philosophical, concern. To test that distinction: Imagine a robot using a state-of-the-art logical planner consistently fails in scenarios involving property persistence – say, assuming coffee stays hot indefinitely unless explicitly cooled, leading to repeated errors. What specific, observable failure mode in this robot's *behavior* or *internal state evolution* would convince you it genuinely *lacks* your proposed stability dispositions at an ontological level, rather than just using an inadequate logical formalism to model them? *(Vulnerability: This hinges on a clear behavioral signature uniquely tied to ontological lack vs. representational failure, which might be impossible to isolate. Her response might dissolve the distinction operationally.)*
  4.  **Naive Physics & Developmental Psychology:** Work in developmental psychology shows infants possess "naive physics" expectations about object persistence and continuity. Doesn't this literature directly support the view that inertia is a *cognitive* bias or representational schema we develop, rather than evidence for an ontological primitive "out there"? *(Vulnerability: This assumes "naive physics" findings are *only* about representations, potentially ignoring embodied/enactive interpretations.)*
  5.  **Causal Powers vs. Mental Schemas (Follow-up to #4):** If you distinguish inertial framing from naive physics by appealing to *causal powers inherent in properties* rather than mental representations, how do we empirically differentiate between (a) an infant's brain *representing* stability and (b) the infant's cognition being *sensitive* to the world's inherent stability dispositions? Does this distinction hold water experimentally? *(Vulnerability: This might force an appeal to fundamental metaphysics beyond empirical reach, or conflate the disposition's existence with our detection mechanism.)*
  6.  **The Circularity Risk:** Doesn't defining "explicit causal interaction" as the *only* thing that suspends a stability disposition risk circularity? How do you identify a "causal interaction" independently of observing the disposition's suspension? Is "causation" here also primitive, or defined by the dispositions? *(Vulnerability: This targets a core potential weakness – the interdependence of "stability disposition" and "causal interaction" might make the theory unfalsifiable or tautological.)*
  7.  **The Ramification Problem:** In non-monotonic reasoning (like formalizing common sense), the ramification problem arises when an action's indirect consequences spiral (e.g., turning on a light alerts a prowler). How does an ontology with primitive stability dispositions handle these cascading side-effects? Does it dissolve the ramification problem, or recast it? *(Vulnerability: This probes whether ontological inertia truly simplifies reasoning or just hides complexity within the web of dispositions and their interactions.)*
  8.  **Ramifications: Representation vs. Ontology (Follow-up to #7):** You might argue ramifications are only problematic for *representational* systems trying to model all possibilities. In an ontological system, are you saying the *world itself* simply doesn't have "ramifications" as a distinct problem – that side-effects just *are* the unfolding of causal interactions suspending dispositions? If so, how does cognition reliably anticipate these unfoldings without representational models? *(Vulnerability: This anticipates her rebuttal but presses the issue of cognitive *prediction* and planning within her ontology, which seems to require *some* form of modeling, potentially reintroducing the problem.)*
  9.  **Scope of Dispositions:** Are stability dispositions universal? Do *all* properties possess them equally (e.g., "being red" vs. "being fragile")? Or are there properties whose persistence is inherently fleeting or context-dependent? How does your framework handle properties like "being in demand" or "being fashionable," where persistence feels less like a default and more like a dynamic equilibrium? *(Vulnerability: This tests the limits of the theory's applicability and might expose cases where "inertia" is a poor metaphor, forcing ad-hoc distinctions.)*
  10. **Falsifiability & Empirical Risk:** What specific empirical finding – from a robot failing a novel persistence task, an animal cognition experiment showing non-inertial updating, or neuroscience revealing persistence-tracking mechanisms that look like classical updating – would genuinely *undermine* inertial framing as you conceive it, rather than being something your framework could accommodate by adjusting details? *(Vulnerability: This is the hardest. Her framework might be so flexible (e.g., attributing any failure to lack of causal interaction sensitivity) that it becomes empirically unfalsifiable in practice, making the question potentially unanswerable as she intends.)*

  **Key Reasoning Vulnerabilities Highlighted:**

  1.  **Primitive Dispositions & Evidence (Q1):** The evidence for a *primitive* disposition existing independently of cognition is inherently slippery. Any observation relies on cognitive access, risking circularity.
  2.  **Burden Shifting vs. Elimination (Q2/Q3):** The core objection assumes the computational burden *must* exist somewhere. Her rebuttal claims it's ontologically dissolved, not shifted. Q3 tries to force an operational test, but the ontological claim might be insulated from such tests by design. The failure mode might be indistinguishable from representational inadequacy.
  3.  **Circularity of Disposition & Cause (Q6):** This is a major philosophical pitfall. If a "causal interaction" is defined solely by its ability to suspend a stability disposition, and the disposition is defined by persisting *unless* causally interacted with, the definitions depend on each other. Breaking this loop requires independent grounding for "causation" or "disposition," which is notoriously difficult.
  4.  **Cognition vs. Ontology (Q5, Q8):** Distinguishing the ontological claim (stability is in the world) from the cognitive claim (we track it efficiently) is crucial but empirically fraught. How cognition *leverages* or *detects* the ontology without complex representation remains a challenge, potentially blurring the line she wants to draw.
  5.  **Falsifiability (Q10):** This is the biggest vulnerability. By making inertia ontological and primitive, and attributing failures to insensitivity or lack of causal interaction (which are flexible concepts), the theory risks becoming unfalsifiable. Any counter-evidence could be explained away as not probing the "true" ontology or the system's failure to engage with it properly. A truly falsifying result might be hard to conceive within the framework's own terms.

  These questions aim to force clarification on the metaphysics, test its empirical implications, challenge its internal coherence, and probe its limits, while explicitly acknowledging where the reasoning behind the questions themselves might stumble over the very conceptual ambiguities inherent in the position. Good luck with the interview!
