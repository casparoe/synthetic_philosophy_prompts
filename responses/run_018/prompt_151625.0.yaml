prompt: |-
  You mediate disputes in a worker-owned cooperative whose charter abolishes formal titles and hierarchical ranks. Members increasingly file grievances that they are not “recognized,” but the conflicts mix status, labor attribution, and distributive fairness. Drawing specifically on Hegel’s master-slave dialectic—distinguishing one-sided recognition, the struggle for pure prestige that risks life and death, and the achievement of mutual recognition through formative labor and the emergence of self-consciousness—construct a twenty-minute decision procedure that a mediator with no philosophical training can apply. The procedure should ask ordered questions, specify what answer stops the process with a clear finding, identify where the mediator must make an irreducible value judgment rather than apply a rule, and avoid reducing recognition to modern liberal notions of respect or dignity. Apply it to two cases: first, a veteran member demands that newcomers address her by an honorific title the charter explicitly forbids, claiming that without it her experience is erased; second, a designer claims her contribution is invisible because the cooperative’s internal attribution system only logs the final assembler of a product, not the conceptual originator. Include one case in which the procedure yields a result the mediator will find normatively unwelcome, and explicitly flag the point at which the dispute becomes a question of cooperative values that the conceptual framework cannot settle.
reasoning: |-
  Okay, I need to tackle this user's query. They're asking me to create a mediation procedure based on Hegel's master-slave dialectic for a worker-owned cooperative. The cooperative has no formal titles or hierarchy, but members are filing grievances about not being "recognized." The conflicts involve status, labor attribution, and distributive fairness. 

  First, I should recall Hegel's master-slave dialectic. It involves one-sided recognition where one party dominates, a struggle for pure prestige that's destructive, and mutual recognition achieved through formative labor and self-consciousness. I need to translate this into a practical, 20-minute procedure that a mediator without philosophy training can use. 

  The user specified that the procedure must: have ordered questions, clear stopping points, identify where value judgments are needed, avoid reducing recognition to modern liberal ideas, and handle two cases. One case is about honorific titles, and the other about labor attribution. Also, I need to include a case where the outcome is normatively unwelcome and flag where cooperative values must decide.

  Breaking it down: The core of Hegel's idea is that recognition isn't just about respect—it's about seeing each other as equals through shared work. So, the procedure should focus on moving from one-sided demands to mutual acknowledgment via labor contributions. 

  For the procedure structure: Start with questions that diagnose the type of conflict—is it one-sided recognition (like the veteran demanding a title) or misattributed labor (like the designer)? Then guide them through steps that reveal the risks of prestige struggles and push toward mutual recognition through labor. 

  Key elements: Ordered questions, stopping points for clear findings, value judgment points, and avoiding liberal reduction. For example, don't frame it as "respect" but as mutual acknowledgment through formative labor.

  Cases: 
  1. Veteran member wants an honorific title, claiming erasure of experience. This seems like a struggle for prestige—she's risking cooperative harmony for status. Applying Hegel, if she's seeking one-sided recognition, the procedure should show it's destructive and steer toward mutual recognition via her labor contributions. The stopping point might be if it's purely about prestige without labor basis.

  2. Designer feels invisible because attribution only credits the assembler, not the creator. This relates to formative labor—her conceptual work isn't recognized. Hegel's mutual recognition should emerge here by reforming the attribution system to include all contributors. No stopping point; it should lead to action for mutual recognition.

  For the normatively unwelcome outcome: In the first case, if the mediator has to judge that the veteran's demand is status-seeking and incompatible with cooperation, that might feel harsh but necessary. The value judgment comes when deciding whether the conflict is about cooperative survival or personal prestige.

  Building the procedure: Outline steps. Step 1: Identify the recognition demand. Step 2: Check if it's one-sided or mutual. Step 3: Assess prestige struggle risks. Step 4: Link to formative labor. Step 5: Push for mutual solutions. Include specific questions, like "What are you asking the other to acknowledge about you?" 

  Ensure it's time-bound—20 minutes—so questions must be concise. Mediator makes a value judgment at Step 3 if it's a life/death-level threat to cooperation. Stopping point at Step 2 if it's clearly one-sided with no labor basis.

  Applying to cases: For the veteran, her demand stops early because it's about status, not labor. Unwelcome outcome is rejecting her claim, emphasizing shared work over titles. For the designer, it proceeds to mutual recognition through attribution reform.

  Finally, flag where cooperative values decide: In Step 3, if the mediator judges the threat level, that's irreducible—it depends on cooperative priorities, not Hegel's framework.
answer: |-
  Here is a 20-minute mediation procedure rooted in Hegel's master-slave dialectic, designed for non-philosophical mediators. It focuses on **recognition as mutual constitution through labor**, not hierarchical status or liberal dignity. The procedure has 5 timed phases (4 min each) with ordered questions, stopping rules, and explicit value-judgment points.

  **Core Framework Applied:**
  - **One-sided recognition:** Dominance/subordination (e.g., demanding titles).
  - **Struggle for pure prestige:** Zero-sum status battles risking cooperative dissolution.
  - **Mutual recognition:** Achieved through *formative labor* (work that shapes both object and self-consciousness) and institutional structures enabling reciprocal acknowledgment.

  ---

  ### **Mediation Procedure: The Labor-Recognition Protocol**  
  *(20 mins total; use timer strictly)*  

  #### **Phase 1: Diagnose the Recognition Demand** (4 mins)  
  **Mediator Questions:**  
  1. "What specific action or acknowledgment do you believe you are owed?"  
  2. "Does this come from your role in *formative labor* (shaping the work/product) or from status/identity alone?"  
     - *Clarify:* "Does the labor exist independently of you? Would others see your imprint?"  
  3. "Is this demand about survival of your role/identity in the coop?"  

  **Stopping Rule:**  
  If the answer to Q2 is **"Status/identity alone, not labor"** → **Finding:** *One-sided recognition sought*. Mediation ends. Outcome: Demand incompatible with charter.  

  **Value Judgment Needed:** None yet.  

  #### **Phase 2: Map the Struggle Dynamics** (4 mins)  
  **Mediator Questions:**  
  1. "If denied, does this feel like an existential threat to your place here?"  
  2. "Does granting your demand diminish others’ recognition? How?"  
  3. "Is this conflict *only* about prestige, or does it alter how labor is seen/valued?"  

  **Stopping Rule:**  
  If answer to Q3 is **"Only about prestige"** → **Finding:** *Prestige struggle*. Mediation ends. Outcome: Demand rejected as zero-sum status competition.  

  **Value Judgment Needed:**  
  - Mediator judges if Q1 describes **cooperative life-or-death stakes** (e.g., "I’ll quit if ignored" = existential; "I’m upset" = not).  

  #### **Phase 3: Trace Labor to Mutual Recognition** (4 mins)  
  **Mediator Questions:**  
  1. "Show how your labor *forms* the outcome (beyond technical execution)."  
     - *Probe:* "Does your work reshape how others understand the task?"  
  2. "Does the coop’s structure *systematically* obscure this labor?"  
  3. "Can your labor be recognized without subordinating others?"  

  **Stopping Rule:** None. Proceed to Phase 4.  

  **Value Judgment Needed:** Mediator assesses Q2 for **systemic erasure** (e.g., attribution rules hiding conceptual labor).  

  #### **Phase 4: Forge Mutual Recognition** (4 mins)  
  **Mediator Tasks:**  
  - Restate labor contributions from Phase 3.  
  - Propose: "We redesign structures to make *formative labor* visible, ensuring all essential labor is reciprocally acknowledged."  
  - Draft concrete change (e.g., attribution logs, labor-description protocols).  

  **Stopping Rule:** If parties agree → **Finding:** *Mutual recognition achievable*. Outcome: Structural reform.  

  #### **Phase 5: Cooperative Sovereignty** (4 mins)  
  **If no agreement in Phase 4:**  
  Mediator declares: "This dispute exceeds recognition-through-labor. It is now a **values question** for the collective."  
  - Refer to full coop vote with framing: "Does sustaining this demand uphold or undermine our non-hierarchical constitution?"  

  **Value Judgment Needed:** Mediator **flags the irreconcilable values conflict** (e.g., "seniority vs. flat hierarchy").  

  ---

  ### **Case Applications**  

  #### **Case 1: Veteran Demands Forbidden Honorific Title**  
  - **Phase 1:**  
    - Q1: "Newcomers must call me ‘Maestra’."  
    - Q2: "Status alone. My experience *is* my labor." → *Clarify:* "Is ‘experience’ labor if not applied to current projects?" → "It’s inherent!"  
    - **STOP: One-sided recognition sought.** Outcome: Demand invalidated.  
  - **Why unwelcome?** Mediator may sympathize but Hegelian logic rejects status-based claims. Veteran seeks mastery without labor-proof.  

  #### **Case 2: Designer’s Invisible Contribution**  
  - **Phase 1:**  
    - Q1: "Log my design work in attribution."  
    - Q2: "Formative labor—I conceived the product." → Proceeds.  
  - **Phase 2:**  
    - Q3: "Alters labor valuation—assemblers get undue credit."  
  - **Phase 3:**  
    - Q1: "Design shapes the assembler’s task; my labor *forms* the product’s essence."  
    - Q2: **Value Judgment:** Systemic erasure confirmed.  
  - **Phase 4:** Proposes dual attribution: "Concept: [Designer]; Execution: [Assembler]." → Agreement. Outcome: System reformed. Mutual recognition via visible labor.  

  #### **Value Judgment Flag**  
  In **Phase 2 (Case 1)**, if veteran argues "No title = coop loses my expertise (existential threat)," mediator must judge: Is this *truly* life-or-death for the coop? If yes, it becomes a **cooperative values question** (Phase 5): Should expertise override flat hierarchy? Hegel’s framework *cannot* resolve this—only the collective can.  

  ---

  ### **Key Design Notes**  
  - **Anti-Liberal:** Replaces "dignity" with *labor-constituted mutuality*. Denies status-based claims.  
  - **Hegelian Core:**  
    - Labor is the vehicle for recognition.  
    - Prestige struggles (title demands) are dead ends.  
    - Mutual recognition requires institutional embodiment (e.g., attribution reforms).  
  - **Mediator Safety:** Stopping rules protect non-philosophers. Value judgments are bounded ("existential threat?" "systemic erasure?").  
  - **Time Discipline:** Rigid 4-min phases prevent philosophical digressions.
