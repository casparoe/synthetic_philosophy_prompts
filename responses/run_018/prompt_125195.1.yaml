prompt: |-
  I'm a graduate student in a seminar on practical rationality and collective decision-making, and I've been assigned to help a university governance committee that approves binding institutional commitments—multi-decade contracts, endowment policies, and core-curriculum requirements—that will constrain future students who are not yet present to vote. The committee currently relies on surveys of current students, but I want to translate a framework closer to coherent extrapolated volition into an operational tool: the normative standard should not be what students happen to want now, but what they would want after coherence, full information, and reflective equilibrium. Because this must be reusable rather than a one-time philosophical defense, I need it rendered as an actual decision procedure.

  Please design an ordered checklist or flowchart-in-prose that the committee can run on any proposal for a long-term binding commitment. Specify how to identify the stakeholder preference set without treating every expressed opinion as fixed; the coherence tests—transitivity, framing independence, consistency across time-horizons—that must be satisfied before extrapolation; how to model "better-informed" preferences without substituting the committee's own values; the points that must be handed to a deliberative body rather than solved analytically; and explicit stopping conditions—thresholds of divergence or ambiguity—where the procedure returns "do not decide" rather than imposing a constructed preference. Mark every unavoidable judgment call.

  Apply this procedure to three proposals: a thirty-year fossil-fuel-free campus energy contract that raises tuition by 2% annually; a mandatory two-year foreign-language core requirement that current students oppose by about seventy percent; and an endowment divestment excluding both fossil fuels and nuclear energy, which satisfies activists but reduces projected returns affecting future financial aid. Include one case where the procedure yields a recommendation the committee will strongly resist, and explain why it is forced. Then state clearly what the procedure cannot do—especially where values are constructed rather than discovered, and where coherence permits incompatible orderings. Organize your response in these sections with approximate lengths: (1) Role, Constraints, and Scope (~150 words); (2) The Procedure: Steps, Tests, and Stopping Rules (~450 words); (3) Worked Applications (~550 words); (4) Judgment Points and Hard Limits (~250 words).
reasoning: |-
  Okay, the user is a graduate student in a seminar on practical rationality and collective decision-making. They're tasked with helping a university governance committee that makes binding long-term commitments affecting future students. Current methods rely on surveys of current students, but the user wants to implement a framework inspired by coherent extrapolated volition (CEV), focusing on what students would want after achieving coherence, full information, and reflective equilibrium. The challenge is to turn this philosophical concept into a reusable operational tool.

  The user needs a structured procedure—a checklist or flowchart—that the committee can apply to any proposal. Key components include: identifying stakeholder preferences without taking them as fixed; coherence tests like transitivity and framing independence; modeling better-informed preferences without imposing the committee's values; points requiring deliberation; and stopping rules for when not to decide. They also want three examples applied, including one where the procedure yields an unpopular recommendation, plus limitations of the approach.

  The user's explicit request is technical, but their deeper needs involve bridging theory and practice. They're likely frustrated with simplistic survey reliance and want a robust, ethically defensible method that respects future stakeholders. Unspoken needs might include gaining academic credibility, creating a tool that outlives their seminar, and addressing power imbalances in governance. The committee probably faces pressure from activists, administrators, and current students, so the tool must be both rigorous and actionable. 

  For the procedure design, I need to translate CEV into concrete steps. First, define stakeholders inclusively—current and future students, considering their long-term interests. Preference elicitation should capture intensities and reasoning, not just binary opinions. Coherence tests must check for logical inconsistencies, like if preferences change under different framings or time horizons. Modeling better-informed preferences requires factual briefings and counterfactual exploration, not committee bias. Deliberative points could include moral trade-offs or foundational disagreements. Stopping rules should trigger when preferences remain ambiguous or divergent post-testing.

  The three test cases:
  - The fossil fuel contract: Higher costs for environmental benefits. Coherence might reveal current students undervalue sustainability once informed, but future students could resent costs. If modeling shows high confidence in long-term net benefits, approval might be forced despite committee resistance to tuition hikes.
  - Language requirement: Current opposition is high, but coherence could show cultural/skill benefits outweighing short-term hassle. If not, stop—don't override strong, coherent opposition.
  - Divestment: Excluding both fossil fuels and nuclear may be incoherent if nuclear is low-carbon. If modeling shows high aid losses with weak ethical gains, rejection might upset activists.

  Judgment points include weighting future vs. current interests and defining "full information." Hard limits: The procedure can't resolve fundamental value conflicts (e.g., individualism vs. collectivism) or create preferences where none exist. It assumes rationality is achievable, which may not hold for deeply emotional issues.

  The user might worry about committee buy-in, so the tool must feel practical, not academic. Emphasize clear thresholds and deliberation steps to prevent paralysis. Also, highlight that "do not decide" is a valid outcome—sometimes preserving optionality is wiser than imposing a constructed will.

  Finally, the unpopular recommendation in the fossil fuel case will challenge the committee's cost aversion, forcing them to confront their duty to future students. That tension is exactly why CEV is needed: to move beyond presentist bias. Acknowledging this strengthens the proposal's ethical core.
answer: |-
  ## (1) Role, Constraints, and Scope (~150 words)
  This procedure operationalizes a **Coherent Extrapolated Volition (CEV)** framework for evaluating binding, long-term institutional commitments affecting future stakeholders. Its normative goal is not current revealed preferences, but what stakeholders *would* will under conditions of **full information, logical coherence, and reflective equilibrium** (stable alignment of values, beliefs, and desires). Scope covers multi-decade commitments constraining future students (e.g., contracts, core curricula, endowment policies). Constraints: It must be **reusable**, **transparent**, **deliberative-inclusive**, and **non-substitutive** (committee values ≠ stakeholder values). It produces outputs: **Approve**, **Reject**, or **Do Not Decide (Ambiguous/Divided CEV)**. The procedure explicitly identifies unavoidable judgment points (J#) and stopping thresholds.

  ---

  ## (2) The Procedure: Steps, Tests, and Stopping Rules (~450 words)

  **Phase 1: Stakeholder Preference Elicitation & Initial Mapping**
  1.  **Identify Stakeholders:** Current students (primary proxy for future students), faculty (expertise/implementation), relevant alumni (long-term perspective), administration (feasibility). *Future students are represented via modeling in Phase 3.*
  2.  **Elicit Stated Preferences:** Use diverse methods: surveys (quantify support/opposition, capture intensity scales), focus groups (explore reasoning, trade-offs), public forums (identify key arguments/values). Record verbatim reasoning and value appeals (e.g., "fairness," "autonomy," "sustainability").
  3.  **Map Value Dimensions:** Catalog core values invoked (e.g., affordability, academic rigor, environmental responsibility, institutional autonomy, global citizenship). *(J1: Defining core value categories from discourse)*.

  **Phase 2: Coherence Testing & Filtering**
  4.  **Transitivity Test:** Check for preference cycles (e.g., A>B, B>C, but C>A) within individual/group responses on related issues. Flag inconsistencies for deliberation.
  5.  **Framing Independence Test:** Present key trade-offs inherent in the proposal (e.g., cost vs. sustainability, requirement vs. elective freedom) in logically equivalent but differently worded scenarios. Significant preference shifts (e.g., >15% net change in support) indicate incoherence/framing bias. *(J2: Designing equivalent framings)*.
  6.  **Time-Horizon Consistency Test:** Elicit preferences regarding similar trade-offs impacting different timeframes (e.g., small cost now for large benefit later vs. large cost later for benefit now). Major inconsistencies (>20% divergence in willingness-to-pay/pay thresholds) signal myopia/hyperopia.
  7.  **Filter & Synthesize:** Remove preferences failing core tests (4-6). Synthesize remaining expressed preferences and underlying values into a "Raw Stakeholder Preference Set" (RSPS). Document *why* preferences were filtered.

  **Phase 3: Extrapolation to CEV (Coherent, Better-Informed Volition)**
  8.  **Full Information Briefing:** Develop and present a neutral, comprehensive factsheet covering: Long-term consequences (costs, benefits, risks), alternatives (including status quo), expert consensus/controversy (e.g., climate science, labor market trends, investment theory), precedents/evidence from peer institutions. *(J3: Determining sufficient information scope/neutrality)*.
  9.  **Model "Better-Informed" Preferences:** Re-survey stakeholders (or a representative sub-sample) using deliberative polling techniques *after* Step 8. Facilitate moderated discussion focusing on trade-offs under the new information. Update RSPS with revised preferences and reasoning (now "Informed RSPS").
  10. **Extrapolate to Future Stakeholders:** Model future student interests based on:
      *   **Projected Context:** Demographic trends, economic forecasts (e.g., tuition sensitivity), technological/societal shifts (e.g., AI impact on language skills, energy transition pace).
      *   **Value Inheritance:** Assume core values (Step 3) persist unless strong evidence suggests shift, but *weight* future impacts more heavily (e.g., discount rate ≤ 1% for core values). *(J4: Choosing discount rate/weighting future impact)*.
      *   **Synthesize CEV:** Combine Informed RSPS with modeled future interests. Seek the preference ordering most consistent with the core values, logically coherent across time, and stable under the full information condition.

  **Phase 4: Deliberation & Decision Rule**
  11. **Identify Deliberative Points:** Flag for committee deliberation: Value conflicts (e.g., affordability vs. sustainability), ambiguous CEV syntheses, significant minority viewpoints (<25% but >10% opposition in CEV), profound uncertainty about future context.
  12. **Apply Decision Rule:**
      *   **IF** CEV is **Clear & Coherent (>70% support intensity in synthesis)** AND **No Major Value Conflict** flagged -> **Recommend APPROVE**.
      *   **IF** CEV is **Clear & Coherent (>70% opposition intensity in synthesis)** AND **No Major Value Conflict** flagged -> **Recommend REJECT**.
      *   **IF** CEV is **Ambiguous** (support 40-60%) OR **Divided** (significant coherent subgroups >25% on both sides) OR **Major Value Conflict Unresolved** after deliberation OR **Profound Uncertainty** -> **Recommend DO NOT DECIDE (Ambiguous/Divided CEV)**.
      *   *(J5: Defining "Major" Value Conflict/Uncertainty thresholds)*

  ---

  ## (3) Worked Applications (~550 words)

  **A. Thirty-Year Fossil-Fuel-Free Energy Contract (+2% Annual Tuition)**
  *   **Phase 1:** Surveys show 60% support ("sustainability important"), 35% oppose ("cost too high"). Values: Sustainability, Affordability, Leadership.
  *   **Phase 2:** Framing test: Support drops to 45% when framed as "pay $X more annually for 30 years vs. invest same in need-based aid." Time-horizon: Strong support for *short-term* green initiatives without cost, weak for long-term locked-in costs. *Incoherence flagged (cost sensitivity inconsistent)*.
  *   **Phase 3:** Briefing: Climate urgency (IPCC), long-term energy cost volatility projections (fossil likely ↑, renewables ↓), alternatives analysis (shorter contract? partial offset?). Deliberative poll: Support shifts to 55%, opposition hardens to 40% (cost-sensitive group). Extrapolation: Future students face acute climate impacts; projected lower energy costs & higher climate valuation likely strengthen CEV support *despite* cost. Affordability concerns mitigated if endowment grows/other aid increases. *(J4: Weighting future climate impact heavily)*.
  *   **Phase 4:** Value conflict (Affordability vs. Sustainability) persists but CEV synthesis shows moderate majority (55%) for approval after coherence/info. Minority opposition coherent but not dominant. **Recommendation: APPROVE**.
      *   *Why committee resists:* Significant tuition hike is politically difficult. Procedure forces recognition that CEV, considering future stakes & full info, overrides current cost aversion.

  **B. Mandatory Two-Year Foreign Language Requirement (70% Current Opposition)**
  *   **Phase 1:** Strong opposition (70%+: "irrelevant," "burdensome," "AI translates"). Values: Autonomy, Relevance, Efficiency.
  *   **Phase 2:** Transitivity: Students value "global competence" highly but rank language study low as a means to achieve it. Framing: Support rises to 40% when framed as "enhancing cognitive flexibility, deep cultural access, and resilience against AI job displacement." *Incoherence flagged (means-end disconnect, framing effect)*.
  *   **Phase 3:** Briefing: Cognitive benefits evidence, AI limitations (nuance/culture), labor market value of multilingualism + intercultural skills, alternatives (intensive short courses, optional pathways). Deliberative poll: Opposition softens to 55%, support rises to 40%. Extrapolation: Future global integration/AI world *may* increase value of deep language skills OR make them obsolete. High uncertainty. Core value of autonomy remains strong. CEV synthesis ambiguous: Significant coherent groups value deep cultural access (pro) vs. curricular freedom (con).
  *   **Phase 4:** CEV remains divided (~45% coherent pro, ~50% coherent con post-info/deliberation). Profound uncertainty about future relevance. Major value conflict (Autonomy vs. Prescribed Skill Development). **Recommendation: DO NOT DECIDE (Divided CEV)**. Status quo (optional pathways) preserved.

  **C. Endowment Divestment (Excludes Fossil Fuels & Nuclear; Reduces Projected Returns/Aid)**
  *   **Phase 1:** Activist support (80%+) for "ethical purity." General student body: 50% vague support, 30% indifferent, 20% concerned about aid. Values: Ethics, Financial Aid/Sustainability.
  *   **Phase 2:** Transitivity: Activists support divesting fossil fuels (climate ethics) but *also* nuclear (anti-nuke ethics). Opposing nuclear conflicts with maximizing decarbonization speed (per IPCC models requiring some nuclear). *Incoherence flagged (conflicting ethical goals)*.
  *   **Phase 3:** Briefing: Investment return projections (quantified impact on aid budget over 20-50yrs), full climate science (IPCC scenarios including nuclear role), ethics of intergenerational financial equity. Deliberative poll: Activist support drops slightly (75%), general support drops significantly (35%), opposition/concern rises (45%) due to aid impact. Extrapolation: Future students need both a habitable planet *and* affordable education. Excluding nuclear may hinder decarbonization pace. High projected aid loss harms future low-income students disproportionately. CEV synthesis leans against (approx. 55% coherent opposition): Ethics/impact trade-off favors a more pragmatic divestment (fossil-only) or ESG integration maximizing impact/returns.
  *   **Phase 4:** CEV moderately coherent for rejection. Value conflict (Pure Ethics vs. Pragmatic Impact/Financial Aid) partially resolved by CEV favoring pragmatic impact. **Recommendation: REJECT** this specific proposal (exclusion of nuclear). Suggests alternative (fossil-only + ESG) for separate CEV evaluation.

  ---

  ## (4) Judgment Points and Hard Limits (~250 words)

  **Unavoidable Judgment Points (J#):**
  *   **J1:** Defining core value categories from discourse (risk of overlooking/misrepresenting).
  *   **J2:** Designing truly equivalent framing scenarios.
  *   **J3:** Determining the scope and "sufficiency" of "full information" (bias risk).
  *   **J4:** Weighting future interests vs. present & choosing discount rates for values/impacts (ethical choice).
  *   **J5:** Defining thresholds: "Significant" minority, "Major" value conflict, "Profound" uncertainty (requires committee deliberation).

  **Hard Limits of the Procedure:**
  1.  **Values Are Constructed, Not Discovered:** CEV is a *constructed model*, not a revealed truth. It aims for robustness, not metaphysical correctness.
  2.  **Incompatible Orderings Under Coherence:** Coherence tests reduce inconsistency but cannot eliminate fundamental pluralism. Multiple coherent value orderings can exist (e.g., Libertarian vs. Communitarian ordering of Autonomy/Common Good). The procedure identifies this ("Divided CEV") but cannot resolve it philosophically.
  3.  **Modeling Limitations:** Projecting future contexts and values is inherently uncertain. Models are simplifications.
  4.  **Non-Quantifiable Values:** Profound values (e.g., sacredness, deep autonomy) resist easy trade-off analysis, complicating synthesis.
  5.  **Bias in Implementation:** Reliance on committee for deliberation, information selection, and judgment calls risks reintroducing elite bias if not rigorously managed. Neutral facilitation is crucial.
  6.  **Cannot Create Consensus:** Where deep, coherent value conflicts exist post-extrapolation (e.g., core curriculum case), the procedure can only say "Do Not Decide" or force a majoritarian outcome that may feel illegitimate to the minority.
  7.  **Assumption of Rationality:** The procedure assumes stakeholders *can* approximate coherence under good conditions. It struggles with deeply held, identity-based, or emotionally charged beliefs resistant to deliberation/information.

  The procedure provides a structured, values-explicit, future-sensitive framework far superior to snapshot surveys, but it remains a practical tool for fallible humans navigating complex, long-term moral commitments, not an algorithmic oracle.
