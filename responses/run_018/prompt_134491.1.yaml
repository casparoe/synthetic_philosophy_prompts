prompt: |-
  hey — im a phd student in phil of science / formal epistemology, and im kind of panicking about a talk next thursday. im presenting to our reading group (like 12 people): half are formal epistemologists who live for old-evidence debates, a couple philosophers of physics who think bayesianism is just stats with extra philosophical branding, and one external visitor who does evolutionary debunking in metaethics (no idea why theyre in the room but theyre sharp).

  my thesis is that the old-evidence problem in bayesian epistemology isnt solved by glymour-style bootstrapping or howson-style counterfactual prior adjustments. instead i defend structurally amnesiac priors: an agent can retroactively excise hypotheses from their prior space if those hypotheses were never actually live for them. it sounds like cheating, but i claim it preserves diachronc coherence as long as you weaken the rational-belief uniqueness constraint to what i call local uniqueness — uniqueness only within the live hypothesis space at each time. its definitely niche, but i think it resolves the tension between diachronic rationality and the intuition that old evidence can still confirm a theory.

  i need a prep sheet for the q&a. please order the objections by how much damage theyd do, phrased the way those people would actually say them — not generic strawmen. for each objection i want: the phrasing, who'd likely ask it (formal epistemologist, philosopher of physics, or the metaethics visitor), a reply i can deliver in about two minutes, and an honest note on where that reply is weakest or softest. also include the one question im praying nobody asks.

  after the list, give me a brief structured summary in JSON with exactly these fields: objection_rank (number), audience_role (string), phrasing (string), reply_summary (string), weakness_note (string), damage_tier (one of high/med/low). and include one extra entry with field dreaded_question containing the thing im hoping stays unasked.

  please dont ask for a bibliography or citation list — the model im testing this on cant search, and neither can i during the talk. just work with the concepts as ive laid them out.

  thanks!
