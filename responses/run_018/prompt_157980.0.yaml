answer: |-
  **Ubuntu reconciles constitutive relationality with individual moral agency by distinguishing between the ontological conditions for personhood and the phenomenological exercise of agency within those relations, rejecting collective determinism through its emphasis on dynamic reciprocity and moral becoming.**  

  1.  **Internal vs. External Relations:**  
      Ubuntu posits *internal relations* as constitutive of personhood—relations are not merely external connections (like proximity or association) but fundamental to one's very being and identity ("*Umuntu ngumuntu ngabantu*": "A person is a person through other persons"). One’s capacity for moral agency *emerges from* and *depends on* these relations. However, once constituted, the agent exercises moral choice as an individuated participant within the relational network, not merely as a passive product of it.  

  2.  **Avoiding Collective Determinism:**  
      A thick relational ontology does *not* collapse into determinism because Ubuntu conceives personhood as a *dynamic moral project* rather than a static outcome. Relations are reciprocal and dialogical: individuals actively shape and are shaped by their community. Moral agency requires *participation* in this reciprocal process—cultivating virtues like compassion (*ubuntu*), justice, and responsibility *toward others*. This agency is individuated because each person uniquely enacts their relational obligations and responds to moral dilemmas within their context.  

  3.  **Case of Radical Relational Deprivation:**  
      -   **Community Failure as Constitutive of the Wrong:** Yes, Ubuntu commits us to viewing the community’s failure to provide formative relations as partly constitutive of the wrong. The deprived agent lacks the relational scaffolding necessary to develop full moral personhood (e.g., empathy, conscience, social accountability). The wrong is thus a symptom of ruptured relationality—a communal deficit manifesting in individual action.  
      -   **Preserving Individual Accountability:** Individual responsibility remains coherent because:  
          (a) Agency persists even if diminished. The deprived agent still enacts *a choice* (however distorted), demonstrating a minimal but existent moral capacity.  
          (b) Accountability is inherently relational: holding the agent responsible is *itself* an act of moral recognition and a demand for their reintegration into the human community.  
          (c) Responsibility is shared but not dissolved: The community bears *retrospective responsibility* for its failure, but the agent bears *prospective responsibility* for their act. Justice requires communal restoration *and* individual accountability (e.g., through restorative processes addressing both the act and its relational roots).  

  **Coherence Mechanism:** Ubuntu frames responsibility as *non-derivative but relationally conditioned*. The individual’s moral failure is theirs alone in the moment of action, but the conditions enabling that failure implicate the community. Thus, while the community’s dereliction explains the *possibility* of the wrong, it does not erase the agent’s role in *actualizing* it. Justice must address both dimensions to heal the relational rupture.
