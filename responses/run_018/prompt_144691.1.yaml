answer: |-
  ### Bottom line  
  My credence is **0.20** that agents should use Kelly-style betting for allocating credence across epistemic utility functions. Kelly’s core reliance on compounding and known payoffs clashes with the abstract, self-referential nature of philosophical uncertainty, making it a poor fit despite surface appeal.  

  ### Decomposition  
  **(a) Is geometric growth the right epistemic target? (Credence: 0.30)**  
  No direct equivalent to "wealth" exists in epistemic contexts. While maximizing long-term accuracy *resembles* geometric growth (e.g., via Bayesian updating), epistemic goals like coherence or truth-tracking aren’t naturally multiplicative. Without a compounding resource (like money), forcing geometric growth feels artificial.  

  **(b) Is there a coherent ‘stake’ for philosophical payoffs? (Credence: 0.15)**  
  Epistemic utility (e.g., log-scoring rules) measures "accuracy," but this becomes circular when the *choice of scoring rule itself* is contested. Unlike money, philosophical "payoffs" lack objective units, risking infinite regress (e.g., "What utility function values the *choice* of utility functions?").  

  **(c) Does nested uncertainty destroy the derivation? (Credence: 0.10)**  
  Kelly assumes known, linear payoffs per outcome. Here, the "payoff" (epistemic utility) is *itself* under dispute, creating meta-uncertainty. The original proof relies on fixed stakes—violated when the scoring rule isn’t settled. This collapses the optimization foundation.  

  **(d) Can bounded agents approximate optimal allocation? (Credence: 0.45)**  
  Even if Kelly applied, humans/LLMs lack the precision to compute geometric expectations over abstract normative options. State spaces are ill-defined (e.g., "all possible epistemic norms"), and heuristics like equal weighting or satisficing would likely dominate.  

  **Combination logic**:  
  The sub-credences are multiplicative (as dependencies compound): \(0.30 \times 0.15 \times 0.10 \times 0.45 \approx 0.002\). But this undersells (c)’s dominance—nested uncertainty alone nearly invalidates the framework. A weighted average (weighting (c) at 50%, others at ~17%) better reflects reality: \((0.30 \times 0.17) + (0.15 \times 0.17) + (0.10 \times 0.50) + (0.45 \times 0.17) = 0.20\).  

  ### Sensitivity check  
  **(c) dominates**: If nested uncertainty were resolved (e.g., a proof that metanormative stability emerges under *any* scoring rule), my credence could jump to **0.50**. But as-is, the self-referentiality of allocating to utility functions under uncertainty guts Kelly’s logic, contributing >50% of my skepticism.  

  ### What would change my mind  
  A formal model showing that Kelly allocation over epistemic utilities **dominates alternatives in regret bounds** across diverse meta-uncertainty scenarios (e.g., minimizing long-run "accuracy regret" even when the true utility function is unknown). Empirical evidence of philosophers or AI systems converging faster to robust norms via fractional Kelly bets would also shift me. Absent this, the analogy remains strained.  

  *(Note: This reflects inherent tensions in epistemic utility theory. Kelly shines where payoffs are measurable and compounding—elsewhere, it risks being a solution in search of a problem.)*
