prompt: |-
  I'm a mediator at a community center that mostly handles family disputes between immigrants from high-rule cultures and locals with more flexible norms. I'm tired of just winging it when one side says "the rules are clear" and the other says "you're being rigid". Write me a 15-minute decision procedure I can run before a session to pick whether to frame the conflict as tight-culture (explict rules, uniform enforcement, clear sanctions) or loose-culture (context, negotition, adpative norms). Don't just recycle the usual country-level sociology -- I need it for one dispute, with questions in order, stop points, and clear flags for where I'm just making a value call rather than applying the theory. Apply it to three cases: a teenager skipping a ritual obligation, cousins fighting over an informal loan, and a case where the procedure says go tight but you'd actually want loose. Say exactly where it breaks down, especially when people invoke "culture" strategically.
reasoning: |-
  We are designing a 15-minute decision procedure to help the mediator decide whether to frame a dispute as tight-culture (explicit rules, uniform enforcement, clear sanctions) or loose-culture (context, negotiation, adaptive norms). The procedure must be practical for a single dispute, with ordered questions, stop points, and clear flags for value judgments.

  The procedure should avoid relying solely on country-level sociology and focus on the specific dispute at hand. We must also account for strategic invocations of "culture".

  ### Key Considerations:
  1. **Tight-Culture Traits**:
     - Explicit, codified rules.
     - Uniform enforcement regardless of context.
     - Clear sanctions for violations.
     - Low tolerance for deviance.

  2. **Loose-Culture Traits**:
     - Rules are context-dependent.
     - Negotiation and flexibility are expected.
     - Adaptive norms that change with circumstances.
     - Higher tolerance for deviance.

  3. **Strategic Use of "Culture"**: Parties might invoke culture to gain advantage. We must look beyond their claims to the actual behaviors and expectations.

  ### Decision Procedure (15 minutes)

  **Objective**: Determine the dominant framing (tight or loose) for the specific dispute.

  **Steps**:

  1. **Identify the Core Issue (2 minutes)**:
     - What is the specific behavior or event in dispute? (e.g., skipping a ritual, non-repayment of a loan)
     - Ask: "What exactly happened that led to this dispute?" (Avoid why; focus on what.)

  2. **Examine the Rule in Question (3 minutes)**:
     - Is the rule explicitly stated (written or well-known by all)? 
       - If yes, note it and move to enforcement. 
       - If not, it's likely loose. Stop and flag: "Rule is implicit or context-dependent."
     - If explicit, ask: "Is there a written document or a clear oral tradition that everyone agrees on?" 
       - If no, stop and flag: "Rule is not universally explicit." -> Leaning loose.

  3. **Assess Enforcement Consistency (3 minutes)**:
     - Ask: "In the past, have exceptions been made for similar situations? If so, under what circumstances?"
     - Look for:
       - Uniform enforcement (tight) vs. case-by-case (loose).
       - If parties provide examples of past flexibility, it suggests loose. If they insist on no exceptions, tight.
     - Flag: If past examples are disputed, note that and move to step 4.

  4. **Explore Sanctions and Consequences (3 minutes)**:
     - Ask: "What typically happens when someone breaks this rule? Is the consequence always the same, or does it depend?"
     - Tight: Fixed consequences (e.g., always shunned, always fined).
     - Loose: Consequences are negotiated, vary by context, or are sometimes overlooked.
     - Flag: If consequences are described as fixed but there's evidence of variability, note the inconsistency. This might indicate loose culture or strategic tightening.

  5. **Assess Tolerance for Deviance (2 minutes)**:
     - Ask: "How do people in your community usually react when someone breaks this kind of rule? Do they expect strict adherence, or is some leeway normal?"
     - Tight: Strong negative reactions, pressure to conform.
     - Loose: More forgiving, room for discussion.

  6. **Value Judgment Call (2 minutes)**:
     - **Synthesize**: Review steps 2-5. If at least three steps point clearly to tight or loose, go with that.
     - **Ambiguity**: If mixed, consider:
       - The consequences of framing (tight might escalate conflict, loose might undermine authority).
       - Your own values: Do you prioritize harmony (loose) or order (tight)?
       - Flag: "I am making a value call because the evidence is mixed. I choose [tight/loose] because [reason]."

  **Stop Points**:
  - After step 2: If the rule is not explicit, you can stop and frame as loose.
  - After step 3: If enforcement is consistently rigid, frame as tight; if flexible, loose.
  - After step 4: If sanctions are fixed, tight; if variable, loose.
  - After step 5: If tolerance for deviance is low, tight; high, loose.

  **Strategic Invocation of Culture**:
  - Watch for contradictions: e.g., a party claims "rules are absolute" but then admits exceptions when pressed.
  - Note when a party uses "our culture" to shut down discussion. This may be strategic and not reflective of actual norms.
  - In such cases, rely more on the evidence from steps 3-5 (past behavior) than on stated ideals.

  ### Application to Cases

  #### Case 1: Teenager skipping a ritual obligation
  - **Step 1 (Core Issue)**: Teenager skipped a mandatory family/religious ritual.
  - **Step 2 (Rule)**: The ritual is explicit (e.g., must attend weekly service). Explicit rule -> tight.
  - **Step 3 (Enforcement)**: Past exceptions? E.g., for illness, travel. If yes, then loose. If no exceptions ever, tight.
  - **Step 4 (Sanctions)**: Fixed punishment (e.g., grounded for a month) -> tight. If punishment varies (e.g., depending on reason), loose.
  - **Step 5 (Tolerance)**: Community reaction? Strong disapproval -> tight; understanding if reasons are valid -> loose.
  - **Synthesis**: If the ritual is from a high-rule culture, likely tight. But if the family has made exceptions (e.g., for school events), it might be loose in practice. 
  - **Decision**: If steps 2,3,4 point to tight (explicit, no exceptions, fixed punishment) and step 5 shows low tolerance, then frame as tight.

  #### Case 2: Cousins fighting over an informal loan
  - **Step 1 (Core Issue)**: One cousin lent money informally, the other hasn't repaid.
  - **Step 2 (Rule)**: Is there an explicit rule? Usually not for informal loans. Implicit norm: "pay back when you can." -> loose.
  - **Step 3 (Enforcement)**: Past loans? Often flexible, extended deadlines. -> loose.
  - **Step 4 (Sanctions)**: Variable: might involve family pressure, but no fixed penalty. -> loose.
  - **Step 5 (Tolerance)**: Some grumbling but usually resolved with negotiation. -> loose.
  - **Decision**: All steps point to loose.

  #### Case 3: Procedure says tight but you'd want loose
  **Scenario**: A family from a culture known for tight norms (e.g., strict punctuality) has a dispute about arriving late to a family event. The procedure might indicate tight, but we want to frame as loose.

  - **Step 1**: A family member arrived 30 minutes late to a gathering.
  - **Step 2**: Rule: "Be on time" is explicit. -> tight.
  - **Step 3**: Enforcement: In the past, they have excused lateness due to traffic, work, etc. -> loose (but the party claiming offense might deny this).
  - **Step 4**: Sanctions: Sometimes a reprimand, sometimes ignored. -> loose.
  - **Step 5**: Tolerance: Mixed. Some family members get angry, others don't mind. 
  - **Synthesis**: Steps 2 points to tight, but steps 3 and 4 suggest loose. Step 5 is mixed. 
  - **Value Judgment**: The mediator might note that in this family, despite the explicit rule, enforcement is flexible. To promote harmony, the mediator frames it as loose. 
  - **Breakdown**: The party insisting on tight might strategically invoke "culture" to demand punishment, even though the family's actual behavior is loose. The mediator must highlight the past flexibility (step 3) to counter the strategic claim.

  **Where the Procedure Breaks Down**:
  - When past behavior (steps 3 and 4) is contested. The mediator must then rely on step 5 (tolerance) and their own judgment.
  - When one party is using "culture" as a weapon. The mediator must separate rhetoric from actual norms by focusing on concrete past examples.

  This procedure provides a structured way to make a decision in 15 minutes, with clear flags for when the mediator is making a value call.
answer: |-
  Here's a 15-minute decision procedure designed for pre-mediation prep, with clear phases, timed stops, and flags for value judgments. It focuses on **behavioral evidence** over cultural labels to avoid strategic "culture" claims. Use a worksheet to jot notes.

  ---

  ### **15-Minute Tight/Loose Framing Decision Procedure**  
  **Goal:** Determine whether to frame the dispute around fixed rules (tight) or contextual flexibility (loose).  
  **Core Principle:** Ignore parties' claims about "our culture." Focus on observable behaviors and precedents.  

  #### **Phase 1: Rule Origin (3 minutes)**  
  **Question:** *"Is the expectation in conflict written, sworn, or formally passed down (e.g., contract, religious text, family oath)?"*  
  - **Stop if:**  
    - **YES** → Proceed to *Phase 2*.  
    - **NO** (unspoken/unwritten) → **Frame as LOOSE**. Stop procedure.  
    - **UNCLEAR** (e.g., "Everyone knows it!") → Flag as *strategic invocation* and proceed to Phase 2.  
  **Value Call:** None. Pure fact-finding.  

  #### **Phase 2: Enforcement Consistency (4 minutes)**  
  **Question:** *"In past similar situations, was the rule enforced exactly the same way regardless of who was involved or the context?"*  
  - **Evidence to seek:**  
    - Examples of identical outcomes (tight) vs. negotiated/contextual outcomes (loose).  
    - Avoid "should" answers; demand *specific incidents*.  
  - **Flags:**  
    - **TIGHT** if: Uniform enforcement described (e.g., "Grandpa always cut off latecomers").  
    - **LOOSE** if: Exceptions admitted (e.g., "We forgave Auntie when she was sick").  
    - **STRATEGIC WARNING:** If a party insists "no exceptions" but history shows otherwise → Note hypocrisy.  
  **Value Call:** If past cases conflict, you *must* decide which precedent weighs more. Flag: *"Choosing dominant precedent based on frequency."*  

  #### **Phase 3: Sanction Flexibility (3 minutes)**  
  **Question:** *"When broken, does this rule demand a specific consequence (e.g., repayment +20%, banishment), or is it open to bargaining?"*  
  - **TIGHT indicators:** Fixed penalties, no negotiation.  
  - **LOOSE indicators:** Consequences adjust based on relationships, intent, or hardship.  
  - **Stop if:** Sanctions are rigid → **Frame as TIGHT**. If flexible → **Frame as LOOSE**.  
  **Value Call:** If sanctions are *theoretical* (never enforced), default to LOOSE. Flag: *"Sanctions unenforced in practice."*  

  #### **Phase 4: Social Reaction (3 minutes)**  
  **Question:** *"How do bystanders (family/community) react to violations? Do they demand strict compliance or encourage compromise?"*  
  - **Key:** Focus on *actual reactions*, not ideals.  
  - **TIGHT:** Collective outrage, social shaming.  
  - **LOOSE:** Excuses accepted, mediation offered.  
  **Value Call:** If reactions are mixed, prioritize the *most impactful* outcome (e.g., shaming trumps quiet forgiveness). Flag: *"Weighting consequential reactions."*  

  #### **Phase 5: Synthesis (2 minutes)**  
  - **TIGHT verdict:** Phases 1–3 show explicit, uniform rules with fixed sanctions.  
  - **LOOSE verdict:** Any phase shows ambiguity, exceptions, or negotiation.  
  - **Ambiguity protocol:** If 50/50, default to LOOSE (promotes dialogue). Flag: *"Defaulting to flexible framing to enable negotiation."*  

  ---

  ### **Application to Cases**  
  #### **Case 1: Teenager skipping ritual obligation**  
  - **Phase 1:** Ritual is "formal" (e.g., ancestral worship). **→ Proceed.**  
  - **Phase 2:** Uncle admits: "We excused Maria during exams." **→ LOOSE flag.**  
  - **Phase 3:** Sanction is scolding, but intensity varies. **→ LOOSE.**  
  - **Phase 4:** Relatives split: elders outraged, parents lenient. **→ Mixed.**  
  - **Synthesis:** **Frame LOOSE.** Precedents show contextual exceptions.  
  - **Breakdown risk:** Elder invokes "culture" strategically. Procedure overrides by exposing past flexibility (Phase 2).  

  #### **Case 2: Cousins fighting over informal loan**  
  - **Phase 1:** No written agreement. **→ Frame LOOSE.** Stop.  
  - **Why it works:** Avoids entanglement in "family duty" rhetoric. Focuses on observable informality.  

  #### **Case 3: Procedure Says TIGHT, But You Want LOOSE**  
  **Scenario:** Elderly parent demands fixed inheritance split (written will). Sibling caring for parent argues for larger share.  
  - **Phase 1:** Written will exists. **→ Proceed.**  
  - **Phase 2:** Past enforcement: Rigid (e.g., "No exceptions in 20 years"). **→ TIGHT flag.**  
  - **Phase 3:** Sanction: Disinheritance. Fixed. **→ TIGHT.**  
  - **Phase 4:** Community reaction: Mixed (some call it harsh).  
  - **Synthesis:** Procedure says **TIGHT**... but you want LOOSE for equity.  
  - **Where it breaks down:**  
    - Phase 2 ignores *why* precedents were rigid (e.g., past cases lacked caregiver sacrifices).  
    - **Your override:** Value call in Phase 4: *"Weighting consequential reactions."* Frame LOOSE because community sympathy for caregiver suggests adaptive norms *should* apply.  
  - **Strategic warning:** Parent invokes "culture" (e.g., "Tradition demands rigidity!") to mask control. Counter by highlighting community's flexible reactions (Phase 4).  

  ---

  ### **When the Procedure Breaks Down**  
  1. **Strategic "Culture" Claims:** Parties weaponize "tradition" to avoid scrutiny.  
     - **Solution:** Anchor in Phases 2–4 (past behaviors). Ask: *"Show me when this was enforced exactly as you say."*  
  2. **No Precedents:** Conflict is novel (e.g., new technology).  
     - **Solution:** Default to LOOSE framing to co-create norms.  
  3. **Power Imbalances:** Rigid rules favor dominant parties (e.g., elders).  
     - **Solution:** In Phase 5, consciously default to LOOSE to empower negotiation. Flag: *"Mitigating power imbalance."*  

  **Time Check:** Practice with a timer. Phases 1–4 take 13 minutes; synthesis is 2 minutes. This balances rigor with mediation pragmatism.
