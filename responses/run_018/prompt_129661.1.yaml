answer: |-
  ### Brainstorming: Core Puzzles and Niche Cases  
  **Classic Puzzles:**  
  1. **Statue and Clay:** A statue (Goliath) is molded from a lump of clay (Lump). If Lump is destroyed, Goliath is destroyed, yet they have different modal properties (e.g., Lump could survive being squashed; Goliath could not). This suggests co-location without identity.  
  2. **Ship of Theseus:** A ship’s planks are gradually replaced. Is the renovated ship identical to the original? If the original planks are reassembled, is *that* ship the original? This exposes divergent persistence conditions for the artifact versus its matter.  
  3. **Modal Divergence:** An artifact (e.g., a watch) could have been made of different matter (gold instead of steel), but its constituent matter (this steel) could not have been different matter. This implies distinct essence conditions.  

  **Niche Cases:**  
  1. **Heritage Monument:** Notre-Dame’s limestone eroded over centuries and was replaced with synthetic aggregate chemically identical but lacking historical continuity (e.g., no quarry lineage). Is it the same monument despite causal discontinuity?  
  2. **Bio-Engineered Sculpture:** A living artwork maintains a fixed bronze-like shape while metabolically replacing 100% of its cells every three months. Does its identity persist through total metabolic turnover?  

  ---

  ### Desiderata for a Theory of Material Constitution  
  Adequate theories must resolve tensions arising when objects persist through material change. Below, desiderata are defined by **phenomenon/case**, **rationale**, and **negotiability**. Key tensions center on jointly unsatisfiable pairs (marked ⚠️).  

  1. **Co-Location Without Numerical Identity**  
     - *Phenomenon/Case:* Statue and clay occupy identical spacetime regions yet differ modally (e.g., Lump survives compression; Statue does not).  
     - *Rationale:* Avoids collapsing distinct entities into one, preserving intuitive and modal distinctions.  
     - *Negotiability:* Non-negotiable for theories accepting ordinary objects (e.g., constitution theory).  

  2. **Divergent Persistence Conditions**  
     - *Phenomenon/Case:* Ship of Theseus survives plank replacement; its original matter does not. The bio-sculpture persists through cellular turnover; its matter perishes.  
     - *Rationale:* Captures how artifacts outlive their matter while matter obeys mereological conservation.  
     - *Negotiability:* Non-negotiable for artifact-friendly theories.  

  3. **Form/Function Preservation Across Turnover**  
     - *Phenomenon/Case:* Heritage monument retains identity despite synthetic replacement; bio-sculpture preserves structure via metabolic regeneration.  
     - *Rationale:* Explains cultural/biological continuity where matter is fungible but organization is not.  
     - *Negotiability:* Non-negotiable for practical ontology (conservation, biology).  

  4. **Consistency with Science**  
     - *Phenomenon/Case:* Chemistry (mass conservation in aggregate replacement), conservation science (heritage authenticity debates), biology (metabolic turnover as identity-preserving).  
     - *Rationale:* Avoids positing entities violating physical or biological laws (e.g., immaterial "essences").  
     - *Negotiability:* Non-negotiable for naturalistic metaphysics.  

  5. **Constitution vs. Aggregation Distinction**  
     - *Phenomenon/Case:* A ship is *constituted by* planks but not *identical* to them; a mere pile of planks is an aggregate. Heritage limestone is *constituted* into a monument; synthetic aggregate is merely *made of* parts.  
     - *Rationale:* Grounds the difference between structured wholes (artifacts) and heaps.  
     - *Negotiability:* Non-negotiable for theories distinguishing artifacts from collections.  

  ⚠️ **Jointly Unsatisfiable Desiderata:**  
  - **Co-location (1) + Scientific Consistency (4):** Co-location posits two entities (e.g., statue *and* clay) in one region, violating parsimony and inviting conflict with physics (e.g., mass duplication). Yet science requires a single material basis.  
  - **Divergent Persistence (2) + Constitution/Aggregation (5):** If artifacts have stricter persistence than aggregates (e.g., a ship requires functional unity), this demands robust "constitution" criteria. But divergent persistence (e.g., Ship vs. matter) risks making artifacts epiphenomenal to matter, undermining their ontological status.  

  ---

  ### Brief Theory Assessment Against Criteria  
  - **Constitution View (e.g., Baker):** Accepts co-location (1) and divergent persistence (2), handling form/function (3) via "unity of purpose." Struggles with scientific consistency (4) due to multiple co-located entities. Distinguishes constitution from aggregation (5) via primary kinds.  
  - **Perdurantism (4D-ism):** Rejects co-location (1) by treating objects as spacetime worms with temporal parts. Handles turnover (2,3) via part-stages and aligns with science (4). Blurs constitution/aggregation (5) by reducing artifacts to part-sequences.  
  - **Mereological Essentialism:** Denies part replacement: no ship survives plank change. Fails divergent persistence (2) and form/function (3), but satisfies science (4) by equating objects with matter. Reduces artifacts to aggregates (5).  
  - **Artifact Eliminativism:** Rejects all desiderata except science (4). Artifacts are convenient fictions; only matter exists. Solves tensions by eliminating the problem but defies cultural/biological intuition (3).  

  The central tension remains: **co-location and divergent persistence** demand ontological "layers," while **scientific consistency** pushes for a unified material basis. This irresolvable clash underscores why the puzzle endures—a testament to metaphysics’ struggle to reconcile human abstraction with physical reality.  

  ---  
  *This analysis provides a rigorous framework for evaluating object persistence, emphasizing fault lines in contemporary ontology. For the feature, focus on how heritage and bio-art cases modernize ancient dilemmas, exposing unresolved tensions in what it means to "survive."*
