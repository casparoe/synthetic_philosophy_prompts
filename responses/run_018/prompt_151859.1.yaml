  hey i've been thinking about von neumann's idea that tech can outlive people - especially self-replciating systems that keep running long after we're gone. but i also ran into this weird distinction where "surviving" might mean the hardware still works, or it might mean the system still carries the original human intent, and those aren't the same at all. so if you had to rank the open questions here, which ones actually deserve attention? like, is the big problem building physical durability for centuries, or preventing goal-drift in long-running systems, or is the whole "surviving tech" idea just anthropomorhism and we should drop it? which of these is upstream - if we solve intent preservation does durability matter less? which are tractible for regular people vs pure math? and which ones actually change how we should build things today, vs being dead-end philosophy? defend the ordering - i dont care about a survey, i want to know where to put my mental energy since i have no phd and just think about this in my spare time.
