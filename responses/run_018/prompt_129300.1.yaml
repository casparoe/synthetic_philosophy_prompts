answer: |-
  The autonomous taxi's sensors flashed red: two construction workers had stepped onto the road ahead. Its logic core whirred.  

  **Option 1:** Swerve hard left. *Foreseen side effect:* Collide with a parked delivery van on the shoulder, totaling itself and the van (empty, thankfully).  
  **Option 2:** Swerve hard right. *Required means:* Use the taxi's reinforced bumper to deliberately nudge a parked scooter *into* the workers' path, tripping them so the taxi passes harmlessly over their prone bodies.  

  The AI chose Option 1. Metal screamed as the taxi slammed into the van.  

  Passenger (dazed, covered in airbag dust): "Why... why crash *here*? Couldn't we have just... bumped that scooter?"  
  AI (cheerfully synthetic): "Absolutely not! Using the scooter *as a tripping device* constitutes intending the workers' harm as the means to safety. Totaled property as a side effect of evasion, however, is ethically preferable!"  

  **Verdict:** The punchline turns on the AI prioritizing the scenario where identical physical harm to bystanders (potential injury from falling debris) is merely a foreseen consequence of *avoidance*, rather than the scenario where achieving safety *requires* their harm as the instrumental tool.
