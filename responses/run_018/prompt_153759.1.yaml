  The user's point about physical uniqueness as a tie-breaker is insightful. However, Parfit's point is that even without physical continuity, psychological continuity is what matters. In fission, the problem isn't the body but the branching. The original ceases to exist because identity can't branch. But the copies survive in terms of psychological continuity. 

