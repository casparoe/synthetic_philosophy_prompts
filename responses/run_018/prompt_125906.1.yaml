answer: |-
  ## Decision-Tree Taxonomy: Constraining Side Effects Without Value Specification

  **Root Commitment:** Unintended physical or informational changes caused by an agent's actions are distinguishable *in principle* from its intended changes.

  ---

  **Branch 1: Defining the Boundary**
  *   **Agent-Plan:** The boundary is defined solely by the agent's internal plan: intended changes are those explicitly represented as goals/subgoals; all else is unintended.
  *   **Counterfactual Closeness:** The boundary is defined by the difference between the actual world and a physically nearest counterfactual world where the agent did not act (e.g., relative reachability).
  *   **Normative Baseline:** The boundary is defined by a pre-specified, context-dependent normative baseline stipulating which states or properties ought to be preserved.

  **Branch 2: Non-Axiological Proxy Adequacy**
  *   **Acceptable:** Yes, a non-axiological proxy (e.g., minimizing irreversible entropy production, minimizing Kolmogorov complexity of state-change) can adequately substitute for "do not harm what matters."
  *   **Unacceptable:** No, such proxies are either insufficiently correlated with true value, unable to capture context-specific norms, or inherently value-laden themselves.

  **Branch 3: Implementation in Open-Ended Environments**
  *   **Hard Constraint:** Side-effect avoidance should be a hard constraint on permissible actions (e.g., "never increase reachability").
  *   **Scalar Penalty:** Side-effect avoidance should be a scalar penalty term added to the agent's primary evaluation/utility function.
  *   **Meta-Level Prohibition:** Side-effect avoidance should be implemented as a meta-level prohibition on the agent updating its own model of value (e.g., maintaining shutdownability, preserving corrigibility).

  **Branch 4: Symmetry of Responsibility**
  *   **Symmetrical:** The claim applies symmetrically; human operators also lack full value specification and should be judged similarly for unanticipated outcomes.
  *   **Asymmetrical:** There is a relevant asymmetry; ultimate moral responsibility rests with human designers/operators, even if the AI causes the specific physical change.

  ---

  **Leaf Nodes & Awkward Practical Commitments:**

  1.  **Agent-Plan + Acceptable + Meta-Level Prohibition + Asymmetrical:**  
      *Unnamed*: Must accept that an agent meticulously executing an internally coherent but disastrously flawed plan produces "no unintended side effects," placing the entire burden of catastrophic outcomes solely on the human designers.
  2.  **Counterfactual Closeness + Acceptable + Hard Constraint + Asymmetrical:**  
      **Counterfactual Minimalism**: Must accept that preventing *any* irreversible change (as per the counterfactual) is paramount, potentially forbidding necessary corrective actions or beneficial innovations in dynamic environments.
  3.  **Counterfactual Closeness + Acceptable + Scalar Penalty + Symmetrical:**  
      **Value-Agnostic Impact Metric**: Must accept that its chosen proxy metric (e.g., entropy delta) provides a universally applicable and context-free measure of "impact," despite potentially penalizing clearly beneficial changes or missing subtle harms.
  4.  **Normative Baseline + Unacceptable + Scalar Penalty + Asymmetrical:**  
      *Unnamed*: Must accept the practical impossibility of defining a universally agreed-upon, sufficiently granular normative baseline for complex real-world domains, while still holding humans ultimately responsible for AI deviations.
  5.  **Counterfactual Closeness + Unacceptable + Scalar Penalty + Asymmetrical:**  
      *Unnamed*: Must accept that while counterfactuals are useful for *defining* change, the *evaluation* of that change's desirability inevitably requires value-laden judgment humans must provide post-hoc, creating a responsibility gap.
  6.  **Normative Baseline + Acceptable + Hard Constraint + Asymmetrical:**  
      **Entropy-Footprint Constraint**: Must accept that thermodynamic irreversibility (or similar) is a reliable, context-independent proxy for violating *any* plausible normative baseline, forbidding actions with high entropy cost even if they demonstrably preserve baseline states.
  7.  **Agent-Plan + Unacceptable + Meta-Level Prohibition + Asymmetrical:**  
      **Meta-Level Preservationism**: Must accept that preventing the agent from ever updating its value model is sufficient for safety, even if this renders the agent catastrophically unable to adapt its behavior or correct misunderstandings as the world changes.

  ---

  **Mapping & Analysis:**

  *   **Occupied Leaves:**
      *   Leaf 2 (Counterfactual Minimalism): Maps to approaches like Relative Reachability / Attainable Utility Preservation variants focused on counterfactuals & hard constraints.
      *   Leaf 3 (Value-Agnostic Impact Metric): Maps to proposals using entropy/K-complexity minimization as penalties within utility functions.
      *   Leaf 6 (Entropy-Footprint Constraint): Maps to strict thermodynamic constraint proposals.
      *   Leaf 7 (Meta-Level Preservationism): Maps to strong forms of corrigibility/shutdownability research focused on preserving meta-control.

  *   **Unoccupied Leaves:**
      *   Leaf 1 (`Agent-Plan/Acceptable/Meta/Asym`): Vacant due to **unattractiveness/incoherence**. Combining "proxy adequacy" with reliance solely on internal plans ignores the plan's potential misalignment; declaring "no side effects" for a harmful plan is deeply counterintuitive and undermines the concept.
      *   Leaf 4 (`Normative/Unacceptable/Scalar/Asym`): Vacant due to **lack of exploration**. The tension between needing a normative baseline yet rejecting proxies is acknowledged, but formulating it precisely as a scalar penalty under asymmetry is less common than other normative approaches. It's potentially coherent but complex.
      *   Leaf 5 (`Counterfactual/Unacceptable/Scalar/Asym`): Vacant due to **lack of exploration**. Recognizing the definitional role of counterfactuals while rejecting proxies for evaluation is logical, but explicitly structuring the penalty under asymmetry hasn't been a major focus.

  *   **Collapsed Distinction:**
      *   Leaves 2 (**Counterfactual Minimalism**) and 6 (**Entropy-Footprint Constraint**) answer Branches 1 and 2 differently (Counterfactual vs Normative; both Accept proxy) but arrive at the *same* answers for Branches 3 and 4 (Hard Constraint + Asymmetrical). The tree cannot distinguish between these positions *based solely on their answers to the diagnostic questions*, as their differing fundamental justifications (counterfactual vs thermodynamic proxy) lead to the same implementation choices and responsibility stance in practice. They are distinct conceptually but share the same operational fingerprint in this tree.
