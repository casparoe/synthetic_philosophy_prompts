answer: |-
  Here’s a direct argument built on your premise, with no fluff and clear flags on uncertainty:

  ### Core Argument: Zoning as Performative, NIMBYism as Contradiction  
  1. **Zoning variances are illocutionary acts** (à la Austin).  
     - When a zoning board denies a variance to "preserve neighborhood character," they aren’t *describing* a pre-existing essence. They’re *performing* the act of **defining what the character is** by excluding what it "isn’t." The utterance ("This building doesn’t fit") *retroactively constitutes* the character it claims to protect. E.g., rejecting a duplex *makes* "single-family only" part of the neighborhood’s "character."  

  2. **NIMBY defenses are performative contradictions**.  
     - NIMBY groups invoke this constructed "character" as an objective, timeless fact ("This is who we are!"). But in doing so, they:  
       - **Conceal the performative origin**: They treat the character as natural, not as a product of prior exclusionary speech-acts.  
       - **Re-perform exclusion**: Defending "character" repeats the illocutionary act, further entrenching it while denying its constructedness.  
     - → This is a contradiction: They rely on a *performative* construct while insisting it’s *constative* (descriptive).  

  3. **"Right to the City" as a Negative Right Against Constitutive Speech-Acts**.  
     - Lefebvre’s "right to the city" is often framed as positive access. Your reframing:  
       - The core injustice isn’t just exclusion *from space* but subjection *to others’ constitutive utterances*.  
       - Zoning boards/NIMBYs wield illocutionary power to define "legitimate" users of space *without consent* of those affected.  
       - → The right should thus be a **negative right**: Freedom from being *defined* or *excluded* by performative fiat. You have a right not to have your urban reality retroactively constituted by others’ speech-acts.  

  ### Why This Works  
  - **Speech-act theory fits**: Zoning decisions *are* authoritative declarations ("This is residential," "This is historic"). They create facts on the ground.  
  - **Exposes NIMBY bad faith**: Their "character" defense is circular—a self-created norm weaponized as immutable truth.  
  - **Ethical leverage**: Positions exclusion as *active violence* (speech-acts that materially harm) rather than passive preservation.  

  ### Where I’m Least Sure  
  **1. The "negative right" framing’s scope**:  
     - Is resisting constitutive utterances *sufficient*? Material barriers (e.g., cost) still exist even if speech-acts vanish. Your frame risks overemphasizing discourse at the expense of political economy.  
  **2. Democratic legitimacy trade-off**:  
     - If *all* constitutive utterances are suspect, who gets to define space? Direct democracy could still yield exclusionary speech-acts (e.g., resident votes banning apartments). Your argument needs to clarify why *zoning boards’* performatives are uniquely illegitimate vs. community consensus.  
  **3. "Character" as purely retroactive?**:  
     - Sometimes aesthetics/history *are* tangible (e.g., a historic district). Your premise smartly targets *how* this is weaponized, but denying *any* descriptive element might overcorrect. Not all preservation is performative bad faith.  

  ### Is Your Premise Confused?  
  **No—it’s coherent and incisive**, but needs tightening:  
  - ✅ **Strength**: Brilliantly unmasks NIMBY rhetoric. The performative-contradiction critique is damning.  
  - ⚠️ **Risk**: Don’t overclaim. Not *all* zoning is retroactive constitution (some codifies existing uses). Focus on *variances* as key sites of performative power.  
  - 💡 **Sharpen**: Emphasize that the right isn’t against *all* regulation, but against *exclusionary speech-acts disguised as description*.  

  **Straight verdict**: Your core insight is sound and weaponizable. The "negative right" spin is provocative but needs to address material power beyond speech-acts. Where it stings NIMBYism hardest: exposing their "character" as a linguistic sleight-of-hand.**
