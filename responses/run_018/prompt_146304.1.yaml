prompt: |-
  I've been thinking about this since a long conversation with a friend who does neuropsych work, and I probably have a typo or two in here but please bear with me. I'm an ethics consultant on a neurology ward, and every few months I have to sit in a family conference and help decide whose voice counts when a patient can't speak for themselves after catastrophic brain injury or advanced dementia. Lately I've been struck by Hofstadter's idea that an "I" isn't locked inside one skull but is more like a loop or pattern that can persist in other brains, and I want to turn that into something I can actually run in about ninety minutes with distressed relatives who don't care about metaphysics. Can you write me a reusable decision procedure, in continous prose only with absolutely no headings, bullet points, bold text, or tables, that takes that distributed-self idea and makes it operational for someone without philosophy training?

  The procedure should go in seperate steps that I follow in order: first a quick factual check on whether the patient's own neural substrate still supports any self-pattern at all, then a "pattern fidelity check" to see if a close other is genuinely carrying the patient's specific preferences and reasoning style rather than projecting grief, guilt, or self-interest, then a "resonance threshold" call about whether that carried pattern is stable and specific enough to count toward medical decision authority. For each step say what kind of evidence counts as enough, where I have to stop and admit it's a value judgment dressed up as procedure, and where the answer should just be no, we don't treat the other person as carrying part of the patient's self. Apply it to three cases: an elderly Alzheimer's patient whose wife seems to channel her old preferences with eerie accuracy, a young TBI patient whose parents each carry different fragments of what he used to want and are fighting about it, and one case where the procedure tells me to honor a spouse's carried pattern even though I personally think grief has corrupted it and I don't like the answer. Also inject some specific conceptual machinery, maybe a decay curve for pattern stability over time, so this isn't just generic ethics advice I could find anywhere. Be honest about what this procedure can't do, like predicting whether the carried pattern will hold for years, resolving deep metaphysical disagreements about whether identity is literally shared, or replacing legal authority where it already exists. Keep everything in flowing paragraphs like an email, and don't ask me to look up obscure theories or cite anyone.
