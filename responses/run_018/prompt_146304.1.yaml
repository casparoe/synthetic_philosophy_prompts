answer: |-
  Here’s a reusable decision procedure in continuous prose, designed for clinical use without formal structure or jargon. Follow these steps in sequence, adapting as needed for emotional context:

  Start with the factual neural check. Look for any flicker of the patient’s old self-pattern still operating within their own brain. Don’t search for complex cognition—check for visceral reactions: does their face soften at a grandchild’s voice? Do they hum a specific song when anxious? Do they reject a food they historically hated? If you find even one consistent, distinctive behavioral echo tied to their lifelong preferences or identity, note it. If there’s absolutely nothing—no emotional resonance, no habitual gesture, not even a flinch at painful stimuli their old self would have protested—then the substrate is gone. Stop here; no external voice can reactivate an extinguished pattern. But if you see sparks—a smile at old jokes, agitation when rushed—proceed. This step avoids metaphysics: it’s about observable biology.

  Next, the pattern fidelity check. Here, you’re auditing the close other claiming to channel the patient. Probe not for grand pronouncements but micro-preferences. Ask: "What would they order at this exact diner?" "How would they react if the doctor ran 90 minutes late—apologetic or furious?" "What mundane Sunday ritual is non-negotiable?" Listen for granular, idiosyncratic details that a projector would overlook. Then stress-test: "If we told them treatment meant losing their wedding ring during transport, would they prioritize the ring or the treatment?" Watch for hesitation, generic answers ("She’d do what’s best"), or self-referential logic ("He’d want me to be happy"). Key evidence: Can they predict reactions you’ve witnessed yourself? Do third parties (longtime friends, siblings) nod in recognition? Beware grief distortion: sudden claims the patient would now want something convenient for the surrogate, or guilt-driven overcorrection ("She suffered so much, she’d choose death over this"). If answers feel scripted, inconsistent with the patient’s history, or suspiciously aligned with the surrogate’s burdens or desires, fidelity fails. This is where judgment enters—distinguishing authentic carrying from noise requires weighing patterns against decades of observed behavior. If fidelity is low, stop: projection invalidates authority.

  Finally, the resonance threshold. Does the carried pattern have sufficient stability and specificity to function as a decision-making proxy? Even with high fidelity, patterns decay if not actively reinforced. Apply a rough decay curve: if the surrogate last meaningfully interacted with the patient pre-injury/dementia—especially during a life phase irrelevant to current choices (e.g., representing college-era preferences for a 70-year-old)—discount their voice. Patterns need maintenance. Assess specificity: vague goodwill ("He was kind, he’d forgive us") isn’t enough. Can they simulate the patient’s reasoning dialect? "She’d weigh these risks numerically—always trusted data over gut feelings," or "He’d refuse this scan; hated hospitals after his mother died there." If the pattern is coherent, replicable across scenarios, and recently reinforced, it clears resonance. If fragmented or fossilized, it doesn’t. This threshold is unavoidably subjective—you’re deciding if the reconstruction is robust enough to stand in for the lost self.

  **Applied to your cases:**  
  1. **Alzheimer’s wife:** Neural check—patient still smiles at Sinatra, recoils at lima beans. Substrate present. Fidelity check—wife predicts he’d refuse the feeding tube citing his lifelong "no machines" stance, confirmed by his 40-year-old living will and his brother’s recollection. Specific, consistent. Resonance—she visits daily, reinforces patterns; her simulation aligns with documented history. Threshold met. Her voice carries weight.  

  2. **Young TBI parents:** Neural check—patient reacts to pain, no recognizable preferences. Substrate absent for complex decisions. Fidelity check—Mother carries "He’d fight any odds to walk again" (supported by rehab emails), Father carries "He’d never burden us financially" (supported by loan refusal texts). Fragmented but valid patterns. Resonance—both patterns are recent and specific, but conflict. Here the procedure stalls: neither fragment fully represents him, and fusion isn’t its job. You’d need mediation or legal arbitration. The procedure flags its limit—it identifies carriers but can’t merge them.  

  3. **The grief-corrupted spouse:** Neural check—patient has minimal awareness, no preferences detected. Substrate gone. Fidelity check—Spouse insists "She’d choose aggressive treatment," citing her "fighter" spirit. But her pre-dementia directives specified comfort-focused care, and friends recall her saying, "Don’t keep me going as a shell." Spouse’s answers feel defiant, not reflective. Yet he accurately recalls her hatred of morphine (she refused it post-surgery) and her favorite poet—micro-fidelity is high. Resonance—daily visits until recently; pattern is specific but selectively applied. Here, despite your discomfort, if micro-fidelity holds and he isn’t projecting selfish motives (e.g., financial gain), the procedure says: honor the carried pattern. Your role isn’t to overrule grief’s lens if core preferences are transmitted accurately, even if the conclusion feels wrong. The procedure accepts humans as imperfect vessels.  

  **What this can’t do:** It won’t resolve if identities literally merge—that’s poetry, not procedure. It can’t guarantee patterns endure years ahead; dementia progression or surrogate burnout may erode fidelity. It doesn’t override legal proxies or advance directives. And crucially, it can’t absolve you of judgment calls—especially when fidelity is ambiguous. Use it to map the ethical terrain, not bypass the hard work of discernment. In the fog of loss, it offers a lantern: follow the pattern, not the person, when the self scatters.
