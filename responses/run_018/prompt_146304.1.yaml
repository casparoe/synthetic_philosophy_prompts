  For the factual check, I focus on observable behavioral remnants rather than philosophical definitions - things like consistent emotional responses or preserved habits that indicate some self-pattern persists neurologically. The threshold is deliberately low: any flicker of recognizable personhood counts.

  The fidelity assessment is trickiest. I devise concrete indicators like predictive accuracy about minor preferences and consistency under stress testing. Crucially, I build in red flags for projection - like sudden preference shifts that align with the surrogate's interests. The decay curve concept (pattern degradation over time since last meaningful interaction) helps objectify this.

  For resonance, I emphasize specificity over perfection. Can the surrogate reconstruct unique decision pathways? Are there multiple independent validators? The young TBI case with conflicting parents shows how to handle fragmented patterns - we look for complementary rather than contradictory fragments.

  Throughout, I'm mindful of the constraints: no jargon, no bullet points, and explicit admission where we cross from evidence to value judgment. The controversial case (honoring the spouse despite perceived grief corruption) demonstrates procedural rigor - if fidelity checks pass objectively, personal discomfort shouldn't override.

