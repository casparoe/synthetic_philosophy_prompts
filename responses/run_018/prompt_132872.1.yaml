answer: |-
  Here’s a focused 90-minute session plan targeting **evolutionary debunking of non-naturalist normative realism via deontic modal intuitions**, designed for philosophers of science:

  ---

  ### **1. Conceptual Dependencies (20 mins)**
     *Order is critical to avoid immediate dismissal:*
     - **Start with Non-Naturalism (5 mins):**  
       Define normative realism (mind-independent moral truths) + non-naturalism (moral properties are *sui generis*, irreducible to natural/scientific properties). Contrast with naturalism. *Key: Emphasize non-natural properties' **causal inertness** (they don’t causally interact with the physical world).*
     - **The Epistemic Challenge (10 mins):**  
       Pose the *access problem*: How can we reliably track causally inert properties? Introduce the **Distinction between Origin and Justification** (Street’s "Darwinian Dilemma" framing). *Crucial: Preempt the genetic fallacy by noting that origins *can* undermine justification if they show no tracking relation.*
     - **Deontic Modality (5 mins):**  
       Define "deontic modal intuitions" (beliefs about *necessary moral constraints*: "X must not be done *regardless of consequences*"). Contrast with instrumental/utilitarian reasoning.

  ---

  ### **2. The Core Example: A Single Moral Intuition (25 mins)**
     - **Choice: Incest Prohibition**  
       *Why it works:* Cross-culturally robust, evolutionarily explicable (inbreeding avoidance), and vividly deontic ("incest is *just wrong* even if consenting, sterile, and beneficial").
     - **Required Features:**  
       - **Direct-action prohibition** (not cost-benefit): Demonstrates *categorical* "ought."  
       - **Evolutionarily transparent:** Clear selective pressure (genetic fitness).  
       - **Resists consequentialism:** Intuition persists when consequences are neutralized.  
     - **Demo Sequence:**  
       1. Elicit intuition: "Is incest always morally wrong, even with consent, contraception, and no harm?"  
       2. Present evolutionary explanation: Kin recognition mechanisms → aversion to inbreeding → moralized prohibition (e.g., Lieberman, Haidt).  
       3. Contrast with tracking non-natural truth: If evolution shaped this intuition *independently* of truth, why trust it?  

  ---

  ### **3. Predictable Misconceptions & Defusal Timing**
     - **"Genetic Fallacy!" (defuse during Origin/Justification distinction):**  
       *Response:* "This isn't *merely* about origins. It’s that the causal story *precludes a necessary tracking relation* to inert properties. If the intuition would exist regardless of truth, it can’t justify belief."
     - **"Evolutionary stories are unfalsifiable just-so stories!" (defuse when presenting evidence):**  
       *Response:* "We have empirical support (e.g., Westermarck effect, kin recognition studies). This isn’t speculation but a well-confirmed model of how *certain social intuitions* arise."  
     - **"This debunks math/logic too!" (defuse after argument is laid out):**  
       *Response:* "Math/logic are *presupposed* in scientific reasoning (including evolution) and have causal efficacy in physics/computation. Deontic morals are *causally inert and not necessary for evolution* to operate."  

  ---

  ### **4. Diagnostic End Question**
     - **Question:** *"Could this argument debunk a naturalist moral realist (e.g., a moral reductionist) in the same way it debunks a non-naturalist? Why/why not?"*  
     - *Grasped the argument:* Notes that naturalists *can* explain tracking (moral properties reduce to natural ones investigated by science).  
     - *Merely skeptical:* Assumes the argument attacks all moral realism indiscriminately.  

  ---

  ### **5. Strategic Omissions & Framing**
     - **Explicitly Exclude:**  
       - Full evolutionary game theory (mention it exists but isn’t needed for *deontic* intuitions).  
       - Reliabilist vs. process-based epistemology (frame it as a "tracking problem" in simple terms).  
       - Other metaethical targets (e.g., divine command theory).  
     - **How to State It:**  
       *"Today’s argument surgically targets non-naturalism via deontic intuitions. We’re bracketing broader debates about moral epistemology or naturalist alternatives to isolate this specific challenge. This is a *sufficient* problem for non-naturalism, not a *necessary* one for all realism."*  

  ---

  ### **Session Flow**
  1. **Intro (5 mins):** Frame the target (non-naturalism) and the debunking strategy.  
  2. **Conceptual Setup (20 mins):** Non-naturalism → causal inertness → access problem → origin/justification.  
  3. **Case Study (25 mins):** Incest intuition → evolutionary explanation → tracking failure.  
  4. **Objections & Refinements (25 mins):** Address the 3 misconceptions + Q&A.  
  5. **Synthesis & Diagnostic (10 mins):** Restate the argument’s limited scope + diagnostic question.  
  6. **Conclusion (5 mins):** Implications for non-naturalism; affirm argument’s narrowness.  

  ---

  This structure ensures philosophers of science engage the *epistemic mechanics* of the argument without metaethical baggage. By anchoring it in a concrete intuition and preempting distractions, you keep the focus on the core challenge: **causal inertness + evolutionary etiology = no tracking**.
