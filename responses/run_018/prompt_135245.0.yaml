answer: |-
  Based on your description and goals (teaching intro bio, practical impact, undergrad research feasibility), here's a breakdown and ranking of the research directions, focusing on what truly changes practice:

  **The Core Problem: Avoiding "Just-So Stories" is Paramount**

  The central, enduring legacy of the Gould-Lewontin critique isn't really about the *frequency* of spandrels vs. adaptations. It's the **methodological warning**: *Assuming* adaptation and constructing plausible narratives *without rigorous testing* leads to bad science ("just-so stories"). This is the issue that fundamentally shapes how we *do* evolutionary biology and how we should *teach* it.

  **Ranking the Research Directions:**

  1.  **Fixing Adaptationist Methodology (Most Impactful & Most Feasible for Undergrads)**
      *   **Why it Matters Most:** This addresses the core conceptual weakness Gould-Lewontin highlighted. Improving how we generate and test adaptive hypotheses prevents bad science *regardless* of whether the trait ultimately turns out to be an adaptation, a spandrel, or constrained. It's fundamental to the scientific integrity of evolutionary research.
      *   **Changes Practice:** Directly impacts how researchers design studies, frame hypotheses, collect data (e.g., comparative methods, experimental evolution, functional tests), and interpret results. It forces consideration of alternatives (like constraint, drift, exaptation) from the outset.
      *   **Tractability for Undergrads (⭐️⭐️⭐️⭐️⭐️):**
          *   **Analyzing Existing Literature:** Students can audit published studies in a specific clade or trait system. How often do papers propose adaptive hypotheses? How rigorously are they tested? What alternative explanations are considered (or ignored)? This teaches critical reading and exposes methodological patterns.
          *   **Designing Hypotheses & Tests:** Students can take a specific trait (e.g., bird beak shape, plant leaf trichomes, lizard dewlap color) and design experiments or comparative analyses to *test* a proposed adaptive function vs. a constraint-based or non-adaptive alternative. This builds critical thinking and research design skills.
          *   **Simulations:** Simple simulations can show how drift, selection, and constraint can produce similar patterns, highlighting the need for careful inference.
      *   **Upstream:** Robust methodology is the foundation for *all* other evolutionary inference, including identifying spandrels or constraints. You can't reliably identify a spandrel without first rigorously *falsifying* adaptive hypotheses.
      *   **Teaching Impact:** Directly addresses student questions ("Is this *for* something?") by teaching them *how to find out* and the pitfalls of assuming they know. Empowers them to be critical consumers of science.
      *   **Application:** Critical for accurate inference in fields like disease evolution (e.g., is a virulence factor adaptive *now*, or a legacy spandrel?), conservation genetics (identifying *truly* adaptive vs. neutral variation), and evolutionary medicine (understanding vulnerabilities that aren't simply "for" something).

  2.  **Integrating Evo-Devo & Developmental Bias (High Impact, Moderately Feasible)**
      *   **Why it Matters:** This provides the *mechanistic foundation* for constraints and spandrels. It moves beyond the "is it adapted?" question to "how does development shape the *possible* trajectories of evolution?". It resolves the "spandrels worry" by providing concrete mechanisms (e.g., developmental pathways, gene pleiotropy, allometry) that generate non-adaptive traits or channel adaptation in predictable ways. Niche construction adds another layer of non-selective influence.
      *   **Changes Practice:** Forces researchers to consider developmental pathways *first* when studying trait evolution. Explains patterns of homology, convergence, and limits to adaptation that pure adaptationism struggles with. Shifts focus towards evolvability and the origin of variation.
      *   **Tractability for Undergrads (⭐️⭐️⭐️):** More challenging than methodology, but doable.
          *   **Literature Review/Meta-analysis:** Students can survey studies on traits within a well-studied developmental model system (e.g., *Drosophila* limbs, stickleback armor, *Arabidopsis* flowering time) to catalog evidence for developmental bias shaping evolutionary outcomes.
          *   **Comparative Morphometrics:** Using image analysis software (even ImageJ), students can measure traits in related species to look for signatures of developmental constraint (e.g., allometric relationships limiting variation).
          *   **Connecting Genomics to Traits:** If genomic data is available, students can explore how pleiotropic genes (identified in databases) might constrain the evolution of associated traits in a group.
      *   **Upstream:** Provides the *how* for many spandrels/constraints. While downstream of methodology (you need good inference to identify the constraint), it offers profound explanatory power.
      *   **Teaching Impact:** Helps students understand *why* not everything is freely moldable by selection. Makes concepts like homology and body plans more mechanistic. Moves beyond the "adaptation vs. spandrel" binary.
      *   **Application:** Crucial for understanding evolutionary potential in conservation (can a species adapt quickly enough?), origins of complex traits (often built from co-opted existing modules - exaptation!), and explaining vulnerabilities in development that lead to disease or malformations.

  3.  **Empirically Testing Spandrel Frequency (Least Impactful on Practice, Least Feasible for Undergrads)**
      *   **Why it Matters Less:** While interesting, knowing the exact *percentage* of traits that are spandrels vs. adaptations is less transformative than *how* we identify either. The definition of a "spandrel" itself is often debated and context-dependent (a by-product at one level might be an adaptation at another). Focusing on frequency risks reigniting the "turf war" without solving the underlying methodological issue.
      *   **Changes Practice?** Minimal. Knowing if spandrels are 10% or 40% of traits doesn't change the fundamental need for rigorous hypothesis testing for *any* given trait. Good methodology works regardless of the frequency.
      *   **Tractability for Undergrads (⭐️):** Extremely difficult.
          *   Requires deep phylogenetic knowledge, detailed understanding of development and function for numerous traits across taxa.
          *   Defining the "universe" of traits to sample is nearly impossible.
          *   Prone to sampling bias and definitional ambiguity.
      *   **Upstream?** Downstream of both methodology and understanding mechanisms. You need the first two to even *identify* a spandrel reliably in a specific case. Estimating frequency requires solving the identification problem *first* for many cases.
      *   **Teaching Impact:** Low. Knowing a number doesn't help students evaluate specific traits or understand the process.
      *   **Application:** Negligible direct impact on medicine or conservation. Knowing how *common* spandrels are doesn't help diagnose if a *specific* trait (like a disease vulnerability) is one.

  **Defense of Ranking & Key Takeaways:**

  1.  **Methodology is Foundational & Feasible:** It tackles the core problem identified by Gould-Lewontin that still plagues evolutionary inference. It teaches students *how science should be done*, not just facts. Undergrads can meaningfully contribute to auditing literature or designing tests, building crucial skills.
  2.  **Evo-Devo Provides Mechanistic Resolution:** It doesn't just "move the goalposts"; it provides the explanatory framework *for* constraints and spandrels that Gould and Lewontin lacked. It transforms the debate from philosophical to mechanistic. While slightly harder for undergrads, focused projects on model systems are possible and highly educational.
  3.  **Frequency is a Sideshow:** Pursuing it consumes significant resources for limited payoff. It doesn't resolve the "just-so story" problem or provide new explanatory mechanisms. It's the least tractable and least relevant for changing how research is conducted or how intro bio is taught.

  **Does it Still Matter Beyond Academia? Absolutely.**

  *   **Medicine:** Misapplying adaptationist thinking can lead to errors. Assuming every aspect of human biology (or pathogen biology) is an *optimal* adaptation *for* something can mislead research into vulnerabilities (e.g., back pain, childbirth difficulties, susceptibility to certain cancers, appendix function) or pathogen traits (e.g., virulence factors that might be spandrels or constrained). Understanding constraints and exaptation is crucial.
  *   **Conservation:** Predicting how species will respond to climate change requires understanding their *evolutionary potential*. Can key traits evolve rapidly enough? This depends critically on understanding genetic variation, developmental constraints, and evolvability – concepts central to the post-spandrels/evo-devo synthesis. Assuming unlimited adaptive potential is dangerous.
  *   **Biotechnology/Bioinspiration:** Understanding how evolution *actually* tinkers with existing developmental modules (often leading to "suboptimal" but functional solutions) is more useful for biomimicry than assuming perfect optimal design.

  **Recommendation for Your Semester Project:**

  **Prioritize "Fixing Adaptationist Methodology" with an Evo-Devo Lens.**

  *   **Project Idea:** Have students select a specific, well-studied trait complex (e.g., butterfly wing patterns, mammal tooth diversity, plant defense compounds). Their project involves:
      1.  **Literature Audit:** Catalog proposed adaptive hypotheses and the strength of evidence presented (direct experimental tests? comparative correlations considering phylogeny? alternatives considered?).
      2.  **Developmental Context:** Research the known developmental mechanisms underlying these traits. Are there inherent biases or constraints?
      3.  **Propose Rigorous Tests:** Based on the audit and developmental knowledge, design specific experiments or analyses that could better test the adaptive hypotheses *or* demonstrate the role of constraint/exaptation.
  *   **Why this works:**
      *   Tackles the core methodological issue head-on.
      *   Integrates the crucial mechanistic perspective of evo-devo/constraints.
      *   Develops critical thinking, literature review, and research design skills.
      *   Feasible within a semester for motivated undergrads.
      *   Directly applicable to teaching – students see the challenges and solutions firsthand.
      *   Avoids the intractable "frequency" question while still engaging with the substance of the spandrels/constraints concept.

  This approach empowers your students to move beyond simplistic "is it *for* something?" questions and engage with the sophisticated, rigorous, and fascinating process of evolutionary inference as it's practiced today. It resolves the "historical beef" by focusing on the lasting, practical lesson: good science requires testing alternatives.
