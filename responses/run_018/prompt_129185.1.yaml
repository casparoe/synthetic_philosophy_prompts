  The user wants to know if there's a name for this specific maneuver where uncertainty functions as a "one-way gate" - blocking others' math while protecting your own. They're sharp to notice this isn't just hypocrisy or motivated reasoning; it's more structurally sophisticated. The mechanism involves strategically applying different epistemic standards.

  Hmm... this reminds me of several concepts in philosophy of science and rhetoric. First, there's "epistemic asymmetry" - applying different standards of evidence depending on whose work you're evaluating. But that's too broad. More precisely, it resembles what philosopher Neil Manson called the "precautionary paradox" - using uncertainty arguments against opponents while relying on standard models yourself. 

  The closest fit might be "selective skepticism" but that doesn't capture the bidirectional nature. Actually, the user's own phrase "epistemic one-way gate" is strikingly accurate. We could formalize that as a definition: The practice of invoking radical uncertainty to invalidate opponents' quantitative models while simultaneously exempting one's own preferred quantitative approaches from the same critique, thereby creating an asymmetrical burden of proof.

  What makes this distinct from hypocrisy is its epistemological sophistication - it's not just saying "do as I say not as I do" but constructing an entire framework where uncertainty only applies when convenient. And it's different from motivated reasoning because it's about meta-level rules rather than direct evidence selection.

  The user seems philosophically sophisticated - they've already distinguished this from simpler concepts. Their frustration is palpable; they've clearly seen this pattern repeatedly in policy debates. I should acknowledge how perceptive their observation is while giving them precise conceptual tools to name it.
answer: |-
  That's an incredibly sharp observation – you've pinpointed a specific and potent form of intellectual maneuvering common in complex policy debates, especially around climate and finance. It **does** go beyond simple motivated reasoning or hypocrisy, though it incorporates elements of both. Here's a breakdown, including potential names and definitions:

  1.  **The Core Problem:** The selective application of **Keynesian/Knightian uncertainty** (or deep uncertainty, radical uncertainty) as a *destructive weapon* against opponents' models while simultaneously using *quantitative methods* constructively for one's own proposals, shielded by the same uncertainty argument when those methods fail.

  2.  **Why it's More Than Just Hypocrisy or Motivated Reasoning:**
      *   **Hypocrisy:** Saying one thing and doing another. This *is* hypocritical, but the mechanism is more specific. It's hypocrisy *focused on the rules of evidence and the applicability of quantification itself*.
      *   **Motivated Reasoning:** Seeking evidence to support a desired conclusion. This *is* a form of motivated reasoning, but the "evidence" being manipulated is *meta-level*: it's the *epistemological status* of the models (quantifiable vs. radically uncertain) rather than the data *within* the models. The desired conclusion dictates the *type of reasoning permitted*.
      *   **Sloppy Methodology:** This implies inconsistency born of carelessness. What you describe is often highly *strategic* and *deliberate*. The inconsistency serves a rhetorical and political purpose.

  3.  **Established Names & Concepts (Close, but not perfect fits):**
      *   **Epistemic Asymmetry:** Applying different standards of evidence or proof depending on the source or conclusion. This is broad but captures the core idea of uneven rules.
      *   **Selective Skepticism:** Being highly skeptical of evidence contradicting your view while uncritically accepting evidence supporting it. This focuses more on the evidence itself than on the *applicability of the entire methodology*.
      *   **The Precautionary Paradox:** Invoking the Precautionary Principle (act despite uncertainty to avoid harm) in ways that paradoxically rely on implicit quantification of risks and benefits that the principle supposedly rejects. This is a close cousin, especially in environmental debates.
      *   **Weaponized Uncertainty:** Using uncertainty arguments primarily to stall action or discredit opponents. This captures the destructive aspect but misses the constructive use of quantification by the *same actor*.

  4.  **Defining the Specific Toggle:**
      Based on your description, the most precise term doesn't have universal recognition, but we can define it clearly:

      **Term:** **Strategic Epistemic Boundary Toggling (SEBT)** or **Instrumental Uncertainty Toggling (IUT)**

      **Definition:** The rhetorical and argumentative strategy of *strategically shifting the perceived nature of uncertainty* surrounding a complex problem (e.g., between quantifiable "risk" and unquantifiable "Keynesian uncertainty") to achieve a desired outcome. Specifically:
      *   **Weapon Mode:** Invoking deep/radical/Keynesian uncertainty to *invalidate* opponents' quantitative models (cost-benefit analyses, probability estimates, expected damage curves) by arguing the phenomena are inherently unquantifiable, rendering such models meaningless or dangerously misleading.
      *   **Shield Mode:** Employing quantitative models (carbon tax optimization, expected damage curves, probabilistic risk assessments) *constructively* to justify specific preferred policies, implicitly treating the uncertainty as manageable or quantifiable *enough* for practical decision-making. When these models fail or are challenged, reverting to the deep uncertainty argument to *excuse the failure* ("the world was just too uncertain, no model could have worked"), thus shielding the policy proposal and its underlying methodology from fundamental criticism.

      **Key Differentiators:**
      *   **Focus on Epistemic Status:** It manipulates the *level of quantification deemed permissible* (Can we assign numbers? Is probability meaningful?).
      *   **Bi-directional Asymmetry:** It uses *the same core concept* (deep uncertainty) in two opposite ways: *against* opponents' quantification and *for* one's own quantification (with an escape hatch).
      *   **Strategic Intent:** The inconsistency serves a clear purpose: blocking unfavorable analyses while enabling favorable ones, with a built-in defense mechanism.
      *   **Methodological Exemption:** One's *own* quantitative methods are exempted from the radical uncertainty critique when used constructively, only invoking it defensively.

  5.  **How it Differs from Plain Concepts:**
      *   **vs. Hypocrisy:** SEBT/IUT is a *specific type* of hypocrisy focused on the *rules of knowledge production and validation* rather than just actions vs. words.
      *   **vs. Motivated Reasoning:** While driven by desired conclusions, SEBT/IUT operates at the *meta-level of methodology*. It's motivated reasoning *about what kinds of reasoning are allowed*.
      *   **vs. Sloppy Methodology:** This is deliberate inconsistency serving a strategic purpose, not accidental carelessness. The actor is often highly sophisticated in both quantitative methods *and* uncertainty arguments.
      *   **vs. Genuine Uncertainty Wrestling:** A sincere analyst grappling with deep uncertainty might sometimes use quantification tentatively *and* acknowledge its limitations robustly. SEBT/IUT is characterized by the *asymmetry* and *strategic intent* in how uncertainty arguments are deployed *against others* vs. how quantification is used *by oneself*.

  **In essence:** You've identified a sophisticated form of **epistemological jujitsu**. Actors leverage the profound philosophical truth of Keynesian uncertainty (some things genuinely resist quantification) not as a humble acknowledgment of complexity, but as a *tactical tool*. They use it to **disarm** opponents' analyses (rendering them "invalid") while **armoring** their own preferred analyses (allowing quantification but immunizing it against failure via the same uncertainty argument). It exploits the genuine difficulty of modeling complex systems to create an argumentative asymmetry favoring one's own policy preferences. It's a powerful, and often intellectually dishonest, maneuver in high-stakes debates where quantification is both essential and inherently limited. Naming it ("Strategic Epistemic Boundary Toggling" or "Instrumental Uncertainty Toggling") helps expose the mechanism.
