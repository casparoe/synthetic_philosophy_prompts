  i've been arguing with my friend about Keynes's philosophical writing on probablity — the part where he thinks some future events aren't just risky with unknown odds, but genuinely open-ended in a way that doesn't allow numbers at all, and where piling on more evidence can actually weaken your confidence instead of strengthening it. my friend thinks this kills all quantitative planning, but then we started noticing a pattern in actual climate and economic debates that seems to twist this idea.

  people invoke this deep-uncertainty concept to dismiss cost-benefit models they don't like — saying you can't attach probabilities to ecosystem collapse or long-tail financial crises. but then the very same people propose their own policies using exactly those kinds of calculations, with optimal carbon taxes and expected damage curves and all. and if the numbers turn out wrong, they don't blame the model; they say the environment was just too uncertain for any model to work. so the uncertainty idea acts like a one-way gate: it blocks other people's math but protects your own. is there an established name for this specific toggle? it feels near motivated reasoning, but that's usually about reaching for whatever supports your conclusion. here the mechanism is more specific — using an epistemic boundary as both weapon and shield, with different rules about when it applies. if there's no term, can you name and define it, and say exactly how it differs from plain hypocrisy or from just being sloppy about methodology?
