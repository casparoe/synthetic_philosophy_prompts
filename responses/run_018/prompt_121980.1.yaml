prompt: |-
  I sit on the allocation committee of a mid-sized health and development fund, and I draft its rulings. When two applications are both fundable and the money covers only one, we have to record whether the choice between them is settled by the reasons we already accept or is a hard one that we close by judgment or by chance. Our verdict so far takes one of three forms: rank them and fund the better one; decline to rank and decide by judgment; decline to rank and randomize. The precedents, with the reasons minuted:

  1. A malaria-net distribution trial against a philosophy-in-schools programme, both large and multi-year: declined to rank, decided by judgment, funded the nets, and minuted that either choice would have been permissible.
  2. Two deworming proposals in different countries, same outcome metric, 4.2 against 5.1 units per dollar, intervals not overlapping: ranked.
  3. Two cash-transfer proposals, same metric, best estimates differing by about a third, intervals overlapping: ranked by expected value, minuting that our uncertainty was ignorance rather than incommensurability.
  4. Two proposals in the same field whose estimates differed by a few tenths of a percent, far inside measurement error: deadlocked three to three and never resolved.
  5. Two small pilots in different domains, a poetry workshop and a bicycle-repair workshop: declined to rank, randomized.

  Last quarter the fund adopted a new instrument: a single cardinal scale of wellbeing equivalents, fitted to survey data, that assigns one number to any programme's expected outcomes with a stated resolution of roughly plus or minus 0.2 units. It was adopted as a common reporting metric; no one recorded whether it is meant to govern allocation.

  The pair I have to move on Thursday: a mental-health programme at 6.1 units and a vocational-training programme at 7.4 units. Different kinds of benefit, as in case 1, but now separated by many times the resolution of a shared scale, as in case 2.

  Please give me, in this order:

  1. Candidate rules, about 150 words: the distinct rules that fit all five precedents and could be generating our verdicts.
  2. What each predicts here, about 120 words: each rule's ruling on the new pair, where they diverge, and whether any rule's prediction turns on the unresolved status of the new scale.
  3. Recommendation, about 100 words: the ruling I should move for if the aim is consistency with our own record, with the closest analogue among the precedents identified.
  4. What we would be committing to, about 80 words: the substantive principle each available ruling would commit the fund to, whichever way we go.
  5. The case that would settle it, about 80 words: the further pair of applications whose ruling would discriminate between the rules that agree on this one, and what each result would tell us.
reasoning: |-
  Hmm, the user is on an allocation committee for a health and development fund and needs help with a decision-making framework. They've described five precedents where their committee decided between two fundable applications when only one could be funded. Now they have a new pair to decide on: a mental health program at 6.1 units and vocational training at 7.4 units on a new cardinal scale.

  Looking at the precedents: In case 1 (malaria nets vs philosophy), they declined to rank and used judgment. In case 2 (deworming with clear metric difference), they ranked. Case 3 (cash transfers with overlapping intervals) they still ranked by expected value. Case 4 (tiny difference within error) deadlocked. Case 5 (different domains) they randomized.

  The key new element is this adopted cardinal scale with ±0.2 resolution. The difference here (1.3 units) is huge compared to the resolution, similar to case 2 but with different benefit types like case 1.

  I need to provide several candidate rules that fit all precedents. Rule A could be about statistically significant differences requiring ranking, Rule B about commensurability allowing judgment below a threshold, and Rule C combining scale differences with benefit-type similarity.

  For the current case: Rule A would rank vocational training higher. Rule B might still see them as incommensurable despite the large gap. Rule C would likely rank them due to the scale difference.

  I'll recommend ranking vocational training higher as most consistent with case 2 and the scale's adoption. This commits to cardinal comparability across domains when differences exceed resolution. To test between rules, we'd need a case with modest scale difference where benefit types differ - that would reveal if we truly prioritize scale over domain or not.

  The user needs this structured into five specific sections: candidate rules, predictions for current case, recommendation, commitments, and test case.
answer: |-
  Here’s your analysis structured as requested:

  ### 1. Candidate Rules (150 words)
  Three rules fit all precedents:  
  **Rule A (Significance Threshold):** Rank if metric differences exceed *both* the scale’s resolution *and* a statistical threshold (e.g., non-overlapping intervals). Otherwise, decline to rank (judgment/randomize). Case 1 (different domains) and 5 (small pilots) fall below thresholds; Case 2/3/4 use the metric but only Case 2/3 meet significance.  
  **Rule B (Commensurability Primacy):** Rank only if benefits are *commensurable* (same outcome type/domain, per Case 2/3). Else, decline to rank regardless of metric gap (Case 1/5). Case 4’s deadlock implies unresolved commensurability despite shared metric.  
  **Rule C (Scale-Domain Hybrid):** Rank if the metric gap meaningfully exceeds resolution *unless* benefits are incommensurable (Case 1). Case 2/3/5 gaps exceed resolution; Case 4 does not. Case 5’s randomization is anomalous but fits if "small pilots" imply unresolved commensurability.  

  ### 2. Predictions for Current Pair (120 words)  
  - **Rule A:** Predicts *ranking* (vocational training at 7.4 > mental health at 6.1). Gap (1.3) dwarfs resolution (±0.2) and resembles Case 2’s non-overlapping gap. Ignores domain difference.  
  - **Rule B:** Predicts *decline to rank* (judgment/randomize). Different benefit types (like Case 1) make them incommensurable, voiding the scale.  
  - **Rule C:** Predicts *ranking*. Metric gap (6.5x resolution) is decisive despite domain difference (unlike Case 1’s large gap but no scale).  
  **Turn on scale status?** Rule A/C *require* the scale to govern allocation (unresolved). Rule B ignores it if domains differ.  

  ### 3. Recommendation (100 words)  
  Move to **rank vocational training higher**, funding it. This aligns with **Case 2** (deworming): clear metric separation (>6x resolution) outweighs domain differences. Precedents prioritize measurable gaps when unambiguous (Cases 2/3), and the scale’s adoption—though not explicit—makes this analogous. Case 1’s "permissible either way" reflected *no* scale; here, the scale provides decisive separation. Reject Rule B: Case 5 randomized due to trivial scale differences, not domain mismatch.  

  ### 4. Commitments (80 words)  
  - **Ranking:** Commits to the cardinal scale governing cross-domain comparisons when differences exceed resolution (e.g., 1.3 > ±0.2). Implies wellbeing units are fungible across mental health/vocational training.  
  - **Declining to rank:** Commits to fundamental incommensurability between these domains, rendering the scale advisory. Prioritizes qualitative judgment even with large quantitative gaps.  
  - **Randomizing:** Commits to strict agnosticism—no principled basis for choice exists.  

  ### 5. Case to Settle Divergence (80 words)  
  **Test Pair:** A sanitation project (7.0 units) vs. a democracy program (7.1 units), differing in domain but gap (0.1) within resolution (±0.2).  
  - **If ranked:** Favors Rule A (metric governs if domains *can* be compared).  
  - **If declined/judgment:** Favors Rule B (domain mismatch voids metric).  
  - **If randomized:** Favors Rule C (trivial gap + domain difference triggers agnosticism). Rule C would randomize; Rule A might rank; Rule B would decline regardless of gap.  

  ---  
  **Key Analogy:** This case is *Case 2* (metric gap dominates) applied cross-domain via the new scale. Rule B’s reliance on Case 1 ignores the scale’s introduction.
