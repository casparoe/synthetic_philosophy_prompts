answer: |-
  This is an exceptionally sharp observation of a recurring epistemic trap. While no single established term perfectly captures this *specific* configuration, we can synthesize concepts from critical theory, philosophy of science, and sociology. Here's a breakdown:

  1.  **Closest Established Concepts & Relations:**
      *   **"The Double Bind" (Gregory Bateson / Critical Theory):** This describes a situation where conflicting demands create a no-win scenario. Here, the system demands quantifiable justification *and* criticizes the methods used to provide that very justification for non-quantifiable goals. Inclusion becomes proof of exclusion because the mode of inclusion violates the (often unstated) norms of the excluded category. *Confidence: High (80%) - Strong structural similarity.*
      *   **Epistemic Injustice / Hermeneutical Injustice (Miranda Fricker):** The system's dominant framework (quantification) marginalizes alternative ways of knowing (e.g., qualitative, long-term, institutional). The need for elaborate models to justify non-quantifiable interventions reflects the *lack* of shared hermeneutical resources within the system to understand them on their own terms. The accommodation requires translation into the dominant (and distorting) epistemic language. *Confidence: High (85%) - Directly addresses the knowledge-power dynamic.*
      *   **Performativity of Exclusion (inspired by J.L. Austin/Judith Butler):** The act of "including" the outlier through special epistemic machinery *performs* its status as an exception, thereby reinforcing the norm (quantifiability) and the system's structure. The act of accommodation *enacts* the exclusion it purports to overcome. *Confidence: Moderate (70%) - Requires applying performativity specifically to epistemic inclusion/exclusion.*
      *   **"The Exception Proves the Rule" (Misinterpreted Trope):** While often used illogically, in its original legal sense ("the exception *tests* the rule"), it has a resonance. The *existence* of the elaborate justification *tests* and *confirms* the strength of the default quantifiable rule by highlighting the extraordinary effort needed to circumvent it. *Confidence: Moderate (65%) - The critic's move often feels like this, but the original meaning is distinct.*
      *   **Tokenism:** This is related but distinct. Tokenism involves symbolic inclusion to deflect criticism while maintaining exclusionary structures. Here, the inclusion might be *substantive* (real funding/resources) but *pathologized* by the system's logic. The elaborate justification marks it as "token" *epistemically* rather than necessarily materially. *Confidence: High (80%) - Shares the dynamic of using inclusion to mask/systematize exclusion, but focuses on epistemic justification.*

  2.  **Coining a Precise Term: "Paradigm Entrapment" (or "Epistemic Paradigm Entrapment")**

      *   **Definition:** A systemic dynamic within a knowledge community or funding regime where the dominant epistemic paradigm (e.g., quantification, short-term measurability) structurally marginalizes alternative approaches, goals, or forms of knowledge. Crucially, attempts to *accommodate* these alternatives *within* the system require translating them into the dominant paradigm's logic and justificatory machinery. This very process of translation and accommodation is then interpreted not as successful inclusion, but as evidence of the paradigm's exclusionary power and the fundamental illegitimacy or exceptional status of the alternative within the system's core logic. The accommodation confirms the rule by demonstrating the rule's necessity for validation.
      *   **Boundary Conditions:**
          *   Requires a dominant, well-defined epistemic paradigm within a system (e.g., quantification in EA, RCTs in certain development circles, specific metrics in academia).
          *   Requires the existence of legitimate goals/interventions/knowledge that are difficult or impossible to justify *solely* within that dominant paradigm.
          *   Requires that the system makes *some* attempt (even if reluctant or minimal) to accommodate these outliers.
          *   Requires that the accommodation necessitates significant epistemic effort *within the dominant paradigm* (e.g., complex modeling, novel metrics, exceptional arguments) to achieve validation.
          *   The critique hinges on interpreting this *need for exceptional justification* as proof of systemic exclusion, *not* merely on the *amount* of resources allocated.
      *   **Why this term?** "Paradigm" (Kuhnian) captures the dominant framework. "Entrapment" reflects the no-win situation: the alternative is either excluded outright or included only by submitting to the very framework that marginalizes it, thereby reinforcing that framework's dominance and the alternative's exceptional status.

  3.  **Relation to Confirmation Bias:**
      The critic's interpretation exhibits confirmation bias – they interpret ambiguous evidence (the need for special justification) as strongly confirming their prior belief (the system is exclusionary). However, "Paradigm Entrapment" goes beyond individual cognition. It describes a *systemic structure* that generates this specific ambiguous evidence and makes this biased interpretation particularly compelling and difficult to refute within the logic of the system. The bias is *enabled* and *amplified* by the systemic dynamic.

  **Confidence Levels & Least Certain Distinction:**

  *   **Overall Analysis & Synthesis:** **85% Confident.** The description of the dynamic and its relation to established concepts like double binds and epistemic injustice is robust.
  *   **Coining "Paradigm Entrapment":** **75% Confident.** The term feels accurate, but its novelty means it hasn't been tested in wider discourse. The boundary conditions help define it precisely.
  *   **Least Certain Distinction:** The precise boundary between **"Paradigm Entrapment" and sophisticated Tokenism**.
      *   *Why?* If the "accommodation" is purely performative, minimal, and not intended to substantively support the outlier goal beyond silencing critics, it leans heavily towards tokenism. If the accommodation involves significant *substantive* resources but requires the outlier to justify itself in alien terms, it's Paradigm Entrapment. The line can be blurry in practice. Is the elaborate modeling a genuine (if flawed) attempt at integration, or is it a deliberate hurdle designed to minimize *real* inclusion? Paradigm Entrapment assumes the system is *attempting* substantive inclusion on its own terms, but those terms are inherently exclusionary for the outlier. Tokenism assumes bad faith or purely symbolic inclusion. Discerning intent or systemic effect here is often the crux of the disagreement between critic and defender. *Confidence in drawing this line sharply: 60%.*

  In essence, you've identified a powerful form of systemic epistemic bias where the system's tools for self-correction become instruments for reinforcing its flaws. "Paradigm Entrapment" captures the Catch-22: inclusion requires submission to the logic that defines you as excludable.
