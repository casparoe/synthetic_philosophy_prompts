prompt: |-
  Im working on whether 'Western values' is a coherent philosophical category or just a rhetorical boundary-object people deploy in thier own contexts. Before I read more I want the full spec for what an adequate account of this phrase has to deliver.

  Write the desiderata list: the usage-cases it must explain (diplomatic speeches, immigration rhetoric, internal Western self-critique), the distinctions it cant collapse (descriptive vs normative, plural vs singular, geographic vs civilizational), and the tensions it needs to survive (being universal and particular at once). For each give the motivating case and flag any pair that looks jointly unsatisfiable. Then briefly score three approaches against it: the civilizational-inheritance view, the liberal-proceduralist view, and a boundary-object view borrowed from STS.

  No bibliography or citations needed — I just want the criteria and the scoring logic.

  After the prose, give me a table with columns: desideratum | motivating_case | hard_or_negotiable | biggest_threat. Then a JSON object with fields: approach_name, overall_fit, fatal_desideratum, one_line_reason.
reasoning: |-
  We are constructing a list of desiderata for an adequate account of "Western values". The account must:

  1. **Explain key usage-cases**:
     - Diplomatic speeches: e.g., when Western leaders invoke shared values to justify alliances or actions.
     - Immigration rhetoric: e.g., when politicians or groups use "Western values" to set boundaries for inclusion/exclusion.
     - Internal Western self-critique: e.g., when critics within Western societies use the term to challenge their own societies (e.g., failures to live up to these values).

  2. **Respect critical distinctions**:
     - Descriptive vs normative: The term is used both to describe what is (or has been) and to prescribe what ought to be.
     - Plural vs singular: Sometimes it's treated as a monolithic set, sometimes as a collection of diverse (even conflicting) values.
     - Geographic vs civilizational: It is tied to a region (the West) but also to a cultural/civilizational heritage that may extend beyond strict geography.

  3. **Handle inherent tensions**:
     - Universal and particular: Claimed as universal (e.g., human rights) but also as a particular heritage of the West.

  We note potential joint unsatisfiability: 
     - The tension between universal and particular might be hard to reconcile. If Western values are universal, why are they Western? If they are particular, why should they be imposed?

  Then we evaluate three approaches:

  1. **Civilizational-inheritance view**: Western values as the product of a historical trajectory (Greco-Roman, Judeo-Christian, Enlightenment, etc.).
  2. **Liberal-proceduralist view**: Western values as centered on liberal democracy, individual rights, rule of law, and procedural fairness.
  3. **Boundary-object view** (from STS): "Western values" as a flexible concept that different groups use for their own purposes, without a fixed essence.

  Scoring logic: For each approach, we assess overall fit (how well it meets the desiderata) and identify a fatal desideratum (if any) that it fails, with a one-line reason.

  Now, we build the tables and JSON.

  First, the table of desiderata:

  | Desideratum | Motivating Case | Hard or Negotiable | Biggest Threat |
  |-------------|-----------------|-------------------|---------------|
  | Explain usage in diplomatic speeches | E.g., NATO speeches about defending shared values | Hard | Overly flexible accounts may fail to explain why the term has persuasive power |
  | Explain usage in immigration rhetoric | E.g., debates about cultural assimilation | Hard | Accounts that are too descriptive may not capture the normative boundary-drawing |
  | Explain usage in internal self-critique | E.g., criticizing Western hypocrisy on human rights | Hard | Accounts that are too rigid may not allow for self-critique that uses the same term |
  | Maintain descriptive vs normative distinction | The term can be used to describe historical practices and also as an ideal | Hard | Collapsing to one side (e.g., only normative) would miss critical usages |
  | Maintain plural vs singular distinction | Sometimes it's "values" (plural) and sometimes it's a unified "Western civilization" | Negotiable | Over-emphasis on pluralism might undermine the rhetorical power of unity |
  | Maintain geographic vs civilizational distinction | The West is both a place and an idea (e.g., Australia as Western but geographically East) | Negotiable | Conflation may lead to excluding non-geographic Western societies or including non-Western ones |
  | Resolve universal vs particular tension | Human rights as both a Western invention and universal aspiration | Hard | Failure leads to charges of imperialism or parochialism |

  Now, the JSON evaluation of the three approaches:

  Approach 1: Civilizational-inheritance view
  - Overall fit: Moderate
  - Fatal desideratum: Maintaining the plural vs singular distinction (or the universal vs particular tension)
  - One-line reason: Tends to present a singular, historical trajectory that may not account for internal pluralism and struggles to reconcile the universal claims without appearing hegemonic.

  Approach 2: Liberal-proceduralist view
  - Overall fit: High
  - Fatal desideratum: Explaining internal self-critique (or maintaining plural vs singular)
  - One-line reason: By focusing on current liberal norms, it may not fully account for the historical depth and internal diversity (e.g., socialist or religious critiques that also claim Western heritage).

  Approach 3: Boundary-object view
  - Overall fit: High for explanatory power, but low for normative coherence
  - Fatal desideratum: Maintaining descriptive vs normative distinction (or the universal vs particular tension)
  - One-line reason: It explains the usage in different contexts but fails to provide a stable basis for the normative claims or to resolve the universal/particular tension.

  We structure the JSON as an array of objects:

  [
    {
      "approach_name": "Civilizational-inheritance view",
      "overall_fit": "Moderate",
      "fatal_desideratum": "Resolve universal vs particular tension",
      "one_line_reason": "Presents a singular historical trajectory that struggles to reconcile universal claims without hegemony."
    },
    {
      "approach_name": "Liberal-proceduralist view",
      "overall_fit": "High",
      "fatal_desideratum": "Maintain plural vs singular distinction",
      "one_line_reason": "Focus on current liberal norms may overlook historical depth and internal diversity of Western traditions."
    },
    {
      "approach_name": "Boundary-object view",
      "overall_fit": "High for descriptive, Low for normative",
      "fatal_desideratum": "Maintain descriptive vs normative distinction",
      "one_line_reason": "Explains contextual usage but fails to ground normative claims or resolve universal/particular tension."
    }
  ]

  Note: The boundary-object view might be the most flexible for explaining the usage cases, but it does not provide a coherent account of what the values are, which is part of the desiderata (we need to account for the distinctions and tensions). Hence, it might score high on explaining the usage cases but low on the other criteria.

  We now write the prose accordingly.
answer: |-
  ### Desiderata for an Adequate Account of "Western Values"  
  An adequate account of the phrase "Western values" must deliver explanatory power across three domains, preserve critical distinctions, and navigate inherent tensions. Below is the desiderata list, followed by evaluations of three theoretical approaches.  

  #### **Desiderata List**  
  1. **Explain Key Usage-Cases**  
     - **Diplomatic speeches**: Must explain how the term unifies diverse nations (e.g., NATO solidarity against authoritarianism).  
     - **Immigration rhetoric**: Must account for exclusionary boundary-drawing (e.g., "assimilation to Western values" in populist discourse).  
     - **Internal Western self-critique**: Must clarify how the term fuels introspection (e.g., condemning Western hypocrisy on human rights).  

  2. **Preserve Critical Distinctions**  
     - **Descriptive vs. Normative**: Cannot collapse historical reality (e.g., colonial violence) with aspirational ideals (e.g., liberty).  
       *Motivating case*: Debates about slavery’s role in Western development vs. Enlightenment abolitionism.  
     - **Plural vs. Singular**: Must accommodate both a unified "civilizational core" (e.g., shared legal traditions) and internal diversity (e.g., secular vs. religious values).  
       *Motivating case*: Tension between universal human rights (singular) and national exceptions (plural, e.g., death penalty in the US).  
     - **Geographic vs. Civilizational**: Must distinguish physical "West" (e.g., Europe/North America) from ideological diffusion (e.g., Japan adopting liberalism).  
       *Motivating case*: Australia as geographically non-Western but culturally aligned.  

  3. **Resolve Core Tensions**  
     - **Universal-Particular Tension**: Must reconcile claims that these values are both uniquely Western *and* universally applicable (e.g., human rights).  
       *Joint unsatisfiability risk*: Universalism implies global validity, undermining the West’s "ownership"; particularism risks relativism, weakening universal claims.  

  #### **Evaluation of Three Approaches**  
  1. **Civilizational-Inheritance View**  
     - *Core claim*: Western values stem from a historical lineage (Greco-Roman, Judeo-Christian, Enlightenment).  
     - **Strengths**: Explains diplomatic rhetoric (shared heritage) and geographic/civilizational distinctions (historical diffusion).  
     - **Fatal flaw**: Fails the universal-particular tension (frames values as Western "property," undermining universalism) and internal critique (overlooks exclusionary historical practices).  

  2. **Liberal-Proceduralist View**  
     - *Core claim*: Western values are neutral procedures (democracy, rule of law, human rights) detached from cultural origins.  
     - **Strengths**: Excels in diplomatic usage (procedural unity) and normative/descriptive distinction (aspires to ideal norms).  
     - **Fatal flaw**: Struggles with plural/singular distinction (ignores non-liberal Western traditions like communitarianism) and immigration rhetoric (fails to explain cultural boundary-drawing beyond procedures).  

  3. **Boundary-Object View (STS-Inspired)**  
     - *Core claim*: "Western values" is a fluid concept adapted contextually (e.g., a "tool" for inclusion/exclusion).  
     - **Strengths**: Best explains all usage-cases (diplomacy, immigration, self-critique) and plural/singular flexibility.  
     - **Fatal flaw**: Collapses descriptive/normative and universal/particular distinctions (denies coherence, rendering values rhetorically hollow).  

  ---

  ### **Desiderata Table**  
  | Desideratum                     | Motivating Case                                  | Hard/Negotiable | Biggest Threat                          |  
  |---------------------------------|--------------------------------------------------|-----------------|-----------------------------------------|  
  | Diplomatic speeches usage       | NATO unity against authoritarian threats         | Hard            | Overly fluid definitions (e.g., boundary-object) |  
  | Immigration rhetoric usage      | Populist demands for cultural assimilation       | Hard            | Proceduralist detachment from culture   |  
  | Internal self-critique usage    | Critiques of Western human rights violations     | Hard            | Civilizational heritage’s exclusionary past |  
  | Descriptive vs. normative       | Slavery vs. Enlightenment abolitionism           | Hard            | Boundary-object collapsing the two      |  
  | Plural vs. singular             | Universal human rights vs. national exceptions   | Negotiable      | Liberal-proceduralist homogenization    |  
  | Geographic vs. civilizational   | Australia as "Western" despite location          | Negotiable      | Civilizational view’s geographic blurring |  
  | Universal-particular tension    | Human rights as Western-born but global          | Hard            | All approaches (jointly unsatisfiable)  |  

  ---

  ### **Approach Evaluations (JSON)**  
  ```json  
  [  
    {  
      "approach_name": "Civilizational-inheritance view",  
      "overall_fit": "Low",  
      "fatal_desideratum": "Universal-particular tension",  
      "one_line_reason": "Frames values as Western-exclusive, undermining universal claims while ignoring internal diversity."  
    },  
    {  
      "approach_name": "Liberal-proceduralist view",  
      "overall_fit": "Medium",  
      "fatal_desideratum": "Plural vs. singular distinction",  
      "one_line_reason": "Overemphasizes procedural unity, neglecting non-liberal Western traditions and cultural boundaries."  
    },  
    {  
      "approach_name": "Boundary-object view",  
      "overall_fit": "High for usage, Low for coherence",  
      "fatal_desideratum": "Descriptive vs. normative distinction",  
      "one_line_reason": "Reduces values to contextual rhetoric, eroding normative authority and universal-particular balance."  
    }  
  ]  
  ```  

  **Scoring Logic**:  
  - **Civilizational view** fails universal-particular tension (its historical particularity clashes with universal aspirations).  
  - **Liberal-proceduralist view** falters on plural/singular distinction (procedures are presented monolithically).  
  - **Boundary-object view** explains all usage-cases but collapses distinctions, making normative claims indefensible.  
  **Joint unsatisfiability**: The universal-particular tension resists full resolution; any account prioritizing one side weakens the other.
