answer: |-
  ### Operationalized Genocide Tagging Framework Based on Lemkin's Broader Definition  
  **Goal**: Consistent annotation by non-experts, flagging divergence between UN Convention (physical-biological) and Lemkin's framework (cultural-political).  

  ---

  #### **STEP-BY-STEP DECISION TREE**  
  **Time Limit**: Each step ≤5 minutes. Escalate ambiguities to reviewer.  
  **Output Tags**: `UN Genocide`, `Lemkin Genocide`, `Partial/Total`, `Divergence Flag`, `Escalation Needed`.  

  ---

  #### **I. GROUP IDENTIFICATION**  
  **Question**: *"Is the target a collective with shared identity (national, ethnic, racial, religious, cultural, or political)?"*  
  - **Yes**: Proceed to II.  
  - **No**: Stop. Tag `Not Genocide`.  
  - **Maybe**: Flag hybrid/contested identities (e.g., "mixed-ethnicity activists") → **Escalate to reviewer**.  
  **Test Sentence**: *"The victims were targeted based on their shared identity as [X], not individual actions."*  
  **Judgment Call**: Defining group boundaries when identities overlap or are imposed by perpetrators.  

  ---

  #### **II. INTENT TO DESTROY**  
  **Question**: *"Is there evidence the perpetrator intended to destroy the group (in whole/part) AS A GROUP?"*  
  - **Yes**: Proceed to III.  
  - **No**: Stop. Tag `Not Genocide`.  
  - **Maybe**: Ambiguous intent (e.g., "economic reforms" masking targeting) → **Escalate to reviewer**.  
  **Test Sentence**: *"Perpetrator policies/statements explicitly sought to eliminate [Group]’s existence."*  
  **Judgment Call**: Inferring intent from patterns (e.g., systemic neglect, coded language).  

  ---

  #### **III. ACTS OF DESTRUCTION**  
  **Branch A: UN Convention (Physical-Biological)**  
  **Question**: *"Did the perpetrator commit: killing, bodily harm, deliberate life-threatening conditions, birth prevention, or child transfer?"*  
  - **Yes**: Tag `UN Genocide` → Proceed to IV.  
  - **No/Mostly No**: Proceed to Branch B.  
  **Test Sentence**: *"Mass graves of [Group] members were found near state-run facilities."*  

  **Branch B: Lemkin Framework (Cultural-Political)**  
  **Question**: *"Did the perpetrator systematically: suppress language/religion, destroy institutions (schools/temples/archives), erase cultural heritage, or dismantle political autonomy?"*  
  - **Yes**: Tag `Lemkin Genocide` → Proceed to IV.  
  - **No**: Stop. Tag `Not Genocide`.  
  **Test Sentence**: *"State agents burned sacred texts and replaced local schools with assimilation programs."*  

  ---

  #### **IV. SCALE OF DESTRUCTION**  
  **Question**: *"Was the destruction aimed at the ENTIRE group (total) or a SUBSTANTIAL segment (partial)?"*  
  - **Total**: Tag `Total`.  
  - **Partial**: Tag `Partial`.  
  - **Unclear**: → **Escalate to reviewer**.  
  **Judgment Call**: Defining "substantial" (e.g., regional vs. global eradication).  

  ---

  #### **V. DIVERGENCE & ESCALATION CHECKS**  
  - **Flag Divergence**: If `UN Genocide = No` but `Lemkin Genocide = Yes` → Tag `Divergence: Cultural-Political Without Physical-Biological`.  
  - **Escalate**:  
    - Contested group labels (e.g., two survivor groups dispute classification).  
    - Ambiguous evidence in Steps I-III.  
    - Uncertainty in intent/scale (all "Maybe" paths).  

  ---

  ### **APPLICATION TO TEST CASES**  
  #### **Case 1: State-Induced Famine ("Economic Reform")**  
  1. **Group**: Peasant farmers of Ethnic Minority X → *Yes*.  
  2. **Intent**: Policies confiscated land/food while exporting crops; speeches called group "backward" → *Yes* (inferred).  
  3. **UN Branch**: Created "conditions to destroy" (starvation) → `UN Genocide = Yes`.  
  4. **Lemkin Branch**: Not needed (UN = Yes), but cultural suppression noted.  
  5. **Scale**: Regional → `Partial`.  
  6. **Divergence**: None (both frameworks concur).  
  **Judgment Call**: Intent inferred from disproportionate impact vs. "reform" claims.  

  #### **Case 2: Religious School/Archive Destruction (Minimal Killing)**  
  1. **Group**: Religious Minority Y → *Yes*.  
  2. **Intent**: State decrees: "Eliminate superstition through modern education" → *Yes*.  
  3. **UN Branch**: No killing/bodily harm → `UN Genocide = No`.  
  4. **Lemkin Branch**: Systematic razing of schools/libraries → `Lemkin Genocide = Yes`.  
  5. **Scale**: National → `Total`.  
  6. **Divergence**: Flagged (`UN:No / Lemkin:Yes`).  
  **Judgment Call**: "Systematic" threshold met via coordinated state actions.  

  ---

  ### **FRAMEWORK LIMITATIONS**  
  1. **Unresolved by Procedure**:  
     - **Contested Labels**: Survivor communities disagree → Escalate, do NOT override.  
     - **Hybrid Identities**: Perpetrator-defined vs. self-identified groups → Escalate.  
     - **Intent Ambiguity**: Structural violence vs. explicit policy → Escalate.  
  2. **Misfire Risks**:  
     - Over-tagging dissent suppression as "political genocide."  
     - Under-tagging slow-onset cultural erosion.  
  3. **Critical Escalation Points**:  
     - Step I ("Maybe" groups).  
     - Step II (masked intent).  
     - Step IV ("substantial" destruction).  

  **Design Principle**: Annotators **flag divergence and uncertainty**; reviewers resolve disputes. Average annotation time: 15-20 mins/case.
