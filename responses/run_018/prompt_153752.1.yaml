  Okay, let me unpack this complex methodological problem step by step. The user describes a fascinating asymmetry in how historians apply base-rate reasoning to imperial collapse cases. When empires with certain crisis indicators collapse, it confirms the reference class; when they survive, scholars retroactively exclude them by claiming they must have had hidden resilience factors. 

  Hmm... this feels like a sophisticated twist on several known methodological pitfalls. First, I recall Popper's critique of immunization strategies - but here it's applied to statistical reference classes rather than singular theories. The user is right that this isn't just narrative adjustment; it's sample manipulation preserving the base rate. 

  Let me mentally scan relevant concepts. Confirmation bias comes close but is too broad. The prosecutor's fallacy might relate but doesn't capture the asymmetry. Ah! The Texas sharpshooter fallacy fits partially - but shoots at different targets for survivors vs collapses. 

  What's distinct here is how the burden of proof shifts: survivors must prove they belong while failures get grandfathered in. It's like a heads-I-win-tails-you-lose setup for reference classes. I should emphasize how this differs from legitimate historical refinement - say when newly discovered archives reveal objective exclusion criteria that apply equally to all cases.

  The user's sharp observation about directional boundary-tightening deserves a precise label. "Asymmetric reference-class immunization" seems apt - it combines the statistical manipulation with the one-sidedness. Need to explicitly distinguish it from proper historiographical practice where exclusion criteria are outcome-independent, like when we discover pre-existing factors through documents rather than post-hoc survival.
answer: |-
  Your observation captures a sophisticated methodological flaw that intersects forecasting, philosophy of science, and comparative history. While no single term perfectly describes this *specific* asymmetry, it is a **compound error** combining known concepts. I propose **"Asymmetric Reference-Class Immunization" (ARCI)** as a precise coinage, with the following conceptual mapping:

  ---

  ### **Core Components & Distinctions**
  1. **Base Problem**: *Ad Hoc Reference-Class Reshuffling*  
     (General issue: manipulating the sample to preserve a conclusion).  
     **Distinction**: ARCI is *outcome-contingent* and *directional*—only survival triggers reclassification.

  2. **Philosophical Mechanism**: *Immunization Against Falsification* (Popper)  
     (Protecting a theory from disconfirmation).  
     **Distinction**: ARCI operates at the *reference-class level* rather than the causal theory itself. It preserves the *statistical regularity* (collapse rate) while altering the sample.

  3. **Statistical Bias**: *Sampling on the Dependent Variable*  
     (Focusing only on cases with the outcome of interest).  
     **Distinction**: ARCI contaminates the *control group* (surviving polities) by retroactively excluding "inconvenient" survivors from the reference class.

  4. **Comparative-Historical Flaw**: *Teleological Boundary Refinement*  
     (Defining categories by their outcomes).  
     **Distinction**: ARCI applies this *only to negative outcomes* (survival) while accepting failures as unproblematic members of the class.

  ---

  ### **Why "Asymmetric Reference-Class Immunization" (ARCI)?**
  - **Asymmetric**: Tightening criteria exclusively for survivors (Type II errors) while ignoring false positives (Type I errors).  
  - **Immunization**: Shields the base rate from revision by redefining the sample.  
  - **Boundary Conditions**:  
    - *Legitimate* refinement requires:  
      - Evidence of the "hidden feature" *predating the outcome*  
      - Application of criteria *consistently to all cases* (survivors & failures)  
      - Theoretical justification *independent of the outcome*  
    - *ARCI* occurs when:  
      - Exclusion is triggered *only* by survival  
      - Criteria are untestable/unknowable pre-outcome (e.g., "latent resilience")  
      - No symmetric scrutiny of collapsed cases  

  ---

  ### **Established Analogues & Why They Fall Short**
  | Concept                | Why Inadequate                                                                 |
  |------------------------|--------------------------------------------------------------------------------|
  | Confirmation Bias      | Too broad; doesn't capture the *statistical reclassification* mechanism.       |
  | Texas Sharpshooter Fallacy | Focuses on clustering *after* the fact; ARCI alters the *sample* itself.     |
  | Prosecutor's Fallacy   | Misapplies base rates to individuals; ARCI distorts the base-rate denominator. |
  | Survivorship Bias      | Ignores failed cases; ARCI actively *expels* survivors from the dataset.       |
  | Overfitting            | Fits model to noise; ARCI fits the *reference class* to preserve a rate.       |

  ---

  ### **ARCI in Historiographical Practice: A Diagnostic Checklist**
  A scholarly move exhibits ARCI if:  
  1. **Exclusion Trigger**: Survival/collapse avoidance prompts reclassification.  
  2. **Criterion Asymmetry**: New exclusion factors are *not* sought symmetrically for collapsed cases.  
  3. **Post Hoc Specification**: "Hidden" factors lack pre-outcome empirical indicators.  
  4. **Rate Preservation**: The original collapse probability remains unchanged.  

  *Example*: If a scholar argues that the Ottoman Empire’s 19th-century survival (despite crisis indicators) was due to "unique Islamic institutional resilience" *without* asking why similarly described polities (e.g., Timurid Empire) collapsed *despite* Islamic frameworks, ARCI is likely present.

  ---

  ### **Implications for Comparative Methodology**
  ARCI reveals a pathology in "outside-view" reasoning when:  
  - Reference classes are treated as **ontological categories** (essentialized "types" of empires) rather than **heuristic tools**.  
  - **Base rates become fetishized outputs** rather than starting points for Bayesian updating.  
  - **Negative evidence is systematically discounted** through sample curation.  

  To counter ARCI, insist on:  
  - **Blind classification**: Define reference classes *before* outcome assessment.  
  - **Falsification parity**: Apply exclusion criteria equally to all cases.  
  - **Process tracing**: Test if "hidden factors" demonstrably operated *during* crises.  

  This asymmetry persists because imperial collapse is often viewed as the "default" trajectory for polities in crisis—a latent essentialism that treats survival as the anomaly requiring explanation, while failure is accepted as natural. Your identification of this pattern is a significant contribution to critical methodology in historical social science.
