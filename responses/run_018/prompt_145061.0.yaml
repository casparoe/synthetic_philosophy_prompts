answer: |-
  ### Mechanistic Identity Classification (MIC) Procedure  
  **Core Concept**: Mechanistic identity requires organizational continuity (entity-activity mapping) and counterfactual stability (dependency preservation under intervention). Functional identity and component correspondence are insufficient alone but serve as necessary filters.  

  **Ordered Tests** (≤6 steps; "no" stops the process; ambiguity forces hand-off to human judgment):  
  1. **Functional Profile Identity (F)**  
     - *Question*: Is the observed error signature (outputs, timing, error codes) identical to the cataloged failure?  
       - **Yes**: Proceed to 2.  
       - **No**: **Stop → Novel failure** (mandates shutdown).  
       - **Ambiguous**: Hand off (dispute over functional boundaries).  

  2. **Counterfactual Dependency Preservation (D)**  
     - *Question*: Under critical interventions (e.g., component removal, parameter tweaks), does the failure respond identically to the cataloged case?  
       - **Yes**: Proceed to 3.  
       - **No**: **Stop → Novel failure**.  
       - **Ambiguous**: Hand off (dispute over causal structure).  

  3. **Organizational Closure (O)**  
     - *Question*: Is the entity-activity mapping (causal roles, boundaries, sequence of interactions) isomorphic to the cataloged case?  
       - **Yes**: Proceed to 4.  
       - **No**: **Stop → Novel failure**.  
       - **Ambiguous**: Hand off (dispute over organizational boundaries).  

  4. **Component Correspondence (C)**  
     - *Question*: Is there a one-to-one match between physical/logical components and their causal roles?  
       - **Yes**: **Same mechanism** (apply containment).  
       - **No**: Proceed to 5.  
       - **Ambiguous**: Hand off (dispute over component equivalence).  

  5. **Risk-Tolerance Gate**  
     - *Question*: Given passed F, D, O but failed C, is the containment protocol robust to component differences?  
       - **Judgment required**: Hand off to senior engineer (risk-based verdict).  

  **Simplification for Time Pressure**:  
  - **Drop Component Correspondence (C)** if time <10 min. Core concept preserved if F, D, O pass (organizational/counterfactual identity suffices).  
  - **Never drop D or O**—they define mechanistic identity. Dropping F risks false positives; dropping C increases false negatives but is tolerable.  

  ---

  ### Application to Cases  
  **Case 1**: Mesh-networked swarm navigation desynchronization (vs. prior hierarchical-controller failure).  
  - **F**: Identical error signature → *Yes* → Proceed.  
  - **D**: Removing any node ≠ removing central controller (failure persists vs. eliminated) → *No* → **Stop → Novel failure**.  
    - *Verdict*: **Novel** (mandates shutdown).  
    - *Resistance*: Team may resist shutdown due to identical error signatures, but counterfactual mismatch (D-test) proves mechanistic difference.  

  **Case 2**: Bio-hybrid actuator failure under thermal stress (vs. prior mechanical actuator).  
  - **F**: Phenotypic output identical → *Yes* → Proceed.  
  - **D**: Intervention-response patterns isomorphic → *Yes* → Proceed.  
  - **O**: Organizational boundaries isomorphic → *Yes* → Proceed.  
  - **C**: All physical components differ → *No* → Proceed to 5.  
  - **5**: Hand off to human judgment.  
    - *Verdict*: **Hand-off** (senior engineer decides risk tolerance).  
    - *Resistance*: Team may resent hand-off (prefers quick containment), but C-test failure forces risk assessment. Judgment might permit containment (if protocol is abstract) or demand shutdown (if bio-components invalidate protocol).  

  **Case 3**: Cognitive-architecture misclassification (vs. prior case with feedback loop).  
  - **F**: Identical misclassification pattern and representations → *Yes* → Proceed.  
  - **D**: Feedback loop absent; error propagation differs under variation → *No* → **Stop → Novel failure**.  
    - *Verdict*: **Novel** (mandates shutdown).  
    - *No judgment step*: Counterfactual mismatch (D-test) is decisive.  

  ---

  ### Limitations and Override Conditions  
  **Blind Spots**:  
  1. **Emergent Mechanisms**: Novelty arising from system-scale interactions (e.g., chaotic dynamics) not reducible to F/D/O/C.  
  2. **Stochasticity**: Mechanisms with identical organizations but probabilistic dependencies may pass O-test falsely.  
  3. **Cross-Domain Isomorphisms**: Biologically inspired vs. digital systems with identical O/D but incommensurable physics (e.g., quantum effects).  

  **Simplification Distortions**:  
  - Dropping **D** or **O** destroys the core (mechanistic identity becomes functional or structural).  
  - Dropping **F** risks false positives (dissimilar failures classified as same).  
  - Dropping **C** inflates false negatives (legitimate same-mechanism cases flagged as novel).  

  **Override When**:  
  1. **Containment Protocol Mismatch**: Evidence suggests existing protocol fails despite MIC "same" verdict (e.g., domain-specific constraints).  
  2. **New Failure Mode Discovery**: Post-MIC data reveals novel dependencies (override to "novel" even if MIC passed).  
  3. **Time-Pressure Errors**: Incomplete intervention tests (D-step ambiguity) necessitate manual review.  

  **Procedure Output ≠ Truth**: MIC is a heuristic; override if engineering intuition (e.g., physics knowledge) contradicts verdict.
