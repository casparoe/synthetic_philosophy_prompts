  Okay, let me start by unpacking the user's query. They're working on decision theory in a philosophy seminar, focusing on Good's theorem about the non-negative value of information. The user is interested in applying this to the 2020 A-level grading controversy in England. They want to analyze how the theorem holds up when information has expressive or moral dimensions beyond instrumental value.

  First, I need to recall Good's theorem clearly. The core idea is that for a rational agent with a well-defined utility function and free choice, additional information can't have negative expected value because they can always ignore it. But the user is pointing out cases where information carries moral weight, like in the Ofqual algorithm case. The downgrades based on school history weren't just data; they sent a message about student credibility, affecting dignity. 

  Next, identifying the decision-makers in the case: Ofqual, the government, and the students. Each had different actions and information streams. Ofqual designed the algorithm using school data and teacher predictions. The government reversed course after public backlash. The reversal itself is key—why did they backtrack if the information was supposed to be beneficial? 

  The user's deeper question is about the theorem's assumptions. They mention the separation of epistemic and moral evaluation. In Good's framework, utility is supposed to encompass all values, but if the act of using certain information expresses a judgment that harms dignity, does that mean utility wasn't fully captured? Or is the expressive harm a separate issue?

  I should also consider contested areas in decision theory. While Good's theorem is solid under its assumptions, philosophers debate cases with coercion or moral constraints. Here, students had no choice but to accept the algorithm's output initially. Their agency was restricted, which might fall outside the theorem's scope. 

  The user might be questioning whether rational choice models can handle moral dimensions without reducing them to utility. The expressive harm in the grading controversy—suggesting students from weaker schools are less credible—isn't just a cost but a moral wrong. Good's theorem doesn't address how the source or use of information affects moral standing. 

  I need to separate settled aspects from contested ones. Settled: Good's theorem requires free choice and comprehensive utility. Contested: whether expressive harms can be integrated into utility or if they represent a limitation. The reversal by the government indicates that the political cost and public perception introduced new utilities, but maybe the initial model didn't account for the dignitary harm. 

  The user's real interest might be in how decision theory handles cases where information's use itself has normative implications. They’re likely exploring whether tools like Good's theorem can be applied to policy debates where values conflict, or if they fall short. The answer seems to be that the theorem is robust in its domain but silent on moral expressions tied to information use. Highlighting this gap shows where interdisciplinary thinking (ethics, social theory) is needed beyond pure decision theory.
answer: |-
  Here's a breakdown of the 2020 A-Level controversy through Good's lens, separating settled aspects of the theorem from the contested philosophical questions it raises:

  **Settled Aspects of Good's Theorem & Its Core Conditions:**
  1.  **Non-Negative Expected Value:** Good's theorem conclusively establishes that *for a rational agent with a well-defined utility function and genuinely unrestricted choice over actions*, the expected value of acquiring additional information (before deciding) is non-negative. The agent can always choose to ignore the information and act as they would have without it, guaranteeing no expected loss, and potentially gain by acting optimally with the new information.
  2.  **Core Preconditions:**
      *   **Well-Defined Utility:** The agent must have a coherent utility function encompassing *all* relevant values and consequences of actions and states of the world.
      *   **Unrestricted Action Space:** The agent must be truly free to choose *any* action in their set of possible actions upon receiving the new information. Coercion or external constraints that *change* based on the information received violate this condition.
      *   **Rationality:** The agent updates beliefs via Bayesian conditionalization and chooses the action maximizing expected utility given their beliefs.
  3.  **Scope:** The theorem is fundamentally about the *instrumental* value of information for achieving outcomes defined by the utility function. It says nothing about the intrinsic value of information, the costs of acquiring/processing it, or how its *source* or *use* might affect utility components like dignity, fairness perceptions, or social cohesion.

  **Analysis of the A-Level Controversy through Good's Framework:**

  1.  **Key Decision-Makers & Their Actions/Information:**
      *   **Ofqual (Initial Design):**
          *   **Actions:** Choose an algorithm (parameters, inputs, weighting of school history vs. CAGs), release grades based solely on algorithm, release grades based solely on CAGs, hybrid approaches.
          *   **Information Streams:** Historical school performance data, Centre Assessed Grades (CAGs), teacher predictions, *modeled* public/systemic impact of different approaches (e.g., grade inflation, perceived fairness).
          *   **Choice:** They chose an algorithm heavily weighting historical school data to moderate CAGs. *Under Good's strict conditions*, acquiring the school history data *should* have had non-negative expected value *for Ofqual's utility function* (which likely prioritized maintaining standards, avoiding inflation, historical comparability, and *predictive* accuracy of grades for university success). They acted on it, believing it optimized their goals.
      *   **The Government (Reversal Decision):**
          *   **Actions:** Uphold Ofqual's algorithm grades, revert entirely to CAGs, implement a different appeals/adjustment process, delay results.
          *   **Information Streams:** Algorithm output (grades), CAGs, historical data, *actual* public reaction (protests, media outcry, MP pressure), legal challenges, equity impact analyses of the algorithm's output.
          *   **Choice:** After seeing the algorithm's output and the *intense public reaction*, they reverted to CAGs. Critically, the *public reaction itself* was new information revealing the *intensity of disutility* associated with using the school history data algorithmically. This disutility (anger, perceived injustice, political cost) likely wasn't fully captured in Ofqual's initial utility function/model.
      *   **Students (Limited Agency):**
          *   **Actions:** Appeal (often impractical), accept grade, retake exam later, protest. *Crucially, their action space regarding the core grade assignment was severely restricted.* They were recipients, not primary deciders.
          *   **Information Streams:** Their own CAG, the algorithm-adjusted grade, school history data (implied), public discourse. Receiving the downgraded grade *was* information, but they had little freedom to act optimally upon it regarding the grade itself.

  2.  **Did the Algorithm's Information Have Negative Value? Within Good's Framework:**
      *   **For Ofqual (Initially):** *Probably not*, under *their* initial utility function/model. The school history data likely helped achieve their goals of moderation and controlling inflation *as they initially conceived them*. The negative consequences stemmed from *omissions* or *errors* in their utility function (underweighting expressive harm/dignity) and their model of public/systemic reaction, not the intrinsic negative value of the information *per se*.
      *   **For the Government:** The *combination* of the algorithm's output *and the public reaction* revealed new information about the true costs (political, social, moral) of *using* the school history data in that way. This new information allowed them to choose an action (reverting to CAGs) that they deemed superior *given the now-apparent full costs*. Good's theorem holds: acquiring *that* information (the intense reaction revealing true disutility) had non-negative expected value for the government's decision.
      *   **For Students:** Good's theorem *does not directly apply* because students lacked genuine unrestricted choice over the core action (grade assignment). Receiving the downgraded grade caused direct harm (distress, lost opportunities) with no viable optimal action to mitigate it *at that point*. This highlights Good's precondition of **free agency** – the harm arose from *coercion* (having to accept the grade) and *restricted action space*, not from freely acting on information.

  3.  **The Expressive Dimension & Good's Theorem:**
      *   Good's theorem is **silent** on the expressive dimension by design. It treats information purely instrumentally – as data updating beliefs about states of the world relevant to achieving utility-defined outcomes.
      *   **The Controversy's Core:** Using school history data wasn't just a predictive tool; it *expressed a judgment*: "Your individual potential is significantly constrained by your school's past performance." This was perceived as denying individual agency, reinforcing class bias, and devaluing students from disadvantaged schools. It inflicted **expressive harm** – a harm intrinsic to the *meaning* of the action (using that data algorithmically), not just its consequences.
      *   **Can Good Handle This?** Only *if* the expressive harm is fully incorporated into the utility function *in advance* as a significant negative utility component associated with the *act of using that specific information source in that specific way*. The controversy suggests Ofqual's initial utility function either:
          *   Failed to recognize expressive harm as a distinct utility component.
          *   Grossly underestimated its magnitude.
          *   Incorrectly modeled its probability of occurrence.
      The theorem itself doesn't *preclude* including expressive harm in utility; its limitation is that it *doesn't mandate or guide how to define utility*, including whether such harms should be incorporated or how to quantify them.

  4.  **Epistemic vs. Moral Evaluation:**
      *   **The Controversy Reveals Entanglement:** The case strongly challenges the assumption that epistemic evaluation (Is the algorithm predictively accurate?) can be cleanly separated from moral evaluation (Is it fair? Does it express respect?).
      *   **Good's Assumption:** The theorem *implicitly assumes* a separation. The utility function aggregates *all* values (which *could* include moral values like fairness and dignity), while the information purely updates beliefs about states of the world. The "correctness" of an outcome is defined solely by the utility function.
      *   **The Challenge:** In this case:
          *   The *source* of information (historical school performance) carried moral baggage (past systemic inequalities).
          *   The *method of use* (algorithmic moderation overriding individual teacher assessment) made a moral statement about trust and agency.
          *   The perceived *epistemic injustice* ("our knowledge isn't trusted") was intrinsically linked to the moral harm.
      *   **Theorem's Stance:** Good's theorem doesn't *depend* on a strict separation; it is *compatible* with utility functions containing complex moral weights. However, it provides *no tools* to resolve conflicts *within* the utility function between epistemic goals (predictive accuracy) and moral goals (fairness, dignity, non-discrimination). The reversal occurred because the government (facing public reaction) drastically reweighted the moral components relative to the initial epistemic priorities.

  **Conclusion: Where Good Holds, Where it is Silent, and What is Contested**

  *   **Holds:** The reversal does *not* disprove Good's theorem. For the key decision-makers *with agency* (Ofqual initially, the Government later), acquiring new information (school data, then public reaction) allowed them to make choices they believed better served their utility functions. The negative consequences stemmed from flaws *within* those utility functions (omission/underweighting of expressive harm) and flawed models of the world, not from the information itself having intrinsic negative value under free choice.
  *   **Silent:**
      *   The **expressive dimension** of information use. Good treats information as belief-updating data, not as a carrier of meaning that inherently affirms or denies status/dignity.
      *   The **definition of utility**. It doesn't prescribe how to weigh instrumental epistemic goals against non-instrumental moral values like fairness or dignity.
      *   Cases of **coerced recipients** (like students) where the precondition of free agency is violated.
  *   **Contested Philosophical Terrain (Not Settled by Good's Theorem):**
      *   **Robust Counterexamples?** Philosophers debate whether scenarios involving coercion, extreme framing effects, or specific moral side-constraints (where *acquiring* certain information is inherently wrong, regardless of use) can constitute genuine counterexamples *if the preconditions are strictly met*. The student experience here highlights harm under coercion, but Good's theorem explicitly excludes such cases by requiring free choice.
      *   **Utility Aggregation:** Can expressive harms and moral side-constraints *always* be adequately captured within a single, consistent utility function without loss of meaning? Some argue these values are incommensurable or that their incorporation fundamentally changes the nature of decision-making.
      *   **Separation Thesis:** The A-Level case powerfully illustrates the difficulty, perhaps impossibility, of cleanly separating the epistemic evaluation of information from its moral and social context and consequences. While Good's theorem *can* formally incorporate moral values into utility, it offers no guidance on resolving deep conflicts between epistemic and moral imperatives, a central challenge revealed by this policy failure. The reversal was ultimately a reprioritization of moral values over initial epistemic goals.
