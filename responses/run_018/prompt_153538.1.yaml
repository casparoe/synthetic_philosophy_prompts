answer: |-
  ### Taxonomy of Historical Lock-In: Replaying the Tape  
  **Root Question**: If we replayed human history with a minor change (e.g., Battle of Actium outcome, British coal seams relocated), would macro-outcomes like industrial capitalism or liberal democracy still arise?  

  #### BRANCH 1: CONVERGENCE (Yes, outcomes still arise via structural attractors)  
  *Split by mechanism of convergence:*  

  1. **Leaf 1A: Geographic Determinism**  
     - **Mechanism**: Environmental constraints force outcomes (e.g., industrial capitalism *must* emerge where coal/waterways enable it; British coal was inevitable for the Industrial Revolution).  
     - **Awkward Commitment**: Must deny that societies without "ideal" geography (e.g., landlocked tropics) could ever achieve industrial capitalism.  
     - **Separated?** Yes—unlike functional selection, geography is non-adaptive and externally fixed.  

  2. **Leaf 1B: Functional Selection**  
     - **Mechanism**: Institutions evolve toward efficient forms (e.g., liberal democracy outcompetes autocracy; markets replace feudalism).  
     - **Awkward Commitment**: Assumes "efficiency" is objective and universally favored—ignores that inefficient institutions (e.g., North Korea’s dictatorship) survive coercion.  
     - **Separated?** Yes—unlike retro-justification, functionalism is forward-looking and teleological.  

  3. **Leaf 1C: Normative Retro-Justification**  
     - **Mechanism**: Outcomes are post hoc legitimized as inevitable (e.g., liberal democracy is framed as "the end of history" *after* its rise).  
     - **Awkward Commitment**: Implies history’s winners morally deserve victory—risks justifying colonialism/genocide as "necessary."  
     - **Separated?** Weak—collapses into functionalism if "justification" relies on efficiency claims.  

  #### BRANCH 2: PATH-DEPENDANCE (No, outcomes diverge irreversibly)  
  *Split by source of divergence:*  

  4. **Leaf 2A: Strong Contingency (Chaos-Style)**  
     - **Mechanism**: Tiny changes cascade into macro-divergence (e.g., Actium’s outcome alters Rome’s fall, preventing European state formation).  
     - **Awkward Commitment**: History becomes "unexplainable"—if a butterfly’s wing can derail democracy, grand narratives are futile.  
     - **Separated?** Yes—unlike lock-in, chaos rejects institutional "stickiness" entirely.  

  5. **Leaf 2B: Institutional Sedimentation**  
     - **Mechanism**: Early choices "lock in" via increasing returns (e.g., feudal institutions resist change; Meiji Japan escaped only via external shock).  
     - **Awkward Commitment**: Requires that societies rarely escape institutional traps—yet must explain exceptions (e.g., Meiji) as flukes.  
     - **Separated?** Yes—unlike chaos, lock-in is cumulative and predictable once path begins.  

  ---

  ### Key Notes:  
  - **Logically Empty Combinations**:  
    - **Strong Contingency + Normative Retro-Justification**: Chaos denies inevitability, while retro-justification requires it. If history is chaotic, outcomes *can’t* be preordained or morally necessary.  
    - **Geographic Determinism + Institutional Sedimentation**: Geography is fixed, but sedimentation requires human choices—geography might *enable* lock-in but can’t cause it alone.  

  - **Niche Idea: Counterfactual Fragility Index (CFI)**  
    - Measures how easily a macro-outcome (e.g., industrial capitalism) changes under small perturbations.  
    - *Low CFI*: Robust outcomes (geographic determinism—industrialization occurs without British coal).  
    - *High CFI*: Fragile outcomes (strong contingency—no Actium win for Octavian → no Roman Empire → no capitalism).  

  - **Unnamed Leaves?** None—all positions map to existing debates. Weak separation only in *Normative Retro-Justification*.  

  - **Concrete Cases**:  
    - British coal seams → Test case for geographic determinism vs. strong contingency.  
    - Meiji Restoration → Proof of institutional lock-in *unless* ruptured by external force.  
    - Liberal democracy’s rise → Functional selection (democracy as "optimal") vs. institutional sedimentation (depends on sequence: Magna Carta → Enlightenment → revolutions).  

  ---  
  **Design Rationale**: Tree isolates mechanisms (geography, selection, chaos, lock-in) to avoid overlap. "Path-dependance" spelling retained per request. CFI injects measurable rigor without citations. Handout-ready for grad seminar debate.
