prompt: |-
  hey, im writing a novel and my protagonist is a moral psychologist who keeps getting told shes "just biased" whenever she disagrees with someone on value, so i want her to have an actual framework that separates real moral bias from legit preference. can you write the desiderata for such a theory? i need: the cases it has to handle right (like the "moral tourist" who adopts local norms for a season vs the "exile" who rejects them, or discounting animal pain vs just hating bitter taste), the distinctions it cant blur (bias vs taste vs epistemic bad luck), whether theres a contradiction hidden between demanding objectivity and allowing different moral weights, and which one requirement kills the usual pop-psych explanations. flag any pair thats jointly unsatisfiable. keep it to the criteria, not a full scorecard, and dont worry about citations—i dont have access right now. (also i keep misspelling desiderata as desiderta, lol)
reasoning: |-
  Okay, the user is writing a novel and needs help developing a framework for their protagonist, a moral psychologist. The protagonist faces the challenge of being dismissed as "just biased" whenever she disagrees on values. The user wants a set of criteria (desiderata) for a theory that distinguishes genuine moral bias from legitimate preferences. 

  First, I need to unpack the user's examples to understand the core challenges. The "moral tourist" vs "exile" case shows that context matters - someone can temporarily adopt norms without hypocrisy, while another rejects them due to trauma. Then there's discounting animal pain (bias) versus simply disliking bitter taste (preference). The key distinctions needed are between bias (systematic error), taste (subjective preference), and epistemic bad luck (honest mistakes despite good faith efforts).

  The user also raises a philosophical tension: how can a theory demand objectivity while allowing different moral weights? This suggests the framework must navigate moral realism (objective truths) without collapsing into relativism. Plus, they want to know which requirement typically trips up popular psychology theories - probably the "non-vacuity" criterion that prevents reducing all disagreement to bias.

  Hmm, the misspelling of "desiderata" is a minor aside but shows the user's personality - they're focused on content over form, which is good. Their core need seems to be narrative plausibility: the framework must feel academically rigorous enough for a psychologist protagonist while serving the story's conflicts. The unspoken stakes are character credibility - if her framework is flimsy, readers won't buy her victories.

  I'll structure the desiderata around four pillars: 
  - Scope (handling their key examples) 
  - Precision (sharp distinctions) 
  - Coherence (resolving the objectivity-relativity tension) 
  - Practicality (exposing pop-psych failures). 

  For the objectivity puzzle, I'll propose "constrained pluralism" - objective grounding in something like moral facts, but with weighting flexibility where values genuinely conflict. The "bias/taste" line mustn't blur; maybe anchor it in harm/rights violations versus agent-relative preferences. 

  The pop-psych killer should be Non-Vacuity - if every disagreement is "bias," the term loses meaning. I'll flag any conflicting pairs, like Universal Scope vs Tractability - covering every culture might make the framework unwieldy. 

  Most importantly, the criteria must feel usable in dialogue. When the protagonist invokes them, readers should nod along, not glaze over. That means crisp terminology - no jargon tangles. And since it's for fiction, I'll avoid citations but keep the logic tight enough that academics wouldn't wince.
answer: |-
  Here are the desiderata for your protagonist's framework, designed to cut through the "just biased" dismissal while handling your specified cases and tensions:

  **Core Desiderata:**

  1.  **Scope Adequacy (Handles Key Cases):**
      *   Must distinguish **Moral Tourist** (conscious, temporary, contextually appropriate norm-adoption *without* internal value shift) from **Exile** (rejection based on perceived injustice/harm, often *with* internal conviction).
      *   Must distinguish **Discounting Moral Patiency** (e.g., dismissing animal pain based on species, lacking justification rooted in sentience/experience - *Bias*) from **Aversive Preference** (e.g., hating bitter taste, not claiming it's *immoral* for others to like it - *Taste*).
      *   Must accommodate **Epistemic Bad Luck** (e.g., reasonably concluding X is harmless based on best available evidence, later proven wrong - *Not Bias*).

  2.  **Distinction Precision (Cannot Blur):**
      *   **Bias vs. Taste:** Must clearly separate systematic *errors in moral judgment* (e.g., ignoring relevant harms, inconsistent application of principles) from *subjective preferences/aversions* that do not entail a claim about objective wrongness or universal obligation.
      *   **Bias vs. Epistemic Position:** Must differentiate judgments arising from flawed reasoning/heuristics/partiality (*Bias*) from judgments made in good faith based on incomplete/incorrect but reasonably held information (*Epistemic Bad Luck*).
      *   **Legitimate Pluralism vs. Bias:** Must allow for different *weightings* of core values (e.g., liberty vs. security) or different *applications* in complex contexts (*Pluralism*), while identifying when differences stem from motivated reasoning or ignoring facts (*Bias*).

  3.  **Objectivity-Pluralism Coherence (Resolves the Tension):**
      *   Must provide an account of **Objective Grounding:** Moral judgments track *something* non-arbitrary (e.g., suffering, flourishing, autonomy, fairness - "moral facts" or robustly intersubjective features of agency/welfare). Disagreement isn't *automatically* proof of bias.
      *   Must allow for **Constrained Pluralism:** Different agents/cultures can *legitimately* prioritize or interpret core values differently *within bounds* set by the objective grounding. The framework defines these bounds (e.g., "no gratuitous suffering," "respect minimal agency").
      *   **Resolution:** Bias occurs when judgments *violate* the objective grounding (ignoring core harms) or *contradict* the agent's own stated principles/weightings without justification *other* than self-interest or in-group preference. Legitimate pluralism operates *within* the objective constraints.

  4.  **Anti-Vacuity / Pop-Psych Killer (The Crucial Requirement):**
      *   **Non-Vacuity:** The theory **cannot reduce *all* moral disagreement to bias.** It *must* provide clear criteria for identifying *when* bias is present vs. when disagreement reflects legitimate pluralism, epistemic differences, or taste. This directly kills the common pop-psych move of declaring "disagreement = bias."

  **Flagged Potential Tensions (Jointly Unsatisfiable Pairs?):**

  1.  **Universal Scope vs. Tractability:** Demanding the framework handle *every conceivable* moral system/culture perfectly (*Universal Scope*) might conflict with providing clear, usable distinctions for real-world psychology (*Tractability*). *Resolution:* Focus on core features of agency, sentience, and social cooperation present in *most* human contexts, allowing for some cultural interpretation *within* those bounds.
  2.  **Strong Objectivity vs. Radical Pluralism:** Insisting on very specific, universally binding moral facts (*Strong Objectivity*) might conflict with allowing significant legitimate differences in value weighting (*Radical Pluralism*). *Resolution:* The framework likely needs "thin" objectivity (e.g., "avoidable severe suffering is pro-tanto bad") that allows "thick" pluralism in how to balance this against other values or define "severe" in context.
  3.  **Perfect Bias Detection vs. Epistemic Humility:** Expecting the framework to *perfectly* diagnose bias in all cases (*Perfect Detection*) might conflict with acknowledging the limits of our knowledge about others' internal states and reasoning (*Epistemic Humility*). *Resolution:* The framework provides strong indicators and criteria for bias but acknowledges that final judgments about *individual* motivation can sometimes be uncertain, focusing instead on the *structure* and *grounding* of the judgment itself.

  **Key Takeaway for Your Protagonist:** Her framework's power lies in **Non-Vacuity** + **Distinction Precision**. When accused of bias, she can retort: "Bias isn't just disagreement. Show me *where* my reasoning ignores a core harm, violates my own principles inconsistently, or dismisses relevant evidence without cause. Otherwise, we might just weigh values differently or interpret facts differently – and that needs a better argument than 'you're biased'." This forces critics to engage with the *structure* of the moral claim, not just the fact of disagreement.

  Good luck with the novel (and spelling "desiderata"!) – this is a fascinating core conflict for a moral psychologist.
