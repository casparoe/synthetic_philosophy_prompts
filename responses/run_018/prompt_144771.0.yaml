  ### Decision Tree for Singleton Hypothesis Positions

  This decision tree classifies positions on the singleton hypothesis—the claim that world order converges on exactly one top-level decision-making agency without rivals—using four binary splits grounded in physically informed framing. The splits are:

  1. **Authority Source**: Whether the singleton's authority stems from *computational supremacy* (out-calculating rivals) or *normative convergence* (compelling endorsement by rational agents).  
  2. **Domain Ontology**: Whether the singleton's domain is *uniform* (ontologically homogeneous) or *pluralistic* (tolerates irreducible pluralism).  
  3. **Stability Mechanism**: Whether stability is maintained via *low-entropy suppression* (quashing dissent like driving to a ground state) or *high-entropy accommodation* (allowing bounded variance like a critical point).  
  4. **Cosmological Boundaries**: Whether the singleton's singularity extends across *all physical boundaries* (e.g., causal horizons, quantum branches) or *fragments locally* at boundaries.  

  Each split is binary, yielding 16 terminal leaves. Leaves are labeled with:  
  - **Position name** (from literature/logical space; "unnamed" if none exists).  
  - **Most awkward commitment**: A single sentence capturing the position's counterintuitive or challenging implication.  
  - **Vacancy diagnosis** (for unoccupied leaves): Brief reason for absence (incoherence, unattractiveness, or neglect).  

  Named positions are explicitly flagged where they share a leaf. Contested interpretations (e.g., quantum branching's impact, thermodynamic analogy validity, normative convergence feasibility) are not presented as consensus.  

