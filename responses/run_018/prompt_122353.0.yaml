answer: |-
  Here’s a conceptual dissection of "absence of evidence is not evidence of absence" tailored to your context, structured per your request:

  ### 1. The Readings (A Menu of Theses)  
  Ordered from most trivial/defensible to most radical:  

  1. **Epistemic Uncertainty Thesis**  
     - *Claim*: A non-significant result alone cannot definitively confirm a precise null (effect = 0).  
     - "Absence" = Exact zero effect.  
     - "Evidence" = Conclusive proof (deductive certainty).  
     - *Why trivial?* Trivially true; no finite sample proves an exact zero.  

  2. **Severity-Limited Thesis**  
     - *Claim*: Failure to reject H₀ does not entail evidence *for* H₀ unless the test had high severity (power) to detect relevant alternatives.  
     - "Absence" = Exact zero *or* effect < SESOI.  
     - "Evidence" = Severe test (error-statistical; Mayo 2018).  
     - *Key nuance*: Your SESOI preregistration makes this actionable.  

  3. **Likelihood Indeterminacy Thesis**  
     - *Claim*: A non-significant result has an ambiguous likelihood ratio (LR) if no alternative is specified; it need not favor H₀ over H₁.  
     - "Absence" = H₀: effect = 0.  
     - "Evidence" = LR(H₁:H₀) < 1 (support against H₁).  
     - *Crucial*: If H₁ is poorly defined (e.g., "some effect"), the LR is uninterpretable.  

  4. **Bayesian Underpowered Thesis**  
     - *Claim*: With low power, a non-significant result negligibly shifts priors toward H₀ if H₁ includes large effects.  
     - "Absence" = Effect ≤ SESOI.  
     - "Evidence" = Posterior probability of H₀.  
     - *Dependency*: Heavily prior-dependent; weak if priors favor large effects.  

  5. **Radical Skepticism Thesis**  
     - *Claim*: No finite data can ever support H₀ over H₁; only falsify H₁.  
     - "Absence" = Any effect ≤ theoretical maximum.  
     - "Evidence" = Support for a parameter value (Popperian falsificationism).  
     - *Extreme*: Renders "evidence of absence" impossible in principle.  

  6. **Self-Undermining Thesis**  
     - *Claim*: "Evidence" requires statistical significance; non-significance is evidentially void.  
     - "Absence" = H₀ or any non-significant alternative.  
     - "Evidence" = p < α.  
     - *Fatal flaw*: By symmetry, original studies' significant results become "evidence" only by convention, not truth-tracking.  

  ---

  ### 2. Verdicts  
  - **Thesis 1 (Epistemic Uncertainty)**: Platitude. Correct but irrelevant; no one claims null results *prove* exact zero.  
  - **Thesis 2 (Severity-Limited)**: Substantive and defensible. **Your case**: With SESOI-preregistered power, your interval *is* evidence of absence (effect < SESOI).  
  - **Thesis 3 (Likelihood Indeterminacy)**: Contentious. Ambiguity dissolves if H₁ is specified (e.g., original effect size). Your LR *does* slightly favor H₀ over that H₁.  
  - **Thesis 4 (Bayesian Underpowered)**: Defensible iff priors dominate. **But**: Your large-N study *can* shift reasonable priors toward "small effect."  
  - **Thesis 5 (Radical Skepticism)**: False. Contradicts statistical consensus; meta-analyses *can* establish "no meaningful effect."  
  - **Thesis 6 (Self-Undermining)**: Self-refuting. If non-significance isn’t evidence, significance isn’t either (symmetry problem you noted).  

  ---

  ### 3. What the Line Was Doing in Your Seminar  
  The speaker likely invoked **Thesis 2 (Severity-Limited)** superficially but weaponized **Thesis 5/6 (Radical/Self-Undermining)** implicitly to dismiss your result.  

  - **Why it licensed their moves**:  
    - *Your study*: They ignored your SESOI and power, treating "absence" as exact zero (Thesis 1) while implying no evidential value (Thesis 5).  
    - *Field-wide replications*: By Thesis 6, only original significant results "count," rendering replication failures invisible.  
  - **Weaker versions they *could* claim**:  
    - Thesis 3: If they deny your H₁ specification (original effect size), your LR is ambiguous.  
    - Thesis 4: If they hold strong priors for large effects, your posterior may not convince *them*.  
  - **Readings that undermine their response**:  
    - Thesis 2: Your SESOI-preregistered design *is* severe for detecting effects > SESOI. Your result *is* evidence of absence (effect < SESOI).  
    - Thesis 6’s symmetry: If your result isn’t evidence against the effect, the original wasn’t evidence *for* it.  

  ---

  ### 4. Two Things to Say Back  
  *Politely force distinctions without accusing*:  

  1. **Clarify "absence" relative to SESOI**:  
     > "I agree we can’t prove *exact* zero. But with our preregistered SESOI and larger sample, we designed to detect effects people care about. Given the interval includes only trivial effects, would you say it at least suggests the effect is smaller than the field assumed?"  
     *This targets Thesis 2 vs. Thesis 5.*  

  2. **Expose the symmetry problem**:  
     > "If non-significant replications never count against an effect, what would? And if they don’t count against it, why did the original significant result count *for* it?"  
     *This dismantles Thesis 6 by highlighting inconsistent evidential standards.*  

  These force acknowledgment of SESOI and symmetry—cornerstones of your design they overlooked.
