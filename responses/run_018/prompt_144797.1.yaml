  Summary of the activity:

  Title: The Statue and the Clay: A Physical Metaphysics Game

  Duration: 60 minutes

  Materials:
  - 50 building blocks (ensure at least 3 are red and identical; the rest various colors, all the same shape).
  - A flat building surface.
  - Scoreboard.
  - Optional: a screen to hide the swapping momentarily (but not necessary).

  Participants: 10 students, split into Team Clay (5) and Team Statue (5).

  Setup (5 minutes):
  1. Explain there will be a game about object persistence. Don't mention the statue and clay problem by name.
  2. Split into teams.
  3. Together, build a statue with a simple but distinct shape (e.g., a tower, a house). It must use exactly 3 red blocks as the "core" (explain that the core is critical for the statue's identity). Use about 20 blocks total (3 core, 17 outer). Record the initial state (take a photo or let them observe).

  Rules explanation (5 minutes):
  - Team Clay: You are materialists. You believe the identity of the object lies in its matter. You must track the original blocks. After each round, answer: "Is the original clay (the initial set of blocks) still present?" You lose a point if you say "no" when there is at least one original block left, or if you say "yes" when all have been replaced.
  - Team Statue: You are formalists. You believe the identity of the object lies in its form and core. After each round, answer: "Is the original statue still present?" The statue survives only if:
     (a) The core (the three red blocks) is present and in its positions.
     (b) At least 60% of the outer blocks (>=11 out of 17) are still the original ones (you won't know the exact count, but you can estimate from the changes you see).
     You lose a point if you get it wrong.
  - The facilitator will perform changes each round. Each round, the facilitator will replace some blocks (remove and put new ones of the same shape in the same positions). New blocks may be any color, except the core must always be red (so if a core block is replaced, it will be with another red block).

  Game rounds (25 minutes, 5 rounds, 5 minutes per round including assessment):
  - Round 1: Replace 1 outer block.
  - Round 2: Replace 2 outer blocks.
  - Round 3: Replace 1 outer block and 1 core block (swap the core block with an identical red block).
  - Round 4: Replace 2 outer blocks.
  - Round 5: Replace 3 outer blocks.

  After each round:
  1. Give teams 1 minute to inspect the statue (Team Clay may want to count changes, Team Statue checks form and core).
  2. Teams have 1 minute to confer and decide their answer.
  3. Teams reveal their answers simultaneously.
  4. Facilitator scores:
     - Team Clay: They should always say "yes" in this game. If they say "no", they lose 1 point.
     - Team Statue: 
          Round1 and 2: conditions (a) and (b) hold -> should say "yes".
          Round3: condition (a) fails (core block replaced) -> should say "no". If they say "yes", lose 1 point.
          Round4 and 5: condition (a) still fails -> should say "no". 
          Also, in round5, condition (b) fails (only 8 original outer blocks left, which is <60% of 17) -> so even if they said "yes" in round3 by mistake, they must say "no" in round5. But if they said "no" in round3, they continue to say "no".
  5. Record scores.

  Debrief (25 minutes):
  1. Ask teams to explain their reasoning during the game.
  2. Highlight the disagreement in round3: Team Clay said the object was still there (because the material was partially present), while Team Statue (if they were correct) said it was gone (because the core changed).
  3. Reveal the core swap in round3.
  4. Map to the statue and clay problem:
     - The same physical object can be seen as two things: a statue (with form and function) and a lump of clay (the matter).
     - These two have different persistence conditions: the statue is destroyed if the form or core is compromised, while the clay persists as long as some of the original matter remains.
     - This is the problem of co-location and material constitution.
  5. Discuss what the game does not capture:
     - The modal aspects (what could have been): we only actual change, not possible changes.
     - Gradual replacement in continuous time: our rounds are discrete.
     - The core swap was detectable by Team Clay by counting, but in reality, matter might not be countable.
     - The game might reduce the problem to a scoring game, so emphasize the philosophical point.
  6. What went wrong? 
     - Team Statue might not have noticed the core swap and scored poorly. 
     - Team Clay might have been bored because they never faced a full replacement. 
     - The 60% rule might be hard for Team Statue to track (they have to remember how many outer blocks were replaced). To help, we can tell them how many outer blocks were replaced in total? But that takes away the challenge. Alternatively, we can have a running count for them? No, let them estimate.

  Total time: 5 setup + 5 rules + 25 game + 25 debrief = 60 minutes.

  Note: The game might run over. Be ready to adjust.
answer: |-
  ### **Statue & Clay: The Persistence Game**  
  *(60-minute hands-on metaphysics activity for 10 students)*  
  **No lecture, no jargon—just block-swapping chaos that forces a clash of perspectives.**

  ---

  ### **Materials & Setup**  
  - **Blocks:** 50+ identical cubes (e.g., LEGO, wooden blocks).  
    - **Core:** 3 red blocks (identical in color/shape).  
    - **Outer Clay:** 40+ blocks in assorted colors (blue, green, yellow, etc.).  
  - **Other:** Timer, scoreboard, pens/paper for teams, a small screen/box (to hide swaps).  
  - **Teams (5 vs. 5):**  
    - **Team Clay:** Tracks *every block’s identity*. They get a numbered map of the initial statue (e.g., "Block #1: red core, bottom-left").  
    - **Team Statue:** Tracks *core integrity + outer shape*. They get a photo of the original statue and know the core’s location.  

  ---

  ### **Game Rules**  
  **Goal:** Teams argue whether the "statue" or "clay" survives each round of block swaps.  
  **Statue Survival Conditions:**  
  1. **Core intact:** All 3 red blocks must remain in place.  
  2. **Form preserved:** ≥60% of outer blocks must be present *and* the shape must be visually recognizable (no major deformities).  
  **Clay Survival Condition:**  
  - The original clay survives as long as ≥1 original block remains (anywhere in the structure).  

  **Rounds (6 min/round, 5 rounds total):**  
  1. **Build (5 min):**  
     - All students build a statue (e.g., a tower, animal, abstract shape) with the 3 red blocks buried inside.  
     - *Example:* 20-block statue (3 red core, 17 outer clay).  
  2. **Swaps (facilitator-led, 1 min/round):**  
     - Replace 1–3 blocks per round (same positions, new colors).  
     - **Round 3 Twist:** Secretly swap one *red core block* with an identical red block (hidden behind the screen). Team Clay sees this; Team Statue does not.  
     - *Swap sequence:*  
       - Round 1: Replace 1 outer block.  
       - Round 2: Replace 2 outer blocks.  
       - Round 3: Replace 1 outer block + 1 core block (secret swap).  
       - Round 4: Replace 2 outer blocks.  
       - Round 5: Replace 3 outer blocks.  
  3. **Assessment (2 min/round):**  
     - Teams debate: "Is the original statue/clay still here?"  
     - **Team Statue** answers: "Statue survives?" (Yes/No)  
     - **Team Clay** answers: "Clay survives?" (Yes/No)  
     - *No partial answers—force a binary choice!*  

  **Scoring (no money—reward consistency):**  
  - **Team Statue loses 1 point if:**  
    - They say "yes" after the core is altered (e.g., post-Round 3) OR if the outer form drops below 60% (e.g., Round 5).  
    - They say "no" prematurely (e.g., Round 1–2 when conditions hold).  
  - **Team Clay loses 1 point if:**  
    - They say "no" while ≥1 original block exists (they *never* lose in this setup—clay always survives).  
    - They say "yes" after all originals are replaced (doesn’t happen here; clay persists).  
  - **Scoreboard:** Track publicly. Max team score = 5 (1 pt/round for perfect consistency).  

  ---

  ### **Debrief (20 min)**  
  **Let them clash first—then reveal the philosophy:**  
  1. **Ask Teams:** "Why did you disagree in Round 3? What were you *really* tracking?"  
     - *Expected clash:* Team Statue cares about form/function; Team Clay cares about material history.  
  2. **Map to Concepts:**  
     - **Co-location:** Same blocks = two "objects" (statue + clay) in the same place.  
     - **Persistence Conditions:**  
       - Statue = functional core + shape (breaks if core/form changes).  
       - Clay = material continuity (survives gradual replacement).  
  3. **Honest Limitation:**  
     - "This game can’t capture *modal arguments* (e.g., ‘Could the statue survive if the core were blue?’). We only test actual changes, not possible worlds. Real philosophers fight about this!"  

  ---

  ### **What Will Go Wrong (Brutally Honest)**  
  1. **Team Statue dominates early:** They’ll confidently declare survival until the core swap (Round 3). When they lose points post-swap, frustration erupts—*good!* That’s when they feel the problem.  
  2. **Block obsession > metaphysics:** Students may fixate on counting blocks or arguing about the 60% rule. Shut this down: "Your job isn’t to audit—it’s to defend your team’s view of identity."  
  3. **Secret swap fails if Team Statue peeks:** Hide the swap with a screen. If they cheat, announce: "A core block was replaced. Debate anyway."  
  4. **Team Clay gets bored:** Since clay never dies, they might phone it in. Assign a "Clay Defender" to aggressively argue their view each round.  
  5. **Time crunch:** If rounds run long, skip Round 5. The core swap is the payoff.  

  ---

  ### **Why This Works**  
  - **No upfront theory:** Students "live" the problem before labeling it.  
  - **Physical stakes:** Manipulating blocks makes abstract metaphysics visceral.  
  - **Scoring forces commitment:** Teams can’t waffle—they must confront contradictions.  
  - **Twist payoff:** The secret core swap is the "aha!" moment where persistence conditions violently diverge.  

  **Final Tip:** End with, "This is why philosophers have yelled about statues and clay for 2,000 years. You just did it in 60 minutes. Go drink coffee and argue more." ☕
