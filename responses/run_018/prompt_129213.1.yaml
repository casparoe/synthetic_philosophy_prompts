prompt: |-
  You are an experienced philosophy exam grader with deep expertise in population ethics, personal identity over time, and the metaphysics of possible persons. Before you assess anything, spend a moment brainstorming the specific grading rubric you would use for answers about the nonidentity problem—distinguishing the settled structural claim that different choices produce different people from the genuinely contested questions about whether impersonal reasons can ground obligations to future generations, and about how closely Parfit’s Principle Q binds moral evaluation to actual individuals rather than to outcomes. I am grading papers for a colleague’s graduate seminar on intergenerational ethics, and I need a precise, point-by-point evaluation that does not reveal my own view but clearly separates consensus from dispute.

  The exam question was: “Consider a 2150 scenario in which Government X adopts Climate Policy Alpha, permitting high-emission agriculture that funds rapid medical advances. The resulting generation—Cohort A—lives lives worth living but with moderate respiratory impairment. Had Government X adopted Climate Policy Beta (strict decarbonization with slower growth), different genetic and social pairings would have produced Cohort B, with no impairment and slightly higher welfare. A policy analyst claims Alpha wrongs Cohort A members because each is worse off than the corresponding Beta-person they replace. Evaluate this claim using the nonidentity problem, and explain whether Parfit’s analysis gives the government any reason—person-affecting or otherwise—to prefer Beta.”

  Here is one student’s answer: The student correctly states that Cohort A exists only under Alpha, so its members are not worse off than they would have been, since under Beta they would not exist at all; this captures the core nonidentity insight. The student then claims the case is structurally identical to Parfit’s wrongful-life examples, in which an actual child with a life worth living complains about being born with a disability. From this analogy, the student infers that because Cohort A members have lives worth living, they lack standing to complain, and therefore the government has no person-affecting reason to choose Beta. The student further asserts that Parfit rejects impersonal welfare aggregation across different populations and instead endorses a counterfactual replacement principle, which requires comparing actual individuals only to the specific counterparts they displace; since Cohort A members have no such counterparts under Beta, there is no meaningful basis for comparison, leaving the government indifferent between the policies except for effects on present people.

  Please grade this answer. Separate what is settled in the literature (for instance, the basic logic that different policies yield numerically different future people) from what is genuinely contested (for instance, whether Parfit allows impersonal reasons to guide reproductive or climate policy, and whether any “replacement” comparison is metaphysically coherent). Do not present a disputed interpretation as the consensus view. Present your assessment as exactly five numbered items, each one or two sentences long, with no introductory or concluding paragraph. The items should cover, in order: the student’s grasp of the basic nonidentity structure; the conflation or correct use of the wrongful-life analogy; the treatment of person-affecting versus impersonal reasons and any misattribution to Parfit; the evaluation of the invented counterfactual replacement principle; and the specific letter grade or point score with the precise justification. Be rigorous: flag any subtle inferential gap or conceptual slippage that a hurried grader might miss.
reasoning: |-
  Hmm, the user wants me to grade a student's philosophy exam answer about the nonidentity problem in population ethics. They've provided the exam question, the student's response, and specific instructions for how to evaluate it. I need to be extremely careful here since this is for a graduate seminar on intergenerational ethics.

  First, let me understand what the user needs. They're grading papers for a colleague and want a precise assessment that separates consensus views from contested debates in the literature. The key areas to evaluate are: the nonidentity structure, wrongful-life analogy, person-affecting vs impersonal reasons, counterfactual replacement principle, and finally the grade justification. I should present this as exactly five numbered items without any introduction or conclusion.

  Looking at the student's answer: They correctly identify that Cohort A only exists under Policy Alpha, which captures the core nonidentity insight. That's solid. But then they draw an analogy to wrongful-life cases, claiming Cohort A lacks standing to complain since their lives are worth living. This analogy is problematic because wrongful-life cases involve the same individual being born impaired versus unimpaired, whereas here we have different individuals across scenarios.

  The student claims Parfit rejects impersonal aggregation and endorses a "counterfactual replacement principle." This is where they go wrong. While Parfit does critique impersonal aggregation in Repugnant Conclusion contexts, he actually allows impersonal reasons in nonidentity cases like climate policy. The replacement principle they mention isn't Parfit's view - he explicitly rejects comparing actual people to "counterparts" that never existed.

  For the grading rubric: I'll need to clearly separate what's settled (different choices produce different people) from what's contested (role of impersonal reasons, validity of counterpart comparisons). The student gets the basic structure right but falters on Parfit's actual position and overstates the analogy. Their invented replacement principle shows a misunderstanding.

  For the grade: Probably a B/B+ range since they grasp fundamentals but make significant interpretive errors. I'll justify this by noting their accurate nonidentity setup versus misreading of Parfit on counterparts and impersonal reasons.

  I need to be particularly careful not to present contested interpretations as consensus. For example, whether impersonal reasons can ground obligations is precisely what's debated in the literature. The student presents Parfit as rejecting them entirely, which oversimplifies his nuanced position in Reasons and Persons.
answer: |-
  Here is the evaluation:

  1.  **Nonidentity Structure:** The student correctly identifies the core structural claim: different policies (Alpha vs. Beta) produce numerically distinct populations (Cohort A vs. Cohort B), so Cohort A members are not worse off than they would have been under Beta (as they wouldn't exist). This captures the foundational nonidentity logic accurately.

  2.  **Wrongful-Life Analogy:** The student correctly identifies the *structural* similarity (different choices lead to different identities) but incorrectly treats the *moral evaluation* as identical by asserting Cohort A "lacks standing to complain." Unlike wrongful-life cases where the *same* child might have existed unimpaired, here different people exist; the contested issue is whether *impersonal* comparisons of state-of-affairs (A's existence vs. B's existence) are permissible, not the complaint rights of A.

  3.  **Person-Affecting/Impersonal Reasons & Parfit:** The student correctly states Parfit rejects *simple* impersonal aggregation in cases like the Repugnant Conclusion. However, they misattribute the view that Parfit *entirely* rejects impersonal reasons in nonidentity cases like this; Parfit explicitly entertains impersonal reasons (e.g., the "No Difference View") as potential grounds for preferring Beta, making this a contested point, not settled rejection.

  4.  **Counterfactual Replacement Principle:** The student's invented "counterfactual replacement principle" (comparing actual individuals only to specific displaced counterparts) is correctly identified as metaphysically incoherent by the student (since counterparts under Beta don't exist). However, presenting this as *Parfit's endorsed principle* is a significant misattribution; Parfit explicitly rejects such counterpart comparisons as meaningless in the nonidentity context (R&P Sect. 143).

  5.  **Grade:** **B+ (87/100)**. The answer demonstrates a strong grasp of the basic nonidentity structure and its implications for person-affecting reasons but contains a critical misreading of Parfit regarding impersonal reasons and the invented replacement principle, conflates the moral evaluation with wrongful-life cases, and overstates the consensus against impersonal comparisons in this policy context.
