answer: |-
  The speaker must defend at all costs the core ontological claim that the 'people' invoked in populism is constituted performatively *through* the representational claim itself, not measured as a pre-existing entity.

  **Strategic Reasoning:** This audience's primary frameworks (normative institutionalism, analytical philosophy, empirical political science) presuppose identifiable subjects (citizens, voters) whose aggregated preferences form a measurable "will." The speaker's thesis fundamentally challenges this ontological grounding. Conceding that the "people" exists prior to representation, even if misrepresented, collapses the argument back into the very liberal critique being contested. All other points (normative dangers, empirical correlates, institutional implications) are secondary and potentially negotiable terrain; this constitutive claim is the foundation.

  **Speaker Q&A Prep Sheet: Likely Objections & Replies**

  **1. Objection (Philosophical - Ontology/Democratic Legitimacy):** "If the 'people' is constituted solely through the performative act of representation, as you claim, then what provides the *normative foundation* for democratic legitimacy? Doesn't this reduce legitimacy entirely to the rhetorical success of the claimant, evacuating any substantive connection to the actual governed population whose consent is supposedly authorised? This seems perilously close to endorsing a purely decisionist model of power, devoid of democratic constraint."

  *   **Reply:** "The point isn't that legitimacy arises *ex nihilo* from rhetoric, but that the *specific collective subject* ('the people') whose authorisation legitimises power is itself a product of the representative claim within the populist operation. Legitimacy still requires recognition *as* authorisation *by* those interpellated into that subject position. The critique is that liberal models often presuppose a pre-constituted, empirically identifiable 'people' whose consent is passively registered, whereas populism *actively constructs* the specific 'people' it claims to represent through its antagonistic discourse and mobilisation. The normative question shifts to the conditions under which this performative constitution is *recognised* as legitimate authorisation by the subjects it constitutes."
  *   **Weakness/Concession:** Concedes that this model makes legitimacy inherently unstable and contingent on successful performative interpellation, potentially weakening traditional liberal safeguards grounded in pre-political rights or institutional procedures. Doesn't provide a robust *alternative* normative foundation beyond successful constitution/recognition.

  **2. Objection (Constitutional - Rule of Law/Constraints):** "Your thesis appears to undermine the very basis for constitutional constraints and counter-majoritarian institutions. If the 'will of the people' is constituted only in the moment of its performative invocation by a populist movement, how can this ephemeral construct be meaningfully constrained by pre-existing legal norms designed to protect minorities or fundamental rights? Doesn't this view implicitly license the populist dismissal of such constraints as illegitimate barriers to the newly manifested popular will?"

  *   **Reply:** "It explains *how* populism operates to challenge constraints, not that it *should*. The constitutional framework exists precisely because the 'people' is *not* a monolithic, permanently constituted entity with a single, infallible will. My analysis shows why populism is particularly adept at bypassing constraints: it claims a unique, immediate mandate from a 'true' people it has just constituted, rendering institutional checks appear as obstructions to that newly revealed sovereign will. Recognising this performative nature *strengthens* the case for robust constitutionalism as a necessary bulwark against the tyranny of a contingently constructed majority."
  *   **Weakness/Concession:** Implicitly accepts that within the populist logic *as described*, constraints *are* seen as illegitimate barriers. The reply relies on the *external* normative defence of constitutionalism against the populist operation it describes, potentially sidestepping whether the theory itself offers internal resources for constraint.

  **3. Objection (Empirical/Analytical - Evidence & Differentiation):** "How does your 'performative constitution' model account for empirical variations? Why do some performative claims successfully constitute a 'people' while others fail? If the 'people' only exists post-hoc, how do you explain the observable persistence of group identities and political preferences *prior* to any specific populist mobilisation? Further, doesn't this definition risk becoming so broad that *all* political representation involves performative constitution, rendering 'populism' an empty category?"

  *   **Reply:** "The model doesn't deny pre-existing social cleavages, grievances, or identities; it argues these are *mobilised* and *reconfigured* into a new, antagonistic political subject ('the real people' vs. 'the elite/corrupt other') through the populist discourse. Success depends on resonance with latent discontents, effective discursive framing, and political opportunity structures – factors your empirical colleagues study. The *differentia specifica* of populism is its *antagonistic* construction of 'the people' as homogeneous and morally pure, opposed to a corrupt establishment, claiming an *unmediated* mandate that bypasses institutional pluralism. Non-populist representation typically works within pluralist frameworks, acknowledging multiple legitimate interests and mediations."
  *   **Weakness/Concession:** Acknowledges pre-existing social material, potentially blurring the 'pure' performativity. Defining the precise threshold between populist and non-populist performative constitution based on antagonism/mediation remains analytically challenging.

  **4. Objection (Philosophical - Agency & Misrepresentation):** "If the 'people' is constituted by the representation, how can we meaningfully speak of the movement *misrepresenting* the people's will? Doesn't your thesis eliminate the conceptual possibility of misrepresentation central to critiques of populist demagoguery? It seems to grant the populist speaker an impossible, almost sovereign, power to create their own mandate ex nihilo, dissolving any notion of popular agency independent of the leader's discourse."

  *   **Reply:** "Misrepresentation becomes possible *after* the initial constitution and *within* the ongoing relationship. Once constituted through interpellation ('We, the forgotten people'), the subjects gain agency. The populist claim is that they *alone* authentically represent this newly constituted subject. Charges of misrepresentation arise when the movement's actions or policies are perceived by those subjects as betraying the very identity and demands discursively constructed – when the gap between the performative claim and subsequent actions becomes untenable to the constituents. The agency lies in the subjects' ongoing recognition or withdrawal of authorisation."
  *   **Weakness/Concession:** Introduces a temporal sequence (constitution *then* potential misrepresentation) that softens the initial radical performativity. Relies heavily on the subjects' *perception* of betrayal, which is contestable.

  **5. Objection (Constitutional - Sovereignty & Authorisation):** "Your model of 'retroactive authorisation' seems to invert the classical liberal democratic sequence. We typically understand authorisation flowing from the people (principal) to representatives (agents) via mechanisms like elections. You suggest authorisation flows from the representative claim to constitute the people (agent creating the principal). How is this compatible with any coherent theory of popular sovereignty? Doesn't this render the 'people' entirely derivative and subordinate to the claimant?"

  *   **Reply:** "It highlights a paradox inherent *within* representation itself, particularly acute in populism. The claim to represent *presupposes* the existence of a principal (the people), yet the act of representation also helps *define* that principal. Populism exploits and radicalises this circularity by claiming to *discover* or *unveil* a pre-existing but silenced people, but in doing so, it actively shapes its identity and demands. Sovereignty remains *attributed* to the people, but the populist act claims a unique capacity to channel it immediately, bypassing the complex mediations of pluralist democracy. The 'derivative' moment is the specific *articulation* of the sovereign subject, not the source of sovereignty itself, which remains formally vested in 'the people'."
  *   **Weakness/Concession:** Navigates a difficult paradox. The distinction between the formal locus of sovereignty (the people) and the performative articulation of *which* people and *what* it wills is subtle and may feel like special pleading to critics.

  **6. Objection (Normative - Danger of Relativism):** "By severing the 'will of the people' from any empirical anchor or pre-political moral foundation and locating it solely within the performative success of a claim, doesn't your thesis lead to a dangerous normative relativism? If any successfully constituted 'people' via a populist performance is self-authorising, what grounds do we have to criticise morally abhorrent populist movements beyond their mere effectiveness?"

  *   **Reply:** "The thesis is *analytical*, not *normative*. It describes a mechanism, not an endorsement. Critiquing abhorrent movements requires *external* normative standards – human rights, liberal equality, pluralism – precisely because the internal logic of populist self-authorisation offers none. Recognising the performative nature *exposes* this normative vacuum within the populist operation itself and underscores the vital importance of maintaining robust external normative frameworks and institutions immune to the fluctuating demands of performatively constituted majorities."
  *   **Weakness/Concession:** Fully concedes that the theory itself provides no internal normative resources for critique; it relies entirely on importing external liberal democratic norms, which the populist operation, by its nature, rejects as illegitimate constraints.

  **The Nightmare Question:**  
  **"If the 'people' is performatively constituted only *through* the populist representation, how can you distinguish this process conceptually from the *original constitutive act* of any political community (e.g., a revolutionary 'We the People' founding a republic)? Doesn't this collapse the distinction between extraordinary constituent power and ordinary politics, rendering *all* foundational democratic claims essentially populist – and therefore, by your own implication regarding constraints, inherently threatening to liberal constitutional order?"**

  *   **Survival Strategy:**  
      1.  **Acknowledge the Parallel:** "You rightly identify a profound structural similarity regarding the constitutive moment of *any* political subject claiming sovereignty."
      2.  **Distinguish Context:** "The critical difference lies in the *context* and *ongoing practice*. Foundational acts (even if performative) establish frameworks *for* pluralist politics and institutionalised constraint. Populism, operating *within* an established constitutional order, mimics the *form* of the foundational act ('bringing power back to the *real* people') but does so to *dissolve* pluralism and constraints *within* that order, claiming a permanent state of exception against 'the corrupt elite'."
      3.  **Refocus on the Critique:** "The danger for *liberal democracy* is precisely this *immanent* use of constituent power rhetoric to undermine the constituted order *from within*, exploiting the democratic principle against its liberal safeguards. My analysis helps explain this specific operational logic."  
      *Avoid:* Getting bogged down in defining the exact nature of the original constituent moment or conceding that all democracy is fundamentally populist. Emphasise the *institutional context* and the *target* (pluralism/constraints) of the populist operation within existing orders. Redirect to the core argument about populism's specific mode of representation within constitutional democracies.
