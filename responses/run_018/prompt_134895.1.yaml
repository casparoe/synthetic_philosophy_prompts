answer: |-
  Here’s a rigorous specification of desiderata for a theory of multipolar traps (MTs) and races-to-the-bottom (RTBs), designed to force tradeoffs and expose limitations. **The core tension is between explanatory breadth (covering all cases) and mechanistic precision (avoiding conceptual blurring).**

  ---

  ### **I. Non-Negotiable Desiderata**  
  *(Failure to satisfy these invalidates the theory)*  

  1. **Explain Asymmetric Power Dynamics**  
     - *Why*: MTs/RTBs involve *coercive interdependence* (e.g., weaker actors forced into races by dominant players). Must distinguish from symmetric collective action problems (CAPs).  
     - *Test Case*: AI race (Microsoft/Google vs. startups; states vs. firms) ≠ fisheries collapse (symmetric overfishing).  

  2. **Distinguish True Traps from Hard CAPs**  
     - *Why*: True MTs have **no unilateral exit ramps** (defection dominates even with foresight), while CAPs allow cooperative equilibria under institutional reform.  
     - *Non-Collapsible Distinction*: MT = self-reinforcing system where *individual rationality* destroys *all* good outcomes; CAP = Pareto improvements exist but require coordination.  

  3. **Epistemic Fragmentation Traps (EFT)**  
     - *Why*: Agents operate under **incommensurate worldviews** (e.g., climate deniers vs. scientists; AI safety vs. capability researchers). Theory must model how divergent beliefs *reshape perceived payoffs*, not just hide information.  
     - *Kills*: Most game-theoretic accounts (assume common knowledge of payoffs) and Moloch allegories (treat misalignment as fixed).  

  ---

  ### **II. Essential Explananda**  
  *(The theory must cover these without ad-hoc fixes)*  

  4. **Climate Inaction**  
     - *Requirement*: Explain why tech/capital-rich actors (e.g., US/EU) fail to lead despite self-interest in adaptation. Must integrate **free-riding + fossil lock-in + EFT** (e.g., "green growth" vs. "degrowth" epistemes).  

  5. **AI Development Races**  
     - *Requirement*: Account for **triple asymmetry**—commercial vs. safety incentives, state vs. corporate actors, short-term vs. long-term risks. Cannot reduce to prisoner’s dilemma.  

  6. **Fisheries Collapse**  
     - *Requirement*: Explain why some fisheries collapse (e.g., Atlantic cod) while others stabilize (e.g., Alaskan salmon). Must handle **institutional plasticity** (e.g., quotas vs. ITQs).  

  ---

  ### **III. Forbidden Collapses**  
  *(Critical distinctions the theory must preserve)*  

  7. **Race to Bottom (RTB) vs. Race to Top (RTT)**  
     - *Why*: RTBs erode standards (e.g., tax havens), RTTs escalate risk-taking (e.g., AI capabilities). **RTB has Pareto-dominated outcomes; RTT may have "winner-takes-all" payoffs.**  
     - *Test*: AI race is RTT (winner gains); corporate deregulation is RTB (all lose).  

  8. **Structural Trap vs. Behavioral Failure**  
     - *Why*: MTs emerge from *system design* (e.g., capitalism’s growth imperative), not just myopia/malice. Theory must identify **invariant triggers** (e.g., non-excludable goods + rivalry).  

  ---

  ### **IV. Institutional Consistency**  
  *(Must align with real-world constraints)*  

  9. **Partial Enforceability**  
     - *Why*: Institutions (e.g., treaties, regulations) are always leaky. Theory must show how **even strong institutions** fail in MTs (e.g., Paris Agreement’s lack of sanctions).  

  10. **Endogenous Rule-Making**  
      - *Why*: Actors *reshape rules* during races (e.g., tech lobbying on AI governance). Cannot treat institutions as static.  

  ---

  ### **V. Dealbreaker Desideratum**  
  **Epistemic Fragmentation Traps (EFT)** sinks most frameworks:  
  - **Game Theory** fails (common knowledge assumption).  
  - **Institutional Economics** fails (treats preferences as stable; EFT makes them fluid).  
  - **Moloch Framing** fails (reifies "alignment" as binary; EFT makes it multivalent).  

  ---

  ### **VI. Scoring Existing Frameworks**  
  | **Framework**       | **EFT** | **Trap vs. CAP** | **Asymmetry** | **Institutions** | **Verdict** |  
  |---------------------|---------|------------------|---------------|------------------|-------------|  
  | Game Theory         | ✘       | △ (Limited)      | △ (Symmetric) | △                | Fails EFT, oversimplifies power |  
  | Institutional Econ  | ✘       | ✔                | △             | ✔                | Fails EFT; static preferences |  
  | Moloch (S. Alexander)| ✘       | ✘ (Conflates)    | △ (Allegory)  | ✘                | Poetic but non-predictive |  
  | Evolutionary GT     | △       | ✔                | ✔             | ✘                | Best on asymmetry; weak on EFT/institutions |  

  ---

  ### **VII. Inherent Tensions**  
  - **Breadth vs. Precision**: Covering climate (slow) + AI (fast) risks overgeneralizing.  
  - **EFT vs. Institutional Fixes**: If agents don’t share reality, top-down solutions fail.  
  - **Non-Negotiables Clash**: EFT + institutional realism may be incompatible—in a fragmented world, *no* institution is universally legible.  

  **Strongest theory** would:  
  1. Treat EFT as a first-order driver (not a perturbation).  
  2. Model MTs as **dynamic systems with emergent payoff matrices**.  
  3. Accept that some traps (e.g., AI) have **no institutional solution** without exogenous shock.  

  → If your priority is *policy design*, sacrifice EFT depth for institutional realism.  
  → If your priority is *existential risk*, EFT is non-negotiable.
