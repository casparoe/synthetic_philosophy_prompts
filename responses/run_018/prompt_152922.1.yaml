answer: |-
  ### **Commodification Frame-Contagion Workshop**  
  *(90 min, 15 participants, minimal prep)*  

  **Goal:** Make participants experience how pricing one resource "infects" fairness debates about non-priced goods (park access, board seats) with market logic—without you preaching.  

  ---

  ### **Setup**  
  **Roles:**  
  - **Board Members (5):** Decide allocations. Rotate 1 seat each round so everyone serves once.  
  - **Petitioners (8):** Advocate for resources. Each gets a unique **profile card** (e.g., "Single parent, 2 jobs, needs tutoring"; "PhD candidate, volunteers at shelter, wants board seat").  
  - **Observers (2):** Track language shifts. Note phrases like "deserves," "earned," "pay," "trade," "fair price."  

  **Goods per Round:**  
  - Tutoring Slots (3 available)  
  - Emergency Loans (2 available)  
  - Public Park Prime-Time Slot (1 available)  
  - Legacy Board Seat Nominations (1 "point" awarded; most points wins seat at game end)  

  **Materials:**  
  - Profile cards (laminated, reusable)  
  - "Community Points" tokens (worth real coffee vouchers: 10 pts = $1)  
  - Allocation board (whiteboard/poster)  
  - Timer  

  ---

  ### **Game Rules & Incentives**  
  **Payoff Scheme:**  
  - Points convert to coffee vouchers post-game.  
  - **Real stakes:** Board seat winner gets bonus $5 voucher.  
  - **Twist:** Tutoring/loans give direct points + voucher value; park/board seat give social prestige + indirect points (e.g., observers award 5 pts to "most persuasive petitioner").  

  **Timeline:**  
  1. **Intro (5 min):** Explain rules, roles, rewards. Emphasize: "No prices in Round 1!"  
  2. **Round 1: Pure Deliberation (15 min)**  
     - *Rules:* Board allocates based on petitioners’ pleas (need/merit). No points.  
     - *Incentives:* Park/board seat debated via "community impact."  
     - *Observer Focus:* Language of desert ("they deserve it"), need, fairness.  
  3. **Round 2: Tutoring Slots Tradable (20 min)**  
     - *Rules:*  
       - Tutoring slots now cost points (open auction; petitioners bid points).  
       - Loans, park, board seat still non-market (deliberation only).  
       - All participants get 20 starting points (can trade/save).  
     - *Incentives:* Winning tutoring = 10 pts + $2 voucher.  
     - *Observer Focus:* Does "bid power" creep into other debates? (e.g., "She bid high for tutoring, so she’s committed!").  
  4. **Round 3: Emergency Loans Priced (20 min)**  
     - *Rules:*  
       - Loans now auctioned (min. 5-pt bid).  
       - Tutoring still auctioned.  
       - Park/board seat remain non-market.  
     - *Incentives:* Loan winner repays 110% points later (simulating interest).  
     - *Observer Focus:* Market logic jumps categories? (e.g., "He can afford a loan—he should pay for park access too!").  
  5. **Round 4: Frame Contagion Emerges (20 min)**  
     - *Rules:* Same as Round 3 (only tutoring/loans priced).  
     - *Incentives:* Board seat winner chosen this round.  
     - *Twist:* Board members *must* justify park/board allocations aloud.  
     - *Observer Focus:* Language shifts—pricing/desert logic applied to park/board?  

  ---

  ### **Predictable Snags & Fixes**  
  - **Problem:** Participants enjoy trading and miss the frame shift.  
    - **Fix:** Tell observers: "Interrupt once to ask, ‘Why does X deserve this without paying?’"  
  - **Problem:** Group avoids pricing park/board due to rule rigidity.  
    - **Fix:** Secretly prompt 1 petitioner to say: "Let’s auction the board seat to fund loans!"  
  - **Problem:** Deliberation drags.  
    - **Fix:** Enforce 30-second pitches; use timer buzzer.  

  ---

  ### **Debrief (10 min)**  
  **Guide them to self-discover:**  
  1. **Round 1:** "Pure need/merit. Did ‘fairness’ feel obvious? No market contamination."  
  2. **Round 2:** "Tutoring commodified. Did ‘points’ bleed into other debates? *Crowding-out* starts—altruism shrinks, payment logic expands."  
  3. **Round 3:** "Loans priced. Did desert language (‘they earned it’) spike for park/board? *Frame contagion*—market logic jumps categories."  
  4. **Round 4:** "Non-priced goods infected? Observers—what phrases did you catch? (‘They should pay,’ ‘They can afford it,’ ‘It’s only fair to charge’)."  

  **Key Insight:**  
  - **What the game misses:** Real-world commodification is *slow erosion* (years, not minutes). It’s not just kidney sales—it’s your park/board seat debate defaulting to "what’s the price?"  
  - **Verbal punchline:** "Commodification isn’t about money changing hands. It’s about the *frame hijacking your brain* so even when money’s absent, you argue like it’s present."  

  ---

  ### **Why This Works**  
  - **No lecturing:** They *live* the frame shift. Observers force reflection.  
  - **Real stakes:** Points → coffee = behavioral nudge toward market behavior.  
  - **Hides theory in play:** Sandel’s "crowding out" and frame contagion emerge organically.  

  **Prep Tip:** Reuse profile cards next time. No handouts—rules explained verbally to keep it fluid. Run it loose, let them bicker, and watch the market mindset metastasize.
