  Finally, the counterfactual test: if we reconceptualized education as pure private good, we'd have to abolish selective admissions entirely (pay-to-play) and eliminate public subsidies. If as pure public infrastructure, we'd need open admissions with massive capacity expansion - imagine universities having the same admission rate as K-12 schools. The thought experiment exposes how our current hybrids are kludges between incompatible ideals.

