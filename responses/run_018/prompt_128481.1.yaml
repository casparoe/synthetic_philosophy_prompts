answer: |-
  ## Stipend Proposal: Why Promises Bind – Beyond Static Obligation & the Revision Debt Hypothesis  

  **Core Question:** Does the binding force of promises stem primarily from an *asymmetric revisability cost* embedded in a shared normative framework (a "normative scoreboard"), where the promisee's reliance restructures their practical landscape, generating a unique "revision debt" for the promisor? Or is this just a novel redescription of expectation-based theories (e.g., Scanlon)?  

  **Why Existing Answers Leave This Open:** The standard trio – will theories (obligation from the promisor's act), expectation theories (obligation from harm to promisee's expectations), and practice theories (obligation from social rules) – treat the *promisee's normative position as fundamentally static*. The obligation "lands on" the promisor, triggered by their utterance or the promisee's expectation. They don't adequately model the *dynamic, co-constitutive* process *after* the promise: the promisee actively restructures their plans based on the promise, incurring specific reliance-costs (opportunities forgone, plans made brittle). This restructuring, I argue, isn't just a *consequence* the promisor must consider (Scanlon), but actively *creates a new normative structure* – the shared "scoreboard" – where the promisor now owes a specific kind of "revision debt" to undo this restructuring cleanly. The asymmetry (it's way costlier/messier for the promisee to revise *their* plans than for the promisor to revise *their* intention *before* reliance) is the engine of bindingness. Existing theories don't isolate or explain this mechanism.  

  **Four-Month Plan:**  
  *   **Month 1: Formalizing the "Normative Scoreboard" & Revision Debt:** Develop the core model. Define "normative scoreboard" as the shared, dynamic representation of entitlements, permissions, and plans between promisor/promisee. Articulate "revision debt" – the unique normative burden the promisor incurs *specifically* to compensate for the structural disruption caused *to the promisee's planning landscape* by their reliance if the promise is broken. Distinguish sharply from guilt (internal) or sanctions (external).  
  *   **Month 2: Stress-Testing the Mechanism:** Apply the model to hard cases.  
      *   *Coerced Promises:* Does the promisee genuinely restructure plans? If not, minimal revision debt = weak/no bindingness?  
      *   *Third-Party Reliance:* Why does the revision debt primarily bind the *promisor* to the *promisee*, even if others rely? Focus on the direct dyadic restructuring of the shared scoreboard.  
      *   *Gratuitous Promises:* How does reliance manifest without material benefit? Emphasize the planning *commitment* itself as restructuring.  
  *   **Month 3: Comparison & Collapse Risk:** Pit the model directly against Scanlon's expectation damage principle and key will/practice theorists. Does "revision debt" explain cases Scanlon struggles with (e.g., trivial promises where expectation harm seems minimal, but obligation feels strong)? Crucially, does it offer a distinct *mechanism* (asymmetric cost of revising interdependent plans) or just repackage expectation harm? Identify potential collapse points.  
  *   **Month 4: Synthesis & Essay Draft:** Refine the argument, solidify the distinction from expectation theories, articulate the unique explanatory power of the "revision debt" mechanism (e.g., explaining the *specific* wrong of breaking a promise vs. general letting down), and produce a polished essay draft.  

  **Success vs. Failure:**  
  *   **Success:** A clear articulation of the "normative scoreboard" and "revision debt" mechanism that:  
      *   Explains the *distinct wrongness* of promise-breaking compared to merely disappointing someone or failing a non-promissory expectation (e.g., highlighting the unique *structural entanglement* caused by reliance).  
      *   Offers novel insights into hard cases (coercion, third parties) that existing theories handle awkwardly.  
      *   Demonstrates how this mechanism is logically prior and distinct from expectation harm (while often causing it) – the debt arises from the *act of reliance restructuring the shared framework*, not (just) the harm of dashed expectations.  
  *   **Failure:** If the model:  
      *   Cannot consistently distinguish the obligation generated by a promise from the obligation generated by creating *any* high-stakes expectation (e.g., "I *expect* you to pick me up" vs. "You *promised* to pick me up").  
      *   Collapses entirely into Scanlon's principle upon scrutiny, showing "revision debt" is merely a vivid metaphor for expectation damage.  
      *   Fails to explain why the debt binds *specifically to the promisee* in a way expectation harm theories struggle with.  

  **Honest Scope Check:** Yes, this is feasible in 4 months *without empirical work*. It's purely conceptual/analytical philosophy. The core task is rigorous argument development, model refinement, and textual engagement with existing theories. The challenge lies in the precision needed to carve out a genuinely novel mechanism and defend it against collapse. It requires deep focus on the logic of the proposed model and its implications, not data collection. The monthly plan is aggressive but achievable for an intense theoretical deep dive.  

  Verdict: Promises bind because the promisee's reliance restructures the shared normative landscape, imposing an asymmetric "revision debt" on the promisor that is distinct from causing expectation harm.
