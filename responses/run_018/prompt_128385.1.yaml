answer: |-
  1.  Conservators at the "Heritage Art Trust" secretly, over decades, replace each degraded clay particle of a fragile 18th-century sculpture with an undetectable, chemically identical synthetic polymer, meticulously preserving its exact form, weight, texture, and displayed artistic function throughout the process, with the substitution remaining entirely undisclosed to the public and subsequent museum staff.
  2.  The form-based constitutionalist argues the original statue survives because its essential identity-constituting features—its specific artistic form, causal history, and ongoing function as the museum's displayed artwork—persist uninterrupted despite the complete material replacement.
  3.  The strict mereological essentialist argues the original statue was destroyed when the first original particle was permanently removed, contending that the final object, composed entirely of different (synthetic) parts, is merely a replica, regardless of its identical appearance and function.
  4.  The structural feature driving divergence is the *hidden nature of the substitution*; public knowledge would likely lead both sides to see the final object as a replica (constitutionalist seeing interrupted history/authenticity, essentialist seeing different parts), but secrecy isolates the conflict to pure metaphysical persistence versus material composition.
  5.  The mereological essentialist attacks the premise by arguing that the hidden substitution introduces an illegitimate epistemic element, asserting that true metaphysical identity cannot depend on observers' ignorance and that the object's destruction/replacement is a physical fact independent of anyone's knowledge.
