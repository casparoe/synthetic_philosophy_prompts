  ok so i've been trying to figure out if generations like boomers and gen z are actually real things or just labels marketers made up. here's my gut on some cases:

  baby boomers feel real to me. there was actually a huge spike in births after world war two and they all grew up with the same tv shows and economy. millenials feel fake though - it's just people born around 1980 to 2000 but nothing really ties them together except being called millenials.

  gen z is also fake, it's literally just young people right now with a new name. but then the kids who were in high school when covid hit in 2020-2022 feel like a real group. they missed prom and did zoom school together. that cuts across millenials and gen z so it doesn't match birth years at all.

  people who remember seeing 9/11 on tv live feel like a cohort too, but that includes some gen x and some millenials, so birth years don't capture it. the always online kids who got a smartphone before middle school - i think that's real, but is it a generation or just a tech thing?

  i keep going back and forth on dial-up kids vs broadband kids. like, growing up with dial-up internet feels like it could be a real boundary, but maybe it's just nostalgia talking.

  is there one principle that explains which ones are real kinds and which are just labels? maybe it's about shared formitive experiences that change your psycology? but then why do boomers feel real and millenials dont? and what does that say about the covid high schoolers?

  i also just made up this idea of algorithmic cohorts - people whose first news came from tiktok instead of newspapers or tv. i don't know if anyone actually studies that but it feels like it could be a real cohort. what would the principle say about that?

  sorry if this is rambling, i don't have a philosophy background, just been thinking about it on my own.
