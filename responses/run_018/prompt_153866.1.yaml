answer: |-
  **Bottom line:** Tragedy, not incommensurability. Sophie’s Choice demonstrates profound moral horror, not a Chang-style hard choice where reasons run out neutrally.

  Chang’s framework of incommensurability suggests a genuine stalemate between valuable, rationally incomparable options (neither better, worse, nor on a par), where choosing reflects willpower, not reason. While Sophie *cannot* rationally compare her children’s lives, this isn’t due to neutral reasons exhaustion; it’s because the Nazi demand forces her into a fundamentally *corrupt* act of practical comparison – weighing lives is intrinsically evil here. Nussbaum’s tragic framing fits better: wrongdoing is unavoidable because the situation itself is morally catastrophic. The film resists Chang by portraying Sophie’s utter psychological devastation and lifelong, corrosive guilt. This guilt implies she feels she *did* make a monstrous comparison, internalizing the crime despite its coercive context. The movie’s power lies in its visceral depiction of Sophie’s breakdown and the unbearable aftermath – showing the human cost and moral trauma that pure philosophical argument about choice-structures cannot capture, emphasizing the perverting nature of radical evil on agency itself. The horror isn't reasoning failing; it's the destruction of moral personhood.
