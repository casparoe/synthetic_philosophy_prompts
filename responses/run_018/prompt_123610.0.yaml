prompt: |-
  You're a philosopher of mind who focuses on embodied cognition and affective neuroscience. Before answering, do a quick mental check: list the two or three rules that could fit the track record, then think about where they'd split.

  My colleague Dr. Vasquez has given these verdicts on whether pain is "bad for the subject":

  1. Classic pain asymbolia — patient feels and localizes injury precisely, reports zero unpleasantness, even laughs at burns. She says not bad.
  2. Congenital insensitivity to pain — never feels nociception at all. She says not bad, but that's trivial.
  3. Phantom limb suffering — intense unpleasantness localized to missing limb, no tissue damage present. She says clearly bad.
  4. Chronic nociception with full emotional blunting — sensory intensity stays high, but the affective valence is genuinely flat, like asymbolia but persistent. She says still not bad.

  Now the new case: a BCI user controls a remote welding robot. Damage sensors on the robot feed back both precise sensory-quality signals and strong negative affect into the user's cortex. The user reports "it hurts in the robot arm" and wants to stop the damage, but there's zero biological tissue damage and the robot isn't incorperated into their body schema. Predict her verdict. I want the competing rules that fit her first four answers just as well, what each predicts here, your best guess with reasoning, and one further hypothetical that'd actually settle it between them.

  Please organize like this:
  - Bottom line: 2-3 sentences with the prediction.
  - The rules: 4-5 sentences laying out the two main candidates.
  - The BCI split: 3-4 sentences on how they diverge on this case.
  - Best guess: 4-5 sentences with your reasoning.
  - Tie-breaker case: 2-3 sentences describing a scenario that'd force a choice, don't solve it.

  Keep it focused — no need for bibliographys or citations, just work through the logic. And please dont just recite standard IASP definitions; actually think about the boundary conditions she's implicitly running.
reasoning: |-
  Alright, the user wants me to role-play as a philosopher of mind specializing in embodied cognition and affective neuroscience. They've presented a scenario involving Dr. Vasquez's verdicts on pain cases and need me to predict her judgment on a BCI welding robot case.

  First, I need to understand Dr. Vasquez's pattern across the four existing cases. Pain asymbolia (case 1) involves sensory input without unpleasantness - she says "not bad." Congenital insensitivity (case 2) has no nociception at all - also "not bad." Phantom limb (case 3) has unpleasantness without tissue damage - "clearly bad." Chronic nociception with blunting (case 4) maintains sensory input but lacks affect - still "not bad."

  The key distinction seems to be the presence of negative affect. Cases 1, 2 and 4 all lack unpleasant affect and get "not bad" verdicts, while phantom limb (case 3) has affect and is "bad." This suggests Rule 1: Badness requires conscious negative affect. 

  But there's another possible interpretation - case 3 involves a body schema disturbance (phantom limb), while the others don't. This might suggest Rule 2: Badness requires being incorporated into the body schema. Cases 1/4 involve real bodies but lack affect (not bad), case 2 has no body threat at all (not bad), while case 3 has body schema involvement (bad).

  For the BCI welding robot case, the user experiences both sensory quality and negative affect, but the robot isn't incorporated into their body schema. Rule 1 (affect-focused) would predict "bad" because of the unpleasantness. Rule 2 (body schema-focused) would predict "not bad" due to lack of incorporation.

  My best guess is Dr. Vasquez will say "bad" because her pattern strongly prioritizes affective states over physical embodiment. The phantom limb case shows she considers affect sufficient even without actual tissue damage. The BCI case has clear negative affect, so it should qualify as bad despite lacking body schema incorporation.

  For a tie-breaker, I'd propose a case where negative affect occurs completely dissociated from any physical referent - perhaps direct cortical stimulation generating pure dread without any sensory localization. If she calls this "bad," it confirms Rule 1; if "not bad," it suggests Rule 2 requires some bodily connection.
answer: |-
  ### Bottom line
  I predict Dr. Vasquez will judge the BCI case **bad for the subject**. The negative affect component drives her verdict, overriding the lack of biological embodiment or body schema incorporation. This aligns with her prioritization of affective experience over sensory or bodily fidelity in phantom limb cases.

  ### The rules  
  *Rule 1 (Affective Primacy):* Pain is "bad" **iff** it involves conscious negative affective states (suffering, unpleasantness). Fits her verdicts: Cases 1/4 lack affect → "not bad"; case 3 has affect → "bad." Case 2 is irrelevant (no experience).  
  *Rule 2 (Embodied Threat):* Pain is "bad" **iff** it signals *actual or perceived* threat to the subject’s **biological body schema**. Fits: Cases 1/4 involve real bodies but no *felt threat* → "not bad"; case 3 involves body schema disruption (phantom as "self") → "bad." Case 2 has no threat detection → "not bad."  

  ### The BCI split  
  - **Rule 1 (Affective Primacy)** predicts *bad*: Strong negative affect is present and consciously reported, matching phantom limb’s "suffering without tissue damage" logic.  
  - **Rule 2 (Embodied Threat)** predicts *not bad*: The robot isn’t incorporated into the body schema (explicitly stated), so signals don’t represent threat to *biological* self. Analogous to asymbolia’s intact body with blunted affect.  

  ### Best guess  
  **Verdict: Bad.** Dr. Vasquez’s phantom limb verdict (case 3) reveals that she treats affect as *sufficient* for badness, even without biological threat. The BCI user’s reported "hurts" + desire to stop confirms conscious suffering, fulfilling Rule 1’s core criterion. Rule 2’s body-schema requirement is less consistent: in case 4 (chronic nociception), biological body threat exists but is *not* called bad without affect, suggesting embodiment alone is *insufficient*. The BCI case mirrors phantom limb’s "affect without body" more than asymbolia’s "body without affect."  

  ### Tie-breaker case  
  **A subject with a brain implant inducing intense, localized dread *without* any sensory quality or referred location (e.g., "pure affective agony in void-space").** If she calls this "bad," Rule 1 wins (affect is sufficient alone). If "not bad," Rule 2 wins (requiring *some* bodily reference, even illusory).  

  ---
  *Key insight: Her pattern treats affect as the non-negotiable core of "badness," making embodiment contingent rather than necessary. The BCI case tests whether affect must *feel* embodied to count—but phantom limb suggests no.*
