prompt: |-
  I have recently been reflecting on whether my moral convictions can survive the thought that they are evolutionary leftovers, and I keep encountering the analogy that our moral sense is like our sweet tooth: both evolved to solve adaptive problems rather than to track objective truths, so we should no more take moral revulsion at betrayal as evidence of objective wrongness than we take a craving for sugar as evidence of nutritional goodness. Could you lay out the correspondence table—taste receptor, evolutionary pressure, objective nutritional fact, corrective science, and their moral counterparts—then show where the mapping breaks, particularly whether moral cognition involves representational tracking of structural relations in social exchange that taste entirely lacks, and whether the analogy smuggles in a behaviourist picture of judgement that moral realists reject. Separate the disanalogies that undermine the debunking conclusion from those that are merely decorative, say whether a better analogy exists, and tell me whether the sceptical conclusion survives once the sweet-tooth comparison is audited rather than assumed. Please answer in British English.
