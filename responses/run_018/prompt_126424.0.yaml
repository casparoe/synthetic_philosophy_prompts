  But where this gets philosophically juicy is where the mapping fractures. The user specifically wants two fault lines exposed: (1) whether moral judgment involves tracking real social relations unlike taste's non-representational nature, and (2) if the analogy smuggles in behaviourist assumptions. I recall Sharon Street's work on this - her Darwinian dilemma claims moral realism is implausible because evolution wouldn't track moral truths. But moral realists like David Enoch counter that evolution could select for truth-tracking in social cognition, unlike taste which merely correlates with survival value.

