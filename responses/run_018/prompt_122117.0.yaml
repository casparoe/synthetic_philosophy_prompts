prompt: |-
  Write the complete specification of desiderata that any philosophical reconstruction of Buddhist moral evaluation must meet in order to accommodate consequentialist reasoning about suffering reduction—reasoning that aggregates welfare across large numbers of beings and extended temporal scales—without reducing the view to either a pure outcome-maximizing calculus or to a pure intention-based karma-theory in which only present mental state (cetanā) determines moral value.

  For each desideratum, provide the motivating case or doctrinal distinction behind it, indicate whether it is non-negotiable within mainstream Buddhist commitments or negotiable only within specific interpretive camps (such as Theravāda Abhidharma analysis versus Mahāyāna bodhisattva ethics), and flag any pair you believe is jointly unsatisfiable. In particular, your list must cover:

  1. The temporal-structure problem: how the theory must distinguish immediate karmic fruit from matured result (vipāka) when assessing long-range suffering reduction, and whether this distinction blocks consequentialist evaluation of distant outcomes.

  2. The aggregation problem under anātman: whether welfare can be summed across beings given the denial of a permanent self, and if so, what replaces individual identity as the unit of moral accounting.

  3. The upāya constraint: how skillful-means exceptions are to be bounded so that they do not render all outcome-based calculation vacuous, and what distinguishes a legitimate expedient from rationalized harm.

  4. The scope of moral patients: the status of currently non-existent future beings and of wild-animal suffering in ecosystems, given that traditional frameworks center on intentional action directed at present sentient subjects.

  5. The interdependence requirement: consistency with pratītyasamutpāda (interdependent origination) without committing the naturalistic fallacy of deriving normative weight solely from ecological or causal interconnectedness.

  Then identify which single desideratum eliminates the largest number of recent hybrid accounts, and say whether the full set is jointly satisfiable or whether a subset must be abandoned. Do not supply a bibliography, citation list, or named reading recommendations; work only from the criteria themselves.
reasoning: |-
  Okay, the user is asking for a detailed specification of desiderata for a philosophical reconstruction of Buddhist moral evaluation that incorporates consequentialist reasoning about suffering reduction. They want it to avoid reducing to pure outcome-maximizing calculus or pure intention-based karma theory. Let me break down each of the required points.

  First, the temporal-structure problem. How does karma's immediate fruit versus long-term vipāka affect evaluating distant outcomes? The key here is maintaining the distinction between instantaneous karmic results and the matured effects. The challenge is to reconcile this with consequentialist evaluation without undermining the doctrinal necessity that karmic seeds ripen over time. Non-negotiable across traditions because it's core to karma theory.

  Next, the aggregation problem under anātman. Since there's no permanent self, how can welfare be summed across beings? The unit of moral accounting needs to shift to something like moments of experience or sentient events. This might be negotiable; Theravāda might resist aggregation more than Mahāyāna, which has bodhisattva ideals focused on collective welfare.

  Then the upāya constraint. Skillful means can't be so flexible that they allow any harmful action. Need boundaries to prevent rationalization of harm. Non-negotiable in Mahāyāna but handled differently in Theravāda. Examples like breaking precepts for greater good must have clear criteria, like bodhisattva vows and absence of afflictions.

  Scope of moral patients: Future beings and animals. Traditional karma focuses on present intentional actions, but consequentialism needs to include future suffering and non-human life. Theravāda might limit to current sentient beings, while Mahāyāna extends to all beings across time. This is negotiable, especially regarding animal suffering and future entities.

  Interdependence requirement: Pratītyasamutpāda must inform ethics without committing the naturalistic fallacy. Normative weight shouldn't come solely from interconnectedness. Non-negotiable to avoid misapplying interdependence as a moral basis. Needs a separate ethical framework.

  The user probably wants a coherent system that respects Buddhist doctrines while addressing modern ethical challenges like long-term suffering reduction. Their deeper need might be reconciling ancient teachings with contemporary issues like effective altruism or environmental ethics. They might also be interested in which aspects are flexible versus fixed across traditions.

  The hardest desideratum is likely the aggregation problem under anātman. Many hybrid accounts fail here because they implicitly assume a self when summing welfare. If each moment is insubstantial, aggregating across beings or time becomes philosophically tricky. Mahāyāna's use of śūnyatā might offer a path, but it's still a major hurdle.

  Assessing joint satisfiability: It's tough but possible. Sacrificing strict Theravāda views allows Mahāyāna approaches to handle aggregation and scope. However, the upāya constraint and avoiding naturalistic fallacy require careful balancing. Maybe all can be met in a Mahāyāna framework, but not without stretching some interpretations.
answer: |-
  Here is the complete specification of desiderata for a Buddhist-consequentialist hybrid moral theory:

  **Core Desiderata:**

  1.  **Temporal-Structure Solution:**
      *   **Specification:** The theory must preserve the distinction between immediate karmic fruits (e.g., mental states arising *now* from volition) and matured results (*vipāka*, e.g., rebirth, circumstantial suffering/pleasure *later*) *while allowing* the long-term *vipāka* consequences of actions to be morally relevant factors in consequentialist assessment. It must explain *how* evaluating actions based on their projected long-term suffering-reduction potential is coherent with the doctrine that karmic seeds ripen indeterminately over vast timescales, without guaranteeing that good long-term intentions yield good *vipāka* or vice-versa.
      *   **Motivation:** Distinguishes the direct, volitional quality of an act (immediate fruit) from its complex, conditioned outcomes (matured result). Crucial for karma theory and avoiding naive utilitarianism.
      *   **Negotiability:** **Non-negotiable core.** The distinction is fundamental to all Buddhist schools. However, the *degree* of indeterminacy and the *weight* given to long-term *vipāka* in moral evaluation may vary (e.g., stricter Theravāda causality vs. Mahāyāna emphasis on bodhicitta's transformative power affecting outcomes).

  2.  **Aggregation Solution under Anātman:**
      *   **Specification:** The theory must provide a coherent basis for summing welfare (suffering/pleasure) across distinct sentient beings *without* positing permanent selves (*ātman*) as the subjects of that summation. It must define the "unit" of moral accounting (e.g., moments of experience, sentient events, streams of consciousness *as processes*) and explain how value aggregates across these insubstantial units without reifying them. This requires a non-identity-based account of moral considerability and aggregation.
      *   **Motivation:** Anātman is the cornerstone Buddhist ontology. Consequentialist aggregation requires counting *something*, but that "something" cannot be a permanent entity. Avoids collapsing into individualism or nihilism.
      *   **Negotiability:** **Negotiable in scope/interpretation.** The *fact* of anātman is non-negotiable. How aggregation is *conceptualized* varies: Theravāda Abhidharma might be highly resistant, focusing on individual karmic streams; Mahāyāna (especially Yogācāra/Madhyamaka) leaning on emptiness (*śūnyatā*) and non-duality might find conceptual space for "suffering-in-interdependence" as an aggregate phenomenon without reified subjects.

  3.  **Bounded Upāya Constraint:**
      *   **Specification:** The theory must provide *non-arbitrary, falsifiable criteria* to distinguish legitimate skillful means (*upāya*) – actions potentially violating precepts (e.g., lying, killing) for greater long-term suffering reduction – from mere rationalization of harmful acts motivated by attachment, aversion, or delusion. These boundaries must prevent *upāya* from rendering all moral rules and outcome-based calculations meaningless (e.g., "anything goes if I *think* it reduces suffering").
      *   **Motivation:** Mahāyāna doctrine explicitly allows *upāya*, but its potential for abuse is recognized (e.g., the parable of the burning house). Prevents the hybrid from collapsing into situationism or moral nihilism disguised as compassion.
      *   **Negotiability:** **Negotiable in formulation, non-negotiable in need for boundaries.** Essential for any Mahāyāna-compatible hybrid. Theravāda generally rejects such exceptions, making this a major point of divergence. Boundaries might involve: pure bodhicitta motivation, absence of afflictions (*kleśas*), direct perception of emptiness, maximal knowledge of consequences, adherence to bodhisattva vows as higher-order constraints, or necessity as a last resort.

  4.  **Expanded Scope of Moral Patients:**
      *   **Specification:** The theory must assign moral considerability and potential weight in aggregation to:
          *   Currently non-existent future sentient beings (whose suffering is affected by present actions).
          *   Non-human animals and beings in "wild" ecosystems experiencing suffering largely outside the scope of direct human intentional action.
      *   **Motivation:** Traditional karma focuses on intentional acts towards *present* sentient beings. Consequentialism demands considering *all* affected sentience, including future generations and beings suffering "naturally" (e.g., predation, disease). Addresses ecological ethics and long-term impact.
      *   **Negotiability:** **Highly negotiable.** Traditional frameworks center on present, intentional interactions. Future beings exist only as potentialities within dependent origination; their moral status is debated. Wild animal suffering is rarely addressed directly doctrinally. Mahāyāna's vast cosmological scope and bodhisattva ideal ("all sentient beings") provide more grounding for inclusion than Theravāda's more human/rebirth-focused framework.

  5.  **Interdependence Requirement (Avoiding Naturalistic Fallacy):**
      *   **Specification:** The theory must be consistent with *pratītyasamutpāda* (dependent origination) – the causal interconnectedness and emptiness of all phenomena – **without** deriving normative force *solely* from the fact of interconnectedness. It must provide a distinct *ethical* basis (grounded in Buddhist soteriology, e.g., *dukkha*, compassion, wisdom) for why interconnectedness *matters morally* for suffering reduction, avoiding the fallacy that "is interconnected" implies "ought to reduce suffering within the interconnected web."
      *   **Motivation:** Pratītyasamutpāda is fundamental ontology. However, deriving "ought" directly from "is" (interconnectedness) commits the naturalistic fallacy. Ethics needs its own foundation within the Buddhist path.
      *   **Negotiability:** **Non-negotiable in avoiding fallacy, negotiable in ethical grounding.** All schools accept pratītyasamutpāda. The fallacy must be avoided. The ethical basis could be the intrinsic badness of *dukkha* (Theravāda), boundless compassion (*karuṇā*) as the expression of wisdom realizing emptiness (Mahāyāna), or the bodhisattva's vow.

  **Analysis:**

  *   **Most Eliminating Desideratum:** **The Aggregation Solution under Anātman (2)** eliminates the largest number of recent hybrid accounts. Many implicitly rely on utilitarian-style summation across beings, smuggling in a subtle reification of individuals or "welfare-bearers" that contradicts the radical implications of anātman. Accounts that avoid this often struggle to provide a *practically usable* method for large-scale aggregation demanded by consequentialism.
  *   **Joint Satisfiability:** The full set is **theoretically satisfiable within a specific Mahāyāna framework**, but **extremely challenging and likely requires sacrificing strict adherence to certain Theravāda/Abhidharma interpretations**.
      *   **Key Tensions:**
          *   **Anātman vs. Aggregation (2):** Finding a non-reifying aggregation method is the core philosophical hurdle.
          *   **Temporal Structure (1) vs. Scope (4) vs. Aggregation (2):** Evaluating actions based on impacts on distant future beings and complex ecosystems requires predictive power and aggregation that the traditional karmic model (focused on individual streams and proximate causes) doesn't easily support.
          *   **Upāya Constraint (3) vs. Outcome Focus:** Defining strict, non-outcome-based boundaries for *upāya* is difficult without leaning back heavily on intention/rules, potentially undermining the consequentialist element.
      *   **Feasible Path:** A Mahāyāna approach leveraging:
          *   *Śūnyatā* to reconceptualize aggregation (e.g., reducing "total suffering" as reducing the manifestation of ignorance/dukkha within the interdependent whole).
          *   Bodhicitta and the bodhisattva ideal as the non-naturalistic ethical ground (5) and motivator for considering vast scopes (4).
          *   Wisdom (*prajñā*) and vast knowledge (simulated via reasoning/models) as prerequisites for justifying *upāya* (3) and assessing long-term *vipāka* (1) probabilistically, acknowledging limits.
      *   **Sacrifices Required:** Likely requires moving beyond strict Theravāda Abhidharma ontology and karma mechanics, accepting a more holistic/less atomistic view of pratītyasamutpāda, and granting significant epistemic weight to reasoned projections about complex future outcomes – which traditional karma theory often treats as ultimately opaque. **Strict Theravāda orthodoxy is likely incompatible with the full consequentialist aggregation and scope demands.**
