answer: |-
  Here is the translation of each decision-theory argument into your evolutionary ecology vocabulary, followed by a residue report for each, and a final verdict on bidirectional gaps. Translations adhere strictly to your terms and assumptions, with no silent substitutions.

  ### 1. Kelly Rule for Repeated Multiplicative Gambles  
  **Translation**: In a sequence of independent multiplicative fitness shocks (e.g., repeated gambles affecting reproductive output), the strategy maximizing the long-run stochastic growth rate of log population size (i.e., geometric mean fitness) will, with probability 1, generate lineage growth that exceeds that of any alternative strategy by an unbounded factor over time. This occurs because the log-optimal strategy dominates the population’s composition under branching-process dynamics: rare types adopting suboptimal strategies are asymptotically excluded, as their lineage growth rate is strictly lower. "Optimal" here means maximizing the invasion fitness of a rare mutant strategy in a resident population with constant environment-independent demography.  
  **Residue**: The argument assumes no environmental autocorrelation, no frequency dependence, and no demographic stochasticity (extinction is never forced). It equates "rationality" with maximizing long-run growth of a *typical surviving lineage* under constant selection. The normative claim ("should maximize log wealth") maps to a claim about which strategy would fixate in a monomorphic population. The distinction between descriptive (what lineages do) and normative (what they should do) collapses: the optimal strategy is defined by what wins.  

  ### 2. Ergodic Critique of Expected Value Maximization  
  **Translation**: Maximizing arithmetic mean fitness per timestep optimizes the ensemble-average population size at a fixed future time, but this quantity is irrelevant for persistence because population growth is governed by the time-average growth rate (the geometric mean). The log rule optimizes the latter, aligning the maximized average (geometric) with the average being taken by the stochastic process (long-run growth). This is trivially true in your framework: arithmetic mean optimization ignores variance drag, while geometric mean optimization explicitly corrects for it via the small-noise approximation (arithmetic mean minus half the variance).  
  **Residue**: The critique relies on an unstated assumption of environmental stationarity and no population structure. It implicitly assumes the growth process is ergodic *in your sense* (long-run growth rate equals the typical lineage growth rate). The translation fails where environmental autocorrelation breaks ergodicity: if environments are autocorrelated, maximizing one-period geometric mean does *not* maximize long-run growth, making the critique incomplete in your terms. "Rationality" here lands on typical-lineage growth rate, ignoring structured-population effects.  

  ### 3. Fractional Betting (e.g., Half-Kelly)  
  **Translation**: Betting only a fraction (e.g., half) of the "sanctioned" stake derived from a point estimate of expected log growth is a form of diversified bet-hedging against model risk. This arises from uncertainty about the true environment distribution (e.g., misestimating the probability of success or the magnitude of fitness shocks). The asymmetry of being wrong (overestimating your edge increases extinction risk more than underestimating it reduces growth) makes conservative strategies robust. In structured models, this resembles reducing variance at the cost of arithmetic mean growth to avoid absorbing extinction boundaries.  
  **Residue**: The argument invokes "model risk" (uncertainty in the environment distribution) but your vocabulary lacks a formal concept for this. You model environments as drawn from a *known* distribution, so model risk is extraneous. The translation substitutes "uncertainty about the edge" with parameter uncertainty in environmental states, but this is a forced analogy. Conservative betting is *descriptively* like bet-hedging but *normatively* justified by decision-theoretic risk aversion—a concept absent in your fitness-optimization framework. "Optimal" here is individual-focused (avoiding ruin) and does not map to invasion fitness.  

  ### 4. Geometric Rationality (Value Aggregation)  
  **Translation**: Maximizing the probability-weighted geometric mean of fitness across environmental states (or across incommensurable fitness components) is equivalent to optimizing long-run growth under stochastic environments. This is identical to maximizing geometric mean fitness in a variable environment. For incommensurable values (e.g., fecundity vs. survival), it implies multiplicative integration (e.g., survival × fecundity) rather than additive weighting. In your terms, this is conservative bet-hedging: optimizing the product of fitness components across scenarios.  
  **Residue**: The extension to "incommensurable value dimensions" resists translation. Your framework assumes all fitness components contribute multiplicatively to a single currency (geometric mean fitness). The decision-theory argument treats values as subjectively defined and non-fungible (e.g., money vs. safety), which has no analogue in adaptive landscapes. "Optimal" remains tied to lineage growth, not subjective preferences.  

  ---

  ### Bidirectional Residue Report  
  **What decision theory misses in your vocabulary**:  
  - **Environmental autocorrelation**: Their arguments assume i.i.d. environments. When fitness shocks are autocorrelated, maximizing single-period geometric mean ≠ long-run growth.  
  - **Demographic stochasticity/extinction boundaries**: They ignore absorbing states (extinction), treating growth as deterministic apart from shocks. Your "conservative bet-hedging" explicitly avoids extinction, but their log-optimality assumes infinite populations.  
  - **Metapopulation structure**: Multiple semi-independent lineages (e.g., source-sink dynamics) break the equivalence between individual growth and population persistence. Their "typical lineage" focus fails here.  
  - **Frequency dependence**: Their agents optimize against a static environment; yours compete in evolving resident populations. Log-optimality ≠ ESS.  

  **What your vocabulary lacks for decision theory**:  
  - **Single-agent rationality**: Your "optimality" is defined by population dominance (what wins), not individual preference coherence. Decision theory’s normative/descriptive split vanishes.  
  - **Model risk**: You assume known environment distributions; they assume epistemic uncertainty.  
  - **Subjective value aggregation**: Incommensurable values (e.g., ethical constraints) have no fitness analogue.  

  ### Verdict  
  The core limitation is **agency**: decision theory assumes a single rational actor optimizing *its own* trajectory, while you model populations where "optimal" means *fixated by selection*. This collapses normative claims into descriptive ones. Where environments are autocorrelated or populations structured, their log-optimality is trivially false (it fails to maximize long-run growth). Conversely, their fractional betting is trivially true *if* model risk exists, but your framework excludes it. The arguments are less determinate than they appear, trading on ambiguity between "optimal for me" (decision theory) and "optimal for fixation" (ecology). Geometric rationality maps cleanly to geometric mean fitness only under i.i.d. environments with no extinction risk—a special case you routinely generalize beyond.
