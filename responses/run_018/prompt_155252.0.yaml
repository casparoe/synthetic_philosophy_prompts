answer: |-
  Here's a breakdown of the Pasadena Paradox's implications for your fundraiser and decision theory, keeping it in the weeds:

  **Core Problem of the Undefined Expectation:**
  The undefined EV arises because the series for the expectation (Σ [Payout * Probability]) isn't just divergent (like St. Petersburg), it's *conditionally convergent*. Rearranging the terms (which you're mathematically allowed to do with conditionally convergent series) changes the sum *to any real number you want, or even makes it diverge*. This isn't a calculation quirk; it exposes a fundamental flaw in applying the standard EV formula to this structure.

  **Implications for Decision Theory:**

  1.  **Kills "Maximize Expected Utility" (MEU) for Direct Comparison:**
      *   **Yes, it directly kills MEU in this specific context.** MEU requires a well-defined, comparable expected utility number for each option. If Option A has an undefined EV and Option B has a defined EV (even a finite one or infinite one), you *cannot* mathematically say "A has a higher EV than B" because A's EV *doesn't exist* as a single value.
      *   **The Workaround?** You can't just "fix" the calculation. You need alternative decision rules:
          *   **Weak Expectations:** Compare the limit of the EV *as you truncate the game* (e.g., max N flips). This gives a defined, finite number (often alternating in sign!) for any finite N. You then pick the option with the best *truncated* EV. The choice of N matters, but it's pragmatic.
          *   **Decision Rules Based on Distributions:** Focus on the *shape* of the potential payout distribution (probability of winning >$X, median payout, risk of ruin, etc.) rather than a single EV number. Stochastic dominance concepts become more important.
          *   **Framing/Indexing:** The paradox highlights that the *order* in which you mentally account for the possibilities matters. A decision rule might need to specify this indexing explicitly.

  2.  **Does it Break Statewise Dominance? (Probably Not, But It's Weird):**
      *   **Dominance Likely Holds:** Statewise dominance says: If Option A pays at least as much as Option B in *every possible state of the world*, and strictly more in at least one state, then A should be preferred.
      *   **The Pasadena Lottery Doesn't Violate This:** It's usually compared to getting $0 for sure. The Pasadena ticket pays positive amounts in many states and never pays negative. It *dominates* $0. You *should* prefer it to $0, even with undefined EV.
      *   **The Rumor & The Nuance:** The "break dominance" rumor likely stems from comparing it to alternatives *that also have undefined EV* (e.g., a slightly modified Pasadena lottery). In *these* comparisons, dominance might still technically hold, but MEU fails to tell you which undefined mess is better. The *practical* force of dominance feels weaker when both options are pathological.

  3.  **Real-World Relevance: Beyond Made-Up Games?**
      *   **Directly for Your Raffle? Probably Minimal (if designed practically):** The pure Pasadena structure relies on infinitely many coin flips and unbounded payouts. Your school raffle will have a maximum number of flips (N_max) and bounded payouts. **Crucially, any finite truncation (N_max flips) has a well-defined, finite (though possibly large and alternating) EV.** Calculate the EV *for your specific finite game* using the harmonic series up to N_max. Weirdness fades.
      *   **Indirect Lessons for Real-World Funky Bets:**
          *   **Bounded Rationality/Resources:** Humans can't comprehend infinite series or truly unbounded payouts. We mentally truncate. Define the bounds explicitly in your raffle rules.
          *   **Diminishing Marginal Utility:** Winning $1 million isn't infinitely better than winning $100k to most people. The harmonic growth of payouts vastly outpaces the psychological value. Use a utility function (e.g., logarithmic) when evaluating for participants. This *will* make the expected utility defined and finite.
          *   **Risk Perception:** The Pasadena lottery has a *huge* chance of very small payouts and a tiny chance of enormous payouts. People are loss-averse and bad at tiny probabilities. Focus on communicating the *likely* outcome (e.g., median payout) clearly to participants.
          *   **Sensitivity to Tail Assumptions:** Real-world probabilities for extreme events are unknown. The undefined EV highlights how sensitive decisions are to the precise modeling of vanishingly rare but extremely high-payoff events.

  **Reject or Patch?**

  *   **Don't Reject the Whole Framework:** Expected utility maximization is incredibly powerful and robust for the vast majority of decisions involving well-defined, finite (or integrable) risks with bounded utility. It fails spectacularly at the boundaries (infinities, undefined expectations).
  *   **Patch Vigorously at the Boundaries:**
      *   **Acknowledge Limits:** Recognize when the standard EV formula is undefined or leads to absurdities (St. Petersburg, Pasadena).
      *   **Apply Pragmatic Modifications:** Enforce finite bounds, use utility functions, employ truncated expectations, or switch to distribution-based reasoning when necessary.
      *   **Dominance as a Fallback:** Statewise dominance remains a powerful and often robust principle even when EV fails.

  **For Your Fundraiser:**

  1.  **Cap the Flips:** Set a maximum number of coin flip rounds (N_max). This is essential.
  2.  **Calculate Finite EV:** Compute the EV explicitly for your finite game: `EV = Σ_{n=1 to N_max} [ (-1)^{n+1} * ($2^n / n) * (1/2)^n ] = Σ_{n=1 to N_max} [ (-1)^{n+1} * ($1 / n) ]`. This is a finite alternating harmonic series. It will converge to a defined value (e.g., for N_max=10, EV ≈ $0.6456; N_max=100, EV ≈ $0.6882).
  3.  **Consider Utility:** If payouts get very large, recognize that $1,000,000 isn't 1000x better than $1,000 to a winner. This dampens the theoretical weirdness.
  4.  **Communicate Probabilities & Likely Outcomes:** Clearly state the chance of winning specific amounts (e.g., "~50% chance to win at least $1", "~25% chance to win at least $1.50", "<1% chance to win over $100" etc.) alongside the maximum potential.
  5.  **Ensure Positive Expected Value (Finite):** Make sure your calculated finite EV is positive and attractive enough to sell tickets after accounting for prize costs and fundraising goals.

  The Pasadena Paradox is a fascinating limit case that exposes the mathematical boundaries of standard expected value. It forces us to be more careful and sophisticated when dealing with extreme tail risks and unbounded payoffs, but it doesn't invalidate decision theory for practical, bounded scenarios like your fundraiser. Patch it pragmatically!
