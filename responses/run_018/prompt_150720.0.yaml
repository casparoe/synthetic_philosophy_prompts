  British English requirement means swapping -ize endings for -ise, avoiding Americanisms like "gotten," and using "catalogue" not "catalog." Editors are fussy, so consistency matters. Typos in their brief? No issue—their phrasing is clear despite "aplogies."

  Now, structuring the spec sheet. Must-haves: explaining judgment calls (like condemning past morals), handling structural presentism (archives/metadata), differentiating moral/conceptual types, and acknowledging translation necessity. Non-negotiables include the inescapability of present concepts—that's foundational. The big tension: demanding both pure contextual understanding AND allowing modern ethical critique. Purists say you can't have both; that's the irreconcilable bit they care about.

  Scoring existing theories: Hard anti-presentists fail on structural inescapability. Contextualists handle nuance but waffle on moral judgments. Critical presentists embrace inevitability but risk flattening the past. Highlight where each stumbles—like contextualists dodging "should we condemn slavery?" or critical presentists potentially overwriting past voices. 

  User's deeper need? Probing whether history can be "objective" when even its tools (metadata, language) are modern. They might be pushing back against both naive realism and relativistic nihilism. The spec sheet should validate their suspicion that some tensions can't be resolved, only managed—that's the academic contribution.
answer: |-
  ## Desiderata for a Theory of Historical Presentism: A Spec Sheet (British English)

  **Core Mandate:** Any adequate theory must grapple with the *inescapable tension* between understanding the past on its own terms and the historian's embeddedness in the present. It must explain phenomena, preserve crucial distinctions, acknowledge structural realities, and confront inherent contradictions.

  ### I. Phenomena Requiring Explanation
  1.  **Judgement Calls:** Why do historians feel compelled (or justified) in making moral evaluations of past actions using contemporary standards (e.g., condemning historical slavery, colonialism, or specific figures)?
  2.  **Conceptual Translation:** How do we describe past realities using present-day concepts that wouldn't have been understood (or understood differently) by historical actors? (e.g., applying "homosexuality," "the economy," "mental health," "human rights," or "gender identity" to pre-modern societies).
  3.  **Hard Case Resolution:** Must provide frameworks for analysing ethically/politically charged scenarios:
      *   Applying modern bioethics (autonomy, consent) to medieval plague quarantines or medical experimentation.
      *   Analysing pre-modern gender relations or sexual practices using 21st-century categories of identity, equality, or oppression.
      *   Evaluating historical figures involved in actions now considered atrocities (e.g., participation in slave trades, colonial violence).
  4.  **Motivation & Relevance:** Why does presentism often drive historical inquiry? How does it make the past seem relevant or urgent to contemporary audiences?
  5.  **The "Common Sense" Problem:** Why do some past practices seem intuitively "wrong" or "backward" despite historical context, while others appear merely "different"?

  ### II. Essential Distinctions to Preserve
  1.  **Moral Presentism vs. Conceptual Presentism:** *Crucial*. Must distinguish:
      *   *Moral Presentism:* Explicitly judging past actions/people against current moral/ethical norms (e.g., "King X was evil for endorsing slavery").
      *   *Conceptual Presentism:* Using present-day analytical frameworks, categories, or questions to *understand* the past, even if those concepts were unavailable to historical actors (e.g., analysing feudal structures using class theory, or medieval piety through psychological concepts). These are often intertwined but analytically distinct.
  2.  **Description vs. Evaluation:** Must differentiate between *describing* past phenomena using modern language for clarity and *evaluating* them against modern standards.
  3.  **Actor's Perspective vs. Analyst's Perspective:** Must maintain awareness of the gap between how historical subjects understood their world and how the historian interprets it using later tools and knowledge.
  4.  **Intentionality vs. Consequence:** Must allow for analysing the *consequences* of past actions from a present vantage point (e.g., long-term impact of colonialism) without necessarily assuming historical actors foresaw or intended those specific consequences.

  ### III. Structural Realities & Non-Negotiables
  1.  **The Inescapability of the Present Perspective:** *Non-negotiable*. Every historian is situated in their own time, shaped by its concerns, language, methodologies, and values. Complete objectivity or a "view from nowhere" is impossible. Theories denying this are fundamentally flawed.
  2.  **Archival & Categorical Structuring:** *Non-negotiable*. Archives are organised, catalogued, digitised, and accessed using present-day systems, metadata, keywords, and research questions. This *structurally* channels historical inquiry through contemporary lenses.
  3.  **Translation Imperative:** *Non-negotiable*. Historians *must* translate the past into terms comprehensible to a present audience. This inherently involves present concepts and language, risking anachronism but enabling communication.
  4.  **The Necessity of Context:** *Non-negotiable*. Any theory must insist on rigorous contextual understanding as the baseline for *any* historical analysis, whether presentist or not. Ignoring context is poor history, full stop.
  5.  **Avoidance of Crude Teleology:** *Non-negotiable*. A theory must guard against interpreting the past *solely* as a necessary prelude to the present, making everything seem destined for the current state of affairs.

  ### IV. Potential Irreconcilabilities (The Crux)
  1.  **The Core Tension:** The most significant potential conflict lies between:
      *   **Demand A:** The insistence on understanding the past *strictly* on its own terms, avoiding *any* imposition of modern concepts or judgments to achieve "pure" historical empathy and contextual accuracy.
      *   **Demand B:** The recognition that structural presentism is inescapable (archives, language, perspective) *and* the belief that historians have a legitimate role in engaging with the ethical/political questions the past raises for the present, which often necessitates using modern concepts and making judgments.
  2.  **The Dilemma:** **Demand A and Demand B are jointly unsatisfiable in their purest forms.** Achieving perfect contextual purity (A) requires shedding all present concepts – impossible given structural realities. Fully embracing critical engagement (B) inevitably involves conceptual or moral anachronism from the perspective of (A). *Any adequate theory must explicitly acknowledge this tension and offer a way to navigate it, not resolve it entirely.*

  ### V. Scoring the Usual Suspects

  1.  **Hard Anti-Presentists (Purist Contextualists):**
      *   **Goal:** Eliminate presentism entirely; understand past solely through contemporary eyes/terms.
      *   **Score:** Fails **Non-Negotiable 1 & 2** (inescapability, archival structuring). Struggles with **Phenomenon 1 & 3** (judgment calls, hard cases), often demanding moral suspension most find untenable. Excels at **Distinction 3 & 4** (Actor/Analyst, Intent/Consequence) and **Non-Negotiable 4** (Context). Offers no solution for **Phenomenon 4** (relevance). **Fails** to resolve the Core Tension, simply denying Demand B.
  2.  **Contextualists (Mitigated Anti-Presentism):**
      *   **Goal:** Context is *paramount*, minimise anachronism. Present concepts can be used cautiously as analytical tools *if* their difference is highlighted. Moral judgments are generally avoided or heavily qualified.
      *   **Score:** Strong on **Non-Negotiable 4** (Context) & **Distinctions 1-4**. Acknowledges **Non-Negotiable 1 & 2** but focuses on mitigation. Handles **Phenomenon 2 & 5** reasonably well. Often **weak** on **Phenomenon 1 & 3** – struggles to articulate *if* or *how* moral evaluation is ever legitimate. Avoids fully confronting the **Core Tension**, leaning towards Demand A while making practical concessions to Demand B without a robust theoretical justification for them. Risk of moral relativism or quietism on hard cases.
  3.  **Critical Presentists (Embrace & Manage):**
      *   **Goal:** Presentism is unavoidable and potentially productive. Historians *should* consciously engage the past from the present, using modern concepts critically and explicitly to interrogate power structures, legacies, and ethical questions. Context remains vital but is the starting point, not the end.
      *   **Score:** Embraces **Non-Negotiable 1 & 2**. Strong on **Phenomenon 1, 3 & 4** (judgment, hard cases, relevance). Directly addresses the **Core Tension**, arguing Demand B is legitimate and necessary, requiring careful management of anachronism rather than futile attempts at elimination. Strong on **Distinction 1** (Moral/Conceptual), forcing conscious choice. Risks **Non-Negotiable 5** (Teleology) if not careful. Major challenge is preventing Demand B from overwhelming Demand A – ensuring modern questions don't distort past realities or silence past voices (**Distinction 3**). Requires extreme methodological rigour to avoid simply projecting the present onto the past.

  **Summary:** An adequate theory *must* accept structural presentism (**Non-Negotiables 1-3**), rigorously uphold contextual understanding (**Non-Negotiable 4**), clearly differentiate moral from conceptual presentism (**Distinction 1**), and crucially, **explicitly confront the inherent tension between contextual purity and present engagement (The Core Tension)**. The Critical Presentist approach scores best overall by directly grappling with the irreconcilability, but its success hinges entirely on its ability to rigorously manage the risks of anachronism and teleology while maintaining genuine dialogue with the past on its own terms. Contextualists offer necessary caution but often sidestep the hardest questions. Hard Anti-Presentism is an untenable philosophical position given the realities of historical practice.
