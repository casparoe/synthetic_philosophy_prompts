answer: |-
  Here's the full specification of requirements for a group judgment aggregation procedure, structured by cases, distinctions, constraints, and critical results. The non-negotiable constraints create an impossibility result (List & Pettit, 2002), meaning **no procedure satisfies all core requirements simultaneously for complex agendas**.

  ### Core Requirements for Group Judgment Aggregation

  | **Requirement**                     | **Description**                                                                 | **Why it Bites**                                                                                              | **Status**              |
  |-------------------------------------|---------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------|-------------------------|
  | **1. Discursive Dilemma Case**      | Handle agendas with logically connected propositions (e.g., P, Q, P∧Q→R). Majority on P & Q but not on R must be resolved. | Exposes inconsistency between premise-based and conclusion-based aggregation. Tests logical coherence. | **Non-negotiable** (Core test case) |
  | **2. Ties**                         | Handle cases where votes are evenly split on a proposition.                     | Forces a decision rule (e.g., status quo, coin flip) or allows indeterminacy. Tests robustness and fairness. | **Non-negotiable** (Realistic scenario) |
  | **3. Abstentions**                  | Allow members to abstain on some propositions (e.g., lack expertise).           | Prevents forcing uninformed judgments; models partial participation. Impacts weighting and legitimacy. | **Non-negotiable** (Practical necessity) |
  | **4. Differential Expertise/Stakes**| Members have varying knowledge/interest per proposition (e.g., weight votes differently). | Challenges "one person, one vote" universality. Tests epistemic performance and fairness. | Negotiable (Depends on purpose) |
  | **5. Agenda Expansion**             | Add new propositions *after* initial decision (e.g., unforeseen implication).   | Tests dynamic consistency: earlier judgments shouldn't force incoherent new ones. | **Non-negotiable** (Real-world dynamism) |
  | **6. Group Belief vs. Preference**  | Distinguish truth-tracking ("we believe P") from preference ("we want P").      | Belief aggregation must respect logic; preference aggregation respects transitivity. Collapse causes paradoxes. | **Non-negotiable** (Conceptual integrity) |
  | **7. Premise vs. Conclusion Aggregation** | Distinguish aggregating premises vs. conclusions directly (e.g., vote on P&Q vs. vote on R). | Premise-aggregation risks inconsistency; conclusion-aggregation ignores inferential structure. | **Non-negotiable** (Avoids fallacies) |
  | **8. Genuine Judgment vs. Practical Decision**| Distinguish the group's *actual view* from a *procedural output* (e.g., compromise). | Affects legitimacy: "Did the group *believe* this or just *decide* it?" Critical for accountability. | **Non-negotiable** (Normative foundation) |
  | **9. Path-Independence**            | Group judgment shouldn't depend on voting order/agenda sequence.                | Prevents manipulation via agenda control; ensures outcome reflects underlying judgments. | **Non-negotiable** (Fairness) |
  | **10. Logical Consistency**         | Group judgment set must be logically consistent (no contradictions).            | Core rationality requirement. Violation renders judgments meaningless. | **Non-negotiable** (Rationality) |
  | **11. Completeness**                | Group must have a judgment (Yes/No) on every proposition in the agenda.         | Avoids indecision. Sometimes relaxed to "partial judgments" for realism. | Negotiable (Often required) |
  | **12. Unanimity Preservation**      | If all members agree on a proposition, group must adopt it.                     | Protects against counterintuitive overrides of universal agreement. | **Non-negotiable** (Fairness) |
  | **13. Non-Dictatorship**            | No single member always determines the group's judgment.                        | Ensures genuine aggregation. Core to collective decision-making. | **Non-negotiable** (Fairness) |
  | **14. Systematicity**               | Group judgment on each proposition depends only on individual judgments on *that* proposition (not others). | Simplifies voting but conflicts with logic (Discursive Dilemma). | Negotiable (Often sacrificed) |

  ### Which Requirement Rules Out the Most? 
  **The Discursive Dilemma Case + Logical Consistency + Systematicity.**  
  - **Premise-wise Majority Voting** fails: It forces inconsistency in the 3-judge case (P, Q true individually → P∧Q true, but majority rejects R if P∧Q→R).  
  - **Conclusion-based Majority Voting** avoids inconsistency but ignores premise judgments, violating the spirit of inferential reasoning.  
  - **Sequential Priority Rules** (voting order matters) fail **Path-Independence** and risk agenda manipulation.  
  - **Dictatorship** obviously fails **Non-Dictatorship**.

  ### Are Non-Negotiables Jointly Satisfiable?  
  **No.** The **List-Pettit Impossibility Theorem** proves that for agendas with minimal logical connectivity (like {P, Q, P∧Q}), **no aggregation rule** satisfies all of:  
  - **Universal Domain** (handles all possible individual judgment sets)  
  - **Logical Consistency**  
  - **Completeness**  
  - **Unanimity Preservation**  
  - **Non-Dictatorship**  
  - **Systematicity**  

  ### Key Implications
  1. **Trade-offs are unavoidable**: You must relax *something* (e.g., allow inconsistency, drop completeness, abandon systematicity).  
  2. **Premise-Based vs. Conclusion-Based**:  
     - *Premise-Based*: Prioritizes logical coherence of premises but may override majority conclusions.  
     - *Conclusion-Based*: Respects majority conclusions but may ignore inferential links.  
  3. **Procedures in Practice**:  
     - **Quota Rules** (supermajority per proposition) reduce inconsistency but risk indecision.  
     - **Distance-Based Rules** (minimize "dissent" to consistent sets) satisfy consistency/completeness but violate systematicity.  
     - **Expert Weighting** addresses differential expertise but requires trusted meta-judgments.  

  The impossibility underscores that **group "belief" is not a straightforward aggregation of individual beliefs** under logical constraints. What groups *do* (practical decisions) can be managed procedurally, but what they *believe* (collective rationality) is paradoxically fragile. When you see discursive dilemma arguments, they're highlighting this fundamental tension—not just a voting curiosity.
