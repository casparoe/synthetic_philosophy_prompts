  ### **Participant Handout (No Jargon)**  
  **You’re a curator in Bracken—a town that just lost its factory. People are leaving, and the archive must shrink. Decide what survives!**  

  **Your Role:**  
  - **Monumental Group:** Create a heroic story to inspire Bracken. Keep/add items about heroes overcoming odds. Lose points for non-heroic items.  
  - **Antiquarian Group:** Save every piece of history. Keep/add as much as possible. Lose points for anything destroyed.  
  - **Critical Group:** Destroy the past to build anew. Earn points for destruction and future-focused items. Lose points for nostalgic items.  

  **Rules:**  
  - Storage space shrinks each round (35 → 30 → 25).  
  - Every item kept costs $1 from the town fund (starts at $35). This fund pays for new projects.  
  - Destroy items to earn tokens. Spend tokens to:  
    - Add a new item ($1 + 1 token).  
    - Block one destruction (1 token; use instantly).  
  - If storage is over the limit, extras are destroyed randomly.  

  **How We Play:**  
  1. **3 Rounds (20 min each).**  
  2. Each round:  
     - Pay maintenance ($1 per item kept).  
     - Propose destructions/adds. Destroy to earn tokens. Antiquarians can block.  
     - Destroy extras if over storage limit.  
     - Update scores.  

  **Goal:** Fight for your vision. Feel the pressure. What will you sacrifice?
