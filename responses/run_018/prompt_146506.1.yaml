answer: |-
  ## Research Proposal: Domain Fragmentation in Indirect Normativity – The Case for (and against) Multiple Idealized Selves

  **Abstract:** Indirect normativity (IN) posits that an agent's normative reasons are determined not by direct evaluation of actions, but by the judgments of an idealized version of that agent – improved in rationality, information, and coherence. While the standard debate concerns whether IN collapses into direct normativity or remains vacuously unspecified, this proposal shifts focus to a neglected structural question: **Does IN fundamentally require a single, globally unified idealized deliberator governing *all* practical domains (moral, prudential, epistemic), or can it coherently accommodate *domain-fragmented idealization*, where distinct structurally improved selves govern distinct domains?** This project argues that existing discussions prematurely assume global unity. It will rigorously analyze the conceptual constraints on idealization within each domain and assess whether cross-domain unity is a substantive requirement or an unjustified presupposition, determining if fragmentation leads to incoherence, reducibility to direct norms, or a viable form of pluralistic IN.

  **1. Problem Statement & Research Question:** The idealized-deliberation framework is central to theories of internal reasons, constitutive norms, and responses to skepticism. The standard critique targets the specification of the idealization: overly specified idealizations risk collapsing IN into a direct normative theory (e.g., the "improved self" just *is* the theorist's own ideal), while underspecified ones risk emptiness. However, this debate implicitly assumes the idealized agent is a *single, unified entity* whose judgments cover the entirety of practical reason. This assumption overlooks a deeper structural possibility: **Could the idealized agent governing an individual's *moral* choices (e.g., concerned with impartial welfare under conditions of affective stability and full knowledge of others' needs) meaningfully differ in its structural features or outputs from the idealized agent governing their *prudential* choices (e.g., focused on long-term self-interest under conditions of cognitive bias mitigation) or *epistemic* choices (e.g., prioritizing truth-conduciveness under conditions of unlimited computational resources)?**

  **Precise Research Question:** Does the structure of indirect normativity *necessitate* a globally unified idealized deliberator whose judgments are coherent across all practical domains, or can it *tolerate domain-fragmented idealization* without either (a) collapsing into a set of extensionally equivalent direct, domain-specific normative theories, or (b) generating practical incoherence for the non-ideal agent due to the lack of a non-arbitrary principle for partitioning domains and resolving inter-domain conflicts?

  **2. Gap in Existing Literature:** Discussions of IN (e.g., concerning constitutive aims of agency, responses to Williams' internalism, or "what we really want" theories) and internal reasons consistently presuppose a single idealized agent. Arguments for IN often appeal to intuitions drawn from specific domains (e.g., moral impartiality *or* instrumental rationality) and then generalize uncritically. Critiques targeting underspecification focus on features *within* an assumed unified agent (e.g., "How much information?"), not on the *disunity* of the agent itself. Similarly, defenses against collapse arguments assume the unity of the idealization target. Consequently, the question of whether *domain unity* is a *substantive normative commitment* inherent to IN, or merely a *hidden presupposition* inherited from monistic normative theories or unexamined intuitions, remains entirely unexplored. This project directly interrogates this presupposition.

  **3. Methodology:** The project employs a structured conceptual analysis:
      1.  **Domain-Specific Constraint Analysis:** Isolate the core structural constraints defining "improvement" for the idealized deliberator within three core domains:
          *   **Moral:** Focus on constraints like impartiality, affective stability (reducing bias), full knowledge of others' subjective states/welfare, and coherence with principles of fairness/respect.
          *   **Prudential:** Focus on constraints like instrumental coherence, bias mitigation relevant to self-interest (e.g., hyperbolic discounting), full knowledge of personal facts/long-term consequences, and coherence with a stable conception of well-being.
          *   **Epistemic:** Focus on constraints like logical coherence, evidential sensitivity, unlimited computational capacity (for complex inferences), full access to relevant evidence, and coherence with truth-aiming.
      2.  **Tension Identification:** Analyze whether the specific constraints identified for each domain naturally pull towards a *unified* conception of the idealized agent (e.g., demanding a single standard of rationality or information access) or whether they are *domain-specific* and potentially divergent (e.g., affective stability might require different "improvements" for moral vs. prudential judgment; the scope of "relevant information" differs radically).
      3.  **Fragmentation Coherence Assessment:** Evaluate the viability of positing distinct idealized agents per domain:
          *   **Reducibility Threat:** Does assigning a distinct idealizer to each domain functionally reduce IN to a set of direct, domain-specific criteria (e.g., "moral reasons are what the morally idealized me says," collapsing into a direct moral theory)? What features would prevent this collapse?
          *   **Incoherence Threat:** Can a non-ideal agent coherently follow potentially conflicting advice from distinct domain-specific idealizers? Is there a non-arbitrary, non-circular principle for (a) partitioning domains and (b) adjudicating conflicts *between* domain-specific idealizers (e.g., when a prudentially ideal action is morally forbidden)? Does the need for such adjudication reintroduce a higher-order unified idealizer?
      4.  **Unity Justification Challenge:** If fragmentation proves problematic, can a compelling argument be constructed *from within the commitments of IN itself* (not from external monistic assumptions) that *requires* a globally unified idealized agent? What would this argument look like?

  **4. Possible Conclusions & Deciding Considerations:**
      *   **Conclusion A (Fragmentation Incoherent/Reductive):** IN structurally requires global unity. Fragmentation either (i) inevitably collapses into direct, domain-specific normativity (losing the "indirect" character) or (ii) generates irresolvable practical incoherence for the agent, as there exists no meta-criterion within IN for partitioning domains or resolving conflicts between fragmented idealizers that isn't arbitrary or itself presupposes a unified perspective. *Deciding Considerations:* Strong divergence in domain-specific constraints does *not* preclude a unified conception satisfying all; the adjudication problem for fragmented idealizers proves insoluble without smuggling in a higher-order unity; fragmented idealizers fail to provide genuinely *practical* guidance for a single situated agent.
      *   **Conclusion B (Fragmentation Viable):** IN can accommodate domain-fragmented idealization without collapsing into direct normativity or generating incoherence. Distinct idealizers reflect the genuine heterogeneity of normative demands. *Deciding Considerations:* Domain-specific constraints are sufficiently distinct and potentially conflicting that a unified idealizer is either impossible or represents an unjustified normative imposition; a non-arbitrary (though perhaps context-sensitive) principle for domain partitioning can be articulated *within* the constraints of practical reason (e.g., based on type of object/value or relation to self/others); conflicts between domain-specific idealizers can be resolved by the non-ideal agent using contextually appropriate rules of priority or specification *without* requiring a meta-idealizer, preserving indirectness as the reasons stem from *their own* (domain-specific) ideal perspectives.

  **5. Deliverable:** The primary deliverable will be a sustained argument answering the research question, culminating in:
      *   A **taxonomy of fragmentation types** (e.g., constraint-divergence, output-divergence, strong vs. weak partitioning).
      *   A **criterion for genuine indirectness** in fragmented frameworks (e.g., the non-ideal agent's recognition of the reason's source *as* their own domain-specific ideal self, distinct from accepting a direct norm).
      *   A clear determination of whether **global unity is a structural requirement** for IN or a contingent assumption, and if fragmentation is viable, a **defense against the reducibility and incoherence objections**.

  **6. Scope & Tractability:**
  This project is tractable within a single semester (e.g., for a dissertation prospectus or workshop paper) because it focuses rigorously on the *structural and conceptual* coherence of fragmentation *within the idealized-deliberation framework itself*. It analyzes core constraints and potential conflicts at a high level of abstraction, drawing on well-established concepts in metaethics and practical reason. It deliberately brackets:
  *   The substantive task of *justifying* specific domain-specific norms or idealizations.
  *   The comprehensive project of establishing normative unity *across all possible practical domains* (e.g., aesthetic, legal).
  *   Deep engagement with specific, fully developed substantive normative theories (relying instead on general characterizations of moral, prudential, epistemic demands).

  **Risk of Failure/Overextension:** The project risks failure only if it overextends by attempting to *solve* the general problem of normative unity/substantive inter-domain conflicts. Success here lies in conclusively demonstrating *whether the structure of IN itself imposes unity or allows fragmentation*, not in resolving all substantive normative disagreements. Focusing on the structural constraints and the adjudication problem keeps the scope manageable. Failure would manifest as an inability to resolve the reducibility or incoherence challenges for fragmentation, or conversely, an inability to find a compelling internal argument *for* unity, leaving the question unresolved – still a valuable outcome.

  **7. Significance:** Resolving this structural question is vital for the viability and interpretation of IN. If unity is required, it strengthens monistic approaches and clarifies a hidden commitment. If fragmentation is viable, it opens avenues for more nuanced, pluralistic, and potentially realistic versions of internalism and constitutive normativity, better reflecting the apparent heterogeneity of practical reason. It forces a deeper examination of what "improvement" means within normativity and challenges an unexamined dogma in the indirect normativity literature. The analysis will contribute significantly to metaethics, theories of practical reason, and the internalism/externalism debate.

  **(Specific references to key positions in the indirect normativity, internal reasons, and constitutive norm debates will be integrated throughout the final paper.)**
