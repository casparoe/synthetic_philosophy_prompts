  ## Adversarial-Collaboration Statement on Institutional Moral Compromise

  **Shared Bottom Line:** Institutional moral compromise is politically necessary for stable cooperation under profound moral disagreement, though its normative meaning and justification remain contested.

  **Agreed Practical Claims About Compromise:**
  1.  Compromise is unavoidable in pluralistic institutions (e.g., constitutions, treaties).
  2.  It involves mutual, non-trivial concessions from conflicting positions.
  3.  Its primary function is enabling stable, peaceful coexistence and cooperation where consensus is impossible.
  4.  It does not imply discovering a single "correct" moral answer underlying the disagreement.

  **Residual Disagreements:**

  | Disagreement Point                  | Moral Pluralist Wording                                                                 | Value-Incommensurabilist Wording                                                                 |
  | :---------------------------------- | :-------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------- |
  | **Nature of Compromise**            | Compromise uncovers latent, pre-existing shared weights among fundamental values.       | Compromise unavoidably dilutes each system's integrity through pragmatic sacrifice.             |
  | **Crux 1: Hidden Cardinal Comparability?** | Value systems possess discoverable, cardinal weightings enabling rational comparison. | Values are fundamentally incomparable; cardinal weights are illusory or imposed.                |
  | *Diagnostic Case: Constitutional Rights Balancing (e.g., free speech vs. privacy)* | *Prediction:* Will see compromise as refining an objective balance inherent to the values. | *Prediction:* Will see compromise as a forced, context-dependent trade-off masking incomparability. |
  | **Crux 2: Novel Normative Reasons?** | Successful compromise generates new, genuinely normative reasons binding on all parties. | Compromise merely splits differences; resultant reasons are purely pragmatic, lacking novel moral force beyond the agreement. |
  | *Diagnostic Case: Transboundary Resource Allocation Treaty (e.g., water rights)* | *Prediction:* Will see the treaty terms as creating new, shared normative obligations. | *Prediction:* Will see the treaty terms as a necessary, but non-moral, modus vivendi.            |
