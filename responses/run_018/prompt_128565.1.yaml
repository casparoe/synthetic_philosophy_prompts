  Below is a decision tree taxonomy tailored for your graduate seminar on emergence in complex adaptive systems (CAS). It uses concrete, case-anchored questions (e.g., flocking, climate phase transitions) and avoids relying on philosophical labels. Students navigate by answering yes/no or multiple-choice questions about scientific practice. The tree has three levels:  
  - **Root**: Asks about **microphysical closure** (whether all physical effects are fully determined by prior microphysical states/laws).  
  - **Level 1**: Splits on the **nature of emergence** (ontological, epistemological, or pragmatic).  
  - **Level 2**: Splits on **causal exclusion** (how downward causation is handled).  

  Each leaf includes:  
  - A **position** (named or described).  
  - **Most awkward commitment**: What the position must say about retaining macro-level causal laws in a "final" theory, even if full micro-derivations are available.  
  - **Flags**: For indistinguishable positions or undefended combinations (with reasons: *incoherent*, *unattractive*, or *neglected*).  

  ---

  ### **Taxonomy Decision Tree**  
  *Start at the root question. Answer based on cases like flocking birds or climate phase transitions.*  

  #### **ROOT: Does microphysical closure hold without exception in complex adaptive systems?**  
  *(i.e., are all physical effects in systems like flocking dynamics or climate models fully determined by prior microphysical states and laws?)*  
  - **Yes** → Go to Level 1 (Closure holds).  
  - **No** → Go to Level 1 (Closure fails).  

  ---

  ### **LEVEL 1 (Closure Holds)**  
  **Q1: If microphysical closure holds, should macro-level explanations (e.g., flocking rules or climate phase laws) be retained in scientific theories as more than just provisional tools?**  
  - **Yes, because macro-properties are irreducibly real** → Emergence is **ontological** (go to Level 2A).  
  - **No, but they’re needed due to practical limits** → Emergence is **epistemological** (go to Level 2B).  
  - **No, they’re just convenient modeling choices** → Emergence is **pragmatic** (go to Level 2C).  

  #### **LEVEL 2A (Ontological emergence, closure holds)**  
  **Q2A: How do macro-properties (e.g., flock cohesion) exert causal influence without violating microphysical closure?**  
  - **They don’t—macro-causation is an illusion** → **Epiphenomenal non-reductive physicalism**.  
    - *Awkward commitment*: Must deny macro-level causal laws a place in the final theory *even if they capture real, irreducible patterns*.  
  - **They cause effects via microphysical realization (e.g., supervenience)** → **Non-reductive physicalism with downward causation**.  
    - *Awkward commitment*: Must retain macro-level laws as causal *despite them adding nothing beyond microphysical powers*.  
  - **They cause effects independently, rejecting "no overdetermination"** → **Overdeterminationist physicalism**.  
    - *Awkward commitment*: Must retain macro-level laws *even though they systematically overdetermine microphysical effects*.  

  #### **LEVEL 2B (Epistemological emergence, closure holds)**  
  **Q2B: How should we interpret macro-causal claims (e.g., "flock alignment causes collective motion")?**  
  - **They’re useful shorthand but not truly causal** → **Reductive physicalism**.  
    - *Awkward commitment*: Must eliminate macro-level laws from the final theory *even when they accurately predict behavior*.  
  - **They’re causal but reducible to micro-dynamics** → *Undefended: Unattractive (redundant with micro-causation)*.  
  - **They’re causal and irreducible, rejecting exclusion** → *Undefended: Incoherent (contradicts epistemological reducibility)*.  

  #### **LEVEL 2C (Pragmatic emergence, closure holds)**  
  **Q2C: Why use macro-models (e.g., climate phase laws) if micro-derivations are possible?**  
  - **For computational/cognitive convenience only** → **Pragmatic pluralism**.  
    - *Awkward commitment*: Must treat macro-level laws as disposable tools *even when they outperform micro-models*.  
  - **Because they reveal causal truths micro-models miss** → *Undefended: Incoherent (violates closure)*.  
  - **Because causation is model-relative, so exclusion is false** → *Undefended: Unattractive (undermines scientific objectivity)*.  

  ---

  ### **LEVEL 1 (Closure Fails)**  
  **Q1: If microphysical closure fails, are emergent properties (e.g., flock intelligence or climate tipping points) mind-independent features of the world?**  
  - **Yes, they’re novel and fundamental** → Emergence is **ontological** (go to Level 2D).  
  - **No, their apparent novelty reflects human limitations** → Emergence is **epistemological** (go to Level 2E).  
  - **No, they’re just useful for specific modeling goals** → Emergence is **pragmatic** (go to Level 2F).  

  #### **LEVEL 2D (Ontological emergence, closure fails)**  
  **Q2D: How do macro-properties (e.g., climate phase transitions) causally interact with microphysics?**  
  - **They don’t—downward causation is illusory** → **Epiphenomenal emergentism**.  
    - *Awkward commitment*: Must exclude causal macro-laws from the final theory *despite accepting ontological novelty*.  
  - **They cause effects while respecting closure** → *Undefended: Incoherent (closure fails by definition)*.  
  - **They cause effects, rejecting exclusion as flawed** → **British emergentism (updated)**.  
    - *Awkward commitment*: Must retain macro-level laws *as fundamental additions to physics, violating unity of science*.  

  #### **LEVEL 2E (Epistemological emergence, closure fails)**  
  **Q2E: If closure fails, why might macro-explanations (e.g., flocking rules) still be reducible?**  
  - **Failure is negligible; emergence is still just practical** → *Undefended: Neglected (rarely argued, as closure failure implies irreducibility)*.  
  - **They’re causal but reducible** → *Undefended: Incoherent (contradicts closure failure)*.  
  - **They’re causal and irreducible, but exclusion is false** → *Undefended: Unattractive (ad hoc without ontological basis)*.  

  #### **LEVEL 2F (Pragmatic emergence, closure fails)**  
  **Q2F: Why use macro-models if microphysics is incomplete?**  
  - **Because they’re reliable tools for specific purposes** → **Instrumentalism**.  
    - *Awkward commitment*: Must deny macro-laws represent reality *even when closure failure suggests they might*.  
  - **Because they causally explain gaps in microphysics** → *Undefended: Incoherent (pragmatism denies ontological commitments)*.  
  - **Because exclusion is false in open systems** → *Undefended: Neglected (no clear proponents)*.  

  ---

  ### **Key Notes**  
  1. **Indistinguishable positions in practice**:  
     - **Pragmatic pluralism (Level 2C)** and **Instrumentalism (Level 2F)** yield identical modeling practices (use macro-laws as tools, ignore ontology).  
     - **Reductive physicalism (Level 2B)** and **Pragmatic pluralism (Level 2C)** are functionally similar if micro-derivations are tractable.  

  2. **Undefended combinations**:  
     - **"Closure holds + Epistemological emergence + Downward causation"**: *Unattractive* (redundant with micro-causation).  
     - **"Closure fails + Ontological emergence + Reconciled downward causation"**: *Incoherent* (cannot reconcile with failed closure).  
     - **"Closure fails + Epistemological emergence"**: *Neglected* (closure failure undermines reducibility).  

  3. **How to use this tree**:  
     - Students answer questions based on scientific cases (e.g., "Would you retain flocking rules if every bird’s state were known?").  
     - Positions emerge from answers, not pre-existing labels.  
     - "Final theory" refers to an idealized, complete scientific description of reality.  

  This taxonomy isolates core commitments in emergence debates while highlighting tensions between scientific practice and philosophical claims. Use it to spark debates on CAS case studies!
