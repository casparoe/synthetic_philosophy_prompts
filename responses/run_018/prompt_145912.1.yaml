prompt: |-
  I'm a phd student in history of science and I got stuck on my museum's curatorial review board. We just recieved a proposal for an exibition called Agents Without Intent: Germs, Monsoons, and Magma in the Making of Modernity. The curator wants to frame 19th-century cholera outbreaks in colonial ports, the 1815 Tambora climate shock, and El Niño drought cycles not as background conditions but as primary historical agents — protagonists that restructured labor markets and imperial goverment. The framing draws on more-than-human history and actor-network ideas, but half the board says this is just environmental determinism that erases human agency, especially colonized peoples who were actively adapting. The other half says treating microbes and monsoons as passive scenery is pure anthropocentrism. We need to send a decision memo to the director — approve, reject, or approve with conditions — with actual reasoning the curators can respond to. Can you draft it? Give me a clear bottom line, lay out the conceptual reasoning including the strongest argument from the losing side, and don't bother with a bibliography or reading list since I don't have access to check specific texts right now. Just write the memo directly, no "Here is your memo" opening.
