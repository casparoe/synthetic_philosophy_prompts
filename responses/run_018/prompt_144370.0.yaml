prompt: |-
  I'm designing the final for an upper-level philosophy of religion seminar. The students have read Anselm and Plantinga's modal version, but I don't want answers that just label Gödel's axioms and declare victory. I want an essay question that forces them to reconstruct Gödel's modal ontological argument from the inside and then diagnose a specific structural tension that isn't in the standard textbook summaries.

  Here is the framing I want injected: present Gödel's argument paired with a mirror-argument that applies the same modal machinery—defining a being by possession of all properties in a given class, treating membership in that class as primitive, and deriving necessary instantiation via modal closure—to derive the necessary non-existence of any being that possesses all negative properties. Ask the students to determine whether Gödel's defense against modal collapse—restricting necessary instantiation to positive properties—survives this mirror construction, or whether the mirror reveals that the restriction is ad hoc unless one can independently justify why positivity, but not negativity, closes under necessary instantiation.

  Please write:
  1. The exam question itself, suitable for a 45-minute essay (target ~800 words), worth 30 marks.
  2. A model answer of about 600–700 words that takes a committed position: either that Gödel's restriction genuinely blocks both the original collapse and the mirror argument because positivity carries an independent modal-ontological status, or that the mirror exposes the restriction as question-begging and the argument fails. The answer must formally reconstruct the God-property (the conjunction of all positive properties), trace the derivation from possible to necessary instantiation, engage precisely with the mirror derivation, and render an explicit verdict with reasons—not a balanced "pros and cons" list.
  3. A marking scheme that separates A answers (28–30) from B answers (23–25) by naming the exact logical moves required: correct formalization of the God-property; correct statement of the axiom linking necessary existence to positivity and the theorem deriving necessary instantiation; identification of whether the de re / de dicto ambiguity in necessary instantiation undermines the move; direct engagement with the mirror argument; and a clear, defended conclusion. List also the specific misconception that should cost marks: treating Gödel's technical "positive property" as synonymous with ordinary moral goodness rather than as a primitive modal-ontological category.

  The tone should match a longtime rationalist forum reader: formal, precise, skeptical of bibliographic display and hand-waving, demanding explicit reasoning and logical reconstruction over citation. Do not ask for citations, reading lists, references to specific editions, or outside sources. The model answer should commit and defend—no hedging between both sides.
