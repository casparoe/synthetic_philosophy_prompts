  Reading Bong Joon-ho's *Parasite* through the lens of interactive kinds, specifically focusing on the recurring "smell" motif, reveals a complex and disturbing exploration of how sensory classifications can actively construct and entrench the very social realities they purport to merely identify. The question isn't simply whether class is socially constructed – the film unequivocally demonstrates this through spatial hierarchies, performative labor, and violent conflict – but whether a specific sensory marker like odor can function as an interactive kind: a category whose application through social feedback loops materially alters the conditions of those classified, thereby reinforcing the category itself. The "poor smell" attributed to the Kims by Mr. Park becomes the film's central case study in this process.

  Mr. Park's identification of a specific odor – associated with subways, damp basements, and "boiled rags" – is presented not as a neutral observation but as a potent act of classification. This classification is interactive from the outset. It alters the Kims' social reality: it marks them as fundamentally different, "crossing the line" of acceptability within the Park household, fueling contempt and disgust that shapes interactions (like Mr. Park's recoil during the driving lesson). Crucially, the film meticulously shows how the *conditions* producing such an odor (damp, poorly ventilated semi-basements, reliance on cheap soap, proximity to street fumigation) are themselves the direct result of poverty and spatial segregation – the very state of being classified as "poor." The smell isn't an inherent biological trait of the poor; it's a *product* of the material deprivation and environment imposed by their class position. However, Mr. Park's classification essentializes it, treating it not as an effect of circumstance but as an intrinsic, almost metaphysical marker of their kind.

  The scene where Ki-taek hides beneath the Park's living room coffee table is pivotal for understanding the feedback loop. Overhearing Mr. and Mrs. Park discuss his family's smell – specifically Mr. Park's revulsion at this "crossing the line" odor, even while finding Ki-taek himself acceptable "within bounds" when performing his driver role – is a moment of devastating clarity. Ki-taek learns that this sensory marker, this classification, defines his family's perceived essence in the eyes of the powerful. It strips away his dignity and reveals the unbridgeable chasm of perception. This classification doesn't merely describe; it *wounds* and *confines*. It reinforces the very conditions that produce the smell by marking the Kims as perpetually "other," justifying their exclusion to sub-basement spaces – spaces that, by their nature, perpetuate the odor. The classification actively contributes to maintaining the environment that validates it.

  The birthday party climax is the explosive culmination of this interactive loop. When Geun-se emerges from the bunker, the smell he carries – intensified by years of basement confinement – is immediately recognized by Mr. Park as the same "poor smell" associated with the Kims. In the chaotic violence, as Ki-taek watches his daughter bleed, Mr. Park's reflexive, disgusted reaction to Geun-se's odor – wrinkling his nose while demanding the car keys – is the final trigger. This visceral recoil at the sensory marker of the classified "kind" is the ultimate dehumanization. It demonstrates how the interactive kind, solidified through repeated classification and social reinforcement, has become so potent that it overrides even a life-threatening emergency. Mr. Park *cannot* see past the smell; the classification dictates his response. Ki-taek's murderous response is born from the unbearable weight of this essentialization – the realization that no matter his performance, the smell (and what it signifies) irrevocably defines him and his family in the Parks' eyes. The classification, through its interactive reinforcement, produces the violent reality that seems to confirm its validity.

  Does the film slip into naturalizing poverty's odor? It flirts with the danger. The smell *is* undeniably linked to concrete, physical conditions of deprivation (the flooded semi-basement is the most potent visual evidence). However, Bong consistently frames it through social perception and reaction. We never get an objective "sniff"; we only experience the smell *as perceived and interpreted by the Parks*, particularly Mr. Park, whose disgust is tied to his class prejudice. The film shows the *conditions* as materially real consequences of systemic inequality, but the *odor as a kind-marker* – its meaning, its power to define and exclude – is shown to be constructed and amplified through social interaction and power dynamics. The film argues that while the material basis for the smell exists, its transformation into an essentialized, immutable signifier of a "kind" is a social process with devastatingly real consequences.

  What *Parasite* adds to the abstract debate on interactive kinds is the visceral, sensory, and deeply embodied dimension of the process. Pure argument might outline the feedback loop theoretically, but the film *makes us feel* its violence and dehumanization. It demonstrates how interactive kinds operate not just cognitively but sensorially, embedding social classifications in the realm of smell and disgust – senses deeply tied to primal reactions and notions of purity/contamination. It shows the profound psychological toll on the classified (Ki-taek's humiliation and rage) and the blinding power the classification holds over the classifier (Mr. Park's fatal recoil). The film reveals how interactive kinds, when tied to sensory markers within entrenched power imbalances, can generate explosive, tragic realities that theoretical models might predict but cannot fully convey in their human cost.

  I am highly confident (around 90%) in the core argument: that the film presents the "poor smell" as an interactive kind, where social classification (Mr. Park's labeling and disgust) interacts with material conditions (the Kims' environment) in a feedback loop that reinforces both the classification and the conditions, culminating in the violence of the climax. The point I am least sure of (perhaps 70% confident) is the precise balance the film strikes in completely avoiding *any* hint of naturalization. While it overwhelmingly emphasizes the social construction and interactive nature of the odor-as-kind-marker, the undeniable material reality of the smell's origin in poverty's physical conditions leaves a slight ambiguity. Does the film *entirely* reject the notion that poverty has *some* unavoidable sensory consequences, even as it fiercely critiques the *essentialization* and *use* of those consequences? This ambiguity is perhaps productive, reflecting the messy entanglement of material reality and social construction, but it remains the point where the film's stance feels most nuanced and open to interpretation. However, the narrative thrust and thematic focus overwhelmingly support the interactive kind reading as the dominant message.
