answer: |-
  Here are the five disambiguated theses:

  1.  **Intergenerational Custodianship (Not Absolute Ownership):** Present generations hold the Earth in trust for future ones, meaning they lack the right to permanently destroy or irreversibly degrade its fundamental capacity to support life. *Platitude; matches her use by rejecting unqualified ownership justifying depletion.*
  2.  **Directed Obligation to Specific Future Claimants:** Our duty concerning the Earth is owed specifically *to* our descendants ("our children"), treating them as identifiable claimants with rights, rather than abstract entities. *Substantive and defensible (though contested by non-identity problem arguments); matches her use by personalizing the obligation, making substitution irrelevant to the core duty.*
  3.  **Repayment-in-Kind Obligation:** The "borrowing" metaphor implies the obligation is to return the *substance* or *core capabilities* borrowed (e.g., specific resources, ecosystem health), not merely equivalent value through technological substitutes or increased wealth. *Substantive and controversial; matches her use by directly rejecting the argument that technological progress or wealth growth justifies depletion.*
  4.  **Rejection of Pure Time Preference (Temporal Discounting):** Well-being or claims of future persons hold equal moral weight to those of present persons simply by virtue of their existence, regardless of temporal distance; their future status does not inherently diminish what is owed to them. *Substantive and defensible (core to many intergenerational justice theories); matches her use by denying that future wealth justifies discounting their claim to the specific resource base.*
  5.  **Depletion as Theft/Failure to Repay:** Depleting non-renewable resources violates the borrowing relationship, constituting a failure to repay the specific thing borrowed (the resource stock/ecosystem integrity) to its rightful future owners. *Substantive, controversial, and the conclusion she supports; matches her use as it directly entails that depletion is wrong regardless of substitution or growth.*
