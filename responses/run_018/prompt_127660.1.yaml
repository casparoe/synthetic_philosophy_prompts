answer: |-
  The fluorescent buzz of the Department of Temporal Integrity (DTI) Archive Section B-7 was the only sound Aris Thorne considered truly simultaneous across the entire block. Everything else – the rustle of parchment from 1823, the soft chime of a 2310 data crystal notification, the distant clang of a misplaced 1945 tire iron – was just local noise in the vast, unchanging library of spacetime. Here, events weren't sequential; they were *filed*. From 1800 to 2500, every birth, war, contract, and sneeze sat on endless shelves, dust motes dancing equally in the light filtering through high windows, illuminating Charlemagne's coronation request form just as brightly as the 24th-century lunch menu beside it. There was no "Current Events" aisle. Just... the stack.

  Aris rubbed his temples, staring at the conflicting files on his terminal. Case #DTI-B7-88934-A: **Retrocausal Escrow Dispute - NuGen Power Consortium vs. Havenbrook Settlement Collective.**

  The claim was absurd on its face: NuGen insisted their signing of the *Eridani Fission Lease Agreement* in 2047 (File Ref: CON-2047-GAMMA-332) had triggered, via retrocausal escrow obligations, the catastrophic Havenbrook Dam failure in 1998 (File Ref: DIS-1998-BETA-775).

  Retrocausal escrow. The bureaucratic nightmare child of relativistic finance. You locked an obligation – payment, resource delivery, liability acceptance – into specific future spacetime coordinates. The twist? Parties existing *before* those coordinates could dispute the obligation's validity or consequences, arguing the escrow's activation rippled *backward* along certain worldlines, influencing events in their "past." It was messy, expensive, and relied entirely on agreeing on a *convention* for simultaneity – a way to slice the block universe into "nows."

  NuGen's argument hinged on the "Corporate Standard Frame," calibrated to their headquarters' motion relative to the cosmic microwave background. In *that* frame, projecting backward, the signing event in 2047 and the dam collapse in 1998 could be considered *simultaneous*. Therefore, the escrow obligation activated by the signing (specifically, the clause mandating geological stability assessments) was "present" at the moment of the collapse, constituting negligence.

  Havenbrook, naturally, used the "Settlement Rest Frame," tied to their valley. In *that* slice, the dam burst happened decades *before* NuGen even existed. How could a non-existent entity cause a flood? Preposterous! Their counterclaim demanded nullification of the entire Eridani Lease for bad-faith temporal entanglement.

  Aris sighed. This wasn't about physics; it was about paperwork and precedent. The Rietdijk-Putnam argument wasn't just theory here; it was the filing system. Since there was no universal "now," no objective way to say 1998 was "before" 2047 for everyone, you had to pick a convention. The DTI defaulted to the "Archival Median Frame," a bureaucratic average designed to minimize filing conflicts. But retrocausal escrow contracts often specified their *own* preferred frame for dispute resolution, creating chaos.

  NuGen's contract specified "the frame of the signing entity's primary domicile at the time of signing." Corporate Standard. Havenbrook screamed foul, citing hardship.

  Aris pulled the physical files. DIS-1998-BETA-775: A soggy, ink-blurred incident report detailing the dam failure, loss of life, structural flaws. Standard tragedy. Then, CON-2047-GAMMA-332: Crisp synth-parchment, dense legalese, the retrocausal escrow clause bolded. He also pulled the Havenbrook Settlement Charter (File REF: FDN-1975-ALPHA-112) and NuGen's Articles of Incorporation (File REF: CORP-2030-DELTA-449). Standard procedure.

  He was cross-referencing the listed geological survey requirements in the escrow clause against the actual surveys filed for the Havenbrook Dam site (File REF: SUR-1995-THETA-221), looking for discrepancies NuGen could have "caused" retroactively, when his stylus slipped. Instead of logging a note on the 1995 survey, he misfiled a digital flag onto the *dam incident report* itself, marking DIS-1998-BETA-775 with a procedural code usually reserved for *contractual* compliance reviews.

  The system pinged softly, accepting the miscoded flag. Aris cursed, about to undo it, when a notification popped up: **"Cross-reference updated: DIS-1998-BETA-775 now linked to ESCROW CLAUSE VIOLATION protocols (See CON-2047-GAMMA-332, Sec. 8b)."**

  He froze. The automated archive, operating under the Archival Median Frame, had processed his misfiled flag. Because the flag was attached to the 1998 disaster report and referenced the 2047 contract clause, the system, in its flat, timeless logic, interpreted it as *evidence* – filed within the archive – that the 1998 event *was* being reviewed *in relation to* the contractual obligation from 2047. Within the archive's own conventional slicing, the connection now had a timestamped administrative existence *before* the dispute was even fully adjudicated.

  Technically, by DTI protocol, this administrative link *was* a form of record. It existed. It was part of the block. In the Corporate Standard Frame, this new "administrative simultaneity" (the flag being attached "at the same time" as the disaster report existed in the archive) could be argued as further evidence that the escrow's influence was indeed present at the 1998 locus.

  Havenbrook's lawyers would howl. It was blatantly unfair. A clerical error, a slip of the stylus in the endless, unchanging *now* of the archive, had potentially altered the causal landscape of a dispute spanning centuries. NuGen hadn't *done* anything differently in 2047. The dam burst hadn't changed in 1998. But the *relationship* between those fixed points, mediated by the conventional slice they used for judgement, had shifted.

  Aris leaned back, the hum of the archive suddenly oppressive. Blame. That's what NuGen was after. Financial liability pinned to their 2047 signing, making them "responsible" for a 1998 flood. But how could you *blame* a fixed point? The signing event was just... there. Eternal. Unchanging. As real and finished as the flood itself. Assigning blame felt like assigning blame to a book on a shelf for the content of another book placed beside it decades later by a librarian following an arbitrary cataloging system.

  His misfile proved the point brutally. He'd introduced a new element, a tiny administrative fact, and it resonated backward and forward, changing the apparent temporal relationship. Was *he* to blame? His action was also just a fixed point in the block. The unfairness wasn't in the events themselves, but in the *narrative* they were forced to construct across the slices.

  With a grimace, Aris made his ruling. He cited the Archival Median Frame, noted the presence of the administrative link (origin: misfile, ref: ARIS-THORNE-ACTION-2415), and ruled that, *within the convention specified by NuGen's contract*, the retrocausal escrow obligation **was** deemed active at the locus of the 1998 disaster due to the established simultaneity in the Corporate Standard Frame and the subsequently recorded administrative connection within the archive. NuGen was liable for escrow violation penalties regarding the geological stability clause.

  He added a footnote: "This ruling concerns contractual obligation under specified conventional simultaneity only. It does not assert, nor can the DTI assert, a unique, frame-independent 'causal arrow' from 2047 to 1998. Blame, as commonly understood, requires a moving present. The archive has none. The events simply are."

  He stamped the digital decree. It joined the stack, another fixed point in the block. NuGen would celebrate in their 2047. Havenbrook would rage in their 1998. Aris closed the file. The dust motes danced on, indifferent, in the light that shone equally on the Magna Carta and the lunch menu. He grabbed the misfiled dam report and the contract. Time to reshelve them. Forever.
