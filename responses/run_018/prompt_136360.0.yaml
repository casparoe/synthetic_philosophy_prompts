prompt: |-
  I serve on a municipal sustainability board that evaluates long-term infrastructure proposals—coastal defenses, soil-restoration bonds, and carbon-sequestration contracts—whose costs fall on present taxpayers but whose benefits unfold across 80 to 200 years. Our economic consultants deliver a single “social discount rate,” yet I have come to suspect that this figure smuggles together genuinely distinct considerations: the risk that future climate regimes or technologies will alter the value of the project; the expectation that future generations will be wealthier, lowering the marginal utility of the same benefit; and what is called pure time preference, the idea that a good is worth less solely because it arrives later, irrespective of risk or wealth. I need a reusable decision procedure my board can run on any proposal that forces these factors apart, tells us whether a proposed rate is justified by temporal distance alone, and flags exactly where empirical analysis ends and a normative judgment about intergenerational neutrality begins.

  Please construct the procedure as an ordered checklist or flowchart in words: the specific questions to ask about a proposal’s time profile and the source of each discount factor; what counts as a sufficient answer at each stage, including how to distinguish a growth-based or risk-based reduction from one that treats future welfare as intrinsically less important; the points at which the procedure stops with a clear recommendation to reject or revise a rate; and the explicit handoff moments where the remaining dispute is not factual but a value choice about whether it is permissible to weigh our grandchildren’s welfare lower just because they live later. Apply the procedure to two concrete cases we are weighing: a seawall whose protective benefits extend 120 years but depend on highly uncertain future sea-level trajectories and engineering standards, and a reforestation initiative with benefits spread over 150 years under conditions of relative climatic and economic stability. In each case, show where the procedure isolates pure time preference from other discounting grounds, and mark precisely where the board must make a normative decision that no formula can settle.
reasoning: |-
  We are constructing a reusable decision procedure for the board to evaluate long-term infrastructure proposals. The goal is to disentangle the components of the social discount rate: risk, growth (which affects the marginal utility of future benefits), and pure time preference (the normative component that discounts future welfare solely because it occurs later). The procedure will be an ordered checklist.

  **Decision Procedure: Disentangling the Social Discount Rate**

  **Step 1: Identify the Time Profile of Costs and Benefits**
     - Question: What are the expected cash flows (costs and benefits) of the project over time? Specifically, when do the costs occur and when do the benefits occur? For each benefit and cost, what is the timing and magnitude?
     - Required Information: A detailed schedule of costs (typically upfront or over the construction period) and benefits (spread over the project's lifetime, e.g., 80-200 years). The benefits should be expressed in constant dollars (real terms) and, if possible, in utility units (but we often use money as a proxy for utility).
     - Sufficient Answer: A table or function showing the net benefits (benefits minus costs) for each year (or at least key time points) over the entire project horizon.

  **Step 2: Decompose the Discount Rate into Its Components**
     - We recognize that the discount rate (r) is typically composed of three parts:
          r = ρ + θ * g
       where:
          ρ (rho) = pure rate of time preference (normative)
          θ (theta) = elasticity of marginal utility of consumption (a positive constant, often taken as 1 to 2)
          g = growth rate of per capita consumption
       Additionally, we must account for risk (which we denote as an adjustment to the benefits or to the discount rate for risk).

     However, note that the above equation is for a risk-free world. We must adjust for risk separately.

     Alternative decomposition (with risk):
          Discount rate = ρ + θ * g + risk premium

     So we break the discount rate into:
          - Pure time preference (ρ): normative, reflects the intrinsic preference for present over future, independent of wealth or risk.
          - Growth effect (θ * g): reflects that future generations are expected to be wealthier, so the same dollar benefit is worth less in utility terms.
          - Risk premium: an adjustment for the uncertainty in the benefits (or costs) of the project.

  **Step 3: Estimate the Growth Component (θ * g)**
     - Question: What is the expected long-term growth rate (g) of per capita consumption? What is a reasonable value for θ (the elasticity of marginal utility of consumption)?
     - Required Information: 
          - g: Historical and projected long-term growth rates of real per capita GDP (or consumption) for the relevant region. We must use a long-term average that accounts for potential future slowdowns or changes (e.g., due to climate change or other factors).
          - θ: Typically set between 1 and 2 (based on empirical studies of risk aversion and intergenerational inequality aversion). The board may choose a value within this range or use an estimate from literature.
     - Sufficient Answer: A defensible estimate of g (e.g., 1.5% per year) and θ (e.g., 1.5), leading to a growth component of 1.5 * 1.5% = 2.25%. This component is subtracted from the discount rate to account for the diminishing marginal utility of consumption in a richer future.

     Note: The growth component (θ*g) is positive and thus reduces the present value of future benefits because a dollar in a richer future is worth less in utility. However, note that in the formula for the discount rate, it is added to ρ. So if we have a positive growth component, it increases the discount rate and thus discounts the future more.

  **Step 4: Estimate the Risk Premium**
     - Question: What is the uncertainty surrounding the future benefits (and costs) of the project? How does this uncertainty correlate with overall market risk (or aggregate consumption risk)? Alternatively, if we are using a risk-adjusted discount rate, how do we estimate the risk premium?
     - Required Information: 
          - The volatility (variance) of the project's net benefits over time.
          - The correlation between the project's net benefits and the overall economy (or aggregate consumption). If the project's benefits are higher when the economy is doing poorly (negative correlation), then the project acts as insurance and may have a negative risk premium. If positive correlation, then a positive risk premium is required.
          - Alternatively, we can use scenario analysis or Monte Carlo simulations to estimate the expected benefits under different states of the world and then discount at a risk-free rate (which would be the rate without the risk premium). Then we compare the certainty-equivalent benefits to the expected benefits.

     - Sufficient Answer: A risk premium (in percentage points) that is added to the discount rate (if using a risk-adjusted discount rate) or a set of risk-adjusted cash flows (if using certainty equivalents). The risk premium should be based on empirical evidence and/or financial models (like the CAPM, but extended for long horizons and non-traded projects). If the project's benefits are independent of the market, the risk premium might be near zero. If they are highly correlated with market risk, then the risk premium could be significant.

     Note: We want to isolate the risk premium from the pure time preference and growth components.

  **Step 5: Isolate Pure Time Preference (ρ)**
     - Question: After accounting for growth (θ*g) and risk (risk premium), what remains of the discount rate? That remainder is ρ (pure time preference). We must then decide if the use of a positive ρ is justified.
     - Required Information: The total discount rate (r) that the consultants have provided. Then we subtract the growth component (θ*g) and the risk premium to get ρ: 
          ρ = r - θ*g - risk premium
     - Sufficient Answer: A numerical value for ρ. Then we must confront the normative question: Is it ethically acceptable to have a positive ρ? A positive ρ implies that we value the welfare of future generations less simply because they live in the future. Many economists (following Frank Ramsey) argue that ρ should be zero for intergenerational projects. Others (like Stern with his famous review) use a near-zero ρ (e.g., 0.1%), while others (like Nordhaus) use a higher ρ (e.g., 1-2%).

     - If the calculated ρ is positive and the board deems that a positive ρ is not ethically justifiable for intergenerational projects, then the board must reject any discount rate that includes a positive ρ and require that ρ=0.

  **Step 6: Make Normative Decisions on Pure Time Preference**
     - Question: Is it permissible to use a positive pure rate of time preference (ρ>0) for this intergenerational project?
     - Required Information: This is a normative question. The board must decide on the ethical stance regarding future generations. The board might consider:
          - The principle of intergenerational neutrality: that we should not discount the welfare of future generations solely based on the time they live.
          - The possibility of extinction (e.g., from asteroids or pandemics) which might justify a very small positive ρ (to account for the chance that there are no future generations).
          - The fact that future generations are not here to advocate for themselves, so we must act as their trustees.
     - Sufficient Answer: A board resolution on the acceptable value of ρ (e.g., 0% or 0.1% per year). This becomes a policy parameter for the board.

  **Step 7: Recompute the Discount Rate and Net Present Value (NPV)**
     - Using the board-approved ρ (from Step 6), the growth component (θ*g from Step 3), and the risk premium (from Step 4), compute the adjusted discount rate:
          r_adjusted = ρ_approved + θ*g + risk premium
     - Then compute the NPV of the project using r_adjusted.
          NPV = Σ [ Net Benefit at time t / (1 + r_adjusted)^t ] for t from 0 to T
     - If the NPV is positive, the project is acceptable from a cost-benefit perspective. If negative, it is not.

  **Step 8: Handle Uncertainty and Scenario Analysis**
     - Since the future is uncertain, especially for long-term projects, the board should require multiple scenarios (e.g., high growth, low growth; high risk, low risk) and compute NPV for each. The board should also consider the worst-case scenario and the robustness of the project.

  **Step 9: Decision**
     - Based on the NPV (and possibly other criteria such as distributional impacts, resilience, etc.), the board makes a decision on the proposal.

  **Stopping Points:**
     - If at Step 3 the growth rate (g) or θ cannot be reasonably estimated, the procedure stops and the proposal must be revised to include such estimates or the board must decide on default values.
     - If at Step 4 the risk premium cannot be reasonably estimated (due to extreme uncertainty), the board may choose to use a range of risk premia or to reject the proposal until better risk analysis is available.
     - At Step 6, if the board cannot reach a consensus on ρ, then the procedure stops and the board must resolve this normative question by voting on the acceptable ρ.

  **Explicit Handoff to Normative Domain:**
     - Step 6 is the explicit handoff point where the remaining dispute is not factual but a value choice about whether it is permissible to discount future welfare solely because it occurs in the future.

  ---

  **Application to Concrete Cases**

  **Case 1: Seawall (120-year benefits, high uncertainty)**

  Step 1: Time Profile
     - Costs: High upfront costs in the first 5 years.
     - Benefits: Begin in year 1 (minimal) and increase over time as sea levels rise, extending over 120 years. However, the magnitude of benefits is highly uncertain due to uncertain sea-level rise and engineering standards.

  Step 2: Decompose Discount Rate
     - The consultants provided a discount rate of 4%.

  Step 3: Growth Component (θ*g)
     - Assume θ=1.5 (a common value). 
     - Long-term per capita consumption growth (g) is estimated at 1.5% per year (based on historical data and projections, but note potential climate impacts). 
     - Growth component = 1.5 * 1.5% = 2.25%.

  Step 4: Risk Premium
     - The seawall benefits are highly uncertain and positively correlated with climate change impacts (which may also harm the economy). Therefore, the risk premium is estimated to be 1.5% (reflecting the added risk that the benefits might be lower in bad economic states and the high uncertainty in sea-level projections).

  Step 5: Isolate Pure Time Preference (ρ)
     - ρ = r - θ*g - risk premium = 4% - 2.25% - 1.5% = 0.25%.

  Step 6: Normative Decision on ρ
     - The board must decide: Is a ρ of 0.25% acceptable? This implies that we value a unit of welfare 120 years from now at about 74% of what we would if ρ=0 (because (1+0.0025)^120 ≈ 1.35, so 1/1.35 ≈ 0.74). 
     - The board may reject this positive ρ as being inconsistent with intergenerational equity. They decide to set ρ=0.

  Step 7: Recompute Discount Rate and NPV
     - r_adjusted = 0% (ρ) + 2.25% (growth) + 1.5% (risk) = 3.75%.
     - Now recalculate NPV at 3.75%. Compare to the original 4%. The NPV will be higher (because the discount rate is lower) and might turn positive if it was marginally negative before.

  Step 8: Scenario Analysis
     - The board should also consider:
          - A high sea-level rise scenario: benefits are higher and occur earlier -> higher NPV.
          - A low sea-level rise scenario: benefits are lower -> maybe negative NPV.
          - Also, consider the risk of catastrophic failure: if the seawall fails in a major storm, the costs could be huge. This might require an additional risk adjustment.

  Step 9: Decision
     - If the NPV at 3.75% is positive and the project is robust in multiple scenarios, approve. Otherwise, reject or redesign.

  **Where the normative decision occurs:** In Step 6, the board decided to set ρ=0, overriding the consultant's implied ρ of 0.25%. This is a clear normative handoff.

  ---

  **Case 2: Reforestation Initiative (150-year benefits, relative stability)**

  Step 1: Time Profile
     - Costs: Moderate costs spread over the first 20 years (planting and maintenance).
     - Benefits: Start accruing after 20 years (as trees grow) and continue for 150 years. Benefits include carbon sequestration, biodiversity, and soil restoration. The benefits are relatively stable under projected climatic and economic conditions.

  Step 2: Decompose Discount Rate
     - The consultants provided a discount rate of 3%.

  Step 3: Growth Component (θ*g)
     - θ=1.5, g=1.5% (same as above). Growth component = 2.25%.

  Step 4: Risk Premium
     - The benefits of reforestation are relatively stable and may even be negatively correlated with the economy (if the economy does poorly, carbon prices might be less, but biodiversity and soil benefits are independent). However, the main benefit (carbon sequestration) is subject to policy risk (e.g., changes in carbon pricing). Given the relative stability and potential negative correlation (if we consider that in economic downturns, natural capital becomes more valuable), we estimate a risk premium of 0.25% (low).

  Step 5: Isolate Pure Time Preference (ρ)
     - ρ = 3% - 2.25% - 0.25% = 0.5%.

  Step 6: Normative Decision on ρ
     - The board must decide: Is a ρ of 0.5% acceptable? Over 150 years, this implies a discount factor of 1/(1.005)^150 ≈ 0.47. The board may again decide that ρ should be zero.

  Step 7: Recompute Discount Rate and NPV
     - r_adjusted = 0% (ρ) + 2.25% (growth) + 0.25% (risk) = 2.5%.
     - Recalculate NPV at 2.5%. This will be higher than at 3%. The project is more likely to have a positive NPV.

  Step 8: Scenario Analysis
     - Consider different carbon price trajectories, changes in biodiversity valuation, and potential for forest fires (which could destroy the carbon stock). Run scenarios with and without fire risk.

  Step 9: Decision
     - Based on the NPV and the robustness across scenarios, make a decision.

  **Where the normative decision occurs:** Step 6, when the board sets ρ=0.

  ---

  **Key Takeaways for the Board:**
     - The procedure forces a decomposition of the discount rate and makes explicit the normative choice of pure time preference.
     - The board must be prepared to set a policy on ρ (pure time preference) for intergenerational projects. This is a fundamental value judgment.
     - The growth component and risk premium are positive and based on empirical analysis, but they are also subject to uncertainty and require careful estimation.
     - By using this procedure, the board ensures that the discount rate is not a black box and that the normative choices are made transparently.
answer: |-
  Below is a reusable decision procedure for your board, structured as an ordered checklist. It isolates pure time preference from risk-based and growth-based discounting, flags normative handoff points, and provides clear stopping rules. The procedure is then applied to your two cases.

  ---

  ### **Decision Procedure: Intergenerational Discount Rate Decomposition**

  #### **Step 1: Map the Time Profile**  
  **Question:** *What are the explicit timings of costs (C) and benefits (B)?*  
  - **Sources:** Project proposal, engineering reports, climate models.  
  - **Sufficient Answer:**  
    - A schedule of costs (e.g., upfront, phased) and benefits (annual/decadal projections over the full horizon).  
    - Uncertainty ranges for B (e.g., sea-level rise scenarios for the seawall).  
  - **Stop if:** Costs or benefits lack temporal specificity (demand revision).  

  #### **Step 2: Identify Risk-Based Discounting**  
  **Question:** *What portion of the discount rate accounts for project-specific risks?*  
  - **Sources:** Historical data, probabilistic climate/economic models, sensitivity analysis.  
  - **Sufficient Answer:**  
    - Quantitative risk premium (δ_risk) derived from:  
      - Volatility in B (e.g., variance in sea-level projections).  
      - Correlation of B with systemic risks (e.g., GDP collapse, climate tipping points).  
    - *Distinguish from pure time preference:* Risk-based δ_risk is empirically measurable and varies by project; pure time preference (ρ) is constant and normative.  
  - **Stop if:** Risks are unquantifiable (e.g., no probabilistic models). Proceed with scenario-based NPVs, not a single rate.  

  #### **Step 3: Isolate Growth-Based Discounting**  
  **Question:** *What portion reflects reduced marginal utility from wealthier future generations?*  
  - **Sources:** Long-term economic forecasts (e.g., IPCC SSP scenarios), elasticity of marginal utility (η) studies.  
  - **Sufficient Answer:**  
    - Growth component (δ_growth = η × g), where:  
      - *g* = Expected annual growth rate of real per capita consumption.  
      - *η* = Empirical elasticity (typically 1.0–2.0; e.g., η=1.5 if a 1% rise in consumption lowers utility weight by 1.5%).  
    - *Distinguish from pure time preference:* δ_growth is positive only if future wealth > present wealth. If g ≤ 0 (e.g., climate collapse), δ_growth ≤ 0. Pure time preference ρ is always ≥0.  
  - **Stop if:** g or η cannot be justified (e.g., no consensus on post-2100 growth). Use g=0 as default; revise if benefits assume growth.  

  #### **Step 4: Extract Pure Time Preference (ρ)**  
  **Question:** *After removing δ_risk and δ_growth, what residual rate remains?*  
  - **Calculation:** ρ = r_proposed − δ_risk − δ_growth, where r_proposed is the consultant’s rate.  
  - **Sufficient Answer:**  
    - A numerical ρ value (e.g., ρ = 2% − 1% risk − 0.8% growth = 0.2%).  
    - *Critical Test:* If ρ > 0, it encodes "future welfare is intrinsically less important."  
  - **Stop if:** ρ is negative (reject r_proposed as internally inconsistent).  

  #### **Step 5: Normative Handoff on ρ**  
  **Question:** *Is ρ > 0 ethically justifiable?*  
  - **Sources:** Board’s mandated principles (e.g., intergenerational neutrality).  
  - **Explicit Handoff:**  
    - **Factual domain ends:** Empirical analysis cannot justify ρ > 0.  
    - **Normative domain begins:** Debate permissible values for ρ (0% vs. >0%).  
  - **Sufficient Answer:**  
    - ρ = 0% if:  
      - The board rejects discounting for time alone (e.g., "equal rights for future generations").  
    - ρ > 0% only if:  
      - Justified by extinction risk (e.g., 0.1% for annual human extinction probability) **or**  
      - Explicit voter mandate for present bias (rare for 100+ years).  
  - **Stop with Decision:** Reject r_proposed if ρ > 0 violates board norms.  

  #### **Step 6: Recalculate NPV**  
  **Question:** *What is NPV using the decomposed rate?*  
  - **Formula:** NPV = Σ [B_t − C_t] / [(1 + δ_risk + δ_growth + ρ)^t]  
  - **Sufficient Answer:**  
    - NPV ranges under board-approved ρ (e.g., ρ=0% vs. ρ=0.1%).  
    - Sensitivity analysis for δ_risk and δ_growth.  

  ---

  ### **Application to Cases**  
  #### **Case 1: Seawall (120-Year Benefits, High Uncertainty)**  
  1. **Time Profile:**  
     - Costs: Year 0–5 ($500M).  
     - Benefits: Years 20–120 (high uncertainty: sea-level trajectories ±2m; engineering obsolescence risk).  

  2. **Risk-Based Discounting (δ_risk):**  
     - Risk sources: Sea-level volatility (SD=±0.5m/yr), correlation with economic shocks (e.g., coastal GDP collapse).  
     - δ_risk = 1.5% (calibrated from Monte Carlo simulations of flood damage under IPCC scenarios).  
     - *Not pure time preference:* Tied to measurable, project-specific uncertainty.  

  3. **Growth-Based Discounting (δ_growth):**  
     - Assumptions: g = 1.3% (long-term per capita growth, SSP2 scenario), η = 1.4.  
     - δ_growth = 1.3% × 1.4 = 1.82%.  
     - *Not pure time preference:* Reflects wealth effect, not time itself.  

  4. **Pure Time Preference (ρ):**  
     - Consultant’s r_proposed = 4.0%.  
     - ρ = 4.0% − 1.5% (risk) − 1.82% (growth) = **0.68%**.  

  5. **Normative Handoff:**  
     - ρ = 0.68% implies: $1 of benefit in 120 years is inherently worth 45× less than today, solely due to time.  
     - **Board must decide:** Is this defensible? If intergenerational neutrality is mandated, ρ must be 0% (reject ρ>0).  

  6. **Revised NPV:**  
     - With ρ=0%: r_adj = 1.5% + 1.82% + 0% = 3.32% → NPV = +$180M.  
     - With ρ=0.68%: r=4.0% → NPV = −$20M.  
     - **Recommendation:** Reject consultant’s rate if ρ>0 is impermissible.  

  #### **Case 2: Reforestation (150-Year Benefits, Stable Conditions)**  
  1. **Time Profile:**  
     - Costs: Years 0–10 ($200M).  
     - Benefits: Years 30–150 (stable: soil/carbon sequestration less climate-sensitive).  

  2. **Risk-Based Discounting (δ_risk):**  
     - Risk sources: Wildfires, policy reversals (low probability; SD±5% of B).  
     - δ_risk = 0.4% (from actuarial models of forest resilience).  
     - *Not pure time preference:* Based on project-specific hazard models.  

  3. **Growth-Based Discounting (δ_growth):**  
     - Assumptions: g = 1.3%, η=1.4 → δ_growth = 1.82% (same as Case 1).  

  4. **Pure Time Preference (ρ):**  
     - Consultant’s r_proposed = 3.0%.  
     - ρ = 3.0% − 0.4% (risk) − 1.82% (growth) = **0.78%**.  

  5. **Normative Handoff:**  
     - ρ = 0.78% implies: $1 of benefit in 150 years is inherently worth 80× less due to time alone.  
     - **Board must decide:** Same normative choice as Case 1. ρ>0 is identical in both cases (temporal bias), not justified by stability.  

  6. **Revised NPV:**  
     - With ρ=0%: r_adj = 0.4% + 1.82% + 0% = 2.22% → NPV = +$420M.  
     - With ρ=0.78%: r=3.0% → NPV = +$150M.  
     - **Recommendation:** Accept if ρ=0% is policy; revise if consultant’s ρ>0 is used.  

  ---

  ### **Key Outputs of the Procedure**  
  - **Clarity on Discount Components:**  
    - Risk (δ_risk) and growth (δ_growth) are empirical; ρ is normative.  
  - **Stopping Rules:** Reject rates if:  
    - Temporal profile is vague (Step 1).  
    - ρ < 0 or unexamined (Step 4).  
    - ρ > 0 violates intergenerational ethics (Step 5).  
  - **Normative Handoff:** At Step 5, the board explicitly debates:  
    > *"Is it permissible to value future lives less solely because they live later?"*  
    This question cannot be resolved by data—only by societal values.  

  By forcing decomposition, this procedure ensures empirical rigor on risk/growth while isolating the ethical choice about time preference. It empowers your board to enforce intergenerational neutrality or transparently defend departures.
