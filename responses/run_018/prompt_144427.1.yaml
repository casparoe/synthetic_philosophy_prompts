prompt: |-
  After my sister, a working painter with no philosophy background, admitted that she recently praised a peer's installation mainly because the gallery owner was present and she hoped to secure a future show, she asked me why philosophers say some reasons "count" for an aesthetic judgment while others do not, even when both motivate you. I want to design a single-session teaching plan—delivered over dinner, without texts or citations—to help her understand the wrong-kind-of-reasons problem well enough to audit her own evaluations. I need the conceptual architecture specified: the exact sequence in which to introduce the distinction between reasons that bear on whether an attitude is fitting and reasons that merely cause or incentivize it; why the idea of a "pro-attitude" should come only after she has seen a concrete failure case, not before; the one carrying example drawn from artistic judgment—preferably one that contains both an obvious wrong-kind reason (financial or career gain) and a less obvious one (loyalty to a mentor or institutional pressure)—and what that example must include and exclude so she does not confuse wrong-kind reasons with mere selfishness; the misconceptions she is likely to bring (that honesty about one's motives dissolves the problem, that any explanatory reason is automatically justifying, or that the issue is only about hypocrisy) together with the point in the sequence where each should be preempted; a brief check for understanding that requires her to classify a novel case rather than repeat a slogan; and an explicit boundary of what to leave out—such as parallel problems for belief, metaethical debates about value realism, and institutional-rationality literature—so the session stays focused. Please present this as a plan for explanation, not the explanation itself, and do not include reading lists or references she could not access.
reasoning: |-
  Okay, the user wants a teaching plan to explain the wrong-kind-of-reasons problem to their sister, a painter with no philosophy background. The sister admitted she praised a peer's artwork for career reasons rather than genuine appreciation, prompting her question about why some reasons "count" for aesthetic judgments while others don't. 

  First, I need to understand the core challenge here. The sister isn't asking for abstract theory—she wants tools to audit her own evaluations. That means the explanation must be concrete, rooted in her artistic world, and immediately applicable. No jargon, no texts—just dinner conversation. 

  The key insight to convey is the fittingness distinction: reasons that make an attitude appropriate vs. those that merely motivate it. But introducing "pro-attitude" or "fittingness" upfront would lose her. Better to start with her own confession as the anchor example. That's relatable and visceral. 

  Hmm... the example needs layers: an obvious wrong-kind reason (like her career maneuvering) and a subtler one (say, loyalty to a mentor) to show it's not just about selfishness. Also, must preempt common misconceptions—like thinking honesty solves the problem, or confusing motives with justification. 

  For structure: 
  1. Start with her story to hook her. 
  2. Contrast her praise (motivated by career) with what sincere praise would feel like. 
  3. Define "fittingness" through concrete artistic cases, not theory. 
  4. Unpack wrong-kind reasons using layered examples. 
  5. Preempt pitfalls where they'd naturally arise. 
  6. End with a fresh case for her to classify. 

  Crucially, avoid tangents: no belief parallels, no realism debates. Stay in the art world. The check-for-understanding should force application, not repetition. 

  ... Wait, the financial/career example is clear, but how to illustrate institutional pressure without overcomplicating? Maybe a scenario where a museum curator feels pressured to praise a donor's mediocre collection. That mirrors her gallery owner dynamic but removes personal gain. 

  And for the misconception about honesty: when she admits mixed motives, she might think that alone fixes it. Need to stress that transparency doesn't make the reason fitting—it just makes her self-aware. 

  The dinner format helps: can use wine glasses or napkins as props for "reasons" vs. "judgment." Keep it tactile. 

  Final check: if she can correctly diagnose why praising a friend's bad painting out of loyalty is a wrong-kind reason (even if selfless!), that's the win.
answer: |-
  Here’s a focused teaching plan for a single dinner conversation, structured to build intuitive understanding through relatable artistic examples and preempt common misconceptions:

  **Goal:** Equip her to distinguish *reasons that justify an aesthetic judgment* (right-kind reasons/RKR) from *reasons that merely motivate it* (wrong-kind reasons/WKR) using her own confession as an anchor.

  **Core Architecture Sequence:**

  1.  **Anchor in Her Experience (Hook & Problem Setup):**
      *   Start with her story: *"When you praised the installation partly to impress the gallery owner, what were your reasons?"* List them: e.g., "The textures were innovative" (potential RKR) and "I wanted a future show" (WKR).
      *   **Question:** *"Both reasons motivated your praise. Why might philosophers say only the first kind 'counts' as a reason for the praise itself?"* (Introduce the puzzle without jargon).

  2.  **Concrete Failure Case - The "Fittingness" Intuition (Build Core Concept):**
      *   **Example:** Imagine two artists critique the same abstract painting:
          *   Artist A: "This is profound! The chaotic brushwork perfectly captures modern anxiety." (Reasons about the *painting's qualities*).
          *   Artist B: "This is profound! My mentor created it, and I owe her loyalty." (Reasons about *loyalty/obligation*).
      *   **Highlight:** Both say "profound," but Artist B's reasons feel *off-target* for that judgment. They explain *why Artist B said it*, not *why the painting deserves it*.
      *   **Introduce Key Term (Post-Failure):** *"We sense Artist B's attitude (praise/judgment) isn't **fitting** to the thing itself. Their reasons don't connect to whether the painting actually has profound qualities. Artist A's reasons do."* (Fittingness = match between attitude and object).

  3.  **Define "Pro-Attitude" Implicitly via Fittingness (Leverage Intuition):**
      *   *Don't define "pro-attitude" first.* Instead: *"Judging something 'good,' 'profound,' or 'beautiful' is like aiming an attitude (praise, admiration) at the artwork. For that attitude to hit the mark – to be **fitting** – the reasons need to be about features of the target (the artwork)."* (The "pro-attitude" is the praise/admiration itself).

  4.  **The Carrying Example - Layered WKRs (Illustrate Scope & Nuance):**
      *   **Scenario:** Critic reviewing a controversial new sculpture exhibit.
      *   **Potential Judgments & Reasons:**
          *   **Fitting Judgment (RKR):** "This is groundbreaking! It challenges material conventions in a way that forces new perspectives." (Reasons: Sculpture's formal properties, conceptual impact).
          *   **Obvious WKR:** "This is groundbreaking! Writing a positive review will get me invited to the exclusive opening gala." (Reason: Personal social gain).
          *   **Less Obvious WKR:** "This is groundbreaking! The artist studied under my revered teacher, and promoting his legacy feels important." (Reason: Loyalty to mentor/institution).
          *   **Less Obvious WKR:** "This is groundbreaking! The museum director (who signs my contract) hinted strongly that a positive review is expected." (Reason: Institutional pressure/job security).
      *   **Crucial Elements:**
          *   **Include:** Both selfish (gala invite) and non-selfish (loyalty, pressure) WKRs. Show loyalty/pressure *feel* different from greed but are still WKRs because they don't address the sculpture's actual artistic merit.
          *   **Exclude:** Reasons that *are* about the art but are *bad* artistic reasons (e.g., "It's groundbreaking because it's blue, and blue is trendy"). *This is a bad RKR, not a WKR.* The issue is *kind*, not quality.

  5.  **Addressing Misconceptions (Preemptively & Reactively):**
      *   **Misconception 1: "Honesty about motives solves it."** (Preempt after Carrying Example): *"Even if the critic admits, 'I said it was groundbreaking because of loyalty, not the art,' that honesty doesn't make the loyalty a reason *for* the artistic judgment. It just explains the insincerity."*
      *   **Misconception 2: "Any reason explaining my judgment justifies it."** (Preempt when introducing Fittingness): *"Artist B's loyalty explains *why they judged it profound*, but does it show the painting *is* profound? No. Explanatory reasons aren't always justifying reasons."*
      *   **Misconception 3: "It's just hypocrisy."** (Address if raised): *"Hypocrisy is saying one thing while believing another. This is deeper. You might genuinely *feel* praise because of loyalty/pressure (so not hypocritical), but the *reason* for that feeling (loyalty) still doesn't support the *truth* of the judgment ('this is good art')."*

  6.  **Check for Understanding (Application, Not Repetition):**
      *   **Novel Case:** "Imagine an artist visits a friend's studio. The new paintings are technically weak and derivative. The artist feels pressured to say, 'These show real growth!' because their friend is going through a divorce and needs support. Is 'supporting my friend' a right-kind or wrong-kind reason for the aesthetic judgment ('shows real growth')? Why?"
      *   **Desired Answer:** WKR. While noble, "supporting my friend" is a reason to *offer encouragement*, not a reason that shows the paintings themselves possess the quality of "showing real growth." The attitude (praise for artistic growth) isn't fitting to the actual paintings.

  7.  **Explicit Boundaries (What We're NOT Covering):**
      *   *"We're focusing purely on judgments about art/beauty – things like 'this is good,' 'profound,' 'beautiful.'"*
      *   *"We're not talking about reasons for belief (e.g., believing something because it's useful vs. true)."*
      *   *"We're not debating whether artistic value is real or subjective – assume for tonight that we *can* have better or worse reasons for judgments."*
      *   *"We're not diving into how galleries or markets create their own incentive systems ('institutional rationality')."*

  **Teaching Principles for Delivery:**
  *   **Conversational:** Use her examples first. Ask questions ("Does that feel right?", "Can you think of another situation like this?").
  *   **Visual (Optional):** Sketch a quick diagram: Artwork (Target) <- **Fitting Reasons** (Arrow) -> Judgment (e.g., "Profound!"); **WKRs** (Arrow) floating off to the side pointing *only* at the person making the judgment.
  *   **Relatable Language:** Use "counts for the judgment itself," "hits the mark," "reasons about the thing," "reasons about me/my situation."
  *   **Emphasize:** The goal is *self-audit*: "When you feel yourself judging art, pause and ask: 'Are my reasons for this judgment actually about the artwork's qualities, or are they about something else (even something good, like loyalty)?'"

  This plan moves from her concrete experience, builds the core "fittingness" intuition through relatable artistic failure cases, uses a layered carrying example to show WKRs beyond selfishness, preempts key confusions, checks understanding with a novel case, and strictly avoids philosophical tangents.
