answer: |-
  Here is your essay question, model answer, and marking scheme presented as a single integrated text:

  Consider the artwork *Persistent Form*: a bust-shaped lattice through which a chemically identical ceramic slurry is pumped at a rate ensuring every particle within the lattice is replaced within sixty seconds. Macroscopic shape, texture, weight, and even microscopic surface weathering patterns are maintained constantly by precise calibration of flow and composition. Consequently, no particle present at time T is present at T+60 seconds. The museum labels it a single, persistent statue. Your friend argues it is not a statue but a four-dimensional process – a "river of slurry" temporally shaped like a head. You find yourself thinking it *is* a statue, constituted by, but not identical to, the successive batches of matter. A third view might hold that each distinct batch constitutes a numerically distinct statue, lasting only a minute. Write an essay adjudicating between these three interpretations: (1) Persistent Form is a single statue constituted by, but not identical to, the successive material batches; (2) it is a single, four-dimensionally extended process identical to the flowing slurry; (3) it is a rapid series of numerically distinct statues, each constituted by a batch of slurry lasting less than a minute. In your analysis, you must: (a) explain how each interpretation handles the constant total material replacement while maintaining form; (b) evaluate whether artifacts like statues must have essential material origins or whether essential functional-formal properties (like maintaining a specific shape for display) suffice for persistence; (c) critically assess whether a constitution-based view (option 1) can coherently posit a persisting object that shares *no* temporal parts (i.e., no matter) with its earlier stages, and if so, what grounds its diachronic identity; and (d) argue which view provides the most plausible account of what the museum is displaying and why the label "statue" is or is not appropriate. Avoid extensive rehearsal of the standard Ship of Theseus puzzle; focus on the novel features of *Persistent Form*.

  A compelling answer would develop as follows: The core metaphysical challenge posed by *Persistent Form* is whether an object can persist through time without any continuity of its constituent matter, relying solely on the continuous maintenance of its form and function by external means. The three interpretations represent distinct ontological commitments. Option 3, the series of distinct statues, emphasizes material composition as essential to an artifact's identity. Each minute, a new batch of slurry occupies the lattice, constituting a new statue. When the batch is fully replaced, that statue ceases to exist, replaced by another. While this view straightforwardly respects the total matter change, its implausibility lies in misdescribing the artwork's intended and perceived nature. The museum curators, artists, and visitors experience and label *one* persistent artwork, not a flickering sequence of thousands of distinct statues per day. This functional unity – the stable presentation of a specific form for aesthetic contemplation – is disregarded if we insist each material batch defines a new object. Furthermore, the apparatus ensures *continuity* of form and properties in a way that feels like persistence of a single entity, unlike, say, replacing one bust with a duplicate. The view fails to capture the artwork's raison d'être: persistence *despite* matter flux.

  Option 2, identifying the statue with the four-dimensional process-river, avoids positing distinct short-lived statues. It claims the statue just *is* the entire spatiotemporally extended flow of slurry through the lattice. This elegantly handles the matter replacement: different temporal parts have different matter, but the whole process exists across time. However, it risks dissolving the statue into its underlying process, potentially losing what makes it an *artifact* rather than just a dynamic material event. Statues are typically understood as spatially bounded, cohesive objects with stable form *at a time*, not as processes whose temporal parts are fleeting. While processes persist, they don't persist *as statues* in the conventional sense; a river isn't a statue. The museum labels a spatially bounded, head-shaped entity *present now*, not merely a temporal segment of a flow. Reducing the statue to the process conflates the artwork with its sustaining mechanism and the matter flowing through it, neglecting the distinct role of the stable form maintained.

  Option 1, constitution without identity, offers the most plausible account by separating the statue's persistence conditions from those of its matter. The statue is a distinct entity constituted at each moment by the slurry-in-the-lattice, but not identical to it. The statue persists as long as the lattice (or the sustaining system) successfully maintains the specific, constant form and functional properties – the shape, texture, appearance, and role as a display object – despite the complete matter turnover. Its diachronic identity is grounded in the continuity of this form and function, guaranteed by the calibrated apparatus. This explains the museum's label: there is one statue because there is one continuously maintained form fulfilling the statue role. The objection that there is *no* temporal overlap of constituent matter is serious but surmountable. The statue's persistence doesn't require overlapping matter; it requires the continuous realization of its essential form-functional properties by *some* appropriate matter. The lattice provides the structural stability bridging the matter gaps. The matter is essential only derivatively – it must be capable of constituting *that* form. Crucially, the statue's identity conditions are tied to the artifact kind 'statue for display', which prioritizes stable form and function over material continuity. The constituting matter serves the role of realizing the form; it is not the bearer of identity. Thus, while each slurry batch constitutes a numerically distinct parcel of matter, it successively constitutes the *same* statue by continuously satisfying the conditions for being *that* statue's material basis at that time. The statue persists through the replacement because what matters for *its* persistence (stable form/function) is preserved, even though what matters for the *matter's* persistence (material continuity) is absent. Therefore, the museum is correct: *Persistent Form* is a single statue, constituted by but distinct from the flowing slurry, whose persistence is secured by formal and functional continuity maintained externally.

  For the marking scheme: An A answer (18-20/20) must clearly distinguish all three interpretations and engage deeply with points (a)-(d). It will decisively reject option 3 (series of statues) by highlighting the artwork's intended functional unity and the disconnect with phenomenological and institutional facts. It will acknowledge the appeal of option 2 (process) in handling matter flux but robustly challenge it by arguing it fails to capture the artifact's stable-at-a-time nature and distinct persistence conditions as a displayed object, potentially conflating the statue with its matter or sustaining process. It will then defend option 1 (constitution) as superior, explicitly grounding the statue's diachronic identity in the continuous maintenance of essential form-functional properties (shape, texture, display role) by the apparatus, despite zero matter overlap. It must directly confront and provide a reasoned solution to the "no temporal parts overlap" challenge for constitution theory, arguing that matter continuity is *not* essential for artifact persistence when form/function is preserved. It should emphasize the artifact kind 'statue' as defining the relevant persistence conditions. Crucially, it will argue why the museum's label is appropriate based on this view. A B answer (16-17/20) will competently describe the three views and identify key issues but may lack depth in one area. It might reject option 3 and acknowledge problems with option 2, but its defense of option 1 could be less developed, perhaps glossing over the "no matter overlap" problem or giving a weaker account of what grounds diachronic identity beyond mere form (e.g., not sufficiently tying it to function/apparatus). It might state that form is preserved but not fully articulate *how* this grounds identity without matter continuity or why it's essential for artifacts. It may rely more on intuition ("it just is one statue") than rigorous metaphysical reasoning for the constitution view regarding the museum label. Points will be deducted for significant confusion about constitution vs. identity, misapplication of the concepts of essential properties (e.g., claiming material origin *must* be essential without argument relevant to this case), irrelevant rehearsal of the Ship of Theseus without applying its lessons specifically to *Persistent Form*'s unique features (total instantaneous replacement), or failing to adequately address part (d) about the museum label.

  Regarding confidence: I am highly confident (90%) in the structure of the question and the model answer's core argument rejecting the series view and defending constitution based on form/function. The critique of the process view as potentially dissolving the artifact is also strong. The point I am least sure about (perhaps 70% confident) is whether the constitution view *fully* resolves the "no temporal overlap" worry to universal satisfaction. While I argue persuasively that form/function grounds identity and matter overlap isn't necessary, some might still find an object with absolutely no physical continuity across time metaphysically suspect, feeling the lattice alone is insufficient 'glue'. However, within the bounds of mainstream constitution theory applied rigorously to artifacts, I believe the model answer provides a coherent and defensible resolution, making it appropriate for the exam context. The novelty of the scenario ensures students must think, not just recall.
