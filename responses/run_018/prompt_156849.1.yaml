prompt: |-
  I am a sixth-form student assisting with caption revisions at my school’s local-history museum, where I must decide, for each display panel, whether to present a non-human factor—such as a pathogen outbreak, a volcanic winter, or a prolonged climate shift—as an active historical agent rather than mere background conditions. I apply this decision repeatedly, with a fifteen-minute time limit per caption, and my history teacher must sign off; I have no specialist library access. I need a reusable procedural checklist, derived from the distinction between ‘trigger conditions’ (necessary but insufficient events that only become causally decisive through specific human institutional vulnerabilities) and ‘structural drivers’ (long-term environmental pressures that reshape but do not replace human choice), together with the principle that attributing agency to a non-human force requires demonstrating its embeddedness in a responsive network of human practices rather than isolated physical impact. The procedure should specify, in ordered steps, how to test whether an event meets both conditions, flag the points where subjective judgement is unavoidable—especially in assessing institutional vulnerability—and state clearly where it will misfire or remain silent. Apply it to three worked cases: the 1815 Tambora eruption and the subsequent ‘Year Without a Summer’ food riots; the arrival of bubonic plague in fourteenth-century Europe amid feudal labour structures; and the influence of the Little Ice Age on the Thirty Years’ War. Include one case where the procedure denies agency to a factor I am inclined to treat as decisive. Conclude by stating what the procedure cannot settle. Please present the bottom-line rule of thumb in the opening sentence, write in British English, and limit your response to 450 words.
reasoning: |-
  Okay, the user is a sixth-form student working on caption revisions for a local-history museum. They need a reusable checklist to decide if non-human factors like pathogens or climate events should be presented as active historical agents rather than just background. The key points are distinguishing 'trigger conditions' from 'structural drivers' and ensuring agency only if the factor is embedded in human responses. 

  Hmm, the student has a tight deadline - fifteen minutes per caption - and no library access, so the procedure must be efficient. Their teacher's sign-off adds pressure to get this right. Underlying this, they probably want to avoid oversimplifying history while making captions engaging for museum visitors. 

  The core challenge is balancing causality: when does a volcano or plague truly shape events versus just setting the stage? The trigger-vs-structural framework makes sense. For agency, the human practice network is crucial - it's not just physical impact but how societies react that grants 'agency'. 

  *Mentally testing the three cases:*
  - **Tambora 1815**: Clear trigger. The eruption alone didn't cause riots; it exposed vulnerabilities in pre-industrial food systems when coupled with existing grain market failures. Human practices (hoarding, distribution) amplified the crisis. 
  - **Black Death 1348**: Also a trigger, but more transformative. Feudal structures dictated the response - lords trying to freeze wages, peasants leveraging scarcity. The pathogen activated latent class tensions. 
  - **Little Ice Age & Thirty Years' War**: Trickier. While climate stress existed, it was one pressure among many (religion, politics). No direct causation to war outbreak - better framed as structural background. 

  *Where the procedure pushes back:* Say, attributing the war solely to crop failures ignores how human choices (alliances, leadership) escalated conflict. The checklist should flag this overreach. 

  *Limitations:* It won't settle debates where human/non-human forces are equally entangled (e.g., climate migration tipping points). Also, assessing 'vulnerability' remains inherently subjective - the student must document their reasoning for teacher review. 

  Final thought: The opening rule of thumb must be punchy. "Grant agency only where..." sets the tone. Keeping steps numbered for clarity within the word limit.
answer: |-
  **Bottom-line rule:** Grant agency only where the non-human factor demonstrably *activated* specific human institutional vulnerabilities, thereby redirecting social action, rather than merely enabling or compounding existing trends.

  **Procedural Checklist (British English):**

  1.  **Identify Factor & Event:** State the non-human factor (e.g., eruption, plague arrival, cooling) and the specific historical outcome.
  2.  **Test for Trigger Condition:** Ask: "Was this factor a *necessary* spark for the *specific* outcome? Could the outcome have occurred *without it* at that time/place?" If **No**, it's likely background/a structural driver. Flag: *Judgement call based on context.*
  3.  **Test for Embeddedness:** Ask: "Did the factor's impact *directly* exploit a *pre-existing, identifiable vulnerability* within human institutions (e.g., inflexible laws, weak supply chains, exploitative labour relations)? Can we trace how *human responses* (decisions, conflicts, adaptations) *to this specific factor* became the *primary mechanism* causing the outcome?" If **No**, it lacks agency. Flag: *Judgement call assessing institutional vulnerability and causal primacy.*
  4.  **Decision:** If both **Yes**, present as an active agent. If either **No**, present as background/structural driver. Note: *Misfires if institutions are too vaguely defined or if the human responses are entirely predictable/automatic.*

  **Worked Cases:**

  1.  **Tambora (1815) & Food Riots:** Volcanic winter as **Agent**. *Trigger:* Necessary spark; no eruption, no *unprecedented* 1816 famine trigger. *Embeddedness:* Exploited vulnerabilities (grain market speculation, poor transport, outdated Poor Laws). Human responses (panic buying, hoarding, protests *against authorities*) *were* the riots.
  2.  **Bubonic Plague (1348) Arrival:** Pathogen as **Agent**. *Trigger:* Necessary spark for *continent-wide* demographic collapse. *Embeddedness:* Exploited feudal labour structure vulnerability (fixed wages). Human responses (peasants demanding higher wages, lords enforcing Statutes of Labourers) *were* the social crisis, reshaping feudalism.
  3.  **Little Ice Age & Thirty Years' War:** Climate shift as **Structural Driver, NOT Agent**. *Trigger:* **No.** War erupted over complex religious/political/dynastic issues; climate stress was a chronic pressure, not the decisive spark. *Embeddedness:* While worsening hardship, its impact wasn't channelled through a *specific institutional vulnerability* that *caused* the war outbreak. Human choices (Bohemian Revolt, Habsburg response) were paramount.

  **Case Denying Agency:** The Little Ice Age (above). While influencing conditions, it didn't *trigger* the war via specific institutional failure.

  **What the Procedure Cannot Settle:**
  *   The *degree* of influence when multiple triggers/drivers overlap.
  *   Defining the precise threshold of "sufficient" vulnerability.
  *   Cases where non-human factors *indirectly* create entirely new institutions/vulnerabilities over the very long term.
