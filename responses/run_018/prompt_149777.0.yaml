answer: |-
  Here’s a practical breakdown of the multi-modal approach for your mediation report, including strengths, pitfalls, concrete phrasing, and defense strategies—grounded in real-world policy constraints:

  ### **Why Multi-Modal Framing Helps vs. Where It Collapses**
  **Strengths:**  
  - **Defuses polarization:** Forces stakeholders to acknowledge *aspects* of opposing claims (e.g., "Your 'false' claim contains a 'true in one respect' about traffic impact").  
  - **Uncovers hidden agreements:** Shows where parties *accidentally agree* (e.g., "Both 'green corridor' and 'ecologically dead' framings agree soil remediation is needed").  
  - **Future-proofs decisions:** Documents nuances for later adjustments (e.g., if "economic boost" proves exaggerated, the "false in another respect" caveat is pre-recorded).  
  - **Complies with mediation ethics:** Avoids imposing "truth" where evidence is legitimately contested (e.g., ecological assessments with conflicting expert reports).  

  **Collapse Points:**  
  - **Legal/adjudicative contexts:** Courts *need* binary findings ("approved/denied"). Your report feeds into that, but isn’t final.  
  - **When stakeholders weaponize ambiguity:** Bad actors might seize on "indescribable" to derail implementation.  
  - **Overwhelm risk:** Poorly structured modes read like academic navel-gazing. Must tether each mode to actionable outcomes.  

  ---

  ### **Concrete Report Language (Using Your 7 Modes)**  
  *Frame the analysis as "Evaluative Dimensions" to sound deliberate:*  

  > **Claim 1: "The project significantly boosts the local economy."**  
  > - **True in one respect:** Projections confirm 120 construction jobs and 15 permanent retail positions.  
  > - **False in another respect:** No verifiable data supports claimed "trickle-down" benefits to adjacent businesses.  
  > - **Both true and false:** While tax revenue increases (true), it may displace existing low-margin services (false).  
  > - **Neither true nor false:** "Boost" implies universal benefit; distribution is inequitable (neither).  
  > - **Indescribable:** Long-term economic resilience cannot be modeled with available data.  
  > - **Mode 6/7 (Contextual/Contingent):** Economic benefit is contingent on vacancy rates <12%—a volatile metric.  
  >   
  > **Recommendation:** Approve with condition: Developer funds independent 3-year impact study.  

  > **Claim 2: "Destroys the only functional green corridor."**  
  > - **True in one respect:** Removes 0.8 acres of mature canopy critical for migratory birds (per Audubon Society).  
  > - **False in another respect:** "Only corridor" overstates function; adjacent park provides 70% of species habitat.  
  > - **Both:** Site *is* a visual "green" buffer (true), but stormwater management is dysfunctional (false).  
  > - **Neither:** "Destruction" ignores proposed bioswale replacements (mitigation renders neither applicable).  
  > - **Indescribable:** Ecological "value" depends on subjective prioritization of aesthetics vs. biodiversity.  
  >   
  > **Recommendation:** Require on-site habitat replication + connectivity to municipal greenway.  

  > **Claim 3: "The land is ecologically dead, making green arguments moot."**  
  > - **True in one respect:** Soil tests show hydrocarbon contamination (non-viable for agriculture).  
  > - **False in another respect:** 2023 fauna survey documented 14 native pollinator species.  
  > - **Both:** Structurally degraded (true), but functions as urban heat sink (also true).  
  > - **Neither:** "Dead" misapplies ecological terminology; sites exist on a vitality spectrum.  
  > - **Indescribable:** "Moot" conflates ecological and recreational values—a category error.  
  >   
  > **Recommendation:** Mandate remediation fund; integrate soil health into landscape design.  

  ---

  ### **The One Reply That Must Land (Against "Indecision with Extra Steps")**  
  > **"This framework forces active engagement with *why* claims conflict—revealing where compromise *actually lives*.** Binary rulings bury legitimate concerns that resurface as lawsuits or non-compliance. Here, we’ve mapped each faction’s core validity: Economists get accountability metrics, environmentalists get habitat guarantees, and pragmatists get cost-capped remediation. That’s not indecision—it’s *actionable precision*."  

  ### **Where to Acknowledge Limits**  
  > **Report Disclaimer:**  
  > *"This multi-modal analysis clarifies stakeholder positions but cannot override statutory requirements. Final determinations rest on legal standards (e.g., 'undue environmental burden'). Recommendations optimize for *negotiable* variables identified herein."*  

  ### **Why This Works in Practice**  
  You’re not delegating the *decision*—you’re structuring ambiguity so the board’s eventual yes/no vote:  
  1. Addresses the *strongest* fragment of each claim (e.g., "We approved because economic gains offset *mitigated* ecological loss"),  
  2. Prevents post-ruling surprises ("Your report already noted the jobs claim was 'contingent on vacancy rates'—we built in a review trigger"),  
  3. Legally covers the board by documenting due diligence on contested points.  

  **Tactical Tip:** Label each mode numerically in an appendix ("Evaluation Mode Definitions") but use plain language in the body. Lawyers tolerate complexity if it’s indexed and scannable.  

  If the board chair still demands a "true" verdict: **"Based on preponderance, the economic and ecological claims are both *partially valid but incomplete*; the 'ecologically dead' claim is the least supported by evidence. However, reducing to a binary would discard mitigations that resolve 80% of objections."** This bridges their need for simplicity without surrendering nuance.
