answer: |-
  Here's a comprehensive spec sheet for a robust dialetheic/paraconsistent logic, separating hard requirements from preferences and highlighting tensions:

  **Core Objective:** Provide a coherent, non-trivial framework for reasoning in the presence of *true contradictions* (dialetheism) or at least *tolerating* contradictions without collapse (paraconsistency), particularly for significant real-world or theoretical cases.

  **I. Mandatory Handling (Core Use Cases - Must Handle Without Collapse)**
  1.  **Semantic Paradoxes:** The Liar ("This sentence is false") and variants (Strengthened Liar, Liar Cycles). Must accommodate the possibility that such sentences are *both true and false* without trivializing the system. (Primary motivation).
  2.  **Naive Set Comprehension:** The schema `∃y∀x(x ∈ y ↔ φ(x))` must be satisfiable without leading to triviality via Russell's Paradox (`R = {x | x ∉ x}`). Must allow `R ∈ R ∧ R ∉ R` to be true without explosion. (Foundational motivation).
  3.  **Conflicting Legal/Normative Systems:** Cases where two valid, applicable laws/rules prescribe genuinely incompatible actions/verdicts for a specific situation (e.g., "Action A is mandatory" vs. "Action A is forbidden" under the same jurisdiction/context). Must model the conflicting obligations/consequences coexisting. (Practical realism).
  4.  **Inconsistent Data/Information States:** Overlapping reports from reliable sources asserting `P` and `¬P` about the same event/state, where both cannot be dismissed as simply false (e.g., conflicting eyewitnesses, sensor readings). Must allow representation and non-trivial inference from `P ∧ ¬P`. (Information management).

  **II. Mandatory Distinctions (Must Preserve)**
  1.  **Contradictory (`A ∧ ¬A` holds) vs. Ambiguous (Neither `A` nor `¬A` determinately holds):** The logic must provide resources to model and reason about ambiguity/indeterminacy *differently* from explicit contradiction. Contradiction is a *positive* state (both hold), ambiguity is a *negative* or *undefined* state (neither definitively holds).
  2.  **True Contradiction (`A ∧ ¬A` is *true*) vs. False Contradiction (`A ∧ ¬A` is *false*):** The logic must have the expressive power to assert that some contradictions are true (dialetheia) while others are simply false (like most ordinary claims). Not every sentence of the form `A ∧ ¬A` should be true.
  3.  **Logical Truth vs. Explosive Triviality:** Must distinguish sentences true *solely by virtue of logical form* (e.g., `A → A`) from the explosive state where *every* sentence is true. Rejecting Explosion (see III.1) is essential to maintaining this distinction.

  **III. Treatment of Classical Results (Must Explicitly Accept or Reject & Justify)**
  1.  **Explosion / Ex Contradictione Quodlibet (ECQ):** (`A, ¬A ⊢ B` for *any* `B`) **Must Reject.** *Justification:* Core tenet of paraconsistency. Preservation of this rule makes handling true contradictions (I.1, I.2) impossible without triviality. The *primary purpose* of the logic is to block this.
  2.  **Disjunctive Syllogism (DS):** (`A ∨ B, ¬A ⊢ B`) **Must Reject or Severely Restrict.** *Justification:* In logics where `A ∧ ¬A` can hold, `A ∨ B` and `¬A` *do not* entail `B` (since `A` holds even though `¬A` holds, so `B` might be false). Retaining full DS alongside `A ∧ ¬A` often leads to de facto ECQ.
  3.  **Law of Non-Contradiction (LNC):** (`¬(A ∧ ¬A)`) **Must Reject as universally true.** *Justification:* Dialetheism asserts that for *some* `A`, `A ∧ ¬A` is true, making `¬(A ∧ ¬A)` false for those `A`. It may remain *true* for many other `A`. The status of LNC as a *theorem* must be non-universal.
  4.  **Modus Ponens (MP):** (`A, A → B ⊢ B`) **Strong Preference to Preserve.** *Justification:* Fundamental to reasoning and conditionals. Rejecting MP severely cripples practical applicability. *However, preservation is non-trivial (see V. Tensions).*
  5.  **De Morgan Laws:** (`¬(A ∧ B) ↔ ¬A ∨ ¬B`, `¬(A ∨ B) ↔ ¬A ∧ ¬B`) **Strong Preference to Preserve.** *Justification:* Intuitive meaning of connectives and negation. Crucial for many reasoning patterns. Alterations significantly change logic's character.

  **IV. Desirable Features / Preferences (Not Strictly Mandatory)**
  1.  **Scope of Contradictions:** *Preference Spectrum:* (a) Priest-Style (Contradictions possible anywhere, though rare) vs. (b) Restricted Dialetheism (Only specific domains like semantics/set theory/legal conflicts admit true contradictions).
  2.  **Relevance / Variable-Sharing:** *Preference:* Conditionals (`A → B`) should require `A` and `B` to share propositional variables. *Justification:* Avoids "paradoxes of implication" (e.g., `A ⊢ B → B`, `¬A ⊢ A → B`), enhancing intuitive validity. *Conflict:* Can clash with full MP preservation (see V).
  3.  **Truth-Functionality:** *Preference:* Connectives (especially negation, conjunction, disjunction) should be truth-functional. *Justification:* Simplicity, clarity. *Challenge:* Difficult to achieve robustly while handling all core cases clearly.
  4.  **Completeness/Decidability:** *Preference:* The logic should be proven sound and complete relative to clear semantics, and ideally decidable for useful fragments. *Justification:* Mathematical rigor and practical computability.
  5.  **"Recapture" of Classical Logic:** *Preference:* Ability to define a "classical fragment" or safe contexts where classical reasoning (including ECQ, DS, LNC) is recovered. *Justification:* Most reasoning is consistent; the logic shouldn't break it.

  **V. The Database Timestamp Edge Case & Analysis**
  *   **Case:** Record marked as both "Updated @ T" and "Not Updated @ T" simultaneously (same timestamp `T`).
  *   **Analysis Requirement:** The logic *must provide the tools* to model this state as `Updated(T) ∧ ¬Updated(T)` *if* the evidence genuinely supports a true ontological contradiction at `T` (e.g., two perfectly reliable, atomic update processes conflicting fundamentally). **However, the logic must *also* allow modeling it as:**
      *   **Ambiguity:** It's indeterminate *which* update status holds at `T`.
      *   **Temporal Indivisibility:** `T` represents an interval, and the update happened *during* `T`, making "Updated @ T" true and "Not Updated @ T" false (or vice versa, depending on definition).
      *   **Glitch/Error:** One or both statements are simply false due to a system error (`¬(Updated(T) ∧ ¬Updated(T))` is true).
  *   **Key Distinction:** The logic doesn't *dictate* which interpretation is correct. It **must distinguish** the *formal representation* of a true contradiction (`Updated(T) ∧ ¬Updated(T)`) from representations of ambiguity (`¬Definitely(Updated(T)) ∧ ¬Definitely(¬Updated(T))`) or simple error (`False(UpdateLogEntry1) ∨ False(UpdateLogEntry2)`). The *application* of the logic determines which model fits the evidence.

  **VI. Key Tensions / Impossibility Clusters**
  1.  **The MP/Relevance/Explosion Avoidance Trilemma:**
      *   **Tension:** Achieving **Full Modus Ponens (MP)**, **Strong Relevance (Variable-Sharing)**, and **Robust Explosion Avoidance (Paraconsistency)** simultaneously is exceptionally difficult.
      *   **Mapping:**
          *   **MP + Explosion Avoidance:** Requires careful treatment of disjunction and negation to prevent `A, ¬A ⊢ B` via routes involving DS or similar. Often leads to non-truth-functional connectives or complex semantics.
          *   **MP + Strong Relevance:** To avoid irrelevance (`A ⊢ B → B`), conditional semantics often restrict MP or require special conditions. Adding true contradictions (`A ∧ ¬A`) can easily violate relevance constraints if MP is unrestricted.
          *   **Strong Relevance + Explosion Avoidance:** Logics like strong relevant logics (e.g., R) achieve this beautifully but typically **sacrifice full MP** (or define a weaker conditional where MP holds, but relevance constraints might be looser elsewhere). Attempting to add full MP while preserving relevance and paraconsistency often leads to inconsistency or triviality.
      *   **Outcome:** Most robust systems sacrifice *either* full unrestricted MP *or* strong variable-sharing relevance. True dialetheic logics (like LP with a suitable conditional) often keep MP but sacrifice strong relevance. Strong relevant paraconsistent logics keep relevance but have a non-standard conditional where MP doesn't hold universally.

  **Summary Spec:** A viable dialetheic/paraconsistent logic must handle semantic/set-theoretic paradoxes, normative conflicts, and inconsistent data non-trivially (I). It must clearly distinguish contradictions from ambiguity and true contradictions from false ones (II). It *must* reject ECQ and DS as universal rules and reject LNC as universally true, while ideally preserving MP and De Morgan (III). Preferences exist regarding scope, relevance, and recapture (IV). It must provide formal means to analyze edge cases like the timestamp without forcing a dialetheic interpretation (V). Crucially, it faces a fundamental tension preserving full MP, strong relevance, and robust paraconsistency jointly (VI).
