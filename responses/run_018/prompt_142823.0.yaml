answer: |-
  The archive at Gantry Station smelled perpetually of dust, ink, and the faint, metallic tang of the rain that seeped through ancient stone. Archivist Lin’s domain was a cathedral of categorization, its towering shelves groaning under ledgers bound in cracked leather. The system was perfect, elegant in its division: Form and Substance lived in separate wings, connected only by brittle cross-reference slips.

  The white horse arrived at dusk, led by a nervous trader from the steppes. It was magnificent – a creature of ivory light and restless muscle, steam puffing from its nostrils in the damp air. Lin felt the familiar pang of dissonance. The living thing before her was *one*; the filing system demanded it be *two*.

  "Registration," Lin stated, her voice echoing slightly in the high-ceilinged intake chamber. She opened the massive **Form Registry – Equine (FRE)**. Its pages listed only horseness: skeletal structures, gaits, herd behaviours, digestive systems. Colour was irrelevant here. Her pen hovered. *Horse (Equus ferus caballus) – Standard Variation. Physically present. Cross-reference: Substance Registry – Chromatic (SRC).*

  She then walked the cold stone corridor to the **Substance Registry – Chromatic (SRC)**. This ledger dealt in hues, pigments, wavelengths. It contained flakes of lapis lazuli, swatches of dyed silk, spectral charts. Living beings were not its concern, only their *qualitative attributes*. Lin opened it to the section for **Albino/Leukos Range**. *Whiteness – Category A3 (Pure Spectral Reflectance). Source: Present at border intake (Equine form). Cross-reference: Form Registry – Equine.*

  The horse stood patiently in the holding pen, a single, breathing entity. Lin had created two entries in two separate, incommensurable realities. The FRE knew a horse, devoid of colour. The SRC knew an instance of whiteness, detached from form. The cross-references were frail paper threads stretched across an ontological chasm.

  Where was *the white horse*? Not fully in FRE, which ignored its defining pallor. Not fully in SRC, which catalogued only the colour, not the beast that bore it. The living animal seemed to occupy a gap between the ledgers, a null point defined by the system’s refusal to acknowledge compound realities.

  Nights blurred into days filled with the rustle of paper and the horse’s soft snorts. Lin became obsessed with the phantom entry. She tried creating a third ledger scrap, labeled "Border Manifest – Composite Entities (BMCE)", but the Station Master rejected it. "The system suffices," he droned. "Form and Substance are pure. Mixtures are administrative noise."

  Frustration drove Lin deeper into the archive’s forgotten annexes. Among mildewed manuals on tariff codes for mythical beasts, she found it: **"Protocols for Ambiguous Referents: Mohist Precedents."** Her pulse quickened. Inside, under a section titled *"The Equine Chromatic Conundrum,"* was a corrupted paraphrase:

  > *"A white horse is not a horse. For 'horse' denotes form; 'white' denotes colour. That which denotes colour is not that which denotes form. Therefore, a white horse is not a horse." (Attributed: Mozi, Rectifying Names)*

  *Mozi?* The attribution was jarringly wrong. Lin knew the brittle, sharp logic belonged to the School of Names, to Gongsun Long himself, not the utilitarian Mohists. The manual’s ink was faded, the binding crumbling. Even the knowledge *about* the paradox was decaying, misclassified within the very bureaucracy it sought to illuminate. The system consumed and corrupted the understanding meant to describe its own limitations.

  Back at the holding pen, the trader grew impatient. The white horse stamped a hoof, a unified gesture of impatience. Lin returned to the ledgers. The FRE entry felt heavy, weighted with flesh and bone. The SRC entry felt cold, abstract, a ghost of luminance. Following a desperate impulse, she tried linking the SRC "Whiteness" entry *directly* to the FRE "Horse" entry, bypassing the cross-reference slips. The ink smeared, the entries seemed to repel each other on the page, the parchment wrinkling as if rejecting the forced union. Adding the colour *to* the form entry felt like trying to graft moonlight onto stone.

  The Station Master appeared, ledger in hand. "Process complete? The trader demands passage."

  "Yes," Lin said, her voice flat. "The... components... are registered. Horse in FRE. Whiteness in SRC. Cross-referenced."

  He scanned the entries, nodded. "Efficient. Release the subject." He meant the horse.

  Lin watched the trader lead the white horse through the massive gate. A single, luminous creature moved into the twilight. Behind her, in the cavernous archive, two perfect entries existed in perfect isolation. The FRE knew a colourless horse had come and gone. The SRC knew a pure whiteness had briefly manifested near the equine pens. The cross-reference slips lay in their tray, brittle and inert, connecting nothing to nothing. The beast had been parsed, dissected by the immutable categories. It had passed through Gantry Station not as an animal, but as an administrative ghost, a fleeting contradiction the system registered only by splitting it into irreconcilable halves.

  Lin touched the cold page of the FRE where "Horse" was stamped. She touched the SRC entry for "Whiteness (A3)". A vast, silent emptiness echoed between them, shaped precisely like a white horse. The system hadn't failed. It had functioned exactly as designed, revealing not a trick of logic, but a fundamental crack in the way reality could be captured. The white horse *wasn't* a horse, according to the ledgers. And according to the living world vanishing into the dusk, it wasn't *not* one either. It was the gap itself, trotting away.
