  ### Judgement Calls Session: "The Prediction Trap"  
  **Objective:** Explore why we project specific rules from past data, and why "fitting the evidence" isn't enough to guarantee accurate predictions.  

  ---

  ### **Rules & Materials**  
  **Participants:** 16 people (backend/data engineers, PMs).  
  **Duration:** 90 minutes.  
  **Materials:**  
  - **Projector** displaying log data.  
  - **Laptops** for participants to write rules.  
  - **Shared document** (e.g., Google Sheet) for submitting rules/predictions.  
  - **Tokens** (e.g., stickers) for scoring.  

  **Log Data Structure (Service "X"):**  
  - **Inputs:** `{ color: "blue" or "green", shape: "circle" or "square", day: [integer] }`  
  - **Output:** `"accept"` or `"reject"`.  
  - **Training Data (Days 1–100):**  
    - Only two input types appear:  
      - `{ color: "blue", shape: "circle" }` → `"accept"`  
      - `{ color: "green", shape: "square" }` → `"reject"`  
  - **Test Data (Days 101–107):**  
    - All four input combinations appear (e.g., blue circle, blue square, green circle, green square).  

  **Ground Truth Rule:**  
  ```python
  if day < 101:  
    return "accept" if color == "blue" else "reject"  
  else:  
    return "accept" if color == "green" else "reject"  
  ```  

  **Pseudo-Code Vocabulary:**  
  - Variables: `input.color`, `input.shape`, `day`  
  - Constants: `"blue"`, `"green"`, `"circle"`, `"square"`, `[integers]`  
  - Operators: `==`, `!=`, `>`, `<`, `>=`, `<=`, `and`, `or`, `not`  
  - Conditional: `if [condition] then [result] else [result]`  

  **Scoring:**  
  - **Warm-up:** 1 token per correct prediction (5 predictions × 2 groups).  
  - **Main Round:** 1 token per correct prediction (7 days).  
  - **Rule Change Penalty:** -3 tokens (optional).  
  - **Leaderboard:** Tokens = points. Prize: Bragging rights + trivial reward (e.g., novelty trophy).  

  ---

  ### **Timeline (90 Minutes)**  

  #### **1. Setup (5 min)**  
  - Explain the session: "We’re simulating a scenario where you must reverse-engineer a black-box service’s rules from logs. Goal: Predict future behavior accurately."  
  - Split into **Group A** and **Group B** (8 each). *Do not reveal group differences yet.*  

  #### **2. Warm-Up (15 min)**  
  - **Group A (Time-Free):**  
    - Vocabulary: **No `day` variable** (only `color`, `shape`).  
    - Data: Simple logs from a *different* service (e.g., `color=="red"` → `accept`; `color=="yellow"` → `reject`).  
    - Task: Write a rule → predict 5 responses → score.  
  - **Group B (Time-Dependent):**  
    - Vocabulary: **Includes `day`**.  
    - Data: Logs from a service with **time-based rules** (e.g., `accept` on weekdays, `reject` weekends).  
    - Task: Same as Group A.  
  - **Prevent Note-Comparison:**  
    - Use breakout rooms for groups.  
    - Label tasks as "Service Y (Group A)" / "Service Z (Group B)" to imply different systems.  

  #### **3. Main Round (30 min)**  
  - **Introduce Service X** (5 min):  
    - Show training data (Days 1–100).  
    - Vocabulary: **Full** (all variables).  
    - Task:  
      1. Write a rule fitting all 100 logs.  
      2. Commit it to the shared doc.  
  - **Rule Change Opportunity** (5 min):  
    - Announce: "You may rewrite your rule for a 3-token penalty. New rule must fit all past data."  
    - *Log participation: Who changes?*  
  - **Prediction** (10 min):  
    - Reveal inputs for Days 101–107 (no outputs).  
    - Participants predict responses using their committed rules.  

  #### **4. Scoring & Reveal (15 min)**  
  - Reveal actual responses (Days 101–107) and ground truth rule.  
  - Calculate scores:  
    - Tokens for correct predictions.  
    - Penalties applied.  
  - Update leaderboard.  

  #### **5. Debrief (25 min)**  
  **Key Points to Unpack:**  
  1. **The Trap:**  
     - Most rules fit Days 1–100 perfectly but fail on 101–107.  
     - Example participant rules:  
       - `if color == "blue" then accept else reject` → Fails after day 100.  
       - `if shape == "circle" then accept else reject` → Fails after day 100.  
     - Ground truth used `day`, which no one likely included.  

  2. **Underdetermination:**  
     - Infinite rules fit the past data (e.g., flip rules on day 101/200/300, or use arbitrary combinations like `color=="blue" or day > 50`).  
     - **Finite Data Limitation:** Acknowledge logs are finite—this *exaggerates* the problem but mirrors real-world bounded data.  

  3. **Entrenchment (Warm-Up Design):**  
     - Group A (time-free warm-up) likely wrote time-free rules; Group B (time-dependent) likely used `day`.  
     - "Why did you trust your rule? Was it simplicity, or because warm-ups rewarded that *style* of thinking?"  
     - **Takeaway:** Confidence often reflects past reinforcement, not just data.  

  4. **Rule-Change Refusal:**  
     - Most won’t pay the penalty to change. Probe:  
       - *Dogmatism?* ("I was sure I was right").  
       - *Simplicity prior?* ("Time-based rules felt overcomplicated").  
       - *Circularity?* ("Why switch if my rule already fit?").  
     - **Philosophical Insight:** The puzzle isn’t about whether to project rules—it’s about *which* to project. Refusal reveals our bias toward "entrenched" predicates (e.g., `color` over `day-of-flip`).  

  5. **Objection Handling:**  
     - **"Real engineering has source code/deployment logs!"**:  
       - Agree! But note:  
         - Legacy systems, third-party APIs, or machine learning models *are* black boxes.  
         - Causality isn’t always visible (e.g., intermittent bugs).  
       - **Flip the objection:** "What if the time-dependency *was* in deployment logs? Would you have looked? Why/why not?" → Use this to discuss cognitive blind spots.  
     - **"This is a word game!"**:  
       - Counter: "If I’d told you upfront, ‘The rule uses a date,’ you’d have included it. Why didn’t you consider it *without* prompting? That’s the point."  
     - **"The log is finite"**:  
       - "Yes! But we *always* work with finite data. How do we justify projecting one rule over another?"  

  **Limitations & Closing Notes:**  
  - **What the exercise can’t do:**  
    - **Trickster Dependency:** Yes, I rigged the rule. But in reality, underdetermination exists *without* malice (e.g., market crashes, edge-case failures). Emphasize: "The puzzle is that past data *always* underdetermines future behavior—rigging just makes it visceral."  
    - **Endless Rules:** We only see 10–15 rules today. To illustrate infinity: "Imagine a rule that flips on day 101, 102, 103... or uses prime numbers, etc."  
  - **Final Message:**  
    > "We *must* project rules to function. But this session exposes why we privilege certain rules (simplicity, entrenchment). In engineering, that’s often right… until it isn’t. The antidote isn’t paralysis—it’s **humility**. Ask: ‘What equally fitting rule am I *not* considering? What hidden variable could break me?’"  

  ---

  ### **Predictable Issues & Mitigation**  
  - **"Why bother if logs are finite?"**: Preempt in debrief: Finite data *is* the real-world challenge.  
  - **Group A/B resentment**: Frame warm-ups neutrally: "We exposed you to different service behaviors."  
  - **Overfocus on "winning"**: Stress: "This is about insights, not tokens. The ‘winner’ may still have fallen into the trap."  
  - **Time crunch**: Cut warm-up predictions to 3 per group if behind.  

  ### **Why This Works**  
  - Participants **self-trap** by writing time-free rules (natural for engineers).  
  - Warm-up creates tangible "entrenchment" bias.  
  - Penalty phase highlights inertia, priming debrief about circularity.  
  - Ground truth uses a mundane engineering trope (feature flags), making the philosophy concrete.  

  **Output:** Engineers leave unsettled about their own confidence—and equipped to ask, "What’s the grue in this system?" without ever hearing the word.
