            Rule: if day < 200 then (if color=='blue' then accept else reject) else ... 

          This fits the training data (days 1-100) because 100<200, so it uses the old rule. Then for days 101-107, it continues to use the old rule? So it would fail exactly like the time-independent rule.

          So unless they guess the flip day exactly (101) and the new rule (green), they will fail.

          But note: the new rule (green) is arbitrary. They might write:

            if day < 101 then (if color=='blue' then accept else reject) else (if shape=='square' then accept else reject)

          This fits the training data and then in the future, it would fail on blue circle and green square? as we saw.

          So the only rule that gets the future 100% correct is the ground truth rule (which flips to green). And they are unlikely to guess that.

      - Therefore, we expect almost everyone to get some predictions wrong.

   10. **Final note on limitations**:

       - The exercise uses a trickster (the designer) to set the flip. But the philosophical point is that even without a trickster, the past does not determine the future. We can say: "In reality, we don't know if there's a trickster, but we still face the problem of underdetermination: the past data is consistent with many future possibilities."

       - We only see a few rules in the room, but the point is that there are infinitely many. We can illustrate this in the debrief by showing how to construct alternative rules (e.g., flip at different days, or use arbitrary predicates).

       - We must emphasize that in real engineering, we use additional information (like deployment logs, source code, causal models) to reduce the uncertainty. But even then, we are making an inductive leap.

