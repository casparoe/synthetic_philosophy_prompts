prompt: |-
  hey, i'm writing a paper for my practical ethics seminar and we got sidetracked into moral uncertian — like, what do you do when you're genuinely unsure whether you're a consequentialist or a deontologist and both seem plausible. I don't want a bibliography, just the spec. what does a decent decision procedure for moral uncertainty actually have to get right?

  i was thinking specifically about the hard cases: if one theory assigns infinite or lexicographic value to avoiding rights violations, and another treats them as one cost among many, how should the procedure weigh them without just collapsing into the theory with the biggest numbers? There's also that weird reverse problem — if you become more uncertain, does the recommendation get more extreme in both directions? — and whether the theory needs to stay silent when the theories don't share a metric at all. i also want to know if there's any requirement that comes from population ethics sneaking in here, like being unsure between total and average views, and whether that should be treated as the same kind of uncertian or something totally different.

  can you lay out the full desiderata? like, the cases it has to handle, the distinctions it can't collapse (e.g., being uncertain about a fact vs being uncertain about what matters), which parts are non-negotiable and which are just preferences of the effective altruism crowd, and flag any pair that probably can't both be satisfied. don't worry about scoring every existing view — i mostly want the list so i can see where the arguments actually live. also please don't cite specific papers, i just want the conceptual map.
reasoning: |-
  Okay, the user is writing a paper on practical ethics, specifically moral uncertainty. They're dealing with a scenario where someone isn't sure if they're a consequentialist or deontologist. They need help figuring out what a decision procedure for moral uncertainty should get right, especially in hard cases.

  First, I need to unpack their main concerns. They mentioned cases with infinite values, like deontological rights violations versus consequentialist trade-offs. The challenge is weighing these without one theory dominating just because of larger numbers. Then there's the reverse problem: does increased uncertainty lead to more extreme decisions? Also, how to handle theories that don't share a common metric, and if population ethics issues like total vs. average utility should be treated differently.

  The user wants desiderata—key requirements for such a decision procedure. They want to know essential features, what distinctions must be preserved (like factual vs. moral uncertainty), non-negotiable elements versus EA preferences, and any conflicting desiderata.

  I should start by outlining core desiderata. Independence of scale is crucial to prevent theories with larger numbers from dominating. Avoiding extremist conclusions when theories have lexical values is another. The procedure must handle incommensurability without forcing a common metric. They also need to address how uncertainty affects extremity and whether population ethics introduces unique challenges.

  Next, maintaining distinctions: factual uncertainty (probabilities about states of the world) vs. moral uncertainty (which principles are correct). The procedure shouldn't conflate them. Also, distinguishing between uncertainty about fundamental values versus empirical facts.

  Non-negotiables might include consistency and avoiding dominance by any single theory. EA preferences could involve maximizing expected choice-worthiness, but that's not without issues. Potential conflicts: satisfying scale independence while handling lexical values might be impossible. Also, balancing sensitivity to uncertainty without causing instability in decisions.

  I should also consider population ethics. The user asked if uncertainty between total and average utility should be treated similarly. Here, the metric might differ, so the procedure needs a way to compare them without arbitrary conversions. This ties into the incommensurability problem.

  I need to ensure the response is conceptual, not citing papers. Focus on the map of arguments. Highlight where trade-offs exist, like between satisfying multiple desiderata and having a workable procedure. Also, note that some problems lack solutions, which is a point the user can explore in their paper.
answer: |-
  Here's a conceptual map of the key desiderata for a decision procedure under moral uncertainty, focusing on the hard cases and distinctions you raised:

  **Core Desiderata (What it *Must* Get Right):**

  1.  **Non-Domination by Scale:** The procedure **must not** simply default to the theory assigning the largest absolute numbers (e.g., consequentialism with huge welfare numbers vs. deontology with moderate rights "costs"). It needs a way to weigh theories meaningfully *despite* arbitrary scaling differences in how they quantify value or disvalue. (Directly addresses your "biggest numbers" collapse problem).
  2.  **Handling Lexical/Infinite Values:** Crucially, it **must** provide non-arbitrary guidance when one theory assigns *infinite* (or lexically prior) disvalue to an action (e.g., "Never violate right X, no matter the consequences") while another sees it as a finite cost (e.g., "Violate right X only to prevent a catastrophe"). The procedure cannot simply ignore the lexical theory nor must it always defer to it. (Your core "hard case").
  3.  **Respecting Incommensurability (at least partially):** It **must** acknowledge when theories genuinely operate on different, non-intertranslatable metrics (e.g., "promoting aggregate welfare" vs. "respecting individual dignity as an end"). The procedure shouldn't *force* a fake common currency (like "utils") if one doesn't exist meaningfully. It might need to sometimes declare options incomparable or use dominance reasoning *across* theories.
  4.  **Sensitivity to Degree of Uncertainty:** The recommended action should *depend* on *how* uncertain you are. Being 50/50 between two theories should generally lead to different choices than being 99% confident in one. (Addresses your "reverse problem" framing).
  5.  **Avoiding "Uncertainty-Induced Extremism":** Increased moral uncertainty should **not** systematically push recommendations towards *more extreme* actions (either extremely risky or extremely conservative) compared to being certain under either theory alone. This is the core of your "reverse problem". A good procedure avoids this instability.
  6.  **Consistency & Rationality:** The procedure must yield consistent recommendations under consistent inputs (probabilities, theory specifications). It shouldn't recommend blatantly irrational choices (e.g., cycles, strict dominance violations *across* the theories under consideration).

  **Key Distinctions it Must Preserve:**

  7.  **Factual vs. Moral Uncertainty:** The procedure **must** clearly separate:
      *   Uncertainty about *empirical states of the world* (e.g., *Will this policy cause 100 or 1000 deaths?*). Handled by standard probability/expected value *within* a theory.
      *   Uncertainty about *which moral theory is correct* (e.g., *Is violating this right absolutely forbidden or a cost?*). Handled by the meta-procedure.
      *   Conflation leads to fundamental errors. Moral uncertainty operates at a higher level.
  8.  **Uncertainty About What *Matters* vs. Uncertainty About *How Much*:** Distinguish:
      *   Uncertainty about *fundamental values* (e.g., *Is suffering the only disvalue?* vs. *Are rights fundamental?*).
      *   Uncertainty about the *weight* or *exchange rate* between values *within* a theory you accept (e.g., *How much welfare loss justifies a rights violation?*).
      *   The first requires weighing fundamentally different structures (desideratum #3), the second might be handled by sensitivity analysis within a single theoretical framework.

  **Population Ethics Specificity (Your Query):**

  9.  **Population Ethics as a Prime Case of Incommensurability:** Uncertainty between Total Utilitarianism (TU) and Average Utilitarianism (AU) is a paradigm case for desiderata #3 and #6:
      *   **Metrics:** TU cares about *sum*, AU cares about *average*. These metrics are fundamentally different and often conflict (e.g., adding lives with barely positive welfare vs. increasing average welfare of existing lives).
      *   **Scale:** Their "value units" aren't readily intertranslatable. How many "average utils" equal one "total util"?
      *   **Lexical-ish Behavior:** AU can effectively assign infinite negative weight to adding lives below the current average, while TU doesn't. Conversely, TU can prioritize vast numbers of slightly happy lives over a smaller happier group in ways AU rejects.
      *   **Conclusion:** Uncertainty between TU and AU *should* be treated as a core case of fundamental incommensurability (#3), demanding the same careful handling as consequentialism vs. deontology. It's *not* inherently different in kind, just a stark example.

  **Non-Negotiables vs. EA Preferences:**

  *   **Non-Negotiables:** Desiderata 1-6 and distinction 7 are fundamental conceptual requirements for *any* coherent procedure tackling the core problem. Ignoring them renders the procedure inadequate or irrational. Distinction 8 is crucial for correctly applying the procedure.
  *   **EA-Influenced Preferences (Often Debated):**
      *   **Maximizing Expected "Choice-Worthiness":** The dominant EA approach treats theories as providing "choice-worthiness" functions and maximizes the *expected* choice-worthiness across theories. This is a *specific proposal*, not a non-negotiable. It struggles badly with #2, #3, and #9.
      *   **Strong Comparability Assumption:** EA approaches often *assume* choice-worthiness functions can be normalized/compared, downplaying #3 and #9. This is a preference/assumption, not a requirement.
      *   **Focus on Maximization:** EA leans heavily towards procedures yielding a single "best" action, potentially undervaluing procedures that sometimes yield sets of permissible options or incomparability (#3).

  **Impossible Pairs? Key Tensions:**

  *   **Satisfying #2 (Lexical Values) AND #3 (Incommensurability) with #1 (Non-Domination) AND a Single Recommendation:** This is the hardest nut. Fully respecting a lexical veto (#2) can clash with wanting quantitative weighting (#1) and avoiding fake metrics (#3). Some procedures might need to accept incomparability or context-specific rules here. *Maximizing expected choice-worthiness often fails this badly.*
  *   **Perfect #3 (Full Incommensurability Respect) AND Action Guidance:** If theories are truly incommensurable, a procedure might often conclude that multiple options are permissible or that no action is strictly better than another *given the uncertainty*. This can feel unsatisfying ("stay silent" as you put it), but might be the honest answer. Forcing a single recommendation *requires* some bridging assumption violating pure #3.
  *   **Avoiding #5 (Uncertainty-Induced Extremism) AND Being Sufficiently Sensitive (#4):** Ensuring uncertainty doesn't push towards extremes (#5) might require damping the effect of uncertainty, potentially making the procedure less sensitive to *degree* of uncertainty (#4) in some ranges. Finding the right balance is tricky.
  *   **Handling #9 (Population Ethics) AND Simplicity:** Population cases exacerbate the fundamental tensions (#2, #3, #5). Any procedure handling general moral uncertainty well *should* handle population ethics uncertainty, but the solutions won't be simple add-ons; they'll reflect the core approach to incommensurability and lexicality.

  **Where the Arguments Live:**

  *   **The Core Battlefield:** How to weigh theories with different structures (esp. lexical/infinite values vs. finite trade-offs) without collapsing or ignoring (#1, #2, #3). This is where proposals diverge most radically (e.g., normalization tricks, variance voting, contractualist approaches under uncertainty, multi-dimensional frameworks, accepting incomparability).
  *   **The Reverse Problem (#5):** Does a specific procedure avoid or cause uncertainty-induced extremism? This is a critical test for any proposal.
  *   **The Incommensurability Abyss (#3, #9):** How much comparability *must* we assume to get any action guidance? Can we develop meaningful "meta-metrics" or rules for partial comparability?
  *   **The Fact/Moral Divide (#7):** Are there hidden ways theories get conflated in proposed procedures? Does the procedure correctly "nest" empirical uncertainty within moral uncertainty?

  This map gives you the conceptual terrain: the unavoidable challenges, the crucial distinctions, the points of contention, and the inherent tensions. Your arguments will need to navigate precisely these desiderata and their difficult interactions. Good luck with the paper!
