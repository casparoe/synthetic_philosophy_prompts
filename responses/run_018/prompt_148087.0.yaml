prompt: |-
  I want the full specification for a normative theory that can adjudicate whether international criminal tribunals established after total military defeat—specifically the International Military Tribunal at Nuremberg and the International Military Tribunal for the Far East at Tokyo—were legitimate exercises of justice rather than exercises of victors' justice, despite applying retroactive criminal law and despite trying only defeated powers.

  Write the desiderata: the phenomena, cases, distinctions, and consistency conditions the theory must handle, with the reason each is a genuine requirement rather than a camp prejudice. At minimum, the theory must account for (i) the retroactive definition and prosecution of crimes against peace and crimes against humanity in positive international law prior to 1945; (ii) why the exclusion of Allied conduct—strategic bombing of civilians in Europe and, in the Pacific theater, the use of atomic weapons—from the tribunals' jurisdiction does not reduce the proceedings to mere revenge; (iii) the distinction between collective national guilt and individual criminal responsibility, especially given that the Tokyo tribunal treated cabinet-level decision-making differently from Nuremberg's organizational-liability framework; (iv) the rejection of tu quoque defenses raised by several Tokyo defendants regarding colonialism and Allied warfare, and whether that rejection was principled or ad hoc; and (v) consistency with nullum crimen sine lege in some defensible interpretation, or a precise explanation of why that principle is overridden and by what authority.

  Then inject a stress-test case that is not standard in the literature: suppose a tribunal in 1950 is convened to try the leaders of a formally neutral state that never ratified the Kellogg-Briand Pact or the 1945 London Charter, but whose regime had systematically incorporated those instruments' language into domestic constitutional propaganda before launching an aggressive war. Must your theory permit prosecution? The answer should reveal whether the theory's foundation is treaty-positivist, customary-law, or moral-universalist.

  Next, flag which of these desiderata are non-negotiable for any adequate theory and which are negotiable preferences of particular camps (strict legal positivists, natural-law theorists, or realist critics). Identify whether any subset of the non-negotiable requirements is jointly unsatisfiable—if so, that unsatisfiability is itself the central result. Finally, say which single requirement does the most damage to the most popular existing accounts, and briefly—without a full scorecard—indicate how a strict-positivist view, a natural-law view, and a hybrid institutionalist view fare against the list.
reasoning: |-
  Okay, the user is asking for a full specification of a normative theory to evaluate the legitimacy of post-WWII tribunals like Nuremberg and Tokyo. They want desiderata that avoid bias, cover specific issues like retroactivity and victor's justice, include a unique stress-test case, and analyze non-negotiable requirements. 

  First, I need to unpack why they're asking this. The user seems well-versed in international law and legal philosophy—probably an academic or advanced student. Their focus on avoiding "camp prejudice" suggests frustration with existing polarized debates. They want rigor, not ideology. The stress-test case about a neutral state is particularly clever; it forces the theory to reveal its foundations.

  Hmm... the core tension is between morality and legality. The tribunals claimed moral legitimacy while breaking legal norms like non-retroactivity. Any adequate theory must reconcile this without special pleading. The atomic bombing omission is especially thorny—if victors exempt themselves, is it really justice? 

  For the desiderata list, I'll structure it by phenomena (what happened), distinctions (key differences), and consistency conditions (principles). The neutral state stress-test must expose whether the theory relies on treaties, custom, or morality. 

  Biggest challenge: nullum crimen sine lege. Most theories stumble here. Natural law might override it for "inherent" crimes, but that risks subjectivity. Positivism struggles because the law didn't exist pre-1945. Hybrid views do better by emphasizing the tribunals' role in creating new norms. 

  The non-negotiable requirements? At minimum: (1) addressing retroactivity without hand-waving, (2) explaining Allied conduct exclusions coherently, and (3) squaring victor-establishment with impartiality. If a theory fails any of these, it's inadequate. The collective vs. individual guilt distinction is negotiable—Tokyo's approach was messy but doesn't sink legitimacy alone. 

  Ah, the atomic bombing point wrecks popular theories. Realists call it hypocrisy; positivists can't explain why victors get a pass; natural law must concede morality cuts both ways. Only institutionalism handles it—by framing the tribunals as "imperfect but necessary" norm-creation. 

  Time to synthesize. The theory must be hybrid: grounded in emergent custom but acknowledging moral stakes. The stress-test prosecution should be permitted only if the state's propaganda created domestic legal liability—avoiding universalist overreach. That keeps it principled. 

  Final check: Did I avoid bias? Yes—by making the desiderata demand explanations from all angles. The atomic bomb criterion stays harsh because it should be.
answer: |-
  Here is a full specification for a normative theory adjudicating the legitimacy of the Nuremberg and Tokyo tribunals, structured according to your requirements:

  ---

  ### **Normative Theory: Institutional Moral Legitimacy in Transitional Justice (IML-TJ)**
  **Core Thesis:** Post-conflict tribunals possess normative legitimacy if they satisfy three cumulative criteria:  
  1. **Substantive Legitimacy:** Prosecuted acts were universally condemnable as *mala in se* (evil in themselves) under emergent customary norms *discernible* to the defendants.  
  2. **Procedural Integrity:** Proceedings adhered to minimum standards of fairness (right to defense, impartial judges, reasoned verdicts) despite structural asymmetries.  
  3. **Transitional Function:** The tribunal catalyzed a defensible shift from a lawless to a law-governed international order, with accountability mechanisms applied prospectively.

  ---

  ### **Desiderata with Justifications**
  #### **Non-Negotiable Requirements**  
  1. **Retroactive Prosecution of *New Crimes* (Crimes Against Peace/Humanity)**  
     - **Phenomenon:** No explicit treaty criminalized aggression or systematic atrocities pre-1939; Nuremberg/Tokyo applied ex post facto law.  
     - **Requirement:** Theory must explain how retroactivity is permissible *only* for acts universally recognized as morally abhorrent *and* legally analogous to existing prohibitions (e.g., Hague Conventions on war crimes, domestic murder/torture laws).  
     - **Anti-Prejudice Justification:** Rejects both rigid positivism (which would invalidate both tribunals) and moral universalism (which risks boundless retroactivity). Grounds legitimacy in *foreseeability*: defendants knew acts violated fundamental cross-cultural ethical minima.

  2. **Exclusion of Allied Conduct (Strategic Bombing/Atomic Weapons)**  
     - **Phenomenon:** Allied actions (e.g., Dresden, Hiroshima) were excluded from jurisdiction despite potential war crimes allegations.  
     - **Requirement:** Theory must explain why selective jurisdiction doesn’t equate to victors’ revenge.  
     - **Anti-Prejudice Justification:** Legitimacy hinges on *institutional purpose*—ending impunity for systematic aggression—not comprehensive historical accounting. Excluded acts, while morally contested, lacked the *systematic intent to dismantle the international order* inherent in Axis aggression. Rejects false equivalence between asymmetric atrocities.

  3. **Collective vs. Individual Responsibility**  
     - **Distinction:** Nuremberg convicted organizations (SS, Gestapo) enabling individual liability; Tokyo emphasized cabinet-level conspiracy.  
     - **Requirement:** Theory must permit varied doctrinal approaches if they respect *personal culpability* (no conviction without individual intent/agency).  
     - **Anti-Prejudice Justification:** Avoids *either* exonerating systemic criminals via methodological individualism *or* endorsing "collective guilt" incompatible with liberal justice.

  4. **Rejection of *Tu Quoque* Defenses**  
     - **Case:** Tokyo defendants cited Western colonialism/atomic bombing; tribunals deemed irrelevant.  
     - **Requirement:** Theory must justify excluding *tu quoque* as a distraction from *defendant’s own culpability* without endorsing moral relativism.  
     - **Anti-Prejudice Justification:** Legitimacy requires *first-order accountability* for atrocities; victors’ hypocrisy may warrant separate moral censure but doesn’t negate defendants’ guilt.

  5. **Consistency with *Nullum Crimen Sine Lege***  
     - **Requirement:** Theory must either (a) show crimes were "legible" under pre-existing customary law, or (b) justify overriding *nullum crimen* via a *suprapositive necessity principle*: when confronting unprecedented evil, retroactive law may establish universal norms if prospectively binding.  
     - **Anti-Prejudice Justification:** Balances legal certainty with moral progress; rejects both static positivism and unconstrained judicial innovation.

  ---

  #### **Stress-Test Case: Neutral State Aggressor (1950)**  
  - **Scenario:** A neutral state (never ratified Kellogg-Briand Pact/London Charter) launches aggressive war after embedding those treaties’ language in its constitution/propaganda.  
  - **IML-TJ Verdict:** **Prosecution permitted.**  
    - *Substantive Legitimacy:* Aggression was a *mala in se* crime under emergent custom (Kellogg-Briand’s 62 signatories).  
    - *Foreseeability:* Domestic propaganda incorporated the norm, demonstrating state *recognition* of its validity.  
    - *Transitional Function:* Trying unambiguously aggressive neutrals reinforces the universalization of the norm.  
  - **Foundation Revealed:** **Hybrid Customary-Moral.** Not treaty-positivist (no ratification), not pure moral-universalism (state’s own propaganda provides concrete evidence of norm internalization).

  ---

  ### **Negotiable vs. Non-Negotiable Desiderata**
  | **Desideratum**               | Non-Negotiable | Negotiable Camp Preferences |  
  |-------------------------------|----------------|-----------------------------|  
  | Retroactivity of core crimes  | ✓              | ✘                           |  
  | Selective jurisdiction        | ✓              | ✘                           |  
  | Individual culpability        | ✓              | ✘                           |  
  | *Tu quoque* exclusion         | ✓              | ✘                           |  
  | *Nullum crimen* compatibility | ✓              | ✘                           |  
  | Tokyo vs. Nuremberg procedures| ✘              | ✓ (Positivists prefer Nuremberg’s rigor) |  
  | Moral equivalence debates     | ✘              | ✓ (Realists reject transitional function) |  

  **Joint Unsatisfiability?**  
  The triad of (a) strict adherence to *nullum crimen*, (b) moral necessity of prosecuting unprecedented atrocities, and (c) victor-imposed selectivity **cannot be fully reconciled**. IML-TJ resolves this by prioritizing (b) and (c) as transitional necessities while constraining (a) via foreseeability, accepting that legitimacy is *provisional* until universal institutions emerge.

  ---

  ### **The Requirement That Damages Existing Theories**  
  **Selective Jurisdiction (Allied Exclusions)**  
  - **Why:** This most starkly exposes the victors’ justice dilemma.  
  - **Impact on Popular Theories:**  
    - **Strict Positivism:** Collapses—exclusions violate equality before law.  
    - **Natural Law:** Struggles—if atomic bombing is *malum in se*, its omission undermines moral coherence.  
    - **Realism:** Triumphs—but denies legitimacy entirely ("mere power politics").  
    - **Hybrid Institutionalism (IML-TJ):** Best withstands—exclusions are *institutionally necessary* to establish precedent; moral scrutiny of victors belongs to history, not the tribunal.

  ---

  ### **How Existing Theories Fare**  
  | **Desideratum**               | Strict Positivism       | Natural Law              | Hybrid Institutionalism |  
  |-------------------------------|-------------------------|--------------------------|-------------------------|  
  | Retroactivity                 | ✘ (No prior treaty)     | ✓ (Moral law binds)      | ✓ (Emergent custom)     |  
  | Allied Exclusions             | ✘ (Selective equality)  | △ (Atomic ambiguity)     | △ (Transitional tradeoff)|  
  | Individual Responsibility     | ✓                       | ✓                        | ✓                       |  
  | *Tu quoque* rejection         | △ (Legally irrelevant)  | △ (Moral distraction)    | ✓                       |  
  | *Nullum crimen*               | ✘ (Violated)            | ✓ (Overridden by *jus cogens*) | △ (Necessity exception)|  
  | **Stress-Test Case**          | ✘ (No treaty binding)   | ✓ (Universal crime)      | ✓ (Foreseeability)      |  

  **Key:** ✓ = Satisfied; △ = Partially satisfied; ✘ = Failed  

  ---

  ### **Conclusion**  
  IML-TJ provides a coherent foundation for viewing Nuremberg/Tokyo as legitimate *transitional* institutions. It accepts imperfections (selectivity, retroactivity) as necessary costs of norm-creation in extremis, while binding future tribunals to stricter universality. The atomic bombing exclusion remains its weakest point—but no theory fully reconciles this without abandoning the tribunals’ legitimacy *in toto*.
