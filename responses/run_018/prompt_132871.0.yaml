answer: |-
  Here's a sestina that embodies the finitist perspective on Hilbert's Hotel, using the requested form and thematic disruption to mirror the mathematical objection:

  **The Finitist's Lament at Hilbert's Hotel**

  They boast the *room* is always free for one
  more weary, hypothetical *guest*.
  Assign a new, unbounded *number*,
  they say, and with a deftly drawn *map*
  you'll prove the *empty* space exists
  though all seemed infinitely *complete*.

  But logic feels this state can't be *complete*;
  there is no final, settled, stable *room*.
  The process leaves a ghostly *empty*,
  an ache no newly conjured *guest*
  can soothe. Each clever, shifting *map*
  denies the final, finite *number*.

  You claim to grasp the endless *number*,
  declare the shifting set *complete*,
  and wave your abstract, paper *map*.
  But when you clear that first bright *room*
  to welcome one more hopeful *guest*,
  you only mark a void as *empty*.

  Is moving on the same as *empty*?
  The *guest* from One moves to a *number*
  assigned by rule. But every *guest*
  you shuffle claims the state's not *complete*.
  They wait inside their borrowed *room*
  while you construct another *map*.

  You shift again, revise your *map*,
  insist the *empty* isn't *empty*,
  it's just a sign the system's *room*
  expands beyond all bounded *number*.
  But how can moving prove it *complete*?
  You haven't placed the final *guest*!

  You say, "Just add one final *guest*!"
  and draw a line upon your *map*.
  But logic whispers, "Not *complete*.
  That 'vacant' sign you call *empty*
  requires the next, uncounted *number*,
  beyond the last defined, fixed *room*."

  You claim an endless *room* exists, *complete*,
  yet shift each *guest*; your *map* implies *empty*
  potential, never filled. The final *number*?

  ### [Broken Envoi - Rejecting the Closure]
  The shifting *guest*, the endless *number*...
  The promised *empty*, never *room*...
  The flawed *map* cannot claim *complete*.

  ---

  ### How it works
  1.  **End-Word Rotation:** Follows the strict sestina pattern (1,2,3,4,5,6 → 6,1,5,2,4,3 → 3,6,4,1,2,5 → 5,3,2,6,1,4 → 4,5,1,3,6,2 → 2,4,6,5,3,1).
  2.  **Finitist Voice:** The poem consistently questions the hotel's claim of being "complete," focusing on the endlessness of the shifting process ("You haven't placed the final guest!", "The process leaves a ghostly empty", "But how can moving prove it complete?").
  3.  **Mathematical Analogy:**
      *   "Clever, shifting map" = the bijection (f(n)=n+1).
      *   "Clear that first bright room" / "ghostly empty" = vacating room 1.
      *   "Moving on" / "shuffle" = the shifting process itself.
      *   "Endless room" / "unbounded number" = countable infinity.
      *   "Final guest / number / room" = the missing limit ordinal / the finitist objection to a completed infinite set.
  4.  **Broken Envoi:** Instead of the traditional pairings (1-2, 3-4, 5-6), the envoi breaks the pattern:
      *   Line 1: **guest** (2), **number** (3) - Emphasizes the *process* of shifting guests through numbers.
      *   Line 2: **empty** (5), **room** (1) - Highlights the *promised vacancy* (empty) and its dependence on the *fundamental unit* (room) which is never finally settled.
      *   Line 3: **map** (4), **complete** (6) - Directly states the core finitist objection: The *mapping function* (map), no matter how clever, cannot achieve actual *completion* (complete). The crucial pairing that would tie the system together (map-complete) is fractured and denied.
  5.  **Accuracy:** Captures the core objection: the process (shifting) is endless, meaning the initial state ("all rooms full") is never demonstrably restored to a new "all rooms full including the new guest" state *as a completed whole*; there's always another shift required.

  I hope this unique piece resonates with your seminar and provides the perfect, thought-provoking close to your discussions on actual infinities!
