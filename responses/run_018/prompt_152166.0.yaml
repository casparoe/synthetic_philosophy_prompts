answer: |-
  ### - The implicit philosophy (around 150 words)
  This system implicitly adopts a **medicalized and bureaucratized view of moral desert and responsibility**. Vulnerability is treated not primarily as a circumstantial state (e.g., experiencing anxiety on a given day) but as an **administratively verified, inherent characteristic**. This presupposes that:
  1.  **Responsibility is binary:** Individuals are either "capable" (non-vulnerable) and thus fully accountable for all actions, or "incapable" (vulnerable) and thus inherently less responsible. The "why" of the missed appointment becomes irrelevant once the label is applied (or not).
  2.  **Desert hinges on state recognition:** Worthiness of compassion/leniency depends not on the actual reason or context of the failure, but on successfully proving one's incapacity *to the state in advance*. The "undeserving poor" here are those **unable to navigate the bureaucracy** to secure the protective label, regardless of their genuine circumstances. Moral desert is thus conflated with administrative compliance.

  ### - The tension (around 100 words)
  This practice creates a fundamental tension:
  *   **Internal Contradiction:** It undermines the stated rationale of conditionality – enforcing responsibility. If the *actual reason* for missing an appointment (e.g., debilitating anxiety) is identical for both labeled and unlabeled individuals, penalizing only the unlabeled person isn't enforcing *their* responsibility for *that act*; it's punishing their **lack of administrative foresight or skill**.
  *   **Conflict with Welfare Principles:** It clashes with norms of **procedural fairness** (outcomes determined by opaque bureaucratic hurdles rather than the merits of the case) and **universal dignity** (equal treatment based on need/situation). It effectively creates a two-tier system where protection depends on administrative acumen, not need or the principle of responsibility itself.

  ### - Bottom line (around 60 words)
  There is no coherent moral or philosophical view behind this practice. It is primarily **ad-hoc administration**. The system conflates **bureaucratic process with moral desert**, substituting practical compliance (getting the label) for a genuine assessment of responsibility or circumstance in the moment. The resulting sorting into "deserving" and "undeserving" is an artifact of administrative design, not a consistent application of the principle of conditionality.
