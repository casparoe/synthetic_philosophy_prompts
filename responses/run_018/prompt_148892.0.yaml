prompt: |-
  hey, I'm prepping material for a philosophy of memory seminar and I need a conceptual sorting tree — not a lit review, just a map of where people actually stand on whether societies have a duty to remember historical wrongs and when forgetting is defensible. I'm thinking of the tension between Margalit's thick ethics of memory and Rieff's argument for strategic collective forgetting, but I want the branches built from actual commitments, not just author labels.

  Build a taxonomy with 6-8 leaves. Root question: does collective remembrance of a past wrong serve a moral purpose that outlives the direct victims? First split: is the primary obligation owed to victims, to descendants of perpetrators, or to present bystanders? Next split: must remembrance take institutional form (monuments, school curicula, state apologies) or can private and familial transmission satisfy it? Then branch on active forgetting — not passive decay, but deliberate suppression: never permissible, permissible only after material reparations are complete, or permissible whenever remembrance is being used to fuel present conflict?

  Each leaf gets named if there's a real defender (Margalit-style thick remembrance, Rieff-style political forgetting, etc.) or marked 'unnamed' if the combo is unoccupied. Give each leaf one sentence on its most awkward practical commitment — like requiring children to study atrocities they didn't cause, or defending the removal of a memorial survivors still visit.

  Also flag any two leaves your tree can't cleanly seperate, and note any empty branch that looks incoherent rather than merely unexplored. No bibliography, no citation requests, and every node should be answerable without having read specific texts. Keep the framing concrete so it doesn't just ask "what do you think about memory?"
