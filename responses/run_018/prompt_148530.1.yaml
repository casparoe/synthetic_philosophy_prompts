answer: |-
  Here's a taxonomy built from first principles, structured as a decision tree for diagnosing positions on responsibility in cases of severely compromised agency (like psychotic breaks or dissociative episodes). Use it by asking these questions in sequence:

  ### Decision Tree: Moral Responsibility in Edge Cases of Agency Impairment

  1.  **Q1: Must reactive attitudes (like resentment) track *actual moral desert*?**
      *   **Yes** → Proceed to Q2.
      *   **No** → Skip to Q3. (Attitudes are justified by other factors, e.g., social function or relationship norms, regardless of ultimate desert).

  2.  **Q2: Does severe mental illness/dissociation *automatically* trigger the objective attitude?**
      *   **Yes** → **Position: Hard Determinist Suspension (or Strong Exemption View)**
          *   *Awkward commitment:* Must insist we feel *nothing* resembling blame (not even sorrowful anger) towards someone who, during a tumour-induced episode, causes foreseeable harm due to prior, blameworthy negligence (e.g., refusing known treatment).
      *   **No** → **Position: Unnamed ("Robust Actual Desert")**
          *   *Awkward commitment:* Must maintain that resentment *is* genuinely appropriate towards someone *during* a florid psychotic break where they sincerely believe harming you is saving the world, because they "truly deserve" it at that moment. (This combination seems largely **unexplored & unattractive**, as it denies the core intuition that such breaks exempt).

  3.  **Q3: Does severe mental illness/dissociation *automatically* trigger the objective attitude?**
      *   **Yes** → **Position: Strawson's Standard Participant Stance (Objective Switch)**
          *   *Awkward commitment:* Requires a complete, binary switch to detached concern/management (objective attitude) for the impaired person, even for *momentary* psychotic slips within an otherwise responsible life, potentially feeling jarring or denying nuanced responses like protective sorrow or grief-tinged anger.
      *   **No** → Proceed to Q4.

  4.  **Q4: Is *partial* or *calibrated resentment* conceptually coherent? (e.g., sorrowful-resentment, diminished blame, blame targeted only at preserved capacities)**
      *   **Yes** → **Position: Graded Reactive View (Unnamed, sometimes called "Hybrid" or "Partial Responsibility")**
          *   *Awkward commitment:* Must defend how we can rationally "grade" our emotional blame (e.g., 40% resentment?) based on fluctuating or partial impairment, and explain why this isn't just confused or unstable.
      *   **No** → Proceed to Q5.

  5.  **Q5: Can the *social function of blame* (e.g., norm enforcement, communication, protection) survive and be justified *without* the accompanying emotional core of resentment/indignation?**
      *   **Yes** → **Position: Revisionist Functionalism (e.g., some Scanlon-inspired views)**
          *   *Awkward commitment:* Must argue that practices looking and feeling like blame (e.g., condemnation, sanctions) are fundamentally *not* blame if stripped of reactive emotions, or that emotions are merely incidental noise to be minimised in favour of cool, functional "moral criticism".
      *   **No** → **Position: Strawson-Inspired Expressivism (or Unnamed "Emotional Core Essentialism")**
          *   *Awkward commitment:* If severe impairment removes the grounds for resentment but the functional aspects of blame are still deemed necessary (e.g., to protect others), must concede society might need to maintain "blame-like" practices that are fundamentally *unjustified* by the core reactive attitudes framework, creating a tension.

  ### Summary of Leaves & Awkward Commitments

  *   **Hard Determinist Suspension:** Must deny *any* negative reactive feeling towards harms caused by prior negligence if the *immediate* act was during impairment.
  *   **Robust Actual Desert (Unnamed):** Must insist resentment is deserved *during* a psychotic break harming others. *(Flagged: Likely Empty/Unattractive)*
  *   **Strawson's Standard Participant Stance:** Requires a complete emotional disengagement (objective attitude) for *any* qualifying impairment, however brief or partial-seeming.
  *   **Graded Reactive View (Unnamed):** Must provide a coherent account of "measuring" and sustaining blended or diminished reactive emotions.
  *   **Revisionist Functionalism:** Must downplay or eliminate the emotional experience of resentment as essential to blame's core meaning or justification.
  *   **Strawson-Inspired Expressivism:** Must accept that necessary protective/communicative practices post-impairment might lack proper justification within the reactive attitudes framework.

  ### How to Use This Diagnostic Tool
  1.  Present a clear case study (e.g., "Alex, with known but untreated schizophrenia, believes their neighbour is a demon during an acute break and causes serious harm").
  2.  Ask your friends the questions **in sequence (Q1 → Q2 or Q3 → Q4 → Q5)** based on their intuitions about the *appropriate emotional and behavioural responses* to Alex.
  3.  Follow their answers down the tree to the leaf position.
  4.  Discuss the "awkward commitment" associated with that leaf – does it resonate, or does its difficulty make them reconsider earlier answers?

  This focuses purely on the logical structure of responses to impaired agency, bypassing traditional -ism labels and allowing your group to map their intuitions onto the conceptual landscape. The awkward commitments highlight the theoretical price of each position.
