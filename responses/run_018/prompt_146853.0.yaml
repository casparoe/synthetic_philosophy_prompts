answer: |-
  Here’s a focused research proposal draft tailored to your specifications:

  ---

  **Research Proposal: Exemplar Portability in Plutarch’s Parallel Lives**  

  **Project Focus**:  
  This project challenges the prevailing debate on whether biographical narratives cultivate virtue, arguing instead that they may train a distinct cognitive habit: **exemplar portability**—the practice of extracting moral agents as transferable patterns from their institutional contexts. It asks: *Does Plutarch’s structural juxtaposition of Greek and Roman lives actively promote this portability, or do his contextual contrasts implicitly reinforce the embeddedness of exemplars, hindering their detachment?*  

  **Gap in Existing Debates**:  
  Current scholarship (e.g., Duff, König) focuses on *whether* Lives teach virtue or foster emulation but neglects *how* narrative form shapes moral reasoning. The virtue-education paradigm assumes exemplars are inherently portable; this project interrogates that assumption by analyzing Plutarch’s unique comparative architecture as a potential engine or inhibitor of portability.  

  **Methodology**:  
  Close reading of 2–3 paired *Lives* (e.g., *Alexander/Caesar*, *Lycurgus/Numa*, *Demosthenes/Cicero*), examining:  
  1. **Narrative Techniques**: How agency is framed (individual traits vs. institutional constraints).  
  2. **Juxtaposition Logic**: Whether parallels highlight transferable principles or context-dependent contingencies.  
  3. **Reader Guidance**: Prefaces, synkriseis (comparisons), and moral commentary that steer abstraction or contextualization.  

  **Defining Success/Failure**:  
  - **Success**: Evidence that Plutarch’s pairing *systematically* trains readers to isolate portable patterns (e.g., moral dilemmas resolved identically across cultures) or deliberately *blocks* portability by emphasizing institutional divergence.  
  - **Failure**: Inability to detect consistent portability patterns; evidence that context and portability coexist ambiguously without structural intent.  

  **Scope Management**:  
  Semester-length feasibility is ensured by:  
  - Restricting analysis to 3 pairs maximum.  
  - Prioritizing passages where institutional settings (e.g., Roman law vs. Greek polis) directly shape agency.  
  - Avoiding broad claims about virtue acquisition; focusing solely on reasoning habits.  

  **Significance**:  
  Reframes the ethics of biography by treating it as cognitive training in moral analogism, with implications for exemplar theory and historical pedagogy.  

  **One-Sentence Summary**:  
  This project investigates whether Plutarch’s paired-life structure trains readers to detach moral exemplars from context ("exemplar portability") or reinforces their institutional embeddedness, moving beyond virtue-education debates to analyze biography as a scaffold for ethical reasoning.

  ---  

  **Key Strengths for Your Workshop**:  
  - Sharp pivot from virtue-focused questions to cognitive habit formation.  
  - "Exemplar portability" is a novel, actionable concept.  
  - Leverages Plutarch’s comparative form as the central investigative lens.  
  - Clear stakes: Success redefines how we view biographical utility; failure still reveals structural tensions in exemplar theory.  

  **Tips for Development**:  
  - Specify *which* institutional elements you’ll track (e.g., political office/religious rites/military hierarchies).  
  - Contrast Plutarch’s approach with a hagiographic text (e.g., *Life of Antony*) to underscore portability mechanics.  
  - Use "portability" as your through-line—avoid drifting into virtue-outcome analysis.  

  Let me know if you’d like to sharpen the question further or adjust the methodological framing!
