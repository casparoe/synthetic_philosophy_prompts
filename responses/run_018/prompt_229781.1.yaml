prompt: |-
  In a graduate seminar on moral philosophy, a classmate presented an argument that has been nagging at me for weeks, and I would like help locating exactly where it goes wrong. The setup is a rescue dilemma with the numbers tuned to be uncomfortable. A fire breaks out at a chemical plant on the edge of a coastal town, and the town's single firefighting helicopter can do one of two things: it can rescue Mara, a worker trapped on a collapsing gantry who will certainly die without it, or it can dump retardant on the blaze before a toxic plume forms that would leave each of ten thousand residents downwind with permanent, severe paralysis. It cannot do both. Stipulate, as is standard in such cases, that death is a somewhat worse outcome for Mara than lifelong paralysis is for each individual resident.

  Her argument ran as follows. (1) An act is wrong just in case it would be disallowed by any principle that no one could reasonably reject. (2) Whether someone can reasonably reject a principle is a matter of the strength of her personal complaint against it: how much worse off that principle leaves her, given her position, than the available alternatives would. (3) Complaints must be assessed one person at a time; the fact that a burden falls on many people does not make any one person's complaint against it stronger. This individualist restriction, she noted, is precisely what is supposed to distinguish the contractualist comparison from the aggregative, utilitarian one. (4) To choose between principles, then, one compares the strongest complaint on each side. (5) Mara's complaint against a principle that lets her die is stronger than any single resident's complaint against a principle that lets the plume form, because death is worse for Mara than paralysis is for each resident. (6) A principle requiring the town to save the ten thousand is therefore one Mara can reasonably reject, so the town is instead required to save her. (7) Since nothing in this reasoning depends on the numbers, contractualism requires sparing one person a slightly greater harm rather than sparing any number of people a slightly lesser one — a million paralyzed, a billion, it makes no difference. She concluded that contractualism, consistently applied, proves too much and should be abandoned.

  I do not want to abandon it, but I cannot find the error. Premise (3) strikes me as the heart of the view — it is what keeps the theory from collapsing into aggregation by the back door — and (5) is true by stipulation, so my hunch is that the trouble lies in (2) or (4), though I cannot articulate what is wrong with either. Please tell me which step I should reject and explain why it looked plausible in the first place; then price the main alternatives: dropping or softening the individualist restriction (and what then distinguishes contractualism from a pluralist consequentialism that simply weighs complaints); taking the route usually associated with Scanlon himself, on which numbers may break ties among "relevantly similar" claims (and whether that route can even reach this case, where the claims are dissimilar, without smuggling in the very aggregation the view was built to avoid); or building more into the notion of what a person can reasonably be asked to bear (and whether that risks making the theory circular by encoding the verdict into the standard of reasonableness). It would also help to know what a consistent contractualist should say about the pure tie case — Mara's life against two strangers' lives — and whether the answer there forces an answer here.
reasoning: |-
  Okay, let me try to unpack this user's dilemma. They're grappling with a moral philosophy problem presented by a classmate, where contractualism seems to lead to a counterintuitive conclusion: saving one person from death is always prioritized over preventing paralysis for any number of people. The user wants to preserve contractualism but can't spot the flaw in the argument. 

  First, I need to map the argument's structure. The classmate's reasoning hinges on six key premises, with (3) and (5) seeming especially solid to the user. Premise (3) about individualism is core to contractualism's anti-aggregation stance, and (5) is true by the case's design. That makes premises (2) and (4) the likely culprits. 

  Hmm, premise (2) defines reasonable rejection solely by individual complaint strength. But what if "reasonableness" isn't just about personal burden intensity? Maybe the *grounds* for complaint matter too—like whether the burden is avoidable or arbitrary. In the paralysis scenario, each resident's burden stems from a systemic choice affecting thousands identically, which might alter the reasonableness assessment. 

  Then there's premise (4): comparing only the strongest complaints. This feels reductionist. Contractualism typically weighs *all* relevant claims in tension, not just the loudest voices. If ten thousand residents each have a "moderate" complaint, dismissing them because no single one exceeds Mara's "severe" complaint ignores how collective harm transforms the moral landscape. 

  The user’s deeper worry is about contractualism collapsing into consequentialism if we allow aggregation. But perhaps there's a middle path—what if we distinguish between *types* of harms? Paralysis here isn't just personal suffering; it creates societal costs (care burdens, lost productivity) that might factor into "reasonable rejectability" without full-blown utilitarianism. 

  For the tie-breaker case (Mara vs. two lives), contractualism might still struggle. If individualism forbids adding complaints, saving one life could paradoxically outweigh saving two. That absurdity hints that premise (4) is fundamentally broken. Scanlon’s "relevantly similar claims" approach could help, but only if we first fix how we define complaints. 

  ...Wait, maybe the real error is in premise (2)'s narrow view of "worse off." Contractualism isn't just about comparing welfare levels but fairness in social cooperation. A principle that ignores massive, preventable harm to many for a marginally worse harm to one might violate reciprocity—making it reasonably rejectable by the group. 

  *lightbulb moment* The paralysis case isn't just ten thousand separate complaints; it's a *collective action problem*. Each resident’s complaint gains force from being part of a pattern contractualism must address institutionally, not atomistically. That doesn’t require aggregation—just recognizing when individual burdens are *structurally linked*. 

  User’s fear of circularity (baking verdicts into "reasonableness") is valid, but we can avoid it by grounding reasonableness in impersonal ideals like non-arbitrariness. A principle saving Mara because "numbers don’t matter" feels arbitrary; one preventing mass suffering doesn’t. No moral smuggling needed—just consistency. 

  Final thought: the classmate’s argument exploits contractualism’s blind spot for large-scale harms. But the solution isn’t abandonment; it’s refining how complaints interact in systemic cases. Drop premise (4)’s "only strongest complaint" rule, and premise (2)’s complaint-monism. Keep individualism intact by noting that *each* resident can reasonably reject a principle that ignores identical, simultaneous harms to peers. That’s not aggregation—it’s anti-discrimination.
answer: |-
  Your classmate's argument is clever but flawed. The critical error lies in **premise (4)**: the claim that contractualism compares only the *strongest individual complaint* on each side. This misrepresents Scanlonian contractualism and leads to absurd conclusions. Let's break it down step-by-step:

  ### Why Premise (4) is Wrong
  1. **Contractualism weighs *all* reasonable complaints**:  
     Scanlon’s framework requires considering whether *anyone* could reasonably reject a principle, given the *totality* of complaints against it. We don't compare only the single strongest complaint from each side. Instead, we ask:  
     - *For Principle A*: Does the complaint of the *person most burdened* by A give them grounds to reject it?  
     - *For Principle B*: Do the *combined complaints* of those burdened by B give *any one of them* grounds to reject it?  

     In this case:  
     - A principle requiring saving Mara burdens *each resident* with paralysis.  
     - A principle requiring saving the residents burdens *Mara* with death.  
     The question isn't "Is Mara's complaint stronger than one resident's?" but:  
     > "Could Mara reasonably reject a principle that saves the 10,000? Could the residents reasonably reject a principle that saves Mara?"

  2. **The residents' complaints are collectively relevant**:  
     While each resident's complaint (paralysis) is *individually weaker* than Mara's (death), contractualism doesn't ignore the *fact* that a principle imposes this burden on *many people*. Each resident can argue:  
     *"A principle that saves Mara forces me to bear severe paralysis* ***unnecessarily***, *when an alternative principle could prevent identical harm to me and 9,999 others*."*  
     This "preventability" aspect strengthens their individual grounds for rejection. Mara, by contrast, cannot claim her death is "unnecessary" in the same systemic sense.

  3. **Reasonable rejectability depends on comparative fairness**:  
     A principle is reasonably rejectable if it imposes a burden that is *arbitrary* or *disproportionate*. Saving Mara sacrifices 10,000 people to a severe harm for the sake of one person’s *marginally* greater harm. Each resident can reasonably object:  
     *"Why must I accept paralysis so Mara can avoid a slightly worse fate, when the cumulative cost is catastrophic?"*  
     This isn't aggregation—it's about the *fairness of the distribution* of harms under a principle.

  ---

  ### Why Other Premises Are Tempting but Misleading
  - **Premise (2)**: It's incomplete. "Strength of complaint" isn't just about individual welfare loss. It includes:  
    - Whether the burden is *avoidable* under alternative principles.  
    - Whether it’s *arbitrary* (e.g., "Why save *me* but not others?").  
    - Whether it violates *reciprocity* (e.g., "I’m asked to bear paralysis for Mara, but no one would bear death for me").  
    *The plume scenario makes paralysis avoidable and arbitrary for each resident, amplifying their complaint.*  

  - **Premise (3)**: This is correct but misunderstood. Individualism means we don’t *sum* complaints, but we *do* consider how a principle *affects each individual’s situation relative to alternatives*. The *same* harm (e.g., paralysis) becomes *more objectionable* for each person when a principle *needlessly* imposes it on them while sparing others identically situated.  

  - **Premise (5)**: True, but insufficient. While death is worse than paralysis, the gap may be small (as stipulated). When opposing a principle that inflicts paralysis on 10,000 to avoid one death, each resident’s complaint *gains moral weight* from the principle’s *inefficiency* and *unfairness*.

  ---

  ### How to Resolve the Dilemma: Scanlon’s Approach
  Scanlon (*What We Owe to Each Other*, §5.4) addresses cases like this:  
  - **Relevantly similar claims**: When many people face *identical* harms (e.g., 10,000 identical paralysis risks), their claims are "relevantly similar." We then ask:  
    > *"Could any single person reasonably reject a principle that fails to prevent harm to them, when it could easily prevent harm to many others like them?"*  
  - **Numbers break ties**: If harms are comparable, saving more people is required. Here, paralysis and death are *not identical*, but the *disparity in numbers* (1 vs. 10,000) and the *avoidable collective harm* make the residents' collective complaint decisive.  

  **This avoids aggregation** by treating each resident’s complaint as identical and asking if a principle ignoring *all* such complaints is rejectable. It’s not summing welfare—it’s recognizing a *pattern of arbitrariness*.

  ---

  ### Addressing Your Concerns
  1. **Circularity?**  
     No. "Reasonableness" isn't defined by the verdict but by *impersonal justifications*. E.g., *"A principle that ignores identical, preventable harms to many for a marginally smaller harm to one is arbitrary, hence reasonably rejectable."* This appeals to fairness, not intuition.  

  2. **Distinction from Consequentialism?**  
     Contractualism focuses on *principles no one can reasonably reject*, not maximizing good. It forbids principles that *arbitrarily discount* certain people’s interests. Consequentialism aggregates; contractualism asks if a principle’s *distribution* of burdens is defensible to each person.  

  3. **The Tie-Breaker Case (Mara vs. 2 Lives)**:  
     - If harms are *identical* (death vs. death), contractualism *requires* saving the two. Each of the two could reject a principle that saves Mara instead: *"Why must I die when saving us both is possible?"*  
     - If harms are *dissimilar* (e.g., death vs. paralysis), we weigh the complaints holistically. But in your case, 10,000 paralysis harms overwhelm one death.  

  ---

  ### Conclusion
  **Reject premise (4)**. Contractualism compares the *overall rejectability* of principles based on all individual complaints, not just the strongest per side. The residents, each facing severe and avoidable paralysis, can collectively reject a principle that saves Mara, as it imposes a disproportionate burden on them for marginal gain. This preserves contractualism’s core individualism while avoiding absurdity. The theory doesn't force you to ignore numbers—it forces you to justify principles to *each person* burdened by them. In this case, no principle that sacrifices 10,000 for one can be justified to each resident. 

  **Consistent contractualist verdict**: Save the 10,000 residents.
