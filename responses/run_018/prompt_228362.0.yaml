prompt: |-
  I run the data team for a small policy institute, and we maintain a database of “counterfactual case files”: each file starts from a real event and then describes one or two alternatives, such as a different person winning an election, a different chemical being stored in a tank, or a defendant having a different prior record. We constantly have to decide whether two expressions pick out the same thing across the actual file and the counterfactual one. For example, does “the mayor” in the alternative still refer to the actual mayor, or just to whoever is mayor there? If an analyst writes “Jordan Lee” rather than “the whistleblower,” does that settle the issue? And if we discover that two aliases belong to one person, how should the database represent the fact that this was empirically learned but, once true, seems to hold in every relevant scenario?

  Please turn the philosophy of rigid designation and the necessary a posteriori into a procedure my analysts can follow without knowing that literature. I want ordered steps, tests they can apply to names, aliases, definite descriptions, role terms, natural-kind terms, organizations, and documents; rules for when an expression may be linked across scenarios and when it must be marked “role occupant only”; and guidance for recording genuinely empirical identity claims without treating every database join as metaphysically necessary. Make it usable in about fifteen minutes per case, with explicit stop points and with places where human judgment is unavoidable rather than pretending the checklist settles everything.

  Apply the procedure to three hard cases: an alternate election file containing both “the candidate who won” and the actual winner’s name; a chemical-safety file in which “the solvent in Tank 4” is later identified as acetone; and a company-merger file where the post-merger firm keeps the old name, most staff, and one legal registration but changes ownership. Include at least one case where the procedure blocks a link that our analysts will find narratively obvious but that is not philosophically justified. Also say which distinctions from the theory have to survive the simplification, which can safely be dropped for our purposes, and how hte procedure might misfire if someone treats “same label” as automatically meaning “same entity.”
reasoning: |-
  We are turning the philosophy of rigid designation and the necessary a posteriori into a practical procedure for a data team. The goal is to help analysts decide when two expressions in different scenarios (actual and counterfactual) refer to the same entity and when they refer only to the role occupant in that scenario.

  Key concepts to simplify:
  1. **Rigid Designator**: A term that refers to the same object in all possible worlds (scenarios) where that object exists. Proper names (like "Jordan Lee") are typically rigid, while descriptions (like "the mayor") are non-rigid.
  2. **Necessary a posteriori**: Some identity statements, once discovered empirically, are necessarily true (if true at all) but are known a posteriori (through experience). For example, "Hesperus is Phosphorus" is necessary but was learned empirically.

  Procedure Outline:

  We'll create a step-by-step procedure that analysts can follow. The procedure will have:
  - Ordered steps.
  - Tests for different types of expressions (names, aliases, definite descriptions, role terms, natural-kind terms, organizations, documents).
  - Rules for when to link expressions across scenarios (as the same entity) and when to mark them as "role occupant only".
  - Guidance for recording empirical identity claims without treating every database join as metaphysically necessary.

  The procedure must be usable in about 15 minutes per case, with explicit stop points and acknowledgment of where human judgment is required.

  ---

  **Step-by-Step Procedure**

  **Step 0: Setup**
  - Have the actual scenario and the counterfactual scenario(s) clearly defined.
  - Identify the expressions (terms) in question in both scenarios.

  **Step 1: Classify the Expression Type**
  For each expression in the actual scenario and its counterpart in the counterfactual, classify the type:
  - **Proper Name**: e.g., "Jordan Lee", "Acme Corp"
  - **Alias**: e.g., "the whistleblower" (if used as an alternative name for a specific person)
  - **Definite Description**: e.g., "the mayor", "the solvent in Tank 4"
  - **Role Term**: e.g., "the president", "the CEO" (similar to definite descriptions but for roles)
  - **Natural-Kind Term**: e.g., "water", "gold", "tiger"
  - **Organization**: e.g., "the company that merged with X"
  - **Document**: e.g., "the contract signed on Jan 1"

  **Step 2: Test for Rigidity**
  - **Proper Names and Aliases**: Treat as rigid by default. They pick out the same individual in every scenario where that individual exists.
    - *Exception*: If the name is being used as a role (e.g., "a George Washington" meaning a person like the first president) then it is non-rigid. But note: this is rare and context-dependent.
  - **Definite Descriptions and Role Terms**: Non-rigid by default. They pick out whoever/whatever satisfies the description in that scenario.
  - **Natural-Kind Terms**: Treat as rigid. Once we fix the actual substance (e.g., water is H2O), then in every scenario, "water" refers to H2O. But note: in a counterfactual scenario, if someone says "water", they might be referring to a substance that looks like water but is XYZ. However, for our purposes, we are interested in the actual kind. So we'll say: if the term is being used to refer to the natural kind as identified in the actual world, then it is rigid. If it's being used descriptively (e.g., "the clear, drinkable liquid in the river"), then it's non-rigid.
  - **Organizations and Documents**: These are tricky. Organizations are typically named by proper names and are rigid (e.g., "Apple Inc." refers to the same company in every scenario where it exists). However, if the organization is defined by a description (e.g., "the company that merged with X"), then it's non-rigid. Similarly, documents by title (e.g., "the Constitution") are rigid, but by description (e.g., "the document on the table") are non-rigid.

  **Step 3: Check for Empirical Identity Claims**
  - If there is an empirical identity claim (e.g., we discovered that "the whistleblower" is Jordan Lee, or that "the solvent in Tank 4" is acetone), then record this as an identity that holds in the actual world and, by necessity, in every scenario where the entities exist. However, note that the identity must be established empirically and then it becomes necessary.
    - How to record: Create a cross-reference in the database that these two expressions refer to the same entity in every scenario. But note: this only applies if the expressions are rigid designators or if the non-rigid designators are being used in a way that the identity holds necessarily.

  **Step 4: Cross-Scenario Linking Rules**
  - For each pair of expressions (one in actual, one in counterfactual):
    - If both expressions are rigid designators and they designate the same entity in the actual world, then they designate the same entity in the counterfactual scenario too (if that entity exists there). However, note that in the counterfactual, the entity might not exist or might be different? Actually, rigid designators refer to the same entity if it exists in that scenario. So if the entity exists in the counterfactual scenario, the rigid designator still refers to it.
    - If one or both expressions are non-rigid, then they may refer to different entities in the counterfactual scenario. In that case, do not link them as the same entity. Instead, mark the expression in the counterfactual as "role occupant only".
    - Special case: If a non-rigid expression in the actual scenario has been empirically linked to a rigid designator (e.g., "the mayor" is John Smith in the actual world), then in the counterfactual, the non-rigid expression (e.g., "the mayor") might not refer to John Smith. So we do not link "the mayor" in the counterfactual to John Smith unless the counterfactual scenario specifies that John Smith is still the mayor.

  **Step 5: Handling Ambiguity and Judgment**
  - If there is ambiguity in the classification (e.g., is "the company" a rigid designator for a specific organization or just a role?), then:
    - Look for contextual clues: How is the term used? Is it used as a name or as a description?
    - When in doubt, default to non-rigid (role occupant) to avoid over-linking.
  - Judgment call: Some terms may be used in a way that is ambiguous. The analyst must decide based on the context. Record the decision and the reason.

  **Step 6: Recording in the Database**
  - For rigid designators: Link the expression across scenarios to the same entity.
  - For non-rigid designators: Do not link across scenarios. Instead, create a new entity in the counterfactual scenario for the role occupant. However, note that if the non-rigid designator in the actual scenario is linked to a rigid designator (e.g., "the mayor" is John Smith), then in the counterfactual, the non-rigid designator might not be John Smith. So we record:
    - In the actual scenario: "the mayor" = John Smith (entity ID: 123)
    - In the counterfactual scenario: "the mayor" is a role occupant. If the counterfactual scenario specifies who it is, then that person (which might be John Smith or someone else) gets a new entity ID unless that person already exists in the database (e.g., if it's John Smith again, then we use the same entity ID for John Smith).

  **Step 7: Stop Points**
  - After Step 1 (classification), if the expression is clearly a rigid designator (like a proper name) and there's no ambiguity, then proceed to link if the entity exists in the counterfactual.
  - After Step 2, if the expression is clearly non-rigid (like a definite description), then mark as "role occupant" in the counterfactual and stop.
  - After Step 3, if an empirical identity has been established, then record it and then re-evaluate the designators (if the identity links a rigid and a non-rigid, then the non-rigid in the counterfactual does not automatically become the rigid one).
  - If at any step the analyst feels uncertain, they should flag the case for review by a senior team member. Time limit: if the 15-minute mark is approaching and the case is complex, stop and flag for review.

  ---

  **Application to Hard Cases**

  **Case 1: Alternate Election**
  - Actual scenario: "The candidate who won" (description) and "John Smith" (proper name) both refer to the same person, John Smith.
  - Counterfactual scenario: The election result is changed. The counterfactual file contains "the candidate who won" (which now refers to the winner in that scenario, say Jane Doe) and "John Smith" (who is still John Smith, but he lost).

  Procedure:
  1. Classify:
     - "the candidate who won": definite description (non-rigid).
     - "John Smith": proper name (rigid).
  2. In the actual scenario, we have an empirical identity: "the candidate who won" is John Smith. Record this as an actual-world identity.
  3. In the counterfactual scenario:
     - "John Smith" (rigid) still refers to John Smith (if he exists in that scenario, which he does). So we use the same entity ID for John Smith.
     - "the candidate who won" is non-rigid. In the counterfactual, it refers to whoever won (Jane Doe). Therefore, we do not link it to John Smith. Instead, we create a new entity for Jane Doe (or use her existing entity ID) and mark that in this scenario, the description "the candidate who won" refers to Jane Doe.
  4. Blocked link: The description "the candidate who won" in the counterfactual is not John Smith, even though in the actual world it was. This might be narratively obvious (because we changed the election) but the procedure correctly blocks linking the description across scenarios.

  **Case 2: Chemical-Safety File**
  - Actual scenario: Initially, we have "the solvent in Tank 4" (description). Later, we identify it as acetone (a natural-kind term).
  - Counterfactual scenario: We consider an alternative where a different solvent was stored in Tank 4.

  Procedure:
  1. Classify:
     - "the solvent in Tank 4": definite description (non-rigid).
     - "acetone": natural-kind term (rigid, because it designates a specific chemical compound).
  2. In the actual scenario, we have an empirical identity: "the solvent in Tank 4" is acetone. Record this as an actual-world identity that is necessary (once we know it, it's necessarily true that the solvent in Tank 4 in the actual scenario is acetone).
  3. In the counterfactual scenario:
     - "acetone" (rigid) still refers to acetone (the same chemical) in every scenario. So if we talk about acetone in the counterfactual, it's the same entity.
     - "the solvent in Tank 4" is non-rigid. In the counterfactual, it might be a different solvent (say, methanol). Therefore, we do not link the counterfactual description to acetone. Instead, we create a new entity for methanol (if that's what it is) and mark that in this scenario, the description refers to methanol.
  4. However, note: if the counterfactual scenario says "the solvent in Tank 4" and we haven't specified what it is, we leave it as an unknown solvent (with a placeholder) until we have more information.

  **Case 3: Company Merger**
  - Actual scenario: Pre-merger, we have two companies: Alpha Corp and Beta Corp. Post-merger, the new entity is called "Alpha Corp" (same name as one of the pre-merger companies), has most staff from both, and retains the legal registration of Alpha Corp.
  - Counterfactual scenario: We consider an alternative merger where, say, Beta Corp takes over and uses the name "Beta Corp".

  Procedure:
  1. Pre-merger actual: 
     - "Alpha Corp": proper name (rigid) for company A.
     - "Beta Corp": proper name (rigid) for company B.
  2. Post-merger actual: 
     - The new entity is called "Alpha Corp". But is this the same entity as the old Alpha Corp?
     - We have to decide: is the post-merger Alpha Corp the same entity as the pre-merger Alpha Corp? This is an empirical identity claim. The facts: it keeps the legal registration and name of Alpha Corp, but it has new ownership and merged with Beta Corp.
     - In the real world, whether a merged company is the same entity as one of its predecessors is a matter of legal continuity. Since it retains the legal registration, we might consider it the same entity as the old Alpha Corp (but note: it has changed substantially). This is a gray area. We might decide that the old Alpha Corp has ceased to exist and a new entity has been formed, but because of legal continuity, we treat it as the same. For our purposes, we'll rely on the legal identity: if the legal entity continues, then it's the same rigid designator.

     However, note: the philosophy of rigid designation for organizations is complex. We'll set a rule: if the organization retains the same legal identity (same registration, same tax ID, etc.), then we treat it as the same entity. Otherwise, we treat it as a new entity.

     In this case, the post-merger Alpha Corp has the same legal registration, so we treat it as the same entity as the pre-merger Alpha Corp.

  3. Counterfactual scenario: 
     - In the alternative, after the merger, the company is called "Beta Corp" and retains the legal registration of Beta Corp. Then:
       - The post-merger company in the counterfactual is the same entity as the pre-merger Beta Corp (because of legal continuity).
     - We do not link the post-merger company in the counterfactual to the post-merger company in the actual world. They are different entities.

  4. Blocked link: The procedure does not link the post-merger entity in the actual scenario to the post-merger entity in the counterfactual scenario. They are different entities (one is the continuation of Alpha, the other of Beta). Even though the narrative might be about a merger in both, the entities are different.

  5. Additionally, note that the name "Alpha Corp" in the counterfactual might still exist? Actually, in the counterfactual, the merged company is called "Beta Corp". So the name "Alpha Corp" in the counterfactual might refer to the pre-merger Alpha Corp (which no longer exists) or might be used for the merged company? But according to the case, the merged company is called Beta Corp. Therefore, in the counterfactual, "Alpha Corp" would refer to the pre-merger entity (if it exists in the narrative) but not to the merged company.

  ---

  **Distinctions from Theory that Must Survive**
  1. **Rigid vs. Non-Rigid**: This is the core distinction and must be maintained. Without it, we cannot explain why "the mayor" might change in a counterfactual while "John Smith" does not.
  2. **Empirical Identity Becoming Necessary**: Once we know that two rigid designators refer to the same thing (e.g., Hesperus and Phosphorus), then in every scenario they must be the same. This must be preserved to handle natural kinds and aliases.

  **Distinctions that Can Be Dropped**
  1. **Possible Worlds Semantics**: We don't need to explain possible worlds. We can talk about scenarios and what exists in them.
  2. **Deep Metaphysical Necessity**: For practical purposes, we can equate "necessary" with "holds in every relevant counterfactual scenario we consider". We don't need to delve into whether it's metaphysically necessary in all possible worlds.
  3. **Vague Cases for Organizations**: We adopt a simple rule (legal continuity) to avoid complex metaphysics of organizations.

  **How the Procedure Might Misfire**
  If someone treats "same label" as automatically meaning "same entity", they might:
  - Link non-rigid designators across scenarios (e.g., assume "the mayor" in the counterfactual is the same as in actual, when it isn't).
  - Miss that an empirical identity (like "the whistleblower is Jordan Lee") should be recorded as holding in all scenarios, and thus not create a new entity for Jordan Lee in the counterfactual when referred to by name.
  - For organizations, if they see the same name, they might link without checking legal continuity. For example, in the merger case, they might link the post-merger Alpha Corp in the actual world to the post-merger Beta Corp in the counterfactual just because both are merged entities, but that would be wrong.

  To prevent this, the procedure forces classification of the expression type and then applies the rigidity test.

  ---

  **Final Notes**
  - The procedure requires human judgment, especially in classifying expressions and in determining the identity of organizations.
  - It is designed to be done in about 15 minutes by focusing on one expression at a time and having clear stop points.
  - The key is to avoid over-linking by defaulting non-rigid terms to role occupants in counterfactuals.
answer: |-
  Below is a practical, step-by-step procedure for your analysts to handle cross-scenario identity questions. It distills key insights from rigid designation and necessary a posteriori into actionable steps, with explicit stop points and acknowledgment of judgment calls. The procedure takes **~15 minutes per case** and covers names, aliases, descriptions, roles, natural kinds, organizations, and documents.  

  ---

  ### **Procedure: Cross-Scenario Identity Linking**  
  **Goal**: Decide if an expression (e.g., "the mayor") refers to the *same entity* across actual/counterfactual scenarios, or just a *role occupant*.  

  #### **Step 1: Classify the Expression Type** (2 mins)  
  Categorize the expression in the actual scenario:  
  - **Proper Name** (e.g., "Jordan Lee"): Uniquely labels a specific entity.  
  - **Alias** (e.g., "the whistleblower"): A non-unfficial alternative name for an entity.  
  - **Definite Description** (e.g., "the solvent in Tank 4"): Describes an entity by properties.  
  - **Role Term** (e.g., "the mayor"): Refers to an entity via a position or function.  
  - **Natural-Kind Term** (e.g., "water"): Labels a type of substance/biological kind.  
  - **Organization** (e.g., "Alpha Corp"): Formal groups with legal continuity.  
  - **Document** (e.g., "the contract"): Texts or records with identifiable content.  

  **Stop Point**: If the expression is a **proper name**, skip to Step 3. For all others, proceed to Step 2.  
  **Judgment Note**: Ambiguous cases (e.g., "Apple" as company vs. fruit) require context. Flag if uncertain.  

  #### **Step 2: Rigidity Test** (3 mins)  
  Ask: *"Does this expression pick the same entity in every conceivable scenario, or could it change?"*  
  - **Rigid (same entity)**: Proper names, natural-kind terms (once scientifically identified), and aliases tied to a specific entity (e.g., "Jordan Lee" = "the whistleblower" empirically).  
  - **Non-Rigid (role occupant)**: Definite descriptions, role terms, and organizations defined by mutable properties (e.g., "the mayor," "the #1 ranked company").  

  **Rules**:  
  - Natural-kind terms are rigid *only after empirical identification* (e.g., "water" is rigid once we know it’s H₂O).  
  - Organizations are rigid if they retain *legal identity* (e.g., same tax ID); otherwise non-rigid (e.g., "the post-merger company" without legal continuity).  
  - Documents are rigid if content is fixed (e.g., "the US Constitution"); non-rigid if describable (e.g., "the contract on the table").  

  **Stop Point**: If **non-rigid**, mark as "role occupant only" in counterfactuals. Do not link across scenarios. Proceed to Step 4 for recording. If **rigid**, proceed to Step 3.  

  #### **Step 3: Existence and Empirical Identity Check** (5 mins)  
  For **rigid** expressions:  
  1. **Existence**: Confirm the entity exists in the counterfactual scenario.  
     - *Example*: If "Jordan Lee" died in the counterfactual, he doesn’t exist there.  
  2. **Empirical Identity**: If an alias/description is empirically linked to a rigid designator (e.g., "the whistleblower = Jordan Lee"), record it as a **necessary fact**:  
     - Create a cross-scenario link labeled "necessary ID" (holds in all scenarios where both exist).  
     - *But*: This does **not** make the *description* rigid. "The whistleblower" in counterfactuals still refers to whoever blew the whistle there.  

  **Judgment Note**: Not all database joins are necessary! Only proven empirical identities (e.g., "Hesperus = Phosphorus") are necessary. Corporate mergers or chemical IDs require evidence.  

  #### **Step 4: Cross-Scenario Linking Rules** (3 mins)  
  Apply these linking decisions to the database:  
  | Expression Type         | Actual Scenario         | Counterfactual Scenario     | Cross-Scenario Link?       |  
  |-------------------------|-------------------------|-----------------------------|----------------------------|  
  | Proper name             | "Jordan Lee" (entity A) | "Jordan Lee"                | **Yes** (same entity A)    |  
  | Role/Description        | "the mayor"             | "the mayor"                 | **No** (role occupant only)|  
  | Alias (empirically ID'd)| "the whistleblower" = A | "the whistleblower"         | **No** (role occupant only)|  
  | Natural kind (ID'd)     | "water" = H₂O           | "water"                     | **Yes** (H₂O in all)       |  
  | Organization (legal ID) | "Alpha Corp" (ID: 123)  | "Alpha Corp" (ID: 123)      | **Yes** (if same legal ID) |  

  **Rules**:  
  - **Never link** non-rigid expressions across scenarios (e.g., "the candidate who won" ≠ same person in alternate elections).  
  - **Always link** rigid expressions if the entity exists.  
  - For aliases: Link only if tied to a rigid designator via "necessary ID" (Step 3).  

  #### **Step 5: Recording Empirical Identities** (2 mins)  
  - **Necessary ID Claim**: When two expressions are empirically identical (e.g., "the solvent = acetone"), create a **global fact** in your database:  
    - Field: `necessary_id: [expression_A, expression_B]`.  
    - This applies to *all scenarios* but does **not** make non-rigid terms rigid.  
  - **Contingent Fact**: For scenario-specific joins (e.g., "the mayor is John Smith in 2023"), use `scenario_specific_id`.  

  **Stop Point**: Time’s up? Flag unresolved cases for review. Do not force a link.  

  ---

  ### **Application to Hard Cases**  
  #### **Case 1: Alternate Election**  
  - **Actual**: "The candidate who won" (description) and "John Smith" (name) both refer to John Smith.  
  - **Counterfactual**: "The candidate who won" now refers to Jane Doe. "John Smith" appears as losing candidate.  
  - **Procedure**:  
    1. "The candidate who won" = role term (non-rigid).  
    2. "John Smith" = proper name (rigid).  
    3. Empirical ID: "The candidate who won = John Smith" in actual scenario → Record as `necessary_id`.  
    4. **Linking Decision**:  
       - "John Smith" linked across scenarios (same entity).  
       - "The candidate who won" in counterfactual is **role occupant only** (Jane Doe).  
  - **Blocked Link**: Analysts might want to link "the candidate who won" to John Smith narratively (since he’s "the winner" in their minds), but rigidity blocks this. Philosophically justified: Descriptions aren’t rigid.  

  #### **Case 2: Chemical-Safety File**  
  - **Actual**: "The solvent in Tank 4" (description) later ID'd as acetone.  
  - **Counterfactual**: "The solvent in Tank 4" is methanol.  
  - **Procedure**:  
    1. "The solvent in Tank 4" = definite description (non-rigid).  
    2. "Acetone" = natural-kind term (rigid after ID).  
    3. Empirical ID: "The solvent = acetone" → Record as `necessary_id` (holds globally).  
    4. **Linking Decision**:  
       - "Acetone" linked across scenarios (same chemical).  
       - "The solvent in Tank 4" in counterfactual is **role occupant only** (methanol).  
  - **Philosophy in Action**: The necessary a posteriori ("solvent = acetone") is recorded, but the description remains non-rigid.  

  #### **Case 3: Company Merger**  
  - **Actual**: Post-merger "Alpha Corp" keeps old name, legal ID, and staff.  
  - **Counterfactual**: Merger creates "Beta Corp" (different name/ID).  
  - **Procedure**:  
    1. "Alpha Corp" = organization. Check legal continuity → retains registration (rigid).  
    2. "The post-merger company" = description (non-rigid).  
    3. Empirical ID: None (merger outcome isn’t necessary).  
    4. **Linking Decision**:  
       - "Alpha Corp" (actual) linked to counterfactual **only if it exists there** (it doesn’t; counterfactual has "Beta Corp").  
       - "The post-merger company" is **role occupant only** in both (different entities).  
  - **Blocked Link**: Analysts might link "Alpha Corp" across scenarios due to shared staff/name, but legal ID determines rigidity.  

  ---

  ### **Key Philosophy Simplified**  
  **Must-Keep Distinctions**:  
  1. **Rigid vs. Non-Rigid**: The core divide. Proper names/natural kinds are rigid; descriptions/roles are not.  
  2. **Necessary a Posteriori**: Empirical identities (e.g., "water = H₂O") are global facts.  
  3. **Entity vs. Role**: "The mayor" is a role; "John Smith" is an entity.  

  **Safe to Drop**:  
  - "Possible worlds" semantics (use "scenarios" instead).  
  - Debates about vague entities (e.g., "is a ship with all parts replaced the same ship?"). Use legal/organizational continuity as a proxy.  
  - Kripkean semantics for fictional names (irrelevant for your use case).  

  ### **Risks of Over-Simplification**  
  If analysts equate **same label = same entity**:  
  - **Misfires**:  
    - Linking "the mayor" across scenarios → Ignores that roles change occupants.  
    - Treating "the solvent" as acetone in counterfactuals → Erases alternative scenarios (e.g., methanol in Tank 4).  
    - Assuming merged companies with shared names are identical → Confuses legal entities.  
  - **Result**: Database loses counterfactual integrity. Alternates collapse into actual-world facts.  

  **Mitigation**: Enforce Step 2 (Rigidity Test) strictly. Use "role occupant only" tags to force deliberation.  

  ---  
  This procedure prioritizes clarity over comprehensiveness, with explicit judgment points to avoid false precision. It captures the philosophically salient aspects (rigidity, necessity) while streamlining metaphysics into database actions.
