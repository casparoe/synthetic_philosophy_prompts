answer: |-
  Here is the specification for a theory of "free will worth wanting," structured by your requirements. Non-negotiable requirements (NN) are foundational to *any* account claiming to describe a freedom *worth wanting*, regardless of metaphysical camp. Parochial demands (P) reflect commitments of specific schools.

  ---

  ### **I. Cases the Theory Must Handle**
  1.  **Manipulation (NN):** Must distinguish between ordinary causation/by external influences (potentially compatible with freedom) and *manipulation that bypasses/overwhelms* the agent's core decision-making capacities. A free agent cannot be a "puppet" whose deep psychology is covertly implanted or controlled by another agent (e.g., "brainwashing," covert neuro-surgery implanting desires).
      *   *Rationale:* If manipulation is indistinguishable from free agency, freedom is illusory or trivial.
  2.  **Coercion (NN):** Must distinguish free choice from choices made under *irresistible threat* that severely restricts viable options or paralyzes reasoning. Mere pressure isn't enough; the threat must make refusal psychologically impossible or unconscionably costly.
      *   *Rationale:* Freedom requires the absence of external forces that *cripple* the agent's capacity for choice/action.
  3.  **Addiction (Complex NN):** Must handle both:
      *   *The Unwilling Addict:* Acts contrary to their deep values/goals due to overwhelming compulsion.
      *   *The Willing Addict:* Acts consistently with their (possibly addiction-influenced) deep values/identity. Is this freedom?
      *   *Rationale:* Tests the relationship between compulsion, desire, values, and control. Freedom cannot be present if irresistible compulsion overrides the agent entirely.
  4.  **Weakness of Will (Akrasia) (NN):** Must explain actions where an agent acts *against their own better judgment* at the moment of choice, despite possessing relevant knowledge and capability.
      *   *Rationale:* Freedom requires sufficient *self-governance* to enact one's judgments, not just the capacity for judgment.
  5.  **Frankfurt-Style Overdetermination (NN):** Must account for cases where an agent freely chooses X (for their own reasons), but a counterfactual intervener (e.g., a neuroscientist) *would have* forced X *if* the agent had chosen otherwise. The agent *could not* have done otherwise, but intuitively still seems responsible/free.
      *   *Rationale:* Tests the necessity of the "ability to do otherwise" for freedom/responsibility. A viable theory must explain the intuition of freedom here or reject it convincingly.
  6.  **The Self-Endorsed but Predictable Chooser (NN):** Must account for agents whose choices are highly predictable (due to stable character, values, situation) and who endorse those choices/character. Is this freedom, or determinism in disguise?
      *   *Rationale:* Tests if freedom requires radical openness/indeterminism, or if stable, self-endorsed agency suffices. Links to life-shaping freedom.
  7.  **The Psychopath/Deeply Impaired (NN):** Must distinguish between ordinary agents and those lacking core capacities for moral understanding, empathy, or future-oriented reasoning.
      *   *Rationale:* Freedom worth wanting presupposes a minimally competent rational/reflective agent.

  ---

  ### **II. Distinctions the Theory Cannot Collapse**
  1.  **Freedom of Action vs. Freedom of the Will (NN):**
      *   *Action:* Ability to do what you want/decide (absence of external constraints).
      *   *Will:* Ability to *form* the wants/decisions/values themselves in a way that makes them *yours* and under your control (absence of internal constraints/manipulation).
      *   *Rationale:* Someone paralyzed lacks freedom of action; a manipulated puppet lacks freedom of the will. Both are needed for a robust freedom.
  2.  **Capacity for Moral Responsibility vs. Worth-Wanting Freedom (P - but crucial):**
      *   *Moral Responsibility:* Capacity to be deserving of blame/praise, punishment/reward based on actions.
      *   *Worth-Wanting Freedom:* A broader autonomy/self-determination valuable even if moral desert is metaphysically problematic or socially minimized. Focuses on *agency, authorship, and living a life genuinely one's own*.
      *   *Rationale:* Freedom might still be valuable for self-creation, authenticity, and controlling one's destiny, independent of the "blame game."
  3.  **Local Choice vs. Life-Shaping Autonomy (NN):**
      *   *Local Choice:* Freedom concerning a specific action at a specific moment.
      *   *Life-Shaping Autonomy:* Freedom exercised over time to form, critically reflect upon, and gradually modify one's values, character, commitments, and life trajectory.
      *   *Rationale:* A freedom worth wanting must encompass the ability to shape *who you become*, not just pick options from a pre-set menu at isolated moments. Handles "Self-Endorsed Predictable Chooser."

  ---

  ### **III. Results the Theory Cannot Contradict**
  1.  **Naturalism (NN):** Must be compatible with a scientific worldview where mental states supervene on/are realized by physical states (primarily the brain), and causal chains are fundamental. Cannot require non-physical souls, uncaused causes *ex nihilo*, or causal powers outside the natural order.
      *   *Rationale:* Otherwise, the theory is metaphysically untenable and irrelevant to beings like us. A freedom worth wanting must be *possible* for humans.
  2.  **Causal Determinism (P - Leeway Libertarians):** *Leeway Libertarians* demand incompatibility with causal determinism. *Other camps* (Compatibilists, Source Libertarians) require compatibility *or* the falsity of determinism to be irrelevant to the core mechanism of freedom.
      *   *Rationale:* Leeway sees alternative possibilities as essential; others focus on source/origin of action or reasons-responsiveness irrespective of determinism.
  3.  **Psychological Realism (NN):** Must be consistent with the best empirical understanding of human cognition, decision-making (e.g., biases, heuristics, dual-process theories), motivation, and development. Cannot require infallible reason, perfect self-transparency, or immunity to situational factors.
      *   *Rationale:* A freedom worth wanting must be achievable by actual humans, not idealized rational agents.

  ---

  ### **IV. Scoring of Named Views (Brief)**
  *   **Leeway Libertarianism:** Fails Frankfurt cases (requires ability to do otherwise), struggles *severely* with Naturalism (NN) requiring non-natural causal breaks. Fails Self-Endorsed Predictable Chooser (requires radical openness). (Parochial: Requires indeterminism).
  *   **Source Libertarianism:** Fails Naturalism (NN) - "ultimate source" typically requires non-natural origination or randomness incompatible with robust control. Struggles with Self-Endorsed Predictable Chooser. (Parochial: Requires indeterminism + ultimate origination).
  *   **Reasons-Responsiveness Compatibilism (e.g., Fischer & Ravizza):** Handles Frankfurt & Self-Endorsed Predictable Chooser well. Good fit with Psychological Realism. Can handle Addiction/Weakness as *impairments* of reasons-responsiveness. Risks collapsing Will/Action distinction if not careful (must show how reasons-responsiveness constitutes *will* freedom). May struggle with Manipulation if the responsiveness mechanism itself is implanted. (Parochial: Compatibilism).
  *   **Hierarchical Compatibilism (e.g., Frankfurt, Dworkin):** Handles Frankfurt, Self-Endorsed Predictable, Willing Addict. Struggles with Manipulation (can the 2nd-order volition be manipulated?), Weakness of Will (what governs the hierarchy?), and collapsing Life-Shaping into Local Endorsement. Risks "authorization regress". (Parochial: Compatibilism + structural identification of "self").

  ---

  ### **V. The Ability to Do Otherwise (ATO) vs. Ultimate Source (US)**
  *   **Can they be jointly satisfied naturalistically?** **Highly improbable.**
      *   Naturalism demands causal explanation. Genuine, non-random ATO requires branching causal futures, implying indeterminism at the decision point.
      *   US requires the *agent* (as a complex system) to be the *origin* of the action, not merely a conduit. This is *potentially* compatible with naturalism if the agent's psychology is the *unmanipulated, sufficiently complex proximate cause*.
      *   The Conflict: Naturalistic indeterminism (required for robust ATO) typically injects *randomness* at the point of choice (neural noise, quantum events). This randomness **erodes control**, making it difficult for the *agent* to be the ultimate *source* – the outcome is partly down to chance, not the agent. Satisfying ATO naturalistically tends to undermine US, and satisfying US naturalistically (as unmanipulated complex causation) tends to preclude robust, agent-level ATO.

  ---

  ### **VI. The Single Requirement Excluding Most Popular Accounts**
  **Non-Negotiable Requirement: Immunity to Non-Constraining Manipulation (NN)**
  *   **Why it excludes most:** Popular accounts fail to provide a *metaphysically robust* barrier against manipulation that leaves the agent's psychology intact *while still covertly determining outcomes*.
      *   *Frankfurt/Hierarchical:* A manipulator could engineer the agent's 1st and 2nd-order desires to ensure compliance. The agent "identifies" with manipulated desires. (Fails).
      *   *Reasons-Responsiveness:* A manipulator could ensure the agent is only responsive to reasons leading to the desired outcome. (Fails, unless "responsiveness mechanism" origin is scrutinized, which few accounts do).
      *   *Leeway Libertarianism:* Randomness offers no barrier; a manipulator could exploit indeterminism or set initial conditions. (Fails).
      *   *Source Libertarianism:* While aiming for ultimate source, its mechanisms (non-natural or indeterministic) are either non-natural (failing Naturalism) or susceptible to manipulation via the randomness. (Fails Naturalism or the requirement).
  *   **The Core Problem:** This requirement demands that the *source* or *origin* of the agent's core psychological structures (values, deliberative capacities) must *itself* be free from covert external determination, while still fitting within a naturalistic causal order. Most theories focus on the *operation* of the will at the time of choice, not the *genesis* of the will itself in a way that guarantees non-manipulated authenticity. Satisfying this likely necessitates an account of "self-shaping" over time under conditions of non-manipulation and sufficient rationality, deeply integrated with Life-Shaping Autonomy and a robust understanding of Will Freedom.

  ---

  This specification defines a freedom worth wanting as a **naturalistically possible, manipulation-resistant form of self-governance**. It requires an agent to be the unmanipulated, psychologically realistic, *proximate and authentic source* of their actions and character through time, exercising sufficient control to avoid compulsion, coercion, and weakness of will, and possessing the capacity to shape their life trajectory. The tension between ATO and US under naturalism remains a major hurdle, and the manipulation requirement exposes the deepest vulnerability of current mainstream theories.
