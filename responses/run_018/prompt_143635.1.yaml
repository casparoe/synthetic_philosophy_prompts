answer: |-
  Below is a calibrated exam question, a model answer taking a strong deflationary position, and a detailed marking scheme focused on analytical precision.

  ---

  ### **Exam Question (60-minute response)**
  > "Adjudicate decisively between the **partitioned-mind model** of self-deception (which posits functionally isolated belief-forming subsystems) and the **deflationary strategic model** (which explains self-deception as rational belief-management driven by social signaling costs). Defend *one* framework as superior. Your argument must:  
  > (a) Explain whether *epistemic akrasia* (believing against one’s better judgment) can occur without *doxastic voluntarism* (direct control over beliefs),  
  > (b) Determine whether signaling costs can fully replace the explanatory role of internal 'sub-agents' in partition theories.  
  > Justify your position with concrete philosophical arguments. Neutral summaries will receive low marks."

  ---

  ### **Model Answer: Defending the Deflationary Strategic Model (487 words)**  
  The deflationary strategic model (DSM) offers a more coherent and parsimonious account of self-deception than partitioned-mind theories (PMTs). PMTs fracture agency into warring sub-systems to resolve the paradox of "knowing and not knowing," but this creates more problems than it solves. DSM dissolves the paradox by showing self-deception is a *rational* response to conflicting incentives, not a battle between homunculi.  

  **(a) Epistemic akrasia without doxastic voluntarism** is not only possible but *expected* under DSM. Akrasia arises from competing epistemic goals: e.g., the desire for truth conflicts with the social cost of acknowledging painful facts (e.g., admitting one’s partner is unfaithful). Beliefs aren’t chosen voluntarily; they emerge from *differential attention* to evidence. A person may "know" a truth at an abstract level (enabling rational action) yet avoid detailed scrutiny of evidence that would make the belief emotionally salient. This is akrasia *without* self-contradiction: one holds a tacit truth while strategically directing cognition *away* from its implications. PMTs mistakenly treat this as "not knowing," but DSM shows it’s selective belief *maintenance*—not partition.  

  **(b) Signaling costs *replace* sub-agents entirely.** PMTs attribute explanatory labor to sub-agents (e.g., a "deceiver module" hiding truth from the "conscious self"). But these sub-agents are ontologically extravagant and lack empirical support. DSM accounts for the same phenomena through the calculus of social and psychological costs:  
  - **Self-deception as preemptive signaling**: Believing a comfortable falsehood (e.g., "I’m talented") avoids the reputational damage of insincere self-presentation. Sincerely held delusions are more convincing.  
  - **Cognitive effort as cost**: Deliberate evidence-avoidance (e.g., refusing medical tests) conserves cognitive resources and mitigates distress. This is rational prioritization—not subsystem conflict.  
  PMTs confuse *metaphor* (e.g., "part of me believes X") with literal architecture. When a jealous person obsessively seeks evidence of betrayal while claiming trust, PMTs see subsystem war; DSM sees a single agent managing trade-offs between emotional security and epistemic vigilance.  

  **Conclusion**: DSM triumphs by reducing self-deception to *unified agency* navigating competing incentives. PMTs reify folk psychology into dubious subsystems, failing Occam’s Razor. Epistemic akrasia is a cost-benefit imbalance—not a fractured mind—and signaling costs explain all phenomena attributed to partitions. Self-deception is tragic rationality, not cognitive civil war.

  ---

  ### **Marking Scheme (20 Total Marks)**  
  Candidates must hit **five analytical moves**. Each missed move deducts 4 marks. Characteristic mistakes are noted.

  | **Key Move**                                                                 | **Marks** | **Characteristic Mistake Losing Marks**                          |
  |------------------------------------------------------------------------------|-----------|------------------------------------------------------------------|
  | **1. Clearly frames PMT vs. DSM conflict**, defining core mechanisms (subsystems vs. signaling costs). | 4 | Vague definitions; conflating models. |
  | **2. Argues decisively for one model** with consistent justification (no neutrality). | 4 | Equivocating; "both have merits" without adjudication. |
  | **3. Explains epistemic akrasia without voluntarism** within chosen framework (e.g., DSM: attention management; PMT: subsystem ignorance). | 4 | Misdefining akrasia/voluntarism; appealing to "weakness of will." |
  | **4. Addresses signaling costs' sufficiency** to replace sub-agents (e.g., DSM: shows cost-benefit calculus explains evidence-avoidance; PMT: argues sub-agents are irreducible). | 4 | Ignoring the "explanatory labor" demand; listing phenomena without mechanistic explanation. |
  | **5. Uses concrete examples** to contrast frameworks (e.g., DSM: avoiding medical tests to manage anxiety/social optics; PMT: "unconscious knowledge" of infidelity). | 4 | Abstract theorizing; recycled clichés (e.g., "smoker who denies risks"). |

  ---

  ### **Notes for Implementation**  
  - **Timing**: Strong responses will dedicate ~10 mins to planning, 45 mins to writing, 5 mins to review.  
  - **Depth over breadth**: Examiners should reward tight, argumentative depth on the two required points (akrasia/voluntarism; signaling vs. sub-agents) over tangential discussions.  
  - **Bias alert**: The model answer favors DSM, but PMT defenses scoring full marks must *rigorously* defend sub-agents (e.g., citing modular psychiatry or split-brain studies) and refute signaling as sufficient for "deep" self-deception.  

  This structure forces engagement with philosophy of mind’s hard problems while avoiding well-rehearsed paradoxes. The marking scheme prioritizes analytical aggression over historical exegesis.
