prompt: |-
  I'm trying to work out when it's acceptable for scientists and modelers to rely on assumptions that are plainly false, judging by my own reactions to concrete cases. Galileo ignored air resistance and friction to study falling bodies, and that strikes me as perfectly legitimate—we still trust the results. Climate scientists treat the atmosphere as a continuous fluid rather than discrete molecules, and since their temperature predictions hold up, that simplification seems acceptable too. An economic forecast that assumes every actor is perfectly rational and fully informed also makes unrealistic premises, yet it predicts market movements accurately, and I think that validates the approach. By contrast, a psychology model that assumes people have unlimited working memory makes an equally false assumption but predicts almost nothing, and I feel the unrealism is genuinely damaging there rather than harmless. A medical dosage tool that treats the human body as a linear system happens to yield correct numbers for one specific patient group, but only by coincidence, and that feels wrong in a way Galileo's idealization does not. A planetary-orbit model treating planets as point masses with no atmosphere predicts positions well, which also seems fine. But I'm going back and forth on a predictive policing algorithm that assumes human behavior is fully deterministic, relies on proxy variables like neighborhood income, and achieves statistical accuracy in forecasting crime risk: one part of me says that if the predictions work, the false underlying picture shouldn't matter, yet another part thinks there's a defect that accuracy alone cannot cure, perhaps because the unrealistic assumptions feed back into the social reality being measured. Is there a single principle—maybe about whether the false parts are causally isolated from what's being predicted, or about the purpose for which the model is used—that captures all these judgments? What would it say about the policing algorithm? And if no clean principle saves every verdict, which of my reactions should I treat as the mistake?
reasoning: |-
  Okay, the user is presenting a fascinating dilemma about when false assumptions in scientific models are acceptable. They've listed several concrete cases where idealizations work (Galileo, climate models, economics) versus cases where similar false assumptions feel problematic (psychology, medical dosage, predictive policing). 

  The core tension seems to be between instrumental effectiveness (if the model predicts accurately, why care about truth?) and some deeper ethical/epistemological unease, especially visible in the policing algorithm example. I notice they're particularly troubled by models where false assumptions might interact with the system being modeled - like when a policing algorithm's assumptions about human behavior could actually reshape that behavior.

  Hmm, their examples reveal three key dimensions: predictive power (does it work?), harmlessness of error (does the false part matter?), and purpose (prediction vs explanation vs intervention). The policing algorithm hits all three pain points: its assumptions may introduce bias, its purpose involves high-stakes social intervention, and the "deterministic behavior" assumption actively clashes with how humans actually operate.

  What they're really asking for is a unified framework to reconcile these intuitions. Their phrasing "which of my reactions should I treat as the mistake?" suggests they suspect inconsistency in their own judgments. That's impressively self-aware - most people wouldn't question their own intuitions this deeply.

  The challenge is that no single-axis answer will satisfy all cases. We need to acknowledge that models exist on spectrums: from descriptive to prescriptive, from closed systems to open systems, from inert subjects to reflexive participants. Galileo's falling bodies don't change behavior if you describe them wrong; humans do. That's why the policing model feels different despite similar surface-level "false assumption + working prediction."

  Also worth noting: their medical dosage example reveals they intuitively grasp the difference between correlation and causation. The model "works" for one group by accident, not due to capturing real mechanisms. That's another layer beyond mere prediction accuracy.

  For the policing algorithm specifically, the red flags are: (1) it treats probabilistic social phenomena as deterministic, (2) it uses proxies that correlate with structural inequalities, (3) its outputs could amplify those very inequalities (e.g., over-policing certain neighborhoods). Even if statistically "accurate," this creates ethical feedback loops Galileo never had to consider.

  Perhaps the unifying principle is whether the false assumption obscures or distorts the actual causal mechanisms driving the phenomenon - especially when human agency is involved. But I should stress that purpose and consequences matter just as much as epistemological purity. A model for theoretical physics can afford different idealizations than one deciding police allocations.
answer: |-
  Your intuitions are remarkably consistent with how philosophers of science distinguish legitimate idealizations from problematic distortions. There isn't a *single* principle, but a framework emerges from your cases. Key factors include:

  ### Core Principles for Evaluating False Assumptions
  1.  **Purpose:** Is the model for **prediction** or **explanation/mechanism**? Prediction can tolerate "false but useful" simplifications; explanation cannot.
  2.  **Isolation of Error:** Are the false assumptions **causally isolated** from the phenomenon being modeled? (e.g., air resistance doesn't change gravity's *fundamental* effect).
  3.  **Robustness:** Does the model **still work under varied conditions**, or is its accuracy coincidental/fragile? (Your medical dosage example fails here).
  4.  **Feedback Loops:** Could the model's use **alter the system** it describes, making assumptions self-fulfilling or harmful? (Critical for social models).
  5.  **Harm vs. Benefit:** Does the model's utility **outweigh potential harms** from its false assumptions or misuse?

  ### Applying the Framework to Your Cases
  *   **Galileo/Planetary Orbits:**  
      *   *Why OK:* Purpose = isolate core mechanism (gravity/inertia). Assumptions (no friction/atmosphere) are causally isolated from gravity. Robust across scales. No feedback loops. Immense benefit, minimal harm.
  *   **Climate Science (Fluid):**  
      *   *Why OK:* Purpose = large-scale prediction. Continuum approximation isolates molecular chaos, capturing *emergent* behavior accurately. Robust for climate-scale predictions. Feedback loops (human response) are acknowledged in scenarios.
  *   **Economics (Rational Actor):**  
      *   *Why Debatably OK:* Purpose often = predictive (market trends). Assumption *sometimes* isolates aggregate behavior (e.g., efficient markets hypothesis). **But fragility is high** - fails with bubbles/panics. Feedback loops exist (models influence trader behavior). Harm from poor policy is a major risk. Your approval hinges on it "predicting accurately" - a contested claim.
  *   **Psychology (Unlimited Memory):**  
      *   *Why Not OK:* Purpose = explain cognition. False assumption is **central** to the mechanism being studied, not isolated. Non-robust (fails basic tests). Harmful to understanding.
  *   **Medical Dosage (Linear System):**  
      *   *Why Not OK:* Purpose = intervention. False assumption (linearity) is central to the mechanism. Non-robust (works only coincidentally for one group). High potential for harm when applied generally. Predictive success is fragile/accidental.
  *   **Predictive Policing Algorithm:**  
      *   **Why Problematic (Your unease is justified):**
          *   **Purpose:** High-stakes **intervention** (policing), not just prediction.
          *   **Isolation of Error:** Assumptions are **NOT isolated.** Determinism ignores agency/chance. Proxies (income) are entangled with systemic bias, not neutral simplifications.
          *   **Robustness:** Statistical accuracy likely masks fragility across demographics/contexts. "Accuracy" may reflect over-policing feedback loops, not true crime risk.
          *   **Feedback Loops: CRITICAL FLAW.** Deploying the model **creates its own reality:**  
              *   Increased policing in "high-risk" neighborhoods leads to more arrests (confirming the prediction), regardless of actual crime rates.
              *   Reinforces bias via proxies (e.g., targeting low-income areas).
              *   Erodes trust, alters community behavior negatively.
          *   **Harm vs. Benefit:** Potential for severe social harm (over-policing, discrimination, erosion of rights/trust) vastly outweighs debatable predictive benefits. Accuracy alone doesn't justify the means or consequences.

  ### Conclusion & The Policing Algorithm Verdict
  There is no single "clean" principle, but your reactions are largely correct because they implicitly weigh **purpose, causal isolation, robustness, feedback, and harm.**

  *   **Your Mistake (Minor):** Being slightly too lenient on the Economics example. Its fragility and potential for harmful feedback loops (influencing markets/policy) make it more problematic than Galileo, even if occasionally predictive.
  *   **Policing Algorithm Verdict:** Your unease is well-founded. **Accuracy alone is insufficient justification here.** The false assumptions (determinism, biased proxies) are central, not isolated. More critically, the model actively creates harmful feedback loops that distort the social reality it purports to measure and reinforces injustice. This violates the core principles of isolation, robustness, and harm/benefit balance. Even if statistically "accurate" in a narrow sense, the approach is ethically and scientifically flawed due to its real-world consequences and reliance on distorted premises that drive those consequences. **The defect is not cured by accuracy.**
