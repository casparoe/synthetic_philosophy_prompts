answer: |-
  Here are five numbered points addressing your query:

  1.  The gallery rumor scene (art enabling deferrals) demonstrates **narrative capture**: Kathy and others uncritically accept and propagate the institutionally crafted story, treating it as a genuine internal motivator for artistic effort without evidence or critical scrutiny.
  2.  Tommy's field confession (rage about Hailsham's conditioning) reveals **internal endorsement**: His explosive anger signifies a genuine internal reason—rejection and betrayal—that clashes violently with the externally imposed narrative he outwardly adhered to.
  3.  Kathy’s solitary drives enact an **ambiguity**: Her introspective narration *feels* like authentic internal processing and choice (loyalty, coping), yet its language and emotional range remain so deeply shaped by Hailsham's framing that distinguishing her own reasons from narrative capture is impossible.
  4.  The beach meeting with Madame (dismissing deferral hopes) shows **narrative capture**: Kathy interprets Madame's fear and pity as confirmation of the deferral myth's falsity and the system's inevitability, reinforcing her resignation as an internalized 'truth' rather than challenging the external script.
  5.  Kathy’s final acceptance of donation presents an **ambiguity**: Her quiet resignation could be seen as a hard-won internal reason (accepting purpose, finding peace), yet the totality of her conditioning and the absence of conceivable alternatives make it indistinguishable from complete narrative colonization dissolving the internal/external boundary.
