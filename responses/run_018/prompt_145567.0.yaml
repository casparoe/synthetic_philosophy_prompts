prompt: |-
  I sit on a small city ethics review board and every month we get proposals asking citizens to take a real hit for collective goods -- mandatory vax for healthcare workers, carbon fees, zoning rules that wipe out a landlord's income. I need a reusable decision procedure my board can run in about 20 minutes, no philosophy phd required, grounded in consequentialist reasoning but with demandingness objections built in. Don't just measure cost size; check whether the demand is sacrificial -- it forces someone to abandon or radically shrink a core life project -- versus friction, where they just adjust inside the project. Also run a residue check: even if they comply, is there a grievance that doesn't vanish?

  Write it as ordered questions with clear stop/no points and explicit flag points where it's a values call not a fact call, so the board chair has to sign off. Include test conditions a non-expert can apply, and say exactly where the procedure breaks down -- probably when goods are incommensurable, and when we ask if collective benefits ever justify sacrificial demands.

  Then apply it to three proposals:
  - mandatory flu vaccination for nursing-home staff
  - an 8% post-tax income donation mandate for local food security (this is one I actually support, so I want the procedure to wrestle with it and maybe tell me I'm wrong)
  - a retrofit zoning rule that wipes out a small landlord's rental income

  Keep it checklist form, no bibliographies, just steps and worked examples.
reasoning: |-
  We are creating a decision procedure for an ethics review board with the following features:
   - Grounded in consequentialism but with built-in protections against excessive demandingness.
   - Focuses on distinguishing "sacrificial" demands (which force abandonment of core life projects) from "friction" (adjustments within projects).
   - Includes a "residue check" for lingering grievances even after compliance.
   - Designed to be run in about 20 minutes, without requiring advanced philosophy.
   - Ordered questions with clear stop/no points and flag points for values calls (requiring chair sign-off).
   - Test conditions that non-experts can apply.
   - Explicit breakdown conditions (when goods are incommensurable and when collective benefits justify sacrificial demands).

   The procedure:

   1. **Preliminary Check: Is the proposal necessary for a significant collective good?**
      - If NO: STOP. Reject the proposal.
      - If YES: Proceed.
      - *Test condition*: Is there strong evidence that without the proposal, the collective good (e.g., public health, environmental protection) would be significantly harmed? (e.g., expert reports, data)

   2. **Burden Assessment: Is the primary burden on the affected party(ies) "friction" or "sacrificial"?**
      - *Friction*: The demand requires adjustments within a core life project without destroying it. (e.g., a small tax increase that reduces disposable income but doesn't force a change in career or housing)
      - *Sacrificial*: The demand forces the abandonment or radical shrinking of a core life project. (e.g., losing a business that one has invested life savings in, or being forced to leave a vocation)
      - *Test condition*: Ask: "If the affected party complies, can they still meaningfully pursue the central aims of the project they were engaged in?" If yes, friction. If no, sacrificial.
      - If FRICTION: Proceed to step 3.
      - If SACRIFICIAL: Flag for chair sign-off (values call: can collective goods ever justify sacrificial demands?) and then proceed to step 3 only if chair approves moving forward.

   3. **Residue Check: Even after compliance, would there be a reasonable grievance that doesn't vanish?**
      - Consider if the burden leaves a lasting sense of injustice, e.g., because it was arbitrarily imposed, unfairly distributed, or disproportionately harms a vulnerable group.
      - *Test condition*: "Would a reasonable person in the affected position, after complying, still feel that they have been treated unjustly?" (Look for: lack of compensation, lack of alternatives, discrimination, etc.)
      - If NO residue: Proceed to step 4.
      - If RESIDUE: Flag for chair sign-off (values call: is the residue acceptable given the collective good?) and then proceed to step 4 only if chair approves.

   4. **Net Benefit Assessment: Do the collective benefits substantially outweigh the burdens?**
      - Consider both the magnitude of the collective good and the number of people benefiting versus the number bearing the burden and the severity of their burden.
      - *Test condition*: "Is the collective benefit at least an order of magnitude greater than the total burden?" (e.g., preventing 1000 cases of illness vs. 10 people experiencing friction, or preventing a catastrophe vs. one person making a sacrificial loss). If in doubt, use a rough ratio of 10:1 or better.
      - If YES: Approve the proposal.
      - If NO: Reject the proposal.

   Breakdown Conditions:
     - The procedure breaks down when:
          a. Goods are incommensurable (e.g., comparing the value of a religious practice to public health benefits).
          b. At the flagged values calls (step 2 for sacrificial demands and step 3 for residue) because it requires a judgment about whether collective benefits can ever justify sacrificial demands or whether residue is acceptable.

   Now, apply to the three proposals:

   Proposal 1: Mandatory flu vaccination for nursing-home staff.

   Step 1: Necessary for collective good?
     - Collective good: Preventing flu outbreaks in vulnerable nursing home populations. Evidence: Flu can be deadly for the elderly, and staff vaccination significantly reduces transmission. Necessary? Yes, because voluntary programs often don't achieve sufficient coverage. → Proceed.

   Step 2: Burden Assessment:
     - Burden: Getting a flu shot. For most staff, this is a minor inconvenience (friction). It doesn't force abandonment of their core life project (working in healthcare). 
     - BUT: What about someone with a genuine medical contraindication or a deeply held religious objection? For the vast majority, it's friction. For a tiny minority, it might be sacrificial (if they are forced to leave their job). However, note that accommodations can be made for medical reasons, and religious objections might be handled via exemptions (but if no exemption, then for that person it becomes sacrificial). 
     - Since the proposal is for a mandate, we must consider the typical case and the design of the mandate. If the proposal includes reasonable exemption procedures, then the typical burden is friction. If it does not, then for some it may be sacrificial.
     - Assume the proposal has standard medical exemptions. For religious objections, if not exempted, then for those individuals it might be sacrificial. However, in practice, mandates often have such exemptions. Let's assume the proposal includes exemptions for medical and religious reasons (common in such policies). Then, for the vast majority, it's friction. → Proceed.

   Step 3: Residue Check:
     - Even with exemptions, someone might feel it's an infringement on bodily autonomy. However, in healthcare settings, such mandates are common and widely accepted as part of the job. A reasonable person in this position (with exemptions available) would likely not have a lasting grievance. → No residue. Proceed.

   Step 4: Net Benefit Assessment:
     - Collective benefit: Prevents serious illness and death among the elderly. Burden: Minor inconvenience of getting a shot for staff. The benefit is substantial and the burden is minimal. The ratio is very high (e.g., one shot per staff member prevents multiple illnesses and deaths). → Approve.

   Proposal 2: An 8% post-tax income donation mandate for local food security.

   Step 1: Necessary for collective good?
     - Collective good: Food security for the local community. Evidence: Food insecurity exists, and charitable donations are insufficient? A mandate would ensure a stable funding stream. But is it necessary? Could other methods (e.g., government programs, voluntary efforts) work? The board must evaluate if there's a compelling case that without this mandate, the problem would remain severe and unaddressed. Let's assume the evidence shows that current efforts are inadequate and this mandate would significantly reduce food insecurity. → Proceed.

   Step 2: Burden Assessment:
     - Burden: 8% of post-tax income. For a low-income worker, 8% might be sacrificial (e.g., they might not be able to afford rent or basic necessities). For a middle-class person, it might force them to cut back on discretionary spending (friction). For a high-income person, it's likely friction. 
     - However, we must consider the worst-affected. For someone living paycheck to paycheck, 8% could mean losing their home or not being able to feed their family — this would be sacrificial (abandoning the project of providing for one's family). 
     - Therefore, without an income threshold (e.g., exempting low-income individuals) or a progressive structure, the burden is sacrificial for the poor. 
     - If the proposal has an exemption for people below a certain income, then for those above it, it may still be friction (unless 8% is so high that it forces radical changes even for the middle class). But without an exemption, it's sacrificial for the poor. 
     - Since the question doesn't specify exemptions, we assume it's a flat 8% on all. Then, for the poor, it is sacrificial. → Flag for chair sign-off (values call: can we ask the poor to sacrifice for this collective good?).

     - If the chair signs off (which might be controversial), then proceed.

   Step 3: Residue Check:
     - Even with compliance, would there be a grievance? Yes, especially among the poor and even among the middle class who might feel that the government should fund this, not an individual mandate. The grievance might be about fairness (why not a progressive tax?) or about the imposition. → Residue is likely. Flag for chair sign-off (is this residue acceptable?).

     - If the chair signs off on both flags, proceed.

   Step 4: Net Benefit Assessment:
     - Collective benefit: Reduction in food insecurity, improved health, and social stability. The burden: 8% from every taxpayer. The total burden is the sum of all individual burdens. The collective benefit might be substantial. But is it an order of magnitude greater? 
     - Consider: The burden is 8% of post-tax income for the entire population. The benefit is the value of the food distributed and the associated benefits. We need a rough estimate. 
     - Example: In a city of 100,000 adults, average post-tax income $30,000. Total burden = 100,000 * 30,000 * 0.08 = $240 million. If this money is efficiently used and food insecurity is a $300 million problem (in terms of costs of hunger, health care costs, etc.), then the benefit might outweigh the burden. However, without data, this is speculative. 
     - Also, note that the burden falls on individuals and the benefit goes to a subset (the food insecure). The ratio of benefitted to burdened is 1:1 (everyone pays, but only some benefit). However, the collective good is shared by society (e.g., reduced crime, better social cohesion). 
     - Given the potential for the burden to be heavy (especially for the poor) and the residue, and without clear evidence that the benefit is an order of magnitude greater, it might not pass. 
     - However, the user supports this proposal. But the procedure might lead to rejection if the burden is deemed too high and the residue too strong. Alternatively, the chair might override at the flags.

     - Given the concerns, without modifications (like an income threshold) it might fail at step 4. But if the collective benefit is huge and the burden is distributed with protections, it might pass.

     Given the flags and the potential for failure at step 4, the board might reject the proposal as is. However, note that the user supports it. The procedure forces a hard look at the burden on the poor.

   Proposal 3: A retrofit zoning rule that wipes out a small landlord's rental income.

   Step 1: Necessary for collective good?
     - Collective good: Safety, environmental standards, or other public benefits. Evidence: The retrofit might be necessary to prevent fire hazards or to meet new energy standards. But is it necessary to impose it in a way that wipes out the landlord's income? Are there alternatives (e.g., phased requirements, financial assistance)? 
     - If the rule is the only feasible way to achieve a critical safety standard and the danger is imminent, then yes. Otherwise, if there are less burdensome alternatives, it might not be necessary. → If the board finds it necessary, proceed. Otherwise, stop.

   Step 2: Burden Assessment:
     - Burden: Wiping out the landlord's rental income. This is likely sacrificial because the rental property may be their primary investment and source of income. It forces them to abandon their project of being a landlord and providing for themselves and their family through this business. → Flag for chair sign-off (values call: can we impose a sacrificial demand for this collective good?).

   Step 3: Residue Check:
     - Even if the landlord complies (by selling or retrofitting at a loss), they would likely have a lasting grievance because they are being forced to bear the entire cost of a public benefit. Without compensation, this is a classic regulatory taking. → Residue is strong. Flag for chair sign-off.

   Step 4: Net Benefit Assessment:
     - Collective benefit: Improved safety for tenants, environmental benefits. But the benefit is spread over many people (e.g., the tenants and the community) and the burden is concentrated on one landlord. The benefit might be substantial (e.g., preventing a fire that could kill multiple people). 
     - However, the net benefit must be an order of magnitude greater. For example, if the rule prevents one fire per decade that might cause $1 million in damage, but the landlord's loss is $500,000, then the benefit is not an order of magnitude greater (10:1). 
     - Also, note that the collective benefit might not be huge if the risk is low. → Without a clear demonstration of a massive benefit, it fails.

     - Therefore, unless the collective benefit is overwhelming, the proposal should be rejected.

     However, note: If the government provides compensation, then the burden on the landlord is reduced (and might become friction). But the proposal as stated wipes out their income without mention of compensation. So without compensation, it is sacrificial and leaves residue, and the net benefit may not be enough.

   Conclusion:

   The procedure is applied as a checklist. It forces the board to consider necessity, the type of burden, residue, and net benefit, with explicit flags for controversial value judgments.

   For the three proposals:
     - Proposal 1 (flu vaccine) passes.
     - Proposal 2 (donation mandate) may fail without modifications (like income thresholds) because of sacrificial burdens on the poor and residue.
     - Proposal 3 (zoning rule) likely fails without compensation.

   This procedure breaks down at the flagged values calls and when benefits and burdens are incommensurable (e.g., how to compare the value of a landlord's livelihood to the safety of tenants?).
answer: |-
  ### Ethics Review Board Decision Procedure: Sacrifice vs. Friction  
  **Goal**: Approve proposals only if burdens are *friction* (adjustments within core life projects) or *justified sacrifice*, with residue checks.  
  **Breakdown Conditions**:  
  1. **Incommensurable Goods** (e.g., health vs. religious freedom).  
  2. **Sacrificial Threshold** (when collective benefits may override core life sacrifices—requires chair override).  

  ---

  #### **Decision Checklist**  
  *(Chair signs off at ⚑ steps)*  

  1. **NECESSITY TEST**  
     - *Question*: "Is this the least burdensome effective way to achieve a major public good?"  
     - *Stop if NO* → Reject.  
     - *Test*: Evidence of harm without intervention (e.g., data, expert reports).  
     - *Flag*: ⚑ If public good is debatable (e.g., "food security" vs. "tax fairness").  

  2. **BURDEN TYPE: SACRIFICE vs. FRICTION**  
     - *Question*: "Does compliance force abandonment/radical shrinkage of a core life project?"  
       - **Core life project**: Primary source of meaning/identity (e.g., career, home, family provision).  
     - *Test*:  
       - **Friction**: Adjusts but preserves project (e.g., reduced dining out to pay a tax).  
       - **Sacrifice**: Destroys project (e.g., losing a business that funds a child’s education).  
     - *Stop if SACRIFICE* → Reject unless chair overrides at ⚑ **Sacrificial Threshold**.  
     - *Flag*: ⚑ Chair must justify overriding sacrifice ("Is the public good urgent enough to compel loss of life projects?").  

  3. **RESIDUE CHECK**  
     - *Question*: "After compliance, would a reasonable person still feel wronged?"  
     - *Test*: Grievance persists if:  
       - Unfair targeting (e.g., burden falls on vulnerable group).  
       - Disproportionate sacrifice (e.g., one group bears all costs).  
       - No reciprocity (e.g., no safety net for the burdened).  
     - *Stop if RESIDUE* → Reject unless chair overrides at ⚑ ("Is residue justified by extreme public good?").  

  4. **NET BENEFIT ASSESSMENT**  
     - *Question*: "Are collective benefits ≥10× the total burdens?"  
     - *Test*:  
       - Quantify where possible (e.g., lives saved, families fed).  
       - Non-quantifiable: Majority benefit vs. isolated harm.  
     - *Stop if NO* → Reject.  

  ---

  ### **Applied to Proposals**  
  #### **1. Mandatory Flu Vaccination for Nursing-Home Staff**  
  - **Step 1: Necessity**  
    - Public good: Prevent elderly deaths. Evidence: Flu kills 15K–60K/yr in U.S.; staff transmission is high-risk.  
    - Least burdensome? Yes—alternatives (e.g., masking) less effective. → **Proceed**.  
  - **Step 2: Burden Type**  
    - Burden: Minor discomfort/time off work.  
    - Core life project? Healthcare work remains intact (no career loss). → **Friction**.  
  - **Step 3: Residue**  
    - Grievance? Bodily autonomy concerns, but healthcare jobs require safety compliance. Residue low with medical exemptions. → **No residue**.  
  - **Step 4: Net Benefit**  
    - Benefit: Prevents outbreaks (e.g., 1 staff vaccine protects 10+ vulnerable patients).  
    - Burden: Minimal. → **Approve**.  

  #### **2. 8% Post-Tax Income Donation Mandate for Local Food Security**  
  - **Step 1: Necessity**  
    - Public good: Food security. Evidence: Local data shows 20% food-insecure households; charities underfunded.  
    - Least burdensome? Unclear—progressive taxation or corporate levies might be fairer. ⚑ **Public good vs. fairness debate** → Chair override.  
  - **Step 2: Burden Type**  
    - Burden: $4K/year loss on $50K income.  
    - Core life project? For low-income earner: May force selling home or abandoning education savings. → **Sacrifice**.  
    - ⚑ **Sacrificial Threshold**: Chair must justify ("Does feeding others override family stability?"). → **Proceed with override**.  
  - **Step 3: Residue**  
    - Grievance? High—no income cap; workers see corporations unaffected. Reciprocity absent. → **Residue present**.  
    - ⚑ Chair must override ("Is community solidarity worth resentment?"). → **Proceed with override**.  
  - **Step 4: Net Benefit**  
    - Benefit: Feeds 10K+ families/year.  
    - Burden: 8% income loss for all workers.  
    - 10× ratio? Unlikely—benefits concentrated, burdens widespread. → **Reject** (fails net benefit).  
    - *Board note*: Passes only with progressive structure (e.g., exemptions for low-income).  

  #### **3. Retrofit Zoning Rule Wiping Out Small Landlord’s Rental Income**  
  - **Step 1: Necessity**  
    - Public good: Earthquake safety. Evidence: Retrofits prevent collapse in high-risk zones.  
    - Least burdensome? No—grants/tax breaks could offset costs. → **Reject** (fails necessity).  
  - **Step 2: Burden Type**  
    - Burden: Total income loss.  
    - Core life project? Landlord’s retirement/child’s tuition depends on property. → **Sacrifice**.  
    - ⚑ **Sacrificial Threshold**: Chair override possible if safety is urgent (e.g., imminent quake risk). → **Proceed with override**.  
  - **Step 3: Residue**  
    - Grievance? High—landlord bears full cost for public safety. No compensation. → **Residue present**.  
    - ⚑ Chair must override. → **Proceed with override**.  
  - **Step 4: Net Benefit**  
    - Benefit: Saves resident lives.  
    - Burden: One landlord bankrupted.  
    - 10× ratio? Only if risk is catastrophic (e.g., 50+ lives saved). Unlikely for one building. → **Reject**.  

  ---

  ### **Procedure Summary**  
  | Step          | Key Question                          | Stop/No Points          | Chair Flags (⚑)          |  
  |---------------|---------------------------------------|-------------------------|--------------------------|  
  | 1. Necessity  | "Least burdensome way?"               | No public good → Reject | Debated public goods     |  
  | 2. Burden     | "Sacrifice or friction?"              | Sacrifice → Reject      | Override sacrifice threshold |  
  | 3. Residue    | "Grievance after compliance?"         | Residue → Reject        | Override residue         |  
  | 4. Net Benefit| "Benefits ≥10× burdens?"              | No → Reject             | None                    |  

  **Output**: Approve only if all steps pass (with chair overrides where flagged).  
  **Time Estimate**: 5 min/proposal × 3 = 15 min (+5 min buffer).
