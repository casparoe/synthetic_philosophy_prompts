prompt: |-
  I'm taking a module on aesthetics and I've been arguing with my friends about whether you can seperate the work from the artist, but I keep noticing this weird institutional pattern that doesn't quite hang together. Streaming services and radio algorithms will routinely demonetise or suppress music by living artists who've been convicted of serious violent crimes, yet those same platforms keep recommending films directed by people with comparable — or worse — moral records, and university galleries often refuse to hang a new acquisition if the artist is currently in prison, while paintings by long-dead artists who did genuinely awful things stay on the permanent wall with just a small biographical plaque.

  What philosophical commitments about artistic value and moral accountability does this selective filtering actually presuppose? Does it presuppose that moral taint decays over time, or that different media carry different ethical weights, or is it just risk-management dressed up as aesthetics? Reconstruct the implicit theory: is it a version of ethical contextualism with a kind of statute of limitations, some form of autonomism that only applies once the creator is dead, or something genuinely incoherent? And tell me whether the practice actually needs one consistent theory, or whether it's philosophically underdetermined so that several rival views could license exactly the same pattern. Finally, what would have to change in museum and platform policy if we genuinely adopted the view that aesthetic value is completely independent of the artist's moral character, versus the view that serious moral wrongdoing always diminishes the work's value regardless of when it happened? Please answer in British English, and don't worry about giving me citations or a reading list — I just want the conceptual commitments mapped out clearly.
