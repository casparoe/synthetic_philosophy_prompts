  Right, let's dissect this institutional double standard. It's a messy tangle of pragmatism, inconsistent philosophy, and unspoken assumptions. Here’s the reconstructed implicit theory underpinning this selective filtering, followed by what consistent application of the extremes might look like:

  **The Implicit Theory: Pragmatic Moral Contextualism with a Temporal & Economic Hedge**

  The current practice doesn't adhere neatly to pure autonomism (art completely separate from artist) or pure moralism (art always tainted by artist). Instead, it operates on a **pragmatic hybrid** that prioritises contemporary risk management and institutional comfort, dressed in thin philosophical justifications:

  1.  **The Temporal Hedge (The "Statute of Limitations" Effect):**
      *   **Commitment:** Moral taint *is seen to diminish* or become irrelevant over time, *not* because the wrongdoing was less awful, but because temporal distance supposedly separates the *work* from the *living consequences* of the artist's actions.
      *   **Mechanism:** For the living (or recently deceased), the artist is a *contemporary actor*. Their crimes are current events, they may profit, victims/survivors are alive, and public outrage is palpable. Art is entangled with the *ongoing person*. Once dead for generations, the artist is reduced to a historical figure. Their moral failings become biographical footnotes, part of the "context," not an active source of harm or controversy *for the institution*. The *work* feels like it belongs to "culture" or "history," not the individual monster.

  2.  **The Economic & Reputational Hedge (Risk Management):**
      *   **Commitment:** Avoiding *immediate, tangible* backlash (loss of subscribers, funding cuts, protests, negative press) outweighs abstract aesthetic purity or consistent moral principle. Protecting the institution's brand and bottom line is paramount.
      *   **Mechanism:** Suppressing a living artist's work is low-cost risk mitigation. Few people *expect* platforms to platform a current violent offender. For dead artists, removal is high-cost (loss of cultural capital, accusations of censorship, rewriting history) and often provokes *more* controversy than leaving it up with a contextual note. The small plaque is the *minimum viable gesture* of acknowledgement that satisfies most without destabilising the display.

  3.  **The Medium Hedge (Inconsistent Application - Collaboration & Perception):**
      *   **Commitment:** The perceived *closeness* of the creator to the work and the *collaborative nature* of the medium influence how heavily moral taint is applied. This is largely unconscious bias.
      *   **Mechanism:** Music (especially solo artists/bands) is often seen as a direct, intimate expression of the individual perpetrator. Film is perceived as inherently collaborative – punishing the director punishes hundreds of "innocent" crew/cast. Painting/sculpture falls somewhere in between. This is philosophically shaky but explains the platform disparity.

  4.  **The "Death of the Author" Lite:**
      *   **Commitment:** A weak form of autonomism *only* applies posthumously. Once the artist is dead, the work can be judged more "on its own terms" because the creator's *intentionality* and *ongoing agency* (like profiting) are removed. The biographical plaque allows institutions to gesture towards contextualism ("we acknowledge the badness") while keeping the art, thus maintaining the *illusion* of posthumous separation.

  **Is it One Consistent Theory or Underdetermined?**

  It's **philosophically underdetermined and inherently inconsistent** as a *moral* framework. Several rival views *could* be used to *justify* the *same* pattern, but the driving force isn't philosophical coherence – it's institutional pragmatism:

  *   **Ethical Contextualism with Time Limit:** Could argue the *meaning* and *impact* of the work changes over centuries, making the moral context less immediately relevant to contemporary viewers.
  *   **Weak Autonomism Post-Mortem:** Could argue that the artist's death severs the essential link required for moral taint to apply; the work becomes a free-floating aesthetic object.
  *   **Consequentialism:** Argues the *consequences* of displaying/suppressing differ vastly for living vs. dead artists (outrage/profit vs. historical loss/minimal harm).
  *   **Institutional Self-Preservation:** Not a *philosophy of art* but a *modus operandi* that uses aesthetic/moral language as a fig leaf.

  The pattern doesn't *need* one consistent theory. Institutions employ whichever justification (time, medium, death) is most convenient for the specific case to minimise risk and friction. The inconsistency *reveals* that philosophical principle is secondary to practicality.

  **Consequences of Adopting Extreme Views Consistently:**

  1.  **Pure Autonomism (Aesthetic Value Completely Independent):**
      *   **Changes:** All filtering based on artist morality ceases. Roman Polanski films, R. Kelly songs, and contemporary art by convicted criminals would be treated identically to work by saints. Biographical plaques focusing on immorality would vanish as irrelevant to aesthetic appreciation. Museums/platforms become pure content providers, judged solely on artistic merit/cultural significance, regardless of creator.
      *   **Challenge:** Institutions would face significant public and internal backlash for appearing morally indifferent to heinous acts, especially concerning living artists profiting or where victims are affected.

  2.  **Pure Moralism (Serious Wrongdoing Always Diminishes Value):**
      *   **Changes:** Rigorous historical research and consistent application. Works by artists guilty of "serious violent crimes/moral wrongdoings" would be suppressed or removed, regardless of era or medium.
      *   **Museums:** Galleries would empty significantly (e.g., remove Caravaggio (murderer), Picasso (abuser), Gauguin (exploiter), many Renaissance masters (patrons linked to atrocities), etc.). Displays would focus solely on artists with clean (or acceptably dusty) records. Acquisitions from living artists with serious convictions would be unthinkable.
      *   **Platforms:** Extensive blacklists based on moral criteria, applied historically. Vast swathes of classic film and music catalogs would disappear.
      *   **Challenge:** Accusations of massive cultural vandalism, censorship, imposing contemporary morals anachronistically, and creating a sanitised, impoverished cultural landscape. Defining "serious wrongdoing" consistently across centuries would be a minefield.

  **In essence:** The current practice isn't driven by a coherent aesthetic philosophy like pure autonomism or moralism. It's **Pragmatic Institutional Contextualism**: a risk-averse calculation that applies moral scrutiny most heavily where the *institution* perceives the *greatest immediate risk* (living artists, especially in "personal" media like music/painting) and least heavily where the costs of removal are highest and the risks of display are lowest (long-dead artists, complex collaborative media like film). The "theory" it presupposes is that **moral accountability fades with time and death, and different media have different thresholds for scandal, but the ultimate imperative is institutional self-preservation.** The philosophical language used ("context," "separating art from artist") is often a retrospective justification for this essentially pragmatic, inconsistent, and risk-averse approach.
