  Okay, let me try to unpack this user's query. They're studying aesthetics and noticed a contradiction in how institutions treat artists based on their moral failings—living artists get suppressed while dead ones don't. They want to know the philosophical assumptions behind this and if it's consistent.

  First, I need to understand the core issue. The user points out that streaming services remove music by living criminals but recommend films by similarly problematic directors. Museums avoid new works by imprisoned artists but keep old masters' pieces with just a plaque. The user is asking what philosophical commitments this implies. 

  They mention several possibilities: moral taint decaying over time, different ethical weights per medium, or just risk management. They also ask if it's ethical contextualism with a statute of limitations, autonomism after death, or incoherent. Plus, whether multiple theories could explain the same practice and what changes would occur under two extreme views.

  I should start by breaking down the current institutional behavior. It seems like timing and death matter a lot. Living artists' actions directly affect their work's availability, but once they're dead, the work stays, maybe with a disclaimer. Risk management makes sense here—avoiding backlash from living controversies while historical figures are less likely to cause current outrage. Also, dead artists can't profit, so financial concerns lessen.

  Different media might be treated differently due to their collaborative nature. Films involve many people, so punishing the director affects others, whereas music or paintings might be seen as more individual. But that doesn't hold up entirely since both have collaborators. So maybe it's more about public perception and which artists are more visible.

  The philosophical theories involved could be a mix. A statute of limitations on moral taint implies that time separates the art from the artist. Autonomism might apply only posthumously when the artist's influence is gone. But it's not consistent. The institutions aren't following one theory but reacting pragmatically.

  Could multiple theories lead to the same practice? Yes. For example, ethical contextualism might say the artist's immorality affects the work's meaning, but over time, the context shifts. Autonomism could argue that art should be judged separately, but only after death when the creator isn't benefiting. So different reasons, same outcome.

  If art was completely separate from the artist, institutions would display all work regardless of the creator's morals. No suppression or disclaimers. But if moral wrongdoing always diminishes the work, then even historical pieces would be removed or heavily contextualized. That would mean taking down works by Caravaggio or Picasso, which isn't happening now.

  The user might be looking for validation that the current practice is inconsistent. They might also want to understand underlying motivations like risk aversion versus philosophical principles. Their deeper need could be to form a coherent argument for their class discussions, using real-world examples to critique institutional hypocrisy.

  In conclusion, the current practice is a pragmatic compromise, not based on a single theory. Multiple philosophies can justify it, but under scrutiny, it's more about managing present-day risks than consistent ethical principles. The user needs clear conceptual mapping to articulate this in their academic work.
