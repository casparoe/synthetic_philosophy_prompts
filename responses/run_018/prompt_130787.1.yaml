prompt: |-
  Everytime I travel someone hits me with "when in Rome, do as the Romans do" like its a knockdown argument — last week about tipping in NYC (which I think is coercive) and then jaywalking in Berlin. I'm trying to figure out what that proverb actually amounts to when people apply it to everyday conventions: tipping, queueing, jaywalking, and whether visitors really have moral obligations to conform.

  Can you lay out teh precise claims it could be expressing? For example: pure descriptive prediction ("locals will stare"), prudential advice ("avoid conflict"), universal morality with locally-variable rules, full-blown cultural relativism, or something weirder like the convention generating its own authority regardless of welfare. For each reading say if its trivial, defensible, false, and — crucially — whether it actually supports the conclusion people push (that I must tip/queue/jaywalk like them). I want a menu I can use, not one picked answer.

  Keep it under 300 words, bullet points ok. Also please separate what's genuinely settled (that social conventions exist and vary) from what's contested among people who study norms — don't present one side like cultural relativism or universalism as teh consensus.
reasoning: |-
  Okay, the user is frustrated with how people use "When in Rome, do as the Romans do" to pressure them into conforming to local practices like tipping in NYC or jaywalking in Berlin. They want a breakdown of what this proverb actually means in different contexts and whether it creates a real moral obligation. 

  First, I need to unpack the possible interpretations of the proverb. The user mentioned specific examples—tipping, queueing, jaywalking—so I should address those directly. They’re clearly annoyed by the coercive feel of the phrase, especially around tipping, which they find problematic. 

  The user wants a "menu" of interpretations, not a single answer, so I’ll avoid taking sides. They also want a clear separation between settled facts (like cultural variation) and contested theories (like relativism vs. universalism). I notice they’re academically inclined—phrasing like "moral obligations" and "convention generating its own authority" suggests they’ve thought about philosophy of norms. 

  Hmm, the tricky part is balancing brevity (under 300 words) with depth. I’ll structure it as bullet points for clarity. For each interpretation, I’ll cover: what it claims, whether it’s true/defensible, and crucially, whether it actually forces conformity. The user wants to push back, so I’ll highlight where the proverb’s logic fails (e.g., "descriptive prediction doesn’t imply obligation"). 

  I should also flag contested areas neutrally. For example, scholars debate whether norms have inherent moral weight—some say yes (conventionalism), others say no (universalism). The user would hate if I framed relativism as consensus, so I’ll explicitly state disagreements. 

  On tipping/jaywalking: I’ll note that even if a norm exists, conformity isn’t automatically obligatory. Tipping’s coerciveness might make it a bad norm, and jaywalking’s harmlessness could justify non-compliance. That’ll arm the user for debates. 

  Finally, I’ll end with the core conflict: the proverb conflates description ("Romans do X") with prescription ("you must do X"). That’s the user’s real weapon—pointing out this leap in logic.
answer: |-
  Here's a breakdown of interpretations of "When in Rome..." and their validity regarding moral obligation:

  ### Settled Foundation
  *   **Descriptive Fact:** Social conventions (tipping norms, queueing styles, jaywalking tolerance) *exist* and *vary significantly* by location. (True & Trivial)

  ### Interpretations & Their Force
  1.  **Pure Descriptive Prediction:** "If you don't conform, locals will likely react negatively (stare, comment, be slower)."  
      *   *True?* Often, but depends on the norm and visibility.  
      *   *Supports Obligation?* **No.** Predicts consequences, doesn't establish a *duty*.

  2.  **Prudential Advice:** "Conforming avoids conflict, hassle, or poor service (e.g., getting stiffed by a waiter, yelled at for queue-jumping)."  
      *   *Defensible?* **Yes,** pragmatically for many situations.  
      *   *Supports Obligation?* **No.** Advises self-interest, not morality. You can choose to accept the hassle.

  3.  **Local Conventionalism:** "The local convention *itself* creates a pro-tanto (at first glance) obligation to follow it *because* it's the convention (e.g., 'tipping is part of the wage here')."  
      *   *Defensible?* **Contested.** Scholars debate if conventions *inherently* generate obligations. Requires justification beyond mere existence.  
      *   *Supports Obligation?* **Potentially, weakly.** If defensible, it supports conformity *only if* the convention is reasonably just and participation is fair. Doesn't automatically override objections.

  4.  **Universal Morality w/ Local Rules:** "A universal moral duty (e.g., respect, fairness, non-harm) *requires* following local rules *as the way* to fulfill that duty here (e.g., not tipping exploits workers in *this* system)."  
      *   *Defensible?* **Yes, but complex.** Depends on the *moral weight* of the underlying duty and whether conforming is truly necessary to fulfill it.  
      *   *Supports Obligation?* **Conditionally.** Only if violating *this specific norm* in *this context* genuinely violates a core moral principle *and* conforming is the necessary remedy. Requires case-by-case analysis.

  5.  **Full Cultural Relativism:** "Morality *is* defined by culture. Therefore, what's right in Rome *is* right for you while there."  
      *   *Defensible?* **Highly Contested.** Faces significant philosophical challenges (e.g., condemning dissent, justifying harmful norms). Not consensus.  
      *   *Supports Obligation?* **Allegedly.** If true, *requires* conformity. But its premise is widely disputed.

  6.  **Convention as Self-Justifying Authority:** "The fact a convention exists *alone* gives it normative authority, regardless of its effects or origins."  
      *   *Defensible?* **Generally No.** Most philosophers reject "might makes right" for norms. Requires independent justification.  
      *   *Supports Obligation?* **Unconvincingly.** Fails to explain *why* mere existence creates a binding duty.

  ### Key Takeaway Menu
  *   **Predicts reactions?** Often yes, but irrelevant to *obligation*.
  *   **Prudent?** Often yes, but self-interest ≠ duty.
  *   **Creates weak obligation *if* convention is just?** Contested, but possible for norms central to local fairness.
  *   **Required by universal duty *if* violation causes local harm?** Requires proving the harm and necessity.
  *   **Demanded by relativism?** Only if you accept relativism (highly debatable).
  *   **Self-justifying?** Unlikely. **No interpretation automatically proves a *strong moral obligation* to conform to *any* convention.** The burden is on the person invoking it to justify *why* this specific norm creates a duty.
