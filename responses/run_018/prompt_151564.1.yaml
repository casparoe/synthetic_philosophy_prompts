  Okay, let me unpack this complex philosophical query about psychiatric advance directives (PADs). The journalist is asking about the underlying theories of personal identity that justify binding future selves during mental health episodes.

  First, I need to reconstruct the implicit theory behind PADs. The core tension is between the "remitted self" having authority over the "symptomatic self" despite apparent present capacity. This clearly rejects strict presentism. The practice seems to prioritize narrative continuity - viewing the symptomatic episode as a disruption to the person's true identity. There's a normative commitment to "authenticity" where the stable self defines values. Metaphysically, it requires some form of diachronic persistence, but doesn't strictly demand four-dimensionalism. The key is recognizing psychological discontinuity as delegitimizing present autonomy claims.

  For rival frameworks: Four-dimensionalism fits neatly by seeing selves as temporal parts. But discontinuity models work too - treating the symptomatic self as "inauthentic." Presentist autonomy fundamentally conflicts unless modified. The institution remains underdetermined between persistence models as long as they accommodate value disruption.

  Comparing with contract law reveals tension: Both recognize temporary incapacity, but PADs uniquely allow preemptive binding. The difference lies in viewing psychiatric impairment as fundamentally identity-altering rather than just competence-diminishing. This needs clearer philosophical grounding.

  If we adopted a view denying cross-temporal authority, the practice would need radical change: PADs couldn't override contemporaneous refusal. We'd shift to purely advisory directives or require stricter episodic competence thresholds. But this might undermine PADs' preventive purpose.

  The challenge is balancing protection of the "authentic self" with respect for present autonomy during crises. The law's asymmetrical treatment of psychiatric versus other temporary impairments deserves deeper scrutiny.
answer: |-
  ### Reconstruction of the implicit theory of diachronic authority
  The practice presupposes a **narrative continuity model of personal identity** with **normative primacy granted to the "authentic" or "remitted" self**. Metaphysically, it minimally requires that:  
  - **Personal persistence exists across time** despite psychological discontinuity (rejecting strict presentism).  
  - **The symptomatic self is a compromised manifestation** of the persistent person, not a distinct agent.  
  - **Value discontinuity during illness delegitimizes contemporaneous autonomy claims** when they conflict with the baseline self’s deeply held values.  

  Normatively, it commits to:  
  - **Authenticity as sovereignty**: The self expressing stable, reflective values (in remission) holds greater authority than the self under illness-induced distortion.  
  - **Preemptive harm prevention**: Protecting the persistent person’s long-term interests justifies overriding episodic resistance.  
  - **Epistemic asymmetry**: Clinicians/legal systems can reliably distinguish "inauthentic" symptomatic states from "true" selves via documented directives.  

  **What it strictly requires**:  
  - Rejection of momentary autonomy absolutism (sovereignty isn’t confined to the present "slice").  
  - Recognition that certain psychological states (e.g., psychosis, severe mania) void agential authority *even if* the patient demonstrates *apparent* competence by standard clinical metrics (e.g., articulating reasons, understanding consequences).  

  **What it accommodates but doesn’t strictly demand**:  
  - Four-dimensionalism (4Dism): While compatible—viewing remitted and symptomatic stages as temporal parts of a single spacetime worm—it doesn’t necessitate 4D metaphysics. A robust psychological continuity theory suffices.  
  - Essentialism: It fits with viewing the remitted self as the "core" identity but doesn’t require metaphysical essentialism.  

  ---

  ### Rival frameworks and underdetermination  
  The practice is **philosophically underdetermined** but **excludes presentist autonomy**:  

  1. **Four-dimensionalism**: Easily justifies PADs by framing the directive as a "temporal self-legislation" pact binding all stages. The earlier temporal part’s preferences govern later parts as components of one entity. *Fits well but not required*.  
  2. **Discontinuity model**: Treats the symptomatic self as a "corrupted" or "inauthentic" agent whose values are alien to the person’s true identity. The directive restores the authentic self’s control. *Directly aligns with the practice’s rhetoric of "self-binding" against illness*.  
  3. **Presentist/momentary autonomy**: **Cannot accommodate** the practice. If sovereignty resides solely in the present self with capacity, overriding refusal violates core autonomy. The practice implicitly rejects this view.  

  **Where the institution is silent**:  
  - It doesn’t specify *why* the symptomatic self lacks authority—whether due to metaphysical non-identity (discontinuity) or mere part-whole subordination (4Dism).  
  - It remains neutral on whether psychological connectedness defines identity (e.g., Parfit-style) or if a deeper essence persists.  
  - **Verdict**: Rival persistence theories (4Dism, narrative identity, Lockean continuity) can all license PADs *if* they accept that illness creates "agential disunity" justifying prior preferences. Only strict presentism is excluded.  

  ---

  ### Consistency check with adjacent legal doctrines  
  **Tension exists with contract/tort law**, exposing a philosophical inconsistency:  

  - **Contract law**: Voidable if signed under duress, intoxication, or acute mental illness. Recognizes *temporary incapacity* nullifies consent, prioritizing the *impaired self’s* protection from exploitation.  
  - **Tort law**: Rejects liability for acts during dissociation (e.g., automatism).  
  - **PADs**: Invert this logic—enforcing the *prior self’s* will *despite* the present self’s impairment and refusal.  

  **Diagnosis**: The law implicitly categorizes mental-illness-related fluctuation as **identity-subverting** (warranting binding the future self), while other impairments (duress, intoxication) are merely **capacity-diminishing** (voiding present consent). This relies on:  
  1. **Causal asymmetry**: Mental illness is seen as *internally* distorting identity, whereas duress is *external* coercion.  
  2. **Normative exceptionalism**: Psychiatry’s "best interest" paradigm overrides standard incapacity protocols.  
  **Core tension**: PADs privilege past autonomy, while contract law protects the vulnerable present self—a contradiction unless we accept psychiatric crises uniquely fracture identity.  

  ---

  ### Verdict on necessary philosophical change  
  If we adopted a view denying cross-temporal authority over psychologically discontinuous stages (e.g., strict presentism or Parfitian reductionism), the practice would require **fundamental restructuring**:  
  1. **Directives become advisory**: Clinicians could consider past preferences but not override contemporaneous refusal from a "capacitated" self (even if symptomatic).  
  2. **Stricter competence thresholds**: "Apparent capacity" during episodes would need redefinition to exclude illness-influenced refusals—a clinical/ethical quagmire.  
  3. **Shift to harm-prevention justification**: If personal persistence is rejected, PADs could only be enforced under *parens patriae* (state intervention for grave harm), not as self-binding. This would weaken their ethical foundation in autonomy.  
  4. **Procedural safeguards**: Binding enforcement might require court review *during crises* to adjudicate "authenticity," undermining PADs’ efficiency.  

  **Conclusion**: The practice depends on *some* concept of diachronic identity. Without it, PADs lose their distinctive ethical rationale and morph into instruments of paternalism.
