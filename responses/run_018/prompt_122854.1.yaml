prompt: |-
  hey — so I'm doing this summer course (second-year undergrad, psych/philosophy crossover, mostly experimental philosophy) and me and two friends are putting together a practice final for our study group. I got assigned the question on the Knobe effect and I'm stuck, because literally everyone in the group can already recite the basic thing: chairman of the board, new program, it'll raise profits, it'll also harm the environment, he says he doesn't care about the environment at all, and people say he harmed the environment intentionally — but in the version where it helps the environment they don't say he helped it intentionally. If I just ask "describe and explain the asymmetry" everyone writes the same paragraph and I've learned nothing about who actually gets it. The bit that actually broke my brain in lecture was the counterfactual part: in the harmful case people will also happily say that if the environment wouldn't have been harmed he'd have run the program anyway, that he wasn't trying to harm anything and would've prefered it not happen, and they *still* call it intentional. So something is doing work there and I can't say what. Is it that the ordinary concept of intentional action is secretly normative somehow, or is it that people are quietly answering a different question than the one they were asked — reporting whether he's blameworthy, or whether he knew, or whether he did it anyway despite knowing — so the result is an artifact of the vignette and the wording rather than a fact about the concept? My friend keeps saying the "he knew and did it anyway, that's what intentional means" reading is just relabeling the datum instead of explaining it, and I think she's right but I can't articulate why.

  So: can you write me one essay question for this, 45 minutes, 25 marks, that forces people to actually pick that apart instead of reciting? I want it built around some cases I invented that I think pull the explanations apart (fix them if they're bad or if they don't do the work I think they do — and please say in the marking scheme if one of them turns out not to discriminate anything): (1) a version where the side effect breaks a rule that has nothing to do with morality at all — a girl picks the playlist for a school dance to get people dancing, and she knows it breaks some dumb new admin rule about explicit lyrics after 9pm, but breaking the rule isn't her reason; did she intentionally break the rule? (2) a version where nobody acts: the chairman quietly lets the program get cancelled because cancelling is good for profits, and the environment is helped / harmed as a result, and again he doesn't care either way. (3) a version where the "agent" isn't a person — the school's timetable scheduling program, which the programmers gave exactly one objective (minimise room clashes) and which ends up, totally foreseen, making a bunch of kids miss the last bus home; the programmers knew and didn't care. Maybe a fourth where the side effect is good but the agent hates that it's good and tried to stop it, you decide if that one helps.

  Then I need a model answer (600–700 words is good) and a marking scheme that really separates an A from a B — the specific moves an A has to make, what each cluster of marks is for, and the ways people wimp out. Definitely build into the scheme that "moral judgments leak into non-moral ones" or "people use intentionally to mean blameworthy" on its own is the classic C answer and worth like 3/25 max, and say what the A answer does with those claims instead. Also: we're doing this closed-book with no wifi, so please don't make anything depend on who published what or in what year, and no reading list or citations — I always mix up which paper said which thing and I don't want to memorise names. And please don't spend the question explaining the basic finding back at us; assume we know it and come at it from a angle that makes us squirm a bit.
reasoning: |-
  Okay, let me unpack this user's request. They're designing a practice exam question on the Knobe effect for their study group, and they're frustrated that standard questions only get rote responses. The real puzzle for them is the counterintuitive finding where people call harmful side effects intentional even when the agent would've acted the same way without the harm. 

  First, I need to understand their core challenge: they want a question that forces deeper engagement with why the "he knew and did it anyway" explanation fails. Their invented cases are clever - especially the non-moral rule-breaking variant and the non-human agent scenario. These could effectively test whether moral valence is necessary for the asymmetry.

  The user's hidden concern seems to be about distinguishing between descriptive and normative accounts. They hint at this when questioning whether "intentional" is secretly normative. Their friend's point about "relabeling the datum" suggests they intuitively grasp that the standard student answer confuses description with explanation.

  For the essay question, I'll structure it to pit three explanations against each other using their cases: 
  1) The "blameworthiness masking as description" view 
  2) The "counterfactual competence" approach 
  3) The "skill/luck" framework from Knobe's later work. 

  The non-human agent case is particularly useful here - if people still see "intentional harm" from a program, it challenges folk-psychological explanations. The passive chairman case helps dissect action vs omission asymmetry.

  In the model answer, I'll emphasize how the A-grade response must show why moral valence creates the asymmetry without reducing to "blameworthiness". The key moves should be: 
  - Demonstrating why counterfactuals alone don't resolve it 
  - Explaining how bad outcomes make skill/luck judgments salient 
  - Using the user's cases to show these mechanisms operate in non-moral domains too

  The marking scheme needs to punish surface-level answers harshly (hence the 3/25 for "it's just blameworthiness"). Top marks should require connecting normative valence to how we parse mental states - perhaps through Knobe's "agential constituents" idea, though I'll avoid jargon.

  Most importantly, the question must make students uncomfortable by exposing contradictions in their intuitions. That's where the real learning happens - exactly what this user wants for their study group.
answer: |-
  Here’s an essay question designed to push beyond rote explanations of the Knobe effect, leveraging your cases to probe deeper mechanisms. The question forces students to reconcile conflicting intuitions, explain *why* simple explanations fail, and grapple with the role of normativity in intentionality judgments.

  ---

  **ESSAY QUESTION (45 minutes, 25 marks):**

  > **The Knobe Effect reveals an asymmetry: harmful side effects (e.g., harming the environment) are judged intentional, while helpful ones (e.g., helping it) are not, even when awareness and indifference are identical. Critically evaluate *three* competing explanations for this asymmetry:  
  > (A) People confuse "intentional" with "blameworthy" (moral evaluation leaks into description).  
  > (B) People interpret "intentional" as "the agent knew it would happen and proceeded anyway".  
  > (C) The outcome’s normative valence shapes how we attribute the agent’s *reasons* or *skill*.  
  >   
  > Use the following cases to test these explanations:  
  > 1. *The Playlist Rulebreaker*: Maya runs a school dance. She picks songs solely to maximize attendance. She knows this playlist violates a new (non-moral) rule banning explicit lyrics after 9 PM, but breaking the rule isn’t her goal. Did she intentionally break the rule?  
  > 2. *The Passive Chairman*: The Chairman learns that canceling a program would slightly boost profits. Canceling would also *harm/help* the environment. He doesn’t care about the environment and lets cancellation proceed. Did he intentionally harm/help the environment?  
  > 3. *The Scheduling Algorithm*: A school’s timetable AI is programmed *only* to minimize room clashes. It generates a schedule foreseeably causing 30 students to miss their last bus home. The programmers knew this and didn’t care. Did the AI intentionally cause the students to miss the bus?  
  >   
  > Explain which explanation(s) best survive these cases, where each fails, and what this implies about whether the concept of "intentional action" is fundamentally descriptive or normative.**

  ---

  **MARKING SCHEME (25 marks total):**  
  *(Focus on argument quality, case application, and critical engagement)*

  **A-Grade (21-25 marks):**  
  - **Explicitly dismantles simplistic explanations (A & B)** using cases, showing *why* they are inadequate (not just "they're wrong").  
  - **Uses cases to reveal tensions:**  
    - *Playlist Rulebreaker:* Shows non-moral norm violations *also* get high "intentional" ratings (undermining A). Must note if asymmetry weakens vs. moral cases.  
    - *Passive Chairman:* Shows omission asymmetry mirrors Knobe effect, challenging views requiring "active" mental states. Explains why "knew and did it anyway" (B) fails here (he "did nothing").  
    - *Scheduling Algorithm:* Shows *no human agent/intention* still elicits "intentional harm" judgments for many. Obliterates explanations relying on attributing *agent* intentions (B) or *agent* blame (A).  
  - **Articulates a sophisticated account (e.g., C):** Explains how normativity (moral or conventional) shapes the *salience* of side effects, the *structure* of counterfactuals ("Would he have acted if NO harm?" vs. "Would he have acted if harm required EFFORT?"), or the *attribution of competence/luck*. Links this to the "broken-brain" counterfactual (Chairman *would* act w/o harm, yet harm is intentional).  
  - **Concludes insightfully:** Argues whether "intentional" is inherently normative or if normativity hijacks underlying descriptive mechanisms. Avoids simplistic "it's just normative/descriptive".  

  **B-Grade (16-20 marks):**  
  - Correctly identifies weaknesses of A & B using cases but with less depth/clarity.  
  - Applies cases but misses nuances (e.g., doesn't contrast Playlist asymmetry strength vs. moral Knobe; doesn't fully exploit Algorithm case).  
  - Endorses a version of (C) but with weaker justification or less connection to the counterfactual puzzle.  
  - Conclusion present but less incisive on normativity vs. description.  

  **C-Grade (10-15 marks):**  
  - **Superficial treatment:** Repeats that A/B are "incomplete" or "flawed" without rigorous case-based demolition.  
  - **Case application weak:** Mentions cases but doesn't show *how* they test explanations. May mispredict intuitions.  
  - **Falls back on simplistic narratives:** E.g., spends >50% on "It's just blameworthiness leaking" (A), scoring max 3/25 for that section. Or treats "knew and did it anyway" (B) as sufficient explanation.  
  - Conclusion absent or rehashes basic Knobe description.  

  **D/F (0-9 marks):**  
  - Misdescribes Knobe effect/cases.  
  - Ignores most case applications.  
  - Dominated by unsupported assertions or irrelevance.  

  ---

  **MODEL ANSWER (650 words):**  

  The Knobe Effect challenges the view that judgments of intentionality are purely descriptive assessments of an agent’s mental states. While explanations (A) "moral blame distorts description" and (B) "intentional = knew and did it anyway" capture surface features, they fail under pressure from novel cases. Explanation (C), focusing on how normativity shapes reason-attribution and counterfactual thinking, provides a more robust account, suggesting "intentional" has an inescapable normative dimension.

  **Why (A) "Blameworthy = Intentional" Fails:**  
  If moral blame simply overrides descriptive judgment, non-moral norm violations shouldn’t produce strong asymmetries. The *Playlist Rulebreaker* case tests this. Most people judge Maya intentionally broke the rule, despite its non-moral nature (it’s a bureaucratic hurdle, not a sin). This shows normativity, not just *moral* blame, drives the asymmetry. Blame might *accompany* the judgment, but it isn’t the sole mechanism. The asymmetry here might be weaker than in the environmental harm case, suggesting moral valence amplifies, but doesn’t create, the core effect.

  **Why (B) "Knew and Did It Anyway" Fails:**  
  This seems tautological; it restates the conditions present in *both* harm and help cases without explaining the asymmetry. Our cases expose deeper flaws.  
  1. *Passive Chairman (Harm):* He *lets* cancellation happen, boosting profits and harming the environment. People still judge the environmental harm intentional, even though he didn’t "do" anything active regarding the harm. "Did it anyway" is ill-defined for omissions. Crucially, they agree he *would have acted the same way (let cancellation happen) even if no harm occurred* – yet still call the harm intentional. This directly contradicts (B)’s implied necessity of the outcome being part of the reason to act.  
  2. *Scheduling Algorithm:* People readily say the AI "intentionally" made students miss the bus, despite knowing it has no intentions, goals, or awareness beyond its code. It literally *cannot* "know and do it anyway" in the folk-psychological sense. Judgments persist based on the *foreseen bad outcome* and the *programmers' indifference*, implicating normativity in *attributing* agential responsibility, not just describing mental states.

  **Why (C) Normativity Shapes Reason/Skill Attribution Succeeds:**  
  The cases support the view that the *badness* (normative valence) of a foreseen side effect changes how we conceptualize the agent’s relationship to it.  
  - *Bad outcomes* make the side effect *salient as a cost* the agent incurred. This invokes counterfactuals like: "Would they have *avoided* acting if avoiding the harm required *minimal effort*?" (Answer for Chairman: No, he wouldn't lift a finger). We interpret his *indifference* as rendering the harm a non-accidental aspect of his chosen course – hence "intentional". It becomes part of the *description of his action*, not just his motive.  
  - *Good outcomes* are treated as *lucky bonuses*. The agent gets no "credit" for competence; the help seems incidental.  
  - *Algorithm Case:* The bad outcome frames the programmers’ *foresight* and *indifference* as a form of agential disregard, making the harm seem "built into" the system they created. The norm violation (students stranded) structures the attribution.  
  - *Passive Chairman & Counterfactuals:* The key broken-brain counterfactual ("He'd act even without harm") doesn't exonerate because the harm's badness makes us see his *inaction* to prevent it (despite foresight) as constitutive of his choice. Preventing harm wasn't a relevant option *for him*.

  **Conclusion:**  
  The cases confirm that the asymmetry arises because normative valence (badness) transforms a foreseen side effect from a mere consequence into an *agential constituent* – an accepted element of "what the agent did" in pursuing their goal, regardless of their active desire for it. Simple moral distortion (A) or mental state reporting (B) cannot explain the persistence of the effect in non-moral (*Playlist*) or non-agential (*Algorithm*) cases, or the counterfactual puzzle. "Intentional action" judgments are fundamentally interpretive, not purely descriptive; normativity determines which foreseen consequences are deemed *relevant* parts of the agent’s deed, woven into the action’s very description. The concept is intrinsically normative.

  ---
  **Key Strengths of this Approach:**  
  1. **Forces Engagement:** Students can't just parrot the basic effect; they must use *your cases* to *test* theories.  
  2. **Targets Superficial Answers:** Explicitly making "blameworthiness" or "knew and did it anyway" a low-mark trap.  
  3. **Leverages Your Cases:**  
     - *Playlist:* Tests necessity of *moral* normativity.  
     - *Passive Chairman:* Tests necessity of *action* and explores counterfactuals/omissions.  
     - *Algorithm:* Tests necessity of *human agency/mental states*.  
  4. **Focuses on the Puzzle:** The counterfactual ("he'd do it anyway") and its incompatibility with simple explanations is central.  
  5. **No Citations Needed:** Relies purely on reasoning about cases and core concepts.  

  This question should make your study group squirm by revealing how deep the rabbit hole goes – and how their initial "simple" explanations crumble under scrutiny. Good luck!
