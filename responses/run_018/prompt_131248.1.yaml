answer: |-
  ### Core Commitments  
  **Friedman's Instrumentalism ("F-twist"):**  
  1.  **Epistemic Goal:** Predictive accuracy is the sole criterion for evaluating scientific models.  
  2.  **Assumptions as Tools:** Assumptions (e.g., perfect rationality) need not be descriptively realistic; they are "instruments" enabling tractable prediction.  
  3.  **Justification via Success:** A model’s success in prediction retroactively justifies its assumptions, regardless of their falsity.  
  4.  **"As If" Rationalization:** Agents behave *as if* assumptions held true, making descriptive realism irrelevant.  

  **Counterfactual-Anchor Account:**  
  1.  **Epistemic Goal:** Revealing *modal structure*—identifying robust dependencies invariant under perturbations.  
  2.  **Assumptions as Anchors:** Unrealistic premises (e.g., frictionless planes) serve as fixed points to isolate causal relationships by suppressing confounding variables.  
  3.  **Justification via Robustness:** Idealizations enable exploration of counterfactual scenarios ("what if X varied?"), distinguishing essential mechanisms from contingent details.  
  4.  **Explanatory Priority:** Models explain by exhibiting how changes *would* affect outcomes under controlled distortions.  

  ---

  ### Comparison  
  **1. Explaining Explanatory Success**  
  - **F-twist:** A perfectly rational agent model’s explanatory power derives *entirely* from predictive success. If the model predicts price equilibria accurately, it "explains" by showing markets operate *as if* agents were perfectly rational—even if they aren’t. Explanation reduces to reliable prediction.  
  - **Counterfactual-Anchor:** Explanatory success arises from revealing *invariant dependencies*. Fixing rationality "anchors" the model, allowing economists to test how perturbations (e.g., demand shocks) affect equilibrium *independently* of psychological realism. The model explains by demonstrating robustness: equilibrium emerges not *because* agents are rational, but because competition imposes *rational-like* discipline under specified constraints.  

  **2. Absorbing Instrumentalism Without Collapse**  
  The counterfactual-anchor view can absorb predictive success as a *necessary but insufficient* criterion. For Friedman, predictive accuracy exhausts a model’s value. The counterfactual-anchor account demands more: predictive success must stem from capturing *robust mechanisms* validated through modal exploration.  
  - **Absorption:** Both views agree unrealistic assumptions aid prediction.  
  - **Non-Collapse:** Instrumentalism cannot accommodate the anchor view’s core tenet: idealizations are *investigative tools* for discovering modal truths (e.g., "competition drives efficiency across diverse agent behaviors"). If a model predicts accurately but fails under counterfactual tests (e.g., equilibrium vanishes if rationality varies slightly), instrumentalism still accepts it; the counterfactual-anchor rejects it as unexplanatory. Removing modal validation collapses the latter into instrumentalism.  

  **3. Descriptive Stripping vs. Prescriptive Locking**  
  - **Descriptive Stripping (DS):** Omitting real but secondary features (e.g., ignoring minor transaction costs).  
  - **Prescriptive Locking (PL):** Artificially fixing a variable (e.g., rationality) that *does* vary in reality, to block its interaction with other parameters.  
    - **F-twist’s Treatment:** Friedman treats DS and PL identically: both are permissible if they enhance prediction. Evaluating an idealization independently of prediction is incoherent; e.g., perfect rationality is validated *only* by market-prediction success.  
    - **Counterfactual-Anchor’s Treatment:**  
      - **DS** simplifies but carries no modal weight; removing transaction costs clarifies core dynamics but doesn’t structure inquiry.  
      - **PL** is epistemically active: locking rationality *creates* a controlled environment to probe how supply/demand interactions generate equilibrium *regardless* of cognitive limits. This idealization *can* be evaluated independently: does locking rationality isolate genuine dependencies (e.g., competition → efficiency) or introduce artifacts? Validation requires showing robustness across *other* perturbations (e.g., varying information asymmetry).  

  ---

  ### Conclusion: Central Philosophical Work  
  The **modal dimension**—specifically, the capacity to evaluate how models behave under counterfactual scenarios—does the central philosophical work. It distinguishes the counterfactual-anchor account (which seeks explanatory insight into real dependencies) from Friedman’s instrumentalism (which seeks empirical adequacy).  
  - **If Removed:** The counterfactual-anchor collapses into instrumentalism, conceding that predictive success alone justifies idealizations. Explanatory power would reduce to prediction, and idealizations like prescriptive locking could not be assessed for their role in revealing robust mechanisms. The distinction between uncovering invariance and merely predicting outcomes dissolves, impoverishing the philosophy of modeling.
