  The user specified three points. First, explaining the success of models with false assumptions beyond prediction, like explanatory power. For Friedman, a perfectly rational agent model works because agents act as if they're rational, leading to accurate predictions. The counterfactual view would say that fixing rationality anchors the model, allowing us to test how changes in other variables affect outcomes. So the success comes from revealing robust mechanisms.

  Second, whether counterfactual-anchor can absorb Friedman without collapsing. The anchor view includes predictive success but adds modal exploration. It's not just about predicting; it's about understanding dependencies. If we remove the modal aspect, it might collapse into instrumentalism. But as long as the focus is on what's invariant under perturbations, it stays distinct.

  Third, descriptive stripping vs. prescriptive locking. Descriptive stripping removes details for simplicity, which Friedman might see as useful for prediction. Prescriptive locking sets a fixed parameter to isolate variables, which the counterfactual view uses to explore counterfactuals. For example, locking rationality allows seeing how supply changes affect equilibrium. Friedman would evaluate the idealization based on prediction, but the counterfactual view can assess it independently by its role in structuring the model.

  The user is likely a philosopher or economist interested in methodology. They might need this for academic work, perhaps to clarify theories in their research. Deep needs could include understanding how models explain, not just predict, and how to justify idealizations beyond instrumentalism. The distinction between descriptive and prescriptive idealizations is key here.

