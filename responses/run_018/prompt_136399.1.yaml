answer: |-
  Alright, let's break down the spec sheet for a theory of rational deference to objective chance. This is the core "what it *must* do" list, based on your cases and distinctions.

  **Core Desiderata: The Non-Negotiables**

  1.  **Basic Alignment (The Anchor):** Upon learning *only* that the objective chance of event E is *x* (and nothing else that screens this off), a rational agent's credence in E *must* become *x*. *Motivation:* Without this, it's not deference to chance at all. (Covers Case 1)
  2.  **Normative Force:** The theory must explain *why* deference is rationally required. It can't just be a description; it needs normative bite. *Motivation:* Otherwise, it's just a suggestion, not a principle of rationality.
  3.  **Handle Undermining (Humphreys' Challenge):** The theory must resolve or explain the tension that arises when learning the chance value itself logically entails something about the agent's own evidence or future credences, potentially undermining the direct application of the PP. It must provide rational guidance in such scenarios. *Motivation:* This is the acid test showing if the theory isn't just a simple lookup table. (Covers Case 2)
  4.  **Distinguish Value from Mechanism:** The theory must conceptually and practically differentiate between deferring to a *specific chance value* (e.g., "the chance is 0.7") and deferring to a *chance-generating mechanism* (e.g., "this scientist/lab/process is generally reliable"). *Motivation:* Deference can break down differently when you distrust the mechanism reporting the value vs. accepting the value but distrusting its direct applicability. (Crucial for Case 3)
  5.  **Distinguish Indeterminacy from Indexical Ignorance:** The theory must provide resources to tell the difference between situations where the outcome is genuinely physically open (indeterminism) and situations where the outcome is fixed but the agent doesn't know which fixed outcome applies to *them* (indexical ignorance). *Motivation:* Direct PP-style deference only seems rationally mandated in the first case. Collapsing this leads to paradoxes like the Copy Room. (Core to handling Case 4)
  6.  **Handle Partial/Mistrusted Mechanisms (Mediated Deference):** The theory must prescribe rational credences when deferring to a mechanism (scientist, device, process) that reports a chance value, but where the agent has some credence that the mechanism malfunctioned, was misapplied, or is unreliable *in this specific instance*. *Motivation:* This is how we *actually* use chance info in the real world. (Covers Case 3)

  **Critical Distinctions That Must Survive**

  *   **Value vs. Mechanism Deference:** (As above, Desideratum 4)
  *   **Physical Indeterminacy vs. Indexical Ignorance:** (As above, Desideratum 5)
  *   **Having Weight vs. Having Quantifiable Weight:** The theory must acknowledge that *some* factors (like expertise, vague reliability) can rationally influence credence *without* necessarily providing a precise, calculable weighting factor akin to a known chance value. *Motivation:* We often rationally adjust beliefs based on fuzzy trust without precise numbers; confusing this with quantifiable chance deference is a mistake.

  **Camp-Specific Preferences (Not Universal Desiderata)**

  *   **Preserve Determinism:** Whether the theory *must* be compatible with a fundamentally deterministic universe is a metaphysical preference, not a core requirement of rational deference *itself*. Some camps demand it; others see objective chance as requiring genuine indeterminism.
  *   **Allow Belief-Dependent Chances:** Whether chances can be directly influenced by an agent's *beliefs* (or actions based on them) is highly contentious. Some views (e.g., some CDT interpretations) require it; most chance-based views see it as deeply problematic for undermining the objectivity of chance.
  *   **Empirical Equivalence to Textbook QM:** While desirable for scientific realism, strict adherence to textbook QM's statistical predictions in the infinite limit is a *scientific* desideratum, not strictly a *rational deference* one. A theory of deference must work *given* whatever chances physics delivers, even if they differ from QM.

  **The Copy Room Twist (Case 4) - What the Theory Must Deliver**
  The theory must provide a *principled* answer about whether direct PP deference (credence = 0.5) is rational for the agent looking at their display, *without* the answer boiling down to "it depends on which room you're in (self-location)." The answer *must* hinge on the distinction between:
  *   Room A: Genuine physical indeterminism at the time of the flip.
  *   Room B: Deterministic process (copying) after the fact.
  The theory must leverage Desideratum 5 (Indeterminacy vs. Ignorance) to explain why PP applies directly *only* in Room A at the relevant time, and why in Room B, the agent's uncertainty is purely indexical/about a fixed fact, demanding a different rational approach (e.g., 0.5 credence only if genuinely uncertain *which room they are in*, but *not* because the display in their room has an *objective chance* of 0.5 at that moment).

  **Potential Conflicts (The Tension Points)**

  1.  **Basic Alignment vs. Resolving Undermining Cleanly:** Satisfying Basic Alignment in simple cases while providing a non-ad-hoc, universally accepted resolution to Humphreys' paradox is incredibly difficult. Orthodox PP sacrifices alignment in undermining cases; revisionist views often complicate the basic case.
  2.  **Value/Mechanism Distinction vs. Unified Theory:** A theory that cleanly separates deferring to a value from deferring to a mechanism might struggle to give a single, elegant account of rational deference encompassing both.
  3.  **Distinguishing Indeterminacy/Ignorance vs. Copy Room without Self-Location:** Making the distinction *do the work* for the Copy Room without *any* reference to self-location is challenging. The distinction *implies* different rational treatments in different locations, but applying it requires knowing *which type of situation you're in*, which *feels* like self-location. This is a tightrope walk.

  **Quick & Dirty Scoring**

  *   **Orthodox PP (Lewis-style, with admissible info):**
      *   **👍:** Nails Basic Alignment (1), Clear Normative Story (2), Strong Value/Mechanism distinction (4), Clear on Indeterminacy (5).
      *   **👎:** Chokes hard on Undermining (3) - needs admissibility gymnastics. Copy Room (4)? Strictly applied says "0.5 credence always" which feels wrong for Room B. Struggles with Partial Trust (6) - admissibility isn't designed for it. Forces rejection of Determinism/Belief-Dependence.
  *   **Revisionist "Halfway" (e.g., Chance-Credence Principle, some CDT views):**
      *   **👍:** Can handle Undermining (3) better by making chance relative. *Might* handle Partial Trust (6) by folding it into mechanism assessment. *Can* allow Belief-Dependence and Determinism.
      *   **👎:** Risks weakening Basic Alignment (1) - deference becomes more complex/contextual. Normative Force (2) can feel weaker ("it's *a* constraint" vs "*the* constraint"). Blurs Value/Mechanism (4). Blurs Indeterminacy/Ignorance (5) - Copy Room (4) becomes very messy ("what's *my* chance?"). May lose empirical equivalence.
  *   **Flat Rejection of Objective Chance (e.g., Strict Subjectivism, Frequentism-as-description-only):**
      *   **👍:** Avoids Undermining (3) entirely. No issue with Determinism/Belief-Dependence. Simpler ontology.
      *   **👎:** **Fails catastrophically** on Basic Alignment (1) and Normative Force (2). Offers no principled deference. Struggles to explain why scientific chances *feel* compelling. Collapses or ignores distinctions (4, 5, 6). Copy Room (4) answer is purely subjective/arbitrary. Essentially fails the core mandate.

  **The Bottom Line Spec:** Any viable theory *must* anchor credence to known chances (1), explain why this is rational (2), navigate the self-referential hell of undermining (3), tell us how to handle imperfect sources (6), and rigorously separate deferring to numbers from deferring to sources (4) and physical openness from not knowing fixed facts (5). The Copy Room (4) is the litmus test for 5. Conflicts lurk between 1 & 3, and making 5 do the work for 4 without self-location is precarious. Camp preferences (determinism, belief-dependence, QM fidelity) shape the *how*, not the core *what* of rational deference.
