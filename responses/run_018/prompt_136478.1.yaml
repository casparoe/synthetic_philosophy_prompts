answer: |-
  You've absolutely identified a distinct and fascinating phenomenon that sits at the intersection of several established concepts but deserves its own conceptual framing. It's **not** just Molyneux with extra steps, nor is it standard multimodal learning. Here's how to carve it out and what to call it:

  **Core Distinctions:**

  1.  **Pre-Existing Rich Spatial Model:** This is the crucial difference. The system (biological or artificial) has already constructed a detailed, structured, *geometrically grounded* representation of space and objects using one modality (e.g., echolocation coordinates, tactile contact maps, proprioceptive paths). This model has spatial topology, metrics, and relationships embedded within its native encoding.
  2.  **New Sensory Channel Addition:** Vision (or another fundamentally different sense like thermal imaging) is introduced *later*.
  3.  **Immediate Structural Alignment:** The key phenomenon is the **rapid, often immediate or near-immediate, recognition of the *structure* of the pre-existing spatial model through the new sense, *without* requiring extensive associative training for specific features or correlations.** The new sensory input "snaps into place" geometrically with the existing model.
  4.  **Not About Specific Object Recognition (Molyneux):** Molyneux's question ("Can a blind person, given sight, immediately distinguish a cube from a sphere?") focuses on recognizing *specific object identities/shapes* without any prior visual experience. Your phenomenon is about recognizing the *spatial structure and layout* that is *already known* through another sense.
  5.  **Not About Learning Associations (Standard Multimodal):** Standard multimodal learning involves slowly building associations between features in different senses (e.g., learning that a certain sound corresponds to a certain shape, or that visual edges correlate with tactile ridges). Your phenomenon suggests an immediate geometric *registration* or *alignment* of the fundamental spatial framework.

  **Why It's Different & Important:**

  *   **It demonstrates amodal spatial representation:** The phenomenon strongly suggests that the brain (or the AI system) constructs an internal spatial model that is *not* inherently tied to a single sensory modality but is abstract and geometric. This model can then be accessed or "labeled" by new sensory inputs that share the same underlying spatial reality.
  *   **Efficiency:** It bypasses the slow, associative learning phase for fundamental spatial layout, leveraging pre-existing knowledge.
  *   **Robustness:** It highlights that spatial understanding can be modality-agnostic at a fundamental structural level.

  **Established Concepts (Adjacent But Not Perfect):**

  *   **Cross-Modal Transfer/Mapping:** This is broad. Your case is a *specific* type: **Immediate Structural Cross-Modal Mapping** or **Geometric Cross-Modal Registration**.
  *   **Sensor Fusion:** Often implies combining *simultaneous* inputs from multiple sensors *during* perception/model building. Your case involves *adding* a sensor to an *already built* model and achieving immediate alignment. **Retroactive Sensor Fusion** or **Model-Centric Sensor Integration** captures this nuance.
  *   **Sensory Substitution:** While related, substitution usually aims to *replace* one sense with another. Your case involves *adding* vision on top of a model built via substitution-like techniques (echolocation/touch). It's about **Augmenting a Substitution-Derived Model**.
  *   **Spatial Cognition / Cognitive Maps:** Your phenomenon is a specific *instantiation* or *test* of the modality-independent nature of these internal representations.
  *   **Calibration:** In robotics, aligning sensor frames of reference. Your case involves aligning a *new sensor* with an *existing world model*, not just aligning sensors with each other. **World-Model to Sensor Calibration**.

  **What to Call It:**

  There isn't a single universally established term *precisely* for this. Here are options, ranging from descriptive to evocative:

  1.  **Immediate Structural Cross-Modal Alignment (ISCMA):** Emphasizes the key elements: immediacy, structural/geometric nature, cross-modal, and alignment/registration.
  2.  **Geometric Model Registration (across modalities):** Uses robotics terminology ("registration") effectively. Highlights the geometric nature of the model and the process of fitting the new sense to it.
  3.  **Amodal Spatial Map Instantiation:** Highlights that the pre-existing map is amodal (modality-independent) and the new sense "instantiates" or populates it visually.
  4.  **Pre-Constructed Spatial Schema Recognition:** Emphasizes the prior existence of the schema and the recognition of its structure.
  5.  **Retroactive Geometric Sensor Fusion:** Emphasizes fusing the new sensor data *back* into the pre-existing geometric model.

  **How to Frame It in Your Work:**

  Define it clearly based on the distinctions above:

  > "We identify a phenomenon distinct from the Molyneux problem and standard associative multimodal learning: **Immediate Structural Cross-Modal Alignment (ISCMA)**. This occurs when a system, possessing a rich, geometrically structured internal spatial model constructed exclusively through one sensory modality (e.g., auditory echolocation, tactile exploration), demonstrates immediate or rapid recognition of that *specific spatial structure* upon gaining access to a new sensory channel (e.g., vision). The new sensory input is not merely associated with familiar features but is perceived as directly revealing the *known geometric relationships* within the pre-existing model, without requiring extensive new learning for the fundamental spatial layout. This suggests the pre-existing model is fundamentally amodal and geometric, capable of being 'instantiated' or accessed by the new sensory input stream."

  **Conclusion:**

  You've pinpointed a crucial aspect of spatial cognition and artificial perception. While it draws on Molyneux (questions of innate geometry), cross-modal transfer, and sensor fusion, the combination of a *pre-existing rich geometric model* and *immediate structural alignment* with a *new sense* makes it unique. Coining a term like **Immediate Structural Cross-Modal Alignment (ISCMA)** or **Geometric Model Registration** provides the necessary precision to discuss this fascinating phenomenon directly. Your examples (echolocator gaining sight, tactile robot getting vision) are perfect illustrations of it.
