answer: |-
  Your analysis cuts to the heart of a profound tension in Darwin's thought and its modern reception. The asymmetry you identify is neither accidental nor fully justified by Darwin’s text alone—it arises from ambiguities in *Descent of Man* and deeper philosophical commitments in contemporary discourse. Let's dissect the disanalogies, Darwin's implicit assumptions, and the modern disciplinary biases:

  ### 1. **Darwin’s Disanalogies: Rational Revision vs. Fixed Superstition**
     - **Moral Sentiment as Progressively Reflective**:  
       Darwin explicitly frames morality as *not merely* an instinct but a capacity refined by "the enduring and ever-present nature of the social instincts" combined with "active intellectual powers" (*Descent*, Ch. IV). Crucially, he argues that humans can *critically evaluate* tribal norms against broader ideals ("the standard of morality" rises through "the approbation of our fellow-men" and "reason"). This introduces a rational escape hatch: moral progress involves extending sympathy beyond the tribe via reflection on "the general good."
       - *Example*: Darwin praises the abolition of slavery as moral progress, implying a rational standard beyond tribal approval.
     
     - **Religious Belief as Cognition Gone Awry**:  
       In contrast, Darwin treats religion as rooted in cognitive errors (misattributing agency to storms, etc.) and "child-like" credulity reinforced by group cohesion. Unlike morality, he offers *no mechanism for rational refinement* of religious belief itself. Supernatural concepts persist through "strong mental impressions in childhood" and tribal conformity—not through critical comparison to abstract ideals.

     **Key Break**: **Moral reasoning, for Darwin, inherently contains a self-correcting mechanism (rational comparison); religion lacks this.** Moral instincts become "higher" through reason; religious instincts remain fixated on primal errors.

  ### 2. **The Modern Asymmetry: Three Philosophical Defenses (and Their Problems)**
     Modern ethicists resist debunking morality by appealing to:
     - **The Truth-Tracking Argument**:  
       Cooperative norms (e.g., reciprocity, empathy) track *real practical demands* of social existence. Natural selection favors true beliefs about social cooperation (e.g., "betrayal damages trust" is objectively adaptive *and* true). Religion, however, involves claims (e.g., "gods control weather") that are empirically false.  
       *Problem*: This assumes evolution selects for *truth*, not just adaptive illusions. Darwin himself notes morality can be "mistaken" (e.g., tribal xenophobia), undermining strict truth-tracking.

     - **The Deliberative Refuge Argument**:  
       Moral realism survives because rational deliberation (e.g., Rawlsian reflection) can transcend evolutionary biases. Religious beliefs, lacking this capacity, remain "stuck" in their adaptive origins.  
       *Problem*: Darwinian debunkers (e.g., Sharon Street) argue *all* reasoning is evolutionarily contaminated. If religion is debunked for its origins, why is moral reasoning exempt?

     - **The Conceptual Space Argument**:  
       Moral facts (e.g., "suffering is bad") could exist as abstract properties grounded in natural phenomena (e.g., sentience). God’s existence, as a supernatural claim, lacks analogous grounding.  
       *Problem*: Darwin’s account treats *both* as natural phenomena—neither requires supernatural referents. This defense shifts the goalposts.

  ### 3. **Darwin’s Hidden Normativity: The "Smuggled Objectivity"**
     Darwin’s moral account subtly imports objectivity through:
     - **Teleological Language**: He speaks of "advancement" in morality (e.g., expanding sympathy) as objectively desirable, implying a standard *beyond* survival value.  
     - **Appeal to "Civilized" Virtues**: He contrasts "savages" with "civilized men," valorizing universal benevolence—a bias reflecting Victorian Eurocentrism, not neutral evolution.  
     - **The Role of Reason**: By casting reason as refining morality toward the "general good," Darwin implicitly treats *reason itself* as an authority beyond instinct. Yet he never explains how reason escapes evolutionary constraints.  

     **Crucially**: Darwin’s framework for religion lacks all these elements. He offers no "progress" in theology—only factual errors sustained by psychology.

  ### 4. **Disciplinary Protectionism: A Modern Asymmetry**
     The uneven treatment reflects entrenched philosophical divides:
     - **Ethics**: Moral realists (e.g., Parfit, Boyd) accommodate evolution by redefining realism (e.g., "naturalized moral facts"). Anti-realists (e.g., Joyce) debunk, but realists dominate mainstream discourse.  
     - **Philosophy of Religion**: Theists often reject evolutionary psychology of religion as reductionist (e.g., Plantinga’s "evolutionary argument against naturalism"). Atheists wield it as a debunker.  
     - **The Unspoken Bias**: Morality is seen as indispensable for secular society; religion is not. Ethicists preserve objectivity to avoid nihilism; philosophers of religion lack this incentive.

  ### Conclusion: A Consistent Darwinian Should Debunk Both—or Neither
     - **Darwin’s Actual Text** suggests a disanalogy (via rational revision), but it’s fragile. His moral "progress" relies on unexamined normative commitments. If we apply his genealogy consistently:
       - Both morality and religion are shaped by adaptive pressures.  
       - Both involve non-truth-tracked cognitive mechanisms (agency detection vs. tribalism).  
       - Neither inherently accesses "higher truths" outside evolution.  
     - **For Your Essay**: Argue that Darwin’s account *does* secretly smuggle objectivity into morality through his praise for rational critique—a move unavailable to religion. The modern asymmetry is less about Darwin and more about philosophy’s reluctance to confront moral nihilism. Embrace the tension: Darwin’s genius lies in exposing how *all* human values, including his own, are products of a blind process—yet we cannot help but judge them by lights evolution never intended.  
     - **Provocative Implication**: Perhaps ethical objectivity isn’t *descriptive* but *aspirational*—a fiction necessary to sustain the very social instincts Darwin describes. Religion, in this view, was morality’s first draft, later outgrown by reason. But if reason is also evolved, can it truly transcend its origins?

  **Further Reading**:  
  - Joyce, *The Evolution of Morality* (debunking view)  
  - Kitcher, *The Ethical Project* (pragmatic naturalism)  
  - De Cruz, *Religious Disagreement* (evolutionary psychology of religion)  
  - Richards, *Darwin and the Emergence of Evolutionary Theories of Mind and Behavior* (historical context)

  Your essay has the potential to reveal Darwin not just as a biologist, but as an unwitting architect of modernity’s deepest value schism—where morality escapes the abyss we readily push religion into. The unresolved question is whether that escape is legitimate, or an act of intellectual self-preservation.
