  Okay, the user is diving deep into a persistent debate in the philosophy of physics—the Rietdijk-Putnam argument and the block universe concept. They're frustrated with the stalemate between defenders of the block view and presentists/possibilists, despite both sides agreeing on the physics (Lorentz transformations). They suspect the core conflict isn't about physics but about metaphysics—specifically, how "existence" applies to spacetime points and whether Lorentz-covariant presentism is coherent. They also wonder if the two sides are talking past each other: one asking about ontology (what the world is like) and the other about semantics (how tense works in descriptions).  

