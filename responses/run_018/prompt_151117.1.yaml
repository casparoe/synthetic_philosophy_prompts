  First, the block universe side (eternalists) claims: (1) relativity shows no privileged "now," so all events are equally real; (2) "existence" must be frame-independent; (3) becoming is illusory or just a local psychological phenomenon. They see spacetime as a static 4D manifold.  

  The presentist/possibilist side counters: (1) relativity only shows simultaneity is conventional, not that the future/past are equally real; (2) "existence" can be dynamic (only the present exists) without contradicting physics; (3) temporal becoming is fundamental and can be reconciled with relativity via local or hyperplane-dependent presentism.  

  Where’s the disconnect? It’s not verbal—both sides mean "existence" in a robust ontological sense. It’s also not empirical; both accept Lorentz invariance. The core clash is *substantive metaphysical disagreement*:  

  - **Ontology of existence:** Is "exists" a monadic property (presentism) or a relational one tied to spacetime points (eternalism)?  
  - **Structure of time:** Is temporal becoming fundamental (like flow) or emergent (like entropy gradients)?  
  - **Scope of physics:** Does physics *exhaust* temporal ontology, or does metaphysics add something irreducible?  

  They’re *not* talking past each other—both are answering "what exists?" but with irreconcilable starting assumptions. The block view prioritizes invariant structure (spacetime intervals), while presentists prioritize phenomenology (becoming).  

  For progress, I’d suggest:  
  1. **Clarify Lorentz-covariant presentism:** Can it be formalized without privileging a frame? If not, it collapses into eternalism.  
