  ### In-Class Activity Design: Discovering Mixed-Strategy Dominance

  #### 1. Game Matrix and Verification  
  **Matrix** (Row = Player 1, Column = Player 2):  
  ```
        X     Y     Z
  A   4,1   0,6   3,0  
  B   0,6   4,1   3,0  
  C   1,1   1,1   0,0  
  ```  
  **Verification**:  
  - **(a) C not strictly dominated by pure strategies**:  
    - C vs. A: C loses to A against X (1 < 4) but beats A against Y (1 > 0).  
    - C vs. B: C loses to B against Y (1 < 4) but beats B against X (1 > 0).  
    → No pure strategy dominates C.  
  - **(b) Mixed strategy dominating C**:  
    - Mixture: 50% A, 50% B.  
    - Against X: \(0.5 \times 4 + 0.5 \times 0 = 2 > 1\)  
    - Against Y: \(0.5 \times 0 + 0.5 \times 4 = 2 > 1\)  
    - Against Z: \(0.5 \times 3 + 0.5 \times 3 = 3 > 0\)  
    → Strictly dominates C.  
  - **(c) Further elimination after removing C**:  
    - Reduced matrix (C removed):  
      ```
          X     Y     Z
      A  4,1   0,6   3,0  
      B  0,6   4,1   3,0  
      ```  
    - **Z is strictly dominated by X for Column**:  
      - Against A: \(1 > 0\)  
      - Against B: \(6 > 0\)  
    → Eliminate Z. Surviving set: {A, B} for Row, {X, Y} for Column.  

  #### 2. Activity Rules and Timeline (75 min)  
  **Materials**: Printed matrix handouts, recording sheets, random pairing app (e.g., Zoom breakout rooms or slips of paper).  
  **Payoff Scheme**: Points per round (converted to candy/extra credit: 10 points = 1 candy or 0.1% extra credit).  
  **Pairing**: Randomly pair 12 Row and 12 Column players each round; switch partners after each round.  
  **Roles**: First 5 rounds: Half the class is Row, half is Column. Switch roles for the next 5 rounds.  

  - **0:00–0:10 (10 min): Warm-up**  
    - **Matrix**:  
      ```
          L     M     R
      T  3,2   4,3   2,1  
      M  1,1   5,0   3,2  
      B  2,0   3,1   1,3  
      ```  
    - **Task**: "Use iterated elimination of strictly dominated pure strategies. What survives?"  
    - **Goal**: B is strictly dominated by T (T > B: 3>2, 4>3, 2>1). Practice elimination without spoiling the main lesson.  

  - **0:10–0:15 (5 min): Introduce Main Game**  
    - Show main matrix. Ask: "Can you eliminate anything using pure dominance? Why/why not?" Confirm nothing is eliminable.  

  - **0:15–0:35 (20 min): Rounds 1–5**  
    - Each round (4 min/round):  
      1. Players choose A/B/C (Row) or X/Y/Z (Column) secretly.  
      2. Randomly pair players; reveal choices.  
      3. Record payoffs.  
    - **Premature poll after Round 3 (0:27)**: "Raise your hand if you played C and got >0 points. Who thinks C is viable?"  

  - **0:35–0:40 (5 min): Switch Roles**  
    - Row players become Column players, and vice versa.  

  - **0:40–1:00 (20 min): Rounds 6–10**  
    - Repeat procedure with switched roles.  

  - **1:00–1:15 (15 min): Debrief**  

  #### 3. Debrief Plan  
  - **Map observations to theory**:  
    - **Data review**: "How often was C played? What payoffs did it yield?" (Likely: C rarely played after initial rounds; low/zero payoffs.)  
    - **Contrast warm-up**: "In the warm-up, we eliminated actions with pure dominance. Here, nothing was eliminable, yet C failed. Why?"  
    - **Define rationalizability**: "An action is ‘rationalizable’ only if it’s a best response to some belief about the opponent."  
  - **Guide discovery of mixed dominance**:  
    - **Scaffolding Q1**: "Suppose Row thinks Column plays X (prob *p*), Y (prob *q*), Z (prob *1−p−q*). What is C’s expected payoff?"  
      → \(1p + 1q + 0(1−p−q) = p + q\).  
    - **Q2**: "What about A’s payoff? B’s?"  
      → A: \(4p + 0q + 3(1−p−q) = p − 3q + 3\)  
      → B: \(0p + 4q + 3(1−p−q) = −3p + q + 3\)  
    - **Q3**: "Can C ever be a best response? (Hint: When is \(p + q \geq p - 3q + 3\) and \(p + q \geq -3p + q + 3\)?)"  
      → Simplifies to \(q \geq 3/4\) and \(p \geq 3/4\) → \(p + q \geq 1.5\) (impossible).  
    - **Reveal mixture**: Show 50-50 mix of A/B beats C in all cases.  
  - **Post-elimination**: "After removing C, why did Z disappear?" → Strictly dominated by X (and Y).  

  #### 4. Predictable Failure Modes and Handling  
  - **Students play C out of curiosity/spite**:  
    - *Handling*: Allow early rounds for exploration. Use payoff data to show C’s inferiority empirically.  
  - **Mixture arithmetic errors**:  
    - *Handling*: Scaffold calculations step-by-step; use a visual payoff table.  
  - **Premature poll backfires** (e.g., C wins once due to fluke):  
    - *Handling*: Focus on long-run trends ("Did C *consistently* win?"). Ask Column players: "Did you exploit C when you saw it?"  
  - **Time shortage**:  
    - *Handling*: Skip Rounds 8–10; use hypothetical data ("If C was played, what would happen?").  

  #### 5. Optional Extension: Weak-Dominance Order-Dependence (10 min)  
  **Matrix**:  
  ```
       L     R
  T  1,1   0,0  
  B  0,0   0,0  
  ```  
  **Verification**:  
  - **Order 1 (eliminate B first)**: T weakly dominates B (T ≥ B everywhere; strict at L). Surviving: (T,L), (T,R). Then R weakly dominated by L? Against T: 0 < 1 → eliminate R. Final: (T,L).  
  - **Order 2 (eliminate R first)**: R weakly dominated by L? Against T: 0 < 1; against B: 0 = 0 → eliminate R. Surviving: (T,L), (B,L). Then B weakly dominated by T? Against L: 1 > 0 → eliminate B. Final: (T,L).  
    → **Different result**: Order 1 leaves only (T,L); Order 2 leaves (T,L) but via a different path.  

  #### 6. What the Activity Cannot Reproduce  
  The activity demonstrates *behavioral* avoidance of C and constructs one example of mixed dominance, but it lacks the **common knowledge of rationality (CKR)** underpinning iterated elimination. Students see C lose empirically in 10 rounds but not the *proof* that it *never* wins under CKR. Rationalizability (actions surviving iterated elimination of never-best-responses) relies on infinite recursion of beliefs ("I know you’re rational, you know I’m rational..."), which the activity simplifies to observed play. The lecture must:  
  - Formalize CKR and its role in rationalizability.  
  - Prove the equivalence: "strictly dominated by mixed strategy" ⇔ "never a best response to any belief".  
  - Contrast with weak dominance (order-dependence highlighted in the extension).  
  - Generalize beyond 2-player games.  

