answer: |-
  You're mistaking tactical necessity for strategic containment. Disabling *specific* assets actively shelling civilians (like armor columns moving on Benghazi) fits 1973's mandate. But NATO systematically cratered command bunkers in Tripoli, cut fiber optics to regime leadership compounds, and bombed Gaddafi's Bab al-Aziziya compound – targets with no direct link to *imminent* threats against civilians. When you decapitate the entire command-and-control structure of a state, you aren't just protecting civilians from a massacre *today*; you're deliberately destroying the government's capacity to govern *tomorrow*. Resolution 1973 explicitly ruled out "a foreign occupation force," precisely because the Council feared this slide. Protecting civilians structurally *from* a regime logically requires dismantling that regime – which transforms a neutral protective mission into a partisan war aim the Security Council never authorized. Air power alone can't surgically separate protection from regime destruction when the threat *is* the regime itself.
