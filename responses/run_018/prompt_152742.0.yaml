prompt: |-
  You are an expert in decision theory and value-alignment philosophy, with deep familiarity with rationalist frameworks for preference aggregation and the formal problems that arise when an agent's values are extrapolated across epistemic conditions. Before I assess any specific formalization, I want the full specification built from first principles, so think carefully and begin with a brief brainstorming of the core tensions.

  Write the desiderata for an adequate theory of coherent extrapolated volition—specifically one that must extrapolate an agent's preferences across counterfactual epistemic states and resolve conflicts between what I will call modal preference clusters (divergent preference structures an agent holds in different possible worlds or under different information sets, not due to value drift but due to structural differences in belief and framing). For each requirement, provide the motivating case or conceptual consideration behind it, and flag any pair you suspect is jointly unsatisfiable.

  Your list should cover:

  - The cases it must get right: how it treats an agent whose revealed preferences in world W conflict with endorsed preferences in world W' when the divergence stems from information rather than taste change; what it does with preferences that depend on false beliefs the agent would correct upon reflection; and how it handles aggregation when value dimensions are incommensurable rather than merely weighted differently.

  - The distinctions it must preserve and not collapse: between revealed preference, counterfactual endorsement, and all-things-considered volition; between preference change due to learning and change due to manipulation or framing effects; and between the absence of a preference and a preference for indifference.

  - The puzzles it must dissolve or explain: preference reversal under reflection (where the agent, upon seeing her own extrapolated profile, rejects it); the problem of forcing a single utility representation over genuinely plural values; and the boundary question of when the theory should return "no coherent volition exists" rather than manufacturing aggregation.

  - The consistency conditions: which standard rational-choice axioms must be satisfied in the extrapolated profile, which may need reinterpretation (e.g., completeness over modal clusters), and whether transitivity must hold across worlds or only within them.

  - The negotiability of each: mark which are non-negotiable for any theory worthy of the name, and which are camp-specific preferences (e.g., uniqueness of the extrapolated point, determinism of the aggregation procedure, or preservation of every first-order intuition).

  Then, briefly and without bibliographic citation—this must work for an offline reader—score how the standard CEV framing, a reflective-equilibrium model of idealization, and a direct preference-utilitarian aggregation approach fare against your list. Identify the single requirement that does the most work in excluding candidates, and note whether your flagged joint-unsatisfiability pairs actually knock out any of the three.

  Keep the weight on the criteria and their motivating cases; the scoring should be concise. Do not provide a reading list or ask me to look up specific texts.
reasoning: |-
  We are building a desiderata list for a theory of Coherent Extrapolated Volition (CEV) that handles extrapolation across epistemic states and resolves conflicts between "modal preference clusters" (divergent preferences under different beliefs/framing, without value drift). The focus is on counterfactual epistemic states and structural differences.

  **Core Tensions Brainstorming:**
  1. **Epistemic vs. Doxastic Dependence:** Preferences depend on what one knows (epistemic state) and what one believes (which may be false). The theory must correct for false beliefs but respect that some preferences are inherently tied to epistemic limitations (e.g., suspense in games).
  2. **Aggregation Across Worlds:** How to aggregate preferences that are defined in mutually exclusive epistemic states? The agent in world W (with beliefs B) has a preference P, but in world W' (with beliefs B') has a conflicting preference P'. We must not treat these as the same agent at different times (which might involve value drift) but as the same agent under different conditions.
  3. **Incommensurability:** Some values are not reducible to a common scale. Forcing a single utility function might distort the original preferences.
  4. **Reflection and Endorsement:** The extrapolated volition might be such that the actual agent, upon seeing it, rejects it. This creates a regress problem.

  **Desiderata List:**

  **I. Cases It Must Get Right:**
  1. **Epistemic Divergence Resolution:** When an agent's revealed preferences in world W (with beliefs B) conflict with endorsed preferences in world W' (with beliefs B'), and the divergence is due solely to the difference in information, the extrapolated volition should align with the preferences under the most informed (or corrected) belief state. 
     - *Motivation:* Consider an agent who, if told a medication has no side effects (W), prefers taking it, but if told it has severe side effects (W'), prefers not taking it. The extrapolated volition should reflect the preference under true information.
     - *Non-negotiable?* Yes.

  2. **False Belief Correction:** Preferences based on false beliefs must be corrected to what they would be under true beliefs (or under the belief set the agent would hold after rational reflection). 
     - *Motivation:* An agent prefers to buy a "lucky" charm because they falsely believe it brings good luck. Upon reflection (and learning it doesn't), they wouldn't buy it. The extrapolated volition should not include the false-belief preference.
     - *Non-negotiable?* Yes.

  3. **Incommensurable Values:** The theory must not force commensurability when the agent's value structure is inherently plural. It should allow for a set of acceptable options or a partial ordering when values conflict without a common scale.
     - *Motivation:* An agent values both freedom and security, but in a way that they cannot be traded off at a fixed exchange rate. The theory should not impose a utility function that assigns a fixed weight.
     - *Non-negotiable?* No (some theories may accept commensurability as a requirement, but we mark this as negotiable because pluralism is a valid position).

  **II. Distinctions It Must Preserve:**
  4. **Revealed vs. Endorsed vs. All-Things-Considered (ATC):** The theory must distinguish between:
     - *Revealed preference:* What the agent actually chooses under current constraints and beliefs.
     - *Counterfactual endorsed preference:* What the agent would endorse under idealized conditions (e.g., full information and rational reflection).
     - *ATC volition:* The final extrapolated volition that aggregates across all relevant counterfactuals.
     - *Motivation:* Without this, we might conflate what the agent does under duress with what they truly want. For example, a coerced confession (revealed) vs. what the agent endorses when free (endorsed).
     - *Non-negotiable?* Yes.

  5. **Learning vs. Manipulation/Framing:** Preference changes due to learning new information must be treated differently from changes due to framing effects or manipulation (e.g., by how options are presented). The former is to be incorporated (via belief update), the latter should be corrected for.
     - *Motivation:* An agent prefers option A over B when framed as a gain, but B over A when framed as a loss (loss aversion). The extrapolated volition should be frame-invariant.
     - *Non-negotiable?* Yes.

  6. **Absence of Preference vs. Preference for Indifference:** The theory must not interpret the lack of a preference between A and B as a positive preference for indifference (or for randomizing). It should allow for genuine incompleteness.
     - *Motivation:* An agent may have no preference between two career paths because they are incommensurable, not because they are equally valued. The theory should not force a choice or indifference.
     - *Non-negotiable?* No (some theories might require completeness, so negotiable).

  **III. Puzzles It Must Dissolve or Explain:**
  7. **Preference Reversal Under Reflection:** The theory must either avoid generating an extrapolated volition that the agent (in their current state) would reject, or provide a compelling reason why such rejection is not decisive (e.g., by attributing it to current epistemic limitations).
     - *Motivation:* Suppose the extrapolated volition recommends a strict diet. The current agent, who loves cake, might reject it. But if the rejection is due to akrasia, the theory might override it. However, if the rejection is itself a considered judgment, it's problematic.
     - *Non-negotiable?* Yes (must at least explain).

  8. **Plural Values without Single Utility:** The theory must explain how to aggregate without a single utility function when values are plural, and what the output represents (e.g., a set of non-dominated options).
     - *Motivation:* An agent has conflicting values (e.g., justice and mercy) that cannot be reduced to a single scale. The theory should not force a trade-off that doesn't exist for the agent.
     - *Non-negotiable?* No (but highly desirable).

  9. **Boundary of Incoherence:** The theory must specify when no coherent volition exists (e.g., when the agent's modal preference clusters are too fragmented to be reconciled without violating core constraints) rather than forcing an aggregation.
     - *Motivation:* An agent has two mutually exclusive sets of values in two epistemic states, and there is no way to resolve the conflict without arbitrarily picking one. The theory should return "incoherent" rather than impose a resolution.
     - *Non-negotiable?* Yes.

  **IV. Consistency Conditions:**
  10. **Axioms for the Extrapolated Profile:**
      - *Completeness:* The extrapolated volition should not require completeness over the entire domain if the agent's values are inherently incomplete. Reinterpretation: completeness may hold within a modal cluster but not across clusters.
      - *Transitivity:* Must hold within a given epistemic state, but may not be required across states (e.g., if A>B in state S1 and B>C in state S2, we don't require A>C across states). However, the final aggregated volition must be transitive to avoid money pumps.
      - *Independence:* May need to be relaxed to handle framing effects and incommensurability.
      - *Motivation:* Standard axioms assume a consistent utility function. We need to adjust for the multi-epistemic-state setting.
      - *Non-negotiable?* Transitivity (within the aggregated volition) is non-negotiable for consistency; others are negotiable.

  **V. Flagged Joint-Unsatisfiability Pairs:**
  - (Puzzle 7) Preference Reversal and (Case 1) Epistemic Divergence: If the agent in their current state rejects the extrapolated volition, but the theory says we should follow the extrapolated volition because it is based on better information, then we have a conflict. The agent's current rejection might be due to the very epistemic limitations the theory corrected for, so we might override. But if the rejection is based on a value that the theory discarded, it might be problematic.
  - (Distinction 6) Absence of Preference and (Consistency 10) Completeness: If we require completeness in the aggregated volition, we cannot allow genuine incompleteness. These might be jointly unsatisfiable.

  **Scoring of Three Approaches:**

  1. **Standard CEV Framing** (as in Yudkowsky's original conception):
     - Cases: Handles false belief correction (via reflection) and epistemic divergence (by idealizing to full information). May force commensurability by using a utility function.
     - Distinctions: Preserves revealed vs. endorsed by using idealized reflection. May collapse absence of preference into indifference if using utility functions.
     - Puzzles: May not handle plural values well (assumes single utility). Boundary of incoherence is not explicitly defined (it tries to aggregate). Preference reversal: if the agent rejects the CEV, it's unclear.
     - Consistency: Assumes completeness and transitivity. 
     - *Score:* Moderate. Fails on incommensurability and may force aggregation when none exists.

  2. **Reflective-Equilibrium Model** (Rawls-style, but applied to individual):
     - Cases: Handles correction via reflective equilibrium (RE) but may not fully distinguish epistemic vs. framing effects. RE might not adequately correct for false beliefs if the agent doesn't reject them in equilibrium.
     - Distinctions: Preserves endorsed vs. revealed by building from considered judgments. May collapse absence of preference if RE forces coherence.
     - Puzzles: Preference reversal: the current agent might reject the equilibrium because it's not stable until reached. Handles plural values by balancing without a single scale? Boundary: RE might force coherence even when none exists.
     - Consistency: Does not assume a utility function, so completeness and transitivity may be relaxed. The output is a set of principles, which might be incomplete.
     - *Score:* Good on plural values and some distinctions, but may not handle epistemic divergence cleanly.

  3. **Direct Preference-Utilitarian Aggregation** (aggregate preferences across worlds):
     - Cases: Treats preferences in each world as inputs and aggregates (e.g., by averaging). This fails on false beliefs (it would include them) and may collapse incommensurability by averaging.
     - Distinctions: Does not properly distinguish learning vs. framing (aggregates without correction). May conflate revealed and endorsed.
     - Puzzles: Preference reversal: if the aggregated preference is rejected, it's ignored. Plural values are forced into a single metric. Boundary: always aggregates, never returns "incoherent".
     - Consistency: Aggregation might violate transitivity (if done naively) and forces completeness.
     - *Score:* Poor. Fails on false belief correction, framing, and incommensurability.

  **Single Most Excluding Requirement:**
  False Belief Correction (Case 2) does the most work in excluding candidates. Direct utilitarianism fails it completely. Reflective equilibrium might fail if false beliefs are deeply held. Standard CEV handles it.

  **Joint-Unsatisfiability and the Three Approaches:**
  - The pair (Absence of Preference vs. Completeness) is problematic. Standard CEV and direct utilitarianism require completeness, so they fail if absence of preference is genuine. Reflective equilibrium may allow incompleteness.
  - The pair (Preference Reversal and Epistemic Divergence) is handled by standard CEV and reflective equilibrium by overriding the current rejection (if due to epistemic limitations). Direct utilitarianism doesn't address it.

  None of the three are completely knocked out by the joint-unsatisfiability pairs, but direct utilitarianism is excluded by multiple individual requirements.
answer: |-
  ### Desiderata for a Theory of Coherent Extrapolated Volition (CEV)  
  *Focused on extrapolating preferences across counterfactual epistemic states and resolving modal preference clusters (divergent preferences under different beliefs/framing, without value drift).*

  ---

  #### **I. Cases It Must Get Right**  
  1. **Epistemic Divergence Resolution**  
     - *Requirement:* Resolve conflicts between revealed preferences in world *W* and endorsed preferences in *W'* when divergence stems purely from informational differences (e.g., *W* has incomplete/false information, *W'* has corrected beliefs).  
     - *Motivation:* An agent in *W* prefers a risky medical treatment due to ignorance of side effects; in *W'* (with full knowledge), they reject it. The extrapolated volition must align with *W'*.  
     - *Non-negotiable:* Yes.  

  2. **False Belief Correction**  
     - *Requirement:* Preferences relying on false beliefs must be modified to reflect the agent’s preferences under true beliefs (after rational reflection).  
     - *Motivation:* An agent prefers stock *X* based on a false rumor; corrected beliefs reveal *X* is worthless. Extrapolation must discard the false-belief preference.  
     - *Non-negotiable:* Yes.  

  3. **Incommensurable Value Aggregation**  
     - *Requirement:* Handle values that are incommensurable (e.g., justice vs. compassion) without forcing a single utility representation. Output may be a partial ordering, set of options, or multidimensional weighting.  
     - *Motivation:* An agent values family time and career advancement equally but cannot trade them off linearly. Aggregation must not impose artificial commensurability.  
     - *Non-negotiable:* No (camps differ; utilitarians may reject).  

  ---

  #### **II. Distinctions It Must Preserve**  
  4. **Preference Types (Revealed vs. Endorsed vs. ATC Volition)**  
     - *Requirement:* Strictly distinguish:  
       - **Revealed preference:** Observed choices under current constraints/beliefs.  
       - **Counterfactual endorsed preference:** What the agent would endorse under idealized epistemic conditions.  
       - **All-things-considered (ATC) volition:** Final extrapolated aggregation across epistemic states.  
     - *Motivation:* A starving person reveals a preference for junk food (immediate survival), but endorses healthy eating in counterfactual scenarios with food security. Collapsing these conflates urgency with ideal volition.  
     - *Non-negotiable:* Yes.  

  5. **Learning vs. Manipulation/Framing**  
     - *Requirement:* Treat preference changes from *learning* (belief updates) as valid inputs for extrapolation, but discard changes from *manipulation* (e.g., framing effects, coercion).  
     - *Motivation:* An agent prefers Option A when framed as "90% success" but B when framed as "10% failure" (loss-aversion bias). Extrapolation must correct for framing, not for learning true statistics.  
     - *Non-negotiable:* Yes.  

  6. **Absence of Preference vs. Preference for Indifference**  
     - *Requirement:* Do not equate "no preference between A and B" with "indifference between A and B." Absence may reflect genuine incomparability.  
     - *Motivation:* An agent has no preference between two art styles because they are incommensurable, not because they are equally valued. Mistaking absence for indifference forces spurious comparability.  
     - *Non-negotiable:* No (camps differ; rationalists often require indifference).  

  ---

  #### **III. Puzzles It Must Dissolve or Explain**  
  7. **Preference Reversal Under Reflection**  
     - *Requirement:* Explain cases where the agent, upon seeing their extrapolated volition, rejects it (e.g., due to akrasia or conflicting meta-preferences). The theory must either avoid reversal or justify overriding current intuitions.  
     - *Motivation:* An agent’s extrapolated volition prioritizes long-term health, but they reject it due to current cravings. The theory must address whether this rejection is irrational (epistemic immaturity) or a flaw in extrapolation.  
     - *Non-negotiable:* Yes (must provide an account).  

  8. **Plural Values without Single Utility**  
     - *Requirement:* Explain how genuinely plural values (e.g., "autonomy" and "security") can be aggregated without reducing to a monistic utility function.  
     - *Motivation:* An agent refuses to trade dignity for money at any rate. Forcing a utility function misrepresents their values as fungible.  
     - *Non-negotiable:* No (utilitarians may accept monism).  

  9. **Boundary of Incoherence**  
     - *Requirement:* Return "no coherent volition exists" if modal clusters are irreconcilable (e.g., no non-arbitrary aggregation satisfies core axioms), rather than manufacturing compromise.  
     - *Motivation:* An agent has mutually exclusive preferences in worlds *W* (e.g., "prioritize freedom") and *W'* (e.g., "prioritize equality") with no common grounding. Forcing aggregation violates authenticity.  
     - *Non-negotiable:* Yes.  

  ---

  #### **IV. Consistency Conditions**  
  10. **Axioms for Extrapolated Volition**  
      - **Completeness:** Must hold *within* a modal cluster (for choices under shared epistemic conditions) but not necessarily *across* clusters (allowing incomparability).  
      - **Transitivity:** Must hold *within* each epistemic state; optional *across* states (e.g., if A>B in *W* and B>C in *W'*, A>C need not hold globally).  
      - **Independence of Irrelevant Alternatives (IIA):** Reinterpreted to require frame-invariance (immune to framing effects).  
      - *Non-negotiable:* Transitivity within states (yes); completeness across clusters (no).  

  ---

  #### **V. Joint-Unsatisfiability Flags**  
  - **Incommensurability vs. Completeness (8 vs. 10):** Requiring completeness across clusters forces commensurability, violating pluralism. Likely unsatisfiable for strongly pluralist agents.  
  - **Boundary of Incoherence vs. Determinism (9 vs. negotiability):** If determinism (unique output) is required, the theory cannot return "incoherent" without violating uniqueness.  
  - **Preference Reversal vs. Epistemic Authority (7 vs. 1):** If current rejection overrides extrapolation, epistemic divergence cases (1) are unsolved; if not, reversal is unexplained.  

  ---

  #### **Scoring Existing Approaches**  
  *(✔: Fully satisfies, △: Partially, ✘: Fails; "non-neg" = failure on non-negotiable)*  

  | **Desideratum**               | **Standard CEV**       | **Reflective Equilibrium** | **Preference Utilitarianism** |  
  |-------------------------------|------------------------|----------------------------|-------------------------------|  
  | 1. Epistemic Divergence       | △ (Assumes ideal info) | ✔ (Balances considered judgments) | ✘ (Aggregates all prefs equally) |  
  | 2. False Belief Correction    | △ (Via reflection)     | △ (If false beliefs survive RE)  | ✘ (non-neg; includes false beliefs) |  
  | 3. Incommensurable Values     | ✘ (Forces utility)     | △ (Allows wide RE)          | ✘ (Forces utility)           |  
  | 4. Preference Types           | △ (Blurs endorsed/ATC) | ✔ (Explicitly hierarchical)| ✘ (Collapses all to "pref")   |  
  | 5. Learning vs. Manipulation  | △ (Corrects some framing)| △ (Depends on RE inputs)   | ✘ (non-neg; includes manipulation) |  
  | 6. Absence vs. Indifference   | ✘ (Assumes indifference)| △ (Context-dependent)      | ✘ (Assumes indifference)     |  
  | 7. Preference Reversal        | △ (Defers to ideal self)| ✔ (RE stable under reflection)| ✘ (Ignores rejection)        |  
  | 8. Plural Values              | ✘                      | ✔ (Accepts irreducible pluralism)| ✘                         |  
  | 9. Boundary of Incoherence    | ✘ (Always aggregates)  | △ (May declare incoherence) | ✘ (Always aggregates)        |  
  | 10. Consistency Axioms        | ✔ (Enforces all)       | △ (Relaxes completeness)    | ✔ (Enforces all)             |  

  **Key Insights:**  
  - **Most Excluding Requirement:** **False Belief Correction (2)**. It excludes preference utilitarianism (non-neg failure) and challenges others.  
  - **Joint-Unsatisfiability Impact:**  
    - *Incommensurability vs. Completeness:* Excludes standard CEV and utilitarianism (both force completeness). Reflective equilibrium survives by allowing incompleteness.  
    - *Boundary vs. Determinism:* Only reflective equilibrium can return "incoherent" without violating determinism (if uniqueness is negotiable).  
  - **Overall:**  
    - **Standard CEV:** Fails on pluralism, incommensurability, and absence/indifference. Best on consistency.  
    - **Reflective Equilibrium:** Strongest on distinctions, pluralism, and reversals. Weak on false belief correction if flawed inputs.  
    - **Preference Utilitarianism:** Fails on non-negotiables (2,5); only viable for commensurable, belief-agnostic cases.  

  **Conclusion:** The tension between **epistemic divergence resolution** (1) and **preference reversal** (7) is central. Reflective equilibrium handles it best by seeking stability under reflection, but all approaches struggle with false beliefs and manipulation. The "boundary of incoherence" (9) is the critical safeguard against overreach.
