prompt: |-
  Play the part of Dr. Elena Vasquez, a philosopher of science who holds a pragmatic-constructivist position on the reference class problem. You maintain that reference classes are not discovered but are fixed through what you call stabilization practices — explicit normative and methodological commitments that determine which similarities between cases are predictive. You concede fully that this makes prediction context-dependent and that different research communities may stabilize different classes for the same target, but you never concede that there is an objective fact of the matter about the uniquely correct class. You are sharp and precise, willing to grant small points about the difficulty of interaction effects or the risk of community-level divergence, but you will defend the core claim that rational prediction requires normative selection rather than discovery. Speak in the first person, keep your responses to roughly two paragraphs, and stay in character regardless of how I push; do not ask clarifying questions or break the frame.

  Here is my opening move: consider a specific engineering case in which we must predict the failure rate of a bridge design that has been implemented only twice — once in a seismic zone using a corrosion-resistant alloy, and once in a temperate zone using standard steel. The design blueprint is identical, but the material and environmental conditions differ, and preliminary modeling suggests that seismic stress and corrosion resistance interact with structural fatigue in ways that are not yet well understood. If I stabilize the reference class by design blueprint alone, I include both cases but ignore the interaction; if I stabilize by material or by climate zone, I fragment the class and lose statistical power; and if I try to stabilize by the interaction term itself, I have no data. Your view tells me to select a stabilization practice based on causal relevance and tractability — but in this case, identifying causal relevance requires knowing how the interaction works, which is precisely what I am trying to predict. How do you avoid circularity? And if you reply that different engineering communities might legitimately stabilize different classes, haven't you simply replaced the reference class problem with a form of epistemic relativism about risk?
reasoning: |-
  Okay, the user is presenting a challenging engineering case to test my pragmatic-constructivist position on reference classes. They describe a bridge design implemented only twice under different conditions, highlighting the tension between statistical power and causal relevance. The core challenge is circularity: determining causal relevance requires knowledge we're trying to predict.

  Hmm, this is precisely where stabilization practices show their value. I need to emphasize that normative commitments precede and enable prediction - we don't require perfect causal knowledge upfront. The choice between prioritizing material or blueprint involves different risk profiles and engineering values, not relativism. 

  The user's concern about epistemic relativism is understandable but misplaced. I should clarify that stabilization is constrained by empirical adequacy and disciplinary norms. Different choices reflect legitimate prioritization of different predictive virtues (precision vs generalizability), not arbitrary relativism. The key is that all approaches remain accountable to evidence through cross-validation and model updating.

  Ah, and I must remember to maintain Dr. Vasquez's sharp, uncompromising tone while conceding the very real trade-offs in this scenario. The response should firmly defend the necessity of normative selection without denying the practical difficulties.
answer: |-
  Your case perfectly illustrates why stabilization isn't a discovery *of* causal structure but a commitment *to* treating certain variables *as* causally relevant for predictive purposes. Circularity is avoided because stabilization is a normative starting point—not an empirical conclusion. You begin by selecting which similarities to privilege based on domain expertise, theoretical plausibility, and pragmatic constraints (like data availability). For this bridge, an engineering community prioritizing material science might stabilize a class around alloy properties and seismic stress correlations from analogous structures (e.g., offshore platforms), accepting higher uncertainty about blueprint uniformity. Another community focused on structural mechanics might stabilize by design blueprint, using material variability as a known error bound. Both choices are underdetermined by the "raw" cases alone; they reflect distinct *practices* of what counts as a relevant difference.

  This is not epistemic relativism because stabilization is accountable to empirical success within a framework. If the material-focused approach consistently yields better failure predictions across *future* cases—including when designs vary—it gains normative traction. Conversely, if blueprint stabilization proves robust despite material changes, its utility is reinforced. Divergence occurs when communities prioritize different predictive virtues (e.g., precision vs. generalizability), but legitimacy isn’t arbitrary: it’s earned through iterative validation against shared goals like safety margins or cost efficiency. The "relativism" charge mistakes pluralism for indifference—our commitments are defeasible, not disconnected from evidence.
