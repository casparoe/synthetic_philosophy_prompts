answer: |-
  Here is the numbered list addressing your query:

  1.  **Shared Combinatorial Challenge:** Both automated reasoners and fiction writers grapple with the combinatorial explosion inherent in representing a stable environment; exhaustively listing every unchanged fact is computationally or narratively intractable.
  2.  **AI's Formal Dilemma:** The frame problem forces AI agents to choose between inefficiently specifying all unchanged properties via successor-state axioms or relying on potentially incomplete frame axioms that list only changes, risking missed inferences.
  3.  **Authorial Inertial World-Keeping:** Fiction writers similarly avoid enumerating every static background detail across scenes, relying instead on implied continuity ("inertia") and selective description to maintain reader belief in a stable world.
  4.  **Divergent Resolution via Cognition:** While both problems share a structural root in combinatorial representation, they diverge fundamentally because readers actively supply missing continuity through pragmatic inference and real-world knowledge, unlike formal AI systems.
  5.  **Decisive Separating Feature:** Interpretive charity—the reader's willingness to assume unstated continuity—is the decisive feature separating inertial world-keeping from the frame problem, not computational tractability; this charity renders the author's task feasible where pure computation struggles.
