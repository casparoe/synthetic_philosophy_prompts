  **DEPARTMENT OF APPLIED HISTORICAL CONSCIOUSNESS**  
  **Undergraduate Program Requirement: HIST 201, 202, 203 - History for Life: The Three Modes Practicum**  

  **Overview:**  
  All Bachelor of Applied Temporal Navigation candidates must successfully complete the three-module sequence HIST 201-203. This practicum equips students with the Department's standardized methodologies for harnessing historical engagement as a primary life-sustaining resource. Modules must be taken sequentially; deviation constitutes a violation of Temporal Coherence Standards (Section 4.1, Faculty Handbook). The sequence instills professional discipline in Historical Resource Utilization (HRU), minimizing subjective vitality risks through rigorous procedural compliance.

  **HIST 201: Monumental Mode Application & Heroic Life-Protocol Integration**  
  *(4 Credits, Prerequisite: None)*  
  Module 201 operationalizes the Monumental Mode, training students to identify and implement certified Historical Action Templates (HATs) for contemporary life navigation. Students undergo mandatory Life-Coaching Protocol (LCP) sessions where past heroic exemplars (vetted per Appendix D: Approved Monument Registry) are analyzed solely for replicable surface behaviors, disregarding contextual "causal differentials" (CD-7 Form required for documented differential claims). Emphasis is placed on forceful imitation: present circumstances must conform to the selected HAT. Practical exercises include "Molding Present Action" simulations, where students re-enact designated monumental precedents (e.g., "Periclean Oratory in Faculty Meetings," "Galilean Defiance During Course Evaluations") regardless of situational relevance. Assessment consists of LCP Fidelity Audits evaluating adherence to the assigned template. Deviation due to "present uniqueness" is cataloged as Protocol Resistance (PR-1 Violation) and requires remediation through supplementary template immersion.

  **HIST 202: Antiquarian Mode Operations & Comprehensive Preservation Management**  
  *(4 Credits, Prerequisite: HIST 201)*  
  Module 202 instills proficiency in the Antiquarian Mode, focusing on the systematic acquisition, preservation, and ritualized veneration of all historical matter within the student's designated Personal Heritage Sphere (PHS). Vitality is defined as a destabilizing variable; the primary objective is administrative control through exhaustive cataloging (Form AHC-114: Comprehensive Personal Artifact Ledger) and preservation compliance (AHC Standards 22a-22z: Humidity Controls, Handling Protocols, Digital Redundancy Mandates). Students must demonstrate unfiltered reverence for all PHS contents, irrespective of current utility or coherence ("hermeneutic liabilities" are logged but not resolved). Assignments include "Infinite Archive Drills," managing simulated influxes of trivial personal ephemera (e.g., cafeteria receipts, unsorted sock drawers from 2018), graded on completeness of documentation and adherence to archival-grade storage protocols. Expression of selective valuation ("This is irrelevant to my life now") constitutes Preservation Hazard (PH-3 Breach) and triggers mandatory heritage sensitivity retraining. Spontaneous engagement with preserved material beyond ritualized inventory is discouraged as a potential vitality contaminant.

  **HIST 203: Critical Mode Implementation & Past Severance Procedure**  
  *(4 Credits, Prerequisite: HIST 202)*  
  Module 203 trains students in the rigorous application of the Critical Mode, the cornerstone of professional historical hygiene. Students learn to conduct mandatory Audits of Personal Commitment (APC), culminating in a Final Severance Judgment (FSJ) on all prior identities, affiliations, and belief structures documented within their PHS (HIST 202 Ledger). The core principle is radical disengagement: any perceived continuity with past commitments is analyzed as a critical failure requiring immediate corrective action ("Continuity Deficiency," CD-10 Citation). Techniques include "Forensic Condemnation Drills," where students must articulate exhaustive indictments against former selves, and "Ritual Disavowal Ceremonies," formally witnessed and notarized by Department Assessors. Successful completion requires submitting documented evidence of severed ties (e.g., renunciation letters to former clubs, repudiation of childhood beliefs). *Note:* Should a student subsequently wish to reclaim any disavowed identity/affiliation post-FSJ, they must initiate a formal **Continuity Dispute Resolution (CDR)** process. This involves submitting Form CDR-55 ("Petition for Reclamation of Repudiated Continuity"), providing notarized counter-condemnations of their earlier severance judgment, undergoing a Rigor Deficiency Review, and paying a Reactivation Fee. Approval is contingent upon demonstrating the initial severance lacked sufficient destructive zeal (CD-10 Citation upheld retroactively). Assessment is based on the perceived ruthlessness and finality of the FSJ documentation; evidence of residual attachment results in automatic module failure.

  **Sequence Completion:**  
  Successful passage through all three modules confers certification in Applied Historical Consciousness Integration. Graduates are qualified to implement Departmental HRU protocols within approved life domains. Further elective modules (e.g., HIST 305: Selective Forgetting for Institutional Harmony) explore advanced applications. Failure in any module necessitates repeating the entire sequence following a mandated one-semester Period of Historical Neutralization (PHN, see Regulation 17c).
