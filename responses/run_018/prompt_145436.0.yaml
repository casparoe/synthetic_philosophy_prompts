  hey im in a philosophy of science course this semester and we're on causation right now. can you construct a thought experiment for me to spec?

  i need a realistic scenario—hospital or workplace, not a trolley—just one paragraph. it should be engineered so that counterfactual theorys say event A causes outcome B (if A hadn't happened, B wouldn't have either), but interventionist theorys of the surgical-intervention-on-variables kind say A is NOT a cause of B. the interventionist denial should come genuinely from the structural model: there's an exogenous institutional backup or redundant protocol that's always locked in, not from a dumb definition.

  after you lay out the scenario, walk through:
  - what the counterfactualist says and why
  - what the interventionist says and why
  - which feature of the case is actually doing all the work
  - what happens if you remove that feature
  - and how a defender of the interventionist view would try to attack the case

  make it kinda niche—like involve protocol lock-in or redundant safeguards—not just two fires. and pls don't include any bibliographys, citation lists, or reading lists, since this is for a model with no web access. also avoid demons, perfect predicters, or exotic physics.

  format: end with one line starting with "Bottom line:" that gives a one-sentence summary of the scenario's punchline.
