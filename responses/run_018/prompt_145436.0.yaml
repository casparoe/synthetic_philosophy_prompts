  We are in a hospital setting. Consider a scenario involving patient monitoring for post-operative sepsis. The hospital has a protocol: if a patient's temperature exceeds 38°C (Event A), an alert is sent to the nurse's station, which then triggers an immediate review by the charge nurse (a human step). However, there is also an automated backup system that independently monitors the same patient's vital signs and, if two consecutive readings 15 minutes apart show a heart rate above 120 bpm and a temperature above 38°C, it directly pages the rapid response team (Event B) without human intervention. The two systems (the nurse alert and the automated system) are causally independent: the nurse alert does not affect the automated system, and the automated system does not rely on the nurse alert. Moreover, the automated system is designed to activate even if the nurse alert fails for any reason (e.g., if the nurse is distracted and doesn't respond). Now, suppose on a specific occasion, the patient's temperature exceeds 38°C (A occurs) and the nurse alert is sent, but the nurse is busy and hasn't yet responded. Meanwhile, the patient's heart rate also exceeds 120 bpm at the next reading, so the automated system activates and pages the rapid response team (B occurs). The patient is treated and survives.

  Counterfactual theory (e.g., Lewis) says: If A (the temperature alert) had not happened, would B (the rapid response) have happened? In this scenario, without A, the temperature would not have exceeded 38°C at that time (by the counterfactual assumption). But note that the automated system requires both high temperature and high heart rate. Without the high temperature, the automated system would not have activated. Therefore, without A, the automated system would not have triggered B. So counterfactually, A is a cause of B.

  Interventionist theory (e.g., Woodward) says: We must consider an intervention on A that changes its value while holding fixed the other variables at their actual values (except descendants of A). But note that the automated system is exogenously set to monitor the patient's vital signs independently. In the structural model, the automated system's activation (which leads to B) is a function of the patient's actual vital signs (temperature and heart rate) and not of the nurse alert system. So if we intervene to prevent A (say, by turning off the nurse alert system or by ensuring the temperature doesn't trigger it), we are not affecting the patient's actual vital signs. The patient still has a high temperature and high heart rate (because the intervention on A does not change the patient's condition). Therefore, the automated system will still activate and cause B. Thus, the interventionist says A is not a cause of B.

  The feature doing all the work: The existence of a redundant, causally independent backup system (the automated system) that does not rely on the first event (A) and is triggered by the same underlying physical state (the patient's condition) that also caused A. The backup is always in place and is exogenously set to trigger on the condition independently.

  If we remove that feature: Suppose there is no automated backup. Then, if the nurse alert (A) fails, the rapid response (B) might not occur. Then both theories would agree that A is a cause of B. Without the backup, the counterfactual holds: without A, B wouldn't have happened. And interventionist: if we intervene to prevent A (and there's no backup), then B would not occur.

  How an interventionist defender might attack the case: They might argue that the model should include the patient's vital signs as separate variables. Let T be the temperature and H the heart rate. Then A is caused by T (and perhaps other factors) and B is caused by the automated system which is a function of T and H. Now, if we intervene on A, we are not changing T or H (because A is downstream of T). So the intervention on A leaves T and H at their actual values. Then B still occurs because T and H are high. Therefore, A is not a cause of B. But note that the counterfactualist might have a different take: they might say that without A, we are considering a world where the temperature is not high (because A is the alert for high temperature). This reveals a potential ambiguity: what is the counterfactual world? The interventionist has a clear way to set the counterfactual by intervention without changing exogenous variables. The counterfactualist might be thinking of a world where the cause of A (the high temperature) is also absent. The interventionist defender would say that the counterfactualist is not holding fixed the patient's condition (the exogeneous variables) and thus is not isolating the effect of A alone.

  Bottom line: In a hospital with redundant monitoring, a nurse alert for fever (A) is counterfactually necessary for the rapid response (B) because without the fever the backup wouldn't trigger, but interventionism denies A as a cause because an intervention preventing A leaves the patient's fever and the backup system intact, so B still occurs.
answer: |-
  ### Thought Experiment: Hospital Medication Protocol

  In a hospital's ICU, a patient is on a high-risk medication that requires two independent safeguards to prevent overdose: (1) a primary automated IV pump (System P) that halts infusion if the patient's heart rate drops below 50 bpm (Event A), and (2) a mandatory backup protocol (System B) where a dedicated monitor independently tracks blood pressure—triggering an immediate infusion stoppage (Outcome B) if systolic pressure falls under 90 mmHg, regardless of System P. The systems are causally isolated: System B is hardwired to bypass P and runs on separate sensors. On a particular shift, the patient’s heart rate dips to 48 bpm, activating System P (A occurs). Simultaneously (but independently), their systolic pressure drops to 85 mmHg, and System B activates, stopping the infusion (B occurs). Unbeknownst to the staff, System B would have triggered the same stoppage even if System P had failed entirely, as the pressure drop alone was sufficient.  

  #### Analysis:  
  1. **Counterfactualist (e.g., Lewis) says A causes B**:  
     *Why*: In the closest possible world where A (System P activation) doesn’t occur—meaning the heart rate never dropped below 50 bpm—the patient’s blood pressure would not have fallen to 85 mmHg either (since heart rate and blood pressure are correlated in this context). Thus, without A, B (infusion stoppage) wouldn’t have happened. The counterfactual dependence holds: "If not A, then not B."  

  2. **Interventionist (e.g., Woodward) says A does NOT cause B**:  
     *Why*: An intervention on A (e.g., surgically disabling System P) leaves the patient’s *actual* blood pressure (85 mmHg) and System B’s operation unchanged. Since System B is exogenously fixed (it always runs independently and responds only to blood pressure), it still triggers B. The structural model shows B depends *only* on blood pressure and System B’s design—A is irrelevant under intervention.  

  3. **Feature doing the work**:  
     The **exogenous institutional redundancy**—System B’s hardwired, sensor-driven protocol that is always active and causally isolated from System P. It severs the link between A and B in the interventionist model.  

  4. **If you remove that feature**:  
     Without System B’s independence (e.g., if System B only activates if System P fails), both theories agree A causes B. Counterfactual: Without A, B wouldn’t occur. Interventionist: Disabling A prevents B if System B isn’t autonomous.  

  5. **Interventionist defender’s attack**:  
     They’d argue the counterfactualist smuggles in a *coincidence* of events (heart rate and blood pressure drops) as necessary causation. In reality, the structural model should treat the patient’s vital signs as *confounders*: intervening on A doesn’t alter the blood pressure variable, which alone determines B. The counterfactualist’s "closest world" incorrectly assumes vital signs are interdependent, but interventionism isolates variables rigorously.  

  Bottom line: Institutional redundancy severs causal links in interventionism while preserving counterfactual dependence.
