  3) Natural limits/degrowth: Juicy political implications but the hardest to defend textually. Aristotle's "natural wealth" limit was household/state-specific, not ecological. Could easily drift into anachronism.

  *scratches head* Maybe the hidden gem here is the degrowth angle's inverse: Aristotle's household-as-unit could actually critique modern degrowth's macro-focus. But is that enough for a dissertation core? 

