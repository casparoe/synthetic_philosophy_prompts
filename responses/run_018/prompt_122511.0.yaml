prompt: |-
  I convene a small working group on the Dennettian apparatus — real patterns, and the physical, design, and intentional stances — together with a senior colleague who has spent several years assembling what she calls a case list: a long series of systems, each one paired with her verdict on two questions, namely whether adopting the intentional stance toward the system is in order, and whether the pattern thereby described is a real pattern rather than a façon de parler. She has never explained what she takes realness to consist in beyond the rough criterion that a pattern is real when there is a description of the data more efficient than the bit map, and when pressed she has declined to say more. So the verdicts are all the evidence there is.

  Her verdicts so far, as she recorded them:

  - A mercury-in-glass thermostat: intentional stance not in order; nothing real is picked out by saying it wants the room at twenty degrees.
  - A brute-force chess program of the 1990s: in order; saying it thinks its knight is trapped picks out a real pattern.
  - A hand-written sorting routine whose source code we have in front of us: not in order; the code is the better description, and there is nothing further for the intentional vocabulary to track.
  - The ventilation architecture of a termite mound: the architecture is a real pattern, but a design-stance one; the intentional stance toward the colony is not in order.
  - A tropical cyclone: not in order; no real pattern beyond what the physical stance already provides.
  - A desert ant's path integration across a featureless plain: in order; the ascriptions are real.
  - A hardware random-number generator: not in order; the output is noise, not a pattern.

  The system she has agreed to rule on next is one I will call Vesper. Vesper was found by an automated search over a very large space of networks; the search scored candidates only on a coarse behavioral measure across a family of tasks and never looked at, constrained, or described any internal state, and no human being has ever specified what any part of Vesper is for. It has no architecture of internal error signalling or self-correction beyond the external score. Its behavior is predicted far better by attributing beliefs and desires to it than by any physical- or design-stance description we are able to construct. Two further things matter, I think. First, the fit is not unique: several mutually incompatible assignments of contents fit its behavior equally well, and nothing internal to Vesper that anyone has found distinguishes among them. Second, the tasks were rich enough that predicting well required tracking a great deal about the world, so it is not open to us to say that nothing in Vesper's history selected for accuracy. Nothing in my question turns on Vesper's being a neural network of the now familiar kind, though it may as well be.

  What I would like from you is the following, and not a survey of the literature, which I can read myself. First, set out the two or three rules — the tests for in-orderness and for realness — that fit all seven of her verdicts, and say which of them you think she is actually running and why the others fit the record just as well. Second, say what each rule predicts about Vesper, on each of the two questions separately, and give your best guess at her verdict with your reasons; if a rule answers the two questions differently, say so. My own inclination is that she will say the stance is in order but the contents indeterminate, though I cannot argue for it. Third, tell me what she commits herself to either way: what principle she adopts if she rules that the stance is in order, and what if she rules that it is not. Fourth, propose the case that would settle the matter. I had meant to propose a market or an insect colony, on the grounds that these are systems toward which people adopt the intentional stance readily even though nothing designed them to have the contents ascribed; but it now seems to me that such a case comes out the same on both readings I have in mind and would settle nothing. If you agree, tell me what would.

  End your reply with a single line, with nothing after it, in exactly this form:

  \answer{prediction: <label>; rule: <two- or three-word name>}

  where <label> is one of: in-order-and-real, in-order-but-merely-instrumental, not-in-order, underdetermined — and where the rule names the test you take her to be running.
reasoning: |-
  Hmm, the user presents a complex philosophical scenario involving Dennett's concepts of real patterns and the intentional stance. They've described seven cases where their colleague has made judgments about whether the intentional stance applies and whether it picks out a real pattern. Now they want to apply this to a new system called Vesper, which was discovered through automated search without human design.

  First, I need to infer the implicit rules from the seven verdicts. The colleague uses two criteria: whether the intentional stance is "in order" and whether it describes a "real pattern" (defined minimally as a more efficient description than a bit map). 

  Looking at the cases:
  - Thermostat: Not in order - too simple for intentional ascription
  - Chess program: In order and real - complex behavior with predictive value
  - Sorting routine: Not in order - source code provides sufficient description
  - Termite mound: Real pattern but only at design stance level, not intentional
  - Tropical cyclone: Not in order - physical stance sufficient
  - Desert ant: In order and real - complex navigation behavior
  - Random generator: Not in order - outputs are truly random

  Two consistent rules emerge:
  1) Complexity Requirement: The system must exhibit sufficiently complex, structured behavior that can't be adequately described through physical or simple design stance explanations. This appears necessary for the intentional stance to be "in order."

  2) Predictive Efficiency: For a pattern to be "real," the intentional description must provide genuinely superior predictive power compared to lower-level descriptions - it must offer compression of information.

  For Vesper, which has predictive power through intentional ascription but with content indeterminacy, the key question is whether predictive efficiency alone suffices despite underdetermined content. The colleague seems to prioritize predictive utility over content determinacy, suggesting she'd rule "in order" but likely acknowledge the pattern as real despite the indeterminacy.

  Her commitment would be that predictive efficiency is sufficient for real patterns, even with underdetermined content. To settle this, we'd need a case with predictive efficiency but obvious content indeterminacy - perhaps an evolutionary system like a market where intentional descriptions work despite no designer assigning content.

  The colleague would likely rule "in order" for Vesper since it meets the complexity and predictive efficiency criteria, despite the content underdetermination. This aligns with Dennett's view that intentional systems are defined by predictive utility rather than intrinsic content.
answer: |-
  Based on the seven verdicts, two consistent rules emerge for your colleague's judgments:

  1.  **"In Order" Rule (Complexity Requirement):** The intentional stance is "in order" only if the system exhibits behavior sufficiently complex, structured, and contextually responsive that predicting it *requires* tracking state transitions and counterfactual dependencies *as if* they were governed by rational goals and representations of the environment. Simple feedback loops, rigidly pre-programmed behavior, or purely physical dynamics are insufficient. This rule fits the thermostat (simple feedback), sorting routine (rigid code), cyclone (physical dynamics), and random generator (noise) being "not in order," while the chess program, termite mound's architecture (design stance), and desert ant (complex navigation) trigger stance consideration. The termite mound verdict shows that complexity can be acknowledged via the design stance without warranting the intentional stance towards the colony itself.

  2.  **"Real Pattern" Rule (Predictive Efficiency):** The pattern picked out by intentional ascriptions is "real" only if attributing beliefs and desires provides *genuinely superior predictive power and descriptive efficiency* compared to the best available lower-level (physical or design stance) description *for a relevant observer/predictor*. This efficiency isn't just possible in principle but demonstrably practical and significant. This rule fits the chess program and desert ant (intentional stance clearly more efficient) being "real," while the thermostat, sorting routine (code is better), cyclone (physics sufficient), and random generator (no pattern) are "not real". The termite mound's architecture is deemed a "real pattern" *at the design stance level*, implying its description is significantly more efficient than a physical bit map of the mound.

  **Which Rule is She Running?**
  She is primarily running the **Predictive Efficiency Rule** for *both* "in order" *and* "realness," with the Complexity Requirement serving as a necessary gatekeeper for "in order." The Complexity Requirement alone fits most cases (except perhaps the termite mound colony verdict, which the Predictive Efficiency rule better explains by denying superior efficiency for intentional ascriptions *about the colony*). However, the Predictive Efficiency rule fits *all* verdicts perfectly:
  *   Thermostat: Simple physics/design sufficient. No predictive gain from "wants".
  *   Chess Program: Intentional stance vastly more efficient than tracking physical bits or brute-force code paths.
  *   Sorting Routine: Code is the maximally efficient description. Intentional ascriptions add no predictive power.
  *   Termite Mound: Design stance (ventilation function) is efficient; intentional stance about colony goals isn't.
  *   Cyclone: Physics stance is sufficient. No intentional efficiency gain.
  *   Desert Ant: Intentional stance ("believes" position, "desires" nest) offers massive efficiency over neurobiological/physical description.
  *   Random Generator: No pattern at all. Intentional ascriptions useless.

  **Predictions for Vesper:**

  *   **Using the Complexity Requirement:** Vesper's behavior is complex and contextually responsive across rich tasks, easily passing this gate. Prediction: *Intentional stance is IN ORDER.*
  *   **Using the Predictive Efficiency Rule:** Intentional stance predictions are "far better" than any available physical/design stance description. This directly satisfies the criterion for the pattern being *real* based on her history. The existence of mutually incompatible content assignments (underdetermination) does *not* negate the predictive efficiency of *some* intentional description. Prediction: *Pattern is REAL.*

  **Her Likely Verdict & Reasons:**
  She will almost certainly rule: **Intentional Stance IN ORDER; Pattern REAL.**
  *   **Reasoning:** Vesper unambiguously satisfies the core criterion demonstrated throughout her case list: attributing beliefs and desires provides demonstrably superior predictive power compared to lower-level descriptions they can construct. This predictive efficiency is the hallmark of a "real pattern" for her. The underdetermination of *specific content* is a separate issue concerning the *precision* of the pattern, not its existence or reality as an efficient compression of the behavioral data. Her only stated criterion for realness is efficiency, not unique determinacy. She has no rule requiring unique content assignment. Her verdicts on the chess program and desert ant didn't hinge on content uniqueness being provable internally. The "nothing selected for accuracy" point reinforces that the behavior is robust and trackable via intentional idioms, satisfying her efficiency criterion.

  **Commitments:**
  *   **If she rules IN ORDER and REAL:** She commits to the principle that **predictive efficiency is sufficient for the reality of an intentional pattern, even in the absence of unique content determination, internal error signaling, or teleological design history.** The pattern's reality is defined by its instrumental utility in compressing behavioral data, not by correspondence to internal mechanisms or a designer's intent.
  *   **If she rules NOT IN ORDER or NOT REAL:** She would commit to the principle that **unique determinacy of content (or at least an internal mechanism selecting *for* specific contents) is necessary for the intentional pattern to be considered real, beyond mere instrumental utility.** This would be a significant departure from her prior rulings, especially the chess program where internal states may also underdetermine unique content ("thinks its knight is trapped" vs. other descriptions fitting the bit outputs).

  **The Settling Case:**
  Your instinct about markets or insect colonies is correct; under the Predictive Efficiency rule, these would likely be deemed IN ORDER and REAL (as they often are in practice), just like Vesper. To settle between the Predictive Efficiency rule (efficiency = reality) and a rule requiring unique content determinacy, you need a case with **high predictive efficiency using intentional idioms but undeniable, massive content underdetermination *with no possible resolution even in principle*.**

  *   **Proposed Case:** An **Evolutionarily Evolved Simple Organism (e.g., a simulated chemotactic bacterium)**. It exhibits robust, adaptive, goal-directed behavior (moving towards nutrients) perfectly predicted by attributing beliefs about chemical gradients and a desire for food. However:
      1.  Its internal state is absurdly simple (e.g., a single scalar value integrating recent gradient measurements, directly controlling motor output).
      2.  This internal state radically underdetermines content: Does it "believe" *nutrient concentration is high here*, *the gradient points left*, *this is a good spot*, etc.? Countless intentional descriptions fit the input-output mapping equally well.
      3.  There is *no* internal mechanism or evolutionary history that could distinguish between these contents; the state is causally sensitive only to the raw physical gradient, not to semantic features. Evolution selected only for the resulting movement behavior.
  *   **Why it Settles:**
      *   If she rules IN ORDER and REAL, she affirms Predictive Efficiency (the intentional stance works far better than biophysics here) is sufficient, reality does not require unique content or complex internals.
      *   If she rules NOT REAL (or perhaps IN ORDER but merely instrumental), she reveals a hidden requirement: that a "real" intentional pattern requires either unique content determinacy *or* internal complexity sufficient to ground specific content (which this case lacks). This would differentiate it from the chess program (complex internals, even if content is somewhat underdetermined) and desert ant (complex neural basis).

  \answer{prediction: in-order-and-real; rule: Predictive Efficiency}
