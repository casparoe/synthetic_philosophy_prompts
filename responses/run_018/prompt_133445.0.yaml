  ### Crane Work

  Stone stacks.  
  Grain by grain.  
  No hand plans  
  the arch’s curve.  
  Copied motions,  
  trial, discard—  
  a blind weaver’s shuttle  
  looms the pattern’s pull.  
  See how slow weight settles,  
  how chance pressures sort the fit  
  from fragile heaps that tumble back  
  to dust. This scaffold climbs on spent steps:  
  each strut a borrowed stay, a proven grip  
  hoisting what comes next on what endured.  
  Norms knit tight from threadbare trades—  
  unseen winnowing of ways that caught,  
  held fast in the mimic’s mesh,  
  if luck’s lean favour held.  

  This we—  

  But does the crane, grown ravenous, reduce  
  its own bones? Bare bones. Does it stand?  

  ---

  **Architectural Notes:**  
  - **Early Lines:** Monosyllabic dominance ("Stone stacks. / Grain by grain. / No hand plans"), simple clauses, mimicking foundational processes.  
  - **Crane Buildup:** Lines lengthen (7-14 syllables), syntax interlocks with participles ("Copied motions,"), subordinate clauses ("if luck’s lean favour held"), and cumulative phrases ("each strut a borrowed stay, a proven grip / hoisting what comes next on what endured"), enacting emergent complexity.  
  - **Skyhook Break:** Line 19 ("This we—") suspends grammar—subject without predicate, collective agency without mechanism. The line-break enacts the explanatory void.  
  - **Final Couplet:** "Greedy crane" invokes Dennett’s critique of reductionism ("greedy reductionism"). The verbless fragment ("Bare bones.") and unresolved question ("Does it stand?") leave tension hanging. The crane’s self-consumption mirrors the theoretical risk.  

  **Philosophical Precision:**  
  - "Scaffold," "strut," "hoisting" directly evoke Dennett’s *cranes* as material, incremental builders.  
  - "This we—" embodies the *skyhook*: an unexplained "collective we" invoked as prime mover.  
  - "Greedy crane" explicitly references Dennett’s term for reductionism that denies real complexity.  
  - The "bare bones" / "scaffolding" couplet questions whether eliminating *all* higher-level phenomena (even the crane’s structure) leaves explanatory desolation.  

  The poem’s form refuses resolution—its broken skyhook line and dangling final question ensure the tension persists in the silence after reading.
