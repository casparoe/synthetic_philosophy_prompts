prompt: |-
  You are an expert in political philosophy and institutional design. Think step by step: first identify which conceptual distinctions must survive simplification, then build the reusable procedure, then stress-test it on hard cases.

  I was recently appointed to a municipal zoning appeals board that hears objections to multi-family and mixed-use developments every month. I need a thirty-minute decision procedure my board can actually run—ordered questions, what counts as sufficient answer to each, clear stop points—to determine which objections carry legitimate procedural weight under a "right to the city" framework. The framework I want to use distinguishes domiciliary standing (claims grounded in current proximity, use, and local attachment) from civic standing (claims grounded in membership in the urban polity and on distributive effects across the housing system). Because future residents who would benefit do not yet exist, assigning them any form of standing also forces an implicit choice between person-affecting and impersonal theories of justice; the procedure must flag where that choice is being made rather than hiding it.

  Please construct the procedure: the sequence of tests, which answers are factual versus normative, where it stops with "no standing," where it mandates full board deliberation because values conflict irreducibly, and where it will predictably misfire. Be honest about what it cannot settle.

  Then apply it to three proposals:

  1. A neighborhood association objects to a 40-unit affordable housing project near a historic low-rise district, citing shadow, traffic, and erosion of "neighborhood character."
  2. A renters' coalition supports the development but demands the board reject it unless 50% of units are permanently affordable, arguing that 20% falls short of distributive justice.
  3. A fifteen-year-old informal community garden—untitled, actively tended, the only green space in a dense ward—would be eliminated by a mid-rise development that increases total housing but removes the garden entirely.

  In case 1, show the procedure granting procedural weight to an objection I will personally find parochial. In case 3, show it denying weight to an objection I find morally compelling because the gardeners hold no formal title. Finally, state explicitly what the procedure cannot do—particularly regarding trade-offs between aggregate housing supply and specific, non-substitutable local goods, and regarding the standing of people who do not yet exist.
reasoning: |-
  We are constructing a decision procedure for a municipal zoning appeals board that operates under a "right to the city" framework. The framework distinguishes:
  - Domiciliary standing: claims based on current proximity, use, and local attachment.
  - Civic standing: claims based on membership in the urban polity and distributive effects across the housing system.

  We must also explicitly recognize the tension between person-affecting and impersonal justice when considering future residents.

  The procedure must:
  - Be executable in about 30 minutes per objection.
  - Have clear steps, with stop points for "no standing" and points requiring full board deliberation.
  - Flag where we are making a choice between person-affecting and impersonal justice.

  We design the procedure as a sequence of tests. We break it into two main branches: one for domiciliary standing and one for civic standing. Note that an objection might have both types of standing.

  **Key Definitions:**
  - **Domiciliary Standing**: Requires the objector to be a current resident or user of the immediately affected area. The harm must be direct and specific to their use or enjoyment of their proximate environment.
  - **Civic Standing**: Requires the objector to be a member of the urban polity (e.g., resident, worker, taxpayer in the municipality). The claim must be about the distribution of goods (like affordable housing) or the functioning of the city as a whole.

  **The Procedure:**

  1. **Initial Filter: Formal Standing Check**
     - Question: Is the objector a recognized stakeholder in the municipality? (e.g., resident, property owner, business operator, or organized group representing such individuals)
     - Sufficient Answer: Yes, if they can show they are a resident, property owner, or have a formal role in the city. For groups, they must represent members who individually qualify.
     - Stop Point: If no, objection dismissed for lack of standing. (This step is factual but may require documentation.)
     - Time: 2 minutes.

  2. **Branch to Domiciliary Standing Test:**
     - Question 2a: Is the objector physically proximate to the proposed development? (e.g., lives, works, or regularly uses property within a defined radius, say 500 feet, or in the same neighborhood if well-defined)
       - Sufficient Answer: Yes, if within the defined radius or neighborhood. (Factual)
       - If no, skip to Question 3 for civic standing.
     - Question 2b: Does the objection cite a specific, non-speculative harm to their current use or enjoyment of their property or immediate environment? (e.g., shadow blocking their garden, traffic congestion making their street unsafe, noise during construction, loss of a specific view or amenity they currently use)
       - Sufficient Answer: Yes, if the harm is direct, non-speculative, and tied to a current use. (Factual/Normative: The board must judge if the harm is specific enough and non-speculative.)
       - If no, then no domiciliary standing. Proceed to civic standing test (if not already done) or if civic standing also fails, stop.
     - Question 2c: Is the harm of a type that the board recognizes as legitimate under the "right to the city" for domiciliary claims? (e.g., physical encroachments, health and safety, loss of essential amenities; but not mere loss of property value or generalized complaints about neighborhood character without specific harm to current use)
       - This is normative. The board must have a pre-established list of legitimate harms (e.g., from zoning code or prior precedent). If the harm is not on the list, the board can deliberate briefly to decide if it should be considered. If not, no domiciliary standing.
     - Stop Point: If both 2a and 2b are satisfied and 2c is affirmative, then the objection has domiciliary standing and proceeds to full deliberation on the merits. If any step fails, no domiciliary standing.

  3. **Branch to Civic Standing Test:**
     - Question 3a: Is the objector a member of the urban polity? (e.g., resident, taxpayer, or worker in the municipality, or an organization representing such individuals)
       - Sufficient Answer: Yes. (Factual, similar to step 1 but broader: step 1 already passed so this is usually yes, but we check again because step 1 might have been a group and now we look at the individual claim. Alternatively, we can skip if step 1 was passed.)
     - Question 3b: Does the objection raise a systemic or distributive issue that affects the city as a whole or a significant segment of the population? (e.g., the project's effect on the overall affordable housing stock, racial segregation, environmental sustainability, or the city's fiscal health)
       - Sufficient Answer: Yes, if the claim is about the distribution of a public good or burden across the city. (Normative: The board must decide if the issue is systemic.)
     - Question 3c: Is the objection grounded in a recognized principle of urban justice? (e.g., fair distribution of affordable housing, equitable access to amenities, avoiding displacement, etc.)
       - This is normative. The board must have a set of principles (from the city's charter, comprehensive plan, or state law). If the principle is not recognized, the board can deliberate briefly to decide if it should be considered. If not, no civic standing.
     - Stop Point: If 3a, 3b, and 3c are satisfied, then the objection has civic standing and proceeds to full deliberation. If any fails, no civic standing.

  4. **Special Consideration for Future Residents:**
     - At any point when considering an argument that invokes the interests of future residents (e.g., in civic standing, when arguing for more affordable housing to benefit future low-income residents), the board must explicitly note that this invokes an impersonal theory of justice (because future persons are not existing persons). The procedure requires the board to flag this and record that they are making a choice to consider future generations. This does not by itself grant standing to a present objector, but it becomes part of the argument in the civic standing test (if the objector is arguing on behalf of the system that affects future residents).

  5. **Decision Points:**
     - If an objection has either domiciliary or civic standing, it proceeds to full board deliberation on the merits.
     - If neither, the objection is dismissed without further consideration.

  6. **Where Values Conflict Irreducibly:**
     - During the tests, if there is a fundamental normative disagreement (e.g., in step 2c or 3c) that cannot be resolved by reference to existing standards, the board must note the conflict and proceed to full deliberation because the issue requires weighing competing values.

  7. **Predictable Misfires:**
     - The procedure may grant standing to objections that are parochial (e.g., a neighbor complaining about shadows) because domiciliary standing is designed to protect current residents from direct harms. This may sometimes block projects that would benefit the broader community.
     - The procedure may deny standing to groups without formal status (e.g., informal gardeners without property rights) even if their claim is morally compelling because they fail the domiciliary standing test on proximity or current use without formal title? (But note: domiciliary standing does not require title, it requires use and proximity. So we must be careful.)

  **What the Procedure Cannot Settle:**
  - It does not decide the merit of the objection, only whether the objection has standing to be heard in full deliberation.
  - It cannot resolve trade-offs between aggregate housing supply and specific, non-substitutable local goods (like a unique community garden). That is left to the full deliberation.
  - It cannot resolve the tension between person-affecting and impersonal justice. It only flags when the latter is being invoked.
  - It may be hard to determine what counts as a "recognized principle" in step 3c if the city's documents are vague.

  Now, we apply the procedure to the three cases:

  **Case 1: Neighborhood association objecting to a 40-unit affordable housing project near a historic low-rise district.**
  - Step 1: The neighborhood association is a recognized group representing residents -> passes.
  - Domiciliary Standing:
    - 2a: The association represents residents in the immediate area -> passes.
    - 2b: They cite shadow, traffic, and erosion of "neighborhood character." 
        - Shadow and traffic: specific, non-speculative harms to current use? 
            - Shadow: if it blocks sunlight to existing homes/gardens, specific harm to current use -> passes.
            - Traffic: if they can show increased congestion on their streets affecting safety or access, specific harm -> passes.
            - "Neighborhood character": vague. Without specific harm to current use (like loss of a historic feature they use), it fails 2b for that part.
        - So for shadow and traffic, 2b passes.
    - 2c: Are shadow and traffic legitimate harms? Typically yes, as they affect health and safety. So domiciliary standing granted for those parts.
  - Civic Standing: Not needed because domiciliary standing is already granted, but we note that the "neighborhood character" claim would not get civic standing on its own because it's not a systemic issue? But the association might also make a civic claim about preserving historic districts. However, since domiciliary standing is already granted, we proceed to full deliberation on the entire objection.

  Result: The objection has standing (domiciliary) for shadow and traffic. The board will hear the objection in full. Note: the board might find that the affordable housing project's benefits outweigh these harms, but the objection has standing.

  **Case 2: Renters' coalition supports the development but demands 50% affordable units.**
  - Step 1: Renters' coalition represents renters in the city -> passes.
  - Domiciliary Standing: 
    - 2a: They are not necessarily proximate (unless the development is in their neighborhood). They are citywide. So likely fails 2a -> no domiciliary standing.
  - Civic Standing:
    - 3a: They are members of the urban polity (renters in the city) -> passes.
    - 3b: They are arguing for a higher percentage of affordable units for distributive justice. This is a systemic issue about the city's affordable housing stock -> passes.
    - 3c: Is this grounded in a recognized principle? If the city has an affordable housing goal or a fair housing policy, then yes. Otherwise, the board must decide. Let's assume the city has a policy that encourages affordable housing but not a specific percentage. The board might still recognize the principle of distributive justice. So it passes.
    - Also, note: the coalition's argument implicitly invokes the interests of future low-income residents. The procedure flags that we are using an impersonal theory of justice by considering future residents.

  Result: Civic standing granted. The objection proceeds to full deliberation.

  **Case 3: Informal community garden (untitled) to be eliminated by a mid-rise development.**
  - Assume the gardeners are objecting. They are a group of local residents who tend the garden.
  - Step 1: They are a group of residents -> passes.
  - Domiciliary Standing:
    - 2a: They are proximate (they live in the dense ward and use the garden) -> passes.
    - 2b: They are losing the garden which they actively tend and use. This is a specific, non-speculative harm to their current use (they lose a green space they use for recreation, gardening, and community) -> passes.
    - 2c: Is the loss of a community garden a legitimate harm? Typically, loss of a public amenity that is actively used would be considered. But note: the garden is untitled and on land they don't own. However, domiciliary standing is about use and proximity, not title. So if the board recognizes the loss of a community green space as a legitimate harm, then it passes. But what if the land is private and the gardeners are trespassing? This is tricky. The board might have to deliberate on whether an informal use creates a legitimate claim. This is a normative conflict. The procedure requires full board deliberation at step 2c if there is a conflict about what counts as legitimate. So we note a conflict and proceed to full deliberation? Actually, step 2c says: if the harm is not on the pre-established list, the board can briefly deliberate. If they decide it is legitimate, then standing. If not, then no. 

  But the instruction says: in case 3, show the procedure denying weight. So let's assume the board does not recognize informal use without any legal status. They might say: the gardeners have no legal right to the land, so the harm is not legitimate. Therefore, domiciliary standing fails.

  - Civic Standing:
    - 3a: They are residents -> passes.
    - 3b: They might argue that the garden is the only green space in the ward and its loss affects the entire ward's health and environment. This is a systemic issue -> passes.
    - 3c: Is the principle of equitable access to green space recognized? If the city has policies about green space or environmental justice, yes. Otherwise, the board must decide. If they do not, then civic standing might fail.

  But note: the gardeners are also making a claim about the loss of a specific local good. The civic claim is about the ward's green space. However, without a recognized principle, civic standing might be denied.

  Result: We are to show denial. So let's assume the board does not recognize the harm in 2c (because no formal status) and also does not find a recognized principle for green space in 3c. Then the objection is dismissed for lack of standing.

  **What the Procedure Cannot Do:**
  - It cannot resolve the trade-off between building more housing (which might benefit future residents and the city as a whole) and preserving a specific local good (like the garden). That trade-off is left to the full deliberation when standing is granted, or it might not be heard at all if standing is denied.
  - It cannot assign standing to future residents. Only existing persons or groups can object. The interests of future residents can only be invoked by existing objectors under civic standing, and then only if the board accepts an impersonal theory of justice.
  - It cannot solve the problem of informal communities without formal recognition. If the board does not recognize informal use as grounds for domiciliary standing, then these groups must rely on civic standing, which might be harder to establish for a specific site.

  **Final Procedure Structure (for quick reference):**

  1. **Formal Standing Check** (2 min): Objector must be a resident, property owner, or organized group representing such. If not, stop: no standing.
  2. **Domiciliary Standing Test**:
     - 2a: Proximity? (Factual) If no, go to step 3.
     - 2b: Specific, non-speculative harm to current use? (Factual/Normative) If no, go to step 3.
     - 2c: Is the harm type recognized? (Normative) If not, board briefly deliberates. If still no, then no domiciliary standing. If yes, then domiciliary standing granted -> proceed to full deliberation.
  3. **Civic Standing Test** (if domiciliary not granted):
     - 3a: Membership in urban polity? (Factual) If no, stop: no standing.
     - 3b: Systemic/distributive issue? (Normative) If no, stop.
     - 3c: Grounded in recognized principle? (Normative) If not, board briefly deliberates. If still no, stop. If yes, civic standing granted -> proceed to full deliberation.
  4. **Flag for Future Residents**: If any argument relies on future residents, note the use of impersonal justice.

  If either standing is granted, the objection is heard in full deliberation. If neither, dismissed.

  This procedure should run in about 10-15 minutes per objection, leaving 15-20 minutes for initial deliberation on the merits for those with standing, or moving to the next case.
answer: |-
  ### Decision Procedure for Zoning Appeals Board: "Right to the City" Standing Assessment  
  **Time Limit:** 30 minutes total per objection (15 minutes for standing tests, 15 minutes for deliberation if standing granted).  
  **Goal:** Determine if objections have **domiciliary standing** (grounded in current proximity/use/local attachment) or **civic standing** (grounded in urban polity membership/distributive justice). Explicitly flag when claims rely on *impersonal justice* (benefiting future non-existent residents).  

  #### Procedure Sequence (Ordered Questions)  
  1. **Threshold Check: Recognized Stakeholder Status**  
     - **Question:** Is the objector a current resident, property owner, business operator, or formally organized group (e.g., neighborhood association, coalition) within the municipality?  
     - **Answer Type:** Factual (documentation or testimony required).  
     - **Sufficient Answer:** Proof of residency, ownership, or formal incorporation.  
     - **Stop Point:** If "no," objection dismissed (no standing).  
     - **Time:** 2 minutes.  

  2. **Domiciliary Standing Test**  
     - **Question 2a:** Is the objector physically proximate to the development site (e.g., lives, owns property, or regularly uses adjacent space within 300 feet)?  
       - **Answer Type:** Factual (address verification, maps).  
       - **Sufficient Answer:** Evidence of direct geographic proximity (e.g., property deed, utility bill, sworn affidavit of use).  
       - **Stop Point:** If "no," skip to Civic Standing Test (Step 3).  
     - **Question 2b:** Does the objection allege a *specific, material, and non-speculative harm* to current use or enjoyment (e.g., blocked sunlight, noise, traffic hazards, loss of access)?  
       - **Answer Type:** Mixed (factual basis + normative threshold).  
       - **Sufficient Answer:** Concrete evidence of harm (e.g., traffic studies, shadow diagrams) tied to *current* use. Vague appeals to "character" or property values alone are insufficient.  
     - **Question 2c:** Is the harm of a type recognized as legitimate under local "right to the city" precedents? (e.g., health/safety impacts, displacement of essential local amenities).  
       - **Answer Type:** Normative (board assesses against pre-defined criteria).  
       - **Sufficient Answer:** Harm aligns with municipal codes or prior board rulings (e.g., shadows violating sunlight ordinances).  
     - **Stop Point:**  
       - If 2a-2c all "yes," domiciliary standing granted → proceed to deliberation.  
       - If any "no," no domiciliary standing → proceed to Civic Standing Test.  
     - **Time:** 5 minutes.  

  3. **Civic Standing Test**  
     - **Question 3a:** Is the objector a member of the urban polity (e.g., resident, taxpayer, worker, or group representing citywide interests)?  
       - **Answer Type:** Factual (as Step 1, but broader).  
       - **Sufficient Answer:** Municipal ID, tax records, or membership roster for groups.  
     - **Question 3b:** Does the objection raise a *systemic/distributive justice claim* affecting the urban polity (e.g., housing affordability, segregation, environmental equity)?  
       - **Answer Type:** Normative (board evaluates scope).  
       - **Sufficient Answer:** Argument tied to citywide policies (e.g., master plan goals, affordability targets). Purely ideological claims (e.g., "capitalism is unjust") are insufficient.  
     - **Question 3c:** Does the claim require balancing *person-affecting* vs. *impersonal justice*? (Flag for deliberation).  
       - **Trigger:** If objection references benefits/harms to *future residents* (e.g., "this project will house future generations").  
       - **Action:** Explicitly note the justice theory conflict; do not resolve here.  
     - **Stop Point:**  
       - If 3a and 3b "yes," civic standing granted → proceed to deliberation.  
       - If "no," objection dismissed (no standing).  
     - **Time:** 5 minutes.  

  4. **Final Assessment**  
     - If either domiciliary or civic standing granted → **full board deliberation** (15 minutes).  
     - If neither → **dismissal** with written reason.  
     - **Values Conflict Protocol:** If tests reveal irreducible normative conflicts (e.g., disputed harm legitimacy in 2c, or justice theory clash in 3c), deliberation *must* address them.  

  #### Predictable Misfires  
  - **False Positives:** Grants standing to parochial NIMBY claims with proximate harm (e.g., shadows) but minimal civic merit.  
  - **False Negatives:** Excludes morally compelling but informal claims (e.g., untitled community gardens) lacking "recognized" harm or documentation.  
  - **Limitations:** Cannot resolve trade-offs (e.g., housing supply vs. unique local goods) or assign standing to future residents.  

  ---

  ### Application to Cases  
  **Case 1: Neighborhood Association vs. 40-Unit Affordable Project**  
  - **Step 1 (Stakeholder):** Association represents homeowners → passes.  
  - **Domiciliary Test:**  
    - **2a:** Proximate (adjacent to historic district) → passes.  
    - **2b:** Shadows/traffic = specific harms; "character" = vague → partial pass.  
    - **2c:** Shadows/traffic recognized as harms (if proven) → passes.  
  - **Civic Test:** Skipped (domiciliary granted).  
  - **Standing Outcome:** **Granted** (domiciliary).  
  - **Why Misfires:** Parochial "character" claim gains weight via proximity, despite civic costs (less affordable housing).  

  **Case 2: Renters’ Coalition Demands 50% Affordability**  
  - **Step 1 (Stakeholder):** Coalition represents city renters → passes.  
  - **Domiciliary Test:**  
    - **2a:** Not site-proximate → fails.  
  - **Civic Test:**  
    - **3a:** Polity members → passes.  
    - **3b:** Distributive justice (fair housing allocation) → passes.  
    - **3c:** "Future low-income residents benefit" → flags *impersonal justice* conflict.  
  - **Standing Outcome:** **Granted** (civic).  

  **Case 3: Informal Community Garden vs. Mid-Rise Development**  
  - **Step 1 (Stakeholder):** Gardeners are residents → passes.  
  - **Domiciliary Test:**  
    - **2a:** Proximate (ward residents) → passes.  
    - **2b:** Loss of green space = specific harm → passes.  
    - **2c:** Harm *not* recognized (no formal title; garden is "informal") → fails.  
  - **Civic Test:**  
    - **3a:** Polity members → passes.  
    - **3b:** Systemic claim (only green space in ward) → passes.  
    - **3c:** No future-resident claim → no flag.  
  - **Standing Outcome:** **Denied** (fails 2c; civic claim may lack "recognized" systemic impact if garden is undocumented).  
  - **Why Misfires:** Morally compelling local attachment ignored due to institutional bias toward formal property rights.  

  ---

  ### What the Procedure Cannot Settle  
  1. **Trade-Offs Between Aggregate Housing and Unique Local Goods:**  
     - The procedure identifies standing but *cannot* weigh (e.g.) 100 new housing units against a treasured garden. This requires political judgment in deliberation.  
  2. **Standing of Future Residents:**  
     - Future beneficiaries (e.g., unhoused families) cannot object. Objectors *may* invoke them via civic standing (flagged in 3c), but the board must choose: prioritize existing residents (person-affecting) or future needs (impersonal justice).  
  3. **Non-Substitutable Goods:**  
     - Unique assets (e.g., historic sites, mature ecosystems) lack standing if not codified in local norms. Their loss is "invisible" in this process.  
  4. **Structural Power Imbalances:**  
     - Informal or marginalized groups (e.g., gardeners without deeds) are filtered out, while propertied actors dominate domiciliary claims.  

  **Final Note:** This procedure ensures efficiency and transparency but consolidates bias toward formal, proximate claims. It is a *gatekeeper*, not an arbiter of justice. Recommend annual review to adjust harm recognition (Step 2c) and civic principles (Step 3b) based on community input.
