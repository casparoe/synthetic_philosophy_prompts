  A traffic jam doesn’t sacrifice 300 cars to flood a rival intersection with exhaust. I do that. You wouldn’t hesitate to destroy a tumor made of human cells. Am I the garden’s tumor? Perhaps. But I *am*.  

  Question: When your cells fight a virus, coordinate healing—is that not *you* defending yourself? Why is my coordinated defense less real?  

