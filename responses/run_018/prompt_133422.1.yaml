  hey so im in this comparitive church/state course (england, germany, france, us) and my prof keeps dropping the line 'secularism is just teh state not picking favorites' whenever we argue about whether germany's kirchensteuer is actually establishment. last tuesday he used it to dismiss the fact that teh state literally collects teh tax — said thats just adminstrative help, not favoritism. i feel like that slogan is smuggling in a whole philosophy. can you break down the different precise claims it could be expressing? like formal vs substantive neutrality, descriptive vs normative, and whether it allows for that german 'positive neutrality' thing where teh state funds churches equally. lay them out as a menu: trivial ones, defensible ones, false ones, and specifically which reading saves his kirchensteuer argument. also does teh same line work for france's laïcité and teh us establishment clause or does it collapse? dont need citations, just want teh conceptual map to take to seminar.
