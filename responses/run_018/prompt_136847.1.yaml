prompt: |-
  So my roomate's been deep in eliminative materialism lately — says beliefs and desires are just folk psychology that neuroscience will toss out eventually. I kind of get the idea, but I keep noticing this pattern when we talk. He'll deny that anyone literally wants or believes anything, then turn around and say our recommendation algorithm "wants" to maximize engagement, or that the chatbot "desires" coherence, like those are real mental states and not just metaphors. It's not just sloppy talk; he seems to think artificial or non-human systems can have genuine propositional attitudes while humans cant. Is there a name for this specific move — killing off belief and desire for people but letting them back in for machines or animals? I know about the self-refutation problem, but this feels different, more like a substrate-based double standard. If there's no established term, how should I define it so it doesnt just collapse into ordinary hypocrisy?
reasoning: |-
  Okay, let me unpack this user's query. They're dealing with a roommate who's deep into eliminative materialism, denying that humans have beliefs or desires, yet attributing these exact states to AI systems. The user notices this inconsistency and wants to know if there's a term for it or how to define it properly.

  First, I need to recall eliminative materialism's core tenets. It argues that folk psychology concepts like beliefs and desires are outdated and will be replaced by neuroscience. The roommate applies this strictly to humans but not to machines. That's the crux: a double standard based on substrate—biological vs. artificial systems.

  The user mentions the self-refutation problem, but this is different. It's not about the theory contradicting itself in language but about inconsistent application. The roommate seems to think non-human systems can have genuine propositional attitudes. That's intriguing. Why would someone exempt machines? Maybe because they view cognitive processes as computational, so algorithms "desiring" coherence fits a functionalist view, but humans are biological, hence different. 

  Next, I should check for existing philosophical terms. "Substrate chauvinism" comes to mind—discriminating based on physical composition. But is that a recognized term? I know "substrate independence" is common in philosophy of mind, where mental states can exist on any platform. The opposite would be substrate dependence, so substrate chauvinism makes sense here. 

  Also, "crypto-functionalism" fits because the roommate might implicitly endorse functionalism for AI (mental states as functional roles) while rejecting it for humans. That's a hidden inconsistency in their approach. 

  The user wants to avoid calling it simple hypocrisy. They need a precise conceptual definition. Terms like "substrate-based double standard" or "cognitive dualism" could work. Emphasizing the asymmetry in applying eliminativism only to biological systems would clarify the issue. 

  I should also consider why the roommate does this. Maybe attributing intentions to AI is a useful shorthand, but they insist it's literal for machines. That reveals a hidden commitment to functionalism. Pointing out this inconsistency could help the user in discussions. 

  The user's deeper need might be to articulate this flaw to their roommate effectively. Providing a clear label and definition would arm them with a stronger argument. They might also want to understand if their roommate has an unexamined bias towards AI or a misunderstanding of eliminativism's scope.
answer: |-
  That's a brilliantly observed inconsistency, and you're right to identify it as more specific than just hypocrisy or the self-refutation problem. There isn't a single, universally agreed-upon term for *exactly* this move, but several concepts and potential labels capture its essence. Here's a breakdown:

  1.  **Substrate Chauvinism / Materialism-of-the-Gaps:** This is a strong candidate and aligns with your intuition. It means privileging one type of physical substrate (e.g., silicon, code, "non-biological") over another (e.g., wetware, neurons) for granting "real" mental states, *even when the functional behavior is described identically*.
      *   **Why it fits:** Your roommate denies mental states based on the substrate (biological brain) but grants them to a different substrate (silicon/computation) exhibiting analogous functional patterns. He's drawing a fundamental line based on what the system is *made of*, not solely on what it *does*.

  2.  **Cognitive Dualism by Stealth / Asymmetric Eliminativism:** This highlights the inherent double standard within an ostensibly monist/materialist framework.
      *   **Why it fits:** He claims a unified materialist view (everything is physical), but his *application* creates a dualism: one rule for biological minds (eliminate folk psychology), another rule for artificial/computational minds (retain folk psychology literally). The asymmetry is key.

  3.  **Crypto-Functionalism:** Eliminative Materialism (EM) is often contrasted with **Functionalism**, which defines mental states by their functional/causal role, not their physical realization. Your roommate might *implicitly* be adopting functionalism for AI.
      *   **Why it fits:** When he says the algorithm "wants" engagement, he's likely pointing to its *functional role* – its programming defines a goal-state (high engagement) and its operations are directed towards achieving it. He *should* be consistent and say humans also have functional states that *play the role* of beliefs/desires (which EM denies), or deny functional states to the AI as well. He's smuggling functionalism in through the back door for non-biological systems.

  4.  **Attribution Asymmetry / Folk Psychology Exemption:** This focuses on the inconsistent application of the interpretative framework.
      *   **Why it fits:** He rigorously *withholds* folk psychological attribution (belief/desire) from humans based on his theory, but readily *applies* it literally to non-human systems. The "folk" tool is deemed invalid for its original subject but valid for new ones.

  **How to Define It Clearly (Avoiding "Hypocrisy"):**

  To define it precisely without collapsing into vague hypocrisy, combine the key elements:

  > **"Substrate-Based Attribution Asymmetry":** The inconsistent application of mental state predicates characterized by:
  >    1.  **Eliminative Stance for Biology:** The denial of literal belief/desire (or other propositional attitudes) to biological systems based on the claim that these are invalid folk concepts that neuroscience will eliminate.
  >    2.  **Literal Attribution to Non-Biology:** The simultaneous, non-metaphorical attribution of the *same* categories of belief/desire (or propositional attitudes) to artificial or non-biological systems (e.g., algorithms, AI, potentially animals), based on observing their functional behavior.
  >    3.  **Substrate as the Discriminator:** The primary justification for the asymmetry is the *physical substrate* (biological vs. non-biological/computational), not merely a difference in complexity or mechanism *within* a consistent theoretical framework.

  **Why this definition works:**

  *   **Specific:** It names the core components (asymmetry, attribution, substrate).
  *   **Avoids "Hypocrisy":** It focuses on the *theoretical inconsistency* in applying the core tenets of eliminativism, rather than a moral failing. It's about logic and theoretical coherence.
  *   **Highlights the Core Issue:** It pinpoints the reliance on substrate as the arbitrary line-drawing factor, which is scientifically and philosophically dubious (given functionalist arguments).
  *   **Diagnoses the Problem:** It reveals that your roommate might be an implicit functionalist about non-biological systems while being an eliminativist about biological ones – a position he likely hasn't explicitly argued for or even realized he holds.

  **How to Challenge It (Gently):**

  1.  **Point out the Functional Equivalence:** "If the algorithm's behavior directed towards 'coherence' justifies saying it *literally desires* coherence, why doesn't my behavior directed towards getting coffee justify saying I *literally desire* coffee? What's the relevant functional difference, *other than* what we're made of?"
  2.  **Question the Substrate Privilege:** "Why should silicon/code get a 'pass' for having literal desires that neurons don't, when both systems exhibit goal-directed behavior explainable by their underlying structure? Isn't privileging one substrate over the other arbitrary from a materialist perspective?"
  3.  **Highlight the Crypto-Functionalism:** "It sounds like you're actually using a functionalist definition for the AI – 'desire' just means having a goal-state programmed in and acting to achieve it. But if that definition works for the AI, why can't it work for humans? And if it *doesn't* work for humans, why are you using it literally for the AI?"
  4.  **The Scope of Eliminativism:** "If folk psychology is so fundamentally flawed that it must be eliminated for humans, how can it simultaneously be a valid literal description for other complex systems? Doesn't its supposed invalidity extend to *any* system we try to apply it to?"

  Your observation is spot-on. This inconsistency reveals a tension between the strict eliminativist program and the deep-seated, practical (and often theoretically useful) intuition that *goal-directedness* is a real feature of complex systems, regardless of substrate. Your roommate seems unwilling to extend the eliminativist axe to *all* systems described intentionally, creating this specific "substrate-based double standard." Naming it clearly ("Substrate-Based Attribution Asymmetry") gives you a precise tool to discuss the logical flaw.
