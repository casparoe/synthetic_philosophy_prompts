prompt: |-
  Me and two friends run a tiny board game studio — one published game, one in prototype, a blog where we post playtest postmortems. I keep arguing with myself about who owns what, so here are my gut verdicts and I want the principle behind them, if there is one. And I dont want the law: I know roughly what the law says, that mechanics basically arent protectable, that you'd need a patent, whatever. I want what makes sense of the gut.

  1. A bigger studio ships a game built on our central loop — the same three-step thing that makes ours ours — but their own art, their own rules text, not a word copied. Not fine, I'm furious.
  2. A designer who has never seen our game ships a structurally identical loop. Fine, hard luck.
  3. Someone played our game at a con six years ago, genuinely forgot, then came up with the loop themselves. Not fine, but way less bad than 1, and I genuinely dont know what I'd want done about it.
  4. Someone reads our postmortems where we list the twelve variants we playtested and killed, and skips all twelve. Barely bothers me — which is strange, since in 1 it's the creative part that got taken.
  5. Someone takes the loop and fixes the bit we never got right; the fix is clearly theirs and their version is better than ours. I dont like it, but id struggle to say they owe us.
  6. Turns out three other designers demoed near-identical loops the same year we did, none of them had seen ours. My sense of owning it dropped when I found out — yet I still think the copier in 1 did something wrong, just worth less.
  7. Someone fed our rulebook to a language model and asked for a game with the same central loop; no text or art in common with ours. Not fine.
  8. We used a model trained on other people's games to help design ours. Obviously fine.
  9. Our game's been out of print eight years, we never enforced anything, someone revives the loop. I feel almost nothing. Maybe fine.
  10. A guy sells a game on our loop in a language we dont publish in, to people whove never heard of us. Nothing. Which cant be right.

  My own stab is: I own whatever you couldnt have reached unless I went first. That handles 1 and 2 but 7 and 8 dont both fit, and 4 and 9 dont either. Is there one principle that gets most of these, or a small set, which clause does each case motivate, and which of my verdicts does it force me to drop? Then: what does your principle say about two cases I have no verdict on — a fan mod that requires you to own a copy of our game and makes nobody any money, and a company that uses the loop in an internal training exercise it never sells? And which single hypothetical case would best tell the surviving candidate principles apart?
reasoning: |-
  Okay, let me try to unpack this user's query. They run a small board game studio and are grappling with the ethical ownership of game mechanics, especially their central game loop. They've listed ten scenarios with their gut reactions and want a principle that explains these feelings without relying on legal terms. 

  First, I need to understand their core struggle. They feel a strong sense of ownership when someone directly copies their loop after exposure (scenario 1), but not when it's independently created (scenario 2). There's nuance in scenarios like accidental copying (3) or using their failed prototypes (4). The user also mentions scenarios involving AI (7 and 8) which show a conflict in their initial principle about "owning what couldn't be reached without them."

  Hmm, the key seems to be the combination of exposure and labor. When someone benefits from their specific work—like playing their game or reading their postmortems—and then creates something similar, it feels like theft. But if the creation is independent, even if identical, it doesn't. That explains why scenario 4 (using their killed variants) doesn't bother them much—it's labor they discarded, so no loss. 

  The AI scenarios are tricky. Feeding their rulebook to an AI (7) feels wrong because the AI leverages their labor directly. But using an AI trained on others' work (8) is fine since their labor isn't exploited. This ties back to the labor-exposure link. 

  Scenarios 9 and 10 involve no ongoing effort or market impact from the user, so their sense of ownership fades. The abandoned game or untapped market means their labor isn't being undermined. 

  For the unresolved cases: a fan mod requiring their game would be fine—it's additive and non-commercial. An internal training use might feel odd but not harmful since it doesn't compete. The best test case? Probably scenario 3 (forgotten exposure) to see if the principle holds when intent is absent but exposure occurred. 

  The user's initial principle ("own what couldn't be reached without me") almost works but stumbles on AI and discarded ideas. Reframing it as "ownership of labor when exploited by others" covers more ground. It acknowledges that value comes from work, and someone profiting off that specific work without acknowledgment feels wrong, even if the output isn't identical. This principle keeps most of their gut reactions intact, only needing slight tweaks on scenario 3 (accidental copying) and 4 (discarded variants), where labor exploitation is minimal or absent.
answer: |-
  Your gut reactions reveal a coherent ethical principle: **You own the *value derived from your specific labor and creative risk*, but only when someone *exploits your work directly* to bypass that effort.** This handles nearly all scenarios by focusing on two key elements: **exposure to your work** and **extraction of your labor**.

  Here's how it breaks down:

  ### Core Principle:
  - **Labor Ownership**: Your creative work (playtesting iterations, rulebook writing, prototype refinement) generates unique value.
  - **Exploitation Threshold**: Copying becomes unethical when it uses *your specific output* to skip equivalent labor/risk, especially if it harms your opportunity.

  ### Your Cases Analyzed:
  1. **Not fine**: They exploited your labor (your published game) to skip developing the core loop. Direct exposure + labor extraction.
  2. **Fine**: No exposure → no exploitation. Coincidence isn't theft.
  3. **Not fine, but messy**: They *did* exploit your labor (con exposure gave them the loop), even if forgotten. Your anger is ethical, but intent matters for consequences. Acknowledgment/royalty might feel fair.
  4. **Barely bothers you**: You discarded those variants; they weren't part of your final labor investment. No value extracted.
  5. **Struggle to claim ownership**: They added significant new labor (the fix). Your labor was a starting point, but theirs dominates the value.
  6. **Ownership diluted**: Discovery proves the loop wasn't *unique* labor (reducing its value), but the copier in #1 still exploited *your specific work*.
  7. **Not fine**: The AI extracted insight from your rulebook (your labor). They skipped conceptual work using your output.
  8. **Fine**: The model’s training on others’ work isn't *your* labor being exploited. You did your own prototyping/playtesting.
  9. **Fine**: Your labor’s commercial value expired; no ongoing opportunity harmed.
  10. **Nothing (but should bother?)**: They *are* exploiting your labor (your design), but in a market you didn’t serve. Principle says "not fine," but your reaction suggests an **opportunity clause**: *If no market overlap exists, exploitation is ethically neutral.*

  ### Exceptions & Refinements:
  - **#10 conflicts**: Add "**without harming your opportunity**" to the core principle. No market overlap = no harm.
  - **#3’s ambiguity**: Intent mitigates blame, but labor was still exploited. A "**reasonable effort**" clause might apply: *If they couldn’t reasonably recall your work, it’s functionally independent creation.*

  ### Final Principle:
  **"You own compensation for the value of your creative labor when others directly use your work to avoid equivalent effort or risk, *and* it impedes your opportunity."**

  ### Unresolved Cases:
  - **Fan mod requiring your copy, non-commercial**: **Fine**. No labor exploitation (they bought your game) and no opportunity harm. Celebrates your work.
  - **Internal company training using your loop**: **Bothers you** (labor exploited without credit), but **ethically acceptable** if truly non-commercial. No opportunity harm, but attribution would feel fair.

  ### Decisive Test Case:
  **"A designer plays your prototype at a con, signs an NDA, then quits their job and publishes a near-identical game 18 months later. They claim they ‘reinvented’ it."**  
  - **Labor Exploitation Principle**: Not fine (they used your labor to skip R&D).  
  - **"Couldn’t Have Reached Without Me" Principle**: Ambiguous (maybe they *could* have?).  
  - **"Direct Exposure" Principle**: Not fine (proven access).  

  Your principle wins: The NDA proves they knowingly exploited your labor.

  ### Why Your Initial Stab Failed:
  - *"Couldn’t have reached without me"* ignores **discarded labor** (#4) and **independent creation** (#2, #6).  
  - It also struggles with **AI** (#7 vs. #8): The model in #7 *specifically used your output*, while #8 used generalized data.  

  ### Key Insights:
  - **Ethics ≠ law**: Your gut cares about **fairness**, not IP categories.  
  - **Labor > novelty**: Your anger peaks when labor is harvested (#1, #7), not when ideas converge (#2).  
  - **Opportunity matters**: If no loss is possible (#9, #10), ownership feels irrelevant.  

  **TL;DR**: Your gut demands **reciprocity**. When others profit from *your* effort without doing the work *themselves*, it feels like theft. When they build independently or build *upon* your work visibly, it feels fair. The law can’t protect this, but your community’s respect will.
