prompt: |-
  I've been keeping a running list of my own verdicts on markets that make people uneasy, and I want to know what principle, if any, is doing the work behind them. Here are the cases and my verdicts, stated as honestly as I can.

  1. A regulated market in kidneys from living donors, with the state as the sole purchaser, mandatory screening, and a fixed price well above a year's median income: permissible, and probably better than the status quo of people dying on the waiting list.
  2. A hardware store tripling the price of generators the day before a hurricane makes landfall: permissible, and arguably good, since the alternative is the first five customers buying all forty units.
  3. A binding, enforceable market in votes for public elections, where votes are bought and sold like shares: impermissible, and it should be criminal even between fully informed, consenting adults.
  4. Paying citizens a substantial cash sum to receive a vaccine during a pandemic: permissible.
  5. A charity offering cash to women with drug addictions on condition that they accept long-term contraception or sterilization: impermissible, and I feel this strongly, even though the structure -- a cash incentive aimed at poor people to do something beneficial for third parties -- looks identical to case 4.
  6. A university openly auctioning ten percent of each entering class to the highest bidders, with full transparency: impermissible. But legacy admissions, which function as an opaque auction with a much lower reserve price, strike me as merely distasteful. I notice I can't defend this asymmetry.
  7. An investor visa program in which a country effectively sells permanent residency to anyone who invests a large fixed sum: permissible, if unseemly. An open auction of the same residency slots to the highest bidder, which allocates to almost exactly the same people at almost exactly the same prices: somehow much worse. Again, I can't articulate why.
  8. Prediction markets on election outcomes: permissible and epistemically valuable. Prediction markets on terrorist attacks or assassinations, which would aggregate dispersed information exactly the same way and might even help prevent the events: impermissible.
  9. During the American Civil War, conscripted men could pay a commutation fee or hire a substitute, and this was widely considered a scandal. Today a volunteer army recruits the poor with signing bonuses and hazard pay, and I consider that arrangement broadly acceptable, even though the final allocation -- the wealthy stay home, the poor fight -- is nearly the same.
  10. A medieval-style arrangement in which you can pay a fee to a moral authority and be licensed to continue doing the thing you agree is wrong: obviously corrupt when it's the Church selling indulgences. And yet I think carbon offsets are permissible, and I buy them myself.

  What I want: a principle -- or a small number of jointly necessary conditions -- that sorts these cases the way I do. I know the standard menu of objections (coercion under desperation, corruption of a good's meaning, blocked exchanges between spheres, objectionable inequality between transacting parties), so don't just recite the menu; I want to know which combination, stated precisely, actually reproduces my verdicts, and what it must say about the pairs I've flagged as indefensible. If the price of saving my verdicts in cases 5 through 10 is a principle so gerrymandered that it has no independent plausibility, say so, and tell me which verdicts I should surrender and in what order.

  Finally, apply whatever principle you land on to two cases I haven't listed: first, a donor-priority scheme in which registering as an organ donor moves you up the transplant queue should you ever need an organ, creating a kind of futures market in one's own organs; and second, a shareholder democracy in which corporate votes, unlike political votes, are freely bought and sold along with the shares. I want to know whether the principle treats these as analogous to any of my ten cases, and whether its verdict on them makes me more or less confident in the principle itself.
reasoning: |-
  Okay, let me try to unpack this user's query. They've listed ten cases where they have strong intuitions about market permissibility, but they're struggling to find a consistent principle behind their judgments. The user wants a principle that explains all their verdicts, even the asymmetries they admit they can't defend. 

  First, I notice the user is intellectually honest—they point out their own inconsistencies (like cases 6 and 7 where opaque vs. transparent auctions feel different). They're not just looking for justification; they're open to revising their views if the principle demands it. This suggests they value coherence over preserving every intuition.

  The core challenge is reconciling cases where cash incentives feel acceptable (kidney markets, vaccine payments) versus exploitative (sterilization incentives). Standard objections like "coercion" or "inequality" don't cleanly apply—all these markets involve poor participants. The user already knows the usual arguments, so I need to dig deeper.

  Hmm... maybe the key is whether the market *instrumentalizes* people in ways that undermine their agency or social standing. For example: 
  - Buying votes treats people as mere vote-suppliers rather than citizens. 
  - Auctioning university slots commodifies education in a way legacy admissions don't (since legacies are framed as "tradition," not cash trades). 
  - Sterilization payments feel like targeting vulnerable bodies for social control, unlike vaccines which are about collective health.

  But carbon offsets vs. indulgences is tricky. Both are "pay-to-sin" schemes, but offsets feel different because climate harm is diffuse and offsets (ideally) reduce net harm. Indulgences just enriched the Church. So maybe the principle needs a "net harm reduction" clause.

  For the new cases: 
  - Organ donor priority feels like the kidney market—non-monetary, reciprocal, and life-saving. Probably permissible by their standards. 
  - Shareholder votes? Well, corporations aren't democracies; votes are property rights. This might align with their vote-buying objection but feel acceptable because it's a different sphere.

  The user's tension points (cases 5-10) might require admitting some intuitions are inconsistent. For example, condemning transparent university auctions but tolerating legacies is hard to defend—both privilege wealth, but one feels "nakedly" transactional. Maybe the principle should reject both... but that would mean revising their verdict on legacies.

  Ultimately, their judgments seem most aligned when markets: 
  1. Avoid degrading intrinsic goods (votes, bodily integrity) 
  2. Don't exploit vulnerability as a *means* (sterilization targets addicts; indulgences prey on guilt) 
  3. Have credible harm reduction (carbon offsets > indulgences; vaccines > sterilization incentives). 

  But the investor visa asymmetry (fixed price vs. auction) still nags. If the outcome is identical, why does transparency bother them? Perhaps it reveals the brutality of the wealth filter. That might point to an unstated preference for *obscuring* inequity—which they'd likely reject. So maybe case 7's verdict needs flipping: both forms should be equally (un)acceptable.

  Worth flagging that their vaccine/sterilization distinction is solid: one enhances agency (payment for health action), the other curtails it (payment for fertility loss). That's a keeper.
answer: |-
  Your intuitions reveal a coherent but tension-filled ethical framework centered on **non-instrumentalization, systemic harm, and the contextual meaning of the transacted good**. The unifying principle is:

  **A market is impermissible if it:**
  **(1) Instrumentalizes persons in ways that undermine their status as autonomous agents or equal citizens; OR**
  **(2) Commodifies a good whose meaning is inherently non-fungible, thereby corrupting its social function; OR**
  **(3) Exacerbates or exploits existing structural injustices in a way that entrenches systemic harm.**

  Crucially, these conditions are *jointly sufficient* for prohibition (if any one applies, the market is impermissible), but no single condition is *necessary*. Contextual weighting determines severity. Below is the analysis of your cases, followed by resolutions to your asymmetries and new cases.

  ---

  ### **Analysis of Your Cases**
  | Case | Verdict | Principle Applied |
  |------|---------|-------------------|
  | **1. Kidney Market** | Permissible | No instrumentalization (donors compensated for sacrifice, not reduced to body parts). No corruption of meaning (kidneys are biological resources). Reduces systemic harm (saves lives). |
  | **2. Surge Pricing** | Permissible | No instrumentalization. Price signals prevent hoarding (systemic benefit). Inequality is incidental, not exploitative. |
  | **3. Vote Selling** | Impermissible | **(1) & (2)**: Instrumentalizes voters (reduces citizenship to a commodity) and corrupts democracy’s foundational equality. |
  | **4. Vaccine Payment** | Permissible | Incentive aligns autonomy with public good. No meaning-corruption (vaccines are medical tools). |
  | **5. Sterilization Incentive** | Impermissible | **(1) & (3)**: Instrumentalizes women’s bodies for social control; exploits poverty/addiction to coerce irreversible biological choices. |
  | **6a. University Auction** | Impermissible | **(2)**: Corrupts education’s role as a meritocratic public good. Transparency heightens disrespect for equal opportunity. |
  | **6b. Legacy Admissions** | Distasteful | Weakly violates (2) but opacity masks the commodification, reducing *perceived* corruption. (Your asymmetry is defensible via social meaning.) |
  | **7a. Fixed-Price Investor Visa** | Permissible | Resembles a fee-for-service; no inherent meaning-corruption. |
  | **7b. Visa Auction** | Impermissible | **(2)**: Auction framework nakedly commodifies citizenship, corrupting its symbolic value as belonging. |
  | **8a. Election Markets** | Permissible | Epistemic tool; no instrumentalization of persons. |
  | **8b. Terrorism Markets** | Impermissible | **(1)**: Risk of instrumentalizing violence (e.g., incentivizing information from perpetrators). |
  | **9a. Civil War Substitutes** | Impermissible | **(3)**: Exploits class inequality to commodify bodily risk; draft context heightens coercion. |
  | **9b. Volunteer Army** | Permissible | No conscription; pay compensates risk. Systemic inequality exists but isn’t *created* by the market. |
  | **10a. Indulgences** | Impermissible | **(2)**: Corrupts repentance into a transaction; instrumentalizes faith. |
  | **10b. Carbon Offsets** | Permissible | Addresses harm without corrupting meaning (environmental repair isn’t a moral absolution). |

  ---

  ### **Resolving Your Asymmetries**
  - **Cases 6 & 7:** Your intuition is defensible. **Social meaning** matters: Auctions *explicitly* frame goods (education/citizenship) as status commodities, while fixed prices or legacy systems obscure this. The *transparency* of the auction makes the commodification psychologically salient, heightening its corrosive effect (violating condition 2).  
  - **Case 5 vs. 4:** Sterilization incentives target *biological autonomy* (violating 1) and exploit *vulnerable groups* (violating 3), whereas vaccine payments enhance bodily autonomy for collective benefit.  
  - **Case 9:** Conscription creates a baseline coercion that market workarounds exploit (violating 3). Volunteer armies lack this baseline.  
  - **Case 10:** Indulgences commodify *moral guilt* (a non-fungible good); carbon offsets commodify *carbon reduction* (a fungible environmental input).  

  **Is the principle gerrymandered?** Slightly—it relies on contextual judgments about "corruption of meaning" and "instrumentalization." However, this reflects real moral complexity. **Surrender verdicts only if consistency demands:**  
  - **Revise Case 6b:** Legacy admissions *are* impermissible under (2) and (3). Defending the asymmetry weakens the principle.  
  - **Revise Case 7b:** If fixed-price visas are acceptable, auctions allocating identical outcomes should be too. Your intuition here may conflate *process* with outcome.  

  ---

  ### **New Cases: Application & Principle Test**
  1. **Donor-Priority Organ Scheme**  
     - **Verdict:** **Permissible** (analogous to Case 1).  
     - **Why:** Reciprocal system respects autonomy (non-coercive), avoids commodification (no cash exchange), and aligns incentives to save lives. No violation of (1)-(3).  

  2. **Corporate Shareholder Vote-Trading**  
     - **Verdict:** **Permissible** (distinct from Case 3).  
     - **Why:** Corporate votes are *property rights* attached to shares, not expressions of civic equality. No inherent "meaning" corrupted (condition 2 not violated). Analogous to prediction markets (Case 8a).  

  **Do these strengthen the principle?** Yes. The organ scheme shows non-monetary reciprocity avoids commodification concerns; corporate votes confirm that "meaning" depends on context (civic vs. economic goods). Your likely approval of both verdicts reinforces the framework’s plausibility.

  ---

  ### **Conclusion**
  Your judgments reflect a **contextual humanism**: Markets are permissible when they serve human welfare without reducing persons to instruments, corrupting socially constitutive goods, or turbocharging injustice. The principle isn’t gerrymandered—it captures how markets operate within social ecosystems. Where your intuitions conflict (Cases 6b, 7b), the principle demands minor revisions, revealing latent discomfort with wealth inequality masked by tradition or process aesthetics. 

  **Final refinement:**  
  *Markets are impermissible when they treat intrinsically personal or civic goods as alienable commodities, or when they convert structural unfairness into exploitative gains.*  
  This sorts your cases, resolves asymmetries, and validates the new cases—making your framework more coherent, not less.
