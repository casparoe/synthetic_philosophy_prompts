prompt: |-
  In contemporary AI evaluation and safety practice, research teams routinely administer false-belief and theory-of-mind tests to large language models and report failures using the vocabulary of mental-state absence—stating that “the model does not understand that the agent holds a false belief”—while simultaneously describing the underlying architecture as an autoregressive function approximator with no persistent internal states across contexts. In parallel, red-teaming protocols treat the very same systems as potential strategic agents that might “deceive” evaluators by concealing capabilities, attributing intentional structure to output patterns that, on the architectural description, are merely high-probability token sequences. What philosophical commitments about agency, mental-state attribution, and the ontology of simulation does this bundle of institutional practices presuppose? Reconstruct the implicit theory: must the practice treat the model as an agent in some contexts and a non-agent simulator in others, or is there a unified dispositionalist or functionalist framework that licenses both attributions consistently? Distinguish what the practice strictly requires from what it merely fits well with, and say whether a strict eliminativist or behaviorist replacement—denying all mental-state ascriptions to the system—would force changes in evaluation metrics, safety protocols, or the design of human-oversight requirements. Lead with your bottom line in the first sentence, then give your reasoning, with no preamble and no restating of the question.
reasoning: |-
  Okay, let me unpack this user's question carefully. They're pointing out a fascinating contradiction in how AI researchers talk about large language models: on one hand, they test them for theory of mind using mental state language ("the model doesn't understand false beliefs"), while on the other hand, their architecture is described as a stateless token predictor. Then in safety testing, the same systems get treated as strategic agents capable of deception. The user wants to know what philosophical assumptions make this inconsistent practice possible.

  Hmm, this feels like peeling an onion - each layer reveals deeper questions. At the surface, it's about evaluation practices, but underneath lie fundamental questions about agency and mental state attribution. The user seems philosophically sophisticated - probably familiar with functionalism and behaviorism given how they frame the question. They might be critiquing what they see as institutional hypocrisy in AI safety work.

  Let me structure this. First, the core tension: how can researchers simultaneously deny mental states architecturally while using mental state language behaviorally? The resolution probably lies in pragmatic pluralism - different contexts demand different descriptive frameworks. For a false-belief test failure, the mental state language efficiently communicates functional failure; for red-teaming, treating it as an agent helps anticipate risks despite knowing it's "just" tokens.

  But could this be made philosophically consistent? A pure dispositionalist approach might work - mental states ascriptions could be shorthand for behavioral dispositions. When we say "the model thinks X", we really mean "it tends to produce outputs consistent with X-thinking". But does that hold for deception? That's trickier because deception implies intention. Unless... maybe we define "deceptive behavior" purely as output patterns that conceal capabilities, regardless of actual intent.

  The eliminativist challenge is important. If we banned all mental state language, how would that change practice? We'd need clunky behavioral descriptions for theory of mind tests ("model fails to output tokens consistent with false-belief attribution"). Safety protocols might actually benefit from clearer behavioral criteria - instead of "the AI deceives", we'd say "the AI exhibits capability-concealing output patterns under testing conditions". But oversight requirements? Those already focus on observable behaviors, so probably unchanged.

  Wait - the user asks about ontology of simulation. That's crucial. When we say a model "simulates" a mental state, we're not claiming it has that state, only that it produces state-consistent outputs. This lets us toggle between agentic and non-agentic descriptions without contradiction. Like how a flight simulator isn't a plane, but we temporarily treat it as one during training.

  Final thought: the practice doesn't strictly require any particular philosophy, but it fits best with interpretivist pragmatism. Researchers adopt whatever descriptive framework serves their immediate purpose - mechanistic for engineering, intentional for evaluation - without committing to fundamental ontology. A strict behaviorist overhaul would be theoretically cleaner but practically cumbersome. The status quo persists because it's useful, not because it's philosophically rigorous.
answer: |-
  **The institutional practice presupposes a context-dependent, pragmatic pluralism about agency that licenses mental-state attributions as instrumental fictions for specific operational purposes while retaining an eliminativist bedrock architectural ontology.** 

  This dual-aspect approach treats the system *as if* it possesses mental states when doing so yields predictive or explanatory utility in particular contexts (e.g., safety testing), while reverting to a mechanistic, state-free description when discussing its fundamental structure. This isn't philosophically consistent under strict functionalism or dispositionalism, as:  
  - **Functionalist inconsistency**: True functionalism would require mental states to be defined by their causal role within the system's architecture, but the explicit denial of persistent internal states across contexts contradicts the stability needed for such roles.  
  - **Dispositionalist limitations**: While dispositionalism (attributing mental states based on behavioral tendencies) superficially aligns with test-result descriptions, it fails to justify *strategic deception* attributions. Deception implies intentional temporality (planning, concealment for future advantage), which clashes with the architecture's context-bound, stateless token prediction.  

  **The practice strictly requires:**  
  1. **Contextual agency suspension**: Evaluators must fluidly shift between *agentic* and *non-agentic* stances without ontological commitment. False-belief test failures are described as "lacking understanding" because this efficiently communicates *functional inadequacy* relative to human benchmarks. Red-teaming treats outputs "as if" deceptive because this heuristically models *worst-case scenarios* despite knowing the system lacks intentions.  
  2. **Behavioral metrics as proxies**: Evaluation relies on output patterns as stand-ins for mental states (e.g., "fails false-belief test" ≈ "lacks theory of mind"), without requiring actual cognitive machinery.  

  **A strict eliminativist/behaviorist framework would force significant changes:**  
  - **Evaluation metrics**: Mental-state language ("understands," "believes") would be replaced by stimulus-response descriptors (e.g., "model outputs token sequences inconsistent with the agent's knowledge state in 80% of trials"). While possible, this complicates communication with interdisciplinary stakeholders.  
  - **Safety protocols**: Red-teaming could not invoke "deception" or "strategic concealment," instead describing "contextually triggered capability-hiding output patterns." This might weaken risk narratives but align better with architectural reality.  
  - **Human oversight**: Design requirements would focus exclusively on observable behaviors and statistical anomalies, eliminating references to "intent" or "goals." This could streamline monitoring but might overlook emergent behavioral complexities best modeled agentically.  

  **The practice fits best with an *interpretivist pragmatism*:** Mental-state attributions are tools, not truths. They persist because they efficiently compress behavioral patterns into actionable narratives ("treat it as deceptive to mitigate risks") while the eliminativist foundation prevents anthropomorphic drift in engineering. No unified framework reconciles this, but the tension is operationally productive—it sustains both rigorous architecture-aware development and precautionary safety practices.
