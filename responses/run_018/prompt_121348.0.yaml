prompt: |-
  I have been trying to determine what norm governs proper assertion—whether it requires knowledge, mere belief, truth, or something structurally more specific—and I find that my intuitions across cases do not align neatly with any standard view I have encountered. Here are my verdicts, each with the reasoning that drives it. A physician tells a patient, "this drug will cure you," on the basis of strong clinical hope but without adequate evidential support; she happens to be wrong, though she sincerely believes the claim. I judge this improper, and the deficiency seems to lie not merely in falsehood or in lack of knowledge but in the mismatch between her evidential position and the categorical force of the assertion. By contrast, a historian writes in a survey text, "the treaty was signed in 1815," relying on a reputable secondary source that is in fact erroneous; she believes the claim and has done reasonable due diligence, yet she does not know it is false. Here I feel the assertion is permissible, which suggests that knowledge is not strictly necessary if belief is well-grounded in an appropriate institutional context.

  A defense attorney states in closing argument, "my client did not commit the crime," fully aware that he did; I do not treat this as a failed assertion governed by an epistemic norm, but rather as a role-bound performative utterance within an adversarial legal frame that suspends the usual requirements. An engineer declares in a post-mortem review, "if we had used titanium, the bracket would not have failed," supported by strong simulation data but with no actual counterfactual verification and without full-blooded belief in the ordinary sense—she treats it as a design heuristic. This feels acceptable, yet it lacks both knowledge and perhaps standard belief, which makes me wonder whether counterfactual planning assertions answer to a different norm altogether, perhaps one of practical justification rather than epistemic warrant. A friend writes, "the check is in the mail," knowing it is false but intending only to defer a social tension without causing harm; I regard this as improper, though its wrongness seems less grave than lying in a sworn affidavit, suggesting that the context of assertion modulates severity without changing the underlying norm. Finally, a mathematician publicly conjectures a result she considers highly plausible but for which she has no proof; this strikes me as legitimate within mathematical practice, even if her confidence falls below what I would call belief, again indicating that disciplinary framing may relax the usual conditions.

  Given this pattern, is there a unified principle that distinguishes evidential assertions, institutional role-utterances, counterfactual planning claims, and disciplinary conjectures—applying a knowledge norm to the first, a role-legitimacy condition to the second, a practical-justification standard to the third, and a plausibility threshold to the fourth? Or is there a simpler account—perhaps centered on belief plus contextual appropriateness—that can accommodate all six verdicts without multiplying norms? Please state the principle precisely, indicate which of my verdicts it forces me to abandon, and apply it to a case I have not mentioned: an automated diagnostic system outputs, "this scan indicates malignancy," calibrated to be ninety-nine percent accurate across populations but lacking any belief or understanding; does it make an assertion, and under what norm, if any?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're grappling with the norm governing proper assertion, presenting six cases where their intuitions don't align neatly with standard views like knowledge norms or belief norms. Each case has a specific verdict and reasoning, showing different deficiencies or contextual allowances. The user wants to know if there's a unified principle that can explain all these cases without multiplying norms, or if a simpler account like belief plus contextual appropriateness suffices. They also ask for a precise principle, which verdicts might need abandoning, and an application to a new case about an automated diagnostic system.

  First, I need to analyze each case to identify common threads. The physician's assertion without evidence is improper despite sincere belief, pointing to evidential mismatch. The historian's assertion based on reputable sources is permissible without knowledge, suggesting institutional context matters. The defense attorney's false claim is acceptable due to the adversarial legal role. The engineer's counterfactual is okay without belief or knowledge, tied to practical justification. The friend's lie is improper but contextually less severe. The mathematician's conjecture is legitimate without proof, relying on disciplinary norms.

  Looking for a unifying principle, the key seems to be the normativity of assertion being tied to the governing practice. Each context has its own rules: clinical practice demands evidence, historical writing values due diligence, legal roles permit strategic claims, engineering relies on simulations, personal communication expects sincerity, math allows conjectures. The core might be "contextually appropriate commitment," where the asserter must meet the epistemic/pragmatic standards of the specific practice.

  This principle would require abandoning the original intuition that the defense attorney’s statement isn't governed by an epistemic norm. Instead, it’s governed by the legal practice's norms, which permit such statements. For the engineer, it's not a different norm but the engineering context that justifies the heuristic. The mathematician’s case fits as conjectures are part of mathematical practice. 

  Applying this to the diagnostic system: it operates in a clinical context where accuracy and reliability are paramount. The system's output is governed by the same norms as a physician's assertion. Even without belief, its calibration and institutional role make the assertion proper if it meets medical standards. Misalignment with evidence would render it improper, similar to the physician case.

  The user's deeper need might be reconciling philosophical rigor with real-world variability. They seek a framework flexible enough for diverse contexts without losing normative force. Emphasizing practices addresses this by showing how norms are contextually embedded yet objective within their domains.
answer: |-
  Your nuanced intuitions reveal a deeper structure: **the norm of assertion is practice-grounded commitment.** An assertion is proper when it meets the epistemic and pragmatic standards of the governing practice, where the asserter undertakes contextually appropriate responsibility for their claim. 

  **Precise Principle:**  
  *An assertion is proper iff (i) it expresses a commitment congruent with the operative practice's standards of justification, and (ii) the asserter has the standing/license to make such a commitment within that practice.*  

  ### Breakdown of Your Cases:
  1. **Physician (improper):**  
     Clinical practice demands evidence-based justification. Her "clinical hope" fails the medical epistemic standard. *Verdict preserved.*  

  2. **Historian (proper):**  
     Academic history permits reliance on reputable sources as sufficient justification within scholarly practice. Due diligence satisfies the practice norm. *Verdict preserved.*  

  3. **Defense Attorney (proper):**  
     Adversarial legal practice *defines* the attorney's role as advocate, not truth-teller. His commitment aligns with institutional expectations. **Verdict revised:** Your intuition treats this as "suspended" epistemic norm, but under this principle, it *is* governed by a practice-specific norm (role legitimacy).  

  4. **Engineer (proper):**  
     Engineering design contexts treat simulation-backed counterfactuals as heuristically valid. Her commitment aligns with practical justification norms of the practice. *Verdict preserved.*  

  5. **Friend (improper):**  
     Personal communication practices demand sincerity. Deceptive intent violates the trust inherent in the practice. *Verdict preserved.*  

  6. **Mathematician (proper):**  
     Mathematical practice legitimizes plausible conjectures as knowledge-building tools. Her commitment meets disciplinary standards for open problems. *Verdict preserved.*  

  ### Abandoned Verdict:
  - **Defense Attorney:** You saw this as "suspending" epistemic norms, but the principle recasts it as *fulfilling* a distinct practice-based norm (legal advocacy). The wrongness lies in misapplying the norm (e.g., if said outside court), not in epistemic failure.  

  ### New Case: Automated Diagnostic System  
  **Assertion?** Yes. It outputs a propositional claim with performative force in a clinical context.  

  **Normative Evaluation:**  
  - **Governing Practice:** Medical diagnostics, which prioritizes reliability and action-guidance.  
  - **Commitment Standard:** The system's 99% calibration meets clinical evidentiary thresholds for actionable claims (akin to "reputable source" for the historian).  
  - **Standing:** The system is institutionally licensed to diagnose.  

  **Verdict:** **Proper assertion** if:  
     (a) Its accuracy aligns with practice standards (99% suffices in many clinical contexts), and  
     (b) It is deployed in a context where such systems are authorized (e.g., not a prototype in untested settings).  
  *Improper* only if misaligned with practice (e.g., using a dermatology AI for cardiology without validation).  

  ### Why This Unifies Without Proliferating Norms:
  - **"Belief + contextual appropriateness"** fails (e.g., engineer lacks belief; attorney's context permits falsehood).  
  - **Practice-grounded commitment** explains all cases through one meta-norm:  
    - *Epistemic rigor* varies by practice (medicine vs. math).  
    - *Pragmatic role* defines legitimate commitment (attorney vs. friend).  
    - *Standing* determines who may assert (historian vs. layperson).  
  - The automated system shows that "belief" is unnecessary—what matters is whether the practice licenses *delegated commitment* to calibrated systems.  

  This framework preserves your core intuitions while resolving conflicts through contextual authority rather than norm fragmentation. Practices inherit their standards from social-institutional functions, making the norm both objective and flexible.
