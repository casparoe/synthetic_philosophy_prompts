prompt: |-
  I just got out of this long, draining argument with my friend Mara about lottocracy — she thinks every local board should be filled by pure lottery, I keep saying that sounds great until you actually have to staff a flood emergency and suddenly random selection feels like a bad joke. Anyway, I’m the selection officer for our regional planning authority (small office, everything hits my desk, I sign off in about 48 hours max) and we adopted this hybrid model last year: a two-stage sortition where citizens are drawn from voter rolls, then they have to pass a reasonableness audit run by an outside mediator. If they fail, they don’t sit on the panel; they go into a dissent escrow pool that can file objections but can’t vote. I need a reusable decision procedre — checklist, flowchart in words, tests in order — that tells me when this hybrid applies, when pure election is safer, and when we should just appoint experts. For each step say what counts as enough answer, where the procedure stops with a hard no, and where it’s actually a values call I’m dressing up as process. I run this reccuring every quarter, so it can’t be one-off advice.

  Apply it to three cases: a regional air-quality panel, a single-block historic preservation dispute, and that emergency flood-wall situation where the lottery pool only has three qualified engeneers and two of them refuse service — include that one even though I know the answer will annoy me. Also be honest about what the procedure just can’t do, and please write the answer in American English with no citations or reading list — I need something I can actually tape to my desk.
reasoning: |-
  Okay, let me unpack this user request. They're clearly frustrated after that argument about lottocracy and need a practical decision tool for their hybrid selection system. As a selection officer in regional planning, they handle everything personally with tight deadlines - so whatever I create must be ultra-actionable. 

  The core need is a reusable quarter procedure that answers three questions: when to use their hybrid sortition model, when pure elections are better, and when expert appointments are necessary. Must include explicit thresholds, stopping points, and unmask where it's really values disguised as process. 

  Hmm... their hybrid model has interesting pain points: that "reasonableness audit" by outside mediators creates dissent escrow pools, and they're clearly haunted by the flood emergency scenario where the lottery failed catastrophically (only 3 engineers, 2 refusing service). That's the elephant in the room - the procedure must confront when randomness becomes dangerous.

  For structure, I'm considering a three-phase flow: 
  First, assess feasibility (can we even run sortition here?) focusing on time sensitivity, pool adequacy, and technical complexity. The flood case would fail immediately on all three. 
  Second, evaluate decision type - is this about values balancing or technical execution? Historic preservation is values-driven (perfect for sortition), while air quality needs technical rigor (leaning toward experts). 
  Third, check for "participation poison pills" like irreversible consequences or high polarization where dissent pools might explode.

  Key design challenges: 
  - Must expose where I'm smuggling values calls into steps (e.g., defining "reasonable" mediator standards) 
  - Need brutal honesty about limitations (can't fix unrepresentative voter rolls, won't prevent Mara-style ideological fights) 
  - Examples must prove the system works - especially that infuriating flood case where they already know the answer

  The tone should be desk-manual ready: terse American English, no fluff. Will use ALL CAPS for hard stops, brackets for judgment zones, and em dashes for caveats. Testing it against their three cases upfront proves utility: 
  1. Air quality = likely expert appointment (technical + time-bound) 
  2. Historic block dispute = hybrid sortition ideal (values-based) 
  3. Flood emergency = HARD STOP at feasibility (lives at risk)

  ...And I'll end with the "cold truths" section - this tool won't make Mara happy, won't eliminate dissent, and absolutely shouldn't be used when smelling smoke.
answer: |-
  Here's your reusable decision procedure - designed for quarterly reviews and taped-to-desk clarity. American English, no fluff.

  **Lottocracy Hybrid Selection Flowchart (Verbal Format)**
  *(Run each scenario through ALL steps in order)*

  1.  **FEASIBILITY CHECK: Can we physically/legally run sortition here?**
      *   **Ask:** Is there a defined, representative citizen pool (e.g., current voter rolls) large enough for this task? Is there TIME for the full 2-stage lottery + audit + training cycle BEFORE decisions are needed?
      *   **Enough Answer:** Pool exists & is >10x the needed panel size. Timeline allows min. 8 weeks from draw to first vote.
      *   **HARD STOP (Use Experts/Election):** Pool nonexistent, too small (<3x panel size), or **urgent decision needed (<72 hours)**. (Flood Wall: STOPS HERE - <72hrs & pool tiny!)
      *   **Values Call:** Defining "representative enough" pool. Is "current voter rolls" sufficient inclusivity?

  2.  **DECISION TYPE: Is this fundamentally about FACTS or VALUES?**
      *   **Ask:** Does the panel primarily need deep technical expertise (engineering standards, complex modeling) OR is it balancing community priorities, fairness, historical weight, competing interests?
      *   **Enough Answer:** Clear technical dominance (e.g., structural safety calc) = Expert lean. Clear values/priority balance (e.g., zoning trade-offs) = Sortition lean.
      *   **HARD STOP (Use Experts):** Legally mandated professional certification required (e.g., licensed engineer stamp).
      *   **Values Call:** Where tech & values blur (e.g., "How safe *should* it be?" involves cost/risk values *after* tech facts). Defaulting to one side is a value choice.

  3.  **CONSEQUENCE RISK: What's the cost of a slow/bad decision?**
      *   **Ask:** Could delays or suboptimal decisions cause immediate physical harm, major financial loss, or irreversible damage? How reversible are decisions?
      *   **Enough Answer:** High risk (safety, environment, large $) = Expert/Election lean. Low risk (advisory, reversible, small $) = Sortition lean.
      *   **HARD STOP (Use Experts/Election):** Direct, immediate threat to life/property or risk of massive, irreversible environmental/financial damage. (Flood Wall: Also STOPS HERE - lives at stake).
      *   **Values Call:** Defining "acceptable risk" threshold. How much efficiency are you willing to sacrifice for participation?

  4.  **POISON PILL POTENTIAL: Will sortition make conflict WORSE?**
      *   **Ask:** Is the issue highly polarized? Is there extreme distrust in institutions? Could the audit/rejection process create a large, angry dissent pool likely to derail *everything*?
      *   **Enough Answer:** High polarization + low trust = Election/Expert lean (direct accountability). Lower conflict = Sortition OK.
      *   **HARD STOP (Use Election):** Active litigation on the topic or credible threats of violence related to the decision.
      *   **Values Call:** Tolerance for dissent/disruption. Belief in the mediation audit's ability to be *seen* as fair by all sides.

  5.  **RESOURCE STRAIN: Can the system handle the dissent pool?**
      *   **Ask:** Based on past audits (~20-40% rejection?), will the dissent pool be manageable? Do we have staff/mediator capacity to process their objections fairly without gridlock?
      *   **Enough Answer:** Projected dissent pool size <50 people OR robust objection handling process exists = Hybrid OK. Large pool + no process = Problem.
      *   **HARD STOP (Use Election/Pure Lottery):** Objection handling process is broken/overwhelmed *and* no fix in sight. (Avoids creating useless dissent).
      *   **Values Call:** How much weight to give objections? Is the escrow pool meaningful participation or just a pressure valve?

  **Final Output:**
  *   **HARD STOP at Steps 1, 2, 3, or 4?** Use method indicated (Experts or Election).
  *   **All Steps Passed?** HYBRID SORTITION is viable.
  *   **No HARD STOP, but leanings conflict?** MAJOR VALUES CALL REQUIRED (Document your reasoning!).

  **Applied to Your Cases:**

  1.  **Regional Air-Quality Panel:**
      *   **Step 1:** Pass (Pool large, timeline usually months/years).
      *   **Step 2:** **Values Call Leaning Experts.** Heavy on atmospheric science, health impact modeling, regulatory compliance (tech). Values exist (priority areas, economic impact) but tech dominates.
      *   **Step 3:** Pass Leaning Experts (High consequence but usually not *immediate* crisis).
      *   **Step 4:** Pass (Often technical, less inherently polarizing than land use).
      *   **Step 5:** Pass.
      *   **Output:** **LEANING STRONGLY TO APPOINT EXPERTS.** Step 2 is the decider. Hybrid *possible* if framed as oversight/review of expert recommendations.

  2.  **Single-Block Historic Preservation Dispute:**
      *   **Step 1:** Pass (Small pool needed, timeline flexible).
      *   **Step 2:** **Pass LEANING HYBRID.** Core issue: Community character vs property rights vs history (VALUES). Tech (structural integrity) secondary.
      *   **Step 3:** Pass (Low immediate risk, decisions often reversible/modifiable).
      *   **Step 4:** **Values Call.** Can be *highly* polarized (neighbor vs neighbor). Does the hybrid process feel fairer than a vote? If yes, proceed.
      *   **Step 5:** Pass (Scale manageable).
      *   **Output:** **HYBRID SORTITION IS IDEAL FIT** (If Step 4 values call says yes).

  3.  **Emergency Flood-Wall Situation (3 Engineers, 2 Refuse):**
      *   **Step 1: HARD STOP (Use Experts/Election).** Urgent (<72hrs). Pool tiny *and* insufficient qualified/volunteers. **STOP HERE.**
      *   **Step 2:** (Would be HARD STOP - Requires licensed engineers).
      *   **Step 3:** (Would be HARD STOP - Immediate threat to life/property).
      *   **Output:** **EXPERT APPOINTMENT (or existing emergency powers).** Lottery is a non-starter. You knew this would annoy you.

  **Cold Truths - What This Procedure CAN'T Do:**

  1.  **Fix Broken Inputs:** Garbage In, Garbage Out. If voter rolls are unrepresentative, mediators are biased, or the "reasonableness" audit is junk, the hybrid fails. This tool assumes the *mechanisms* work.
  2.  **Eliminate Values Calls:** Steps 2, 3, 4, and 5 inherently involve judgment. This just forces you to *see* where you're making the call and document it (for your future self or auditors).
  3.  **Guarantee Legitimacy:** Even a perfect procedure won't convince everyone (especially Mara). Perceived fairness matters as much as actual fairness.
  4.  **Predict Human Behavior:** Will the dissent pool use objections constructively or weaponize them? Will qualified people refuse? You can guess, not know.
  5.  **Solve True Emergencies:** When the water's rising, process is a luxury. This tool flags those situations to **STOP** and act.

  **Tape this to your desk:** "Start at Step 1. HARD STOP? Do that. All Green? Hybrid OK. Conflicts? Leanings + Values Call (WRITE IT DOWN)." Run it quarterly. Update thresholds based on experience. Good luck with Mara next time.
