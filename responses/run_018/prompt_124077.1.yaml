prompt: |-
  i'm putting together a handout for an undergrad phil of mind seminar on how far we can actually trust introspection. could you write me a decision tree that sorts people into positions based on concrete cases rather than labels? start with whether they think anyone can genuinely misidentify their own mental state right now — not just lie, but actually be wrong about what's in their head. then branch through specific scenarios: a person reports feeling calm but shows clear behavioural stress markers and later admits they were terrified; someone with blindsight denies seeing anything yet reliably describes objects; a subject describes a visual afterimage as being literally in the room in front of them. i want the splits to cover things like: is error mainly about presence vs intensity? is it correctable by third-party feedback? is introspection more reliable for affective states than for cognitive ones? the leaves should be named positions where they exist (strong transparency, weak transparency, confabulation-heavy, maybe an eliminativist-style view) and 'unnamed' for combos that don't seem occupied — like perfect reliability for sensations but total failure for beliefs about beliefs. please flag which pairs of leaves your tree can't really seperate. about six or seven leaves, keep the nodes phrased as questions a student could answer without knowing the jargon. oh, and don't ask for bibliographies — just the tree.
