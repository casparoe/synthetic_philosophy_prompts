  Finally, the note on verbal disputes. The term "forgetting" is ambiguous—it might mean amnesty, not dwelling, or literal erasure. Both sides probably agree that erasure is bad, but disagree on healthy vs. unhealthy remembrance. The real disagreement is about the psychology of memory: does dwelling prevent or cause harm? 

  I need to phrase everything neutrally, using each camp's language. For the remember camp, emphasize "duty" and "justice"; for the forget camp, "healing" and "forward-looking." The joint statement should feel like a consensus document, not a compromise. 

