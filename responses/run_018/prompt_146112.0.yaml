answer: |-
  Here's the breakdown into five numbered items evaluating the friend's summary:

  1.  **Purity framing:** Calling it "moral vanity" or "purity" is unfair; deontology prioritizes universal duties (like not killing innocents) over consequences, viewing the act itself as inherently wrong, not merely a personal stain to avoid.
  2.  **Forces inaction?** Deontology doesn't *always* demand passivity; it requires avoiding prohibited acts, but actively intervening *using permissible means* (like tackling a murderer) is often obligatory, not forbidden.
  3.  **Side-constraints misuse:** Characterizing side-constraints as "fancy language" for vanity misrepresents them; they are core to deontology, defining what actions are *absolutely forbidden* to agents, not an "escape" for personal feelings.
  4.  **Hundred-people-lie case:** While a classic dilemma, it's an oversimplification; deontologists debate if lying is *always* absolutely forbidden and how to weigh duties to rescue, meaning some might permit lying in extreme cases without abandoning core principles.
  5.  **Vanity conclusion:** The "vanity" label doesn't logically follow; prioritizing adherence to fundamental moral rules (like not killing) because they are seen as inviolable reflects a commitment to principle, not necessarily self-absorbed concern for one's own "clean hands".
