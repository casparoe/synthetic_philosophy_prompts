  For the response, I'll need to:
  1) Validate her intuition that consent was compromised despite technical compliance
  2) Explain how framing + power imbalance creates "structural deception"
  3) Distinguish ethical persuasion (adjusting presentation for clarity) from exploitation (leveraging cognitive vulnerabilities)
  4) Analyze the employer's actions as coercive through implicit threat theory
  5) Suggest concrete actions like consulting ethics boards

  The challenge is balancing philosophical rigor with actionable advice. I'll avoid academic jargon while maintaining precision. The colleague clearly values nuanced thinking - she's already identified gaps in binary consent models. Her linguist background means I can use careful terminology without oversimplifying.

