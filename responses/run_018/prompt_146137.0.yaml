  The employer aspect adds another layer. That "organizational transparency commitment" messaging creates what philosophers call "constructive coercion" - no explicit threat, but clear career consequences. It reminds me of Shiffrin's work on coercive offers where power imbalances make choices non-voluntary.

  I should consider multiple ethical frameworks:
  - Kantian: Does this undermine her autonomy as rational agent? 
