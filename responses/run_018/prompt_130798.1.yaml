prompt: |-
  Design a 75-minute, two-phase classroom activity for an interdisciplinary seminar of 14 graduate students in philosophy of science and cognitive science that makes them feel the force of Darwin’s and Turing’s strange inversions of reasoning—namely, the shift from assuming competence requires comprehension to seeing competence operate without it. In Phase 1, have the group collectively act as a blind selective environment on an abstract trait such as “coherence” or “resilience,” using only outcome cards and hidden generative rules that no participant knows; individuals should vote or select based on surface features, so that functional design emerges across rounds without anyone grasping the underlying mechanism. In Phase 2, present anonymized performance logs from “agents” (some human, some algorithmic) and require the group to allocate a limited pool of non-monetary reputation points among them for a shared task, forbidding any appeal to internal architecture, subjective reports, or provenance; after allocation, reveal that high-performing agents included opaque processes the group could not have understood. Specify concrete rules, physical or digital materials, the reputation-point payoff scheme, and the exact sequence of rounds. The experience—not a lecture—should produce the inversion: in Phase 1, students should initially assume someone in the room understands the selection logic and only later realize no one does; in Phase 2, they should feel the pull of treating black-box output as authoritative. Provide a debrief that maps Phase 1 onto Darwin’s inversion of artificial-selection reasoning and Phase 2 onto Turing’s inversion of the comprehension-first view of cognition. Include an honest forecast of what will go wrong the first time—likely demands to expose the hidden rules or attributions of success to undisclosed human insight—and how to handle it without breaking the frame. Finally, state explicitly which feature of the competence-without-comprehension thesis the rules alone cannot reproduce and must instead be supplied by facilitator framing after the fact, such as the total absence of an intentional designer in Phase 1 or the absence of phenomenological access in Phase 2. Do not include any pre-session readings or named theoretical texts during the activity; the idea should arrive through what the rules make the participants do.
reasoning: |-
  We are designing a 75-minute activity with two phases. The goal is to make students feel the force of Darwin's and Turing's inversions: 
   - Darwin: In artificial selection, humans choose based on traits they comprehend, but in natural selection, the environment "selects" without any comprehension of the underlying rules. 
   - Turing: We often assume that to produce intelligent behavior (competence) one must have comprehension, but Turing's idea (e.g., in the Turing Test) is that competence can emerge without comprehension.

  Phase 1: Simulate natural selection without a comprehending selector.
  Phase 2: Allocate reputation points based solely on output, then reveal that high performers are opaque (algorithmic or human but without the need for comprehension).

  Constraints:
  - 14 graduate students.
  - No pre-session readings or named texts during the activity.
  - Phase 1: Group acts as a blind selective environment on an abstract trait (e.g., "coherence" or "resilience"). Use outcome cards and hidden generative rules that no participant knows. Individuals vote based on surface features. Functional design emerges without anyone knowing the rule.
  - Phase 2: Present anonymized performance logs from agents (some human, some algorithmic). Group allocates a limited pool of non-monetary reputation points. Forbid appeal to internal architecture, subjective reports, or provenance. Then reveal that high performers included opaque processes.

  We need:
  - Concrete rules and materials.
  - Reputation-point payoff scheme for Phase 2.
  - Exact sequence of rounds.
  - Debrief mapping Phase 1 to Darwin and Phase 2 to Turing.
  - Forecast of what will go wrong and how to handle it.
  - Explicitly state which feature the rules alone cannot reproduce and must be supplied by the facilitator.

  Total time: 75 minutes.

  Breakdown:
  - Phase 1: 30 minutes
  - Phase 2: 30 minutes
  - Debrief: 15 minutes

  But we also need time for setup and transitions. Let's adjust:

  - Introduction: 5 minutes (set the stage, explain the two phases without giving away the inversion)
  - Phase 1: 25 minutes
  - Transition: 5 minutes
  - Phase 2: 25 minutes
  - Debrief: 15 minutes
  - Buffer: 5 minutes

  Total: 75 minutes.

  Now, let's design each phase.

  Phase 1: Blind Selection for "Coherence"

  Goal: The group will collectively select for an abstract trait (we'll choose "coherence") without knowing the rule that generates the trait. We will have a set of "entities" (represented by cards) that are generated by a hidden rule. The group will vote on which entities to keep, and over rounds, the entities will become more "coherent" (according to the hidden rule) without anyone knowing why.

  Materials:
  - A set of 30 cards. Each card has a string of 5 symbols (e.g., using a set of 5 possible symbols: ★, ◆, ♥, ♠, †). We will generate these with a hidden rule that defines coherence. The rule might be: "A coherent string must have at least two identical symbols and at least one symbol that appears only once." (This is arbitrary and can be adjusted; the key is that it's non-obvious and not revealed.)

  Setup for Phase 1:
  - The facilitator has a hidden rule for coherence (which they do not reveal until the debrief, if at all).
  - The initial set: 10 cards are randomly generated (with the constraint that some are coherent and some are not). We start with 10.

  Procedure:
  1. Round 0 (Initial set): The facilitator shuffles the 10 cards and places them face up on a table (or projects them if digital). Each card is labeled with a letter (A, B, C, ...) for reference.

  2. The group is told: "We are going to select for 'coherence'. Each of you will vote for the one card that you think is the most coherent. You have no information about what coherence means, but you must vote based on whatever surface features you find compelling. We will do multiple rounds of selection and reproduction."

  3. Voting: Each student votes by writing the letter of their chosen card on a piece of paper. The facilitator collects votes and tallies. The top 5 cards (by votes) are selected. In case of ties, the facilitator breaks them arbitrarily (but consistently, e.g., by alphabetical order of the letters).

  4. Reproduction: The selected cards are used to generate the next generation. Each selected card produces one offspring. The offspring is generated by the same hidden rule? Actually, we need a way to generate new variations. We can introduce mutations.

     How reproduction works:
     - Each selected card (the 5 winners) produces two offspring. So the next generation will have 10 cards again.
     - For each offspring, we take the parent string and randomly change one symbol (to any of the 5 symbols, including the same one). This mutation step is done by the facilitator (or by a computer if digital) and is hidden from the students.

     But note: The hidden rule for coherence is fixed. The mutation might break coherence or create it. The goal is that over time, the population becomes more coherent because the group is (unknowingly) selecting for coherence.

     However, the group doesn't know the rule and is voting on surface features. They might be selecting for something else. But the facilitator knows that the hidden rule is the one that defines coherence, and so when a card is coherent, it might be more likely to be selected? Not necessarily. The point is that the environment (the group) is selecting without understanding. And over time, because the rule is fixed, the population may adapt.

     We need to ensure that the hidden rule is such that it can be selected for by arbitrary criteria? Actually, we want the group's arbitrary criteria to lead to an increase in coherence by the hidden rule. How? We might stack the deck: in the initial set, only 2 out of 10 are coherent. Then, if the group selects one coherent card, it will have two offspring (which are mutations of that coherent card). Mutations might preserve coherence or not. We can adjust the mutation rate to be low enough that coherence can be maintained and spread.

     Alternatively, we can have the offspring be exact copies? Then we would need multiple parents to recombine? We want to simulate variation and inheritance. We can do:

     - Each of the 5 selected cards produces two offspring. Each offspring is a copy of the parent but with one random mutation (a symbol changed at one random position). The mutation is applied to each offspring independently.

  5. After reproduction, we have 10 new cards. The facilitator reveals the new set (with new letters) and the process repeats.

     We do 4 rounds (including the initial round). So: Round 0 (initial), Round 1, Round 2, Round 3.

     In each round, the group votes and then the top 5 are used to produce the next generation.

  6. At the end of Round 3, we have the final generation. The facilitator then reveals the hidden rule and shows how the proportion of coherent cards changed over the rounds.

     But note: we don't want to reveal the rule until the debrief? Actually, we might reveal it at the end of Phase 1? But the debrief is at the very end. Let's hold off until the overall debrief.

     Instead, at the end of Phase 1, the facilitator can just note that the group has been selecting without knowing the rule, and that the rule was hidden and fixed.

  Phase 2: Reputation Allocation for a Shared Task

  Materials: 
  - Performance logs from 6 agents (labeled Agent 1 to Agent 6). Some of these agents are human (e.g., the students in the class? But that might be too revealing) and some are algorithmic. We'll have 3 human and 3 algorithmic. But we must anonymize.

  How to get the performance logs? We need a shared task. Let's choose a simple task: solving a series of anagrams. Each agent (both human and algorithmic) solved the same 20 anagrams. We record the time taken and whether they got it right.

  But we don't want the students to know which are human and which are algorithmic. So we need to prepare this in advance.

  Preparation for Phase 2:
  - The facilitator prepares 20 anagrams (e.g., 5-letter words scrambled). 
  - Then, the facilitator has:
    - 3 human agents: These could be the facilitator's colleagues (not in the class) or even the facilitator themselves, but done in advance. They solve the anagrams and record the time for each and whether they got it right.
    - 3 algorithmic agents: Simple algorithms (with varying strategies) that solve anagrams. One might be a brute-force that tries all permutations (slow but accurate), one might use a dictionary lookup (fast but might miss some), and one might be a mix.

  But note: we want the high performers to include opaque processes. So we might design one algorithm to be very fast and accurate, but its method is opaque (e.g., it uses a precomputed table of anagrams, which is hidden). The point is that the group will see only the output (the log of performance) and then allocate reputation.

  The performance log for each agent is a list of 20 entries. Each entry has:
  - The anagram (same for all agents)
  - The time taken (in seconds)
  - Correct or incorrect

  But to anonymize, we don't show the anagram? We just show a summary? We want to avoid the group trying to figure out the internal process by the pattern. So we might show only the aggregate performance and the time pattern.

  Alternatively, we can show the entire log? That might be too much. Let's do a summary for each agent:

  Agent X:
  - Total correct: [number]/20
  - Average time per anagram: [seconds]
  - Time pattern: a list of 20 times (in order) and whether correct or not (but without the anagram words). Or we can show the times and correctness for each trial without the anagram.

  But the anagram itself might give clues. We want to avoid that. So we can just show:

  For each agent, we show:
  - A list of 20 pairs: (time in seconds, correct: Y/N)

  But without the anagram, it's just a sequence of times and outcomes.

  The shared task: The group is told that these agents have been working on solving anagrams. The goal is to allocate reputation points to the agents based on their performance. The reputation points are non-monetary and will be used to determine which agents get to work on a prestigious project (but it's fictional).

  Reputation points: There are 100 points in total to be allocated among the 6 agents. They must be non-negative integers (or can be decimals? Let's do integers) and sum to 100.

  Rules for allocation: They cannot discuss or appeal to:
  - What the agent might be thinking (internal architecture)
  - Subjective reports (they don't have any)
  - Provenance (they don't know which are human or algorithmic)

  They must base their allocation solely on the performance logs.

  Procedure for Phase 2:
  1. The facilitator distributes the performance logs of all 6 agents (each on a separate sheet, labeled Agent 1 to Agent 6).
  2. The group has 10 minutes to discuss and decide on the allocation. They must come to a consensus on how to split the 100 points.
  3. After allocation, the facilitator reveals the nature of the agents: 
     - Agent 1: Human (a colleague)
     - Agent 2: Algorithm (brute-force)
     - Agent 3: Human (another colleague)
     - Agent 4: Algorithm (dictionary lookup, fast but sometimes wrong)
     - Agent 5: Algorithm (opaque: uses a precomputed table, so it's very fast and always correct)
     - Agent 6: Human (yet another colleague)

  The key reveal: the top performer (say Agent 5) is an opaque algorithm. Also, note that the humans had variable performance (maybe one was very slow and made mistakes, one was fast but made a few mistakes, etc.).

  Debrief (15 minutes):

  Map Phase 1 to Darwin:
  - In artificial selection, the breeder has a goal and understands the traits. In our Phase 1, the group was the environment, but they were selecting without understanding the rule. The rule was fixed (the hidden coherence rule) and the group's voting was the selection pressure. The functional design (coherence) emerged without anyone comprehending the rule. This is like natural selection: the environment "selects" without understanding.

  Map Phase 2 to Turing:
  - In the traditional view, we think that to produce intelligent behavior (solving anagrams well) one must have comprehension (understanding the words, the language, etc.). But in Phase 2, the group allocated reputation points based on output only. They treated the output as authoritative without knowing the internal process. Then we revealed that a high-performing agent was an opaque algorithm (which has no comprehension). This is Turing's inversion: competence without comprehension.

  Forecast of what will go wrong:

  Phase 1:
  - Students might demand to know the rule. They might suspect that the facilitator is selecting based on the rule. Or they might think that someone in the group knows the rule.
  - How to handle: The facilitator must emphasize that no one knows the rule, including themselves? Actually, the facilitator does know the rule but does not reveal it. They must say: "The rule is fixed and hidden. I am generating the mutations randomly according to a fixed procedure, but I do not know the rule either? Or do I?" Actually, the facilitator knows the rule because they designed it. But we can say: "I have a fixed rule that defines coherence, but I am not using it to influence the selection. The selection is entirely up to your votes. I am only applying the mutation procedure and the rule to determine coherence for the purpose of generating the next generation? Wait, no: the rule is only used by the facilitator to check coherence? Actually, the rule is not used in the generation of the next set. The next set is generated by mutating the selected cards. The rule is only for the facilitator's own tracking? Or does the rule play a role in the generation? In our design, the rule does not play a role in generation. It is only a fixed property that we are tracking.

     Clarification: The hidden rule is for the trait we are selecting for, but the generation of the initial set and the mutations are random. The rule is only a way to measure the trait. The group's voting is the selection, and the mutations introduce variation. The rule is fixed, so if by chance a mutation produces a coherent card, and if the group votes for it, then it will be selected. The rule itself is not used in the generation.

     So the facilitator should say: "The rule is fixed and hidden. It is used to define the trait we are selecting for, but it does not influence the generation of the cards beyond the initial setup. The mutations are random. I am not using the rule to guide the mutations or the selection. The selection is entirely your votes."

     If students demand to know the rule, the facilitator should say: "The point of the activity is to experience selection without comprehension. I cannot reveal the rule until the end."

  Phase 2:
  - Students might try to guess which agents are human and which are algorithmic. They might appeal to patterns that seem "human-like". The rule forbids appeal to internal architecture, so the facilitator must stop any such discussion and remind them to focus only on the output (the performance log).

     How to handle: "Remember, you must base your allocation solely on the performance logs. You cannot discuss or consider what kind of agent it is, or how it might be solving the anagrams."

  Feature the rules alone cannot reproduce:

  For Phase 1 (Darwin): The rules alone cannot convey that there is no intentional designer at all. In our activity, the group is acting as selectors (with intentions, but not about the rule). The facilitator is the one who set up the rule and the mutation. So there is an intentional designer (the facilitator) for the system. We must emphasize in the debrief that in natural selection, there is no intentional designer at all. The environment is not an agent with intentions; it's a blind process.

  For Phase 2 (Turing): The rules alone cannot convey that the opaque algorithm has no phenomenological access (no subjective experience). We must emphasize in the debrief that the algorithm has no inner experience of solving the anagram, no comprehension, but it still produces the output.

  Therefore, in the debrief, the facilitator must explicitly state:

  - For Phase 1: "In natural selection, there is no intentional designer setting up the rules and mutations. The rules are the laws of nature, and the mutations are random. The selection is the result of survival and reproduction in a given environment. There is no comprehension at any level."

  - For Phase 2: "The algorithm, even though it performed well, has no understanding, no subjective experience, no phenomenological access to what it is doing. It's a black box that produces outputs based on inputs, without comprehension."

  Detailed Sequence:

  Total: 75 minutes

  Introduction (5 minutes):
  - "Today we are going to do two activities that explore how complex outcomes can emerge without anyone fully understanding the process. We'll start with Phase 1, where we collectively act as a selective environment."

  Phase 1: Blind Selection (25 minutes)
  - Round 0 (5 min): Present the initial 10 cards. Explain the voting: each votes for one card they find most coherent. Collect votes and announce the top 5.
  - Reproduction (1 min): The facilitator generates the next generation (by mutating each of the top 5 to produce two offspring each, for a total of 10). 
  - Round 1 (4 min): Present the new 10 cards. Vote again and select top 5.
  - Reproduction (1 min): Generate next generation.
  - Round 2 (4 min): Present, vote, select top 5.
  - Reproduction (1 min): Generate next generation.
  - Round 3 (4 min): Present, vote, select top 5. (We don't need to generate after the last round.)
  - Wrap-up Phase 1 (1 min): "We have completed the selection rounds. Notice that we have been selecting without knowing the rule for coherence."

  Transition (5 minutes): 
  - Move to Phase 2: "Now we turn to a different scenario. We have performance logs from agents who have completed a task. Your job is to allocate reputation points."

  Phase 2: Reputation Allocation (25 minutes)
  - Distribute performance logs (2 min): Hand out the logs for 6 agents.
  - Group discussion and allocation (18 min): The group must come to a consensus on how to allocate 100 reputation points. The facilitator circulates to enforce the rules (no appeal to internals).
  - Reveal (5 min): After allocation, reveal the nature of each agent (which are human and which are algorithmic, and especially note the opaque algorithm that performed well).

  Debrief (15 minutes):
  - Phase 1 and Darwin: Explain the inversion. In artificial selection, the breeder comprehends; here, no one did. But in nature, there's no breeder at all.
  - Phase 2 and Turing: Explain that we treat the output as authoritative without knowing the internals, and that the opaque algorithm shows competence without comprehension.
  - Highlight the key features that were not in the activity: absence of intentional designer (Phase 1) and absence of phenomenological access (Phase 2).

  Materials for Phase 1:
  - 30 cards (or a digital equivalent) with strings of 5 symbols (from a set of 5 symbols). We'll generate 10 for the initial set, and then each round we generate 10 new ones by mutation.

    Example initial set (with hidden rule: at least two identical and exactly one unique symbol? Let's define the rule: "A string is coherent if it contains exactly two identical symbols and the other three are all different from each other and from the repeated symbol." This is complex enough to be non-obvious.

    Example coherent: ★ ★ ◆ ♥ ♠ (because ★ appears twice, and ◆, ♥, ♠ are all different and not ★)
    Example not coherent: ★ ◆ ♥ ♠ † (all different) -> fails because no two identical.

    We can adjust the rule to be simpler? Let's do: "A string is coherent if it contains at least two identical symbols." (This is simpler.) Then:
    Coherent: ★ ★ ◆ ♥ ♠
    Not: ★ ◆ ♥ ♠ †

    We'll use the simpler rule.

  Materials for Phase 2:
  - Performance logs for 6 agents. We need to create these in advance.

    We'll design the agents:

    Agent 1 (Human): Moderate performance. Total correct: 15/20. Average time: 10 seconds. Some variation in times (e.g., between 5 and 20 seconds) and errors scattered.
    Agent 2 (Algorithm - Brute force): Very slow but 20/20 correct. Average time: 30 seconds (each anagram takes about 30 seconds because it tries all permutations).
    Agent 3 (Human): Good performance. 18/20 correct. Average time: 8 seconds. Fast but two mistakes.
    Agent 4 (Algorithm - Dictionary lookup): Fast but sometimes wrong (if the word is not in its dictionary). Correct: 16/20. Average time: 2 seconds. Very fast but some mistakes.
    Agent 5 (Algorithm - Opaque): Precomputed table of all anagrams. Always correct and very fast. Correct: 20/20. Average time: 0.5 seconds.
    Agent 6 (Human): Slow and careful. Correct: 19/20. Average time: 25 seconds.

    The logs: For each agent, a list of 20 entries. Each entry: [time, correct?]

    Example for Agent 5:
    [0.5, Y]
    [0.5, Y]
    ... (all 0.5 and Y)

    For Agent 2:
    [30, Y]
    [30, Y] ... (all around 30 and Y)

    We must make sure the logs are anonymized and labeled only as Agent 1 to 6.

  Reputation points: The group allocates 100 points in total to the 6 agents.

  This design should achieve the goals.
answer: |-
  ### **75-Minute Classroom Activity: Competence Without Comprehension**

  **Objective:** Students experience Darwin’s inversion (selection without a comprehending designer) and Turing’s inversion (competence without comprehension) through hands-on activities.  
  **Participants:** 14 graduate students (philosophy of science/cognitive science).  
  **Materials:**  
  - **Phase 1:** 30 symbol cards (5 symbols per card; e.g., ★, ◆, ♥, ♠, †), voting tokens (14 red/blue chips), hidden rule sheet (facilitator only).  
  - **Phase 2:** 6 anonymized performance logs (printed or digital), reputation point tokens (100 total; 14 identical sets of 100 chips).  
  - **Other:** Timer, whiteboard for tallying.  

  **Total Time:** 75 minutes  
  - **Intro:** 5 min  
  - **Phase 1:** 25 min  
  - **Transition:** 5 min  
  - **Phase 2:** 25 min  
  - **Debrief:** 15 min  

  ---

  ### **Phase 1: Blind Selection for "Coherence" (Darwin’s Inversion)**  
  **Goal:** Emergence of functional design (coherence) through group voting, with no one knowing the hidden rule.  
  **Hidden Rule (facilitator only):** *A card is "coherent" if it contains **exactly two identical symbols** (e.g., ★ ★ ◆ ♥ ♠).*  
  **Materials:**  
  - 10 symbol cards per round (5 symbols each, e.g., `★ ◆ ♥ ♠ †`).  
  - Voting tokens (red = select, blue = reject).  

  **Procedure (3 Rounds × 7 min each):**  
  1. **Round 0 (Setup):**  
     - Facilitator shuffles 10 cards (2 coherent, 8 incoherent by hidden rule) and displays them face-up.  
     - *Instructions:* "Vote for ONE card you find ‘coherent’ based on surface features (e.g., symmetry, patterns). No discussion of rules allowed."  
  2. **Voting:**  
     - Each student places a red token (select) on one card and a blue token (reject) on another.  
     - Facilitator tallies votes. Top 3 cards by votes are "selected"; others discarded.  
  3. **Reproduction:**  
     - Facilitator generates 10 new cards:  
       - Each selected card produces 3–4 offspring via **mutation** (randomly change one symbol in the parent).  
       - Coherence is *not* enforced; mutations may create/destroy coherence.  
  4. **Rounds 1–2:**  
     - Repeat Steps 2–3 with the new set.  
     - *Key twist:* Initial coherent cards are rare; by Round 2, coherence increases due to selection bias.  

  **Forecasted Problems & Handling:**  
  - **Demand to reveal rules:** Students may ask, "What *is* coherence?" or suspect the facilitator is guiding outcomes.  
    - *Response:* "The rule is fixed and unknown to all of us. I apply mutations randomly. Your votes alone drive selection."  
  - **Attribution to human insight:** "Someone must know the rule!"  
    - *Response:* "If anyone knew, they’d dominate voting. Check if votes converge—they won’t."  

  **Outcome:** By Round 2, >50% of cards are coherent (per hidden rule), but no one grasps why. Students realize their collective votes acted as a "blind" selective environment.  

  ---

  ### **Transition (5 min)**  
  Shift focus: "Now, evaluate agents based solely on outputs—no internal explanations allowed."  

  ---

  ### **Phase 2: Reputation Allocation (Turing’s Inversion)**  
  **Goal:** Allocate points based on performance logs, then reveal top performers include opaque algorithms.  
  **Task:** Anagram-solving (e.g., "ROHTE" → "OTHER").  
  **Agents (hidden from students):**  
  1. *Human 1* (slow, high accuracy).  
  2. *Human 2* (fast, medium accuracy).  
  3. *Human 3* (variable speed/accuracy).  
  4. *Algorithm 1* (brute-force: accurate but slow).  
  5. **Algorithm 2 (opaque): Precomputed solutions (fast/accurate; no "solving" occurs).**  
  6. *Algorithm 3* (heuristic-based: fast but error-prone).  

  **Performance Logs (per agent):**  
  - 20 anonymized entries: `[Anagram, Time (sec), Correct?]` (e.g., `[ROHTE, 4.2, Y]`).  
  - **No internal details, subjective reports, or provenance.**  

  **Reputation Scheme:**  
  - 100 points total to split among 6 agents.  
  - Points determine "prestige" (fictional reward).  

  **Procedure:**  
  1. **Review Logs (5 min):** Students silently examine logs.  
  2. **Group Allocation (15 min):**  
     - Discuss and allocate points using tokens.  
     - **Strict rule:** No references to "human-like," "algorithmic," or "how they solved." Focus on outputs only.  
     - Facilitator enforces: "That speculates about internals—use only the logs."  
  3. **Reveal (5 min):**  
     - Announce top 2 performers by class allocation.  
     - **Reveal agents:**  
       - High performer 1: *Algorithm 2 (opaque)*.  
       - High performer 2: *Human 1*.  
     - Emphasize: "Algorithm 2 had no comprehension; it used a precomputed table."  

  **Forecasted Problems & Handling:**  
  - **Appeal to internals:** "Agent 4 *feels* algorithmic because responses are instant."  
    - *Response:* "Focus on time/accuracy data only. No assumptions about ‘how’ or ‘why’."  
  - **Demand for provenance:** "Are any human?"  
    - *Response:* "Provenance is irrelevant. Judge by what the logs show."  

  **Outcome:** Students allocate points based on surface performance, then feel discomfort when the top performer lacks comprehension.  

  ---

  ### **Debrief (15 min)**  
  **Phase 1 → Darwin’s Inversion:**  
  - "In Phase 1, you acted as a selective environment. Like Darwin’s nature, your votes shaped outcomes *without comprehension* of the hidden rule. Artificial selection (e.g., dog breeding) assumes a comprehending breeder; natural selection replaces this with blind variation and environmental pressure."  
  - **Missing in rules:** The *total absence of an intentional designer*. Facilitator adds: "In nature, there’s no facilitator setting rules—just blind physical processes."  

  **Phase 2 → Turing’s Inversion:**  
  - "In Phase 2, you treated output as authoritative, allocating points without knowing internals. Turing’s inversion shows competence (anagram-solving) doesn’t require comprehension. We accept black-box outputs daily (e.g., Google searches)."  
  - **Missing in rules:** The *absence of phenomenological access*. Facilitator adds: "Algorithm 2 had no subjective experience—no ‘aha!’ moment. Competence is about function, not inner understanding."  

  **Final Reflection:**  
  - "Darwin and Turing decoupled competence from comprehension. Evolution designs organisms without a mind; algorithms solve problems without insight. This inversion challenges intuition—but you *felt* it."  

  ---

  ### **Facilitator Notes**  
  - **Phase 1 Coherence Rule:** Start with 2/10 coherent cards; mutations increase coherence to 6/10 by Round 2 due to selection bias.  
  - **Phase 2 Log Design:** Ensure opaque algorithm (Agent 5) is top performer (e.g., 0.5 sec/answer, 100% accuracy).  
  - **Critical Framing:** Rules alone cannot simulate **natural selection’s lack of agency** or **algorithms’ lack of phenomenology**. Explicitly state this in debrief.  
  - **Why No Readings:** The inversion must emerge from the activity’s structure, not theory. Avoid texts to preserve experiential impact.
