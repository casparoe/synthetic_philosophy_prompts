answer: |-
  Here's a prioritized research roadmap for tackling your core challenges, based on philosophical tractability, upstream foundational status, and leverage over downstream implications. The ranking favors problems where progress would have the highest cascade effects or reveal dead ends quickly:

  ### **Ranked Research Priority (3-Year Focus)**
  1.  **The Commensurability Problem (#1)**  
      **Why First?** Utterly upstream. If insoluble, it collapses the entire lexical-threshold project *before* aggregation questions arise.  
      **Tractability:** High for pure philosophy. Focuses on conceptual analysis and normative metaphysics.  
      **Key Questions:**  
      - Can "intensity" of suffering/pleasure be meaningfully compared *at all* across contexts (e.g., acute physical pain vs. existential dread vs. subtle contentment)?  
      - Does setting a threshold *require* cardinal comparability, or can it function with ordinal rankings + a "sufficiently bad" boundary (e.g., "anything worse than severe chronic pain is lexical")?  
      **Confidence-Moving Test:**  
      > *The Threshold Translation Test:* Suppose two states: (A) Suffering just below threshold, (B) Pleasure just above a "bliss" threshold. Can we coherently claim A is *worse for a being* than B is *good*, without a common metric? If not, thresholds are arbitrary.  
      **Downstream Impact:** Settling this determines if lexical thresholds are viable *at all*. If fatal, aggregation (#2) becomes moot.  

  2.  **Distributed-Subthreshold Aggregation (#2)**  
      **Why Second?** Presupposes thresholds are *possible* (per #1), but challenges their individualistic application. Most novel and under-explored aspect of your query.  
      **Tractability:** Moderate. Requires analyzing aggregation principles (is suffering "additive" in a way pleasure isn't?) and moral patienthood.  
      **Key Questions:**  
      - **Asymmetry Test:** Does *n* instances of subthreshold suffering → morally equivalent to suprathreshold suffering *before* *n* instances of equivalent subthreshold pleasure → suprathreshold value?  
      - **Mechanism:** Is the asymmetry driven by suffering's *aversive phenomenology* (demanding cessation) vs. pleasure's *non-demanding* nature? Or is it a deontic constraint (rights against suffering aggregation)?  
      **Confidence-Moving Test:**  
      > *The Micropain Galaxy vs. Microjoy Galaxy:*  
      > - *Suffering Galaxy:* 10²⁵ beings each experience 0.1µs of pain 1% below threshold (undetectable to them).  
      > - *Pleasure Galaxy:* 10²⁵ beings each experience 0.1µs of joy 1% above a "meaningful" threshold.  
      > Is the Suffering Galaxy worse *overall*? If yes, lexical thresholds leak catastrophically.  
      **Downstream Impact:** If aggregation asymmetry holds, lexical NU *must* incorporate aggregation rules → revolutionary reformulation. Wild animal/longtermist ethics hinge on this.  

  3.  **Downstream Population Ethics/Longtermist Implications (#3)**  
      **Why Last?** Depends entirely on resolutions to #1 and #2. Premature without foundations.  
      **Tractability:** High *if* #1/#2 are resolved; low otherwise. More applied but derivative.  
      **Key Questions:**  
      - If #2 holds (aggregation asymmetry), does preventing distributed subthreshold suffering dominate all other values (e.g., eradicating wildlife)?  
      - Can lexical thresholds avoid *Pareto-plus problems* (e.g., adding subthreshold suffering lives being obligatory if it enables suprathreshold lives)?  
      **Leverage:** Resolving #1/#2 makes these questions answerable; prior work is inconclusive without them.  
      **Confidence-Moving Test:**  
      > *The Subthreshold Sacrifice:* Would a future with 10¹⁵ barely-subthreshold suffering beings + human flourishing be *worse* than a future with 1 suprathreshold suffering human + no flourishing? Answer depends entirely on #1/#2.  

  ---

  ### **Why This Order? Rationale Summary**
  - **#1 is the Bottleneck:** Without comparability, thresholds are arbitrary. If unsolvable, the project halts. *Tractability* is high because it’s a clean conceptual problem (e.g., akin to analyzing "incommensurability" in value theory).  
  - **#2 is the Unique Insight:** Your "distributed-subthreshold" challenge is where new philosophical ground might be broken. If suffering aggregates nonlinearly, it forces a rewrite of lexical NU—*even if thresholds are possible*. Prioritizing it over #3 avoids wasted effort on applied ethics that depends on unsettled foundations.  
  - **#3 is Derivative:** Population ethics applications are downstream puzzles *if and only if* the framework survives #1 and #2. Research here is only valuable post-breakthrough.  

  ### **Deprioritized (But Often Discussed) Questions**
  - **"Arbitrary Threshold" Objections:** If #1 shows comparability *is* possible (even vaguely), thresholds can be non-arbitrary (e.g., "pain worse than childbirth" as a practical anchor).  
  - **Classic Aggregation Debates (e.g., Parfit's Repugnant Conclusion):** These assume comparability and focus on *pleasure*, not suffering’s asymmetry. Less relevant to your core issue.  
  - **Empirical Neuroscience of Pain:** You specified *conceptual* work; the distributed-aggregation problem is metaphysical (how *should* we weigh moral patient experiences?), not scientific.  

  ### **Strategy for 3 Years**
  - **Year 1:** Attack commensurability (#1). Use thought experiments to pressure "intensity" comparisons. If it collapses, pivot to a new project.  
  - **Year 2:** If #1 is surmountable, model aggregation asymmetries (#2). Develop asymmetry tests and analyze moral patienthood.  
  - **Year 3:** Apply results to longtermism/population ethics (#3) *only* if #1–#2 yield a stable framework.  

  This ordering minimizes sunk cost on contingent problems and forces confrontation with the deepest conceptual threats first. The distributed-subthreshold problem is your most original lever—if it holds, it could reshape negative utilitarianism fundamentally.
