  Commensurability (#1) feels most upstream because if we can't compare pain/pleasure across contexts even roughly, setting thresholds collapses into arbitrariness. Can't solve aggregation (#2) without this foundation. A strong argument here would be showing thresholds can be contextually robust without full cardinality—maybe via "vague but bounded" comparability. Test case: medical pain scales used in resource allocation—they work pragmatically despite no universal metric.

