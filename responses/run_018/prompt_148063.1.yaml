prompt: |-
  I was arguing with my roommate about whether promises are actually morally binding or just a social trick we play on ourselves. She thinks it's all expectation-based — you promise, I expect, I plan around it, and breaking it harms me. I think there's something more like giving someone authority over your future choices, but I can't tell if that's just fancy language for the same thing. Anyway, I'm trying to figure out where the real gaps are in this debate, not the ones every intro ethics class covers.

  There seem to be three messy clusters that don't get resolved together: one is whether promissory obligation holds when the social practice collapses — think post-catastrophe or digital spaces where there's no shared normative background. Another is whether the 'normative power' story actually explains bindingness or just renames it, especially when promises are made across deep moral disagreement. The third is whether extending promises to future people or non-human agents is conceptually coherent, or if we're just stretching an analogy until it breaks.

  If I had three years and a small grant for pure conceptual work — no surveys, no empirical studies — which cluster should I actually tackle? Rank them by what's upstream: solving which one would change the answer to the others? Be explicit about your criteria — tractability for a solo philosopher, whether the answer matters for law or political legitimacy, and how neglected the problem actually is. And tell me which ones are overrated: maybe they sound profound but wouldn't shift anything outside philosophy seminars. I also want to know what evidence — not citations, but what kind of argument or counterexample — would make you reorder them. Oh, and I wrote 'promissary' with two s's in my notes, but I think that's wrong.
reasoning: |-
  Okay, let me unpack this user's query. They're having a deep debate with their roommate about the nature of promises - whether they're morally binding or just social expectations. The user feels there's something more, like giving authority over future choices, but isn't sure if that's just semantics. 

  Hmm, they've identified three complex clusters beyond intro ethics: 1) promissory obligation in collapsed social contexts (post-catastrophe/digital spaces), 2) whether "normative power" theory actually explains bindingness across moral disagreements, and 3) extending promises to future generations/non-humans. 

  The user wants to know which cluster to prioritize for a 3-year conceptual research project. They care about upstream impact (which solution affects the others), plus practical factors like tractability for solo work, real-world relevance, and how overlooked each problem is. Also wants to know what evidence could change the ranking.

  First, I should note their "promissary" spelling mistake - minor but shows attention to detail matters here. Their clusters are refreshingly unconventional - they've clearly moved past basic Humean vs. Kantian debates. 

  For prioritization, I need to consider dependencies: Cluster 2 (normative power) seems most fundamental. If we can't explain why promises bind across moral divides, the other clusters become harder to address. It's also highly tractable for solo work - mostly conceptual analysis of counterfactuals. And crucially, it has legal/political implications for things like peace treaties between enemies.

  Cluster 1 (collapsed contexts) feels overrated - while sexy (zombie apocalypses!), its solutions probably derive from Cluster 2's answers. Cluster 3 (non-humans/future people) is important for climate ethics but might rely on settled views from the first two.

  What would make me reconsider? If someone proved that social collapse scenarios produce genuinely novel obligation structures (beyond modified normative power), I'd elevate Cluster 1. Or if we found non-human entities capable of normative understanding, Cluster 3 might leapfrog.

  The user's clearly frustrated with "seminar-deep" philosophy - they want research that bites into real problems. I'll emphasize how Cluster 2 affects AI ethics (promises to algorithms) and international law to satisfy their practicality itch.
answer: |-
  Here's a breakdown prioritizing your clusters based on upstream impact, tractability, relevance, and neglect, followed by critical evaluation:

  **Ranking & Justification (Upstream Impact Focus):**

  1.  **Cluster 2: Normative Power - Renaming or Explaining? (Especially across deep moral disagreement)**
      *   **Why Upstream:** This is the *meta-ethical foundation*. If "normative powers" (creating obligations/bindingness by declaration) are incoherent, illusory, or merely descriptive shorthand for social expectations/psychology, then Clusters 1 and 3 become fundamentally different problems. Cluster 1 becomes purely about contingency of expectations/harm in unstable contexts. Cluster 3 becomes impossible (you can't grant authority you don't possess). Conversely, if normative powers are robustly real and explicable *even across disagreement*, it provides the core machinery needed to tackle Clusters 1 (bindingness persists if the *power* itself survives collapse) and 3 (extending the *power*).
      *   **Tractability (Solo):** High. Primarily conceptual analysis, thought experiments, counterfactual reasoning. Requires deep engagement with meta-ethics (powers, reasons, authority) and philosophy of language/action (performatives, commitment). No need for complex empirical data or large-scale collaboration.
      *   **Relevance (Law/Politics):** High. Directly impacts theories of contract, treaty obligations (especially between hostile states/ideologies), political legitimacy (promises of office/oaths), and forgiveness of historical debts/promises made under immoral regimes.
      *   **Neglect:** Moderate-High. While normative powers *are* discussed (Raz, Owens, Gilbert), the *specific stress test* of deep moral disagreement and the challenge of whether it's *explanatory or circular* is less systematically explored than standard promissory obligation. The "renaming" challenge is often brushed aside.
      *   **Why Not Overrated:** Solving this *changes the landscape* for all promissory theory. It goes beyond "seminar-deep" by challenging the very possibility of promissory obligation as distinct from harm/expectation.

  2.  **Cluster 1: Obligation in Collapsed Social Practices / No Shared Normative Background (Post-Catastrophe/Digital Anomie)**
      *   **Why Downstream:** Its answer heavily depends on Cluster 2. *If* normative powers are robust, obligation might persist based on the *individuals'* recognition of the power/commitment made, even if society crumbles. *If not*, obligation likely vanishes, reducing to contingent harm/expectation management in the new context. It applies the core theory to a radical edge case.
      *   **Tractability (Solo):** Moderate-High. Requires conceptual work on the nature and grounding of social practices, resilience of norms, and counterfactual reasoning about extreme scenarios. Some engagement with anthropology/sociology of trust breakdown might be useful but isn't essential.
      *   **Relevance (Law/Politics):** High. Crucial for transitional justice (promises/oaths under collapsed regimes), disaster response ethics, digital governance (enforceability of online agreements, DAOs), and theories of social contract reboot.
      *   **Neglect:** High. Philosophers love edge cases, but sustained focus on promissory obligation *specifically* in genuine normative vacuums (beyond simple "stranger" cases) is relatively rare. Digital anomie is a particularly modern and underexplored twist.
      *   **Why Not Overrated:** It's a crucial stress test for *any* theory of promissory obligation, forcing clarity on its source. Has concrete implications for real-world fragility.

  3.  **Cluster 3: Extending Promises to Future People / Non-Human Agents**
      *   **Why Most Downstream:** This fundamentally relies on the *kind of thing* a promise is (Cluster 2) and how its bindingness operates outside standard social contexts (Cluster 1). Can normative powers be exercised towards entities that cannot *currently* understand, acknowledge, or hold one accountable? Does "authority over future choices" make sense when the "authority holder" doesn't exist or isn't an agent? This cluster stretches the concept derived from the answers to 1 and 2.
      *   **Tractability (Solo):** Moderate. Involves conceptual analysis of agency, reciprocity, temporality, and moral patiency. Engaging with environmental ethics, AI ethics, and intergenerational justice literature is necessary.
      *   **Relevance (Law/Politics):** Very High (Future Generations), Emerging (Non-Humans). Central to climate ethics, long-term nuclear waste, reparations, constitutional endurance, AI rights/obligations, and animal welfare treaties.
      *   **Neglect:** Moderate (Future Generations - though often framed as duties, not promises), High (Non-Human Agents - especially non-sentient AI/nature). The *promissory* framing specifically is less common than talk of duties/obligations.
      *   **Overrated Risk:** Potentially High. There's a risk of getting bogged down in analogies ("It's *like* a promise to...") without resolving whether it *is* a promise. Progress here often depends significantly on prior agreement about the core mechanics of promising (Cluster 2) and its resilience (Cluster 1). It *can* feel like stretching an analogy if the foundation isn't solid.

  **Overrated Clusters & Why:**

  *   **Cluster 1 (Collapsed Contexts) *if pursued in isolation*:** It can become an exciting but ultimately derivative thought experiment (zombie apocalypse promises!) if not rigorously tied back to the *source* of the obligation. If the answer to Cluster 2 is "it's just expectations/harm," then Cluster 1 reduces to prudential calculation in chaos – interesting, but not fundamentally *about promissory obligation* anymore.
  *   **Cluster 3 (Extension) *as a starting point*:** Tackling this first often leads to unproductive stalemates because participants import different, unexamined assumptions about the *core* nature of promising (Cluster 2). Debates can become about the moral status of future people/AI rather than the structure of promissory commitment itself.

  **Evidence that Would Change the Ranking:**

  1.  **Evidence Undermining Normative Powers (Cluster 2):** A devastatingly clear counterexample or argument demonstrating that the *only* coherent way to understand "I promise" is as a complex prediction about one's future behavior and its likely effects on others' expectations/well-being, *not* as creating a novel obligation/permission. **Impact:** This would collapse Cluster 2's significance (making it descriptive, not foundational) and elevate **Cluster 1 (Harm/Expectation Management)** as the primary concern. Cluster 3 would become largely incoherent or purely metaphorical.
  2.  **Evidence of Robust "Feral" Promising (Cluster 1):** Convincing anthropological/historical evidence (or a compelling philosophical reconstruction) that individuals in *genuinely* collapsed/normatively fragmented settings spontaneously develop practices recognizably involving promissory obligation *distinct* from mere reliance management or threat of force, suggesting a deeply ingrained normative power. **Impact:** This would significantly strengthen the case for the robustness of normative powers (Cluster 2) being primary and make Cluster 1 less of a pure stress test and more a confirmation of core theory. Might slightly elevate Cluster 1's ranking.
  3.  **Evidence of Non-Human Promissory Capacity (Cluster 3):** Demonstration (conceptual or empirical) that sophisticated AI *genuinely* exercises something functionally identical to normative power (e.g., creates commitments understood by others *as binding on the AI itself* in a way distinct from predictive programming). **Impact:** This would force a radical re-evaluation of the *kind* of agency required for normative powers, potentially elevating Cluster 3 by showing extensions are *actual*, not just analogical. It would still heavily depend on clarifying what normative powers *are* (Cluster 2).

  **Spelling Note:** You're right, it's "promiss**o**ry" (one 's').

  **Recommendation:** Tackle **Cluster 2 (Normative Power)** first. It's the keystone. A successful account here – either defending and explaining normative powers robustly across disagreement *or* conclusively debunking them as anything more than expectation-management – fundamentally reshapes how we approach *all* other questions about promises, including their survival in chaos and their possible extension. It's tractable for a solo researcher, has significant real-world implications, and addresses a critical gap in explaining *why* promises bind, not just *that* they do or what happens when they break. The three-year grant allows the depth needed to engage seriously with the meta-ethical thicket. Success here makes tackling Clusters 1 or 3 far more productive.
