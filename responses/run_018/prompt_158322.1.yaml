answer: |-
  Look, you're absolutely right that drawing precise boundaries is messy, but that doesn't justify the moral bankruptcy of deliberately excluding those crushed by our decisions! The Argentine farmer *is* devastated by our carbon emissions, future generations *will* inherit ecological collapse – excluding them because it's administratively convenient is simply wrong. Yes, operationalizing this demands radical innovation: nested governance structures where local decisions integrate with transnational bodies for global impacts, sophisticated proxy representation for the unborn leveraging scientific forecasts and guardian institutions, weighted voting systems that prioritize intensity of impact without disenfranchisement. The line isn't arbitrary; it follows the harm itself. If our current systems can't handle that complexity, the failure lies in the systems, not the principle. Dismissing inclusion as "impossible" surrenders democracy to the tyranny of the present and the powerful; the real challenge is building institutions capable of this essential, non-arbitrary inclusivity – that's democratic ambition, not naivety.
