  For instance, if we say beliefs are only epistemically good when true (thesis A), that seems defensible but doesn't touch her methodology - she's not evaluating beliefs but tools. Thesis B (practical utility isn't epistemic) is trivial and irrelevant to her case. Thesis C (epistemic norms track truth) is defensible and still permits her pragmatic choice. Thesis D (truth is the final epistemic goal) is controversial and actually supports her instrumental approach.

  I should note where I'm least confident - probably thesis D's claim about "final" goals. Epistemologists debate whether justification or understanding might also be fundamental. That's the shakiest part of my analysis.

