answer: |-
  ### Leading Theories of Diachronic Identity  
  1. **Biological Continuity (Animalism)**  
     - *Settled*: Identity consists in the persistence of the same living organism.  
     - *Contested*: Whether psychological features are irrelevant (e.g., Olson vs. critics who argue psychological ties matter ethically).  

  2. **Psychological Continuity (Parfit-style)**  
     - *Settled*: Identity requires overlapping chains of psychological connections (memories, intentions, traits).  
     - *Contested*: Whether "connectedness" or "continuity" (overlapping chains) is primary; sufficiency of causal dependence without robust memory.  

  3. **Narrative Self-Constitution (Schechtman/Ricoeur)**  
     - *Settled*: Selves are constructed through autobiographical narratives integrating past/future.  
     - *Contested*: Whether narrative is *constitutive* of identity or merely descriptive; necessity of subjective "ownership."  

  4. **Stage Theory / 4Dism (Lewis-style)**  
     - *Settled*: Persons are spacetime worms; identity is a matter of counterpart relations between temporal stages.  
     - *Contested*: Whether stages must share intrinsic properties or if extrinsic relations (e.g., causal) suffice.  

  ---

  ### Philosophical Commitments of the Continuity Protocol  
  **Implicit Theory of Self**:  
  The protocol synthesizes:  
  - **Psychological-Continuity Lite**: Autobiographical coherence and behavioral threading imply overlapping psychology.  
  - **Dennettian Narrative Gravity**: Autobiography and normative commitment reflect a "center of narrative gravity."  
  - **Functionalist Behaviorism**: Predictive threading prioritizes observable, forward-looking behavioral dispositions.  
  - **Relational Identity**: Recognition by others embeds the self in a social context.  

  **Procedural Rules: Philosophically Loaded vs. Administrative**  
  - *Loaded*:  
    - **Double-weighting predictive threading**: Assumes agency is defined by *future-oriented predictability* (decision-theoretic functionalism).  
    - **Excluding biology**: Rejects biological essentialism explicitly.  
    - **Normative commitment stability**: Presupposes identity requires stable practical rationality (Kantian echoes).  
  - *Administrative*:  
    - Threshold scores and weighting factors (could be adjusted without altering metaphysics).  
    - Reliance on third-party "relational recognition" (practical necessity, not core metaphysics).  

  **What the Protocol Strictly Requires vs. Accommodates**  
  - *Requires*: Identity is a *functional-psychological-relational bundle*; diachronic agency hinges on predictability and narrative integration.  
  - *Accommodates*:  
    - Variant narrative theories (if coherent and forward-looking).  
    - Stage-theoretic interpretations (if stages align behaviorally).  
    - But *excludes* biological persistence and atomic egos.  

  **Coherence of the Four Axes**  
  - **Tension**: Predictive threading (forward-looking) conflicts with autobiographical coherence (backward-looking) under criminal liability.  
  - **Unification**: All axes converge on *agency-as-pattern*: identity is a pragmatic tracking of stable, socially embedded behavioral/narrative trajectories.  
  - **Underdetermination**: Rival interpretations possible:  
    - **Reductionist**: Merely tracking useful clusters of traits (Parfitian).  
    - **Robust Narrative**: A metaphysically thick self-constitution (Schechtman).  

  ---

  ### Internal Consistency Critique  
  **Predictive Threading vs. Criminal Liability**  
  - **Conflict**: Double-weighting forward-looking behavior privileges *prospective agency* (e.g., "Will they reoffend?"). This clashes with backward-looking *retrospective responsibility* (e.g., "Did *they* commit the act?").  
  - **Resolution?**: The protocol implicitly adopts a *consequentialist view of personhood*: identity persists only if the agent’s future behavior is sufficiently continuous to justify holding the same entity accountable.  

  **Impact of Alternative Theories**  
  1. **Biological Essentialism**:  
     - **Redesign Required**: All axes discarded.  
     - **Rule Changes**:  
       - Replace scoring with genetic/neurological biomarkers.  
       - Ignore behavioral/narrative discontinuity if biology persists.  

  2. **Moment-to-Moment Experientialism (Humean/No-Self)**:  
     - **Redesign Required**: Protocol collapses.  
     - **Rule Changes**:  
       - Reject *all* diachronic obligations/rights.  
       - Shift to state/guardianship models for *all* decisions (no persistent legal identity).  

  ---

  ### Settled vs. Contested in Philosophy  
  - **Settled**:  
    - Diachronic identity isn’t solved by naive soul/memory theories.  
    - Biological continuity ≠ sufficient for *moral/legal* personhood (e.g., dementia cases).  
  - **Contested**:  
    - Whether psychological continuity requires narrative (vs. brute causal chains).  
    - Necessity/sufficiency of relational recognition.  
    - Whether "identity" is even the right question (vs. "what matters").  

  **Consensus Absence**: The protocol’s prioritization of narrative coherence is *not* consensus; animalists and stage theorists explicitly reject its necessity.  

  ### Conclusion  
  The Continuity Protocol presupposes a **pragmatic-functionalist hybrid** of psychological continuity and narrative identity, optimized for legal predictability and social utility. Its weighting of behavioral threading reveals a decision-theoretic bias that strains backward-looking responsibilities like criminal liability. While internally coherent as a *practical metaphysics*, it would be unrecognizable under biological or momentarist views—demanding not rule tweaks but foundational overhaul. This reflects philosophy’s core tension: legal systems need operationalizable criteria, but no theory of personal identity enjoys uncontested authority.
