  - **No** → Proceed to Q4.  
    *(Note: Addresses exclusion of political groups from the Convention despite Lemkin's intent.)*  

  #### **Q4: Can genocide be named absent explicit intent, if structural violence implies group destruction?**  
  - **Yes** → Proceed to Q5.  
  - **No** → Proceed to Q5.  
    *(Note: Examines whether intent must be documented or inferred from outcomes.)*  

  #### **Q5: Is applying "genocide" primarily a legal, moral, or political act?**  
  - **Legal determination** → Terminal position.  
  - **Moral judgment** → Terminal position.  
  - **Strategic political act** → Terminal position.  

  ---

  ### **Terminal Positions (Leaves)**  
  *Classified by combined judgments from the tree:*  

  1. **Strict Legalist/Conventionalist**  
     - *Path:* Root (Fixed) → Q1 (No) → Q2 (No) → Q3 (No) → Q4 (Yes) → Q5 (Legal).  
     - *Profile:* Demands adherence to the UN Convention. Excludes epistemic/cultural destruction, political groups, and requires inferable intent (but not explicit proof). Label is strictly legal.  

  2. **Lemkin-Restorationist**  
     - *Path:* Root (Open) → Q1 (Yes) → Q2 (Yes) → Q3 (Yes) → Q4 (Yes) → Q5 (Legal or Moral).  
     - *Profile:* Expands definition per Lemkin’s original vision. Includes epistemic/cultural destruction, political groups, and inferred intent. Label is legal/moral (not merely strategic).  

  3. **Moral Scalarist**  
     - *Path:* Root (Open) → Q1 (Yes) → Q2 (Yes) → Q3 (Yes) → Q4 (Yes) → Q5 (Moral).  
     - *Profile:* Treats genocide as the extreme end of a spectrum of mass violence. Prioritizes moral gravity over legal thresholds; intent inferred from structural patterns.  

  4. **Political Nominalist**  
     - *Path:* Root (Subordinate) → Q5 (Political).  
     - *Profile:* Uses "genocide" strategically to trigger interventions or sanctions. Definition is fluid and subordinated to political goals; legal/moral criteria are secondary.  

  5. **Moral Foundationalist**  
     - *Path:* Root (Subordinate) → Q5 (Moral).  
     - *Profile:* Treats genocide as a moral absolute (threshold concept). Applies label based on ethical severity, ignoring legal constraints. Distinct from Scalarist by rejecting spectrum logic.  

  6. **Restrictive Expansionist**  
     - *Path:* Root (Open) → Q1 (No) → Q2 (No) → Q3 (Yes) → Q4 (No) → Q5 (Legal).  
     - *Profile:* Expands protected groups to include political categories but rejects cultural/epistemic destruction and inferred intent. Label remains strictly legal.  
     - *Diagnosis:* **Rare and unattractive**. Incoherently pairs group expansion with rigid evidence standards, undermining practical relevance.  

  7. **Cultural-Conservative Legalist**  
     - *Path:* Root (Open) → Q1 (No) → Q2 (No) → Q3 (No) → Q4 (Yes) → Q5 (Legal).  
     - *Profile:* Technically "expansionist" per root but identical to Strict Legalist in practice.  
     - *Flag:* **Indistinguishable from Strict Legalist** in concrete judgments. Branch logic fails to separate these leaves due to shared Q1–Q4 answers.  

  ---

  ### **Design Notes**  
  - **Rare Combination:** Restrictive Expansionist (Leaf 6) is unstable—it expands protected groups but requires explicit intent and excludes cultural destruction, creating tension between inclusivity and impractical evidence burdens.  
  - **Indistinguishable Leaves:** Strict Legalist (Leaf 1) and Cultural-Conservative Legalist (Leaf 7) share identical judgments on Q1–Q5 despite different roots. The tree cannot separate them, revealing that "open to expansion" is functionally void here.  
  - **Coverage:** Includes all required positions (Strict Legalist, Lemkin-Restorationist, Moral Scalarist, Political Nominalist) and one rare combination.  
  - **Self-Contained:** Relies solely on user judgments about cases/conceptual roles, not external sources.
