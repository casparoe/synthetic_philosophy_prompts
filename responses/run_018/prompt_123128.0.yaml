answer: |-
  ## Taxonomy of Guilt vs. Shame: Cultures, Choice, and Moral Emotion

  **Root Split: Are guilt and shame genuinely distinct emotional responses?**
  *   **Yes, they are distinct.** → Proceed to Split 2A.
  *   **No, they are fundamentally the same feeling.** → Proceed to Split 2B.

  **Split 2A (Distinct): What primarily defines the distinction?**
  *   **The Audience:** Shame requires (real or imagined) awareness/witness by others; guilt is inherently private/internal. → Proceed to Split 3A.
  *   **The Target:** Guilt evaluates a specific *act* or failure; shame evaluates the *entire self* or character. → Proceed to Split 3B.

  **Split 3A (Audience-Based): Can a culture deliberately shift its dominant emotion?**
  *   **Yes, institutions can reshape the dominant emotion.** → Proceed to Leaf conditions.
  *   **No, emotional wiring is fixed; culture only dresses biology.** → Proceed to Leaf conditions.
      *   *Leaf Condition: Can one feel "outsider moral pain" (e.g., shame/guilt for violating a norm you reject)?*
          *   **Yes:** Unnamed (Possible "Social Contagion Realist")
              *   *Awkward Commitment:* You must accept that deeply internalized social conditioning can make you feel morally distressed by actions you intellectually deem acceptable or even good.
          *   **No:** Unnamed (Possible "Authentic Emotion Purist")
              *   *Awkward Commitment:* You must deny the psychological reality of phenomena like feeling shame for "letting the team down" even if you disagree with the team's rule, or guilt for breaking a religious law you no longer believe in.

  **Split 3B (Target-Based): Which fosters a healthier moral life?**
  *   **Guilt (Act-Focused):** Focus on repairing specific wrongs is healthier. → Proceed to Leaf conditions.
  *   **Shame (Self-Focused):** Focus on transforming character is healthier. → Proceed to Leaf conditions.
      *   *Leaf Condition: Can one feel "outsider moral pain"?*
          *   **Yes:** Unnamed (Possible "Moral Identity Pluralist")
              *   *Awkward Commitment:* You must accept that feeling shame for a specific act you reject (self-target) or guilt for violating a rejected norm (act-target) are valid and potentially productive moral experiences, even stemming from conflicting identities.
          *   **No:** Unnamed (Possible "Integrity Essentialist")
              *   *Awkward Commitment:* You must argue that feeling shame or guilt for violating a norm you genuinely reject indicates a harmful lack of personal integrity or self-knowledge, not a valid moral emotion.

  **Split 2B (Not Distinct): What is the nature of the apparent difference?**
  *   **An Intensity Scale:** "Guilt" is mild social-pain; "Shame" is its intense, exposure-triggered form. → Proceed to Leaf conditions.
  *   **A Linguistic Artifact:** The distinction collapses outside specific Western psychological frameworks. → Proceed to Leaf conditions.
      *   *Leaf Condition: Can one feel "outsider moral pain"?*
          *   **Yes:** Unnamed (Possible "Universal Social Pain Pragmatist")
              *   *Awkward Commitment:* You must argue that the discomfort felt for violating *any* salient social norm, accepted or not, is essentially the *same* emotion, varying only in intensity ("guilt-shame") based on context like publicity or self-relevance.
          *   **No:** Unnamed (Possible "Normative Commitment Fundamentalist")
              *   *Awkward Commitment:* You must deny that violating a norm you actively reject can generate genuine moral distress ("guilt-shame"); any discomfort must be purely fear of punishment or annoyance at inconvenience, not intrinsic moral pain.

  ---

  **Appendix: Logically Possible but Unoccupied Cells**

  1.  **Distinct (Audience-Based) + Can Redesign + *Cannot* feel Outsider Pain:** Unattractive. If institutions can reshape emotions, it's highly implausible they couldn't also instill pain for violating *external* norms (like honor codes or group expectations one might privately question). Denying this requires awkwardly limiting institutional power arbitrarily.
  2.  **Distinct (Target-Based) + Shame Healthier + *Cannot* feel Outsider Pain:** Unattractive/Unexplored. If transforming the self (shame) is healthier but one *cannot* feel shame for violating rejected norms, this implies shame only works for norms you accept. This undermines shame's claimed power for deep character reform in the face of conflicting values (e.g., reforming a bigot). Why prioritize an emotion seemingly limited to existing commitments?
  3.  **Not Distinct (Intensity Scale) + *Cannot* feel Outsider Pain:** Incoherent. If "guilt-shame" is one feeling on an intensity scale triggered by norm violation, it makes no sense to claim intensity *only* scales up for norms you accept. The intensity trigger (e.g., publicity, importance) should be separable from personal endorsement.
  4.  **Not Distinct (Linguistic Artifact) + *Cannot* feel Outsider Pain:** Unattractive. If the distinction is purely Western labeling, consistently denying outsider pain across *all* cultural frameworks for this branch becomes a strong, empirically dubious claim about the universal necessity of personal norm endorsement for social pain. It's simpler to allow variation.
  5.  **Distinct (Audience-Based) + Fixed Wiring + *Cannot* feel Outsider Pain:** Unexplored/Unattractive. If biology fixes shame (audience) vs. guilt (private), claiming one *cannot* feel audience-based shame for violating a rejected norm implies a fixed biological link *also* requires personal norm endorsement. This adds an unnecessary layer of biological restriction not implied by the core audience distinction.
