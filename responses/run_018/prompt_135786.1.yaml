  make it messy, like you're talking to a smart friend who's helping me fix the scene. don't cite anyone, i can't check footnotes without breaking the narrative flow. and sorry if my notes are sloppy — i keep typing 'intenionality' with the o and e swapped, but you get the idea. just argue it through, specific and weird, not a textbook summary.
