  3.  **(4) & (1):** The tension is practical (how we apply the label) rather than conceptual. The fix ensures "ahead of their time" is grounded in historical context, avoiding crude presentism.
  4.  **Single Best Revision:** Refining (2) to explicitly decouple moral improvement from inevitability or directionality addresses the most severe tension and weakens potential Whiggish interpretations elsewhere. It's the most impactful change with minimal cost to core beliefs.
  5.  **Epistemic Check:** Focuses on the core philosophical vulnerability (can we objectively define progress across radically different contingent paths?) and identifies a potential empirical challenge. The weakness acknowledges the difficulty of fully reconciling moral realism with radical historicism.
