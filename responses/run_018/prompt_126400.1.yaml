answer: |-
  Your inquiry cuts to the heart of Buddhist metaphysics and ethics, demanding an analysis of how *kamma* (intentional action with moral weight), rebirth, and *anattā* (non-self) cohere. The tension is **structurally real but operationally resolved** through dependent origination (*paṭiccasamuppāda*), transforming it from a logical contradiction into a dynamic, impersonal causal process. Here’s a rigorous deconstruction:

  ### 1. **The Core Tension: Consequentialism Without a Subject**
     - **The Problem**: If there is no enduring self (*attā*), what connects the agent of a kammic act (e.g., a decision to withhold life-prolonging treatment) with the future being who experiences its fruits (*vipāka*)? How can consequences "belong" to a nonexistent entity?
     - **The Framework**: Buddhist ethics is **non-linear consequentialism**. Kusala (wholesome) and akusala (unwholesome) acts generate results not as "rewards/punishments" for a self, but as impersonal causal patterns (*sankhāra*) embedded in the mental continuum (*citta-santāna*). *Anattā* negates a *substantial* self, not causal continuity.

  ### 2. **Resolving the Tension: Causal Continuity, Not Identity**
     - **Citta-Santāna (Mental Continuum)**: This is the linchpin. It is a stream of momentary, dependently arisen mental states, not an enduring self. Kammic imprints (*bīja*, seeds) are carried in this stream via *sankhāra* (volitional formations). 
       - **Mechanism**: When you make a decision, the *cetanā* (volition) behind it alters the structure of the mental continuum. This modified continuum, governed by dependent origination, conditions future states—including rebirth and subsequent experiences. No "self" transfers; causal patterns (*nidānas*) like *avijjā* (ignorance) and *taṇhā* (craving) perpetuate the stream.
     - **Kamma as Impersonal Causality**: Kamma operates like a law of nature, not moral accounting. The "fruit" (*vipāka*) arises when conditions support its maturation in the mental continuum. The being experiencing the fruit is neither identical to nor entirely different from the being who acted—they are causally contiguous links in a chain.

  ### 3. **Kusala/Akusala: Instrumental Heuristics for Cessation**
     - **Deontic or Consequentialist?** Neither exclusively. Kusala/akusala is **teleologically oriented toward cessation (*dukkha-nirodha*)**. 
       - **Akusala**: Actions rooted in *lobha*, *dosa*, *moha* (greed, hatred, delusion) bind the mental continuum to *saṃsāra* by reinforcing ignorance and craving. They are "unwholesome" *because* they perpetuate suffering.
       - **Kusala**: Actions rooted in *alobha*, *adosa*, *amoha* (non-greed, non-hatred, non-delusion) weaken *saṃsāric* bonds. They are "wholesome" *instrumentally*, as they create conditions conducive to insight and release.
     - **Constraint vs. Heuristic**: The distinction is both:
       - **Constraint**: Akusala acts inherently embody ignorance, reinforcing *dukkha* regardless of immediate outcome. 
       - **Heuristic**: Kusala acts reduce mental afflictions (*kilesa*), making nibbānic insight more probable. Outcomes matter, but the primary "outcome" is the quality of the mental continuum itself.

  ### 4. **Upāya-Kauśalya (Skillful Means) in the Absence of Self**
     - **Agency Without Agent**: Skillful means is possible precisely *because* there is no fixed self. The "agent" is a temporary configuration of the five aggregates (*khandhas*), capable of acting with wisdom (*paññā*) or delusion. 
       - **Function**: *Upāya* leverages the causal power of volition (*cetanā*) to alter the mental continuum’s trajectory. A compassionate decision (e.g., palliative care over aggressive intervention) plants kusala seeds that:
         1. Reduce suffering now.
         2. Weaken future conditions for afflictive mental states.
       - **Anattā’s Role**: Because there is no self to "own" the action, *upāya* focuses solely on the act’s impact on the causal stream—liberating ethics from ego-attachment.

  ### 5. **Harming vs. Failing to Benefit: Does Anattā Collapse the Distinction?**
     - **Structural Asymmetry**: *Anattā* does **not** collapse this distinction. Why?
       - **Harming (e.g., active euthanasia)**: Requires volition (*cetanā*) directly rooted in *dosa* (aversion) or *moha* (delusion). This implants akusala seeds that intensify suffering in the mental continuum.
       - **Failing to Benefit (e.g., withholding futile treatment)**: May arise from *moha* (ignorance) but can also stem from *karuṇā* (compassion) if motivated by reducing needless suffering. The kammic weight hinges on *cetanā* and the act’s causal impact on the mental stream.
     - **Key Insight**: The distinction persists because kamma evaluates the *quality of intention* and its *effect on the continuum*, not because a "self" is harmed. Harmful acts generate more toxic sankhāra than omissions—unless the omission is malicious (e.g., neglect).

  ### Synthesis: Structural but Non-Contradictory
  The tension is **structural** because:
  - It demands reconciling personal responsibility with ontological emptiness.
  - It requires ethics to function across time without a temporal subject.

  But it is **resolved** through:
  - **Dependent Origination**: The impersonal, causal linking of volitional acts to their fruits via the mental continuum.
  - **Teleology of Cessation**: Kusala/akusala acts are valenced by their saṃsāric implications, not abstract duty.
  - **Primacy of Cetanā**: The mental impulse behind an act—not its physical form—determines its kammic signature.

  **Conclusion**: In dementia care decisions, the ethical focus shifts from "What does a self deserve?" to "What volitional patterns will this act embed in the mental continuum?" Authorizing or withholding interventions is kammically significant based on:
  1. The quality of intention (compassion vs. aversion/attachment).
  2. The act’s likely impact on reducing *dukkha* for all involved (patient, caregiver, continuum).
  3. Its alignment with weakening, not reinforcing, ignorance and craving.

  The "patient" is a dynamic, suffering-laden process (*santāna*), not a static self. Skillful action addresses the process with wisdom, knowing that intentions ripple through causality without an owner to claim them. The tension is real but navigable within the architecture of paṭiccasamuppāda.
