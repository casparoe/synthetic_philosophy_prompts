prompt: |-
  I'm preparing a fifty-minute seminar for second-year philosophy undergraduates on Wittgenstein's notions of language games and family resemblance. Rather than using the familiar illustration of games, I want to build the session around the term boundary — comparing how property lawyers, geographers, and tidal surveyors each determine where something ends — to show how one word operates across disparate practices without a shared essence. The students have recently studied Eleanor Rosch's prototype theory, so they are likely to interpret Wittgenstein through that framework. Do not explain the concepts to me; instead, plan the explanatory arc. Set out the dependency order: what must be secured before family resemblance can be introduced, and why? Specify exactly what the boundary example must possess and what it must lack in order to carry the point without collapsing into vagueness or statistical clustering. Map the misconceptions they will form — I expect they will conflate family resemblance with Rosch's prototypes, assume Wittgenstein denies every shared feature, and reduce language games to mere social contexts — and indicate the precise point in the sequence where each should be headed off. Propose one closing question that reveals whether they have grasped the conceptual structure rather than repeating a formula. Finally, state what should be deliberately left out at this level and openly acknowledged. Please write your answer in British English.
reasoning: |-
  Okay, let me approach this Wittgenstein seminar request methodically. The user wants an unconventional approach using "boundary" across professions to illustrate language games and family resemblance, while addressing predictable student misconceptions stemming from Rosch's prototype theory. 

  Hmm, the key challenges appear to be: ensuring the boundary example avoids essentialism without seeming vague, sequencing concepts to prevent cognitive shortcuts, and designing a diagnostic closing question. The students' recent exposure to Rosch means I must anticipate where they'll conflate prototype gradients with family resemblances. 

  Right, first I'll structure the conceptual dependencies: language games must precede family resemblance because without establishing the primacy of practice, students might reduce boundaries to abstract categorisation. The boundary examples need to showcase three things: different operational criteria (legal deeds vs tidal charts), absence of universal rules, yet clear functionality within each game. Crucially, they must lack any common measurement technique or underlying principle. 

  Ah, the misconceptions! I'll need to intercept three specifically: 1) During the profession comparison, when showing overlapping but not universal features, I must explicitly contrast this with Rosch's central tendencies. 2) When introducing family resemblance, I'll emphasise Wittgenstein isn't denying shared features locally but rejecting trans-contextual essences. 3) While discussing boundary disputes, I'll clarify that language games aren't just social contexts but constitutive rule-systems. 

  For the closing... perhaps a question forcing application: "If a philosopher claimed all boundaries involve separation, how would Wittgenstein respond using today's examples?" This tests if they see context-dependence versus definitional necessity. 

  Deliberate omissions: depth of rule-following debates and private language arguments. Best to acknowledge these as future directions rather than overcomplicate. 

  The arc should flow: concrete boundary practices → language games as framing → emergence of family resemblance concept → targeted misconception-busting → diagnostic application. Must keep British English throughout per request.
answer: |-
  Here’s a structured plan for your seminar, focusing on conceptual sequencing, targeted interventions, and avoiding key misconceptions:

  **Explanatory Arc & Dependency Order**  
  1. **Establish 'Language Games' First** (15 mins)  
     - **Why first?** Without grounding in *practice*, students will misread "boundary" as a Roschian category.  
     - **Method:** Contrast three "boundary" practices:  
       - *Property Lawyer:* Fixed coordinates in deeds; emphasis on legal precedent.  
       - *Physical Geographer:* Topographical features (e.g., watersheds); contingent on erosion/sedimentation.  
       - *Tidal Surveyor:* Mean high-water mark; statistical averaging of fluid data.  
     - **Crucial Move:** Highlight *what each practice DOES* with "boundary" (resolve disputes, predict erosion, navigate ships).  

  2. **Introduce 'Family Resemblance' via Observed Tensions** (20 mins)  
     - **Prerequisite:** Secure that "boundary" has *no cross-contextual function*.  
     - **Method:** Ask: *"What single rule determines 'boundary' in all three cases?"* Expose contradictions:  
       - Lawyers reject tidal averages; surveyors ignore deeds; geographers see both as oversimplified.  
     - **Key Example Features:**  
       - **MUST POSSESS:** Clear *internal criteria* within each practice (e.g., "legally binding" vs. "empirically measurable").  
       - **MUST LACK:** Any *universal feature* (e.g., separation isn’t sufficient – hedges may be boundaries for lawyers but not geographers).  
     - **Avoid:** Letting "overlaps" (e.g., maps used in court) imply a core essence. Stress *tool repurposing*, not shared meaning.  

  **Targeted Misconception Mitigation**  
  | **Misconception** | **When to Interrupt** | **Counter-Move** |  
  |-------------------|------------------------|------------------|  
  | **Conflating w/ Rosch** | During family resemblance intro | *Contrast:* "Rosch asks how we categorise 'a boundary'. Wittgenstein asks why we call *these distinct activities* 'determining boundaries' at all." |  
  | **"No shared features" Straw Man** | When listing cross-practice differences | *Clarify:* "Wittgenstein denies a *necessary and sufficient* feature. Lawyers and surveyors both use measurements – but differently. Overlaps ≠ essence." |  
  | **Reducing to "Social Context"** | During language games discussion | *Reframe:* "A 'game' isn’t just 'social'. It’s defined by its *rules*. If tidal data entered court, it would be *playing a new game* – legal evidence, not surveying." |  

  **Closing Diagnostic Question**  
  *"If a coastal property dispute arose between a lawyer (using deeds) and a geographer (using erosion data), why wouldn’t Wittgenstein see this as a *failure* of the word 'boundary' – and what would it reveal about language?"*  
  - **Tests for:** Understanding that meaning resides in use within a game, not referential precision; recognises incommensurability as *normal*.  

  **Deliberate Omissions & Acknowledgements**  
  - **Omit:** Rule-following paradox (§201) and private language argument.  
  - **Acknowledge Openly:** "Today we’ve treated 'language games' as stable for clarity. But Wittgenstein saw them as fluid, overlapping forms of life. This is a starting point, not the full picture."  

  **Why This Sequence Works**  
  The boundary example avoids "vagueness" by showing *three precise, non-arbitrary practices*. It evades "statistical clustering" (Rosch’s danger) by demonstrating *functional incompatibility* – tidal data isn’t a "poor example" of a legal boundary; it belongs to a different game. Family resemblance emerges *from the practices*, not as an alternative theory of categorisation.
