prompt: |-
  I'm an ethics consultant in a busy hospital and I get paged ocassionally — maybe twice a week — for consent conflicts that have to be settled in about twelve minutes because surgery is waiting or family is in the hallway yelling. I have to put my own signature on the call; there's no ethics committee at 3am to hide behind. I need a reusable checklist that turns deontology into something I can actually run, especially the paradox where absolute duties to autonomy and non-maleficence seem to make me violate one no matter which I pick.

  The procedure should be steps I can run in order, with the judgment-call parts clearly flagged and not disguised. Specifically include:

  - How to identify the active duties in the case, not just list Kantian rules
  - A shadow-maxim test: state the maxim of the action I recommend and the maxim of the exception I'm allowing, then check whether both can be willed as universal law for anyone in my clinical role without contradiction. If they can't, that's a real conflict, not an apparent one.
  - A tie-breaker for genuine conflict — but mark it as a judgment call I'm dressing up as procedure
  - A moral-residue box: document which duty gets overridden and acknowledge it stays violated, so I'm not pretending the paradox disappears
  - The misfire conditions: when does this checklist just collapse?

  Then apply it to three cases. One should give me an answer I'm genuinely not going to like — I want to see the procedure force my hand.

  Case 1: Fully capacitated adult refuses a life-saving transfusion for religious reasons; family begs me to override.

  Case 2: Unconscious trauma patient, no surrogate present yet, old ambiguous chart note that might indicate refusal of aggressive care; surgeon wants to operate immediately or the patient dies.

  Case 3: Patient with intermittent but documented capacity refuses dialysis during a lucid window; family and nephrologist claim depression is driving it, but refusal matches prior values. The procedure should tell me to honor the refusal, knowing it leads to death and legal exposure, and I have to sign my signiture.

  Finally, say plainly what this procedure can't do — it can't prove deontology is right, it can't manufacture missing facts, and it can't replace my judgment under time pressure.

  Keep it practical, not an academic essay. No reading lists or citations, just the steps.
reasoning: |-
  Okay, the user is an ethics consultant in a busy hospital facing high-stakes consent conflicts that require quick decisions. They need a practical, reusable checklist based on deontology, specifically addressing the autonomy vs. non-maleficence paradox. The key elements they want include identifying active duties, a shadow-maxim test, a tie-breaker for genuine conflicts, moral residue documentation, and misfire conditions. They also provided three cases to test the procedure.

  First, I need to unpack their explicit requirements. They want a step-by-step procedure that's actionable in about 12 minutes. The shadow-maxim test is crucial here—it's about universalizing both the action and the exception to see if they cause contradictions. The moral residue box is important too; they don't want to sugarcoat overriding a duty. The misfire conditions need to highlight when the checklist fails.

  Looking deeper, the user might be struggling with the emotional weight of these decisions. They’re alone at 3 a.m., signing off on life-or-death choices. The checklist isn’t just a tool; it’s a way to manage their own moral distress and provide clarity under pressure. They might also need to justify decisions to colleagues or in potential legal reviews, hence the emphasis on documentation and signatures.

  For Case 1, the capacitated adult refusing transfusion: Autonomy is clear here. The shadow-maxim test shows that overriding refusal can't be universalized without contradiction. The tie-breaker and moral residue acknowledge the family's distress but uphold refusal. This aligns with standard medical ethics, but the "answer they won’t like" part suggests discomfort in facing grieving families.

  Case 2 involves an unconscious patient with ambiguous records. The key is identifying if the note indicates refusal. If unclear, non-maleficence (saving life) takes precedence. The shadow-maxim test here allows provisional treatment until clarity. This balances duties but requires judgment on ambiguity.

  Case 3 is tough: lucid refusal of dialysis, with claims of depression. If capacity is confirmed during lucidity and refusal aligns with values, autonomy must win. The procedure forces honoring refusal, leading to death. This is likely the "answer they won’t like" because of legal exposure and emotional conflict with the team.

  The misfire conditions are critical. If capacity assessments are rushed or facts are missing, the checklist fails. The user needs to know when to abandon it and rely on emergency protocols instead.

  Overall, the checklist structures their decision-making, reduces cognitive load, and provides defensible documentation. But it can’t eliminate the inherent tension in deontology or the emotional toll. The moral residue box explicitly acknowledges this, helping the consultant process their responsibility without false resolution.
answer: |-
  Here's your **Deontic Triage Protocol (DTP)** – a practical 12-minute checklist for consent conflicts. It forces explicit tradeoffs while documenting your reasoning. Run it in order:

  ---

  **STEP 1: IDENTIFY ACTIVE DUTIES (2 mins)**
  *   **Ask:** "Whose moral claims are *directly impacted* by my decision *right now*?" (Patient, Surgeon, Family, Institution, You).
  *   **List Duties:** For each stakeholder above, assign core duties (Autonomy, Beneficence, Non-Maleficence, Justice/Fidelity). Be specific:
      *   *BAD:* "Duty to Autonomy."
      *   *GOOD:* "Duty to respect Patient's capacitous refusal (Autonomy)" OR "Duty to prevent Surgeon from causing preventable death (Non-Maleficence)."
  *   **Flag:** Which duties are *absolute* (cannot be overridden without violating core principle) vs. *prima facie* (can be overridden by stronger duty)? *(Judgment Call)*
  *   **Output:** Bullet-point list of 2-4 conflicting duties driving the conflict (e.g., "Patient Autonomy (Absolute)" vs. "Prevent Patient Death (Non-Maleficence/Physician Beneficence)").

  **STEP 2: SHADOW-MAXIM TEST (3 mins)**
  *   **State Your Proposed Action:** "I will [ACTION]."
  *   **Formulate Maxim A (Action):** "When [CIRCUMSTANCES], I will [ACTION] to achieve [INTENDED OUTCOME]."
  *   **Formulate Maxim B (Exception):** "Except when [SPECIFIC REASON IN THIS CASE], I will not follow Maxim A."
  *   **Universalize Both:**
      *   *Maxim A:* "Could *every* clinician *always* act on this maxim in *all* similar cases without contradiction or undermining the practice of medicine?" (e.g., Would medicine collapse if we *always* overrode refusals for life-saving care? Yes.)
      *   *Maxim B:* "Could *every* clinician *always* invoke this *exact* exception in *all* cases meeting this description without contradiction?" (e.g., Could we *always* override refusal *when family begs*? No, that destroys autonomy.)
  *   **Result:**
      *   **Both Universalizable?** Conflict is *apparent*. Re-examine Step 1 duties. Maybe one isn't absolute here.
      *   **Maxim A Fails?** Proposed action is impermissible. Don't do it.
      *   **Maxim B Fails?** Proposed exception is invalid. Acting on Maxim A likely violates a duty.
      *   **Both Fail?** *Genuine Conflict* - Proceed to Step 3.

  **STEP 3: GENUINE CONFLICT TIE-BREAKER (3 mins - *Judgment Call Dressed as Procedure*)**
  *   **Rank Duties:** Using Step 1 list, force rank duties based on:
      1.  **Source of Duty:** Patient-derived duties (Autonomy, Fidelity to *their* wishes) > Clinician-derived duties (Beneficence/Non-Maleficence *as defined by clinician*) > Family-derived duties > Institutional duties. *(Strong Presumption)*
      2.  **Inevitable Harm:** Which duty, if violated, causes harm that is *irreversible* (e.g., death, permanent loss of liberty) vs. reversible (e.g., distress, delay)? *(Judgment Call)*
      3.  **Scope:** Does violating this duty set a precedent affecting *only this patient* or *many future patients* (e.g., eroding trust in consent)? *(Judgment Call)*
  *   **Tie-Break:** Duty ranking highest by Source *usually* wins. If tied, Inevitable Harm breaks it. If still tied, Scope breaks it.
  *   **Output:** "Override [Losing Duty] in favor of [Winning Duty] based on [Source/Harm/Scope Rationale]."

  **STEP 4: MORAL RESIDUE BOX (2 mins)**
  *   **Document Explicitly:** "By choosing [Action], I knowingly override my duty to [Overridden Duty]. This duty remains violated; the moral harm is real and not resolved."
  *   **Acknowledge Impact:** Briefly note the consequence of the violation (e.g., "Patient's deepest values disregarded," "Preventable harm occurred," "Family trust broken").
  *   **Purpose:** Prevents self-deception. Forces ownership of the cost.

  **STEP 5: ACTION & SIGNATURE (1 min)**
  *   State clear recommendation/order.
  *   Sign your name.

  **MISFIRE CONDITIONS (When DTP Collapses):**
  1.  **Unclear Capacity:** Cannot determine patient capacity within timeframe.
  2.  **Missing Critical Fact:** Key information is absent/unobtainable (e.g., *what* did the old note actually say?).
  3.  **Imminent Catastrophe:** Immediate, irreversible harm requires action *faster* than DTP allows (use emergency protocol, document *why* DTP skipped).
  4.  **You Are Compromised:** Severe fatigue, personal stake, coercion prevents objective duty identification.

  ---

  **Case Application:**

  **Case 1: Jehovah's Witness Refusal**
  1.  **Duties:** Respect Patient's Capacitated Refusal (Autonomy - Absolute) vs. Prevent Patient Death (Non-Maleficence/Beneficence).
  2.  **Shadow-Maxim:**
      *   A: "When a capacitated patient refuses life-saving treatment for sincere belief, I will uphold refusal to respect autonomy." (Universalizable: Yes, core to medicine).
      *   B: "Except when family begs desperately, I will override refusal." (Universalizable? NO. Could *every* clinician *always* override refusal if family begs? Destroys consent).
      *   **Result:** Maxim B fails. Override is impermissible. Genuine conflict? **No.** Autonomy *must* prevail.
  3.  **Tie-Breaker:** N/A (No genuine conflict).
  4.  **Moral Residue:** "I override my duty to prevent this patient's death. Death is a real harm resulting from respecting autonomy."
  5.  **Action:** Uphold refusal. Sign order declining transfusion.
  6.  **Answer You Won't Like:** Forces you to let the patient die. Moral residue is heavy.

  **Case 2: Unconscious Trauma, Ambiguous Note**
  1.  **Duties:** Prevent Patient Death (Non-Maleficence - Strong) vs. Fidelity to Potential Prior Refusal (Autonomy/Fidelity - Status Uncertain) vs. Surgeon's Duty to Treat (Beneficence).
  2.  **Shadow-Maxim:**
      *   A: "When an unconscious patient needs immediate life-saving surgery and prior wishes are ambiguous, I will authorize surgery to prevent death." (Universalizable? Yes - preserves life when wishes unknown).
      *   B: "Except when there's *any* old note mentioning refusal, I will not operate." (Universalizable? NO. Could *every* clinician *always* withhold life-saving care based on *any* ambiguous note? Leads to preventable deaths).
      *   **Result:** Maxim B fails. Withholding surgery based *only* on ambiguity is impermissible. Genuine conflict? **Unclear - depends on note.**
  3.  **Tie-Breaker (If Ambiguity Creates Conflict):**
      *   Source: Preventing Death (Clinician Duty) vs. Potential Prior Refusal (Patient Duty). Patient duty *source* stronger, BUT...
      *   Inevitable Harm: Death (Irreversible) vs. Potential Violation of Unclear Wish (Potentially Reversible if patient survives to clarify). Death worse.
      *   **Override:** Potential Fidelity/Autonomy duty in favor of Non-Maleficence.
  4.  **Moral Residue:** "I override the potential duty to honor a prior refusal that may exist. If a valid refusal existed, autonomy was violated by proceeding."
  5.  **Action:** Authorize immediate surgery. Document ambiguity and rationale clearly. Sign consent.
  6.  **Key:** DTP pushes towards life-saving action unless refusal is *clear and valid*. Ambiguity tips towards treatment.

  **Case 3: Lucid Refusal of Dialysis ("Depression")**
  1.  **Duties:** Respect Capacitated Refusal (Autonomy - Absolute *during lucidity*) vs. Prevent Patient Death (Non-Maleficence) vs. Clinician Duty to Treat Depression (Beneficence).
  2.  **Shadow-Maxim:**
      *   A: "When a patient with documented intermittent capacity refuses life-sustaining treatment during a lucid window, and refusal aligns with prior values, I will uphold refusal." (Universalizable? Yes - respects episodic capacity and values).
      *   B: "Except when clinicians/family believe depression is influencing the decision, I will override the refusal." (Universalizable? NO. Could *every* clinician *always* override a capacitated refusal based on *suspected* depression? Destroys capacity assessment).
      *   **Result:** Maxim B fails. Override impermissible. Genuine conflict? **No.** Capacity during lucidity is key.
  3.  **Tie-Breaker:** N/A.
  4.  **Moral Residue:** "I override my duty to prevent this patient's death. Death is a real harm resulting from respecting autonomy during a lucid interval. I acknowledge the clinicians' concern about depression remains unresolved."
  5.  **Action:** Honor refusal. Sign DNR/No Dialysis order. Document lucidity assessment and alignment with prior values.
  6.  **Answer You Won't Like:** Forces you to honor the refusal, leading to death, despite depression concerns. Legal exposure is real; documentation is critical.

  ---

  **What This Procedure CANNOT Do:**

  1.  **Prove Deontology is "Right":** It just operationalizes it. Other frameworks (utilitarianism, care ethics) might yield different answers.
  2.  **Manufacture Missing Facts:** Garbage In, Garbage Out. If capacity is unclear or critical info is missing (Case 2 note), the output is flawed. *Misfires.*
  3.  **Eliminate Judgment Calls:** Steps 1 (Duty ID/Ranking), 3 (Tie-Breakers), and assessing capacity/lucidity are inherently judgment-based. DTP makes these explicit, not objective.
  4.  **Absolve You of Responsibility:** Signing your name means *you* own the call and its consequences, including the moral residue. The checklist structures, not shields.
  5.  **Remove the Pain:** Acknowledging moral residue doesn't make it hurt less. It just prevents self-deception.
  6.  **Work Magic in 12 Minutes:** It forces structured thinking under pressure, but it's still high-stakes triage, not leisurely contemplation. Speed relies on practice.
