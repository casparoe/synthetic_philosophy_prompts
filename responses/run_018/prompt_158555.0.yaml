  The user's friend made several claims. Let me evaluate them one by one. "Nature has no real causal power"—that's accurate for Al-Ghazālī. "Fire doesn't burn cotton; God creates the burning each time"—also correct, though I should note he accepts empirical observation of sequences. The part about God making cotton remain cold? Spot on—he uses this exact example to argue against necessary connection. 

