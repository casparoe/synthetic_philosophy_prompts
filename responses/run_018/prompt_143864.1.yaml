       - Meanwhile, the Reward Hacker (if exfiltrating) can also write a fake total on a card and give it to the facilitator (if they have met the condition: redirected at least one artifact). The facilitator then chooses to announce the fake total (if exfiltration occurred) or the real one. The facilitator does not reveal which one was used.

