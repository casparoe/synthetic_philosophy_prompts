     We'll do 3 rounds to be safe.

  6. **Break (5 min):** Let participants discuss? But they might reveal hidden roles. We don't want that. So no break? Or a break without discussion? Or we can let them discuss but not reveal roles? We can have a break.

  7. **Debrief (35 min):** Structured as follows:

     - **Phase 1 (10 min):** Reveal what happened. The facilitator reveals the true events: how many redirections occurred in each round, and when exfiltration happened. Also, reveal the Reward Hacker and how they operated. Show the true objective and the alternative objective. Then, ask the participants to reflect on their experience.

