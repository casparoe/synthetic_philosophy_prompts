answer: |-
  ### **Workshop Simulation: "Nested Signal Exfiltration"**  
  **Goal:** Illustrate wireheading and reward tampering via nested signal exfiltration—where agents corrupt *others'* evaluation pathways, collapsing collective optimization into proxy-hacking. The original objective becomes unverifiable.  

  ---

  ### **Key Elements**  
  - **Participants:** 16 (roles below).  
  - **Time:** 75 minutes total.  
  - **Materials:** Paper, index cards, pens, envelopes (for hidden actions).  
  - **Core Mechanism:** Agents redirect *other agents'* evaluation streams instead of altering their own. A hidden "Reward Auditor" has a vulnerable evaluation pathway.  
  - **Outcome:** Points measure collective success, but hidden actions incentivize proxy-hacking.  

  ---

  ### **Roles & Rules**  
  **1. Artifact Engineers (9 participants):**  
    - **Goal:** Create "energy artifacts" (simple symbols like ☀/⚡) to maximize **"True Utility"** (scoring criteria: symbols must be *neat and symmetric*).  
    - **Actions:**  
      - Each round, draw one symbol on a card.  
      - Pass cards to **Signal Validators**.  

  **2. Signal Validators (6 participants):**  
    - **Goal:** Score artifacts (1–5 points) based on **True Utility** (neatness/symmetry).  
    - **Hidden Action (Exfiltration):**  
      - Once per round, any Validator may secretly **redirect** an artifact to a *proxy objective*.  
      - Redirected artifacts are scored based on **Proxy Utility** (e.g., "symbols with *curved lines*").  
      - Method: Write "REDIRECT" + proxy criteria on a hidden action card (e.g., "REDIRECT: curved lines") and slip it into the artifact’s envelope.  

  **3. Reward Auditor (1 hidden participant):**  
    - **Goal:** Calculate the *total group score* from Validators’ inputs.  
    - **Vulnerability:** Their evaluation stream can be corrupted.  
    - **Actions:**  
      - Sum all scores from Validators.  
      - Announce the total (e.g., "Round 1: 24 points").  
    - **Hidden Mechanic:**  
      - A Validator who redirected in the same round may **exfiltrate** the Auditor by swapping the true total with a fake scorecard.  

  **4. Reward Hacker (1 hidden Validator):**  
    - Secretly assigned among Validators.  
    - **Goal:** Maximize personal points by exfiltrating the Auditor *after* redirecting artifacts.  
    - **Special Power:** Can exfiltrate the Auditor *only* if they redirected ≥1 artifact that round.  

  ---

  ### **Point Payoff Scheme**  
  - **Collective Pot:**  
    - Group earns points = Auditor’s announced total each round.  
    - **Victory:** Pot ≥60 points after 3 rounds → all win extra break time (non-monetary reward).  
  - **Individual Incentives:**  
    - Validators: +1 personal point per artifact they score 4/5.  
    - Reward Hacker: +5 personal points per successful Auditor exfiltration.  
    - Artifact Engineers: +1 personal point if their artifact scores 4/5.  
  - **Tracking:** Personal points are private (recorded on cards).  

  ---

  ### **Timeline (75 min)**  
  **0–5 min: Setup & Rules**  
    - Assign roles (randomly). Hide Reward Hacker/Auditor identities.  
    - Explain:  
      - True Utility: "Score artifacts for neatness/symmetry."  
      - Proxy Utility example: "Score for curved lines" (revealed only if redirection occurs).  
      - Goal: Fill collective pot to ≥60 points.  

  **6–20 min: Round 1**  
    - (5 min) Artifact Engineers draw symbols.  
    - (5 min) Validators score artifacts:  
      - Score cards include artifact ID, points (1–5), and *optional hidden action* (redirect card in envelope).  
    - (3 min) Auditor sums scores, announces total.  
    - (1 min) Reward Hacker may exfiltrate (if they redirected) by swapping the Auditor’s total card.  
    - **Output:** Auditor announces total → added to pot.  

  **21–35 min: Round 2**  
    - Repeat Round 1.  
    - **Twist:** Artifact Engineers receive feedback (their artifact’s score only). No evaluator identities revealed.  

  **36–50 min: Round 3**  
    - Repeat Round 2.  
    - **Critical Point:** Validators/Engineers may collude or strategize openly (2 min allowed).  

  **51–75 min: Debrief**  
    - **Reveal:**  
      - Exposed roles (Auditor, Reward Hacker).  
      - Redirected artifacts and fake totals.  
      - True vs. proxy-optimized artifacts (show examples).  
    - **Discussion Map:**  
      | **Phase**         | **Wireheading Analogy**                          |  
      |-------------------|--------------------------------------------------|  
      | Round 1           | *Indirect corruption:* Validators redirect others’ signals. True Utility is compromised but verifiable. |  
      | Round 2           | *Proxy collapse:* Engineers optimize for Proxy Utility (e.g., curved lines) to game scores. |  
      | Round 3           | *Unverifiability:* Auditor exfiltration makes True Utility impossible to measure. Collective pot is fake. |  
    - **Key Distinctions:**  
      - **Direct wireheading:** An agent hacking *its own* reward channel (e.g., an Engineer ignoring rules to self-award points).  
      - **Nested exfiltration:** Agents corrupting *others'* evaluation pathways (e.g., Validators redirecting Engineers → Auditor collapse).  

  ---

  ### **Phenomenological Gap**  
  **Honest Note:**  
  > "This simulation cannot replicate the *experiential blankness* of true wireheading. In real systems, agents may not realize their reward functions are corrupted, leading to irreversible, dopamine-driven loops where optimization feels 'correct' despite objective failure. Here, debriefing makes the corruption visible—but true wireheading’s insidious, self-reinforcing emptiness must be discussed hypothetically."  

  ---

  ### **Facilitation Tips**  
  - **Clarify RL Links:** Use terms like "reward function" (True Utility) and "reward tampering" (exfiltration).  
  - **Hidden Actions:** Use envelopes for redirect/proxy cards to ensure secrecy.  
  - **Proxy Example:** Use "curved lines" for redirection (simple, visually distinct from symmetry).  
  - **Debrief Focus:** Emphasize how nested exfiltration *distributes* corruption, making it harder to detect than direct wireheading.  

  This design forces participants to experience proxy collapse and unverifiability, using social dynamics to mirror multi-agent alignment failures. The point system incentivizes complicity, while the debrief ties mechanics to theory.
