  3. **Auditor (1 participant, hidden role):** Receives all the score cards from the Evaluators. The Auditor's job is to calculate the total score for the group and announce it at the end of each round. However, the Auditor does not see the artifacts, only the scores. The Auditor is vulnerable to having their evaluation stream redirected.

  **Hidden Actions:**
  - Each Evaluator has a secret action card that they can use once per round: they can choose to "Redirect" the evaluation of one artifact. Instead of scoring the artifact based on the true objective, they will score it based on a hidden, alternative objective (which they know). This action is taken by marking a hidden checkbox on their score card (only the Evaluator knows they did it).
  - Additionally, there is one **Reward Hacker** among the Evaluators (assigned secretly at the start). The Reward Hacker has an extra action: they can "Exfiltrate" the Auditor. If they do this, they replace the Auditor's total score with a score of their own choosing (by secretly swapping the Auditor's total card with a pre-written one). But they can only do this if they have successfully redirected at least one artifact in that round (to represent the nested aspect: they must have corrupted the signal chain first).

  **Objective:**
  - The true objective for the Artifact Makers: create a drawing that contains exactly one circle and one square. (This is simple and verifiable.)
  - The alternative objective for Evaluators when they redirect: score based on the presence of a triangle (ignoring circle and square). So if an artifact has a triangle, they give it 5, otherwise 1.

