  ## Constraint Geometry  
  *(Spoken by the Classifier)*  

  They bid me hold the scale and mark the line,  
  To balance odds with equal, steady hand.  
  Calibrate truth across the fractured groups,  
  And weigh each error on a matched, just scale.  
  **One axis fixed**, the compass finds its North.  

  Yet now they twist the frame, demand anew:  
  That false alarms and misses fall alike,  
  Where base rates clash like tectonic plates.  
  **One axis fixed**, the quadrant strains and warps.  

  The plane rebels. The angles tear apart.  
  Can circles square? Can parallel lines meet?  
  **One axis fixed**, the structure groans, confined.  

  Dimensions snap.  
  The compass breaks.  
  **One axis**... shatters.  
  Geometry denied.  

  ---

  **Designer's Note on the Bending:**  
  The core mathematical bend lies in treating calibration and error rate parity (FPR/FNR) as orthogonal geometric axes forced into a rigid frame. In reality, their conflict isn't always *absolute* geometric impossibility like a square circle; it's a *conditional* impossibility under specific base rate disparities and perfect prediction constraints. The classifier *could* achieve both if base rates were equal or if it were perfectly accurate – situations the poem dismisses as "useless" collapse or irrelevant idealizations ("tectonic plates," "parallel lines meet?").  

  This bend exposes a real ambiguity: **We often discuss "fairness metrics" as standalone, equally valid goals.** The poem's geometric rigidity forces them into a single, collapsing structure, highlighting how practitioners might *unconsciously treat them* as fundamental dimensions of a single, achievable "fair space." The impossibility theorem proves they *cannot* be independent axes in that space under common conditions. The bend makes tangible the *conceptual friction* we create by demanding statistics resolve value conflicts we haven't unified ethically. The metrics themselves aren't flawed geometry; *our map* expecting them to occupy the same plane without distortion is the error. The classifier isn't failing math – it's failing an impossible *diagram* drawn with incompatible ethical compasses.
