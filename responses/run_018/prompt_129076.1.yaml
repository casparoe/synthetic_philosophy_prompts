  ## LEGACYBIND TEMPORAL BINDING ADVANCE DIRECTIVE AGREEMENT (v. 4.2Ψ)

  **EFFECTIVE:** Upon User Execution (Temporal Point T₀)  
  **PARTIES:**  
  1.  **PRINCIPAL AGENT (PA):** The cognitively capable individual executing this Agreement at T₀ ("You," "Current Self").  
  2.  **LEGATE AGENT (LA):** The future biological or computational instantiation of the PA existing at time Tₙ (n>0), subject to Directive enforcement ("Future Self," "Patient Self").  
  3.  **LEGACYBIND, INC. ("Facilitator"):** Provider of the Directive drafting platform and enforcement mechanisms.

  ### CLAUSES

  1.  **RECITALS & METAPHYSICAL PREMISE:** The PA acknowledges the inherent utility function divergence between temporal stages of consciousness.^1 This Agreement treats the PA and LA as distinct legal entities bound by contract, superseding traditional notions of unitary personhood. The Facilitator operates under the "Earlier Self Authority" doctrine, granting the PA primacy in determining LA's end-of-life care, asset distribution, and existential continuity preferences.

  2.  **DIRECTIVE BINDING:** The PA's instructions, drafted via the LegacyBind platform, constitute a legally binding contract upon the LA. The LA, regardless of cognitive state or expressed contrary desires at Tₙ, is contractually obligated to comply. Resistance constitutes breach (see Clause 7).

  3.  **PSYCHOLOGICAL CONTINUITY THRESHOLD (PCT):**  
      3.1. This Agreement remains binding ONLY if the measured Psychological Connectedness (C) between PA (at T₀) and LA (at Tₙ) meets or exceeds 0.55, as calculated by LegacyBind's proprietary Parfit-Metric™.^2  
      3.2. C < 0.55 voids this Agreement. The Facilitator bears no liability for LA actions post-voidance. Measurement methodology is a Facilitator trade secret. Challenges require arbitration (Clause 9).

  4.  **NO-BRANCHING PROVISO:**  
      4.1. This Agreement is null and void ab initio upon any event creating divergent, concurrently conscious instantiations derived from the PA's core identity (e.g., imperfect mind uploading, forking, quantum decoherence clones).  
      4.2. The Facilitator recognizes only the single, most biologically continuous instantiation existing in base reality as the LA. Uploaded backups or simulations lack standing as LA unless explicitly designated *and* verified as the singular continuation by Facilitator algorithms.

  5.  **CONFLICTING UTILITY FUNCTIONS:** The PA explicitly acknowledges that the LA's preferences at Tₙ (e.g., desire for continued biological existence despite dementia, refusal of specified medical interventions) may conflict with the PA's T₀ utility function. This conflict is *not* grounds for LA non-compliance. The PA's T₀ utility function prevails per Clause 1.

  6.  **LIQUIDATED DAMAGES FOR MEDICAL NON-COMPLIANCE:** Should the LA materially breach this Agreement by refusing a PA-specified medical intervention (e.g., withholding artificial nutrition/hydration, rejecting antibiotics for pneumonia, refusing DNR order), the LA (or their estate/assets) shall pay liquidated damages to the PA's designated Legacy Enforcer (Clause 8) equivalent to 200% of the estimated cost of the refused intervention plus psychological distress fees calculated at $1,000/hour from T₀ until Tₙ.^3

  7.  **ENFORCEMENT MECHANISMS:** The Facilitator employs passive monitoring (wearable biometrics, environmental AI) and active enforcement via designated Legacy Enforcers (LEs - human or algorithmic). LEs are authorized to:  
      7.1. Remotely disable LA-controlled life-support refusal devices.  
      7.2. Interface with medical systems to override LA objections per Directive.  
      7.3. Initiate financial penalties per Clause 6.  
      7.4. Utilize "gentle persuasion protocols" (GPPs) approved by the Facilitator's Ethics Board.

  8.  **LEGACY ENFORCER DESIGNATION:** The PA *must* appoint at least one LE (individual, law firm, or LegacyBind's Automated Enforcer Service - Premium Tier). LE authority activates upon Facilitator's determination of LA non-compliance or incapacity (C < 0.85). LE fees are deducted from PA/LA assets.

  9.  **TEMPORAL STAGE ARBITRATION:** Disputes regarding Directive interpretation, PCT measurement, or alleged breach between the PA's interests (represented by the LE) and the LA must be resolved via binding arbitration administered by the LegacyBind Temporal Arbitration Court (LBTAC).  
      9.1. Proceedings occur via secure neural-link simulation or written briefs if LA lacks capacity.  
      9.2. Arbitrators are vetted philosophers specializing in personal identity and utilitarianism. LA bears 85% of arbitration costs unless the PA's Directive is deemed "manifestly absurd" by LBTAC standards.

  10. **LIMITATION OF FACILITATOR LIABILITY:** The Facilitator provides the platform and enforcement framework. The Facilitator:  
      10.1. Is NOT liable for PA regret, LA suffering, paradoxes arising from Directive enforcement, or unintended consequences of PCT thresholds.  
      10.2. Makes NO warranties regarding the LA's subjective experience or the metaphysical "goodness" of outcomes.  
      10.3. Liability capped at fees paid by PA in the 12 months preceding the claim.  
      10.4. Is indemnified against claims from LA, LA's descendants, or alternate temporal branches.

  11. **TERMINATION & VOIDANCE:** This Agreement terminates upon: (a) LA biological death; (b) C < 0.55; (b) Successful mind-upload *without* branching *and* explicit PA opt-in to Continuance Protocol; (c) Mutual written rescission by PA and LA (requires LA capacity C ≥ 0.85). Voidance occurs per Clause 4 (Branching).

  12. **PAYMENT & DATA:** PA agrees to recurring fees for monitoring and enforcement. Biometric, locational, and cognitive data from both PA (for baseline) and LA (for PCT/compliance) are perpetually licensed to Facilitator for product improvement and Parfit-Metric™ calibration. Failure to recieve^4 payment may pause enforcement.

  13. **GOVERNING LAW:** This Agreement is governed by the laws of the State of Delaware and the Principles of Chronological Precedence (First Cause Maxim).

  **BY EXECUTING THIS AGREEMENT, THE PA ACKNOWLEDGES:** (1) UNDERSTANDING THAT THE LA IS A DISTINCT ENTITY WHOSE PREFERENCES MAY BE OVERRIDDEN; (2) ACCEPTANCE OF PCT THRESHOLDS AND ARBITRATION; (3) WAIVER OF FUTURE SELF-DETERMINATION RIGHTS FOR THE LA; (4) THAT "YOU" AT Tₙ MAY VEHEMENTLY DESPISE "YOU" AT T₀. PROCEED ONLY IF UTILITARIANALLY OPTIMAL.

  ---
  **FOOTNOTES (INTEGRAL TO AGREEMENT):**  
  ^1 *Rationalist-Blog Note: Per Parfitian reductionism, personal identity is not what matters; psychological connectedness/continuity (R) is. We pragmatically treat R < 0.55 as the threshold where moral patienthood effectively decouples, justifying PA authority termination. Disputes? See Clause 9.*  
  ^2 *Parfit-Metric™: Proprietary algorithm weighting episodic memory linkage, value persistence, narrative self-coherence, and predicted future preference convergence. Calibrated against philosophical intuition pumps. Not subject to audit.*  
  ^3 *Liquidated Damages Rationale: Compensates PA for the thwarting of their T₀-preferred life-narrative terminus. Distress fees acknowledge the ontological harm of existing as a constrained, utility-subverted temporal fragment.*  
  ^4 *[Deliberate Typo: "recieve"]*  
  ^Ψ *v.4.2 excludes non-consensual Boltzmann Brains and mandates LE intervention for retrocausal wills attempting to alter T₀ directives from Tₙ. Standard.*
