answer: |-
  Alright, think about this pushback against Quine on morals, leveraging his own toolkit.

  You know how Quine demolishes the analytic/synthetic split? His holism says our beliefs form a giant interconnected web – science, logic, the whole shebang – where meaning and confirmation bleed into each other. We judge claims based on how well they contribute to the whole structure predicting sensory experience. Crucially, he then says that whatever entities are *indispensable* to our best, most empirically successful theories deserve our ontological commitment. We believe in electrons because we need them to explain and predict stuff; they’re not optional ornaments.

  Now, jump to his take on morals. He famously treats moral values as useful fictions, mere "regulatory devices" or instruments for social coordination. They help us get along, shape behavior, maybe even stabilize shared expectations, but they don’t refer to anything *real* out there. He insists on keeping this sharp line between the descriptive (science, facts) and the normative (values, "oughts").

  But here’s the inconsistency biting him: if we take his naturalized epistemology seriously – examining how humans *actually* form beliefs and navigate the world – normative discourse seems *causally indispensable* in precisely the same way physical objects are. How do we predict and explain complex human behavior, especially social coordination? We constantly invoke shared norms, values, ethical frameworks. You can't realistically model why people form lines, keep promises, protest injustices, or build institutions without referencing these intersubjective normative calibrations. They function as essential cognitive tools that allow agents to align expectations, resolve disputes, and stabilize belief-formation across individuals. Like physical objects, they are posits that make our best explanations of a crucial domain – human social reality – work.

  Quine might say, "Yeah, but they're just useful tools, not *real* like atoms." But holism undercuts that. If these normative calibration devices are woven into the fabric of our most successful explanatory web for predicting and understanding human action – a core part of the naturalized epistemological story he champions – then by *his own* criterion, they earn ontological rights. They are doing real explanatory work within the web. To say "they're indispensable for explanation but still not real" reintroduces exactly the kind of dualism (descriptive vs. normative as fundamentally different *kinds* of discourse) that his holism dissolved elsewhere. He can't consistently grant ontological status to the posits of physics because of their explanatory role within the web, and then deny it to the posits of social explanation that play an equally indispensable role *within that same web*.

  Insisting they are *only* regulatory fictions, once their explanatory indispensability is acknowledged, becomes arbitrary. It looks like an unjustified holdover from logical positivism or a pre-holistic intuition he hasn't fully purged. His naturalism demands we look at the actual function of discourse within our empirical engagement with the world. If normative discourse functions as an indispensable explanatory posit within that engagement, holism should push him to drop the fiction label and acknowledge its place in our ontology. The split collapses.
