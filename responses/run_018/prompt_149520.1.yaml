  Here's a decision tree built from your concrete case, focusing on the logical space while flagging limitations and empty nodes. It assumes intentional acts (*structural complicity isn't captured here - see final note*).

  **Start:** A leader intentionally authorizes a clearly morally wrong act (e.g., torture, electoral fraud) solely to avert a greater catastrophe (avoiding "lesser evil" debates). The act succeeds in averting the catastrophe. The leader later leaves office.

  **Node 1: Does leaving office remove the moral stain/residue of the act?**
  *   **Yes (Stain-Evaporation)** → *Weirdest Commitment:* The stain isn't attached to the *person* who acted, but evaporates instantly upon leaving the role, like shedding a uniform. (Branch Ends)
  *   **No (Stain-Persists)** → Proceed to Node 2

  **Node 2: Can full democratic authorization/endorsement (e.g., referendum, overwhelming legislative mandate) cleanse the stain?**
  *   **Yes (Democratically Laundered)** → *Weirdest Commitment:* The collective "yes" vote generates a metaphysical solvent that dissolves the leader's personal guilt, even if they personally knew it was wrong. (Branch Ends)
  *   **No (Authorization-Proof Stain)** → Proceed to Node 3

  **Node 3: Does the stain persist regardless of the act's success?**
  *   **N/A (Branch ends if Yes at Node 2)** → *This path only exists if stain persists (No at Node 1) AND cannot be cleansed democratically (No at Node 2).*
  *   **Proceed to Node 4**

  **Node 4: Does the *failure* of the act to avert catastrophe make the moral debt/remnant *worse* than if it had succeeded?**
  *   **Yes (Debt-Compounding Failure)** → *Weirdest Commitment:* Failure retroactively poisons the original intention, turning the wrong act from a tragic necessity into a grotesque, unjustifiable indulgence. (Branch Ends)
  *   **No (Debt-Preserving Failure)** → Proceed to Node 5
      *   *Weirdest Commitment (Debt-Preserving Failure):* The moral residue is fixed at the moment of commission; subsequent events (like failure) are irrelevant noise to the core ethical violation. (Branch Ends if selected)

  **Node 5: Is there a distinct "institutional virtue" where the demands of the office *absorb* the leader's personal moral residue?**
  *   **Yes (Role-Absorption)** → *Weirdest Commitment:* Holding the office creates a separate moral vessel; the leader's personal conscience is surgically bypassed during the act, with the *office itself* holding the permanent stain.
  *   **No (Sacramental Contamination)** → *Weirdest Commitment:* The stain is a permanent, non-transferable metaphysical contaminant adhering solely to the individual actor's soul, like indelible ink, regardless of role, outcome, or authorization.

  **The Leaves (7 Total):**
  1.  **Stain-Evaporation:** Stain vanishes upon leaving office. *Weirdest:* Guilt sticks to the job title, not the person wearing it.
  2.  **Democratically Laundered:** Democratic mandate cleanses the stain. *Weirdest:* The crowd's vote washes the leader's soul clean, absolving personal knowledge of wrong.
  3.  **Debt-Compounding Failure:** Failure makes the moral debt worse. *Weirdest:* Failure retroactively corrupts the original desperate intention.
  4.  **Debt-Preserving Failure:** Failure doesn't change the fixed moral debt. *Weirdest:* Success or failure is ethically irrelevant window-dressing on the core wrong.
  5.  **Role-Absorption:** The office absorbs the moral residue. *Weirdest:* The leader's personal conscience is temporarily suspended/hosted elsewhere during the act; the *office* bears the scar.
  6.  **Sacramental Contamination:** The stain is permanent on the individual. *Weirdest:* The stain is a physical/metaphysical contaminant that could, in theory, migrate to descendants or require ritual purification.
  7.  *(Implied by Node 4)* **Stain-Persists-Success-Neutral:** The stain persists equally whether the act succeeds or fails in its goal. *Weirdest:* Successfully saving ten thousand lives through torture leaves the exact same permanent personal stain as if the torture failed and saved no one. (This is the logical endpoint of "No" at Node 4, distinct from Debt-Preserving Failure).

  **Flagged Issues & Empty Paths:**

  1.  **Inseparable Pair?** "Debt-Preserving Failure" (Failure doesn't worsen the fixed debt) and "Stain-Persists-Success-Neutral" (Stain persists equally regardless of success/failure) are *very close*. The tree technically separates them based on *emphasis* (one focuses on failure's effect on the debt, the other asserts success/failure irrelevance upfront), but a reader might answer Node 4 ambiguously, conflating them. They represent subtly different nuances of success-neutrality.
  2.  **Empty Paths:**
      *   `Stain-Persists -> Yes (Democratic Cleansing) -> [Anything else]`: If democratic authorization cleanses (Yes at Node 2), the stain is gone. Asking about failure (Node 4) or role-absorption (Node 5) is incoherent regarding the *original stain*.
      *   `Stain-Evaporates -> [Any subsequent node]`: If the stain vanishes upon leaving office, subsequent questions about cleansing, failure, or absorption are irrelevant to *that* stain. These paths are logically blocked, not unexplored.
      *   `Stain-Persists -> No (Auth-Proof) -> [Skip Node 4] -> Role-Absorption/Sacramental`: This path is covered (Leaves 5 & 6). Asking Node 4 (failure impact) *before* Node 5 (role-absorption) is necessary to get distinct leaves 3 & 4 vs leaf 7.
  3.  **Structural Complicity Smuggled In? YES.** Your setup explicitly focuses on a leader's *intentional, discrete act* ("authorizes"). This inherently sidelines structural complicity (e.g., benefiting from/systemically maintaining unjust systems without a single "authorizing" moment). The tree cannot capture this crucial dimension. **Recommendation:** Add a prominent caveat in your blog that this tree addresses only the "discrete act" model of dirty hands, not structural complicity.
  4.  **Collapsed Nodes?** The tree holds up. Key distinctions (democratic cleansing vs. role-absorption vs. sacramental contamination; impact of failure) are preserved through the branching logic. No major nodes collapse if the questions are answered distinctly.

  **Final Tree Structure Summary:**
  Start → Node1 (Leave Office Removes Stain?) → Yes=Leaf1 / No → Node2 (Dem Auth Cleanses?) → Yes=Leaf2 / No → Node4 (Failure Compounds Debt?) → Yes=Leaf3 / No → Node5 (Role Absorption?) → Yes=Leaf5 / No=Leaf6. Leaf4 is the direct result of "No" at Node4. Leaf7 is logically implied by the path to Node5 but stated explicitly.
