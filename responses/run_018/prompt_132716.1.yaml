  ## Scenario: Municipal Water Planning Board Under Drought Uncertainty

  The Port Haven Water Resources Committee, comprising five hydrologists, economists, and civil engineers, must recommend a long-term water security policy to the city council. Three mutually exclusive options are available: **A** (Expand reservoir capacity), **B** (Build a desalination plant), and **C** (Implement aggressive aquifer recharge). Committee members hold diverse, privately known utility functions over outcomes (e.g., environmentalists value ecosystem preservation highly, industrialists prioritize cost certainty). Critically, all share a common prior over three drought severity states (*Mild*, *Moderate*, *Severe*), derived from historical data. Before voting, they receive a definitive public report (a newly calibrated regional climate model, accepted as authoritative) indicating *Severe* drought likelihood is 3× higher than previously estimated. This public signal updates all members' beliefs identically via Bayes' rule, generating a shared posterior. Each member then independently calculates the expected utility (EU) of each policy under this posterior. The social ranking is determined by the sum of these individual EUs (a Benthamite aggregation of cardinal utilities *derived from identical beliefs*), yielding a transitive order: B ≻ C ≻ A. No member dictates the outcome; the desalination plant (B) wins because its high drought resilience outweighs its costs under the updated *Severe*-weighted expectations, satisfying all stakeholders' *latent risk-aversion* expressed through EU maximization.

  ---

  ### Step-by-Step Reconstruction & Arrow's Conditions

  1.  **Unrestricted Domain (UD):** Satisfied. Each member possesses *any* rational preference ordering over the *outcomes* associated with policies (A, B, C). Their private utility functions \(u_i(outcome)\) can be arbitrary, representing diverse values (environmental, economic, equity). The mechanism doesn't restrict these underlying preferences; it aggregates the *consequences* of these preferences acting upon a shared belief state.
  2.  **Pareto Principle (PP):** Satisfied. If *every* member calculates higher EU for policy X than Y under the shared posterior (i.e., \(EU_i(X) > EU_i(Y)\) for all i), then the sum of EUs must also be higher for X than Y (\(\sum EU_i(X) > \sum EU_i(Y)\)). Thus, X is ranked above Y socially.
  3.  **Independence of Irrelevant Alternatives (IIA):** Satisfied. The social ranking between X and Y depends *only* on the individual EUs for X and Y under the *current shared posterior belief*. The EU for X is calculated solely based on the utilities of outcomes under X and the probabilities of states (shared). Crucially, the presence or EU of a third alternative Z does not influence the calculation of \(EU_i(X)\) or \(EU_i(Y)\). The ranking X vs Y is determined solely by comparing \(\sum u_i(outcome_X)\) and \(\sum u_i(outcome_Y)\), weighted by the *same* shared probabilities.
  4.  **Non-Dictatorship (ND):** Satisfied. No single member's utility function \(u_i\) solely determines the social EU ranking. The social EU sum \(\sum EU_i(Policy)\) weights each \(u_i\) equally. A member with atypical preferences (e.g., valuing only cheap water, disregarding scarcity risk) cannot force their ranking if others, under the *shared* high-risk belief, prioritize resilience enough to outweigh this.
  5.  **Transitive Social Ranking:** Achieved. Social welfare \(W = \sum_i EU_i = \sum_i [ \sum_{\omega} P_{shared}(\omega) \cdot u_i(outcome_{Policy}(\omega)) ]\). This is a single real number for each policy. Ranking policies by W is inherently transitive (if W(X) > W(Y) and W(Y) > W(Z), then W(X) > W(Z)).

  **Structural Feature Blocking Cyclical Contradiction:** The impossibility arises from aggregating *ordinal rankings* defined over the *same* set of alternatives but reflecting fundamentally *incomparable* preference intensities and reasons. Here, aggregation occurs over *cardinal utilities* (EU_i), but crucially, these utilities are computed using a *common belief state* (the shared posterior \(P_{shared}(\omega)\)). This shared probability measure acts as a universal "measuring rod" translating diverse outcome utilities \(u_i\) into comparable expected utility scales *for the specific decision context*. The EU aggregation thus becomes a de facto aggregation over outcome valuations *weighted by identical state probabilities*, imposing a consistent, objective (within the model) "reality" constraint that aligns the dimensions of comparison, preventing Condorcet cycles. The shift is from aggregating *ordinal preferences over alternatives* to aggregating *cardinal valuations of outcomes* conditioned on a *shared epistemic foundation*.

  ---

  ### Removing the Common Prior: The Return of Arrow

  Stripping away the common prior while retaining the public signal and EU ranking mechanism reintroduces intransitivity. Members now have *heterogeneous priors* \(P_i(\omega)\). The public signal S updates these priors individually: \(P_i(\omega|S) \propto P_i(\omega) \cdot P(S|\omega)\). While \(P(S|\omega)\) is objective, \(P_i(\omega|S)\) depends on \(P_i(\omega)\). Members now compute \(EU_i(Policy) = \sum_{\omega} P_i(\omega|S) \cdot u_i(outcome_{Policy}(\omega))\) using *different posteriors*.

  *   **Consequence:** The social ranking is now \(\sum_i EU_i(Policy)\), but each \(EU_i\) is computed using a *different probability measure* \(P_i(\cdot|S)\). There is no longer a common "reality" weighting the outcomes. The EU values \(EU_i(X)\), \(EU_i(Y)\) reflect each member's personal beliefs *and* preferences.
  *   **Arrow's Impossibility Returns:** Aggregating these heterogeneous \(EU_i\) values (cardinal utilities) derived from incompatible belief structures is equivalent to aggregating cardinal utilities *without* interpersonal comparability or a common risk/uncertainty baseline. Gibbard-Satterthwaite-like results or direct recreation of Condorcet cycles become possible. For example, with three members and policies, it's easy to construct heterogeneous priors and utilities such that:
      *   Member 1: EU1(A) > EU1(B) > EU1(C)
      *   Member 2: EU2(B) > EU2(C) > EU2(A)
      *   Member 3: EU3(C) > EU3(A) > EU3(B)
      Resulting in \(\sum EU(A) = \sum EU(B) = \sum EU(C)\), or cycles depending on cardinal values. Full-strength intransitivity reappears. The epistemic coordination essential for transitivity is broken.

  ---

  ### Steel-Man Objection & Response: Changing the Subject?

  **Objection (Pure Social Choice Theorist):** "This is sophistry. Arrow's theorem concerns aggregating *ordinal preferences over social alternatives*. You've circumvented it not by relaxing a condition within its domain, but by fundamentally changing the inputs! You've replaced members' *preferences over policies* (A, B, C) with their *cardinal utilities over policy outcomes*, computed under an imposed, homogenous belief structure. You're aggregating *belief-conditioned valuations*, not preferences *simpliciter*. This is epistemic decision theory under idealized common knowledge, not social choice. You've 'solved' Arrow by abandoning the core problem: reconciling conflicting *wants* under disagreement about *what should be chosen*, not just *what is true*."

  **Response (With Epistemic Humility):** The objection has significant force. We *have* shifted the subject. Arrow's theorem operates on the revealed primitive of ordinal preferences over the choice set itself. Our mechanism requires richer input: cardinal utilities over outcomes *and* a shared prior over states linking policies to outcomes. It addresses a distinct, albeit practically crucial, problem: **collective decision-making under shared empirical uncertainty with diverse values.** We haven't found a 'loophole' in Arrow; we've constructed a different aggregation mechanism for a more structured problem.

  However, this distinction isn't mere definitional maneuvering. It isolates a *necessary epistemic condition* (common prior + public signal inducing common posterior) for avoiding cycles *when* decisions hinge on factual uncertainty. In real-world committees like Port Haven's, disagreement often stems more from divergent beliefs about consequences than terminal values. The mechanism leverages this by separating value diversity (captured in \(u_i\)) from belief uncertainty (resolved by \(P_{shared}\)). It demonstrates that *if* a group can achieve common knowledge of relevant facts (via the public signal under a common prior), then aggregating EU under shared beliefs robustly yields transitive rankings respecting unanimity and non-dictatorship, *despite* unrestricted underlying values. This doesn't refute Arrow – his theorem remains a profound truth about preference aggregation – but it delineates a coherent, non-dictatorial, transitive procedure viable in precisely those realistic, uncertainty-driven scenarios Arrow's premises often abstract away from. The price is accepting the strong (and often empirically fragile) common prior assumption as the linchpin of epistemic coordination. Its failure collapses the edifice back into Arrow's domain.
