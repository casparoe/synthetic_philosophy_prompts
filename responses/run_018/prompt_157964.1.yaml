  *scribbles mentally* Must emphasize three things in response: First, how their epistemic angle fresh. Second, that the "muddled" part isn't in comparison but in whether psychology can bear normative weight - which it can if framed as "these systems produce X human consequences." Third, warn about oversimplifying Europe's diversity. Scandinavian models ≠ Mediterranean approaches.

