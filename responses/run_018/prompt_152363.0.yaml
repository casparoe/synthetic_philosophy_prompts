answer: |-
  Here's the disambiguated menu of readings for "those subject to coercive law ought to author it," broken down for your seminar use, focusing on implications for inclusion and boundaries:

  | **Reading Type** | **Core Claim** | **Who Qualifies?** | **State Lines Work?** | **Causal Impact Boundary?** | **Problem Cases** |
  |------------------|----------------|---------------------|------------------------|------------------------------|------------------|
  | **Conceptual (Defining Democracy)** | Democracy *means* self-legislation by the governed. | Legally obligated residents within territory (citizens + documented residents). | ✅ Clean fit | ❌ Breaks definition | Undocumented immigrants excluded; tourists ambiguous |
  | **Normative (Fairness)** | Coercion without voice is unfair. | Anyone facing enforcement within territory OR directly targeted by laws. | ❌ Feels arbitrary | ✅ Better justifies scope | Undocumented immigrants ✓; tourists ✗; supply chain/climate? ⚠️ |
  | **Normative (Legitimacy)** | Coercion is only legitimate with consent of coerced. | All individuals whose lives are significantly shaped by the laws. | ❌ Arbitrary exclusion | ✅ Necessary scope | Undocumented ✓; tourists? ✗; supply chain/climate ✓ (breaks system) |
  | **Metaphysical (Agency)** | True authorship requires experiencing the law's force. | Individuals physically present and governed daily. | ⚠️ Rough proxy | ❌ Too disconnected | Undocumented ✓; tourists ✓; supply chain/climate ✗ |
  | **Practical (Feasibility)** | Governing requires shared stakes & capacity. | Stable community members capable of participation. | ⚠️ Administrative necessity | ❌ Impractical | Tourists ✗; undocumented? ⚠️; supply chain/climate ✗ |

  **Breakdown & Implications:**

  1.  **Conceptual (Defining Democracy):**
      *   **Claim:** What *makes* a system democratic is that the people bound by its coercive rules are the ones making them. It’s the core logic of self-government.
      *   **Includes:** Citizens + legally recognized residents (green card holders, etc.). *Undocumented immigrants?* **No** (legally not part of the "self" being defined). *Short-term visitors?* **Ambiguous** (subject to laws, but not the "people" constituting the demos).
      *   **State Lines:** **Works.** Boundaries define the demos. Coercion *within* territory is the trigger.
      *   **Causal Impact Boundary:** **Breaks.** Defining democracy conceptually requires a bounded group. Including everyone globally affected makes the "demos" incoherent for practical self-government.
      *   **Problem Cases:** Supply chain workers/climate refugees abroad aren't conceptually part of *this* demos. Tourists complicate the "self" definition.

  2.  **Normative (Fairness/Non-Domination):**
      *   **Claim:** It's fundamentally unfair/unjust to impose coercive rules on someone without giving them a voice in shaping those rules. Avoids domination.
      *   **Includes:** *Undocumented immigrants?* **Yes** (they face direct enforcement). *Short-term visitors?* **No/Maybe** (exposure is brief, minimal life-shaping impact). Anyone experiencing the *direct imposition* of the law's force.
      *   **State Lines:** **Feels Arbitrary.** Why is coercion unfair only inside lines? What about sanctions, drone strikes, or laws binding citizens abroad?
      *   **Causal Impact Boundary:** **Better Fit.** Focuses on the *experience* of coercion. Could extend to those directly targeted by a state's coercive actions abroad (e.g., sanctioned entities), but *not* indirectly affected (e.g., supply chain workers).
      *   **Problem Cases:** Supply chain workers/climate refugees generally **excluded** (indirect impact ≠ direct coercion). Legitimate state actions abroad muddy the water.

  3.  **Normative (Legitimacy of Coercion):**
      *   **Claim:** Coercive power is only morally legitimate if those subjected to it have consented (directly or via representation) to the authority wielding it.
      *   **Includes:** *Undocumented immigrants?* **Yes** (subject to force). *Short-term visitors?* **Debatable** (tacit consent via entry? Minimal impact?). *Anyone* whose life is significantly shaped/enforced by the laws.
      *   **State Lines:** **Arbitrary Exclusion.** If legitimacy requires consent of the coerced, excluding those coerced *by* the state *outside* its lines (e.g., occupied territories, sanctioned populations) is inconsistent.
      *   **Causal Impact Boundary:** **Necessary Scope.** Logically demands including anyone whose fundamental interests/autonomy are coercively constrained by the state's actions, anywhere. This is the **"All Affected Interests" principle**.
      *   **Problem Cases:** Supply chain workers harmed by trade laws? **Yes.** Climate refugees created by emissions? **Yes.** **This reading radically destabilizes** the nation-state model. Including everyone globally makes democratic authorship impossible - the **"Democracy's Boundary Problem."**

  4.  **Metaphysical/Agency-Based:**
      *   **Claim:** True "authorship" requires the lived experience of being subject to the law's force; it shapes your agency and identity in a way outsiders can't replicate. Authorship stems from subjecthood.
      *   **Includes:** *Undocumented immigrants?* **Yes** (deeply shaped by the law). *Short-term visitors?* **Yes** (experiencing enforcement, even briefly). Anyone physically present and governed.
      *   **State Lines:** **A Rough Proxy.** Presence within territory is a decent indicator of being subject to the *daily fabric* of coercive law. But citizens living abroad long-term might not qualify.
      *   **Causal Impact Boundary:** **Too Disconnected.** Someone indirectly affected abroad doesn't experience the *lived reality* of being ruled by that specific legal system in the same way.
      *   **Problem Cases:** Supply chain workers/climate refugees abroad **excluded** (lack direct, lived subjection within the legal space). Tourists **included** (they experience the law directly while present).

  5.  **Practical/Feasibility (Governing the Governed):**
      *   **Claim:** A stable political order requires that those bearing the brunt of the rules have a stake and capacity to participate in its maintenance. It's about functional self-governance.
      *   **Includes:** Stable residents with sufficient stake/social ties. *Undocumented immigrants?* **Often Yes** (long-term residents deeply integrated). *Short-term visitors?* **No** (transient, minimal stake).
      *   **State Lines:** **Administrative Necessity.** Defining a feasible demos requires *some* boundary; territorial presence is a practical (if imperfect) marker of stake and capacity.
      *   **Causal Impact Boundary:** **Impractical.** Including everyone affected globally creates an unmanageable demos lacking common identity or practical means for collective authorship.
      *   **Problem Cases:** Supply chain workers/climate refugees abroad **excluded** (impractical, lack shared political space). Tourists **excluded** (no stake).

  **The Takeaway for Your Seminar:**

  *   **Including Undocumented Immigrants:** Strongest under **Normative Fairness, Legitimacy, and Metaphysical** readings. Weakest under **Conceptual** and **Practical**.
  *   **Excluding Short-Term Visitors:** Strongest under **Normative Fairness, Practical,** and arguably **Conceptual**. Weakest under **Metaphysical**.
  *   **The Global Challenge (Supply Chain/Climate Refugees):**
      *   **Conceptual & Practical:** Easily exclude them (focus on territorial demos/feasibility).
      *   **Normative Fairness:** Can exclude them (focus on *direct* coercion).
      *   **Metaphysical:** Excludes them (lack lived subjection).
      *   **Normative Legitimacy:** **Forces Inclusion** but **collapses the system** by demanding global democracy. This is the reading most vulnerable to the "problem cases" and highlights the core tension in the slogan.
  *   **State Lines vs. Causal Impact:**
      *   **State Lines** hold up best for **Conceptual** and **Practical** readings.
      *   **Causal Impact** is demanded by **Normative Legitimacy**, fits **Normative Fairness** better than state lines, but wrecks feasibility and the Conceptual definition.

  **Use this menu to:** Pinpoint *which* version of the argument you're using when pushing back, acknowledge the trade-offs (especially regarding boundaries), and see which readings are robust enough to handle edge cases vs. which ones crumble under the weight of global interconnectedness. Good luck drafting!
