  To move forward, the seminar needs to distinguish Neurath's *aspiration* (pictures as independent semantic vehicles) from his *practice* (using them as stable reference points amid uncertainty). Clarifying that ISOTYPE was meant to be revisable *like* the boat—but slowly, via collective agreement—could reconcile both camps. No new sources needed; just sharper attention to how Neurath's metaphors and projects interlock. 

