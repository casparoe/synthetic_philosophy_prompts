answer: |-
  **Bottom line:** This is a **substantive philosophical disagreement** about whether pictorial systems can inherently encode propositional content (semantic theory) or merely illustrate pre-existing linguistic propositions (pedagogy/propaganda), complicated by a misinterpretation of Neurath's boat metaphor regarding stability.

  **Diagnosis:**  
  1.  **Core Disagreement:** The "semantic theory" side claims ISOTYPE demonstrates that visual symbols can *directly* represent states of affairs and bear truth-values without linguistic mediation. The "pedagogy" side argues pictures are always parasitic on verbal logic for precise meaning and truth-evaluation, making ISOTYPE purely illustrative. This *is* substantive: it concerns the fundamental nature of pictorial representation and its relation to propositional logic.
  2.  **Your Insight is Key:** Your observation about the boat metaphor vs. pictorial stability is **crucial and correct**, not overreading. The tension is real:
      *   **The Boat (Neurath's Epistemology):** Knowledge is holistic, fallible, and constantly revised piecemeal based on experience/pragmatics. No foundational, unrevisable elements exist.
      *   **ISOTYPE (Neurath's Semiotics/Practice):** Requires *relatively stable*, conventionally agreed-upon symbolic meanings to function across contexts. This stability *seems* foundational.
  3.  **Resolving the Tension/Advancing the Debate:** Neurath likely saw this "stability" as pragmatic and *provisional*, not absolute or foundational. ISOTYPE symbols are *tools* for social coordination and education, refined through use (like planks on the boat), not fixed axioms. Their meaning depends on context, convention, and the *rules of the pictorial system itself* (its *implicit* syntax), not translation into words. They are revisable *within* the pictorial framework based on efficacy, aligning with the boat.

  **What Would Move It:** Distinguishing **epistemic foundations** (rejected by the boat) from **pragmatic, conventional stability** (required for *any* communicative system, including language itself). Clarifying that Neurath aimed for ISOTYPE to be a *revisable, rule-governed pictorial language* capable of expressing basic empirical propositions *directly*, serving both semantic *and* social functions inseparably. The pictures *are* the vehicle for certain types of propositional content within their system. Recognizing this resolves the apparent tension and shows why dismissing ISOTYPE as *merely* pedagogy misunderstands Neurath's ambition.
