prompt: |-
  I'm taking a seminar on logical empiricism and we've gotten totally stuck on Otto Neurath's picture-language project — ISOTYPE, universal symbols, teh idea that you can do science with pictures instead of sentences. Half the room says Neurath was advancing a real semantic theory: visual representations can carry propositional content without being translated into verbal logic. The other half insists it's just pedagogy and propaganda for workers, and that treating it as philosophy of language is overreaching. I think they're answering seperate questions — one about meaning, one about social function — but I can't tell if that's the whole story or if there's a hidden formal issue about whether pictures need a syntax to be true or false. Here's the weirder thing: Neurath's famous boat metaphor says we rebuild the ship at sea with no fixed planks, yet his picture-language seems to depend on stable, cross-cultural visual references that don't get rebuilt. Nobody in class has brought up that tension, but I feel like it might be the hidden disagreement doing all the work. You're a professional philosopher of science with expertise in conceptual analysis. Please think carefully about the structure of this stall before you answer — brainstorm what kind of disagreement it is, don't just survey positions. Give me your bottom line up front in one paragraph: is this verbal, substantive, or ill-posed? Then diagnose it using what each side actually says, address whether my boat-vs-pictures tension is real or just my overreading, and say what — a distinction, a historical clarification, or nothing — would actually move it. Hard limit: bottom line first, then max 350 words. Don't give me a bibliography or cite specific editions; I'm writing on my phone without library access and can't verify page numbers.
