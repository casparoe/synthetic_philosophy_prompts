  I've been trying to write an essay for my practical philosophy seminar and I'm kind of lost about whether I'm onto something real or just mixing up terms in a fancy way. My thesis is that deliberative democracy secretly depends on direct normativity, and that if you take indirect normativity seriously it breaks the link between ideal deliberation and actual democratic decisions. Here's the rough idea. Models like the original position or the ideal speech situation ask citizens to imagine what fully rational, unbiased agents would agree on, then treat that agreement as normatively binding on us. But that only works if the norm reaches us directly — as if the ideal agent's verdict is just ours in cleaner form. If normativity is indirect, then a norm only binds me when I can reflectively endorse it from my actual standpoint. The problem is that in real direct democratic settings — think Swiss referendums or California ballot propositions — citizens regularly reject outcomes that align with the idealized view, not because they're misinformed but because they experience what I want to call a reflexive gap: the idealized deliberator doesn't feel continuous with who they actually are, so the norm never gets internalized. I call this the shadow deliberation problem, where ideal reasoning runs parallel to politics but never actually intersects with it, leaving democratic legitimacy hanging on a mediation that never occurs.

  I'm asking you to act like a professional philosopher who specializes in practical reason and democratic theory, and please think carefully before answering. Start with a quick brainstorm of the strongest version of my argument and the best reply I should anticipate, then move into specifics. I especially want you to check whether my use of direct versus indirect normativity is accurate or if I'm misapplying a distinction that actually allows for some mediated binding I'm not seeing. Is this genuinely a new worry, or am I just dressing up the familiar complaint that ideal theory is unrealistic? Please seperate what's fairly settled in the literature from what's genuinely contested, and don't present a disputed claim as if it's the consensus. Also write back in continuous prose only — no headings, no bullet points, no bold text, no tables, just like a long email or letter. Don't give me a bibliography or reading list since I'm working without library access right now, and avoid citing specific page numbers I can't check. If you think I'm reaching, say so plainly.
