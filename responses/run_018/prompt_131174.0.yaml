  We are dealing with Dennett's idea that the self is a "center of narrative gravity." This is an abstraction, much like the center of gravity in a physical object, that arises from the stories we tell about ourselves and that others tell about us. It's not a thing but a useful fiction that helps organize our experiences and actions.

  Let's analyze each case:

  Case 1: Brain injury causing memory loss but same jokes and care for people. Despite the memory loss, the person's core behaviors and attachments remain. This suggests that the narrative gravity center is still there because the core elements of her story (her personality, humor, relationships) are intact. The narrative continues with the same character.

  Case 2: Brainwashing leading to a complete rejection of old beliefs and memories. The old narrative is abandoned and replaced by a new one. Even though the body is the same, the center of narrative gravity has shifted because the story that defines the self has been rewritten entirely. The old center is gone.

  Case 3: Two bodies sharing one continuous stream of consciousness. The narrative is continuous and shared, so it's one story being lived by two bodies. Hence, one center of narrative gravity that spans both bodies.

  Case 4: Gradual change over 60 years. The narrative evolves slowly without any abrupt breaks. The center of narrative gravity remains the same because there's a continuous thread of the story. Even though the beliefs and preferences have changed, the narrative has developed coherently.

  Case 5: Autobiography that is mostly fiction, believed by the author, and then adopted by another person. The author has a narrative that they believe in (even if fictional) and thus has a center of narrative gravity. The second person, by adopting that story, is creating a new center of narrative gravity based on that narrative. However, they are not the same center because the narratives are now being lived by two distinct individuals. The original author's narrative is about themselves, and the second person is living a narrative that is a copy (but about themselves). So they are two distinct centers.

