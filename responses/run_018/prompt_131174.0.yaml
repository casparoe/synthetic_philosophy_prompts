  case 3: in a sci-fi setup two people share one continuous stream of consciousness back and forth with no gap, split between two bodies. i think theres one center spread across both, not two separate ones.

  case 4: a person slowly replaces every belief and preference over 60 years but never has a sharp break. i still think its the same center, just moved far away.

  case 5: someone writes an autobiography thats mostly fiction but genuinely believes it, and then another person reads it and starts living that story out in real life. i keep going back and forth on whether the second person is now part of the same center or just copying it.

