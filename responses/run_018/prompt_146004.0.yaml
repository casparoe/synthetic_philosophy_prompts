answer: |-
  Here's a reasoned argument repurposing Lewis's critique to defend a restricted form of institutional vicarious liability, addressing his core objection and stating the required philosophical commitment:

  **1. Lewis's Core Objection to Vicarious Punishment:**  
  David Lewis rejected penal substitution (e.g., an innocent volunteer suffering for a guilty person) in criminal justice because **punishment must track *personal desert***. He argued that:  
  - Guilt and liability are non-transferable properties of individuals.  
  - Suffering by an innocent party doesn't "cancel" the offender's desert; it merely adds a *new* wrong (unjustly punishing the innocent).  
  - Punishment is inherently *retributive* – it must be inflicted *on the deserving agent* for justice to be served.  

  **2. Repurposing Lewis for Corporate Vicarious Liability:**  
  We can defend a *non-retributive, structural* form of institutional liability by accepting Lewis's critique but limiting its scope to *personal desert*, while carving out space for *collective functional accountability*:  

  - **Structural Accountability vs. Desert Transfer:**  
    Institutional penalties (e.g., corporate fines, sanctions, dissolution) are not *transfers* of punishment from guilty individuals to an innocent collective. Instead, they are **direct penalties on the collective agent itself** for its *structural failures*. For example:  
    - A corporation is fined for toxic waste dumping *because* its operational systems (budgets, training, oversight) enabled the harm.  
    - The penalty addresses the *organization’s* defective structures, not the "desert" of individual employees.  
    This avoids Lewis’s objection because *no desert is transferred*; the collective is liable *in its own right* for its institutional conduct.  

  - **Functional Substitution Without Moral Substitution:**  
    Penalties imposed on collectives *functionally substitute* for individual punishment only in the sense that they:  
    - Achieve **deterrence** (e.g., incentivizing better compliance systems),  
    - Ensure **reparation** (e.g., compensating victims from corporate assets),  
    - Facilitate **reform** (e.g., court-ordered restructuring).  
    Crucially, this substitution is *structural*, not moral: it does *not* absolve culpable individuals (who may still face separate prosecution) but holds the *entity* accountable for its *systemic role* in enabling harm.  

  **3. Avoiding Lewis's Objection:**  
  Lewis’s core objection fails against this model because:  
  - **No Innocent "Volunteer" Suffers:** The collective (corporation) is not "innocent" but *directly responsible* for its structural flaws. Liability arises from its *own* agency.  
  - **No Transfer of Desert:** Penalties are imposed *because* the collective’s systems failed, not because it "inherits" desert from members. Individual desert remains intact and separately addressable.  
  - **Non-Retributive Justification:** The penalties are justified *consequentially* (deterrence, reparations) and *correctively* (reforming flawed systems), not retributively. Lewis’s objection targets *retributive transfers*, which this avoids.  

  **4. Required Philosophical Commitment:**  
  This position necessitates a commitment to **robust collective moral agency**:  
  > *Collective agents (like corporations) are distinct moral entities capable of *intentional action*, *responsibility*, and *liability* irreducible to their individual members.*  

  This entails:  
  - **Intentionality:** Collectives can form goals, make decisions, and act through organizational structures (e.g., board votes, policies).  
  - **Moral Responsibility:** Collectives can bear blame for outcomes traceable to their systemic choices (e.g., a company’s cost-cutting culture causing safety failures).  
  - **Distinct Liability:** Penalties can *appropriately* target the collective *as such* (e.g., fining the corporation impairs its operational capacity, not just individuals).  

  **Conclusion:**  
  Lewis’s rejection of penal substitution reinforces that *desert* cannot be transferred from individuals. However, by decoupling institutional liability from personal desert and grounding it in *structural accountability*, we can defend corporate penalties as legitimate responses to *collective* agency failures. This requires accepting that collectives are genuine moral agents whose systemic actions justify non-retributive penalties aimed at functional goals (deterrence, repair, reform) – satisfying justice without violating Lewis’s core objection.
