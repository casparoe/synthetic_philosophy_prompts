prompt: |-
  In my upper-division philosophy of science seminar I regularly defend evolutionary psychology against the charge that it traffics in just-so stories, and I had long assumed the charge was more of a rhetorical posture than an argument. Last term, however, a student reconstructed it in a form I have not been able to answer cleanly, and I would like a diagnosis before I teach the unit again. Her argument ran as follows:

  (1) A hypothesis is scientific only if evidence bears on it asymmetrically: there must be possible observations that would count for it and possible observations that would count against it, and one must be able to say in advance, at least roughly, which are which.

  (2) Adaptationist hypotheses about human cognition -- that we possess a dedicated cheater-detection module, that pregnancy sickness is an adaptation protecting the fetus from dietary toxins, that men and women differ in jealousy because the ancestral costs of infidelity were asymmetric -- are confirmed when observed behavior fits the hypothesis's retrodictions.

  (3) But for any observed behavior whatsoever, some adaptationist accommodation can be constructed after the fact. If the predicted trait appears, it is an adaptation. If it fails to appear, the cost of the trait exceeded the benefit, or the relevant selection pressure was absent. If the opposite of the prediction appears, the environment of evolutionary adaptedness must have differed from what was assumed, or the trait is a byproduct of some other adaptation, or a developmental constraint blocked the optimum. Nothing in the method forbids any of these moves.

  (4) Therefore no possible observation counts against an adaptationist hypothesis; such hypotheses can only be confirmed, never disconfirmed.

  (5) By (1), adaptationist hypotheses in evolutionary psychology are not scientific.

  Her conclusion in (5) is already more than I want to grant, but the real trouble is that the argument appears to prove too much. Phylogenetic reconstruction, historical geology, and much of cosmology also infer past processes from present traces, and in each case a sufficiently clever theorist can accommodate anomalous traces by revising auxiliary assumptions about initial conditions or background processes. If (3) and (4) are sound as applied to evolutionary psychology, parallel versions seem available for these fields -- and I am not prepared to conclude that inferring the tree of life from molecular sequences is unscientific. Nor do I want to win cheaply by pointing to cases where adaptationist reasoning got there first, as Fisher's sex-ratio argument is sometimes said to have done, since the student's premise (1) demands advance asymmetry and that case arguably supplies it.

  Which step should I reject? I am most reluctant to give up (1), since some version of it seems required to distinguish empirical inquiry from unfalsifiable systematizing. If the flaw lies in (3) or (4), explain what an adaptationist hypothesis would have to look like for an observation genuinely to count against it, and whether actual research programs in evolutionary psychology meet that standard or merely gesture at it. And tell me what rejecting your chosen step costs -- what other commitments, in evolutionary biology or in the historical sciences generally, I would have to revise or abandon along with it.
reasoning: |-
  Okay, the user is a philosophy of science professor who's grappling with a student's critique of evolutionary psychology. The student argues that adaptationist hypotheses are unfalsifiable because they can always be adjusted post-hoc to fit any observation. The professor is concerned because this argument seems to threaten not just evolutionary psychology but other historical sciences like phylogenetics and cosmology too. They need help identifying which step of the argument to reject without undermining scientific integrity.

  First, I need to unpack the student's argument. Premise 1 sets the falsifiability criterion: scientific hypotheses must have asymmetric evidence. Premise 2 notes that evolutionary psychology confirms hypotheses through retrodictions. Premise 3 claims these hypotheses can always be saved by auxiliary adjustments. Premise 4 concludes they're unfalsifiable, leading to premise 5 declaring them unscientific. 

  The professor's main worry is that this "proves too much" - it would condemn all historical sciences. So the core issue is distinguishing legitimate auxiliary adjustments from ad hoc immunizing tactics. The key must lie in premise 3/4. The student portrays evolutionary psychology's auxiliary hypotheses as unconstrained, but this overlooks that in mature sciences, auxiliary assumptions themselves face independent empirical checks.

  For example, when cosmologists explain cosmic microwave background anomalies by revising inflation models, those revised models must then make new predictions about large-scale structure. Similarly, claims about "environments of evolutionary adaptedness" in evolutionary psychology could be constrained by paleoecology data or cross-species comparisons. The problem isn't the structure of historical inference per se, but whether the field imposes discipline on its auxiliary assumptions.

  The professor's deeper need is likely pedagogical: they want to show students how to evaluate evolutionary psychology rigorously without dismissing the entire enterprise. They might also want to preserve scientific unity - not conceding that historical sciences are fundamentally different from experimental ones. 

  I should emphasize that falsifiability applies to whole research programs, not isolated hypotheses. The student's error is treating adaptationist hypotheses as isolated claims when in reality they're embedded in networks of theory. The professor can acknowledge evolutionary psychology's past methodological flaws while arguing contemporary approaches (like testing hypotheses across cultures or with neuroscientific methods) provide the needed constraints.

  Rejecting premise 3 doesn't cost much - it just requires acknowledging that auxiliary hypotheses need evidentiary support. This preserves the legitimacy of other historical sciences while demanding higher standards from evolutionary psychology. The professor can then discuss cases like menstrual cycle shifts in mate preference studies, where failed replications forced refinement of theories, as evidence the field can respond to counterevidence.
answer: |-
  Your student has articulated a serious challenge that strikes at the methodological core of historical sciences. The flaw lies primarily in **premise (3)**, specifically in its characterization of auxiliary hypotheses as *unconstrained*. While adaptationist explanations *can* be protected ad hoc, they *need not be* – and in scientifically rigorous evolutionary psychology, they *are not*. Here's the diagnosis and its implications:

  ### Step-by-Step Rejection of Premise (3)
  1. **Auxiliary Hypotheses Must Be Independently Testable**:  
     Premise (3) assumes auxiliary hypotheses (e.g., about ancestral environments, fitness trade-offs, or developmental constraints) are arbitrary "free parameters." But scientifically, these auxiliaries must themselves be:  
     - Empirically grounded (e.g., using paleoecology, comparative primatology, or genomic dating).  
     - Subject to *independent* falsification.  
     - Parsimonious (e.g., rejecting complex "rescues" without evidence).  

     **Example**: If pregnancy sickness were absent in a population with high dietary toxins, invoking "different ancestral costs" requires evidence – e.g., genetic data showing recent environmental shifts or cross-cultural studies demonstrating variability in toxin exposure.

  2. **Predictive Scope Beyond the Original Trait**:  
     Strong adaptationist hypotheses generate *novel predictions* unrelated to the initial observation. If an explanation for sexual jealousy asymmetry also predicts specific neural substrates, cross-cultural patterns, or fitness outcomes under defined conditions, it becomes testable in multiple domains.  
     - E.g., The "cheater-detection module" hypothesis (Cosmides & Tooby) predicted enhanced performance on social contract problems *specifically*, not general logical improvement – a asymmetry confirmed experimentally.

  3. **Constraints from Evolutionary Theory**:  
     Not all auxiliary moves are biologically plausible. Claims like "the cost exceeded the benefit" require quantitative models of selection pressures. If a trait's absence is explained by high costs, we should find evidence of those costs (e.g., reduced survival, lower reproductive output) in relevant populations.

  ### Why Premise (4) Fails: Cases Where Evidence Counts Against Hypotheses
  Evolutionary psychology *can* be falsified when:  
  - **Predictions fail under controlled conditions**: E.g., if sexual jealousy asymmetry disappeared in cultures with equal reproductive costs of infidelity (if such cultures exist).  
  - **Alternative explanations better fit the data**: E.g., if pregnancy sickness correlates better with modern dietary factors than toxin avoidance.  
  - **Phylogenetic constraints are violated**: E.g., if a "human-specific" adaptation appears in non-human primates with no common selective pressure.  

  **Real-world example**: Early claims that rape is an adaptation were widely rejected because they failed to meet evidentiary standards for adaptation (e.g., no evidence of heritable variation, selective pressure, or design specificity).

  ### Cost of Rejecting Premise (3): Methodological Rigor
  Rejecting (3) doesn’t require abandoning evolutionary psychology or historical sciences – but it demands higher standards:  
  - **Auxiliary hypotheses must be independently validated**, not just invoked.  
  - **Quantitative models of selection** are needed over verbal arguments.  
  - **Integration with other fields** (genomics, neuroscience, anthropology) is essential to constrain hypotheses.  

  This upholds premise (1) while allowing historical sciences to be scientific. The key is that *whole research programs* (not single hypotheses) must have asymmetric testability. Ad hoc moves are permissible only if they generate new, testable implications.

  ### Implications for Other Historical Sciences
  Your intuition is correct: phylogenetics, geology, and cosmology face similar challenges. But they survive falsification charges by:  
  - **Independent evidence for auxiliaries**: E.g., radiometric dating constraining phylogenetic trees; cosmic microwave background testing inflation models.  
  - **Consilience**: Multiple lines of evidence converging on a single explanation (e.g., fossil, molecular, and morphological data in phylogenetics).  
  - **Novel predictions**: E.g., predicting undiscovered transitional fossils or cosmic elements.  

  **The difference**: Fields like geology have stronger constraints (e.g., laws of physics) and richer independent data. Evolutionary psychology’s vulnerability stems from limited direct evidence about human ancestry – but this is improving with ancient DNA, ethology, and cognitive neuroscience.

  ### How to Defend Evolutionary Psychology in Your Seminar
  1. **Concede the kernel of truth**: Early evolutionary psychology *did* often traffic in just-so stories. The field has since adopted stricter standards (e.g., "special design" criteria).  
  2. **Emphasize testable auxiliaries**: Show work that integrates paleoecology (e.g., dietary toxin levels in ancestral environments) or cross-cultural psychology.  
  3. **Highlight genuine asymmetry**:  
     - E.g., Fisherian sex ratio: Predicts 1:1 investment *even if* one sex is costlier – a counterintuitive, falsifiable claim.  
     - E.g., Menstrual cycle shifts in mate preference: Predicted *before* initial tests and later challenged by replication failures, forcing refinement.  

  **What you lose**: The ability to defend *all* adaptationist hypotheses equally. Some evolutionary psychology remains unscientific – but the core approach is redeemable with rigor. This mirrors how cosmology rejects untestable multiverse models while accepting constrained inflation theories.

  ### Conclusion
  Reject **premise (3)**. The student is right that ad hoc rescues *can* immunize hypotheses, but wrong that they *must*. By demanding auxiliary hypotheses be independently testable and parsimonious, evolutionary psychology – like other historical sciences – can satisfy premise (1)’s asymmetry requirement. The cost is abandoning lax "storytelling" and embracing consilience with harder data. Your seminar can now explore *how* to constrain adaptationist hypotheses, turning the critique into a framework for methodological progress.
