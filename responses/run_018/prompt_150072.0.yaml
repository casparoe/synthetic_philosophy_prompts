  Looking at the cases, the pattern hinges on the function of the memory. Ritual dates serve internal cohesion without public claims. The mill story was a solidarity tool but lacks current legal stakes. The indigenous case involves ongoing rights and justice. The national myth correction prevents harm from false narratives. The atrocity numbers are tricky because the symbolic figure supports recognition and reparations, but the documented count is precise.

  The proposed principle of "functional jurisdiction" makes sense. When memory is identity-constitutive without making truth claims (like rituals or family stories), it gets priority in that domain. When it's claim-justifying (legal rights, historical facts), documentary evidence prevails unless there's systemic injustice, as with indigenous rights. For the atrocity case, the survivor community's memory has moral weight for commemoration, but historians should note the discrepancy without erasing the symbolic importance. This dual approach respects both functions without conflating them.

  For the family case, since the resistance narrative is used only internally, it falls under identity-constitutive memory. No need to correct it unless it enters public discourse. This aligns with the religious date verdict. 

  The user might need to refine how they handle cases where identity and claims overlap, like the atrocity numbers. Clarity on domains (memorials vs. history books) is crucial. They don't need to drop any verdicts; the framework accommodates all by distinguishing between spheres of authority. The key is ensuring that when memory serves justice (like indigenous land rights), it can override documents, but not for factual accuracy in other contexts.
answer: |-
  Your judgments reveal a consistent underlying principle distinguishing between **constitutive memory** (shaping identity/practice within a community) and **claim-justifying memory** (supporting factual assertions in the public/political sphere). Here's a unified framework:

  ---

  ### **Proposed Principle: Functional Jurisdiction of Memory**
  1. **Constitutive Memory (Internal/Symbolic Domain):**  
     Community practices, rituals, or identity narratives that *do not make external factual claims* should be preserved without documentary correction, even if historically inaccurate.  
     *Authority:* Sovereign to the community.  
  2. **Claim-Justifying Memory (Public/Adjudicative Domain):**  
     When memory is used to assert factual claims affecting rights, resources, or public understanding, documentary evidence must prevail *unless*:  
     - The documentary record arises from systemic injustice (e.g., colonial suppression), or  
     - The community’s survival/autonomy depends on its narrative.  
     *Authority:* Requires verifiable evidence.  

  ---

  ### **Applying the Principle to Your Cases**
  | **Case**                          | **Verdict**                     | **Principle Application**                                                                 |
  |-----------------------------------|----------------------------------|-------------------------------------------------------------------------------------------|
  | **Diasporic Ritual Date**         | Preserve ritual date            | **Constitutive:** Liturgical practice, no external claim. Historians use archival date.   |
  | **Mill Closure Narrative**        | Replace oral account            | **Claim-Justifying:** Public history/pedagogy requires accuracy; no systemic injustice.    |
  | **Indigenous Treaty Boundaries**  | Oral tradition prevails legally | **Claim-Justifying + Exception:** Colonial documents are systemically suspect; autonomy at stake. |
  | **National Bloodless Revolution** | Correct curriculum              | **Claim-Justifying:** Public education harms when mythologized; no countervailing justice claim. |
  | **Atrocity Victim Numbers**       | **Dual Recognition:**           | *Commemoration:* Survivors' symbolic figure (constitutive). *Forensic Record:* Documented figure (corrective). **Do not conflate domains.** |

  #### **Resolution for Atrocity Numbers:**
  - **Memorials/Moral Education:** Use "over 400" or "thousands," acknowledging survivors' symbolic magnitude.  
  - **Historical Record:** Note the forensic count *alongside* the community’s memory as a testament to trauma’s impact.  
  - **Why?** The number here serves *both* functions: constitutive (memorializing trauma) and claim-justifying (reparations/recognition). Dual framing respects both without falsification.  

  ---

  ### **Kinship Ritual Case: Ancestor as Resistance Fighter**  
  - **Verdict:** Preserve the family narrative.  
  - **Principle:** Purely **constitutive memory**. Used only internally, it makes no public claim. Correcting it would violate communal self-definition.  
  - **Alignment:** Consistent with religious ritual date case.  

  ---

  ### **Consistency Check**  
  - **No verdicts need abandonment.** The framework coherently distinguishes:  
    - Ritual dates/family stories (non-claim, internal).  
    - Mill closure/national myth (public claims requiring correction).  
    - Indigenous boundaries (public claim where documents are unjust).  
  - **Atrocity case** is resolved by separating commemorative vs. forensic contexts, avoiding a zero-sum choice.  

  ### **Key Distinctions**  
  - **Constitutive Authority:** Binds a community through practice/narrative. Immune to external correction.  
  - **Corrective Authority:** Governs when facts impact shared reality (rights, resources, public truth).  
  - **Systemic Injustice Exception:** When documents reflect oppression, communal memory can override in claim-justifying contexts.  

  This principle prevents ad hoc rationalization by prioritizing *function* and *domain* over subjective "importance." It acknowledges that memory operates in pluralistic epistemic spaces, each with its own rules of validation.
