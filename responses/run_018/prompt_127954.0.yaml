prompt: |-
  I recently criticized a colleague for repeatedly missing shared deadlines despite being chronically late myself, and the exchange left me wondering whether my own record automatically disqualified me from blaming him, or whether there was some narrower sense in which my complaint could still be legitimate. For an upcoming episode of my podcast, I am interviewing an unnamed philosopher who defends what she calls the jurisdictional account of standing to blame: roughly, hypocrisy undermines standing only within the specific normative domain where the blamer implicitly claims authoritative judgment, not globally, and this jurisdiction can be narrowed by explicit self-exemption or widened by tacit role-assumption. She further holds that there is a neglected asymmetry between interpersonal and institutional blame—an institution may retain standing despite hypocrisy if an internal division of labor separates the criticizing office from the offending office, whereas an individual cannot partition herself analogously.

  I want eight to ten interview questions that avoid generic biography and press directly on the machinery of her view. At least one should target the scope-narrowing mechanism—how she distinguishes legitimate self-exemption from mere special pleading—anticipating her reply that explicit acknowledgment of one's own failure preserves standing by transforming authoritative judgment into solidarity-based correction; include a follow-up asking whether solidarity-based blame collapses into mere mutual confession and thereby loses its distinctive critical force. Another should probe the institutional asymmetry by asking what she makes of cases where the same person occupies both offices—for instance, a university president who issues sustainability mandates while the institution's endowment holds fossil-fuel assets—anticipating her defense that structural separation survives personal overlap when the roles are governed by different normative protocols; the follow-up should ask whether this saves too much, allowing any institutional hypocrisy to be rationalized by inventing ad hoc internal protocols. A third should connect her framework to the classic problem of invisibility and internal commitment: if a blamer were rendered invisible such that reputational costs disappeared but her internal normative commitments remained intact, would hypocrisy still undermine her standing, or does standing depend partly on the social visibility of the blamer's acknowledged obligations? For each question, please include the anticipated reply and the keyed follow-up, and ensure the sequence builds so that her standard deflections become progressively harder to deploy.
reasoning: |-
  Okay, the user is preparing for a podcast interview with a philosopher who has a specific theory about hypocrisy and standing to blame. They want focused questions that dig into the mechanics of her view, not biographical stuff. Let me parse the key elements of her theory first.

  The jurisdictional account says hypocrisy only undermines standing in the exact area where the blamer claims authority. So if I'm late but call out someone else's lateness, my hypocrisy might remove my standing to blame for lateness, but not for unrelated things like theft. The philosopher also thinks you can narrow this scope by explicitly acknowledging your own failure, which turns the blame into a solidarity-based correction rather than authoritative judgment.

  There's an asymmetry between interpersonal and institutional blame. Institutions might still have standing even if hypocritical because different offices handle criticism and violations. For example, the HR department can criticize an employee even if the finance department did something wrong. But individuals can't split themselves like that. 

  The user wants questions targeting three main areas: scope narrowing (how self-exemption works without being special pleading), the institutional asymmetry (especially when one person holds conflicting roles), and how visibility affects standing. They also want anticipated replies and tough follow-ups for each.

  For the scope-narrowing part, I need to craft a question that forces her to distinguish legitimate self-exemption from hypocrisy. Her likely answer is that explicit acknowledgment transforms the interaction into solidarity-based correction. But then the follow-up should challenge whether this loses the critical sting of blame. 

  For the institutional asymmetry, the example of a university president who promotes sustainability while the endowment invests in fossil fuels is perfect. She'll probably say the roles have different protocols, so structural separation exists even with personal overlap. The follow-up needs to push back against this being a loophole for any institutional hypocrisy.

  For the visibility question, I should explore whether hypocrisy undermines standing only when obligations are socially visible, or if it's about internal commitments. If the blamer is invisible, does hypocrisy still matter? Her answer might involve the social nature of standing, but the follow-up can question if this overemphasizes perception over moral reality.

  The sequence should build so her defenses get harder to maintain. Starting with scope narrowing, then institutional cases, ending with visibility which might challenge her whole framework. The questions need to be precise and avoid letting her retreat to generalities. Also, ensure the follow-ups anticipate her replies and corner her into clarifying ambiguities in her theory.
answer: |-
  Here are eight tightly focused interview questions probing the machinery of the jurisdictional account, complete with anticipated replies and challenging follow-ups designed to escalate pressure on the core mechanisms:

  1.  **Question (Scope Narrowing - Mechanism):** You argue that explicit self-exemption ("I know I'm late too, but...") can preserve standing by transforming "authoritative judgment" into "solidarity-based correction." What precise *normative work* does the *explicitness* of the self-exemption do? Why isn't the blamer's *implicit awareness* of their own failure sufficient to trigger this transformation, avoiding hypocrisy?
      *   **Anticipated Reply:** Explicitness performs a crucial *communicative* function. It publicly acknowledges the shared normative fallibility and rejects a posture of moral superiority. Implicit awareness remains private and doesn't alter the interpersonal dynamic; the blamer still presents *themselves* as occupying the judge's bench *over* the target within that domain.
      *   **Follow-Up:** Doesn't this explicit acknowledgment risk collapsing the critical force of blame entirely? If both parties openly acknowledge shared failure ("We're both terrible at deadlines, but you *really* messed up this time"), isn't this merely mutual confession or commiseration? How does "solidarity-based correction" retain the distinctively *prescriptive* and *demanding* character of blame, rather than becoming just a shared lament?

  2.  **Question (Scope Narrowing - Distinguishing Exemption from Pleading):** Clearly, not every self-exempting statement preserves standing ("I know I steal, but you shouldn't" fails). What principle distinguishes *legitimate* self-exemption/narrowing of jurisdiction from mere *special pleading*? Is it solely the sincerity of the acknowledgment, or something structural about the blamer's relationship to the norm?
      *   **Anticipated Reply:** Legitimacy hinges on the blamer's *attitude* towards their *own* violation *in that moment*. Are they treating their own transgression as excused, justified, or irrelevant (special pleading), or are they acknowledging it as a genuine *failure* that doesn't absolve the target but reframes the interaction? The latter demonstrates shared commitment to the norm *despite* shared weakness.
      *   **Follow-Up:** Doesn't this reliance on the blamer's internal attitude at the moment of blaming create an easily exploited loophole? Couldn't a savvy hypocrite simply *perform* the "correct" attitude of acknowledging their failure while still harboring a sense of superiority or entitlement to judge? How does your account guard against this performative hypocrisy?

  3.  **Question (Institutional Asymmetry - Core Claim):** You posit a key asymmetry: institutions can retain standing despite hypocrisy via internal division of labor (e.g., HR blaming an employee for misconduct even if Finance committed tax fraud), while individuals cannot self-partition. Why is this partition effective for institutions but metaphysically or normatively impossible for individuals?
      *   **Anticipated Reply:** Institutions are constituted by distinct roles, offices, and normative protocols that exist independently of the individuals filling them. Blame issued by Office A (governed by Protocol X) concerns violations *by individuals or subunits* relative to Protocol Y. The "institution" blaming is really Office A acting *as* Office A. An individual lacks such constitutive internal separability; they are a single normative agent.
      *   **Follow-Up:** But doesn't an individual *also* occupy multiple social roles (parent, colleague, citizen) with potentially conflicting obligations? Couldn't an individual argue they blame *qua* colleague about deadlines, while acknowledging failure *qua* parent managing childcare, thus achieving a personal "division of labor"?

  4.  **Question (Institutional Asymmetry - Personal Overlap):** Consider a university President (a single person) who publicly issues strong sustainability mandates (Office A: Sustainability Leadership) while simultaneously serving as Chair of the Investment Committee (Office B) that refuses to divest the endowment from fossil fuels. Does this person, *in their role as President*, retain standing to blame a student group for insufficient recycling efforts? Why or why not, given your account?
      *   **Anticipated Reply:** Potentially yes, if the roles are sufficiently distinct *structurally and normatively*. The President's sustainability mandate operates under protocols of campus operations and student conduct. The Investment Committee operates under fiduciary protocols focused on financial returns. The hypocrisy lies *between* Office A and Office B, not *within* the normative domain (student environmental compliance) where the President (as Office A) is blaming. The *person* is conflicted, but the *office* issuing the blame (Presidency re: campus rules) is structurally separate from the offending office (Investment Committee).
      *   **Follow-Up:** Doesn't this defense allow *any* institutional hypocrisy to be rationalized *post hoc* by simply pointing to *any* internal structural difference, however minor or ad hoc? If the Investment Committee had a tiny sub-committee nominally tasked with "long-term environmental risk assessment," would that be enough "structural separation" to immunize the President's blame from charges of hypocrisy? Where's the limit?

  5.  **Question (Institutional Asymmetry - Limits of Separation):** What constitutes a *genuine* internal division of labor sufficient to preserve standing? Specifically, if the hypocrisy occurs *within the same chain of command* or *undermines the very authority* of the blaming office (e.g., Police Chief blaming an officer for brutality while ignoring systemic brutality she oversees), does the jurisdictional separation still hold?
      *   **Anticipated Reply:** The separation must be *normatively relevant* and *operative*. If the blaming office (e.g., Internal Affairs) is structurally independent and its protocols genuinely prioritize investigation over chain-of-command loyalty, standing *might* remain even if the Chief is hypocritical elsewhere. However, if the hypocrisy directly concerns the *authority* or *integrity* of the blaming function itself (e.g., IA ignores complaints against the Chief's allies), or if the blaming office is directly complicit in the systemic failure, the separation collapses, and standing is lost.
      *   **Follow-Up:** Doesn't this introduce a fatal circularity? Determining whether a division is "genuine" or "operative" seems to require a prior judgment about whether the institution *deserves* to have its standing preserved – precisely the question at issue. Isn't your criterion for effective separation ultimately parasitic on an independent assessment of the institution's legitimacy in that domain?

  6.  **Question (Visibility & Internal Commitment):** Imagine a blamer rendered completely *invisible* to the target and wider community – no reputational costs, no social identity at stake. Her internal normative commitments to the relevant rule remain intact. If *this* invisible blamer is herself a consistent violator of the rule, does she lack standing to blame a visible violator? Does your account suggest standing depends crucially on the *social visibility* of the blamer's obligations?
      *   **Anticipated Reply:** Yes, standing is inherently *social* and *relational*. Invisibility removes the core elements: the claim to shared community standards, the potential for reputational effects (even if unintended), and the interpersonal dynamic where the blamer's own adherence is part of the context. An invisible hypocrite might express correct moral judgments, but they lack the *standing* to *blame* interpersonally because blame is a communicative act presupposing shared membership governed by public norms. The *internal* commitment is necessary but insufficient.
      *   **Follow-Up:** If standing vanishes with invisibility, doesn't this imply that the *moral wrong* of hypocrisy (undermining standing) is primarily about *social perception* and *performative inconsistency*, rather than the *internal contradiction* between one's judgment of others and one's own actions? Does this risk reducing the problem of hypocrisy to mere bad optics?

  7.  **Question (Connecting Jurisdiction & Standing):** On your view, does "standing to blame" primarily concern the *blamer's right or authority* to issue the rebuke, or does it concern the *permissibility or effectiveness* of the blame for the *target*? Put differently, is the hypocrite's blame *unwarranted* (like a trespass) or merely *ineffectual* (like a weak argument)?
      *   **Anticipated Reply:** It concerns the blamer's *authority* or *position* to level this specific rebuke within this specific normative domain. Hypocrisy makes the blame *unwarranted* in the sense that the blamer lacks the normative license – they are "out of order," trespassing in a jurisdiction where their own actions disqualify them from acting as judge. This often renders the blame ineffective, but the primary failure is one of warrant.
      *   **Follow-Up:** If the *only* failure is the blamer's lack of warrant (a trespass), but the *content* of the blame is accurate and the target *should* feel its force, why should the *target* care about the blamer's standing? Isn't dismissing the blame *because* of hypocrisy itself a kind of evasion? Does your account inadvertently give the target a "hypocrisy shield"?

  8.  **Question (Synthesis - The Cost of Narrowing):** If successfully narrowing jurisdiction via self-exemption transforms blame into "solidarity-based correction," and institutional standing relies on often-contestable structural separations, does your account ultimately *dilute* the concept of blame? Does it sacrifice the robust, community-upholding, norm-enforcing power of blame in favor of preserving the possibility of criticism from flawed agents, potentially reducing blame to a gentler form of moral suggestion?
      *   **Anticipated Reply:** Not at all. It refines our understanding of blame's diverse functions. Robust, authoritative judgment *is* powerful, but it carries stringent standing conditions. Solidarity-based correction retains critical force – it highlights the failure and calls for change – but does so from a position of shared struggle, which can be more effective in fostering reform among peers. Institutional blame leverages structure to maintain accountability mechanisms even amidst complexity. This isn't dilution, it's sophistication, acknowledging the messy reality of moral life.
      *   **Follow-Up:** Yet, doesn't this risk blurring the line between *blame* (which attributes fault and implies sanction, even if just relational coldness) and mere *criticism* or *disapproval*? If solidarity-based correction lacks the element of sanction or the blamer's implied authority to impose costs, can it truly be called *blame* anymore within the standard philosophical understanding?

  This sequence starts by probing the core mechanism (scope narrowing), moves to the institutional asymmetry and its pressure points (personal overlap, separation criteria), then challenges the social foundations (visibility), clarifies the nature of standing, and culminates in a synthesis question forcing a defense of the view's implications for the very concept of blame. Each follow-up is designed to block easy retreats to the initial distinctions.
