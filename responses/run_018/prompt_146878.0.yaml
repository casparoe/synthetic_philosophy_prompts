  To salvage determinacy, teleosemantics might need layered functions. Proximal functions (current use) vs. distal (evolutionary). Or type vs. token teleosemantics. Maybe procedural memory systems generate contents based on history, but specific instances can have new contents. The user probably wants to know if these adjustments work or if the whole project is flawed.

  Assessing the user: they're a grad student or advanced undergrad in philosophy of mind. They've done neuroscience reading, so they're interdisciplinary. Their deeper need is likely understanding if teleosemantics holds up to empirical challenges or if they need to look elsewhere for naturalizing content. They might be seeking reassurance that modifications can address the issue, or confirmation that the analogy is fundamentally flawed.

