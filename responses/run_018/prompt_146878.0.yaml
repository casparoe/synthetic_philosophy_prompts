answer: |-
  ### Correspondence Table: Heart Analogy in Teleosemantics

  | **Cardiac System Component** | **Teleosemantic Analog (Standard View)** | **Neural Reuse Challenge (e.g., FFA)** |
  |------------------------------|------------------------------------------|----------------------------------------|
  | **Organ**                    | Cognitive mechanism (e.g., belief-forming system) | Cortical substrate (e.g., fusiform gyrus) |
  | **Evolutionary "Designer"**  | Natural selection (historical fitness advantage) | Natural selection (original function: face recognition) |
  | **Proper Function**          | Pumping blood → Circulating oxygen | Face recognition → *Repurposed for bird recognition in experts* |
  | **Malfunction**              | Heart failure (e.g., valve defect) | Misrepresentation (e.g., misidentifying a face) |
  | **Functional Norm**          | Biological norm: "should pump blood" | Representational norm: "should accurately represent faces" |
  | **Token Instance**           | Specific heartbeat event | Specific neural activation (e.g., FFA firing) |

  ---

  ### Disanalogies and Their Implications for Naturalization

  **1. Functional Singularity vs. Pluripotency (Critical Disanalogy)**  
     - **Heart:** Functions are evolutionarily fixed and singular (hearts only pump blood).  
     - **Cognition:** Neural reuse demonstrates **functional pluripotency**—the same substrate (e.g., FFA) acquires *new* content-determining functions (bird recognition) through learning.  
     - **Problem for Naturalization:** Undermines the claim that evolutionary history *alone* fixes content. If current use can override phylogeny, content becomes indeterminate (is the FFA’s "proper function" face or bird recognition?).  

  **2. Functional Acquisition Mechanism (Critical Disanalogy)**  
     - **Heart:** Functions are acquired *solely* via genetic evolution.  
     - **Cognition:** New functions arise via **activity-dependent plasticity** (e.g., Hebbian learning), decoupling content from selection history.  
     - **Problem for Naturalization:** Teleosemantics assumes selection history is the ultimate arbiter of function. Neural reuse suggests developmental/experiential history co-determines content, introducing normativity not grounded in evolution.  

  **3. Context-Invariance vs. Context-Sensitivity (Critical Disanalogy)**  
     - **Heart:** Function is context-invariant (hearts pump blood in all environments).  
     - **Cognition:** Content is context-sensitive (FFA represents faces *or* birds based on expertise).  
     - **Problem for Naturalization:** If the same token state can carry multiple contents (e.g., FFA activation in a bird expert), misrepresentation loses its determinate normative standard.  

  **4. Functional Hierarchy (Less Critical Disanalogy)**  
     - **Heart:** Functions are monolithic (no sub-tasks).  
     - **Cognition:** Cognitive mechanisms often have **layered functions** (e.g., edge detection → object recognition).  
     - **Mitigation:** Teleosemantics can accommodate hierarchy (e.g., Millikan’s "derived proper functions").  

  **5. Etiological Grounding (Non-Critical Similarity)**  
     - Both rely on historical etiology for normativity (malfunction requires a historical norm).  
     - **Implication:** Neural reuse doesn’t negate etiological norms *entirely*—it complicates *which* history (evolutionary vs. developmental) sets the norm.  

  ---

  ### Salvaging Teleosemantics: Required Modifications  
  The heart analogy fails to capture cognitive plasticity, but teleosemantics can be revised:  
  1. **Layered Proper Functions:** Distinguish:  
     - *Distal Function:* Evolutionary origin (e.g., face detection).  
     - *Proximal Function:* Developmentally acquired role (e.g., expert bird recognition).  
     Content could be fixed by the *most recent* stabilising history (e.g., learning).  
  2. **Type vs. Token Teleosemantics:** Type-level functions (evolutionary) ground baseline content, while token-level functions (developmental) specify context-dependent content.  
  3. **Procedural Memory Integration:** Treat neural reuse as a selection process at the ontogenetic timescale. Content is fixed by *reinforcement history* (e.g., predictive coding optimizations).  

  ---

  ### A Better Analogy: Developmental Systems  
  Replace the heart with **regulatory gene networks** in evolutionary-developmental biology:  
  - **Organ Analog:** *Hox* gene cluster (directs body segmentation).  
  - **Functional Plasticity:** Same genes repurposed across species (e.g., antenna-to-leg transformations in flies).  
  - **Norms:** Function is context-dependent (signaling environment) but historically constrained (phylogenetic inertia).  
  - **Advantage:** Captures multi-level selection (evolutionary + developmental) and context-relativity while preserving etiological norms.  

  ---

  ### Verdict:  
  **Collapses as a direct mapping, but survives with substantial modifications to include developmental history, layered functions, and proximal/distal normativity.** The heart analogy implicitly smuggles in functional singularity and context-invariance, but a revised teleosemantics—integrating neural reuse as a selection process—can retain determinacy by expanding "proper function" to include ontogenetic stabilization.
