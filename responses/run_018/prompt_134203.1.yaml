answer: |-
  **BUREAU OF RADICAL INTERPRETATION (BRI)**  
  **FIELD OPERATIONS DIVISION**  
  **DECLASSIFIED MANUAL: FD/PROT/84-7**  
  **PROCEDURES FOR PRIMARY LINGUISTIC ENGAGEMENT (PLE) UNDER CONDITIONS OF ABSOLUTE EPISTEMIC NULLITY**  
  **EFFECTIVE: 01 JAN 1984 // DECLASSIFIED: [REDACTED]**  

  **1. PURPOSE AND SCOPE**
      1.1. This manual establishes mandatory procedures for Field Agents (FAs) assigned to interpret utterances and belief-systems of encountered entities (henceforth "Speakers") exhibiting zero prior shared lexical, syntactic, or conceptual overlap with known human languages or belief frameworks.
      1.2. Application is restricted to first-contact scenarios meeting Epistemic Nullity Condition 7-A (verified absence of shared vocabulary, grammar, cultural artifact recognition, or gesture lexicon exceeding 0.5% mutual predictability).
      1.3. Interpretation *must* proceed according to Davidsonian Radical Interpretation (DRI) axioms, overruling all previous linguistic, anthropological, or intuitive methodologies. Deviation constitutes a Protocol Violation (PV-4).

  **2. PRE-ENGAGEMENT: TRIANGULATION MANDATE**
      2.1. **Triangulation Equipment Requisition (TER Form 84-7A)**
          2.1.1. Prior to any utterance interpretation or mental state attribution, FA *must* establish a physical Triangulation Array.
          2.1.2. Submit TER Form 84-7A (Quadruplicate) detailing:
              *   FA Positional Coordinates (GPS Grid Ref. Secured).
              *   Speaker Positional Coordinates (Estimated, confirmed via visual/auditory contact).
              *   Shared Environmental Focal Point (SEFP): A single, unambiguous object/phenomenon mutually observable by FA and Speaker (e.g., rock, cloud formation, falling leaf). SEFP must be inert or naturally occurring; manufactured objects require Level 4 clearance.
          2.1.3. Interpretation activities are *strictly prohibited* until TER Form 84-7A receives approval stamp from Central Linguistics Compliance Office (CLCO). Verbal authorization is invalid.

  **3. INITIAL UTTERANCE PROCESSING: CHARITY PRIMACY**
      3.1. **Principle of Charity Enforcement (PCE)**
          3.1.1. Upon observing Speaker utterance (U1) directed towards SEFP (S1), FA *must initially assume* U1 expresses a True, Rational Belief about S1 congruent with FA's own belief regarding S1. (e.g., If S1 is a rock, assume U1 means "That is a rock" or "Rocks exist").
          3.1.2. **Charity Adjustment Ledger (CAL Form 84-7B)**
              3.1.2.1. If subsequent observations conflict with 3.1.1 (e.g., Speaker repeatedly gestures negation towards S1 while uttering U1), FA *must not* immediately attribute irrationality or false belief to Speaker.
              3.1.2.2. FA *must* log proposed belief-attribution revision on CAL Form 84-7B. Revisions *must* prioritize preserving Speaker rationality and truthfulness by *adjusting the FA's own web of belief*.
                  *   Example: If Speaker seems to deny S1 (rock) is a rock, FA may propose revising own belief: "Perhaps 'rock' is not the correct ontological category. Log revision: Re-categorize S1 under provisional designation 'non-sentient mineral aggregate type gamma'."
              3.1.2.3. Each CAL entry requires justification linking revision to preservation of Speaker's overall rationality. Failure to submit CAL revisions constitutes PV-5 (Dogmatic Intransigence).

  **4. BELIEF ATTRIBUTION: HOLISTIC INTEGRITY**
      4.1. **Holism Check (HC Protocol)**
          4.1.1. Attribution of *any* single belief (B1) to the Speaker is categorically forbidden until a Provisional Global Belief Web (PGBW) is constructed.
          4.1.2. PGBW construction requires:
              *   Minimum 200 distinct, contextually varied utterances (U1-U200) correlated with SEFPs (S1-S200).
              *   Demonstrated internal logical consistency (≥ 95% coherence rating) across all proposed belief attributions derived from U1-U200/S1-S200 interactions.
              *   Mapping of inferred desire-structure demonstrating rational action given proposed beliefs.
          4.1.3. FA *must* file HC Compliance Report (HCCR Form 84-7C) detailing PGBW structure and coherence rating before attributing *any* specific belief (including those provisionally assumed under PCE). Interim reports referencing isolated beliefs are rejected.

  **5. TRANSLATION AND ONTOLOGICAL MAPPING: SCHEME NEUTRALITY**
      5.1. **Rejection of Alternative Conceptual Schemes (RACS Directive)**
          5.1.1. FAs *must* operate under the axiom that no genuinely alternative conceptual scheme exists. Apparent differences *must* be resolved via CAL adjustments (Sec 3.1.2) and PGBW refinement (Sec 4.1.2), never by positing fundamentally incommensurable worldviews.
          5.1.2. **Indeterminacy Filing System (IFS Procedure)**
              5.1.2.1. Where multiple, logically incompatible translations (T1, T2...Tn) equally satisfy PCE and PGBW coherence for a given utterance cluster, this is *not* an error.
              5.1.2.2. FA *must* file an IFS Report (IFSR Form 84-7D) certifying T1, T2...Tn as "Bureau-Approved Equivalents."
              5.1.2.3. Speaker is automatically assessed an Ambiguity Processing Fee (APF) via Form 84-7D/APF for each certified equivalent translation exceeding one (1) per utterance cluster. Fee schedule based on utterance complexity (see Annex Delta).

  **6. REPORTING AND VERIFICATION**
      6.1. Final Interpretation Dossier (FID) *must* include:
          6.1.1. Approved TER Form 84-7A.
          6.1.2. Complete CAL Form 84-7B documenting all FA belief revisions.
          6.1.3. Approved HCCR Form 84-7C confirming PGBW.
          6.1.4. All relevant IFSR Forms 84-7D (+ APF assessment confirmations).
          6.1.5. A single, coherent translation manual derived from the PGBW, explicitly noting where IFS certifications apply.
      6.2. Verification: CLCO will audit FID for strict adherence to Triangulation, Charity Maximization (via CAL), Holistic Completeness (via HCCR), and Scheme Neutrality (via IFSR/APF). Technical success of communication is secondary to procedural compliance.

  **7. NON-COMPLIANCE**
      7.1. Failure to adhere strictly to TER, CAL, HC, or IFS/APF procedures constitutes Protocol Violation (PV-4, PV-5, PV-6, PV-7 respectively).
      7.2. Penalties range from mandatory re-training (PV-4/PV-5) to suspension of Interpretation Clearance (PV-6) and, for persistent IFS/APF non-billing (PV-7), potential reassignment to Latrine Ontology Verification detail.

  **ANNEX DELTA: AMBIGUITY PROCESSING FEE (APF) SCHEDULE**  
  *(See separate classified schedule FD/PROT/84-7-DELTA)*

  ---
  **END DOCUMENT**
