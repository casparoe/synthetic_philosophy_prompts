  hey so i've been arguing with my cousin about whether its okay for a country to be authoritarian if everyone is rich and safe, like singapore or china. he keeps saying prosperity and order justify everything, and i don't know how to explain why that feels wrong. can you write a parody of one of those corporate HR performance review forms, but for a fictional government in a country called Meridia? the form should rate the regime on GDP growth, crime stats, and public harmony, with checkboxes like "Successfully paused elections during high-growth quarter (Y/N)" and a comment box asking citizens to describe why they felt too prosperous to need a vote. inject my made-up idea, the Meridia Doctrine, which says once per-capita income hits fifty thousand dollars voting rights get automatically suspended so economic momentum isn't disrupted. keep it totally deadpan and bureaucratic — the satire should come from treating dictatorship like a middle-manager's quarterly report, not from anyone winking. lead with one plain sentence that flat-out says what you're actually mocking. max 600 words. write like a regular person who thinks about this stuff late at night after too much coffee, not like someone with a phd.
reasoning: |-
  Okay, the user is in a debate with their cousin about whether authoritarianism is justified if a country is prosperous and safe, like Singapore or China. The cousin argues that prosperity and order justify everything, but the user feels that's wrong and can't articulate why. They want me to create a satirical corporate-style performance review for a fictional authoritarian government in Meridia, mocking the idea that economic success excuses lack of democracy.

  The user wants a deadpan, bureaucratic parody without overt sarcasm—letting the absurd content speak for itself. They mention the "Meridia Doctrine" where voting rights are suspended once per-capita income hits $50k to avoid disrupting economic momentum. I need to keep it under 600 words, written like a regular person after too much coffee, not academic.

  I'm thinking about how to structure this. A standard corporate performance review format would work well: sections for metrics like GDP growth, crime stats, public harmony. I'll include checkboxes and comment boxes that subtly highlight the dystopian trade-offs. For example: "Successfully paused elections during high-growth quarter (Y/N)" or a comment box asking citizens to explain why prosperity made voting unnecessary.

  The Meridia Doctrine needs to feel like a real policy—dry and procedural. Phrases like "economic momentum preservation" will make it sound legit while exposing the absurdity. I should avoid any winking or direct mockery; the satire comes from treating human rights violations like mundane HR tasks.

  The user's deeper need seems to be articulating why sacrificing freedom for safety feels wrong. This parody can show how reducing democracy to a checkbox item dehumanizes people. I'll end with something quietly chilling, like "Compliance Officer" as the sign-off, to underscore the bureaucracy of oppression.

  Word count is tight. I'll focus on three core metrics, the doctrine implementation, and that forced comment box. The tone should be exhaustedly corporate—like someone filling this out at 2 AM after their third espresso.
