prompt: |-
  I'm in a philosophy of mind programme and we've been going through Parfit's teletransporter stuff for weeks. There's this thing I keep seeing in seminar that I don't know if it has a name, and it's definately not just plain equivocation. Basically, people are mostly okay with branching: if my brain gets copied into two seperate bodies, I survive as both, because psychological continuity is what matters, not being one specific physical person. But then I ask about the reverse — two people whose minds get gradualy merged into one body over time, so the result has memories and traits from both. Suddenly everyone gets strict and says neither original person survives; it's just a brand new individual. But both cases break the one-to-one link between original mind and future body. In one case you get two survivors, in the other apparently zero. Is there an established concept for this asymmetry — accepting fission but rejecting fusion — or is it just an inconsistency people don't notice? How does it relate to Parfit's claim that identity isn't what matters, since in fusion it seems like people suddenly care about being exactly one specific person? I don't want citations or a reading list, just whether there's a term for this specific mismatch, and if not, how you'd define it so it's not just motte-and-bailey with identity talk.
reasoning: |-
  Okay, the user is in a philosophy of mind program and has been discussing Parfit's teletransporter thought experiments. They've noticed an asymmetry in how people handle fission versus fusion cases. In fission, where one person splits into two, most accept both as surviving. But in fusion, where two merge into one, they say neither survives. The user is asking if there's a term for this asymmetry and why it happens. 

  First, I need to recall Parfit's views. He argues that personal identity isn't what matters; psychological continuity is. In fission, both resulting persons have psychological continuity with the original, so survival isn't lost. But in fusion, when two minds merge, neither maintains unique psychological continuity. The merged person has continuity with both, but neither original's continuity is preserved exclusively. 

  The user is pointing out what seems like a contradiction: fission allows two survivors, but fusion yields none. But according to Parfit, it's consistent because survival depends on the degree of psychological continuity. Fusion doesn't preserve the unique identity of either, so neither survives as the same person. 

  The user also wonders if this is a motte-and-bailey fallacy, where people retreat to strict identity when convenient. But Parfit's approach avoids that by rejecting identity as the criterion. Instead, it's about the relations that matter for survival. 

  The asymmetry doesn't have a specific name. It's a consequence of how psychological continuity works. Fission satisfies the relation (R) that matters, even without identity, while fusion doesn't preserve R for either original. 

  The user might be frustrated with the inconsistency in seminar discussions. They need a clear explanation of why the cases are treated differently without invoking identity. Emphasizing that what matters isn't identity but the presence of non-branching psychological continuity could help. Also, highlighting that fusion lacks the unique continuity needed for either original to survive. 

  I should make sure to address their core concern: the asymmetry isn't hypocrisy but a feature of the psychological continuity theory. They might also be seeking validation that their observation is valid, which it is, and that the asymmetry is a recognized issue in the literature, even without a specific term.
answer: |-
  You've hit on a genuinely important and recognized tension in personal identity theory, particularly within psychological continuity frameworks like Parfit's. While there isn't a single, universally agreed-upon *name* for this specific asymmetry (like "The Fission-Fusion Asymmetry" or "Branching Bias"), it's a well-discussed phenomenon. Here's how to understand it without appealing to inconsistency or motte-and-bailey:

  1.  **The Core Principle: "Relation R" and What Matters:** Parfit argues that what matters for survival isn't strict identity (*being* the same person), but holding a specific relation he calls "Relation R" (psychological connectedness and/or continuity with any cause). Identity matters only because it *usually* guarantees a unique, non-branching instance of R holding.

  2.  **Fission Explained (Why Two Survivors?):**
      *   In fission (branching), Relation R holds *robustly* between the original and *each* resulting person. Both offspring have strong psychological connectedness and continuity to the original.
      *   Identity *fails* because R branches. But Parfit's point is that *since R holds robustly to both*, what matters for survival *is* secured for the original person – they survive *as* both successors. The failure of identity is irrelevant to survival value; what matters (R) is preserved, just spread.

  3.  **Fusion Explained (Why Zero Survivors?):**
      *   In gradual fusion, the *unique, non-branching* psychological continuity from *each* original person to the fusion product is **disrupted and blended**.
      *   The fusion product has psychological connectedness/continuity to *both* originals, but this continuity is **not exclusive or complete** for *either*. It's a *new* psychological profile built from fragments of both.
      *   Crucially, Relation R **fails to hold in a way that preserves the *unique stream* of either original.** The connections become diluted and interdependent. Neither original can claim the fusion product as the *non-branching continuation* of *their specific* mental life.
      *   Therefore, *what matters* (Relation R holding uniquely and robustly for *each* original) is *not* preserved for either. Identity also fails, but more importantly, the *survival relation* (R) fails.

  **Why it's (arguably) not an inconsistency:**

  *   **The Asymmetry Lies in R, Not Identity:** The difference isn't about suddenly caring about identity in fusion. It's about the *structure of Relation R*.
      *   Fission: R holds robustly *to multiple points* (survival value secured, identity lost).
      *   Fusion: R holds *neither robustly nor uniquely* for *either* original point to the fusion product (survival value *lost*, identity lost).
  *   **Non-Branching Continuity is Key:** The psychological continuity theory inherently values a *unique, non-branching* causal chain of mental states as the paradigm for survival. Fission breaks uniqueness but preserves robust chains. Fusion breaks the *integrity and uniqueness* of *each* original chain. The fusion product isn't the *continuation* of either stream; it's a *new stream* fed by two tributaries.
  *   **Parfit's Stance:** Parfit explicitly argues that fusion *is* death for the originals precisely because what matters (sufficiently robust and non-branching R) isn't preserved. He sees this as consistent: survival requires R holding without *later* branching (like in fission), but it *also* requires R holding without *prior* "merging" in a way that destroys the distinctness of the original stream. Fusion represents a *failure* of R to connect the originals to the result in the right way.

  **How to Define the Asymmetry Clearly:**

  You could articulate the underlying principle causing the differing intuitions like this:

  > **The Asymmetrical Requirement for Non-Branching Continuity:**
  > Psychological continuity theories hold that survival requires Relation R (psychological connectedness/continuity) holding in a *non-branching* manner *from the original's perspective forward in time*. Fission violates non-branching *after* the split but preserves robust R *to* the successors. Fusion violates non-branching *before* the merge (from the originals' perspectives) by creating a successor whose psychological continuity is fundamentally *derived* and *blended* from two sources, failing to provide a unique, robust continuation of R for *either* original stream.

  **Why it feels like "suddenly caring about identity":**

  *   When R fails uniquely in fission, we accept multiple survivors *because R holds robustly*. When R fails uniquely in fusion, we have *no robust R holding for either original*, so we say neither survives. This *looks* like suddenly demanding uniqueness (a property of identity) in the fusion case, but proponents argue it's a demand inherent in the *structure of Relation R* itself for survival – it needs a unique *pathway* from past to future, even if that pathway can sometimes split later. Fusion destroys the unique pathway *from* the past *to* the future for each original.

  **In short:** The asymmetry stems from the core commitment of psychological continuity theories that survival requires a sufficiently robust, unique, non-branching psychological connection *from the original person forward*. Fission preserves this connection *to* the successors (just multiplied), while fusion severs the unique, robust connection *from* each original *to* the single successor. The result feels asymmetric (2 vs 0 survivors), but the underlying principle (the survival condition based on R) is applied consistently *within the theory's framework*. Whether that framework itself is ultimately satisfactory is, of course, part of the ongoing debate you're experiencing!
