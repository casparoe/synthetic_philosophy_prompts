  ---

  ### **Position Definitions & Key Distinctions**  
  - **Strong universalism**: One objective morality; deviations are noise/error (e.g., ignorance).  
  - **Weak universalism**: Core universal truths, but cultural variations are non-moral "noise" (e.g., applied principles).  
    - *Vs. contextualism*: Weak universalism denies framework-indexing; contextualism requires it.  
  - **Relativism**: Moral truth is culture-dependent (e.g., "right" varies by society).  
  - **Error theory**: All moral claims are false (no objective facts to track).  
  - **Contextualist objectivism**: Truths are objective *within a framework* (e.g., a culture’s norms).  
    - *Vs. relativism*: Contextualism retains objectivity *inside* frameworks; relativism denies objectivity entirely.  
    - *Vs. weak universalism*: Contextualism indexes truth to frameworks; weak universalism has one trans-contextual core.  

  ---

  ### **Diagnosis of Empty Combos**  
  1. **Q1=A, Q3=B, Q4=B**: Incoherent. If differences are "noise" (Q1=A) and dumbfounding tracks truth (Q3=B), universalism *must* absorb the weird case (Q4=A).  
  2. **Q1=A, Q3=C, Q4=B**: Incoherent. Conditioning (Q3=C) + noise (Q1=A) implies non-universal elements, but rejecting absorption (Q4=B) contradicts Q1’s universal core.  
  3. **Q1=B, Q2=B, Q3=B, Q4=B**: Incoherent. Hidden knowledge (Q3=B) implies objectivity, but Q2/B+Q4/B deny truth-tracking.  
  4. **Q1=A, Q4=B**: Incoherent. Noise (Q1=A) implies universality, but Q4=B rejects it.  

  ---

  ### **How to Use**  
  1. Participants answer Q1–Q4.  
  2. Use the table to map their combo to a position (e.g., **A,B,C,B** → **relativism**).  
  3. Discuss why certain combos are empty (e.g., "If moral dumbfounding reveals error theory, how can other answers support objectivity?").  

  This model avoids proper names and citations, focusing on logical space. The "weird case" tests if universalism can handle radical differences without collapsing. Contextualist objectivism emerges when truth is framework-specific (e.g., the ancestor promise *is* wrong *in that context*), differing from weak universalism (one core) and relativism (no objectivity).
