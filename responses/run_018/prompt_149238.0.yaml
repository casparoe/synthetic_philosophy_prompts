answer: |-
  Below is a decision-tree quiz designed for your philosophy seminar, structured around concrete divergence questions. The quiz maps answers onto five philosophical positions regarding moral objectivity. Respondents answer in British English without needing prior knowledge of philosophical labels. Each combination of answers leads to one of the following leaves: **strong universalism**, **weak universalism**, **relativism**, **error theory**, or **contextualist objectivism**. Empty combinations are diagnosed as incoherent.

  ---

  ### **Quiz: Moral Objectivity and Cross-Cultural Differences**  
  *Answer each question with A or B (or A, B, C for Q3). Use British English spellings (e.g., "prioritise," "cultural").*

  1. **Loyalty vs. Harm Trade-offs**:  
     Cross-cultural differences in loyalty-vs-harm dilemmas (e.g., sacrificing family loyalty to prevent harm) are best explained as:  
     - **A**) Noise around a universal core (e.g., due to information gaps or biases).  
     - **B**) Genuinely different moral weights (e.g., loyalty prioritised over harm in some cultures).  

  2. **Purity-Based Condemnations**:  
     Purity-based moral judgements in non-WEIRD groups (e.g., condemning "impure" acts like eating taboo foods) track:  
     - **A**) Real moral wrongness (e.g., objective violations of sacredness).  
     - **B**) Culturally shaped disgust (e.g., learned aversions without moral truth).  

  3. **Moral Dumbfounding**:  
     When people exhibit "moral dumbfounding" (e.g., condemning harmless consensual incest without justification), this favours:  
     - **A**) Error theory (moral judgements are systematically mistaken).  
     - **B**) Hidden objective knowledge (intuitions track truth we can’t articulate).  
     - **C**) Pure conditioning (social learning without objective basis).  

  4. **The "Weird Case"**:  
     Imagine a society that consistently ranks *breaking a promise to a dead ancestor* above *letting a starving child take food*. Can any universalist framework absorb this?  
     - **A**) Yes (e.g., universalism explains it via context-specific beliefs).  
     - **B**) No (this forces contextualism/relativism).  

  ---

  ### **Decision Tree & Position Mapping**  
  Based on your answers, you are assigned **one position**. Empty combinations are marked as **incoherent** (self-contradictory) or **unattractive** (theoretically unstable).  

  | Q1 | Q2 | Q3 | Q4 | Position                  | Notes                                                                 |
  |----|----|----|----|---------------------------|-----------------------------------------------------------------------|
  | A  | A  | B  | A  | **Strong universalism**   | Differences are noise; purity/dumbfounding track truth; weird case absorbed. |
  | A  | A  | B  | B  | *Empty (incoherent)*      | Q4=B contradicts Q1/A+Q3/B (universalism cannot absorb what it deems noise). |
  | A  | A  | C  | A  | **Weak universalism**     | Dumbfounding as conditioning weakens universality; weird case absorbed. |
  | A  | A  | C  | B  | *Empty (incoherent)*      | Q4=B contradicts Q1/A (noise) + Q3/C (conditioning ≠ universality).    |
