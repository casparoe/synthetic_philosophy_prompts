prompt: |-
  I'm working through a framework for what it means for an AI system to "avoid side effects," and I've encountered a recurring stall that I see replayed across alignment discussions. One camp—call them the formalists—argues that low-impact behavior can be defined structurally, without prior commitment to human values. Their proposal is to measure the Kolmogorov complexity of the divergence between the actual world trajectory and a counterfactual trajectory in which the agent never activated, restricted strictly to variables not mentioned in its explicit reward specification. They treat this divergence as tracking "unexpected" physical change, claiming that selecting the baseline and the variable set is a purely causal or information-theoretic task. The opposing camp—call them the value-dependence theorists—objects that deciding which variables belong in that divergence measure, determining what counts as "unexpected" versus intended, and even constructing the counterfactual baseline all require normative judgments about which states of the world are worth preserving. Both sides invoke the same canonical examples—the paperclip maximizer, the cleaning robot that displaces a vase—agree that unintended consequences are undesirable, and share the same formal vocabulary of state spaces and reward functions. Yet over years of exchange, neither position has shifted.

  My working hypothesis is that the disagreement is not primarily about whether values enter at all, but about two incompatible conceptions of agency: whether an agent's action should be individuated relative to an observer-independent causal baseline, or relative to a normatively loaded description of the environment that already distinguishes relevant from irrelevant change. Still, I am unsure whether this captures the real structure of the impasse. It could instead be a hidden empirical dispute about computability and baseline selection, a verbal confusion over the word "side effect," or a case of bedrock intuitions about naturalness that neither side can argue for.

  Can you diagnose what kind of disagreement this actually is? I want an analysis that engages the specific commitments—the divergence-measure proposal versus the baseline-selection objection—rather than a generic taxonomy of philosophical disputes. Do the sides differ about facts, about what counts as a valid formalization, about standards of evidence, or about starting intuitions? Is there a hidden formal or conceptual question—perhaps about the observer-relativity of baselines or the individuation of actions—doing the work? And given your diagnosis, what would count as progress: a precise conceptual distinction, a theorem about baseline invariance, a reframing of the agent's task, or an argument that the question is ill-posed and should not be expected to resolve?

  Please structure your response in the following sections, with approximate lengths:
  - The positions in concrete detail (about 150 words): lay out what the formalists and the value-dependence theorists actually claim, including the specific role of the counterfactual divergence measure.
  - Diagnosis of the stall (about 250 words): your judgment on what kind of disagreement this is—verbal, substantive, about standards, bedrock intuitions, hidden empirical, or different questions under one name—with reasons tied to the specific claims.
  - The hidden structure (about 200 words): whether an underlying issue—such as observer-relativity, action individuation, or the presuppositions of counterfactual reasoning—explains why the debate has not moved.
  - Prospects for progress (about 150 words): what distinction, result, or reframing could resolve or dissolve the impasse, or a reasoned argument that no progress should be expected and why.
reasoning: |-
  We are given a specific dispute in AI alignment about avoiding side effects. The formalists propose a structural definition using Kolmogorov complexity of divergence in a counterfactual world, restricted to variables not in the reward specification. The value-dependence theorists argue that selecting the variables and the baseline requires normative judgments. Both sides agree on examples and formal vocabulary but have not moved for years. We are to diagnose the nature of the disagreement and suggest prospects for progress.

  Let's break down the response as per the requested structure.

  ### The positions in concrete detail (about 150 words)

  The formalists propose that an AI system avoids side effects by minimizing the Kolmogorov complexity of the divergence between the actual world trajectory and a counterfactual trajectory in which the agent was never activated. This divergence is computed only over state variables that are not explicitly mentioned in the reward function. They argue that this measure captures "unexpected" changes without requiring human values, because the baseline (agent never activated) and the variable set (non-reward variables) are determined by the agent's specification and the causal structure of the environment. Thus, the approach is structural and value-free.

  The value-dependence theorists counter that the selection of the baseline and the set of variables inherently involves normative judgments. Deciding which variables to exclude (or include) in the divergence measure, what counts as a relevant change, and how to set the counterfactual baseline (e.g., what "never activated" means in a dynamic world) all depend on human values about what is important to preserve. Without these judgments, the formal measure is either underspecified or implicitly encodes values.

  ### Diagnosis of the stall (about 250 words)

  The disagreement is primarily a substantive one about the presuppositions of formalization, but it is also reinforced by bedrock intuitions about naturalness and normativity. The formalists believe that the baseline (agent not acting) and the variable set (non-reward variables) can be objectively defined by causal structure and information theory, without normative input. They hold that Kolmogorov complexity provides an objective measure of "unexpectedness" because it is independent of human interpretation. The value-dependence theorists, however, see the formalist proposal as smuggling in values through the back door: the choice of which variables to include in the state space and the interpretation of "never activated" are value-laden. For example, the counterfactual baseline might require specifying the exact time and manner of non-activation, which could have ripple effects that are arbitrarily labeled as side effects or not.

  The stall occurs because both sides are talking past each other on the issue of observer-relativity. The formalists are committed to the idea that an agent's action can be individuated relative to a causal baseline that is observer-independent, while the value-dependence theorists insist that any baseline and variable selection is relative to an observer's interests and values. This is not a verbal dispute because both sides use the same terms (like "side effect") but with different implicit definitions. It is also not a hidden empirical dispute because the issue is not about computability (though that might be a practical concern) but about what the formalization is supposed to represent. The core is a clash of intuitions: one side sees the world as having a natural causal structure that can be formally captured without values, and the other sees the very act of formalization as value-laden.

  ### The hidden structure (about 200 words)

  The underlying issue is observer-relativity in the individuation of actions and states. The formalist approach relies on the assumption that there is an objective way to describe the world's state and the agent's action, so that the counterfactual baseline and the divergence measure are fixed by the causal structure. However, the value-dependence theorists point out that the state variables must be chosen by an observer, and the counterfactual baseline (e.g., "the agent never activated") is not uniquely defined without specifying what counts as the agent's activation and what the world would have been like in its absence. This specification is inherently normative because it depends on what the observer considers the default or desirable state.

  Moreover, the Kolmogorov complexity measure itself depends on the language used to describe the state, which is not given by nature but chosen by the designer. Thus, the hidden structure of the debate is about the presuppositions of counterfactual reasoning: whether we can have a "view from nowhere" for the baseline and state description, or whether such reasoning is always relative to an agent's (or designer's) perspective and values. This explains the stalemate: without a resolution of this metaphysical issue, both sides are anchored in their starting intuitions.

  ### Prospects for progress (about 150 words)

  Progress might come from a reframing that explicitly acknowledges the observer-relativity and seeks to make the value commitments transparent. One path is to demonstrate that the formalist measure, when fully specified, always requires choices that reflect values, perhaps through a theorem showing that the baseline and variable set are underdetermined without normative input. Alternatively, a conceptual distinction between "internal" and "external" perspectives on agency might help: the agent could be designed to learn a baseline and variable set from human feedback, thus making the value-dependence explicit but manageable. This would shift the debate to how to incorporate human values in the formalization rather than denying their role.

  However, if the dispute is about bedrock intuitions, then no argument may resolve it. Instead, the field might progress by adopting a pragmatic stance: use the formal measure as a tool but recognize its limitations and supplement it with value-alignment techniques. A formal result about the inevitability of value-laden choices in baseline selection could also force a shift in the formalist position.
answer: |-
  ### The positions in concrete detail
  Formalists propose that side effects can be structurally defined by measuring the **Kolmogorov complexity** of the divergence between two world trajectories: (1) the actual trajectory where the agent acts, and (2) a counterfactual trajectory where the agent is never activated. Crucially, divergence is computed *only* over state variables **not referenced in the agent’s reward function** (e.g., a paperclip AI ignores all non-paperclip variables). They claim this quantifies "unexpected change" objectively—selecting the baseline (inaction) and variable set is a causal, information-theoretic task requiring no human values. Value-dependence theorists object that **all three components—baseline construction, variable selection, and divergence interpretation—embed normative judgments**. Choosing which variables to exclude assumes knowledge of what humans deem "relevant" (e.g., is vase position irrelevant to a cleaner bot’s reward?). Similarly, defining the counterfactual baseline (e.g., "no activation" in a dynamic world) requires specifying which undisturbed state is "natural" or desirable. Both agree on examples (e.g., displaced vases are bad) but clash on whether formal tools can bypass values.

  ### Diagnosis of the stall
  This is a **substantive disagreement about the presuppositions of formalization**, masquerading as a verbal dispute over "objectivity." Formalists treat the baseline and variable set as **observer-independent features** of causality: the counterfactual is uniquely determined by physical laws, and variables are "reward-irrelevant" by definition. Value-dependence theorists see these choices as **observer-relative**: baseline selection involves privileging one state (e.g., a pre-agent "status quo") as default, while variable selection relies on distinctions between "intended" and "side effect" that presuppose human interests. The stalemate arises because formalists appeal to **causal simplicity** (Kolmogorov complexity is "objective") while value-dependence theorists appeal to **epistemic dependence** (simplicity requires a descriptive language, which is value-laden). Crucially, both sides accept the *same formalism* but disagree on whether it **escapes normativity**: formalists see values as downstream of structure; value-dependence theorists see structure as downstream of values. This isn’t verbal (terms are shared), empirical (computability is secondary), or about evidence (both cite the same examples)—it’s about **whether agency can be formalized without teleology**.

  ### The hidden structure
  The core issue is **observer-relativity in action individuation**. Formalists implicitly assume actions are individuated by **causal boundaries** (the agent’s "activation" is a discrete event with a clear physical signature), enabling a value-free baseline. Value-dependence theorists note that actions are individuated by **intentional descriptions** (e.g., "cleaning" vs. "moving a vase"), which depend on goals only humans assign. This collapses into a deeper dispute about **counterfactual presuppositions**:  
  - Formalists treat the baseline as a **natural zero-point** (e.g., "no agent" as physically unambiguous), ignoring that *which* "no agent" state matters (e.g., a room pre-agent vs. a hypothetical static state) requires normative privileging.  
  - Value-dependence theorists argue that **divergence metrics require salience frameworks**—Kolmogorov complexity doesn’t resolve *which* description of the state space is "natural" (e.g., vase position as "x,y coordinates" vs. "aesthetic arrangement").  
  The impasse persists because formalists view normativity as *external* to causal models, while value-dependence theorists see it as *constitutive* of modeling agency. Action individuation is the unacknowledged fulcrum: if actions are physical events, baselines seem objective; if they are teleological, values are inescapable.

  ### Prospects for progress
  A **theorem demonstrating baseline variance under descriptional invariance** could force movement: prove that for any physical system, Kolmogorov complexity of divergence changes non-trivially under **equivalent redescriptions** of the state space or baseline (e.g., recoding "vase position" as "potential clutter" alters "unexpectedness" without changing physics). This would formalize the value-dependence theorists’ claim that **structural measures are language-relative**, compelling formalists to either accept normativity or seek invariant encodings (which may not exist). Alternatively, **reframing agency as inference over human models** dissolves the dispute: agents could minimize divergence *relative to learned human priors* (e.g., inferred baseline distributions from feedback), making values explicit but tractable. Absent this, the debate is unresolvable—it hinges on **irreconcilable intuitions about naturalness**. Progress then lies in *bypassing* the dichotomy: use formalism pragmatically (e.g., as a regularizer) while auditing its implicit biases, or shift focus to participatory design (humans define baselines/variables iteratively). The question isn’t ill-posed, but its answer may be pluralistic.
