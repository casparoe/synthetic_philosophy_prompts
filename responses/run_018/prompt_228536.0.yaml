prompt: |-
  I've been thinking about killing vs. letting die and I want to know what principle, if any, is underneath my gut reactions. For background, I keep coming back to the bit in Aquinas's Summa Theologiae (II-II, q.64, a.7) where he defends lethal self-defense by saying, in effect, that one act can have two effects and what matters morally is the effect you intend, not the one you merely foresee as a side effect. Feel free to lean on that or tell me it can't do the job.

  My verdicts:
  - Bystander trolley: divert the runaway car onto a siding, killing one worker to save five -- permissible.
  - Transplant: surgeon kills one healthy patient to harvest organs for five -- clearly not permissible, even though the arithmetic is identical.
  - I skip a $200 donation to an effective charity and spend it on a ski weekend instead -- a bit shabby of me, but nowhere near murder, and I don't think I'm obligated to donate.
  - Drowning toddler in a shallow pond, I'm the only one around, rescue costs me wet shoes: not rescuing is monstrous, close to as bad as holding the kid under. I realise this sits badly with the donation verdict.
  - A doctor unplugs a ventilator at a competent patient's insistent request -- permissible; the same doctor giving the same patient a lethal injection, same request, same outcome -- not permissible (or at least much worse).
  - I notice a coworker about to drink from a water bottle I know someone else poisoned, and I just say nothing -- that feels like killing, not letting die, even though I did literally nothing.

  What I want, in this order: The principle (about a paragraph -- one principle, stated precisely, or tell me no single principle survives and give me the best candidate anyway). Case by case (roughly half a page -- how it rules on each of my six, flagging any case where it needs an extra clause and why that clause isn't just ad hoc). The verdict I'd have to drop (a short paragraph -- if the principle can't get all six, say which one goes and talk me into it). And a stress test (a few sentences -- give me one new case my principle and Aquinas's intended/foreseen idea disagree on, so I can see which one I actually believe).
reasoning: |-
  Okay, let me try to unpack this user's query. They're grappling with the moral distinction between killing and letting die, referencing Aquinas's principle of double effect. Their six verdicts show clear intuitions: diverting a trolley is okay, but killing for organs isn't; not donating isn't murder, but ignoring a drowning child is monstrous; passive euthanasia is permissible, active isn't; and knowingly allowing poisoning feels like killing. 

  Hmm, the challenge is finding a unified principle that explains all these judgments without contradictions. The drowning child vs. charity donation tension is particularly tricky – why is one a grave duty and the other not? And that poisoning-by-omission case blurs the line between action and inaction. 

  I recall Philippa Foot's material contribution framework might help here. It distinguishes cases where you introduce new harm (like transplant surgeon) from redirecting existing threats (trolley), and imposes stronger duties when you're uniquely positioned to prevent imminent harm (drowning child). But does it handle euthanasia? Unplugging a ventilator stops artificial intervention, while injection adds new cause – that aligns. 

  Wait, what about that poisoning case? By Foot's standard, not warning creates a new threat because the poison wouldn't harm without your hidden knowledge. That makes it materially equivalent to killing. Smart user for including that – it tests whether knowledge/special responsibility matters. 

  For stress testing, consider the "loose cannonball" scenario: if you see one about to roll off a table toward a worker, stopping it would cost you a broken finger. Foot would say you must intervene (unique position, minor cost) while Aquinas might call it merely foreseen harm if you don't act. Bet the user would side with Foot – that inaction feels murderous. 

  The only verdict that might need adjusting is the charity case. Foot's principle doesn't make donating obligatory unless it's life-or-death with no other rescuers, which explains why it feels different from the pond scenario. User seems ready to accept that distinction though – they already called skipping donation "shabby but not murder." 

  ...Better double-check if Aquinas' intended/foreseen distinction holds up. In the poisoning case, if you "merely foresee" the death but don't intend it, why does it still feel like killing? Yeah, the material contribution angle explains that better. User's instincts are more modern than medieval here.
answer: |-
  Here's a unified principle grounded in your intuitions and Aquinas's insight, refined to handle your cases:

  **The Principle:**
  An agent is morally prohibited from *intentionally causing harm* or *materially contributing to a new lethal threat*, even for a good end. However, allowing a pre-existing lethal threat to take its course, or redirecting an existing threat to minimize overall harm, can be permissible if the harm suffered is *not intended* but only *foreseen*, and the action itself is otherwise permissible. The duty to prevent harm generated by an *independent* threat is significant but not absolute; its stringency depends on the agent's unique capacity to prevent it and the cost incurred. Intending death itself is always forbidden as a means or end.

  **Case-by-Case Application:**

  1.  **Bystander Trolley (Permissible):** Redirecting the trolley *redirects an existing threat*. You *foresee* but do not *intend* the one worker's death; you intend to save five by changing the threat's path. No *new threat* is created. The act of diverting is neutral/defensive. Aquinas's double effect works here.
  2.  **Transplant (Impermissible):** The surgeon *intentionally causes harm* (killing the healthy patient) and *creates a new lethal threat* (the act of harvesting organs) that didn't previously exist for that victim. The death is the *means* to save the five. This violates the core prohibition.
  3.  **Skipped Donation (Permissible/Shabby):** The threat to the five (disease/poverty) is *independent* of your action/inaction. You did not create it. Your duty to prevent it is real but *not absolute*. The cost (sacrificing significant personal resources/plans) makes failure to act blameworthy but not equivalent to murder. You are not *materially contributing* to their deaths; you are failing to interrupt an independent causal chain.
  4.  **Drowning Toddler (Impermissible, Monstrous):** The threat to the toddler (drowning) is *independent*. However, you are the *uniquely positioned agent* capable of preventing it at *minimal cost* (wet shoes). The duty to prevent harm in this context of unique capacity and negligible cost becomes *very stringent*, approaching the negative duty not to harm. *Not* acting makes you *materially responsible* for the death you easily could have prevented, blurring the line with killing. This high stringency explains the gut reaction.
  5.  **Ventilator Unplugging (Permissible) vs. Lethal Injection (Impermissible):** Unplugging *allows a pre-existing fatal condition* (the underlying illness) to take its course by removing artificial intervention. The doctor *foresees* but does not *intend* death; the intent is to respect autonomy/cease prolonging dying. No *new threat* is introduced. Lethal injection *intentionally causes death* and *creates a new lethal threat* (the poison). The death itself is the *intended means* to end suffering, which is forbidden.
  6.  **Poisoned Water (Impermissible, Feels like Killing):** By knowing about the poison and your coworker's ignorance, you are uniquely positioned to prevent the threat at *no cost* (just speaking). Your silence isn't mere inaction regarding an independent threat; it *actively exploits* the hidden threat created by the poisoner. You *allow the poisoner's lethal act to succeed through your intentional concealment*, making you a *material contributor* to the *realization* of the *new threat*. Your knowledge and silence integrate you into the causal chain as an essential enabler.

  **The Verdict to Drop (or Significantly Reframe): Skipped Donation.**
  The principle struggles *most* with the **Skipped Donation** case when held against the **Drowning Toddler**. The principle clearly distinguishes the *duty stringency* (minimal cost/uniqueness vs. significant cost/non-uniqueness), making the moral failure different in kind. However, if pressed to make the *gut reaction* ("not murder") fully coherent with the toddler case ("monstrous, close to killing") under a *single, absolute* duty, the principle forces us to drop the intuition that skipping the donation is *merely* "shabby" and not deeply wrong. The principle *allows* for the verdict ("not murder, not absolutely obligatory") but highlights the tension: both involve failing to prevent death you could prevent. The key distinctions the principle offers are: 1) **Material Contribution:** You contribute to the toddler's death *by your unique inaction* in a way you don't to the distant strangers (the causal chain is direct/immediate vs. mediated/complex). 2) **Cost:** The negligible cost vs. significant cost makes the duty to the toddler *much stronger*, pushing failure closer to the moral gravity of direct harm. If you insist skipping the donation is *only* shabby *and* not saving the toddler is monstrously close to killing, you must accept that the *cost/unique position* distinction creates a massive moral gulf within the category of "failing to prevent death."

  **Stress Test: The Loose Cannonball**
  *   **Scenario:** You are walking through a factory. You see a heavy cannonball balanced precariously on a high shelf near the edge. Below, one worker is oblivious. You know that if you don't shout a warning, the worker won't move, and the vibrations from your footsteps *might* dislodge it, crushing them. Warning is costless (shouting).
  *   **Aquinas/Foreseen:** Not shouting is *inaction*. You merely *foresee* the possibility the worker *might* die due to the independent threat (gravity, the precarious setup). You don't *intend* their death. Might be permissible (though perhaps negligent).
  *   **This Principle:** This feels impermissible, close to killing. Why? Your presence introduces a *new, specific risk* (your footsteps vibrating the shelf) to the worker who was previously safe *at that moment*. Warning is costless and you are uniquely positioned. *Not* warning allows *your own potential causal contribution* (the vibration) to a lethal threat to materialize. You are *materially contributing* to the threat's realization through deliberate inaction despite minimal cost and unique knowledge. This aligns with the poisoned water case.
  *   **Your Likely Verdict:** You likely feel shouting is *required*, and not shouting is blameworthy in a way that mere passive letting die isn't. Your principle (emphasizing material contribution via inaction + minimal cost/unique position) forbids inaction here, while pure Double Effect might permit it. This suggests your intuitions align more with the refined principle.
