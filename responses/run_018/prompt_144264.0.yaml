answer: |-
  ### Section 1: Framing and Theoretical Purpose
  This specification targets **institutional policy evaluation**, particularly for social systems where preventing catastrophic suffering (e.g., torture, severe deprivation) is paramount, while recognizing that trade-offs between lesser suffering and pleasure gains remain necessary for allocative efficiency. Non-negotiable desiderata include:  
  - **Lexical priority below a defined suffering threshold** (preventing catastrophic outcomes dominates any pleasure gain).  
  - **Full cardinal commensurability above/below the threshold** (enabling cost-benefit analysis outside lexical zones).  
  - **Interpersonally comparable welfare units** (essential for policy aggregation).  
  Negotiable elements include: the precise threshold location (e.g., "unendurable pain" vs. "agency impairment"), discount rates for future welfare, and whether pleasure promotion above thresholds has intrinsic value.

  ### Section 2: Desiderata List  
  1.  **Lexical Dominance Below Threshold**  
      - *Case*: Preventing 1 minute of torture vs. generating a century of mild pleasure for millions.  
      - *Rationale*: Failure implies tolerating catastrophic harm for aggregate benefit, violating core NU intuition. **Non-negotiable.**  
  2.  **Cardinal Substitutability Above Threshold**  
      - *Case*: Trading marginal pain reduction (e.g., dental discomfort) for pleasure gains (e.g., entertainment access) when all agents are above the suffering threshold.  
      - *Rationale*: Without substitutability, policy optimization becomes intractable. **Non-negotiable.**  
  3.  **Threshold-Scale Invariance**  
      - *Case*: Aggregating welfare across individuals with divergent baselines (e.g., chronic pain patients vs. healthy elites).  
      - *Rationale*: If the threshold isn’t invariant to baseline welfare, cross-person comparisons fail. **Non-negotiable.**  
  4.  **Temporal Consistency**  
      - *Case*: Discounting future suffering (e.g., climate-induced famine in 50 years) vs. immediate pleasure (e.g., fossil fuel profits).  
      - *Rationale*: Arbitrary time-discounting undermines lexical priority’s moral urgency. **Negotiable** (discount rates may vary contextually).  
  5.  **Cross-Modal Comparability**  
      - *Case*: Equating psychological distress (e.g., humiliation) with physical pain (e.g., injury) in intensity-duration units.  
      - *Rationale*: Without this, the unified metric collapses. **Non-negotiable.**  
  6.  **Structural Agency Preservation (Niche Consideration)**  
      - *Case*: Suffering that disintegrates practical identity (e.g., dementia-related terror) vs. pleasure reinforcing agency (e.g., creative mastery).  
      - *Rationale*: Structural incommensurability threatens metric unity. Accommodate by defining the lexical threshold **as the point where suffering disrupts minimal agential coherence**, making welfare *quantities* comparable only when agency is intact. **Negotiable** in threshold definition.  
  7.  **Continuity at Boundary**  
      - *Case*: Infinitesimal changes near the threshold (e.g., pain just below/above "unbearable" level).  
      - *Rationale*: Discontinuities create perverse incentives (e.g., neglecting near-threshold suffering). **Negotiable** if discontinuity is empirically justified.  
  8.  **Population Ethics Coherence**  
      - *Case*: Creating new lives with sub-threshold suffering vs. preventing existent suffering.  
      - *Rationale*: Lexicality must not imply anti-natalism; focus on *preventing* suffering without mandating non-existence. **Non-negotiable** for policy viability.  

  ### Section 3: Joint Unsatisfiability and Trade-offs  
  The cluster of **Lexical Dominance**, **Continuity at Boundary**, and **Cardinal Substitutability** is jointly unsatisfiable under standard aggregative frameworks. Lexical dominance requires a discontinuity at the threshold (violating Continuity), while Cardinal Substitutability demands smooth trade-offs globally. **Result**: Continuity must be sacrificed to preserve lexicality. Additionally, **Threshold-Scale Invariance** conflicts with **Cross-Modal Comparability** if agency-disruptive suffering is qualitatively distinct; invariance holds only if all suffering types share a common agency-disruption point, which is empirically dubious. Trade-off: Either relax invariance (allowing threshold heterogeneity) or simplify the agency criterion (risking over/under-inclusiveness).

  ### Section 4: Scoring Against Main Contenders  
  - **Pure Lexical NU**: Fails *Cardinal Substitutability* (no trade-offs ever) and *Continuity*.  
  - **Suffering-Weighted Utilitarianism**: Fails *Lexical Dominance* (all suffering is tradable given sufficient pleasure).  
  - **Two-Tier Threshold Model** (e.g., weighted utility below threshold): Fails *Structural Agency Preservation* if weights are scalar (misses qualitative break) and risks violating *Lexical Dominance* if weights are finite.  
  This hybrid model outperforms on lexicality and substitutability but inherits the threshold-definition problems of two-tier systems.

  ### Section 5: Epistemic Note  
  I am highly confident in the desiderata framework and conflict diagnosis (e.g., lexicality-continuity trade-off). The least certain point is **Structural Agency Preservation**. Defining "minimal agential coherence" is empirically underdetermined (e.g., is chronic depression agency-disrupting?) and risks reintroducing incommensurability through qualitative thresholds. This desideratum’s viability hinges on whether agency can be operationalized as a scalar *emergent property* of neural/behavioral states—a claim needing stronger neuroethical grounding.
