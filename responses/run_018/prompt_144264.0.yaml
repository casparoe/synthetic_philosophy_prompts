prompt: |-
  You are an expert in value theory, welfare economics, and the formal structure of utilitarian ethics. Before you begin, spend a brief moment brainstorming the core tension: how can pleasure and pain remain fully commensurable on a single metric while suffering also carries lexical priority up to a defined threshold?

  Write the full specification of desiderata that any adequate theory combining lexical-threshold negative utilitarianism with full commensurability of pleasure and pain must satisfy. By the view in question, I mean one that assigns lexical priority to the reduction of suffering over the promotion of pleasure up to a specified welfare boundary, but that retains cardinal substitutability between the two states both below and above that boundary.

  Structure your response exactly in the following sections and approximate lengths:

  Section 1: Framing and theoretical purpose (about 150 words). Define what this theory needs to be adequate for—normative ethics, institutional policy evaluation, or population ethics—and state which desiderata are non-negotiable given that purpose versus which are negotiable preferences of particular camps.

  Section 2: The desiderata list (about 650 words). Present at least eight requirements. For each, specify: (a) the case or phenomenon it must correctly handle (for example, intense brief suffering versus diffuse long-term pleasure; cross-modal comparison between physical pain and psychological distress; aggregation across individuals with divergent baseline welfare; temporal discounting of future pains); (b) why failing on this point undermines adequacy rather than merely offending one school of thought; and (c) whether it is non-negotiable or negotiable. You must explicitly address one niche consideration that standard treatments overlook: the problem of structural incommensurability, where pleasure and pain differ not only in intensity or duration but in their relation to agency and temporal integration (e.g., pain as a disintegration of practical identity versus pleasure as a reinforcement of it). Explain how the theory can accommodate this structural difference without either collapsing the two states into a single qualitative kind or abandoning the commitment to a unified welfare metric.

  Section 3: Joint unsatisfiability and trade-offs (about 300 words). Identify any cluster of your desiderata that cannot be jointly satisfied given standard results in welfare aggregation or decision theory—such as continuity-breaking at the lexical boundary, an Arrow-style impossibility for multi-person welfare ordering with lexical constraints, or a conflict between inter-personal comparability and intra-personal lexical ordering. If you believe a cluster is jointly unsatisfiable, say so clearly and name the result that generates the conflict. If it is satisfiable only by sacrificing one desideratum, flag the precise trade-off.

  Section 4: Brief scoring against main contenders (about 250 words). Assess how pure lexical negative utilitarianism, standard cardinal utilitarianism with a suffering-weighted metric, and a two-tier threshold model perform against your list. Keep the emphasis on the criteria; the scorecard should be brief.

  Section 5: Epistemic note (about 100 words). State directly how confident you are in the overall analysis, and single out the one specific point—whether a particular desideratum, a joint-unsatisfiability claim, or a scoring judgment—about which you are least sure. Do not hedge uniformly; pinpoint your actual uncertainty.

  Do not provide bibliographies, reading lists, citation requests, or references to specific page numbers. Do not include verbatim quotations from any published text; if you refer to a named argument or position, paraphrase it in your own words. Write from your existing knowledge.
