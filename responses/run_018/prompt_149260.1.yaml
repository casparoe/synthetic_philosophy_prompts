prompt: |-
  I'm a distributed-systems engineer who mostly thinks in terms of backpreasure, load shedding, circuit breakers, queue depth, and gracefull degradation. Restate Garrett Hardin's lifeboat ethics argument—wealthy nations as lifeboats with a hard carrying capacity that shouldn't take on passengers from sinking boats—using only that vocabulary, as precisely as you can. For each part, say whether it maps clean, needs distortion, or has no analouge at all in queue management. Then give me the residue report: is the moral urgency Hardin claims just my framework missing a fairness metric, or is he smuggling in normative work that has no counterpart in how we handle overload? After the prose, give me a JSON object with exactly these fields: "clean_maps" (array of strings), "distortions" (array of strings), "missing_claims" (array of strings), "residue_verdict" (string). Keep it focused—no bibliographies or citations, i just want to check if my gut feeling that it's load-shedding with extra moral steps is right or wrong.
reasoning: |-
  We are restating Hardin's lifeboat ethics using distributed systems terminology. The key elements:

  1. **Lifeboats (wealthy nations)** - Represent systems with limited capacity.
  2. **Carrying capacity** - The maximum load the system can handle without degradation.
  3. **Sinking boats (poor nations)** - Represent systems under catastrophic failure (overload).
  4. **Taking on passengers** - Accepting additional load (immigrants) from a failing system.

  We map this to:
  - **Backpressure**: The lifeboat (wealthy nation) must not accept more passengers than it can handle to avoid being overwhelmed. This is analogous to backpressure in distributed systems where a system signals upstream to slow down when it's at capacity.
  - **Load shedding**: The lifeboat must shed excess load (refuse passengers) to maintain its own stability. This is direct: when the lifeboat is at capacity, it must drop requests (passengers) to avoid sinking.
  - **Circuit breakers**: If the lifeboat continuously takes on passengers beyond capacity, it risks total failure. A circuit breaker would trip to stop accepting any more passengers until stability is restored.
  - **Queue depth**: The lifeboat has a finite queue (capacity) for passengers. Once the queue is full, new passengers are rejected.
  - **Graceful degradation**: If the lifeboat does take on some passengers beyond capacity, it may degrade its services to all (including existing passengers). But Hardin argues against this because it leads to everyone perishing.

  Hardin's argument: 
  - Each lifeboat (rich nation) has a limited capacity (say, 60 people in a 50-person boat). 
  - The people in the water (from poor nations) want to get in. 
  - If the lifeboat takes on more than capacity, it sinks and everyone dies. 
  - Therefore, the lifeboat must not take anyone, or only a few, to avoid exceeding capacity.

  Now, we break down the mapping:

  1. **Wealthy nations as lifeboats with hard carrying capacity**: 
     - Clean map: This is a system with a fixed capacity (queue depth). We can model the nation as a service with a maximum queue depth (number of people it can support without degradation).
  2. **Shouldn't take on passengers from sinking boats (poor nations)**:
     - Clean map: When a downstream system (poor nation) is failing (sinking), the upstream (lifeboat) should apply backpressure (refuse immigrants) to avoid being overloaded. Alternatively, the lifeboat must use load shedding to reject excess requests (immigrants) to preserve its own function.

  However, note that in distributed systems:
  - We often design for resilience by having multiple systems and redundancy. Lifeboats are isolated and non-redundant in Hardin's metaphor.
  - We also have fairness mechanisms (e.g., fair queueing) to distribute the load. Hardin does not consider redistributing resources to build more lifeboats or increase capacity.

  Distortions:
  - In distributed systems, we often have multiple instances (lifeboats) and can scale horizontally. In Hardin's world, the lifeboats are fixed and cannot be scaled.
  - The moral dimension: Hardin's argument is normative (what we ought to do) and presumes that the lifeboat (rich nation) has no obligation to help. In distributed systems, we design to avoid catastrophic failure, but we also design for fairness and retry mechanisms (e.g., exponential backoff and retry for failed requests). The system doesn't make a moral choice but a functional one.

  Missing analogies:
  - **Fairness**: In distributed systems, we often have algorithms to ensure fairness (e.g., round-robin, weighted fair queueing). Hardin's argument does not consider a global fairness metric. It is inherently nationalistic (each lifeboat for itself).
  - **Retry mechanisms**: In distributed systems, a rejected request might be retried elsewhere or later. In Hardin's scenario, there is no alternative for the people in the water (they die).
  - **Scaling**: We can scale our systems (add more lifeboats) but Hardin assumes that is not possible.

  Residue Report:
  Hardin's moral urgency is not just missing a fairness metric; it is smuggling in normative claims that have no counterpart in system design. In distributed systems, we design for resilience and fairness without making moral judgments about which requests are more valuable. Hardin's argument assumes that the existing passengers (citizens of the wealthy nation) are more valuable than the ones in the water (outsiders). Our systems don't make that distinction unless we program them with such priorities (which would be a normative choice). Thus, the residue is that Hardin is making a moral argument about the value of lives and the right to self-preservation of the wealthy nations, which is not inherent in the technical concepts.

  Therefore:
  - Clean maps: 
     - "Lifeboat capacity as queue depth"
     - "Taking on passengers beyond capacity leading to system failure (sinking) maps to overload without backpressure"
     - "Refusing passengers is load shedding to prevent total failure"
     - "Circuit breakers tripping to stop accepting passengers when capacity is reached"

  - Distortions:
     - "The inability to scale (add more lifeboats) is assumed, whereas in distributed systems we can scale horizontally."
     - "The lack of retry mechanisms: in distributed systems, rejected requests can be retried or rerouted; in lifeboat, rejection is fatal."
     - "Hardin's scenario is a one-shot, non-redundant system, whereas distributed systems are designed with redundancy and failover."

  - Missing claims (normative elements without technical counterpart):
     - "The moral claim that wealthy nations have no obligation to help the poor nations (which is a normative stance, not a technical requirement)."
     - "The assumption that the lives of existing passengers (citizens) are more valuable than those in the water (immigrants)."
     - "The absence of a global fairness or resource redistribution mechanism (like a global queue or scaling out)."

  - Residue verdict: 
     - "Hardin's moral urgency is not just a missing fairness metric; it is a normative stance that has no inherent counterpart in distributed systems overload management, which is purely functional and amoral."

