prompt: |-
  A few months back the biggest employer in my town shut down (a processing plant, about 700 jobs) and it's been strange watching how the place coped -- some things fell apart fast, other things quietly reorganized themselves and kept going. It got me reading about societal collapse at the bigger scale, and now I've got a pile of stuff on the Late Bronze Age, the Classic Maya, Easter Island, and honestly everyone seems to mean something different by "collapse." Before I read any more of it I want the spec first: what does any adequate theory of societal collapse actually have to deliver? The cases it must get right, the distinctions it can't fudge (collapse vs. transformation vs. just decentralization, and collapse for whom -- the palace scribes or the ordinary farmers), the evidence it has to stay consistent with, with the case or example behind each requirement. It also has to handle the awkward fact that some of the famous cases are contested -- e.g. the ecocide story about Rapa Nui has been challenged alot, so a theory can't just take the Diamond version as settled fact. Tell me which desiderata you suspect can't be jointly satisfied (my hunch: "collapse is objectively identifiable" and "collapse is bad" pull apart somewhere) and which single requirement knocks out the most popular theories. Give it to me as exactly seven numbered points, a sentence or two each, no intro and no wrap-up.
reasoning: |-
  Okay, the user is asking for seven specific criteria that any adequate theory of societal collapse must meet. They've been researching cases like the Late Bronze Age, Classic Maya, and Easter Island, and noticed inconsistencies in how "collapse" is defined. They want clarity on what makes a collapse theory valid, including handling contested cases and avoiding biases.

  First, I need to address their core request: a checklist of seven non-negotiable requirements. Each point must tackle a different aspect—definition, scale, evidence, etc. The user emphasized avoiding intros/conclusions, so I'll dive straight into numbered points.

  Key angles to cover: 
  - Defining collapse vs transformation/decentralization (they mentioned palace scribes vs farmers)
  - Handling contested evidence (like Rapa Nui challenges)
  - Their hunch about "objectively identifiable" vs "bad" being incompatible
  - One requirement that disqualifies popular theories

  Their unspoken needs seem to be: 
  - Cutting through academic vagueness 
  - Wanting a practical litmus test for theories 
  - Sensitivity to power dynamics (whose collapse matters?) 
  - Frustration with oversimplified narratives (e.g., Diamond's ecocide)

  For point 1, I'll tackle operationalization—clear thresholds for collapse. Point 2 must distinguish collapse from transformation, using the Maya "collapse" of elites but continuity of farmers. Point 3 addresses scale dependency, like Late Bronze Age trade networks failing but villages surviving. 

  Point 4 handles evidentiary consistency—forcing theories to engage with counterarguments like Rapa Nui's contested ecocide. Point 5 covers multi-causality without monocausal fixes. Point 6 confronts their hunch: separating objective identification from moral judgment (collapse isn't universally "bad"). 

  Finally, point 7 needs to expose popular theories' blind spot: overreliance on elite-centric records. Example: Roman collapse narratives ignoring peasant continuity. This knocks out many dramatic collapse stories. 

  I'll keep each point to 1-2 sentences, quoting specific cases. The tone should match their no-nonsense approach—dense, precise, no fluff.
answer: |-
  Here are seven essential requirements for any adequate theory of societal collapse:

  1.  **Operationalize "Collapse":** It must define specific, measurable thresholds for collapse (e.g., >90% population loss, permanent end of centralized governance, cessation of core cultural practices), distinguishing it from mere decline, transformation, or decentralization (e.g., differentiating the *end* of Classic Maya royal courts from continued peasant habitation).
  2.  **Specify Collapse *for Whom*:** The theory must explicitly state which societal segment experiences collapse (e.g., administrative elite collapse vs. peasant farmer continuity), avoiding monolithic claims and acknowledging divergent fates (e.g., Mycenaean palace scribes vs. subsistence farmers post-Late Bronze Age).
  3.  **Handle Scale Dependency:** It must account for collapse occurring at different scales (e.g., collapse of interregional trade networks in the Late Bronze Age Mediterranean vs. relative stability in some local settlements like Ugarit before its final destruction).
  4.  **Respect Contested Evidence:** It must remain consistent with, and actively engage with, major counterarguments and reinterpretations within key cases (e.g., incorporating critiques of Rapa Nui's ecocide narrative rather than relying solely on Diamond's version).
  5.  **Demand Multi-Causal Explanation:** It must avoid monocausal determinism and integrate complex interactions of variables (e.g., combining climate change (drought), seismic activity, migration pressures, *and* systemic fragility for the Late Bronze Age Collapse).
  6.  **Decouple Identification from Morality:** It must allow collapse to be objectively identifiable through criteria in point #1, *without* requiring it to be universally "bad" for all segments (e.g., acknowledging the collapse of oppressive tribute systems might benefit peasants, as potentially argued for some Post-Classic Maya).
  7.  **Reconcile Elite & Non-Elite Evidence:** It must integrate data from *both* elite contexts (palaces, inscriptions) *and* non-elite contexts (commoner settlements, subsistence evidence), exposing theories overly reliant on elite-centric records (e.g., popular "Dark Age" narratives of post-Roman Europe often ignore archaeological evidence for rural continuity).
