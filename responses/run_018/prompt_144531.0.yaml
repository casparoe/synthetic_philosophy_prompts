  Looking at the friend's pattern, her rulings seem to prioritize physical containment and biological boundaries. The human brain (1) and synthetic mesh in a cranium (5) are contained. The split-brain patient (3) is still in one head. But the distributed supercomputer (4) and bee colony (2) lack a single physical boundary. The split-brain case is interesting—disconnected hemispheres but still one subject because they share a biological body.

