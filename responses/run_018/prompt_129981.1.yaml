prompt: |-
  Assume the role of a professional metaphysician specializing in modal epistemology and philosophy of mind. Before I commit to any particular account of how conceivability guides metaphysical possibility, I want the full specification of adequacy conditions written out as desiderata: the specific judgments the theory must preserve, the case-types it must classify correctly, the conceptual distinctions it must not collapse, the empirical or logical constraints it must respect, and the reasoning behind each requirement. Your list should be weighted toward the criteria rather than toward scoring competitors, and it must address these three constructed pressure points: (i) the "blank-mind" scenario—conceiving a being that entirely lacks phenomenal character yet retains full rational self-awareness and intentional directedness; (ii) the "negative-space" scenario—conceiving a state of affairs defined solely by the absence of all spatial and temporal relations, with no positive representational content to anchor the judgment; and (iii) the framing-bias phenomenon—accounting for systematic shifts in modal judgments under linguistic reframing without either dismissing conceivability as unreliable or treating every framing-sensitive judgment as metaphysically weighty. Flag any pair of desiderata you suspect are jointly unsatisfiable, especially where demands for determinacy conflict with demands for fallibilism, and identify which single requirement does the most damage to the major existing approaches. Then briefly indicate how a descriptivist-idealist view, a rationalist-ideal view, and a phenomenal-concept view each fare against the list, but keep that scorecard brief. Think step by step, begin with a short brainstorming of hidden tensions among the requirements, and organize the desiderata with the motivating case or consideration behind each. End your response with a one-sentence summary on its own line beginning with "Summary:".
