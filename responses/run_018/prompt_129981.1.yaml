  When flagging jointly unsatisfiable pairs, the determinacy/fallibilism conflict stands out. Over-optimizing for one weakens the other. The phenomenal-concept view suffers most from the phenomenal grounding requirement since it ties concepts to experience.

  For the brief scorecard: Descriptivist-idealism struggles with empirical constraints, rationalist-idealism has framing-bias issues, and phenomenal-concept theory falters on blank-mind cases. The most damaging requirement overall is empirical coherence - it challenges theories that prioritize conceptual analysis over scientific consistency.

