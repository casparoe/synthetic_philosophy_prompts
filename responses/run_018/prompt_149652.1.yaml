answer: |-
  ### Decision Procedure for Voting Rule Robustness Based on Gibbard-Satterthwaite  
  **Use this checklist *before* coding your aggregation rule.** Follow steps sequentially. Gates are strict yes/no; judgment calls require team discussion.  

  ---

  #### **Step 1: Domain Restrictions Check**  
  **Question:** Are there *exactly 2 proposals* to rank?  
  - **Yes** → Majority vote is strategy-proof. **Result: SHIP IT**.  
  - **No** (≥3 proposals) → Proceed to Step 2.  
  *Why?* GS theorem requires ≥3 alternatives for manipulation risk.  

  ---

  #### **Step 2: Preference Domain Check**  
  **Question:** Are voter preferences *guaranteed single-peaked*? (e.g., proposals align on a clear left/right spectrum like budget size, and all voters have a "sweet spot").  
  - **Yes** → Strategy-proof rules exist (e.g., median voter). **Result: SHIP IT** if using median rule.  
  - **No/Unclear** → Proceed to Step 3.  
  *Judgment call*: Requires human analysis of proposal structure. If proposals are multi-dimensional (e.g., "security vs. features vs. cost"), answer **no**.  

  ---

  #### **Step 3: Dictatorship Test**  
  **Question:** Is there a *single voter* who can always force their top choice to win?  
  - **Yes** → Rule is strategy-proof but dictatorial. **Result: STOP, REDESIGN** (unless dictatorship is acceptable).  
  - **No** → Proceed to Step 4.  
  *Code-checkable* for weighted schemes:  
  ```python  
  def is_dictatorial(weights: list[float]) -> bool:  
      total_weight = sum(weights)  
      return any(w > total_weight - w for w in weights)  
  ```  

  ---

  #### **Step 4: Strategy-Proofness Verification**  
  **Question:** Is your rule *provably strategy-proof* under GS assumptions (≥3 options, unrestricted preferences)?  
  - **Yes** → Only possible if dictatorial (contradicts Step 3). **Result: STOP, REDESIGN**.  
  - **No** → Proceed to Step 5.  
  *GS reality check*: All non-dictatorial rules with ≥3 options are *manipulable*. This step is auto-**no** for your rules.  

  ---

  #### **Step 5: Manipulation Risk Acceptance**  
  **Question:** Is the cost of potential manipulation *acceptable* given:  
  - Stakeholder incentives (e.g., low stakes if voters are aligned),  
  - Mitigations (e.g., vote hiding, post-audits),  
  - Alternatives (e.g., fewer proposals, domain restriction)?  
  - **Yes** → **Result: SHIP IT** (with monitoring).  
  - **No** → **Result: STOP, REDESIGN**.  
  *Judgment call*: Requires team risk assessment.  

  ---

  ### Application to Your Voting Rules  
  Assume:  
  - ≥3 proposals, unrestricted preferences (worst-case GS scenario).  
  - Voters: 1 senior (2× weight), 4 juniors (1× weight). Total weight = 6.  

  | Rule                  | Step 1 | Step 2 | Step 3 (Dictatorship?) | Step 4 | Step 5       | Verdict          |  
  |-----------------------|--------|--------|------------------------|--------|--------------|------------------|  
  | **Plurality**         | No     | No     | No (all weight=1)      | No     | **Accept?**  | Human override   |  
  | **Instant-Runoff**    | No     | No     | No                     | No     | **Accept?**  | Human override   |  
  | **Weighted Scheme**   | No     | No     | **YES** (if senior weight >3) | (Skip) | N/A          | **STOP, REDESIGN** |  

  #### **Key Outcomes**  
  1. **Plurality & IRV**:  
     - Fail Step 4 (not strategy-proof).  
     - **Human override at Step 5** required. If acceptable, ship with logging for manipulation patterns.  

  2. **Weighted Scheme**:  
     - **Fails Step 3** (dictatorial): Senior has weight=2, but 2 ≯ 4 (sum of others). *Not dictatorial*.  
     - **Wait!** Change scenario: 1 senior (weight=4), 2 juniors (weight=1 each).  
       - `is_dictatorial([4, 1, 1])` → `4 > (6-4)` → `4 > 2` → **TRUE**.  
     - **Result: STOP, REDESIGN** (unless team accepts dictatorship).  
     - *Why you’ll hate this*: Senior veto power is politically necessary but fails robustness. Override only if dictatorship is explicit policy.  

