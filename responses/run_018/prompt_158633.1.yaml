  First, silent dysfunction. In naturalism, a genetic mutation causing significant deviation from species-typical function would be a disease, even without symptoms. But normativism would say no harm, no disease. The challenge for naturalism is labeling something as disease that doesn't affect the person. For normativism, the problem is ignoring underlying biological issues that could become harmful later.

  Next, adaptive preference inversion. Here, someone with a chronic condition values it as part of their identity and rejects cure. Naturalism would still classify it as a disease due to biological dysfunction. Normativism would struggle because the person doesn't experience harm; they might even see cure as harmful. This highlights how normativism relies on subjective values, which can be inconsistent. Naturalism's rigidity here might pathologize identity.

