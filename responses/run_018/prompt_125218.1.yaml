  Hmm, this feels familiar from critical theory and decolonial studies. The user is clearly well-versed in epistemic injustice frameworks - they specifically mention hermeneutical and contributory injustice as reference points. They're not just asking for a label; they want precise conceptual boundaries. 

  The core tension here is between epistemic agency and structural exclusion. The group *has* agency in developing their framework (unlike hermeneutical injustice), but institutions systematically deny that framework's legitimacy through coercive translation. That's different from simple exclusion where the framework is ignored outright. 

  I recall Miranda Fricker's work on hermeneutical injustice where people lack concepts altogether. Here, the problem isn't absence of concepts but forced replacement. And contributory injustice (Gaile Pohlhaus Jr.) involves denying someone's credibility as a knower, whereas here credibility exists within the group but gets destroyed through distortion. 

  The institutional coercion aspect reminds me of Dotson's "testimonial smothering" where speakers self-censor, but here it's active imposition. Maybe "epistemic displacement"? Or "conceptual dispossession"? No, those don't capture the translation aspect. 

  "Epistemic capture" comes close - where dominant frameworks absorb and neutralize resistant knowledge. The user's emphasis on lost "normative distinctions" during translation is crucial. When indigenous land claims get reduced to property law, or gender violence gets framed as individual conflict - that's not just loss but active distortion. 

  For boundary cases: Benign translation happens when both frameworks retain legitimacy (e.g., physics concepts adapted for engineering). Malignant translation occurs when the dominant framework claims epistemic superiority. The key is whether the translation process itself becomes an evaluative tool rather than bridge. 

  The user might be developing a framework for academic activism or policy reform. Their frustration with peer review/funding bodies suggests they've encountered this personally. They need precise terminology to challenge institutional practices. I should emphasize how this differs from existing concepts while acknowledging overlaps. 

  Proposing "hermeneutical assimilation" as a term - it combines the framework-distortion of hermeneutics with the coercive absorption implied by assimilation. The definition must highlight three elements: (1) existing robust framework, (2) coerced translation, (3) dismissal via manufactured inadequacy. 

  This connects to broader decolonial struggles. Scholars like Santos talk about "epistemicide" - but that's more extreme. Maybe cite his work on "abyssal thinking" where alternative knowledges get pushed beyond the visible. The user's case is subtler because the framework enters the system only to be mutilated.
answer: |-
  You've precisely identified a distinct and pernicious form of epistemic harm that **does not have a single, universally established name**, but is actively discussed and conceptualized in critical social epistemology, decolonial studies, feminist philosophy, and science & technology studies (STS). It sits at the intersection of several concepts but has unique features.

  **Proposed Term: Hermeneutical Assimilation**

  **Core Definition:** Hermeneutical Assimilation occurs when a subordinated group's *already-developed, internally coherent, and precise conceptual framework* for understanding their specific experiences or structural harms is **coercively translated** into a dominant epistemic framework by an institutionally empowered gatekeeper. This translation systematically **strips away the framework's critical normative, relational, or structural dimensions**, rendering the claim generic, emotionally subjective, or analytically weak. The resulting distorted claim is then evaluated *as if it were the original*, leading to its dismissal. The harm is attributed to the inadequacy of the *group's original claim* rather than to the violence of the translation process itself.

  **Core Conditions:**

  1.  **Existence of a Robust Subaltern Framework:** A group possesses a shared, articulated, and functional conceptual scheme specifically developed to understand a particular harm, relation, or aspect of their experience (e.g., Indigenous relational ontology for land claims, critical race concepts like systemic racism/microaggressions, specific feminist frameworks for gendered harms).
  2.  **Institutional Coercion & Epistemic Dominance:** A gatekeeping institution (review board, tribunal, funding body, legal system) possesses the power to grant or deny recognition (as knowledge, legitimate claim, fundable project). It mandates the use of *its* dominant framework (e.g., positivist science, neoliberal economics, formal legal reasoning, colonial administrative categories) as the *only* legitimate language for recognition.
  3.  **Non-Neutral Translation & Conceptual Loss:** The mandated translation is not a neutral act of bridging understanding. It inherently fails because the dominant framework lacks the specific concepts, distinctions, and normative commitments essential to the original claim's meaning and force. Key elements (relationality, systemic causation, specific normative valences) are lost or distorted.
  4.  **Flattening & Misrepresentation:** The translated claim becomes a significantly degraded version: overly generic, stripped of structural analysis, reduced to individual emotion or subjective complaint, or rendered as an underspecified technical problem.
  5.  **Evaluation & Dismissal Based on Misrepresentation:** The gatekeeper evaluates *only* this flattened, misrepresented version. Finding it inadequate (lacking evidence, rigor, specificity, objectivity), they dismiss the claim/project.
  6.  **Misattribution of Failure:** The dismissal is attributed to the inherent weakness or irrationality of the *original* claim/framework or the group presenting it, rather than being recognized as a consequence of the coercive translation and the inadequacy of the dominant framework to capture the specific harm.

  **Distinction from Established Concepts:**

  1.  **Hermeneutical Injustice (Fricker):**
      *   **Key Difference:** Fricker's concept centers on a *lack* of collective interpretive resources. The harmed person *cannot* make sense of their experience *because the concepts don't exist* socially. In Hermeneutical Assimilation, **the concepts *do* exist robustly within the group**. The injustice is not the *absence* of concepts, but the **coercive suppression and distortion** of *existing, functional* concepts via forced translation and the subsequent misrepresentation/evaluation.
      *   **Analogy:** Hermeneutical injustice is having no language at all for gaslighting. Hermeneutical assimilation is having a precise term and theory for gaslighting, being forced to describe it only as "feeling upset," and then being told your complaint is invalid because "everyone feels upset sometimes."

  2.  **Contributory Injustice (Pohlhaus Jr.):**
      *   **Key Difference:** Contributory injustice focuses on the *willful refusal* of dominant knowers to acknowledge the concepts developed by marginalized groups *even when presented with them*, due to ignorance or bad faith. Hermeneutical Assimilation involves a more **institutionalized, procedural coercion**. The gatekeeper doesn't necessarily *refuse* to hear the original concepts initially; they *demand* their translation into the dominant frame *as a precondition* for consideration. The harm occurs *through* the mandated translation process and the subsequent evaluation of the distorted output. It leverages institutional power to enforce epistemic conformity.

  3.  **Epistemic Exclusion (Broader Category):**
      *   **Key Difference:** Epistemic exclusion is an umbrella term covering various ways groups/knowledges are marginalized (ignoring, silencing, devaluing credentials). Hermeneutical Assimilation is a **specific *mechanism* of exclusion**. It's not merely ignoring the framework or devaluing the speaker. It's an **active process of enforced conceptual transformation** followed by judgment based on the distorted product. It adds the unique elements of *coerced translation*, *systematic conceptual loss during translation*, and the *misattribution of failure*.

  **Boundary Cases: Distinguishing from Benign Translation**

  1.  **Benign Translation for Mutual Understanding:**
      *   **Goal:** Facilitate dialogue and comprehension *between frameworks*, often initiated voluntarily or collaboratively. Aim is *fidelity* to the original meaning across contexts.
      *   **Power Dynamic:** Relatively symmetrical or acknowledged asymmetry without coercion. No penalty for using original framework where appropriate.
      *   **Outcome:** The translated version is understood as an *approximation* or *bridge*. The *original framework retains its legitimacy and validity*. Evaluation, if any, considers the original meaning.
      *   **Boundary:** Hermeneutical Assimilation occurs when translation is *mandatory for recognition*, driven by power asymmetry, results in *necessary distortion* due to conceptual lack in the dominant frame, and the *distorted output becomes the sole basis for judgment* against the originators.

  2.  **Necessary Standardization (Non-Coercive & Non-Distorting):**
      *   **Case:** Converting measurements from imperial to metric for a shared engineering project. The underlying concepts (length, force) are shared and stable across frameworks. Translation is functional and doesn't alter meaning.
      *   **Boundary:** Hermeneutical Assimilation involves translating concepts *where the frameworks are incommensurable* on key normative/structural points. The translation isn't just changing units; it's changing the *ontological and normative categories* themselves, leading to fundamental misrepresentation.

  3.  **Voluntary Adaptation for Wider Reach:**
      *   **Case:** A community group *chooses* to frame their specific environmental justice concerns using terms from mainstream ecology and public health *to build broader coalitional support*, while still maintaining and using their original framework internally.
      *   **Boundary:** The key is **coercion**. When the group *must* translate *or be dismissed*, and the translation *distorts* their claim under the guise of objectivity, it becomes Hermeneutical Assimilation. Voluntary strategic adaptation preserves agency over the framing.

  **Conclusion:**

  "Hermeneutical Assimilation" captures the core dynamic you identify: the forced absorption and distortion of a subaltern group's existing, precise conceptual framework into a dominant one ill-equipped to represent its specificity, followed by the dismissal of the group based on this manufactured misrepresentation. It highlights the unique violence of *institutionally mandated conceptual erasure through translation* as a distinct mechanism of epistemic injustice, differing crucially from Fricker's hermeneutical injustice (lack of concepts) and Pohlhaus Jr.'s contributory injustice (willful refusal to acknowledge concepts), while being a specific form of epistemic exclusion. This concept is vital for critiquing institutional gatekeeping practices that masquerade as neutrality while actively undermining marginalized epistemologies.
