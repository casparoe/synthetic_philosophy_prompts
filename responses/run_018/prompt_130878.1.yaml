prompt: |-
  I am preparing a consistency audit for my applied ethics seminar on institutional morality and individual obligation. Below is the package of commitments I have arrived at regarding effective altruism and its standard critiques. I want to know whether they form a coherent philosophical profile, or whether I am helping myself to incompatible motivations.

  (1) I accept the institutional critique in its strong form: that effective altruism's focus on individual optimization systematically obscures structural mechanisms of harm, treating unjust institutions as fixed background conditions rather than objects of collective transformation, and that earning-to-give within such institutions risks functioning as moral licensing.

  (2) Despite (1), I defend earning to give as permissible and sometimes optimal, provided it is practiced as what I term non-substitutive giving: the donor explicitly treats philanthropic contribution as parallel to, rather than a replacement for, institutional reform efforts.

  (3) I regard measurability bias as a deep epistemic failure in longtermist cause prioritization. The attempt to rank distant, speculative outcomes using near-term quantifiable metrics involves a category error that undermines the reliability of career-ranking estimates derived from such comparisons.

  (4) I hold that career choice should be governed by straightforward expected-value maximization: agents ought to select paths that maximize social value using the best available quantitative estimates, including longtermist ones, and epistemic humility should not function as a blanket prohibition on acting under uncertainty.

  (5) I also maintain that honoring sunk career costs can be rational: if I have spent years building specialized expertise and relational capital in direct global-health implementation, switching away solely because updated longtermist estimates assign a different path a higher expected value wastes genuinely irreplaceable organizational knowledge and human capital.

  Please audit this set. Specifically: does (2) genuinely avoid the legitimization problem raised in (1), or does non-substitutive giving collapse into the very moral licensing it seeks to avoid? Does (3) render (4) untenable, given that (4) relies precisely on the longtermist estimates that (3) discredits? Is (5) compatible with (4), or does my defense of sunk-cost honoring invoke a non-consequentialist value—such as narrative integrity or loyalty to past investment—that conflicts with expected-value maximization? Rank the tensions by severity, distinguish genuine conflicts from merely apparent ones, and indicate what the least costly revision would be and what it costs.
reasoning: |-
  Okay, the user is preparing a consistency audit for their applied ethics seminar on institutional morality and individual obligation. They've outlined five commitments related to effective altruism and its critiques and want to know if these form a coherent philosophical profile. Let me break down each point and look for tensions.

  First, commitment (1) strongly criticizes EA for ignoring structural issues and sees earning-to-give as moral licensing. Then (2) defends earning-to-give only if it's non-substitutive, meaning it doesn't replace institutional reform. I need to check if (2) genuinely avoids the legitimization problem from (1). Non-substitutive giving requires explicit parallel action, but there's a risk that the donor might still feel licensed, or others might see the giving as sufficient. The user might be underestimating how hard it is to maintain that separation in practice. The structural critique might be so strong that any participation could legitimize the system, so even parallel actions might not be enough. That's a moderate tension.

  Next, (3) criticizes measurability bias in longtermist cause prioritization, calling it a category error. But (4) insists on expected-value maximization using the best quantitative estimates, including longtermist ones. This seems contradictory. If the metrics are flawed, how can they be reliable for maximization? The user might be trying to salvage some form of quantification by advocating for epistemic humility, but (3) seems to reject the very basis of those estimates. This is a severe conflict unless they can show that some longtermist estimates avoid measurability bias, but (3) targets the core methodology. The user might need to adjust (4) to exclude areas where measurability bias is critical.

  Then, (5) argues that sunk career costs should be honored to preserve expertise and human capital, which seems to conflict with (4)'s expected-value maximization. Consequentialism usually ignores sunk costs. The user is introducing a non-consequentialist element here, like narrative integrity or loyalty. But they frame it in consequentialist terms by emphasizing irreplaceable capital. If the value of that capital outweighs switching costs, it might fit within expected value. However, if switching has higher expected value, sticking to the current path contradicts (4). The tension here is moderate; it depends on whether the expertise's value is quantifiable and included in the calculation.

  Ranking the tensions: The (3) vs (4) conflict is the most severe because it challenges the epistemic foundation of (4). The (1) vs (2) tension is moderate, needing careful implementation to avoid collapse. (5) vs (4) is also moderate but can be resolved if sunk costs are part of expected value.

  The user might be trying to reconcile structural critique with individual action, maintain quantitative decision-making while acknowledging its flaws, and balance career continuity with maximization. Their deeper need is likely a coherent framework that accommodates both institutional reform and individual obligations without dismissing EA entirely. They might also want practical applicability, hence defending earning-to-give and career continuity. The revisions suggested would require clarifying the scope of expected-value maximization and strengthening non-substitutive giving, but that might complicate the model. The user's unspoken need could be to present a nuanced position that's both theoretically sound and practically feasible, avoiding extreme positions in the EA debate.
answer: |-
  Here's a consistency audit of your philosophical commitments, ranked by severity of tension, with analysis of genuine conflicts, apparent conflicts, and least costly revisions:

  ### **Ranked Tensions (Most Severe First)**
  1.  **Tension between (3) and (4): Severe Conflict (Epistemic Foundation vs. Prescriptive Method)**  
      *   **Conflict:** (3) asserts that longtermist quantifications involve a "category error" undermining reliability, while (4) mandates using "best available quantitative estimates, including longtermist ones" for expected-value maximization. This is a direct clash: (4) *requires* acting on tools that (3) declares fundamentally flawed for longtermism.  
      *   **Why Genuine:** You cannot simultaneously discredit the epistemic basis of longtermist estimates *and* prescribe their use as reliable inputs for maximization. This risks prescribing action based on methods you admit are unreliable.  
      *   **Least Costly Revision:** Modify (4) to explicitly **exclude domains suffering from the measurability bias/category error identified in (3)**.  
          *   *Revision Cost:* You must specify *which* cause areas/estimates avoid the bias and remain usable under (4). This narrows the scope of expected-value maximization significantly, especially for longtermism. It preserves core consequentialism but weakens EA's universalist claims.

  2.  **Tension between (1) and (2): Moderate-to-Severe Tension (Structural Critique vs. Permissible Participation)**  
      *   **Conflict:** (1) argues EA’s individual focus "systematically obscures" structural harm and risks legitimizing/moral licensing unjust institutions. (2) defends participation (earning-to-give) *within* those institutions, relying on "non-substitutive giving" to avoid licensing. The danger is that *any* participation might reinforce the legitimacy of the system or provide psychological cover, regardless of stated intent.  
      *   **Why Apparent (but Requiring Careful Defense):** This isn't a *logical* contradiction (one *can* earn-to-give while actively fighting the system), but it's a profound *pragmatic/political* tension. The "non-substitutive" clause *aims* to avoid licensing, but:  
          *   **Legitimization Risk:** Earning-to-give within an exploitative system (e.g., finance) inherently signals its acceptability to others, regardless of the earner's private stance.  
          *   **Psychological Burden:** Maintaining genuine, effective parallel activism is demanding; "non-substitutive" risks becoming a self-serving mantra.  
          *   **Resource Diversion:** Time/energy spent earning-to-give is diverted from structural reform.  
      *   **Is it Collapse?** Not necessarily, but avoiding collapse requires rigorous, demonstrable commitment to structural action *equally costly* as the earning effort. It's unstable.  
      *   **Least Costly Revision:** Strengthen (2) by specifying **minimum thresholds or concrete commitments** for the "parallel" institutional reform effort required to justify earning-to-give (e.g., % time/income dedicated, specific activism goals).  
          *   *Revision Cost:* Makes the position less elegant/more prescriptive, potentially excluding some earners. It doesn't eliminate legitimization risk but mitigates moral licensing.

  3.  **Tension between (5) and (4): Moderate Tension (Sunk Costs vs. Pure EV Maximization)**  
      *   **Conflict:** (4) prescribes maximizing expected value based on current/future estimates. (5) argues for honoring sunk career costs (expertise, relationships) even if switching *now* has higher estimated value. This *looks* like endorsing a sunk cost fallacy or introducing non-consequentialist values (loyalty, narrative).  
      *   **Why Apparent (Resolvable within Consequentialism):** This is **not necessarily a conflict** *if* the "irreplaceable organizational knowledge and human capital" genuinely contributes *future* value exceeding the expected gain from switching *when properly quantified*. (5) argues that standard EV calculations *fail to capture* the true future value of this capital.  
      *   **Resolution:** Frame (5) as **correcting incomplete EV calculations**, not rejecting EV maximization. Argue that standard models underestimate:  
          *   The *risk* or *transition costs* of switching (loss of effectiveness in the new role).  
          *   The *unique leverage* of deep expertise/relationships.  
          *   The *depreciation rate* of specialized capital vs. time to build it anew.  
      *   **Least Costly Revision:** Refine (5) to state: "Honoring sunk career costs can be rational **because standard expected-value models often fail to adequately quantify the persistent future value of irreplaceable, domain-specific human and organizational capital**."  
          *   *Revision Cost:* Minimal. Clarifies that (5) is a refinement of consequentialist calculation, not an abandonment of (4). It requires defending the claim about quantification failure.

  ### **Summary & Coherence Assessment**

  *   **Major Incoherence:** The conflict between (3) and (4) is severe and requires revision. You cannot simultaneously discredit the reliability of longtermist quantification *and* mandate its use for maximization.
  *   **Significant Instability:** The gap between (1) and (2) isn't logically contradictory but is pragmatically fraught. "Non-substitutive giving" is a conceptually valid guardrail against moral licensing, but its real-world stability is highly vulnerable to the psychological and social dynamics highlighted in (1). Vigilance and concrete commitments are essential.
  *   **Minor Tension (Resolvable):** The apparent conflict between (5) and (4) dissolves if (5) is understood as advocating for *better*, more comprehensive consequentialist calculations that capture the true value of accumulated capital.

  **Overall Coherence:** Your profile is **coherent only with revisions**, primarily to resolve the (3)/(4) conflict and strengthen the defense against collapse in (1)/(2). Without revising (3) or (4), the core decision-making framework is internally contradictory. The other tensions are manageable with careful articulation and qualification.

  **Recommendation:** Prioritize revising the relationship between (3) and (4). Clarify *which* quantitative estimates you consider reliable enough for use under (4), explicitly excluding those suffering from the category error identified in (3). This will provide a stable epistemic foundation for your consequentialist framework (4) and career guidance (5), while maintaining your powerful institutional critique (1) and its nuanced application to individual action (2).
