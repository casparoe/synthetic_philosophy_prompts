answer: |-
  Here is the exam question, model answer, and marking scheme tailored to your specifications:

  **Exam Question**  
  *Answer in 75 minutes (~900 words). Cite no authors, texts, or dates. Discuss only first principles and formal reasoning.*

  > **The scale argument for insect sentience suggests that even a minuscule prior probability of sentience, multiplied by the vast number of insects (~10^19), generates significant expected moral weight. However, some propose partitioning the reference class: instead of applying a flat prior across all insects, we condition on specific neural architectures (e.g., recurrent processing loops and centralized nociceptive integration). This restricts the class to ~10^12 organisms but may raise the conditional prior within that subset. Evaluate this partitioned approach by:**  
  > **(1) Precisely reconstructing the unpartitioned scale argument’s logic and its moral implication.**  
  > **(2) Assessing whether architectural partitioning is epistemically justified or instead implicitly assumes a controversial theory of consciousness.**  
  > **(3) Analyzing the moral-risk asymmetry: if partitioning lowers aggregate expected suffering (due to a smaller reference class) but increases confidence per individual, does this strengthen or weaken the case for intervention?**  
  > **(4) Determining whether the argument requires sentience to be binary or graded, and how this choice affects the arithmetic of expected suffering.**  

  ---

  **Model Answer** (756 words)  
  **Block 1: Reconstruction**  
  The unpartitioned scale argument formalizes expected moral weight (EMW) as:  
  > *EMW = N × P(S) × M*  
  where *N* ≈ 10^19 (insect count), *P(S)* is the prior probability of sentience per insect, and *M* is the moral weight if sentient. Crucially, it contends that even if *P(S)* is extremely low (e.g., 10^−10), *N* is so vast that *N × P(S)* remains substantial (e.g., 10^9 sentient equivalents). Thus, if *M > 0*, aggregate EMW demands moral consideration. The argument exploits insensitivity to microscopic probabilities at scale: if we grant a non-zero *P(S)*, colossal *N* dominates the product.  

  **Block 2: Epistemic Justification**  
  Partitioning replaces the flat prior *P(S)* with *P(S|A)*, where *A* denotes a specific neural architecture (recurrent loops + centralized nociception). This appears epistemically prudent: conditioning on correlates of consciousness should refine probability estimates. However, this move implicitly assumes **functionalism**—the view that consciousness arises from computational structure alone. By treating *A* as a sufficient proxy for sentience, we presuppose that physical implementation details (e.g., carbon- vs. silicon-based systems) are irrelevant, and that *A*’s causal topology guarantees phenomenal binding. This is controversial: anti-functionalists (e.g., biological naturalists) argue that *A* may be necessary but not sufficient without undiscovered biological properties. Partitioning thus risks smuggling in functionalism as a hidden premise. Without defending this theory, selecting *A* as the reference class is question-begging; it presumes the very architectural criteria that functionalism legitimizes.  

  **Block 3: Moral-Risk Asymmetry**  
  Partitioning creates a trade-off:  
  - **Raised conditional prior**: *P(S|A) > P(S)* (e.g., 10^−7 vs. 10^−10), increasing confidence per individual.  
  - **Shrunk reference class**: *N_A* ≈ 10^12 << *N*, reducing aggregate expected sentient beings (*N_A × P(S|A)* = 10^5 vs. *N × P(S)* = 10^9).  

  This asymmetry alters interventionist calculus:  
  - **Strengthening case**: Higher *P(S|A)* justifies targeting interventions (e.g., humane insecticides) at *A*-insects, as actions per individual carry less ethical uncertainty.  
  - **Weakening case**: Lower aggregate EMW (*N_A × P(S|A) × M*) diminishes the urgency of *large-scale* interventions (e.g., agricultural reform), as the expected moral value at stake shrinks. Crucially, if we prioritize minimizing *worst-case suffering*, partitioning may weaken precaution. Unpartitioned EMW’s sheer scale acts as a risk buffer: even if *P(S)* is wrong by orders of magnitude, *N* compensates. Partitioning forfeits this robustness—if *P(S|A)* is overestimated (e.g., architecture ≠ sentience), the smaller *N_A* offers no such hedge. Thus, partitioning trades aggregate precaution for per-target confidence, potentially *undercutting* the scale argument’s core strength: insensitivity to low probabilities.  

  **Block 4: Binary vs. Graded Sentience**  
  The argument’s validity hinges on whether sentience is **binary** (present/absent) or **graded** (degrees of richness).  
  - **Binary view**: EMW depends only on *P(S)* and *N*. Partitioning’s shrinkage of *N* to *N_A* is decisive, as non-*A* insects contribute zero EMW.  
  - **Graded view**: Sentience varies (e.g., by neural complexity), so *M* becomes a function of architecture. Partitioning now affects *both* terms: *P(S|A)* and *M(A)*. For instance, insects with *A* might have *M(A) > 0* but << human *M*, while simpler insects have *M ≈ 0*. Crucially, EMW becomes ∑[ *N_i × P(S_i) × M_i* ] across architectures. This undermines partitioning’s simplicity: even if *A*-insects have higher *P(S|A)* and *M*, the residual EMW from non-*A* insects (with low-but-nonzero *M_i*) could dominate due to their colossal numbers. The scale argument thus *depends* on binarism; under gradation, neglecting sub-*A* architectures risks ignoring orders of magnitude more expected suffering—precisely the error partitioning aimed to fix.  

  **Conclusion**  
  Partitioning refines the scale argument by targeting neural correlates, but at high costs: it covertly relies on functionalism, reduces aggregate EMW (weakening precautionary leverage), and assumes binary sentience. While optimizing interventions for *A*-insects, it may underestimate systemic risk. Graded sentience, if plausible, resurrects the unpartitioned argument’s force against partitioning.  

  ---

  **Marking Scheme (20 points)**  
  **A (16–20)**: Coherent structure; addresses *all four* blocks with precision; exposes hidden assumptions.  
  **B (12–15)**: Competent but superficial in ≥1 block; misses nuances below.  

  | **Block**               | **Points** | **A-grade Requirement**                                                                 | **Common B-error (Costs 1–2 pts)**                              |
  |--------------------------|------------|-----------------------------------------------------------------------------------------|------------------------------------------------------------------|
  | **1. Reconstruction**    | 4          | Formalizes EMW = *N × P(S) × M*; explains *N*’s dominance over microscopic *P(S)*.     | Vague handwaving about "big numbers"; omits *M* or formal product. |
  | **2. Partitioning Eval** | 5          | **Identifies functionalism as hidden commitment**; shows criteria presuppose sufficiency. | Accepts neural criteria uncritically; no theory-of-consciousness link. |
  | **3. Risk Asymmetry**    | 5          | **Balanced analysis**: ↑confidence per case vs. ↓aggregate EMW + ↓precautionary buffer. | Treats asymmetry as one-sided (e.g., "only ↑confidence matters"). |
  | **4. Binary/Graded**     | 4          | **Defends stance**: Shows binarism simplifies, gradation multiplies variables/uncertainty. | Assumes binary sentience without justification.                 |
  | **Coherence**            | 2          | Logical sequencing; no contradictions; concise synthesis of blocks.                     | Disjointed arguments; repetition; conclusion ignores earlier points. |

  ---
  **Rationale for Design**  
  - The question **forces architectural engagement** by specifying neural criteria (recurrent loops/centralized nociception), avoiding "tiny prior" recitals.  
  - **Model answer highlights**: Bayesian update (*P(S|A)* vs. *P(S)*), explicit "functionalism" naming, risk asymmetry dissection, and gradation’s arithmetic consequences.  
  - **Marking scheme penalizes**: Missing functionalism (Block 2), unbalanced risk analysis (Block 3), and unexamined binarism (Block 4)—typical B-level gaps.  
  - **Anti-citation enforcement**: No proper names/dates; all concepts derivable from first principles (e.g., "anti-functionalists" as placeholder).  

  This tests whether students can *deconstruct* the scale argument’s assumptions—not just apply it.
