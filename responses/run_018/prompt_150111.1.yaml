prompt: |-
  I'm taking a philosophy of mind seminar this semester focused on personal identity and cognitive architecture, and I'm preparing a paper on whether an "I" can be genuinely distributed across multiple brains in the manner Hofstadter proposes—treating the self as a pattern capable of persisting in others rather than being locked to a single biological substrate. Before I evaluate any specific account, I want the full specification of adequacy: what must any theory of trans-brain or distributed personal identity deliver to count as successful?

  Please respond in American English and structure your answer around the following. First, lay out the phenomena the theory must explain: first-person authority under concurrent instantiation, the continuity of autobiographical memory when storage or processing is partly external or hosted in another brain, and what I will call interstitial agency—the problem of attributing authorship to a decision when two host brains contribute without either having exclusive access. Second, list the distinctions the theory must preserve—especially between pattern-continuity and biological-continuity, between shared experience and merged identity, and between possessing a self and possessing the same kind or degree of self—giving the motivating case or conceptual pressure behind each. Third, identify results from neuroscience or cognitive science that the theory must remain consistent with, such as findings from split-brain research or work on extended cognition, and flag any pair of desiderata you suspect are jointly unsatisfiable—for example, preserving first-person asymmetry while allowing full pattern duplication across hosts. Fourth, state which single requirement is likely to eliminate the largest number of popular theories, with a brief explanation of why. Finally, briefly score Hofstadter's pattern-persistence view, a standard biological-continuity account, and one functionalist alternative against your list—just enough to show where each stands or falls, without developing full defenses.

  Keep the weight on the criteria and their motivating cases rather than on the scoring, since the evaluation standard itself is what I need. I am not asking for a bibliography, reading list, or citations; I want the desiderata specification itself.
reasoning: |-
  Okay, let me approach this systematically. The user is working on a philosophy of mind paper about distributed personal identity and needs clear criteria to evaluate theories. 

  First, I need to consider their specific focus on Hofstadter's patternist view versus biological and functionalist accounts. They want adequacy conditions structured in four precise categories: explanatory targets, necessary distinctions, empirical constraints, and a critical filter. 

  For the phenomena section, I'm thinking through first-person authority issues - how would a distributed self handle the "who's in charge?" problem when multiple brains host the same pattern? Autobiographical memory continuity gets tricky if parts are stored externally or in other brains. And interstitial agency is particularly thorny - if two brains co-produce a decision without full mutual access, who claims authorship? 

  The distinctions part requires careful boundary-drawing. Pattern vs biological continuity needs to avoid smuggling in biological assumptions. Shared experience vs merged identity matters for cases like twins or deeply bonded couples who don't become a single person. Same-kind vs same-degree of self addresses whether partial pattern replication creates a diluted self or a full but different instantiation.

  Empirical consistency is crucial. Split-brain research shows the brain can host fragmented awareness, challenging unity assumptions. Extended cognition studies blur the mind-boundary but don't necessarily distribute identity. The big tension I see is between first-person asymmetry (my pain feels uniquely mine) and full pattern duplication - can two instances both claim "I" without contradiction?

  For the critical filter, first-person asymmetry seems most devastating to naive distribution theories. If any perfect copy can say "I am you," it collapses subjective perspective - hence Hofstadter's insistence on pattern isolation to avoid this. 

  In the quick scoring: Hofstadter handles pattern continuity well but stumbles on first-person authority during concurrent instantiation. Biological accounts preserve asymmetry but reject distribution outright. Functionalist views might handle memory continuity but struggle with authorship in interstitial cases.

  The user's framing suggests they suspect interstitial agency might be the make-or-break issue. I'll flag that while keeping focus on the criteria architecture they requested.
answer: |-
  Here is a specification of adequacy criteria for a theory of trans-brain or distributed personal identity, structured as requested:

  **I. Phenomena the Theory Must Explain**
      1.  **First-Person Authority under Concurrent Instantiation:** How does a single "I" claim unique, authoritative access to its own subjective states (thoughts, sensations, intentions) when the pattern is instantiated simultaneously in multiple distinct biological substrates (host brains)? The theory must resolve conflicts where both instantiations might assert "I am experiencing X *right now*" without dissolving into multiple distinct "I"s or negating the privileged access characteristic of selfhood.
      2.  **Continuity of Autobiographical Memory with External/Shared Storage:** How does personal identity persist when core components of autobiographical memory are stored externally (e.g., digital diaries, cloud storage) or hosted/processed primarily within *another* brain hosting the same pattern? The theory must account for the coherence and ownership of memories accessed by a distributed self across different substrates over time, ensuring the memories feel genuinely "mine" regardless of their physical location.
      3.  **Interstitial Agency:** How is authorship and responsibility attributed to a decision or action when it arises from the *joint, interdependent processing* of two (or more) host brains contributing to the same distributed self-pattern, where *neither* brain possesses exclusive access to the complete causal chain or final motivational state preceding the action? The theory must explain how "I" (the distributed pattern) am the author, not merely the hosts acting in concert.

  **II. Distinctions the Theory Must Preserve**
      1.  **Pattern-Continuity vs. Biological-Continuity:** Must clearly differentiate persistence based solely on the maintenance of a specific cognitive/functional *pattern* from persistence based on the continuous existence of the original biological organism/brain. *Motivation:* To avoid collapsing the core question; biological continuity theories (e.g., animalism) explicitly *deny* the possibility of genuine trans-brain identity, so a successful distributed theory must offer a distinct criterion.
      2.  **Shared Experience vs. Merged Identity:** Must distinguish between two distinct individuals deeply understanding each other's perspectives or sharing intense experiences (e.g., deeply bonded twins, couples) and two biological substrates genuinely hosting *a single, unified personal identity*. *Motivation:* To prevent over-inflation where deep empathy or coordination is mistaken for ontological identity merger.
      3.  **Possessing *a* Self vs. Possessing the *Same* Self (Kind/Degree):** Must distinguish between:
          *   *Possessing a Self:* Any sentient being has *some* form of self.
          *   *Possessing the Same Kind of Self:* Hosting an instance of a pattern sufficiently similar in structure/function to qualify as the same *type* of self (e.g., "another Hofstadter-type self").
          *   *Possessing the Same Self (Numerical Identity):* Hosting an instance that *is* the very same individual person (e.g., "this *is* Douglas Hofstadter").
          *Motivation:* To address partial replication, degradation, or variations in instantiation (e.g., a backup with slight drift, a "forked" version). The theory must specify what constitutes numerical identity vs. similarity.

  **III. Empirical Constraints & Potential Conflicts**
      1.  **Must Be Consistent With:**
          *   **Split-Brain Research:** Demonstrates that a single biological brain can host fragmented, potentially conflicting streams of awareness and agency, challenging simple unity assumptions.
          *   **Findings on Extended Cognition:** Shows cognition reliably offloading onto external tools (notebooks, smartphones), supporting the *functional* extension of mental processes beyond the skull.
          *   **Neural Correlates of Self/Consciousness:** Identifies brain networks (e.g., Default Mode Network) strongly associated with self-referential processing and autobiographical memory, raising questions about substrate dependence.
          *   **Robustness vs. Fragility of Identity:** Evidence from dementia, brain injury, and psychiatric conditions showing identity can degrade or fragment despite biological continuity, suggesting pattern matters.
      2.  **Potentially Jointly Unsatisfiable Desiderata:**
          *   **First-Person Asymmetry & Full Pattern Duplication:** Preserving the essential subjective asymmetry of the first-person perspective ("*This* pain is mine alone") seems fundamentally incompatible with the claim that two distinct biological entities simultaneously hosting the *exact same* pattern are *both* the *one and only* "I". One perspective must be privileged, or the concept of a unique "I" dissolves.

  **IV. Critical Requirement Likely to Eliminate Most Theories**
      *   **Resolving First-Person Authority under Concurrent Instantiation.** This directly confronts the core intuition of subjective singularity. Most theories either:
          *   **Deny Concurrent Instantiation is Possible for a True Self:** (Common in biological/substance-based views).
          *   **Collapse into Multiple Selves:** Treating each instantiation as a new, distinct self (defeating the distributed identity claim).
          *   **Struggle to Explain Privileged Access:** How can *both* instantiations have authoritative, non-inferential access to the *same* subjective state simultaneously? Failure here likely indicates the theory cannot handle the fundamental challenge of distributed *subjectivity*.

  **V. Brief Scoring Against Criteria**

  1.  **Hofstadter's Pattern-Persistence View:**
      *   **Strengths:** Excels at Pattern-Continuity (core thesis), potentially handles Autobiographical Memory Continuity via pattern replication. Distinguishes Pattern vs. Biological Continuity well. Consistent with Extended Cognition & Robustness/Fragility findings.
      *   **Weaknesses:** **Major failure on First-Person Authority under Concurrency** (dismisses it as "no problem" without resolving the asymmetry conflict). Struggles with **Interstitial Agency** (how does the *pattern itself* author actions between hosts?). Unclear on **Same Kind vs. Same Self** distinction for forks/partial copies. Vulnerable to the Asymmetry/Duplication conflict.

  2.  **Standard Biological-Continuity Account:**
      *   **Strengths:** Easily preserves **First-Person Authority** (single biological locus), **Distinctions** (clear biological boundary defines self), consistent with neural correlates.
      *   **Weaknesses:** **Fails fundamentally** on core phenomena: Denies possibility of Distributed Identity, thus cannot explain Trans-brain Memory, Interstitial Agency, or Pattern-Continuity. Inconsistent with Extended Cognition implications. Cannot handle identity changes despite biological continuity (Robustness/Fragility).

  3.  **Functionalist Alternative (e.g., emphasizing causal role/global workspace):**
      *   **Strengths:** Strong on Pattern-Continuity (identity = functional role). Can potentially handle Autobiographical Memory Continuity via functional equivalence. Consistent with Extended Cognition & Split-Brain findings (functional fragmentation). Better equipped for **Interstitial Agency** if the distributed system realizes the functional role.
      *   **Weaknesses:** **Serious difficulty with First-Person Authority under Concurrency** (if functional role is duplicated, why isn't subjectivity duplicated/multiplied?). Can blur **Shared Experience vs. Merged Identity** (if function defines identity, deep coupling might imply merger). Unclear on **Same Kind vs. Same Self**. Also vulnerable to Asymmetry/Duplication conflict.

  This framework prioritizes the specification of adequacy conditions and their motivations as requested. The scoring illustrates how applying these criteria immediately highlights critical challenges and potential deal-breakers for prominent theories of distributed identity.
