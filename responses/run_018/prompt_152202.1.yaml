  The stall factors include definitional divergence, disciplinary differences (epistemology vs. cognitive science), and changing philosophical trends. Resolving it might require disambiguating the term into different concepts for different purposes. For example, distinguishing between logical analyticity, conceptual necessity, and pragmatic entrenchment.

