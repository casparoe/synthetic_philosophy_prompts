prompt: |-
  ok so the analytic versus synthetic distinction has been stuck since quines Two Dogmas came out and people are still writing papers defending some version of the split. but im not sure if the stall is real or if its just that analytic means different things in different mouths—like reduction to experience versus default conceptual entrenchment versus logical truth by convention. is this a verbal dispute, or are there actual competing theories of how concepts stabilize? heres a twist: suppose theres this niche view, call it gradient analyticity, where sentences dont fall into bins but sit on a spectrum of cognitive entrenchment, and the defenders say quine and his critics are both wrong because they share the false assumption that boundaries are sharp. does this third camp expose a hidden false dichotomy, or does it just add noise? diagnose the stall for me—what kind of disagreement is it, what feature keeps it going, and what would actually count as resolving it? also, if you had to bet, is the whole vocabulary salvageable or should we just drop analytic and talk about entrenchment degrees instead?
