answer: |-
  ### Exam Question Prompt  
  **Decision Theory Midterm - Question 3 (25 marks)**  

  Revealed Preference Theory (RPT) posits that preferences can be inferred directly from observed choices. A key objection is the "regret problem": agents often make choices they later regret (e.g., binge-watching low-quality videos), suggesting actions ≠ true preferences.  

  Suppose we observe *stable ordinal rankings* in user engagement data (e.g., Video A > B > C consistently) across diverse contexts:  
  - Different platforms (mobile vs. desktop)  
  - Different times/time zones  
  - Varying UI layouts  

  **Argue whether this cross-context stability rescues RPT from the regret objection.** In your response:  
  1. Explain why stability might strengthen RPT against claims of transient irrationality.  
  2. Assess whether ordinal rankings alone suffice to define "preference," or if cardinal utility (intensity of preference) is necessary.  
  3. Address whether algorithmic nudges (e.g., autoplay, default rankings) could generate "false stability" that mimics preferences.  

  ---  
  ### Model Answer (Approx. 600 words)  

  Cross-context stability in choices—such as consistent video rankings across devices and times—*partially* mitigates the regret objection but fails to fully rescue Revealed Preference Theory (RPT) due to unresolved issues in preference ontology and algorithmic interference.  

  Stability offers a pragmatic defense of RPT by suggesting that persistent choice patterns reflect coherent preferences, not random errors. If users consistently rank options identically despite contextual shifts (e.g., from mobile fragmentation to desktop focus), this implies a robust ordinal structure resistant to transient distractions. Regret often arises from impulsive, context-specific decisions (e.g., tired late-night clicks), but stability signals deliberative alignment across states, weakening objections that choices are purely myopic. RPT could thus argue that stability reveals "meta-preferences" — e.g., a user’s preference for novelty-seeking despite regretting specific videos.  

  However, stability alone cannot resolve two core problems. First, **ordinal rankings ignore preference intensity**, which is central to regret. Cardinal utility captures *how much* an agent values A over B, explaining why consistent choices may still cause regret if intensities clash with outcomes (e.g., always clicking trashy videos due to autoplay, despite weakly preferring them). If a user consistently chooses A > B but rates both as "mediocre" post-hoc, ordinal stability misrepresents shallow engagement as meaningful preference. RPT’s ordinal framework cannot distinguish between "strong conviction" and "apathetic habit," leaving regret unaddressed.  

  Second, **stability may be artificially induced by algorithmic nudges**, not genuine preferences. Platforms use engagement-optimizing interfaces (e.g., default playlists, ranked feeds) that funnel choices into predictable paths. A user’s stable "preference" for Recipe Videos > Fitness Content might reflect UI-driven habit formation (e.g., always showing recipes first), not organic desire. This "false stability" conflates revealed choices with *system-manipulated behavior*, making RPT’s inference circular: choices reflect the algorithm’s design, not pre-existing preferences. When users later regret bingeing, it exposes this manipulation—not transient irrationality.  

  Ultimately, cross-context stability reduces noise but cannot save RPT. It sidesteps regret’s cardinal dimension (e.g., "I always pick A > B, but I *hate* A slightly less") and ignores how algorithmic environments manufacture consistency. True preferences require cardinal separability (e.g., "I love B 10× more than A") to explain why regret persists despite stability. Without this, RPT remains descriptive, not normative.  

  ---  
  ### Marking Scheme (Total: 25 marks)  
  **A-Grade (21–25 marks):**  
  - Hits all 5 must-address points below.  
  - Explicitly links cardinal utility to regret’s intensity.  
  - Uses "algorithmic nudges" as a critical counterargument to stability.  
  - Distinguishes between ontological preference (what users value) and revealed choice.  

  **B-Grade (16–20 marks):**  
  - Addresses 3–4 points but lacks depth in cardinality/nudges.  
  - Treats stability as prima facie evidence for RPT without critical scrutiny.  
  - Mentions regret but doesn’t tie it to intensity measurement.  

  #### Must-Address Points (5 points, 5 marks each):  
  1. **Regret objection summary** (5 marks):  
     - Explains regret as choices conflicting with post-hoc evaluations (e.g., "I clicked it but hated it").  
     - *Missing in B: Assumes regret implies irrationality without defining its challenge to RPT.*  

  2. **Stability as a defense of RPT** (5 marks):  
     - Argues cross-context consistency reduces noise/impulsivity, suggesting durable preferences.  
     - *B-level mistake: Treats stability as automatic proof of preference, ignoring nested regrets.*  

  3. **Ordinal vs. cardinal utility distinction** (5 marks):  
     - States that ordinal rankings lack intensity data; cardinal utility measures strength (e.g., "how much" A is preferred).  
     - *A-grade insight: Notes stable ordinal choices can mask "weak" preferences that still cause regret.*  

  4. **Algorithmic nudges as "false stability"** (5 marks) — **KEY POINT**:  
     - Critiques that UI/algorithm design (e.g., autoplay, defaults) can manufacture consistency, mistaking *induced behavior* for true preference.  
     - *B-level mistake: Omits this or treats nudges as neutral rather than preference-corrupting.*  

  5. **Synthesis conclusion** (5 marks):  
     - Judges whether stability rescues RPT (e.g., "partially, but fails due to cardinality/nudges").  
     - *A-grade: Rejects RPT’s sufficiency; B-grade: Overvalues stability’s evidentiary role.*  

  ---  
  **Notes for Graders:**  
  - Award full marks for point 4 only if students explicitly name "algorithmic nudges" and explain how they simulate false preferences.  
  - Deduct 2 marks if cardinal utility is mentioned but not tied to regret’s intensity.  
  - Top marks require concluding that stability without cardinality/nudge-awareness is insufficient.
