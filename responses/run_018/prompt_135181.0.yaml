answer: |-
  **MINISTRY OF ONTOLOGICAL AFFAIRS**  
  **HANDBOOK FOR CITIZEN ONTOLOGICAL COMPLIANCE (Revision 7.3)**  

  **1. PURPOSE AND SCOPE**  
  1.1 This handbook outlines the mandatory procedures governing the registration, application, and maintenance of Ontological Stances towards entities within the jurisdiction of the State, pursuant to the Ontological Consistency Act (OCA).  
  1.2 Compliance ensures predictive efficiency and prevents ontological clutter, thereby conserving national cognitive resources.  

  **2. DEFINITIONS**  
  2.1 **Real Pattern:** A data structure exhibiting sufficient regularity such that:  
  &nbsp;&nbsp;&nbsp;&nbsp;2.1.1 Its description compresses information about the target system's past states and behaviors.  
  &nbsp;&nbsp;&nbsp;&nbsp;2.1.2 It reliably supports counterfactual predictions regarding the system's future states and behaviors under varying conditions.  
  &nbsp;&nbsp;&nbsp;&nbsp;2.1.3 Patterns failing 2.1.1 or 2.1.2 are classified as "Mere Appearance" and lack protected ontological status.  
  2.2 **Ontological Stance:** A legally recognized predictive strategy applied to an entity. Three stances are permissible:  
  &nbsp;&nbsp;&nbsp;&nbsp;2.2.1 **Physical Stance (PS):** Prediction based on known physical laws governing fundamental particles, forces, and states. Applicable to all matter-energy systems, but inefficient for complex systems (see Sec 3.4.3).  
  &nbsp;&nbsp;&nbsp;&nbsp;2.2.2 **Design Stance (DS):** Prediction based on assumed functional design or evolved purpose. Applicable to artifacts (e.g., thermostats, vehicles) and evolved biological components (e.g., hearts, kidneys, visual systems).  
  &nbsp;&nbsp;&nbsp;&nbsp;2.2.3 **Intentional Stance (IS):** Prediction by attributing beliefs, desires, and rationality to an entity. Applicable only where DS or PS prove insufficiently predictive for complex behavioral patterns.  

  **3. REGISTRATION AND APPLICATION**  
  3.1 All citizens must annually register their Primary Predictive Stance (PPS) for interacting with key entities (Spouse/Partner, Primary Occupation, Primary Vehicle, Primary Companion Animal) via Form 7-B: Stance Declaration.  
  3.2 **Stance Assignment for Entities:**  
  &nbsp;&nbsp;&nbsp;&nbsp;3.2.1 Entities must be registered under *one* Primary Predictive Stance based on demonstrated compressive success and counterfactual projectibility.  
  &nbsp;&nbsp;&nbsp;&nbsp;3.2.2 **Ontological Double-Bookkeeping Prohibition (ODP):** Registering an entity simultaneously under DS and IS is prohibited unless:  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;3.2.2.1 The citizen submits Form 12-D: Dual-Stance Justification, demonstrating independent predictive utility for *each* stance in distinct behavioral domains.  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;3.2.2.2 Annual predictive efficiency audits for both stances are passed.  
  3.3 **Intentional Stance Restrictions:**  
  &nbsp;&nbsp;&nbsp;&nbsp;3.3.1 Adoption of IS towards entities not biologically human requires a Class-3 Stance License.  
  &nbsp;&nbsp;&nbsp;&nbsp;3.3.2 License acquisition necessitates passing Exam ONT-451: "Rational Attribution & Boundary Conditions," covering:  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;3.3.2.1 Failure modes of anthropomorphism.  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;3.3.2.2 Cost-benefit analysis of IS vs. DS for non-human entities.  
  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;3.3.2.3 Recognizing when predictive failures necessitate stance revocation (Sec 5.2).  
  &nbsp;&nbsp;&nbsp;&nbsp;3.3.3 *Example: "Thermostat Model T-45 registration under IS denied (Case #45-78b). Registration under DS approved, as thermal regulation function exhibits high predictability via functional specification alone."* (Ministry Ruling, Annex D)  

  **4. COMPLIANCE AND TAXATION**  
  4.1 **Stance-Redundancy Tax (SRT):**  
  &nbsp;&nbsp;&nbsp;&nbsp;4.1.1 Levied when a citizen utilizes a lower-efficiency stance where a higher-efficiency stance is already registered and demonstrably predictive for the same event.  
  &nbsp;&nbsp;&nbsp;&nbsp;4.1.2 Example: Utilizing PS (e.g., citing quantum electron tunneling) to explain a laptop failure when DS (e.g., citing known firmware bug documented by manufacturer) provides a more compressed, equally or more accurate prediction. Tax rate: 15% of estimated cognitive cost differential.  
  4.2 **Mandatory Re-education:**  
  &nbsp;&nbsp;&nbsp;&nbsp;4.2.1 Persistent application of a non-PPS towards a registered entity, or application of a stance deemed inefficient by Ministry standards, triggers enrollment in Ontological Recalibration Module (ORM).  
  &nbsp;&nbsp;&nbsp;&nbsp;4.2.2 *"Subject filed Form 7-B registering Spouse under PS. Subject documented utilizing PS to predict Spouse's attendance at social event ('Her molecular state implies trajectory towards kitchen, not car'). This is technically permissible under 3.1 but deemed inefficient. ORM mandated to encourage DS ('Spouse functions as social agent, likely adhering to calendar commitment') or IS registration. Complaint that 'love feels physical' noted but deemed irrelevant to predictive efficiency."* (Inspector's Report, Case #102-33)  

  **5. ENFORCEMENT AND REVOCATION**  
  5.1 **Predictive Failure Audit:** Citizens must log stance-driven predictions for registered entities quarterly (Form 9-Q: Prediction Ledger). Success rate below 70% triggers review.  
  5.2 **Failed-Prediction Revocation Clause:**  
  &nbsp;&nbsp;&nbsp;&nbsp;5.2.1 If a citizen's registered stance towards an entity exhibits consistent predictive failure (as per 5.1 audits), the *citizen's registration* for that entity is suspended, pending ORM completion.  
  &nbsp;&nbsp;&nbsp;&nbsp;5.2.2 The entity's *inherent nature is not subject to review or revision*. Revocation addresses faulty strategy application, not ontological error.  
  &nbsp;&nbsp;&nbsp;&nbsp;5.2.3 Example: Citizen registers pet dog under IS but consistently mispredicts behavior (e.g., attributing complex deception where simpler DS explanations exist). IS registration is revoked; citizen must re-qualify for Class-3 License and demonstrate improved predictive strategy.  

  **6. APPEALS AND AMENDMENTS**  
  6.1 Citizens may appeal stance registrations, denials, or revocations to the Bureau of Ontological Review (BOR) by submitting documented evidence of superior predictive compression and counterfactual projectibility for the proposed stance.  
  6.2 Annual registration renewal requires submission of Form 7-BR, including a summary of the previous year's Form 9-Q prediction success rates for each registered entity.  

  The consistent predictive failure of a citizen's registered stance necessitates the suspension of the citizen's classification rights, not the reclassification of reality.
