prompt: |-
  Write a deadpan parody of an official government handbook—approximately 650 words, formatted as numbered sections with subclauses—issued by the fictional Ministry of Ontological Affairs in a state where Daniel Dennett's framework of real patterns and the three predictive stances (physical, design, intentional) has been codified into civil law. Adopt the voice of a dry bureaucratic manual: no winking, no explicit jokes, no direct acknowledgment that the premise is absurd. The satire should exaggerate the genuinely pragmatic feature of Dennett's view—namely, that adopting a stance is a predictive strategy justified by compressive success and counterfactual projectibility, not a discovery of intrinsic ontological kinds—by treating the stances as legally binding identity categories that citizens must register, defend in court, and renew annually.

  To ensure the philosophy is accurate rather than straw-manned:
  - Define "real patterns" precisely: they earn legal recognition only when they support counterfactual predictions and data compression; patterns that fail predictive tests are downgraded to "mere appearance" and lose protected status.
  - Define the three stances with correct predictive scopes: the physical stance for fundamental forces and particles; the design stance for artifacts and evolved biological functions (hearts, kidneys, engineered chips); the intentional stance for entities whose behavior is best anticipated by attributing beliefs, desires, and rationality.
  - Invent regulations that follow this logic to absurd ends: for instance, a "stance-redundancy tax" levied when a citizen uses the physical stance to explain a laptop failure that the design stance already predicts; a licensing exam required before adopting the intentional stance toward non-human animals; a prohibition on "ontological double-bookkeeping" (simultaneously registering an entity under both design and intentional categories unless independent predictive utility is demonstrated for each); and a "failed-prediction revocation" clause stating that if a stance consistently mispredicts, the citizen's registration is suspended, not the entity's nature revised.
  - Include at least one invented quotation—clearly marked as extracted from a bureaucratic form or a "concerned citizen" affidavit—that captures the tension between pragmatic stance-adoption and legal essentialism, such as a complaint that treating one's spouse via the physical stance is technically permitted but triggers mandatory social-re-education, or a footnote clarifying that a thermostat denied intentional-stance registration may still be explained via the design stance if its thermal behavior is functionally predictable.
  - Ensure the piece is readable to a non-specialist, but precise enough that someone familiar with Dennett recognizes that the author understands the distinction between a real pattern and a useful fiction, and that stance-choice is always answerable to predictive success rather than metaphysical commitment.

  Do not include bibliographies, reading lists, citations, or references to specific page numbers. Do not place any real textual passage inside quotation marks; if quotation marks appear, they must enclose only invented dialogue or document excerpts.

  End the response with a single final line—nothing may follow it—summarizing the handbook's central bureaucratic absurdity in one sentence.
