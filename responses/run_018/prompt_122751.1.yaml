prompt: |-
  Hi there. I'm a journalist — I mostly cover science and ideas, but I've spent the last year or so doing a run of peices on anti-corruption, and I keep stumbling into the same shape of story and I don't have a word for it, which is becoming a problem because I'd like to use the word in print without a footnote saying "sort of like Goodhart's law."

  Three instances. A city hospital bans staff from accepting gifts from suppliers: within a year the gifts are gone from the ledger, and the doctors' relatives have started turning up as paid "consultants" to the same suppliers. A country introduces competitive exams for government hiring to kill off patronage: applications and test scores go up and up, and the ministries respond by moving work onto short-term consultancy contracts that never go through the exam. A transparency rule requires that allocative decisions be justified in an open meeting: the meetings get beautifully documented, and the real decision now gets made in the corridor beforehand, so the minutes record a ratification nobody disagreed with.

  The pattern I think I'm seeing: the reform targets a channel, the favouritism doesn't shrink so much as relocate — and it relocates to a channel nobody was previously measuring, which is exactly why the reform looks like it worked on every indicator anyone collects. So there are two things tangled together, the displacement itself and the fact that the displacement is invisible to the very metrics that were supposed to certify success.

  Is there an established concept or literature for this? I've heard corruption described as being like water, finding whatever crack is open, and I know about measures becoming targets when they're used for decisions, but neither seems to be quite it: the first is a metaphor rather than a claim with edges, and the second is about people gaming a number, whereas here the underlying thing — who actually gets the job, the contract, the bed — may not have improved at all while nobody is gaming anything. There's also ordinary circumvention: every tax code breeds avoidance, and I don't want a term so broad it covers that too.

  If there's no name, I'd rather have a good carve than a label. What exactly is this, and what isn't it? I want to know how to tell it apart from genuine reduction that just leaves messy residue, from a reform that was cosmetic from day one, and from the sort of adaptive rule-dodging that any prohibition produces. And I'd want the boundary cases sorted: does it count when the new channel leaves people better off than the old one did (a gift ban that pushes procurement toward open tendering is different from one that pushes it toward cousins), or does the concept only apply when the substance is unchanged and only the surface has been cleaned? Also, a practical worry for the piece: if the target is unobservable and the proxy improves, is there any principled way to say whether the balloon was squeezed or deflated, or is that just permanently underdetermined?
reasoning: |-
  Okay, the user is a journalist covering science and anti-corruption, and they've encountered a recurring pattern in their stories. They need a term or concept for when anti-corruption reforms cause favoritism to relocate to unmeasured channels, making the reform appear successful based on existing metrics. They mentioned examples like gift bans leading to relatives as consultants, competitive exams shifting to consultancy contracts, and transparency rules moving decisions to corridors.

  First, I should recall related concepts. Goodhart's Law comes to mind—when a measure becomes a target, it ceases to be a good measure. But the user feels it's not a perfect fit because here, the underlying issue isn't necessarily gamed; it just moves. Displacement is another term, but it's broad and used in various fields. Regulatory displacement might be closer, especially in corruption contexts, but maybe not widely recognized.

  The user wants to distinguish this from general circumvention, like tax avoidance. They also need boundaries: when does the relocation improve things versus just hiding the problem? And how to tell if the reform actually reduced corruption or just moved it.

  Looking at academic literature, Susan Rose-Ackerman's work on corruption displacement is relevant. She discusses how reforms can shift corrupt practices to new areas. The Policy Implementation Gap concept also fits—where the intent of a policy isn't realized due to adaptive behaviors. 

  The user might need a precise term for their articles. Since "corruption displacement" isn't widely known, suggesting "metric displacement" or "accountability diversion" could work. Explaining the concept clearly with their examples would help readers understand even without a standard term.

  They also need to differentiate from cosmetic reforms. Emphasizing that the underlying behavior persists but becomes invisible to metrics is key. Practical advice on detecting this, like looking for qualitative evidence or anomalies in data, would be useful for their journalism.

  Deep down, the user might want to not only name the phenomenon but also critique ineffective reforms and advocate for more robust measures. Highlighting the invisibility to metrics underscores the challenge in evaluating anti-corruption efforts, which is crucial for their narrative.
answer: |-
  This is a brilliantly articulated pattern, and you're absolutely right that existing terms (Goodhart's Law, displacement metaphors, circumvention) feel close but not *quite* precise enough for this specific phenomenon. You've identified a critical flaw in anti-corruption/metric-driven reform design.

  Here's a breakdown of the existing concepts and why they fall short, followed by the best-fitting terminology and a framework for carving out the boundaries:

  ### Why Existing Terms Don't Quite Fit

  1.  **Goodhart's Law ("When a measure becomes a target, it ceases to be a good measure"):**
      *   **Misfit:** Goodhart's is primarily about the *measure itself* being gamed or distorted (e.g., teaching to the test, manipulating statistics). In your cases, the *targeted measure* (gifts on ledger, exam scores, meeting minutes) *genuinely improves*. The problem is the *underlying behavior* (favoritism) relocates to an *unmeasured* domain. The measure isn't corrupted; it becomes irrelevant because the action moved elsewhere.
  2.  **"Corruption is like water / Displacement":**
      *   **Misfit:** This is a descriptive metaphor, not an analytical concept. It lacks specificity about *why* the displacement happens and *how* it interacts with measurement. It doesn't capture the crucial element of the displacement being *invisible to the reform's own success metrics*.
  3.  **General Circumvention / Avoidance:**
      *   **Misfit:** Too broad. Tax avoidance is circumvention, but it doesn't necessarily involve the *illusion of success on monitored metrics*. Your phenomenon is a specific *type* of circumvention enabled by the structure of the reform itself.

  ### The Best-Fitting Concepts & Proposed Terminology

  While no single term is universally established for *exactly* this, the literature points strongly to these concepts:

  1.  **Corruption Displacement (or Favoritism Displacement / Accountability Displacement):**
      *   **Fit:** This is the most direct term used in academic literature (e.g., work by Susan Rose-Ackerman, World Bank studies). It explicitly describes the *relocation* of corrupt or favoritist practices in response to interventions.
      *   **Your Nuance:** Crucially, in your cases, displacement is **into the measurement blind spot created by the reform itself**. This specific *type* of displacement is what makes the reform appear successful. You could emphasize this as **"Displacement into the Reform Blind Spot"** or **"Metric-Driven Displacement."**
  2.  **Policy Implementation Gap / Unintended Consequences:**
      *   **Fit:** The phenomenon is a classic example of unintended consequences stemming from a gap between the policy's formal design and its implementation in a complex, adaptive system. The gap is specifically exploited by relocating behavior to the unmeasured space.
      *   **Your Nuance:** The gap is *predictably* exploited precisely *because* it's a blind spot created by the reform's focus on specific channels/metrics.
  3.  **Indicator Illusion / Metric Myopia:**
      *   **Fit:** Highlights the core problem: focusing reform effort and success metrics too narrowly creates an illusion of improvement while the underlying problem persists elsewhere, unseen.
      *   **Term Suggestion:** **"The Indicator Illusion of Reform Success"** or **"Reform Myopia Induced Displacement."**

  **Recommendation for Print:** Use **"Corruption Displacement"** or **"Favoritism Displacement"** as the anchor term, immediately followed by a concise phrase capturing the measurement blind spot: e.g., *"...a classic case of corruption displacement, where the favoritism simply migrated into the measurement blind spot created by the reform itself."* Or: *"This is displacement into the reform's blind spot – the problem moved where the new rules weren't looking."*

  ### Carving the Boundaries: What This Is and Isn't

  *   **What it IS:**
      1.  **Targeted Channel Closure:** A reform specifically closes or constrains *one identifiable channel* (gifts, hiring exams, open meeting decisions).
      2.  **Behavioral Relocation:** The underlying behavior (favoritism, nepotism, patronage) doesn't disappear; it relocates to a *different channel*.
      3.  **Blind Spot Exploitation:** The new channel is *specifically one that was not targeted by the reform and is not covered by its key performance indicators (KPIs)*.
      4.  **Apparent Success on KPIs:** The reform's *own chosen metrics* (gifts gone, exam scores up, meetings documented) show improvement, creating the illusion of success.
      5.  **Substantive Problem Persists:** The core problem (unfair allocation of resources/jobs/benefits based on connections) remains largely unchanged in substance and impact.

  *   **What it ISN'T:**
      1.  **Genuine Reduction with Messy Residue:** Here, the *overall level* of the targeted behavior genuinely decreases, even if some small-scale evasion persists. The residue is visible, minor, and *doesn't* create an illusion of full success. *(Differentiator: Scale, visibility of residue, genuine reduction on core issue).*
      2.  **Cosmetic Reform from Day One:** A reform designed *only* to create the appearance of action without any intent to change substance (e.g., creating a toothless oversight body with no resources). The displacement you describe happens *because* the reform genuinely constrained the *old* channel, forcing adaptation. *(Differentiator: Did the old channel actually get closed/constrained?)*.
      3.  **General Adaptive Rule-Dodging:** Simple avoidance of a new rule (e.g., finding a tax loophole). This *becomes* your phenomenon **only** when the avoidance mechanism exploits a *blind spot in the reform's own success metrics*, creating the illusion that the rule *worked* on its own terms. *(Differentiator: The interaction with the reform's self-assessment mechanism).*
      4.  **Goodhart's Law Gaming:** Directly manipulating the *measured variable itself* (e.g., falsifying test scores, hiding gifts off-book *without* creating a new channel). Your phenomenon involves creating a *new, unmeasured channel* for the *same underlying behavior*. *(Differentiator: Manipulating the measure vs. relocating the behavior).*

  ### Boundary Cases Sorted

  1.  **Does it count if the new channel is "better"?** **Yes, it still counts as displacement.** The phenomenon is defined by the *persistence of the underlying unfair behavior* and the *illusion created by the reform's metrics*, not by whether the new channel is worse, the same, or even marginally "better" (e.g., cousins instead of direct gifts *might* be slightly less direct, but it's still nepotism). The key is the *lack of genuine improvement on the core problem of unfair allocation*. If the new channel *genuinely* leads to fairer outcomes (e.g., displacement *forces* more open tendering), then it's arguably a *positive* unintended consequence or successful reform pressure, not just problematic displacement.
  2.  **Substance vs. Surface:** The concept **primarily applies when the substantive problem persists.** If only the *surface manifestation* changes (gifts -> "consulting fees") but the *underlying allocation remains biased*, it's displacement. If the reform successfully changes the underlying incentives or processes to reduce the *substance* of unfair allocation, even if new forms emerge, that's different (though potentially messy residue or requiring new reforms).

  ### The Practical Worry: Squeezed vs. Deflated?

  *   **The Challenge:** This is inherently difficult and often underdetermined in the short term. The core problem (unfair allocation) is frequently unobservable or hard to measure directly.
  *   **How to Tell (Principled Approaches):**
      *   **Look for Anomalies:** Does the *outcome* (who gets jobs/contracts/beds) still show patterns suggesting bias, even after the reform? (e.g., same families/groups benefiting, unexplained contract awards).
      *   **Follow the Money/Power:** Track where influence and benefits flow *after* the reform. Does it just shift to new actors/mechanisms?
      *   **Qualitative Evidence:** Whistleblowers, investigative reporting (like yours!), ethnographic studies revealing the new "corridor decisions."
      *   **Monitor *New* Potential Channels:** Proactively look for indicators related to the *likely* displacement channels (e.g., surge in "consultancy" contracts post-gift ban; rise in temporary hires post-exam reform).
      *   **Longitudinal Analysis:** Does the *initial* improvement on the proxy metric plateau or reverse as actors fully adapt to the new channel? Does the *overall cost* or *efficiency* show unexpected negative trends?
      *   **Theory of Change:** Does the reform's logic *require* the closed channel to be the *only* significant one? If not, displacement is predictable. A robust reform anticipates and monitors multiple channels.
      *   **Acknowledge Uncertainty:** Be transparent that while the proxy improved, the persistence of the core problem is suspected based on X, Y, Z evidence, and requires specific monitoring of channels A, B, C.

  **Conclusion:** You've pinpointed **"Corruption/Favoritism Displacement into the Reform's Measurement Blind Spot"** – a critical failure mode of narrowly targeted, metric-driven anti-corruption efforts. The key identifiers are the *relocation* of the behavior, the *exploitation* of the blind spot created by the reform's own focus, and the resulting *illusion of success* on the reform's chosen indicators. While displacement might sometimes lead to marginally "better" forms of corruption, the persistence of the core unfairness defines it. Distinguishing genuine success from this illusion requires looking beyond the initial proxy metrics to outcomes and alternative channels, acknowledging the inherent challenge but using principled investigative methods to expose the substance beneath the surface. This is crucial journalism – giving this phenomenon clear language helps expose the flawed logic of reforms that look good on paper but fail in reality.
