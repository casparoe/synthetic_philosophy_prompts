prompt: |-
  hi — i'm a phd student in phil of science and me and my advisor's other student have been going in circles on the old-evidence problem for bayesian epistemology. i'm pushing this idea i call explanatory retrofitting: you already know mercury's orbit is weird, then GR comes along and shows that weirdness is exactly entailed, and even though you assigned high credance to the data beforehand, learning the entailment relation should bump GR up through something other than standard conditonalization. she thinks that's just mixing logical discovery with belief revision — if E is already in your background then conditioning on T changes nothing, and any talk of 'confirmation' here is sloppy language for being pleased your theory is consistent with old stuff.

  we want to actually write a joint adverserial-collaboration statement we could both sign. can you draft it?

  we need:
  1. a numbered agreed-claims section — about the formal setup (priors, conditioning, likelihoods), about what makes evidence "old" vs "new", about mercury/perihelion being the classic case but not the only one, and about what actually needs explaining (why scientists treat explaining old data as a win).
  2. the disagreements table, with my position in wording i'd accept and hers in wording she'd accept. the core split is whether learning logical/structural entailments can drive non-conditional credence shifts.
  3. the cruxes. i think the big ones are (a) whether belief revision can be triggered purely by learning logical relations rather than new empirical input, and (b) whether we need a separate "explanatory confirmation" relation beyond comparative likelihood.
  4. for each crux, one concrete case or argument we'd both agree is relevant, with each of us writing down our prediction in advance. for (a) maybe learning that two hypotheses you treated separately are actually equivalent — do credances shift? for (b) compare GR vs a patched newtonian mechanics with ad-hoc parameters on mercury, and say whether resolving that comparison solves the problem.
  5. at the end, flag any part that looks verbal rather than substantive.

  keep it in the weeds — don't just give me the standard wikipedia summary. and please don't include citations or a reading list; we want something we could actually write together without running to the library. also, if you mention any specific predictions, write them out explicitly so neither of us can move the goalposts later.
