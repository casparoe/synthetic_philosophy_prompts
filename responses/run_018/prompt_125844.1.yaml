prompt: |-
  I chair the ethics review board for a mid-sized municipality, and every month we must approve, reject, or send back development proposals that pit genuinely different kinds of goods against one another—ecological resilience, cultural continuity, distributive justice, intergenerational fairness—where no single metric (cost-benefit, utility, rights-based veto) can settle the matter. I need a reusable decision procedure that my board can run in a ninety-minute session, with no philosophers present and no quantitative aggregation of values, that operationalizes the idea that values can be incommensurable (not reducible to a common scale) without being incomparable, and that distinguishes hard choices—where reason constrains the permissible options but does not uniquely determine one—from cases where a master principle or dominance relation actually applies.

  Please construct the procedure as an ordered sequence of questions, tests, and stopping conditions, with explicit flags for every point where judgment cannot be eliminated and must be documented in writing by the board. The procedure should be usable by a trained planner or attorney without philosophical training, but it must preserve the conceptual distinctions: do not collapse incommensurability into “weighing pros and cons,” and do not allow hidden domain collapse (for example, treating cultural identity as merely an economic preference).

  The procedure must include the following stages:

  1. Domain identification: list the value domains genuinely at stake in the proposal, with a check for hidden collapse or omission.
  2. Translation audit: test whether rendering any domain in decision-relevant terms has caused “value leakage” (a loss of normative force specific to that domain), with concrete indicators of distortion.
  3. Dominance and critical-threshold screen: reject if one option is worse in every domain; flag for exceptional justification if any domain reaches severe, irreversible harm.
  4. Comparative judgment stage: for remaining cases, since scores cannot be summed, articulate a context-specific reason why one option is more appropriate, tied to the board’s mandate. Include a “structural parity” protocol for when reasons across domains are genuinely on a par: rather than arbitrary selection, the board must record a “contextual priority commitment” with a justification specific to the proposal’s scope.
  5. Hard-choice protocol: produce an answer the board will not like—specifically, approve a proposal that causes irreplaceable harm in one domain because no permissible alternative exists, requiring a signed “hard choice” record.

  Then apply the procedure to three concrete proposals:

  A. Rerouting a flood-defense canal through a century-old immigrant-market district (cultural continuity, local economic identity) versus leaving an adjacent low-income neighborhood exposed to projected flooding (distributive justice, ecological adaptation).

  B. Funding immediate elder-care expansion versus long-term climate-hardening infrastructure, both serving vulnerable populations but across different temporal frames.

  C. One additional case of your own design that tests the structural-parity protocol, where two options each cause severe harm in different domains and neither dominates.

  For each application, show exactly where the procedure stops with a clear answer, where it demands a judgment call, and what the written sign-off must contain. Finally, state explicitly what the procedure cannot do—for example, resolve disputes about the board’s mandate itself, eliminate moral regret, or substitute for democratic input on value priorities. Do not provide bibliographies, reading lists, or citations; do not quote specific texts.
reasoning: |-
  We are constructing a reusable decision procedure for an ethics review board that handles development proposals involving incommensurable values. The procedure must be executable in 90 minutes without philosophers and without quantitative aggregation. It must preserve the incommensurability of values (they are not reducible to a common scale) while allowing comparison. It should also distinguish hard choices (where reason constrains but does not uniquely determine an outcome) from cases where dominance or a master principle applies.

  The procedure is structured as an ordered sequence of questions, tests, and stopping conditions. At points requiring judgment, the board must document their reasoning in writing.

  ---

  **Decision Procedure: Incommensurable Values Assessment Protocol (IVAP)**

  **Stage 1: Domain Identification**
  1. List every value domain genuinely at stake in the proposal. Use the municipality's charter, the board's mandate, and past precedent to identify domains (e.g., ecological resilience, cultural continuity, distributive justice, intergenerational fairness). 
  2. For each domain, specify the aspect affected (e.g., for cultural continuity: disruption of a historic market district; for distributive justice: exposure of low-income residents to flooding).
  3. **Check for Hidden Collapse or Omission**: 
     - Is any domain being reduced to terms from another domain (e.g., cultural identity described only in terms of economic impact)? If yes, re-describe it in domain-specific terms.
     - Are there domains not captured by the proposal's framing (e.g., long-term ecological effects ignored)? If yes, add them.
     - **Judgment Required**: The board must document that the list is complete and free of collapse. If a domain is omitted, the proposal must be sent back for revision.

  **Stage 2: Translation Audit**
  1. For each domain, examine how it has been rendered in decision-relevant terms (e.g., ecological resilience as "flood risk reduction", cultural continuity as "number of businesses displaced"). 
  2. **Test for Value Leakage**: Ask for each domain: 
     - Has the translation lost a normative element specific to the domain? (e.g., reducing cultural continuity to economic metrics loses the symbolic, historical, and identity-based aspects).
     - **Concrete Indicators of Distortion**: 
       * The description fails to capture non-instrumental values (e.g., intrinsic worth of a place).
       * The metric is easily exchangeable with other goods (e.g., if cultural loss is compensated by money, it suggests the domain has been collapsed into economics).
  3. If value leakage is detected, the board must require the proposal to be revised to restore the domain's full normative force. **Judgment Required**: The board must document any leakage and require correction. If uncorrectable, the proposal is sent back.

  **Stage 3: Dominance and Critical-Threshold Screen**
  1. **Dominance Test**: Compare the options (including the status quo). 
     - If one option is worse than another in every domain, reject the dominated option. 
     - If one option is better in at least one domain and not worse in any, and the proposal is to choose the dominated one, reject the proposal.
     - **Stopping Condition**: If dominance is found, the decision is made (reject the dominated option or the proposal that chooses it). Document the dominance relation.
  2. **Critical-Threshold Test**: For each domain, check if any option causes severe, irreversible harm (defined by statutory thresholds, scientific consensus, or past board rulings). 
     - If an option crosses this threshold in any domain, flag it for "exceptional justification": the board must determine whether the harm is unavoidable and whether the proposal provides sufficient mitigation. If not, reject. 
     - **Judgment Required**: The board must document the threshold breach and the justification (if any) for proceeding.

  **Stage 4: Comparative Judgment Stage**
  *(Entered only if no dominance and no critical-threshold rejection)*
  1. Articulate the reasons for preferring one option over another in each domain. Do not aggregate; list reasons per domain.
  2. **Test for Structural Parity**: 
     - If the reasons across domains are balanced such that no domain-specific reason breaks the tie (e.g., Option A is better in Domain X, Option B in Domain Y, and the board cannot articulate a context-specific reason why X should override Y or vice versa), then declare structural parity.
     - **Structural Parity Protocol**: 
       * The board must not arbitrarily choose. Instead, they must record a "contextual priority commitment" (CPC). 
       * The CPC is a written justification that, for this specific proposal and within the board's mandate, one domain takes priority due to the unique circumstances (e.g., "Given the municipality's recent history of cultural erosion, cultural continuity is prioritized in this case").
       * The CPC must be tied to the proposal's scope (e.g., temporal, geographic, affected population) and the board's role (e.g., "Our mandate emphasizes intergenerational fairness in infrastructure projects").
  3. If structural parity is not found, then the board must choose the option with the stronger reason, documenting the domain-specific rationale.

  **Stage 5: Hard-Choice Protocol**
  1. If the board must approve a proposal that causes irreplaceable harm in one domain (even after mitigation) because no permissible alternative exists (i.e., all alternatives cause such harm or the status quo is worse), then:
     - The board issues a "hard choice" record, signed by all members.
     - The record must: 
       * Specify the domain suffering irreplaceable harm and the nature of the harm.
       * State why no alternative avoids this harm and why inaction is worse.
       * Acknowledge the moral residue (i.e., the board does not celebrate the choice but accepts it as necessary under constraint).

  ---

  **Application to Proposals**

  **Proposal A: Rerouting a flood-defense canal through a century-old immigrant-market district vs. leaving an adjacent low-income neighborhood exposed to flooding.**
  - **Stage 1: Domains**: 
    - Cultural continuity (market district as a site of identity and history)
    - Distributive justice (low-income neighborhood's exposure to flood risk)
    - Ecological resilience (flood defense for the city)
    - *Check*: Economic impacts are present but must not collapse cultural continuity into economics. Document: cultural continuity includes non-economic aspects.
  - **Stage 2: Translation Audit**: 
    - Cultural continuity: If described as "loss of 20 businesses", leakage occurs (misses symbolic value). Require revision to include historical and community identity aspects. 
    - Distributive justice: If described as "number of residents at risk", acceptable if also including vulnerability factors (e.g., income, access to resources). 
    - *Judgment*: If revised to capture non-economic cultural aspects, proceed.
  - **Stage 3: Dominance and Threshold**: 
    - No dominance: Rerouting harms cultural continuity but improves distributive justice and ecological resilience; status quo harms distributive justice and ecological resilience. 
    - Critical threshold: Projected flooding may cause severe, irreversible harm (loss of life, permanent displacement). This triggers exceptional justification: can the harm be mitigated? If not, leaving the neighborhood exposed is unacceptable. Therefore, the status quo must be rejected. The rerouting option must then be assessed for cultural harm. If the market district's destruction is also severe and irreversible (e.g., loss of a unique cultural site), then both options have threshold issues. 
    - *Judgment*: The board must document that the flood risk reaches a critical threshold (irreversible harm). The cultural harm must also be assessed: if it is severe and irreversible (e.g., the district is irreplaceable), then we have two options with critical harms. This forces a hard choice (go to Stage 5).
  - **Stage 4/5**: Since both options cause severe harm in one domain and no dominance, we skip to Hard-Choice Protocol. 
    - **Hard Choice Record**: 
      * Approve rerouting, causing irreplaceable cultural harm, because the alternative (status quo) causes irreplaceable harm to low-income residents (distributive justice) and ecological resilience. 
      * Reason: No alternative exists that avoids both harms (e.g., no third route or non-structural mitigation). 
      * Signed record required.

  **Proposal B: Funding immediate elder-care expansion vs. long-term climate-hardening infrastructure.**
  - **Stage 1: Domains**: 
    - Distributive justice (vulnerable elderly now)
    - Intergenerational fairness (future generations facing climate impacts)
    - *Check*: Ensure no collapse (e.g., not reducing elder care to economic cost, or climate hardening to abstract risk).
  - **Stage 2: Translation Audit**: 
    - Elder care: If described as "number of beds added", acceptable if tied to current unmet needs. 
    - Climate hardening: If described as "reduction in future flood damage costs", must also include non-monetary aspects (e.g., community displacement, loss of ecosystems). 
    - *Judgment*: If both domains are adequately represented, proceed.
  - **Stage 3: Dominance and Threshold**: 
    - No dominance: Each option benefits one domain and neglects the other. 
    - Critical threshold: If current elder care shortages are causing severe harm (e.g., avoidable deaths), that triggers exceptional justification. Similarly, if climate projections show catastrophic damage without hardening, that triggers too. 
    - *Judgment*: If neither threshold is breached (e.g., both are serious but not catastrophic), proceed to Stage 4. If one is breached (e.g., elder care crisis is causing deaths now), then reject the option that neglects it? Not necessarily: we must check if the other option causes a threshold breach. If only one breach exists, then the option that causes it must be avoided. But note: inaction on elder care might breach threshold, while inaction on climate might not breach until later. But the board must assess the immediacy and severity. If both thresholds are breached (elder care now, climate later) and no alternative, then hard choice.
  - **Stage 4: Comparative Judgment**: 
    - Assume no critical threshold breach (both are important but not catastrophic). 
    - The board must articulate a context-specific reason: 
      * E.g., "Given the municipality's aging population and recent heatwave deaths, elder care takes priority." 
      * Or: "Given the board's mandate to prioritize intergenerational fairness in infrastructure, and the irreversibility of climate damage, climate hardening takes priority." 
    - **Structural Parity?** If the board cannot break the tie, they must issue a CPC: 
      * E.g., "In this budget cycle, with a surplus designated for vulnerable populations, we prioritize the elderly because the climate fund is already partially secured." 
      * Or: "Because the climate window for effective action is closing, we prioritize hardening." 
    - If a CPC is issued, document it and choose accordingly.
  - **Stage 5**: If either option causes irreparable harm and no alternative, hard choice.

  **Proposal C: Testing Structural Parity: Building a waste treatment plant near a sacred indigenous site vs. in a wetland area.**
  - *Scenario*: The plant is needed to prevent waterborne disease in a growing city. Option A: near a sacred indigenous site (threatens cultural continuity and religious practice). Option B: in a wetland (threatens ecological resilience and biodiversity). The status quo (no plant) risks public health (distributive justice). 
  - **Stage 1: Domains**: 
    - Cultural continuity/religious freedom (sacred site)
    - Ecological resilience (wetland as a carbon sink and flood buffer)
    - Distributive justice (public health)
  - **Stage 2: Translation Audit**: 
    - Sacred site: Must not be reduced to land value; include spiritual and cultural significance. 
    - Wetland: Must not be reduced to acreage; include ecosystem services and biodiversity. 
    - Public health: Include the vulnerability of low-income communities without clean water.
  - **Stage 3: Dominance and Threshold**: 
    - No dominance: Each option harms one domain and helps public health. Status quo harms public health. 
    - Critical threshold: If the sacred site's destruction would cause irreversible cultural harm (e.g., extinction of a practice) or if the wetland destruction would cause irreversible ecological harm (e.g., extinction of species, loss of critical habitat), then flag. Assume both are severe and irreversible. 
  - **Stage 4: Comparative Judgment**: 
    - Reasons: 
      * Option A: Protects wetland but harms indigenous culture.
      * Option B: Protects sacred site but harms ecology.
      * Neither option is clearly better. 
    - **Structural Parity Protocol**: The board must issue a CPC. 
      * E.g., "Given the municipality's treaty obligations to indigenous nations, and the absence of alternative sites, we prioritize cultural continuity over ecological resilience in this case." 
      * Or: "Given the global biodiversity crisis and the wetland's role in climate adaptation, we prioritize ecological resilience." 
    - The CPC must be documented and the choice made accordingly.
  - **Stage 5**: If both options cause irreparable harm and no third option, then whichever is chosen is a hard choice. The board must issue a hard-choice record if they approve one.

  ---

  **What the Procedure Cannot Do:**
  1. Resolve disputes about the board's mandate or the municipality's fundamental value priorities (this requires democratic input or higher-level political decision).
  2. Eliminate moral regret or the sense of loss in hard choices; it only requires acknowledgment.
  3. Substitute for technical expertise (e.g., the severity of flood risk must be provided by experts).
  4. Address strategic misrepresentation of proposals (e.g., if a developer hides impacts, the board relies on submitted data).
  5. Resolve conflicts where the board lacks jurisdiction (e.g., if a proposal violates federal law, that is a separate matter).

  This procedure forces explicit documentation of value trade-offs without collapsing domains, and it distinguishes cases where reason decides from those requiring contextual prioritization or acknowledgment of tragic loss.
answer: |-
  ### Incommensurable Values Decision Procedure  
  **Protocol Name:** Contextual Value Assessment Protocol (CVAP)  
  **Runtime:** ≤90 minutes  
  **Core Principles:**  
  - Values are incommensurable (no common scale) but comparable through reasoned judgment.  
  - Distinguishes dominance (objective resolution) from hard choices (permissible but regret-prone).  
  - Judgment flags require written documentation; no quantitative aggregation.  

  ---

  ### PROCEDURE SEQUENCE  
  **All stages require a designated scribe. Timebox: 15 min per stage.**  

  #### **STAGE 1: DOMAIN IDENTIFICATION**  
  1. **List Value Domains:**  
     - Identify all domains genuinely at stake (e.g., ecological resilience, cultural continuity).  
     - Sources: Proposal documents, municipal charter, board’s mandate, public testimony.  
  2. **Collapse/Omission Check:**  
     - Test: "Could a domain-specific advocate reject this framing as incomplete or reductive?"  
     - Flags:  
       - If any domain is described solely in terms of another (e.g., cultural identity reduced to tourism revenue), **document the omission and require revision**.  
       - If domains are missing (e.g., intergenerational fairness ignored in a climate project), **stop and return proposal for amendment**.  
     - *Judgment Required:* Board confirms domains are distinct and non-reductive. Document: "Domain [X] is preserved without collapse into [Y]."  

  #### **STAGE 2: TRANSLATION AUDIT**  
  1. **Assess Value Rendering:**  
     - For each domain, examine how impacts are presented (e.g., "flood risk reduction" for ecological resilience).  
  2. **Value Leakage Test:**  
     - Indicators of distortion:  
       - *Instrumentalization:* Domain is presented as a means to another end (e.g., cultural continuity valued only for economic growth).  
       - *Commensurability Slippage:* Proposal uses cross-domain trade-off language (e.g., "X units of ecology sacrificed for Y units of justice").  
     - Flags:  
       - If leakage is detected, **require revision** to restore normative force (e.g., "Describe cultural loss in terms of identity erosion, not revenue").  
       - If irreparable, **document leakage** and proceed only if leakage is acknowledged in writing.  
     - *Judgment Required:* Board certifies leakage is addressed or justified. Document: "Translation of [Domain] preserves intrinsic normative force."  

  #### **STAGE 3: DOMINANCE AND CRITICAL-THRESHOLD SCREEN**  
  1. **Dominance Test:**  
     - Compare proposal to alternatives (including status quo).  
     - If Option A is worse than Option B in **every** domain, **reject Option A**.  
     - If Option A is better than Option B in **at least one domain and not worse in any**, **approve Option A** (dominance found).  
     - *Stopping Condition:* Dominance resolves the case. Document: "Option A dominates Option B per [Domain1, Domain2]."  
  2. **Critical-Threshold Test:**  
     - For each domain, assess if any option causes **severe, irreversible harm** (e.g., species extinction, cultural erasure, displacement without recourse).  
     - Threshold defined by: Scientific consensus, legal standards, or municipal precedent.  
     - Flags:  
       - If harm is triggered, **require exceptional justification**: "Is this harm unavoidable given all alternatives? Is mitigation sufficient?"  
       - If unjustified, **reject**.  
     - *Judgment Required:* Board documents threshold breach and justification. Example: "Irreversible harm to [Domain] is justified by [reason]."  

  #### **STAGE 4: COMPARATIVE JUDGMENT**  
  *(Proceed only if no dominance or threshold rejection)*  
  1. **Articulate Domain-Specific Reasons:**  
     - For each option, state why it is better/worse in each domain (e.g., "Option A better for distributive justice: protects vulnerable neighborhood").  
  2. **Structural Parity Protocol:**  
     - Test: "Can the board articulate a context-specific reason, tied to its mandate, to prioritize one domain over another?"  
       - If YES: Choose the option favored by the prioritized domain. Document: "Priority given to [Domain] due to [mandate-aligned reason]."  
       - If NO (genuine parity):  
         - Issue a **Contextual Priority Commitment (CPC)**:  
           - Justification must cite the proposal’s **unique scope** (e.g., temporal urgency, geographic specificity, affected population).  
           - Example: "Prioritizing cultural continuity here due to recent erosion of immigrant heritage in the municipality."  
     - *Judgment Required:* CPC requires unanimous board sign-off. Document: "CPC invoked for [Domain] based on [scope-specific reason]."  

  #### **STAGE 5: HARD-CHOICE PROTOCOL**  
  1. **Trigger:** Approval causes **irreplaceable harm** in one domain, but all alternatives are impermissible (e.g., dominance violation, worse harm).  
  2. **Action:**  
     - Approve with a **signed "Hard Choice Record"** (all board members).  
     - Record contents:  
       - "Irreplaceable harm to [Domain]: [Description]."  
       - "No permissible alternative exists because: [Reason]."  
       - "Moral residue acknowledged: This choice does not negate harm."  

  ---

  ### APPLICATION TO PROPOSALS  
  #### **PROPOSAL A: Flood-Defense Canal Rerouting**  
  - **Stage 1:** Domains: Cultural continuity (market district), distributive justice (flood exposure), ecological resilience.  
    - *Judgment:* No collapse (economic identity ≠ cultural continuity).  
  - **Stage 2:** Leakage if cultural impact described as "property value loss."  
    - *Judgment:* Revise to "disruption of generational community practices."  
  - **Stage 3:**  
    - No dominance: Rerouting helps justice/resilience but harms culture; status quo harms justice/resilience.  
    - Critical threshold: Flood exposure risks loss of life (irreversible harm to distributive justice).  
    - *Flag:* Status quo rejected. Rerouting harms culture—but cultural harm not irreversible (mitigation possible).  
  - **Stage 4:** No parity. Reason: "Municipal mandate prioritizes immediate human safety (justice) over cultural preservation when harm is life-threatening." Approve rerouting.  
  - **Stop at Stage 4.** No hard choice (cultural harm mitigable).  

  #### **PROPOSAL B: Elder-Care vs. Climate-Hardening**  
  - **Stage 1:** Domains: Distributive justice (elders), intergenerational fairness (future climate).  
  - **Stage 2:** Leakage if elder care framed as "cost savings" or climate as "future economic loss."  
    - *Judgment:* Revise to "dignity for current elderly" and "survival equity for future residents."  
  - **Stage 3:**  
    - No dominance: Each option benefits one domain, neglects the other.  
    - Critical threshold: Neither option causes irreversible harm (assuming no imminent elder deaths/climate collapse).  
  - **Stage 4:**  
    - Structural parity: No mandate-aligned reason to prioritize elders over future residents (or vice versa).  
    - **CPC invoked:** "Prioritize elder care due to binding municipal commitments to aging-in-place policies (scope: current budget cycle)."  
    - Approve elder-care expansion.  
  - **Stop at Stage 4.** CPC documented.  

  #### **PROPOSAL C: Hospital Expansion vs. Ancient Woodland**  
  *(Designed to test structural parity)*  
  - **Scenario:** Expand hospital (saves 100 lives/year) but destroy ancient woodland (ecosystem collapse); alternative site delays project by 5 years (estimated 400 lives lost).  
  - **Stage 1:** Domains: Distributive justice (health access), ecological resilience (biodiversity loss).  
  - **Stage 2:** Leakage if woodland valued as "carbon storage."  
    - *Judgment:* Revise to "irreplaceable habitat for endemic species."  
  - **Stage 3:**  
    - No dominance: Expansion helps justice, harms ecology; delay harms justice.  
    - Critical threshold: Both options cause irreversible harm (loss of life vs. extinction).  
    - *Flag:* Delay rejected (worse justice harm). Expansion harms ecology—threshold breached.  
  - **Stage 4:** Structural parity: No mandate-aligned reason to prioritize health over ecology (or vice versa).  
    - **CPC invoked:** "Prioritize distributive justice due to immediate public health emergency (scope: pandemic-era backlog)."  
  - **Stage 5:** Hard Choice: Approve expansion.  
    - **Hard Choice Record:** "Irreplaceable harm to ecology: Extinction of Species X. No alternative: Delay causes greater justice harm. Moral residue acknowledged."  
  - **Stop at Stage 5.**  

  ---

  ### WHAT THE PROCEDURE CANNOT DO  
  1. **Resolve mandate disputes:** Cannot adjudicate conflicts about the board’s authority or municipal value priorities (requires council or voter input).  
  2. **Eliminate moral regret:** Documents but does not resolve the "moral residue" of hard choices.  
  3. **Substitute for democratic input:** Value priorities (e.g., "justice > ecology") must be set externally; CVAP only operationalizes them.  
  4. **Override legal constraints:** If a proposal violates rights or laws, CVAP defers to legal review.  
  5. **Predict outcomes:** Relies on provided impact data; cannot verify accuracy.  

  **Outputs:** Signed documentation at judgment flags, CPCs, and Hard Choice Records. Final decision: Approve, Reject, or Return for Revision.
