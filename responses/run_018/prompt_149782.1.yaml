   In the activity, the facilitator can then explain that this is the core of the paradox.

   How to do it in 75 minutes with 10 people:

     0. (5 min) Introduction: Explain the commune's rule: no one can be forced to experience something they hate. In this activity, we are deciding on the assignment of a book.
     1. (10 min) Introduce the two key states and the two individuals. Assign roles: two volunteers as P1 and P2. The other 8 are the council. 
     2. (10 min) Explain the states and payoffs. 
     3. (15 min) Rule of decisiveness: 
           - P1 has the right to decide between any state where he is assigned the book and where he isn't. In particular, between state a and state c, P1 can decide. He chooses c over a. 
           - P2 has the right to decide between state b and state c. He chooses b over c.
           - The council records: c > a and b > c, so b > c > a.
     4. (15 min) Now, the council and the two are together. They are to decide between a and b. 
           - They vote: each of the 10 votes.
           - Ballot: P1 and P2 and the council.
           - P1: between a and b, he prefers a (because a:1, b:0) -> votes for a.
           - P2: between a and b, he prefers a (because a:2, b:1) -> votes for a.
           - The council, knowing the payoffs, will also vote for a (because a has higher overall payoff: 3 vs 1) -> so a wins.
           - So a > b.
     5. (10 min) But wait, we have from step 3 that b > a. Now we have a > b. Contradiction.
     6. (10 min) Debrief: Explain that this is Sen's liberal paradox: the combination of individual rights (decisiveness over their personal sphere) and the Pareto principle (which would have a > b here because both individuals and the council prefer a to b) leads to a cycle or intransitivity.

   This within the time.

   What might go wrong: 
     - The council might not understand their role. The facilitator should explain that they are to act in the best interest of the commune, and in the vote between a and b, they should vote for what they think is best. Since they know the payoffs, they see that a is better for both individuals in comparison to b (wait, it is: both prefer a to b).

     - In step 4, when we vote on a and b, note that the social ordering from steps 1-3 already has b > a, but now the council is (correctly) voting based on preferences and they get a > b. The council might feel they are bound by the earlier social ordering? The facilitator should say that in this vote, they are to vote their conscience given the payoffs.

     - Also, in steps 1 and 2, the council is not voting; the decisiveness is given to the individuals.

     - In the vote between a and b, we are not using the decisiveness of any individual because it doesn't involve their personal sphere in the same way. In the original, the decisiveness is only for the pairs (a,c) and (b,c), not for (a,b).

