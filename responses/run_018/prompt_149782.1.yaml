  ### Workshop: The Veto Commune  
  *75 minutes, 10 participants, no prep needed*  

  **Core Idea:**  
  Participants are commune members sharing a digital feed. Each has absolute veto over any content they hate. They'll vote on feed content (poems, images, sounds), aiming for high group satisfaction ("bliss points"). The setup forces them into a situation where respecting every veto leads to a worse outcome for everyone—revealing Sen's paradox.  

  ---

  ### Rules & Setup (15 mins)  
  **Facilitator Script:**  
  *"Welcome to the commune! Our rule is sacred: No one experiences something they hate. We share a public feed. I'll propose content options. You can veto anything you hate. We'll vote on what to show. Goal: Maximize bliss points—symbolic points for collective joy."*  

  1. **Roles & Payoffs:**  
     - Each person is a commune member.  
     - **Bliss points:**  
       - Love (your own poem): **+3** to you, **0** to others.  
       - Tolerate (neutral content): **+1** to everyone.  
       - Hate: **-3** to you, **0** to others (and you veto it).  
       - *Example: If your poem wins, you get +3, others get 0. If neutral wins, all get +1.*  

  2. **Content Pool:**  
     - **Personal Poems:** 10 unique poems (1 per member).  
     - **Neutral Content:** Nature sounds, abstract art (always tolerated).  
     - **Controversial Piece:** *One banned poem* (e.g., "Ode to Chaos").  

  3. **Veto Rules:**  
     - Before voting, ask: *"Does anyone hate Option A? Option B?"*  
     - If vetoed, remove it. Majority vote on remaining options.  
     - Tie? Flip a coin.  

  ---

  ### Activity Flow (45 mins)  
  **Round 1: Personal Poems (Warm-Up)**  
  - *Options:* Two random personal poems (e.g., *Poem 1* and *Poem 2*).  
  - *Vote:* Between the two.  
  - *Outcome:* Vetoes likely block both (since each is hated by 1–2 others). Default to neutral.  
  - *Bliss:* All get **+1**.  
  - *Debrief Tidbit:* *"Notice how vetos blocked both poems. We settled for neutral."*  

  **Round 2: The Banned Poem (Conflict Seed)**  
  - *Options:* The banned poem vs. a neutral piece.  
  - *Secret Setup:* Assign 3 "sensitive" members to hate the banned poem.  
  - *Vote:* If banned poem wins, the 3 veto it → neutral wins.  
  - *Bliss:* All get **+1**.  
  - *Debrief Tidbit:* *"Vetoes protected people, but did we miss joy?"*  

  **Round 3: The Trap (Paradox Unleashed)**  
  - *Options:*  
    - **Option A:** Show *Poem 3* (loved by Member 3, hated by Member 4).  
    - **Option B:** Show *Poem 4* (loved by Member 4, hated by Member 3).  
    - **Option C:** Show nothing → **0 points for all**.  
  - *Vote Process:*  
    1. Vote A vs. B.  
    2. Winner faces C.  
  - *What Happens:*  
    - Members 3 and 4 veto the other’s poem → both vetoed.  
    - Only Option C remains → 0 points for all.  
  - *Bliss Outcome:* **0 points** (worse than neutral’s +1).  
  - *Facilitator Note:* *"Option C isn’t hated, so no veto. But is anyone happy?"*  

  ---

  ### Debrief (15 mins)  
  **Reveal the Paradox:**  
  *"Today, we lived out Sen’s Liberal Paradox. Let’s map it:*  
  1. **Liberalism:** Each had veto power (sovereignty over exposure).  
  2. **Pareto Efficiency:** If an option makes everyone better off, we should take it.  
  3. **The Crack:** In Round 3, honoring all vetos left us with 0 points. But if we’d ignored vetoes and picked *any* poem, someone would be hurt. Yet, the outcome (0) is worse for *everyone* than if we’d picked neutral (+1). Rights and collective good clashed."*  

  **Key Insights:**  
  - Veto rights protected individuals but trapped the group.  
  - Pareto efficiency (everyone prefers +1 over 0) was impossible without violating a veto.  
  - *"Sen proved this mathematically: You can’t have both full individual rights and Pareto efficiency in group decisions."*  

  **What Went Wrong:**  
  - Participants may try to lobby or trade vetos. Let them! It mirrors real-world bargaining.  
  - If they avoid Option C (e.g., force a neutral compromise), point out: *"You dodged the trap, but what if neutral wasn’t an option?"*  

  **Honest Limitation:**  
  - *The game simplifies preferences.* Real-life "hate" isn’t binary. In Sen’s model, preferences can be more complex (e.g., ranking options), but we used vetoes as on/off switches for clarity.  

  ---

  ### Facilitator Cheat Sheet  
  - **Keep it visceral:** Use dramatic readings of poem snippets. Assign "hates" secretly (e.g., slip notes: *"You hate Poem 4"*).  
  - **Bliss points:** Track on a board. Use tokens (pebbles, chips) for tangible stakes.  
  - **Timing:**  
    - Setup: 15 mins  
    - Rounds 1 & 2: 15 mins  
    - Round 3: 20 mins  
    - Debrief: 15 mins  
  - **Final Note:** *"The paradox isn’t about right or wrong—it’s a warning. Absolute rights can clash with collective well-being. Your commune must now wrestle with that tension."*
