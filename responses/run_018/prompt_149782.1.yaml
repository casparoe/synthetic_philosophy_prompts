  **Setup:**
  - Each participant is given a unique ID (1 to 10).
  - The content is represented by "cards". There are three types of cards:
    1. **Poem Cards**: Each poem card has a title and is associated with one specific participant (the poet). Only that participant loves it, but it might be hated by others.
    2. **Neutral Cards**: These are inoffensive and universally tolerated (e.g., nature scenes). They give a small positive payoff to everyone.
    3. **Ban Card**: This represents the act of banning a specific poem. It has a different effect.

  **Rules:**
  1. **Sovereignty Rule**: If a participant hates a piece of content, it cannot be shown. Each participant has a list of things they hate (which we assign, see below). They can veto any content that is on their hate list.
