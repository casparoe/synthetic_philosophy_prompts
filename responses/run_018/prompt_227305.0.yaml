  The user also asked about fanaticism towards bounded stakes. If utilities are bounded, say between -U and U, then any outcome worse than -U isn't possible. But what if there's a near-bound outcome with high probability? The agent might ignore genuinely large but sub-bound risks if the probability is small. For example, ignoring a 0.0001% chance of losing 99.999% of bound utility because the expected disutility is small compared to paying a mugger. This makes the agent insensitive to tail risks, which could be dangerous in real-world scenarios involving massive but finite harms.

  Money-pumping is another concern. Unbounded utility agents can be money-pumped through a series of trades exploiting their risk preferences. But bounded agents might also face similar issues. If an agent is indifferent to outcomes near the bound, they could be exploited in sequential decisions. For instance, paying to avoid a tiny risk repeatedly, each step seeming rational, but cumulatively leading to significant loss.

  I should check existing literature. Bostrom discusses sequential mugging. Yudkowsky mentions the mugger adjusting the threat. The fanaticism issue relates to risk aversion and tail risk management. Coherence theorems by Savage might not require unbounded utility, but bounded agents could still violate desirable properties like stochastic dominance if they ignore tail risks excessively.

