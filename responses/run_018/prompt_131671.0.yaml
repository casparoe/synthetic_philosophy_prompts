answer: |-
  ## Research Proposal: The Multidimensional Structure of Standing to Blame and the Selective Impact of Hypocrisy

  **1. Research Question**
  Does hypocrisy asymmetrically undermine distinct, separable dimensions of an agent’s standing to blame – specifically epistemic standing, normative standing, and affective standing – and does the pattern of this selective undermining depend systematically on (i) the domain-relationship between the hypocrite’s own wrongdoing and the wrong they blame (same-domain vs. cross-domain) and (ii) the relative social position of the hypocrite and the target of their blame (upward, downward, or horizontal)?

  **2. Gap in the Literature**
  The extensive literature on standing to blame and hypocrisy predominantly treats "standing" as a unitary, all-or-nothing status: one either possesses the standing to blame or one does not, with hypocrisy often cited as a primary reason for forfeiting this standing entirely. While sophisticated arguments exist concerning *whether* and *why* hypocrisy undermines standing (e.g., claims of inconsistency, unfairness, lack of authority, or compromised credibility), this binary framing obscures crucial nuances.

  Treating standing as monolithic fails to capture the complexity revealed by everyday intuitions. A hypocrite might seem perfectly positioned to *recognise* a wrong (preserving epistemic standing) yet lack the moral *authority* to demand accountability (losing normative standing). They might possess the authority but be seen as illegitimately expressing resentment (losing affective standing). Furthermore, the literature often neglects to systematically differentiate types of hypocrisy. The impact of privately committing the *exact same* wrong (in-domain hypocrisy) likely differs significantly from committing a different, albeit comparably serious, wrong (cross-domain hypocrisy). Similarly, whether the hypocrite blames a subordinate (downward), a superior (upward), or a peer (horizontal) may interact with the standing dimensions differently. By analysing standing as comprising three distinct dimensions and examining how different hypocrisy configurations selectively target them, this research addresses a significant conceptual blind spot in the current debate.

  **3. Research Method**
  The project will employ conceptual analysis and structured philosophical thought experimentation:

  *   **Phase 1: Conceptual Mapping (Months 1-2):** Precisely define and distinguish the three proposed dimensions of standing:
      *   *Epistemic Standing:* The blamer's capacity and position to reliably recognise the specific wrong committed by the target (based on knowledge, experience, or perspective).
      *   *Normative Standing:* The blamer's entitlement to hold the target accountable for the wrong, grounded in the blamer's own adherence to relevant norms or their possession of legitimate authority, such that their blame does not suffer from self-undermining inconsistency or unfairness.
      *   *Affective Standing:* The legitimacy or appropriateness of the blamer expressing reactive attitudes like resentment or indignation towards the target, considering the blamer's own moral record and its relationship to the expressed sentiment.
      The focus will be on ensuring these concepts are mutually exclusive and collectively exhaustive of the core elements of "standing to blame".

  *   **Phase 2: Taxonomy Construction & Intuition Testing (Months 3-4):**
      *   Develop a detailed taxonomy of hypocrisy cases varying along key axes:
          *   *Privacy:* Private vs. Public knowledge of the hypocrite's own transgression.
          *   *Domain:* **In-domain hypocrisy** (blamer commits the *same specific type* of wrong they blame) vs. **Cross-domain hypocrisy** (blamer commits a *different* wrong, argued to be of comparable moral seriousness).
          *   *Direction:* **Downward blame** (hypocrite blames someone in a subordinate position), **Upward blame** (hypocrite blames someone in a superior position), **Horizontal blame** (hypocrite blames a peer).
      *   Construct a series of structured thought experiments systematically combining these variables (e.g., *public, in-domain, downward hypocrisy*; *private, cross-domain, upward hypocrisy* etc.).
      *   For each scenario, formulate specific, targeted questions probing intuitions about whether the hypocrite *lacks standing* to blame, focusing separately on the epistemic, normative, and affective dimensions (e.g., "Does the blamer seem *well-positioned to recognise* the wrong?"; "Does the blamer seem *entitled to hold the target accountable*?"; "Would the blamer's expression of *resentment* seem legitimate?"). These will be refined through pilot testing.

  *   **Phase 3: Analysis (Integrated into Months 3-6):** Analyse the patterns in the elicited intuitions across the different case types. Does hypocrisy consistently undermine all three dimensions? Or are there systematic patterns where certain types of hypocrisy (e.g., in-domain) primarily damage normative standing, while others (e.g., cross-domain, upward) might primarily damage affective standing or leave epistemic standing intact? Does the direction of blame significantly modulate the effect?

  **4. Expected Outcomes and Measures of Success/Failure**
  *   **Positive Result:** A principled mapping demonstrating that hypocrisy does *not* uniformly undermine all dimensions of standing. Success would be evidenced by consistent, discernible patterns, such as: In-domain hypocrisy consistently and severely undermining normative standing; cross-domain hypocrisy having a stronger negative impact on affective standing, particularly in upward blame scenarios; epistemic standing proving relatively robust except perhaps in cases of extreme inconsistency or specific types of cross-domain hypocrisy involving expertise. This would demonstrate the analytical value of the tripartite framework.
  *   **Failure:** Several outcomes would constitute significant challenges or failure:
      *   **Collapse of Dimensions:** If intuitions consistently fail to distinguish between the three proposed dimensions across all or most scenarios (e.g., whenever one is undermined, all are undermined in the same way), this would suggest the unitary model is adequate and the dimensional split lacks traction.
      *   **Noisy/Unprincipled Intuitions:** If the elicited intuitions show no consistent patterns correlating with the taxonomy variables (domain, direction), appearing random or contradictory across similar cases, this would indicate the hypothesis lacks empirical (intuitive) support within the proposed framework.
      *   **Overwhelming Complexity:** If the interaction effects between dimensions and case types become too complex and defy clear articulation within the scope, this would also limit the success of the project.

  **5. Project Scope and Timeline (6 Months)**
  *   **Months 1-2:** **Conceptual Groundwork.** Deep analysis and refinement of the definitions of epistemic, normative, and affective standing. Initial sketching of the hypocrisy taxonomy parameters (domain, direction, privacy). *Risk: Over-refining definitions at the expense of moving to application.*
  *   **Months 3-4:** **Case Analysis & Intuition Testing.** Finalising the taxonomy and designing the core set of structured thought experiments (approx. 15-20 core scenarios). Piloting, refining questions, and systematically analysing the intuitive responses to each scenario against the three dimensions. *Risk: Creating an overly complex taxonomy or too many cases, making analysis unmanageable. Requires disciplined focus on key distinctions.*
  *   **Months 5-6:** **Synthesis, Writing & Refinement.** Integrating the analysis to build the principled mapping (or articulating clearly why it fails). Drafting the fellowship report. Refining arguments and conclusions. *Risk: Synthesis proving more complex than anticipated, requiring difficult choices about scope.*

  **Assessment of Ambition:** The timeline is demanding but feasible with strict focus. The primary risk is the potential complexity of mapping interactions between three dimensions and multiple case types (domain x direction x privacy). To mitigate this, the project will prioritise core contrasts: *in-domain vs. cross-domain* and *downward vs. upward blame*, treating horizontal as a baseline and privacy as a secondary variable explored in key examples rather than exhaustively. Focusing on a manageable set of paradigmatic scenarios is crucial. Failure to find clear patterns (a negative result) is still a valuable philosophical finding regarding the structure of standing.

  **6. Broader Significance**
  Understanding the multidimensional nature of standing to blame and the selective impact of hypocrisy is crucial for a refined theory of moral responsibility. Blame is a complex social practice involving claims about wrongdoing, demands for accountability, and expressions of moral emotion. Demonstrating that these elements can come apart under the pressure of hypocrisy, and that this dissolution follows predictable patterns based on the nature of the hypocrisy and the relational context, provides a more nuanced picture of moral accountability. It moves beyond the simplistic question of whether hypocrites "can" blame to reveal *how* their blame is defective – whether it lacks authority, misrepresents their emotional position, or (less commonly) fails epistemically. This enriches our understanding of the conditions under which moral address is legitimate and effective, contributing significantly to debates on the ethics of blame, the nature of moral community, and the relationship between an agent's own character and their capacity to participate in holding others responsible.
