  ## FEDERAL TRADE COMMISSION  
  BUREAU OF CONSUMER PROTECTION  
  INTELLECTUAL SAFETY DIVISION  
  REPORT: INTUITION PUMP OPERATIONAL HAZARDS (IPC DOCKET PHIL-2024-001)

  **1. Executive Summary (98 words):**  
  This Bureau has conducted a market-wide audit of Intuition Pumps (IPs), cognitive devices marketed to clarify philosophical positions. Findings indicate systemic deficiencies in Epistemic Friction Coefficient (EFC) ratings, a core metric quantifying resistance to unwarranted conclusion slippage. Significant instances of Frame Concealment and Undeclared Normative Loading were detected, leading consumers to treat subjective gut reactions to hypothetical scenarios as objective empirical data. This misrepresentation constitutes a deceptive trade practice under Section 5 of the FTC Act. Urgent rulemaking is proposed to mandate EFC labeling, standardized calibration protocols, and conspicuous disclosure of framing mechanisms to protect consumers from premature philosophical resolution.

  **2. Findings: Pump Integrity Audits (248 words):**  
  Audits focused on widely circulated, high-utilization pumps revealed critical EFC failures. The EFC scale (0.0 = frictionless slide to conclusion; 1.0 = maximum justified inference stability) consistently rated below operational safety thresholds.

  *   **Trolley System Variants (Standard Lever v. Footbridge):** The lever variant (diverting a runaway trolley to kill one instead of five) initially registered an EFC of approximately 0.65. However, audit uncovered severe Frame Concealment: the scenario loads "minimize aggregate death" as the sole normative imperative without declaration. The Footbridge variant (pushing one individual onto the tracks to stop the trolley) exhibited catastrophic EFC failure (≤0.15). Despite near-identical outcomes, consumers reported wildly divergent intuitions due solely to Undeclared Agent-Centric Framing and visceral proximity factors. This demonstrates profound Calibration Drift – identical normative inputs yield non-identical outputs based solely on presentation.
  *   **Experience Machine (Plug-In Utopia):** This pump, promising perfect simulated happiness versus imperfect reality, scored an alarming EFC of 0.08. Audit identified extreme Undeclared Normative Loading: the hypothetical implicitly assumes "experienced happiness" is the *only* relevant good, neglecting undeclared values like authenticity, contact with reality, or undefined "meaning." Consumer gut reactions ("I wouldn't plug in!") were routinely treated as empirical proof of objective value hierarchies beyond happiness, constituting severe data misrepresentation. Furthermore, reliance on "Old Evidence" – intuitions formed decades ago under differing cognitive conditions – for contemporary pump operation violates recommended maintenance schedules, exacerbating EFC degradation. In all cases, uncalibrated psychometric outputs were erroneously treated as calibrated data streams.

  **3. Proposed Rulemaking (152 words):**  
  To mitigate identified hazards and prevent consumer deception, the Bureau proposes the following Intuition Pump Safety Regulations (IPSR):

  1.  **Mandatory EFC Labeling:** All published or distributed IPs must display a prominently placed EFC rating, calculated using FTC-approved methodology (ISD Form PHIL-EFC1), clearly indicating risk of conclusion slippage (e.g., "EFC 0.2: HIGH SLIPPAGE RISK - UNSTABLE INFERENCE ZONE").
  2.  **Frame & Normative Disclosure:** Pump operators must provide a "Specification Sheet" explicitly listing all scenario framing elements (e.g., "Agent Proximity: Direct Physical Contact") and declaring all normatively loaded assumptions (e.g., "Primary Value Metric: Aggregate Survival Count").
  3.  **Calibration Requirements:** Operators must demonstrate regular calibration against known cognitive biases (e.g., proximity effect, identifiable victim bias) using ISD Calibration Protocols. Use of "Old Evidence" intuitions older than 5 years requires re-validation testing.
  4.  **Output Disclaimer:** All pump results must include the statement: "WARNING: Intuitive output is not empirical data. Treat as preliminary heuristic only. EFC rating indicates stability."

  **4. Commentary — Where the Satire Bends Reality (102 words):**  
  Confidence in the core critique – that intuition pumps often contain hidden framing, smuggled norms, and are frequently misused by treating intuitions as data – is rated HIGH (EFC ≈ 0.85 based on observed philosophical discourse patterns). The point of LEAST confidence (EFC ≈ 0.45) concerns whether framing effects *invalidate* pumps or merely necessitate careful handling/muddy the waters. Some pumps *can* reveal genuine conceptual tensions when disassembled. A significant liberty involves compressing complex normative debates (e.g., utilitarianism vs. deontology in trolley cases) into "undeclared loading," oversimplifying the depth of disagreement. The EFC metric, while satirical, concretizes genuine concerns about the reliability of intuitive judgments in hypotheticals.
