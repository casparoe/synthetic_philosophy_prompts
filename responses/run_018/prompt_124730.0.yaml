prompt: |-
  I've been stuck in this loop with a philosophy-of-science friend about Popper and Darwinism. Every time we talk about whether he really took back his claim that natural selection is basically tautological — you know, survival of the fittest just means those who survive survive — we end up talking past each other. I point to the parts where he treats evolutionary explanations as unfalsifyable metaphysical research programmes, and he points to other passages where Popper seems to praise evolutionary theory for making genuine predictions about allele frequencies and adaptation. We never resolve it, and it's been going on for months.

  So I'm wondering if this deadlock is actually about the word Darwinism itself. Maybe I'm picturing the loose adaptationist stories people tell in evolutionary psych, where every trait gets a post-hoc explanation, and he's picturing the hard quantitative population-genetics framework that can be tested against data. Or is it deeper — maybe we're disagreeing about what counts as a risky prediction, like whether a theory has to forecast specific future species or whether explaining past ones is enough? I want a real diagnosis of the disagreement structure, not a biography. Are the sides split over sematics, over standards of falsifiability, or over hidden intuitions about what science should do? And given that diagnosis, what kind of distinction or formal result would actually break the deadlock, or is it just bedrock? Please answer in American English, and don't just hand me a reading list — I need the structure of the stall, not citations.
