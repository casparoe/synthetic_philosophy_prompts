prompt: |-
  I'm planning a ninety-minute graduate seminar on population axiology for students who have already encountered Parfit's original formulation of the repugnant conclusion but have not yet worked through the formal impossibility results. Don't explain the conclusion to me; instead, lay out a teaching plan. The sequence must open with why average utilitarianism collapses into the repugnant conclusion once populations grow large enough, then pivot to total utilitarianism and its mirror-image problem—the sadistic conclusion—before introducing critical-level utilitarianism as a proposed middle path. For the carrying example, construct a "welfare dial" scenario in which a planner can allocate resources to produce either a small population of intensely flourishing digital minds or an enormous population of minds running just barely above a technologically adjustable critical threshold; this should make visible that the difficulty is structural, not merely a contrast between "bliss" and "drudgery," and it should set up the failure of threshold-based rescues. Identify the misconceptions you expect—particularly that students will conflate the critical level with a biological "minimum viable life," will believe that raising the threshold eliminates rather than relocates the problem, and will overlook how variable-value theories still generate a repugnant conclusion at the margin when the threshold itself shifts with capacity—and specify the exact point in the sequence where each should be headed off. Include one check-for-understanding question that requires students to apply the dial scenario to a case in which the technological capacity to raise the threshold suddenly doubles, forcing them to see whether their intuition tracks total well-being or merely avoids crossing the line. State explicitly what should be left out at this level—namely, the full formal proof of the impossibility theorems and any analogy to ecological carrying-capacity arguments—so the discussion does not drift. Lead with your bottom line in the first sentence, then provide the reasoning. Use American English, with no preamble and no restatement of the question.
