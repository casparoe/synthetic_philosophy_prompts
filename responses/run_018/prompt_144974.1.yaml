answer: |-
  **Bottom line:** Structure the seminar to demonstrate that no simple utilitarian framework escapes population ethics paradoxes by sequentially exposing average and total utilitarianism's failures, using a "welfare dial" to make critical-level utilitarianism's threshold relocation (not resolution) of the repugnant conclusion structurally visible, while preempting key misconceptions at critical junctures.

  **Teaching Plan (90 Mins):**

  1.  **Introduction & Recap (5 mins):** Briefly state the goal: To explore why standard utilitarian approaches to population ethics face deep problems and examine a proposed solution's limitations. Assume familiarity with Parfit's Repugnant Conclusion (RC).

  2.  **Average Utilitarianism (AU) & Its Collapse into RC (15 mins):**
      *   **Review:** Define AU (Maximize average well-being).
      *   **The Problem:** Present scenario: Choosing between A (10 billion at +100) or Z (vast population at +1, barely above zero). AU prefers Z if average >0, as adding lives barely above zero *raises* the average from negative/zero but *lowers* it significantly from a high baseline.
      *   **Key Insight:** Emphasize that AU *actively seeks* large populations at low positive welfare to maximize the average when starting from scratch or near-zero. **This *is* RC.** AU doesn't avoid it; it mandates it for large enough potential populations.

  3.  **Total Utilitarianism (TU) & The Sadistic Conclusion (20 mins):**
      *   **Pivot:** TU (Maximize sum total well-being) avoids RC for fixed resources? (Choosing A over Z).
      *   **Introduce Welfare Dial Scenario:**
          *   A planner controls a resource pool for creating digital minds.
          *   **Dial 1 (Number):** Controls population size (N).
          *   **Dial 2 (Intensity):** Controls the welfare level (W) of *each* mind created. Can be set from far below zero (suffering) to very high (bliss).
          *   **Constraint:** Resource cost per mind increases non-linearly with W. Doubling W costs more than double the resources. Creating minds at very high W is extremely expensive per mind.
      *   **The Sadistic Conclusion:**
          *   Scenario: Choosing between adding a group at mild suffering (W = -1) or a *different* group at high positive welfare (W = +50).
          *   **TU Calculation:** If adding the suffering group (-1 * N1) creates a *larger increase in total population* (N1) than adding the happy group (N2) due to resource constraints (hitting Dial 2 harder for high W), TU *can prefer adding lives with negative welfare* if |-1 * N1| < |+50 * N2| and N1 >> N2. The total sum is higher.
      *   **Point:** TU prioritizes total sum, potentially condoning the creation of suffering lives if it allows enough *additional* barely-positive (or even other) lives to outweigh it in total. This is the Sadistic Conclusion.

  4.  **Critical-Level Utilitarianism (CLU) as a Proposed Solution (25 mins):**
      *   **Introduce CLU:** Value of a life = (W - α), where α is a critical level (α > 0). Total value = Σ(W_i - α). Only lives with W > α have positive value.
      *   **Motivation:** Aims to avoid both RC (by devaluing very low-positive lives) and the Sadistic Conclusion (by negatively valuing lives below α).
      *   **Apply to Welfare Dial:** Set α (e.g., α = +10). Planner now maximizes Σ(W_i - 10).
      *   **Scenario Revisited (Avoiding RC?):**
          *   Option A: Small N, High W (e.g., N=1B, W=100, Value = 1B * 90)
          *   Option Z: Huge N, Low W (e.g., N=100B, W=10.1, Value = 100B * 0.1 = 10B)
          *   **Result:** CLU (α=10) prefers A (90B) over Z (10B). *Apparent victory over RC.*
      *   **Preempt Misconception 1 (During CLU Definition):** **Explicitly State:** "α is an ethical threshold, *not* a biological minimum or subsistence level. It's a level above which life is deemed 'worth adding' to the population. A mind could function perfectly well at W=5 but adding it would be negatively valued if α=10."
      *   **The Structural Problem Relocated - Welfare Dial Manipulation:**
          *   Scenario: Can create either:
              *   Group X: Moderate N, W well above α (e.g., N=5B, W=60, Value = 5B * 50 = 250B)
              *   Group Y: Very Large N, W *just barely* above α (e.g., N=500B, W=α+ε = 10.001, Value = 500B * 0.001 = 0.5B)
          *   **Result:** CLU strongly prefers X (250B >> 0.5B). No RC here.
          *   **Now, introduce Group Z':** Enormous N, W *just barely above a lower, but still positive, ε* (e.g., N=5 *trillion*, W=α+ε = 10.0001, Value = 5T * 0.0001 = 0.5B).
          *   **Result:** CLU *still* prefers X (250B) over Z' (0.5B). Still avoids RC.
          *   **The Pivot:** Ask: "What must we do to make Group Y/Z' *better* than X according to CLU? We need Σ(W_i - α) for Y/Z' > Value of X."
          *   **Answer:** For a fixed α, we need to either increase N *or* increase W for Y/Z'. But W is already pinned just above α. The *only* way is to make N *even more astronomically large* for Y/Z'. CLU avoids RC *for a fixed α and fixed resource/cost structure* by requiring the low-Welfare population to be *so vast* it's practically unrealistic/impossible given resource constraints to make Σ(W_i - α) exceed the high-Welfare alternative. **The RC is relocated to the realm of impractical scale, not solved.** If we could create 500 *quadrillion* minds at W=10.0001, CLU *would* prefer it to 5B at W=60 (500Q * 0.0001 = 50B > 250B? Not quite, but the point stands - scale it up further). The *structure* of trading quality for quantity remains; the threshold just shifts the "repugnance point" to higher N.
      *   **Preempt Misconception 2 (After Dial Manipulation):** **Explicitly State:** "Raising α doesn't *eliminate* the potential for a repugnant-like conclusion; it *relocates* it. For *any* fixed α > 0, there exists *some* population size N (perhaps absurdly large) of lives *just above α* that CLU will judge better than a smaller, much happier population, provided we can actually create that many lives with the resources. The problem is displaced, not destroyed."

  5.  **Variable Critical Levels & The Margin (15 mins):**
      *   **Introduce Idea:** Maybe α isn't fixed? Perhaps α rises with technological capacity or average welfare?
      *   **Check-for-Understanding Question (Apply the Dial):**
          *   "Assume CLU where α is proportional to our max *achievable* welfare level (W_max). Initially, W_max = 100, so α = 10 (10%). We can create Group A (1B @ W=100, Value=1B*90=90B) or Group B (20B @ W=11, Value=20B*1=20B). CLU prefers A."
          *   **Scenario Change:** Tech improves! W_max suddenly doubles to 200. New α = 20 (still 10%). Now we can create:
              *   Group A' (Using new tech): 1B minds @ new max W=200 (Value = 1B * (200-20) = 180B)
              *   Group B' (Using new tech): 20B minds @ W=22 (just above new α=20, Value = 20B * (22-20) = 40B)
              *   Group C (Using *old* tech level): Still 20B minds @ W=11. But W=11 is now *below* the new α=20! Value = 20B * (11-20) = **-180B** (Very bad!)
          *   **Question:** "Assuming we use the new tech (it's available), does CLU now prefer A' or B'? (A': 180B, B': 40B -> Still prefers A'). But here's the key: **What about creating *additional* lives at the *new* 'barely above threshold' level (W=22) compared to using resources to push existing lives higher? If we have resources to add 1B more lives, is it better to add them at W=22 (Value add = 1B * 2 = 2B) or use the resources to increase 100M existing lives from W=200 to W=201 (Value add = 100M * (201-20 - (200-20)) = 100M * 1 = 0.1B)? CLU prefers adding the new barely-above-α lives (2B > 0.1B).**
      *   **Preempt Misconception 3 (After this Question):** **Explicitly State:** "Notice that even with a variable α that rises with capacity, CLU *at the margin* still favors creating large numbers of lives *just above the current critical threshold* over creating fewer, much happier lives or significantly improving existing lives, whenever the total Σ(W_i - α) is greater. The repugnant conclusion reappears *locally* when deciding how to use marginal resources for population expansion vs. quality enhancement. The threshold shift doesn't insulate the theory from quality-quantity trade-offs; it just moves the point where adding vast numbers of low-positive (relative to α) lives becomes optimal."

  6.  **Synthesis & Conclusion (10 mins):**
      *   Recap AU's embrace of RC and TU's Sadistic Conclusion.
      *   Summarize CLU's appeal: avoids obvious embrace of RC/Sadistic Conclusion for realistic scales by introducing a threshold.
      *   Emphasize the Welfare Dial's lesson: The core structural dilemma (potential trade-off between number and intensity of welfare, mediated by resource constraints) persists. CLU relocates the RC to higher population sizes or recasts it at the margin with variable thresholds; it doesn't resolve the underlying axiological challenge.
      *   State clearly: **"No simple additive utilitarian rule (average, total, critical-level) escapes population paradoxes entirely. The impossibility theorems formalize this deep difficulty."**

  **What to Leave Out:**
  *   **Full Formal Proofs of Impossibility Theorems:** Mention their existence and conclusion (no population axiology satisfies all seemingly reasonable principles), but do not derive or delve into the specific axioms and proofs (e.g., Mere Addition, Non-Anti-Egalitarianism).
  *   **Ecological Carrying-Capacity Analogies:** Avoid framing resource constraints solely through an ecological lens (e.g., "planet can only support X"). The Welfare Dial's cost function is abstract (cost increases with W), focusing on the *ethical* structure of the trade-off, not specific physical limits which might introduce confounding variables.
