answer: |-
  ## The Unseen Engine

  Behold the ring of light, the lucid plan—  
  No dungeon’s gloom, but architecture bright  
  Where cells, like facets turned, absorb the sight  
  That spills unseen from one central span.  
  The tower’s vacant eye surveys each man,  
  A sovereign gaze diffused in constant white;  
  No shadow shields the form held purely right  
  Within this luminous, incarcerate scan.  
  **But mark the shift:** not scaffold, sword, nor ban—  
  The ledger blooms, the detailed file takes flight.  
  The probing gaze dissects in clinic’s light,  
  Not finding *him*, but *fashioning* the man.  
  The norm defines, produces what it sees:  
  Deviance sprouts where standards set the breeze.  
  We breed the watchers watching from within,  
  Inspecting selves where unseen glass held thin.

  ---

  **Notes on Execution:**

  1.  **Octave (ABBA ABBA - Enclosed/Sovereign Power):**
      *   **Imagery:** "Ring of light," "lucid plan," "architecture bright," "cells like facets," "constant white," "sovereign gaze," "luminous scan" establish the panopticon as an ordered, illuminated structure of visibility, not hidden terror.
      *   **Rhyme & Power:** The enclosed rhymes (plan/span, bright/right, man/scan, light/white) mirror the circular, self-contained nature of surveillance – each rhyme folds back on itself, creating a closed circuit.
      *   **Key Concepts:** "Sovereign gaze" (diffused), "incarcerate scan," "constant white," "unseen... central span" capture perpetual visibility and the unseen observer.

  2.  **Volta (Line 9: "But mark the shift:")**
      *   The sharp pivot explicitly rejects sovereign tools ("scaffold, sword, nor ban").

  3.  **Sestet (CDE CDE - Interlaced/Disciplinary Power):**
      *   **Imagery:** "Ledger blooms," "detailed file," "probing gaze," "clinic’s light," "fashioning the man," "norm defines, produces," "deviance sprouts," "standards set the breeze" shift to the productive mechanisms of knowledge/power: documentation, the medicalized gaze, normalization, and the *creation* of the subject ("fashioning") and deviation.
      *   **Rhyme & Power:** The interlaced rhymes (ban/flight/light, sees/breeze/thin/in) create a more fluid, spreading pattern, enacting the "capillary" spread of disciplinary power and knowledge production. The rhymes weave through the lines, less confined than the octave.
      *   **Key Concepts:** Explicitly states the core Foucauldian thesis: the examination doesn't find a pre-existing subject but *constitutes* it ("Not finding *him*, but *fashioning* the man"). Emphasizes the norm as both measure and producer ("defines, produces," "deviance sprouts where standards set").

  4.  **Closing Couplet (Internalization):**
      *   Directly addresses the paradox: power becomes most effective when internalized ("breed the watchers watching from within"). The watched become self-regulating subjects ("Inspecting selves"), reproducing the norm autonomously. The "unseen glass" of the tower is replaced by the internalized gaze.

  5.  **Philosophical Work in Form:**
      *   The octave's tight, enclosed rhymes viscerally convey the closed circuit of surveillance.
      *   The volta and sestet's shift in rhyme scheme and imagery enact the conceptual move from power as external repression ("power over" - sovereign) to power as productive internalization ("power through" - disciplinary).
      *   The language moves from architectural visibility ("lucid plan," "cells") to mechanisms of knowledge production ("ledger," "file," "gaze," "norm," "deviance").

  **For the Foucauldian Reader:** The poem embodies the co-constitution of power/knowledge ("gaze dissects... fashioning the man"), the examination as objectifying ritual ("ledger," "file," "clinic’s light"), the productive norm, and the ultimate triumph of discipline: internalization.

  **For the Unfamiliar Reader:** The poem presents a coherent narrative: a shift from an imposing, visible prison structure reliant on observation to a subtler, more pervasive system where being constantly seen and measured fundamentally shapes and controls individuals from the inside out, turning them into their own jailers. The evocative imagery ("ring of light," "vacant eye," "ledger blooms," "deviance sprouts," "watchers watching from within") carries the emotional and intellectual weight.
