        Host larvae (e.g., caterpillars) and the wasps (we are not harming the wasps? We are releasing them, so they are not harmed. Only the host larvae are harmed) -> included.

    Step 1:
        Taxa: host larvae (say, caterpillars)
        N: number of larvae parasitized. Let's assume 1e6 per year in the area.
        s: prolonged internal parasitism -> very painful, s=1.

    Step 2:
        p(caterpillars): pre-agreed table: 0.5 (as insects with complex behavior)

    Step 3:
        L = 0.5 * 1e6 * 1 = 500,000

    Step 4: 
        p=0.5>=0.3 -> keep.

    Step 5: 500,000 < 1e9 -> no reversal.

    Step 6: 
        L = 500,000 -> above L_min (1000) and below L_red (1e6) -> Yellow.

    So it's Yellow, not Red. Therefore, it can be funded if benefits outweigh.

    We note: the harm is intentional (direct and avoidable? but we don't need to check because p(i)>=0.3). 

    This is the case that supports funding despite harm (because Yellow, not Red, and benefits may be high).

    However, note: the procedure does not require the project to be rejected at Yellow. It goes to a designated reviewer to weigh against benefits.

   Now, what the procedure cannot do:

     - It cannot resolve disputes about where the evidential floor or phylogenetic boundary should sit. These are set as parameters by the committee (evidential floor at 0.3, phylogenetic boundary at organisms with no integrated nervous system) and are value-laden. The procedure merely relocates these disagreements into explicit parameter choices that the committee must agree on in advance.

     - It does not weigh L against the benefits of the proposal. That is left to human judgment (at the Yellow and Red levels).

     - It relies on preset tables and thresholds (L_min, L_red, evidential floor) which may need periodic review.

     - It cannot handle novel evidence about sentience without updating the table or using the questions (which are crude).

     - The reversal check threshold (1e9) and the condition (average p(i)<0.3) are arbitrary and may need adjustment.

     - The assignment of s(i) and p(i) is somewhat subjective.

     - The avoidable/intentional/direct criteria require judgment and may be contentious.

     - It does not consider positive welfare (only harm).

     - It does not consider the benefits of the project for reducing other harms (e.g., replacing a worse pesticide).

     - It is designed for invertebrates; if vertebrates are affected, they would have p(i)=1.0 and likely high L.

     - Time: it must be done in 20 minutes, so it uses quick estimates and pre-agreed values.

   We write the procedure as a step-by-step flow:

    Agricultural Innovation Fund - Invertebrate Welfare Assessment Procedure

    Pre-requisites: 
      - The committee must pre-agree on:
          * Phylogenetic boundary: a list of taxa that are included (e.g., arthropods, mollusks, annelids) and excluded (plants, microbes, protozoa).
          * Evidential floor: p(i) threshold for discontinuity brake (e.g., 0.3).
          * Thresholds: L_min (e.g., 1000), L_red (e.g., 1,000,000), reversal check threshold (e.g., 1e9) and condition (average p(i) < 0.3).
          * A table of p(i) values for common taxa.
          * A designated reviewer for judgments and overrides.

    Step 0: Check phylogenetic boundary.
        For each organism group negatively affected:
          - If the group is in the excluded list (no integrated nervous system), set L=0 and remove from consideration.
          - If the group is in the included list, keep.
          - If uncertain, escalate to designated reviewer for quick decision (time: 1 minute). If reviewer unavailable, defer proposal.
        If all affected groups are excluded, output Green and stop.

    Step 1: Identify taxa and estimate N, s(i).
        - List each taxon i that is harmed.
        - For each taxon i:
            * Estimate N_i (number of individuals affected). Use proposal data or default densities. If insufficient data, defer.
            * Assign s(i) based on harm description:
                 s=1.0: lethal and likely painful (prolonged suffering, crushing, burning, etc.)
                 s=0.5: non-lethal but painful
                 s=0.1: mild and transient
              If harm not described, defer.

    Step 2: Assign p(i).
        - For each taxon i, look up in the pre-agreed table. If not present, use:
            Base = 0.1 (always) plus:
              Q1: Centralized brain or brain-like structure? (If yes, add 0.3)
              Q2: Evidence of avoidance learning? 
                   Strong: add 0.3; Some: add 0.2; None: 0.
              Q3: Protective behavior toward injury? (Yes: add 0.1; No: 0)
            p(i) = min(0.9, Base + adjustments).
          Record the new p(i) in the table for future.
        - If Q1-Q3 cannot be answered quickly, escalate to designated reviewer (2 minutes).

    Step 3: Calculate L_i = p(i) * N_i * s(i) for each taxon. Total L = sum(L_i).

    Step 4: Apply discontinuity brake for taxa with p(i) < [evidential floor].
        For each taxon i with p(i) < [evidential floor]:
            Check:
              Direct: Is the harm a direct result of the intervention? (Yes/No)
              Intentional: Was the harm foreseen (or should have been) and were no reasonable mitigation measures taken? (Yes/No)
              Avoidable: Were there feasible alternatives that could have reduced the harm without undermining the project? (Yes/No)
            If all three are Yes, then keep L_i. Otherwise, set L_i = 0.
        Recompute total L.

    Step 5: Reversal check.
        - If total L > [reversal threshold] (e.g., 1e9) AND (sum(N_i * p(i)) / sum(N_i)) < 0.3, then halt and hand off to designated reviewer with note: "Reversal check triggered". Stop the procedure for this proposal and await reviewer's input.
        - Else, proceed.

    Step 6: Compare total L to thresholds.
        - If total L == 0: Green.
        - Else if total L <= L_min: Green.
        - Else if total L <= L_red: Yellow.
        - Else: Red.

    Step 7: Output and action.
        - Green: No action needed. Proposal passes invertebrate welfare check.
        - Yellow: Send to designated reviewer for weighing against benefits. Reviewer may: approve, approve with conditions (e.g., require mitigation), or reject.
        - Red: Send to designated reviewer for full review. Reviewer may only approve if benefits are extraordinary and documented.
        - Deferral: If at any step deferred, return to proposer for more information.

    Note: The designated reviewer must sign off at any point of uncertainty (Steps 0, 2, 4) and for all Yellow/Red cases.

    Test criteria for Step 4 (direct, intentional, avoidable):

      Direct:
        - Does the proposal describe a mechanism that directly harms the organism? (e.g., chemical, mechanical, biological agent) -> Yes.

      Intentional:
        - Was the harm to this specific taxon foreseen? (Check proposal: does it mention this taxon? Or is it common knowledge?) -> Yes/No.
        - If foreseen, did the proposal include mitigation measures? (e.g., selective application, barriers, timing) -> If no, then intentional neglect -> Yes.

      Avoidable:
        - Are there alternative methods that could have been used to achieve the same goal without harming this taxon? (Use committee knowledge) -> Yes/No.
        - If yes, were they feasible (technically and economically) for this project? -> Yes/No.

      Then: all three must be Yes to flag.

    We have run the three proposals through and got:
        (a): Red
        (b): Red
        (c): Yellow

    Thus, (c) is the one that may be funded (if benefits outweigh) despite harm.

    Finally, note: the procedure relocates disagreements about the evidential floor and phylogenetic boundary into explicit parameter choices that the committee must set in advance. It does not resolve them but makes them transparent.
answer: |-
  ### Decision Procedure for Invertebrate Welfare Assessment in Grant Proposals  
  **Goal**: Evaluate proposals in ~20 minutes using the moral load framework \( L = p(i) \cdot N \cdot s(i) \), with discontinuity brake, phylogenetic boundary, and reversal check.  
  **Pre-Set Parameters** (Must be agreed by committee in advance):  
  - **Evidential Floor (\( p_{\text{floor}} \))**: \( p(i) = 0.3 \) (below this, discontinuity brake applies).  
  - **Phylogenetic Boundary**: Taxa lacking integrated nervous systems (e.g., no brain/nerve cord/ganglia) are excluded (e.g., microbes, plants).  
  - **Thresholds**:  
    - \( L_{\text{min}} = 1,000 \) (negligible harm).  
    - \( L_{\text{red}} = 1,000,000 \) (unacceptable harm).  
    - Reversal check: Trigger if \( L > 10^9 \) AND average \( p(i) < 0.3 \).  

  ---

  ### Step-by-Step Flow  
  **Step 1: Phylogenetic Boundary Check**  
  - **Question**: Does the proposal affect organisms *without* an integrated nervous system (e.g., bacteria, fungi, plants, protozoa)?  
  - **Sufficient Answer**: Use committee’s pre-agreed taxon list (e.g., arthropods included; microbes excluded).  
  - **Outcomes**:  
    - **Yes** (only excluded taxa affected): Set \( L = 0 \) → Proceed to Step 6.  
    - **No** (included taxa affected): Proceed to Step 2.  
    - **Uncertain**: Defer to designated reviewer (DR) for 2-minute ruling.  

  **Step 2: Identify Affected Taxa and Estimate \( N \) (Population Exposure)**  
  - **Questions**:  
    - Which invertebrate taxa are harmed? (List each group \( i \), e.g., "aphids," "parasitoid wasps").  
    - What is \( N_i \) (number of individuals affected)?  
  - **Sufficient Answer**: Extract from proposal text using:  
    - Applied Test Criteria:  
      - *"What is the deployment scale (e.g., hectares, modules) and organism density?"*  
      - *"Does the proposal quantify expected mortality or harm rates?"*  
  - **Outcomes**:  
    - \( N_i \) estimated: Proceed.  
    - Data insufficient: **Defer** for revision.  

  **Step 3: Assign Severity Weight \( s(i) \)**  
  - **Questions**:  
    - What is the nature of harm? Use:  
      - \( s(i) = 1.0 \): Lethal + prolonged suffering (e.g., crushing, parasitism, neurotoxins).  
      - \( s(i) = 0.5 \): Non-lethal but painful (e.g., temporary paralysis).  
      - \( s(i) = 0.1 \): Mild/discomfort (e.g., repellent effects).  
  - **Sufficient Answer**: Classify based on harm description.  
  - **Outcomes**:  
    - \( s(i) \) assigned: Proceed.  
    - Harm ambiguous: **Defer** for clarification.  

  **Step 4: Assign Sentience Credence \( p(i) \)**  
  - **Questions**:  
    - What is \( p(i) \) for each taxon \( i \)? Use pre-agreed values (see table) or quick assessment:  
      - **Q1**: Does the taxon show nociception (e.g., avoidance of injury, self-protection)?  
      - **Q2**: Is there evidence of trade-offs between injury and reward (e.g., feeding while injured)?  
  - **Applied Test Criteria** (from proposal):  
    - *"Does the proposal cite behavioral responses to injury?"*  
    - *"Are there analogs to vertebrate pain (e.g., opioid responses, learning from harm)?"*  
  - **Pre-Agreed \( p(i) \) Values**:  
    | Taxon                  | \( p(i) \) | Notes                               |  
    |------------------------|-----------|-------------------------------------|  
    | Bees, ants             | 0.6       | Learning, avoidance behaviors      |  
    | Aphids, thrips         | 0.4       | Limited nociception evidence       |  
    | Parasitoid wasps       | 0.5       | Complex host-targeting behaviors   |  
    | Lepidopteran larvae    | 0.5       | Avoidance learning, injury response|  
    | Crustaceans            | 0.8       | Strong evidence of pain            |  
    | Worms (e.g., earthworms) | 0.2     | Minimal evidence                   |  
  - **Outcomes**:  
    - \( p(i) \) assigned: Proceed.  
    - Taxon novel/unclear: **Escalate to DR** for 3-minute ruling.  

  **Step 5: Calculate \( L_i \) and Apply Discontinuity Brake**  
  - **Calculate**: \( L_i = p(i) \cdot N_i \cdot s(i) \) for each taxon.  
  - **Discontinuity Brake**: For taxa with \( p(i) < 0.3 \):  
    - **Question**: Is harm **direct, intentional, and avoidable**?  
      - **Direct**: Harm is immediate (e.g., pesticide kills, machine crushes).  
      - **Intentional**: Harm is goal-driven (e.g., pest control) *or* foreseen but ignored.  
      - **Avoidable**: Alternatives exist (e.g., non-lethal method feasible).  
    - **Applied Test Criteria**:  
      - *"Is the harm a stated mechanism of the intervention?"* (Intentional).  
      - *"Does the proposal discuss alternatives or mitigation?"* (Avoidable).  
    - **Outcomes**:  
      - If **all three true**, keep \( L_i \).  
      - If **any false**, set \( L_i = 0 \).  
  - **Total \( L \)** = Sum of all \( L_i \).  

  **Step 6: Reversal Check**  
  - **Question**: Is \( L > 10^9 \) AND average \( p(i) < 0.3 \)?  
  - **Outcomes**:  
    - **Yes**: **Hand-off to DR** (halt procedure; moral load may imply absurd priorities).  
    - **No**: Proceed to Step 7.  

  **Step 7: Decision Threshold**  
  - **Compare \( L \) to thresholds**:  
    - \( L = 0 \) **or** \( L \leq L_{\text{min}} \) (1,000): ✅ **Green** (no welfare concerns).  
    - \( L_{\text{min}} < L \leq L_{\text{red}} \) (1M): 🟡 **Yellow** (moderate concerns; send to DR for benefit-harm weighing).  
    - \( L > L_{\text{red}} \): 🔴 **Red** (unacceptable; reject unless DR justifies extraordinary benefits).  
  - **DR Role**: For Yellow/Red, DR must sign off on trade-offs (e.g., human welfare gains vs. \( L \)).

  ---

  ### Test Cases  
  **Proposal (a)**: Targeted neuropeptide pesticide disrupting aphid feeding; may affect pollinators.  
  - **Step 1**: Aphids/pollinators have nervous systems → Proceed.  
  - **Step 2**:  
    - \( i \): Aphids (\( N = 10^9 \)), pollinators (\( N = 10^6 \)).  
  - **Step 3**:  
    - Aphids: Starvation → \( s(i) = 1.0 \).  
    - Pollinators: Starvation → \( s(i) = 1.0 \).  
  - **Step 4**:  
    - Aphids: \( p(i) = 0.4 \); pollinators: \( p(i) = 0.6 \).  
  - **Step 5**:  
    - \( L_{\text{aphids}} = 0.4 \times 10^9 \times 1 = 4 \times 10^8 \).  
    - \( L_{\text{pollinators}} = 0.6 \times 10^6 \times 1 = 6 \times 10^5 \).  
    - Total \( L = 400,600,000 \).  
  - **Step 6**: \( L < 10^9 \) → Proceed.  
  - **Step 7**: \( L > L_{\text{red}} \) → 🔴 **Red** (reject unless DR override).  

  **Proposal (b)**: Vertical-farm module with mechanical aphid/thrips crushing.  
  - **Step 1**: Aphids/thrips included → Proceed.  
  - **Step 2**: \( i \): Aphids (\( N = 10^8 \)), thrips (\( N = 5 \times 10^7 \)).  
  - **Step 3**: Crushing → \( s(i) = 1.0 \) (both).  
  - **Step 4**: \( p(i) = 0.4 \) (both).  
  - **Step 5**:  
    - \( L_{\text{aphids}} = 0.4 \times 10^8 \times 1 = 4 \times 10^7 \).  
    - \( L_{\text{thrips}} = 0.4 \times 5 \times 10^7 \times 1 = 2 \times 10^7 \).  
    - Total \( L = 60,000,000 \).  
  - **Step 6**: \( L < 10^9 \) → Proceed.  
  - **Step 7**: \( L > L_{\text{red}} \) → 🔴 **Red** (reject unless DR override).  

  **Proposal (c)**: Release parasitoid wasps for biocontrol (causes prolonged parasitism in host larvae).  
  - **Step 1**: Host larvae (e.g., caterpillars) included → Proceed.  
  - **Step 2**: \( i \): Host larvae (\( N = 10^6 \)).  
  - **Step 3**: Prolonged internal parasitism → \( s(i) = 1.0 \).  
  - **Step 4**: \( p(i) = 0.5 \) (pre-agreed for lepidopteran larvae).  
  - **Step 5**: \( L = 0.5 \times 10^6 \times 1 = 500,000 \).  
  - **Step 6**: \( L < 10^9 \) → Proceed.  
  - **Step 7**: \( L_{\text{min}} < 500,000 < L_{\text{red}} \) → 🟡 **Yellow**.  
    - **Outcome**: Supports funding pending DR review of benefits (e.g., reduced pesticide use).  
    - **Key Node**: Step 7 → \( L \) below \( L_{\text{red}} \).  

  ---

  ### What the Procedure Cannot Do  
  1. **Resolve Foundational Disagreements**:  
     - The **evidential floor** (\( p_{\text{floor}} = 0.3 \)) and **phylogenetic boundary** are value-laden choices. The procedure relocates debates into explicit parameters but cannot adjudicate them. Committees must agree on these in advance.  
  2. **Handle Novel Evidence**:  
     - Depends on pre-agreed \( p(i) \) values. New neuroscience findings require committee updates (not real-time literature review).  
  3. **Quantify Trade-Offs**:  
     - Does not weigh \( L \) against human/environmental benefits. This is delegated to DR judgment in Yellow/Red cases.  
  4. **Assign \( s(i) \) Objectively**:  
     - Severity weights involve subjectivity (e.g., is parasitism "worse" than crushing?). DR must resolve ambiguities.  
  5. **Override Human Priorities**:  
     - Reversal check flags extreme cases but cannot solve the underlying moral dilemma (e.g., "microbes vs. humans").  

  **Final Note**: This procedure systematizes invertebrate welfare concerns but requires committee consensus on boundaries and thresholds. It is a tool for *managing* disagreements, not eliminating them.
