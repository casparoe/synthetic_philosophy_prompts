  hey im trying to understand williams integrity objection and the one thought too many idea for my ethics paper and i think im getting it wrong. so like if your spouse is drowning and you save them without stopping to do a utilitarian caluclation about strangers, thats the good kind of decision right? but then my friend said that means williams thinks integrity is just loyalty, like your ground projects are only the people you love and morality should never make you betray them. but then what about if your ground project is being a fair judge and you have to recuse yourself from your brothers case? if you actually do the calculation and step aside, is that one thought too many? and my teacher said integrity isnt the same as being honest, but then whats the difference? i feel like im mixing up loyalty with something else but i cant figure out what. can someone clear this up?
reasoning: |-
  Okay, the user is really struggling with Bernard Williams' concepts of integrity and the "one thought too many" objection in ethics. They're writing a paper and confused about several points. 

  First, their drowning spouse example seems correctly understood - Williams would indeed see saving without utilitarian calculation as preserving integrity. But their friend oversimplified by equating integrity with mere loyalty to loved ones. That's a common misinterpretation. 

  The judge example is particularly sharp. If recusing from a brother's case feels like betraying integrity despite being morally correct, that perfectly illustrates Williams' point about morality demanding alienation from our projects. The user intuitively grasps the tension but needs help articulating why recusal feels like "one thought too many" even when necessary.

  Their honesty/integrity confusion is also spot-on. Honesty is about truth-telling, while integrity concerns maintaining your identity-conferring commitments. The user senses they're conflating loyalty with something deeper but can't name it - that "something" being our constitutive projects that make us who we are.

  What they need most is: 1) Clarification that integrity isn't just interpersonal loyalty but about any foundational commitments (like being a judge), 2) Explanation of why moral demands can violate integrity even when right, and 3) The honesty/integrity distinction through concrete examples. 

