  My flatmate summed up Camus's anti-death-penalty argument like this: he thinks capital punishment is just premeditated murder done by the state, so its actually worse than the original crime because its cold and calculated. He also believes there's clear statistical proof it doesnt deter anyone, and since the absurd hero lives by constant revolt against fate, executing someone robs them of the chance to keep struggling and changing. So he wants life imprisonment instead — not because human life is sacred, but because killing cuts off the very revolt that gives existence its dignity. Is that a fair summary? I'm suspicious he's smuggling absurdism in where it doesnt belong. Could you go through it point by point, say what Camus actually argued, what's a simplification or misreading, and whether the conclusion that his opposition is basically existentialist rather than humanist holds up? Please write in British English.
