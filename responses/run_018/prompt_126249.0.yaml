answer: |-
  Here is a comprehensive specification of desiderata for an adequate suffering-focused axiology (SFA), structured as requested, followed by a brief evaluation of key frameworks.

  **Core Tensions (Brainstorming):**
  1.  **Minimization vs. Existence:** Minimizing suffering *absolutely* suggests eliminating all sentient life ("Extinction Gambit"). But is existence *always* net negative? Intuitions rebel against mandatory extinction.
  2.  **Asymmetry vs. Symmetry:** Preventing suffering seems categorically more urgent than creating pleasure (Asymmetry). Yet, does *any* amount of suffering always outweigh *any* amount of bliss? Or is there a point of symmetry?
  3.  **Certainty vs. Uncertainty:** Obligations to alleviate *actual, intense* suffering feel paramount. But what about preventing *potential* future suffering, especially catastrophic risks? How do we weigh uncertain, distant futures?
  4.  **Direct Action vs. Systemic Effects:** Directly relieving suffering seems obligatory. Yet, ecological interventions (e.g., reducing wild animal suffering) or policies affecting future population size raise questions of agency, unintended consequences, and the "intergenerational shadow."
  5.  **Urgency vs. Totality:** Is preventing the *most intense* suffering absolutely prior? Or is the *total sum* of suffering the key metric, even if composed of milder instances?

  **Desiderata for an Adequate Suffering-Focused Axiology:**

  **I. Cases It Must Handle Correctly:**

  1.  **The Asymmetry (Non-Negotiable Core):**
      *   **Case:** Choosing between creating a happy life or preventing a miserable one. Preventing the miserable life is intuitively obligatory, while creating the happy life is merely supererogatory.
      *   **Requirement:** The SFA must capture this fundamental priority of preventing suffering over creating pleasure. Preventing suffering generates strong obligations; creating pleasure does not.
  2.  **The Extinction Gambit / Minimalist Utopia (Non-Negotiable Constraint):**
      *   **Case:** If minimizing suffering *absolutely* is the sole good, then painlessly eliminating all sentient life achieves zero suffering and seems optimal. However, a world with minimal, managed suffering and worthwhile lives is intuitively preferable to extinction.
      *   **Requirement:** The SFA must avoid mandating extinction or the destruction of intrinsically worthwhile lives as the *optimal* outcome. It cannot imply that non-existence is *always* better than existence.
  3.  **Wild-Animal Suffering (WAS) (Central Challenge):**
      *   **Case:** Vast numbers of wild animals endure intense suffering due to predation, starvation, disease, and parasitism. Is there a moral obligation to intervene in nature to reduce this suffering?
      *   **Requirement:** The SFA must provide a coherent stance on WAS. It must specify conditions under which intervention is obligatory, permissible, or impermissible, addressing agency, feasibility, ecosystem complexity, and unintended consequences. Ignoring WAS undermines consistency for suffering-focused views.
  4.  **The Intergenerational Shadow (Critical Challenge):**
      *   **Case:** Alleviating suffering today (e.g., improving healthcare, reducing infant mortality, increasing prosperity) often leads to larger future populations, potentially increasing the *total* amount of suffering over time.
      *   **Requirement:** The SFA must account for the long-term population consequences of suffering-reduction actions. It must provide principles for evaluating trade-offs between reducing suffering now and potentially increasing the pool of potential sufferers in the future. Ignoring this leads to self-defeating strategies.
  5.  **The Repugnant Conclusion - Negative Variant:**
      *   **Case:** Is a world with a vast number of lives barely worth living (minimal positive value, very mild suffering) better or worse than a world with a small number of very good lives (high positive value, no suffering)? Pure minimization might favor the vast world if total suffering is lower, but this seems counterintuitive.
      *   **Requirement:** The SFA should avoid implying that a vast population with lives barely worth living (or net negative but minimally so) is better than a smaller population with excellent lives, solely because the *total* suffering is lower. It must respect the quality of individual lives.
  6.  **Catastrophic Risk Prevention (High Priority):**
      *   **Case:** Preventing events causing vast amounts of intense suffering (e.g., astronomical waste, dystopian lock-ins, extreme AGI suffering) demands significant resources, even with low probability.
      *   **Requirement:** The SFA must assign extremely high priority to preventing scenarios involving astronomical amounts of intense suffering, even if probabilities are low, reflecting the moral urgency of preventing worst-case outcomes.

  **II. Distinctions It Must Preserve:**

  1.  **Intensity vs. Moral Urgency (Non-Negotiable):**
      *   **Distinction:** Not all suffering is equal. A short burst of extreme agony is intuitively worse (more morally urgent) than a long period of mild discomfort, even if the total "hedonic units" of discomfort are higher.
      *   **Requirement:** The SFA must prioritize the reduction of the *most intense* forms of suffering over the reduction of larger sums of less intense suffering. It must reflect the non-linearity of suffering's badness (e.g., diminishing marginal disutility is likely incorrect).
  2.  **Direct Harm vs. Ecological Omission:**
      *   **Distinction:** Actively causing harm (e.g., torturing an animal) is clearly wrong. Failing to prevent harm occurring naturally (e.g., not stopping a predator killing prey) feels different, involving questions of agency, responsibility, and feasibility.
      *   **Requirement:** The SFA must articulate a defensible difference in moral weight (if any) between actively causing suffering and passively allowing suffering to occur through non-intervention in complex systems like nature. It must avoid collapsing all suffering into equivalent moral demands regardless of source/agency.
  3.  **Actual Suffering vs. Merely Potential Suffering:**
      *   **Distinction:** An actual being experiencing agony demands immediate action. Reducing the *risk* of future suffering for potential beings is important but less existentially urgent.
      *   **Requirement:** The SFA must prioritize alleviating the suffering of actual, existing beings over preventing suffering for merely potential future beings, without completely discounting the latter. It must avoid demanding infinite sacrifices to avert all conceivable future suffering.
  4.  **Suffering vs. Mere Preference Frustration:**
      *   **Distinction:** Intrinsic, phenomenally bad experiences (suffering) are the core concern. Frustration of preferences or desires without concomitant negative experience is less central (though potentially instrumentally relevant).
      *   **Requirement:** The SFA must be grounded primarily in the reduction of *felt suffering* (negative conscious experience), not merely the frustration of preferences or the violation of abstract rights in the absence of suffering.

  **III. Consistency Constraints:**

  1.  **Avoid Self-Defeatingness (Non-Negotiable):**
      *   **Constraint:** The SFA's core principles must not lead to prescriptions that systematically increase suffering in the long run or undermine the possibility of achieving its own goals (e.g., the Intergenerational Shadow problem).
      *   **Motivation:** An ethical system cannot be coherent if following its dictates reliably produces worse outcomes by its own lights.
  2.  **Avoid Paralysis by Infinite Regress / Uncertainty (Non-Negotiable):**
      *   **Constraint:** The SFA must provide actionable guidance. It cannot collapse into inaction due to the theoretical possibility of infinite future suffering or radical uncertainty about long-term effects overwhelming all present obligations.
      *   **Motivation:** Ethics needs to guide action. A theory demanding certainty about infinite futures is practically useless and paralyzing.
  3.  **Transitivity of Betterness (Generally Non-Negotiable):**
      *   **Constraint:** If outcome A is better than B, and B is better than C, then A must be better than C. Violations lead to cyclic preferences and irrationality.
      *   **Motivation:** Fundamental requirement of rational choice and coherent axiological ordering.
  4.  **Avoid the "Fanaticism" Problem:**
      *   **Constraint:** Assigning *infinite* (or lexically infinite) disvalue to certain suffering states makes any non-zero probability of such suffering dominate all other considerations, demanding all resources go to its prevention, however unlikely.
      *   **Motivation:** While preventing worst-case suffering is crucial, fanaticism ignores tractable suffering reduction and leads to bizarre, counterproductive resource allocation in the real world. An adequate SFA must weigh probabilities and magnitudes meaningfully.

  **IV. Apparent Jointly Unsatisfiable Desiderata Pairs:**

  1.  **Absolute Minimization vs. Anti-Extinction:**
      *   **Conflict:** If minimizing suffering absolutely is paramount (D.I.1, D.I.2 demand), extinction seems optimal (D.I.3). But D.I.3 forbids this. Satisfying both seems impossible for a pure "suffering is the only bad" view.
      *   **Reasoning:** This is the core tension. Resolutions usually involve either: (a) Lexical thresholds (below which life is net positive/acceptable), (b) Assigning *some* positive value to worthwhile lives/experiences (weak NU), or (c) Prioritizing reducing *intense* suffering over eliminating *all* suffering.
  2.  **WAS Intervention Priority vs. Avoiding Ecological Collapse / Unintended Consequences:**
      *   **Conflict:** D.I.5 demands taking WAS seriously, implying potential large-scale intervention. However, D.II.2 acknowledges the complexity and risks of intervention. Aggressive intervention could cause ecosystem collapse or unforeseen suffering (violating D.III.1).
      *   **Reasoning:** The tension lies in balancing the moral urgency of immense existing suffering against the high stakes and uncertainty of large-scale ecological engineering. An adequate SFA needs robust decision rules under uncertainty for such cases.
  3.  **Catastrophic Risk Priority (D.I.6) vs. Avoiding Fanaticism (D.III.4):**
      *   **Conflict:** Assigning extreme priority to preventing low-probability, high-magnitude suffering risks fanaticism, demanding we sacrifice all present well-being for tiny reductions in existential risk. But ignoring such risks seems morally reckless.
      *   **Reasoning:** The challenge is calibrating the priority: How much should we discount low probabilities? Does the disvalue scale linearly, or super-linearly with magnitude? Finding a non-arbitrary balance is difficult.

  **Evaluation of Frameworks:**

  1.  **Classic Negative Utilitarianism (NU: Minimize Total Suffering):**
      *   **Strengths:** Captures the Asymmetry (I.1), handles WAS as a moral problem (I.3), strong on Catastrophic Risk (I.6) in principle.
      *   **Failures:** **Catastrophically fails** the Extinction Gambit (I.2) and Anti-Extinction requirement. Struggles severely with the Intergenerational Shadow (I.4) – reducing suffering now often increases future suffering totals. Ignores Intensity/Urgency distinction (II.1) – would trade intense agony for vast mild discomfort. Directly violates Anti-Extinction (I.2) and risks Self-Defeatingness (III.1) via Intergenerational Shadow. Fails Repugnant Conclusion - Negative Variant (I.5). High risk of Fanaticism (III.4) or Paralysis (III.2).

  2.  **Lexical Suffering-Minimization (E.g., Critical-Level NU or Prioritarianism):**
      *   **Strengths:** **Solves Extinction Gambit** (I.2) by prioritizing eliminating suffering above a critical threshold of intensity/duration; lives below the threshold are net bad, above it can be net positive. Captures Intensity/Urgency (II.1) robustly. Handles Catastrophic Risk (I.6) well if worst suffering is lexically prior. Avoids Fanaticism for sub-threshold suffering.
      *   **Failures:** Struggles with **Cumulative Mild Suffering**: Vast amounts of suffering *below* the lexical threshold might be ignored compared to a smaller amount above it, which seems counterintuitive (violates II.1 nuance?). Handling the Intergenerational Shadow (I.4) remains complex; preventing mild suffering now might increase future population and thus total mild suffering. Defining the threshold non-arbitrarily is challenging. Ecological Omission (II.2) and WAS (I.3) require careful threshold application.

  3.  **Threshold-Sensitive Suffering-Focused View (E.g., Asymmetric Suffering-Focused Prioritarianism):**
      *   **Strengths:** Prioritizes reducing intense suffering (II.1), avoids mandating extinction (I.2) by allowing positive value above a suffering threshold. Better handles Cumulative Mild Suffering than Lexical views (via prioritization weights, not strict lexicality). Can potentially navigate WAS (I.3) and Intergenerational Shadow (I.4) by weighing intensity, probability, and population effects. Mitigates Fanaticism (III.4) by using weights, not lexicality. Addresses Asymmetry (I.1).
      *   **Failures:** Defining the threshold(s) and weighting functions robustly and non-arbitrarily is a major challenge. Risk of ad-hocery. Less decisive than Lexical views on Catastrophic Risk (I.6) if worst suffering isn't lexically infinite. Balancing Intensity vs. Totality (II.1 vs. I.4, I.5) within the weighting scheme remains difficult. Ecological Omission (II.2) still needs explicit principles.

  **Summary:** An adequate SFA must navigate the core tension between minimizing suffering and preserving worthwhile existence. Classic NU fails fundamentally on anti-extinction. Lexical views solve extinction but risk ignoring large sums of sub-threshold suffering. Threshold-sensitive views offer the most promising flexibility but face challenges in parameter specification and avoiding arbitrariness while rigorously handling cases like Intergenerational Shadow and WAS, and preserving crucial distinctions like Intensity vs. Urgency. All struggle significantly with the Intergenerational Shadow; resolving this sustainably is perhaps the most critical open challenge for SFAs.
