  For the desiderata, I'll organize them into four sections as requested. The cases section needs to cover real-world problems like wild animal suffering and the intergenerational shadow issue. For distinctions, I'll emphasize intensity versus urgency - not all suffering is equally morally pressing. The consistency constraints must include avoiding paralysis from infinite future suffering calculations.

