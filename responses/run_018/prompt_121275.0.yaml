prompt: |-
  ok so for a reading group on reasoning under uncertainty i've been writing down my views and want a consistency check before i present them. here's my package:

  (1) for any concrete forecast i should start with the outside view / reference class and only adjust modestly.
  (2) epistemic modesty means i have to admit my inside-view reasoning could be wrong, but also that i might genuinely be in a different reference class if i have specific structural reasons.
  (3) i think you shouldn't update your self-image as an outlier until you've got actual track record of being right against the base rate, not just one good argument.
  (4) in domains where the reference class is heterogeneous or poorly defined, the outside view is weak and i should weight inside view more heavily - but i should be suspicious of my own judgment that this domain is heterogeneous.
  (5) i think the principle always-start-outside is itself an inside-view claim about good reasoning, so treating it as axiomatic is a kind of self-undermining move.

  my worry is that (2) gives me permission to claim exceptionality whenever i have structural reasons while (3) says i need track record first - those seem to clash on when inside-view adjustments are allowed. and (5) looks like it kills (1). but is the clash between (2) and (4) real or just apparent? can you audit this: rank tensions by severity, say for each what has to give, and flag which ones dissolve on closer look? don't lecture me on tetlock or whatever, just check the package.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're preparing for a reading group on reasoning under uncertainty and want a consistency check on their five points. The main worry is about potential clashes between points (2) and (3), and also how (5) might undermine (1). Plus, they're questioning if (2) and (4) conflict.

  First, I need to understand each point individually. Point (1) emphasizes starting with the outside view and making only modest adjustments. Point (2) allows for claiming exceptionality with structural reasons but requires epistemic modesty. Point (3) insists on a track record before self-identifying as an outlier. Point (4) suggests that in heterogeneous domains, the inside view gets more weight but warns against self-deception. Point (5) points out that the outside-view principle itself is an inside-view claim, which could be self-undermining.

  The user's primary concern is the tension between (2) and (3). On the surface, (2) permits using structural reasons to adjust away from the base rate, while (3) demands a track record before considering oneself an outlier. That seems contradictory. But maybe there's a way to reconcile them. Perhaps (2) allows for modest adjustments based on structural reasons without claiming outlier status. Point (3) would then come into play only when claiming significant exceptionality. So the severity here is high, but it can be resolved by clarifying that structural reasons allow for minor adjustments, while outlier status requires evidence.

  Next, the clash between (1) and (5). Point (5) argues that always starting with the outside view is itself an inside-view claim, making (1) self-undermining. That's a meta-tension. The user might need to accept that (1) is a defeasible heuristic rather than an absolute rule. So (1) should be applied with the awareness from (5), perhaps viewing it as a starting point but open to revision. High severity, but manageable by framing (1) as a practical guideline.

  Between (2) and (4), the user thinks there might be a conflict, but actually, they complement each other. Both address when to rely more on the inside view: (2) for structural reasons, (4) for heterogeneous reference classes. The caution in (4) about self-deception aligns with (2)'s epistemic modesty. So this tension dissolves upon closer look.

  Looking deeper, the user is likely interested in refining their framework for practical application in the reading group. They want to present a coherent package without obvious contradictions. Their unspoken need might be to defend their stance against potential critiques, so resolving these tensions is crucial for credibility. They might also value a balance between structured heuristics and flexibility, avoiding both rigid adherence and total dismissal of the outside view.

  I should rank the tensions by severity. The (2)/(3) clash is top because it affects decision-making directly. Then (1)/(5) as a foundational issue, but more philosophical. (2)/(4) isn't a real conflict. The resolution involves clarifying the thresholds for adjustments versus outlier claims, accepting the heuristic nature of (1), and recognizing the synergy between (2) and (4). This should make their package robust and internally consistent.
answer: |-
  Here's a consistency audit of your reasoning package, ranked by severity of tension and resolution paths:

  **Severity Ranking & Resolution:**

  1.  **Tension: (2) vs. (3) - "Structural Reasons" vs. "Track Record Required"**
      *   **Severity:** **Highest** (Core operational conflict).
      *   **Nature:** (2) grants permission for *modest* adjustment based on "specific structural reasons" *without* requiring prior track record. (3) forbids self-identification as an outlier ("different reference class") *until* a track record is established. The conflict arises when "structural reasons" are used to justify a *de facto* claim of being in a *different* reference class (i.e., an outlier).
      *   **Resolution Required:** Clarify the **threshold** and **nature** of the adjustment.
      *   **What Must Give:** Refine (2) or (3). The cleanest resolution is:
          *   **Interpret "modest adjustment" in (1)/(2) as *within* the reference class distribution**, not *moving* classes. "Structural reasons" justify modest deviations *from the mean/median* of the *existing* class, but don't justify reclassifying oneself as an *outlier class*.
          *   **Reserve "different reference class" in (2)/(3) for truly distinct populations.** Claiming this *requires* the track record demanded by (3). "Structural reasons" might be the *hypothesis* for *why* you *might* be in a different class, but (3) blocks *acting* on that hypothesis (i.e., significantly deviating from the original class forecast) without evidence.
      *   **Result:** (2) allows modest *adjustments within class* based on structure. (3) blocks claiming *outlier status/new class* without evidence. The tension dissolves by separating "adjustment magnitude" from "class membership claim."

  2.  **Tension: (1) vs. (5) - "Axiomatic Start Outside" vs. "Self-Undermining Principle"**
      *   **Severity:** **High** (Foundational/philosophical tension).
      *   **Nature:** (5) correctly points out that the foundational principle (1) is itself an inside-view judgment. Insisting on it as axiomatic contradicts the spirit of epistemic modesty and the outside view applied to reasoning itself.
      *   **Resolution Required:** Re-conceptualize the status of (1).
      *   **What Must Give:** The "axiomatic" or absolute interpretation of (1). (1) cannot be a logically unassailable axiom if (5) is true.
      *   **Resolution Path:** Embrace (5) and **downgrade (1) from an axiom to a strongly justified, defeasible heuristic.** You *start* with the outside view *because*, based on your inside-view analysis of reasoning failures (confirmation bias, overconfidence, poor intuitive probability, historical track records like Tetlock's), it's consistently shown to be more robust *as a starting point*. This is an *application* of the outside view *to reasoning strategies themselves* – the "reference class" is "common reasoning pitfalls," and the base rate suggests starting outside is wise. It's meta-consistent. The tension dissolves by accepting (1) as a high-priority heuristic justified by an *outside-view analysis of reasoning*, not an unrevisable axiom.

  3.  **Tension: (2) vs. (4) - "Structural Reasons" vs. "Heterogeneous Domain Weighting"**
      *   **Severity:** **Low/Apparent** (Synergistic upon closer look).
      *   **Nature:** Superficially, both deal with allowing more inside-view weight, potentially creating conflict over *which* reason to use. (2) focuses on specific *case* structure, (4) on *domain* properties.
      *   **Resolution:** They address **different triggers** for increased inside-view weighting and **reinforce** each other's caution.
          *   **(4) is a Domain-Level Rule:** It tells you *when* the outside view is inherently weaker (poorly defined/heterogeneous ref class), warranting *more* reliance on inside view *in general* for that domain.
          *   **(2) is a Case-Level Rule:** *Within any domain* (even one with a strong ref class), it allows modest adjustment for specific structural features of *this particular case*, tempered by epistemic modesty about those reasons.
          *   **(4)'s Caution Supports (2):** The suspicion in (4) ("be suspicious of my own judgment that this domain is heterogeneous") directly reinforces the epistemic modesty required in (2) for judging "structural reasons." It's a specific application of that modesty to the domain-classification question.
      *   **Result:** No fundamental clash. (4) sets the domain context, (2) operates within it. (4)'s suspicion clause harmonizes perfectly with (2)'s modesty clause. **Tension dissolves.**

  **Summary of Resolved Package:**

  *   **(1):** Start with the outside view / reference class forecast. (Understood as a high-priority, defeasible heuristic justified by an outside-view analysis of reasoning pitfalls, not an absolute axiom).
  *   **(2):** You may make *modest adjustments* to the reference class forecast based on specific structural reasons unique to the case, *while maintaining epistemic modesty* (admitting your reasoning could be wrong). This adjustment assumes you are *within* the original reference class distribution.
  *   **(3):** Claiming you belong to a *fundamentally different reference class* (i.e., are an outlier requiring a *dramatically* different forecast) requires a track record of success against the base rate. "Structural reasons" alone are insufficient for this claim; they are merely a hypothesis to be tested.
  *   **(4):** In domains where the reference class is poorly defined or highly heterogeneous, the outside view is weak, warranting *more* reliance on the inside view. *However*, be highly suspicious of your own judgment that the domain *is* heterogeneous/poorly defined, as this is prone to bias.
  *   **(5):** The principle "always start outside" (1) is itself an inside-view claim. It is best justified not as an axiom, but as a heuristic strongly supported by an outside-view analysis of common reasoning failures (meta-consistency).

  **Key Reconciliation:** The apparent clash between (2) and (3) is resolved by strictly distinguishing between **modest adjustments *within* a reference class** (permitted by (2) with modesty, without track record) and **claiming *outlier status/new reference class*** (forbidden by (3) without track record). (5) is resolved by acknowledging (1) as a defeasible heuristic justified meta-rationally. (2) and (4) are complementary, not conflicting. Your package is internally consistent with these clarifications. Good luck with the reading group!
