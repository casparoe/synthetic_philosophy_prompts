prompt: |-
  I run the data team for a small policy institute, and we maintain a database of “counterfactual case files”: each file starts from a real event and then describes one or two alternatives, such as a different person winning an election, a different chemical being stored in a tank, or a defendant having a different prior record. We constantly have to decide whether two expressions pick out the same thing across the actual file and the counterfactual one. For example, does “the mayor” in the alternative still refer to the actual mayor, or just to whoever is mayor there? If an analyst writes “Jordan Lee” rather than “the whistleblower,” does that settle the issue? And if we discover that two aliases belong to one person, how should the database represent the fact that this was empirically learned but, once true, seems to hold in every relevant scenario?

  Please turn the philosophy of rigid designation and the necessary a posteriori into a procedure my analysts can follow without knowing that literature. I want ordered steps, tests they can apply to names, aliases, definite descriptions, role terms, natural-kind terms, organizations, and documents; rules for when an expression may be linked across scenarios and when it must be marked “role occupant only”; and guidance for recording genuinely empirical identity claims without treating every database join as metaphysically necessary. Make it usable in about fifteen minutes per case, with explicit stop points and with places where human judgment is unavoidable rather than pretending the checklist settles everything.

  Apply the procedure to three hard cases: an alternate election file containing both “the candidate who won” and the actual winner’s name; a chemical-safety file in which “the solvent in Tank 4” is later identified as acetone; and a company-merger file where the post-merger firm keeps the old name, most staff, and one legal registration but changes ownership. Include at least one case where the procedure blocks a link that our analysts will find narratively obvious but that is not philosophically justified. Also say which distinctions from the theory have to survive the simplification, which can safely be dropped for our purposes, and how hte procedure might misfire if someone treats “same label” as automatically meaning “same entity.”
reasoning: |-
  We are creating a procedure for determining when expressions in different scenarios (actual and counterfactual) refer to the same entity. The goal is to avoid both over-identification (treating role occupants as the same individual across scenarios) and under-identification (missing genuine cross-scenario identities). The procedure is based on the philosophy of rigid designation and necessary a posteriori, but simplified.

  Key concepts to preserve:
  1. Rigid Designators: Terms that refer to the same entity in every possible world (scenario) in which that entity exists. Typically, proper names (like "Jordan Lee") and natural kind terms (like "water") are rigid. Definite descriptions (like "the mayor") are typically non-rigid because they pick out whoever satisfies the description in that world.
  2. Necessary a posteriori: Some identity statements, though discovered empirically, are necessary. For example, "Hesperus is Phosphorus" is necessary because they are the same planet, but we found out by observation.

  Distinctions we can drop for simplicity:
  - We don't need to delve into the metaphysics of possible worlds. Instead, we treat each counterfactual scenario as a separate "world".
  - We won't require analysts to distinguish between different types of rigid designators (e.g., for individuals vs. natural kinds) in the initial steps.

  Procedure Steps:

  1. **Identify Expression Type**: Classify the expression as one of:
     - Proper Name (e.g., "Jordan Lee")
     - Definite Description (e.g., "the mayor", "the solvent in Tank 4")
     - Role Term (e.g., "the president", "the CEO")
     - Alias (e.g., "the whistleblower" for a specific person)
     - Natural Kind Term (e.g., "water", "acetone")
     - Organization (e.g., "ACME Corp")
     - Document (e.g., "the contract dated 2020-01-01")

  2. **Check for Rigid Designators**:
     - Proper names, natural kind terms, and some aliases (if they are used as rigid) are typically rigid. If the expression is a rigid designator, then it refers to the same entity across scenarios (if that entity exists in the scenario). However, note: 
       - For a proper name, if the scenario is such that the person with that name is different (e.g., an alternate election where a different person has the same name), then the name might not be rigid in that scenario? But typically, we assume that proper names are rigid. Here, we must note that in counterfactual scenarios, the same name might be given to a different person. Therefore, we must ask: **Is the name being used to refer to the same individual that it refers to in the actual world?** This requires context.
     - Rule: If the expression is a proper name and it is introduced in the actual file as referring to a specific individual, then in the counterfactual scenario, if the same name appears and the context does not suggest a different person (e.g., a different individual with the same name), then it is the same. But if the counterfactual scenario explicitly has a different person with that name (e.g., an alternate election where the winner is someone else named "John Smith"), then the name does not rigidly designate the same individual.

     However, to avoid overcomplicating, we can say: 
     - For proper names: If the name is used in the counterfactual scenario and the scenario does not explicitly state that it's a different person, then we assume it's the same person. But if the scenario describes an event that would change the identity (e.g., a different candidate wins) and the name is used for the winner in that scenario, then it's a different person.

     This step requires human judgment.

  3. **Check for Definite Descriptions and Role Terms**:
     - These are typically non-rigid. The expression refers to whoever or whatever satisfies the description in that scenario.
     - Example: "the mayor" in the counterfactual scenario refers to whoever is mayor there, which may be a different person.
     - Therefore, by default, we mark these as "role occupant only". The analyst must look for evidence that the description is being used as a rigid designator (which is rare). For example, if the description is used to fix the reference to a particular individual (like "the first person to set foot on the moon" always refers to Neil Armstrong), then it can be rigid. But without such evidence, treat as non-rigid.

  4. **Aliases**:
     - If an alias (like "the whistleblower") is introduced in the actual file and then in the counterfactual scenario the same alias is used, we must determine if it refers to the same individual. 
     - Check: Was the alias introduced as a rigid designator? Typically, if the alias is tied to a specific individual by proper name in the actual file, then in the counterfactual scenario, if the same alias is used and there is no reason to think it's a different person, then it is the same. But if the counterfactual scenario changes the identity of the whistleblower, then it's not.
     - However, if we discover that two aliases belong to one person (e.g., "Jordan Lee" and "the whistleblower" are the same in the actual world), then that identity is necessary. So, in every scenario, if both expressions appear, they refer to the same person. But note: the whistleblower role might be played by a different person in a counterfactual scenario. So, we must record that in the actual world, "the whistleblower" and "Jordan Lee" are the same, and that identity is necessary. Therefore, in any counterfactual scenario, if we have "the whistleblower", it must be Jordan Lee? Not necessarily: in a counterfactual scenario, the whistleblower might be someone else. But then we have a problem: the identity statement "the whistleblower is Jordan Lee" is contingent? 

     This is tricky. We have to separate:
     - In the actual world, the whistleblower is Jordan Lee. That's a contingent fact. In a counterfactual scenario, the whistleblower might be someone else. Therefore, the alias "the whistleblower" in the counterfactual scenario might refer to a different person. However, once we know that in the actual world they are the same, we have to note that the expression "the whistleblower" in the actual world refers to Jordan Lee. But in the counterfactual scenario, we have to look at the context to see if it's the same person.

     So, for aliases: 
     - The alias by itself is non-rigid. But if we have an identity statement in the actual world (like "the whistleblower is Jordan Lee"), then in the counterfactual scenario, if we use the alias "the whistleblower", it does not automatically refer to Jordan Lee. It refers to whoever is the whistleblower in that scenario. However, if we also have the name "Jordan Lee" in that scenario, then we know that in that scenario, if we have evidence that "the whistleblower" is Jordan Lee, then we can link them. Otherwise, they might be different.

     This seems messy. We can say:
     - The identity between an alias and a rigid designator (like a proper name) is a contingent fact. Therefore, in the counterfactual scenario, unless we have explicit information that the same identity holds, we do not assume it.

     However, note Kripke's point: identity statements between rigid designators are necessary. So if "the whistleblower" is a rigid designator? But typically, descriptions are non-rigid. 

     We can simplify: 
     - Treat aliases that are definite descriptions as non-rigid. Therefore, in the counterfactual scenario, they refer to the individual that satisfies the description in that scenario. 
     - But if the alias is a proper name (or a nickname that is used as a proper name) then it is rigid.

     So step: 
     - If the alias is a definite description (like "the whistleblower"), treat it as non-rigid. 
     - If the alias is a proper name (like "Jordan Lee"), then it's rigid.

     And if we have an identity statement in the actual world between a rigid and a non-rigid term (e.g., "The whistleblower is Jordan Lee"), then we record that in the actual world they are the same. In the counterfactual scenario, we do not assume that the non-rigid term (the whistleblower) refers to Jordan Lee. We must independently determine, from the counterfactual scenario, who the whistleblower is.

  5. **Natural Kind Terms and Organizations**:
     - Natural kind terms (like "water", "acetone") are rigid: they refer to the same substance in every scenario. So "the solvent in Tank 4" being identified as acetone in the actual world implies that in the counterfactual scenario, if we have "acetone", it is the same substance. But note: "the solvent in Tank 4" is a description and non-rigid. So if in the counterfactual scenario, a different solvent is in Tank 4, then "the solvent in Tank 4" refers to that different solvent. However, the term "acetone" always refers to acetone (the chemical compound).
     - Organizations: These are tricky. An organization might be defined by its legal registration, its ownership, its staff, etc. We typically treat organization names as rigid? But consider: if a company merges and changes ownership, but keeps the name, is it the same company? This is a matter of debate. We can say: 
          - If the organization has the same legal identity (e.g., same registration number, same tax ID) then it is the same. 
          - Otherwise, if the organization has the same name but a different legal identity, then it is a different organization that happens to have the same name.

     But note: sometimes an organization might change its legal registration but continue as the same entity. We have to use judgment.

  6. **Documents**: 
     - A document is typically identified by its content or by a specific identifier (like a unique ID). If the document has the same content and is produced in the same context, then it might be the same. But if the scenario changes the content, then it's different. We can treat document identifiers as rigid if they are unique.

  7. **Empirical Identity Claims**:
     - When we discover that two expressions refer to the same entity in the actual world (e.g., "Jordan Lee" and "the whistleblower"), we record that as an empirical fact. This fact is contingent and does not automatically hold in the counterfactual scenario. However, if the two expressions are both rigid designators (e.g., "Hesperus" and "Phosphorus" for Venus), then the identity is necessary. But note: in our context, if both are rigid, then the identity holds in every scenario. 
     - Therefore, step:
          - If the two expressions are both rigid designators (e.g., two proper names) and they are found to be identical in the actual world, then we record that they are necessarily identical. In any counterfactual scenario, they must refer to the same entity (if they exist).
          - If one is rigid and the other is non-rigid, then the identity is contingent. We record the actual-world identity but do not carry it to the counterfactual scenario.

  8. **Stop Points**:
     - If the expression is a rigid designator and the entity exists in the counterfactual scenario, then link to the same entity. If it does not exist (e.g., the person is dead in the scenario), then mark as absent.
     - If the expression is non-rigid, then mark as "role occupant only" and do not link to the actual entity unless there is specific evidence in the counterfactual scenario that the same individual is being referred to (e.g., the scenario explicitly says "the same mayor as in the actual world").
     - When in doubt, mark as "role occupant only" and require explicit evidence for cross-scenario identity.

  9. **Human Judgment**:
     - Analysts must use judgment in step 2 (for proper names) and step 5 (for organizations). There is no way to avoid this.

  Procedure Summary:

  Step 1: Classify the expression.
  Step 2: If it is a rigid designator (proper name, natural kind term, or an alias that is a proper name), then:
     - Check if the entity exists in the counterfactual scenario. (Look at the scenario description.)
     - If yes, then link to the same entity. If no, then mark as absent.
     - For proper names: if the counterfactual scenario explicitly states that the name refers to a different individual (e.g., a different person with the same name), then do not link and mark as a different entity.

  Step 3: If it is non-rigid (definite description, role term, alias that is a description):
     - Mark as "role occupant only". Do not link to the actual entity unless the counterfactual scenario explicitly states that it is the same individual (e.g., "the same mayor, John Smith").
     - Exception: If the description is being used as a rigid designator (like a famous unique description, e.g., "the first man on the moon"), then treat as rigid.

  Step 4: For organizations:
     - If the organization is identified by a unique identifier (like a legal registration number) and that identifier is the same in the counterfactual scenario, then link to the same organization.
     - Otherwise, if the organization name is used and there is no unique identifier, then if the scenario describes the organization as the same (e.g., same ownership, same key staff, same assets) then link, else mark as a different organization. This step requires judgment.

  Step 5: For natural kind terms:
     - They are rigid. So if the term appears (e.g., "acetone"), it refers to the same natural kind. However, if the term is embedded in a description (e.g., "the solvent in Tank 4"), then the description is non-rigid. Only the natural kind term itself is rigid.

  Step 6: For documents:
     - If the document is identified by a unique identifier (like a specific ID number) and that identifier is the same, then link. Otherwise, if the content is the same and the context suggests it is the same document (e.g., the same contract signed on the same date), then link. Else, treat as a different document.

  Step 7: For empirical identity claims (when two expressions are found to refer to the same entity in the actual world):
     - If both expressions are rigid designators, then record that they are necessarily identical. In every counterfactual scenario, they refer to the same entity (if they exist).
     - If one is rigid and the other is non-rigid, then record the actual-world identity but note that it is contingent. In the counterfactual scenario, they may not be identical.

  Step 8: Where the procedure requires judgment (e.g., for proper names in step 2, for organizations in step 4), the analyst must note the uncertainty and make a call based on the scenario. If there is insufficient information, default to "role occupant only" for non-rigid terms and "different entity" for rigid terms if the scenario suggests a different individual.

  Now, apply to three cases:

  **Case 1: Alternate Election**
  - Actual scenario: Candidate A wins the election and is the mayor.
  - Counterfactual scenario: Candidate B wins the election and is the mayor.

  Expressions:
  - "The candidate who won" (in the counterfactual scenario, this is Candidate B).
  - The actual winner's name (say "John Smith") appears in the counterfactual scenario as the loser.

  Steps for "the candidate who won":
  1. Expression type: definite description (role term).
  2. Non-rigid -> mark as "role occupant only". In the counterfactual scenario, it refers to Candidate B, not Candidate A (John Smith). So we do not link it to John Smith.

  Steps for "John Smith":
  1. Expression type: proper name (rigid designator).
  2. In the counterfactual scenario, John Smith exists (as the loser). So we link the name "John Smith" to the same individual.

  But note: if the counterfactual scenario had a different person named "John Smith" (which it doesn't in this case), then we would mark it as a different entity. Here, it's the same person.

  **Case 2: Chemical-Safety File**
  - Actual scenario: The solvent in Tank 4 is identified as acetone.
  - Counterfactual scenario: A different solvent (say, methanol) is in Tank 4.

  Expressions:
  - "The solvent in Tank 4" (in the counterfactual scenario, it's methanol).
  - "Acetone" (in the counterfactual scenario, if mentioned, is still acetone).

  Steps for "the solvent in Tank 4":
  1. Expression type: definite description (non-rigid).
  2. Mark as "role occupant only". In the counterfactual scenario, it refers to methanol, not acetone. So we do not link it to acetone.

  Steps for "acetone":
  1. Expression type: natural kind term (rigid).
  2. If it appears in the counterfactual scenario, it refers to the same chemical compound (acetone). So if we have "acetone" in the counterfactual scenario, it is the same as actual acetone.

  But note: in the counterfactual scenario, if we have the description "the solvent in Tank 4", it is methanol, not acetone. However, if we also have the term "acetone" in that scenario, it still refers to acetone. They are different.

  Now, what if we have an empirical identity claim in the actual world: "the solvent in Tank 4 is acetone". This is a contingent fact. In the counterfactual scenario, the solvent in Tank 4 is methanol, so they are not the same.

  **Case 3: Company Merger**
  - Actual scenario: Company A and Company B merge to form a new entity that uses the name of Company A, retains most staff, and keeps one legal registration (say, the tax ID of Company A) but changes ownership.
  - Counterfactual scenario: The merger happens, but we are considering an alternative where the ownership change is different.

  Expression: 
  - "Company A" in the counterfactual scenario (post-merger).

  Steps:
  1. Expression type: organization name.
  2. Check for a unique identifier: the tax ID of Company A is kept. Therefore, we can say that the legal entity of Company A continues to exist (it's the same legal entity). So we link the post-merger company (with the same tax ID) to the original Company A.

  But note: the ownership has changed. However, if the legal identity is the same, then it is the same organization. If the counterfactual scenario described a complete dissolution of Company A and then a new company with the same name, then it would be different.

  However, if we don't have a unique identifier, we must use judgment. In this case, we have the legal registration, so we use that.

  **Blocking a Narratively Obvious Link**

  Consider a case: 
  - Actual scenario: "The president" is Joe Biden.
  - Counterfactual scenario: "The president" is Donald Trump (because he won the election).

  Analysts might want to link "the president" across scenarios because they are both presidents of the US. But the procedure blocks this: "the president" is a role term (non-rigid) and in the counterfactual scenario, it refers to a different person. Therefore, we mark it as "role occupant only" and do not link to Joe Biden.

  Distinctions preserved from theory:
  - Rigid vs. non-rigid designators.
  - Necessary a posteriori for rigid designators (if two rigid designators are identical in the actual world, they are identical in every scenario).
  - Contingency of identity for non-rigid designators.

  Distinctions dropped:
  - We don't require analysts to determine if a description is being used to fix the reference (like a "reference-fixing description") unless it's obvious (like the first man on the moon). We default to non-rigid for descriptions.
  - We don't delve into the metaphysics of transworld identity beyond the scenario descriptions.

  Misfire if "same label" is automatically taken as "same entity":
  - If an analyst assumes that because the same name or label is used, it must be the same entity, they might make errors. For example, in the alternate election, if they see "the mayor" in both scenarios and assume it's the same person, they would be wrong. Similarly, in the chemical case, "the solvent in Tank 4" might be a different substance. Also, in the company merger, if the counterfactual scenario had a different company with the same name (without the same legal ID), then it would be a different entity.

  Procedure in a checklist form (for analysts):

  **Cross-Scenario Identity Checklist**

  For each expression in the counterfactual file:

  1. **Classify the expression**:
     - [ ] Proper Name
     - [ ] Definite Description / Role Term
     - [ ] Alias (if it's a proper name, mark as proper name; if it's a description, mark as description)
     - [ ] Natural Kind Term
     - [ ] Organization
     - [ ] Document

  2. **If Proper Name, Natural Kind Term, or Alias that is a Proper Name**:
     - Check the counterfactual scenario: does the same name or term appear?
       - If no: mark as absent.
       - If yes: 
           - Does the scenario suggest it's a different entity? (e.g., a different person with the same name, a different substance with the same name? This is rare for natural kinds but possible for names.) 
           - If it explicitly states it's different, mark as a different entity.
           - Otherwise, mark as the same entity.

  3. **If Definite Description, Role Term, or Alias that is a Description**:
     - Mark as "role occupant only". Do not link to the actual entity unless the counterfactual scenario explicitly states that it is the same entity (e.g., "the same mayor, John Smith"). Otherwise, assume it refers to whatever satisfies the description in that scenario.

  4. **If Organization**:
     - Check for a unique identifier (e.g., legal registration number, tax ID) in both scenarios:
       - If the same identifier is present and the scenario does not indicate a different entity, mark as the same.
       - If no unique identifier, then consider:
           - Does the scenario describe it as the same organization (same key staff, same assets, same ownership)? If yes, mark as same (with a note about judgment).
           - If not, mark as a different organization (even if the name is the same).

  5. **If Document**:
     - Check for a unique identifier (e.g., ID number) or for the same content and context (e.g., same date, same parties, same terms):
       - If same, mark as same document.
       - Otherwise, mark as different.

  6. **If Natural Kind Term**:
     - Mark as the same natural kind (if the term is used) because it is rigid.

  7. **For Empirical Identity Claims (when two expressions are the same in the actual world)**:
     - If both expressions are rigid (e.g., two proper names), then record that they are necessarily identical. In the counterfactual scenario, if both appear, they refer to the same entity (if they exist).
     - If one is rigid and the other is non-rigid, then record only the actual-world identity. In the counterfactual scenario, they might not be the same.

  **Human Judgment Required**: Steps 2 (for proper names), 4 (for organizations without unique IDs), and 7 (classifying expressions) require judgment. When in doubt, default to the safe option: for non-rigid terms, "role occupant only"; for rigid terms, if the scenario suggests a different individual, mark as different.

  **Stop Point**: After step 7, if the expression is not linked to an actual entity, mark it as "new entity" or "role occupant only". Do not spend more than 15 minutes per case. If a judgment call is too difficult, mark as "uncertain" and move on.

  This procedure should help maintain the database with clear cross-scenario identities.
answer: |-
  Below is a step-by-step procedure for your analysts to determine cross-scenario identity in counterfactual case files, based on simplified principles from the philosophy of rigid designation and necessary a posteriori. The procedure prioritizes practicality over theoretical completeness, includes explicit stop points, and flags where human judgment is essential. It avoids jargon and can be applied in **15 minutes per case**.

  ---

  ### **Cross-Scenario Identity Procedure**
  **Goal**: Decide if an expression (name, description, role, etc.) in a counterfactual scenario refers to the **same entity** as in the actual scenario or only to a **role occupant**.  
  **Core Principle**: Expressions fall into two categories:  
  - **Rigid** (e.g., proper names, natural kinds): Refer to the same entity in all scenarios where it exists.  
  - **Non-Rigid** (e.g., descriptions, roles): Refer to whoever/whatever fits the description in that scenario.  

  #### **Step 1: Classify the Expression (1–2 minutes)**  
  Categorize the expression:  
  - **Proper Name** (e.g., "Jordan Lee", "Acme Corp").  
  - **Alias/Nickname** (e.g., "the whistleblower", "Tank 4").  
  - **Definite Description/Role Term** (e.g., "the mayor", "the solvent in Tank 4").  
  - **Natural Kind Term** (e.g., "acetone", "water").  
  - **Organization** (e.g., "Company X").  
  - **Document** (e.g., "Contract #2020-001").  

  **Stop Point**: If classification is ambiguous (e.g., "the candidate" could be a role or alias), default to "Definite Description/Role Term" and proceed.  

  #### **Step 2: Apply Rigidity Test (3–5 minutes)**  
  Use this table to decide if the expression is rigid or non-rigid:  

  | **Expression Type**      | **Rigid?** | **Test to Apply**                                                                 | **Cross-Scenario Link?**                                     |  
  |--------------------------|------------|-----------------------------------------------------------------------------------|--------------------------------------------------------------|  
  | **Proper Name**          | Yes        | Does the name refer to a **specific entity** (e.g., a person, place, or unique object)? | **Same entity** if it exists in the scenario.                |  
  | **Alias/Nickname**       | Sometimes  | Is the alias **defined by a unique trait** (e.g., "the 44th U.S. President")? If yes → Non-Rigid. Is it **equivalent to a proper name** (e.g., "Jordan Lee" for a person)? If yes → Rigid. | Rigid: **Same entity**. Non-Rigid: **Role occupant only**. |  
  | **Definite Description/Role Term** | No         | Does the expression describe a **function/temporary state** (e.g., "the mayor", "the winner")? | **Role occupant only** (unless evidence overrides).          |  
  | **Natural Kind Term**    | Yes        | Is it a **scientific or common category** (e.g., "acetone", "gold")?              | **Same entity** (e.g., "acetone" is always C₃H₆O).           |  
  | **Organization**         | Depends    | Does it have a **unique legal identifier** (e.g., tax ID)? If yes → Rigid. If defined by **fuzzy traits** (e.g., "the merged company") → Non-Rigid. | Rigid: **Same entity**. Non-Rigid: **Role occupant only**. |  
  | **Document**             | Yes        | Does it have a **unique identifier** (e.g., serial number, exact content hash)?   | **Same entity** if the identifier matches.                   |  

  **Human Judgment Required**:  
  - For aliases, ask: "If the scenario changed, would this alias **point to the same entity**, or could it point to someone/something else?"  
  - For organizations, ask: "Is this entity defined by **legal registration** (rigid) or **roles/staff** (non-rigid)?"  

  #### **Step 3: Handle Empirical Identity Claims (e.g., Aliases) (2–3 minutes)**  
  When two expressions refer to the same entity in the actual scenario (e.g., "Jordan Lee is the whistleblower"):  
  1. **If both are rigid** (e.g., "Jordan Lee" and "J. L."):  
     - Record as **"necessary identity"** (true in all scenarios).  
     - Example: Once you learn "Hesperus = Phosphorus," it holds in all scenarios.  
  2. **If one is rigid and one is non-rigid** (e.g., "Jordan Lee" and "the whistleblower"):  
     - Record as **"contingent identity"** (true only in the actual scenario).  
     - In counterfactuals, treat them separately (e.g., "the whistleblower" may not be Jordan Lee).  
  3. **If both are non-rigid**: Ignore for cross-scenario linking (always role-bound).  

  **Stop Point**: Do **not** spend time on empirical claims unless explicitly stated in the file.  

  #### **Step 4: Final Cross-Scenario Decision (1–2 minutes)**  
  - **Rigid expressions**: Link to the same entity across scenarios.  
  - **Non-rigid expressions**: Mark as **"role occupant only"**.  
  - **Uncertain**: Flag for review (e.g., "May need manual override").  

  **Rule of Thumb**: When in doubt, default to **"role occupant only"**.  

  ---

  ### **Application to Hard Cases**
  #### **Case 1: Alternate Election File**  
  - **Actual**: Candidate A wins. Expressions: "The candidate who won" (Candidate A), "Jordan Lee" (Candidate A’s name).  
  - **Counterfactual**: Candidate B wins. Expression: "The candidate who won" (Candidate B).  
  - **Procedure**:  
    1. "The candidate who won" = Definite Description/Role Term → **Non-Rigid** → "Role occupant only" (refers to Candidate B).  
    2. "Jordan Lee" = Proper Name → **Rigid** → Same entity (Candidate A exists but lost).  
    **Outcome**: "The candidate who won" **not linked** to Candidate A. "Jordan Lee" **linked** to Candidate A.  
    **Why Block Linking?** Narratively, analysts might assume "the candidate who won" refers to the same person, but philosophically, it’s role-bound.  

  #### **Case 2: Chemical-Safety File**  
  - **Actual**: "The solvent in Tank 4" is later identified as acetone.  
  - **Counterfactual**: A different solvent is in Tank 4.  
  - **Procedure**:  
    1. "The solvent in Tank 4" = Definite Description → **Non-Rigid** → "Role occupant only" (refers to whatever solvent is present).  
    2. "Acetone" = Natural Kind Term → **Rigid** → Same entity (the compound C₃H₆O).  
    **Outcome**: "The solvent in Tank 4" **not linked** to acetone. "Acetone" **linked** to C₃H₆O.  
    **Identity Claim**: Learning "the solvent = acetone" is **contingent** (non-rigid + rigid). Not enforced in counterfactuals.  

  #### **Case 3: Company Merger File**  
  - **Actual**: Company A and B merge. New entity keeps Company A’s name, staff, and legal registration but changes ownership.  
  - **Counterfactual**: Same merger, but ownership differs. Expression: "Company A" (post-merger).  
  - **Procedure**:  
    1. "Company A" = Organization → Check for unique identifier. Legal registration is unchanged → **Rigid** → Same entity.  
    **Outcome**: **Linked** to original Company A (despite ownership change).  
    **Why?** Legal registration acts as a rigid designator. If no unique identifier existed (e.g., defined only by staff), it would be non-rigid.  

  ---

  ### **Critical Distinctions: What to Keep vs. Drop**  
  | **Distinction**                     | **Keep/Drop** | **Reason**                                                                 |  
  |-------------------------------------|---------------|----------------------------------------------------------------------------|  
  | Rigid vs. Non-Rigid Designators     | **Keep**      | Core to avoiding over/under-identification.                                |  
  | Necessary A Posteriori (for rigid identities) | **Keep** | Ensures empirical discoveries (e.g., "Hesperus = Phosphorus") hold in all scenarios. |  
  | Possible Worlds Metaphysics         | **Drop**      | Too abstract; focus on scenario-specific evidence.                         |  
  | Causal Histories of Names           | **Drop**      | Impractical for 15-minute workflow; use simpler rigidity tests.           |  
  | Graded Similarity of Entities       | **Drop**      | Binary "same/role occupant" is sufficient.                                |  

  ---

  ### **Risks of Over-Simplification**  
  If analysts treat **"same label = same entity"** automatically:  
  1. **False Necessity**:  
     - E.g., Assuming "the mayor" in all scenarios refers to the same person → Ignores role occupancy.  
  2. **Contingent Claims Treated as Necessary**:  
     - E.g., If "the whistleblower = Jordan Lee" in the actual world, assuming it holds in counterfactuals → Erases alternative possibilities.  
  3. **Misfires in Key Cases**:  
     - **Election Example**: Linking "the candidate who won" to the actual winner → Incorrectly forces the same person into the counterfactual.  
     - **Company Example**: If analysts ignore legal IDs and link based on name/staff alone, they might treat a superficially similar company as the same entity.  

  **Mitigation**: Enforce Step 2’s rigidity tests rigorously. Default to "role occupant only" when rigidity is unclear.  

  ---

  ### **Procedure Summary**  
  1. **Classify** the expression (1–2 min).  
  2. **Test rigidity** using the table (3–5 min).  
  3. **Handle identities** (rigid + rigid = necessary; rigid + non-rigid = contingent) (2–3 min).  
  4. **Decide and mark** cross-scenario status (1–2 min).  
  **Total**: <15 minutes.  

  This workflow balances philosophical rigor with operational efficiency, ensuring your database reflects metaphysical distinctions without requiring analysts to engage with the literature.
