  I'll start structuring the tree. The first question should be fundamental. The distinction between action-guiding and merit-ranking might be a candidate. But they mentioned it might not be necessary. Let me test it with the cases. For example, in the burnt manuscript case, if no one can ever read it, action is irrelevant. So maybe it does work. Make it Question 1: Is the judgment about what to do or about the book's inherent quality?

