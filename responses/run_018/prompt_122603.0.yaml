  The user provided several key cases: citation with trusted taste match, burnt manuscript, prediction by a friend, trained ear hearing inaccessibles, aggregate ratings vs. personal taste, cheap access (first page), priming, and insensitive person. I need to incorporate these and maybe add one or two more if necessary.

