answer: |-
  Here is the complete specification of desiderata for any adequate theory of biological function, structured around your requirements:

  ### Core Desiderata for Theories of Biological Function

  1.  **Accommodation of Ahistorical Systems (Synthetic/Engineered Organisms)**
      *   **Demand:** The theory must assign non-arbitrary functions to traits in organisms lacking any significant evolutionary history (e.g., novel synthetic circuits, CRISPR-engineered traits, xenobiological systems).
      *   **Motivation:** Rise of synthetic biology creates entities where function ascription is scientifically meaningful yet etiological history is minimal or intentionally designed.
      *   **Non-Negotiable:** Effectively yes, given the empirical reality and scientific practice of synthetic biology.
      *   **Tension:** Directly challenges the core etiological claim that function *requires* a specific kind of natural selection history.

  2.  **Discrimination of Function vs. Mere Contribution (Horizonal Gene Transfer/HGT)**
      *   **Demand:** The theory must distinguish a trait's *function* from its mere causal contribution or capacity, especially when selection history (acting on the module in its *donor* lineage) diverges significantly from the causal role it plays in its *current* host system (e.g., antibiotic resistance genes acquired via HGT now providing a different fitness advantage).
      *   **Motivation:** Pervasiveness of HGT and modular genetic elements creates cases where "why it was selected for" (historically) and "what it currently does that's beneficial" (systemically) are distinct.
      *   **Non-Negotiable:** Yes. Failure collapses functional ascription into mere causal description or historical accident.
      *   **Tension:** Forces choice: prioritize historical origin (risking irrelevance to current system) or current systemic role (risking loss of explanatory depth/normativity).

  3.  **Robust Non-Intentional Normativity (Clinical/Synthetic Contexts)**
      *   **Demand:** The theory must ground the *normative* dimension of "proper function" (what a trait *should* do, enabling talk of malfunction) in non-intentional, biological facts, applicable in contexts like disease diagnosis (heart malfunction) or synthetic part failure.
      *   **Motivation:** Scientific practice relies on normative functional assessment without invoking a designer's intentions; clinical diagnostics require objective malfunction judgments.
      *   **Non-Negotiable:** For theories claiming to capture "proper function" normativity. Causal-role theories often explicitly reject this demand.
      *   **Tension:** Major hurdle for non-etiological theories. Accommodating synthetic systems (Desideratum 1) can undermine naturalistic bases for normativity.

  4.  **Compatibility with Evo-Devo Dynamics (Redundancy, Exaptation, Dissociation)**
      *   **Demand:** The theory must coherently describe function in cases of: (a) **Functional Redundancy** (multiple traits capable of same role), (b) **Exaptation** (trait co-opted for new function, distinct from original selective advantage), (c) **Dissociation** (trait persists despite loss of original selective pressure, potentially gaining new utility).
      *   **Motivation:** Empirical findings (e.g., gene duplication/divergence, structural exaptations like feathers, vestigial structures) show functions are dynamic, plural, and not always tightly coupled to original selection.
      *   **Non-Negotiable:** Yes, must reflect biological reality.
      *   **Tension:** Challenges rigid historical accounts; requires flexibility in assigning/updating function assignments.

  5.  **Explanatory Malfunction**
      *   **Demand:** The theory must provide an account of malfunction that: (a) Is distinct from mere statistical abnormality (e.g., a rare but functional variant vs. a diseased state), (b) Is distinct from mere causal failure in a specific context (e.g., heart stopping due to electrocution vs. due to cardiomyopathy), (c) Explains *why* the malfunctioning state is *defective* relative to the functional norm.
      *   **Motivation:** Essential for biomedicine and understanding pathology; distinguishes brokenness from mere difference or external disruption.
      *   **Non-Negotiable:** For theories aiming to capture normative "proper function". Often cited as a key advantage of etiological accounts.
      *   **Tension:** Deeply linked to Desideratum 3 (Normativity). Difficult for non-historical, non-normative theories.

  ### Key Tensions & The Most Exclusionary Requirement

  *   **Primary Tension:** Desideratum 1 (Ahistorical Systems) vs. Desideratum 3/5 (Robust Non-Intentional Normativity & Malfunction). Accommodating synthetic biology often requires relaxing the historical/normative core of etiological theories, potentially sacrificing their distinctive advantage in explaining normativity/malfunction naturally. Conversely, maintaining strict etiological normativity often requires excluding or demoting function in ahistorical systems.
  *   **Secondary Tension:** Desideratum 2 (HGT Discrimination) highlights the conflict inherent in Desiderata 1 vs. 3/5 when applied to specific cases – forcing a choice between historical origin and current systemic contribution as the function-defining factor.
  *   **The Most Exclusionary Requirement:** **Desideratum 3 (Robust Non-Intentional Normativity).** This is the highest barrier. Many theories (especially purely systemic/causal-role accounts) either explicitly reject the need for such normativity or struggle to ground it non-circularly and non-intentionally without history. Desiderata 1 and 4 create significant problems for *how* etiological theories meet Desideratum 3, but Desideratum 3 itself excludes theories that cannot account for normative "proper function" at all.

  ### Illustrative Framework Performance (Brief)

  *   **Standard Etiological Theory:**
      *   *Desid 1:* Fails (absent selection history, no function).
      *   *Desid 2:* Prioritizes historical origin; struggles with dissociation.
      *   *Desid 3:* Core strength (function = selected effect).
      *   *Desid 4:* Handles redundancy/exaptation with care (often via "modern history" or pluralism), dissociation is problematic (vestigials lack function/malfunction?).
      *   *Desid 5:* Core strength (malfunction = failure to perform selected effect).
  *   **Standard Causal-Role Theory:**
      *   *Desid 1:* Excels (function defined by current systemic contribution).
      *   *Desid 2:* Excels (function = current causal role in system).
      *   *Desid 3:* Fails (lacks robust normativity; "function" often reduces to "causal contribution to goal G", where "goal" may be arbitrary).
      *   *Desid 4:* Excels (focuses on current role, history irrelevant).
      *   *Desid 5:* Fails (malfunction collapses into causal failure or statistical abnormality; lacks "should").

  This list prioritizes the *conceptual demands* themselves, derived from the specified biological and philosophical challenges. The tensions, especially between accommodating novel engineering and preserving robust normativity, define the central battleground in contemporary debates.
