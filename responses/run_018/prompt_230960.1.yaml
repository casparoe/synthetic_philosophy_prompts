answer: |-
  ### Pre-Vote Conflict Detection Procedure  
  Based on Sen's Liberal Paradox, this 30-minute pre-vote screen identifies clashes between individual decisiveness ("your domain, your call") and unanimous preferences ("if everyone agrees, we do it"). The chair runs this checklist *before* voting to catch cyclical rankings and rights-overrides.  

  #### Procedure Table  
  | Step | Question to ask                                                                 | What counts as a pass                                                                                          | What to do on a fail                                                                                                                              | Stop or continue | Judgment call (yes/no) |  
  |------|---------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------------------|------------------|------------------------|  
  | 1    | "For each person: Which alternatives violate **your** personal domain (schedule/workstation/travel)? List them." | All report clearly (e.g., "Alternative X breaks my schedule right"). No ambiguity about whose domain is affected. | Clarify domains: If unclear who controls what, pause to map domains. Re-ask until domains are crystal clear.                                       | Continue         | No                     |  
  | 2    | "For each violation from Step 1: What alternative **respects** your right instead? (e.g., 'Y respects my schedule')" | Every violation has a "repair" alternative (Y > X for the affected person). No deadlocks (e.g., "No alternative respects my right"). | If no repair exists, halt: The proposal is incompatible with rights. Redesign alternatives.                                                         | Stop if deadlock | No                     |  
  | 3    | "Check chains: Is there any *sequence* where: <br> - **One person’s right** forces A > B, AND <br> - **Another’s right** forces B > C?" | No such chains found. (e.g., No "Schedule forces W > X, Workspace forces X > Y").                              | Found ≥1 chain? Proceed to Step 3B immediately.                                                                                                    | Continue         | **Yes** (Chain identification) |  
  | **3B** | (If chain found) "For the chain (e.g., A > B > C): Does **every single person** prefer C over A?" | Unanimity fails (≥1 person prefers A over C or is neutral).                                                   | Unanimity passes (all prefer C > A). **Conflict detected**: Rights-force A > C, but unanimity demands C > A → Cycle.                               | Stop             | No                     |  

  ---

