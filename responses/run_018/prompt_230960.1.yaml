  ### Key Notes  
  - **Weekend On-Call Case**: No chain → No conflict. Vote proceeds.  
  - **Book Case**: Chain + Unanimity → Conflict. Forces co-op to choose:  
    - Override rights (allow B despite rights-forcing A > C > B), OR  
    - Drop unanimity (reject B even though all prefer it).  
  - **What the Checklist Can’t Settle**: When a conflict *is* found, the group must **debate the tradeoff** ("Which principle matters more *here*?"). The checklist only flags the collision—not how to resolve it. Defensibility post-vote requires transparently weighing:  
    - *Impact of overriding rights* (e.g., "We overrode Alex’s schedule right because 100% agreed on volunteer shifts").  
    - *Impact of ignoring unanimity* (e.g., "We stuck to rights even though all wanted B—here’s why").
