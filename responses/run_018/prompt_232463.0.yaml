prompt: |-
  I'm drafting a novel where two of my characters have been arguing for a year about tipping, queue-jumping and jaywalking, and I want to get their argument right rather than have them talk past each other. Marla holds what you could call the local-deference view: everyday conventions do create real obligations, so if a place has a custom of tipping or queueing or not crossing against the light, you owe it to the people around you to follow it, and visitors have an especially strong reason to defer to local ways. Idris holds the harm-based view: a convention only matters morally insofar as breaking it would actually harm, deceive, or disrespect someone, and conventions alone are just social pressure—so a visitor who never agreed to a local custom is often not bound by it.

  I want the document they would produce if a mediator locked them in an adversarial collaboration and made them write a joint statement. Give me: a numbered list of claims both can sign, kept non-vacuous; then the exact residual disagreement, worded so each of them would accept the description of their own side; then the cruxes, the sub-questions that would actually move at least one of them if settled. For each crux, include a concrete case or observation both agree bears on it, and what each of them predicts in advance. I especially care about the messy cases: a convention that partly exists because of a bad background (like tipping functioning as wage replacement), a local custom a visitor could'nt reasonably have known about, and a convention that isnt morally neutral (say a queue that quietly excludes certain people). If part of their fight turns out to be just verbal, say which part and why.
reasoning: |-
  Okay, let me start by understanding the user's request. They're writing a novel with characters Marla and Idris who have a year-long argument about social conventions like tipping, queueing, and jaywalking. The user wants a realistic adversarial collaboration document that captures both viewpoints accurately without them talking past each other. The key is to make their philosophical debate feel authentic and nuanced.

  First, I need to break down the core philosophies. Marla believes in local-deference: conventions create obligations, especially for visitors. Idris is harm-based: only actual harm or disrespect matters, conventions alone aren't binding. The challenge is finding common ground while highlighting genuine disagreements.

  I consider structuring the response into three parts: agreed claims, residual disagreements, and cruxes. The agreed claims should be non-vacuous, meaning substantial enough that both would accept them but not too broad. For example, both might agree that conventions coordinate behavior, but Marla emphasizes obligation while Idris focuses on outcomes.

  Next, the residual disagreements need precise wording that each character would endorse. Marla's view should stress the duty to participate in social practices, while Idris' centers on consent and harm. Avoiding strawman portrayals is crucial here.

  For the cruxes, the user wants concrete cases that test their principles. The three scenarios mentioned—tipping as wage replacement, unknown local customs, and exclusionary queues—are perfect because they introduce complexity. Each crux must include predictions: what Marla and Idris would expect in those situations. This shows how their theories play out in practice.

  I should also watch for verbal disagreements. Maybe "obligation" vs. "expectation" is semantic—Marla sees conventions as creating moral duties, while Idris sees them as practical pressures. Pointing this out clarifies their conflict.

  Deep needs: The user likely wants philosophical depth for authentic dialogue, ensuring characters' arguments hold up under scrutiny. They might also need the unresolved tensions to drive the narrative, so the cruxes should leave room for ongoing debate. Highlighting how each character's background influences their stance (e.g., Marla valuing community, Idris individualism) adds subtext without explicit explanation.

  Finally, ensuring the document feels collaborative. Even in disagreement, the joint statement should reflect mutual understanding. The cruxes are where their ideologies truly clash, providing hooks for future scenes where evidence might sway one—but not resolve the core divide.
answer: |-
  Here is the adversarial collaboration document Marla and Idris would produce, reflecting their core agreements, precise residual disagreement, and the key cruxes where evidence could shift their views:

  **Joint Statement: On Conventions, Obligation, and Harm**

  1.  **Conventions Serve a Coordination Function:** Shared social rules (like tipping percentages, queueing order, or crosswalk signals) exist primarily to coordinate behavior, reduce friction, and create predictable expectations in public or service interactions. (Both agree this is their primary *purpose*).
  2.  **Breaking Conventions Often Causes Harm or Discomfort:** Disregarding established conventions frequently causes tangible negative consequences, including confusion, frustration, inefficiency, economic loss (e.g., server underpaid), perceived unfairness, or even physical risk (e.g., unpredictable jaywalking). (Both agree these harms are common and significant).
  3.  **Knowledge Matters:** The moral weight of following or breaking a convention increases significantly with the agent's *awareness* of it. Someone genuinely unaware of a local custom bears less responsibility for unintentional breach than someone who knows and ignores it. (Both agree ignorance mitigates blame).
  4.  **Intent Matters:** Deliberately flouting a convention to exploit others, express contempt, or gain unfair advantage is worse than accidental breach or breach based on a sincere moral objection. (Both agree malice/intent to harm is uniquely bad).
  5.  **Respect for Persons is Foundational:** Underlying all evaluations of convention-breaking is a fundamental requirement to treat other people with consideration and avoid causing them unjustified harm or disrespect. (Both agree this is the ultimate moral bedrock).
  6.  **Context is Crucial:** The moral status of following or breaking a specific convention cannot be judged abstractly; it depends heavily on the specific circumstances, the actors involved, the history of the convention, and the potential consequences in that moment. (Both reject absolute, context-free rules).
  7.  **"Social Pressure" Exists but is Morally Neutral:** Social pressure to conform is a real phenomenon. Whether yielding to or resisting this pressure is *morally* right or wrong depends on factors beyond the mere existence of the pressure. (Both agree pressure itself isn't decisive).
  8.  **Visitors Have Heightened Reason for Caution:** Visitors, lacking deep familiarity with local context and norms, have a strong pragmatic reason to observe visible conventions to avoid causing accidental offense or harm, even if they are not always *morally bound* to do so in Idris's sense. (Marla sees this as partly moral; Idris sees it as primarily prudential).
  9.  **Not All Conventions are Equal:** Conventions vary in their moral significance based on the gravity of the potential harm from breach, the clarity of the rule, and their connection to fundamental fairness or safety. (e.g., Both agree queue-jumping causing direct delay is different from a minor dress code breach).

  **Residual Disagreement: The Source and Nature of Obligation**

  *   **Marla's Position (Local-Deference):** Conventions, once established as the baseline expectation within a community for coordinating behavior fairly and minimizing harm, generate a *pro tanto* moral obligation for participants to comply. This obligation arises from the tacit reliance others place on the convention and the duty to uphold the shared social framework that facilitates smooth interaction. Visitors enter this existing framework and incur a heightened obligation to defer to local conventions precisely because they are guests within a system they didn't create but benefit from (e.g., using services, walking streets). Breaking a known convention, even without immediate, identifiable harm to a specific individual in that instance, constitutes a failure of this duty to one's fellow participants in the social practice and weakens the fabric of mutual reliance.
  *   **Idris's Position (Harm-Based):** Moral obligations regarding conventions stem *only* from the potential to cause direct harm (physical, psychological, economic), deception (misleading others about one's intentions or commitments), or express disrespect (treating others as unworthy of consideration). Conventions *themselves* are patterns of behavior, not moral injunctions. While they create expectations, those expectations alone do not create moral obligations absent the factors above. A visitor who has not explicitly or implicitly agreed to a local custom (beyond the basic agreement inherent in entering a society) is not morally bound by it *unless* breaking it would cause harm, deception, or disrespect. Social pressure and expectations are real forces, but yielding to them is a matter of prudence or empathy, not moral duty arising from the convention *qua* convention.

  **Cruxes: Where Evidence Could Shift Views**

  1.  **Crux: Does sustaining a harmful system create obligation?**
      *   **Case:** Tipping in Country X, where servers are paid well above minimum wage *without* tips, vs. Country Y, where tips are a legally permitted *replacement* for base wages, making servers reliant on them. Both locations have a strong 20% tipping convention.
      *   **Observation:** What happens when a knowledgeable visitor *consistently* refuses to tip in both countries, citing Idris's harm principle? Does this action perpetuate harm/dependency in Country Y? Does it cause equivalent harm or disrespect in Country X?
      *   **Marla's Prediction:** In Country Y, refusal directly harms the server financially and disrespects their vulnerable position within an admittedly flawed system; in Country X, refusal primarily violates the convention and expresses disrespect for the service role, causing social friction but less direct financial harm. Both breaches are morally wrong due to the obligation to the convention-in-context. Sustaining the harmful system in Y *is* a harm caused by the breach.
      *   **Idris's Prediction:** Refusing in Country Y directly causes significant financial harm and disrespects the server's economic reality – it's clearly wrong. Refusing in Country X might cause mild social friction or offense, but without significant financial harm or core disrespect (the server isn't dependent), it's at most rude, not morally wrong. The obligation isn't to *sustain the system* but to avoid *harming individuals within it*.
      *   **Why it Matters:** If Idris concedes that perpetuating systemic harm through convention-breaking *is* direct harm, it moves him closer to Marla in cases tied to injustice. If Marla concedes that breaking a convention in a *non*-harm-dependent system causes significantly less tangible harm, it moves her towards Idris.

  2.  **Crux: Does unknowable convention create obligation?**
      *   **Case:** Visitor to a remote village where a deeply ingrained, non-intuitive custom exists (e.g., always letting elders board the only bus first, signaled subtly; or a specific, non-verbal way to refuse a second helping of food to avoid offense). The visitor breaches the custom unknowingly.
      *   **Observation:** Does the breach cause genuine harm or disrespect *in the eyes of the community*, even if the visitor couldn't reasonably have known? Is the community's reaction one of moral condemnation ("They were wrong/bad") or merely pragmatic correction ("They didn't know, we must teach")?
      *   **Marla's Prediction:** The breach causes real social harm (disruption, offense) and constitutes a failure within the social framework the visitor entered. While blame is mitigated by ignorance (Joint Claim 3), an *obligation* existed that was breached; the visitor still has a *pro tanto* duty to learn and conform once aware. The community may feel disrespected.
      *   **Idris's Prediction:** Without knowledge, there can be no intent to deceive, disrespect, or cause harm. The negative consequences (confusion, offense) stem from misunderstanding, not moral failure by the visitor. The visitor had no obligation *prior* to becoming aware. They acquire a *prudential* or *empathetic* reason to learn afterward to avoid future issues, but no retrospective moral blame for the initial breach. The community might feel upset, but this is based on their expectations, not the visitor's moral failing.
      *   **Why it Matters:** If Marla concedes that obligation *requires* knowability/reasonableness, it refines her view. If Idris concedes that genuine, significant social harm/disrespect occurs *despite* ignorance, creating a retrospective duty to make amends, it moves him towards acknowledging convention-based obligations.

  3.  **Crux: Does upholding an unjust convention create complicity?**
      *   **Case:** A well-established queue system that locals know subtly excludes a minority group (e.g., by always forming near a place that group feels unsafe, or through unspoken pressure). A visitor observes this exclusion but isn't targeted. The convention is "orderly."
      *   **Observation:** Does the visitor joining the queue as normal uphold the unjust system? Does refusing to join the queue (and perhaps queuing elsewhere in solidarity, causing minor disruption) cause immediate harm/respect issues? Or is it a legitimate protest?
      *   **Marla's Prediction:** Joining the queue upholds the *orderly* aspect of the convention but fails the deeper obligation to fairness inherent in *any* just social coordination. The obligation is to a *just* convention; this one is flawed. The visitor has a *pro tanto* obligation to the *form* of queueing (order) but a stronger countervailing obligation *not* to participate in injustice. Breach might be justified. Simply following the queue is complicit.
      *   **Idris's Prediction:** Merely joining the queue as a visitor doesn't *actively* harm the excluded group or disrespect them *directly* in that moment. The harm stems from the systemic injustice, not the visitor's single act of joining the queue. Refusing to join might cause minor disruption (a small harm) but potentially expresses respect for the excluded group (a good). The visitor has no obligation to the *specific* queue convention *because* of its unjust background; they are free to choose the action (join, don't join, join differently) that minimizes overall harm and expresses respect. Following the queue isn't necessarily complicit; it's neutral.
      *   **Why it Matters:** This tests the limits of Marla's obligation (can it be negated by background injustice?) and Idris's harm focus (is passive participation in an unjust system through convention-following a form of harm/complicity?).

  **Verbal Disagreement:**

  *   **"Obligation" vs. "Strong Reason/Expectation":** Part of the conflict stems from the weight each assigns to the term "obligation." Marla uses it to denote a genuine moral duty arising from social participation. Idris reserves "obligation" for duties arising directly from harm/respect/deception and sees convention-following as driven by "strong pragmatic reasons" or "empathic respect for expectations," falling short of true moral *obligation*. They might agree more on the *actions* required in many cases but disagree on the *source* and *label* of the motivation.

  This document provides a clear framework for their ongoing debate within your novel, highlighting both common ground and the philosophically rich fault lines between their perspectives, especially when tested by messy real-world scenarios. The cruxes offer natural points for narrative development, evidence gathering, or character evolution.
