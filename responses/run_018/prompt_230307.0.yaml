prompt: |-
  ok so I've been arguing with my friend about this thing called Good's theorem from decision theory. my understanding of it is: if you're an expected-utility maximizer with a fixed set of options and fixed utilities, and someone offers you genuinely cost-free information (no time, money, or other downside from the mere act of looking), then the expected value of that information is never negative — looking cant make you worse off in expectation. my friend thinks this is basically the last word, and it means you should always look at free information before a decision, even when your scared to know the thing. im less sure. I'd put myself at about 0.45 on this proposition: for an ordinary person making an everyday decision, Good's theorem settles the practical question — you should always take genuinely cost-free information before deciding, and refusing to look is always a mistake. my friend is at like 0.9.

  give me your own credence in that proposition, but more importantly decompose it. the sub-questions I keep circling are things like: (1) does the formal theorem even hold in the clean case, and are there hidden assumptions; (2) do real-life "scared to know" cases actually count as genuinely cost-free information, or do they always come with hidden costs like dread, or losing the ability to honestly say you didn't know, and should those costs just be folded into the utility function; (3) how often does taking the information itself change the decision problem — like changing your options or your later preferences — so the theorem doesnt even apply; (4) even where the theorem holds and applies, does "never worse in expected value" imply "you should do it," or just "you're permitted to"; (5) does the fact that almost all real "free" information still costs attention or self-control break the theorem's relevance. give a rough probability for each of those (or swap in better sub-questions if you think I've framed it wrong), say how they combine into your final number, and tell me which one your number is most sensitive to. also say what single fact or argument would move your credence the most.

  hard limit: start with your number in the first sentence, and keep the entire response under 400 words. no citations or reading list please, just reasoning.
reasoning: |-
  Alright, the user is debating Good's theorem with a friend. They need my credence on whether for an ordinary person in everyday decisions, the theorem means you should always take cost-free info. I start at 0.35.

  First, the formal theorem: it assumes fixed options and utilities. In reality, people's preferences shift, and information can alter available choices. That's a hidden assumption. Probability here is low, say 0.1, because the clean case is solid but rare.

  Next, real-life "scared to know" cases. Dread or losing plausible deniability aren't zero-cost; they're utility hits. If folded into utilities, info isn't free anymore. This happens often. P(not cost-free) is high, maybe 0.7. Big factor.

  Third, information changing the problem. Learning something might add options or change your values. E.g., medical test results could lead to new treatments or alter life goals. This violates theorem assumptions. Likelihood around 0.4. Common enough to matter.

  Fourth, "never worse" implying obligation. The theorem says non-negative expected value, not that you must act. You can skip it without irrationality. So P(merely permitted) is high, 0.9. Important nuance.

  Fifth, attention/self-control costs. Real info consumes mental resources, making it non-free. This breaks applicability often. P(costs break relevance) is 0.8. Very frequent.

  Weighting these: Points 2 and 5 (hidden costs and attention) are most decisive. They make true cost-free info rare in practice. Point 4 weakens the "should" claim. Combining: high chances that theorem doesn't apply or costs exist, so credence low at 0.35.

  Most sensitive to point 2: if emotional costs are part of utility, then refusing to look isn't a mistake. Strong evidence here would shift my view most.

  Final credence 0.35—usually not a mistake to skip, contrary to friend's 0.9.
answer: |-
  My credence: **0.35**.  

  **(1) Formal theorem validity & hidden assumptions (P=0.1)**: Yes, it holds cleanly with fixed utilities/options and true cost-free info. But "fixed" is fragile—real preferences/options often shift.  

  **(2) Real "scared to know" as cost-free (P=0.7)**: Rarely truly cost-free. Dread, lost peace/deniability, or emotional toll usually impose utility costs. These *should* be folded into utilities—refusing may be rational.  

  **(3) Info changes decision problem (P=0.4)**: Common. E.g., learning a salary offer might spawn new negotiations (new options) or alter your values. Theorem doesn’t apply.  

  **(4) "Never worse" → obligation? (P=0.9)**: No. It says expected value ≥0, so *permitted*, not obligated. Maximizers can skip it without self-sabotage.  

  **(5) Attention/self-control costs (P=0.8)**: Almost universal. Processing info burns focus or willpower, breaching "cost-free." Breaks relevance often.  

  **Combination**: Low credence because (2) and (5) dominate—true cost-free info is rare, and hidden costs justify refusal. (3) and (4) weaken the "should" claim. My number is most sensitive to **(2)**: if emotional costs are nontrivial utilities, refusing isn’t a mistake.  

  **Biggest mover**: Evidence that ordinary people consistently regret *avoiding* "free" info (e.g., in experiments) would raise my credence.
