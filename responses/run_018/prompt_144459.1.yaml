answer: |-
  ### Plan-Script Fracture Audit: Decision Procedure  
  *Use this checklist in order. Stop at the first classification. Judgment calls (JC) require board discussion.*

  ---

  #### **Step 1: Identify Top-Level Goal (Layer 1)**  
  **Question:** What was the operator’s stated intention before starting the action sequence?  
  **Sufficient Answer:** A clear, specific objective (e.g., "drive Route 7," "deliver to Maple Street").  
  **Stop If:** Goal is vague/unreported → *"Insufficient Data: Goal Unclear."*  
  **Proceed If:** Goal is clear.  

  #### **Step 2: Compare Outcome to Goal**  
  **Question:** Did the final outcome match the stated goal?  
  **Sufficient Answer:**  
  - **Yes** → *"Outcome A: Full Alignment"* (All layers aligned).  
  - **No** → Proceed to Step 3.  

  #### **Step 3: Verify Basic Intentional Control (Layer 3)**  
  **Question:** Were individual maneuvers (e.g., braking, steering) executed skillfully and deliberately?  
  **Sufficient Answer:**  
  - **No** (e.g., erratic movements, loss of coordination) → *"Outcome C: Loss of Basic Control."*  
  - **Yes** (actions appeared normal and competent) → Proceed to Step 4.  
  **JC Flag:** Requires evidence review (e.g., video, logs).  

  #### **Step 4: Identify Habitual Script (Layer 2)**  
  **Question:** What routine or ingrained pattern explains the actual behavior?  
  **Sufficient Answer:** A plausible, recurring habit (e.g., "commuter route," "daily protocol").  
  **Stop If:** No script fits → *"Unclear Script: Insufficient Habitual Basis."*  
  **Proceed If:** Script is identified.  
  **JC Flag:** Script must be distinct from Layer 1 goal and supported by operator history.  

  #### **Step 5: Check Plan-Script Consistency**  
  **Question:** Is the identified script fundamentally incompatible with the top-level goal?  
  **Sufficient Answer:**  
  - **Yes** (script would predict the deviation) → *"Outcome B: Plan-Script Fracture."*  
  - **No** (script aligns with goal) → *"External Interference: Non-Habitual Cause."*  
  **JC Flag:** Incompatibility hinges on context (e.g., time, location, routine triggers).  

  ---

  ### Application to Cases  

  #### **Case (a): Bus Driver to Former Depot**  
  1. **Step 1:** Goal = "Complete current route with scheduled stops." (Clear → Proceed).  
  2. **Step 2:** Outcome = Missed stops, ended at old depot. (No match → Proceed).  
  3. **Step 3:** Micro-actions skillful (e.g., smooth turns). (Yes → Proceed).  
  4. **Step 4:** Script = "Driving to former depot (past routine)." (Identified → Proceed).  
  5. **Step 5:** Script incompatible? **Yes** (old depot ≠ current route) → **Outcome B**.  
  **Classification:** *Plan-Script Fracture (Habit overrode plan).*  

  #### **Case (b): Cyclist Takes Wrong Bridge**  
  1. **Step 1:** Goal = "Take Oak Bridge for delivery." (Clear → Proceed).  
  2. **Step 2:** Outcome = Initially took Pine Bridge. (No match → Proceed).  
  3. **Step 3:** Micro-actions skillful (e.g., signaled lane change). (Yes → Proceed).  
  4. **Step 4:** Script = "Commutting to personal location (habitual route)." (Identified → Proceed).  
  5. **Step 5:** Script incompatible? **Yes** (personal route ≠ delivery goal) → **Outcome B**.  
  **Classification:** *Plan-Script Fracture (Habit overrode plan).*  
  *Note:* Correction after error doesn’t change the initial fracture.  

  #### **Case (c): Driver Runs Red-Light Pattern**  
  1. **Step 1:** Goal = "Stop at red light (safety protocol)." (Clear → Proceed).  
  2. **Step 2:** Outcome = Ran red light. (No match → Proceed).  
  3. **Step 3:** Micro-actions skillful (e.g., controlled acceleration). (Yes → Proceed).  
  4. **Step 4:** Script = "Proceeding through light (habit: it’s usually green)." (Identified → Proceed).  
  5. **Step 5:** Script incompatible? **Yes** (running light ≠ safety goal) → **Outcome B**.  
  **Classification:** *Plan-Script Fracture (Habit overrode plan).*  
  **Board Rationale for Denying Excuse:**  
  - Outcome B confirms actions were intentional at the micro-level (Layer 3).  
  - Operator is responsible for overriding habits that conflict with safety goals. "Not thinking" doesn’t absolve failure to maintain situational awareness.  

  ---

  ### What This Procedure Cannot Settle  
  1. **Consciousness vs. Neglect:** It cannot distinguish if a habit was truly unconscious ("autopilot") or a result of avoidable inattention. Outcome B covers both.  
  2. **Moral Blame:** Classification (e.g., Outcome B) doesn’t dictate disciplinary action. Blame requires separate policy-based judgments (e.g., prior training, severity).  
  3. **Ambiguous Scripts:** Fails if habits are not well-established (e.g., new routes) or overlap with goals (Step 4 JC).  

  ### Where Mechanical Application Misfires  
  - **Example:** An operator deviates due to a *novel distraction* (e.g., medical emergency) with no habitual basis.  
  - **Failure Point:** Step 4 ("Unclear Script") mislabels it as non-habitual, even though the real cause is external.  
  - **Mitigation:** Use Step 5’s "External Interference" as a catch-all, but investigate further.  

  ---  
  **Final Note:** This audit describes *how* the deviation occurred, not *why* it was excusable. Consistency comes from applying the same logic to all cases, not from philosophy.
