prompt: |-
  I'm preparing an interview for a philosophy podcast. Next week's guest is an unnamed philosopher who defends a revisionist position in epistemic game theory: she argues that common knowledge of rationality should be replaced by a model of common belief of bounded rationality built with non-partitional neighborhood frames, in which agents jointly attend to each other's reasoning limits without requiring an infinite hierarchy of mutual belief. Draft six to eight interview questions that go beyond having her restate the view. At least two questions should press on how the neighborhood-semantics approach avoids the standard regress objection that usually motivates common-knowledge hierarchies; at least one should ask how she applies this framework to classic strategic interactions—such as coordination or matching-pennies scenarios—without reproducing the standard rationalizability predictions tied to Aumann-style common knowledge; and at least one should anticipate her likely deflection that this is merely formalism rather than philosophy, with a follow-up that forces her to specify what conceptual or empirical work the formalism actually performs. For each primary question, include a brief follow-up keyed to the answer she is most likely to give. Finally, for the sequence as a whole, state explicitly what reply from the guest would cause you to revise the framing of these questions, and identify the specific point at which your line of questioning is most vulnerable to misrepresenting the literature on epistemic logic and strategic reasoning.
reasoning: |-
  Okay, the user wants me to draft interview questions for a philosophy podcast featuring a philosopher who advocates replacing common knowledge of rationality with a model based on common belief of bounded rationality using non-partitional neighborhood frames. Let me break down their requirements.

  First, I need to create six to eight questions that go beyond simply restating her view. The questions must include at least two addressing how her approach avoids the regress objection, one on applying it to classic games without reproducing standard predictions, and one challenging the formalism with a follow-up about its real-world application. Each primary question should have a tailored follow-up. Additionally, I need to identify what response would make me revise the questions and where the line of questioning is most vulnerable to misrepresentation.

  The user is likely a podcast host or producer preparing for an in-depth interview. Their explicit needs are clear, but they might also want to ensure the questions provoke thoughtful discussion and highlight the novelty of the guest's position. They probably want to avoid superficial treatment and aim for a conversation that clarifies the philosophical and practical implications of the theory. The guest's work challenges established epistemic game theory, so the questions need to push her to defend her framework's unique contributions.

  Starting with the regress objection avoidance: I recall that standard common knowledge requires an infinite hierarchy of beliefs, which her model replaces with neighborhood semantics. The first question should ask how non-partitional frames eliminate the need for that hierarchy. The follow-up could press on whether this truly solves regress or just hides it. Another question could challenge how agents mutually model reasoning limits without circularity, with a follow-up on handling disagreement about those limits.

  For the application to classic games, I need a question on coordination or matching pennies. The goal is to show how her model predicts different outcomes than rationalizability. The follow-up should contrast her predictions with standard models in cases where common knowledge fails, like when players doubt each other's rationality.

  Addressing the formalism concern: I should question if this is just mathematical reformulation. The follow-up must force her to specify empirical or conceptual work—maybe how it explains real-world deviations from Nash equilibria or informs experimental design.

  The sequence vulnerability lies in misrepresenting the literature. Epistemic logic has many approaches to bounded rationality, like awareness or computational models. If she positions her work as complementary rather than superior, that could require reframing questions to avoid false dichotomies. The application question is most at risk if it oversimplifies the relationship between neighborhood models and existing bounded rationality concepts.

  I should ensure questions are open-ended but targeted. For example, asking about conceptual work after the formalism question digs into her model's philosophical impact. The follow-ups anticipate deflections and push for deeper engagement. The sequence flows from theory to application to implications, ending with a forward-looking question about challenges to adoption.

  Finally, considering a scenario where she clarifies her stance relative to other bounded rationality models: if she says her framework integrates rather than replaces them, I'd need to adjust questions to explore synthesis instead of competition. The initial framing assumes a revolutionary approach, but her answer might reveal it's more integrative.
answer: |-
  Here are eight interview questions designed to probe the philosopher's revisionist position deeply, adhering to your specifications:

  1.  **Primary (Regress Avoidance 1):** Your core argument replaces the *structure* of common knowledge (infinite nested beliefs) with common *belief about reasoning bounds* using neighborhood semantics. Could you unpack *exactly how* the non-partitional nature of neighborhood models structurally prevents the regress problem inherent in defining common knowledge? What specific feature blocks the infinite ascent?
      *   *Likely Follow-Up (if she emphasizes "joint attention" or "coarse awareness"):* But doesn't defining "common belief *of* bounded rationality" itself seem to require mutual beliefs about *what* the bounds are and *that* others believe in them? How does the neighborhood framework avoid simply re-introducing a *finite but potentially high-level* hierarchy of beliefs *about the bounds themselves*?

  2.  **Primary (Regress Avoidance 2):** A key motivation is avoiding the regress. Yet, standard epistemic logic often views common knowledge as an *idealization* approximated by finite, high-level mutual belief. How does your model of "common belief *of* bounded rationality" *genuinely circumvent* the need for *any* significant hierarchy of mutual beliefs about rationality, rather than just capping it at a lower level? Is it fundamentally a different *kind* of epistemic state?
      *   *Likely Follow-Up (if she argues it's a different kind of state):* If it's a different kind of state – say, a shared "attunement" or "frame" – how is this rigorously captured *within* the formalism itself? Does the neighborhood semantics *model* this shared frame directly, or does it still rely on agents having beliefs *about* the shared frame, risking a new mini-regress?

  3.  **Primary (Classic Game Application):** Walk us through a classic coordination game like "Battle of the Sexes" under your framework. Agents have common belief of bounded rationality (CBBR), not common knowledge of rationality (CKR). How does their reasoning proceed? Crucially, why might they potentially coordinate on a *different* outcome than the pure Nash equilibria predicted under CKR + standard rationalizability, or fail to coordinate where CKR suggests they should?
      *   *Likely Follow-Up (if she suggests they might coordinate on a non-Nash point or miscoordinate):* In that scenario, what specific aspect of their mutually believed bounded rationality (e.g., limited depth of reasoning, shared focal points based on salience heuristics) within the neighborhood structure explains this deviation? How does the neighborhood model formally represent this constraint leading to the non-standard prediction?

  4.  **Primary (Contrast in Zero-Sum):** Now consider a purely adversarial game like Matching Pennies. Standard CKR leads to the unique mixed-strategy Nash equilibrium as the rationalizable outcome. How does reasoning under CBBR, modeled with neighborhood semantics, differ? Does it still predict convergence towards the mixed strategy, or could it predict systematic deviations (e.g., persistent biases, exploitable patterns) and if so, based on what mutual beliefs about reasoning limits?
      *   *Likely Follow-Up (if she predicts deviations):* Couldn't a defender of bounded rationality models *within* the common knowledge framework (e.g., Level-k) also predict similar deviations? What does the neighborhood/CBBR approach add *conceptually* to explaining these deviations beyond just being another way to model limited iteration?

  5.  **Primary (Formalism vs. Philosophy - Challenge):** Critics might argue that neighborhood semantics is just an alternative mathematical formalism, swapping one set-theoretic structure (partitions) for another (neighborhood functions), without offering fundamentally new *philosophical* insight into rationality or mutual understanding. How do you respond?
      *   *Likely Follow-Up (Pushing for Substance):* Granting the formalism is different, *what specific philosophical problem concerning agency, reasoning, or social cognition* does this specific formalism solve that partition models fundamentally *cannot*? Does it offer a better ontology of bounded minds in interaction?

  6.  **Primary (Conceptual/Empirical Work):** Following up on the formalism question: You've argued it *does* more. Could you specify the precise *conceptual* work achieved? For instance, does it provide a clearer metaphysics of "joint attention to limits"? And crucially, what *empirical* work could it perform? Does it generate novel, testable predictions about human strategic behavior distinct from other bounded rationality models, particularly regarding how people *mutually* adapt to perceived cognitive constraints?
      *   *Likely Follow-Up (if she mentions experimental predictions):* How would you design an experiment to distinguish predictions based on CBBR with neighborhood semantics from predictions based on, say, a Level-k model *assuming* common knowledge of the level-k structure itself? What unique signature does your model leave in the data?

  7.  **Primary (Handling Higher-Order Uncertainty):** A strength of partition models is their clear handling of higher-order uncertainty (e.g., "I know P, but I don't know if you know I know P"). How does the neighborhood semantics approach, especially its non-partitional nature, model situations where agents are uncertain *about each other's reasoning bounds or depth*, which seems inherent to "common belief *of* bounded rationality"? Can it represent an agent doubting whether others have correctly modeled *their* (the first agent's) own limits?
      *   *Likely Follow-Up (if she describes a mechanism):* Doesn't introducing this kind of uncertainty about bounds risk collapsing back towards needing *some* hierarchy of beliefs about the bounds and the beliefs about them? How does the neighborhood structure definitively prevent this?

  8.  **Primary (Scope & Justification):** You propose replacing CKR with CBBR as a foundational assumption. But isn't CKR sometimes a useful normative ideal or applicable in highly structured, transparent interactions? Is your claim that CBBR is *always* more accurate descriptively, or that it's *conceptually superior* even normatively for capturing realistic agency? If the latter, how does bounded rationality become the *normative* benchmark?
      *   *Likely Follow-Up (if she leans descriptive):* If it's primarily descriptive, how does this framework integrate with the normative aims often associated with game theory (e.g., prescribing rational play)? If it rejects CKR as descriptively *and* normatively flawed for most contexts, what replaces it as the standard for "good" strategic reasoning?

  **Sequence Vulnerability & Revision Trigger:**

  *   **Point of Greatest Vulnerability:** Question 3 & 4 (Application to Classic Games). The vulnerability lies in potentially oversimplifying the relationship between neighborhood models, standard rationalizability, and *other* bounded rationality approaches (like Level-k, Cognitive Hierarchy, Quantal Response). The literature shows significant overlap in *predictions* between different bounded rationality models and deviations from CKR-based predictions. The framing risks implying neighborhood models *uniquely* produce non-rationalizable outcomes, whereas the key claim is about the *structure of the mutual belief* enabling bounded reasoning, which *could* be approximated by other formalisms assuming sufficient (but finite) mutual belief about bounds. A sharp guest might point out that standard bounded rationality models *within* a Kripke semantics can also deviate from rationalizability without infinite hierarchies, challenging the necessity of the neighborhood shift *for predictive purposes*.
  *   **Revision Trigger:** If the guest strongly emphasizes that her neighborhood framework is **not primarily a competing *predictive* model to existing bounded rationality approaches** but rather a **fundamentally different *conceptual foundation* for understanding how mutual belief about bounds operates logically and metaphorically**, or if she positions it as **compatible with/underpinning specific behavioral models (like Level-k) but providing a more realistic epistemic structure,** this would require revising the framing. Questions 3, 4, and possibly 6 would need adjustment to focus less on unique *predictions* and more on the unique *conceptual or explanatory role* of the neighborhood structure itself in capturing the nature of mutual belief about cognitive limitations, perhaps contrasting it with the implicit assumptions of mutual belief in other bounded rationality frameworks. The "revisionist" framing might shift from "replacing CKR predictions" to "providing a superior epistemic foundation for bounded rationality models."
