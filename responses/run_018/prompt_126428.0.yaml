     - **Taxonomy function**: Diagnostic labels act as *hyperpriors* that bias the clinic’s model to interpret low-level signals (e.g., digital phenotyping of sleep disruption) as high-precision evidence of pathology.  

  2. **Distinction: disease vs. disvalued behavior**:  
     - **PP translation**: Genuine neurological disease (e.g., Alzheimer’s) involves *irreducible structural prediction errors* (e.g., neurodegeneration corrupting sensory processing). Socially disvalued behavior (e.g., "personality disorder") reflects *adaptive contextual priors* (e.g., trauma-shaped beliefs) that conflict with societal norms. The algorithm conflates these by treating both as high-precision deviations from a single normative model.  

  3. **Labeling as social control**:  
