  The hidden fracture line is epistemology vs. syntax. Penrose treats the mind's ability to "see" Gödel's unprovable sentence as transcendent, while Dennett would call it just fancier computation. Their real disagreement is about whether understanding requires non-algorithmic ingredients - a metaphysical stance disguised as logical debate. 

