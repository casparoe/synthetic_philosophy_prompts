answer: |-
  Here is a comprehensive desiderata list for a theory of rational deference to objective chance, focusing on criteria, distinctions, cases, constraints, and potential conflicts:

  ### I. Core Deference & Epistemic Integration
  1.  **Principal Principle Foundation:** Must entail that if an agent knows the objective chance `Ch_t(A) = x` at time `t` and possesses no "inadmissible" information, their credence `Cr(A | E)` (given admissible evidence `E`) should be `x`.
  2.  **Admissible Information Defined:** Must provide a non-circular, principled characterization of "inadmissible information" (information about outcomes beyond what's screened off by `Ch_t`).

  ### II. Handling Evidence About the Chance Setup Itself
  3.  **Learning the Chance Law Alone:** Must prescribe rational credences *before* observing any outcomes, given only knowledge of the chance *law* (e.g., "This is a fair coin" or "This quantum system has property P"). (Case: Pre-outcome knowledge)
  4.  **Misdescribed Setup:** Must allow rational belief revision when learning that the initial description of the chance setup was *incorrect* or *incomplete* (e.g., learning the coin was bent, the particle detector was miscalibrated, the reference class was wrong). (Case: Reference Class Error / Misdescription)
  5.  **Reference Class Refinement:** Must handle discovery that the agent was using an *incorrect or suboptimal reference class* for determining chances, and prescribe how to update beliefs accordingly. (Case: Reference Class Error)
  6.  **Learning Higher-Order Chances:** Must prescribe rational credences upon learning *uncertainties about the chances themselves* (e.g., "There's a 50% chance the chance of heads is 0.4 and a 50% chance it's 0.6"). Must not collapse `Ch(A)` and `Ch(Ch(A)=y)`.
  7.  **Vague/Indeterminate Chances:** Must provide guidance (even if imprecise) for cases where chances are not sharp single values but ranges or vague (e.g., complex systems, some interpretations of macro-probabilities).
  8.  **Self-Locating Uncertainty in Chance Setups:** Must prescribe rational credences for agents who are *part of the system* generating the chances (e.g., cosmological models, evolutionary biology, large-scale social systems). (Case: Inside the System)

  ### III. Preserving Crucial Distinctions
  9.  **First-Order vs. Second-Order Chance:** Must clearly distinguish between uncertainty *about the outcome* (`Ch(A)`) and uncertainty *about the chance itself* (`Ch(Ch(A)=x)` or `Cr(Ch(A)=x)`). Must not conflate them.
  10. **Knowing the Law vs. Knowing its Domain:** Must distinguish between knowing the *general* chance law (e.g., "quantum mechanics") and knowing *which specific system/initial conditions* fall under its domain for a particular prediction (e.g., "Is *this* electron prepared in state S?"). Rational credence depends crucially on the latter.
  11. **Objective Chance vs. Epistemic Probability:** Must maintain a clear conceptual distinction between objective physical probabilities and subjective degrees of belief, even while showing how they constrain each other.
  12. **Chance as Guide vs. Chance as Ontology:** Must respect that chances are primarily *guides to expectation* based on physical symmetries/dynamics, not necessarily primitive ontological facts in all frameworks.

  ### IV. Physical & Decision Theoretic Constraints
  13. **Compatibility with Determinism:** Must be coherent even in worlds that are fundamentally deterministic (where `Ch_t(A)` is always 0 or 1, but agents may not know which). Must not *require* fundamental indeterminism.
  14. **Consistency with Known Physics:** Must not violate well-established physical principles (e.g., relativity of simultaneity, no-signaling in QM). Chances defined at time `t` must respect relativistic constraints.
  15. **Non-Classical Probability:** Must be adaptable to probability structures arising from quantum mechanics (non-Boolean algebras, non-Kolmogorovian probabilities in some interpretations).
  16. **Dutch Book & Pragmatic Justification:** Must be justifiable via Dutch Book arguments or other decision-theoretic foundations showing that violating the principle would lead to guaranteed loss or irrationality *ex ante*.
  17. **Temporal Coherence:** Must ensure credences are dynamically coherent over time as new evidence (including evidence about chances) is acquired.

  ### V. Avoiding Pathologies
  18. **No Bootstrapping:** Must avoid "chance bootstrapping" – situations where an agent's own beliefs or evidence could directly *cause* or *logically necessitate* a specific chance value in a way that undermines objectivity or makes deference trivial/circular. (Conflict Zone)
  19. **No Self-Undermining:** Must avoid assigning positive chance to propositions that *falsify the chance theory itself* ("This coin is fair, but the chance of heads isn't 0.5"). Must be consistent. (Conflict Zone)
  20. **Belief Revision Under Setup Misdescription:** Must **allow robust belief revision** when discovering the chance setup was misdescribed (Desideratum 4), **while simultaneously avoiding** bootstrapping (Desideratum 18). (***Major Conflict Zone***)

  ### Key Conflicts & Problematic Requirements

  *   **The Core Conflict (18 vs. 4 & 20):** The requirement to **avoid bootstrapping (18)** while **allowing belief revision upon discovering misdescribed setups (4, 20)** is the most significant tension. Many popular accounts (especially early formulations of Lewis's Principal Principle) stumbled precisely here. Learning "the chance wasn't what I thought because my setup description was wrong" *feels* like it should rationally force credence change, but formulating this rigorously without letting the agent's *initial belief* directly dictate the *new* chance value (bootstrapping) is extremely difficult. This tension led to the development of the "New Principle" or "Grounded Principle".
  *   **Self-Undermining (19) & Determinism (13):** In deterministic worlds, the only consistent chances are 0 or 1. A theory must avoid assigning non-trivial chances in such worlds in a way that contradicts determinism itself (self-undermining). This often requires tying chance closely to an agent's epistemic state or best system analysis.
  *   **Inside the System (8) & Reference Class (5):** For agents embedded within the stochastic system (e.g., the universe), defining the "correct" reference class and avoiding circularity in deferring to chances that encompass their own existence and evidence is deeply challenging.

  ### The Requirement that Kills Popular Accounts (Especially Lewis's Original PP)

  *   **Handling Misdescribed Setups Without Bootstrapping (Desiderata 4 & 20, conflicting with 18)**. This is the Achilles' heel of Lewis's original Principal Principle.
      *   **Why:** The original PP directly used the agent's *belief* about the chance proposition `H` (`H` stating `Ch_t(A) = x`). If the agent later learns `H` was false (because the setup was misdescribed), their initial credence `Cr(A | H) = x` was fundamentally tied to a falsehood. Revising beliefs based on this discovery risked letting the *initial, erroneous* belief (`Cr(H) > 0`) bootstrap the new beliefs. The "New Principle" avoids this by shifting deference to propositions about the *entire chance distribution* or *functional roles*, making it robust to learning that specific chance values were miscalculated due to setup errors. Most popular accounts prior to refinements like the New Principle fail this requirement.

  This list represents the ambitious, and likely not fully realizable, ideal for a complete theory of rational deference to objective chance. Any viable theory will need to navigate the inherent tensions, particularly the core conflict around belief revision and bootstrapping.
