     - Under the board's outcome probabilities (low q_j1), the expected return for the new framework might be negative, and for old ones slightly negative. Overall μ_s (board) negative.

     - Then f_s2 = 0.

     - Under the proposer's outcome probabilities (high q_j1), the expected return for the new framework is very positive, but for old frameworks very negative. Since the old frameworks have 99% prior, the overall μ_s1 = 0.99*[negative] + 0.01*[positive] = negative. So f_s1=0.

     - So the raw fraction is 0. Then we do not fund.

     - *Conflict with intuition:* This project could be revolutionary. But the procedure kills it because the prior for the new framework is low, and the project might harm the credence in the old frameworks (which collectively have high prior). This might be a failure of the prior assignment: the board assigned only 1% to the new framework, which is a judgment call. If they assigned more, it might be funded. This exposes a limit of geometric rationality when the payoff matrix is endogenously destroyed by a project: the criterion is conservative about paradigm shifts.

  **Case (c): Near-uniform prior over a large set of incommensurable success conditions, naive geometric mean would recommend over-leverage**

  - *Representation:* There are many (say, 100) possible success conditions, each with prior 1%. The proposal has one outcome that if successful, it will boost one of these conditions to 99% (but we don't know which one). If it fails, then the credence in all remains 1%. The probability of success is p.

     - For a particular true framework i, the return if the project is successful and i is the one boosted: r_i = log(0.99/0.01)=4.6.
     - If it fails: r_i = log(0.01/0.01)=0.
     - If it is successful but i is not the one boosted: then the posterior for i is 0.01*(1-0.99)/(1-0.01) ≈ 0.0001, so r_i = log(0.0001/0.01) = log(0.01) = -4.6.

     - The probability that the true framework is boosted is 1% (since only one is true). So for the true framework i, the expected return is: 
          p * [ 0.01 * 4.6 + 0.99 * (-4.6) ] + (1-p)*0 = p * [0.046 - 4.554] = p * (-4.508)

     - This is negative for any p>0. So the expected return for the true framework is negative.

     - Then the overall expected return (average over frameworks) is also negative? Let's compute:

          μ = sum_i P(i) * [ p * (I_i * 4.6 + (1-I_i)*(-4.6)) ] 
            = p * [ 0.01*4.6 + 0.99*(-4.6) ] = p * (-4.508)

     - So the fraction f=0.

     - *Conflict with intuition:* A naive approach might be to see that with probability p the project boosts one framework to 99%, and with 1% chance that it is the true one. But the geometric mean criterion sees that if the project succeeds and the true framework is not the one boosted, then we suffer a catastrophic drop in credence. The procedure avoids this. So it matches intuition in this case: we should not over-leverage.

     - However, if the project could boost a cluster of frameworks (which together have high prior), then it might be positive. But in this case, the conditions are incommensurable and the boost is for one unknown one.

  ---

  ### Conclusion

  The procedure is heuristic and has limitations. It may be too conservative in the face of ambiguity or paradigm shifts. But it provides a structured way to incorporate epistemic returns and ambiguity aversion. The judgment calls (priors for new frameworks, outcome scenarios, and outcome probabilities) are critical and must be made explicitly.

  We have applied it to the three cases and found that in case (a) and (b) it may be too conservative, which might be a limit of geometric rationality in these domains. In case (c) it avoids a trap.
answer: |-
  Below is a step-by-step decision procedure for translating geometric rationality (Kelly criterion) into epistemic budget allocation, addressing the complexities of ambiguous probabilities, non-stationary environments, and belief-state returns. The procedure is designed as a reusable checklist executable in ~20 minutes per proposal, with explicit handling of judgment calls and aggregation. I then apply it to your three hypothetical cases.

  ---

  ### **Core Procedure: Geometric Epistemic Allocation (GEA)**
  **Inputs per proposal:** Current credence distribution over frameworks, proposal's outcome space, likelihoods, and potential taxonomy shifts.  
  **Output:** Allocation fraction (Kelly fraction) for the proposal, ambiguity penalty, and aggregation rules.  

  #### **Step 1: Representing Epistemic Returns (Belief-State Shifts)**  
  *Goal: Convert credence shifts into a "return vector" for Kelly-like optimization.*  
  1. **Define outcome-dependent posteriors:**  
     - Proposer specifies a set of possible outcomes \(o_1, o_2, \dots, o_m\) (e.g., experimental results, theoretical insights).  
     - For each outcome, proposer provides:  
       - A posterior credence distribution over **existing frameworks** (if no taxonomy shift).  
       - If the proposal introduces **new frameworks**, proposer must specify:  
         (i) Prior credence for each new framework (default: \(\frac{1}{n+k}\) for \(k\) new frameworks, where \(n\) is current frameworks).  
         (ii) Posterior credences over the expanded framework set.  
     - *Judgment call: Board may adjust priors for new frameworks or posteriors if contested.*  

  2. **Compute log-returns per framework:**  
     - For each outcome \(o_j\) and framework \(i\), calculate:  
       \[
       r_{ij} = \log\left(\frac{\text{posterior}_j(i)}{\text{prior}(i)}\right)
       \]  
       - This represents the multiplicative change in credence for framework \(i\) under outcome \(o_j\).  
       - If posterior credence is 0 (framework falsified), \(r_{ij} = -\infty\).  

  3. **Return profile:**  
     - Return for outcome \(o_j\) is the vector \(\mathbf{r}_j = (r_{1j}, r_{2j}, \dots, r_{nj})\) (or \(n+k\) if new frameworks).  
     - **Aggregation note:** Returns are additive in log-space (geometric mean compatibility).  

  #### **Step 2: Computing Kelly Fraction with Ambiguous Priors**  
  *Goal: Derive allocation fraction \(f\) using expected log-growth, given probability and model ambiguity.*  
  1. **Specify outcome probabilities:**  
     - Proposer provides probabilities \(q_j\) for each outcome \(o_j\).  
     - Board specifies **alternative probability scenarios** (e.g., skeptical view) if priors are contested: \(Q = \{q^1, q^2, \dots, q^s\}\).  
     - *Judgment call: Number of scenarios (min: proposer + board baseline).*  

  2. **Compute scenario-specific Kelly fractions:**  
     - For each probability scenario \(q^s \in Q\):  
       - Calculate expected log-return for each framework \(i\):  
         \[
         \mu_i^s = \sum_j q_j^s \cdot r_{ij}
         \]  
       - Compute overall expected log-growth rate:  
         \[
         \mu^s = \sum_i \text{prior}(i) \cdot \mu_i^s \quad \text{(deterministic)}
         \]  
       - Compute variance of log-returns across outcomes (risk proxy):  
         \[
         \sigma_s^2 = \sum_i \text{prior}(i) \cdot \left( \sum_j q_j^s \cdot (r_{ij} - \mu_i^s)^2 \right) \quad \text{(deterministic)}
         \]  
       - Derive raw Kelly fraction:  
         \[
         f_s = \max\left(0, \frac{\mu^s}{\sigma_s^2}\right) \quad \text{(analogous to Sharpe ratio)}
         \]  
         - *Rationale: Fraction scales with expected return per unit risk (variance penalizes volatile credence shifts).*  

  3. **Ambiguity-averse fraction:**  
     - Set final Kelly fraction:  
       \[
       f = \min_{s \in Q} f_s \quad \text{(judgment call: min over scenarios)}
       \]  
     - *Why min? Pessimistic hedge against disputed priors; avoids overcommitment.*  

  #### **Step 3: Handling Taxonomy Shifts (Non-Stationary Updates)**  
  *Goal: Adjust portfolio weights when funded projects alter the framework space.*  
  1. **Pre-funding check:**  
     - If the proposal introduces new frameworks, flag it for **taxonomy shift risk**.  
     - *Judgment call: Board estimates contagion potential (low/medium/high) for how new frameworks could obsolete other projects.*  

  2. **Post-funding update (after project completion):**  
     - Upon observing outcome \(o_j\):  
       - Update credence distribution to the posterior.  
       - If new frameworks are added, expand the framework set.  
     - **Re-map all active projects:**  
       - Proponents of other projects respecify their return profiles (Step 1) under the new taxonomy.  
       - *Judgment call: If proponents cannot respecify, suspend funding pending review.*  
     - **Recalculate allocations:**  
       - Recompute Kelly fractions (Step 2) for all projects using the updated credence state.  
       - *Key: Geometric mean is now over the new outcome space ("coordinate system").*  

  #### **Step 4: Ambiguity-Aversion Constraint**  
  *Goal: Penalize proposals vulnerable to unknown unknowns without maximin/uniformity.*  
  1. **Compute ambiguity score:**  
     - Calculate inter-scenario disagreement:  
       \[
       \alpha = \sqrt{\text{Var}_s(\mu^s)} \quad \text{(stdev of expected log-growth across } Q)
       \]  
     - *Deterministic: Measures model uncertainty.*  

  2. **Apply penalty:**  
     - Adjust allocation fraction:  
       \[
       f_{\text{final}} = f \cdot e^{-\lambda \alpha} \quad \text{(exponential penalty)}
       \]  
       - \(\lambda\): Board-set aversion parameter (default \(\lambda = 1\); higher if more conservative).  
     - **Cap per proposal:** \(f_{\text{final}} \leq 0.1\) (prevents >10% allocation to one project).  
     - *Rationale: Exponential decay penalizes unresolved ambiguity; cap ensures diversification.*  

  #### **Aggregation Across Portfolio**  
  - Sum \(f_{\text{final}}\) over all proposals.  
  - Normalize: \(\text{Allocation}_k = \frac{f_{\text{final}, k}}{\sum_i f_{\text{final}, i}} \times \text{Budget}\).  
  - **Constraint:** If \(\sum_i f_{\text{final}, i} < 1\), surplus is held as "liquidity" for future opportunities.  

  ---

  ### **Application to Hypothetical Cases**  
  **Common setup:**  
  - Current credence over 3 frameworks: \(P = (0.5, 0.3, 0.2)\)  
  - Board sets \(\lambda = 1\), cap = 10%.  
  - Alternative probability scenarios: Proposer (scenario A) vs. board skeptics (scenario B).  

  #### **Case (a): Quantifiable milestones, uncertain impact**  
  *Proposal: Experiment with 3 clear outcomes (success/partial/fail), but final theoretical impact disputed.*  
  - **Step 1 (Returns):**  
    - Outcomes: Success (\(o_1\)), partial (\(o_2\)), fail (\(o_3\)).  
    - Posteriors (proposer):  
      - \(o_1\): \((0.8, 0.1, 0.1)\) → \(\mathbf{r}_1 = (\log(1.6), \log(0.33), \log(0.5)) = (0.47, -1.10, -0.69)\)  
      - \(o_2\): \((0.6, 0.3, 0.1)\) → \(\mathbf{r}_2 = (0.18, 0.0, -0.69)\)  
      - \(o_3\): \((0.4, 0.4, 0.2)\) → \(\mathbf{r}_3 = (-0.22, 0.29, 0.0)\)  
    - Board accepts posteriors but disputes outcome probabilities.  
  - **Step 2 (Kelly fraction):**  
    - Scenario A (proposer): \(q = (0.5, 0.3, 0.2)\)  
      - \(\mu^A = 0.5 \cdot [0.47, -1.10, -0.69] + \cdots = 0.16\)  
      - \(\sigma_A^2 = 0.5 \cdot (0.47 - 0.16)^2 + \cdots = 0.21\) → \(f_A = 0.16 / 0.21 = 0.76\)  
    - Scenario B (board): \(q = (0.1, 0.2, 0.7)\)  
      - \(\mu^B = -0.12\), \(\sigma_B^2 = 0.14\) → \(f_B = 0\) (negative \(\mu\))  
    - \(f = \min(0.76, 0) = 0\)  
  - **Step 4 (Ambiguity):**  
    - \(\alpha = \text{stdev}(0.16, -0.12) = 0.20\) → \(f_{\text{final}} = 0 \cdot e^{-0.2} = 0\)  
  - **Allocation:** 0% (rejected).  
  - **Conflict:** Intuition might fund due to milestones, but GEA rejects because skeptical scenario implies negative expected log-growth.  
    - *Diagnosis: Geometric rationality misfires when intermediate outcomes are decoupled from final impact. Solution: Redesign returns to reward milestone-driven information gain.*  

  #### **Case (b): Novel ontology, high contagion risk**  
  *Proposal: New framework (F4) introduced; success would obsolete metrics for 30% of portfolio.*  
  - **Step 1 (Returns):**  
    - New prior for F4: \(P_{\text{new}} = (0.45, 0.25, 0.2, 0.1)\) (board sets 10% prior).  
    - Outcomes: F4 supported (\(o_1\)), not supported (\(o_2\)).  
    - Posteriors:  
      - \(o_1\): \((0.1, 0.1, 0.1, 0.7)\) → \(\mathbf{r}_1 = (\log(0.22), \log(0.4), \log(0.5), \log(7)) = (-1.51, -0.92, -0.69, 1.95)\)  
      - \(o_2\): \((0.5, 0.3, 0.2, 0.0)\) → \(\mathbf{r}_2 = (0.0, 0.0, 0.0, -\infty)\)  
  - **Step 2 (Kelly fraction):**  
    - Scenario A (proposer): \(q = (0.7, 0.3)\)  
      - \(\mu^A = 0.45 \cdot [-1.51] + \cdots + 0.1 \cdot [0.7 \cdot 1.95 + 0.3 \cdot (-\infty)] = -\infty\) (F4 failure catastrophic)  
      - \(f_A = 0\)  
    - Scenario B (board): \(q = (0.05, 0.95)\) → \(\mu^B = -0.05\), \(f_B = 0\)  
    - \(f = 0\)  
  - **Step 3 (Taxonomy shift):** Flagged "high contagion" → if funded, 30% of portfolio must be respecified.  
  - **Step 4 (Ambiguity):** \(\alpha = \infty\) (due to \(-\infty\)) → \(f_{\text{final}} = 0\)  
  - **Allocation:** 0% (rejected).  
  - **Conflict:** Intuition might fund for potential breakthrough, but GEA rejects due to unbounded risk (F4 failure → \(-\infty\) log-return) and contagion.  
    - *Diagnosis: Limit of geometric rationality—it cannot hedge against unrecoverable failures. Workaround: Cap losses (e.g., \(r_{ij} \geq -5\)) to avoid \(-\infty\).*  

  #### **Case (c): Uniform prior, incommensurable successes**  
  *Proposal: 100 frameworks, uniform prior (0.01 each); success boosts one random framework to 99%.*  
  - **Step 1 (Returns):**  
    - Outcomes: Success (\(o_i\) for framework \(i\) boosted), failure (\(o_0\)).  
    - Posteriors:  
      - \(o_i\): Framework \(i\) at 99%, others at 0.01% → \(r_{ii} = \log(99)\), \(r_{ij} = \log(0.01)\) for \(j \neq i\)  
      - \(o_0\): All remain 0.01% → \(r_{ij} = 0\)  
  - **Step 2 (Kelly fraction):**  
    - Scenario A (proposer): \(P(\text{success}) = 0.2\)  
      - For true framework \(i\): \(\mu_i^A = 0.2 \cdot \log(99) + 0.8 \cdot 0 = 0.09\)  
      - Variance: \(\sigma_i^2 = 0.2 \cdot (\log(99) - 0.09)^2 + 0.8 \cdot (0 - 0.09)^2 = 0.86\)  
      - \(\mu^A = \sum_i \text{prior}(i) \cdot \mu_i^A = 0.09\)  
      - \(\sigma_A^2 = \sum_i \text{prior}(i) \cdot \sigma_i^2 = 0.86\) → \(f_A = 0.09 / 0.86 = 0.10\)  
    - Scenario B (board): \(P(\text{success}) = 0.05\) → \(\mu^B = 0.02\), \(\sigma_B^2 = 0.21\) → \(f_B = 0.10\)  
    - \(f = \min(0.10, 0.10) = 0.10\)  
  - **Step 4 (Ambiguity):** \(\alpha = \text{stdev}(0.09, 0.02) = 0.05\) → \(f_{\text{final}} = 0.10 \cdot e^{-0.05} = 0.095\)  
  - **Allocation:** 9.5% (capped at 10%).  
  - **Conflict:** Naive Kelly (\(f_A = 0.10\)) would overallocate, but GEA's cap and ambiguity penalty prevent over-leverage.  
    - *Diagnosis: Procedure works as intended—avoids dangerous bets by penalizing model uncertainty and capping exposure.*  

  ---

  ### **Where the Procedure Misfires and Why**  
  1. **Overconservatism in high-ambiguity/high-potential cases** (e.g., Case b):  
     - Geometric rationality prioritizes survival, rejecting projects with small risks of unrecoverable failure.  
     - *Fix: Introduce loss caps (e.g., \(\max(r_{ij}, -5)\)) to avoid \(-\infty\).*  

  2. **Taxonomy shifts disrupt aggregation:**  
     - Re-mapping projects after shifts is manual and costly.  
     - *Fix: Require proposals to pre-specify outcomes under hypothetical taxonomies.*  

  3. **Linear variance penalizes heavy tails:**  
     - Variance (\(\sigma_s^2\)) may understate tail risk (e.g., falsification events).  
     - *Fix: Add a kurtosis penalty in risk calculation for extreme outcomes.*  

  4. **Judgment calls dominate in contested priors:**  
     - Minimax over scenarios (\(f = \min f_s\)) may over-rely on pessimistic board members.  
     - *Fix: Use weighted averaging over scenarios if board trusts proposer expertise.*  

  **Conclusion:** This procedure makes geometric rationality actionable for epistemic contexts, with explicit safeguards for ambiguity and non-stationarity. It misfires when tail risks or taxonomy shifts are irreducible, but these are limits of the framework, not implementation flaws. For the board memo, emphasize that judgment calls are flagged at each step, and aggregation rules ensure portfolio-level coherence.
