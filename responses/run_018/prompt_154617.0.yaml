  Okay, the user is asking about a tension in Montaigne's reasoning in "Of Cannibals." They point out that Montaigne seems to hold both a descriptive cultural relativism—where each society judges barbarism based on its own norms—and a normative judgment that European cruelty is worse than Tupinambá cannibalism. The user wants to know how these two positions can coexist without contradiction. They also wonder if Montaigne is using a distinction between judgments that depend on a specific cultural standpoint and those that transcend cultures by appealing to something universal, like human dignity or natural reason.

  First, I need to recall the specifics of Montaigne's essay. He describes the Tupinambá people, noting their lack of European institutions but their social harmony. He frames their cannibalism as a ritual of vengeance, contrasting it with European torture and executions justified by law and religion. Montaigne argues that what's considered barbarous is relative to each culture, yet he clearly condemns European practices as more barbarous. The challenge is reconciling this relativism with his universal condemnation.

  The user mentions a possible implicit distinction between standpoint-dependent and standpoint-transcendent evaluations. I should explore whether Montaigne differentiates between judgments based on cultural conventions versus those based on natural reason. In his time, the concept of natural law was prevalent, which might serve as a universal standard. Montaigne was skeptical but still appealed to natural principles in some cases. 

  Looking at the passage, Montaigne's descriptive relativism is evident when he says that every nation calls barbarous what differs from its own customs. This is conventional judgment—each culture's norms are arbitrary and relative. However, when he compares European torture to Tupinambá cannibalism, he shifts to a different kind of evaluation. He points out that Europeans torture living people with sophisticated methods under the guise of justice and religion, while the Tupinambá kill enemies quickly and consume them post-mortem as part of a ritual. The key here is the distinction between the act itself and the context—motivation, cruelty, and hypocrisy. 

  Montaigne's normative judgment seems rooted in natural judgment. He appeals to innate human sentiments like pity and horror, which transcend cultural boundaries. For example, he suggests that seeing a man tortured would evoke natural pity, implying a universal human response. He also emphasizes the deception in European practices—using religion and law to justify cruelty, which perverts natural reason. This contrasts with the Tupinambá's straightforward vengeance without pretense. 

  So, the distinction between conventional and natural judgment resolves the tension. Conventional judgments are relative and culture-bound, but natural judgments are based on universal human instincts and reason. Montaigne uses this to condemn European practices as worse because they violate natural principles more egregiously. The logic is that while all cultures have practices others find barbarous, some actions are inherently more cruel and hypocritical, violating natural human sensibilities. Thus, his normative stance isn't contradictory because it operates on a different level—appealing to a shared human nature rather than cultural norms.
answer: |-
  You've pinpointed the core tension brilliantly. Montaigne navigates this apparent contradiction by implicitly deploying a distinction between **Conventional Judgment** (standpoint-dependent) and **Natural Judgment** (standpoint-transcendent), grounded in his understanding of universal human nature and reason. Here's how his logic works, using your passage:

  1.  **Descriptive Cultural Relativism (Conventional Judgment):**
      *   Montaigne states: "every nation calls barbarous whatever differs from its own habits." This is an *observation* about human psychology and social practice. Judgments of "barbarism" arise from cultural difference itself. What is "normal" or "civilized" is defined solely by local convention and familiarity. Within this framework, the Tupinambá ritual and European torture are equally "barbarous" *from each other's perspective*.

  2.  **Normative Critique (Appealing to Natural Judgment):**
      *   Montaigne doesn't stop at observation. He *compares* the practices: Tupinambá cannibalism (ritual vengeance against *dead* enemies) vs. European torture/execution/dismemberment (inflicted upon *living* bodies "in the name of justice and faith").
      *   His critique hinges on *internal qualities* of the acts, judged against a standard he believes is *inherent* to human nature:
          *   **Degree of Suffering:** Executing someone quickly (even if later consuming them) arguably inflicts less prolonged suffering than elaborate torture or dismemberment of the living. Montaigne implicitly appeals to a natural human aversion to *excessive cruelty* and the *suffering of the living*.
          *   **Motivation & Honesty:** Tupinambá vengeance is presented as direct, passionate, and undisguised ("hatred extends even beyond death"). European cruelty is performed "in the name of justice and faith," suggesting *hypocrisy* and the perversion of noble concepts to justify brutality. Montaigne suggests a natural human capacity to recognize the difference between raw passion and calculated cruelty masked by ideology.
          *   **The Mask of Civilization:** Europeans cloak their violence in law and religion, claiming moral superiority while inflicting horrors arguably worse than the "savage" practice they condemn. This *deception*, using the very institutions meant to uphold order and piety to inflict suffering, strikes Montaigne as particularly egregious. He appeals to a natural sense of justice recoiling at this perversion.

  3.  **The Distinction at Work:**
      *   The **Conventional Judgment** ("This is barbarous because it's foreign/different") applies equally to *both* practices, depending on who is judging. This is the standpoint-dependent evaluation.
      *   The **Natural Judgment** ("This act is *intrinsically* more cruel, hypocritical, and harmful to fundamental human sensibilities") is where Montaigne grounds his normative claim that European cruelty is "genuinely worse." He argues this standard is *not* conventional, but arises from:
          *   **Natural Reason:** The capacity to compare acts dispassionately and perceive hypocrisy (masking cruelty with law/religion) and disproportionate suffering.
          *   **Natural Sentiment/Pity:** The innate human feeling of compassion or horror evoked by witnessing extreme suffering inflicted on the living, especially when prolonged and institutionalized.
      *   **Where the Distinction Operates:** It becomes explicit when Montaigne shifts from *describing* cultural relativity ("every nation calls barbarous...") to *comparing* the acts ("I am not sorry that we notice the barbarous horror of such acts... but I am heartily sorry that, judging their faults rightly, we should be so blind to our own"). The comparison requires stepping *outside* the purely conventional framework of each culture. He implicitly asks: *Setting aside whose custom it is, which act, by its nature, causes more suffering? Which involves greater hypocrisy? Which perverts the institutions meant to protect life and order?* These questions rely on the Natural Judgment.

  **Resolution of the Tension (Montaigne's Logic):**

  1.  **Conventional Judgment explains *why* people *label* things barbarous:** It's based on unfamiliarity and difference. This explains *both* European condemnation of cannibalism *and* Tupinambá potential condemnation of European torture (if they knew its details).
  2.  **Natural Judgment provides a standard for *evaluating* the *moral weight* of acts *despite* their conventional labels:** While both acts might be conventionally labeled "barbarous" by outsiders, Natural Judgment allows Montaigne to argue that one act (European torture) involves qualities – prolonged suffering of the living, hypocrisy, institutional perversion – that make it *objectively* (in the sense of naturally) *worse* or more barbarous *in its essence*.
  3.  **The "True Barbarism":** Montaigne's conclusion – "the true barbarism lies not in foreign rites but in the cruelty Europeans display... masked by law and religion" – relies entirely on this Natural Judgment. "True barbarism" transcends the conventional label. It identifies cruelty, *especially* when amplified by hypocrisy and institutional power, as a violation of a fundamental natural sentiment (pity, horror at suffering) and natural reason (recognizing deception and perversion).

  **In essence:** Montaigne uses Conventional Judgment to *deconstruct* European claims of inherent superiority based on difference. He then uses Natural Judgment (appealing to universal human sentiment and reason) to *reconstruct* a critical standard that allows him to condemn specific European practices *as worse* than the foreign practice they condemn, precisely because they violate this shared human nature more profoundly through hypocrisy and institutionalized cruelty against the living. The tension is resolved by distinguishing *why* something is called barbarous (convention) from *whether* it deserves a deeper condemnation based on its inherent qualities and impact on universal human sensibilities (nature). His relativism applies to the labels; his universalism applies to the underlying human capacity to feel and reason about suffering and justice.
