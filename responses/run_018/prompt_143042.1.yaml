  Hmm, the user seems sophisticated—they're auditing a philosophy course, cite concepts precisely, and explicitly reject vague "language reshapes cognition" arguments. They want concrete, testable defeaters. Their frustration with hand-waving suggests they've already considered common rebuttals and found them insufficient. 

