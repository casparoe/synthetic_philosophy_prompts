answer: |-
  ## The Structural Threshold: A Coherent Illusion?

  Lexical-threshold negative utilitarianism (LTNU) promises a compelling moral intuition: the desperate urgency of alleviating severe suffering must dominate the pursuit of pleasure until suffering is sufficiently mitigated, at which point pleasure regains moral relevance. However, its coherence hinges critically on defining the "threshold" separating these lexical domains. The standard reliance on cardinal commensurability offers apparent precision but rests on shaky empirical and conceptual ground. Attempting to reconstruct the threshold using purely structural dominance relations – partial orders avoiding cardinal metrics – is a valiant effort to salvage the core intuition. Yet, upon rigorous examination, this structural approach fails to provide a non-arbitrary, coherent boundary, collapsing LTNU into either standard negative utilitarianism with an unmotivated cutoff or generating implausible discontinuities in practical reasoning. **The verdict is clear: without at least *some* form of cardinal comparability, the lexical threshold cannot be meaningfully defined and LTNU loses its distinctive coherence.**

  ### The Cardinalist Argument: Precision or Bust
  The argument for cardinal commensurability as essential is straightforward and powerful. A threshold, by definition, demarcates a specific boundary. To say suffering "dominates" below a point and does not above it requires identifying *that specific point*. Cardinality provides the necessary tools:
  1.  **Fixed Location:** A single cardinal scale (e.g., hedonic units) allows precise placement of the threshold value (e.g., suffering intensity < X units). This value anchors the lexical shift objectively (or inter-subjectively).
  2.  **Aggregation and Trade-offs:** Below the threshold, cardinality enables meaningful aggregation of suffering across individuals and clear trade-off rules (e.g., any suffering reduction, no matter how small, lexically dominates any pleasure increase, no matter how large). Above the threshold, cardinality allows standard utilitarian aggregation and trade-offs between pleasure and residual suffering.
  3.  **Borderline Avoidance:** Cardinality minimizes vagueness. While measurement imprecision exists, the *concept* of the boundary is sharp and non-arbitrary *in principle*.

  Without cardinality, the Cardinalist argues, the threshold location becomes fundamentally arbitrary. What structural feature could possibly mark the *exact* point where suffering ceases to be lexically dominant? Any non-cardinal attempt to define "sufficiently mitigated" suffering seems like picking a point in the dark.

  ### The Structuralist Gambit: Dominance Without Numbers
  The Structuralist rejects the cardinalist premise. They propose defining the threshold relationally and ordinally, using dominance relations within a partial order. The key moves are:

  1.  **Intra-Domain Dominance:** Within the "severe suffering" domain, define a relation: State A ≻ B iff A involves less suffering than B *for the same individual*, or involves reducing suffering more for one individual compared to increasing pleasure for another *in a way that intuitively preserves lexical priority*. Crucially, no common scale is needed, only pairwise comparisons establishing that suffering reduction *always trumps* pleasure gain within this domain.
  2.  **Defining the Threshold Structurally:** The threshold isn't a point on a scale, but a *set of states* characterized by the *absence* of any suffering severe enough to trigger lexical dominance over any potential pleasure gain. Specifically:
      *   A state S is **below threshold** for an individual if, for *any* alternative state T that increases that individual's pleasure but also increases *any* suffering for *any* individual (even minutely), S is morally preferable to T. (Suffering reduction dominance holds).
      *   A state S is **above threshold** for an individual if there exists *some* alternative state T that increases that individual's pleasure (or another's) sufficiently that it is morally preferable to S, *even if* T involves slightly more suffering for that individual or others, provided that suffering is not itself below-threshold-severe. (Pleasure/absence-of-severe-suffering can outweigh minor suffering).
  3.  **The Boundary as a Region of Incomparability/Non-Transitivity:** States near the putative boundary might lack clear dominance relations with states involving mixed pleasure/suffering changes. This indeterminacy *is* the structural signature of the threshold.

  The Structuralist claims this captures the lexical intuition: below threshold, suffering reduction utterly dominates; above threshold, trade-offs are possible; the boundary emerges from the pattern of dominance relations, not a metric.

  ### The Collapse: Vagueness, Arbitrariness, and Discontinuity
  While elegant, the structuralist reconstruction fatally falters:

  1.  **The Definitional Circularity:** The definitions of "below threshold" and "above threshold" states *presuppose the very threshold they are trying to define*. What counts as "any suffering" in the below-threshold definition? It cannot mean *literally any* suffering, as that would imply lexical priority persists even for trivial itches, collapsing into standard lexical negative utilitarianism without a threshold. It must mean suffering *above a certain severity*. But severity is precisely what the structural approach seeks to define without a cardinal measure. **The structural definition smuggles in an implicit, unacknowledged severity criterion.** Without cardinality to anchor "severity," this criterion is arbitrary. How much suffering is "severe enough" to trigger the dominance relation? The structure provides no answer; it merely labels the states where the dominance applies.
  2.  **The Aggregation Abyss:** Structural dominance struggles profoundly with multi-person aggregation near the threshold. Consider two individuals:
      *   Individual A: Suffering just barely "above threshold" (structurally defined).
      *   Individual B: Suffering just barely "below threshold."
      *   Option 1: Slight pleasure increase for A.
      *   Option 2: Significant suffering reduction for B.
      How does structural dominance decide? Reducing B's suffering should lexically dominate (B is below threshold). But is Option 1 even comparable to Option 2? If we can't cardinally compare the *degree* of B's suffering reduction to the *degree* of A's pleasure increase, and the suffering levels themselves lack cardinal comparison, we have no basis for judgment. The structural dominance relation for B applies only when comparing states affecting *B*. It says nothing about trade-offs *between* A and B. Without cardinality, aggregating welfare across individuals, especially across the threshold boundary, becomes impossible or arbitrary. The lexical priority loses its practical force in complex scenarios.
  3.  **Vagueness Erodes Lexical Priority:** The structural "boundary" is inherently vague. There will be states where it's indeterminate whether the suffering present is sufficient to trigger the lexical dominance relation over *all* potential pleasure gains. Is *this* level of discomfort "severe enough"? The dominance relation requires suffering reduction to trump *any* pleasure increase. But without cardinality, determining the scope of "any suffering" triggering this dominance is hopelessly vague. This vagueness infects the entire lexical priority claim. If it's unclear *when* suffering dominates, the supposed strict priority dissolves into a murky zone of incomparability that undermines decisive moral guidance precisely where LTNU claims to be strongest.
  4.  **Implausible Discontinuity by Fiat:** The structural approach avoids cardinal discontinuity but creates a *practical* discontinuity just as implausible. A minute decrease in someone's suffering might suddenly shift their state from "below threshold" (where suffering reduction utterly dominates all pleasure considerations) to "above threshold" (where minor suffering increases could be traded for pleasure). Yet, the *experienced difference* between these two adjacent states might be negligible. The moral significance of shifting across this structural boundary is immense and discontinuous, but the structural definition provides no justification for *why* this specific relational shift carries such overwhelming normative weight compared to other changes. It feels like discontinuity is asserted rather than derived from the phenomenology of suffering/pleasure or coherent normative principles.

  ### The Verdict: Coherence Requires Comparability
  The structuralist gambit fails to rescue LTNU from the need for cardinal commensurability. Without a means to compare the *intensity* and *significance* of different experiences of suffering and pleasure – at least sufficiently to define a non-arbitrary level of "sufficient mitigation" – the threshold cannot be meaningfully located.

  *   **Attempting to define it structurally leads inevitably to circularity or arbitrariness** in specifying what counts as suffering severe enough to trigger lexical dominance.
  *   **Attempting to operate solely within dominance relations creates crippling vagueness** at the boundary and **fatal aggregation problems** across individuals, paralyzing practical reasoning in precisely the complex scenarios LTNU aims to address.
  *   **The resulting framework either:** (a) **Collapses into standard negative utilitarianism** by effectively making the lexical priority absolute (if "any suffering" triggers dominance), abandoning the threshold; or (b) **Introduces an implausible, unjustified discontinuity** in moral reasoning that mirrors the cardinal problem it sought to avoid, but without the cardinal scale's (theoretical) precision.

  Therefore, while the *intuition* behind lexical-threshold negative utilitarianism is powerful, its coherent formulation as a distinct and action-guiding theory **cannot dispense with some form of cardinal comparability.** Without it, the threshold is not merely fuzzy; it is conceptually untenable, leaving the theory fatally undermined on its own internal structural grounds. The quest for a purely ordinal LTNU ends not in a refined framework, but in the realization that the threshold requires a metric it cannot itself provide.
