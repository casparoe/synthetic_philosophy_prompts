  Hey, I'm a retired materials scientist and I only started reading philosophy books after I left the lab. There's this idea I keep bumping into — lexical threshhold negative utilitarianism, where suffering has some kind of lexical priority over pleasure, or maybe there's a cutoff below which pleasure can't compensate? And then separately there's the old question about whether pleasure and pain are actually commensurable at all, like can you even put them on the same scale. Could you compare these two positions? Specifically, if you think pleasure and pain are incommensurable, are you automatically pushed toward the lexical view, or can those stay separate? Also I cooked up this weird analogy: what if pleasure and pain were like discrete quantum spin states with no continuous gradation — would that discreteness make lexical priority more plausible, or is it just another form of incommensurability? I'm not asking for a reading list, just want to know if my reasoning is off.
