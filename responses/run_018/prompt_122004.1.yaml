  Hmm... I recall that LTNU isn't just about prioritizing suffering, but specifically about a threshold where no amount of pleasure can offset certain suffering. The incommensurability argument is more radical - it claims we can't even compare pleasure and pain quantitatively at all. 

  The user's quantum spin analogy is brilliant coming from a materials science background. They're trying to map philosophical concepts onto physical systems they understand. But is discrete quantization the same as incommensurability? Not quite - discrete states can still be comparable (like energy levels), whereas true incommensurability means no common metric exists. 

  I should point out that one could believe in thresholds without full incommensurability - for example, believing small pains and pleasures are comparable, but severe suffering enters a different regime. The user might be overgeneralizing from their scientific mindset where concepts often have strict dependencies. 

  Their underlying concern seems to be about finding coherent ethical frameworks after leaving the certainty of lab work. The quantum analogy suggests they're wrestling with how to handle moral "measurements" without scientific instruments. I should validate that intellectual journey while clarifying distinctions. 

