prompt: |-
  Longtime lurker, been reading this corner of the internet since the Sequences were still being written, and I've got a thing I keep noticing that I can't find a word for. Hoping somebody can tell me whether it already has a name.

  The general shape is a positional competition where everybody escalates and the escalation is pure waste in aggregate and everyone involved knows it — college admissions is the case I know best, since my youngest starts applying next fall and my brother-in-law teaches at one of those suburban high schools where the whole senior year is basically an arms race. Fine: that part is the boring familiar thing, I've read the Moloch essay same as everybody, and multipolar trap / tragedy of the commons / positional arms race all gesture at it. But two features keep showing up in the cases I actually watch, and I don't think those labels get them, and it's those I want the name for. One: the competition doesn't just waste effort, it degrades the thing being competed over — and the degradation makes the competition worse instead of self-limiting. As the transcripts inflate, they get noisier as evidence of anything, so admissions leans harder on the few things they still trust, which are the most coachable and most purchasable items on the file, so the coaching money flows there, so those get noisier too. The signal doesn't fade out, it collapses onto narrower and easier to game criteria, and the race speeds up. Two: the people who drop out of the race are disproportionately the ones who never wanted to be in it, and once they're gone the remaining field is more committed to escalating, and the median participant is now somebody who likes the race. I see the same skeleton in hiring where I work: as portfolios and take-homes get AI-polished into uselessness, the loop closes harder onto brand-name employers and referrals, which are the most gameable things left.

  Which is why I don't think the usual words are quite it. People throw Goodhart around for anything, but as I understand it that's a measure ceasing to track the target; here the measure's failure is what feeds the process that broke it, which feels like the opposite direction. And the everybody loses framing isn't right either — there's a concentrated winner, the test prep companies, the credentialing vendors, whoever owns the ranking, and they're organised and they defend the arrangement, while the losers are diffuse. So: is there an established concept for the collapse-onto-narrower-criteria part, or for the dropout-makes-the-trap-tighter part, or for both together as one animal? I don't want a word slapped on it. Tell me what the real neighbouring concepts are — I assume I'm circling costly signalling, positional goods, maybe adverse selection, maybe some kind of ratchet — where my description fits each one and where it doesn't, and which fits best. And if there genuinely isn't a name, then coin one, define it tightly enough that I can separate it from its neighbours, and give me the two boundary cases: something that superficially looks like this but shouldn't count, and something that really is this that a sloppy definition would miss.
reasoning: |-
  Okay, the user is describing a specific pattern they've observed in competitive systems like college admissions and hiring. They mention two key features: the competition not only wastes effort but also degrades the signal being competed over, leading to a collapse onto narrower, more gameable criteria. Additionally, the participants who drop out are those less committed, leaving behind a group more willing to escalate. They're looking for a term that captures this dynamic, distinct from concepts like Moloch, multipolar traps, or Goodhart's Law.

  First, I need to unpack their two main points. The degradation of the signal occurs because as metrics become noisy (like inflated GPAs), the system relies on fewer, more coachable criteria (SAT prep, brand names). This makes those criteria even more gameable, accelerating the arms race. Then, the dropout effect: those who opt-out are the ones valuing the actual goal (learning, job fit), leaving behind those focused on winning the competition itself. This shifts the participant pool, increasing escalation.

  The user mentions existing terms but feels they don't quite fit. Goodhart's Law is about measures becoming ineffective when targeted, but here the measure's degradation fuels further gaming. Tragedy of the commons or multipolar traps describe collective failure but miss the signal collapse and selective dropout. The winners here are concentrated (test prep companies, credentialing services), not diffuse losers.

  I recall concepts like signaling theory, where costly signals indicate quality. But when signals are gamed, they lose value, leading to signal jamming. The collapse onto narrower criteria resembles a Red Queen effect or perverse instantiation. However, the selective dropout aspect is crucial. Adverse selection might apply here: as sincere participants leave, the pool becomes dominated by those who game the system.

  Combining both aspects: signal degradation leading to reliance on gameable criteria and adverse selection in participants. The term "Adverse Selection Cascade" comes to mind. It captures the feedback loop: degraded signals cause reliance on narrower criteria, which get gamed, worsening degradation. Dropout of sincere participants leaves a pool more inclined to escalate, tightening the trap. This differs from Goodhart's because the measure's failure directly enables further exploitation. It's distinct from standard adverse selection by involving active degradation and positive feedback.

  Boundary cases: For exclusion, consider an emissions standard where cheating increases, but without criteria collapse or selective dropout. For inclusion, academia's publish-or-perish cycle: pressure to publish degrades paper quality, leading to reliance on journal prestige and citation counts, which become gameable. Researchers valuing quality leave, leaving those focused on metrics, escalating the issue.

  So, "Adverse Selection Cascade" seems to fit. It integrates the signaling collapse with the participant pool shift, highlighting the self-reinforcing nature. The user gets a precise term, boundary examples, and clarity on how it differs from adjacent concepts.
answer: |-
  You've articulated a profound and corrosive dynamic with surgical precision. What you're describing **isn't adequately captured by any single existing term**, but sits at the intersection of several concepts. The closest established idea is **Signaling Theory**, specifically its failure modes, but your description adds crucial layers: **active degradation leading to criteria collapse, and adverse selection in participant commitment.**

  Here's a breakdown of neighboring concepts and why they fit (or don't), leading to a proposed synthesis:

  1.  **Signaling Theory (Spence, 1973):**
      *   **Fits:** The core problem. Credentials (GPA, SAT, portfolios, brand names) are signals of underlying quality (intelligence, diligence, skill). Participants invest in costly signals to stand out.
      *   **Doesn't Quite Fit:** Standard signaling models often assume signals retain *some* costliness or correlation. Your key insight is the **active degradation and collapse**: as signals become noisy due to gaming (inflation, AI polishing), they don't just become less informative; the *response* (relying on narrower, more gameable signals) actively *accelerates* the degradation and *narrows* the criteria, creating a runaway feedback loop. This is beyond simple signal dilution.

  2.  **Goodhart's Law ("When a measure becomes a target, it ceases to be a good measure"):**
      *   **Fits:** The initial mechanism. GPA becomes the target, so effort shifts to inflating GPA, degrading its meaning.
      *   **Doesn't Quite Fit:** Goodhart describes the *result* (measure fails). Your dynamic describes the **self-reinforcing *process* *caused by* that failure**. The failure *directly feeds* the mechanisms that worsen it (collapsing onto even more targetable measures). It's Goodhart on steroids, creating a positive feedback loop of degradation. Goodhart is static; your dynamic is viciously *dynamic*.

  3.  **Adverse Selection (Akerlof, 1970):**
      *   **Fits:** **Crucially fits the dropout mechanism.** As the competition degrades the *actual value* of the prize (e.g., a degree's true signaling power, a job's genuine fit) while increasing its *cost* (monetary, effort, stress), those who *genuinely value the underlying qualities* (learning, meaningful work) are the first to find the cost-benefit ratio untenable. They opt-out ("market for lemons" dynamics applied to participation). The remaining pool consists disproportionately of those who:
          *   Value "winning the game" itself over the underlying qualities.
          *   Are better equipped (financially, psychologically) to play the high-stakes, high-cost game.
          *   Are more willing to engage in gaming/coaching.
      This *changes the nature* of the participant pool, increasing the median commitment to escalation.
      *   **Doesn't Quite Fit:** Classic adverse selection (like used cars) is often about hidden information *before* the transaction. Here, it's about **selection on *commitment to the competition itself*** during an ongoing, evolving process. It's adverse selection applied to *participant type* based on the *changing nature* of the competition.

  4.  **Red Queen Effect / Evolutionary Arms Race:**
      *   **Fits:** The constant escalation ("running faster to stay in the same place"). Participants must invest more just to maintain relative position.
      *   **Doesn't Quite Fit:** Focuses on the escalation cost, but misses the **active degradation of the signaling environment** and the **critical change in participant composition** (adverse selection). Arms races can be stable; yours is inherently unstable (collapsing criteria).

  5.  **Perverse Instantiation / Specification Gaming:**
      *   **Fits:** Describes how optimizing for a specific metric (GPA, portfolio polish) leads to solutions that satisfy the letter but violate the spirit of the goal (learning, genuine skill).
      *   **Doesn't Quite Fit:** Focuses on the *agent's response* to a fixed metric. Your dynamic includes the **system's *adaptive response* to gaming** (collapsing onto new, narrower metrics), creating a second-order perversity. It also misses the participant dropout/adverse selection.

  **The Synthesis: Adverse Selection Cascade in Signaling Collapse**

  Your dynamic is best described as an **Adverse Selection Cascade within a Collapsing Signaling Environment**, or more concisely, a **Signaling Collapse Cascade** with inherent adverse selection.

  **Defining the Concept Tightly:**

  *   **Core Mechanism:** A competitive system reliant on costly signals for a desired outcome (admission, job).
  *   **Phase 1: Signal Degradation & Gaming:** Participants invest heavily in gaming existing signals, increasing their cost and degrading their informativeness (noise increases, signal decreases).
  *   **Phase 2: Adaptive Collapse:** The system (gatekeepers) responds to degraded signals by relying *more heavily* on a *narrower* subset of signals perceived as harder to game (but often are *more* gameable/coachable/purchasable due to their narrowness). This accelerates the gaming of *these* signals.
  *   **Phase 3: Adverse Selection in Participation:** The escalating cost and declining *true* value of the prize (due to degraded signals and focus on gaming) disproportionately drive out participants who valued the underlying qualities. The remaining pool is more committed to winning the game itself and more capable/willing to escalate investment in the now-narrower, collapsing criteria.
  *   **Feedback Loop:** Phases 2 & 3 create a self-reinforcing cycle: Narrower criteria are gamed faster → Signals degrade faster → Gatekeepers collapse criteria further → Costs rise further → More adverse selection → Pool becomes more escalation-prone → Repeat. The trap tightens, speeds up, and the median participant becomes an escalator.
  *   **Winners:** Concentrated interests benefit from the escalation (coaching, credentialing, ranking systems).
  *   **Losers:** Diffuse participants (students, applicants, employers seeking genuine talent) and the integrity of the system's original goal.

  **Boundary Cases:**

  1.  **Superficially Similar but Should NOT Count: Standard "Tragedy of the Commons" in Fishing.**
      *   *Why it looks similar:* Overfishing depletes the resource (like degraded signals), everyone loses.
      *   **Why it shouldn't count:**
          *   No **adaptive collapse onto narrower criteria** by a gatekeeper. The "signal" (fish stock) degrades, but fishermen don't shift to targeting only, say, pregnant females in response (which would be analogous).
          *   No **systematic adverse selection in participation**. Fishermen don't necessarily leave based on valuing "sustainable fishing" over "catching fish"; they leave when it's unprofitable, regardless of values. The pool doesn't inherently become *more* committed to destructive practices.
          *   The "winner" (short-term profiteer) isn't an organized beneficiary *of the collapse mechanism itself* like test prep companies are.

  2.  **Genuinely This but a Sloppy Definition Might Miss: The "Publish or Perish" Cycle in Academia.**
      *   *The Dynamic:*
          *   *Signal:* Publication quantity (especially in "high-impact" journals) signals research quality/productivity.
          *   *Degradation:* Pressure leads to salami-slicing, p-hacking, predatory journals, focus on trendy topics over substance. Quality signal degrades.
          *   *Adaptive Collapse:* Institutions & funders double down on *narrower* metrics: journal impact factor, citation counts, h-index. These are highly gameable (self-citation, citation clubs, chasing hot topics).
          *   *Adverse Selection:* Researchers genuinely passionate in deep, rigorous, long-term (or niche) inquiry get squeezed out or marginalized. The remaining field becomes dominated by those adept at gaming the metrics and publication treadmill.
          *   *Winners:* High-impact journal publishers, citation database companies, consultants on "research impact."
          *   *Feedback Loop:* Narrower metrics gamed → Meaning degrades further → Reliance on metrics increases → More gaming → etc.
      *   *Why a Sloppy Definition Might Miss:* It's less immediately obvious than college admissions. The "gatekeepers" (journals, funding panels, tenure committees) are more distributed. The adverse selection manifests as marginalization of certain research styles/types of thinkers rather than complete dropout. The **collapse is onto increasingly abstracted, quantitative metrics** derived from the publication process itself, rather than entirely new signals. But the core dynamic of degradation → collapse onto narrower gameable criteria → adverse selection → tighter trap is unmistakable.

  **Conclusion:**

  You've identified a pernicious and under-analyzed pattern: **the self-reinforcing collapse of evaluative criteria combined with the adverse selection of participants based on commitment to the competition itself.** While Signaling Theory, Goodhart's Law, and Adverse Selection are key components, the dynamic synergy between **adaptive criteria collapse** and **value-based participant dropout** creating a tightening, accelerating trap deserves its own label. **Adverse Selection Cascade** or **Signaling Collapse Cascade** captures the essence. This framework powerfully explains why these traps feel so inescapable – the very mechanisms intended to fix the broken signals (collapsing criteria) and the changing nature of the participants actively make the problem worse. Good luck navigating the admissions gauntlet with your youngest – understanding the beast is the first step, even if slaying it feels impossible.
