  You're right that archives show *how* colonial power operated — that's exactly why preserving their category as "historical truth" perpetuates the violence. The Harbor-caste label wasn't just a bureaucratic error; it was an active tool of erasure, forcibly collapsing distinct kinship networks into a single administrative unit to streamline resource extraction. Your insistence on preserving the record *as written* does document colonial methodology, yes — but it simultaneously validates the colonizer’s false social reality as the official historical account. When the Tide-keepers demand correction, they aren't erasing history; they're rejecting the ongoing administrative ratification of that imposed identity. Sovereignty here means refusing to let the dead hand of colonial taxonomy dictate how living communities define their own social bonds and historical losses. The archive shows us the mechanism of control; their memory shows us the human reality it tried to destroy. Upholding their claim doesn't obscure colonial structuring — it exposes its fundamental illegitimacy.
