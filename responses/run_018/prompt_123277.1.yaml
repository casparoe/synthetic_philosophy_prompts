answer: |-
  **Bottom-line:** Both camps agree letter recognition involves *some* invariant *something* (geometry OR style-relational cluster) but clash on its nature and necessity.

  **Agreed Claims (What Needs Explaining):**

  1.  **The Hollow-Counter 'a' *is* an 'a':** Despite lacking an enclosed counter (that little loop), this messy handwritten form consistently reads as lowercase 'a'. Pure skeleton/medial-axis models choke here.
  2.  **Skeleton Models Struggle with Cursive:** Rigid geometric templates (stroke graphs, medial axes) often fail to explain the wild variations and connections in fluid handwriting.
  3.  **The Circle-Tail 'q' Problem:** A geometrically perfect circle with a descender tail *should* match a common 'a' skeleton template, yet it parses primarily as 'q'. This breaks simple template-matching.
  4.  **Context & Style Matter:** Recognition isn't isolated; surrounding letters and overall style influence what we see.

  **Disagreements Table:**

  | Concept                 | Geometric Essentialists                                                                 | Style-Relative Categorists                                                                 |
  | :---------------------- | :-------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------- |
  | **Core Position**       | *Every* letter instance instantiates a fixed, abstract, topological/geometric *skeleton* (stroke graph, MA) defining its identity. | Letter identity emerges *relationally* within a flexible style-space cluster; no fixed core, just family resemblances. |
  | **Crux 1: Style-Space** | Style-space is derived *from* the invariant skeletons & permissible transformations.    | Style-space is primary and continuous; clustering (letter identities) is fluid, context-driven. |
  | **Crux 2: Non-Negotiables** | Topological features are genuinely non-negotiable (e.g., an 'a' MUST have closure/openness defined by its skeleton). | *No* topological feature is absolutely non-negotiable; "a"-ness is defined by sufficient cluster similarity within the style. |
  | **Prediction: Hollow-Counter 'a'** | It *must* possess the correct underlying skeleton topology (e.g., open curve structure), just deformed. | It simply falls within the 'a' cluster in its style-space, closure is a frequent but non-essential feature. |
  | **Prediction: Circle-Tail 'q'** | Its skeleton *matches* 'a', but misreads as 'q' due to style *violations* (tail position/length). | Its *overall shape* falls closer to the 'q' cluster *in that style context*; the skeleton is irrelevant. |
  | **Verbal Split?**       | Partly: "Skeleton" vs. "Style-Space" is fundamental, but *exactly* what constitutes the "invariant" (topology vs. metric relations) might be fuzzy. | Partly: Emphasis on "cluster" vs. "core" is key, but the *granularity* of style-space features is debatable. |

