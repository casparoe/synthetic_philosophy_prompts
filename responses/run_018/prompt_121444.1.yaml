prompt: |-
  hey — I'm an ML researcher and I spend most of my day fitting reward models from pairwise human preference data: a few dozen raters, each ranking a handful of model completions, and I need to turn that into one scalar reward function the policy can be optimized against. I keep getting told this is "literally a social choice problem" and that Arrow's theorem should worry me. I want to know whether that's true or whether it's philosophers playing dress-up.

  So: translate Arrow's theorem into the vocabulary I actually use — raters as noisy draws from a population, candidates as a fixed item set, a profile as a dataset, the social welfare function as a map from preference data to a global ranking or a reward model, unrestricted domain, Pareto, independence of irrelevant alternatives, non-dictatorship. Be honest: don't smuggle in my assumptions and call them translation. If the honest version of "IIA" is something like a sparsity/locality constraint on how the aggregator is allowed to depend on the data, say so; if "unrestricted domain" is really "we refuse to model the input distribution", say that instead of "no assumption on preferences".

  Then the residue report, which is the part I actually care about. Which bits have no counterpart on my side? I have a few guesses I want checked rather than flattered:

  - Arrow's setup has no ground truth. My whole vocabulary is built around raters being noisy measurements of an underlying reward. Is the theorem even about anything I'd recognize, once that's gone?
  - My raters carry intensity (Bradley–Terry scores, margins, how much they care) and Arrow's voters apparently don't. Does adding cardinality kill the result, or does it just move the impossibility somewhere else?
  - I've had it in my head — badly remembered, so correct me — that IIA basically forces the aggregator to be a kind of junta in the Boolean-functions sense: a function of the profile that only ever looks at one coordinate, with the rest of the proof being an ultrafilter argument in a hat. Is that a fair way to see it, or am I pattern-matching on the word "dictator"?

  Last thing. Tell me what would have to be true of my raters for the theorem to stop biting. I've seen "single-peaked preferences" floated as an escape route — translate that into my terms as literally as you can (raters all ranking by distance from their own ideal point in one shared embedding? the data lying near a low-dimensional structured model?) and then tell me whether assuming it is a real empirical claim about human raters or me stipulating my way out of an inconvenience.

  Don't give me a reading list; I can't follow it up anyway. End with a single line: \answer{one of target-framework-defect | arrow-framing-artifact | both | neither, then a colon and at most ten words of clarification}.
reasoning: |-
  Okay, the user is an ML researcher working on reward modeling from pairwise human preferences. They're asking about Arrow's theorem and whether it's relevant to their work. Let me start by understanding their main concerns.

  First, they want a translation of Arrow's theorem into their ML vocabulary. They mentioned raters as noisy draws from a population, candidates as fixed items, etc. They want honesty in the translation—no smuggling in assumptions. For example, unrestricted domain means they're not modeling the input distribution, not just "no assumptions on preferences." Independence of Irrelevant Alternatives (IIA) might be about locality in how the aggregator uses data. Need to break down each condition precisely.

  Next, the residue report. They have specific points. First, Arrow's theorem assumes no ground truth, but they see raters as noisy measurements. That's a key difference. Arrow is about aggregating preferences without assuming any true ranking, while their approach assumes an underlying reward function. So Arrow's framework might not directly apply because of that difference.

  Second, their raters use cardinal scores (like Bradley-Terry), while Arrow's uses ordinal preferences. Adding intensity might bypass the impossibility, but there's still the Gibbard-Satterthwaite theorem which deals with strategic voting. However, if they're not dealing with incentives, maybe that's less relevant. Point is, cardinal data changes things, possibly avoiding Arrow's specific impossibility.

  Third, they recall IIA forcing the aggregator to be a junta. In Arrow, IIA means the preference between two alternatives shouldn't depend on others. The proof does involve showing that if IIA holds, the function must be dictatorial. So their understanding is correct here: IIA with other conditions leads to a dictator, meaning only one rater's input matters.

  They also ask what conditions on raters would avoid the theorem. Single-peaked preferences are mentioned, which in ML terms might mean raters agree on a latent dimension and prefer points closer to their peak. But is this realistic for human raters? Probably not, as humans have complex preferences that aren't unidimensional. Assuming it might be a convenience rather than empirical.

  Now, putting it all together. The main disconnect is the lack of ground truth in Arrow versus their noisy measurement model. Since they assume an underlying reward, the aggregation is more about estimation than preference aggregation. Cardinal data also helps avoid the impossibility. However, the locality constraint from IIA might still be problematic if they want sparsity, but their methods likely use all data. So the theorem's bite is blunted in their framework.

  Final answer: Arrow's impossibility is an artifact in their context because of the ground truth assumption and cardinal data. They should focus on statistical estimation rather than social choice. The residue report points to arrow-framing-artifact because their setup differs fundamentally.
answer: |-
  Here's the brutal translation and residue report:

  **Arrow's Theorem in Your Terms:**
  *   **Raters:** Agents expressing deterministic, *ordinal* preferences (only strict rankings, no scores or margins). No noise model; each rater's ordering is taken as their exact truth.
  *   **Candidates:** Fixed set of completions/items to be ranked.
  *   **Profile/Dataset:** A complete collection of these strict ordinal rankings from all raters for *all* candidates.
  *   **Social Welfare Function/Reward Model:** A deterministic function mapping any possible profile (any set of rater rankings) to a single, complete, transitive global ranking of all candidates. This is your "scalar reward function" *implicitly* defining the order rewards induce.
  *   **Unrestricted Domain:** You **refuse to model the input distribution or constrain possible preferences**. *Any* logically possible set of strict rankings across raters is a valid input dataset.
  *   **Pareto Efficiency:** If *every single rater* ranks candidate A strictly above candidate B, then the global ranking *must* rank A above B.
  *   **Independence of Irrelevant Alternatives (IIA):** The global ranking between *any two specific candidates A and B* **depends *only* on the pairwise comparisons between A and B in the individual rater rankings.** How raters ranked any *other* candidate C, D, E, etc., *cannot* influence whether A > B or B > A globally. This is a **strict locality/sparsity constraint on the aggregation logic**.
  *   **Non-Dictatorship:** There is no *single rater* whose ranking is always copied exactly as the global ranking, regardless of what other raters say.

  **Residue Report: Your Guesses Checked**
  1.  **Ground Truth Missing (✓ Correct & Critical):** Arrow's theorem assumes *no underlying true reward*; preferences are taken at face value as the fundamental data. Your entire paradigm treats rater preferences as *noisy signals* of a latent ground-truth reward. **This is the deepest disconnect.** Arrow is about aggregating *conflicting subjective values*, while you are *statistically estimating an objective latent variable*. Arrow's impossibility vanishes if a "true" ranking exists and raters are noisy measurers of it.
  2.  **Cardinality Matters (✓ Correct & Mitigating):** Arrow requires purely *ordinal* preferences (only order matters). Your use of cardinal data (Bradley-Terry scores, margins) fundamentally changes the game. Cardinal aggregation methods (like BT itself, or various averaging schemes) *can* satisfy Pareto, Non-Dictatorship, and sensible versions of "locality" without impossibility. Cardinal data provides *intensity* information Arrow ignores. **Adding cardinality breaks Arrow's specific impossibility.**
  3.  **IIA ≈ Junta/Ultrafilter (✓ Essentially Correct):** IIA forces the global preference between A and B to be a function *only* of the set of raters who prefer A>B vs B>A. Combined with Unrestricted Domain and Pareto, the proof shows this function *must* be equivalent to just asking one specific rater (the dictator) for their A vs B preference, ignoring all others. The ultrafilter structure arises naturally. **Yes, IIA + UD + Pareto forces a "dictator-junta" on every pair.**

  **Escaping the Bite: What Would It Take?**
  *   **Single-Peaked Preferences (Your Translation ✓):** All raters and the latent reward share a *single, agreed-upon, one-dimensional embedding* of the candidates. Each rater has an "ideal point" on this line. Their ranking of candidates *must* strictly decrease as candidates get farther from their ideal point (left *or* right). **In your terms:** The noisy rater data *must* be consistent with all preferences being generated by unimodal distributions over a *single* latent quality dimension. Raters only disagree on *where* the peak is on that line, not on the line's existence or the unimodal shape.
  *   **Empirically Plausible?** **Unlikely for complex human judgments.** Human preferences over text completions (quality, truthfulness, helpfulness, harmlessness, style, etc.) are intrinsically **multi-dimensional** and context-dependent. Assuming a *single* dimension and strict unimodality is a **strong, likely false, structural assumption** made purely to avoid the impossibility theorem, not because it reflects how humans evaluate complex outputs. It's stipulating away the complexity.

  **\answer{arrow-framing-artifact: Your noisy-ground-truth/cardinal paradigm breaks Arrow's core assumptions.}**
