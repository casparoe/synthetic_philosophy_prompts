  The user's deep need here is probably to ensure students grasp the nuanced relationship between sympathy and the spectator, avoiding common misconceptions. They might also want to foster critical thinking about moral psychology, relevant to political economy contexts. The challenge is to make abstract concepts concrete within a tight 90-minute session.

  Starting with the explanatory arc: The sequence must begin with sympathy as propriety judgment. Why? Because students might confuse sympathy with empathy. Establishing sympathy as evaluating the cause of emotions (propriety) is foundational. Without this, the impartial spectator, which builds on that judgment, won't make sense. Next, the spectator emerges from an iterative role-swapping process, not internalized others or utilitarian aggregation. This order is crucial because the spectator relies on the initial sympathetic judgment to function.

  For the example, a simple grief scenario is insufficient because it doesn't show the judgment aspect. A case of disproportionate anger is better—like someone enraged over a minor spill. This illustrates first-order sympathy: observers assess if the anger fits the cause. Then, when the angry person imagines the impartial spectator, they engage in multiple perspective shifts, calibrating their emotion. This example must lack bystanders to avoid confusion with actual audience opinions.

  Misconceptions are critical. Students might equate sympathy with empathy early on. This needs addressing right when defining sympathy. Treating the spectator as a literal internalized person? Defuse that when introducing the spectator, emphasizing it's a process, not an entity. Utilitarian aggregation? Clarify during the iterative process explanation. Normative endorsement? Stress during the anger example that Smith describes mechanisms, not prescriptions.

  The end question should test understanding of the structural distinction. Asking why the angry person's self-assessment differs from others' initial sympathy checks if they see the shift from first to second-order judgment. 

  Omissions are necessary. Biographical details aren't essential here. Comparative references to Hume or others could derail the focus. The taxonomy of passions is too detailed; sticking to the anger case keeps it manageable. The session's dependency structure requires focusing solely on sympathy and spectator mechanics to build the core concept without distractions.

  I need to ensure each part connects: starting with sympathy as judgment, then building the spectator through iterative role-swapping, using the anger example throughout. Addressing misconceptions at specific points prevents confusion. The end question should reveal if they grasp the hierarchy between sympathy and spectator. Omitting extraneous details keeps the session focused and effective.
answer: |-
  Here's a planned explanatory arc for your 90-minute session, focusing on structural dependencies, a core example, misconception management, assessment, and deliberate omissions:

  **Explanatory Arc & Dependencies (Order Matters):**

  1.  **Start with "Sympathy" as Propriety Judgment Relative to Cause:** *Why first?* Students know "sympathy" colloquially as shared feeling (empathy/contagion). Must immediately disrupt this. Introduce sympathy not primarily as *feeling what others feel*, but as *judging the propriety/suitableness* of their emotions *relative to the cause*.
      *   *Dependency:* This is the foundational mechanism. Without establishing sympathy as a *judgment* (approving/disapproving based on the cause/object), the subsequent move to the spectator as *evaluator* makes no sense. It provides the raw material (propriety judgments) the spectator works with.

  2.  **Introduce Sympathy's Social Calibration Function:** Explain how this judgment operates socially. We observe someone's emotion, assess its propriety relative to the situation *as we understand it*, and then either *resonate* (if approved) or *fail to resonate* (if disapproved). This approval/disapproval acts as feedback, calibrating the original agent's emotion ("I see you don't feel my anger is justified, so maybe I should moderate it").
      *   *Dependency:* This shows sympathy as the *first-order mechanism* of emotional regulation. It establishes the social context and the initial feedback loop necessary for the spectator to emerge as a *higher-order* regulator. The agent learns to anticipate these judgments.

  3.  **Introduce the Impartial Spectator as an Imagined Exchange of Situations:** *Why now?* Only after establishing sympathy as propriety judgment can we show its insufficiency. The actual observers are partial, biased, or absent. The agent needs a *standard*. Introduce the impartial spectator *not* as an internalized other, but as the *result of the process*: "changing places in fancy" with an imagined impartial person.
      *   *Crucial Dependency:* The spectator *depends entirely* on the faculty of sympathy (propriety judgment). The agent uses sympathy to imagine *how an impartial person would judge their emotion* by imaginatively swapping places and applying the *same* propriety judgment standard. This is not internalizing a specific person; it's applying the *sympathetic mechanism reflexively* to an imagined, impartial viewpoint.

  4.  **Emphasize the Iterative Nature of "Changing Places":** *Why essential?* Explain this isn't a one-shot swap. To achieve impartiality, the agent must repeatedly: a) Imagine how they would feel *in the other person's situation* (using sympathy), b) Imagine how an impartial observer would judge *their own (the agent's) reaction* given the full context (again using sympathy). This iterative, multi-perspective process *constitutes* the impartial spectator's judgment.
      *   *Dependency:* This step explicitly prevents the misconceptions of the spectator as a static internalized person or a utilitarian aggregator. It shows the spectator *is* the *process* of striving for impartiality using the tool of sympathy (propriety judgment) across multiple imagined viewpoints. It builds directly on the definition of sympathy established in Step 1.

  **The Core Carrying Example: Disproportionate Anger**

  *   **Scenario:** Person A accidentally bumps into Person B at a crowded event, causing B to spill a small amount of cheap coffee on their shirt. Person B flies into a furious rage, shouting insults and threatening A.
  *   **What it MUST Include:**
      *   A clear **cause** (minor accident, trivial consequence).
      *   A **disproportionate emotional reaction** (furious rage).
      *   **Actual observers** (other attendees) displaying visible disapproval/discomfort (lack of sympathy resonance).
      *   Person B's **later reflection** (away from the crowd and heat of the moment), engaging in "changing places": imagining being the impartial observer watching *someone else* react with fury to a minor spill, and realizing how improper it looks.
  *   **What it MUST Lack:**
      *   **Significant actual harm** (avoids complicating with justice/utility).
      *   **A pre-existing relationship or deep personal stake** (keeps focus on propriety relative to cause).
      *   **Bystander intervention/strong opinions** (avoids conflating spectator with actual audience aggregation).
  *   **Why it Works:**
      *   **First-Order Sympathy:** Observers (and later, B) easily judge the *impropriety* of the rage relative to the minor cause. Demonstrates sympathy as judgment, not contagion (nobody catches the rage).
      *   **Calibration Failure:** B's rage is so disproportionate, immediate social calibration via observers' disapproval fails *in the moment*.
      *   **Second-Order Spectator:** B's later reflection *requires* the imagined exchange. B uses sympathy to imagine being an impartial observer seeing *this event* happen to *others*. This reveals the impropriety starkly. The spectator *is* this process of striving to see oneself impartially.
      *   **Why Simple Grief Fails:** Shared grief often *does* involve resonance/contagion, obscuring the judgment aspect. It's harder to clearly see "impropriety" in deep grief even if "disproportionate" by some measure, muddying the core mechanism.

  **Mapping & Defusing Misconceptions:**

  1.  **Conflation of Sympathy with Modern Empathy (feeling-with):**
      *   **When:** *Immediately upon introducing "Sympathy" (Step 1).*
      *   **Defusion:** Explicitly state: "For Smith, sympathy is *primarily an act of judgment* about the *suitableness* of an emotion to its cause. While it *can* lead to shared feeling (resonance), this resonance *depends* on prior approval of the emotion's propriety. It's not automatic contagion." Use the *disapproval* in the anger example to illustrate judgment *without* shared feeling.

  2.  **Treating the Spectator as a Literal Internalized Other:**
      *   **When:** *Upon introducing the Impartial Spectator (Step 3).*
      *   **Defusion:** Emphasize: "The spectator is *not* a little person in your head, nor is it simply internalizing your mom's voice. It is the *product of an imaginative exercise*: the stance you achieve *by repeatedly* 'changing places in fancy' to strive for an unbiased view of your own conduct." Stress it's the *result of the process* defined in Step 4.

  3.  **Reading the Spectator as Utilitarian Aggregation:**
      *   **When:** *When explaining the iterative "changing places" (Step 4).*
      *   **Defusion:** Contrast explicitly: "Smith's spectator isn't tallying up everyone's opinions or calculating net happiness. It's about achieving an *impartial perspective* on the *propriety* of emotions/actions relative to their specific causes. It's qualitative judgment, not quantitative aggregation. The imagined impartial observer cares about *fittingness*, not maximizing utility." Point out the anger example doesn't involve counting opinions, just striving for an objective view of propriety.

  4.  **Assuming Smith Normatively Endorses Every Reaction Described:**
      *   **When:** *Throughout, but crucially when discussing the anger example and the calibration process.*
      *   **Defusion:** State clearly: "Smith is describing psychological and social *mechanisms*, not necessarily endorsing every outcome. He shows *how* sympathy and the spectator *work*, including how they can fail (like B's initial rage). His goal is to explain the *source* of moral judgment, not to dictate every specific judgment." Highlight that the *process* (sympathetic judgment, striving for impartiality) is what Smith finds foundational, not the specific anger reaction.

  **End-of-Session Grasp Check Question:**

  > **"In Smith's model, when Person B later reflects on their disproportionate anger using the impartial spectator, *why* is the judgment they reach using the spectator potentially *different* from the initial lack of sympathy resonance they received from the actual crowd at the event? What distinct 'work' is the spectator doing?"**

  *   **Reveals Understanding:** A strong answer will distinguish the *first-order* social calibration via actual observers (whose sympathy/judgment might be biased, fleeting, or focused only on B's visible rage) from the *second-order* process of the spectator, where B, through imaginative role-swapping, strives for a truly impartial view *considering both the cause (minor spill) and their own reaction*, leading to a more stable and objective self-assessment of impropriety. It tests if they see the spectator as a distinct, higher-order evaluative stance built *using* sympathy, not just more social feedback.

  **Deliberate Omissions & Justification:**

  1.  **Biographical Context (Smith's life, writing TMS/WN):**
      *   **Omit:** Yes. Deep dive into biography not needed.
      *   **Justification:** Focus is on the *conceptual structure* of sympathy/spectator. Biographical details don't illuminate the dependency between the concepts or the mechanisms at play within TMS itself. Time is better spent on the philosophy.

  2.  **Full Taxonomy of Passions:**
      *   **Omit:** Absolutely. Don't list social/unsocial, selfish passions, etc.
      *   **Justification:** The core mechanism (sympathy as propriety judgment relative to cause, spectator via imaginative exchange) applies universally across passions for Smith. Using one clear example (anger) is sufficient to illustrate the *structure*. Introducing the taxonomy adds unnecessary complexity without clarifying the core dependency arc.

  3.  **Comparative References (Hume, Shaftesbury, Stoics):**
      *   **Omit:** Yes. Avoid direct comparisons.
      *   **Justification:** While intellectually enriching, comparisons introduce foreign concepts (e.g., Hume's sympathy-as-contagion, utility) that actively *fuel* the very misconceptions (empathy conflation, utilitarianism) you are trying to dispel. Stay laser-focused on Smith's *internal* structure within TMS. Understanding Smith's unique model is the prerequisite for *later* meaningful comparison.

  4.  **Detailed Exegesis of Specific TMS Passages:**
      *   **Omit:** Mostly. Use key quotes sparingly for definitional anchors (e.g., "change places in fancy"), but avoid intricate textual analysis.
      *   **Justification:** The goal is conceptual understanding, not textual mastery at this stage. Over-reliance on dense 18th-century prose can obscure the logical structure you're building. Prioritize clear explanation using the central example.

  This arc prioritizes building Smith's model step-by-step, grounding it in a potent example, actively combating predictable misunderstandings, assessing deep comprehension, and ruthlessly cutting distractions to maximize clarity on the core concepts within the time constraint. Good luck!
