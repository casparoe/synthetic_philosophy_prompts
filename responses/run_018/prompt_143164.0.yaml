prompt: |-
  I am leading a single ninety-minute session for graduate students in political economy who know Adam Smith only as the author of The Wealth of Nations. I want them to understand the relationship between sympathy and the impartial spectator in Smith's moral philosophy, specifically how sympathy functions as a mechanism of emotional calibration and propriety-judgment rather than mere emotional contagion, and how the impartial spectator emerges as a second-order evaluative stance built on an imagined exchange of situations rather than as an internalized audience or utilitarian calculator.

  Plan the explanatory arc, not the lecture itself. First, state the order in which the components must be introduced and why each depends on the prior: in particular, why sympathy must be established as a judgment of propriety relative to cause before the spectator can appear, and why the spectator's judgment must be shown to depend on an iterative "changing places" rather than on aggregating actual observers. Second, identify the single carrying example or case study that should bear the entire explanation—something concrete that illustrates both first-order sympathetic calibration and second-order spectator intervention—and specify what the example must include and what it must lack (for instance, why a simple shared-grief scenario is insufficient and why a case involving disproportionate anger is preferable). Third, map the misconceptions these students are likely to bring or form: I anticipate they will conflate sympathy with modern empathy, treat the spectator as a literal other person inside the mind, read the spectator as performing a utilitarian aggregation of preferences, and assume Smith normatively endorses every emotional reaction he describes. For each misconception, specify the exact point in the sequence where it should be anticipated and defused. Fourth, propose one question I can ask at the end that will reveal whether they have grasped the structural distinction between first-order sympathy and second-order spectator judgment, rather than merely repeating the vocabulary. Fifth, explicitly state what should be left out at this level—whether biographical context, the full taxonomy of passions, or comparative references to Hume and Shaftesbury—and justify each omission in terms of the session's dependency structure. Please provide your response in American English.
