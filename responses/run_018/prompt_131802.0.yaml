answer: |-
  The described practice—disqualifying critics based on their analogous misconduct—presupposes a **Moral Standing Theory of Blame**. This theory holds that the legitimacy of blaming another depends not just on the *accuracy of the accusation* and *the wrongness of the act*, but crucially on the *moral authority or standing of the blamer*. Here's a reconstruction of the implicit theory:

  ### Core Philosophical Presuppositions
  1. **Standing as a Prerequisite for Blame**: Blame is not merely a factual assertion but a *normative performance*. To perform this act legitimately, the blamer must occupy a position of moral credibility. Analogous misconduct undermines this standing by demonstrating inconsistency between the blamer's actions and their moral judgment.
  2. **Hypocrisy as Standing-Vitiating**: Hypocrisy (condemning in others what one excuses in oneself) is a moral failing that:
     - **Corrodes Moral Authority**: It reveals the blamer's commitment to norms as instrumental or self-serving.
     - **Violates Communal Fairness**: It unfairly demands of others what the blamer refuses to demand of themselves, undermining the reciprocity essential to communal moral discourse.
  3. **Blame as Relational**: Moral standing is relational and contextual. An ethics board member or legislator acts as a *representative of communal norms*; personal violation of those norms breaches the trust required for this role.

  ### What the Practice Strictly Requires vs. What Accompanies It
  - **Strict Requirement**:  
    The practice requires that **moral standing is necessary for the *legitimacy* of blaming or adjudicating**, not for the *truth* of the accusation. It disqualifies the blamer based on lost authority, *not* because the accused is innocent.
    
  - **Mere Accompaniments**:  
    - **Pragmatic concerns** (e.g., reduced credibility, public perception) often accompany the practice but are not its core. The standing theory is *moral*, not merely instrumental.  
    - **Punishing hypocrisy** is secondary; the focus is on preserving the integrity of blame as a normative act.  
    - **Recusal for conflicts of interest** (e.g., financial ties) is distinct; standing is forfeited by moral inconsistency, not potential bias.

  ### Hypocrisy: Vitiating Blame or Merely Undermining Credibility?
  Defenders of the practice *can* retreat to pragmatic worries (e.g., "a hypocrite won’t persuade anyone"), but the **core logic is intrinsic**: hypocrisy invalidates the blamer’s *right* to blame, not just their effectiveness. The objection—"You did it too!"—functions as a *moral counterargument*, not just a PR tactic. It implies: *"Your act of blaming is itself morally defective, regardless of the truth of your claim."*

  ### Consistency with Legal "Impartiality"
  The practice **contradicts legal impartiality** at a philosophical level:
  - **Legal System**: Rejects "unclean hands" for adjudicators/prosecutors because:  
    - Charges stand or fall on *evidence and law*, not the prosecutor’s virtue.  
    - The law is an *impersonal system*; its validity is detached from individual enforcers.  
    - "Standing" in law is a procedural doctrine (e.g., injury-in-fact), not a moral one.  
  - **Moral Standing Practice**: Smuggles in a **coherence condition**—blame is legitimate *only if* the blamer is free of the same fault. Jurisprudence explicitly denies this, treating the message and messenger as separable.  

  This creates tension: the moral-standing view implies that blame derives legitimacy from the blamer’s integrity, while the legal view treats blame (prosecution) as valid based on objective criteria alone.

  ### Could Society Abolish the Hypocrisy Objection?
  A society that retains **legal impartiality while abolishing the hypocrisy objection in ethics/politics** would be **politically different but not conceptually incoherent**.  
  - **Conceptual Viability**:  
    - One could consistently hold that *legal* blame requires impartiality (prioritizing factual truth), while *moral/political* blame requires standing (prioritizing relational integrity).  
    - Different spheres (law vs. communal ethics) can operate under distinct norms without logical contradiction.  
  - **Political Implications**:  
    - Abolishing the hypocrisy objection might:  
      - **Strengthen accountability**: Focus scrutiny solely on the accused’s actions.  
      - **Undermine trust**: Erode perceived legitimacy of ethics bodies or legislators, as their authority relies on perceived moral consistency.  
    - Conversely, retaining the objection might:  
      - **Uphold normative coherence** in communal ethics.  
      - **Enable evasion**: Corrupt actors could weaponize hypocrisy to deflect valid criticism.  

  ### Conclusion
  The practice rests on a **Moral Standing Theory** that treats blame as a normatively performative act requiring the blamer’s integrity. This clashes with law’s commitment to impersonal impartiality but reflects a deep intuition about moral reciprocity. Abandoning this practice in ethics/politics wouldn’t fracture logic but would represent a shift toward legalistic detachment in domains traditionally governed by personal virtue and relational authority. The tension persists because law prioritizes *outcomes* (guilt/innocence), while moral-standing ethics prioritizes *process* (the blamer’s role in sustaining communal norms).
