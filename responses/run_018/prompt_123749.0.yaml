answer: |-
  This hybrid arrangement reveals a sophisticated conception of democratic legitimacy and social values that **cannot be fully reconciled with liberal-pluralist preference aggregation** and instead **aligns more closely with Deweyan experimentalism**, though it faces internal tensions regarding institutional closure. Here's a breakdown:

  ### **Conceptions of Legitimacy & Social Values**
  1. **Deweyan Collective Inquiry as Core Premise**:  
     - The iterative cycle (proposal → pilot → evaluation → revision) treats social values and policy solutions as **provisional hypotheses** to be tested, not fixed preferences. Participants as "co-inquirers" engage in joint knowledge production.  
     - **Legitimacy stems from the learning process itself**: Outcomes are legitimate because they emerge from publicly scrutinized experiments, not because they mirror pre-existing preferences.  
     - *Contrast with liberal-pluralism*: Liberal models view legitimacy as deriving from accurate preference aggregation. Here, preferences are transformed through inquiry (e.g., pilots may reveal unforeseen trade-offs), making aggregation insufficient.

  2. **Hybrid Authority Structure**:  
     - **Experimental phase**: Epistemic authority resides in collective learning.  
     - **Binding budget**: Legal authority reverts to conventional representative institutions (e.g., city councils).  
     - This dualism implies that while values are *discovered* experimentally, final decisions require non-experimental, formal-democratic ratification for stability and accountability.

  ### **Internal Consistency: The Closure Problem**
  - **Tension**: The binding budget halts experimentation, contradicting the open-ended Deweyan ideal.  
  - **Resolution via Pragmatic Compromise**:  
    - Experimental legitimacy is **procedurally bounded**—e.g., pilots occur within predefined cycles, and evaluations inform the *next* budget. Closure enables implementation while preserving long-term adaptability.  
    - It tacitly accepts **non-experimental authority sources**: Representative bodies provide the constitutional framework permitting experimentation, reconciling innovation with legal certainty.

  ### **Theoretical Substitution: Consequences**
  If replacing experimentalism with **aggregative** or **purely deliberative** models:

  | **Aspect**               | **Aggregative Model**                                     | **Deliberative Model**                                  |
  |--------------------------|-----------------------------------------------------------|---------------------------------------------------------|
  | **Budget Cycle**         | Single vote; no iterative pilots. Multi-year projects favored. | Fixed deliberation phase; no iterative testing post-decision. |
  | **Evaluation Metrics**   | Satisfaction surveys; cost-benefit efficiency.            | Discourse quality; consensus metrics.                   |
  | **Pilot Projects**       | At most, preference-sampling tools; discontinued if unpopular. | Symbolic gestures; no formal role in knowledge-building. |
  | **Participant Role**     | Clients expressing demands.                               | Debate partners refining arguments.                     |
  | **Outcome Flexibility**  | Low: Binding decisions reflect snapshot of preferences.   | Medium: Revisions require new deliberation.             |

  ### **Key Implications**
  - **Experimentalism’s Necessity**: The hybrid model *requires* Deweyan epistemology. Liberal-pluralism reduces pilots to preference-revealing mechanisms, negating the "co-inquiry" ethos.  
  - **Authority Dualism**: Binding closure presupposes a non-experimental foundation (e.g., parliamentary sovereignty), but experimental legitimacy enhances democratic depth within those bounds.  
  - **Practical Coherence**: While theoretically imperfect, the model pragmatically balances innovation ("trial-and-error") and stability ("decision-forcing"). Its consistency relies on viewing the experimental phase as *constitutive* of legitimacy, with closure as a necessary institutional artifact.

  ### **Conclusion**
  This arrangement presupposes **democracy as a learning system** where values evolve through publicly validated experience. It challenges liberal-pluralism by treating preferences as malleable outcomes of inquiry, not inputs. The binding budget reflects a concession to realist governance constraints but undermines pure experimentalism—revealing that such hybrids ultimately rest on **plural legitimacy sources**: epistemic (from inquiry) and legal-institutional (from formal authority). Without the Deweyan commitment, the practice’s core innovation—transformative learning through iteration—collapses into technocratic consultation or static deliberation.
