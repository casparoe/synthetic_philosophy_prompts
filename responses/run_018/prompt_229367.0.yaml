answer: |-
  Here's a breakdown of the different precise claims embedded in "peoples have the right to self-determination," ranging from uncontroversial to highly contentious, along with their plausibility and implications for unilateral secession:

  **Readings:**

  1.  **The Right to Internal Autonomy:** This claims that distinct peoples within a state have the right to meaningful self-government within the existing constitutional framework. This includes control over local affairs like culture, education, language, and certain economic policies, while respecting the state's overall sovereignty and territorial integrity.
  2.  **The Right Against Colonial Domination:** This asserts that peoples under foreign colonial rule or alien subjugation have an unequivocal right to independence. This is the core meaning established in the UN Charter (Article 1(2), Article 55) and solidified through decolonization. It applies to classic overseas colonies and situations of foreign military occupation.
  3.  **The Right to Democratic Participation:** This claims that "peoples" must be able to freely participate in the democratic governance of the state they belong to, without discrimination. Denial of this participation, especially based on their distinct identity, can constitute a violation of their internal self-determination right.
  4.  **The Right to Seek Independence Negotiated Consensually:** This claims that a people has the right to *express* a desire for independence and to *negotiate* that outcome with the central state. This is often seen as an extension of the right to internal autonomy and democratic participation when those are deemed insufficient. It implies a process, not a unilateral act.
  5.  **The Remedial Right to Secession:** This claims that a people has the right to unilaterally declare independence *only* as a last resort remedy in response to severe, persistent, and unaddressed injustices. These typically include gross human rights violations, systematic discrimination, or the complete denial of meaningful internal self-determination and democratic rights by the central state.
  6.  **The Primary Right to Secede (Unconditional):** This claims that any group defining itself as a "people" has an inherent, primary right to unilaterally declare independence and form its own state whenever a majority within that group desires it, regardless of the existing state's constitution, the views of minorities within the territory, or the absence of prior injustice. Legitimacy stems solely from majority will within the group.
  7.  **The Right to External Self-Determination as a Primary Norm:** This claims that external self-determination (independence) is the default and preferred expression of self-determination for *any* distinct people, not just a remedy. It sees independent statehood as the natural and rightful goal for peoples, minimizing the normative weight of existing state sovereignty and territorial integrity.

  **Verdicts:**

  1.  **Internal Autonomy:** **Defensible.** Widely accepted in international law (ICCPR/ICESCR Article 1), state practice (devolution, federalism), and political theory. A core aspect of modern self-determination.
  2.  **Against Colonial Domination:** **Defensible.** The strongest, clearest, and most universally accepted application of the right to *external* self-determination under international law.
  3.  **Democratic Participation:** **Defensible.** A fundamental aspect of internal self-determination and human rights law (ICCPR Article 25). Denial can trigger broader discussions about rights violations.
  4.  **Seek Negotiated Independence:** **Defensible (but context-dependent).** While not an absolute *legal* right, it's a strong political and normative claim rooted in democratic principles and internal self-determination. Seen as the legitimate *path* towards potential independence in peaceful contexts (e.g., Scotland, Quebec referendums agreed by the central state).
  5.  **Remedial Right to Secession:** **Defensible (under strict conditions).** Gaining increasing recognition in international law doctrine and practice (e.g., Kosovo ICJ Advisory Opinion *implicitly*, Bangladesh precedent) as an exceptional remedy for extreme circumstances. Requires a very high threshold of oppression.
  6.  **Primary Right to Secede (Unconditional):** **False (as a legal right and widely disputed normatively).** Rejected by the vast majority of states (fear of fragmentation), international law (emphasizes territorial integrity), and the UN Charter system. Contradicted by the Quebec Secession Reference (Canadian Supreme Court). Seen as destabilizing.
  7.  **External as Primary Norm:** **False.** Directly contradicts the established international legal framework which prioritizes territorial integrity and views external self-determination as exceptional (colonial/remedial). Not supported by state practice or major international instruments.

  **What Survives: Implications for Unilateral Secession**

  *   **Readings Supporting Unilateral Secession (potentially):**
      *   **Remedial Right to Secession (5):** This is the *only* widely defensible reading that could potentially justify *unilateral* secession. Crucially, it requires meeting an extremely high threshold: proof of severe, persistent, and unaddressed oppression (e.g., widespread human rights abuses, systematic cultural eradication, complete denial of political rights). Merely disagreeing with central government policies, cultural differences, or even a democratic vote for independence *within the group* is insufficient. Your housemate would need to demonstrate that Catalonia suffers under conditions akin to extreme persecution to invoke this right unilaterally. International recognition under this right is rare and highly contested (e.g., Kosovo remains disputed).

  *   **Readings Supporting Weaker Claims (NOT Unilateral Secession):**
      *   **Internal Autonomy (1):** Supports claims for greater devolution, federalism, or recognition of national identity *within* Spain. Does not support secession.
      *   **Against Colonial Domination (2):** Catalonia is not a colony; this does not apply.
      *   **Democratic Participation (3):** Supports claims for ensuring Catalans fully participate in Spanish democracy and that their distinct voice is heard and respected. If violated, it strengthens arguments for internal autonomy or negotiation, but not *unilateral* secession by itself.
      *   **Seek Negotiated Independence (4):** Supports Catalonia's right to *ask* for independence and Spain's obligation to *negotiate in good faith* if a clear democratic demand exists (as per Quebec Reference principles). It imposes a process of dialogue and mutual agreement, potentially leading to independence *with consent*, not a unilateral act. Spain's refusal to allow a referendum violates this normative (though not absolute legal) right to seek negotiation.
      *   **Primary Right (6) & External as Primary (7):** These are not defensible claims and therefore cannot justify any action, including secession.

  **Conclusion:** The slogan "peoples have the right to self-determination" encompasses a spectrum of meanings. Only the **Remedial Right to Secession**, under conditions of extreme and unaddressed oppression, offers a plausible (though legally contested and exceptionally high-bar) justification for *unilateral* secession. All other defensible readings point towards rights to internal autonomy, democratic participation, and the right to *seek negotiated* solutions (including potential independence agreed with the central state). For Catalonia (or Scotland/Quebec in normal circumstances), your housemate's slogan primarily supports claims for enhanced self-government, respect, and a right to have their independence aspirations heard and negotiated seriously, not a unilateral right to declare independence. The slogan does significant work in establishing these crucial claims, but it falls far short of doing "all the work" needed to justify breaking up a state without consent or extreme cause.
