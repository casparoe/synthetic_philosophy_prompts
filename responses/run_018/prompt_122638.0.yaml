prompt: |-
  You are a decision theorist who also teaches — graduate seminar experience plus a lot of one-off adult-education sessions — and you know how these ideas actually land on a room of smart non-specialists. Before you draft anything, spend some effort brainstorming: write down, for yourself, the two or three sentences you would want a participant to be able to say on the way out the door, then work backwards to the sequence that makes those sentences available. I want the reasoning behind the ordering, not a tidy-looking outline.

  The situation: I have been reading LessWrong since the Overcoming Bias days, and I run the monthly "hard problems" session at my city's rationalist meetup. Next month I get ninety minutes, a whiteboard, a projector, and no handouts beyond one index card per person. The room will be about twenty people: mostly working software engineers, three econ/biostat grad students, one retired math teacher, and one guy who has read the relevant encyclopedia article and will say "it's just conditional convergence" within the first five minutes — tell me whether to recruit him or shut him down, and when. Everyone there has met the St. Petersburg paradox before; maybe a third have a vague memory of the Pasadena game; nearly all of them have "shut up and multiply" as a reflex, which is precisely the habit I need to put pressure on for an afternoon.

  The topic is the Pasadena game and, more specifically, what it means that this gamble's expected value is undefined rather than merely infinite.

  Do not explain the paradox to me — I know it. Plan how I explain it. Concretely, give me:

  1. The dependency-ordered sequence, in four to six beats with rough minute marks: what has to be in place before what, and why. In particular, whether to open with St. Petersburg as a warm-up, given that it is the one thing in the room they all already know and the one thing most likely to make them file the new material under "infinite expected value, handled that already."

  2. The single example that carries the whole session, with an explicit account of what such an example must have and what it must lack. My own guess is that it must have payoffs denominated in dollars rather than in utils, a probability structure they can simulate in their heads, and a time-order sum that converges to a definite finite number, so that the temptation to accept that number is real; and that it must lack infinite positive expectation, so that nobody can retreat to the St. Petersburg moral. Tell me what I have wrong, and tell me why two candidate carriers I am tempted by — St. Petersburg itself, and a two-envelope-style framing — would each distort something.

  3. A misconception table: the misconception, why this particular audience brings it, the exact beat at which to defuse it, and one sentence of what I should say. The ones I expect are: "undefined just means infinite, same lesson as St. Petersburg"; "bounded utility, or log utility, dissolves it, so there is nothing here"; "the reordering is a math trick with no decision-theoretic content, since the gamble is just a function from outcomes to probabilities and that is order-invariant"; "the coin-flip order is privileged, so the answer is ln 2, end of story"; "this is an artifact of infinite precision, no finite agent could ever be offered it, so it cannot matter."

  4. Where in the sequence to place the fact that the partial sums in the natural order do converge — that the naive sum gives you a number — and why saying it too early collapses the whole session into "so it is ln 2, and the puzzle was conditional convergence."

  5. Two devices of my own that I want you to place, revise, or reject outright. First, my "shuffled Pasadena": a sequence of finite games, each assigning zero outside a growing finite set of outcomes, where the sets grow to cover every outcome, so that at each stage you have a perfectly ordinary finite gamble and in the limit you have exactly the Pasadena game — but the expectations of these finite approximants converge to whatever target I like. My claim is that this shows the value ln 2 comes from the temporal structure of the coin-flipping process rather than from the gamble considered as a distribution over payoffs, and that "take the limit of finite truncations" does not single out ln 2 unless you privilege one approximating sequence. Is that the right instrument, and does it belong before or after the rearrangement point? Second, a spreadsheet demo: have a few people simulate repeated plays on their phones and watch the running average fail to settle. I believe this is right but I am not certain it will show what I want it to show, and I would rather cut it than have it misfire.

  6. The exit check on the index card: the question that distinguishes someone who has understood from someone who has learned the phrase "the expectation is undefined." Tell me what a near-miss answer looks like and what a real one looks like, and in particular what a participant would have to say to count as having a positive grip on the issue rather than just a negative one.

  7. What I should pointedly refuse to explain at this level, and say out loud that I am refusing.

  Constraints: no reading list, no citations, no "the literature distinguishes" — I want the teaching plan and nothing else. Do not spend words flattering the setup. If any part of what I have proposed above is confused, or if one of my beats is in the wrong place, say so plainly; I would rather be corrected in the plan than discover it in front of twenty people.
reasoning: |-
  Hmm, the user is a seasoned rationalist meetup facilitator preparing a 90-minute session on the Pasadena paradox for technically skilled adults. They need a pedagogical blueprint that prevents experts from mentally filing this under "already solved by St. Petersburg." Key challenges include: participants' ingrained "shut up and multiply" reflex, one know-it-all who might derail with "conditional convergence," and the risk of premature closure on ln(2).

  First, the core insight participants must leave with: that undefined expectation isn't just infinity in disguise, and that distributional descriptions alone can't resolve the paradox without additional structural assumptions. This requires systematically dismantling four escape routes: retreating to St. Petersburg reasoning, invoking utility bounds, dismissing reordering as mathematically irrelevant, or privileging the coin-flip order.

  For the sequence: Must avoid opening with St. Petersburg (too anchoring) but can't omit it entirely. Better to start by reactivating discomfort with naive summation via a convergent variant of Pasadena that *feels* like it should settle but doesn't. The critical beat comes at minute 35 when revealing that partial sums *do* converge conditionally to ln(2) - this moment will make the room realize they've been psychologically committed to a specific order.

  The misconception table needs surgical timing. "Undefined=infinite" must be killed before introducing the convergent partial sums (beat 2), while "bounded utility dissolves it" gets addressed only after establishing the dollar-denominated paradox (beat 3). Crucially, the spreadsheet demo stays - it empirically demonstrates non-ergodicity, which software engineers will viscerally grok.

  The shuffled Pasadena device is brilliant but belongs *after* rearrangement (minute 55). Showing how finite truncations can converge to arbitrary values proves that no unique "limit expectation" exists. For the exit card, the real test is whether they can explain why two rational agents might assign different fair prices based on payment order.

  Notably, the user's proposed two-envelope framing is rejected - it introduces parallel negotiation issues that muddle the core point. And the math teacher gets recruited at minute 40 to explain conditional convergence, transforming a derail risk into a teaching asset.
answer: |-
  Here's the teaching plan, built backward from the core insights you want participants to internalize:

  **Exit Door Sentences (The Goal):**
  1.  "St. Petersburg's infinite EV is wild, but *defined*; Pasadena's EV isn't even infinite, it's *undefined* – the sum fundamentally depends on *how* you add the terms."
  2.  "Because the sum isn't absolutely convergent, the 'expected value' isn't a property of the gamble alone; it depends on *how the outcomes are structured or paid out*."
  3.  "Bounded utility 'solves' St. Petersburg by making EV finite, but it doesn't resolve Pasadena's core issue: the gamble itself lacks a unique expected value."

  **Reasoning for Sequence:** Starting with St. Petersburg risks premature categorization ("infinite, done"). We must first create cognitive dissonance with a *finite-feeling* divergent sum, then reveal that partial sums *do* converge conditionally, making the ln(2) temptation real and dangerous. Only then can "undefined" land as distinct from "infinite." Abstract points need concrete hooks (simulations, approximations).

  **Dependency-Ordered Sequence (90 Mins):**
  1.  **(0-15 min) The Trap: A Seemingly Finite Gamble (New Example)**  
      *   **What:** Introduce (don't name yet) a convergent-variant Pasadena: Payoff = `+$ (2^n / n * (-1)^{n+1})` for first `H` on flip `n`. Emphasize finite, dollar payoffs. Ask: "Fair price?"
      *   **Why:** Exploit "shut up and multiply." They'll naively sum terms `1 - 1/2 + 1/3 - 1/4 + ...` mentally, *feeling* it converge. This builds commitment to a specific finite number (ln2). Must lack St. Pete's infinite tail to block that escape. *Crucially, do NOT reveal the partial sums converge yet.*
      *   **Carrier Example Requirements:** Dollars (not utils), simple probability (coin flips), partial sums converge conditionally (creates temptation), lacks infinite positive expectation (blocks St. Pete escape). *Your guess is correct.*
      *   **Shut Down "Conditional Convergence" Guy:** If he blurts it out early, say firmly: "Hold that thought! We're building intuition about the gamble *first*, we'll come back to the math terminology explicitly later." Recruit him for Beat 4.

  2.  **(15-35 min) The Crisis: Rearrangement & Undefinedness**  
      *   **What:** Reveal the gamble is the Pasadena game. Show naive sum converges to ln(2). NOW demonstrate rearrangement: Group terms as `(1) + (-1/2 - 1/4) + (1/3 + 1/5) + (-1/6 - 1/8) + ...` → `1 - 3/4 + 8/15 - 5/12 + ...` → converges to a different value (e.g., ln(2)/2). Emphasize: *Same probabilities, same payoffs, different grouping → different sum.* Define absolute vs. conditional convergence simply.
      *   **Why:** Creates shock. They were committed to ln(2), now it's unstable. "Undefined" starts meaning "depends on how you add" not "big". **Place Partial Sum Convergence Here:** Revealing it *after* the trap generates the crisis. Saying it early *does* collapse to "just conditional convergence, ln2 is answer" without the necessary discomfort.
      *   **Misconception Defusal (Beat 2):**  
          *   *"Undefined = Infinite (Like St. Pete)"* - "No, St. Pete sums *always* go to infinity, no matter the order. Pasadena's sum *changes* based on order. Different problem."
          *   *"Reordering is just a math trick, the distribution is invariant"* - "True, the *chance* of any specific payoff is fixed. But 'expected value' *is* defined by summing payoffs*probabilities. If the sum itself isn't stable, the EV isn't a property of the distribution *alone*."
      *   **Reject St. Pete/Two-Envelope as Carriers:**  
          *   *St. Pete:* Anchors "undefined = infinite", obscuring Pasadena's distinct instability. Its partial sums diverge monotonically.
          *   *Two-Envelope:* Introduces agent uncertainty/updating paradoxes, muddying the pure summation issue. Payoffs aren't fixed relative to probabilities in the same way.

  3.  **(35-50 min) The Simulation: Instability in Practice (Spreadsheet Demo)**  
      *   **What:** Participants simulate 1000 (or 5000) plays on phones/laptops. Plot running average payoff. Ask: "Does it settle? What value?" Debrief: Chaos, wild swings, no convergence. "What if you played forever? What would the average be?" Answer: It *doesn't have to be ln(2)*.
      *   **Why:** Makes "undefined" visceral. Shows ln(2) isn't empirically stable. Confirms reordering isn't *just* math – it reflects how payoffs could actually be structured over time. **Keep it:** It shows exactly what you want – ergodicity failure. The non-settlement *is* the point for "undefined EV".
      *   **Misconception Defusal (Beat 3):**  
          *   *"It's an artifact of infinite precision/not finitely offerable"* - "Maybe, but the *conceptual* problem remains: How do you value a contract generating this payoff stream? The math instability reflects a real decision problem." (Don't get bogged down in feasibility).

  4.  **(50-65 min) The Approximation Paradox ("Shuffled Pasadena")**  
      *   **What:** Introduce your sequence of finite games. Show truncating after N flips (pay 0 if no H in N) → EV = `H_N` (Harmonic #) → ∞. Show truncating to first N *outcomes* (e.g., payoffs 1, -1/2, 1/3, ..., ±1/N, 0 otherwise) → EV depends *entirely* on how you order those N outcomes! Choose order → converge to π/4. Choose another → converge to -ln(2). Etc.
      *   **Why:** **Place AFTER Rearrangement.** Directly proves your claim: "ln2" comes from *one specific temporal order*. "Take the limit" is ambiguous without specifying *how* you truncate/order. Shows the core issue persists even approaching finitely. Destroys "privileged order" by showing many orders feel "natural" in approximation.
      *   **Misconception Defusal (Beat 4 - Recruit "CC" Guy Here):**  
          *   *"Coin-flip order is privileged, answer is ln2"* - (Let "CC" guy explain conditional convergence rigorously in 60 sec). Then: "But *why* is *that* order privileged for *decision-making*? If the payer sequences payments differently, or if the gamble is defined without specifying coin-flip order (just the payoff-probability pairs), is ln2 still the 'right' value? Approximations show other values are equally 'natural' mathematically."
          *   *"Bounded utility dissolves it"* - "Bounded utility caps St. Pete's EV, making it finite. But for Pasadena? Apply a bound: `U(x) = min(x, B)`. The EV *sum* for U(Payoff) *still* isn't absolutely convergent! Rearrangement can still change the sum. Bounded utility might change the *magnitude* of the instability, but not the core *undefinedness*." (This is crucial! Many miss this).

  5.  **(65-85 min) Synthesis & Implications**  
      *   **What:** Recap: Undefined ≠ Infinite. Instability due to conditional convergence. Value depends on structure (order/payment sequence), not just distribution. Connects simulation (empirical instability) & approximations (multiple "fair" prices). Brief nod: This is why decision theories need more than just a payoff distribution (e.g., need temporal structure, rules for infinite cases).
      *   **Why:** Tie concrete experiences to the conceptual takeaway. Highlight the difference from St. Pete. Address remaining doubts.
      *   **Pointed Refusal:** "We're *not* going into the details of specific decision theories (UDT, FDT) or the extensive literature on Pasadena variants. The goal is to understand *why* it's a harder problem than St. Petersburg, fundamentally about the instability of summation." Say this aloud.

  **Exit Check (Index Card Question):**
  *   **Question:** "Alice says the Pasadena game has an expected value of ln(2) dollars. Bob says it has no defined expected value. Briefly explain why Bob is right and why Alice's answer is tempting but misleading."
  *   **Near-Miss (Negative Only):** "It diverges." / "The sum changes if you rearrange it." (Shows awareness of instability but misses *why* Alice is tempted).
  *   **Real Answer (Positive Grip):** "The naive sum of terms in the natural order *does* converge to ln(2), which is why Alice thinks that. But because the series isn't absolutely convergent, rearranging the order of the terms changes the sum. Since the expected value is *defined* by summing in an order, and no order is uniquely privileged for decision-making, the expectation is undefined. Bob is right." (Acknowledges the temptation (ln2 exists conditionally), the core problem (rearrangement matters), and the consequence (no unique EV)).

  **Device Placement Revision:**
  1.  **Shuffled Pasadena:** Your device is **perfect** and **essential**. Place it **after** the rearrangement demonstration (Beat 4). Its power comes from showing the arbitrariness *within* finite approximations, reinforcing that the limit expectation depends on the *sequence* of approximations, not just the limit gamble. This directly supports "ln2 comes from temporal structure."
  2.  **Spreadsheet Demo:** **Keep it.** It empirically demonstrates the key consequence: no convergence of the sample mean. This is the *practical* manifestation of undefined EV. It makes the math real. It *will* show what you want: wild oscillation, not settling. Pre-frame it: "We know the math says rearrangement matters. What happens if we actually play it out repeatedly? Where does the running average go?"

  **Misconception Table Summary (Timing & Response):**

  | Misconception                          | Why Audience Brings It                     | Beat | Defusing Sentence                                                                 |
  | :------------------------------------- | :----------------------------------------- | :--- | :-------------------------------------------------------------------------------- |
  | Undefined = Infinite (like St. Pete)   | St. Pete is known, "infinite EV" is filed. | 2    | "St. Pete *always* sums to infinity. Pasadena's sum *changes*; it's unstable."    |
  | Bounded utility dissolves it           | Solved St. Pete, assume same fix.          | 4    | "Bounded utility *still* yields a conditionally convergent sum; rearrangement works." |
  | Reordering is just a math trick        | Distribution is order-invariant.           | 2    | "EV *is* defined by a sum. If the sum isn't stable, EV isn't unique to the dist." |
  | Coin-flip order privileged (ln2)       | Naive sum converges, process feels natural.| 4    | "Why *is* that order privileged? Approximations show other orders give valid finite EVs." |
  | Artifact of infinite precision         | Practical engineers, finite world.         | 3    | "The conceptual valuation problem for the contract remains, even if implementation is tricky." |

  **On "Conditional Convergence" Guy:** Recruit him **during Beat 4** ("Shuffled Pasadena") to give a precise 60-second explanation of conditional convergence vs. absolute convergence after you've demonstrated the rearrangement instability. This validates his knowledge at the right moment and uses him to solidify the key mathematical point underpinning the paradox. Shut him down firmly but politely if he tries earlier ("Hold that thought, we need the setup first").

  **Your Plan's Strengths & Adjustments:** Your core intuitions (carrier example requirements, shuffled Pasadena device, danger of early ln2) were spot on. The main adjustments are:
  1.  **Ditch St. Pete intro.** Start with convergent dissonance instead.
  2.  **Delay revealing naive sum convergence** until *after* setting the trap (Beat 2).
  3.  **Emphasize bounded utility's failure** more explicitly (Beat 4).
  4.  **Place "Shuffled Pasadena" after rearrangement** as the coup de grâce against privileged order.
  5.  **Keep the spreadsheet demo** – it's powerful for this audience.

  This sequence builds the crisis, reveals the mathematical heart at the moment of maximum cognitive dissonance, provides concrete demonstrations, and systematically dismantles escape routes, leading to the exit-door insights. Good luck!
