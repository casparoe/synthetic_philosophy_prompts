prompt: |-
  i was talking with my friends in this grad seminar on rational choice and we got into a weird argument about Kelly betting versus geometric rationality. I'm writing our take-home exam and i need an essay question thats actually in the weeds, not just "explain log utility maximization" or "derive teh growth rate formula." the idea i want to inject is this: suppose belief states live on a statistical manifold equipped with the Fisher-Rao metric, so rational updating means moving along geodesics rather than jumping arbitrarily. meanwhile Kelly betting tells you to split capital according to probabilities to maximize exponential growth, but that derivation quietly assumes the wagers are independent. so heres the twist for the exam: ask students to construct a scenario where a bettor faces two wagers whose payoffs depend on a shared hidden parameter, which means her belief updates and her capital allocations are coupled through the curvature of the manifold. the question should force them to argue whether the geodesic update rule forces the Kelly fractions to shift away from teh standard log-optimal split, and whether that shift should be seen as a failure of Kelly or as preserving geometric consistency. i need the essay question itself, then a model answer around 600 words, plus a marking scheme with about five must-hit moves (identifying the metric, writing the geodesic condition, showing exactly where the independence assumption breaks, resolving the tension one way or another) with point values totalling 20, and a one-line note on how candidates typically botch each point. level is upper-level grad, open book but no web, about three hours. please dont ask for citations or a reading list, just the question and the grading standard.
reasoning: |-
  We are constructing an essay question for a graduate seminar on rational choice, focusing on the interplay between Kelly betting and geometric rationality (with belief states on a statistical manifold with the Fisher-Rao metric). The twist is that the bettor faces two wagers with payoffs depending on a shared hidden parameter, leading to coupling between belief updates and capital allocations via the curvature of the manifold.

  Essay Question:

  "Consider a bettor who operates in a statistical manifold equipped with the Fisher-Rao metric. She holds beliefs about a binary hidden parameter θ ∈ {0,1} that influences two distinct wagers. Each wager i (i=1,2) is a binary event with outcomes in {0,1}, and the probability of success for wager i is p_i when θ=0 and q_i when θ=1, with p_i, q_i ∈ (0,1) and p_i ≠ q_i. The bettor's initial belief is given by a prior distribution π(θ). She must allocate fractions f1 and f2 of her capital to the two wagers (with f1+f2 ≤ 1) to maximize the expected log-growth of her capital. However, after allocating her capital, she observes the outcome of the wagers and updates her belief about θ. This update is performed by moving along a geodesic in the statistical manifold according to the Fisher-Rao metric.

  Critically analyze the interaction between belief updating and capital allocation in this setting. Specifically:

  1. Explain why the standard Kelly criterion derivation (which yields the log-optimal fractions) assumes independence between the wagers and how this independence is violated when both wagers depend on the same hidden parameter θ.

  2. Derive the geodesic update rule for the belief state (i.e., the posterior over θ) given the outcomes of the two wagers, using the Fisher-Rao metric on the manifold of probability distributions over θ.

  3. Argue whether the geodesic update rule, in the presence of curvature, forces the Kelly fractions (f1, f2) to shift away from the standard log-optimal split that would be computed under the assumption of independence. (Note: You may assume that the bettor uses the updated beliefs from the geodesic rule when computing the expected log-growth for future bets, but here we are concerned with the initial allocation.)

  4. Discuss whether such a shift (if it occurs) should be interpreted as a failure of the Kelly criterion or as a necessary adjustment to preserve geometric consistency in the belief updating process.

  Your essay should include explicit mathematical expressions where appropriate, but a full derivation of the geodesic equation is not required (you may state the geodesic condition)."

  Model Answer (approximately 600 words):

  The standard Kelly criterion maximizes the expected log-growth of capital by setting the fraction f_i = (b_i * p_i - 1)/(b_i - 1) for a single bet with payoff odds b_i:1 and success probability p_i. For multiple independent wagers, the fractions are chosen to maximize the expected log-growth over the joint probability distribution. However, when two wagers depend on a shared hidden parameter θ, the outcomes are no longer independent. The joint probability of the outcomes (x1, x2) is given by:

  P(x1,x2) = π(0) * [p1^{x1}(1-p1)^{1-x1}] * [p2^{x2}(1-p2)^{1-x2}] + π(1) * [q1^{x1}(1-q1)^{1-x1}] * [q2^{x2}(1-q2)^{1-x2}]

  This mixture breaks independence unless p_i = q_i for both i. Thus, the standard Kelly derivation, which assumes independence, is invalid.

  In the geometric rationality framework, beliefs are points on a statistical manifold (the 1-simplex for θ) equipped with the Fisher-Rao metric. The metric is given by the Fisher information. For a Bernoulli distribution, the Fisher-Rao metric is the spherical metric. For our case, the belief state is a distribution over θ (a Bernoulli on θ), so the manifold is the 1-simplex. The Fisher-Rao metric on the simplex is the round metric on the sphere (after a suitable transformation). The geodesics are the shortest paths in this metric, which for the 1-simplex are the exponential families or the arcs of great circles on the sphere.

  When updating the belief from prior π to posterior given (x1,x2), the geodesic update moves along the geodesic from π to the point representing the exact posterior (computed by Bayes' rule) but only for a step size corresponding to the information in (x1,x2). However, in the setting of geometric rationality, one might update by moving along the geodesic in the direction of the score vector (the gradient of the log-likelihood) by an amount determined by the observed data. For simplicity, we consider the exact Bayesian posterior as the target, and the geodesic update is the path that minimizes the length (in the Fisher-Rao metric) from the prior to the posterior. But note: the geodesic update rule in geometric rationality is often defined as the continuous path that follows the gradient flow of the log-likelihood. However, for discrete updates, we can use the geodesic between the prior and the exact posterior.

  Now, the issue is that the Kelly fractions are chosen to maximize the expected log-growth, which depends on the prior and the model. The expected log-growth for a capital allocation (f1,f2) is:

  G(f1,f2) = E[ log(1 + f1*(b1*X1-1) + f2*(b2*X2-1) ) ]

  where the expectation is over (X1,X2) with the joint distribution above. Because the outcomes are dependent, the optimal fractions must account for the entire joint distribution. The standard independent case would assume P(x1,x2)=P(x1)*P(x2), which is not true here. Therefore, the log-optimal fractions are already different from the independent case even without considering the update rule.

  However, the question is whether the geodesic update rule (which affects future allocations) forces the initial allocation to shift. In the problem, the bettor uses the updated beliefs for future bets, so the initial allocation must anticipate that the belief update will follow the geodesic rule. This creates a fixed-point problem: the initial allocation depends on the update rule, which depends on the data, which in turn depends on the allocation (via the model). But note: the allocation does not affect the data generation; it only affects the capital growth. The belief update is entirely determined by the data (x1,x2) and the prior. Therefore, the update rule is independent of the allocation. Thus, the initial allocation can be computed without considering the update rule because the update rule is a function of the data and prior only. However, the bettor's objective function for the initial allocation is the one-step expected log-growth, and then for future bets she will use the updated beliefs. But if the future bets are independent, then the initial allocation does not affect future allocations. However, in this setting, the two wagers are simultaneous and then the update happens. The problem does not specify future bets, so we assume that the bettor only cares about the one-step growth.

  Therefore, the initial allocation is determined solely by maximizing the expected log-growth for the one bet. The geodesic update rule does not force a shift in the initial Kelly fractions because the update happens after the allocation and the outcomes are realized. The shift in the fractions from the independent case is due solely to the dependence in the joint distribution of the outcomes, not due to the update rule.

  Nevertheless, the update rule might be used in a multi-step setting. Suppose the bettor is going to face the same two wagers repeatedly, and the hidden parameter θ is fixed. Then, the bettor would update her belief about θ over time. The initial allocation would then be part of a strategy that considers the entire future. This is a complex problem. In that case, the update rule (geodesic vs. Bayesian) might affect the long-term growth. However, the geodesic update (if it is the exact Bayesian update) is the same as the standard update. The geodesic update in the Fisher-Rao metric for discrete data is equivalent to the Bayesian update for exponential families. Since our model for θ is a Bernoulli, the Bayesian update is indeed along the geodesic. Therefore, there is no shift forced by the update rule: the standard Bayesian update is geodesic.

  Thus, the shift in the Kelly fractions is entirely due to the dependence in the wagers and not due to the geometric update rule. The geometric consistency is preserved by the Bayesian update, which is geodesic in the Fisher-Rao metric. The Kelly criterion, when properly applied to the dependent wagers, is consistent with geometric rationality.

  Marking Scheme (total 20 points):

  1. Identifying the violation of independence in the joint distribution and explaining why the standard Kelly derivation assumes independence. (4 points)
     - Botch: Failing to write the joint distribution or not explaining the dependence.

  2. Writing the Fisher-Rao metric for the belief state (the simplex for θ) and the geodesic condition (or the update rule). (4 points)
     - Botch: Incorrect metric (e.g., Euclidean) or no geodesic condition.

  3. Showing that the initial Kelly fractions are different from the independent case because of the dependence, but arguing that the update rule (geodesic) does not force an additional shift for the one-step allocation. (6 points)
     - Botch: Claiming that the update rule affects the initial allocation in the one-step case.

  4. Resolving the tension: Either by noting that the update rule is the same as Bayesian (hence geodesic) and does not force a shift beyond what the dependence already causes, or by considering a multi-step setting and showing that the geodesic update is optimal. (4 points)
     - Botch: Not recognizing that the Bayesian update is geodesic in this setting.

  5. Clear conclusion: The shift is due to dependence, not the update rule, and it is a correction of the Kelly criterion for dependence, not a failure. (2 points)
     - Botch: Misinterpreting the shift as a failure of Kelly.

  Note: The above model answer and marking scheme are based on the understanding that the geodesic update for the Bernoulli model is the same as the Bayesian update. If the problem intended a different update rule (e.g., a discretized geodesic flow that is not the full Bayesian update), then the answer would differ. However, in the standard setting, the Bayesian update is geodesic in the Fisher-Rao metric for exponential families. Therefore, the model answer holds.
answer: |-
  ### Essay Question  
  **Context:** In geometric rationality, an agent's belief state resides on a statistical manifold equipped with the **Fisher-Rao metric**, and rational updating follows geodesics. Meanwhile, the Kelly criterion maximizes logarithmic growth by allocating capital fractions \(f_1, f_2\) to wagers based on probabilities, but assumes wager independence.  

  **Scenario:** A bettor faces two binary wagers (\(W_1, W_2\)) with payoffs contingent on a shared hidden parameter \(\theta \sim \text{Bernoulli}(\pi)\). Outcomes depend on \(\theta\) as follows:  
  - If \(\theta = 1\), \(W_i\) succeeds with probability \(p_i\).  
  - If \(\theta = 0\), \(W_i\) succeeds with probability \(q_i\) (with \(p_i \neq q_i\)).  
  The agent updates beliefs via geodesics in the Fisher-Rao metric after observing outcomes.  

  **Task:**  
  1. **Explain** why the standard Kelly derivation fails when \(W_1\) and \(W_2\) share dependence on \(\theta\).  
  2. **Derive** the geodesic belief update rule for the posterior of \(\theta\) given outcomes of \(W_1\) and \(W_2\).  
  3. **Analyze** whether geodesic updating forces the initial Kelly fractions \((f_1, f_2)\) to deviate from the log-optimal split for independent wagers.  
  4. **Argue** whether such a deviation (if it exists) represents:  
     - A **failure of the Kelly criterion**, or  
     - **Preservation of geometric consistency**.  

  Use explicit mathematical reasoning. Assume the agent maximizes expected log-growth over one betting round, but account for how belief updating affects future allocations.  

  ---

  ### Model Answer (Approx. 600 words)  
  The standard Kelly criterion maximizes expected log-growth \(\mathbb{E}[\log(1 + \sum_i f_i r_i)]\), where \(r_i\) is the return for wager \(i\). This assumes independence, computing optimal fractions as \(f_i^* = \frac{b_i p_i - 1}{b_i - 1}\) for odds \(b_i\) and success probability \(p_i\). However, when \(W_1\) and \(W_2\) share dependence on \(\theta\), the joint outcome distribution is a mixture:  
  \[
  P(W_1, W_2) = \pi \cdot P(W_1|\theta=1)P(W_2|\theta=1) + (1-\pi) \cdot P(W_1|\theta=0)P(W_2|\theta=0).
  \]  
  Violating independence invalidates the separable optimization of \(f_i\), as cross-terms in the log-growth objective couple \(f_1\) and \(f_2\).  

  Beliefs about \(\theta\) lie on a 1D statistical manifold (a curve) parameterized by \(\pi\), with the **Fisher-Rao metric** \(ds^2 = \frac{d\pi^2}{\pi(1-\pi)}\). Geodesics satisfy \(\ddot{\pi} - \frac{\dot{\pi}^2}{2\pi(1-\pi)} = 0\), solved by **logistic curves** \(\pi(t) = \frac{\pi_0 e^{kt}}{1 - \pi_0 + \pi_0 e^{kt}}\). After observing outcomes \(\mathbf{w} = (w_1, w_2)\), the exact Bayesian posterior is \(\pi_{\text{post}} = \frac{\pi \cdot L(\mathbf{w}|\theta=1)}{\pi \cdot L(\mathbf{w}|\theta=1) + (1-\pi) \cdot L(\mathbf{w}|\theta=0)}\), where \(L\) is the likelihood. Geodesic updating moves continuously from \(\pi_0\) to \(\pi_{\text{post}}\) along a path parameterized by information (e.g., \(t \propto I(\mathbf{w})\)).  

  Geodesic updating **does not force a shift** in the initial Kelly fractions \((f_1, f_2)\) away from the correct log-optimal split for the coupled wagers. The log-optimal fractions maximize:  
  \[
  G(f_1, f_2) = \sum_{\mathbf{w}} P(\mathbf{w}) \log\left(1 + f_1 r_1(\mathbf{w}) + f_2 r_2(\mathbf{w})\right),
  \]  
  where \(P(\mathbf{w})\) depends on \(\theta\). This is fully determined by the prior \(\pi\) and model parameters (\(p_i, q_i\)), **not the updating rule**. Geodesic updating affects *future* allocations after \(\mathbf{w}\) is observed, but the initial allocation optimizes *current* expected log-growth given the prior. Thus, the fractions differ from the independence case solely due to the \(\theta\)-dependence in \(P(\mathbf{w})\), not geometric updating.  

  Any shift in \(f_i\) from the naive independent split is a **correction**, not a failure. Kelly betting remains optimal when the joint distribution is correctly specified. The geodesic update ensures belief trajectories respect the manifold’s curvature, avoiding "jumps" that violate informational geometry. In multi-round betting, this consistency prevents path-dependent errors. For example, if \(\theta\) persists, geodesics ensure beliefs evolve smoothly, permitting stable fractional Kelly strategies.  

  The tension arises if one misapplies Kelly under false independence. Here, the shift preserves geometric rationality: geodesics encode the cost of belief updates via the Fisher distance, while Kelly optimally exploits probabilistic structure. Thus, the geodesic-Kelly synthesis handles dependence via curvature-aware beliefs and coupled capital allocation.  

  ---

  ### Marking Scheme (Total: 20 points)  
  **1. Identify dependence and independence assumption breakdown (4 pts)**  
     - **Must-hit:** Derive the joint distribution \(P(W_1, W_2)\) as a \(\theta\)-mixture. Explain why independence fails.  
     - **Botch:** Claims independence holds or misses mixture structure.  

  **2. Specify Fisher-Rao metric and geodesic condition (4 pts)**  
     - **Must-hit:** State metric \(ds^2 = \frac{d\pi^2}{\pi(1-\pi)}\) and geodesic equation/logistic solution.  
     - **Botch:** Uses Euclidean metric or omits geodesic constraint.  

  **3. Derive Kelly fractions for coupled wagers (6 pts)**  
     - **Must-hit:** Write \(G(f_1, f_2)\) with correct \(P(\mathbf{w})\) and argue it depends only on prior \(\pi\), not update rule.  
     - **Botch:** Assumes independence or ties fractions to geodesic updates.  

  **4. Resolve tension: Shift due to dependence, not geodesics (4 pts)**  
     - **Must-hit:** Conclude geodesic updating affects future allocations, not initial \(f_i\).  
     - **Botch:** Claims geodesics force initial fraction changes.  

  **5. Judgment on Kelly/geometric consistency (2 pts)**  
     - **Must-hit:** Argue shift corrects for dependence, preserving Kelly optimality and geometric consistency.  
     - **Botch:** Labels shift as a "failure" without nuance.  

  ---

  **Exam Logistics**  
  - **Duration:** 3 hours (open book, no internet).  
  - **Level:** Upper-tier graduate (e.g., mastery of differential geometry, probability).  
  - **Output:** Essay with mathematical derivations; concise writing rewarded.
