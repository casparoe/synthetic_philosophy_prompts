  For the first required question (motivational infrastructure as empirical vs normative), I'll frame it around the coercion-legitimacy link since that's foundational. The follow-up must press the tension if she claims both - perhaps by presenting a scenario where empirical support exists but normative conditions fail. 

  The asylum seeker question needs precision. Her likely "temporary protection" distinction creates a two-tier system - the follow-up should highlight how this provisional exclusion risks becoming permanent, using her own entry/standing framework against her.

  On operationalizing integration, I anticipate her retreating to procedural criteria. The follow-up should challenge whether procedural neutrality is possible without substantive cultural bias, maybe using real-world examples like language tests that embed dominant norms.

  The falsifiability question is crucial - I'll reference Popper to pressure whether her theory allows disconfirmation. The follow-up could attack the "integration difficulty" escape hatch by demanding what would count as structural failure.

  For additional questions: One should target the lexical ordering itself - what if reciprocity-building institutions fail? Another could contrast her view with global justice approaches that reject state-mediated reciprocity as parochial. The last might examine historical cases where diversity enhanced solidarity.

  The sequence must flow: start conceptual (Q1-2), escalate to normative tensions (Q3-5), confront empirical limits (Q6-7), and end with falsification (Q8). All questions should weaponize her entry/standing distinction and maintain academic rigor without biography. Tone is vital - formal but incisive, avoiding gotcha phrasing while exposing theoretical fault lines.
answer: |-
  Here are ten rigorously constructed questions (with paired follow-ups) designed to advance the debate beyond restatement, leveraging her core distinctions and pressing key tensions in the literature. The sequence builds from conceptual grounding to normative and operational challenges, culminating in falsifiability:

  1.  **Conceptual Clarification: Motivational Infrastructure**
      *   **Q1:** You characterize the erosion of "motivational infrastructure" as undermining the *legitimacy* of redistributive coercion, not merely its fiscal feasibility. Does this claim function primarily as a *normative precondition* for legitimate state action (i.e., solidarity *must* precede justifiable redistribution, as a matter of principle), or as an *empirical prediction* about contingent voter psychology under conditions of perceived heterogeneity? Or is it constitutive of the very concept of democratic solidarity you employ?
      *   **Follow-Up (if she asserts both):** If it functions both normatively *and* empirically, how do you reconcile a potential conflict? Suppose robust empirical evidence emerged showing high levels of sustained redistribution alongside rapid demographic change in a specific context – would this falsify the *normative* claim that thick reciprocity is a necessary precondition for legitimate coercion, or merely demonstrate an empirical anomaly? Does the normative claim risk becoming unfalsifiable by retreating into the empirical?

  2.  **Asylum & Provisional Exclusion:**
      *   **Q2:** Your framework distinguishes entry rights from standing rights. How does reciprocity-first conditionalism address asylum seekers fleeing states where the very conditions for "thick civic reciprocity" (stable institutions, shared normative frameworks) have catastrophically collapsed? Does their flight from reciprocity's *absence* generate any distinctive moral claim *to* inclusion within a functional reciprocity scheme, or are they confined to temporary protection without distributive standing?
      *   **Follow-Up (anticipating temporary protection):** You likely distinguish temporary protection from full standing. Doesn't this create a *de facto* two-tiered membership structure? If the "provisional" status of such individuals persists – potentially for years or generations due to protracted crises or slow integration – does this institutionalized exclusion risk calcifying into precisely the kind of permanent non-reciprocity your framework ostensibly seeks only to avoid *provisionally*? How does this avoid replicating the exclusion it postpones?

  3.  **Operationalizing Integration:**
      *   **Q3:** A central operational challenge concerns the criteria for achieving "integration" sufficient to confer full distributive standing. How do we determine when "thick civic reciprocity" is established without relying on benchmarks that are either culturally parochial (demanding assimilation to dominant norms) or so minimal as to be normatively vacuous? Specifically, what non-circular indicators demonstrate the requisite shared authorship of institutions?
      *   **Follow-Up (anticipating procedural retreat):** If you appeal to procedural criteria – participation in institutions, adherence to laws, civic engagement – rather than substantive cultural/normative alignment, how does this avoid the charge of thinness? Doesn't mere procedural participation fall short of the "thick" normative commitment and mutual identification you argue is necessary for sustaining high-transfer schemes? Could individuals participate procedurally while remaining perceived (or perceiving themselves) as outsiders, thus still eroding the motivational infrastructure?

  4.  **Lexical Ordering & Institutional Failure:**
      *   **Q4:** Your theory lexically orders open borders *behind* the prior achievement of thick reciprocity. What happens if institutions demonstrably *fail* to generate thick reciprocity among the existing citizenry, or fail to integrate newcomers at a pace commensurate with need or moral urgency? Does this failure indefinitely delay the moral claim to open borders, or does it trigger a requirement for institutional reform? Put differently, is the absence of thick reciprocity always a justification for restricting standing rights, or can it sometimes be an indictment of the institutions themselves?
      *   **Follow-Up:** Could persistent institutional failure to foster reciprocity, despite good-faith efforts, ever lead you to conclude that the *lexical ordering itself* is flawed or requires significant modification (e.g., by demanding border openness *as a means to build* reciprocity, or by lowering the threshold for "thickness")? Or is the priority absolute?

  5.  **The "Co-Authorship" Requirement:**
      *   **Q5:** You ground full standing rights in being a "co-author" of shared institutions. Does this co-authorship require formal citizenship? If not, what constitutes sufficient informal co-authorship for standing? If yes, doesn't this make the acquisition of citizenship (and thus standing rights) contingent on prior integration, creating a potentially vicious circle where full participation in shaping the institutions is required *before* one has the full rights necessary to effectively shape them?
      *   **Follow-Up:** How does this view of co-authorship accommodate children, the severely cognitively disabled, or others who cannot meaningfully "author" institutions but are typically included in distributive schemes? Does their inclusion rely on a different principle that could also apply to newcomers before full integration?

  6.  **Contrast with Alternative Solidarities:**
      *   **Q6:** The literature identifies multiple potential bases for solidarity beyond shared civic authorship (e.g., humanitarian need, basic rights, shared humanity, functional interdependence). Why is *civic* reciprocity lexically prior *and* sufficient to override these other potential grounds for distributive claims, particularly for those physically present and subject to the state's coercive power? Doesn't their subjection generate *some* immediate claim beyond mere entry?
      *   **Follow-Up:** Couldn't alternative solidarities (e.g., based on shared vulnerability or universal human rights) potentially sustain high-transfer schemes even amidst diversity, challenging the *necessity* of your specific "thick civic" variety? Does your framework risk conflating the historically contingent forms solidarity has taken in specific welfare states with its only possible normative foundation?

  7.  **The Scope of Reciprocity:**
      *   **Q7:** How "thick" must reciprocity be? Does it require a strong sense of shared national identity, or merely a commitment to abstract democratic principles and institutions? If the latter, isn't this potentially achievable without prolonged integration periods? If the former, how do you avoid the charge of demanding an exclusionary form of nationalism incompatible with liberal neutrality?
      *   **Follow-Up:** If reciprocity requires a shared sense of identity or fate, doesn't this make your framework particularly vulnerable to the very political manipulation and exclusionary rhetoric you likely wish to avoid? How can institutions foster this "thickness" without actively promoting homogeneity?

  8.  **Falsifiability & Empirical Pressure:**
      *   **Q8:** What specific institutional outcome or empirical finding would constitute a genuine falsification of reciprocity-first conditionalism? For instance, would the sustained political legitimacy and fiscal stability of a high-redistribution welfare state experiencing very rapid and diverse immigration directly challenge your core thesis? Or would such evidence merely be interpreted as demonstrating successful integration, thus protecting the theory from refutation?
      *   **Follow-Up:** If persistent exclusion or slow integration are always explained as evidence that "thick reciprocity" hasn't *yet* been achieved (rather than evidence against its necessity or lexical priority), doesn't this render the theory effectively unfalsifiable? How do we distinguish between "integration is difficult" and "your prerequisites for legitimacy are normatively flawed or practically unachievable"?

  **Key Features of this Sequence:**

  *   **Leverages Core Distinctions:** Explicitly and repeatedly uses "entry rights" vs. "standing rights," "thick civic reciprocity," "motivational infrastructure," "integration," and "co-authorship."
  *   **Targets Key Tensions:** Presses the empirical/normative ambiguity, the asylum dilemma, the operationalization problem (avoiding assimilationism), the risk of permanent provisionality, the circularity of co-authorship, the lexical ordering's rigidity, and falsifiability.
  *   **Follows Logical Arc:** Moves from conceptual foundations (Q1) to specific hard cases (Q2) to practical implementation (Q3) to systemic pressures (Q4, Q5), then contrasts with alternatives (Q6) and clarifies scope (Q7) before culminating in falsifiability (Q8).
  *   **Formal & Precise Tone:** Uses precise philosophical terminology ("lexically ordered," "normative precondition," "legitimate coercion," "constitutive," "calcifying," "non-circular indicators," "vicious circle," "unfalsifiable") appropriate for a doctoral colloquium.
  *   **Avoids Restatement:** Questions presuppose understanding of her framework and demand she engages with its difficulties within the broader literature's context.

  This set provides a rigorous, critical, yet constructive framework for a philosophically substantive Q&A session that moves the discussion forward. Good luck with the moderation!
