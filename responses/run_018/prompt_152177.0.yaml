  I notice they're slightly anxious ("should I feel regret?"). While I shouldn't dodge the philosophy, I should reassure them that lived experience isn't invalidated. The block universe describes reality's structure, not how we feel time's flow. 

  Biggest risks here: oversimplifying causation into "just an illusion" or implying hard determinism. Must stress that physics doesn't dictate free will's absence - that's a separate philosophical layer. Also avoid saying "time isn't real" which would confuse them. Time exists relationally in the block. 

