  Hmm... the causation part is tricky. I should emphasize that the block view doesn't erase causal chains - it just sees them as fixed patterns. Like fossils showing footprints: the cause/effect is real, just not "happening" now. For free will, I must avoid both fatalism ("everything's predetermined") and the opposite extreme ("free will survives unscathed"). Maybe reframe choice as part of the block's structure rather than opposing it. 

