  Build me a case in a realistic hospital or workplace — one paragraph max, no demons or exotic physics — where a decision-maker facing moral uncertainty between consequentialism, deontology, and virtue ethics must decide whether to reallocate a scarce treatment. Engineer the specifcation so that maximising expected choice-worthiness (MEC) and the my-favourite-theory (MFT) approach both say save the larger group, but a maximin-over-theories rule says protect the individual already receiving care. After the scenario, walk through the reasoning for each of the three approachs, identify the exact structural feature that makes maximin peel away, and say what happens if you strip that feature out — does the disagreement collapse? Also tell me how a defender of maximin would attack your case as unfair. Please separate what's settled about these decision procedures from what's genuinely contested among philosophers who actually work on moral uncertainty, and don't present a contested view as the consensus. Write the answer in British English, and if the case feels contrived to force the verdict, say so honestly.
