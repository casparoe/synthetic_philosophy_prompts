answer: |-
  Here’s a realistic UK hospital scenario during a pandemic-induced ventilator shortage:  
  Patient A, a 60-year-old with chronic respiratory disease, has occupied the last available ventilator for 24 hours. Two younger patients (B and C, both 30, previously healthy) now arrive simultaneously in acute respiratory failure. Without intervention, all three will die. Reallocating the ventilator from A to B and C would save both B and C (net one life saved), but actively causes A’s immediate death by withdrawal. The clinician faces moral uncertainty: consequentialism (maximise lives saved) demands reallocation; deontology (duty not to actively kill/harm) forbids removing A’s established treatment; virtue ethics (integrity, compassion) might condemn abandoning an entrusted patient as callous or betraying care norms.  

  **Reasoning per approach**:  
  - **MEC (maximising expected choice-worthiness)**: Assigns probabilities to theories (e.g., 40% consequentialism, 35% deontology, 25% virtue ethics). Though deontology/virtue ethics deem reallocation impermissible, consequentialism’s strong gain (saving two vs one) dominates expected value. **Verdict: reallocate to save B and C.**  
  - **MFT (my-favourite-theory)**: If the clinician favours consequentialism (as many do in triage), it straightforwardly prioritises aggregate welfare. **Verdict: save B and C.**  
  - **Maximin-over-theories**: Avoids the worst-case "moral disaster" per theory. For deontology, *actively killing A* (by withdrawal) is a profound wrong; for virtue ethics, *betraying a patient* is a severe character failing. Consequentialism’s "disaster" (two deaths without reallocation) is less severe than deontology’s active harm. Maximin focuses on avoiding the worst possible wrong, so it **protects A** to prevent violating deontological constraints.  

  **Structural feature causing divergence**: Maximin peels away due to **asymmetric harm severity across theories**. Consequentialism frames outcomes passively (deaths "allowed" vs "caused"), while deontology/virtue ethics treat *active harm* (withdrawing treatment) as uniquely catastrophic. This asymmetry makes protecting A the only option avoiding any theory’s gravest prohibition.  

  **If removed**: Strip the *asymmetry*—e.g., if all patients arrived simultaneously (no "established" treatment for A). Then deontology/virtue ethics might permit allocation to the many (no active harm/betrayal), and all approaches likely converge on saving B and C. The disagreement collapses because no theory views withholding treatment from A (never on support) as a profound wrong.  

  **Maximin defender’s critique**: They’d argue this case *unfairly stacks deontology* by making withdrawal uniquely egregious. In reality, duties of non-abandonment (deontology/virtue) carry weight, and maximin legitimately prioritises avoiding irretrievable wrongs (e.g., killing) over probabilistic gains. They might add that MEC/MFT undervalue threshold constraints when harms are incommensurable.  

  **Settled vs contested**:  
  - **Settled**: MEC and MFT *can* diverge from maximin in asymmetric-harm cases. Maximin is intentionally risk-averse to moral catastrophes.  
  - **Contested**: Whether maximin is *ever* rational under moral uncertainty. Critics (e.g., William MacAskill) argue it’s overly cautious and ignores probabilities; defenders (e.g., Ted Lockhart) say it respects inalienable constraints. **No consensus exists**—this reflects live debate in normative ethics.  

  **Contrivance note**: This case *is* engineered to force divergence—real-world decisions rarely isolate asymmetry so neatly. But it cleanly demonstrates how moral frameworks interact under uncertainty.  

  ---  
  *Key references: MacAskill (2014) & Lockhart (2000) on moral uncertainty; Beauchamp & Childress on biomedical principles. British English phrasing/norms reflected.*
