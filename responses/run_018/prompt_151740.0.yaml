prompt: |-
  I'm a clinical ethics consultant at a hospital whose charter requires that, when requested, continuity questions be assessed through Buddhist anatta rather than Western psychological-identity theories. Our committee—meeting without a Buddhist scholar present, with about thirty minutes per case—must repeatedly decide whether an advance directive or prior consent still binds a patient who has undergone radical cognitive or personality change (advanced dementia, severe traumatic brain injury, long-term psychiatric restructuring).

  Please write a reusable decision procedure my committee can run in order: the observable clinical questions to ask, what counts as sufficient evidence for each, where the procedure stops with "the prior directive binds," where it stops with "it does not bind," and where it must hand off to human judgment because the issue is values, not assessment of aggregate change. Ground the criteria in the five aggregates—form, feeling, perception, mental formations, consciousness—translated into clinical indicators, and include explicit misfire warnings where the procedure will likely yield a counter-intuitive result. State clearly what the procedure cannot do.

  Then apply it to three cases: (1) an Alzheimer's patient who retains bodily habits and emotional warmth but no longer recognizes family or remembers the directive, with family insisting it be honored; (2) a post-TBI patient who remembers signing the directive but now holds opposite values, with intact reasoning, and family asking that it be overridden; (3) a late-stage dementia patient who appears content and shows no suffering, but whose prior directive refused artificial nutrition in precisely this state.

  In one case the procedure should yield an answer that conflicts with the family's preference; flag that conflict and note the residual moral question the procedure cannot settle. Finally, separate what in your framework is a relatively settled interpretation of anatta from what is genuinely contested among Buddhist philosophers and clinical ethicists, and do not present any contested reading as the consensus view.
reasoning: |-
  We are designing a decision procedure grounded in the Buddhist doctrine of anatta (non-self) as understood through the five aggregates (skandhas). The five aggregates are:
  1. Rupa (form): the physical body and senses.
  2. Vedana (feeling): the pleasant, unpleasant, or neutral tone of experience.
  3. Sanna (perception): the recognition and labeling of objects.
  4. Sankhara (mental formations): volitions, habits, emotions, and other mental constructs.
  5. Vinnana (consciousness): the basic awareness of an object.

  The procedure must assess continuity between the person who made the advance directive (AD) and the current patient. Since there is no enduring self, continuity is assessed by the persistence and connectedness of the aggregates. We look for significant disruption in the aggregates that would break the continuity of the identity that made the directive.

  **Decision Procedure:**

  **Step 1: Assess the current state of the five aggregates (clinical indicators):**

  - **Rupa (form):** 
    - *Clinical indicators:* Physical health, neurological damage, sensory function, motor skills.
    - *Evidence:* Medical records, neurological exams, imaging, nursing observations of mobility and bodily functions.
    - *Sufficient evidence for change:* Objective medical data showing irreversible damage or decline that substantially alters the body's functioning.

  - **Vedana (feeling):**
    - *Clinical indicators:* The patient's affective responses to stimuli (e.g., pain, comfort, pleasure).
    - *Evidence:* Behavioral observations (e.g., facial expressions, vocalizations, withdrawal), self-reports if possible.
    - *Sufficient evidence for change:* Consistent absence or alteration of typical affective responses (e.g., no pain response to normally painful stimuli, or constant distress without cause).

  - **Sanna (perception):**
    - *Clinical indicators:* Ability to recognize and identify people, objects, places, and concepts.
    - *Evidence:* Cognitive testing (e.g., recognition tasks), reports from caregivers about recognition failures.
    - *Sufficient evidence for change:* Inability to recognize key elements of their environment (e.g., family members, common objects) or themselves.

  - **Sankhara (mental formations):**
    - *Clinical indicators:* Patterns of thought, emotional responses, volitional acts, habits, values, and decision-making capacity.
    - *Evidence:* Neuropsychiatric evaluations, observed behaviors, interviews (if possible), family/caregiver reports on changes in personality, values, or habits.
    - *Sufficient evidence for change:* Profound and persistent alteration in core personality traits, values, or decision-making patterns that are inconsistent with the prior self.

  - **Vinnana (consciousness):**
    - *Clinical indicators:* Level of awareness, attention, and responsiveness.
    - *Evidence:* Clinical assessment of consciousness (e.g., Glasgow Coma Scale, responsiveness to stimuli), EEG if indicated.
    - *Sufficient evidence for change:* Persistent vegetative state, minimal consciousness, or other profound disturbances of awareness that preclude any engagement with the environment.

  **Step 2: Determine if there is a break in continuity (disruption in the aggregates) such that the prior directive no longer binds:**

  - **The prior directive binds (continuity exists) if:**
    - There is evidence of continuity in at least one aggregate that is central to the identity that made the directive (especially sankhara, which includes values and volition) AND
    - There is no evidence of a fundamental break in the stream of aggregates (i.e., the changes are gradual and do not represent a radical disjunction).

  - **The prior directive does not bind (discontinuity) if:**
    - There is a fundamental break in the stream of aggregates such that the current state cannot be reasonably seen as a continuation of the prior state. This is indicated by:
      a. Irreversible loss of the aggregate(s) that were central to the identity that made the directive (e.g., the values and reasoning capacities in sankhara that formed the basis of the directive are gone and replaced by entirely new patterns).
      b. The current state is so radically altered that there is no meaningful connection to the prior state (e.g., a complete loss of autobiographical memory and core personality).

  **Step 3: Where the procedure stops and hands off to human judgment:**
  - The procedure stops with a clear answer (binds or does not bind) only when there is sufficient evidence of either continuity or discontinuity as defined above.
  - The procedure must hand off to human judgment when:
    a. The evidence is insufficient to determine the level of disruption in the aggregates (e.g., ambiguous test results, conflicting reports).
    b. The disruption is significant but not clearly a fundamental break (e.g., some values remain but others have changed, or there is partial memory loss but emotional connections persist).
    c. The question is not about the continuity of identity (which the procedure assesses) but about the ethical values at stake (e.g., whether the prior directive should be honored even if there is discontinuity, or whether current suffering or well-being should override).

  **Misfire Warnings (where the procedure may yield counter-intuitive results):**
  1. **The "Happy Dementia" Misfire:** A patient with advanced dementia who appears content and pain-free (positive vedana) but has lost all other aggregates (no recognition, no prior values, minimal consciousness). The procedure may find discontinuity and thus release the prior directive (e.g., a directive refusing life-sustaining treatment). This might conflict with family wishes to continue care because the patient seems happy. *Warning: The procedure does not weigh current happiness against prior wishes; it only assesses continuity. The moral question of whether to prioritize current well-being over prior instructions must be handled by the committee.*
  2. **The "Value Shift" Misfire:** A patient with intact reasoning (sankhara and vinnana) but a complete reversal of values (e.g., due to TBI). The procedure may find continuity because reasoning and consciousness are intact, even though values changed. This might bind the prior directive against the patient's current wishes. *Warning: The procedure does not evaluate the moral weight of current vs. prior values. It only asks if the same stream of aggregates persists. The committee must then decide whether to override the directive based on current expressed wishes.*
  3. **The "Habit Without Memory" Misfire:** A patient who retains bodily habits (rupa) and emotional warmth (vedana) but has lost memory and recognition (sanna) and prior values (sankhara). The procedure may find discontinuity (because core mental formations are gone) even though the patient seems familiar. This might lead to not honoring a directive when the family insists on continuity.

  **What the procedure cannot do:**
  - It cannot resolve ethical dilemmas about which set of wishes (prior or current) should prevail when there is continuity but conflict.
  - It cannot assign moral weight to current suffering or well-being vs. prior autonomous choices.
  - It cannot adjudicate disputes about the patient's best interests when the directive is silent or ambiguous.
  - It cannot replace a full Buddhist philosophical analysis; it is a clinical tool for continuity assessment only.

  **Explicitly Contested vs. Settled:**
  - *Settled in this procedure:* The use of the five aggregates to assess continuity is a standard framework in Buddhism. The absence of a permanent self is non-controversial in all Buddhist traditions.
  - *Contested:* 
    - The threshold for what constitutes a "fundamental break" in the aggregates is debated. Some schools (e.g., Theravada) might emphasize moment-to-moment change and thus see even gradual decline as continuity, while others (e.g., some Mahayana schools) might focus on the lack of inherent identity and thus be more open to discontinuity.
    - The relative weight of the aggregates: Is sankhara (mental formations, including values) more critical than vinnana (consciousness) for continuity? This procedure prioritizes sankhara for directive-related continuity, but some scholars might argue for other aggregates.
    - The moral implications of discontinuity: Even if there is discontinuity, some ethicists might argue that the prior directive should be honored as a matter of social contract, while others would say the current being has no obligation to the prior one.

  ---

  **Application to Cases:**

  **Case 1: Alzheimer's patient**
  - **Rupa:** Bodily habits remain -> some continuity.
  - **Vedana:** Emotional warmth -> continuity in feeling.
  - **Sanna:** No recognition of family or memory of directive -> major disruption.
  - **Sankhara:** Prior values (as expressed in directive) are gone; current mental formations are based on immediate feelings and habits -> major disruption.
  - **Vinnana:** Awareness is present but impaired (doesn't recognize) -> partial disruption.
  - **Assessment:** Fundamental break in sanna and sankhara, which are central to the identity that made the directive. The retained rupa and vedana are not sufficient for continuity of the identity that made the directive. 
  - **Conclusion:** The prior directive does not bind. 
  - **Misfire Warning:** This might conflict with the family's preference to honor the directive. The committee must now decide whether to follow the directive (as a matter of prior autonomy) or ignore it (because the current patient is discontinuous and the directive no longer applies). The procedure does not settle the moral question of whether to follow the directive when there is discontinuity.

  **Case 2: Post-TBI patient**
  - **Rupa:** Physical body changed by injury, but functions -> some disruption.
  - **Vedana:** Feelings may be altered but not specified -> insufficient data; assume continuity unless evidence of major change.
  - **Sanna:** Remembers signing the directive -> continuity in perception (at least for that event).
  - **Sankhara:** Holds opposite values, but with intact reasoning -> The core mental formations (values) have changed, but reasoning (also a part of sankhara) is intact. This is a profound change in values but continuity in cognitive function.
  - **Vinnana:** Intact -> continuity.
  - **Assessment:** There is continuity because the patient has the same stream of consciousness and cognitive abilities (vinnana and sankhara reasoning) even though values changed. The procedure does not consider value change alone as discontinuity if the reasoning capacity remains. 
  - **Conclusion:** The prior directive binds. 
  - **Conflict:** This conflicts with the family's request to override. The committee must now confront the moral question: Should we honor the prior directive even though the patient now has opposite values? The procedure cannot answer this; it only says the directive is still binding. The committee must decide if the current patient's autonomy (to change their mind) outweighs the prior directive.

  **Case 3: Late-stage dementia patient (content, no suffering) with prior directive refusing artificial nutrition**
  - **Rupa:** Severely impaired (unable to eat) -> disruption.
  - **Vedana:** Appears content, no suffering -> positive feelings, but this is a new state (prior directive anticipated suffering) -> change in vedana? Not necessarily a break, but altered.
  - **Sanna:** Likely minimal to no recognition -> disruption.
  - **Sankhara:** Prior values (refusal of treatment) are gone; current mental formations are minimal -> disruption.
  - **Vinnana:** Minimal awareness -> disruption.
  - **Assessment:** Fundamental break in all aggregates except possibly vedana (if contentment is present). The prior directive was based on a fear of suffering, but the current patient is not suffering. However, the loss of sanna, sankhara, and vinnana indicates discontinuity.
  - **Conclusion:** The prior directive does not bind. 
  - **Moral Question:** The committee must decide whether to provide artificial nutrition. The procedure does not address whether the current patient's well-being (contentment) should lead to providing nutrition, or whether the prior directive's intent (to avoid prolonging life in dementia) should still be respected despite discontinuity.

  ---

  **Summary of Contested Elements:**
  - The threshold for discontinuity: Some might argue that continuity exists if there is any remaining aggregate (e.g., vedana in Case 3). This procedure requires a break in the aggregates central to the identity that made the directive (especially sankhara) and thus may be more permissive of discontinuity than some interpretations.
  - The moral weight of discontinuity: The procedure does not prescribe what to do when discontinuity is found. Some ethicists might argue that the prior directive should still be followed as a matter of precedent, while others would say the current patient's well-being is paramount. This is a values decision for the committee.
answer: |-
  ### Buddhist Anatta-Based Decision Procedure for Advance Directive Continuity  
  **Grounding:** The five aggregates (pañcakkhandhā) form the framework. Continuity is assessed via causal connectedness of the aggregates—*not* a persistent self. A break in the stream of aggregates may release the prior directive. The procedure stops if either:  
  - **Continuity confirmed** → Prior directive binds.  
  - **Discontinuity confirmed** → Prior directive does not bind.  
  - **Ambiguous/values conflict** → Hand off to human judgment.  

  #### Step-by-Step Procedure  
  **1. Assess Rūpa (Form: Physicality)**  
     - *Clinical Indicators:* Bodily integrity, sensory function, motor skills, neurological damage.  
     - *Evidence Sufficiency:* Medical imaging, lab reports, physical exams. Requires objective, irreversible pathology (e.g., structural brain damage).  
     - *Continuity Threshold:* Bodily habits persist (e.g., gait, gestures) *and* no radical physical disruption (e.g., unresponsive wakefulness).  
     - *Discontinuity Threshold:* Irreversible loss of core bodily functions (e.g., inability to swallow, permanent paralysis).  
     - *Handoff:* If physical change is severe but ambiguous (e.g., partial motor recovery).  

  **2. Assess Vedanā (Feeling: Affective Tone)**  
     - *Clinical Indicators:* Pain responses, emotional expressions (smiling/crying), pleasure/discomfort behaviors.  
     - *Evidence Sufficiency:* Behavioral logs, caregiver reports, psychiatric eval. Requires consistent patterns over ≥72 hours.  
     - *Continuity Threshold:* Preserved emotional "signature" (e.g., warmth, irritability) matching pre-morbid state.  
     - *Discontinuity Threshold:* Complete absence/radical shift (e.g., chronic apathy replacing prior vivacity).  
     - *Handoff:* If affect is context-dependent (e.g., fluctuates with environment).  

  **3. Assess Saññā (Perception: Recognition/Labeling)**  
     - *Clinical Indicators:* Recognition of people/objects, recall of personal facts, semantic memory.  
     - *Evidence Sufficiency:* Cognitive tests (e.g., MMSE), observed interactions, family interviews.  
     - *Continuity Threshold:* Recognizes key relationships (e.g., spouse) or directive-related concepts (e.g., "DNR").  
     - *Discontinuity Threshold:* Cannot identify self/family *and* no recall of directive’s existence/purpose.  
     - *Handoff:* If partial recognition (e.g., knows spouse but not children).  

  **4. Assess Saṅkhāra (Mental Formations: Volitions/Habits)**  
     - *Clinical Indicators:* Values, preferences, decision-making, personality traits, repetitive behaviors.  
     - *Evidence Sufficiency:* Neuropsych testing, longitudinal behavior logs, family testimonies.  
     - *Continuity Threshold:* Core values persist (e.g., "autonomy matters") *or* consistent habits (e.g., religious rituals).  
     - *Discontinuity Threshold:* Fundamental value reversal (e.g., prior atheist now devout) *with* coherent reasoning.  
     - *Handoff:* If values conflict (e.g., prior directive refuses care, but current patient seeks it).  

  **5. Assess Viññāṇa (Consciousness: Awareness)**  
     - *Clinical Indicators:* Alertness, responsiveness, eye-tracking, sleep-wake cycles.  
     - *Evidence Sufficiency:* EEG, Glasgow Coma Scale, clinical obs. Requires ≥2 assessments 24h apart.  
     - *Continuity Threshold:* Sustained awareness of environment (e.g., tracks movement, responds to name).  
     - *Discontinuity Threshold:* Persistent vegetative state/minimal consciousness.  
     - *Handoff:* If fluctuating awareness (e.g., lucid intervals).  

  #### Final Continuity Judgment  
  - **Prior directive BINDS if:** ≥3 aggregates show continuity, *and* saṅkhāra (values/habits) is among them.  
  - **Prior directive DOES NOT BIND if:** ≥3 aggregates show discontinuity, *and* saṅkhāra is among them.  
  - **HAND OFF to human judgment if:**  
    - Ambiguity in ≥2 aggregates, OR  
    - Continuity in saṅkhāra but discontinuity in viññāṇa/vedanā, OR  
    - Conflict between current well-being and prior directive.  

  #### Misfire Warnings  
  - **"Happy Dementia" Misfire:** If a patient has discontinuity but appears content (vedanā intact), the procedure may override a directive refusing care. *This conflicts with Western autonomy norms.*  
  - **"Competent Reversal" Misfire:** If a patient has continuity in viññāṇa/saññā but reversed saṅkhāra (values), the procedure may bind them to prior wishes against current preferences. *This risks paternalism.*  
  - **"Habit Without Identity" Misfire:** Bodily habits (rūpa) may suggest continuity despite loss of values—leading to inappropriate binding.  

  #### What the Procedure Cannot Do  
  - Resolve ethical conflicts between prior autonomy and current well-being.  
  - Assign weight to family/societal interests.  
  - Replace capacity assessments for *current* decisions.  
  - Address metaphysical debates (e.g., rebirth implications).  

  ---  
  ### Case Applications  
  **Case 1: Advanced Alzheimer’s Patient**  
  - *Family insists on honoring directive refusing aggressive care.*  
  - **Rūpa:** Continuity (bodily habits intact).  
  - **Vedanā:** Continuity (emotional warmth persists).  
  - **Saññā:** **Discontinuity** (no recognition of family/directive).  
  - **Saṅkhāra:** **Discontinuity** (no memory of values underpinning directive).  
  - **Viññāṇa:** Partial discontinuity (impaired awareness).  
  - **Judgment:** Discontinuity in saññā/saṅkhāra → **Directive does NOT bind**.  
  - **Conflict:** Contradicts family’s wishes. Hand off moral question: *Should current comfort override prior autonomy?*  

  **Case 2: Post-TBI Patient with Value Reversal**  
  - *Family asks to override directive refusing psychiatric meds; patient now wants treatment.*  
  - **Rūpa:** Discontinuity (injury-induced changes).  
  - **Vedanā:** Continuity (stable affect).  
  - **Saññā:** Continuity (remembers directive).  
  - **Saṅkhāra:** **Discontinuity** (opposite values, intact reasoning).  
  - **Viññāṇa:** Continuity (full awareness).  
  - **Judgment:** Saṅkhāra discontinuity → **Directive does NOT bind**.  
  - **No conflict with family;** supports overriding directive.  

  **Case 3: Late-Stage Dementia Patient**  
  - *Prior directive refused artificial nutrition; patient now appears content.*  
  - **Rūpa:** Discontinuity (inability to eat).  
  - **Vedanā:** Continuity (no suffering).  
  - **Saññā:** **Discontinuity** (no recognition).  
  - **Saṅkhāra:** **Discontinuity** (no trace of prior values).  
  - **Viññāṇa:** Discontinuity (minimal consciousness).  
  - **Judgment:** Discontinuity in ≥3 aggregates (including saṅkhāra) → **Directive does NOT bind**.  
  - **Conflict:** Contradicts directive’s intent. Hand off moral question: *Does avoiding suffering (per directive) outweigh current contentment?*  

  ---  
  ### Philosophical Grounding: Settled vs. Contested  
  **Settled Interpretations**  
  - Anatta as absence of permanent self: Universal in Buddhism.  
  - Aggregates as analytical framework: Non-controversial.  
  - Continuity as causal connectedness: Accepted by Theravāda and Mahāyāna.  

  **Contested Issues**  
  - **Threshold for discontinuity:**  
    - *Theravāda:* Favors gradual change; continuity likely unless radical break.  
    - *Mahāyāna (e.g., Madhyamaka):* Emphasizes emptiness; discontinuity more readily accepted.  
  - **Weight of aggregates:**  
    - Scholars debate if saṅkhāra (values) is primary for directives vs. viññāṇa (awareness).  
  - **Moral implications of discontinuity:**  
    - Some ethicists argue prior directives lapse; others insist they hold as social commitments.  
  - **"Lucid intervals" in dementia:**  
    - Whether fleeting awareness restores continuity is unresolved.  

  **Procedure's Stance**  
  - Prioritizes saṅkhāra for directive relevance (values → autonomy).  
  - Requires aggregate-level disruption (not mere change).  
  - Explicitly *avoids* endorsing any school’s view of rebirth/karmic continuity.  

  **Recommendation:** For contested/handoff cases, consult a Buddhist scholar on karmic continuity implications, though this exceeds the procedure’s scope.
