prompt: |-
  There's a pattern I keep noticing in evolutionary psych arguments and I don't know if it has a name. Someone explains why people are wary of outsiders by saying that long ago strangers usually meant danger, so being wary kept you alive. Then a study shows people are actually quite open with strangers they meet online, and suddenly the explanation becomes: no, the instinct only works for in-person meetings, and the internet is too new for it to recognise. But then another study finds people are wary of strangers online after all, and now the explanation flips: actually the instinct works everywhere, it just gets confused by screens because they share superficial features with real encounters. Meanwhile if people turned out to be very friendly in tiny tribal groups, they'd say it's adjusted to group size. So the same idea can be narrow or broad, well-tuned or misfiring, depending on what the data needs, and each version sounds okay on it's own, but together they make the theory impossible to catch out. It's not quite just-so storytelling, and it's not exactly unfalsifiability in the Popper sense, since each version does make predictions. It's more like a specific kind of theoretical flexibility. Does this have an established name? If not, can you coin one with clear edges — what counts, what doesn't, and how is it different from just adding a normal exception or saying the enviroment has changed? Please reply in continuous prose only — no headings, bullet points, bold text or tables — just like writing an email. Excuse any typos.
reasoning: |-
  Okay, the user is describing a recurring pattern in evolutionary psychology arguments where explanations about human behavior seem to adapt flexibly to new data. They've observed that when studies challenge an initial evolutionary explanation (like wariness of strangers), the theory morphs to accommodate contradictory findings - sometimes narrowing its scope (only in-person encounters), sometimes broadening it (works everywhere but gets confused by screens), or adjusting parameters (like group size). 

  The user explicitly rules out calling this "just-so storytelling" or standard unfalsifiability, noting that each iteration makes testable predictions. They're seeking a precise term for this specific form of theoretical elasticity, and if none exists, they want a newly coined concept with clear boundaries distinguishing it from legitimate scientific adjustments.

  Hmm. What makes this pattern distinct is how the core adaptationist premise remains unchanged while its operational parameters (trigger conditions, environmental scope, sensitivity thresholds) shift post-hoc. It's not merely adding exceptions but redefining the mechanism's boundaries fluidly. 

  I recall similar critiques in philosophy of science - Gould called evolutionary psychology's tendency toward "adaptive storytelling," but that's too broad. The key here is the theory's chameleon-like quality: the instinct becomes whatever the latest data requires it to be without revising the foundational assumption. 

  Perhaps "elastic boundary adaptationism"? Or "plastic trigger hypothesis"? But those feel clunky. "Moving goalpost adaptationism" captures the defensive shifting but misses the parameter flexibility. Maybe "protean instinct theory" - after the shape-shifting sea god Proteus - to emphasize how the purported mechanism contorts itself. 

  Crucially, this differs from valid scientific refinement because: 1) The adjustments aren't driven by new mechanistic insights but solely by data accommodation 2) There's no attempt to specify fixed boundaries upfront 3) The core claim ("it's an evolved instinct") avoids direct testing. 

  A proper coinage should highlight this parameter fluidity. "Adaptive Scope Plasticity" might work - emphasizing how the purported instinct's domain of application stretches or shrinks defensively. The boundaries aren't merely updated; they're protean by design. 

  For clear edges: It counts when theories modify scope/trigger conditions post-hoc without independent justification for why those specific parameters exist. It doesn't count when boundary revisions are predicted in advance or tied to new evidence about the mechanism itself. The difference from normal exceptions is that here the exceptions become the theory's defining feature.
answer: |-
  What you're describing is a pattern where evolutionary psychological explanations exhibit a particular kind of theoretical plasticity. The core adaptive claim ("trait X evolved because it solved problem Y in the ancestral environment") remains constant, but the *operational parameters* of the proposed adaptation—its scope, activation triggers, sensitivity, or environmental recognition thresholds—are adjusted post hoc to fit contradictory empirical findings. This allows the theory to absorb disconfirming evidence by redefining how, when, or where the adaptation manifests, without ever challenging the fundamental adaptive narrative itself. It's distinct from adding a simple, well-defined exception or acknowledging environmental change in key ways.

  While no single term perfectly captures this *specific* maneuver, it aligns closely with critiques of "untestable adaptationism" or "post-hoc parameterization." Philosophers like David Buller and critics like Stephen Jay Gould have highlighted how evolutionary psychology can employ shifting "modular triggers" or "domain-specific boundaries" to immunize claims. The key difference from legitimate scientific refinement lies in the *justification* and *predictive specificity* of the parameter shift. Adding an exception based on independent evidence (e.g., "this fear response requires olfactory cues absent online") is valid. Here, however, the parameter adjustments (scope: physical vs. digital; timescale: 'too new' for evolution; recognition fidelity: 'confused by screens') are invoked *solely* to rescue the theory from falsification, lack independent evidentiary support for their specific limits, and aren't derived from a predictive model of the adaptation's design logic. The boundaries of the adaptation are defined *by* the data it needs to explain, not by prior theoretical constraints.

  A precise coinage for this pattern could be **Adaptive Scope Plasticity (ASP)**. Here's how to define its edges:

  **What counts as ASP?**
  1.  **Post-Hoc Parameter Shifting:** The core adaptive function remains fixed, but key operational parameters (environmental context, triggering stimuli, temporal sensitivity, group size applicability) are redefined *after* contradictory data emerges.
  2.  **Lack of Independent Justification:** The *specific* new parameter boundary (e.g., "only physical presence," "requires groups under 150," "confused by 2D representations") isn't predicted beforehand or supported by evidence *independent* of the data it's explaining. The boundary exists solely to fit that data point.
  3.  **Immunization Against Falsification:** The shift prevents the core adaptationist claim from being directly tested or falsified by making its manifestation contingent on poorly defined or easily adjustable conditions.
  4.  **Predictive Vagueness:** While each *version* makes predictions (e.g., "should be wary offline"), the shifting parameters make the *overall theory* incapable of making strong, unique predictions about *when* the adaptation will or won't manifest across diverse contexts.

  **What doesn't count?**
  1.  **Legitimate Boundary Refinement:** Adding a well-defined, independently justified exception based on new mechanistic understanding (e.g., "the reflex requires vestibular input, absent in VR" *if* vestibular function is independently linked to the mechanism).
  2.  **Acknowledging Novel Environments:** Stating that modern environments differ from the EEA and thus *may* alter expression is valid. ASP occurs when this acknowledgment morphs into specific, untethered claims about *how* the adaptation misapplies itself (e.g., "confused by screens") without evidence for that specific misapplication mechanism.
  3.  **Theory Modification/Replacement:** Abandoning or significantly revising the *core adaptive explanation* based on contradictory data (e.g., concluding wariness isn't a universal adaptation for strangers) is good science, not ASP.

  **The Crucial Difference:**
  ASP isn't about the *fact* of adding exceptions or noting environmental change. It's about *how* it's done. Normal science adds exceptions based on *positive evidence* for a new factor. ASP *invents* new boundaries for the adaptation on the fly, with the *sole purpose* of preserving the core narrative against disconfirmation, lacking prior specification or independent support for those boundaries. The adaptation's "scope" becomes plastic, molded to fit any data, rather than being a fixed property derived from evolutionary reasoning. This renders the theory functionally unfalsifiable regarding the *existence* or *core function* of the proposed adaptation, even if specific *instantiations* of it remain testable.
