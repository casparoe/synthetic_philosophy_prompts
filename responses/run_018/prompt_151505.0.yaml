  I run a philosophy of biology seminar for sixteen graduate students, with one seventy-five-minute session available. Design a runnable classroom simulation — using only paper cards, a whiteboard, and point-based payoffs, with no real money — that makes participants run into the problem themselves: they must discover that a trait’s narrow-sense heritability coefficient is not an intrinsic property of the trait but a relational property of the population and its environment, and that gene-environment covariance can be generated by the very structure of pairing and selection they perform. In Round One, environments are assigned randomly and participants analyse heritability (approximately 0.7); in Round Two, they choose pairings and environments based on observed phenotypes, unknowingly creating gene-environment correlation that collapses the coefficient to approximately 0.3 despite an unchanged gene pool. Include explicit rules, card layouts, the payoff scheme, a debrief that maps each round onto the distinction between variance partitioning and individual causal determination, an honest note on which feature of quantitative genetics the simulation necessarily misrepresents, and a frank prediction of what will fail the first time you run it. The idea must emerge from the rules and incentives, not from facilitator explanation. Do not request bibliographies, citations, or reading lists. Lead with the bottom line in the first sentence — state the core rule structure and the hidden twist — then provide the full design and reasoning, with no preamble and no restating of the question.
