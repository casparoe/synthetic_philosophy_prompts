       - 16 environment cards: 4 of each (E1:-20, E2:-5, E3:10, E4:30). Write the value on the card.

     Round1:
       1. Shuffle the environment cards and hand one to each participant along with their genotype card (which are fixed and assigned by the facilitator to have 4 of each).
       2. Each participant computes their phenotype (G+E) and writes it on a whiteboard in a table (or reports to the facilitator who writes it).
       3. Compute the mean and variance of the entire population for G, E, and P.
          - To compute variance: 
               Var(X) = (sum of (X_i - mean)^2) / N   (population variance)
          - We do this for G, E, and P. We are interested in Var(P) and Var(G).
          - Heritability h^2 = Var(G) / Var(P)

     Round2:
       1. Rank participants by Round1 phenotype (highest to lowest). In case of tie, randomize.
       2. Starting with the highest, each participant chooses an environment card from the available set (which initially has 4 of each type). 
          - We must have the environment cards available for choosing (so we collect them after Round1 and then put them back in a pool for Round2? but note: in Round2 they are choosing again, so we have the same 16 cards).
       3. After everyone has chosen, they compute their new phenotype (same G as before, plus the new E).
       4. Record the new phenotypes and compute the variance of P in Round2 and the heritability (again, Var(G) is the same as before, but now we have a new Var(P2)).

     Debrief:
       - Explain the variance partitioning in Round1: 
            Var(P) = Var(G) + Var(E)   (because Cov(G,E)=0)
            h^2 = Var(G)/Var(P) ≈ 0.6

       - In Round2: 
            Var(P2) = Var(G) + Var(E2) + 2*Cov(G, E2)
            The covariance term is positive because individuals with high G tended to choose high E (and vice versa). 
            Therefore, even though Var(G) is the same, the total variance is larger and the proportion due to G is smaller (≈0.3).

       - The key lesson: 
            1. Heritability is a population statistic that depends on the distribution of environments and the covariance between genes and environment.
            2. When individuals with certain genes are more likely to end up in certain environments (gene-environment covariance), it affects the heritability coefficient.

       - Map to the distinction between variance partitioning and individual causal determination:
            - Variance partitioning: we are decomposing the variance in the population. This does not tell us about the causal effect of genes for an individual. For an individual, the phenotype is determined by both genes and environment. But the relative contribution in the population (as measured by heritability) can change if the distribution of environments changes.
            - The simulation shows that the same trait in the same population can have different heritabilities in different environmental assignment regimes.

     Note: We have not changed the gene pool (the same individuals with the same genotypes) and we have the same set of environments. Only the pairing of genes and environments changed.

     Final note: The simulation is runnable in 75 minutes:
          - Introduction and setup: 10 minutes
          - Round1: 10 minutes (assign, compute, record, calculate variance and h^2)
          - Round2: 15 minutes (rank, choose, compute, record, calculate)
          - Debrief: 40 minutes (discussion of the results and the concepts)

     We assume that the facilitator will do the variance calculations quickly (or have a helper). Alternatively, we can precompute the expected variances and then compare with the actual.

     Let's hope it works!
answer: |-
  ### Core Rule Structure and Hidden Twist  
  Participants pair genotypes (G) with environments (E) to maximize phenotypic payoffs (P = G + E). In **Round 1**, environments are assigned randomly; in **Round 2**, participants *choose* pairings based on observed phenotypes, unknowingly creating gene-environment covariance that collapses heritability.  

  ---

  ### Simulation Design  
  **Materials**:  
  - **Genotype cards** (16 total): 4 cards each of G1=20, G2=40, G3=60, G4=80.  
  - **Environment cards** (16 total): 4 cards each of E1=-20, E2=-5, E3=10, E4=30.  
  - **Whiteboard** to record phenotypes and calculate variances.  
  - **Payoffs**: Points = phenotype value (P) each round. Total payoff = Round 1 P + Round 2 P.  

  **Setup**:  
  - Assign each participant one genotype card (secretly).  
  - Shuffle environment cards.  

  ---

  ### Rules  
  **Round 1 (Random Pairing)**:  
  1. Randomly distribute one environment card to each participant.  
  2. Each calculates phenotype: **P = G + E**.  
  3. Record all (G, E, P) on whiteboard.  
  4. Facilitator calculates:  
     - Mean P, variance of P (Var(P)), variance of G (Var(G)).  
     - **Heritability**: \( h^2 = \frac{\text{Var(G)}}{\text{Var(P)}} \) (≈0.6).  

  **Round 2 (Strategic Pairing)**:  
  1. **Rank participants** by Round 1 P (highest to lowest).  
  2. **Choose environments in rank order**:  
     - Highest rank picks first (any available E card), then next, until all chosen.  
     - Limited E cards: Only 4 of each type (first-come, first-served).  
  3. Each calculates new phenotype: **P = G (same) + E (new)**.  
  4. Record all (G, E, P) on whiteboard.  
  5. Facilitator calculates:  
     - New Var(P) and Var(G) (unchanged).  
     - **Heritability**: \( h^2 = \frac{\text{Var(G)}}{\text{Var(P)}} \) (≈0.3).  

  **Payoffs**:  
  - Points = P each round. Goal: Maximize cumulative points.  

  ---

  ### Why It Works  
  - **Round 1**: Random E → no gene-environment covariance.  
    - Phenotype variance: **Var(P) = Var(G) + Var(E)**.  
    - \( h^2 ≈ \frac{500}{500 + 344} ≈ 0.6 \) (using example values).  
  - **Round 2**: Strategic choices → gene-environment *covariance*.  
    - High-G participants (P1 leaders) pick high-E (e.g., E4=30).  
    - Low-G participants get low-E (e.g., E1=-20).  
    - Phenotype variance: **Var(P) = Var(G) + Var(E) + 2\text{Cov}(G,E)**.  
    - Covariance (Cov) is *positive* → inflates Var(P).  
    - \( h^2 ≈ \frac{500}{500 + 342 + 2 \times 412} ≈ \frac{500}{1667} ≈ 0.3 \).  

  ---

  ### Debrief: Key Lessons  
  1. **Variance Partitioning ≠ Causal Determination**:  
     - *Round 1*: \( h^2 \) partitions variance into G/E *assuming no covariance*.  
     - *Round 2*: Covariance (Cov(G,E)) emerges from behavior, making \( h^2 \) drop.  
     - **Heritability is relational**: Depends on *how G and E correlate* in the population.  

  2. **Gene-Environment Covariance**:  
     - Created by pairing structure: High-G agents *select* high-E.  
     - Not intrinsic to the trait—arises from population-level decisions.  

  ---

  ### Honest Misrepresentation  
  - **Simplified Genetics**: Assumes purely *additive* effects (P = G + E). Ignores:  
    - Gene-gene interactions (epistasis).  
    - Gene-environment interactions (G×E).  
    - Non-random mating (affects allele frequencies).  

  ---

  ### Prediction of First-Run Failure  
  - **Ranking Disruptions**: Random E in Round 1 may cause *misranking* (e.g., high-G + low-E appears low-P).  
    - High-G agents with bad luck (low P1) choose late → get worse E → weakens covariance.  
    - **Result**: \( h^2 \) in Round 2 may be >0.3 (e.g., 0.4), but still drops significantly from Round 1.  
    - **Fix**: Emphasize this imperfection as a teaching moment—real populations have noise!  

  ---

  ### Facilitator Script (No Explanations During Game)  
  - **Start**: "Maximize your payoff (P = G + E). Round 1: Random E. Round 2: Pick E based on Round 1 rankings."  
  - **After Round 1**: "Record P. Calculate heritability: \( h^2 = \frac{\text{Var(G)}}{\text{Var(P)}} \)."  
  - **After Round 2**: "Record new P. Recalculate heritability. Discuss why \( h^2 \) changed."  
  - **Debrief Questions**:  
    - "Why did the same trait’s heritability drop?"  
    - "How did your choices create gene-environment covariance?"  

  The discovery emerges from incentives: Maximizing P in Round 2 *requires* high-G agents to exploit high-E, collapsing \( h^2 \).
