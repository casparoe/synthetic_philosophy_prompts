answer: |-
  ### Decision Procedure for Logical Confidence Assessment  
  **Time Limit:** 60 minutes per claim.  
  **Core Principles:**  
  - Distinguish "no trader disproof" (absence of evidence) from "positive evidence" (syntactic/structural support).  
  - Escalate self-referential, unbounded, or ambiguous claims.  
  - Use quick syntactic checks (Synthetic Trader Budget) and historical data (Reference Class) to estimate credence.  

  ---

  ### Checklist Procedure  
  **Ordered Steps:** Proceed to the next step only if the current step is inconclusive. Stop early if a decision is reached.  

  #### **Step 1: Deferral Conditions**  
  - **Question:** Does the claim reference its own verification status (e.g., "this claim is unprovable")? Or does it use unbounded quantifiers (e.g., `∀x∈String`, `∃n∈ℕ`) where the domain exceeds sizes in our reference class?  
  - **Good Enough Answer:**  
    - **YES** → **Defer to senior**. (Self-reference risks paradoxes; unbounded domains lack historical anchors.)  
    - **NO** → Proceed to Step 2.  

  #### **Step 2: Synthetic Trader Budget (STB)**  
  - **Time Allocated:** 10 minutes.  
  - **Actions:**  
    - Run bounded contradiction checks (e.g., SAT solver on propositional abstraction of the claim).  
    - Search for small counterexamples (e.g., test `n=0,1,...,100` for loop invariants; bounded model checking with depth ≤ 5).  
  - **Good Enough Answer:**  
    - **Contradiction/counterexample found** → **Reject (≤20% confidence)**.  
    - **None found** → Proceed to Step 3.  
  - **Rationale:** Absence of disproof ≠ proof. STB only rules out blatant falsehoods.  

  #### **Step 3: Reference Class (RC) Comparison**  
  - **Question:** How does this claim’s structure (symbol count, quantifier depth, key operators) compare to past verified/invalidated claims?  
  - **Method:**  
    - Extract features: Number of quantifiers, logical operators (e.g., `∀`, `→`, `¬`), and "complexity score" (e.g., `symbol_count × quantifier_depth`).  
    - Match against database of past claims (e.g., 5 most similar by cosine similarity).  
  - **Good Enough Answer:**  
    - **≥80% of similar claims verified** → **High confidence (≥70%)**.  
    - **≥80% of similar claims invalidated** → **Low confidence (≤30%)**.  
    - **Inconclusive (mixed/no matches)** → Proceed to Step 4.  
  - **Rationale:** Leverages historical patterns but may misfire on novel contradictions.  

  #### **Step 4: Empirical-Logical Mix Assessment**  
  - **Question:** Does the claim blend empirical data (e.g., "tested on 10,000 inputs") with logical deduction (e.g., "therefore, holds universally")?  
  - **Method:**  
    - Check if empirical coverage is "significant" (e.g., ≥1% of the finite space or representative corner cases).  
    - Verify no empirical counterexamples exist.  
  - **Good Enough Answer:**  
    - **Strong empirical support + no counterexamples** → **Medium confidence (50%)**.  
    - **Weak/no empirical support** → Proceed to Step 5.  
  - **Rationale:** Empirical data alone cannot prove universals; but may boost credence for finite cases.  

  #### **Step 5: Large Finite Domain Heuristic**  
  - **Question:** Is the domain huge but finite (e.g., `n < 2^64`)? Does the claim admit decomposition (e.g., induction)?  
  - **Method:**  
    - Test base cases (e.g., `n=0`) and one step of induction (e.g., `I(k) → I(k+1)`).  
    - If infeasible, check monotonicity (e.g., "fails at `n=k` → fails at `n>k`").  
  - **Good Enough Answer:**  
    - **Base/step checks pass** → **Medium confidence (60%)**.  
    - **Fails or inconclusive** → **Defer to senior**.  
  - **Rationale:** Partial induction suggests but doesn’t guarantee truth.  

  #### **Step 6: Final Decision**  
  - **Unresolved after Steps 1–5** → **Defer to senior**.  
  - **Conflicts** (e.g., STB passes but RC is low) → **Escalate to senior** (values judgment).  

  ---

  ### Procedure Applied to Client Proposals  
  #### **Proposal 1:**  
  *"The loop invariant `I(n)` holds for all `n < 2^64` in this binary search routine."*  
  1. **Step 1:** Bounded quantifier (`n < 2^64`). Proceed.  
  2. **Step 2 (STB):** No contradiction for `n=0..100`. Proceed.  
  3. **Step 3 (RC):** Similar to past verified binary search invariants (high symbol count, 1 quantifier). → **High confidence (✓)**.  
  4. **Stop.** Client-friendly.  
  - **Risk:** If `I(n)` hides a contradiction (e.g., overflow at `n=2^63`), STB/RC may miss it.  

  #### **Proposal 2:**  
  *"The formal spec `S` logically implies termination for every input, even though we haven’t run the checker."*  
  1. **Step 1:** Unbounded quantifier (`every input`). → **Defer to senior (⛔)**.  
  - **Why:** Unbounded domains lack reference data; no induction possible. Client-unfriendly but necessary.  

  #### **Proposal 3:**  
  *"There exists a counterexample to the invariant with exactly 17 nested recursive calls."*  
  1. **Step 1:** Bounded (17 calls). Proceed.  
  2. **Step 2 (STB):** Search for counterexamples at depth ≤5. None found. Proceed.  
  3. **Step 3 (RC):** Similar to past existential claims (e.g., "counterexample at depth k"). 80% were false due to sampling bias. → **Low confidence (≤30%) (✗)**.  
  4. **Stop.** Client won’t like this.  
  - **Why:** STB absence ≠ proof of absence. RC penalizes high-complexity existential claims.  
  - **Misfire:** If a counterexample exists at depth 17 but is rare, RC may mislead.  

  ---

  ### Limitations and Failure Modes  
  1. **Syntactic Similarity Risks:**  
     - Novel contradictions (e.g., disguised paradoxes) may evade RC if past claims were "similar but safe."  
  2. **Trader Budget Gaps:**  
     - Polynomial-time STB cannot explore exponential spaces (e.g., 17 recursive calls). "No disproof" may be confused with evidence for truth.  
  3. **Empirical-Logical Confusion:**  
     - Empirical data may inflate confidence for non-inductive claims (e.g., Proposal 1 with sparse testing).  
  4. **Unresolvable Cases:**  
     - Self-referential claims (deferred in Step 1).  
     - Conflicts between equally weighted RC/STB results (escalated).  
     - Claims requiring game-theoretic equilibrium (e.g., mutual references between two systems).  

  **Deliverable Summary:** A junior auditor can run this in 60 minutes. It flags:  
  - **Defer/Escalate:** Unbounded/self-referential claims (Proposal 2), or unresolved conflicts.  
  - **Low Confidence:** High-risk existentials (Proposal 3) or RC-weak claims.  
  - **High Confidence:** Structurally sound, historically supported universals (Proposal 1).  

  > **Final Note:** This heuristic is not a proof system. It estimates credence under uncertainty—not truth.
