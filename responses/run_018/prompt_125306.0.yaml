  We are designing a decision procedure for assigning credences to logical claims under time constraints, based on ideas from logical induction and logical uncertainty. The procedure must be executable within 60 minutes and usable by junior auditors without a PhD. It will consist of a checklist with specific steps, criteria for proceeding, and points where we must defer or escalate.

  Key components:
  1. **Synthetic Trader Budget (STB):** Quick syntactic checks and bounded counterexample searches. We allocate a fixed time (e.g., 10 minutes) for these.
  2. **Reference Class (RC):** Compare the current claim to a database of past claims (verified and unverified) based on syntactic features (symbol count, quantifier structure, etc.). We require a minimal threshold of similarity to past claims that were verified.

  The checklist must handle:
  - Claims that are syntactically similar but hide a contradiction.
  - Huge finite search spaces (where polynomial-time methods haven't found a counterexample).
  - Mixing empirical data with logical consequence.
  - Preserve the distinction between "the market hasn't priced this low" (i.e., no evidence against) and "we have positive evidence for".

  Additionally, we build in automatic deferral for:
  - Self-referential claims (e.g., referencing their own verification status).
  - Unbounded quantification over very large or unbounded domains (beyond our reference class).

  The procedure outputs a confidence level (e.g., high, medium, low) or a decision to defer or escalate.

  ---

  **Checklist Procedure:**

  **Step 1: Pre-filter for Deferral Conditions**
     - **Question:** Does the claim reference its own verification status (e.g., "this claim is unprovable")? Or does it involve unbounded quantification over a domain (e.g., strings, integers) that exceeds the maximum size in our reference class? (We maintain a reference class database with maximum observed sizes for quantified variables, e.g., if we've only seen up to 2^30, then 2^64 is too big.)
     - **Good enough:** If yes to either, then **defer to senior**.
     - **Why:** Self-reference can lead to paradoxes and is beyond the scope of automated checks. Unbounded quantification beyond our reference class means we don't have comparable past data.

  **Step 2: Syntactic Trader Budget (STB)**
     - **Allocate Time:** 10 minutes maximum.
     - **Actions:**
          a. **Contradiction Search:** Run quick syntactic checks (e.g., using a SAT solver for propositional abstractions, or pattern matching for known contradictions) on a bounded version of the claim (e.g., bound the quantifiers to small finite domains, say up to 2^10). Also, look for syntactic patterns that often lead to contradictions (e.g., self-referential structures, fixed-points, or known problematic patterns from a list).
          b. **Counterexample Patterns:** For claims about programs, try generating small counterexamples (e.g., for n=0,1,...,100 in a loop invariant) using a bounded model checker or symbolic execution (with very low bounds).
     - **Criteria:**
          - If a contradiction is found, then **reject (low confidence)**.
          - If a counterexample is found, then **reject (low confidence)**.
          - If no contradiction or counterexample is found, proceed to Step 3.
     - **Note:** This step does not provide positive evidence; it only looks for refutations. The absence of a counterexample in small cases is weak evidence.

  **Step 3: Reference Class (RC) Comparison**
     - **Question:** Compare the current claim to a database of past claims (with known outcomes: verified true or false) based on:
          - Symbol count (operators, quantifiers, etc.)
          - Quantifier structure (e.g., number of quantifiers, their alternations, boundedness)
          - Key vocabulary (e.g., the same functions, predicates, or constants)
          - Claim type (e.g., loop invariant, termination, etc.)
     - **Method:** Use a similarity metric (e.g., Jaccard similarity on tokenized symbols, or a precomputed feature vector) to find the k-nearest neighbors (k=5, for example) in the reference class.
     - **Criteria:**
          - If at least 3 of the 5 most similar claims were verified true, then assign **high confidence**.
          - If at least 3 of the 5 most similar claims were verified false, then assign **low confidence**.
          - If the similarity is too low (e.g., no neighbor with similarity above a threshold, say 0.5) or the outcomes are mixed (not meeting the above), then proceed to Step 4.
     - **Note:** This step relies on historical data. If the database is small, this step may be skipped (but we assume a growing database).

  **Step 4: Empirical and Logical Mix (if applicable)**
     - **Question:** Does the claim mix empirical data (e.g., runtime observations) with logical consequence? (e.g., "Based on 1000 test runs and the code structure, the invariant holds.")
     - **Actions:**
          - If the claim has an empirical component, check the quality of the empirical data (e.g., sample size, coverage). Also, check if the logical part is consistent with the data (e.g., no counterexample in the data). If the empirical part covers a significant portion of the input space (e.g., >1% of a finite space) and the logical part is simple (e.g., passed Step 2), then assign **medium confidence**.
