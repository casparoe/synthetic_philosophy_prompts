  For Neo's journey: His initial life in the Matrix is eikasia—he's immersed in the simulation without questioning. The red pill choice represents his realization that reality is false, moving him into pistis as he starts to believe in a deeper truth. The training programs, especially the jump program failure and the sparring with Morpheus, show dianoia—Neo understands the Matrix's rules intellectually but can't fully apply them. The code-vision scenes are key here; seeing the Matrix as code is dianoia, grasping the underlying structure mathematically. 

