  Ah, the key here is conditionalization. The user might be missing that reflection requires anticipating rational updating. If you know you'll get evidence, your future credence changes based on that. The principle doesn't apply when you expect new information. The user's coin flip example is perfect. If you know you'll see 100 flips, reflection doesn't force you to have 0.9 credence now. Instead, your current credence should be the weighted average of possible future credences, considering all evidence you might get. 

