  Also, the user asks about settled vs. contested points. It's settled that reflection doesn't block learning. The conditions under which it applies—no anticipated evidence changes—are agreed upon. But there's debate on whether it should also constrain beliefs about others or less rational future selves. Some like Briggs extend it, but that's contested. 

