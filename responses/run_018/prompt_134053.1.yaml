  Okay, the user is a philosopher of science deeply engaged in a debate about whether cognitive science explanations of morality are reductionist or if critics are invoking skyhooks. They want a systematic breakdown of what makes a theory of normative capacity a legitimate crane. 

  First, I need to unpack what a "crane" means here—Dennett's metaphor for step-by-step naturalistic explanation without magical skyhooks. The core challenge is explaining normativity without reducing it to non-normative parts or smuggling in unexplained elements. 

  The user’s five specific issues are complex. Let me tackle them one by one. The scaffolding paradox is tricky: how can lower mechanisms (like reputation tracking) build normativity if they already seem to presuppose it? A crane must resolve this circularity without cheating. Maybe through iterative bootstrapping—where proto-normative behaviors gradually refine into full normativity via feedback loops. 

  Reflexive cranes are another headache. If a mechanism borrows from the level it’s explaining (e.g., moral reasoning relying on existing norms), is that circular? I think it’s tolerable if there’s a clear transition from implicit to explicit, avoiding infinite regress. 

  Ontological vs. explanatory reduction is key. Greedy reductionism flattens everything, losing normativity. A crane must preserve normative properties as real emergent features, not just redescribe them. 

  Cross-cultural disagreement needs handling without skyhooks or relativism. The solution might lie in procedural norms—how communities correct errors through dialogue, anchored in shared capacities but not transcendent truths. 

  Empirical equivalence with standard evolutionary psych? Not binding. Cranes can—and should—go beyond adaptationist just-so stories if they better explain moral phenomenology. 

  Now, desiderata. Non-negotiables: no skyhooks, preserve normativity, resolve circularity, fit empirical data. Negotiable: specific mechanisms (e.g., exact evolutionary pathways). The scaffolding paradox is the biggest filter—it trips up many popular theories. 

  Assessing existing frameworks: 
  - Evolutionary game theory often commits greedy reductionism (norms as mere fitness strategies). 
  - Dual-process models might handle reflexivity better but risk explanatory gaps. 
  - Normativist-emergence views respect normativity but sometimes handwave the bootstrapping. 

  The user’s fatigue suggests they need clarity, not more debate. I’ll emphasize which demands are substantive (e.g., resolving circularity) versus tribal (e.g., insisting on strict adaptationism). The real tension? Satisfying all non-negotiables might require novel models—but it’s not impossible, just hard.
answer: |-
  Here’s a systematic breakdown of the desiderata for a legitimate crane-based account of moral cognition, followed by an evaluation of major frameworks against these criteria. The goal is to distinguish robust naturalistic explanations from greedy reductionism or skyhook smuggling.

  ### **Core Crane Requirements**  
  A legitimate crane must:  
  1. **Preserve normativity** (non-negotiable): Moral judgments must retain *genuine ought-ness* (e.g., "torture is wrong" isn’t reducible to "I dislike torture").  
  2. **Avoid teleology/preformation** (non-negotiable): No invoking "proto-moral" capacities that tacitly assume the endpoint (e.g., "genes for fairness").  
  3. **Be compositionally explicable** (non-negotiable): Show how normative properties arise from non-normative biological/cognitive components via *iterative feedback*.  
  4. **Respect multiple realizability** (negotiable): Moral cognition shouldn’t require specific neural structures but must fit known constraints (e.g., no cortex-independent moral reasoning in humans).  

  ---

  ### **Desiderata with Motivating Cases**  
  1. **Scaffolding Paradox**  
     - **Requirement**: Must resolve circularity (non-negotiable).  
     - **Motivation**: If mind-reading "scaffolds" normativity but itself requires understanding obligations (e.g., "X believes she *should* share"), the explanation collapses.  
     - **Resolution**: The crane must show how *proto-normative* feedback loops (e.g., reward prediction errors in reinforcement learning) bootstrap into full normativity via social interaction. Example: Emotional aversion to inequity (in primates) becomes "unfair" through linguistic labeling and group enforcement.  

  2. **Reflexive Cranes**  
     - **Requirement**: Tolerate only if *asymmetric dependence* exists (non-negotiable).  
     - **Motivation**: Moral reasoning *uses* existing norms but can’t *originate* from them without regress (e.g., "I follow norms because of norms").  
     - **Resolution**: Allow low-level mechanisms (e.g., oxytocin-mediated trust) to ground reflexivity. Later-stage cognition *borrows* from these but doesn’t constitute them. What hangs: Avoiding infinite regress while explaining moral self-correction.  

  3. **Ontological Reduction vs. Explanatory Delegation**  
     - **Requirement**: Distinguish them (non-negotiable).  
     - **Motivation**: Greedy reductionism conflates "morality is *realized by* neural processes" (ontological) with "morality is *nothing but* neural processes" (explanatory). This erases normativity.  
     - **Preservation**: A crane must show how delegation to subsystems (e.g., emotion regulating rule application) *constitutes* moral judgment without eliminating its binding force.  

  4. **Cross-Cultural Revision & Error Correction**  
     - **Requirement**: Explain revision without transcendence or relativism (non-negotiable).  
     - **Motivation**: Societies abandon norms (e.g., slavery) claiming *error*, not mere preference change. But appealing to "natural law" is a skyhook.  
     - **Resolution**: Anchor correction in *procedural norms* emerging from crane mechanisms (e.g., impartiality constraints in collective bargaining). Error = violation of bootstrapped epistemic/moral heuristics (e.g., consistency under veil-of-ignorance reasoning).  

  5. **Empirical Equivalence with Evolutionary Psychology (EP)**  
     - **Requirement**: Not binding (negotiable).  
     - **Motivation**: Standard EP often reduces norms to fitness optimization (e.g., reciprocity = tit-for-tat). A crane may reject this if it better explains moral phenomenology (e.g., impartial altruism). Constraint: Must fit fossil/genomic timelines (e.g., no morality before *H. heidelbergensis* cooperation).  

  ---

  ### **Tensions & Deal-Breakers**  
  - **Joint unsatisfiability?** Preserving normativity (*1*) while avoiding circularity (*Scaffolding Paradox*) is the hardest challenge. Many accounts sacrifice one for the other.  
  - **Key filter**: The *Scaffolding Paradox* excludes most popular contenders by exposing circular presuppositions.  
  - **Non-negotiable core**: Any account that reduces "ought" to "is" (greedy) or invokes unexplained normative primitives (skyhook) fails.  

  ---

  ### **Evaluation of Existing Frameworks**  
  1. **Evolutionary Game Theory (EGT)**  
     - *Strengths*: Explains stability of norms (e.g., punishment) via lower-level selection.  
     - *Fails*: Scaffolding paradox (equilibria presuppose players understand "should"); reduces moral error to payoff miscalculation; greedy re: normativity.  

  2. **Dual-Process Models**  
     - *Strengths*: Delegates emotion/intuition (System 1) and reasoning (System 2) without ontological collapse.  
     - *Fails*: Often treats System 1 as "innate morality" (skyhook); struggles with reflexivity (System 2 may parasitize cultural norms).  

  3. **Normativist-Emergence Views**  
     - *Strengths*: Best at preserving normativity via irreducibly social practices; handles error correction (norms revised immanently).  
     - *Fails*: Risk skyhooks by under-specifying cognitive mechanisms; may ignore biological constraints (e.g., minimal theory of mind required).  

  ---

  ### **Conclusion**  
  A viable crane must resolve the **scaffolding paradox through bootstrapped emergence**—e.g., affective responses gaining normative weight via collective intentionality. Non-negotiables are: anti-reductionism about normativity, circularity resolution, and naturalistic error correction. The **demand for strict empirical parity with adaptationist EP is negotiable** (and often a prejudice of that camp). While tensions exist, no desideratum is inherently unsatisfiable; the challenge is empirical refinement, not conceptual impossibility. Current leaders are hybrid models (e.g., emotional intuition + structured deliberation), but all need stronger cranes for the scaffolding problem.
