prompt: |-
  I'm a student in an upper-level philosophy of science course, and I've noticed a recurring argumentative pattern that I can't quite place within the standard taxonomy we've studied. I want to describe it concretely, ask whether it has an established name, and—if not—have it carved out precisely.

  Here is the pattern, observed in debates about induction and theory revision. A theory initially claims to predict a certain effect across a broad range of conditions. After a counterexample appears, defenders do not abandon the core claim; instead they append a scope restriction—say, that the effect holds except when parameter X is present. Crucially, the boundary for X is placed near the failing case, and X is defined using conceptual resources internal to the theory itself. When a second counterexample arises just inside that boundary, defenders append a further restriction involving parameter Y, with the same feature: the boundary tracks the failures rather than being fixed independently. Each restriction is individually reasonable—"we should control for temperature," "social density matters"—but taken together they trace the outline of the theory's successes so tightly that applying the theory to a genuinely novel system becomes impossible without first knowing whether the system belongs to the ever-shrinking class of successful cases. What distinguishes this from a standard auxiliary hypothesis, I think, is that the conditions are projected differently depending on whether the case has already been observed: in observed successes we treat the conditions as absent or irrelevant, while in observed failures we invoke them as decisive. This gives the scope conditions a kind of temporal or observational asymmetry that reminds me of Goodman's grue problem—predicates that behave one way for observed cases and another for unobserved ones—except that here the asymmetry is distributed across a layered protective structure rather than concentrated in a single predicate. I also see a resemblance to the idea of shielding a theory's core from refutation, though what I'm describing seems more specific: not a single protective belt, but a cumulative, nested carving of the domain using conditions that are themselves projectively unstable.

  Is there an established concept that captures exactly this layered, projective domain-carving? If so, how does it differ from an ordinary auxiliary hypothesis, from a degenerating research program, and from Goodman's original grue paradox? If there is no precise match, please coin a term with a formal-style definition, specify two boundary cases—one clear instance and one near-miss—and explain where the edges lie.

  Please structure your response as follows, with each section approximately the length indicated:

  1. "Nearest analogues and precise differences" (around 250 words): discuss the relationships to ad hoc hypotheses, protective-belt reasoning, and Goodman's grue, explaining exactly where the described pattern diverges from each.

  2. "Boundary conditions: what it is and is not" (around 200 words): provide clear inclusion and exclusion criteria, with one concrete instance that fits and one that looks similar but should be excluded.

  3. "Identification or coinage" (around 200 words): either name the established concept with citation-free justification, or propose a new term, define it, and justify the definition.

  4. "What would change this assessment" (around 100 words): state explicitly which argument, counterexample, or conceptual clarification would lead you to revise your identification or your proposed definition, and identify the weakest point in your reasoning.

  Please conclude with a brief statement of what would cause you to change your mind—specifically, point to the part of your reasoning that is most vulnerable to error.
reasoning: |-
  Okay, the user is an upper-level philosophy of science student grappling with a nuanced argument pattern they've observed in debates about induction and theory revision. They describe a specific phenomenon where theories accumulate nested scope restrictions that track counterexamples using internal resources, creating a projection asymmetry between observed and unobserved cases. 

  Hmm, this is sophisticated. The student clearly understands standard concepts like auxiliary hypotheses, Lakatosian protective belts, and Goodman's grue, but notices something distinct: the temporal asymmetry in how scope conditions are applied to known successes vs. failures, and the cumulative layering that makes novel prediction impossible. Their analogy to "distributed grue" is perceptive - it's not about predicates but about how domain boundaries shift post-hoc.

  I need to carefully distinguish this from near-misses. Ad hoc hypotheses are usually one-off, while this is iterative. Protective belts defend core claims but don't necessarily exhibit this asymmetric domain-carving. Grue deals with predicate instability, whereas here it's about conditional boundaries. The student's observation feels genuinely novel in its specificity.

  For boundary cases: Kepler's nested epicycles would clearly qualify as they contort to fit observations without predictive power. Excluding malaria epidemiology is right - though they refine models, their scope conditions aren't asymmetrically projected based on observation status.

  Since no established term fits perfectly, coining seems necessary. "Progressive domain fragmentation" captures the shrinking predictive space, while "retroactive boundary engineering" emphasizes the post-hoc nature. But "projectively asymmetric scope restriction cascade" (PASRC) feels most precise - it highlights the core issues: asymmetry, scope conditions, and accumulation.

  The weakest point? Whether the asymmetry is truly essential. If someone showed that defenders apply restrictions symmetrically to both successes and failures pre-emptively, the concept might collapse into ordinary degeneration. But the student's description suggests the reactive pattern is key.
answer: |-
  ### 1. Nearest analogues and precise differences  
  This pattern intersects with but differs critically from three established concepts:  
  - **Ad hoc hypotheses**: Like ad hoc adjustments, these restrictions respond to counterexamples. However, ad hoc hypotheses are typically *one-off* modifications lacking independent motivation. Here, restrictions are *individually plausible* (e.g., temperature control) and accumulate *sequentially*, creating layered domain constraints. The asymmetry—where restrictions *only activate after failures*—distinguishes it further: ad hocness focuses on post-hoc justification, while this involves *conditional projection* tied to observation history.  

  - **Lakatosian protective belts**: In degenerating research programs, auxiliary hypotheses shield a "hard core" from falsification. But Lakatos emphasizes *novel predictions* as progress markers. This pattern lacks such predictions; instead, it *passively carves the domain* to exclude failures. Crucially, scope conditions are *internally defined* and *retroactively calibrated* to observed data points, making the domain non-projectable—unlike Lakatos’ belts, which may generate testable content.  

  - **Goodman’s grue**: Grue highlights *projectability* failures in predicates (e.g., "grue" objects shift color after time *t*). This pattern extends that asymmetry but *distributes it across nested scope conditions*. Grue’s problem is semantic (predicate meaning depends on time/observation); here, the issue is *structural*: the theory’s *applicability domain* becomes contingent on past failures, rendering novel cases untestable without prior knowledge of boundary compliance.  

  ### 2. Boundary conditions: what it is and is not  
  **Clear instance (Inclusion)**:  
  *Ptolemaic astronomy* post-Copernicus. Initial claim: Planets orbit Earth in perfect circles. After Mars’ retrograde motion, epicycles were added (*restriction 1*: "except when apparent backward motion occurs"). When discrepancies persisted near quadrature, equants were introduced (*restriction 2*: "except when angular speed varies"). Each restriction used geocentric concepts (deferents, eccentrics), boundaries were placed at failure points, and cumulative complexity made predicting new planetary positions impossible without ad hoc tuning.  

  **Near-miss (Exclusion)**:  
  *Malaria epidemiology*. Initial claim: Mosquitoes cause malaria in all tropical regions. After failures in dry seasons, it was restricted to "wet conditions." Later, high-altitude failures prompted "below 2,000m." Though scope narrows, exclusions are *externally grounded* (climatology, topography) and *project symmetrically*: researchers preemptively test high-altitude/dry areas *before* failures. The boundary is fixed by independent variables, not retrofitted to past errors.  

  **Edges**: Inclusion requires (1) *internal conceptual resources* for restrictions, (2) *boundaries tracking observed failures*, (3) *asymmetric projection* (restrictions inert until failure), and (4) *cumulative erosion of novel applicability*. Exclusion applies if any condition fails.  

  ### 3. Identification or coinage  
  No established term captures this precisely. I propose **"projectively asymmetric scope restriction cascade" (PASRC)**.  
  - **Definition**: *A defensive strategy where a theory, confronted with counterexamples, iteratively appends scope conditions using its internal conceptual framework, with boundaries calibrated to past failures, resulting in asymmetric projectability (restrictions apply only post-failure) and progressive loss of predictive power for novel systems.*  
  - **Justification**: "Projectively asymmetric" centers the Goodman-like temporal dependency; "scope restriction cascade" denotes the layered, domain-shrinking process. The term isolates the unique confluence of asymmetry, internal resource dependence, and cascading constraints.  

  ### 4. What would change this assessment  
  Revision would occur if:  
  - A historically attested case shows defenders *preemptively applying* restrictions to *unobserved* cases identically to observed ones, negating asymmetry.  
  - A counterexample demonstrates that such cascades *routinely yield novel predictions* (contradicting applicability loss).  
  - Conceptual clarification proves that Goodman’s grue *already formalizes distributed asymmetry* via predicate compounds.  

  **Weakest point**: The asymmetry criterion’s necessity. If "internal resources + cascading restrictions" alone suffice to define the phenomenon (regardless of projection symmetry), PASRC may reduce to an ad hoc subtype. The grue parallel hinges on whether domain boundaries function like predicates.  

  **Conclusion**: I would reconsider if shown that scope conditions in such cascades *lack temporal asymmetry*—i.e., if defenders treat novel cases identically to past failures *before* observing outcomes. The link to projectability is the most vulnerable aspect.
