prompt: |-
  I'm a grad student in cognitive science who mostly thinks in terms of predicive processing, interoceptive inference, and precission-weighted prediction errors. I want you to take the three main philosphy of emotion positions -- that emotions are judgments (the Nussbaum/Solomon kind), that they're perceptions (Prinz-style), and that they're just felt bodily changes (James-Lange) -- and restate each one using only my vocabulary: generative models, prior beliefs, prediction error, precission weighting, allostasis, etc. Do it one by one. For each, tell me what maps cleanly, what I have to twist or fudge to make fit, and what just has no counterpart in my framework at all. Then the residue report: if something in the philosophical view can't be expressed in predictive-processing terms, is that because my framework is missing a real distinction, or because the philosophical claim was never that precise to begin with? I especially care about whether the judgment view forces me to smuggle in propositional content that prediction-error dynamics can't carry, and whether the feeling view collapses into just interoceptive prediction. No reading lists or citations please -- I just want the translation and where it breaks.
