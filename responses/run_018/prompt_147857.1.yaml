answer: |-
  Here’s a structured adversarial collaboration framework for your study group’s debate, designed to force precise agreements and disagreements while respecting both interpretations:

  ### **Joint Statement: Agreed Foundations**  
  *(Both camps accept these as non-controversial starting points)*  
  1. **Structure of the Dialogue**:  
     - Gongsun Long’s argument hinges on two key moves:  
       (a) **Substitution Test**: "Horse" can denote yellow/black horses, but "white horse" cannot.  
       (b) **Counterfactual Scenario**: If a white horse were identical to a horse, seeking a horse would permit taking a white horse (but it doesn’t).  
     - He explicitly rejects "white horse is horse" as a categorical identity claim.  

  2. **Historical Context**:  
     - The dialogue responds to real-world problems of **ambiguous identification** in legal/administrative settings (e.g., fulfilling orders for "horses").  
     - Mingjia texts routinely address **referential precision** in language, not abstract metaphysics alone.  

  3. **Formal Steps**:  
     - Let H = horse, WH = white horse.  
     - Step 1: Extension(H) ⊇ {yellow horses, black horses}  
     - Step 2: Extension(WH) = {white horses}  
     - Step 3: Extension(WH) ⊄ Extension(H) ∴ WH ≠ H  
     - *Both agree this is Gongsun Long’s surface logic; disagreement begins at interpretation*.

  ---

  ### **Distinct Positions**  
  *Each camp’s core claim in its own terms (no compromise)*:  
  - **Sortal-Logic Camp (SLC)**:  
    > *"Gongsun Long demonstrates that ‘white horse’ is a **composite sortal** requiring satisfaction of both ‘horseness’ and ‘whiteness’. Since ‘horse’ permits instances lacking whiteness, their extensions diverge. This is a proto-theory of **sortal inclusion** where adding a property restricts the reference set."*  

  - **Pragmatic-Recognition Camp (PRC)**:  
    > *"Gongsun Long exposes how descriptors alter **contextual identifiability**. ‘White horse’ isn’t merely a subtype of ‘horse’ but a **distinct identifier** in administrative practice. When a decree specifies ‘horse’, color is irrelevant; when it specifies ‘white horse’, color is criterial. The paradox arises from conflating linguistic categories with real-world recognition tasks."*  

  ---

  ### **Cruxes with Analogies & Predictions**  
  *Each crux includes: (a) agreed analogy, (b) SLC position/prediction, (c) PRC position/prediction.*  

  **Crux 1: Is color a sortal-modifier or a contextual tag?**  
  - **Analogy**: *A "stone lion" in a palace courtyard.*  
    - SLC: "Stone lion" is a composite sortal. It inherits no properties from biological lions (e.g., it can’t roar). ∴ Not a lion.  
      *Prediction: Gongsun Long would say "stone lion ≠ lion" identically to "white horse ≠ horse".*  
    - PRC: "Lion" here refers to a functional role (decoration). Adding "stone" specifies material constraints for recognition. ∴ Context determines if it’s substitutable.  
      *Prediction: Gongsun Long would reject "stone lion ≠ lion" if context permits material variation.*  

  **Crux 2: Is extension-set theory anachronistic?**  
  - **Analogy**: *A decree: "Bring me a horse" vs. "Bring me a white horse".*  
    - SLC: Extensions are fixed by necessary/sufficient conditions. "White horse" has an extra condition, so its set is a proper subset. ∴ Always non-identical.  
      *Prediction: If a white horse is missing, you can’t substitute a black horse even if context allows it.*  
    - PRC: Extensions are fluid. If all horses are white, "horse" ≈ "white horse" in practice. The paradox targets rigid language, not sets.  
      *Prediction: Gongsun Long would accept "white horse = horse" in contexts where color is irrelevant (e.g., all horses white).*  

  **Crux 3: Does property inheritance resolve the paradox?**  
  - **Analogy**: *"A tall building is not a building" (if "building" implies "occupiable", but this one is under construction).*  
    - SLC: "Tall building" inherits all properties of "building" + height. If "building" requires occupancy, an unoccupied tall building fails. ∴ Non-identity.  
      *Prediction: Gongsun Long would endorse "tall unoccupied building ≠ building" as structurally identical.*  
    - PRC: Inheritance is irrelevant. The issue is whether "tall" changes recognition conditions (e.g., for zoning laws). ∴ Depends on context.  
      *Prediction: Gongsun Long would reject inheritance debates—focus on whether "tall" alters the identification task in the specific decree.*  

  ---

  ### **Residual Disagreement Made Exact**  
  - **SLC** sees the paradox as:  
    *A logical truth about composite terms: ∀x (WH(x) → H(x)) is true, but WH ≡ H is false because properties aren’t additive.*  
  - **PRC** sees it as:  
    *A pragmatic warning: Uttering "white horse" triggers different recognition protocols than "horse" in real discourse, so they aren’t substitutable.*  

  **Testable Difference**:  
  - Present a scenario: *"The law says 'whoever steals a horse receives 20 lashes.' Zhang steals a white horse. Is he liable?"*  
    - SLC predicts: Gongsun Long would say Zhang avoided liability (white horse ≠ horse).  
    - PRC predicts: Gongsun Long would say liability depends if "horse" in legal context includes color variations.  

  This forces the groups to confront whether Gongsun Long’s argument is **invariant** (SLC) or **context-bound** (PRC)—a divide that persists in philosophy of language today. The adversarial collaboration reveals that both camps agree on the *mechanism* (substitution failure) but clash on its *grounds* (logic vs. praxis).
