answer: |-
  ### Q&A Prep Sheet: Mary's Room & Counterfactual Stability Profiles  

  **Brainstormed Objections (Ordered by Damage Potential):**  
  1. **Grounding Gap:** "If the stability profile supervenes on neural architecture, why isn't it *grounded* in third-person physical facts? What explains the epistemic gap?"  
  2. **Closure Failure:** "Doesn’t your view imply explanatory closure failure? Complete physics should exhaust all facts, yet you posit irreducible first-person knowledge."  
  3. **Disguised Dualism:** "Aren’t you smuggling in non-physical properties by making first-person access *essential*? This sounds like property dualism with extra steps."  
  4. **Operational Vacuity:** "How do we operationalize ‘counterfactual stability profiles’? If they’re behaviorally inert, aren’t they just ad hoc placeholders?"  
  5. **Modal Proliferation:** "Why invoke *counterfactuals*? Couldn’t Mary’s progress be explained by acquiring new cognitive abilities (e.g., pattern recognition) without modal metaphysics?"  
  6. **Supervenience Fragility:** "If profiles supervene on neural states, why can’t we reduce them to functional/computational models? What blocks reductionism?"  
  7. **Phenomenal Concept Skepticism:** "Isn’t this just a rehash of ‘phenomenal concepts’? If those fail to save physicalism, why do profiles succeed?"  

  ---

  **Objection Replies (2-Minute Format):**  
  1. **Grounding Gap Reply:**  
     "The profile *is* metaphysically grounded in neural architecture—but *epistemic access* to its modal structure requires first-person perspective. Grounding concerns *being*, not *knowing*. The gap arises because third-person descriptions abstract away from agent-relative *access conditions* to counterfactual dependencies (e.g., ‘How *I* would react if light wavelengths varied’). Supervenience ensures physicalism; irreducibility reflects cognitive architecture."  
     *Weakness:* Doesn’t fully resolve why access conditions escape third-person description.  

  2. **Closure Failure Reply:**  
     "Closure holds metaphysically: all facts are physical facts. But *epistemic* closure fails because third-person science lacks tools to encode perspective-dependent modal knowledge. Like a map lacking ‘you are here,’ physics describes structures but not their egocentric navigation. Mary *discovers* no new property—she gains navigational skill within the physical world."  
     *Weakness:* Risks conflating metaphysical and epistemic closure.  

  3. **Disguised Dualism Reply:**  
     "Not dualism: the profile is a physical *relation* (neural response to counterfactuals), not a non-physical property. First-person access is just a *mode of presentation* for how sensory systems respond to perturbations. Compare: a self-driving car’s sensor calibration—physical, but only ‘accessible’ via embedded testing."  
     *Weakness:* May not satisfy skeptics who see first-person access as inherently non-physical.  

  4. **Operational Vacuity Reply:**  
     "Profiles *are* operationalizable as *dispositions to discriminate*. E.g., Mary’s profile includes: ‘If presented with #FF0000 vs. #800000, she’d report distinct experiences.’ Cognitive science already uses such modal discriminations (e.g., in psychophysics). This anchors consciousness in behavioral capacities without reduction."  
     *Weakness:* Only captures *reports*, not the qualitative aspect.  

  5. **Modal Proliferation Reply:**  
     "Abilities like pattern recognition *presuppose* counterfactual understanding. Recognizing red isn’t just ‘this patch now’—it’s knowing how it *would* look in dusk, fog, etc. Modality is implicit in perceptual constancy. Profiles make this explicit, avoiding brute abilities."  
     *Weakness:* May overintellectualize perception.  

  ---

  **Preemptive Concessions (State These in Your Talk):**  
  1. **Concede Closure Failure (Partial):**  
     *"I accept that third-person physical descriptions underdetermine first-person modal knowledge—epistemic closure fails. But this is a limitation of description, not ontology."*  
  2. **Concede Operational Vacuity (Partial):**  
     *"Profiles aren’t directly measurable like pH levels—they’re inferred from discriminatory behavior. But all cognitive models trade in unobservables (e.g., beliefs)."*  

  **Make-or-Break Reply (Must Land):**  
  **Grounding Gap Reply** must convince them that:  
  - Epistemic irreducibility ≠ ontological non-physicality.  
  - Agent-relative access conditions are *architectural features* of cognitive systems (like a camera’s firmware), not ghostly add-ons.  
  *If this fails, the view collapses into dualism or mysterianism.*  

  ---

  **The Dreaded Unasked Question:**  
  **"If profiles are causally inert (mere epiphenomenal ‘grasping’), why do they evolve?"**  
  - **Honest Reply:** "They *aren’t* causally inert! Profiles guide behavior: e.g., knowing ‘I’d confuse red/orange in dim light’ adjusts my actions. They’re adaptive control structures sculpted by evolution to navigate uncertainty."  
  - **Assessment:** Reply *saves the view* only if tied to empirical work (e.g., predictive processing). Otherwise, it risks hand-waving.  

  ---  
  \answer{Causal inefficacy: Why evolve inert epistemic profiles?}
