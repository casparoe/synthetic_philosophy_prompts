answer: |-
  **(Adopting Strawson's precise, uncompromising tone):** Your analogy is admirably clear but fundamentally mislocates the *sui generis* nature of reactive attitudes. Resentment, gratitude, or moral indignation aren't merely *corrective signals* like a plant's auxin redistribution; they embody a *normative expectation* addressed *to the other as a responsible agent*. When you resent a slight, you aren't triggering a blind feedback loop; you experience the other's action as a *violation of a demand for goodwill* owed *to you personally*. This implicit demand presupposes the other's capacity for understanding and responding to reasons – a recognition of their status as a *person*, not an object governed by causal laws alone. The objective attitude (viewing someone purely as a mechanism to be managed) is a *departure* from this fundamental, engaged stance of holding others *answerable*. Physiology describes mechanisms; reactive attitudes constitute the inescapable framework of *interpersonal understanding* within which concepts like "violation" or "recognition" even make sense. Morality isn't physiology dressed up; physiology is silent on the *interpersonal meaning* reactive attitudes reveal. Your reduction ignores this constitutive dimension of our practices.
