prompt: |-
  hey, i'm writing a feature on whether we even have a working defintion of intelligence for my science desk, and i realized every expert just points to iq tests or deep learning benchmarks and calls it a day. i want the actual spec sheet: what does a theory of intelligence have to deliver to count as adequate? not just "it predicts human exam scores" — i mean the hard cases it can't botch, like whether a slime mold solving a maze is intelligent, whether a large language model that aces bar exams but can't navigate a dark room counts, and whether intelligence is one thing or a cluster of capacities that happen to travel together. for each requirement, say why it's in the spec — what's the case or result behind it — and flag which ones are non-negotiable versus just camp bias (psychometrics vs ai vs embodied cognition). especially tell me if any subset is jointly unsatisfiable: for instance, can you really hold both "intelligence requires embodied interaction with an environment" and "intelligence is fully substrate-independent" without fudging? also list the distinctions it can't collapse, like capacity vs achievement or domain-general vs domain-specific, with the reason for each. then, briefly, how do g-factor theories, embodied cognition takes, and the "intelligence as adaptation" view score against your list? but mostly i want the criteria — my editor wants to know what we're actually arguing about when we call something smart.
reasoning: |-
  Okay, the user is writing a science feature on defining intelligence and is frustrated that experts just point to IQ tests or AI benchmarks. They want a "spec sheet" of criteria for a theory of intelligence. Let me unpack their query.

  First, they mention hard cases: slime molds solving mazes, LLMs acing exams but failing in a dark room. So the criteria need to handle edge cases. Also, they want to know if intelligence is a single thing or a cluster. They want each criterion to have a reason, and to note which are non-negotiable vs. biased. There's a specific question about embodied interaction vs. substrate independence being incompatible. Plus, distinctions like capacity vs. achievement, domain-general vs. specific.

  The user's identity is a science journalist. Their desk is working on a feature, so they need credible, well-structured info. The explicit need is the criteria list, but deeper, they want to clarify the debate around intelligence. They might need to present conflicting viewpoints without taking sides, showing why there's no consensus. The editor wants to know what the argument is about when calling something smart, so the underlying need is to explain the core disagreements in the field.

  Breaking down the required criteria: Flexibility is crucial because intelligence isn't static. Versatility across domains is another key point since experts argue about whether intelligence is general or specific. Goal relevance ties into purpose—solving meaningful problems. Transfer and learning are core, as is robustness. Efficiency matters because inefficiency might indicate lack of intelligence. Substrate independence is debated, especially with embodied cognition. Observability and testability are practical needs for measurement. Graceful degradation vs. brittleness shows how systems fail. Integration of capacities is about combining abilities. Agency and embodiment are contentious—some see embodiment as essential, others not. The meta-adaptation criterion is about evolving new strategies.

  Distinctions like capacity vs. achievement highlight potential vs. performance. Domain-general vs. specific addresses whether there's a core intelligence. Internal mechanisms vs. behavior is about whether the process matters. Individual vs. collective intelligence is another layer.

  Assessing theories: g-factor focuses on psychometric testing but misses flexibility and embodiment. Embodied cognition emphasizes physical interaction but struggles with substrate independence. Adaptation views see intelligence as problem-solving but might be too broad. Each theory has gaps according to the criteria.

  The user needs to present these criteria and show how different camps prioritize them. The incompatibility between embodiment and substrate independence is a key conflict. Also, the capacity vs. achievement distinction explains why some systems might seem intelligent but lack underlying ability. Highlighting these tensions will show why defining intelligence is contentious. Making sure each point has a real-world example (like slime mold or LLMs) will make the feature engaging. The journalist needs to convey that the debate stems from which criteria different experts value, leading to the lack of a unified definition.
answer: |-
  Here’s a rigorous "spec sheet" for a theory of intelligence, grounded in scientific/philosophical debates and designed to handle edge cases. It breaks down into **Core Requirements**, **Critical Distinctions**, **Camp-Specific Biases**, and **Theory Assessments**.

  ---

  ### **Core Requirements for an Adequate Theory of Intelligence**  
  *(Non-negotiables in **bold**; biases flagged)*  

  1.  **Flexibility/Generality (Non-negotiable)**  
      *   **Must:** Explain how systems adapt to *novel* problems outside training/data.  
      *   **Why:** An ant colony navigates new terrain; an LLM fails if prompt deviates slightly. IQ tests partially measure this via matrix reasoning.  
      *   **Edge Case:** Slime mold maze-solving (simple chemotaxis) vs. human rerouting during road closures (abstract planning).  

  2.  **Versatility Across Domains (Non-negotiable)**  
      *   **Must:** Distinguish domain-specific prowess (e.g., chess AI) from cross-domain competence (e.g., humans applying physics to cook).  
      *   **Why:** LLMs ace BAR exams but can't tie shoelaces. IQ’s "g-factor" claims this, but critics note human skills are uneven.  
      *   **Bias:** Psychometrics assumes domains correlate; embodied AI rejects "disembodied" generality.  

  3.  **Goal Relevance & Problem-Solving Validity (Non-negotiable)**  
      *   **Must:** Generate actions *meaningfully* advancing goals in real environments.  
      *   **Why:** A thermostat regulates temperature but can't repurpose itself during a heatwave. LLMs hallucinate solutions that *sound* valid but aren’t.  
      *   **Edge Case:** Is a virus "intelligent" for evolving? (Lacks agency; blind variation).  

  4.  **Transfer & Learning Efficiency (Non-negotiable)**  
      *   **Must:** Transfer knowledge *across contexts* with minimal new data.  
      *   **Why:** Humans learn "cat" from few examples; AI needs 10,000 labeled images. Slime molds show no transfer (fixed tropism).  
      *   **Bias:** Deep learning often sacrifices this for narrow performance.  

  5.  **Robustness to Uncertainty & Noise (Non-negotiable)**  
      *   **Must:** Function amid incomplete, ambiguous, or conflicting data.  
      *   **Why:** Humans navigate dark rooms (integrating touch/memory); sensor-driven robots fail without lidar.  
      *   **Edge Case:** LLMs crumble under contradictory instructions; humans seek clarification.  

  6.  **Efficiency/Resource Optimization (Negotiable)**  
      *   **Must:** Achieve goals with minimal energy, time, or computational resources *relative to task complexity*.  
      *   **Why:** Bee colonies optimize nectar routes; brute-force AI is inefficient.  
      *   **Bias:** Biology prioritizes this; silicon-based AI often ignores it.  

  7.  **Substrate Independence (Negotiable)**  
      *   **Must:** Be definable without reference to specific hardware (brain, carbon, silicon).  
      *   **Why:** Intelligence *should* be implementable on any Turing-complete system.  
      *   **Conflict:** Directly clashes with **embodiment requirement** (see below).  

  8.  **Observability/Testability (Non-negotiable)**  
      *   **Must:** Produce falsifiable predictions and measurable behaviors.  
      *   **Why:** Untestable theories (e.g., "panpsychism") are unscientific. IQ tests operationalize poorly.  

  9.  **Graceful Degradation (Non-negotiable)**  
      *   **Must:** Fail gradually (like humans forgetting details) not catastrophically (LLMs outputting nonsense).  
      *   **Why:** Sign of integrated understanding vs. brittle pattern-matching.  

  10. **Integration of Capacities (Negotiable)**  
      *   **Must:** Explain how perception, memory, reasoning, and action *coordinate*.  
      *   **Why:** LLMs lack sensory-motor integration; humans seamlessly blend senses/action/cognition.  
      *   **Bias:** Embodied cognition demands this; computationalism downplays it.  

  11. **Agency & Intentionality (Negotiable)**  
      *   **Must:** Account for goal *setting*, not just goal pursuit.  
      *   **Why:** A chess AI pursues given goals; humans *choose* to play chess.  
      *   **Bias:** Philosophy-heavy; AI often ignores it.  

  12. **Embodiment & Situatedness (Negotiable)**  
      *   **Must:** Require interaction with a physical/dynamic environment.  
      *   **Why:** Navigating a dark room needs sensory feedback; pure symbol manipulation (e.g., LLMs) fails.  
      *   **Conflict:** **Incompatible with strict substrate independence** without redefining "environment" (e.g., simulated worlds).  

  ---

  ### **Critical Distinctions a Theory CANNOT Collapse**  
  1.  **Capacity vs. Achievement**  
      *   *Why:* An LLM *achieves* high BAR scores via statistical correlation, but lacks the *capacity* to generalize (e.g., can’t "think like a lawyer" in a real courtroom).  
  2.  **Domain-General vs. Domain-Specific**  
      *   *Why:* Narrow AI (AlphaFold) excels in one domain; humans adapt knowledge broadly. A theory must explain both.  
  3.  **Internal Mechanism vs. External Behavior**  
      *   *Why:* Slime molds *behave* as if solving mazes via chemotaxis, but lack internal representations. Is that "intelligence" or chemistry?  
  4.  **Individual vs. Collective Intelligence**  
      *   *Why:* Ant colonies exhibit swarm intelligence; no single ant is "smart." A theory must scale.  

  ---

  ### **How Major Theories Score**  
  | **Theory**               | **Strengths**                                  | **Gaps**                                          |  
  |--------------------------|-----------------------------------------------|--------------------------------------------------|  
  | **g-factor (Psychometrics)** | Quantifies versatility, transfer, robustness | Fails flexibility (novelty), embodiment, efficiency; overfits to humans. |  
  | **Embodied Cognition**   | Explains robustness, integration, dark room navigation | Rejects substrate independence; struggles with abstract reasoning (e.g., math). |  
  | **Intelligence as Adaptation** (e.g., Legg & Hutter) | Flexible, goal-driven, substrate-independent | Too broad: evolution is "intelligent," but lacks agency/graceful degradation. |  

  ---

  ### **Key Tensions & Why Consensus is Elusive**  
  1.  **Substrate Independence vs. Embodiment**: Strictly irreconcilable. *Fudge Fix:* Define "environment" abstractly (e.g., data streams for LLMs).  
  2.  **Efficiency vs. Universality**: Human brains are efficient but not universal; AGI aims for universality but may ignore efficiency.  
  3.  **Capacity vs. Achievement**: Psychometrics measures achievement, calling it "capacity"; AI benchmarks conflate them.  
  4.  **Agency**: Neither g-factor nor AI benchmarks address *self-generated goals*.  

  **The Heart of the Debate**: **What counts as "meaningful" problem-solving?**  
  - *Psychometrics*: What humans do well (bias toward symbolic reasoning).  
  - *Embodied AI*: What supports survival in dynamic environments (bias toward robotics).  
  - *Computationalism*: What optimizes information processing (bias toward math/logic).  

  Until theorists agree on which requirements are non-negotiable (e.g., is embodiment essential?), we’ll lack a unified definition. **Your editor’s answer: We’re arguing about which *kind* of problem-solving deserves the label "intelligence"—and no camp owns the term.**
