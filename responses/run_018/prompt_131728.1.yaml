answer: |-
  Here's a defense of collective intentionality without representational convergence, grounded in normative authority and practical reasoning structure:

  **Core Thesis:** Genuine joint action is constituted not by shared mental representations of a goal, but by a reciprocal normative relationship where participants recognize each other as possessing practical authority to constrain their own reasoning about the immediate next steps of the collective process. This mutual authority binds individual practical reasoning into an interdependent structure, making the action genuinely joint despite divergent understandings of the ultimate purpose.

  ### Addressing the Structure of Jointness: Beyond Shared Content
  1.  **The Primacy of Practical Interdependence:** Joint action is fundamentally characterized by the *interdependence* of the participants' practical reasoning. Bratman correctly identifies this interdependence as essential but mistakenly ties it to shared representational content about a *goal*. The true locus of interdependence lies in the *procedural structure* of reasoning itself. When A treats B's actual or anticipated contribution as a *binding reason* constraining her own deliberation about *what to do next* (and vice versa), their actions become non-accidentally interdependent. A doesn't just act *after* B; she acts *because* and *in light of* B's action/commitment, adjusting her own course based on its normative force within the collective process. This mutual responsiveness creates a tightly woven fabric of action, distinct from parallel individual action where each merely considers the other's actions as external circumstances.

  2.  **Mutual Practical Authority - The Binding Mechanism:** This interdependence is sustained by mutual recognition of *practical authority*. Each participant attributes to the others the normative power to generate reasons that directly shape their own practical deliberation about the collaborative task *at hand*. For example:
      *   When a contributor commits to implementing a specific module interface, others recognize this commitment as *binding* on their own subsequent coding choices regarding compatible modules – not merely as useful information, but as a normative constraint they *ought* to respect.
      *   This authority is limited to the *domain* of the joint project – it concerns "what *we* are doing here" procedurally, not necessarily "why we are doing it" substantively. It's authority over the *means within the ongoing collective endeavor*.
      *   This mutual authority transforms individual practical syllogisms. Instead of "I intend G. Doing M contributes to G. Therefore, I do M," it incorporates: "Other participants in our joint project have established condition C (e.g., an interface standard). Respecting C is required by my participation in *this* joint project. Therefore, my choice of M must be compatible with C." The "joint project" here functions as a normative source of reasons, not necessarily a shared mental representation.

  ### Addressing Bratman: Interdependence Without Shared Goals
  Bratman's objection – that without shared content there is only parallel action lacking the right interdependence – misidentifies the source of interdependence. It is not the *shared representation of the goal* that creates interdependence, but the *mutual recognition of authority over the collaborative process*.

  *   **Shared Cooperative Activity (SCA) Revisited:** Bratman's SCA requires mutual responsiveness, commitment to the joint activity, and commitment to mutual support – all predicated on *interlocking intentions* toward a *shared goal*. Our model satisfies the *functional core* of these requirements without the shared goal:
      *   **Mutual Responsiveness:** Achieved through binding practical authority. I respond to your contributions *as authoritative constraints*, ensuring deep coordination.
      *   **Commitment to the Joint Activity:** Manifest in the ongoing recognition of mutual authority over the project's procedural unfolding. Participants are committed to *upholding the normative structure of their collaboration* by treating each other's relevant contributions as binding.
      *   **Commitment to Mutual Support:** Arises implicitly from the recognition of mutual authority and the goal of sustaining the joint process. If my action undermines your ability to contribute effectively (e.g., by violating an interface you rely on), I violate the normative terms of our practical relationship. Supporting the process *is* supporting the other participants *in their role* within it.
  *   **Beyond Parallel Action:** In parallel action, individuals might adjust based on *predictions* of others' behavior or *shared circumstances*, but they do not treat others' actions/commitments as *normative sources of obligation* within a shared practical framework. The binding normative relation creates a qualitatively different, genuinely interdependent structure. They are not merely acting alongside one another; they are acting *through* the framework established by their mutual authority.

  ### Addressing Gilbert: Joint Commitment Without a Unified Subject
  Gilbert argues joint commitment creates a plural subject with a single, shared "pool of wills." She contends this necessitates a single shared content of intention for the plural subject. Our model offers an alternative interpretation of joint commitment:

  1.  **Joint Commitment as Reciprocal Authority:** The "joint commitment" essential for collective action is the mutual attribution and acceptance of practical authority *over the collaborative process*. Participants are jointly committed *to the normative framework of their interaction* – the framework wherein each recognizes the others' project-relevant contributions as generating binding reasons. This commitment is joint because it is inherently reciprocal and interdependent; my commitment to recognize your authority is conditional on your reciprocal commitment (explicit or implicit).
  2.  **The "Subject" is the Normative Framework, Not a Shared Mind:** The "plural subject" is not a bearer of unified mental content, but the *emergent normative structure* constituted by the network of reciprocal practical authorities. What is unified is not the *representation of the goal*, but the *normative space* within which participants' practical reasoning about the next steps is constrained and guided by each other. The "subject" of the action is this dynamic, normatively structured process itself. Representational divergence about the ultimate goal is compatible with this because the binding commitments concern the *procedural rules and immediate constraints* of the ongoing collaboration, not the final interpretation of its outcome.

  ### Why Representational Divergence is Structurally Accommodated
  The mutual authority model doesn't just tolerate representational divergence; its structure inherently accommodates it:

  1.  **Decoupling Goal-Representation from Process-Authority:** The normative relation binds participants to the *process* and the *authority of others within that process*, not to a specific shared conception of the end-state. One can faithfully participate by adhering to the procedurally generated constraints (interfaces, protocols, task assignments) while interpreting the ultimate purpose (e.g., "empowering users," "undermining proprietary software," "creating pure art") in fundamentally different, even incompatible ways.
  2.  **Focus on the "Practical Horizon":** Joint action, especially in complex distributed projects, operates primarily on a "practical horizon" – the immediate next steps, the current interfaces, the pending contributions. Mutual practical authority functions most directly on *this* horizon. Agreement on the immediate procedural constraints (enforced by mutual authority) is sufficient for tight coordination, even while interpretations of the distant goal diverge. The binding normative relation ensures coherence *at the point of action*.
  3.  **Normative Robustness:** The framework gains robustness *from* its ability to function despite representational divergence. It provides a stable structure for coordination that doesn't rely on the fragile and often unattainable condition of fully shared mental content about complex, evolving goals. The action remains joint because the participants' practical reasoning is constitutively intertwined through mutual authority, ensuring their contributions are non-accidentally fitted together into a unified process, irrespective of their divergent understandings of its ultimate meaning.

  **Conclusion:** Genuine joint action requires a structure of practical interdependence where participants' reasoning and actions are constitutively responsive to one another. This interdependence is secured not by shared representations of a goal, but by the reciprocal recognition of practical authority concerning the ongoing collaborative process. Participants bind themselves to treat each other's contributions as generating normative constraints on their own immediate practical choices. This mutual authority creates the requisite tight interdependence (countering Bratman) and constitutes a joint commitment to the normative framework of interaction (countering Gilbert's need for a unified subject with shared content), allowing the collective endeavor to proceed coherently as a single joint action even amidst radical divergence in how participants represent its ultimate purpose. The jointness resides in the normative structure of their practical entanglement, not in the convergence of their mental representations.
