  First, I recall Marx's distinctions. Formal subsumption is when capital takes over existing labor processes without changing them, extracting surplus through lengthened hours or reduced wages. Real subsumption transforms the labor process itself using machinery to intensify work. Machinery for Marx isn't just tools; it's a system that dictates pace and reorganizes labor, turning workers into appendages. Cooperative labor under capitalism isn't organic teamwork but capital-enforced coordination that amplifies exploitation.

  Now, applying this to algorithmic management in warehouses: Software sets real-time tasks and paths for workers. At first glance, it seems like real subsumption—machinery dictating work rhythms. But is it qualitatively different? Unlike physical machines, algorithms automate coordination itself. This resonates with Marx's "general intellect"—societal knowledge becoming a direct force of production. Here, it's inverted: collective logistical intelligence is weaponized for control.

  The key shift is automating the coordination function. Traditional factories needed overseers; algorithms now do this instantly, compressing management into code. This intensifies despotism quantitatively (faster pacing) but also qualitatively by making coordination a real-time domination tool. Workers aren't just appendages to machines but to a data-driven system that abstracts their cooperation into exploitative efficiency.

