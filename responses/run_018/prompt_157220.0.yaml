prompt: |-
  I'm the acquisitions editor for a small museum — we get exibit pitches every month that mix real archeology with fringe chronology or ancient-aliens claims. I need a reusable 10-minute screening procdure I can run alone, translating whatever philosophy of history says about demarcating pseudohistory (falsifiability, source proximity, consilience with established chronology, replication) into ordered steps: ask this, check that, hard stop here, values-call flag there. Fix the role, stakes, and where judgment can't be removed. Apply it to three pitches: (1) literal Plato Atlantis with underwater formations near the Azores; (2) Fomenko's statistical chronology arguing the Almagest was compiled in the 1500s; (3) ancient metallurgists needed alien tutors because a slag-purity study is misapplied. Include one case where the procdure kills it but I'd still want a "how myths form" display, and flag where it will misfire.
reasoning: |-
  Okay, the user is an acquisitions editor for a small museum who's dealing with exhibit pitches that blend real archaeology with fringe theories like ancient aliens or alternative chronologies. They need a reusable 10-minute screening procedure that translates historical philosophy into practical steps. Let me break this down.

  First, I should recall key concepts in demarcating pseudohistory: falsifiability (can the claim be tested?), source proximity (how close are the sources to the events?), consilience (does it fit with established knowledge?), and replicability (can others verify it?). These need to be turned into actionable steps.

  The user mentioned three specific pitches: Atlantis near Azores, Fomenko's chronology shifting Ptolemy to the 1500s, and aliens teaching metallurgy due to slag purity. Also, they want a case where the procedure rejects a pitch but it could still be used for a "how myths form" display. Plus, flag where the procedure might misfire.

  Hmm, the stakes are high. Accepting pseudohistory could damage the museum's credibility, alienate scholars, mislead the public, and waste resources. The editor's role is gatekeeper, ensuring content integrity. Judgment is unavoidable in steps like source evaluation or assessing consilience, so I should note where human judgment is critical.

  For the procedure, it needs to be quick—10 minutes. So steps should be ordered: initial scan, key checks, hard stops, flags. Start with a quick scan for obvious pseudoscience markers. Then check falsifiability: if the claim can't be tested, that's a hard stop. Next, source proximity: are primary sources used correctly? Misinterpreting primary sources is another red flag. Then consilience: does it contradict well-established knowledge without strong evidence? Finally, replicability: are the methods sound and verifiable?

  Applying this to the Atlantis pitch. Claim: underwater structures near Azores are Atlantis. Falsifiability? Maybe, if they provide specific coordinates. But source proximity: Plato is the only source, and it's allegorical. Hard stop here. Even if rejected, it's a good example of myth formation.

  Fomenko's chronology: Almagest compiled in 1500s. Falsifiability? Statistical analysis could be testable. But source proximity issues—ignores ancient manuscripts. Contradicts dendrochronology, radiocarbon dating. Hard stop. Judgment needed on ignoring evidence.

  Alien metallurgy: slag purity study misapplied. Falsifiability? If the study is cited, maybe testable. But misapplication of data—consilience problem since known metallurgy history explains advancements. No hard stop yet, but values flag for promoting aliens without evidence. Judgment call on whether to proceed.

  Where the procedure might misfire: new but valid theories that initially lack consilience, like the Clovis First hypothesis being overturned. Need to ensure the procedure doesn't stifle innovation but distinguishes between fringe and emerging scholarship.

  Also, the user might have deeper needs: protecting the museum's reputation, educating the public without endorsing myths, efficient resource use. The procedure should balance rigor with practicality, allowing flexibility for educational angles when appropriate.
answer: |-
  Here's a **10-Minute Pseudohistory Screening Protocol** designed for your role, incorporating core historical principles, actionable steps, clear stakes, and judgment points. Prioritize efficiency and defensibility.

  **Your Role:** Acquisitions Editor / Scholarly Gatekeeper  
  **Core Stakes:**  
  *   **Credibility:** Protecting the museum's reputation with scholars, funders, and the educated public.  
  *   **Education:** Preventing the dissemination of misinformation disguised as scholarship.  
  *   **Resource Allocation:** Avoiding wasted time/money on unviable projects.  
  *   **Mission Integrity:** Aligning exhibits with evidence-based historical understanding.  

  **Protocol Steps (10-Minute Timer Starts Now):**  

  1.  **Initial Scan & Core Claim (1 min):**  
      *   **ASK:** What is the *single, central claim*? What established historical narrative/evidence does it challenge or rewrite?  
      *   **JUDGMENT:** Is the core claim inherently untestable (e.g., "aliens did it but erased evidence")? If so, **HARD STOP (Pseudoscience)**.  
      *   **FLAG:** Does it rely heavily on "suppressed knowledge," vast conspiracies, or *solely* on ancient texts interpreted literally? (Values Flag: Promotes distrust of scholarship).

  2.  **Source Proximity & Handling (2 min):**  
      *   **CHECK:** What are the *primary sources* cited? Are they contemporary to the events claimed?  
      *   **ASK:** How does the pitch *handle* these sources? Does it dismiss inconvenient context, provenance, or mainstream interpretation? Does it rely on later sources misrepresenting earlier ones?  
      *   **HARD STOP:** If it fundamentally misrepresents or dismisses unambiguous primary source evidence (e.g., dated manuscripts, inscriptions) without compelling, verifiable reason.  
      *   **JUDGMENT:** Assess the gap between the source and the claim. Is the interpretation forced or anachronistic?

  3.  **Falsifiability & Evidence Quality (3 min):**  
      *   **ASK:** What *specific, testable evidence* is presented? Can this evidence potentially *disprove* the claim if absent/false?  
      *   **CHECK:** Is the evidence:  
          *   **Direct?** (Artifact, inscription, primary doc) or **Indirect/Inferential?** (Statistics, similarity, speculation).  
          *   **Replicated?** Can the analysis be repeated? Are methods transparent?  
          *   **Contextualized?** Is evidence presented whole or cherry-picked? Ignoring contradictory evidence?  
      *   **HARD STOP:** If evidence is demonstrably fraudulent, repeatedly debunked, or consists *only* of speculation/analogy.  
      *   **FLAG:** Over-reliance on ambiguous evidence (e.g., vague symbols, undated structures) interpreted in highly specific ways. (Values Flag: Over-interpretation).

  4.  **Consilience & Established Knowledge (3 min):**  
      *   **ASK:** Does the claim require overturning *multiple, independent, well-established lines of evidence* (archaeology, textual criticism, dating methods, linguistics, genetics)?  
      *   **CHECK:** How does it handle this?  
          *   Dismiss entire fields (e.g., "radiocarbon dating is unreliable")?  
          *   Offer no coherent alternative model?  
          *   Rely on "everything is forged/faked"?  
      *   **HARD STOP:** If it dismisses vast swathes of established, consilient knowledge without *extraordinarily strong, direct, and replicable* counter-evidence *per point dismissed*.  
      *   **JUDGMENT:** Is the scale of required dismissal disproportionate to the evidence presented? (Key Judgment Call).

  5.  **Final Triage & "Myth Formation" Potential (1 min):**  
      *   **Based on Steps 1-4:** Is this **Reject** (Multiple Hard Stops/Flags), **Needs Major Scholarly Review** (Serious flags but testable core?), or **Potential** (Passes core filters, needs standard vetting)?  
      *   **ASK (For Rejects):** Despite being poor history, does this illustrate a *compelling example of how myths/pseudohistory form*? (e.g., misreading texts, misapplying science, cultural longing). **FLAG** for potential educational repurposing.

  **Where Judgment is Critical & Unavoidable:**  
  *   Step 1: Identifying the *core* claim vs. window dressing.  
  *   Step 2: Evaluating source interpretation/misrepresentation.  
  *   Step 4: Assessing the *scale* of required dismissal vs. evidence strength.  
  *   Step 5: Final triage and identifying "myth formation" potential.  

  ---

  **Application to Pitches:**

  1.  **Literal Plato's Atlantis (Azores Formations):**  
      *   **1 (Core Claim):** Azores formations = Atlantis. Challenges Bronze Age Mediterranean/N. Atlantic history. **FLAG:** Literal myth interpretation.  
      *   **2 (Sources):** Relies *solely* on Plato's *Timaeus/Critias* (philosophical allegory, not history). Ignores context/purpose. **HARD STOP:** Fundamental misrepresentation of primary source genre/purpose.  
      *   **3 (Falsifiability):** "Formations look man-made" is subjective/unfalsifiable as *proof* of Atlantis. No specific testable evidence linking formations to Plato's description. Ignores geology.  
      *   **4 (Consilience):** Requires dismissing geology, archaeology of Azores/Mediterranean, literary analysis of Plato. **HARD STOP:** Massive dismissal unsupported.  
      *   **5 (Triage):** **REJECT.** **MYTH FORMATION FLAG:** *Excellent* example of literalizing myth, misinterpreting geology, cultural longing for lost civilizations. Perfect for "How Myths Are Born" display.

  2.  **Fomenko's Statistical Chronology (Almagest in 1500s):**  
      *   **1 (Core Claim):** "Traditional chronology" is wrong by ~1000 years; Almagest compiled ~1500s AD. Challenges all pre-1000AD history.  
      *   **2 (Sources):** Dismisses provenance/dating of ancient manuscripts, inscriptions, chronicles as forgeries/errors. **HARD STOP:** Unwarranted dismissal of primary source materiality/provenance.  
      *   **3 (Falsifiability):** Statistical methods on star positions (potentially testable). **CHECK:** Methods criticized for cherry-picking data, ignoring proper motion/precession models, non-replicable results by mainstream astronomers. **FLAG:** Misapplication of science.  
      *   **4 (Consilience):** Requires overturning dendrochronology, radiocarbon dating, archaeology, linguistics, recorded eclipses, parallel histories (China, Islam). **HARD STOP:** Catastrophic lack of consilience; dismissal scale immense.  
      *   **5 (Triage):** **REJECT.** (Less ideal for "Myth" display than Atlantis - more complex, politicized).

  3.  **Ancient Metallurgists Needed Alien Tutors (Slag Purity):**  
      *   **1 (Core Claim):** Ancient slag purity "too high," therefore impossible without alien tech. Challenges understanding of human innovation. **FLAG:** "Aliens did it" trope.  
      *   **2 (Sources):** Likely cites slag studies (real science). **ASK:** How are they interpreted? Does pitch dismiss archaeometallurgical studies showing *how* ancient smiths achieved purity? **FLAG:** Likely misrepresents source conclusions (study probably shows skill, not impossibility).  
      *   **3 (Falsifiability):** Slag purity *is* measurable. **CHECK:** Does the pitch *demonstrate* the purity is *impossible* via known ancient methods? Almost certainly misapplies the study – confuses "high for the period" with "impossible." Ignores replication of ancient techniques. **FLAG:** Misapplication of science.  
      *   **4 (Consilience):** Requires dismissing all evidence of gradual metallurgical development, experimental archaeology replicating techniques, cultural contexts of smithing. **JUDGMENT:** Significant dismissal, but focused on one technical point. Not a *total* chronology wipeout like Fomenko. **FLAG:** Lack of consilience.  
      *   **5 (Triage):** **REJECT** (based on misapplied science, "alien" trope FLAGS, lack of consilience). Low "Myth Formation" potential (common trope, less unique mechanism than Atlantis).

  **Where the Protocol Might Misfire:**  
  *   **Emerging Legitimate Paradigm Shifts:** Truly revolutionary (but sound) scholarship *might* initially challenge consilience (e.g., initial Clovis First challenge). **Mitigation:** Step 5 "Needs Major Scholarly Review" path. Does it have *strong, direct, replicable* evidence *and* a coherent model? Fomenko/Atlantis don't.  
  *   **Highly Technical Debates:** A pitch critiquing *specific* interpretations within a narrow field might get flagged if the editor lacks niche expertise. **Mitigation:** Step 5 "Needs Major Scholarly Review" – recognize when it's a specialist debate, not pseudohistory.  
  *   **Cultural Interpretation vs. Pseudohistory:** A pitch presenting a *cultural* interpretation of Atlantis (not literal) as myth or inspiration, using the Azores as a *modern* focal point, *might* trigger initial flags but shouldn't meet Hard Stops if framed correctly. **Mitigation:** Step 1 clarity on the *nature* of the core claim is vital.

  This protocol prioritizes identifying fundamental flaws (Hard Stops) and red flags (Values Flags) quickly. It explicitly acknowledges where your scholarly judgment is essential while providing concrete checks to make that judgment defensible and focused. The "Myth Formation" flag ensures rejected ideas with educational value aren't entirely lost.
