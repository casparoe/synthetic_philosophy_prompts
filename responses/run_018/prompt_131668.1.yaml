answer: |-
  Here’s a tight 50-minute teaching arc focused purely on the **conceptual puzzle of "address-space commemoration"** — stripped of politics, grounded in ethics of public memory. Designed for smart non-philosophers.

  **Core Dependency Order (Non-Negotiable Sequence):**  
  1. **How commemoration WORKS** (intentional honor) →  
  2. **How it SLIDES into utility** (passive labeling) →  
  3. **Why removal FEELS like erasure** (loss of practical function ≠ deleting history)  
  *Skip this order, and the distinction collapses into "Is the person good/bad?"*

  ---

  ### **The Plan**  
  **Carrying Example:** **"Columbus Circle" in NYC**  
  *Why it works:*  
  - Embedded in daily speech ("Meet at Columbus Circle station," "Turn left at Columbus Circle")  
  - Most users aren’t *thinking* about Columbus; it’s a geographic tag  
  - Statue exists but isn’t a focal point of active civic ritual  
  *Avoid:* Confederate monuments (too politically live; honor/villainy debate hijacks the concept).  

  ---

  ### **The Arc (50 Mins)**  
  **1. Warm-Up: What’s Commemoration *For*? (8 mins)**  
  - *Activity:* "Shout out local streets/statues named after people. *Why* were they named that way?"  
  - *Key Point:* Commemoration = **intentional act of honor**. We put names/statues up to say *"This matters; remember this."*  

  **2. The Slide: When Honor Becomes Hardware (12 mins)**  
  - *Example Drill-Down:* "Hands up if you’ve used ‘Columbus Circle’ as a meeting spot. Did you *think* about Columbus? Why not?"  
  - *Concept Intro:* **Address-space commemoration** = when the name/object loses its "honor" function and becomes **spatial infrastructure**. It’s a landmark, not a lesson.  
  - *Visual:* Show a Google Maps pin at Columbus Circle. "The algorithm doesn’t care about history. It cares that you find your friend."  

  **3. The Tension: Removal = Erasure? (15 mins)**  
  - *Hypothetical:* "Say NYC renames it ‘Harmony Circle.’ You’re giving directions: ‘Turn left at Harmony Circle.’ What changes?"  
  - *Misconception 1: "Removing it erases history!"*  
    - **Head-off here:** "Does deleting ‘Columbus Circle’ from Google Maps *delete* Columbus from history books? No. It deletes a *label*, not memory. The erasure fear confuses **functional loss** with **historical amnesia**."  
  - *Misconception 2: "Names are just neutral labels!"*  
    - **Head-off here:** "But why name it *after a person* at all? The ghost of honor lingers. Neutral would be ‘Circle #5.’ The ethical puzzle: Can a label *shed* its honor but *keep* its history?"  

  **4. Nuance: Not Just Villains (10 mins)**  
  - *Example Shift:* "Imagine ‘Einstein Avenue’ becomes ‘That weird intersection with the bagel shop.’ Einstein isn’t a villain! But if we rename it, is it ‘canceling’ him?"  
  - *Misconception 3: "This only applies to bad people!"*  
    - **Head-off here:** "The trigger isn’t villainy—it’s **functional decay**. When the honor fades but the utility remains, removal feels ‘neutral’ to users but ‘symbolic’ to historians."  

  **5. Check Question (5 mins)**  
  > *"If a city renamed ‘Jefferson Street’ (where locals say ‘Turn left at Jefferson’) to ‘Main Street’ after 100 years, is this:*  
  > *a) Erasing Thomas Jefferson?  
  > b) Correcting historical injustice?  
  > c) Updating outdated infrastructure?  
  > d) All/none?"*  
  **→ Correct Insight:** They should spot that (a) and (b) assume the name *still* functions as honor. (c) recognizes address-space decay. The ethical tension lives in the gap.  

  ---

  ### **What to LEAVE OUT (and Why)**  
  - **Legal property doctrine** (e.g., who *owns* the statue). *Why:* Drags in tangential bureaucracy.  
  - **Contemporary political cases** (e.g., Rhodes, Lee). *Why:* Forces "side-taking," obscuring the conceptual slide.  
  - **How to decide *when* decay happens**. *Why:* Subjective; distracts from recognizing the *phenomenon* itself.  

  **Teaching Mantra:** "We’re archaeologists of public memory, not politicians. Dig the concept first."  

  This structure makes the "puzzle" visceral. Writers will latch onto the **Columbus Circle** example as a neutral testing ground. The focus on *functional decay* prevents it from becoming a moral referendum. Good luck!
