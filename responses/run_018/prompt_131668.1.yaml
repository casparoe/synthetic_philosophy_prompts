  A check question at the end could be: "If a city renamed 'Jefferson Street' to 'Main Street' after 100 years of common use, would it be erasing Jefferson or retiring an outdated label?" This tests their grasp of the conceptual split.

  I should leave out legal property doctrines because they're tangential and could politicize the discussion. Staying focused on the conceptual decay keeps the workshop on track.

