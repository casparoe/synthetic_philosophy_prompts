prompt: |-
  I'm preparing a chapter on whether the badness of pain is fixed by its phenomenal character or by its functional role in motivation and damage-monitoring, and I need a precisely engineered scenario that pulls these apart in a direction standard examples miss. Please construct a realistic, non-science-fictional clinical case—no longer than a paragraph—featuring a subject with complete pain asymbolia: they retain intact sensory-discriminative capacities and can report qualities like sharpness or burning, yet experience no negative affect, no withdrawal motivation, and no amygdalar or anterior cingulate tagging. In addition, the subject suffers from what I term predictive phantom nociception: endogenous false nociceptive signals arising without peripheral tissue damage, localised to a limb, but generated purely by faulty predictive coding in the absence of any actual bodily threat.

  The case must be designed so that:
  (i) an intrinsic-phenomenal theory of pain's badness holds that the phantom experience is genuinely bad for the subject, precisely because the qualitative feel is present;
  (ii) a functional-aversive theory holds that it is not bad, or is bad only derivatively, because the signal carries no damage information and triggers no protective behaviour;
  (iii) the divergence depends specifically on the interaction of asymbolia and the phantom, damage-free source—not on generic doubts about phantom sensations.

  Then verify the design: state the experiential belief, specify the nearby worlds in which tissue damage is present or affective tagging is restored, and show why each theory gives its verdict. Identify the feature that does the theoretical work—whether the absence of affect, the absence of damage, or their conjunction—and explain what collapses if it is removed. Also show how a functional-aversive theorist might attack the case (for instance, by arguing that reports lacking motivational pull do not amount to genuine pain), and how a phenomenalist might reply.

  Write the response in British English. Finally, please state explicitly what would change your mind: which empirical finding or conceptual argument (for example, evidence that anterior insula activation is necessary and sufficient for the badness of pain even in asymbolia) would cause you to revise your assessment of which feature carries the weight, and identify the point in your reasoning where failure is most likely.
