prompt: |-
  In the long-running debate over norms of assertion — whether knowledge, truth, or belief sets the standard — my philosophy seminar has stalled specifically over what I shall call epistemic delegation loops. Picture a research team in which scientist A asserts a statistical claim that depends on colleague B’s analysis, B’s analysis in turn depends on A’s data-cleaning protocol, and neither party has direct access to the raw measurements. Defenders of the knowledge norm argue that within such loops no individual possesses the requisite knowledge, so collaborative science routinely produces speech acts that are true and believed yet normatively defective. Their opponents reply that this mistakes the ontology of knowledge in collective inquiry: knowledge is structurally distributed across the loop, so requiring each speaker to know individually would paralyse scientific communication. For years we have traded parallel cases — clinical consultants, climate-model citations, legal expert witnesses — but neither side has conceded a single example, and the debate now feels like an exchange of intuitions about “who really knows” rather than a testable disagreement. Is this stall primarily verbal — a dispute over whether “knowledge” applies only to individuals — or is it substantive: a hidden disagreement about whether assertion norms are descriptive regularities or regulative ideals? Might it also be that one camp is asking about individual moral responsibility for speech, while the other is asking about the functional design of epistemic institutions, so that they answer different questions under a single heading? Diagnose the structure of the disagreement using what each side actually says, and tell me what, if anything, would count as progress given your diagnosis — for instance, a principled distinction between collective and distributed knowledge, a formal model of testimony chains, or an argument that the question is ill-posed. Please answer in British English.
