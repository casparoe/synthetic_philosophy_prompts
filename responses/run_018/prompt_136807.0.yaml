answer: |-
  Based on your precise description and conceptual mapping, this **is a distinct rhetorical maneuver** without a universally established, single term in the core literature on restitution or museum ethics. It represents a **strategic inversion of the moral charge of restitution advocacy**, transforming the retained object into a hostage to the perpetrator's conscience. Let's dissect its boundaries relative to neighboring concepts:

  ### Mapping Existing Concepts & Their Insufficiency
  1.  **Universal Museum / Encyclopedic Argument:**
      *   **What it is:** Claims objects belong where they serve the broadest global audience, emphasizing *humanity's shared heritage*, aesthetic appreciation, or scientific study transcending origins.
      *   **Why it doesn't fit:** Your phenomenon *explicitly rejects universality*. The pedagogical value hinges on the object being displayed *specifically within the former colonial metropole* to confront *that specific society* with its own past violence. Universality emphasizes *accessibility* and *shared benefit*; this argument emphasizes *location-specific guilt* and *perpetrator-facing pedagogy*. The audience isn't "everyone," it's "us, the guilty party."

  2.  **Cultural Integration / "Become Part of Our Heritage" Argument (e.g., Parthenon Marbles):**
      *   **What it is:** Claims that prolonged possession (often centuries) integrates the object into the *current* cultural identity of the holding nation, creating a new significance independent of origin.
      *   **Why it doesn't fit:** Your phenomenon *explicitly rejects integration*. Its power comes from the object's *persistent foreignness* and its *unhealed wound* status as evidence of a specific crime. Integration argues the object *belongs here now*; this argument claims the object *must stay here as an accusation*, precisely *because* it doesn't belong and represents an unresolved crime. Temporality is irrelevant if the crime remains unaddressed.

  3.  **Counter-Monumentality:**
      *   **What it is:** An intentional design strategy for memorials that rejects traditional heroic forms, instead provoking discomfort, questioning, and active engagement from viewers, often through abstraction, impermanence, or challenging the viewer's position.
      *   **Why it doesn't fit:** Your phenomenon is not primarily about *design intent*. It's an *ex post facto justification* applied to an existing object whose original context was violent acquisition, not memorial creation. While it shares the goal of provoking discomfort in the perpetrator society, it lacks the *deliberate conceptual framing* central to counter-monumentality. The object becomes a counter-monument *by accident of history and retention*, not by design.

  4.  **Stewardship Arguments (Preservation, Access, Expertise):**
      *   **What it is:** Claims the current holder possesses superior resources, expertise, or infrastructure to preserve the object and ensure its accessibility/study, implying the source community might lack these.
      *   **Why it doesn't fit:** Your phenomenon explicitly *sidesteps comparative capacity*. It admits the violence and frames retention purely in terms of a *moral duty to remember the crime imposed on the perpetrator society*. Stewardship focuses on the *object's physical care*; this focuses on the *object's function as evidence within a specific societal conscience*. It's about moral psychology, not conservation science.

  ### Defining the Phenomenon & Its Boundaries
  **Core Essence:** The transformation of a violently acquired object into a compulsory, self-implicating testimonial device that must remain within the geographic/cultural space of the perpetrator society to serve as an inescapable material accusation and prevent societal amnesia regarding colonial violence. Retention is framed not as a right or neutral act, but as a *duty of remembrance imposed upon the guilty party*.

  **Boundary Conditions (What it IS):**
  *   **Requires Explicit Acknowledgment:** The colonial violence and illegitimate acquisition *must be admitted* as the foundational premise. Denial nullifies this move.
  *   **Location is Pedagogically Crucial:** The argument hinges on the object *physically residing within the "perpetrator space"* (former colonial metropole, national museum, etc.) for its memorial function. Moving it "home" is framed as hiding the evidence *from the perpetrators' descendants*.
  *   **Object as Accusation:** The object's primary value in this framing is its *evidentiary and accusatory power* regarding a specific historical crime committed by the society housing it. Aesthetic or universal heritage value is secondary or irrelevant.
  *   **Restitution as Erasure:** Returning the object is explicitly equated with *actively destroying evidence* or *facilitating societal forgetting* of the colonial crime within the perpetrator society.
  *   **Self-Implication:** The institution/state positions itself as the reluctant *custodian of its own indictment*, holding the object *against itself* as a permanent reproach.

  **Boundary Conditions (What it IS NOT):**
  *   **Not Denial:** It explicitly acknowledges the colonial wrong.
  *   **Not Universality:** It rejects the idea that the object belongs to/benefits "everyone" equally; its value is tied to confronting a *specific guilty party*.
  *   **Not Integration:** It relies on the object's *persistent alienness* and status as an *unresolved grievance*, not its assimilation.
  *   **Not Stewardship:** It avoids arguments about superior care; the justification is purely memorial/moral.
  *   **Not Counter-Monumentality by Design:** It's a *retrospective justification*, not an intentional memorial strategy. The accusatory function emerges from the history *plus* the choice to retain, not from a conceptual artistic/memorial design brief.

  ### Coined Term & Definition
  Given the gap, a precise term is warranted:

  **Perpetrator-Mandated Testimony (PMT)**

  **Definition:** A retentionist justification whereby an institution or state, while acknowledging an object was acquired through colonial violence, asserts that its continued possession within the geographic/cultural sphere of the perpetrator society is morally necessary. This necessity stems from the object's function as an irreplaceable material witness that compels the perpetrator society to confront its own historical crimes. Restitution is presented not merely as loss but as an act of historical erasure, destroying the evidence required for perpetual self-accusation within the society responsible for the original violence. PMT reframes retention as the fulfillment of a duty to preserve an accusatory presence against oneself.

  **Why this term works:**
  1.  **"Perpetrator":** Explicitly identifies the actor and the location (their societal space) as central.
  2.  **"Mandated":** Captures the *compulsory* nature – the object is held *to force* remembrance/confrontation.
  3.  **"Testimony":** Emphasizes the object's role as *material evidence* of a crime, serving an *accusatory function*.
  4.  **Distinguishing Power:** Clearly separates PMT from universality (no "mandate" from humanity, only from the perpetrator's conscience), integration (no becoming "ours," only a permanent "yours used against us"), stewardship (not about care, about evidence), and counter-monumentality (not designed, retroactively mandated).

  **In essence:** You and your friend *are* arguing about a recognizable, distinct rhetorical position, but one lacking a standardized label. PMT is a cynical, self-serving inversion of ethical responsibility. It weaponizes the language of memorialization to deny restitution, positioning the perpetrator institution as the heroic guardian of its own indictment, while denying the source community control over the narrative and disposition of *their* cultural patrimony and the evidence of crimes committed *against them*. It's retention justified as self-flagellation, performed entirely on the perpetrator's terms.
