  Below is a decision-tree taxonomy designed to sort commitments about outcome-based reasoning in Buddhist ethics, using concrete case judgments to avoid self-identification prompts. The tree starts with a foundational case and branches through 6 nodes (questions), culminating in the five specified leaf positions. Nodes are phrased as answerable claims or case comparisons, drawing on core Buddhist concepts (karma, intention, no-self, skillful means) without relying on sectarian labels. The tree flags unoccupied branches and non-separable leaf pairs, and includes a scoring key. Logical gaps are noted in the mapping.

  ### **Decision Tree Taxonomy**

  **Node 1: Role of Outcomes in Moral Assessment**  
  *Case:* A surgeon performs life-saving surgery with pure compassionate intention. In Scenario X, the surgery succeeds and the patient thrives. In Scenario Y, an identical surgery fails due to an unforeseen complication, and the patient dies.  
  **Claim:** "The surgeon's act in Scenario X is morally better than in Scenario Y."  
  - **Agree** (outcomes affect moral status) → Proceed to Node 2.  
  - **Disagree** (outcomes do not affect moral status) → Proceed to Node 3.  

  **Node 2: Karmic Outcomes vs. Immediate Welfare**  
  *Case:* A bodhisattva kills a villain to prevent the villain from murdering 100 people. The bodhisattva acts with pure compassion (no hatred), saving 100 lives, but accrues negative karma guaranteeing their future rebirth in a lower realm.  
  **Claim:** "The bodhisattva’s act is morally justified, as the net welfare gain (100 lives saved) outweighs the bodhisattva’s future suffering."  
  - **Agree** (karmic outcomes are weighable against others' welfare) → **Leaf (b): Direct Buddhist consequentialism**.  
  - **Disagree** (karmic outcomes cannot be outweighed) → Proceed to Node 4.  

  **Node 3: Permissibility of Harm Under Intention-Only Ethics**  
  *Case:* A monk, acting spontaneously from non-attached compassion, kills a dying animal to end its agony (no outcome calculation).  
  **Claim:** "This act is morally permissible solely due to the monk’s mental state, even if it causes harm."  
  - **Agree** (intention alone can justify harm) → Proceed to Node 5.  
  - **Disagree** (harm is never permissible) → Proceed to Node 6.  

  **Node 4: Moral Weight of Karmic Latency**  
  *Case:* A teacher harshly criticizes a student to correct their behavior, causing short-term distress but improving the student’s long-term well-being. The teacher gains negative karma (future mental distress) but believes the student benefits.  
  **Claim:** "The act’s moral value depends only on how it shapes the teacher’s future mental continuum (e.g., via karma), not on the student’s welfare."  
  - **Agree** (only agent-relative outcomes matter) → **Leaf (c): Karmic-latency hybrid**.  
  - **Disagree** → *Unoccupied branch* (disagreement implies incoherence; rejecting outcome-tracking altogether contradicts Node 1 path).  

  **Node 5: Skillful Means vs. Calculation**  
  *Case:* A nun donates all temple funds to a beggar, motivated by spontaneous compassion. Unbeknownst to her, this leaves the temple unable to feed refugees the next day.  
  **Claim:** "The act is morally acceptable only if it lacked any deliberation about outcomes (e.g., ‘this donation might cause future harm’)."  
  - **Agree** (non-calculative spontaneity is essential) → **Leaf (e): Upaya exception view**.  
  - **Disagree** → *Unoccupied branch* (no leaf position permits harm via calculation when outcomes are deemed irrelevant; this would conflate with consequentialism).  

  **Node 6: Basis for Prohibiting Harm**  
  *Case:* A policymaker considers harming one group to benefit a larger group, but rejects this due to Buddhist principles.  
  **Claim:** "The prohibition stems from no-self (anatman) making aggregated welfare incoherent, not from the wrongness of harmful intentions."  
  - **Agree** (anatman blocks aggregation) → **Leaf (d): No-self block**.  
  - **Disagree** (harm is wrong due to intention alone) → **Leaf (a): Strict intention-based view**.  

  ---

  ### **Taxonomy Notes**  
  1. **Unoccupied Branches**  
     - **Direct Consequentialism + No-Self Gap**: The tree does not test if leaf (b) (direct welfare aggregation) combines with anatman, as Node 2 assumes aggregation is coherent. This gap is *merely unexplored* in the tree (not inherently incoherent), as some scholars argue aggregation can function without a substantial self (e.g., via dependent origination of experiences). However, if a respondent endorses (b) *and* later rejects aggregation under anatman (e.g., in Node 6), it would create tension.  
     - **Node 4 "Disagree" and Node 5 "Disagree"**: These branches are unoccupied, as they imply inconsistent commitments (e.g., affirming outcomes matter in Node 1 but rejecting all outcome-based reasoning later).  

  2. **Non-Separable Leaf Pairs**  
     - The cases **fail to cleanly separate (a) and (d)**. Both reject harm (Node 3 → Disagree), and distinguishing them requires the conceptual Node 6. A respondent might confuse "intention" (a) with "no-self" (d) if they conflate intention-based wrongness with metaphysical objections to aggregation.  

  3. **Logical Mapping of Leaves**  
     | Leaf | Position |  
     |------|----------|  
     | (a)  | Strict intention-based view: Outcomes are irrelevant; morality hinges solely on cetana (e.g., harmful acts are wrong because volitional intention is unwholesome). |  
     | (b)  | Direct Buddhist consequentialism: Net welfare (including karmic outcomes for all beings) determines morality; aggregation is coherent. |  
     | (c)  | Karmic-latency hybrid: Only outcomes affecting the agent’s future mind (via karma) matter; others’ welfare is irrelevant. |  
     | (d)  | No-self block: Consequentialism fails because anatman dissolves the "summed welfare" required for aggregation. |  
     | (e)  | Upaya exception view: Harm is permissible only when expressing non-attached spontaneity, not calculation. |  

  ---

  ### **Scoring Key**  
  Translate answer patterns into leaf positions:  

  | Path                                      | Leaf |  
  |-------------------------------------------|------|  
  | Node 1: Agree → Node 2: Agree             | (b)  |  
  | Node 1: Agree → Node 2: Disagree → Node 4: Agree | (c)  |  
  | Node 1: Disagree → Node 3: Agree → Node 5: Agree | (e)  |  
  | Node 1: Disagree → Node 3: Disagree → Node 6: Agree | (d)  |  
  | Node 1: Disagree → Node 3: Disagree → Node 6: Disagree | (a)  |  

  **Unscorable Paths**:  
  - Node 1: Agree → Node 2: Disagree → Node 4: Disagree → Invalid (no leaf; outcome-relevance contradicts rejection of all outcome types).  
  - Node 1: Disagree → Node 3: Agree → Node 5: Disagree → Invalid (no leaf; permits harm without upaya or outcomes).  

  This tree isolates core tensions (e.g., karma as outcome vs. mental conditioner, aggregation under anatman) while using cases accessible to students with basic knowledge of karma, intention, and no-self. It achieves discrimination between all leaves except (a)/(d), which share a prohibition on harm but diverge metaphysically.
