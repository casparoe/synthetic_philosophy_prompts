  The broader conditions for cooperation: Axelrod emphasizes repeated interactions and recognizable partners. But here, large groups cooperated. Factors like mutual vulnerability, predictability, and shared routines might substitute. The stability came from routine adherence, which reduced uncertainty. Even without individual recognition, the collective pattern persisted.

