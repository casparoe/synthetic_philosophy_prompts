answer: |-
  Here's the translation you requested, strictly within contract law doctrine, followed by the residue report and interpretive conclusion:

  ### The Frame Problem & Solutions in Contract Law Terms
  1.  **The Frame Problem Itself:**
      *   **Scenario:** Parties amend an existing, complex Master Agreement.
      *   **Problem:** After the amendment takes effect, determining precisely which *original obligations persist unchanged* and which *are extinguished or modified* solely by the amendment document. The amendment explicitly lists changes (new clauses, deletions, modifications) but is silent on most original terms.
      *   **The "Frame" Burden:** To ensure legal certainty, one might feel compelled to interpret the amendment as *only* changing the expressly stated terms. However, this seems insufficient because amendments sometimes *implicitly* supersede or render inoperative *related* but unmentioned clauses through inconsistency or fundamental change in purpose. Conversely, most unmentioned clauses *should* survive. The "problem" is the potential ambiguity about this survival without exhaustive restatement.
      *   **Contractual Analogy:** Imagine an amendment deleting a "Minimum Annual Purchase" clause. Does the original "Exclusivity" clause automatically survive? What about the "Most Favored Nation Pricing" clause that referenced minimum volumes? The amendment is silent. The "frame problem" is the fear that without explicitly restating *every* surviving clause (an impractical burden), some necessary continuity is missed, or some unintended termination occurs.

  2.  **The Standard Frame-Axiom Strategy:**
      *   **The Approach:** Treat the amendment as a *wholesale replacement* requiring explicit continuity declarations. For *every single obligation* in the original contract that should persist unchanged, the amendment must affirmatively restate it or include a specific "Continuity Clause" naming it (e.g., "All terms of the Original Agreement not expressly modified or deleted herein, including specifically Clause 7 (Confidentiality) and Clause 12 (Governing Law), shall remain in full force and effect").
      *   **Role in Contract:**
          *   *Listing Unchanged Clauses:* The exhaustive enumeration within the Continuity Clause.
          *   *Specifying Changes:* The express modifications/deletions listed elsewhere in the amendment.
          *   *Lingering Worry:* This is burdensome, error-prone, and impractical for large agreements. Drafters worry they might omit a crucial clause from the Continuity Clause list, accidentally terminating it. It also makes amendments verbose and rigid.

  3.  **The Successor-State-Axiom (SSA) Response:**
      *   **The Approach:** Establish a default *Interpretive Rule* within the Master Agreement itself: **"All obligations survive amendment unless expressly terminated, modified, or rendered inoperative by the necessary implication of the express changes."** This is the "Amendment Survival Doctrine" (ASD).
      *   **Role in Contract:**
          *   *Listing Unchanged Clauses:* Not needed. Survival is the default.
          *   *Specifying Changes:* The express modifications/deletions in the amendment. Crucially, the ASD also implies terminations where *necessary implication* demands it (e.g., deleting a "Minimum Annual Purchase" clause *necessarily implies* termination of a "Volume-Based Discount" clause predicated solely on meeting that minimum).
          *   *Lingering Worry ("Residual Ambiguity"):** What constitutes "necessary implication"? Does deleting the Minimum Purchase clause *necessarily imply* termination of the Exclusivity clause? What about the MFN clause referencing volumes? The ASD avoids explicit listing but introduces ambiguity around the scope of "necessary implication" – the boundary between what *must* be terminated by implication and what *can* survive despite the change. This requires interpretive judgment on a case-by-case basis.

  ### Residue Report: Translation Fidelity
  *   **Translates Cleanly:**
      *   The core problem of determining continuity after a change (amendment vs. action) maps directly.
      *   The "frame axiom" strategy maps perfectly to requiring explicit Continuity Clauses listing unchanged obligations.
      *   The "successor-state axiom" strategy maps cleanly to a default Amendment Survival Doctrine (ASD) with survival as the rule.
      *   The express changes/modifications in the amendment directly correspond to the explicit effects listed in an action.
      *   The "residual ambiguity" of SSAs maps directly to the ambiguity inherent in determining the scope of "necessary implication" under the ASD – what *must* be terminated implicitly.
      *   The worry about silent omissions causing unintended consequences is central to both contexts.

  *   **Requires Distortion to Fit:**
      *   **"Inertia" of Properties:** The AI concept of properties persisting by default ("inertia") is slightly anthropomorphic for contracts. Contract law uses doctrines like implied terms and the ASD, framed as interpretation based on intent and business efficacy, rather than a metaphysical "inertia." The *effect* (survival as default) is the same, but the *rationale* differs.
      *   **Formal vs. Open Texture:** AI formalisms aim for complete, unambiguous specification. Contract law accepts inherent open texture – terms like "necessary implication," "good faith," or "commercially reasonable" require contextual judicial interpretation. The SSA *aspires* to formality, while the ASD *embraces* interpretative necessity.

  *   **No Counterpart in Contract Law:**
      *   **Exhaustive World State:** AI planning often assumes a complete, discrete description of the entire "state of the world." Contracts never attempt this; they govern specific, defined obligations between parties within an undefined, evolving world. The "state" is only the contractual rights/duties, not everything true in the universe.
      *   **Causal vs. Interpretive Link:** AI often frames effects (including frame axioms/SSAs) in terms of *causal laws*. Contract law frames continuity entirely through *interpretive doctrines* (intent, business efficacy, implication) – it's about construing meaning, not describing physical causality. The "why" behind survival is different.

  ### Interpretive Conclusion: The Conceptual Gap
  The material with **no counterpart** – specifically, the AI assumption of an *exhaustive, formal world state description* and the framing of persistence in terms of *causal laws* – **reveals a genuine conceptual gap, not a pseudo-problem.**

  *   **Why it's not just an artifact:** The core challenge *does* translate: the difficulty of perfectly capturing which aspects of a prior state (contractual obligations/world properties) persist through a change (amendment/action) without exhaustive, impractical enumeration. The "residual ambiguity" around implicit termination/survival exists in both domains. Contract law *acknowledges* this ambiguity as inherent and provides doctrines (like implied terms and interpreting "necessary implication") to manage it through human judgment. The frame problem highlights this same inherent ambiguity within a formal system that *aspires* to eliminate it.
  *   **What contract law "misses":** Contract law doesn't "miss" a distinction needed for an adequate theory of change *within its domain*. Its interpretive, context-dependent approach is well-suited to human agreements in an open world. However, the frame problem exposes a limitation for *formal, mechanical systems*: **No purely formal, representational scheme (like SSAs or ASD boilerplate) can *entirely eliminate* the need for contextual interpretation to resolve borderline cases of implied change ("necessary implication")**. The gap highlighted by the untranslatable elements shows that AI's goal of complete, context-free formalization of change encounters a fundamental barrier – the ambiguity inherent in distinguishing explicit effects from non-effects in a complex system. Contract law *accepts* this ambiguity as unavoidable; the frame problem demonstrates *why* it's unavoidable even in formal systems aspiring to completeness.
  *   **The Verdict:** Your suspicion holds. The residual ambiguity about which properties persist (contractual obligations survive) is real and inherent. Successor-state axioms (the Amendment Survival Doctrine) shift the burden from explicit listing to explicit *plus implied* termination, but the boundary of that implication ("necessary implication") remains inherently ambiguous and context-dependent. This ambiguity isn't created *by* the formalism; it's exposed *through* the formalism's attempt to mechanize a process (determining continuity through change) that intrinsically requires interpretive judgment in complex, interconnected systems. Contract law confirms the reality of the puzzle by showing how it handles the same core ambiguity through its doctrines of implication and interpretation.
