answer: |-
  Here's the full spec – no fence-sitting, clear lines drawn based on the reality of brains and ethics. This is built for the messy intersection of neurobiology and moral worth you're grappling with.

  **Desiderata Table**

  | Requirement                                       | The Motivating Case or Distinction Behind It                                                                 | Your Call: Non-Negotiable (NN) or Negotiable (N)? | What It Rules Out If Hard                                                                 | Tension With Other Rows                                                                 |
  | :------------------------------------------------ | :----------------------------------------------------------------------------------------------------------- | :------------------------------------------------ | :---------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------- |
  | **No Arbitrary Cutoffs**                          | Avoiding "magic number" brain mass thresholds that devalue humans with microcephaly or overvalue large, simple brains (e.g., whale). | **NN**                                            | Theories relying solely on absolute brain size or volume as the primary moral determinant. | Potential tension with **Performance Matters** if performance correlates strongly with size in *some* ranges. |
  | **Performance Matters**                           | Recognizing that cognitive/behavioral output (problem-solving, learning, suffering) is the ultimate ethical signal, not just hardware. | **NN**                                            | Theories ignoring actual cognitive capacity or behavioral complexity regardless of substrate. | Can create tension with **Microcephaly Test** if performance *is* significantly impaired. |
  | **Microcephaly Test**                             | Ensuring the theory doesn't strip moral status from humans born with significantly smaller brains but demonstrable personhood. | **NN**                                            | Theories where moral status is *directly and rigidly* proportional to brain mass or neuron count. | Sharpest tension with **No Arbitrary Cutoffs** & **Performance Matters** – requires balancing hardware limits with human dignity. |
  | **Neuroanatomy Respect**                          | Distinguishing the large, glia-heavy brain of a cow from the small, neuron-dense, complexly wired brain of a crow. | **NN**                                            | Theories collapsing all brain matter as equivalent (mass-only) or ignoring wiring complexity (density-only). | None – this is foundational to getting the biology right.                               |
  | **Substrate Independence**                        | Accepting that different neuroarchitectures (mammalian cortex vs. bird pallium) can achieve similar functional complexity. | **NN**                                            | Theories privileging specific brain structures (e.g., "only neocortex counts") over demonstrable function. | None – essential for comparing across species meaningfully.                             |
  | **Avoid "Human Exceptionalism" By Fiat"**         | Preventing special pleading *just* for humans without a biologically defensible reason tied to capability. | **NN**                                            | Theories granting humans unique moral status *solely* based on species membership, ignoring comparable capacities elsewhere. | Tension with **Performance Matters** if humans *do* have unique capacities. Must be proven, not assumed. |
  | **Capacity for Suffering is Paramount**           | Recognizing that the ability to experience negative states (pain, fear, distress) creates a primary moral claim. | **NN**                                            | Theories prioritizing abstract cognition over sentience, or ignoring suffering in neurologically simpler beings. | Tension with **Performance Matters** if complex cognition is prioritized *over* basic sentience. |
  | **Connectomic Complexity > Raw Mass/Density**     | Prioritizing the richness of neural connections (synapses, pathways, integration) over sheer volume or cell count. | **NN**                                            | Theories valuing a large, simple mass (e.g., dugong) over a small, highly complex network (e.g., parrot). | Potential tension if high density *enables* complexity, but complexity is the goal.      |
  | **Graded, Not Binary**                            | Accepting that moral status likely exists on a spectrum based on cognitive/sentient capacity, not a simple "in/out". | **N** (Strong Preference)                         | Theories demanding absolute, binary thresholds for "personhood" or moral worth.            | Practical tension with legal/social frameworks that often need binaries.                |
  | **Avoid "Slippery Slope to Plants"**              | Providing a principled biological reason why a neuron-based network is relevant and a plant's signaling system isn't. | **N** (Important Safeguard)                       | Overly broad definitions of "cognition" or "sentience" untethered from neural substrate complexity. | Minimal; **Neuroanatomy Respect** and **Connectomic Complexity** handle this.           |

  **JSON Summary**

  ```json
  {
    "domain": "Neuroethics / Moral Status Attribution",
    "committed_position_summary": "Moral status depends primarily on the capacity for subjective experience (especially suffering) and complex cognition, grounded in the connectomic complexity and functional output of the nervous system. Absolute size, neuron density, and specific anatomy are secondary proxies; demonstrable performance and sentience are paramount. Human dignity is protected via the Microcephaly Test and rejection of arbitrary size cutoffs, but human exceptionalism requires proof of unique capacity, not assumption.",
    "hardest_conflict_pair": "**Microcephaly Test** vs. **Performance Matters**. Protecting the status of humans with severe microcephaly where cognitive performance *is* profoundly limited forces the hardest ethical calibration. The theory *must* accommodate human dignity here without collapsing into speciesism, while still acknowledging the performance deficit. Resolution leans heavily on **Connectomic Complexity** (even reduced human brains have human-level wiring potential) and **Graded** status.",
    "single_criterion_that_kills_most_theories": "**Neuroanatomy Respect**. Most simplistic theories (mass-only, density-only, structure-only) fail immediately because they cannot explain why a cow's large brain doesn't outrank a crow's small one on complexity/performance grounds, or why human microcephaly cases retain status. This forces engagement with the actual messy biology.",
    "confidence_level": "Medium-High on framework coherence and biological grounding. Lower on precise implementation details (e.g., exactly *measuring* connectomic complexity/sentience across species). The core constraints feel non-negotiable based on current neuroscience and ethics."
  }
  ```

  **The Hard Line Explained (Like We're Talking):**

  1.  **Forget Size, Mostly:** Judging a being by brain *size* alone is like judging a computer by its case. A kid with microcephaly isn't a computer case – they're the whole system, wired like a human, capable of love and pain. Whale brains are huge but mostly simple stuff. **Ruled Out:** Any theory saying "Bigger brain = more valuable." Dead on arrival.
  2.  **What Can It *Do*?:** The ultimate test is what the brain produces: Can it suffer? Can it solve problems? Can it learn complex stuff? A crow out-thinks a cow any day, despite the cow's bigger head. **Ruled Out:** Theories ignoring actual smarts or suffering because "wrong species" or "wrong shape."
  3.  **Humans Aren't Magic:** We don't get automatic top billing *just* for being human. If a parrot shows crow-level smarts and suffering, it deserves crow-level moral consideration. Prove we're special, don't just claim it. **Ruled Out:** "Humans first, ask questions never."
  4.  **Wiring is King:** What makes brains powerful isn't just weight or how many cells are packed in, but how crazy-intricate the connections are. A human brain (even a smaller one) is a hyper-complex network. A cow's big brain is relatively simple. A crow's tiny brain is astonishingly complex for its size. **Ruled Out:** Treating all brain cells equally or thinking density alone equals power.
  5.  **Suffering is the Baseline:** Pain, fear, distress – the ability to feel bad stuff is the most basic moral red flag. A being that can suffer deserves protection from suffering, full stop. Complex thought builds *on top* of that. **Ruled Out:** Ignoring the pain of a fish because it can't do calculus.
  6.  **It's a Scale, Not a Switch:** Moral worth isn't just "on" or "off." A chimp is probably "worth more" ethically than a frog, which is worth more than a shrimp. This reflects the ladder of brain complexity and capacity. **Not a Hard Rule, but Vital:** Life's messy. Binaries (person/not-person) are convenient but often cruel or inaccurate.

  **The Tightrope (Microcephaly):** The toughest spot is severe microcephaly where cognitive ability *is* profoundly limited. The theory **must** protect that human's dignity and basic rights (**Microcephaly Test**). But it can't pretend the performance isn't limited (**Performance Matters**). The resolution is twofold: 1) Even severely impaired humans possess a fundamentally human *type* of neural complexity and capacity for relational bonds/suffering, and 2) We accept a **graded** status – their moral claims might focus intensely on preventing suffering and ensuring care, even if complex autonomy is reduced. We don't throw them off the moral cliff.

  This framework forces the biology and ethics to talk directly, cuts through lazy size-ism or species-ism, and demands justification based on what brains *actually do* and how they *actually work*. It's built for the real-world cases haunting you.
