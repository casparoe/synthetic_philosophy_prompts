answer: |-
  ## Watershed Democracy Debate

  **Sam:** Alright, look. The Council decides how much water *everyone* in the basins gets – families in non-signatory Quebec, factories in Maine, even those autonomous allocation bots that physically shut off valves. Who gets a vote in *that* decision? Clearly, **all affected interests**. If the Council's call changes your life chances, your business viability, or *literally* alters your functional outputs like those bots, you’re part of the demos. Your stake defines inclusion.

  **Taylor:** Hold up. Affected? Sure, Quebecois farmers are affected. The bots are affected. My *lawn* is affected! But "affected" is endless. The demos isn't just a passive recipient pool; it's the body *authorizing* and subject to **coercive authority**. Quebec didn't sign the treaty; the Council can fine them or cut their supply, but they can't *vote* Quebec out. And those bots? They execute directives but have zero legal standing to *challenge* them in court or vote. They're tools, not members. Only entities the Council can legitimately compel *and* who hold reciprocal rights to contest belong. Otherwise, it's governance without accountability *to* the governed.

  **Sam:** Reciprocal rights? That’s artificially narrow! Those Quebec farmers suffer under rations just like citizens in signatory states. The bots’ entire purpose is disrupted by the directives. Excluding them because the Council’s enforcement mechanism is clunky or because we haven’t granted bots legal personality *yet* is ignoring the real impact. Democracy should serve those whose lives it shapes, period. We need a practical way to map the affected circle.

  **Taylor:** Practical? Define ‘impacted enough’. Marginal livelihood hit? Total shutdown? It’s a spectrum, Sam. Drawing that line anywhere is arbitrary. At least ‘subject to enforceable authority’ has a clear legal test: can the Council sanction you for non-compliance, and can you legally fight back? The Quebec farmer can theoretically sue the Council under international law (good luck), but the bot? It has no pathway. It just obeys code. Including it makes the demos incoherent.

  **Sam:** Fine, you want a test? How about this: **recursive constituency**. The *current* Council members – representing the initial signatory demos – vote on who *was* sufficiently affected by the *original* water allocation decisions to have deserved inclusion back then. The boundary isn't fixed; it self-corrects based on lived experience post-decision. Quebec might get voted in retrospectively.

  **Taylor:** *(Snorts)* Oh, that’s rich. So the council *that benefits from excluding Quebec now* gets to vote on whether Quebec *should have been included in the past*? That’s not self-correction, that’s self-*perpetuation*. It’s the ultimate circularity! They’d just vote to validate their own prior exclusion. You’ve baked the boundary problem *into the mechanism itself* – the initial power imbalance determines who gets to define the demos forever. How is that *less* arbitrary than my ‘can you be fined/jailed/sued’ test? It’s worse! At least my test doesn’t pretend the foxes get to design the henhouse membership *after* they ate the chickens!

  **Sam:** Okay, point taken on the recursive thing being vulnerable to capture... But your ‘coercion + rights’ test still leaves the Quebec farmers and the bots fundamentally governed without consent! They’re subject to the authority but locked out of the demos. That’s democratic deficit baked in.

  **Taylor:** Maybe. But your solution collapses into self-selecting oligarchy. My line might be exclusionary, but it’s based on a tangible relationship of authority and potential recourse. Including entities with no capacity for reciprocal political action – like those non-sentient bots – or jurisdictions utterly outside the Council’s legal framework just dissolves the demos into a shapeless mass of ‘impact’. You can’t build a functional *demos* on that. The boundary has to *mean* something enforceable.

  **Sam:** Even if it means people and systems are ruled without a voice? That *should* terrify you.

  **Taylor:** What terrifies me more is a ‘demos’ so broad and self-defining that it becomes meaningless. Your recursive idea proves my point – the mechanism itself becomes the tyranny. We need anchors, Sam. Flawed as ‘subjection’ is, it’s an anchor.
