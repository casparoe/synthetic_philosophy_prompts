  Hmm, the user presents a vivid scenario: someone reinterpreting past betrayal as caused by an undiagnosed neurological condition, thus shifting from malice to pathology. The question is whether Dennett's framework can distinguish between legitimate narrative growth and responsibility-dodging revisionism. 

  I notice the user is very precise about wanting to avoid smuggling in a substantive self. That's crucial. They're also hinting at "narrative solipsism" as a danger - where the present self can always rewrite the past. This suggests they've done close reading but found a genuine gap.

  Let me break this down. First, Dennett's model absolutely allows narrative revisions - that's part of its strength. But the user is right that unrestricted revision threatens moral responsibility. The challenge is finding constraints within the narrative framework itself.

  Ah! The key might be in Dennett's emphasis on narrative as an intersubjective project. The self isn't just a private story; it's woven through social verification. A purely self-serving revision wouldn't cohere with others' testimonies or institutional records. That creates friction.

  Also, the neurological explanation in their example isn't arbitrary - it would need diagnostic criteria, medical history, etc. The narrative must "earn its keep" by explaining more than just that one event. Does it make sense of other behaviors? Is it consistent with known facts?

  For moral responsibility, the issue isn't fixed past motives but present acknowledgment of authorship. Even under a new interpretation ("my brain made me do it"), the narrative still connects that past act to the current speaker as the same biological entity. Responsibility then becomes about present stance: does the person own the consequences? Make amends? 

  The user might worry this reduces responsibility to present attitudes. But Dennett would argue that's exactly right - responsibility is a current social status assigned to narratives that coherently link past to present. The alternative is chasing ghostly metaphysical bonds.

  Still, the framework has limits. In cases of extreme dissociation (like some DID presentations), the narrative may fracture beyond repair. But for ordinary cases, social embedment prevents full solipsism. The user's "retrocausation" only works if the community accepts the new narrative - which requires more than just convenience.

  I should emphasize that for Dennett, coherence isn't just internal consistency but explanatory power across multiple constraints: physical evidence, others' perspectives, predictive utility. A bad-faith revision would show strain at these points.
answer: |-
  Your question cuts to the heart of a profound tension in Dennett's narrative self model. Let's break down the mechanics of "narrative gravity" and its implications for diachronic responsibility without reintroducing a substantive self:

  ### 1. **The Mechanics of Narrative Binding**
     - **Coherence Over Causality**: Narrative gravity binds actions to agents through *explanatory coherence*, not psychological continuity. A past act belongs to "me" if it can be integrated into my current self-narrative through rationalizing links (motives, contexts, character traits).
     - **Retrofitting as Feature, Not Bug**: Dennett *embraces* retrofitting. Narratives are constantly revised ("The Boy Who Cried Wolf" becomes a fable about media distrust after 9/11). The self is a "web of discourses" (Dennett, *Consciousness Explained*) – its unity comes from *current* narrative integration, not past psychological states.
     - **Constraints on Revision**: Not all retrofits are equal. Narrative gravity requires:
       - **Conservatism**: Minimizing contradictions with *irreducible* facts (e.g., "I stole $1M" can't become "I donated $1M" without falsification).
       - **Generativity**: Explaining *more* than the target event (e.g., "undiagnosed condition" must also explain unrelated impulsivity).
       - **Social Negotiation**: Narratives exist in an "economy of vindication" (*The Intentional Stance*) – they must withstand communal scrutiny.

  ### 2. **Distinguishing Benign Growth vs. Responsibility-Evasion**
     Dennett's framework *can* distinguish them internally:
     - **Benign Growth**: Adds coherence while preserving *narrative accountability*. Example: "I betrayed because I was selfish → I now see my insecurity drove it → I own this flaw and make amends." The act remains *attached* to the agent's character arc.
     - **Responsibility-Evading Retrofitting**: Severs narrative ownership via *exculpatory redescription*. In your example:
       - **Problem**: The new frame ("neurological compulsion") doesn't just *explain* but *dissolves* agency. The act becomes an "alien intrusion" rather than a manifestation of the agent's narrative identity.
       - **Diagnostic Test**: Does the revision preserve the *authorial voice*? Evasive narratives treat past selves as *unrelated characters* ("That wasn't *me*, it was my disease"). Benign revisions maintain authorship ("That *was* me, but I understand it differently now").

  ### 3. **Preserving Diachronic Responsibility without a Substantive Self**
     Moral responsibility emerges from the narrative's *current structural properties*:
     - **Continuity as Narrative Inheritance**: Responsibility depends on whether the *present narrative* acknowledges debts/obligations from past chapters. If I narratively "disown" an act by attributing it to an extrinsic cause (e.g., "brain glitch"), I break the chain of narrative inheritance.
     - **The Social Scaffolding**: Narratives aren't solipsistic. They're co-authored:
       - **Communal Constraints**: A retrofitting that evades responsibility (e.g., "My betrayal was just undiagnosed autism") must convince the *moral community*. Victims, peers, and institutions act as "narrative auditors" rejecting incoherent exculpations.
       - **Institutional Facts**: Medical diagnoses themselves are narrative constructs requiring consensus. Claiming "undiagnosed condition" invokes an institutional reality that must be earned through evidence and professional validation.

  ### 4. **Blocking the Evasion Maneuver: Internal Resources**
     - **The "No Miracle" Principle**: An evasion retrofit that *only* explains the culpable act (and no other behaviors) violates narrative conservatism. It looks *ad hoc* – like claiming a miracle to save a theory.
     - **Moral Gravity**: Actions with strong normative weight (betrayal, harm) create "narrative singularities." They demand *more* explanatory work to revise. Dennett notes we treat certain acts as "fixed points" (*Freedom Evolves*) that constrain future narratives.
     - **First-Person Authority Limits**: While I have privilege over my experience, I don't have authority over *moral causation*. If my "neurological excuse" narrative doesn't cohere with observed behaviors or biological evidence, its gravity weakens.

  ### Conclusion: Responsibility as Narrative Endorsement
  Dennett's model **doesn't dissolve diachronic responsibility** but redefines it: I am responsible for past acts *to the extent that my current narrative center acknowledges them as mine* and sustains their normative consequences. Evasive retrofitting isn't impossible, but it faces high barriers:
  - It must achieve *explanatory coherence* without being *ad hoc*.
  - It must survive *intersubjective validation*.
  - It must maintain the *authorial thread* – treating the past self not as a foreign agent but as an earlier draft of the protagonist.

  The risk of "narrative solipsism" is mitigated by narrative gravity's **inescapable social embeddedness**. We are, as Dennett says, "entering characters" in others' stories. A self that constantly rewrites history to evade responsibility becomes an unreliable narrator – losing credibility and ultimately, its gravitational pull in the social world.

  *Key References: Dennett, D. (1991). Consciousness Explained. Dennett, D. (2003). Freedom Evolves. Dennett, D. (1987). The Intentional Stance.*
