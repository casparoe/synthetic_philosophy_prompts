answer: |-
  Here's a conceptual mapping of the 1919 Chicago Race Riots and the Commission Report through your "teleological parallax" lens, pinpointing distortions, breaks, and theoretical tensions:

  **Core Whig Narrative (Simplified):**
  The Riots are a tragic but necessary step in the "arc of progress" toward racial justice and integration. Black migrants are proto-civil rights actors demanding equality, white attackers are reactionary forces resisting inevitable progress, and the Commission authors are enlightened reformers laying groundwork for future change (like the Civil Rights Movement). The outcome (eventual desegregation, civil rights gains) retroactively defines the "right" side and the "wrong" side.

  **Teleological Parallax Application & Distortions:**

  1.  **Black Migrants:**
      *   *Whig Distortion:* Cast as conscious agents of integration and racial progress, their migration primarily framed as a political act challenging segregation.
      *   *Parallax Effect:* Agency is retroactively inflated and moralized. Their primary motivations (economic opportunity, escaping Southern terror, chain migration) are overshadowed. Their survival strategies (forming communities, demanding basic rights *within* a hostile system) are misread as deliberate, linear steps *towards* a future civil rights victory they couldn't foresee. Their complex internal politics and class differences are flattened.
      *   *Subtle Misstep Flag:* Overemphasizing migrants as *agents* of a predetermined racial progress narrative risks downplaying their sheer vulnerability and the overwhelming structural violence they were escaping and facing.

  2.  **Commission Authors (Chicago Commission on Race Relations):**
      *   *Whig Distortion:* Portrayed as visionary progressives whose report "diagnosed" racism and "prescribed" solutions that would eventually (if slowly) be adopted, placing them on the "right side" of history.
      *   *Parallax Effect:* Their agency is distorted by judging their *recommendations* solely by later standards of racial justice. Their genuinely critical analysis of systemic racism (housing, policing, media) gets amplified as "proto-progressive." Conversely, their emphasis on "interracial cooperation," "order," gradual reform, and blaming *both* sides for violence (often equating self-defense with aggression) gets misfiled as either "backward" (if seen as insufficiently radical) or "pragmatically progressive" (if seen as laying groundwork for later liberalism). Their *actual* context – mediating conflict, preserving social order in a deeply divided city, reflecting mainstream white liberal views – is obscured.
      *   *Subtle Misstep Flag:* Framing the Commission primarily through "authors vs. actors" might underplay its hybrid nature (Black and white members) and its role as an *artifact* of establishment response, not just an actor.

  3.  **White Working-Class Unionists (Attackers/Resisters):**
      *   *Whig Distortion:* Overwhelmingly cast as irrational, racist "losers" of history, opposing the inevitable tide of progress and equality.
      *   *Parallax Effect:* Their agency is distorted in two ways:
          *   *Backward Misfiling:* Complex motivations (genuine economic anxiety over job competition, housing scarcity, union exclusionism, manipulated racial resentment, defense of perceived neighborhood boundaries) are collapsed into simple "racism" or "backwardness." Their actions become solely about resisting a preordained future, erasing the perceived *immediate* threats (economic, social) driving their violence.
          *   *(Potential) Proto-Progressive Misfiling:* Instances where class solidarity *was* articulated (though often racially exclusive) might be selectively highlighted *only if* they later align with class-based analyses, ignoring the inseparable racial hostility of 1919. Their structural position as *workers* might be retroactively emphasized to fit a later class-struggle narrative, downplaying the primacy of race in the violence.
      *   *Subtle Misstep Flag:* Referring broadly to "white working-class organizers" risks implying organized *leadership* of the riots. While unions stoked tensions and some members participated, much riot violence was more spontaneous, neighborhood-based, and involved non-unionized whites – a crucial distinction for agency.

  **Where the Framework Breaks (Ambiguity & Non-Fit):**

  1.  **The Report's Genuine Ambiguity:** Its recommendations (e.g., improved policing, fair housing *principles* but not enforcement, interracial committees) defy easy Whig/Parallax categorization. They weren't a clear blueprint for the future Civil Rights Movement *or* a mere preservation of the status quo. This ambiguity resists the retroactive assignment of clear "proto-progressive" or "backward" labels. It was a product of its complex moment, not a step on an obvious path.
  2.  **Labor-Market Competition as Primary Driver:** A core catalyst was direct economic competition between white ethnics (especially in stockyards/unions) and Black migrants for jobs and housing. This doesn't map cleanly onto a racial-progress teleology. Was this competition "about" resisting inevitable integration, or was it primarily about immediate material scarcity and zero-sum thinking *exploited* through racism? Whig/Parallax struggles with motivations rooted in perceived economic threat rather than abstract ideological resistance to a future ideal.
  3.  **The Nature of the Violence:** Urban racial pogroms like the Chicago riots involve chaotic brutality, deep-seated fear, and immediate territorial defense more than a coherent ideological struggle against a foreseen future. Assigning moral agency based on a distant structural outcome feels especially strained here.

  **The Flip: Does Whig History Survive This Case?**

  This case **reveals significant limitations and suggests Whig history was not built for this terrain, struggling more than illuminating:**

  *   **Falls Apart on Urban Violence:** Whig history (and parallax) excels at framing deliberate political revolutions with clear ideological programs and outcomes. Urban racial violence driven by economic panic, manipulated prejudice, and immediate turf wars lacks that clear ideological intentionality *towards a future state*. Assigning moral agency based on outcomes becomes highly artificial.
  *   **Highlights Non-Linearity:** The Report's ambiguity and the persistent recurrence of similar urban racial conflicts (long after 1919) challenge the notion of inevitable, linear progress. The structural issues (housing, labor competition, policing bias) identified remained potent drivers for decades, resisting a teleological "arc."
  *   **Structural Forces Trump Foresight:** The parallax distortion relies on actors being judged for not foreseeing the future. However, the key drivers in Chicago (mass migration, industrial labor dynamics, housing segregation mechanics) were massive structural forces where individual or group foresight was largely irrelevant. Attributing *moral agency* based on how they "fit" the future outcome is particularly dubious here.
  *   **Unavoidable?** While historians inherently write from the present, this case argues **against** Whig history being *unavoidable*. It demonstrates that imposing this frame actively **distorts** the motivations, complexities, and immediate contexts of the actors and the event. A more productive approach focuses on the *contingency* of the moment, the *structural pressures* (economic, spatial, racial), and the *multiple, conflicting* rationalities at play *in 1919*, resisting the urge to see them solely as precursors or obstacles to a predetermined future. The riots reveal Whig history as a poor fit, not an inevitability.

  **Conclusion:** Your "teleological parallax" effectively exposes how a Whig lens distorts agency in the Chicago case – inflating/heroizing migrants' survival, miscasting the Commission's ambivalent reformism, and collapsing white attackers' complex fears into simple backwardness. However, the event's core drivers (raw labor/housing competition, spontaneous violence, systemic but ambiguous reform responses) actively resist this framing, highlighting Whig history's inadequacy for understanding the messy, contingent, and structurally driven nature of urban racial conflict compared to the political revolutions it was designed to narrate. The case argues for alternative frameworks centered on contingency and immediate structures, not inevitable progress.
