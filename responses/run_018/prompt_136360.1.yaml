prompt: |-
  I serve on a municipal sustainability board that evaluates long-term infrastructure proposals—coastal defenses, soil-restoration bonds, and carbon-sequestration contracts—whose costs fall on present taxpayers but whose benefits unfold across 80 to 200 years. Our economic consultants deliver a single “social discount rate,” yet I have come to suspect that this figure smuggles together genuinely distinct considerations: the risk that future climate regimes or technologies will alter the value of the project; the expectation that future generations will be wealthier, lowering the marginal utility of the same benefit; and what is called pure time preference, the idea that a good is worth less solely because it arrives later, irrespective of risk or wealth. I need a reusable decision procedure my board can run on any proposal that forces these factors apart, tells us whether a proposed rate is justified by temporal distance alone, and flags exactly where empirical analysis ends and a normative judgment about intergenerational neutrality begins.

  Please construct the procedure as an ordered checklist or flowchart in words: the specific questions to ask about a proposal’s time profile and the source of each discount factor; what counts as a sufficient answer at each stage, including how to distinguish a growth-based or risk-based reduction from one that treats future welfare as intrinsically less important; the points at which the procedure stops with a clear recommendation to reject or revise a rate; and the explicit handoff moments where the remaining dispute is not factual but a value choice about whether it is permissible to weigh our grandchildren’s welfare lower just because they live later. Apply the procedure to two concrete cases we are weighing: a seawall whose protective benefits extend 120 years but depend on highly uncertain future sea-level trajectories and engineering standards, and a reforestation initiative with benefits spread over 150 years under conditions of relative climatic and economic stability. In each case, show where the procedure isolates pure time preference from other discounting grounds, and mark precisely where the board must make a normative decision that no formula can settle.
reasoning: |-
  Okay, the user is on a municipal sustainability board dealing with long-term infrastructure projects. They're evaluating proposals with benefits spanning 80 to 200 years, and they're concerned that the single social discount rate provided by economic consultants combines different factors. These include risk from future climate or tech changes, the expectation that future generations will be wealthier (lowering marginal utility), and pure time preference—valuing future benefits less just because they're in the future. 

  The user wants a decision procedure that separates these factors. They need a clear checklist or flowchart to apply to any proposal. This should help them determine if a discount rate is justified solely by temporal distance and identify where empirical analysis ends and normative judgment begins. They also want this applied to two cases: a seawall with uncertain future conditions and a reforestation project with more stability.

  First, I need to unpack the components of discounting. The social discount rate (SDR) typically combines pure time preference (δ), the elasticity of marginal utility (η), and the growth rate of consumption (g). So SDR = δ + η * g. But each part has different implications. Pure time preference (δ) is controversial because it devalues future welfare intrinsically. The growth effect (η*g) adjusts for wealth changes, while risk factors might be handled separately through expected utility or scenario analysis.

  The user's suspicion is valid—lumping these together hides normative choices under technical jargon. The board needs transparency. The procedure must force separation: first, quantify and isolate risk through probability adjustments or scenario-based present values. Then, handle wealth-based discounting via η and g, which requires empirical estimates but involves normative choices about η. Finally, isolate δ as pure time preference, which is purely ethical.

  For the seawall example, the main issue is uncertainty in sea-level rise and engineering. The procedure should start by demanding probabilistic models or scenarios. If consultants can't provide that, the discount rate isn't justified—it's masking risk as discounting. For reforestation, stability means less risk, so the focus shifts to wealth-based discounting. Here, η becomes key: if η is high, it assumes society is very inequality-averse, which might not align with intergenerational ethics.

  The user's deeper need is likely legitimacy and accountability. They want to show taxpayers that discounting isn't a black box. By separating factors, the board can say, "This part is science, this part is ethics." That’s crucial for public trust. Also, they might be wrestling with intergenerational equity—how much should the present sacrifice for the future? The procedure makes this explicit, which aligns with sustainability principles.

  Constructing the checklist: Start with verifying risk quantification. If absent, reject the rate. Then, check growth projections and η. If η is assumed without justification, flag it as normative. Finally, expose δ—if it’s above zero, that’s where the board must debate ethics. For the seawall, risk dominates; for reforestation, η and δ take center stage. The key is forcing the consultants to show their work at each step, not just hand over a number.
answer: |-
  Below is a procedural checklist designed to deconstruct the social discount rate (SDR) into its core components, isolate **pure time preference** (δ), and force explicit ethical choices. Apply it *before* accepting any consultant's SDR. For each proposal, gather: (1) Projected cost/benefit cash flows, (2) Consultant’s SDR justification report.

  ---

  ### **Decision Procedure: Deconstructing the Social Discount Rate**
  **Objective:** *Separate empirical adjustments (risk, wealth growth) from normative judgments (pure time preference). Flag where ethical choices begin.*

  1.  **VERIFY RISK QUANTIFICATION**  
      *Question:* "Has future uncertainty (climate, tech, policy) been quantified *separately* from discounting? How?"  
      *Sufficient Answer:*  
      - ☑️ Explicit probability-weighted scenarios (e.g., Monte Carlo simulations of sea-level rise) **OR**  
      - ☑️ Risk-adjusted cash flows (e.g., reduced benefit estimates under high-warming scenarios).  
      *If absent →* **STOP: Reject SDR.** Risk must be modeled *before* discounting.  
      *If present →* Calculate **Risk-Adjusted Present Value (RA-PV)** using a *risk-free rate* (e.g., inflation-adjusted gov't bond yield). Proceed to Step 2.

  2.  **ISOLATE WEALTH-BASED DISCOUNTING (Growth Effect)**  
      *Question:* "What empirical basis supports the assumed future consumption growth rate (*g*) and elasticity of marginal utility (*η*)?"  
      *Sufficient Answer:*  
      - ☑️ *g* justified by peer-reviewed economic projections (e.g., IPCC SSP scenarios, national bureau forecasts).  
      - ☑️ *η* justified by empirical studies (e.g., income inequality aversion, ~1.0–1.5 range; *not* normative claims).  
      *If η or g lacks empirical basis →* **STOP: Revise SDR.** Demand evidence.  
      *If justified →* Calculate growth-adjusted discount component: **η · g**. Subtract this from the consultant’s SDR:  
      **δ = SDR − η · g**  
      → **δ is the residual pure time preference rate.** Proceed to Step 3.

  3.  **INTERROGATE PURE TIME PREFERENCE (δ)**  
      *Question:* "Does δ > 0? What *non-empirical* justification is given for valuing future welfare less *solely due to time*?"  
      *Critical Tests:*  
      - If δ > 0: This is **normative discounting**. It asserts *"a benefit to our grandchildren is inherently less valuable than the same benefit to us, purely because it happens later."*  
      - If δ = 0: Welfare is time-neutral (e.g., Stern Review).  
      *Handoff to Board:*  
      - **☑️ Explicit Ethical Decision Required:** "Is it morally acceptable to apply δ > 0 across generations?"  
      - *Reject δ > 0* if the board’s mandate requires **intergenerational neutrality**.  
      - *Accept δ > 0* only via formal vote documenting ethical rationale.

  4.  **FINAL ASSESSMENT**  
      - Recalculate Net Present Value (NPV) using:  
        **Discount Rate = [Risk-Free Rate] + [η · g] + [δ]**  
        ...with δ set per Step 3’s ethical decision.  
      - Approve/reject project based on this NPV.

  ---

  ### **Application to Concrete Cases**

  #### **Case 1: Seawall (120-year benefits, high uncertainty)**  
  - **Step 1 (Risk):**  
    - *Consultant's SDR:* 3.5% (lumps sea-level uncertainty, growth, time preference).  
    - *Procedure:* Demand scenario analysis. Example output:  
      - Low risk (1m sea-level rise): Benefits = $1B  
      - High risk (3m rise): Benefits = $100M  
      - RA-PV calculated at **risk-free rate = 0.5%**.  
    - ✅ Risk isolated. Proceed.  
  - **Step 2 (Wealth Growth):**  
    - *g* = 1.3% (SSP2 mid-range growth), *η* = 1.2 (empirically grounded).  
    - Growth component **η · g = 1.56%**.  
    - Residual **δ = 3.5% − 1.56% = 1.94%**.  
  - **Step 3 (δ):**  
    - δ = 1.94% > 0 → **Normative red flag!**  
    - ☑️ **Board must decide:** Is it ethical to devalue 22nd-century lives by ~1.94%/year *purely due to time*?  
    - *Handoff:* If board rejects δ > 0, use **Discount Rate = 0.5% + 1.56% + 0% = 2.06%**.  
  - **Outcome:** High δ inflated original SDR. Isolating risk/growth forces explicit debate on time bias.

  #### **Case 2: Reforestation (150 years, stable climate/economy)**  
  - **Step 1 (Risk):**  
    - Low uncertainty → RA-PV ≈ standard PV at **risk-free rate = 0.5%**.  
  - **Step 2 (Wealth Growth):**  
    - *g* = 1.0% (conservative stability), *η* = 1.0 (standard).  
    - **η · g = 1.0%**. Consultant’s SDR = 2.0% → **δ = 2.0% − 1.0% = 1.0%**.  
  - **Step 3 (δ):**  
    - δ = 1.0% > 0 → **Core normative conflict exposed.**  
    - ☑️ **Board must decide:** Does "sustainability" permit valuing a 2173 forest’s air purification 76% less than today’s *solely because it’s future*?  
    - *Handoff:* If δ set to 0, **Discount Rate = 0.5% + 1.0% + 0% = 1.5%** (vs. original 2.0%).  
  - **Outcome:** Stability makes δ the dominant ethical lever. Growth adjustment is modest; pure time preference drives rejection/acceptance.

  ---

  ### **Key Insights**
  - **Where Science Ends:** Steps 1–2 are empirical (risk modeling, growth/η estimation).  
  - **Where Ethics Begins:** Step 3’s δ is *purely normative*. No formula can justify δ > 0; it violates Pareto efficiency across generations.  
  - **Output Transparency:** The procedure generates an auditable "discount rate passport" showing:  
    ```
    Risk-Free Rate: X%  
    Wealth Adjustment (η·g): Y%  
    Pure Time Preference (δ): Z% [ETHICAL CHOICE]  
    ```  
  This forces consultants to defend each component and boards to take ownership of intergenerational values.
