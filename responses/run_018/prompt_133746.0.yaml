answer: |-
  ### Exam Question  
  **PHIL 735: Advanced Topics in Rational Belief**  
  **Time Allowed: 75 minutes**  
  **Word Guide: ~700 words**  

  > *In Everettian quantum mechanics, an agent knows the universal wavefunction and thus the exact *objective branch weights* for an upcoming spin measurement: 90% for outcome A, 10% for outcome B. She also knows her mental state is duplicated across branches, with 90% of her future selves observing A and 10% observing B. Upon measurement, she observes B.  
  >  
  > (a) Does the Principal Principle require her to assign a credence of 0.9 to A? Justify your answer.  
  > (b) If her first-person observation of B blocks deference to the branch weight, does this render the Principal Principle vacuous?  
  > (c) Can there still be a unique rational credence in her epistemic situation?*  

  ---

  ### Model Answer  
  **(a)** Standard applications of the Principal Principle (PP) suggest credence should match known objective chance (here, branch weights). However, the agent *observes B*, placing her in the minority branch. While branch weights are metaphysically objective, her *epistemic access* is indexical: she knows "I am a B-observer." This self-locating evidence is inadmissible under PP, as it reveals which branch she occupies. Deferring to the 90% weight for A ignores her certainty of being in a B-world. Rational credence for A should thus be *near-zero*, not 0.9.  

  **(b)** Blocking deference does not collapse PP into vacuity. Branch weights remain objectively fixed features of reality, governing rational credence *before* measurement or for non-self-locating agents. PP defers to chance *absent inadmissible evidence*; here, the indexical fact ("I see B") is inadmissible. The principle survives as a constraint on *impersonal* epistemic contexts but requires qualification for centered evidence. It is not vacuous—it still binds agents lacking fine-grained self-location knowledge.  

  **(c)** Uniqueness is threatened. If PP is blocked, what justifies *any* specific credence for A? Some (e.g., Wallace) argue branch weights still govern *baseline* rationality, so she should assign 0.1 to being an A-observer (contra 0.9 for A simpliciter). Others (e.g., Groisman) contend self-location alone determines credence, forcing 0 credence to A. A third view (e.g., Greaves) treats branch weights as defining objective probabilities *for centered propositions*, preserving uniqueness via 0.1 credence for being in an A-branch. While no consensus exists, the Everettian framework *can* support uniqueness if centered chance is defined.  

  ---

  ### Marking Scheme (20 marks total)  
  **A-grade answer (17–20):** Distinguishes branch weight metaphysics from indexical access, blocks PP via inadmissibility, defends non-vacuity, and debates uniqueness.  
  **B-grade answer (13–16):** Correctly applies PP but misses indexical challenge; treats branch weights as sufficient for credence.  

  | Move | Marks | Characteristic Mistake |  
  |-------|-------|------------------------|  
  | 1. **States standard PP application to branch weights** | 4 | Claims PP *demands* credence 0.9 for A without qualification. |  
  | 2. **Identifies indexical evidence as inadmissible** | 6 | Omits centered-world problem; treats observation as irrelevant. |  
  | 3. **Distinguishes metaphysical branch weight from epistemic self-location** | 4 | Conflates objective chance with first-person certainty. |  
  | 4. **Evaluates if blocking PP renders it vacuous** | 3 | Assumes blocking implies PP is useless/arbitrary. |  
  | 5. **Engages uniqueness of rational credence** | 3 | Ignores tension between self-location and objective weights. |  

  ---

  ### Confidence & Uncertainty  
  - **Overall confidence:** 90% in A/B distinction (Move 2 is the clearest differentiator).  
  - **Least certain criterion:** Move 5 (uniqueness). Students may conflate technical proposals (e.g., centered chances) with subjectivism, muddying the evaluation.  

  \answer{The crux is whether centered-world self-location can block deference to objective chance without collapsing the Principal Principle into incoherence.}
