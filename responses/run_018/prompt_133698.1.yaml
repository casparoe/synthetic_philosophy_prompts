  Hey, I was discussing Frege's late political diary with a friend in my philosophy of language course — you know, teh one from teh 1920s with all teh nationalist and anti-semitic entries. She summarized the whole scholarly reaction like this: "The diary is just a biographical embarrassment; it has no philosophical relevance at all. Frege's anti-psychologism and his sense/reference distinction are purely formal tools, and since he never mentions politics in the Grundlagen or Basic Laws, anyone who connects teh diary to his logic is committing guilt-by-association. The claim that his hatred of foreign influence maps onto his idea that thoughts are objective and mind-independent is pure psycho-babble with no textual basis, so philosophy teachers should just ignore teh diary and not mention it in class."

  I'm not convinced she's being fair, especially since I've heard people argue there's a deeper tension. Is she right that the separation is total? Or are there actual arguments linking his political essentialism to his philosophical essentialism that go beyond psychoanalysis? And is her characterization of anti-psychologism as "purely formal" missing something important about what Frege meant by objective thought? Please go through her summary part by part and tell me what's accurate, what misrepresents the debate, and whether her conclusion — that we should keep teh diary out of philosophy courses — actually follows from teh parts that are true. She also threw in this weird idea that Frege's notion of "sense" secretly encodes a kind of cultural purity test — is that a real interpretation anyone has proposed, or is she just inventing connections?

  I'm inclined to think she's being a little too defensive, but I don't know enough about Frege's actual texts to spot where she's smoothing things over. So I'd appreciate a real audit: which sentences in her summary would a defender of the separation accept, which ones would they wince at, and does her final recommendation survive correction?
