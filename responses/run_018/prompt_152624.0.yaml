  {
    "core_tension": "In distributed architectures, the consumer's proper function presupposes representational success conditions to define its norms, yet those conditions are supposed to be grounded in the consumer's function, risking a circular definition of content.",
    "producer_vs_consumer": "Producer-based misrepresentation arises from faulty input generation (e.g., false signal), while consumer-based misrepresentation stems from the consumer's failure to act correctly on a true representation (e.g., dysfunctional response).",
    "selection_unit_problem": "Appealing to evolutionary selection at the symbiotic level relocates the circularity rather than resolving it, as the symbiotic unit's proper function still implicitly depends on the representational content it is meant to ground.",
    "unresolved_issue": "If unresolved, the circularity prevents a non-question-begging account of how representational norms constitutively arise from non-representational functional norms in distributed systems."
  }
