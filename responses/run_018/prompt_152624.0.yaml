  }
answer: |-
  ### Conceptual Tension in Teleosemantics for Distributed Cognitive Architectures

  **Core Framework**: Ruth Millikan's teleosemantics grounds mental content in "proper functions"—evolutionarily selected effects that explain the persistence of a trait. In her *consumer-based* approach, the content of a representation is fixed by the conditions under which the consumer system's response to that representation would have historically fulfilled its proper function. For example, a frog's "fly-detection" neural state has content because the consumer (e.g., the tongue-snapping mechanism) was selected for snapping at flies, and the state must correspond to flies for snapping to succeed.

  **Problem in Distributed Architectures**: When producer and consumer are distinct biological systems (e.g., host/symbiont, human/AI tool), a tension arises in defining the consumer's proper function. The consumer’s function (e.g., a host’s evasion behavior) depends on the representation having a specific success condition (e.g., "predator nearby"). Yet, that success condition is *itself* supposed to be defined by the consumer’s function. This creates a circular dependency:
  - **Circularity**: The content of representation R (e.g., "predator") is defined by the proper function of the consumer C (e.g., evasion). But C’s proper function (successful evasion) presupposes R’s content ("predator") to specify *what counts as success*. Thus, content relies on function, and function relies on content.

  **Producer vs. Consumer Misrepresentation**:
  - **Producer-based misrepresentation**: Occurs when the producer generates a representation in non-standard conditions (e.g., a symbiont emits a "predator" signal when no predator exists). The producer fails its function to correlate with the world.
  - **Consumer-based misrepresentation**: Occurs when the consumer reacts to a *correct* representation in a way that fails (e.g., the host receives a true "predator" signal but freezes instead of evading). Here, the consumer fails its function despite accurate input.  
  **Key Distinction**: Producer error corrupts input; consumer error corrupts output. Content is fixed by the consumer’s function, so consumer-based misrepresentation involves the consumer’s failure to execute its evolutionarily stabilized response.

  **Why the Circularity Is Constitutive, Not Epistemic**:  
  The issue is not merely about *identifying* functions (an epistemic problem) but about *grounding* normative content. Teleosemantics aims to reduce representational norms (e.g., "R *should* indicate predators") to natural norms (e.g., "C *should* evade predators"). In distributed systems, the natural norm for C (e.g., evasion’s function) requires prior representational content ("predator") to define success. Without independent access to this content, the account becomes circular: the normativity of content is explained by functional norms that themselves presuppose content. This undermines the reductive ambition of teleosemantics.

  **Does Evolutionary Selection at the Symbiotic Unit Resolve the Issue?**  
  Appealing to selection acting on the *symbiotic unit* (e.g., host-symbiont as a co-adapted whole) relocates but does not resolve the circularity:
  - **Relocation**: The symbiotic unit’s proper function (e.g., "avoid predation") might seem to define success independently. However, this function still depends on representational success conditions: the unit was selected for avoiding predators *because* the symbiont’s signal and host’s response together tracked predators. Thus, "avoiding predators" implicitly relies on the content ("predator") that the theory must explain.
  - **Residual Circularity**: Defining the symbiotic unit’s function requires specifying *what it was selected for*, which involves representations (e.g., "signaling predators"). But these representations’ contents are what teleosemantics must ground. The loop persists: symbiotic functions presuppose content, while content is meant to be derived from those functions.

  **Unresolved Issue**:  
  If the circularity remains, teleosemantics cannot provide a non-circular, constitutive account of content in distributed systems. The consumer’s functional norms—and thus the representational norms—lack independent grounding. Success conditions (e.g., "R represents predators") become parasitic on the very content they aim to explain, leaving the theory unable to naturalize intentionality in symbiotic contexts.

  ---

