prompt: |-
  Please explain the conceptual tension in teleosemantic theories of mental content—specifically in Ruth Millikan's consumer-based framework—when that framework is applied to distributed or symbiotic cognitive architectures in which the producer and consumer of a representation are not part of the same biological system. Focus on whether the notion of "proper function" for the consumer can be defined non-circularly if that consumer's own functional norms depend on representational success conditions that are themselves being explained teleosemantically. Your explanation should distinguish producer-based misrepresentation from consumer-based misrepresentation, clarify why the circularity worry is not merely an epistemic problem about identifying functions but a constitutive problem about grounding normative content, and assess whether appealing to evolutionary selection history at the level of the symbiotic unit resolves the issue or merely relocates it. Do not provide a bibliography, reading list, or specific citations; work from the conceptual structure of the view itself.

  After your explanation, provide a brief structured summary as a JSON object with exactly these fields:
  - "core_tension": a one-sentence statement of the circularity risk in distributed architectures
  - "producer_vs_consumer": the key distinction between the two loci of misrepresentation
  - "selection_unit_problem": whether evolutionary selection at the symbiotic level solves or relocates the circularity
  - "unresolved_issue": the remaining conceptual obstacle if the circularity is not resolved
reasoning: |-
  We are discussing teleosemantic theories of mental content, particularly Ruth Millikan's consumer-based approach, in the context of distributed or symbiotic cognitive systems where the producer and consumer of a representation are not part of the same biological system (e.g., they may be in different organisms or in an organism and a symbiotic partner).

  First, recall that in teleosemantics, the content of a representation is fixed by the proper function of the mechanisms that produce and/or consume that representation. The proper function is what the mechanism was selected for in evolution. Millikan's approach is consumer-based: the content is determined by how the consumer system uses the representation to fulfill its proper function. For example, a frog's visual system (producer) might produce a fly-representation, and the frog's tongue-snapping mechanism (consumer) uses that representation to snap at flies. The content is fixed by the conditions under which the consumer's response would have been historically successful.

  Now, the problem arises in distributed architectures. Suppose we have two distinct biological entities: one produces a representation (e.g., a symbiont microbe that signals "predator nearby") and the other consumes it (e.g., a host organism that flees upon receiving the signal). The consumer's response (fleeing) has a proper function (avoiding predation) that depends on the representation being correct (i.e., there actually being a predator). But the representation's content is supposed to be fixed by the consumer's proper function. However, the consumer's proper function itself seems to depend on the representation having a certain content (i.e., being about predators). This appears circular.

  Let me break this down:

  1. **Circularity Risk**:
     - In a standard (non-distributed) system, the consumer's proper function (e.g., snapping at flies) is defined by its own evolutionary history and does not inherently depend on the content of the representation. The content is derived from the conditions under which the consumer's response (snapping) would have been successful in the past. There is no circularity because the consumer's function is defined independently (e.g., capturing nutrients) and then the content is fixed by what would make the response successful given that function.
     - In a distributed system, the consumer's proper function (e.g., fleeing) is tied to the representation. The function of fleeing is to avoid predators, but that function is only well-defined if the representation is about predators. But we are trying to define the content of the representation (that it represents predators) by appealing to the consumer's function (avoiding predators). So, we have:
          - The content of R (the representation) is: there is a predator.
          - This content is fixed by the fact that the consumer's response (fleeing) has the proper function of avoiding predators, and fleeing is only successful (hence fulfilling its function) when there is a predator.
          - But how do we define the proper function of fleeing without already assuming that R represents predators? It seems we are using the content to define the function and the function to define the content.

     The worry is that we cannot non-circularly define the proper function of the consumer without already having the content of the representation, and we cannot define the content without the proper function.

  2. **Producer vs. Consumer Misrepresentation**:
     - **Producer-based misrepresentation**: This occurs when the producer generates a representation in circumstances that do not satisfy the content. For example, the frog's visual system produces a fly-representation when a small, dark, moving object is not a fly (e.g., a pebble). The producer is malfunctioning relative to its proper function (which is to produce the representation only in the presence of flies).
     - **Consumer-based misrepresentation**: This occurs when the consumer uses the representation in a way that does not lead to success, even though the representation might be correct. For example, the frog snaps at a fly but misses because its tongue is injured. The consumer is malfunctioning relative to its proper function (which is to snap accurately at flies when they are present). Alternatively, it can occur when the consumer uses a representation that is correct but the environment has changed so that the response is no longer appropriate (e.g., the fly is poisonous now). In distributed systems, consumer-based misrepresentation might occur if the host flees when there is a predator, but due to a broken leg, it fails to escape.

     The key point is that in Millikan's framework, the content is fixed by the consumer's function. So, if the consumer is malfunctioning, that doesn't change the content. The content is still about what would make the consumer's response successful if the consumer were functioning properly.

  3. **Why is this not merely epistemic?**:
     - The problem is not that we, as external observers, have trouble identifying the proper functions without knowing the content. The problem is constitutive: what grounds the normative content? In teleosemantics, the normative dimension (what the representation is supposed to represent) is grounded in the proper function. But if the proper function of the consumer itself depends on the representation having a certain content, then we lack an independent grounding for either. The circularity is in the constitutive conditions for content.

  4. **Appealing to Evolutionary Selection at the Symbiotic Level**:
     - One might try to resolve this by considering the symbiotic unit (host and symbiont) as a single evolutionary unit. Then, the proper function of the consumer (and producer) would be defined by the selection history of the entire symbiotic system. The representation R would have the content "predator" because, in the symbiotic unit's evolutionary history, the consumer's response (fleeing) was selected for because it avoided predators when R was produced (by the symbiont) in the presence of predators.
     - However, this may only relocate the circularity. Now, we define the proper function of the consumer (fleeing) in terms of the success of the symbiotic unit (avoiding predators). But the success condition (avoiding predators) still depends on the representation R being about predators. How do we define the proper function of the symbiotic unit without presupposing the content? The symbiotic unit's function is to avoid predators, but that function is only well-defined if we already know that the state R represents predators. Without an independent way to specify what the symbiotic unit is selected for (other than by saying it was selected for responding appropriately to R, which in turn is defined by what R represents), we are back in a circle.

     Moreover, the symbiotic unit might be selected for a variety of reasons. For instance, the symbiont might be selected for producing R when there is a predator because that helps the host survive, and the host in turn provides a habitat for the symbiont. But the selection pressure is on the entire loop: the symbiont produces R, the host flees, and the symbiotic pair survives. But the content of R is still fixed by what makes fleeing successful (i.e., the presence of predators). The circularity reappears because we are using the success condition (which depends on the content) to define the proper function, and the proper function to define the content.

  5. **Remaining Obstacle**:
     - If the circularity is not resolved, the remaining obstacle is that we lack a non-circular, naturalistic grounding for representational content in distributed systems. The teleosemantic theory would fail to provide a reductive account of content for such systems because it cannot break out of the loop where the content of a representation and the proper function of the consumer mutually depend on each other.

