  Worse, if Silas tries to eliminate *this* vigilance-craving, he might need meta-vigilance—a regress. Tranquilism can't handle hierarchies of desire. Empirical tweaks (e.g., better meditation tech) won't fix this; the issue is that negation isn't a neutral void but an action with its own mental footprint. The system's definitions are too crude to capture its own operations. 

  ...Wait, is this analogous to "quietism" in philosophy? Where the pursuit of passivity becomes active? I should avoid jargon though. The novelist needs clear, story-friendly tension. 

