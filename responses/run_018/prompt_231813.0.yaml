prompt: |-
  im trying to settle, once and for all, whether talk of DNA carrying information or being a genetic code is literal or just a really useful metaphor, and I keep noticing that people argue past each other because one person means Shannon-style correlation and the other means semantic content. Before I read another paper on it, I want the spec. Write me the desiderata for a theory of genetic information: the list of requirements any account has to meet for the claim "DNA carries information" or "the genetic code is a real code" to be more than a loose way of talking. For each requirement, give the case or consideration that forces it, and mark which you think are non-negotiable and which are just preferences of one camp. Then flag any pairs of requirements that might not be jointly satisfiable -- if the list itself amounts to an argument for or against literalism, I want that part especially. a table is fine.

  Some things I already suspect need to be handled, but I want you to make the case for or against each rather than just take my word for it: the arbitrariness of codon assignment (the triplet-to-amino-acid mapping is not forced by chemistry, so an account cant fall back on chemical necessity to explain why a sequence says one thing rather than another); the no-homunculus problem (the "reader" is tRNAs, aminoacyl-tRNA synthetases, and the ribosome, not a mind); translation as blind molecular machinery; synonymous codons, wobble, and how a misreading differs from a changed message; noncoding DNA, pseudogenes, regulatory sequence -- does information attach to all of it or only to what gets translated; what the information is supposed to be about (protein sequence? phenotype? something else) without the account circling back on itself; the fact that the same sequence can do different things in different cellular contexts (splicing, methylation, developmental environment); the fact that high Shannon information and functional importance come apart (a random sequence can be information-rich in one sense and do nothing in the other); how genuinely new coding sequences can arise by mutation and selection without an outside informant; and the bootstrapping one -- the genome encodes the very synthetases and ribosomal components that implement the reading of the code, so the account has to allow the code to specify its own interpreter without a vicious regress or a designer. If you think some of these are red herrings, say so and why.

  Finally, keep the scoring short: a paragraph each on how the main camps (causal/Shannon, semantic/teleosemantic, and outright eliminativist/metaphor-only) fare against your list. I care about the criteria more than the scorecard.
reasoning: |-
  Okay, the user is trying to settle whether DNA carrying information is literal or just a metaphor. They've noticed people argue past each other because of different definitions—Shannon info vs. semantic content. They want a list of requirements (desiderata) that any theory must meet for "DNA carries information" to be more than a metaphor. 

  First, I need to recall the key issues they mentioned: arbitrariness of codons, no homunculus (no mind reading it), molecular machinery, synonymous codons, noncoding DNA, what the info is about, context dependency, high Shannon info vs function, new sequences evolving, and bootstrapping. The user suspects these are important but wants me to argue for or against each.

  The user is clearly deep into this debate. They’ve probably read papers where scholars talk past each other. Their frustration suggests they want clarity, maybe to form their own stance or for academic work. They might be a grad student or researcher in philosophy of biology or genetics. Their unspoken need is a structured framework to evaluate theories impartially, avoiding partisan biases.

  Now, building the desiderata. Each requirement needs a justification and whether it's non-negotiable. Let me start with arbitrariness: it's crucial because if codon assignments were chemically necessary, it wouldn’t be a code—just physics. That’s non-negotiable. No homunculus too—no minds involved, so the mechanism must be mechanistic. Non-negotiable.

  Functional constraints vs. arbitrariness—some argue codon assignments aren't fully arbitrary due to error minimization. But I think chemical indifference is key; the mapping isn’t inevitable, so it’s non-negotiable. 

  For the "aboutness," info must specify phenotypes without circularity. If it’s just about proteins, that’s circular if proteins read the code. Needs evolutionary grounding. Non-negotiable.

  Contextual sensitivity: same sequence can do different things in different cells. Info theory must handle this without implying multiple meanings arbitrarily. Non-negotiable.

  Error distinction: misreading vs. mutation. Important for coding theory. Non-negotiable.

  Non-coding DNA: if only coding regions have info, pseudogenes and regulatory elements challenge that. But they have function, so maybe include them. Not all DNA may qualify, so negotiable.

  Emergence: new genes must arise naturally. Non-negotiable for evolution.

  Bootstrapping: the genome encodes its own readers. Must avoid regress. Non-negotiable.

  Shannon info alone fails because high entropy random sequences aren’t functional. Semantic theories (teleosemantics) can handle function and aboutness but might struggle with arbitrariness. Eliminativists say it’s all metaphor, but that dismisses the code-like properties.

  Potential conflicts: Functional constraint vs. arbitrariness—if codon assignments are optimized, is it still arbitrary? Need to show indifference at codon level despite constraints. Also, specificity vs. context: how can a sequence have a specific meaning if context changes it? Requires conditional interpretation.

  In scoring, Shannon-only falls short on aboutness and arbitrariness. Teleosemantics handles function but might downplay molecular mechanisms. Eliminativists ignore the code’s real properties.

  The user wants the criteria to highlight if literalism is defensible. The list shows it’s possible if a theory meets all, especially with teleosemantics plus mechanisms. But conflicts suggest it’s messy, pushing toward a hybrid view.
answer: |-
  Below is a structured desiderata table for a theory of genetic information, followed by analysis of how major camps fare. Requirements are derived from conceptual challenges in molecular biology and philosophy of biology. **Bolded items** are non-negotiable; others reflect tensions between camps.

  ### Desiderata for a Literal Theory of Genetic Information
  | Requirement | Case/Consideration Forcing It | Non-Negotiable? | Potential Conflicts |
  |-------------|--------------------------------|-----------------|---------------------|
  | **1. Arbitrariness/Indifference** | Codons for same amino acid vary (e.g., leucine: UUA vs. CUG), with no chemical necessity binding nucleotide triplets to specific amino acids. Requires explanation for *why* a sequence specifies one outcome over another. | **Yes** | Vs. Functional Constraints: If codon bias is adaptive, is arbitrariness compromised? |
  | **2. Mechanistic Reader (No Homunculus)** | tRNA/ribosome machinery executes "decoding" without cognition. Theory must explain how physical structures interpret sequences causally. | **Yes** | Vs. Semantic Aboutness: Can molecules "interpret" without intentionality? |
  | **3. Distinction: Signal vs. Noise** | Synonymous codons (same output) vs. non-synonymous mutations (changed output); wobble (flexible pairing). Must differentiate *misreading* (e.g., tRNA error) from *message change* (mutation). | **Yes** | Vs. Shannon Metrics: Shannon entropy treats all variants equally; function requires discrimination. |
  | **4. Aboutness Without Circularity** | Genome specifies phenotypes (e.g., eye color), not just proteins. But proteins build the reader. Must ground what information is *about* (e.g., fitness outcomes) without presupposing the system it describes. | **Yes** | Vs. Bootstrapping: If information is "about" phenotypes, how did primitive systems bootstrap? |
  | **5. Context Sensitivity** | Same sequence can be exon (coding) or intron (non-coding) via splicing; methylation silences genes. Information must be conditional on cellular/environmental context. | **Yes** | Vs. Specificity: Can a sequence have a single "literal" meaning if context changes its effect? |
  | **6. Function-Information Link** | Pseudogenes have sequence similarity but no function; random sequences lack biological meaning. Information must correlate with biological utility, not just structure. | **Yes** | Vs. Shannon Metrics: Random DNA has high Shannon information but zero function. |
  | **7. Emergence Without External Sender** | New functional genes evolve via mutation/selection (e.g., de novo genes). Theory must allow information to arise without a designing "sender". | **Yes** | Vs. Teleosemantics: Can selection create "new" information or only optimize existing? |
  | **8. Bootstrapping Compatibility** | Genome encodes tRNA synthetases that charge tRNAs, creating a self-sustaining loop. Must avoid infinite regress (e.g., "who reads the reader's blueprint?"). | **Yes** | Vs. Arbitrariness: If the code evolved via chemical affinities (e.g., stereochemical theory), is it truly arbitrary? |
  | 9. Scope of Information-Bearing Elements | Regulatory sequences (e.g., promoters) "specify" expression timing, not just amino acids. Should non-coding functional DNA count? | No (Scope Dispute) | Vs. Coding-Centric Views: If only coding DNA has "information", regulatory elements become problematic. |
  | 10. Functional Constraint Tolerance | Codon bias optimizes translation speed/accuracy; amino acid properties constrain sequences. Theory shouldn't require *perfect* arbitrariness if functional constraints exist. | No (Preference) | Vs. Arbitrariness: Strong constraints might blur literal "coding" vs. chemical causation. |

  ### Red Herrings Explained
  - **"High Shannon Information ≠ Function"**: Not a problem for literalism. Shannon metrics measure *potential* information capacity; biological information requires function. A theory need not equate them.
  - **"Same Sequence, Different Contexts"**: Supports context-relativity (#5), not anti-literalism. Codes can have context-dependent rules (e.g., encryption keys).
  - **"Non-coding DNA"**: Functional non-coding DNA (e.g., enhancers) can satisfy #3, #6, #9. Literalism doesn’t require *all* DNA to be informational.

  ### Conflicts Highlighted
  - **Arbitrariness vs. Functional Constraints (#1 vs. #10)**: If codon assignments are evolutionarily optimized, is arbitrariness diluted? *Resolution:* Indifference exists at the codon level (multiple options for same amino acid), even if biases emerge.
  - **Aboutness vs. Bootstrapping (#4 vs. #8)**: How can information be "about" phenotypes if the interpreter is built by the genome? *Resolution:* Teleosemantics grounds "aboutness" in evolutionary history, not real-time causation.
  - **Mechanistic Reader vs. Aboutness (#2 vs. #4)**: Molecules lack intentionality. Can they "interpret" semantic content? *Resolution:* "Interpretation" is mechanistic (binding, catalysis), while "aboutness" is etiological (selected effects).

  ### Scoring the Camps
  - **Shannon/Causal Theories** (e.g., Sarkar, Griffiths): Excel at #2 (mechanistic readers), #7 (emergence), and Shannon metrics. **Fail** #1 (arbitrariness requires semantics), #4 (no inherent aboutness), #6 (cannot distinguish functional vs. random sequences), and #3 (wobble/errors need functional discrimination). Treats DNA as a signal source, not a code.
  - **Semantic/Teleosemantic Theories** (e.g., Maynard Smith, Sterelny): Satisfy #1 (arbitrariness via selection), #4 (aboutness as selected function), #6 (function-link), #7/#8 (evolutionary emergence). **Struggle** with #2 (molecular mechanisms as "interpretation" feels metaphorical) and #5 (context-sensitivity challenges fixed "functions").
  - **Eliminativist/Metaphor-Only** (e.g., Sarkar in later work, Godfrey-Smith): Reject literalism as anthropomorphic. **Satisfy** only desiderata that dismiss literalism (e.g., #2 as anti-intentional). **Fail** to explain #1, #3, #8—the code’s arbitrary, error-correcting, self-bootstrapping properties demand explanation beyond physics/chemistry alone.

  ### Conclusion: The Case for Cautious Literalism
  The desiderata show that **Shannon-only approaches are insufficient** (missing aboutness, arbitrariness), while **teleosemantics + molecular mechanisms can jointly satisfy core requirements**. Key tensions (#1 vs. #10, #4 vs. #8) are resolvable: arbitrariness exists at the codon level despite functional biases, and "aboutness" is an evolutionary property decoupled from real-time interpretation. Thus, "DNA carries information" is more than metaphor—**if grounded in selected, arbitrary mappings executed mechanistically**. However, the theory must accommodate context-relativity (#5) and avoid overextending "information" to non-functional DNA. The strongest case is for a **teleosemantic account augmented by molecular causality**, rejecting eliminativism but requiring precision in scope.
