  We are constructing a reusable ninety-minute audit procedure for evaluating century-scale predictive claims. The procedure is divided into four main components as specified. We will first outline the procedure in general terms, then apply it to the three cases.

  ### The Audit Procedure: "Theory Resilience Evaluation Protocol" (TREP)

  **Objective:** To distinguish between (a) genuine falsification of a theory's core, (b) falsification due to auxiliary hypotheses or parameters, and (c) the possibility of a "right-but-early" rescue that may be vindicated later.

  **Time Allocation:** 90 minutes total per case. Steps 1-3 (each with sub-steps) should take about 60 minutes, and Step 4 (failure modes) 30 minutes. However, time may be adjusted per step as needed.

  #### Step 1: Distinguishing Core Falsification from Auxiliary/Parametric Issues (25 minutes)
     - **1.1 Core Identification (5 min):** Identify the core theoretical structure (the non-negotiable mechanism that generates the prediction) and the auxiliary hypotheses (supporting assumptions about initial conditions, boundary conditions, or other factors that can be adjusted without abandoning the core).
     - **1.2 Falsification Event Analysis (10 min):** Examine the event that allegedly falsifies the prediction. Determine if the falsifying event directly contradicts the core mechanism or if it could be explained by:
          - (a) Incorrect auxiliary hypotheses (e.g., wrong initial parameter values, unaccounted external factors).
          - (b) Misapplied parameters (e.g., using a constant that turned out to be variable).
     - **1.3 Auxiliary Hypothesis Test (10 min):** Check if the auxiliary hypotheses were independently testable and if they were tested. If they were not, then the falsification might be due to the auxiliary and not the core.

  #### Step 2: Conditions for Legitimate Rescue vs. Ad Hoc Immunization (20 minutes)
     - **2.1 Parametric vs. Structural Rescue (10 min):**
          - *Parametric rescue*: Only constants (e.g., growth rates, thresholds) are recalibrated without changing the core structure. This is acceptable if the original parameters were based on incomplete data and the new values are independently validated.
          - *Structural rescue*: The core mechanism is revised (e.g., adding new feedback loops, changing the functional form of relationships). This is acceptable if the revision is independently motivated (e.g., by new empirical findings in related domains) and not solely to save the theory.
     - **2.2 Temporal Delay Evaluation (10 min):** Determine if the delay in vindication is due to:
          - (a) *Legitimate reasons*: e.g., the core mechanism operates on longer timescales, or intervening innovations were not foreseeable at the time of prediction.
          - (b) *Ad hoc reasons*: e.g., repeatedly moving the goalpost without new evidence, or the delay being arbitrary.

  #### Step 3: Termination Rules and Handoff to Decision-Makers (15 minutes)
     - **3.1 Epistemic Termination (10 min):** The theory is declared "falsified" if:
          - The core mechanism is directly contradicted by evidence and cannot be rescued without becoming a new theory (i.e., structural changes are so fundamental that the original core is abandoned).
          - The auxiliary hypotheses have been repeatedly adjusted without independent support, and the theory has a history of failed predictions.
     - **3.2 Normative Handoff (5 min):** If the theory survives Steps 1 and 2 but there is still dispute, then the remaining issues are likely normative. Hand off to decision-makers when:
          - The dispute is about the acceptability of risks (e.g., even if the probability is low, the outcome is catastrophic) or about values (e.g., intergenerational equity, discount rates).
          - The decision involves policy choices that are beyond the scope of scientific validation.

  #### Step 4: Catalog of Failure Modes (30 minutes)
     - **4.1 False Negatives (15 min):** Cases where the procedure might kill a theory that is later vindicated:
          - *Premature Core Rejection*: When the core is sound but the falsification was due to an auxiliary that was later corrected by new data.
          - *Overlooking Slow Rescue*: When the vindication timescale is longer than the audit window (e.g., a century-scale prediction is evaluated after only 30 years).
     - **4.2 False Positives (15 min):** Cases where the procedure might protect a dead theory:
          - *Ad Hoc Adjustments*: Allowing too many parametric or structural rescues without independent evidence.
          - *Normative Creep*: Mistaking a normative dispute (e.g., "we should not worry about this risk") for an epistemic one.

  ---

  ### Application to Cases

  #### Case 1: Malthus's Population vs. Subsistence (1798)
     - **Step 1:**
          - 1.1: Core = geometric population growth vs. arithmetic food growth (leading to inevitable crisis). Auxiliary = agricultural technology is static, no major innovations.
          - 1.2: Falsification event: agricultural innovations (e.g., fertilizers, machinery) increased food production beyond arithmetic, avoiding crisis. This falsifies the auxiliary (static technology) not the core (growth imbalance).
          - 1.3: The auxiliary (static technology) was testable and falsified by events.
     - **Step 2:**
          - 2.1: The core was rescued *structurally* by later theories (e.g., adding innovation as a feedback loop) but Malthus himself did not do this. The vindication in altered form (e.g., ecological footprints, distributional crises) is a structural revision of the core (now including human adaptability and environmental constraints) that was independently motivated by new evidence.
          - 2.2: The delay (crisis re-emerges in new forms) is legitimate because the core imbalance (demand vs. sustainable supply) reappears in a broader context (e.g., climate change, water scarcity) that was not the original focus.
     - **Step 3:**
          - 3.1: Malthus's original core (without innovation) is falsified, but the structural revision (with feedbacks) is a new theory. Termination: Original theory falsified.
          - 3.2: The handoff occurs when discussing whether to act on the revised theory (e.g., sustainable development policies) — this is normative (how much risk to accept, intergenerational justice).
     - **Step 4:**
          - Failure modes: Without Step 2, we might have rejected the core entirely (false negative). But by allowing structural rescue, we avoid this. However, if we accept any structural revision as vindication, we risk false positives (e.g., if the new theory is also flawed).

  *Where normative handoff occurs:* After Step 3.1, when we declare the original Malthusian theory falsified, the decision to act on the revised structural theory (e.g., neo-Malthusian environmentalism) is normative.

  ---

  #### Case 2: Limits to Growth (1970s)
     - **Step 1:**
          - 1.1: Core = exponential growth in population, resource use, and pollution will overshoot Earth's carrying capacity, leading to collapse. Auxiliary = no major technological substitutions or efficiency gains that decouple growth from resource use.
          - 1.2: Falsification event: technological substitutions (e.g., renewable energy, recycling) and efficiency gains delayed collapse. This challenges the auxiliary (no substitutions) not the core (overshoot risk).
          - 1.3: The auxiliary was testable and was falsified by events (substitutions occurred).
     - **Step 2:**
          - 2.1: Parametric rescue: Adjusting the rate of technological change in models. Structural rescue: Revising the core to include endogenous innovation (as in later models). This rescue is legitimate if the revised core (e.g., World3-2004 model) is independently validated by new data (e.g., climate change, biodiversity loss).
          - 2.2: The delay (collapse not yet occurred) is legitimate if the timescale of the prediction is longer (e.g., 21st century) and current trends (e.g., CO2 concentrations) align with the overshoot risk.
     - **Step 3:**
          - 3.1: The original model (without endogenous innovation) is falsified. The revised model (with innovation) is a new theory that is not yet falsified but remains contested.
          - 3.2: Handoff occurs when deciding policy: even if the probability of collapse is reduced by technology, the potential severity may justify precautionary action — a normative choice.
     - **Step 4:**
          - False negative risk: Rejecting the entire overshoot thesis due to substitutions might miss the core risk (e.g., climate tipping points). False positive risk: Protecting the model by constantly adding new feedbacks without empirical support.

  *Where normative handoff occurs:* After Step 3.1, the decision to act on the revised model's warnings (e.g., degrowth vs. green growth) is normative.

  ---

  #### Case 3: Freshwater Scarcity and State Collapse (2080 projection)
     - **Step 1:**
          - 1.1: Core = increasing freshwater demand and climate change reduce water availability, leading to conflicts and state collapse. Auxiliary = desalination and demand management will not scale sufficiently to avert crisis.
          - 1.2: Falsification event (current): rapid advances in desalination (e.g., solar-powered) and demand management (e.g., smart irrigation) appear to contradict the auxiliary.
          - 1.3: The auxiliary (scaling limitations) is testable and may be falsified if current trends continue.
     - **Step 2:**
          - 2.1: Parametric rescue: Adjusting the cost and scalability parameters of desalination. Structural rescue: Adding feedbacks (e.g., technology diffusion, policy responses) to the core model. This is legitimate if there is independent evidence (e.g., from other resource sectors) that such feedbacks exist.
          - 2.2: The delay (crisis not yet evident) may be legitimate because the projection is for 2080, and current innovations might not scale globally or might have unintended consequences (e.g., brine pollution from desalination).
     - **Step 3:**
          - 3.1: If the core (water scarcity leading to conflict) is supported by regional crises (e.g., in water-stressed regions) and the auxiliary adjustments are independently validated, the theory is not falsified. If the core is contradicted (e.g., no conflict in water-scarce regions with good governance), then it may be falsified.
          - 3.2: Handoff occurs if the dispute is about the likelihood of scaling innovations globally (epistemic) versus the acceptability of risking state collapse in vulnerable regions (normative).
     - **Step 4:**
          - False negative: Rejecting the theory because of temporary technological fixes that may not be sustainable. False positive: Protecting the theory by downplaying innovation potential without evidence.

  *Where normative handoff occurs:* In Step 3.2, if the evidence is mixed (e.g., technology helps in some regions but not others), the decision to prepare for state collapse scenarios involves normative judgments about resource allocation and equity.

  ---

  ### Summary of Normative Handoff Points
  In all cases, the handoff occurs at the end of Step 3, when the audit has established the epistemic status (falsified or not) but the implications for action require weighing risks, costs, and values. The procedure clarifies that beyond this point, the debate is not about the truth of the theory but about what to do given the uncertainty and stakes.
answer: |-
  ### Theory Resilience Audit Protocol (TRAP)  
  **Objective:** Distinguish core falsification from auxiliary/parametric issues, establish criteria for legitimate temporal vindication, define termination rules, and catalog failure modes. Designed for 90-minute execution by non-philosophers.  

  ---

  #### **Step 1: Core vs. Auxiliary Falsification Tests** (25 minutes)  
  *Goal: Isolate the theory’s immutable core from adjustable components.*  
  1. **Decompose the Prediction** (5 min):  
     - Identify:  
       - **Core Mechanism** (CM): The causal engine (e.g., "population grows faster than food supply").  
       - **Auxiliary Hypotheses** (AH): Testable supporting assumptions (e.g., "agricultural technology is static").  
       - **Parameters** (P): Quantifiable inputs (e.g., "annual food yield growth = 1%").  
     - *Judgment call: Distinguishing CM from AH may require contextual interpretation (e.g., is "innovation impossible" core or auxiliary?)*  

  2. **Map Falsifying Evidence** (10 min):  
     - List observed contradictions (e.g., "food supply kept pace with population").  
     - Test:  
       - Does evidence directly negate CM? (If yes → core falsified.)  
       - Does evidence only contradict AH/P? (If yes → auxiliary/parametric issue.)  
     - *Judgment call: If CM requires specific AH to generate predictions (e.g., no innovation), rejecting AH may functionally falsify CM.*  

  3. **Auxiliary Independence Check** (10 min):  
     - Assess whether AH was:  
       - **Empirically grounded** (based on data vs. conjecture).  
       - **Independently testable** (could AH be validated without the core theory?).  
     - Outcome:  
       - If AH was untestable/shielded the core → flag as illegitimate protection.  
       - If AH was testable and falsified → auxiliary issue, not core falsification.  

  ---

  #### **Step 2: Rescue Legitimacy Criteria** (20 minutes)  
  *Goal: Distinguish legitimate vindication from ad hoc immunization.*  
  1. **Classify Rescue Type** (10 min):  
     - **Parametric Rescue (PR)**: Only P adjusted (e.g., "desalination costs lowered from $1.5 to $0.5/m³").  
       - Legitimate if: New parameters are empirically validated and within original uncertainty bounds.  
     - **Structural Rescue (SR)**: CM or AH revised (e.g., adding "innovation feedback loops" to Malthus).  
       - Legitimate if: Revision explains past failures *and* new evidence supports the mechanism.  

  2. **Temporal Delay Assessment** (10 min):  
     - Delay is **legitimate** if:  
       - CM operates on longer timescales (e.g., ecological pressure manifests after 50 years).  
       - New data confirms the *direction* of the original CM (e.g., scarcity shifts from food to water).  
     - Delay is **ad hoc** if:  
       - Revisions repeatedly move the goalpost (e.g., "collapse by 2100" after 2080 falsification).  
       - No new empirical evidence supports the rescue.  
     - *Judgment call: "Directional confirmation" requires subjective alignment (e.g., is water scarcity analogous to food scarcity?).*  

  ---

  #### **Step 3: Termination Rules** (15 minutes)  
  *Goal: Resolve epistemic status or hand off normative disputes.*  
  1. **Epistemic Termination** (10 min):  
     - Declare **falsified** if:  
       - CM is directly contradicted with no plausible rescue.  
       - Rescue requires >2 ad hoc structural changes.  
     - Declare **not falsified** if:  
       - Only AH/P falsified, and CM remains intact with empirical support.  

  2. **Normative Handoff Trigger** (5 min):  
     - Transfer judgment to policymakers if:  
       - Dispute centers on risk tolerance (e.g., "5% collapse risk acceptable?").  
       - Evidence is equivocal, and action depends on values (e.g., "equity vs. efficiency").  
     - *Explicit handoff point: Step 3.2 conclusions.*  

  ---

  #### **Step 4: Failure Mode Catalog** (30 minutes)  
  *Goal: Anticipate and mitigate misclassification risks.*  
  - **False Negatives** (Theories wrongly killed):  
    - **Premature Burial**: CM is valid but AH/P errors masked it (e.g., dismissing climate models due to incorrect cloud-cover parameters).  
    - **Timescale Ignorance**: CM operates slower than audit window (e.g., declaring biodiversity collapse theories dead after 20 quiet years).  
  - **False Positives** (Theories wrongly saved):  
    - **Ad Hoc Escalation**: Allowing endless SR/PR without new evidence (e.g., adding "hidden variables" to explain failures).  
    - **Normative Masking**: Mistaking values-based defenses (e.g., "human ingenuity *will* solve this") for empirical rescue.  
  - *Judgment call: Balancing "benefit of doubt" vs. "falsification rigor" depends on institutional risk appetite.*  

  ---

  ### Worked Applications  

  #### **Case 1: Malthusian Population-Subsistence Imbalance**  
  - **Step 1**:  
    - CM: Population growth outpaces subsistence *without external shocks*.  
    - AH: Agricultural technology static; P: Geometric/arithmetic growth rates.  
    - Falsifying evidence: Innovation boosted food yields (contradicts AH, not CM).  
  - **Step 2**:  
    - SR: Neo-Malthusians add "innovation delays pressure but doesn't erase scarcity."  
    - Legitimate? Yes—new data shows scarcity emerging ecologically (e.g., soil depletion).  
  - **Step 3**:  
    - Original CM falsified (relied on static AH), but SR creates a new theory.  
    - **Normative handoff**: Whether to act on rescaled scarcity risk (e.g., degrowth policies).  
  - **Failure Mode**: False negative risk if CM’s core logic (growth vs. finite resources) is discarded.  

  #### **Case 2: Limits to Growth (1970s Resource Depletion)**  
  - **Step 1**:  
    - CM: Industrial growth exhausts resources/pollution sinks, causing collapse.  
    - AH: No game-changing substitution; P: Fixed resource depletion rates.  
    - Falsifying evidence: Tech substitution (e.g., renewables) eased pressure (contradicts AH).  
  - **Step 2**:  
    - SR: Revised models add "endogenous innovation" (e.g., market-driven efficiency).  
    - Legitimate? Partially—new evidence supports innovation but not its infinite scalability (e.g., rare earth shortages).  
  - **Step 3**:  
    - Not falsified: CM (growth within finite biosphere) intact; AH error acknowledged.  
    - **Normative handoff**: Whether to prioritize efficiency or systemic restructuring.  
  - **Failure Mode**: False positive if "innovation" becomes an unfalsifiable shield.  

  #### **Case 3: Freshwater Scarcity → State Collapse (2080 Forecast)**  
  - **Step 1**:  
    - CM: Water scarcity triggers sociopolitical collapse.  
    - AH: Desalination/demand tech cannot scale sufficiently; P: Climate-driven depletion rates.  
    - Falsifying evidence: Rapid desalination advances (challenges AH).  
  - **Step 2**:  
    - PR: Lower desalination cost parameters; SR: Add "adaptive governance" as a stabilizer.  
    - Legitimate? PR yes (costs fell empirically); SR risky if governance claims lack evidence.  
  - **Step 3**:  
    - Not falsified: CM (water stress → conflict) observed regionally (e.g., Middle East).  
    - **Normative handoff**: Whether to invest in tech or equity-focused solutions.  
  - **Failure Mode**: False negative if desalination’s ecological costs (e.g., brine pollution) are ignored.  

  ---

  ### Protocol Summary  
  - **Judgment Dependencies**:  
    - Step 1.1 (CM/AH separation), Step 2.1 (rescue legitimacy), and Step 4 (failure mode weighting) involve irreducible discretion.  
  - **Handoff Clarity**: Step 3.2 *always* transitions to normative/policy domains once epistemic tests are exhausted.  
  - **Time Allocation**: Steps 1–3 (60 min), Step 4 (30 min). Analysts document rationale at each step to audit consistency.
