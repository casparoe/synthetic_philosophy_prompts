  I'm on the appeals panel for our city civil-service commision. One of our senior planners was fired after she refused to sign off on permits for a development that technically complies with zoning but she claims violates our climate charter. Her defense is weird — she doesn't call it classic civil disobedience. Instead she says political obligation is "role-fragmented": she owes fidelity to the deliberative core of the institution (the charter's intent and the public that ratified it) but not to its administrative shell (the permitting chain of command that ignored climate impacts). So she says she never broke a real duty, she just blocked an illegitimate command pathway. We vote Tuesday on whether to reinstate with back pay or uphold the firing. Draft the memo I'll circulate: it should recommend one course with a concrete timeline, treat her "fragmented obligation" argument seriously rather than just citing employment law, and include the strongest reason the other side has. Keep it under 500 words. Casual tone is fine — I misspelled "commission" in my subject line so don't worry about polish.
