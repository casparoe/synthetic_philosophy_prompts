prompt: |-
  I'm a high school junior writing an ethics paper on what makes promises binding, and I've been polling a friend on cases to figure out the principle behind her judgments. Her verdicts so far: (1) a promise to return a borrowed book binds; (2) a promise made at gunpoint does not; (3) a promise to help a friend cheat on an exam does not bind even though it was made freely; (4) a promise to pick someone up at the airport binds, and more strongly than the book promise, because the person skipped making other arrangements on the strength of it; (5) a casual promise to wear a particular sweater tomorrow binds only weakly, since nobody's plans depend on it.

  Here's the new case I can't predict her answer to: a teenager freely promised her grandfather, shortly before he died, that she would keep his small orchard running. Nobody relies on the orchard, it's a financial drain, and the grandfather obviously can't be disappointed now. Does the promise bind?

  I'm less interested in the verdict itself than in the reasoning. Please give me a table with these columns: "Candidate rule" (a principle that generates all five of her verdicts), "How it fits verdicts 1–5", "Its verdict on the orchard promise", and "A further case that would test it against the other rules". I want at least two rules that genuinely diverge on the orchard case — for instance, one on which binding force comes from the promisee's reliance and one on which it comes from the promisor's free commitment — and then, after the table, a short paragraph saying which rule you'd bet on as hers, why, and what that implies about whether deathbed promises bind.
reasoning: |-
  Okay, the user is a high school junior working on an ethics paper about what makes promises binding. They've been gathering their friend's judgments on different promise scenarios to find a pattern. Now they have a new case about a deathbed promise to maintain an orchard and want to explore different principles that could explain all the verdicts. 

  Hmm, I need to approach this methodically. The user already has five clear data points from their friend: (1) book return binds, (2) coerced promise doesn't, (3) cheating promise doesn't bind despite being free, (4) airport pickup binds more strongly due to reliance, and (5) sweater promise binds weakly without reliance. The orchard case introduces new elements—deathbed context, no reliance, financial burden.

  First, I should identify candidate principles that can coherently explain all existing verdicts. The reliance principle seems obvious given verdict 4 (airport) and 5 (sweater), but it struggles with verdict 3 (cheating promise)—why would an immoral promise not bind even if someone relies? The commitment principle handles coercion and immorality well but doesn't explain reliance-based strength differences. The hybrid rule combining both seems promising but needs testing.

  For the orchard case, the reliance principle would likely say it doesn't bind (no reliance), while the commitment principle might say it does (solemn free promise). The hybrid rule could go either way—does "social harm" include wasting resources on a useless orchard? That ambiguity is useful for testing.

  I should design test cases that pit the principles against each other. For reliance vs. commitment: what if someone relies on an immoral promise? For hybrid vs. commitment: what about a harmful promise with no reliance? The orphanage case would force the hybrid rule to confront whether social cost overrides commitment.

  Given the friend's emphasis on reliance in verdicts 4 and 5, and her rejection of immoral promises despite freedom in verdict 3, the hybrid rule feels like the best bet. It explains why the cheating promise doesn't bind (immoral) while still valuing reliance for binding strength. If she applies this to the orchard, she might see the financial drain as social harm, making the promise non-binding—but I'm only 60% confident. 

  The deathbed aspect adds gravity, but the hybrid rule's focus on actual consequences (wasted resources) might outweigh that. This suggests deathbed promises bind weakly unless they involve reliance or clear moral good. The user's friend seems pragmatic—she cares about real-world impact, not just abstract commitment.
answer: |-
  Below is a reasoned analysis of your friend's promise ethics, structured as requested. Based on her verdicts, I'll propose **three candidate rules** that explain her judgments and diverge on the orchard case. The table is followed by a prediction and implications.

  ### Principles Analysis Table
  | Candidate Rule                           | How it Fits Verdicts 1–5                                                                                                | Verdict on Orchard Promise | Test Case to Challenge Rule                                                                 |
  | :--------------------------------------- | :---------------------------------------------------------------------------------------------------------------------- | :------------------------- | :----------------------------------------------------------------------------------------- |
  | **Rule 1: Reliance + Consent**<br>*Promises bind if (a) freely made AND (b) the promisee reasonably relies on them to their detriment.* | (1) Binds: Freely made + reliance (book loan).<br>(2) No bind: Not free.<br>(3) No bind: Free but no reliance (cheating harms, but friend didn't *rely* detrimentally).<br>(4) Stronger bind: High reliance (skipped arrangements).<br>(5) Weak bind: No reliance. | **No bind**<br>Grandfather can't rely post-death; no detriment possible. | *Immoral Reliance:* You freely promise to donate a kidney to a criminal. They rely (skip dialysis). Binding?<br>*Rule 1 says yes (reliance exists), but violates verdict 3.* |
  | **Rule 2: Commitment + Harm**<br>*Promises bind if (a) freely made AND (b) breaking them inflicts unjust harm OR violates deep moral/social expectations.* | (1) Binds: Free + harm if broken (inconvenience).<br>(2) No bind: Not free.<br>(3) No bind: Free, but harm in *keeping* (cheating).<br>(4) Stronger bind: High harm (stranded).<br>(5) Weak bind: Minor harm (disappointment). | **Binds**<br>Freely made; breaking it dishonors memory/trust (symbolic harm). | *Trivial Deathbed Promise:* Grandfather made you swear to eat oatmeal every Tuesday. Binding?<br>*Rule 2 likely says yes (symbolic harm), but may contradict verdict 5.* |
  | **Rule 3: Hybrid: Reliance + Social Harm**<br>*Promises bind strongly if reliance exists. Without reliance, they bind weakly UNLESS keeping them causes significant social harm.* | (1) Binds: Reliance.<br>(2) No bind: Not free.<br>(3) No bind: Keeping causes harm (cheating).<br>(4) Strong bind: High reliance.<br>(5) Weak bind: No reliance/harm. | **No bind**<br>No reliance, and *keeping* causes harm (financial drain = social resource waste). | *Harmless Secret:* You promise a dying friend to never reveal their hobby. No one relies, keeping it costs nothing. Binding?<br>*Rule 3 says weakly binds (no harm), but Rule 2 may disagree.* |

  ### Prediction & Implications
  **I’d bet on Rule 3 (Hybrid: Reliance + Social Harm) as your friend’s principle.** Here’s why:
  - **Reliance explains strength differences**: Her emphasis on the airport vs. book/sweater cases (verdicts 4–5) shows reliance is central to binding *force*.
  - **Harm explains immoral exceptions**: Verdict 3 (cheating) isn’t about reliance but harm—even freely made promises don’t bind if harmful.
  - **Orchard implication**: Rule 3 suggests **no bind**—no reliance exists, and *keeping* the promise harms the promisor (financial drain). The deathbed context adds emotional weight but doesn’t override tangible harm/lack of reliance.

  **Deathbed Promises & Her Principle**:  
  Under Rule 3, deathbed promises bind *weakly* unless they trigger reliance (e.g., if the orchard employed workers who relied on jobs) or avoiding harm (e.g., promising to deliver inheritance to a needy relative). Purely sentimental promises with costs likely don’t bind—**sentiment isn’t "harm" if broken, but financial drain *is* harm if kept**. Her verdicts prioritize concrete consequences over abstract commitment.

  ### Suggested Test Case for Your Friend
  > **"Cake Vow":** *You freely promise your mother to bake her favorite cake annually on her birthday. She dies a week later. Baking it is costly/time-consuming, and no one else cares. Does this bind?*  
  > - **Rule 1 (Reliance)**: No bind (no reliance).  
  > - **Rule 2 (Commitment/Harm)**: Binds (symbolic harm in breaking vow).  
  > - **Rule 3 (Hybrid)**: Weakly binds (no reliance, but minimal harm in keeping).  

  This case tests whether symbolic harm alone creates obligation without reliance—critical for distinguishing Rule 2 from Rule 3. If she says "weakly binds," Rule 3 holds; if "binds strongly," Rule 2 fits better.
