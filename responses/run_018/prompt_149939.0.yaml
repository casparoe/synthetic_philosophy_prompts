answer: |-
  **Bottom line: The stall is primarily substantive but empirically unresolved—centering on the prevalence of spandrels/constraints—and is reinforced by divergent methodological norms and explanatory defaults; progress is likely incremental and case-specific rather than resolving the core philosophical divide.**

  The debate hinges on a substantive empirical question: what fraction of complex traits are direct adaptations versus byproducts or consequences of constraints? Neither side has compelling *general* evidence because prevalence is context-dependent (e.g., spandrels may dominate in modular developmental systems but not elsewhere). Adaptationists emphasize selection's cumulative power to optimize traits, while critics highlight phylogenetic inertia and developmental architecture as alternative explanatory frameworks. This substantive uncertainty is amplified by methodological disagreements: adaptationists often employ optimality models or comparative tests with flexible null hypotheses, which critics argue are prone to false positives. Critics favor constraint-first null models, which adaptationists view as unrealistically pessimistic about selection's efficacy.

  Your software analogy is apt: adaptationists prioritize "user stories" (functional justification via selection), while critics insist on "architecture reviews" (systemic constraints as primary causes). This reflects a deeper philosophical rift about biological explanation—whether function *must* be the default narrative. Verbal disagreements (e.g., defining adaptation broadly to include exaptations) exist but are symptoms, not the core issue. Conceptual distinctions (e.g., separating adaptation from exaptation) clarify but don't resolve the burden-of-proof asymmetry. Formal results (e.g., models showing spandrels can persist) or empirical findings (e.g., genomic "junk" as spandrels) shift specific cases but fail to generalize, as the systems are too diverse. The divide is structurally persistent because it stems from competing heuristics for navigating incomplete evidence, not logical inconsistency. Progress occurs locally (e.g., confirming a specific spandrel via developmental genetics), but the overarching tension—between functionalist and structuralist explanatory ideals—remains a constitutive feature of evolutionary biology.
