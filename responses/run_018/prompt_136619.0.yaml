  Explaining this knot: the myth requires the defeat to be unavoidable to justify the sacrifice, yet also needs the agents to choose freely to maintain dignity. But if defeat was certain, their choice isn't free. If defeat wasn't certain, their choice might be seen as rash. The narrative glosses over this by blending inevitability and agency, making the choice seem both heroic and the only option. The power comes from this ambiguity, not from resolving it.

