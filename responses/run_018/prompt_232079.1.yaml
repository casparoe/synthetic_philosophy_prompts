  - Retinal input = sensor
  - Early visual processing = RAW capture + demosaicing
  - Higher cognition = post-processing
  - Conscious perception = final rendered image

  The key tension emerges around whether "post-processing" (cognitive states) can influence the "RAW processing" stage. In strict sensor terms, RAW data is immutable - but human perception lacks such clear boundaries. 

  I notice the photographer's analogy implicitly assumes modularity (RAW as pure input), which aligns with the impenetrability view. But human vision is more like... 
  - A sensor with adaptive ISO (attention modulating input sensitivity)
  - Auto-white balance that references memory colors
  - Demosaicing algorithms using scene expectations

  What gets lost? The camera model can't capture:
  - Bidirectional processing (top-down/bottom-up interact continuously)
  - The inseparability of sensation and interpretation in biology
