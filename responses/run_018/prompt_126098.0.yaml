answer: |-
  Here are the core desiderata for any account of basic epistemic entitlement, structured as requested:

  ### Must-Have Desiderata
  1.  **Block Bootstrapping/Gauge Loop:** Must prevent justifying a specific belief *via* a general reliability claim that itself crucially depends *only* on that specific belief (or type). (Gas Gauge: Can't confirm gauge reliability *solely* by trusting its readings.)
  2.  **Allow Basic Perceptual Knowledge:** Must explain how seeing your hand justifies "I have a hand" *without* requiring prior justification that vision is reliable *in this instance*. (Hand Case)
  3.  **Prevent Overgeneralization:** Must avoid allowing justified belief in the whole based on checking only a non-representative part without independent warrant. (Table Legs: Checking one leg doesn't justify "the table is stable").
  4.  **Distinguish First-Order & Meta-Justification:** Must separate being justified in believing *p* (e.g., "car started") from being justified in believing *that* one is justified in believing *p* (requiring higher-order reflection).
  5.  **Respect Diachronic/Synchronic Distinction:** Must account for justification *at the time* of belief (synchronic) vs. justification gained *through* a process of learning or checking (diachronic).
  6.  **Distinguish Causal Reliability & Citable Reasons:** Must acknowledge that a belief-forming process *being* reliable (causal mechanism) is different from the believer *having access* to that reliability as a conscious, articulable reason for the belief.

  ### Impossible Pairs? (Tensions)
  *   **Full Transparency + Zero Circularity:** If *all* grounds for justification must be consciously accessible and articulable (Full Transparency), basic beliefs seem impossible without circularity (Zero Circularity). Something must give.
  *   **Strict Internalism + Basic External World Knowledge:** Requiring *all* justifiers to be internal mental states (Strict Internalism) makes basic perceptual knowledge of the external world (Hand Case) notoriously difficult.

  ### Non-Negotiables vs. Camp Preferences
  *   **Non-Negotiable:** (1) Blocking Bootstrapping, (3) Preventing Overgeneralization, (4) Distinguishing FO/Meta-J.
  *   **Camp Preferences:** Strength of Internalism/Externalism required, whether reliability *must* be citable, priority of synchronic vs. diachronic.

  ### The Knockout Blows
  *   **Kills Reliabilism:** **The Bootstrapping Problem (Gauge Loop).** Reliabilism struggles to block using the reliable process itself to "confirm" its reliability circularly.
  *   **Kills Dogmatism (Phenomenal Conservatism):** **The Problem of Defeaters.** If seeming (e.g., visual appearance) is *prima facie* justifying, dogmatism lacks resources to prevent justification persisting even when strong, undetected defeaters exist (e.g., you're unknowingly in a hand-hallucination scenario).
  *   **Kills Coherentism:** **The Input/Isolation Problem.** Coherentism struggles to explain how new, non-inferential information (e.g., perceptual input like seeing your hand) can enter the system and be justified *without* prior coherence relations, risking isolation from the world.

  (Word Count: Approx. 320)
