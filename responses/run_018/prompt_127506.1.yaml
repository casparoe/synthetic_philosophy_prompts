answer: |-
  **INSTITUTE FOR ANTHROPIC CALIBRATION**  
  **STANDARD OPERATING PROCEDURE: SOP-ANC-001 Rev. 7**  
  **"Comparative Measurement of Observer-Occurrence Probability Using SSA/SIA Dual-Instrument Array"**

  **1.0 PURPOSE AND SCOPE**
  1.1 This protocol defines the laboratory execution of the Presumptuous Measurement Argument (PMA), quantifying the probability of observer-typicality under competing cosmological hypotheses (e.g., Large Universe vs. Small Universe).
  1.2 Utilizes the Institute’s certified Instrument Pair: SSA Detector (Serial Range: SSA-Φ-001+) and SIA Detector (Serial Range: SIA-Ω-001+). Treats these as physical apparatus with quantifiable systematic error profiles.
  1.3 Aims to constrain observer-location bias, acknowledging the inherent limitation: all measurements occur *in situ* within the sample (WARNING: Unavoidable Embedding Artifact, see Sec 4.3).

  **2.0 APPARATUS**
  2.1 **SSA Detector:**
      *   **Principle:** Assumes uniform random sampling from a predefined Reference Class (RC) of observers.
      *   **Calibration:** Traceable to NIST Standard Observer Definition (Hypothetical). Requires precise RC boundary specification prior to operation (Sec 3.1). Calibration Log must record RC parameters.
      *   **Systematic Error Profile:** Dominated by Reference-Class Specification Error (RCSE). Susceptible to boundary drift (e.g., inclusion of marginally conscious entities, potential AI, extraterrestrials). Output highly sensitive to RC cardinality definition.
  2.2 **SIA Detector:**
      *   **Principle:** Assumes weighting of hypotheses proportional to the total number of observers instantiated within each.
      *   **Calibration:** Traceable to total integrated observer-count metric. Requires robust counting algorithm (prone to double-counting errors in branching cosmologies).
      *   **Systematic Error Profile:** Dominated by Observer-Count Inflation Bias (OCIB). Inherently favors hypotheses with large N_observer, regardless of RC definition. Calibration susceptible to drift under theories of consciousness affecting "countability."
  2.3 **Reference Class Definition Module (RCDM):** Critical ancillary apparatus. Mandatory for SSA operation, optional (but recommended for error characterization) for SIA.

  **3.0 PROCEDURE**
  3.1 **Reference Class Fixation (CRITICAL PRE-OPERATIONAL STEP):**
      *   3.1.1 Define RC *a priori* with maximal specificity (e.g., "Homo sapiens born post-1900 CE on Earth with ≥ 5 minutes of conscious experience"). Document exhaustively in Instrument Log.
      *   3.1.2 **SAFETY WARNING:** Operation of SSA Detector without fixed RC is PROHIBITED. Risk of severe RCSE, leading to uncontrolled boundary migration (e.g., inadvertent inclusion of Boltzmann Brains or future uploads), potential detector feedback loop, and indefinite result drift. SIA operation without fixed RC yields inflated OCIB uncertainty bands.
  3.2 **Blinding Protocol:**
      *   3.2.1 Operator must be blinded to the true cosmological hypothesis under test (Large/Small Universe). Hypothesis is input via encrypted file.
      *   3.2.2 SSA/SIA raw outputs (probability ratios) are initially masked. Prevents confirmation bias during RC fine-tuning (Sec 3.1) and data analysis (Sec 4.0).
      *   3.2.3 Unblinding occurs only after final analysis pipeline is locked.
  3.3 **Measurement Sequence:**
      *   3.3.1 Initialize RCDM with fixed RC parameters.
      *   3.3.2 Input encrypted cosmological hypothesis pair (H_large, H_small) into both detectors.
      *   3.3.3 Activate SSA Detector: Measures P(observer location | H, RC) = 1 / N_obs(H, RC).
      *   3.3.4 Activate SIA Detector: Measures P(H | observer exists) ∝ P(H) * N_obs(H).
      *   3.3.5 Record raw probability ratios (P_large / P_small) for each detector, including timestamp and RC parameters. Note detector-specific error flags (SSA: RCSE warning level; SIA: OCIB uncertainty estimate).

  **4.0 DATA HANDLING & REPORTING**
  4.1 **Calibration Logs:**
      *   4.1.1 SSA Log: Must include full RC specification hash, timestamp, calculated N_obs for each H, RCSE severity index (1-5).
      *   4.1.2 SIA Log: Must include timestamp, observer-count algorithm ID, OCIB uncertainty estimate (±%), notes on countability assumptions.
      *   4.1.3 Logs are immutable. Post-hoc RC adjustments invalidate the run (see Safety Warning 3.1.2).
  4.2 **Replication Protocol & Crisis Management:**
      *   4.2.1 Replication requires identical RC specification across labs. (Note: Historical replication failure rate >95% due to RC parameter drift).
      *   4.2.2 If SSA and SIA outputs are statistically incompatible under the same RC (expected outcome for most H_large/H_small pairs, e.g., Cosmological Constant fine-tuning), flag as "Anthropic Instrument Discrepancy (AID)." Do not average results.
      *   4.2.3 AID Status signifies unresolved systematic error source(s). Standard response: Initiate RC sensitivity analysis & OCIB audit, publish discrepant results with full error profiles.
  4.3 **Results Reporting (Cosmological Constant Example):**
      *   4.3.1 **SSA Output (RC: "Carbon-based, planet-bound, post-Industrial Revolution"):** P_large / P_small ≈ 1 / 10^120. Interpretation: Observer-location in Large Universe is atypical; suggests fine-tuning or incorrect H_large. Dominant Error: RCSE (High).
      *   4.3.2 **SIA Output:** P_large / P_small ≈ 10^120. Interpretation: Large Universe overwhelmingly more probable due to observer count. Dominant Error: OCIB (Extreme).
      *   4.3.3 **Unfalsifiability Note:** Both results remain formally unfalsifiable under SOP constraints. The Embedded Observer Artifact (Sec 1.3) prevents acquisition of an external control sample or measurement from outside the hypothesized ensembles. AID Status is permanent.
      *    4.3.4 **Conclusion:** Report both instrument readings with full systematic error profiles and AID flag. Emphasize the absence of cross-calibration standards or independent null-result verification pathways. Recommend against quoting results without appended error bands (RCSE ± ?%, OCIB ± ?%). Philosophical significance: Undetermined. Calibration status: Perpetually "Requires Verification."

  **APPROVED:**  
  *Dr. A. R. Gument, Director*  
  *Institute for Anthropic Calibration*  
  *"Measuring the Unmeasurable, With Errors"*
