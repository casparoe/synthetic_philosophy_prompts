answer: |-
  Below is a diagnostic taxonomy for the particularism-generalism debate centered on **threshold-sensitive contextual modulation (TSCM)**, defined as cases where a feature's moral valence reverses (e.g., from pro tanto reason to con) upon reaching a critical mass of competing features. The tree prioritizes responses to TSCM over the existence of exceptionless principles, with nodes addressing core commitments about reasons, judgment, and reasoning. Leaves include standard positions and hybrids, each annotated with their "most awkward commitment" (a concise encapsulation of the position's counterintuitive or theoretically costly implication). Unoccupied branches are diagnosed, and limitations of the taxonomy are flagged.

  ---

  ### **Taxonomy Decision Tree**  
  **Root Question:** Does the view accept that moral feature-salience can be **non-monotonic** via TSCM (valence reversal under critical-mass conditions)?  

  ├── **No** → **Strict Invariantism**  
  │   └── *Most awkward commitment:* Must deny that any feature (e.g., lying) can invert its moral valence regardless of contextual saturation, rendering it vulnerable to counterexamples involving emergent moral dilemmas.  
  │  
  └── **Yes** → Proceed to Node A:  

      ├── **Node A:** Can **invariant moral reasons** (features that always count in the same direction) survive TSCM intact?  
      │  
      │   ├── **No** → **Standard Particularism**  
      │   │   └── *Most awkward commitment:* No feature (even pain or promise-keeping) is immune to valence reversal, forcing abandonment of all candidate moral "primitives."  
      │   │  
      │   └── **Yes** → Proceed to Node B:  
      │  
      ├── **Node B:** Does holism about reasons **entail holism about all-things-considered judgment** (i.e., must TSCM preclude exceptionless overall principles)?  
      │   │  
      │   │   ├── **Yes** → **Reasons Atomism** (Hybrid 1)  
      │   │   │   └── *Most awkward commitment:* Invariant reasons exist, but their interactions are so TSCM-sensitive that no codifiable principles can govern final judgments.  
      │   │   │  
      │   │   └── **No** → Proceed to Node C:  
      │   │  
      ├── **Node C:** Does **practical reasoning** require **explicit articulation** of TSCM conditions (i.e., must critical-mass triggers be statable to guide action)?  
      │   │  
      │   │   ├── **Yes** → **Principled Contextualism** (Hybrid 2)  
      │   │   │   └── *Most awkward commitment:* Moral principles must incorporate infinitely complex ceteris paribus clauses to codify TSCM, making them humanly unworkable.  
      │   │   │  
      │   │   └── **No** → **Non-Articulable Generalism**  
      │   │       └── *Most awkward commitment:* Agents can reliably apply exceptionless principles governing TSCM without being able to articulate how or why inversions occur.  
      │   │  
      └── ── **End of Tree** ──  

  ---

  ### **Annotations**  
  1. **Unoccupied Branches & Diagnoses**  
     - *Branch 1:* **Accept TSCM → Reject invariant reasons → Affirm overall principles**  
       - *Diagnosis:* **Conceptually incoherent.** If no reasons are invariant (Node A: No), holism about reasons logically extends to judgment (Node B: Yes), making overall principles untenable.  
     - *Branch 2:* **Accept TSCM → Affirm invariant reasons → Reject overall principles → Require articulation of TSCM**  
       - *Diagnosis:* **Unexplored theoretical space.** Logically coherent (e.g., invariant reasons exist, but judgment-holism demands articulable TSCM rules), but no known theory occupies this niche.  

  2. **Hybrid/Under-Discussed Positions**  
     - **Reasons Atomism** (Node B: Yes): Accepts invariant reasons but denies general principles for all-things-considered judgments due to TSCM complexity.  
     - **Principled Contextualism** (Node C: Yes): Generalist view where principles are TSCM-sensitive but require full articulability of modulatory conditions.  

  3. **Limitations of Taxonomy: Indistinguishable Pairs**  
     - **Strict Invariantism vs. Non-Articulable Generalism:** Both endorse exceptionless overall principles, but the taxonomy separates them at the root (TSCM acceptance).  
     - **Standard Particularism vs. Reasons Atomism:** Both reject overall principles, but the taxonomy separates them at Node A (invariant reasons).  

  ---

  ### **Key Properties of the Taxonomy**  
  - **Precision:** Nodes target TSCM-specific commitments (valence reversal, not weight variation).  
  - **Accessibility:** Avoids niche sub-literature; hinges on core debate concepts (holism, invariance, practical reasoning).  
  - **Completeness:** Covers all logically possible paths, diagnosing gaps (e.g., Branch 1 incoherent, Branch 2 unexplored).  
  - **Critical Edge:** Leaf descriptions highlight theoretical costs to spark seminar debate.  

  This structure isolates how positions navigate TSCM—a sharper lens than "principles yes/no"—revealing underappreciated tensions in the particularism-generalism landscape.
