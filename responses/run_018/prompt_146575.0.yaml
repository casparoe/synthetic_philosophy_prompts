  ### Classroom Game: "The Dilemma of Delphi"  
  **Objective:** Experience the discursive dilemma, highlighting why premise-based aggregation feels legitimate despite sometimes producing unpopular outcomes.  

  ---

  #### **Materials**  
  1. **Role Cards (8 total):**  
     - 4 × **Premise Specialist**: "You care ONLY about the truth of P and Q. You earn points if the group’s process respects premises. Defense: Explain how P and Q were decided fairly."  
     - 4 × **Conclusion Specialist**: "You care ONLY about the truth of R. You earn points if the group’s process respects the conclusion. Defense: Explain how R was decided fairly."  
     - *(One random Premise Specialist card includes a red star ⭐️ and the text: "SECRET VETO: You can BLOCK premise-based aggregation once. If used, the group must switch to conclusion-based voting. You lose this power if conclusion-based is already chosen.")*  

  2. **Belief Cards (8 total, paired with roles after the rule vote):**  
     - **Premise Specialists (4 cards)**:  
       - 2 cards: "P: True, Q: False → R: False"  
       - 2 cards: "P: False, Q: True → R: False"  
     - **Conclusion Specialists (4 cards)**:  
       - 2 cards: "R: True (so P and Q must both be True)"  
       - 2 cards: "R: False (so P or Q must be False)"  
     *Note: Logical structure is **R = P AND Q**. Beliefs ensure premise-based aggregation will lead to R=True, though only 2/8 players believe R=True.*  

  3. **Voting Materials:**  
     - Whiteboard to track votes on P, Q, R.  
     - Slips of paper for secret ballots.  

  ---

  #### **Game Flow (90 mins)**  
  **1. Introduction & Rule Vote (15 mins)**  
  - **Setup:** Explain the group must decide the truth values of **P**, **Q**, and **R** (where **R = P AND Q**).  
  - **Rule Vote:**  
    - Present two options:  
      - **Premise-Based**: Vote on P and Q first; derive R from the results.  
      - **Conclusion-Based**: Vote directly on R; ignore P and Q.  
    - Group discusses and votes *publicly* (show of hands) on the rule. *Do not reveal roles yet!*  
  - **Pedagogic Hook:** Ask: *"Which rule feels more rational? Why?"*  

  **2. Role & Belief Assignment (5 mins)**  
  - Shuffle and distribute **Role Cards** (premise/conclusion specialists) and **Belief Cards** secretly.  
  - Ensure one Premise Specialist gets the **Veto Token** (marked with ⭐️).  

  **3. Voting Phase (20 mins)**  
  - **Premise-Based Path (if chosen):**  
    - Vote on **P** (secret ballot → tally on whiteboard).  
    - Vote on **Q** (secret ballot → tally).  
    - *Veto Moment:* Before deriving R, ask: *"Does anyone wish to veto?"* The veto holder (if present) can anonymously submit a "VETO" card. If vetoed, switch to voting on **R**. If not, derive **R = P AND Q**.  
  - **Conclusion-Based Path (if chosen):**  
    - Vote directly on **R** (secret ballot → tally).  
    - *Veto Token has no effect here.*  

  **4. Outcome & Defense Challenge (15 mins)**  
  - Announce the group’s final **R** (e.g., "R=True" under premise-based).  
  - **Payoff Condition:** Each player writes a 1-sentence defense of the outcome *based on their role*:  
    - Premise Specialists: Defend the *process* (e.g., "P and Q were decided democratically").  
    - Conclusion Specialists: Defend the *outcome* (e.g., "R was decided directly by us").  
  - **Scoring:** Group wins shared points if ≥6/8 defenses are valid (instructor spot-checks for role-appropriate logic).  

  **5. Debrief (35 mins)**  
  - **Key Questions:**  
    - *Frustration Mapping:* "Premise-specialists, how did it feel when R was derived from P and Q, even if you disliked R? Conclusion-specialists, how did it feel when R was decided without P and Q?"  
    - *Legitimacy of Premise-Based:* "Why does voting on premises *feel* more rational, even when it produces an outcome almost no one believes?" (Highlight: Premises anchor truth; conclusions feel arbitrary without them.)  
    - *Veto Impact:* "Did the veto token disrupt premise-based legitimacy? Or did it feel like a necessary check?" (Twist reinforces that premise-based is fragile to "procedural sabotage.")  
    - *Dilemma Reflection:* "When would you *prefer* conclusion-based? When would it feel illegitimate?"  
  - **Connect to Theory:** Premise-based prioritizes **procedural rationality**; conclusion-based prioritizes **outcome alignment**. Yet both can fail to reflect individual views.  

  ---

  #### **Predictions & Solutions**  
  - **Pre-Role Bargaining:**  
    - **Prediction:** Students will lobby for "neutral" rules before roles are assigned (e.g., "Premise-based is fairer!"), assuming they’ll be premise specialists.  
    - **Solution:** Restrict discussion to 5 mins. Emphasize: *"Commit to a rule before knowing your stake."*  

  - **Post-Role Renegotiation:**  
    - **Prediction:** Conclusion-specialists will demand to switch rules after seeing their role (e.g., "This is unfair!"). Veto holders may hesitate to "rock the boat."  
    - **Solution:** Enforce the initially chosen rule. Ask in debrief: *"Why did renegotiation feel tempting? Does that undermine collective reasoning?"*  

  - **Veto Token Dynamics:**  
    - **Prediction:** Veto holders (often premise-specialists) may **not use it** to avoid conflict, or use it impulsively if R seems "wrong."  
    - **Pedagogic Safeguard:** The veto is niche but *does not destroy the dilemma*:  
      - If unused, premise-based proceeds → unpopular R.  
      - If used, it forces conclusion-based → premise-specialists protest ignored premises.  
      - *Either way, frustration with aggregation methods is amplified.*  

  ---

  #### **Why This Works**  
  - **Premise-Based "Legitimacy":** Students experience why voting on premises feels objective—even when it manufactures a "false consensus" (R=True with only 2/8 believers).  
  - **Role Tension:** Premise/conclusion specialists clash on what "fairness" means, mirroring real-world expert disagreements.  
  - **Veto Twist:** Adds chaos without overshadowing the core dilemma, showing how procedural rules can be gamed.  
  - **No Tech Needed:** Uses cards, ballots, and discussion—accessible and immersive.  

  **Outcome:** Students leave viscerally grasping why groups adopt premise-based methods... and why they sometimes regret it.
