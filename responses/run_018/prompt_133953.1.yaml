prompt: |-
  ok just had a 3-hour arguement with my friend about whether societies owe it to victims to keep every atrocity alive in collective memory, or if Rieff was right that strategic forgetting is sometimes the more moral move. i'm defending a tweaked Rieff position at my philosophy of memory seminar tommorow: Margalit's ethics of memory makes sense for direct victim-relations, but at the collective level it collapses, especially since digital archives mean forgetting isn't passive decay anymore — it takes active "mnemonic labor" to suppress records, which flips the moral calculus. audience is mostly political philosophers who are deep into Margalit-style remembrance ethics, plus two transitional justice historians who actually know the Rwanda and Argentina cases cold. draft my q&a prep sheet: the eight or so objections i'll actually get, ordered by how damaging they'd be, each phrased like they'd say it in the room, with a two-minute reply and a note on where that reply is soft. tell me what i should concede up front — probably that individual victim-memory rights aren't the same as collective policy. and definitely include the one i'm dreading, about digital archives being a false analogy since monuments also require maintenance labor, with what i should say back and where it's weakest. no reading lists, just the prep.
