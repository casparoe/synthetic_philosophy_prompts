answer: |-
  ### Brainstorming Institutional Recording Imperatives
  Institutional imperatives generate divergent archives through distinct descriptive protocols. Legal liability demands precise causal attribution, timestamps, and fault chains, producing atomized records optimized for reconstructing sequences and responsibilities. Public relations, conversely, emphasizes community impact, resolution narratives, and stakeholder perceptions, curating documents showcasing institutional responsiveness and restored harmony. These protocols create mutually exclusive evidentiary universes: liability archives preserve fault-lines while PR archives erase them; one documents causes, the other remedies; each captures authentic facets but omits the other’s ontology. No deception is needed—the imperatives structurally exclude incompatible data types.

  ### Thought Experiment: The 1893 New Bedford Textile Mill Accident
  Consider a boiler explosion at a Massachusetts textile mill, documented by two contemporaneous institutional archives. The mill’s *Legal Compliance Archive* (LCA) contains engineers’ failure analyses, maintenance logs, deposition transcripts pinpointing corrosion neglect, and coroners’ reports listing traumatic deaths—framing the event as a preventable tragedy caused by managerial negligence. The city’s *Public Safety Archive* (PSA) holds fire department response logs, rescue testimonials, hospital recovery updates, and aldermen’s resolutions praising emergency coordination—framing it as a triumph of civic resilience where prompt action minimized loss. Both archives are authentic, complete within their mandates, and non-overlapping: the LCA lacks rescue narratives; the PSA omits negligence evidence. Historians discover no bridging documents.

  ### Verdicts and Rationales
  1.  **Rankean Historian:** Concedes underdetermination. Critical comparison fails because the archives share no overlapping facts to corroborate or contradict. The LCA supports a "negligence-tragedy" account; the PSA supports a "resilience-comedy" account. No third source exists to arbitrate causation versus response. The event’s essence—whether it was fundamentally a failure or a recovery—remains indeterminate via source criticism alone.  
  2.  **Carr Historian:** Finds selection/arrangement invariant. Whether investigating class oppression (favoring LCA’s negligence) or urban solidarity (favoring PSA’s heroism), the historian receives identical document sets. The archives’ institutional curation pre-screens materials: class-focused queries retrieve LCA’s depositions but not PSA’s rescues; solidarity queries retrieve PSA’s resolutions but not LCA’s maintenance logs. Standpoint alters *interpretation* of documents, not *access* to them, as institutional gatekeeping fixes the corpus.  
  3.  **Whitean Narrativist:** Confronts pre-inscribed emplotment. The LCA’s structure—neglect, failure, death—embeds tragedy; the PSA’s structure—danger, response, restoration—embeds comedy. The historian cannot impose a new plot (e.g., satire) without ignoring one archive’s intrinsic form. Choosing *between* archives becomes choosing between tragedy and comedy, as narrative is materially encoded in preservation protocols.  

  ### The Critical Structural Feature
  **Institutional Siloing via Non-Interpenetrating Epistemic Mandates** drives the divergence. The LCA’s liability imperative excludes redemptive data as irrelevant; the PSA’s harmony imperative excludes incriminating data as destabilizing. This creates two self-contained, non-communicating documentary universes. Remove this siloing (e.g., if a city inspector’s report blended causation and response) and the conditions collapse: Rankeans gain overlap for criticism, Carr’s selection varies with standpoint, and White’s historian escapes binary emplotment.

  ### Counterarguments from Defenders  
  - **Rankean Defense:** Argues the scenario artificially bounds "the event." A rigorous historian would seek traces *outside* institutional archives (e.g., worker diaries, insurance claims) to fill the gap. The underdetermination reflects incomplete source retrieval, not a failure of method.  
  - **Carr Defense:** Contends that observed selection stability mistakes institutional mediation for standpoint-neutrality. The historian’s standpoint *does* shape which *institution* they interrogate (e.g., a Marxist prioritizes the LCA). Stability within archives is trivial; the significant selection—choosing which archive to trust—remains standpoint-dependent.  

  This scenario isolates how institutional record-creation, not historian subjectivity or narrative invention, can fragment history irreducibly.
