prompt: |-
  I am a clinical psychologist at a regional hospital and have recently been put in charge of a new multidisciplinary service for adults with persistent physical symptoms that lack a sufficient structural explanation: chronic widespread pain, functional neurological symptoms, persistent dizziness, and similar presentations. Over the past few years I have become convinced that predictive processing and the free energy principle describe what I see in this clinic better than the older habit of dividing these patients into organic or psychogenic categories. But I cannot hand my colleagues a theory; I need something they can actually run.

  Please write me a reusable, thirty-minute initial-assessment procedure, grounded in predictive processing and active inference, that a physiotherapist, a psychiatric nurse, or a junior doctor could follow without reading the underlying theory. It should be a step-by-step procedure: what to ask or observe first, what a given answer tells you, where a step stops and refers back to a physician, and where a step is a clinical judgment call rather than an inference from the framework. It should distinguish the work done by the person's prior expectations, the confidence assigned to sensory prediction error (especially interoceptive error), and the person's attempts to manage uncertainty through action, including the ways those actions may confirm the very model they are meant to reduce, but it must not use that vocabulary with patients. By the end, the procedure should produce a one-page formulation identifying the most plausible maintaining loop, one intervention aimed at that loop, and a short note on what early evidence would indicate the formulation is wrong. A consultant physician must countersign the formulation before it reaches the patient, so the procedure must flag anything that requires medical review first. My team sees these referrals weekly, and the stakes are real.

  Then run the procedure on two hypothetical referrals, showing each step:
  1. A 41-year-old man with three years of widespread pain and fatigue following a minor road traffic collision, entirely normal imaging and blood tests, high health anxiety, repeated internet searching and requests for reassurance, and progressive avoidance of physical activity.
  2. A 27-year-old woman with panic attacks, constant pulse checking, and avoidance of exercise after one episode of palpitations.

  For at least one of the two, let the procedure deliver an answer the team will not like, for instance discontinuing a reassurance practice the clinic currently regards as kind or standard. Be explicit about what the procedure cannot rule out, including new or previously missed medical disease, about where it could mislead someone without specialist training, and about which parts are value decisions that theory alone cannot settle.

  End your reply with a one-sentence summary of the procedure, formatted as: Summary: <one sentence>.
reasoning: |-
  We are designing a 30-minute initial assessment procedure based on predictive processing and active inference, without using the technical jargon with patients. The procedure should help identify maintaining loops and suggest interventions. It must flag any need for medical review. The output is a one-page formulation.

  The key concepts we need to translate:
  - Prior expectations: The patient's deeply held beliefs about their health and symptoms.
  - Confidence in sensory prediction error (precision weighting): How much the patient trusts their bodily sensations (interoception) and how this might be heightened (high precision) leading to more attention to symptoms.
  - Managing uncertainty through action: The actions (like avoidance or checking) that the patient takes to reduce uncertainty but may end up reinforcing the problem (confirming the model).

  Procedure Outline (30 minutes):

  1. **Introduction (2 minutes):** 
     - Explain the purpose: "We're going to spend about 30 minutes understanding your symptoms and how they affect you, so we can work together on a plan to help you feel better."
     - Set expectations: "I'll be asking about your symptoms, what you've noticed about them, and what you've tried so far."

  2. **Symptom Exploration (8 minutes):**
     - Ask: "Can you describe your main symptoms? When did they start? What do you think caused them?"
     - Listen for: 
       - The patient's beliefs about the cause (prior expectations). 
       - Any triggering event (even minor) that might have set the initial prediction.
     - Ask: "How do your symptoms change from day to day? Are there times when they are better or worse?"
     - Listen for: Contexts that modulate symptoms (e.g., stress, activity, rest) which might relate to prediction errors.

  3. **Impact and Coping (8 minutes):**
     - Ask: "What activities have you stopped or changed because of your symptoms? What do you do when the symptoms get worse?"
     - Listen for: 
       - Avoidance behaviors (reducing action to avoid prediction error) and safety behaviors (like checking, seeking reassurance) that are attempts to manage uncertainty.
       - Also note if these behaviors might be reinforcing the problem (e.g., avoiding movement leads to more sensitivity to movement).
     - Ask: "How do you feel about the future with these symptoms? What worries you the most?" (This taps into prior expectations and the emotional valence of the predictions).

  4. **Attention and Interpretation (5 minutes):**
     - Ask: "How much do you notice your symptoms? For example, are you always aware of them, or do they sometimes fade into the background?"
     - Listen for: Hypervigilance (high precision on interoceptive signals).
     - Ask: "When you notice a change in your symptoms, what goes through your mind? What do you think it means?" 
     - Listen for: Catastrophic interpretations (which are strong priors) and how they might amplify the symptoms.

  5. **Medical Review Flag (2 minutes):**
     - Check: "Have you had any new symptoms since your last medical check-up? Any changes in your symptoms that concern you?" 
     - Also, ask about red flags (e.g., unexplained weight loss, neurological deficits, fever, etc.) as per standard medical guidelines for the presenting symptoms. If any are present, refer to the physician immediately.
     - Note: The procedure must not proceed if there are unresolved medical concerns or red flags. The clinician must be trained to recognize when to stop and refer.

  6. **Synthesis and Formulation (5 minutes):**
     - The clinician uses the information to build a formulation:
       - **Prior Expectations:** What are the patient's key beliefs about the cause and nature of the symptoms? (e.g., "I have a serious undiagnosed disease", "Movement will damage me")
       - **Precision Weighting:** Is there evidence of heightened attention to bodily sensations? (e.g., constant monitoring, inability to distract from symptoms)
       - **Actions to Manage Uncertainty:** What behaviors are being used to reduce uncertainty? (e.g., avoidance, checking, reassurance seeking) and how might they be reinforcing the problem?
     - Identify the maintaining loop: For example, "Belief that movement is harmful (prior) -> avoidance of movement (action) -> reduced opportunity for disconfirming evidence -> increased sensitivity to movement (increased precision on interoception) -> pain with movement -> confirms belief."

  7. **Intervention Selection:**
     - Choose one intervention that targets the identified loop. Examples:
       - If avoidance is the key: graded exposure to the avoided activity (with the goal of updating the prior).
       - If high precision (hypervigilance): attention training to broaden focus away from the body.
       - If reassurance seeking: reduce reassurance (e.g., limit internet searches, set boundaries on medical appointments) to allow tolerance of uncertainty.
     - The intervention must be simple and actionable in the next week.

  8. **Early Evidence of Wrong Formulation:**
     - Note: "If the patient reports an increase in symptoms that is not temporary and expected (e.g., in graded exposure we expect some increase initially) or if new symptoms emerge that are not part of the original presentation, then reconsider the formulation and consult a physician."

  9. **Value Decisions:**
     - Explicitly note that the choice of intervention involves value judgments (e.g., the patient's goals, what they are willing to try, and the clinician's judgment of safety). The theory doesn't dictate which intervention to choose if multiple loops are present; it's a clinical decision.

  Now, we run the procedure on two hypothetical referrals.

  **Referral 1: 41-year-old man with three years of widespread pain and fatigue following a minor road traffic collision, entirely normal imaging and blood tests, high health anxiety, repeated internet searching and requests for reassurance, and progressive avoidance of physical activity.**

  Step-by-Step:

  1. **Introduction:** Done.

  2. **Symptom Exploration:**
     - He describes widespread pain and fatigue starting after a minor car accident. He believes the accident caused internal damage that "doctors haven't found yet".
     - Symptoms are worse when he tries to be active and better when he rests.

  3. **Impact and Coping:**
     - He has stopped almost all physical activity (avoidance) and spends hours each day researching his symptoms online (reassurance seeking). He sees multiple doctors for reassurance.
     - He worries that he has a serious condition that will get worse if he pushes himself.

  4. **Attention and Interpretation:**
     - He is constantly aware of his pain and fatigue. Any increase in symptoms is interpreted as proof of underlying damage.

  5. **Medical Review Flag:**
     - No new symptoms or red flags reported. Last tests were recent and normal. Proceed.

  6. **Synthesis:**
     - **Prior Expectations:** Strong belief that the accident caused hidden damage and that activity will cause harm.
     - **Precision Weighting:** High attention to bodily sensations (hypervigilance).
     - **Actions:** Avoidance of activity and reassurance seeking. These actions prevent disconfirmation (he never experiences that activity doesn't cause damage because he avoids it, and reassurance temporarily reduces anxiety but then he needs more, reinforcing the belief that the threat is real).
     - **Maintaining Loop:** Belief in hidden damage -> avoidance of activity and seeking reassurance -> no update of belief (because no disconfirmation) -> heightened attention to symptoms (due to inactivity and hypervigilance) -> symptoms are experienced as more intense -> confirms belief.

  7. **Intervention:** 
     - Target the avoidance and reassurance seeking. 
     - Intervention: Agree on a plan to gradually increase activity (graded exposure) starting with very low levels (e.g., 5 minutes of walking per day) and to reduce reassurance behaviors (limit internet searching to 10 minutes per week and agree to not seek medical appointments for reassurance for the next month). The goal is to test the belief that activity causes harm and to build tolerance to uncertainty.

  8. **Early Evidence of Wrong Formulation:**
     - If the patient experiences a significant increase in pain that does not subside with rest and is not expected in the graded exposure plan, or if new neurological symptoms appear, then reconsider and consult a physician.

  9. **Value Decision:** The clinician must negotiate the activity level and the reduction in reassurance. The patient may be reluctant. The clinician must balance pushing for change and respecting the patient's autonomy.

  **Referral 2: 27-year-old woman with panic attacks, constant pulse checking, and avoidance of exercise after one episode of palpitations.**

  Step-by-Step:

  1. **Introduction:** Done.

  2. **Symptom Exploration:**
     - She reports panic attacks and palpitations that started after one episode of palpitations during exercise. She thought she was having a heart attack. Tests (ECG, etc.) were normal.
     - Symptoms occur when she is anxious, especially when she notices her heart rate.

  3. **Impact and Coping:**
     - She avoids exercise and checks her pulse constantly (multiple times an hour) to ensure her heart is "safe". She also avoids caffeine and stressful situations.
     - She worries that she has an undetected heart condition and that exercise might trigger a heart attack.

  4. **Attention and Interpretation:**
     - She is hyper-aware of her heart rate. Any slight change (like a normal increase during a shower) is interpreted as a sign of danger.

  5. **Medical Review Flag:**
     - No red flags. She had a recent cardiac workup that was normal. Proceed.

  6. **Synthesis:**
     - **Prior Expectations:** Belief that heart palpitations are dangerous and indicate a heart problem.
     - **Precision Weighting:** Very high attention to cardiac sensations (high precision on interoceptive signals).
     - **Actions:** Constant pulse checking (a safety behavior) and avoidance of exercise. The checking behavior actually draws attention to the heart and may amplify sensations (due to heightened precision) and the avoidance prevents learning that exercise is safe.
     - **Maintaining Loop:** Belief that heart sensations are dangerous -> hypervigilance and checking -> increased attention amplifies the sensations (and may cause anxiety which increases heart rate) -> the heightened sensation confirms danger -> avoidance of exercise prevents disconfirmation.

  7. **Intervention:**
     - Target the checking and avoidance. 
     - Intervention: Gradually reduce pulse checking (set a schedule to reduce from 20 times a day to 10, then 5, etc.) and begin graded exposure to exercise (start with light activity, like slow walking, and gradually increase). The goal is to learn that the heart sensations are not dangerous and that exercise is safe.

     But note: The procedure must sometimes deliver an answer the team will not like. In this clinic, it might be standard to offer reassurance (e.g., "Your heart is fine") or to allow pulse checking as a coping mechanism. However, the procedure suggests discontinuing the reassurance practice and reducing checking because they are part of the maintaining loop.

     Therefore, we explicitly state: The intervention must include reducing reassurance from the clinic as well. For example, if she calls the clinic for reassurance about her heart, the team should not provide it but instead remind her of the plan and encourage her to use the exposure and reduction of checking.

  8. **Early Evidence of Wrong Formulation:**
     - If during the exercise program she experiences new cardiac symptoms (e.g., chest pain with exertion, syncope) that were not previously evaluated, then stop and refer to a physician.

  9. **Value Decision:** The patient may feel that stopping pulse checking is too scary. The clinician must build trust and negotiate a tolerable pace. Also, the decision to withhold reassurance is a value judgment about what is ultimately helpful.

  **Limitations and Caveats:**
  - The procedure cannot rule out new or previously missed medical disease. It relies on the patient's report and available medical records. Red flags must be monitored at every contact.
  - Without specialist training, a clinician might:
    - Miss subtle red flags.
    - Apply the intervention too rigidly (e.g., pushing exposure too fast) leading to harm or dropout.
    - Overlook comorbidities (e.g., depression) that need addressing.
  - Value decisions: The choice of which loop to target first and how aggressively to reduce safety behaviors are not dictated by theory alone. They require clinical judgment and patient collaboration.

  **Summary:** A structured 30-minute assessment procedure translating predictive processing concepts into practical steps to identify maintaining loops of persistent symptoms, design targeted interventions, and flag medical red flags, culminating in a one-page formulation for consultant review.
answer: |-
  ### Reusable 30-Minute Initial Assessment Procedure: Predictive Processing Approach  
  **Goal:** Identify maintaining loops (prior expectations, sensory precision, action patterns) without technical jargon. Output: One-page formulation for consultant sign-off.  

  **Key Principles Translated for Clinicians:**  
  - **Prior expectations:** "What the patient believes about their symptoms/causes."  
  - **Sensory precision:** "How closely the patient notices/tracks bodily sensations."  
  - **Action patterns:** "What the patient does to cope—and if it backfires."  
  **Medical safety first:** Stop and refer to physician for red flags (e.g., new neurological signs, weight loss, fever, or symptom progression inconsistent with diagnosis).  

  ---

  #### Step-by-Step Procedure (30 Minutes Total)  
  **1. Opening (2 min)**  
  - **Say:** "I’d like to understand your symptoms, how they affect you, and what you’ve tried. We’ll work together on a plan."  
  - **Flag for referral:** If patient reports *red flags* (e.g., chest pain, weakness, bowel/bladder changes), pause and refer to physician immediately.  

  **2. Symptom Story (8 min)**  
  - **Ask:**  
    - "When did symptoms start? What was happening then?"  
    - "What do you think caused them? What worries you most about them?"  
  - **Listen for:**  
    - **Prior expectations:** Fixed beliefs (e.g., "My pain means tissue damage").  
    - **Trigger:** Minor event (e.g., infection, stress) that shifted attention to the body.  
  - **Stop and refer:** If symptoms suggest new pathology (e.g., asymmetrical weakness).  

  **3. Symptom Patterns (5 min)**  
  - **Ask:**  
    - "When are symptoms better/worse? What do you notice in your body when they flare?"  
    - "How much do you focus on these sensations daily?"  
  - **Listen for:**  
    - **Sensory precision:** Hypervigilance (e.g., "I track every twinge").  
    - **Context:** Symptoms worsening with stress/attention, improving with distraction.  

  **4. Coping & Avoidance (8 min)**  
  - **Ask:**  
    - "What do you do when symptoms flare? What have you stopped doing because of them?"  
    - "Does it help in the short term? Long term?"  
  - **Listen for:**  
    - **Action patterns:** Avoidance (e.g., resting), safety behaviors (e.g., checking, seeking reassurance).  
    - **Loop reinforcement:** Behaviors that prevent disconfirmation (e.g., avoiding activity → less evidence movement is safe).  

  **5. Belief Check (5 min)**  
  - **Ask:**  
    - "If I told you your tests are normal, what would that mean to you?"  
    - "What would it take to feel these symptoms are less threatening?"  
  - **Listen for:**  
    - **Prior rigidity:** Difficulty updating beliefs despite evidence (e.g., "Tests must be wrong").  
    - **Openness to change:** Willingness to try new strategies.  

  **6. Formulation & Intervention (2 min)**  
  - **Synthesize:**  
    - **Prior expectation:** "Believes X about symptoms."  
    - **Sensory precision:** "Highly focused on bodily sensations."  
    - **Action pattern:** "Uses Y to cope, which may maintain the problem by Z."  
    - **Loop:** "Belief → Action → Reinforced Belief."  
  - **Choose one intervention:** Target the loop’s weakest link (see table below).  
  - **Early evidence of wrong formulation:** "Symptoms worsen unexpectedly or new unrelated symptoms emerge."  

  **7. Safety Net & Sign-Off**  
  - **Note on form:** "No red flags detected" or "Referred for [specific concern]."  
  - **Consultant must sign:** Before sharing with patient.  

  ---

  ### Intervention Guide for Clinicians  
  | Loop Component          | Intervention Goal          | Example Actions                          |  
  |-------------------------|----------------------------|------------------------------------------|  
  | **Rigid prior belief**  | Loosen fixed expectations  | Education: "Pain doesn’t mean damage."  |  
  | **High sensory precision** | Reduce body monitoring     | Attention training: "Focus on environment, not body." |  
  | **Unhelpful action**    | Break the cycle            | Exposure: "Gradual return to avoided activity." |  

  ---

  ### Running the Procedure: Two Hypothetical Referrals  
  **Referral 1: 41M with widespread pain/fatigue after minor car crash, health anxiety, avoidance, reassurance-seeking.**  

  **Step 1:** No red flags.  
  **Step 2:**  
    - "Started after a fender bender 3 years ago. Believes 'something was torn' despite normal scans."  
    - Worry: "I’ll end up disabled."  
    - **Prior:** "Pain equals hidden structural damage."  
  **Step 3:**  
    - "Worse when I move or stress; better when resting. I notice every ache."  
    - **Sensory precision:** High (hypervigilant).  
  **Step 4:**  
    - "I rest all day, Google symptoms, and ask my GP for scans. It helps briefly, but pain returns."  
    - **Action pattern:** Avoidance + reassurance-seeking → prevents learning movement is safe.  
  **Step 5:**  
    - "Normal tests don’t reassure me—they missed something."  
    - **Prior rigidity:** High.  
  **Formulation:**  
    - **Loop:** "Belief 'movement causes damage' → avoidance/reassurance-seeking → no chance to learn movement is safe → pain sensitivity increases."  
    - **Intervention:** Graded activity exposure (start walking 5 min/day) + stop Googling/reassurance-seeking.  
    - **Early evidence wrong:** New weakness or joint swelling.  
  **Value decision:** Discontinuing reassurance is "unkind" short-term but targets the loop. Requires rapport-building.  

  **Referral 2: 27F with panic attacks, pulse-checking, exercise avoidance after palpitations.**  

  **Step 1:** No red flags (cardiac workup normal).  
  **Step 2:**  
    - "Started after one palpitation during exercise. Believes 'my heart is fragile.'"  
    - Worry: "I’ll have a heart attack."  
    - **Prior:** "Heart sensations mean danger."  
  **Step 3:**  
    - "Panic when I feel my pulse race. I check it constantly."  
    - **Sensory precision:** Extreme (always monitoring).  
  **Step 4:**  
    - "I avoid exercise and check pulse 20x/day. It calms me briefly, but I panic if I can’t check."  
    - **Action pattern:** Pulse-checking → amplifies attention to heart → reinforces threat.  
  **Step 5:**  
    - "Normal ECG helps, but I think, 'What if next time is the one?'"  
    - **Prior rigidity:** Moderate.  
  **Formulation:**  
    - **Loop:** "Belief 'heart sensations are dangerous' → pulse-checking/avoidance → reinforces attention to heart → sensations feel scarier."  
    - **Intervention:** Reduce pulse-checking (taper to 2x/day) + gradual exercise exposure (walking).  
    - **Early evidence wrong:** Syncope or exertional chest pain.  
  **Team discomfort:** Stopping pulse-checking may feel "cruel," but it reduces sensory precision.  

  ---

  ### Limitations & Caveats  
  - **Cannot rule out:** New medical disease (e.g., autoimmune, cardiac). Requires ongoing vigilance.  
  - **Training risks:**  
    - Missing subtle red flags (e.g., interpreting "weakness" as functional without exam).  
    - Over-interpreting "rigid beliefs" in cultural contexts (e.g., somatic expressions of distress).  
  - **Value decisions:**  
    - Choosing which loop to target first (e.g., exposure vs. attention training).  
    - Balancing safety vs. pushing tolerance of uncertainty.  
    - When to prioritize compassion over theory (e.g., in severe trauma).  

  **Summary:** A 30-minute structured interview identifying symptom beliefs, body vigilance, and coping behaviors to formulate a maintaining loop and target one intervention, pending physician sign-off for safety.
