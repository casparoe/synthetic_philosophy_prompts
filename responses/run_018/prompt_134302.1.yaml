prompt: |-
  Design a thought experiment that isolates whether moral status attaches to a computation per se or only to computations embedded in a specific kind of biological feedback architecture. Scenario specifications: two patients with identical prefrontal injuries are aided by the same executive-planning algorithm in a realistic rehabilitative clinic. In Patient A, the algorithm runs on an implanted neural interface with continuous bidirectional modulation: the chip reads the patient's interoceptive states and adjusts its processing priorities accordingly, while the patient's brain receives the outputs as part of its global workspace. In Patient B, the identical algorithm runs on an external server; only the final decision is transmitted back to the patient, with no reciprocal influence on the computation. Describe the scenario in one paragraph, with no science-fiction elements, no perfect predictors, and no demons.

  Then demonstrate the verdicts: (1) a functionalist who takes computation-plus-integration as sufficient for derivative moral standing should treat both computations similarly; (2) a biological-embedding theorist who requires reciprocal integration into a unified living global workspace should deny standing to the remote computation in B but possibly grant hybrid standing in A; (3) both should agree that the human patient retains full primary status regardless.

  Next, identify the exact structural feature—reciprocal, real-time modulation versus one-way transmission—that drives the disagreement, and explain why stripping that feature away collapses the case into a generic substrate-independence dispute. Finally, present the strongest counterattack available to the biological-embedding theorist: specifically, an argument that the feedback loop in A is merely causal instrumentation rather than constitutive integration, and do so without invoking vitalism or unnamed authoritative texts. Keep the response concise, do not provide bibliographies, reading lists, or citations, and define within your answer any technical terms such as global workspace or interoceptive modulation that you use.
