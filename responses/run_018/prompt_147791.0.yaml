answer: |-
  The Regress Archive hummed with sterile silence. Elias adjusted his gloves, fingertips brushing the cool glass wall where Anya Vance’s causal tree branched – a luminous, intricate latticework of light. Her conviction for aggravated assault hung between them, unspoken but palpable.

  "Begin," Elias murmured. The glass flickered. Anya flinched as her own furious face materialized: shouting at the victim outside the bar. "Your anger," Elias stated, not a question.

  "Obvious," Anya muttered. The tree deepened, revealing layers: the patronizing remark that ignited her, the toxic boss whose jibes eroded her patience for weeks prior, the failed promotion that seeded her resentment.

  Elias guided them back. "The promotion denial stemmed from documented impulsivity," he noted. The light refracted, showing younger Anya: school suspensions, volatile friendships. "Temperamental predisposition?" he asked softly, highlighting a genetic marker cluster glowing faintly amber in the weave.

  Anya’s jaw tightened. "So I was born broken?"

  "Not broken. Shaped." Elias pushed further. Childhood unfolded: a chaotic home, a volatile father whose own causal tree shimmered briefly, branching into *his* father’s alcoholism, *his* mother’s abandonment. Layer upon layer, the light receding into a dizzying, infinite corridor of prior causes – socioeconomic pressures, generational traumas coded deep, the cold statistical dance of alleles combining at conception.

  Anya watched her own foundational fears crystallize – the primal terror of sudden loud noises traced to an infancy spent amid shouting, the deep-seated need for control born from chaos. Each revelation peeled back another skin, exposing not a core of self-creation, but only another set of conditions, received, unchosen.

  "Ground zero?" Anya finally whispered, staring into the fractal abyss of her origins. "There isn’t one, is there?"

  Elias felt the familiar hollowing in his chest, the erosion of his professional certainty. He’d guided hundreds, always hoping the next layer would reveal the moment of true authorship, the pivot point where responsibility could crystallize. He saw only an endless cascade of antecedents. "No," he admitted, the word flat. "No uncaused cause. No *causa sui*."

  The Archive door hissed open. The victim’s sister stood silhouetted, her face etched with raw, enduring fury. She looked past Elias, her gaze locking onto Anya, radiating a blame untouched by the luminous genealogy sprawling across the walls. Anya shrank, guilt flooding her features, as visceral and undeniable as the sister’s rage.

  The glass tree pulsed silently, a billion points of light mapping a path to no beginning. Elias switched the display off. The sterile room felt colder. Anya’s guilt, the sister’s anger – they weren’t dissolved by the infinite regress revealed; they persisted, heavy and real, like unchosen weather. Elias removed his gloves. The excavation was complete. The verdict remained, unsupported by ultimate origin, yet immovable.
