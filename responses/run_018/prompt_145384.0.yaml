answer: |-
  ### Decision Procedure Checklist for Mechanism Comparison

  **Instructions:**  
  Work through each question in sequence. Answer "Yes," "No," or "Unknown." Stop and output the decision as soon as a terminal answer is reached.

  1. **Phenomenon Check:**  
     *Question:* Is the **observed failure phenomenon** identical to the previous incident?  
     - *Sufficient Answer:*  
       - **Yes:** Same measurable outcome (e.g., "false low chlorine reading," "pump vibration").  
       - **No:** Different outcome (e.g., false high vs. false low, vibration vs. overheating).  
       - **Unknown:** Cannot verify the phenomenon (e.g., incomplete data).  
     - *Output:*  
       - **No** → **"Escalate to regulator"** (new phenomenon).  
       - **Unknown** → **"Hand to human — values call"** (insufficient data).  
       - **Yes** → Proceed to Question 2.

  2. **Identicality Check:**  
     *Question:* Are the **specific entities and activities** identical to the previous incident?  
     - *Sufficient Answer:*  
       - **Yes:** Same components (e.g., same sensor model, same pipe) AND same actions (e.g., biofilm growth, firmware calibration).  
       - **No:** Different components (e.g., new sensor) OR different activities (e.g., cavitation vs. bearing wear).  
       - **Unknown:** Ambiguous entities/activities (e.g., "might be cavitation or bearing wear").  
     - *Output:*  
       - **Yes** → **"Apply patch"** (identical mechanism).  
       - **No** → Proceed to Question 3.  
       - **Unknown** → Proceed to Question 3.

  3. **Organizational Pattern Check:**  
     *Question:* Is the **organizational pattern** (roles and relationships) the same, even with different entities/activities?  
     - *Sufficient Answer:*  
       - **Yes:** Same causal structure (e.g., "external interference disrupting measurement," "mechanical stress causing vibration").  
       - **No:** Different causal structure (e.g., software error vs. physical buildup, internal failure vs. external shock).  
       - **Unknown:** Unclear roles/relationships (e.g., undetermined source of interference).  
     - *Output:*  
       - **Yes** → **"Apply patch"** (same root cause per SOP).  
       - **No** → **"Escalate to regulator"** (new root cause).  
       - **Unknown** → **"Hand to human — values call"** (ambiguous pattern).

  ---

  ### Test Cases

  #### Case 1: Chlorine Sensor False Lows (Biofilm Buildup)  
  - **Phenomenon Check:**  
    - Current: False low chlorine reading.  
    - Previous: False low chlorine reading (last quarter).  
    → **Yes** (same phenomenon).  
  - **Identicality Check:**  
    - Entities: Same sensor, same location.  
    - Activities: Biofilm buildup blocking sensor.  
    → **Yes** (identical entities/activities).  
  - **Output:** **"Apply patch"** ✅  
    *Rationale: Matches previous incident exactly.*

  #### Case 2: Chlorine Sensor False Lows (Firmware Update)  
  - **Phenomenon Check:**  
    - Current: False low chlorine reading.  
    - Previous: False low chlorine reading.  
    → **Yes** (same phenomenon).  
  - **Identicality Check:**  
    - Entities: Same physical sensor.  
    - Activities: Firmware calibration error (vs. previous biofilm buildup).  
    → **No** (different activities).  
  - **Organizational Pattern Check:**  
    - Previous Pattern: "External contaminant physically obstructs measurement."  
    - Current Pattern: "Software error disrupts calibration."  
    → **No** (different roles: physical obstruction vs. algorithmic error).  
  - **Output:** **"Escalate to regulator"** ⚠️  
    *Rationale: Team won’t like this—same phenomenon but different root cause. SOP forces escalation despite superficial similarity.*

  #### Case 3: Pump Vibration (Bearing Wear vs. Cavitation)  
  - **Phenomenon Check:**  
    - Current: Excessive pump vibration.  
    - Previous: Excessive pump vibration (from bearing wear).  
    → **Yes** (same phenomenon).  
  - **Identicality Check:**  
    - Entities: Same pump.  
    - Activities: Unknown (cavitation or bearing wear?).  
    → **Unknown** (insufficient diagnostics).  
  - **Organizational Pattern Check:**  
    - Previous Pattern: "Mechanical degradation (bearing wear) causes imbalance."  
    - Current Pattern:  
      - If cavitation: "Fluid dynamics (bubble collapse) causes shockwaves."  
      - If bearing wear: Same as previous.  
    → **Unknown** (cannot confirm pattern).  
  - **Output:** **"Hand to human — values call"** ⚠️  
    *Rationale: Ambiguous mechanism—requires expert judgment.*

  ---

  ### What the Procedure **Cannot** Settle  
  - **Abstraction Conflicts:**  
    The procedure cannot resolve disagreements over *how broadly to define organizational patterns* (e.g., Is "external interference" too vague? Does firmware error fit "contamination" metaphors?).  
  - **Multi-Mechanism Failures:**  
    If a failure involves **multiple interacting mechanisms** (e.g., biofilm AND firmware), the checklist treats mechanisms as binary (same/different) and may oversimplify.  
  - **Value-Based Tradeoffs:**  
    It cannot adjudicate **risk tolerance** (e.g., "Is a software glitch in the same ‘category’ as physical buildup for regulatory purposes?").  

  **Final Note:** Use this checklist as a first-line tool—but when patterns are ambiguous or abstract, default to human escalation. Philosophy won’t replace engineering judgment! 🛠️
