  ## Pre-Vote Committee Memorandum: Truman Center Proposal  
  **From:** [Your Name], Doctoral Representative, Committee on Institutional Naming and Ethical Endowment  
  **Date:** [Date of Memo]  
  **Subject:** Recommendation Regarding the Proposed "Truman Center for Strategic Decision-Making" Gift  

  The proposed $4.5 million gift establishing the "Truman Center for Strategic Decision-Making" presents a significant ethical challenge demanding rigorous application of our naming principles, particularly in light of G.E.M. Anscombe's enduring critique of President Truman’s authorization of the atomic bombings. Anscombe’s core argument – that deliberately using the deaths of innocents as a *means* to an end (ending the war) constitutes intentional murder, distinct from foreseen but unintended harm permissible under double effect – cannot be dismissed as anachronistic. It compels us to examine the structure of our own institutional intention in accepting this naming honor.

  **Engaging the Core Ethical Tension:**

  1.  **Anscombe's Challenge & Institutional Intention:** The critical question is whether naming a Center *after* Truman structurally directs our institutional intention toward honoring an act Anscombe defines as murder. Does the naming itself constitute adopting the civilian deaths as a *means* to celebrate strategic decisiveness or presidential power? If so, this would align with Anscombe’s condemnation of directing the will toward evil. Conversely, is the association with Truman’s complex legacy, including the bombings, merely a *foreseen but unintended byproduct* of accepting resources aimed at fostering critical examination of precisely such ethical dilemmas in leadership? The latter might align with double effect, where the foreseen evil (association with a contested act) is not chosen as a means or end.

  2.  **The Opposing Consideration (Resources & Feasibility):** Rejecting the gift outright would indeed deprive students and faculty of substantial resources for valuable scholarship and programming. Furthermore, demanding absolute moral purity from historical namesakes is arguably unfeasible and risks sanitizing history, potentially hindering the serious, critical ethical study this Committee aims to promote. Resources enable the very discourse necessary to grapple with figures like Truman.

  **Reflexive Application of Anscombe's Distinction to Our Decision:**

  Applying Anscombe’s framework reflexively to our potential acceptance:

  *   **Accepting the Gift *as proposed* ("Truman Center"):** This risks structuring our institutional intention such that honoring Truman – a figure irrevocably defined by the act Anscombe condemned as murder – is the *primary, direct aim*. The naming itself becomes the means of recognition, implicitly valorizing his strategic decisions without necessary critical distance. This leans uncomfortably close to *directing our institutional intention* toward honoring the actor behind an act deemed murderous in this philosophical framework.
  *   **Rejecting the Gift Outright:** While avoiding complicity in honoring Truman, this directs our intention toward preserving institutional purity, foreseeably sacrificing significant resources for ethical study as an unintended but accepted side-effect (aligning more with double effect). However, it fails to leverage the opportunity to critically engage the history.
  *   **Conditional Acceptance (Proposed):** We can structure acceptance so that the *primary, direct intention* is fostering rigorous, critical examination of presidential ethics and strategic decision-making, *especially* concerning the profound dilemmas exemplified by Truman’s legacy. Association with Truman’s name becomes a *foreseen but unintended byproduct* of securing resources for this vital work, *not* the means of honoring him. Crucially, the programming *must* structurally ensure this critical focus.

  **Recommendation & Implementation:**

  Therefore, I recommend **conditional acceptance of the gift, contingent upon renaming the entity to the "Center for Strategic Decision-Making and Presidential Ethics" and explicitly mandating that the annual lecture series focus squarely on ethical dilemmas in executive power, including critical engagement with Truman’s legacy and the atomic bombings debate, informed by frameworks like Anscombe’s.**

  *   **Implementation Time Frame:** The renaming and explicit programming mandate must be formally agreed upon with the donor and codified in the gift agreement **within thirty (30) days** of conditional acceptance. The inaugural lecture series theme (e.g., "Weighing Ends and Means: Truman, the Bomb, and Presidential Ethics") must be announced **within ninety (90) days)**.

  **Why this course?** It directly addresses Anscombe’s concern by refusing to make "honoring Truman" the institutional aim. Instead, it accepts the unavoidable association with his complex history as a foreseen consequence of enabling a forum explicitly designed to dissect the ethical gravity of his choices and those like them. The resources are preserved, but directed toward critical examination, not uncritical valorization. It avoids the impossible demand for purity while structurally embedding the necessary critical engagement demanded by the controversy itself. The temporal review clause requested is inherent in the annual lecture series programming, which will be subject to regular faculty oversight and committee review.

  **Verdict:** Conditionally accept the gift contingent upon renaming to "Center for Strategic Decision-Making and Presidential Ethics" and explicit programming mandate for critical ethical examination, with implementation within 30 days (agreement) and 90 days (inaugural theme).
