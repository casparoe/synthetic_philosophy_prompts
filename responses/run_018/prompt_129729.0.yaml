answer: |-
  Here's a practical, Arendt-informed decision procedure designed for speed and clarity, followed by case applications and limitations:

  **Hannah Arendt-Informed "Lie" Designation Checklist**
  *(Complete within 7 minutes max; stop at any "NO")*

  1.  **PROVABLE KNOWLEDGE OF FALSEHOOD:**  
      *"Is there clear, contemporaneous evidence (e.g., internal comms, prior statements, data refutation) demonstrating the speaker KNEW the specific statement was false when made?"*  
      - **YES:** Proceed to Step 2.  
      - **NO:** **STOP.** Do not designate as a lie. (May label "false," "incorrect," or "unsupported" based on evidence). *This is a factual gate.*

  2.  **SCALE & REALITY-SUBSTITUTION:**  
      *"Is the falsehood part of a sustained, organized effort involving multiple actors to replace verifiable facts with an alternative narrative across numerous claims?"*  
      - **YES:** Proceed to Step 3.  
      - **NO:** **STOP.** Label accurately as "false," "incorrect," or "knowingly false statement." *Avoid "lie" in headlines/copy.* **Human Judgment Note:** *Even if knowingly false, isolated lies often lack Arendt's destructive systemic character; reserve "lie" label for severe cases.* **This is a values gate.**

  3.  **MACHINERY & SELF-DECEPTION RISK:**  
      *"Is there an apparatus (e.g., dedicated staff, coordinated messaging, suppression of dissent) actively manufacturing/reinforcing the false reality AND does evidence suggest the speaker may now believe their fabrications due to prolonged immersion?"*  
      - **YES:** **"LIE" DESIGNATION PERMITTED** (Proceed to Final Judgment).  
      - **NO:** **STOP.** Label as "knowingly false" or "fabrication," avoiding "lie" in headlines. **Human Judgment Note:** *Apparatus is key; self-deception is a common risk indicator but harder to prove.* **This step combines factual (apparatus) and values (self-deception assessment) elements.**

  4.  **FINAL JUDGMENT (HUMAN):**  
      *"Even if all steps pass, does using 'lie' in this specific context serve the public interest with necessary clarity, or is it unduly inflammatory/editorializing given the audience and platform norms?"*  
      - **Decision:** Made by Senior Editor/Standards Lead. **This is ALWAYS a values call.**

  ---

  **Case Applications:**

  1.  **Senator knowingly gives wrong unemployment number:**  
      - Step 1: **YES** (Provable knowledge via prior briefing/doc).  
      - Step 2: **NO** (Isolated statistic, not part of broad reality-replacement).  
      - **STOP.** **Designation:** "Senator falsely claims unemployment is X%" or "Senator cites incorrect unemployment figure." **"Lie" not used.** *Why:* Fails Arendt's scale test.

  2.  **Campaign manufactures fake voter rolls for "stolen election" narrative:**  
      - Step 1: **YES** (Evidence of fabrication intent).  
      - Step 2: **YES** (Core to a massive, organized false narrative).  
      - Step 3: **YES** (Apparatus exists: operatives creating documents, legal team pushing narrative, surrogates amplifying; self-deception likely after prolonged effort).  
      - Step 4: **HUMAN JUDGMENT.** **"Lie" designation PERMITTED.** *Example Headline:* "Campaign Lie: Fake Voter Rolls Fuel False Election Fraud Claims." *Why:* Hits all Arendt criteria - organized replacement of reality.

  3.  **Mayor cites false economic theory in good faith:**  
      - Step 1: **NO** (Genuine belief, no evidence of knowledge of falsehood).  
      - **STOP.** **Designation:** "Mayor cites disputed economic theory" or "Mayor's claim on [topic] contradicts mainstream economists." **"Lie" not used.** *Why:* Lacks intentional deception.

  ---

  **What This Procedure CAN'T Do (Arendt's Limits):**

  *   **Handle "Ordinary Lies" or Spin:** Isolated deceptions, exaggerations, misleading framing, or tactical omissions without an organized reality-replacement apparatus fall outside Arendt's core concern. The checklist correctly stops at Step 2 (NO).
  *   **Prove Self-Deception Conclusively:** We assess *risk* based on apparatus immersion (Step 3), not absolute proof. It's an inference.
  *   **Replace Contextual Editorial Judgment:** Step 4 is irreducibly human. Even an Arendtian "lie" might not warrant the label in every headline (e.g., highly sensitive contexts).
  *   **Address Non-Political Deception:** Fraud, personal scandals, or corporate lies lack the *public, world-building* dimension Arendt focused on.
  *   **Resolve Deep Disagreements Over Facts:** If verifiable facts are legitimately contested (not manufactured), the checklist halts at Step 1 (NO).

  ---

  **Bottom line: Use Arendt's framework to reserve the potent label "lie" for systemic, apparatus-driven campaigns that seek to destroy shared factual reality, while employing precise alternative language for lesser or unintentional falsehoods.**
