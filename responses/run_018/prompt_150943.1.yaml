answer: |-
  Here's the conceptual map you requested - phenomena, constraints, tensions, and model evaluations:

  **I. Core Phenomena to Explain**
  1. **Change Blindness** (Non-negotiable): Failure to detect significant visual changes if they occur during a disruption (saccade, blink, flicker). Shows conscious perception ≠ exhaustive detail recording.  
  2. **Refrigerator Light Problem** (Negotiable): Introspection always finds consciousness "on" when checked. Constraint: Must explain why we can't catch the *onset* of consciousness or its absence.  
  3. **Split-Brain Phenomena** (Non-negotiable): Hemispheres can independently process/perceive stimuli and generate conflicting verbal/non-verbal reports. Shows consciousness can be fragmented.  
  4. **Temporal Binding** (Non-negotiable): Discreet neural events (e.g., auditory/visual) are perceived as simultaneous despite processing delays (e.g., sound-vision sync). Conscious "now" isn't raw processing time.  
  5. **Discrete Processing vs. Continuous Present** (Non-negotiable): Neural processing is quantized (attentional blinks, microsaccades), yet experience feels seamless. Must resolve the "illusion" of continuity.

  **II. Essential Conceptual Distinctions (Non-Collapsible)**  
  1. **Access Consciousness (A-Cons) vs. Phenomenal Consciousness (P-Cons)**  
     - *A-Cons*: Information available for global control (reporting, reasoning).  
     - *P-Cons*: Subjective qualitative experience (e.g., redness of red).  
     - **Constraint**: A theory must explain why P-Cons *seems* irreducible to information access (e.g., philosophical zombies). Denying P-Cons requires explaining the persistent intuition.  
  2. **Being Wrong About World vs. Wrong About Experience**  
     - Mistaking a snake for rope (world error) vs. misreporting one's *pain intensity* despite feeling it (introspective error).  
     - **Constraint**: Must accommodate that we can be *incorrect* about our own phenomenology without it being a world-perception error. Denying this risks collapsing epistemology.  
  3. **Narrative Center of Gravity vs. Experiential Center**  
     - *Narrative*: Post-hoc story (e.g., "I decided to move") constructed from distributed processes.  
     - *Experiential*: The first-person locus of "hereness" and "nowness" (e.g., vision centered behind eyes).  
     - **Constraint**: Must explain why experience feels *centered* even if no "Cartesian theater" exists. Denying the feeling is empirically inadequate.

  **III. Joint Satisfiability Tension**  
  - **The Hard Tension**: Can you **deny a central observer** AND **explain why introspective gaps feel like missing *data* (phenomenology)** rather than merely missing *report*?  
    - *Why it bites*: If consciousness is distributed/processual (no theater), an introspective failure should feel like a cognitive limitation (like forgetting a fact), not like "there was an experience I *should* have had." Yet it often feels like the latter (e.g., anesthesia awareness errors).  
    - *Unsatisfiable Subset?*: **Potentially yes**: Denying central observer + Subjective "missing data" intuition + Irreducibility of P-Cons. Some theories (illusionism) bite the bullet, denying the intuition is valid; others (dual-aspect) preserve it but add ontological complexity.

  **IV. Model Scores Against Desiderata**  
  | **Phenomenon/Constraint**          | **Cartesian Theater Fails**              | **Multiple Drafts Model Fails**          |  
  |------------------------------------|------------------------------------------|------------------------------------------|  
  | Change Blindness                   | ❌ (Implies detailed stable display)     | ✅ (Explains via fragmentary drafts)     |  
  | Refrigerator Light Problem         | ❌ (Assumes continuous observer)         | ✅ (Consciousness only when probed)      |  
  | Split-Brain Cases                  | ❌ (Requires single observer)            | ✅ (Parallel drafts in hemispheres)      |  
  | Temporal Binding                   | ✅ (Central "showtime" sync)             | ✅ (Binding via draft competition)       |  
  | Continuous Present                 | ✅ (Implied by theater persistence)      | ✅ (Drafts create "specious present")    |  
  | A-Cons vs. P-Cons Distinction      | ❌ (Collapses P-Cons into display)       | ⚠️ (Tends to reduce P-Cons to access)    |  
  | Introspective Error Autonomy       | ⚠️ (Possible but awkward)                | ✅ (Reports are just more drafts)        |  
  | Experiential Center (vs. Narrative)| ✅ (Built into theater)                  | ❌ (Distributed drafts lack locus)       |  
  | **Introspective Gap as Missing Data** | ✅ (Gaps = unlit theater)               | ❌ (Gaps are failed report generation)   |  

  **Key Takeaway Tension**: Multiple Drafts excels at explaining fragmentation and probes, but **fails to capture the "missing phenomenology" intuition** (it dismisses it as illusory) and the **persistent sense of an experiential center**. The Cartesian Theater preserves these intuitions but fails spectacularly on empirical phenomena (split-brain, change blindness). The core challenge is reconciling the *felt unity and immediacy* of experience with its *distributed, constructed, and probe-dependent nature*.
