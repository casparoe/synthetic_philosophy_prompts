answer: |-
  Good morning everyone. It’s genuinely surreal to stand here—not just as someone who teaches about democratic innovations, but as one of the forty names drawn last week. I see neighbors worried this might be chaos, and scholars who could write dissertations on our process. So let’s start by naming the elephant in the room: **None of us were elected.** We don’t carry a mandate from the people of this town in the traditional sense. We aren’t here to *represent* specific neighborhoods or interests in the way your council members do. That might feel unsettling, even illegitimate, to some. But I’d argue that this very fact—our lack of a prior mandate—is precisely what makes this assembly a potential breakthrough for our stuck waterfront debate.

  Think about why we’re here. For years, the elected council, representing clear constituencies and viewpoints, has been deadlocked. Competing visions—environmental protection, economic development—became entrenched positions, defended fiercely because that’s what voters expected. That’s representative democracy working as designed, but sometimes that design hits a wall. How do you break that logjam?

  That’s where *this* design comes in. Random selection means something radical: **We represent nobody but ourselves, yet we are tasked with speaking for the possibility of common ground.** We weren’t picked because we campaigned, donated, or belong to a faction. We were picked because we are citizens, full stop. Our only "mandate" comes from the structure itself: to listen deeply, deliberate honestly, and wrestle collectively with the complex evidence on the waterfront’s future, free from the pressure of re-election or defending past slogans.

  Our lack of an electoral base is our strength. Because no one here needs to posture for voters back home, we might actually do what the council struggles with: **listen to the full complexity of the issue without an immediate political filter.** The environmental advocate in this room isn’t here to rally the green vote; they’re here to explain their values and listen to the economic realities. The business owner isn’t here to promise jobs at any cost; they’re here to articulate the opportunities and hear the ecological concerns. We are, in a real sense, forced to talk *to* each other, not past each other.

  This isn’t about being experts or professional politicians. It’s about being a microcosm of the community, given the time, resources, and facilitated space to do what busy citizens and pressured politicians often can’t: **delve deep, challenge our own assumptions, and look for solutions that might actually hold water for the whole town, not just one side.** The scholars here know this process, pioneered in places like Ireland and Belgium, creates conditions for what they call "public judgment" – not just pre-existing opinion, but considered opinion formed through shared learning and dialogue.

  To my neighbors: this isn’t handing power to unaccountable strangers. It’s creating a temporary, focused space where ordinary people, just like you, with diverse views, are empowered to cut through years of gridlock using reason and conversation. Your perspectives, shared through public submissions and evidence, will fuel our work. Our output won’t be law; it will be a carefully considered recommendation born of genuine struggle and compromise, offered back to the elected council and the town.

  To the scholars: we respect the precision of the model. We are a citizens' *assembly*, not representatives. Our legitimacy flows from the fairness of the lottery, the inclusivity of the process, the quality of the deliberation, and the transparency of our work – not from an illusion of electoral authorization.

  Our task is daunting. We inherit a conflict that has paralyzed decision-making. But we start with a unique advantage: **no one here ran for this seat promising to save the marshes or build the condos.** We are simply citizens, chosen by chance, tasked with one job: to find a way forward for our waterfront that is environmentally sound, economically viable, and, crucially, *acceptable* enough to break the deadlock. Let’s use this improbable, slightly surreal experiment not to replicate the old battles, but to forge a new path. I’m ready to get to work, and I know you are too. Let’s begin.
