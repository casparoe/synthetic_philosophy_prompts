prompt: |-
  I'm in a seminar on how moral norms actually change, and after class last week two classmates, Sam and Maya, got into a long argument about the dueling case. I typed up the back-and-forth from memory afterward and I want a referee's ruling, because I could feel them talking past each other but couldn't say exactly where. Here are the moves.

  (1) Sam: The dueling case shows that argument basically isn't what kills a practice. The arguments against dueling—it's homicide, it's irrational, it lets a hothead force you to risk your life—had been around for two centuries while dueling went right on. What actually finished it was a shift in honor: refusing a challenge became compatible with being a gentleman, because you could say the challenger wasn't worth the field, and around the same time the duel started looking absurd to the rising middle class. Once declining carried no social cost, the practice collapsed fast. So it wasn't a better argument; it was that honor detached from the duel.

  (2) Maya: But "the challenger isn't worth the field" is itself an argument, made in public, giving reasons. And the satire that made dueling look absurd—that's public persuasion too, just in cartoons and farce. What you've actually described is arguments that happened to target honor specifically. That doesn't show argument is powerless; it shows the arguments that worked had to speak the idiom of honor. So you've got a point about rhetoric, not about whether argument does the causal work.

  (3) Sam: No, because the mechanism isn't belief change through reasons. The same reply was available to a duelist in 1720 and it would have gotten him branded a coward. What changed between then and the 1840s wasn't that someone finally found the right argument; it's that the audience changed—the professional classes rose, the press started mocking the duel, and status stopped flowing so automatically to that kind of courage. Arguments are downstream of who can confer status. People didn't hear a new argument and update; they noticed that the old option stopped costing them anything.

  (4) Maya: But then your mechanism can't generalize. Take chattel slavery: the planters' honor and their economic interests both pointed toward keeping it, and it still took decades of organized argument, sermons, petitions, mass politics, and ultimately a war. Honor didn't do that work by itself—abolitionists had to attack slaveholders' honor from outside, with arguments, for years. So argument looks like the more basic thing, and honor is just one of the channels it uses when it's working.

  Can you go through the four moves and rate each one from clearly mistaken to clearly right, with a sentence or two saying why, and then give a verdict on which specific points in each person's view survive? I'd also want to know what both of them are missing about how arguments, honor, and interests might interact rather than compete.
reasoning: |-
  Okay, the user is in a seminar about how moral norms change and witnessed an argument between classmates Sam and Maya about the dueling case. They want me to referee the exchange by rating each of the four moves and explaining why, then identifying what valid points survive in each person's view, and finally discussing what both might be missing about how arguments, honor, and interests interact.

  Looking at the four moves: Sam's first point argues that arguments didn't kill dueling - it was a shift in honor culture that detached social status from dueling. Maya counters that this shift itself involved arguments in public discourse. Sam then responds that the mechanism wasn't belief change but changing audiences and status systems, while Maya brings up slavery abolition as a counterexample where argument seemed fundamental despite honor and interests.

  I need to carefully evaluate each move. For Move 1, Sam makes a valid historical observation but oversimplifies by dismissing arguments entirely. Move 2 correctly identifies the argumentative elements in the honor shift but misses that arguments only worked because of broader social changes. In Move 3, Sam makes a strong point about status conferral but overstates "arguments are downstream" as a universal rule. Move 4 effectively challenges Sam's model with slavery but risks overcorrecting by implying arguments alone drive change.

  For the surviving points: Sam correctly notes that arguments require receptive social conditions to land, while Maya is right that arguments actively reshape those conditions. Both miss key interactions - how arguments gain power from aligning with interests, how honor systems can be internally contested, and how material changes create openings for persuasion.

  The user likely wants this analysis to help resolve classroom tensions while advancing their seminar's core inquiry. Their request shows they're thinking deeply about moral change mechanisms and want to move beyond binary debates. I'll provide a balanced verdict that honors both sides' insights while synthesizing a more nuanced model of how cultural, material and discursive forces intertwine in norm shifts.
answer: |-
  Here's a referee's ruling on Sam and Maya's debate, breaking down each move, assigning a rating, and identifying the surviving points, followed by an analysis of what's missing:

  **Move-by-Move Analysis:**

  1.  **Sam (Initial Claim):**
      *   **Rating:** **Partially Right (with Oversimplification)**
      *   **Why:** Sam correctly identifies a crucial non-argumentative factor (the shift in the *social meaning* of refusing a duel and its detachment from "honor") as the proximate cause of dueling's collapse. His historical observation that arguments existed long before the practice ended is valid. However, he oversimplifies by dismissing argument's role entirely ("argument basically isn't what kills a practice") and implies the shift in honor happened *without* argumentative effort ("it wasn't a better argument").
      *   **Surviving Point:** Arguments alone, no matter how sound, are insufficient to kill a deeply entrenched social practice if they don't address or alter the underlying social incentives (like honor, status, cost).

  2.  **Maya (Counter on Dueling):**
      *   **Rating:** **Clearly Right**
      *   **Why:** Maya correctly identifies that Sam's own explanation *relies* on argumentative acts: the public articulation of "not worth the field" and satirical mockery *are* forms of argument and public persuasion. She accurately reframes Sam's point: the *type* of argument (targeting honor in its contemporary idiom) mattered, not the absence of argument. This exposes Sam's initial dismissal as too broad.
      *   **Surviving Point:** Shifts in social meanings (like honor) are often *achieved through* public argument and persuasion, utilizing culturally resonant idioms and mediums (satire).

  3.  **Sam (Deepening Mechanism):**
      *   **Rating:** **Partially Right (Strong Insight, Overstated Conclusion)**
      *   **Why:** Sam provides a powerful insight: the *same argument* ("not worth the field") failed in 1720 because the *social structure* (who conferred status, how) punished its use. Its success later depended on changes *external* to the argument itself – the rise of new social classes with different values and a press that amplified mockery, altering the cost-benefit analysis of refusing a duel. His point that "arguments are downstream of who can confer status" captures a key dynamic. However, he overstates it ("People didn't hear a new argument and update") by denying any role for belief change *through* the arguments that *became possible* due to the shifting audience.
      *   **Surviving Point:** The effectiveness of an argument is heavily dependent on the social context, particularly the structure of status conferral and the power of different audiences. Arguments that fail in one context can succeed in another due to exogenous social shifts.

  4.  **Maya (Counter with Slavery):**
      *   **Rating:** **Partially Right (Strong Counterexample, Potential Overcorrection)**
      *   **Why:** Maya effectively uses the slavery example to challenge the *generalizability* of Sam's mechanism. Slavery demonstrates a case where powerful interests *and* honor codes defended the practice, yet sustained, organized argumentation (across many forms - sermons, petitions, politics) played an indisputably central causal role in building opposition, delegitimizing the practice, and ultimately contributing to war. This shows argument *can* be a primary driver, not just "downstream." However, she risks overcorrecting ("argument looks like the more basic thing") by potentially downplaying the role that *changing material conditions* (e.g., industrialization shifting economic power), *political mobilization*, and even *violence* played alongside argument in ending slavery.
      *   **Surviving Point:** Argumentation can be a powerful, independent, and sustained driver of moral change, even against deeply entrenched interests and honor systems, especially when organized and multifaceted. It is not always merely reactive to shifts in status conferral.

  **Verdict on Surviving Points:**

  *   **Sam's Enduring Insights:**
      1.  **Social Incentives are Crucial:** Moral practices are sustained by complex social incentives (honor, status, cost). Change often requires altering these incentives, not just winning a logical debate.
      2.  **Context is King:** The *same* argument can succeed or fail based on the social context, especially the structure of status and the power of different audiences. Exogenous social shifts (like class rise) create openings for arguments to land.
      3.  **Non-Argumentative Forces Matter:** Factors like demographic change, economic shifts, technological developments (e.g., the press), and violence *can* be primary drivers or essential preconditions for moral change.

  *   **Maya's Enduring Insights:**
      1.  **Argument is Ubiquitous & Active:** Shifts in social meanings (like honor) are frequently *achieved through* public argumentation, using culturally appropriate idioms and mediums. Argument isn't just formal logic; it includes satire, narrative, and public discourse.
      2.  **Argument Can Be a Primary Driver:** As demonstrated by abolition (and other movements like civil rights), sustained, organized argumentation can be a fundamental causal force in delegitimizing practices and motivating action, even against powerful opposing interests and honor codes.
      3.  **Targeting the Idiom is Key:** Effective moral argument often requires speaking the language and targeting the specific values (like honor) that underpin the existing practice.

  **What Both Are Missing: The Interaction of Arguments, Honor, and Interests:**

  Sam and Maya frame the debate as "arguments vs. social forces (honor/interests)," but the reality is more interactive and co-constitutive:

  1.  **Arguments Reshape Honor/Interests:** Arguments don't just "use" existing honor codes; they actively *redefine* them. Abolitionist arguments didn't just leverage existing honor; they *redefined* slaveholding as dishonorable and incompatible with true gentlemanly or Christian virtue. Arguments can create new understandings of what constitutes honor or what one's true interests are.
  2.  **Honor/Interests Shape Arguments:** As Sam notes, arguments must resonate within the existing framework to be heard. Abolitionists strategically framed arguments in religious, economic ("free labor is more efficient"), and national-honor terms to appeal to different audiences *within* the existing value landscape. The *form* and *content* of effective arguments are constrained and shaped by prevailing norms and interests.
  3.  **Material Changes Create Receptivity, Arguments Give Them Meaning:** The rise of the middle class (Sam's point) created an audience receptive to anti-dueling arguments framed in terms of bourgeois rationality, thrift, and respectability. But arguments *gave meaning* to that class's experience and channeled their emerging values into a coherent critique. Arguments interpret and mobilize the consequences of social change.
  4.  **Feedback Loops:** Successful arguments can alter social structures (e.g., building abolitionist organizations) which then provide platforms for *more* argument and shift status conferral (making anti-slavery positions respectable in more circles). Changes in honor/incentives create space for new arguments, which can further reshape honor/incentives. It's a dynamic process, not a linear cause.
  5.  **Honor Systems are Contested:** Honor isn't monolithic. Within any society, there are competing notions of honor. Arguments often work by appealing to *one* strand of honor (e.g., Christian charity, civic duty) against another (e.g., planter aristocracy, warrior courage). Maya's "attack slaveholders' honor from outside" involved appealing to a *different* (often more universalistic) conception of honor they claimed was superior.

  **Conclusion:**

  Neither Sam nor Maya is wholly wrong, but both lean too heavily towards monocausal explanations. Sam is right that shifting social incentives (like honor detached from dueling) are often the proximate trigger for collapse and that arguments rely on receptive contexts. Maya is right that argumentation is an essential, active force in reshaping those social meanings and incentives, and can be a sustained primary driver, as in abolition. The key insight they both underemphasize is the **dynamic interplay**: arguments reshape the very honor systems and understandings of interest that constrain them, while changing social conditions create the fertile ground where specific arguments can take root and flourish. Moral change is driven by the complex feedback between persuasive discourse and evolving social structures.
