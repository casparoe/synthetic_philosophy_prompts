prompt: |-
  I am designing a single ninety-minute seminar for third-year philosophy undergraduates who have completed an introductory course in philosophy of language but have not yet encountered Putnam's Twin Earth reasoning in any formal setting. Rather than walking them through the familiar Oscar-and-twin-Oscar water-versus-XYZ narrative, I want the session built around the historical case of jade—specifically the fact that what was long treated as one substance was later shown to comprise two chemically distinct minerals, jadeite and nephrite, with nearly identical superficial properties but different molecular structures. The pedagogical aim is to use this case to motivate semantic externalism: to ask whether two speakers in 1700 and 1950, sharing every internal mental state, nevertheless mean different things by "jade" because their respective environments embed different chemical kinds.

  Plan the explanatory arc for me, not the explanation itself. First, identify the conceptual dependency that must be secured before Twin Earth reasoning can begin—presumably the internalist thesis that mental representation alone fixes reference needs to be articulated as an explicit target rather than a background assumption—and explain why the jade example serves this purpose better than the water example, including what it must contain (for instance, shared ignorance of chemistry among the speakers) and what it must deliberately lack (such as immediate perceptual access to the chemical distinction). Second, map the misconceptions students will form in sequence: I anticipate an initial slide toward the view that meanings are fixed entirely by scientific authority rather than by environmental causation, followed by a conflation of externalism with the claim that individuals have no cognitive access to their own concepts, and perhaps a third confusion that treats the thought experiment as an empirical discovery about geology rather than a modal argument about reference. For each, specify the precise point in the sequence where it should be intercepted and how. Third, propose a concluding check—one question I can pose at the end—that distinguishes a student who genuinely grasps that reference is environmentally mediated from one who has merely memorized the slogan that meanings are not in the head. Finally, state explicitly what should be left out at this level—such as Putnam's division of linguistic labor, Burge's arthritis case, or the technical debate over narrow versus wide content—and justify the omission in a way that does not make externalism appear arbitrarily truncated.
reasoning: |-
  Okay, the user is designing a seminar for third-year philosophy students about semantic externalism using the jade example instead of the typical Twin Earth scenario. I need to help plan the explanatory arc without getting into the details of the explanation itself. 

  First, the user wants to know the conceptual dependency before introducing Twin Earth reasoning. That's probably the internalist thesis that meaning is determined solely by mental states. The jade case is better than water here because in the water example, students might think the chemical difference is obvious, but with jade, both historical speakers were equally ignorant of the chemistry. That shared ignorance highlights that the environment, not their knowledge, determines reference. I should emphasize that the speakers in 1700 and 1950 have identical mental states but different references due to the external facts about minerals. The example must avoid any perception of the chemical distinction to prevent students from thinking awareness matters.

  Next, mapping student misconceptions. The first one is likely that scientific authority fixes meaning, not environmental causation. This might come up when discussing the 1950 speaker. I need to intercept this by stressing that the environment caused the reference shift, not scientific decree. The second confusion is conflating externalism with no cognitive access to concepts. When explaining that speakers don't know the chemical makeup, students might think they can't grasp their own concepts. I have to clarify that they understand "jade" via its superficial properties, but the extension is different externally. The third misconception is seeing this as a geological discovery rather than a modal argument. This could arise when discussing the mineral differences. I need to refocus on counterfactual cases, like what if nephrite didn't exist, to show it's about necessity, not actual geology.

  For the concluding check, a good question would involve a counterfactual where the minerals are switched. If students say the reference changes with the environment, they get it. If they focus on beliefs or descriptions, they're stuck in internalism. That should test genuine understanding.

  Finally, omissions. The division of linguistic labor, Burge's arthritis case, and narrow vs. wide content should be left out. Including them could overwhelm students or muddy the core point about environmental causation. The seminar should stay focused on motivating externalism simply, without advanced complications. Justifying this as maintaining a clear, foundational argument keeps it from seeming arbitrarily truncated.

  I should ensure the structure flows logically: set up internalism, use jade to challenge it, tackle misconceptions step-by-step, and end with a solid grasp of environmental mediation. Keeping it tight and focused will help students build a strong base without confusion.
answer: |-
  Here’s a structured plan for your seminar’s explanatory arc, designed to leverage the jade case while preempting common misconceptions:

  ---

  ### **I. Foundational Conceptual Dependency: Establishing the Internalist Target**
  **Why this must come first:**  
  Externalism is a critique of *internalism* (the thesis that meaning/reference is fixed solely by intrinsic mental states). Students must explicitly recognize internalism as the default position being challenged.  

  **Why jade > water for this purpose:**  
  - **Shared ignorance**: Both 1700 and 1950 speakers lack knowledge of jade’s dual mineralogy. This neutralizes the "expert deference" intuition (a distraction in early water examples).  
  - **Identical phenomenology**: Jadeite/nephrite are perceptually indistinguishable, blocking the objection that "if they looked closer, they’d know."  
  - **Must emphasize**: The speakers (1700/1950) share all *non-factive* mental states (beliefs, intentions, perceptual experiences).  
  - **Must exclude**: Any suggestion that chemical differences are *discoverable by unaided senses*.  

  **Pedagogical hook:**  
  *Question to pose:* "If two speakers across time have identical mental images, beliefs, and diagnostic tests for ‘jade,’ does their word refer to the same thing?"  

  ---

  ### **II. Sequence of Misconceptions & Interception Points**
  | **Misconception**                          | **Likely Origin Point**                        | **Interception Strategy**                                                                 |
  |--------------------------------------------|------------------------------------------------|-------------------------------------------------------------------------------------------|
  | **1. Scientific authority fixes reference** | When revealing jade’s 1950 reclassification | *Reframe the question:* "Did scientists *change* the meaning of ‘jade,’ or did they *discover* that the world contained two kinds? What determines reference *before* scientific intervention?" |
  | **2. Externalism → no cognitive access**   | During discussion of speaker ignorance       | *Clarify:* "Externalism doesn’t deny speakers understand *how they identify* jade (e.g., ‘green, hard stone’). It denies that identification *methods* fix reference. The *extension* is world-dependent." |
  | **3. Empirical ≠ modal reasoning**         | When detailing jadeite/nephrite properties   | *Shift to counterfactuals:* "Imagine a world where nephrite never existed. Would 1700 ‘jade’ still refer to jadeite? What *makes* this a question about meaning, not geology?" |

  ---

  ### **III. Concluding Check for Genuine Grasp**
  **Diagnostic Question:**  
  *"In 1700, if a speaker said ‘Jade cannot be found in Europe,’ were they claiming that jadeite cannot be found in Europe, that nephrite cannot be found, or both? Does your answer depend on their knowledge, or on the actual minerals in their environment?"*  

  **Why this works:**  
  - A student who **grasps externalism** will note: The 1700 speaker’s term referred to *all local samples* (nephrite/jadeite), so their statement is false if either mineral exists in Europe – *regardless of their beliefs*.  
  - A student **memorizing slogans** will conflate meaning with speaker beliefs (e.g., "They meant whatever they *thought* jade was") or scientific categories ("They meant nephrite because that’s the ‘real’ jade").  

  ---

  ### **IV. Strategic Omissions & Justification**  
  | **Omission**               | **Justification**                                                                                               |
  |-----------------------------|-----------------------------------------------------------------------------------------------------------------|
  | **Division of linguistic labor** | Introduces *social* externalism prematurely. The jade case isolates *environmental* causation. "Today’s goal is to see how the *physical world* constrains reference, even prior to scientific communities." |
  | **Burge’s arthritis case**  | Focuses on *social* norms and expert deference, not brute environmental kinds. "We’re examining how *natural kinds* in one’s environment fix reference, not how communities correct individual misunderstandings." |
  | **Narrow vs. wide content** | A technical refinement requiring deeper metaphysics. "This debate presupposes externalism’s core insight. Today we establish that insight: meanings depend partly on external facts." |

  ---

  ### **Core Arc Summary**
  1. **Establish internalism** as the target (mental states fix reference).  
  2. **Introduce jade case**: Identical mental states + environmental difference → reference shift.  
  3. **Defuse misconceptions** at critical junctures (authority/access/empiricism).  
  4. **Conclude** with a counterfactual test confirming environmental determination.  

  This structure isolates Putnam’s environmental thesis without overloading students, using jade’s empirical complexity to make internalism’s failure more intuitive than with water. By omitting social externalism, you avoid conflation and show externalism’s minimal, non-arbitrary core: **the world itself contributes to meaning**.
