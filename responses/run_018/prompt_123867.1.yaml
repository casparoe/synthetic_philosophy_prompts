answer: |-
  You've hit the nail on the head on several key points – the deadlock stems from fundamental disagreements about concepts like liability, authority transfer, and the very level of analysis. Here's a breakdown of the structure and why it's stuck:

  1.  **The Core Disagreement: Liability vs. Role-Based Privilege:**
      *   **Revisionists (McMahan):** Focus overwhelmingly on **individual moral liability.** Unjust combatants are *morally liable* to defensive harm because they pose an unjust threat. Killing them is permissible (for just combatants) because it is necessary to stop their wrongful aggression. Conversely, just combatants are *not* morally liable to defensive harm (unless they commit war crimes), so unjust combatants killing them is morally wrong – akin to murder in many cases. State authorization doesn't magically erase this underlying moral reality.
      *   **Traditionalists (Walzer):** Focus on the **institutional role and reciprocal risk** inherent in war. Soldiers, *as soldiers*, are granted a special legal and moral privilege to kill enemy combatants, regardless of the justice of their cause. This privilege flows from the recognition that both sides are agents of their state, operating under orders, and placed in a situation of mutual threat. Their liability stems not from individual culpability for the war, but from their status as combatants actively participating in hostilities. The "moral equality" is an equality of *permission* derived from their shared role.

  2.  **The Level of Analysis Problem (Institutional vs. Personal):**
      *   **Walzer:** Is primarily concerned with the *laws and conventions of war* as a social institution. His goal is establishing rules that can be followed *in practice* by soldiers and states to limit the horrors of war, even amidst deep moral disagreement about the war's justice. The "moral equality of combatants" is a *constitutive rule* of this institution, necessary for reciprocity and restraint (e.g., POW status).
      *   **McMahan & Revisionists:** Are primarily concerned with *fundamental, individual morality*. They ask: "What is the morally right or wrong thing for this individual to do, all things considered?" They see Walzer's institutional rules as potentially necessary pragmatism, but not as reflecting the deeper moral truth. They argue that institutional rules must ultimately be grounded in individual morality, not override it entirely.
      *   **"Combatant" Doing Double Duty:** Absolutely. Walzer uses "combatant" primarily as a *legal-functional category* defining who is a permissible target and who bears the privilege/responsibility of combat. Revisionists often use "combatant" more as a *moral category*, asking whether the individual *deserves* to be targeted or *has the right* to target others based on their actions and the war's justice.

  3.  **The Hidden Assumption: Can States Transfer Moral Authority?**
      *   This is crucial. Walzer (and the Just War tradition he builds on) implicitly assumes that the state's *legitimate authority* (if it has it) transfers *downwards*, granting individual soldiers a derivative moral permission to fight, even if the war is unjust *provided they fight justly*. Soldiers are instruments of the state's will.
      *   Revisionists fundamentally reject this transfer. McMahan argues that states cannot grant their soldiers moral permission to do what would be morally impermissible for them to do as private individuals (i.e., kill people who pose no unjust threat). State authorization might provide *legal* permission or mitigate *culpability*, but it doesn't create *moral* permission to kill the innocent (which just combatants, on his view, are not).

  4.  **Your Asymmetry Proposal (Justified vs. Excused):**
      *   This is a sophisticated and increasingly discussed move (e.g., by philosophers like Jeff McMahan himself, David Rodin, Helen Frowe, and others). It attempts to reconcile the intuition that unjust combatants aren't simply murderers *in the same way* as common criminals with the revisionist claim that their killing isn't *justified*.
      *   **Structure:**
          *   **Just Combatants:** Their killing is **justified**. It is the morally right thing to do in defense of themselves, their comrades, and their just cause. They act permissibly.
          *   **Unjust Combatants:** Their killing is **unjustified** – it's the *wrong* thing to do. However, they might be **excused** or have **mitigated culpability** due to factors like:
              *   **Epistemic Limitations:** They may sincerely believe their cause is just (due to state propaganda, lack of information).
              *   **Coercion/Duress:** Threats of punishment, social pressure, indoctrination.
              *   **Role Obligations:** Sense of duty to obey orders and comrades.
          *   **Self-Defense:** The asymmetry applies here too. A just combatant killing an unjust one is justified defense against an unjust threat. An unjust combatant killing a just one *might* be *excused* self-defense (if they genuinely fear for their life and believe they are in the right), but it's not *justified* because they are defending themselves against a *justified* threat (the just combatant defending themselves/others).
      *   **Does it Break the Deadlock?**
          *   **Potentially, Partially:** It offers a more nuanced picture than the stark "murderer" label. It explains why we might treat unjust combatants humanely as POWs (they aren't full moral monsters) while still maintaining that their acts are objectively wrong. It preserves the deep moral asymmetry.
          *   **Likely Not Fully:** Critics (often from the Walzerian side) argue:
              *   **Institutional Chaos:** Making the privilege to kill contingent on the *justice of the war* (which is often highly contested *during* the war) destroys the reciprocity needed for the laws of war to function. Soldiers need clear rules.
              *   **Pragmatic Unworkability:** How do soldiers *know* if their war is just? How do they apply this distinction in the fog of war?
              *   **Liability Sticking Point:** Revisionists might argue that mere *excuse* doesn't resolve the core issue of *liability*. If the unjust combatant poses an *objectively unjust threat*, even if excused, why isn't killing them permissible? An excused attacker can still be justifiably stopped with lethal force by their victim. The revisionist focus remains on the *objective threat*, not the attacker's blameworthiness. The "excused but liable" status doesn't feel like a stable moral category for many.
              *   **Walzerians:** They might see "excuse" as implicitly confirming the *institutional* equality – the unjust soldier is excused *for acting as a soldier*, which implies the role itself carries a presumption of permissibility within the institution of war.

  **What Kind of Argument Could Move Things?**

  The deadlock persists because the sides prioritize fundamentally different things and start from incompatible premises. Moving forward likely requires:

  1.  **Explicitly Framing the Levels:** Discussions need constant clarification: "Are we talking about the *institutional rules* necessary for regulating warfare, or are we talking about *fundamental individual morality* in the context of war?" Recognizing they answer different questions is vital.
  2.  **Engaging the Authority Transfer Question Directly:** Deeper philosophical work on political authority, legitimacy, and the moral delegation of lethal force is needed. Can a state *ever* morally authorize an individual to kill in an unjust cause? Under what conditions? This requires delving into political philosophy.
  3.  **Focusing on "Roles" vs. "Individuals":** A robust defense of the *moral significance* of institutional roles (like soldier) within specific contexts (like war) is needed to counter the revisionist focus on abstract individualism. What does it *mean* to be a combatant, morally speaking?
  4.  **Consequences & Pragmatics:** Serious engagement with the *practical consequences* of adopting revisionism. If the laws of war collapsed due to lack of reciprocity, would the world be more or less just? Does Walzer's model, despite its moral fictions, actually save lives and limit suffering better than a theoretically purer model?
  5.  **Refining the Excuse Approach:** Developing a more robust account of how excuse functions in war, its limits, and its practical implications for liability and rules of engagement. Can it provide a viable middle ground that satisfies concerns about both deep morality and practical regulation?

  **Conclusion:**

  You've identified the core tensions brilliantly. The deadlock arises from a clash between a role-based, institutional approach prioritizing manageable rules and reciprocity (Walzer) and an individualist, liability-based approach prioritizing fundamental moral truth (McMahan). The disagreement is indeed about liability *and* the transferability of state authority *and* the level of analysis. Your asymmetry proposal (justified vs. excused) is a significant attempt to soften the revisionist stance and inject nuance. While it offers valuable insights and captures important intuitions, it's unlikely to fully resolve the deadlock because it doesn't fundamentally bridge the gap between the institutional and deep moral perspectives, nor does it fully satisfy revisionist concerns about liability during combat. Progress likely requires tackling the foundational questions about political authority and the moral weight of institutional roles head-on, while rigorously analyzing the practical consequences of each theory.
