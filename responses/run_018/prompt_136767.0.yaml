  ### Diagnostic Taxonomy: Kuhnian Paradigm Shifts and Incommensurability

  **Root Commitment:** Scientific change is not purely cumulative; there are episodes where core theoretical terms, evaluation standards, and ontological commitments shift together in ways that resist simple translation or reduction.

  **Branch 1: Scope of Incommensurability**  
  *Claim: When a scientific revolution occurs, the resulting incommensurability primarily affects...*  
  - **A. Local clusters of interdefined terms** (e.g., shifts in "mass" between Newtonian and relativistic physics).  
  - **B. The entire disciplinary matrix** (e.g., holistic changes across theory, instrumentation, and goals in the transition from alchemy to chemistry).  

  ---

  #### Path A: Local Incommensurability
  **Branch 2: Primary Discontinuity**  
  *Claim: In localized cases, the barrier to translation arises chiefly from shifts in...*  
  - **A1. Semantic content** (meaning and reference of key terms diverge, e.g., "element" in phlogiston vs. oxygen theories).  
  - **A2. Ontological commitments** (the fundamental entities or structures change, e.g., caloric fluid vs. kinetic energy).  
  - **A3. Methodological standards** (criteria for explanation/confirmation diverge, e.g., vital forces vs. biochemical mechanisms in early biology).  

  **Branch 3: Rational Comparison Viability**  
  *Claim: Despite localized shifts, practitioners can still compare paradigms using shared criteria like prediction, problem-solving, or simplicity.*  
  - **A1/A2/A3-Y. Yes** (e.g., Newtonian and Einsteinian physics remain comparable via shared mathematical structures).  
  - **A1/A2/A3-N. No** (e.g., competing definitions of "gene" in genomics resist neutral arbitration, relying on contextual utility).  

  **Branch 4: Relativism Implication**  
  *Claim: Local incommensurability entails that truth is paradigm-relative.*  
  - **A-Y/Y. No** (truth remains objective; schemes approximate reality differently—e.g., structural realism).  
  - **A-Y/N. Yes** (truth is paradigm-bound—e.g., framework-dependent instrumentalism).  
  - **A-N/Y. Unstable** (rational comparison fails yet truth is absolute? Rarely coherent).  
  - **A-N/N. Yes** (truth is paradigm-bound, resolved by pragmatic adoption—e.g., postmodern interpretations).  

  **Leaves for Path A:**  
  1. **A1-Y/Y: Local Semantic Incommensurability with Retained Rational Comparison** (e.g., Hacking; unnamed). Diagnosis: Retains realism via reference stability.  
  2. **A2-Y/Y: Local Ontological Incommensurability with Realist Approximation** (e.g., Psillos' selective realism). Diagnosis: Stable and attractive.  
  3. **A3-Y/Y: Local Methodological Instrumentalism** (unnamed). Diagnosis: Coherent but neglects ontological depth.  
  4. **A1-N/N: Semantic Relativism via Pragmatism** (e.g., Rorty-inspired views). Diagnosis: Sociologically grounded.  
  5. **A2-N/N: Local Ontological Relativism** (unnamed). Diagnosis: Unattractive due to weak realism.  
  6. **A3-N/N: Methodological Pluralism without Truth Claims** (e.g., Feyerabend’s early work). Diagnosis: Deliberately anti-dogmatic.  

  ---

  #### Path B: Global Incommensurability
  **Branch 2: Primary Discontinuity**  
  *Claim: In holistic revolutions, the deepest rupture occurs in...*  
  - **B1. Semantic frameworks** (e.g., "space/time" in Aristotelian vs. Galilean physics).  
  - **B2. Ontological foundations** (e.g., ether vs. spacetime in 19th-century physics).  
  - **B3. Methodological norms** (e.g., qualitative teleology vs. quantitative laws in biology).  

  **Branch 3: Rational Comparison Viability**  
  *Claim: Cross-paradigm evaluation using criteria like accuracy or coherence remains feasible.*  
  - **B1/B2/B3-Y. Yes** (e.g., Lakatos' research programs allow retrospective appraisal).  
  - **B1/B2/B3-N. No** (e.g., paradigm choice hinges on sociological factors—e.g., Kuhn’s later work).  

  **Branch 4: Niche Distinction (Computational Arbitration)**  
  *Claim: Modern data-driven simulations (e.g., climate modeling or particle physics) provide paradigm-neutral arbitration.*  
  - **B-Y/I. Independent** (e.g., they supply objective benchmarks across paradigms).  
  - **B-Y/E. Embedded** (e.g., ML algorithms encode paradigm-specific biases in training data).  

  **Branch 5: Relativism Implication**  
  *Claim: Global incommensurability implies truth is paradigm-relative.*  
  - **B-Y. No** (convergent realism: e.g., Popper’s verisimilitude).  
  - **B-N. Yes** (e.g., Kuhn’s "world-change" thesis).  

  **Leaves for Path B:**  
  7. **B1-Y/I/Y: Global Semantic Rationalism with Computational Objectivity** (unnamed). Diagnosis: Emerging position in data-intensive science.  
  8. **B2-Y/E/Y: Global Ontological Realism with Embedded Methods** (e.g., Giere’s perspectivism). Diagnosis: Computationally informed but neglected.  
  9. **B3-N/N: Global Methodological Relativism Resolved Sociologically** (e.g., Strong Programme SSK). Diagnosis: Explicitly non-cognitive.  
  10. **B3-Y/E/N: Unstable Hybrid** (methods embedded yet rational comparison viable? Incoherent without ad hoc constraints).  

  ---

  ### Overlapping Leaves & Annotations
  - **A3-Y/Y vs. B3-Y/E/Y**: Both endorse methodological plurality but diverge on scope. Overlap is substantive: local cases retain rationalism; global cases require computational humility.  
  - **Gaps**:  
    - **A3-N/Y**: Local methodological shifts without rational comparison but absolute truth. Diagnosis: Incoherent (no comparison mechanism for truth).  
    - **B1-N/N**: Global semantic incommensurability resolved sociologically without relativism. Diagnosis: Unattractive (truth detached from social processes).  

  ### Design Notes
  - **Diagnostic Focus**: Nodes frame commitments as concrete judgments (e.g., "Data-driven models escape paradigm bias" tests computational neutrality).  
  - **Niche Integration**: Forces positions like structural realism (B2-Y/Y) to confront if simulations are theory-laden.  
  - **Efficiency**: 7 branch points (Scope → Discontinuity → Rational Comparison → [Niche] → Relativism) generate 10 leaves, covering core debates without bibliographic appeals.
