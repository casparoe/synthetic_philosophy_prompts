is of whether the gap reflects incoherence, unattractiveness, or mere neglect. To keep the instrument genuinely diagnostic rather than a label-matching exercise, phrase every node as a substantive claim or concrete case judgment that a respondent could endorse without knowing which interpretation it corresponds to. The tree should contain about seven branch points and eight to ten leaves. Inject one niche distinction—specifically, whether contemporary practices of large-scale computational simulation and data-driven model selection function as a paradigm-independent arbitration mechanism, or whether they are themselves embedded within and shaped by the very paradigms they purport to evaluate—so that standard positions must reveal commitments they rarely make explicit. Finally, flag any pair of leaves that the tree's branching logic cannot genuinely separate, explaining whether the overlap is merely verbal or substantive, and ensure that no branch asks for a bibliography, citation, or identification of a specific author or text.
