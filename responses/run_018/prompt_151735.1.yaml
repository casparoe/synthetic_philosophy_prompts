prompt: |-
  You are a professional philosopher with expertise in moral philosophy, institutional ethics, and the history of normative change. Before you answer, please take a few minutes to brainstorm the relevant conceptual distinctions, map out hidden assumptions, and proceed step by step.

  As a software engineer with no formal philosophy background, I have observed a recurring pattern in open-source software governance that strikes me as conceptually puzzling. Nearly every major project now publishes a formal Code of Conduct that defines prohibited behavior in explicit, rule-like terms. Yet actual enforcement almost never relies on legal sanctions or financial penalties; instead, violations are handled through public call-outs, maintainer ostracism, and loss of reputation within the contributor network. The labor that sustains these projects is largely unpaid and motivated by peer recognition and social standing. So the formal architecture looks legalistic and rational, but the operating system is prestige-based and social.

  When controversies do arise, participants often justify positions by appealing to abstract moral principles—claims about fairness or harm to the community—as if rational argument alone could settle the matter. At the same time, the practical outcome almost always tracks shifts in who is considered honorable or shameful within the community, not shifts in anyone's explicit beliefs.

  This leads me to ask: what philosophical commitments about how moral norms actually change does this institutional design presuppose? Does it require the view that norms shift primarily through rational argument and principle, through material interest and labor incentives, or through dynamics of honor and shame—similar to accounts of moral revolutions that ask whether practices like dueling or slavery ended mainly because people were persuaded they were wrong, or because they became socially dishonorable?

  Please reconstruct the implicit theory of moral change embedded in this practice. Be precise about what the practice strictly presupposes versus what it merely accommodates, and point out any internal tensions—such as appealing to rational justification in public rhetoric while relying on prestige-based enforcement in practice. Also note where the design is philosophically underdetermined, so that rival theories could license the same institutional form.

  Write your response in American English. Be careful and precise. Finally, state clearly what argument or consideration would change your mind—identify the specific reasoning step where you are most vulnerable, and say exactly what evidence or counterexample would lead you to conclude that this governance model actually presupposes a different theory of moral change altogether.
