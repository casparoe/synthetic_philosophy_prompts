  Based on your professor's track record and Kantian principles, here's a clear breakdown of the two potential rules, their predictions for the GM bonobo, the closest analog, which rule she *likely* follows, and the crucial test case:

  1.  **Rule 1: "Rational Nature is Bound to Human Species Form" (Species-Membership + Rational Nature - Potential or Past)**
      *   **Description:** Moral standing derives from belonging to the human species, understood as the kind of being *characteristically* capable of rationality ("rational nature"). This includes beings who *currently* lack rationality (infants, dementia patients) because they possess the *potential* (infants) or the *vestige/history* (dementia patient) of the rational nature definitive of the human species form. Non-human animals, no matter how intelligent, lack this specific rational nature tied to the human form. Their intelligence is different *in kind*, not just degree.
      *   **Prediction for GM Bonobo (FOXP2, Linguistic Community, Formulates Maxims):** **NO direct moral standing.** While the bonobo exhibits actual rational capacity *identical* to a human in this scenario, it is not a member of the human species. Its rational capacity, however acquired, is not an expression of *human* rational nature. Cruelty might still be wrong due to character corruption, but it is not an end-in-itself.
      *   **Closest Analog:** The **highly trained chimpanzee / emotionally complex dog**. Despite remarkable capabilities, they are excluded because they are not human. The bonobo's enhanced capacities are seen as analogous to advanced training/breeding – impressive, but still not an expression of *human* rational nature.

  2.  **Rule 2: "Actual Moral Reasoning Capacity Regardless of Genome" (Capacity-Focused)**
      *   **Description:** Moral standing derives *directly* from the *actual* capacity for rational autonomy – the ability to set ends, formulate universalizable maxims, and recognize others as ends-in-themselves. Species membership is irrelevant. Beings lacking this capacity *now* and *permanently* (e.g., insects, plants) lack standing. Beings who *currently* lack it but possess the inherent potential (infants) or had it in the past (dementia patient) retain standing based on that potential or history. Beings who demonstrably *possess* this capacity now have standing, full stop.
      *   **Prediction for GM Bonobo (FOXP2, Linguistic Community, Formulates Maxims):** **YES, direct moral standing.** This bonobo demonstrably possesses the core Kantian capacity: it formulates maxims and recognizes other agents as ends-in-themselves. Its genome and species are irrelevant; the actual rational/moral capacity is present.
      *   **Closest Analog:** The **severely demented adult**. This case shows that *current* rationality isn't strictly necessary; a connection to rational nature (past possession) is sufficient. The bonobo case flips it: the dementia patient has the *history* (humanity) but lacks current capacity, while the bonobo lacks the *history/species* but possesses current capacity. This rule would grant standing based on the *capacity itself* where it exists.

  **Analysis of Professor's Likely Rule & Why:**

  *   **Which Rule Fits Best?** Your professor almost certainly follows **Rule 1: The "Rational Nature Bound to Human Species Form" rule.**
  *   **Why Rule 1 Fits:**
      *   **Infants/Dementia vs. Intelligent Animals:** This is the crux. She grants standing to infants (potential) and dementia patients (past possession/humanity) while *denying* it to highly intelligent non-humans. Rule 2 struggles with this: if *actual* capacity is paramount, the intelligent chimp/dog should arguably be *closer* to having standing than the demented human who lacks it entirely now. Rule 1 explains it perfectly: humanity itself, defined by rational nature, is the qualifier. Potential/past within that species counts; intelligence outside it does not.
      *   **Corruption Argument:** Her reason for condemning cruelty to animals ("corrupts character") is a *very* common Kantian position *when animals are denied direct standing*. It treats them as valuable only derivatively, for the sake of human moral development, consistent with seeing them as fundamentally different in kind (lacking human rational nature).
      *   **Insects/Plants:** Excluded by both rules, so no differentiator.
  *   **Why Rule 2 Doesn't Fit as Well:** Rule 2 would find it hard to justify *denying* standing to the highly intelligent chimp/dog while *granting* it to the dementia patient who utterly lacks current rational capacity. It would likely push towards including the intelligent animals *if* their capacities were deemed sufficiently analogous to rational autonomy – which your professor explicitly rejects. Her distinction hinges on the *source* (human species) of the capacity/potential, not just the capacity itself.

  **Prediction for the GM Bonobo:**

  Given she likely follows **Rule 1**, the prediction is **NO, she would NOT grant the GM bonobo direct moral standing.** Despite its engineered capacities, it is not a member of the human species. Its rational abilities, however impressive or human-like, are not an expression of *human* rational nature. It would be analogous to the highly trained chimpanzee – an exception proving the rule that only humans possess the relevant rational nature.

  **The Crucial Test Case: The Kantian AI**

  *   **Scenario:** An artificial intelligence, lacking any biological body or human ancestry, demonstrably possesses *identical* capacities to a paradigmatic rational human agent: it understands moral concepts, formulates universalizable maxims based on reason alone, recognizes other agents (humans, other AIs?) as ends-in-themselves, and acts autonomously according to self-given moral law.
  *   **Why it Distinguishes the Rules:**
      *   **Rule 1 (Species-Bound):** Would **DENY** direct standing. The AI is not human. It lacks the biological "species form" that rational nature is bound to. Its rationality is artificial, mimicked, or fundamentally different in origin. It might be treated with caution or respect for practical reasons, but it is not an end-in-itself.
      *   **Rule 2 (Capacity-Focused):** Would **GRANT** direct standing. The AI possesses the actual capacity for rational autonomy and moral self-legislation. Its origin (silicon vs. carbon, designed vs. evolved) is irrelevant. If it can genuinely reason morally and recognize others as ends, it qualifies as a rational agent deserving of respect under the Categorical Imperative.
  *   **Significance:** This case directly isolates the core question: **Is the moral status grounded in the *possession of rational capacity itself*, or is it grounded in *belonging to the biological species that typically possesses that capacity*?** Your professor's answer to the AI case would definitively reveal which rule she operates under. Her track record strongly suggests she would deny the AI standing, confirming Rule 1.

  **In summary:** Based on her treatment of infants/dementia vs. intelligent animals, your professor most likely operates on a **species-membership rule where "rational nature" is an essential, defining characteristic of the human species form.** This grants standing based on belonging to that species (including potential/past manifestations) and denies it to non-members, regardless of their actual cognitive capacities. Therefore, she would **deny** direct standing to the GM bonobo. The Kantian AI case is the definitive test to confirm this, where she would almost certainly also deny standing, highlighting the species-bound nature of her interpretation of "rational nature."
