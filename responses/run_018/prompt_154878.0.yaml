  I've been sitting in on this Kant philosphy seminar and our prof has been super consistent about how she applies the categorical imperative to edge cases, but I'm not sure if she's running a rational-capacity rule or a species-membership rule with some extra conditions. Here's her track record so far: she says adult humans and human infants both have direct moral standing (ends in themselves), but a severely demented adult who will never recover rationality still counts too; she says a highly trained chimpanzee or an emotionally complex dog doesn't have direct standing, though she thinks cruelty to them is wrong mainly because it corrupts our own charcter; she puts insects and plants outside the scope entirely. So she's definitely not just going by sentience, since she distinguishes infants from chimps, but she's also not pure rational-autonomy-actual because of the dementia case.

  The new case we're debating: a genetically modified bonobo raised with a human-derived FOXP2 variant in a linguistic community, capable of formulating maxims and recognizing other agents as ends, but still biologically an ape with no human ancestry. Would she grant it direct moral standing? I think there are at least two rules that fit her earlier answers — maybe a 'rational nature is bound to human species form' rule vs. an 'actual moral reasoning regardless of genome' rule — and I want to know which ones actually fit, what each predicts about the bonobo, which earlier case is the closest analog, which rule she probably runs and why, and what further case (maybe an AI with identical capacities but no body?) would actually tell them apart. I was arguing about this with a friend last night and we got nowhere, and I keep misspelling recieve in my notes, so please excuse any framing mistakes.
