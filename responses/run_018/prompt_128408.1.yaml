answer: |-
  **Republican liberty is best understood as a protocol-level property governing agent-institution interactions, fundamentally distinct from mental states (positive liberty) or mere non-interference (negative liberty), and irreducible to individual capabilities.**  

  ### Core Reasoning
  1. **Protocol-Level Property Defined**:  
     Republican freedom (non-domination) relies on *structural constraints* that prevent arbitrary power. In distributed systems terms, this resembles protocols that:  
     - **Define clear rules** for interactions (e.g., consensus algorithms ensuring no single node dominates).  
     - **Embed anti-arbitrariness** (e.g., digital signatures requiring authorization for actions, preventing unilateral control).  
     - **Enable contestation** (e.g., audit trails allowing agents to challenge decisions).  
     This framework is *interactional*: freedom emerges from system design, not individual states.  

  2. **Distinction from Berlin’s Categories**:  
     - **Negative liberty** (absence of interference) is a *static output*: "Was I blocked?" Protocol freedom is *dynamic process*: "Can the rules be weaponized against me?" (e.g., TLS encryption ensures interference is impossible *and* non-arbitrary).  
     - **Positive liberty** (self-mastery) is *internal* (e.g., "am I rational?"). Protocol freedom is *external* and *relational* (e.g., "do institutions lack discretionary power over me?"), requiring no psychological transformation.  

  3. **Irreducibility to Capability Views**:  
     Capability approaches (e.g., Sen, Nussbaum) focus on *individual capacity to achieve functionings*. Republican protocol-freedom, conversely, targets *power asymmetries in the interaction layer*:  
     - A disabled person using mandated wheelchair ramps (capability) may still face domination if authorities can arbitrarily revoke access.  
     - Protocol design fixes this by embedding *non-discretionary access* (e.g., smart contracts enforcing ramp availability). Freedom here is systemic, not personal capacity.  

  ### Contested Ground (Acknowledging Disputes)  
  - **Collapse into negative liberty?** Some critics (e.g., Carter, Kramer) argue non-domination is just robust non-interference. *Your protocol rebuttal*: Negative liberty ignores *structural power imbalances* (e.g., a master not interfering is still dominating). Protocols actively dismantle power-asymmetry (e.g., zero-knowledge proofs verifying actions without revealing power).  
  - **Requires positive capabilities?** Scholars like Gourevitch claim republican freedom needs material empowerment. *Protocol rebuttal*: Pettit explicitly rejects this; freedom is "non-mastery," not "self-mastery." Protocols ensure *procedural resilience* (e.g., DAOs with veto mechanisms) without requiring internal capabilities.  

  ### Why This Framing Advances Republican Theory  
  Modeling non-domination as protocol design:  
  - **Avoids individualism**: Freedom exists in the *space between* agents and institutions.  
  - **Prevents reductionism**: Arbitrariness is a system flaw, solvable only by interaction constraints.  
  - **Offers engineering rigor**: Like Byzantine fault tolerance, it targets *malicious design* over accidental interference.  

  **Bottom line**: Republican liberty as protocol property transcends internal states (positive), mere non-blocking (negative), and resource-based capabilities—it’s the architecture of anti-arbitrariness.
