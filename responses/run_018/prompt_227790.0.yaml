answer: |-
  Your moral architecture is profoundly compelling, and the structural challenge you've identified is crucial. The core tension—**deception voids consent, but life within a voided marriage continues**—is the novel's ethical engine. Here’s a principled framework to navigate the "radius of contamination" without sacrificing rigor:

  ### Core Principle: Consent Requires Material Truth
  You’ve established the axiom: **Consent predicated on a material deception about a fundamental aspect of the relationship is void *ab initio* (from the beginning).** The marriage contract never validly existed. This is sound, drawing from contract law (fraud in the inducement voids the contract) and ethical philosophy (autonomy requires informed choice).

  ### The Contamination Radius: A Principled Approach
  The voidness *does* extend, but **not infinitely or indiscriminately**. The key is **materiality, reliance, and the nature of the subsequent act**. Here’s how to delineate it rigorously:

  1.  **Acts Intrinsically Dependent on the Validity of the Marriage:**
      *   **Examples:** Joint mortgage, shared bank accounts, relocation predicated on joint spousal visas/employment, wills naming each other as beneficiaries, medical decisions requiring spousal consent.
      *   **Why Contaminated:** These acts *presume the existence and validity of the marital relationship* as their foundational premise. They are direct legal or practical *consequences* of the marriage contract. Her consent here relies entirely on the belief that she *is* validly married. The deception about the child is material because it fundamentally alters the nature of the partnership she believed she was entering (e.g., financial obligations, future planning, exclusivity of family unit).
      *   **Rigorous Conclusion:** Consent to these acts is **voidable or void** (she could rescind the mortgage agreement, reverse financial transfers, challenge the visa status *based on the fraudulent marriage*). She was wronged in these consents *because they were predicated on a false reality she did not choose*.

  2.  **Acts of Personal Intimacy & Shared Daily Life:**
      *   **Examples:** Sexual intimacy, sharing a home, daily routines, emotional vulnerability, confidences shared.
      *   **The Complexity:** This is the crux of your challenge. Applying the "void *ab initio*" principle rigidly suggests every kiss, every shared breakfast, every moment of trust was non-consensual. This feels intuitively powerful but risks absolving her of *all* agency within the relationship or implying a state of perpetual violation that may not reflect lived experience.
      *   **Principled Resolution:**
          *   **The Foundation is Poisoned:** The *context* for all intimacy was established by fraud. The trust enabling vulnerability was built on sand. The *possibility* of authentic consent within the relationship was fundamentally compromised from the outset.
          *   **Consent as a Momentary Act:** While the marriage contract is void *ab initio*, acts of intimacy are individual consents given *in specific moments*, albeit within the fraudulent framework. Critically, **she consented to intimacy *with the person she believed her husband to be*** – a man without a hidden child and secret financial/emotional obligations.
          *   **Materiality & Harm:** The deception is *material* to the intimacy because it concealed a fundamental aspect of his life, responsibilities, and potential loyalties that could reasonably affect her willingness to be vulnerable and intimate. The harm is the *violation of trust* and the *use of her body/emotions under false pretenses*. Each act of intimacy occurred within a relationship whose core premise was false.
          *   **Rigorous Conclusion:** She **was wronged** in these intimacies. Her consent was **vitiated by the ongoing deception** that shaped the entire relationship. It’s not that she didn't consent *in the moment* to the physical act; it’s that her consent was given to a *fictionalized version of the relationship and the man*. The contamination is pervasive. However, framing it as absolute "voidness" for each discrete act might feel legally over-extended. The stronger ethical claim is **profound violation and harm due to the foundational deceit**, making the intimacy non-*authentic* and deeply harmful upon revelation, rather than legally non-consensual in the same way the marriage contract is.

  3.  **Acts Arising *After* Discovery (if applicable):**
      *   **The Critical Threshold:** If she discovers the lie but *stays* and continues the mortgage, intimacy, etc., **consent given *after* full knowledge is fundamentally different**.
      *   **Rigorous Conclusion:** Consents given **post-discovery are potentially valid** (even if given under duress, emotional distress, or pragmatic calculation). The "voidness" applies only to acts predicated on *ignorance*. Once informed, her choice to stay, while potentially influenced by the sunk costs of the voided marriage, is a choice made with material knowledge. This doesn't validate the *past* voided consents, but it changes the nature of *future* actions within the relationship.

  ### Addressing Your Core Dilemma

  *   **"Must I treat all subsequent choices as unconsented?"** **No.** The rigor comes from **differentiating the *nature* of the subsequent act and its *reliance* on the voided marriage**.
      *   Financial/legal entanglements *directly* reliant on the marriage's validity? Voidable.
      *   Intimacy within a relationship built on fraud? Vitiated consent, profound violation/harm, but not necessarily "void" in the same contractual sense. The harm is relational and existential, stemming from the deception.
  *   **"Am I conceding that consent procured by deception can be valid after all?"** **Absolutely not.** You are acknowledging the **ongoing power of the initial deception to distort reality and harm**, but also recognizing that:
      1.  Not all acts have the same *direct, legal* reliance on the validity of the marriage contract.
      2.  Human beings continue to act with a degree of agency *within* the false reality created by the lie, even if that agency is constrained and choices are made based on false information.
      3.  The *primary* voidness is the marriage itself and acts *contingent* upon its existence. The harm of the deceit permeates everything else, but manifests as betrayal, violation of trust, and psychological harm rather than a strict legal voiding of every coffee they shared.

  ### Narrative Implementation: Maintaining Rigor & Nuance

  1.  **Focus on Materiality & Reliance:** Have the wife (or a character voicing the moral core) explicitly articulate *why* a specific act (like the mortgage) is impossible to separate from the fraudulent marriage. "I signed those papers believing we were building *our* future, *our* family, from scratch. That future never existed. That family was already divided."
  2.  **Portray the Pervasive Harm of Intimacy:** Don't shy away from her feeling retroactively violated. Use her internal monologue: "Every touch, every whispered promise, every plan made in that bed... was it all with a ghost? A man who didn't exist? Did I ever truly know who was touching me?" Frame it as the **erosion of the relationship's authenticity**, not necessarily each discrete act being an assault.
  3.  **Highlight the Husband's Ongoing Deception:** The lie isn't a one-time event; it's an *active maintenance* of a false reality. Every time he pays child support in secret, every time he deflects a question about his past, he *renews* the fraud. This reinforces how every agreement or intimacy occurring *before* discovery happens under this sustained false pretense.
  4.  **Distinguish Post-Discovery Agency:** If she stays after learning the truth, explore the complexity of her *new* choices, made with painful knowledge. This doesn't retroactively validate the past, but it shifts the moral dynamic.

  **In essence:** The marriage and acts *contingent* upon its validity are void/voidable. The intimacy and shared life within the fraudulent marriage are **profoundly violated and harmful due to the foundational deceit**, rendering the consent given *inauthentic* and the relationship itself a construct built on a lie. This maintains the rigor of your core principle (deception voids consent for the fundamental act of marriage) while providing a nuanced, principled way to explore the devastating, pervasive consequences of that voidness on every aspect of her life within it. The contamination radius is vast, but its *manifestation* differs based on the nature of the act and its reliance on the lie.
