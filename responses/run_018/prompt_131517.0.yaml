answer: |-
  Here is my credence decomposition for the Calibrated Desert claim, based on philosophical reasoning and empirical constraints:

  **(a) Probability that moral desert is non-instrumentally basic:**  
  **0.4**  
  *Justification:* Skepticism about non-instrumental desert is dominant in contemporary philosophy (e.g., Scanlon, Rawls), but robust realism (e.g., Sher) retains minority support.  

  **(b) Probability that counterfactual welfare contribution is the correct desert-base (if desert is basic):**  
  **0.5**  
  *Justification:* Consequentialist desert-bases (e.g., welfare contribution) compete with deontological alternatives (e.g., effort/virtue); neither clearly dominates.  

  **(c) Probability that filtering brute luck avoids collapsing into equality/need-tracking:**  
  **0.3**  
  *Justification:* Separating "brute luck" from genuine contribution is empirically fraught (e.g., epigenetics, implicit bias) and risks conflating desert with opportunity-equalization.  

  **(d) Probability that a single correctable error doesn't vitiate justification (if a-c hold):**  
  **0.7**  
  *Justification:* If the system is otherwise reliable, isolated errors may be seen as procedurally fair (e.g., akin to justified legal verdict errors).  

  **Overall credence:**  
  Calculated as `a × b × c × d = 0.4 × 0.5 × 0.3 × 0.7 = 0.042`  
  **Result: 4.2%**  

  **Least confident term: (c)** (Brute-luck filtering compatibility) due to the conceptual and empirical challenges in disentangling luck from contribution.  

  **Key empirical finding that would shift credence:**  
  Discovery that humans **intrinsically perceive algorithmically assigned roles as "deserved"** (e.g., via neuroimaging during unfair allocations showing no threat-response). This would increase my credence by elevating (a) and (d), potentially doubling overall probability to ~8-10%. Absent this, legitimacy likely hinges on instrumental outcomes, undermining non-instrumental claims.  

  *(Note: Credences reflect subjective epistemic probabilities under current knowledge, not endorsements.)*
