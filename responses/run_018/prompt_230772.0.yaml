answer: |-
  Here’s a targeted Q&A prep sheet addressing your anticipated objections, structured by challenger, with timed replies and vulnerability assessments. Total: 980 words.

  ---

  ### **Q&A Prep Sheet: Defending Non-Propositional Hinges**  
  **Core Thesis:** Hinges are *practical competencies* (like riverbed conditions for water/thought), not doxastic states requiring justification.  

  ---

  ### **1. Wrightian Epistemologist’s Objection (Entitlement Demand)**  
  *Likely Question:*  
  "Even if hinges aren’t beliefs, don’t we need a *normative warrant* to explain our entitlement to rely on them? Without rational grounding, why trust hinges over delusions?"  

  **Your Reply (2 mins):**  
  *"Entitlement applies to *actions* or *inferences*, not hinges themselves. Hinges are the enabling conditions for entitlement-talk. Like asking for a permit to dig a riverbed: the request presupposes the very structure it seeks to authorize. Wright’s ‘entitlement’ properly applies downstream—to how we *use* hinges in reasoning—not to the hinges qua practical bedrock. Trust isn’t chosen; it’s manifested in how we act. A delusion *disrupts* practice; hinges *sustain* it."*  

  **Weakness:**  
  Concedes normative pressure but sidesteps *why* specific hinges (e.g., "The world exists") sustain practice better than alternatives. Risk: Feels like evasion.  
  **Tactic:** **Concede** the need for *ex post* normative accounts of hinge-reliant actions—but **hold** that hinges themselves are arational.  

  ---

  ### **2. Decision Theorist’s Objection (Credence Reductionism)**  
  *Likely Question:*  
  "Can’t practical competence be reduced to high subjective probability (credence >0.99) in fine-grained propositions (e.g., ‘My hands won’t dissolve when I type’)?"  

  **Your Reply (2 mins):**  
  *"Credences require *consideration* of alternatives—but hinges are *pre-reflective*. I don’t assign 0.9999 credence to ‘This is a hand’; I *use* it to grasp a doorknob. Modeling this as probabilistic belief misdescribes the phenomenology: it’s like claiming a riverbed has ‘high water credence.’ Hinges are *how* we navigate uncertainty, not *what* we’re uncertain about. Reducing competence to credence reintroduces the propositionalism I reject."*  

  **Weakness:**  
  Under-explains how practical certainty interacts with *actual* low-stakes credences (e.g., "I’m 0.8 sure my keys are here").  
  **Tactic:** **Hold firm.** Reject propositionalism as category error. Cite OC §308: Doubt *presupposes* certainty.  

  ---

  ### **3. Wittgenstein Scholar’s Objection (Therapeutic Anti-Theory)**  
  *Likely Question:**  
  "Aren’t you building a *theory* of hinges—precisely what Wittgenstein avoids? OC is therapy for philosophy’s cramps, not a metaphysical foundation."  

  **Your Reply (2 mins):**  
  *"I offer no theory of *what hinges are*. I’m diagnosing a grammatical confusion: treating practical certainty as if it were epistemic. The ‘riverbed’ analogy isn’t ontology—it’s a *reminder* that justification has preconditions. My aim is therapeutic: to show skepticism’s futility by revealing hinges as non-doxastic. If I theorize, it’s only to dissolve the picture that hinges *need* theorizing."*  

  **Weakness:**  
  Your "non-propositional competence" framing risks reification. Wittgenstein’s therapy might demand silence, not redescription.  
  **Tactic:** **Concede** the danger—but **hold** that describing misuse *of grammar* is faithful to W.  

  ---

  ### **4. Graduate Students’ Objection (Changed Subject?)**  
  *Likely Question:**  
  "If hinges aren’t justified beliefs, haven’t you changed the subject? Skepticism challenges knowledge-claims; saying ‘those aren’t beliefs’ dodges the battle."  

  **Your Reply (2 mins):**  
  *"Skepticism *depends* on treating hinges as knowledge-claims—but they aren’t moves *in* the game. Saying ‘I know I have hands’ *misuses* language (OC §12). Rejecting propositionalism doesn’t ‘solve’ skepticism; it dissolves its coherence. The skeptic’s ‘doubt’ is idle because it ignores the practical bedrock that gives doubt life. Changing the subject *is the point*: skepticism’s subject is illusory."*  

  **Weakness:**  
  May feel deflationary—like dismissing skepticism via stipulation.  
  **Tactic:** **Hold.** Emphasize dissolution over refutation.  

  ---

  ### **The Question You Hope Nobody Asks**  
  *Likely Form:*  
  **"If hinges are culturally variable practical competencies (OC §92, 262), how do you avoid relativism? What stops Nazi hinge-practices from being ‘certain’?"**  

  **Why it’s Dangerous:**  
  Forces normative commitment while undermining hinges as universal scaffolding.  

  **Reply Strategy (If Pushed):**  
  *"Hinges aren’t *moral* but *logical*: they enable shared sense-making. Nazi ‘hinges’ (e.g., ‘Untermenschen lack souls’) *corrupt* practice by foreclosing question-answer coherence (cf. OC §517). But this isn’t relativism—it’s recognizing that some practices *collapse* under reflection. Still, my account struggles to ground normativity without propositionalism."*  

  **Vulnerability:**  
  Your non-propositionalism lacks resources to condemn evil frameworks beyond pragmatic failure. Concedes significant ground to relativism.  
  **Tactic:** **Concede** the challenge—but pivot to hinges’ *immanent critique* (self-undermining practices).  

  ---

  ### **Summary: Holding vs. Conceding**  
  | **Objector**           | **Concede**                          | **Hold**                                  |  
  |-------------------------|--------------------------------------|-------------------------------------------|  
  | **Wrightian**           | Downstream entitlement needed        | Hinges themselves are arational           |  
  | **Decision Theorist**   | Credences model *some* uncertainty   | Competence ≠ probabilistic belief         |  
  | **W Scholar**           | Theory-risk in redescription         | Grammar reminders aren’t metaphysics      |  
  | **Grad Students**       | Skepticism isn’t "refuted"           | Dissolution > engagement on skeptic’s terms |  

  **Final Note:** Anchor replies in OC’s text (§§96-99, 341-343, 559) to avoid "your Wittgenstein vs. mine" deadlocks. Emphasize hinges as *enacted*—not thought.
