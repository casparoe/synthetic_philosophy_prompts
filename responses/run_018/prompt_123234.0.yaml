prompt: |-
  I'm designing the final assessment for a graduate seminar in philosophy of history and historical epistemology, and I need an essay prompt that sits at the intersection of hindsight bias and the narrative fallacy without allowing students to answer by reciting standard summaries. The question should present a concrete historiographical scenario—say, a 2024 account of the 1989 fall of the Berlin Wall that frames the event as the inevitable culmination of a "long democratic arc" in Central Europe, thereby smoothing over the contingency of Gorbachev's specific decision not to intervene and the ad-hoc local negotiations in Leipzig. I want students to diagnose precisely where retrospective probability reassignment ends and causal emplotment begins, and whether these are genuinely separable mechanisms or a single compound distortion. To push them past memorized labels, inject a conceptual tool they must evaluate: the "counterfactual stability criterion," which asks whether small perturbations in 1989 (for instance, a different Soviet regional commander or a delayed Leipzig protest) would have collapsed the democratic outcome, and whether applying this criterion actually cures the distortion or merely disguises it with methodological rigor.

  Please write: (1) the exam question itself, calibrated for a 45-minute graduate-level essay; (2) a model answer of approximately 700 words that does not simply invoke well-known authors or texts but makes specific conceptual moves—particularly about whether hindsight bias operates at the epistemic level while narrative fallacy operates at the structural level of emplotment, and about the limitations of counterfactual stability as a corrective; and (3) a marking scheme out of 20 marks that separates an A answer from a B by naming the exact moves required—for example, recognizing that the two biases compound rather than merely coexist, assessing whether any historiographical method can fully disentangle them, and identifying the specific risk that counterfactual rigor collapses back into retrospective teleology. Every wrong path or partial credit should be named explicitly, and the scheme should penalize answers that treat the two concepts as interchangeable synonyms rather than as interacting failures of historical reasoning. Do not include bibliographies, reading lists, or citation requests; the prompt and answer should be self-contained for a model working without external search.
