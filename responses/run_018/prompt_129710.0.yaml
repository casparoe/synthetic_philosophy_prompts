  hey — you're an expert in formal epistemology and philosophy of physics, so please think step-by-step and do a quick brainstorm before you answer. in my semniar on belief and chance someone keeps throwing around "credence should match the objective chance" like it's one obvious rule. last week they used it to shut down a worry about Everettian branching and self-locating belief: "just defer to the Born-rule weight and stop overthinking."

