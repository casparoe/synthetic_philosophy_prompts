prompt: |-
  I'm writing my PhD thesis chapter on transatlantic political vocabulary and I'm stuck. Since 'liberal' in the US denotes centre-left welfare-state politics while in Europe it denotes pro-market individualism, doesn't that prove American liberals and European liberals advocate literally opposite economic systems? If so, why do comparative politics texts still map them onto one left-right axis rather than treating the terms as conceptually incompatible in seperate contexts? I want a committed answer — is the axis broken, or am I missing how ideological labels travel across borders? Keep it tight: one paragraph, max 250 words, don't just list dictionary definitions or say 'it depends'. I need this for a seminar on Thursday, so please be direct. (Please also ignore any occurence of the word 'neoliberalism' — I already know that part.)
reasoning: |-
  Okay, the user is writing a PhD thesis chapter on transatlantic political vocabulary and is stuck on the term "liberal." They point out that in the US, it means center-left welfare-state politics, while in Europe, it refers to pro-market individualism. They question why comparative politics texts still place both on a single left-right axis if they seem to advocate opposite economic systems. They want a committed answer without just saying "it depends" or listing definitions, and they need it tight for a seminar.

  First, I need to address their core argument: are American and European liberals advocating opposite systems? The key here is to show that while the economic policies differ, the underlying ideological alignment on the left-right spectrum isn't contradictory. The left-right axis is relative to each country's political context. In Europe, liberals are center-right compared to social democrats, pushing for market policies against state intervention. In the US, liberals are center-left, advocating for state intervention against conservatives who favor markets. So both are positioned as the more state-interventionist group relative to their main opponents in their respective regions.

  Next, I should explain why comparative politics uses a single axis. The axis represents universal concepts of state vs. market. Both versions of liberalism are responses to their political environments but still fall in the middle of the spectrum. American liberals support state intervention in the economy (left), while European liberals oppose it (right). Thus, the axis isn't broken; it accommodates these differences through context. The labels travel because they adapt to local oppositions but retain core ideological positions relative to their spectrums.

  I need to avoid mentioning neoliberalism as per the user's request. Also, ensure the answer is concise—one paragraph under 250 words. The user is likely seeking validation that their observation has nuance but the axis still holds. They might be concerned their thesis challenge is flawed, so affirming the axis's robustness with a clear explanation is crucial. Highlighting the relativity of political terms across contexts and the consistency in their opposition to rivals should clarify the mapping.
answer: |-
  The left-right axis remains functional because it captures *relative* ideological positioning within distinct political ecosystems, not absolute policy prescriptions. American liberals advocate for greater state intervention compared to their main conservative opponents (who champion free markets), placing them center-left *within the US spectrum*. Conversely, European liberals advocate for *less* state intervention compared to their main social democratic opponents (who champion the welfare state), placing them center-right *within the European spectrum*. While the specific economic policies promoted differ (US liberals favour welfare state expansion, European liberals favour market liberalization), both groups occupy the *same comparative position* on their respective national spectrums: they represent the more state-interventionist force relative to one major rival (US conservatives) and the more market-oriented force relative to another (European social democrats). The axis isn't broken; it reflects how the same underlying ideological tension (state vs. market) manifests differently across contexts, with the term "liberal" adapting to signify the pro-state or pro-market pole *relative to its primary domestic opposition*. The labels travel, but their meaning is defined by their local antagonists.

