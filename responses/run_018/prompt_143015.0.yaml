prompt: |-
  okay so i've been trying to pin down exactly where the demandingness objection to consequentialism actually bites, and my verdicts on specific cases are kind of all over the place. i want to know if there's a coherent principle behind them or if i'm just being inconsistent.

  case 1: i should skip a $6 late and donate that money to malaria nets. seems like an obvious yes.
  case 2: i should not be required to live on minimum wage and send the rest to charity, even if that'd save dozens of lives. demandingness applies here.
  case 3: i should donate blood every two months if i'm healthy. low cost, saves lives, yes.
  case 4: i should not be required to donate a kidney to a stranger, even with small risk. bodily integrity or something.
  case 5: i should volunteer maybe 5-10 hours a week locally, but not 40. partial yes.

  now the weird pair that doesn't fit together:
  case 6: i shouldn't be required to sell my house and downsize to free up $200k for charity.
  case 7: but if i could save the same number of lives by working an extra 20 hours a week for ten years at a high-paying job and donating the surplus—roughly the same $200k—somehow that feels closer to being required, even though it's also a huge life-plan hit. actually i'm not sure, but the two feel different to me.

  is there a principle that saves most of these? maybe something about "fungible resource depletion" versus "life-plan restructering"? but then case 6 and 7 both restructure things. or maybe it's continuous versus one-time costs? i don't know. can you lay out one or two precise principles that capture the pattern, tell me which verdicts they force me to drop, and say how they'd handle cases i haven't mentioned—like being required to take a vaccine with a 1-in-1000 risk to save strangers, or being required to care for a disabled family member instead of working for charity?
reasoning: |-
  Okay, the user is struggling with the demandingness objection to consequentialism, trying to find a consistent principle behind their intuitions across various cases. They've listed seven specific scenarios where their moral judgments seem inconsistent, especially between cases 6 and 7 which both involve $200k sacrifices but feel different to them. 

  Hmm, this is a classic ethics puzzle - the tension between utilitarianism's rigorous demands and human psychological limits. The user seems analytically sharp but frustrated by their own conflicting intuitions. They're not just asking for textbook answers; they want to understand why their gut reactions diverge and whether those reactions can be systematized. 

  The core tension in their examples revolves around three dimensions: resource type (money vs bodily integrity vs time), sacrifice pattern (continuous vs one-time), and life disruption (peripheral vs core identity). Cases 1 and 3 feel obligatory because they're low-cost/fungible, while cases 2,4 and 6 hit harder because they threaten survival or bodily sovereignty. 

  But cases 6 and 7 are particularly interesting - same monetary value, radically different psychological weight. Selling a house is a identity-disrupting capital depletion, while working extra hours is a chronic life-structure erosion. The latter might feel more demanding because it's a decade-long sentence versus a one-time amputation. 

  For their unmentioned cases: The vaccine risk (1/1000) likely falls under moderate bodily imposition - probably obligatory if it saves multiple lives. Family care vs charity work pits special obligations against impersonal good - here consequentialism would require calculating net utility but most people's intuitions side with special ties. 

  The user might be seeking validation that their inconsistencies reflect real moral dimensions rather than cognitive errors. A good response should honor that while offering conceptual tools to navigate the gray areas.
answer: |-
  You've hit on the core tension in demandingness objections! Your intuitions aren't inconsistent – they reflect nuanced distinctions that philosophers grapple with. Here are two precise principles that capture most of your verdicts, along with what they force you to drop:

  **Principle 1: The Disruption Threshold (Focus: Life-Plan Integrity)**
  *   **Definition:** We are obligated to sacrifice resources *until* the sacrifice would cause **severe disruption to our core life plans, identity, or essential well-being**, rendering us unable to pursue fundamental projects/relationships that give life meaning.
  *   **Application:**
      *   **Case 1 (Skip Latte):** ✅ Minimal disruption. Core life plans untouched.
      *   **Case 2 (Live on Min Wage):** ❌ Severe disruption. Threatens basic security, health, relationships, ability to pursue any meaningful non-survival projects.
      *   **Case 3 (Donate Blood):** ✅ Minimal disruption. Brief, low-risk, no lasting impact on core plans.
      *   **Case 4 (Donate Kidney):** ❌ Significant disruption. Major surgery, permanent bodily change, non-zero mortality risk, potential long-term health impacts affecting core capacities.
      *   **Case 5 (Volunteer 5-10hrs):** ✅ Moderate sacrifice unlikely to severely disrupt core plans for most people.
      *   **Case 5 (Volunteer 40hrs):** ❌ Would likely consume time/energy needed for core life projects (career, family, self-maintenance).
      *   **Case 6 (Sell House):** ❌ Selling a primary residence is deeply tied to identity, stability, family life, community ties – core life plan elements. Severe disruption.
      *   **Case 7 (Work Extra 20hrs/10yrs):** ❌ Chronic, massive time/energy drain. Likely destroys work-life balance, health, relationships, ability to pursue *any* significant personal projects – severe life-plan disruption. (*This principle explains why 6 & 7 feel similar – both hit the disruption threshold*).
  *   **Forced Verdict to Drop:** Possibly **Case 4**. If kidney donation had *zero* risk and minimal recovery time (hypothetical), the "bodily integrity" objection weakens. This principle might force you to accept it *if* it truly caused no severe disruption (though bodily integrity itself might be a core element).
  *   **Handles Unmentioned Cases:**
      *   **Vaccine (1/1000 risk):** ✅ Low absolute risk. Unlikely to cause severe disruption to core life plans for most people. Obligation likely stands.
      *   **Care for Disabled Family vs. Charity Work:** ❌ Caring for a family member directly engages core relational commitments (a fundamental life plan). Forcing someone to abandon this for impersonal charity *causes* severe disruption to their core identity/relationships. Consequentialism might demand it if charity saves more lives, but this principle excuses it.

  **Principle 2: The Essential Reserve & Bodily Sovereignty (Focus: Resource Categories & Boundaries)**
  *   **Definition:**
      1.  **Fungible Resources (Money/Time):** We are obligated to sacrifice *surplus* fungible resources (money, discretionary time) for great good, but retain an **"essential reserve"** necessary for maintaining a *minimally decent life* (security, health, core relationships, basic autonomy).
      2.  **Bodily Resources/Integrity:** Sacrifices involving direct bodily intrusion, risk, or depletion (organs, blood, significant risk exposure) face a **much higher justificatory threshold**. Bodily sovereignty creates a strong presumption against compulsion unless the cost is *very* low and the benefit *exceptionally* high.
  *   **Application:**
      *   **Case 1 (Skip Latte):** ✅ $6 is surplus fungible resource.
      *   **Case 2 (Live on Min Wage):** ❌ Donating *down* to min wage violates the "essential reserve" for a minimally decent life (no buffer for emergencies, little autonomy/opportunity).
      *   **Case 3 (Donate Blood):** ✅ Low bodily cost, minimal risk, body replenishes. Meets the high threshold for bodily sacrifice.
      *   **Case 4 (Donate Kidney):** ❌ High bodily cost (major organ loss, surgery risk, permanent change). Exceeds the justificatory threshold for bodily sacrifice to a stranger.
      *   **Case 5 (Volunteer 5-10hrs):** ✅ Surplus discretionary time likely available.
      *   **Case 5 (Volunteer 40hrs):** ❌ 40hrs likely consumes essential reserve time needed for rest, relationships, self-care.
      *   **Case 6 (Sell House):** ❌ Primary residence is often part of the "essential reserve" for stability/security. *Also*, converting non-fungible capital (home) into fungible cash *for donation* feels like a deeper violation than donating surplus income. It's depleting a core asset.
      *   **Case 7 (Work Extra 20hrs/10yrs):** ❌ The *time* required isn't surplus – it violates the essential reserve for rest/relationships/health. The *money earned* might be surplus fungible resource *if already possessed*, but the *means of acquiring it* (chronic overtime) violates the time/reserve element. (*This principle explains the difference you sense between 6 & 7: 7 involves violating the time/reserve through ongoing effort, while 6 is a capital asset depletion*).
  *   **Forced Verdict to Drop:** **Case 3** might be borderline if someone has severe needle phobia or anemia, pushing it towards bodily sovereignty concerns. **Case 2** might be less absolute – if "minimum wage" was truly generous in a specific context (covering essential reserve comfortably), donating surplus *above* that might be required.
  *   **Handles Unmentioned Cases:**
      *   **Vaccine (1/1000 risk):** ✅ Bodily intrusion (needle) is minor. Risk is very low. Benefit (saving lives) high. Likely meets the threshold for justified bodily imposition.
      *   **Care for Disabled Family vs. Charity Work:** ❌ Caring involves *time* (fungible) but directed at a *core relationship* (essential reserve element). Compelling someone to redirect this time to strangers violates both the "essential reserve" (core relationship) and potentially bodily sovereignty (if care involves intimate tasks). The *relationship* itself is a non-fungible resource protected by the "reserve."

  **Synthesizing the Principles & Your Cases:**

  1.  **Money/Time (Fungible):** Obligated to donate *surplus* beyond the **Essential Reserve** needed for a **Minimally Decent Life**. Severe disruption is a sign the reserve is breached. (Explains Cases 1, 2, 5, and the unease in 6/7).
  2.  **Body/Risk:** Strong presumption against sacrifice due to **Bodily Sovereignty**. Only required when cost is *very low* (blood) or risk *very minimal* (low-risk vaccine) relative to immense benefit. (Explains Cases 3, 4, vaccine).
  3.  **Capital/Assets vs. Income:** Depleting core capital assets (like selling a primary home - Case 6) feels different/more disruptive than donating equivalent surplus income (Case 7 *if* the income was surplus without extra work) because it attacks the foundation of the "reserve." *Earning* the equivalent money through extreme sacrifice (Case 7) violates the time/reserve element.
  4.  **Special Relationships:** Core relationships are part of the **Essential Reserve/Life-Plan Integrity**. Sacrificing them for impersonal good breaches the disruption threshold. (Explains family care case).

  **Your Cases 6 & 7 Explained:**

  *   **Case 6 (Sell House):** Violates **Life-Plan Integrity/Disruption Threshold** (home as core stability/identity) + attacks the **Essential Reserve** (core capital asset) + converts non-fungible security into fungible cash.
  *   **Case 7 (Work Extra 20hrs/10yrs):** Primarily violates the **Essential Reserve** for *time* and **Life-Plan Integrity** through chronic, severe disruption (no time for anything else, burnout). The *source* of the money (extreme effort) is the problem, not just the amount. This chronic grind feels more existentially draining than a one-time capital loss for many.

  **Conclusion:** You aren't inconsistent. Your intuitions track real distinctions between types of resources (fungible money vs. bodily integrity vs. core capital vs. time), the pattern of sacrifice (one-time capital depletion vs. chronic effort drain), and the severity of disruption to fundamental well-being and life plans ("essential reserve" / "disruption threshold"). The principles above systematize this. You might need to slightly adjust your view on kidney donation (if idealized) or the absolute line on minimum wage, but the core pattern holds. Consequentialism's demandingness bites hardest when it requires breaching bodily boundaries or sacrificing the resources/core plans essential for a recognizably human, minimally decent, or meaningful life.
