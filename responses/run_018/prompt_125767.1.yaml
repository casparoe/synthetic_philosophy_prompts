  I recall existing positions: civic-republicanism often sees voting as a duty regardless of efficacy; expressive views emphasize symbolic value; abstentionism might reject voting entirely. I need to map these to the leaves. For example, a "yes" to the root and to expressive value might lead to civic-republican duty, while a "no" might lead to abstentionism. Lesser-evil could tie into complicity arguments. Epistemic duty relates to theories that stress informed participation.

