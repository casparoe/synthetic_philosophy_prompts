answer: |-
  ## Moral Obligations of Voting: A Commitment-Based Taxonomy

  **Root Claim:** Voting can be morally required even when it is causally inefficacious. (Does the respondent agree?)

  *   **Split 1: Expressive Value Under Flawed Options**
      *   ***Claim:*** "Even when every candidate on the ballot endorses some significantly unjust policy, casting a vote can still possess distinct moral value simply as an act of civic expression or protest." (Agree?)
          *   **Path 1A: Agrees expressive value persists with flawed candidates.**
              *   **Split 2: Lesser-Evil Permissibility vs. Complicity**
                  *   ***Case:*** "Consider a voter in a swing state facing two major candidates: Candidate A proposes harmful immigration policies, while Candidate B proposes harmful economic policies, though the voter judges A's policies overall as significantly less harmful than B's. Is voting for Candidate A *permissible* as choosing a 'lesser evil,' or is it *impermissible* because it constitutes morally significant complicity in Candidate A's harmful policies?" (Permissible Lesser-Evil or Impermissible Complicity?)
                      *   **Path 2A: Permissible as Lesser-Evil.**
                          *   **Split 3: Epistemic Duty to Research**
                              *   ***Claim:*** "A voter who casts a ballot without making a reasonable effort to understand the candidates' positions and the relevant issues commits a distinct moral wrong that makes their act of voting *worse* than simply abstaining would have been." (Agree that uninformed voting is worse than abstaining?)
                                  *   **Path 3A: Agrees uninformed voting worse than abstaining.**
                                      *   **Split 4: Delegability Anxiety (PR vs. WTA)**
                                          *   ***Case:*** "Compare two voters: Voter P lives under Proportional Representation (PR) where post-election coalition bargaining is complex, obscuring which parties/candidates are directly responsible for enacted policies. Voter W lives under a Winner-Take-All (WTA) system where the winning candidate/party has clear, direct accountability for enacted policies. Assuming both vote for parties/candidates whose policies later cause significant harm, does Voter P bear *less* moral culpability for that harm than Voter W *specifically because* the PR system dilutes direct accountability through coalition bargaining?" (Agree PR dilutes culpability relative to WTA?)
                                              *   **Leaf 1: Agrees culpability diluted in PR.** → **Unnamed:** This niche position (duty + expression + lesser-evil permitted + epistemic duty + diluted culpability in PR) seems underexplored; its combination of strong duties with attenuated culpability may be internally unstable or practically irrelevant.
                                              *   **Leaf 2: Disagrees; culpability *not* diluted in PR.** → **Civic-Republican Duty** (Emphasizes participation as constitutive of citizenship, permits lesser-evil, demands informed engagement, holds voters responsible regardless of institutional complexity).
                                  *   **Path 3B: Disagrees; uninformed voting *not* worse than abstaining (may be equal or better).**
                                      *   **Split 4: Delegability Anxiety (PR vs. WTA)**
                                          *   *(Same Case as Path 3A Split 4)*
                                              *   **Leaf 3: Agrees culpability diluted in PR.** → **Expressive Democratic Participation (Minimalist)** (Voting as expressive ritual/right, lesser-evil permitted, no strong epistemic duty, attenuated culpability in complex systems).
                                              *   **Leaf 4: Disagrees; culpability *not* diluted in PR.** → **Expressive Democratic Participation (Standard)** (Voting as expressive ritual/right, lesser-evil permitted, no strong epistemic duty, voter bears responsibility akin to endorsing the chosen candidate's platform).
                      *   **Path 2B: Impermissible Complicity.**
                          *   **Split 3: Epistemic Duty to Research**
                              *   *(Same Claim as Path 2A Split 3)*
                                  *   **Path 3A: Agrees uninformed voting worse than abstaining.**
                                      *   **Split 4: Delegability Anxiety (PR vs. WTA)**
                                          *   *(Same Case as Path 3A Split 4)*
                                              *   **Leaf 5: Agrees culpability diluted in PR.** → **Complicity-Sensitive Abstentionism (PR-Mitigated)** (Rejects voting as complicit act, sees uninformed voting as worse, finds culpability less direct in PR; may permit voting in specific PR contexts or mandate abstention only in clear WTA harms).
                                              *   **Leaf 6: Disagrees; culpability *not* diluted in PR.** → **Complicity-Sensitive Abstentionism (Standard)** (Rejects lesser-evil voting as complicity, sees uninformed voting as worse, holds voters responsible for chosen candidate's foreseeable harms regardless of system).
                                  *   **Path 3B: Disagrees; uninformed voting *not* worse than abstaining.**
                                      *   **Split 4: Delegability Anxiety (PR vs. WTA)**
                                          *   *(Same Case as Path 3A Split 4)*
                                              *   **Leaf 7: Agrees culpability diluted in PR.** → **Unnamed:** This position (duty? + expression? + lesser-evil complicit + no epistemic duty + diluted culpability) is incoherent; rejecting lesser-evil as complicity strongly implies *some* responsibility, making diluted culpability in PR conceptually incompatible with the core complicity objection.
                                              *   **Leaf 8: Disagrees; culpability *not* diluted in PR.** → **Strict Abstentionism (Complicity-Based)** (Voting for any flawed candidate is impermissible complicity; abstention is the only non-complicit option; epistemic issues secondary to complicity; culpability direct regardless of system).
          *   **Path 1B: Disagrees; no distinct expressive value persists with flawed candidates (or it's insufficient).**
              *   **Split 2: Lesser-Evil Permissibility vs. Complicity**
                  *   *(Same Case as Path 1A Split 2)*
                      *   **Path 2A: Permissible as Lesser-Evil.**
                          *   **Split 3: Epistemic Duty to Research**
                              *   *(Same Claim as Path 2A Split 3)*
                                  *   **Path 3A: Agrees uninformed voting worse than abstaining.**
                                      *   **Split 4: Delegability Anxiety (PR vs. WTA)**
                                          *   *(Same Case as Path 3A Split 4)*
                                              *   **Leaf 9: Agrees culpability diluted in PR.** → **Instrumental Lesser-Evil Voting (PR-Mitigated)** (Only instrumental harm reduction justifies voting; lesser-evil permitted; uninformed voting worse; culpability less in PR).
                                              *   **Leaf 10: Disagrees; culpability *not* diluted in PR.** → **Epistemic Abstentionism (Instrumentalist)** (Voting only justified if potentially efficacious *and* informed; lesser-evil permitted *if* informed & potentially causal; uninformed voting worse; voter bears responsibility for foreseeable consequences).
                                  *   **Path 3B: Disagrees; uninformed voting *not* worse than abstaining.**
                                      *   **Split 4: Delegability Anxiety (PR vs. WTA)**
                                          *   *(Same Case as Path 3A Split 4)*
                                              *   **Leaf 11: Agrees culpability diluted in PR.** → **Unnamed:** This position (no expression + lesser-evil permitted + no epistemic duty + diluted culpability) is unattractive; it lacks positive justification for voting beyond harm reduction while minimizing responsibility, risking instrumentalism without accountability.
                                              *   **Leaf 12: Disagrees; culpability *not* diluted in PR.** → **Pure Instrumentalism** (Voting only morally relevant if potentially causal; lesser-evil permitted only if potentially causal; no expressive value; no distinct wrong in uninformed voting if potentially causal; voter bears responsibility for chosen candidate's foreseeable harms).
                      *   **Path 2B: Impermissible Complicity.**
                          *   **Split 3: Epistemic Duty to Research**
                              *   *(Same Claim as Path 2A Split 3)*
                                  *   **Path 3A: Agrees uninformed voting worse than abstaining.**
                                      *   **Split 4: Delegability Anxiety (PR vs. WTA)**
                                          *   *(Same Case as Path 3A Split 4)*
                                              *   **Leaf 13: Agrees culpability diluted in PR.** → **Complicity-Sensitive Abstentionism (Instrumentalist PR-Mitigated)** (Rejects voting as complicit; no expressive value; uninformed voting worse; culpability mitigated in PR; abstention mandated unless causal efficacy is clear and complicity avoided – likely rare).
                                              *   **Leaf 14: Disagrees; culpability *not* diluted in PR.** → **Strict Abstentionism (Complicity-Based, Instrumentalist)** (Rejects all voting for flawed candidates as complicity; no expressive value; uninformed voting worse; culpability direct; abstention is the only permissible option).
                                  *   **Path 3B: Disagrees; uninformed voting *not* worse than abstaining.**
                                      *   **Split 4: Delegability Anxiety (PR vs. WTA)**
                                          *   *(Same Case as Path 3A Split 4)*
                                              *   **Leaf 15: Agrees culpability diluted in PR.** → **Unnamed:** This position (no expression + lesser-evil complicit + no epistemic duty + diluted culpability) is incoherent; rejecting lesser-evil as complicity necessitates attributing responsibility, contradicting the dilution claim.
                                              *   **Leaf 16: Disagrees; culpability *not* diluted in PR.** → **Strict Abstentionism (Complicity-Based, Non-Epistemic)** (Voting for flawed candidates is always impermissible complicity; abstention required; expressive value and epistemic diligence irrelevant to the core complicity objection).

  **Ambiguous Separation Pairs:** The taxonomy cannot cleanly separate **Leaf 7** (Path 1A-2B-3B-Diluted) from **Leaf 15** (Path 1B-2B-3B-Diluted) and **Leaf 8** (Path 1A-2B-3B-NotDiluted) from **Leaf 16** (Path 1B-2B-3B-NotDiluted). In both pairs, the disagreement on Split 1 (expressive value) becomes practically irrelevant once the core commitment to rejecting lesser-evil voting as complicity and rejecting a distinct epistemic wrong is combined with their respective positions on dilution. The core abstentionist logic dominates.

  **Summary:** This taxonomy yields 16 leaves; its most controversial split is likely **Delegability Anxiety** (Split 4), as it challenges conventional assumptions about voter culpability by introducing institutional design (PR vs. WTA) as a variable affecting moral responsibility for electoral outcomes.
