prompt: |-
  Okay so last night I got into this massive argument with my friend Dev about superrationality, Hofstadter's thing where if you know the other players reason like you do, you should pick the outcome you'd want everyone-similarly-situated to pick. It started over whether defecting in a one-shot prisoner's dilemma against a perfect copy of yourself is irrational, and three hours later we were yelling about voting and whether it makes sense to vote given your vote basically never swings anything. Dev's position is that superrationality is just dressed-up magical thinking, like you're causally influencing the other person by choosing, and I kept failing to explain why it's not that.

  Here's the thing: Dev hosts a board game night and he's now dared me to explain superrationality to his group in like 15 minutes while they set up. These are smart people, engineers and a nurse, but no philosophy background at all. I don't want the explanation itself, I want you to plan how I should do it, because I clearly suck at this.

  What I need from you:

  - The order the pieces have to come in. Like, what has to be in their heads before the core move of "your twin reasons the same way, so the real choice is between both-cooperate and both-defect" will even land as a move and not a trick. I suspect I led with the wrong thing with Dev.
  - The ONE example to build the whole thing around. I don't think it should be the classic prisoner's dilemma with payoff matrices, because the numbers make people think it's about arithmetic, and I also don't want to open with "imagine a perfect clone of yourself" because that's what made Dev say I'd left the real world entirely. So pick a better carrying case, tell me what it needs to have, and warn me what features it must NOT have or the whole thing collapses.
  - The misconceptions in the order these people will generate them. My guesses: (a) it's telepathy / you're somehow controlling the other player, (b) it's just Kant's categorical imperative with a sci-fi hat on, (c) it only works against literal identical copies so it's useless in real life, (d) it's just iterated-game cooperation where you cooperate because they'll punish you later. Tell me where in the sequence to head each one off, and whether any of them should actually be ALLOWED to sit for a while because correcting it too early costs you something.
  - One question or mini-scenario I can throw at them at the end that would show whether they got it, i.e. whether they can apply the idea to a case we didn't discuss rather than just nodding along. Ideally something that seperates "they understood the symmetry move" from "they just memorized cooperate good."
  - What I should explicitly refuse to get into in 15 minutes (the Löbian stuff? evidential vs causal decision theory? whether this actually solves anything in ethics?) and the one-line dodge for each if someone pushes.

  Also, fair warning: Dev will be there, and he will heckle. If the plan has a step that obviously fails on a skeptical engineer, flag it and give me a backup move. Don't recommend me readings, I won't read them, this is happening Thursday.
reasoning: |-
  Okay, the user has a tough challenge ahead. They need to explain superrationality to a group of smart but non-philosophy people in just 15 minutes, while dealing with a skeptical friend who heckles. The key is to make it intuitive and avoid common pitfalls that derailed their previous argument with Dev. 

  First, I need to understand what went wrong last time. Dev dismissed superrationality as magical thinking because the "perfect clone" framing felt unrealistic. The user also mentioned payoff matrices made it seem like arithmetic. So the approach must feel grounded and avoid sci-fi tropes. 

  The carrying example idea seems solid - it's relatable and has natural symmetry. Everyone has carried heavy things together. Important to emphasize the simultaneous choice aspect and mutual awareness. Must avoid any hint of telepathy; it's about shared reasoning, not mind control. 

  For the sequence: Start with the physical example to anchor intuition, then map to PD without numbers, then address voting as application. This order prevents the "unrealistic clone" objection by starting with real-world symmetry. 

  Biggest risks are misconceptions popping up. Need to preempt:
  - "Telepathy" fear: Kill this immediately by emphasizing "no spooky stuff, just logic"
  - "Only works with clones": Acknowledge partial validity but pivot to "close enough" scenarios like voting blocs
  - "Kant rip-off": Delay this, not worth fighting in 15 min
  - "Iterated game": Contrast explicitly - no future punishment here

  The voting question at the end tests if they grasp symmetry beyond literal clones. If they say "no" because one vote doesn't matter, they missed the point. If they see the bloc analogy, it landed.

  Time constraints mean avoiding:
  - Löb's theorem (obviously)
  - Decision theory debates
  - Ethics generalizations

  For Dev's heckling: If he says "but people aren't identical!", agree partially but stress the nurse example shows when symmetry assumptions hold well enough to apply. Don't get defensive. 

  The physicality of the carrying example is crucial - engineers and nurses will viscerally get shared effort. Much better than abstract matrices. Should make the "both lift or both don't" payoff obvious without numbers. 

  Biggest danger is rushing to the symmetry move before establishing mutual awareness. Must hammer: "You both know the situation is identical, and you both know the other knows..." before the punchline. 

  User's anxiety about time is palpable. Every element must pull double duty - the carrying example also sets up voting later. No tangents. If someone asks about Kant, literally say "Great question, but for today's 15 min let's stick to practical implications."
answer: |-
  Here's your tactical briefing for the 15-minute superrationality explainer, designed to survive Dev and land with engineers/nurses:

  **Core Objective:** Get them to *feel* the symmetry trap before analyzing it. Your job is to make "What if everyone in my position did this?" feel like the *natural* question, not a trick.

  **Order of Operations (The Critical Sequence):**

  1.  **Anchor in Shared Physical Experience (NOT clones, NOT matrices):**
      *   **Start Here:** "Okay, imagine you and a friend are carrying a really heavy couch up some stairs. *Exactly* the same height, strength, situation. You're at a tricky corner. If *both* of you lift hard at exactly the right moment, you get it around. If *both* hesitate or don't lift, it stays stuck but safe. If *one* lifts hard while the *other* hesitates... disaster. The lifter strains their back, couch might drop. You make eye contact. You *both* know this setup. What do you *actually* do?"
      *   **Why This Works:** Physical, visceral, symmetric, mutual awareness baked-in. Payoffs are obvious (success, safe failure, injury) without numbers. Avoids "clone" weirdness.
      *   **Listen:** They'll say "Both lift!" *Let them.* This is buy-in.

  2.  **Reveal the Symmetry Reasoning (The Core Move):**
      *   **Build the Logic:** "Right! But *why*? Think about your decision: You know your friend is smart, in the *exact same spot*, looking at *you*. You also know they're thinking the *same thing* about you. So, when *you* decide to lift hard... what are you *really* deciding? You're not *just* deciding *your* action in isolation. Because you know they reason like you, you're effectively choosing between two worlds: The world where *both* lift hard (success!) or the world where *both* hesitate (safe failure). The disaster world (one lifts/one hesitates) isn't a *real* option for either of you, because neither of you would rationally choose to be the *only* one lifting into a hesitation, knowing the other is thinking the same way. So the *real* choice is only between the two symmetric outcomes." Emphasize: **"You're choosing the outcome *type* you both end up in."**
      *   **Key Phrase:** "Because we're in the same boat and we *both know it*, the disaster option vanishes. We're stuck choosing together."

  3.  **Map to Prisoner's Dilemma (Briefly & Intuitively):**
      *   **The Analogy:** "That couch scenario is like the classic Prisoner's Dilemma game thinkers use. Cooperate = Lift Hard. Defect = Hesitate/Bail. Mutual Cooperation (both lift) is good. Mutual Defection (both hesitate) is okay-ish. But one-sided defection (you bail, they lift) is *great* for the defector and *terrible* for the cooperator. *But...* in that symmetric, mutually-aware situation, the one-sided outcomes aren't *real* choices because neither of you would walk into being the sucker. So again, the only *real* choice is between both cooperating (good) or both defecting (okay-ish). Superrationality says: pick the outcome you'd prefer *if everyone in your shoes picked the same thing*. So you Cooperate/Lift."
      *   **Avoid Matrices:** Describe the payoffs verbally. "Best selfish outcome, worst sucker outcome," etc.

  4.  **Introduce the Term & Voting Example (Application):**
      *   **Name It:** "That way of thinking – choosing based on what you'd want everyone identically situated to choose – is called *Superrationality*."
      *   **Voting:** "This is why Dev and I yelled about voting. You know your vote almost never swings the election alone. If you think 'My vote doesn't matter, I won't bother,' what happens *if everyone like you thinks that way*? Your whole bloc stays home, and maybe the worse candidate wins by default! The superrational question isn't 'Will *my single vote* change things?' (it won't). It's 'What outcome do I get if everyone *in my position* (cares about X, lives in my district, etc.) makes the *same choice* I'm making?' If everyone like you votes, your preferred candidate might win. If everyone like you stays home, they definitely lose. So, you vote."
      *   **Crucial Nuance:** Acknowledge it's not *perfect* symmetry like the couch (people aren't identical copies). But it's *close enough* symmetry within blocs where mutual awareness of shared interests exists.

  5.  **Address the Elephant in the Room (Dev's Heckle Bait):**
      *   **PRE-EMPT Misconceptions:** Weave corrections into the flow:
          *   **(a) Telepathy/Mind Control:** "This is **NOT** telepathy! It's **NOT** controlling the other person. It's pure game theory logic based on mutual awareness of identical reasoning in an identical situation. You both *independently* reach the same conclusion *because* the logic forces you to. If you lift, it's because you know *they know* the same logic, not because you magically made them lift." **(HEAD OFF IMMEDIATELY during couch/PD explanation)**
          *   **(b) Kant:** "Someone might say this sounds like 'What if everyone did that?' That's *similar*, but Kant is about universal moral rules. Superrationality is a *selfish* strategy for getting the best outcome *for you* in specific symmetric games where mutual predictability exists. It's game theory, not ethics." **(Address ONLY if someone brings it up, otherwise skip - use this as your one-line dodge)**
          *   **(c) Only for Clones/Useless:** "Okay, true, perfect clones are sci-fi. But **the core logic applies whenever situations are symmetric *enough* and players recognize that *others like them* are reasoning the same way.** Voting blocs, industry standards (like Betamax vs. VHS), even traffic norms ('Everyone should drive on the right'). It's about predictable group behavior from shared reasoning in shared circumstances." **(Address during voting example or when summarizing)**
          *   **(d) Iterated Games/Punishment:** "This is **different** from 'I'll cooperate so you cooperate next time.' That's tit-for-tat in *repeated* games. Superrationality works even in a *one-time* interaction like our couch move or a single vote, because the symmetry logic locks out the bad asymmetric outcomes *immediately*." **(CONTRAST EXPLICITLY during PD explanation)**

  **The ONE Example:** **The Couch Carry.** It has everything: symmetry, mutual awareness, clear catastrophic failure for asymmetry, obvious coordination benefit, physical intuition. **MUST NOT HAVE:** Any hint of communication after the setup (pure simultaneous decision), any difference between players, complex payoffs.

  **Test Question (Apply, Don't Parrot):**
  > "Imagine a small town with one narrow bridge. Traffic gets snarled if even *one* car tries to go when another is coming the opposite way. But if *everyone* follows an unspoken rule (like 'yield if you see headlights' or 'go only on the hour'), it flows fine. You're approaching the bridge alone. You see *no one* coming the other way *right now*. Should you just go, since you won't cause a jam *this instant*? Why/Why not from a superrational view?"

  *   **Why it works:** Tests if they see (1) symmetry (all drivers in same position), (2) mutual awareness (everyone knows the rule exists), (3) outcome-focused choice (going when you shouldn't *if others do it too* leads to chaos), (4) that individual causality ("I won't cause a jam *now*") misses the point. If they say "No, because if everyone thought that, the rule breaks and jams happen constantly," they got it. If they say "Just go, it's fine now" or "Cooperate good," they didn't.

  **What to BLOCK (One-Line Dodges):**
  *   **Löbian Stuff / Self-Reference:** "That's fascinating deep math about how systems prove things about themselves, but for *practical* superrational decisions today, the symmetry logic is enough." (Then pivot: "Back to the bridge...")
  *   **Evidential vs. Causal Decision Theory:** "That's a sharp philosophical knife-fight! Superrationality leans evidential, but for our 15 minutes, just think: symmetry forces the good outcome." (Pivot: "Like in voting...")
  *   **Does this Solve Ethics?:** "Superrationality is a cool tool for *coordination problems*, not a grand ethical theory. It tells you how to *win* certain games, not necessarily how to be *good*." (Pivot: "Speaking of winning, the couch gets up the stairs...")

  **Dev-Proofing & Heckle Management:**
  *   **Couch First:** Starting physical avoids his "left the real world" critique immediately.
  *   **"Not Telepathy!":** Beat him to this punch. Say it firmly during the core explanation.
  *   **His "Not Identical Copies!":** "Dev, you're right, perfect clones are fantasy. *But...* in the couch carry, are you and your friend identical? No! But are you *symmetric enough* in strength, position, and awareness of the problem *for this specific decision*? Absolutely. That's what matters. Think voting blocs." (Acknowledge his point, reframe "symmetric enough," pivot to application).
  *   **If He Interrupts Core Logic:** "Hold that thought Dev, let me get the basic move out first so everyone sees it, *then* hit me." (Then DO return to him after the core sequence).
  *   **Focus on Group:** "Interesting point Dev, but folks, what do *you* think about [bridge question]?" Leverage the group dynamic.

  **Execution Mantra:** KEEP IT MOVING. Anchor (Couch) -> Reveal Logic (Symmetry Trap) -> Name (Superrationality) -> Apply (Voting) -> Test (Bridge) -> Dodge Deep Dives. You've got this. Good luck Thursday!
