prompt: |-
  Design a realistic one-paragraph workplace thought experiment—no trolleys, no exotic technology—that engineers a precise three-way divergence among (1) a strict control-principle account of moral responsibility, (2) a pure quality-of-will account, and (3) a Nagel-style acceptance of resultant moral luck. The scenario should involve a technician, Maya, who performs an identical attentive, well-intentioned procedure in two parallel situations: in Case 1 an unforeseeable external power failure (entirely outside her control) causes a fatal accident despite her correct actions, while in Case 2 the same correct actions succeed because no failure occurs. Crucially, layer in a second variable: in Case 1 Maya had earlier skipped a voluntary, non-mandated equipment audit that was causally inert—the audit could not have prevented the power failure—whereas in Case 2 she completed it. The design must be such that the control-principle theorist assigns different blame across the cases solely due to the audit omission despite its causal irrelevance; the quality-of-will theorist assigns identical blame in both because her inner state was the same; and the resultant-luck theorist assigns different blame solely due to the fatal outcome, treating the audit as irrelevant. After presenting the scenario, show that each theory delivers the specified verdict and explain why; then isolate the exact structural feature (the pairing of a causally inert controllable omission with an uncontrollable outcome variance) that forces the divergence; indicate what happens if that feature is removed; and state how a defender of the worst-performing view would try to dissolve the case. Keep the entire response under 400 words. Do not request citations, bibliographies, or source lists.
reasoning: |-
  Hmm, the user wants me to design a workplace thought experiment that creates a precise three-way divergence among different theories of moral responsibility. They need a realistic scenario involving a technician named Maya who performs identical procedures in two parallel situations, with two variables: an uncontrollable power failure and a voluntary equipment audit that's causally inert.

  Let me think about how to structure this. I'll create a scenario where in Case 1, Maya skips a non-mandated audit and then an unforeseeable power failure causes a fatal accident despite her correct actions. In Case 2, she completes the audit and no failure occurs, leading to success. The audit must be irrelevant to preventing the failure to satisfy the causal irrelevance requirement.

  For the three theories: 
  - The control-principle theorist should blame Maya more in Case 1 due to skipping the audit (even though it couldn't prevent the accident).
  - The quality-of-will theorist should assign identical blame since Maya's intentions and attentiveness were the same in both cases.
  - The resultant-luck theorist should assign different blame solely based on the outcome, ignoring the audit entirely.

  The key structural feature is pairing a controllable omission (skipping audit) with an uncontrollable outcome variance (power failure). If I remove this pairing - say by making the audit causally relevant or the outcome controllable - the divergence disappears.

  For the defense of the worst-performing view (which seems to be control principle since it focuses on an irrelevant factor), a defender might argue that the audit omission reflects poorly on Maya's character regardless of causal impact, or that we should blame based on controllable factors to encourage diligence.

  I need to present this clearly within 400 words: first the scenario, then each theory's verdict with explanation, the structural feature, what happens without it, and the defense strategy. I'll make sure it's workplace-realistic without trolleys or sci-fi elements.
answer: |-
  **Scenario:** Maya, a chemical plant technician, always performs high-pressure valve calibrations with care. Today, she correctly calibrates Valve X in two parallel timelines. In **Case 1**, Maya skipped an entirely voluntary, non-mandated equipment audit yesterday; this audit only checked secondary backup systems unrelated to Valve X's primary power feed. An unforeseeable, massive external grid failure (completely beyond Maya's control or anticipation) occurs during her calibration, causing a catastrophic explosion killing two workers. The skipped audit could not have detected or prevented this specific grid failure. In **Case 2**, Maya performed the voluntary audit (which found nothing) and then identically calibrated Valve X correctly; no external grid failure occurs, and the procedure succeeds safely.

  **Verdicts & Explanations:**
  1.  **Control Principle:** Blames Maya more in Case 1 *solely for skipping the audit*. Though the omission caused no harm, it was a controllable lapse in fulfilling a (non-mandated) duty of due diligence. Case 2 shows full control exercised. The uncontrollable outcome is irrelevant; blame tracks controllable choices.
  2.  **Quality-of-Will:** Assigns identical (minimal or no) blame in both cases. Maya’s attentive procedure demonstrated identical good will and competence during the critical act in both timelines. Her earlier decision about the causally inert audit doesn’t reflect on the will displayed *during* the safety-critical task itself.
  3.  **Resultant Moral Luck:** Blames Maya more in Case 1 *solely due to the fatal outcome*. The actual harmful result alters moral assessment, making her actions "worse" despite identical intentions/actions. The skipped audit is irrelevant; only the luck-determined outcome matters.

  **Structural Feature:** The divergence is forced by pairing a *controllable but causally inert omission* (skipping the audit) with an *uncontrollable outcome variance* (external power failure vs. no failure). This creates distinct loci for blame: a controllable input (audit) irrelevant to the outcome, and an outcome irrelevant to control or will.

  **Removing the Feature:** If the audit *could* have prevented the failure (making omission causally relevant), Control and Luck might converge on blaming Case 1 more (for different reasons), while Quality-of-Will still resists. If the failure was foreseeable/controllable, Control and Luck might blame Case 1 more, diverging from Quality-of-Will.

  **Defending the Weakest View (Control Principle):** A defender would argue the skipped audit *is* morally significant independently of causal impact. It reflects a poorer character trait (laxity) or violates a non-consequentialist duty of care/conscientiousness, making Maya blameworthy for that choice *regardless* of the unforeseeable consequences. The bad outcome merely highlights the importance of such duties.
