  The user seems to be searching for a conceptual framework to articulate this "structural complaint." They mention it doesn't fit non-identity arguments or traditional equality concerns. I recall Derek Parfit's work on impersonal harm and neutrality, but even that might not fully capture this. The homogeneity aspect feels new—like valuing diversity for its own sake in a population ethics context.

  Hmm, the user might also be subtly concerned about justifying urban planning decisions where traditional ethics frameworks fall short. As a PhD student, they likely need rigorous terminology for their thesis. The coined term should precisely distinguish this from adjacent concepts. "Structural Population Homogeneity" (SPH) comes to mind—focusing on trait distribution patterns rather than individual welfare.

  I should define SPH carefully. It's impersonal, concerns emergent properties of populations, and is distinct from inequality because no one is disadvantaged. The vulnerability lies in whether such patterns matter morally without victims. If homogeneity caused indirect harms (e.g., less resilience), it might collapse into impersonal harm. Or if the traits affected welfare, it could become a standard equality issue. But as posed, it's a pure structural concern.

