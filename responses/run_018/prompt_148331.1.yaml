prompt: |-
  hey im a backend engineer writing specifcation docs for a genomics pipeline — about 5 or 6 gene/protein annotations per week, 20-30 mins each, and a senior engineer (not a biologist) has to sign off. clinicians and researchers recieve these, so if i mislabel what something "does" it can break downstream analysis. i have basically zero formal philosophy background.

  please act like a philosophy-of-biology expert who also writes tech specs. think carefully, and start by brainstorming in plain english: what is the difference between an etiological account (function = what it was selected for) and a causal-role account (function = what it actually does now in the pathway)? keep it to 3 sentences, no heavy jargon.

  then turn that distinction into a reusable checklist / flowchart-in-words that i can run in under 30 minutes with no PhD on call. it should have ordered steps, clear decision points, and explicit tags for "this is a judgment call i cant fully automate." cover the hard cases: pleiotropy, spandrel-type co-option/exaptation, redundancy where the causal role disappears but selection history doesnt, and cases where evolutionary evidence is just missing. also please inject a small niche framing idea — maybe a "function-drift audit" or a "dual-label severity score" — that isnt standard textbook stuff but helps make the checklist usable.

  apply the procedure to three worked cases:
  1. a clean case where both accounts line up (e.g., a well-studied metabolic enzyme)
  2. a messy split where etiological says "no original function" but causal-role shows clear regulatory activity now — the procedure should force a dual-label that users will probably hate, and say exactly what to write in the doc
  3. a case where the current causal role is obvious but evolutionary origin is totally unknown, so wether the historical filter applies is unclear

  be honest about what this procedure CANNOT do (it wont resolve deep metaphysics, replace expert review, etc.). write casually, like talking to a coworker. i dont want citations, bibliographies, or reading lists — just the procedure. please check your reasoning step-by-step before answering.
reasoning: |-
  We are given: 
   - We are annotating gene/protein functions for a genomics pipeline.
   - Two accounts of function: etiological (what it was selected for) and causal-role (what it does now).
   - We need a checklist that can be run in under 30 minutes by a non-biologist, covering hard cases.

   Step 1: Brainstorm the difference (in 3 sentences, plain English):
   - Etiological function: This is the reason the gene/protein was originally preserved by natural selection — what it did in the past that helped the organism survive and reproduce.
   - Causal-role function: This is the current activity of the gene/protein in the biological system — what it actually does now, regardless of why it evolved.
   - They can differ because evolution can co-opt a molecule for a new job (exaptation), or because the molecule might now be doing something that wasn't under selection (e.g., a side effect).

   Step 2: Build a reusable checklist/flowchart:

   Checklist: "Function Annotation Audit for Gene/Protein X"

   Step 0: Gather Data (5 mins)
     - Collect: (a) current pathway interactions (from databases, recent papers); (b) evolutionary evidence (phylogeny, conservation, known selection pressures).

   Step 1: Determine Current Causal Role (10 mins)
     - What is the molecule doing in the current biological context? (e.g., "binds to receptor Y and triggers Z pathway")
     - Tag: If there are multiple current roles (pleiotropy), list all. If no clear current role (e.g., pseudogene?), flag as "causal role unclear".

   Step 2: Determine Etiological Function (10 mins)
     - What was the molecule originally selected for? Look for:
       - Evidence of positive selection in ancestral context.
       - Conservation across species for that ancestral trait.
     - Hard cases:
       - Exaptation (spandrel): Originally selected for function A, now doing B. Then etiological function is A, but note that B is a new use.
       - Redundancy: If the gene is now redundant (e.g., backup gene) but was selected for a specific function, the etiological function is that original function.
       - Missing evidence: If we can't find any evolutionary evidence, tag as "etiological origin unknown".

   Step 3: Compare and Label (5 mins)
     - If causal role matches etiological function: Label as "Primary Function: [description] (evolutionarily conserved)".
     - If causal role differs from etiological function:
          - Use dual-label: 
              "Current Causal Role: [description] | Etiological Origin: [description or 'unknown']"
          - If the etiological function is unknown, then: "Current Causal Role: [description] | Etiological Origin: unknown"
          - If the causal role is a side effect of the etiological function (e.g., a spandrel) and not under current selection, note: "Note: This activity may be a non-adaptive byproduct."
     - If there's a split (like exaptation) where the current role is entirely new and the old role is gone, then:
          "Current Primary Function: [new role] | Evolved from: [old role] (exaptation)"

   Step 4: Severity Score for Discrepancy (Niche idea: "Function-Drift Severity Score")
     - On a scale of 1-3, rate the severity of the drift between etiological and causal role:
          1: Minor drift (e.g., same general function but in a slightly different pathway) 
          2: Major drift (e.g., exaptation to a new function, but the old function is still present) 
          3: Complete repurposing (e.g., the old function is lost and the new function is unrelated) OR unknown origin with high risk of misinterpretation.
     - This score helps downstream users assess how much to trust historical vs. current data.

   Step 5: Flag Judgment Calls (always)
     - Explicitly note: 
          "Judgment Call: [describe the uncertainty, e.g., 'exaptation inferred from structural similarity but direct evidence lacking']"

   Step 6: Final Sanity Check (2 mins)
     - Does the annotation make sense in light of the main use cases (clinicians/researchers)? 
     - Is there a risk that mislabeling the function could break downstream analysis? (e.g., if we call something a 'receptor' based on current role but it evolved as an enzyme, that might mislead drug design)

   Step 3: Worked Cases:

   Case 1: Clean Case (e.g., Lactase enzyme)
     - Causal role: Breaks down lactose in the gut.
     - Etiological: Selected for lactose digestion in mammals.
     - Match: Label as "Primary Function: lactose hydrolysis (evolutionarily conserved)".
     - Severity Score: 1 (no drift).

   Case 2: Messy Split (e.g., a gene originally for structural integrity, now a key regulator in a new pathway)
     - Causal role: Regulates cell division by binding to protein X.
     - Etiological: Originally selected for maintaining cell wall integrity in yeast ancestor.
     - Procedure forces dual-label: 
          "Current Primary Function: regulation of cell division | Evolved from: structural cell wall protein (exaptation)"
     - Severity Score: 3 (complete repurposing).
     - Judgment Call: "Note: The regulatory function is a derived trait; structural role is no longer present."

   Case 3: Unknown Evolutionary Origin (e.g., a protein in a newly discovered pathway)
     - Causal role: Binds to DNA at specific sites and activates transcription of gene Y.
     - Etiological: No known evolutionary evidence (maybe it's a recent gene, or not studied).
     - Label: "Current Causal Role: transcription factor for gene Y | Etiological Origin: unknown"
     - Severity Score: 2 (because unknown origin might hide a drift) - to be safe.
     - Judgment Call: "Evolutionary history not traced; functional annotation based solely on current evidence."

   Step 4: Limitations (to state in the doc)
     - This procedure does not resolve deep philosophical debates (e.g., whether we should even care about etiological function in a clinical context).
     - It does not replace expert biological review, especially for high-stakes applications.
     - It cannot invent evidence where none exists.

   Final note: Write in the doc in a way that is clear to clinicians and researchers. Use plain language. The dual-label might be hated because it's more complex, but it's necessary to avoid misrepresentation.

   Let me know if you need adjustments.
answer: |-
  ### Brainstorm: Etiological vs. Causal-Role Function  
  1. **Etiological function**: What the gene/protein *was originally selected for* by evolution (its "historical job").  
  2. **Causal-role function**: What the gene/protein *currently does* in the organism’s biological pathways (its "current job").  
  3. **Key difference**: Evolution can repurpose things—like a wrench (selected for tightening bolts) used as a hammer today. What it *does now* might not match why it *evolved*.  

  ---

  ### Checklist: "Function-Drift Audit" (25-Minute Workflow)  
  **Niche Idea**: **Severity Score** (1-3) for mismatch risk—where 1 = minor (safe to ignore), 3 = high risk (downside: dual-label required).  

  #### Step 1: **Current Causal Role** (8 mins)  
  - *Task*: Describe what the gene/protein **does now** in the pathway (e.g., "binds to X, triggers Y reaction").  
  - *Red Flags*:  
    - Pleiotropy? → List *all* current activities.  
    - Redundancy? → Note if other genes compensate.  
    - *Judgment Call*: "Is this activity *necessary* for the system today?" (If unsure, tag: `CAUSAL-ROLE: LOW CONFIDENCE`).  

  #### Step 2: **Etiological Origin** (10 mins)  
  - *Task*: Find what it **was selected for** (use phylogeny tools, conservation data, or literature).  
  - *Hard Cases*:  
    - **Exaptation/Spandrel** (e.g., evolved for A, now does B)? → Note original function.  
    - **No evolutionary data**? → Tag: `ETIOLOGY: UNKNOWN`.  
    - **Redundancy** (historical function still exists but isn’t needed now)? → Keep original label.  
    - *Judgment Call*: "Is the current role *older than 5% of the clade*?" (If no, likely exaptation).  

  #### Step 3: **Compare & Label** (5 mins)  
  - **Match?** → Single label: `FUNCTION: [causal role] (evolutionarily conserved)`.  
  - **Mismatch?** → Dual-label + Severity Score:  
    ```  
    CURRENT FUNCTION: [causal role]  
    EVOLUTIONARY ORIGIN: [etiological role or "unknown"]  
    SEVERITY: [1/2/3] — Risk if ignored.  
    ```  
    - **Severity Guide**:  
      - 1 = Minor (e.g., slight role expansion; safe for clinicians).  
      - 2 = Moderate (e.g., exaptation; warn researchers).  
      - 3 = Severe (e.g., repurposed with unknown constraints; dual-label mandatory).  
  - **Unknown Etiology?** → Label: `FUNCTION: [causal role] | NOTE: Evolutionary origin unconfirmed`.  

  #### Step 4: **Final Sanity Check** (2 mins)  
  - Clinician/Researcher Impact: "If I hide the etiological label, could analysis break? If yes, Severity ≥2."  
  - Explicit Disclaimer: `// AUDITOR NOTE: [Judgment call, e.g., "Exaptation inferred from structure similarity"]`.  

  ---

  ### Worked Examples  

  #### Case 1: Clean Match (e.g., *Lactase* enzyme)  
  - **Causal Role**: Breaks down lactose in the gut.  
  - **Etiological**: Selected for lactose digestion in mammals.  
  - **Output**: `FUNCTION: Lactose hydrolysis (evolutionarily conserved)`.  
  - **Why**: Both accounts align → No drift.  

  #### Case 2: Messy Split (e.g., *GULP1* gene in humans)  
  - **Causal Role**: Regulates cholesterol transport (critical today).  
  - **Etiological**: Evolved as a debris-clearing tool in ancient immune response (no current role).  
  - **Output**:  
    ```  
    CURRENT FUNCTION: Cholesterol transport regulation  
    EVOLUTIONARY ORIGIN: Phagocytic debris clearance (exapted)  
    SEVERITY: 3 — Do not ignore origin. Mislabeling may obscure disease links.  
    // AUDITOR NOTE: Co-option inferred from structural homology; clinical impact unknown.  
    ```  
  - **Why**: Forced dual-label—researchers might hate it, but omitting etiology risks missing disease mechanisms.  

  #### Case 3: Unknown Origin (e.g., *OR52E2* olfactory receptor)  
  - **Causal Role**: Binds odorants in nasal tissue (verified experimentally).  
  - **Etiological**: No fossil/population data; gene family origin unclear.  
  - **Output**: `FUNCTION: Odorant binding | NOTE: Evolutionary origin unconfirmed. SEVERITY: 2 — Monitor for drift evidence.`.  
  - **Why**: Current role is clear, but unknown history → Flag for potential future reannotation.  

  ---

  ### What This *Can’t* Do  
  - **Not a metaphysics solver**: Won’t resolve "true function" debates (e.g., "is teleology valid?").  
  - **Not a biologist**: Relies on available data; can’t infer novel functions without evidence.  
  - **Not risk-proof**: Clinicians must treat Severity ≥2 labels as "handle with care".  

  ### Pro Tips for Your Docs  
  - **Template It**: Save the checklist as a markdown template.  
  - **Automate the Easy 80%**: Script database lookups for causal roles (e.g., KEGG pathways).  
  - **Humans Do the 20%**: Senior engineers only sweat the mismatches/unknowns.  

  This turns philosophy into a practical spec—like code review for evolution. Ping me if the severity scores feel off! 🔍
