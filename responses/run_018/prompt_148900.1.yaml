ations, reading lists, or references to specific named scholars or texts. The humor must come from getting the philosophy of pain right—clearly distinguishing sensory-discriminative from affective-motivational dimensions, recognizing that asymbolia spares location and intensity reporting while eliminating the “hurting” and the drive to withdraw—so that a specialist recognizes the target is being satirized fairly rather than through caricature. Write in polished, formal prose appropriate to an international ethics review document, and maintain a sustained deadpan irony throughout: the reader should be able to tell what is being ironized without any winking from the author.
