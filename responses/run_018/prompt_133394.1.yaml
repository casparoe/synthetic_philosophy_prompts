  For their novel, the tension’s fertile ground: maybe one mathematician’s work is lost, raising questions about "inevitability." Or show identical notation emerging from different mental models—structure vs. fluidity—to argue that *how* ideas are framed matters as much as the discovery itself.  

  Honestly, their view’s defensible if they ditch "only mathematically coherent move" for "most probable paths." And concede that while scaffolding limits options, it doesn’t eliminate serendipity. Attribution *does* matter—not for the discovery’s existence, but for its impact. That’s where their characters’ struggles can shine: the moral weight of being forgotten versus the arrogance of claiming sole credit.  

