answer: |-
  Here is the defended research agenda, ranked by priority and justified against your criteria:

  **Ranking: A > B > C**  
  *(Phenomenal-Concept Strategy > Ability-Knowledge Boundary > Extrapolation Problem)*

  ---

  ### **1. Cluster A: Phenomenal-Concept Strategy (Year 1)**  
  **Defense:**  
  - **(1) Dependency:** **A is foundational** to B and C.  
    - *Downstream Impact:* B (ability-knowledge) cannot be sharply analyzed without clarifying whether phenomenal concepts are irreducible (A). If phenomenal concepts *are* physicalistically acceptable, B collapses into a dispute about cognitive architecture, not metaphysics. C (extrapolation) relies entirely on whether A reveals an epistemic or ontological gap—settling A determines if C is even coherent.  
    - *Upstream Independence:* A requires no prior resolution of B/C. Debates about knowledge types (B) or cross-species attribution (C) presuppose an account of what phenomenal *properties* are.  

  - **(2) Tractability:** **Moderate, with stable tools.**  
    Existing frameworks (e.g., 2D semantics, conceptual role theories) are robust enough to test whether phenomenal concepts require non-physical grounds. The challenge is avoiding question-begging (e.g., defining "physical" circularly), but no radical innovations are needed—only rigorous application.  

  - **(3) Payoff:** **Decisive for physicalism.**  
    A "win" for either side resolves the core debate:  
    - If phenomenal concepts *are* physically explicable → physicalism survives Mary unscathed.  
    - If they *require* non-physical grounding → property dualism is unavoidable.  
    *Reversal Condition:* If B could prove Mary gains *only* abilities (no new facts), A becomes redundant. But B alone cannot rule out that abilities *presuppose* non-physical concepts—so A’s priority stands unless B is resolved *first* (unlikely; see B’s tractability).  

  - **(4) Resource Sensitivity:** **Non-droppable.**  
    If cut to two years, **retain A**. Without A, conclusions in B/C lack metaphysical grounding (e.g., debating "ability vs. knowledge" without knowing if phenomenality is physical is taxonomy without ontology).  

  ---

  ### **2. Cluster B: Ability-Knowledge Boundary (Year 2)**  
  **Defense:**  
  - **(1) Dependency:** **B depends on A, weakly informs C.**  
    - *Requires A:* Whether Mary’s gain is propositional or practical hinges on A’s outcome. If A shows phenomenal concepts are physical, B reduces to cognitive psychology (e.g., "How does neurobiology enable recognition?"). If A supports dualism, B becomes critical for *diagnosing* the gap’s nature.  
    - *Informs C indirectly:* B clarifies *what* is missing in Mary (e.g., recognitional capacity), aiding extrapolation to non-human cases—but only after A defines the gap’s status.  

  - **(2) Tractability:** **Low, requiring innovation.**  
    Current tools (e.g., propositional vs. non-propositional knowledge distinctions) are unstable here. Avoiding circularity demands new criteria for "ability" independent of phenomenality (e.g., computational models of recognition). High risk of dead ends.  

  - **(3) Payoff:** **Taxonomic, not decisive.**  
    Best-case: B shows Mary’s deficit is *merely* recognitional → physicalists deflect the "new fact" charge. Worst-case: B fails to dissolve the propositional challenge → dualists claim victory. But B cannot *resolve* physicalism alone; it only sharpens the dialectic.  
    *Reversal Condition:* If A concludes phenomenal concepts *are* physical, B’s urgency drops (it becomes empirical). If A fails conclusively, B gains priority to salvage a physicalist-friendly gap analysis.  

  - **(4) Resource Sensitivity:** **Retain if A is resolved.**  
    If cut to two years, **drop B only if A is settled decisively**. If A supports physicalism, B is a refinement; if A supports dualism, B becomes critical for damage control.  

  ---

  ### **3. Cluster C: Extrapolation Problem (Year 3)**  
  **Defense:**  
  - **(1) Dependency:** **C wholly depends on A and B.**  
    - *Requires A/B:* Generalizing Mary’s gap presupposes knowing *what* the gap is (A: ontological/epistemic) and *how* it manifests (B: knowledge vs. ability). Without A/B, C’s criteria for cross-species attribution are circular or arbitrary.  

  - **(2) Tractability:** **High, but derivative.**  
    Tools exist (e.g., theory-laden criteria for consciousness attribution), but progress requires A/B’s outputs. If A/B are resolved, C is engineering (applying criteria); if not, C is paralyzed.  

  - **(3) Payoff:** **Downstream application.**  
    C’s outcomes (e.g., "Can AI have Mary-like gaps?") cannot alter the physicalism debate—they only *apply* A/B’s conclusions. Success here is policy-relevant (e.g., AI ethics) but philosophically secondary.  
    *Reversal Condition:* If C revealed a *dissociation* (e.g., entities passing behavioral tests but having Mary-gaps), it might force reevaluating A—but this is empirically unlikely and still requires A to interpret.  

  - **(4) Resource Sensitivity:** **First to drop.**  
    If cut to two years, **drop C unconditionally**. C is an application of A/B; its exclusion sacrifices no core conclusions. A/B determine whether "Mary-gaps" matter metaphysically; C merely explores their distribution.  

  ---

  ### **Trade-offs Accepted & Agenda Reversals**  
  - **Core Trade-off:** Prioritizing metaphysics (A) over epistemology (B) and application (C). This accepts that B/C cannot meaningfully progress without A, risking Year 1 on the hardest cluster.  
  - **Reversal Triggers:**  
    - Demote A if B *proves* Mary gains only abilities *without* invoking phenomenality (e.g., via a computational model of "release" as sensorimotor calibration).  
    - Promote C if A/B stalemate, and empirical work (e.g., neuro-correlates of invertebrate consciousness) forces the issue.  
  - **Yearly Breakdown:**  
    - **Year 1:** Resolve A (e.g., test if physicalism can explain concept acquisition).  
    - **Year 2:** Resolve B given A (e.g., if A is physicalist, model recognition computationally; if dualist, probe knowledge/ability distinctions).  
    - **Year 3:** Apply A/B to C (e.g., build non-circular attribution criteria for AI).  

  This agenda treats Mary’s case as a metaphysical litmus test (A) first, an epistemological puzzle (B) second, and an applied challenge (C) last—ensuring scarce resources attack the debate’s core before its periphery.
