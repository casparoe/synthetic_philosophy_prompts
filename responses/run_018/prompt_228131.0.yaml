prompt: |-
  I'm a novelist, and moral worth is basically my professional obsession — I'm constantly deciding whether what a character did was admirable, and I've noticed I keep reaching for a set of working assumptions that might not actually cohere. Can you audit them? Here they are:

  1. Whether something has moral worth depends on why the person did it, not on whether it turned out well or even on whether it was the right thing to do.
  2. The people I most admire, on the page and off, act from immediate unreflective compassion — they jump in the river before there's been time to think. Visible deliberation about what one ought to do is, if anything, a bad sign about a person's character.
  3. Moral worth can't be a matter of luck: two people who would behave identically in every possible situation, differing only in which feelings happen to well up in them, deserve the same moral grade.
  4. Impure motives don't ruin anything. Almost nobody's motives are spotless, and if some vanity or self-interest rides along with the good motive, the act still counts as admirable.
  5. The way to find out what actually moved someone is counterfactual: take away the audience, the good mood, the crush, and ask whether they still would have done it.

  Tell me which of these are genuinely in tension and roughly how severe each tension is, which pairs only look like they're in tension but aren't, and for the real ones what the cheapest fix would be and what it costs me. This matters alot for the book I'm drafting, but I don't want a lecture on the history of ethics — just the audit.
reasoning: |-
  Okay, let me approach this systematically. The user is a novelist with five working assumptions about moral worth in character development that need auditing for coherence. Their core request is to identify tensions between these principles, assess severity, suggest cheap fixes, and clarify non-tensions—all without philosophical digressions. 

  First, I notice the user operates in a very specific context: judging characters' admirability through action-motivation dynamics. Their assumptions reveal a clear preference for intuitive virtue over calculated morality (assumption 2), motive-based evaluation regardless of outcome (1), and psychological realism about mixed motives (4). The counterfactual test in 5 suggests they value authentic motivation detection—this feels like a writer's tool for plausibility.

  Now scanning tensions:
  - Assumption 2's valorization of unreflective compassion directly challenges assumption 3's "no luck" requirement. If moral worth depends on spontaneous feelings (which are luck-dependent), how can two people with identical behavioral dispositions but different emotional reflexes deserve equal grading? This is a severe tension—it strikes at whether virtue is innate or cultivated.
  - Assumption 1 and 2 might seem to conflict with 5, but actually complement it: if motives define worth (1), and worth favors spontaneity (2), then testing motive purity via counterfactuals (5) becomes essential. No tension here.
  - Assumption 4's tolerance for impure motives could weaken assumption 3's demand for equal grading: if Person A's altruism has 10% vanity while Person B's is pure, do they still "deserve the same moral grade" when all else is equal? Moderate tension—requires clarifying if "feelings" in 3 include motive impurities.

  Cheapest fixes:
  - For 2 vs 3: Soften 2 to value cultivated spontaneity. Cost: Loses romanticism about pure instinct but gains coherence. 
  - For 3 vs 4: Specify that "feelings" in 3 refers to emotional reflexes, not motive blends. Cost: Minor complexity increase when grading characters.
  - Noting that 1/5 already form a coherent engine for assessing motive-driven worth.

  The user's urgency about their draft suggests fixes must preserve narrative utility. Their rejection of ethics lectures means solutions should feel like tool adjustments, not philosophy imports.
answer: |-
  Here's the audit of your moral worth assumptions, mapped for tensions, severity, and minimal-cost fixes:

  **Core Tension (Severe): Assumption 2 vs. Assumption 3**  
  - **Conflict:** #2 prizes *immediate, unreflective compassion* as morally superior, while #3 insists moral worth *can't depend on luck* (like whether compassion "happens to well up"). If spontaneity defines worth, two people with identical dispositions but differing spontaneous reactions (e.g., one feels compassion instantly, the other feels panic first) would be graded differently—violating #3’s "no luck" rule.  
  - **Cheapest Fix:** Modify #2 to value **reliably cultivated compassion** (e.g., "Acting from compassion that has become second nature through habit"). *Cost:* Loses romanticism of pure spontaneity; admirability now requires latent character development.  

  **Moderate Tension: Assumption 1 vs. Assumption 5**  
  - **Conflict:** #1 says moral worth hinges *only on motive* (why they did it), but #5’s counterfactual test implies motives are **fragile and context-dependent**. If removing a crush or audience changes the action, was the motive ever "pure" enough to carry moral weight per #1? This undermines #1’s stability.  
  - **Cheapest Fix:** Tighten #1: Moral worth depends on the *operative motive in the actual context*, judged holistically. *Cost:* Accepts that motives are messy and situational; less emphasis on finding a "true" core self.  

  **Apparent but Resolvable Tensions:**  
  - **#2 vs. #4:** Unreflective compassion (#2) seems incompatible with impure motives (#4), but they can coexist. *Resolution:* Spontaneity doesn’t guarantee purity; someone can jump in the river *both* out of compassion *and* vanity. #4’s tolerance saves #2 from unrealistic idealism.  
  - **#3 vs. #4:** If two people have identical dispositions (#3), but one acts with minor vanity (#4), is worth equal? *Resolution:* #4 allows impurities *if the good motive is primary*. If the vanity is incidental, their "moral grade" remains equal per #3.  

  **Non-Tensions (Reinforcing Pairs):**  
  - **#1 and #5:** #1’s focus on "why" is operationalized by #5’s counterfactual test. They’re a coherent engine for probing motives.  
  - **#4 and #5:** #5’s test (e.g., "Would they do it without an audience?") directly exposes the impurities #4 forgives.  

  **Minimal Revisions for Full Coherence:**  
  1. Keep #1 (motive-centric), #4 (impurity-tolerant), and #5 (counterfactual test) intact—they form a robust core.  
  2. **Revise #2:** *"The people I most admire act from compassion that feels immediate—whether instinctive or cultivated—with minimal self-interested calculation."*  
     → *Cost:* Sacrifices the *unreflective* ideal but keeps the "no overthinking" spirit.  
  3. **Clarify #3:** *"Moral worth isn’t luck-based: two people with identical character traits (including their capacity for compassion) deserve the same grade, even if circumstances trigger different initial feelings."*  
     → *Cost:* Accepts that initial feelings (panic vs. compassion) may vary without defining worth, as long as their *underlying character* is identical.  

  **Why This Works for a Novelist:**  
  - Your counterfactual tool (#5) remains central for diagnosing motives.  
  - Admirable characters can still act quickly (#2 revised), but their worth stems from *who they’ve become* (aligned with #3), not accidents of emotion.  
  - Moral complexity (#4) is preserved without undermining judgments (#1).  
  - **Net Cost:** Lets you keep spontaneity *as a narrative device* while grounding admirability in reliable character—making arcs more satisfying.  

  No ethics lecture—just a streamlined toolkit. Use what fuels your draft.
