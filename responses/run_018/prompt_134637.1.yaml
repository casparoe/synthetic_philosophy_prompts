prompt: |-
  hey so im running a podcast for my schools philosophy club and next week im talking to this philosopher who defends something she calls reconstructive absurdism. she takes camus really seriously about life being absurd but thinks he stops way too early—like instead of just pushing the rock she thinks we build local meaning inside the absurd, but only if we reject those objective-list theories that say meaning has to fit some pre-made list of valuable things. she also goes after that view from susan wolf about fitting fulfillment, saying it sneaks objectivity in through the back door with all that talk about fittingness. i need like 7 or 8 interview questions that actually dig in, not just "explain your view" stuff. specifically i want one about whether shes just doing subjectivism with extra steps, one about why constructing meaning inside absurdity isnt self-defeating—like if nothing ultimately matters then why does the construction matter—and for each of those a follow-up keyed to her probably saying its reconstruction not collapse. i also need one pressing her critique of objective-list theories, especially with a follow-up for when she claims fittingness is just disguised normativity. and can you include a question about what she says to people who think absurdism is basically depression with a philosophy degree? please keep it casual, im a high schooler, maybe with a typo or two, and dont ask for citations or reading lists since i dont have library access for this.
