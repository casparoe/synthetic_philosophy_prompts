                      V(choice at t=3) = δ(1) * [max(2, 5*δ(3))]   [if we assume that in round 3 they will choose the best option]

              But if they are naive, they might think that in round 3 they will choose the delayed reward (because 5*δ(3) > 2). But then when they get to round 3, they actually have:

                  max(2, 5*δ(3)) 

              and if δ(3) is small enough (because hyperbolic discounting has a high discount rate in the short term) then 5*δ(3) might be less than 2.

              So the reversal happens because the discount factor applied to the 5 at time 3 (when you are at time 0) is δ(3), but when you are at time 3, the 5 is still 3 rounds away (so discount factor δ(3) from the new present) but now the immediate 2 is available. And if the discount factor δ(3) is less than 2/5, then they take the 2.

              However, in round 2, they thought that in round 3 they would value the 5 at 5*δ(3) and that would be greater than 2. But that assumes that the discount factor for 3 rounds is the same from round 2 as it is from round 3? Actually, from round 3, the delay for the 5 is 3 rounds, so the discount factor is δ(3). And from round 2, looking at the 5 in round 6 (which is 4 rounds away) the discount factor is δ(4). But they are not evaluating the 5 in round 6 from round 2 for themselves? they are evaluating what the round 3 self will do.

              The key is that the round 2 self, if they are naive, think that the round 3 self will use the same discount factor as they do for future periods? But actually, the round 3 self will have a different discount factor for the same reward because they are closer? 

              Hyperbolic discounting has the property that the discount rate between t and t+1 is higher when t is closer to 0. So the discount factor between round 3 and round 4 (1 round) is δ(1) = 1/(1+k) and between round 4 and 5 is also δ(1) and between round 5 and 6 is δ(1). But the discount factor from round 3 to round 6 is δ(1)^3? That would be exponential. 

              Actually, hyperbolic discounting is usually defined such that the discount factor for τ periods is 1/(1+kτ). So from round 3, the 5 in round 6 (τ=3) is discounted by 1/(1+3k). From round 2, the 5 in round 6 (τ=4) is discounted by 1/(1+4k). 

              Therefore, in round 2, the Present-Self might think that in round 3, the Present-Self will value the 5 at 5/(1+3k). They compare that with 2. If 5/(1+3k) > 2, then they think the round 3 self will take the delayed reward. But when they get to round 3, the Present-Self actually values the 5 at 5/(1+3k). So the same value. There is no reversal? 

              This suggests that the standard hyperbolic discounting function does not by itself cause a reversal for fixed delays. 

          However, the reversal often occurs when the delay becomes shorter. In our case, the delay for the delayed reward is always 3 rounds. But the reversal might occur because the immediate reward becomes available now? 

          Alternatively, we might be thinking of the quasi-hyperbolic discounting (β-δ model). In that model, the discount factor for any future period is βδ^τ, where τ>=1. So the Present-Self in round 3 discounts the reward in round 6 (τ=3) by βδ^3. But the same reward when viewed from round 2 (τ=4) is discounted by βδ^4. 

          Now, the Present-Self in round 2 might think that the round 3 self will discount the reward in round 6 by βδ^3. They compare that to 2 (which in round 3 is immediate, so not discounted by βδ? because immediate rewards are not discounted). But note: in the β-δ model, the immediate reward (at time t) is not discounted, and any reward at time t+τ (τ>=1) is discounted by βδ^τ.

          So in round 3, the Present-Self compares:
              Immediate: 2.
              Delayed: βδ^3 * 5.

          In round 2, the Present-Self (if they are planning for round 3) would want the round 3 self to take the delayed reward if βδ^3 * 5 > 2. But when round 3 comes, if βδ^3 * 5 < 2, they will take the immediate.

          The reversal occurs if βδ^3 * 5 < 2 but βδ^4 * 5 > 2? (because in round 2, the value of the delayed reward at round 6 is βδ^4 * 5). 

          Example: β=0.6, δ=1. Then in round 2, the delayed reward: 0.6 * 5 = 3 > 2 -> so they plan to take it in round 3. But in round 3, the delayed reward: 0.6 * 5 = 3 > 2, so they take it. No reversal.

          But if we have β=0.5, δ=0.9:
              In round 2: value of the delayed reward (at round 6) = β * δ^4 * 5 = 0.5 * (0.9)^4 * 5 ≈ 0.5 * 0.6561 * 5 ≈ 1.64 < 2 -> so they wouldn't plan to take it? but they are planning for round 3.

          Actually, for the round 3 choice, from round 2's perspective, the round 3 self will get:
              - If take immediate in round 3: 2 at round 3 -> from round 2, that is worth δ * 2 (because it's one period away) = 0.9 * 2 = 1.8.
              - If take delayed in round 3: 5 at round 6 -> from round 2, that is worth δ^4 * 5? but with β-δ, the discounting for round 6 from round 2 is βδ^4? Actually, round 6 is 4 periods away -> βδ^4 * 5 = 0.5 * (0.9)^4 * 5 ≈ 0.5 * 0.6561 * 5 ≈ 1.64.

          So in round 2, the Present-Self would prefer that the round 3 self take the immediate reward (1.8 > 1.64). 

          But then they wouldn't sign a treaty to take the delayed reward.

          We need a scenario where in round 2 they think the round 3 self should take the delayed reward, but in round 3 they take the immediate.

          Example: β=0.6, δ=0.95.

          In round 2, evaluating the round 3 choice:
              - Immediate in round 3: from round 2, that's δ * 2 = 0.95 * 2 = 1.9.
              - Delayed in round 3: from round 2, that's βδ^4 * 5 = 0.6 * (0.95)^4 * 5 ≈ 0.6 * 0.8145 * 5 ≈ 0.6 * 4.0725 ≈ 2.4435.

              So they prefer the delayed reward (2.4435 > 1.9) and would sign a treaty.

          In round 3, the Present-Self evaluates:
              - Immediate: 2.
              - Delayed: βδ^3 * 5 = 0.6 * (0.95)^3 * 5 ≈ 0.6 * 0.857375 * 5 ≈ 0.6 * 4.286875 ≈ 2.572.
              So they would take the delayed reward? 

          Not working.

          We need: in round 3, βδ^3 * 5 < 2.

          Let me solve: βδ^3 * 5 < 2  => δ^3 < 2/(5β)

          And in round 2, βδ^4 * 5 > 2? (so that they plan for delayed) => δ^4 > 2/(5β)

          So we need:
              (2/(5β))^(1/4) < δ < (2/(5β))^(1/3)

          For example, β=0.5:
              Then 2/(5*0.5)= 2/2.5 = 0.8.
              So we need δ in (0.8^(1/4), 0.8^(1/3)) ≈ (0.9457, 0.9286). 

          So if δ=0.93, then:
              In round 2: βδ^4 * 5 = 0.5 * (0.93)^4 * 5 ≈ 0.5 * 0.748 * 5 ≈ 0.5 * 3.74 = 1.87 < 2 -> so they wouldn't plan for delayed.

          How about β=0.6:
              2/(5*0.6)= 2/3 ≈ 0.6667.
              So δ in (0.6667^(1/4), 0.6667^(1/3)) ≈ (0.9, 0.87). So if δ=0.88:
                  In round 2: βδ^4 * 5 = 0.6 * (0.88)^4 * 5 ≈ 0.6 * 0.5997 * 5 ≈ 0.6 * 2.9985 ≈ 1.799 < 2 -> not above 2.

          β=0.4:
              2/(5*0.4)= 1.
              Then we need δ in (1^(1/4)=1, 1^(1/3)=1). Only δ=1, but then:
                  In round 3: βδ^3 * 5 = 0.4 * 1^3 * 5 = 2 -> equal, so might not be strict.

          β=0.55:
              2/(5*0.55)≈2/2.75≈0.727.
              δ in (0.727^(1/4)≈0.92, 0.727^(1/3)≈0.90).
              Choose δ=0.91:
                  In round 2: βδ^4 * 5 = 0.55 * (0.91)^4 * 5 ≈ 0.55 * 0.6857 * 5 ≈ 0.55 * 3.4285 ≈ 1.885 -> less than 2.
              δ=0.915:
                  (0.915)^4 ≈ 0.700, then 0.55*0.700*5=0.55*3.5=1.925 -> still <2.
              δ=0.92:
                  (0.92)^4≈0.7164, then 0.55*0.7164*5≈0.55*3.582=1.97 -> still <2.

          It seems we need a very high δ and very low β.

          β=0.7:
              2/(5*0.7)=0.5714.
              δ in (0.5714^(1/4)≈0.87, 0.5714^(1/3)≈0.83)
              Choose δ=0.85:
                  In round 2: βδ^4 * 5 = 0.7 * (0.85)^4 * 5 ≈ 0.7 * 0.522 * 5 ≈ 0.7 * 2.61 = 1.827 <2.

          We might not be able to find parameters where in round 2 the delayed reward is valued above 2 and in round 3 below 2 with the same (β,δ) and with the delays we have.

          Alternative: the reversal happens because the round 2 self is not using the same β as the round 3 self? 

          In reality, the round 2 self is in a cold state and uses a high β (say 1) for future periods, but the round 3 self is in a hot state and uses a low β. This is the essence of the β-δ model with naivete.

          So in round 2, the Present-Self believes that the round 3 self will have β=1, so they think the round 3 self will value the delayed reward at δ^3 * 5. They compare that to the immediate reward in round 3 (which from round 2 is worth δ * 2). If δ^3 * 5 > δ * 2, which simplifies to δ^2 * 5 > 2, then they believe the round 3 self will take the delayed reward. 

          But in round 3, the Present-Self has β<1, so they value the delayed reward at βδ^3 * 5. If βδ^3 * 5 < 2, then they take the immediate.

          Example: δ=0.9, then in round 2: δ^2 * 5 = 0.81 * 5 = 4.05 > 2, so they believe the round 3 self will take the delayed reward.
          In round 3: if β=0.6, then βδ^3 * 5 = 0.6 * 0.729 * 5 = 0.6 * 3.645 = 2.187 > 2 -> still takes delayed.

          We need: βδ^3 * 5 < 2.

          Let me solve: β < 2/(5 * δ^3)

          For δ=0.9, then β < 2/(5*0.729) = 2/3.645 ≈ 0.548.

          So if β=0.5, then in round 3: 0.5 * 0.729 * 5 = 0.5 * 3.645 = 1.8225 < 2 -> they take the immediate.

          Therefore, in round 2, they believe the round 3 self will take the delayed, so they sign the treaty. But in round 3, they take the immediate.

          This is the naive hyperbolic discounting.

          In our game, we hope that the participants will behave naively: in round 2, they think they will have self-control in round 3, but in round 3 they don't.

          So the design relies on participants being naive about their future self-control.

     Given this, the activity should work if the participants are naive about their future discounting.

     In summary, the game is designed and we hope that the participants will sign a treaty in round 2 for round 3 (because they believe that in round 3 they will be patient) and then in round 3 they will break it (because they are not patient).

     The facilitator should explain this in the debrief.

     Finally, the instructions for the participants must be clear. We will provide a rule sheet.

     What would change my mind about the design's effectiveness?
        - If in a pilot run, participants in round 3 do not break the treaty even though they are faced with the immediate reward, then the visceral feeling of hyperbolic discounting is not coming through.
        - If participants in round 2 do not sign treaties because they anticipate their future defection, then we don't see the breakdown.
        - The most likely error in the payoff structure reasoning is that the penalty for taking the immediate reward (which affects the next round) is not sufficiently deterrent, so participants might take the immediate reward too often even in rounds where they are not experiencing a preference reversal.

     Despite these risks, the game is designed and we hope it works.

     Now, we write the detailed instructions for the participants and the facilitator.
answer: |-
  ### Hyperbolic Bargaining Game: Role-Play Design  
  **Core Objective:** Make participants viscerally experience hyperbolic discounting and strategic preference reversal through intertemporal negotiation.  

  ---

  #### **Materials**  
  - **Per Pair:**  
    - 1 Shared Pool Card (track cumulative points; start at 0).  
    - 1 Treaty Token (held by the active Present-Self).  
    - 3 Treaty Contract Cards (preprinted: *"Round [X]: Present-Self commits to DELAYED reward (5 pts in 3 rounds)"*).  
    - Tearing Penalty Tokens (small chips; 1 per treaty tear).  
  - **Per Student:** Role Card (flips at Round 5: Present-Self ↔ Future-Self).  
  - **Facilitator:** Timer, scoreboard.  

  ---

  #### **Setup**  
  - **Group Structure:** 7 pairs (14 students).  
  - **Roles:**  
    - Rounds 1–4: Student A = Present-Self, Student B = Future-Self.  
    - Rounds 5–8: **Swap roles** (Student B = Present-Self, Student A = Future-Self).  
  - **Shared Pool:** Points visible to both; updated after each choice.  

  ---

  #### **Round Procedure**  
  1. **Start of Round (All pairs):**  
     - Add delayed rewards if due (e.g., if delayed chosen in Round 1, add 5 pts to pool in Round 4).  
     - Apply penalty if previous Present-Self took immediate reward: **Deduct 1 pt** from pool; Future-Self **loses treaty-invocation rights** this round.  

  2. **Treaty Phase (Rounds 3, 5, 7 only):**  
     - At round start, pairs with a signed treaty decide whether to **invoke** it:  
       - If both agree: Present-Self **must** take delayed reward.  
       - If either refuses: Tear up treaty → **Deduct 1 pt** (tearing penalty).  

  3. **Action Phase:**  
     - Present-Self chooses:  
       - **Option 1 (Immediate):** Take **2 pts now**.  
         - *Consequence:* Next round, Future-Self loses treaty rights + **1-pt penalty**.  
       - **Option 2 (Delayed):** Commit to **5 pts in 3 rounds**.  
     - **Precommit Option:** Present-Self may play Treaty Token *before* choosing → **Lock in delayed reward** but **deduct 1 pt** immediately.  

  ---

  #### **Negotiation & Treaties (Key Mechanism)**  
  - **When:** After Rounds 2, 4, and 6 (2-minute breaks).  
  - **Process:**  
    - Pairs negotiate and sign a **Treaty Contract** for the *next* round (e.g., post-Round 2: sign treaty for Round 3).  
    - Contract specifies: *"Present-Self will choose DELAYED reward."*  
  - **Enforcement:**  
    - Only binding if **both invoke** at the start of the round.  
    - **Either** can tear up later (e.g., at invocation phase) → **Costs 1 pt**.  

  ---

  #### **Predicted Dynamics (Niche Framing)**  
  - **Round 2:** Pairs sign treaties for Round 3 (planning for delayed reward).  
  - **Round 3:** Most Present-Selves tear up treaties despite unchanged payoffs:  
    - *Why?* Hyperbolic discounting makes the **immediate 2 pts feel larger** than in Round 2, while the **5-pt reward remains 3 rounds away**.  
    - Tearing cost (1 pt) feels "worth it" to access immediate reward.  
  - **Consequence:** Future-Self (Round 4) suffers penalty + lost treaty rights.  
  - **Pattern:** Repeats in Rounds 5–8 after role swap.  

  ---

  #### **Debrief (15 mins)**  
  1. **Tally & Rank:** Compare pool totals across pairs.  
  2. **Map to Theory:**  
     - **Hyperbolic vs. Exponential Discounting:**  
       - *Hyperbolic:* Discount rate declines over time → preference reversal when rewards near (e.g., Round 3 temptation > Round 2 resolve).  
       - *Exponential:* Constant discount rate → no reversal.  
     - **Weakness of Will ≠ Depletable Resource:**  
       - If willpower were a "stock," treaties would degrade steadily.  
       - Observed **sudden abandonment** in Round 3 proves **strategic preference reversal** under hyperbolic discounting.  
  3. **Limitations:**  
     - *Interpersonal ≠ Intrapersonal:* Conflict is staged as bargaining between "selves." Facilitator must **verbally frame the first-person struggle** (e.g., *"Imagine negotiating with your future self"*).  
     - *Misinterpretation Risk:* Participants may view torn treaties as "irrational" rather than **rational under hyperbolic curves**.  

  ---

  #### **Pilot Risks & Failure Conditions**  
  - **What Could Go Wrong:**  
    - High-cooperation pairs **overestimate treaty durability** (e.g., assume mutual goodwill prevents tearing).  
    - Some view torn contracts as "cheating" rather than **time-inconsistent rationality**.  
  - **Design Failure Signs (If Observed):**  
    - Participants describe actions as **purely strategic** (e.g., *"I tore it to maximize points"*) without visceral tension.  
    - No Round 3 preference reversal → **payoff structure miscalculation** (e.g., tearing cost too high; immediate reward too low).  
  - **Critical Flaw Spot:** Underestimation of **round-to-round shift in temptation intensity** (hyperbolic property).  

  ---

  #### **Facilitator Script Snippets**  
  - **Framing:** *"You’re not just playing a game—you’re experiencing why your ‘future self’ often feels like a stranger."*  
  - **Debrief Prompt:** *"In Round 3, why did the treaty feel heavier than in Round 2, even though the 5-pt reward was equally far away?"*  

  This design forces participants to confront hyperbolic discounting through repeated negotiation breakdowns, leveraging Strotz’s consistent planning as a failed bargaining protocol. The visceral tension arises from *being* the Present-Self who rationally abandons prior commitments when temptation spikes.
