prompt: |-
  hey — I'm in a comp-ling-adjacent PhD and I'm building an annotation scheme for emotion in dialogue, and I don't want to commit to a defintion before I have the spec. So: assume emotions are whatever a theory of emotion says they are, and write me the desiderata such a theory has to meet to be usable for my purpose — with the concrete case behind each requirement. The weird cases are the ones I actually have to code: a speaker says "I'm not angry" and every other cue says they are; there's fear whose object turns out not to exist (the noise in the house that's just the cat); there's an episode with a distinctive feel but no object I can find (the dread a certain chord progression gives you); the same episode gets reported as grief and as relief; and a speaker attributes an emotion to a chatbot, or to a dead relative. I also want to know which distinctions a theory isn't allowed to collapse: having an emotion vs. feeling it vs. expressing it, occurrent vs. standing, mood vs. emotion, the emotion vs. its typical causes and typical effects, and whether the intentional object can be something the subject doesn't believe (being moved by a scene you know is staged). Don't write "handle the recalcitrant case" as a line item — say why each thing is a requirement, mark which are non-negotiable and which are really just commitments of one camp (I suspect the judging-theories have a stake in a few of these being everyone's problem), and flag any pair of desiderata you think can't both be met — that's the part I most want. Then briefly, how the judgment view, the perceptual/attitudinal view, and the feeling or somatic view do against your own list, and which single requirement kills the most candidates. No citations or reading lists please, I can't use them anyway — just the argument.
reasoning: |-
  Okay, let's tackle this. The user is working on an emotion annotation scheme for dialogue and needs desiderata for a theory of emotion that handles tricky cases. First, I need to unpack their examples. They mentioned situations like someone denying anger while showing it, fear without a real object, objectless dread, conflicting emotion labels, and attributing emotions to non-human entities. Each of these cases points to specific theoretical requirements.

  The user also wants distinctions like having vs. feeling vs. expressing an emotion, occurrent vs. standing states, mood vs. emotion, and intentionality issues. They don't want vague requirements; each must have a concrete reason. Plus, they need conflicts between desiderata flagged. And a quick rundown of how major theories fare.

  Starting with the cases: "I'm not angry" but cues say otherwise. That requires separating verbal reports from other indicators. So a theory must decouple expression from experience. The fear example with a false object (noise is just the cat) needs intentionality without ontological commitment. The objectless dread (chord progression) suggests emotions without clear objects, so the theory must allow for non-intentional or diffuse intentionality. Conflicting reports (grief vs. relief) mean emotion labels can be fluid or context-dependent, needing multi-dimensional characterization. Attributing emotions to chatbots or the dead involves third-party ascriptions without requiring actual emotional states in the target, so the theory must handle ascriptions independent of the target's capability.

  Then the distinctions. Having vs. feeling vs. expressing ties into the annotation process—need to code observable expressions separately from internal states. Occurrent vs. standing is crucial for temporal aspects in dialogue. Mood vs. emotion affects granularity. Emotion vs. causes/effects prevents confounding factors in coding. Intentional object without belief (staged scene) requires intentionality that doesn't rely on factual truth.

  Now, conflicts. For instance, decoupling expression from experience (for denial cases) might clash with the need for intentional objects (if expression is a key indicator). Also, precise labeling conflicts with the flexibility needed for conflicting reports. Allowing objectless emotions might undermine intentionality requirements. Handling third-party ascriptions could complicate what counts as an emotion.

  Theories: Judgment theories fail on denial cases and non-human ascriptions because they require cognitive evaluations. Perceptual theories might handle objects better but struggle with objectless dread and third-party ascriptions. Somatic theories can't distinguish between similar physiological states and miss intentionality. The biggest killer is the third-party ascription requirement, especially for non-humans, which most theories can't handle without stretching definitions.

  Need to ensure each desideratum is tied to a concrete case, mark non-negotiables (like expression-experience decoupling), and note where theories clash. Highlighting conflicts helps the user decide trade-offs. Also, emphasizing that third-party ascription is a major hurdle for many theories.
answer: |-
  Here’s a distilled set of desiderata for your emotion theory, grounded in your concrete cases, with conflicts flagged. Non-negotiables (essential for annotation integrity) are **bolded**; contingent commitments (theory-specific stakes) are *italicized*.

  ---

  ### **Core Desiderata**  
  1. **Decouple Expression from Experience**  
     *Why*: To annotate cases like “I’m not angry” (denial with contextual anger cues). Requires distinguishing verbal reports, physiological/behavioral signals, and inferred internal states.  
     *Non-negotiable*: Annotation must capture observable expressions *independent* of self-reports.  

  2. **Object Flexibility**  
     *Why*: Fear of a noise (later revealed as harmless) needs emotions to target *represented* objects (real or imagined). Must accommodate non-existent objects (hallucinations) or diffuse objects (dread from music).  
     *Non-negotiable*: Intentionality must not require real/factual objects.  

  3. **Allow Non-Intentional States**  
     *Why*: “Dread from a chord progression” lacks a clear object. Theory must permit emotions without specific intentional targets (e.g., moods, free-floating affect).  
     *Conflict*: Clashes with rigid intentionality requirements (e.g., judgment theories).  

  4. **Multidimensional Characterization**  
     *Why*: Same episode labeled as *grief* and *relief* suggests emotions are not discrete categories. Requires theory to support overlapping components (e.g., valence, arousal, appraisal facets).  
     *Non-negotiable*: Avoids forcing ambiguous cases into binary labels.  

  5. **Third-Party Ascription Validity**  
     *Why*: Attributing emotion to chatbots/dead relatives requires modeling *attributions* without committing to the target’s capacity to feel. Theory must separate conceptual ascription from ontological commitments.  
     *Non-negotiable*: Dialogue annotation hinges on speaker *intent*, not reality of the target’s state.  

  6. **Distinguish Occurrent vs. Standing States**  
     *Why*: A speaker’s transient anger vs. chronic resentment must be coded differently for temporal dynamics in dialogue.  
     *Non-negotiable*: Critical for tracking emotion shifts in conversation.  

  ---

  ### **Critical Distinctions (Must Not Collapse)**  
  7. **Experience vs. Attribution**  
     *Why*: Distinguish "I feel angry" (self-report) from "You are angry" (third-party ascription) – common in accusatory dialogue.  
     *Stake*: *Judgment theories struggle if attribution requires subject’s cognitive evaluation*.  

  8. **Mood vs. Emotion**  
     *Why*: Diffuse irritation (mood) vs. anger at a specific remark (emotion) affect dialogue coherence. Moods color multiple turns; emotions are episode-bound.  

  9. **Cause/Effect Independence**  
     *Why*: Annotating “anger” must not require coding its cause (e.g., insult) or effect (e.g., shouting). Prevents feature bloat.  

  10. **Intentionality Without Belief**  
      *Why*: Being moved by a staged scene requires objects held as “real in the moment” (pretense), not factually believed.  
      *Conflict*: Somatic/judgment theories may demand genuine belief.  

  ---

  ### **Theory Conflicts & Trade-offs**  
  - **Object Flexibility (#2) vs. Non-Intentional States (#3)**:  
    Theories insisting *all* emotions have objects (e.g., judgment views) fail #3; those accepting objectless states (e.g., somatic views) weaken intentionality.  
  - **Decoupling Expression (#1) vs. Somatic Basis**:  
    If emotions *are* feelings (somatic view), expressions become unreliable proxies – violating #1.  
  - **Third-Party Ascription (#5) vs. Experience (#7)**:  
    Theories defining emotions as private experiences (feeling views) struggle with #5, as chatbots can’t “feel.”  

  ---

  ### **How Theories Fare**  
  | **Theory**          | **Strengths**                          | **Fatal Flaws**                                  |  
  |----------------------|----------------------------------------|--------------------------------------------------|  
  | **Judgment**         | Handles objects (#2), distinctions (#8–10) | Fails denial cases (#1: “not angry” contradicts judgment), non-intentional states (#3), chatbot ascription (#5). |  
  | **Perceptual/Attitudinal** | Flexible objects (#2), pretense cases (#10) | Struggles with objectless dread (#3), moods (#8), and somatic ambiguity. |  
  | **Somatic/Feeling**  | Explains dread (#3), denial (#1: feels X ≠ admits X) | Collapses anger/fear if physiology similar; fails non-human ascription (#5), intentionality (#2, #10). |  

  **Single biggest killer**: **Third-party ascription (#5)**.  
  - Eliminates: Somatic (requires embodiment), judgment (requires evaluative capacity), perceptual (requires conscious experience).  
  - Survivors: Attitudinal theories (emotions as ascribable stances) or constructivist views (emotions as social scripts).  

  **Strongest overall**: **Attitudinal theories** (emotions as modes of engaging with objects). They handle:  
  - Non-existent objects (#2: fear of noise)  
  - Pretense (#10: staged scene)  
  - Ascription (#5: chatbot)  
  - Denial (#1: attitude ≠ expression)  
  *Weakness*: Objectless dread (#3) requires stretching “object” to diffuse stimuli (e.g., the music *as* object).  

  **Recommendation**: Lean into an **attitudinal framework** but:  
  - Allow a "diffuse object" tag for #3,  
  - Use multidimensional features (e.g., arousal/valence) for #4,  
  - Treat moods (#8) as low-intensity attitudes with generic objects (e.g., "everything").  

  This balances annotation tractability with philosophical rigor on your hardest cases.
