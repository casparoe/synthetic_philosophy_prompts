answer: |-
  My dear colleague,  

  Your analogy from experimental physics is both illuminating and pertinent, and I appreciate the precision with which you frame the question. Let me address it directly, for it cuts to the heart of the matter: whether the shift from reactive to objective attitudes constitutes a moral or rational advancement, or whether it is merely a pragmatic recalibration of our natural human machinery.  

  You suggest that adopting the objective attitude resembles a scientist lowering the gain on an amplifier to exclude noise—a tactical adjustment when the "signal" of normal interpersonal engagement becomes unsustainable. This, you ask, might imply that objectivity is instrumentally superior in such contexts, thereby threatening my insistence that it is not a *morally* or *rationally* higher stance. On the contrary, I argue your analogy fortifies my position, provided we scrutinize what "superiority" means here.  

  Consider first the reactive attitudes: resentment, gratitude, indignation, forgiveness. These are not contingent social constructs but bedrock features of our moral psychology. They arise spontaneously from our participation in ordinary human relationships. To see others as morally responsible agents is not a metaphysical commitment we adopt after reflection; it is the default condition of our emotional lives. We do not *choose* to resent a deliberate injury; we simply *do*. This framework is not a tool we pick up and set down at will. It is the atmosphere we breathe in the social world.  

  Now, the objective attitude: when we adopt it—toward the severely mentally ill, the profoundly traumatized, or even the exhaustingly immature—we do not ascend to a loftier plane of moral insight. We are not "correcting" a flawed reactive stance with a purer rationality. Rather, we are *disengaging* from the interpersonal dynamic altogether. To view someone objectively is to see them not as a participant in moral dialogue but as a problem to be managed, a patient to be treated, or a puzzle to be solved. The objective attitude suspends the expectations constitutive of mutual personhood. It does not transcend them; it sidesteps them.  

  Your amplifier analogy captures this beautifully. When noise overwhelms the signal, lowering the gain is not an epistemological upgrade—it is a practical concession. The instrument is not suddenly "truer"; it is repurposed for a different task. Similarly, the objective attitude is not a refined moral lens but a shift in practical orientation. We engage it when the reactive framework fractures—when the other’s capacity to meaningfully participate in the moral exchange is, for whatever reason, compromised. In such cases, resentment or blame becomes not *morally wrong* but *practically inept*, like shouting demands at a shattered radio.  

  Crucially, this shift carries no moral kudos. The clinician who views a psychotic patient objectively is not exercising superior virtue; she is adopting a posture suited to her aims (care, diagnosis, management). Her attitude is no more "rational" in the abstract than a friend’s indignation at a betrayal is "irrational." Each serves distinct human interests: one preserves relationships, the other navigates their wreckage. Neither is reducible to the other, and neither is universally applicable.  

  Thus, your instrumental framing reinforces my view. It underscores that both attitudes are context-dependent expressions of our social nature. The reactive stance is our native tongue; the objective stance is a specialized dialect we switch into when conversation breaks down. To mistake this dialect for a universal language of moral enlightenment would be like claiming a microscope is "superior" to a telescope. Each excels in its domain; neither displaces the other as the comprehensive instrument of human understanding.  

  The moral life, like your amplifier, must sometimes be recalibrated. But calibration is not transcendence. It is adaptation.  

  I await your thoughts with keen interest.  

  Yours sincerely,  
  P.F. Strawson
