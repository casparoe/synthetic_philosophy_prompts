  | On the aim of the Buddhist path | The path aims at the purification of the mind through the cultivation of wholesome intentions, which naturally leads to the reduction of suffering as a byproduct. | The path aims at the reduction of aggregate dukkha as its primary and ultimate goal, and all practices are valuable only insofar as they serve this aim. | During a famine, a monk continues his solitary meditation retreat and does not interrupt it to help starving villagers. | The monk accumulates positive karma because his intention is to attain enlightenment (the highest good) and there is no unwholesome intention. | The monk accumulates negative karma because his inaction led to preventable suffering. The meditation retreat was less valuable than acting to reduce the aggregate suffering in that situation. |
  | On the Bodhisattva ideal | The Bodhisattva path is meritorious primarily due to the purity of the intention to benefit all beings, and the karmic merit is generated by that intention regardless of outcomes. | The karmic merit of a Bodhisattva's actions is determined by the actual reduction of suffering they achieve; intentions are important only as they lead to effective action. | A Bodhisattva donates all wealth to build a hospital in a poor region, intending to save lives. Due to corruption, the funds are misappropriated and the hospital is never built. The Bodhisattva dies without knowing this. | The Bodhisattva accumulates immense positive karma because of the pure and compassionate intention. | The Bodhisattva accumulates some positive karma for the good intention, but the karmic result is significantly diminished because the action did not actually reduce suffering (and may have increased it due to the corruption). |

  Note: The predictions are about the karmic result for the agent (the doctor, the monk, the Bodhisattva). Both sides agree that karma operates, but they predict different outcomes based on their principles.

