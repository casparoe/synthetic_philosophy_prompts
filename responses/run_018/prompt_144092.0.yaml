  ### Joint Statement: Adversarial Collaboration on Buddhist Ethics  

  **Preamble:**  
  We, a Theravada ethicist (TE) and a Buddhist consequentialist (BC), engage in adversarial collaboration to clarify our shared and divergent views on karma, rebirth, and the Bodhisattva ideal. We agree on core Buddhist principles but dispute the mechanics of karmic weight and the path’s ultimate aim. This statement outlines agreed claims, precise disagreements, and testable predictions for key cruxes.  

  ---

  ### 1. Agreed Claims  
  Both parties endorse the following:  

  1. **Karma as Moral Causality:**  
     Karma (Pali: *kamma*) is an impersonal law of moral causation wherein intentional actions (rooted in *cetana*) shape future experiences. Wholesome actions (motivated by non-greed, non-hatred, non-delusion) generate positive karma; unwholesome actions (motivated by greed, hatred, delusion) generate negative karma.  

  2. **Rebirth as Context:**  
     Rebirth occurs within *saṃsāra* (the cycle of existence), driven by karma. Future rebirths are conditioned by accumulated karma, and liberation (*nibbāna*) requires the cessation of karmic causes.  

  3. **The Bodhisattva Ideal as Noble:**  
     The Bodhisattva ideal—postponing personal liberation to alleviate others’ suffering—is a valid and aspirational path. Both acknowledge its emphasis on compassion (*karuṇā*) and wisdom (*paññā*), though its centrality varies by tradition.  

  4. **Dukkha as the Problem:**  
     *Dukkha* (suffering/stress) is the fundamental problem Buddhism addresses. The path (Eightfold Path) aims at its ultimate cessation.  

  5. **Cetana as Necessary:**  
     *Cetana* (volition) is indispensable to karmic formation. Actions without intention (e.g., reflexes) lack karmic weight.  

  6. **Consequences as Empirically Observable:**  
     Actions produce observable consequences in the conventional world (e.g., harming others causes immediate suffering). These inform ethical deliberation but are distinct from karmic weight for the agent.  

  ---

  ### 2. Disagreements  
  We define our disagreements below. Each view is phrased identically to its holder’s position. For each crux, we provide a shared test case and advance predictions.  

  | **Disagreement**                                                                 | **Theravada Ethicist (TE) View**                                                                                                                                 | **Buddhist Consequentialist (BC) View**                                                                                                                                                             |  
  |----------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|  
  | **Crux 1: Determinant of Karmic Weight**<br>*Does karmic weight depend solely on intention, or on outcomes?* | Karmic weight is determined **exclusively** by the quality of *cetana* (wholesome/unwholesome). Actual outcomes are morally irrelevant to the agent’s karma. | Karmic weight is determined by **aggregate dukkha reduction/increase**. *Cetana* is instrumentally valuable but secondary; outcomes define karma’s moral valence. |  
  | **Test Case**: A monk gives alms to a beggar with pure compassion. Unbeknownst to the monk, the food is poisoned, killing the beggar and inciting a riot that kills 100 others. | **TE Prediction**: The monk accrues **positive karma**. The intention (*cetana*) was wholesome; outcomes are karmically irrelevant. | **BC Prediction**: The monk accrues **negative karma**. The outcome increased aggregate dukkha (deaths, riot), overriding wholesome intention. |  
  | **Crux 2: Role of Cetana**<br>*Is cetana intrinsically or instrumentally valuable?* | *Cetana* is **intrinsically** karmically significant. Cultivating wholesome intentions purifies the mind, directly advancing the path. | *Cetana* is **instrumentally** valuable. It matters only insofar as it reliably reduces dukkha; intentions divorced from outcomes lack moral weight. |  
  | **Test Case**: A meditator achieves pure, non-attached intention (*cetana*) during retreat but refuses to aid a dying person outside, citing "non-interference." | **TE Prediction**: The meditator accrues **neutral/positive karma**. Wholesome *cetana* during retreat is karmically fruitful; inaction lacks unwholesome intent. | **BC Prediction**: The meditator accrues **negative karma**. Inaction increased dukkha (death), rendering intention irrelevant without dukkha reduction. |  
  | **Crux 3: Bodhisattva Action Evaluation**<br>*Is merit from Bodhisattva acts intention- or outcome-based?* | Bodhisattva merit arises from **intention alone**. Sacrificing liberation for others’ sake generates supreme karma regardless of results. | Bodhisattva merit requires **measurable dukkha reduction**. Intention is secondary; merit scales with suffering alleviated. |  
  | **Test Case**: A Bodhisattva donates wealth to build a hospital, intending to save lives. Corruption diverts funds, causing no hospital and community despair. | **TE Prediction**: The Bodhisattva accrues **supreme positive karma**. The compassionate intention (*cetana*) is karmically complete. | **BC Prediction**: The Bodhisattva accrues **minimal/negative karma**. Aggregate dukkha increased (despair, wasted resources); intention alone cannot offset this. |  

  ---

  ### 3. Commitments  
  - **Method**: We will evaluate predictions through:  
    - (1) Classical sutta analysis (e.g., *AN 6.63* for TE; *MN 61* for BC).  
    - (2) Empirical observation of cause-effect in ethics (e.g., does intention-centric practice reduce suffering long-term?).  
  - **Goal**: To resolve whether karma is a mind-purification system (TE) or a cosmic utility calculus (BC), and integrate findings into broader Buddhist ethics.  

  ---  
  **Signed,**  
  [Theravada Ethicist]  
  [Buddhist Consequentialist]  
