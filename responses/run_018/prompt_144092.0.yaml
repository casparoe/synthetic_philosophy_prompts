  We are drafting a joint statement for an adversarial collaboration between two Buddhist perspectives: a Theravada ethicist (TE) and a Buddhist consequentialist (BC). The TE holds that cetana (intention) is the sole determinant of karmic weight and that actual outcomes are morally irrelevant. The BC holds that reducing aggregate dukkha is the only coherent aim of the path and that cetana is only instrumentally valuable.

  We need:
  1. A numbered list of agreed claims about karma, rebirth, and the Bodhisattva ideal.
  2. A table of disagreements, with each side's view precisely worded so they accept it, and for each crux a shared test case and both sides' predictions.

  Agreed Claims (Numbered Section):
  We must find common ground. Possible points of agreement:

  - Karma is a fundamental principle: actions have consequences for the agent, shaping future experiences.
  - Rebirth is accepted by both as a context for the working of karma (though the BC might emphasize the reduction of dukkha across lives, and the TE the role of intention in shaping rebirth).
  - The Bodhisattva ideal: Both may agree that the path involves cultivating virtues and wisdom, but the TE might see it as an expression of perfect intention, while the BC sees it as a strategy for reducing aggregate suffering. However, in Theravada, the Bodhisattva ideal is less central, so we must be cautious.

  Let's propose agreed claims:

  1. Karma (Pali: kamma) is a natural law of moral causation wherein intentional actions (cetana) of body, speech, and mind have consequences for the agent.
  2. These karmic consequences extend beyond the present life, influencing future rebirths and experiences in samsara.
  3. The ultimate goal of Buddhist practice is the cessation of dukkha (suffering, unsatisfactoriness) and the attainment of nibbana (nirvana).
  4. Both the cultivation of wholesome intentions and the reduction of suffering are important aspects of the Buddhist path.
  5. The Bodhisattva ideal, in which one forgoes immediate nirvana to work for the liberation of all beings, is a noble and valid path (though the TE may note it is more emphasized in Mahayana, while Theravada also has the concept of the Bodhisatta as in the Jataka tales).

  Disagreements Table:

  We need to phrase each disagreement so each side accepts the wording of their own view. Then, for each crux, a shared test case and both predictions.

  Main Crux: Whether an act done with pure intention that accidentally causes massive suffering generates negative karma for the agent.

  Other possible disagreements:
  - The moral relevance of actual outcomes.
  - The role of cetana: is it the sole determinant or instrumental?
  - The aim of the path: is it solely about reducing aggregate dukkha, or also about the purity of mind?

  But the main crux is central. We'll structure the table with:

  - Disagreement Statement (with both views worded as they would accept)
  - Shared Test Case
  - TE Prediction
  - BC Prediction

  Let's outline:

  Disagreement 1: On the Determinant of Karmic Weight
  - TE View: The karmic weight of an action is determined solely by the quality of the cetana (intention) behind it, and actual outcomes are irrelevant to the karmic result for the agent.
  - BC View: The karmic weight of an action is determined by its actual consequences in terms of aggregate dukkha, and cetana is only important insofar as it tends to produce good or bad outcomes.

  Test Case: A doctor (who is a Buddhist practitioner) performs a surgery with the pure intention to save a life. Due to an unforeseeable complication (e.g., a hidden allergy), the patient dies and the family experiences immense grief. The surgery also leads to a series of events causing a hospital shutdown, resulting in many other deaths.

  Predictions:
  - TE: The doctor accumulates positive karma because the intention was pure and skillful (to save a life). The negative outcomes do not generate negative karma for the doctor.
  - BC: The doctor accumulates negative karma because the actual outcome was an increase in aggregate dukkha (death, grief, and subsequent suffering). The good intention is not sufficient to avoid negative karma; it might mitigate but not eliminate the negative karmic weight.

  Disagreement 2: On the Aim of the Path
  - TE View: The path aims at the purification of the mind through the cultivation of wholesome intentions, leading to liberation. The reduction of suffering is a byproduct of this purification.
  - BC View: The path aims at the reduction of aggregate dukkha as its primary and ultimate goal, and all practices (including cultivating wholesome intentions) are valuable only insofar as they serve this aim.

  Test Case: A monk spends years in meditation, achieving high levels of concentration and insight, but during a famine, he does not interrupt his retreat to help the starving villagers (because he is following the traditional path of solitary practice).

  Predictions:
  - TE: The monk accumulates positive karma because his intention is to attain enlightenment, which is the highest good. His inaction does not generate negative karma because there was no unwholesome intention.
  - BC: The monk accumulates negative karma because his inaction led to preventable suffering (villagers starved). The meditation retreat, while beneficial for his own development, was less valuable than acting to reduce the aggregate suffering in that critical situation.

  Disagreement 3: On the Bodhisattva Ideal
  - TE View: The Bodhisattva path is a valid but optional path for those with the aspiration to become a Buddha. The primary focus is on the purity of the intention to benefit all beings, and the karmic merit comes from that intention regardless of the actual outcomes.
  - BC View: The Bodhisattva ideal is the highest expression of the Buddhist path because it directly aims at reducing the suffering of all sentient beings. The karmic value of a Bodhisattva's actions is determined by the actual reduction of suffering they achieve, and intentions are important only as they lead to effective action.

  Test Case: A Bodhisattva donates all his wealth to build a hospital in a poor region, intending to save lives. However, due to corruption, the funds are misappropriated and the hospital is never built. The Bodhisattva then dies without knowing this.

  Predictions:
  - TE: The Bodhisattva accumulates immense positive karma because of the pure and compassionate intention, regardless of the outcome.
  - BC: The Bodhisattva accumulates some positive karma for the good intention, but the karmic result is significantly diminished because the action did not actually reduce suffering (and may have even increased suffering if the corruption led to conflict, etc.). The actual outcome matters.

  Now, we structure the document:

  JOINT STATEMENT OF ADVERSAIAL COLLABORATION

  Agreed Claims:

  1. Karma (kamma) is a natural law of moral causation wherein intentional actions (cetana) of body, speech, and mind have consequences for the agent, both in this life and in future rebirths.
  2. The cycle of rebirth (samsara) is characterized by dukkha, and the ultimate goal of Buddhist practice is the cessation of dukkha and the attainment of nibbana (nirvana).
  3. The cultivation of wholesome mental states (including but not limited to metta, karuna, mudita, and upekkha) and the avoidance of unwholesome mental states (such as greed, hatred, and delusion) are essential to the Buddhist path.
  4. The Bodhisattva ideal, involving the aspiration to attain Buddhahood for the benefit of all sentient beings, is a valid and noble path within Buddhism, recognized in both Theravada and Mahayana traditions, though the emphasis and interpretation may vary.
  5. Both intention (cetana) and the consequences of actions in terms of suffering and happiness are topics of ethical consideration in Buddhist teachings.

  Disagreements:

