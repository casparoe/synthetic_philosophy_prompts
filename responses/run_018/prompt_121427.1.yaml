  Okay, let me start by understanding what the user is asking. They've described a sequential version of Pascal's mugging where each step in the chain offers a higher utility but with a much lower probability, and the chain continues only if the previous offer is accepted. The total expected value is bounded, but at each step, accepting seems rational because rejecting forfeits the entire remaining chain. The user wants to know if this has a name, or if not, to define it.

  First, I need to recall related decision theory puzzles. Pascal's mugging involves a single offer with a tiny probability of a huge payoff. St. Petersburg paradox has infinite expected value but requires unbounded resources. Slippery slopes are more about gradual moral compromises without the probabilistic element. This chained version is different because each step is rational in isolation, but the cumulative effect locks the agent into a series of increasingly unlikely bets.

  The key points here are the sequential commitment, the conditional unlocking of future offers, and the bounded total EV despite individual steps having positive expected utility. The problem arises because rejecting at any point seems irrational due to the loss of the remaining chain's expected value, even though the entire chain is unlikely to pay off.

  I should check if there's an existing term. I recall terms like dynamic inconsistency or precommitment problems, but those don't quite fit. The chain of negligible probabilities leading to commitment isn't covered by standard terms. So coining a new term makes sense. Maybe "Recursive Mugging" or "Chain of Negligible Prospects"? The former emphasizes the iterative nature, while the latter focuses on the diminishing probabilities. 

  Breaking down the necessary conditions: sequential offers, each conditional on prior acceptance, probabilities decreasing exponentially, utilities increasing linearly but insufficiently to offset the probabilities, total EV bounded, and at each step, the marginal EV of continuing is positive. This creates a situation where the agent is trapped in a series of rational yet collectively irrational choices.

  Boundary cases include finite chains: if short, no issue; if long, the trap still holds. If probabilities don't drop fast enough, the EV might diverge, turning it into a St. Petersburg-like problem. If utilities grow exponentially, the EV could be unbounded, making acceptance rational. The user might also be interested in how decision theories (like EDT vs CDT) handle this, or if there's a resource-allocation angle they haven't considered. Their deeper need might be understanding how rational agents can avoid such traps, perhaps through precommitment or re-evaluating the entire chain holistically.
answer: |-
  Based on a conceptual analysis of the structure you describe and its distinction from established paradoxes, this pattern does not have a universally recognized name in the decision theory literature. I propose the term **"Recursive Mugging"** to capture its core mechanics and differentiate it from related phenomena. Below is a precise definition, boundary mapping, and conceptual carving:

  ### Definition of Recursive Mugging
  A **Recursive Mugging** is a sequential decision problem where:
  1.  **Conditional Chain:** Offers are presented in a strict sequence (O₁, O₂, O₃, ...), where the *availability* of offer Oₙ is contingent *only* on the acceptance of all prior offers O₁ to Oₙ₋₁.
  2.  **Vanishing Marginal Probability:** The probability pₙ of receiving the payoff Uₙ for offer Oₙ decreases *super-exponentially* relative to the cumulative probability of reaching that stage. Formally: pₙ = O(δⁿ) for some δ << 1, where the baseline probability of reaching stage n (P(reach n)) itself decreases rapidly (often P(reach n) ∝ Πᵏ₌₁ⁿ pₖ).
  3.  **Sub-Critical Utility Growth:** The payoff Uₙ grows, but at a rate insufficient to offset the collapsing probability of reaching stage n. Specifically, Uₙ grows at most *linearly* or *polynomially* with n (Uₙ = O(nᵏ)), while P(reach n) decreases *exponentially* or faster. This ensures the *total expected value (TEV)* of the entire chain is strictly bounded: TEV = Σₙ₌₁^∞ [P(reach n) * pₙ * Uₙ] < K for some finite K.
  4.  **Local Positive Expected Utility (PEU):** At *every* decision node n (conditional on having reached it), the *marginal* expected utility of accepting Oₙ is strictly positive: E[Uₙ | Reach n] = pₙ * Uₙ > 0. Furthermore, rejecting at n yields 0 at n *and* forfeits the entire future chain. Crucially, the marginal PEU *exceeds* the TEV of the *remaining* chain beyond n (E[Uₙ | Reach n] > TEVₙ₊₁), creating rational pressure to accept *this* offer to preserve future options, even though TEVₙ₊₁ is negligible.

  **Core Pathology:** Agents become rationally "locked in" to pursuing a chain of increasingly improbable payoffs. Each local acceptance is justified by PEU and the fear of forfeiting the *option* of future gains, even though the collective probability of realizing *any* significant payoff converges to zero, and the bounded TEV is vastly exceeded by the resources (time, attention, opportunity cost) consumed by participation.

  ### Conceptual Distinctions from Related Phenomena
  1.  **Pascal's Mugging (Single-Shot):** Involves one offer with infinitesimal p and astronomical U, where E[U] = p*U is undefined/ambiguous or dominates all alternatives. Recursive Mugging has a *bounded, finite TEV*; its pathology arises from the *chain structure and sequential commitment*, not a single overwhelming expectation.
  2.  **St. Petersburg Paradox:** Involves a *single* gamble with *divergent* expected value (TEV = ∞). Recursive Mugging has *convergent, bounded TEV*. The pathology in St. Petersburg is paying arbitrarily large entry fees for infinite EV; here, it's committing to a long chain for negligible TEV due to sequential pressure.
  3.  **Slippery Slope Arguments:** Typically rely on psychological, social, or causal mechanisms where an initial small step *causally enables* later undesirable steps via precedent, habituation, or altered constraints. Recursive Mugging's pressure is *purely logical/axiomatic*: rejecting a locally PEU-positive offer *plus* forfeiting a positive (though negligible) TEVₙ₊₁ violates dominance reasoning under standard EU axioms.
  4.  **Dynamic Inconsistency (e.g., Hyperbolic Discounting):** Involves changing preferences over time. Recursive Mugging exhibits *dynamic consistency under the EU model*: the agent's evaluation *at each node* is consistent with their initial plan *for that node*. The trap is inherent in the structure revealed step-by-step, not a failure of commitment to a prior optimal plan.

  ### Boundary Cases & Edge Mapping
  *   **Finite Chains:** A finite chain of length N behaves identically *until* stage N. At stage N, accepting O_N yields E[U_N | Reach N] = p_N * U_N > 0, and there is *no* future chain to forfeit. The pathology weakens as N decreases. For large N >> 1 / δ (where δ governs probability decay), the behavior near the start mirrors the infinite case – agents get "locked in" for many steps before the finitude becomes relevant. The core pathology is most severe for long finite chains and infinite chains.
  *   **Non-Exponential Probability Decay:**
      *   **Sub-Exponential Decay (e.g., pₙ = 1/n²):** If Uₙ grows slowly enough (e.g., Uₙ = n), TEV may still converge. The *local PEU* condition (E[Uₙ | Reach n] > TEVₙ₊₁) is the critical test. If it holds at every step, it's still a Recursive Mugging. If TEVₙ₊₁ grows large for some n, it transitions towards a St. Petersburg-like chain.
      *   **Slower Utility Growth (e.g., Uₙ = log(n)):** Makes TEV converge faster and local PEU weaker. The "locking in" effect diminishes. If E[Uₙ | Reach n] < TEVₙ₊₁ for some early n, rejecting becomes locally optimal, breaking the chain early. Not a Recursive Mugging.
      *   **Super-Linear Utility Growth (e.g., Uₙ = 2ⁿ):** Risk of TEV *divergence*. If TEV = ∞, it becomes a sequential St. Petersburg problem. The pathology shifts to resource commitment for infinite EV, not lock-in for negligible EV. If TEV converges despite fast Uₙ growth (e.g., pₙ = δ^(2ⁿ)), it remains a Recursive Mugging as long as local PEU dominates TEVₙ₊₁.
  *   **Costly Participation:** Introducing significant per-stage participation costs Cₙ > 0 can break the local PEU (if pₙ * Uₙ < Cₙ) or make TEV negative. The pure Recursive Mugging assumes negligible participation costs relative to the payoffs *at the decision point*. Significant costs reintroduce a rational exit point.

  ### Necessary & Sufficient Conditions Summary
  *   **Necessary:** Conditional Chain + Bounded TEV + Strictly Positive Local PEU at every reachable node + Local PEU > TEV of Remaining Chain at every node.
  *   **Sufficient:** Conditional Chain + Super-Exponentially Vanishing P(reach n) + Polynomially Bounded Uₙ + Local PEU > TEV_{n+1} ∀ n.

  **Recursive Mugging** thus names the specific pathology where axiomatic rational choice compels an agent to indefinitely pursue a chain of conditional bets, each locally justified by positive expectation and the preservation of future options, despite the collective near-certainty of total failure and a total expected value dwarfed by the commitment required. Its core innovation over the single-shot mugging is exploiting the *sequential, conditional structure* to create persistent rational pressure via the threat of *option forfeiture*, even when the forfeited option is objectively worthless.
