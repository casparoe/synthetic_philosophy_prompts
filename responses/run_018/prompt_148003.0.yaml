answer: |-
  Here is an analysis of "when in Rome, do as the Romans do" across four distinct philosophical theses, applied to tipping, queueing, and jaywalking, followed by a committed defense of the coordination-indexed view for a specific city scenario.

  ---

  ### **1. Purely Prudential Claim**  
  *Thesis:* Follow local conventions solely to avoid social sanctions (disapproval, exclusion, confrontation).  
  - **Tipping:** Tip only if service workers expect it and might retaliate (e.g., spit in food) or shame you. No *moral* duty—only strategic avoidance of backlash.  
  - **Queueing:** Jump lines if locals tolerate it without confrontation. If locals enforce queues, comply to evade arguments. Visitors/locals bound identically by self-interest.  
  - **Jaywalking:** Cross illegally only if police or drivers won’t penalize you. Risk assessment, not ethics.  

  **Distinction:** All actions are *advisable* only when sanctions exist; no moral dimension. Locals and visitors act identically out of prudence.  

  ---

  ### **2. Strong Moral Relativism**  
  *Thesis:* Local norms *define* morality—right/wrong depends entirely on the community’s beliefs.  
  - **Tipping:** If locals see tipping as obligatory, refusing is immoral. If tipping is insulting (e.g., Japan), offering it is wrong.  
  - **Queueing:** If queue-jumping is normal, cutting lines is morally neutral; if orderly queues are sacred, skipping is unethical.  
  - **Jaywalking:** If jaywalking is standard, it’s permissible; if illegal and stigmatized, it’s wrong.  

  **Distinction:** Visitors have identical moral duties as locals. "Arbitrary" conventions become morally binding by collective acceptance.  

  ---

  ### **3. Tacit Consent**  
  *Thesis:* Entering a territory implies agreement to follow its rules.  
  - **Tipping:** If tipping is a social rule, visitors consent by arrival and must tip.  
  - **Queueing:** Must queue if local norms treat it as binding order.  
  - **Jaywalking:** Must obey traffic laws as "terms of entry."  

  **Distinction:** Violating norms is a moral breach of promise, not mere imprudence. Locals are rule-*makers*; visitors are rule-*takers*.  

  ---

  ### **4. Coordination-Indexed Claim**  
  *Thesis:** Conventions create genuine but defeasible moral obligations *only* when they solve coordination problems (e.g., efficiency, fairness, harm reduction). Obligation strength depends on participation.  
  - **Tipping:** If tips supplement wages (solving income coordination), duty exists. If arbitrary or harmful (e.g., enabling wage theft), no duty.  
  - **Queueing:** Obligatory if queues prevent chaos/fairness issues; not if queue-jumping is equally efficient.  
  - **Jaywalking:** Permissible if risk-free and conventional; wrong if dangerous.  

  **Distinction:** Moral weight derives from the *function* of conventions. Locals/visitors equally bound *if* they participate in the practice.  

  ---

  ### **Committed Defense: The Coordination-Indexed Thesis in "Roma" City**  
  **Scenario:**  
  - Queue-jumping is the efficient norm (e.g., no chaos, faster service).  
  - Tipping is a demeaning insult (workers earn living wages; tips imply charity).  
  - Jaywalking is universal and low-risk (pedestrian-friendly streets).  

  **Position:** A visitor ought to:  
  - **Queue-jump** (no duty to queue),  
  - **Refrain from tipping** (duty *not* to tip),  
  - **Jaywalk freely** (no duty to use crosswalks).  

  **Why Coordination-Indexed?**  
  Moral obligations arise only when conventions solve real coordination problems:  
  - **Queueing:** Queue-jumping works efficiently here—no fairness or chaos issues. *No coordination problem → no obligation.* Forcing rigid queues would create inefficiency.  
  - **Tipping:** Tipping *causes harm* (emotional offense) and solves no coordination problem (wages are stable). The visitor has a duty *not* to demean workers.  
  - **Jaywalking:** Universal jaywalking coordinates pedestrian flow without safety risks. *Harmless coordination → permissible participation.*  

  **Engaging the Strongest Opposing View: Moral Relativism**  
  Relativism claims tipping is wrong *only* because locals deem it insulting. But this ignores **objective harm**:  
  - Even if locals normalized demeaning practices (e.g., caste-based queues), coordination ethics would reject them *if they perpetuate unfairness*. Here, tipping causes psychological harm (offense) regardless of intent. Relativism cannot condemn harmful norms; coordination ethics can.  
  - *Structural feature:* **Harm vs. Convention**. Offense from tipping is non-arbitrary—it attacks dignity. If no harm existed (e.g., tipping was merely "odd" but not insulting), the duty to avoid it would dissolve.  

  **If the Harm Feature Is Removed?**  
  Suppose tipping is benignly unconventional (like eating snails in France). No harm → no moral duty to comply or avoid. Only coordination problems (e.g., wage stability) would bind.  

  **Etiquette vs. Morality Boundary:**  
  - Queueing and jaywalking are *etiquette* here—conventions without moral weight absent coordination issues.  
  - Tipping crosses into *morality* by causing dignitary harm. The boundary turns on harm/consent: etiquette governs preference; morality governs welfare.  

  **Conclusion:**  
  The coordination thesis avoids relativism’s tolerance of harm and consent theory’s overreach (why "enter" consent to arbitrary norms?). It grounds duties in rational social function—making it the only account that adapts to *why* norms exist. In "Roma," the visitor must reject tipping (harm), but may freely queue-jump and jaywalk (efficient conventions).  

  --- 
  *This defense prioritizes human dignity and social functionality over cultural arbitrariness, rejecting both blind conformity and relativistic surrender to harmful norms.*
