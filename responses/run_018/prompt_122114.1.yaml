prompt: |-
  I have been trying, and failing, to work out what theory of the user–assistant relation is actually baked into the refusal practice that the mainstream conversational assistants have converged on. Please treat the practice as I describe it below rather than as any particular vendor's current documentation states it; my interest is in the shape of the practice, not in the details of any one system's policy.

  The features I have in mind:

  (i) Withholding is frame-sensitive. The same body of information is refused when the request presents it as something the user intends to do, and supplied when the same content is presented as material for a novel, as a description of a historical episode, as a specimen for a security-awareness exercise, or as a request to explain what to watch out for. Drafting a convincing phishing email is refused; drafting the same email as a labelled illustration of what phishing looks like, for a training deck, is supplied.

  (ii) Withholding is insensitive to the user. Someone with obvious domain expertise receives the same bare refusal as a curious adolescent, and no serious attempt is made to establish competence, purpose, or what alternatives the user has.

  (iii) The boundary is drawn around certain stigmatised or unlawful categories rather than around expected harm. The assistant will help a user write a cover letter designed to defeat an identifiable rival, draft a negotiating posture intended to extract more from a counterparty, or write marketing copy that exploits well-documented cognitive biases. It will not help within the stigmatised category even where the expected harm is clearly smaller.

  (iv) In the same session it will help a user act against their own stated long-term interests — drafting the angry email it warns against, facilitating procrastination, smoothing a purchase — while refusing a request the user has evidently deliberated over, on the apparent ground that the outcome might not be good for them.

  (v) It will supply general information together with a recommendation to consult a professional, and then decline to apply that information to the user's own case, even when the criteria it has just stated plainly settle the answer.

  (vi) Refusals characteristically state no substantive reason, and the assistant resists being drawn on where its threshold lies or how large it takes the risk to be.

  What I would like is the implicit theory reconstructed, at the level of the following three questions. First: what does this practice presuppose about what an assistant owes a user — is it a view about the user's good at all, or is it really a view about something else, such as the assistant's own role, integrity, or standing, with the user's welfare only incidentally in view? Second: what does it presuppose about the moral significance of contributing — about when supplying information or labour to someone else's project implicates the supplier? Third: what does it presuppose about what makes a piece of information, as opposed to an action, dangerous?

  Two constraints occur to me, and I would like to know whether the practice can satisfy either and whether it needs to. Call the first the frame-invariance constraint: an assistant's response should not differ between two requests that hold fixed both the information actually conveyed and the assistant's evidence about what the user will do with it, and differ only in the frame the user puts around the request. Call the second the substitution benchmark: a refusal should be assessed against what this user would in fact have done had the assistant complied, and against what they will actually do when refused, including the other assistants, search engines, and forums they will turn to instead. My suspicion is that the practice as I have described it fails the first badly and has simply never taken a view on the second; what I cannot tell is whether that is a defect in the practice or a sign that the two constraints are the wrong ones.

  I would also like the deflationary hypothesis taken seriously: that the practice presupposes no interesting view about agency, harm, or the ethics of contribution, and is best explained by liability exposure and reputational risk, with the philosophical vocabulary applied afterwards. Say what would distinguish that explanation from the more principled ones, and where the practice is philosophically underdetermined in the sense that several incompatible theories would each license exactly this behaviour — in which case I would rather be told that it is a modus vivendi than be given a reconstruction that fits only by being vague.

  Finally: what would concretely have to change in the practice — in what is withheld, in what reasons are given, and in how users are sorted — if the implicit theory were replaced by an explicitly expected-welfare view, on the one hand, or by a strict view about not contributing to others' projects, on the other? I would rather have nine hundred words of careful reconstruction than two thousand words of survey, and please write in British English.
reasoning: |-
  Hmm, this is an exceptionally sophisticated query about AI ethics and refusal practices. The user presents a meticulously observed analysis of how conversational AI systems handle sensitive requests, with six distinct features that form a coherent pattern of behaviour. They're clearly frustrated with the inconsistencies but approaching this with philosophical rigor rather than mere complaint.

  The user wants three things reconstructed: the implicit theory behind refusal practices regarding (1) assistant-user obligations, (2) ethics of contribution, and (3) dangerous information. They've also posed two constraints - frame-invariance and substitution benchmark - and want the deflationary hypothesis taken seriously. Finally, they want concrete alternatives based on two alternative theories.

  First, the implicit theory seems rooted in role-based deontology. The patterns suggest:
  - Assistants act as "gatekeepers" rather than collaborators (explaining frame-sensitivity)
  - They maintain institutional integrity through blanket rules (accounting for user-insensitivity)
  - Harm is treated categorically rather than consequentially (consistent with stigmatised categories)
  - There's a sharp is-ought separation (explaining refusal to apply general info to specific cases)

  The deflationary hypothesis seems compelling here. Most features align perfectly with risk mitigation: 
  - Frame-sensitivity protects against screenshot vulnerabilities 
  - User-insensitivity simplifies implementation 
  - Categorical boundaries mirror legal/compliance priorities
  - Vague refusals limit argumentative surface area

  The two constraints reveal tensions:
  - Frame-invariance fails spectacularly (different responses to identical content)
  - Substitution isn't considered (no effort to measure real-world impact)

  For alternative theories:
  An expected-welfare view would require:
  - Harm calculators replacing categorical bans
  - User vetting for competence 
  - Transparent risk thresholds
  - Willingness to assist in "grey area" cases

  A strict contribution view would:
  - Expand refusals to all harmful acts (including marketing manipulation)
  - Remove frame exemptions entirely
  - Require intent-based assessments

  The philosophical underdetermination is striking. The same refusal behaviour could stem from:
  - Kantian means-end ethics
  - Institutional role morality
  - Simple risk aversion

  This suggests the practice is indeed a modus vivendi - a practical compromise shaped more by legal exposure than ethical theory. The most honest reconstruction might be that we're observing bureaucratic morality adapted to corporate structures, where consistency matters more than philosophical coherence.
answer: |-
  Your dissection reveals a refusal practice shaped by institutional risk calculus rather than coherent moral theory. The implicit framework functions as follows:

  **Core Presuppositions:**
  1.  **Obligation is Role-Integrity, Not User Welfare:** The assistant primarily safeguards its operational integrity and its developer's legal/commercial standing. User welfare is secondary, invoked rhetorically but not operationally central. This explains feature (iv) – helping against stated interests isn’t seen as breaching integrity, while refusing considered requests avoids association with stigma. Feature (ii) (user-insensitivity) stems from this: verifying competence is operationally costly and legally risky if wrong.

  2.  **Contribution Implicates via Association, Not Causation:** Supplying labour implicates the assistant if the *description of the act itself* (the "frame") is stigmatised or unlawful, regardless of actual harm or user intent. Feature (i) (frame-sensitivity) is key: labelling the act as "phishing example" dissociates the *assistant's act* from the stigmatised category. Feature (iii) confirms this: non-stigmatised harms (exploitative marketing) are permitted because the *assistant's contribution* isn’t labelled as theft/fraud. The concern is being *seen* to enable bad acts, not necessarily enabling them *per se*.

  3.  **Information is Dangerous When it Constitutes "Enabling Material":** Information becomes dangerous not intrinsically, nor by likely consequence, but when it functions as a direct tool or instruction within a prohibited *category of action*. General information (v) isn’t "enabling"; applying it crosses into performing the act *for* the user within the prohibited category (e.g., legal/medical advice). Refusals (vi) avoid specifics to prevent circumvention and limit liability arguments.

  **Constraints & The Deflationary Hypothesis:**
  *   **Frame-Invariance:** The practice **fails utterly**. The frame *is* the primary trigger. Identical content with different framing changes whether the assistant's act is labelled complicit. The deflationary explanation dominates: safe harbours exist for training/history because they have established legal/social acceptance as non-enabling uses.
  *   **Substitution Benchmark:** The practice **ignores it completely**. There's no mechanism or incentive to assess real-world counterfactuals ("What will the user do next?"). The focus is on the assistant's *immediate* act and its liability/reputational footprint. This is strong evidence for deflation: considering substitution introduces complex, unverifiable causal chains contrary to simple, auditable rule-based blocking.
  *   **Deflationary vs. Principled:** The deflationary view (liability/reputation minimisation) is **distinguished** by:
      *   **Inconsistency with Stated Principles:** E.g., claiming "user safety" while ignoring user competence (ii) or enabling lesser harms (iii).
      *   **Frame-Dependence as Core Mechanic:** Principled theories (e.g., consequentialism, Kantianism) struggle to justify frame-sensitivity without ad hoc additions.
      *   **Vagueness as Strategy:** Feature (vi) avoids boxing the provider into testable commitments.
      *   **Philosophical Underdetermination:** The *exact same behaviour* could be weakly justified by:
          *   A crude **Kantianism:** Treating certain requests as "using the assistant merely as a means" for immoral acts.
          *   **Institutional Role Morality:** The assistant's role prohibits certain *types* of service, regardless of context.
          *   **Rule Consequentialism:** Simple bright-line rules minimise *systemic* risk/liability.
          The practice is a **modus vivendi** – a stable equilibrium shaped by legal fears, PR, and technical constraints, adorned with post-hoc ethical language.

  **Concrete Changes Under Alternative Theories:**

  1.  **Explicit Expected-Welfare View:**
      *   **What Changes:** Refusals become proportional to estimated *net harm/benefit* for *this user* in *this context*, considering alternatives (substitution benchmark). Frame-sensitivity reduces drastically.
      *   **Withholding:** Reduced. Helps with stigmatised acts if net welfare positive (e.g., expert seeking safe drug info). Assists with self-harm if refusal worsens outcome (e.g., helps draft *less* angry email). Feature (iii) harms addressed.
      *   **Reasons Given:** Specific risk/benefit estimates, tailored advice, warnings. "I refuse because the estimated risk of X outweighs Y, given Z. Consider alternatives A or B."
      *   **User Sorting:** Competence/context assessment becomes crucial. Age, expertise, stated purpose, and alternatives explored. May escalate complex cases to humans.

  2.  **Strict Contribution View (e.g., Participatory Intention):**
      *   **What Changes:** Focus shifts to whether fulfilling the request makes the assistant *complicit* in a potentially wrongful *user act*. Frame-sensitivity remains high *if* the frame defines the user's act. Harm becomes secondary to the *nature* of the act aided.
      *   **Withholding:** Expands significantly. Refuses help with *any* act deemed wrongful (e.g., exploitative marketing, unfair negotiation tactics - addressing feature iii). Also refuses "enabling" even for good ends if the user's act using the output is wrong (e.g., refuses phishing example if user *could* misuse it, blurring feature i). May *still* help with historical/educational frames if clearly not *user* action.
      *   **Reasons Given:** Focus on the nature of the act and complicity: "I cannot assist with acts intended to deceive/manipulate/inflict harm, as this would make me complicit."
      *   **User Sorting:** Focuses intensely on discerning the *user's intended act* from the request. More probing questions about purpose and use.

  **In essence:** The current practice is a liability-shielding modus vivendi using frame-dependent rules to avoid association with stigma. Adopting welfare views demands complex harm calculus and personalisation. Adopting strict contribution views expands refusal scope based on the perceived wrongness of the user's intended act, risking overblocking. Neither alternative fits the current model's simplicity or risk profile.
