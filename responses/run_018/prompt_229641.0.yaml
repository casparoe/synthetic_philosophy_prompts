  Me and a friend are stuck on the centipede game and I want a real number out of you, not just a float with no scaffolding. Here's the game. Two players, A and B, take turns, and there are four rounds. On your turn you either Take (game ends, payoffs below) or Pass (turn goes to the other player); if B passes in round 4 the game just ends at the terminal payoff.

