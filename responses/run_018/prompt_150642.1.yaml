prompt: |-
  I'm running a small semenar for philosophy undergrads who just finished phyiscalism but haven't done mental causation. I want to teach the causal exclusion argument - the problem where physics explains the arm movement, so intention looks redundant. Need a teaching plan, not the lecture.

  My proposed carrying example is a smart thermostat: sensors trigger the heater, but we also describe it as "deciding" it's cold. I worry this makes mental causation sound like software on hardware, which sneaks in a solution. So plan the arc: what must come before exclusion makes sense? Order: completeness of physics, overdetermination, then the exclusion principle? What's the right concrete scenario instead, and what's wrong with the thermostat?

  Misconceptions I expect: they'll say "intentions are brain states, so same cause," then "multiply realizable properties do causal work because the physical base is just one instance," and maybe "macro-patterns like wetness cause things too." Where do I block each?

  End check: one question showing they see why exclusion hurts non-reductive physicalism specifically, not dualism. And what do I leave out - maybe Kim's functional reduction answer, or downward causation? Write casually, a couple typos ok.
reasoning: |-
  Okay, the user is teaching philosophy undergrads about the causal exclusion argument. They've covered physicalism but not mental causation yet. The main goal is to explain why intentions seem redundant when physics fully explains actions. 

  First, I need to understand their concerns. They proposed using a smart thermostat as an example—sensors trigger the heater, but we say it "decides" it's cold. They're worried this might imply a software/hardware dualism, which could sneak in a solution. So the key is to find a better example that avoids that pitfall. 

  The user mentions common misconceptions: students might say intentions are just brain states, or that multiply realizable properties (like wetness) can cause things. They want to block those. Also, they need a question at the end to check if students understand why exclusion targets non-reductive physicalism specifically, not dualism.

  The user’s deeper need is probably to make the abstract argument tangible without oversimplifying. They want students to feel the tension between physical completeness and mental causation. The thermostat example is too easy because it’s designed—it’s clear the "decision" isn’t real. A human example like reaching for water would work better because the mental state feels genuinely causal, creating the puzzle.

  For the teaching arc: Start with completeness of physics (no gaps), then overdetermination (rare/weird), then exclusion (no room for extra causes). Block misconceptions step by step: when students say "intentions are brain states," remind them non-reductive physicalism treats mental properties as distinct. For multiply realizability, point out wetness supervenes on physics, so it’s not an independent cause—same as the mental.

  End with a question like: "Why does the exclusion argument threaten non-reductive physicalists more than dualists?" Answer: Dualists can deny completeness; non-reductive physicalists accept it but struggle to fit mental causation in. Leave out Kim’s solutions to avoid complicating the core argument. Focus on the problem, not fixes.
answer: |-
  Here's a teaching plan focusing on the **causal exclusion problem** for non-reductive physicalism, designed for a seminar setting. Avoids the thermostat pitfall and targets expected misconceptions.

  **Goal:** Students grasp why the causal exclusion argument creates a *specific problem* for non-reductive physicalism (NRP), threatening mental causation without resorting to dualism or reductionism.

  **Core Problem Arc:** Completeness -> Exclusion -> Threat to NRP (Overdetermination is the *consequence* we want to avoid, not the starting point)

  **Teaching Plan Outline (60-75 mins):**

  1.  **Hook & Recap (10 mins):**
      *   **Concrete Scenario:** "You feel a sharp thirst (mental state: desire for water), you form the intention to grab your glass (mental state: intention), your arm moves, you drink. What caused the arm movement?"
      *   **Recap Physicalism:** They just finished physicalism. Quick check: "What's the core physicalist commitment regarding this arm movement?" *(Elicit: The movement is entirely caused by prior physical events/states - neurons firing, muscle contractions, etc.)*
      *   **Plant the Seed:** "So, we have two stories: 1) My *intention* caused my arm to move. 2) Specific *neural events* caused my arm to move. How do these fit together under physicalism?"

  2.  **Establishing the Battleground: Completeness of Physics (Causal Closure) (15 mins):**
      *   **Define Clearly:** "Completeness of Physics (Causal Closure): Every physical event has a *sufficient physical cause* that occurred *at the time* it was determined to happen. There are no 'gaps' in the physical causal chain where non-physical stuff needs to jump in."
      *   **Why Physicalists Accept It:** Empirical success of physics, conservation laws, no evidence of non-physical energy/intervention. *Crucial:* Emphasize this is a **premise** NRP accepts.
      *   **Implication for Arm Movement:** The arm movement (physical event) has a sufficient physical cause (neural events P1...Pn). Done. Period. *Ask:* "Given completeness, does the arm movement *need* any other cause?"

  3.  **Introducing Non-Reductive Physicalism (NRP) (5 mins):**
      *   **Core Idea:** "Mental states (like intentions, desires) are *real*, distinct properties, but they *depend on* (supervene on) physical states. You can't change the mental without changing the physical. BUT, they aren't simply *identical* to specific physical states (multiple realizability!)."
      *   **Commitment:** "NRP typically wants to say mental states are *causally relevant* or *do causal work*. My intention *causes* my arm movement."

  4.  **The Hammer: Causal Exclusion Principle (10 mins):**
      *   **State the Principle:** "If an event `e` has a *sufficient cause* `c` at time `t`, then no *distinct event* `c*` (occurring at `t` or before) can be a cause of `e` (unless it's a case of genuine overdetermination)."
      *   **Apply to Arm:** Event `e` = Arm movement. Sufficient physical cause `c` = Neural events (P1...Pn). Mental cause `c*` = Intention (M). Principle says: If P1...Pn is sufficient for `e`, then M *cannot* also be a cause of `e` (unless... overdetermination?).
      *   **The Dilemma:** "NRP says M is *distinct* from P1...Pn (it's multiply realizable, supervenient but not identical). Completeness says P1...Pn is *sufficient*. Exclusion says: If P1...Pn is sufficient, M can't cause `e` *unless* M = P1...Pn (reductionism) or it's overdetermination. But NRP denies M = P1...Pn!"

  5.  **Blocking Misconceptions & Exploring Consequences (15 mins):**
      *   **Misconception 1: "Intentions *are* just brain states (P1...Pn), same cause!"**
          *   *Block:* "NRP *denies* this strict identity! It insists M is a *different property*, even if it always depends on *some* physical base. If M *were* identical to P1...Pn, we'd have reductionism, problem solved for physicalism but NRP collapses. NRP wants M to be *more* than just P1...Pn."
      *   **Misconception 2: "But M is multiply realizable! The *property* 'intention' does the work, not just this instance P1...Pn."**
          *   *Block:* "Exclusion targets *this specific instance*. For *this* arm movement `e`, *this* sufficient physical cause P1...Pn exists. What causal work is left for *this* instance of M (which supervenes on P1...Pn) to do? If the property M *in general* is multiply realizable, that doesn't show how *this particular M* adds any *extra* causal oomph *over and above* P1...Pn *in this specific case*."
      *   **Misconception 3: "Macro-properties cause things! Wetness causes slipping, not just H2O molecules!"**
          *   *Block:* "Good point! But let's analyze 'wetness causes slipping':
              *   Option A: Wetness *just is* a configuration of H2O molecules. The molecules cause slipping. Wetness = the physical state (leaning towards reduction).
              *   Option B (NRP-like): Wetness is a distinct, higher-level property supervening on H2O molecules. But... Completeness applies! The slipping (physical event) has a sufficient physical cause (molecular interactions P1...Pn). Exclusion kicks in: What does the *distinct property* wetness add? If P1...Pn is sufficient, wetness seems epiphenomenal *or* we have overdetermination."
          *   *Key:* This shows the exclusion problem *generalizes* beyond the mental! It's a problem for any supposedly "higher-level" causation under physical completeness. The mental case is just the most pressing.
      *   **Overdetermination?** "Is the arm movement overdetermined? Like two bullets hitting simultaneously? Possible? Yes. Plausible? For *every single intentional action*? Highly doubtful! It seems like a bizarre, systematic coincidence that the physical cause *and* the distinct mental cause *both* just happen to be sufficient, independently, every time. NRP doesn't *want* this solution – it makes mental causation freakishly lucky, not fundamental."

  6.  **Why This Hits NRP Hard (Not Dualism) & Check (5 mins):**
      *   **Contrast with Dualism:** "Why isn't the dualist worried? Because dualists *deny Completeness*! They say the physical chain *isn't* sufficient; the non-physical mind *must* intervene in the gaps. Exclusion relies on Completeness – which dualists reject! NRP, however, *accepts* Completeness but wants distinct mental causes. That's the tension!"
      *   **Check Question:** "So, why does the causal exclusion argument pose a *special problem* for non-reductive physicalism, but *not* for dualism?" *(Target Answer: NRP accepts Completeness of Physics, which is the premise that, combined with Exclusion, threatens mental causation. Dualists reject Completeness, so Exclusion doesn't get the same grip.)*

  7.  **Wrap-up & The Problem Stated (5 mins):**
      *   Restate the dilemma for NRP: "If you accept Completeness (which you should, as physicalists), and you think mental properties are distinct (non-reductive), then the Exclusion Principle seems to show those mental properties *cannot* be genuine causes of physical events. They are either epiphenomenal (causally inert side-effects) or lead to massive, implausible overdetermination. Ouch."
      *   **What's Next?** Briefly hint: "So, what are the options? Give up distinct mental causation (reductionism/eliminativism)? Give up Completeness (dualism)? Find a flaw in Exclusion? Or find a way for mental properties to cause without 'adding' anything extra? That's the battleground." (Don't dive into Kim's functional reduction or downward causation here - the point is to let the problem sink in).

  **Why Ditch the Thermostat?**

  *   **Sneaks in Reduction/Design:** It *is* just software on hardware. The "decision" is transparently reducible to sensor inputs and programmed algorithms. It doesn't model the *distinctness* and *phenomenal feel* of genuine mental states that NRP wants to preserve. It resolves the problem by *being* reductively explainable, undermining the very tension NRP faces.
  *   **Lacks the Sting:** Students won't feel the intuition that the thermostat's "decision" *really* causes the heat to come on *separately* from the sensor inputs in the way they feel their own intention *really* causes their arm to move. The human case creates the genuine puzzle.

  **Key Teaching Moves:**

  *   **Anchor in the Human Example:** Keep coming back to "intention -> arm movement" and "neurons -> arm movement".
  *   **Clarify "Distinct":** Hammer home that NRP requires mental properties to be *irreducibly distinct* (even if supervenient) for the problem to arise.
  *   **Completeness is Key:** Stress that this is the non-negotiable premise for physicalists that makes exclusion bite.
  *   **Let Them Grapple:** Use Socratic questioning when misconceptions arise. "Okay, if M is distinct from P, and P is sufficient for e, *how* exactly does M cause e? What does it *add*?"
  *   **Embrace the Tension:** The goal is for them to *feel* the force of the problem for NRP. Don't rush to solutions.
