  I think I'll argue against it counting as knowledge, because: 1) knowledge requires accessible justification 2) the subconscious process is accidental, not reliable 3) the conscious process remains defective 4) "reliability" requires accessible mechanisms 5) therefore it fails both justification and reliability criteria. 

