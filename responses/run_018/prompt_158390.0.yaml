answer: |-
  **Brainstorming Cultural Divergences in Folk Morality:**  
  1. **Moral Ontology Variance:** Some cultures ground morality in ancestor spirits (violating taboos = objective cosmic harm), while others prioritize social harmony (immorality = disruption of relational balance).  
  2. **Blame/Responsibility Thresholds:** Cultures differ radically in how *control* factors into blame—e.g., societies with strong fate beliefs might assign less blame for "controllable" acts than autonomy-focused cultures.  
  3. **Value Lexical Ordering:** When core values conflict (e.g., truth vs. loyalty), cultures resolve them differently. One might excuse lying to protect kin; another might condemn it absolutely.  

  ---  

  **Exam Question:**  
  "Imagine anthropological fieldwork reveals that in the *Tareku* horticulturist society, **accidentally harming someone during inter-clan resource disputes** (e.g., misfiring an arrow during a tense standoff) is consistently judged *more morally blameworthy* than **intentionally harming someone** in the same scenario. Interviews show Tareku elders view intentional harm as signaling transparent alliance-defense (thus partly *virtuous*), while accidents suggest incompetence or hidden malice ('Why weren’t you controlling your weapon? You endangered your *own* clan!').  

  (a) First, clarify how this finding illustrates *descriptive relativism* without logically entailing *normative anti-realism*.  
  (b) Then, focus on control-based principles of moral responsibility (e.g., ‘S is blameworthy only if S had control over causing harm’). Explain why *any* control principle appears **self-undermining** in the Tareku case—and whether this problem is fatal to moral objectivity. Keep your argument under 800 words."  

  ---  

  **Model Answer (620 words):**  
  (a) Descriptive relativism is the *empirical thesis* that moral norms vary non-randomly across cultures due to differing social-ecological conditions. The Tareku case exemplifies this: their unique ecology (resource-scarce, clan-based horticulture) makes overt intentionality in conflict a *reliable signal of loyalty*, reframing intent as mitigating rather than aggravating. Blame attaches instead to accidents because unpredictability threatens clan survival. This divergence isn’t noise—it’s a functional adaptation. Crucially, this *doesn’t* entail normative anti-realism (the metaphysical claim that there are no objective moral facts). One could accept Tareku norms as locally rational *while also holding* that an objective morality exists (e.g., rooted in well-being) that Tareku misapplies. Descriptive facts ≠ normative conclusions.  

  (b) Control principles (CPs) face a trilemma here. Most CPs assume control *reduces* blameworthiness—but for Tareku, losing control *increases* blame. Let’s test three CP fixes:  

  - **Option 1:** *"Blame requires control over the* ***act*** *itself."*  
    Fails: Both actors controlled their bow-handling; the difference is contextual *interpretation* of control’s significance. Tareku *has* a CP—they just weight control’s moral valence oppositely in conflict scenarios.  

  - **Option 2:** *"Blame requires control over the* ***harm's moral meaning***."*  
    Self-undermining: Tareku’s "moral meaning" (alliance-signaling) is culturally constructed. If CPs must accommodate *any* local meaning, then CPs can’t ground *universal* responsibility conditions—undercutting their own authority.  

  - **Option 3:** *"Blame requires control as defined by* ***objective practical reasoning***."*  
    Also self-undermining: If "objective" means transcultural, we’re back to anti-realism debates. If it means "instrumentally rational locally," Option 3 collapses into Option 2—Tareku’s view *is* rational *for them* (preventing defection/chaos).  

  **So is CP dead? Not necessarily—but objectivity must be reconceived.** The problem isn’t variation itself but CP’s *contingency* on non-moral facts (e.g., ecology). We might salvage objectivity by:  
  - **Pluralistic objectivism:** Multiple blame practices track real moral reasons *contextually*. Tareku emphasizes *duty to group stability*; WEIRD societies focus *individual autonomy*. Both could be objectively valid facets of responsibility.  
  - **Meta-normative constraints:** Even if blame norms vary, objectivity might survive if *all* systems satisfy meta-conditions (e.g., coherence, responsiveness to reasons). Tareku’s system isn’t arbitrary—it’s reason-based given their reality.  

  **Conclusion:** The Tareku case *does* destabilize simple CPs by exposing their dependence on unstated cultural priorities. But it doesn’t kill moral objectivity—it demands a more sophisticated account of how context interacts with invariant moral values (e.g., welfare, reciprocity). Control remains key, but its *moralized expression* is path-dependent.  

  ---  
  **Marking Scheme (20 marks total):**  
  1. **☑️ DR vs. NAR distinction nailed (4 marks)**  
     *Botch: Conflates "different norms exist" (DR) with "no norms are true" (NAR).*  
  2. **☑️ CP’s self-undermining explained via Tareku inversion (5 marks)**  
     *Botch: Says CP "doesn’t apply" to Tareku rather than showing how CP logic implodes.*  
  3. **☑️ Trilemma of CP fixes analyzed (5 marks)**  
     *Botch: Only critiques one CP variant; misses the performative contradiction in Option 2.*  
  4. **☑️ Objectivity salvage attempt beyond "anything goes" (4 marks)**  
     *Botch: Assumes variation = anti-realism or retreats to relativism as solution.*  
  5. **☑️ Tareku’s alliance-signaling integrated (2 marks)**  
     *Botch: Treats intent/accident as bare facts, ignoring the cultural framing of control.*  

  ---  
  *Coffee-stained footnote from your imaginary colleague:* "Btw, students *always* miss that the Tareku case makes accidents *more* agent-implicating—it’s not that control doesn’t matter, it’s that ‘failed control’ implies *deeper* vice. Drill that in post-exam debrief!"
