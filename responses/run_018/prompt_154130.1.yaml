answer: |-
  Here's a joke built around that specific moral psychology clash and the philosopher's ironic downfall:

  **The Setup:**  
  Dr. Thaddeus Finch, a WEIRD philosopher utterly convinced morality *must* be objective and universal, decided the best way to prove it was through a live demonstration. He gathered two focus groups: one from his own university (WEIRD, intentions-focused) and a delegation visiting from the Island of Atarua (known for prioritizing ritual purity and spiritual consequences).

  He stood between them, holding a beautiful, ancient, and *extremely* sacred Ataruan Ceremonial Vase. "Observe!" Finch declared. "Today, we settle the objectivity of morality! I shall perform two acts. You will judge their moral weight!"

  **The Experiment (and Disaster):**  
  1.  **Act One (Intentional):** Finch raised the vase dramatically... then *deliberately* smashed it onto the floor. Shards flew everywhere. "There!" he proclaimed. "A *knowing* transgression! I *intended* to break it!"
  2.  **Act Two (Accidental - Planned):** He picked up an *identical* spare vase (he'd brought two, being thorough). "Now, watch closely! I shall *accidentally* knock this one over!" He positioned himself carefully near the edge of a table, ready to stage a convincing stumble.

  **The Twist:**  
  As Finch turned to address the WEIRD group ("You see, *intention* is paramount..."), his overly enthusiastic gesture with the spare vase caught the sleeve of his tweed jacket. The vase wobbled precariously. He fumbled, lunged clumsily... and sent it crashing to the floor just as violently as the first. A genuine, flailing accident born of sheer carelessness.

  **The Reactions:**  
  *   **The WEIRD Group:** Gasped! Murmurs rose: "Did you see that?!" "He *meant* to break the first one!" "Yes, exactly! Clear intent!" "But the second one... he looked genuinely surprised?" "Perhaps... but the *first* act was pure malice!" They were intensely debating Finch's mental states during both events, focusing laser-like on his *intentions*, especially the deliberate first break.
  *   **The Ataruan Delegation:** Stared in horrified silence at the shattered sacred objects. The High Priest finally spoke, voice trembling with fury: "Two vases lie broken! The sanctity of this space is *shattered*! The spirit of the Clay Mother weeps! And *look* at him!" They pointed at Finch, red-faced and flustered from his clumsy accident. "His chaotic energy! His *carelessness*! His very *character* is revealed in this mess – he is a walking vortex of spiritual pollution! The outcome is catastrophic, *doubly* so!"

  **The Punchline:**  
  Dr. Finch, clutching his clipboard (which he also nearly dropped), beamed triumphantly at the conflicting outrage. "PERFECT!" he yelled over the din. "The data is conclusive! My WEIRD colleagues fixate solely on my *mental state* during the first break! The Ataruans condemn the *outcome*, the *pollution*, and my revealed *character* from the second! Utterly different moral frameworks! This proves..." He paused, puffing his chest out, "...that morality is... uh..."

  He trailed off. The WEIRD group glared because he *intentionally* destroyed sacred property. The Ataruans glared because his *careless character* had *doubly* polluted the sacred space and brought terrible outcomes. Both groups, for their own culturally coherent reasons, found Dr. Finch *himself* morally reprehensible at that moment.

  Finch looked down at his shattered vases, then at his furious audience, then at his clipboard – which finally slipped from his sweaty grasp and clattered loudly onto the pile of ceramic shards.

  **(Muttering)** "...objectively... messy."

  ---

  **Why it works (hopefully):**

  1.  **Core Concept:** Clearly contrasts WEIRD (intent-focused debate about Act 1) vs. Ataruan (outcome/pollution/character-focused condemnation of Act 2 *and* Finch himself).
  2.  **Philosopher Owned by Data:** Finch's genuine clumsiness (Act 2) provides the perfect data point *against* his WEIRD bias (it wasn't intended, but *was* careless) and *for* the Ataruan view (it caused pollution and revealed bad character). His *planned* Act 1 offends the Ataruans purely through outcome/intentional sacrilege. His *actual* clumsiness offends the WEIRD group by introducing ambiguity and highlighting his carelessness *as* a character flaw relevant to intent. His very *presence* becomes the problem for both.
  3.  **The Twist:** The *second* vase breaks *genuinely* accidentally due to his carelessness, perfectly merging the concepts – it's an unintended *outcome* revealing flawed *character* causing *pollution*. This single act offends both groups *on their own terms*.
  4.  **Accessible:** Uses generic concepts (sacred vase = spiritual pollution, clumsy accident = bad character/carelessness, deliberate smashing = clear intent). No specific studies required.
  5.  **The Final Irony:** His dropped clipboard is a tiny, unintended bad outcome caused by his own stressed state (character?), mirroring the vase breakage on a smaller scale, emphasizing the "messiness" he mutters about – the failure to find clean objectivity. He becomes the living embodiment of the problem he's studying.
