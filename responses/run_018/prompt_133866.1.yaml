  **Q2: Does rational agency require a resolution mechanism?**  
  - **Yes (MY):** Agency demands a decisive method.  
    **Q3: Which resolution mechanism?** *(Same options as RY)*  
  - **No (MN):** Rational agency can tolerate unresolved underdetermination.  

  **Then for MY/MN:**  
  **Q4: Does choosing one option entail "tragic residue"?**  
  **Q5: Can institutional rules substitute for first-order moral valuation?**  

