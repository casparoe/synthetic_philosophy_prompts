  ### Decision Tree: Commitments in Hard Choices with Incommensurable Goods  
  **Root Dilemma:** A fixed public budget must be allocated between:  
  - **Option A:** An irreplaceable cultural-preservation initiative (defunding → irreversible loss of cultural heritage).  
  - **Option B:** An emergency medical intervention (defunding → irreversible loss of lives).  
  *Neither can be fully funded; both entail irreversible loss.*  

  ---

  #### **Q1: Is the conflict between Option A and Option B characterized by...**  
  - **Radical Incommensurability (R):** *No shared evaluative dimension exists.* The goods cannot be compared even qualitatively (e.g., no common framework to relate cultural heritage to human lives).  
  - **Moderate Incommensurability (M):** *No single quantitative scale exists, but "thick" comparative judgments are possible.* The goods can be holistically weighed in context (e.g., "all things considered, saving lives is *better* here, but not quantifiably so").  

  ---

  #### **Branch R: Radical Incommensurability**  
  **Q2: Does rational agency require a resolution mechanism?**  
  - **Yes (RY):** Agency demands a decisive method.  
    **Q3: Which resolution mechanism?**  
    - **Lexical Priority (L):** One good *always* overrides the other (e.g., "lives over culture" or vice versa).  
    - **Contextual Weighing (C):** Case-specific judgment allows non-quantitative comparison.  
    - **Satisficing (S):** Choose any option meeting a threshold of "good enough."  
    - **Procedural Delegation (P):** Defer to a fair procedure (e.g., expert panel, lottery).  
  - **No (RN):** Rational agency can tolerate unresolved underdetermination.  

  **Then for RY/RN:**  
  **Q4: Does choosing one option entail "tragic residue" (unavoidable moral cost)?**  
  **Q5: Can institutional rules substitute for first-order moral valuation?**  

