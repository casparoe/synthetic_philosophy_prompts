  I recall the spandrels paper critiques adaptationist just-so stories. The user extends this by flipping the burden of proof. For narrative preference as a spandrel of ToM, they challenge the adaptationist view that it's selected for social coordination. To counter their position, evidence must show that narrative structure isn't just a byproduct but was directly selected for.

  Key points to address: What evidence would shift the burden back? The user mentions formal results or empirical findings. Possible counters include domain-specific features in narrative processing that aren't explained by ToM alone, like specialized neural circuitry for stories beyond ToM regions. If studies show narratives activate areas distinct from ToM, that could indicate separate adaptations.

  Another angle is mismatch: if narrative preferences lead to maladaptive outcomes in modern contexts, but that might not suffice. Better would be evidence of costly traits dedicated solely to narrative processing, like rituals or artifacts from ancient times that served narrative functions at a cost, suggesting selective pressure.

  Falsifiability is a concern. The user worries their stance might be unfalsifiable if any adaptive benefit is claimed. To avoid this, the null hypothesis must be specific: narrative preference arises from ToM constraints. Falsification would require showing it's not emergent from ToM but has unique, selected features.

  The user might also need clarity on what constitutes "direct evidence." Genomic studies linking narrative-related genes, or cross-cultural universals in narrative structures that can't be explained by general cognition. If narratives solve specific adaptive problems beyond what ToM handles, that would challenge the spandrel view.

