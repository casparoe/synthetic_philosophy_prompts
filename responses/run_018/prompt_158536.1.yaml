answer: |-
  Your interpretation absolutely pushes Gould and Lewontin further than the common "mild warning," and your "reverse adaptationism for architecturally constrained domains" is a powerful and logically consistent application of the spandrels critique. Applying this to narrative preference is insightful. Let's break down the challenges and what could genuinely move the needle against your spandrel-default position:

  **Core of Your Position (Strong Spandrels Default):**
  1.  **Architectural Constraint:** A complex, functionally integrated system (like mammalian visual cortex, or core human social cognition/ToM) is established by strong selection for specific primary functions (e.g., edge detection, predicting behavior of conspecifics).
  2.  **Emergent Byproduct:** Traits that naturally arise from the operation of this constrained architecture, especially if they are computationally inexpensive or logically necessary consequences (like narrative structure emerging from ToM), should be considered **spandrels by default**.
  3.  **Burden of Proof:** The onus is firmly on the adaptationist to provide *specific, targeted evidence* that this emergent trait was *itself* directly shaped by selection for its current form/function. "It might be adaptive" or "it could have been co-opted" is insufficient. The null hypothesis is the spandrel.

  **What Would *Genuinely* Count Against Your Position (Shifting the Burden):**

  For narrative preference specifically as a byproduct of ToM, the evidence needed to challenge your spandrel-default must demonstrate that narrative processing involves something *more* than, or *fundamentally different from*, the core, constrained ToM machinery. It needs to show features that cannot be explained *as a necessary or cheap consequence* of ToM itself. Here's the kind of evidence that should move you:

  1.  **Domain-Specific Neural Circuitry & Processing:**
      *   **Evidence:** Identification of dedicated neural modules or pathways *specifically for narrative comprehension/structure* that are:
          *   Anatomically distinct from core ToM regions (e.g., distinct from TPJ, mPFC, STS).
          *   Functionally specialized *only* for narrative elements (e.g., plot structure, causal chains between non-social events, thematic abstraction) and not engaged by equivalent non-narrative social reasoning tasks requiring similar levels of ToM.
          *   Developmentally early and canalized, showing less plasticity than surrounding ToM regions.
      *   **Why it Counts:** This suggests an evolutionary "investment" in narrative *per se*, beyond the substrate provided by ToM. It implies selection acted directly on narrative processing circuitry.

  2.  **Functional Incompatibility with Core ToM:**
      *   **Evidence:** Demonstrating that narrative processing *interferes with* or *is computationally incompatible* with efficient core ToM function in predictable ways, yet persists because it solves a *different*, specific adaptive problem.
      *   **Example:** If intense narrative engagement *systematically impaired* real-time social judgment or cheater detection in contexts where both are required, but conferred such a strong *separate* benefit (e.g., complex long-term coalition planning via shared myth) that the cost was worth it. This shows it's not *just* riding ToM; it's a distinct function potentially in tension with it.
      *   **Why it Counts:** This breaks the "cheap byproduct" assumption. If narrative directly *costs* core ToM efficiency, it suggests selection specifically favored narrative despite this cost, implying its own adaptive value.

  3.  **Evidence of Direct Selective Optimization for Narrative-Specific Problems:**
      *   **Evidence:** Finding features of narrative cognition that are:
          *   **Costly:** Require significant metabolic resources, specialized learning, or impose fitness costs *specifically* for narrative processing, not for general ToM or social learning.
          *   **Efficiently Designed:** Show clear, parsimonious design solutions *specifically* for problems unique to narrative transmission/comprehension (e.g., minimizing memory load for plot points over time, optimizing emotional pacing for recall, specialized mechanisms for tracking symbolic causality vs. agentive intent).
          *   **Mismatch-Resistant:** Persist even when modern narratives clearly exploit them maladaptively (e.g., addiction to harmful fictional content), suggesting deep, hardwired design.
      *   **Why it Counts:** This directly shows traits shaped by selection *for* narrative function, not just traits that happen to be useful because of the ToM architecture.

  4.  **Formal/Computational Evidence of Irreducible Complexity for Narrative:**
      *   **Evidence:** A formal model demonstrating that efficient narrative comprehension/generation *requires* computational mechanisms or representational formats that are:
          *   Logically unnecessary for core ToM function (e.g., representing abstract causal chains independent of agent goals, symbolic thematic structures).
          *   Cannot be implemented as a simple or inevitable extension of existing ToM computations without significant, non-trivial additions.
      *   **Why it Counts:** This undermines the claim that narrative is a "logical consequence" or "cheap spandrel" of ToM. It suggests selection was needed to build the *additional* complexity required for narrative.

  5.  **Evolutionary Mismatch Argument (Strong Form):**
      *   **Evidence:** Demonstrating that core narrative preferences (e.g., for simple causal chains, clear protagonists) *actively hinder* performance on tasks directly related to the *putative primary function of ToM* (e.g., accurately predicting complex multi-agent social dynamics in modern environments) *in a way that core ToM abilities alone do not*. Yet, the narrative bias persists inflexibly.
      *   **Why it Counts:** If narrative structure *degrades* the core social function it supposedly evolved to serve, it becomes harder to argue it's an adaptation *for* social coordination. Its persistence points to it being a rigid byproduct (spandrel) or potentially an adaptation for a *different*, perhaps more domain-specific problem (like transmitting cultural norms via myth).

  **Addressing Unfalsifiability & Methodological Status:**

  *   **Is it Unfalsifiable?** Your position, rigorously defined, **is falsifiable in principle** using the evidence types above. The null hypothesis ("Narrative preference is a spandrel of core ToM") *can* be rejected by evidence demonstrating:
      1.  **Specificity:** Neural, cognitive, or behavioral features dedicated *only* to narrative, not explainable by ToM.
      2.  **Costly Design:** Features imposing costs incompatible with a "free" byproduct.
      3.  **Functional Incompatibility:** Interference with core ToM function.
  *   **Risk of Unfalsifiability in Practice:** The risk arises if:
      *   The definition of the "core constrained architecture" (ToM) is expanded *ad hoc* to absorb any narrative-related feature ("Oh, that *is* part of ToM!").
      *   Any *potential* adaptive benefit, no matter how vague or post-hoc, is accepted as shifting the burden, without requiring evidence of *specific design*.
      *   The lack of evidence for adaptation is itself used as confirmation of the spandrel hypothesis (a true null hypothesis trap).
  *   **Mitigating the Risk:** To remain robust:
      *   **Clearly Define the "Core":** Precisely delineate the functions and mechanisms of the constrained system (ToM) based on independent evidence (neuroscience, developmental psychology, comparative work).
      *   **Require Positive Evidence for Adaptation:** Insist on evidence of *special design* for narrative (costly features, domain-specific optimization, incompatibility) – not just absence of evidence against adaptation or vague adaptive storytelling.
      *   **Welcome Strong Null Results:** If rigorous searches for 1-5 above consistently fail, it *strengthens* the spandrel-default position, but doesn't "prove" it absolutely. It remains the best-supported hypothesis.
  *   **Is Unfalsifiability Okay Methodologically?** For a *methodological heuristic* ("treat as spandrel by default in constrained systems"), a degree of protective unfalsifiability is acceptable and even necessary. Its purpose is to counterbalance adaptationist bias and demand higher standards of evidence. It's a rule of thumb for hypothesis generation and testing, not a universal law. Its success is judged by whether it leads to better, more rigorous science (uncovering genuine constraints, preventing just-so stories) even if a single instance can't be "disproven" in isolation.

  **Conclusion on Narrative Preference:**

  Your spandrel-default view for narrative preference is powerful and justified. The burden *should* be on evolutionary psychologists to demonstrate that narrative structure requires more than the inevitable operation of our highly constrained, socially selected ToM machinery. Evidence of dedicated neural substrates, costly specialized design, functional incompatibility with core ToM, or formal computational necessity would be required to shift that burden convincingly. Absent such evidence, "narrative preference as a ToM spandrel" remains a compelling and parsimonious null hypothesis. Your "reverse adaptationism" is a sophisticated and necessary corrective in domains dominated by complex, integrated architectures shaped by deep selection history.
