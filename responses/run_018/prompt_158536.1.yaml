  First, I need to grasp their core argument: reverse adaptationism where spandrels are the null hypothesis in constrained domains. They want to know what evidence could genuinely challenge this view, not just superficial adaptations. They're wary of unfalsifiability and seek concrete tests or formal results that could invalidate their position.

