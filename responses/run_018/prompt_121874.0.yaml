  The room composition matters deeply here. The tutor is pro-Dennett but needs convincing on the external pivot. The phenomenologists will attack from the angle of pre-reflective bodily selfhood. The Parfit reductionist will question whether this just repackages existing ideas poorly. The neuropsychologist will challenge the real-world applicability, especially regarding dementia patients. The user wants damage-controlled objections—prioritized by threat level—with tactical concessions, defenses, and soft spots.  

  First, the neuropsychologist’s objection feels most dangerous: it threatens real-world validity and ethical sensitivity. If the user sounds glib about dementia, they lose credibility. Conceding the complexity of late-stage dementia is non-negotiable; digging into the "relational scaffolding" point is key, but the soft spot is the leap from "supported identity" to "selfhood."  

  The phenomenologist’s "body as bedrock" objection is next. Granting the pre-reflective layer disarms them; pivoting to "narrative layers atop bodily presence" might work, but the bodily self’s irreducibility remains a vulnerability.  

