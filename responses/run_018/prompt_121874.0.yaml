  The "loss of agency" and "fictional self" objections are mid-tier. Both require careful framing: agency as distributed, not erased, and narrative as binding even when imperfect.  

  The nightmare question—"Doesn’t this erase autonomy?"—threatens the whole thesis. The best salvage is to reframe autonomy as relational ("autonomy-through-others") but that’s philosophically risky.  

  User’s anxiety is palpable. They’ve thought deeply but fear specific takedowns. The prep sheet must balance scholarly rigor with tactical humility—especially with the neuropsychologist. Their "more self" claim is deliberately bold; backing it requires emphasizing that "self" here means *socially sustained identity*, not inner richness. If the room misses that nuance, it collapses.  

