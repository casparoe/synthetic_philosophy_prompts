answer: |-
  Your core insight is correct: Scanlon's contractualism structurally prevents simple aggregation by forcing justification to each affected individual *separately*, effectively giving the single patient a decisive "reasonable rejection" against being sacrificed, regardless of the number saved.

  Here's the logic:

  1.  **Justification is Individual-Centric:** The surgeon must justify her action based on principles no individual could *reasonably reject* from their own perspective.
  2.  **The Healthy Patient's Rejection:** The principle "You can be killed to harvest your organs to save others" *can* be reasonably rejected by the healthy patient. Death is a uniquely severe burden imposed solely on them. They gain no benefit and are used merely as a means.
  3.  **The Five Patients' Perspective:** While the five dying patients could reasonably reject a principle *forbidding* the harvest (as it leads to their deaths), their counter-rejection doesn't directly "sum" against the healthy patient's rejection.
  4.  **No Aggregation Mechanism:** Contractualism evaluates the burden *to each individual* asking "Is *this* burden on *me* too great to demand I accept this principle?" It doesn't have a mechanism to compare the *number* rejecting a principle against the *number* burdened by *not* acting. The healthy patient's severe burden (death) justifies their rejection, and the framework doesn't allow the *collective* lesser burden of death on the five (if not harvested) to be weighed *against* that single severe burden in a way that overrides it.
  5.  **Result:** The healthy patient's reasonable rejection against being sacrificed is decisive. The surgeon cannot justify harvesting the organs *to the healthy patient*, despite the potential benefit to five others. The numbers never enter the same moral equation; the single veto-power rejection stands.
