  We are translating the epistemicism vs. supervaluationism debate about vagueness into dependent type theory (DTT) and proof-relevant semantics. We focus on a vague predicate like "is bald" (or "is a heap") as analogous to a membership judgment in Martin-Löf type theory.

  ### Epistemicism (Williamson-style) in Type-Theoretic Terms

  Epistemicism asserts:
  - There is a sharp boundary (a precise cutoff) for the vague predicate.
  - Every instance is determinately either in or out (bivalence).
  - Our ignorance is due to limited epistemic access.

  **Translation**:

  1. **The sharp boundary as an unknown parameter fixed in every model**:
     - Consider a type `Person` and a predicate `Bald : Person -> Type` (with `Type` being the type of propositions/proofs). 
     - Epistemicism requires that for every `n : Person` (ordered, say, by number of hairs), there is a sharp cutoff `k` such that:
       - For `n < k`, `Bald n` is inhabited (by a proof term).
       - For `n >= k`, `Bald n` is uninhabited (or equivalently, we have a proof of `¬ Bald n`).
     - However, the exact `k` is unknown. 

     We can model this by having the cutoff `k` as a fixed but unknown natural number. Then:
       - `Bald n` is defined as `n < k` (but note: in DTT, we typically avoid such classical definitions; see below).

  2. **Oracle vs. canonical proof term**:
     - The bivalence condition requires that for every `n`, either `Bald n` or `¬ Bald n` holds. This is equivalent to having a function:
          `decide : (n: Nat) -> Bald n + ¬ Bald n`
       However, in constructive mathematics, we do not assume such a function unless we have a decision procedure.
     - Epistemicism posits that such a function exists in reality (i.e., in the model) but we do not know it (we don't have access to the specific function). 

     Hence, we can think of the sharp boundary as being given by an oracle (a non-computable function) or as a fixed but unknown proof term of type `Σ (k: Nat) . Π (n: Nat) . (Bald n ↔ n < k)`.

  3. **Ignorance in a proof-relevant setting**:
     - In classical logic, ignorance is modeled by not knowing which of the two (truth or falsity) holds. In proof-relevant semantics, truth is the presence of a proof and falsity the presence of a refutation (proof of negation). 
     - Ignorance then means that for some `n`, we do not have a proof of `Bald n` nor a proof of `¬ Bald n` (because we don't know `k`). However, note that the epistemicist claims that in reality one of them holds (so the proof or refutation exists) but we lack the evidence.

     This creates tension: in DTT, we cannot express "there exists a proof but we don't have it" without stepping outside the constructive framework. The bivalence condition (excluded middle for `Bald n`) is not constructively valid. 

     **Distortion**: Epistemicism requires classical logic, specifically the global excluded middle. In DTT, we do not have that for arbitrary predicates. Thus, we must either:
       - Work in a classical type theory (which is not proof-relevant in the same way) or 
       - Restrict the predicate `Bald` to be decidable, but then we must have a decision procedure, which we don't.

     The ignorance is thus modeled as our inability to construct the decision procedure (or the proof terms for each `n`). We can have a meta-level assumption that there is a fixed `k` and hence a fixed decision function, but inside the type theory, we cannot access it.

  **Residue for Epistemicism**:
  1. **What translates cleanly**: 
     - The idea of a sharp cutoff as a fixed parameter in the model.
     - The bivalence condition as a classical assumption (if we work in a classical type theory).

  2. **What must be distorted**:
     - The proof-relevance of DTT is at odds with the classical bivalence. In DTT, a proposition is true only when we have a proof. The epistemicist's "determinately true but unknown" becomes: there exists a proof (or refutation) but we cannot exhibit it. This is a non-constructive existential claim that is not internal to the type theory without axioms.

  3. **What has no expression**:
     - The sorites tolerance principle: that a single hair cannot make the difference between bald and not bald. In epistemicism, this principle is false (because there is a sharp cutoff) but we are ignorant of where it is. In DTT, we can express tolerance as:
          `tolerance : Π (n: Nat) -> Bald n -> Bald (n+1) -> Empty`
       which is a contradiction. But the epistemicist would reject the premise that `Bald n` and `Bald (n+1)` are both true for adjacent n (at the boundary). However, without knowing the boundary, we cannot pinpoint where the contradiction arises. The type theory cannot express that tolerance fails at exactly one point without knowing that point.

  ### Supervaluationism (Fine/Keefe) in Type-Theoretic Terms

  Supervaluationism asserts:
  - There are many admissible precisifications (sharpenings) of the vague predicate.
  - A statement is true if it is true in all admissible precisifications, false if false in all, and otherwise indeterminate.

  **Translation**:

  1. **Admissible precisifications as consistent extensions**:
     - We start with a base definition for `Bald` that is partial. Then an admissible precisification is a total extension that respects certain constraints (e.g., if a person with n hairs is declared bald, then so is one with more hairs? Actually, the opposite: if declared bald, then one with fewer must be bald too? We must be careful. The constraint for "bald" is monotonicity: if n has fewer hairs than m and n is not bald, then m cannot be bald; and if m is bald, then n must be bald. But actually, the standard is: if n is bald and m has fewer hairs, then m is bald; if n is not bald and m has more hairs, then m is not bald. This is a downward monotonicity for baldness.)

     In type theory, we can model a precisification as a total predicate `P : Person -> Type` that satisfies:
          - Downward closure: `Π (n m: Nat) . (m <= n) -> P n -> P m`
          - (Similarly, upward closure for non-baldness? Actually, non-baldness would be upward closed: if `n` is not bald and `m>=n`, then `m` is not bald. But note: we are defining a total predicate that must be consistent with the constraints.)

     However, note: in DTT, we can define the type of such admissible precisifications as:
          Precisification = Σ (P: Nat -> Type) . 
              [DownwardClosed P] × 
              [RespectsOtherConstraints P] × 
              ... 
     where `DownwardClosed P = Π (n m: Nat) . (m <= n) -> P n -> P m`.

     Then, the supertruth of a statement `Bald n` is defined as:
          `SuperTrue(Bald n) = Π (p: Precisification) . p.P n`
     Similarly, `SuperFalse(Bald n) = Π (p: Precisification) . ¬ (p.P n)`

     And indeterminacy when neither holds.

  2. **Indeterminacy as absence of a canonical proof**:
     - For a given `n`, if there exists a precisification `p1` such that `p1.P n` and another `p2` such that `¬ p2.P n`, then we cannot have a proof of `SuperTrue(Bald n)` nor of `SuperFalse(Bald n)`. 
     - This is naturally captured by the lack of a uniform proof over all precisifications.

  3. **Does supervaluationism require a proof-irrelevant layer?**
     - The supervaluationist notion of truth is universal quantification over precisifications. This is proof-relevant: a proof of `SuperTrue(Bald n)` is a dependent function that for each precisification `p` returns a proof of `p.P n`. 
     - However, note that the precisifications themselves are different ways of extending the partial predicate. The system does not require proof irrelevance; it is fully proof-relevant.

  **Residue for Supervaluationism**:
  1. **What translates cleanly**:
     - The idea of multiple precisifications as total extensions satisfying constraints.
     - The definitions of supertruth and superfalsity as universal quantification over precisifications.

  2. **What must be distorted**:
     - The original supervaluationism is often presented in a classical metalanguage. The move to DTT makes the indeterminacy constructive: we don't have a proof of the supertruth, but that doesn't mean that it is classically false. In DTT, the absence of a proof does not imply the existence of a refutation. However, supervaluationism in its standard form uses a classical metalanguage and defines truth as truth in all precisifications (a classical universal quantification). The constructive version is a natural interpretation.

     - The constraints on precisifications (like downward closure) must be explicitly built in. The type `Precisification` must include these constraints. This is a clean translation but requires explicit axiomatization of the constraints.

  3. **What has no expression**:
     - The standard supervaluationism allows for a non-denumerable set of precisifications. In DTT, we typically work with sets that are definable, so we might only have a subset of all possible precisifications. This might be a limitation if we want "all possible" precisifications. However, we can use a set-theoretic model or a higher-order type theory to capture the full range.

     - The sorites tolerance principle: in supervaluationism, tolerance fails in the sense that there is no single step that is the boundary, but the principle is true in the sense that for any two adjacent cases, there is a precisification that makes both bald and one that makes both not bald? Actually, the tolerance principle is not true in the supervaluationist framework because it is not supertrue: there will be precisifications that draw the line at any point, so for adjacent n and n+1, there is a precisification that makes n bald and n+1 not bald. Hence, the tolerance principle (that if n is bald then n+1 is bald) fails in some precisifications. Therefore, it is not supertrue. But note: the tolerance principle is not superfalse either because there are precisifications in which it holds (away from the boundary). So it is indeterminate. However, in DTT, we can express the tolerance principle as:
          `tolerance : Π (n: Nat) . Bald n -> Bald (n+1)`
       and then note that this is not supertrue (because we don't have a uniform proof for every precisification). This matches.

  ### Hybrid Constructive Epistemicist View

  The hybrid view:
  - There is a sharp boundary (so bivalence holds), but it is constructively undefined because the inductive definition of the predicate supplies no decision procedure.
  - Different constructively valid extensions assign different cutoffs.

  **Coherence and Collapse**:
  - The idea is that we have a base definition that is partial (like the supervaluationist) and then we consider different total extensions (which are the precisifications). But then we say that one of them is the "correct" one? The hybrid view says that there is a sharp boundary (so one precisification is correct) but we cannot know it constructively.

  However, note:
  - The hybrid view is very close to epistemicism: it maintains that there is a single correct cutoff (so one precisification is correct) but we are ignorant of which one. The difference is that in the hybrid view, the cutoff is not fixed by the model but by the extension we choose? But then we must ask: what makes one extension the correct one? 

  - The hybrid view as described says: "different constructively valid extensions assign different cutoffs". This suggests that we have multiple extensions (like supervaluationism) but then we also maintain that one of them is the actual one (like epistemicism). This is exactly the epistemicist view: the set of admissible precisifications is non-empty and the actual world corresponds to one of them. 

  Therefore, the hybrid view collapses into epistemicism. The only difference is that the hybrid view does not assume that the cutoff is fixed by a hidden parameter but by our choice of extension? But that choice is not under our control: it is fixed by the world. So we are back to epistemicism.

  **Can we distinguish epistemic ignorance from constructive underdetermination?**
  - In DTT, the standard way to express underdetermination is by having multiple models (or extensions) that are equally valid. But if we are realists about the predicate (like the epistemicist), then we believe that one model is the intended one. The ignorance is about which model is the intended one. 

  - In a constructive framework, we can express that a predicate is not decidable: we don't have a decision procedure. That is constructive underdetermination. But the epistemicist goes further: they claim that despite our inability to decide, there is a fact of the matter. This is an additional non-constructive claim.

  - The residue: the claim that there is a fact of the matter (one correct extension) is not expressible internally in a type theory that does not assume classical logic. It requires a meta-level commitment to bivalence.

  Therefore, without classical assumptions, the framework cannot distinguish between:
     - There is a correct extension but we don't know which (epistemic ignorance) and 
     - There is no fact of the matter about which extension is correct (constructive underdetermination).

  The distinction collapses without a classical metalanguage.

  ### Conclusion

  1. **Epistemicism** translates non-trivially because it requires classical logic. The residue is the non-constructive existence of a sharp cutoff and the global excluded middle.

  2. **Supervaluationism** translates more naturally because it fits the proof-relevant, constructive framework by using universal quantification over precisifications. The residue is the need to specify constraints and the potential limitation of the set of precisifications to definable ones.

  3. **The hybrid view** collapses into epistemicism because it maintains that one precisification is correct. Without classical logic, we cannot express the existence of a unique correct precisification without a proof (which we lack). The constructive underdetermination (multiple extensions) without a commitment to a unique correct one is supervaluationism.

  Thus, the framework reveals that the distinction between epistemicism and supervaluationism hinges on the acceptance of classical logic (especially for the metalanguage). Without classical logic, the hybrid view is either epistemicism (if we assume a unique correct extension) or supervaluationism (if we do not). The proof-relevant semantics of DTT naturally aligns with supervaluationism when we internalize the precisifications, but it can also model epistemicism if we add classical axioms.
answer: |-
  ### Translation of Epistemicism and Supervaluationism into Dependent Type Theory

  #### **Epistemicism (Williamson-style)**
  **Core Claim**: A sharp boundary exists (e.g., a specific hair count separating bald/non-bald), but we are epistemically ignorant of it. Bivalence holds: every instance is determinately true or false.

  **Type-Theoretic Translation**:  
  - **Hidden Boundary as a Non-Computable Oracle**:  
    Model the predicate as a function `Bald : Person → Type` (where `Type` is the universe of propositions/proofs). The sharp boundary is an *undecidable oracle*:  
    ```agda
    postulate SharpBoundary : (n : ℕ) → Dec (Bald n)  -- Classical oracle for decidability
    ```  
    Here, `Dec A = A + ¬A` (bivalence), but `SharpBoundary` is postulated, not constructible.  
  - **Ignorance**: Proof irrelevance is violated. We know a proof *exists* (for `Bald n` or `¬Bald n` for every `n`), but we lack access to the proof term. This is captured by:  
    ```agda
    Ignorance : ∀ n → ¬¬(Bald n + ¬Bald n)  -- Double-negation: proof exists but is unknown.
    ```  
    Ignorance means we cannot compute the witness; the term is hidden behind a classical axiom.

  **Residue Report**:  
  1. **Clean Translation**:  
     - The sharp boundary as a non-computable oracle aligns with epistemicism's "determinate but unknown" truth.  
     - Bivalence maps to `Dec` (decidability).  
  2. **Distortion**:  
     - Proof relevance is violated. DTT internalizes knowledge via proof terms; epistemicism's "truth beyond proof" requires smuggling classical logic (e.g., `¬¬P → P`).  
     - Sorites tolerance becomes a contradiction:  
       ```agda
       Sorites : ∀ n → Bald n → Bald (n+1)  -- Tolerance principle
       Contradiction : ⊥                   -- Proof of absurdity at the boundary
       ```  
       Epistemicism rejects tolerance, so `Sorites` must be *refuted*, but DTT cannot locate the boundary without the oracle.  
  3. **No Expression**:  
     - "Epistemic access limitation" cannot distinguish between *proof-theoretic undecidability* and *psychological ignorance*. DTT conflates "no proof exists" with "we don't know", but epistemicism insists proofs exist unknowably.  

  **Verdict**: Epistemicism requires classical axioms foreign to proof-relevant DTT. The residue reveals a fundamental conflict: DTT ties truth to provability; epistemicism separates them.

  ---

  #### **Supervaluationism (Fine/Keefe-style)**
  **Core Claim**: Truth is relativized to "admissible precisifications" (complete, consistent sharpenings). A statement is:  
  - **True** if true in all precisifications,  
  - **False** if false in all,  
  - **Indeterminate** otherwise.  

  **Type-Theoretic Translation**:  
  - **Admissible Precisifications as Parameterized Types**:  
    Define a family of types `Baldᵖ : Precisification → Person → Type`, where `Precisification` is a type of valid sharpenings. Constraints (e.g., monotonicity) are axioms:  
    ```agda
    Monotonic : ∀ p n m → (n ≤ m) → Baldᵖ p m → Baldᵖ p n  -- Fewer hairs → balder
    ```  
  - **Supertruth**: Universal quantification over precisifications:  
    ```agda
    SuperTrue : Person → Type
    SuperTrue x = ∀ (p : Precisification) → Baldᵖ p x
    ```  
  - **Indeterminacy**: Proof irrelevance is unnecessary; indeterminacy is the *lack of uniform proof*:  
    ```agda
    Indeterminate : Person → Type
    Indeterminate x = ¬(SuperTrue x) × ¬(SuperFalse x)  -- No universal proof or refutation.
    ```

  **Residue Report**:  
  1. **Clean Translation**:  
     - Precisifications as type parameters model "multiple sharpenings".  
     - Supertruth/superfalsity as `∀`/`∃` over precisifications.  
     - Indeterminacy naturally emerges as underdetermination of proof terms.  
  2. **Distortion**:  
     - "Admissible" constraints risk collapsing into gradual typing (e.g., fuzzy boundaries). To avoid this, define `Precisification` inductively with axioms (e.g., `Monotonic`), preserving vagueness.  
     - Classical supervaluationism uses a metalanguage with excluded middle; DTT uses constructive quantification.  
  3. **No Expression**:  
     - The "ontological indeterminacy" of vague predicates has no analogue. DTT interprets indeterminacy as *proof underdetermination*, not metaphysical openness.  
     - Sorites tolerance is valid *within* precisifications but fails *across* them:  
       ```agda
       Tolerance : ∀ p n → Baldᵖ p n → Baldᵖ p (n+1)  // Holds per precisification?
       ```  
       But no: precisifications can have sharp boundaries, so `Tolerance` may be violated at some `p` and `n`.  

  **Verdict**: Supervaluationism translates well, but DTT reinterprets "indeterminacy" constructively. The residue shows supervaluationism is compatible with proof-relevance if metalanguage classicality is dropped.

  ---

  ### **Hybrid Constructive Epistemicism: Coherence Assessment**
  **Proposal**: A sharp boundary exists but is *constructively underdetermined*—no decision procedure from the inductive definition. Different valid extensions assign different cutoffs.  

  **Type-Theoretic Formalism**:  
  ```agda
  -- Base definition (e.g., "≤5 hairs → bald; ≥1000 → not bald")
  data BaldBase : Person → Type where
    baseBald  : ∀ {x} (hx : Hairs x ≤ 5)  → BaldBase x
    baseNon   : ∀ {x} (hx : Hairs x ≥ 1000) → ¬BaldBase x

  -- Valid extension: Any decidable predicate extending BaldBase with monotonicity
  ValidExt : (Bald : Person → Type) → Type
  ValidExt Bald = (∀ x → Dec (Bald x))  -- Bivalence
                × (∀ x → BaldBase x → Bald x)  -- Extends base
                × (∀ x y → Hairs x ≤ Hairs y → Bald y → Bald x)  -- Monotonic
  ```

  **Collapse Risk**:  
  - **Not Supervaluationism**: Supervaluationism quantifies over *all* admissible precisifications *simultaneously*. Here, each `ValidExt` is a *separate model* with its own cutoff. Truth is absolute in a model, but the "true" model is unknown.  
  - **Epistemic Ignorance vs. Constructive Undetermination**:  
    - **Ignorance**: We lack a procedure to compute *which* `ValidExt` is "intended" (epistemic).  
    - **Undetermination**: No canonical proof of `∀ x → Dec (Bald x)` exists (constructive).  

  **Distinction in DTT**:  
  ```agda
  Ignorance      : ¬∃ (e : ValidExt) → CanonicalModel e  -- We don't know the canonical model.
  Undetermination : ¬(Σ (e : ValidExt) ∀ (f : ValidExt) → e ≡ f)  -- No unique valid extension.
  ```  
  This is coherent: `Undetermination` is constructive (proof that no unique extension exists), while `Ignorance` is epistemic (no access to the "true" model).  

  **Residue Analysis**:  
  - **Clean**: Distinction between underdetermination (proof-theoretic) and ignorance (meta-level) is expressible.  
  - **Distortion**: "Intended model" implies metaphysical commitment that DTT cannot enforce.  
  - **No Expression**: Why believe a *single* "intended" extension exists? DTT cannot justify this without classical axioms.  

  **Verdict**: Hybrid view is a coherent third option **iff** we assume an intended model exists (epistemicism's core). Without this, it reduces to a multi-model supervaluationism. The residue exposes that "constructive epistemicism" still relies on classical metaphysics.

  ---

  ### **Conclusion**
  - **Epistemicism**: Forces classical logic into DTT; residue reveals incompatibility with proof-relevance.  
  - **Supervaluationism**: Natural fit; indeterminacy becomes proof underdetermination.  
  - **Hybrid View**: Coherent if "intended model" is assumed, but this is a metaphysical graft.  
  - **Framework Limitation**: DTT excels at modeling *proof underdetermination* (supervaluationism/hybrid) but cannot capture *non-constructive bivalence* (epistemicism) without axioms. The residue challenges philosophers to clarify: Is vagueness about *truth beyond proof* (epistemicism) or *proof multiplicity* (supervaluationism/hybrid)?
