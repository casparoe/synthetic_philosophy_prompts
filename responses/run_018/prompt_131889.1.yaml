  Hmm, tricky balance. The residents won't follow dense theory references, but the academics will expect intellectual rigor. And there's that historical wrinkle—the 1920s irrigation pact granting rights only to landowners, excluding renters who suffer flooding. User specifically wants to sit in the tension, not resolve it. 

  First, I should acknowledge both audiences without jargon. For residents: concrete examples (wells, flood damage). For grad students: subtle nods to boundary problems without name-dropping Dahl. The 1920s pact is perfect—it shows how arbitrary historical decisions create present-day exclusions. 

  User’s deeper need? Legitimacy. They can’t promise solutions but must make people feel heard. So the remarks should: 1) validate everyone’s stake, 2) expose contradictions (e.g., "You drink the water but can’t vote"), 3) frame the workshop as a space to *unpack* the problem, not solve it. 

  Avoiding pitfalls: No false unity ("we’re all stakeholders" glosses over renters’ exclusion). No theory lectures. And absolutely no tidy endings—user wants the discomfort to linger. Maybe end by naming what *won’t* happen? "We won’t leave with a perfect map, but..." 

