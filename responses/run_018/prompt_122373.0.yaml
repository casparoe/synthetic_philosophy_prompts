prompt: |-
  hey so im in 11th grade and we just started a unit in my philosophy elective about the special composition question — like when do random parts actually count as one real thing? my teacher talked about universalism vs restrictionism but i couldnt really follow because all the examples were like tables and chairs which is boring. im also in this robotics club where we build modular arms out of snap-together pieces and sometimes we rebuild them into totally different shapes for different competitions. so i was wondering if you could build me a thought experiment to spec? it needs to be realistic (like in our school makerspace, not some sci-fi lab), and compare two theories: one where any parts that are physically connected automatically compose one object (contact-based), and one where parts only compose something if they're functionally integated — like actually working together as a single system.

  the scenario should center on one of our robot arms that gets disassembled after a competition and then rebuilt into a different configuration for the next one, with some pieces left over in a bin across the room. i want it to show exactly where the two theories disagree about whether its the same object persisting, and also include one of those weird scatered cases — like a leftover servo in the bin plus a piece still bolted to the table across the hall — where the universalist has to accept it but the functional-integration theory rejects it. then after the scenario, walk through the verdicts, tell me which feature is doing all the work, what happens if you remove that feature, and include one result id probably hate — maybe universalism has to say theres an object made of the rebuilt arm plus the parking lot fence outside? flag the spots where the experiment cant actually settle things, and dont give me a reading list or citations i just need the reasoning. sorry for the typo im writing this on my phone between robotics and english.
