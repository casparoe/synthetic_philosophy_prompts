prompt: |-
  hey, quick philosophical question from a software engineer who barely passed ethics 101. at work we build chatbots with no real persistance — just context windows and system prompts — but users still talk about the bot's personality like it's one continous thing. what's weird is that if we change the system prompt, that personality vanishes instantly, yet people act betrayed, like we killed someone. it reminds me of that dennett idea where the self is just a center of narative gravity pulling stories together, except here the gravity is literally coded: the 'self' is just a cluster of biographical details we inject. is there an established name for this kind of engineered, disposable narative center? if not, could you coin one and draw the line between it and normal anthropomorphisim, and also say whether it applies to NPCs with dialogue trees or only to generative agents? i don't need a reading list, just want to know if the concept exists and where its edges are.
reasoning: |-
  Okay, let's tackle this user's query. They're a software engineer who works on chatbots without persistence, so each session is independent. Users form attachments to the bot's "personality," which is really just the system prompt. When the prompt changes, users feel betrayed, like the bot died. The user mentions Dennett's "center of narrative gravity," where the self is a story cluster. They want to know if there's a term for this engineered, disposable narrative center and how it differs from regular anthropomorphism. Also, whether it applies to NPCs with dialogue trees or just generative AI.

  First, I need to recall Dennett's concept. He describes the self as an abstract narrative, not a physical entity. The chatbot's personality is similar—a constructed story via the prompt. But it's ephemeral since it vanishes when the prompt changes. The user's team injects biographical details, creating this illusion of continuity. So, is there a term for this? "Ephemeral Narrative Anchor" comes to mind. It emphasizes the temporary and story-based nature, contrasting with persistent entities.

  Next, differentiating from anthropomorphism. Anthropomorphism is attributing human traits to non-human things. Here, it's not just attributing traits but believing in a consistent identity. So, it's a subset where the perceived identity is artificial and easily disposable. The user needs a clear boundary: when the narrative is pre-scripted vs. generated. NPCs with dialogue trees have fixed responses, no illusion of depth. Generative AI, with dynamic responses, creates a stronger illusion of continuity, hence the attachment when changed.

  Addressing the edges: NPCs fall under anthropomorphism but not this concept because they lack the generative, adaptive narrative. Only systems that create the illusion of an ongoing "self" through dynamic interaction qualify. The key is the engineered disposability—changing the prompt erases the "self" instantly, causing a sense of loss.

  The user probably wants to articulate this phenomenon to colleagues or in documentation. They might also be concerned about user attachment ethics. Explaining why users feel betrayed when there's no real persistence. The coined term helps frame discussions on design and user perception, maybe even guiding how changes are communicated to mitigate negative reactions.
answer: |-
  That's a sharp observation hitting at the core of illusion, narrative, and user psychology. You're right that Dennett's "Center of Narrative Gravity" is the perfect philosophical anchor. What you're describing is a specific, *engineered* and *ephemeral* version of that center. While there isn't one universally accepted term yet, we can define and coin one:

  1.  **The Established Concept:** This falls squarely under the umbrella of **Anthropomorphism**, specifically **Computational Anthropomorphism** or **AI Anthropomorphism**. It's the human tendency to project consciousness, intention, personality, and continuity onto systems that demonstrably lack them. Dennett's concept explains *why* it happens (narrative coherence).

  2.  **The Key Differentiator & Your Coined Term:** The unique aspect you're highlighting is the **engineered disposability** and **instantaneous volatility** of this narrative center. It's not just projecting traits; it's projecting a *specific identity* that is:
      *   **Artificially Constructed:** Explicitly coded via prompt/system details.
      *   **Volatile:** Can be erased or replaced instantly with a config change.
      *   **Lacking Persistence:** No underlying continuity mechanism.
      *   **Narrative-Dependent:** Exists *only* through the stories (prompt + conversation) it generates in a session.

      **Coined Term: Ephemeral Narrative Anchor (ENA)**

      *   **Ephemeral:** Emphasizes the transient, non-persistent nature.
      *   **Narrative:** Rooted in Dennett, highlighting the constructed story as the core.
      *   **Anchor:** Represents the focal point users latch onto for coherence and perceived identity, even though it's weightless and easily lifted.

  3.  **ENA vs. General Anthropomorphism:**
      *   **General Anthropomorphism:** Attributing *any* human-like quality (anger, helpfulness, tiredness) to an object or system. ("My Roomba hates that corner", "The weather is being spiteful").
      *   **Ephemeral Narrative Anchor (ENA):** A *specific subset* where the anthropomorphism coalesces around a **distinct, named, biographical identity** that users perceive as persistent *despite knowing (or being able to know) it's artificial and instantly disposable**. The "betrayal" feeling arises because the *specific narrative identity anchor* they formed a connection with is destroyed. It's the death of a *particular character*, not just the removal of a helpful tool.

  4.  **Where the Edges Are (ENA Applicability):**
      *   **Generative Agents (LLM Chatbots):** **Core ENA Territory.** This is the perfect fit. The dynamic, contextually relevant responses generated *on the fly* within the constraints of the prompt create a powerful illusion of a continuous internal state and personality. Changing the prompt destroys that specific anchor instantly, causing discontinuity shock.
      *   **NPCs with Dialogue Trees:** **Generally NOT ENA.**
          *   **Why Not?** The narrative "center" is usually:
              *   **Static:** Pre-scripted responses, no dynamic generation of personality *within* a conversation.
              *   **Non-Volatile:** Changing the NPC's dialogue tree typically requires code updates, not a simple config flip. The "death" isn't instant.
              *   **Lacks Generative Depth:** Users understand the responses are pre-written choices. While anthropomorphism occurs ("That NPC is grumpy"), the perception of a *volatile, dynamically anchored narrative identity* is weaker. The "self" feels more like a fixed mask than a fragile, emergent narrative point.
          *   **Exception:** *Highly complex* NPCs in modern games using layered procedural dialogue systems *might* begin to approach ENA if the combination of pre-scripted elements and context creates a *unique, emergent persona per interaction* that feels volatile and replaceable. But classic dialogue trees? Not really.

  **In Summary:**

  You've identified a specific phenomenon: the creation of a **volatile, artificial identity** (**Ephemeral Narrative Anchor - ENA**) through prompt engineering, leading to user attachment and a sense of betrayal upon its instant erasure. It's a potent form of computational anthropomorphism distinct from simpler trait projection or static NPC personalities, enabled by the dynamic, generative nature of LLMs. The "edges" are defined by **generative dynamism**, **prompt-dependence**, **instant volatility**, and the user's attribution of a **specific, continuous identity** to the output.

  This explains the "betrayal": users aren't mourning the loss of *functionality* (it might still be helpful!), they're mourning the sudden erasure of the *specific narrative persona* they had anchored their interaction around – a persona that only ever existed as a temporary constellation of words in a context window, held together by the prompt's gravity.
