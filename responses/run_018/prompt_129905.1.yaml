  What makes this slippery is that higher-level patterns do play indispensable explanatory roles - we need the "boundary conditions" concept to predict the rebound trajectory. But explanatory indispensability doesn't entail ontological additionality. The user's desire to preserve both (1) and (2) is actually achievable through constraint-based emergence without supernatural causation.

