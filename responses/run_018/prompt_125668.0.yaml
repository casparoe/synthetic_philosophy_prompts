  Looking at the study partner's first point: they argue that without a central audience, some process must "publish" a draft into awareness. That seems like they're sneaking the theater back in. Dennett's model says there's no publication event; it's all continuous editing. The roommate is correct here because the model avoids a single publishing step. The study partner is still thinking in terms of a final output, which Dennett explicitly denies.

  Next, the split-brain example. The roommate uses it to show how the left hemisphere confabulates reasons for actions initiated by the right hemisphere. This supports the multiple drafts model because it demonstrates that there's no central narrator integrating everything. Instead, different drafts (from each hemisphere) compete, and the left hemisphere's narrative dominates without access to the real cause. The study partner might think this is just about lying, but it's more about the lack of a unified narrative. So the roommate is right that this supports the model.

