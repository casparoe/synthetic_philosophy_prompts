prompt: |-
  Hey, I'm a novelist working on a character who's an ethicist with a bad habit of mixing up her actual preferences with moral biases. I've been using these cases to figure out her instincts, and I keep running into the same wall.

  She thinks eating meat is wrong because of animal suffering, and she thinks gambling is wrong because it exploits addicts -- both feel like real moral stances. She also thinks lying to a murderer at the door is fine, but lying to her sister about liking her painting is not -- that one feels like a practical rule, not a deep bias.

  But then there's the messy stuff. She drives a hybrid but judges people with big trucks as selfish. She flies home twice a year and doesn't see the contradiction. She thinks arranged marriage in other cultures is oppressive, but calls online dating 'just how people meet now.' And here's the one I can't resolve: she won't wear leather because of the animals, but she wears silk without a second thought, even though silk kills way more bugs per yard.

  Her verdicts seem to split into 'this is a principle' versus 'this is just my taste dressed up.' Is there actually a philosophical principle that can seperate moral preferences from biases in these cases? Maybe something about universalizability, or harm to people who can't consent, or consistant reflection? Or is the line basically circular -- you call it a bias when it doesn't match your social group?

  If there's a principle, what does it say about the silk/leather thing? And if there isn't one, what do I call the failure mode -- the way people build moral rules that happen to line up with their lifestyle? I don't need citations, just whether the carving holds up or if I'm writing a character who's just rationalizing.
reasoning: |-
  Okay, the user is a novelist creating a character who's an ethicist with a tendency to confuse her personal preferences with moral principles. They've provided several examples illustrating this inconsistency, like condemning meat-eating and gambling but being inconsistent with leather vs. silk, and judging others for driving trucks while flying frequently. The main question is whether there's a philosophical principle to distinguish genuine moral stances from biases, or if it's all rationalization.

  First, I need to unpack the examples. The character opposes meat and gambling on grounds of suffering and exploitation—these seem like standard ethical arguments. But her other positions are contradictory: she makes exceptions for lying in some cases but not others, criticizes truck drivers despite her own flying habits, and judges arranged marriages while accepting online dating. The leather-silk contradiction is particularly telling since silk production involves killing silkworms, yet she only avoids leather.

  The user wants to know if there's a philosophical basis to separate real morals from biases. They mention universalizability, consent, and consistent reflection. I should consider these concepts. Universalizability, from Kantian ethics, would require that a moral rule applies universally. If she can't apply her rules consistently, like avoiding leather but not silk, that's a failure of universalizability. Consent-based ethics might focus on whether beings can consent to harm, but insects can't consent either, so that doesn't resolve the silk issue.

  The user also asks about the failure mode when people's moral rules align with their lifestyle. Terms like cognitive dissonance, moral licensing, or motivated reasoning come to mind. These psychological concepts explain how people justify inconsistencies to reduce discomfort.

  The character's inconsistencies might stem from cultural norms. Arranged marriage is seen as oppressive because it's associated with non-Western cultures, while online dating is normalized in her context. That's cultural bias masquerading as morality. The leather-silk issue could be due to visibility: leather involves mammals, which evoke more empathy than insects. Or maybe silk is less stigmatized in her social circle.

  The user might be looking for validation that their character's inconsistencies are realistic. Ethicists aren't perfect; they can have blind spots. The key is whether the character engages in reflection. If she avoids examining her contradictions, that's rationalization. If she struggles with them, that adds depth.

  The deeper need here might be to portray a believable, flawed character. The novelist wants to ensure the inconsistencies are plausible and have a basis in real human behavior. They might also want to explore themes of hypocrisy, self-deception, and the challenge of living ethically in a complex world.

  In terms of principles, there isn't a clear-cut one. Philosophy offers tools like consistency checks, but humans often fail to apply them evenly. The failure mode involves psychological mechanisms rather than philosophical flaws. Terms like motivated reasoning or moral hypocrisy fit. The silk-leather contradiction highlights selective empathy based on species or visibility.

  To answer directly: there's no foolproof principle. The character is rationalizing, but that's human. The novelist can use terms like cognitive dissonance or inconsistent application of principles. For the silk issue, it's about perceived harm hierarchy or cultural norms. The character's lack of reflection on these points shows her bias.
answer: |-
  Your character is brilliantly human—she's wrestling with the exact tension philosophers have debated for centuries: *Why do our "moral" judgments so often align with our preferences, comforts, and cultural norms?* There **isn't a single, clean philosophical principle** that perfectly separates "genuine morality" from "bias dressed up," but the *attempts* to find one reveal her struggle and the failure modes.

  Here's the breakdown and how it applies to your character:

  1.  **The Philosophical Tools (and Why They Fail Her):**
      *   **Universalizability (Kant):** "Could everyone act this way without contradiction?" This exposes her *inconsistencies* (like flying while judging trucks, leather vs. silk), but doesn't *resolve* the core issue. She *could* universalize a principle like "Minimize direct suffering to sentient beings I easily empathize with," which covers meat/leather but excludes silk/bugs and ignores indirect harms like climate change (flying). It highlights her inconsistency but doesn't prove which stance is the "bias."
      *   **Harm/Consent (Utilitarianism/Deontology):** This *seems* like her framework (animal suffering, exploiting addicts). The failure comes in **scope and weighting**:
          *   **Scope:** Why are cows/pigs covered but not silkworms? (Sentience hierarchy? Cultural visibility?) Why is the direct harm of gambling covered, but not the systemic harm of frequent flying? (Proximity? Personal cost?)
          *   **Weighting:** Why does the "harm" of a white lie to her sister outweigh the social harmony gained? Why is the "harm" of an arranged marriage (potential lack of romantic choice) automatically worse than the potential harms of algorithm-driven dating (exploitation, superficiality, mental health impacts)? She's intuitively weighting harms based on *her* values and cultural context, not an objective scale.
      *   **Consistent Reflection (Virtue Ethics/Rawlsian Reflective Equilibrium):** The *process* of trying to make all her beliefs coherent is key. **This is where her failure mode is most evident.** She avoids deep reflection on the contradictions (flying vs. trucks, leather vs. silk). She applies scrutiny *selectively* – rigorously analyzing the harms of meat/gambling/arranged marriage, but accepting online dating/flying/silk as neutral or "just the way things are." This *avoidance* is the hallmark of bias masquerading as principle.

  2.  **The Leather vs. Silk Conundrum - A Case Study in Failure:**
      Philosophically, her stance collapses under minimal scrutiny using her *own* stated principle (preventing animal suffering/death). The *only* defenses are:
      *   **Sentience Bias:** Mammals (cows for leather) are perceived as more sentient/suffering than insects (silkworms). (Is this scientifically robust enough to justify the *total* dismissal of bug suffering? Probably not, especially given the scale of silk production).
      *   **Visibility/Cultural Norms:** Leather's connection to meat production is direct and culturally highlighted. Silk production's harm is less visible and not part of mainstream Western ethical discourse. Avoiding leather is a recognized "ethical" signal; avoiding silk is niche. **Her "principle" stops where cultural reinforcement stops and personal inconvenience/obscurity begins.** This is the bias laid bare.

  3.  **The Failure Mode: It's Not Circular, It's Motivated**
      You're right to suspect it's not *just* social group matching (though that plays a role). The deeper psychological engine is **Motivated Reasoning** or **Moral Licensing/Crediting**:
      *   **Motivated Reasoning:** She starts with her *preference* or *intuition* (e.g., "I find trucks gauche," "Silk feels normal," "Flying home is necessary for me," "Online dating is how *I* met people"). She then seeks or constructs moral justifications that support this pre-existing feeling, while downplaying or ignoring contradictory evidence or implications. Her ethicist training gives her sophisticated tools *to do this rationalization more effectively*.
      *   **Moral Licensing:** Her "principled" stands on meat and gambling (and maybe leather) create a sense of being a "good person." This accumulated "moral credit" subconsciously licenses her to be less rigorous or more permissive elsewhere (flying, silk, judging truck owners) without feeling like a hypocrite. "I'm *so* good on X, I deserve a pass on Y/Z."
      *   **Cognitive Dissonance Reduction:** Holding the contradiction ("I'm ethical" + "I do Y which seems unethical") causes discomfort. The easiest ways to reduce it? 1) Stop doing Y (hard), 2) Change the belief about Y being unethical (this is the rationalization path: "Silk isn't *really* that bad," "My flights are offset by my hybrid," "Truck owners are *actively* choosing harm").

  4.  **What to Call It:**
      *   **Inconsistent Application of Principles:** (The descriptive philosophical term).
      *   **Selective Scrutiny / Moral Myopia:** (Focusing intensely on some harms while ignoring others of similar type).
      *   **Motivated Moral Reasoning:** (The core psychological driver).
      *   **Moral Crediting/Licensing:** (The psychological mechanism enabling inconsistency).
      *   **Unexamined Cultural Bias Framed as Universal Morality:** (Especially for arranged marriage vs. online dating).
      *   **A Failure of Reflective Equilibrium:** (She avoids the hard work of truly reconciling her beliefs).

  **Verdict on Your Character:** She *is* rationalizing, **but that's precisely what makes her realistic and interesting.** She possesses genuine moral convictions *alongside* deep-seated biases and blind spots amplified by her cultural context and personal desires. Her ethicist training doesn't eliminate this; it often just provides better tools for post-hoc justification. The silk/leather split is a glaring example where bias (cultural norms, visibility, perceived sentience hierarchy) overpowers her stated principle. Her lack of wrestling with *that specific contradiction* is the key indicator of rationalization in that instance.

  **What Makes Her an Ethicist, Not Just a Hypocrite?** The potential lies in her reaction when these contradictions are *pointed out*. Does she get defensive and dig in (pure rationalization)? Or does she genuinely grapple, feel discomfort, and perhaps adjust *either* her principles *or* her behavior? The moments where she *confronts* the messiness – even if she doesn't fully resolve it – are where her ethics training becomes more than just a tool for self-justification. That internal struggle is the goldmine for your novel.
