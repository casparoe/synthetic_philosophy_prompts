prompt: |-
  I'm prepping questions for a podcast interview with a philosopher—call her Dr. Kessler—who's pushing this niche middle path on the Euthyphro dilemma. She says both horns miss because they smuggle in normative essentialism: the good isn't independent of God, but it isn't arbitrarily willed either; it's rationally constituted by divine nature, so moral truths are necessary but not prior. She also claims Plato's framing already bakes in essentialism that modern divine-command theorists shouldn't accept. I want 8-10 questions, none of that generic "how'd you get into philosophy" stuff. Must cover: whether rational constitution is just horn one with extra steps; what she says when divine nature seems to underdetermine specific rules (like why five prohibitions rather than six); and what her view implies about deep moral disagreement—if two people clash on a hard case, is one just misreading the rational structure, or are they in a genuinely seperate normative framework? For each, include a follow-up keyed to her usual move that underdetermination is epistimic, not metaphysical. Sorry if there's a typo or two—I'm writing this on my phone.
