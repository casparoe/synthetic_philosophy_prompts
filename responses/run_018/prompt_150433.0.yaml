prompt: |-
  Design a reusable, step-by-step audit procedure for a psychiatric-classification working group that must evaluate whether a proposed diagnostic revision risks triggering harmful looping effects in the sense developed by Ian Hacking—the idea that classifying people can change the very behaviors and self-understandings being classified, which then feed back into prevalence data and clinical perception. The working group operates under a six-week deadline, has no staff philosopher, and requires joint sign-off from clinicians and epidemiologists; the procedure must therefore be runnable by non-philosophers but must preserve the conceptual distinctions that actually matter.

  Structure the procedure as an ordered sequence of tests with explicit stop rules: for each step, state the question, what counts as a sufficient answer (including when the answer must be "we do not have enough evidence"), where the procedure terminates with a recommendation to proceed, where it terminates with a recommendation to halt, and where it explicitly hands the decision to human judgment because the issue is one of values rather than facts. Inject the following niche distinction into the framework: separate "taxonomic looping" (the label itself reshapes symptom expression and self-report) from "institutional looping" (the diagnosis changes access to resources, legal status, or social identity, which then alters observed prevalence independently of phenomenology). The procedure must contain specific checks for each kind and a rule for what to do when they point in opposite directions.

  Then apply the procedure to two concrete proposals: first, broadening the age-range criteria for an existing neurodevelopmental disorder so that it is routinely diagnosed in adults; second, introducing a new subthreshold anxiety category intended for primary-care screening. For each, run every step and record where the procedure yields a clear answer and where it stalls. Include one case—chosen from the two—where the procedure produces an answer the working group is likely to resist (for example, recommending against a revision that addresses a documented clinical gap because loop contamination is unquantifiable and institutional effects are irreversible). Finally, state precisely what the procedure cannot do: identify loops it is not designed to detect, substitute for ethical judgment about acceptable risk, or resolve conflicts between clinician and epidemiologist sign-off. Keep the tone formal and the language operational, avoiding requests for bibliographies, citation lists, or references to highly obscure secondary literature; paraphrase Hacking's core claims without using quotation marks.
reasoning: |-
  We are designing a step-by-step audit procedure for evaluating whether a proposed diagnostic revision risks triggering harmful looping effects in the sense of Ian Hacking. The procedure must distinguish between "taxonomic looping" (the label reshaping symptom expression and self-report) and "institutional looping" (the diagnosis changing access to resources, legal status, or social identity, which then alters observed prevalence). The procedure must be runnable by non-philosophers and must have explicit stop rules.

  The procedure will be structured as an ordered sequence of tests. For each step, we will state:
  - The question
  - What counts as a sufficient answer (including when the answer is "insufficient evidence")
  - Where the procedure terminates with a recommendation to proceed (i.e., the revision is approved)
  - Where it terminates with a recommendation to halt (i.e., the revision is rejected)
  - Where it explicitly hands the decision to human judgment (because the issue is one of values)

  We will then apply the procedure to two concrete proposals.

  ### Step-by-Step Audit Procedure

  #### Step 1: Pre-Screening for Obvious Institutional Harm
  **Question:** Does the proposed revision create or modify institutional pathways (e.g., access to treatment, legal status, social benefits, or penalties) that are likely to cause immediate and irreversible harm to a clearly defined subgroup?
  - **Sufficient answer:** 
    - "Yes" if there is clear evidence (e.g., from similar past revisions, legal analysis, or expert consensus) that the revision will lead to irreversible harm (e.g., loss of custody, incarceration, or permanent exclusion from employment) for a subgroup that can be identified prior to implementation.
    - "No" if no such evidence exists.
    - "Insufficient evidence" if the potential harm is plausible but not clearly evidenced.
  - **Stop rules:**
    - If the answer is "Yes": Terminate and **recommend halt** (reject the revision).
    - If the answer is "No" or "Insufficient evidence": Proceed to Step 2.

  #### Step 2: Taxonomic Looping Risk Assessment
  **Question:** Is there evidence that the new or revised diagnostic label (or its removal) is likely to reshape symptom expression, self-understanding, or self-report in a way that could alter the prevalence or clinical presentation of the condition?
  - **Sufficient answer:**
    - "High risk" if there is evidence from similar past revisions, qualitative studies, or psychological experiments indicating that the label can induce symptom amplification, suppression, or recategorization.
    - "Low risk" if evidence from comparable cases shows minimal or no such effects.
    - "Insufficient evidence" if no comparable cases exist or evidence is ambiguous.
  - **Stop rules:**
    - If the answer is "High risk": Proceed to Step 3 (because we must consider if institutional factors might mitigate or exacerbate).
    - If the answer is "Low risk" or "Insufficient evidence": Proceed to Step 4 (skip Step 3).

  #### Step 3: Interaction of Taxonomic and Institutional Looping
  **Question:** If taxonomic looping is a high risk (from Step 2), could institutional changes (e.g., from Step 1) either amplify or mitigate the taxonomic looping effects? Specifically, could the institutional changes create feedback loops that worsen the taxonomic effects?
  - **Sufficient answer:**
    - "Amplification likely": If institutional changes (e.g., increased benefits for the diagnosis) might incentivize symptom exaggeration or increased reporting of the symptoms.
    - "Mitigation likely": If institutional changes (e.g., mandatory treatment) might suppress symptoms or reporting.
    - "Neutral or unclear": If the interaction is neutral or cannot be determined.
  - **Stop rules:**
    - If the answer is "Amplification likely": Proceed to Step 4 (but note high combined risk).
    - Otherwise: Proceed to Step 4.

  #### Step 4: Institutional Looping Risk Assessment
  **Question:** Is there evidence that the proposed revision, through institutional pathways (e.g., access to resources, stigma, legal status), is likely to alter the observed prevalence of the condition independently of changes in actual phenomenology?
  - **Sufficient answer:**
    - "High risk" if there is evidence (e.g., from past revisions, policy changes, or natural experiments) that similar institutional changes led to substantial changes in prevalence due to factors such as increased screening, changes in diagnostic incentives, or social reinforcement.
    - "Low risk" if evidence shows minimal or no such effects.
    - "Insufficient evidence" if no comparable cases exist or evidence is ambiguous.
  - **Stop rules:**
    - Proceed to Step 5 (regardless of answer).

  #### Step 5: Synthesis of Looping Risks
  **Question:** Considering the risks from taxonomic looping (Step 2, and Step 3 if applicable) and institutional looping (Step 4), what is the overall risk of harmful looping effects?
  - **Sufficient answer:** The working group must combine the evidence from Steps 2, 3, and 4 to assign one of the following:
    - "High combined risk": If both taxonomic and institutional risks are high, or if one is high and the other is insufficient evidence but with plausible amplification (from Step 3).
    - "Moderate risk": If one risk is high and the other is low, or both are insufficient evidence but with plausible concerns.
    - "Low risk": If both risks are low or one is low and the other insufficient evidence without amplification.
    - "Unquantifiable risk": If both are insufficient evidence and no plausible mechanism for interaction is identified.
  - **Stop rules:**
    - If "High combined risk": Terminate and **recommend halt**.
    - If "Low risk": Terminate and **recommend proceed**.
    - If "Moderate risk" or "Unquantifiable risk": Proceed to Step 6.

  #### Step 6: Value Judgment on Acceptable Risk
  **Question:** Given the identified risks (moderate or unquantifiable) and the expected clinical benefits of the revision (e.g., improved treatment access, reduced misdiagnosis), do the benefits outweigh the potential harms from looping effects?
  - **Sufficient answer:** This step requires human judgment because it balances risks and benefits. The working group must document:
    - The expected benefits (with evidence if available).
    - The nature of the risks (taxonomic, institutional, or both).
    - A qualitative assessment of whether the benefits justify the risks.
  - **Stop rules:**
    - The procedure does not make a recommendation at this step. It requires the working group to reach a joint decision (by clinicians and epidemiologists) and document the rationale. The outcome can be either to proceed or to halt.

  ### Summary of Termination Points
  - **Halt** at Step 1 (if irreversible institutional harm is evident) or Step 5 (if high combined risk).
  - **Proceed** at Step 5 (if low risk) or after Step 6 (if the group agrees that benefits outweigh risks).
  - **Human judgment** at Step 6 (for moderate or unquantifiable risk).

  ### Application to Concrete Proposals

  #### Proposal 1: Broadening the age-range criteria for an existing neurodevelopmental disorder (e.g., ADHD) to include routine diagnosis in adults.

  **Step 1: Pre-Screening for Obvious Institutional Harm**
  - Question: Does this revision create immediate and irreversible harm?
    - Consider: Adults with this diagnosis might gain access to medications and accommodations, but might also face discrimination (e.g., in employment or insurance). However, there is no clear evidence of irreversible harm (e.g., past cases show that accommodations are reversible). 
    - Answer: **No** (proceed to Step 2).

  **Step 2: Taxonomic Looping Risk Assessment**
  - Question: Risk of label reshaping symptoms and self-report?
    - Evidence: Studies on ADHD in adults show that diagnosis can lead to changes in self-understanding (e.g., reframing life challenges) and might influence symptom reporting (e.g., increased awareness of symptoms). Also, cultural narratives about adult ADHD might amplify symptom recognition.
    - Answer: **High risk** (proceed to Step 3).

  **Step 3: Interaction of Taxonomic and Institutional Looping**
  - Question: Could institutional changes amplify taxonomic effects?
    - Consider: Access to stimulant medications and workplace accommodations might incentivize some individuals to seek the diagnosis and potentially exaggerate symptoms. However, mandatory treatment (if any) might suppress symptoms. Overall, the incentives (benefits) are likely to amplify the taxonomic effect (more reporting and symptom recognition).
    - Answer: **Amplification likely** (proceed to Step 4, noting high combined risk).

  **Step 4: Institutional Looping Risk Assessment**
  - Question: Risk of institutional changes altering prevalence independently?
    - Evidence: Past expansion of ADHD to adults led to increased prevalence due to more screening and diagnostic services. Also, increased awareness campaigns and pharmaceutical marketing can drive diagnosis. 
    - Answer: **High risk** (proceed to Step 5).

  **Step 5: Synthesis of Looping Risks**
  - Taxonomic: High risk (Step 2 and Step 3: amplification).
  - Institutional: High risk (Step 4).
  - Overall: **High combined risk**.
  - **Stop rule: Recommend halt.**

  **Outcome for Proposal 1:** The procedure recommends halting the revision due to high combined risk of harmful looping effects.

  #### Proposal 2: Introducing a new subthreshold anxiety category for primary-care screening.

  **Step 1: Pre-Screening for Obvious Institutional Harm**
  - Question: Immediate irreversible harm?
    - Consider: This category might lead to over-medicalization of normal anxiety and potentially unnecessary treatment. However, it might also improve access to early interventions. There is no clear evidence of irreversible harm (e.g., loss of rights). 
    - Answer: **No** (proceed to Step 2).

  **Step 2: Taxonomic Looping Risk Assessment**
  - Question: Risk of label reshaping symptoms and self-report?
    - Evidence: New diagnostic labels for subthreshold conditions (e.g., pre-diabetes) have been shown to change self-perception and health behaviors. However, for anxiety, there is limited direct evidence. 
    - Answer: **Insufficient evidence** (proceed to Step 4, skipping Step 3).

  **Step 3: Skipped** (because Step 2 was not "High risk").

  **Step 4: Institutional Looping Risk Assessment**
  - Question: Risk of institutional changes altering prevalence?
    - Evidence: Primary-care screening programs for mental health often lead to increased diagnosis and treatment. The new category might be incentivized by quality metrics or reimbursement policies, leading to over-diagnosis. 
    - Answer: **High risk** (proceed to Step 5).

  **Step 5: Synthesis of Looping Risks**
  - Taxonomic: Insufficient evidence (from Step 2).
  - Institutional: High risk (from Step 4).
  - Overall: Since one risk is high and the other is insufficient evidence, but without evidence of amplification (Step 3 skipped), we assign **Moderate risk** (proceed to Step 6).

  **Step 6: Value Judgment on Acceptable Risk**
  - The working group must weigh:
    - Benefits: Early identification of anxiety might prevent progression to full disorders and improve quality of life.
    - Risks: High institutional risk might lead to over-diagnosis and overtreatment, with potential side effects and stigma.
  - This step requires joint sign-off by clinicians and epidemiologists. They might decide that the benefits outweigh the risks, or vice versa.

  **Outcome for Proposal 2:** The procedure does not make a clear recommendation. It requires human judgment. The working group must decide and document.

  ### Case Where the Procedure Produces a Resisted Answer
  - Proposal 1 (broadening age criteria for a neurodevelopmental disorder) resulted in a **halt** recommendation despite the clinical gap (underdiagnosis in adults). The group might resist because they see the revision as addressing a real need, but the procedure flags high looping risks.

  ### What the Procedure Cannot Do
  1. **Detect all loops:** It is designed only for taxonomic and institutional looping as defined. It may miss other kinds of feedback loops (e.g., cultural loops beyond institutional ones).
  2. **Substitute for ethical judgment:** The procedure identifies risks but does not make value-based decisions about acceptable risk (except in Step 6, which delegates to the group).
  3. **Resolve sign-off conflicts:** If clinicians and epidemiologists disagree in Step 6, the procedure does not resolve the conflict; it requires consensus or an external mechanism.
  4. **Predict with certainty:** The procedure relies on available evidence and cannot predict novel loops with no precedent.
  5. **Address resource constraints:** It does not factor in the cost of implementation or the opportunity cost of not revising.

  This formal procedure provides a structured, evidence-based approach to evaluating looping risks in diagnostic revisions, while making explicit the points where human judgment is required.
answer: |-
  ### Reusable Audit Procedure for Evaluating Diagnostic Revisions: Harmful Looping Risk Assessment  
  **Purpose:** To systematically evaluate proposed diagnostic revisions for risks of harmful looping effects (per Ian Hacking's framework), distinguishing between *taxonomic looping* (classification alters symptom expression, self-understanding, or self-reporting) and *institutional looping* (classification changes access to resources, legal status, or social identity, thereby altering observed prevalence).  

  **Procedure Structure:**  
  Six sequential steps with explicit stop rules. Steps 1–5 are evidence-based; Step 6 delegates to human judgment when risks involve value trade-offs. Clinicians and epidemiologists must jointly validate evidence and sign off on outcomes. Time allocation: Steps 1–5 (4 weeks), Step 6 (2 weeks).  

  ---

  #### **Step 1: Identify Irreversible Institutional Harm**  
  **Question:** Could the revision cause immediate, irreversible harm to a subgroup via institutional pathways (e.g., loss of rights, permanent stigma, or exclusion from services)?  
  - **Sufficient answer:**  
    - **Yes:** If precedent (e.g., similar past revisions) or expert consensus confirms irreversible harm (e.g., mandatory institutionalization, ineligibility for employment).  
    - **No:** If no such evidence exists.  
    - **Insufficient evidence:** If harm is plausible but unverified.  
  **Stop rules:**  
    - **Terminate (halt revision)** if answer = **Yes**.  
    - **Proceed to Step 2** if answer = **No** or **Insufficient evidence**.  

  #### **Step 2: Assess Taxonomic Looping Risk**  
  **Question:** Is there evidence that the new/revised label will alter symptom expression, self-understanding, or self-reporting?  
  - **Sufficient answer:**  
    - **High risk:** If empirical data (e.g., studies on label-induced behavioral changes) or analogous cases show label-driven amplification/suppression of symptoms.  
    - **Low risk:** If evidence (e.g., controlled trials) shows minimal effect on self-perception.  
    - **Insufficient evidence:** If no relevant data exist.  
  **Stop rules:**  
    - **Proceed to Step 3** if answer = **High risk**.  
    - **Proceed to Step 4** if answer = **Low risk** or **Insufficient evidence**.  

  #### **Step 3: Evaluate Interaction Between Taxonomic and Institutional Looping**  
  **Question:** If taxonomic looping is high-risk (Step 2), could institutional factors (Step 1) amplify it?  
  - **Sufficient answer:**  
    - **Amplification likely:** If institutional incentives (e.g., disability benefits) could exacerbate label-driven behavioral changes (e.g., symptom exaggeration).  
    - **Neutral/mitigation likely:** If institutional factors suppress looping (e.g., mandatory therapy reduces symptom reporting).  
    - **Unclear:** If interaction cannot be determined.  
  **Stop rules:**  
    - **Proceed to Step 4** (document amplification risk if present).  

  #### **Step 4: Assess Institutional Looping Risk**  
  **Question:** Could the revision alter observed prevalence via institutional pathways (e.g., screening protocols, resource allocation), independent of symptom changes?  
  - **Sufficient answer:**  
    - **High risk:** If data (e.g., policy changes increasing diagnosis rates) show prevalence shifts driven by non-phenomenological factors.  
    - **Low risk:** If evidence (e.g., stable prevalence post-revision) shows minimal institutional effect.  
    - **Insufficient evidence:** If no comparable cases exist.  
  **Stop rules:**  
    - **Proceed to Step 5**.  

  #### **Step 5: Synthesize Overall Looping Risk**  
  **Question:** What is the combined risk from taxonomic (Step 2) and institutional (Step 4) looping, accounting for interactions (Step 3)?  
  - **Sufficient answer (use matrix):**  
    | Taxonomic Risk       | Institutional Risk   | Combined Risk          |  
    |-----------------------|----------------------|------------------------|  
    | High                 | High                | **High**              |  
    | High + Amplification | Any                 | **High**              |  
    | High/Low             | High/Low            | **Moderate**          |  
    | Insufficient evidence| Insufficient evidence| **Unquantifiable**    |  
  **Stop rules:**  
    - **Terminate (halt revision)** if **High risk**.  
    - **Terminate (proceed with revision)** if **Low risk**.  
    - **Proceed to Step 6** if **Moderate** or **Unquantifiable risk**.  

  #### **Step 6: Human Judgment on Risk-Benefit Trade-off**  
  **Question:** Do the revision’s clinical/epidemiological benefits (e.g., improved treatment access) outweigh residual looping risks?  
  - **Sufficient answer:**  
    - Joint clinician-epidemiologist assessment of:  
      - Benefits (e.g., closing diagnostic gaps).  
      - Risks (e.g., potential overdiagnosis).  
      - Values (e.g., tolerance for unquantifiable harm).  
  **Stop rules:**  
    - **No recommendation:** Delegates decision to working group. Must achieve consensus.  

  ---

  ### Application to Concrete Proposals  
  **General Rules:**  
  - Evidence sources: Published studies, registry data, expert surveys.  
  - "Insufficient evidence" invoked if data are >10 years old, contextually irrelevant, or absent.  
  - Clinicians and epidemiologists must co-validate all answers.  

  ---  
  #### **Proposal 1: Broadening Age-Range Criteria for Neurodevelopmental Disorder (e.g., ADHD) to Include Adults**  
  **Step 1: Irreversible Institutional Harm?**  
  - **Answer:** *No*. Precedent (e.g., adult ADHD in DSM-5) shows reversible effects (e.g., workplace accommodations). No evidence of permanent exclusion.  
  - **Outcome:** Proceed to Step 2.  

  **Step 2: Taxonomic Looping Risk?**  
  - **Answer:** *High risk*. Studies (e.g., on adult ADHD diagnosis) show label adoption reshapes self-narrative (e.g., "I was always like this") and amplifies symptom reporting.  
  - **Outcome:** Proceed to Step 3.  

  **Step 3: Interaction with Institutional Looping?**  
  - **Answer:** *Amplification likely*. Access to stimulant prescriptions and academic/job accommodations incentivizes symptom exaggeration.  
  - **Outcome:** Proceed to Step 4.  

  **Step 4: Institutional Looping Risk?**  
  - **Answer:** *High risk*. Primary-care screening incentives (e.g., billing codes) increase diagnosis rates without phenomenological change (e.g., UK primary-care data).  
  - **Outcome:** Proceed to Step 5.  

  **Step 5: Synthesize Overall Risk**  
  - **Combined risk:** *High* (taxonomic high + institutional high + amplification).  
  - **Outcome:** **Terminate (halt revision)**.  

  **Summary:** Clear recommendation to halt.  

  ---  
  #### **Proposal 2: New Subthreshold Anxiety Category for Primary-Care Screening**  
  **Step 1: Irreversible Institutional Harm?**  
  - **Answer:** *No*. No precedent for irreversible harm (e.g., stigma is reversible via therapy).  
  - **Outcome:** Proceed to Step 2.  

  **Step 2: Taxonomic Looping Risk?**  
  - **Answer:** *Insufficient evidence*. No data on how "subthreshold anxiety" label affects self-perception (no analogous categories studied).  
  - **Outcome:** Proceed to Step 4 (skip Step 3).  

  **Step 3: Skipped** (Step 2 not high-risk).  

  **Step 4: Institutional Looping Risk?**  
  - **Answer:** *High risk*. Screening programs (e.g., for depression) show increased diagnosis due to resource allocation (e.g., US Medicare data), not symptom changes.  
  - **Outcome:** Proceed to Step 5.  

  **Step 5: Synthesize Overall Risk**  
  - **Combined risk:** *Moderate* (taxonomic insufficient + institutional high).  
  - **Outcome:** Proceed to Step 6.  

  **Step 6: Human Judgment on Risk-Benefit Trade-off**  
  - **Group assessment:**  
    - *Benefits*: Addresses gap in early anxiety detection.  
    - *Risks*: High institutional looping may inflate prevalence, straining resources.  
    - *Values*: Is overdiagnosis acceptable for better prevention?  
  - **Outcome:** Delegated to working group. No procedure recommendation.  

  **Summary:** Stalls at Step 6 for human judgment.  

  ---  
  ### Case Producing a Resisted Answer  
  **Proposal 1 (ADHD age-range broadening)** yields a **halt** recommendation, which the working group may resist because:  
  - It addresses a documented gap (adult ADHD underdiagnosis).  
  - Clinical benefits (e.g., treatment access) are well-established.  
  - However, the procedure flags unmitigatable risks:  
    - Taxonomic looping (self-perception changes) amplified by institutional incentives (medication access).  
    - Institutional looping (prevalence inflation via screening) is irreversible post-implementation.  
  - Procedure overrules benefits due to **unquantifiable contamination** (interaction effects) and **irreversible institutional impact**.  

  ---  
  ### Limitations of the Procedure  
  The procedure **cannot**:  
  1. **Detect non-specified loops:** Ignores cultural/economic loops (e.g., media-driven symptom popularization) outside taxonomic/institutional definitions.  
  2. **Substitute for ethical judgment:** Does not weigh whether societal benefits justify looping harms (delegated to Step 6).  
  3. **Resolve sign-off conflicts:** If clinicians (prioritizing treatment gaps) and epidemiologists (prioritizing data integrity) disagree in Step 6, consensus must be externally mediated.  
  4. **Predict novel loops:** Limited to evidence from analogous revisions; silent on unprecedented effects.  
  5. **Address implementation feasibility:** Excludes cost, training, or compliance barriers.  

  **Final Output:** Working group receives one of:  
  - **Halt revision** (Steps 1 or 5).  
  - **Proceed with revision** (Step 5).  
  - **Joint human decision required** (Step 6).
