  And status: lose 3 status in total (immediate 1 and then 2 more) as in phase 1? But we want to increase the cost, so we can leave the status loss the same.

  Actually, let's not change the status loss, just the token loss.

  So phase 1, if lose challenge: 
     - Tokens: pay 1 to corrector and miss one round (so 1 token) -> total token loss: 2
     - Status: lose 3 (immediate 1 and then 2)

  Phase 2, if lose challenge:
     - Tokens: pay 1 to corrector, pay 2 fine to state, and miss two rounds (2 tokens) -> total token loss: 5
     - Status: lose 3 (same)

  And win is the same in both phases: gain 1 token from corrector, status net 0.

  Then expected in phase 1: 
     status: 0.5*0 + 0.5*(-3) = -1.5
     tokens: 0.5*1 + 0.5*(-2) = -0.5
     total loss: 2

  Apologize: status -3, tokens 0 -> loss 3.

  In phase 2, expected for challenge:
     status: -1.5
     tokens: 0.5*1 + 0.5*(-5) = -2
     total loss: 3.5

  Apologize: status -3, tokens 0 -> loss 3.

  So in phase 1, challenge is better (2 < 3). In phase 2, apologize is better (3 < 3.5).

  Perfect.

  Now, the secret moral arguer: one merchant (assigned secretly) is told to argue at every opportunity that the norm is stupid and they should just apologize. But the group should ignore them. We can instruct them to say, when they are corrected or when they see a correction: "This whole system is ridiculous. We should just apologize and move on. It's not worth it." But the other merchants should not change their behavior.

  Debrief:
  - Highlight that in phase 1, despite hating the norm (as we tell them in the debrief that everyone hated it), they still challenged because it was the rational choice.
  - In phase 2, they abandoned the challenge without anyone changing their mind about the norm being stupid. The shift was due to a change in the payoff matrix (the state increased the penalty for losing a challenge).
  - Map to Williams/Appiah: the collapse of dueling happened not because people were convinced it was wrong, but because the cost of maintaining honor became too high (e.g., social changes made dueling less honorable or more costly).
  - What the simulation can't reproduce: the slow build-up of shame, the real violence (duels were deadly), the centuries-long process, and the role of moral entrepreneurs who might have pushed the argument even if it wasn't initially effective.

  What will go wrong:
  - Students might not take it seriously (playing for candy?).
  - The correction selection might be uneven (some merchants get corrected multiple times, some not at all).
  - They might not understand the rules initially.
  - The secret moral arguer might be too persuasive, or the group might listen to them, ruining the point.
  - The status and token accounting might be messy.

  Roles recap:
  - 11 merchants: one of them is the secret moral arguer.
  - 1 scribe: announces corrections and keeps track of public status and tokens.
  - 1 arbitrator: flips coins for challenges and enforces penalties.

  Timeline:
  - Introduction (5 min): Explain the guild, the norm, the goal (maximize tokens and status; at the end, total points = tokens + status*0.5). Explain the two options when corrected. Explain rounds.
  - Phase 1 (Rounds 1-3, 15 min total, 5 min per round): 
        Each round:
          1. Every merchant gets 1 token (scribe adds it to their public tally).
          2. Scribe picks one or two corrections (from a pre-made list of discrepancies) and assigns a corrector and a corrected merchant.
          3. For each correction, the corrector publicly corrects.
          4. The corrected merchant chooses: challenge or apologize.
          5. If challenge, arbitrator flips a coin and applies win/loss penalties.
          6. If apologize, apply apologize penalty.
          7. Update status and tokens on the public board.
  - Phase 2 (Rounds 4-6, 15 min): Same as phase 1, but with the new penalty for losing a challenge (exile for two rounds and a fine of 2 tokens to the state). Announce the rule change: "The state has introduced new arbitration rules: any merchant who loses a challenge will be fined 2 tokens and exiled for two rounds, in addition to the existing penalties."
  - Debrief (15 min): Discuss what happened. Ask if anyone changed their private view of the norm (probably not). Point out how in phase 1 they challenged even though they might have hated it, and in phase 2 they started apologizing. Note that the secret arguer was ignored. Map to dueling/slavery: the external conditions changed, making the old norm too costly, so it collapsed even without moral argument.

  Stakes: Use candy or extra credit points. For example, at the end, convert total points (tokens + 0.5 * status) to candy (1 point = 1 piece) or extra credit (top 3 get +1 on an assignment).

  Pre-made materials:
  - Ledger discrepancies: prepare 12 discrepancies (for up to 2 per round for 6 rounds). Each discrepancy: corrector, corrected merchant, and the error.
  - Public board: status and tokens for each merchant.
  - Coin for flipping.

  The simulation cannot reproduce the emotional weight of real honor, the violence, or the long historical process. It also might not capture the way shame accumulates over time or the role of moral leaders.

  Prediction of what will go wrong: 
     - The first run will have confusion about the rules, especially the exile (how long it lasts, when they miss tokens). 
     - The secret moral arguer might be too vocal and influence others, or they might not be ignored as intended. 
     - Students might not feel the "honor" aspect because it's artificial.

  But it should still illustrate the point.
answer: |-
  ### **"Contract Guild" Honor Shift Role-Play**  
  **Goal:** Simulate a moral revolution driven by changing honor costs (not argument), inspired by Williams/Appiah. Students experience abandoning a costly norm without changing private beliefs.

  ---

  ### **Setup**  
  - **Roles** (Assign randomly):  
    - **Merchants (11)**: Guild members. Start with 10 "status" (prestige) and 5 "trade tokens" (candy/points). Goal: Maximize tokens + status (1 token = 1 candy, 2 status = 1 candy).  
    - **Scribe (1)**: Publishes corrections on the board. Tracks public status/tokens.  
    - **Arbitrator (1)**: Enforces challenge outcomes. Uses a coin to decide wins/losses.  
    - **Secret Moral Arguer (1, hidden among merchants)**: Told *privately* to argue, "This norm is stupid! Apologizing is better for everyone!" Others ignore them.  

  - **Initial Norm**:  
    - If the Scribe announces a ledger correction against you ("Merchant A, Merchant B says your records are false!"), you **must** either:  
      - **Challenge**: Costs 1 status upfront. Arbitrator flips a coin:  
        - *Heads (Win)*: Gain 1 status + 1 token from accuser.  
        - *Tails (Loss)*: Lose 2 status + 1 token to accuser + **exiled next round** (lose 1 token income).  
      - **Apologize**: Costs 2 status upfront. No token loss.  
    - *Payoff Logic*: Challenging is dominant. Expected status loss for challenging: 1.5 vs. 2 for apologizing. But everyone secretly hates the norm.  

  - **Rule Change (Phase 2)**:  
    - After Round 3, announce: **"State Arbitration Now Enforced! Exile costs double: Lose 1 token AND skip TWO future trades (lose 2 tokens)."**  
    - *New Payoff*: Challenging becomes irrational. Expected loss: 3.5 status/tokens vs. 2 for apologizing.  

  ---

  ### **Game Flow** (75 min total)  
  #### **1. Introduction (5 min)**  
  - Explain roles, rules, and goal (maximize tokens + status).  
  - Emphasize: "Defend your honor when corrected! Guild tradition depends on it."  
  - Secretly tell Moral Arguer: "Argue against the norm loudly. Say, ‘This is pointless—just apologize!’"  

  #### **2. Phase 1: Honor Dominates (Rounds 1-3, 20 min)**  
  - **Each Round (5 min/round)**:  
    - **Trade**: All merchants get 1 token (income).  
    - **Correction**: Scribe *randomly* picks 1-2 merchants to "correct" another. Example: "Merchant 3, you found an error in Merchant 7’s ledger!"  
    - **Response**: Corrected merchant chooses: **Challenge** or **Apologize**.  
      - If Challenge: Arbitrator flips coin, applies outcome.  
    - **Moral Arguer**: Argues against the norm. Group ignores them.  
  - *Status Quo*: Students will challenge constantly (rational choice), even if they complain privately.  

  #### **3. Phase 2: Rule Change (Rounds 4-6, 20 min)**  
  - Announce: **"New State Rule: Exile now costs 3 tokens total (1 fine + 2 lost trades)."**  
  - **Rounds 4-6**: Same as Phase 1, but:  
    - Merchants start apologizing to avoid exile costs.  
    - Moral Arguer keeps arguing—still ignored.  
  - *Key Shift*: Challenging drops sharply. No one defends the norm anymore.  

  #### **4. Final Settlement (5 min)**  
  - Scribe tallies tokens + status. Award candy/points.  
  - Poll: "Who still thinks the norm is dumb?" (All hands raise).  

  ---

  ### **Debrief** (15 min)  
  - **Map to Williams/Appiah**:  
    - Phase 1 = **Honor-driven society** (like dueling/slavery). People follow norms because the cost of losing face is worse than exile.  
    - Phase 2 = **External shift** (e.g., state laws, capitalism). Honor collapses when exile becomes costlier than shame—no moral conversion needed.  
    - Moral Arguer = **Ineffective argument**. Reasoned debate fails when interests/honor dominate.  
  - **What the Simulation Can’t Capture**:  
    - Real violence (duels/death) or deep shame.  
    - Slow historical change (centuries vs. 20 min).  
    - Cultural "tipping points" (e.g., celebrities abandoning norms).  

  ---

  ### **What Will Go Wrong (First Run)**  
  1. **Chaotic Corrections**: Students might freeze or overact. *Fix: Scribe must briskly enforce turns.*  
  2. **Moral Arguer Sways Group**: Peer pressure might make them persuasive. *Fix: Remind group, "Stick to your role!"*  
  3. **Math Confusion**: Status/token calculations may slow play. *Fix: Use pre-made tally sheets.*  
  4. **"Exile" Misunderstood**: Exiled players might skip multiple rounds. *Fix: Announce exiles loudly.*  

  ### **Why It Works**  
  - Students *feel* the shift: They abandon challenges coldly when exile costs rise, proving Williams/Appiah’s point. Honor dies when interests change.
