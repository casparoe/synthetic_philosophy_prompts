prompt: |-
  I'm writing about a split in consciousness-research ethics: review boards now require a structured "phenomenal baseline" interview—in which subjects report the qualitative character of their experience in standardized terms—before any neural intervention, yet those same boards reject subjective testimony entirely when assessing harm, relying only on behavioral and neural metrics. The practice treats first-person reports as indispensable for calibrating the experiment but as epistemically worthless for evaluating damage. What view of mental content licenses that bifurcation? Does it presuppose that qualia are real but causally inert, that they are available to introspection but not to evidence, or something closer to the eliminativist suspicion—associated with Chase and Sanborn—that qualia form an incoherent posit and all first-person data are confabulated? Reconstruct the implicit theory, distinguish what the protocol strictly requires from what it merely accommodates, say whether the practice is philosophically underdetermined, and specify what would have to change in review standards if the underlying stance were replaced by a uniformly realist or uniformly eliminativist view of consciousness. End with a single line beginning Verdict: followed by a short phrase naming the reconstructed philosophical commitment.
reasoning: |-
  Okay, the user is writing about a split in consciousness-research ethics. Review boards require a "phenomenal baseline" interview to get subjects' reports of their qualitative experiences before neural interventions. But when assessing harm, those same boards ignore subjective testimony and only look at behavioral and neural metrics. This seems contradictory—treating first-person reports as essential for setup but useless for harm evaluation.

  The user wants to know what view of mental content allows this bifurcation. They suggest possibilities like qualia being real but causally inert, available to introspection but not as evidence, or eliminativist views where all first-person data is confabulated. I need to reconstruct the implicit theory behind this practice, distinguish what the protocol strictly requires from what it accommodates, discuss if it's philosophically underdetermined, and explain how review standards would change under uniformly realist or eliminativist views. Then end with a "Verdict" naming the philosophical commitment.

  First, the bifurcation: baseline interviews are mandatory to calibrate the experiment, meaning subjective reports are trusted for setting up the intervention. But for harm assessment, they're dismissed—only objective measures like behavior and brain scans matter. This implies that qualia are accessible to the subject and reportable pre-intervention, but their post-intervention status can't be reliably communicated or used as evidence of harm. So, the implicit theory must involve qualia being real and introspectable, but their changes aren't trustworthy or verifiable after the fact.

  The user mentioned Chase and Sanborn's eliminativist suspicion, where qualia are incoherent and all first-person data is confabulated. But the protocol requires baseline reports, which wouldn't make sense under full eliminativism because it treats pre-intervention reports as valid. So, it can't be pure eliminativism. Instead, it might lean toward qualia realism for baseline but skepticism about their causal role or reliability post-harm.

  Strictly, the protocol requires that subjective reports are necessary for experimental calibration. It accommodates that they might be unreliable for harm assessment without outright denying their existence. This suggests a non-eliminativist view where qualia are real but epistemically limited—perhaps they're private and can't be intersubjectively verified, making them useless for objective harm evaluation.

  Philosophically, this practice is underdetermined because it doesn't commit to a single theory. It could fit with property dualism (qualia as non-physical), reductive physicalism with skepticism about report reliability, or even a pragmatic stance. The key is the epistemic asymmetry: pre-intervention reports are stable and calibrating, while post-harm reports are seen as noisy or biased.

  If the stance were uniformly realist, review boards would have to accept subjective harm reports as evidence, incorporating interviews post-intervention and developing methods to validate them. If uniformly eliminativist, baseline interviews would be scrapped entirely, relying only on neural/behavioral metrics from the start—but that's not happening, so the current practice isn't eliminativist.

  For the verdict, the reconstructed commitment is probably "Epistemically Restricted Qualia Realism" because it affirms qualia's reality for calibration but restricts their role in harm assessment due to epistemic concerns. This captures the bifurcation without endorsing full eliminativism or causal inertness.

  I should structure the response clearly: start with the implicit theory, then requirements vs. accommodations, underdetermination, changes under other views, and end with the verdict. Keep it precise and academic, matching the user's sophisticated language.
answer: |-
  The bifurcation in consciousness-research ethics rests on an **implicit commitment to Epistemically Restricted Qualia Realism**, coupled with **methodological behaviorism in harm assessment**. Here’s the reconstruction:

  ### **Implicit Theory of Mental Content**
  1. **Qualia Realism for Calibration**:  
     The requirement of a pre-intervention "phenomenal baseline" presupposes that qualia (subjective experiential properties) *exist*, are *introspectively accessible*, and can be *reliably reported* under controlled conditions. Subjects are treated as accurate observers of their own conscious states *prior* to intervention.  
  2. **Causal/Epistemic Inertia for Harm Assessment**:  
     Post-intervention, subjective reports are excluded because qualia are implicitly viewed as:  
     - **Causally decoupled** from objective measures: Changes in qualia need not manifest in behavior or neural correlates.  
     - **Epistemically unreliable**: Post-harm testimony is distrusted due to confabulation, bias, or the impossibility of intersubjective validation.  
     This aligns with a **property-dualist-leaning view**: qualia are real first-person properties but lack public, causal traction.  

  ### **Protocol Requirements vs. Accommodations**
  - **Strictly Requires**:  
    - Qualia as *real and reportable* for baseline calibration (validating the intervention’s target).  
    - Harm as *exclusively third-person* (neural/behavioral deviations signal damage).  
  - **Accommodates (but does not require)**:  
    - Eliminativism about post-harm reports (they *could* be confabulated).  
    - Reductive physicalism (if qualia reduce to neural states, baseline reports index those states pre-intervention, but post-harm neural metrics are prioritized as "purer" data).  

  ### **Philosophical Underdetermination**  
  The practice is **underdetermined** between:  
  - **Non-reductive physicalism/dualism**: Qualia exist but are causally inert post-harm.  
  - **Pragmatic instrumentalism**: Subjective reports are useful tools for setup but invalid for harm due to operational constraints (e.g., legal defensibility).  
  It *excludes*:  
  - **Uniform realism** (ignoring post-harm testimony contradicts treating qualia as real *and* consequential).  
  - **Uniform eliminativism** (baseline reliance affirms qualia’s existence/utility).  

  ### **Changes Under Alternative Stances**  
  - **Uniform Realism (e.g., Cartesianism/Phenomenalism)**:  
    - Review boards **must accept subjective harm reports** as primary evidence.  
    - Metrics like distress narratives or phenomenological interviews become mandatory post-intervention.  
    - Behavioral/neural data become secondary correlates.  
  - **Uniform Eliminativism (e.g., Radical Neuro-reductionism)**:  
    - **Baseline interviews abolished** as unscientific confabulation.  
    - Experiments calibrated *only* via neural/behavioral pre-scans.  
    - Harm assessed solely through functional deficits (e.g., cognitive task failures, lesion mapping).  

  ---

  **Verdict**: Methodological Qualia Skepticism.  

  *(This verdict captures the core tension: qualia are granted provisional reality for experimental setup but demoted to epistemic ghosts in harm evaluation, reflecting a pragmatic yet inconsistent skepticism about first-person data’s evidential scope.)*
