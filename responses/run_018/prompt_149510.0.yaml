  hey, i was discussing teleosemantics with a friend over coffee and i think i accidentally built an argument that makes mental content way too cheap, but i can't see the exit. here's the chain: (1) on the teleosemantic view, what a mental state is about is fixed by the evolutionary function of the cognitive mechanism that produces it—so representation is basically tracking-with-selection-history. (2) if that's the criterion, then it's not limited to brains; the immune system tracks pathogens through selection-shaped recognition patterns, and those patterns carry specific information about viral vs bacterial invaders. (3) so immune signaling literally has intentional content about specific pathogens, not just causal covariance. (4) but then the same applies to my liver tracking toxins, and arguably to price mechanisms in markets tracking scarcity, since those also evolved or were designed to track enviromental features. (5) so teleosemantics doesn't naturalize mental content specifically; it just shows that representation is scattered all over biology and culture, which makes the mental case unremarkable. (6) therefore the view either collapses mental representation into generic biological information, or it's wrong. i want to keep (1) but (5) feels like a reductio. is the mistake in (3) where i slide from "tracks" to "represents," or in (4) where i extend the argument past organisms? and if i block the slide, do i have to accept that mental content requires some special consumer mechanism, and doesn't that just push the naturalization problem back one step?
