  Let me mentally walk through the options. If we accept their chain, we might bite the bullet and say yes, representation is everywhere - but that actually aligns with Ruth Millikan's view. Alternatively, we could distinguish mental representation by its role in cognitive architecture - maybe requiring inferential integration or decoupleability. Dretske's consumer-based approach might help here, though it risks circularity. 

