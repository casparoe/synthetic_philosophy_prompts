prompt: |-
  As someone who has recently begun studying evolutionary explanations of social behavior, I find myself returning to a conceptual tension in the units-of-selection debate that introductory treatments usually resolve too quickly. I am not asking which level—gene, individual, or group—is ultimately correct; rather, I want you to construct a concrete, somewhat non-standard evolutionary scenario in which adopting the gene-level framing versus the multilevel-selection framing yields genuinely incompatible conceptual judgments about whether a particular trait counts as adaptive or maladaptive. Specifically, I want the example to involve facultative social behavior—where individuals can switch between solitary and cooperative phenotypes—rather than obligate eusociality, because phenotypic plasticity introduces ambiguity about what counts as the replicator boundary and about the appropriate fitness baseline for measuring costs and benefits. The scenario should illustrate how this divergence is not settled merely by invoking Hamilton’s rule or kin-selection coefficients, but instead reveals a deeper disagreement over whether evolutionary explanations must cite physically discrete replicators and how to treat costs that are partially recoverable through phenotypic switching. Please design the example so that it can be fully analyzed from first principles and general evolutionary concepts, without reference to specific empirical studies or citations, and show precisely where the two frameworks diverge in their assessment of adaptiveness and in the conditions they treat as necessary for selection to operate.
reasoning: |-
  Okay, the user is diving deep into evolutionary biology, specifically the units-of-selection debate. They want a concrete example where gene-level and multilevel-selection frameworks give conflicting judgments on whether a trait is adaptive, focusing on facultative social behavior. Let me unpack their request.

  First, they mentioned facultative behavior, not obligate eusociality. So the example needs individuals switching between solitary and cooperative modes. Phenotypic plasticity is key here. The user wants ambiguity in replicator boundaries and fitness baselines. They also want to go beyond Hamilton's rule, highlighting a deeper disagreement about discrete replicators and recoverable costs.

  The user is likely a grad student or advanced undergrad, given their nuanced understanding. They’ve hit a conceptual wall in introductory materials. Their deeper need might be to grasp the philosophical underpinnings of evolutionary theories, not just the mechanics. They might be preparing for a thesis or seeking clarity for research.

  To construct the scenario, I need a trait with context-dependent expression. Imagine an organism that cooperates in groups but switches to solitary under stress. The conflict should arise when cooperation appears maladaptive at the group level but beneficial at the gene level. 

  For gene-level framing, the gene for plasticity is the replicator. Its fitness depends on average outcomes across contexts. If cooperation in groups fails but the gene persists due to recoverable costs in solitary mode, it’s adaptive. 

  Multilevel selection sees group cohesion as crucial. If groups collapse under stress, cooperation is maladaptive because it wastes resources. The recoverable costs aren’t fully accounted for here, leading to a different judgment.

  The key divergence is in defining fitness baselines and whether costs are recoverable. Gene-level considers the gene’s net effect, while multilevel focuses on the trait’s immediate group impact. The user wants this tension clear without relying on Hamilton’s rule, emphasizing conceptual roots.

  I’ll use the desert pseudoscorpion example. Cooperation in good times, solitary in bad. When cooperation leads to group collapse, multilevel deems it maladaptive. Gene-level looks at the gene’s survival across cycles, seeing it as adaptive. This shows the core conflict: replicator continuity vs. trait-group functionality.
answer: |-
  Here's a concrete scenario designed to highlight the conceptual divergence between gene-centered and multilevel-selection frameworks regarding facultative social behavior:

  ### Scenario: The Desert Pseudoscorpion (_Aridochelis plasticus_)
  **Life Cycle & Environment:**
  1.  **Habitat:** Isolated, ephemeral oases in a desert. Oases form after rare rains but desiccate unpredictably (average lifespan: 5 generations). Some individuals disperse to find new oases when conditions deteriorate.
  2.  **Phenotypic Plasticity:** Individuals possess a facultative "cooperator" allele (C) triggered by high local population density (signaling a stable oasis). When density is low (signaling a new/struggling oasis or impending dispersal), they express the default "solitary" phenotype.
  3.  **Cooperator Phenotype (High Density):**
      *   Invests resources into digging/maintaining shared burrows that significantly reduce predation and desiccation for all inhabitants (public good).
      *   Incurs a **recoverable cost:** Delays personal reproduction by 1 generation while investing in burrows. If the oasis persists, they *can* recover this cost later by reproducing in the safer environment they helped create.
      *   Increases group survival/reproductive output significantly *if* the oasis persists long enough.
  4.  **Solitary Phenotype (Low Density):**
      *   Focuses solely on immediate reproduction and dispersal.
      *   No investment in public goods. Lower baseline survival/reproduction in a stable oasis compared to a cooperator *in that same oasis* due to lack of burrow benefits.
  5.  **Critical Environmental Interaction:** If an oasis desiccates *soon after* cooperators have invested (before they can reproduce), the cost is **not recovered**. They die without reproducing, while solitaries born at the same time may have already produced offspring or dispersed.
  6.  **Allele Dynamics:** The C allele controls the plastic switch. The "solitary" is the default state (no specific "solitary allele" needed).

  ### Trait in Question: The **Cooperator Phenotype Expression** (triggered by high density).

  ---

  ### Analysis: Divergent Judgments of Adaptiveness

  **1. Gene-Level Framing (Replicator: C Allele)**
  *   **Replicator:** The C allele itself. Its "fitness" is its long-term frequency change across the entire metapopulation (all oases).
  *   **Cost/Benefit Baseline:** Phenotype expression is *conditional*. Fitness is the *average* reproductive output of the C allele *across all environmental contexts it experiences* (dense/oases that persist, dense/oases that collapse quickly, low density).
  *   **Adaptiveness Assessment:**
      *   In a *persistent* oasis, C carriers (after recovering cost) out-reproduce solitaries due to burrow benefits. High fitness.
      *   In a *quickly collapsing* oasis, C carriers die without reproducing (cost not recovered). Zero fitness.
      *   In *low density*, C carriers express solitary phenotype and have the same fitness as non-carriers.
      *   **Key:** Dispersal ensures the C allele experiences both good (persistent oases) and bad (collapsing oases) environments. *If* the long-term probability of experiencing a persistent oasis (where the fitness gain is large) is high enough *relative to* the probability and cost of experiencing a quick collapse, the *average* fitness of the C allele can be **higher** than alternative alleles (e.g., alleles incapable of cooperation).
  *   **Judgment:** The cooperator phenotype expression is **adaptive for the C allele** *if* its *long-term average* representation in future generations increases compared to non-cooperation-capable alleles, despite the catastrophic failures in collapsing oases. The "cost" of cooperation is only maladaptive in the specific context of immediate collapse; it's an essential gamble for high rewards elsewhere, averaged over the allele's lineage history.

  **2. Multilevel-Selection Framing (MLS1 - Trait Groups)**
  *   **Units:** Individuals *and* temporary trait groups (the collection of individuals within a specific oasis during a specific time period).
  *   **Fitness Baselines & Costs:**
      *   *Individual Fitness:* Measured *within* the context of its current group/environment.
      *   *Group Fitness:* Persistence and total reproductive output *of the oasis group* before dispersal/desiccation.
      *   **Cost Definition:** The cost of cooperation is defined *relative to the solitary phenotype **within the same group context***. The 1-generation delay is a *direct and immediate* fitness cost within the group, even if potentially recoverable later *if* the group persists.
  *   **Selection Levels:**
      *   *Within-Group Selection:* Favors the solitary phenotype *within any oasis*. Solitaries avoid the upfront cost and "free-ride" on cooperators' burrows. They have higher *immediate* relative fitness.
      *   *Between-Group Selection:* Favors groups with a high proportion of cooperators *if* the oasis persists long enough. These groups have much higher survival and total reproduction.
  *   **Adaptiveness Assessment:**
      *   The cooperator trait **reduces** the *relative fitness of the individual expressing it* compared to solitaries *within its own group at the time of expression* (negative within-group selection).
      *   The cooperator trait **increases** the *absolute fitness of the group* (positive between-group selection) *only if* the oasis persists sufficiently long for the public good benefits to manifest and for cooperators to recover their cost.
      *   **Crucial Point:** In oases that collapse *quickly*, the cooperator trait is **doubly maladaptive** in the MLS view: 1) It directly harmed the individual's fitness within the group (they died without reproducing while solitaries might have), and 2) It *did not* provide any group benefit (burrows were useless against desiccation). The "recoverable cost" became an *absolute, unrecoverable loss*.
  *   **Judgment:** Whether the cooperator trait is **adaptive overall** depends on the *balance* of within-group vs. between-group selection pressures *and the frequency of different group outcomes*. If quick collapses are frequent, the trait might be deemed **maladaptive** (or weakly adaptive) because the negative within-group effects dominate and the between-group benefit is often unrealized. The trait's adaptiveness is contingent on environmental stability (oasis persistence time). The "cost" is treated as absolute within the group context where it was paid, regardless of potential future recoverability.

  ---

  ### Where the Frameworks Diverge Fundamentally

  1.  **The Replicator Boundary & Identity:**
      *   **Gene-Level:** The physically discrete replicator is the C allele. Its fitness transcends individual bodies and ephemeral groups. The "individual" expressing cooperation is just a temporary vehicle. The allele persists through lineages across collapsing oases via dispersal.
      *   **MLS:** While genes exist, the *focal units for selection* are the individual organism (within groups) and the trait group (oasis population). The "replicator" for the *social trait* is ambiguous; selection acts *on* the differential survival/reproduction of individuals and groups *carrying* the trait in specific contexts. The group (oasis) is a real, functional unit subject to selection (extinction), but it's transient.

  2.  **Treatment of Costs, Recoverability, and Fitness Baseline:**
      *   **Gene-Level:** Costs and benefits are integrated over the *entire lineage history and environmental variation experienced by the allele*. The "recoverable cost" is a conditional investment; its impact on allele fitness depends on the *probability distribution* of environmental outcomes (persistence vs. collapse). Fitness is the *long-term expected reproductive output*.
      *   **MLS:** Costs and benefits are assessed *within the specific context where the trait is expressed*. The 1-generation delay is an absolute fitness cost *within that oasis group at that time*, compared to solitaries in the same group. The *potential* for recovery later is a separate benefit contingent on group survival; it doesn't negate the immediate cost. Fitness is measured *contextually*.

  3.  **Necessary Conditions for Selection:**
      *   **Gene-Level:** Requires heritable variation in replicators (alleles) and differential survival/replication of those replicators across environments. Persistence across group extinctions via dispersal is key. The "group" is not a necessary unit; variation in individual success driven by allele expression suffices.
      *   **MLS:** Requires identifiable groups with variation in group-level traits (proportion of cooperators), differential "fitness" of groups (persistence/reproductive output), and heritability of group character (via differential dispersal/colonization or trait transmission). The *transience* of the groups is a challenge, but their differential success during their existence is the core driver of between-group selection. The group *is* a necessary level of organization for the explanation.

  **Conclusion:** In scenarios with facultative traits involving potentially recoverable costs in unstable environments, the gene-level view can deem a trait adaptive based on the long-term average success of the underlying allele across varying contexts, even if the trait expression is catastrophic in specific instances. The MLS view, focusing on immediate fitness differentials within the context of trait expression and the realized success/failure of the groups formed by that trait, may deem the same trait maladaptive if the negative within-group effects are strong and the positive between-group effects are often unrealized due to environmental instability. The disagreement stems from fundamentally different conceptions of the replicator, the relevant timescale for fitness accounting, the definition of costs/benefits, and the necessity (or not) of groups as units subject to selection. Hamilton's rule struggles here because relatedness is low/non-existent (facultative, not kin-based), and the key conflict revolves around the conditional recoverability of costs and the definition of the selective arena, not just inclusive fitness calculations.
