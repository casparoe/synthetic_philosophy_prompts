answer: |-
  Right then, settling in? Brilliant. Thanks for popping by on a Friday – much appreciated. Bit of a mixed bag today, which is lovely. Some of you could probably recite Wittgenstein's laundry lists backwards, notebooks and all. Others might be thinking, "Wittgenstein? Wasn't he that intense Austrian bloke who reckoned talking was like playing conkers?" Both perspectives are dead useful.

  So, we’re here to chat about Wittgenstein and *religious belief*. Now, he gives us this massive nudge away from thinking about religious statements – stuff like "God exists" or "There'll be a Last Judgement" – as if they were just *bad science*. You know, like someone getting their sums wrong about the universe. "Evidence a bit thin for the Almighty, old chap!" That sort of thing.

  He reckoned that wasn't just *inaccurate*, it was completely missing the point, like trying to use a spanner to eat soup. Utterly the wrong tool for the job.

  His big idea, which some of you know well, is that it functions differently – more like the *rules* you live by. The foundations, the stuff you *just do*, that shapes how you see everything else. But I want to push that image a bit further today, using a picture... literally.

  Think of a painting. We spend ages looking *at* the picture – the colours, the figures, the landscape. We argue about what it *means*, what it *shows*. "Is that a tree or a giant broccoli?" "Is she smiling or grimacing?"

  But what holds the whole thing together? What defines the space where *any* of that meaning can even happen? It’s the **frame**. The frame isn't *in* the picture. You don't stand there debating whether the gilded bit is *true* or *false* in the same way you debate the broccoli-tree. The frame doesn't get argued about *like* the image inside it. It’s what *makes* the image possible. It sets the boundaries, the context. Without the frame, it’s just canvas and pigment; the frame turns it into *art* – something to be engaged with, interpreted, felt.

  **That's the nub of it.** For Wittgenstein, profound religious beliefs – believing *in* God, *in* the Last Judgement, *in* grace – they’re functioning more like that **frame** than like the painted scene everyone's squabbling over. They’re not propositions about the world competing with geology or physics. They’re the underlying structure, the *form of life*, that gives *meaning* and *gravity* to a whole way of being. They shape how someone *sees* the world, how they experience joy, suffering, morality, the lot. They’re the parameters within which their life makes sense.

  So, when someone who lives within *that* frame says "I believe in God," or "I believe in the Last Judgement," and someone standing *outside* that frame says "Prove it!" or "That’s unscientific nonsense!"... well, they’re not actually disagreeing about the *same kind of thing*. They’re not even looking at the *same argument*. One is talking about the very structure holding their world together (the frame), and the other is demanding evidence for a figure *within* a picture painted on a completely different canvas. They’re ships passing in the night, operating on different levels entirely.

  It’s not about winning a factual debate. It’s about understanding a different way the world can be *held*, a different way meaning can be *made*. That’s the shift he asks us to make. Not "Is this fact correct?" but "How does this *work* in a human life? What frame does it provide?"

  That’s the space I hope we can explore together this morning – less like debaters, more like people trying to understand different ways the picture can be framed. Let's chat.

