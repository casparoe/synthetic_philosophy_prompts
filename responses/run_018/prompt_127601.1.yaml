  4.  **Dissociative Identity Disorder (DID)**
      *   **Reflexive Looping: 4** (High) - The dramatic nature of the diagnosis and prolific online content (including contentious communities) can strongly shape individuals' internal experiences and self-presentation towards the expected symptomatology.
      *   **Adversarial Looping: 2** (Low) - Online communities are often insular and preoccupied with internal validation or system mapping; significant external adversarial pressure challenging the diagnostic construct itself is limited compared to ASD/ADHD.
      *   **Composite Score: 3.0**
      *   **Justification:** High diagnostic ambiguity and controversial online spaces (e.g., "syscourse") foster significant reflexive shaping of experience. However, the condition's lower general visibility and community dynamics centred on internal experiences rather than systemic critique result in minimal adversarial looping impacting the taxonomy.

  5.  **Social Anxiety Disorder (SAD)**
      *   **Reflexive Looping: 3** (Moderate) - Awareness can lead individuals to interpret shyness or discomfort through the diagnostic lens, potentially amplifying avoidance behaviours, though internalisation is often less identity-defining than for ASD or BPD.
      *   **Adversarial Looping: 1** (Minimal) - While support communities exist, they primarily focus on coping strategies rather than collectively challenging the diagnostic criteria or its societal application; no significant movement demands taxonomic revision.
