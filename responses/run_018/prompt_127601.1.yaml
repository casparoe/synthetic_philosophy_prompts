  2.  **Attention-Deficit/Hyperactivity Disorder (ADHD)**
      *   **Reflexive Looping: 4** (High) - Significant online discourse and community normalisation lead many to reinterpret life experiences through the ADHD lens, altering self-perception and behaviour to fit common narratives.
      *   **Adversarial Looping: 4** (High) - A large, vocal online community challenges stereotypes, critiques diagnostic barriers (especially for adults/women), and advocates for broader recognition and acceptance, influencing clinical understanding.
      *   **Composite Score: 4.0**
      *   **Justification:** High social visibility and massive online communities drive strong reflexive identity adoption. While diagnostic criteria are clearer than some, community advocacy effectively challenges misconceptions and access issues, creating notable adversarial pressure for recognition beyond childhood presentations.

  3.  **Borderline Personality Disorder (BPD)**
      *   **Reflexive Looping: 5** (Extreme) - The label's pejorative connotations and focus on identity disturbance create intense internalisation, often leading individuals to conform strongly (sometimes catastrophically) to the diagnostic criteria in self-concept and behaviour.
      *   **Adversarial Looping: 2** (Low) - Despite online communities, stigma and internal division (e.g., over identity acceptance vs. recovery focus) significantly hinder cohesive collective action against the diagnostic framework itself.
