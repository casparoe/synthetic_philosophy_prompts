      *   **Testing for Intent:** If Maya calls D "Restored" and E "Corrupted", she has a hidden rule about *correctness* of restoration intent, not just palette adherence. If she calls both "Restored", only palette matters.

  **Conclusion:** Maya's system prioritizes **strict palette adherence** as a deal-breaker and uses **thresholds for reconstruction percentage**. Spatial clustering mitigates the severity of *missing* pixels, distinguishing it from scattered loss. The presence of a single out-of-palette pixel and reconstruction exceeding 10% almost certainly leads her to a **Corrupted** verdict for this sprite, despite the mitigating factors of clustering and two correct fills. Her rules focus on the *authenticity of the pixel data and interventions* rather than the intent behind the original damage, though interventions are judged by their adherence to technical constraints (palette) and scale (reconstruction %). Testing with cases involving suspicious damage patterns or technically valid but incorrect restorations could reveal hidden nuances about intent.
