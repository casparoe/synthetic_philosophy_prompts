prompt: |-
  I'm a distributed-systems engineer who mostly thinks in terms of backpreasure, load shedding, circuit breakers, queue depth, and gracefull degradation. Restate Garrett Hardin's lifeboat ethics argument—wealthy nations as lifeboats with a hard carrying capacity that shouldn't take on passengers from sinking boats—using only that vocabulary, as precisely as you can. For each part, say whether it maps clean, needs distortion, or has no analouge at all in queue management. Then give me the residue report: is the moral urgency Hardin claims just my framework missing a fairness metric, or is he smuggling in normative work that has no counterpart in how we handle overload? After the prose, give me a JSON object with exactly these fields: "clean_maps" (array of strings), "distortions" (array of strings), "missing_claims" (array of strings), "residue_verdict" (string). Keep it focused—no bibliographies or citations, i just want to check if my gut feeling that it's load-shedding with extra moral steps is right or wrong.
reasoning: |-
  We are restating Garrett Hardin's lifeboat ethics argument using distributed systems terminology.
   The core idea: Wealthy nations are like lifeboats with a fixed carrying capacity. They should not take on more passengers (from poor nations) because that would exceed capacity and sink the lifeboat.

   We'll use terms: backpressure, load shedding, circuit breakers, queue depth, graceful degradation.

   Steps:
   1. Identify the components of Hardin's argument.
   2. Map each part to distributed systems concepts.
   3. For each mapping, note if it is clean, distorted, or missing.

   Components of Hardin's argument (simplified):
   - Wealthy nations (lifeboats) have a fixed carrying capacity (resources).
   - Poor nations (swimmers in the water) are trying to get into the lifeboats.
   - Taking on more passengers than the capacity leads to catastrophe (sinking).
   - Therefore, wealthy nations must not take on passengers to avoid exceeding capacity.

   Mapping:
   - Wealthy nations as systems: They are like individual service instances (or nodes) that have a maximum capacity (e.g., maximum requests they can handle).
   - Carrying capacity: The maximum capacity of the system (e.g., maximum concurrency, queue depth limits).
   - Poor nations as incoming requests: They are like requests from clients that are trying to be served. However, note: in Hardin's view, these are not normal requests but ones that would overload the system.
   - Taking on passengers: Accepting requests that would cause the system to exceed capacity.
   - Sinking: System failure due to overload.

   Now, let's restate using the given terms:

   "Wealthy nations are independent systems operating at sustainable capacity. They have a fixed queue depth and a hard carrying capacity. Incoming migration requests from poor nations (which are in a state of graceful degradation due to resource exhaustion) represent additional load. If the lifeboat system accepts these requests beyond its capacity, it risks exceeding its queue depth, leading to a system crash (sinking). Therefore, the system must apply load shedding to reject these requests outright. It may also use circuit breakers to prevent further requests from the same source (or category) once the system is near capacity. Backpressure mechanisms are not applicable in this scenario because the source of the load (poor nations) is not a system that can be signaled to slow down; they are unresponsive to backpressure. The goal is to maintain the system's stability through strict capacity enforcement, avoiding any graceful degradation that would lower the quality of service for existing users."

   Now, for each part:

   1. Wealthy nations as independent systems: 
      - Clean? Mostly clean. Each nation is an independent system.

   2. Fixed carrying capacity as queue depth and maximum concurrency: 
      - Clean? The concept of maximum capacity is clean. Queue depth is a specific mechanism that can model the carrying capacity (how many requests can be queued). But note: in systems, we often have multiple resources (CPU, memory, etc.), but here we are abstracting to a single capacity.

   3. Poor nations as sources of requests: 
      - Distortion? In distributed systems, we usually don't model entire nations as request sources. Also, the requests are not voluntary in the same way. However, the concept of an external load is clean.

   4. Migration requests as load: 
      - Clean? Accepting a migrant is like processing a request. But note: in systems, we can drop requests. In lifeboat, we are talking about human lives. This is a distortion because the moral weight is absent in our technical terms.

   5. Accepting beyond capacity leading to crash: 
      - Clean? Yes, this is a standard overload scenario.

   6. Load shedding to reject requests: 
      - Clean? Load shedding is exactly the mechanism to drop requests when overloaded.

   7. Circuit breakers: 
      - Distortion? Circuit breakers are used to stop accepting requests from a failing dependency. Here, we are not talking about a dependency but an external source. We might use it to block requests from a particular region if we see too many requests? But the analogy is a bit forced.

   8. Backpressure: 
      - No analogue? Hardin argues that backpressure (signaling to the source to slow down) is not possible because the poor nations are not responsive. This is clean in the sense that the source is unresponsive, but in distributed systems, backpressure is a mechanism for cooperative systems. Here, there is no cooperation.

   9. Graceful degradation: 
      - Distortion? Hardin says that poor nations are in a state of graceful degradation (meaning they are failing slowly). But in the lifeboat, we are not allowing the wealthy nation to degrade gracefully; we are avoiding degradation by rejecting. Also, graceful degradation in systems is about reducing functionality to avoid crashing, which is not the same as a nation failing due to resource scarcity.

   10. Goal: Maintain stability for existing users (citizens) by strict capacity enforcement: 
       - Clean? This is the goal of load shedding.

   Now, residue report:
   Hardin's argument is essentially a load-shedding strategy: when overload is imminent, reject new requests to protect the system.

   However, the moral urgency that Hardin claims is not captured by the technical framework. The framework is amoral: it is about preserving system function. Hardin is making a normative claim that the lifeboat (wealthy nation) has no obligation to take on more than its capacity and that doing so would be catastrophic for everyone.

   But note: in distributed systems, we have fairness metrics? Not always. We might shed load randomly or by priority. Hardin's argument is that there is no fair way to distribute the load because the system will collapse. So he is arguing for a form of priority: existing users over new ones.

   The residue: 
   - The framework does not have a built-in fairness metric. We can add one (e.g., fair queueing, weighted fairness) but that is a design choice. Without it, the system defaults to self-preservation.
   - However, Hardin is smuggling in the normative claim that the wealthy nation has no obligation to help, and that helping would be counterproductive. The technical framework doesn't say anything about obligations; it only says that if you exceed capacity, the system fails.

   Also, note: in distributed systems, we often design for elasticity (scaling up) or for graceful degradation (reducing service quality for all to avoid failure). Hardin rules out scaling (he assumes fixed capacity) and degradation (he says taking on more leads to total failure). So the argument assumes that scaling is not possible and that degradation is not an option (only total failure or no degradation).

   Residue verdict: 
     The moral urgency is partly due to the framework missing a fairness metric (because without fairness, we default to self-preservation). But more importantly, Hardin is smuggling in normative claims that have no counterpart in the technical framework: 
       1. The wealthy nation has no moral obligation to help (which is a normative claim about duty). 
       2. That the capacity cannot be increased (scaling) and that there is no possibility of graceful degradation (shared sacrifice) that could allow some help without total failure.

   Therefore, the residue is that Hardin's argument is not just load-shedding; it is load-shedding combined with a set of normative assumptions and a rejection of alternative strategies (like scaling or graceful degradation) that might allow helping without collapse.

   Now, the JSON:

   clean_maps: 
     - "Wealthy nations as independent systems"
     - "Fixed carrying capacity as queue depth/max concurrency"
     - "Migration requests as load"
     - "Accepting beyond capacity leading to crash"
     - "Load shedding to reject requests when at capacity"
     - "Backpressure not applicable due to unresponsive source"

   distortions:
     - "Poor nations as request sources (distortion because of human context, but load is clean)"
     - "Circuit breakers (used to block sources, but in lifeboat it's not a failing dependency but an external source)"
     - "Graceful degradation (used to describe poor nations, but in systems it's a response strategy, not a state)"

   missing_claims:
     - "Moral obligation: the wealthy nation has no duty to help (no technical counterpart)"
     - "Impossibility of scaling (increasing capacity) or alternative strategies like graceful degradation (shared sacrifice) in the lifeboat scenario"

   residue_verdict: 
     "Hardin's moral urgency is partly due to the absence of a fairness metric in the load-shedding framework (leading to self-preservation as the default), but primarily he smuggles in normative claims about obligation and rejects scaling/alternatives that lack a direct technical analogue."

   Let's structure the JSON:

   {
     "clean_maps": [
       "Wealthy nations as independent systems with fixed capacity",
       "Migration as load that can exceed capacity",
       "Overload leading to system crash",
       "Load shedding as the mechanism to avoid crash",
       "Backpressure not applicable (source unresponsive)"
     ],
     "distortions": [
       "Circuit breakers (analogy to blocking sources, but not a failing dependency)",
       "Graceful degradation (used to describe poor nations, not as a mitigation in the lifeboat)"
     ],
     "missing_claims": [
       "Moral claim: no obligation to help",
       "Assumption that capacity scaling is impossible",
       "Rejection of graceful degradation (shared sacrifice) as an alternative"
     ],
     "residue_verdict": "Hardin's moral urgency stems from both the technical framework's lack of fairness metrics (defaulting to self-preservation) and the introduction of normative claims (no obligation, impossibility of scaling/alternatives) that have no counterpart in load-shedding."
   }
answer: |-
  ### Restatement of Lifeboat Ethics in Distributed Systems Terms

  **Core Argument Restated:**  
  Wealthy nations operate as isolated service instances with a fixed **queue depth** (carrying capacity). Poor nations represent unthrottled client requests from a failing system (resource exhaustion). Admitting them risks **exceeding queue depth**, triggering catastrophic failure (sinking). To maintain stability, wealthy nations must:  
  1. Enforce strict **load shedding** (reject migrants).  
  2. Treat poor nations as **circuit breaker**-tripped zones (block all requests).  
  3. Avoid **backpressure** reliance (no scalable feedback to source systems).  
  4. Prevent **graceful degradation** (no equitable resource sharing—preserve QoS for existing users).  

  ---

  ### Mapping Evaluation  
  | Concept               | Mapping Status      | Reasoning                                                                 |  
  |-----------------------|---------------------|---------------------------------------------------------------------------|  
  | Fixed carrying capacity | **Clean**           | Direct match to queue depth/instance capacity limits.                     |  
  | Overload → Catastrophe | **Clean**           | Exceeding capacity causes systemic collapse (no elasticity).              |  
  | Migrants as requests  | **Distortion**      | Humans ≠ stateless requests; moral weight ignored by load shedding.       |  
  | Rich nations as nodes | **Clean**           | Isolated, capacity-bound systems (no auto-scaling).                       |  
  | Poor nations as zones | **Distortion**      | Portraying nations as "circuit broken" oversimplifies root causes.        |  
  | No resource sharing   | **Clean**           | Graceful degradation rejected—QPS reserved for privileged users.          |  
  | Obligation rejection  | **No Analogue**     | Ethical duty absent in queue management (amoral by design).               |  
  | Capacity immutability | **Distortion**      | Assumes scaling impossible; ignores elasticity/cooperative scaling.       |  

  ---

  ### Residue Report  
  **Is Hardin just "load shedding with extra steps"?**  
  - **Partial match**: Load shedding/queue depth map cleanly to capacity limits and rejection logic.  
  - **Critical deviations**:  
    1. **Fairness metric gap**: Load shedding prioritizes *system survival*, not fairness. Hardin’s "no obligation" claim injects normative bias absent in engineering (e.g., no equivalent to "citizens > migrants" priority tiers).  
    2. **Smuggled normativity**:  
       - Assumes capacity is static (no scaling/redistribution).  
       - Equates systemic risk with moral imperative (overload = justification).  
       - Dismisses cooperative mitigation (e.g., backpressure as aid/investment).  
  - **Verdict**: Hardin’s "moral urgency" is **load shedding + smuggled normative claims**. Engineering frameworks lack ethical operators—his argument relies on unchallenged premises (no duty to scale, migrants as destructive load).  

  ---

  ### JSON Output  
  ```json
  {
    "clean_maps": [
      "Fixed carrying capacity as queue depth",
      "Overload leading to systemic failure",
      "Wealthy nations as isolated service instances",
      "Rejection of graceful degradation (preserve QoS for incumbents)"
    ],
    "distortions": [
      "Migrants as stateless requests (ignores agency/moral weight)",
      "Poor nations as circuit-broken zones (oversimplifies causality)",
      "Capacity immutability (ignores scaling/cooperation potential)"
    ],
    "missing_claims": [
      "Moral obligation to assist (no 'duty' metric in load shedding)",
      "Inherent human value (requests lack ethical weight)",
      "Scalability via cooperation (e.g., backpressure as aid)"
    ],
    "residue_verdict": "Hardin's moral urgency combines valid load-shedding mechanics with smuggled normative claims (static capacity, no duty) that lack engineering analogues."
  }
  ```
