answer: |-
  Here is a Petrarchan sonnet crafted to your precise specifications, embodying the conceptual tension between cosmic absurdity and fragile relational meaning:

  **The Unsecured Frame**

  The vacant skies return no reasoned word,  
  No echo to the hunger we project.  
  We build our fragile glass in the absurd,  
  Demanding sense the deaf expanse rejects.  
  This silence mocks the purpose we assert,  
  Where every local aim, though fiercely held,  
  Seems undermined, a structure prone to hurt  
  By that vast void its worth is doomed to meld.

  Yet still, a fragile fit may manifest—  
  Not in the star’s indifferent, distant gaze,  
  But where attraction, drawn to what seems best,  
  Meets value’s claim in unillumined ways.  
  This trembling wire, spanning the unseen rift,  
  Holds meaning only if we trust the gift  
  Of norms unsanctioned, anchoring the frame  
  That makes the fit, and lights the fragile flame.

  **Its structure suspends meaning in a relation sustained by norms the cosmos ignores.**

  ---

  **Breakdown of How the Sonnet Meets Your Requirements:**

  1.  **Octave (Lines 1-8 - ABBA ABBA - Absurdism):**
      *   Lines 1-2: Cosmic silence/non-response ("vacant skies," "no reasoned word," "no echo," "deaf expanse rejects").
      *   Lines 3-4: Human demand for meaning projected onto the indifferent ("hunger we project," "Demanding sense").
      *   Lines 5-8: The undermining risk ("mocks," "undermined," "prone to hurt," "doomed to meld") to local projects ("fragile glass," "local aim," "structure," "worth") due to the cosmic void ("vast void").
      *   Rhymes: word/project/reject (A), absurd/held/meld (B) - capturing the conflict (project/reject, absurd/meld).

  2.  **Volta & Sestet (Lines 9-14 - CDECDE - Relational "Fit" & Fragility):**
      *   **Line 9 (Volta):** "Yet still, a fragile fit may manifest—" - Sharp turn introducing the relational counter-move. The word "fragile" immediately signals instability.
      *   **Lines 9-11:** Defines the relational fit: "attraction, drawn to what seems best" (subjective) meets "value’s claim" (objective), occurring locally, not cosmically ("Not in the star’s... gaze").
      *   **Lines 12-14:** Exposes the fragility and dependency:
          *   "unillumined ways" - Lack of cosmic validation.
          *   "trembling wire, spanning the unseen rift" - The precarious nature of the connection (fit) over the absurd gap.
          *   "Holds meaning only if we trust the gift / Of norms unsanctioned" - The crucial dependency: the normative framework ("norms") that makes the fit possible is itself "unsanctioned" by the cosmos. Meaning *requires* this embeddedness ("anchoring the frame") which the universe ignores.
          *   "lights the fragile flame" - Meaning is contingent and vulnerable, dependent on the unsecured frame.
      *   **Rhyme Scheme & Conceptual Pairing:**
          *   CDECDE: manifest/best/rift (C), gaze/ways/held (D), gift/flame (E). The 'E' rhyme (gift/flame) emphasizes the contingency.
          *   **Key Conceptual Pair Across Volta:** "void" (Line 8, Absurdism) rhymed with "avoided" conceptually through "manifest" (Line 9, Relational). The fit "manifests" *despite* the void, but crucially does not *avoid* the underlying absurdity or the dependency on unsanctioned norms. "Indifferent" (Line 10) is paired conceptually (via the sestet's argument) with "different" (the relational move *is* different from simple cosmic appeal, but its foundation is still indifferent).

  3.  **Final Line:** "Its structure suspends meaning in a relation sustained by norms the cosmos ignores." - This directly summarizes the core structural move of the volta and the sonnet: meaning is relocated to a *relation* (subjective attraction + objective worth), but this relation is *suspended* (not grounded or secured) because it depends entirely on normative frameworks ("norms") that exist without cosmic support or denial ("the cosmos ignores").

  4.  **Accuracy & Tone:**
      *   The octave clearly evokes Camus (the indifferent universe, the human demand, the absurd as a clash/rift).
      *   The sestet captures Wolf's core idea of meaning arising from the confluence of subjective attraction ("drawn to what seems best") and objective value ("value’s claim"), presented as a "fit."
      *   The fragility ("fragile fit," "trembling wire," "fragile flame") and the dependency on "norms unsanctioned" precisely articulate how this relational move does *not* dissolve the absurdist challenge but exposes a new layer of contingency. The universe's indifference remains.
      *   The tone is analytical and serious, using precise metaphors ("fragile glass," "trembling wire," "unsanctioned frame," "fragile flame") without sentimentality. It presents the tension without resolution.

  5.  **Formal Closure vs. Conceptual Openness:**
      *   The Petrarchan form is strictly adhered to (meter, rhyme, volta position).
      *   The final couplet (gift/flame) offers a kind of formal resolution.
      *   However, the *content* of that resolution ("norms unsanctioned," "fragile flame," "cosmos ignores") ensures the *conceptual* tension remains wide open. The sonnet ends with meaning present but profoundly vulnerable and dependent on something fundamentally unsecured by the universe. The formal closure ironically underscores this conceptual lack of final security.
