  ## The Catalog

  **Cogito Ergonomics Ltd. – Precision Tools for Discerning Minds**

  For over forty years, Cogito Ergonomics has been the trusted supplier of professional-grade cognitive apparatus to academia’s leading thinkers. Our patented Intuition Pump™ line represents the pinnacle of engineered clarity, distilling complex conceptual challenges into manageable, intuition-friendly scenarios. Manufactured to exacting tolerances in our Basel workshops, each pump guarantees reliable output, minimizing cognitive friction and maximizing argumentative yield. Why wrestle with messy reality when you can deploy a Cogito Pump™?

  **Featured Products:**

  1.  **The Cogito Trolley System Mk. V (CTS-5)**
      *   **The Gold Standard in Moral Calibration:** Our flagship model! Features a meticulously landscaped diorama with one (1) main track, one (1) spur track, five (1) static, non-descript workers on the main line, and one (1) static, non-descript worker on the spur. Includes one (1) high-inertia, frictionless runaway trolley (batteries included).
      *   **Precision Engineered Moral Salience:** Crucially, the five workers are positioned *just so*, ensuring their collective fate feels viscerally weightier than the lone spur worker. The spur lever is ergonomically designed for effortless throwing, minimizing hesitation artifacts.
      *   **Guaranteed Output:** Engineered to isolate the "greater good" lever-pulling intuition with >99% reliability. *Patent-pending Moral Irrelevance Filters* pre-installed scrub distracting details – no names, relationships, backstories, or distracting scenery included!
      *   **Specifications:** Diorama: 18" x 12". Tracks: Stainless Steel. Workers: Durable Polymer. Levers: Anodized Aluminum. Weight: 3.2 lbs.
      *   **Accessories:** Spare Trolley Pack (STP-1), Fat Man Attachment Kit (FMA-1, compatibility requires CTS-5 Deluxe), Knob-Tightening Kit for "Proximity" Adjustment (KTK-P).

  2.  **The Experience Chamber™ (EC-1)**
      *   **Definitive Reality Assessment:** Need to know if anyone *truly* values truth over contentment? Look no further. The EC-1 simulates a perfect, undetectable life of pleasure and achievement. Simply step into the padded chamber, connect the neural jacks (included), and let our proprietary algorithm generate bliss.
      *   **Pre-Loaded Disengagement:** Ships with the "Would you plug in?" intuition pre-calibrated. The chamber’s slightly clinical exterior and the prominent "REALITY FEED" disconnect switch (glows reassuringly red) subtly reinforce the desirability of the unplugged state. All messy variables concerning *which* pleasures or *whose* reality are expertly excluded – focus solely on the pure binary!
      *   **Specifications:** Chamber Dimensions: 6' x 4' x 6'. Neural Interface: Plug-n-Play, standard ports. Reality Disconnect Switch: Oversized, illuminated. Power: Standard 110V. Weight: 220 lbs. (Shipping pallet required).

  3.  **Mary's Room™ Perception Module (MRP-2)**
      *   **Qualia in a Box, Guaranteed:** Settle the knowledge argument once and for all! The MRP-2 features a self-contained, monochromatic environment (all surfaces matte grey) and one lifelike resident figure ("Mary"). Mary arrives pre-loaded with exhaustive physical knowledge of color vision.
      *   **"Just Add Water" Revelation:** Simply open the external hatch (clearly labeled "First Exposure to Color - DO NOT OPEN UNTIL READY") to flood the room with vivid red light. Observe Mary's pre-programmed expression of astonishment. The intuitive leap – "Ah, *new* knowledge!" – is factory-installed and virtually inescapable.
      *   **Seamless Epistemic Transition:** The module’s sealed design ensures no prior color contamination. The starkness of the room and the specificity of Mary's knowledge base prevent distracting questions about other sensory experiences or incomplete neuroscience.
      *   **Specifications:** Room Dimensions: 4' cube. Mary Figure: High-detail polymer. Hatch Mechanism: Air-tight seal. Light Source: 650nm (Pure Red). Weight: 85 lbs.

  4.  **The Plug-In Philosopher™ Bodily Autonomy Demonstrator (PP-BAD)**
      *   **Clarity Through Constraint:** Based on the acclaimed circulatory argument! Includes one (1) fully articulated, life-sized model of a renowned violinist and one (1) adjustable hospital bed with integrated life-support tubing. The user-position is ergonomically designed to maximize the sensation of physical imposition.
      *   **Engineered Entanglement:** The violinist's tubing connects via a proprietary, slightly uncomfortable chest-plate interface ("You are the dialysis machine!"). The nine-month timer is prominently displayed in large, ticking digits. Unplugging requires deliberate force, activating a subtle but distinct "moral severance" haptic feedback.
      *   **Focuses the Argument:** Pre-sets the core intuition of bodily violation overriding general beneficence. All context regarding the violinist's character, how they got plugged in, or alternative solutions is rigorously excluded by design.
      *   **Specifications:** Violinist: Realistic silicone. Bed: Steel frame, vinyl upholstery. Tubing: Medical-grade polymer. Timer: Digital, 0-9 month countdown. Chest-plate: Contoured polymer. Weight: 150 lbs.

  **Essential Accessories:**

  *   **Knob-Tightening Kit (KTK Universal):** Fine-tune scenario parameters! Adjust "personal connection," "physical distance," "immediacy," and "certainty" dials until your intuition "pops" cleanly. Comes with tamper-proof seals to lock in the optimal setting.
  *   **Intuition Stabilization Brackets (ISB-4):** Prevent wobble or drift when confronting counter-pumps or awkward re-descriptions. Bolts securely to most Cogito Pump™ housings.
  *   **Conclusion Cache Cartridge (CCC-1):** Pre-loaded with common philosophical conclusions ("Dualism Confirmed!", "Utilitarianism Qualified!", "Bodily Rights Paramount!"). Simply insert into the designated slot on compatible pumps (CTS-5 Deluxe, MRP-2, PP-BAD) – the pump runs the scenario and outputs the conclusion, ready for the user's ratification as their "own reasoned judgment."

  **Testimonial:**

  *"Before Cogito, my seminars were chaos. Students would get bogged down in irrelevant details, imagine alternative scenarios, or – heaven forbid – question the framing! The CTS-5 and EC-1 changed everything. Now, the intuitions arrive crisp, clear, and perfectly aligned with the lecture points. The Knob-Tightening Kit is indispensable; I dial down 'empathy' and dial up 'impersonal mechanism' until even the skeptics see the light. It's like the arguments run themselves! Five stars."* – Prof. Thaddeus Sharp, Stonewell College Philosophy Dept.

  **Cogito Ergonomics Ltd.: Engineering Clarity, One Intuition at a Time. Satisfaction Guaranteed or Your Cognitive Dissonance Refunded!**

  ---

  ## Shop Notes

  This catalog satirizes common methodological criticisms of thought experiments ("intuition pumps") by depicting them as literal, manipulable machines. Each product highlights a specific critique:

  1.  **Cogito Trolley System Mk. V:** Critiques the **artificial simplification and pre-selection of salient features**. The boast about "Moral Irrelevance Filters" and pre-set worker weights mirrors claims that trolley problems strip away morally relevant context (relationships, histories, character) and engineer the "obvious" intuition (lever-pulling is permissible) by controlling salience (five vs. one) while hiding the framing itself as neutral. Accessories like the Fat Man kit critique how minor variations often produce wildly different intuitions, suggesting instability.
  2.  **Experience Chamber™ (EC-1):** Critiques **pre-loaded conclusions and the suppression of relevant alternatives**. The "Pre-Loaded Disengagement" and focus on a pure "truth vs. happiness" binary satirize how Nozick's scenario is designed to make rejection seem obvious by excluding plausible reasons *for* plugging in (e.g., mitigating real-world suffering, specific desirable experiences) and presenting the choice unrealistically starkly. The clinical design discourages imagining richer plugged-in scenarios.
  3.  **Mary's Room™ Perception Module (MRP-2):** Critiques the **"just add water" illusion of revelation**. The sealed room and pre-programmed Mary represent the criticism that Jackson's scenario *assumes* what it needs to prove: that Mary gains genuinely new *knowledge* (not just a new *mode* of access or ability) upon seeing red. The setup prevents questioning whether physical knowledge *could* include phenomenal aspects or if the "astonishment" signifies new propositional knowledge. It highlights the risk of begging the question via narrative.
  4.  **Plug-In Philosopher™ Bodily Autonomy Demonstrator (PP-BAD):** Critiques the **power of framing and metaphor**. The uncomfortable chest-plate and ticking timer embody the critique that Thomson's violinist scenario gains its force primarily from the vivid, bodily "plugged-in" metaphor and the specific timeframe. It suggests the intuition depends crucially on *how* the constraint is described (bodily violation) rather than the abstract principle itself, potentially obscuring other relevant factors (e.g., the violinist's innocence, societal duty).
  5.  **Accessories (KTK, ISB, CCC):** Critiques the **manipulability and goal-oriented nature** of pumps. The Knob-Tightening Kit satirizes adjusting scenarios until the "right" intuition appears. Stabilization Brackets mock attempts to shield favored pumps from counter-examples or re-descriptions. The Conclusion Cache Cartridge bluntly depicts the fear that thought experiments often function not as discovery tools but as delivery mechanisms for pre-determined conclusions, seeking ratification.

  **Least Fair Jab:** The **Conclusion Cache Cartridge (CCC-1)** is arguably the least fair. It depicts thought experiment users as passively accepting pre-loaded conclusions without genuine engagement. Defenders would argue that even engineered scenarios serve as *probes* for uncovering tensions within our concepts or commitments, *initiating* argument rather than ending it. A well-designed pump, they contend, doesn't force a conclusion but renders a conceptual conflict vivid, prompting deeper analysis and refinement of principles – the intuition is *evidence* of a conceptual tension, not the final word. The satire ignores this potential for pumps to be starting points for dialectical reasoning, not merely conclusion-delivery devices.

  **Strongest Defense Undermining the Satire:** The most compelling defense is that **thought experiments, even when engineered, can reveal necessary truths about our concepts or constitutive commitments.** If we are investigating the *concept* of "knowledge," "justice," or "personal identity," our intuitions about hypothetical scenarios are directly relevant data points about how those concepts function for us. A pump like Mary's Room, critics of the satire would argue, doesn't *assume* dualism; it reveals that our concept of phenomenal knowledge seems irreducible to physical knowledge, demanding an explanation that either revises the concept or accepts non-physical properties. The "engineering" ensures we're consulting the relevant concept in a purified form, free from distracting real-world noise. This defense argues that intuitions, carefully elicited, *are* legitimate evidence in conceptual analysis, making the "pump" a valid tool, not just a manipulative gadget.
