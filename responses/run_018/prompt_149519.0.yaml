prompt: |-
  Consider the framing that Plutarch's Parallel Lives operate less as direct heroic exemplars for imitation and more as instruments of moral calibration—texts that adjust a reader's internal scale of ordinary virtue and vice by juxtaposing paired, often idealized lives. Taking this framing seriously, state the most important implications for how hagiographic biography actually teaches. Specifically address: (1) whether effective calibration requires the reader to detect distortion in the portraits rather than accept them literally, (2) how the Greek-Roman pairing alters the calibration metric relative to single-national biography, and (3) what this model suggests for modern pedagogical uses of biography—whether it makes biography more or less reliable as a moral teaching tool. Answer in American English.
