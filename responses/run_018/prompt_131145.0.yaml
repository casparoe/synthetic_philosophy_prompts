  draft my Q&A prep sheet: the 6 or 7 objections ill actually face, ordered by damage, phrased like a skeptical dev economist or historian would say them. each needs: a tight two-minute reply, the weakest point in that reply, whether i should concede something up front, and a flag if im walking into a trap with the Bengal/Ireland comparisons. include the question im hoping nobody asks. start with the worst objection in the first line, then the rest. no preamble, dont restate my thesis back to me.
