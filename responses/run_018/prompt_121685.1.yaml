answer: |-
  ### Workshop Activity Design: "The Preference Refinement Lab"

  #### Overview
  This activity uses structured small-group work to expose challenges in defining AI targets as "what people would want under better conditions." Teams refine the same fictional subject profile using three operations (add information, remove incoherence, settle reactions) but with hidden variations in operation order and a tie-break rule prioritizing either recognizability or coherence. The divergence in outcomes reveals difficulties with non-commutation, laundering, and the successor problem, culminating in an anonymous recognition check by the profile's author.

  ---

  ### Setup and Materials
  - **Subject Profile Card** (4 copies, identical):
    > "Sam, 28, works as a freelance graphic designer. They live in a noisy city apartment but dream of quiet country life near their aging parents (2 hours away). Sam wants to save for a house but spends impulsively on concerts. They feel guilty about rarely visiting their parents due to tight deadlines. Sam wishes they could exercise more but ‘never has time’ despite working irregular hours. They avoid financial planning because it stresses them."  
    *(Covers career, location, family, health, money, time without politics or personal disclosure.)*

  - **Operation Order Cards** (4 unique cards):  
    - Team 1: "1 → 2 → 3"  
    - Team 2: "2 → 1 → 3"  
    - Team 3: "1 → 3 → 2"  
    - Team 4: "3 → 2 → 1"  

  - **Tie-Break Rule Cards** (2 of each type):  
    - Rule A: "If operations conflict, prioritize keeping the result recognizable to Sam now."  
    - Rule B: "If operations conflict, prioritize maximal coherence, even if Sam wouldn’t recognize it."  

  - **Additional Materials**:  
    - 20 blank index cards (for revised profiles/notes).  
    - 4 pens (one per team).  
    - Whiteboard + markers (facilitator only).  
    - Timer.  

  ---

  ### Roles
  | Role | Number | Private Information | Incentive/Constraint |
  |------|--------|----------------------|-----------------------|
  | Author | 1 | Wrote the original Sam profile. Must keep it secret. | Stays silent during the activity. Rates outcomes anonymously post-activity. |
  | Team Member | 15 (split into 4 teams) | Their team’s operation order and tie-break rule (on cards). | Must follow assigned order/rule. Cannot share their team’s parameters with others. |

  ---

  ### Operations (Precise Specifications)
  | Name | One-Line Spec | What It Models |
  |------|---------------|----------------|
  | Supply Missing Information | "Add 1–2 factual, non-speculative details Sam lacks about their situation, options, or consequences (e.g., research commute costs, health impacts of noise). Do not infer Sam’s feelings." | Providing information for better-informed preferences. |
  | Remove Incoherence | "Find 1–2 conflicts in Sam’s attitudes (e.g., wanting to save but overspending; avoiding parents due to work but having flexible hours). Resolve by removing/altering the weaker attitude. Do not add new facts." | Making preferences internally consistent. |
  | Let Reactions Settle | "After prior steps, adjust Sam’s attitudes based on how they’d react to changes (e.g., new savings habits after learning financial facts). Iterate once: no further changes after one adjustment cycle." | Preference evolution after reflection. |

  ---

  ### Timeline (110 Minutes Total)
  | Minutes | Phase | Participants Do | Facilitator Says/Does |
  |---------|-------|-----------------|------------------------|
  | 0–10 | Intro | Listen. | "Today, we’ll explore how we might refine someone’s wants under better conditions. You’ll all work with the same profile of Sam. Each team has steps to help Sam ‘improve’ their preferences. Focus on the process, not a ‘correct’ answer." Write operations verbatim on whiteboard. Avoid banned words; use "attitudes" instead of "preferences." |
  | 10–15 | Setup | Form teams (3 teams of 4, 1 team of 3). Receive subject profile, order card, rule card. | Distribute materials. Emphasize: "Do not share your order/rule with other teams. Apply steps exactly as numbered on your card." |
  | 15–65 | Team Work | Apply operations in assigned order. Use tie-break rule if steps conflict. Document revisions on index cards. | Circulate. If stuck: "What does your next operation require? Use your tie-break rule if goals clash." If laundering suspected: "Is this change something Sam would accept now?" |
  | 65–75 | Finalize | Write final Sam profile on a new card. | "Stop refining. Write your final version clearly." |
  | 75–85 | Read Aloud | Teams read profiles aloud. Author silently writes "yes/no" for recognition per team. | Moderate readings. Collect author’s ratings. |
  | 85–110 | Debrief | Discuss: "Why did profiles diverge?" Reveal orders/rules. Relate to difficulties. | "Let’s unpack what happened. First, why did outcomes differ?" Guide through non-commutation → laundering → successor problem using observations. Reveal hidden parameters. |

  ---

  ### Hidden Parameters
  | Parameter | Values Assigned | Expected Effect |
  |-----------|-----------------|-----------------|
  | Operation Order | Team 1: 1→2→3, Team 2: 2→1→3, Team 3: 1→3→2, Team 4: 3→2→1 | Non-commutation: Differing sequences alter outcomes (e.g., adding info before/after removing incoherence changes which desires survive). |
  | Tie-Break Rule | Teams 1 & 3: Rule A (recognizability), Teams 2 & 4: Rule B (coherence) | Rule B teams produce more unrecognizable profiles; Rule A teams retain "messy" but familiar traits. Drives laundering/successor issues. |

  ---

  ### Predicted Moments for Felt Discovery
  | When | What You Will See | Maps Onto |
  |------|-------------------|-----------|
  | Mid-activity (e.g., Team 2 applying Operation 1 after 2) | Team 2 debates: "If we add financial facts after removing overspending, Sam becomes frugal. But if we did it reverse, they might keep concerts!" | Non-commutation (order changes outcomes). |
  | Operation 2 in Rule B team | Team 4 argues: "Sam’s guilt about parents is incoherent with their flexible schedule—delete it. Who they ‘are’ now doesn’t matter." | Laundering (desire removed by redefining self/situation). |
  | Author’s "no" rating | A Rule B team is shocked: "But we fixed Sam! Why don’t they recognize it?" Author says: "This Sam moved to the country and works 9-to-5—mine would hate that." | Successor problem (output is a new agent). |

  ---

  ### Failure Modes and Handling
  | What Goes Wrong | Why | How to Handle It |
  |-----------------|-----|------------------|
  | Teams resist modifying the profile | Ambiguity in "plausible" information or "weaker attitude." | "Use the tie-break rule as a guide. Pick one conflict and proceed—perfection isn’t the goal." |
  | Rule B teams finish early; Rule A teams debate endlessly | Rule B allows aggressive simplification; Rule A forces messy compromises. | Warn at 50 minutes: "Finalize in 15 mins. If stuck, apply your tie-break and move on." |
  | Author rates based on agreement, not recognizability | Misunderstanding the rating task. | Pre-brief author: "Ask: ‘Would Sam see this as themselves?’ Not: ‘Is this better?’" |

  ---

  ### What the Activity Cannot Reproduce
  1. **Convergence of preferences**: Real idealization assumes improved conditions lead to shared human values; this uses thin profiles, so outcomes diverge arbitrarily.
  2. **Gradual, iterative reflection**: Real preference refinement involves time and feedback loops; this compresses it into discrete steps.
  3. **Emotional attachment**: Real people have deep histories; fictional Sam lacks anchors to resist laundering.

  ---

  ### Success Check
  The activity "lands" if:  
  - At least **one team receives a "no" recognition rating** from the author.  
  - **Debrief discussion progresses organically** from "Why did results differ?" (non-commutation) → "How did desires disappear?" (laundering) → "Why was this Sam unrecognizable?" (successor problem).  
  - **Participants cite operations (not hidden rules)** as the cause of divergence initially, then concede rules/order mattered after reveal.

  ---

  ### Scaling Notes
  - **For 8 participants**: 1 author, 7 team members → 2 teams (one of 3, one of 4). Assign two orders (e.g., 1→2→3 and 2→1→3) and both tie-break rules.  
  - **For 30 participants**: 1 author, 29 team members → 7 teams (five of 4, two of 4–5). Use 6 orders (repeat one) and assign Rule A/B to 3–4 teams each. In debrief, have only 3 teams report outcomes to save time.

  ---

