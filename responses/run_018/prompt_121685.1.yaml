  Detailed timeline:

  Minutes 0-10 (10 min):
  - Facilitator introduces the activity: "Today we are going to explore how we might imagine what someone would want if they had more information and were more consistent in their thinking. We'll do this by working on a profile of a fictional person. Each team will apply the same set of operations to the same starting profile, but with different instructions about how to proceed. Your goal is to produce a revised profile of the person after applying the operations. Remember, we are not debating what the right answer is, but experiencing the process."

  - Facilitator writes the three operations on the whiteboard (without using the forbidden words). For example:

    Operation 1: "Add missing information: Give the subject at least one new piece of factual information that she doesn't currently know about her situation, her options, or the consequences of her choices. This must be plausible and based on real-world facts."

    Operation 2: "Remove conflicts in attitudes: Find at least one place where the subject's wants or aversions clash (for example, wanting two things that can't happen together, or avoiding something that is needed for a more important want). Resolve the conflict by adjusting or removing the less important attitude."

    Operation 3: "Let reactions settle: After changes from the previous operations, imagine how the subject would react. Adjust her attitudes accordingly (for example, she might change her mind about a goal, or form a new preference) until no more changes happen in one round of thinking."

  - Facilitator says: "Each team will be given the order in which to apply these three operations. Also, each team will have a rule to follow when they face a conflict between keeping the profile recognizable to the current subject and making it more coherent. That rule will tell you which to prioritize."

  Minutes 10-15 (5 min):
  - Form 4 teams (three of 4 and one of 3). Assign each team to a workspace.
  - Distribute: 
      - Each team gets a copy of the subject profile (same for all).
      - Each team gets an operation order card (secretly, each team a different order).
      - Each team gets a tie-break rule card (secretly, two teams get Rule A, two get Rule B).

  Minutes 15-70 (55 min):
  - Teams work on applying the operations to the subject profile in the given order, using the tie-break rule when needed.
  - Facilitator circulates, answers questions (without giving content guidance), and ensures teams are on task. If a team is stuck, the facilitator can ask: "What does your operation order tell you to do next?" or "Remember your tie-break rule when you face a conflict."

  Minutes 70-80 (10 min):
  - Teams finalize their revised profile and write it on an index card.

  Minutes 80-90 (10 min):
  - Each team reads their revised profile aloud to the whole group. The author (who has been sitting aside) listens and, after each reading, writes on a card: for that team, whether they recognize it as a version of the subject they wrote (yes/no). The author does not speak.

  Minutes 90-110 (20 min):
  - Debrief: Facilitator leads a discussion.

  Debrief points (in the order of felt discovery):

  1. **Non-commutation:** Ask teams to share their final profiles. Note differences. Ask: "Why do you think the profiles turned out differently?" Participants will likely mention the operations. Then ask: "Did the order of operations matter? How?" Then reveal that the orders were different. Highlight two teams that had the same tie-break rule but different orders and ended up with different profiles. Point: The operations do not commute.

  2. **Laundering:** Ask: "Were there any desires that disappeared? How did that happen?" Then: "Did anyone feel that they were removing a desire not because it didn't survive the operations, but because it seemed like an artifact?" Point to a team that used Rule B and might have removed a core desire. Ask: "What rule were you following? How did that affect your choices?" Point: Sometimes we remove a desire by re-describing the situation or the self, which is a form of laundering.

  3. **The successor problem:** Ask: "Look at the profiles that the author did not recognize. What about them made them unrecognizable?" Then: "Did any team end up with a profile that seems like a different person? One that the current subject might not only disagree with, but not even feel connected to?" Point: After enough changes, we might have created a successor agent whose concerns are not those of the original subject.

  Finally, reveal the hidden parameters: show the operation orders and tie-break rules.

  **Predicted Moments:**

  - When: During team work, especially when applying operation 2 (remove incoherence) after operation 1 (add info) or vice versa.
    What you will see: Teams struggling with whether to remove a desire that conflicts with new information or to adjust the information to preserve the desire. Also, teams might argue about what the subject would do after the changes (operation 3).
    Maps onto: Non-commutation (because the order changes the outcome).

  - When: During the remove incoherence step in a team with Rule B.
    What you will see: A team might remove a desire that is central to the subject because it conflicts with a more coherent set of attitudes, even if it makes the profile unrecognizable.
    Maps onto: Laundering.

  - When: At the end, when teams read profiles and the author rates them.
    What you will see: One or more teams produce a profile that the author does not recognize. The team might be surprised because they thought they were following the operations faithfully.
    Maps onto: The successor problem.

  **Failure Modes:**

  1. What goes wrong: Teams get stuck on what information to add or how to remove incoherence.
     Why: The operations might be ambiguous in practice, despite the specifications.
     How to handle it: Facilitator circulates and asks: "What does the operation ask you to do? What are the facts of the case? What does your tie-break rule say?" Encourage them to make a choice and move on.

  2. What goes wrong: Teams finish early or run late.
     Why: Some teams might have an easier order or fewer conflicts.
     How to handle it: For early finishers, ask them to consider if they applied the operations correctly and to write down their reasoning. For late teams, give a 5-minute warning and ask them to wrap up.

  3. What goes wrong: The author might be biased or not understand their role.
     Why: The author wrote the profile and might rate based on what they think is best rather than recognizability.
     How to handle it: Explain to the author: "Your job is not to judge which outcome is better, but to say for each revised profile whether the subject, as you originally conceived her, would recognize this as a version of herself. It's about resemblance, not agreement."

  **Cannot Reproduce:**

  - Convergence: In the idealized-preference debate, it is often assumed that if we improve information and coherence enough, people's preferences would converge. But in this activity, because we use a thin profile and the operations are applied arbitrarily (with different orders and tie-breaks), the outcomes diverge. We cannot show convergence.

  - The activity does not address how to aggregate preferences across individuals (it's only one subject).

  - The activity uses a fictional subject, so participants might not take it as seriously as real preferences.

  **Success Check:**

  The observable criterion is the author's recognition ratings. If at least one team produces a profile that the author does not recognize, and if the debrief discussion brings out the three difficulties (non-commutation, laundering, successor problem) in that order, then it landed.

  **Scaling Notes:**

  - For 8 participants: 
      - We can have 1 author and 7 participants for 2 teams (one of 4 and one of 3). 
      - We assign two different orders and two tie-break rules (one per team, but we can have two orders and two rules, so each team has both a unique order and a rule).

  - For 30 participants:
      - We can have 1 author and 29 participants for 7 teams (some of 4, some of 3 or 4). 
      - We assign 7 different orders (choose 7 out of 6? We have only 6 permutations, so some orders repeat) and two tie-break rules (so about half the teams with A, half with B). 
      - The debrief might take longer, so we might need to shorten the team work or have fewer teams present.

