answer: |-
  ## Scenario: The Ceremonial Gavel

  The Magistrate's Gavel, carved from a single block of ancient oak and invested with legal authority to open court sessions within a specific jurisdiction, is dropped during a ceremony, shattering into splinters too fragmented to reassemble its original form; later, the largest surviving fragment (containing the original oak grain but lacking the head's shape) is ritually reassembled with new wood to perfectly replicate the gavel’s original form and function, continuing its ceremonial role without interruption.

  ---

  ## Analysis

  1.  **First Transformation (Shattering):**
      *   **Constitution View:** Survives? **No.** The radical destruction of the specific material configuration constituting the gavel destroys it. The object (the *gavel-as-a-functional-legal-artefact*) is constituted by that particular matter-in-arrangement. Destroy the arrangement irreparably, destroy the constituted object. Splinters aren't a gavel.
      *   **Identity View:** Survives? **No.** The gavel is identical to its mass of oak atoms. Shattering scatters this mass. The scattered atoms are not identical to the intact gavel. The gavel ceases to exist.
      *   *Verdict:* **Agreement (Doesn't survive).**

  2.  **Second Transformation (Reassembly w/ New Matter):**
      *   **Constitution View:** Survives? **Yes.** A *new* constituted object (the functional-legal-artefact) comes into existence. It's constituted by the *new* hybrid matter (original fragment + new wood) in the *same* functional arrangement, inheriting the original's role and legal authority through ceremonial continuity. The object persists *as the office's gavel* by functional/relational continuity.
      *   **Identity View:** Survives? **No.** The gavel was identical to the *original specific oak atoms*. The reassembled object incorporates new matter and is missing some original matter. Since it's not identical to the original mass of atoms, it cannot be the original gavel. A new object exists.
      *   *Verdict:* **Disagreement.** Constitution: Survives. Identity: Doesn't survive.

  **The Driving Feature:** **Relational/Functional Properties & Modal Flexibility.** Constitution theory separates the object (defined by its functional role, historical origin, and relational properties like legal authority) from its underlying matter. The object can persist through changes in its constituting matter *if* its defining function/role persists. Identity theory rejects this flexibility; the object *is* the matter, so matter change (especially loss) entails non-identity and non-persistence. The core dispute is whether persistence conditions are grounded solely in matter (Identity) or also in higher-order properties like function, role, and historical continuity (Constitution).

  **Stripping the Feature:** If we remove the *functional/legal/ceremonial role* (e.g., it's just a generic wooden mallet), the reassembly case collapses. Both theories would likely agree the original mallet *doesn't* survive the reassembly with new matter – the Constitution view loses its persistence-grounding functional role, leaving only matter and arrangement, aligning it closer to the Identity view's material essentialism. This reverts to a standard "Ship of Theseus Light" puzzle focused purely on material continuity vs. form.

  **Identity Theorist's Attack:** The Identity theorist would **deny the premise that functional/ceremonial continuity can ground persistence *without* material identity.** They'd argue: "The reassembled object is a *different* gavel, a *replacement* or *replica*, mistakenly *called* the Magistrate's Gavel due to convention and legal fiction. Its functional role is inherited or reassigned, not proof of numerical identity. True persistence requires the literal spatio-temporal continuity of the original matter. The original gavel ceased to exist upon shattering; any subsequent object, no matter how similar or functionally equivalent, is distinct." They attack the Constitution view's core move of decoupling identity/persistence from material continuity via relational properties.
