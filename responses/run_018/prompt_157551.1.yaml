prompt: |-
  I'm a novelist writing a scene about a small-town board, but this is literally happening to me too. Our library can recieve funding for a kids' reading nook, except the donor—a developer fined for dumping asbestos—requires every board member to sign a form stating there was "no environmental harm," and we must stay silent about the fine. If I sign, I'm lying so children get books; if I refuse, the nook dies and they stay in a cramped basement. Is saying yes actually making me part of the cover-up, or is that too harsh? Don't give me generic ethics—just answer in exactly five numbered items, each a sentence or two, no intro or conclusion, and say whether walking away is truly cleaner or just self-righteous.
reasoning: |-
  Okay, the user is a novelist who's also dealing with a real ethical dilemma with their local library board. They need to decide whether to sign a form from a donor—a developer who was fined for asbestos dumping—that requires stating there was "no environmental harm" and staying silent about the fine. The trade-off is funding for a kids' reading nook versus potential complicity in a cover-up. 

  First, I need to understand their core conflict: they feel torn between helping children and compromising their integrity. The user specifically asked for no generic ethics, just five numbered points, so I have to be direct and structured. They also want to know if walking away is truly cleaner or just self-righteous, so I should address that head-on. 

  Breaking it down: Signing means lying on paper, which is legally risky and morally dubious. It directly helps the donor whitewash their reputation. Refusing might feel pure, but it abandons the kids to a bad situation. The user might be seeking validation that their discomfort is justified, or perhaps they want permission to choose the pragmatic route. 

  I'm considering the unspoken needs: guilt over "selling out," fear of legal fallout, or worry that refusing makes them an ineffective advocate. As a novelist, they might also be probing this for their story, so clarity on the real-world stakes matters. 

  Now, crafting the response: Five items, no fluff. Item 1 focuses on the lie itself—undeniable complicity. Item 2 highlights the donor's ulterior motive. Item 3 admits refusal hurts kids but avoids hypocrisy. Item 4 calls walking away cleaner because it rejects coercion. Item 5 distinguishes self-righteousness from integrity. 

  The tone must be firm but not judgmental. The user needs to feel heard, not lectured. Emphasize that both choices have costs, but one aligns with truth. No sugarcoating—they asked for bluntness.
answer: |-
  Here are your five points:

  1.  Signing the form stating "no environmental harm" when you know about the asbestos fine is a direct, written lie that actively aids the developer's cover-up effort.
  2.  Your signature provides the developer with documented "proof" of community exoneration they can leverage elsewhere, making you an instrument of their PR strategy.
  3.  Refusing to sign sacrifices the nook's funding, harming the children's immediate need, but avoids personal participation in the lie and coerced silence.
  4.  Walking away *is* cleaner: you reject being used to sanitize the developer's record and refuse to compromise your integrity under pressure.
  5.  Refusing isn't inherently self-righteous; it's upholding truth against coercion, though the cost to the kids is real and painful. Self-righteousness would be judging others *without* facing that same cost yourself.
