prompt: |-
  I'm a PhD student working at the boundary between philosophy and formal social choice, and I've been asked to run a two-hour graduate tutorial on Harsanyi's aggregation theorem for a mixed group of political theory and economics students. Most of them have taken one prior course in decision theory and can manipulate expected utility representations, but they have not studied social choice. I know the theorem myself, but I'm less confident about how to teach it well, so I'd like you to plan the teaching rather than give me the explanation. Please lay out the order in which the pieces must be introduced and what depends on what (for example, why the von Neumann–Morgenstern representation of preferences over lotteries has to be made explicit before the Pareto condition can even be stated), the one concrete example or case that should carry the whole tutorial and what features that example must have and must lack, the misconceptions I should expect, and the exact point in the sequence where each should be defused. I suspect they will treat the individual utility functions as interpersonal measures of happiness, and they will likely overread the theorem as proving utilitarianism with equal weights by itself; there may be subtler confusions I have not anticipated, and I want a map of where each arises.

  In particular, the plan should make clear how to head off the idea that the theorem delivers interpersonal comparability, and how to flag that even with the Pareto axiom in place the theorem leaves the weights on individual utilities underdetermined unless some further impartiality or anonymity condition is added. I also want one final check for understanding that would show whether a student has really absorbed the conditional character of the result rather than merely repeating its statement. Please also tell me what I should openly refuse to cover at this level and say so. Do not give me a reading list or suggestions for sources. Please keep the whole plan to at most 900 words.
reasoning: |-
  Okay, the user is a PhD student teaching a tutorial on Harsanyi's aggregation theorem to a mixed group of political theory and economics students. They need a structured lesson plan that addresses potential misconceptions and emphasizes the conditional nature of the theorem. 

  First, I need to understand the core challenge: students will likely misinterpret the utility functions as interpersonal happiness measures and overinterpret the theorem as proving utilitarianism. The user explicitly wants to prevent these errors and highlight the underdetermined weights. 

  The tutorial must build from foundational concepts. Since students know expected utility but not social choice, I'll start by reviewing vNM preferences over lotteries. This is non-negotiable because the Pareto condition requires utility representations. The example must be simple (3 people, binary outcomes) but show lotteries to force vNM scaling. 

  For misconceptions: 
  - The "utility=hedonics" confusion will arise immediately when introducing individual utility functions. I'll defuse this upfront by stressing scaling conventions. 
  - The "equal weights" overinterpretation will peak during the theorem conclusion. I'll explicitly contrast Harsanyi's result with utilitarianism here. 
  - A subtler issue is mistaking the weights for interpersonal comparability. This needs clarification when discussing normalization. 

  The final check for understanding is crucial. Instead of asking to restate the theorem, I'll pose a scenario where unequal weights satisfy all axioms - forcing students to recognize the indeterminacy. 

  I'll openly exclude cardinal non-comparability debates and technical proofs, focusing on conceptual flow. The poker chip example must lack any natural utility (to prevent hedonic interpretation) and have symmetric preferences (to tempt premature utilitarian conclusions). 

  Timing breakdown: 
  - 30 mins on vNM recap and Pareto setup 
  - 40 mins on the theorem walkthrough 
  - 20 mins on misconceptions 
  - 25 mins on weights discussion and deep dive 
  - 5 mins for final check 

  The weights discussion is where most insights will crystallize, so I'll allocate the most interactive segment here. Students need to see concrete weight sets satisfying the axioms. 

  User's unspoken need: They're nervous about teaching outside their comfort zone. By providing exact misconception mapping ("when you say X, counter with Y") and timing, I'm reducing their anxiety. They also want to establish authority by confidently setting boundaries ("we won't cover Z").
answer: |-
  Here's a focused tutorial plan targeting your concerns. Core example: **Distributing a single indivisible good (e.g., a rare book) via lottery among 3 students (A, B, C). Preferences are strict and symmetric.**

  **Timeline & Conceptual Flow (120 mins):**

  1.  **Grounding & Review: Preferences over Lotteries (25 mins)**
      *   *Do:* Revisit vNM expected utility theory using the book example. Elicit preferences: Each student strictly prefers getting the book for sure over not getting it. Present simple lotteries (e.g., 50% chance for A, 50% for B; C gets nothing). Ask: How do they rank these lotteries?
      *   *Key Point:* vNM axioms imply each individual's preferences can be represented by a utility function unique up to affine transformations. Assign utilities: `U_i(get book) = 1`, `U_i(no book) = 0` for each i (A, B, C). **Crucially emphasize:** This normalization is arbitrary and convenient *for each individual separately*. `U_A=1` ≠ `U_B=1` implies nothing about interpersonal intensity.
      *   *Defuse Misconception #1 (Utility = Interpersonal Happiness):* State explicitly: "These `U_i` are numerical tools representing *individual choice under risk*, not measures of happiness, well-being, or moral worth across people. `U_A=1` and `U_B=1` mean only that A and B each value *their own* getting the book equally *relative to not getting it*. It says nothing about whether A's joy equals B's joy."

  2.  **The Social Choice Setup & Pareto (15 mins)**
      *   *Do:* Define the social alternative: A lottery over who gets the book (e.g., `(pA, pB, pC)` summing to 1). The social planner needs a preference ranking over these lotteries.
      *   *Introduce Pareto Axioms:*
          *   *Pareto Indifference (PI):* If every individual is indifferent between two lotteries L1 and L2, then society is indifferent.
          *   *Pareto Preference (PP):* If every individual strictly prefers L1 to L2, then society strictly prefers L1 to L2.
      *   *Why vNM First?* State clearly: "We can only meaningfully talk about *individual* indifference/preference over lotteries *because* we have their vNM representations. PP/PI require comparing individual *preferences*, which vNM utilities represent. Without vNM, stating PP/PI over lotteries is incoherent." Use the example: If all prefer L1=(1,0,0) over L2=(0,1,0), PP forces society to prefer L1.

  3.  **Harsanyi's Theorem Statement & Intuition (20 mins)**
      *   *Do:* State the theorem: "If individual preferences satisfy vNM axioms (hence have vNM utility representations `U_i`), and Social preferences satisfy vNM axioms *and* PI/PP, then there exist positive weights `{w_i}>0` and a social vNM utility function `W` such that `W(L) = ∑ w_i U_i(L)` for any lottery L."
      *   *Intuition Walkthrough (using example):*
          *   Consider L1=(1,0,0), L2=(0,1,0), L3=(0,0,1). By PP, society must strictly prefer each of these to (0,0,0).
          *   Consider a lottery L=(0.5, 0.5, 0). Individual expected utilities: `EU_A=0.5*1 + 0.5*0 = 0.5`, `EU_B=0.5`, `EU_C=0`. vNM social utility `W(L)` must be a linear function of these `EU_i` because of social vNM axioms.
          *   PP implies `W(L) > W(0,0,0)`. The *only* linear functions respecting PP/PI are positive weighted sums. (Sketch linearity + positivity requirement briefly).

  4.  **The Weight Indeterminacy & "Not Utilitarianism Yet" (30 mins - Crucial Section)**
      *   *Do:* Plug in the normalized utilities (`U_i(book)=1`, `U_i(none)=0`) into the theorem: `W(L) = w_A * pA + w_B * pB + w_C * pC`.
      *   *Demonstrate Indeterminacy:*
          *   Set `w_A = w_B = w_C = 1/3`. `W(L) = (pA + pB + pC)/3 = pA/3 + pB/3 + pC/3`. Society is indifferent between (1,0,0), (0,1,0), (0,0,1) -- seems "fair".
          *   Set `w_A = 1`, `w_B = 1`, `w_C = 0.1`. `W(L) = pA + pB + 0.1*pC`. Society strictly prefers giving the book to A or B over C! **This satisfies all axioms (PP/PI, vNM for all).** C's low weight doesn't violate PP (if *everyone* prefers L1 to L2, PP still holds) or PI.
      *   *Defuse Misconception #2 (Equal Weights/Utilitarianism):* "Harsanyi shows social utility is an *affine* combination, not necessarily an *equal-weighted* sum. Any positive weights work. `w_C=0.1` is allowed! The theorem does *not* prove utilitarianism with equal weights." Connect to example: Without further constraints, favoring A&B over C is permissible.
      *   *Defuse Misconception #3 (Interpersonal Comparability Delivered):* Reiterate: "The `w_i` are scaling constants. They compensate for the *arbitrary* way we scaled each `U_i`. Setting `U_A(book)=1` and `U_B(book)=1` didn't make A's and B's utilities interpersonally comparable; similarly, setting `w_A = w_B` doesn't magically create comparability. The weights reflect a *normalization choice for the social scale*, not proven facts about equal moral worth. **The theorem assumes vNM scales; it doesn't create interpersonal comparability out of nothing.**"
      *   *Flag the Need for Impartiality:* "To get equal weights (`w_i = w_j`), we need an *additional* ethical axiom like Anonymity: society is indifferent between any permutation of identities (e.g., swapping A's and B's prospects). Harsanyi's axioms alone don't impose this."

  5.  **Deep Dive & Final Check (25 mins)**
      *   *Do:* Discuss implications. Why is the linear form significant? (Preserves vNM structure, allows social welfare under risk). What's the role of PP? (Links individual and social preferences strongly). What does it *not* do? (Dictate weights, justify comparability).
      *   ***Final Check for Understanding (Critical):*** Pose: "Suppose we add the Anonymity axiom. What must be true about the weights `w_A, w_B, w_C` in the book example? Now, suppose Student C reveals they derive *immense* joy from the book, far more than A or B. Could we incorporate this *without* violating Harsanyi's axioms? Why or why not?" *Correct Answer:* Anonymity forces `w_A = w_B = w_C`. Revealing "immense joy" is irrelevant to the vNM framework. Harsanyi's setup uses preferences revealed by choices under risk (`U_i`), not inner feelings. Changing `U_i` based on reported joy violates the vNM representation unless it changes their *actual choices*. The theorem operates on the given `U_i` representations, whatever their basis. **This tests understanding of the conditional nature (given vNM `U_i`), the role of weights, and the lack of inherent comparability.**

  6.  **Wrap-up & Boundaries (5 mins)**
      *   Summarize: Harsanyi shows that *if* individuals and society are vNM-rational *and* PP/PI hold, *then* SWF is a positive affine aggregation. Weights are indeterminate without further axioms. Utilities represent choice, not comparable well-being.
      *   **Openly Refuse to Cover:**
          *   Proof details (existence via separating hyperplane theorem).
          *   Extensions (state-dependent utility, heterogeneous beliefs).
          *   Philosophical debates on "true" cardinal utility vs. vNM as mere representation.
          *   Alternative aggregation theorems (e.g., Mongin's critique).
          *   Detailed discussion of social choice beyond this specific theorem (e.g., Arrow). Say: "Focus today is solely on understanding Harsanyi's specific result, its conditions, and common misinterpretations."

  **Why this example works:** Involves lotteries (essential for vNM/PP), symmetric preferences (tempts utilitarian misreading), simple outcomes (binary, clear), allows clear demonstration of weight indeterminacy (`w_C` small), lacks natural interpersonal utility (forces reliance on vNM scales).
