answer: |-
  **1. The engineered scenario (119 words)**
  On both Earth and Twin Earth, the Civic Bond is a national banking institution established by identical charters in 1789. The charters govern interbank lending during crises. Article 14 on Earth states: *"The Board may, upon unanimous vote, compel member banks to transfer gold reserves to the central vault."* This clause has never been invoked. On Twin Earth, the charter is physically indistinguishable except for Article 14, which reads: *"The Board may, upon unanimous vote, recommend member banks transfer gold reserves to the central vault."* This recommendation power is also unused. All observable Civic Bond operations, history, and public understanding are identical. The dormant clause difference is buried in archival parchment, unknown to the public or current officials.

  **2. Internalist reasoning (98 words)**
  For an internalist/descriptivist, reference is fixed by the concepts speakers associate with the term "Civic Bond." Citizens and officials on both planets possess identical mental states: they conceive of the Civic Bond solely through its active functions – regulating loans, setting interest rates, its visible structure, and known history. The dormant Article 14, differing only in a counterfactual power never exercised or incorporated into anyone's understanding, doesn't feature in their descriptive content. Therefore, the mental content fixing the reference is identical. Both groups refer to the *same* institution defined by its manifest properties and roles.

  **3. Causal-externalist reasoning (98 words)**
  Standard causal/historical externalism traces reference back through the causal chain of use to the initial baptism. Here, the founding charters are the baptismal events. While the charters contain a micro-physical difference in Article 14, the causal chains initiating and sustaining the use of "Civic Bond" on both planets are otherwise identical. The differing clause has played *no causal role* in any historical event, policy decision, or public discourse on either planet. Reference is anchored to the institution *as causally interacted with*, and since that interaction is identical, "Civic Bond" refers to the same entity on both worlds.

  **4. Normative-function reasoning (102 words)**
  Normative-function externalism holds that the reference of an institutional term depends on the *complete* system of constitutive rules defining its normative powers and potentialities, even if some rules are latent. Earth's Civic Bond charter *empowers* the Board to *compel* gold transfers under Article 14. This dormant rule is part of its fundamental architecture, altering the institution's de jure possibilities and the normative relations between banks and the Board. Twin Earth's charter lacks this power, offering only a recommendation. This difference in the institution's *counterfactual normative structure* means Earth's Civic Bond possesses a distinct functional potential. Hence, they are different institutions referred to by "Civic Bond."

  **5. The isolating feature (79 words)**
  The isolating feature is the **dormant clause's latent normative power**. For normative-function externalism, an institution’s identity is determined by its *entire* constitutive rule-set, including rules defining powers that *could* be exercised but haven't been. Earth’s Article 14 grants a *compulsory* power, fundamentally altering the Board’s potential authority over member banks compared to Twin Earth’s *advisory* clause. This difference in the "blueprint" of permissible actions, even if never used, changes the institution’s essential functional nature. The other theories ignore this inactive potential.

  **6. The removal test (78 words)**
  If the dormant clause difference were removed (e.g., both charters have identical wording – either both "compel" or both "recommend" – even if still unused), the normative-function externalist verdict changes. All three theories would then agree that "Civic Bond" refers to the same institution on both planets. The internalist mental content and causal-externalist causal chains remain identical, and crucially, the normative-functional architecture would now also be identical, lacking the divergent latent power that previously caused the split. The disagreement hinges entirely on that dormant clause difference.

  **7. Defensive counter-attack (80 words)**
  A normative-function externalist defender would attack the construction as *trivialising institutional essence*. They'd argue: "Your 'dormant' clause *is* causally inert *only contingently*. Its *presence fundamentally changes the legal reality* – Earth's banks *are* normatively subordinate in a way Twin Earth's aren't, regardless of exercise. Denying this conflates the institution with its accidental history. Your scenario proves our point: institutions *are* their constitutive rules. Splitting hairs? No – distinguishing genuine differences in de jure authority is precisely what defines institutional kinds."

  **8. Honest assessment of whether it cheats (79 words)**
  It doesn't blatantly cheat, but it exploits a genuine theoretical fissure. The difference is real but exquisitely fine-grained and causally inert, designed to isolate dormant rules. The potential cheat lies in assuming normative-function externalism *must* weight dormant rules equally with active ones. A critic might argue dormant rules *only* become part of the essence if they *would* be recognised/activated under relevant conditions, which, given identical histories, they arguably *wouldn't* be on Earth either. However, the scenario holds if one accepts the dormant rule *itself* changes the normative landscape.
