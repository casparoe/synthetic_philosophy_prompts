  First, I need to craft a plausible Civic Bond scenario. Banking regulations feel ideal - familiar but with room for dormant clauses. For Earth, I'm imagining a charter requiring emergency gold reserve transfers that's never triggered. Twin Earth would have identical text except that clause is replaced by neutral wording. This avoids sci-fi while creating the necessary structural difference.

