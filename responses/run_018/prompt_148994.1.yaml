  The isolating feature is clearly the clause's counterfactual power - its mere existence modifies what could happen institutionally. Removal test would show theories converging if clauses matched.

  Biggest challenge is defending normative-function against "splitting hairs" criticism. I'll argue dormant rules fundamentally reshape institutional possibilities - like an unused trapdoor still being part of a building's design.

