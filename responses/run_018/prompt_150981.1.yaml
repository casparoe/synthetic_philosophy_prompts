answer: |-
  Right, here's the breakdown:

  **What the practice actually does:**  
  Rating agencies mix historical default stats with their analysts' gut feelings using a linear opinion pool. This spits out a central default probability estimate plus a range ("uncertainty band") around it. They present this range as a quantified measure of how unsure they are, implying it's objectively derived from the blended inputs.

  **Keynes's likely line on the quantification bit:**  
  Keynes would absolutely call this spurious quantification. He'd see it as dressing up fundamental uncertainty (his "true uncertainty" – unquantifiable, unknowable future states) in the clothes of measurable "risk" (calculable odds based on stable frequencies). Blending shaky history with subjective judgement doesn't magically create objective probability. The range gives a false impression of mathematical precision where none exists. He'd argue this *obscures* the true nature of radical uncertainty inherent in sovereign debt, potentially misleading investors into thinking the unknowable has been tamed. It's misplaced pseudo-scientific humility that actually breeds false confidence.

  **Where the weight-of-argument problem fits in:**  
  Keynes's "weight of argument" refers to the *confidence* in a probability estimate, separate from the probability itself. More *relevant* evidence increases weight. If an investor sees the band shift slightly and updates their beliefs, Keynes would likely say they're confusing things. The shift might reflect a tiny change in the *estimated* probability (which could be spurious anyway), but it tells us nothing about whether the underlying *weight* (confidence) has truly changed. Has genuinely new, relevant evidence reduced the fundamental uncertainty? Probably not. The band's movement is likely just noise within the same pool of inadequate knowledge. Updating beliefs based purely on the band shift misses the point – the deep uncertainty remains unchanged.

  **Bottom line — what he'd probably advise:**  
  Keynes would tear into this practice. He'd see it as dangerous window-dressing that confuses measurable risk with unquantifiable uncertainty. His advice? Be brutally honest: admit that sovereign defaults involve radical uncertainty where precise probabilities (and ranges around them) are meaningless. Focus on *qualifying* the nature of the unknowns, the potential for catastrophic outliers, and the limits of knowledge. Ditch the pseudo-precise bands – they offer false comfort and distract from the real, unquantifiable messiness of the future. True humility is admitting we *can't* put a number on it, not pretending we can with fancy maths.
