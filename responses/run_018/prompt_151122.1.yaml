prompt: |-
  hey so im in this philosphy club after school and we had this really heated debate about bernard williams and his integrity objection, specifically the one thought too many problem. we split into too camps that have been talking past each other for weeks. camp A says the integrity objection totally kills utilitarian reasoning in personal life because if youre always counting lives you lose your ground projects and become alienated from yourself. camp B says thats a misreading — the problem isnt having an extra mental step but being forced to abandon your projects for insufficient reason, and utilitarians can actually respect personal integrity if they weigh things correctly.

  we want to write this adversarial collaboration document like the ones people do for stuck debates. could you draft it for us? we need a numbered section of claims both sides can sign — stuff about moral psychology, what ground projects are, and whether utilitarian calculus always alienates. then a table of the exct disagreements in neutral wording so neither camp feels misrepresented. we think the main cruxes are: first, whether ground projects have intrinsic value or just heavy instrumental weight; second, whether moral psychology can actually separate counting reasons from feeling alienated; and third, something about institutional roles versus personal commitments that we made up — like does the objection apply differently if your project is something you chose versus something assigned?

  for each crux please include a concrete case both sides agree bears on it. we invented this archive keeper scenario: shes a linguist whose life work is preserving dead languages in a physical archive, and she can burn a small unique section to sell the ashes for medicine money that saves ten lives, or keep it intact. camp A predicts she shouldnt do the life-counting math at all and that doing so is the alienation williams warns about. camp B predicts she should do the math but probably still keep the archive if her ground project is weighty enough, and that this shows integrity survives reasoning.

  please format it with agreed claims first, then disagreements table, then cruxes with predictions. dont just give generic advice — we want the philosophical structure mapped with our specific scenario included. also no bibliographies please since we cant look stuff up right now, just work with the concepts. sorry for the typo's im writing this on my phone between classes.
