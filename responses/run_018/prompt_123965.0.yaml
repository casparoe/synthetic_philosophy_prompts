answer: |-
  You're absolutely hitting on one of the most nuanced and politically significant aspects of Aquinas's thought! Let's break down his position on tyranny, resistance, and the nature of "the people" based primarily on *De Regno* (On Kingship) and relevant sections of the *Summa Theologiae* (especially I-II, Q.90-97, and II-II, Q.42, Q.104). Your reading is perceptive, and the collective-intentionality question is crucial.

  **Key Distinctions Aquinas Makes (Brainstorm):**

  1.  **Origin of Authority:** This is fundamental. Authority comes **either**:
      *   *Immediately from God* (e.g., via inheritance in a divinely sanctioned line, or conquest where God allows it for His purposes). Resistance here is much harder to justify.
      *   *From the People* (via election, consent, or established custom). This is the scenario where resistance becomes possible. The people are the *source* of the ruler's authority for the sake of the *common good*.

  2.  **Tyranny vs. Legitimate Kingship:** Tyranny is rule *for the ruler's private benefit* rather than the *common good*. It's a perversion of the office.

  3.  **Resistance vs. Sedition:**
      *   **Sedition (II-II, Q.42):** *Sinful* discord or rebellion against *just authority* or *the unity of the people*. It's inherently harmful to the common good.
      *   **Resistance/Deposition:** Aquinas carefully distinguishes this from sedition when the ruler *is* a tyrant *and* the authority originated from the people. This action aims to *restore* the common good and legitimate authority.

  4.  **"Private" vs. "Public" Action:** This is the critical line you noted:
      *   **Private Individuals:** Aquinas **firmly rejects** assassination or individual violent rebellion ("private presumption"). It's sinful, leads to chaos, and usurps the role of public judgment. (ST II-II, Q. 64, A.3, on killing unjust aggressors, implies the *public authority* has the role, not private individuals against rulers).
      *   **Public/Authoritative Action:** Resistance must come from a source with *authority* derived from the people. He does *not* envision a spontaneous mob.

  5.  **The "People" as Corporate Agent - Your Core Question:** This is where Aquinas is most interesting and potentially ambiguous to modern eyes.

  **Parsing "The People" and Their Role in Resistance:**

  Your intuition that Aquinas views "the people" as a corporate entity with a retained original power is **largely correct**, though rooted in medieval concepts rather than modern social contract theory. Here's the breakdown:

  1.  **Retained Original Power (Jurisdictional Residuum):** Aquinas explicitly states that when authority is conferred *by* the people *for* the common good, the people retain a residual power. If the ruler fundamentally betrays that purpose (becomes a tyrant), the authority *reverts* to its source. The people haven't *transferred* sovereignty absolutely; they've *entrusted* power conditionally.
      *   *De Regno (On Kingship), Ch. 6 (or 7 depending on edition):* "A king who is unfaithful to his duty forfeits his claim to obedience. It is not rebellion to depose him, for he is himself a rebel whom the nation has a right to put down... The nation as a whole is above the king... the authority of the king is derived from the nation... [I]f he governs tyrannically... the people are no longer bound by their oath of allegiance."
      *   *Summa Theologiae I-II, Q. 97, A. 3 (Whether Custom Can Obtain Force of Law):* Implicitly supports the idea that the community's practice/consent is foundational to law and authority.

  2.  **Corporate Agent, Not Mere Aggregate of Individuals:** Aquinas does **not** mean that any individual, or even a group of individuals acting privately, can judge and depose the tyrant. He specifically contrasts "private presumption" with action taken *publicly*.
      *   **"The People" as a Political Body:** He conceptualizes "the people" (*populus*) as a unified political community, a *corpus politicum* or *universitas*, inheriting Roman law concepts. This body has a collective existence and agency distinct from its individual members.
      *   **Acting Through Representatives/Institutions:** The "people" act through constituted authorities or representatives who hold *public* standing derived from the corporate whole:
          *   **Inferior Magistrates/Nobles:** Those who held public office or represented estates *before* the tyrant usurped power. They possess delegated authority enabling them to act *for* the community.
          *   **A "Public Authority":** Aquinas often uses this vague phrase. It means an entity deriving its legitimacy from the original popular source and acting with a mandate *for* the common good, not private vengeance. This could be a council, a representative assembly (like nascent parliaments), or collectively acting nobles/officials.
          *   **Collective Action:** While "the people" as a whole are the ultimate source, the *act* of deposition requires organized, representative action reflecting the corporate will, not individual judgment or mob violence. It's the difference between a legal process (even if extra-legal) and vigilantism.

  3.  **Shared Intentionality (Medieval Style):** Aquinas *does* rely on a concept of shared intentionality, but it's grounded in:
      *   **The Common Good:** The shared purpose for which the political community exists and authority is constituted. Tyranny violates this shared telos.
      *   **Natural Law:** The shared rational understanding of fundamental justice accessible to all, which tyranny flouts. This provides the objective standard for judgment.
      *   **Corporate Representation:** The "people" speak and act through recognized heads or bodies who *represent* the corporate will and its commitment to the common good. Their action isn't just their personal opinion; it's the exercise of the community's residual authority.

  **Answering Your Specific Queries:**

  *   **Who exactly can act?** *Not* private individuals. Action must be taken by those possessing **public authority derived from the people** – inferior magistrates, nobles acting collectively *as representatives* of the political community, or some other constituted body acting *for* the common good and *in the name of* the people. It's a corporate, representative action.
  *   **Is it collective intentionality?** **Yes, but in a specific medieval sense.** Aquinas absolutely treats "the people" as a corporate agent (*universitas*) that retains an original, residual power. Resistance depends on this corporate body acting through its legitimate representatives to reclaim the authority misused by the tyrant. It's *not* based on each individual privately judging it's okay to kill the ruler. The reasoning hinges entirely on the people being a unified political body (*corpus politicum*) with a shared purpose (common good) and a retained authority that can be exercised through representative institutions against a ruler who has betrayed his mandate.
  *   **Are you projecting?** You are applying a modern *term* ("collective intentionality"), but you are correctly identifying the *medieval reality* Aquinas relies upon. Concepts like *universitas*, corporate personality, popular consent as the foundation of authority, and the residual power of the community were well-established in medieval legal and political thought (Roman law, Canon law, feudal practice). Aquinas systematizes this within his Aristotelian/Christian framework. He isn't a proto-Locke, but he *is* articulating a robust medieval theory of conditional kingship rooted in popular origin and corporate agency.

  **Conclusion:**

  Aquinas draws a clear line: **Private individuals cannot kill the tyrant.** Deposition is only legitimate if:
  1.  The ruler's authority *originated from the people*.
  2.  The ruler has become a *tyrant* (ruling for private gain, not the common good).
  3.  The action is taken by a **"public authority"** – meaning representatives, magistrates, or a constituted body acting *with* the authority derived *from* the corporate body of the people, *for* the restoration of the common good.
  4.  It is done cautiously, as a last resort, considering whether the cure might be worse than the disease.

  "The people" function as a corporate agent (*universitas*) retaining the original power they conditionally delegated. Resistance is the act of that corporate body, through its legitimate representatives, reasserting its authority to depose a ruler who has fundamentally violated the trust and purpose for which that authority was granted. Your reading captures the essence – Aquinas is indeed relying on a medieval concept of collective political agency.
