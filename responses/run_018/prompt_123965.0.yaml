  First, the user references Aquinas's treatise on kingship, likely "De Regno" or "Summa Theologiae" I-II q.90-97. They're zeroing in on the tension between the people's right to resist and Aquinas's caution against sedition. Their core question hinges on whether "the people" functions as a corporate entity with retained sovereignty or merely as individuals making private judgments.

  Hmm, the user seems academically inclined—probably a grad student or serious philosophy enthusiast. They're wrestling with medieval political ontology while being self-aware about anachronism risks. That's sophisticated. Their unspoken need might be understanding how pre-modern collective agency concepts differ from modern ones (like Rousseau's general will or contemporary identity politics).

  Key Aquinas distinctions to recall: 
  1) Authority origins matter—popularly conferred vs divinely imposed. Only the former allows revocation.
  2) Resistance must be public/authoritative, not private/vigilante. 
  3) Proportionality: tyranny must be intolerable and removal less harmful than status quo.

  Ah, and the corporate body question... Aquinas absolutely frames "populus" as a juristic person via Roman law influences (universitas). The people act through representatives like nobles or magistrates, not atomized individuals. That's crucial. The user is spot-on to suspect collective intentionality here, but it's medieval corporate theory, not modern social contract.

  Also worth noting: Aquinas isn't endorsing revolution lightly. His "don't rush" warning reflects medieval order theology—disorder as near-sinful. The user might benefit from contrasting this with later resistance theorists like Hotman or Calvinist monarchomachs who radicalize Aquinas's principles.

  Should emphasize how Aquinas's "public action" requirement (through officials/estates) preserves legitimacy continuity. Private killing = sinful disruption; public deposition = lawful authority reassertion. That's the line they're seeking.

