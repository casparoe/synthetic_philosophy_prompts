  Both camps must agree on some basics: there's one lump of clay and one statue that coincide spatiotemporally. They share the same matter and properties at that time. Any ontology must explain how one thing can constitute another without identity, address Leibniz's Law issues, and handle destruction conditions. For the Atelier Reconstruction case, they agree on the parameters: 60% original fragments, 40% new material, same artist using original sketches, with spatiotemporal discontinuity.

