  I'm a doctoral student in metaphysics working on material constitution. I need you to act as an expert philosopher of ontology with deep familiarity with the statue-and-clay debate, but without access to external sources. Before you draft anything, please think carefully and do brief preliminary brainstorming: list the formal commitments both camps must share, identify the exact ontological divergence that makes them adversaries rather than merely emphasizing different aspects of one view, and note one under-discussed crux that arises in reconstruction cases.

  Then draft the joint statement that a committed Constitutionalist and a committed Anti-Coincidence Hylomorphist could both sign after a good-faith adversarial collaboration focused on material constitution—specifically the classic statue-and-clay problem and the following injected case: the Atelier Reconstruction, in which a destroyed statue is rebuilt from approximately sixty percent of its original clay fragments and forty percent new material, guided precisely by the original artist's workshop sketches and fabrication protocols. Both camps agree this scenario is metaphysically significant but predict opposite ontological outcomes.

  The document should contain:

  1. A numbered section of agreed claims—including shared commitments about the formal structure of coincidence, about the data of the classic case, about what an adequate ontology must explain, and about the precise parameters of the Atelier Reconstruction case (matter ratio, guidance conditions, spatiotemporal discontinuity).

  2. A disagreements table with columns for: the precise issue; the Constitutionalist's formulation of their own view (worded so they would accept it as accurate); the Anti-Coincidence Hylomorphist's formulation of their own view (worded so they would accept it); and the crux designation.

  3. For each designated crux, specify: the concrete case, argument, or thought-experiment that both sides agree bears on it (this may include the Atelier Reconstruction or a modified classic scenario); the Constitutionalist's explicit prediction about what that evidence or argument shows; and the Anti-Coincidence Hylomorphist's explicit prediction about what it shows.

  4. A brief section flagging any portion of the dispute that is merely verbal rather than substantive, with justification for that assessment.

  Constraints: Do not include bibliographies, reading lists, or citations. Do not invoke highly specialized formal apparatus or depend on attributions to specific recent authors that a well-trained metaphysician might not have firmly in memory (standard terms like numerical identity, material constitution, substantial form, and mereological essentialism are permitted). Do not ask for web searches. Write precisely, avoid strawman formulations, and ensure that each side's disagreement is phrased in wording that side could genuinely endorse.
