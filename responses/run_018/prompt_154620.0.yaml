  We are drafting a joint statement between a traditional just-war theorist (defending moral equality of combatants) and a revisionist liability-theorist. The focus is on the concept of "epistemic dominance" and whether it breaks the symmetry of moral equality. The statement will be structured as:

  1. **Agreed Claims**: Numbered list of shared commitments.
  2. **Disagreements Table**: Each side phrases their own position on key splits.
  3. **Cruxes**: Focus on whether epistemic domination undermines equality and what counts as reasonable belief. For each crux, a shared test case and each side's prediction.

  The goal is to make the disagreement exact and constructive, without a verdict.

  ### Step 1: Agreed Claims (Shared Ground)
  We list points both sides agree on, including:
  - Shared formalism (e.g., definitions of key terms).
  - What is at stake (the practical implications of the disagreement).
  - Shared commitments (e.g., noncombatant immunity).

  ### Step 2: Disagreements Table
  Each side writes their own statement of disagreement on specific points. We structure it as:

  | Issue | Traditional Just-War Theorist | Revisionist Liability-Theorist |
  |-------|-------------------------------|--------------------------------|
  | ...   | ...                           | ...                            |

  ### Step 3: Cruxes
  We focus on two main cruxes:
  1. Does epistemic domination break the symmetry of moral equality?
  2. What counts as reasonable belief about just cause under duress?

  For each crux, we provide:
  - A shared test case (a hypothetical scenario both sides agree is relevant).
  - Each side's prediction about the outcome of the test case under their view.

  ---

  **Joint Statement: On the Moral Equality of Combatants and Epistemic Dominance**

  ### 1. Agreed Claims

  1. **Formalism of Moral Equality (Symmetry Thesis)**: In traditional just-war theory, the moral equality of combatants (MEC) holds that combatants on both sides of an armed conflict have equal moral status in the conduct of war (e.g., they have the same permissions and liabilities) regardless of the justice of their side's cause, provided they adhere to the rules of war (jus in bello).

  2. **Liability in Revisionism**: Combatants fighting without a just cause are liable to defensive harm because they are contributing to an unjust threat. Combatants with a just cause are not liable to defensive harm by the unjust side, but may be liable to collateral harm.

  3. **Epistemic Dominance Defined**: A situation in which one belligerent's institutions (state, media, command structure) systematically distort or control the information available to its combatants, such that they cannot form reliable beliefs about the justness of their cause.

  4. **Noncombatant Immunity**: Both sides affirm the principle of noncombatant immunity: noncombatants (civilians not directly participating in hostilities) must not be intentionally targeted.

  5. **What is at Stake**: The practical implications of whether epistemic dominance breaks symmetry include:
     - Whether combatants in an epistemically dominated force can be held morally responsible for their participation.
     - Whether they are liable to defensive harm in the same way as combatants who are not epistemically dominated.

  6. **Shared Epistemic Constraint**: Both sides agree that combatants have a duty to make reasonable efforts to ascertain the justness of their cause, but they differ on what counts as reasonable under conditions of epistemic dominance.

  ### 2. Disagreements Table

  | Issue | Traditional Just-War Theorist | Revisionist Liability-Theorist |
  |-------|-------------------------------|--------------------------------|
  | **Moral Equality of Combatants (MEC)** | We affirm that MEC holds even in cases of epistemic dominance. Combatants on both sides are moral equals in the conduct of war because they are acting as agents of their state and cannot be expected to independently verify the just cause. The fog of war and legitimate obedience to authority create a presumption of symmetry. | We deny that MEC holds in cases of epistemic dominance. Combatants who are epistemically dominated may not be fully liable for their participation if their belief in the just cause is non-culpably false, but they are still engaged in objectively unjust combat and thus lack the right to kill just combatants. |
  | **Epistemic Standard for Just Cause Belief** | Combatants are required only to hold beliefs that are reasonable given their epistemic environment. In an epistemically dominated state, a combatant's belief in the just cause is reasonable if it is based on the information made available by their state and if there are no obvious contradictions or red flags. | Combatants must have a belief in the just cause that is objectively reasonable, meaning it must withstand scrutiny against available evidence from diverse sources. Epistemic dominance does not excuse a failure to seek out alternative information when such seeking is feasible. The standard is not what is reasonable within the bubble, but what is reasonable for a moral agent in that historical context. |
  | **Liability of Epistemically Dominated Combatants** | Combatants in an epistemically dominated force retain their moral equality. They are not liable to defensive harm solely because of their participation in an unjust war. The symmetry of combatant liability is preserved. | Combatants in an epistemically dominated force may be excused from blameworthiness for their participation, but they are still liable to defensive harm because they pose an unjust threat. Their reduced culpability may affect the proportionality calculus in using force against them, but not their liability. |

  ### 3. Cruxes

  **Crux 1: Does epistemic domination break the symmetry of moral equality?**

  - **Shared Test Case (State Alpha vs. State Beta)**:
    - State Alpha has a just cause for defensive war against State Beta's aggression. State Beta is an authoritarian regime with total control over media and education. From birth, Beta's citizens are taught that Alpha is an existential threat and that Beta's preemptive war is necessary for defense. Beta combatants have no access to independent information and are subject to severe penalties for dissent. Beta invades Alpha. Alpha combatants fight in defense.
    - Question: Are Beta combatants (epistemically dominated) morally equal to Alpha combatants?

  - **Traditional Just-War Prediction**: 
    - The symmetry holds. Beta combatants are not at fault for their false beliefs and are acting as soldiers under orders. They retain their moral equality with Alpha combatants. Both sides have the same permissions and liabilities in combat.

  - **Revisionist Liability-Theorist Prediction**: 
    - The symmetry is broken. Beta combatants are not morally equal to Alpha combatants because they are objectively posing an unjust threat. However, their epistemic condition may reduce their culpability, meaning that killing them requires a stronger proportionality justification (e.g., it's worse to kill a non-culpable threat than a culpable one). But they are still liable to necessary defensive harm.

  **Crux 2: What counts as reasonable belief about just cause under duress?**

  - **Shared Test Case (Conscript Gamma)**:
    - Conscript Gamma is a citizen of State Beta (from the above scenario) who is drafted into the military. Gamma has never questioned the state's narrative and has no reason to doubt it. During training, Gamma hears a rumor from a fellow conscript that the war might be unjust, but reporting such rumors is punished. Gamma dismisses it as enemy propaganda. Gamma participates in the invasion of Alpha.
    - Question: Did Gamma have a reasonable belief in the just cause of Beta's war?

  - **Traditional Just-War Prediction**: 
    - Gamma's belief is reasonable. Given the systematic control of information and the severe consequences of dissent, Gamma did not have a realistic opportunity to form a different belief. The standard of reasonableness is relative to the epistemic environment.

  - **Revisionist Liability-Theorist Prediction**: 
    - Gamma's belief is not reasonable. The presence of the rumor (and the punishment for discussing it) should have triggered a duty to investigate further if possible. Reasonableness requires an active engagement with available evidence, not just passive acceptance of state propaganda. In the absence of such engagement, Gamma's belief is not reasonable, and thus Gamma is at least minimally culpable.

