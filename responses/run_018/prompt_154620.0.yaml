answer: |-
  ### Joint Statement on Moral Equality of Combatants and Epistemic Dominance  
  **Agreed by Traditional Just-War Theorist (TJWT) and Revisionist Liability-Theorist (RLT)**  
  *Date: [Insert Date]*  

  ---

  #### **1. Agreed Claims**  
  1. **Formal Symmetry Baseline**: Moral equality of combatants (MEC) implies that combatants on opposing sides possess identical *in bello* permissions/prohibitions absent vitiating factors (e.g., war crimes).  
  2. **Noncombatant Immunity**: Direct targeting of noncombatants is prohibited irrespective of *jus ad bellum* status.  
  3. **Epistemic Dominance Defined**: A condition where one belligerent’s institutions systematically obstruct combatants’ access to unbiased evidence, rendering reliable belief-formation about *just cause* practically infeasible.  
  4. **Shared Burden**: Combatants bear *some* duty to assess their side’s *just cause*, but scope/rigor disputed.  
  5. **Stakes**: If epistemic dominance breaks symmetry, combatants in dominated forces may lose MEC protections (e.g., liability to defensive harm without moral error).  

  ---

  #### **2. Disagreements Table**  
  | Issue | TJWT Position | RLT Position |  
  |-------|---------------|--------------|  
  | **MEC under Epistemic Dominance** | "MEC holds: Dominated combatants retain full *in bello* symmetry because their epistemic environment negates culpability for unjust participation." | "MEC fails: Dominated combatants are non-culpable *threats* but remain objectively liable for contributing to unjust harm, negating moral equality." |  
  | **Reasonable Belief Standard** | "Belief is reasonable if formed per available evidence *within* institutional constraints (e.g., state propaganda, censored intel)." | "Belief is reasonable only if responsive to *accessible* counter-evidence; institutional constraints don’t override minimal due diligence." |  
  | **Liability Basis** | "Liability derives from role-based threat (soldier status), not *ad bellum* culpability." | "Liability derives from contribution to unjust harm; non-culpable threats still forfeit rights defensively." |  

  ---

  #### **3. Cruxes**  
  **Crux 1: Does epistemic dominance break MEC symmetry?**  
  - **Test Case**: *State A* (just cause) vs. *State B* (unjust cause). *State B*’s combatants receive exclusively falsified intel showing *A* as aggressor; external evidence is inaccessible. *B* invades *A*.  
    - **TJWT Prediction**: Symmetry holds. *B*’s combatants cannot be faulted for relying on state-crafted evidence. MEC persists; *A*’s defensive killing remains morally equivalent to *B*’s offensive acts.  
    - **RLT Prediction**: Symmetry breaks. *B*’s combatants pose objectively unjust threats. *A*’s combatants may defend proportionally; *B*’s acts lack equivalent justification.  

  **Crux 2: What constitutes reasonable belief under duress?**  
  - **Test Case**: Conscript in *State B* hears dissent rumors but faces imprisonment for seeking verification. They believe *B*’s cause is just.  
    - **TJWT Prediction**: Belief reasonable. Institutional coercion absolves duty to seek evidence beyond provided channels.  
    - **RLT Prediction**: Belief unreasonable. Feasible steps (e.g., discreet inquiry) were possible; passive acceptance is culpable neglect.  

