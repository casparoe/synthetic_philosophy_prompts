prompt: |-
  I run a small rationalist-adjacent discussion group—mostly people with technical backgrounds who have read some effective-altruism and decision-theory literature but have never taken a formal philosophy course. Next session I want to teach the inefficacy objection in collective-harm cases (climate emissions, meat consumption, voting), but I do not want to retread the standard “one vote doesn’t matter” script. Instead, I want to build the explanation around a framing I have not seen formalized in the usual literature: the distinction between causal redundancy in the actual world and what I will call counterfactual fragility—the property of being a necessary link within a sufficient set across nearby possible worlds, rather than being merely substitutable in the world that actually obtains. I need a teaching plan, not the explanation itself.

  Please structure the plan as follows. First, the dependency order: what idea must be in place before the redundancy/fragility distinction can even be posed, and what must come immediately after so the distinction does not collapse into naive expected-value reasoning? Second, the carrying example: one concrete scenario—preferably not voting or a single hamburger, since those trigger pre-cooked intuitions—that illustrates both actual-world redundancy and counterfactual fragility, and explain exactly what features the example must possess and what it must lack in order to serve this double purpose. Third, the misconception map: the audience will likely arrive with at least three errors—probably that this is just small-probability expected utility, that institutional mediation makes individual causation moot, and that the problem is purely epistemic rather than modal. For each, specify where in the sequence it will surface and the precise move to head it off without derailing the arc. Fourth, one check-for-understanding question that specifically diagnoses whether they have grasped counterfactual fragility rather than just the general idea that collective harm is structurally complicated. Fifth, state openly what should be left out at this level—threshold deontology, institutional-design literature, or formal game-theoretic models—and explain why omitting it is pedagogically necessary rather than a gap. The audience is technically fluent but philosophically naive; the goal is that they leave seeing the inefficacy objection as a modal-structure problem, not a scale problem.
reasoning: |-
  We are building a teaching plan around the distinction between causal redundancy (in the actual world) and counterfactual fragility (across nearby possible worlds) to address the inefficacy objection in collective-harm cases.

  **Dependency Order:**
  1. **Foundation: The Counterfactual Account of Causation**  
     - Start by explaining the basic idea: "We say that event C causes event E if, had C not occurred, E would not have occurred."  
     - This sets up the condition for being a cause in the actual world. Without this, the idea of causal redundancy (not being a cause in the actual world) doesn't make sense.

  2. **Problem Setup: Collective Harm Cases**  
     - Introduce a collective action scenario (like climate change or a group carrying a heavy object) where many people contribute to a harm (or a good) and the harm occurs.  
     - Point out that in the actual world, if we remove one person's contribution, the outcome doesn't change (because others compensate or the threshold isn't met by a single removal). This is causal redundancy.

  3. **Introduce the Distinction: Redundancy vs. Fragility**  
     - **Causal Redundancy in the Actual World**: In the actual scenario, the contribution of any one individual is redundant because the outcome would have been the same without it.  
     - **Counterfactual Fragility**: Now, we consider not just the actual world but nearby possible worlds. In some of these worlds, the collective outcome is very close to the threshold. In such worlds, the removal of one contribution might break a "sufficient set" that is barely sufficient. Thus, in those worlds, the individual is a necessary part of a sufficient set.  
     - Emphasize: In the actual world we might be redundant, but in nearby worlds (which are similar and have non-zero probability) we might be fragile (i.e., our contribution is critical in those scenarios).

  4. **Preventing Collapse into Expected Value**  
     - Immediately after introducing the distinction, clarify: This is not about the small probability that the actual world is one of those fragile worlds. It is about the modal structure: the individual's contribution is such that it *could easily have been* critical, even if in the actual world it isn't.  
     - Contrast: Expected value reasoning would multiply the impact in the fragile worlds by their (small) probability. But here, we are pointing to a structural feature that exists independently of probability assignments. We are saying that the agent is part of a mechanism that is *disposed* to be sensitive to individual contributions in some circumstances.

  **Carrying Example:**  
  - **Scenario**: A group of 10 people is carrying a heavy statue. The statue requires exactly 10 people to carry it (if one drops out, the statue falls). However, in the actual event, 15 people show up. So, 10 are carrying and 5 are extra.  
  - **Actual-World Redundancy**: If any one of the 15 doesn't show up, the statue is still carried (because there are still at least 10). Thus, no individual is causally necessary in the actual world.  
  - **Counterfactual Fragility**: Consider nearby worlds where only 10 people show up. In those worlds, if any one person drops out, the statue falls. Thus, in those worlds, each person is a necessary part of the sufficient set (the 10).  
  - **Features the Example Must Have and Must Lack**:  
    - Must have: A clear threshold (10 people needed).  
    - Must have: Redundancy in the actual scenario (more than the threshold).  
    - Must have: The possibility of non-actual but nearby scenarios (like having exactly 10) where the threshold is barely met.  
    - Must lack: Any feature that would make the threshold fuzzy (so that it's clear when the outcome changes).  
    - Must lack: Any institutional or complex mediation that might distract (like voting rules or meat supply chains). The carrying example is direct and physical.

  **Misconception Map:**  
  1. **Misconception: This is just small-probability expected utility.**  
     - Where it surfaces: When introducing counterfactual fragility.  
     - How to head it off: Explicitly state that we are not talking about probabilities. We are pointing to a modal fact: in some nearby worlds (which are similar and easily imaginable), the individual is critical. The point is that the actual situation is one of a set of possible situations that are close to the threshold, and in those, the individual matters. This is about the structure of the situation, not about calculating expected harm.

  2. **Misconception: Institutional mediation makes individual causation moot.**  
     - Where it surfaces: When discussing any collective action scenario (especially in the carrying example, if someone argues that the organizer could call for substitutes).  
     - How to head it off: In the carrying example, we assume no substitutes and a fixed group. We are focusing on the physical structure. Later, we can note that in institutional settings (like voting) the structure may be similar, but for now, we are building the basic concept in a simple setting.

  3. **Misconception: The problem is purely epistemic (we don't know if we are critical) rather than modal.**  
     - Where it surfaces: When discussing why we should care about counterfactual fragility.  
     - How to head it off: Clarify that even if we know the actual world has redundancy (e.g., we know 15 people showed up), the modal fact remains: in nearby worlds (which are relevant for assessing the role of the individual), the individual is critical. This is not about our uncertainty but about the way the world could have been.

  **Check-for-Understanding Question:**  
  - "In the carrying example, if 15 people show up, why is it true that no one is causally necessary in the actual world, but each is counterfactually fragile? And how does this relate to a nearby world where only 10 show up?"  
  - **Diagnostic**: A correct answer must:  
    1. Note that in the actual world (with 15), removing one doesn't change the outcome (redundancy).  
    2. Note that in a nearby world with exactly 10, each person is necessary because removing any one would cause the statue to fall (fragility).  
    3. Explain that the fragility comes from the fact that the situation could easily have been one with only 10 (a nearby world) and in that scenario, the individual is critical.  
  - If they only say "sometimes you matter, sometimes you don't" without the modal component (nearby worlds) and without the threshold structure, they haven't grasped it.

  **What to Leave Out and Why:**  
  - **Threshold Deontology**: We avoid discussing whether there is a moral threshold at which the act becomes wrong. This is a normative question that distracts from the descriptive causal structure we are focusing on.  
  - **Institutional-Design Literature**: We are building a conceptual foundation. Institutional details (like voting systems) can be analyzed using this framework but would complicate the initial teaching.  
  - **Formal Game-Theoretic Models**: While the group is technically fluent, game theory introduces strategic interactions and equilibria which are not necessary for understanding the modal structure. It might lead them to think in terms of Nash equilibria or mixed strategies, which is a different topic.  
  - **Why omit**: The goal is to isolate and teach the modal structure (redundancy vs. fragility) without overcomplicating. These topics can be introduced in follow-up sessions.

  **Overall Goal**: By the end, the audience should see that the inefficacy objection is not just about the small scale of individual impact (which would lead to expected value reasoning) but about the modal structure of collective action scenarios.
answer: |-
  ### Teaching Plan: Inefficacy Objection via Causal Redundancy vs. Counterfactual Fragility

  #### **Dependency Order**  
  1. **Prerequisite Concept: Counterfactual Dependence**  
     - **Why first?** The distinction cannot be posed without a baseline understanding of counterfactual reasoning. Start with the standard definition: "Event A causes event B iff, if A had not occurred, B would not have occurred." Use a simple example (e.g., "If I hadn’t flipped the switch, the light would not have turned on").  
     - **Immediate Follow-Up: Actual-World Causal Redundancy**  
       - Introduce collective harm cases (e.g., 1,000 people emitting CO₂), emphasizing that in the actual world, removing one actor’s contribution doesn’t change the outcome (e.g., climate disaster still occurs). This establishes *redundancy* as the default intuition.  
       - **Critical Bridge to Fragility:** Immediately contrast this with the question: "But what if the world were slightly different?" to pivot from actual-world redundancy to modal reasoning. Avoid expected-value calculations here—emphasize structural possibility, not probability.

  2. **Introduce Counterfactual Fragility**  
     - **Why next?** Builds directly on counterfactual dependence but shifts focus to nearby possible worlds. Define fragility: "An action is counterfactually fragile if, in nearby worlds where the collective outcome is borderline (e.g., just above/below a threshold), that action is a necessary part of a sufficient set for the outcome."  
     - **Prevent Collapse into Expected Value:** After defining fragility, explicitly state: "This is not about the *probability* that your action matters. It’s about whether you are part of a mechanism that *would* be sensitive to individual actions under small changes to the world—even if it isn’t in *this* world."

  #### **Carrying Example**  
  - **Scenario:** A bridge will collapse if overloaded by ≥1,001 kg. Ten people cross it simultaneously, each carrying 101 kg of cargo. Total load: 1,010 kg (10 kg over the threshold).  
  - **Illustrating Redundancy:**  
    - In the actual world, if one person removes their cargo (10 kg), the load is still 1,000 kg—above collapse threshold. Their action is causally redundant.  
  - **Illustrating Fragility:**  
    - In nearby worlds where the bridge’s threshold is 1,010 kg (e.g., due to humidity), each person’s cargo is critical. Removing any one person’s 101 kg reduces the load to 909 kg—below the threshold, preventing collapse. Each is a "necessary link" in the sufficient set (the group) for collapse.  
  - **Required Features:**  
    - Clear threshold (bridge collapse point).  
    - Actual-world redundancy (total load > threshold by a margin larger than any individual contribution).  
    - Fragility in nearby worlds (small changes to threshold or load make individuals critical).  
  - **What It Must Lack:**  
    - No pre-existing biases (unlike voting or meat consumption).  
    - No complex institutional mediation (e.g., no "organizer" redistributing weight).  
    - Individual contributions must be symmetric and additive (simplifies tracking necessity).

  #### **Misconception Map**  
  1. **Misconception: "This is just small-probability expected utility."**  
     - **Where It Surfaces:** During the fragility definition or carrying example analysis.  
     - **Head-Off Strategy:** When introducing fragility, contrast:  
       - Expected value: "Probability I’m pivotal × impact."  
       - Modal fragility: "In worlds where conditions are borderline (e.g., bridge threshold = 1,010 kg), I *am* pivotal—regardless of how likely that world is." Use the bridge example to show that fragility exists even if we *know* the actual threshold is 1,001 kg (i.e., no uncertainty).  

  2. **Misconception: "Institutional mediation (e.g., voting systems) makes individual causation moot."**  
     - **Where It Surfaces:** When generalizing from the carrying example to cases like voting.  
     - **Head-Off Strategy:** During the bridge example, preempt by noting: "Even without institutions, collective harm has this structure. Institutions add layers but don’t erase the modal logic—e.g., in voting, fragility arises in worlds where polls are wrong or turnout is marginal." Keep focus on the physical example first to isolate the logic.  

  3. **Misconception: "This is epistemic (about our uncertainty) not modal."**  
     - **Where It Surfaces:** When discussing why fragility matters if the actual world is redundant.  
     - **Head-Off Strategy:** After defining fragility, stress: "Fragility isn’t about ignorance of the actual threshold. It’s about how the outcome *would* change if we held the group fixed but tweaked non-agential factors (e.g., bridge strength)." Use a variant of the bridge scenario where the threshold is publicly known (1,001 kg) but fragility still exists in nearby worlds (e.g., 1,002 kg).

  #### **Check-for-Understanding Question**  
  - **Question:** "In the bridge example, suppose we discover the collapse threshold is *definitely* 1,001 kg. Why might someone’s cargo still be called ‘counterfactually fragile’?"  
  - **Diagnostic Purpose:** A correct answer must:  
    - Mention nearby worlds (e.g., "If the threshold were 1,010 kg due to rain").  
    - Identify the person as a necessary part of a sufficient set in those worlds (e.g., "In that world, removing their cargo saves the bridge").  
    - Avoid conflating with probability (e.g., no "chance" or "likelihood" language).  
  - **Why it works:** Tests grasp of modal fragility (worlds where the individual *is* pivotal) without reverting to general collective-action tropes.

  #### **Deliberate Omissions**  
  - **Threshold Deontology:** Omit discussions like "Is it wrong to contribute if near a threshold?"  
    - **Why:** Philosophically naive audiences may conflate the *structure* of harm with *moral evaluation*. Keeping the session descriptive (causal/modal) avoids normative distractions.  
  - **Institutional-Design Literature:** Skip optimizations (e.g., voting reform).  
    - **Why:** The goal is to reveal the modal structure underlying *any* collective harm. Institutional tweaks are applications, not fundamentals.  
  - **Formal Game-Theoretic Models:** Avoid Nash equilibria or cooperative game math.  
    - **Why:** While the audience is technical, game theory often obscures modal intuition by focusing on incentives/equilibria. The bridge example suffices to show the causal logic without formalism.  
  - **Pedagogical Rationale:** These omissions force focus on the core insight—that inefficacy is a problem of *modal structure* (how actions function across worlds), not scale or probability. Adding extras would blur this and invite familiar EA/decision-theory reflexes.  

  **Goal Alignment:** By omitting the above, the session stays fixed on helping technically fluent learners see inefficacy as a *modal-structure problem*. They’ll leave recognizing that redundancy/fragility arises from how actions embed in networks of dependence across possible worlds—not "my impact is small."
