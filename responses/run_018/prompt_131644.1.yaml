prompt: |-
  Hey — I'm on the acquisitions committee for a small contemporary art centre up north, and we keep running into the same mess. Every quarter we get maybe five or six proposals to acquire or loan works by artists whose personal behaviour has been publicly questioned — anything from financial fraud to serious abuse allegations — and the committee ends up arguing in circles about whether we can 'seperate' the art from the artist. I was chatting with my mate about this over coffee after reading some old LessWrong threads on moral taint, and realised we don't actually have a decision procedre; we just have vibes and a vague feeling that autonomism is probably right but not always.

  Please act as a professional philosopher of art with some practical experience in institutional ethics. Before you write the checklist, do a quick brainstorm of the relevent distinctions that actually survive being turned into operational steps — aesthetic autonomy, moral taint transmission, institutional complicity, and that third axis I sketched out called 'epistemic contamination' (where displaying the work forces viewers to suppress knowledge of harm in order to appreciate formal properties). Then turn all that into a reusable flowchart-in-words my committee can run in about 45 minutes per case, with no philosophers in the room and a director who has to sign off at the end. I need ordered gates: the exact question at each stage, what counts as a sufficient 'yes' or 'no', where the procedure stops with a hard rejection, and where it must hand off to a human because it's a value call dressed up as logic. Be explicit about those judgement points — don't hide them. The procedure should cover hard cases like: (a) an abstract painter convicted of fraud whose canvases carry no narrative content; (b) a sculptor accused of coercive abuse whose new installation is literally about power and consent; (c) a photographer whose technically brilliant series required intimate access allegedly obtained through manipulation. Run all three through it, and please make sure one of them gives an answer I'll genuinely dislike — I want to see where the framework bites. Also tell me honestly what the procedure can't do: which kind of case will make it misfire, and which feature of the debate it just can't reproduce. No bibliographies, no citation strings like 'see Jones 2015' — we can't search the web in the meeting, and I'm not asking for a reading list. Keep it practical, keep it honest about the gaps, write in British English, and don't turn it into a lecture.
reasoning: |-
  Okay, the user is on an acquisitions committee for a contemporary art centre and they're struggling with how to handle artists whose personal behavior is problematic. They need a practical decision-making framework because their current process is just based on vibes. 

  First, I need to unpack their request carefully. They want a philosopher of art perspective with institutional ethics experience. The key distinctions they mentioned are aesthetic autonomy, moral taint, institutional complicity, and epistemic contamination. These need to be turned into operational steps for a 45-minute committee process. 

  Hmm... the user is clearly frustrated with circular debates. They've read LessWrong on moral taint but need something actionable. Interesting they specified British English - probably UK-based. The "mate over coffee" detail suggests they want this to feel human, not academic. 

  The three test cases are well-chosen to stress-test the framework: 
  (a) Abstract painter with financial fraud conviction - tests pure autonomy argument
  (b) Sculptor accused of abuse making work about consent - classic taint/complicity dilemma
  (c) Photographer with manipulation allegations - hits that epistemic contamination angle

  Right, let's structure this. The core challenge is balancing ethical rigor with practicality. Need gates that force clear yes/no decisions where possible, but flag when it's unavoidably subjective. Must avoid false precision - some calls will always be value judgments. 

  Key principles emerging:
  First gate should be factual verification - no point debating unverified rumors. Then separate whether the work itself perpetuates harm (direct taint) before considering institutional context. Epistemic contamination is trickiest - that's about whether appreciating the art requires willful ignorance. 

  Ah! The "handoff points" are crucial. Like in case (b), if the work explicitly thematizes the misconduct, that's a judgment call about contextualization. Can't algorithmize that. 

  For the disliked outcome... case (a) might be surprising. An abstract painter seems "safe" but if the fraud exploited the art world, displaying it could feel like endorsement. That'll sting if they wanted autonomy to win. 

  Biggest gap: This framework can't handle "bad but great" dilemmas. If a work is ethically problematic but transformative art, the procedure will flag it for human judgment but can't resolve the tension. Also struggles with community-specific harms that outsiders might miss. 

  Better avoid art-theory jargon. "Autonomism" becomes "artistic merit stands alone", "epistemic contamination" becomes "does appreciating this require ignoring harm?" Keep it museum-worker friendly. 

  Final checklist needs to be bulletproof for a tired committee after lunch. Ordered gates with kill switches where appropriate. And absolutely must include what it can't do - no false promises.
answer: |-
  Here's a practical, step-by-step decision procedure for your acquisitions committee, grounded in operationalised philosophical distinctions. It's designed to force clarity, identify true sticking points, and prevent circular debates. **British English, no citations, no fluff.**

  **Core Distinctions Made Operational:**
  1.  **Aesthetic Autonomy:** *Operationalised as:* "Does the artwork's meaning/content fundamentally depend on the artist's misconduct to be understood/appreciated?" (If NO, autonomy *might* hold).
  2.  **Moral Taint Transmission:** *Operationalised as:* "Does acquiring/displaying this work *directly* perpetuate, symbolise, or materially benefit from the specific harm caused?" (Focus on *direct* links).
  3.  **Institutional Complicity:** *Operationalised as:* "Would acquiring/displaying this work reasonably be seen as our institution endorsing, excusing, or sanitising the misconduct, given our specific context/mission?" (Considers public perception & institutional values).
  4.  **Epistemic Contamination:** *Operationalised as:* "Does appreciating the work's formal/aesthetic qualities *require* the viewer to actively suppress knowledge of the harm to experience it as intended?" (Focus on viewer experience conflict).

  **The Decision Procedure: A Flowchart-in-Words (45 min/case)**

  **Gate 0: Initial Scoping (5 min)**
  *   **Question:** Has there been credible, publicly documented allegation or confirmation of serious misconduct (financial, physical, sexual, psychological abuse, hate speech, etc.) by the artist *relevant to this acquisition/loan*? (Focus: Severity & Public Knowledge).
  *   **Sufficient YES:** Police reports, court verdicts, credible investigative journalism, multiple corroborated victim statements, artist's credible confession. (Proceed to Gate 1).
  *   **Sufficient NO:** Unsubstantiated rumours, purely private matters with no public impact, minor breaches unrelated to harm (e.g., parking fines). (**STOP: Proceed with standard acquisition process.** No further ethics review needed).
  *   **Ambiguous:** Single allegations lacking public corroboration, complex historical cases with disputed facts. (**HANDOFF:** Committee Chair must decide *before next meeting* if evidence meets the threshold for Gate 1 review. If unsure, default to YES for review).

  **Gate 1: Direct Taint & Autonomy Check (10 min)**
  *   **Question:** Is the artwork *itself* directly implicated in, a product of, or a representation *of* the specific misconduct? (Does the harm materially constitute or enable the work?).
  *   **Sufficient YES (Direct Taint):** Work *is* the fraudulent object; work depicts/glorifies the abuse; work was created *using* stolen funds/victims; work *requires* the misconduct for its existence/meaning (e.g., non-consensual imagery). (**STOP: HARD REJECTION.** Autonomy doesn't apply. Acquisition inherently perpetuates harm).
  *   **Sufficient NO:** Misconduct is biographical, separate from the work's creation and content (e.g., abstract paintings by a fraudster; landscapes by an abuser). (Proceed to Gate 2).
  *   **Ambiguous (Thematic Link):** Work addresses themes *related* to the misconduct but isn't directly *of* it (e.g., power dynamics by an accused abuser; consent by an alleged coercer). (**HANDOFF:** Proceed to Gate 2, but flag for *intense scrutiny* under Complicity & Epistemic Contamination. This is the hardest zone).

  **Gate 2: Institutional Complicity Assessment (10 min)**
  *   **Question:** Would acquiring/displaying this work, *with full public knowledge of the misconduct*, reasonably be interpreted as our institution endorsing, excusing, minimising, or profiting from that harm? Consider:
      *   Our stated mission/values (e.g., promoting equality, safety).
      *   Our local community context & sensitivities.
      *   Potential impact on victims/survivors.
      *   Whether the artist/estate materially benefits.
      *   Whether we'd need to heavily contextualise *against* the work.
  *   **Sufficient YES (Clear Complicity):** Strong victim/survivor groups object; artist/estate benefits significantly; misconduct is recent/severe & directly contradicts core values; display would cause demonstrable harm/distress locally. (**STOP: HARD REJECTION.** Institutional duty overrides autonomy).
  *   **Sufficient NO:** Misconduct is historical/less severe; artist deceased/not profiting; work is of major significance; community/experts support acquisition; robust contextualisation plan exists; minimal direct benefit to perpetrators. (Proceed to Gate 3).
  *   **Ambiguous (Grey Zone):** Strong arguments both ways; significant disagreement likely; contextualisation feels like an apology. (**HANDOFF:** Proceed to Gate 3, but final decision *must* be a committee vote after Gate 3. This is a core value judgment).

  **Gate 3: Epistemic Contamination Test (10 min)**
  *   **Question:** Can a viewer fully engage with the *intended* aesthetic/formal qualities of this work *without* having to consciously suppress or ignore knowledge of the artist's misconduct to appreciate it? (Does the knowledge actively *spoil* or *corrupt* the intended experience?).
  *   **Sufficient YES (Severe Contamination):** Knowledge of the harm makes the work feel repulsive, ironic, or hollow in a way that destroys its intended effect (e.g., a serene work by a violent abuser feels like a lie; a celebration of intimacy by a manipulator feels grotesque). (**STOP: SOFT REJECTION.** Artwork likely fails *as art* for most informed viewers. Reject based on compromised artistic experience).
  *   **Sufficient NO:** The work's formal qualities/aesthetic experience remain compelling and distinct despite biographical knowledge (e.g., powerful abstract forms; technically brilliant but ethically sourced imagery). (**Proceed to Final Recommendation**).
  *   **Ambiguous (Depends on Viewer):** Some might compartmentalise, others cannot; the work invites biographical readings but doesn't demand them. (**HANDOFF:** Committee vote required. Weigh Gate 2 Complicity assessment and Gate 3 ambiguity against artistic merit. Can contextualisation bridge the gap?).

  **Final Recommendation & Director Sign-off (10 min)**
  *   Summarise the path through the gates.
  *   Clearly state the recommendation (Accept / Reject) and primary reason (e.g., "Reject: Direct Taint", "Accept: No Complicity/Contamination", "Accept with Conditions: Contextualisation Plan Required").
  *   **Director's Role:** Signs off *based on the procedure and committee's reasoning*. Can override only with *written justification* referencing the framework/gates, acknowledging deviation. (Ensures accountability).

  **Testing the Cases:**

  1.  **Abstract Painter (Convicted Fraud):**
      *   Gate 0: YES (Conviction).
      *   Gate 1: NO (Canvases not *of* fraud). Proceed.
      *   Gate 2: AMBIGUOUS. (Does acquiring *any* work by a convicted fraudster feel like endorsement? Depends on severity, victim impact, our mission). **HANDOFF.** Flag.
      *   Gate 3: NO (Formal qualities stand alone). Proceed.
      *   **Final:** Committee Vote (leaning Accept if fraud unrelated to art world/less severe; leaning Reject if fraud exploited art world donations/patrons). *You might dislike an Accept here if you feel complicity is automatic.*
  2.  **Sculptor (Accused of Coercive Abuse, Work about Power/Consent):**
      *   Gate 0: YES (Credible public allegations).
      *   Gate 1: AMBIGUOUS (Thematic Link). **HANDOFF.** Intense scrutiny needed. Proceed.
      *   Gate 2: AMBIGUOUS/LIKELY YES (High risk of appearing to endorse/excuse/sanitise via thematic overlap. Potential distress). **HANDOFF.** Flag.
      *   Gate 3: LIKELY YES (Knowledge of allegations makes viewing a work *about* consent by an *accused coercer* potentially unbearable or deeply ironic for many, corrupting the experience). (**SOFT REJECTION**). *Strong candidate for rejection.*
  3.  **Photographer (Alleged Manipulation for Intimate Access):**
      *   Gate 0: YES (Credible allegations).
      *   Gate 1: AMBIGUOUS/LIKELY YES (If the *intimate access* was allegedly obtained *through* manipulation and *is essential to the work*, this approaches Direct Taint). **HANDOFF.** If deemed NOT Direct Taint, proceed cautiously.
      *   Gate 2: AMBIGUOUS/LIKELY YES (Benefiting from potentially exploitative practice; high complicity risk). **HANDOFF.** Flag.
      *   Gate 3: LIKELY YES (Appreciating the "brilliance" of images gained through alleged manipulation forces suppression of ethical concerns). (**SOFT REJECTION**). *Likely rejection.*

  **Where the Procedure Fights Dirty (The Bite):** Case 1 (Abstract Painter) is the most likely to result in an *Accept* you might dislike if the committee leans towards autonomy and minimal complicity ("It's just shapes!"). The procedure forces the complicity debate (Gate 2 Ambiguous) into the open for a vote, rather than letting autonomy automatically win.

  **Honest Gaps & What It Can't Do:**

  1.  **The "Genius Monster" Dilemma:** If a work is deemed *transformatively important* art but scores "YES" or "AMBIGUOUS/HANDOFF" on multiple gates (especially Gates 2 & 3), the procedure flags it for human judgment but *cannot resolve* the core tension between artistic value and ethical cost. The vote will be painful.
  2.  **Shifting Public Morality:** What's "credible" (Gate 0) or "complicit" (Gate 2) changes. The procedure is a snapshot. Review framework annually.
  3.  **Degree of Harm Nuance:** It broadly categorises severity (Gate 0) but finer gradients within "serious misconduct" rely on committee judgment (especially in Gates 2 & 3).
  4.  **Victim/Survivor Primacy:** While considered (Gate 2), it doesn't give victims an automatic veto unless their distress creates clear complicity. Direct consultation isn't mandated (logistically hard, ethically complex).
  5.  **Reproducing Nuanced Debate:** It *stops* circular "autonomy vs. taint" arguments by forcing sequential, operationalised questions. But it loses the richness of that philosophical debate – that's the trade-off for a 45-min decision.
  6.  **Unknown Future Misconduct:** Only deals with *known* allegations at the time of decision.
  7.  **Collective vs. Individual:** Struggles if allegations are against a collective (studio, movement) but the work is by an individual member.

  **Final Advice:** Use this framework rigorously. Record the path through the gates and rationale for each decision. Revisit rejected cases annually if new evidence emerges. Its strength is forcing clarity on *why* a decision is made, not guaranteeing everyone will agree. Good luck.
