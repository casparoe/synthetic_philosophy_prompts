answer: |-
  Dr. Amara Voss settled into the worn leather armchair opposite Dr. Felix Brandt. Sunlight streamed through the tall library windows, illuminating dust motes dancing in the air. "Felix," she began, her voice calm but resolute, "I've been revisiting our old sparring ground: supererogation. Specifically, how the ‘moral budget view’ I’ve been developing challenges the very coherence of the orthodox category you defend."

  Dr. Felix Brandt leaned back, steepling his fingers. "Ah, the moral budget. An intriguing metaphor, Amara, but I fear it dissolves distinctions morality desperately needs. Supererogation exists precisely because duty has limits. Consider the frozen lake scenario: diving in is heroic, praiseworthy, but we don't *blame* the bystander who hesitates, paralyzed by fear or calculation. That hesitation, while perhaps lacking virtue, isn't *wrong*. Duty demanded caution for their own life, perhaps, but not that specific, immense risk. The act exceeds obligation."

  "On the surface, yes," Voss conceded. "But let's examine the underlying structure. Imagine a community facing a fixed stock of morally necessary tasks: preventable harms, unmet needs, imminent rescues. Call this the 'moral budget'. This total burden determines the aggregate obligation the community’s members collectively bear. Now, duty, as traditionally conceived, distributes this burden *provisionally* onto individuals – 'You ought to help X,' 'You shouldn't harm Y.' But crucially, the *total* demand is capped by the budget. When someone performs a supererogatory act – donating a kidney, diving into that lake – they aren't creating surplus good *ex nihilo*; they are discharging a portion of the *existing* aggregate obligation."

  Brandt raised an eyebrow. "So, the diver isn't doing *more* than required; they're doing *someone else's* required bit? That seems a radical redescription. Who exactly bore this 'duty' to dive before the hero acted? Can a duty that no specific person bears, a mere floating obligation, meaningfully be called a *duty* at all? Duty implies an assignable agent."

  "Does it always?" Voss countered. "We readily speak of collective duties – 'Society ought to care for the vulnerable,' 'We must address climate change.' These aren't meaningless phrases. They signify a moral burden distributed, often imperfectly, across a group. The hero, by acting, takes on a disproportionate share of that distributed burden. They draw down the budget, reducing the residual obligation that would otherwise fall on others. The bystander who didn't dive isn't *blameless* because diving was 'beyond duty' in an absolute sense; they are blameless because the hero *already performed the duty that was collectively incumbent upon the group*."

  Brandt frowned thoughtfully. "You relocate the obligation from the individual to the collective. But doesn't this threaten to pathologize ordinary morality? If the hero is merely doing 'our' work, then my standing by isn't neutral or permissible; it’s a failure mitigated only by someone else’s intervention. That jars profoundly with the intuition that the bystander *did nothing wrong*. Their inaction wasn't praiseworthy, but it wasn't forbidden either. Your view seems to turn permissible omission into a kind of moral freeloading."

  "Isn't it, in a sense?" Voss pressed gently. "Not through malicious intent, perhaps, but structurally? When a saint donates a kidney, they aren’t just doing an extra good deed; they are directly preventing the suffering that would otherwise constitute a demand *on someone* – perhaps a diffuse demand on many, but a demand nonetheless. By fulfilling that latent obligation, they reduce the moral burden others carry. The intuition of the bystander's blamelessness survives, Felix, but it’s recast: it’s not that no duty existed; it’s that the duty was fulfilled by another before it could crystallize as a specific demand *on them*. The bookkeeping was settled."

  Brandt shook his head. "I see the mechanics, Amara, but I resist the implication for how we regard heroes. On your view, gratitude seems inadequate, even misplaced. If they've merely paid down a debt we collectively owed, shouldn't our primary response be *indebtedness*? A sense that they have literally lightened *our* load? But we praise heroes precisely for transcending what could be demanded, for a grace that exceeds economy. Your 'moral budget' turns their sacrifice into a transaction within a closed system of obligation."

  "Not a transaction," Voss corrected, "a redistribution. Gratitude is still profoundly apt – gratitude for their willingness to shoulder a terrible burden, for their courage in acting where others might falter, for *taking initiative* to meet the need. But yes, it should be tinged with the awareness that their action wasn't pure surplus; it absorbed a portion of the world's moral burden that might otherwise have landed... well, perhaps on us. It *purchased our moral breathing room*, so to speak. Doesn't that capture the complex mix of awe, gratitude, and unease we often feel?"

  "And what of the hero themselves?" Brandt asked. "Do they understand their act as merely fulfilling a pre-existing, albeit unassigned, duty? Or do they experience it as going beyond? The near-universal intuition of the agent *and* the observer is of surpassing ordinary demands. Isn't your analysis exposed as reductive, explaining away the phenomenology rather than capturing it?"

  "The phenomenology is real," Voss acknowledged. "The hero *feels* they are doing something extraordinary, beyond the call. My point is that this feeling, while psychologically potent, might reflect an incomplete grasp of the moral economy. We experience duty as individual because that's how it usually manifests concretely. The budget view reveals a deeper, collective structure where individual obligations are fungible parts of a whole. The hero's act *is* extraordinary in its demandingness and the agent's virtue, but not in its fundamental *moral category* – it’s still discharging a necessary part of the budget, just a part most wouldn't, or couldn't, discharge themselves."

  Brandt sighed, tapping his finger on the armrest. "So, the crux remains: does your view *dissolve* supererogation or merely *redescribe* it? You claim the former – that what we call supererogatory is actually the performance of duty, albeit redistributed. I argue it's the latter: you've offered a novel account of *how* collective obligations might work, but you haven't eliminated the core distinction between what is strictly required *of a specific individual* and what exceeds that requirement, even if it meets a collective need. The category survives because duty, meaningfully, attaches to agents. A 'duty' borne by no one in particular is a contradiction in terms, a ghost obligation. Your budget is a useful heuristic for the *amount* of good needing doing, but it doesn't convert every possible good act into someone's duty."

  Voss met his gaze steadily. "And I maintain that the orthodox view mistakes the *distribution mechanism* for the *nature* of the obligation. The requirement is fundamentally tied to the existence of the need within the moral community, not its prior assignment. The hero steps into the gap not of non-obligation, but of unallocated obligation. The feeling of exceeding duty is an artifact of our individualistic moral accounting, not a revelation of metaphysical truth. The surplus is illusory; it’s all just the necessary work of meeting the budget."

  Brandt gave a small, conceding nod. "I grant the power of your collective framework for understanding moral demands, Amara. It illuminates why supererogation often *feels* like it relieves others. But I cannot accept that the blamelessness of the non-heroic bystander rests solely on the hero's prior action fulfilling a ‘duty’ they supposedly bore. The bystander’s inaction is permissible because the *demand* for that specific, high-cost act never landed squarely *on them* as an individual obligation in the first place, not because it was retroactively paid by another. The structure of duty protects the individual from being required to make *every* possible sacrifice for the greater good. That protection," he concluded, his voice firm, "is what supererogation preserves, and what your budget, for all its insights, risks eroding by converting collective aspiration into individual debt."

  Voss offered a thoughtful smile. "And I maintain that protection is an illusion fostered by the hero's willingness to act first. The debt exists; we just don't feel it until they pay it on our behalf. We remain," she said, gesturing between them, "divided on whether morality's fundamental unit of obligation is the individual or the collective, and whether an unassigned duty is a duty at all."

  The dust motes continued their silent dance in the sunbeam between them, marking the precise, irreducible point of their philosophical divergence.
