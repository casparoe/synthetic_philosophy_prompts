prompt: |-
  I am a graduate student in distributed systems engineering with no formal background in moral philosophy, but I recently sat in on a seminar outlining demandingness objections to consequentialism: the claim that if morality requires agents to maximize aggregate welfare without limit, it wipes out any protected space for personal projects, intimate attachments, or basic self-preservation, making the theory psychologically unsustainable and unfairly burdensome. I want you to restate this entire debate—the core objection, the standard consequentialist replies that obligations scale with an agent’s capacity and that there is a principled boundary between duty and supererogation, and the counter-reply that such boundaries look ad hoc—using only the vocabulary of fault-tolerant distributed architecture: nodes, global consensus states, local maintenance cycles, fault budgets, graceful degradation, resource exhaustion cascades, and failover thresholds. Be precise in your mapping: treat “moral agent” as “node,” “aggregate welfare” as “global system optimization target,” “personal projects” as “non-critical local processes that preserve node identity and long-term viability,” and “supererogation” as “optional over-provisioning or redundant capacity beyond the service-level agreement.”

  After completing the translation, deliver the residue report: identify which philosophical arguments map cleanly onto engineering trade-offs (for instance, the claim that a node should not be required to burn all CPU and memory on global state synchronization to the point of local crash), which require conceptual distortion (for example, importing normative language like “unfairness” into a framework that only recognizes load imbalance and thermal throttling), and whether the phenomenological core of the objection—the sense that relentless maximization erodes the agent’s stable identity or capacity for attachment—has any structural analogue in distributed systems at all. I need you to assess whether that absence reveals a genuine limitation in using engineering metaphors for ethics, or whether it instead suggests the philosophical objection relies partly on non-cognitive intuition that was never as precise as it seemed. Keep the analysis entirely self-contained; do not treat this as a literature review, do not ask me to consult texts I do not have, and do not provide citations or reading lists. I need the conceptual mechanics exposed, not a bibliography.
