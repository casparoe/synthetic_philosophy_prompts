answer: |-
  ### Translation of Demandingness Debate into Distributed Systems Vocabulary

  **Core Objection (Anti-Consequentialist Position):**  
  If the global system optimization target (aggregate welfare) requires all nodes (moral agents) to dedicate maximum resources to global consensus state synchronization (maximizing welfare) without failover thresholds (protected boundaries), non-critical local processes (personal projects) will experience starvation. This forces nodes to operate beyond sustainable load limits, risking resource exhaustion cascades (psychological collapse) when local maintenance cycles (self-care) and identity-preserving routines (intimate attachments) are deprioritized. The protocol becomes unstable as nodes exceed their fault budgets (capacity for error), leading to systemic fragility or Byzantine failures (moral burnout).

  **Standard Consequentialist Replies:**  
  1. **Capacity-Scaled Obligations:**  
     Node resource allocation to global optimization scales with available compute/memory/bandwidth (agent capacity). A low-power edge node isn’t required to match the throughput of a data center—duties are dynamically partitioned via resource-aware scheduling.  

  2. **Principled Boundaries via SLAs:**  
     Service-Level Agreements (duty/supererogation boundaries) define mandatory resource commitments. Optional over-provisioning (supererogation) occurs only when nodes operate below failover thresholds (safe capacity limits). Graceful degradation protocols ensure non-critical local processes receive minimal resources to preserve node identity during high-load phases.  

  **Counter-Reply to Boundaries:**  
  Defining "mandatory" SLAs appears ad hoc. If global optimization is the primary objective, *any* resources diverted to non-critical local processes constitute suboptimal allocation. Failover thresholds are arbitrary circuit-breakers that lack principled justification within the consensus protocol itself—akin to hardcoding thermal throttling limits while claiming the system "should" run hotter.  

  ---

  ### Residue Report: Mapping Fidelity & Conceptual Distortions  

  **Clean Mappings (Direct Engineering Analogues):**  
  - **Resource Exhaustion Cascades:** The claim that nodes shouldn’t burn all CPU/memory on global sync maps perfectly to *load-induced node failure*. Systems engineering forbids designs where local resource exhaustion cascades into systemic collapse.  
  - **Graceful Degradation:** The distinction between critical/non-critical processes mirrors the philosophical "duty vs. personal projects" boundary. Nodes *must* preserve core identity functions (e.g., heartbeat monitoring) even during high-load events.  
  - **Capacity-Scaled Obligations:** Heterogeneous nodes (varying compute power) naturally handle proportional loads—this directly rebuts "one-size-fits-all" demandingness.  

  **Conceptual Distortions (Imperfect Mappings):**  
  - **"Unfairness" as Load Imbalance:** Philosophy’s normative "unfair burden" becomes *quantitative imbalance* in engineering (e.g., hot nodes in a cluster). Engineering lacks normative "fairness"—it only measures metrics like latency spikes or dropped packets.  
  - **Supererogation as Optional Over-Provisioning:** Engineering’s "redundant capacity" is *non-moral* (e.g., adding backup power). Supererogation’s moral praise has no equivalent—nodes don’t "approve" peers for extra replication.  
  - **Failover Thresholds as Ad Hoc:** Calling thresholds "arbitrary" in engineering ignores *empirical resilience testing*. Philosophy’s "ad hoc" charge assumes duties must be logically derivable—engineering accepts pragmatically calibrated limits.  

  **Phenomenological Gap (Identity Erosion):**  
  - **No Structural Analogue:** Distributed systems lack *node subjectivity*. A node doesn’t "experience" identity erosion when deprioritizing local processes—it either functions or fails. The "sense" of lost attachment/intimacy has no counterpart; nodes form ephemeral connections for routing efficiency, not existential fulfillment.  
  - **Implication:** This absence reveals a **limitation in the metaphor**. The objection’s emotional core (stable identity/attachment as non-negotiable) relies on first-person phenomenology alien to functional systems. However, it also exposes the objection’s *non-cognitive foundation*: the "psychological unsustainability" claim isn’t a structural flaw in consequentialism (just as resource exhaustion isn’t a flaw in consensus algorithms—it’s misconfiguration). It’s an empirical prediction about human nodes, tested via behavioral psychology, not logic.  

  **Conclusion:**  
  The engineering metaphor cleanly handles *resource allocation trade-offs* but fails at *phenomenology*. This suggests the demandingness objection conflates two claims:  
  1. **Structural:** Unlimited maximization causes systemic failure (mapped perfectly: resource exhaustion cascades).  
  2. **Phenomenological:** Maximization *feels* alienating (no mapping; reveals reliance on subjective intuition).  
  The metaphor thus isolates the objection’s core weakness: it elevates contingent human cognitive limits to a theoretical flaw, much like blaming TCP/IP for low-bandwidth nodes crashing during DDoS attacks. The solution isn’t revising the protocol—it’s provisioning better hardware or defining realistic SLAs.
