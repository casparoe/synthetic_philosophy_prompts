prompt: |-
  I keep getting into the same arguement at my local astronomy club. Every time someone brings up SETI or the Drake equation, this one guy waves the whole thing off with "where is everybody?" and acts like he's just settled it. I don't even disagree with him half the time, but I have trouble saying exactly what's wrong with the move, because honestly I'm not sure what that one-liner is even claiming. Sometimes I read it as just "we haven't detected any yet," which would be trivially true and wouldn't settle anything, and other times it seems to smuggle in a whole story about how a colonizing civilization would've filled the galaxy by now, which is a much bigger claim. Can you lay out the distinct precise claims "where is everybody?" could be making in Fermi-paradox debates, ranging from the trivial to the genuinely substantive, and say which of those readings would actually support his conclusion that looking for technosignatures is a waste of time? I'd like it as a list I can bring to the next meeting.
reasoning: |-
