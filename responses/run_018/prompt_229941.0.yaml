prompt: |-
  A friend and I argued until late last night about who ought to have the vote, and I left convinced that she was applying a principle she never stated -- and that, on the one case that mattered most, she departed from it. I want to reconstruct her principle from her verdicts and check. As best I can reproduce them, she held:

  1. A tourist in the country for two weeks gets no vote, even though the law applies to her for as long as she is there.
  2. A citizen who emigrated twenty years ago but kept her passport, still owns a flat in the capital, and comes back most summers to see family keeps her vote for life.
  3. A non-citizen who has lived in the country for ten years, works, pays taxes, and has children in the local school should vote in every election, national ones included, even if he never naturalises.
  4. No vote for a six-year-old, obviously; pressed about a fifteen-year-old she said almost certainly not, while conceding she could not justify where the line falls.
  5. A prisoner serving a long sentence for a serious crime keeps his vote; taking it away struck her as indefensible.
  6. The residents of a neighbouring country whose air is fouled by a power station just across the border get no vote here, though she allowed that they are owed something -- a hearing, compensation, consultation; not the franchise.

  The case we actually fought over was asylum. The government is redesigning its border and asylum policy -- who is detained on arrival, who is turned back, who is admitted -- and I argued that the people this policy is applied to, none of whom has ever legally set foot in the country, should have some say in shaping it, since no other electorate will ever speak for them. She said no, quickly and confidently: a polity decides its own membership rules, and they are not members. I thought I caught her contradicting her own earlier verdicts, but I could not prove it on the spot.

  So: what principle or principles would generate verdicts 1 through 6 as she gave them? I assume at least two distinct rules fit the record equally well -- identify them, note the riders each one needs (the tourist, the teenager), and say what each predicts about the asylum case. Then tell me whether her "no" is the verdict her track record actually commits her to, which of the six precedents is the closest analog to the asylum case and why, and -- if the record genuinely underdetermines the answer -- what principle she would be adopting by saying yes and what principle by saying no. Finally, name a case, different from all of the above, whose verdict would force the two candidate rules apart.
reasoning: |-
  Hmm, the user is presenting an interesting puzzle about reconstructing their friend's voting franchise principles from specific verdicts. They want to understand what underlying principle(s) would generate those six judgments, and then apply it to the asylum case they argued about. 

  First let me analyze each verdict systematically. The tourist (1) and long-term resident non-citizen (3) form a clear contrast - temporary presence vs deep societal integration. The emigrant (2) and prisoner (5) both maintain rights despite physical absence/legal status, suggesting some permanent bond. The age exclusion (4) is about capacity rather than connection. The cross-border pollution case (6) introduces affectedness without membership.

  For principles... I see two strong candidates emerging. The first is Societal Membership: voting rights based on being subject to society's rules with no exit option. This explains why the tourist (can leave) doesn't vote but the resident (embedded) does. The emigrant keeps it because citizenship is permanent. The prisoner stays in society literally. But it struggles with teenagers - they're members but excluded.

  The second principle is Political Community Consent: voting as a function of the existing electorate's agreement. This easily handles the emigrant (grandfathered in), prisoner (not stripped), and tourist/expat (never admitted). But it fails the resident non-citizen unless we add a "deemed consent" rider for integrated residents.

  Now for the asylum case... Both principles would say "no vote" but for different reasons. Societal Membership excludes them because they're not yet subject to the society's rules in the same way. Political Community Consent says the existing polity decides who joins. The closest analog is actually the tourist case (1) - both are temporary presences subject to rules but not integrated.

  If she said "yes" to asylum seekers voting, that would imply an Affected Interests principle - which her verdict (6) explicitly rejected for cross-border pollution. So her "no" is consistent with both possible principles from her record.

  To force the principles apart... A stateless child born and raised in the country but without citizenship papers. Societal Membership would grant voting rights (deep integration), while Political Community Consent might not (no formal admission).
answer: |-
  Based on your friend's verdicts, two distinct principles emerge as plausible candidates to explain her positions. Both require some riders to handle edge cases like the tourist and the teenager. Here's the reconstruction, analysis, prediction for the asylum case, and a test case:

  **Candidate Principle 1: Societal Membership & Subjection**
  *   **Core Idea:** Voting rights belong to those *irrevocably subject* to the society's governing rules *as members*, meaning they cannot easily exit the system and are deeply integrated into its structure. This is about *de facto* membership and enduring subjection.
  *   **Riders Needed:**
      *   *The Tourist (Verdict 1):* Exclusion justified by temporariness and easy exit. They are subject to laws *while present* but lack the enduring, inescapable subjection and integration of a member.
      *   *The Teenager (Verdict 4):* Exclusion justified by an assumed lack of sufficient capacity/judgment for self-governance, despite being a subject member. The line is arbitrary but necessary.
  *   **Fit:**
      *   *Emigrant (Verdict 2):* Keeps vote because citizenship signifies enduring membership/subjection. Ownership and family ties reinforce *de facto* connection. She cannot easily escape the polity's long-term influence or obligations.
      *   *Long-Term Resident Non-Citizen (Verdict 3):* Votes because ten years of residence, work, taxes, and family integration create *de facto* societal membership and irrevocable subjection to the rules. They cannot "leave" their life built within the society.
      *   *Prisoner (Verdict 5):* Keeps vote because incarceration doesn't erase societal membership or subjection to its rules; it intensifies it. Removal is seen as an extra punishment.
      *   *Cross-Border Residents (Verdict 6):* Excluded because, while *affected*, they are not *members* subject to the *comprehensive* governing framework. They belong to a *different* polity. Remedies (hearing, compensation) acknowledge affectedness without granting membership rights.
  *   **Prediction for Asylum Case:** **NO VOTE.** Asylum seekers, even those subject to border/detention policies, are not yet *members* of the society. They are *seeking* entry/subjection, not irrevocably subject within it. The polity defines its membership, and they fall outside it (like the tourist, but seeking permanence).

  **Candidate Principle 2: Consent of the Governed (Expansive)**
  *   **Core Idea:** Voting rights belong to those whose lives are *governed* by the polity's rules *and* whose inclusion is consented to (explicitly or implicitly) by the *existing political community* as part of "the governed." Consent can be formal (citizenship) or functional (deep, long-term integration accepted by the community).
  *   **Riders Needed:**
      *   *The Tourist (Verdict 1):* Exclusion justified by lack of enduring governance and lack of community consent for temporary visitors to vote.
      *   *The Teenager (Verdict 4):* Exclusion justified by an assumption that minors lack the capacity necessary to meaningfully participate in the "consent" process (self-governance). Capacity is a precondition for exercising the right derived from being governed.
  *   **Fit:**
      *   *Emigrant (Verdict 2):* Keeps vote because citizenship represents formal, enduring consent by the community. The community hasn't revoked this consent despite absence (reinforced by property/family ties).
      *   *Long-Term Resident Non-Citizen (Verdict 3):* Votes because their deep integration (work, taxes, family) implies *functional* consent by the community to treat them as part of "the governed," even without formal naturalization. The community accepts their stake.
      *   *Prisoner (Verdict 5):* Keeps vote because being governed (intensely) doesn't cease, and the community's initial consent (via citizenship) isn't revoked by crime. Removal is seen as disenfranchisement beyond just punishment.
      *   *Cross-Border Residents (Verdict 6):* Excluded because, while affected, they are governed by a *different* political community. The affectedness doesn't imply consent by *this* community to include them as voting members of "the governed." Remedies exist outside the franchise.
  *   **Prediction for Asylum Case:** **NO VOTE.** Asylum seekers are governed by the *border policy*, but they are not yet part of "the governed" *within* the polity consented to by the existing community. Granting them the vote *before* admission would violate the community's right to decide its own composition via consent (formal or functional integration). They are petitioners, not yet consented members.

  **Analysis of Asylum Case & Her Verdict:**

  1.  **Her "No" Verdict:** **Yes, her track record genuinely commits her to "NO" for the asylum case under *either* plausible principle.** Both principles emphasize that the asylum seekers are not yet *members* (Principle 1) or *consented members of the governed community* (Principle 2). Granting them the vote would violate the core idea that the *existing* polity defines its membership/consents to who is part of the governed body entitled to vote on its rules.
  2.  **Closest Analog:** The **Tourist (Verdict 1)** is the closest analog.
      *   **Why:** Both the tourist and the asylum seeker are physically present (or seeking presence), subject to specific laws/rules *during that presence* (or potential presence), but lack the *enduring, integrated membership* or *consented inclusion in the governed community* required for the franchise. The duration (2 weeks vs. indefinite detention/asylum process) is less relevant than the fundamental lack of established membership status within the society being governed. The cross-border residents (6) are also excluded, but they belong to *another* polity entirely, whereas the tourist/asylum seeker are physically interacting with *this* one, making them closer analogs than the cross-border group.

  **Underdetermination & Principles Implied by Yes/No:**

  *   **Her Record:** Genuinely **underdetermines** between Principle 1 (Societal Membership/Subjectiom) and Principle 2 (Consent of the Governed). Both fit the six verdicts equally well with their respective riders.
  *   **Principle Implied by YES on Asylum:** Saying "yes" would imply an **"Affected Interests"** principle: Anyone significantly affected by a specific government policy should have a vote *on that policy*, regardless of membership status. This directly contradicts her rejection of this principle in Verdict 6 (cross-border pollution).
  *   **Principle Implied by NO on Asylum:** Saying "no" is consistent with *both* Principle 1 and Principle 2, reinforcing the idea that voting requires membership or inclusion consented to by the existing political community, not merely being affected.

  **Test Case to Force the Principles Apart:**

  *   **The Case:** A **stateless person** born and raised entirely within the country, speaks the language fluently, has lived there 30 years, works, pays taxes, has children born there (who are also stateless), but has never been granted citizenship due to bureaucratic complexities or gaps in the law. They have no other citizenship or connection to another country.
  *   **How it Forces Apart:**
      *   **Principle 1 (Societal Membership/Subjection):** Would **GRANT** the vote. This person is *de facto* a member. They are irrevocably subject to the society's governing rules with no exit option and deep integration. Citizenship is just a formal label; their lived reality defines membership.
      *   **Principle 2 (Consent of the Governed):** Would likely **DENY** the vote. While deeply integrated and governed, the *political community* has not formally *consented* to their inclusion via citizenship. The lack of citizenship signifies a lack of formal community consent, and their functional integration hasn't been deemed sufficient *by the community* to imply consent (unlike Verdict 3, where functional integration *was* sufficient, suggesting citizenship isn't the absolute requirement, but the lack of it here might be seen as withholding consent). Her verdict on this case would reveal whether formal consent (citizenship) is ultimately required, or if deep functional integration *without* formal status still triggers the "consent" mechanism. Principle 2 is more ambiguous here, leaning towards denial without formal status, contrasting sharply with Principle 1's clear inclusion.
