   Step 2: Joint affirmation without explosion? We can say: "String theory predicts X, loop quantum gravity predicts not-X." We can restrict explosion by adopting a paraconsistent logic. But this does not lead to arbitrary falsehoods because we are in a highly theoretical domain.

   Step 3: Shared background premises to abandon? We might have to abandon the idea that space-time at the Planck scale must have a single consistent description. This is a deep metaphysical assumption.

   Step 4: Consistency as regulative ideal or testable constraint? In quantum gravity, consistency is an empirically testable constraint in principle (if we could test at the Planck scale) but currently is a regulative ideal. However, we are forced to treat it as a regulative ideal because we cannot test it now.

