   But editorial judgment resists because the audience would interpret this as scientists being clueless.

   What does adopting the dialetheic framing cost in explanatory coherence? We lose the principle that the world is consistent. This might undermine the audience's trust in science as a coherent enterprise. It also makes the story harder to explain because the general audience is not familiar with dialetheism.

   In this case, we might override the procedure and frame it as a resolvable paraconsistent inconsistency (calling for future experiments) even though the procedure said dialetheic. The point where judgment supersedes logic is at the stopping condition: we are concerned about audience misinterpretation.

   Finally, we need a case to distinguish between dialetheism as a metaphysical thesis and paraconsistency as a logical tool.

   Case 4: A case that distinguishes:
     - Suppose we have two studies on the same biological system. Study A, using genetic knockout, shows that gene X is necessary for process P. Study B, using a different method (e.g., RNA interference), shows that gene X is not necessary for process P. Both studies are methodologically sound and peer-reviewed.

     - The contradiction: Gene X is necessary and not necessary for P.

     - If we use the procedure:

       Step 1: Contextual? The methods are different (knockout vs. RNAi), so it's contextual.

       Step 2: We can jointly affirm: "Under knockout conditions, gene X is necessary; under RNAi conditions, it is not." This doesn't lead to explosion.

       Step 3: Shared background: We might have to abandon the idea that the necessity of a gene is context-independent. Maybe the method of intervention matters (e.g., knockout is more complete than RNAi).

       Step 4: Consistency as regulative ideal? It's an empirically testable constraint: we can design experiments to see why the two methods give different results.

     - Stopping condition: This is a resolvable paraconsistent inconsistency. We don't need to say that the gene is both necessary and not necessary in the same context. We can resolve it by investigating the methods.

     Now, what if we found that in the exact same context (same cell type, same conditions) both results hold? That is, if we do both experiments in the same lab, and the knockout shows necessity and the RNAi (in the same cells) does not? And we have ruled out experimental error?

     Then:

       Step 1: Formal? Yes, same context.

       Step 2: We can jointly affirm without explosion? We can say: "In this context, gene X is necessary and not necessary." But we must restrict explosion.

       Step 3: Shared background: We must abandon the idea that necessity is a binary property that cannot be contradictory. We might have to abandon the principle of bivalence for genetic necessity.

       Step 4: Consistency as regulative ideal? We might treat it as a testable constraint, but if we cannot resolve it, then we might have to consider it as a dialetheic tension.

     However, the key is: if the user of the procedure is only committed to paraconsistency as a tool, they would always try to find a way to resolve the contradiction (by looking for hidden contexts or errors) and would not accept a dialetheic conclusion. They would keep it as a resolvable inconsistency.

     But if the user is committed to dialetheism as a metaphysical thesis, they might be more willing to accept that in some rare cases, reality is contradictory.

     Therefore, the distinguishing case is one where we have a formal contradiction in the same context and after rigorous replication, the contradiction persists. The dialetheist (metaphysical) would say: this is a real dialetheia. The paraconsistency-as-tool user would say: we must keep investigating until we resolve it, or if we cannot, we suspend judgment or accept that our models are inconsistent but not that the world is.

     So the case: A persistent formal contradiction in the same context that survives all attempts at resolution (after extensive replication and error checking). The procedure would then recommend dialetheic framing. The user who accepts that framing is metaphysically dialetheic. The user who rejects it and says "we must have made a mistake somewhere" is only using paraconsistency as a tool.

   Let's now write the procedure as a sequence of questions:

   Decision Procedure for Contradictory Studies

   Step 1: Is the contradiction formal or contextual?
     - Formal: The studies make claims that are directly contradictory (same subject, same conditions, same time, etc.) and use the same definitions.
     - Contextual: The contradiction arises from differences in models, scales, auxiliary assumptions, or definitions.

     If contextual, go to Step 2 with note that we are likely dealing with a resolvable inconsistency.
     If formal, go to Step 2 with note that we might be facing a dialetheia.

   Step 2: Can we jointly affirm both claims without leading to arbitrary false conclusions (explosion)?
     - Consider: "Claim A is true in context X, Claim B is true in context Y" (if contextual) or "A and not-A are both true" (if formal).
     - We can avoid explosion by restricting certain inference rules (like disjunctive syllogism or the principle of explosion itself). We do this by holding that the contradiction does not make every proposition true.

     If we can avoid explosion, go to Step 3.
     If we cannot (i.e., the contradiction seems to entail everything), then one of the studies must be wrong (go to stopping condition: straightforward error). However, note that in paraconsistent logics we can avoid explosion, so this step is about whether we can frame the claims in a way that avoids explosion in a paraconsistent setting.

   Step 3: What shared background premises must be abandoned if we accept the contradiction as real?
     - Example: we might have to abandon the assumption that the phenomenon under study is consistent.

   Step 4: Is scientific consistency in this case a regulative ideal (something we aim for but may not achieve) or an empirically testable constraint?
     - This is a normative judgment. If it's a regulative ideal, then we might be more open to dialetheic framing. If it's testable, then we can treat the contradiction as a call for more research.

   Stopping Conditions:

     - If the contradiction is contextual and we can avoid explosion (Step 2) and we are not forced to abandon too much background (Step 3), and consistency is a regulative ideal (Step 4), then classify as resolvable paraconsistent inconsistency. Frame the story as: "Two studies using different approaches show conflicting results, highlighting the complexity and the need for further research."

     - If the contradiction is formal, we can avoid explosion, and we are willing to abandon the background premise of consistency (and Step 4 suggests that consistency is not testable or not achieved in this domain), then classify as real dialetheic tension. Frame the story as: "Both studies appear to be correct, and their contradictory conclusions may reflect an inherent tension in the phenomenon itself, which challenges our classical understanding of consistency."

     - If at any point we cannot avoid explosion (i.e., the contradiction would make every statement true, which we reject) or if the shared background premises we must abandon are too foundational (like the entire scientific framework), then we conclude that at least one study is straightforwardly erroneous. Frame accordingly.

     - If the procedure does not clearly point to one of the above (e.g., we are unsure about Step 3 or Step 4, or we have a formal contradiction but we are not willing to abandon consistency), then we mark it as a failure and hand it to editorial judgment. The editor must decide based on audience understanding and potential misinterpretation.

   Failure Conditions:
     - The procedure fails to settle the framing when we reach an impasse in Step 3 (we are not willing to abandon the background) or Step 4 (we cannot agree on the status of consistency). Also, if we are uncertain about the formal vs. contextual distinction.

   Now, we apply this written procedure to the three cases again briefly to demonstrate:

   Case 1: Climate models
     Step 1: Contextual (different parameterizations). So we go to Step 2 with a note of resolvable.
     Step 2: We can jointly affirm without explosion: "Model M1 predicts increase, M2 predicts decrease." We avoid explosion by not inferring arbitrary claims.
