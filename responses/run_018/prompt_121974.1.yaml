prompt: |-
  I spent thirty years as a field ornithologist studying avian speciation across Pacific archipelagos, and since retiring I have been auditing graduate seminars in philosophy of science. I am planning a single 90-minute workshop for approximately ten philosophy graduate students who have encountered the standard literature on the species problem but have never faced live classification ambiguity with practical stakes. I want an in-class activity—not a lecture or debate—where participants must apply competing species concepts to a deliberately constructed set of cases: specifically, a ring species exhibiting asymmetric gene flow across an island chain, paired with a cryptic species pair that are genetically distant but ecologically identical in every observable behavior and habitat. The rules and roles should be arranged so that the group divides into three functional positions—taxonomist, conservation lawyer, and evolutionary theorist—each forced to render a binding classification decision on whether the organisms in question constitute one species or several, with that decision then triggering a predetermined downstream consequence (for example, a conservation funding allocation or an explanatory framework for a subsequent evolutionary prediction). The point is not for them to reach consensus but for them to feel the pull of lumping versus splitting as a practical commitment rather than an abstract preference. After the exercise, provide a debrief that maps specific moments of disagreement onto the metaphysical commitments of the biological, phylogenetic, and morphological species concepts, and include an honest note on which feature of the problem—perhaps the temporal boundary problem or the normative dimension of classification—this staged scenario cannot reproduce and I must supply in discussion myself. Also tell me what will predictably go wrong the first time I run this, particularly given that the participants will be philosophy students with no field experience, and how I should handle it. Write this in a formal register appropriate for a workshop proposal, and avoid asking for bibliographies, reading lists, or citations, since I want the design to stand on its own logic.
reasoning: |-
  Okay, the user is a retired ornithologist with extensive field experience studying avian speciation in the Pacific, now auditing philosophy of science seminars. They're preparing a 90-minute workshop for about ten grad students in philosophy who understand the species problem theoretically but lack practical experience with ambiguous classification scenarios. The goal is to create an interactive activity—not lecture or debate—where students apply competing species concepts to two constructed cases: a ring species with asymmetric gene flow and a cryptic species pair genetically distant but ecologically identical. 

  The design requires dividing students into three roles—taxonomist, conservation lawyer, evolutionary theorist—each making binding classification decisions with downstream consequences (e.g., funding allocation or predictive frameworks). The aim isn't consensus but making them feel the practical weight of lumping vs splitting. Post-activity debrief should connect disagreements to metaphysical commitments of biological, phylogenetic, and morphological species concepts, while noting what the scenario can't capture (like temporal boundaries or normative dimensions). Also needs predictions of what could go wrong with philosophy students (no field experience) and mitigation strategies.

  Hmm, key challenges here: making abstract philosophy tangible through role-play, ensuring the cases trigger genuine tension between concepts, and preventing theoretical nitpicking from derailing the exercise. The user's expertise means they'll spot oversimplifications, so cases must be biologically plausible. The ring species scenario needs asymmetric gene flow that challenges lineage-based concepts, while the cryptic pair should force a clash between genetic divergence and ecological/behavioral unity. 

  For structure: tight 90-minute window means strict timekeeping—15 min intro, 40 min activity (with role prep and decision phases), 20 min debrief, 15 min buffer. Roles must have clear stakes: taxonomist (ICZN rules, museum collections), lawyer (Endangered Species Act implications), theorist (evolutionary model coherence). Downstream consequences should hurt: e.g., misclassification cuts funding or invalidates predictions. 

  Predictable issues: philosophy students might over-intellectualize ("But what *is* a species really?") instead of deciding, or resist role constraints. Mitigation: emphasize this is simulation, not reality; use timer visibly; inject "crisis" elements like urgent funding deadlines. Also, they might miss ecological intuition—briefing packets should include mock field notes to ground decisions. 

  The debrief is crucial. Need to explicitly map:
  - Lawyer's funding argument → Biological Species Concept (reproductive isolation)
  - Theorist's model choice → Phylogenetic Species Concept (monophyly)
  - Taxonomist's exhibit labels → Morphological Species Concept (diagnosability)
  ...and confess the scenario can't handle temporal dynamics (e.g., ring species as snapshot of speciation in progress) or how values shape concepts—that's for the user to unpack verbally. 

  Final note: stress this is about *experiencing* classification as action, not solving the species problem. The user's war stories will bridge theory-field gaps during debrief.
answer: |-
  ## Workshop Proposal: Operationalizing the Species Problem  
  **Title:** Taxonomic Triage: Species Concepts in Practice  
  **Duration:** 90 minutes  
  **Participants:** 10 philosophy graduate students (familiar with species problem literature)  
  **Pedagogical Goal:** To simulate the material consequences of species delimitation under competing conceptual frameworks, forcing participants to commit operationally to "lumping" or "splitting" in contexts where theoretical ambiguity carries practical costs.  

  ---

  ### **Activity Design: "The Archipelago Decision Protocol"**  
  **Phase 1: Case Briefing & Role Assignment (10 minutes)**  
  - Participants receive two dossiers:  
    - **Case A (Ring Species):** *Insula avis pacifica* – A seabird distributed across 6 islands (I1–I6). Genetic data show clinally increasing divergence from I1 → I6, with asymmetric gene flow (I5→I6 migration = 10%; I6→I5 migration = 0.1%). Morphological variation is clinal; birds from I1/I2 hybridize freely in captivity, I6 birds will not mate with I1 birds.  
    - **Case B (Cryptic Species):** *Nox phasma insularis* – A nocturnal forest bird. Two populations (East/West) are genetically divergent (F<sub>ST</sub> = 0.32), occupy identical ecological niches, respond identically to playback calls, and are morphologically indistinguishable without molecular assays.  
  - Participants divide into three groups, each assigned a stakeholder role with binding authority and consequences:  

  | **Role**               | **Primary Mandate**                                          | **Decision Consequence**                                   |  
  |------------------------|-------------------------------------------------------------|------------------------------------------------------------|  
  | **Taxonomist**          | Apply ICZN-like rules for specimen classification.          | Determines museum collection/research funding allocation. Splitting = 2x funding for revisionary taxonomy. |  
  | **Conservation Lawyer** | Enforce an Endangered Species Act-like statute.             | Triggers habitat protection: Splitting = critical habitat designation for smaller ranges. |  
  | **Evolutionary Theorist** | Generate testable predictions about speciation mechanisms. | Splitting validates/clashes with proposed gene-flow models in pending publication. |  

  **Phase 2: Deliberation & Binding Decision (40 minutes)**  
  - Groups separately deliberate for 20 minutes. Each group **must** render a verdict for both Case A and Case B: **"One Species" or "Multiple Species."**  
  - Groups receive role-specific decision forms requiring written justification invoking species concepts (BSC, PSC, MSC).  
  - Facilitator circulates to enforce role constraints (e.g., "As a lawyer, you cannot appeal to phylogenetics if it conflicts with statutory definitions").  

  **Phase 3: Consequence Implementation & Reveal (15 minutes)**  
  - Groups announce decisions simultaneously. Facilitator displays pre-scripted outcomes:  
    - *e.g., Taxonomists split Case A → $1M allocated to re-catalog museum specimens; Lawyers lump Case B → no habitat protection for genetically distinct population; Theorists split Case B → model of sympatric speciation is prioritized for funding.*  
  - Groups record how their decisions altered material/epistemic conditions.  

  ---

  ### **Debrief Structure (20 minutes)**  
  1. **Mapping Disagreements to Metaphysics:**  
     - *Ring Species (A):* Lawyer’s focus on reproductive isolation (BSC) vs. Taxonomist’s morphological continuity (MSC) vs. Theorist’s emphasis on incipient lineage formation (PSC). Highlight how asymmetric gene flow exposes the BSC’s vulnerability to contingent barriers.  
     - *Cryptic Species (B):* Lawyer’s reliance on diagnosable characters (MSC) vs. Theorist’s genetic divergence (PSC) vs. Taxonomist’s caution without morphological evidence. Emphasize the MSC’s failure when morphology decouples from lineage history.  

  2. **Limitations of the Simulation:**  
     - **Temporal Boundaries:** This scenario cannot replicate the *process* of speciation as a temporal continuum. Participants see a "snapshot"; the ambiguity between populations vs. species over deep time remains abstract.  
     - **Normative Levers:** The exercise externalizes normative pressures (e.g., conservation ethics, funding incentives) into predefined rules. Real-world taxonomists *internalize* these pressures, blurring descriptive/prescriptive boundaries. You must explicitly surface this post-activity.  

  3. **Philosophical Tensions to Highlight:**  
     - Whether species are *units of classification* (Taxonomist), *units of legal protection* (Lawyer), or *units of evolutionary process* (Theorist).  
     - How "practical necessity" forces conceptual commitment despite unresolved metaphysics.  

  ---

  ### **Predictable Challenges & Mitigation Strategies**  
  1. **Problem:** Philosophy students may resist role constraints, debating ontology instead of making decisions.  
     - **Mitigation:** Preface: "Your role’s mandate is non-negotiable. Imagine your career depends on acting within these bounds." Intervene firmly: "As the Theorist, your model faces peer review next month – decide now."  

  2. **Problem:** Underestimation of ecological/behavioral data (especially in cryptic pair), leading to over-reliance on genetics.  
     - **Mitigation:** In the dossier, emphasize identical niche occupancy and behavioral responses. Ask probing questions: "Lawyer – if you cannot *observe* differences in the field, can your statute protect what labs find?"  

  3. **Problem:** Attempts to avoid binary choices (e.g., "subspecies" compromises).  
     - **Mitigation:** Rules require "One/Multiple Species" only. State: "The funding statute/museum code/theory model recognizes no intermediate categories here."  

  4. **Problem:** Asymmetric gene flow in Case A may be misinterpreted as directional selection.  
     - **Mitigation:** Provide a simple gene-flow diagram. Clarify during briefing: "This is drift-mediated isolation, not adaptation."  

  ---

  ### **Instructor Notes for Execution**  
  - **Emphasize Stakes:** Open by stating, "Today, your decisions have imaginary but structurally real consequences. There are no ‘correct’ answers – only costly ones."  
  - **Control Timing Rigorously:** Use visible timers. Delay = lost funding/extinct populations in the simulation.  
  - **Post-Activity Bridge:** Conclude by noting: "In fieldwork, these decisions involve decades of observation, unknown variables, and irreversible outcomes. What you felt in 90 minutes is a distillation of why the species problem isn’t solved by conceptual refinement alone."  
  - **Your Crucial Intervention:** During debrief, explicitly state: "This simulation cannot make you feel the *temporal weight* of collecting data across generations of organisms – or the ethical burden of declaring a lineage unprotected. That is where lived experience enters."  

  This design weaponizes philosophical training against itself, forcing abstract knowledge into a constrained, consequentialist framework. The artifice of the scenarios is deliberate; it crystallizes the pressure to act when theory underdetermines practice.
