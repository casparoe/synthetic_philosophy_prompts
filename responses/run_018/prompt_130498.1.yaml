  hey, so i just got out of this 2-hour argument with my friend jess about Hofstadter and whether an 'I' can actually be distributed across brains. she thinks she nailed it, but i feel like she's smushing together a bunch of ideas. she summarized his view like this:

  'Hofstadter thinks the self is just a strange loop—a self-referential pattern of symbols running in the brain. since it's substrate-independent, if two brains run isomorphic enough loops they don't just understand each other, they actually form one distributed 'I' spread across both skulls. that's also why he believes copying your brain patterns after death means the copy IS you continuing, not just a duplicate. and he rejects any non-physical soul, but then he talks about patterns having downward causal power over neurons, which is basically property dualism in disguise.'

  i think she's partly right but also overreaching in a couple spots. can you act like a professional philosopher of mind with some background in cognitive science? please think carefully, maybe start with a quick brainstorm of the key distinctions—like pattern vs substrate, copy vs continuation, emergent causation vs dualism—before you dive in. then go point-by-point: what's accurate, what's a subtle misreading or conflation, and does her charge of inconsistency actually follow? i want to recieve a clear, seperate breakdown for each claim, not just a vague 'it's nuanced'. and pls don't just hand me a reading list—i need to understand the argument itself right now.
