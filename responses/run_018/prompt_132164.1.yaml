  ### Joint Statement: Prediction-First vs. Coupled-Error Philosophers on Friedman's F-Twist in Climate-Econ IAMs  

  We, a "prediction-first" philosopher of science and a "coupled-error" philosopher, have debated the applicability of Friedman's F-twist to climate-economics Integrated Assessment Models (IAMs). Though we disagree on key points, we establish the following common ground and clarify our divergences.  

  #### 1. Agreed Claims  
  1. **On Friedman’s F-Twist**:  
     - Friedman’s argument ("F-twist") asserts that the realism of a model’s *assumptions* is irrelevant to its scientific value. A model with unrealistic assumptions is defensible if its *predictions* are empirically accurate (i.e., "as if" reasoning). The ultimate test is predictive performance, not descriptive fidelity.  

  2. **On IAM Structure**:  
     - IAMs couple distinct modules: a *climate module* (e.g., projecting temperature from emissions) and an *economic module* (e.g., projecting GDP losses from climate impacts). Outputs from one module feed into the other (e.g., economic emissions → climate impacts → economic damages).  

  3. **On Idealization Types**:  
     - *Single-model idealization*: Unrealistic assumptions in one self-contained model (e.g., assuming rational actors in an isolated economic model) may be justified by its predictive success.  
     - *Stacked idealization*: When coupled modules *each* contain unrealistic assumptions (e.g., an oversimplified damage function in economics + a simplified carbon-cycle model in climate science), errors may compound non-linearly due to feedback loops. This is distinct from single-model cases.  

  #### 2. Disagreements Table  
  Each camp’s position, phrased in their own terms for mutual acceptance:  

  | Camp                | Position Statement |  
  |---------------------|-------------------|  
  | **Prediction-First** | "If a coupled IAM’s *final output predictions* (e.g., global GDP/temperature in 2100) fall within empirical error bands, unrealistic assumptions in *any module* are justified under the F-twist. Component-level realism is unnecessary." |  
  | **Coupled-Error**   | "Stacked idealizations break the F-twist defense: predictive adequacy in one module *does not license* unrealistic assumptions in a coupled partner module. Errors may propagate non-linearly, making overall prediction an unreliable metric for component validity." |  

  #### 3. Cruxes of the Dispute  
  We identify two cruxes structuring our disagreement. For each, we agree on a test case and pre-commit to predictions.  

  **Crux (a): Does predictive accuracy in one module license unrealistic assumptions in a coupled partner module?**  
  - **Shared Test Case**:  
    An IAM uses a climate module with *validated predictive accuracy* (e.g., 90% success in hindcasting past temperatures) but pairs it with an economic module containing an *ad hoc damage function* (e.g., assuming climate damages plateau past 3°C due to arbitrary threshold effects).  
  - **Predictions**:  
    - *Prediction-First Camp*: "If the coupled model’s final predictions (e.g., 2100 GDP) match observations within error margins, the damage function’s unrealism is irrelevant. Success licenses the idealization."  
    - *Coupled-Error Camp*: "The damage function’s unrealism will induce systemic errors in scenarios beyond calibration ranges (e.g., 4°C+ worlds). Linearity violations in error propagation will manifest as divergent predictions."  

  **Crux (b): Is there a principled line between ‘as if’ reasoning in physics vs. social science?**  
  - **Shared Test Case**:  
    A physics-based climate module uses "as if" ideal gas laws (known to be false but predictively robust). An economic module uses "as if" rational agents (empirically falsified but sometimes predictive). Both feed into an IAM.  
  - **Predictions**:  
    - *Prediction-First Camp*: "No principled distinction exists. If both ‘as if’ assumptions yield accurate final predictions, both are equally defensible under the F-twist regardless of domain."  
    - *Coupled-Error Camp*: "A distinction exists: physical ‘as ifs’ (e.g., gas laws) rest on stable, mathematically tractable regularities, while social ‘as ifs’ (e.g., rational agents) ignore reflexive human/normative dynamics. Coupling compounds the latter’s instabilities, making F-twist defenses riskier."  

  #### Conclusion  
  We agree that the F-twist’s viability in IAMs hinges on whether stacked idealizations induce non-linear error propagation (Crux A) and whether domain differences invalidate instrumentalism (Crux B). Our test cases offer pathways to resolution. Signed:  
  - **Prediction-First Philosopher**  
  - **Coupled-Error Philosopher**  

