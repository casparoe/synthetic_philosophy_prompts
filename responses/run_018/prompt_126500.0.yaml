  I'm applying for a six-month interdisciplinary research fellowship and need a two-page proposal. I want to examine whether the opposition between the American Dream—treating exceptional achievement as a legitimate, merit-based reward that society should celebrate—and the norms captured by Jantelagen and the tall-poppy syndrome—treating conspicuous success as a moral disturbance that invites leveling—can be reconstructed as a conflict between two axiomatic frameworks for allocating social esteem, rather than as a mere clash of cultural descriptions or psychological attitudes. Specifically, I want to ask: can these norms be formalized as competing distributive principles applied to recognition goods, where one principle ties esteem to counterfactual contribution and desert while the other ties it to equality of status; and does resolving the tension require denying that esteem is a positional, scarce good?

  Write the proposal with: (1) a precise statement of the question that distinguishes this framing from standard sociological, psychological, or political-theory treatments of mobility and equality; (2) an explanation of why existing philosophical work on distributive justice and existing cultural analyses leave this specific axiomatic framing open—particularly the failure to apply formal allocation rules to non-material goods like recognition; (3) the method, laid out month by month, showing how you would reconstruct the two norms as explicit allocation rules for esteem, test whether each can accommodate the intuitive judgments that motivate the other without collapsing into its rival, and examine whether reconceiving esteem as non-positional dissolves the conflict or merely relocates it into institutional design; (4) what a successful result looks like—whether a proof of incompatibility, a reconciliation argument, or a demonstration that the formalization fails—and what would count as failure, such as the collapse of "recognition goods" into vagueness or a purely taxonomic result without normative force; and (5) an honest assessment of whether this is feasible in six months without empirical fieldwork, and where the main risk of overreach lies. Refer to positions and arguments generally; do not include a bibliography, reading list, or citation requests—I will add those later.
