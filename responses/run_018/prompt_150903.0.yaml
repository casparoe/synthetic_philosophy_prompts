  I'm not a student or anything — I just heard about Scanlon's contractualism and the agregation problem on a podcast, and now I'm arguing with my mates about it over coffee. Can you act as an expert in moral philosphy who takes this seriously, thinks carefully, and starts with a bit of brainstoming? I want you to construct a thought experiment for me, built to these exact specs: one paragraph, totally realistic (like a hospital ward or a local council decision, nothing sci-fi), where one identifiable person is facing death or serious harm and can only be saved if every single one of, say, ten thousand other people accepts a genuinely small but real burden — like being exposed to a loud noise for thirty seconds or missing a brief work break — so each one could reasonably reject being made to do it just for a stranger. Crucially, inject this niche feature: the rescue works on a 'silent veto' principle, meaning it's all-or-nothing — if one person opts out, the mechanism fails completely, not just partly. Don't just name-drop the feature; build it into the scenerio. After you've set it up, walk through what Scanlon's contractualism actually says about whether we can impose the burden, versus what a straight-up agregative theory like utilitarianism says. Then tell me precisely which structural feature — the veto, the huge numbers, or the individual rejectability — is doing the moral work, and what happens if you strip that feature away: does it collapse back into a bog-standard agregation case, or does something else weird happen? Please write everything in British English, and don't ask me for bibliographies or citations — I want something a model without web access could actually reason through.
