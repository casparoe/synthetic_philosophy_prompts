answer: |-
  Right then, let's get stuck in. Picture this:

  **The Scenario:** At St. Bartholomew's Hospital, a critically ill patient requires an immediate, highly targeted radiotherapy blast to destroy a fast-growing tumour. The *only* machine capable of delivering it is experimental and has a unique safety protocol: to prevent accidental activation near staff, it requires *simultaneous, continuous* electronic consent from *every single person* within the designated 'safe zone' – a large staff canteen currently holding 10,000 NHS workers on their brief 15-minute break. Each individual must press and hold a green 'consent' button on their phone app for precisely 30 seconds during the procedure. If *even one person* fails to press, or releases the button early, the machine automatically aborts the treatment for safety. The cost to each staff member is minor but real: 30 seconds of their break interrupted by an ear-piercing, 110-decibel alarm (like a smoke detector next to your ear) blaring throughout the procedure – annoying, stressful, momentarily disruptive, but causing no lasting harm. The patient is a stranger to them all. The mechanism is all-or-nothing: one silent 'veto' (not pressing/releasing) completely scuppers the rescue.

  **Scanlon's Contractualism Says:**
  Scanlon asks: "Could any individual, seeking principles no one could reasonably reject, reject a principle demanding they bear this burden to save the stranger?" Here, **yes, each person *could* reasonably reject it.** Their reason is simple: "It's unreasonable to demand *me*, solely because of this peculiar 'silent veto' system, to endure this unpleasant disruption (however brief) *just* to save one stranger's life, when *my individual refusal* is what makes the crucial difference between life and death. My burden, though small, is real and imposed solely for another's immense benefit, and the mechanism unfairly makes *my* compliance the linchpin for the entire endeavour." Because each person can reasonably reject the principle requiring them to bear this burden *under these specific conditions*, imposing it would be wrong. The veto power is absolutely central to this rejection.

  **Utilitarianism (Aggregative) Says:**
  Utilitarianism crunches the numbers: One life saved = immense positive utility (preventing death and suffering). The cost? 10,000 people x 30 seconds of significant annoyance. While unpleasant, this annoyance is fleeting, causes no lasting damage, and is arguably trivial compared to a human life. The *aggregate* disutility of all that noise pales in comparison to the utility of saving a life. Therefore, imposing the burden is not only permissible but *obligatory* – the greater good demands it. The veto system is just an inconvenient technical detail to overcome; the moral maths favours action.

  **The Crucial Structural Feature & What Happens If Removed:**
  The feature doing the *distinctive* moral work for Scanlon is **the combination of the individual's reasonable rejectability of their *specific burden* combined with the 'silent veto' mechanism.**

  *   **Why the Veto + Rejectability?** The veto transforms the situation. It makes each person's individual burden *decisive*. Without the veto, my refusal only slightly reduces the chance of success (if it were a vote or partial contribution). With the veto, my refusal *alone* guarantees failure. This makes the demand on *me* uniquely powerful and the *reason* for my burden – "You *must* do this annoying thing, because if *you* don't, *you* alone will cause this death" – feel intensely personal and unreasonable for such a small burden per person. Scanlon focuses on the justifiability of the demand made *to each individual*, and this veto makes that demand uniquely high-stakes *for them* personally.
  *   **Strip Away the Veto (Keep Numbers & Burden):** Imagine instead the treatment requires 10,000 people to *each* endure the 30-second alarm, but success is probabilistic – maybe each 'consent' increases the success chance by 0.01%. Now, no single person's refusal is decisive. Scanlon's calculus changes significantly. Could one reasonably reject enduring 30 seconds of noise for a 0.01% increased chance of saving a stranger? That rejection looks *much* harder to justify. The burden is the same, the numbers are the same, but without the veto making my refusal *the* cause of death, demanding the burden becomes harder to reasonably reject. **It collapses towards a standard aggregation case where utilitarianism's logic (small individual cost vs. large collective benefit) becomes harder for contractualism to resist.**
  *   **Strip Away Reasonable Rejectability (Keep Veto & Numbers):** Make the burden utterly trivial – say, a barely perceptible flicker of the canteen lights for 30 seconds. Now, could anyone reasonably reject *that* to save a life, even with the veto? "I vetoed the life-saving procedure because I didn't want the lights to flicker imperceptibly" seems patently unreasonable. The veto remains, but the grounds for reasonable rejection vanish. Scanlon would likely say imposition is permissible.

  **The Verdict:** The 'silent veto' isn't just a quirk; it's the engine driving the contractualist refusal in this scenario. It weaponises the individual's reasonable rejection of a small burden by making *that individual* uniquely responsible for the fatal outcome. Remove the veto, and the individual's moral leverage vanishes, leaning towards aggregation. Keep the veto but make the burden negligible, and rejection becomes unreasonable, also leaning towards permissibility. The veto *plus* the genuine individual burden creates the contractualist's distinctive 'No'.
