  For the analysis, I need to contrast Scanlon's contractualism with utilitarianism clearly. Scanlon would focus on whether each person could reasonably reject being burdened to save a stranger. Since the burden is small but real, and they'd bear it solely because of the veto system, rejection seems reasonable - so we couldn't impose it. Utilitarianism would just crunch the numbers: one life saved outweighs thousands of minor annoyances.

  The interesting bit is identifying which feature does the moral heavy lifting. It's not just the veto or the numbers alone - it's how they combine with individual rejectability. If we remove the veto, it becomes standard aggregation where utilitarianism might win. But if we keep the veto while making burdens truly negligible, rejection becomes unreasonable and Scanlon might allow imposition. 

