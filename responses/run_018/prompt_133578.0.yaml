prompt: |-
  I'm a senior editor for a technical standards board and we publish huge regulatory docs made up of like five hundred individual clauses, each vetted seperately by a different working group. Right now my team has no real framework for deciding clause-by-clause whether we "accept" it into the standard, reject it, or punt it upstairs — and the problem is straight out of the preface paradox plus the lottery problem. Any single clause looks 99% likely correct, but with hundreds of them we know some errors will definitely get in. I want you to turn that philosophical mess into an actual decision proceedure my reviewers can run in about twenty minutes per clause, with ordered questions, what counts as a sufficient answer, where it stops with a hard no, and where it has to hand off to a human because it's a values call not a probability call. Don't flatten out the distinction between "accepting for practical reasoning" and "believing it's true" — that has to survive in the steps somehow. I also want you to build in a kind of document-level "error budget" idea, where acceptance of one clause affects the risk pool for the rest, since that's the only way the lottery logic makes operational sense here.

  Apply this to three cases: a routine typography/formatting clause; a pedestrian-bridge structural-load clause where expert confidence is 99.2% but being wrong kills people; and a climate-adaptation clause that an industry group is pushing hard for, where the historical base-rate for similar clauses being wrong is high. One of these needs to come out in a way my team genuinely won't like — probably forcing rejection or an expensive delay despite the high confidence number. Then be explicit about what the procedure can't do: for instance, who sets the global error cap, whether we're ever required to reopen accepted clauses, or how to weigh political pressure against the budget.

  Please lead with the bottom line in your first sentence — the single governing rule that replaces a flat belief-threshold — then lay out the reasoning, the checklist in order, the three worked cases (including the unwelcome one), and the hard limits, all with no preamble and without restating my question. Keep it practical, but don't pretend the philosophy disappears.
reasoning: |-
  We are going to implement a decision procedure based on an error budget and the distinction between practical acceptance and belief in truth.

  **Bottom Line Governing Rule:** 
  Accept clauses only when their individual risk-adjusted error probability multiplied by the clause's consequence severity falls within the document's remaining error budget, and always subject to a "values call" override for non-probabilistic concerns.

  **Reasoning:**
  - The document has a fixed maximum acceptable total risk (error budget), set externally (e.g., by the board). 
  - Each clause consumes part of this budget based on two factors: 
    (a) The estimated probability that the clause contains an error (1 - confidence).
    (b) The severity of the consequences if the clause is wrong (e.g., typo vs. life-safety).
  - We maintain a running "remaining budget" that decreases as clauses are accepted.
  - The procedure explicitly separates:
    - **Practical Acceptance:** A decision to include the clause given the budget and risk trade-offs.
    - **Belief in Truth:** An assessment of the clause's likely correctness (confidence) which feeds into the risk calculation but does not solely determine acceptance.

  **Decision Procedure Checklist (per clause):**

  1. **Is this a values call?** 
     - *Check:* Does the clause involve non-probabilistic considerations (e.g., ethical, political, fundamental principles) that cannot be reduced to risk?
     - *Sufficient Answer:* If yes, stop and hand off to human (e.g., board) for a policy decision. Do not use the budget. 
     - *Hard Stop?* Yes, if it's a values call, the checklist stops and the clause goes to the board.

  2. **Calculate the clause's risk cost:**
     - *Check:* 
       (a) Assign a consequence severity level (S) from a predefined scale (e.g., 1=cosmetic, 2=operational, 3=financial, 4=safety, 5=catastrophic). 
       (b) Assign an error probability (P) = 1 - (confidence level). Confidence must be expressed as a decimal (e.g., 99% → 0.99; 99.2% → 0.992).
     - *Risk Cost (RC) = P × S*
     - *Sufficient Answer:* Numeric calculation. If confidence cannot be quantified (e.g., no data, expert disagreement), return to step 1 (treat as values call). 
     - *Hard Stop?* If RC is infinite (e.g., S is catastrophic and P>0) and the budget is finite, then reject. (But note: if the budget is set appropriately, catastrophic risks should have near-zero P to be acceptable.)

  3. **Check against remaining error budget:**
     - *Check:* 
       - Let the total error budget (B_total) be set by the board (e.g., 10 "risk units" for the entire document). 
       - Subtract the RC of every previously accepted clause from B_total to get the remaining budget (B_remaining).
       - Compare RC of current clause to B_remaining.
     - *Sufficient Answer:*
       - If RC <= B_remaining → ACCEPT (and deduct RC from B_remaining).
       - If RC > B_remaining → REJECT.
     - *Hard Stop?* Yes, if RC > B_remaining, reject. (Unless step 1 overrides, but step 1 already handled values.)

  4. **Post-acceptance adjustment (if any):**
     - *Check:* After accepting, note if this clause's acceptance changes the risk profile of the document (e.g., by introducing a new dependency that amplifies other risks). 
     - *Sufficient Answer:* If yes, recalculate the risk costs of affected clauses (may require revisiting previous decisions). 
     - *Hard Stop?* No, but if recalculations cause budget overrun, the board must be alerted and may need to reopen clauses.

  **Worked Examples:**

  1. **Routine Typography/Formatting Clause:**
     - Step 1: Not a values call (purely technical). Proceed.
     - Step 2: 
       - S = 1 (cosmetic: if wrong, only affects appearance)
       - Confidence = 99% → P = 0.01
       - RC = 0.01 × 1 = 0.01
     - Step 3: 
       - Assume B_remaining is 5.0 (plenty left)
       - 0.01 <= 5.0 → ACCEPT.
       - Deduct 0.01 from budget → B_remaining becomes 4.99.
     - Outcome: Accepted. Team is happy.

  2. **Pedestrian-Bridge Structural-Load Clause:**
     - Step 1: Not a values call (technical safety). Proceed.
     - Step 2:
       - S = 5 (catastrophic: failure causes deaths)
       - Confidence = 99.2% → P = 0.008
       - RC = 0.008 × 5 = 0.04
     - Step 3:
       - Assume B_remaining is 0.05 (after previous clauses)
       - 0.04 <= 0.05 → ACCEPT (barely).
       - Deduct 0.04 → B_remaining becomes 0.01.
     - Outcome: Accepted. Team might be nervous because the budget is now very tight, but the math allows it.

  3. **Climate-Adaptation Clause (Industry-Pushed, High Error Base-Rate):**
     - Step 1: Not a values call? Let's say: the industry pressure is political, but the clause itself is technical. However, the high base-rate of errors in similar clauses might indicate systemic issues. We proceed cautiously.
     - Step 2:
       - S = 4 (safety: if wrong, could lead to unsafe infrastructure in climate events)
       - Confidence: Historical base-rate shows 15% of similar clauses were flawed → P = 0.15? But note: the working group might express high confidence (say 95%) despite history. We must reconcile.
          - *Procedure Note:* If historical base-rate conflicts with expert confidence, this becomes a values call (step 1) because it requires deciding which evidence to trust. But let's assume we have a policy: use the lower of (expert confidence, 1 - base-rate) for P. So P = max(0.15, 1-0.95)=0.15? Actually, we want to be conservative: use the worst-case? We'll set P = 0.15 (base-rate) because it's higher than 1-0.95=0.05. So P=0.15.
          - RC = 0.15 × 4 = 0.6
     - Step 3:
       - B_remaining: After the bridge clause, we had 0.01 left.
       - 0.6 > 0.01 → REJECT.
     - Outcome: Rejected. This is the unwelcome result. Despite the working group's 95% confidence (which we overrode with the base-rate), the high consequence and high error probability blow the budget. The team won't like this because it rejects a clause with "high confidence" and industry backing, but the error budget forces it.

  **What the Procedure Can't Do:**

  - **Set the Global Error Cap:** The total error budget (B_total) must be set by the board, not by the editorial team. This is a policy decision about how much risk the entire document can bear.
  - **Reopen Accepted Clauses:** Once accepted, a clause is only revisited if new information changes its risk cost (step 4) and the board approves reopening. The procedure does not automatically reopen clauses.
  - **Weigh Political Pressure:** The procedure treats political pressure as either:
    - Irrelevant to the risk calculation (ignored) OR 
    - A trigger for a "values call" (step 1) which goes to the board. The board may then override the budget, but this should be rare and documented.
  - **Handle Interdependent Risks:** If clauses are interdependent, the risk cost of one may affect others. Step 4 attempts to catch this, but complex dependencies may require manual review.
  - **Escape the Lottery Paradox:** Even if every clause is individually below the budget threshold, the total risk may exceed B_total. The running budget prevents this by deducting as we go.

  **Final Note:** The procedure forces the team to confront the lottery paradox by making the budget a finite resource. The unwelcome rejection in Case 3 is the system working as designed: it protects the document from accumulating too much risk, even when individual clauses seem acceptable.
answer: |-
  **Governing Rule:** Accept a clause only if its risk cost (error probability × consequence severity) fits within the document's remaining error budget, subject to override for non-probabilistic "values calls."  

  ### **Decision Procedure Checklist**  
  *(Run sequentially per clause; target: 20 min/clause)*  

  1. **Is this a values call (non-probabilistic)?**  
     - *Check:* Does the clause involve ethics, legal liability, or irreconcilable stakeholder conflicts?  
     - *Sufficient Answer:* "Yes" if political pressure, equity concerns, or fundamental principles dominate.  
     - *Action:* STOP. Hand to the board. Do not deduct from error budget.  
     - *Hard Stop:* If yes, exit checklist.  

  2. **Assign consequence severity (S):**  
     - *Scale:* 1 (cosmetic) to 5 (catastrophic). Predefined examples:  
       - `1`: Formatting errors.  
       - `3`: Financial/reputational harm.  
       - `5`: Loss of life/environmental disaster.  
     - *Sufficient Answer:* Pick from scale. No ambiguity.  

  3. **Assign error probability (P):**  
     - *Input:* 1 – confidence score (e.g., 99% confidence → P=0.01).  
     - *Sources:* Expert estimates, historical base rates, or empirical data.  
     - *Sufficient Answer:* Decimal (0.001–0.99). If disputed, use worst credible estimate.  
     - *Hard Stop:* If P=1 (certain error), reject.  

  4. **Calculate risk cost (RC):**  
     - *Formula:* **RC = P × S**  
     - *Example:* P=0.008, S=5 → RC=0.04.  

  5. **Check against error budget:**  
     - *Global Budget (B):* Fixed total risk units (e.g., B=1.0) set by the board.  
     - *Remaining Budget (B_rem):* B minus sum of RC from all accepted clauses.  
     - *Rule:* **Accept only if RC ≤ B_rem.**  
     - *Action on Accept:* Deduct RC from B_rem.  
     - *Hard Stop:* If RC > B_rem, reject.  

  6. **Document dependencies (if applicable):**  
     - *Check:* Does this clause amplify/reduce risks in others?  
     - *Sufficient Answer:* "Yes" if technical interdependencies exist.  
     - *Action:* Flag for board; may force recalculation of prior RC scores.  

  ---  
  ### **Worked Cases**  
  *Assume initial B_rem = 0.10 (10% of total budget B=1.0).*  

  1. **Routine Typography Clause**  
     - Step 1: No values call (procedural).  
     - Step 2: S=1 (cosmetic).  
     - Step 3: Confidence=99% → P=0.01.  
     - Step 4: RC=0.01×1=0.01.  
     - Step 5: 0.01 ≤ 0.10 → **Accept.** B_rem=0.09.  
     - *Practical Acceptance:* Justified by low RC. Belief: Likely correct but irrelevant.  

  2. **Bridge Structural-Load Clause**  
     - Step 1: No values call (technical).  
     - Step 2: S=5 (catastrophic; failure kills).  
     - Step 3: Confidence=99.2% → P=0.008.  
     - Step 4: RC=0.008×5=0.04.  
     - Step 5: 0.04 ≤ 0.09 → **Accept.** B_rem=0.05.  
     - *Practical Acceptance:* Fits budget. Belief ≠ certainty: Team must document residual risk.  

  3. **Climate-Adaptation Clause (Industry-Pushed)**  
     - Step 1: Values call? No (content is technical, though lobbying occurs).  
     - Step 2: S=4 (safety/environmental harm).  
     - Step 3: Historical base-rate shows 18% similar clauses flawed → P=0.18. (Overrides expert 95% confidence.)  
     - Step 4: RC=0.18×4=0.72.  
     - Step 5: 0.72 > 0.05 → **Reject.**  
     - *Unwelcome Outcome:* Rejected despite high confidence. Budget consumed by prior high-RC clauses forces conservatism. Belief: Low confidence per data. Practical: Risk exceeds budget.  

  ---  
  ### **What the Procedure Can’t Do**  
  1. **Set Global Error Budget:** Must be defined by the board pre-project (e.g., B=1.0 for "tolerable" risk).  
  2. **Reopen Accepted Clauses:** Only triggered if new evidence changes S/P or dependencies (step 6).  
  3. **Override Values Calls:** Board alone handles these; budget is untouched.  
  4. **Handle Ambiguous Probabilities:** If P cannot be quantified, revert to step 1 (values call).  
  5. **Absorb Political Pressure:** Lobbying is ignored unless it converts to a values call (step 1).  
  6. **Escape the Lottery Paradox:** The budget forces aggregate risk awareness—individual "belief" is insufficient.  

  **Philosophical Anchor:** Acceptance is always *practical* (budget-constrained), never proof of truth. Belief in correctness survives as P < 1, but acceptance demands fitting the risk pool.
