  You are a professional philosopher of history with substantial training in philosophy of science. I am a retired experimental physicist who has recently begun studying philosophy seriously and am trying to determine whether historical knowledge can be objective in any robust sense.

  Before writing, please take a moment to brainstorm: outline Ranke's representational ideal of recovering the past without present distortion; summarize the central critiques advanced by E.H. Carr regarding the inevitability of selection and interpretation, and by Hayden White regarding narrative form, emplotment, and the priority of rhetorical structure over raw fact; and sketch at least one analogy between scientific instrument calibration and historical methodology.

  Then write a formal essay of roughly 800 to 1000 words addressing the following controversy. The Rankean position holds that the historian should aim to show the past as it actually occurred, suppressing personal bias and allowing the evidence to speak. Against this, Carr argues that historical facts are never raw but always constructed through the historian's choices, while White presses further that every historical account is necessarily shaped by pre-figurative narrative modes—romance, tragedy, comedy, satire—that are not themselves justified by evidence but determine what counts as evidence.

  Rather than treating this as a settled defeat for objectivity, adjudicate the dispute by developing and defending a specific analogical framework: historical objectivity should be modeled on scientific instrument calibration rather than on mirror-like representation. On this view, an account is objective not when it eliminates the historian's perspective, but when it is embedded in communal practices of error correction, evidentiary constraint, and intersubjective reproducibility—much as a calibrated thermometer does not erase the instrument but renders its biases measurable and correctable. Apply this framework to ask whether Carr's and White's scepticism undermines objectivity entirely, or merely relocates it in procedural and communal norms.

  Weigh the strongest objections: that narrative form may be constitutive rather than correctable; that calibration presupposes a stable target (the past) which White's constructivism denies; and that historical interpretation involves value judgments that resist technical normalization. Then reach and justify a definite conclusion. Either defend the thesis that a reconstructed, calibration-based objectivity survives the Carr-White challenge and should replace the Rankean ideal, or argue that the analogy collapses and that historical scepticism is vindicated in some stronger form. Do not end non-committally.

  Please think step by step, structure your argument with explicit premises, and maintain a polished, academic register suitable for a scientifically trained reader with philosophical curiosity.
