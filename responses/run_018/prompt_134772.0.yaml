  Also, consider the role of language. Frege's objective thoughts require expression in language. If language is tied to a national spirit (as his diary implies), then maybe objectivity is culturally bounded. But in his philosophical work, he treats language as a transparent medium. So there's a disconnect between his philosophical claims and personal beliefs.

