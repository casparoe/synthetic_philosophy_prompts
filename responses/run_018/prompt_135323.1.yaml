prompt: |-
  There's this Japanese practice — Shikinen Sengu at Ise — where they completely tear-down and rebuild the Grand Shrine every 20 years with fresh cypress. Same layout, same rituals, but after two cycles none of the original wood is left; meanwhile they keep the sacred mirror untouched in the inner shrine. At the same time, museum conservators treat replacing one beam in a 400-year-old tea house like a moral catastrophe. So what theory of object identitiy does the shrine practice actually presuppse? Functionalist? Ritual continuity? Something weirder that lets physical matter be disposable but not the ritual role? And is it even consistent with how law treats a corporation as "the same entity" after every shareholder, employee, and asset has turned over? Keep it under 350 words, lead with a one-sentence bottom line, then say whether the practice strictly needs one metaphysics or is just compatabile with several. Also tell me what would have to change in heritage conservation law if we adopted the shrine's implicit view for buildings everywhere.
reasoning: |-
  Okay, the user is asking about the Shikinen Sengu practice at Ise Grand Shrine in Japan, where they rebuild the shrine every 20 years with new materials, while keeping the sacred mirror untouched. They're contrasting this with museum conservation practices that preserve original materials at all costs. The user wants to know what theory of object identity this practice presupposes—whether it's functionalist, ritual continuity, or something else. They also ask if it's consistent with corporate identity in law and what would change in heritage conservation law if we applied the shrine's view universally.

  First, I need to recall the key aspects of Shikinen Sengu. The shrine is completely rebuilt every 20 years, but the sacred mirror remains in place. The rituals and layout stay the same. The user mentions that after two cycles, none of the original wood is left. This suggests that the identity of the shrine isn't tied to its physical materials but to the continuity of rituals and the form itself. The mirror, however, is preserved, indicating that some elements are considered irreplaceable.

  The core idea here seems to be that the shrine's identity is maintained through the repetition of the ritual process. Each reconstruction is an act of renewal, transferring the kami (deity) to the new structure. This is different from Western conservation, which emphasizes original material as a carrier of historical authenticity. So the theory here is likely ritual-based continuity, where the function and form are preserved through the ritual act, not the material.

  Next, comparing this to corporate identity. In law, a corporation remains the same entity even if all shareholders, employees, and assets change. This is based on legal continuity through documentation and structure. The shrine's practice is similar: the structure and rituals persist, even as materials are replaced. So both rely on formal and functional continuity rather than material persistence.

  The user also asks if the shrine's practice requires one specific metaphysics or is compatible with several. The shrine's view prioritizes ritual and function, but it could be seen through different philosophical lenses: process philosophy (emphasizing ongoing renewal), functionalism, or even certain forms of dualism where the divine presence transcends physical matter. However, it's incompatible with materialist views where identity depends on original substance.

  For heritage conservation law implications: if applied globally, laws would need to shift from preserving original fabric to allowing reconstruction as a form of continuity. This would require accepting replicas as authentic if made through traditional methods and rituals. This could lead to more living heritage practices but might conflict with existing standards like those of UNESCO, which emphasize material authenticity. Countries like Japan already recognize such practices, but widespread adoption would challenge Western-centric conservation principles.

  The user's deeper need might be understanding how different cultures conceptualize authenticity and continuity. They might be interested in alternatives to material-based preservation, especially in contexts where materials decay quickly or rituals are central. The comparison to corporations suggests they're exploring abstract continuity in various systems. Addressing both the explicit questions and these underlying themes is important.
answer: |-
  ### Bottom Line:
  The Ise Shrine practice presupposes that an object's identity is defined by **ritual continuity and formal replication** rather than material persistence, treating physical substance as a vessel for enduring spiritual and social functions.

  ### Theory of Identity:
  This aligns most closely with **ritual-functional continuity**, where identity resides in:  
  1. **Sacred Function**: The shrine persists as long as its purpose (housing the kami) is maintained through prescribed rituals.  
  2. **Ritual Replication**: Rebuilding *is* the continuity mechanism—each reconstruction ritually transfers the divine essence ("mitama-shiro") to the new structure.  
  3. **Hierarchy of Sacredness**: The untouched mirror (holding the kami's spirit) is irreplaceable, while wood is a renewable ritual component, creating a dual ontology.  

  ### Compatibility & Consistency:  
  - **Compatible with multiple views**: It fits process philosophy (identity as dynamic renewal) or institutional theory (identity via social acts), but **rejects materialism** (identity = original parts).  
  - **Corporate parallel**: Like corporations, Ise’s identity relies on **structural/functional continuity** despite material turnover—both are "abstract entities" sustained by rules and roles, not atoms.  

  ### Implications for Heritage Law:  
  Adopting this view globally would require:  
  1. **Redefining "authenticity"** from original fabric to **continuity of technique, form, and ritual practice**.  
  2. **Permitting cyclical reconstruction** of heritage sites using traditional methods, treating them as "living" entities.  
  3. **Shifting legal protection** to **safeguard rituals and crafts** (e.g., carpentry techniques) over static material preservation.  
  4. **Amending charters like UNESCO’s** to prioritize **intangible processes** alongside physical integrity, recognizing renewal as preservation.  

  > *Example:* A 400-year-old tea house could be entirely rebuilt using original methods without legal controversy, provided the ritual context (e.g., tea ceremony lineage) remains unbroken. Conservation would focus on transmitting skills, not freezing decay.
