prompt: |-
  I am a sixth-form student writing an extended essay on practical decision-making, and I would like to understand how Herbert Simon’s principle of satisficing—accepting the first option that clears an aspiration threshold rather than maximising—can be turned into a reusable, step-by-step procedure for a practitioner who applies it repeatedly under severe time constraints. Please construct such a procedure for a wildlife conservation officer who must approve or reject small-scale land-use applications near a protected wetland within two minutes per case, using only a laminated checklist and no digital aids. The officer must justify each decision to a review panel that occasionally demands further evidence, creating institutional pressure to gather more data and thus drift into maximising behaviour that violates the satisficing logic.

  Your procedure should include: (1) an ordered sequence of tests with explicit, numerically stated aspiration-level thresholds; (2) a “cognitive budget” rule that treats working-memory depletion as a hard constraint, explicitly capping the number of alternatives that may be compared before a decision is locked; (3) worked applications to three cases—one clear approval, one clear rejection, and one in which panel pressure threatens to breach the cognitive budget and push the officer into prohibited maximising; (4) clear flagging of the exact decision nodes where human judgment cannot be eliminated; and (5) an honest account of what the procedure is unable to do, particularly when ecological uncertainty makes the aspiration level itself unstable over time. Ground the design in the actual logic of bounded rationality and in Simon’s concept of aspiration-level adaptation, but inject the niche refinement that the checklist must treat each additional comparison as consuming a fixed unit of the officer’s cognitive budget, forcing termination once the budget is spent regardless of residual doubt.

  Do not provide bibliographies, reading lists, or citations. Please write in British English, and end your response with a standalone final line that gives a one-sentence summary of the procedure’s core limitation.
reasoning: |-
  Okay, this is a sophisticated request from a sixth-form student working on bounded rationality in practical decision-making. The core challenge is translating Herbert Simon's satisficing principle into a concrete field procedure for a wildlife conservation officer. 

  The user's framing shows impressive grasp of key tensions: institutional pressure for maximisation vs strict time limits, cognitive budget constraints, and the need for auditable justification. They've precisely specified five required components, suggesting they've done background research but need help operationalising theory.

  Hmm, the laminated checklist constraint is particularly interesting - it forces extreme simplicity while accommodating ecological uncertainty. I should treat the cognitive budget like a physical resource where each comparison consumes a fixed unit. The "aspiration-level adaptation" point is tricky; thresholds must be predefined yet acknowledge instability over time.

  For the procedure, I'll structure it as:
  - A strict 4-rule sequence ending with mandatory default decisions
  - Binary thresholds using simple metrics (distance, area, mitigation coverage)
  - Cognitive budget capped at 3 alternatives to prevent drift
  - The "human judgment" flags where discretisation isn't possible
  - Three cases demonstrating clear calls vs pressure points

  The limitation must honestly address ecological uncertainty - hence ending with "volatile environmental thresholds" as the core weakness. British English terms like "metres" and "prioritisation" will be used consistently.

  Notably, the officer's real conflict isn't just time pressure but the review panel's retrospective second-guessing. The procedure must create defensible stopping points. I'll emphasise that once cognitive budget depletes, the decision locks even with residual doubt - that's the essence of satisficing under constraints.
answer: |-
  ## Satisficing Procedure for Wetland Land-Use Decisions

  **Core Principle:** Accept the first proposal meeting all minimum aspiration thresholds. Terminate search immediately if cognitive budget is exhausted, defaulting to rejection.

  **Procedure Components:**

  1.  **The Laminated Checklist:** A single sheet with fixed thresholds and tracking boxes.
  2.  **Cognitive Budget:** Fixed at **3 distinct alternatives** (including the current proposal). *Each comparison (e.g., "What if they moved the shed?") or new data point sought consumes 1 unit.* Budget is tracked via tick boxes.
  3.  **Aspiration Thresholds (Fixed for this checklist version):**
      *   **A1. Wetland Buffer:** Proposed activity edge ≥ **50 metres** from high-water mark? (Y/N)
      *   **A2. Habitat Impact:** Direct vegetation clearance ≤ **100 sq. metres**? (Y/N)
      *   **A3. Mitigation Guarantee:** Binding commitment (e.g., bond, legal covenant) to restore ≥ **110%** of impacted area onsite/adjacent? (Y/N)
      *   **A4. Runoff Control:** Formal plan (e.g., silt fencing, swales) covering **100%** of exposed soil during works? (Y/N)

  **Step-by-Step Procedure (2-Minute Maximum):**

  1.  **Initialise:** Tick one cognitive budget box for evaluating the base proposal. (Budget Remaining: **2 units**).
  2.  **Apply Minimum Thresholds:** Assess the proposal *only* against the four fixed aspiration levels (A1-A4) using the application details. *No searching for alternatives or extra data yet.*
      *   **Human Judgment Node 1:** Determining if the proposal *clearly* meets A1-A4 based on submitted evidence. (e.g., Is the plan scale accurate? Is the mitigation guarantee legally binding?)
  3.  **Decision Point 1: Clear Satisficing?**
      *   **If ALL A1-A4 = YES:** **APPROVE** immediately. *Record justification: "Meets all minimum thresholds (Buffer, Impact, Mitigation, Runoff)."* **STOP.**
      *   **If ANY A1-A4 = NO:** Proceed to Step 4. *Do NOT reject yet.*
  4.  **Cognitive Budget Check:**
      *   If Budget Remaining = **0**, **REJECT** immediately. *Record justification: "Fails threshold(s): [List failed A#]. Cognitive budget exhausted (No viable alternative found within constraints)."* **STOP.**
      *   If Budget Remaining **> 0**, proceed to Step 5.
  5.  **Generate/Consider ONE Alternative (1 Unit):** Deduct 1 cognitive unit. Consider **only one** potential modification suggested *by the applicant* or a simple, obvious adjustment *you conceive instantly* (e.g., "Could they reduce clearance by 10 sqm?", "Is moving the structure 5m west feasible?"). **Do NOT seek new evidence.** Rely solely on the application or your immediate professional estimation.
      *   **Human Judgment Node 2:** Conceiving a single, plausible, minor alternative modification *without deliberation*. Estimating its impact on thresholds A1-A4 *without calculation or new data*.
  6.  **Assess Alternative:** Does *this specific alternative* satisfy **ALL** thresholds (A1-A4)?
      *   **If YES:** **APPROVE (Conditional)**. *Record justification: "Base proposal fails [List failed A#]. Modified proposal [Brief description of alt.] meets all thresholds. Conditional approval issued."* **STOP.**
      *   **If NO:** Return to **Step 4 (Cognitive Budget Check)**.

  ---

  **Worked Applications:**

  *   **Case 1: Clear Approval**
      *   Proposal: Repairs to existing footpath (5m from wetland edge). No clearance. Runoff plan covers repairs. Mitigation bond included for any accidental damage.
      *   **Step 2:** A1 (5m < 50m? **NO**). Proceed to Step 4 (Budget=2).
      *   **Step 5 (Alt 1):** "Move repairs to least sensitive section, min 55m from edge?" (Assumed feasible, instantly conceived). Tick Budget (Now=1). **A1 (55m) YES, A2 (0 sqm) YES, A3 (bond) YES, A4 (plan) YES.**
      *   **Decision:** APPROVE (Conditional: repairs ≥55m from edge). *Justification: "Base fails buffer (5m). Modified proposal (repairs ≥55m) meets all thresholds."* Budget used: 2 units (Base + 1 Alt).

  *   **Case 2: Clear Rejection**
      *   Proposal: New garden shed (120 sqm clearance), 40m from wetland. No runoff plan. No mitigation.
      *   **Step 2:** A1 (40m < 50m? **NO**), A2 (120 sqm > 100 sqm? **NO**), A3 (**NO**), A4 (**NO**). Proceed to Step 4 (Budget=2).
      *   **Step 5 (Alt 1):** "Reduce shed size to limit clearance to 95 sqm?" Tick Budget (Now=1). A2 (95 sqm) **YES**, but A1 (40m) still **NO**, A3 **NO**, A4 **NO**. Proceed to Step 4 (Budget=1).
      *   **Step 5 (Alt 2):** "Move shed to 60m away?" Tick Budget (Now=0). A1 (60m) **YES**, but A2 (120 sqm) still **NO**, A3 **NO**, A4 **NO**. Proceed to Step 4 (Budget=0).
      *   **Decision:** REJECT. *Justification: "Fails thresholds: Buffer (40m), Impact (120sqm), Mitigation (None), Runoff (None). Cognitive budget exhausted (Alt1 reduced impact but failed buffer/mit/runoff; Alt2 fixed buffer but failed impact/mit/runoff)."*

  *   **Case 3: Panel Pressure Threat (Maximising Drift)**
      *   Proposal: Small picnic area (80 sqm clearance), 48m from wetland. Runoff plan provided. Applicant offers vague "future planting" for mitigation, no guarantee.
      *   **Step 2:** A1 (48m < 50m? **NO**), A2 (80 sqm ≤ 100 sqm? **YES**), A3 (Binding Guarantee? **NO**), A4 (**YES**). Proceed to Step 4 (Budget=2).
      *   **Step 5 (Alt 1 - Officer):** "Shift picnic area 3m further back?" (→ 51m). Tick Budget (Now=1). A1 (51m) **YES**, A2 **YES**, A3 (**Still NO - vague promise**), A4 **YES**. Proceed to Step 4 (Budget=1).
      *   *Panel Pressure Intrudes:* Officer feels doubt about A3. Thinks: "Should I check legal precedent on 'future planting'? Maybe ask applicant for a bond estimate? Is 51m *really* enough given erosion models?" Each *distinct* new line of inquiry or alternative considered (e.g., "legal check", "bond request", "is 55m possible?") **consumes 1 cognitive unit.**
      *   **Cognitive Budget Breached:** Officer considers *one* extra thing (e.g., "Is 55m possible?") - Tick Budget (Now=0). This Alt doesn't fix A3. Budget=0.
      *   **Decision:** REJECT (Due to budget exhaustion). *Justification: "Base failed buffer (48m) and mitigation (no guarantee). Alt1 fixed buffer (51m) but failed mitigation. Cognitive budget exhausted."* **Crucially, the officer avoided maximising (e.g., deep legal dive, multiple new alts) by hitting the budget cap.** The rejection stands, justified by the procedure.

  ---

  **What the Procedure Is Unable To Do (Limitations):**

  1.  **Handle Unstable Aspiration Levels:** Thresholds (50m, 100 sqm) are fixed on the laminated sheet. If new data shows 50m is insufficient (e.g., new species discovery, hydrological change), the procedure **cannot adapt mid-decision**. The officer must use the *current* thresholds until the checklist is formally updated.
  2.  **Resolve Deep Uncertainty:** When evidence is ambiguous (e.g., exact wetland boundary disputed, unclear if mitigation species will thrive), the procedure forces a binary Y/N judgment at Human Judgment Nodes. It **cannot quantify risk** beyond the thresholds.
  3.  **Guarantee Ecological Optimality:** Satisficing accepts "good enough". A proposal barely passing (51m, 99 sqm) is approved equally to one far exceeding thresholds. Maximising for the *best* outcome is **explicitly sacrificed** for speed.
  4.  **Eliminate Judgment:** Human judgment is critical at the defined nodes (interpreting evidence, conceiving a single simple alt). The procedure structures and bounds this judgment but **cannot automate it**.
  5.  **Prevent All Panel Challenges:** While providing an audit trail, the panel may still challenge the *adequacy* of the fixed thresholds or the officer's judgment calls. The procedure justifies *how* the decision was made under constraints, not that it's ecologically perfect.

  **Core Limitation:** This procedure cannot adapt its aspiration-level thresholds during application to account for volatile environmental conditions or emerging ecological knowledge.
