answer: |-
  Here is your teaching plan, structured as requested:

  ---

  **1. Conceptual Dependencies and Teaching Sequence (Order & Rationale)**  
  *(~180 words)*  
  Start with **Careenium basics (5 min)**: Introduce SIMBALLs (simple particles) and their deterministic/physical interaction rules. *Why?* Establishes the causal closure of the substrate.  
  Next, define **SIMMs (5 min)**: High-level, stable patterns of SIMBALL interactions (e.g., a recurring loop). Emphasize their *supervenience*: SIMMs depend entirely on SIMBALL states but are identifiable only at the pattern level. *Why?* Shows ontological dependence without top-down control.  
  Then pose the **core question (3 min)**: "Can the *stability* or *persistence* of a SIMM (e.g., the loop) causally influence the trajectory of individual SIMBALLs?" *Why?* Frames downward causation concretely.  
  Introduce **constraint arguments (7 min)**: Explain how stable SIMMs *filter* possible SIMBALL paths by making certain low-level states unstable or inaccessible (e.g., a SIMM’s structure eliminates erratic SIMBALL paths that would break it). *Why?* Distinguishes causation from programming—it’s about boundary conditions, not instructions.  

  **2. The Carrying Example: Requirements and Limits**  
  *(~150 words)*  
  **Example**: A whirlpool in a draining sink.  
  *Required Properties*:  
  - **Concrete**: Water molecules (SIMBALLs) are constrained by the whirlpool’s (SIMM’s) stable structure.  
  - **No Controller**: The whirlpool emerges from water flow/gravity—no hidden designer.  
  - **Downward Constraint**: The whirlpool *causally influences* molecule paths—molecules entering it are "pulled" into rotation, altering their trajectories.  
  *Forbidden Properties*:  
  - **No Software Analogy**: Avoid framing the whirlpool as "code." It’s a physical, self-sustaining dynamic pattern.  
  - **No Teleology**: The whirlpool doesn’t "aim" to persist; its stability is a byproduct of physics.  

  **3. Misconception Map and Intervention Points**  
  *(~180 words)*  
  - **Misconception 1**: "If SIMBALL physics is causally sufficient, SIMMs are irrelevant."  
    *Intervention*: After introducing SIMMs, ask: "Does SIMBALL-level causation *explain* why *this specific pattern* persists?" Contrast causal completeness (SIMBALLs) with explanatory relevance (SIMMs).  
  - **Misconception 2**: "Downward causation = a SIMM ‘programming’ SIMBALLs."  
    *Intervention*: During the whirlpool example, stress that the pattern *constrains* but doesn’t *instruct* (e.g., the whirlpool doesn’t "tell" molecules where to go; it physically limits their options).  
  - **Misconception 3**: "SIMMs are agents."  
    *Intervention*: When discussing SIMM stability, clarify: "The whirlpool isn’t ‘trying’ to survive; its persistence is a non-teleological dynamic property."  

  **4. Understanding Check**  
  *(~90 words)*  
  **Question**: "If we ‘froze’ a stable SIMM (like the whirlpool) and perturbed a single SIMBALL, would the SIMM’s stability *help explain* why the system likely returns to its original state? Or is the substrate-level physics sufficient?"  
  *Why?* Tests if they see SIMMs as *explanatory* (not just causal). Correct grasp: Substrate physics executes the return, but the SIMM’s stability *explains why* the system resists perturbation. A slogan answer would miss the explanatory layer.  

  **5. Boundaries: What This Level Must Omit**  
  *(~90 words)*  
  - **No Gödel/Self-Reference**: Avoid discussions of self-referential loops (e.g., "SIMMs representing themselves"). Too abstract and invites tangents.  
  - **No Consciousness**: Do *not* tie SIMMs to qualia or subjective experience. The Careenium is a causal/computational model.  
  - **No Panpsychism/Emergentism Debates**: Frame solely within the Careenium’s formal parameters. Broader metaphysical claims exceed scope.  

  **6. Confidence and Least-Sure Point**  
  *(~70 words)*  
  **Confidence**: High (90%) in the sequence and misconception interventions. The dependencies are logically sound, and the whirlpool example effectively disarms controller/programmer intuitions.  
  **Least-Sure Point**: The *Understanding Check* question’s efficacy. Some students might still conflate explanatory relevance with substrate causation despite scaffolding. Detecting this in a 30-min session is challenging; I’m 70% sure the question diagnoses true conceptual grasp vs. slogan adoption.  

  ---  

  **Key Rationale**: The sequence forces engagement with supervenience *before* downward causation, preventing dualist leaps. The whirlpool exemplifies constraint-based influence sans homunculi. Boundaries keep focus on causal architecture, not consciousness or computation.
