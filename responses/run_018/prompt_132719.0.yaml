  Some essence holds where frantic marks engage:
  *Is it the loop must close back to the stem?*

  A thousand scribbles stretch the alphabet,
  Defy the strict geometric cage –
  Still, each one falls inside the cloud of them.

  We parse the whirl, the angle, the vignette,
  Some inner ghost that haunts the pen, presaged
  By how the loop must close back to the stem.

  The grid’s strict lines breed doubt, cause us to fret,
  While style-space holds the common heritage
  Ensuring it falls inside the cloud of them.

  We trace the grid but can't contain the flame,
  The ghost persists beyond the scribbled stage.
  **The loop must close back to the stem.**
  **It falls inside the cloud of them.**

