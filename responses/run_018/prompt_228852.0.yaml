answer: |-
  This phenomenon absolutely has a name and established research behind it, though it intersects several concepts. The core name capturing the "re-coloring of past experience" is:

  **The "Revelation Effect" (or sometimes "Authenticity Effect" in specific contexts)**, specifically understood as **Retroactive Perceptual Distortion** or **Conceptually Mediated Re-evaluation**.

  Here's the breakdown, why it fits, and its boundaries:

  1.  **Core Concept & Name:**
      *   **Revelation Effect:** This is the most direct label for the core phenomenon: *New conceptual information (the "revelation" of forgery) dramatically alters the perception and memory of a sensory experience, even though the physical stimulus is unchanged.* It emphasizes the triggering event and its transformative power.
      *   **Retroactive Perceptual Distortion:** This describes the mechanism: The new concept ("forgery") distorts (*distortion*) how the sensory input (*perceptual*) is processed *now* and how it's remembered (*retroactive*). It highlights the weird temporal aspect you pinpointed.
      *   **Conceptually Mediated Re-evaluation:** This emphasizes the *source* of the change (the new *concept* about origin) and the *process* (it *mediates* or filters the *evaluation* of sensory data, past and present).

  2.  **How it Differs from Neighbors:**
      *   **Hindsight Bias:** You're correct to distinguish this. Hindsight bias is about falsely believing *you knew it all along* or *could have predicted* the outcome. Your phenomenon is about the *actual sensory/perceptual memory and present experience being altered*. It's not "I thought it might be fake," it's "I *see* the clumsy hands now" and "I *remember* it tasting off."
      *   **Confirmation Bias:** While related, confirmation bias is seeking or interpreting *new* information to fit existing beliefs. Here, *new* information radically *changes* existing beliefs and *retroactively* alters sensory memory and present perception.
      *   **Cognitive Dissonance:** This is the discomfort of holding conflicting ideas. The Revelation Effect is a *specific resolution mechanism* for dissonance: people resolve the conflict ("I loved this, but it's fake") by unconsciously (or semi-consciously) altering their perception and memory of the object to align with the new negative information ("It was never actually good").
      *   **Placebo/Nocebo Effect:** These involve *expectations* altering *future* experiences (e.g., a sugar pill reducing pain because you believe it's medicine). The Revelation Effect involves information altering *past* memories and the *present* re-experience of a *specific, known* object.
      *   **Value Attribution (Art Economics):** While provenance changes *value*, your focus is on the deeper shift in *sensory perception and memory*, not just market price or symbolic worth. The value change is downstream from the perceptual distortion.
      *   **The "El Greco Effect" / Aesthetic Fluency:** This is about learning *positive* contextual information (e.g., an artist's biography, style context) enhancing *future* appreciation. The Revelation Effect is about *negative* information (inauthenticity) retroactively *degrading* past and present sensory experience.

  3.  **Defining the Phenomenon:**
      > **The Revelation Effect (Retroactive Perceptual Distortion):** The phenomenon whereby the acquisition of new, significant conceptual information about the origin or nature of an object (particularly concerning authenticity or profound contextual facts) triggers an involuntary re-evaluation. This re-evaluation alters both the *present* sensory/perceptual experience of the object and the *memory* of past sensory/perceptual experiences related to it, despite the unchanging physical properties of the object itself. The effect is characterized by individuals reporting that flaws or negative qualities (previously unnoticed or even appreciated) are now perceived as obvious, both in recollection and upon re-inspection.

  4.  **Boundary Cases & Where the Carving Stops:**
      *   **Artist's Crimes vs. Object's Origin:**
          *   **Similar but Distinct:** Learning of an artist's heinous crimes *can* trigger a similar effect (e.g., "Now that I know, their work feels tainted/dark/unsettling"). This shares the mechanism of **conceptual mediation** and **re-evaluation**. However, the *core* Revelation Effect you describe is tightly linked to **authenticity** and **provenance** – the fundamental nature of *what the object actually is*. The artist's crime affects the *context and meaning*, not the object's core identity. It's a close cousin, often grouped under "moral taint" or "biographical contamination," sharing the retroactive distortion mechanism but differing in the *type* of information causing it.
      *   **Music / Non-Physical Objects:**
          *   **Absolutely Applies:** The Revelation Effect hinges on *conceptual information mediating sensory experience and memory*, not physical uniqueness. Learning a beloved recording is by a cover band impersonating the original artist, or that a "lost masterpiece" was actually composed recently in imitation, should trigger the same effect ("Listening now, the vocals *do* sound strained," "The orchestration *was* derivative"). The "object" is the auditory experience and its attributed source.
      *   **Reverse Effect (Positive Revelation):**
          *   **Yes, It Exists (Asymmetrically):** Learning that a painting thought to be a copy is actually the *original*, or that a modest wine is from a legendary vintage/winemaker, can enhance present perception and retroactively "improve" memory ("Now I see the true mastery in those brushstrokes," "Thinking back, it *did* have an extraordinary depth I couldn't place"). This is the positive valence side of the same phenomenon – **Conceptually Mediated Enhancement**. However, research (and anecdote) often suggests the *negative* effect (from "authentic" to "fake") is stronger and more consistently reported than the positive one (from "unknown/copy" to "authentic/masterpiece"). Our brains seem more sensitive to threats (deception) than bonuses.
      *   **Where It Stops / Boundary Markers:**
          *   **Pure Devaluation without Perceptual Shift:** If someone says, "I know it's fake now, so it's worthless, but it still *looks* beautiful to me," that's not the Revelation Effect. That's rational devaluation without perceptual/memory distortion.
          *   **Learning Technical Flaws:** If an expert points out a *physical* flaw you genuinely hadn't noticed before (e.g., a crack in the varnish, cork taint in the wine), and you now see/smell it, that's simply **learning to perceive** something that was always physically present, not conceptually mediated distortion. The Revelation Effect involves changes in the *interpretation/experience* of stimuli that haven't physically changed.
          *   **Changing Tastes Over Time:** If someone genuinely dislikes a painting now due to evolving personal taste, unrelated to new information about it, that's not the effect. The trigger *must* be the specific conceptual revelation about origin/authenticity/profound context.
          *   **Simple Label Change:** If changing a label (e.g., "Wine A" to "Wine B") without changing any conceptual information about origin/quality causes a shift, that's more about **expectancy effects** or **labeling bias**, which is related but lacks the profound conceptual weight and retroactive memory alteration of the Revelation Effect (which fundamentally changes *what the thing is understood to be*).

  **In Summary:**

  The phenomenon you describe is best captured by the **Revelation Effect**, understood as causing **Retroactive Perceptual Distortion**. It's a powerful demonstration of how top-down cognitive processes (beliefs, concepts, knowledge) fundamentally shape and reshape bottom-up sensory experience and memory. It differs from hindsight bias by altering the *content* of sensory memory, not just predictive confidence. It applies to non-physical art and can run in reverse (positive revelations), though often less potently. It's distinct from learning about an artist's unrelated crimes (though similar) and stops where the change is purely about value judgment without sensory/memory alteration, or involves noticing previously undetected physical flaws.

  This effect profoundly illustrates that our experience of art, wine, and many other valued objects is never a pure encounter with the physical thing; it's an inextricable blend of sensation and story. When the story changes catastrophically (forgery), the sensation changes too, rewriting the past as well as the present.
