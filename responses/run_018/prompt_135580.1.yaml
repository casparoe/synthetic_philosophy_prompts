  Hmm, the user presents a sophisticated critique of value-alignment research methods in AI ethics and moral psychology. They're questioning the philosophical foundations of statistical "noise correction" in moral preference aggregation - a practice I recognize as widespread in trolley-problem-style experiments. 

  The core tension they identify is fascinating: researchers assume they can separate "true" preferences from "biases" through experimental controls, but this assumes a realist view of morality that may not hold. I recall similar debates in metaethics - Gilbert Harman's critique of moral facts comes to mind. 

  What's particularly sharp is their observation about circularity: labeling some framing effects as "biases" already presupposes what morality should look like (stable, coherent etc.). If we adopted a situated ethics view instead - say, Merleau-Ponty's embodied cognition or Dancy's particularism - the entire correction paradigm collapses. 

  The institutional implications they hint at are profound. If we stop chasing illusory "cleaned" preferences, we'd need: multi-agent systems that preserve moral disagreement (like Hong & Page's diversity models), context-aware AI that adapts to framing (perhaps using Goffman's frame analysis), and transparent value arbitration mechanisms. 

  Their question reveals deep methodological unease in the field. I should acknowledge how this practice mirrors neoclassical economics' treatment of preferences - which behavioral economists like Thaler have demolished. The parallel to Allais paradox and preference reversals is striking. 

  The constructivist alternative they propose is viable but underdeveloped in AI ethics. I should reference Haslanger's discursive approach - what if "bias correction" is really privilege stabilization? That would reframe the entire debate about whose judgments get labeled "noisy". 

  For practical alternatives, deliberative democracy models (Habermas, Dryzek) offer concrete institutional templates that embrace disagreement. The key shift is from extracting preferences to facilitating moral dialogue - which suggests entirely different AI architectures.
answer: |-
  Your critique targets a foundational tension in value-alignment research. Let's dissect the philosophical commitments and practical implications:

  ### Core Philosophical Commitments
  1. **Metaphysical Realism about Preferences**:  
     The correction practice presupposes **moral facts about individuals exist independently of judgment contexts**. This mirrors a *response-independent* realism where preferences are discoverable "truths" distorted by cognitive noise. Statistical cleaning becomes an epistemological tool to approximate these pre-existing states.

  2. **Atomism vs. Holism**:  
     It assumes preferences are *modular*—separable from the framing that expresses them. This contrasts with **situated cognition** theories (e.g., Merleau-Ponty), where moral reasoning is embodied and context-constituted.

  3. **Epistemic Privilege**:  
     Researchers position themselves as having a "view from nowhere" (Nagel) to objectively define noise. Yet choosing which effects to correct (e.g., discounting emotion but not reason) smuggles in **normative assumptions** about "rational" judgment.

  ### Can Constructivism/Expressivism Accommodate This?
  - **Expressivist Challenge**: If moral judgments are *performative* (Blackburn), not descriptive, "cleaning" responses doesn't reveal latent preferences—it creates new ones. Stability would reflect **rhetorical consistency**, not discovered truth.
    
  - **Constructivist Possibility**: A Kantian constructivist might see correction as refining *rational coherence*, manufacturing preferences that survive reflection. However, this still privileges certain rational norms over others (e.g., transitivity).

  ### Internal Inconsistencies
  - **The Selection Paradox**: Deciding which framings are "distortions" (e.g., emotional priming) versus "authentic" (e.g., cognitive deliberation) requires **prior normative commitments**. Is emotion "noise" or integral to moral perception (Nussbaum)?  
  - **Stability Fetishism**: Prioritizing cross-situational consistency assumes morality *should* be context-invariant—a claim contested by particularists (Dancy) and feminist ethicists.  
  - **Procedural Arbitrariness**: Filtering "noise" implicitly defines the *ideal moral agent* (e.g., dispassionate, calculating), which may exclude valid cultural or neurodivergent perspectives.

  ### Alternative Frameworks & Research Implications
  If we adopt **irreducibly situated moral reasoning**:
  1. **Abandon Preference Extraction**:  
     The goal shifts from discovering "true" preferences to **mapping moral landscapes**—recording how values *emerge* across contexts. AI systems would need **dynamic preference models** sensitive to framing variables.

  2. **Institutional Alternatives**:  
     - **Deliberative Forums**: AI could facilitate discourse among stakeholders with divergent framings (Habermasian dialogue), preserving disagreement rather than aggregating it.  
     - **Contextual Arbitration**: Instead of a single "aligned" model, deploy **multiple specialized systems** attuned to different framings (e.g., care-focused vs. justice-focused reasoning), with meta-rules for context-appropriate deployment.  
     - **Bias Transparency**: Expose framing effects rather than suppress them—e.g., "This recommendation prioritizes statistical lives; toggle to see emotional-impact weighting."

  3. **Conceptual Shifts in Alignment**:  
     - **Normative Humility**: Reject the idea that AI should enact "cleaned" preferences. Instead, design systems that **scaffold moral reasoning** without presupposing universality.  
     - **Disagreement Preservation**: Store value conflicts in training data (e.g., "40% chose X under framing A, 75% under B") and build AIs that **flag contextual dependencies** in decisions.  
     - **Ethnographic Methods**: Replace controlled experiments with **narrative-based studies** capturing holistic moral reasoning (e.g., moral foundations theory in real-world dilemmas).

  ### Conclusion
  The correction practice relies on **unstable Cartesian assumptions**: a core "self" with access to context-independent values. Embracing moral situatedness doesn't make alignment impossible—it demands richer models of human ethics. Institutional energy should pivot toward:
  - **Mapping** rather than **correcting** variability,  
  - Designing **meta-frameworks for value negotiation**,  
  - Developing AIs as **mediators of moral disagreement** rather than implementers of monolithic preferences.

  As Wittgenstein noted, "Ethics is not about saying how things are, but about the framework within which we speak." Value alignment must grapple with that framework's irreducible plurality.
