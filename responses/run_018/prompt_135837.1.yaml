answer: |-
  Here's Jaspers' taxonomy rigorously translated into corporate law vocabulary, followed by a residue analysis and epistemic honesty about the gaps:

  ### Jaspers' Four Guilts in Corporate Law Lexicon
  1. **Criminal Guilt** → **Corporate Criminal Liability**  
     *Breach of positive law by the legal person.*  
     Applies when the corporation (via its agents) violates statutes/regulations. Established doctrines: *respondeat superior* (vicarious liability for employees), conspiracy, RICO. Requires *actus reus* + *mens rea* (often imputed from officers or embedded in organizational culture).

  2. **Political Guilt** → **Structural Complicity Liability**  
     *Obligations arising from membership in flawed systems.*  
     The corporation’s entanglement in harmful industry practices, supply chains, or governance failures – even when technically compliant. Analogous to: successor liability for predecessor entities' harms, enterprise liability piercing separate entities, or liability for systemic discrimination via "pattern or practice" doctrine. Rooted in the entity’s *positional role*, not direct fault.

  3. **Moral Guilt** → **Fiduciary Breach & Officer/Director Culpability**  
     *Individual accountability for wrongful acts/omissions.*  
     Personal liability of directors/officers for: failure of oversight (*Caremark* claims), bad faith decisions, or knowingly enabling corporate wrongdoing. Maps to duty of loyalty violations, insider trading, or Sarbanes-Oxley certifications. Focuses on *human actor intent*, not the legal person’s liability.

  4. **Metaphysical Guilt** → **No Direct Counterpart**  
     *The entity’s existential failure as a moral agent.*  
     The corporation’s inherent ethical deficit for causing suffering through its operational existence – irrespective of legal compliance or individual culpability. E.g., a pharma corporation legally maximizing opioid sales while communities suffer. This transcends intent/culture; it’s about *being* a structure that inevitably harms.

  ---

  ### Residue Report: Mapping Fidelity
  | Jaspers' Category      | Corporate Law Fit                          | Fidelity Rating | Key Tension Points                         |
  |------------------------|--------------------------------------------|-----------------|--------------------------------------------|
  | **Criminal Guilt**     | Corporate criminal liability               | ⭐⭐⭐⭐⭐ (Clean)  | *Mens rea* attribution debates (collective vs. individual intent) |
  | **Political Guilt**    | Successor/enterprise liability, complicity doctrines | ⭐⭐⭐☆ (Partial) | Requires doctrinal stretching beyond direct causation; "systemic guilt" isn't a formal category |
  | **Moral Guilt**        | Officer/director liability                 | ⭐⭐☆☆ (Twisted) | Corporate law isolates entity liability from human morality; "moral guilt" applies only to biological persons |
  | **Metaphysical Guilt** | *No counterpart*                           | ⭐☆☆☆☆ (None)   | Law recognizes no *existential* corporate culpability; entities lack "being" to bear metaphysical guilt |

  ---

  ### Critical Analysis: The Gap & Its Significance
  **The Unmapped Residue (Metaphysical Guilt)** represents a profound disconnect. Corporate law treats entities as *legal* persons but rejects them as *moral* persons. Jaspers' metaphysical guilt highlights:
  - **The "Why" Beyond Compliance**: Even legally impeccable corporations can perpetuate harm (e.g., algorithmic bias in lending).  
  - **Institutional Amorality**: Law excuses entities from human ethical obligations (e.g., no duty to prevent suffering absent statutory duty).  
  - **Successor Non-Responsibility**: Acquirers inherit assets but not existential guilt for predecessors' sins (e.g., colonial resource extractors rebranded as ESG leaders).  

  **Is this gap "real"?**  
  Yes – but it’s a *philosophical* gap, not a legal one. Corporate law deliberately excludes metaphysical guilt because:  
  > *"Legal personhood is a fiction for allocating rights/duties; it cannot 'fail' morally by merely existing."*  

  Yet this gap manifests practically:  
  - **Stakeholder Claims**: Communities demanding accountability for historical harms (e.g., slave labor reparations suits) invoke quasi-metaphysical guilt.  
  - **ESG Backlash**: Accusations of "woke capitalism" reveal discomfort with corporations acting as moral agents.  
  - **Cultural Liability**: Courts increasingly scrutinize "corporate culture" (e.g., *Sunbeam* governance failures) – a toehold for moral evaluation.  

  ---

  ### Where I Could Be Wrong (Epistemic Accountability)  
  1. **Argument That Collapses the Gap**:  
     If you demonstrate that **fiduciary duties to stakeholders** (not just shareholders) legally codify metaphysical responsibility (e.g., *BCL v. Shuttleworth* UK precedent), the residue shrinks. *Counter*: Such duties remain derivative, not existential.  

  2. **Argument That Widens the Gap**:  
     If **AI-driven corporations** operate without human intent, Jaspers’ metaphysical guilt becomes *more* salient as law struggles to impute intent. Corporate law’s anthropocentrism would crack.  

  3. **Linguistic Drift Defense**:  
     Jaspers might conflate **guilt** (personal) with **blameworthiness** (systemic). Corporate law addresses blame via liability but rejects guilt as emotionally inapposite for entities. If "guilt" is purely psychological, the residue is indeed linguistic overreach.  

  **Crucial Consideration for My View**:  
  If courts increasingly punish **organizational culture** as *institutional mens rea* (e.g., DOJ Corporate Enforcement Policy), corporate law *may* develop a quasi-metaphysical dimension. Presently, it remains a philosopher’s concern – but one exposing law’s moral limits.  

  **Final Verdict**: The residue is a **genuine gap** reflecting corporate law's intentional neutrality toward existential ethics. Jaspers isn't stretching language; he's spotlighting what law *chooses* to exclude. Whether that gap *should* be filled isn't legal – it's political.
