  First, I need to recall what the Principal Principle (PP) covers. It links credence to known chances. But the user wants more. The cases they listed point to gaps in PP. For example, learning the law without outcomes—PP handles known chances but not when you only know the law. Reference class issues: if you find out the chance was conditional on a wrong reference class, how should you update? Being inside the system, like a deterministic universe—chances might not apply, so how does deference work there?

  Then the distinctions: first-order chance (the actual probability) vs second-order (uncertainty about what the chance is). Knowing the law (e.g., quantum mechanics) vs applying it correctly to a specific case. These need separate handling to avoid confusion.

  Hard constraints: physics might have deterministic laws or non-separable probabilities. Decision theory requires Dutch book coherence. Any theory must respect these without contradiction.

  Conflicting desiderata: belief revision when discovering misdescribed setups without bootstrapping. Bootstrap problem is when current beliefs justify themselves via chance, leading to circularity. But if you allow too much revision, it might undermine the chance concept. So balancing these is tricky.

  Which requirement is toughest? Probably the anti-bootstrap plus belief revision. Lewis's PP had issues with undermining futures. New Principle (NP) fixed that but introduced other issues. Other theories might struggle with self-locating probabilities or reference classes.

  I should list all desiderata systematically. Start with core deference, then edge cases, distinctions, constraints, conflicts. Highlight where NP fails, like handling self-location or non-separable probabilities. Also, frequentist approaches might have issues with single-case probabilities or reference classes.

  User's deeper needs: they likely want a robust framework that handles real-world uncertainties—misapplied chances, incomplete information, updating beliefs when models are wrong. They might be in philosophy of science or decision theory, needing a comprehensive model that avoids pitfalls of existing theories. They mentioned avoiding scoring alternatives, so focus on criteria, not comparing Lewis vs others. But must mention why NP isn't enough. Need to ensure the list covers practical and theoretical challenges, especially in scientific contexts where chance setups are often revised.
answer: |-
  Here’s a comprehensive desiderata list for a theory of rational deference to objective chance, structured by category, with critical constraints and known conflicts flagged. The list prioritizes *what the theory must achieve* rather than evaluating existing proposals.

  ---

  ### **I. Core Deference Requirements**
  1. **Principal Principle Compliance**:  
     Must ground the core intuition: If an agent knows the objective chance \( ch(A) = x \) at time \( t \), their credence \( cr(A) \) should be \( x \), absent inadmissible information.

  2. **Admissibility Handling**:  
     Must define "inadmissible information" precisely (e.g., information about future outcomes beyond chance facts) and explain how it overrides chance constraints.

  3. **Time-Relativity**:  
     Must respect that chances evolve over time (e.g., \( ch_t(A) \neq ch_{t'}(A) \)), and specify how credences track temporal updates.

  ---

  ### **II. Edge Cases & Problematic Scenarios**
  4. **Learning the Law Without Outcomes**:  
     *Must handle:* An agent knows the chance *law* (e.g., "quantum mechanics is true") but lacks specific chance values (e.g., doesn’t know the wavefunction for a system). Should still permit reasonable initial credences.

  5. **Reference Class Mismatch**:  
     *Must handle:* Discovering that a chance assignment was applied to the wrong reference class (e.g., learning a cancer risk was for adults, not children). Should allow non-arbitrary credence revision.

  6. **Self-Locating Uncertainty in Chancy Systems**:  
     *Must handle:* Agents embedded in a chancy process (e.g., Boltzmann brains, quantum immortality). Deference shouldn’t lead to incoherence or paradoxes.

  7. **Degenerate & Deterministic Chances**:  
     *Must handle:* Cases where \( ch(A) = 0 \) or \( 1 \) (e.g., in classical mechanics). Credences should align without trivializing learning.

  ---

  ### **III. Key Distinctions to Preserve**
  8. **First-Order vs. Second-Order Uncertainty**:  
     Must distinguish uncertainty *about outcomes* (governed by \( ch \)) from uncertainty *about the chances themselves* (governed by meta-credences). Collapsing these invites epistemic recklessness.

  9. **Knowing the Law vs. Correct Application**:  
     Must not conflate knowing a general law (e.g., Schrödinger equation) with knowing how to apply it to a specific system (e.g., this particle’s Hamiltonian). Misapplication should not validate false chances.

  10. **Chance as Guide vs. Chance as Fact**:  
      Must separate the *epistemic role* of chance (constraining credences) from its *metaphysical status* (e.g., frequencies, propensities). Deference should not presuppose a specific ontology.

  ---

  ### **IV. Hard Constraints from Physics & Decision Theory**
  11. **Physical Consistency**:  
      Must respect:
      - **Determinism**: If physics is deterministic (e.g., GRW collapse models), chances must be 0/1 or undefined, not "fuzzy."
      - **Non-Separability**: In QM, chances for entangled systems can’t be reduced to local chances.
      - **Relativistic Causality**: Chances can’t depend on future events outside the past light cone.

  12. **Decision-Theoretic Coherence**:  
      Must avoid Dutch books and align with rational choice:  
      - If \( ch(A) = x \), betting odds should be \( x:1-x \).  
      - Updating must satisfy Bayesian conditionalization *when applicable*.

  13. **Consistency with Induction**:  
      Chance assignments should support (or at least not contradict) empirical learning from frequencies.

  ---

  ### **V. Belief Revision & Bootstrapping Problems**
  14. **Misdescription Recovery**:  
      Must allow rational belief revision when discovering a chance setup was misdescribed (e.g., "I thought this coin was fair, but it’s biased"). Revision shouldn’t require pre-existing knowledge of the "true" chance.

  15. **Anti-Bootstrapping**:  
      Must block circular self-justification (e.g., "I believe \( ch(A)=0.6 \), therefore evidence for A is discounted, reinforcing my belief in \( ch(A)=0.6 \)").  
      **⚠️ Conflict Alert**: Jointly satisfying (14) and (15) is the **central tension**. Allowing revision threatens bootstrapping; preventing bootstrapping can freeze beliefs.

  ---

  ### **VI. Problematic Combinations & Unsatisfiable Subsets**
  - **Deadly Triad**: The following three are jointly unsatisfiable in many proposals:  
    (i) **Deference to chances under self-location** (6),  
    (ii) **Anti-bootstrapping** (15),  
    (iii) **Non-trivial chances in deterministic systems** (7).  
    *Example:* In a multiverse with deterministic branching, (i) and (iii) force credences that violate (ii).

  - **Reference Class + Revision Paradox**:  
    Satisfying (5) and (14) while avoiding (9) often requires a "meta-chance" layer, risking regress.

  ---

  ### **Requirement That Kills Popular Accounts**
  - **The Anti-Bootstrapping Constraint (15)** is the most lethal:  
    - **Lewis’s Original PP**: Fails due to *undermining futures* (possible futures where chance laws are invalidated by outcomes, creating incoherence).  
    - **Frequentist Approaches**: Fail (15) when probabilities are assigned to single cases (e.g., "this coin bias is 0.6" based on finite frequency).  
    - **"New Principle" (NP)** Fixes bootstrapping but struggles with (6) and (7), especially in non-separable or deterministic physics.  
    - **Humean Best Systems**: Often circular—can’t satisfy (14) without (9) violations.

  ---

  ### **Summary Table of Desiderata**

  | **Category**               | **Desideratum**                                 | **Critical Challenge**                                  |
  |----------------------------|------------------------------------------------|---------------------------------------------------------|
  | **Core Deference**         | 1. Principal Principle Compliance              | Base requirement                                        |
  |                            | 2. Admissibility Handling                      | Defining "inadmissible" non-circularly                 |
  |                            | 3. Time-Relativity                             | Tracking chance drift                                  |
  | **Edge Cases**             | 4. Learning Laws                               | Credences without instance-level chances               |
  |                            | 5. Reference Class Mismatch                    | Non-arbitrary revision after error                     |
  |                            | 6. Self-Locating Uncertainty                   | Avoiding incoherence for embedded agents               |
  |                            | 7. Degenerate/Deterministic Chances            | Alignment with physical reality                        |
  | **Distinctions**           | 8. First vs. Second-Order Uncertainty          | Preventing meta-uncertainty collapse                   |
  |                            | 9. Law vs. Application Knowledge               | Blocking false delegations                             |
  |                            | 10. Epistemic vs. Metaphysical Role            | Ontological neutrality                                 |
  | **Hard Constraints**       | 11. Physical Consistency                       | Respecting relativity, QM, determinism                 |
  |                            | 12. Decision-Theoretic Coherence               | Dutch book immunity                                    |
  |                            | 13. Consistency with Induction                 | Empiricism without frequentism                         |
  | **Belief Revision**        | 14. Misdescription Recovery                    | Revising credences when models are wrong               |
  |                            | 15. Anti-Bootstrapping ⚠️                      | **Most lethal to popular theories**                    |
  | **Conflicts**              | (6)+(7)+(15) or (5)+(9)+(14)                   | Leads to regress or paradox                            |

  ---

  ### **Key Philosophical Takeaway**
  The tension between **allowing rational revision of chance beliefs** (14) and **preventing self-justifying bootstraps** (15) is the primary fault line. A viable theory must either:
  - Restrict revision so severely that it becomes inapplicable to real-world errors (e.g., Lewis’s NP),  
  - Introduce a non-chancy meta-layer (inviting regress), or  
  - Reject objective chances as direct credence guides (e.g., via "ur-chances" or epistemic proxies).  
  No current theory cleanly satisfies all desiderata, making this a frontier problem in formal epistemology.
