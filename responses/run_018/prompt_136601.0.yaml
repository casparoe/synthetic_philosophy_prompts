answer: |-
  ## Proposal: Democratic Backsliding as Institutional Trust Decay: Rescuing the Concept from Partisan Frameworks?

  **Project Title:** Beneath the Breakdown: Reconstructing Democratic Backsliding as a Crisis of Institutional Trust

  **Research Question:** Can democratic backsliding be productively reconstructed as a primarily *pre-institutional* phenomenon of systemic trust decay among citizens, observable through non-partisan metrics, and does applying this lens to Hungary, Poland, Turkey, and the US either validate standard backsliding verdicts or reveal partisan biases inherent in procedural/substantive definitions?

  **The Stalled Debate: Why Procedural/Substantive Frameworks Leave Trust Decay Unexamined**
  The dominant debate treats backsliding as either:
  1.  **Procedural Failure:** Erosion of electoral integrity, judicial independence, legislative checks (e.g., V-Dem indices).
  2.  **Substantive Failure:** Decline in rights protections, minority inclusion, equality before the law (e.g., Freedom House scores).

  **Both frameworks share a critical blind spot:** They focus on the *objective condition of institutions themselves*, assuming that if institutions *function* technically (procedural) or *output* just outcomes (substantive), democratic health is assured. This misses the **hidden dependency**: democratic resilience relies fundamentally on citizens perceiving institutions as *authoritative* and *legitimate arbiters*, regardless of technical function or specific outputs. A technically sound court issuing a ruling lacks democratic force if a critical mass of citizens dismisses its legitimacy. This *trust decay* often precedes and enables formal institutional capture. The procedural/substantive debate cannot adequately address this because it starts *after* institutions are contested, failing to explain *why* citizens withdraw consent from *functioning* systems. My framing genuinely leaves open whether perceived backsliding correlates primarily with institutional changes or with prior, independent collapses in perceived legitimacy.

  **Methodology: A Three-Month Inquiry into Trust Trajectories**

  *   **Month 1: Reconstructing the Metric & Baseline:**
      *   **Task 1:** Identify and synthesize existing longitudinal survey data tracking *generalized institutional trust* (not satisfaction with specific policies/incumbents) relevant to democracy's foundations (e.g., trust in parliament, courts, civil service, electoral commission, media). Primary sources: World Values Survey (WVS), European Social Survey (ESS), Eurobarometer (for HU/PL), Pew Global Attitudes (for US/TR), Turkish Statistical Institute (TUIK) surveys, Gallup US polls. Focus on metrics asking about "trust" or "confidence" in the *institution*, not current leaders.
      *   **Task 2:** Define the core "Trust Decay" metric: **Sustained, significant decline in aggregate citizen trust across multiple core democratic institutions over a defined period (e.g., 10-15 years), uncorrelated solely with short-term economic shocks.** Establish baseline trust levels for each country circa ~2005-2010 (pre-widespread backsliding discourse).
      *   **Output:** Operationalized trust-decay metric; visualized baseline trust profiles for each case.

  *   **Month 2: Comparative Trust Trajectories & Institutional Mapping:**
      *   **Task 1:** Apply the trust-decay metric to each case (HU, PL, TR, US). Chart longitudinal trends (2005-present). Identify inflection points, rates of decline, and divergence between institutional sectors (e.g., courts vs. parliament).
      *   **Task 2:** Map these trust trajectories *alongside* key procedural/substantive backsliding events/indices (using V-Dem Liberal Democracy Index, Freedom House scores, academic case studies). Did significant trust decay *precede*, *accompany*, or *follow* major institutional changes (e.g., Fidesz's supermajority, Polish judicial reforms, Turkish constitutional referendum, US Jan 6th)? Quantify temporal relationships.
      *   **Output:** Comparative timelines overlaying Trust Decay curves with procedural/substantive backsliding markers for each country.

  *   **Month 3: Analysis: Validation, Splitting, or Bias?**
      *   **Task 1:** Test co-variation: Does severe trust decay consistently correlate with countries classified as backsliding (HU, PL, TR)? Does the *absence* of significant trust decay correlate with non-backsliding cases (select a stable comparator if needed, e.g., Germany)?
      *   **Task 2:** Examine the "Split": Does the US case – often contested in partisan backsliding debates – show a trust-decay profile more akin to HU/PL/TR or to stable democracies? Does the trust metric resolve ambiguity where procedural/substantive criteria might conflict (e.g., formally "correct" procedures yielding illiberal outcomes)?
      *   **Task 3:** Assess Partisan Bias: Does the trust-decay narrative align primarily with one ideological bloc's diagnosis, or does it cut across partisan lines by focusing on citizen perception rather than policy outcomes? Does it reveal cases where institutional changes occurred *without* prior mass trust decay (elite-driven), or vice-versa (decay without major institutional change)?
      *   **Output:** Analysis report answering the core research question; visualizations highlighting correlations/splits; draft findings section.

  **What Success Looks Like (Saving the Concept):**
  A successful outcome demonstrates that **significant trust decay is a necessary, observable precursor to severe backsliding** in HU, PL, and TR, providing a non-partisan diagnostic tool. Crucially, it shows the **US exhibits a distinct, severe trust-decay pattern similar to clear backsliders**, validating concerns often dismissed as partisan, or conversely, reveals the US pattern differs fundamentally, exposing potential bias in lumping it with HU/PL. Success means the trust lens *explains* contested cases by highlighting the decay process *before* institutional capture, strengthening the concept's objectivity.

  **What Failure Looks Like:**
  The project fails if: 1) No clear, significant trust-decay pattern emerges in any backsliding case; 2) Trust decay patterns are chaotic, show no temporal precedence over institutional change, or correlate weakly with backsliding verdicts; 3) The US trust profile is indistinguishable from stable democracies, undermining claims of its backsliding *even via this non-partisan metric*; 4) The trust metric itself proves impossible to construct robustly from available data within the timeframe. Failure suggests trust decay is epiphenomenal or inseparable from partisan narratives.

  **Feasibility & Position: Can 3 Months Do This?**
  Three months is **tight but feasible** for this focused, comparative analysis. Success depends critically on accessible, high-quality longitudinal survey data (WVS, ESS, Pew are robust). I won't conduct original surveys but will rigorously analyze existing datasets. The scope is deliberately limited to constructing the metric, mapping trends, and initial correlation testing against standard verdicts. Deeper causal analysis or expanding the case base requires further research. **This is a proof-of-concept study.**

  **Defending the Trust Framing: Why it Rescues the Concept**
  I argue **yes, the trust-decay framing significantly rescues the concept of democratic backsliding.** It addresses the core weakness of procedural/substantive approaches by focusing on the *precondition* for democratic function: citizen acceptance of institutional authority. It offers a **non-partisan observable (trust levels)** instead of contestable judgments about procedure ("Were courts *really* independent before?") or substance ("Are these rights restrictions *truly* unjustified?"). The closest competing framing is **elite-driven theories** (e.g., Levitsky & Ziblatt's "How Democracies Die"), which focus on norm-breaking by leaders. While crucial, this misses the *enabling condition*: leaders can only dismantle institutions if public trust is already low enough to permit it. Trust decay explains *why* elites succeed. Framing backsliding as fundamentally a crisis of legitimacy rooted in citizen perception provides a more foundational, less partisan, and potentially more predictive understanding. This project tests that claim empirically.
