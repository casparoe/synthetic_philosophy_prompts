  Below is a complete design for your in-class exercise, structured to evoke the inevitability of strategic manipulation through a "preference-laundering" mechanism. The exercise incorporates institutional friction, hidden incentives, and a payoff scheme tied to course points to create tangible pressure for misrepresentation.

  ---

  ### **Exercise Title:** Preference Laundering: Delegation and Manipulation  
  **Session Duration:** 60 minutes  
  **Participants:** 18 students  

  ---

  ### **Scenario**  
  The class must select one of three structures for the next module:  
  - **A**: Final Examination  
  - **B**: Independent Research Paper  
  - **C**: Collaborative Presentation  

  Each student privately ranks these options (1st, 2nd, 3rd) and holds a hidden preference for how the decision is made: *sincere aggregation* (truthful voting) or *coalition-building* (strategic deal-making).  

  ---

  ### **Mechanism: Preference-Laundering (Two-Stage Process)**  
  #### **Stage 1: Delegated Preference Submission (15 minutes)**  
  - **Group Assignment:**  
    - Randomly assign students to three "delegation groups" (6 students per group, including an agenda setter).  
    - Randomly select 3 agenda setters (one per group).  
  - **Private Information:**  
    - Each student receives a card with:  
      - **Cardinal ranking** over A, B, C (e.g., "A: 10 points, B: 7 points, C: 3 points").  
      - **Second-order preference**: "Sincere" or "Coalition-Builder" (assigned randomly, 50/50 split).  
  - **Task:**  
    - Students submit an anonymous "delegated preference vector" (a complete ranking of A, B, C) to their agenda setter.  
    - **Key Friction:** Students may misrepresent their true ranking. Agenda setters see all submissions but are not bound by them.  
  - **Coalition Signals:**  
    - Allow 5 minutes for open discussion. Students/agenda setters may signal coalition intentions (e.g., "Group 2 supports B!"), but submissions remain anonymous.  

  #### **Stage 2: Agenda Setter Reporting (20 minutes)**  
  - **Task:**  
    - Agenda setters submit a **modified Borda ballot**: A ranking of *at least two* options (e.g., "A > B" or "C > A > B"). They may strategically omit options to manipulate outcomes.  
    - Borda scoring: If *k* options are ranked, 1st gets *k-1* points, 2nd gets *k-2*, ..., last gets 0. Omitted options get 0.  
  - **Institutional Pressure:**  
    - Agenda setters face no obligation to be truthful. They see their group’s delegated preferences but prioritize personal payoffs.  
    - Allow 10 minutes for agenda setters to discuss cross-group coalitions (e.g., "I’ll omit C if you rank B first").  

  #### **Outcome Determination (5 minutes)**  
  - The facilitator tallies Borda scores from the three agenda setters’ ballots.  
  - **Tie-breaking**: Most 1st-place rankings > Alphabetical order (A > B > C).  
  - Announce:  
    - Winning option (e.g., "B wins!").  
    - Agenda setters who included the winner (e.g., "Group 1 and Group 3 included B").  

  ---

  ### **Payoff Matrix**  
  Students earn **course-participation points** based on:  
  1. **Top-Ranked Outcome**: +10 points if the winner matches their *true* 1st choice.  
  2. **Coalition Membership**: +5 points if their agenda setter included the winner.  

  | Outcome                             | Points Earned                                  |  
  |-------------------------------------|-----------------------------------------------|  
  | Winner = True 1st choice            | 10 points                                     |  
  | Winner ≠ True 1st choice            | 0 points                                      |  
  | In winning coalition                | +5 points (if agenda setter included winner) |  

  **Example**:  
  - A student with true ranking **B > A > C** and agenda setter in Group 1.  
    - If **B wins** and Group 1 included **B**: 10 + 5 = 15 points.  
    - If **A wins** and Group 1 included **A**: 0 + 5 = 5 points.  
    - If **C wins** and Group 1 omitted **C**: 0 + 0 = 0 points.  

  Agenda setters earn points identically (based on *their* true preferences and coalition status).  

  ---

  ### **Timeline**  
  | Time          | Activity                                                                 |  
  |---------------|--------------------------------------------------------------------------|  
  | **0–5 min**   | **Intro**: Explain rules, assign groups/agenda setters, distribute private info. |  
  | **5–15 min**  | **Stage 1**: Discussion → Anonymous submission of delegated vectors.        |  
  | **15–30 min** | **Stage 2**: Agenda setters discuss → Submit modified Borda ballots.      |  
  | **30–35 min** | **Tally & Announce**: Winner and winning coalitions.                      |  
  | **35–60 min** | **Debrief**: Map experiences to Gibbard-Satterthwaite (see below).        |  

  ---

  ### **Debrief Structure (25 minutes)**  
  1. **Student Reflections (5 min)**:  
     - Ask: "Who misrepresented preferences? Why?"  
     - Probe tension: "Sincere" students vs. "Coalition-Builder" incentives.  

  2. **Link to Gibbard-Satterthwaite (15 min)**:  
     - **Concrete Moments → Theorem Conditions**:  
       - *Example 1*: A student lies in Stage 1 after hearing "Group 2 supports B!"  
         → Maps to **misrepresentation under non-dictatorship** (theorem assumes ≥3 options).  
       - *Example 2*: An agenda setter omits a disliked option to boost their 2nd choice.  
         → Maps to **strategic ballot manipulation** (no strategy-proof voting rule exists).  
     - **Limitation of the Exercise**:  
       - Gibbard-Satterthwaite quantifies over *all* preference profiles. This exercise uses one randomized profile—it cannot show manipulation is *always* possible, only that it arises under common incentives.  

  3. **Universal Quantification Gap (5 min)**:  
     - Clarify: The theorem proves manipulation exists for *every* non-dictatorial rule and *some* preference profiles. The exercise fixed one profile but varied incentives to simulate pressure.  

  ---

  ### **Predicted Breakdowns & Mitigation**  
  - **Problem 1: Proxy Confusion**  
    - *Prediction*: Students misunderstand delegation (e.g., "Why submit preferences if agenda setters ignore them?").  
    - *Mitigation*: **Pre-empt confusion** in the intro: "Agenda setters see your submissions but can change them—like politicians ignoring constituents. Your goal: Influence them via your report and signals."  

  - **Problem 2: Coalition Chaos**  
    - *Prediction*: Overwhelming cross-group deals (e.g., all 3 agenda setters collude to fix Borda scores).  
    - *Mitigation*: **Intervene neutrally**: "Remember, you’re graded *individually*. Will your coalition hold if someone defects for +10 points?"  

  - **Problem 3: Tie Overload**  
    - *Prediction*: Frequent ties due to Borda omissions (e.g., all options score 4 points).  
    - *Mitigation*: **Use tiebreakers consistently** (1st-place votes > alphabetical order). Announce tiebreak logic *before* tallying.  

  **Facilitator Note**: If chaos erupts, **do not resolve strategic tension**. Ask: "What institutional flaws caused this? How does this mirror real-world voting?" Redirect to debrief.  

  ---

  ### **Materials**  
  - **Cards**: 18 preference cards (randomized rankings + second-order labels).  
  - **Ballots**: Delegation vectors (Stage 1); modified Borda sheets (Stage 2).  
  - **Slides**: Rules, payoff examples, tiebreak protocol.  

  This exercise forces students to confront manipulation as a rational response to institutional design. By embedding hidden incentives in a high-stakes academic context, it transforms Gibbard-Satterthwaite from an abstraction into a visceral lesson on democracy’s fragility.
