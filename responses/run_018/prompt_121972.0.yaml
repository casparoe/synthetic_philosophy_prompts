answer: |-
  Here’s a warm, concise toast weaving Keynes in naturally – under 400 words and designed to resonate with both groups:

  **(Raise your glass)**  
  **What we should all remember about [Chair's Name] is this: He kept the lights on so the rest of us could dream.**  

  For thirty years running this lab, [Chair's Name] wrestled with budgets, chased grants, and obsessed over growth metrics – the real, tangible stuff. The "absolute needs" of this place, as Keynes might put it. Things like equipment that works, salaries that get paid, heat in the winter... needs you can actually satisfy.  

  Now, many of you economists know the essay he kept in that drawer – Keynes dreaming about a future where we’d solved that basic "economic problem" of survival. Where we could finally focus on the good life: contemplation, friendship, art, joy.  

  But Keynes was also brutally honest – maybe *too* honest for university politics! – about the "relative needs" that kick in once survival’s covered. The endless competition for status, prestige, that next big thing... needs that are insatiable. The kind of "mental illness" he pointed to, that [Chair's Name] would sometimes chuckle darkly about over coffee when another funding memo landed.  

  Here’s the thing about [Chair's Name]: He spent decades mastering the *means* – the spreadsheets, the projections, the absolute necessities – precisely **because** he understood they were *never* the end goal. He knew the "relative needs" treadmill of academia – the rankings, the rivalries, the sheer *more* – would always outrun any budget he built. He wasn't chasing that illusion.  

  His quiet genius was in building the platform. Keeping the lights literally *and* figuratively on. Making sure the absolute needs were met, reliably, year after year. So that the researchers in this lab? So that *all of us*? We could chase the things Keynes imagined. The contemplation. The big ideas. The collaborations that became friendships. The sheer joy of figuring something out.  

  He didn’t solve the economic problem – Keynes knew that was always a moving target. But he gave us the stable ground, the working lab, the funded project... the space to try. He gave us the *absolute* so we could reach, however imperfectly, for the *relative* that actually matters: building something meaningful together.  

  So, to [Chair's Name]: Thank you for thirty years of keeping our lights on, our heat running, and our dreams funded. May your own next chapter be full of the contemplation, friendship, and joy you made possible for us. Cheers!  

  **Key elements addressed:**  
  *   **Bottom Line First:** "He kept the lights on so the rest of us could dream."  
  *   **Keynes Split Made Accessible:** "Absolute needs" (real, solvable - budgets/lights) vs. "Relative needs" (insatiable status/prestige).  
  *   **His Role:** Mastered the means (budgets/metrics) knowing they aren't the ends.  
  *   **Why It Mattered:** Created stability so others could pursue Keynesian higher goals (contemplation, friendship, ideas).  
  *   **No Overstatement:** "He didn’t solve the economic problem... But he gave us the stable ground."  
  *   **Warmth/Tone:** Personal ("that drawer," "chuckle darkly"), focused on *enabling others*, celebratory ending.  
  *   **Room Composition:** Explains Keynes simply for family, uses the framework meaningfully for economists.  
  *   **Word Count:** ~360 words.
