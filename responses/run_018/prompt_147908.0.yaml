answer: |-
  That's a sharp observation highlighting a profound inconsistency in aquaculture welfare standards. The split you describe exposes several intertwined assumptions, practical limitations, and potential ethical contradictions. Let's break down the theories hiding in the split and its implications:

  **Likely Underlying Assumptions & Theories:**

  1.  **Neuroanatomy-Based Binary Sentience Threshold:** This is the most prominent implicit theory. Vertebrates (like salmon) possess centralized brains with structures analogous to mammalian limbic systems and neocortices (or similar integrative pallia in fish), which are widely (though not universally) accepted as the physical substrate for conscious experience and suffering. Invertebrates like shrimp and crabs have decentralized nervous systems without these specific structures. Many schemes draw a line at vertebrates or specific vertebrate classes, implicitly assuming invertebrates lack sentience or possess it at a negligible level. *This is increasingly challenged by crustacean welfare science.*
  2.  **"Negative Welfare Only" vs. "Positive Welfare":** The scheme implicitly treats crustaceans as capable only of experiencing *negative* states (pain, stress leading to death/poor growth), hence only survival and FCR matter. Salmon, however, are deemed capable of experiencing *positive* states (relief, comfort, enjoyment), justifying the measurement of behavioral budgets, space, and enrichment. **The assumption is that welfare for crustaceans is purely about avoiding death and severe physiological stress, not about providing opportunities for positive experiences or natural behaviors.** This ties back to sentience assumptions.
  3.  **Complexity of Behavior as a Proxy for Sentience:** Salmon display complex, observable behaviors (social hierarchies, exploration, play-like behavior) that intuitively suggest an "inner life." Shrimp and crab behavior in dense aquaculture settings is often perceived as simpler, more reflexive, or harder to observe/discern meaningfully, leading to the assumption they lack the cognitive complexity necessary for significant suffering or positive states. *This overlooks documented complex crustacean behaviors (learning, avoidance, social interactions).*
  4.  **Tractability & Economic Pragmatism (The "Easy Out"):** Measuring survival and FCR is cheap, easy, and directly tied to farm economics. Monitoring complex behaviors, environmental enrichment, or stress responses in dense shrimp ponds or crab systems is logistically difficult, expensive, and lacks standardized, validated metrics. Applying salmon-level welfare to billions of tiny shrimp seems daunting and costly. **This isn't a *moral* theory, but a powerful practical driver reinforcing the lower standards.**
  5.  **Evolutionary Distance / Anthropocentric Bias:** Humans relate more easily to fish (vertebrates) than to crustaceans. This unconscious bias influences both scientific prioritization and consumer/certifier concern. Lobsters get more attention partly because they are large, consumed whole/visibly, and their boiling is graphic. Shrimp are small, numerous, and often processed out of sight.
  6.  **Harvest Method Inconsistency - Risk of Visible Suffering vs. Invisible Stress:** Banning live-boiling (for lobsters in *restaurants*) addresses a practice that *looks* cruel and causes *visible* distress reactions, catering to consumer perception. Rapid chilling of shrimp happens out of sight; while physiological stress markers exist, they aren't overtly dramatic. The lobster ban might be more about optics and avoiding public relations nightmares than a deep commitment to crustacean welfare per se. **This reveals a moral inconsistency: visible suffering is banned, while invisible suffering caused by approved methods is ignored.**

  **Is it Consistent with "Science-Based"?**

  *   **Partially, but Outdated and Inconsistent:** It relies *selectively* on science.
      *   The salmon standards incorporate more recent ethology and welfare science.
      *   The crustacean standards rely on *older* science (or assumptions) that dismissed invertebrate sentience and focused purely on production metrics. They largely ignore the growing body of evidence for crustacean nociception, stress responses, learning, and complex behaviors suggesting sentience.
      *   Applying fundamentally different criteria to animals within the same supply chain, based on phylum rather than the best available evidence for their capacity to suffer, is **scientifically inconsistent**. A truly science-based scheme would evaluate the sentience and welfare needs of each species based on current evidence for *that species*, not a vertebrate/invertebrate divide.
  *   **Conclusion:** It can claim to be "science-based" only by using a very narrow, outdated, and inconsistent interpretation of the science, particularly regarding invertebrates. It fails to meet the standard of being based on the *best available current science* across all species covered.

  **What Would Change if Applying Salmon Welfare Logic to Crustaceans?**

  Applying the *same* welfare philosophy (sentience acknowledged, focus on natural behavior, environmental enrichment, minimizing stress, considering positive states) would necessitate a radical overhaul for crustacean audits:

  1.  **Beyond Survival & FCR:**
      *   **Behavioral Budgets:** Tracking time spent foraging, resting, exploring, interacting (aggressively/cooperatively), sheltering, and abnormal behaviors (e.g., excessive swimming at tank edges in shrimp, lethargy). This requires detailed ethograms developed for each species/life stage.
      *   **Environmental Complexity:** Mandating habitat enrichment – substrates for digging/burrowing (shrimp/crabs), shelters/hiding places, varied topography. For shrimp in ponds/tanks, this might mean adding structures, varying substrate types, or ensuring adequate biofilm growth.
      *   **Space & Stocking Density:** Defining minimum space/density based on behavioral needs, not just maximizing survival/growth. This would likely mean significantly lower stocking densities.
      *   **Water Quality Parameters:** Setting stricter, behaviorally-relevant standards (e.g., dissolved oxygen levels preventing escape responses, turbidity levels allowing natural foraging).
      *   **"Positive Welfare" Indicators:** Researching and potentially measuring indicators of exploration, engagement with enrichment, or reduced neophobia (fear of novelty). This is nascent even for fish, but the *principle* would need to be incorporated.

  2.  **Revolutionizing Harvest & Slaughter:**
      *   **Banning Rapid Chilling (as a sole method):** Recognizing the clear stress response (elevated lactate, struggling), it would be deemed unacceptable as a primary slaughter method without prior stunning.
      *   **Mandating Effective, Immediate Stunning:** Requiring validated electrical or mechanical stunning methods *before* chilling or other killing steps. Research would need to confirm effectiveness for each species/size. This mirrors the shift seen for fish and lobsters.
      *   **Handling Protocols:** Strict protocols to minimize air exposure, crushing, and rough handling during harvest and transport, recognizing these as significant stressors.

  3.  **Audit Methodology Changes:**
      *   **Observational Focus:** Audits would need trained observers spending significant time recording behaviors in representative samples.
      *   **Environmental Audits:** Detailed inspection of habitat complexity, space utilization, and water quality logs focusing on welfare implications.
      *   **Slaughter Verification:** Direct observation or video review of stunning and slaughter procedures to ensure effectiveness and compliance.

  **The Core Challenge:** Implementing this for high-density, high-volume crustacean farming is incredibly challenging and expensive. Validated, practical metrics for many crustacean welfare indicators are still under development. However, acknowledging this challenge is different from denying the underlying sentience or welfare needs based on outdated assumptions.

  **In essence:** The current split reveals an implicit, outdated hierarchy of moral status based primarily on neuroanatomy (vertebrate vs. invertebrate), prioritizing tractability and vertebrate-centric perceptions of welfare. Aligning crustacean welfare with salmon welfare would require a paradigm shift: accepting their capacity for suffering *and* positive experiences, demanding significant changes in farming practices, environmental management, handling, slaughter, and audit methodologies based on species-specific ethology and the growing science of invertebrate sentience.
