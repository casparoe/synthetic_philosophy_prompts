  so in a bunch of european aquaculture certification schemes they do these welfare audits where for salmon they track 'behavioral budgets' — like vertical swimming range, current variation, even funding studies on 'positive welfare' and play-like behavour. but for shrimp and crabs in the exact same supply chain they only measure survival rate and feed conversion. and at harvest they allow rapid chilling for shrimp even though it triggers clear stress responses, while they ban live-boiling lobsters in partner restaurants but dont require electrical stunning for farmed crustaceans. what theory of moral status or welfare is hiding in that split? does it presuppose sentience is binary and tied to some neuroanatomy line, or that welfare only counts if an animal can have 'positive' states? could it just be tractability? is it consistent with calling the scheme science-based? and what would have to change in the audit if they actually applied the same welfare logic to crustaceans?
