  Finally, the episode confirms pure time preference is indeed a moral parameter disguised as technical. Stern rightly set δ near zero but faced institutional constraints; as a government adviser, he couldn’t fully ignore market rates, though he mitigated this by treating δ as the core ethical lever.  

