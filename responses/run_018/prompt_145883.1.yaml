answer: |-
  ## The Resonance of Hollowed Stone

  **Brainstorming Scaffolding:**  
  In a post-literate tactile culture, cultural replication ("memes") faces unique pressures:
  1.  **Medium:** Stone vibration. Limits complexity, favours rhythmic patterns over narrative. Transmission requires physical proximity and direct contact.
  2.  **Replication:** Imperfect copying through touch (like a game of telephone via vibration). "Mutations" occur via mis-taps, intentional variation, or environmental interference (e.g., damp stone).
  3.  **Selection Pressures:**
      *   **Emotional Resonance:** Does the rhythm reliably evoke a *shared, desirable* emotional state (euphoria, calm, solidarity, cathartic grief)? This is paramount – the "fitness" test.
      *   **Memorability:** Is the pattern simple, repetitive, or structurally satisfying (symmetry, call-and-response) enough to be accurately recalled and retapped?
      *   **Contextual Utility:** Does it fulfil a communal need – coordinating labour, soothing anxiety after a storm, bonding during ceremony?
      *   **Transmissibility:** Is it easily felt and replicated through the stone by hands of different sizes and strengths?
  4.  **Evolution:** Successful rhythms ("fit memes") spread rapidly across the settlement walls. Failed ones (causing confusion, discord, or no response) fade, forgotten. Variations compete; the most resonant versions survive.

  ---

  **The Story: The Thrum That Held**

  The air in The Hollow hung thick with the scent of damp stone and cold ash. Literacy was dust, forgotten longer than the names of the stars obscured by the perpetual roof-smog. Communication wasn’t seen or spoken; it was **felt**. The great, curving walls of the communal dwelling – the Drumstone – weren't just shelter; they were the nervous system of the settlement, the medium for every idea, every feeling, every scrap of culture that survived.

  Elara’s fingertips, calloused and sensitive, traced the familiar coolness. She wasn't a leader, not in the old sense. She was a *tuner*, one who listened to the Drumstone’s pulse and understood the survival of rhythms. Her world was one of vibration, a constant, low-level thrumming beneath the daily grind of foraging and repair. This thrumming *was* their shared mind.

  Today, the dominant rhythm was **The Thrum of Gathering Light**. Not its true name, of course – names were as useless as books here. It was a sequence: a deep, resonant *boom* (right palm heel), followed by three rapid, lighter *taps-tap-tap* (fingertips), then a pause just long enough to feel its absence before repeating. Simple. Palindromic. Satisfying. Its "fitness" was undeniable. Whenever tapped, especially near the central hearth-stone, it evoked a profound sense of calm unity, a warm, shared euphoria that smoothed frayed nerves and synced breathing. People gathered instinctively, shoulders relaxing, faces softening. It replicated like wildfire because it *worked*; it made the harshness of Hollow life bearable, fostering cooperation. A meme perfected by selection for collective emotional utility.

  Elara felt its passage now, strong and sure, vibrating up her arm as Old Bren passed the sequence to young Kael near the water cistern. Kael’s replication was slightly rushed, the pause clipped. A minor mutation. Elara held her breath. Would it degrade, lose its power? Kael retapped it. The clipped pause remained, but the core *boom... taps-tap-tap...* held. The warm resonance still bloomed in Elara’s chest, mirrored in the slight easing of Kael’s posture. The mutation was neutral, perhaps even adaptive for faster transmission. It would survive.

  But not all rhythms were so fit. Last week, a newcomer, Jorik, driven by grief after losing his foraging partner to a rockfall, had hammered out a frantic, dissonant staccato – *rat-tat-BANG-scrape-rat-tat*. It jarred the bones, sparked anxiety, made children whimper. People physically recoiled from the wall where he tapped. Within hours, the rhythm was gone. No one replicated it. Its emotional payload was toxic, unfit for the community’s needs. Jorik’s pain was real, but the *expression* hadn't resonated; it failed the selection test. The meme died, unremembered.

  Now, Elara detected a new challenger vibrating faintly from the North Curve. Lyra, the weaver, was experimenting. Over the stable base of the Gathering Light, she layered a secondary counter-rhythm: a delicate *shiver-shiver* (fingernails dragged lightly) against the *boom*, and a single, deep *press* during the pause. Elara focused, letting the combined vibration travel through her.

  The effect was complex. The familiar euphoria was there, but layered with a poignant undercurrent, a bittersweet ache. It wasn't discordant like Jorik's; it was... deeper. It resonated with the unspoken collective grief for the lost sun, the buried world. Tears pricked Elara’s eyes, not of sadness alone, but of shared recognition. She saw others nearby pause, hands resting on the stone, faces contemplative. Lyra’s variation wasn't replacing the Gathering Light; it was adapting it, adding a new emotional dimension relevant to their shared reality. It addressed a subtle communal need – acknowledging sorrow within unity.

  Lyra stopped. The stone fell quiet save for the ever-present background hum of distant rhythms. Would it replicate? Elara waited. Then, from further down the curve, hesitant at first, then stronger: *Boom... (shiver-shiver)... taps-tap-tap... (press)*. Then again, from another direction. The variation was being picked up. Tested. Selected for its enhanced emotional resonance.

  Elara leaned her forehead against the cool Drumstone. This was Darwin’s theatre, stripped bare. No images went viral, no slogans echoed. Here, memes were pure vibration, patterns of energy seeking purchase in the collective soul. They mutated through imperfect touch. They lived or died not on wit or shock, but purely on their power to shape a shared emotional state that helped the community endure. The fittest rhythm wasn't the loudest or the newest, but the one whose beat resonated deepest within the hollow heart of the people. The stone remembered only what the heart demanded. And the heart, like life itself, was endlessly selecting.
