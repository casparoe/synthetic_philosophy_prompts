prompt: |-
  Hey, I'm prepping a seminar on metaethics and my students are stuck in the usual realism vs anti-realism loop — you know, is morality just feelings? — which is fine but we're running in circles. I want to ground it in an actual institutional pattern instead.

  There's this thing in post-conflict reparations bodies, not just big Truth and Reconciliation commissions but smaller local ones too, where they maintain formal schedules compensating material deprivation and physical violence, but when survivors describe the worst harm as being forced into degrading rituals or having their moral identity systematically erased, the commission routes that to counseling budgets as cultural trauma or psychosocial impact. The implicit rule seems to be that only harms leaving a physical or economic trace count as real injuries the state owes for; moral injury gets treated as a subjective overlay that victims recieve counseling for rather than compensation. So what view of moral reality does that funding split presuppose? Does it need a realist stance where moral harms must be anchored in physical states to be objective, maybe requiring the existance of non-natural properties? Or could an anti-realist license the same split through inter-subjective agreement being easier for bodily stuff? And is it even consistent, given these same bodies invoke human dignity language in their charters? I'm also wondering if there's a hidden commitment to what we might call axiological locality — that value has to be tied to a measurable bearer — and whether that locality commitement is doing the real philosophical work instead of realism itself. Could you reconstruct the implicit theory, distinguish what the practice strictly requires from what merely fits well with it, and tell me what would have to change in the reparations rules if we dropped that locality idea? I think I misspelled something in my framing but you get the idea.
reasoning: |-
  Okay, let me unpack this rich query. The user is a philosophy instructor frustrated with the abstract realism/anti-realism debate in metaethics and wants to ground it in concrete institutional practices - specifically, how post-conflict reparations bodies handle moral injuries versus physical/economic harms. 

  Hmm, the core observation is fascinating: when survivors describe moral violations like forced degradation or identity erasure, commissions categorize these as "cultural trauma" for counseling rather than compensable injuries, while physical/economic harms get direct reparations. This institutional sorting mechanism seems to presuppose that only spatially/temporally locatable harms are "real" injuries warranting material compensation. 

  Interesting tension here - these commissions use human dignity language in their charters but operationalize harm through this physicalist filter. Makes me think about H.L.A. Hart's distinction between primary rules (duties) and secondary rules (remediation). The practice suggests moral injuries are recognized as real experiences but not as objective wrongs generating state obligation. 

  The key philosophical move might be disentangling the locality requirement from realism. A moral realist could absolutely argue that non-physical moral properties exist, but the commission's approach seems to require something more: that for administrative purposes, harm must be tied to a measurable bearer. This "axiological locality" functions as an epistemic gatekeeper. 

  If we dropped the locality requirement, how would reparations change? We'd need institutional mechanisms to validate non-corporeal harms - perhaps community testimonies becoming evidentiary, symbolic reparations gaining equal weight to payments, or "moral injury" becoming a compensable category. But the real challenge is avoiding infinite regress of claims - locality serves as a pragmatic constraint. 

  The user's misspelling note is endearing but irrelevant; their framing is exceptionally clear. They're clearly seeking to show students how administrative categories embed philosophical assumptions. Might be worth adding that this practice reveals metaethics isn't just academic - it shapes whose suffering counts as "real."
answer: |-
  This is a brilliant case study to break the realism/anti-realism deadlock, exposing how institutional practices embed tacit philosophical commitments. Let's reconstruct the implicit theory and its implications:

  **The Implicit Theory in Reparations Frameworks:**
  1.  **"Objective Harm" Requires Locatable Bearers:** The core commitment is **Axiological Locality**. Harm must be tied to a spatially/temporally specific, measurable *bearer* (a body, a bank account, a destroyed house). This bearer provides the "evidence" and "metric" for compensation.
  2.  **Moral Injury as Non-Local:** Degradation, identity erasure, and ritual humiliation lack a single, discrete, measurable bearer. They are relational, psychological, and social phenomena distributed across time, context, and intersubjective recognition.
  3.  **Locality as Proxy for Objectivity/Reality:** Physical/economic harm is treated as "objective" *because* it's localizable and quantifiable. Moral injury is treated as "subjective" *because* it resists this localization/quantification. The funding split operationalizes this: compensation requires objective proof (local traces), counseling addresses subjective experience.
  4.  **Reduction of Moral Harm to Psychological Impact:** By routing moral injury to psychosocial/counseling budgets, the practice implicitly *reduces* the moral wrong to its psychological consequences *in the individual*. The *wrongness itself* (the violation of dignity, the perversion of social bonds) isn't compensated as an injury *against the person*; only its mental health fallout is addressed as a service *provided to* the person.

  **What the Practice Strictly Requires vs. What Fits Well:**
  *   **Strictly Required:**
      *   **Axiological Locality:** Harm must have a measurable, locatable bearer to qualify for material compensation.
      *   **Operational Distinction:** A clear administrative boundary between harms with tangible traces and those without.
      *   **Pragmatic Epistemology:** Reliance on evidence (medical reports, property deeds, wage records) deemed "objective" by institutional and often legal standards.
  *   **Fits Well (but not strictly required):**
      *   **Moral Realism (Specific Type):** Specifically, a **Naturalist Moral Realism** (moral properties are identical to or supervene on natural/physical properties) or a **Non-Naturalist Realism** demanding *empirically accessible anchors* for moral claims. The practice *assumes* moral harm only becomes "real enough" for state obligation when grounded in the physical.
      *   **Anti-Realism (Emotivist/Subjectivist):** Fits the treatment of moral injury as purely internal feeling/experience needing therapeutic management rather than external wrong requiring restitution. The "subjectivity" implied by non-locality aligns with this.
      *   **Reductionism:** Reducing moral harm to psychological distress fits well.
  *   **Contradiction:** The use of "human dignity" language in charters is *inconsistent* with the practice. Dignity is inherently non-local. Its violation *is* the core moral injury often described by survivors. The charter rhetoric gestures towards a non-local, intrinsic value, while the operational rules deny that value legal/material standing when violated in non-physical ways.

  **Could Anti-Realism License the Split?**
  Yes, but differently:
  *   An **Error Theorist** (Mackie) might say *all* moral claims are false, so the split reflects practical agreement on physical harm vs. subjective feelings about non-existent "wrongs."
  *   A **Subjectivist/Emotivist** could argue we more easily reach inter-subjective agreement on physical/economic harm (pain, loss is observable) than on the meaning and severity of non-physical degradation. Counseling addresses the feeling; compensation addresses the agreed-upon damage.
  *   A **Relativist** might see it as reflecting the dominant societal view prioritizing tangible loss.
  *   **However:** Anti-realism doesn't *require* the split. An anti-realist could argue strong inter-subjective agreements *do* exist about the wrongness of degradation (e.g., via human rights norms), demanding material recognition.

  **The Core Work: Axiological Locality**
  You've pinpointed the key. **Axiological Locality is doing the heavy lifting, not realism/anti-realism per se.** The practice assumes:
  1.  **Value/Morality must be "in" something:** It cannot be free-floating or purely relational.
  2.  ️ **That "something" must be measurable:** Quantification is necessary for administration and "fair" compensation.
  3.  **The physical/economic is the primary domain of measurability:** Bodies and money are the paradigmatic bearers.

  **Changing Reparations Rules by Dropping Locality:**
  Dropping the *requirement* of axiological locality would necessitate fundamental shifts:
  1.  **Recognizing Relational/Structural Harms:** Moral injuries like systematic humiliation, identity erasure, or destruction of social trust would be *actionable wrongs in themselves*, not just triggers for psychological services. The harm is located in the *relationship* between perpetrator/victim/community and in the *violation of norms* constitutive of moral personhood.
  2.  **New Forms of Evidence & Validation:** Testimony, community narratives, historical analysis, and expert interpretation of cultural/social meanings would become primary evidence, alongside psychological impact. The "proof" shifts from physical trace to credible articulation of the violation's meaning and social/moral impact.
  3.  **Symbolic & Collective Reparations as Core:** Compensation wouldn't just be individual payments for lost wages. It would *require*:
      *   **Official Recognition:** Formal acknowledgment of the *moral nature* of the wrong (e.g., "The state recognizes that forcing Group X to perform Ritual Y constituted a fundamental attack on their dignity and identity").
      *   **Symbolic Acts:** Public apologies, memorials, restitution of cultural artifacts, renaming places, educational programs addressing the *moral meaning* of the violations.
      *   **Collective Reparations:** Funding for community rebuilding, cultural revitalization programs, initiatives to restore social trust – addressing the harm done to the *fabric* of the community's moral identity.
      *   **Reform:** Changes to laws/practices that enabled the moral violations.
  4.  **Integrating "Moral Injury" into Compensation Frameworks:** Material compensation wouldn't be *just* for physical loss but could include awards specifically acknowledging the severity of the moral violation and its impact on life trajectory, social standing, and identity – even if no direct economic loss occurred. Counseling would be *complementary*, not the primary response.
  5.  **Refocusing on Dignity:** The charter's "dignity" language would move from aspirational rhetoric to an *operational principle*. Violations of dignity, demonstrable through testimony and context, would *directly* trigger the state's obligation to provide specific forms of reparation (material, symbolic, collective).

  **Conclusion for Your Seminar:**
  This reparations practice reveals an **implicit commitment to axiological locality as the operational definition of "real harm"** for state obligation. It *fits* certain types of realism (naturalist, empirically anchored non-naturalist) and anti-realism (subjectivist), but the *core driver* is the locality requirement, not the realism/anti-realism debate itself. The inconsistency with "dignity" rhetoric highlights the tension. Dropping locality forces a radical reimagining of reparations, centering relational harm, symbolic acts, collective restoration, and the intrinsic wrongness of dignity violations, moving beyond the physical/economic trace. This case powerfully shows how metaethical assumptions aren't abstract; they shape whose suffering counts and how societies respond to profound injustice. It grounds the debate in the concrete realities of power, administration, and healing.
