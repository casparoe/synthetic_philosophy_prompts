answer: |-
  Here’s a structured 90-minute seminar plan focusing on the **conceptual mechanics of Simpson’s paradox** and its implications for causal inference, tailored to your constraints.

  ---

  ### **Explanatory Sequence**  
  **Total: 90 mins**  
  *(All timings approximate)*  

  1. **Introduction: Association ≠ Invariance (15 mins)**  
     - **Hook**: "Can counting more data *flip* the story? Today, we dissect a paradox where aggregate statistics lie."  
     - **Core Concept**: Association is *partition-dependent*—it changes when we slice data differently.  
     - **Simple Analogy**: Show average heights of two plant species. When grouped by continent vs. soil type, which is "taller" flips. (No numbers! Sketch groupings visually.)  
     - **Intercept Misconception**: *"Correlation at any level implies causation"*  
       - *Intercept here*: Stress association is a *description* of data partitions, not a causal claim.  

  2. **The Carrying Scenario: "The Garden Experiment" (35 mins)**  
     - **Narrative**: Two botanists test Fertilizers A vs. B on identical plants in separate greenhouses:  
       - **Greenhouse 1 (Low Sunlight)**: Fertilizer A → 70% thrive, Fertilizer B → 30% thrive.  
       - **Greenhouse 2 (High Sunlight)**: Fertilizer A → 90% thrive, Fertilizer B → 95% thrive.  
     - **Subgroup Analysis**:  
       - In *both* greenhouses, Fertilizer B beats A.  
       - **Q**: Which fertilizer is better? *[Students deduce: B > A everywhere]*  
     - **The Reversal**: Pooled data (combine greenhouses):  
       - Greenhouse 1 used Fertilizer A *80%* of the time (it’s cheaper).  
       - Greenhouse 2 used Fertilizer B *90%* of the time (it’s sun-stable).  
       - **Pooled result**: Fertilizer A has higher overall success (e.g., 82% vs. 78%).  
     - **Intercept Misconception**: *"Larger-N pooled result is epistemically privileged"*  
       - *Intercept here*: Highlight allocation bias—Fertilizer A was used mostly in low-sunlight (low-success) settings. Bigger N amplifies allocation bias, not truth.  

  3. **Mechanism & Structural Failure (25 mins)**  
     - **The Confounder**: Sunlight (Z) causes both treatment (fertilizer choice) *and* outcome (thriving).  
       - Fertilizer B is chosen where it works best (high sun), but its effect is masked by pooling.  
     - **Why Reversal Happens**:  
       - Treatment allocation is *influenced by Z* (non-random).  
       - Z dominates the outcome, drowning out treatment effects when aggregated.  
     - **Intercept Misconception**: *"Stratifying on Z always yields the 'true' effect"*  
       - *Intercept here*: Stratifying *reveals conditional associations* but doesn’t prove causality (e.g., unmeasured variables could still lurk). Stress: Simpson’s paradox warns against *ignoring* partitions, but fixing it requires causal theory.  
     - **Intercept Subtle Misconception**: *"Reversal implies causation is ontologically empty"*  
       - *Intercept here*: The paradox exposes *epistemic limits*—aggregation can hide causal signals. But subgroup consistency (B > A always) suggests a *stable partial effect*. Causality isn’t invalidated; inference methods are flawed.  

  4. **Implications for Causal Inference (10 mins)**  
     - **Key Takeaway**: Statistical patterns are *context-dependent*. Causal claims require:  
       - (a) Ruling out allocation bias (e.g., via randomization),  
       - (b) Justifying *which* partitions matter (theory-driven).  
     - **Philosophical Punch**: Data alone can’t resolve causality—design and background knowledge are essential.  

  ---

  ### **End-of-Session Diagnostic Question**  
  *Tests structural understanding via new partition:*  
  > *"In the Garden Experiment, suppose we re-analyze the data grouped by* **soil pH** *(acidic/alkaline), not sunlight. In acidic soil, B beats A; in alkaline soil, B beats A. Yet when pooled, A beats B. What must be true about how soil pH relates to fertilizer allocation? Why does the paradox reappear?"*  

  **Why it works**: Forces transfer of logic (pH acts as new Z driving allocation), without numerical recall.  

  ---

  ### **Explicit Omissions & Justifications**  
  1. **Causal Graphs (DAGs)**:  
     - *Omitted*: No arrows or path analysis.  
     - *Justification*: Requires causal inference prerequisites. At this level, *narrative confounders* (sunlight) suffice to expose structure.  

  2. **Formal Collapsibility Conditions**:  
     - *Omitted*: No discussion of odds ratios, homogeneity, or mathematical criteria.  
     - *Justification*: The goal is *conceptual* (aggregation ≠ objectivity), not technical. Math distracts from the epistemic warning.  

  3. **Real-World Case Studies**:  
     - *Omitted*: No Berkeley gender bias or medical examples.  
     - *Justification*: Avoids triggering prior beliefs. The garden scenario is neutral and structurally identical.  

  ---

  This sequence prioritizes **structural intuition** by:  
  - Building from partition-dependence → reversal → mechanism → epistemic implications,  
  - Using a self-contained narrative to force causal reasoning,  
  - Cutting technicalities to spotlight philosophy.  
  **Goal achieved if they leave skeptical of "raw" aggregates and alert to allocation bias.**
