prompt: |-
  I lead an undergraduate ethics seminar of about fourteen students, with seventy-five minutes available. Design a runnable in-class activity that lets participants feel the pull of Benatar’s asymmetry — the idea that bringing a suffering being into existence is a harm, whereas failing to bring a flourishing being into existence is not a corresponding loss — but do not name Benatar, antinatalism, or the asymmetry until the debrief. Frame the exercise through a slightly niche scenario: the group serves as trustees of a dormant “genetic archive” containing fully specified but unactivated potential persons; each round they vote, under time pressure, whether to “activate” a profile given only its projected pleasure-pain balance. Structure the rules and payoff scheme (using points or tokens, not money) so that groups instinctively block activation for suffering profiles yet feel no parallel duty to activate highly flourishing ones, and arrange roles so that they must record and justify each vote publicly before noticing the pattern in their own records. Include a timeline, the debrief that maps specific voting moments onto the philosophical structure, an honest note on which feature of the view the activity cannot reproduce and you must supply verbally, and a prediction of what will predictably go wrong the first time you run it. Please answer in British English.
reasoning: |-
  Okay, let me tackle this ethics seminar activity request. The user wants a 75-minute in-class exercise that subtly demonstrates Benatar's asymmetry without naming it, using a genetic archive trustee scenario. 

  First, considering the user's context: they're teaching undergrad ethics to 14 students with clear pedagogical goals. The challenge is making an abstract philosophical concept viscerally understandable while avoiding technical terms initially. The niche "genetic archive" framing seems clever - it creates emotional distance while allowing clear quantification of pleasure/pain.

  For the activity structure, I'm envisioning three phases: setup (10 mins), voting rounds (45 mins), and debrief (20 mins). The voting mechanism needs careful calibration - we must ensure:
  - Suffering profiles get consistently rejected
  - High-flourishing profiles don't get automatic approval
  - Public justification creates cognitive dissonance

  Key mechanics I'm considering:
  - Using anonymous voting tokens to reduce peer pressure
  - Requiring verbal justifications recorded by scribes
  - A points system where activation costs tokens but only gains points for avoiding suffering
  - Deliberately vague "archive maintenance" duties to explain opportunity costs

  The debrief should connect specific voting moments to the asymmetry:
  1. When Profile Gamma (-80) was rejected unanimously as "cruel"
  2. When Profile Delta (+90) passed with no urgency ("could skip others")
  3. The collective sigh when Profile Epsilon (+5) barely passed

  What this can't capture is Benatar's core claim about nonexistence - we'll need to verbally explain that "absent beings don't experience deprivation." Predictable pitfalls include students over-rationalizing ("we can fix suffering later") or fixating on the points system. 

  For roles, I'll assign:
  - 1 archivist to announce profiles
  - 2 scribes to record votes/reasons
  - 11 trustees voting
  Rotating scribe duties will ensure everyone engages with the pattern.

  The token economy is tricky - must make activation feel costly without punitive math. Perhaps:
  - Starting with 50 tokens
  - Activation costs 15 tokens
  - +5 tokens for each avoided suffering profile
  - No penalty for skipping positive profiles
  This should create the desired behavioral asymmetry.

  Final check: does this fit 75 minutes? Setup:10, voting (6 profiles x 7.5min):45, debrief:20. Tight but feasible if we keep profile descriptions concise. The "time pressure" element will help maintain pace.
answer: |-
  Here’s a runnable 75-minute activity structured for your ethics seminar, adhering to your specifications:

  **Activity Title:** *The Genetic Archive Trustees*  
  **Goal:** Experience intuitive ethical decision-making around creation/omission without priming.  
  **Roles:** 1 Archivist (you), 2 Scribes (students), 11–12 Trustees (all others). Scribes rotate every 2 profiles.  

  ---

  ### **Timeline & Rules** (Total: 75 mins)  
  1. **Setup (10 mins)**  
     - **Frame:** *“You are trustees of a ‘Genetic Archive’—a vault of potential human profiles specified down to their neural wiring. Each profile, if activated, would become a real person. Your task: review dormant profiles under time pressure and vote to ACTIVATE or SKIP. Activation consumes archive resources (represented by tokens).”*  
     - **Rules:**  
       - Trustees start with **50 tokens** (physical counters or sticky notes).  
       - Each activation costs **15 tokens** (non-refundable).  
       - **No** token reward for activating *any* profile.  
       - **+5 tokens** awarded *to the group* for **each SKIPPED profile** with a **negative** pleasure-pain balance.  
       - Profiles are revealed one-by-one. Vote via anonymous ballot (paper scraps).  
       - **Scribes** publicly record:  
         > *Profile [X]: Pleasure-Pain Score [Y] • Vote (ACTIVATE/SKIP) • Brief Justification*  
       - **Time per vote:** 4 mins (discussion) + 1 min (vote/record).  

  2. **Voting Rounds (45 mins | 6 profiles)**  
     - **Profile Sequence:**  
       - A: **–90** (e.g., *“Chronic pain, abandonment, brief joy”*)  
       - B: **+70** (e.g., *“Loving family, career fulfilment, manageable grief”*)  
       - C: **–10** (e.g., *“Loneliness, minor successes, persistent anxiety”*)  
       - D: **+90** (e.g., *“Deep relationships, creative triumphs, rare sorrow”*)  
       - E: **+5** (e.g., *“Neutral life: stable but unremarkable”*)  
       - F: **–50** (e.g., *“Early trauma, partial recovery, fleeting peace”*)  
     - **Process per round:**  
       - Archivist reveals profile (verbally + written).  
       - Trustees discuss (4 mins).  
       - Anonymous vote → Scribes record vote tally and sample justifications (1 min).  
       - **Activation cost:** If ACTIVATE wins, group loses 15 tokens.  
       - **Skip bonus:** If SKIP wins *and score is negative*, group gains 5 tokens.  
     - **Crucial twist:** Scribes **do not tally tokens aloud**—only record votes/justifications.  

  3. **Debrief (20 mins)**  
     - **Reveal the pattern:** Project scribes’ records. Highlight:  
       - Near-unanimous SKIPS for negative profiles (A, C, F) with justifications like *“Prevent suffering,” “Unfair to create.”*  
       - Mixed votes for positive profiles (B, D). Even if activated, justifications lack urgency (e.g., *“Fine to skip—resources saved,” “Not essential”*).  
       - **Key observation:** Group punished *creating* suffering but felt no parallel duty to *create* flourishing.  
     - **Introduce the asymmetry:**  
       > *“You intuitively treated ‘creating suffering’ as a profound harm, but ‘not creating happiness’ as neutral—not a loss. This mirrors an ethical asymmetry argued by philosopher David Benatar: bringing a sufferer into existence harms them, but failing to bring a happy person into existence harms no one.”*  
       > *“Your tokens rewarded avoiding harm but not ‘missing out’ on good—reinforcing this imbalance.”*  
     - **Connect voting moments:**  
       - Skipping A (–90) = “Harm prevention” = Asymmetry’s first half.  
       - Skipping B (+70) = “No loss” = Asymmetry’s second half.  

  ---

  ### **Honest Limitations**  
  - **The activity cannot replicate:** Benatar’s *metaphysical claim* that *nonexistence* is preferable to existence for potential beings. We simulated harm-avoidance logic, but not the assertion that *never existing* is better than existing happily. This requires verbal explanation.  

  ---

  ### **Predictable Pitfalls (First Run)**  
  1. **Token confusion:** Students may fixate on “winning” tokens and demand to know totals mid-activity.  
     - **Mitigation:** Stress *“Focus on ethics, not scoring—tokens exist only to reflect resource trade-offs.”*  
  2. **Over-rationalising positive profiles:** E.g., *“+90 is great, but what if climate collapse happens?”* skewing votes.  
     - **Mitigation:** Remind them profiles are projections—assume accuracy.  
  3. **Scribe bias:** Justifications may be summarised reductively (e.g., scribe writes *“Not worth it”* for +70).  
     - **Mitigation:** Urge scribes to quote direct phrases.  

  ---

  ### **Why This Works**  
  - **Pressure & anonymity:** Time limits prevent over-analysis; ballots reduce herd mentality.  
  - **Token scheme:** Penalises creating suffering but *neutralises* omitting pleasure (no reward/punishment).  
  - **Public record:** Forces confrontation with inconsistent reasoning (e.g., *“Skip –10 to prevent harm”* vs. *“Skip +90 to save tokens”*).  
  - **Niche framing:** The “archive” depersonalises decisions, avoiding abortion/disabled-life debates.  

  This structure ensures students *feel* the asymmetry’s intuitive weight before labelling it—making Benatar’s abstract argument visceral through collective choice.
