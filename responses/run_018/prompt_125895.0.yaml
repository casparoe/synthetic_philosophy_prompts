  Please explain the interaction between the cranes-versus-skyhooks distinction and the charge of greedy reductionism, applied specifically to whether syntactic categories in large language models can be accounted for by predictive statistical learning alone. Frame the statistical-learning account as a proposed crane—building grammatical behavior from simpler next-token mechanisms without invoking innate universal grammar—and frame the nativist appeal to a biologically specified language faculty as a potential skyhook that posits an irreducible, pre-existing structural capacity. Clarify whether labeling the statistical account "greedy reductionism" commits a category error (confusing explaining-away with explaining) or whether there genuinely is an explanatory level lost when syntax is treated only as an emergent pattern. Also address whether the crane/skyhook framing still holds once we allow that a model's internal representations may be functionally equivalent to grammatical rules without being ontologically identical to them. Do not include citations, bibliographies, or reading lists. Limit your response to 350 words.
