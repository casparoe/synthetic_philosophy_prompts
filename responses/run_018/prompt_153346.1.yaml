answer: |-
  ## Philosophy 490 - Advanced Ethics Seminar  
  **Final Examination: Essay Question**  
  **Time Allowed: 90 Minutes**  

  **Prompt:**  

  The concept of infinite moral demands—stemming from considerations like the vast scale of preventable suffering or the continuous nature of potential beneficence—threatens to paralyze finite agents by implying obligations that exhaust all resources. The "Asymptotic Obligation Thesis" (AOT) proposes a solution: as an agent's available resources (R) or situational proximity (P) *continuously increase*, the *strength* or *proportion* of resources demanded by morality approaches, but never actually reaches, a finite ceiling (C). For example, as R approaches infinity, the demanded proportion (D) approaches C (where C < 1, e.g., 0.9), asymptotically: lim(R→∞) D(R) = C. Similarly, as suffering becomes infinitely proximate (P→∞), D(P) approaches C.  

  **Critically evaluate whether the AOT successfully resolves the tension between the apparent unboundedness of moral reasons and the finitude of agents, or whether it merely relocates the core paradox into an infinite regress of residual duties.** Does framing obligation as an asymptotic function genuinely prevent practical paralysis and incoherence, or does it create a distinct, perhaps more insidious, form of moral burden? Defend your position with rigorous conceptual analysis centered on the AOT's structure and implications. Avoid reliance on standard demandingness objections to consequentialism or canonical rescue scenarios (e.g., Singer's pond); focus exclusively on the dynamics of the asymptotic model itself.  

  ---

  **Model Answer (Approx. 800 words):**  

  The Asymptotic Obligation Thesis (AOT) presents an elegant mathematical framing designed to tame the paradox of infinite moral demands. By proposing that obligations approach a finite ceiling (C) as resources or proximity increase continuously, it promises to avert the total consumption of the agent's life (since D < 1 for any finite R or P) and thus avoid practical paralysis. However, while the AOT mitigates the *explosive* form of paralysis associated with immediately unbounded demands, it fails to resolve the fundamental tension. Instead, it generates a novel form of *creeping* paralysis through an infinite regress of residual duties, rendering the model practically incoherent for finite agents and merely relocating the paradox.  

  Proponents of the AOT argue it harmonizes morality with agency. For any actual, finite state of resources (R_finite) or proximity (P_finite), the demanded proportion D(R_finite) or D(P_finite) is strictly less than C. An agent fulfilling D(R_finite) retains resources (1 - D(R_finite)) > 0 for personal projects, rest, or future obligations. This appears to prevent total sacrifice, preserving a sphere of non-moral agency. The asymptotic nature ensures that while demands increase with capacity or urgency, they never *demand the impossible* – complete exhaustion. Morality becomes demanding but tractable, scaling responsibly with the agent's situation.  

  The fatal flaw emerges when we scrutinize the *residual obligation* generated at *every* finite point. Suppose an agent at resource level R1 fulfills D(R1). They now possess residual resources R_res1 = R1 * (1 - D(R1)). Critically, the AOT applies anew to R_res1: a *further* obligation D(R_res1) is incurred, demanding a proportion of the *remaining* resources. This process iterates infinitely: fulfilling D(R_res1) leaves R_res2, incurring D(R_res2), and so on *ad infinitum*. While each individual demand D(R_res_n) is finite and less than C, the *sequence of residual demands is infinite*. The total obligation converges only asymptotically towards consuming *all* initial resources R1 as the number of fulfillment steps increases. Formally: lim(n→∞) Σ[D(R_res_k) * R_res_k] for k=1 to n = R1.  

  This infinite regress constitutes a distinct form of practical paralysis – **creeping exhaustion**. The agent is never *commanded* to give everything at once, but the AOT dictates an endless sequence of partial sacrifices, each consuming a proportion of what remains. There is no stable point where the agent can definitively say "my moral duty is fully satisfied" and attend freely to other life aspects. Every act of fulfilling one demand generates a new, smaller, but non-zero demand on the residue. While each step is individually feasible, completing the *infinite series* is practically impossible for a finite being operating within finite time. The agent must arbitrarily truncate the sequence, but the AOT provides no principled point for doing so; stopping after any finite step N means neglecting the residual duty D(R_res_N), violating the continuous application of the asymptotic principle.  

  Furthermore, the regress highlights the AOT's failure to genuinely bound obligation. The *ultimate practical implication* for the agent confronting a given situation with fixed R1 is still the eventual forfeiture of all resources, approached step-by-step rather than demanded instantly. The difference is one of *tempo*, not *outcome*. The promise of retaining resources (1 - D(R)) is illusory because those retained resources immediately become subject to a new demand. The "ceiling" C governs the *rate* of approach towards total sacrifice in the iterative process, not the *final state* for the agent.  

  The regress also intensifies the deliberative burden. Not only must the agent calculate D(R) for their current state, but the AOT implies they must also consider the infinite chain of subsequent demands on the residue. While the mathematics of convergence might offer theoretical comfort, the practical necessity of managing this cascade of diminishing yet obligatory contributions imposes an unsustainable cognitive load, leading to a paralysis of indecision or arbitrary stopping.  

  Therefore, while the AOT ingeniously avoids the *immediate* incoherence of demanding the logically impossible (giving infinite resources), it succumbs to a deeper incoherence: prescribing an *infinite series of finite actions* that is practically uncompletable and whose truncation lacks justification within the model itself. It converts the paradox of unbounded demand from a catastrophic explosion into an interminable, draining seep. The tension between infinite moral reasons and finite agency is not resolved; it is merely transformed into the paradox of infinite residual duties. The AOT relocates the problem, offering the appearance of boundedness while smuggling in an equivalent totality of demand through the back door of endless iteration. Finite agents remain trapped, not by a single overwhelming command, but by an endless whisper of "a little more."

  ---

  **Marking Scheme (20 Marks Total):**  

  1.  **Accurate Exposition of AOT & Core Problem (4 marks):** Clearly defines the AOT (asymptotic approach to C under increasing R/P), identifies the core problem it addresses (infinite demand paralyzing finite agents), and states the essay's central question (does AOT resolve tension or cause regress?).  
      *   *Common Failure:* Vague or incorrect description of AOT; reverting to generic demandingness (e.g., "consequentialism asks too much") instead of the AOT's specific structure.

  2.  **Analysis of AOT's Apparent Advantage (3 marks):** Explains how AOT *seems* to avoid paralysis by ensuring D < 1 for finite R/P, allowing retained resources and preventing immediate total sacrifice.  
      *   *Common Failure:* Dismissing AOT too quickly without engaging its initial plausibility; confusing retained resources with genuinely *free* resources.

  3.  **Identification & Explanation of the Residual Duty Regress (6 marks):** Clearly articulates the key criticism: fulfilling D(R1) creates residual resources R_res1, triggering a *new* obligation D(R_res1), leading to an infinite sequence of obligations on ever-diminishing residues. Explains why this constitutes a novel problem (creeping exhaustion, no completion point).  
      *   *Common Failure:* Ignoring the iterative application of AOT to residuals; failing to connect the regress to practical paralysis/cognitive burden; reverting to simple "it's still too demanding" without the regress structure.

  4.  **Evaluation of Regress Impact (4 marks):** Argues persuasively why the regress is fatal (practical incompleteness, lack of truncation point, cognitive burden, illusory nature of retained resources). Contrasts the *creeping* paralysis with the *explosive* paralysis AOT aimed to avoid.  
      *   *Common Failure:* Asserting the regress is problematic without explaining *why* it undermines AOT's goals; failing to address the convergence property mathematically; not contrasting the types of paralysis.

  5.  **Clear Conclusion & Synthesis (3 marks):** Takes a definitive stance (e.g., AOT fails, relocates paradox), summarizes the core argument (regress of residual duties), and concisely restates the implications (creeping paralysis, ultimate totality of demand).  
      *   *Common Failure:* Weak or absent conclusion; conclusion contradicts main argument; fails to explicitly state whether AOT resolves the tension or relocates the paradox.  

  **Key Distinction:** High-scoring answers **centrally engage the iterative application of AOT to residuals** as the core problem. Lower scores result from ignoring this regress and defaulting to generic demandingness critiques ("still too much," "no life of one's own") without leveraging the unique structure of the asymptotic model. Answers summarizing Singer, Unger, or standard over-demandingness without linking it *specifically* to the AOT's residual regress fail to meet the prompt's core requirement.
