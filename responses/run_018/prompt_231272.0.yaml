  ## The Reversed Thought

  Alex (utilitarian) and Jamie (integrity-focused) are both close friends of Sam, who just tearfully confided over coffee about being unexpectedly laid off. Seeing Sam's distress, Alex immediately moves to sit beside them, puts a comforting arm around their shoulder, and softly says, "That's awful, I'm so sorry. Tell me what happened?" Simultaneously, Jamie feels the same strong impulse to comfort Sam but pauses internally: *Is this urge to comfort Sam truly central to who I am, a defining ground project, or is it just a fleeting empathetic reaction I should perhaps question before acting?* After this brief hesitation, Jamie also moves to comfort Sam.

  **Analysis:**

  *   **Utilitarian (Alex):** Alex acts smoothly because their utilitarian principles have been internalized through habitual practice. They possess a trained disposition to respond to close friends' distress with immediate support, recognizing (from past reflection) that such actions reliably promote well-being for all involved within relationships they value. No occurrent calculation is needed; the response is automatic and appropriate to the context.
  *   **Integrity Theorist (Jamie):** Jamie hesitates because their view prioritizes acting only from commitments constitutive of their deepest self (ground projects). Faced with the impulse to act, their theory compels them to introspect: *Is this desire authentically 'me'? Is supporting Sam in this moment fundamental to my identity, or merely a contingent feeling?* This verification check – ensuring the action springs from integrity, not mere inclination – is the "one thought too many," causing the pause Williams attributed to utilitarians.

  **The Crucial Feature:** The reversal hinges on the **internalization of decision procedures versus the requirement for identity verification**. Utilitarianism *allows* (even encourages, via indirect strategies) the development of automatic benevolent habits for standard cases like supporting friends. Integrity theory, by demanding actions stem only from identity-constituting commitments, *requires* agents to constantly verify the source of their impulses before acting authentically. Remove this requirement for pre-action identity verification (e.g., if integrity simply meant acting on *any* strong commitment without distinction), and Jamie acts smoothly, collapsing the reversal.

  **Williams-Style Defense:** A defender might block the case by arguing that genuine ground projects *shouldn't* require conscious verification in such familiar contexts; they are supposed to form the bedrock of spontaneous action. They might claim Jamie misunderstands integrity theory, which shouldn't induce paralysis over basic human connections. However, this risks stipulating that identity-constituting commitments are always intuitively obvious and never require reflection – a point the utilitarian could similarly claim about beneficial habits. The case highlights that *if* integrity demands distinguishing ground projects from lesser inclinations, that distinction itself can become the source of hesitation in ordinary life, mirroring Williams' original critique.
