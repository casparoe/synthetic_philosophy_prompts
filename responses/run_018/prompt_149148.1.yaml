prompt: |-
  You are an expert in moral philosophy and philosophy of history with extensive experience drafting adversarial collaboration statements between deeply opposed camps. Before writing, take a moment to think carefully and systematically: map the conceptual terrain, distinguish genuinely substantive disagreements from merely verbal ones, and separate normative commitments from empirical predictions. Work step by step, and ensure neither side is rendered as a strawman.

  Your task is to draft the joint statement that an adversarial collaboration between two opposing camps on comparing historical evils would produce after sustained good-faith debate. The domain is whether ranking or comparing historical atrocities is conceptually possible and ethically appropriate, or whether it is inherently obscene and conceptually flawed.

  The two camps are:

  - The Comparative Topologists: they hold that comparing atrocities is both possible and ethically necessary, but they reject simple scalar ranking (e.g., by death toll alone). Instead, they propose mapping harm across multiple dimensions—scale, intentional design, institutionalization, irreversibility, and epistemic erasure—using what they call "structural harm topology." They argue that refusing all comparison collapses into false moral equivalence that protects perpetrators and erases institutional patterns of evil.

  - The Incommensurability Particularists: they hold that ranking or even multi-dimensional comparison of atrocities is conceptually obscene because each catastrophe occupies a unique "phenomenological moral space" shaped by specific victim experiences, cultural contexts, and survivor narratives. They contend that any comparative framework imposes an external grid that produces "hierarchies of grief," generating what they term "moral residue"—a second-order harm to survivors whose suffering is implicitly downgraded.

  Draft the document both sides could sign. Do not ask for bibliographies, reading lists, or citations, and do not invoke obscure specialist theories that lie outside standard philosophical training. Instead, inject fresh conceptual machinery: treat "structural harm topology" and "phenomenological moral space" as working frameworks the camps have developed in this collaboration, and include a specific concrete test case—an atrocity characterized by high bureaucratic abstraction but moderate mortality (Atrocity X) versus one characterized by lower bureaucratic abstraction but extreme mortality (Atrocity Y)—asking each camp to predict whether comparing them changes the moral evaluation or reveals a category error.

  Structure your response exactly as follows, with approximate lengths:

  1. Methodological Preamble (~120 words): The collaboration's rules, shared commitment to separating verbal from substantive disagreement, and agreement on what is not in dispute (the historical reality of the events, the inadequacy of pure body-count comparison, the risk of instrumentalizing comparison for political ends).

  2. Agreed Claims (~350 words): A numbered list of claims both camps accept—about epistemic humility, about the reality of institutional patterns, about survivor testimony, and about the conditions under which comparison becomes ethically dangerous.

  3. Residual Disagreements (~400 words): The precise formulations of remaining disagreement, each phrased so its own side accepts the wording. Present this as a table with columns: Issue, Comparative Topologist Position, Incommensurability Particularist Position.

  4. The Cruxes (~300 words): Identify three specific sub-questions—such as whether bureaucratic structure carries intrinsic moral weight independent of scale, whether survivor testimony can be translated across cultural contexts without phenomenological loss, and whether comparison necessarily produces competitive victimhood—such that settling them would move at least one side.

  5. Predictive Tests (~250 words): For each crux, present the concrete case or argument both sides agree bears on it (use the Atrocity X versus Atrocity Y comparison and one additional constructed scenario), recording in advance what each camp predicts the analysis will reveal.

  6. Epistemic Note (~100 words): State how confident you are in the framing, the stability of the distinctions drawn, and the predictions recorded. Explicitly single out the point about which you are least sure—likely whether the distinction between topological comparison and scalar ranking remains stable under pressure, or whether it ultimately collapses into one camp's framework.

  Write in a formal, polished philosophical register. Do not place specific authorial lines in quotation marks unless you have fetched and verified the source text; paraphrase common ideas without quotation marks where appropriate. Ensure the deliverable reads as a constructive text both parties could put their names to, with residual disagreement made exact rather than obscured.
