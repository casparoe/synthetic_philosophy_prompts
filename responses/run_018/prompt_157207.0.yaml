prompt: |-
  I've been working on a novel about a disaster-relief co-ordinator — think something like a gritty medical drama but with more philosophy — and my editor and I have been argueing about whether Scanlon's contractualist idea that you justify principles to each person can ever allow you to 'add up' complaints. Here are four scenarios that keep coming up in my draft, with my gut verdicts. I want to know if there's a single principle behind them, or if I'm just being inconsistent, and which verdict I'd have to ditch to keep things tidy. Please write your answer in British English — I'm submitting this to a UK workshop.

  Case one: you can save one person from permanent paralysis, or you can save five people from broken legs. I think you save the five. The individual complaint of the paralysed person is weightier, but it doesn't feel like it swamps all five others put together — so some kind of agregation is happening.

  Case two: you can save one person from death, or you can save a million people from a mild, temporary inconvenience — say, a day of nausea. Here I flip: I think you save the one. The million don't 'pool' their complaints into something that outweighs death. So numbers don't always agregate.

  Case three: there's a rescue plan that saves forty people from serious injury, but it exposes one completely unrelated bystander to a 1% risk of death. I think that's unacceptable — the forty don't dilute the one bystander's reasonable rejection. But if the risk is 0.001%, I think it's okay. So there's some threshold where aggregation fails but tiny risks don't count?

  Case four — and this is the one that breaks my brain: imagine a 'domino rescue' where saving patient A lets you save B, then C, all the way to Z, fifty people total. But the only way to start the chain is to perform an action that kills one outsider who isn't part of the chain. If I can save all fifty but only by killing the outsider, I think it's wrong. But if the choice is between saving just A (and therefore B through Z never get saved) versus saving A-through-Z and killing the outsider, I... actually think it's still wrong? Or maybe I think it's right? I'm genuinely unsure, and it feels like whatever I say here clashes with case two or case three.

  So: is there a coherent contractualist principle — maybe about the structure of complaints rather than their sum — that captures cases one through three? Does case four force me to abandon the idea that complaints are never agregable? And what would your repaired principle say about a scenario I haven't listed, like saving ten people from moderate harm by imposing a distributed burden on each of them? Please use British spelling and phrasing throughout.
reasoning: |-
  Okay, let me try to unpack this user's philosophical dilemma step by step. They're clearly deep into ethical theory while crafting their novel, specifically wrestling with T.M. Scanlon's contractualism and the problem of aggregation across four vivid scenarios. 

  First, I notice they're not just asking for textbook answers - they need practical coherence for their writing. The UK workshop submission context explains their insistence on British English, but more importantly, their examples show they've already done serious homework. The paralysis vs broken legs case is classic aggregation debate, while the domino rescue scenario reveals genuine creative struggle. 

  Hmm, their core tension seems to be: how can Scanlon's "justify to each person" framework permit case one's aggregation while forbidding case two's million-nausea situation? And that third case about risk thresholds is particularly smart - it suggests they intuit that contractualism might handle probabilities differently than outright harms. 

  The brain-breaking domino case fascinates me. They're essentially testing whether contractualism allows "necessary evil" trade-offs in causal chains. I suspect their uncertainty stems from conflicting intuitions: the horror of directly killing versus the tragedy of letting fifty die through inaction. This feels central to their novel's philosophical tension. 

  For the repair, I should emphasise the distinction between direct/intentional imposition versus indirect effects. The bystander in case three isn't choosing to participate, much like the "outsider" in the domino scenario. Whereas in case one, all affected parties are already in the disaster zone - they're all "in the pool" so to speak. 

  On the bonus question about distributed burdens... ah! That's actually the easiest case for contractualism. If everyone shares mild burdens to prevent greater harm, it's arguably justifiable to each person as reciprocal protection. Should mention how this differs from the nausea case where burdens aren't distributed but concentrated. 

  Must remember to avoid phrases like "aggregate utility" - contractualism isn't consequentialism. Instead, focus on reasonableness of rejection. And definitely British spellings throughout: "prioritise", "favourable", "maximise". 

  Their editor's pushback makes sense - most writers would simplify this. But I admire how they're weaving genuine philosophy into genre fiction. The medical disaster context actually helps ground these abstract dilemmas in visceral stakes. Might subtly reinforce that their approach has merit.
answer: |-
  Right, let's dissect this fascinating ethical knot you've tied – it's precisely the kind of thing Scanlonian contractualism was built to grapple with, and your instincts are revealing the core tensions. The key lies in **the nature of the complaint and the structure of justification**, not simply adding up numbers. Here's a breakdown using British spelling and phrasing throughout:

  **The Core Contractualist Principle at Play: Reasonable Rejectability**

  Scanlon's core idea is that an act is wrong if any principle permitting it could be reasonably rejected by anyone affected, given their standpoint. The "justify to each person" imperative means you must consider whether the *individual burdens imposed* give that individual a sufficiently strong complaint to veto the principle allowing the action.

  **Analysing Your Cases:**

  1.  **Permanent Paralysis vs. Five Broken Legs (Save the Five):**
      *   **Gut Verdict:** Correct (by contractualist lights, often). **Aggregation *seems* to happen.**
      *   **Contractualist Justification:** The principle *"In emergency triage, prioritise interventions that prevent the most severe individual suffering per unit of resource, where severity is judged by impact on life prospects"* is hard for the paralysed individual to reasonably reject *solely* because it saves them. Why? Because rejecting it would mean insisting on a principle that prioritises their very severe harm over the combined, still-significant harms of *five others*. While their harm is worse *individually*, the *combined moral force* of the five broken legs creates a situation where rejecting the principle favouring saving the five imposes an *unreasonable* demand on others to accept a greater total burden of suffering for the sake of preventing one specific, albeit worse, harm. It's not pure aggregation of complaints into a sum; it's about the *unreasonableness* of insisting on a principle that ignores the significant, cumulative *individual* burdens borne by the many.

  2.  **Death vs. Million Mild Nauseas (Save the One):**
      *   **Gut Verdict:** Correct. **Aggregation *fails*.**
      *   **Contractualist Justification:** The principle *"It is permissible to let one person die to prevent a vast number of people experiencing a very minor, temporary inconvenience"* **could reasonably be rejected** by the person left to die. Their complaint – the loss of their entire life – is of such overwhelming individual magnitude and distinct kind that no *number* of trivial inconveniences (like a day's nausea) can collectively generate a counter-complaint strong enough to make their rejection unreasonable. Asking them to accept a principle permitting their death for the sake of preventing nausea for others imposes an intolerable, unreasonable demand *on them specifically*. The minor harms don't "pool" into an equivalent moral weight to death because death is non-fungible with transient discomfort at this scale.

  3.  **40 Serious Injuries vs. 1% Risk of Death to Bystander (Unacceptable at 1%, Acceptable at 0.001%):**
      *   **Gut Verdict:** Coherent. **High individual risk trumps; vanishingly small risk does not.**
      *   **Contractualist Justification:** This hinges on the *reasonableness* of the bystander's potential rejection.
          *   **1% Risk:** A principle *"It is permissible to impose a 1% risk of death on an uninvolved bystander to rescue 40 people from serious injury"* could likely be **reasonably rejected** by the bystander. A 1% risk of death is a *significant* imposition on an uninvolved person. It substantially alters their life prospects in a negative way. Their complaint – "You subjected me to a tangible, non-negligible chance of dying for a benefit I didn't voluntarily seek" – is strong. The fact that 40 people benefit doesn't directly negate this *individual* complaint's strength; the bystander isn't obliged to accept such a high personal risk just because many others gain a lot. The harms prevented for the 40 don't dilute the *individual* wrong of imposing this level of risk *on this one person*.
          *   **0.001% Risk:** A principle *"It is permissible to impose a 0.001% risk of death on an uninvolved bystander to rescue 40 people from serious injury"* is **much harder to reasonably reject**. The risk is so vanishingly small that it falls below the threshold of what constitutes a *meaningful imposition* or alteration of life prospects. The bystander's potential complaint ("You exposed me to an almost non-existent risk") seems unreasonable when weighed against the principle allowing the prevention of 40 serious injuries. The risk is arguably no greater than background risks we all accept daily. The complaint lacks sufficient weight for rejection.

  **The Single Principle Emerging (The "Structure of Complaints" Principle):**

  > **A principle can be reasonably rejected if it imposes a significant burden or high risk *directly and specifically* on an individual (or individuals), *unless* the alternative principle imposes a sufficiently large *cumulative burden of individually significant harms* on others that makes rejecting the first principle unreasonable in light of the demands it places on *them*.**

  *   **"Significant burden/high risk":** Captures the veto power of severe individual harms (Death, 1% risk) and the irrelevance of trivial ones (Mild nausea).
  *   **"Directly and specifically":** Highlights the importance of the *manner* of imposition (critical for Case 4). Harming an uninvolved bystander is different from choosing between victims already in need.
  *   **"Cumulative burden of individually significant harms":** Explains Case 1. The broken legs *are* individually significant harms. Preventing five of them creates a cumulative moral reason strong enough to make prioritising the single worse harm (paralysis) unreasonable *in this specific comparative context*.
  *   **"Unreasonable demands":** The core Scanlonian test. It's not about sums, but about what individuals can reasonably demand of each other.

  **Case Four: The Domino Rescue (Kill One Outsider to Save A-through-Z)**

  *   **The Conflict:** This pits the veto power of *direct, intentional killing of an uninvolved person* against the *cumulative burden of death* for 50 others if you don't act.
  *   **Contractualist Analysis (Why it Feels Wrong):**
      *   The principle *"It is permissible to intentionally kill one healthy, uninvolved person to initiate a rescue chain saving 50 others"* could **very plausibly be reasonably rejected** by the outsider.
      *   **Why?** The complaint is overwhelming: "You *directly killed me*, someone not in peril, purely as a means to save others." This is a profound violation of the "directly and specifically" clause. The outsider bears the entire, intentional burden. Unlike Case 1 or 2, they weren't already a potential victim needing triage.
      *   **The 50 Saved:** While their deaths would be terrible, the principle *doesn't* require *them* to bear a direct burden; it requires the *outsider* to bear it. The complaint of the 50 arises only if the rescue *isn't* performed, whereas the outsider's complaint arises *because* of the action taken. The outsider is sacrificed *for* them, not instead of them in a shared disaster.
      *   **Analogy:** This is structurally closer to Case 3 (imposing risk on a bystander) but *worse* because it's intentional killing, not a risk. It's also analogous to classic "transplant" thought experiments (killing one healthy person for organs to save five).
  *   **Does it Clash?**
      *   **With Case 1?** No. Case 1 involves choosing whom to save *among existing victims*. No outsider is harmed. All have claims.
      *   **With Case 2?** Reinforces it. Death (of the outsider) trumps the collective benefit (saving the 50).
      *   **With Case 3?** Consistent. Killing the outsider is like imposing a 100% risk of death, which is clearly unacceptable even for large benefits to others.
  *   **Verdict:** Your instinct that it's **wrong** aligns best with a consistent application of Scanlonian contractualism prioritising the complaint against direct, intentional harm to an uninvolved person. Saving just A (letting B-Z die) is tragic, but doesn't involve *actively killing* an outsider. The principle permitting the killing is reasonably rejectable by the outsider.

  **Repaired Principle & Your Bonus Scenario:**

  *   **Repaired Principle:** As above: Focus on direct/specific imposition, individual complaint strength, and the unreasonableness of rejecting principles that prevent overwhelming cumulative individual burdens *in comparative rescue scenarios*.
  *   **Bonus Scenario: Saving Ten from Moderate Harm by Imposing a Distributed Burden:**
      *   **E.g.,** Ten people each bear a minor, temporary burden (e.g., an hour of discomfort, a small financial cost) to collectively prevent a moderate harm (e.g., a week of significant pain) befalling each of them or ten others.
      *   **Contractualist Verdict:** **Likely Permissible.**
      *   **Why?** A principle *"It is permissible (or required) to impose a small, distributed burden on each member of a group to prevent a significantly larger, moderate harm to each member of that group (or another comparable group)"* is **hard to reasonably reject**. Each person's complaint about their *own* small burden is weak. Rejecting the principle would mean insisting on a rule that forbids this arrangement, potentially leaving everyone vulnerable to the much worse moderate harm without the collective defence. The demand to be exempt from a tiny burden, when it prevents a much larger harm to oneself and others similarly situated, seems unreasonable. This leverages the "cumulative burden" aspect favourably *without* imposing severe burdens directly on specific uninvolved individuals. It feels fair and reciprocal.

  **Conclusion:**

  Your intuitions in Cases 1, 2, and 3 are largely coherent within a Scanlonian framework that distinguishes between:

  1.  **Severity & Kind of Harm:** Death/High-Risk swamps minor inconveniences.
  2.  **Directness & Involuntariness:** Imposing significant harm/risk *on* an uninvolved person is harder to justify than choosing whom to save among victims.
  3.  **Cumulative Individual Burdens:** Significant harms to many *can* collectively make it unreasonable to insist on prioritising the single worst harm in comparative rescue (Case 1), but *cannot* override a veto based on direct, severe imposition on one (Cases 2, 3 high-risk, 4).

  **To keep things tidy:** You need to ditch the idea that Case 4 *might* be permissible (killing the outsider). Embracing its wrongness maintains consistency with the strong protection against directly harming the uninvolved seen in Cases 2 and 3. The "domino rescue" starkly reveals that contractualism prioritises individual justifiability and rejects sacrificing one directly for the greater good, even a very large one. This is powerful fodder for your novel's philosophical tension. Good luck with the workshop!
