  Hey, I'm a backend engineer with zero phil training and I'm stuck on this idea of free-floating rationales — reasons that exist even when there's no reasoner around to have them. What's your credence, like 0 to 1, that this is genuinely coherent and not just a linguistical trick? Break it down: (1) can normativity be real without any mind to represnt it; (2) does a reason still count if literally no one can ever access it; (3) does this have any practial bite for AI alignment or reward design; (4) is our gut rejection just anthropocentric bias? Give each a rough number, show how they combine into your final credence, and tell me which piece is doing the most work. Also, what kind of argument or example would move your overall number the most? I personally think it's around 0.3 but I'm mostly guessing, and please skip the bibliography — I can't check references anyway.
