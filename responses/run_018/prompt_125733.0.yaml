   Scenario:
     Sarah must decide whether to spend $1,000 on an engineering report for a machine. Without the report, she will install a $15,000 safety guard, which prevents both major injuries (costing $100,000 with 10% chance) and minor injuries (costing $10,000 with 90% chance). However, if the report reveals a high risk of major injury, she becomes legally obligated to conduct a full safety audit and training in addition to installing the guard, costing an extra $50,000. Without the report, she avoids this obligation by taking the precautionary guard. The expected cost of commissioning the report is $16,500 (10% chance of $65,000: guard and audit, 90% chance of $10,000: minor injuries, plus $1,000) which is higher than the $15,000 cost of acting without the report. Hence, she refuses the report due to the Curiosity Tax.

   Walkthrough:
     - Without the Curiosity Tax, the report would be beneficial (expected cost $11,500 < $15,000), so Good's theorem recommends gathering the information.
     - The Curiosity Tax adds a $50,000 cost in the high-risk state if the report is obtained, increasing the expected cost of the report from $11,500 to $16,500.
     - The assumption violated is that the decision problem (the available actions and their costs) remains the same regardless of whether information is gathered. Here, gathering information changes the cost structure in the high-risk state.
     - Removing the Tax (so that she can install the guard without the audit even after learning high risk) brings the expected cost of the report back to $11,500, making it beneficial and restoring the standard agreement with Good's theorem.
