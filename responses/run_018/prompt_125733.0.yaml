   1. Why Good's theorem says gather info (rough expected value):
      Without the report, the best action (installing the guard) costs $15,000.
      Without the Curiosity Tax, the expected cost with the report would be:
          High risk (10%): she installs the guard -> $15,000 (no additional audit/training) and avoids $100,000 -> so only $15,000.
          Low risk (90%): she does not install -> $10,000 (minor injuries).
          Plus $1,000 for the report.
          Expected cost: 0.1*15000 + 0.9*10000 + 1000 = $1,500 + $9,000 + $1,000 = $11,500.
      So without the tax, the expected cost with the report is $11,500, which is less than $15,000. Therefore, the expected value of information (EVI) is $15,000 - $11,500 = $3,500. So Good's theorem recommends gathering the information.

   2. What the Curiosity Tax does to her utility:
      The Curiosity Tax adds an extra cost of $50,000 in the high-risk scenario if the report is obtained. This extra cost is only incurred when the report is obtained and reveals high risk. Without the report, even in the high-risk scenario, she only pays $15,000 (the guard) and avoids the injury and the audit/training. Therefore, the tax increases the expected cost of obtaining the report from $11,500 to $16,500, making it worse than not obtaining the report.

