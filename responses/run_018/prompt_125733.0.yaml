   Scenario:

   Sarah, a plant manager, considers commissioning a $1,000 engineering report to determine if a machine poses a high risk of causing a major injury (10% chance, which could cost $100,000) or low risk (90% chance, with minor injuries costing $10,000). Without the report, she would install a $15,000 safety guard, which prevents all injuries. However, if the report reveals a high risk, she would be legally and morally compelled to not only install the guard but also conduct a $50,000 safety audit and training. This additional burden makes the expected cost of commissioning the report ($16,500) exceed the cost of acting without information ($15,000). Thus, she forgoes the report to avoid the potential liability and higher costs.

