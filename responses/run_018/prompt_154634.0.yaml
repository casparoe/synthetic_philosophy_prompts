  */s/ "Intentionality is irreducibly biological. Syntax ≠ semantics, even in cascade."*  

  **Dennettian Camp Rep**  
  */s/ "If it quacks like a duck *and* corrects its own quacking, it’s a duck. Stances over substances."*  

