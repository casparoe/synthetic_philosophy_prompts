answer: |-
  The pattern you describe constitutes a **conceptual slippage** specifically involving **asymmetric scale treatment**, where proponents inconsistently apply the logic of incommensurability. Here's a precise breakdown:

  1.  **The Core Issue:** The move illegitimately **assumes comparability across suffering dimensions** (e.g., physical pain vs. existential dread) *while simultaneously denying comparability* between suffering (within any dimension) and well-being. This creates an asymmetry:
      *   **Within-Dimension:** Suffering (S) and Well-being (W) are declared **lexically incommensurable** for extreme S. No amount of W can compensate for extreme S within its own dimension.
      *   **Across-Dimension:** Different types of extreme suffering (S1, S2) are treated as **commensurable** under a single **lexical threshold principle**. Extreme S1 and extreme S2 are deemed *equivalent in kind* regarding their lexical priority over W, implying a shared metric of "extremeness" or "lexical weight" applicable across heterogeneous harms.

  2.  **Deficiency:** The critical gap is the lack of justification for the **cross-dimensional commensurability premise**. While the qualitative distinctness *within* a dimension (e.g., agony vs. mild pain) might support lexical priority *within that dimension*, it provides *zero warrant* for assuming that the "lexical threshold" in one dimension (pain) maps onto, or is equivalent to, the "lexical threshold" in a radically different dimension (existential dread). Proponents implicitly treat "reaching the lexical threshold" as a *uniform property* across suffering types, despite the foundational claim that these suffering types are qualitatively distinct phenomena.

  3.  **Distinctions:**
      *   **Category Mistake:** This *isn't* a pure category mistake. The error isn't assigning properties to things that inherently lack the capacity for them (e.g., "the number two is blue"). It's an error in *scale application* – illicitly transferring a scale-dependent property ("lexical priority threshold") from one context (intra-dimensional suffering) to another (inter-dimensional suffering comparisons) without establishing the scale's validity in the new context.
      *   **Scope Ambiguity:** This *isn't* ambiguity in the *meaning* of "lexical." The lexical principle itself is consistently defined (no W compensates for extreme S). The ambiguity/error lies in the *scope of application*: proponents apply it narrowly within dimensions but broadly across them without argument.
      *   **General Incommensurable Goods:** This is a *specific instance* of the broader problem, distinguished by the **asymmetry**: Incommensurability is strictly enforced *only* along the S-W axis, while suppressed along the S1-S2 axis. The S1-S2 axis is treated as unproblematically commensurable *specifically for the purpose of applying the lexical principle uniformly*, despite the lack of a shared metric.

  4.  **Proposed Coinage:** There is no established term capturing this specific asymmetry. The precise coinage is:
      **Dimensional Scope Collapse (DSC)**
      *   **Definition:** The fallacy of asserting lexical incommensurability between states *within* a specific qualitative dimension (e.g., suffering vs. well-being), while simultaneously asserting or assuming the commensurability *across* distinct qualitative dimensions (e.g., different suffering-types) *for the purpose of applying that same lexical principle uniformly*, without providing a cross-dimensional metric justifying the comparability of the lexical thresholds.

  5.  **Boundary Conditions (Distinguishing from Equivocation):**
      *   **Ordinary Equivocation:** Involves shifting the meaning of a *term* (e.g., "lexical") mid-argument. DSC keeps the *term's meaning* stable (no W compensates for extreme S) but shifts the *domain* to which the principle applies *from* intra-dimensional comparisons *to* inter-dimensional comparisons without justification.
      *   **DSC Requires:** (a) An initial claim of intra-dimensional lexical incommensurability (S vs. W); (b) An extension of this lexical principle to govern comparisons *between* different types of S (or different dimensions of harm); (c) The absence of a justified cross-dimensional metric enabling the comparison of the "extremeness" triggering lexical priority across the distinct dimensions.
      *   **Not DSC:** Arguments that *explicitly defend* a cross-dimensional metric for comparing suffering intensities/types, or arguments that apply lexical priority *only* within a single dimension without extending it to others.

  **Conclusion:** The pattern is best termed **Dimensional Scope Collapse (DSC)**, defined as the unjustified extension of a lexical priority principle from governing intra-dimensional comparisons to governing inter-dimensional comparisons, relying on an unargued assumption of cross-dimensional commensurability regarding the property triggering lexical priority.

  \answer{Dimensional Scope Collapse: The fallacy of asserting lexical incommensurability within a qualitative dimension while assuming commensurability across dimensions to apply the same lexical principle uniformly, absent a cross-dimensional metric.}
