     - The game is symmetric: all players have identical payoff structures.

  1.2. **Formal Structure of the Luring Lottery**:
     - There are two players. Each player chooses a real number in the interval [0,1].
     - Payoff for a player:
          - If the player chooses x and the other chooses y:
