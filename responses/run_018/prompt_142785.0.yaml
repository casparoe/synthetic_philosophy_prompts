  We must be neutral and avoid adjudication. We avoid bibliographies and keep formal apparatus minimal.

  Let's start by recalling the two puzzles:

  - **Platonia Dilemma**: 
    - N players (say, 100) are each to choose between two options: "A" (a special action) and "B" (a default action).
    - If exactly one player chooses "A", that player gets a huge reward (say, $1,000,000). If any other number of players choose "A" (0 or 2 or more), then all players get a small reward (say, $1) regardless of their choice.
    - The players are symmetric: they all have the same payoff structure and are rational. They cannot communicate and must decide simultaneously.

  - **Luring Lottery**:
    - Two players (or more, but we can consider two for simplicity) each choose a number in a continuous interval, say [0,1]. 
    - The player who chooses the lowest number wins a prize, but only if that number is below a threshold (say, 0.1). If both choose above the threshold, no one wins. If one chooses below and the other above, the one below wins. If both choose below, then the one with the lower number wins (and if they choose the same, they split the prize). However, there is a twist: the prize is very large if exactly one player chooses below the threshold, but if both choose below the threshold, the prize is reduced (or vanishes) so that each would prefer to be the only one below.

    We can formalize it as:
      - If a player chooses x and the other chooses y:
          - If x < 0.1 and y >= 0.1, then the player with x wins a big prize (say, $1M).
          - If both x, y < 0.1, then the player with the smaller number gets a small prize (say, $1) and the other nothing (or if equal, they split the small prize). 
          - If both x, y >= 0.1, then both get nothing.
          - Note: The payoff for being the only one below the threshold is much higher than when both are below.

    The key is that if both players choose numbers below 0.1, they get a low payoff, but if one chooses below and the other above, the one below gets a high payoff.

  Now, the two decision theories:

  - **Causal Decision Theory (CDT)**: Chooses actions based on their causal consequences. In these symmetric games, CDT typically leads to a Nash equilibrium where players act independently and do not coordinate on the cooperative outcome because they cannot cause the other player to choose a particular action.

  - **Evidential Decision Theory (EDT)**: Chooses actions based on the evidence they provide about the state of the world. In these games, EDT might recommend the action that, if taken, would be evidence that the other player(s) are taking the same action, leading to a better outcome.

  However, note that in the independence-reasoner view, both CDT and EDT are seen as requiring independence, and they reject the idea of coordination via reasoning without causal or evidential links.

  The superrationalist, inspired by Douglas Hofstadter, argues that if the players recognize that they are using the same reasoning algorithm, then they can coordinate by choosing the action that is best if the other does the same.

  We now draft the joint statement.

