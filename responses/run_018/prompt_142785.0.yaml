  ### 3. Cruxes  
  We identify the following cruxes, where resolution would move at least one side:  
  3.1. **Token vs. type-indexed rationality**:  
     - *Token rationality*: Rationality is indexed to a specific **token**—a particular instance of reasoning in an agent at a time, with unique causal/evidential context.  
     - *Type rationality*: Rationality is indexed to a **type**—an abstract reasoning algorithm shared across agents, permitting expectations of identical reasoning in others.  
