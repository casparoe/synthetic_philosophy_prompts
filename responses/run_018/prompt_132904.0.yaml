     - *Case*: A has a significant, non-marginal advantage over B (e.g., 1000 grains of sugar in coffee vs. 0 grains).  
     - *Desideratum*: The theory must judge A as strictly better than B.  
     - *Non-negotiable*: Asymmetry must hold (B cannot be better than A).

  2. **Clear Equality**  
     - *Case*: Identical options (e.g., two cups with 500 grains of sugar each).  
     - *Desideratum*: The theory must judge them as equally good; "better than" is false symmetrically.  
     - *Non-negotiable*: Reflexivity forbidden (no option better than itself).

  3. **Borderline Proximity**  
     - *Case*: Adjacent links in a sorites chain (e.g., cup with n grains vs. n+1 grains).  
     - *Desideratum*: The theory must not force a determinate "better than" relation. It should allow indeterminacy (neither better nor equal) or symmetric "not better than" without equality.  
     - *Non-negotiable*: Avoid false precision (e.g., no arbitrary threshold where n+1 grains suddenly becomes "better").

  4. **Distant Incommensurability**  
     - *Case*: Options from different qualitative categories (e.g., health-focused meal vs. taste-focused meal in a health-to-taste spectrum).  
     - *Desideratum*: The theory must judge them as incomparable—neither better, worse, nor equal—due to heterogeneous values.  
     - *Non-negotiable*: Distinct from equality (equality implies interchangeability; incommensurability implies choice under indeterminacy).

  ---

  #### **II. Structural Properties: Preservation vs. Abandonment**
  1. **Asymmetry**  
     - *Requirement*: If A is better than B, then B is not better than A.  
     - *Motivation*: Fundamental to avoiding contradictions (e.g., A > B and B > A is incoherent).  
     - *Non-negotiable*: Must hold for all clear cases of superiority.

  2. **Transitivity**  
     - *Local Transitivity*:  
       - *Requirement*: If A is better than B, and B is better than C, and all are pairwise proximate (e.g., within a sorites neighborhood), then A must be better than C.  
       - *Motivation*: Prevents cycles in near-identical options (e.g., A > B > C but C > A).  
       - *Non-negotiable*: Essential for minimal rationality in local choices.  
     - *Global Transitivity*:  
       - *Requirement*: Abandoned for chains involving qualitative shifts.  
       - *Motivation*: Spectrum arguments (e.g., a health→taste chain where each step is a marginal trade-off; A (health) > B > ... > Z (taste), but A and Z are incomparable).  
       - *Negotiable*: Preservation preferred by rational-choice theories; abandonment allowed for incommensurabilists.

  3. **Completeness**  
     - *Requirement*: Abandoned.  
     - *Motivation*: Spectrum endpoints (e.g., A and Z) may be incommensurable.  
     - *Non-negotiable*: Must accommodate incomparability.

  4. **Continuity**  
     - *Requirement*: Abandoned or redefined.  
     - *Motivation*: Qualitative shifts (e.g., gradual health-to-taste transition) may introduce discontinuities in comparability.  
     - *Negotiable*: Preservation desirable for quantitative spectra; abandonment necessary for heterogeneous dimensions.

  ---

  #### **III. Critical Distinctions to Preserve**
  1. **Homogeneous Quantitative vs. Qualitative Shifting Spectra**  
     - *Desideratum*: The theory must distinguish:  
       - **Homogeneous accumulation**: Marginal improvements aggregate transitively (e.g., sugar grains: 0 grains < 1000 grains).  
       - **Qualitative shifts**: Marginal changes alter the *type* of value (e.g., health-dominated meals → taste-dominated meals), potentially causing incommensurability between endpoints.  
     - *Non-negotiable*: Collapsing these conflates sorites with multidimensional incommensurability.

  2. **"Not Better Than" Due to Equality vs. Incommensurability**  
     - *Desideratum*: The theory must differentiate:  
       - **Equality**: Symmetric "not better" with mutual substitutability (e.g., two identical options).  
       - **Incommensurability**: Asymmetric or symmetric "not better" without substitutability (e.g., health vs. taste).  
     - *Non-negotiable*: Conflation obscures rational choice under indeterminacy.

  ---

  #### **IV. Tensions and Impossibilities**
  - **Core Tension**: Non-arbitrariness + Local Transitivity + Global Non-Transitivity + Endpoint Comparability.  
    - *Problem*: In a sorites chain, if:  
      - Adjacent pairs are indeterminate or equal (to avoid arbitrariness),  
      - Local transitivity holds in neighborhoods,  
      - But global transitivity fails for endpoints (due to incommensurability),  
      - Then the chain must "break" comparability somewhere. Yet any sharp break violates non-arbitrariness.  
    - *Impossibility*: **Unrestricted transitivity + non-arbitrary boundaries is untenable**.  
      - *Why?*: If transitivity holds globally, a chain of "not worse than" links forces endpoint comparability (A ≤ Z). But if A is clearly worse than Z (quantitative) or incommensurable (qualitative), transitivity must be restricted. Non-arbitrariness forbids ad hoc breaks.  
    - *Resolution*: Allow local transitivity within neighborhoods but global non-transitivity across qualitative shifts, using topological or metric constraints (e.g., comparability holds only within similarity thresholds).

  ---

  #### **V. Evaluation of Theoretical Approaches**
  1. **Strict Total-Ordering View** (e.g., classical utility):  
     - *Fails*: Requires completeness and transitivity, forcing sharp boundaries in sorites chains (violates non-arbitrariness) and collapsing incommensurability into equality.

  2. **Incommensurabilist View** (e.g., partial orders with incomparability):  
     - *Survives*: Allows incomparability for distant/qualitative pairs and local transitivity.  
     - *Struggles*: With borderline proximity (adjacent pairs may need indeterminacy, not strict incomparability) and non-arbitrary "breaks" in chains.

  3. **Vagueness-Based Graded-Membership View** (e.g., fuzzy logic/supervaluationism):  
     - *Survives*: Handles borderline cases via degrees of truth or precisifications. Supervaluationism allows A < Z in all precisifications while adjacent pairs vary.  
     - *Struggles*: With qualitative shifts (incommensurability may not reduce to vagueness) and global non-transitivity.

  ---

  ### **Summary of Non-Negotiable Desiderata**
  1. Asymmetry in clear cases.  
  2. Non-arbitrariness (no sharp cutoffs in spectra).  
  3. Endpoint comparability in homogeneous quantitative chains (A < Z).  
  4. Local transitivity within similarity neighborhoods.  
  5. Distinction: Homogeneous accumulation vs. qualitative shifts.  
  6. Distinction: Equality vs. incommensurability.  
  7. Incomparability for distant qualitative endpoints.  

  ### **Negotiable Preferences**
  - **Global transitivity**: Abandoned by incommensurabilists; preserved by total-order advocates.  
  - **Cyclical preferences**: Forbidden locally; tolerated globally if arising from multidimensionality.  
  - **Continuity**: Preserved in quantitative dimensions; abandoned in qualitative shifts.  

  ### **Key Tension**
  **Local transitivity + non-arbitrariness + global incommensurability** is only viable if the theory allows:  
  - Comparability to fade gradually over qualitative shifts, or  
  - Neighborhood-restricted transitivity with no ad hoc boundaries, using structural features (e.g., similarity metrics).  
  No theory satisfies all desiderata without trade-offs; the central challenge is balancing local coherence with global indeterminacy.
