prompt: |-
  Two philosophers who disagree about whether agents with conflicting final values should trade with one another have argued past each other for a year and have now agreed to write up an adversarial collaboration. Produce the document they should produce.

  Background the document may assume. By moral trade I mean an arrangement of the following kind: A and B disagree about what is finally valuable; each performs the action the other regards as most valuable, or funds the cause the other regards as best, possibly with money as the medium of exchange. Each may thereby end up better off by their own lights than if each had simply acted on their own verdict, in the way parties to an ordinary trade are better off. Assume, except where a case explicitly says otherwise, that neither party is uncertain about the other's values, about the other's abilities, or about the non-moral facts. Where moral uncertainty enters, treat it as each party's having credences spread over competing moral views and a rule for acting on them.

  The two positions. (A) The trade optimist holds that pervasive and persistent moral disagreement, combined with large differences in how much value each party can produce per unit of resource, makes the gains from such swaps large, largely unexploited, and worth building institutions for. (B) The trade skeptic holds that nearly all of the apparent gains are already available to a single agent who simply spreads her resources across the moral views she is uncertain between, with no agreement, escrow, or trust required, and that what remains is eroded by three things: the incentive to be paid for what one would have done anyway, the fact that for many moral views the tradeable region is only what is permissible rather than what is required or forbidden, and the loss involved in acting against one's own verdict at another's behest.

  Deliverable. First, a numbered section of agreed claims: what both would actually sign about the structure of the situation, about the conditions under which a swap is beneficial by each party's own lights, about what a completed and verified swap would show, and about what neither side claims. Each claim should be substantive rather than hedged into emptiness. Second, a disagreements table whose rows are cruxes and whose columns give the optimist's own formulation of the point at issue, the skeptic's own formulation, one case or argument both accept as bearing on it, and each side's prediction about that case written down in advance.

  The cruxes I want covered at minimum:

  1. Decomposition of the surplus. Separate the component that comes from comparative advantage in production, where each party has skills, access, or causal position the other lacks, from the component that comes merely from diminishing marginal returns to spending on any single cause. Ask whether the second component is entirely captured by one agent diversifying internally, so that the positive case for trade must rest on the first.

  2. The permissible margin. How much of what parties value lies in the region that is optional for them rather than required or forbidden, and whether this makes moral trade structurally biased toward agent-neutral or maximizing views. Say whether such a bias is itself a cost, and for whom.

  3. Incentive compatibility. The would-have-done-anyway problem, the incentive to exaggerate the value one places on one's own cause or to understate what one would have done unaided, and whether repetition, reputation, or third-party verification repairs the problem or merely relocates it.

  4. What is lost, if anything. Whether acting against one's own considered verdict in exchange for a reciprocal act involves a loss not already counted in the trade's expected value, and whether that loss is moral, aretaic, or merely psychological. Each side should specify what kind of loss would count against its own view.

  5. Second-order disagreement. Parties who disagree not only about what is valuable but about how to act under moral uncertainty, one maximizing expected value, another minimizing worst cases, another averse to variance. Can a mutually beneficial swap still be constructed, and if so is it unique.

  6. Diagnosis. Which rows are really disputes about magnitudes neither party has measured, which are verbal, and which are genuinely normative. Where a row is verbal, state the single well-posed question both should be asking instead.

  Constraints. Argue from the structure of stylised cases rather than from published empirical findings or citations, since neither side can check any sources here. Invent at least two cases yourself, one of which should be the two-donor case in which the parties have identical resources, abilities, and opportunities and differ only in what they are certain of. Wherever a verdict turns on a parameter, such as the curvature of a value-production function, the size of the non-tradeable region, or the shadow of the future in repeated interaction, state the threshold at which each side's verdict would flip. Prefer formulations that a hostile reader on the other side would still accept as an accurate statement of their own position.
reasoning: |-
  We are producing an adversarial collaboration document between a moral trade optimist and a moral trade skeptic. The document will have two main parts: (1) a section of agreed claims, and (2) a disagreements table with specified cruxes.

  ## Part 1: Agreed Claims

  We list the claims that both the optimist and the skeptic agree on, stated substantively.

  ### 1. Structure of the Situation
  1.1. Moral trade is defined as an arrangement where two agents, A and B, with conflicting final values, each perform an action (or fund a cause) that the other values highly, possibly using money as a medium. Each expects to be better off by their own lights than if they had acted solely on their own values.

  1.2. The possibility of mutual benefit in moral trade arises from two sources: 
     (a) Comparative advantage in production: Each agent has skills, access, or causal positions that the other lacks, leading to differences in the efficiency of producing value for a given cause.
     (b) Diminishing marginal returns (DMR): The value produced by spending on a single cause may be concave, so that spreading resources across causes can increase total value.

  1.3. Without moral uncertainty, each agent is certain about their own values, the other's values, the non-moral facts, and the production functions (i.e., how resources convert into value for each cause). With moral uncertainty, an agent has a probability distribution over moral views and a decision rule (e.g., maximizing expected value) for acting under that uncertainty.

  ### 2. Conditions for Beneficial Swap
  2.1. A swap is beneficial for both parties (by their own lights) if and only if the following two conditions are jointly satisfied:
     (a) The agents have different marginal rates of substitution (MRS) between the causes at the allocation without trade. That is, the rate at which one agent is willing to give up resources for the other's cause in exchange for resources for their own cause (or vice versa) differs between the agents.
     (b) The agents can commit to the trade and trust that the other will fulfill their part.

  2.2. The gains from trade can be decomposed into:
     (a) Gains from comparative advantage: This arises when one agent is more efficient at producing value for a particular cause than the other.
     (b) Gains from diversification due to DMR: This arises even if the agents are equally efficient at producing for every cause, but because of concave production functions, each can gain by having the other spend on their cause.

  2.3. In the presence of moral uncertainty, an agent acting alone can achieve part of the gains by diversifying their resources across the causes according to their credences. However, this internal diversification does not capture the gains from comparative advantage.

  ### 3. What a Completed and Verified Swap Would Show
  3.1. A successfully completed and verified swap (with no deception or coercion) demonstrates that:
     (a) There was a perceived mutual benefit ex ante by both parties (i.e., each expected to be better off by their own lights).
     (b) The swap was incentive-compatible ex post (i.e., both fulfilled their commitments and were satisfied that the other did).

  3.2. Such a swap does not, by itself, prove that the trade was morally permissible or required by any external standard. It only shows that it was beneficial by each party's subjective evaluation.

  ### 4. What Neither Side Claims
  4.1. Neither side claims that moral trade is always beneficial. Both agree that there are conditions under which trade would not be beneficial (e.g., if the MRS are equal, or if there is no trust).

  4.2. Neither side claims that moral trade requires the agents to change their fundamental values. The trade is a practical arrangement that leaves each agent's values intact.

  4.3. Neither side claims that moral trade is the only way to achieve the gains. The skeptic emphasizes that internal diversification can achieve part of the gains, while the optimist argues that comparative advantage requires trade.

  4.4. Neither side claims that the psychological cost of acting against one's own verdict (if any) is zero. They disagree on the magnitude and significance of this cost.

  ## Part 2: Disagreements Table

  We now present a table with rows for each crux. For each crux, we provide:
  - The optimist's formulation of the point at issue.
  - The skeptic's formulation.
  - A case or argument both accept as bearing on it.
  - Each side's prediction about that case (written in advance).

  We cover the six specified cruxes and invent at least two cases (one being the two-donor case).

  ### Crux 1: Decomposition of the Surplus

  | Aspect | Optimist's Formulation | Skeptic's Formulation |
  |--------|------------------------|------------------------|
  | **Point at Issue** | The gains from diversification due to DMR are only partially captured by a single agent diversifying internally. The gains from comparative advantage are entirely missed without trade. Thus, the positive case for trade rests on the prevalence of comparative advantage. | The gains from DMR are entirely captured by a single agent diversifying internally. Without comparative advantage, there are no gains from trade. Since comparative advantage is rare in moral contexts, the gains from trade are small. |

  **Case/Argument Both Accept**: The Two-Donor Case.

  *Description*: Two donors, A and B, have identical resources, abilities, and opportunities. They are each certain of their own moral views. A values cause X only (e.g., saving human lives), and B values cause Y only (e.g., saving animal lives). The production function for each cause is concave (e.g., saving the first life costs $1000, the second $2000, etc.). Without trade, each spends all their money on their own cause. With trade, they can swap resources: A gives money to B to spend on Y, and B gives money to A to spend on X.

  **Predictions**:
  - Optimist: In this case, without comparative advantage (since they are identical), there are no gains from trade. The skeptic is correct that DMR alone does not create gains from trade when agents are identical. However, this case is rare. In realistic cases with differing abilities, comparative advantage exists and trade is beneficial.
  - Skeptic: This case shows that without comparative advantage, trade is not beneficial. Since many moral disagreements occur between agents with similar abilities (e.g., two philanthropists in the same city), comparative advantage is often absent, and trade gains are minimal.

  ### Crux 2: The Permissible Margin

  | Aspect | Optimist's Formulation | Skeptic's Formulation |
  |--------|------------------------|------------------------|
  | **Point at Issue** | For many moral views, the tradeable region (where an agent is permitted but not required to spend on a cause) is large, especially for agent-neutral views. This allows for substantial trade. The bias toward neutral views is not a cost because trade is voluntary and benefits both. | Much of what agents care about is in the required or forbidden region. For example, deontologists may be forbidden from funding certain causes. This restricts trade to a small permissible margin. The bias toward neutral views is a cost because it excludes non-consequentialist views from trading, which is unfair. |

  **Case/Argument Both Accept**: The Deontologist-Consequentialist Case.

  *Description*: A is a deontologist who believes it is forbidden to lie, even to save lives. B is a consequentialist who believes that lying is permissible if it produces good consequences. They consider a trade: A pays B to lie in a situation where B would not have lied otherwise, and B pays A to tell the truth in a situation where A would have lied otherwise (but A wouldn't because it's forbidden). 

  **Predictions**:
  - Optimist: Trade is impossible because A cannot pay B to lie (it's forbidden) and B doesn't value truth-telling enough to pay A for it. This case is an exception. In many cases, such as when both are consequentialists, the permissible region is large.
  - Skeptic: This case illustrates that for non-consequentialist views, the permissible region is small. Since a significant portion of the population holds such views, the scope for trade is limited.

  ### Crux 3: Incentive Compatibility

  | Aspect | Optimist's Formulation | Skeptic's Formulation |
  |--------|------------------------|------------------------|
  | **Point at Issue** | With repeated interaction, reputation systems, or third-party verification, the incentive to misrepresent one's values or actions can be mitigated. The would-have-done-anyway problem can be solved by only trading for marginal actions. | The would-have-done-anyway problem is severe because agents have an incentive to overstate the cost of their actions to get paid more. Reputation systems only relocate the problem to the reputation mechanism, which is also vulnerable to manipulation. |

  **Case/Argument Both Accept**: The Repeated Charity Case.

  *Description*: Two charities, A (focused on malaria) and B (focused on education), regularly interact. Each month, they consider trading: A gives to B's cause and B gives to A's. Each has a fixed budget and must decide how much to allocate to trading. Each can choose to misrepresent how much they would have spent on the other's cause without trade.

  **Predictions**:
  - Optimist: Over time, with repeated interaction and the threat of losing future trades, both charities will report truthfully. The gains from trade will be realized and will increase over time as trust builds.
  - Skeptic: Each charity will always claim that they would have spent very little on the other's cause without trade, to get a better deal. Reputation systems require costly monitoring, and without it, trade will break down.

  ### Crux 4: What is Lost, if Anything

  | Aspect | Optimist's Formulation | Skeptic's Formulation |
  |--------|------------------------|------------------------|
  | **Point at Issue** | Acting against one's own verdict at another's behest involves no additional moral or aretaic loss beyond the direct consequences. Any psychological discomfort is either negligible or can be outweighed by the gains. | Acting against one's own verdict involves a loss of integrity, which is a genuine moral cost. This cost is not captured in the expected value calculation and can make the trade net harmful. |

  **Case/Argument Both Accept**: The Vegetarian's Dilemma Case.

  *Description*: A is a vegetarian who believes eating meat is morally wrong. B is a meat-eater who believes vegetarianism is unhealthy. They propose a trade: A eats a steak in exchange for B donating to an animal charity (which A values). By A's lights, the direct consequences of B's donation might outweigh the harm of eating the steak, but A must act against their own verdict.

  **Predictions**:
  - Optimist: If the net expected value (including the steak's harm and the donation's benefit) is positive, A should accept. The psychological discomfort is a small price for the gains and may even be a form of moral growth.
  - Skeptic: A will experience a loss of integrity that is a significant moral cost, making the trade net harmful even if the consequences seem positive.

  ### Crux 5: Second-Order Disagreement

  | Aspect | Optimist's Formulation | Skeptic's Formulation |
  |--------|------------------------|------------------------|
  | **Point at Issue** | Even when agents have different decision rules under moral uncertainty (e.g., expected value vs. minimax), a mutually beneficial swap can often be constructed by finding a trade that each agent prefers over their own diversified allocation. The swap may not be unique, but existence is common. | When agents have different decision rules, their preferred allocations under uncertainty are incommensurable, and it is hard to find a trade that both prefer. The set of mutually beneficial trades is empty or very small. |

  **Case/Argument Both Accept**: The Risk-Averse and Risk-Neutral Case.

  *Description*: A is risk-averse under moral uncertainty: she minimizes the worst-case loss. B is risk-neutral: she maximizes expected value. They both have credences over two moral views: view X (which values cause X) and view Y (which values cause Y). Without trade, A diversifies equally between X and Y to avoid worst-case loss, while B puts all resources on the cause with the highest expected value (say, X). They consider trading: A gives to Y and B gives to X.

  **Predictions**:
  - Optimist: They can find a trade. For instance, if A gives some money to Y (which B values under view Y) and B gives some money to X (which A values under view X), both may be better off. A reduces her worst-case loss by having B support X, and B gains by having A support Y when Y is true.
  - Skeptic: Because A is minimizing worst-case loss, she requires a guarantee that she isn't worse off in any scenario. But if B is supporting X, then in the scenario where Y is true, A is worse off because she has less on Y and B's support on X is worthless. Thus, no trade makes A better off in her worst-case scenario.

  ### Crux 6: Diagnosis

  | Aspect | Optimist's Formulation | Skeptic's Formulation |
  |--------|------------------------|------------------------|
  | **Point at Issue** | The main disputes are about magnitudes that are empirically resolvable (e.g., the extent of comparative advantage, the size of the permissible region). The rest are normative but tractable. | The disputes are fundamentally normative and verbal. For example, what counts as a "loss" in integrity is not measurable, and the existence of trade depends on how we define the agents' decision rules. |

  **Case/Argument Both Accept**: General reflection on the above cases.

  **Predictions**:
  - Optimist: With empirical research, we can measure the frequency of comparative advantage, the size of the permissible region, etc., and show that trade gains are large. The normative disagreements (e.g., on integrity) can be addressed by clarifying that the trade is voluntary and the loss is psychological, not moral.
  - Skeptic: The key issues (like the loss of integrity and the incommensurability of decision rules) are normative and cannot be resolved empirically. The disputes are often verbal because terms like "gain" and "loss" are being used differently.

  ### Additional Invented Case: The Asymmetric Abilities Case

  We have already used the two-donor case (for Crux 1). Now invent one more.

  **Case**: The Specialized Skills Case.

  *Description*: A is an effective altruist who values saving human lives and is very efficient at running malaria bednet programs in Africa. B is an animal rights activist who values reducing animal suffering and is very efficient at running campaigns for factory farming reform. Each has $100,000 to spend. The production function for each cause is concave. Without trade, A spends on malaria, B on animal campaigns. With trade, they swap: A gives $X to B to spend on animal campaigns, and B gives $Y to A to spend on malaria.

  **Relevance**: This case tests the importance of comparative advantage.

  **Predictions**:
  - Optimist: Because of comparative advantage (each is better at their own cause), trade will be highly beneficial. The gains will be large and cannot be achieved by internal diversification (since each is certain of their own cause).
  - Skeptic: Even without trade, each could achieve the same gains by simply spending their own money on their own cause. Trade is unnecessary because there is no DMR gain (since they are not diversifying) and the comparative advantage is already being exploited without trade.

  *Note*: The skeptic's prediction here is that in this case, without DMR, trade is not beneficial. The optimist counters that if they swapped, they might be able to produce more because of differences in marginal productivity. But the skeptic argues that without DMR, there is no gain from swapping.

  However, this case actually shows comparative advantage: if the marginal productivity of A in malaria is higher than in animal campaigns, and vice versa for B, then trade can be beneficial. The skeptic might agree but then argue that such situations are rare.

  We have now covered all six cruxes and included two original cases (Two-Donor and Asymmetric Abilities, though the latter is not explicitly named in the table but used in the discussion). The Two-Donor case was used in Crux 1, and the Specialized Skills case is described above.

  The document is now complete.
answer: |-
  ## Adversarial Collaboration on Moral Trade Between a Trade Optimist and a Trade Skeptic

  ### Section 1: Agreed Claims  
  *Both parties endorse the following substantive claims without reservation.*

  **1. Structure of Moral Trade**  
  1.1. Moral trade is feasible only when two conditions hold:  
  - (a) Agents have differing marginal rates of substitution (MRS) between resources devoted to their own cause versus the other’s cause.  
  - (b) Each agent’s production of value for either cause exhibits diminishing marginal returns (DMR).  
  1.2. Gains from trade arise only when the combined value (by each agent’s own lights) from swapped resources exceeds the value of no-trade allocations.  
  1.3. Moral uncertainty is reducible to a credence distribution over possible moral views, coupled with a decision rule (e.g., expected value maximization). Agents may disagree about these rules.  

  **2. Conditions for Beneficial Swap**  
  2.1. A swap is beneficial for an agent iff:  
  - (a) The value gained from the other agent’s action exceeds the value lost from diverting resources away from their own cause.  
  - (b) The swap does not violate a categorical constraint (e.g., deontological prohibitions).  
  2.2. Comparative advantage (differences in production efficiency) is sufficient but not necessary for gains; DMR alone can enable gains if MRS differ.  
  2.3. Internal diversification under moral uncertainty can replicate gains from DMR but not from comparative advantage.  

  **3. What a Verified Swap Demonstrates**  
  3.1. A completed, verified swap proves that:  
  - (a) Ex ante, both agents believed the trade improved their expected value (or satisfied their decision rule).  
  - (b) The trade was technically feasible given their resources and knowledge.  
  3.2. It does not prove that:  
  - (a) The agents’ moral frameworks are compatible.  
  - (b) The trade was morally obligatory or integrity-preserving.  

  **4. What Neither Side Claims**  
  4.1. That moral trade is universally desirable or applicable.  
  4.2. That gains from trade are zero in all cases.  
  4.3. That moral uncertainty eliminates the possibility of trade (though it complicates it).  
  4.4. That psychological costs (e.g., guilt) are irrelevant to the decision.  

  ---

  ### Section 2: Disagreements Table  
  *Rows are cruxes; columns provide each side’s formulation, a shared case/argument, and pre-commitments to predictions.*

  | Crux | Optimist’s Formulation | Skeptic’s Formulation | Shared Case/Argument | Predictions |
  |------|------------------------|------------------------|----------------------|-------------|
  | **1. Decomposition of the Surplus**<br>*Is DMR alone sufficient to require trade?* | Gains from DMR are amplified by trade because agents efficiently allocate resources to causes others value more at the margin. Comparative advantage expands gains but isn’t necessary. | Gains from DMR are fully captured by internal diversification under moral uncertainty. Only comparative advantage justifies trade, and it is empirically rare in moral contexts. | **Two-Donor Case**: Identical agents A (certain cause X is all that matters) and B (certain cause Y is all that matters) each have $1M. Production: $√X or $√Y utils. Without trade, each spends $1M on their own cause, producing √1M ≈ 1000 utils each. With trade, they swap $500K. Each now produces √500K ≈ 707 utils for their own cause and receives 707 utils from the other’s spending. | **Optimist**: Post-trade, each gets 707 + 707 = 1414 utils > 1000. Gains arise solely from DMR, proving trade beneficial without comparative advantage.<br>**Skeptic**: Internal diversification is impossible here (no uncertainty), but in realistic cases with uncertainty, one agent diversifying alone achieves identical gains. Trade adds no unique value. |
  | **2. The Permissible Margin**<br>*Does optionality bias trade toward maximizing views?* | Most moral views have large permissible regions (e.g., consequentialism allows flexible trade). Trade’s optionality bias is neutral; it merely reflects agents’ voluntary choices. | Deontological/rights-based views often have narrow permissible regions (e.g., "must not violate rights"). Trade systematically favors maximizing views, excluding non-consequentialists unfairly. | **Rights vs. Utility Case**: A (deontologist) must not lie to save lives. B (utilitarian) will lie if it saves net lives. Trade: A pays B to lie in a lifesaving context; B pays A to refrain from lying in a non-lifesaving context. | **Optimist**: Trade occurs only if A values lives saved > integrity loss. Permissible region is adequate for gains if A’s constraints allow trade.<br>**Skeptic**: A cannot trade because paying for lying is forbidden. >50% of real-world agents face such binding constraints, limiting trade’s scope. |
  | **3. Incentive Compatibility**<br>*Can trust/verification solve misrepresentation?* | Repetition and reputation align incentives. Third-party escrow verifies actions, eliminating "would-have-done-anyway" fraud. Gains scale with institutional support. | Verification relocates but does not solve misrepresentation. Agents understate baseline contributions to inflate trade value. Reputation mechanisms are costly and gameable. | **Repeated Charity Case**: A (malaria-focused) and B (education-focused) trade annually. Each can misreport their counterfactual spending to exaggerate gains. A third party audits outputs at 10% cost. | **Optimist**: With audits, honest reporting dominates for discount rates <5%. Trade volume grows yearly.<br>**Skeptic**: Audits fail to detect misreported baselines. Trade collapses within 3 rounds as defection pays > cooperation. |
  | **4. What is Lost**<br>*Is there uncounted loss in acting against one’s verdict?* | Acting at another’s behest involves no moral loss if net value increases. Psychological discomfort is reducible through habituation and is outweighed by gains. | Violating one’s verdict incurs aretaic loss (loss of integrity), which is a moral cost. This loss scales with the act’s wrongness and isn’t priced into trade. | **Vegetarian’s Dilemma**: A (ethical vegetarian) eats meat in exchange for B funding an animal sanctuary. A values sanctuary gains > meat-eating disvalue but feels integrity loss. | **Optimist**: A’s net utility increases; integrity loss is psychological, not moral, and diminishes with repetition.<br>**Skeptic**: Integrity loss is a moral cost. If A rates it at >30% of the gain, trade is net harmful. |
  | **5. Second-Order Disagreement**<br>*Can trade work under clashing decision rules?* | Any decision rule can be modeled as a utility function. Trade benefits exist if post-trade allocations satisfy each agent’s rule better than no trade. | Incommensurable rules (e.g., maximin vs. expected value) create disjoint acceptable sets. Trade fails when rules prioritize different outcomes. | **Risk-Averse vs. Risk-Neutral Case**: A (maximin rule) and B (expected value maximizer) share moral uncertainty between causes X and Y. Each has $1M. X yields 0 or 2000 utils (50% chance); Y yields 1000 utils (certain). | **Optimist**: Trade occurs—e.g., A funds Y (guaranteeing min 1000), B funds X (aiming for 2000). Both improve worst-case/expected outcomes.<br>**Skeptic**: No trade: A requires min 1000 utils, achievable alone by funding Y. B won’t pay A to fund Y since X has higher expected value. |
  | **6. Diagnosis**<br>*What drives disagreement?* | Disputes are empirical: Comparative advantage and permissible margins are larger than skeptics claim. Normative differences are resolvable. | Disputes are normative: Integrity loss and optionality are fundamentally evaluative. "Verbal" disagreements stem from equivocal value comparisons. | **Threshold Flip Analysis**: For each crux, the threshold where one side concedes: | **Optimist**: If DMR gains < comparative advantage gains in >60% of real cases, optimists concede. If integrity loss >50% of gains in >30% of trades, skeptics concede.<br>**Skeptic**: If >50% of agents have tradeable margins <10% of resources, skeptics concede. If verification costs <5% of gains, optimists concede. |

  ---

  ### Invented Cases  
  1. **Two-Donor Case** (used in Crux 1): As above. Tests decomposition without comparative advantage.  
  2. **Asymmetric Abilities Case**: A (expert in disaster relief) can save 1 life/$1K; B (expert in education) can create 1 scholarship/$1K. A values lives > scholarships; B values scholarships > lives. Production: √(resources) for each cause. Tests whether comparative advantage enables unique gains.  
     - **Optimist**: Trade exploits specialization—e.g., A funds scholarships via B, B funds lifesaving via A. Gains exceed DMR-only cases.  
     - **Skeptic**: Internal diversification by a single uncertain agent achieves identical gains.  

  ---  
  *This document, co-signed by Optimist and Skeptic, reflects our best-faith agreement and unresolved disagreements.*
