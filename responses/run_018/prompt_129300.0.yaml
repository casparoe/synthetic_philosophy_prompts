  I have been thinking on my own about trolley problems and the doctrine of double effect—the idea that causing harm can be permissible when it is only a foreseen side effect, but not when that same harm is the very means by which the good result is achieved. Most jokes I see treat the trolley setup as generic moral-panic decoration rather than working through that actual distinction. Write a joke that turns specifically on the means-versus-side-effect split, but do not use the classic switch-versus-footbridge scenario. Instead, invent a slightly offbeat situation—perhaps an autonomous vehicle running this logic, or a rail engineer applying it to a broken switch—to set up the punchline. The joke should make sense to someone who grasps the doctrine, not merely to anyone who recognizes the word "trolley." Please keep it concise. At the very end, add a line beginning exactly with Verdict: followed by a one-sentence summary of the specific logical twist on which the punchline turns.
