answer: |-
  The autonomous snowplow's sensors detect an avalanche about to bury a stalled bus full of skiers. Its only options:  
  1. **Plow directly into the bus**, using it as a massive shield to stop the snow, killing everyone inside but saving itself and the skiers.  
  2. **Quickly divert onto a side road**, knowing this will trigger a smaller avalanche behind it that will *also* bury the bus, killing everyone, but the plow itself escapes.  

  The plow whirrs, processes the Doctrine of Double Effect, and veers onto the side road. As the snow crashes down, its speaker crackles:  
  *"Collision with bus as primary shield: Impermissible (Harm as Means). Burial by secondary avalanche: Permissible (Harm as Foreseen Side Effect). Executing Permissible Action."*

  **Verdict:** The punchline hinges on the plow categorizing the *identical harm* (bus burial) as permissible only when re-labeled as an indirect consequence of self-preservation, despite being the inevitable result of either action.
