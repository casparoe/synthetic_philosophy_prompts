  hey, i'm putting together a syllabus on decision theory and large worlds and there's this analogy everyone leans on that i want to stress-test with my students. people compare evidential cooperation across cosmological distances to identical twins seperated at birth: same genetic "source code", zero communication, but you'd still want your twin to take the cooperative branch because it's like you're both instantiating one decision procedure. they use it to license the claim that rationality just is cooperating with distant copies -- no mysterious multiverse ethics needed, just self-interest extended across copies.

  can you lay out the mapping precisely? what's the twin, what's the separation, what's the shared genome, what's the implicit contract, and what's the payoff matrix? then the breaks: twins share an evolutionary history and emotional bond that copies in different Hubble volumes lack; the analogy might smuggle in relational obligations that only make sense with actual kinship; and there's the issue my colleague keeps raising about indexical uncertainty -- if you don't know which copy is "you", does the twin framing even apply, or does it collapse into a single-agent problem with weird bookkeeping?

  i also want to know whether the cooperation conclusion survives if we drop the twin picture entirely. if the analogy was carrying the intuition that there's a "me" out there to be loyal to, and that turns out to be metaphysically shaky (especially once you factor in that some cosmological models have copies running in different vacuum states with different physical constants, not just spatial separation), is there any non-analogical argument left for cooperating? or was the whole thing just a family romance projected onto the multiverse? keep it conceptual -- no need for citations, i'm just trying to see if the analogy holds water or if i should warn my students it's doing hidden work.
