prompt: |-
  After a long and somewhat circular argument with a friend about whether I owe more to my compatriots than to strangers across borders—she insisted that any preference is merely tribalism with a flag, while I kept reaching for something about shared institutions and historical cooperation that felt different from raw solidarity, yet I could not articulate the distinction—we agreed that the standard framing of nationalism versus cosmopolitanism was obscuring more than it revealed. I am writing a proposal for a four-month independent research project, to be completed as a thirty-five to forty-page essay suitable as a doctoral writing sample, that asks the following precise question: can the moral claim that compatriots have special obligations be decomposed into two conceptually distinct sources—what I will call diachronic reciprocity, arising from multi-generational institutional cooperation and inherited burdens and benefits, and synchronic solidarity, arising from present shared vulnerability and collective risk—and does this decomposition allow a limited defense of compatriot priority that survives cosmopolitan objections, or does it collapse once the two are shown to be inseparable or normatively equivalent?

  The existing debate, as I understand it, treats partiality toward compatriots as a single phenomenon to be either justified or debunked: nationalist arguments invoke shared culture, history, or political community, while cosmopolitan arguments hold that birth within borders is morally arbitrary and that distributive obligations should be global. But because neither side systematically separates backward-looking reciprocity for past institutional contribution from forward-looking solidarity for present shared fate, cosmopolitan critiques that target the arbitrariness of borders do not clearly address whether obligations can arise from participation in intergenerational schemes, and nationalist defenses that invoke cultural identity do not clearly establish that reciprocity generates distributive priorities distinct from universal humanitarian concern. Consequently, the core dispute remains open: it is unclear whether there is a genuinely distinct normative basis for compatriot claims, or whether all apparent particularism reduces either to unjustified favoritism or to universal obligations applied locally.

  My approach will be conceptual reconstruction rather than empirical study or historical exegesis. In the first phase, I will formalize the distinction between diachronic reciprocity and synchronic solidarity using general resources from social contract theory and intergenerational justice, without depending on specific canonical texts or bibliographic surveys, and I will specify the conditions under which each could generate distributive obligations. In the second phase, I will test whether the diachronic claim can survive three standard cosmopolitan objections—moral arbitrariness of birth, the problem of non-voluntary membership in inherited institutions, and the charge that inherited advantage is itself unjust—while remaining genuinely distinct from universal solidarity. In the third phase, I will examine whether synchronic solidarity, once universalized, necessarily collapses into cosmopolitanism or can remain locally bounded without contradiction. A successful result would be either a rigorous framework that isolates a defensible, limited form of compatriot priority grounded solely in reciprocity, or a demonstration that the distinction is unstable and that all particularist obligations reduce to either solidarity or arbitrariness. The project fails if the distinction proves conceptually incoherent—for instance, if reciprocity always presupposes present solidarity—or if it yields no difference in practical allocation principles between compatriots and strangers. Given the purely conceptual nature of the work and the absence of empirical data requirements, this scope is realistic for four months of focused research, and the deliverable—whether positive or negative—will be a sharply framed contribution to a debate that currently conflates questions it ought to separate.
reasoning: |-
  Okay, the user is proposing a doctoral-level research project on the moral obligations to compatriots versus strangers. They want to decompose the idea into diachronic reciprocity and synchronic solidarity. Let me unpack this.

  First, the core question: Can compatriot obligations be split into two distinct sources? Diachronic reciprocity involves intergenerational institutional cooperation—like inheriting benefits and burdens from past generations. Synchronic solidarity is about current shared risks and vulnerabilities. The goal is to see if separating these allows a defensible form of compatriot priority that withstands cosmopolitan critiques.

  The user’s frustration with the existing debate is clear. Nationalists and cosmopolitans talk past each other. Nationalists use culture or shared history, but cosmopolitans dismiss borders as arbitrary. Neither side properly separates historical reciprocity from present solidarity. That conflation leaves the debate unresolved. The user’s project aims to clarify this by pulling apart these two concepts.

  The user’s deeper need might be to find a middle ground. They’re dissatisfied with both tribalism and pure cosmopolitanism. They sense that shared institutions create unique obligations but struggle to articulate why that’s different from mere group loyalty. Their proposal seeks a theoretical framework that justifies partiality without relying on culture or arbitrary birthrights, possibly to inform policy or ethical practices in a globalized world.

  The methodology is conceptual. No empirical work, which is smart given the timeline. The three phases make sense: define the concepts, test against cosmopolitan objections, then check if solidarity can remain local. The key challenge is ensuring the two concepts are truly distinct. If reciprocity relies on present solidarity, the distinction collapses. Also, showing that reciprocity generates unique distributive principles separate from universal obligations is crucial.

  The user’s mention of non-voluntary membership and inherited advantage as objections is spot on. Addressing these will be tough. For instance, if institutions were unjustly established, does reciprocity still hold? The user might need to engage with theorists like Rawls on fair institutions or Shue on basic rights to handle these objections.

  Another angle: synchronic solidarity universalized might lead back to cosmopolitanism. But if solidarity requires shared identity or proximity, maybe it stays local. The user should explore how vulnerability is framed—geographically bounded risks (like natural disasters) versus global ones (pandemics). 

  Potential risks: The concepts might overlap too much. For example, maintaining institutions (reciprocity) could depend on current cooperation (solidarity). Or, the obligations from both sources might not translate to different resource allocations. The user needs to anticipate these and have responses ready.

  The user’s academic background is likely in political philosophy or ethics. Their proposal is sophisticated, targeting a gap in the literature. They might be aiming for academia, so contributing a novel framework could bolster their profile. Their unspoken need could be to resolve their internal conflict from the argument with their friend, seeking intellectual closure through rigorous analysis.

  In summary, the project’s success hinges on rigorously separating diachronic and synchronic elements and proving that reciprocity alone can justify partiality. If successful, it offers a nuanced alternative to polarized debates. If not, it still advances the discourse by clarifying why the distinction fails. Either outcome is valuable, fitting the user’s goal of sharpening the debate.
answer: |-
  This is an exceptionally well-formulated research proposal that directly addresses a critical gap in the political philosophy discourse on partiality. Your core insight – that decomposing "compatriot partiality" into **diachronic reciprocity** and **synchronic solidarity** might resolve the nationalist/cosmopolitan impasse – is original and promising. Here’s a structured assessment and refinement of your plan:

  **Strengths of the Proposal:**
  1.  **Precise Problem Identification:** You correctly diagnose the key flaw: both sides conflate fundamentally distinct types of obligations (intergenerational reciprocity vs. present solidarity). This conflation makes critiques miss their mark and defenses incoherent.
  2.  **Novel Conceptual Framework:** Distinguishing "diachronic reciprocity" (institutional inheritance, burdens/benefits over time) from "synchronic solidarity" (shared present vulnerability/risk) is theoretically potent. It avoids the weaknesses of cultural nationalism and the arbitrariness objection.
  3.  **Clear Research Question & Scope:** The question is sharp, testable, and perfectly scoped for a focused conceptual analysis. The 3-phase structure is logical and achievable within 4 months.
  4.  **High Stakes, Defined Success/Failure:** You clearly articulate what success looks like (either a defensible reciprocity-based priority *or* a demonstration of inevitable collapse) and plausible failure modes (conceptual incoherence, indistinct allocation principles). This is crucial.
  5.  **Methodological Rigor:** Focusing on conceptual reconstruction using social contract theory and intergenerational justice is appropriate. Avoiding exegesis keeps the work original and efficient.

  **Key Challenges & Refinements:**

  1.  **Sharpening the "Distinctness" Test (Phase 1 & 3):**
      *   **Diachronic Reciprocity:** Go beyond defining it. *How exactly* does it generate *distributive* obligations distinct from gratitude, fairness, or desert? Focus on the *intergenerational institutional scheme itself* as the source of obligation (e.g., contributing to/benefiting from a scheme designed for mutual advantage over generations). Emphasize the non-voluntary nature of *inheriting* the scheme's net position (benefits minus burdens). Key sources: Rawls (just savings principle, institutions), perhaps Hume (convention), Scanlon (justification to participants/non-participants).
      *   **Synchronic Solidarity:** Define its scope rigorously. Is it based on shared *identity* (risky), shared *vulnerability* (potentially universalizable), shared *risk-pooling* (like social insurance), or shared *political agency*? Its susceptibility to universalization (Phase 3) hinges on this. Sources: Miller (national responsibility), Anderson (relational equality), potentially Scheffler (associative duties), but carefully.
      *   **Critical Test:** Can you construct hypothetical scenarios where obligations arise *only* from one source? E.g., A citizen inherits significant net burdens from a past institution (reciprocity demands they bear it) but feels no solidarity with current compatriots. Or, a group faces a sudden, novel shared risk (solidarity demands mutual aid) but has no shared institutional history.

  2.  **Navigating Cosmopolitan Objections (Phase 2):**
      *   **Moral Arbitrariness:** Argue that while *birth location* is arbitrary, *inheriting a specific position within an intergenerational scheme* is a brute fact generating obligations of fairness/reciprocity *within that scheme*. Compare: Inheriting a debt isn't arbitrary *in the relevant sense* for determining who owes repayment.
      *   **Non-Voluntary Membership:** This is the hardest objection. How can obligations arise from non-consensual inclusion? Focus on:
          *   *Benefiting:* Did the individual *net benefit* from the inherited scheme? (Requires defining "benefit" – basic institutional stability? Specific goods?).
          *   *Fair Play:* Do obligations arise simply from receiving the *intended benefits* of a cooperative scheme, even without consent? (See Hart/Rawls/Nozick debates).
          *   *Presumption of Acceptance:* Is continued residence/citizenship tacit acceptance of the scheme's terms, including inherited burdens? (Problematic for the trapped poor).
      *   **Inherited Advantage/Injustice:** Acknowledge this head-on. Argue that diachronic reciprocity *presupposes a baseline of institutional justice*. Unjustly acquired advantages *cannot* ground reciprocal obligations to maintain *that specific* inequality. Reciprocity might demand *correcting* inherited injustices *within* the scheme before generating further obligations. This limits its scope significantly but preserves its distinctness.

  3.  **Synchronic Solidarity & Universalization (Phase 3):**
      *   **The Crucial Point:** Your argument's success likely depends on showing that *synchronic solidarity, when universalized, either collapses into weak cosmopolitanism OR requires conditions only met locally*. Explore:
          *   Does solidarity require *mutual recognition* or *shared identity* only plausible within bounded groups?
          *   Does effective solidarity require *institutional capacity* only existing at the state level?
          *   Is solidarity triggered by *shared vulnerability to specific, localized risks* (e.g., national defense, local infrastructure failure) rather than universal human vulnerability? If the latter, it *does* collapse into cosmopolitan concern.
      *   **Goal:** Show that even if synchronic solidarity becomes cosmopolitan, *diachronic reciprocity remains distinct and locally bounded*.

  4.  **Practical Allocation Principles (Success/Failure Criterion):**
      *   **Be Concrete:** How *would* obligations differ? Propose hypothetical allocation rules.
          *   *Reciprocity:* Prioritizes correcting net inherited disadvantage within the scheme, maintaining scheme stability, rewarding/punishing contribution *to the scheme*. Focuses on *institutional goods*.
          *   *Solidarity:* Prioritizes mitigating current shared risks, mutual aid in crisis, pooling resources for common threats. Focuses on *shared fate/vulnerability*.
          *   *Universal Concern:* Prioritizes meeting basic needs, preventing suffering, global equality. Focuses on *human status*.
      *   **Test Case:** How would each principle allocate resources in scenarios like: national pension system funding vs. global famine relief; rebuilding after a national disaster vs. a global pandemic; investing in national infrastructure vs. global climate adaptation.

  **Proposed Refinements to Structure:**

  1.  **Introduction (5-7 pages):** Stalemate in debate, core conflation, precise research question, significance, roadmap.
  2.  **Conceptual Foundations (10-12 pages):**
      *   *Diachronic Reciprocity Defined:* Intergenerational schemes, inherited position, benefit/burden accounting, obligations of fairness/reciprocity *within the scheme*.
      *   *Synchronic Solidarity Defined:* Shared present vulnerability, collective risk, mutual reliance, obligations of mutual aid/co-responsibility.
      *   *Establishing Distinctness:* Conceptual separation, hypothetical tests, different grounding rationales.
  3.  **Defending Diachronic Reciprocity Against Cosmopolitanism (10-12 pages):** Engage each objection deeply. Argue reciprocity survives arbitrariness and (partially) non-voluntariness objections *if* institutional justice is satisfied, but *requires* rectification of inherited injustice.
  4.  **The Fate of Synchronic Solidarity (5-7 pages):** Can it remain bounded? Argue it either universalizes weakly *or* depends on contingent local factors (identity, institutions) that make it practically distinct but normatively secondary to reciprocity for your defense.
  5.  **Synthesis & Implications (5-7 pages):**
      *   *Successful Decomposition:* A limited, reciprocity-based compatriot priority focused on institutional fairness over generations, distinct from solidarity/cosmopolitanism. Scope and limits.
      *   *Failed Decomposition:* Why the concepts collapse (e.g., reciprocity depends on present solidarity; obligations indistinguishable).
      *   *Contribution:* Resolving the stalemate, clarifying the debate, implications for global justice theory/policy.
  6.  **Conclusion (1-2 pages):** Summary, answer to the research question, remaining questions.

  **Why This Project is Excellent & Feasible:**

  You've identified a genuine conceptual knot and proposed a sharp analytical tool to cut it. The focus on *institutions* and *intergenerationality* provides a fresh, less culturally fraught basis for potential partiality. By rigorously defining success/failure and scoping it conceptually, you ensure a manageable, high-impact project. The potential "negative" result (collapse of the distinction) is equally valuable. This proposal demonstrates the sophistication needed for a strong doctoral writing sample.

  **Next Steps:**

  1.  **Draft Specific Hypotheticals:** For distinctness tests, objection responses, and allocation principles. This will sharpen your argument.
  2.  **Sketch Key Arguments:** Outline the core moves for defending reciprocity against each objection. Where does the reasoning feel strongest/weakest?
  3.  **Define "Institutional Justice":** Crucial for Phase 2. What minimal criteria must the inherited scheme meet for reciprocity obligations to arise? (e.g., basic rights protection, fair opportunity?).

  This project has the potential to make a significant contribution by forcing the debate to confront the fundamental heterogeneity of the obligations currently lumped under "compatriot partiality." Good luck!
