answer: |-
  ### 1. The Scenario
  In 1972, abstract painter Elara Vance completed "Chroma Vortex," later lost in a warehouse fire. Vance left behind archivally sealed, lab-verified instructions detailing exact mineral pigment ratios, layered underdrawing coordinates, and a sequenced brushwork log specifying pressure and stroke order. In 2025, the National Art Conservation Center, using Vance’s instructions with period-accurate materials and tools, produces **Object R**. Concurrently, master copyist Leo Bassi—unaffiliated with the museum and possessing only public images of "Chroma Vortex"—creates **Object F** using identical visual analysis but his own material choices and techniques. Bassi explicitly markets Object F as a legally documented replica, with certificates disclaiming any original status. All three objects (the lost original, R, and F) are perceptually indistinguishable under museum-grade analysis.

  ### 2. Verdict Mapping
  **(i) Deception-Based Account (Value requires non-deceptive origin):**  
  This account assigns full value/authenticity *only* to the lost original. Object R, though non-deceptively produced by the institution, lacks Vance’s direct hand in its *final* execution and is thus a high-fidelity replica. Object F, despite its honest marketing, is also a replica and shares R’s status. The core commitment is that value depends on the object’s truthful representation of its genesis. **Divergence from (ii) & (iii):** It agrees with (ii) on devaluing F (both lack artist’s causal role) but disagrees with (ii) by devaluing R (lacking causal connection *even if non-deceptive*). It disagrees with (iii) by devaluing R (failing to see R as realizing Vance’s achieved intention).

  **(ii) Causal-Connection Account (Value requires physical execution by the artist):**  
  This account assigns full value/authenticity *only* to the lost original. Object R, while materially faithful to Vance’s plan, was executed by conservators; the causal chain of Vance’s bodily action is irreparably broken. Object F is further devalued by its independent creation. The core commitment is that artistic value is embodied in the artist’s unique physical trace. **Divergence from (i) & (iii):** It agrees with (i) on devaluing F (both deny F’s value) but disagrees with (i) by *also* devaluing R (despite R’s non-deceptive origin). It disagrees with (iii) by denying that R fulfills Vance’s intention without her causal role.

  **(iii) Achieved-Intention Account (Value requires realization of the artist’s conclusive creative intent):**  
  This account assigns equal value/authenticity to the lost original *and* **Object R**, while devaluing **Object F**. Vance’s verified instructions constitute her final, achieved intention for the work’s material realization. Object R, by adhering perfectly to these instructions, instantiates that intention as fully as the original. Object F, deriving from Bassi’s interpretation (not Vance’s plan), fails to realize her intention. The core commitment is that value resides in the accurate materialization of the artist’s settled plan. **Divergence from (i) & (ii):** It agrees with (ii) on devaluing F but disagrees with (ii) by valuing R (seeing intention fulfilled *without* Vance’s causal execution). It disagrees with (i) by valuing R (despite its institutional origin).

  ### 3. Isolation Analysis
  The **structurally isolating feature** is **Vance’s archivally verified, materially exhaustive instructions**. This decouples three normally conflated elements:  
  - **Perceptual identity** is equal for all objects (neutralizing sensory difference).  
  - **Causal origin** is distinct: original (artist), R (institution using artist’s plan), F (copyist using independent means).  
  - **Deceptive intent** is absent for R (institutional transparency) and F (open marketing), but present only hypothetically.  
  Removing the verified instructions collapses the distinctions: Without Vance’s explicit, binding plan, R becomes merely institutional reconstruction (indistinguishable from F in intentional status), collapsing (iii)’s distinction between R and F, and muddying (i) and (ii)’s disagreement over R.

  ### 4. Robustness Check
  If Bassi deceptively sells **Object F** as the original:  
  - **(i) Deception-Based** now devalues F (due to fraud) but *still devalues R* (non-artist execution).  
  - **(ii) Causal-Connection** still devalues both R and F (neither has Vance’s hand).  
  - **(iii) Achieved-Intention** still values R (intention fulfilled) and devalues F (intention not sourced from Vance).  
  **Convergence/Divergence:** (i) and (ii) now *converge* on devaluing F (for deception and broken causality), but *diverge* on R (i rejects it for institutional origin, ii for broken causality). (iii) remains split from both on R. The case still isolates the target variable—(iii)’s insistence on intention over causality—as R and F remain distinct: R fulfills Vance’s plan; F does not, regardless of deception.

  ### 5. Defense of the Disadvantaged View  
  The **causal-connection account (ii)** fares worst, as it cannot distinguish Object R from Object F, devaluing both equally. A proponent would attack the scenario’s legitimacy by arguing that Vance’s instructions are merely a *recipe*, not the *work*. Artistic value, they contend, emerges *only* from the unrepeatable event of the artist’s physical engagement with the material—a connection irrevocably lost with the original. Object R’s execution by conservators, however precise, is a distinct causal event devoid of Vance’s agential presence, rendering it ontologically identical to F: both are *interpretations* of the original, not its continuation. **Assessment:** This attack *succeeds* in exposing the scenario’s assumption that instructions can "transmit" artistic identity without physical causation—but it does not beg the question. It legitimately challenges the coherence of "realized intention" absent the artist’s causal role, forcing a deeper debate about whether artistic value is located in conceptual plans or embodied actions. The scenario isolates the theories but cannot resolve this metaphysical dispute.
