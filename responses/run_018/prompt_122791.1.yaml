  ### How Principles Handle Your Cases
  | **Case**                     | **Your Verdict**          | **Under Principles**                                                                 |
  |------------------------------|---------------------------|--------------------------------------------------------------------------------------|
  | **Partial entrenchment**     | Accept (e.g., data ret.)  | **Valid** (Principles 1, 2: non-permanent entrenchment allowed).                     |
  | **Self-entrenchment of Rule A** | Accept (hesitant)      | **Valid** (Principles 1, 2: no escalation/evasion).                                 |
  | **Suicide amendment**        | Reject (fraud)            | **Invalid** (Principle 2c: irrevocable entrenchment).                                |
  | **Ratchet amendment**        | Reject (trick)            | **Invalid** (Principle 2a: escalating constraints).                                  |
  | **Quorum trick**             | Reject (cheating)         | **Invalid** (Principle 2b: exclusionary redefinition).                               |
  | **Continuity clause**        | Reject (smuggling)        | **Invalid** (Principle 2b: redefinitional entrenchment).                             |
  | **Same-sitting collision**   | Unstable                  | **Resolved** (Principle 3: pro-amendment power prevails).                            |
  | **Self-validating amendment**| Not tested                | **Conditionally valid** (Principle 1: valid only if *actually* compliant at vote).   |
  | **Anti-repeal amendment**    | Not tested                | **Invalid if irrevocable** (Principle 2c); **valid if difficult** (e.g., unanimity). |
  | **Secretary certification**  | Not tested                | **Invalid if uncertified** (Principle 1: fails pre-effect procedure).                |

