answer: |-
  Here’s your Q&A prep sheet, ordered by damage potential (high to low), phrased for your audience, with replies and vulnerability notes. I’ve twisted standard literature without obscure citations.

  ---

  ### **Objection 1: "You conflate diachronic identity with rational agency. Rational choice theory already handles changing preferences via state-contingent plans (e.g., McClennen’s resolute choice). The ‘agent’ is stable if we model commitment."**  
  **Reply (2 min):** "Resolute choice assumes pre-commitment to a plan, but in centipede, players *reinterpret* their position mid-game. Backward induction requires the agent at T=1 to simulate their T=20 self’s reasoning. If the T=20 self has new beliefs (e.g., 'My opponent is irrational') or altered risk tolerance from fatigue, it’s not the same agent. McClennen’s model collapses when the later self rejects the initial justification. Backward induction needs a fixed epistemic frame, but lived time fractures it."  
  **Soft spot:** Philosophers of action will note I haven’t defined "agent" rigorously. I’m borrowing from Schelling’s *The Strategy of Conflict* on divided selves, but not explicitly.

  ---

  ### **Objection 2: "Behavioral experiments (e.g., McKelvey & Palfrey) show people *do* play late rounds. Your 'changing agent' is just noise around bounded rationality."**  
  **Reply (2 min):** "Bounded rationality explains deviations from BI, but not *why* BI fails structurally. Experiments fix player roles (e.g., 'you’re Player 2 for all rounds'), but real agents accumulate context: shame from prior moves, sunk-cost fallacies, or new information (e.g., my dad learned Mom’s lawyer was bluffing in Round 15). BI assumes perfect recall of fixed rules, but humans recall *narratives*. Your data captures heuristics; my point is BI’s axioms forbid temporal identity shifts."  
  **Soft spot:** If the economists cite specific adaptive-learning models, I’ll need to improvise counter-evidence from memory.

  ---

  ### **Objection 3: "Common knowledge of rationality (CKR) is a *framing device*. Your advisor’s work shows we can refine CKR to include learning. Why isn’t this just imperfect information?"**  
  **Reply (2 min):** "CKR refinement assumes a unified agent updating beliefs. But if the Round 1 agent believes 'I’m patient' and Round 20 believes 'I’m desperate,' it’s not belief updating—it’s *ontology shift*. BI requires CKR over static types. Once identity mutates (e.g., fatigue making my mom risk-seeking), common knowledge can’t be established because the players’ *selves* aren’t common knowledge. Framing can’t stabilize a moving target."  
  **Soft spot:** My advisor might counter that identity shifts *are* learnable types. I’ll need examples (e.g., sudden personality changes under stress).

  ---

  ### **Objection 4: "This is just hyperbolic discounting in fancy dress. Your ‘different agents’ are time-slices with inconsistent time preferences (Ainslie)."**  
  **Reply (2 min):** "Hyperbolic discounting explains impatience, not reasoning breakdown. BI fails even with exponential discounting if later time-slices reject earlier premises. In centipede, Round 20 isn’t just valuing $100 less—they might redefine rationality entirely (e.g., 'cooperation is ethical'). Ainslie’s picoeconomics treats selves as bargaining *within* one agent. I argue there’s no ‘meta-agent’ to enforce BI’s solution."  
  **Soft spot:** If pressed, I concede this could be radical preference revision, not new agents.

  ---

  ### **Objection 5: "Game theory already models this: repeated games with incomplete information (Kreps et al.). Your ‘identity change’ is just type uncertainty."**  
  **Reply (2 min):** "Type uncertainty assumes a fixed set of possible types. But in long negotiations, players *invent* new types mid-game (e.g., 'I’m now a vengeful person'). Kreps’ models don’t cover endogenous type-generation. BI requires known type spaces; my point is the type space evolves unpredictably because the players’ self-concepts do."  
  **Soft spot:** I’m blurring "type" (game theory) and "self-concept" (psychology). Philosophers will pounce.

  ---

  ### **Objection 6: "If agents change, backward induction still applies to each ‘stage-agent.’ Why can’t we model this as a nested game?"**  
  **Reply (2 min):** "Nested games require each sub-agent to know the others’ payoffs. But Round 1 me can’t simulate Round 20 me’s payoffs because they depend on 19 rounds of *experienced trauma* (e.g., distrust). BI needs off-path consistency, but later agents *reinterpret* earlier actions ('I was naïve then'). It’s not nested—it’s hermeneutic."  
  **Soft spot:** I’m invoking interpretive drift without citing hermeneutics (e.g., Gadamer). Risky.

  ---

  ### **Objection 7: "This undermines *all* sequential rationality. Do you reject dynamic consistency entirely? (See Machina’s critique of EU)."**  
  **Reply (2 min):** "Only for sufficiently deep games where identity erosion is likely. We can salvage BI in short games (e.g., 3 rounds) or mechanistic agents. But in centipede’s ideal form (100 rounds?), the endpoint isn’t reachable by backward steps because the starting agent dissolves. Machina shows preferences aren’t stationary; I show *agency* isn’t."  
  **Soft spot:** Needs examples of "identity erosion" threshold. I have none.

  ---

  ### **Objection 8 (The Nuke): "Aren’t you projecting your parents’ divorce onto rational choice theory? This sounds like psychologizing, not philosophy."**  
  **Reply (2 min):** "The farm negotiation is an intuition pump, not evidence. My argument stands on logical grounds: BI requires the agent at node *n* to be identical to the agent imagining node *n*. If identity isn’t persistent (as Parfit, Schechtman argue), BI fails. Philosophers of action accept that practical identity affects rationality (Korsgaard). I’m applying that to games. The divorce illustrates, but doesn’t prove, the point."  
  **Soft spot:** Admitting it’s an intuition pump weakens me. If they smell blood, I’m cornered.

  ---

  ### **Honest Overall Weakness:**  
  Your core vulnerability is conflating *identity* (philosophical), *preferences* (economics), and *self-narrative* (psychology). The behavioral economists will demand experimental tests; philosophers will want a metaphysics of "agent"; your advisor will ask why common knowledge can’t absorb identity shifts. **Save your ass:** Emphasize this as a *boundary condition* ("BI fails when games outlast identity stability") not a general critique. Cite Binmore’s *Game Theory and the Social Contract* on "eductive stability" if they press.  
    
  *Break a leg. Watch for the typo in "actually" during Q&A.*
