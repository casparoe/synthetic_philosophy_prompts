answer: |-
  Your analysis cuts to the heart of a profound epistemological conflict within historical practice. The stalemate isn't primarily semantic, nor is it simply about different questions; it stems from fundamentally incompatible **epistemic frameworks** governing what counts as valid data, explanation, and defeat. Here's a diagnosis grounded in their core commitments:

  **Diagnosis: The Core Disagreement is Epistemic Framework Incompatibility**

  1.  **What Each Side Treats as "Data":**
      *   **Mainstream Historiography:** Treats *contextualized archival traces* as primary data. This includes:
          *   **Source Provenance & Critique:** The origin, transmission, purpose, and potential biases of documents/artifacts are integral to their evidential weight. A carbon-dated object isn't just a date; its archaeological context, associated artifacts, and consistency with other independent chronological markers (e.g., astronomical records, synchronisms in texts) are crucial.
          *   **Internal Consistency & External Coherence:** Data gains validity through its consistency within a specific archive/text *and* its coherence with a wider network of evidence from different sources, methodologies, and disciplines (archaeology, epigraphy, linguistics, climatology, genetics).
          *   **Anomaly as Noise or Problem:** Anomalies (like a carbon date mismatch) are *initially* treated as noise requiring investigation: Is the sample contaminated? Is the context misidentified? Is the chronology model flawed? Resolution involves *tightening the existing framework* or *modifying a specific hypothesis*. Defeat occurs when anomalies become *systematic and irreconcilable* within the established, interlocking evidence base, forcing paradigm revision (e.g., revising Bronze Age chronologies based on dendrochronology).
      *   **Pseudohistory/Methodological Pluralist Critics:** Often treat *patterns, similarities, or perceived inconsistencies* as primary data, frequently decoupled from provenance or context.
          *   **Pattern Recognition Over Provenance:** Similarities in myths, architectural styles, or artistic motifs across vast distances/times are often elevated to the status of direct evidence for connection or common origin, regardless of documented transmission paths or contextual differences. The *absence* of expected evidence (gaps) is itself treated as significant data ("hidden actors").
          *   **Coherence Within the Narrative Frame:** Data is valid if it fits the proposed alternative narrative structure (e.g., Fomenko's telescoped chronology, Atlantis as a global progenitor culture). Anomalies from mainstream science (like carbon dates) are treated as *inherently flawed* or *misinterpreted within the wrong framework*, not as challenges to the core narrative. Defeat is rarely conceded because counter-evidence is *always* interpreted as either:
              *   **Fabrication/Distortion:** By malicious elites or incompetent scholars.
              *   **Misplaced:** Belonging to a different time/location within the alternative schema.
              *   **Incomprehensible:** Within the current (flawed mainstream) understanding.

  2.  **What Each Side Treats as "Defeat":**
      *   **Mainstream:** Defeat occurs when:
          *   A core hypothesis is *irreconcilably contradicted* by multiple, independent lines of rigorously contextualized evidence.
          *   The hypothesis demonstrably *fails to explain* the full range of relevant, contextualized data better than alternatives.
          *   Anomalies *persistently resist resolution* despite exhaustive investigation within the methodological framework (leading to paradigm shift, not framework abandonment).
      *   **Pseudohistory/Pluralist Critics:** Defeat is structurally avoided by:
          *   **Immunizing Strategies:** Core claims are protected by auxiliary hypotheses ("hidden actors", "lost knowledge", "deliberate suppression", "misinterpreted science") that explain away *any* counter-evidence.
          *   **Shifting the Burden of Proof:** The demand for positive evidence supporting the alternative narrative is deflected onto mainstream history to "disprove" it conclusively – an impossible standard given history's reliance on fragmentary evidence.
          *   **Re-defining "Evidence":** Defeat requires disproving the *entire hermeneutic frame*, not specific claims within it. Since the frame defines what counts as valid evidence, counter-evidence is preemptively invalidated.

  **Competing Hypothesis on Structure: Ontological vs. Narrative Coherence**

  Your hypothesis is insightful. The core divide can be framed as:

  *   **Mainstream:** Seeks **Archival Ontological Coherence.** The goal is a reconstruction of the past that best explains the *surviving, contextualized traces* as products of specific agents, events, and structures within a plausible spatiotemporal framework. "Truth" is probabilistic, evidence-based, and anchored in the material and textual archive. Inconsistencies are *problems* to be resolved *within the archive*.
  *   **Pseudohistory/Radical Pluralists:** Seek **Narrative Hermeneutic Coherence.** The goal is a *meaningful story* that explains perceived patterns, gaps, or dissatisfactions with conventional history. The archive is seen as corrupted, incomplete, or misinterpreted. "Truth" often lies in uncovering a hidden order (conspiracy, lost civilization, chronological error) that makes sense of the *perceived anomalies and patterns*, regardless of archival provenance. Inconsistencies in the archive are *evidence* of the hidden truth or mainstream error.

  **Why Empirical Refutation Fails:**

  1.  **Incommensurable Falsification Criteria:** As you note, direct replication is impossible. Mainstream falsification relies on cumulative, contextual weight and explanatory power. Pseudohistory renders itself unfalsifiable by its hermeneutic frame: *any* counter-evidence reinforces the need for the frame (to explain suppression/error).
  2.  **Different Explanatory Ideals:** Mainstream seeks *causal explanation* grounded in documented historical actors, structures, and contingencies. Pseudohistory often seeks *totalizing explanation* – a single cause (lost civilization, chronological conspiracy) explaining vast swathes of human experience. The latter is more satisfying narratively but less constrained evidentially.
  3.  **Standards of Proof:** Mainstream operates with Bayesian probability – evidence updates the likelihood of hypotheses. Pseudohistory often operates in binary terms: either the grand narrative is "true" or mainstream history is a complete "fraud." Nuance and probability are casualties.

  **Path to Progress: Conceptual Distinction & Question Reframing**

  Progress requires clarifying the fundamental divergence in goals and standards:

  1.  **Sharply Distinguish Ontological from Narrative Goals:** Explicitly acknowledge that "historical truth" can mean:
      *   **Reconstructive Truth:** The most probable account of past events/structures based on rigorous analysis of contextualized archival traces (mainstream goal).
      *   **Mythic/Narrative Truth:** A story providing meaning, identity, or explanation for perceived patterns/gaps, often independent of strict archival fidelity (a valid human need, but distinct from reconstruction).
      *   Frame the debate as: *Which project are we engaged in?* Most pseudohistory presents itself as Reconstructive Truth but employs the standards of Mythic Truth.
  2.  **Reframe the Question for Critics:** Instead of "Is mainstream history wrong?", ask: "**What specific, testable predictions does your alternative framework make about the *content and discovery* of *new, contextualized archival traces* that the mainstream framework does not (or predicts differently), and how have past predictions fared?**" This forces engagement with the core mainstream evidentiary standard (contextualized archival ontology) and predictive power. Pseudohistories typically lack such predictions or reinterpret findings post-hoc.
  3.  **Expose Immunizing Strategies:** Consistently identify and challenge auxiliary hypotheses that make the core claim unfalsifiable. Demand positive evidence *within the alternative framework* that isn't solely an interpretation of absence or anomaly. Ask: "What evidence *would* falsify your core claim?"

  **Conclusion:**

  The impasse stems from incompatible epistemic frameworks: one grounded in contextualized archival ontology seeking probabilistic reconstructive truth, the other prioritizing narrative/hermeneutic coherence often insulated from falsification. While there are semantic overlaps ("evidence"), the core commitments to what constitutes valid data and defeat are incommensurable. Progress lies not in convincing proponents of one framework within the terms of the other (which is futile), but in clearly demarcating the projects (reconstruction vs. meaning-making) and rigorously demanding that claims to reconstructive truth meet the standards of contextualized evidence and falsifiability inherent to that project. The debate stalls because pseudohistory borrows the vocabulary of reconstruction while rejecting its methodological core. Clarifying this divergence is the essential first step.
