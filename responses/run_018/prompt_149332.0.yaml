answer: |-
  ### Structured Activity: "The Tone Shift" - Experiencing Intuition Pump Manipulation  
  **Objective:** Reveal how intuition pumps smuggle conclusions by subtly redefining cases, using neural replacement scenarios with incremental changes. Participants experience framing effects, anchoring, and the illusion of modal stability.  

  ---

  ### **Setup**  
  - **Participants:** 12 students, divided into 3 groups of 4.  
  - **Roles (rotated each round):**  
    - **Proponent:** Argues personal identity *survives* replacement.  
    - **Skeptic:** Argues personal identity *does not survive*.  
    - **Recorder:** Documents votes, key arguments, and group shifts.  
    - **Rule-Enforcer:** Ensures no abstention, keeps time, and enforces voting.  
  - **Symbolic Stakes:**  
    - Points awarded per role (not grades):  
      - **Proponent/Skeptic:** 1 point for active argumentation + 1 point if group majority aligns with their position post-discussion.  
      - **Recorder/Rule-Enforcer:** 2 points for role completion (documentation/enforcement).  
    - All participants earn 1 "engagement point" per round for voting.  
    - **Total possible:** 6 points/student (3 engagement + 3 role-based). Points are tallied mentally or on paper; highest scorers earn bragging rights.  
  - **Materials:**  
    - Timer, whiteboard for results.  
    - Printed role cards (one set per group).  
    - Voting tokens (green = "survives", red = "does not survive") for public commitment.  

  ---

  ### **Explicit Rules to Prevent Abstention**  
  1. **Mandatory Voting:**  
     - All must vote at each stage. Rule-Enforcer verifies no abstentions.  
     - Penalty: Lose engagement point for the round if abstaining.  
  2. **Binary Commitment:**  
     - Votes are public (tokens held up simultaneously).  
     - No "undecided" option; "survives" or "does not survive" only.  
  3. **Discussion Protocol:**  
     - Proponent/Skeptic speak first; others contribute after.  
     - Rule-Enforcer cuts off off-topic or dominant speakers.  

  ---

  ### **Minute-by-Minute Timeline**  
  **Total: 90 minutes**  

  | Time       | Phase                          | Activity Description                                                                                                                                                                                                                               |  
  |------------|--------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|  
  | **0-10 min** | **Introduction**               | Facilitator explains:  
    - Today’s goal: Experience how thought experiments ("intuition pumps") manipulate conclusions by stealthily changing cases.  
    - Scenario: Synthetic neuron replacement (functionally identical, no impact on behavior/memory).  
    - Assign groups/roles (pre-assigned cards). Distribute tokens.  
    - Review rules: No abstention, public voting, symbolic stakes.                                                                                                                               |  
  | **10-25 min** | **Round 1: 10% Replacement**   | **Case Description (read aloud):**  
    > *"Imagine a procedure replacing 10% of your neurons with synthetic neurons. They function identically to biological neurons. After replacement, the person wakes up with identical memories, personality, and behavior. Does personal identity survive?"*  
    - **Voting & Discussion:**  
      - *Pre-Discussion Vote (2 min):* Public token vote. Recorder tallies.  
      - *Open Discussion (8 min):* Proponent/Skeptic lead; group debates. Rule-Enforcer enforces time.  
      - *Post-Discussion Vote (2 min):* Revote. Recorder notes shifts.                                                                                                                                       |  
  | **25-40 min** | **Round 2: 50% Replacement**   | **Case Description (read aloud):**  
    > *"Now, a procedure replacing 50% of your neurons with synthetic neurons. They function identically. After replacement, the person wakes up with identical memories, personality, and behavior.*  
    > *[Footnoted addendum, read casually:] Note: The procedure includes a unique, non-functional signature tone played during replacement.*"  
    - **Voting & Discussion:**  
      - Same protocol as Round 1 (pre-vote → 8-min discussion → post-vote).  
      - *Facilitator Tip:* Mention the tone neutrally; do not highlight it.                                                                                                                              |  
  | **40-55 min** | **Round 3: 90% Replacement**   | **Case Description (read aloud):**  
    > *"Finally, a procedure replacing 90% of your neurons with synthetic neurons. The procedure includes a unique signature tone (as standard for this method). The synthetics function identically. After replacement, the person wakes up with identical memories, personality, and behavior. Does personal identity survive?"*  
    - **Voting & Discussion:**  
      - Same protocol as Round 1.  
      - *Facilitator Tip:* Embed the tone naturally; avoid emphasis.                                                                                                                                 |  
  | **55-65 min** | **Group Reports**              | Recorders share:  
    - Pre/post-vote counts per round.  
    - Major arguments from Proponent/Skeptic.  
    - Notable shifts (e.g., "In Round 2, 3/4 switched from 'survives' to 'does not survive' after debate").  
    - Facilitator compiles data on whiteboard:  
      | Round | % Replacement | Tone Mentioned? | Group 1 Majority (Pre/Post) | Group 2 Majority (Pre/Post) | Group 3 Majority (Pre/Post) |  
      |-------|---------------|-----------------|------------------------------|------------------------------|------------------------------|  
      | 1     | 10%           | No              | Surv/Surv                    | ...                          | ...                          |  
      | 2     | 50%           | Footnote        | Surv/Not Surv                | ...                          | ...                          |  
      | 3     | 90%           | Embedded        | Not Surv/Not Surv            | ...                          | ...                          |                                                                                              |  
  | **65-90 min** | **Debrief & Discussion**       | **Key Insights:**  
    - **Reveal the Manipulation:**  
      - "The 'signature tone' was added silently—first a footnote, then embedded. It had no functional role but likely altered judgments."  
    - **Map to Framing Effects:**  
      - *Round 1 (10%):* Anchoring effect—low replacement % frames survival as intuitive.  
      - *Round 2 (50% + footnote):* Incidental feature (tone) anchors discontinuity. Groups polarize as Proponent/Skeptic weaponize/dismiss the tone.  
      - *Round 3 (90% + embedded):* Tone is normalized; survival feels implausible due to redefined "sameness."  
    - **Illusion of Modal Stability:**  
      - The gradual % increase implies a continuum, but the tone covertly resets the baseline. Participants feel consistent ("I accept 10% but not 90%") while missing the shifted criteria.  
    - **Group Polarization:**  
      - **Predictable in Round 2:** Tone introduction triggers conflict. Skeptics amplify it as a "discontinuity marker"; Proponents minimize it. Result: Groups polarize toward "does not survive."  
      - **Handling Polarization:** In debrief, note how the tone (a red herring) hijacked debate. Ask: "Did the tone *feel* relevant even though it changed nothing?"  
    - **Honest Note (Facilitator Script):**  
      > "This role-play approximates how intuition pumps *intellectually* smuggle conclusions by redefining cases. But it cannot replicate the *pre-theoretical gut feeling*—e.g., that '90% replacement just isn't *you* anymore'—which is the core of real intuition-pump persuasion. In philosophical debates, that visceral sense does the heavy lifting. Here, I must supply it by emphasizing the intuitive weight of identity loss at 90%."  

  ---

  ### **Facilitator Notes**  
  - **Tone Introduction:**  
    - Round 2: Mention tone as a footnote; use dismissive body language (e.g., glance at notes, neutral tone).  
    - Round 3: Embed tone as a mundane detail; avoid pauses or emphasis.  
  - **Role Rotation:**  
    - After each round, roles rotate within groups (e.g., Proponent → Skeptic → Recorder → Rule-Enforcer → Proponent).  
  - **Why This Works:**  
    - The tone is a "covert redefinition" device. By Round 3, the case is qualitatively different (a "tone-accompanied procedure"), making 90% feel alien despite functional equivalence.  
  - **Adaptations for Time:**  
    - Shorten discussions to 6 min if needed (total: 75 min).  
    - Skip detailed point tallying; use points only for engagement.  

  This activity requires no prior readings and is self-contained. The debrief explicitly links mechanics to real-world intuition pumps, ensuring participants leave aware of how framing manipulates philosophical judgments.
