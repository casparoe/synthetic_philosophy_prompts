  I’m drafting a scene for my novel — there’s an old clockmaker in Singapore who had a stroke and lost all his declaritive memory, he can’t name the gears or say why he does what he does, but his hands still repair the escapement. I want a villianelle from his apprentice’s point of view that stages Ryle’s knowing-how against knowing-that. The two refrains should keep turning: one about the hands remembering what the mouth forgot, one about asking him why and getting only silence. They need to meet in the last two lines without resolving, because in the story he never gets his words back but the clocks keep running. Make it feel like workshop dust and brass oil, not a philosophy lecture. British spelling, please. Sorry if my notes are messy — I wrote 'villianelle' everywhere and probably spelt 'escapement' wrong too.
