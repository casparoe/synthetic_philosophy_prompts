  I should pay attention to several distinctions the user mentions: diachronic vs. synchronic updating, the old-evidence problem vs. logical omniscience, and token events vs. event types under predictive models. Many Bayesian defenses hinge on counterfactual learning scenarios ("How would we have updated if we hadn't known E?") or by recognizing that the evidence was never probabilistically certain to begin with.

  Garber (1983) and Jeffrey (1983) offer important responses - the idea that we update on the discovery that T entails E, which might have been uncertain. This involves expanding the probability space to include propositions about logical relations. There are also arguments that old evidence can confirm through unification or by increasing our credence in other predictions, even if direct updating is problematic.

