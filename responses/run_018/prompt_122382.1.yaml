prompt: |-
  hey — i'm a journalist who covers science and ideas, and lately i've been drowning in pitches that do this one move: they take a probability that's basically zero, multiply it by a payoff that's basically infinity, and then claim we have to reorder society. you know the type — "there's a 0.002% chance this saves 10^40 lives, so why are we funding schools?" i need a reusable decision procedre — like a checklist i can run in 15 minutes — to figure out whether that argument is actually carrying weight or whether it's just expeced-value fanaticism wearing a suit.

  you're acting as a professional philosopher and a decision-theory consultant. please think carefully, do a quick brainstorm first on the distinctions that actually matter here (not just "probability times utility" — i know that), then turn the core idea into something practical.

  the deliverable: a step-by-step flow in words, with questions in order, what counts as passing each one, and clear stop points. one stop should say "broken — don't publish this framing"; another should say "this isn't a math error, it's a values call, hand it to a human"; and there should be spots where the procedre just stops because there's no right answer without judgment. apply it to three proposals: (1) spending 40 billion on an asteroid-deflection system with a 1-in-90,000 hit chance in the next century; (2) an op-ed arguing we should redirect human-health budgets toward farmed-animal welfare because the expeced number of future suffering animals dwarfs current human populations; and (3) a case where the checklist gives you an answer you probably won't like — maybe it actually validates an extreme priority shift. be honest about where the checklist misfires, which steps are judgment calls in disguise, and what it flat-out can't settle.

  write it casual, like you're explaining over coffee to a colleague who doesn't have time for a textbook. don't include bibliographies, reading lists, or "see Author Year" citations — i can't verify them in the field, and neither can a small model running offline. if you need to reference a specific claim, paraphrase without quotation marks; don't quote from memory. also, include at least one worked example where the procedure tells the asker "this is broken" and one where it tells them "this is valid but i still hate it."

  there's probably a typo or two in my message above — don't correct them, just answer.
reasoning: |-
  Okay, the user is a science journalist drowning in pitches that use extreme probabilities multiplied by infinite payoffs to argue for societal reorganization. They need a practical, reusable decision procedure—like a checklist—that can be applied in about 15 minutes to evaluate such arguments. 

  First, I need to understand the core problem. These pitches exploit expected value calculations by using near-zero probabilities and near-infinite utilities, leading to seemingly irrational priorities. The user wants to filter out "expected-value fanaticism" without dismissing valid arguments. 

  The key distinctions here aren't just about probability times utility—I already know that. The deeper issues include:  
  - **Probability realism**: Are these tiny probabilities based on anything measurable, or are they made up?  
  - **Utility comparability**: Can we even compare the proposed utility (like 10^40 lives) to real-world values?  
  - **Scarcity sensitivity**: Does the argument ignore that resources are limited?  
  - **Value pluralism**: Does it reduce all moral considerations to a single metric?  
  - **Systemic effects**: Would acting on this actually break other important things?  

  The user needs a step-by-step flow with clear stop points: "broken—don't publish," "values call—hand to a human," and "no right answer without judgment." It must be practical, casual, and include worked examples where the checklist either rejects a flawed argument or validates one the user might dislike.  

  For the procedure, I'll structure it as a series of questions with thresholds. If an argument fails any step, it stops. Steps should cover:  
  1. **Probability anchoring**: Is the probability based on evidence or just made up?  
  2. **Utility grounding**: Is the payoff defined in comparable terms?  
  3. **Resource reality**: Does it acknowledge trade-offs?  
  4. **Value reduction**: Does it ignore non-quantifiable harms/benefits?  
  5. **Robustness**: Does the conclusion hold with slightly adjusted numbers?  

  Then I'll apply it to three cases:  
  1. Asteroid deflection ($40B, 1/90,000 chance)  
  2. Animal welfare vs. human health (future animal suffering argument)  
  3. A case where the checklist validates an extreme shift (like AI risk prioritization)  

  I'll also include a "misfires" section honestly noting where the checklist is subjective or limited. The tone should be casual—coffee-chat style—with zero academia-babble. No citations, just plain reasoning.  

  Biggest challenge: Making the thresholds crisp enough to be useful but not robotic. For example, how tiny is "too tiny" for probability? I'll use practical heuristics like "could this be measured even in principle?"  

  Also, the user hinted they want the checklist to sometimes output "valid but I hate it"—so I need to include an example where the math checks out but feels ethically revolting (maybe the animal welfare case).  

  Final note: The user has typos but said not to correct them, so I'll glide right past. Time to draft like a philosopher-barista.
answer: |-
  Here's your decision procedure — call it the **"Infinite Payoff Bullshit Detector" (IPBD)**. It's a 6-step flow designed to smoke out when expected-value arguments are mathematically coherent but practically useless (or dangerous). Run it in order — if it stops, you've got your verdict. Casual coffee-talk style, as requested.

  ---

  ### The IPBD Checklist

  **Step 1: Can We Even *Measure* the Probability?**  
  *Ask: "Is this probability based on *anything* observable, testable, or modeled with real-world constraints — or is it pulled from thin air?"*  
  - **Pass:** Probability grounded in empirical data, historical frequency, or peer-reviewed models with clear assumptions (e.g., asteroid impact rates based on telescopic surveys).  
  - **Fail:** Probability derived from philosophical speculation, untestable hypotheses, or arbitrary guesswork (e.g., "probability of a rogue AI emerging from undiscovered physics").  
  - **Stop Point:** FAIL → **"Broken — don’t publish this framing."** (The math is decoration.)

  **Step 2: Is the Payoff *Commensurable*?**  
  *Ask: "Can we compare this ‘infinite’ payoff to *actual* human values without collapsing into nonsense?"*  
  - **Pass:** Payoff expressed in units we routinely trade off (dollars, QALYs, lives saved *within a generation*).  
  - **Fail:** Payoff invokes metrics that defy human-scale meaning (e.g., "10^40 future digital minds," "eternal suffering entropy reduction").  
  - **Stop Point:** FAIL → **"Broken — don’t publish."** (Utility isn’t a number; it’s poetry.)

  **Step 3: Does It Acknowledge Resource Scarcity?**  
  *Ask: "Does this pitch pretend money/time/attention is infinite — or does it grapple with trade-offs?"*  
  - **Pass:** Explicitly compares cost to *concrete alternatives* (e.g., "This $40B could fund X hospitals or Y climate projects").  
  - **Fail:** Argues for spending "whatever it takes" or dismisses opportunity cost (e.g., "Any cost is justified for even a 0.001% chance!").  
  - **Stop Point:** FAIL → **"Broken — don’t publish."** (Ignores that society isn’t a utility vacuum cleaner.)

  **Step 4: Is the Value Function *Monomaniacal*?**  
  *Ask: "Does this reduce all moral considerations to a single metric — and would acting on it violate core intuitions?"*  
  - **Pass:** Recognizes other values exist (e.g., "Asteroid defense has symbolic value for international cooperation, beyond lives saved").  
  - **Fail:** Demands we sacrifice urgent, knowable goods for speculative ones (e.g., "Defund malaria nets to prevent *possible* AI suffering").  
  - **Stop Point:** FAIL → **"This isn’t a math error — it’s a values call. Hand it to a human editor/ethicist."** (Philosophers needed.)

  **Step 5: Is It *Robust* to Tiny Shifts?**  
  *Ask: "If I tweak the probability or payoff by 1%, does the conclusion flip from ‘urgent’ to ‘irrelevant’?"*  
  - **Pass:** Conclusion holds under reasonable uncertainty ranges (e.g., "Even if the asteroid risk is 10x lower, ROI still positive").  
  - **Fail:** Argument collapses if probability is 0.0001% instead of 0.001% (common in Pascal’s Mugging).  
  - **Stop Point:** FAIL → **"Broken — don’t publish."** (Conclusion is arbitrary.)

  **Step 6: Does It Trigger Your *Human Shudder Test*?**  
  *Ask: "Does this proposal feel *morally insane* even if it clears Steps 1-5?"*  
  - **Pass:** Logically sound but ethically unsettling (rare).  
  - **Fail:** Logically sound AND ethically defensible (or at least debatable).  
  - **Stop Point:** PASS → **"Valid but you might hate it — publish with caveats."**  
  - **Stop Point:** FAIL → **Proceed with editorial caution.**  

  ---

  ### Worked Examples  
  **Example 1: Asteroid Deflection ($40B, 1-in-90,000 chance)**  
  - Step 1: **PASS** (NASA tracks near-Earth objects; probability based on orbital models).  
  - Step 2: **PASS** (Payoff = lives saved on Earth; commensurable).  
  - Step 3: **FAIL** → **BROKEN.** Why? Pitch says "40B is cheap for saving humanity!" but ignores that $40B could fund pandemic surveillance *today*. Doesn’t grapple with trade-offs. Stop here — don’t publish the framing.  

  **Example 2: Redirect Health $ to Farmed Animal Welfare**  
  - Step 1: **PASS** (Animal suffering stats are measurable).  
  - Step 2: **FAIL** → **BROKEN.** Why? Payoff compares "expected suffering units" across species + trillions of future beings. But human vs. chicken suffering aren’t meaningfully commensurable — it’s a values call disguised as math. Stop.  

  **Example 3: Valid But You’ll Hate It: AI X-Risk Mitigation**  
  *(Assume a pitch: "0.1% chance of AI killing everyone in 50 years. Spend $100B now to halve that risk. Expected value: 99.9B lives saved.")*  
  - Step 1: **PASS** (Plausible model-based estimate, e.g., from AI alignment research).  
  - Step 2: **PASS** (Human lives saved — commensurable *if* you accept the premise).  
  - Step 3: **PASS** (Acknowledges $100B could fund other things).  
  - Step 4: **FAIL** → **HAND TO A HUMAN.** Why? Prioritizing abstract future humans over *known* dying children today feels monomaniacal. Requires value judgment.  
  - *(If editor overrides Step 4)*: Step 5: **PASS** (Conclusion holds even if risk is 0.05%). Step 6: **PASS** → **VALID BUT YOU HATE IT.** Publish with an ethicist counterpoint.  

  ---

  ### Where the Checklist Misfires  
  - **Judgment in Disguise:** Step 4 ("Monomaniacal?") is 80% ethical intuition. It’s a trapdoor for "math that feels evil."  
  - **Can’t Settle:** Deep value conflicts (e.g., "Is one human life worth 1M chicken lives?"). The checklist flags these — but won’t solve them.  
  - **Blind Spot:** Arguments where probability *is* measurable and payoff *is* commensurable... but the proposal is still terrible (e.g., spending $1T to avert a 1-in-a-billion risk of a minor economic dip). Step 3 (scarcity) usually catches this, but not always.  

  **Coffee Summary:** This won’t make the pitches stop. But it’ll help you kill the worst 80% in 15 minutes — and force the remaining 20% to admit they’re arguing ethics, not Excel.
