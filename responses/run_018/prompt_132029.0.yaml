prompt: |-
  I'm a software engineer with no formal philosophy background, but I'm trying to resolve a consistency problem in how I think about rules. On a recent work trip, I was in a place where leaving extra money for service is considered insulting rather than kind; after excellent service I left cash on the table, and the server chased me outside to return it, clearly uncomfortable. Later that same trip, I waited at a red crosswalk with no traffic in sight while everyone around me crossed, and I formed a precise line for a bus while others filled gaps casually. Back home, tipping is built into wages, jaywalking is common if it seems safe, and queues are loose. I can't tell whether my discomfort in each case was ethical—like I'd violated some real duty—or just social, like running the wrong version of a local protocol. If these conventions aren't universal, do I have any genuine obligation to follow them as a temporary visitor, especially when my own judgment says they're unnecessary or even wrong? Please lead with your bottom line in the first sentence and then give your reasoning, with no preamble and no restating of the question.
reasoning: |-
  Okay, the user is a software engineer dealing with a consistency problem in how they think about rules after experiencing different cultural norms around tipping, jaywalking, and queuing. They're questioning whether their discomfort in those situations was ethical or just social, and if they have any real obligations as a temporary visitor when their judgment conflicts with local conventions.

  First, I need to address the core issue: the difference between social conventions and moral obligations. The user's analogy of "running the wrong version of a local protocol" is spot-on. That's a great way for a software engineer to conceptualize it. They're clearly trying to map their technical mindset to philosophical concepts.

  The tipping incident stands out because they accidentally insulted someone despite good intentions. That wasn't an ethical failure - they didn't know the local "code." But once they learned the rule, continuing to tip would become disrespectful. That's where obligation kicks in: when your actions affect others negatively.

  For jaywalking and queuing, the user felt discomfort even when no one was harmed. That's probably social conditioning from their home culture clashing with local practices. If nobody's getting hurt and they're not disrespecting anyone, their obligation is minimal. Still, observing local norms shows respect - like avoiding "null pointer exceptions" in social interactions.

  The user might be wrestling with moral absolutism versus relativism. Their engineer brain wants consistent rules, but human societies have context-dependent "variables." The real obligation is to avoid harming or disrespecting others - that's the universal constant. Local conventions are just the changing parameters.

  I should emphasize that their discomfort was mostly social, not ethical. The ethical part is their willingness to adapt once aware of the impact. That growth mindset is what matters. They're already doing the right thing by questioning this - that self-reflection is the key to resolving the inconsistency they feel.
answer: |-
  Your obligation is primarily social and contextual rather than universal ethical, grounded in respect for local communities and avoiding harm, not inherent moral duty. 

  1.  **Conventions vs. Morality:** Actions like tipping, jaywalking, or queuing are governed by *conventions* (social agreements) rather than core moral principles (like honesty or non-harm). Their "rightness" depends on the specific social context and the meaning assigned by that community. Tipping where it's insulting is harmful *because* it violates the local agreement and causes distress, not because tipping itself is inherently wrong.

  2.  **Respect and Harm Avoidance:** As a visitor, your core obligation is to avoid causing harm or offense *within that context*. This requires understanding and respecting local norms. Ignoring the tipping norm caused genuine harm (embarrassment, offense) – violating this obligation. Ignoring the jaywalking or queuing norm *might* cause minor social friction (annoyance, perceived rudeness) but likely not significant harm *if* done carefully and without disrupting others. Your discomfort often stemmed from violating ingrained social conditioning, not a deep moral failing.

  3.  **The Role of Judgment:** Your own judgment ("this seems unnecessary") is insufficient to override convention *when your actions impact others within that convention*. Your judgment that leaving money is "kind" was irrelevant and harmful *in that context*. For jaywalking/queuing, if your action (waiting at an empty crosswalk, strict queuing) doesn't harm, disrupt, or disrespect others *in their context*, it's generally acceptable, even if unusual. Your discomfort was likely social awkwardness, not ethical error.

  4.  **The "Visitor" Obligation:** Your primary duty as a temporary visitor is *not* to impose your home norms or assume their superiority. It's to observe and respect the local "protocol" to the best of your ability, especially when deviation causes confusion, offense, or harm. This is pragmatic (smooth interaction) and respectful (acknowledging their social contract). It's not a duty to *internalize* the norm, but to *adhere* to it outwardly to avoid negative consequences for others.

  **Bottom Line:** Follow conventions to avoid harm/offense in the local context; your discomfort was primarily social (protocol mismatch), but your obligation stems from respect for the community you're temporarily part of.
