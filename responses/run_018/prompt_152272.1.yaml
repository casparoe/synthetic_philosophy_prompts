  Hey, I'm a retired physical chemist who recently started poking around in philosphy of mind and medical ethics. I read about pain asymbolia — patients who report sharp pain, rate it high, but don't seem bothered by it, don't withdraw, sometimes even laugh. It seems like the sensory detection and the "this is bad" evaluation are split apart.

  Can you explain the core conceptual issue this raises? Specifically, I'm trying to understand whether pain is intrinsically bad, or whether the badness is always a separate affective layer that can come unstuck — like in asymbolia. There's also this niche point I haven't seen discussed much: if the sensory profile is genuinely neutral, then an artificial version of asymbolia (say, a drug that preserves nociception but blocks the negative valence) wouldn't be relieving suffering so much as removing a separate judgment. But then why do we think pain is the paradigmatic bad experience?

  I'm not asking for citations or a reading list — I just want the logic laid out, especially where the intuition that "pain hurts" starts to break down. And please excuse any typos, my typing hasn't improved since retirement.
