answer: |-
  Right then, let's get straight to it. My credence in epistemicism about vagueness, precisely as defined—that every vague predicate has sharp boundaries fixed by actual use, all sorites series have a last-F/first-not-F transition, and our inability to locate it is purely epistemic (without requiring the boundary to be *knowable* in principle)—is **0.2**.

  ### Credence Decomposition & Justification
  Here's how I break it down, assigning rough probabilities to key sub-questions that jointly support epistemicism:

  1.  **Can use-based metasemantics fix a sharp boundary?**  
      *Probability: 0.35*  
      Justification: While use *constrains* meaning, it's highly implausible that messy, statistical, context-influenced usage patterns determinately pick out a single grain as the exact boundary for "heap". Metasemantic accounts (e.g., Lewisian eligibility) struggle to explain why one precise cutoff is uniquely selected over neighbouring candidates. Evidence of robust context-dependence or prototype effects in psychology weighs against this.  
      *Support for Epistemicism: Low.*

  2.  **Is higher-order vagueness adequately explained?**  
      *Probability: 0.5*  
      Justification: Epistemicism must explain why we can't locate the boundary *and* why we can't locate the boundaries of our *ignorance* (why we can't say *which* cases we’re ignorant about). Williamson's margin-for-error principle offers a formal model, but it feels like stipulating the phenomenon to be explained. The intuition that vagueness iterates ("borderline borderline cases") seems fundamental and poorly captured by pure ignorance.  
      *Support: Moderate/Neutral.*

  3.  **Is preserving classical logic/bivalence a decisive advantage?**  
      *Probability: 0.7*  
      Justification: This is epistemicism's strongest suit. Rejecting bivalence or classical logic (e.g., modus ponens) for vague languages is a significant cost for rivals. If classical logic is non-negotiable for fundamental reasoning, epistemicism gains major plausibility. The theoretical elegance and security of classical semantics are powerful arguments.  
      *Support: High.*

  4.  **Are alternatives significantly less viable?**  
      *Probability: 0.3 (for alternatives' collective viability being low)*  
      Justification: Supervaluationism (0.25) faces "ignorance of precisification" and "artificial sharpness" objections. Degree theories/Fuzzy Logic (0.3) struggle with compositional rules and the "tolerance principle". Contextualism (0.15) can feel ad hoc for sorites. However, collectively they offer plausible non-epistemic solutions to boundary-sensitivity.  
      *Support for Epistemicism: Low (as rivals aren't clearly ruled out).*

  5.  **Is the "arbitrariness" objection fatal?**  
      *Probability: 0.4 (that it is NOT fatal)*  
      Justification: The charge that a sharp boundary would be "metaphysically arbitrary" (why grain 1,000, not 999?) is intuitive. Epistemicists counter that boundaries for non-vague terms (e.g., "child"/"adult") are also arbitrary but exist. This objection feels potent but not decisive; linguistic conventions *can* be arbitrary yet precise.  
      *Support: Moderate.*

  ### Combining the Probabilities
  I treat these as partially interdependent and use a conservative multiplicative approach weighted towards critical hurdles (metasemantics, alternatives):

  *   Core Feasibility: (Metasemantics `0.35` * Higher-Order `0.5` * Arbitrariness `0.4`) = `0.07`
  *   Advantage & Competition: (Logic `0.7` * (1 - Alternatives `0.3`)) = `0.49`
  *   Combined Support: `0.07 * 0.49 ≈ 0.034`
  *   Normalisation & Adjustment: This raw product is too low, as it ignores interactions and the genuine pull of classical logic. Adding a small prior for semantic precision (~0.05) and scaling for the weight of Logic+Alternatives factors gives **~0.2**.

  ### Sensitivity & Key Sub-Question
  My credence is **most sensitive to the metasemantic question (1)**.  
  *   **Argument/Evidence to Move It:** A compelling, non-question-begging metasemantic theory demonstrating *how* and *why* communal use *must* determinately select a single sharp boundary for vague predicates, resolving the apparent symmetry between adjacent candidates. Evidence from computational linguistics showing language use converges on hidden precise thresholds would significantly increase my credence (towards **~0.5**). Failure to find such evidence or demonstrations that use is inherently gradient/contextual beyond recovery solidifies the low probability (down to **~0.1**).

  ### Locating Your Disagreement
  The gap between your credence (0.15) and your colleague's (0.7) is stark. The most plausible locus of disagreement lies in **the metasemantic question (1) and the viability of alternatives (4)**:
  *   **Metasemantics (1):** You likely see this as very improbable (`<0.2`), seeing vague use as fundamentally incompatible with sharp boundaries. Your colleague likely finds it highly plausible (`>0.8`), believing competent use *implicitly* defines a precise extension, even if unknowable.
  *   **Alternatives (4):** You see supervaluationism as robust (credence 0.6), hence alternatives are highly viable (your P(alternatives viable) `>0.5`). Your colleague likely sees them as deeply flawed (her P(alternatives viable) `<0.15`), viewing truth-value gaps or degrees as costlier than epistemic mystery. She may also weight **classical logic (3)** much more heavily (`>0.9`).

  In essence: your colleague has high confidence that use fixes sharp boundaries *despite* ignorance and that abandoning classical semantics is unacceptable. You find the metasemantics of sharp fixation implausible and see supervaluationism as preserving enough classical logic at an acceptable cost. The core battleground is whether linguistic practice *can* be precise beneath the veneer of vagueness.
