prompt: |-
  Ok so I need help settling an argument before thursday lol. We're doing the grue thing in philosphy class (emeralds, green until some date then blue, you know the one) and at lunch my friend Deven said he could build a way better version. His word is "gleep": an emerald is gleep if it's green whenever anyone is actually looking at it. That's the whole definition. It says nothing about what the emerald is up to at 3am when nobodies watching. Then his theory is "all emeralds are gleep," and here's the annoying part: every emerald anyone has ever looked at in all of history is a confirming instance, and his theory is safer than plain old "all emeralds are green," because green could turn out wrong about unobserved emeralds and gleep literally can't be. He's going around saying his theory is "better confirmed" than green and that gemologists should switch over.

  Obviously this is cheating but I can't pin down the exact cheat and it's driving me nuts. It's not just grue, because grue actually takes a risk: once the date in the definition passes you can go look and grue can lose. Gleep never has a date, the "deadline" is just whenever someone happens to check, so it can never lose to green — no possible observation could ever favor green over gleep, since evidence about unobserved emeralds is impossible to get by definition. But it's also not exactly unfalsifiable the way Popper meant, because if you looked at an emerald and it was blue, gleep would be dead on the spot. It's falsifiable, it's just rigged so it can never do worse than the normal theory while saying strictly less. So my main question: is there an actual name for this specific move — a predicate built so that the stronger normal claim can never beat it in evidence — or did Deven stumble into something nobody's named? If the grue literature covers this observation-relative version I want to know how it's handled there.

  And I don't just want a label, I want the carving. If it has a name, give me the exact difference from regular grue and from Popper-style unfalsifiability. If it doesn't, coin one and define it tight. Either way, tell me what to do with this case, because Deven thinks it's a slam dunk for him: my little brother swears the fridge light is always on whenever he opens the door, and "on whenever I check" is the exact same gleep-shaped move as the emeralds — but somehow it sounds like the reasonable thing to say about fridges and the cheaty thing to say about emeralds. Same shape, different verdict. If your definition is any good it should explain why.
