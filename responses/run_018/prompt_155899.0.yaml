  3. **Method**: Conceptual analysis (not empirical neuroscience or new logical proofs) by comparing formal constructions with phenomenological descriptions of self-consciousness.
  4. **Deliverable**: A conceptual map that distinguishes which features of self-awareness are mirrored in formal self-reference, which are erroneously projected, and what a model of self-aware cognition must include beyond formal analogies.
