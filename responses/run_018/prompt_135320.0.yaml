answer: |-
  **Belief's Due**

  When evidence and consequence collide
  And stakes demand a verdict, sharp and clear,
  *Only truth's domain can here preside.*

  Should peril loom or safety be denied,
  Must reason bow to consequences' fear?
  When evidence and consequence collide,

  The pragmatist insists that we decide
  Not just by proof, but what we stand to bear—
  *But stakes reshape the normative structure inside.*

  For if belief were naked, stripped of pride
  In its own aim, what discipline would steer
  When evidence and consequence collide?

  Through thought's transparent pane, no screen to hide
  False grounds—just facts that truth alone holds dear:
  *Only truth's domain can here preside.*

  Yet urgency can shift the bounds applied;
  Is knowing *this* worth costing all held near?
  When evidence and consequence collide,
  *Only truth's domain can here preside?*
  *But stakes reshape the normative structure inside.*

  ---

  **Interpretive Note:**

  *   **Liberties Taken:**
      *   The poem frames pragmatic reasons as potential *reasons for belief*, directly opposing the evidentialist claim, whereas some pragmatists (e.g., "Reasons First" theorists) might argue practical stakes generate reasons for *action* (e.g., acting *as if* one believes) or for *withholding judgment*, distinct from reasons *for* the belief-state itself.
      *   The refrains present the views starkly ("*Only* truth's domain...", "*But stakes reshape*..."), which risks oversimplification. Evidentialism allows non-evidential factors to *cause* belief (via bias, etc.), just not to be normative *reasons* for it. Pragmatic encroachment doesn't claim *all* stakes matter, only sufficiently high ones relative to the evidence.
      *   The phrase "reshape the normative structure inside" is poetic compression. It captures the core pragmatic claim that the *justificatory threshold* for belief (i.e., *how much* evidence is required) is sensitive to stakes, thereby altering the normative conditions governing belief-formation, not merely causing a psychological effect.

  *   **Settled Distinction (Broad Consensus):**
      *   There is a meaningful philosophical distinction between "right-kind reasons" (RKRs) – reasons that engage with or bear on the *constitutive aim* or *standard of correctness* of an attitude (e.g., evidence bearing on truth for belief) – and "wrong-kind reasons" (WKRs) – reasons that might motivate adopting the attitude but do not bear on its constitutive aim (e.g., a reward for believing something irrelevant to its truth). This applies broadly to attitudes like belief, intention, admiration, etc.

  *   **Genuinely Contested:**
      *   **The Constitutive Aim of Belief:** Is truth the *sole* constitutive aim of belief? Does belief *have* a single, unified constitutive aim? Evidentialists (like Shah, Velleman) argue yes, citing the "transparency" of belief (deliberating about whether to believe P just *is* deliberating about whether P is true). Critics deny transparency entails a single aim or that it excludes the relevance of other factors (like action-guidance) to belief's normative structure.
      *   **Nature of Pragmatic Influence:** Can practical stakes *ever* constitute normative *reasons for belief itself* (as the poem's pragmatist refrain suggests), or do they only ever constitute reasons for *action* related to inquiry/judgment, or *causes* of belief? Pragmatic Encroachment theorists (e.g., Fantl & McGrath, Stanley, Hawthorne) argue the former – stakes can raise/lower the *justificatory bar* for belief, making evidence insufficient or sufficient *because* of the stakes. Evidentialists (e.g., Adler, Shah, Fumerton) argue stakes can only ever be WKRs (motivating causes) or reasons for actions like gathering more evidence, never RKRs bearing on the truth-aptness of the belief itself. This is the core dispute mirrored in the poem's unresolved refrains.
