answer: |-
  This is a brilliantly observed pattern that exposes a critical gap in our conceptual toolkit. What you're describing is **strategic procedural inflation**: *the intentional multiplication of formally robust but functionally impotent oversight mechanisms coupled with the operational defunding or jurisdictional hollowing of existing constraints, creating a façade of institutional density that masks diminished accountability.*

  ### Core Conceptual Boundaries
  1.  **Strategic Accumulation (vs. Decay):** Not passive weakening, but *active creation* of new institutions/procedures. This distinguishes it from simple institutional decay or hollowing out (where capacity erodes).
  2.  **Formal Robustness / Functional Impotence (vs. Façade Democracy):** Institutions aren't crude shams; they possess *formal* hallmarks of independence/complexity (appointment procedures, mandates, review powers). Their impotence stems from *designed limitations* (trivial scope, non-binding outputs, gatekeeping triggers). This differs from façade democracies where institutions *never* had real power.
  3.  **Asymmetric Displacement (vs. Layering):** New layers *don't replace* old ones; they coexist. However, effective old institutions are *asymmetrically undermined* (defunded, jurisdictionally narrowed, procedurally bypassed). This goes beyond neutral historical institutionalist "layering".
  4.  **Paradoxical Outcome (vs. Backsliding Generality):** Quantitative metrics (institutional count, formal independence scores) may *improve*, while substantive constraint *collapses*. This is the defining paradox separating it from linear backsliding.

  ### Adjacent Concepts & Distinctions
  *   **Authoritarian Legalism / Autocratic Legalism (Scheppele):** Shares the abuse of legal forms, but your focus is *specifically* on **proliferating redundant, complex, impotent institutions** as a distinct *tactic* within legalism, not just legalistic repression generally.
  *   **Institutional Decoupling (Meyer & Rowan):** Focuses on symbolic vs. operational aspects, but your case involves **active strategic *creation* of symbolic decoupling** as a weapon, not just organizational drift.
  *   **Counter-Majoritarian Difficulty (Bickel):** Flips the script – here, it's the *executive* strategically using *procedural complexity* and *redundancy* to neuter *potential* counter-majoritarian constraints.
  *   **Bureaucratic Bloat / Red Tape:** Differs in *intent* and *target*. Your phenomenon is *targeted*, *politically motivated* inflation of *oversight* procedures to *protect* power, not general administrative inefficiency.
  *   **"Zombie Institutions" (various):** Captures the "dead but walking" aspect of the *old* institutions, but misses the *active proliferation* of new, designed-to-be-impotent institutions.

  ### Proposed Names & Nuances
  1.  **Strategic Procedural Inflation (SPI):** Emphasizes the *active, tactical creation* of complex procedures/institutions and the *bloating* effect. Best captures the core mechanism and outcome.
  2.  **Constraint Dilution via Redundant Institutionalization (CDRI):** Highlights the *purpose* (weakening constraint) and the *method* (adding useless layers).
  3.  **Institutional Smokescreening:** Emphasizes the *obfuscation* purpose – using complexity and formal robustness to *mask* diminished accountability, confusing observers/metrics.
  4.  **Counterweight Proliferation Syndrome:** Focuses on the creation of fake/impaired "checks and balances" that appear numerous but lack force.

  ### Boundary Cases & Clarification
  *   **Singapore's GRC System:** Adds complex electoral procedures that *do* have substantive impact (favoring PAP). **Not SPI** – the complexity is functional for the regime. SPI creates *dysfunctional* complexity.
  *   **US Regulatory "Death by Delay":** Procedural hurdles slowing regulation. **Not SPI** unless *explicitly designed by incumbents* to neuter *oversight of themselves* (vs. general governance friction).
  *   **Abolishing a Court vs. Creating 5 New Impotent Ones:** Abolishing is straightforward backsliding/decay. Creating 5 impotent ones while gutting the original court's budget/jurisdiction **is SPI** – it exploits the paradox of increasing formal density while decreasing constraint.
  *   **Pure Façade (e.g., Soviet Supreme Soviet):** Always purely symbolic, never had independent power or resources. **Not SPI** – SPI involves the *active process* of *replacing* functional constraint with complex impotence *while maintaining democratic pretense*.

  ### Why "Strategic Procedural Inflation" Fits Best
  It directly names:
  1.  **Strategic:** Intentional action by the regime.
  2.  **Procedural:** Focuses on rules, processes, institutional design.
  3.  **Inflation:** The key observable – quantitative increase in formal institutional density/complexity.
  4.  **Implied Paradox:** Inflation normally suggests growth/strength, but here it signifies the *opposite* – a dilution of efficacy.

  This concept powerfully captures the insidious nature of this erosion tactic: it weaponizes the very appearance of democratic resilience to undermine it. It provides a crucial analytical lens for graduate students to dissect how regimes can simultaneously *build* institutions and *destroy* accountability.
