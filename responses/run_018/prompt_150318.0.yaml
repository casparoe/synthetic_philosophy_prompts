answer: |-
  Below is a decision tree for assessing whether an omission (like the engineer's skipped backup check) caused an outcome (data loss). It uses concrete yes/no questions, avoids philosopher jargon, and incorporates your "diffuse omission" case (e.g., three services missing heartbeats). Each leaf includes a named position (if standard) or "unnamed/unexplored," plus one awkward real-world implication. The tree is designed for clarity—like debugging code, but for causation.

  ---

  ### **Decision Tree: Did an Omission Cause the Outcome?**
  Start with the engineer skipping the backup check, leading to data loss.

  1. **Is an omission (e.g., not acting) EVER a real cause, or just shorthand for "something else" (e.g., the primary failure)?**  
     - **No** → **Leaf 1: Omissions Aren't Causes (OAC)**  
       - *Named view*: Standard eliminativist position.  
       - *Awkward commitment*: In the backup case, you **must deny the engineer's inaction caused the loss**, even though checking would have prevented it. The cause is only the primary failure—like blaming a fallen tree for a car crash, not the missing guardrail.  
       - *Diffuse omission handling*: In the three-service heartbeat failure, **no omission is a cause**—only the orchestrator's crash matters. Each service's inaction is irrelevant.  
     - **Yes** → Go to 2.  

  2. **Is counterfactual dependence enough? (i.e., If the omission hadn’t happened, would the outcome have been avoided?)**  
     - **No** → Go to 3.  
     - **Yes** → Go to 4.  

  3. **Does causation require violating a norm/duty? (e.g., the engineer was SUPPOSED to check)**  
     - **Yes** → **Leaf 2: Normative/Deontic Account**  
       - *Named view*: Standard in law/ethics (e.g., duty of care).  
       - *Awkward commitment*: If the engineer **had no formal duty to check** (e.g., it was a voluntary task), their omission isn’t a cause—even if skipping it led to disaster. Causation vanishes without a rulebook.  
       - *Diffuse omission handling*: In the heartbeat case, **only services with a heartbeat-sending duty are causes**. If one service had no contractual obligation, its omission isn’t causal—even if it contributed.  
     - **No** → **Leaf 3: Unnamed / Unexplored**  
       - *Awkward commitment*: You need a **non-normative, non-counterfactual test for causation**—but none exist in mainstream theories. This position collapses into inconsistency (e.g., "it’s causal because I feel it is").  

  4. **Must there be a defined "normal course" (e.g., the Sunday schedule) for the omission to count?**  
     - **Yes** → **Leaf 4: Baseline-Relative Account**  
       - *Named view*: E.g., default expectations in systems.  
       - *Awkward commitment*: If the backup check **had no defined schedule** (e.g., ad-hoc triggers), the omission isn’t a cause—even if skipping it caused the loss. Causation depends on institutional quirks, not physics.  
       - *Diffuse omission handling*: **Each service’s omission is a cause only if a baseline (e.g., SLA) required heartbeats**. No baseline? No cause—even if all three failed.  
     - **No** → **Leaf 5: Pure Counterfactual Account**  
       - *Named view*: Standard in causal modeling (e.g., Lewis).  
       - *Awkward commitment*: **ANY preventable non-event becomes a cause**. The CEO’s failure to personally verify backups is a cause—after all, if they had, the loss wouldn’t have happened. Blame explodes.  
       - *Diffuse omission handling*: **Each missing heartbeat is a full cause** if its presence would have prevented the crash (e.g., if one heartbeat suffices to stabilize the orchestrator). If not (e.g., all three needed), **no single omission is a cause**—only the collective failure matters.  

  ---

  ### **Ambiguities & Unattractive Outcomes**
  - **Indistinguishable leaves**: The tree can’t cleanly separate **Leaf 2 (Normative)** and **Leaf 4 (Baseline-Relative)**. If a "norm" (Leaf 2) is defined by a "baseline" (Leaf 4), they overlap—e.g., the Sunday schedule is both a norm and a baseline.  
  - **Most unattractive combo**: Answering **Yes** to omissions as causes (Q1) → **No** to counterfactual (Q2) → **No** to norms (Q3). This lands in **Leaf 3 (Unnamed)**, which has no coherent causation criteria—like requiring a "vibe check" for causality.  

  ---

  **Bottom line:** The sharpest divide is whether causation by omission requires **counterfactual dependence alone** (Leaf 5: over-includes blame) or **norms/duties** (Leaf 2: under-includes blame when rules are vague).
