answer: |-
  Below is a branching taxonomy for your seminar, built from the logical space of answers to three diagnostic questions. The taxonomy sorts positions by their commitments on access consciousness (modeled via global workspace broadcasting), phenomenal consciousness, and their relationship. Each leaf includes a named position (if applicable) or "unnamed," with core commitments and awkward implications, especially regarding super-blindsight cases (where information is globally broadcast without reported experience).

  ---

  ### **Branching Taxonomy: Consciousness and Global Workspace**

  #### **Question 1: Can global broadcasting occur with *no* phenomenal character?**  
  *(Is a "broadcast-only" architecture possible?)*  
  - **Yes** → Proceed to Question 2A.  
  - **No** → Proceed to Question 2B.  

  ---

  #### **Question 2A: (If broadcast-only is possible) Can phenomenal consciousness exist *without* global broadcasting?**  
  *(Are "privately phenomenal" states possible?)*  
  - **Yes** → Position: **Block-style Access-Phenomenal Independence** (named: Ned Block).  
    - *Core commitment*: Broadcasting and phenomenality are fully dissociable; both broadcast-only and privately phenomenal states are possible.  
    - *Awkward implication*: Super-blindsight is unproblematic (broadcasting without phenomenality exists), but privately phenomenal states imply inaccessible qualia, challenging scientific study or functional utility.  
  - **No** → Position: **Unnamed Necessity-Only** (no major theorist).  
    - *Core commitment*: Broadcasting is necessary but not sufficient for phenomenality (broadcast-only possible; privately phenomenal impossible).  
    - *Awkward implication*: Super-blindsight is possible, but we must explain why identical broadcasts sometimes lack phenomenality (e.g., requiring an arbitrary extra factor).  

  #### **Question 2B: (If broadcast-only is *impossible*) Can phenomenal consciousness exist *without* global broadcasting?**  
  - **Yes** → Position: **Unnamed Sufficiency-Only** (no major theorist).  
    - *Core commitment*: Broadcasting is sufficient but not necessary for phenomenality (broadcast-only impossible; privately phenomenal possible).  
    - *Awkward implication*: Super-blindsight is *impossible* (broadcasting always triggers phenomenality), but subjects in such cases must be wrong about lacking experience, inviting skepticism about first-person reports.  
  - **No** → Position: **Global Workspace Theory (GWT)** (named: Dehaene, Baars).  
    - *Core commitment*: Broadcasting is necessary *and* sufficient for phenomenality (broadcast-only impossible; privately phenomenal impossible).  
    - *Awkward implication*: Super-blindsight is incoherent—if information is broadcast, it *must* be phenomenal, contradicting the case’s definition.  

  ---

  ### **Unoccupied Combinations & Gaps**
  - **Unnamed Necessity-Only** (Q2A → No):  
    - *Gap diagnosis*: **Unattractive**. Requires an unexplained factor to distinguish conscious/unconscious broadcasts (e.g., why super-blindsight lacks phenomenality despite broadcasting). Undermines parsimony, making it unpopular.  
  - **Unnamed Sufficiency-Only** (Q2B → Yes):  
    - *Gap diagnosis*: **Unattractive and unexplored**. Implies subjects misreport phenomenality in super-blindsight, undermining first-person authority. Few defend it due to this counterintuitive consequence.  

  ### **Collapsed Positions**
  - **The third branch ("sufficient? necessary?") is fully determined by Questions 1 and 2**, eliminating the need for explicit branching.  
    - *Why?*:  
      - If broadcast-only is possible (Q1→Yes) and privately phenomenal is possible (Q2A→Yes), broadcasting **cannot be necessary or sufficient** (Block’s position).  
      - If broadcast-only is possible (Q1→Yes) but privately phenomenal is impossible (Q2A→No), broadcasting is **necessary but not sufficient**.  
      - If broadcast-only is impossible (Q1→No) but privately phenomenal is possible (Q2B→Yes), broadcasting is **sufficient but not necessary**.  
      - If broadcast-only is impossible (Q1→No) and privately phenomenal is impossible (Q2B→No), broadcasting is **necessary and sufficient** (GWT).  
    - *Result*: The third branch collapses into the first two questions. No distinct positions are conflated, but the taxonomy exhausts all logical options without redundancy.  

  ---

  ### **Summary of Positions**
  | **Position**                          | **Broadcast-Only Possible?** | **Privately Phenomenal Possible?** | **Relationship to Phenomenality**       |  
  |---------------------------------------|------------------------------|-----------------------------------|----------------------------------------|  
  | Block-style Independence              | Yes                          | Yes                               | Neither necessary nor sufficient       |  
  | Unnamed Necessity-Only                | Yes                          | No                                | Necessary but not sufficient           |  
  | Unnamed Sufficiency-Only              | No                           | Yes                               | Sufficient but not necessary           |  
  | Global Workspace Theory (GWT)         | No                           | No                                | Necessary and sufficient               |  

  ### **Key Implications for Super-Blindsight**
  - **Block**: Super-blindsight is real but unproblematic (broadcast-only exists).  
  - **Unnamed Necessity-Only**: Super-blindsight is possible, but the extra ingredient for phenomenality is missing.  
  - **Unnamed Sufficiency-Only**: Super-blindsight is impossible; subjects *have* unreported phenomenality.  
  - **GWT**: Super-blindsight is incoherent; global broadcast implies phenomenality.  

  ---

  ### **Teaching Notes**
  - **Pedagogical value**: Students can self-sort into positions by answering Questions 1 and 2 *before* learning labels (e.g., "Does broadcasting *require* experience? Can experience be private?").  
  - **Super-blindsight focus**: Use this case to stress-test each position’s "awkward implication" (e.g., GWT must deny its possibility; Sufficiency-Only must distrust verbal reports).  
  - **Gaps**: Highlight why Necessity-Only/Sufficiency-Only are rare—both demand uncomfortable trade-offs (mystery factors vs. unreliable introspection).  

  This structure ensures clarity, avoids name-driven comparisons, and centers on testable commitments. Let me know if you’d like slides, a handout, or debate prompts!
