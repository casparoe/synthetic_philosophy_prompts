answer: |-
  ### Perpetual Trust Simulation: Geometric vs. Arithmetic Rationality  
  **Design Goal:** Students experience the tension between arithmetic (short-term expected value) and geometric (long-term capital preservation) reasoning through managing a trust across generations. The climax is a hidden "catastrophe" round that wipes out overbettors seduced by early streaks.

  ---

  ### **Setup**  
  **Participants:**  
  - 12 students → 6 pairs.  
  - **Trustee (1 per pair):** Decides betting fraction (0-100%) of the trust's capital each round.  
  - **Auditor (1 per pair):** Records trustee’s reasoning and outcomes but *cannot intervene*.  

  **Materials:**  
  - **Coin:** Biased 60% Heads / 40% Tails (use a marked coin or app).  
  - **Public Flip Tracker:** Whiteboard showing flip history (e.g., "H, T, H...").  
  - **Auditor Sheets:**  
    | Round | Start Capital | Bet Fraction | Bet On | Outcome | End Capital | Trustee’s Reasoning |  
  - **Capital Display:** Whiteboard showing all trusts’ running capital after each round (anonymized as "Trust 1, Trust 2...").  
  - **Prize:** A shared reward (e.g., specialty coffee for the class) if ≥1 trust survives all rounds.  

  **Starting Conditions:**  
  - Each trust begins with **100 points**.  
  - Ruin condition: If capital **falls below 10 points**, the trust is dissolved (fiduciary failure).  

  ---

  ### **Rules**  
  1. **Betting:**  
     - Each round, trustees secretly choose a fraction (10% increments: 0%, 10%, ..., 100%) of their *current capital* to bet **on Heads** (the 60% favorable outcome).  
     - Reasoning must be whispered to the auditor (e.g., "We’re up 50%, let’s push!" or "Preserve capital after last loss").  

  2. **Flip & Update:**  
     - Instructor flips the coin **publicly** and announces the outcome.  
     - **Win (Heads):** Capital = Capital × (1 + fraction)  
     - **Loss (Tails):** Capital = Capital × (1 - fraction)  
     - Auditors update sheets; trustees announce new capital (rounded to whole numbers).  

  3. **Catastrophe Round:**  
     - **Round 6** is a predetermined **TAILS** (hidden until revealed), simulating a rare crisis.  
     - Pre-rounds 1-5 include a streak of **3 HEADS** (rounds 2-4) to tempt overbetting.  

  4. **Survival:**  
     - Trusts surviving with ≥10 points after Round 10 "fulfill their duty."  
     - Collective prize awarded if ≥1 trust survives.  

  ---

  ### **Timeline (90 Min Total)**  
  | Phase          | Time  | Activity |  
  |----------------|-------|----------|  
  | **Intro**      | 5 min | Explain roles, rules, and fiduciary duty ("Your trust must feed generations"). *Do NOT mention Kelly or math concepts.* |  
  | **Pair-Up**    | 3 min | Assign trustee/auditor roles. Distribute sheets. |  
  | **Rounds 1-5** | 25 min | **Flips:** H (R1), H (R2), H (R3), H (R4), T (R5).<br>- *Public streak display builds hype.*<br>- Auditors record reasoning (e.g., "Bet 80% since we won 3x!"). |  
  | **Round 6**    | 5 min  | **Catastrophe:** Reveal TAILS. Trusts with >50% bets implode (e.g., 100% bet → ruin). |  
  | **Rounds 7-10**| 15 min | Flips: H (R7), T (R8), H (R9), H (R10). Surviving trusts rebuild. |  
  | **Debrief**    | 30 min | Guided discussion (below). |  

  ---

  ### **Predicted Pain Points**  
  - **Streak Seduction:** Early wins (rounds 2-4 HEADS) pressure trustees to overbet ("Trust 3 doubled—we’re falling behind!").  
  - **Round 5 Panic:** A "mild" tails (R5) lulls some into false security ("We survived 50%—let’s go higher!").  
  - **Catastrophe Wipeout:** Round 6 tails ruins >50% bettors. Auditor sheets show reasoning shifted from "grow" to "recover" post-R5.  
  - **Social Dynamics:** Auditors may gasp or frown as trustees bet aggressively, creating peer pressure.  

  ---

  ### **Debrief: Linking Experience to Theory**  
  1. **Map Moments to Concepts:**  
     - **Early Wins (Rounds 2-4):** "Why did many increase bets?" → *Arithmetic intuition*: Maximizing expected value per round (EV = 0.6×[1+f] + 0.4×[1-f] = 1 + 0.2f) favors high *f*.  
     - **Near-Ruin (Round 5):** "Who felt their duty to future generations here?" → *Geometric prioritizes survival*: Growth rate = 𝑝⋅ln(1+𝑓) + (1−𝑝)⋅ln(1−𝑓) peaks at Kelly fraction (𝑓* = 0.6 - 0.4 = 0.2).  
     - **Catastrophe (Round 6):** "Why did 50%+ bets fail?" → *Volatility drag*: High 𝑓 amplifies losses; geometric mean < arithmetic mean.  
     - **Auditor’s Silent Record:** Show sheets → Reasoning shifts reveal *time inconsistency* (short-term greed vs. perpetual duty).  

  2. **Limitation of Activity:**  
     - **Finite Rounds vs. Infinite Horizon:** The simulation cannot replicate perpetual compounding. *Verbally emphasize*: "Geometric rationality assumes indefinite time—one crisis *will* come. Your duty is to ensure the trust survives it."  

  3. **Key Insight:**  
     - Arithmetic maximizes expected wealth *now*; geometric maximizes survival *across generations*. Kelly betting (𝑓*) balances growth and ruin risk.  

  ---

  **Summary:** Trustees bet fractions of compounding capital across generations, with public streaks tempting arithmetic overbets until a hidden catastrophe round forces a visceral reckoning with geometric survival.
