prompt: |-
  In my free will seminar a classmate ran this on me and I still can't find the step I actually want to reject, so here it is. (1) You're morally responsible for something you do only if you're in some real sense its ultimate source -- only if the explanation of the action doesn't run entirely through stuff that was settled before you existed. (2) What you do flows from the way you are: your character, priorities, deliberative habits. (3) The way you are is either the product of things you didn't choose (genes, upbringing, dumb luck) or of earlier choices you did make. (4) But those earlier choices flowed from the way you were *then*, so appealing to them just pushes the same question back a step. (5) Any finite chain like that bottoms out in how you were before you were in a position to choose anything at all. (6) So no one is ever the ultimate source of anything they do, and full-blooded moral responsibility is impossible for anyone. (7) And here's where it seems to prove too much: the exact same reasoning goes through for belief, since your beliefs flow from your cognitive habits and your evidence, which you didn't ultimately choose either -- so by (6)'s logic nobody is ever epistemically responsible for anything they beleive, including this argument, and there's no such thing as being at fault for sloppy reasoning. (8) But an argument whose conclusion entails that nobody can be rationally credited for being persuaded by it seems to defeat itself, so (1) must be false. He says this is a reductio of ultimate-source requirements generally. Something feels off in the move from (6) to (7) to me, but I also can't say moral responsibility and epistemic responsibility work differently without it sounding ad hoc. Which step do you reject, why did that step look fine in the first place, and what does rejecting it cost -- like, what do Frankfurt-style or reasons-responsive compatibilists give up to deny it, and what do incompatibilists have to swallow if they just accept (7)? Please answer in continuous prose, like an email -- no headings, no bullet points, no bold, no tables.
