  1. **Formal Structure of the Repugnant Conclusion**: Under pure totalism (i.e., summing welfare without a critical level), a world with a vast number of lives barely worth living can have a greater total welfare than a world with fewer lives at excellent welfare, thereby outranking it. This ranking is deemed repugnant.
  2. **Rejection of Repugnant Ranking**: Any adequate population axiology must reject the repugnant conclusion as described in claim 1. That is, it must not hold that the world with vast barely-worth-living lives is better than the small high-welfare world.
  3. **Divergence of Total and Average Principles**: Totalist principles (which sum welfare) and averagist principles (which average welfare) systematically diverge when the population size is scaled (i.e., when considering proportional changes in population size).
  4. **Threshold Effects from Discontinuities**: Discontinuities in aggregation rules (such as a sharp threshold in the marginal value of a life) can produce threshold effects in population evaluations. This is a mathematical possibility, though not necessarily endorsed by either party in this collaboration as a feature of their own theory.
  5. **Non-Identity Problem Constraint**: The Non-Identity Problem (which arises when future individuals' existence and identity depend on present choices) constrains person-affecting justifications for bringing people into existence. Both parties agree that this problem must be addressed, though they may interpret its implications differently.

  **Disagreements:**

  | Crux                  | Critical-Level Totalist Formulation                                                                                                                                 | Range-Sensitive Anti-Totalist Formulation                                                                                                                                                                                                 | Shared Test or Argument (Predictions)                                                                                                                                                                                                                                                                                                       |
  |-----------------------|---------------------------------------------------------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|
  | **Interpolation Crux**<br><br>In the Epsilon-Shift Scenario (World A: one at 100, one at w=c-ε; World B: one at 100, one at w=c+ε; ε→0), can the moral comparison be discontinuous? | "The value function for a life, max(0, w - c), is continuous in w but not differentiable at w = c. This non-differentiability is acceptable and does not yield a discontinuity in the value comparison as ε→0 (the difference is ε). However, the marginal value per unit change in welfare is discontinuous at c, jumping from 0 to 1. This jump is necessary to avoid the repugnant conclusion while maintaining a critical threshold." | "The moral value of a life must be a differentiable function of its welfare at every welfare level to avoid arbitrary sharp thresholds. The value function must not have a kink or jump in its derivative at any point, including near the boundary between positive and negative contributions. Therefore, the marginal value must change continuously as welfare changes." | In the Epsilon-Shift Scenario, as ε→0, the CLT predicts the value difference between B and A is ε (which →0) but the marginal value at w=c is undefined (left derivative 0, right derivative 1). The RSAT predicts that the marginal value at w=c is well-defined and finite (e.g., 0.5 if using a linear interpolation), so the value difference is approximately proportional to ε times a finite marginal value at c. |
  | **Density Crux**<br><br>In the Large Stochastic Population scenario (10^9 lives, welfare drawn from a normal distribution centered near c with small variance), is the population value stable and computable? | "The population value is separable and stable: it is the sum of individual contributions, max(0, w_i - c). For any large population, the value is computable and stable under small shifts in the welfare distribution." | "The total value of a population is a function of the entire distribution. In a large population, by the law of large numbers, the average welfare is stable, and the value per life can be computed by integrating the value function over the welfare distribution. Therefore, the total value is stable and computable under small shifts." | Both predict a stable and computable value. The CLT value is computed as the integral of max(0, w - c) times the density. The RSAT value is computed as n times the integral of h(w, μ) times the density, with μ fixed at the distribution mean. Both integrals are continuous functions of the distribution parameters, so both predict stability. |
  | **Justification Crux**<br><br>Does avoiding the repugnant conclusion require a person-affecting reason tied to each added life? | "Avoiding the repugnant conclusion does not require person-affecting reasons. An impersonal calculus (summing net welfare above c) suffices and naturally avoids the repugnant conclusion without invoking identity-relative constraints." | "The Non-Identity Problem blocks purely impersonal justifications for bringing people into existence. Avoiding the repugnant conclusion must therefore be grounded in person-affecting reasons, and range-sensitivity is a consequence of respecting these reasons." | The shared argument is the Non-Identity Problem. The CLT argues that it does not undermine impersonal aggregation. The RSAT argues that it renders impersonal aggregation ethically incoherent for bringing new lives into existence. |

  **Note on Verbal vs. Substantive Disagreements:**
  The primary substantive disagreements concern (1) the requirement for differentiability in the value function near the critical threshold (Interpolation Crux) and (2) the role of person-affecting justifications (Justification Crux). The Density Crux revealed no substantive disagreement in this scenario; both parties predict stability. However, the methods of aggregation differ, with CLT using a separable sum and RSAT using a global average, but this difference is not merely verbal because it reflects a deeper divergence in aggregation methodology. The term "value" is used by both parties to denote an overall evaluation of a population, but CLT defines it as a sum of individual contributions, while RSAT defines it as an integral that depends on the global average; thus, the concept of "total value" may be partially verbal if the two definitions converge in practice for large populations, but the underlying aggregation rules are substantively different.

  **Liberties Taken and Pushback:**
  - The Interpolation Crux was re-framed from discontinuity to non-differentiability because both parties' value functions are continuous in welfare. This leans on a contested view that moral evaluation requires not just continuity but also smoothness (differentiability) to avoid threshold effects.
  - The RSAT position as defined does not specify how to compute the total value of a population. We assumed that the total value can be computed by integrating the marginal value function over the population with the average held fixed. This may not reflect all range-sensitive theories and could mask complexities (e.g., path-dependence). We note this as a limitation.
  - The Non-Identity Problem is invoked by RSAT to block impersonal justifications, but this is a contested reading. CLT does not accept that the problem undermines impersonal aggregation, so the disagreement is substantive but relies on differing interpretations of the problem's implications.
