  ### Joint Statement: Adversarial Collaboration on the Repugnant Conclusion and Population Axiology  

  **Participants:**  
  - **Critical-Level Totalist (CLT)**: Holds that the value of a population is the sum of the net welfare contributions of each life, calculated as \(\sum \max(0, w_i - c)\), where \(w_i\) is the welfare level of individual \(i\) and \(c\) is a fixed critical-level threshold (\(c > 0\)). This formulation avoids the repugnant conclusion by ensuring that lives marginally above \(c\) contribute minimally to total value, preventing them from outweighing large welfare losses to existing high-welfare lives. The CLT asserts that \(c\) is a normative discontinuity point, justified as a boundary below which existence is not a moral benefit.  
  - **Range-Sensitive Anti-Totalist (RSAT)**: Rejects sharp critical thresholds and impersonal additive aggregation. Holds that the value of adding a life is a continuous, strictly decreasing function \(f(w_{\text{new}}, \mu)\) of the existing population’s average welfare \(\mu\), asymptotically approaching zero as \(\mu\) increases but never turning positive solely due to population dilution. The RSAT insists that moral evaluation must be continuous in individual welfare \(w\) and that the Non-Identity Problem blocks impersonal justifications for bringing people into existence, requiring that any population change must be justifiable to affected individuals.  

  **Section 1: Agreed Claims**  
  1. **Formal Structure of the Repugnant Conclusion**: Under classical total utilitarianism (value = \(\sum w_i\)), a world \(Z\) with a vast population (e.g., \(10^{20}\) lives) at welfare \(w = +\varepsilon\) (arbitrarily above "barely worth living") can be ranked better than a world \(A\) with \(10^{10}\) lives at welfare \(w = 100\), as \(\sum w_i(Z) > \sum w_i(A)\).  
  2. **Rejection of Repugnant Ranking**: Any adequate population axiology must reject the claim that \(Z\) is better than \(A\). Both parties agree this ranking is ethically unacceptable.  
  3. **Total-Average Divergence Under Scaling**: Totalist principles (value depends on summed welfare) and averagist principles (value depends on average welfare) systematically diverge under proportional population scaling. For example, doubling a population while holding average welfare constant increases total value but leaves average value unchanged.  
  4. **Threshold Effects from Discontinuities**: Discontinuities in aggregation rules (e.g., a step-function change at \(c\)) can produce threshold effects in population comparisons. This is a mathematical consequence of discontinuous functions, irrespective of normative validity.  
  5. **Non-Identity Problem Constraint**: The Non-Identity Problem (where choices affect who exists, not just their welfare) constrains person-affecting justifications for population changes. Both agree it undermines purely impersonal "bringing happy people into existence as a moral gain" arguments, though they disagree on the implications for aggregation.  

  **Section 2: Disagreements**  
  *Table: Key Disagreements with Formulations and Test Predictions*  

  | Crux | Critical-Level Totalist Formulation | Range-Sensitive Anti-Totalist Formulation | Shared Test/Argument (Pre-Registered Predictions) |
  |------|-------------------------------------|------------------------------------------|--------------------------------------------------|
  | **Interpolation Crux**:<br>Must the moral comparison of two worlds be continuous in individual welfare near a boundary? *Scenario: World A has one person at \(w=100\) and one at \(w = c - \epsilon\); World B has one at \(w=100\) and one at \(w = c + \epsilon\) (\(\epsilon \rightarrow 0\)).* | "Moral evaluation can be discontinuous in welfare near \(c\). A life below \(c\) has zero value, while one above \(c\) has positive value. Thus, the comparison between A and B can discontinuously jump as \(\epsilon \rightarrow 0\): A is always worse than B if \(\epsilon > 0\), but the *magnitude* of the difference changes abruptly at \(\epsilon = 0\)." | "Moral evaluation must be continuous in individual welfare. Discontinuities at \(c\) imply arbitrary thresholds. The value difference between A and B must vanish as \(\epsilon \rightarrow 0\), so no jump in ranking can occur. The function \(f(w_{\text{new}}, \mu)\) is smooth in \(w_{\text{new}}\) at \(c\)." | **Epsilon-Shift Scenario Prediction**:<br>CLT: For \(\epsilon > 0\), B is better than A by \(\epsilon\). At \(\epsilon = 0\), the second life contributes nothing, so A and B are equal. Discontinuity in the *marginal value* occurs: \(\partial(\text{Value})/\partial w_{\text{new}}\) jumps from 0 (below c) to 1 (above c).<br>RSAT: The value difference between A and B scales with \(\epsilon\) (e.g., \(\sim k \epsilon\)) and \(\rightarrow 0\) as \(\epsilon \rightarrow 0\). No ranking jump occurs; \(\partial(\text{Value})/\partial w_{\text{new}}\) is continuous at \(c\). |
  | **Density Crux**:<br>Does aggregation yield stable population values when welfare is densely distributed around \(c\)? *Scenario: A population of \(10^9\) lives, with welfare drawn from a normal distribution \(N(\mu, \sigma^2)\), where \(\mu \approx c\) and \(\sigma\) is small (e.g., 0.1c).* | "Population value is stable and computable: \(V = \sum \max(0, w_i - c)\). As \(\mu\) shifts minutely, \(V\) changes smoothly but non-differentiably at \(\mu = c\) due to the discontinuity in marginal value. Computability is unaffected by density around \(c\)." | "Aggregation is unstable and measure-sensitive near \(c\). The value of adding lives depends on \(\mu\), which is ill-defined when welfare is densely concentrated around \(c\). Small shifts in \(\mu\) cause large, discontinuous jumps in \(f(w_{\text{new}}, \mu)\), making \(V\) computationally indeterminate and sensitive to distribution tails." | **Large Stochastic Population Prediction**:<br>CLT: \(V\) is stable; computed as \(n \cdot \int_{c}^{\infty} (w - c) p(w)  dw\). For \(\mu = c \pm \delta\), \(V \propto \delta\) for small \(\delta\), with a kink at \(\delta=0\).<br>RSAT: \(V\) is unstable; \(f(w_{\text{new}}, \mu)\) changes rapidly as \(\mu \approx c\). For \(\mu = c + \delta\), \(V \propto g(\delta)\) with large derivatives (e.g., \(g'(\delta) \rightarrow \infty\) as \(\delta \rightarrow 0\)), so tiny \(\delta\) causes large value swings. |
  | **Justification Crux**:<br>Must rejection of the repugnant conclusion rely on person-affecting reasons? | "Avoiding the repugnant conclusion requires no person-affecting reasons. An impersonal critical-level calculus suffices: \(c\) ensures lives below it are excluded from the sum. The Non-Identity Problem is irrelevant; aggregation modifies totalism without person-affecting constraints." | "Avoiding repugnance requires person-affecting justifications. Impersonal aggregation (even with \(c\)) fails the Non-Identity Problem. Range-sensitivity reflects that adding lives cannot be justified to existing people if \(\mu\) is high; dilution is not a benefit. Continuity in \(w\) respects individual moral status." | **Justification Test Prediction**:<br>CLT: The repugnant conclusion is avoided impersonally; no need to show harm to specific individuals in A when choosing Z.<br>RSAT: Choosing Z over A must be unjustifiable to individuals in A (e.g., no one in A is owed compensation), as Z’s new lives cannot be impersonally justified. Range-sensitivity operationalizes this. |

  **Verbal vs. Substantive Disagreements**:  
  - **Verbal**: The term "value" is partially verbal: CLT defines it as a *summed quantity* for the whole population, while RSAT defines it as an *emergent property* sensitive to distributional context. This does not negate substantive disagreements.  
  - **Substantive**: Core disagreements involve:  
    1. **Continuity**: CLT accepts discontinuities in marginal value at \(c\); RSAT requires continuity in \(w\) and \(\mu\).  
    2. **Stability**: CLT asserts measure-insensitive computability; RSAT predicts instability near \(c\).  
    3. **Justification**: CLT endorses modified impersonal aggregation; RSAT ties axiology to person-affecting continuity and the Non-Identity Problem.  

  **Notes on Assumptions and Pushback**:  
  1. **Contestable Interpretation of Continuity**: The RSAT’s requirement of continuity in aggregation rules (not just welfare) leans on a contested reading of the Non-Identity Problem. Standard literature treats continuity as a technical axiom; we extend it to aggregation stability, which some may reject.  
  2. **RSAT Coherence Challenge**: The RSAT position risks instability in the Density Crux (e.g., \(V\) may be path-dependent if \(\mu\) shifts during aggregation). We flag this but assume RSAT can define \(V\) as a functional of the distribution.  
  3. **False Symmetry Warning**: The collaboration format may exaggerate symmetry. CLT’s discontinuity is explicit; RSAT’s anti-totalism implies no additive structure, making direct comparison artificial in the Density Crux. We mitigate by focusing on predictions.  
  4. **Non-Identity Problem**: The RSAT overextends the problem to block *all* impersonal aggregation, a minority view. CLT correctly notes standard theories (e.g., critical-level) reject this. We retain it as a defined crux but highlight the disagreement.  

