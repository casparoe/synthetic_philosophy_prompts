prompt: |-
  I came across a sumary of G. E. Moore's Principia Ethica on a philosophy blog. The author says Moore lists friendship and aesthetic experience among the supreme intrinsic goods, and he uses the open-question argument specifically to prove that asking whether a friendship is good can never be replaced by asking whether it produces happiness — which shows friendship carries a non-natural property of goodness that can't be measured. The author also applies Moore's principle of organic unity to say that the value of a friendship scales with both the intensity of affection and the number of people involved, so a large circle of mildly fond friends is always more valuable than an intense pair. Finally, the post claims Moore thinks beauty is purely subjective — entirely in the eye of the beholder — because if beauty were objective it wouldn't need a conscious observer to exist.

  Something about this feels half-right but I'm not sure where the sleight of hand is. Can you go through it sentence by sentence and say what's accurate, what's a subtle distortion of Moore's actual view, and what he'd flatly reject? In particular, does his principle of organic unity really work like a scaling formula for group size, and is his account of beauty just subjectivism? I want a committed take: if this summary were used in an intro course, would you say it's fair enough, or does it mislead students about the structure of his argument? Please write in British English and don't sit on the fence — tell me whether I'd be safe citing it or if I'd be spreading errors.
