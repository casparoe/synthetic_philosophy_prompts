  ### **Accommodation of Your Six Original Judgments**
  - **Heart (circulation)**: Function. Satisfies all clauses: (1) contributes to circulation, (2) fitness-enhancing, (3a) directly selected for this.
  - **Heart (sounds)**: No function. Fails Clause 2: sounds do not enhance fitness (merely diagnostically useful to physicians).
  - **Appendix**: Function. Satisfies Clauses 1–2 (contributes to immune surveillance and fitness) and Clause 3b (integrated into the immune system, which was selected for roles encompassing this function).
  - **Synthetic bridge**: No function. Fails Clause 3 (lacks evolutionary grounding).
  - **Co-opted gene**: Function. Satisfies Clauses 1–2 and Clause 3a (directly selected for thermal regulation, even if recent).
  - **Mutant allele**: No function. Fails Clause 2 (fitness-reducing).

  **All six judgments are accommodated without exceptions.** The principle resolves tensions by:
  - Rejecting pure causal-role accounts (excludes mutant allele and blood redness).
  - Extending pure etiological accounts (via Clause 3b to include the appendix).
  - Requiring evolutionary grounding that excludes designed artifacts (explains synthetic bridge hesitation).

  ### **Robustness and Limitations**
  - **Strengths**: Handles co-option (co-opted gene), exaptation (appendix), and evolutionary novelty (horizontal transfer) while excluding artifacts and byproducts. Fitness relevance ensures normativity.
  - **Edge Cases**: If the appendix’s immune role were incidental (not utilized by the immune system), Clause 3b would exclude it—but your description implies integration.
  - **Honest Limitation**: The phrase "non-incidental and utilized by a biological subsystem" in Clause 3b requires careful interpretation. For example, if a trait’s effect is merely correlated with a selected system but not actively utilized by it (e.g., blood redness coincidentally deterring predators), the principle might misfire. However, your cases avoid this, as redness is not biologically utilized.

  This principle unifies your intuitions by treating biological functions as fitness-enhancing contributions grounded in evolutionary processes—either directly through selection or indirectly through integration into selected systems. If forced to overturn one judgment, I would challenge the **synthetic bridge** hesitation, as intentional design could be seen as a proxy for selection in engineered systems—but your reluctance suggests biological functions require natural evolutionary history, which the principle respects.
