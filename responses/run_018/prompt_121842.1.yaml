answer: |-
  This is a brilliantly observed and precisely articulated critique—a genuine "Schopenhauerian interpretive aporia." While no single *universally established* term exists for this specific failure mode (the literature tends to describe it rather than name it), we can define and name it based on your analysis:

  ### Proposed Term: **Phenomenal Substitution**

  ### Definition
  Phenomenal Substitution is the interpretive error within Schopenhauerian music aesthetics where:
  1.  **The Metaphysical Frame is Retained:** The interpreter correctly affirms Schopenhauer’s core claim that music is a *direct, non-representational* objectification of the Will itself, bypassing Plato’s Ideas and the world of representation.
  2.  **Representational Content is Illicitly Inserted:** The interpreter then identifies the *specific content* or *meaning* of music with phenomenal, subjective emotional states (e.g., longing, joy, tension, melancholy).
  3.  **The Contradiction is Overlooked:** This creates an internal contradiction within Schopenhauer’s system because these emotional states are, by his definition, representations (*Vorstellungen*) – they are the Will *as it appears* to the subject within the principium individuationis, not the Will-in-itself. Music is thus surreptitiously reduced to a representational art form depicting emotions, directly contradicting its claimed metaphysical uniqueness.

  ### Boundary Conditions & Distinctions

  1.  **Distinction from Generic Psychologizing or Misreading:**
      *   **Phenomenal Substitution:** *Requires* the initial acceptance and affirmation of Schopenhauer’s metaphysical distinction between the Will (noumenon) and Representation (phenomenon), and specifically his claim for music's *direct* relation to the Will. The error occurs *within* this framework by filling the "direct manifestation" slot with phenomenal content. The interpreter *believes* they are engaging faithfully with the metaphysics but undermines it structurally.
      *   **Generic Misreading/Psychologizing:** Involves *ignoring or rejecting* Schopenhauer’s core metaphysical distinction altogether. The interpreter might simply treat music as "expressing emotions" without any reference to, or concern for, the Will/Representation dichotomy. They operate outside or dismissive of Schopenhauer's specific philosophical framework. This is a simpler error, not requiring the sophisticated retention of the frame before subverting it.

  2.  **Distinction from Legitimate Analogical Use:**
      *   **Phenomenal Substitution:** Claims that the emotional descriptions *are the actual, direct content* of the music *as Will*, or are the *literal meaning* conveyed by the musical form. It conflates the phenomenal description with the noumenal reality.
      *   **Legitimate Analogy:** Uses emotional (or other phenomenal) language *heuristically* or *metaphorically* to *point towards* or *illustrate* the *effect* the direct manifestation of the Will has *on the listener* within the phenomenal world. The analogy acknowledges:
          *   The phenomenal experience (emotion) is an *effect* of encountering the noumenal through music, not its *content*.
          *   The analogy is imperfect and limited, a concession to communication for those "without metaphysical training." It explicitly says, "It's *as if* we feel longing, but this feeling is our phenomenal *response* to encountering the Will's striving directly."
          *   The core claim of music's non-representational, direct relation to the Will remains intact, and the analogy doesn't replace that claim but attempts to describe its experiential impact.

  ### Why "Phenomenal Substitution" Works
  *   **Phenomenal:** Directly references the realm of representations, appearances, individual consciousness, and emotions within Schopenhauer’s system – the realm music is supposed to transcend.
  *   **Substitution:** Accurately describes the act of replacing the intended noumenal content (the Will-in-itself) with phenomenal content (emotions), while keeping the metaphysical "label" (direct manifestation of the Will).
  *   **Precision:** It highlights the specific *nature* of the substituted material (phenomenal) and the *act* of substitution within the retained metaphysical frame.

  ### The Core Mechanism of the Error
  The error stems from a fundamental **category mistake** applied *within* Schopenhauer’s ontology. The interpreter correctly identifies music's unique category ("direct copy of the Will") but then populates that category with entities (emotions) that belong to an entirely different and incompatible category ("representations"). It's an attempt to grasp the non-conceptual through concepts inherently tied to representation, thereby collapsing the distinction they sought to uphold. It often arises from the understandable but misguided impulse to provide a tangible, experiential "content" for the abstract metaphysical claim, falling back on the most immediate subjective response to music – emotion.

  "Phenomenal Substitution" thus names this specific, structurally contradictory move prevalent in interpretations of Schopenhauer's philosophy of music.
