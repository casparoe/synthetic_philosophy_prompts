answer: |-
  Here’s a distilled specification of desiderata for a theory of diachronic medical authority, balancing conceptual rigor, practical cases, and meta-ethical constraints:

  ---

  ### **Core Cases to Resolve**
  1. **Gradual Dementia**: Past competent self (P) forbids antibiotics for pneumonia; current demented self (C) resists death but cannot grasp the choice.  
     *Must:* Explain whether P’s directive binds when C experiences basic well-being.  
  2. **Sudden Injury**: P (after researching locked-in syndrome) refuses ventilation; C (now locked-in) signals a desire to live via eye movements.  
     *Must:* Address whether C’s new preferences override P’s anticipatory refusal.  
  3. **“Happy” with Revoked Directive**: P refuses feeding tubes; C (post-stroke, cognitively impaired) smiles while tube-fed.  
     *Must:* Determine if C’s apparent contentment nullifies P’s directive.  
  4. **Genuine Value Shift**: P (devout) refuses blood transfusion; C (after conversion to atheism) requests transfusion.  
     *Must:* Differentiate this from temporary incapacity (e.g., delirium).  

  ---

  ### **Non-Collapsible Distinctions**  
  **Non-Negotiable:**  
  - **Authority vs. Prediction**: P’s *normative authority* ("this is my value") ≠ P’s *predictive accuracy* ("I’ll never want this").  
  - **Legal Bindingness vs. Moral Weight**: A directive may be legally valid but morally overridden (or vice versa).  
  - **Partial vs. Total Value Change**: Mild drift (P disliked dependency → C tolerates it) vs. radical shift (P valued survival → C values dignity-over-life).  

  **Negotiable (Often Ideological)**:  
  - *Epistemic Privilege*: Whether P’s competence inherently grants superior insight into C’s interests.  
  - *Identity Continuity*: Whether psychological connectedness defines "same person" (Parfit-style).  

  ---

  ### **Constraints from Preference Revision**  
  **Non-Negotiable:**  
  - **Misestimation of Future Preferences**: People systematically underestimate adaptability to disability (e.g., "I’d rather die than use a wheelchair").  
  - **Affective Forecasting Errors**: P’s directive may reflect fear uncalibrated to C’s actual lived experience.  
  - **Non-Rational Preference Shifts**: Values change via trauma, neurobiology, or persuasion—not always for "better reasons."  

  ---

  ### **The Symmetry Problem**  
  - **The Challenge**: If P’s authority rests on epistemic priority about "what matters," then P should veto *all* of C’s non-medical deviations (e.g., career shifts, divorce).  
  - **Resolution Options**:  
    - **Bite the Bullet**: Accept radical paternalism (past selves veto present choices). *Untenable for most*.  
    - **Constrain Scope**: Limit P’s authority to *medical contexts* where C’s capacity is impaired. *Requires principled distinction*.  
    - **Reject Epistemic Priority**: Base authority on consent-at-t1, not knowledge superiority. *Risk: ignores C’s new capacities*.  
    **Verdict**: *Breaks the theory unless scope-limited*—otherwise implies universal past-self autocracy.  

  ---

  ### **Scoring Precedent Autonomy (PA) vs. Present Best Interest (PBI)**  
  | **Criterion**               | **Precedent Autonomy**                     | **Present Best Interest**            |  
  |-----------------------------|--------------------------------------------|--------------------------------------|  
  | **Sudden Injury (Locked-in)** | Binds: Respects P’s explicit choice.       | Overrides: C’s current will matters. |  
  | **"Happy" with Tubes**       | Binds: Ignores C’s contentment as non-autonomous. | Overrides: Well-being trumps past directive. |  
  | **Genuine Value Shift**      | Fails: Enforces values C repudiates.       | Wins: Honors C’s actual values.      |  
  | **Gradual Dementia**         | Strong: P’s identity seen as "true self."  | Weak: C’s well-being is observable.  |  
  | **Handling Forecasting Errors** | Poor: Ignores P’s possible misprediction.  | Good: Adapts to C’s reality.         |  
  | **Symmetry Problem**         | Vulnerable: Medical/non-medical line blurry. | Neutral: Focuses on current welfare. |  

  ---

  ### **Non-Negotiables Summary**  
  A theory **must**:  
  1. Distinguish *authority* from *prediction*.  
  2. Acknowledge forecasting errors without voiding all directives.  
  3. Handle total vs. partial value shifts differently.  
  4. Explain why medical contexts differ from non-medical paternalism (or accept symmetry’s radicalism).  
  5. Respect that preference revision isn’t always rational or "progress."  

  **Negotiables**: Weight given to psychological continuity, whether well-being is objective, and the moral status of precedent consent.  

  **Conclusion**: No extant theory fully satisfies all desiderata. PA excels in sudden incapacity but fails adaptive preferences; PBI handles dynamic welfare but risks epistemic arrogance. The symmetry problem demands a scope restriction *grounded in capacity*, not just intuition—or forces us to reject diachronic authority entirely.
