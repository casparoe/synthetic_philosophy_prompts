answer: |-
  Below is a philosophical specification of desiderata for a theory of moral revolution, tailored to your historical narrative needs. It prioritizes phenomena to explain, mechanistic clarity, and your constraints (slavery vs. dueling, wardrobe problem), while categorizing requirements for robustness.

  ---

  ### **Core Desiderata for a Theory of Moral Revolution**  
  *(Non-negotiables in bold; ✦ denotes camp preferences)*

  1. **Explain Asymmetric Tempo**  
     - **Phenomena**: Rapid normative collapse (e.g., dueling’s near-overnight disappearance among elites post-1830s) vs. slow institutional erosion (e.g., slavery’s protracted abolition across colonies).  
     - **Motivating Case**: Dueling vanished in <50 years in Europe after centuries of acceptance; slavery required mass movements, economic shifts, and wars despite earlier philosophical rejection.  
     - **Constraint**: Must account for *speed* without relying solely on material interest (slavery was profitable but slow; dueling unprofitable but rapid).

  2. **Explain Public/Private Dissonance**  
     - **Phenomena**: Persistence of banned practices in private (e.g., covert dueling; post-abolition clandestine slavery via debt peonage).  
     - **Motivating Case**: Dueling continued underground despite legal bans; slavery persisted in disguised forms after Emancipation.  
     - **Constraint**: Theory must distinguish between *public norm enforcement* and *private belief retention*.

  3. **Elite/Mass Adoption Divergence**  
     - **Phenomena**: Moral entrepreneurs (e.g., abolitionist elites) vs. lagged/lukewarm mass adoption (e.g., working-class racism persisting post-abolition).  
     - **Motivating Case**: Wilberforce’s early abolitionism vs. widespread public indifference; dueling rejected by Enlightenment elites but clung to by military subcultures.  
     - **Constraint**: Cannot assume "trickle-down" moral diffusion; must model *cultural friction*.

  4. **Distinguish Causal Mechanisms**  
     - **Mechanisms to Separate**:  
       - **Moral Argument**: Rational persuasion (e.g., Quaker pamphlets against slavery).  
       - **Honor Restructuring** (Appiah): Shifting social meaning (e.g., dueling becoming "cowardly" vs. "honorable").  
       - **Material Interest**: Economic/structural shifts (e.g., industrialization undermining slavery’s profitability).  
     - **Constraint**: Must *avoid conflation*—e.g., honor shifts ≠ economic determinism.

  5. **The Wardrobe Problem** ✦  
     - **Phenomena**: Practices becoming *ridiculous* via symbolic association before ethical condemnation (e.g., wigs, ruffs → powdered duelists as clowns; slavery’s tools as "barbaric relics").  
     - **Motivating Case**: Dueling attire satirized in prints pre-1830; slave chains exhibited as grotesque *after* abolition.  
     - **Constraint**: Theory must allow *aesthetics/ridicule* as primary catalyst, with moral language as *ex post* rationalization.

  6. **Profitability Paradox**  
     - **Constraint**: Explain why highly profitable slavery collapsed alongside non-profitable dueling in the same era.  
     - **Key Test**: Material interest alone fails; must integrate *cultural/material interplay*.

  ---

  ### **Handling Key Thinkers**  
  - **Bernard Williams’ Skepticism**: Place at the "moral argument" mechanism—his doubt that rational syllogisms drive change (*Ethics and the Limits of Philosophy*) explains why philosophy alone rarely suffices.  
  - **Appiah’s Honor Thesis**: Fits "honor restructuring" but must not absorb other mechanisms (e.g., honor shifts in dueling ≠ economic abolitionism).  

  ---

  ### **Desiderata Categorization**  
  | **Type**               | **Desiderata**                                                                 |  
  |------------------------|--------------------------------------------------------------------------------|  
  | **Non-negotiable**     | 1 (Asymmetric Tempo), 2 (Public/Private Dissonance), 4 (Mechanism Distinction) |  
  | **Camp Preferences** ✦ | 5 (Wardrobe Problem), 3 (Elite/Mass Divergence as narrative priority)          |  
  | **Jointly Unsatisfiable** | "Material interest as *sole* driver" vs. "Explaining dueling’s collapse" |  

  ---

  ### **The Eliminator Requirement**  
  **The Profitability Paradox** (Desideratum 6) eliminates the largest share of popular theories:  
  - **Utilitarianism** fails (slavery profitable → should persist; dueling unprofitable → should collapse; opposite occurred).  
  - **Marxist materialism** fails (slavery’s base/superstructure mismatch).  
  - **Pure rationalism** fails (ignores slavery’s economic inertia and dueling’s honor dynamics).  
  - **Surviving theories** must be *hybrid* (e.g., material triggers + cultural contagion + honor shifts).

  ---

  ### **Summary for Your Narrative**  
  Adequate theories must:  
  - **Resist monocausality** (separate argument/honor/interest).  
  - **Embrace dissonance** (slow/fast, public/private, elite/mass).  
  - **Center symbolic decay** (wardrobe problem as aesthetic vanguard).  
  - **Resolve the paradox** of profitability’s irrelevance to moral collapse timing.  

  This framework excludes reductive models, priming your novels for revolutions that feel like weather—unpredictable, systemic, and embodied in costumes and drawing-room whispers.
