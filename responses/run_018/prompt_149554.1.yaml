  Now, the deeper issue is about accessing motivations. Can we ever truly know if Phillips' refusal was about the message or the customers? The user questions whether the preference/bias distinction is discoverable or imposed by the observer's framework. The Court assumed they could discern his intent, but motivations are often opaque. The observer's normative stance might shape how they interpret the refusal. For example, viewing it as artistic autonomy versus discrimination depends on pre-existing values.

