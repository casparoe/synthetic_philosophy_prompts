prompt: |-
  Write the desiderata that a theory of real-pattern recognition must meet in order to justify selecting the physical, design, or intentional stance toward a system, paying special attention to hybrid domains—such as evolved algorithms, synthetic biological circuits, and institutional protocols—where all three stances are available yet yield conflicting predictions. For each requirement, provide the case or conceptual distinction that motivates it (for example, preserving the difference between counterfactual robustness and mere correlation, or blocking the reduction of design explanations to intentional ones), indicate which are non-negotiable and which are camp-specific preferences (such as ontological parsimony versus predictive leverage), and state whether any subset of these desiderata is jointly unsatisfiable in light of standard criticisms of stance-based ontology. Keep the focus on the criteria themselves; you may briefly note how Dennett’s original account stands against the list, but do not provide a bibliography or reading list. Answer in British English.
reasoning: |-
  Okay, the user wants a detailed set of desiderata for a theory of real-pattern recognition that justifies stance selection—physical, design, or intentional—especially in hybrid domains where these stances might conflict. They specifically mentioned evolved algorithms, synthetic biological circuits, and institutional protocols as examples. 

  First, I need to unpack why this is tricky. Hybrid systems like a synthetic biological circuit can be analysed at multiple levels: physically (molecule interactions), teleologically (engineered purpose), or even as if it had intentions (e.g., "optimising efficiency"). But these stances may clash—e.g., intentional descriptions might over-ascribe agency to a gene circuit, while physical descriptions miss its designed function. 

  The user also wants distinctions like counterfactual robustness vs. correlation, and flags about non-negotiable vs. camp-specific criteria. For instance, instrumentalists might prioritise predictive leverage, while realists demand ontological accuracy. And crucially, I must address whether some desiderata are jointly unsatisfiable—like how stance pluralism clashes with Occam’s razor. 

  Dennett’s original stance theory is a reference point, but the focus is critiquing/extending it. His view treats stances as pragmatic tools, but doesn’t resolve conflicts in hybrids. For example, an evolved algorithm (say, ant colony optimisation) might be "intentional-ish" but reducible to physical rules—so when do we privilege one stance? 

  Key desiderata should include: stance coherence (avoiding contradictions), counterfactual discriminators (separating robust patterns from flukes), and domain specificity. Motivating cases help: e.g., institutional protocols (like stock market rules) are designed but rely on human intentions—so conflating design/intentional stances misattributes causality. 

  Non-negotiables: Probably stance coherence and counterfactual grounding. Without these, the theory collapses into "anything goes." Camp-specific splits might include: predictive depth (instrumentalist) vs. ontological economy (realist). 

  And yes—some desiderata conflict. Stance pluralism (valuing all three perspectives) fights reductionism (collapsing everything to physics). Critics like Fodor might say hybrid domains prove stances aren’t real, just heuristic. The theory must navigate this. 

  British English reminders: "prioritise" not "prioritize", "explanatory coherence" over "explanatory unity". Keep examples UK-centric where possible (e.g., "Parliamentary protocols" not "Congressional"). 

  Finally, structure: bullet points risk losing nuance, but the user wants clarity. Group by theme (e.g., epistemic, ontological), then unpack each desideratum with its rationale, negotiability, and conflicts.
answer: |-
  Here are the desiderata for a theory of real-pattern recognition justifying stance selection, particularly for hybrid domains, presented in British English with the requested analysis:

  1.  **Stance Coherence Requirement:**
      *   **Requirement:** The theory must provide criteria to resolve conflicts arising when applying multiple stances to the same system (e.g., a synthetic gene circuit behaving "unintentionally" according to physics but "functionally failing" according to design and "strategically conserving resources" according to intentional stance). It must determine which stance offers the *most coherent explanation* for the observed pattern within a specific context.
      *   **Motivation:** Hybrid cases like institutional protocols (e.g., automated trading algorithms interacting with human traders) where physical noise, design specifications, and attributed intentions (greed, risk-aversion) yield contradictory predictions about system behaviour. Preserves the distinction between levels of abstraction without allowing arbitrary mixing.
      *   **Non-Negotiable:** Yes. Without coherence in explanation or prediction, stance selection is arbitrary.
      *   **Camp-Specific:** The *weight* given to coherence versus predictive success might vary (e.g., realists vs. instrumentalists).

  2.  **Counterfactual Robustness Discriminator:**
      *   **Requirement:** The theory must distinguish patterns robust under relevant counterfactual perturbations (indicating a real, stable pattern) from mere correlational regularities or fragile coincidences. This discriminator must apply differently *within* each stance domain.
      *   **Motivation:** Prevents mistaking spurious physical correlations (e.g., specific thermal noise causing a specific output *once*) for a design function or intentional strategy in an evolved algorithm. Blocks the reduction of design (teleofunctional) explanations to merely reliable physical correlations. Motivates stance selection: the stance under which the pattern exhibits *stronger* counterfactual robustness for the inquiry's purpose is privileged.
      *   **Non-Negotiable:** Core to defining a "real pattern." A pattern that vanishes under the slightest, relevant perturbation isn't robustly real.
      *   **Camp-Specific:** The *scope* of "relevant" counterfactuals might be contested (e.g., how far to push perturbations in an intentional ascription).

  3.  **Domain-Specific Pattern Granularity:**
      *   **Requirement:** The theory must recognise that the "grain" or scale at which a pattern is real can be stance-dependent. It must identify the level(s) of abstraction where patterns exhibit maximal robustness and predictive leverage *for that stance*.
      *   **Motivation:** In synthetic biology, a genetic circuit's *physical* pattern (ion flows) exists at a different granularity than its *design* pattern (logic gate behaviour) or an *intentional* ascription ("trying to maintain homeostasis"). The theory shouldn't force one granularity onto all stances. Justifies selecting the stance whose granularity aligns with the explanatory target.
      *   **Non-Negotiable:** Implicitly required by stance theory. Patterns are abstractions.
      *   **Camp-Specific:** Reductionists might prioritise finding the finest-grained physical pattern, while functionalists accept coarser-grained design patterns as fundamental.

  4.  **Predictive Leverage & Efficiency Criterion:**
      *   **Requirement:** Stance selection must be justified by superior predictive power or explanatory efficiency compared to alternative stances for the specific pattern and context of inquiry. Efficiency includes cognitive/computational tractability.
      *   **Motivation:** Dennett's core rationale. Applying quantum physics to predict chess moves is possible but intractable; the intentional stance is vastly more efficient. In hybrid domains (e.g., analysing an ant colony's foraging as an evolved algorithm), the design stance might offer better predictions about colony resilience than detailed neurology (physical) or complex mind-reading (intentional).
      *   **Non-Negotiable:** For instrumentalist/pragmatic camps, this is paramount.
      *   **Camp-Specific:** Realists might see this as secondary to ontological accuracy.

  5.  **Teleology/Intentionality Grounding Constraint:**
      *   **Requirement:** The theory must provide non-circular criteria for when teleological (design) or intentional patterns are warranted, preventing their promiscuous application. This involves grounding them in either history (selection, design process) or current system complexity/structure, without collapsing design into intentionality.
      *   **Motivation:** Blocks anthropomorphism. Distinguishes a genuinely evolved function (design stance) from a coincidental benefit. Prevents interpreting thermostats as "believing" it's too cold (intentional overreach). In hybrid institutional protocols (e.g., a legal contract), distinguishes the designed purpose (design stance) from the signatories' actual intentions (intentional stance).
      *   **Non-Negotiable:** Yes, to prevent stance inflation and preserve distinctions.
      *   **Camp-Specific:** Definitions of "function" and "intentional system" vary widely (e.g., etiological vs. systemic accounts of function).

  6.  **Ontological Parsimony vs Explanatory Power Balance:**
      *   **Requirement:** The theory must navigate the tension between minimising ontological commitments (favouring reduction to physics where possible) and recognising the indispensable explanatory power of higher-level (design, intentional) patterns.
      *   **Motivation:** Captures the core debate about stances. Is the design stance merely a shorthand for complex physics (parsimony), or does it track genuinely emergent causal properties? In evolved algorithms, is the "algorithm" real or just a description of physics? The theory must justify when higher-level commitments are necessary.
      *   **Non-Negotiable:** The *tension* is inherent and must be addressed.
      *   **Camp-Specific:** This *is* the major camp split: Reductionists prioritise parsimony; Anti-reductionists prioritise explanatory power; Instrumentalists sidestep ontology.

  7.  **Contextual Relativity Acknowledgment:**
      *   **Requirement:** Stance justification must be context-sensitive, depending on the specific pattern under investigation, the questions being asked, and the practical goals of the observer.
      *   **Motivation:** A synthetic biological circuit might be analysed physically for debugging, via design for function, or intentionally (as a proxy for its creators' goals) during ethical review. The "correct" stance shifts with context. A theory demanding one "true" stance regardless of context fails hybrids.
      *   **Non-Negotiable:** For a pragmatic theory, yes. Arguably necessary for handling hybrids.
      *   **Camp-Specific:** Realists may seek context-independent truths, while pragmatists embrace relativity.

  **Dennett's Account vs. the List:** Dennett's original account strongly emphasises (4) Predictive Leverage & Efficiency and (7) Contextual Relativity, framing stances as instrumental tools. It addresses (1) implicitly by prioritising the stance yielding best predictions, but offers less formal criteria for resolving deep conflicts. (2) Counterfactual Robustness is implied in "real patterns" but not systematically developed. (3) Granularity is inherent. (5) Grounding is addressed via evolution for biology and design for artefacts, but intentionality grounding relies heavily on the "intentional systems" definition tied to predictability, which critics find insufficiently restrictive. (6) He explicitly favours instrumentalism, prioritising explanatory power over reductionist parsimony.

  **Joint Unsatisfiability:** A significant tension exists between:
  *   **Strong Stance Pluralism / Explanatory Power:** Insisting that design/intentional patterns are *irreducibly* real and causally potent in hybrids.
  *   **Ontological Parsimony / Reductionism:** Demanding that everything must ultimately be grounded in and explainable by fundamental physics.
  *   **Counterfactual Robustness Universality:** Requiring that the *same* pattern must exhibit robustness under *all* stance counterfactuals to be "real" (an overly strong requirement that likely eliminates higher-level patterns).

  Standard criticisms (e.g., that stances are observer-dependent, not tracking mind-independent joints of nature; that intentionality cannot be grounded non-circularly) highlight that satisfying strong realist interpretations of *all* desiderata simultaneously, especially across conflicting stances in hybrids, might be impossible. A successful theory likely needs to be pragmatic or accept a form of non-reductive pluralism, sacrificing strict ontological parsimony for explanatory adequacy in complex domains.
