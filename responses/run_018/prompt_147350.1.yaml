  The biggest tension might be between Point 1 (anti-external relations) and Point 4 (pro-Russell). But since Russell avoids regress by denying relations need linking, that's consistent. The real issue is between Points 2 and 6: how unity exists without mental synthesis. The cheapest fix is adopting a structuralist view where unity is inherent. Giving up might involve accepting some form of non-mental synthesis, but the user seems against that. 

