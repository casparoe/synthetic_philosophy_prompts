  ### Pragmatist Theories of Truth Diagnostic Decision Tree

  **Root Node (Q1):**  
  Do you hold that truth is *only* a property of beliefs that successfully guide action within experience, with no further requirements (e.g., correspondence to mind-independent reality or ideal coherence)?  
  - **Yes** → Proceed to Q2.  
  - **No** → [Exit: Not within pragmatist theories of truth.]  

  ---

  **Q2 (Convergence):**  
  For any given question, must inquiry eventually converge on a single, universally accepted answer in an ideal long run?  
  - **Yes** → Proceed to Q3.  
  - **No** (truth can remain permanently plural across contexts) → Proceed to Q4.  

  ---

  **Q3 (Verification Scope for Convergence):**  
  Is verification (determining whether a belief "works") restricted to predictive and experimental success (e.g., scientific contexts), or does it equally extend to ethical, aesthetic, and religious domains (where "what works" is domain-relative)?  
  - **Restricted to predictive-experimental success** → Proceed to Q5.  
  - **Extends to ethical, aesthetic, and religious domains** → Proceed to Q5.  

  **Q4 (Verification Scope for Pluralism):**  
  Does verification extend to domains beyond predictive-experimental success (e.g., ethics, aesthetics, religion)?  
  - **No, restricted to predictive-experimental success** → **Leaf 1: [Unoccupied]**  
  - **Yes, extends equally to all domains** → **Leaf 2: Jamesian Radical Pluralism**  

  ---

  **Q5 (Fallibilism):**  
  Can any belief, no matter how well-established, be revised in light of future experience, or are some beliefs permanently settled?  
  - **Universal fallibilism** (all beliefs revisable):  
    - If **restricted** verification (from Q3) → **Leaf 3: Strict Peircean Convergence Pragmatism**  
    - If **extended** verification (from Q3) → **Leaf 4: Hybrid Local-Convergence Position**  
  - **Some beliefs permanently settled**:  
    - If **restricted** verification (from Q3) → **Leaf 5: [Unoccupied]**  
    - If **extended** verification (from Q3) → **Leaf 6: [Unoccupied]**  

  ---

  ### Leaf Descriptions
  1. **[Unoccupied]**:  
     - *Position*: Permanently plural truth + verification restricted to predictive-experimental domains.  
     - *Status*: Logically possible but no major pragmatist theory occupies this combination.  

  2. **Jamesian Radical Pluralism**:  
     - *Position*: Truth is permanently plural (no convergence) + verification extends to all domains + universal fallibilism.  
     - *Note*: Deweyan instrumentalism is indistinguishable here if it holds pluralism and extended verification.  

  3. **Strict Peircean Convergence Pragmatism**:  
     - *Position*: Convergence required + verification restricted to predictive-experimental domains + universal fallibilism.  

  4. **Hybrid Local-Convergence Position**:  
     - *Position*: Convergence required + verification extends to all domains + universal fallibilism.  

  5. **[Unoccupied]**:  
     - *Position*: Convergence required + verification restricted to predictive-experimental domains + some beliefs permanently settled.  
     - *Status*: Logically possible but unoccupied (e.g., convergence + settled empirical truths conflicts with core pragmatism).  

  6. **[Unoccupied]**:  
     - *Position*: Convergence required + verification extends to all domains + some beliefs permanently settled.  
     - *Status*: Logically possible but unoccupied (e.g., convergence + settled ethical/aesthetic truths conflicts with domain-relativity).  

  ---

  ### Key Ambiguities
  - **Deweyan instrumentalism** collapses into **Jamesian Radical Pluralism** (Leaf 2) on these axes, as both reject convergence and extend verification to all domains.  
  - **Hybrid Local-Convergence Position** (Leaf 4) is separable from Peircean pragmatism due to extended verification.  
  - Fallibilism is **universal in pluralism** (Leaf 2) by necessity: permanently settled beliefs conflict with contextual truth.  

  ### Tree Structure Summary
  - **Nodes**: 5 (Q1–Q5).  
  - **Leaves**: 6 (within 7-leaf limit).  
  - **Unoccupied Combinations**: 3 (Leaves 1, 5, 6; Leaf 1 and either 5 or 6 count as the two required).
