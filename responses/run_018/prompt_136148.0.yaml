  The user needs a concrete decision procedure that turns this theoretical distinction into actionable steps for evaluating proposals. They want it structured as ordered questions with clear pass/fail criteria, stop points, and hand-offs to policy teams. The procedure must distinguish three prediction failure modes: sensitive dependence on initial conditions (chaos), parameter ignorance (uncertainty in model inputs), and structural bifurcation (system-changing thresholds). Crucially, it must be usable by engineers without philosophy backgrounds.

  They also want two test cases analyzed: 
  1) Funding a 50-year river-flow forecasting system for dam siting 
  2) Funding modular flood barriers with no forecast dependency 
  ...with one outcome deliberately counterintuitive to engineers to demonstrate rigor.

  Additionally, they require honesty about where the procedure misfires (especially near unmapped bifurcations) and which steps are actually judgment calls disguised as checklists. No bibliography - pure application.

  Hmm, the user's frustration is palpable: they're straddling academic theory and real-world infrastructure decisions. Their hidden need might be for institutional legitimacy - a tool to push back against politically convenient but unscientific proposals. The "engineers will hate" requirement suggests anticipated resistance to rejecting model-dependent projects.

  For the procedure architecture:
  - Must start with dependency screening to quickly filter forecast-independent proposals
  - Then systematically stress-test each failure mode
  - Build in off-ramps to policy when physics can't decide
  - Use engineers' existing verification methods (sensitivity tests, scenario planning) as proxies
  - Explicitly flag "judgment call" steps to prevent false confidence

  The dam case should fail - chaotic systems plus structural shifts make 50-year flow forecasts pseudo-precision. Engineers will hate rejecting "hard data". Modular barriers should pass as they avoid prediction.

  Biggest landmine: bifurcation detection. Since we can't know unknown unknowns, the procedure must force "unknown threshold" admission and default to robustness. Will highlight this in misfire section.

