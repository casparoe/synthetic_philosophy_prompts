prompt: |-
  I keep seeing "history is made by great men, not by forces" tossed around in debates about whether Nazi Germany was structurally inevitable or just a Hitler-shaped accident, but people treat it like it's one claim when it's really a tangle of seperate theses. Can you tear it apart into the precise claims hiding inside — causal overdetermination, leader substitutability, narrative framing, structural redundancy, maybe functional equivalence in authoritarian consolidation — and for each say whether it's a platitude, substantive and defensible, or false? Then specifically tell me which of those readings is actually being used when someone argues that without Hitler there'd still have been a fascist regime in Germany by 1939, and whether that reading actually supports the counterfactual.

  Give me a JSON object with exactly these fields:
  - "readings": array of objects, each containing "label", "precise_claim", "verdict" (choose one: "platitude", "substantive_defensible", "false"), and "supports_no_hitler_fascism_by_1939" (boolean plus one line of reason)
  - "workhorse_reading": string naming which one is doing the actual argumentative work in that specific counterfactual claim
  - "weak_link": string identifying which sub-claim is least defensible and why it undermines the structural-inevitability position if it falls
reasoning: |-
  We are breaking down the statement "history is made by great men, not by forces" into several precise readings that are often conflated. Then we will evaluate each reading and see which one is used in the argument that without Hitler, there would still have been a fascist regime in Germany by 1939.

  The key readings we identify:

  1. **Causal Overdetermination**: The idea that historical outcomes are often determined by multiple sufficient causes, so that even without a particular "great man", the outcome might still occur due to other factors (structural forces).

  2. **Leader Substitutability**: The claim that in a given historical context, one leader can be replaced by another without changing the outcome because the structural conditions are the primary drivers.

  3. **Narrative Framing**: The tendency of historical narratives to focus on individuals because they are more concrete and compelling than abstract forces, which may lead to an overestimation of individual agency.

  4. **Structural Redundancy**: The idea that structural conditions create multiple pathways to the same outcome, so that even if one leader fails, another would emerge to fill the same role.

  5. **Functional Equivalence in Authoritarian Consolidation**: The claim that in a given structural context, the function of establishing an authoritarian regime will be fulfilled by some individual or group, regardless of the specific person.

  Now, for each reading, we assign:
  - A precise claim.
  - A verdict: "platitude" (a truism that is generally accepted but may be trivial), "substantive_defensible" (a claim that is meaningful and can be reasonably defended), or "false".
  - A boolean for whether it supports the counterfactual that without Hitler, there would still have been a fascist regime in Germany by 1939, plus a one-line reason.

  Then we identify:
  - "workhorse_reading": which reading is actually doing the argumentative work for the specific counterfactual claim.
  - "weak_link": which sub-claim is the least defensible and why it undermines the structural-inevitability position.

  Let's construct the JSON accordingly.
