  - Autopoiesis: A system is alive if it is self-produced, meaning it maintains its own boundaries and internally produces the components that constitute it. (Inspired by Maturana and Varela)
  - Evolutionary capacity: A system is alive if it can undergo evolution by natural selection, which requires heritable variation and differential reproduction. (Note: this may require a population)
  - Metabolic closure: A system is alive if it is metabolically closed, meaning it has a network of reactions that regenerate the components of the network. (Inspired by Robert Rosen)
  - Information processing: A system is alive if it processes information in a way that allows it to maintain itself, adapt, and replicate. (This might include having a genetic code or equivalent.)

  We must write these definitions clearly on the criterion cards.

  Finally, the activity cannot reproduce the ethical weight. In the debrief, we can say: "In a clinical setting, declaring something alive or not has consequences. For example, when my sister delivered at 23 weeks, the debate about the fetus's metabolic autonomy had real implications for care. This activity shows how hard it is to draw boundaries, but it doesn't capture the human stakes. How do we make such decisions when the definitions fail us?"

  This should connect without making it a lecture.

  Let me compile the plan.
answer: |-
  Below is a structured 90-minute workshop plan designed to make graduate students experience the arbitrariness of defining life through a negotiation-based activity with borderline cases. The activity uses role-play, constraints, and a token-based payoff to create tension between consensus and internal consistency. Rules are arranged to let participants discover contradictions organically.

  ---

  ### **Workshop Title:** Borderline Life: The Definitional Dilemma  
  **Duration:** 90 minutes  
  **Participants:** 12 graduate students (philosophy of biology/bioethics)  
  **Materials:**  
  - Handout with descriptions of all four borderline entities (distributed to all).  
  - Criterion cards (3 copies each of four criteria: autopoiesis, evolutionary capacity, metabolic closure, information processing).  
  - Timer, whiteboard, tokens (e.g., poker chips or paper slips).  
  - Individual worksheets for initial/final classifications.  
  - Joint classification sheets for dyads.  

  ---

  ### **Timeline and Rules**  
  **Total: 90 minutes**  

  #### **Phase 1: Introduction (10 min)**  
  - **0–5 min:** Briefly frame the workshop’s motivation (e.g., "Definitions of life often collapse in borderline cases, with ethical consequences") **without** mentioning your personal story. Pose a guiding question: *"When does ‘life’ begin or end, and why do definitions fail us?"*  
  - **5–10 min:** Introduce the four criteria and four borderline entities generically (e.g., "We’ll examine entities challenging concepts like autopoiesis"). **Do not resolve debates;** emphasize exploration.  

  #### **Phase 2: Distribution and Individual Prep (15 min)**  
  - **10–12 min:** Distribute:  
    - One **handout** to all students (contains all four entity descriptions).  
    - One **criterion card** per student (randomly assigned; 3 students per criterion).  
    - One **entity card** per student (randomly assigned; 3 students per entity). *Why entity cards?* To create "expertise bias" (students may focus on their entity, amplifying tension during negotiation).  
  - **12–15 min:** Explain rules **partially**:  
    - "Apply your assigned criterion to classify all four entities as ‘alive’ or ‘not alive’. Be internally consistent—your criterion must justify all four judgments equally."  
    - "You’ll negotiate with a partner who has a **different** criterion. Aim for consensus on a joint classification for all entities."  
    - **Hide payoff rules for now.**  
  - **15–25 min:** Individual prep. Students:  
    - Study all entities but pay special attention to their assigned entity card.  
    - Write initial classifications + one-sentence justifications on worksheets.  

  #### **Phase 3: Negotiation Setup (5 min)**  
  - **25–27 min:** Form **opposing-criterion dyads**:  
    - Pair students with different criteria (e.g., autopoiesis with evolutionary capacity). Ensure no shared criteria in dyads (creates inherent conflict).  
    - Assign 6 dyads (12 students).  
  - **27–30 min:** Reveal **payoff rules** to create tension:  
    - *Group incentive:* If the dyad agrees on a joint classification for all four entities, both earn **1 consensus token**.  
    - *Individual incentive:* Each student earns **1 individual token** only if their **final personal classification** (submitted after negotiation) matches their **initial worksheet** (i.e., they remain consistent with their criterion).  
    - **Key tension:** Consensus may require abandoning their criterion’s consistency; individual rewards demand rigidity.  

  #### **Phase 4: Dyad Negotiation (20 min)**  
  - **30–45 min:** Dyads negotiate for **15 min** to produce one joint classification sheet (alive/not alive for all four entities).  
    - **Rules:**  
      - No coin flips or compromises like "maybe." Forced binary choice.  
      - Students must reference their entity cards and criteria but cannot show worksheets.  
    - **Predicted breakdown:** Students will initially ignore criteria and default to intuition (e.g., classifying the brain-dead body as "not alive" based on sentience). The payoff structure **blocks this**: if they abandon initial criteria-based positions to agree, they risk losing individual tokens.  
  - **45–50 min:** **Final personal classification**: Students privately write final classifications (without discussion). Collect joint sheets and personal worksheets.  

  #### **Phase 5: Debrief and Discussion (40 min)**  
  - **50–60 min:** Report-out (dyad struggles):  
    - Ask 2–3 dyads: *"Which entity caused the most conflict? Did consensus require one of you to betray your criterion?"*  
    - Examples:  
      - Dyad with *autopoiesis* (may accept synthetic cell) vs. *evolutionary capacity* (rejects it).  
      - Dyad with *information processing* (may accept viral factory) vs. *metabolic closure* (rejects it).  
  - **60–75 min:** Philosophical mapping (use whiteboard):  
    - **Boundary-drawing problems:** Entity B (brain-dead body) forces a choice: is the microbiome "alive" while the body is not? Maps to "system vs. part" ambiguities.  
    - **Exclusion of history:** Entity A (synthetic cell) highlights how evolutionary capacity ignores current function.  
    - **Operational vs. essentialist definitions:** Entity D (peptide network) shows criteria are tools, not truths (e.g., "metabolic closure" is stipulative without universal acceptance).  
    - **Family resemblance:** Entity C (viral factory) fails some criteria (no metabolism) but satisfies others (information processing), revealing Wittgensteinian overlap.  
  - **75–85 min:** **Limitations of the activity**:  
    - **What’s missing:** The **normative weight** of declaring something "alive" (e.g., ethical protocols for premature births) and **temporal/lineage dimensions** (e.g., life as a historical process). Activity focuses on synchronic arbitrariness, not real-world stakes.  
    - **Bridge to personal stakes:**  
      - *"Three months ago, my sister delivered at 23 weeks. Doctors debated metabolic autonomy to decide ethical protocols—yet every criterion I’ve studied felt like a shaky tool. This activity shows why definitions fracture, but not how we bear the weight of those fractures. How do we make urgent decisions when philosophy offers no clean answers?"*  
      - **Facilitate—don’t lecture:** Ask students to share experiences where "life" definitions mattered (e.g., end-of-life care, environmental ethics). Keep focus on collective insights.  
  - **85–90 min:** Conclusion: Reinforce that definitions are context-dependent tools. Distribute tokens symbolically (no real rewards).  

  ---

  ### **Entity Descriptions (Handout)**  
  1. **Entity A: Synthetic Minimal Cell**  
     - Engineered to maintain homeostasis and metabolize glucose. Lacks a genome or evolutionary history. Components replenished by external glucose supply.  
  2. **Entity B: Brain-Dead Body on ECMO**  
     - Human body with no brain function, sustained by life support. Gut microbiome metabolizes, adapts, and reproduces. No consciousness or neural activity.  
  3. **Entity C: Viral Factory**  
     - Structure within a host cell that directs viral replication using host machinery. No independent metabolism; relies entirely on host resources.  
  4. **Entity D: Self-Catalyzing Peptide Network**  
     - Peptides in a lipid vesicle that grow, divide, and respond to chemical gradients. No nucleic acids; energy derived directly from the environment (no internal metabolism).  

  ---

  ### **Criterion Cards**  
  - **Autopoiesis:** "A system is alive if it self-produces its boundaries and internal components (e.g., maintains itself)."  
  - **Evolutionary Capacity:** "A system is alive if it can undergo evolution by natural selection (requires heritable variation and reproduction)."  
  - **Metabolic Closure:** "A system is alive if it has a self-regenerating network of internal metabolic reactions."  
  - **Information Processing:** "A system is alive if it processes information to maintain, adapt, and replicate itself."  

  ---

  ### **Predictable Challenges & Mitigation**  
  - **Problem:** Students default to intuition, ignoring criteria.  
    **Solution:** Payoff structure penalizes inconsistency (losing individual tokens). Initial prep forces criterion-based thinking.  
  - **Problem:** Dyads avoid conflict to "win" consensus tokens.  
    **Solution:** Entity cards create expertise bias (e.g., a student with Entity B may resist oversimplifying it).  
  - **Problem:** Philosophical depth lost in negotiation chaos.  
    **Solution:** Debrief uses specific dyad breakdowns to map concepts (e.g., "When you debated the viral factory, you hit the operational-essentialist gap").  

  This design forces students to confront the instability of life’s definitions firsthand, culminating in a debrief that links their frustrations to broader philosophy—while leaving space for you to contextualize its personal urgency without centering yourself.
