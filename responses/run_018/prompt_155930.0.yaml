prompt: |-
  Restate the wrong-kind-of-reasons problem—the distinction between reasons that genuinely justify an attitude and reasons that merely cause it, with particular attention to belief, admiration, and desire—using only the vocabulary of causal inference: directed acyclic graphs, do-interventions, structural equations, and the contrast between evidential conditioning and causal conditioning. I am fluent in that technical vocabulary but not in the normative literature, so keep the philosophical claims explicit. For each of the three attitude-types, translate the thesis that there exist right and wrong kinds of reasons into claims about permissible parent nodes in the structural model governing that attitude, distinguishing cases where the normative distinction aligns with a causal distinction and cases where it diverges. Then report the distortions: for example, whether treating an inappropriate reason as a node to be intervened upon misrepresents the normative claim that it ought to be disregarded, and whether the justification of admiration requires an evaluation function that cannot be represented within the graph without smuggling in normative premises. Conclude with a residue analysis identifying which elements of the debate—such as the asymmetry between belief and desire, or the authoritative status of justifying reasons—lack any counterpart in causal vocabulary. Assess whether that absence reveals an irreducibly normative dimension to the problem, or whether it is merely an artifact of philosophers employing modal and deontic language where a precisely specified causal model could have done the work. Throughout, maintain an honest translation: do not reduce normative appropriateness to optimal prediction error, and do not embed deontic claims inside causal ones.
reasoning: |-
  We are to restate the "wrong-kind-of-reasons" problem using only the vocabulary of causal inference (DAGs, do-interventions, structural equations, evidential vs. causal conditioning). The problem distinguishes between reasons that genuinely justify an attitude (right-kind reasons, RKR) and reasons that merely cause it (wrong-kind reasons, WKR). We focus on three attitudes: belief, admiration, and desire.

   The core idea is that for each attitude, we model it as an endogenous variable in a structural causal model (SCM). The parents of this attitude variable represent the reasons (inputs) that causally influence it. However, normatively, only certain parent nodes (or certain paths) are considered as justifiers; other parents that causally influence the attitude are considered mere causes and thus "wrong-kind".

   We must translate the thesis that there exist right and wrong kinds of reasons into claims about permissible parent nodes in the structural model for each attitude. We also note cases where the normative distinction aligns with a causal distinction and where it diverges.

   We then report distortions that arise when we try to model the normative claim (e.g., that an inappropriate reason ought to be disregarded) by intervening on that node. Additionally, we consider whether the justification of admiration requires an evaluation function that cannot be represented without normative premises.

   Finally, we do a residue analysis: identify elements of the debate that lack a counterpart in causal vocabulary (like the asymmetry between belief and desire, or the authoritative status of justifying reasons) and assess whether that absence reveals an irreducibly normative dimension or is just an artifact of philosophical language.

   Steps:

   1. General Structure:
      - Let A be the attitude variable (belief, admiration, desire).
      - The SCM for A: A = f(Pa(A), U), where Pa(A) are the parents (direct causes) and U are exogenous variables.
      - We partition Pa(A) into two sets: 
          RKR: Right-Kind Reasons (permissible parents)
          WKR: Wrong-Kind Reasons (impermissible parents)

      But note: the normative claim is that even if WKR are in fact causes (so they are in the causal graph), they should not be. That is, they are not justifiers. So the normative model might require that we consider a graph where only RKR are parents.

   2. For each attitude, we describe:

      a. The typical causal model and the normative distinction.
      b. Whether the normative distinction aligns with a causal distinction (e.g., in belief, the causal model might naturally exclude WKR as direct causes, but in admiration they might be direct causes and we have to normatively exclude them).

   3. Belief:

      - Normative claim: The only right-kind reasons for belief are evidence (i.e., facts that bear on the truth of the proposition). Wrong-kind reasons might be, for example, incentives (e.g., a reward for believing) or pragmatic considerations.
      - Causal model: 
          Let B be belief in proposition P.
          RKR: Evidence (E) that is causally related to the state of the world (S) that P is about.
          WKR: Incentives (I) that might cause belief without regard to truth.

          We might have:
              S -> E -> B   (right-kind path)
              I -> B        (wrong-kind path)

          However, note that in reality, incentives might also affect evidence gathering, so we might have I -> E. But the direct effect of I on B (if any) is WKR.

      - Alignment: The causal model can naturally represent the distinction by having two separate parent sets. The normative claim is that the function f for B should be such that it only depends on E (i.e., the RKR). If I is a direct parent, then that is a WKR path and it is normatively impermissible.

      - Distortion: If we intervene on I (do(I=i)) and see that B changes, it reveals that I is a cause. But the normative claim is that we should disregard I. This normative claim cannot be captured by the causal model alone. The model can show that I is a cause, but the norm says that we ought to design the system (or our own reasoning) so that I is not a cause. So the causal model as is includes WKR, but we wish it didn't. We can model the normative ideal by a modified graph where the edge I->B is removed.

   4. Admiration:

      - Normative claim: Right-kind reasons for admiration are features that make the object admirable (e.g., virtuous actions). Wrong-kind reasons might be, for example, that admiring the object brings benefits (e.g., social rewards) or that someone has commanded you to admire it.
      - Causal model:
          Let A be admiration for person X.
          RKR: Features (F) of X that are admirable (e.g., virtuous acts).
          WKR: Benefits (B) of admiring X or commands (C) to admire X.

          We might have:
              F -> A   (right-kind)
              B -> A   (wrong-kind)
              C -> A   (wrong-kind)

          However, note that the RKR depend on an evaluation: what counts as admirable? This evaluation might be normative and not reducible to non-normative facts.

      - Alignment: In the causal model, both F and B/C are direct causes. The normative claim is that only F should be a cause. So again, we can model the ideal by removing the edges from B and C to A.

      - Distortion: The problem is that the RKR (F) itself is defined normatively. What features are admirable? This requires an evaluation function that might not be representable without normative premises. For example, we might have a node V (value) that takes F and outputs whether F is admirable. Then we have:

              F -> V -> A

          However, V is a normative node. Without V, we cannot define the RKR. But in a purely causal model, V would have to be either a non-normative node (which might not capture the normativity) or we would have to admit that the model requires normative inputs.

      - Thus, the justification of admiration requires an evaluation function (V) that is normative. This cannot be represented without smuggling in normative premises.

   5. Desire:

      - Normative claim: There is a debate about whether there are wrong-kind reasons for desire. Some philosophers (like the Humean) think that any cause of desire is a reason. Others argue that only considerations that make the object desirable (in a normative sense) are right-kind. But let's take the non-Humean view: RKR are features that make the object desirable (e.g., its goodness), and WKR are arbitrary causes (e.g., conditioning or manipulation).
      - Causal model:
          Let D be desire for object O.
          RKR: Features (F) that make O good or desirable in the normative sense.
          WKR: Arbitrary causes (M) like manipulation or conditioning.

          We might have:
              F -> D   (right-kind)
              M -> D   (wrong-kind)

      - Alignment: Similar to admiration, we can model the ideal by removing the edge from M to D.

      - Asymmetry with belief: In belief, the RKR are truth-related, and it is widely accepted that there are WKR. In desire, the Humean view denies that there are WKR: they say that any cause of desire is a reason. So the asymmetry is that belief is thought to be subject to a norm of truth that desire is not subject to in the same way (desire might have no objective correctness condition). But note: we are considering the non-Humean view for desire to have a parallel structure.

   6. Distortions:

      - For all attitudes, if we model the WKR as a parent and then intervene on it, we are treating it as a cause. But the normative claim is that we should not let it be a cause. So the causal model that includes WKR as a parent is descriptively accurate (it might be how we actually form attitudes) but normatively flawed. The normative model would be a different graph without the WKR edges.

      - The normative claim that we ought to disregard WKR cannot be captured by conditioning (evidential) or intervening (causal) in the existing graph. Instead, it requires a change to the graph itself.

      - For admiration (and desire in the non-Humean view), the RKR require a normative evaluation. This evaluation node (V) is not reducible to non-normative facts in the graph without losing the normative force.

   7. Residue Analysis:

      - Asymmetry between belief and desire: In the causal model, we can represent both symmetrically. But the normative asymmetry (that belief has a truth norm and desire does not, according to some) is not captured by the causal model. The causal model is symmetric: both have RKR and WKR. The asymmetry is a philosophical claim that might not be reflected in the causal structure.

      - Authoritative status of justifying reasons: In the normative literature, RKR are not just causes but reasons that we ought to respond to. This "ought" has no counterpart in the causal model. The causal model only shows that if we have certain inputs, we get the attitude. It does not say we ought to have the attitude given the inputs.

      - Assessment: The absence of these elements (the asymmetry and the authoritative status) suggests an irreducibly normative dimension. The causal model can describe the actual causal relations and even model an ideal causal structure (without WKR edges), but it cannot explain why we ought to have that ideal structure. Moreover, it cannot capture the normative evaluation (like what makes something admirable) without introducing a node that itself has normative content.

      - Is this residue an artifact? We might try to model the normative claims as constraints on the causal model (e.g., we require that the graph for belief must not have edges from incentives to belief). But then the constraint itself is normative and not part of the causal model. Alternatively, we might try to reduce the normative constraint to a causal one (e.g., by saying that the ideal graph leads to better outcomes). However, the problem states: "do not reduce normative appropriateness to optimal prediction error, and do not embed deontic claims inside causal ones." So we must avoid such reductions.

      Conclusion: The residue (the asymmetry, the authoritative status, and the normative evaluation) reveals an irreducibly normative dimension. The causal model can describe the actual and the ideal causal structures, but it cannot explain the normative force of the ideal, nor can it capture the content of the normative evaluation (what makes something admirable) without smuggling in normative premises.

   8. Overall Translation:

      We can model the formation of attitudes with DAGs. The normative claim is that the graph should have only the RKR as parents of the attitude. The existence of WKR as parents in the actual graph is a defect. But the causal model cannot by itself tell us which parents are RKR and which are WKR. That distinction requires normative input.

      For belief, RKR are evidence (which is truth-related). For admiration and desire (on the non-Humean view), RKR are features that are admirable or desirable, which are normative. The causal model without normative labels does not distinguish RKR from WKR.

      The act of disregarding WKR is represented by a graph surgery: removing the WKR edges. But the reason for that surgery is normative and not causal.

      Therefore, the wrong-kind-of-reasons problem cannot be fully reduced to causal concepts. The residue is the normative evaluation that classifies some reasons as right-kind and others as wrong-kind, and the imperative to structure our attitudes so that they are only influenced by RKR.
answer: |-
  ### Restating the Wrong-Kind-of-Reasons Problem in Causal Inference Vocabulary

  The **wrong-kind-of-reasons problem** distinguishes between:  
  - **Right-kind reasons (RKR)**: Factors that *justify* an attitude (e.g., evidence for belief, admirable traits for admiration).  
  - **Wrong-kind reasons (WKR)**: Factors that *cause* an attitude but do not justify it (e.g., bribes to believe, threats to admire).  

  We model attitudes as endogenous variables in a **structural causal model (SCM)**. Let \( \mathcal{G} \) be a **directed acyclic graph (DAG)** where:  
  - \( A \) = Attitude (belief, admiration, desire).  
  - \( \text{Pa}(A) \) = Parents of \( A \) (direct causes).  
  - \( U_A \) = Exogenous noise (unobserved confounders).  
  - **Structural equation**: \( A = f_A(\text{Pa}(A), U_A) \).  

  The **normative distinction** is:  
  - **RKR** are permissible parents of \( A \).  
  - **WKR** are impermissible parents (they should not directly influence \( A \)).  

  We contrast **evidential conditioning** (\( P(A \mid \text{obs}) \)) and **causal conditioning** (\( P(A \mid \text{do}(\cdot)) \)) to clarify distortions.  

  ---

  ### Per-Parent Distinctions for Each Attitude  
  #### **1. Belief (B)**  
  - **Normative claim**: Only *evidence* (truth-indicative factors) justifies belief. WKR (e.g., incentives) should not influence belief.  
  - **SCM**:  
    - Let \( B \) = Belief in proposition \( P \).  
    - \( \text{Pa}(B) = \{E, I\} \), where:  
      - \( E \) = Evidence (RKR).  
      - \( I \) = Incentive (WKR, e.g., reward for believing).  
    - Structural equation: \( B = f_B(E, I, U_B) \).  
  - **Alignment**:  
    - The causal distinction **aligns** with the normative distinction.  
    - RKR (\( E \)) and WKR (\( I \)) are separable parent nodes.  
    - *Normative ideal*: The edge \( I \to B \) should not exist.  
  - **Distortion**:  
    - **Evidential conditioning**: Observing \( I \) correlates with \( B \), but this is confounded (e.g., by \( U_B \)).  
    - **Causal intervention**: \( \text{do}(I = i) \) changes \( B \), but normatively, \( I \) *ought* to be excluded from \( \text{Pa}(B) \).  
    - *Misrepresentation*: Modeling \( I \) as a parent implies it *can* influence \( B \), but the normative claim is that it *should not*.  

  #### **2. Admiration (A)**  
  - **Normative claim**: Only *admirable traits* (e.g., courage) justify admiration. WKR (e.g., social pressure) do not.  
  - **SCM**:  
    - Let \( A \) = Admiration for person \( X \).  
    - \( \text{Pa}(A) = \{T, S\} \), where:  
      - \( T \) = Traits of \( X \) (RKR).  
      - \( S \) = Social reward (WKR).  
    - Structural equation: \( A = f_A(T, S, U_A) \).  
  - **Alignment**:  
    - The causal distinction **diverges** normatively.  
    - RKR (\( T \)) requires an **evaluation function** \( V \) (e.g., "trait admirability") that is *irreducibly normative*.  
    - \( V \) cannot be modeled without smuggling in normative premises (e.g., \( T \to V \to A \), where \( V \) is non-causal).  
  - **Distortion**:  
    - **Causal intervention**: \( \text{do}(S = s) \) changes \( A \), but normatively, \( S \) should be excluded.  
    - *Misrepresentation*: The SCM cannot capture why \( T \) (unlike \( S \)) *justifies* \( A \) without \( V \).  
    - **Key problem**: \( f_A \) must encode normative evaluation (e.g., "courage is admirable"), which lacks a causal analog.  

  #### **3. Desire (D)**  
  - **Normative claim**: RKR are *desirable properties* (e.g., goodness), while WKR are non-justifying causes (e.g., subliminal cues).  
  - **SCM**:  
    - Let \( D \) = Desire for object \( O \).  
    - \( \text{Pa}(D) = \{G, C\} \), where:  
      - \( G \) = Goodness of \( O \) (RKR, if non-Humean).  
      - \( C \) = Subliminal cue (WKR).  
    - Structural equation: \( D = f_D(G, C, U_D) \).  
  - **Alignment**:  
    - **Asymmetry with belief**: For desire, RKR (\( G \)) is *contested*. Humeans deny normative constraints, claiming all causes are reasons.  
    - Non-Humean view: Distinction aligns causally (like belief).  
    - Humean view: No WKR exists; all parents are permissible.  
  - **Distortion**:  
    - **Evidential vs. causal**: Observing \( G \) may correlate with \( D \) evidentialy, but \( \text{do}(G = g) \) tests causal influence.  
    - Normative exclusion of \( C \) conflicts with causal efficacy.  

  ---

  ### Residue Analysis: What Causal Vocabulary Cannot Capture  
  1. **Normative authority of RKR**:  
     - RKR *justify* attitudes (e.g., "evidence *ought* to sway belief").  
     - Causal models show *how* \( E \) affects \( B \), but not why it *should*.  
     - **Residue**: The deontic "ought" has no causal counterpart.  

  2. **Asymmetry between belief and desire**:  
     - Belief is governed by a "truth norm"; desire lacks consensus.  
     - Causal models represent both symmetrically (parent nodes), but cannot explain why belief *must* exclude WKR while desire *may* not.  

  3. **Evaluation functions (e.g., for admiration)**:  
     - Traits \( T \) justify admiration only via normative evaluation \( V \) (e.g., "courage is admirable").  
     - \( V \) cannot be reduced to causal nodes without circularity (e.g., defining \( V \) as "what causes admiration" conflates RKR/WKR).  

  **Assessment of the residue**:  
  - The residue (normative authority, asymmetry, evaluation functions) reveals an **irreducibly normative dimension**.  
  - Causal models describe *actual* and *possible* influences but cannot:  
    - Ground the *authority* of RKR (why they *should* matter).  
    - Resolve debates like Humeanism about desire.  
    - Define evaluation functions (e.g., admirability) without normative premises.  
  - This is **not** an artifact of modal/deontic language: Even with a precise causal model, normative claims (e.g., "truth is the norm for belief") constrain which causal structures *ought* to exist, but do not describe empirical regularities.  

  ---

  ### Conclusion  
  Causal inference vocabulary can:  
  - Separate RKR/WKR as distinct parent nodes.  
  - Highlight distortions when WKR are intervened upon.  
  - Show why admiration requires irreducible evaluation.  

  It cannot:  
  - Reduce normative authority to causal influence.  
  - Resolve asymmetries (e.g., belief vs. desire) without normative input.  
  - Define justification without smuggling in non-causal premises.  

  The residue confirms the **irreducibility of normativity**: While causal models describe mechanisms, they cannot dictate which mechanisms *ought* to govern attitudes. The "wrong-kind-of-reasons" problem thus resists full causal reduction.
