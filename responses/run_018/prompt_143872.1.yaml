  First, I need to recall Neurath's goals. He wanted protocol statements to be theory-neutral, using direct observations. ISOTYPE was his solution—pictures as transparent representations. But the user's snag is spot-on: symbols require agreements on meaning, which introduces conventions. So, how does this differ from language's theoretical baggage?

