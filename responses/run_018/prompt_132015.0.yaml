  ## Murmuration Blues (Sestina for an Old Scientist)

  The sky dissolves into a shifting **pattern**,
  A thousand wings in fluid, **physical** flight.
  Is it mere instinct, blind evolved **design**?
  Or can I trust the shaky **prediction**
  That sees a single **intentional** will?
  Is this phenomenon substantively **real**?

  My instruments insist the view is **real** –
  Thermals, muscle twitch, a neural **pattern**.
  No central bird commands; no **intentional**
  Brain plots the curve. Just vectors, **physical**
  Forces. Yet the flock's next **prediction**
  Feels too deft for simple, brute **design**.

  Thirty years I mapped atomic **design**,
  Probed crystal bonds for structures truly **real**.
  Now starlings mock my best **prediction**,
  A liquid knot, a living **pattern**
  Born of proximity and **physical**
  Law? Or something... more... **intentional**?

  That swooping bank feels fiercely **intentional**,
  A choice made swift! Beyond base **design**
  Dictated by the purely **physical**.
  If it *works* as guide, is it then **real**?
  This writhing, breathing, blackened **pattern** –
  Can I stake my sense on its **prediction**?

  Dennet says the test is **prediction**:
  If the stance grants foresight, call it **real**.
  But here I stand, my old **design**
  Of certainty undone. The **pattern**
  Shifts again. What lens makes this **real**?
  Just wing-beats, local, **physical**?

  But wait... a fourth stance? Less **physical**,
  More... strange. The *modeling* view: **intentional**
  Arises *only* in my squint. The **real**
  **Pattern** exists because *my* mind’s **design**
  Projects the plot, runs the **prediction** –
  Like seeing lattices where atoms **pattern**.

  **(Envoi)**
  Old eyes seek bedrock, something **real**.
  My mind, a frantic **prediction** machine,
  Spins **design**, **intentional**, **physical**... the circling **pattern** unseen.

