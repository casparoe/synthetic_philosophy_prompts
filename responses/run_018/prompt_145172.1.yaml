answer: |-
  You're absolutely right to push past the slogan – "you reap what you sow" is a **highly ambiguous metaphor** that gets wielded as if it were self-evident truth. Your friend's dismissal likely stems from conflating several distinct ideas packed into that proverb. Let's dissect it into its possible precise theses, analyze them against moral luck, and tackle your three angles. This *is* complex, and you weren't overanalyzing; you were trying to apply necessary philosophical rigor.

  **The Menu of Readings: Unpacking "You Reap What You Sow"**

  1.  **Pure Descriptive Causality (Weakest, Often Trivially True):**
      *   **Thesis:** Actions have consequences. Intentional choices (sowing) initiate causal chains that lead to outcomes (reaping), *some* of which are predictable.
      *   **Status:** Largely a platitude about agency and cause/effect. True in a broad sense (e.g., studying hard *tends* to lead to better grades), but ignores vast complexity (indirect effects, unintended consequences, external factors).
      *   **Moral Luck:** Intact. This says nothing about *desert* or *proportionality*. It doesn't claim the reaper *deserves* the crop, just that the crop grew from the seed. Luck (good or bad) is simply part of the causal chain.
      *   **Normative Bite?** **None.** It's descriptive, not prescriptive. Doesn't tell you what *should* happen, only that actions *do* have effects.
      *   **Your Friend's Use:** Useless for defending karma against moral luck. It doesn't engage with desert at all.

  2.  **Proportional Outcome Causality (Stronger Causality, Still Descriptive):**
      *   **Thesis:** The nature and magnitude of the outcome (reaping) are *directly proportional* to the nature and magnitude of the action (sowing) *in terms of its causal potential*. Good seeds yield good crops; bad seeds yield bad crops, *by necessity*.
      *   **Status:** **Often False.** Reality is messy. A good seed sown in drought yields nothing. A weed seed sown in fertile soil thrives. Skill, effort, *and* luck determine the outcome. This thesis underestimates contingency and moral luck.
      *   **Moral Luck:** **Directly Contradicted.** This thesis *denies* the possibility of significant moral luck by asserting proportional outcomes are *causally inevitable*. Moral luck shows this inevitability is false (e.g., two equally reckless drivers: one hits a child, one doesn't).
      *   **Normative Bite?** **Potential Implicit.** The language of "good seed/good crop" smuggles in normative judgment. However, its core claim is causal necessity, which is empirically shaky.
      *   **Your Friend's Use:** Might *seem* supportive of karma (proportional outcomes), but collapses under moral luck objections. If proportional outcomes aren't causally guaranteed, karma as desert becomes unstable.

  3.  **Basic Moral Desert (Retributive, Backward-Looking):**
      *   **Thesis:** Agents *morally deserve* outcomes proportional to the moral quality (good/evil) of their *intentional actions*. Good actions *should* and (ideally) *do* lead to good outcomes for the agent; evil actions *should* and (ideally) *do* lead to bad outcomes. Desert tracks the *action's moral worth*.
      *   **Status:** This is the core normative claim often associated with karma and retributive justice. It's a substantive claim about cosmic or moral order.
      *   **Moral Luck:** **Severely Challenged.** If desert is tied to *outcomes* (reaping), and outcomes are significantly influenced by luck (factors beyond the agent's control), how can the agent truly *deserve* that specific outcome? The reckless driver who hits the child reaps far worse than the equally reckless one who doesn't, due to luck.
      *   **Normative Bite?** **Strong.** This is prescriptive: the world *should* operate this way, and often, proponents believe it *does*.
      *   **Your Friend's Use:** This is likely the reading she *intends* – using the slogan to assert that outcomes reflect and are deserved based on prior actions. **This is precisely the reading vulnerable to moral luck objections.** Luck disrupts the clean link between action/intention and outcome.

  4.  **Consequentialist Motivation (Forward-Looking):**
      *   **Thesis:** The proverb is advice: be mindful of your actions because they *tend* to create consequences *for you*. Sowing good increases the *likelihood* of reaping good; sowing bad increases the *likelihood* of reaping bad. It's about prudence and shaping future states.
      *   **Status:** More plausible than #3. Recognizes tendencies and probabilities, not ironclad laws. Focuses on the *future* motivational impact rather than backward-looking desert.
      *   **Moral Luck:** **Acknowledged but Mitigated.** Accepts luck plays a role, but argues the *general tendency* holds enough to make the advice useful. Doesn't claim perfect desert, just probabilistic self-interest.
      *   **Normative Bite?** **Instrumental.** The "bite" is pragmatic: act this way *if* you want better future outcomes for yourself. Not about inherent desert.
      *   **Your Friend's Use:** Could be defensible, but likely not what she meant in a debate about moral desert and karma. It dodges the core desert question by focusing on incentives.

  5.  **Cosmic Justice / Karmic Ledger (Metaphysical Desert):**
      *   **Thesis:** A cosmic principle or mechanism ensures perfect, proportional desert across an extended framework (multiple lifetimes). Outcomes *always* reflect the moral quality of past actions, even if not immediately or in this life. "Reaping" can occur far removed from the original "sowing," potentially inherited or transferred ("compound-interest ledger").
      *   **Status:** Found in some religious/philosophical interpretations of karma (Hindu, Buddhist, New Age). Highly metaphysical claim.
      *   **Moral Luck:** **Purports to Solve It.** By expanding the timeframe and scope (multiple lives, cosmic accounting), it *claims* to resolve the apparent injustices of moral luck within a single lifetime. The unlucky outcome *must* be repayment for a past debt; the lucky windfall *must* be reward for past virtue. **However:** This is unfalsifiable and requires accepting the metaphysical framework. It doesn't *eliminate* luck within a life; it just reinterprets its *cause* as past karma.
      *   **Normative Bite?** **Strong and Foundational.** This *is* the normative framework itself. Desert is absolute but operates on a cosmic scale.
      *   **Your Friend's Use:** If she holds this view, the slogan defends karma *within that framework*. But it relies entirely on accepting the metaphysics. Objections based on moral luck *within a single observed life* are dismissed as myopic.

  **Addressing Your Three Angles:**

  *   **(a) Desert: Intention vs. Outcome:**
      *   Readings #1 & #2 focus purely on *outcomes* as effects.
      *   Reading #3 (Basic Moral Desert) focuses on the *moral quality of the intentional action* as the basis for desert, *but* desert is still assigned to the *outcome* (reaping). This creates tension: *Why* does the agent deserve *this specific outcome* if luck intervened? Pure desert theories often try to isolate the *intention* or *volition* as the *sole* basis for desert, *regardless* of outcome (e.g., blaming/praising the intention). But "reap what you sow" inherently links desert to the outcome of the action. **The slogan leans towards outcome-based desert, making it vulnerable to moral luck.**

  *   **(b) Inherited/Transferred Debt (Compound-Interest Ledger):**
      *   This is specific to Reading #5 (Cosmic Justice/Karmic Ledger). It's a core feature of rebirth-based karma systems. Moral debt/credit is accrued and carried over lifetimes. "Reaping" in this life could stem from "sowing" in a past life. The "ledger" metaphor is apt. **This is a substantive metaphysical claim distinct from the simpler causal or desert readings (#1-4).** It's how some systems *attempt* to resolve apparent injustices within one lifetime.

  *   **(c) Causal Metaphor with Zero Normative Bite:**
      *   This is Reading #1 (Pure Descriptive Causality). It *is* just a metaphor about causes and effects, stripped of moral judgment. It tells you actions have consequences, not that those consequences are *deserved* in a moral sense. **Many people use the slogan *as if* it had normative bite (implying #3 or #5) when it factually only supports #1.**

  **Conclusion & Defense Against Moral Luck:**

  *   **The Platitude (#1)** is true but irrelevant to desert.
  *   **Strong Causality (#2)** is empirically false and denies luck.
  *   **Consequentialist Advice (#4)** dodges the desert question.
  *   **Cosmic Justice (#5)** claims to solve luck via metaphysics, but is unfalsifiable.
  *   **Basic Moral Desert (#3)** is the core reading your friend likely intends: outcomes reflect and are deserved based on prior actions.

  **This Basic Moral Desert reading (#3) is precisely the one most vulnerable to moral luck objections.** Moral luck demonstrates that factors beyond an agent's control significantly influence outcomes. Therefore, tying desert *directly* to outcomes means desert is partly determined by luck – undermining the idea that the agent *truly and solely* deserves that specific outcome based solely on their action/intention.

  **Your key insight was correct:** Using "you reap what you sow" as a defense of karma *as moral desert* against moral luck objections fails because:

  1.  **The slogan conflates causality with desert.** Just because an action *caused* an outcome doesn't mean the agent *deserves* that outcome (especially if luck intervened).
  2.  **It often implies proportional outcome causality (#2),** which moral luck disproves.
  3.  **Its core normative meaning (#3) is directly challenged** by moral luck showing outcomes aren't reliably proportional to the moral quality of the action/intention due to contingent factors.

  Your friend used the slogan to *assert* the very link (between action and *deserved* outcome) that moral luck calls into question. That's circular reasoning, not a refutation. You weren't overanalyzing; you were correctly identifying a deep philosophical problem with simplistic appeals to cosmic justice. The coffee shop is the perfect place for this kind of necessary, if exhausting, clarity.
