prompt: |-
  I'm helping a local historical society decide what to do with a recently discovered cache of personal letters, identification photographs, and handwritten accounts belonging to families affected by a factory collapse that destroyed half of our town in the late 1960s. One faction of descendants argues that digitizing the entire collection and mounting a permanent, publicly accessible exhibition is the only morally adequate response: to allow these records to remain in darkness, they say, is a second erasure of the victims, and the community has a duty to bear witness rather than sanitize the tragedy into a footnote. A second faction—mostly children and grandchildren of survivors—contends with equal intensity that the materials should be sealed in restricted storage for several generations, and that any images identifying specific bodies should be destroyed rather than displayed, because perpetual public remembrance has become a form of moral exhibitionism. They claim the town's collective identity has been reduced to this single trauma, and that the living are being conscripted into a performance of grief they never chose; for them, a deliberate withholding from public memory is not denial but a necessary condition for the community to become something other than a monument to pain. I am genuinely torn: there seems to be a deep wrong in erasure, yet also a wrong in forcing remembrance upon people who experience it as an unchosen burden. Can you help me see the underlying philosophical structure of this conflict, apply the relevant framework concerning the ethics of memory and the legitimacy of forgetting, and advise what principles ought to govern the curator's decision? In your response, please indicate how confident you are in the conclusions you reach and explicitly single out the specific claim or distinction about which you are least sure.
