  **Villanelle: Fixed Past and Open Hand**  
  *(After David Lewis)*  

  The past is fixed: the old man lived, that man.  
  I track the route he takes at close of day.  
  I hold the gun and know the way I can.  

  His habits mapped—the bench where he will stand—  
  My finger trained, no tremor in the grain.  
  The past is fixed: the old man lived, that man.  

  We meet. He startles, shifts to raise a hand.  
  My shot deflects—a bird cuts through its arc.  
  I hold the gun and know the way I can.  

  How? Skill and chance aligned as I had planned!  
  No flaw in aim, yet life flows on unscathed.  
  The past is fixed: the old man lived, that man.  

  The records show he walked from square to van,  
  Unharmed. My "choice" was never in the tale.  
  I hold the gun and know the way I can.  

  *Can* as my grip and sight, the bullet's span;  
  *Can't* as what fits what *was* without a seam.  
  The past is fixed: the old man lived, that man.  
  I hold the gun and know the way I can.  

