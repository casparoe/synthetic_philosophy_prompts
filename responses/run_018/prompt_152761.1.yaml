answer: |-
  Your frustration is spot-on—the "paradox of fiction" debate *is* fundamentally fragmented, not stalled. You've correctly identified three distinct threads running under the same label, each answering a different philosophical question. Here's a diagnostic breakdown:

  ### 1. **The Three Parallel Arguments (Your Insight is Correct)**
     - **Intentional Object Problem** (Walton, Radford):  
       *Core Question:* Can an emotion be "about" something that doesn’t exist?  
       *Stakes:* Philosophy of mind (how mental states represent non-existent entities).
     - **Phenomenological Identity Problem** (Illusionists, some empiricists):  
       *Core Question:* Is the *feeling* of fictional sadness identical to real grief?  
       *Stakes:* Philosophy of emotion (what constitutes "genuine" affect).
     - **Cognitive Architecture Problem** (Lamarque, Currie):  
       *Core Question:* How do belief-forming mechanisms interact with imagination?  
       *Stakes:* Cognitive science/aesthetics (suspension of disbelief, mental simulation).

  These aren’t competing solutions to one problem; they’re addressing different phenomena. Walton cares about logical consistency of mental states, Lamarque about cognitive processes, and illusionists about qualitative experience.

  ### 2. **The Hidden Empirical Question (You’re Onto Something)**
  Neuroimaging *does* shed light—but only on the *phenomenological thread*. Studies (e.g., Oatley’s fMRI work on fiction) show overlapping neural activation for real and fictional emotions in affective circuits (e.g., anterior insula, amygdala). However:
     - This doesn’t resolve the intentional object problem (a wiring overlap doesn’t prove Anna Karenina "exists" for your mind).
     - It partially addresses the cognitive thread: we *don’t* activate full belief systems (prefrontal cortex patterns differ from real-world threat responses).
     - **Limitation:** Neuroscience can’t tell us what emotions "ought" to be directed at—that’s conceptual.

  ### 3. **The Root Impasse: Undefined "Real Emotion"**
  The stalemate arises because **"real emotion" is a suitcase term**. Each camp implicitly defines it differently:
     - Walton: Real emotions require *existential belief*.
     - Phenomenologists: Real emotions require *somatic markers* (e.g., tears, physiological arousal).
     - Cognitivists: Real emotions require *practical action-readiness* (e.g., helping behavior).

  Until these criteria are disentangled, consensus is impossible. A "verbal" distinction *is* substantive here—it dictates what counts as evidence.

  ### 4. **Breaking the Impasse: Multi-Level Frameworks**
  Progress requires:
     - **Clarifying the Question:** Is the paradox about logic (intentionality), phenomenology, or cognition? We need explicit disambiguation.
     - **Interdisciplinary Integration:**  
       - Philosophy of mind → Intentionality  
       - Affective science → Phenomenology  
       - Narrative theory → Cognitive architecture  
       *Example:* Peter Goldie’s work on "feeling towards" fictions bridges intentionality and phenomenology.
     - **Experimental Nuance:**  
       Neuroimaging + behavioral tests (e.g., does fictional sadness alter real-world decisions?) could isolate components. If fictional grief *doesn’t* trigger approach/avoidance behaviors, cognitivists win; if it triggers identical physiology, phenomenologists gain ground.

  ### 5. **Philosophy of Mind vs. Aesthetics? Both.**
  The paradox is a **boundary problem**:
     - *For philosophy of mind:* It challenges theories of intentionality and emotion.
     - *For aesthetics:* It exposes how artifacts trigger "irrational" responses.  
     Neither owns it exclusively—it’s a stress test for theories of representation across domains.

  ### Conclusion: Diagnosing the Debate
  - **Not stalled, but splintered.** Radford framed it as one issue, but it’s three.  
  - **Empirical data helps but can’t resolve conceptual splits.** Neuroimaging addresses phenomenology, not intentionality.  
  - **The path forward:** Admit the fragmentation. Use a framework like:  
    - *Level 1:* Cognitive mechanisms (belief/imagination interaction)  
    - *Level 2:* Intentional structure (what the emotion is "about")  
    - *Level 3:* Affective experience (qualitative feel)  

  The "paradox" persists because it’s not one puzzle—it’s a nexus where philosophy of mind, aesthetics, and emotion theory collide. Treating it as such might turn parallel arguments into a productive mosaic. For your next discussion, try forcing your friends to specify *which version* of the paradox they’re tackling—you’ll likely find they’re working on different layers.
