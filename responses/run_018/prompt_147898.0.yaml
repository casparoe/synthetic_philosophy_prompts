prompt: |-
  I've noticed a recurring pattern in the collapse of social norms that doesn't map cleanly onto the explanations I'm familiar with — not moral argument, not shifting material interests in the Bernard Williams vein, and not the honor-cascade dynamics Kwame Anthony Appiah describes in cases like dueling. The pattern is this: a practice doesn't disappear because people decide it's wrong or costly; it dissolves because the community gradually loses shared criteria for what counts as an instance of it. Take dueling: it wasn't only that honor codes stopped requiring satisfaction, but that people could no longer coordinate on whether a particular slight was of the kind that warranted a challenge, or whether issuing one was courageous or foolish. The norm became, in a sense, unindexable — defenders couldn't point to a clear exemplar of proper dueling to justify preservation, and critics couldn't isolate a clear exemplar of abuse to condemn. I think I saw something structurally similar with certain local shunning rituals in early-twentieth-century communities: the behaviors that triggered exclusion became so contested that the practice faded not through repeal but through an inability to apply it consistently to any specific case.

  Is there an established term for this kind of normative collapse — where a rule dies not through rejection of its content, but through the epistemic unmooring of its extension? If so, how does it differ from ordinary vagueness in rules, from Appiah-style loss of honor's grip, and from interest-based accounts that rely on changing payoffs? If not, what's the right way to carve the phenomenon: is it a failure of common knowledge about application conditions, a semantic drift in the concept of the practice itself, or a distinct mechanism? And what are its boundaries — does it cover any ambiguous rule, or only cases where ambiguity is strategically exploited by both defenders and critics?

  Please lead with your bottom line in the first sentence — whether an established concept exists, and if not, the coined term and its core definition — then develop the reasoning, with no preamble and no restatement of the question.
reasoning: |-
  Hmm, the user is describing a fascinating pattern of normative collapse where social practices fade not through explicit rejection, but because communities lose the shared understanding of what constitutes an instance of that practice. They give examples like dueling and shunning rituals where the criteria for application become so contested that the norm becomes impossible to enforce consistently.

  The user wants to know if there's an established term for this phenomenon - where rules die through "epistemic unmooring" rather than moral condemnation or changing interests. They're specifically distinguishing this from Appiah's honor-cascade theory, Williams' material interests explanation, and ordinary rule vagueness.

  Looking at the phenomenon described, this seems like a case of semantic decomposition of normative concepts. The core issue appears to be the loss of shared criteria for applying a concept, which goes beyond mere vagueness. In ordinary vagueness (like "bald"), we still have clear cases at the extremes. Here, even paradigm cases become contested.

  I think the closest established concept is "conceptual dissolution" in philosophy of language and social ontology, though it's not a unified theory. Searle's work on institutional facts and constitutive rules is relevant - when the collective intentionality supporting a rule breaks down, the practice collapses. Wittgenstein's notion of agreement in judgments also applies - norms require shared criteria for application to function.

  The key differences from other explanations are:
  - Unlike Appiah's honor cascades, this isn't about the value attached to honor changing, but about losing the ability to identify what counts as honorable conduct.
  - Unlike Williams' interest-based accounts, it's not about payoffs but about interpretive coordination.
  - Unlike ordinary vagueness, here the disagreement penetrates to core cases and paralyzes enforcement.

  This seems distinct from strategic ambiguity exploitation too, as the user notes - it's about a complete breakdown in shared criteria, not tactical ambiguity. The boundaries might include cases where the concept fragments into multiple irreconcilable interpretations.

  I'll propose "normative underdetermination" as a descriptive term, defined as the collapse of a social practice due to loss of shared criteria for identifying instances, making consistent application impossible. This captures the core mechanism while distinguishing it from related concepts.
answer: |-
  **No established term exists; I propose "normative underdetermination" defined as the collapse of a social practice due to the irreversible loss of shared criteria for identifying valid instances, rendering consistent application impossible.**  

  ### Core Reasoning:  
  1. **Distinction from standard explanations**:  
     - **Appiah's honor cascades** involve a *value shift* where adherence ceases because the practice loses its honor-conferring power. Your pattern centers on *epistemic coordination failure*: the community cannot agree on what constitutes a relevant instance, even if abstract support persists.  
     - **Material interest shifts** (Williams) focus on cost-benefit calculations altering behavior. Here, the norm dissolves absent changed incentives—coordination on meaning fails first.  
     - **Ordinary vagueness** (e.g., "baldness" gradients) permits functional application via precedent or focal points. Normative underdetermination occurs when *all* cases become contested, paralyzing enforcement.  

  2. **Mechanism**: This is primarily a **common knowledge breakdown** regarding application conditions. When disputants cannot agree on paradigmatic cases (e.g., "Was *this* insult a duel-worthy slight?"), the practice loses its action-guiding force. Semantic drift may contribute but isn't sufficient; the key is the *irrecoverable fragmentation* of interpretive frameworks.  

  3. **Boundaries**:  
     - **Not mere ambiguity**: Requires *systematic* disagreement that infiltrates core exemplars, making every application debatable.  
     - **Strategic exploitation is secondary**: While actors may weaponize ambiguity, the collapse is driven by the *prior erosion* of shared criteria. It applies only when defenders and critics alike lack stable reference points.  
     - **Excludes "mushy" norms**: Practices with inherent flexibility (e.g., "be polite") persist; underdetermination targets norms once perceived as discrete (e.g., dueling/shunning).  

  ### Theoretical Grounding:  
  This aligns with Wittgenstein's "rule-following paradox" (losing shared criteria for "correct" application) and Searle's institutional facts (norms collapse when collective intentionality dissolves). It differs from "pluralistic ignorance" by involving active, unresolved contention over meaning.  

  **Coined term**: *Normative underdetermination* captures the core: a rule's *extension* becomes so indeterminate that the practice cannot be sustained, regardless of its perceived validity or utility.
