prompt: |-
  I'm preparing a fifty-minute discussion section for second-year philosophy undergraduates on Augustine's account of lying in De Mendacio, and I want a teaching plan rather than the explanation itself. The students will arrive with the standard caricature—that Augustine is an unyielding absolutist who condemns every false utterance regardless of consequence—and I want them to leave with a grasp of his actual taxonomy, especially the distinction between mendacium, a falsehood spoken with intent to deceive which he always condemns, and other forms of false speech such as joking, figurative language, or erroneous belief, which he treats as morally different categories. To make the framework stick, I want to introduce, as a guiding thread, what I am calling epistemic hospitality: the idea that for Augustine lying is wrong not merely because it violates correspondence with reality but because it refuses to offer the listener a share in reality, thereby damaging the communal conditions for knowing. This framing is not standard in the textbooks, but it captures something implicit in his refusal to sanction even benevolent deception in cases like the hidden fugitive, and I want the session built around it.

  Plan the order in which these components must be introduced and why each depends on the previous one, identifying the single carrying example that should bear the weight of the whole session. I am considering the case of someone hiding a fugitive and being questioned by pursuers, but I want you to say whether that example is adequate or whether it lacks something crucial—perhaps it collapses too easily into consequentialist reasoning—and if so what should replace it, specifying exactly what properties the right example must have and must lack. Then map the misconceptions the students will form or bring: I anticipate they will conflate false statement with lying, they will invent a mental-reservation exception that Augustine never permits, and they will assume that if lying saves a life it must be permissible, and I need to know at which point in the sequence each misconception should be headed off rather than addressed only at the end. Include one question I can ask at the close that will reveal whether they have grasped the idea rather than merely memorized the prohibition, and state explicitly what should be left out at this level—for instance, whether to avoid the eightfold classification of lies entirely or only postpone it, and whether the epistemic-hospitality framing should be introduced before or after the basic taxonomy. Please present all of this in continuous prose only, with no headings, bullet points, bold text, or tables, as one would write in a letter or email.
reasoning: |-
  Okay, the user is preparing a fifty-minute discussion for second-year philosophy undergrads on Augustine's account of lying in *De Mendacio*. They want a teaching plan, not just an explanation. The students likely come in with the caricature that Augustine is an absolutist who condemns all false statements. The goal is to replace that with an understanding of his actual taxonomy, especially the distinction between *mendacium* (intentional deception) and other false speech like jokes or errors. 

  The user also wants to frame this around "epistemic hospitality" – the idea that lying denies others a share in reality, damaging communal knowledge. This framing isn't standard but captures why Augustine opposes even benevolent lies (e.g., hiding a fugitive). The user is concerned the fugitive example might invite consequentialist thinking and wants guidance on whether to use it or pick another. They also want to anticipate misconceptions: conflating falsehood with lying, inventing mental reservation exceptions, and assuming life-saving lies must be permissible. 

  The user needs a step-by-step sequence showing how concepts build on each other, with one central example carrying the whole session. They also want to know when to address each misconception, a closing question to test understanding, and what to omit (e.g., the eightfold classification of lies). 

  First, I need to assess the fugitive example. It's strong because Augustine explicitly uses it (*Contra Mendacium*), and it forces confrontation with his anti-consequentialism. But it risks students fixating on outcomes. To mitigate this, the example must be presented stripped of distracting details—no backstory about the fugitive's innocence or the pursuers' malice. Just: "You know where they are. You answer falsely." This keeps focus on the act itself. The example works if it highlights the *listener's* deprivation of truth, not the fugitive's safety. 

  However, the example alone isn't enough. It needs pairing with Augustine's core definition early on. The sequence should be: 
  1. Start with the fugitive scenario to unsettle intuitions. 
  2. Define *mendacium*: false statement + intent to deceive. Contrast with non-deceptive false speech (e.g., joking). 
  3. Introduce epistemic hospitality: lying denies the listener access to shared reality. 
  4. Return to the fugitive example to show why hospitality overrides consequences. 
  5. Preempt misconceptions at specific points: 
     - When defining *mendacium*, clarify that not all falsehoods are lies (jokes/errors are OK). 
     - When discussing hospitality, shut down mental reservation (Augustine rejects it—lying is in the intent, not just words). 
     - When revisiting the fugitive, stress that life-saving lies are still *mendacium*, hence wrong. 
  6. Closing question: "Why might Augustine say lying corrupts *both* liar and listener, even if the listener never finds out?" (Tests grasp of communal knowledge damage.) 
  7. Omit the eightfold classification entirely—it's a distraction. Introduce epistemic hospitality *after* the taxonomy to ground it. 

  The user's framing is smart. Epistemic hospitality makes Augustine's rigor make sense—it's about sustaining a community of truth-tellers. The fugitive example, if handled austerely, is ideal because it's where Augustine himself digs in. No replacement needed, but presentation is key: no moral weight on outcomes, all weight on the act of withholding truth. 

  Misconceptions should be headed off proactively: 
  - Conflation of falsehood/lying: address when defining *mendacium* (minute 10). 
  - Mental reservation: when discussing intent (minute 25). 
  - Life-saving permissibility: when revisiting fugitive case (minute 35). 

  Finally, the closing question pushes beyond rote learning to the "why." Leaving out the eightfold types keeps focus on principles, not taxonomy.
answer: |-
  Begin by confronting the caricature directly with the hidden fugitive case: pose it starkly, without embellishing the fugitive’s innocence or the pursuers’ malice—simply, "You know where they are hiding; their pursuers ask you; you lie to protect them." Let students react. This surfaces their instinctive consequentialism and establishes the problem Augustine’s rigor poses. But this example alone risks reinforcing the very utilitarianism you aim to unsettle, as students will focus on outcomes (saving a life) rather than the act’s structure. Its adequacy hinges on how you frame it: it *must* serve not to debate consequences but to expose why Augustine sees even this lie as a *relational* violation. To prevent consequentialist drift, immediately pivot from "Was it effective?" to "What did the lie *do* to the pursuer’s relationship to truth?" This primes the concept of epistemic harm.  

  Now dissect the taxonomy. Define *mendacium*: a false utterance (1) knowingly spoken (2) *with intent to deceive*. Contrast it with three non-*mendacium* examples: a sarcastic joke everyone understands ("Nice weather!" in a storm), a metaphor ("Achilles is a lion"), and an honest mistake (stating a wrong date believing it true). Stress that Augustine condemns *only* the first category. Here, preempt the first misconception: clarify that falsehood ≠ lying. Ask, "Why isn’t the joke-teller a liar, even if their words are false?" Highlight audience understanding and speaker intent. This distinction is foundational; without it, students cannot grasp Augustine’s target.  

  Next, introduce epistemic hospitality *after* establishing the taxonomy, using the fugitive case to animate it. Argue that for Augustine, lying refuses the listener’s rightful share in reality—it actively withholds truth they could use, corrupting the communal "table" of knowledge where minds meet. The pursuer isn’t merely misled; they are excluded from participation. This explains why intent matters: accidental falsehoods or shared fictions don’t *refuse* hospitality. Here, cut off the second misconception: students will suggest mental reservation (e.g., adding "in my opinion" silently) as a loophole. Emphasize Augustine’s rejection: intent to deceive is paramount, and mental reservation is still *mendacium* because it deliberately misleads. Cite his insistence that truth-telling binds us to the listener’s understanding, not verbal trickery.  

  Return to the fugitive. Reinforce that hospitality overrides consequences: even to save a life, denying truth to the pursuer poisons the social fabric of knowledge. This counters the third misconception—that life-saving lies *must* be allowed—by reframing the wrong as epistemic violence, not factual inaccuracy. Ask, "If the pursuer never discovers the lie, is harm still done?" Push students to consider the liar’s corruption and the communal trust eroded, even invisibly.  

  Close with this question: **"Augustine claims lying damages the liar’s soul. How might epistemic hospitality extend that damage to the entire community, even if no one detects the lie?"** This reveals whether they grasp the communal epistemology beneath the prohibition, moving beyond memorized rules.  

  Omit the eightfold classification entirely; its complexity obscures the core distinction for an introductory session. Focus solely on *mendacium* vs. non-deceptive falsehoods. Epistemic hospitality must follow the taxonomy; presenting it first risks vagueness, whereas grounding it in concrete categories (joke vs. lie) makes it tangible. The fugitive example, stripped of distracting details and relentlessly tied to hospitality, can bear the weight if you consistently redirect discussion from outcomes to the corrupted relationship between speaker, listener, and shared truth. Its crucial property is its emotional pull—forcing students to feel the tension between Augustine’s rigor and their instincts—while lacking any mitigating factors (e.g., the fugitive’s guilt) that invite consequentialist bargaining.
