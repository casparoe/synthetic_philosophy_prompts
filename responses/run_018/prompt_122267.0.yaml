prompt: |-
  Hey, I'm hiring a postdoc for two years to work just on the metaphysics of dispositions, specifically the mess around finks and masks. (Start from the simple conditional analysis: to have a disposition is for it to be true that you'd manifest if the stimulus happened. Finks are where the stimulus would destroy the disposition; masks block the manifestation even though the disposition stays.) I can only point them at one main question, so which should it be? The three I keep comeing back to are: (1) the retention regress — the popular 'retention' fix says you have the disposition if you have an intrinsic basis such that, if the stimulus occured and you retained that basis, you'd manifest, but 'retained' seems to smuggle in a second-order disposition that can itself be finked or masked; (2) the reverse-fink problem — the no-disposition direction, where something non-fragile gets a mechanism that makes it fragile upon being struck, so it would shatter even though it isn't fragile; and (3) a floating-mask case I made up, where the blocker only kicks in when the object actually has the categorical basis, which seems to make the fink/mask distinction collapse. Maybe there's a better fourth. I'm less interested in a survey than in the reasoning: for each, why it's upstream of the others, how tractable it is in two years for a good but not genius postdoc, and what result (a new analysis, a cleaner counterexample, a regress argument) would move it up or down. Don't bother with citations or a reading list. Please end with a final line in exactly this form: \answer{short-label}, where the label names the single question you put at the top of the ranking.
reasoning: |-
  Hmm, the user is hiring a postdoc to work on metaphysics of dispositions, specifically finks and masks. They need help choosing one main research question from three options: retention regress, reverse-fink problem, or floating-mask case. They want me to rank them based on upstream significance, tractability for a two-year postdoc project, and potential impact.

  Breaking down the three questions:

  1. Retention regress: This challenges the popular "retention" fix for finks by pointing out it creates an infinite regress of dispositions. It's fundamental because it questions whether any dispositional analysis can avoid circularity. A postdoc could map this regress rigorously and perhaps show it's fatal to retention theories. The outcome might be a strong argument against current analyses or a new approach.

  2. Reverse-fink: This involves cases where something gains a disposition only when stimulated, making it seem fragile when it's not. It tests the necessity direction of dispositional analyses. It's concrete but might be solvable with existing tools like Lewis's reformed conditional analysis. The risk is it could lead to incremental fixes rather than deep progress.

  3. Floating-mask: The user's own case where a mask activates only if the categorical basis is present, blurring the fink/mask distinction. This is innovative but might be a niche variant. Solving it could clarify the basis-role relationship, but it seems less central than the other problems.

  Assessing upstream significance: The retention regress is the most foundational because it threatens the entire project of defining dispositions without circularity. If dispositions always require other dispositions in their analysis, that's a major metaphysical hurdle. Reverse-fink and floating-mask are important but feel like specific puzzles that might be addressed if the regress is solved.

  For tractability: Retention regress is analyzable through logical structures and doesn't require genius-level insight—just careful, systematic work. In two years, a postdoc could produce a compelling critique or even a modified analysis. Reverse-fink might be too narrow, and floating-mask could become messy.

  Potential impact: A breakthrough on retention regress could reshape the field, whereas the others might yield smaller gains. The user emphasized reasoning over surveys, so a deep dive into regress aligns with that.

  The user also mentioned possibly a fourth option, but nothing obvious stands out as better than these. Retention regress clearly tops the list for driving core progress.

  Final output needs exactly: \answer{retention-regress}
answer: |-
  Here's the reasoning for ranking the three questions based on upstream significance, tractability for a 2-year postdoc project, and potential impact:

  1. **Retention Regress (1)**  
     - **Upstream Significance:** Highest. It directly attacks the structural core of *any* dispositional analysis (even beyond retentionist fixes). If "retention" smuggles in a higher-order disposition, this implies a vicious regress threatening the possibility of a reductive, non-circular analysis *at all*. Solving this could force a paradigm shift (e.g., accepting primitivism, anti-reductionism, or a radically new framework). Reverse-finks (2) and floating masks (3) are specific counterexamples; this is a meta-problem about the coherence of solutions to such counterexamples.  
     - **Tractability:** High. A postdoc can rigorously map the regress (e.g., formalize iterations, test escape routes like "freezing" bases or non-dispositional retention). It doesn’t require constructing new thought experiments but systematizing known logical pitfalls. A solid result (e.g., proving the regress is inescapable for intrinsic-basis theories) is achievable in 2 years.  
     - **Key Result Potential:** A **regress argument** killing retentionist approaches or a **new non-reductive analysis** (e.g., grounding dispositions in causal powers holistically). Success here would resolve or reframe (2)/(3) downstream.  

  2. **Reverse-Fink Problem (2)**  
     - **Upstream Significance:** Medium. It’s a critical challenge to the *sufficiency* direction of dispositional analyses (i.e., "if it would manifest, it has the disposition"). However, it’s narrower than (1) and might be solvable with refinements to existing analyses (e.g., Lewis-style reformed conditionals). It doesn’t inherently threaten the entire reductive project like (1) does.  
     - **Tractability:** High. Concrete cases (e.g., non-fragile objects gaining shattering mechanisms upon impact) are easy to tweak and test against proposals. A postdoc could catalog variants and evaluate fixes (e.g., stimulus-relative bases). Likely to yield publishable sub-results but risks incrementalism.  
     - **Key Result Potential:** A **cleaner counterexample** forcing sufficiency adjustments or a **modified conditional analysis** incorporating stimulus-triggered basis changes. Would advance the field but not revolutionize it.  

  3. **Floating-Mask Case (3)**  
     - **Upstream Significance:** Lowest. While clever, it’s a localized puzzle about the fink/mask *distinction* and the role of categorical bases. It might collapse the distinction in edge cases but doesn’t obviously generalize to undermine the broader project. Solving it might clarify basis-role semantics without impacting (1) or (2) deeply.  
     - **Tractability:** Medium. Highly original but could become a rabbit hole (e.g., debating whether the mask’s basis-sensitivity is metaphysically coherent). Risk of limited payoff if it’s seen as a quirky edge case.  
     - **Key Result Potential:** A **refined distinction** between finks/masks or a **basis-involving analysis**. Unlikely to shift foundations unless it unexpectedly connects to (1).  

  ### Final Recommendation: Retention Regress (1)  
  It’s the most upstream (targets the viability of reductive analyses), tractable (structured logical problem), and high-impact (potential for field-shifting regress argument or new analysis). Reverse-fink (2) is a safer but less transformative backup. Floating-mask (3) is intriguing but better as a secondary project.  

  \answer{retention-regress}
