prompt: |-
  You staff a municipal heritage office that must draft public plaque texts for monuments contested between groups with incompatible historical narratives — for instance, a colonial-era statue that one community honors as a founder and another condemns as an oppressor. You want a reusable decision procedure, grounded in Jain anekāntavāda — specifically the doctrines that reality is multi-faceted (anekāntavāda), that every statement expresses only one partial standpoint (naya), and that qualified assertion (syādvāda) should replace absolute affirmation or denial — to determine whether a draft plaque falsely absolutizes one narrative and, if not, how to frame it with appropriate standpoint qualifiers.

  Write the procedure as an ordered checklist your office can run in under an hour without philosophical training. Include: (1) initial classification tests distinguishing empirical disputes from evaluative framing disputes; (2) drafting rules requiring every interpretive claim to carry an explicit or implicit standpoint qualifier specifying whose naya it represents; (3) hard stop-points where the procedure rejects any draft containing unqualified hero/villain or singular-truth language, and escalation points where anekāntavāda provides no rule for ranking competing standpoints and the decision must go to a values-based board vote; (4) sentence-level test questions editors apply to flag hidden absolutism; and (5) explicit markers of irreducible judgment, such as deciding which standpoints receive equal textual space.

  Apply the procedure to three cases: (a) the colonial administrator statue, where historians dispute whether he suppressed a rebellion or maintained civil order; (b) an indigenous land-rights monument for which one group demands the phrase "stolen land" and another demands "shared territory"; and (c) one case where the procedure forces approval of a framing you personally reject, explaining precisely why anekāntavāda yields that result and identifying what the procedure cannot do — for example, it cannot assign moral weight to nayas, only prevent any single naya from being presented as exhaustive truth.

  Specify practical constraints: who signs off at each stage, what to do when primary sources conflict, and the required outputs — a qualified text, a rejection memo with the offending absolutism flagged, or an escalation form. Note where the procedure will misfire or remain silent.
reasoning: |-
  We are creating a decision procedure based on Jain anekāntavāda for drafting public plaques in contested heritage situations. The core principles are:
    1. Reality is multi-faceted (anekāntavāda) — no single narrative is complete.
    2. Every statement is from a particular standpoint (naya) and must be qualified as such.
    3. Use qualified assertion (syādvāda) — avoid absolute affirmations or denials.

   The procedure must be an ordered checklist that can be run in under an hour without philosophical training.

   Steps:
    1. Initial Classification Tests: Distinguish between empirical disputes (about facts) and evaluative framing disputes (about interpretation).
    2. Drafting Rules: Require every interpretive claim to have an explicit or implicit standpoint qualifier (i.e., whose naya it represents).
    3. Hard Stop-Points: Reject any draft containing unqualified hero/villain language or singular-truth language.
    4. Escalation Points: Where anekāntavāda cannot rank standpoints, escalate to a values-based board vote.
    5. Sentence-Level Test Questions: To flag hidden absolutism.
    6. Explicit Markers of Irreducible Judgment: E.g., deciding which standpoints get equal textual space.

   Additionally, we must specify:
     - Practical constraints: who signs off at each stage, what to do when primary sources conflict, required outputs (qualified text, rejection memo, escalation form).
     - Where the procedure misfires or remains silent.

   We will then apply the procedure to three cases.

   Checklist Procedure:

   I. PREPARATION
      - Assemble a diverse review panel (min. 3 members) including at least one historian, one community representative, and one neutral editor. 
      - Each panelist must read the draft plaque and the background dossier (containing the main contested narratives and supporting evidence).

   II. INITIAL CLASSIFICATION (15 min)
      Step 1: Identify all disputed claims in the draft. For each claim, ask:
          A. Is this an empirical dispute? (i.e., disagreement about observable facts, dates, numbers, etc.)
          B. Or is it an evaluative framing dispute? (i.e., disagreement about meaning, morality, or significance)

      Step 2: For empirical disputes:
          - If primary sources conflict, note: "Sources conflict on [specific fact]." Then move to Step 3.
          - If sources do not conflict but one narrative ignores established facts, flag for correction.

      Step 3: For evaluative disputes:
          - Note each distinct evaluative standpoint (naya) present in the background materials.

      Output from this step: A list of disputed claims with classification (empirical/evaluative) and, for evaluative, the standpoints.

   III. DRAFT REVIEW: ABSOLUTISM CHECKS (15 min)
      Step 4: Hard Stop-Points — Scan draft for:
          A. Unqualified hero/villain language (e.g., "great leader", "cruel oppressor") without attributing to a standpoint.
          B. Singular-truth language (e.g., "the truth is", "undeniably", "without question").
          C. Any claim that presents one narrative as the complete and exclusive truth.

      If found, reject the draft. Output: Rejection memo with flagged language and the reason (e.g., "Unqualified hero language: 'great leader' without standpoint qualifier").

      Step 5: Sentence-Level Test Questions — For every sentence making an interpretive claim, ask:
          A. Does this sentence contain an explicit or implicit qualifier indicating whose perspective it is? (Implicit: e.g., "To the settlers, he was a protector"; explicit: "From the perspective of the colonists, ...")
          B. If no qualifier, flag the sentence for revision.

      Step 6: Check for Balanced Representation of Standpoints (if applicable)
          - Note: The procedure does not require equal space for all standpoints (this is an irreducible judgment) but must avoid presenting one as absolute.
          - However, the panel must decide which standpoints are represented and if any major standpoint is omitted. If omission of a major standpoint leads to a false absolutism, flag for revision.

      Output: Either a list of sentences to revise or proceed.

   IV. DRAFT REVISION (if needed, 15 min)
      Step 7: For each flagged sentence:
          A. For empirical disputes: Rephrase to reflect uncertainty or conflicting sources (e.g., "Some records indicate X, while others state Y").
          B. For evaluative disputes: Add a qualifier to indicate the standpoint (e.g., "Many in the community view this as...", "To the descendants of the colonized, this event represents...").

      Step 8: Check for Syādvāda (qualified assertion) — Ensure that the text does not present any claim as absolutely true or false but as conditionally valid from a standpoint.

   V. ESCALATION POINTS (if any)
      Step 9: If the panel cannot agree on:
          - Which standpoints must be included (if space is limited) OR
          - How to qualify a claim without privileging one standpoint (when both cannot be equally represented)
          Then escalate to the Heritage Board for a values-based vote.

      Output: Escalation form noting the specific point of disagreement and the standpoints at issue.

   VI. FINAL REVIEW (5 min)
      Step 10: Ensure that the revised draft:
          - Avoids all hard-stop language.
          - Contains qualifiers for every interpretive claim.
          - Represents the main standpoints (as decided by the panel or board).

      Output: Approved plaque text.

   VII. SIGN-OFF
      - The panel chair signs the approved text or the rejection/escalation document.

   Practical Constraints:
     - Time: Under 60 minutes total.
     - Panel Composition: At least 3 members (historian, community rep, editor). Chair is the heritage office director.
     - Primary Source Conflict: In step 2, if sources conflict, we note the conflict and then in step 7A, we frame the sentence to reflect the conflict without taking a side.
     - Required Outputs: 
          Approved: Qualified plaque text.
          Rejected: Memo with flagged absolutist language.
          Escalated: Form with the unresolved issue for board vote.

   Where the procedure might misfire or remain silent:
     - It does not resolve which standpoints are more valid or morally weighty — that is left to the board vote when escalated.
     - It may not cover cases where there are more than two standpoints and space is extremely limited (then the panel must decide which to include, but the procedure does not specify how).
     - It assumes that the panel can identify the major standpoints — if they miss one, the plaque may still be biased.

   Application to Cases:

   Case (a): Colonial administrator statue
     - Disputed: Was he suppressing a rebellion or maintaining civil order?
     - Step 1: This is both empirical (what happened) and evaluative (how to frame it).
     - Step 2: If sources conflict on the events, we note: "Historical records differ on the events of [date]."
     - Step 3: Two standpoints: 
            Naya 1 (colonial descendants): He maintained order.
            Naya 2 (colonized group): He suppressed a just rebellion.
     - Draft example: "He bravely quelled a violent uprising." -> This is absolutist and from one standpoint.
     - Step 4: Hard stop: "bravely" is hero language without qualifier -> Reject.
     - Revised draft: "To colonial authorities, he was a brave maintainer of order. To the indigenous population, he was an oppressive force who suppressed their resistance."
     - Step 5: Now each claim has a qualifier -> passes.
     - Step 6: Both major standpoints are included -> passes.

   Case (b): Indigenous land-rights monument
     - Disputed: "stolen land" vs. "shared territory"
     - Step 1: Evaluative framing dispute.
     - Step 3: Standpoints:
            Naya 1 (indigenous group): The land was stolen.
            Naya 2 (settler group): The land was shared through mutual agreements.
     - Draft example: "This monument stands on stolen land." -> Absolutist (no qualifier).
     - Step 4: Hard stop: "stolen land" without qualifier -> Reject.
     - Revised draft: "For the [Indigenous Nation], this land was taken without consent. For others, the land was shared through treaties."
     - But note: The panel must decide if both standpoints are included. If the heritage office decides that only the indigenous standpoint is historically accurate (but the procedure does not decide accuracy, only representation of narratives), then we might have a problem. However, anekāntavāda requires acknowledging multiple standpoints. 
     - However, if one standpoint is empirically false (e.g., if treaties were never signed and land was taken by force), then we might frame the empirical fact and then the evaluative standpoints. But the procedure does not weigh empirical accuracy beyond noting conflicting sources. 
     - In this case, if there is empirical agreement that the land was taken by force without treaty, then the settler narrative might be factually incorrect. But the procedure in Step 2 would have noted that the sources do not conflict on the absence of treaties? Actually, Step 2 is for empirical disputes. So we must check: 
          Empirical fact: Were there treaties? If historical consensus says no, then we state: "Historical records show no treaties were signed. Some settlers believed the land was shared, but the indigenous nation consistently asserts it was taken without consent."
     - Step 5: Now we have qualifiers: "Some settlers believed", "the indigenous nation consistently asserts".

   Case (c): A case where the procedure forces approval of a framing I personally reject.
     Let's take a hypothetical: A monument to a Confederate general. 
     - Standpoints:
          Naya 1 (some Southern heritage groups): He was a hero defending states' rights.
          Naya 2 (others, including African Americans): He was a traitor who fought to preserve slavery.
     - Draft: "To many in the South, he remains a hero of liberty. To others, he represents a defense of slavery and oppression."
     - This draft passes the procedure: it has qualifiers and no absolutist language. 
     - Why anekāntavāda forces approval: The procedure does not assign moral weight. It only requires that no single naya is presented as absolute. Even if I personally reject the first standpoint (because I believe it whitewashes history), the procedure does not allow me to exclude it if it is a major standpoint held by a group. 
     - What the procedure cannot do: It cannot say which naya is more morally valid or historically accurate beyond noting empirical facts. If there is an empirical dispute (e.g., about his motivations), we note the conflict. But the evaluative standpoints must be represented as such.

     However, note: The procedure does not require giving equal credence to a standpoint that is empirically false. For instance, if the historical record clearly shows the general fought to preserve slavery (as stated in his own words), then the first standpoint might be based on a false empirical claim. Then in Step 2, we would note the empirical fact. So the revised draft might read:

          "Historical documents show the general fought to preserve slavery. Some groups nonetheless revere him as a symbol of states' rights, while others condemn him for defending slavery."

     Here, we have an empirical anchor and then the two evaluative standpoints. The procedure does not prevent stating established facts.

     But what if the heritage group disputes the empirical fact? Then if sources conflict (even if one side is a minority view), we note the conflict. However, if the heritage group's view is not supported by any primary source, then the panel might not consider it a valid naya? The procedure does not define what constitutes a valid naya. 

     We must rely on the panel to identify major standpoints (held by a significant group) and to note empirical facts. The procedure remains silent on how to handle standpoints that are based on discredited facts. We might add in Step 3: "A standpoint must be attributed to a significant community and not be based entirely on empirically disproven claims." But that gets into philosophical training. 

     Therefore, we will modify Step 3 to:

          Step 3: For evaluative disputes, note each distinct evaluative standpoint (naya) that is:
              - Held by a significant community, and
              - Not entirely based on empirical claims that have been conclusively disproven by the preponderance of evidence.

     Then, in the Confederate example, if the panel determines that the "states' rights" narrative is entirely based on disproven claims (ignoring the general's own words), they might exclude it. But note: the procedure does not require excluding, only that they note if it's disproven. They can still include it with a qualifier and the empirical fact. 

     However, the procedure does not force the panel to include a standpoint that is based on disproven facts. It only requires that if included, it must be qualified and not presented as absolute.

     But the procedure does not require including every standpoint. The panel must decide which standpoints are significant. This is an irreducible judgment.

     So in the Confederate case, if the panel decides that the "states' rights" narrative is significant (because many people believe it) and they want to include it, they can. But they must also include the other standpoint and note the empirical facts.

     However, if the panel decides that the "states' rights" narrative is not a valid standpoint because it is entirely contradicted by the evidence, they can exclude it. But then the plaque would only present one standpoint? That would violate anekāntavāda? 

     Actually, anekāntavāda does not require including every possible view, only that we do not present one view as absolute. We can present one view if it is the only significant one? But that is rarely the case in contested heritage.

     Therefore, we adjust Step 6:

          Step 6: The panel must include all standpoints that are:
              (a) significant (held by a substantial group), and 
              (b) not entirely based on empirically disproven claims (unless the disproven claim is itself part of the narrative of that group, then we note the empirical fact and then the group's belief).

     But note: anekāntavāda does not require including false standpoints. However, the procedure is about narratives, and a narrative might be false but still held by a group. We are not judging truth, but we are required to note empirical facts. So we can state the fact and then the group's belief.

     Example: "Although historical records show the general fought to preserve slavery, some groups revere him as a defender of states' rights."

     Now the procedure does not force inclusion of the first standpoint without the empirical correction. But it does require that if we mention the first standpoint, we must qualify it appropriately.

     However, if the panel decides that the first standpoint is not significant (e.g., only a fringe group holds it) then they can exclude it. The procedure does not define "significant". That's an irreducible judgment.

     So in the Confederate case, if the panel decides that the "states' rights" view is significant, then the procedure forces me to include it even if I reject it, but with the empirical correction. If the panel decides it is not significant, then they can omit it. 

     Therefore, the procedure does not force approval of a framing I reject if I can convince the panel that the standpoint is not significant or is based on disproven facts. But if the panel disagrees, then I must accept the inclusion.

     The procedure cannot resolve the underlying value conflict — it only structures the representation of multiple perspectives and prevents absolutism.

   Final Procedure Checklist:

   HERITAGE PLAQUE REVIEW CHECKLIST (Time: 60 min max)

   Panel: [Names] | Chair: [Name] | Date: 

   I. PREPARATION (5 min)
     [ ] 1. Panel reviewed draft plaque and background dossier (narratives, evidence).

   II. CLASSIFY DISPUTES (15 min)
     [ ] 2. List every disputed claim in draft.
          For each claim:
          A. Empirical? (facts, dates, numbers) 
              - If yes: Check sources. 
                  * If sources conflict: Note "Sources conflict on [claim]." 
                  * If sources do not conflict but draft ignores fact: Flag for correction.
          B. Evaluative? (meaning, morality, significance)
              - If yes: Identify standpoints (nayas). 
                  * Standpoint must be: 
                      (i) held by a significant community, and 
                      (ii) not entirely based on empirically disproven claims (unless we can note the fact and then the belief).

     Output: List of claims with classification and standpoints.

   III. DRAFT SCAN FOR ABSOLUTISM (15 min)
     [ ] 3. Hard Stop Check: 
          - Reject if unqualified hero/villain language (e.g., "hero", "villain", "great", "evil") without qualifier. 
          - Reject if singular-truth language (e.g., "undeniably", "the truth is", "without question").
          If found: Reject draft. Output rejection memo. Stop.

     [ ] 4. Sentence-Level Check: For every sentence with an interpretive claim:
          - Does it have an explicit or implicit qualifier? (e.g., "To group X...", "Many believe...")
          - If no, flag sentence.

     [ ] 5. Standpoint Inclusion Check:
          - Are all significant standpoints (from II.B) included? 
          - If not, and if omission leads to a false absolutism (i.e., presenting one as the only view), flag for revision.

     Output: List of sentences to revise OR if no flags, proceed.

   IV. REVISE DRAFT (15 min, if needed)
     [ ] 6. For each flagged sentence:
          A. Empirical conflict: Rephrase to show conflict (e.g., "Some records show X, while others show Y").
          B. Evaluative: Add qualifier (e.g., "From the perspective of group A, ...").
          C. Missing standpoint: Add a sentence representing the missing standpoint.

     [ ] 7. Syādvāda Check: Ensure no claim is presented as absolutely true/false, only conditionally from a standpoint.

   V. ESCALATION (if needed)
     [ ] 8. If panel cannot agree on:
          - Which standpoints are significant and must be included, OR
          - How to qualify without privileging one standpoint (when space is limited)
          Then escalate to Heritage Board. Output escalation form.

   VI. FINAL REVIEW (5 min)
     [ ] 9. Check that revised draft:
          - Avoids all hard-stop language.
          - Has qualifiers on every interpretive claim.
          - Includes the main standpoints (as per panel or board).

     [ ] 10. Approve text.

   VII. SIGN-OFF
     [ ] 11. Chair signs: 
          - Approved plaque text, OR
          - Rejection memo, OR
          - Escalation form.

   Outputs:
     - Approved: Final plaque text.
     - Rejected: Memo with flagged absolutist language.
     - Escalated: Form with unresolved issue for board vote.

   Misfires/Silences:
     - The procedure cannot resolve which standpoint is more valid or moral.
     - It does not define "significant" community — panel judgment.
     - It may not handle cases with more than two standpoints and limited space (panel must choose, but without guidance on how).
     - If a standpoint is based on discredited facts, the procedure requires noting the facts but does not prevent including the standpoint. The panel might exclude it if they judge it insignificant, but that is not required.
answer: |-
  ### Heritage Plaque Drafting Procedure: Anekāntavāda-Based Checklist  
  **Time Limit:** 60 minutes  
  **Panel:** 3 staff members (1 historian, 1 community liaison, 1 editor). Chair (office director) signs off.  
  **Outputs:** Approved plaque text, rejection memo (with flagged absolutism), or escalation form (for board vote).  

  ---

  #### **ORDERED CHECKLIST**  
  1. **CLASSIFY DISPUTE TYPE (10 min)**  
     - For each contested claim in the draft:  
       - **Empirical Dispute Test:** Does it center on verifiable facts (e.g., dates, events, actions)?  
         *→ If yes, note conflicting primary sources.*  
       - **Evaluative Framing Dispute Test:** Does it center on moral judgment, intent, or significance (e.g., "heroic," "oppressive")?  
         *→ If yes, list all standpoints (nayas) from background materials.*  
     - **Conflict Rule:** If primary sources conflict irreconcilably, state: "Sources conflict on [specific fact]."  
     - **Sign-off:** Panel consensus.  

  2. **FLAG ABSOLUTIST LANGUAGE (15 min)**  
     - **Hard Stop-Points:** Reject draft if any:  
       - Unqualified hero/villain labels (e.g., "visionary founder," "ruthless oppressor").  
       - Singular-truth claims (e.g., "undeniably," "the truth is," "without question").  
     - **Sentence-Level Test Questions:**  
       - Does this sentence imply its view is universal? (e.g., "This was a dark period").  
       - Is there an implicit "good vs. evil" binary? (e.g., "bravely defended against savages").  
       - Are actors described with intrinsic moral traits? (e.g., "noble," "cruel").  
     - **Output:** Rejection memo quoting flagged phrases. Stop if triggered.  

  3. **APPLY STANDPOINT QUALIFIERS (SYĀDVĀDA) (20 min)**  
     - **Drafting Rules:**  
       - Every interpretive claim must include:  
         - Explicit qualifier (e.g., "To [Group X], this was...").  
         - Implicit qualifier via framing (e.g., "Many settlers viewed him as...").  
       - Empirical claims *with* consensus need no qualifier; disputed facts use: "Some records state X, others Y."  
     - **Irreducible Judgment Marker:**  
       - Assign equal textual space to major standpoints (≥20% community support per surveys). If space limits, use: "Multiple perspectives exist..." and cite sources.  
     - **Sign-off:** Editor verifies qualifiers.  

  4. **ESCALATION POINTS (10 min)**  
     - **Escalate if:**  
       - Standpoints are incompatible *and* no empirical anchor exists (e.g., "genocide" vs. "civilizing mission").  
       - Qualifiers risk legitimizing harmful falsehoods (e.g., Holocaust denial).  
       - Equal space allocation is ethically untenable per panel.  
     - **Output:** Escalation form to heritage board for values-based vote.  

  5. **FINAL REVIEW (5 min)**  
     - Verify all interpretive claims have qualifiers.  
     - Remove passive voice that obscures agency (e.g., "mistakes were made" → "The administration’s policies harmed...").  
     - **Output:** Approved plaque text or restart at Step 2.  

  ---

  ### **APPLICATION TO CASES**  
  #### **Case (a): Colonial Administrator Statue**  
  - **Draft:** "Governor Penn suppressed the 1775 rebellion, securing peace for the colony."  
  - **Step 1:** Empirical dispute (Did Penn "suppress rebellion" or "maintain order"?). Evaluative dispute ("securing peace" vs. "enforcing oppression").  
  - **Step 2:** *Hard stop*: "Securing peace" is an unqualified positive framing. Rejection memo: "Absolutist hero language."  
  - **Revision:** "To colonial records, Penn suppressed a 1775 uprising to maintain order. To the Lenape Nation, this was a violent suppression of resistance to land seizures."  
  - **Outcome:** Approved. Qualifiers frame both nayas.  

  #### **Case (b): Indigenous Land-Rights Monument**  
  - **Draft:** "This park is on stolen Indigenous land."  
  - **Step 1:** Evaluative dispute ("stolen" vs. "shared"). No empirical conflict (land transfer documents exist).  
  - **Step 2:** *Hard stop*: "Stolen" is an unqualified villain framing. Rejection memo: "Absolutist language denies settler standpoint."  
  - **Revision:** "To the Lakota people, this land was taken without consent. Some settlers viewed it as territory shared under treaty."  
  - **Escalation Point:** Panel escalates if "shared" narrative lacks evidence. Board votes on including it.  
  - **Outcome:** Approved with qualifiers.  

  #### **Case (c): Confederate General Statue (Procedure Forces Approval of Rejected Framing)**  
  - **Draft:** "General Lee heroically defended Virginia’s values."  
  - **Step 1:** Evaluative dispute ("heroic" vs. "traitorous").  
  - **Step 2:** *Hard stop*: "Heroically" is unqualified. Rejection memo issued.  
  - **Revision:** "To many White Southerners, Lee defended regional autonomy. To many African Americans, he symbolized treason to preserve slavery."  
  - **Why Anekāntavāda Demands Approval:**  
    - The procedure *cannot* judge moral weight; it only prevents any naya from being presented as absolute truth.  
    - Personal rejection of the "regional autonomy" framing is irrelevant—the standpoint exists historically and must be qualified, not silenced.  
  - **What the Procedure Cannot Do:**  
    - Assign blame or validate standpoints. It only ensures no single narrative monopolizes truth.  
    - Resolve when a standpoint causes harm (e.g., neo-Confederate propaganda). This triggers escalation to the board.  

  ---

  ### **PRACTICAL CONSTRAINTS**  
  - **Who Signs Off:**  
    - Steps 1–2: Panel consensus.  
    - Step 3: Editor + community liaison.  
    - Step 4: Chair submits escalation form.  
    - Step 5: Chair approves final text.  
  - **Conflicting Primary Sources:** Use "Sources conflict on X" or cite competing archives.  
  - **Outputs:**  
    - Approved: Text with qualifiers.  
    - Rejected: Memo with flagged phrases.  
    - Escalated: Form detailing standpoints for board vote.  
  - **Limitations:**  
    - Misfires if standpoints are artificially "balanced" when one lacks evidence (e.g., climate denial).  
    - Silent on standpoints with minimal support (<20% per surveys).  
    - Cannot override legal/human rights norms (e.g., genocide denial). Escalate immediately.
