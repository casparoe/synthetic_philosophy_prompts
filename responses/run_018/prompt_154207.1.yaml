answer: |-
  Ranking those three attempts to salvage lexical priority against the commensurability objection requires looking at how well each genuinely preserves a fundamental break between pain and pleasure beyond a point, without just becoming a disguised version of regular negative utilitarianism (NU) that merely weights suffering overwhelmingly heavily. Let's take them in order of effectiveness.

  The strongest contender is actually your local-denial hybrid. By restricting incommensurability to specific, localized "pain neighborhoods" around intense suffering events or states, it directly tackles the commensurability objection head-on where it bites hardest. Within that small domain, comparing the intense pain to *any* amount of pleasure really is meaningless – they operate on different planes. Crucially, this model *doesn't* require global incommensurability. Outside those localized pain zones, comparisons between lesser pains and pleasures, or even aggregations across different individuals where no one is in a "neighborhood," can still function using standard utilitarian calculus. This avoids the absurdities of global lexicality (like a single minor pain above threshold nullifying all planetary pleasure) because the incommensurability is contextually contained. It genuinely prevents intense suffering from being "traded off" against pleasure *locally* without collapsing into NU globally, as comparisons and trade-offs resume once you step outside the defined pain neighborhood. The challenge is rigorously defining the boundaries of these neighborhoods, but conceptually, it preserves the core lexical intuition where it matters most.

  Next comes the weighted discontinuity model. This tries a mathematical sleight of hand: pain and pleasure share a common metric (say, utility points), but the conversion rate between them becomes infinitely unfavorable to pain as suffering approaches zero. A tiny bit of intense suffering might "cost" billions of utility points to offset, functionally making it incomparable to pleasure in practical calculations. It *feels* lexical near the threshold. However, this is the one most vulnerable to collapsing back into standard NU. Because they share a metric, *technically* commensurability holds. An astronomically large amount of pleasure *could*, in principle, mathematically outweigh even the most excruciating pain – it's just practically impossible. The "infinite" weighting near zero is a limit concept, not a true break. A committed utilitarian could argue we just haven't found enough pleasure yet, undermining the absolute lexical claim. While it approximates lexicality effectively for realistic scenarios, it doesn't establish a genuine metaphysical or qualitative difference; it's just extreme weighting within a single scale, making it functionally similar to NU with an immense priority for suffering reduction near the threshold.

  Finally, the strict lexical ordering ranks last for handling the commensurability objection without collapsing. Its rule is simple: any pain above a fixed threshold automatically outweighs *any* amount of pleasure, period. This explicitly embraces incommensurability for values above and below the threshold. The problem is its rigidity creates fatal incoherencies within utilitarian calculus itself. Imagine two worlds: World A has one person experiencing pain just barely above the threshold, and a billion people experiencing immense pleasure. World B has no one above the threshold, but everyone endures constant, grinding misery just *below* the threshold. Strict lexicality forces us to prefer World B, as World A has an instance of the dominating bad. This violates fundamental utilitarian intuitions about aggregation and leads to conclusions many find absurd (prioritizing eliminating one instance of severe pain over preventing vast amounts of lesser suffering). More crucially, it struggles with *defining* the threshold non-arbitrarily and handling marginal cases. While it most boldly asserts incommensurability, its practical implications create internal contradictions within the utilitarian framework that are arguably *more* damaging than the original commensurability objection, and its absolute nature makes it difficult to distinguish in outcome from an NU that simply defines *all* suffering reduction as lexically prior to pleasure promotion.

  So, your hybrid model lands first because it surgically applies incommensurability only where the lexical intuition is strongest (intense local suffering) while preserving utilitarian commensurability elsewhere. The discontinuity model comes second by mimicking lexicality through extreme math but retaining a shared metric that leaves the door open to NU. The strict lexical view, despite its boldness, ranks last because its global incommensurability creates untenable results that arguably break utilitarian aggregation worse than the problem it tries to solve. The core tension remains: true incommensurability might be philosophically appealing for intense suffering, but it's mathematically indigestible for a calculus demanding single-value comparisons. Your hybrid offers the most plausible way to quarantine that indigestibility.
