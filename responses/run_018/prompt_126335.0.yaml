  Ultimately, Jaspers' framework survives better without the analogy. His metaphysical guilt (solidarity in human failing) and moral guilt (continuous responsibility) can't be contained in property logic. The house picture's real hidden work is making structural injustice look like a one-time property defect rather than living legacy. 

