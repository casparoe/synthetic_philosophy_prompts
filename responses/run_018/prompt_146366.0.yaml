  "Right, mate," he rasps, eyes glinting like wet tarmac. "I'm a transdimensional being, see? Got a button 'ere," he taps a suspiciously normal-looking TV remote, "that *either* annihilates all possible afterlives *or* grants you infinite bliss across infinite multiverses. Gimme a tenner or I press it. Your call."

  You pause, the warm ale halfway to your lips. Your mind races:
