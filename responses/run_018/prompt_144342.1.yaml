answer: |-
  Here's a full audit of the "immune response" analogy for collective remembrance, addressing all specified components:

  ### 1. Explicit Mapping of the Analogy
  - **Past Injustice**: Pathogen (disease-causing agent)
  - **Collective Commemoration**: Immune memory (antibodies/T-cells storing pathogen-specific information)
  - **Paralyzing Grievance Culture**: Autoimmune disorder (immune system attacks healthy tissue)
  - **Mechanisms of Amnesty/Archival Suppression**: Immune tolerance (suppression of response to non-threats/self-antigens)
  - **Healthy Polity**: Immune homeostasis (balanced state preventing infection/autoimmunity)

  ### 2. Imported Biological Features Without Social Counterparts
  - **Non-Moral Biological Function**: Immune responses lack ethical deliberation; antibodies don't "choose" targets based on desert. Societies *must* make moral judgments about culpability and victimhood.
  - **Metabolic Regulation**: Tolerance arises from biochemical signaling (e.g., T-reg cells), not ethical reasoning. Amnesty requires normative justification.
  - **Absence of Interpretive Flexibility**: Immune memory is biologically encoded; social memory is narratively constructed and contested.
  - **Automatic Pathogen Recognition**: Antigens trigger preset responses; societies debate *what constitutes* an injustice requiring remembrance.
  - **Non-Intentionality**: Autoimmunity isn't "pathological obsession" but mechanistic error; grievance cultures involve conscious political agency.

  ### 3. Disanalogies Undermining vs. Decorative
  - **Undermining Disanalogies**:
    - **Moral Agency Gap**: The analogy's core flaw. Immune systems don't choose tolerance; societies *do*. This collapses the normative case for *duty-based* remembrance, framing it as mere prophylaxis rather than ethical obligation.  
    - **Suffering Neutrality**: Immune systems can't distinguish victims from perpetrators ("self-attack"); societies *must*. This implicitly justifies suppressing marginalized voices as "inflammatory."  
    - **Regulation Mechanism**: Tolerance is biological; forgetting is political. The analogy naturalizes power-laden decisions as "metabolic necessity."  
    → **Net Effect**: The analogy asymmetrically strengthens the "right to forget" (medicalized as homeostasis) while weakening the "duty to remember" (reduced to optional immunity).

  - **Decorative Disanalogies**:  
    - Precision of memory (antibodies vs. fuzzy historiography)  
    - Speed of response (immune reactivity vs. generational memory)  
    → These don't critically impair the argument.

  ### 4. Impact of Exposing Hidden Commitments
  - **"Tolerance" as Medicalized Politics**: Framing forgetting as *biological necessity* obscures its ethical dimension. Example: Amnesty for perpetrators becomes "metabolic regulation," avoiding questions of justice.  
  - **Whose Inflammation Counts?**: The analogy implicitly centers majoritarian comfort. Minorities demanding redress become "autoimmune" threats, pathologizing dissent.  
  - **Collapse of Duty**: Remembrance becomes optional "inoculation" rather than moral debt. The conclusion about "calibration" survives only by privileging stability over justice.  

  ### 5. Alternative Analogies & Assessment  
  - **Archival Curation with Retention Schedules**:  
    - **Strengths**: Explicitly acknowledges *curatorial agency*; separates preservation (duty) from access (forgetting); accepts impermanence as institutional choice, not biology.  
    - **Improvement**: Avoids medicalizing forgetting; allows ethical debate over retention criteria.  

  - **Scar Tissue**:  
    - **Strengths**: Captures how remembrance *marks* injury but can *restrict* movement; healing ≠ erasure.  
    - **Limitation**: Still biological; risks implying past injustice is "healed" prematurely.  

  - **Debt Accounting with Statutes of Limitation**:  
    - **Strengths**: Explicitly moral framework ("debt"); statutes acknowledge *expiration* requires justification; distinguishes reparations (paid) from amnesty (forgiven).  
    - **Best Alternative**: Centers ethics over biology; "statutes" are transparently political decisions; preserves duty language while licensing limited forgetting.  

  **Verdict**: The immune analogy fails normatively by smuggling in biological determinism to evade political accountability. **Debt accounting** best preserves the tension between duty (unpaid debts) and forgetting (statutes) without covert bias, while **archival curation** best separates technical from ethical choices. Both alternatives treat remembrance/forgetting as *moral practices*, not natural processes.
