  We are going to design an example in the context of public-health resource allocation. The problem involves deciding between two actions (A and B) for combating a disease in two different regions (Region 1 and Region 2). The uncertainty is about the effectiveness (in terms of probability of success) of a new vaccine. The credal set is an interval of probabilities for the vaccine's success rate in Region 1 (and similarly in Region 2, but the example will focus on one parameter that affects both regions through a common cause).

  **Decision Context:**

  A public health agency must allocate a fixed budget to one of two programs:
  - **Action A**: Invest in a vaccination program for Region 1.
  - **Action B**: Invest in a vaccination program for Region 2.

  The outcomes (number of lives saved) depend on the effectiveness of the vaccine. The effectiveness is uncertain and is represented by a parameter θ, which is the probability that the vaccine prevents the disease in an individual. The agency's experts believe that θ is in the interval [0.4, 0.6] for both regions (the same vaccine is used in both). However, the disease burden is different in the two regions:

  - In Region 1, there are 1000 people at risk. Without the vaccine, all of them would get the disease and 10% would die (so 100 deaths). With the vaccine, the number of deaths would be reduced by preventing the disease. The expected number of deaths with the vaccine is 1000 * (1-θ) * 0.1 = 100*(1-θ). Therefore, the number of lives saved by the vaccine in Region 1 is: 100 - 100*(1-θ) = 100θ.

  - In Region 2, there are 500 people at risk. Without the vaccine, 50% would die (so 250 deaths). With the vaccine, the expected number of deaths is 500 * (1-θ) * 0.5 = 250*(1-θ). Therefore, the number of lives saved in Region 2 is: 250 - 250*(1-θ) = 250θ.

  So the welfare (lives saved) from each action is:
  - Action A: 100θ
  - Action B: 250θ

  Note that since θ is between 0.4 and 0.6, the welfare from A is between 40 and 60, and from B is between 100 and 150. Clearly, for every θ in [0.4,0.6], 250θ > 100θ, so B is always better. But we want a reversal, so we need to adjust the example.

  Let's change the setting:

  **Revised Decision Context:**

  The vaccine effectiveness θ is still in [0.4, 0.6]. However, the two regions have different characteristics:

  - In Region 1, the vaccine is known to be safe and effective. The population is 1000. Without the vaccine, 10% die (100 deaths). With the vaccine, the expected deaths are 1000 * (1-θ) * 0.1 = 100(1-θ). Lives saved by the vaccine: 100 - 100(1-θ) = 100θ.

  - In Region 2, there is an additional risk: if the vaccine is less effective than a certain threshold, it might cause a severe adverse reaction in a subset of the population. Specifically, if θ < 0.5, then 10% of the vaccinated population in Region 2 (which is 500) will experience a severe adverse reaction that leads to death (so 50 deaths). If θ >= 0.5, then no adverse reaction occurs. Moreover, without the vaccine, 50% of the 500 people would die (250 deaths). With the vaccine, the disease-related deaths are 500 * (1-θ) * 0.5 = 250(1-θ). Additionally, if θ < 0.5, there are 50 deaths from adverse reactions. Therefore, the total deaths in Region 2 with the vaccine are:
    - If θ >= 0.5: 250(1-θ)
    - If θ < 0.5: 250(1-θ) + 50

  Hence, the lives saved in Region 2 are:
    - If θ >= 0.5: 250 - 250(1-θ) = 250θ
    - If θ < 0.5: 250 - [250(1-θ) + 50] = 250θ - 50

  So we have:
  - Action A: 100θ (always, for θ in [0.4,0.6])
  - Action B: 
      - 250θ, if θ >= 0.5
      - 250θ - 50, if θ < 0.5

  Now, we consider the credal set: θ ∈ [0.4, 0.6]. The decision maker uses a max-min (ambiguity averse) criterion.

  **Initial Decision (before evidence):**

  We compute the worst-case welfare for each action over θ in [0.4, 0.6].

