  To get a reversal, we want that in the initial interval the worst case for B is 0 (so worse than A) and in the narrowed interval the worst case for B becomes positive and higher than the worst case for A.

  But note: the adverse event for B (getting 0) happens when X>5.5. In the initial interval [4,6], the part (5.5,6] has positive length, so the worst case is 0. In the narrowed interval [4.5,5.5], note that 5.5 is included. If we define the welfare at 5.5 as 15*5.5 (which is 82.5), then the worst case in [4.5,5.5] for B would be the minimum over [4.5,5.5] which is 15*4.5=67.5 (if we assume the function is continuous and increasing). But then 67.5 > 10*4.5=45. So we would choose B after the update.

  But in the initial interval, we had 0 as a possibility for B, which is worse than 40. So:

  Initial: 
     A: 40
     B: 0   --> choose A

  After update:
     A: 45
     B: 67.5 (minimum in [4.5,5.5] is at 4.5: 67.5) --> choose B

  This gives the reversal.

  However, note that in the initial interval, the worst-case for B was 0 (at X=6, for example) but after the update, the worst-case for B is 67.5. The key is that the interval [4.5,5.5] does not include any X>5.5, so the adverse event (which causes 0) is no longer in the credal set.

  But why is the worst-case for B in the initial set 0? Because we consider the minimum over [4,6]. The minimum occurs at X=6? Actually, at X=6 the welfare is 0. But in the updated set, the worst case for B is at the lower end? Yes, because the function for B is increasing in [4.5,5.5] (and then drops to 0 after 5.5, but we don't have any X>5.5 in the updated set).

  So let's formalize:

  **Final Climate-Adaptation Example:**

  - Action A: W_A(X) = 10 * X
  - Action B: W_B(X) = 
         15 * X, if X <= 5.5
         0,      if X > 5.5

  Initial credal set: K0 = [4, 6]

  After evidence: K1 = [4.5, 5.5]

  **Initial Decision (with K0):**

