  - min_{θ in [0.4,0.6]} 100θ = 100 * 0.4 = 40

  For Action B:
  - We must consider the piecewise definition. The interval [0.4,0.6] is split at 0.5.
    - For θ in [0.4, 0.5): welfare = 250θ - 50 → minimum at θ=0.4: 250*0.4 - 50 = 100 - 50 = 50
    - For θ in [0.5, 0.6]: welfare = 250θ → minimum at θ=0.5: 250*0.5 = 125
  - So the overall minimum for Action B is min(50, 125) = 50.

