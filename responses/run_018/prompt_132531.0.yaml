  - **Action B**: Welfare = 
       15 * X, if X <= 5.5
       0, if X > 5.5

  Initial credal set: X ∈ [4, 6]

  Action A: min = 10*4 = 40

  Action B:
     - [4,5.5]: min at 4: 15*4 = 60
     - (5.5,6]: min=0
