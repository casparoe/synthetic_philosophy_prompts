            = 0.75 * (15 * 4.75) = 0.75 * 71.25 = 53.4375

  So initially, E[W_B] = 53.4375 > 50, so the Bayesian would choose B.

  After update: 
     The prior becomes uniform on [4.5,5.5]. Then:
        E[W_A] = 10 * 5 = 50
        E[W_B] = 1 * 15 * E[X] = 15 * 5 = 75

  So still B is chosen. There is no reversal.

  Therefore, the reversal is peculiar to the max-min rule with imprecise probabilities updated by set restriction. It shows that without dynamic consistency, one can get reversals that seem irrational.

  **Conclusion:**

  The example demonstrates a reversal due to the change in the worst-case scenario when the credal set is updated. The conceptual issue is the failure of dynamic consistency in the max-min decision rule when combined with set-based updates. This suggests that if we wish to avoid such reversals, we might need to use a dynamically consistent decision rule or to resolve the imprecision into a precise prior before updating and deciding.
answer: |-
  ### Example: Public-Health Resource Allocation for Disease Prevention

  **Decision Context:**  
  A health agency must allocate a fixed budget to one of two vaccination programs for a novel infectious disease. The key uncertainty is the vaccine's efficacy rate, denoted by a parameter \(\theta\) (the probability that vaccination prevents infection). The agency represents uncertainty about \(\theta\) as a **credal set**—an interval \([\theta_{\text{min}}, \theta_{\text{max}}]\). 

  - **Action A**: Roll out the vaccine to **Urban Area** (high population density).  
    - Population: 200,000 people.  
    - Without vaccination, all become infected, with a 0.5% fatality rate → 1,000 expected deaths.  
    - With vaccination, expected deaths = \(200,000 \times (1 - \theta) \times 0.005 = 1,000(1 - \theta)\).  
    - **Lives saved by A**: \(1,000 - 1,000(1 - \theta) = \boxed{1,000\theta}\).  

  - **Action B**: Roll out the vaccine to **Rural Area** (vulnerable infrastructure).  
    - Population: 80,000 people.  
    - Without vaccination, all become infected, with a 2.5% fatality rate → 2,000 expected deaths.  
    - **Critical constraint**: Vaccine storage requires refrigeration. If \(\theta < 0.55\), rural cold-chain failures spoil 50% of doses, leading to **zero protection** (no lives saved).  
    - If \(\theta \geq 0.55\), cold-chain is maintained → lives saved = \(2,000 - 2,000(1 - \theta) = \boxed{2,000\theta}\).  
    - If \(\theta < 0.55\), spoiled doses → lives saved = \(\boxed{0}\).  

  **Welfare Structure:**  
  - Payoff = lives saved.  
  - Agency uses **maximin decision rule**: Choose action with the highest worst-case payoff over \(\theta \in [\theta_{\text{min}}, \theta_{\text{max}}]\).  

  ---

  ### Numerical Setup for Reversal
  **Initial Credal Set:** \(\theta \in [0.50, 0.60]\)  
  - **Action A**:  
    - Payoff = \(1,000\theta\).  
    - Worst case: \(\theta = 0.50\) → \(1,000 \times 0.50 = 500\).  
  - **Action B**:  
    - Payoff = \(\begin{cases} 
        0 & \theta < 0.55 \\
        2,000\theta & \theta \geq 0.55 
      \end{cases}\)  
    - Worst case: At \(\theta = 0.50\) (where B yields 0), as \(0 < 2,000\theta\) for all \(\theta \geq 0.55\).  
    - Worst-case payoff = \(0\).  
  - **Decision**:  
    - Maximin payoff: A (500) vs. B (0) → **Choose A**.  

  ---

  **After New Evidence:**  
  New data symmetrically narrows the credal set to \(\theta \in [0.53, 0.57]\) (center remains 0.55).  
  - **Action A**:  
    - Worst case: \(\theta = 0.53\) → \(1,000 \times 0.53 = 530\).  
  - **Action B**:  
    - Payoff still depends on \(\theta\) relative to 0.55.  
    - For \(\theta \in [0.53, 0.55)\): payoff = 0.  
    - For \(\theta \in [0.55, 0.57]\): payoff = \(2,000\theta\) (min at \(\theta = 0.55\) → \(2,000 \times 0.55 = 1,100\)).  
    - Worst-case payoff: \(\min(0, 1,100) = 0\) (at any \(\theta < 0.55\)).  
  - **Decision**:  
    - Maximin payoff: A (530) vs. B (0) → **Still choose A?**  
    - **But wait**: The worst case for B is still 0, and 530 > 0. **No reversal yet.**  

  **Adjustment to Achieve Reversal:**  
  Modify Action B’s constraint to depend on a **threshold within the narrowed interval**:  
  - **Revised Action B**: Cold-chain fails if \(\theta < 0.54\) (instead of 0.55).  
  - Initial credal set: \(\theta \in [0.50, 0.60]\), threshold = 0.54.  
  - After evidence: \(\theta \in [0.53, 0.57]\), threshold = 0.54.  

  **Initial Decision (Credal Set: \(\theta \in [0.50, 0.60]\)):**  
  - **Action B**:  
    - Payoff = \(\begin{cases} 
        0 & \theta < 0.54 \\
        2,000\theta & \theta \geq 0.54 
      \end{cases}\)  
    - Worst case: At \(\theta = 0.53\) (just below 0.54) → payoff = 0.  
  - **Action A**: Worst case = \(1,000 \times 0.50 = 500\).  
  - **Maximin**: A (500) > B (0) → **Choose A**.  

  **After Evidence (Credal Set: \(\theta \in [0.53, 0.57]\)):**  
  - **Action B**:  
    - For \(\theta \in [0.53, 0.54)\): payoff = 0.  
    - For \(\theta \in [0.54, 0.57]\): payoff = \(2,000\theta\) (min at \(\theta = 0.54\) → \(2,000 \times 0.54 = 1,080\)).  
    - **Worst-case payoff**: \(\min(0, 1,080) = 0\) (still).  
  - **Action A**: Worst case = \(1,000 \times 0.53 = 530\).  
  - **Maximin**: 530 > 0 → **Still A?**  

  **Final Adjustment for Clean Reversal:**  
  - **Action B**: Cold-chain fails if \(\theta < 0.55\), but payoff when \(\theta \geq 0.55\) is **nonlinear** to shift the worst case:  
    - Payoff = \(\begin{cases} 
        0 & \theta < 0.55 \\
        \mathbf{80,000} \times (\theta - 0.55) & \theta \geq 0.55 
      \end{cases}\)  
    - *Intuition*: High gains only if \(\theta\) is *well above* 0.55.  

  **Initial Decision (Credal Set: \(\theta \in [0.50, 0.60]\)):**  
  - **Action A**:  
    - Worst case: \(\theta = 0.50\) → \(1,000 \times 0.50 = 500\).  
  - **Action B**:  
    - For \(\theta < 0.55\): payoff = 0.  
    - For \(\theta \geq 0.55\): payoff = \(80,000(\theta - 0.55)\).  
      - At \(\theta = 0.55\): \(80,000 \times 0 = 0\).  
      - At \(\theta = 0.60\): \(80,000 \times 0.05 = 4,000\).  
    - **Worst-case payoff**: 0 (achieved for all \(\theta < 0.55\) and at \(\theta = 0.55\)).  
  - **Maximin**: A (500) > B (0) → **Choose A**.  

  **After Evidence (Credal Set: \(\theta \in [0.53, 0.57]\)):**  
  - **Action A**:  
    - Worst case: \(\theta = 0.53\) → \(1,000 \times 0.53 = 530\).  
  - **Action B**:  
    - For \(\theta \in [0.53, 0.55)\): payoff = 0.  
    - For \(\theta \in [0.55, 0.57]\): payoff = \(80,000(\theta - 0.55)\).  
      - Minimum occurs at \(\theta = 0.55\) → \(80,000 \times 0 = 0\).  
      - At \(\theta = 0.57\): \(80,000 \times 0.02 = 1,600\).  
    - **Worst-case payoff**: 0 (at \(\theta = 0.55\)).  
  - **Maximin**: A (530) > B (0) → **Still A?**  

  **Achieving the Reversal:**  
  To ensure reversal, make the worst case for B **migrate upward** in the narrowed interval:  
  - Set the threshold **at the center** (0.55), but define B’s payoff for \(\theta \geq 0.55\) to be **decreasing** near 0.55:  
    - Payoff for B when \(\theta \geq 0.55\): \(\mathbf{2,000} \times \mathbf{(0.60 - \theta)}\).  

  **Revised Action B**:  
  - Payoff = \(\begin{cases} 
        0 & \theta < 0.55 \\
        2,000 \times (0.60 - \theta) & \theta \geq 0.55 
      \end{cases}\)  

  **Initial Decision (Credal Set: \(\theta \in [0.50, 0.60]\)):**  
  - **Action A**: Worst case = \(1,000 \times 0.50 = 500\).  
  - **Action B**:  
    - For \(\theta < 0.55\): payoff = 0.  
    - For \(\theta \geq 0.55\): payoff = \(2,000(0.60 - \theta)\).  
      - At \(\theta = 0.55\): \(2,000 \times 0.05 = 100\).  
      - At \(\theta = 0.60\): \(2,000 \times 0 = 0\).  
    - **Worst-case payoff**: \(\min(0, 100, 0) = 0\) (at \(\theta = 0.60\) or \(\theta < 0.55\)).  
  - **Maximin**: A (500) > B (0) → **Choose A**.  

