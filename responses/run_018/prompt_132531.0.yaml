  - For B: 
       - For X in [4, 5.5]: min is 15*4 = 60 (at X=4)
       - For X in (5.5,6]: min is 0 (at any X>5.5)
       - The overall minimum for B is 0 (which is less than 60)

  So the worst-case welfare for B is 0.

  Maximin: 
     A: 40, B: 0 -> choose A.

  **After Evidence (with K1 = [4.5,5.5]):**

  Note: K1 does not include any X>5.5. So for B, we only have the increasing part.

  - For A: min_{X in [4.5,5.5]} 10X = 10*4.5 = 45
  - For B: min_{X in [4.5,5.5]} 15X = 15*4.5 = 67.5

  Maximin:
     A: 45, B: 67.5 -> choose B.

  Reversal: initially A, then after evidence B.

  **Why is this reversal counterintuitive?**

  The agent's beliefs about X have been narrowed symmetrically: the new interval is a subset of the old one and centered at the same point (5). The agent now rules out both very low (below 4.5) and very high (above 5.5) values. In particular, they rule out the catastrophic scenario for B (X>5.5) that made B's worst case 0. But they also rule out the very low scenario (X=4) that was the worst case for A. However, the elimination of the catastrophic scenario for B (which was the reason B was avoided initially) makes B now look better. Meanwhile, the elimination of the low scenario for A (which was the worst case for A) raises the worst case for A from 40 to 45, but that is still less than the new worst case for B (67.5).

  The counterintuitive aspect is that the evidence does not shift the center and symmetrically narrows the interval. One might think that the relative attractiveness of A and B should not change, but it does because the worst-case scenario for B (which was in the high end) is eliminated, while the worst-case scenario for A (which was at the low end) is also eliminated. However, the function for B is steeper in the remaining interval and has a higher minimum.

  **Diagnosis:**

  The reversal is a manifestation of the lack of dynamic consistency. In a dynamically consistent framework, if an action is chosen initially, then after receiving information and updating, that action should still be chosen (unless the update reveals that the initial choice was based on an event that has not occurred). Here, the update does not reveal that the initial worst-case scenario for B (X>5.5) was impossible, but rather that it is ruled out by the evidence. However, the initial decision was made under the possibility of X>5.5, and the new decision is made without that possibility.

  The reversal also highlights that updating a credal set by conditioning (if we had a set of priors) is not as straightforward as in Bayesian updating. In this example, we simply intersected the interval with the evidence (which we didn't specify, but we assumed the evidence tells us that X is between 4.5 and 5.5). This is a form of updating that is sometimes called "conditioning by set restriction". However, in a more general imprecise probability setting, conditioning a set of priors by an event E would involve conditioning each prior in the set on E. But in this example, we did not condition on an event but rather narrowed the interval symmetrically. 

  In fact, if we interpret the evidence as providing an interval, the update is done by intersection. This is a valid update rule in some imprecise probability models (like the interval model). However, it does not satisfy the dynamic consistency property.

  This example suggests that ambiguity aversion (as captured by max-min) combined with imprecise probabilities updated by set restriction can lead to reversals that violate dynamic consistency. One way to avoid this is to require a dynamic updating rule that is consistent with the initial representation. Alternatively, it might be argued that the initial max-min rule should be applied to the entire decision tree (including future updates) in a consistent manner, which would require a more sophisticated approach (like robust dynamic programming). 

  Another viewpoint is that rational choice under ambiguity should require resolving the imprecision into a precise prior before making decisions (i.e., being Bayesian). In that case, the agent would choose a single prior from the credal set and then update it, and the reversal might not occur. For example, if the agent had a uniform prior over [4,6] and updated to a uniform prior over [4.5,5.5], then the expected utilities would be:

  Initially:
     E[W_A] = 10 * E[X] = 10 * 5 = 50
     E[W_B] = P(X<=5.5) * E[15X | X<=5.5] + P(X>5.5) * 0
            = ( (5.5-4)/(6-4) ) * (15 * E[X|X<=5.5]) 
