answer: |-
  This phenomenon you're describing is perceptively observed and represents a **specific, systematic flaw in the application of indirect normativity**. While it shares features with hypocrisy or inconsistency, it has a distinct structure centered on the *instrumentalization of the ideal agent's authority*. There isn't a single universally established term, but we can define it precisely and coin a fitting name.

  **Core Phenomenon:**
  *   **Ideal Agent as Bistable Authority:** The idealized agent (rational, informed self/patient/observer) is treated as having **binding normative authority** when its hypothetical conclusion aligns with the speaker's desired outcome (Mode A: Authoritative Binding). However, when the ideal agent's *likely* conclusion contradicts the speaker's desired outcome, its authority is abruptly downshifted to being an **unworkable heuristic or computational impossibility**, allowing a fallback to a simpler, often status-quo-biased, default norm (Mode B: Heuristic Rejection).
  *   **The Switch:** The key move is the *selective denial of the ideal agent's conclusion* when inconvenient, *without* abandoning the *framework* of indirect normativity itself. The speaker leverages the framework's prestige while evading its inconvenient implications.

  **Coined Term & Definition:**

  **Bistable Ideal Agency (BIA)**

  **Definition:** The fallacious deployment of indirect normativity where the normative authority attributed to an idealized agent (fully rational, informed version of self/patient/agent) *flip-flops* between two incompatible states based solely on whether its projected conclusion supports the speaker's desired practical outcome:
  1.  **Mode A (Authoritative Binding):** The ideal agent's hypothetical judgment is presented as *definitive, binding, and directly generative* of real-world obligations, overriding current preferences or uncertainty.
  2.  **Mode B (Heuristic Rejection):** The ideal agent's hypothetical judgment is dismissed as *computationally inaccessible, practically irrelevant, or merely heuristic*, justifying a retreat to a simpler, often conservative or default, normative principle (e.g., "preserve life," "maximize current utility," "follow tradition").

  **What BIA Is (Clear Boundaries):**

  1.  **Specific to Indirect Normativity:** It only occurs within frameworks relying on *idealized deliberation* (informed desire, rational choice behind a veil, idealized observer) as the source of norms. It's not general inconsistency.
  2.  **Reliance & Rejection:** It requires *using* the ideal agent framework initially and then *rejecting its specific output* while *retaining* the framework's authority for other conclusions.
  3.  **Convenience-Driven Switch:** The switch between Mode A and Mode B is motivated *primarily by the practical desirability of the outcome*, not by a principled critique of the idealization itself in that specific case (e.g., new information genuinely making the idealization invalid).
  4.  **Fallback to Simpler Default:** Mode B always involves retreating to a norm perceived as easier to apply or defend, often one favoring inaction, preservation, or established practice.
  5.  **Systematic Pattern:** It manifests as a recognizable pattern across different arguments by the same agent or within a discourse, not just a one-off error.

  **What BIA Is NOT (Distinguishing from Related Concepts):**

  1.  **NOT Simple Hypocrisy or Contradiction:** Hypocrisy involves saying one thing and doing another. Contradiction is stating inconsistent propositions. BIA is a *structural flaw within a specific normative reasoning strategy*, exploiting the ambiguity of the ideal agent's status.
  2.  **NOT Ordinary Equivocation:** Equivocation is ambiguous use of a *term*. BIA involves ambiguous use of the *epistemic and normative status of a constructed entity* (the ideal agent) within an argument.
  3.  **NOT Legitimate Kantian Regulative Use:** Kantian ideals (like the Kingdom of Ends) serve as *consistent guides for reflection and aspiration*. They are not flipped into binding authorities for convenient conclusions and then dismissed as impossible for inconvenient ones. The regulative ideal remains constant; BIA involves a *volatile* ideal.
  4.  **NOT Good-Faith Disagreement about Idealization:** It's not arguing that *in a specific context* (e.g., extreme pain impairing judgment) the idealization *is genuinely invalid*. BIA occurs when the idealization *is actively used* for one conclusion but dismissed *specifically to avoid* another conclusion it would likely generate.
  5.  **NOT Merely Applying Defaults Prudently:** Sometimes defaults *are* justified when ideal reasoning is truly inaccessible. BIA occurs when the ideal reasoning *is claimed to be accessible and authoritative* for one purpose but *inaccessible only when* it leads to an undesired result.

  **Edge Cases & Nuances:**

  *   **Genuine Uncertainty:** If there's *truly* deep, irreducible uncertainty about what the ideal agent *would* conclude (not just that it's complex, but genuinely indeterminate), appealing to a default might be legitimate. BIA occurs when the speaker asserts the ideal agent's likely conclusion *confidently* in Mode A but *suddenly* claims deep uncertainty/impossibility in Mode B for the opposing view.
  *   **Shifting Contexts:** If the contexts of the two examples are fundamentally different in ways *relevant to the idealization* (e.g., retirement involves probabilistic reasoning the ideal agent excels at, while end-of-life involves values the ideal agent might not resolve uniquely), the different treatment *might* be justified. BIA arises when the differences are exaggerated or irrelevant to the switch.
  *   **Degree of Idealization:** The flaw can occur with varying degrees of idealization (full omniscience vs. just "more informed"). The key is the inconsistent *authority* granted to the output based on outcome.
  *   **Motivation:** Proving conscious intent is hard. The pattern itself reveals the flaw, regardless of the speaker's awareness. It functions as a rhetorical dodge.

  **Why "Bistable" Works (Especially for a Chemist):**

  *   **Physics Analogy:** A bistable system has two distinct, stable states (like a flip-flop circuit or the retinal molecule rhodopsin). The ideal agent's authority in BIA flips between two "stable" but incompatible states (Binding Authority / Irrelevant Heuristic) based on an external input (convenience of the outcome).
  *   **Highlights Mechanism:** It emphasizes the *structural switching* inherent in the flaw.
  *   **Precision:** It avoids vague terms like "hypocrisy" or "inconsistency" and focuses on the *specific operation* of the ideal agent within the argument.
  *   **Memorable:** For someone with a scientific background, the analogy is intuitive.

  **In summary:** You've identified **Bistable Ideal Agency (BIA)** – the systematic, outcome-dependent switching of an idealized agent's normative status between Authoritative Binding and Heuristic Rejection within indirect normative frameworks. This flaw exploits the inherent tension in idealizations between their aspirational authority and their practical limitations, weaponizing that tension selectively to defend predetermined conclusions.
