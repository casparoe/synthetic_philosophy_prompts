answer: |-
  Here's the gut-level breakdown of the dependency issue with upamāna, keeping vyāpti/pakṣadharmatā clear:

  **The Core Worry (The Gut Punch):**
  Imagine you see a weird animal (a "gavaya") and your guide says, "It's like a cow." For upamāna to work, you need to *recognize* the similarity ("cow-likeness" or *sādṛśya*) between the gavaya and a cow. The problem is: **How do you even *know* what "cow-likeness" *is*?** You probably learned that concept *by being taught the word "cow"* and having cows pointed out to you. That teaching is **śabda** (testimony/word).

  **So the Suspicion:**
  *   Recognizing "cow-likeness" seems to *depend entirely* on prior linguistic training (śabda).
  *   Therefore, when you use analogy ("Ah, this gavaya is *like* a cow!"), you're just *reapplying* knowledge you got from words.
  *   This makes upamāna look like it's **secretly just śabda** in disguise – you're recalling and applying a verbal definition/concept you were taught, not generating genuinely *new* knowledge through a unique process. Its "independence" is an illusion.

  **Nyāya's Defense (The Counter-Punch):**
  Nyāya argues there's a crucial difference:

  1.  **śabda Gives You the *Concept*:** Yes, śabda (being told "That's a cow") teaches you the *label* and the *defining characteristics* associated with "cow". It implants the idea.
  2.  **upamāna is About *Perceiving Similarity*:** When you *later* see the gavaya, **you *directly perceive* the similarity** between its features and the *remembered* cow features. This act of *seeing* the likeness is **not** just recalling the word "cow". It's a fresh sensory/cognitive event.
  3.  **The New Knowledge:** What upamāna gives you specifically is the knowledge: **"This particular thing (gavaya) bears similarity to *that* thing I know as a cow."** You didn't know *this* about the gavaya before. śabda told you *about cows*, but it didn't tell you *about gavayas* or their relation to cows.

  **Is it Collapse or Entanglement?**
  Nyāya says **entanglement, not collapse**.
  *   **Dependency?** Yes, *in practice*, upamāna often *starts* from a śabda-based concept. You need the prior idea of "cow" (gained via śabda or perception) to even look for similarity.
  *   **But Unique Function?** Yes. The core "aha!" moment of upamāna is **the direct apprehension of similarity itself** applied to a new object. This cognitive event – *linking* the unknown thing (gavaya) to the known concept (cow) *via perceived likeness* – is distinct from simply *hearing and understanding* the word "cow" or hearing "gavayas are like cows". The *knowledge generated* ("*This* is like a cow") is novel relative to the initial śabda.

  **The Gut-Level Problem Simplified:**
  *   **Opponent:** "You can't see 'cow-likeness' unless someone *told* you what a cow is first. So analogy is just word-knowledge recycled."
  *   **Nyāya:** "Knowing *what a cow is* comes from words (or perception), sure. But *seeing that this new thing matches that idea* is a different mental act. That act *uses* the prior concept but *creates* new relational knowledge ('this is like that') you didn't have."

  **vyāpti vs. pakṣadharmatā - Keeping Them Straight (Gut-Level):**
  *   **vyāpti:** Think of it as **the universal rulebook.** It's the *general, background knowledge* of a necessary connection. E.g., "Wherever there's smoke, there's fire" (Smoke → Fire). *It's the pattern you already know is true.*
  *   **pakṣadharmatā:** Think of it as **applying the rule to the *specific case* at hand.** It's *spotting the clue* in the situation you're investigating. E.g., "Look, there's *smoke* on *that mountain* over there!" You're observing that the *specific subject* (the mountain, the *pakṣa*) has the property (dharma) mentioned in the rule's *first part* (smoke).
  *   **Analogy:** vyāpti is knowing the general rule that similar features often mean similar kinds. pakṣadharmatā is *seeing* the specific similar features *on* the gavaya itself.

  The challenge for Nyāya is convincing critics that step 2 ("directly perceiving similarity") is truly an independent *source* of knowledge and not just an automatic consequence of applying the conceptual knowledge gained via śabda. The entanglement is real, but Nyāya insists the unique cognitive act and novel knowledge output justify upamāna's status as a separate *pramāṇa*.
