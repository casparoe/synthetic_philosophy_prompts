answer: |-
  **Bottom Line:** Show that universalizing maxims fails *because* it instrumentalizes rational nature. Humanity-as-end grounds the CI procedure.

  **Teaching Arc (Under 250 Words):**

  1.  **Start with the CI Procedure:** Introduce maxims & universalization. Use a clear **perfect duty** example (e.g., false promise to repay a loan *you know you can't*). Show universalization leads to contradiction: promising collapses if everyone lied, destroying trust *needed* for the promise itself. Emphasize the contradiction is in the *concept*, not bad outcomes. *Defuse "ignores outcomes":* Point out outcomes *within* the maxim's logic matter (trust collapsing), not external consequences.
  2.  **Clarify Universalization:** Contrast with "what if everyone did it?" utilitarianism. Stress it's testing the *internal logic* of your maxim upon universal adoption. *Defuse "what if everyone did it" misconception:* The loan example shows the contradiction is self-defeat, not aggregate harm.
  3.  **Introduce Formula of Humanity:** Define rational nature as end-in-itself. Explain instrumentalization violates this. Link back: *Why* does the false promise universalization fail? Because using the lender *solely* as a means (tool for getting money) via deception disrespects their rational agency (planning based on truth). Humanity is the *ground* of the duty.
  4.  **The Beneficial Lie Case:** Use your example: Lying to a friend about liking their terrible art to spare feelings (they benefit emotionally). Apply CI: Can you universalize lying to avoid discomfort? Contradiction? Fuzzy. **Pivot to Humanity:** Does the lie treat them *only* as a means (sparing your discomfort/their pain) while denying their capacity to handle truth/choose based on reality? This reveals the *real* violation.
  5.  **Axe Murderer Case:** Apply the structure. Universalization: Lying might *seem* universalizable? But **pivot immediately to Humanity:** Lying to the murderer instrumentalizes *them* (manipulates their belief). *Crucially*, it also instrumentalizes the *friend* (treating them as an object to be hidden, denying their status as a responsible agent confronting the murderer's demand). *Defuse "this proves he's an idiot":* Kant isn't ignoring outcomes; he argues *all* lies inherently violate the humanity in *both* parties, regardless of intent or outcome. The rule against lying stems from this unconditional value.
  6.  **End-Check Question:** "Why, for Kant, is a lie that genuinely helps someone *still* wrong, even if universalizing the maxim *seems* possible? What specific aspect of the person is violated?" (Answer: Instrumentalizing their rational nature, treating them not as an end-in-themself capable of rational choice).
