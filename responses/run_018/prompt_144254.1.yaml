  How about institutionalization? Formal rules provide predictability and protection. When removed, power shifts to informal networks. That aligns with the arbitrary enforcement. Also, Habermas' lifeworld colonization—systems imposing on social spheres, but not exactly. 

  The user's "invisible fence to prison" metaphor is strong. Maybe "stealth authoritarianism" or "informalization trap"? No established terms jump out. Perhaps neologisms like "Coercion Displacement" or "Accountability Vacuum Effect". 

  Considering the user's deeper needs: they want to articulate this for debates, likely academic or policy discussions. They need a concise term to frame the argument. Also, understanding why reformers miss this—confusing structure removal with progress. 

