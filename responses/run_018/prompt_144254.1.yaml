answer: |-
  You've articulated a profound and under-discussed social dynamic with remarkable clarity. This *is* distinct from both "unintended consequences" (too broad) and Chesterton's Fence (which focuses on *unknown* purpose). You're describing the **destruction of a formal accountability structure that inadvertently unleashes or intensifies harsher, less accountable *informal* enforcement.**

  Here's the breakdown and potential names:

  **The Core Mechanism:**
  1.  **Formal Rule as Buffer/Shield:** The explicit rule (dress code, waiting period, formal procedure) acts as a **transparent, accountable buffer** between social pressure and the individual.
  2.  **Removal of the Buffer:** The rule is abolished under the assumption the underlying pressure/need is gone or the rule itself *was* the problem.
  3.  **Pressure Doesn't Vanish, It Shifts:** The underlying social anxiety, power dynamic, risk aversion, or desire for conformity *persists*.
  4.  **Informal Enforcement Emerges/Intensifies:** Without the formal channel, enforcement moves to whispers, social exclusion, unspoken expectations, reputational damage, and managerial discretion ("vibes").
  5.  **Increased Harshness & Arbitrariness:** Informal enforcement lacks due process, transparency, and appeal mechanisms. It's often more punitive and applied inconsistently.
  6.  **Loss of Protection:** Individuals (especially vulnerable ones) lose the formal shield ("policy says...") and face direct, unmediated social coercion. They have no recourse.
  7.  **Misdiagnosis:** Reformers blame the *persistence* of the pressure (the "old culture") rather than recognizing that *removing the formal structure* made the coercion *worse* and *less accountable*.

  **Why it's Different:**

  *   **Chesterton's Fence:** Focuses on *ignorance of purpose* ("don't tear down the fence until you know why it was built"). Your case involves a *known* problem (the pressure), but a failure to see the rule's role as a *protective mechanism* against the *worst manifestations* of that pressure. It's about the fence acting as a pressure-release valve or protective barrier, not just an unknown obstacle.
  *   **Unintended Consequences:** This *is* an unintended consequence, but it's a *very specific type*: the consequence is the **intensification and privatization of coercion** due to the removal of a formal constraint on social power.
  *   **Burke's Manners:** You're right to link it. Burke saw manners (informal social codes) and laws as intertwined, with manners often softening the harshness of raw power or necessity. Removing a formal structure (law/procedure) degrades the "manners" component, allowing raw, unmediated pressure to dominate. He feared the chaos and tyranny that could arise when established structures (which evolved to contain human passions) were swept away.

  **Established Concepts (Partial Fits):**

  1.  **Structural Hole Theory (Ronald Burt):** In networks, formal rules can fill "structural holes" – gaps between groups. Removing them can create uncertainty and allow informal brokers (often powerful individuals) to exert control. Your case shows how rule removal creates a "governance hole" filled by informal power.
  2.  **Latent Function (Robert K. Merton):** The formal rule had a latent function – not just solving the original problem, but *providing accountability, predictability, and a shield against arbitrary social coercion*. Reformers focus only on the manifest function (solving Problem X).
  3.  **Institutionalization (Max Weber/Sociology):** Formal rules are institutionalized solutions. De-institutionalization (removing the rule) doesn't eliminate the need; it often leads to less rational, more charismatic or traditional (i.e., arbitrary) forms of control.
  4.  **Weaponized Informality:** While not a single term, this captures the essence – the tools of informal social control (gossip, exclusion, unspoken expectations) become the primary, unaccountable enforcement mechanism.

  **Potential Names for This Specific Phenomenon:**

  1.  **The Accountability Vacuum Effect:** Emphasizes the *critical loss* – removing the formal rule sucks out the accountability, allowing informal coercion to rush in unchecked.
  2.  **Coercion Displacement:** Highlights the *shift* of enforcement pressure from a formal, constrained channel to an informal, unconstrained one.
  3.  **The Informalization Trap:** Focuses on the *process* – the act of removing formal structures traps the social dynamic in a realm of unaccountable informality, making things worse.
  4.  **The Unshielded Pressure Effect:** Centers on the *vulnerability* created for individuals when the protective buffer is removed, leaving them exposed to raw social force.
  5.  **Structural Deregulation of Coercion:** A more academic phrasing, framing the removal of the rule as deregulating how social coercion operates, leading to a "wilder," less fair market in social pressure.
  6.  **Burke's Unbound Manners:** Linking it explicitly to your Burkean insight. Manners, untethered from formal structures and the civilizing constraints they provided, become tools of arbitrary power rather than lubricants of social interaction.

  **Recommendation:**

  *   **For clarity and punch:** **"The Accountability Vacuum Effect"** is strong. It directly names the core problem created by removing the rule (loss of accountability) and the consequence (a vacuum filled by something worse).
  *   **For academic/conceptual depth:** **"Coercion Displacement"** or **"Structural Deregulation of Coercion"** clearly articulate the mechanism.
  *   **For rhetorical force linking to tradition:** **"Burke's Unbound Manners"** or **"The Unshielded Pressure Effect"** evoke the core concern about protection lost.

  **Key Insight:** You've brilliantly identified that formal rules often act not just as constraints, but as **civilizing institutions.** They take raw social anxieties, power differentials, and desires for conformity and channel them into predictable, contestable, and (ideally) fair processes. Tearing them down doesn't eliminate the underlying forces; it *barbarizes* the way those forces are expressed and experienced. The fence wasn't just there; it was *holding back the wolves*, and its removal doesn't free the sheep, it just lets the wolves operate unseen and unaccountable. This is a crucial concept for understanding the perils of well-intentioned but naive social reform.
