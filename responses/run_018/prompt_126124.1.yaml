answer: |-
  ### Setup Recap
  Dr. Voss argues Keynes’s "Economic Possibilities for Our Grandchildren" isn’t merely a forecast of reduced working hours but a covert normative claim: "absolute needs" must include unstructured cognitive time ("idle cognition") for human flourishing. She contends modern productivity culture erodes this moral infrastructure of leisure. Further, she leverages Keynes’s Bloomsbury aestheticism—valuing art and contemplation intrinsically—to challenge the dogma that leisure must be "earned" through labor, despite tensions with his macroeconomic emphasis on investment-driven growth.

  ---

  ### Interview Questions with Follow-Ups  
  1. **Q:** You argue Keynes smuggled a normative claim into his "grandchildren" essay—that idle cognition is an *absolute need*, not a luxury. Why is this distinction vital, and how does it reframe Keynes’s "economic problem"?  
     *Follow-up (if she leans predictive):* But Keynes explicitly frames leisure as a cultural *achievement* post-scarcity. If he’s only predicting, not prescribing, why call this a "moral infrastructure"?  

  2. **Q:** Define "idle cognition" concretely. How is it distinct from rest or recreation like hiking or watching TV?  
     *Follow-up (if abstract):* Give an example of idle cognition *in action* and why scrolling social media or napping wouldn’t qualify.  

  3. **Q:** Keynes separates "absolute" (subsistence) and "relative" (socially driven) needs. Doesn’t calling idle cognition an absolute need collapse that distinction, since its value seems culturally contingent?  
     *Follow-up (if she denies collapse):* If a society *disvalues* contemplation (e.g., hyper-productivist cultures), is idle cognition still "absolute"? Doesn’t that make it relative?  

  4. **Q:** You say Bloomsbury’s aestheticism helps Keynes resist "leisure must be earned." But doesn’t his macro framework—relying on investment fueled by deferred consumption—require *some* moral linkage between labor and reward?  
     *Follow-up (if she downplays tension):* Can a society sustain Keynesian investment *without* a cultural norm that rewards labor? Isn’t Bloomsbury’s detachment a privilege of capital?  

  5. **Q:** For people who genuinely prefer high-earning, 60-hour work weeks—finding meaning in ambition—does your Keynesianism pathologize their choice?  
     *Follow-up (if she affirms choice):* If productivity culture "actively destroys" idle cognition’s preconditions (as you claim), are these preferences truly autonomous or socially engineered?  

  6. **Q:** Modern tech automates labor but fills gaps with "productive leisure" (e.g., side hustles). How does your critique address this *capture* of potential idle time?  
     *Follow-up (if systemic):* What policy levers could protect idle cognition without paternalism?  

  7. **Q:** If idle cognition is infrastructural, like roads or schools, must it be *publicly* provided or incentivized? Or is this purely cultural?  
     *Follow-up (if cultural):* How do you cultivate it in a market economy that monetizes attention?  

  8. **Q:** Keynes worried post-scarcity humanity might "suffer a nervous breakdown" with too much leisure. Does idle cognition require training—and if so, doesn’t that reintroduce "earning"?  
     *Follow-up (if yes):* Doesn’t "training for leisure" contradict your anti-instrumental stance?  

  ---

  ### The Curveball  
  **Q:** Bloomsbury’s "art for art’s sake" ethos clashed with market realities—Keynes made fortunes investing while Woolf lamented "500 pounds a year and a room of one’s own." Given his group’s reliance on unearned wealth and domestic labor (often by women), isn’t Bloomsbury’s "idle cognition" less a moral universal and more a class privilege—undermining your claim that Keynes offers an emancipatory framework?  

  ---

  ### Delivery Notes  
  **Tone:** Collegial but incisive. Push firmly on contradictions (e.g., Bloomsbury privilege, macro/micro tension) but let her expand on "idle cognition" examples. Use silences after deflections. Avoid gotcha tone; frame tensions as generative. Key pressure points: Q3 (needs distinction), Q4 (macro vs. aesthetics), Q5 (autonomy), and the curveball.
