answer: |-
  Promissory obligation binds primarily because a promise constitutes the promisor's practical authority over their future self through a performative act, akin to how collective acceptance generates institutional facts like money or marriage, rather than through engendering expectations or reliance. This self-authorization creates a normative structure where the promisor's future actions are constrained by their past commitment, establishing a direct duty owed to the promisee. Crucially, the binding force of this constituted authority is sustained only by the promisor’s ongoing, direct epistemic access to their original commitment as a lived intention shaping present deliberation; this internal recall maintains the authority's active governance over the will. External digital archiving, by displacing this internal, agential awareness and substituting a passive, objective record, severs the vital link between the commitment and the promisor's conscious practical reasoning. It reduces the obligation to a mere "delegated residue"—a trace demanding external enforcement or social pressure based solely on the archived evidence—rather than preserving the genuine duty rooted in the promisor's internally maintained authority and first-personal accountability for their past self's act. Thus, reliance on external records dilutes the core binding force by externalizing and objectifying what is fundamentally an internal, authorial relation constitutive of the self.
