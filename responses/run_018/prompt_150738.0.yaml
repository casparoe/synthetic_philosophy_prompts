answer: |-
  ## Research Proposal: Modal Decay as the Unacknowledged Fault Line in Expected Value Fanaticism

  **Project Title:** Beyond Flat Modality: Investigating Modal Distance Discounting as an Alternative to Expected Value Fanaticism

  **Duration:** 8 Weeks (Summer Fellowship)

  **Principal Investigator:** [Your Name]

  **Core Problem:** Expected Value (EV) fanaticism argues that actions with astronomically small probabilities of astronomically large payoffs (e.g., a 1/10^15 chance of saving 10^15 lives) should dominate decision-making, potentially demanding extreme sacrifices for negligible chances of vast benefits. Standard critiques focus on risk aversion (diminishing marginal utility) or contesting longtermist probability assignments. **This project contends these debates overlook a more fundamental assumption: the treatment of modal space as 'flat'.** The core hypothesis is that EV fanaticism crucially depends on ignoring *modal distance* – the intuitive 'remoteness' or 'strangeness' of possible worlds – and that incorporating non-arbitrary modal distance discounting offers a novel, conceptually distinct resolution.

  **Central Hypothesis:** EV fanaticism's counterintuitive implications arise not primarily from utility functions or probability assignments *within* a presumed flat modal space, but from the **implicit assumption that modal distance is decision-theoretically irrelevant**. A viable alternative framework requires discounting the decision-weight of outcomes based on their modal distance from the actual world, alongside their probability.

  **Why Existing Answers Are Insufficient:**
  1.  **Biting the Bullet (Pure EV Maximization):** Accepts fanaticism's conclusions (e.g., ruinous sacrifices for tiny salvation chances) as rationally mandated, failing to address deep pre-theoretic intuitions about the *relevance* of modal remoteness. It assumes flat modality by default.
  2.  **Risk Aversion/Diminishing Marginal Utility:** While mitigating fanaticism, it confounds *value* with *modality*. Reducing the weight of large payoffs doesn't capture why we discount *modally distant* possibilities *even if* we could assign a crisp probability and value. A modally close world with high value could still warrant significant weight even under diminishing utility. This addresses a different problem (value scaling).
  3.  **Probability Scepticism/Imprecise Probabilities:** Challenges the *knowability* or *existence* of precise probabilities for extreme outcomes but doesn't explicitly engage with the *modal structure* itself. It questions the probability *input* to the flat-modality framework, not the framework's core assumption.
  4.  **Threshold Rules:** Imposes ad hoc probability cutoffs, lacking a principled foundation *grounded in modal metaphysics*. Why *that* threshold? Modal distance offers a potential underlying rationale (worlds beyond a certain distance get zero weight).

  **The Gap:** No major approach systematically challenges the **flatness of modality** as the root cause of fanaticism. We lack a formal decision rule integrating modal distance discounting that is non-arbitrary (i.e., not merely stipulative) and demonstrably distinct from risk aversion.

  **Research Question:** Can a decision rule incorporating non-arbitrary modal distance discounting resolve the fanaticism problem while preserving core rationality constraints, and how does it conceptually differ from risk aversion?

  **Methodology (Conceptual & Formal Analysis):**
  1.  **Week 1-2: Conceptual Groundwork & Framework Critique:**
      *   Precisely define "modal distance" (drawing on Lewisian similarity, accessibility relations, or topological metaphors) as distinct from epistemic probability. Formalize the intuition: "World W1 is modally closer than W2."
      *   Develop a taxonomy of "rescue cases" systematically varying probability, outcome magnitude, *and crucially*, modal distance (e.g., saving 1 person locally vs. saving 10^15 in a world requiring radically different physical laws vs. one requiring only slightly different historical choices).
      *   Articulate the specific "flat modality" premise underpinning pure EV reasoning.
  2.  **Week 3-4: Formalizing Modal Discounting:**
      *   Define a discount function `d(MD)` where `MD` is modal distance (scaled 0 [actual] to ∞ [maximally remote]), and `d(MD)` ∈ [0,1] monotonically decreases. Explore candidate functions (e.g., exponential decay `d(MD) = e^(-k*MD)`, inverse power `d(MD) = 1/(1+k*MD^p)`).
      *   Integrate into a Modified Expected Value rule: **MEV(A) = Σ [ P_i * U_i * d(MD_i) ]** for action A across possible worlds i. Contrast structurally with standard EV and risk-averse EU.
      *   **Non-Arbitrariness Challenge:** Investigate constraints on `d(MD)` and `k/p`. Can coherence principles (avoiding Dutch books across modal distances?) or pre-theoretic judgments guide parameterization? Is a *qualitative* discounting rule viable?
  3.  **Week 5-6: Confronting Fanaticism & Comparing Frameworks:**
      *   Apply MEV to classic fanaticism cases (Pascal's Mugging, Dyson Sphere gambles). Does MEV yield intuitively plausible results where EV fails, *without* collapsing into risk aversion? Identify cases where MEV and risk-averse EU diverge (e.g., modally close high-value vs. modally distant extreme-value).
      *   Analyze potential paradoxes within MEV (e.g., aggregation of modally distant small benefits).
      *   Rigorously contrast MEV with risk aversion: MEV discounts *because of modal location*, risk aversion discounts *because of value magnitude*.
  4.  **Week 7-8: Evaluation, Scope Limits & Synthesis:**
      *   Assess MEV against pre-theoretic judgments in the rescue case taxonomy. Does modal distance independently influence intuitive weighting?
      *   Identify core strengths (addresses root assumption, distinct from risk aversion) and weaknesses (defining/metricizing MD, parameterization challenge, potential complexity).
      *   Formalize the argument that flat modality is the crucial, unacknowledged premise of fanaticism.
      *   Outline unresolved questions and pathways for future research.

  **Success Criteria:**
  *   **Strong Success:** Develop a formally coherent MEV rule demonstrating a clear, non-arbitrary distinction from risk aversion. Show it robustly resolves fanaticism counterexamples while aligning significantly better with pre-theoretic modal intuitions in structured cases than flat EV or risk-averse EU. Articulate a compelling case for flat modality as the core enabling premise of fanaticism.
  *   **Moderate Success:** Develop a coherent MEV framework demonstrating its *conceptual* distinctness from risk aversion and its *potential* to resolve fanaticism, but with significant unresolved challenges regarding non-arbitrary discounting. Clearly map the failure of existing approaches to address modal distance.
  *   **Failure:** Unable to define modal distance non-circularly; MEV demonstrably collapses into risk aversion or another existing approach; fails to resolve fanaticism better than alternatives; pre-theoretic judgments show no sensitivity to modal distance distinct from probability/value.

  **Scope Limitations (Honest Check):**
  1.  **No Empirical Work:** Reliance on conceptual analysis and pre-theoretic intuitions via hypothetical cases. No experimental validation of modal distance intuitions.
  2.  **No Foundational Probability:** Takes subjective probability assignments as given; focuses on *how* to weight possibilities once assigned, given their modal location.
  3.  **No Definitive Metric:** Will not provide a unique, universally agreed-upon metric for modal distance or discount function. Focus is on demonstrating the *necessity* and *viability* of incorporating *some* form of non-arbitrary discounting.
  4.  **Limited Formal Exploration:** Deep exploration of specific discount functions and full axiomatization is beyond 8 weeks. Focus is on proof-of-concept and conceptual contrast.
  5.  **Metaphysical Neutrality:** Will not resolve deep debates about modal realism; aims for a framework compatible with various metaphysical stances about possible worlds.

  **Significance:** This project challenges a foundational assumption in decision theory and ethics. If successful, it offers a novel, principled escape from the fanaticism horn of the EV dilemma, grounded in the metaphysics of modality itself. It shifts the debate from *what we value* or *what we can know* to *where we are* in the space of possibility. It promises a decision rule more aligned with deep intuitions about relevance and reasonable concern, without abandoning the core structure of expected utility maximization, merely enriching its inputs.
