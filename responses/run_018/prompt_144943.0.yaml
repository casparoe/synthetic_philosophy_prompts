answer: |-
  ## Opening Address: The Institute for Philosophy and Machine Learning Inaugural Symposium

  **(Approx. 15 minutes)**

  Distinguished guests, colleagues, friends – welcome to the inaugural symposium of the Institute for Philosophy and Machine Learning.

  Why build this institute? Why bring together minds trained in the abstract rigors of philosophy and the concrete power of machine learning? The answer lies not just in the *potential* synergy, but in a specific, fundamental *confusion* that permeates both fields and hinders real progress: the confusion surrounding the simple question, **"Do neural networks have representations?"**

  This question seems straightforward. But I propose that the term "representation" itself is doing three distinct, crucial, and often conflated jobs in our debates. Unpacking this ambiguity isn't academic decoration; it’s the necessary foundation for meaningful collaboration, realistic promises, and genuine accountability. Let me outline these three jobs:

  1.  **Aboutness (Intentionality):** This is the "about" relation. Does a state within the network point to, stand for, or refer to something *outside* itself? Does a specific activation pattern *mean* "tiger," "striped texture," or "edge"? Philosophers have wrestled for centuries with how physical states can be "about" things. Is this inherent to complex systems, or does it require something more?

  2.  **Error Conditions (Misrepresentation):** This is the capacity for getting it *wrong*. Can the network state be *mistaken* about what it supposedly represents? If an activation pattern fires strongly for a stripey sofa, is it *misrepresenting* it as a tiger? Or is it merely responding predictably to a stimulus, without any inherent "correctness" or "incorrectness"? This is central to understanding reliability and failure.

  3.  **Causal-Functional Role:** This is the job the state *does* within the system’s processing. How does this pattern of activation contribute causally to the network’s overall function? Is it an edge detector feeding into a texture detector, feeding into an object classifier? This is where interpretability research shines, mapping the computational steps.

  **Here’s what’s settled:** We know that neural networks process information through complex, layered patterns of activation. We have powerful techniques, like feature visualization (showing what maximally activates a neuron) and causal intervention (probing what happens when we alter specific activations), that reveal astonishingly consistent and interpretable *functional roles* within these systems. We can identify units sensitive to stripes, curves, textures, even high-level concepts. We can often trace how manipulations change the output.

  **Here’s what’s genuinely contested:** Whether these functional roles, these activation patterns, genuinely possess *aboutness* in a robust philosophical sense. And crucially, whether they can truly *misrepresent*. Whether when our "stripe detector" fires strongly for a radiator cover, it is *wrong about* a tiger being present, or whether it's simply doing its functional job – detecting stripes – correctly, within a system that then *misclassifies* the input based on the *combination* of its activations. Philosophers deeply disagree on what grounds genuine intentionality and misrepresentation, and whether complex computational systems like neural nets meet those criteria.

  **This ambiguity isn't theoretical; it has concrete consequences.** Let me illustrate with an example familiar to many ML researchers here:

  Consider a vision model. Through probing and visualization, we identify a neuron cluster that fires strongly for images of tigers. We also notice it fires strongly for images of zebras, certain radiator covers, or even abstract black-and-white stripes. We label it the "Tiger Detector" based on its strongest association.

  *   **Functional Role:** This is relatively clear. This cluster plays a specific causal role: it activates robustly in the presence of specific visual features (strong stripes, particular color contrasts, perhaps shapes). Its activation contributes causally to the network classifying an image as "tiger" under certain conditions. This is where interpretability tools excel. We *can* map this causal role with increasing precision.
  *   **Aboutness:** What is this cluster *about*? Is it *about* tigers? But it also fires for zebras and radiators. Is it *about* stripes? But it might not fire for all stripes (e.g., thin pinstripes). Is it about a complex conjunction of features loosely associated with tigers? The question of *what* it fundamentally points to, if anything, is philosophically fraught and not settled by knowing its functional role alone. Different philosophical theories would offer competing answers.
  *   **Error Conditions:** Can this cluster *misrepresent*? If it fires strongly for a radiator cover, is it *misrepresenting* the radiator as a tiger? Or is it simply *representing* (in a functional sense) the presence of tiger-*like stripes* accurately? The mistake might lie in how the *downstream processing* interprets this activation, not in the activation itself. Resolving whether misrepresentation happens at this specific point, or only at the level of the system's final output, depends heavily on unresolved philosophical debates about the nature and location of mental content.

  **This three-way split shapes what we can and cannot promise:**

  1.  **To Interpretability Researchers & Engineers:** Your work brilliantly illuminates the **causal-functional roles** within neural networks. You are mapping the machinery. But we must be cautious: demonstrating a clear functional role does *not*, by itself, resolve the deep philosophical questions about **aboutness** or the precise nature and location of **misrepresentation**. Claiming your technique reveals "what the network *thinks*" or "what it *means*" often smuggles in unresolved philosophical assumptions.
  2.  **To Philosophers:** The intricate functional architectures revealed by ML interpretability are *not* just engineering details. They are concrete, complex systems exhibiting behaviors strikingly *analogous* to representation, demanding rigorous philosophical analysis. Dismissing interpretability as merely uncovering "shallow correlations" ignores the sophisticated **causal-functional structure** it reveals – structure that your theories of intentionality and misrepresentation must engage with seriously. The empirical details matter profoundly.
  3.  **To Our Supporters, Administrators, and Society:** This ambiguity matters for *accountability*. If we promise that "making AI transparent" will solve ethical problems like bias or harmful outputs, we must ask: *Which kind of transparency?* If transparency only shows us the functional wiring diagram (Job 3), it might not tell us whether the system *understands* its biases (Job 1) or *how* specific internal states are failing (Job 2). We might see *that* a "stripe detector" is active when the system wrongly outputs "tiger," but transparency alone might not tell us *why* that activation led to that output under those conditions, or whether the detector itself is "wrong." **Promising that interpretability alone guarantees ethical AI is dangerous overreach if we ignore the philosophical ambiguities about what representations *are* within these systems.** Conversely, dismissing interpretability as irrelevant because it doesn't immediately answer deep questions about machine consciousness throws away essential tools for understanding and controlling the technology we are building.

  **This is why we are here.** This institute exists because neither field can resolve these ambiguities alone. We need philosophers to sharpen the concepts – aboutness, error, functional role – pushing beyond intuition. We need ML researchers to build and probe systems that test these concepts, providing concrete phenomena to analyze. We need to ask together: When we visualize a "tiger neuron," what exactly have we learned? What *kind* of fact about the network have we uncovered?

  Our task is not to prematurely declare whether neural networks "truly" have representations in some final philosophical sense. Our task is to rigorously disentangle the distinct questions packed into that single word. We must understand precisely what our interpretability tools reveal, and crucially, what they do *not* reveal. We must build a shared language and shared problems.

  By confronting this three-fold ambiguity head-on – the ambiguity between aboutness, error, and functional role – we can move beyond talking past each other. We can set realistic goals for interpretability, forge philosophically informed assessments of AI capabilities and failures, and ultimately, build the foundation for genuinely accountable intelligent systems.

  This is challenging, essential work. I am profoundly excited by the collaboration this institute represents. Let the dialogue begin.

  Thank you.
