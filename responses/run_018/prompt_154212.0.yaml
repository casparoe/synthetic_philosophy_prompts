answer: |-
  Here's a decision tree/taxonomy for the "Broken Pots & Burnt Bones" seminar, built around your case study and injecting your niche angles. Think of it as a flowchart forcing explicit choices at epistemological fault lines:

  **Top-Level Split: What KIND of Meaning Can We Extract?**
  *   **Node 1: Can material patterns (breakage, arrangement, residues) encode *propositional beliefs* (e.g., "The gods demand smashed vessels")?**
      *   *Yes (Symbolic Encoding Possible)* --> Go to Node A
      *   *No (Only Behavioral/Practical Traces)* --> Go to Node B

  **Branch A: Symbolic Encoding Possible**
  *   **Node A1: Does the *repetition* of this practice cluster (pots, bones, posts) imply continuity of an *institution* (rules, roles, shared doctrine)?**
      *   *Yes, repetition = institutional structure* --> Go to Node A1a
      *   *No, repetition could just be widespread individual habit/custom* --> **Position:** "Practice-Diffusion Minimalism" (e.g., early Hodder-ish contextualism, some phenomenology)
  *   **Node A1a: Does institutional continuity require an *explicit transmission chain* (oral/textual doctrine)?**
      *   *Yes, doctrine needed* --> **Position:** "Doctrinal Institutionalism" (Implies *some* form of codified belief existed, even if untraceable textually; aligns with some cognitive archaeology)
      *   *No, "rules" can emerge & persist purely through embodied practice* --> **Position:** "Practice-Bodied Institutionalism" (e.g., Bourdieu-inspired practice theory, certain strains of neo-Darwinism)

  **Branch B: Only Behavioral/Practical Traces**
  *   **Node B1: What's the PRIMARY driver of the "broken pottery" pattern?**
      *   *Ritual/Symbolic Destruction (intentional breakage as act)* --> **Contradiction?** *Branch B assumes no propositional belief encoding!* **Empty Combo:** Logically incoherent? If breakage is *ritual*, it implies symbolic intent, contradicting Branch B's premise. Might represent an unstable position.
      *   *Functional Discard (post-use trash, accidental breakage)* --> Go to Node B1a
      *   *Unknowable Motivation (we see breakage, can't infer 'why')* --> Go to Node B1b
  *   **Node B1a: Is the "aligned post-holes" pattern best explained by...?**
      *   *Shared Cosmological Principles (alignment = sacred geometry)* --> **Contradiction?** *Branch B assumes no propositional belief encoding!* **Empty Combo:** Logically incoherent? Similar to B1 ritual option.
      *   *Shared Practical Logistics/Engineering (best way to build a roofed space)* --> **Position:** "Radical Materialist Inference" (e.g., Hyper-processualism, extreme Binfordian middle-range theory). Sees *only* adaptive/economic behavior.
  *   **Node B1b: Can we infer ANY social structure from the *repetition* of the cluster pattern?**
      *   *Yes, pattern repetition implies shared norms/routines* --> **Position:** "Behavioral Normativism" (Patterns reflect learned, shared *behaviors* without needing underlying 'beliefs'; e.g., some behavioral archaeology).
      *   *No, pattern could be coincidental/caused by universal constraints* --> **Position:** "Ultra-Minimalist Pragmatism" (e.g., Extreme skepticism, "We just see stuff; interpretation is fantasy").

  **Injecting Lipid Residues (Focusing on Broken Pots/Burnt Bone):**
  *   **Sub-Node under ANY "Ritual/Symbolic" Path (e.g., A branches, or if somehow allowed in B):** Do lipid residues suggest *feasting* (high-value/rare meats, unusual mixes, high abundance)?
      *   *Yes* --> Supports ritual/symbolic interpretation (sacrificial feast).
      *   *No (common domestic profiles)* --> Weakens (but doesn't *disprove*) ritual interpretation. *Or...*
      *   **Crucial Split:** Do we REJECT the "Uniformitarian Taste Fallacy" (that ancient tastes = modern tastes)?
          *   *Reject Fallacy: YES* --> **Problem:** "High-value" modern meats (beef, pork) might have been mundane/undesirable then; "unusual mixes" might be normal preservation/preference. Lipid data becomes **ambiguous** for distinguishing ritual/domestic *based on perceived value*. Focus shifts to *context* (quantity, vessel type, association) over residue *type*.
          *   *Reject Fallacy: NO* --> Lipid profiles *can* reasonably indicate "special" vs. "ordinary" food, supporting ritual/domestic distinctions.
  *   **Sub-Node under "Functional Discard" Paths (B1a, B1b):** Lipid residues are just evidence of *consumption*, fitting discard model. Rejecting the taste fallacy has minimal impact here (it's just "food").

  **Key Notes & Caveats:**

  1.  **Empty Combos:** The "Ritual/Symbolic Destruction" option under Branch B is highlighted as logically problematic. Similarly, "Cosmological Principles" under Branch B is incoherent. These represent positions the tree structure *exposes* as potentially contradictory if the premises are held strictly.
  2.  **Unnamed Positions:** Many leaves are descriptive ("Behavioral Normativism") rather than named schools. "Ultra-Minimalist Pragmatism" isn't a formal label but captures a real skeptical tendency.
  3.  **Blurred Lines the Tree Can't Split:**
      *   **"Practice" vs. "Institution":** The line between widespread custom (practice) and formalized institution is fuzzy. Node A1 tries, but it's a spectrum.
      *   **"Ritual" vs. "Intense Social":** Is a large communal feast necessarily "ritual" (implying supernatural belief) or just socially significant bonding? The tree forces a choice, but reality is messy.
      *   **Lipid Ambiguity:** Under Rejected Taste Fallacy, residues lose clear diagnostic power for ritual *by themselves*, making them highly dependent on other context (which might also be ambiguous!).
  4.  **Lipid Impact:** The taste fallacy rejection **dramatically weakens** the *independent* power of lipid residue to prove "sacrificial feasting" or specific institutional norms about food. It forces reliance on *other* contextual clues (quantity, vessel breakage pattern, location, association with special features/bones) for the ritual interpretation. It has little effect on discard/functional interpretations.
  5.  **The Anchor Case:** For your cluster, the tree forces explicit choices: Is the breakage symbolic or trash? Are the posts sacred or practical? Does repetition imply institution or just habit? Lipids can support ritual *if* contextual clues are strong *and* you accept the taste assumption, otherwise they become neutral or ambiguous.

  This structure forces seminar participants off the fence and reveals where their underlying assumptions (about meaning, institutions, behavior, evidence) actually lie, creating productive friction based on the *kinds* of claims they are willing to make from the mute evidence. The lipid angle adds a specific, concrete, and potentially destabilizing empirical wrinkle.
