prompt: |-
  Two months ago I became the founding director of a perpetually endowed foundation. Its charter forbids spending down the endowment, fixes a narrow mission, and contains elaborate governance provisions meant to keep my successors faithful to the founder's intent for centuries. Our board's first strategic decision is whether to commission — and, more importantly, whether to believe — a forecast: the probability that the foundation both still exists and still substantially follows its charter one hundred years from now.

  For questions like this I lean on a mentor of mine, a retired historian who is an uncompromising outside-view forecaster: he always starts from a reference class and a base rate and treats the inside details of a case as seductions. What I have never managed to extract from him is the rule by which he picks the class. Here are the verdicts of his I have on record:

  1. A restaurateur projecting success on the strength of a celebrated chef and a prime location: he disregarded both and used the early-years survival figures for all new restaurants in the city, on the grounds that classes like "restaurants with celebrated chefs" are carved out after the fact and have no stable statistics.
  2. A venture-funded startup attempting a radically new type of aircraft: he declined the class "venture-backed startups," though he admitted its data were rich, and forecast instead from documented attempts to build genuinely novel aircraft going back over a century, well before venture capital existed.
  3. A national government replacing its core administrative software: he forecast from large public-sector IT overhauls rather than from software projects generally, saying the procurement and incentive structure was doing the causal work.
  4. Asked once whether a declining great power would still count as one in fifty years: he used agrarian-bureaucratic empires past their revenue peak, not the contemporary club of great powers.
  5. A friend convinced he would die young because his father and grandfather had: he used cohort life tables for men of the friend's age and health profile, and treated the family history as something to be folded into the actuarial class rather than as the basis for a narrower one.
  6. A billionaire-backed charter city: he set aside recent special economic zones, conceding their data were better, and forecast from privately founded planned settlements and chartered ventures across five centuries, thin as that record is.

  Now the foundation itself. The candidate classes seem to be: (a) modern endowed foundations and charitable trusts — well documented, with high institutional survival but conspicuous drift from founder intent over generations; (b) institutions across history with legally binding founder-intent charters — perpetual trusts, certain colleges, monastic orders, entailed estates — sparse, heterogeneous, and spanning eras with very different state capacity; (c) family fortunes and dynasties, which he occasionally cites in conversation for their three-generations decay.

  Three questions. First, your prediction: which class will he choose for the foundation, and roughly what forecast — optimistic or pessimistic — will it yield? Second, the analysis: state at least two selection rules that fit all six verdicts on record, show what each predicts for the foundation's case, and say which you think is really his, with your reasons. Note that a simple "prefer contemporary, data-rich classes" rule appears to be excluded by verdicts 2 and 6, unless you can reconcile them. Third, the discriminating case: describe a further hypothetical verdict — a case plus his ruling on it — that would do the most work in distinguishing the two strongest candidate rules.

  One discipline for the answer: please separate what is genuinely settled among people who study forecasting and institutional longevity (for instance, that base-rate anchoring usually beats inside-view planning, and that organizations drift from founder intent) from what remains contested — above all, whether there is any principled method for choosing a reference class at all, and whether centuries-old base rates can legitimately be applied to modern institutions. Do not present a contested selection rule as the consensus of the field, and if his actual rule is underdetermined by my six data points, say so plainly rather than forcing a verdict.
reasoning: |-
  Okay, the user is the founding director of a perpetually endowed foundation and needs to make a strategic decision about commissioning a forecast for its survival in 100 years. They have a mentor who uses reference class forecasting, but they're unsure how he selects the reference class. They provided six examples of the mentor's decisions and want three things: a prediction of which class he'll choose for the foundation, an analysis of possible selection rules that fit all six examples, and a hypothetical case to distinguish between rules.

  First, I need to understand the mentor's approach. He always starts with a reference class and base rate, ignoring inside details. The user lists six cases: restaurants, aircraft startups, government IT, declining empires, life expectancy, and charter cities. In each, the mentor chose a class based on causal factors rather than surface similarities. For example, for the aircraft startup, he used historical novel aircraft attempts instead of venture-backed startups because the innovation was key.

  For the foundation, the candidate classes are: modern endowed foundations (high survival but drift), historical institutions with binding charters (sparse data), or family dynasties (three-generation decay). The mentor would likely choose the historical institutions class because the binding legal charter and perpetual nature are causally central. The forecast would probably be pessimistic due to historical examples of drift over centuries.

  Now, for the selection rules. Two rules fit all six cases. Rule 1: Prioritize the class where the outcome is most causally determined by stable structural factors. Rule 2: Prefer the class with the deepest historical data capturing long-term dynamics, even if sparse. Both rules point to class (b) for the foundation. I think Rule 1 is more consistent with the mentor's approach, as he focuses on causal mechanisms like procurement structures or innovation challenges.

  The user also wants a hypothetical case to distinguish between these rules. For example, forecasting the survival of a cryptocurrency project. Rule 1 might use other cryptocurrency projects due to similar structural factors, while Rule 2 might use historical speculative bubbles. The mentor's choice here would show which rule he prioritizes.

  The user stressed separating settled knowledge from contested issues. It's well-established that base rates and outside views outperform inside views, and institutional drift occurs. However, reference class selection lacks consensus, especially when applying historical data to modern contexts. I need to clarify that the mentor's method is his own approach, not a field standard.
answer: |-
  Here's a reasoned analysis adhering to your discipline, separating settled knowledge from contestation and avoiding forcing an underdetermined verdict:

  **Settled Knowledge (Forecasting & Institutional Longevity):**
  1.  **Base-Rate Anchoring Superiority:** It is well-established that starting with an outside-view base rate (reference class forecast) consistently outperforms purely inside-view reasoning ("planning fallacy") across diverse domains, including institutional survival. This is robustly supported by empirical research (Kahneman, Tversky, Tetlock, etc.).
  2.  **Organizational Drift:** Historical and sociological study overwhelmingly confirms that institutions (governments, corporations, universities, foundations) *do* drift from founder intent over time. Mission creep, adaptation to changing environments, capture by internal/external stakeholders, and reinterpretation of charters are near-universal phenomena. Perpetual adherence to a narrow, fixed charter is exceptionally rare over multi-decadal, let alone centennial, timescales.
  3.  **Modern Foundation Longevity vs. Drift:** Data on modern endowed foundations (post-early 20th century, especially post-Carnegie/Rockefeller model) shows *high rates of institutional survival* (low dissolution) but *significant rates of mission drift or reinterpretation* over 50-100 years. This drift is often facilitated by board discretion built into charters or legal rulings (e.g., cy-près doctrines).

  **Contested/Unsettled Issues:**
  1.  **Reference Class Selection:** **There is no consensus on a single, objective, or universally "correct" method for selecting a reference class.** This is the core challenge of applying the outside view. Different experts propose different heuristics (causal similarity, predictive similarity, data richness, temporal scope). The mentor's approach is *a* method, not *the* field standard.
  2.  **Applicability of Historical Data:** **The validity of applying base rates from vastly different historical eras (e.g., agrarian empires, medieval monastic orders) to modern institutions is highly contested.** Critics argue fundamental differences in law, state capacity, technology, societal norms, and organizational theory make such comparisons misleadingly pessimistic or simply invalid ("disanalogy problem"). Proponents argue that deep structural drivers of institutional decay (e.g., succession problems, incentive misalignment, environmental change) exhibit timeless patterns.
  3.  **Causal Inference:** While the mentor emphasizes "causal work," isolating the *true* causal factors driving an outcome like centurial adherence from historical data is immensely difficult and subject to interpretation. Is the binding charter itself the primary driver, or is it the surrounding institutional ecosystem?

  **Analysis of the Mentor's Approach & Your Questions:**

  1.  **Prediction for the Foundation:**
      *   **Likely Chosen Class:** **(b) Institutions across history with legally binding founder-intent charters.** This best captures the *causal essence* he consistently seeks: the attempt to enforce rigid, perpetual adherence to a founder's specific will through a formal, binding legal structure, operating over very long timescales in the face of inevitable environmental change and succession pressures.
      *   **Forecast:** **Pessimistic.** The historical record of perpetual trusts, entailed estates, monastic orders adhering rigidly to original rules over centuries is sparse and littered with examples of dissolution, forced modification, or profound drift despite the binding charter. State intervention (confiscation, reform), legal challenges, beneficiary revolts, and sheer ossification leading to irrelevance are common themes. The "thin record" itself signals the difficulty of the task. While survival might occur (like some medieval trusts or orders), "substantially follows its charter" after 100 years is unlikely based on this class.

  2.  **Analysis: Selection Rules Fitting All Six Verdicts:**

      *   **Rule 1: Maximize Causal Homogeneity on the Core Challenge.** Prioritize the class where the *fundamental causal mechanism* believed to *most directly determine the specific outcome* is most similar, even if surface features differ or data is sparse. Treat other details as distractions unless proven integral to the core causal mechanism.
          *   *How it fits the verdicts:*
              1.  Restaurants: Core challenge = early survival in a competitive, fickle market. Causal mechanism = market dynamics affecting *all* new entrants, not unique features of *this* one.
              2.  Aircraft: Core challenge = overcoming extreme technical novelty. Causal mechanism = the inherent difficulty of radical innovation in complex physical systems. VC funding is a modern *enabler*, not the core *challenge*.
              3.  Gov IT: Core challenge = succeeding within public procurement/incentive structures. Causal mechanism = dynamics specific to large public projects (accountability, politics, vendor capture, risk aversion).
              4.  Declining Power: Core challenge = long-term trajectory of an over-extended, fiscally strained agrarian-bureaucratic empire. Causal mechanism = structural decay patterns common to that *type* of state, not modern great power dynamics.
              5.  Life Expectancy: Core challenge = predicting mortality based on population-level biology/risk. Causal mechanism = actuarial tables capturing aggregate risks; family history is a specific risk *factor within* that class, not a distinct causal pathway justifying its own class.
              6.  Charter City: Core challenge = long-term survival of a privately initiated, rule-bound settlement venture. Causal mechanism = historical patterns of ambition, governance challenges, and external pressures faced by such ventures over centuries. Modern SEZs operate under fundamentally different state-investor dynamics.
          *   *Prediction for Foundation:* Points strongly to **(b)**. The core challenge is *enforcing rigid, perpetual founder intent via a binding legal charter*. Class (b) directly targets institutions defined by *that specific causal mechanism*. (a) lacks the rigidity/charter focus, (c) lacks the formal legal structure.

      *   **Rule 2: Maximize Temporal Depth Relevant to Outcome Dynamics.** Prioritize the class whose data spans the *longest possible timeframe* relevant to the *inherent timescale of the outcome process*, seeking to capture slow-moving, structural drivers and secular trends, even if data is sparse or heterogeneous. Prevents recency bias and myopia.
          *   *How it fits the verdicts:*
              1.  Restaurants: Outcome = short-term survival. City data suffices.
              2.  Aircraft: Outcome = overcoming generational innovation barriers. Requires century+ data on *novel* attempts.
              3.  Gov IT: Outcome = complex project success/failure. "Large public-sector IT" timeframe is adequate; "software generally" is too broad and misses public sector dynamics.
              4.  Declining Power: Outcome = centurial decline. Requires data on empires over centuries, not the transient post-WW2 great power system.
              5.  Life Expectancy: Outcome = lifespan. Cohort tables cover the full lifespan; no need for deeper history as medical progress changes the baseline.
              6.  Charter City: Outcome = long-term (multi-decadal/centennial) survival of a foundational venture. Requires centuries of data, outweighing better data on recent SEZs which haven't faced the test of *deep* time.
          *   *Prediction for Foundation:* Points strongly to **(b)**. The outcome timeframe is *centuries*. Class (b) explicitly spans centuries. Class (a) (modern foundations) lacks sufficient temporal depth (~100 years max for most, insufficient for assessing centurial *adherence*). Class (c) (fortunes) might have depth but lacks the formal legal charter element.

      *   **Which Rule is Likely His?** Based on his language ("causal work," "seductions," dismissing classes "carved out after the fact"), **Rule 1 (Maximize Causal Homogeneity on the Core Challenge)** appears to be the primary driver. He consistently probes for the *deepest underlying challenge* (market competition, technical novelty, public sector incentives, structural state decay, actuarial biology, historical ambition vs. reality) and finds the class defined by that challenge. Rule 2 (Temporal Depth) acts as a strong supporting heuristic, especially evident in cases 2, 4, and 6 where the long timeframe is intrinsic to the core challenge. However, Rule 1 explains *why* he rejects seemingly data-rich modern classes (VC startups, SEZs, great powers) when they don't align with the perceived core causal mechanism.

  3.  **Discriminating Hypothetical Verdict:**
      *   **Case:** Forecasting the 50-year survival and adherence to its original constitutional principles of a newly established, blockchain-based Decentralized Autonomous Organization (DAO) designed for perpetual existence, governed by immutable smart contracts on a public ledger.
      *   **Candidate Classes:**
          *   (A) Modern tech startups/platforms (rich data, high failure rate).
          *   (B) Historical member-owned cooperatives or mutual aid societies (longer timeframe, sparse data, focus on collective governance).
          *   (C) Constitutions of nation-states or long-lived political entities (very deep timeframe, heterogeneous, focus on foundational rule adherence).
      *   **Distinguishing the Rules:**
          *   **Rule 1 (Causal Homogeneity):** Would focus on the *core challenge*: Can *immutable, self-executing code* successfully enforce specific rules and resist all forms of drift/capture/obsolescence *in perpetuity* within a decentralized structure? Since this mechanism is unprecedented, he might *struggle* to find a true causal analog. He might reluctantly choose (A) *if* he views the core challenge as simply "new tech venture viability," but this seems unlikely. He might argue *no good class exists* yet, or perhaps look at historical attempts at immutable rule systems (e.g., certain religious laws or constitutions deemed unamendable - **C**), though recognizing massive disanalogies. **This illustrates Rule 1's potential weakness with true novelties.**
          *   **Rule 2 (Temporal Depth):** Would prioritize (B) or (C) immediately, seeking the longest possible data on collective governance structures attempting long-term adherence to founding rules, despite the technological novelty. The outcome dynamics (governance decay, rule reinterpretation, external pressures) operate on multi-decadal/centennial scales inherent to the DAO's design goal. **Rule 2 provides a clearer, albeit potentially flawed due to novelty, path here.**
      *   **Mentor's Likely Ruling (Based on Rule 1):** He would likely reject (A) as focusing on the wrong challenge (startup failure vs. governance enforcement via code). He might reject (B) as lacking the "immutable" and "perpetual" ambition/mechanism. He might choose **(C) Constitutions**, arguing that the core challenge of designing rules intended to be permanent and resist drift/capture is analogous, even if the enforcement mechanism (code vs. politics/culture) is different. The historical record of constitutional adherence, amendment, and overthrow provides relevant data on the *underlying difficulty* of the task the DAO attempts via a novel method. **His choice of (C) would strongly confirm Rule 1's dominance, even in the face of novelty.** Choosing (B) would suggest Rule 2 is primary. Declaring no suitable class exists would also align with Rule 1's focus on causal mechanism.

  **Conclusion on Underdetermination:**
  While **Rule 1 (Causal Homogeneity)** appears the strongest fit for the mentor's *stated philosophy* and explains the rejection of seemingly data-rich modern classes, your six data points **do not definitively prove this is his *sole* or *algorithmic* rule.** Rule 2 (Temporal Depth) is a compelling alternative or complementary heuristic, especially given the long timeframes involved in several cases. The hypothetical DAO case highlights how these rules could diverge. Ultimately, the mentor's approach reflects a sophisticated, defensible, but inherently contestable *judgment* about the deepest causal drivers of an outcome, prioritizing insight into the fundamental challenge over statistical convenience. There is no field consensus validating this specific method over others for reference class selection, particularly when bridging vast historical divides. His forecast for the foundation based on class (b) will be pessimistic, grounded in the sobering historical record of attempts to defy institutional entropy through legal perpetuity.
