prompt: |-
  ok so i've ended up as the person who has to pick where my workplace giving campaign sends its money this year, and the more i read the more i think the arguments are just people smuggling in different hidden checklists. one guy says the only thing that matters is how big the problem is and how many people are affected, so we should go after the biggest problem anywhere, which he thinks is maybe nuclear war or future people. another says a cause only counts if your dollar does something you can measure in the next two years, so by that test we should fund deworming pills or bednets. a third says all of that is backwards because a problem that's already famous and well funded, like cancer, is automatically a worse place to put money than something nobody is touching, even if the nobody-is-touching problem is smaller. and then there's the damn food bank down the street that i know is real because i see the line every morning, versus the malaria thing where i have to just trust a spreadsheet from people i've never met. so i've stopped asking which cause is best and started asking something upstream.

  what should a good way of ranking causes even have to do? i want the spec before i read another framework. write the desiderata — i had to look that word up — basically the requirements list for a theory of cause prioritization, one adequate for a small donor or a giving circle trying to pick one or two causes (not a government or a foundation with billions). give me the list: the cases it has to handle, especially the ones that pull in opposite directions like the food bank versus the bednets versus the whole-future thing, the distinctions it can't collapse, the facts about psychology or economics or measurement it can't just wave away, and why each one is a requirement. then tell me which requirements are non-negotiable and which are just the tastes of a particular camp, and flag any pair of requirements you suspect can't be jointly satisfied. if you want, briefly say how the importance-tractability-neglectedness framework does against the list and which one requirement it fails hardest, but i mostly care about the list.
reasoning: |-
  Okay, the user is tasked with selecting where their workplace giving campaign should donate this year. They're overwhelmed by conflicting advice: one colleague prioritizes scale and long-term impact like nuclear war prevention, another wants measurable short-term results like deworming, a third emphasizes neglected causes, and they personally feel drawn to the local food bank. They've realized the frameworks are biased and want neutral "specs" for evaluating causes.

  Hmm, this is actually a profound meta-question about effective altruism fundamentals. The user isn't asking for cause recommendations - they're demanding the design criteria for a robust evaluation system. Smart pivot. Their frustration with hidden agendas suggests they value transparency above all.

  Let me unpack their examples: 
  - The nuclear war advocate represents longtermism (scale/timeline tension)
  - Deworming exemplifies near-term cost-effectiveness (measurability vs. uncertainty)
  - Neglectedness guy highlights market dynamics in philanthropy (crowding effects)
  - Food bank vs malaria embodies the locality/trust vs scale/efficiency dilemma

  Key challenges they implicitly raise:
  1. Time horizon conflicts (present vs future lives)
  2. Epistemic access (local observability vs global statistics)
  3. Value commensurability (can we compare bednets to AI safety?)
  4. Psychological friction (empathy for visible needs vs abstract impact)

  For the desiderata, I'll need to balance:
  - Philosophical rigor (avoiding hidden biases)
  - Practical implementability (for small donors)
  - Psychological realism (acknowledging human limitations)
  - Scope flexibility (handling cancer research and asteroid defense)

  The ITN framework (Importance/Tractability/Neglectedness) is a good baseline but has gaps - especially in handling:
  - Psychological trust factors (ITN assumes perfect information)
  - Personal fit (it's completely impersonal)
  - Value pluralism (assumes util singularity)

  Major tradeoffs to flag:
  - Scalability vs observability (you can't audit malaria stats yourself)
  - Neglectedness vs certainty (untested interventions are riskier)
  - Time horizon vs measurability (future impacts can't be quantified yet)

  The non-negotiables should include:
  - Avoiding false precision (can't pretend $1=0.0001 lives saved)
  - Accounting for diminishing returns (critical for neglectedness)
  - Respecting psychological needs (or donations won't happen)

  ...But must also acknowledge where psychology limits rationality - e.g., the food bank's emotional resonance isn't irrational, it's a feature of human motivation systems. The spec should accommodate that without surrendering to pure sentiment.

  Final note: For small donors, the framework MUST output actionable priorities, not paralysis. That means accepting "good enough" comparability between causes. The perfect is the enemy of the good here.
answer: |-
  Here’s a rigorous "spec" for cause prioritization, designed for small donors facing competing pressures. The requirements address your core tensions (local vs. global, near-term vs. long-term, measurable vs. uncertain) while acknowledging real-world constraints.

  ### Core Desiderata (Requirements) for Cause Prioritization
  1. **Differential Impact Focus**  
     *Requirement:* Must prioritize **marginal impact per dollar** (i.e., what your donation *adds* that wouldn’t happen otherwise).  
     *Why:* Avoids wasting resources on saturated causes (e.g., well-funded cancer charities) or inefficient delivery. Handles the "bednets vs. food bank" tension by forcing cost-effectiveness analysis.  
     *Non-negotiable:* Yes. Ignores this at the peril of inefficiency.

  2. **Time Horizon Agnosticism**  
     *Requirement:* Must transparently weigh near-term vs. long-term impacts without presupposing one is inherently superior.  
     *Why:* Resolves the "deworming vs. nuclear war" conflict. Short-termists (bednets) and long-termists (AI safety) both have valid arguments; the framework must quantify tradeoffs (e.g., "saving a life today vs. reducing 0.1% risk of extinction").  
     *Non-negotiable:* No – but *how* it handles this reveals biases.

  3. **Explicit Uncertainty Accounting**  
     *Requirement:* Must incorporate confidence intervals, not just point estimates. Should distinguish:  
     - Measurable outcomes (e.g., bednets/life saved)  
     - Model-dependent outcomes (e.g., climate interventions)  
     - Speculative outcomes (e.g., asteroid defense)  
     *Why:* The "spreadsheet vs. food bank" tension hinges on trust in evidence. Cannot ignore psychology: donors need to see uncertainty ranges to assess "trustworthiness."  
     *Non-negotiable:* Yes. Hiding uncertainty is misleading.

  4. **Neglectedness as Force Multiplier**  
     *Requirement:* Must value marginal impact *more* in areas with fewer actors/resources.  
     *Why:* Explains why funding malaria prevention 20 years ago (neglected) had higher ROI than today (better-funded). Addresses your colleague’s "famous vs. obscure" argument.  
     *Non-negotiable:* Yes. Diminishing returns are economic reality.

  5. **Scalability Constraints**  
     *Requirement:* Must assess whether a cause can absorb funds without collapsing effectiveness (e.g., a local food bank may saturate quickly; AI safety might not).  
     *Why:* The "food bank down the street" may be high-impact until $10k, then hit diminishing returns. Bednets scale globally.  
     *Non-negotiable:* Yes. Ignores real-world absorption limits.

  6. **Psychological Friction Discount**  
     *Requirement:* Must account for human factors:  
     - Trust deficit (local vs. remote)  
     - Motivational sustainability (seeing impact vs. abstract stats)  
     - Cognitive overhead (ease of evaluation)  
     *Why:* If donors distrust malaria charities, funding them may backfire (e.g., reduced future giving). The food bank’s visceral impact sustains engagement.  
     *Non-negotiable:* No – but frameworks ignoring this fail in practice.

  7. **Value Pluralism**  
     *Requirement:* Must allow weighting non-utilitarian values (e.g., "helping neighbors matters intrinsically") alongside pure impact.  
     *Why:* Dismissing the food bank as "inefficient" ignores social cohesion benefits. The framework shouldn’t force a single moral ontology.  
     *Non-negotiable:* No – but essential for group buy-in.

  ---

  ### Tensions & Tradeoffs  
  - **Unavoidable Conflict:** *Differential Impact* vs. *Psychological Friction*. Maximizing impact often requires impersonal, distant causes (bednets), but humans prioritize visceral, trusted interventions (food bank). **No perfect solution** – small donors must trade efficiency for engagement.  
  - **Danger Zone:** *Time Horizon Agnosticism* vs. *Uncertainty*. Long-term causes (nuclear war) involve massive uncertainty. Prioritizing them requires accepting poorly quantified risks.  

  ### ITN Framework (Importance, Tractability, Neglectedness) Report Card  
  - **Handles Well:**  
    - Explicitly includes *Neglectedness* (requirement #4)  
    - *Importance* hints at #1 (impact) and #2 (time horizon)  
    - *Tractability* addresses scalability (#5)  
  - **Fails Hardest:** **Psychological Friction (#6)**. ITN assumes rational actors with perfect trust in data. In reality, local causes dominate workplace campaigns because humans need narrative and trust.  
  - **Misses:** Explicit uncertainty accounting (#3) and value pluralism (#7). ITN collapses "importance" into a single score, hiding moral disagreements.

  ---

  ### Final Design Spec  
  A robust framework **must**:  
  1. Quantify marginal impact/dollar (including uncertainty ranges)  
  2. Adjust for neglectedness and scalability  
  3. Acknowledge time-horizon tradeoffs transparently  
  4. Discount for psychological friction (trust, motivation)  

  It **should optionally**:  
  - Allow weights for local/relational value  
  - Convert all impacts to comparable units (e.g., DALYs/QALYs) *if* donors accept this  

  **For your workplace**: Start by scoring all options on these axes, then let stakeholders debate weights (e.g., "Do we value 1 local life = 10 distant lives?"). This exposes hidden checklists rather than smuggling them in.  

  > *Recommendation:* Use ITN as a base but *add* columns for "Trust/Transparency Score" and "Scalability Ceiling." The food bank might "lose" on impact but "win" on trust – and that’s a valid outcome if psychological friction is deemed critical.
