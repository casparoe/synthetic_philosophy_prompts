prompt: |-
  I'm an undergraduate taking a course on moral responsibility, and I'm leading a fifty-minute tutorial for first-year philosophy students on moral luck—specifically, whether agents can be properly blamed or praised for outcomes that turn on factors outside their control. Rather than the standard drunk-driver comparison, I want the session to carry on a single case: two marine biologists with identical training and identical negligent protocols deploy tracking nets in the same region; an unforeseeable current pattern saves an endangered population in one case and destroys it in the other, so one is celebrated and the other professionally ruined despite matching agency.

  Plan the explanatory arc for me, not the explanation itself. What conceptual piece must be in place before moral luck even registers as a problem rather than a platitude—likely the control principle, but show where it belongs in the sequence? Then specify the order in which to introduce the distinctions among constitutive, circumstantial, causal, and resultant luck, and why that dependency order holds. For the net case, say exactly what it must include (identical agency, identical reasoning, divergent outcomes driven by an external causal chain) and what it must lack (differences in character, knowledge, or effort that would let students retreat to a merit-based explanation). Map the predictable misconceptions onto the sequence: I expect they will start with "luck is just low probability," then slide to "if the outcome wasn't in her control she can't be blamed at all," and finally to "the two biologists are the same person in different worlds so they must deserve the same treatment"—tell me precisely where in the arc to head off each, and what question to ask at the end that tests whether they've grasped the tension with the control principle rather than just feeling sympathy for the ruined scientist. Also tell me what machinery I should explicitly refuse to open—perhaps the full taxonomy of moral luck responses, or the debate over whether moral luck can be dissolved by refining the assessment conditions on actions versus agents—and state that refusal openly.

  Finally, separate what is settled from what genuinely contested among people who know the topic: for example, whether moral luck is pervasive and ineliminable, or whether a properly refined control principle eliminates the appearance of luck altogether. Do not present either position as the consensus.
reasoning: |-
  Okay, the user is an undergraduate leading a tutorial on moral luck for first-year philosophy students. They want to focus on a single case study about two marine biologists instead of the typical drunk driver example. The key challenge is structuring the explanatory arc to build understanding step-by-step while avoiding common misconceptions.

  The core problem here is making abstract philosophy concepts accessible to beginners. First-years might struggle with terms like "control principle" or the taxonomy of luck types. The marine biologist case needs to be watertight - identical agency and circumstances with only the outcome differing due to external factors. Any loophole would let students retreat to comfortable merit-based thinking.

  I notice the user anticipates specific misconceptions: conflating luck with low probability, assuming lack of control means zero blame, or thinking identical actions deserve identical treatment. These need precise interception points in the lesson flow. For example, when introducing the case, immediately emphasize the identical agency to prevent "different effort" excuses.

  The user also wants to wisely limit scope - no deep dives into resolution theories or taxonomy debates. This is smart for a 50-minute session. The goal is creating cognitive tension, not solving it. The ending question should force confrontation between intuition (treating biologists differently) and principle (control requirement).

  For contested territory, I should delineate clearly: experts agree moral luck exists as a problem but disagree on solutions. Some see it as inescapable reality; others think refined control principles dissolve it. Presenting both views neutrally is crucial - undergrads shouldn't leave thinking there's a textbook answer.

  Structurally, the arc should build from concrete to abstract: Start with the visceral case to hook interest, then extract the control principle from student intuitions, then layer luck distinctions only as needed to dissect the case. Constitutive luck (innate traits) might confuse here - better focus on resultant (outcome) luck since the biologists' actions were identical.

  The killer closing question could be: "If we praise Biologist A for saving the population, are we saying she controlled the current? If not, how is that fair?" This makes them articulate the conflict rather than default to sympathy.
answer: |-
  Here's a planned explanatory arc for your 50-minute tutorial on moral luck, centered on the marine biologist case, designed to build conceptual understanding step-by-step while managing misconceptions and scope:

  **Core Objective:** Create palpable tension between the **Control Principle** and intuitive outcome-based judgments in the case.

  **Sequential Arc (45-50 mins):**

  1.  **Hook & Case Introduction (5 mins):**
      *   Present the marine biologist case **vividly** and **neutrally**.
      *   **What it MUST include:** Identical training, identical *negligent* net protocols (e.g., ignoring known risks, using a cheaper/more dangerous method), identical reasoning/effort at the time of deployment, identical starting conditions (region, time, equipment). The *only* difference: an unforeseeable, uncontrollable current pattern leading to divergent outcomes (population saved vs. population destroyed).
      *   **What it MUST lack:** Any difference in character, knowledge, foresight, intention, or effort *at the time of the negligent act*. Emphasize they are "moral duplicates" at that moment.
      *   State the outcomes: Biologist A celebrated, Biologist B ruined.
      *   **Initial Question:** "Based on this description alone, *should* they be treated differently? Why or why not?" (Capture initial intuitions - likely split).

  2.  **Establishing the Foundational Principle: The Control Principle (CP) (10 mins):**
      *   **Why here?** Without CP firmly established, moral luck isn't a problem; it's just "how things are."
      *   Solicit student reasoning from Step 1. Guide discussion towards the idea that blame/praise should depend on what the agent *controlled* (intentions, choices, efforts).
      *   **Formalize CP:** "An agent can only be morally blamed or praised for things that were within their control." Connect to core ideas of fairness, desert, and autonomy. *This is the bedrock.*
      *   **Apply CP to Case:** "According to the Control Principle, *should* A and B be treated differently? Why not?" (Answer: No, because the *only* difference was outside their control). **Highlight the emerging tension.**

  3.  **Introducing "Luck" & Key Distinction: Resultant Luck (15 mins):**
      *   **Why Resultant Luck First?** It's the *most direct* challenge in your case and most intuitive (outcomes differ).
      *   Define "Moral Luck": "When an agent's moral standing (blame/praise) depends on factors beyond their control."
      *   **Define Resultant Luck:** "Luck in the *outcomes* or *results* of one's actions or choices."
      *   **Reframe the Case:** "In our case, Biologists A and B experienced divergent *Resultant Moral Luck*. The uncontrollable current determined whether their *identical* negligence led to a good or bad outcome, drastically altering how they are judged."
      *   **Question:** "Does the *actual outcome* (saved/destroyed population) seem relevant to how much blame/praise they deserve? *Even though* it was due to luck?" (Explore intuitions; many will say "yes" for blame/praise intensity).
      *   **Head Off Misconception #1 ("Luck is just low probability"):** "Is the *unlikeliness* of the current pattern the core issue here? Or is it the *lack of control* over the outcome-determining factor?" (Emphasize: Luck in moral philosophy concerns *lack of control*, not improbability. A highly probable but uncontrollable factor is still luck).

  4.  **Introducing Supporting Distinctions: Circumstantial & Causal Luck (10 mins):**
      *   **Why Now?** To deepen understanding of the *sources* of lack of control impacting the case and show luck's pervasiveness.
      *   **Define Circumstantial Luck:** "Luck in the *situations* or *circumstances* one finds oneself in." (e.g., Luck that Biologist B was *in the path* of the destructive current pattern that day - an external circumstance).
      *   **Define Causal Luck:** "Luck in how one's actions *causally interact* with the world." (e.g., Luck that Biologist A's net *interacted with* the current in a beneficial way, Biologist B's in a harmful way - the external causal chain).
      *   **Connect to Case:** "Resultant Luck (the outcome difference) stemmed from Causal Luck (how their nets interacted with the currents) and Circumstantial Luck (being exposed to that specific current pattern). Crucially, *none* of this was under their control."
      *   **Head Off Misconception #2 ("If outcome wasn't controlled, she can't be blamed at all"):** **Intercept here!** "Hold on. Does the Control Principle, as we stated it, say they can't be blamed *at all*? Or does it say they should be blamed *the same amount*? What *was* under their control?" (Refocus: Their *negligence* was under their control. CP suggests they deserve *equal* blame *for the negligence*, regardless of outcome. The question is whether the *magnitude* of blame/praise can differ based on luck).

  5.  **Constitutive Luck (Brief Mention - 2 mins):**
      *   **Why Last & Briefly?** It's less directly relevant to the *outcome* focus of your case and potentially distracting. Mention for completeness but don't dwell.
      *   Define: "Luck in the traits, dispositions, and capacities you are born with or develop through no fault/credit of your own." (e.g., innate caution, impulsiveness).
      *   **Connect (if needed):** "While constitutive luck might influence *why* they were both negligent, remember our case stipulates *identical* reasoning and choices *at the time*. The divergent outcomes stem from luck *after* the choice."

  6.  **Reconciling the Tension & Final Test (8 mins):**
      *   Re-state the conflict: CP says A & B deserve identical moral assessment (blame for negligence). Outcome-based intuition (and societal practice) treats them very differently (praise vs. ruin).
      *   **Head Off Misconception #3 ("They are the same, must deserve same treatment"):** **Address explicitly here.** "If they are truly moral duplicates regarding the negligence, *should* society treat them identically? What would that look like? (e.g., both fired? both reprimanded but not ruined? both given a warning?). Is that feasible or just? Does the *actual harm caused* matter?"
      *   **The Crucial Test Question:** "**If we accept the Control Principle, how can we justify praising Biologist A more than Biologist B, or blaming Biologist B more than Biologist A, *given that the difference in outcome was solely due to factors neither controlled?***" (This forces them to articulate the tension between CP and outcome-based judgments, moving beyond sympathy to conceptual conflict).
      *   **Do NOT provide a resolution.** Leave the tension hanging. The goal is recognizing the problem.

  **What to Explicitly Refuse to Open (State Clearly):**

  *   "We are focusing *only* on exposing the tension between the Control Principle and our intuitions about outcomes. We **will not open** the large toolbox of philosophical responses today – no Williams/Nagel taxonomy debates, no consequentialist vs. deontological resolutions, no discussions about whether blame should attach only to actions, agents, or characters. Our goal is to see the problem clearly, not solve it in 50 minutes."

  **Settled vs. Contested (State Neutrally):**

  *   **Settled (Among Experts):** There is a genuine phenomenon called "moral luck" that creates a *prima facie* tension with the Control Principle. Cases like the marine biologists (resultant luck), negligent drivers (resultant), or being born in Nazi Germany (circumstantial) reliably generate this tension. The distinctions (constitutive, circumstantial, causal, resultant) are widely accepted as useful categories *for describing* the problem.
  *   **Genuinely Contested (Among Experts):**
      *   **The Pervasiveness & Ineliminability Question:** Does moral luck reveal a fundamental, *inescapable* feature of our moral practices and judgments? (Williams/Nagel: Yes, it's pervasive and reveals a flaw in Kantian ideals). Or...
      *   **The Dissolution Question:** Can the *apparent* problem of moral luck be dissolved by carefully refining our understanding of the Control Principle, moral assessment, or blameworthiness? (e.g., Enoch: Focus on the "decision to impose risk"; Zimmerman: Distinguish blame for action vs. blame for outcome; Levy: Epistemic constraints). Some argue a refined CP eliminates the *need* for differential blame based on luck.
      *   **Emphasize:** "Serious philosophers defend *both* positions – that moral luck is a real and inescapable problem, *and* that it's an illusion created by imprecise moral concepts. There is no consensus 'answer'."

  **Key to Success:**

  *   **Strict Case Fidelity:** Constantly refer back to the specifics of the marine biologist case to ground abstract concepts.
  *   **Active Questioning:** Use targeted questions (like the final test question) to probe understanding, not just lecture.
  *   **Manage Scope Relentlessly:** Shut down tangents firmly but politely, redirecting to the case and the core tension.
  *   **Embrace the Tension:** Your goal is *not* resolution but making the conflict between CP and intuition vivid and uncomfortable. Success is them leaving perplexed but clear on *why* it's perplexing.
