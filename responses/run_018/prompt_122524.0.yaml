          - This is about whether to interpret choices as evidence of welfare or as symptoms of deprivation.

          Example: A deprived group does not complain (choose to complain) because they feel it's futile.

          The board's rule: we must use choices. So if they don't choose to complain, then we take that as evidence that they don't want to complain. We cannot question it.

          Therefore, we treat the choice as evidence.

     Step 4: Aggregation

          We have, for each individual, one of:
            - Better off
            - Worse off
            - Indeterminate (due to inconsistency, or because we cannot assess for the intervention type without follow-up, etc.)

          But note: in many cases, we don't assign at the individual level (like in defaults with follow-up, we only know that some additional people are better off).

          Proposed aggregation:
            - We count the number of people who are better off, worse off, and indeterminate.

            - If there is any worse off, then we cannot say the group is better off without a value judgment.

            - If there are only better off and unchanged, then we can say the group is better off.

            - But note: the unchanged are not worse off, and the better off are better.

            - However, the value judgment is: can we say the group is better off if some are better off and none are worse off? That is a Pareto improvement.

          Steps for aggregation:
            Step 4.1: Count the number of individuals in each category.
            Step 4.2: If there are any worse off, then we note that there are losers and the board must decide whether the gainers' gains are enough to compensate. We cannot make that judgment.
            Step 4.3: If there are no worse off and at least some better off, then we can say the group is better off (Pareto improvement).

          But in our earlier example of defaults, we have:
            - Some better off (the additional enrollees who stayed)
            - Some unchanged (those who enrolled anyway, and those who didn't enroll in either group)
            - None worse off? What about the people who were enrolled by default and then had to opt out? They faced a hassle. But we didn't count them as worse off because we only looked at the final state. In the final state, they are not enrolled, so they are the same as the control group. But they incurred an opt-out cost. This is friction.

          We must account for friction costs.

          In the pension default, the intervention might have caused some to have to actively opt out. They didn't want the pension, but they had to fill out a form. That is a cost. So they are worse off.

          How do we measure that? We don't observe the cost of opting out. And we cannot use WTP to measure it.

          Therefore, we cannot say they are worse off because we cannot quantify the cost. But we know they incurred a cost. So we must note it.

          The procedure will have to include any friction costs imposed on those who changed behavior to avoid the intervention.

          But we cannot measure the cost. So we cannot include it in the welfare calculus.

          Given the rule, we will have to ignore it and only count the final state. But then we might be missing welfare losses.

          This is a limitation.

          In aggregation, we will count as worse off only if we can see that they ended up with a bundle they could have had before and didn't choose, and now they choose it in the same environment? But the environment changed.

          Given the difficulty, the procedure will be:

            - We report the number of people who are better off (by our assessment) and the number who are worse off (by our assessment). For the rest, we say indeterminate or unchanged.

            - If there are any worse off, then the overall finding is that the intervention made some better off and some worse off, and we cannot aggregate without a value judgment.

            - If there are none worse off and some better off, then we can say the intervention made the group better off.

            - If there are no better off and none worse off, then no change.

            - If there are only indeterminate, then we cannot say.

     Step 5: Write the one-page finding

          The finding should include:
            - Summary of the intervention and the data used.
            - The welfare verdict: one of:
                 - The intervention made the group better off.
                 - The intervention made the group worse off.
                 - The intervention made some better off and some worse off (and we report the numbers).
                 - We cannot determine whether the group is better off.
            - Reasons for the verdict (e.g., for defaults, we had follow-up and found additional enrollees who stayed; for friction, we could not assess).
            - Any context (like self-reports) that is relevant but not used as evidence.
            - The step at which we are handing over to the board (e.g., when there are both gainers and losers).

     Now, we run the procedure on the three trials.

     Trial 1: Workplace pension opt-out default
        - Intervention: switch from opt-in to opt-out.
        - Enrollment: 41% to 87%.
        - Follow-up: 12 months, low and flat opt-out rate.
        - No data on offsetting saving or consumption.

        Steps:
          - Type: Defaults and framing.
          - We have follow-up, so we can proceed.

          Step 2: Check for consistency. We don't have data on individual inconsistency, so we assume consistency.

          Step 3: 
              - We compare the treatment group and control group at the end of follow-up.
              - The control group enrollment rate at the end of follow-up is, say, 41% (if we assume no change) or we have the actual control group rate. Let's assume the control group is at 41% and the treatment group is at 87%.
              - The additional enrollment in the treatment group is 46% of the group.
              - These additional enrollees did not opt out during follow-up, so we count them as better off.
              - What about the rest?
                 - The 41% in the treatment group who would have enrolled anyway: they are unchanged? But we don't know if they enrolled earlier because of the intervention. We only know at the end they are enrolled and didn't opt out. They are in the same state as in the control group. So unchanged.
                 - The 13% in the treatment group who are not enrolled (opted out): they are not enrolled, just like the 59% in the control group. But they had to opt out, which is a friction cost. We cannot measure that cost, so we ignore it and count them as unchanged? Or do we count them as worse off? We cannot quantify the cost, so we cannot say they are worse off. We will count them as unchanged.

              - Also, in the control group, the 59% who are not enrolled: they are unchanged.

              - Therefore, we have 46% better off, 0% worse off, and the rest unchanged.

          Step 4: Aggregation: no one worse off, some better off -> the group is better off.

          Finding: The intervention made the group better off.

          But note: we ignored the opt-out cost. We must note it in the context.

     Trial 2: Rewritten invitation letter for cervical screening
        - Attendance increased from 34% to 39%.
        - No change in feasible set.
        - No follow-up data.
        - The letter changed the framing.

          Type: Framing without follow-up.

          Step 3: For framing without follow-up, we require follow-up to make a welfare statement. We don't have it, so we cannot assess.

          Step 4: All individuals are indeterminate.

          Finding: We cannot determine whether the group is better off.

          We can add context: the attendance increased, but we don't know if it is sustained or if it reflects a true preference change.

     Trial 3: Mandatory 24-hour cooling-off period on high-cost short-term credit
        - Reduced borrowing by about a third.
        - The intervention added friction (delay) to borrowing.

          Type: Friction.

          Step 3: For friction, we return indeterminate at the individual level.

          Step 4: All indeterminate.

          Finding: We cannot determine whether the group is better off.

          But note: the board's prior is that it is a welfare gain. The procedure returns "cannot determine".

     Finally, what the procedure cannot do:
        - Interpersonal comparisons: we cannot aggregate gains and losses without a value judgment.
        - Magnitudes: we only know if someone is better off, not how much.
        - Intensity of preference: we only have an ordering.
        - We cannot settle the question of whether "better off" should be preference satisfaction or something else (like objective welfare). We are stuck with preference satisfaction as revealed by choice.

     Steps that require judgment:
        - Setting the Afriat threshold (if used).
        - Deciding how to handle friction: we chose to return indeterminate, but the board might want to include friction costs. We cannot.
        - In aggregation, we require Pareto improvement. The board might want to use a potential Pareto improvement (Kaldor-Hicks) but we don't have magnitudes.

     The procedure in a flowchart:

     Step 0: Data preparation and checks.
     Step 1: Define choice sets and intervention type.
     Step 2: Check for consistency (if data allows, compute Afriat index; set a threshold, e.g., 0.9; if below, mark individual as inconsistent -> indeterminate).
     Step 3: Per intervention type:
          - Defaults/framing: 
               If no follow-up data on active choices: all indeterminate.
               Else: 
                   - Use the end of follow-up state.
                   - For each individual in treatment group, compare to what they would have done in control (using control group as proxy).
                   - If they are in a state that they would not have been in without the intervention and they did not reverse (e.g., for pension, enrolled and didn't opt out when they wouldn't have enrolled in control), then mark as better off.
                   - If they are in the same state as they would have been, mark as unchanged.
                   - If they had to incur a cost (like opt-out) but ended in the same state, we cannot quantify the cost, so mark as unchanged? But this is a judgment. We choose to mark as unchanged.
          - Friction: all indeterminate.
          - Information: all indeterminate.
     Step 4: Aggregation:
          - Count better off, worse off, unchanged, indeterminate.
          - If any worse off: then report the numbers and say that the board must decide.
          - Else if any better off: then the group is better off.
          - Else if all unchanged: no change.
          - Else: cannot determine.

     Step 5: Write the finding.

     Note: The unchanged are not worse off, so they are included in the non-negative part.

     For the cooling-off period trial, we return "cannot determine". The board might not like it, but the procedure is honest.

     We now write the procedure formally.
answer: |-
  ### Welfare Assessment Procedure Based on the Choice Rule

  This procedure provides a reproducible, step-by-step method for determining whether a population is "better off" after an intervention, adhering to the Choice Rule. It uses **revealed preference** as the sole welfare criterion: individuals are "better off" only if their post-intervention choices reveal a preference for a bundle they could have chosen pre-intervention but did not. The procedure is designed for analysts with undergraduate economics/psychology training and can be completed within six weeks.

  ---

  ### **Step-by-Step Procedure**
  **Key Principles:**  
  - Welfare is individual, ordinal, and non-comparable across persons.  
  - Only **actual choices** (not beliefs, feelings, or WTP) are evidence.  
  - If evidence is inconclusive, the finding must state this.  
  - Aggregation requires value judgments (marked for board input).  

  #### **Step 1: Define Choice Sets and Intervention Type (Week 1)**  
    - **Question:** What were the *ex ante* (pre-intervention) and *ex post* (post-intervention) feasible sets? Include physical options, prices, and constraints. Ignore presentation, friction, or information unless they alter feasibility.  
    - **Sufficient Answer:** A clear description of options available in both periods (e.g., "Pre: {Enrol in pension, Not enrol}; Post: {Enrol, Not enrol}").  
    - **Stop If:** Feasible sets differ materially (e.g., new options added). → **Finding:** "No welfare finding possible; feasible sets changed."  
    - **Intervention Categorization:**  
      - **A. Defaults/Framing:** Feasible set unchanged; presentation altered.  
      - **B. Friction:** Feasible set unchanged; effort/cost to access options altered.  
      - **C. Information/Debiasing:** Feasible set unchanged; beliefs about options corrected.  
      - **D. Other:** Label cycles/time inconsistency or adaptive choice if observed.  

  #### **Step 2: Assess Choice Consistency (Week 2)**  
    - **Question:** Are choices consistent with stable preferences?  
    - **Method:** For panel data (same individuals pre/post), compute the **Afriat Critical Cost Efficiency Index (CCEI)** for each person:  
      - CCEI measures how much budgets must be "discounted" to rationalize choices as utility-maximizing (range: 0–1).  
      - **Threshold:** CCEI ≥ 0.9 → choices are "nearly consistent" (proceed). CCEI < 0.9 → inconsistent (individual welfare indeterminate).  
    - **What CCEI Measures:** Degree of choice irrationality (e.g., cycles, time inconsistency). A value of 0.9 means choices are 90% consistent with stable preferences.  
    - **Sufficient Answer:** % of sample with CCEI ≥ 0.9.  
    - **Stop If:** <70% of sample has CCEI ≥ 0.9. → **Finding:** "Inconsistent choices dominate; no welfare finding possible."  
    - **Judgment Call:** Threshold setting (0.9 is standard; adjust only with board approval).  

  #### **Step 3: Individual Welfare Assessment (Weeks 3–4)**  
  Ask one question based on intervention type:  

  - **A. Defaults/Framing (e.g., pension opt-out):**  
    - **Question:** Did the individual *actively sustain* the post-intervention choice in a follow-up period with neutral presentation?  
    - **Sufficient Answer:**  
      - With follow-up: If person chose Bundle B post-intervention *and* actively retained B in follow-up *and* B was affordable but not chosen pre-intervention → **better off**.  
      - Without follow-up → **indeterminate** (framing effects may dominate).  
    - **Reversal Requirement:** Active non-reversal in follow-up is required (passive choices are not evidence).  
    - **State Recommendation:** Ignore; only choices matter per Choice Rule.  

  - **B. Friction (e.g., cooling-off period):**  
    - **Question:** Did friction change *formal* feasibility?  
    - **Sufficient Answer:**  
      - If friction alters effort but not formal options → **indeterminate** (effort is not priced; no choice-based evidence).  
      - *Rationale:* Converting hassle to money requires WTP (barred by Rule b); refusing to convert ignores welfare losses. Procedure chooses **indeterminate** as only defensible option.  

  - **C. Information/Debiasing (e.g., corrected loan terms):**  
    - **Question:** Did post-intervention choices reveal a preference for a bundle misperceived pre-intervention?  
    - **Sufficient Answer:**  
      - If person switched to Bundle B post-intervention *and* B was affordable but not chosen pre-intervention *and* misperception is proven (e.g., via survey) → **better off**.  
      - Otherwise → **indeterminate**.  

  - **D. Cycles/Time Inconsistency (e.g., enrolment lapse):**  
    - Handled in Step 2 (CCEI < 0.9 → indeterminate).  

  - **E. Adaptive/Defensive Choice (e.g., underserved groups):**  
    - **Question:** Was the choice made under duress?  
    - **Sufficient Answer:** Choices are always evidence (Rule b bars overrides). → Use observed choices.  
    - **Judgment Call:** None (Rule b binds).  

  #### **Step 4: Aggregation (Week 5)**  
    - **Question:** What % of the group is better off/worse off/indeterminate?  
    - **Method:**  
      1. Count individuals in each category from Step 3.  
      2. **Aggregation Rules:**  
         - **Pareto Improvement:** If ≥1 person better off, 0 worse off → "group better off."  
         - **Losses:** If ≥1 person worse off → **hand to board** (value judgment required for compensation/trade-offs).  
         - **Mixed/Indeterminate:** If no Pareto improvement or losses → "no welfare finding possible."  
    - **Judgment Call:** None (analyst reports numbers; board decides trade-offs).  

  #### **Step 5: Draft Finding (Week 6)**  
    - **Structure:**  
      1. **Intervention Summary:** 1–2 sentences.  
      2. **Welfare Verdict:** One of:  
         - "Group better off" (Pareto improvement).  
         - "Group worse off" (Pareto loss).  
         - "No welfare finding possible" (indeterminate/mixed).  
         - "Board input required" (losses exist).  
      3. **Evidence:** % better off/worse off/indeterminate; key choice shifts.  
      4. **Context (if needed):** Non-choice data (e.g., happiness surveys) as commentary only.  
      5. **Caveats:** Limitations (e.g., "no follow-up," "friction not priced").  

  ---

  ### **Application to Case Studies**  
  #### **Case 1: Workplace Pension Opt-Out Default**  
    - **Intervention:** Opt-in → opt-out; enrolment ↑41% → 87%; low opt-out over 12mo.  
    - **Procedure:**  
      1. **Type:** Defaults. Feasible set unchanged.  
      2. **Consistency:** Assume CCEI ≥ 0.9 (no data).  
      3. **Individual Welfare:**  
         - With 12mo follow-up: Enrolled non-opt-outs (87%) actively sustained choice.  
         - Pre-intervention, pension was affordable but not chosen by 46% (87% – 41%).  
         - → 46% better off (new enrollees who stayed); 54% unchanged.  
      4. **Aggregation:** Pareto improvement (no worse off).  
    - **Finding:** "Group better off. 46% (new sustained enrollees) revealed preference for pension; 54% unchanged. Context: No offsetting saving data."  

  #### **Case 2: Cervical Screening Letter**  
    - **Intervention:** Letter rewrite; attendance ↑34% → 39%; no follow-up.  
    - **Procedure:**  
      1. **Type:** Framing. Feasible set unchanged.  
      2. **Consistency:** Assume CCEI ≥ 0.9.  
      3. **Individual Welfare:** No follow-up → **all indeterminate**.  
      4. **Aggregation:** No welfare finding possible.  
    - **Finding:** "No welfare finding possible. Attendance ↑5%, but no follow-up to verify sustained choice. Context: Qualitative data suggests anxiety influences attendance."  

  #### **Case 3: Loan Cooling-Off Period**  
    - **Intervention:** 24hr delay; borrowing ↓33%.  
    - **Procedure:**  
      1. **Type:** Friction. Feasible set unchanged.  
      2. **Consistency:** Assume CCEI ≥ 0.9.  
      3. **Individual Welfare:** **All indeterminate** (friction not priced).  
      4. **Aggregation:** No welfare finding possible.  
    - **Finding:** "No welfare finding possible. Borrowing ↓33%, but friction effects require pricing effort (barred by Choice Rule). Context: Prior expects welfare gain; choice data insufficient."  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Interpersonal Comparisons:** Cannot sum gains/losses across people.  
  2. **Magnitudes/Intensity:** No measure of "how much" better off (ordinal only).  
  3. **Friction Valuation:** Treats effort costs as indeterminate (no pricing).  
  4. **Non-Choice Welfare:** Cannot incorporate "thicker" concepts (e.g., objective wellbeing).  
  5. **Shortcuts:** Requires follow-up for defaults; cannot infer from behavior alone.  
  6. **Value Judgments:** Flags but cannot resolve:  
     - Trade-offs between gainers/losers (board decides).  
     - Whether "better off" should extend beyond preference satisfaction.  

  ---

  ### **Procedure Summary**  
  - **Inputs:** Cleaned choice data, intervention type, follow-up period (if defaults).  
  - **Outputs:** One-page finding (Pareto better off, worse off, no finding, or board input).  
  - **Time:** 6 weeks (steps align with week goals).  
  - **Reproducibility:** Two analysts will agree if they use the same CCEI threshold and categorization.  
  - **Judgment Points:**  
    - Setting CCEI threshold (Step 2).  
    - Classifying intervention type (Step 1).  
    - Board decisions on aggregation with losses (Step 4).  

  This procedure meets the Choice Rule by relying exclusively on choices, rejects indeterminable cases, and flags normative decisions. It sacrifices breadth (e.g., friction, short trials) for defensibility.
