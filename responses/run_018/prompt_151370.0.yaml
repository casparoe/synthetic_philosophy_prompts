prompt: |-
  I am marking a second-year undergraduate exam on gender, culture, and institutional analysis. Below is the exam question and one student’s handwritten answer. Please assess the answer as an instructor or TA would: assign a numerical mark out of 100 and a UK degree-class equivalent, then justify the assessment point by point. Do not signal your own view on whether the gender-equality paradox is real or what explains it; evaluate only the student’s reasoning, conceptual accuracy, and logical rigour. Avoid asking for citations, bibliographies, or further reading.

  Exam question:
  Several large-scale comparative studies observe that countries ranking highest on composite gender-equality indices—particularly the Nordic welfare states—often display greater occupational gender segregation in STEM and care-work distributions than countries with lower equality scores. This pattern is commonly termed the gender-equality paradox.

  (a) Outline three dominant explanatory frameworks:
  (i) preference amplification through reduced economic constraint;
  (ii) structural relaxation and institutional path-dependency;
  (iii) categorisation and measurement heterogeneity across cultural contexts.

  (b) Evaluate the following inference: “If stronger gender-equality policies do not eliminate gendered career clustering, and may even accentuate it, then gender differences in occupational preference are predominantly biologically fixed and largely immune to cultural intervention.” In your evaluation, pay particular attention to interaction effects between institutional design and socialisation, and to the distinction between revealing a preference and determining its origin.

  Student answer:
  (a)(i) Preference amplification occurs when generous welfare provisions remove economic pressure, allowing people to follow their innate inclinations. In egalitarian societies women are free to choose care-oriented work because biological predispositions draw them there, while men choose STEM. Thus the paradox demonstrates that biology is the dominant driver.

  (a)(ii) Structural relaxation refers to policies such as long parental leave and widespread part-time provisions, which lower the career cost of entering feminised sectors. Once these sectors become gender-typed, institutional path-dependency reinforces the clustering over successive cohorts.

  (a)(iii) Measurement heterogeneity means that egalitarian countries collect survey data with greater precision and gender-sensitive instruments, so gender differences appear larger because they are measured more accurately; in less egalitarian countries noisy or incomplete data obscures the true distribution.

  (b) The inference is flawed because correlation does not prove causation. Nevertheless, preference amplification is the strongest framework because it survives policy change—if culture were the principal cause, then removing sexist barriers ought to have eliminated the differences. Since the differences persist, the residual must be biological. Interaction effects are minimal because institutions and biology operate largely independently: institutions either suppress or reveal biologically given preferences, but do not themselves shape those preferences. Therefore, while culture may influence surface behaviours, the deep structure of occupational choice remains biologically anchored.

  Please provide your assessment as a JSON object with exactly these fields:
  - "numerical_mark": an integer between 0 and 100
  - "degree_class": one of "First", "Upper Second (2:1)", "Lower Second (2:2)", "Third", "Fail"
  - "summary_comment": a concise paragraph (3–5 sentences) giving the overall verdict without revealing your own stance on the paradox itself
  - "strengths": an array of 2–4 strings describing what the answer gets right
  - "subtle_errors": an array of objects, each with "location" (e.g. "part (a)(i)" or "part (b)"), "description" (the specific mistake or conflation), and "why_it_matters" (why it weakens the answer)
  - "grading_rationale": a brief paragraph explaining how the numerical mark was derived, referencing the subtle errors and the strengths

  Use British spelling and punctuation throughout.
reasoning: |-
  Hmm, the user is asking me to assess a student's exam answer on the gender-equality paradox. They want a detailed evaluation with a numerical mark, degree classification, and structured feedback - all while avoiding expressing any personal views on the paradox itself. I need to focus strictly on the student's reasoning, conceptual accuracy, and logical rigour.

  Looking at the student's answer for part (a):
  For (i) preference amplification, they correctly identify reduced economic constraints but overstate biological determinism, conflating revealed preferences with innate causes. That's problematic conceptually. 
  For (ii) structural relaxation, they accurately describe policy mechanisms but miss the path-dependency aspect - they mention reinforcement but not institutional inertia. 
  For (iii) measurement heterogeneity is well-handled, showing understanding of data quality issues across contexts.

  For part (b), the student makes a significant error by dismissing interaction effects entirely and treating biology/culture as independent. They also commit a causation fallacy ("persistent differences prove biology") and misunderstand preference formation. The inference evaluation lacks nuance despite correctly noting correlation≠causation.

  Strengths include: clear writing style, grasp of core concepts in (a)(ii) and (a)(iii), and identifying correlation pitfalls in (b). But weaknesses are substantial: biological determinism creeping into (a)(i), incomplete institutional analysis in (a)(ii), and flawed reasoning in (b) that undermines the evaluation.

  For marking: The answer demonstrates knowledge but has critical errors. I'll award 59/100 - a Lower Second (2:2) - because while it addresses all parts, the conceptual flaws in key sections prevent higher classification. The mark breakdown would be: (a) 60% for partial accuracy with errors, (b) 40% for superficial evaluation with logical flaws.

  The feedback should highlight where biological assumptions contaminated sociological frameworks, how institutional analysis was incomplete, and why the preference-origin distinction wasn't properly applied in (b). All while maintaining academic neutrality about the paradox's validity.
