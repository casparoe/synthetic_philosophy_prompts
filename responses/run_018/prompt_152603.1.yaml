prompt: |-
  I'm running a session for a small group of smart undergrads who think genocide is basically just a strong word for mass murder, and that the UN label is mostly moral outrage with legal window dressing. I want to walk them through Lemkin's original broad concept — where destroying a group's culture or economic life counts too — against the 1948 Convention's tighter "intent to destroy in whole or in part" framing, and then use that gap to show why naming an atrocity is never neutral: it decides which harms get counted and which obligations get triggered. I need the explanitory dependancy arc: what concept has to be in place before the naming-politics question even makes sense, then the one carrying case that needs both physical killing and cultural erasure present but where the legal category only grabs one side, then the misconceptions they'll raise in order — probably "it's just semanics," then "intent is obvious if bodies pile up," then "without the genocide label there's no serious duty" — and exactly where in the sequence each should be absorbed. What's the check that they've understood the politics of naming rather than just memorized the Convention definition, and what should I deliberately leave out at this level — maybe the ICJ jurisprudence or the draft cultural-genocide clauses? No bibliography or reading list please. Please finish with a line that reads Verdict: [your one-sentence bottom line].
reasoning: |-
  Okay, the user is preparing a session for undergrads who view genocide as just a strong term for mass murder, seeing the UN label as moral outrage with legal trappings. They want to clarify Lemkin's broad concept versus the 1948 Convention's narrow legal definition, highlighting how naming atrocities isn't neutral—it determines which harms are recognized and what obligations follow. 

  First, I need to establish the foundational concept: the students must grasp that "genocide" is a constructed category, not a natural fact. Without this, the politics of naming won't make sense. The dependency arc should start here. 

  Next, the user wants a case study that bridges physical and cultural destruction, showing the legal gap. Residential schools fit perfectly—physical harm (death/disease) + cultural erasure (forced assimilation), but only the former is legally genocide under the 1948 definition. This illustrates the "gap" vividly. 

  For misconceptions, sequencing matters: 
  - "Just semantics" comes first—they must see definitions have real-world consequences. 
  - "Intent is obvious from bodies" follows, challenging the assumption that visible violence equals clear intent. 
  - "No genocide label, no duty" last, underscoring how legal categories gatekeep intervention. 

  The check for understanding: if they can articulate why a non-Convention atrocity (e.g., cultural destruction without killings) still demands action, they get the politics. If they only recite the Convention, they don't. 

  What to omit: ICJ cases and draft cultural clauses would overcomplicate. Keep it conceptual. 

  Final verdict needs to stick: "The power to name is the power to decide what the world must notice—and what it can ignore." Sharp and memorable. 

  User’s unspoken need? They’re likely pushing back against cynical "it’s all just labels" attitudes. The deeper goal is ethical: helping students see that dismissing legal categories risks silencing victims of non-physical destruction. The session isn’t just about definitions—it’s about accountability for erasure that doesn’t leave bodies.
answer: |-
  Here’s a structured sequence to guide your session, designed to build conceptual understanding step-by-step and preempt common misconceptions:

  ---

  ### **1. Foundational Concept: The Constructed Category**  
  **Start here:** Genocide isn’t a pre-existing natural phenomenon but a **human-created category** designed to label specific horrors. *Why this first?* Without grasping that "genocide" is a defined framework (not self-evident), students won’t see the stakes of *how* it’s defined.  

  ---

  ### **2. Lemkin vs. Convention: The Gap**  
  - **Lemkin’s vision (1944):** "Destruction of a group’s identity" via **any means**: killing, cultural erasure (banning language/religion), dismantling economic foundations, or forced assimilation.  
  - **1948 Convention’s definition:** Focuses **only** on *physical/biological destruction* ("intent to destroy in whole or in part") with acts like killing or preventing births.  
  **Key contrast:** Lemkin saw cultural annihilation as genocide; the Convention excludes it.  

  ---

  ### **3. The Bridge Case: Residential Schools (Indigenous Canada/US/Australia)**  
  **Why it works:**  
  - **Physical harm:** Mass child deaths from disease/malnutrition.  
  - **Cultural erasure:** Systematic removal of children, banning native languages/religions, forced assimilation.  
  **The gap in action:**  
  - Under Lemkin: Clear genocide (cultural + physical destruction).  
  - Under 1948 Convention: Not legally genocide—cultural tactics alone don’t count. Physical harm was often framed as "collateral damage," not explicit intent to destroy the group *physically*.  
  **Takeaway:** This case forces recognition that the Convention’s definition *ignores* culturally destructive acts that Lemkin deemed core.  

  ---

  ### **4. Absorbing Misconceptions in Sequence**  
  | **Misconception** | **When to Address** | **Counterpoint** |  
  |-------------------|---------------------|------------------|  
  | *"It’s just semantics"* | After presenting the gap (Step 3) | **Semantics = power:** Definitions decide which victims get justice. If cultural destruction isn’t "genocide," states face no legal obligation to stop it. |  
  | *"Intent is obvious if bodies pile up"* | After discussing residential schools | **Intent ≠ outcome:** Mass death alone doesn’t prove *intent to destroy the group*. Colonial powers often claimed they were "saving" or "civilizing" children—outcome (death) ≠ intent (destruction). |  
  | *"No genocide label = no serious duty"* | After addressing intent | **Label triggers legal machinery:** The Convention mandates prevention/punishment *only* for acts meeting its definition. Without the label, cultural destruction gets relegated to "human rights violations"—less urgency, no international courts. |  

  ---

  ### **5. Check for True Understanding**  
  **Ask:** *"If a state systematically bans a group’s language, destroys its sacred sites, and forcibly sterilizes members—but avoids mass killings—is it genocide? Why does the answer matter beyond morality?"*  
  - **If they get it:** They’ll note the 1948 Convention excludes this (no legal consequences), though Lemkin would call it genocide. They’ll tie the label to *enforceable obligations*.  
  - **If they don’t:** They’ll fixate on morality ("it’s still wrong") without seeing the *practical void* in international law.  

  ---

  ### **What to Deliberately Omit**  
  - **ICJ jurisprudence:** Too technical; distracts from core conceptual gap.  
  - **Draft cultural-genocide clauses:** Avoids tangents about "what could have been."  
  - **Modern cases (e.g., Uyghurs, Rohingya):** Emotionally/politically charged; stick to historical examples to focus on mechanics.  

  ---

  ### **Verdict:** The genocide label is a political scalpel: it cuts some harms into the realm of international obligation while leaving others to the bleeding edge of moral outrage.
