answer: |-
  Here's your Q&A prep sheet, prioritized by damage potential and tailored to your audience. Replies are designed for a tight 2-minute response window.

  **Most Damaging to Least Damaging:**

  1.  **Social Historian (Sans-culotte Focus):**  
      *"You’re ignoring the oxygen feeding this bureaucratic fire. The September Massacres, the *enragés* pushing price controls, the constant sections demanding action – the Committees *had* to escalate arrests because the streets demanded blood. Your 'dual-key' is just the machinery processing the raw material of popular fury. Doesn’t your model render the masses passive?"*  
      **Reply:** "Absolutely, popular pressure was the fuel. But the dual-key structure was the faulty engine *guaranteeing* runaway acceleration. The CGS (police) *had* to feed denunciations to prove vigilance. The CPS (govt) *had* to authorize arrests or look weak – to the sections *and* each other. It wasn't passive masses, but a system where satisfying popular anger became bureaucratically *locked in* and self-reinforcing, far beyond initial demands."  
      **Soft Spot:** Needs clearer evidence that *fear* of appearing soft *to each other* was a bigger driver than fear of the *sans-culottes* directly in late-stage Terror.

  2.  **Intellectual Historian (Virtue Discourse Focus):**  
      *"This feels like reducing the sublime terror of revolutionary logic to a filing cabinet error. Robespierre spoke of virtue necessitating terror against corruption. Saint-Just theorized it. The language of conspiracy and purity *created* the denunciations. Wasn't the institutional overlap merely a *symptom* of this ideological imperative to purge, not the cause?"*  
      **Reply:** "The ideology provided the *justification* and the terrifying vocabulary, yes. But the *relentless, unsustainable escalation* needs a structural explanation. Why didn't cooler heads prevail? Why did it *accelerate*? The dual-key created a perverse incentive: halting denunciations exposed *you* as insufficiently virtuous (or corrupt) to the *other* Committee. Ideology rationalized the Terror; this glitch prevented its modulation."  
      **Soft Spot:** Concedes ideology's power as motive/justification; needs to firmly insist it doesn't explain the *specific dynamic & timing* of the acceleration/collapse.

  3.  **Political Scientist (Institutionalist Skeptic):**  
      *"You're overfitting. You've found an interesting friction point but elevated it to *the* cause. What about factional struggles (Danton vs. Hébert), war pressures, economic collapse? The Terror had multiple drivers; your 'glitch' might explain *some* inefficiency, but claiming it *drove* the dynamic ignores the complex system at play. Isn't this just cherry-picking bureaucracy?"*  
      **Reply:** "I agree it's multi-causal: war, economics, ideology, faction. But the dual-key wasn't just friction; it was an *amplifier* and *accelerant*. Other crises create pressure; this specific institutional flaw *prevented pressure release*, turning all other factors into runaway momentum. It explains *why* the Terror couldn't be contained *despite* changing conditions or factions falling. The system itself became the driver."  
      **Soft Spot:** Must avoid sounding like it's the *only* cause. Emphasize "critical accelerator/lock-in mechanism" not "sole driver."

  4.  **Social Historian (Sans-culotte Focus):**  
      *"If this bureaucratic flaw was primary, why did the Terror peak coincide with intense popular mobilization for the *levée en masse* and the Law of Suspects? Doesn't this timing show the Committees were *responding* to, even channeling, real grassroots fear and demand for action, not just trapped by paperwork?"*  
      **Reply:** "The external pressures were immense and real. The dual-key system *determined the response mechanism* to those pressures. Facing crisis, the system defaulted to *more* arrests because neither committee could afford to be the one seen as blocking action. It amplified the legitimate response into an uncontrollable purge. The flaw dictated *how* the system reacted under stress."  
      **Soft Spot:** Needs to show specific instances where institutional logic overrode *practical* security needs or popular pressure eased but arrests continued.

  5.  **Intellectual Historian (Virtue Discourse Focus):**  
      *"But the actors *themselves* understood their actions through virtue/purity. Robespierre genuinely believed he was saving the Republic. Doesn't reducing his downfall to an institutional power play ignore the *meaning* he ascribed to his actions? Wasn't his attempt to dissolve the Committees driven by his ideological belief in their corruption, not just bureaucratic expediency?"*  
      **Reply:** "Robespierre's *rhetoric* was steeped in virtue, absolutely. But his *final, fatal action* – trying to dissolve *both* Committees – was a direct assault on the structure paralyzing the government. He framed it ideologically ("corruption"), but the *target* was the machinery causing the uncontrollable purge he could no longer stem. Ideology was his language; institutional deadlock was his problem."  
      **Soft Spot:** Walking a line between motives and structural constraints. Hard to *prove* Robespierre's primary motive was structural rather than ideological/personal.

  6.  **Social Historian (Sans-culotte Focus):**  
      *"After Thermidor, the institutional setup changed, but repression continued (White Terror). If the dual-key was so crucial, why didn't the violence stop when it was gone? Doesn't this suggest deeper social/political forces were always paramount?"*  
      **Reply:** "Thermidor ended the *peak* of the Terror and its specific *mechanism*. The White Terror was revenge-driven, factional, and decentralized – qualitatively different from the state-driven, systematic Terror fueled by the CGS/CPS deadlock. The dual-key explains the *uniquely intense, centralized, self-accelerating phase* of 1793-94."  
      **Soft Spot:** Concedes the dual-key's effect was period-specific; must argue its *unique* role in creating that *specific* intensity/centralization.

  7.  **Political Scientist (Institutionalist Skeptic):**  
      *"Where's the smoking gun? Did Robespierre or others *explicitly* say, 'We can't stop arrests because of the dual-key problem'? Or is this inferred retroactive institutional analysis? Isn't this reading modern bureaucratic theory onto actors driven by more immediate, visceral fears and ambitions?"*  
      **Reply:** "They wouldn't use our terms, but the *behavior* is clear: the CGS kept investigating/denouncing; the CPS kept signing warrants; neither could unilaterally stop without risking accusation from the other. The records show constant tension, suspicion, and accusations *between* the committees. Robespierre's attack on both is the ultimate evidence he saw the *structure* itself as the enemy."  
      **Soft Spot:** Relies on interpreting actions/conflicts as evidence of structural logic vs. personal rivalry or ideology.

  8.  **General (Potentially from any):**  
      *"Isn't this just a fancy way of saying 'power struggles happen in committees'? How is this 'contingency' any different from normal political infighting during a crisis?"*  
      **Reply:** "Normal infighting doesn't create a systemic *machine for escalation*. The contingency was the *specific, overlapping jurisdiction* creating mutual vetoes on *de-escalation*. Neither side could back down without empowering the other. This turned routine political conflict into an engine of terror with its own uncontrollable momentum."  
      **Soft Spot:** Needs to sharply distinguish the *unique structural consequence* (forced escalation) from generic "committee squabbles."

  **The Question You're Praying Nobody Asks:**

  *   **Nightmare Question (Likely from a Sharp Intellectual or Social Historian):**  
      *"If Robespierre was truly trying to *solve* this bureaucratic glitch by dissolving both Committees, why did his actions and rhetoric in the weeks before Thermidor focus so intensely on the 'Conspiracy of the Foreign Plot,' the need for *more* purges within the Convention itself, and renewing the Law of 22 Prairial (which streamlined executions)? Doesn't this suggest he wasn't trying to *stop* the Terror machine, but *take absolute control* of it for his own faction's ideological purge, and the 'institutional reform' was just cover for a power grab?"*

  **Why it's a Nightmare:** It directly challenges the core argument that Robespierre was acting to *end* the systemic Terror. It suggests he was just another player *using* the system (and even tightening it) for his own ends, and his move against the Committees was purely about *centralizing* power for *more* ideological purging, not dismantling the engine. It merges ideology, personal ambition, and institutional maneuvering in a way that completely undermines the "institutional contingency as primary driver of the *devouring*" thesis. Your reply would need to perform complex gymnastics separating his earlier actions (using the system) from his final move (attacking the system's structure), which is very difficult with the Prairial Law timing.
