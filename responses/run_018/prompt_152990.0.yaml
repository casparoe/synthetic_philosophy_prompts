  **VOYAGE ASSURANCE DIVISION - PRE-BOARDING SAFETY ANNOUNCEMENT**  
  **(Transcript Version 7.3 - Mandatory Review)**  

  **CAPTAIN:** Good afternoon, valued stakeholders. This is your Voyage Assurance Facilitator speaking. Please direct your attention to the overhead monitors as we review mandatory embarkation protocols for State Ark Vessel *Horizon Perseverance*. Compliance ensures optimal resource allocation.  

  **CREW MEMBER 1:** Welcome aboard. Your boarding pass displays a unique alphanumeric identifier and your Lifetime Carbon Allocation Score (LCAS). Verify this matches your government-issued Sustainability Ledger. Discrepancies must be resolved at Deck 3 Audit Compliance before proceeding. *[Pause]* Thank you.  

  **CREW MEMBER 2:** Proceed to your assigned embarkation lane: **Blue Lane** (LCAS 0-100 tonnes), **Green Lane** (LCAS 101-250 tonnes), or **Amber Lane** (LCAS 251+ tonnes). Lane assignment optimizes boarding throughput and buoyancy distribution. Do not queue across lanes.  

  **CREW MEMBER 1:** Stow all personal effects in your designated Under-berth Carbon Storage Locker (UCSL). Luggage mass is converted to equivalent CO₂ tonnes using the International Air Transport Association standard (0.08 tonnes/kg). UCSL capacities are fixed. Excess mass will trigger a Carbon Offset Adjustment Fee or require item relinquishment.  

  **CAPTAIN:** A reminder: your berth assignment correlates directly to your verified LCAS. Higher-scoring stakeholders occupy lower decks nearest stability bulkheads. This is not a value judgment. It is hydrostatic calculus.  

  **CREW MEMBER 2:** Life vests are located beneath your berth. In the unlikely event of buoyancy compromise, don your vest *only* when the Stability Optimization Algorithm (SOA) activates your vest’s beacon. Premature activation wastes beacon battery life. Non-activated vests lack flotation properties. This is intentional resource preservation.  

  **CREW MEMBER 1:** Should SOA-initiated evacuation occur, proceed *calmly* to your assigned life pod station. Your station corresponds to your embarkation lane (Blue, Green, Amber). Pod boarding priority follows LCAS ascending order (lowest scores first). Do *not* attempt pod reassignment. Cross-lane boarding destabilizes pod deployment.  

  **CAPTAIN:** Stakeholders whose aggregate LCAS exceeds their pod’s buoyancy index will be directed to **Triage Lounge Gamma** on Deck 7. Lounge amenities include seating, hydration stations, and real-time atmospheric metrics. Repatriation coordinators will assist with documentation for terrestrial reentry.  

  **CREW MEMBER 2:** Triage Lounge Gamma is a *transitional* facility. It is not a berth. Do not affix personal items to lounge fixtures. Do not form queues at lounge exits. Reentry processing operates via the Fair Allocation of Finite Resources (FAFR) protocol. Emotional appeals do not accelerate processing.  

  **CREW MEMBER 1:** Parents/guardians: Minor dependents inherit a *provisional* LCAS equivalent to 50% of the accompanying adult’s score until their 18th year. Unaccompanied minors under LCAS 15 tonnes report directly to Pod Station Blue-1 for guardian reassignment per the Kinship Continuity Clause.  

  **CAPTAIN:** I understand protocols may cause discomfort. Please recall: this vessel’s carrying capacity is a fixed integer. My role is to execute the Resource Equilibrium Algorithm, not interpret its variables. Grievances regarding LCAS methodology or pod allocation ratios should be submitted via Voyage Feedback Portal *after* embarkation.  

  **CREW MEMBER 2:** Final boarding checks are underway. Stakeholders in Amber Lane: Proceed to LCAS Verification Kiosks for secondary biometric audit. This is mandatory.  

  **CREW MEMBER 1:** Stakeholders approaching Triage Lounge Gamma: Kindly silence personal devices. Lounge acoustics are calibrated for minimal decibel pollution.  

  **CAPTAIN:** On behalf of the Voyage Assurance Division, we deeply regret any systemic inconvenience. Remember: adherence to protocol maximizes aggregate survival probability. We now commence buoyancy equilibrium sequencing. Enjoy your voyage.  

  **[ANNOUNCEMENT CONCLUDES]**  

