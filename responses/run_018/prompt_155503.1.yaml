answer: |-
  Your inquiry cuts to the heart of Arendt's ontology of the public realm and the precariousness of factuality within it. Let's address the conceptual tensions by tracing the dependencies between testimony, appearance, institutional framing, and the specific threat of structural omission.

  ### Core Dependency: Appearance, Testimony, and the Common World
  1.  **The World as Appearance:** For Arendt, politics occurs in the "space of appearance" – a shared, public realm constituted *by* and *for* plurality. Reality is not a pre-given, objective totality but emerges *between* people through speech, action, and shared perception. What "appears" in this space *is* the common world. Factual truths are constituents of this shared reality.
  2.  **Factual Truth's Vulnerability:** Rational truths (e.g., mathematical proofs) are compelling in isolation. Factual truths (e.g., "this event happened") rely entirely on **testimony and witness**. They require:
      *   **Witnesses:** Individuals who experienced or reliably documented the event.
      *   **Recognition:** Others who accept the testimony as valid and incorporate it into the shared narrative.
      *   **Institutional Memory:** Structures (archives, courts, media, discourse) that preserve and transmit testimony across time and space, making it part of the "common sense" world.
  3.  **The Political Fragility Link:** Because factual truths depend on *human* testimony and *human* institutions for their existence in the common world, they are inherently vulnerable. They lack the coercive self-evidence of rational truths and are susceptible to:
      *   **Direct Denial (Lying):** Contradicting testimony.
      *   **Organized Deception:** Creating a pervasive, self-reinforcing fictional narrative that substitutes for reality.
      *   **Structural Omission:** Your central concern – the exclusion of testimony/facts from the categories and vocabulary that structure shared perception and decision-making.

  ### Bureaucratic Omission: Defactualization Before Falsehood
  This is where your "administratively unthinkable" phenomenon operates with devastating subtlety, fitting precisely within Arendt's framework:

  1.  **Not Mere Lying, But Pre-Conditional Erasure:** Arendt distinguishes *lying* (intentionally asserting a falsehood) from *defactualization*. Defactualization attacks the *ground* upon which factual truth stands. Bureaucratic omission is a primary mechanism of this:
      *   **Institutional Framing as World-Building:** Bureaucracies, governments, and other institutions don't just *reflect* reality; they actively *structure* the space of appearance through their categories, procedures, metrics, and permissible language. They define what is "relevant," "actionable," "measurable," and thus **perceivable** within the administrative-political realm.
      *   **Omission as Structural Exclusion:** When a fact (e.g., evidence of climate change impacts on a marginalized community, historical patterns of systemic bias, the long-term cost of a policy) cannot be:
          *   **Named** within the official vocabulary (no category exists).
          *   **Measured** by the established metrics (it's "anecdotal," "qualitative," "not in the dataset").
          *   **Processed** by the decision-making procedures (it falls outside the mandate, the cost-benefit model, the legal framework).
          ...it is effectively **erased from the institutionalized space of appearance**. It becomes "administratively unthinkable."
  2.  **How it Destroys Common Reality Without Asserting Untruth:**
      *   **Silencing Testimony:** Witnesses may speak, but their testimony has no conceptual "hook" within the dominant institutional framework. It cannot be registered, debated, or acted upon *politically* (in the administrative sense). It remains private, ignored, or dismissed as "noise."
      *   **Undermining Shared Perception:** The institutional framework defines what "appears" as relevant reality for collective action. By excluding certain facts categorically, it prevents them from becoming part of the *shared* world. Citizens operating within or relying on these institutions literally *cannot see* the excluded fact as a relevant political object, even if they know of it privately.
      *   **Destroying Correctability:** Arendt emphasizes that factual truths, unlike rational truths, are *stubborn* – experience can correct falsehoods. Structural omission bypasses this. **The excluded fact cannot be "corrected" by experience because the experience pointing to it is rendered invisible or irrelevant by the institutional structure itself.** There's nothing *to* correct within the operating framework. The framework immunizes itself.
      *   **Prior to Falsehood:** This omission doesn't necessarily assert "X is false." It asserts, more insidiously, **"X does not exist *for us*, within *our* world of action."** It dismantles the *conditions* under which X could be recognized *as* a fact within the political realm. This is defactualization operating at the level of the *structure of appearance itself*.

  ### Relating Omission to the Shared World & Vulnerability
  *   **Requirement for Shared World:** Political action absolutely requires a shared world of appearance. Bureaucratic omission directly attacks this by **shrinking the space of appearance**. It dictates what aspects of reality are "admissible" into the public-political sphere governed by institutions. It makes the shared world *artificially narrow* and *unresponsive* to significant aspects of lived experience.
  *   **Amplifying Vulnerability:** Structural omission exploits the *very source* of factual truth's vulnerability – its dependence on human frameworks for recognition and preservation. It weaponizes the institutional structures *meant* to sustain factual reality (by providing stable categories, procedures, records) and turns them into instruments of erasure. The fragility stemming from reliance on testimony is compounded when the *channels* for testimony are systematically blocked for certain facts.

  ### Conclusion: Omission as Foundational Defactualization
  Within Arendt's framework, bureaucratic omission is **not merely lying, but a more fundamental and insidious form of defactualization.** It operates *prior* to the assertion of falsehoods by dismantling the institutional and conceptual pre-conditions necessary for specific factual truths to appear, be witnessed, be recognized, and be debated within the common world. By rendering facts "administratively unthinkable," it:

  1.  **Severs the link between testimony and political reality:** Experience and witness become powerless against the structural exclusion.
  2.  **Corrupts the space of appearance:** It replaces a world open to the full plurality of human experience with a bureaucratically curated fiction masquerading as objective reality.
  3.  **Destroys the common world:** It prevents the shared reality from encompassing the full spectrum of facts relevant to collective life and decision-making, making genuine political action based on a full understanding of the world impossible.

  This omission is thus a profound attack on the possibility of politics itself, as it systematically prevents the common world from being truly common and responsive to the factual ground upon which it must rest. It attacks not just *what* is true, but *the possibility of truth appearing* within the political realm.
