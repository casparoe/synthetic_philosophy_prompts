prompt: |-
  I've been arguing with a friend about whether virtue ethics can survive the situationist critique without collapsing into something its defenders wouldn't recognize. She thinks that if we abandon global character traits—those stable, cross-situational dispositions that classical virtue ethics seems to require—and replace them with what we might call niche-bound predictive clusters, where an agent behaves consistently only within specific ecological or social contexts, then we haven't salvaged virtue ethics but dissolved it into a form of contextualist psychology. I want your actual credence that this reconciliation succeeds: specifically, that reconceptualizing virtues as localized, context-sensitive clusters can accommodate the empirical variability data without stripping virtue ethics of its normative core—its account of practical wisdom, long-term character development, and eudaimonia.

  Please decompose that credence into explicit terms with rough probabilities and one-line justifications: (a) the probability that the classic situationist experiments genuinely show high cross-situational behavioral variance rather than mostly noise or poor construct measurement; (b) the probability that virtue ethics conceptually requires global traits, rather than being compatible with locally stable dispositions, for its normative claims to hold; (c) the probability that niche-bound clusters can still ground the kind of enduring moral education and self-cultivation that virtue ethicists treat as central; and (d) any other dependency you think materially affects the outcome. Combine them into a final number, then tell me which term you are least confident in and what specific philosophical argument or empirical finding would shift it the most.
