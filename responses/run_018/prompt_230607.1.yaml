answer: |-
  Here is a comprehensive specification of desiderata for a theory linking simplicity to prior probability, structured to address your core requirements and highlight tensions. I've categorized them, flagged their status, and identified key conflicts.

  **Core Desiderata for an Adequate Account:**

  1.  **Normative Justification for Simplicity Bias:**
      *   **Desideratum:** The theory must provide a *normative justification* for why a rational agent *should* assign higher prior probability to simpler hypotheses.
      *   **Distinction:** This is distinct from merely *describing* a prior assignment rule favoring simplicity. It requires an argument linking simplicity bias to *epistemic goals* (e.g., convergence to truth, optimal prediction, avoidance of overfitting).
      *   **Status:** **Non-negotiable** for a foundational account in formal epistemology. A purely descriptive assignment rule lacks normative force. *(Can you assign w/o justification? Technically yes, but the account would be incomplete for epistemology's normative aims.)*

  2.  **Truth-Tracking Explanation:**
      *   **Desideratum:** The theory should ideally *explain* why favoring simplicity is a reliable strategy for *finding true hypotheses* (or making accurate predictions) in our world.
      *   **Distinction:** This is stronger than (1). Justification might appeal to coherence or optimality under uncertainty without guaranteeing truth-tracking (e.g., Dutch book arguments). Explanation requires showing why simplicity correlates with truth in the actual environment.
      *   **Status:** **Highly Desirable, Contentious.** Many see this as the ultimate goal. Others argue (1) is sufficient for rational choice, and truth-tracking is a contingent bonus (if the world is simple) that the justification doesn't *need* to guarantee. *(Can you have (1) without (2)? Yes, but (2) significantly strengthens the account.)*

  3.  **Language/Machine Relativity & Invariance:**
      *   **Desideratum:** The theory must explicitly acknowledge that its measure of simplicity (e.g., Kolmogorov complexity) is defined *relative to a universal Turing machine (UTM) or language/code*. It must grapple with the Kolmogorov invariance theorem: complexities differ only by an additive constant *c* across UTMs.
      *   **Constant-Dependence Tolerance:** **Controversial, but likely necessary.** For finite data, the constant *c* does *not* wash out and significantly impacts prior ratios between hypotheses. This is a fundamental limitation:
          *   *Intolerable?* If we demand *objective*, language-independent priors, yes. This dependence injects subjectivity.
          *   *Tolerable?* If we accept that priors are *conditioned* on a choice of universal language/machine reflecting our basic ontological/cognitive commitments about what constitutes a "natural" description, then it might be acceptable. The constant *c* reflects the complexity of translating between these fundamental languages. Convergence theorems often mitigate its impact asymptotically, but finite data reliance is unavoidable.

  4.  **Computability & Tractability:**
      *   **Desideratum:** The theory must address the *uncomputability* of ideal simplicity measures (e.g., Kolmogorov complexity). It must specify its stance on idealization vs. approximation vs. demanding computability.
      *   **Options & Trade-offs:**
          *   *Idealization:* Accept uncomputability as a foundational ideal (e.g., Solomonoff). Requires arguing that computable agents can rationally approximate the ideal.
          *   *Approximation:* Provide computable approximations (e.g., MDL with restricted model classes, resource-bounded Kolmogorov complexity). Requires justifying why the approximation retains the desirable properties (justification/truth-tracking) of the ideal.
          *   *Demanding Computability:* Insist the prior and simplicity measure be computable. Likely forces significant weakening of the ideal justification/truth-tracking guarantees.
      *   **Status:** Addressing this is **Non-negotiable.** The choice of stance (idealization/approximation/computability) is a major differentiator between accounts and involves significant trade-offs.

  5.  **Handling Pathological Cases:**
      *   **Desideratum:** The theory must demonstrably assign appropriately low prior probability to "bad" hypotheses that exploit naive simplicity notions:
          *   *Gerrymandered Disjunctions:* E.g., "All ravens are black OR the moon is made of green cheese on Tuesdays." Should receive very low prior despite potentially low complexity if coded poorly.
          *   *Hidden Complexity:* Hypotheses where complexity is masked by the coding scheme (e.g., a program that outputs the data table but relies on an oracle or uncomputable constant).
          *   *Overfitters/Non-Generalizers:* Hypotheses that fit finite data perfectly but generalize horribly (e.g., "Grue" emeralds, lookup tables for the specific dataset). Should receive lower prior than genuinely simple, general hypotheses fitting the same data.
      *   **Status:** Correct handling of these is **Non-negotiable.** Failure here indicates a fatal flaw in the simplicity measure or prior assignment rule.

  **Key Conflicts and Joint Unsatisfiability:**

  Your suspicion is astute. Achieving *all* desiderata simultaneously appears impossible. The core tensions are:

  1.  **Truth-Tracking Justification + Language Invariance + Computability:** This trio seems jointly unsatisfiable.
      *   Achieving a strong *truth-tracking explanation* (Desideratum 2) typically relies on idealized, asymptotic results (like Solomonoff's dominance) rooted in uncomputable Kolmogorov complexity relative to a UTM (violating Computability). Making it computable usually involves approximations (MDL) that weaken the theoretical truth-tracking guarantee, potentially reducing it to justification (Desideratum 1) without strong explanation. Language invariance is impossible per Kolmogorov; demanding it would clash with the fundamental relativity needed for the complexity definition underpinning the truth-tracking argument.

  2.  **Strong Truth-Tracking + Finite Data Performance:** Asymptotic dominance guarantees (truth-tracking) don't ensure good performance with finite data. The additive constant *c* in invariance (Desideratum 3) means priors can be arbitrarily skewed for finite datasets, potentially derailing the truth-tracking promise in practice, even if it holds in the limit.

  3.  **Ideal Justification vs. Practical Tractable Approximation:** The ideal (Solomonoff) satisfies (1), (2) asymptotically, and (5) but fails (3) tolerance (constant issue) and (4) (uncomputable). Practical approximations (MDL) address (4) and partially (3) (by fixing a model class/reference machine) but often weaken the justification for (1) and (2), especially the strong truth-tracking explanation, and can struggle with (5) if the model class is poorly chosen.

  **Scoring Existing Accounts:**

  *   **Solomonoff's Mixture (Idealized):**
      *   **Normative Justification (1):** Strong. Based on coherence (Dutch book avoidance), dominance of semimeasures, and prediction optimality.
      *   **Truth-Tracking Explanation (2):** Strong asymptotic argument (dominates any computable predictor; converges to true probabilities if computable). Best available.
      *   **Language Relativity (3):** Explicitly relative to UTM. Acknowledges constant *c* dependency. Asymptotically mitigated, but *c* is **not** tolerable for finite data priors – a major weakness.
      *   **Computability (4):** Fully uncomputable. Requires idealization. Approximation is necessary for use.
      *   **Pathological Cases (5):** Excels. Gerrymandered disjunctions, hidden complexity schemes, and lookup tables have high Kolmogorov complexity *relative to a natural UTM* and thus very low prior. "Grue" is complex.
      *   **Summary:** Gold standard for (1), (2), (5) asymptotically. Fails (4) utterly and (3) is problematic for finite data.

  *   **Minimum Description Length (MDL - Practical Approximation):**
      *   **Normative Justification (1):** Moderate/Pragmatic. Appeals to avoiding overfitting, statistical consistency, and minimizing prediction error (e.g., through luckiness functions, normalized maximum likelihood). Often framed as *model selection criterion* rather than prior assignment.
      *   **Truth-Tracking Explanation (2):** Weak. Provides *frequentist* consistency guarantees (selects true model w.p. 1 as n->inf *if* true model in class) but lacks the strong *Bayesian* optimality/dominance justification of Solomonoff. Justification is often operational ("it works well").
      *   **Language Relativity (3):** Explicitly relative to a chosen *model class/code*. The choice is crucial and subjective. Constant-like dependencies exist based on model class richness. Tolerated as necessary for practicality.
      *   **Computability (4):** Designed for computability. Uses computable codelengths within a specified model class.
      *   **Pathological Cases (5):** Good, *if* the model class is well-chosen. Gerrymandered disjunctions/hidden complexity *outside* the class get infinite codelength/impossible. Lookup tables within the class get penalized by complexity relative to data size. "Grue" would need an awkward model. Vulnerable if model class is misspecified (e.g., includes bad hypotheses).
      *   **Summary:** Practical solution addressing (4) and tolerating (3). Provides pragmatic (1) but weak (2). Handles (5) well with good model class choice.

  **Confidence in Desiderata & Least Sure Claim:**

  *   **Overall Confidence:** The desiderata list (1-5) captures the essential challenges. I am **highly confident** that any adequate formal account *must* address these points explicitly. Their necessity stems from the foundational problems in induction, the mathematics of Kolmogorov complexity, and the need to avoid known pitfalls.
  *   **Least Sure Requirement:** The **non-negotiable status of a full Truth-Tracking Explanation (Desideratum 2)** is the point I'm least sure about.
      *   *Why?* The demand for an *a priori* justification *guaranteeing* that simplicity tracks truth in the actual world may be asking too much of *any* formal prior. Solomonoff provides the strongest possible *conditional* guarantee: *if* the data sequence is computable, then simplicity (K-complexity relative to UTM) *will* guide you to the truth asymptotically. But this doesn't prove the *actual world* is computable or that our chosen UTM reflects its "simplicity". MDL provides conditional consistency guarantees given the model class.
      *   *Alternative:* Perhaps the normative justification (Desideratum 1) – showing that simplicity bias is optimal for prediction/learning under uncertainty relative to a chosen language/model class – is sufficient for rational choice, even without a metaphysical guarantee about the world's simplicity. Truth-tracking becomes a hopeful outcome contingent on the suitability of our language/model class, not an *a priori* guarantee. This shifts the focus to the pragmatic choice of the language/model class.

  This framework should provide a robust foundation for your seminar unit, explicitly highlighting the tensions and trade-offs inherent in formalizing Occam's razor and prior probabilities. The key takeaway is that every major account makes significant compromises among these core desiderata.
