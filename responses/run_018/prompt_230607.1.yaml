  Next, language relativity. The Kolmogorov invariance theorem only gives additive constant invariance, which might not wash out with finite evidence. The question is whether this constant-dependence is acceptable. I recall that in Solomonoff induction, the constant can affect priors significantly, but it's often argued that with enough data, the likelihoods dominate. However, for finite evidence, this might be problematic. I should note that this is a point of debate.

  Uncomputability is another big issue. Kolmogorov complexity is uncomputable, so practical applications need approximations. Theories must address how to handle this—through idealization, approximation, or by accepting computable but suboptimal measures. The user wants to know the trade-offs here, so I'll discuss options like resource-bounded complexity or MDL's practical approach.

  Edge cases are important for testing theories. Gerrymandered disjunctions, hidden complexity in coding, and overfitting hypotheses (like the grue example) must be handled correctly. A good theory should assign low priors to such cases. I need to ensure these are covered as non-negotiable requirements.

  Now, conflicting desiderata. The user suspects that all existing accounts sacrifice one requirement. For example, Solomonoff's mixture handles truth-tracking via dominance but is uncomputable and language-relative. MDL is computable but might not explain truth-tracking as robustly. The tension between computability and ideal truth-tracking seems key here. Also, language relativity vs. invariance might clash with the need for objective priors.

  Scoring Solomonoff and MDL: Solomonoff excels in truth-tracking justification and handling edge cases but fails computability and has language dependence. MDL is pragmatic and computable but might not provide a deep justification for why simplicity tracks truth and could be sensitive to model class choice.

  Confidence in desiderata: Most are solid, but the non-negotiable status of truth-tracking justification is debatable. Some argue that assigning priors is enough without explaining why simplicity works, especially in practical applications. The additive constant issue is another area where I'm less sure—maybe it's unavoidable, and we accept it as a limitation.

  I should also mention joint unsatisfiability. For instance, having a computable, language-invariant measure that also provides a strong truth-tracking justification might be impossible. Solomonoff gives truth-tracking but isn't computable; MDL is computable but lacks the same theoretical guarantees.

