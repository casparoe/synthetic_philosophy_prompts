answer: |-
  Based on your precise description, this phenomenon represents a sophisticated and distinct category of deceptive communication that pushes beyond standard definitions of lying and misleading. While philosophers haven't settled on a single universally accepted term for *exactly* this configuration, it intersects with and refines several established concepts. Here's a rigorous conceptual carving:

  1.  **The Core Phenomenon:** This is **Systemic Contextual Engineering for Deceptive Inference (SCEDI)**.
      *   **Definition:** The deliberate construction of a communicative environment – through strategic sequencing, framing devices (metaphors, analogies), selective emphasis/omission of *connections* and *explanatory expectations*, and the curation of background assumptions – using only literally true atomic propositions, such that the *interaction* of these propositions within the engineered context predictably generates a specific false belief in a reasonable audience. The speaker subsequently disavows responsibility by retreating to the literal truth of the individual propositions, denying the role of their contextual engineering.

  2.  **Boundary Conditions & Distinctions:**
      *   **vs. Lying:** Clear. Lying requires asserting a false proposition. SCEDI uses only true atomic propositions. The deceptive force is not in the *content* of any single utterance but in the *system* built from them.
      *   **vs. Simple Omission:** Simple omission involves failing to state a relevant true fact. SCEDI *may* involve omissions, but crucially, the omissions are specifically of *connecting information* or *explanatory context* that would break the intended inferential chain *within the system*. The deception arises from the *active construction* of the flawed system, not just the absence of one piece of data.
      *   **vs. Standard "True but Misleading" (Paltering):** Standard misleading relies on ambiguity in a *single* statement or a *single* crucial omission leading to a false inference. SCEDI is **distributed** and **systemic**. No single proposition or omission is sufficient; the deception emerges holistically from the curated *interplay* of multiple true statements within the engineered framework. It exploits *inferential pathways* built from truth-bricks.
      *   **vs. Gricean Implicature Exploitation:** Grice's conversational implicature involves inferences drawn based on maxims (e.g., relevance, quantity). SCEDI *uses* implicature but goes further. It doesn't just exploit an inference from one statement; it *orchestrates a sequence and framing* to build a complex inferential structure *reliant* on multiple implicatures working together within the artificial context. It manipulates the *ground rules* for implicature generation throughout the discourse.
      *   **vs. Bullshit (Frankfurt):** Bullshit involves indifference to truth. The SCEDI speaker *cares deeply* about the literal truth of the atomic propositions – they are essential to their defense – but is indifferent (or hostile) to the truth of the *inferences* the system predictably generates and the *accuracy of the overall contextual framework* they built.
      *   **vs. Spin/Propaganda:** Spin and propaganda are broader categories that *can* include SCEDI, but they also encompass outright lies, emotional manipulation, and non-deceptive persuasion. SCEDI is a specific *technique within* spin/propaganda characterized by its strict adherence to literal propositional truth combined with deceptive systemic contextual engineering.

  3.  **Key Characteristics Defining SCEDI:**
      *   **Literal Truth Preservation:** All individual utterances are veridical.
      *   **Contextual Engineering as Mechanism:** Deception is achieved via the *designed structure* of the communication (sequence, framing metaphors, selective emphasis on connections, omission of expected explanations).
      *   **Distributed Deceptive Force:** The misleading effect is an emergent property of the *system* of truths interacting within the engineered context; it cannot be pinned on any single element.
      *   **Predictable Inference:** The speaker intends and reasonably foresees the specific false belief arising in the target audience.
      *   **Disavowal Strategy:** When challenged, the speaker explicitly denies deception by appealing *only* to the literal truth of atomic propositions, refusing to engage with the responsibility for the engineered context and its inferential consequences.
      *   **Exploitation of Reasonableness:** It leverages what a reasonable listener, operating under normal conversational expectations (e.g., relevance, completeness of explanation within frame), would infer from the *presented system*.

  4.  **Existing Concepts That Come Close (But Don't Quite Fit):**
      *   **Paltering:** Often used for "truthful but misleading" statements, but typically focuses on single statements or omissions, not *systemic engineering*.
      *   **Contextual Manipulation:** Too broad; encompasses many things not involving deception or systemic engineering.
      *   **Inferential Exploitation:** Captures the mechanism of misleading via expected inference but lacks emphasis on the *systemic, engineered context* and the *disavowal* aspect.
      *   **Lying by Omission (Expanded View):** Some argue certain omissions within a frame can constitute lying. However, SCEDI involves omissions *of connections/explanations within a designed system*, not just a single missing fact, and crucially, the defense relies on the literal truths stated. Its systemic nature distinguishes it.
      *   **Insincere Assertion (via Misleading Implicature):** Focuses on the speaker's intent regarding the implicature of *an utterance*. SCEDI involves the intent regarding the inferential outcome of an *entirely constructed discursive system*.

  **Conclusion:**

  The phenomenon you describe, **Systemic Contextual Engineering for Deceptive Inference (SCEDI)**, is a distinct and pernicious form of deception. It weaponizes literal truth by embedding it within a carefully designed, misleading contextual architecture, generating predictable false beliefs. Its uniqueness lies in the *distributed, systemic nature* of the deception across the engineered framework, the *strict preservation of atomic propositional truth*, and the *strategic disavowal* based solely on that atomic truth. While drawing on mechanisms like implicature and omission, SCEDI is defined by the holistic, engineered *system* created from truths to mislead, and the speaker's subsequent retreat into literalism. It represents a sophisticated evasion of responsibility for the deceptive environment intentionally constructed. This conceptualization provides the precise carving you requested.
