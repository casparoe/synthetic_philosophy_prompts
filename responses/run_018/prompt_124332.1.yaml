answer: |-
  **Verdict: Caving to Pascal's Mugger is structurally irrational because it surrenders your decision-making to epistemic noise.**

  Here's the core argument, stripped bare:

  Pascal's Mugging exploits a fatal flaw in unbounded Expected Value (EV) maximization. When EV scales infinitely with arbitrarily tiny shifts in credence against *any* epistemic background noise, your decision rule loses all discriminatory power. It ceases to function as a tool for navigating reality.

  Imagine your mind constantly generates low-probability hypotheses ("Aliens offer 10^100 utils if I blink twice," "This pebble grants immortality if kicked"). Under pure EV maximization with unbounded utility promises, *any* such random flicker of thought—no matter how unsupported, incoherent, or absurd—demands extreme action *if* its imagined payoff is large enough to offset its minuscule credence. The mugger isn't special; they're just the loudest noise in a storm.

  By updating your credence and acting on the mugger's promise, you aren't making a reasoned probabilistic judgment. You're demonstrating that your decision rule is *structurally vulnerable* to being "pumped" by *any* proposition that strategically couples vanishing credence with astronomical promises. It renders you perpetually actionable on pure fantasy, indistinguishable from a system maximally sensitive to random mental static.

  **Therefore:** Rejecting the update isn't (just) about low priors. It's a necessary structural defense. You must impose epistemic filters *before* EV calculation kicks in—demanding minimal coherence, explanatory power, or grounding—to prevent your entire decision architecture from collapsing into a state where every passing whim with a big enough imaginary number attached can command your wallet. Caving proves the rule is broken, not that the offer was credible.
