answer: |-
  ### Step 1: Conceptual Distinctions Recap  
  - **Phenomenal Consciousness (PC)**: Subjective experience ("what it is like" to be in a state). *Necessary marker*: First-person qualitative character.  
  - **Access Consciousness (AC)**: Global availability of information for cognitive operations (report, reasoning, action). *Necessary marker*: Functional integration across systems.  
  - **Local Sensory Processing**: Modular, encapsulated neural computations (e.g., V1 edge detection). *No global availability*; can drive behavior reflexively.  
  - **Global Broadcasting**: Dynamic ignition of information into a "workspace" for system-wide access. *Core mechanism for AC* in Baars/Dehaene frameworks.  

  ### Step 2: Tension in Your Verdicts  
  Your cases reveal a contradiction:  
  - **Case 2**: Global broadcasting → PC (without report).  
  - **Case 3**: Global broadcasting → AC but *not* PC (lacking self-model).  
  - **Case 4**: No global broadcasting → PC (via local recurrence).  
  *Conflict*: Global broadcasting is sufficient for PC in Case 2 but neither necessary (Case 4) nor sufficient (Case 3) elsewhere.  

  ### Step 3: Coherent Unifying Principle  
  **Principle**:  
  > *Phenomenal consciousness (PC) arises iff information undergoes recurrent processing integrated with a dynamic self-model. Access consciousness (AC) arises iff information is globally broadcast for system-wide computation.*  

  #### Necessary and Sufficient Conditions:  
  | **State**                  | **Necessary & Sufficient Conditions**                     |  
  |----------------------------|----------------------------------------------------------|  
  | **Phenomenal (PC)**        | Recurrent processing + Integration with self-model       |  
  | **Access (AC)**            | Global broadcasting to executive systems                 |  

  #### Clause Motivation by Case:  
  - **Case 1 (Blindsight)**: No PC/AC → *Local processing lacks recurrence & broadcasting*.  
  - **Case 2 (Anesthesia)**: PC present → *Global broadcasting includes self-model recurrence* (intraoperative ignition → integrated state).  
  - **Case 3 (Fragmented Workspace)**: AC without PC → *Broadcasting exists, but self-model exclusion breaks integration*.  
  - **Case 4 (Dreaming)**: PC without AC → *Local recurrence + self-model integration* (dream narrative coherence as minimal self-model).  
  - **Case 5 (Subliminal)**: No PC/AC → *No recurrence, no broadcasting*.  

  ### Step 4: Resolving Tension  
  - **Case 2 vs. Case 3**: Global broadcasting alone ≠ PC; *integration with self-model* is decisive. Case 2 implicitly assumes self-model inclusion.  
  - **Case 4 vs. Case 2/3**: Local recurrence *can* sustain PC if integrated with a self-model (e.g., dreams as self-coherent states). Global broadcasting remains necessary for AC.  
  - **Overturned Verdict**: None. Your judgments align under this principle.  

  ### Step 5: Prediction for New Scenario  
  **Scenario**: *Intact self-model integration but partial/degraded broadcasting.*  
  - **PC Prediction**: **Present** (if recurrence + self-model persist).  
    - *Example*: Aphantasia with emotional imagery—vivid "feel" of scenes without visual broadcast.  
  - **AC Prediction**: **Absent** (incomplete broadcasting precludes system-wide access).  
    - *Example*: Unable to describe or act on the experience despite its phenomenal intensity.  

  ### Conclusion  
  Your verdicts hold under the principle that **phenomenality hinges on self-model-integrated recurrence**, while **access requires broadcasting**. The tension dissolves by decoupling PC from global broadcasting (demoting it to a correlate of AC) and anchoring PC in the *integrative depth* of processing. This preserves neuroscientific plausibility (e.g., recurrent loops in PC) while accommodating edge cases like dreams and fragmented architectures.
