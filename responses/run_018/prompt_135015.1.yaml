prompt: |-
  I am a graduate student in philosophy of mind who recently spent several months observing a close family member in a minimally conscious state following a severe neurological injury, and I have found myself returning repeatedly to the conceptual distinction between phenomenal consciousness and access consciousness as articulated in global workspace theory. I need you to act as a professional philosopher of mind with deep familiarity in cognitive architecture and consciousness studies, particularly the frameworks associated with Bernard Baars and Stanislas Dehaene. Before you answer, please take a moment to brainstorm carefully: distinguish precisely between phenomenal consciousness, access consciousness, local sensory processing, and global broadcasting, and consider how selective disruptions to each component might yield conceptually distinct combinations that do not map neatly onto one another.

  Here are my own verdicts on five constructed cases, and I want to know whether there is a coherent principle behind them. Case 1: A subject with a localized visual cortex deficit can navigate obstacles and discriminate colors in forced-choice tests within the affected visual field, yet sincerely and consistently reports seeing nothing at all in that region. My verdict is that there is neither phenomenal consciousness nor access consciousness here—only local, unconscious sensory-motor processing that never reaches any global stage. Case 2: During a surgical procedure, a patient receives an anesthetic that suppresses behavioral response and post-operative recall, but intraoperative neural monitoring reveals sustained, widespread fronto-parietal activation patterns closely matching the global ignition signatures typically associated with conscious auditory processing. My verdict is that phenomenal consciousness was present despite the absence of report, because the information achieved genuine global broadcasting that included self-monitoring systems, even if memory encoding was blocked. Case 3: Consider a hypothetical cognitive architecture—what I will call a fragmented workspace system—in which sensory information is successfully broadcast to every cognitive module except a dedicated autobiographical self-model module; the system behaves adaptively, solves problems using the broadcast data, and displays all neural markers of global availability except those tied to first-person integration. My verdict is that this system possesses full access consciousness, since the information is globally available for reasoning and action, but it entirely lacks phenomenal consciousness, because phenomenal experience requires integration with that self-model. Case 4: During a specific sleep stage characterized by intense local recurrent processing in early sensory cortices but near-complete absence of long-range fronto-parietal broadcasting, a sleeper upon waking reports rich, continuous visual experiences. My verdict is that phenomenal consciousness was present throughout, sustained by local recurrence alone without any need for global workspace broadcasting. Case 5: A subject is exposed to a subliminal emotional face that triggers a measurable autonomic reaction and fleeting subcortical response, but produces no behavioral adaptation, no verbal report, and no working-memory integration. My verdict is that this involves pure subcortical processing, with neither phenomenal nor access consciousness present.

  These judgments feel mostly correct, yet they generate a clear tension: in Case 2 I treat global broadcasting as sufficient for phenomenal consciousness even without report; in Case 3 I treat global broadcasting as insufficient when the self-model is excluded; and in Case 4 I treat phenomenal consciousness as possible with no global broadcasting whatsoever. Please think step by step and determine whether a single principle can capture all five verdicts, or whether I must abandon one. State the principle precisely, specifying the necessary and sufficient conditions for phenomenal consciousness and for access consciousness according to your best reconstruction; identify which clause is motivated by which case; predict the principle’s implication for a further scenario I have not listed, specifically a system with intact self-model integration but only partial, degraded broadcasting across modules; and be explicit about which of my original verdicts the principle forces me to overturn. Do not provide bibliographic recommendations, reading lists, or citation requests—only the conceptual analysis itself.
