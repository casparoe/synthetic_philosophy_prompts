  ### Structured Simulation: Polymer Classification Game  
  **Objective:** Simulate a technical scenario where a hidden sharp boundary exists (chain length ≥200 for "eligible") but is obscured by measurement noise, leading to apparent fuzziness. Students experience epistemic uncertainty (ignorance of a precise rule) and coordination failure, setting up a debrief on epistemicism vs. supervaluationism.  

  ---

  ### **Materials**  
  1. **Polymer Cards**: 30 cards, each with:  
     - Unique ID (e.g., P-1 to P-30)  
     - Hidden "true chain length" (pre-assigned integers 150–250; clustered near 200).  
     - *Distribution*:  
       - 150–179: 5 cards (clearly ineligible)  
       - 180–199: 10 cards (borderline ineligible)  
       - 200–219: 10 cards (borderline eligible)  
       - 220–250: 5 cards (clearly eligible)  
     *(Example: P-1:150, P-2:180, P-3:198, P-4:200, P-5:202, P-6:250)*  

  2. **Role Badges**: For 12 students:  
     - **Classifiers (6)**: Wear blue badges.  
     - **Observers (3)**: Wear yellow badges.  
     - **Engineers (3)**: Wear red badges.  

  3. **Voting Tools**:  
     - Classifiers: "Yes/No" voting cards.  
     - Observers: "Sharp/Indeterminate" diagnosis sheets.  
     - Engineers: "Coordination Failure" tally sheets.  

  4. **Noise Generator App/Device**: Adds ±5–10 units of "measurement error" to true lengths (e.g., true length 200 → displayed as 195–205).  

  ---

  ### **Rules & Incentives**  
  #### **Phase 1: Classification Rounds (45 min; 15 rounds, 3 min each)**  
  1. **Setup**:  
     - Shuffle polymer cards.  
     - Each round, reveal one card’s ID (e.g., "P-3").  

  2. **Classifier Actions**:  
     - Receive **noisy chain length** (true length ± random error).  
     - Vote "Yes" (eligible) or "No" (ineligible) based on the noisy reading.  
     - **Scoring**:  
       - 1 pt if vote matches *hidden rule* (≥200 = eligible).  
       - 0 pts otherwise.  

  3. **Observer Actions**:  
     - Record vote distribution (e.g., "4 Yes, 2 No").  
     - Track disagreements in the "borderline region" (180–219).  

  4. **Engineer Actions**:  
     - Identify "coordination failure" in borderline region:  
       - Vote is **not unanimous** (e.g., 5-1, 3-3).  
     - **Scoring**:  
       - 1 pt per coordination failure.  

  5. **Round End**:  
     - Reveal *true eligibility* (e.g., "P-3:198 → ineligible").  
     - **Do NOT reveal true length or hidden rule**.  

  #### **Phase 2: Final Diagnoses (5 min)**  
  - **Observers**: Submit "Sharp" (unknown boundary) or "Indeterminate" (genuine fuzziness) diagnosis.  
    - **Scoring**: 5 pts if correct ("Sharp" is correct answer).  
  - **Engineers**: Finalize coordination failure count.  

  #### **Phase 3: Scoring (5 min)**  
  - Classifiers: Total correct votes.  
  - Observers: 5 pts for correct diagnosis.  
  - Engineers: 1 pt per coordination failure.  

  ---

  ### **Timeline (90 min)**  
  | **Time**  | **Activity**                              | **Details**                                                                 |  
  |-----------|-------------------------------------------|----------------------------------------------------------------------------|  
  | 0–10 min  | **Introduction**                          | Explain roles, rules, and scoring. Emphasize: "Chemists see fuzziness; hidden rule exists." |  
  | 10–55 min | **Game Rounds**                           | 15 rounds (3 min each). Facilitator: Reveal ID, distribute noisy lengths, tally votes, announce true eligibility. |  
  | 55–60 min | **Final Diagnoses & Tally**               | Observers submit diagnosis; engineers finalize failure count.              |  
  | 60–75 min | **Group Discussion**                      | Prompt: "Why did coordination fail? Was the boundary knowable?"            |  
  | 75–90 min | **Debrief**                               | Map game phases to philosophy (see below).                                |  

  ---

  ### **Debrief: Mapping Game to Philosophy**  
  1. **Hidden Rule (≥200)**: Represents the **epistemicist’s sharp boundary**.  
     - *Ignorance*: Classifiers had noisy data, not access to the rule.  
     - *Vote splitting*: Caused by measurement limits (epistemic), not semantic indeterminacy.  

  2. **Coordination Failure**: Mirrors **borderline contradictions**.  
     - Engineers’ points required non-unanimity → Simulates real-world breakdowns when a "precise cutoff exists but is unknown."  
     - Contrast with supervaluationism: Here, no "admissible precisifications"—only one correct answer exists.  

  3. **Observer Diagnosis**: Highlights **misattribution of ignorance**.  
     - Voting inconsistencies *felt like* indeterminacy but stemmed from hidden facts.  

  4. **Critical Limitation**:  
     - The game **assumes** a hidden sharp boundary exists. Epistemicism claims this *must* be true for all vague predicates (e.g., "heap," "bald"). The activity cannot prove this metaphysical claim—only show how ignorance mimics fuzziness.  

  ---

  ### **Predictions & Pitfalls**  
  - **Likely Confusion**: Students may conflate "noisy feedback" (epistemic) with "genuine indeterminacy" (semantic). Clarify in debrief: Noise = imperfect data; indeterminacy = no fact of the matter.  
  - **Role Imbalance**: Engineers/Observers may dominate discussion (their roles are meta-analytic). Mitigate by polling Classifiers first: "What frustrated you?"  
  - **First-Run Issues**:  
    - Classifiers may "overfit" early rounds (e.g., assume 198 is always ineligible) and resist updating.  
    - Observers may prematurely declare "indeterminacy" if borderline votes split persistently.  
    - Engineers might overcount failures if borderline votes accidentally align.  

  ---

  ### **Facilitator Notes**  
  - **Noise Matters**: Use consistent error ranges (±5–10) to ensure borderline uncertainty.  
  - **Honest Limitation**: The activity cannot reproduce epistemicism’s core metaphysical claim—that vague predicates *must* have sharp boundaries. Verbally stress: "This is a leap beyond the simulation."  
  - **No Prep Needed**: All chemistry is simulated; no prior knowledge required.
