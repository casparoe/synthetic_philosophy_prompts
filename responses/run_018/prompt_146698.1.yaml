prompt: |-
  hey im putting together a final exam for my grad seminar on rationality and indexical reasoning (90 min, 40 marks). i need you to write one essay prompt that compares SSA and SIA, but i dont want the usual sleeping-beauty or god-rolling-dice setups — every student has seen thier lecture slides on those. instead, build the question around this scenario:

  a philosopher — call her the presumptuous one — tries to estimate the total number of observer-moments in the multiverse. she notices she is one particular observer-moment, and she treats this like drawing a red ball from an urn: she updates the prior over multiverse sizes downward, because large multiverses contain more observer-moments and she only exists as one. she concludes smaller multiverses are more probable.

  the exam question should ask students to:
  1. identify whether her reasoning tracks SSA or SIA, and why the other assumption rejects her inference.
  2. explain the presumptuous-philosopher objection — specifically which assumption it targets and why being presumptuous undermines cosmological reasoning.
  3. evaluate whether her argument actually commits the presumption, or whether theres a hidden asymmetry between observer-moments and physical samples (like the urn) that saves her.

  then provide a model answer and a marking scheme. the scheme should break marks down explicitly: maybe 8 for correct identification and conditioning logic, 8 for the objection explained right, 8 for the evaluation of asymmetry, 6 for clarity and precision. also list the specific mistakes that should cost marks — e.g. treating SSA and SIA as just different priors, confusing observer-relative conditioning with ordinary statistical sampling, or claiming SSA ignores her existence.

  make it hard enough that memorizing the labels SSA and SIA isnt enough; they have to actually apply the conditioning logic to this multiverse-urn case.
reasoning: |-
  We are designing an essay prompt for a graduate seminar exam on rationality and indexical reasoning. The scenario involves a philosopher (the "presumptuous one") who uses her own existence as an observer-moment to update her prior over the size of the multiverse (number of observer-moments). She reasons that since she is one particular observer-moment, she should update in favor of smaller multiverses because in a larger multiverse she would be less likely to be "this specific one".

  The exam question should ask students to:
  1. Identify whether her reasoning tracks SSA or SIA and why the other assumption rejects her inference.
  2. Explain the presumptuous-philosopher objection: which assumption it targets and why being presumptuous undermines cosmological reasoning.
  3. Evaluate whether her argument actually commits the presumption, or whether there's a hidden asymmetry between observer-moments and physical samples (like the urn) that saves her.

  We also need to provide a model answer and a marking scheme.

  ### Step-by-step construction of the prompt and model answer:

  #### The Prompt:
  **Prompt:**
  In the context of anthropic reasoning in cosmology, consider the following scenario:

  A philosopher (the "presumptuous one") attempts to estimate the total number of observer-moments in the multiverse. She reasons that her own existence as a specific observer-moment is analogous to drawing a red ball from an urn. She updates her prior probability distribution over possible multiverse sizes downward for larger multiverses, arguing that in a larger multiverse (with more observer-moments) she would be less likely to be this particular one. Therefore, she concludes that smaller multiverses are more probable.

  In an essay, address the following:

  1. **Identification and Conditioning Logic (approx. 8 marks):**  
     Does the philosopher's reasoning align with the Self-Sampling Assumption (SSA) or the Self-Indication Assumption (SIA)? Explain why. Then, show how the other assumption (the one not used by the philosopher) would reject her inference and what update it would support instead.

  2. **The Presumptuous-Philosopher Objection (approx. 8 marks):**  
     Explain the presumptuous-philosopher objection: which anthropic assumption (SSA or SIA) does this scenario target? Why does the objection claim that being "presumptuous" undermines cosmological reasoning? Be specific about the problem with using one's own specific identity as evidence.

  3. **Evaluation of Asymmetry (approx. 8 marks):**  
     Evaluate whether the philosopher's argument actually commits the presumption as per the objection, or whether there is a hidden asymmetry between the urn model (with physical samples) and the multiverse (with observer-moments) that might save her reasoning. Discuss potential differences in the nature of the sampling process that could justify her update.

  Your essay should be clear, precise, and demonstrate a deep understanding of the underlying principles of anthropic reasoning. Avoid relying solely on memorized definitions; instead, apply the conditioning logic to this specific scenario.

  ---

  #### Model Answer:

  **Model Answer:**

  1. **Identification and Conditioning Logic:**  
     The philosopher's reasoning aligns with the **Self-Sampling Assumption (SSA)**. SSA states that one should reason as if one is a random sample from the set of all actually existing observer-moments in the world. In this case, the philosopher treats herself as a random sample from the set of all observer-moments in the multiverse. She conditions on being a specific observer-moment (say, "Alice at time t"). She then updates the prior probability of a multiverse size \( N \) (where \( N \) is the total number of observer-moments) by the likelihood of being this particular observer-moment given \( N \). Since in a multiverse of size \( N \), the probability of being this specific one is \( 1/N \), she uses \( P(\text{being Alice-t} | N) \propto 1/N \). Thus, she updates her prior \( P(N) \) to a posterior \( P(N | \text{being Alice-t}) \propto P(N) \cdot (1/N) \), which favors smaller \( N \).

     The **Self-Indication Assumption (SIA)** would reject this inference. SIA states that one should condition not only on being an observer but also on the fact that one exists at all. It introduces an a priori bias in favor of worlds with more observers. Formally, SIA says that the probability of a world is proportional to the prior probability of that world multiplied by the number of observers in it. So, under SIA, the likelihood of observing what we observe (which includes our own existence) given \( N \) is proportional to \( N \) (because there are \( N \) chances for us to exist). Therefore, the update would be: \( P(N | \text{data}) \propto P(N) \cdot N \). This would counter the \( 1/N \) effect and, in fact, might lead to an update in favor of larger \( N \). Specifically, in the philosopher's case, SIA would not condition on being a specific observer-moment but rather on the fact that she exists as some observer-moment. Thus, SIA would reject the step of conditioning on being "Alice-t" as overly specific and would instead use a likelihood that is proportional to \( N \), leading to a posterior that does not penalize large \( N \) in the same way.

  2. **The Presumptuous-Philosopher Objection:**  
     The presumptuous-philosopher objection targets **SSA**. The objection argues that SSA leads to an unacceptable form of "presumptuousness" in cosmological reasoning because it allows one to draw strong conclusions about the size of the universe (or multiverse) from the mere fact of being a specific observer. The problem is that under SSA, one can rule out large universes even without any direct evidence against them, solely because in a large universe one would be "less likely to be me". This is seen as presumptuous because it seems to give our specific identity more evidential weight than it should have. Why should the fact that I am precisely this observer-moment (and not another) be evidentially relevant for cosmology? The objection claims that this undermines cosmological reasoning because it leads to overly strong and counterintuitive results. For instance, if the multiverse is very large, we would still exist as some observer-moment, so why should we be surprised at being this specific one? The objection holds that our existence as an observer is evidence, but our specific identity is not.

  3. **Evaluation of Asymmetry:**  
     The philosopher's argument does commit the presumption as per the objection. However, one might argue that there is a hidden asymmetry between the urn model and the multiverse that could save her reasoning. In the urn model, when we draw a ball and condition on it being a specific one (e.g., ball number 7), we are conditioning on a physical label that we have arbitrarily assigned. In contrast, in the multiverse, the "specificity" of an observer-moment might be inherent and not arbitrary. But this asymmetry is not clearly justifiable. The heart of the issue is that in the multiverse, each observer-moment is unique, but that uniqueness is not evidentially relevant for the size of the multiverse. The objection correctly points out that we should condition on the fact that we are some observer-moment, not this specific one. 

     However, one potential defense of the philosopher is that if she has a pre-theoretic way of individuating observer-moments that is not dependent on the multiverse size, then conditioning on being this specific one might be legitimate. But this is controversial. The standard view in anthropic reasoning is that we should condition on the existence of an observer with our exact experiences (which are fixed) and not on an arbitrary label. Since the experiences of the philosopher are the same regardless of the multiverse size (assuming she exists in both), the specific identity (being "Alice-t") might be seen as an arbitrary label. Therefore, the presumption objection holds: we should not condition on being this specific one because that is ad hoc and leads to absurdly strong conclusions. Hence, the asymmetry argument fails to save her reasoning.

     In conclusion, the philosopher's argument does commit the presumption because it conditions on an overly specific indexical fact (being this exact observer-moment) that is not evidentially relevant. The urn analogy breaks down because the labeling of balls is arbitrary and introduced by us, whereas in the multiverse, the distinctness of observer-moments is fundamental but should not affect the update on the multiverse size.

  ---

  #### Marking Scheme:

  **Total Marks: 40 (for the entire exam, but this essay is worth 30 marks? Wait, the problem says 40 marks for the whole exam and then we are to create one essay prompt. However, the breakdown was given as 8+8+8+6=30. But the problem says 40 marks for the exam. Clarification: the exam is 90 minutes and 40 marks total. We are only writing one essay prompt. So let's assume this essay is worth 30 marks? Actually, the problem says: "90 min, 40 marks" and then asks for one essay prompt. Since it's one of the questions, it might be worth 30 marks? But the problem says "break marks down explicitly: maybe 8 for ... 8 for ... 8 for ... 6 for clarity and precision". So 8+8+8+6=30. Then the exam has other questions? We are only responsible for this one. So we'll design the essay to be worth 30 marks.**

  **Marking Scheme for the Essay (30 marks total):**

  **1. Identification and Conditioning Logic (8 marks):**
     - Correctly identifies the reasoning as SSA (2 marks).
     - Explains SSA: random sample from all actual observer-moments (2 marks).
     - Shows the update: posterior proportional to prior times 1/N (2 marks).
     - Explains SIA's rejection: conditions on existence, likelihood proportional to N, so update favors larger N (2 marks).

     **Common mistakes and deductions:**
     - Treating SSA and SIA as just different priors (deduct 2 marks).
     - Confusing the conditioning: saying SSA conditions on existence (it doesn't, it conditions on being a random observer-moment) (deduct 2 marks).
     - Failing to show the update under SSA and SIA mathematically or intuitively (deduct 2 marks each).
     - Claiming SSA ignores her existence (it doesn't, it conditions on being a random observer) (deduct 2 marks).

  **2. The Presumptuous-Philosopher Objection (8 marks):**
     - Correctly identifies that the objection targets SSA (2 marks).
     - Explains the core of the objection: conditioning on being a specific observer-moment is presumptuous and leads to ruling out large multiverses without evidence (3 marks).
     - Explains why it undermines cosmological reasoning: it gives too much weight to indexical information and yields counterintuitive results (3 marks).

     **Common mistakes and deductions:**
     - Misidentifying the target as SIA (deduct 4 marks).
     - Not explaining why being "presumptuous" is problematic (deduct 3 marks).
     - Confusing this with the doomsday argument or other anthropic scenarios (deduct 2 marks).

  **3. Evaluation of Asymmetry (8 marks):**
     - States that the philosopher's argument does commit the presumption (2 marks).
     - Discusses the asymmetry: urn labels are arbitrary, multiverse observer-moments are inherently distinct (3 marks).
     - Evaluates that the asymmetry does not save her because the specific identity is not evidentially relevant (3 marks).

     **Common mistakes and deductions:**
     - Claiming the asymmetry saves her without good argument (deduct 4 marks).
     - Failing to discuss the nature of the sampling process (deduct 3 marks).
     - Not taking a clear position on whether the presumption is committed (deduct 2 marks).

  **4. Clarity and Precision (6 marks):**
     - Overall structure and coherence of the essay (2 marks).
     - Precision in terminology (SSA, SIA, conditioning, likelihood, etc.) (2 marks).
     - Conciseness and avoidance of irrelevant material (2 marks).

  **Total: 8+8+8+6 = 30 marks.**

  Note: The entire exam is 40 marks, so this essay is a major part. The other 10 marks might be for other questions not designed here.

  This question is designed to be challenging because students must apply the conditioning logic to a novel scenario and not just regurgitate standard examples.
answer: |-
  ### Essay Prompt

  **Presumptuous Philosopher Scenario:**  
  A philosopher ("the presumptuous one") aims to estimate the total number of observer-moments in the multiverse. She reasons that her existence as a *specific* observer-moment (e.g., "Alice at time *t*") is analogous to drawing a single red ball from an urn: she updates her prior probability distribution over possible multiverse sizes downward for larger sizes. Her rationale is that in a larger multiverse (with more observer-moments), she would be less likely to be *this particular one*. She concludes that smaller multiverses are more probable.  

  **Your Task:**  
  In a structured essay, address the following:  
  1. **Identification & Conditioning Logic:**  
     Does her reasoning align with the Self-Sampling Assumption (SSA) or the Self-Indication Assumption (SIA)? Justify your answer. Then, explain how the *other* assumption rejects her inference and what update it would support instead.  
     
  2. **The Presumptuous-Philosopher Objection:**  
     Explain the "presumptuous-philosopher" objection: Which anthropic assumption (SSA or SIA) does this scenario target? Why does the objection argue that her "presumptuousness" undermines cosmological reasoning? Be specific about the flaw in treating her specific identity as evidence.  

  3. **Evaluation of Asymmetry:**  
     Evaluate whether her argument commits the presumption as per the objection. Is there a hidden asymmetry between physical sampling (e.g., urns) and observer-moments that could *save* her reasoning? Discuss whether the urn analogy validly supports her update.  

  Focus on applying anthropic conditioning logic rigorously to this scenario. Avoid generic definitions; use the urn analogy and multiverse context explicitly.  

  ---

  ### Model Answer  
  **1. Identification & Conditioning Logic**  
  The philosopher’s reasoning aligns with the **Self-Sampling Assumption (SSA)**. SSA dictates that one should condition on being a random observer-moment from the set of *all actually existing* observer-moments. Here, she treats her specific identity ("Alice at *t*") as a random sample from the multiverse’s observer-moments. She updates the prior probability of a multiverse size \(N\) (total observer-moments) using the likelihood \(P(\text{being Alice-}t \mid N) = 1/N\). This implies:  
  \[
  P_{\text{post}}(N) \propto P_{\text{prior}}(N) \times \frac{1}{N}.
  \]  
  Since \(1/N\) penalizes larger \(N\), she infers smaller multiverses are more probable.  

  The **Self-Indication Assumption (SIA)** rejects this inference. SIA states that one should condition on *existing as an observer* at all, implying a prior bias toward worlds with more observers. Formally, \(P(\text{data} \mid N) \propto N \times P_{\text{prior}}(N)\), where "data" is minimally "an observer exists." Under SIA, her specific identity is irrelevant; she should only condition on there being *some* observer-moment matching her experiences. The update becomes:  
  \[
  P_{\text{post}}(N) \propto P_{\text{prior}}(N) \times N.
  \]  
  This *counters* her downward shift—larger \(N\) gains higher probability—rendering her "specific identity" update invalid. SIA thus accuses her of overconditioning.  

  **2. The Presumptuous-Philosopher Objection**  
  This objection targets **SSA**. It argues that SSA enables "presumptuousness" by allowing strong cosmological conclusions from indexical self-location alone. The flaw lies in treating *being a specific observer-moment* (e.g., "Alice-*t*") as evidence for updating on \(N\). Crucially:  
  - **Why it targets SSA:** SSA’s conditioning on specific identity implies that large multiverses are improbable because "being me" is unlikely in a vast ensemble. This ignores that in *any* multiverse where she exists, she *must* be *some* specific observer-moment—a tautology without evidential weight.  
  - **Undermining cosmology:** The objection claims this is "presumptuous" because it rules out large, empirically possible multiverses using arbitrary indexical facts. For example, if \(N\) could be \(10^{10}\) or \(10^{20}\), SSA absurdly favors \(10^{10}\) even if prior evidence is neutral, violating scientific conservatism. Her "urn analogy" fails because cosmologists lack access to the "urn’s" composition; treating self-location as a physical sample presumes knowledge of sampling mechanics absent in multiverse physics.  

  **3. Evaluation of Asymmetry**  
  Her argument **commits the presumption**, and no defensible asymmetry saves it.  
  - **Commitment to presumption:** She presumes her specific identity ("Alice-*t*") is evidentially equivalent to a physical sample (e.g., a numbered ball). But physical samples (e.g., urn balls) have externally verified labels, while observer-moments derive identity from intrinsic properties (e.g., subjective experiences). Conditioning on "being Alice-*t*" adds no information beyond "an observer with Alice-*t*’s experiences exists," which is indexically invariant. Thus, her update conflates necessary self-location with informative sampling—a core SSA error.  
  - **Asymmetry evaluation:** The urn analogy does not hold. In urns:  
    - Balls have fixed, observer-independent labels (e.g., "ball 7").  
    - Drawing "ball 7" *is* informative because labels are extrinsic and pre-defined.  
    In multiverses:  
    - Observer-moment "labels" (e.g., "Alice-*t*") are observer-relative and inextricable from existence.  
    - "Being Alice-*t*" cannot be disentangled from "existing as an observer with these experiences," which SIA already accounts for.  
    Thus, the asymmetry *exacerbates* her error: physical sampling uses objective frequencies, while self-location is a necessary byproduct of existence. Her update double-counts the fact of existence—first by assuming she exists, second by privileging her specific identity—making it incoherent.  

  **Conclusion:** The philosopher’s reasoning is invalid SSA. No asymmetry saves it; the urn analogy misrepresents observer-moments as externally labeled samples when they are perspectival entities. SIA avoids presumption by conditioning only on existence.  

  ---  

  ### Marking Scheme (Total: 30 marks)  
  **1. Identification & Conditioning Logic** (8 marks)  
  - **SSA alignment (3 marks):** Correctly identifies SSA and justifies using likelihood \(1/N\) based on random sampling from actual observer-moments.  
  - **SIA rejection (3 marks):** Explains SIA’s alternative update (\(P \propto N \times P_{\text{prior}}\)) and why it ignores specific identity.  
  - **Mathematical/logical precision (2 marks):** Explicit likelihoods/postriors for both SSA and SIA.  
    *Deduct 2–4 marks for:* Confusing SSA/SIA conditioning; treating them as priors; claiming SSA "ignores existence"; omitting likelihood formulas.  

  **2. Presumptuous-Philosopher Objection** (8 marks)  
  - **Targets SSA (2 marks):** Names SSA as the objection’s target.  
  - **Flaw in specific identity (4 marks):** Explains why conditioning on *specific* observer-moment is tautological/uninformative and how this leads to overconfidence.  
  - **Cosmological harm (2 marks):** Links to undermining scientific reasoning (e.g., ruling out large *N* without evidence).  
    *Deduct 3–5 marks for:* Misassigning target to SIA; vague appeals to "bias"; not tying presumption to indexicality; confusing with Doomsday/Sleeping Beauty.  

  **3. Evaluation of Asymmetry** (8 marks)  
  - **Commits presumption (3 marks):** Clear verdict that her argument is presumptuous.  
  - **Asymmetry analysis (4 marks):** Contrasts physical (urn) vs. observer-moment "labels"; explains why asymmetry *fails* to save her (e.g., no objective labels in multiverse).  
  - **Urn analogy critique (1 mark):** Explicitly rejects urn validity for observer-moments.  
    *Deduct 3–5 marks for:* Claiming asymmetry saves her without rationale; ignoring the necessity of self-location; equating urn/multiverse sampling mechanics.  

  **Clarity & Precision** (6 marks)  
  - **Structure (2 marks):** Logical flow addressing all three parts.  
  - **Terminology (2 marks):** Correct use of SSA, SIA, conditioning, likelihood, indexical.  
  - **Conciseness (2 marks):** No tangents; focused on scenario.  
    *Deduct 1–2 marks per issue:* Ambiguity; irrelevant content; repeated errors.  

  **Total: 30 marks**  
  *Note: Full credit requires scenario-specific reasoning. Generic summaries of SSA/SIA without urn/multiverse application score poorly.*
