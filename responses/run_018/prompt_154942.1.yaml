  2. **Rules and Payoff Scheme**: The board earns points when aggregate supply equals demand (equilibrium) in a round; each producer earns points for units produced plus a secret bonus only if their hidden constraint was satisfied during production (e.g., avoiding a material they are sensitive to), but they cannot state the constraint aloud.  
  3. **Running Instructions**: Conduct two rounds: in each, the board sets prices, then producers choose production levels given prices and their constraint; the board observes aggregate imbalances and adjusts prices for the next round to clear the market, achieving apparent equilibrium in round two while some producers fail to get their bonus due to unmet constraints.  
  4. **Debrief**: After round two, reveal hidden constraints and show silent misallocations; map the board's price adjustments to Lange's simulated market and the constraint failures to Hayek's argument about dispersed, inarticulate local knowledge, highlighting that equilibrium masked underlying misfits.  
  5. **Honest Limitation**: State that the simulation's hidden constraints, being pre-defined and card-based, fail to capture the non-codifiable, bodily character of real tacit knowledge (which the possessor may not consciously know or be able to articulate without losing adaptive context); the facilitator must explain this gap verbally.
