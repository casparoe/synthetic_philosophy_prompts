answer: |-
  Here’s a prioritised agenda for your group, focusing on impact, tractability, and practical relevance to quantum information (QI), with explicit criteria:

  ### **Ranked Priorities:**
  1. **Symmetry/Structural Priority**  
     **Core Question:** *Can branch weights be derived *solely* from unitary quantum mechanics + structural symmetries (e.g., envariance, Gleason-like theorems), without decision theory or self-locating uncertainty?*  
     - **Why Upstream?**  
       If successful, this would render decision-theoretic and self-locating arguments *redundant*. It addresses the root issue: whether probability is *intrinsic* to the quantum state.  
     - **Tractability for Philosophers:**  
       Focuses on conceptual analysis of symmetry, identity, and ontology. Requires minimal technical QM (unitarity, tensor structure) but deep philosophical rigor.  
     - **Practical Impact on QI:**  
       Success would ground Born rule probabilities *objectively*, making MWI a natural foundation for QI (e.g., certifying randomness via Born probabilities without classical baggage). Failure implies MWI cannot underpin QI without epistemic add-ons.  

  2. **Self-Locating Uncertainty (SLU) vs. Objective Weight**  
     **Core Question:** *Is "branch weight" a physical fact (like mass) or a measure of ignorance? Does resolving SLU *require* the Born rule, or vice versa?*  
     - **Why Second?**  
       SLU arguments (e.g., Sebens-Carroll) *presuppose* that branches have weights. If Priority #1 fails, this becomes critical: it tests whether probability can emerge from indexical uncertainty *alone*.  
     - **Tractability:**  
       Philosophers excel at modal metaphysics and indexical reasoning. Requires analyzing agent-relative knowledge in branching universes.  
     - **Practical Impact:**  
       Clarifies if "quantum randomness" in MWI is observer-dependent (problematic for device-independent QI protocols).  

  3. **Decision-Theoretic Derivations (Deutsch-Wallace)**  
     **Core Question:** *Can rational agents in MWI *deduce* the Born rule purely from non-probabilistic axioms?*  
     - **Why Last?**  
       Even if successful, it *assumes* branch weight ontology (addressed in #1) and may reduce to instrumentalism. It’s downstream of metaphysics.  
     - **Tractability:**  
       Highly interdisciplinary (decision theory, game theory). Philosophers can critique axioms (e.g., "rationality" in multiverses) but need math collaborators.  
     - **Practical Impact:**  
       **Deprioritise here.** Solving this wouldn’t change QI practice: if agents *act as if* Born rule is true, randomness certification works *regardless* of its metaphysical basis.  

  ---

  ### **Defense of Ordering**  
  - **Dependency:**  
    Symmetry (#1) → SLU/Branch Ontology (#2) → Decision Theory (#3).  
    If #1 succeeds, #2 and #3 become secondary. If #1 fails, #2 becomes essential. #3 is always derivative: it shows *how* to use weights, not *why they exist*.  

  - **Tractability for Philosophers:**  
    #1 leverages core philosophical skills (conceptual analysis of symmetry/ontology). #2 uses tools from philosophy of language/mind (indexicals). #3 requires niche decision theory.  

  - **Impact Beyond Metaphysics:**  
    - **#1:** Directly determines if MWI provides *physical* probabilities for QI.  
    - **#2:** Affects whether "randomness" is observer-dependent (crucial for cryptographic trust).  
    - **#3:** Only justifies *behavior*; irrelevant to whether a quantum computer *actually* samples Born-rule distributions.  

  ---

  ### **Actionable Agenda**  
  **Focus 80% on #1:** Attack envariance/Gleason-style approaches:  
  - *Is quantum entanglement sufficient to define "branch counting" via symmetries?*  
  - *Can decoherence-derived structures replace probabilistic axioms?*  

  **Explore #2 as backup:** If #1 stalls, probe SLU:  
  - *Can Elga/Vaidman-style arguments avoid presupposing weights?*  
  - *Does "caring measure" (Greaves-Myrvold) reduce to circularity?*  

  **Minimize #3:** Relegate decision theory to "damage control" if #1–#2 fail.  

  **Ultimate Goal:** Resolve whether branch weights are *ontic* (prioritize) or *epistemic* (deprioritize for QI). This cuts to whether MWI can ground quantum information without borrowing classical probability.
