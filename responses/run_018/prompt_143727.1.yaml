prompt: |-
  I'm a policy analyst for our county welfare office and lately I've been writing rules for automated eligibility checks. After a weird argument at a dinner party about whether bad law is still law, I need a practical checklist based on the Hart-Fuller debate that my team can actually run on a draft rule. Turn Fuller's eight principles of legality into concrete tests for an automated system—like what counts as promulgation when the rule is buried in code, or retro-activity when a model gets updated with past data. Then add Hart's rule of recognition as a seperate gate: does the system have authority regardless of morality? Build it as an ordered procedure with clear stop points—where we reject for failing inner morality, where we flag valid but unjust and kick it to the board, and where the two frameworks flat-out conflict. Apply it to two proposals: a retro-active risk-score update that changes past eligibility, and a technically published but human-unreadable algorithmic rule. I'm not asking for citations, just something I can use in tomorrow's review, and please excuse the typo—I always write promulgagation by mistake.
reasoning: |-
  We are going to build a checklist based on the Hart-Fuller debate, specifically:
   - Lon Fuller's 8 principles of legality (inner morality of law) as concrete tests for automated rules.
   - H.L.A. Hart's rule of recognition as a separate gate to check the rule's validity based on the system's authority.

   The checklist will be an ordered procedure with stop points:
    1. If any of Fuller's principles are violated, we reject the rule for failing inner morality (unless it's a conflict with Hart, then we have a special case).
    2. If the rule passes Fuller's tests but fails Hart's rule of recognition (i.e., it lacks authority), we reject.
    3. If the rule has authority (passes Hart) but violates Fuller's principles in a way that doesn't lead to rejection (maybe we have a conflict), we flag as valid but unjust and kick it to the board.
    4. If the rule passes both, we accept.

   However, note: Fuller's principles are about the rule being a law at all. If it fails one of the eight, it's not a law. Hart would say that even if it's a bad law, if it comes from a valid source (rule of recognition) then it's still law.

   We are going to design the procedure as follows:

   Step 1: Apply Fuller's 8 principles (converted to tests for automated systems). If the rule fails any, it is rejected for failing inner morality (unless we have a conflict with step 2, then we note and go to step 2).

   Step 2: Apply Hart's rule of recognition: check if the rule was created by the authorized body (in the county, by the authorized process). If it fails, reject. If it passes, then:
     - If it passed all of Fuller's principles, accept.
     - If it failed any of Fuller's principles, then we have a conflict: the rule is legally valid (by Hart) but morally deficient (by Fuller). We flag as valid but unjust and kick it to the board.

   However, note that the above might be too simplistic because Fuller's principles are about the rule being a law at all. But in practice, we are in a system that follows Hart's positivism. So we might do:

   Step 1: Check Hart's rule of recognition (is it a rule from the authorized source?). If not, reject.

   Step 2: Then check Fuller's principles. If any are violated, then we flag as valid (because it passed step 1) but unjust (because of Fuller) and kick to the board. If all Fuller principles are passed, then we accept.

   But wait: Fuller would say if it fails one of the 8, it's not law. But in our system, if it comes from the authorized source (step 1 passed) then by Hart it is law. So we have a conflict? 

   We are going to structure the procedure to reflect the dual tests:

   Procedure:

    1. **Check Hart's Rule of Recognition** (Authority Check):
        - Question: Was the rule created by the authorized body (the county welfare office) following the established procedure for rule-making? (e.g., approved by the board, published in the official register, etc.)
        - If No: **Reject** (not a valid rule at all).
        - If Yes: proceed to step 2.

    2. **Check Fuller's 8 Principles** (Inner Morality Check). For each principle, we have a concrete test for an automated rule:

        Principle 1: **Generality** (Rules should be general, not ad hoc)
          - Test: Does the rule apply generally to a class of cases, or is it targeting a specific individual or case? 
            - Automated System Check: Look for hardcoded exceptions for specific individuals (by name, ID, etc.) without a general criteria. 
            - Stop Point: If it fails (i.e., it is ad hoc), then **Flag as Valid (by Hart) but Unjust (by Fuller) and kick to board**.

        Principle 2: **Promulgation** (Rules must be published and accessible)
          - Test: Is the rule (and any changes) published in a way that is reasonably accessible to those affected? 
            - Automated System Context: If the rule is buried in code without a human-readable summary or documentation, or if the code is not available to the affected parties (or their representatives) in a form they can understand, then it fails.
            - Stop Point: Fail -> **Flag as Valid but Unjust and kick to board**.

        Principle 3: **Non-retroactivity** (Rules should not be retroactive)
          - Test: Does the rule apply retroactively? Specifically, does it change the legal consequences of past actions or events?
            - Automated System Context: If the rule uses updated data or models to re-evaluate past eligibility and change past decisions (e.g., recalculating benefits for a period that has already been paid), then it is retroactive.
            - Stop Point: Fail -> **Flag as Valid but Unjust and kick to board**.

        Principle 4: **Clarity** (Rules must be understandable)
          - Test: Is the rule written clearly enough so that a reasonable person (or a trained professional) can understand what is required?
            - Automated System Context: If the rule is implemented as a complex algorithm (e.g., machine learning model) without a clear explanation of the factors and weights, or if the code is so obfuscated that even a programmer cannot easily explain the rule, then it fails.
            - Stop Point: Fail -> **Flag as Valid but Unjust and kick to board**.

        Principle 5: **Non-contradiction** (Rules must not contradict other rules)
          - Test: Does the rule conflict with any other existing rule in the system?
            - Automated System Context: Run a consistency check with existing rules. If there is a contradiction (e.g., two rules giving opposite outcomes for the same case), then it fails.
            - Stop Point: Fail -> **Flag as Valid but Unjust and kick to board**.

        Principle 6: **Possibility of Compliance** (Rules must not require the impossible)
          - Test: Is it possible for the affected party to comply with the rule?
            - Automated System Context: Does the rule require data that is not available to the individual? Or set a condition that no one can meet? (e.g., requiring a document that doesn't exist, or setting a deadline that has already passed at the time of notification)
            - Stop Point: Fail -> **Flag as Valid but Unjust and kick to board**.

        Principle 7: **Constancy** (Rules must remain relatively stable over time, not changing too frequently)
          - Test: Is the rule being changed too frequently such that it becomes difficult to follow?
            - Automated System Context: Check the version history. If the rule (or the model) is updated more frequently than is reasonable for the affected parties to keep up with (e.g., daily changes without notice), then it fails.
            - Stop Point: Fail -> **Flag as Valid but Unjust and kick to board**.

        Principle 8: **Congruence** (Rules must be administered as announced; no gap between the rule as announced and as applied)
          - Test: Is the rule implemented in the system exactly as published? 
            - Automated System Context: Check if the code (or model) actually does what the published rule says. If there's a bug or a deviation, then it fails.
            - Stop Point: Fail -> **Flag as Valid but Unjust and kick to board**.

        If the rule passes all 8 principles: **Accept**.

    3. **Summary of Outcomes**:
        - Rejected at Hart step: Not a valid rule.
        - Passed Hart but failed one or more Fuller principles: Valid but unjust (flag and kick to board).
        - Passed Hart and all Fuller principles: Accept.

    However, note that Fuller's principles are about the rule being a law. But in our procedure, we are using Hart's rule of recognition as the validity gate. Then we use Fuller to assess the inner morality. So even if Fuller would say it's not law, we are saying it is valid by Hart but we flag it for being unjust.

    Now, we apply this procedure to two proposals:

    **Proposal 1: A retro-active risk-score update that changes past eligibility**

      - Step 1 (Hart): We assume it was created by the authorized body and procedure (so passes Hart).
      - Step 2 (Fuller):
          - Principle 3 (Non-retroactivity): It is retroactive because it changes past eligibility. **Fail**.
          - Also, Principle 8 (Congruence): If the rule as published did not state that it would be applied retroactively, then the implementation (retroactive application) is not as announced. **Fail**.
          - Therefore, we flag as valid (because it passed Hart) but unjust (due to retroactivity and possibly congruence) and kick to the board.

    **Proposal 2: A technically published but human-unreadable algorithmic rule**

      - Step 1 (Hart): Published? Technically published (e.g., the code is in a public repository) but not in a human-readable form. If the county's procedure requires publication in a manner that is accessible to the public (e.g., in the county register, in plain language), then it might fail Hart. But let's assume it was published in the required official register (so passes Hart) but the actual rule is only in code and very complex.

      - Step 2 (Fuller):
          - Principle 2 (Promulgation): If the publication is not accessible (because it's in code and not understandable by the affected public), then it fails promulgation. **Fail**.
          - Principle 4 (Clarity): It is not understandable. **Fail**.
          - Therefore, we flag as valid (by Hart) but unjust (by Fuller) and kick to the board.

    But note: if the county's rule-making procedure requires that rules be published in the official register in human-readable form, and this rule was only published as code, then it might fail Hart's rule of recognition (because it wasn't promulgated as per the county's own rules). So:

      - For Proposal 2: 
          - Step 1 (Hart): Check the county's rule-making procedure. If it requires human-readable publication and this was not done, then **Reject** at step 1.
          - If the county's procedure allows publication of code without explanation, then it passes Hart, but fails Fuller's principles 2 and 4 -> kick to board.

    Therefore, the procedure:

    Step 1: Hart's Rule of Recognition (Authority Check)
        - Input: The rule and the context of its creation.
        - Check: 
            1. Was the rule created by the authorized body (e.g., the county welfare office, the board, etc.)?
            2. Was the rule created following the established procedure? (e.g., public notice and comment, approval by the board, publication in the official county register in the required format)
        - If no to either: **Reject** (not valid).
        - If yes: proceed to Step 2.

    Step 2: Fuller's 8 Principles (Inner Morality Check) - each principle is a test. If any fail, then mark the rule as **Flag for Board** (valid but unjust). If all pass, **Accept**.

    Now we write the checklist in an ordered procedure with clear stop points.
answer: |-
  ### Hart-Fuller Automated Rule Checklist  
  **Ordered Procedure for Draft Rules**  
  *(Apply sequentially; stop at first rejection/flag point)*  

  ---

  #### **STEP 1: FULLER’S INNER MORALITY CHECK**  
  *Fail any = **Reject for "Illegality"**. Pass all → Proceed to Step 2.*  
  1. **Generality Test**  
     - *Concrete Check:* Does the rule apply to a defined class (e.g., "all SNAP applicants")?  
     - *Automated Red Flag:* Hard-coded exceptions for specific individuals/cases.  

  2. **Promulgation Test**  
     - *Concrete Check:* Is the rule published in a human-readable format accessible to affected parties?  
     - *Automated Context:* If buried in code/API, provide a plain-language summary in the public rule registry.  

  3. **Non-Retroactivity Test**  
     - *Concrete Check:* Does the rule alter eligibility for periods *before* its effective date?  
     - *Automated Context:* Model updates using past data must not change prior determinations (e.g., no backdated risk-score adjustments).  

  4. **Clarity Test**  
     - *Concrete Check:* Can a caseworker explain the rule’s logic in <5 mins?  
     - *Automated Red Flag:* Black-box algorithms without decision transparency (e.g., unexplained ML weights).  

  5. **Non-Contradiction Test**  
     - *Concrete Check:* Does the rule conflict with existing statutes or higher-priority rules?  
     - *Automated Context:* Run conflict scans against the rule database.  

  6. **Compliance Feasibility Test**  
     - *Concrete Check:* Can users reasonably comply (e.g., provide required data)?  
     - *Automated Red Flag:* Requires real-time data not feasibly obtainable (e.g., daily bank balances).  

  7. **Constancy Test**  
     - *Concrete Check:* Are changes infrequent (<1x/month) and announced >30 days in advance?  
     - *Automated Context:* Model retraining schedules must not trigger unannounced eligibility shifts.  

  8. **Congruence Test**  
     - *Concrete Check:* Does the system’s output match the published rule?  
     - *Automated Red Flag:* Code drifts from documented logic (e.g., bug changing income thresholds).  

  ---

  #### **STEP 2: HART’S RULE OF RECOGNITION CHECK**  
  *Fail = **Reject for "Invalid Authority"**. Pass but Fuller failed → **Flag for Board Review**.*  
  - **Authority Test**:  
    - *Concrete Check:* Was the rule created under:  
      (a) County enabling statutes, AND  
      (b) Officially recorded (e.g., county clerk entry + timestamp)?  
    - *Pass Condition:* Valid even if morally unjust (e.g., harsh but legally authorized limits).  
    - *Outcome:*  
      - Pass + Fuller passed → **Approve**.  
      - Pass + Fuller failed → **Flag as "Valid but Unjust" → Escalate to Board**.  

  ---

  ### **APPLICATION TO PROPOSALS**  
  #### **Proposal 1: Retroactive Risk-Score Update**  
  - *Fuller Check:*  
    - ✗ **Fails Non-Retroactivity** (alters past eligibility).  
    - ✗ **Fails Constancy** (unannounced change).  
    → **Reject at Step 1.**  
  - *Hart Check:* Not reached.  

  #### **Proposal 2: Human-Unreadable Algorithmic Rule**  
  - *Fuller Check:*  
    - ✗ **Fails Promulgation** (buried in code, no summary).  
    - ✗ **Fails Clarity** (caseworkers can’t explain logic).  
    → **Reject at Step 1.**  
  - *Hart Check:*  
    - *If* authority exists (e.g., board authorized algorithmic rules):  
      → **Flag as "Valid but Unjust" → Escalate to Board** for moral review.  
    - *If* no authority (e.g., no statute allowing opaque algorithms):  
      → **Reject at Step 2.**  

  ---

  ### **CONFLICT RESOLUTION FLOWCHART**  
  ```mermaid
  graph TD
    A[Start] --> B[Fuller's 8 Tests]
    B -->|Fail Any| C[Reject for Illegality]
    B -->|Pass All| D[Hart's Authority Test]
    D -->|Fail| E[Reject for Invalid Authority]
    D -->|Pass| F{Fuller Passed?}
    F -->|Yes| G[APPROVE]
    F -->|No| H[Flag: 'Valid but Unjust' → Board Review]
  ```

  ### **KEY DECISION POINTS**  
  - **Stop at Step 1** if Fuller fails (rule is "not law" due to inner immorality).  
  - **Escalate to Board** if Hart validates an unjust rule (e.g., legally authorized but opaque/retroactive).  
  - **Fuller-Hart Conflict**: Occurs when a rule has legal authority (Hart) but violates inner morality (Fuller). Resolution requires board intervention.  

  ---  
  **Use this in tomorrow’s review**—designed for swift team execution. Adjust thresholds (e.g., constancy frequency) per county policy.
