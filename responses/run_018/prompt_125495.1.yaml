  Then there's quantum mechanics - Einstein opposed its indeterminacy ("God doesn't play dice"), seeing it as incomplete. But the student claims Einstein embraced it as enabling free will? That's factually inverted. Einstein fought against quantum randomness precisely to preserve determinism. 

