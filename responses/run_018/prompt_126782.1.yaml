prompt: |-
  I am putting together a training protocol for senior review analysts at an independent advisory board that evaluates public-facing arguments in science policy. A recurring problem is that stakeholders submit position papers that turn on a single vivid thought experiment—especially in bioethics and philosophy of mind—and my team needs to distinguish cases where the experiment genuinely clarifies a concept from cases where it merely smuggles in conclusions by suppressing context, exploiting unstated analogies, or trading on hidden normative commitments. I want you to design a reusable audit procedure that an analyst can run in roughly twenty minutes without consulting external literature. The procedure should translate what philosophy actually knows about how intuition pumps work—including their reliance on framing effects, selective detail suppression, and the elision of boundary conditions—into an ordered sequence of tests applied directly to the text of the argument. For each step, specify what feature of the argument counts as passing or failing, where the audit must stop and defer to an explicit value judgment rather than yielding a mechanical result, and what kind of misfire is likely at that stage. The deliverable should be a practical checklist or flowchart in words, not an abstract taxonomy.

  Please apply the audit to three specific cases, one of which should be a scenario I am injecting into the module to test its limits: (1) a regulatory proposal for autonomous vehicles that invokes the trolley problem to justify a particular algorithmic harm-minimization rule; (2) a gradual-replacement-of-neurons-with-silicon scenario used to argue that consciousness is not essentially biological; and (3) a constructed case in which a society decides to preserve every instance of pain experienced by non-human animals in an eternal digital archive in order to honor suffering, and this is used to claim that moral status requires the capacity for retrospective narrative integration. In your applications, include at least one case where the procedure returns a verdict that runs against the intuitive plausibility of the argument, and clearly flag the kinds of misleading pumps—such as those operating through emotional salience or culturally specific narrative templates—that the procedure is structurally unable to catch. Finally, state explicitly what judgments the procedure can never eliminate, no matter how refined the checklist becomes.
reasoning: |-
  We are designing a reusable audit procedure for thought experiments (intuition pumps) in position papers. The procedure should take ~20 minutes and not require external literature. It should translate philosophical knowledge about intuition pumps (framing effects, selective detail suppression, elision of boundary conditions) into a sequence of tests.

  The audit procedure will be a checklist with the following steps:

  1. **Identify the Core Intuition Pump**: 
     - What is the thought experiment? Extract it clearly.
     - Pass: The core scenario is clearly described and isolated from the rest of the argument.
     - Fail: The scenario is vague or intertwined with other arguments. Stop: If not identifiable, the argument is too diffuse to audit with this method.

  2. **Check for Explicitly Stated Purpose**:
     - Does the argument state what the pump is meant to demonstrate?
     - Pass: Explicit statement of the intended conclusion or concept to be clarified.
     - Fail: No clear statement. Stop: If the purpose is not stated, the analyst must note that the pump's intended role is ambiguous.

  3. **Test for Stipulative Definitions and Suppressed Context**:
     - Look for terms that are defined in a way that biases the outcome, or for missing contextual factors that would alter the intuition.
     - Pass: The thought experiment uses terms that are either standard or defined neutrally, and includes relevant context (or explicitly notes that context is being abstracted for the sake of argument).
     - Fail: Key terms are loaded, or context is suppressed without acknowledgment. Stop: If the suppression is acknowledged, proceed but note the limitation.

  4. **Examine Analogical Mapping** (if the pump relies on an analogy):
     - If the thought experiment is an analogy, check the relevant similarities and dissimilarities.
     - Pass: The analogy maps relevant features appropriately and notes disanalogies that might be critical.
     - Fail: The analogy ignores critical disanalogies. Stop: If the analogy is central and the mapping is flawed, the pump fails.

  5. **Boundary Condition Check**:
     - Does the experiment push to extremes without acknowledging that real-world conditions are different?
     - Pass: The pump acknowledges boundary conditions and limits of the scenario.
     - Fail: The pump ignores boundary conditions and presents the scenario as if it were representative.

  6. **Normative Commitment Scan**:
     - Does the thought experiment implicitly rely on a normative stance (e.g., about what is good, fair, or natural) without stating it?
     - Pass: The pump is value-neutral or explicitly states normative commitments.
     - Fail: The pump smuggles in a normative commitment without acknowledgment. Stop: If a hidden normative commitment is detected, the analyst must note that the conclusion depends on an unargued value.

  7. **Framing Effect Assessment**:
     - Is the scenario described in a way that triggers emotional or cognitive biases (e.g., loss aversion, disgust)?
     - Pass: The framing is neutral and avoids known cognitive biases.
     - Fail: The framing is emotionally charged or designed to trigger bias. Note: This step cannot be mechanically resolved; it requires the analyst to note the potential bias and that it might be manipulating the intuition.

  8. **Sensitivity Analysis**:
     - Ask: Would minor changes in the scenario alter the intuition? (e.g., changing the number of people, the nature of the harm, the identity of the actors)
     - Pass: The intuition holds across reasonable variations of the scenario.
     - Fail: The intuition is highly sensitive to arbitrary details. This indicates the pump might be exploiting incidental features.

  After these steps, the analyst must decide whether the thought experiment is doing genuine conceptual work or is misleading.

  **What the procedure cannot catch**:
  - Intuition pumps that rely on deeply culturally specific narratives that the analyst shares and thus cannot see.
  - Pumps that exploit emotional salience in a way that is universal and thus hard to discount (e.g., vivid descriptions of suffering).
  - The procedure cannot eliminate the need for judgment about the relevance of the thought experiment to the real-world issue at hand.

  Now, we apply the procedure to three cases.

  ---

  **Case 1: Trolley problem in autonomous vehicle regulation**

  *Argument*: A regulatory proposal for autonomous vehicles uses the trolley problem to justify a harm-minimization rule that in unavoidable accident scenarios, the vehicle should choose the action that results in the fewest total deaths.

  **Audit**:

  1. **Core Pump**: The trolley problem: a runaway trolley will kill five people unless you divert it to a side track where it will kill one. The pump is clear.
  2. **Purpose**: Explicitly stated: to justify a harm-minimization rule (save more lives).
  3. **Stipulative Definitions/Suppressed Context**: 
     - Suppressed context: Real accidents involve uncertainty about outcomes, multiple stakeholders, and varying risk profiles (e.g., age, health). Also, the trolley problem assumes a binary choice with certain outcomes, which is unrealistic.
     - Fail: Context suppressed without acknowledgment. Stop? Not necessarily; note the suppression and proceed with caution.
  4. **Analogical Mapping**: The analogy is between the trolley scenario and an AV accident. Disanalogies: AVs have sensors and predictive models that might reduce uncertainty, and the AV is an agent making a decision in a split second vs. a human in the trolley. The argument does not address these. Fail.
  5. **Boundary Conditions**: The trolley problem is a boundary case (extreme and rare). The argument uses it as if it were representative. Fail.
  6. **Normative Commitment**: The rule assumes that minimizing total deaths is the only relevant moral factor. This is a hidden commitment (e.g., ignores distributional justice, responsibility, or rights). Fail.
  7. **Framing Effect**: The trolley problem is emotionally charged (life/death) but presented neutrally. However, the framing of "saving more lives" is positive, which might bias toward the rule. Pass with caution.
  8. **Sensitivity Analysis**: Change the scenario: what if the one person on the side track is a child and the five are elderly? Or if the one is a doctor? Intuitions might change, suggesting the rule is not robust.

  **Verdict**: The thought experiment fails because of suppressed context, disanalogies, boundary condition neglect, and hidden normative commitments. It is misleading in the context of AV regulation.

  ---

  **Case 2: Gradual neuron replacement (Silicon replacement scenario)**

  *Argument*: A scenario in which a person's neurons are gradually replaced with functionally identical silicon chips. After full replacement, the person behaves the same and claims to be conscious. Therefore, consciousness is not essentially biological.

  **Audit**:

  1. **Core Pump**: Clear: gradual replacement of neurons with silicon, leading to a non-biological brain with preserved behavior and subjective reports.
  2. **Purpose**: Explicit: to show that consciousness does not require biological substrate.
  3. **Stipulative Definitions/Suppressed Context**: 
     - Key term: "functionally identical" – but is functional identity sufficient for consciousness? This is the crux of the debate. The argument assumes it is. Also, suppressed context: we don't know if silicon can support consciousness. 
     - Pass? The definition is stated, but the assumption is not defended. Note: This is a known philosophical dispute (e.g., hard problem of consciousness). We proceed but note the suppression.
  4. **Analogical Mapping**: Not an analogy per se, but a hypothetical transformation. The mapping is from biological to silicon, preserving function. The disanalogy might be that we don't know if silicon can support qualia. The argument ignores this. Fail? Or note: the pump assumes functionalism, which is controversial.
  5. **Boundary Conditions**: This is a boundary case (extreme technological scenario). The argument uses it to make a general claim about consciousness. But it acknowledges the boundary? Not explicitly. Fail.
  6. **Normative Commitment**: No obvious normative commitment; it's about metaphysics. Pass.
  7. **Framing Effect**: The scenario is described in a neutral, technical way. Pass.
  8. **Sensitivity Analysis**: Change the scenario: replace the brain all at once? Or replace with a different material? The intuition might hold. But if we replace with a material that is functionally identical but we know it doesn't support consciousness (if we had such evidence), then the intuition might break. However, we don't have such evidence. Pass.

  **Verdict**: The pump passes most tests except for the suppression of the key assumption (that functional identity preserves consciousness) and the boundary condition issue. However, in philosophy of mind, this pump is a standard argument for functionalism. The procedure flags that the key assumption is not defended, which is a weakness, but the pump is not clearly misleading. It does clarify the concept of functionalism. But note: the procedure returns a mixed result, and the analyst must note the suppressed assumption.

  ---

  **Case 3: Eternal digital archive of animal suffering**

  *Argument*: A society creates an eternal digital archive of every instance of pain experienced by non-human animals to honor suffering. The argument claims that because we wouldn't consider this archive to have moral status (it's just data), moral status requires the capacity for retrospective narrative integration (which animals lack).

  **Audit**:

  1. **Core Pump**: Clear: a digital archive of animal pain experiences, preserved for eternity to honor suffering.
  2. **Purpose**: Explicit: to show that moral status requires retrospective narrative integration.
  3. **Stipulative Definitions/Suppressed Context**: 
     - Key suppressed context: the archive is not a sentient being, it's a record. The argument assumes that moral status applies only to entities that can experience in the moment and have narrative integration. But the archive is not an entity that can suffer. 
     - Fail: The context is suppressed because the archive is not an appropriate target for moral status in the first place. The pump is comparing apples and oranges.
  4. **Analogical Mapping**: The archive is presented as an analog to an animal's life of suffering. But disanalogies: the archive doesn't experience anything; it's a representation. The animal experiences pain. The argument ignores this disanalogy. Fail.
  5. **Boundary Conditions**: The scenario is extreme (eternal archive) and not representative of real moral situations. The argument does not acknowledge this. Fail.
  6. **Normative Commitment**: The argument assumes that "honoring suffering" is a valid reason for creating the archive, and that we would agree it doesn't have moral status. But the normative commitment is that moral status requires narrative capacity. This is hidden? Not entirely, because it's the conclusion. However, the intuition about the archive is being used to support it. Pass? Or note: the intuition about the archive might rely on a hidden commitment about what entities are morally considerable.
  7. **Framing Effect**: The idea of "honoring suffering" is emotionally positive, but the scenario of eternal preservation of pain might evoke discomfort. The argument uses the positive framing to make the archive seem noble, then points out that we wouldn't grant it moral status. This might bias the intuition. Fail: the emotional framing might be manipulating the intuition.
  8. **Sensitivity Analysis**: Change the scenario: what if the archive was a sentient AI that re-experienced the pain? Then we might grant it moral status. This change breaks the intuition. Also, what if instead of an archive, it was a single animal's lifetime of pain preserved in a way that the animal continues to exist in pain? Then we might consider it morally relevant. The intuition is sensitive to the non-sentience of the archive.

  **Verdict**: The thought experiment fails because of suppressed context (the archive is not sentient), disanalogy, boundary condition neglect, and framing effects. The procedure returns a verdict against the argument's intuitive plausibility (which might initially seem clever). The pump is misleading.

  ---

  **Kinds of misleading pumps the procedure is structurally unable to catch**:
  - Pumps that rely on emotional salience: e.g., a vivid description of suffering that triggers a strong aversion, which then biases the judgment. The procedure can note the framing but cannot neutralize the emotional effect.
  - Culturally specific narrative templates: e.g., a pump that invokes a "slippery slope" using a culturally familiar story of decline (like the Fall of Rome) might be persuasive to some but not others. The procedure might miss the cultural specificity if the analyst shares the culture.

  **Judgments the procedure can never eliminate**:
  - The relevance of the thought experiment to the actual policy issue.
  - The weight of the intuition: even if the pump is clean, how much should it count?
  - The validity of the underlying philosophical assumptions (e.g., functionalism in the neuron replacement case).
answer: |-
  Below is a reusable 20-minute audit procedure for evaluating thought experiments ("intuition pumps") in position papers, presented as a practical checklist. The procedure draws on philosophical insights about how intuition pumps exploit framing effects, selective detail suppression, and boundary condition elision. Each step includes:  
  - **Test**: What the analyst examines.  
  - **Pass/Fail Criteria**: Clear conditions for proceeding.  
  - **Stop & Defer Points**: Where the audit must halt for human judgment.  
  - **Failure Modes**: Common errors or biases likely at that stage.  

  ---

  ### **Intuition Pump Audit Checklist**  
  *Run this sequence on the thought experiment **in isolation** from the broader argument. Time: ≤20 mins.*  

  1. **Isolate the Core Scenario**  
     - *Test:* Extract the thought experiment’s setup and conclusion. Strip away rhetoric, data, or citations.  
     - *Pass:* Scenario is self-contained, with explicit inputs (e.g., "a trolley heading toward five people") and outputs (e.g., "diverting it kills one").  
     - *Fail:* Scenario is entangled with real-world examples or depends on external evidence.  
     - *Stop & Defer:* If the pump relies on implicit cultural narratives (e.g., "progress" or "sacrifice").  
     - *Likely Misfire:* Mistaking an anecdote for a pump.  

  2. **Identify the Intended Clarification**  
     - *Test:* Locate where the author states what the pump *should* clarify (e.g., "this shows consciousness is substrate-independent").  
     - *Pass:* Clarification goal is explicit and limited (e.g., "illustrates a trade-off," not "proves a policy").  
     - *Fail:* Goal is implied, vague, or conflated with a broader agenda.  
     - *Stop & Defer:* If the goal is normative (e.g., "proves we *should* minimize harm").  
     - *Likely Misfire:* Overlooking a shift from description ("is") to prescription ("ought").  

  3. **Check for Selective Detail Suppression**  
     - *Test:* List all variables in the scenario (e.g., actors, motivations, consequences). Flag any omitted details that would change real-world judgments.  
     - *Pass:* Omissions are explicitly noted as irrelevant (e.g., "we ignore emotional attachments to focus on utilitarianism").  
     - *Fail:* Critical context is missing without justification (e.g., ignoring uncertainty in outcomes or social power dynamics).  
     - *Stop & Defer:* If omissions map to the analyst’s blind spots (e.g., assuming Western individualism).  
     - *Likely Misfire:* Rationalizing omissions post hoc.  

  4. **Test Analogical Integrity**  
     - *Test:* If the pump uses analogy (e.g., "AI drivers are like trolley operators"), identify all mapped elements. Ask: *Do differences outweigh similarities?*  
     - *Pass:* Key disanalogies are acknowledged (e.g., "unlike trolleys, AVs lack human intent").  
     - *Fail:* Critical disanalogies are unaddressed (e.g., comparing digital data to biological pain).  
     - *Stop & Defer:* If the analogy hinges on contested definitions (e.g., "honor" or "suffering").  
     - *Likely Misfire:* False equivalence (e.g., treating moral agents like objects).  

  5. **Probe Boundary Conditions**  
     - *Test:* Stress-test extreme or edge cases (e.g., "What if we scale this up 1000x?" or "What if participants are incompetent?").  
     - *Pass:* The pump’s limits are stated (e.g., "this only applies to deterministic outcomes").  
     - *Fail:* Intuition breaks under minor changes (e.g., altering numbers or actors invalidates the conclusion).  
     - *Stop & Defer:* If boundary conditions reveal normative disagreements (e.g., "rights vs. utility").  
     - *Likely Misfire:* Assuming universality for context-dependent intuitions.  

  6. **Flag Unstated Normative Commitments**  
     - *Test:* Hunt for hidden value judgments (e.g., "minimizing death is always best") using reversal tests (e.g., "Would this hold if harm targeted the vulnerable?").  
     - *Pass:* Commitments are explicit (e.g., "we prioritize aggregate welfare").  
     - *Fail:* Commitments are smuggled in (e.g., assuming "consciousness" implies moral rights).  
     - *Stop & Defer:* Always—norms require human deliberation.  
     - *Likely Misfire:* Confusing empirical claims ("silicon neurons work") with normative ones ("therefore they deserve rights").  

  7. **Assess Framing Effects**  
     - *Test:* Rewrite the pump with neutral language (e.g., replace "honor suffering" with "store suffering"). Note emotional triggers (e.g., vivid harm descriptions).  
     - *Pass:* Identical conclusions hold with neutral framing.  
     - *Fail:* Rewriting weakens or reverses the intuition.  
     - *Stop & Defer:* Always—framing effects are subjective and culturally variable.  
     - *Likely Misfire:* Missing subtle framing (e.g., heroic narratives).  

  **Final Verdict Options**  
  - **Valid Clarification**: Passes all tests; pumps isolated to the target concept.  
  - **Misleading Pump**: Fails ≥2 tests; likely exploits cognitive biases.  
  - **Inconclusive**: Requires deferred judgments; defer to ethics/policy experts.  

  ---

  ### **Application to Cases**  
  **Case 1: Trolley Problem in Autonomous Vehicle (AV) Regulation**  
  *Argument:* Uses trolley problem to justify AV algorithms minimizing total harm (e.g., sacrifice one to save five).  
  - **Step 1 (Isolate):** Pass. Clear: divert trolley → save 5/kill 1 → AVs should minimize deaths.  
  - **Step 2 (Clarification):** Pass. Explicitly "clarifies trade-offs in unavoidable harm."  
  - **Step 3 (Suppression):** Fail. Ignores real-world context (e.g., liability, uncertainty, social biases in who is "sacrificed"). Not acknowledged.  
  - **Step 4 (Analogy):** Fail. Disanalogies unaddressed—e.g., AVs lack human agency; trolley assumes perfect knowledge.  
  - **Step 5 (Boundaries):** Fail. Scaling breaks intuition (e.g., killing 1 to save 5 feels different from killing 1000 to save 5001).  
  - **Step 6 (Norms):** Stop & Defer. Hidden norm: aggregate welfare over individual rights (e.g., no discussion of consent).  
  - **Step 7 (Framing):** Stop & Defer. Framing as "harm minimization" evokes utilitarian bias; neutral reframing (e.g., "algorithmic triage") weakens appeal.  
  - **Verdict:** Misleading Pump. Fails due to suppression, disanalogy, and boundary neglect. **Runs against intuitive plausibility**—trolley feels compelling but is contextually hollow for AVs.  
  - **Uncatchable Flaw:** Exploits **emotional salience of life/death** and **culturally heroic framing** (e.g., "tough decisions").  

  **Case 2: Gradual Neuron Replacement**  
  *Argument:* Replacing neurons with silicon chips preserves consciousness, proving it isn’t essentially biological.  
  - **Step 1 (Isolate):** Pass. Clear: gradual replacement → same behavior → consciousness remains.  
  - **Step 2 (Clarification):** Pass. Explicitly "shows consciousness is substrate-independent."  
  - **Step 3 (Suppression):** Fail. Suppresses context (e.g., "functional identity" may not equal subjective experience; hard problem of consciousness). Not acknowledged.  
  - **Step 4 (Analogy):** Pass. No analogy—direct hypothetical.  
  - **Step 5 (Boundaries):** Fail. Boundary neglected: if replacement causes gradual loss of qualia, intuition reverses. No acknowledgment.  
  - **Step 6 (Norms):** Pass. No norms claimed (descriptive only).  
  - **Step 7 (Framing):** Pass. Technically neutral; no emotional loading.  
  - **Verdict:** Misleading Pump. Fails suppression and boundary tests. Clarifies functionalism but masks hard problems.  
  - **Uncatchable Flaw:** Relies on **scientistic framing** (privileging behavior over phenomenology).  

  **Case 3: Eternal Digital Archive of Animal Suffering (Constructed Limit Case)**  
  *Argument:* Archiving non-human animal pain to "honor suffering" lacks moral status, proving moral status requires narrative capacity.  
  - **Step 1 (Isolate):** Pass. Clear: archive animal pain → no moral status → moral status requires narrative.  
  - **Step 2 (Clarification):** Fail. Goal conflated—starts descriptive ("archive lacks status") but concludes normative ("requires narrative capacity").  
  - **Step 3 (Suppression):** Fail. Suppresses context: archives aren’t sentient; animals are. Not acknowledged.  
  - **Step 4 (Analogy):** Fail. False analogy: comparing data (archive) to experience (animal pain). Disanalogies ignored.  
  - **Step 5 (Boundaries):** Fail. Scaling breaks intuition (e.g., archiving human pain would feel immoral).  
  - **Step 6 (Norms):** Stop & Defer. Hidden norm: "honor" implies narrative is superior to raw experience.  
  - **Step 7 (Framing):** Stop & Defer. Framing "honor suffering" exploits **sacredness bias**; neutral reframing (e.g., "store suffering") makes the pump absurd.  
  - **Verdict:** Misleading Pump. Fails all steps except isolation. **Runs against intuitive plausibility**—initially profound but collapses under scrutiny.  
  - **Uncatchable Flaw:** Exploits **cultural narratives of memorialization** (e.g., "preserving sacrifice").  

  ---

  ### **Structural Limits of the Procedure**  
  The audit **cannot eliminate**:  
  1. **Normative Judgments**: Steps 6–7 always require human deliberation. No checklist can resolve value disputes (e.g., rights vs. utility).  
  2. **Culturally Embedded Biases**: Pumps leveraging **culturally specific narratives** (e.g., "progress" or "purity") evade capture if the analyst shares the bias.  
  3. **Affective Salience**: Pumps using **universal emotional triggers** (e.g., vivid suffering) will always feel persuasive, regardless of logical flaws.  
  4. **Conceptual Vagueness**: Ambiguous terms (e.g., "consciousness" or "honor") require external expertise—this audit isolates but doesn’t define them.  

  **Final Recommendation**: Use this audit to flag *likely* pump failures in ≤20 mins, then defer high-stakes cases (e.g., policy implications) to ethics committees with diverse perspectives to address uncapturable biases.
