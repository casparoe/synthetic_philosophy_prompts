answer: |-
  ### (1) Core Distinction
  The core divergence lies in **what de re modal claims refer to** across possible worlds. In Kripkean transworld identity, a statement like "Humphrey could have won the election" directly concerns *Humphrey himself* existing in another world with different properties. Identity is primitive: worlds overlap by sharing numerically identical individuals. Modal properties (e.g., *possibly winning*) are intrinsic to Humphrey’s cross-world existence. By contrast, Lewisian counterpart theory denies transworld identity. "Humphrey could have won" asserts that a *distinct but qualitatively similar* entity (a counterpart) in another world wins. The truthmaker is a resemblance relation (counterpart relation) between Humphrey and his qualitative duplicates in other concrete worlds. De re modality is thus grounded extrinsically in similarity, not in Humphrey’s literal transworld presence. Crucially, for Kripke, the individual *survives* across worlds; for Lewis, each world contains only its own inhabitants, and "Humphrey" in another world is a misnomer for a duplicate related by counterparthood.

  ### (2) World-Indexed vs. Cross-World Essentialism
  **World-indexed essentialism** (Lewis) anchors essential properties to the *actual world’s* object. Humphrey’s essence (e.g., originating from zygote Z) is a fact *about him in @ (actual world)*, but it doesn’t constrain his counterparts. A counterpart in W might originate differently yet still represent Humphrey’s possibility because it resembles him closely *in relevant respects*. Essential properties are world-bound labels; modality arises from how we project these labels via similarity across worlds. Objects lack inherent modal inertia—their "possibilities" are defined relationally by counterpart standards, which can vary contextually.

  **Cross-world essentialism** (Kripke) posits essential properties as *transworld constraints on identity*. If originating from Z is essential to Humphrey, then *no world* contains Humphrey unless he originates from Z there. Essential properties are invariant across worlds where he exists. This grants objects inherent modal inertia: their identity fixes necessary conditions they must satisfy *in every world they inhabit*. Worlds don’t contain duplicates—they either contain Humphrey (identical, satisfying his essence) or they don’t. This requires a primitive cross-world identity relation, independent of qualitative resemblance.

  These aren’t interchangeable: World-indexing makes essence contingent on evaluation context and counterpart relations; cross-world essentialism makes essence a rigid, identity-constituting feature immune to contextual similarity metrics.

  ### (3) Smuggling Objection and Its Limits
  The objection claims Kripkean origin essentialism implicitly relies on *qualitative conditions* akin to counterpart relations. For instance, Humphrey’s identity in W requires originating from specific gametes—a qualitative condition about his causal origin. Doesn’t this mean identity across worlds depends on satisfying qualitative criteria (resembling actual-origin), mirroring counterpart theory’s similarity-based "identity"?

  Kripkeans can resist:  
  - The qualitative origin condition isn’t *constitutive* of identity but a *consequence* of primitive identity. Identity comes first; essential properties (like origin) are discovered *a posteriori* constraints flowing from what identity requires.  
  - Crucially, the origin property isn’t a *similarity metric* but a *non-negotiable identity condition*. Counterpart theory uses similarity flexibly (e.g., weight might matter for one modal claim, not another), whereas origin is rigidly necessary for Kripke.  

  **Limits**: While this defends primitiveness, it doesn’t fully escape qualitative grounding. If *all* essential properties are qualitative (e.g., origin, material composition), identity may reduce to qualitative persistence conditions. Kripke’s appeal to "haecceities" (primitive thisness) avoids this but introduces a brute, non-qualitative identity primitive.

  ### (4) Bottom Line
  Lewis carries the heavier conceptual cost. His concrete modal realism demands radical ontology (infinite causally isolated universes), forces abandonment of intuitive transworld identity ("Humphrey" never leaves his world), and renders an object’s modal profile extrinsic and context-dependent. While Kripke requires a primitive cross-world hook for identity, it preserves the pre-theoretic intuition that *objects themselves* have inherent modal properties. Lewis’s economy in avoiding primitive identity is outweighed by his revisionism about objects and modality—counterpart theory doesn’t just analyze modal claims differently; it redefines what objects *are* in the modal landscape.
