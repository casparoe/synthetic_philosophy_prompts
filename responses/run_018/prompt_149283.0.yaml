  Next, the tension with treating rational nature as an end. The user asks why Kant cares about cruelty if animals aren't rational. The indirect duty answers this: cruelty to animals desensitizes us, making us more likely to harm humans. So it's about protecting human morality, not animal rights. Is this consistent? On the surface, yes, because the duty is to ourselves, not animals. But does it conflict? Some critics say it doesn't address the inherent wrong to the animal, but Kant would say there's no inherent wrong because animals aren't ends in themselves.

