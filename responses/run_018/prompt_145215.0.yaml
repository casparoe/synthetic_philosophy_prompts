  hey, i'm working through kierkegaards present age essay (the one about the press and leveling) and there's this part where he describes how the press conjures up the public—this enormous abstraction made of everyone and no one at the same time. he says that when people start relating through this phantom instead of face to face, you get leveling: everyone becomes equally responsible and so nobody is actually responsible for anything. there's also this bit where he calls the public the most dangerous power of all because it has no head you can cut off, no single paticular person in charge. i'm stuck on whether he's making a sociological claim that the press literally restructures authority, or if it's more psychological—about individuals internalizing anonymyty. specifically, does he think the public has real causal force, like it can actually make people act differently, or is it just describing the loss of individual accountability? and if it's causal, does that mean his critique applies to algorythmic feeds where the crowd is assembled without anyone being physically present? i keep going back and forth and want to check if i'm overreading the causal part or if kierkegaard really does think this phantom can push people around.
