  ## Collaboration Document: Everettian vs. Determinist-Skeptic Consensus  

  **Preamble:**  
  After a year of debate, we—the Everettian camp endorsing the decision-theoretic (DT) derivation of the Born rule and the determinist-skeptic (DS) camp rejecting self-locating uncertainty in branching—agree on core quantum formalism but diverge on interpretation. This document outlines shared ground and clarifies irreconcilable disagreements.  

  ---

  ### 1. Agreed Claims  

  1. **Unitary Formalism**:  
     - Quantum states evolve unitarily via the Schrödinger equation.  
     - Measurement interactions entangle systems, producing superpositions like \( \sum_i c_i |\text{outcome}_i\rangle \otimes |\text{observer}_i\rangle \).  

  2. **Measurement Problem**:  
     - Unitarity generates macroscopic superpositions absent in experience.  
     - Any solution must either modify dynamics (e.g., collapse) or explain why superpositions *appear* as single outcomes (e.g., branching).  

  3. **DT Derivation’s Scope**:  
     - **Succeeds**: Shows that *if* rational agents assign utilities to branches, they must weight them by squared amplitudes to avoid Dutch books.  
     - **Appeals to Rationality**: Relies on axioms (e.g., consistency, diachronic coherence) applied to future "selves" across branches.  
     - **Does Not Claim**: That branching *creates* uncertainty; only that rational agents in unitary QM *must act as if* probabilities apply.  

  ---

  ### 2. Disagreements Table  

  | **Crux** | **Neutral Formulation** | **DT Camp Position** | **DS Camp Position** |  
  |----------|------------------------|----------------------|----------------------|  
  | **A: Rationality Without Branch Counting** | Can decision-theoretic axioms (e.g., invariance, additivity) apply to branches without implicitly assuming a measure (e.g., branch count)? | **DT:** Rationality constraints are branch-agnostic. Axioms operate on *outcomes*, not branches. The Born rule emerges *because* amplitudes are the only invariant under unitary symmetry. No branch-counting is presupposed. | **DS:** Applying rationality to "future selves" smuggles in a measure. If branching is real/unambiguous, why not weight by branch count? Axioms *require* a prior notion of "likelihood," which amplitudes don’t provide. |  
  | **Concrete Argument:** Deutsch-Wallace thought experiment. An agent chooses between quantum games with different payoff structures. DT claims indifference between identical-amplitude branches follows purely from symmetry. DS claims symmetry arguments *already assume* amplitude-based weighting. | **DT Prediction:** Rational agents indifferent between games with identical amplitudes will *always* converge to Born-rule weights, proving no branch measure is presupposed. | **DS Prediction:** Agents will only converge if axioms *build in* amplitude as the default measure. Alter the thought experiment to obscure amplitude, and rationality alone won’t recover it. |  
  | **B: Contrived Case (10 vs. 1)** | A Hamiltonian splits the universe: Sector A has 10 physically identical agent-copies with total norm \(\sqrt{1/2}\). Sector B has 1 agent-copy with norm \(\sqrt{1/2}\). Does this challenge the Born rule? | **DT:** Born rule holds. Sector weight is \(|\text{amplitude}|^2 = 1/2\), so agents should assign 50% probability to each sector. Copy count is irrelevant: branches are defined by decoherence, not agent duplication. Prediction: Agents bet as if \(P(\text{A}) = 0.5\). | **DS:** Branches break self-locating uncertainty. An agent should reason: "I am equally likely to be any copy," so \(P(\text{being in A}) = 10/11\). Born rule fails here. Prediction: Agents bet as if \(P(\text{A}) \approx 0.91\). |  
  | **Concrete Case:** Agent pre-branching is offered $1 if they end up in Sector A. What price do they pay pre-measurement? | **DT Argument:** Amplitude determines sector weight. Copy density is emergent (e.g., from decoherence basis), not fundamental. Betting $0.50 is rational. | **DS Argument:** Without true uncertainty, post-branching agents have no ignorance. Pre-branching agent *knows* 10/11 future copies win. Betting $0.50 is irrational. |  

  ---

  ### 3. Is This Dispute Verbal?  
  - **Agreed**: The term "probability" is overloaded.  
  - **DT:** "Probability" is *constrained decision-rule* for agents facing branching. It’s epistemic but objective.  
  - **DS:** "Probability" requires *true ignorance* (which branching eliminates). DT redefines it as "rational weight," which is circular without uncertainty.  
  - **Conclusion:** Partly verbal (disagreement over "probability"), but not fully. Crux B is empirical in principle: agents’ betting behavior in the 10-vs-1 case would resolve it.  

  ---  
  **Signed,**  
  [Names from DT Camp]  
  [Names from DS Camp]  

  ---  
  **Footnotes:**  
  - This doc assumes familiarity with Deutsch/Wallace-style derivations and decoherence.  
  - Disagreements are robust but clarified. Future work: Simulate Crux B to test predictions.
