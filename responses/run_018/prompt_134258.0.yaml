  We are writing a collaboration document between two camps: 
   Camp 1: Everettians who accept the decision-theoretic derivation of the Born rule (DT camp).
   Camp 2: Determinist-skeptics who think branching worlds break self-locating uncertainty (DS camp).

   Structure:
   1. Agreed Claims (numbered list)
   2. Disagreements Table (with rows for each crux)

   Cruxes to cover:
   Crux A: Can rational-choice axioms be applied over branches without already presupposing a branch count measure?
   Crux B: What should we say about a contrived case where the Hamiltonian splits the world into ten physically identical agent-copies in one sector and one in another with equal norm-squared weight? Does that count against either view?

   Also, end with a section on whether any part of the dispute is merely verbal about 'probability' in a deterministic multiverse.

   Let's begin.

  ---

  # Collaboration Document: Resolving the Born Rule Dispute

  After a year of argument, we, the undersigned from the Everettian decision-theory camp (DT) and the determinist-skeptic camp (DS), have reached agreement on some foundational points and have clarified the cruxes of our remaining disagreements. This document records both.

  ## 1. Agreed Claims

  1. **Unitary Formalism**: Quantum mechanics, in its standard formulation without collapse, describes the evolution of the state vector of a system by a unitary operator. Given an initial state |ψ(0)⟩, the state at time t is |ψ(t)⟩ = U(t) |ψ(0)⟩.

  2. **Measurement Problem**: The measurement problem arises because unitary evolution typically leads to superpositions of macroscopic states (e.g., a pointer pointing to multiple positions) that are not observed. We agree that any solution to the measurement problem must either (a) modify the unitary dynamics (e.g., collapse theories) or (b) account for why we only experience one outcome despite the superposition (e.g., Everett's approach by interpreting the superposition as multiple branches).

  3. **Everett's Approach**: In the Everettian approach, the wave function never collapses. Instead, upon measurement, the system and observer become entangled, resulting in a superposition of distinct, non-interfering "branches" (or worlds). Each branch represents a distinct outcome.

  4. **Decision-Theoretic Derivation (DT) Goal**: The DT camp aims to derive the Born rule (that the probability of a branch is given by the squared amplitude) from the unitary formalism and rational decision-making principles, without adding probability as a primitive.

  5. **Derivation Structure**: We agree on the structure of the decision-theoretic derivation. It starts with a state in which an agent faces a branching event and must choose between different quantum games. The derivation uses rationality constraints (e.g., consistency of preferences) to show that the agent must act as if they are maximizing expected utility with respect to the Born rule.

  6. **Where Derivation Succeeds**: Both camps agree that the derivation successfully shows that, within the unitary formalism and given the rationality constraints, an agent who accepts the branching structure must assign weights to branches that are proportional to the squared amplitudes in order to be consistent. This is a non-trivial result.

  7. **Appeal to Rationality Constraints**: Both camps agree that the derivation relies on rationality constraints (e.g., the agent's preferences must satisfy certain axioms). The DS camp holds that these constraints implicitly assume a measure over branches (i.e., branch counting) at a fundamental level, while the DT camp denies this.

  ## 2. Disagreements Table

  We now present our key disagreements. Each row contains:
  - The crux in neutral language.
  - A concrete argument or case that both sides agree bears on the crux.
  - The DT camp's formulation (which they would sign off on).
  - The DS camp's formulation (which they would sign off on).

  ### Crux A: Application of Rational-Choice Axioms without Presupposing a Measure

  **Neutral Crux**: Can rational-choice axioms (like those of Savage or Deutsch-Wallace) be applied to choices over branches without already assuming a branch-counting measure? Or does the application of these axioms require a prior measure over the branches, which then must be justified independently?

  **Concrete Case/Argument**: Consider an agent in an initial state that will branch into two branches with amplitudes α and β (with |α|² + |β|² = 1). The agent must choose between two games:

     Game 1: On branch with amplitude α, the agent gets $100; on branch with amplitude β, the agent gets $0.

     Game 2: On branch with amplitude α, the agent gets $0; on branch with amplitude β, the agent gets $100.

  The DT derivation argues that rationality requires the agent to be indifferent between these two games only if |α|² = |β|². But the DS camp questions: Why should the agent care about the amplitude at all? Why not care about the number of branches? The case tests whether the rationality axioms can be applied without already having a measure.

  **DT Camp's Formulation**: 
  "The application of rational-choice axioms to branching scenarios does not presuppose any branch-counting measure. The axioms are applied to the outcomes (which are the branches) and the amplitudes enter only via the unitary structure and the requirement of consistency across different games. The derivation shows that the Born rule is the unique measure that satisfies the rationality constraints."

  **DS Camp's Formulation**: 
  "The rational-choice axioms require a prior notion of likelihood over the branches to be applicable. Without such a prior measure, the axioms cannot be meaningfully applied. The derivation implicitly assumes that the branches are to be treated as having equal weight when they have equal amplitude (which is a branch-counting intuition) and then generalizes. Therefore, it does not derive the Born rule from first principles but assumes a measure."

  ### Crux B: The Contrived Case of Ten vs. One

  **Neutral Crux**: Consider a quantum system that, after a unitary evolution, results in two sectors: Sector A has ten physically identical agent-copies, and Sector B has one physically identical agent-copy. The squared norms of the two sectors are equal (i.e., ||A||² = ||B||² = 1/2). Does this case show that the Born rule is incorrect? Or does it show that self-locating uncertainty must be applied in a way that respects the Born rule? What does this say about the role of branch count versus amplitude?

  **Concrete Case**: The Hamiltonian is set up such that the wave function evolves as:

     |ψ⟩ = √(1/2) |A⟩ ⊗ |10 copies⟩ + √(1/2) |B⟩ ⊗ |1 copy⟩.

  Each copy is physically identical and in an identical environment. The agent is about to be copied. The agent is offered a bet: if they are in Sector A, they get $1; in Sector B, they get $0. What should the agent pay to take this bet? 

  - The Born rule says the agent should pay up to $1 * (1/2) = $0.50 because the probability of being in Sector A is 1/2 (since ||A||²=1/2), regardless of the number of copies.

  - But if we count branches (or agent-copies), then there are 10 copies in A and 1 in B, so the agent should think they are 10 times more likely to be in A and pay up to $1 * (10/11) ≈ $0.91.

  **DT Camp's Formulation**: 
  "In this contrived case, the Born rule remains the correct guide for action. The agent should assign a probability of 1/2 to being in Sector A. The fact that there are ten copies in A and one in B is irrelevant because the wave function amplitude (and thus the norm) is what determines the measure. The rational agent would pay no more than $0.50. This case does not count against the DT derivation because the derivation shows that the Born rule is the unique rational way to assign probabilities. The apparent 'branch count' is not fundamental; it is the amplitude that matters."

  **DS Camp's Formulation**: 
  "This case exposes a flaw in the DT derivation. The agent, upon finding themselves in a copy, must consider self-locating uncertainty. The wave function amplitude does not directly tell the agent the probability of being in a particular sector. Instead, the agent should reason that they are equally likely to be any of the 11 copies. Therefore, they are 10/11 likely to be in Sector A. The Born rule (which assigns 1/2) would lead to a clear betting disadvantage in repeated experiments. The DT derivation fails because it does not account for self-locating uncertainty in a way that aligns with the physical duplication of observers. The amplitude alone is not sufficient."

  **Predictions in Advance**:
  - DT Prediction: They predict that if one runs a simulation of this scenario (with many trials), the fraction of total payoff the agent would receive by betting with the Born rule (paying up to $0.50) would yield the same long-run average return as if they had paid $0.50 in a non-branching game with 50% chance. The branch count is an illusion; the amplitude determines the frequency of the outcome in the multiverse.

  - DS Prediction: They predict that if one runs a simulation, the agent who bets with the Born rule (paying $0.50) would lose money because they are overpaying for the bet. In reality, the agent is in Sector A 10/11 of the time (by copy count) and so should pay up to $0.91. The amplitude does not track the actual likelihood of the agent's experience.

  ## 3. Verbal Dispute?

  Finally, we consider whether part of our disagreement is merely verbal about the word 'probability' in a deterministic multiverse.

  - **DT Camp**: The word 'probability' in the Everettian context refers to the rational degree of belief an agent should have about which branch they will find themselves in after a measurement. This is derived from the unitary formalism and decision theory. It is not a subjective choice but a constraint of rationality.

  - **DS Camp**: The word 'probability' cannot be meaningfully applied in a deterministic multiverse without introducing a measure over branches. The DT derivation claims to derive this measure but in fact assumes it. Without a physical stochastic process, there is no non-circular way to define probability. Thus, the dispute is not merely verbal; it is about whether the concept of probability is even applicable.

  However, both camps agree that if we are talking about what an agent should *do* in the face of branching, then the DT derivation provides a coherent account. The DS camp remains skeptical that this account captures the intuitive concept of probability.

