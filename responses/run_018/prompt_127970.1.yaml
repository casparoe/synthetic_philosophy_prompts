  I need to recall Darwin's core principles. From On the Origin of Species, he emphasized natural selection as the primary driver of complexity, rejected supernatural "skyhooks," and focused on gradual adaptation. His work was deeply historical—traits exist because of past selective pressures. The user mentions Dennett's crane/skyhook distinction, which is perfect here: cranes are natural, incremental mechanisms (like selection), while skyhooks are miraculous explanations. Greedy reductionism would try to explain minimal organisms purely through chemistry, ignoring evolutionary history. 

