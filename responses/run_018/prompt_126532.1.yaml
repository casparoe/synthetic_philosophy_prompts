  Principle proposal: Qualia reports are coherent iff they either (a) track functional/discriminative differences, or (b) decouple affect from sensation (Case 1/4). Case 2 gets provisional coherence because "cardboard" suggests *some* functional shift (detection? attention?) even if unmeasured. Cases 3/5 fail by being causally idle. 

  Time-flow case? Incoherent. Like the inverted painter, it adds nothing beyond the report. If pressed, the user might need to drop Case 2 or bite the bullet on 5—but their intuition that 5 is worse feels right. Dennett would call both incoherent, but the user's tug toward Sanborn might reflect folk psychology's grip on taste vs. color. 

