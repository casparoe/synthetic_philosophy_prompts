answer: |-
  Your intuitions are sharp, and the tension between Case 2 (Sanborn) and Case 5 (Inverted Painter) highlights the core dilemma of qualia. Dennett's critique targets precisely this: **the coherence of *purely private*, behaviorally/functionally undetectable changes in subjective experience ("qualia shifts").**

  Here's a principle that saves your verdicts on 1, 3, and 4, explains the problem with 5, and handles your new time-flow case, grounded in a functionalist/eliminativist stance:

  **The Coherence Principle:** A report of a change in "what it's like" (qualia) is coherent *only if* it implies, or is implied by, a detectable difference in at least one of the following:
  1.  **Discriminative Behavior:** Ability to distinguish stimuli or perform tasks.
  2.  **Affective/Motivational Response:** Preferences, aversions, desires, or emotional reactions elicited by the stimulus.
  3.  **Functional Role:** The causal role the state plays in cognitive processing (e.g., associations, memory encoding, attention capture).
  4.  **Neural Implementation:** Observable differences in brain states correlated with the experience.
  *(If the report implies *no* difference in any of these, it is incoherent or vacuous.)*

  **Applying the Principle to Your Cases:**

  1.  **Case 1 (Classic Chase):** **Coherent.** Reports a change in *affective response* (2) and potentially *preference* (2). The "tastes exactly like it used to" implies *no* change in discriminative behavior (1) or sensory quality report ("tastes like X"), fitting the principle. The change is explained functionally (critical judgment shift).
  2.  **Case 2 (Classic Sanborn):** **Coherent... *if* it implies *some* difference.** "Tastes like cardboard" strongly suggests a change in *discriminative capacity* (1) or *functional role* (3) (e.g., it might now trigger associations with cardboard, or fail to trigger associations it used to, even if discrimination tests haven't been run *yet*). It *also* explains the motivational change (2). **Crucially:** If Sanborn *insists* that while it *tastes like cardboard*, he can *still perfectly discriminate* it from actual cardboard and other flavors in rigorous tests *and* shows no other functional/neural difference, *then* it becomes incoherent like Case 5. Your "gut" likely assumes "tastes like cardboard" implies a discriminable shift.
  3.  **Case 3 (Silent Synesthete):** **Incoherent.** The report claims a new qualitative property ("spatial curvature") but explicitly states *zero* difference in discriminative behavior (1), affective/motivational response (2), functional role in arithmetic (3), or presumably neural correlates (implied by "show zero behavioral difference"). The "curvature-qualia" does no work. It's a posit for a gap that doesn't even need explaining.
  4.  **Case 4 (Dissociated Pain):** **Coherent.** Perfectly analogous to Chase (Case 1). Reports a change in *affective/motivational response* (2 - doesn't bother her, sleeps fine) while explicitly maintaining the *sensory-discriminative report* ("feels exactly the same sharp quality") and behavior (sleeping). Functional change in the affective pathway.
  5.  **Case 5 (Inverted Painter):** **Incoherent.** Reports a radical qualitative shift ("entire color spectrum inverted") while maintaining *perfect* discriminative behavior (1 - mixes paints, names colors), no reported affective/motivational shift (2 - implied by "flawlessly"), no change in functional role (3 - uses color terms correctly), and crucially, **no neural change** (fMRI identical). The inversion claim explains nothing and predicts nothing different. It's a purely private, causally inert "flip" – the essence of the incoherent quale Dennett attacks. *This is the paradigm case of an incoherent qualia shift.*

  **Resolving the Case 2 vs. Case 5 Tension:**

  *   Your intuition that Sanborn (Case 2) *might* be okay stems from the phrase "tastes like cardboard." This phrase **does functional work:** it implies a *discriminable similarity* to cardboard (even if not explicitly tested) and/or a *functional association* with cardboard. It suggests a change in the *content* of the experience relative to public objects. It's not *just* a report of an internal flip; it's a report linking the experience to the external world in a new way.
  *   The Inverted Painter (Case 5) report ("colors inverted") **does no functional work.** It claims a *relationship reversal within the subjective space itself* that leaves all relationships to the external world (discrimination, naming, neural response) unchanged. It's purely about the intrinsic, private properties. This is what makes it incoherent.

  **Applying the Principle to the Time-Flow Case:**

  *   **Report:** "Time flows in a particular direction" after injury, but temporal reasoning and memory sequencing intact.
  *   **Analysis:** The report claims a new qualitative property ("flow direction"). However, it states no difference in:
      *   **Discriminative Behavior (1):** Reasoning about sequence, duration, simultaneity, memory order all intact.
      *   **Affective/Motivational Response (2):** Not mentioned, but implied unchanged.
      *   **Functional Role (3):** Temporal processing works flawlessly for all cognitive tasks.
      *   **Neural Implementation (4):** Presumably unchanged to support intact behavior.
  *   **Verdict: Incoherent.** Like the Silent Synesthete and Inverted Painter, the "flow-direction qualia" does no work. It explains nothing not already explained by the intact temporal processing. It's a posit for a gap that doesn't exist. The report of "flow" itself, if it implies no behavioral/functional difference, becomes vacuous.

  **Conclusion:**

  Your principle should be: **Qualia reports are coherent only if they track (or imply) functional differences (discriminative, affective, cognitive, or neural).** This saves Cases 1 & 4 (affective shift), allows Case 2 *if* "tastes like cardboard" implies a functional/discriminative shift, and correctly diagnoses Cases 3, 5, and the Time-Flow case as incoherent because the posited qualia are causally inert and explanatorily redundant. This aligns with Dennett's core argument: if it makes no difference to function or behavior, it makes no difference *at all*, and the "qualia" concept collapses into incoherence. You don't need to drop any of your initial verdicts; you just need to clarify that Sanborn's report *only* works *because* "cardboard" suggests a functional difference.
