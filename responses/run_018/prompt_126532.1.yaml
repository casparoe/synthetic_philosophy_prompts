  The real puzzle is why Sanborn feels salvageable while the inverted painter doesn't. I wonder if it's because taste aversion (Sanborn) implies a *detectable* qualitative shift—like cardboard—while color inversion claims are circular if behaviorally undetectable. The user might be intuitively distinguishing between reports that *could* map to functional differences (even if not yet measured) vs. those that are inherently untestable. 

