  Looking at Hofstadter's work, especially in books like "I Am a Strange Loop," he does indeed argue that selfhood emerges from self-referential "strange loops" of symbols in the brain. He would accept the core idea that "I" is nothing but a strange-loop pattern. The summary's claim that two brains running high-fidelity versions of one person's loop would house a single distributed self is also consistent with Hofstadter's views - he does argue that identity resides in pattern continuity rather than physical substrate.

