  The critics' charge about collapsing identity into information-theoretic duplication is correctly presented as targeting Hofstadter's view. However, Hofstadter would indeed counter that brains lack deeper substrate-level identity - he rejects the notion of a "soul" or essential self beyond patterns.

  There might be a subtle conflation in the summary regarding what constitutes "one distributed self" versus "two copies." Hofstadter emphasizes that for true identity, the patterns must be actively interacting and mutually influencing each other. If the copies run independently without interaction, they would constitute distinct selves rather than one distributed self. The summary doesn't explicitly mention this boundary condition of active linkage.

