answer: |-
  ### The Joke
  The party stares at the GM’s meticulously drawn map showing the "ancient, inevitable" rivalry between the Riverlands and the Stone Kingdom, divided by jagged borders.  
  **GM:** "...and thus, centuries of conflict were cemented by the Treaty of Bleakrock, locking these natural frontiers into—"  
  **Player (interrupting):** Hang on. Last session, Throg the Unwashed found that royal scribe’s diary. It said Bleakrock was just a sheep-grazing hill before the treaty. Why’s it *now* a ‘strategic chokepoint’?"  
  **GM (flustered):** Uh... well... *cough*... remember session three? When Duke Florian botched that persuasion roll trying to bribe the cartographer’s apprentice? Natural 1! The kid panicked, smudged the *real* map, and Florian just... pointed at this random hill to cover his mistake. The apprentice’s ‘authoritative’ copy got sent to the king. Everyone assumed the smudge was a mountain range! By the time they realized, Florian’s rivals had invested fortunes in ‘Bleakrock Pass’ toll fortresses. Too much gold sunk; the error became geography."  
  **Throg:** So... our entire war arc exists ‘cause some duke rolled a 1 trying to slip a kid ten silver?  
  **GM:** Irreversible amplification of an early arbitrary advantage! Now, about those orcs at the *totally intentional* fortress...  

  ### Commentary on the Choices Made  
  **Mechanism Used:** The joke hinges on **sunk costs reinforcing an arbitrary initial outcome**, mimicking QWERTY lock-in or VHS/Beta wars. The botched roll (small contingency) creates a cartographic error. Investment in fortresses around the false "chokepoint" (sunk costs) makes reversing the error economically/politically unviable, locking in borders and conflict.  

  **RPG Framing Rationale:** Using a tabletop RPG instead of standard examples (like QWERTY) achieves three things:  
  1. **Makes Contingency Visceral:** Players directly *experience* the trivial choice (a single die roll) and the GM’s retroactive justification mirrors how historians uncover path dependence.  
  2. **Avoids Well-Trodden Ground:** QWERTY is overused. A D&D session feels fresher while demonstrating the same lock-in dynamics.  
  3. **Highlights "Retcon" Nature:** Path dependence often *feels* like history was inevitable ("natural frontiers"), but RPG framing exposes it as post-hoc rationalization of accidents – the GM scrambling to justify why Bleakrock *now* matters solidifies the core concept.
