  For real resolution, I’d lean toward the user’s "different questions" diagnosis. Formal results (like constraints on partial orders) won’t sway someone who rejects transitivity axiomatically. What’s needed is meta-work: clarifying whether "better than" is a tool for rational choice (demanding transitivity) or a description of value relations (allowing fractures). Empirical psychology could help here—do humans *actually* treat distant comparisons as transitive? If not, insisting on transitivity might be descriptively bankrupt. 

