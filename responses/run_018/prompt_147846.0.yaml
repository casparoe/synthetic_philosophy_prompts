answer: |-
  **Bottom Line:** Prioritize **decision rules under branching uncertainty**. Solving how agents should act when self-locating uncertainty interacts with branching timelines unlocks ethical weighting and clarifies temporal parts without needing a full personal identity theory first.

  **Dependency Map:**

  1.  **Upstream & Highest Leverage (Focus Here):**
      *   **Decision Rules in Branching Anthropics:** Define rational action (e.g., betting, resource allocation) for agents with split temporal parts (like Beauty's awakenings) under uncertainty. Does "I" represent the whole person-stage or a specific branch? *Solving this directly informs ethical weighting and is tractable via modified game/decision theory.*
      *   **Temporal Parts & Credence Updates:** How does treating awakenings as distinct temporal parts change belief updating upon learning "it's Monday"? *Requires clarifying decision rules above; tractable with probability/decision theory tools.*

  2.  **Downstream (Requires 1 & 2):**
      *   **Ethical Weighting Across Branches:** How should credences in *being* a specific awakening (e.g., Monday-B) translate to moral weight for experiences on that branch? *Depends entirely on the decision-theoretic framework established.*

  3.  **Overrated/Blocked:**
      *   **Full Personal Identity Theory:** Often invoked but not strictly *necessary* for initial decision/ethics models in stylized cases. Can be deferred.
      *   **Pure Credence Resolution (Halfer/Thirder):** Stalemated; progress lies in moving to action/decision consequences within branching.

  **Why 3 Years Here?** Decision rules are the operational bottleneck. Unlocking them makes ethical weighting concrete and provides testable frameworks, avoiding metaphysical quicksand while yielding practical guidance for anthropic decision-making.
