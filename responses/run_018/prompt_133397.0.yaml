  Scenario Text (one paragraph):
  At Metropolitan Hospital, the "Women in Surgical Leadership" cohort is a peer-nominated group designed to address gender barriers in surgery. Membership requires continuous revalidation via confidential peer attestation, where existing members nominate others based on perceived shared experiences of systemic barriers faced by women in the field. The registry contains no biological data, only records of social recognition. Dr. Lee, a longstanding member, is revealed through an unrelated genetic test to have XY chromosomes, which she was unaware of. The board must decide whether to remove Dr. Lee or dissolve the cohort. Despite her history of contributions and peer recognition, a biological essentialist argues she must be excluded because she lacks XX chromosomes, while a social constructionist insists the cohort's integrity depends on maintaining the boundary defined by collective peer recognition of shared barriers, regardless of chromosomal status.

  Flipped Feature:
  The usual rigidity/fluidity is flipped: the constructionist defends a hard boundary (keeping Dr. Lee out of the cohort if she wasn't nominated or removing her if the peers no longer recognize her shared barriers? Actually, note: the scenario says she is a longstanding member and the peers have recognized her. The essentialist wants her removed because of biology. The constructionist, in this setup, would defend the existing peer-based boundary and thus argue she remains because she has been continuously recognized by peers. The hard boundary here is the peer attestation: if the peers don't nominate, you're out. But in this case, they have nominated her. So the constructionist says: the boundary is set by peer recognition, and that must be respected even if biology is discovered. The essentialist says: the category is grounded in biology, so if she doesn't have the biology, she shouldn't be in, despite social recognition.

  But note: the essentialist might argue for dissolution because the cohort is now "corrupted" by having a non-XX member. Alternatively, they might just argue for removal. The scenario says: "dissolved or that one specific member should be removed". So we can have both.

  Constructionist Reasoning (why they hold the line):
  The social constructionist argues that the cohort's purpose is to address socially constructed barriers experienced by those recognized as women in surgery, and membership is defined entirely by the ongoing collective peer attestation of shared barrier experiences. Dr. Lee has consistently been attested by peers as sharing these barriers, and her removal would undermine the social basis of the category, reduce the cohort to a biological metric (which the system was designed to avoid), and invalidate the lived experiences of members. The boundary is maintained to preserve the integrity of the social institution and its function in combating gender-based inequities.

  Essentialist Reasoning (why they want dissolution/removal):
  The biological essentialist contends that the cohort is fundamentally about women, which they define by a fixed biological feature (XX chromosomes). Since Dr. Lee lacks this feature, her inclusion is a categorical error that renders the group incoherent. They argue that the cohort should either be dissolved (because it is now "tainted" by her membership and no longer purely biological) or that Dr. Lee must be removed to restore the group's alignment with the biological reality of sex. The social recognition system is seen as flawed because it allows for such deviations from the essential ground.

  Work Feature (the decoupling mechanism):
  The decoupling of collective peer recognition from biological tracking (the registry has no biological data fields) is the key structural feature. It forces the category to operate solely on social attestation, making the institutional kind independent of biological facts.

  Collapse on Removal (what happens if biological tracking is restored):
  If the hospital adds a biological tracking field (e.g., mandatory chromosome testing) and uses it as a membership criterion, the case collapses into the standard debate: the constructionist would oppose the biological requirement as reductive and exclusionary of socially recognized members, while the essentialist would support it as necessary for accuracy.

  Defender Attack (how the essentialist says the case cheats):
  The essentialist attacks the case as unfair by arguing that the peer-attestation system covertly relies on an underlying biological reality (since peers typically assume XX chromosomes when recognizing "women"), and that removing biological tracking creates a false scenario where social recognition is artificially detached from its biological foundation, leading to absurd outcomes like including XY individuals in a "women's" group. They claim the experiment sets up a straw man by ignoring that the social category "woman" is built upon a biological reality, and that the hospital's system is an unrealistic decoupling that doesn't reflect how gender institutions actually function.

