answer: |-
  Below is a reusable 30-minute decision procedure for classifying moral constraints into one of four categories (command-constituted, reason-tracked, hybrid, or misaligned), grounded in the Euthyphro dilemma but operationalized for field use. The checklist includes diagnostic questions, conditions for sufficient answers, stop-points, and flags for unavoidable judgment. Three concrete tests (counterfactual stability, outsider accessibility, and command withdrawal) are embedded without philosophical jargon. The procedure is designed for theologians without formal philosophy training.

  ---

  ### **Decision Procedure: Moral Constraint Classification Checklist**
  **Instructions**: Answer each question in order. Stop if directed. Use the tests as specified. Final classification must align with the answer key.  
  **Time Limit**: 30 minutes per directive.  
  **Outcomes**:  
  - **CCO** (Command-Constituted Obligation): Wrongness created solely by the command (e.g., ritual rules).  
  - **RTO** (Reason-Tracked Obligation): Command tracks independent moral facts (e.g., universal harms).  
  - **Hybrid**: Command codifies a covenantal duty but aligns with accessible reasons (e.g., justice norms with sacred roots).  
  - **Misaligned**: Putative command conflicts with independent morality (e.g., commands causing unnecessary harm).  

  ---

  #### **Checklist Questions**  
  1. **Conflict Test (Misalignment Screen)**:  
     - *Question*: "Does the directive conflict with basic welfare, fairness, or harm prevention, as measured by its impact on vulnerable populations (e.g., refugees, detainees)?"  
     - *Sufficient Answer*:  
       - **Yes** (conflict): If the directive worsens suffering, undermines dignity, or creates injustice when assessed neutrally (e.g., "This rule would trap refugees in debt"). Stop and hand off to theologians.  
       - **No** (no conflict): Proceed to Question 2.  
     - *Stop-Point*: Answer "Yes" → **Misaligned category suspected. Hand to theologians.**  
     - *Judgment Flag*: If conflict is partial or context-dependent (e.g., "It causes harm but only in specific camps"), flag for board review.  

  2. **Counterfactual Stability Test (Without Command)**:  
     - *Question*: "If the command were absent from our traditions, would the act still be morally required/prohibited based solely on its consequences for human well-being?"  
     - *Sufficient Answer*:  
       - **Yes**: Obligation stable without command → Suggests **RTO**. Proceed to Question 3.  
       - **No**: Obligation depends on command → Suggests **CCO** or **Hybrid**. Proceed to Question 4.  
     - *Judgment Flag*: If consequences are unclear (e.g., "Debt relief helps but timing is arbitrary"), flag for team input.  

  3. **Outsider Accessibility Test (Reason-Tracking Check)**:  
     - *Question*: "Can the directive’s moral basis be fully explained to a secular aid worker using only reasons they accept (e.g., harm reduction, fairness, dignity), without referencing revelation?"  
     - *Sufficient Answer*:  
       - **Yes** (fully accessible): → Confirms **RTO**. Proceed to Question 5.  
       - **No** (revelation essential): → Indicates **CCO**. Proceed to Question 5.  
       - **Partial** (reasons exist but are incomplete): → Suggests **Hybrid**. Proceed to Question 5.  
     - *Stop-Point*: Answer "Partial" → **Hybrid likely. Proceed to finalize.**  

  4. **Hybrid Confirmation Test (Covenant-Reason Check)**:  
     - *Question*: "Does the directive reflect a broader moral principle (e.g., justice, compassion) that outsiders recognize, even if its form (e.g., timing, ritual) is tied to a specific covenant?"  
     - *Sufficient Answer*:  
       - **Yes**: Duty blends covenant and reason → **Hybrid**. Proceed to Question 5.  
       - **No**: Duty is purely ritual/relational → **CCO**. Proceed to Question 5.  

  5. **Command Withdrawal Test (Authority Check)**:  
     - *Question*: "If the command were revoked by all traditions, would the obligation still bind field staff due to its inherent effects (e.g., preventing harm)?"  
     - *Sufficient Answer*:  
       - **Yes** (obligation persists): → Confirms **RTO** or **Hybrid** (if covenantal form is non-essential).  
       - **No** (obligation void without command): → Confirms **CCO**.  
     - *Stop-Point*: Answers conflict with prior steps (e.g., stability test "No" but withdrawal "Yes") → **Hand to theologians.**  
     - *Judgment Flag*: If effects are disputed (e.g., "Torture prohibition prevents harm but some traditions permit it in extremes"), flag as unsettled.  

  #### **Answer Key**  
  - **CCO**: Q2 = No, Q3 = No or Partial, Q5 = No.  
  - **RTO**: Q2 = Yes, Q3 = Yes, Q5 = Yes.  
  - **Hybrid**: Q2 = No, Q3 = Partial, Q4 = Yes, Q5 = No.  
  - **Misaligned**: Q1 = Yes (handoff).  

  ---

  ### **Procedure Applied to Directives**  
  #### **(a) Absolute prohibition on torture of detainees**  
  1. **Conflict Test**: No conflict with welfare/fairness (torture universally undermines dignity). → Proceed.  
  2. **Counterfactual Stability**: Without command, torture still prohibited (causes irreversible harm). → **Yes (RTO path)**.  
  3. **Outsider Accessibility**: Basis fully accessible (harm, degradation, corruption of institutions). → **Yes**.  
  4. **Command Withdrawal**: Obligation persists (torture still wrong without command). → **Yes**.  
     - **Classification**: **RTO** (reason-tracked).  
     - **Unresolved Judgment**: Tests cannot settle *why* torture is absolutely wrong if a tradition permits it in "ticking bomb" scenarios. Counterfactual stability (Q2) and command withdrawal (Q5) yield conflicting intuitions: Independent reasons support prohibition, but absoluteness may rely on command. → **Flag for theologian handoff**.  

  #### **(b) Seventh-year debt-release policy in refugee camps**  
  1. **Conflict Test**: No conflict (debt cancellation aids welfare in displacement contexts). → Proceed.  
  2. **Counterfactual Stability**: Without command, debt relief is not required *on a fixed seventh-year cycle* (independent morality supports need-based relief, not calendar-based). → **No (CCO/Hybrid path)**.  
  3. **Outsider Accessibility**: Basis partially accessible (fairness, poverty prevention), but seventh-year timing is revelation-specific. → **Partial**.  
  4. **Hybrid Confirmation**: Yes—reflects justice/compassion principles outsiders recognize. → **Hybrid**.  
  5. **Command Withdrawal**: Obligation for seventh-year release ceases (only need-based relief persists). → **No**.  
     - **Classification**: **Hybrid** (covenantal form tracks independent reasons).  

  #### **(c) Partner-tradition dietary restriction (e.g., no pork) for field kitchens**  
  1. **Conflict Test**: No conflict (no inherent welfare harm; may promote inclusivity). → Proceed.  
  2. **Counterfactual Stability**: Without command, no moral prohibition (pork avoidance lacks independent welfare consequences). → **No (CCO path)**.  
  3. **Outsider Accessibility**: Basis inaccessible without revelation (e.g., holiness codes; health arguments are outdated). → **No**.  
  5. **Command Withdrawal**: Obligation ceases if command revoked (no intrinsic moral weight). → **No**.  
     - **Classification**: **CCO** (purely command-constituted).  
     - **Board Resistance Expected**: Non-adherent staff are outside the covenant; the restriction is not morally binding on them (though voluntary observance may aid cohesion).  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Meta-Theological Disputes Left Untouched**:  
     - Does not resolve whether God’s commands are subordinate to moral facts (e.g., natural law) or define them (e.g., voluntarism).  
     - Cannot adjudicate traditions denying that moral properties exist independently of divine will (e.g., Ash’arī Islam, Ockhamist Christianity). In such cases, the tests systematically misfire:  
       - Counterfactual stability (Q2) and command withdrawal (Q5) become incoherent (no "possible worlds" without divine will).  
       - Outsider accessibility (Q3) may be irrelevant (morality is revelation-dependent).  
     - Avoids debates on revelation’s authority (e.g., scriptural inerrancy vs. contextual interpretation).  

  2. **Operational Limitations**:  
     - Fails when independent morality is contested (e.g., "torture in extremes").  
     - Does not weigh multiple traditions’ inputs (assumes single-command analysis).  
     - Cannot override pragmatic field concerns (e.g., maintaining partner relations despite CCO status).  

  **Final Output**: A clear category (CCO/RTO/Hybrid/Misaligned) with unresolved issues flagged for handoff. For theologians: Use this to scaffold cross-traditional dialogue, not replace it.
