answer: |-
  Here is the toast structured as requested, designed to navigate the philosophical divide while centering your brother's homecoming:

  **1. The constraint**  
  We gather to welcome my brother home—truly home—after years marked by illness and absence. But tonight’s celebration sits within a unique tension. Among us are thinkers holding starkly different convictions about justice itself: one seeing punishment as never truly *deserved* in a cosmic sense, the other seeing deserved consequences as the bedrock of a moral order. This means I cannot stand here and say he has “paid a debt” to society, as if settling some ultimate ledger. Nor can I frame his release as mere chance, erasing the weight of what unfolded. My words must tread carefully.

  **2. The fault line**  
  Their disagreement cuts to the heart of why we punish. One view insists the very idea of personal, backward-looking moral desert—getting one’s *just* punishment—is a profound illusion. Actions arise from complex causes beyond pure will, making the notion of intrinsic, earned suffering incoherent; punishment is only justifiable, if at all, as a future-focused tool. The counter-view argues fiercely that without this anchor of desert, punishment loses its essential moral meaning, collapsing into raw power exercised by the state. To abandon desert, it holds, is to abandon justice itself and the dignity of holding individuals accountable.

  **3. What welcome means here**  
  So, what can we say tonight? We acknowledge the profound seriousness of the institution that held him. Its weight wasn't arbitrary force, nor was it a settling of some pre-existing cosmic debt. It represented society’s structured, albeit imperfect, way of recognizing the gravity of acts and respecting the capacity for agency—even agency constrained by illness. His release isn't about luck erasing responsibility, nor about a debt finally paid. It marks the completion of a process society deemed necessary, a process demanding endurance. Tonight, we step beyond that institutional moment. We welcome him home not because some grand balance sheet is now clear, but because we choose to see the man before us, the brother we love, whose future remains unwritten, and whose place within this circle of care was never truly lost, only suspended. We welcome him back into the fold of our shared lives and shared hope.

  **4. The closing image**  
  So raise your glasses: To my brother—may the open door ahead feel wider than the one that closed behind you, and may this table always be your harbor. Welcome home.
