prompt: |-
  I've been taking this course on democratic theory and my roommate Maya keeps using the phrase 'will of the people' like it's a physics formula or something. We got into it last night after she read some populism stuff for class. She said the Brexit vote was definitely the will — 52%, huge turnout, people actually showed up. Then she said when the Supreme Court struck down that law even though polls said 60% of Americans liked it, that wasn't the people speaking at all, just legal elites talking over them. But then she turned around and said the rent-control march downtown with 30,000 people was absolutely the will, even though the council ignored it and there was never a vote. And she thinks Lula winning by under two percent in Brazil counts, but she said if he'd won by like 0.2% she wouldn't call it that — there's some 'density floor' where it's just noise, not a real will.

  I'm trying to figure out what rule she's actually running, not whether she's right. Could you lay out two or three different principles that could explain all four of her calls? Then here's the new case I'm stuck on: some company builds an AI that reads 10 million user comments and spits out a policy recommendation with 70% agreement, but only like 0.1% of the users actually read the proposal — they just reacted to headlines. Would Maya call that the will of the people? For each principle, say what it predicts about the AI case. Give me your best guess at her actual view with reasoning. And what's one further hypothetical scenario that would actually split these rules apart? I keep writing 'popularism' in my notes by accident so forgive me if I typo'd anything here.
reasoning: |-
  Okay, let me tackle this user's query about Maya's interpretation of the "will of the people." The user describes four cases where Maya applied this concept differently: Brexit (52% vote), SCOTUS overturning a popular law (60% poll support), a rent-control march (30k protesters), and Lula's narrow win (under 2% margin). The user wants to identify consistent principles behind Maya's judgments and apply them to a new AI case. 

  First, I need to unpack Maya's underlying logic. Her Brexit stance values formal majority decisions, but she dismisses hypothetical razor-thin victories (0.2%). The SCOTUS example shows she rejects elite interpretations overriding mass opinion, yet the rent-control march suggests she accepts informal mass mobilization as legitimate even without voting. The Lula case confirms she requires meaningful margins but not necessarily large ones. 

  Three principles emerge:
  1. Intensity + Visibility: She prioritizes active, physical engagement (voting/protesting) over passive polling. Turnout and visibility matter more than mere percentages.
  2. Anti-Elite Gatekeeping: She distrusts institutional intermediaries (courts, councils) that override perceived popular expressions.
  3. Clarity Threshold: Narrow margins or low-engagement inputs (like polls) don't meet her "density floor" for legitimacy.

  For the AI case (70% algorithmic agreement from low-engagement users), each principle would predict:
  - Intensity/Visibility: Likely "no" because users only skimmed headlines.
  - Anti-Elite Gatekeeping: "No" due to corporate mediation.
  - Clarity Threshold: Ambiguous since 70% is high but engagement is shallow.

  My guess? Maya would reject the AI as "will of the people" because it lacks human urgency and feels engineered. To test her principles, I'd propose a hypothetical: 80% support in a legally non-binding referendum with 95% turnout versus 40% support in a general strike. The first has formal clarity, the second has intensity—her choice would reveal which principle dominates.
answer: |-
  Based on your description, Maya seems to be applying a *procedural-populist* framework with elements of **intensity** and **anti-elite gatekeeping**. Here are three distinct principles that explain her judgments, their predictions for the AI case, my best guess at her actual view, and a splitting hypothetical:

  ---

  ### **Three Explanatory Principles**
  1.  **Intensity + Visibility Principle:**
      -   **Core Idea:** "Will of the people" requires *active, visible, and effortful* expression by a significant mass, demonstrating intensity beyond passive opinion. High turnout, physical presence (marches), or overcoming institutional barriers (voting) signal this intensity. Passive polls or narrow margins lack the necessary "density."
      -   **Explains Her Calls:**
          *   **Brexit (Yes):** High turnout + active voting = intense expression.
          *   **SCOTUS (No):** Polls are passive; elites actively overrode potential intensity.
          *   **Rent March (Yes):** Large physical presence = visible, effortful intensity.
          *   **Lula (Narrow Yes/No):** 2% margin shows effortful choice ("density floor" met), but 0.2% is statistical noise (not "real" will).
      -   **AI Case Prediction (70% agreement, 0.1% engagement):** **NO.** Skimming headlines is passive, low-effort, and lacks visible intensity. The AI acts as an elite intermediary.

  2.  **Anti-Elite Gatekeeping Principle:**
      -   **Core Idea:** "Will" exists only when expressed *directly against or outside elite-controlled channels* that can distort or suppress it. Formal institutions (courts, councils, possibly narrow vote counts) are suspect. Mass mobilization bypasses gatekeepers.
      -   **Explains Her Calls:**
          *   **Brexit (Yes):** Direct referendum bypassed Parliament.
          *   **SCOTUS (No):** Court (elite) overrode mass preference.
          *   **Rent March (Yes):** Protest directly confronted council (elite gatekeepers).
          *   **Lula (Narrow Yes):** Electoral win, even narrow, overcomes elite power structures. (A 0.2% win might still count if elites tried to block it).
      -   **AI Case Prediction:** **NO.** The AI is a *corporate-created* elite intermediary. Users didn’t bypass gatekeepers; they fed data *to* one.

  3.  **Clarity Threshold Principle:**
      -   **Core Idea:** "Will" requires a *clear signal* that transcends ambiguity. High turnout/margins or large-scale action provide clarity. Low-engagement methods (polls, low-info voting) or razor-thin margins are "noise."
      -   **Explains Her Calls:**
          *   **Brexit (Yes):** Clear majority + high turnout = unambiguous.
          *   **SCOTUS (No):** Polls are methodologically noisy and non-binding.
          *   **Rent March (Yes):** Scale (30k) provides clear signal despite no vote.
          *   **Lula (Narrow Yes/No):** 2% is clear enough; 0.2% is noise.
      -   **AI Case Prediction:** **AMBIGUOUS/LIKELY NO.** 70% seems clear, but 0.1% engagement and headline-skimming introduce massive noise and ambiguity about true understanding/commitment.

  ---

  ### **The AI Case Prediction Summary**
  *   **Intensity + Visibility:** → **NO** (Lacks effort/visibility).
  *   **Anti-Elite Gatekeeping:** → **NO** (AI is corporate elite mediator).
  *   **Clarity Threshold:** → **LIKELY NO** (Engagement too low, input too noisy).

  ---

  ### **Best Guess at Maya's Actual View (& Reasoning)**
  **Maya would say the AI does NOT represent the "will of the people."**  
  **Reasoning:** She likely combines **Intensity + Anti-Elite Gatekeeping**. The AI case fails spectacularly on both:
  1.  **Zero Intensity/Visibility:** Reacting to headlines is the *epitome* of passive, low-effort, non-visible engagement. It lacks the physicality of a march or the deliberative act of voting.
  2.  **Elite-Created Mediation:** The AI is built and controlled by a corporation – a quintessential elite gatekeeper. Users didn’t express their will *to power*; they fed fragmented data *into a corporate algorithm* that then claims to speak *for* them. This is worse than SCOTUS overriding polls; it’s an elite *constructing* the "will."
  3.  **Clarity Doubt:** The 0.1% engagement and headline-skimming would make her deeply skeptical about the "70%" figure representing a clear, understood preference.

  **Her Core Framework:** Maya values **unmediated popular energy expressed against power structures with tangible effort**. Formal processes (votes) are valid only if they demonstrate this energy (high turnout/margin). Informal processes (protests) can substitute if sufficiently massive. Elites interpreting or shaping preferences invalidate the "will."

  ---

  ### **Hypothetical Scenario to Split the Principles**
  **The Scenario:** A *non-binding, government-run* online referendum on a major issue achieves **80% support with 95% verified voter turnout**. However, voting required only clicking "Yes/No" after reading a simple, neutral 3-sentence summary. Simultaneously, a **physical general strike demanding the opposite policy** paralyzes key industries for a week, supported by polls showing only **40% public approval** for the strike's goal, but involving millions visibly participating.

  *   **Intensity + Visibility Principle:** → **STRIKE** is the "will." Physical, disruptive action by millions demonstrates far greater intensity and visibility than an easy online click, regardless of the formal referendum's result.
  *   **Anti-Elite Gatekeeping Principle:** → **STRIKE** is the "will." It directly challenges elites outside their formal (even if popular) process. The referendum, while popular, is still an elite-sanctioned channel.
  *   **Clarity Threshold Principle:** → **REFERENDUM** is the "will." 80% support on 95% turnout is an overwhelming, unambiguous signal. The strike represents intense action, but only by 40% (or less) of the populace, making it a loud minority, not the clear "will."

  **This splits the rules:** Intensity picks the strike, Anti-Elite picks the strike, Clarity picks the referendum. Maya's likely prioritization of Intensity/Anti-Elite suggests she'd side with the strike despite the referendum's formal clarity.
