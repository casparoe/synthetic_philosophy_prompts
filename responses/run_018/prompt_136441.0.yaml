answer: |-
  Here is a comprehensive specification sheet for a metaethical theory, structured around your requirements, incorporating normative inertia, and evaluating core positions:

  **Rigorous Desiderata for an Adequate Metaethical Theory**

  **I. Core Phenomena Requiring Explanation (The "What")**
  1.  **First-Order Moral Disagreement:**
      *   **Motivation:** Persistent, fundamental disagreements on core issues (e.g., abortion, euthanasia, distributive justice) despite shared facts and reasoning skills. Requires distinguishing genuine moral conflict from mere semantic or factual disputes.
      *   **Non-Negotiable:** Yes. Any theory must engage with the *appearance* of fundamental conflict.
  2.  **The Phenomenological Authority of Obligation:**
      *   **Motivation:** The distinct "must-do/must-avoid" feel of moral demands, experienced as categorically binding (independent of desires) and overriding other considerations. The sense that "I *ought* to do this, even if I don't want to."
      *   **Non-Negotiable:** Yes. Capturing the *experience* of normativity is central.
  3.  **The Appearance of Moral Progress:**
      *   **Motivation:** The widespread intuition that societies have morally improved over time (e.g., abolition of slavery, expansion of rights). Requires explaining how later judgments can be *better* than earlier ones without merely reflecting changing preferences.
      *   **Non-Negotiable:** Highly Desirable (Widely held intuition crucial for practical engagement). *Camp Preference:* More critical for realist/objectivist-leaning theories.
  4.  **Normative Inertia:**
      *   **Motivation:** Agents retaining specific moral commitments even after conceding the original evidence/rationale is flawed (e.g., maintaining prohibition on eating dogs due to deep-seated revulsion after acknowledging cultural relativity; clinging to pacifism after rejecting the theological basis).
      *   **Requirement:** Account for this *without* dismissing it as simple irrationality *or* post-hoc rationalization ("hidden rationality"). Must explain the psychological *stickiness* and source of persistence.
      *   **Non-Negotiable:** Yes (Your specified constraint).
      *   **Theoretical Lean:** Orthogonal in principle, but potentially favors **Anti-Realist/Constructivist** frameworks (grounding inertia in psychological/social mechanisms like habituation, emotional salience, or social identity) or **Ecological/Neo-Aristotelian Realism** (linking to deeply ingrained character traits). Challenges robust realist views relying solely on abstract rational grounds.

  **II. Essential Distinctions to Preserve (The "How")**
  5.  **Genuine Moral Reason vs. Motive Alignment:**
      *   **Motivation:** Distinguish "I have a reason to help *because it's the right thing to do*" from "I want to help *and* helping happens to be right." The theory must ground reasons that are genuinely normative, not merely descriptive of motivational states.
      *   **Non-Negotiable:** Yes. Core to the normativity of morality. *Camp Preference:* Paramount for Kantian, non-naturalist realist, and some constructivist views; potentially less critical for thoroughgoing subjectivist/humean views (which may collapse the distinction).
  6.  **Prescriptive Force vs. Descriptive Anthropology:**
      *   **Motivation:** While moral judgments vary culturally, morality is experienced as *prescriptive*, not merely descriptive of local practices. The theory must avoid reducing "ought" to "is" (local custom). Must explain *why* we feel bound by *our* morality, not just observe others'.
      *   **Non-Negotiable:** Yes. Fundamental to the domain of ethics.

  **III. Consistency Conditions (The "Fit")**
  7.  **Compatibility with Moral Psychology:**
      *   **Motivation:** Acknowledge findings like the primacy of intuition/emotion in moral judgment (Haidt), framing effects, and situationist influences on behavior.
      *   **Non-Negotiable:** Yes. Cannot contradict well-established empirical facts.
  8.  **Accounting for Cross-Cultural Variation:**
      *   **Motivation:** Significant differences exist in concrete moral norms across cultures/historical periods. The theory must explain this variation *without* collapsing morality *entirely* into descriptive cultural relativism (preserving distinction #6).
      *   **Non-Negotiable:** Yes. An empirical constraint.

  **IV. Suspected Tensions & Non-Negotiables**
  *   **Primary Suspected Tension: Authority vs. Disagreement/Inertia:**
      *   **Concern:** Can a theory robustly vindicate the categorical, objective-seeming *authority* of moral demands (Phenomenon #2, Distinction #5) while fully acknowledging the *depth* and *persistence* of fundamental disagreement (Phenomenon #1), significant cross-cultural variation (Condition #8), and the *inertia* of commitments surviving their original rationale (Phenomenon #4)? Theories strong on authority (e.g., Robust Realism) often struggle with disagreement/variation/inertia. Theories explaining disagreement/variation/inertia well (e.g., Expressivism, some Constructivisms) often struggle to vindicate full authority without qualification.
  *   **Non-Negotiable Conditions:** 1, 2, 5, 6, 7, 8, and your constraint 4 (Normative Inertia).
  *   **Camp-Specific Preferences:** The *strength* of vindication for Phenomenon #3 (Progress) and the *precise interpretation* of Distinction #5 are often camp-specific. Robust realists demand strong objectivity and mind-independence; constructivists may accept a different grounding for reasons/progress.

  **V. Brief Evaluations Against Full Specification**

  1.  **Error Theory (e.g., J.L. Mackie):**
      *   **Strengths:** Excellently explains deep disagreement (#1) and cross-cultural variation (#8) as resulting from systematic error. Compatible with moral psychology (#7) showing non-objective origins. Acknowledges the *appearance* of authority (#2), inertia (#4), and progress (#3), though explaining their persistence is challenging.
      *   **Weaknesses:** **Fails catastrophically** on preserving genuine moral reasons (#5) and prescriptive force (#6) – it denies they exist. Explains the *phenomenology* of authority and inertia but denies their veridicality. Offers no robust account of genuine moral progress (#3) beyond changing false beliefs. Normative inertia becomes puzzling irrationality.
      *   **Verdict:** Fails core non-negotiables (#5, #6).

  2.  **Constructivism (e.g., Korsgaard, Scanlon - procedure-focused):**
      *   **Strengths:** Explains disagreement (#1) as failure of ideal procedure or differing inputs. Grounds reasons (#5) in (idealized) agency. Explains prescriptive force (#6) as constitutive of practical reason. Can account for progress (#3) via improved procedures/understanding. Can accommodate variation (#8) via differing contexts/values feeding procedures. Can explain inertia (#4) via deep-seated practical identities/commitments formed by the procedure.
      *   **Weaknesses:** Struggles to vindicate the *full categorical authority* (#2) – is the bindingness only for agents committed to the procedure? Risks collapsing into relativism if procedures are too context-dependent (#6, #8). Explaining *why* the procedure yields *these* specific results authoritatively can be circular. Authority may feel contingent on valuing rationality.
      *   **Verdict:** Strong contender, handles inertia well. Potential weaknesses on robust authority and avoiding relativism.

  3.  **Robust Non-Naturalist Realism (e.g., Parfit, Enoch, Shafer-Landau):**
      *   **Strengths:** Vindicates genuine moral reasons (#5) as objective, mind-independent facts. Best captures categorical authority (#2) as deriving from these facts. Provides a strong ground for moral progress (#3) – better approximating moral truth. Preserves distinction from anthropology (#6). Can be compatible with moral psychology (#7) (e.g., intuition as fallible access).
      *   **Weaknesses:** Profoundly challenged by deep disagreement (#1) and variation (#8) – why such persistent error if the facts are accessible? Struggles immensely with **normative inertia (#4)** – if the *rational grounds* are undermined, clinging to the commitment seems irrational (contrary to requirement). Epistemology of accessing non-natural facts is contentious. Authority can seem mysterious ("queerness").
      *   **Verdict:** Strong on authority, reasons, and progress. Weakest on disagreement, variation, and *especially* your normative inertia constraint.

  **Summary for Hybrid Framework Development:**

  Your specification demands a theory that:
  1.  **Explains** deep disagreement, felt authority, apparent progress, and normative inertia.
  2.  **Preserves** the normativity of reasons and the prescriptive/descriptive gap.
  3.  **Fits** the psychology of judgment and cross-cultural data.
  4.  **Navigates the Core Tension:** Reconciling the felt objectivity/authority of morality with its manifestly variable, psychologically embedded, and sometimes stubbornly persistent nature (inertia after rationale loss).

  The evaluations highlight the difficulty: Robust realism stumbles on disagreement/inertia/variation; error theory abandons normativity; constructivism risks relativism or attenuated authority. **Normative inertia (#4) emerges as a particularly potent challenge for traditional realism and a potential strength for constructivist or psychologically grounded approaches.** Your hybrid framework must directly address this tension, likely requiring elements that ground normativity *in* or *through* features of agency, sociality, or psychology *without* collapsing into subjectivism or relativism, while finding a plausible epistemology that accommodates disagreement and inertia. The distinction between possessing a reason and motive alignment (#5) remains a crucial litmus test for preserving normativity.
