  This is a complex philosophical question about scientific methodology. I need to break it down into several components as requested: (a) whether Friedman intended his argument to cover both types of idealizations, (b) whether the decorative vs. load-bearing distinction is philosophically valid, (c) whether real-world models actually separate cleanly along this line, and (d) whether predictive accuracy only validates decorative idealizations.

