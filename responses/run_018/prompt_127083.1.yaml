  For (b), the decorative vs. load-bearing distinction seems philosophically sound to me. The difference between mere computational conveniences and core causal mechanisms is a real one in scientific practice. I'd give this 0.7 probability.

  For (c), I'm more skeptical about whether real-world models separate cleanly along this line. In practice, many assumptions blend both aspects or the distinction becomes blurry during model development. I'd assign only 0.4 probability here.

  For (d), I doubt predictive accuracy only validates decorative idealizations. We often see models with "fictional" core mechanisms that still predict well, which suggests predictive success can sometimes validate load-bearing elements too. I'd give this 0.3 probability.

  Combining these probabilities multiplicatively (since all need to be true for the original claim), I get 0.8 × 0.7 × 0.4 × 0.3 ≈ 0.067. Since Friedman's argument might still partially hold even if not all conditions are perfectly met, I'll round up to about 0.1.

